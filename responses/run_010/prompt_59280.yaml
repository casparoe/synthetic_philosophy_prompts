prompt: |-
  For about two years I have been keeping a list of my own judgments about when it is right to keep feeding a losing enterprise, and I have come to suspect that the standard prescription — ignore what is already spent, evaluate only the next increment against its own prospects — does not so much explain my judgments as leave them unsorted. The list began at a game night where we ran the dollar auction: a hundred-dollar prize, five-dollar increments, the high bidder pays and collects, the runner-up pays and gets nothing. I want to know what principle, if any, captures the pattern below, and where the pattern has to be broken rather than preserved.

  My verdicts. (i) In the plain dollar auction, sitting at $60 against an opponent at $55, I should bid $65: folding converts a bad position into a certain $60 loss, whereas bidding at least buys the chance that the other player quits. (ii) Before play, the house offers, for one dollar, an exit ticket redeemable once at any later point — hand it over and you recover everything you have bid minus ten dollars. Buying the ticket is plainly correct at that price and almost nobody buys it; and I think that if both players hold tickets, the war never gets off the ground. (iii) In a variant where a third party has agreed to reimburse the runner-up's entire outlay, I fold at $60 without a second thought, which strikes me as strange, since my forward-looking position at $60 is unchanged and only the terms of my exit have improved. (iv) A friend's company has spent eighteen months and two million dollars matching a rival's discounts; the rival has the smaller war chest. He should keep going — and I would add that the two million already sunk is part of *why* keeping going works, because it is what has convinced the rival that he will not stop. (v) My own case against a former partner: eighty thousand dollars already spent, counsel says thirty thousand more gets to trial, expected recovery around fifty. I should take the settlement, even though the arithmetic of the next increment favors continuing. (vi) In a bad year I doubled down on a position that kept falling and eventually got out whole. I thought it was right then and I still think it was right. (vii) In a salary negotiation I refused to move for three weeks although I would have accepted their opening number on day one; that was right, because caving early teaches them that my first figure is decorative, and the lesson compounds across every negotiation we will ever have. (viii) My brother and I have not spoken for four months over something said at a funeral, each waiting for the other to apologize first; that is wrong, and obviously wrong, even though every clause of my reasoning in (vii) seems to apply here unchanged. (ix) A friend six years into a funded, well-regarded doctoral program, who dreads the work and has two chapters she is proud of, should quit.

  My own attempt at a principle is this: escalation is permissible exactly when, before entering, you fixed a bound on what you would spend and a condition under which you would walk away, and impermissible when each round looks locally cheap but no such rule exists. I already see trouble — it condemns (i), which I endorsed, and it seems to bless (vi), which I half-suspect is bad reasoning wearing a good outcome. So: give me the best account you can, whether that means repairing mine or replacing it, stated precisely enough that someone who does not share my intuitions could apply it to a new case without asking me anything. For each clause, tell me which of the verdicts above it exists to capture. Then tell me what it says about cases I have not listed — a startup pivoting after burning most of its runway, a government continuing a war whose original justification has quietly changed, someone staying in a marriage chiefly because of the years already invested, a research program that keeps absorbing anomalies rather than conceding them, a company repurchasing its own fallen stock. Say frankly which of my nine verdicts the account cannot accommodate and why I should give them up, and treat (vi) and the (vii)/(viii) pair explicitly: is there anything that separates a bargaining stance toward a negotiating counterpart from the identical stance toward a brother, or is my verdict in (viii) simply inconsistent? Finally, I would like a direct answer on whether the irrelevance of sunk costs survives as a normative principle at all, given that in (iv) the money already spent appears to be doing genuine strategic work — is that a real counterexample, or a misdescription of what is carrying the weight there?
reasoning: |-
  Okay, let me start by unraveling this user's query. They've been compiling a list of judgments over two years, challenging the standard sunk cost advice. The core issue is that the "ignore sunk costs" principle doesn't fully explain their decisions. They want a unified principle that captures their nine verdicts and can be applied to new cases.

  First, I need to break down each verdict. The user provides scenarios from dollar auctions to personal disputes. Each case seems to have a common thread: the sunk costs aren't just past expenses but signals affecting future behavior. For example, in verdict (iv), the sunk cost convinces the rival of commitment, making continuation strategic. 

  Then there's the exit ticket in (ii). Buying it is rational because it provides an exit option, altering the game's dynamics. But in (iii), reimbursement changes nothing forward-looking, yet the user folds immediately. Why? The sunk cost here doesn't affect the opponent's perception, so exiting is better. 

  The user's own principle about pre-commitment has issues. It condemns their decision in the dollar auction (i) but endorses (vi), which they're unsure about. So the challenge is finding a principle that explains when sunk costs matter strategically versus when they're traps.

  Looking at (vii) and (viii), both involve holding out in negotiations. But with the brother, it's wrong. The difference might be relational versus transactional contexts. In business, reputation affects future interactions; with family, relational costs outweigh winning. 

  Verdict (ix) about quitting a PhD program is tricky. The sunk cost (six years) shouldn't dictate staying, but the user thinks quitting is right. Here, future costs (dread, opportunity cost) outweigh past investments. 

  The user also asks about sunk costs' irrelevance. In (iv), sunk costs work as commitment devices, which isn't a counterexample but a strategic use. The normative principle still holds for direct costs but not for signaling. 

  Synthesizing this, the key might be distinguishing between signaling value and mere loss avoidance. When sunk costs influence others' expectations (like in auctions or price wars), they matter. When they only affect personal loss aversion (like the lawsuit or PhD), ignoring them is better. 

  For the brother versus negotiation case, the principle must differentiate between repeat transactional interactions and personal relationships. Holding out in business builds reputation; in family, it damages relationships irreparably. Hence, the same tactic is wrong with the brother. 

  Cases like the startup pivot or war continuation depend on future prospects versus sunk costs. If pivoting uses remaining resources better, it's right. For war, changing justifications might mean sunk costs are driving persistence irrationally. 

  The user might need to give up verdict (vi) if it's outcome-biased. Doubling down on a failing position could be irrational despite the lucky recovery. The principle should emphasize decision quality over outcomes. 

  Overall, the sunk cost irrelevance holds normatively, but sunk costs can have strategic value in competitive dynamics. The new principle needs to account for signaling and relational contexts explicitly.
answer: |-
  Here's a precise, actionable principle designed to capture your intuitions while resolving the tensions in your examples:

  **Principle of Contextual Irrelevance & Strategic Signaling (CISS):**  
  *Abandon a course of action when expected future costs exceed expected future benefits, unless sunk costs credibly alter others' expectations about your behavior in a way that improves your net position. Sunk costs themselves are never valid justification; their only permissible influence is as commitment devices that strategically shape opponents' actions.*

  ---

  ### **I. How CISS Captures Your Verdicts**
  **(Clauses keyed to your numbering):**

  1.  **Captures (i) Dollar Auction ($60 vs $55):**  
      *Rationale:* Bidding $65 isn't justified by the $60 sunk cost. It's permitted because your prior spending *signals resolve* to opponents. Folding guarantees a $60 loss. Bidding $65 risks $5 more for a >$100 gain (if opponent folds) and avoids the $60 loss. The sunk cost is irrelevant *except* as a signal you might bid again.  
      *CISS Link:* Sunk costs ($60) signal commitment, altering the opponent's calculation. Future benefit (winning $100 vs losing $5 more) outweighs future cost *because* of this signaling effect.

  2.  **Captures (ii) Exit Ticket:**  
      *Rationale:* Buying the ticket is rational pre-commitment. It creates a *credible exit option*, destroying the signaling value of sunk costs. Opponents know you won't escalate irrationally, making early bids non-credible threats.  
      *CISS Link:* The ticket eliminates the *strategic signaling value* of sunk costs, preventing escalation. Sunk costs remain irrelevant to the future cost/benefit calculation.

  3.  **Captures (iii) Reimbursed Runner-Up:**  
      *Rationale:* Folding is correct. The reimbursement changes *nothing* about future costs/benefits or signaling. Your $60 is sunk regardless. Bidding $65 still risks $5 for a chance at $100, *but* the opponent knows you can exit cost-free, destroying your commitment signal. They are *more* likely to bid again.  
      *CISS Link:* Reimbursement removes the strategic signaling value of your sunk costs (you have less to lose by folding), making escalation *less* effective. Future cost/benefit alone doesn't justify $65 risk if opponent is likely to counter.

  4.  **Captures (iv) Price War:**  
      *Rationale:* Continuing is justified *only* if the sunk cost ($2M) credibly signals resolve to the rival (smaller war chest), making them more likely to fold *soon*. The sunk cost isn't a reason; it's a tool shaping the rival's expectations.  
      *CISS Link:* The sunk cost functions purely as a *strategic signal*, altering the rival's behavior. Future benefit (winning market share) outweighs future cost *because* the signal increases the probability of rival collapse.

  5.  **Captures (v) Lawsuit ($80k sunk, $30k more, $50k expected):**  
      *Rationale:* Settle. Future cost ($30k) > expected future benefit ($50k recovery *minus* the $80k already gone is irrelevant; the $50k is the *future* benefit against the $30k *future* cost). Sunk costs signal nothing strategically advantageous here (opponent isn't folding based on your legal spend).  
      *CISS Link:* Pure future cost/benefit analysis: -$30k net expected outcome. No credible signaling value from sunk costs justifies deviating.

  6.  **Captures (ix) PhD Student:**  
      *Rationale:* Quit. Future costs (dread, time, opportunity cost) vastly exceed future benefits (degree value). Sunk costs (6 years, funding) signal nothing strategically beneficial to anyone (advisor? job market?) that outweighs the future misery and cost.  
      *CISS Link:* Negative future net benefit. Sunk costs lack strategic signaling value in this context.

  ---

  ### **II. How CISS Handles (vi), (vii), and (viii)**
  *   **(vi) Doubled Down & Got Out Whole:**  
      *CISS Assessment:* **Likely Condemned (unless signaling existed).** This resembles outcome bias. If doubling down meant future costs > expected future benefits *at the time*, and there was no credible signaling benefit (e.g., scaring off other sellers?), it was irrational. The good outcome doesn't validate the decision. *You should give this verdict up* – it confuses luck with good strategy. CISS prioritizes decision quality over results.
  *   **(vii) Salary Negotiation Holdout:**  
      *CISS Assessment:* **Justified.** Future cost (3 weeks without salary) < Expected future benefit (higher salary *plus* establishing reputation for resolve impacting *all future negotiations*). Sunk costs (time spent waiting) signal commitment, altering the employer's expectations favorably long-term. *This is strategic signaling.*
  *   **(viii) Brother Feud Holdout:**  
      *CISS Assessment:* **Condemned.** While structurally similar to (vii), the context differs critically:  
      1.  **Relationship vs Transaction:** Negotiations are repeated transactional games where reputation matters. Family is a long-term relational bond where "winning" a single dispute via signaling often inflicts net relational damage exceeding any strategic benefit.  
      2.  **Negative-Sum Dynamics:** Holding out damages the relationship itself (a shared future asset), unlike salary talks which are purely distributive. The "cost" isn't just time/apology; it's erosion of trust/affection.  
      3.  **Signaling Misfire:** Signaling "resolve" here signals stubbornness/indifference, harming future cooperation, unlike signaling "value" in salary talks.  
      *CISS Conclusion:* Future costs (relational damage, ongoing hostility) > any future benefit from "winning" the apology. Sunk costs (4 months silence) signal harmful traits, not valuable resolve. **Your verdicts are consistent:** CISS distinguishes relational bonds from transactional negotiations. (vii) builds valuable reputation; (viii) destroys valuable relationships.

  ---

  ### **III. Applying CISS to New Cases**
  1.  **Startup Pivoting:** *Pivot if expected future value of new path > expected future cost of pivot. Ignore sunk runway. Exception:* If prior burn *credibly signals* unwavering commitment to *potential investors/customers* in a way crucial for the pivot's success, that signaling value factors into the future benefit of pivoting *now*.
  2.  **War Continuation:** *Stop if expected future cost (lives, money) > expected future benefit (achievable goals). Ignore sunk costs. Exception:* If sunk costs (e.g., past sacrifices) *credibly signal* unwavering national resolve to the enemy, making their surrender more likely *and* this benefit outweighs future costs, continuation *might* be justified *solely* due to the signaling effect. Changed justification invalidates this unless the new goal's benefit justifies *future* costs.
  3.  **Staying in a Bad Marriage (Sunk Years):** *Leave if expected future unhappiness > expected future benefit of staying. Ignore sunk years.* Sunk years signal nothing strategically beneficial to the spouse that improves your net position; they often create harmful resentment. Staying solely due to sunk years violates CISS.
  4.  **Research Program Absorbing Anomalies:** *Abandon if expected future cost (resources, time) > expected future benefit (plausible breakthrough). Ignore sunk effort. Exception:* If prior investment *credibly signals* the program's potential to *funders/peers*, securing essential future resources, that signaling value is part of the future benefit calculation.
  5.  **Company Repurchasing Fallen Stock:** *Repurchase only if expected future value of the stock (based on fundamentals) > repurchase price. Ignore sunk loss on existing holdings.* Repurchasing to "signal confidence" is only valid if that signal *credibly* alters stakeholder behavior (e.g., prevents panic selling, secures loans) in a way that generates net future value exceeding the repurchase cost. Doing it solely because the stock is "cheaper than before" violates CISS.

  ---

  ### **IV. Verdicts CISS Cannot Accommodate & Why To Give Them Up**
  *   **(vi) Doubled Down & Got Out Whole:** CISS condemns this unless a credible signaling mechanism existed *at the time of the decision*. You suspect it was "bad reasoning wearing a good outcome." CISS agrees. **Give it up:** It conflates outcome with decision quality. Rational decisions are based on expectations *before* the outcome is known.
  *   **(iii) Folding When Reimbursed:** You find it "strange." CISS explains it clearly: reimbursement destroys the signaling value of your sunk costs, making escalation futile. Your intuition likely conflates the *psychological* impact of sunk costs (loss aversion) with strategy. CISS resolves the strangeness by highlighting the *strategic* impact of the reimbursement rule. **Keep the verdict, accept CISS's explanation.**

  ---

  ### **V. The Irrelevance of Sunk Costs: Does it Survive?**
  **Yes, absolutely, as the core normative principle.** CISS preserves its essence:

  1.  **Sunk Costs Themselves are Irrelevant:** They are gone. No decision can recover them. They should never *directly* factor into the "continue/quit" calculation.
  2.  **(iv) is NOT a Counterexample:** You note the sunk cost "appears to be doing genuine strategic work." CISS agrees, but clarifies *how*: **It's not the sunk cost *per se* that matters, but the *information it credibly conveys* (resolve, commitment) to rivals.** The sunk cost is a *tool* for signaling, not a *reason* for continuing. The *reason* is the *future benefit generated by the altered behavior of the rival*.
  3.  **The Refinement:** Sunk costs are normatively irrelevant *as costs to be recovered*. Their *only* permissible relevance is *instrumental*: when they function as credible commitment devices that strategically alter others' expectations and actions, thereby changing the *future* cost/benefit landscape. This is a sophisticated application of game theory, not an abandonment of sunk cost irrelevance.

  **In essence:** *Ignore sunk costs as recoverable losses. Leverage them only as credible signals if, and only if, that signaling demonstrably improves your expected future net position.* This preserves the principle's rationality while accounting for strategic interaction. Your case (iv) is a valid application of signaling, not a counterexample to the core irrelevance doctrine.
