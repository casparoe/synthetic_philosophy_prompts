prompt: |-
  I chair the disciplinary panel at a medium-security prison — three of us, a deputy governor, a wing manager and me, none of us lawyers — and we run about thirty adjudications a month, twenty minutes a case, after which we have to fill in a template certifying that the sanction was necessary and proportionate and then write one paragraph of reasons in plain English that the man himself will read and that a reviewer might check six months later. Our range is loss of privileges, days added to the earliest relase date, cellular confinement for up to a few days, and referral out for treatment. An audit just found that two panels in this same prison gave wildly different sanctions for near-identical charges, and the governor has asked me to write us a proper decision procedure. That part I can do. The part I can't do is that over the last year I've been talked into free will skepticism — I read the Caruso/Dennett debate book and came out on Caruso's side, which for me means something like his public-health/quarantine picture: nobody deserves to suffer in the basic-desert sense, what we're entitled to do is limited to what's needed to prevent harm, in its least restrictive form, with proportionality acting as a ceiling rather than a target. Two of my three panelists are Dennett's people without having read him: responsibility is a social practice, free will is a set of competences that get cultivated by being held to standards, censure is a message addressed to a person and not a technique applied to a mechanism, and a panel that never says you earned this is treating the men like weather to be managed. I don't want to relitigate that in the room every fortnight.

  So write me a decision procedure for a single adjudication that a panelist who's never heard of either philosopher could actually run in twenty minutes: the questions to ask in strict order, what counts as a sufficient answer to each, the points where the procedure stops at no sanction, the points where it stops at a ceiling, and the points where it explicitly hands the decision over to judgment because the question is about values rather than facts. It has to be honest about admissibility — spell out which considerations come in at each step and which are barred and why, so that "he deserves days for that" gets either routed somewhere legitimate or refused outright instead of sneaking in dressed up as a risk judgment. And it needs to be one procedure both camps can use: where a skeptic and a compatibilist running the same steps would land on different sanctions, or the same sanction for incompatible reasons, mark the divergence and give me a tie-break rule (does the chair get a casting vote, does the less restrictive reading win by default, does it go to the governor?). Give me the thing as a one-page card a panel could laminate, plus the reasoning behind the card — no reading list, I've got the books.

  Then run it on three cases and show the panel's working, not just the verdicts. (1) A man with fourteen months clean and working in the kitchen throws a pan of hot water at an officer during a cell search that destroyed photos of his daughter; the officer isn't badly hurt but won't come back onto the wing, and half my panel wants the maximum days. (2) A man with no charges against him in two years who quietly refuses every accredited programme and tells new arrivals the programmes are a con; the wing manager wants to book him for failure to comply, and the real case for sanctioning him is that his refusal is contagious. (3) Three men on the same wing separately refused to return to their cells during a lock-up and the wing is deteriorating, and I want one of them to take a heavier sanction to send a message. For each: the output, then what the other framework would have said about the same facts, and I want at least one of the three to come out in a way I personally will hate — better I find out now than in front of the governor. Finally tell me what the procedure can't do: where it'll still be inconsistent between panels, where it lets the regime's own effects get laundered into a risk number (boredom, crowding, the fact that dangerousness in here is partly manufactured in here), and which of its steps are judgment calls wearing a procedure's clothes.
reasoning: |-
  We are designing a decision procedure that can be used by both free will skeptics (Caruso's public health/quarantine model) and compatibilists (Dennett's social practice model) without requiring philosophical debate during adjudications. The procedure must be executable in about 20 minutes, produce a necessary and proportionate sanction (or none), and include a plain English paragraph of reasons. It must explicitly route or bar considerations of desert and handle the divergence between the two views.

  Key principles for the procedure:

  1. **Skeptic View (Caruso)**: Sanctions are only justified by the goals of prevention (protecting others, the prisoner, and the public), rehabilitation, and maintaining order. The least restrictive means must be used, and proportionality acts as a ceiling (i.e., we cannot exceed what is proportionate, but we should aim for the minimum effective intervention). Desert-based reasoning is barred.

  2. **Compatibilist View (Dennett)**: Sanctions can also serve to hold the individual responsible, to communicate censure, and to reinforce social norms. The individual is seen as an agent who can respond to reasons, and sanctions can be deserved in a non-basic-desert sense (i.e., as part of a social practice that cultivates competences).

  The procedure must be structured so that both views can use the same steps, but where they diverge, we have a tie-break rule.

  **Structure of the Decision Procedure**

  We break the procedure into sequential questions. At each step, if the answer is "no", we move to the next. If we reach the end without a sanction, the outcome is no sanction. The procedure must be honest about admissibility: we explicitly state what considerations are allowed at each step and bar desert-based reasoning unless it is routed to a legitimate goal (like deterrence or norm reinforcement, which are acceptable under both views if tied to harm prevention).

  We will have the following steps:

  1. **Harm Prevention (Immediate Risk)**: Is there a current, ongoing risk of harm that requires immediate intervention? (e.g., the prisoner is violent and likely to reoffend imminently). If yes, then the least restrictive sanction that neutralizes the immediate risk is applied (e.g., cellular confinement for a few days). This step is about urgent, tangible risk.

  2. **Harm Prevention (Future Risk)**: Is there a significant risk of future harm that can be reduced by a sanction? (e.g., the behavior, if not addressed, is likely to lead to harm). If yes, then we consider sanctions that are necessary and proportionate to reduce that risk (e.g., removal from a position of trust, referral for treatment, or loss of privileges that reduces access to means of harm). We must consider the least restrictive option.

  3. **Rehabilitation/Reintegration**: Would a sanction contribute to the prisoner's rehabilitation or reintegration? (e.g., by encouraging engagement with programs, or by addressing underlying issues through referral). This step must not be used as a backdoor for desert. If a sanction is needed for rehabilitation (e.g., mandated treatment), then it is considered.

  4. **Institutional Order**: Is a sanction necessary to maintain institutional order? (e.g., to deter others, to uphold rules that are essential for safety and operation). This step must be based on evidence that without a sanction, order would be undermined. It must be the least restrictive sanction that achieves the goal.

  5. **Proportionality Ceiling**: This is not a step to impose a sanction but to set a maximum. After identifying a sanction from steps 1-4, we check that it does not exceed what is proportionate to the offense and the harm. For the skeptic, this is a hard ceiling. For the compatibilist, it may also be a target (but we are using it as a ceiling). If the sanction from steps 1-4 exceeds proportionality, we reduce it to the maximum proportionate level.

  **Divergence Handling**:

  - Where the skeptic would only go as far as the least restrictive option and the compatibilist might choose a more severe sanction to send a message (e.g., in step 4 for deterrence), we allow the panel to choose within the bounds of necessity and the proportionality ceiling. However, if there is disagreement, we use a tie-break rule: the less restrictive sanction must be chosen unless there is clear evidence that the more restrictive one is necessary for harm prevention (and the burden of proof is on the advocate for the more severe sanction). In case of a tie in the panel, the chair (you) has the casting vote.

  **Barring Desert**: At each step, we explicitly bar considerations of desert. For example, when discussing risk, we require evidence-based assessment (past behavior, context) and not "he deserves it because he did wrong". If a panelist tries to bring in desert, the chair must redirect to the admissible considerations.

  **The Procedure Card (Laminated One-Pager)**

  **Prison Adjudication Decision Procedure**

  *Step 1: Immediate Harm Prevention*
  - Question: Is there an immediate, ongoing risk of harm that requires intervention now?
  - Admissible: Evidence of current threat (e.g., recent violence, weapons found, ongoing refusal to comply leading to immediate danger).
  - Barred: Past behavior not linked to current risk, desert.
  - If yes: Apply the least restrictive sanction that stops the risk (e.g., short cellular confinement). Then skip to Step 5. If no, go to Step 2.

  *Step 2: Future Harm Prevention*
  - Question: Is there a significant risk of future harm that a sanction could reduce?
  - Admissible: Evidence of pattern of behavior, likelihood of recurrence, factors that increase risk (e.g., access to weapons, position of trust abused). Consider the prisoner's history only as relevant to risk.
  - Barred: Desert, punishment for its own sake.
  - If yes: Choose the least restrictive sanction that effectively reduces risk (e.g., loss of privileges, removal from job, referral for treatment). Then go to Step 5. If no, go to Step 3.

  *Step 3: Rehabilitation/Reintegration*
  - Question: Would a sanction contribute to the prisoner's rehabilitation or reintegration?
  - Admissible: Evidence that the sanction (e.g., mandated program, loss of privileges as incentive) would address underlying issues and support progress. Must be tailored to the individual.
  - Barred: Sanctions that are purely punitive without rehabilitative benefit.
  - If yes: Apply the least restrictive sanction that aids rehabilitation. Then go to Step 5. If no, go to Step 4.

  *Step 4: Institutional Order*
  - Question: Is a sanction necessary to maintain institutional order by deterring others or upholding essential rules?
  - Admissible: Evidence that the behavior, if unaddressed, would undermine order (e.g., widespread imitation, loss of authority, erosion of rules). Must be the minimum necessary to achieve the effect.
  - Barred: Sanctions based on making an example without evidence of need, desert.
  - If yes: Apply the least restrictive sanction that effectively maintains order. Then go to Step 5. If no, go to Step 5 (no sanction).

  *Step 5: Proportionality Ceiling*
  - Check: The sanction from Steps 1-4 must not exceed what is proportionate to the offense and harm. Consider: severity of harm, intent (if known and relevant to risk), circumstances. Reduce sanction if above ceiling.
  - Note: Proportionality is a maximum, not a target. The sanction must not be more severe than necessary.

  *Tie-Break Rule*: 
  - If the panel disagrees on sanction severity, the less restrictive option prevails unless there is clear and specific evidence that the more restrictive one is necessary for harm prevention (Steps 1 or 2) or institutional order (Step 4) and the less restrictive one would be inadequate. In a tied vote, the chair has the casting vote.

  *Output*: 
  - If no sanction at Step 4, then no sanction.
  - If sanction, write one paragraph: "We found [offense]. To prevent harm/rehabilitate/maintain order [choose applicable], we impose [sanction]. This is the least restrictive option we believe effective and is proportionate because [brief reasons]."

  **Reasoning Behind the Card**

  The procedure is designed to:
  - Force explicit consideration of the goals (harm prevention, rehabilitation, order) and bar desert.
  - Prioritize immediate risks, then future risks, then rehabilitation, then institutional order. This order ensures that we only move to institutional order if the other goals don't apply, because institutional order is more prone to abuse (e.g., making examples).
  - Use proportionality as a ceiling to cap sanctions, regardless of the panel's view.
  - The tie-break rule favors the skeptic's view (less restrictive) unless there is strong evidence for the compatibilist's view (e.g., that a more severe sanction is necessary for deterrence).

  **Limitations**:
  - Inconsistencies may still arise in judgment calls, especially in Steps 2 and 4, where risk assessment and institutional order are subjective.
  - The regime's effects (e.g., crowding leading to violence) might be laundered into risk numbers if not critically examined. The procedure does not require the panel to consider systemic factors unless they are part of the evidence (e.g., if a prisoner's behavior is a reaction to conditions, that might reduce perceived risk).
  - Steps 3 and 4 are particularly vulnerable to being used as cover for punitive intent. The chair must enforce the admissibility rules.
  - The procedure cannot eliminate the role of judgment. For example, what counts as "least restrictive" and "effective" is a judgment call.

  ---

  **Application to Cases**

  We run the three cases through the procedure. For each, we show the panel's working and then what the other framework would say.

  **Case 1: Man throws hot water at officer**

  *Facts*: 
  - Offense: Assault on officer.
  - Context: During a cell search that destroyed photos of his daughter. Officer not badly hurt but won't return to the wing. Prisoner had 14 months clean and was working in the kitchen.
  - Panel split: Some want maximum days (added to sentence).

  *Procedure*:

  *Step 1: Immediate Harm Prevention* 
  - Is there an immediate risk? The incident is over. The prisoner is in custody. No evidence of ongoing violence. So no.

  *Step 2: Future Harm Prevention*
  - Risk of future harm? The prisoner has been clean for 14 months and this was a provoked incident (photos destroyed). However, the act was severe and targeted an officer. There is a risk that he might react violently again if provoked. But the context suggests the risk is situational. The job in the kitchen might be a risk if he can access hot water again. We must reduce that risk.
  - Least restrictive option: Remove him from the kitchen job (loss of job privilege) to reduce access to means. Is that enough? The panel might think he poses a broader risk. We could consider referral for anger management (if available). But the panel might argue that without a stronger sanction, the risk remains. However, the procedure requires the least restrictive effective option. Removing him from the kitchen and referring to treatment might be sufficient. Adding days does not directly reduce risk (unless it deters, which is Step 4). So under Step 2, we could do: loss of job and referral for treatment.

  *Step 3: Rehabilitation/Reintegration*
  - Could a sanction aid rehabilitation? The referral for treatment is rehabilitative. We already have that. Adding days might not aid rehabilitation.

  *Step 4: Institutional Order*
  - Is a sanction necessary to maintain order? The officer has left the wing, which may affect staff morale and prisoner perceptions. There is a risk that if no significant sanction is given, prisoners may think assaulting officers has low consequences. This could undermine order. The behavior is serious and must be seen as unacceptable. The least restrictive sanction for order might be adding some days to sentence (as a deterrent) and loss of privileges. But we must not exceed what is necessary. If loss of job and referral are done, is that enough? The panel might argue that for order, a stronger message is needed. However, the procedure requires the least restrictive option. We might start with the loss of job and referral and then only add days if we have evidence that without it, order would be undermined. Given the seriousness, adding a few days might be argued as necessary.

  *Step 5: Proportionality Ceiling*
  - The maximum proportionate sanction: The harm was moderate (officer not badly hurt but traumatized), the provocation was high (destruction of personal property by staff). Proportionality would set a ceiling that is not the maximum days. The maximum days might be disproportionate.

  *Panel Decision*: 
  - For Step 2: Loss of kitchen job and referral for anger management.
  - For Step 4: After debate, we might add a few days (say 5-10 days) for institutional order, but only if the panel finds it necessary and with evidence. The skeptic would avoid adding days unless proven necessary. The compatibilist might want more. 
  - Using the tie-break: If the panel is split, the chair (you) would break the tie. As a skeptic, you might argue that the loss of job and referral are sufficient for risk and order. So the sanction: loss of job, referral for treatment, and no added days. But if the majority insists on days, then we must use the tie-break: the less restrictive option (no days) wins unless there is clear evidence that days are necessary. The wing manager might argue that without days, order is at risk. Is there evidence? Past incidents? We don't have that in the facts. So no days.

  *Output*: 
  - Sanction: Loss of kitchen job, referral for anger management. 
  - Reasons: "We found you guilty of assault. To reduce the risk of future harm and to help you manage your reactions, we remove you from the kitchen job and refer you to anger management. This is proportionate given the provocation and harm caused."

  *What the other framework would say*:
  - Skeptic: Agrees with the above. Adding days is retributive and not necessary.
  - Compatibilist: Would want added days to hold the prisoner responsible, to censure the act, and to reinforce norms. They might say the sanction is too light and fails to send a message.

  **Case 2: Man refuses programs and tells others they are a con**

  *Facts*:
  - Offense: Failure to comply? (The charge is not clear, but the wing manager wants to book him for failure to comply with the regime's expectation to engage.)
  - Context: No charges in two years, but he discourages others. His refusal is contagious.

  *Procedure*:

  *Step 1: Immediate Harm Prevention* 
  - No immediate risk.

  *Step 2: Future Harm Prevention*
  - Is there a risk of harm from his behavior? His discouraging others might lead to reduced program participation, which might increase reoffending risk in the long term. But this is indirect and speculative. The procedure requires significant risk of harm. It is unclear that his speech creates a tangible risk of harm (e.g., violence). So probably no.

  *Step 3: Rehabilitation/Reintegration*
  - Would a sanction aid his rehabilitation? He refuses programs. A sanction (e.g., loss of privileges) might coerce him into programs? But forcing program attendance when he is resistant may not be effective and might violate the least restrictive principle. If the programs are voluntary, then a sanction for not attending might be inappropriate. If the regime requires participation, then we must consider. But the facts say he "refuses every accredited programme", implying they are offered but not mandatory. So a sanction might not aid his rehabilitation and could be counterproductive. Therefore, no.

  *Step 4: Institutional Order*
  - Is his behavior undermining order? By telling new arrivals the programs are a con, he might be encouraging non-compliance, which could spread and undermine the rehabilitative regime. This could be seen as undermining institutional order. The least restrictive sanction to maintain order might be a warning or loss of privileges (e.g., loss of access to common rooms where he talks to new arrivals). But we must be cautious: punishing speech might be disproportionate and could inflame. Is there evidence of contagion? The wing manager says it is contagious. If we accept that, then a minimal sanction might be justified.

  *Step 5: Proportionality*
  - If we impose a sanction, it must be proportionate. The offense is non-violent and non-compliant speech. The ceiling would be low.

  *Panel Decision*:
  - Step 4: We might impose a loss of privileges (e.g., no access to common areas for a week) to reduce his ability to influence others. But is that the least restrictive? A warning might be tried first. Since he has no charges in two years, a warning might suffice. The skeptic would avoid sanction. The compatibilist might want to censure the behavior.
  - Output: No sanction, or a warning. But the procedure allows for a minimal sanction at Step 4 if necessary. However, without clear evidence of harm to order, the skeptic would say no. The chair might break the tie: no sanction.

  *Output*: 
  - No sanction. 
  - Reasons: "We found you have discouraged others from programs. However, we do not find that this requires a sanction to prevent harm or maintain order at this time. We encourage you to engage with programs."

  *What the other framework would say*:
  - Skeptic: Agrees with no sanction because there is no clear harm to prevent.
  - Compatibilist: Might want a sanction to hold him responsible for undermining the regime and to send a message that such behavior is unacceptable.

  **Case 3: Three men refuse to return to cells during lock-up**

  *Facts*:
  - Three men separately refused. The wing is deteriorating. You want one to take a heavier sanction to send a message.

  *Procedure*:
  - We must assess each man individually. The procedure must be run separately for each. We cannot impose a heavier sanction on one without justification.

  *For each man*:

  *Step 1: Immediate Harm Prevention*
  - The refusal during lock-up created a disruption. But after the event, no immediate risk.

  *Step 2: Future Harm Prevention*
  - Risk of recurrence? If they have a history of non-compliance, then yes. But if not, then no. Without individual history, we cannot assume risk.

  *Step 3: Rehabilitation*
  - Unlikely to apply.

  *Step 4: Institutional Order*
  - The wing is deteriorating. Refusals to lock up can spread and undermine the regime. Sanctioning each is necessary to maintain order. But the least restrictive sanction for each might be the same (e.g., loss of privileges for a day). The desire to make an example of one is barred unless there is an individual factor that justifies a heavier sanction (e.g., one is a ringleader). But the facts say they acted separately. So we must treat them equally.

  *Step 5: Proportionality*
  - The sanction for refusal to lock up should be at the lower end (e.g., loss of privileges, not adding days).

  *Panel Decision*:
  - For each: a minimal sanction (e.g., loss of privileges for one day). 
  - You want one to take a heavier sanction. But the procedure bars that unless there is evidence that one poses a greater risk or had a more serious role. Without such evidence, we cannot. 
  - Output for each: Loss of privileges for one day. 
  - Reasons: "We found you guilty of failing to comply with a lawful order. To maintain order, we impose loss of [specific privilege] for one day. This is proportionate."

  *What the other framework would say*:
  - Skeptic: Agrees with equal, minimal sanctions. Making an example is desert-based and not necessary.
  - Compatibilist: Might support making an example of one to send a message, but the procedure bars it without individual justification.

  **One You Will Hate**

  Case 3 comes out as you hate: you cannot impose a heavier sanction on one without evidence. The procedure forces equal treatment.

  **What the Procedure Can't Do**

  1. **Inconsistency between panels**: Panels may still differ in their assessment of risk (Step 2) and institutional order (Step 4). For example, one panel might see a behavior as high risk, another as low.

  2. **Laundering regime effects**: If the prison is overcrowded and tense, a prisoner's reaction might be seen as high risk (Step 2) when it is a response to conditions. The procedure does not require panels to consider systemic factors unless presented as evidence.

  3. **Judgment calls**: Steps 2, 3, and 4 involve judgment. What is "least restrictive" and "effective" is not objective. Step 4 (institutional order) is particularly vulnerable to being used punitively.

  Despite these, the procedure provides a structured, auditable process that bars desert and promotes consistency.
answer: |-
  Below is a decision procedure designed to be run in 20 minutes per adjudication, structured as a one-page laminated card for your panel. It explicitly routes or bars desert-based reasoning ("he deserves this") and provides tie-break rules for philosophical divergences (skeptic vs. compatibilist). The procedure is built around four harm-prevention goals (immediate safety, future risk reduction, rehabilitation, and institutional order), with proportionality as a ceiling. Considerations of desert are barred unless they can be reframed as evidence for one of these goals (e.g., "deterrence" under institutional order must be backed by data, not moral intuition).

  After the card, I provide the reasoning, apply it to your three cases (with outputs, panel working, and alternative frameworks), and end with limitations.

  ---

  ### **One-Page Decision Procedure Card**  
  *(Laminate for Panel Use)*  

  **Step 1: Immediate Harm Prevention**  
  - **Question:** Is there an *immediate, ongoing* threat to safety (e.g., violence, weapons, active disobedience)?  
  - **Admissible:** Observed behavior, weapons, threats, or clear risk of harm *right now*.  
  - **Barred:** Past acts not linked to current risk, moral blame, or "he deserves punishment."  
  - **Sufficient Answer:** Yes = impose least restrictive sanction to stop harm (e.g., cellular confinement for hours/days). **Stop here** and go to Step 5. No = proceed to Step 2.  

  **Step 2: Future Harm Reduction**  
  - **Question:** Is there reliable evidence this act *significantly increases future risk* (e.g., pattern of violence, abuse of position, or likelihood of reoffending)?  
  - **Admissible:** Documented history, role/access (e.g., kitchen job), gang links, or psychological assessment. Risk must be tangible (e.g., "likely to cause harm," not "he’s a bad person").  
  - **Barred:** General "dangerousness" without evidence; desert-based claims.  
  - **Sufficient Answer:** Yes = choose least restrictive sanction that reduces risk (e.g., job removal, privilege loss, or referral for treatment). **Stop here** and go to Step 5. No = proceed to Step 3.  

  **Step 3: Rehabilitation/Reintegration Need**  
  - **Question:** Would a sanction *directly aid rehabilitation* (e.g., by motivating program engagement or addressing a treatable issue like addiction)?  
  - **Admissible:** Behavior linked to a rehabilitative gap (e.g., refusal of programs, treatment needs). Sanction must enable progress (e.g., mandated therapy).  
  - **Barred:** Sanctions as punishment; forcing programs without clear benefit.  
  - **Sufficient Answer:** Yes = impose least restrictive rehabilitative sanction (e.g., program mandate). **Stop here** and go to Step 5. No = proceed to Step 4.  

  **Step 4: Institutional Order Necessity**  
  - **Question:** Is a sanction *essential to prevent regime collapse* (e.g., deterrence, stopping contagion, or upholding rules)? Must show evidence, not speculation.  
  - **Admissible:** Data on "contagion" (e.g., multiple similar incidents), staff authority erosion, or systemic impact. "Message-sending" only if tied to proven order risks.  
  - **Barred:** "Making an example" without evidence; desert or retribution.  
  - **Sufficient Answer:** Yes = impose least restrictive sanction for order (e.g., minor privilege loss). No = **no sanction**. Proceed to Step 5.  

  **Step 5: Proportionality Ceiling Check**  
  - **Action:** Review sanction from Steps 1-4. Does it exceed a proportionate response to harm caused? Consider:  
    - Severity of harm (physical/psychological).  
    - Intent (if known, e.g., provoked vs. premeditated).  
    - Circumstances (e.g., overcrowding, triggers).  
  - **Rule:** Sanction must be **reduced** if disproportionate. Proportionality is a *ceiling* (max allowed), not a target.  
  - **Output:** Finalize sanction or no sanction.  

  **Tie-Break Rules for Divergence**  
  - If panel disagrees on sanction severity:  
    - **Default:** Less restrictive option wins (e.g., no added days vs. days).  
    - **Override:** More restrictive only if *clear evidence* it is necessary for harm prevention (Steps 1-2) or institutional order (Step 4).  
  - **Tie Vote:** Chair (you) casts deciding vote. Governor referral only if deadlock persists after chair vote.  
  - **Philosophical Divergence Handling:**  
    - Skeptics (Caruso) prioritize Steps 1-2; compatibilists (Dennett) often emphasize Step 4. At Step 4, compatibilists may push for "censure" as order-maintenance—require evidence for this. If debate arises, chair enforces tie-break.  

  **Reason Paragraph Template**  
  "We found [offense]. To [prevent immediate harm/reduce future risk/aid rehabilitation/maintain order], we impose [sanction]. This is the least restrictive option we believe effective and proportionate given [brief reason]."  

  ---

  ### **Reasoning Behind the Card**  
  - **Structure:** Questions progress from most urgent (Step 1) to least urgent (Step 4). This forces panels to justify sanctions through harm prevention, barring desert by design. Steps 1-3 focus on the individual; Step 4 addresses systemic risks.  
  - **Admissibility/Barred Rules:** Desert ("he earned this") is barred because it lacks empirical basis for harm prevention. It can only enter indirectly at Step 4 if framed as deterrence with evidence (e.g., "three similar incidents followed inaction").  
  - **Tie-Break Rationale:** Defaulting to less restrictive aligns with skeptic view (Caruso) and forces compatibilists to provide evidence for severity. Chair casting vote ensures efficiency.  
  - **Values vs. Facts:** Steps 4 (order) and 5 (proportionality) involve value judgments—e.g., "what preserves order?" The procedure limits this by requiring evidence for Step 4 and harm-based proportionality at Step 5.  
  - **Efficiency:** Takes 10-15 minutes once familiar. Focuses on facts, not philosophy.  

  ---

  ### **Case Applications**  
  **Case 1: Man throws hot water at officer**  
  - **Facts:** 14 months clean; kitchen job; provoked by photos destroyed; officer unhurt but leaves wing; panel split on max days.  
  - **Procedure Output:**  
    - **Step 1:** No immediate risk (incident over). Proceed.  
    - **Step 2:** Future risk? Yes—history of violence re-emerged under stress, and kitchen access enables repeat. **Sanction:** Remove from kitchen job (reduces risk) + referral to anger management (rehabilitation). Stop.  
    - **Step 5:** Proportionality—Max days would exceed harm (officer not injured; high provocation). Sanction is proportionate ceiling.  
    - **Verdict:** Loss of kitchen job + referral to treatment. No added days.  
    - **Reasons Paragraph:** "We found you guilty of assault. To reduce future risk and address underlying issues, we remove you from the kitchen job and refer you to anger management. This is proportionate given the context and harm caused."  
  - **Other Frameworks:**  
    - **Skeptic (Caruso):** Agrees—no added days; focus on risk reduction/rehab.  
    - **Compatibilist (Dennett):** Wants added days for "censure" to uphold standards. Argues order (Step 4) requires days to deter others. Tie-break: No evidence of contagion, so less restrictive (no days) wins.  
  - **Why You’ll Hate This:** As a skeptic, you avoid days, but compatibilists see this as under-punishing and weakening norms.  

  **Case 2: Man refuses programs and discourages others**  
  - **Facts:** No charges in 2 years; calls programs a "con"; contagion risk alleged.  
  - **Procedure Output:**  
    - **Step 1:** No immediate risk. Proceed.  
    - **Step 2:** Future risk? No—speech isn’t violence; no evidence of harm. Proceed.  
    - **Step 3:** Rehabilitation? Refusal isn’t rehab need; forcing programs may backfire. Proceed.  
    - **Step 4:** Institutional order? Contagion alleged but no evidence (e.g., no data on increased refusals). "Message-sending" barred without proof. **No sanction.**  
    - **Verdict:** No sanction.  
    - **Reasons Paragraph:** "We found you discouraged program participation. We lack evidence this requires a sanction to prevent harm or maintain order. No sanction is imposed."  
  - **Other Frameworks:**  
    - **Skeptic (Caruso):** Agrees—no sanction without harm evidence.  
    - **Compatibilist (Dennett):** Wants minor sanction (e.g., privilege loss) for "censure" to reinforce norms (Step 4). Tie-break: No evidence for order risk, so no sanction.  
  - **Why It Works:** Bars wing manager’s subjective "contagion" claim without data.  

  **Case 3: Three men refuse cell lock-up; wing deteriorating**  
  - **Facts:** Separate incidents; you want one heavier sanction to "send a message."  
  - **Procedure Output (per individual):**  
    - **Step 1:** No immediate risk (after lock-up). Proceed.  
    - **Step 2:** Future risk? No individual history given. Proceed.  
    - **Step 3:** No rehab need. Proceed.  
    - **Step 4:** Institutional order? Refusal undermines regime; evidence of "deterioration" justifies minimal sanction. **Sanction:** Loss of privileges (e.g., gym access) for 1 day for all three.  
    - **Step 5:** Proportionality—Heavier sanction (e.g., days added) exceeds harm (non-violent disobedience).  
    - **Verdict:** Equal loss of privileges for all three.  
    - **Reasons Paragraph:** "We found you guilty of refusing a lawful order. To maintain institutional order, we impose loss of gym access for one day. This is proportionate and the least restrictive option."  
  - **Other Frameworks:**  
    - **Skeptic (Caruso):** Agrees—equal minimal sanction; no "message-sending."  
    - **Compatibilist (Dennett):** Wants heavier sanction for one man to "cultivate responsibility" (Step 4). Tie-break: No evidence one man is ringleader, so less restrictive (equal treatment) wins.  
  - **Why You’ll Hate This:** You cannot impose unequal sanctions without evidence, undermining your intent to "send a message."  

  ---

  ### **What the Procedure Can’t Do**  
  1. **Inconsistency Between Panels:**  
     - **Source:** Judgment calls in Steps 2 (risk assessment) and 4 (order necessity). Risk is subjective—e.g., one panel sees "provocation" as mitigating risk, another ignores it.  
     - **Example:** In Case 1, a compatibilist-heavy panel might overstate "future risk" to justify days.  

  2. **Laundering Regime Effects:**  
     - **Source:** The procedure cannot audit systemic factors. Boredom, crowding, or staff provocation (e.g., destroying photos) may cause behavior but get laundered into "risk" at Step 2.  
     - **Example:** In Case 1, the prisoner’s reaction to photo destruction is treated as "future risk," ignoring the regime’s role in escalating violence.  

  3. **Judgment Calls Masked as Procedure:**  
     - **Source:** Steps 4 and 5 are value-laden. "Institutional order" (Step 4) can justify anything from no sanction to added days based on panel biases. Proportionality (Step 5) is inherently subjective (e.g., is loss of gym access proportionate for lock-up refusal?).  
     - **Mitigation:** Tie-break rules and chair oversight reduce this, but not eliminate.  

  4. **Ignoring Systemic Harm:**  
     - **Limitation:** The procedure treats "harm" as individual acts, not regime failures (e.g., overcrowding increasing tension). This risks punishing prisoners for institutional problems.  

  **Recommendation:** Audit 5% of cases monthly for "divergence hotspots" (Steps 2 and 4) and require panels to cite evidence for risk/order claims. This won’t fix philosophy splits but makes them auditable.
