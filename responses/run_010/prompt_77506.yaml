prompt: |-
  I've spent a fair number of years in the calibration-and-forecasting corner of the rationalist blogosphere, and I've run into a pattern I can't name. My estimate of attendance at a conference was 200, built as 1,000 invitees times a 20 percent acceptance rate. The truth turned out to be 250, built as 500 invitees times a 50 percent rate. When I learned the real invitee count and updated to 100, one component of my model became exactly right and the output moved three times further from the truth, because two errors had been pointing in opposite directions and cancelling. The same shape appears without any arithmetic: I leave five minutes early because my watch runs five minutes fast, and if I fix the watch but keep the habit I'm late.

  I'm aware of the familiar truthlikeness puzzle — that a precisely false claim can outrank a true but empty one. This seems different, and more troubling: the ordering by closeness to the truth isn't monotone under the very operation we treat as epistemic progress. Is there an established concept for it, in philosophy of science or in the modelling literature? A bare label won't help me. I want the nearest candidates and how each differs from what I've described, whether the effect is an artefact of scoring outputs instead of components, and, if nothing fits, a proposed term with a definition plus boundary conditions — under what circumstances does correcting one error still guarantee an improvement?
reasoning: |-
  Okay, let me try to unpack this user's problem. They're describing a situation where updating part of a model to be correct actually makes the overall prediction worse. Like when they estimated conference attendance as 200 (1000 invitees * 20% acceptance), but the reality was 250 (500 invitees * 50%). When they corrected the invitee count to 500, their new estimate became 100 (500 * 20%), which is even further from 250 than before. 

  Hmm, this feels familiar - reminds me of that watch example they gave. Leaving early because of a fast watch, then fixing the watch but keeping the same early departure habit makes you late. Two errors canceling each other out. 

  The user mentions they know about truthlikeness (verisimilitude) but this seems different. They're worried because improving one component moves the outcome away from truth - which feels counterintuitive to epistemic progress. 

  Let me think about what concepts might apply here. First, error compensation comes to mind - when multiple errors offset each other. There's also the idea of model misspecification. And in statistics, we have the bias-variance tradeoff, though that's more about prediction error. 

  Wait - in causal reasoning, there's something called "correlated errors" or "compensating biases". But the user seems to want a precise term. I recall that in operations research and model calibration, they discuss "cancellation of errors". And in metrology, "systematic error compensation". 

  The key insight is that partial correction only helps if all components are fixed simultaneously. The user asks when correcting one error guarantees improvement - that would only be when there's no error interaction, like in additive models. 

  I should also address their concern about scoring outputs vs components. Truthlikeness usually scores whole models, but here the components matter because of the multiplicative structure. Maybe "non-monotonicity of verisimilitude under partial correction" is as close as we get to a definition. 

  The boundary conditions question is good. Correction helps when: errors are independent, model is linear, or when we're not in a cancellation scenario. But in multiplicative models with offsetting biases, we get this paradox. 

  This feels important because it challenges how we think about "progress" in modeling. Sometimes making one part more accurate backfires if the system has compensating errors. The user's framing suggests they've seen this pattern repeatedly in forecasting work. 

  I wonder if they'd find value in the engineering concept of "robustness to parameter variation" or "sensitivity analysis". But ultimately, I think "error compensation" is the most direct label, even if it's not a single established term. The definition would center on offsetting biases in model components whose interaction produces cancellation effects. 

  The deeper trouble they sense is real - epistemic progress isn't always monotonic when models have interacting errors. That's worth naming clearly.
answer: |-
  Your described phenomenon—where correcting one component error moves the overall estimate *further* from the truth due to previously offsetting errors—is a critical challenge in modeling and epistemology. Below is a structured analysis of the concept, its closest analogs, distinctions, and boundary conditions.

  ### Core Concept & Proposed Term
  **Error Compensation (or Compensating Biases)**  
  *Definition*: A state in a multi-component model where errors in distinct parameters or assumptions offset each other, such that partial correction of one error *increases* total error by disrupting the cancellation. The effect arises from *interacting systematic biases* in a nonlinear system.

  ### Nearest Established Concepts & How They Differ
  1. **Verisimilitude (Truthlikeness) Non-Monotonicity**  
     - *Overlap*: Recognizes that "more accurate" components don’t guarantee a "truer" overall model.  
     - *Difference*: Verisimilitude debates focus on *whole propositions* (e.g., "all swans are white" vs. "all swans are green") rather than *parametric errors in mechanistic models*. Your case is about *directionality of errors* (canceling vs. reinforcing).  

  2. **Bias-Variance Tradeoff (Statistics/Machine Learning)**  
     - *Overlap*: Improving one aspect (e.g., bias) can worsen overall prediction.  
     - *Difference*: This tradeoff concerns model *flexibility*, not offsetting errors in *input parameters*. Your issue persists even in deterministic models.  

  3. **Degeneracy in Model Calibration**  
     - *Overlap*: Multiple parameter sets yield identical outputs ("equifinality"), masking truth.  
     - *Difference*: Degeneracy implies indistinguishability, whereas your case involves *known* ground truth exposing the compensation.  

  4. **Epistemic Opacity in Complex Systems**  
     - *Overlap*: Correcting subsystems may degrade system performance.  
     - *Difference*: Focuses on emergent complexity; your example is a simple multiplicative model.  

  ### Why Scoring Outputs vs. Components Matters
  - **Output scoring** (e.g., Mean Squared Error) evaluates only the final prediction. Error compensation *exploits* this by rewarding coincidental accuracy.  
  - **Component scoring** would penalize both input errors but requires knowing ground-truth components—often unavailable. Your conference example shows that optimizing for output accuracy alone can *inhibit* component truth-seeking.  

  ### Boundary Conditions: When Does Correcting One Error *Guarantee* Improvement?  
  Correction improves the output if:  
  1. **No Error Interaction**: Model is linear/additive (e.g., `output = a + b`).  
  2. **Independent Errors**: Biases are uncorrelated and non-offsetting (e.g., both overestimates).  
  3. **Monotonic Sensitivity**: The output’s partial derivative w.r.t. each input doesn’t change sign (e.g., if `output = a * b`, and `a` and `b` are both positively correlated with output).  
  4. **Full Correction**: All errors are fixed simultaneously.  

  *In multiplicative or nonlinear models (like your examples), partial correction often backfires when initial errors are compensatory.*

  ### Practical Implications
  - **For Forecasters**: Prioritize *validating input parameters* over output accuracy. Use sensitivity analysis to detect compensation (e.g., if varying one parameter’s error changes output error direction).  
  - **For Model Design**: Avoid non-identifiable parameters. If using multiplicative terms, incorporate Bayesian priors on inputs.  
  - **Philosophically**: Highlights that "progress" in science isn’t monotonic; localized corrections may temporarily regress global accuracy.  

  ### Why This Isn’t Merely "Overfitting" or "Confirmation Bias"  
  - **Overfitting** fits noise, but your initial model had *systematic* biases.  
  - **Confirmation bias** seeks confirming evidence, whereas you updated rationally upon new data.  

  This phenomenon reveals a gap in epistemology: we lack a named fallacy for **"coincidental correctness masking component falsehood."** Until standardized, **"compensatory error trap"** or **"cancellation fragility"** could serve as evocative labels. The core insight: *Truth-seeking requires simultaneous multi-dimensional calibration—piecewise progress risks cascading failures.*  

  *(Example inspired by real cases: Climate models with compensating aerosol/CO₂ biases; economics models where demand overestimates cancel supply underestimates.)*
