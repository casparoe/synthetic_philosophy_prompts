prompt: |-
  I'm a third-year criminology PhD student working on criminalisation theory — basically, when the state may turn conduct into a crime — and the Hart/Devlin exchange is adjacent enough that I'm supposed to have a grip on it. I don't. I've only ever met it through other people. So: I picked up a trade-press history of the great law-and-liberty arguments at the airport, and it does the Wolfenden stuff in a couple of pages. I typed the Devlin paragraph out:

  "Devlin's 1959 Maccabaean lecture was his answer to the Wolfenden Report, which had recommended two years earlier that homosexual acts between consenting adults in private should cease to be crimes. His case opens from a sociological claim rather than a moral one: a society is not merely a collection of people who happen to share a government, it is held together by a common set of moral ideas, and if too many of those ideas go the society stops being a society. On that basis the law may criminalise conduct that is immoral even where it harms nobody, for much the same reason that it may criminalise sedition. Devlin's test for when this is appropriate is refreshingly democratic: consult the ordinary reasonable person, and if that person responds with disgust, indignation and intolerance, the state is entitled to act. Note that Devlin was no relativist — he thought the law should enforce true morality rather than the conventions of the moment, which is why he took the Wolfenden recommendation to be wrong in principle and not merely imprudent. Hart's reply demolished the argument on its own terms: he showed that societies absorb enormous moral change without coming apart, so Devlin's factual premise was false and nothing survived of the case for legal moralism."

  My supervisor said something like that last sentence in a seminar last term — Hart won on the evidence — and I've definately been repeating it without thinking. Now I want an audit I can act on.

  1. Go through the paragraph claim by claim and sort it: what's straight, what's a legitimate simplification for a general audience, what a Devlin scholar would call a distortion, and what's simply false. I care most about the ones that look fine.

  2. On the "refreshingly democratic" line: is that fair? Did Devlin really make popular revulsion the criterion, and did he think disgust on its own entitled the state to legislate? How much did he build in by way of constraints — tolerance, privacy, the pace of change, the difference between having a ground for criminalising and having a conclusive one? I keep hearing he conceded a lot here and I can't tell how much, or whether the concessions are internal to his argument or bolted on afterwards.

  3. The "true morality rather than the conventions of the moment" sentence. Is that right, and does anything turn on it? Specifically: if the book had it the other way round, does Hart's criticism still land, or does it depend on which of the two Devlin meant? Would a Devlin who enforced true morality rather than the going code be a different kind of legal moralist, with a different vulnerability?

  4. Was Hart's objection empirical, conceptual, or doing both at once? And did he give Devlin any part of the starting premise? Does "on its own terms" survive, given that Hart seems to bring in a liberal assumption about harm that Devlin never granted?

  5. The practical bit. My chapter argues that a moral wrong gives the state a *pro tanto* reason to criminalise — a real reason, but one that has to be weighed against competing considerations and can lose. Can I recruit Devlin for that structure, or am I reading him against the text to make him respectable? Would someone defending Devlin accept my framing, or would they say I've turned him into a harm-principle theorist in slow motion?

  British English please. And don't send me off to page numbers or a reading list — I can't get hold of the primary texts this week, and what I actually need is the shape of the arguments and where the book's version bends them.
reasoning: |-
  Okay, let me unpack this criminology PhD student's query. They're working on criminalisation theory and need a critical audit of a popular history book's summary of the Hart/Devlin debate. The core tension is between their supervisor's "Hart won on evidence" position and their own suspicion that the reality is more nuanced.

  First, I need to map their five requests onto the key controversies. The paragraph they quoted contains several loaded claims: Devlin's "sociological glue" thesis, the "reasonable person" standard, the true morality vs conventions distinction, and Hart's empirical rebuttal. Each needs separating into straight facts, simplifications, distortions and falsehoods.

  For the "refreshingly democratic" point (request 2), I recall Devlin did propose the "reasonable person" but with caveats - tolerance, privacy, pace of change. The book oversimplifies by implying disgust alone suffices. Devlin's concessions about competing considerations are integral, not afterthoughts. 

  On the true morality issue (request 3), the book gets this backwards. Devlin actually defended enforcing current shared morality, not timeless truths. This matters because Hart's empirical attack ("societies survive moral change") only works against the book's misrepresentation. The real Devlin would say shifting morals simply update what needs enforcement.

  Hart's objection (request 4) was both empirical and conceptual. He granted Devlin's starting premise that shared morality binds society, but showed societies withstand moral flux. The "on its own terms" claim holds because Hart didn't smuggle in the harm principle - he accepted moral enforcement could theoretically preserve order, then disproved the necessity.

  For their chapter framework (request 5), Devlin can be partially recruited. His "disintegration thesis" provides a pro tanto reason based on social cohesion, but his "reasonable person" test implies thresholds before deploying it. Still, casting him as weighing competing considerations is defensible - his later concessions show awareness of liberty costs. He's not a harm theorist because cohesion, not harm, remains his core justification.

  The student needs to know where the popular account bends truths: it overstates disgust's role, inverts Devlin's morality/conventions position, and obscures how Hart's empirical rebuttal actually strengthens against the misrepresented Devlin. Their pro tanto approach can incorporate Devlin if framed as "social cohesion interests" rather than moral wrongs per se.
answer: |-
  Here's a forensic audit of the paragraph and your specific queries, drawing solely on the canonical understanding of the Hart/Devlin debate within legal philosophy (British English maintained):

  **1. Paragraph Claim-by-Claim Audit:**

  *   **"Devlin's 1959 Maccabaean lecture was his answer to the Wolfenden Report..."**: **Straight.** Correct context.
  *   **"...a society is not merely a collection of people... held together by a common set of moral ideas..."**: **Legitimate Simplification.** Devlin *did* argue that shared morality is the essential "bond" or "seam" holding society together. He likened it to treason – undermining foundational morality risks societal disintegration.
  *   **"...if too many of those ideas go the society stops being a society."**: **Legitimate Simplification (leaning slightly strong).** Devlin argued that the *foundational* moral principles constituting the society's "seam" couldn't be eroded without disintegration. It wasn't about "too many ideas" generally, but the core ones defining the shared public morality.
  *   **"On that basis the law may criminalise conduct that is immoral even where it harms nobody..."**: **Straight.** This is the core of Devlin's legal moralism. He explicitly rejected the "harm principle" as the *sole* justification for criminalisation.
  *   **"...for much the same reason that it may criminalise sedition."**: **Straight/Accurate Analogy.** Devlin frequently used the treason/sedition parallel to illustrate how attacks on shared morality could be as destabilising as attacks on the state itself.
  *   **"Devlin's test... consult the ordinary reasonable person..."**: **Straight.** This is central to his argument.
  *   **"...if that person responds with disgust, indignation and intolerance..."**: **Distortion.** Devlin used the phrase **"intolerance, indignation, and disgust"**. Crucially, he argued that **"intolerance"** was the key indicator. Disgust or indignation alone were *not* sufficient. "Intolerance" signified a profound feeling that the conduct *ought not to be tolerated by society*, threatening the moral fabric. The book reverses the emphasis and omits the crucial primacy of "intolerance".
  *   **"...the state is entitled to act."**: **Over-Simplification.** Devlin argued this gave the state a *prima facie* justification or *entitlement* to legislate, **not** an absolute mandate. He explicitly acknowledged countervailing principles like privacy and individual liberty that could *outweigh* this entitlement in specific cases (see point 2).
  *   **"Note that Devlin was no relativist..."**: **False/Distortion.** This is a **significant error**. Devlin **explicitly rejected** enforcing "true morality" or "natural law". His *entire argument* was grounded in **positive morality**: the *actual*, *shared* moral feelings of the society at that time, as discerned by the reasonable person. He stated: "I am not... arguing in favour of the enforcement of morality as such... I am arguing that *the suppression of vice is as much the law's business as the suppression of subversive activities*..." and crucially, "**The morals which the criminal law may enforce must be those which are accepted by the society... not morals which the judges think ought to be accepted.**" The book fundamentally misrepresents his position here.
  *   **"...he took the Wolfenden recommendation to be wrong in principle..."**: **Straight.** Devlin did argue it was wrong in principle because it abandoned the state's legitimate role in upholding the foundational shared morality (as he defined it).
  *   **"Hart's reply... showed that societies absorb enormous moral change without coming apart..."**: **Straight (Hart's core empirical claim).** Hart's primary counter-argument was empirical and historical: societies demonstrably *do* undergo significant moral shifts (e.g., on usury, divorce, religious dissent) without collapsing. This directly challenged Devlin's factual premise about the *necessity* of legal enforcement for societal survival.
  *   **"...so Devlin's factual premise was false and nothing survived of the case for legal moralism."**: **Legitimate Simplification (but a strong one).** Hart *did* argue that Devlin's core empirical claim (enforcement necessary to prevent disintegration) was false. He also argued this fatally undermined Devlin's specific justification. However, Hart *didn't* necessarily claim "nothing survived" of legal moralism *in any form* – he demolished *Devlin's specific societal-disintegration argument* for it. Other justifications for legal moralism (e.g., based on perfectionism, though Hart opposed these too) weren't directly addressed by this empirical point.

  **2. The "Refreshingly Democratic" Line & Constraints:**

  *   **Fairness of "Refreshingly Democratic"?** Somewhat fair *in contrast* to alternatives. Compared to judges imposing "true morality" or purely elite views, Devlin's "reasonable person" test *does* ground legitimacy in popular sentiment. However, calling it "refreshingly democratic" is a value judgement. Critics see it as majoritarian tyranny dressed up.
  *   **Did Devlin make popular revulsion the criterion?** Yes, **but crucially defined as "intolerance, indignation, and disgust" with "intolerance" as the key indicator of a threat to the fabric**. Disgust alone was *not* enough.
  *   **Did he think disgust alone entitled the state?** **No.** As above, disgust was one indicator, but the key feeling was *intolerance* signifying a judgment that the conduct *should not be tolerated* by society. Furthermore...
  *   **Constraints:** Devlin **explicitly built in constraints**, integral to his argument, not bolted on:
      *   **The "Tolerance Threshold":** The feeling had to be one of *intolerance*, not mere dislike or disgust. It had to be strong enough to signify a threat.
      *   **Privacy:** He acknowledged a realm of privacy where the law should be slow to intrude, even if conduct was immoral. His argument focused on conduct damaging the *public* moral fabric.
      *   **Pace of Change:** He conceded that law should not try to stem the tide of *genuine* moral change, only to prevent the erosion of *existing* foundational morality before society had genuinely shifted. Law should lag behind, not lead, *unless* the change threatened disintegration (which he thought Wolfenden did).
      *   ***Prima Facie* Justification:** He repeatedly stated that the "intolerance" test provided a *prima facie* case for legislation, **not** a conclusive one. **This is vital.** He acknowledged that individual liberty was also a fundamental principle. Legislatures must *weigh* the *prima facie* case for suppression based on upholding morality against the *prima facie* case for liberty based on privacy and freedom from interference. He thought, *in the case of homosexuality*, the balance favoured suppression. But the structure of weighing competing principles *is internal to his argument*.

  **3. The "True Morality" Sentence:**

  *   **Is it right?** **No. It is fundamentally wrong.** As established in point 1, Devlin **explicitly rejected** enforcing "true morality". His entire case was based on enforcing the **positive, shared morality of the society as it exists** ("the moral judgements of society"), as discerned by the reasonable person. He was adamant judges shouldn't impose their own views of what morality *should* be.
  *   **Does anything turn on it?** **Absolutely, critically.**
      *   **Hart's Criticism Landing:** Hart's empirical critique ("societies survive moral change") **lands *harder* against the *actual* Devlin.** If Devlin were arguing for enforcing *true* morality, one could retort: "But society abandoned the *false* old morality for the *true* new one, hence no disintegration!" However, against the *real* Devlin (enforcing *current* shared morality), Hart's point is: "Look, societies *do* change their shared morality on fundamental issues (like religion), and they *don't* disintegrate as a result. Therefore, your claim that enforcing the *current* shared morality is *necessary* to prevent disintegration is empirically false."
      *   **Vulnerability:** A "true morality" Devlin would be a **different kind of legal moralist** (closer to natural law). His vulnerability would shift from empirical (can societies change without collapsing?) to epistemological (how do we *know* the "true" morality?) and philosophical (why should the state enforce *true* morality, even without harm?). The *actual* Devlin's vulnerability *is* primarily the empirical one Hart attacked.

  **4. Hart's Objection & "On its own terms":**

  *   **Empirical, Conceptual, or Both?** **Primarily Empirical, but with strong conceptual underpinning.**
      *   **Empirical:** The core thrust was historical/sociological: societies demonstrably *have* undergone profound moral changes without disintegrating, disproving Devlin's claim that such enforcement is *necessary* for societal survival.
      *   **Conceptual:** Underpinning this was Hart's commitment to the **Harm Principle** (only harm to others justifies criminalisation) and a **liberal concept of morality**. He argued that conflating immorality with "crimes against society" like treason was a category error. Immoral conduct (like private homosexuality) doesn't *attack* society in the way treason does. He also argued Devlin confused disgust with genuine harm.
  *   **Did he give Devlin any part of the starting premise?** **Yes, conditionally.** Hart *granted for the sake of argument* Devlin's core premise: that *if* the suppression of vice were *necessary* to prevent society's disintegration, then the state *might* have a justification for it. Hart then argued that the empirical evidence showed this *necessity* simply didn't exist.
  *   **Does "on its own terms" survive?** **Yes, largely.** Hart's empirical critique *does* operate "on Devlin's own terms" by accepting the *conditional* validity of the disintegration thesis *if true*, and then demonstrating it *isn't* true. While Hart clearly held liberal assumptions about harm and morality, his *primary* rebuttal (the empirical one) didn't *rely* on smuggling in the harm principle *as a premise against Devlin*. He used the harm principle *conceptually* to challenge the analogy to treason and the nature of the threat, but the knockout blow was the empirical observation: societies change without collapsing, so the necessity isn't there. Devlin could (and did) reject the harm principle, but couldn't escape the historical fact Hart presented. Hart successfully showed that *even if* one accepted Devlin's starting point (society needs shared morality, law can uphold it to prevent collapse), the evidence shows this collapse doesn't happen from moral change, removing the *justification* for that enforcement *within Devlin's own framework*.

  **5. Recruiting Devlin for Your *Pro Tanto* Structure:**

  *   **Can you recruit Devlin?** **Yes, defensibly, with careful framing.**
  *   **Reading Against the Text?** **Not entirely.** The structure of Devlin's argument **strongly supports a *pro tanto* reading:**
      1.  **Step 1 (The *Pro Tanto* Reason):** Conduct provoking "intolerance, indignation, and disgust" in the reasonable person (signifying a threat to the foundational shared morality) provides a **"prima facie" justification** (his exact term) for criminalisation – this *is* your *pro tanto* reason (a real reason to criminalise, grounded in preserving societal cohesion).
      2.  **Step 2 (The Weighing Exercise):** This *prima facie* justification **must be weighed against** the competing *prima facie* claim for individual liberty and privacy. He explicitly stated that "there is *a* case for intervention" (i.e., the *pro tanto* reason exists), but it must be balanced against "the case for liberty". He thought the balance favoured criminalisation for homosexuality, but the *structure* of balancing competing principles is clear.
  *   **Would a Devlin Defender Accept Your Framing?** A thoughtful defender **would likely accept this structural framing.** They would argue:
      *   Devlin identified a genuine, distinct *pro tanto* reason for criminalisation (upholding shared foundational morality to prevent social disintegration) that exists *independently* of harm to specific individuals.
      *   He correctly recognised this reason must be weighed against other important considerations, primarily liberty/privacy.
      *   His "reasonable person" test was the mechanism for identifying when this *pro tanto* reason *arises* (when conduct threatens the moral fabric sufficiently).
  *   **Turning Him into a Harm-Principle Theorist?** **No.** The key distinction remains:
      *   **Your Framework:** "A moral wrong gives the state a *pro tanto* reason..." - This *could* be interpreted as the wrong *itself* being the reason, potentially detachable from harm/social cohesion.
      *   **Devlin's Core Justification:** His *pro tanto* reason is **explicitly and solely grounded in preventing the *harm* of societal disintegration**, caused by the erosion of its foundational moral fabric. The "moral wrong" is only relevant *because* its toleration (according to the reasonable person) causes this *social harm*. He didn't think criminalising *mere* immorality was justified; only immorality that threatened the *existence* of society. **The reason is societal protection (a form of harm prevention), *triggered* by widespread moral condemnation of the conduct.**

  **Conclusion:** The book's summary contains a crucial error regarding Devlin's relativism/positivism (he enforced *current* shared morality, not "true" morality) and over-simplifies his test (over-emphasising disgust, underplaying intolerance and the *prima facie*/weighing structure). Hart's empirical critique successfully undermined the *necessity* claim central to Devlin's specific justification, even on Devlin's own terms. Your *pro tanto* structure is compatible with Devlin's argument, provided the *pro tanto* reason is understood as being grounded in the prevention of societal harm (disintegration) via the enforcement of *current* shared foundational morality, identified by the reasonable person's intolerance, and subject to being outweighed by liberty/privacy concerns. He remains distinct from a harm-principle theorist because the harm he seeks to prevent is societal collapse via moral decay, not direct harm to identifiable individuals from the conduct itself.
