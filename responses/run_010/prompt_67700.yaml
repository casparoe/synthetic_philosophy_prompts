answer: |-
  Here’s a reading of *Amadeus* through your Plutarchan ethics lens, acknowledging tensions:

  1.  **Salieri & the Pericles Mistake:** Absolutely, Salieri commits Plutarch’s cardinal error from the *Pericles*. He doesn't merely admire Mozart's divine music; he conflates adoration of the *work* with the existential necessity of *being the workman* who created it. His identity as God's chosen vessel is shattered by Mozart's existence. The film *explicitly* frames this as his tragic flaw and spiritual corruption. His torment stems precisely from this conflation – he cannot separate the beauty of the art from the perceived injustice of its creator (both Mozart and God). The film *knows* this is the mistake; it’s the engine of the plot and Salieri’s damnation.

  2.  **Plutarchan Life or Malicious Portrait?** *Amadeus* is fundamentally **anti-Plutarchan** in its sourcing. Plutarch demands reliable witnesses and warns against malice (Herodotus). Here, the *only* sustained portrait of Mozart comes through Salieri – the epitome of the envious, malicious narrator Plutarch condemns. Does the envy make it trustworthy? Only in revealing *Salieri's* obsession and *his* perception of Mozart's character. The film leans into this: Mozart’s vulgarity and irreverence are filtered through Salieri's disgust, while his genius is filtered through agonized awe. We get Plutarchan "small gestures" (the giggle, the scatology, the childlike play) *but* entirely mediated by envy. This mediation *is* the point – it forces us to question *any* biographical portrait's objectivity. The film shows the *danger* Plutarch feared: the life is distorted by the narrator's vice.

  3.  **Hagiography at the End: Failure or Point?** The ending *does* tip towards hagiography – the dying Mozart composing the *Requiem*, Salieri acting as scribe, bathed in celestial light, achieving transcendent beauty amidst suffering. This is **both a failure of Plutarchan ethics and the film's deliberate culmination**.
      *   *Failure:* Plutarch seeks balanced, character-revealing truth, not myth-making. The ending simplifies, elevates, and sanctifies Mozart, obscuring his flaws in a final blaze of genius. It risks becoming "monument" over "mirror".
      *   *Point:* The film argues this elevation is *inevitable* and *performed*. Salieri, the malicious narrator, *creates* this hagiographic moment. He constructs Mozart's martyrdom to fuel his own war with God ("mediocrity everywhere... I absolve you!"). The hagiography is Salieri's final, envious act – appropriating Mozart's genius to craft his own myth of victimhood and revenge. The film critiques the *impulse* to hagiography (often born from envy or guilt) while demonstrating its seductive power.

  4.  **Where the Lens is Forced:** You’re applying Plutarch’s *methodological* ideals (reliable sources, balanced character study, didactic mirror) to a film that is *about the failure and corruption of those ideals*. *Amadeus* is less a Plutarchan life of Mozart and more a Plutarchan life of *Salieri* using Mozart as the catalyst. Forcing it to be a "Life of Mozart" in Plutarch's terms highlights how radically the film departs from that model.

  5.  **Learning from a Life Beyond Plutarch's Imitation:** Plutarch's model ("use lives as a mirror") assumes a rational, virtuous learner seeking emulation. *Amadeus* shows a darker reality:
      *   **The Danger of Comparison:** Salieri doesn't use Mozart as a mirror for self-improvement; he uses him as a measure of his *inadequacy*, leading to despair and destruction. Genius becomes an unbearable standard, not an inspiration.
      *   **The Corruption of Envy:** Learning is impossible through the lens of envy. Salieri learns only about his own bitterness and God's silence, not how to be better. Envy distorts the reflection entirely.
      *   **Genius as Unknowable/Unimitable:** The film suggests Mozart's genius is divine, chaotic, innate – fundamentally *unlearnable*. Plutarch assumes character and virtue can be cultivated through emulation. *Amadeus* presents genius as a terrifying, alien gift that resists imitation and destroys those who try to possess it vicariously (Salieri) or fail to manage it (Mozart himself). The "lesson" isn't virtue, but the perilous cost and isolating nature of transcendent talent, witnessed through the lens of corrosive envy.

  **In essence:** *Amadeus* uses Plutarchan concerns (character revelation through detail, the danger of malice, the purpose of biography) to stage their subversion. Salieri embodies the Pericles mistake and the Herodotean malice, making him the *worst* possible Plutarchan biographer. The resulting portrait of Mozart is mediated, distorted, and culminates in a hagiography that is both aesthetically powerful and ethically suspect. The film argues that learning from a life like Mozart’s, through the lens of envy, is impossible; it leads not to virtuous emulation, but to existential crisis and destruction, exposing a limitation in Plutarch’s optimistic model of biographical learning.
