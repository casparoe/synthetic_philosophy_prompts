  I teach a seminar on the ethics of biography and next week we screen Amadeus after two weeks on Plutarch: the Alexander proem (lives aren't histories, and a jest or some small gesture reveals character better than the biggest battles), the passage at the start of the Pericles where he insists that admiring a fine work doesn't make you want to be the man who made it — the piper, the perfumer, the sculptor — the Aemilius Paulus remark about using the lives as a mirror to fashion your own, and his attack on Herodotus for malice.

  What I want is a reading of the film through that apparatus, not a summary of either side. Does Salieri commit the Pericles mistake — adoring the work and needing to be the workman — and does the film know that's the mistake? Is this a Plutarchan life at all when our only access to Mozart runs through exactly the envious narrator Plutarch wants to police, or is the envy what makes the portrait trustworthy? And where does it tip into hagiography (I'm thinking of the ending) — is that a failure of the form or its point? Be honest about where I'm forcing the lens, and say what the film shows about learning from a life that Plutarch's imitation model can't accomodate. No quotes needed.
