  The ending of Amadeus verges on hagiography—Mozart is sanctified, his flaws overshadowed by his genius. Is this a failure? The film might be saying that myth-making is inevitable when genius is involved, which Plutarch's method tries to avoid. But the film's point could be that such elevation happens despite intentions, so it’s a comment on biography itself. 

