  First, I'll address their three specific requests. The retroactivity decomposition seems valid—I break it into offense definition, jurisdictional authority, and procedural standards. The jurisdictional angle (who convenes) is indeed the core tension, as no pre-existing treaty established tribunal-creating bodies. For the bootstrapping trilemma, I confirm it's real: condition (a) must yield because victors are the only feasible conveners post-conflict. The counterfactual test is crucial—I apply it to Tokyo's rushed procedures to show how minor changes could undermine legitimacy.

  The two additional cases reveal deeper requirements. A neutral-led tribunal with hypocritical members would suffer worse legitimacy damage than partisan victors—hypocrisy corrodes the precedent's integrity. The Kaiser case shows custody matters, but the key is legal groundwork: Nuremberg built on 1928 Kellogg-Briand while Versailles offered only moral condemnation.

  The requirements cluster into three buckets: foundational justice principles (like nullum crimen sine lege), context-specific critiques (e.g., victor-convening necessity), and empirical questions (actual fairness of procedures). The major conflict is between prohibiting retroactive jurisdiction and the impossibility of pre-constituted neutral tribunals—hence the verdict singles out jurisdictional retroactivity as the biggest hurdle.

  Throughout, I anchor each requirement to tribunal flaws: Nuremberg's aggressive war charge stretching ex post facto limits, Tokyo's omitted defenses proving differential treatment. The user's lede holds—the trilemma forces trade-offs, with victor-convening being the pragmatic sacrifice. By framing hypocrisy as worse than partisanship and highlighting Kellogg-Briand's role, I give them fresh angles beyond tired "victors' justice" rhetoric.
answer: |-
  Here’s the spec: a list of requirements for evaluating the legitimacy of retroactive punishment in the Nuremberg/Tokyo tribunals, sorted by category, anchored in concrete tribunal actions, and incorporating your three focal points.

  ---

  ### **I. Non-Negotiable (Foundational Criminal Justice Principles)**
  1. **Nullum Crimen Sine Lege (No crime without law)**  
     *Requirement*: The offense must have been reasonably foreseeable as criminal at the time of commission.  
     *Tribunal Case*: Nuremberg’s "Crimes Against Peace" charge (waging aggressive war) relied on pre-war treaties (e.g., 1928 Kellogg-Briand Pact) and state practice. Critics noted no individual had *actually* been tried for it before. **Failure here invalidates the trial’s core legitimacy.**  

  2. **Right to Mount a Defense**  
     *Requirement*: Defendants must have meaningful opportunity to challenge charges and evidence.  
     *Tribunal Case*: Tokyo Tribunal denied Japanese defendants’ attempts to introduce evidence of Allied atrocities (e.g., Soviet invasion of Manchuria, U.S. firebombing). **Empirical failure undermines procedural fairness.**  

  3. **Individual Culpability**  
     *Requirement*: Punishment requires proof of personal agency, not guilt by association.  
     *Tribunal Case*: Nuremberg convicted Jodl/Keitel for implementing orders; Tokyo convicted foreign minister Shigemitsu despite evidence he opposed war policies. **Lapses here risk show trials.**  

  ---

  ### **II. Context-Specific Demands**  
  #### **Critics’ Purity Tests**  
  4. **Impartiality of Tribunal Creators**  
     *Requirement*: Convening powers must not themselves be credibly accused of similar acts.  
     *Tribunal Case*: Soviets (Nuremberg judges) committed Katyn massacre; U.S. (Tokyo architect) firebombed Japanese cities. **Hypocrisy invalidates moral authority.**  

  5. **Equal Application of Law**  
     *Requirement*: Tribunal must indict offenses regardless of perpetrator affiliation.  
     *Tribunal Case*: No Allied leaders tried for atomic bombings, unrestricted submarine warfare, or Soviet atrocities. **Selective prosecution = victors’ justice.**  

  #### **Defenders’ Minimum Bar**  
  6. **Foundational Necessity**  
     *Requirement*: Ad hoc tribunals are legitimate if no prior mechanism exists to address unprecedented atrocities.  
     *Tribunal Case*: Holocaust demanded response beyond domestic courts (complicit/collapsed). **Bootstrapping trilemma forces acceptance of victor-convening.**  

  7. **Positive Legal Anchors**  
     *Requirement*: Charges must cite pre-existing treaties/customs, even if untested.  
     *Tribunal Case*: Nuremberg cited Hague Conventions (1907) and Kellogg-Briand. **Mitigates retroactivity of offense definition.**  

  ---

  ### **III. Empirical Requirements (Not Philosophical)**  
  8. **Procedural Fairness in Practice**  
     *Requirement*: Actual trial conduct must afford due process (e.g., evidence disclosure, cross-examination).  
     *Tribunal Case*: Tokyo rushed proceedings (1946–48), with limited defense resources vs. prosecution. **Record shows imbalance.**  

  9. **Political Independence of Judges**  
     *Requirement*: Adjudicators must resist pressure from convening states.  
     *Tribunal Case*: Nuremberg judges avoided overt interference; Tokyo’s President Webb faced U.S. pressure to convict Emperor (failed). **Mixed record; partial success.**  

  ---

  ### **Your Focal Points Resolved**  
  **1. Retroactivity Decomposition (Real & Critical)**  
     - **Offense Definition**: Nuremberg’s "aggressive war" charge stretched *nullum crimen* (Critics’ focus).  
     - **Jurisdiction**: No pre-treaty authorized victors to create tribunals. **Core legitimacy problem**.  
     - **Defenses/Standards**: Tokyo denying "tu quoque" defenses violated fairness.  
     → *Jurisdiction does the heaviest lifting*: Even if crimes were foreseeable, victors as judges remains irreducibly retroactive.  

  **2. Bootstrapping Trilemma (Real)**  
     - (a) Pre-existing law for tribunal creation **must give way**.  
     - Victor convening is the *only* way to satisfy (b) adjudicator distance (neutrals lack power/access) and (c) custody over perpetrators.  
     → **Lede survives**: Foundational justice requires accepting victors’ role.  

  **3. Counterfactual Variation Requirement**  
     - *Legitimizing change for critics*: Neutral-convened tribunal (e.g., Switzerland/Sweden) trying Nazis *and* Allied leaders (e.g., for Dresden).  
     - *Delegitimizing change for defenders*: Nuremberg convicting solely for "aggressive war" (weakest charge) while ignoring Holocaust evidence.  
     → **Bites on Tokyo**: Adding Soviet judges while USSR invaded Manchuria (1945) would have turned partisanship into hypocrisy, worsening defect.  

  ---

  ### **Required Cases Addressed**  
  **Hypocritical Neutrals Tribunal**  
     - *Defect*: Hypocrisy (neutral state committing indicted acts) **worse** than partisanship.  
     - *Why*: Partisanship is transparent bias; hypocrisy corrupts the tribunal’s *moral precedent*.  
     - *Requirement*: **#4 (Impartiality of Creators)**. Violation here is fatal to perceived legitimacy.  

  **Kaiser vs. Nuremberg**  
     - *Key difference*: **#7 (Positive Legal Anchors)** + **Custody**.  
     - Versailles Treaty (1919) called Wilhelm’s acts "supreme offence against international morality" (not law). No trial structure or custody.  
     - Nuremberg had Kellogg-Briand (binding treaty), defined crimes/procedure, *and* defendants in custody.  
     → *Explanation*: **Legality + institutional readiness**, not just time.  

  ---

  ### **Irreconcilable Conflict**  
  **#4 (Impartial Creators) vs. #6 (Foundational Necessity)**  
     - Non-victors cannot create tribunals with power/custody (#6 demands victors).  
     - Victors inevitably have "clean hands" problems (#4 demands purity).  
     → **No tribunal can satisfy both.** Accept #6 or abandon trials for unprecedented crimes.  

  ---

  Verdict: **Jurisdictional Retroactivity** (Requirement: Pre-existing authority to convene tribunal)
