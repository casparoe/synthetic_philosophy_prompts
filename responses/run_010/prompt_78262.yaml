prompt: |-
  so I'm on the moderation team for a neighborhood mutual-aid app and half of us want to replace private warnings with public callouts — basically a switch from guilt to shame — and I keep loosing that argument because everyone insists shame is what actually changes behavior. instead of another memo I want to send them something funnier.

  Write a fake product page for a consumer moral-accountability device, call it SHAME or something better, about 600 words: punchy marketing copy up top, then the terms of service and fine print below. The jokes should come from getting the moral psychology right rather than from just calling the idea dumb, and the copy should make the strongest honest pitch for shame — that it reaches the whole self instead of one act, that it binds people to a community's standards, that guilt with no witnesses is easy to fake. Then let the fine print expose the machinery: shame needs an audience, and you can exit one but you can't exit your guilt; there's no scoping, so the thing flagged is you rather than the deed, and no repair path ships with it; the detectors don't distinguish moral faults from merely embarrassing ones; and the premium tier is the internalized audience, which watches you when nobody else does. Have the copy treat "shame cultures" and "guilt cultures" as product lines you can migrate between, and let the opt-in flow quietly contradict the whole pitch — nobody winks, it reads like real copy.

  After the piece, tell me how confident you are that it's fair to the pro-shame side and not a strawman, and flag the one claim in it you're least sure about — the bit a specialist would most likely say I've got backwards.
