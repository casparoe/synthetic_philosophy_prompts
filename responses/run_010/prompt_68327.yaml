  Okay, let me unpack this user's query. They're deeply engaged with the Knobe effect, frustrated by the lack of convergence in explanations despite robust phenomena. They mention two key events: a failed attempt to find a decisive case between concept and pragmatic accounts, and a pilot study showing unexpected results. Their hypothesis is that the conflict isn't empirical but about differing conceptions of what a "concept" theory should explain.

  First, I need to validate their observation. The user has clearly spent years on this, noting how the effect persists across variations. The core issue seems to be that both major accounts—conceptual competence and pragmatic mechanisms—can explain away each other's evidence. The pilot study's third condition complicates things further, as both camps claimed it supports their view. 

  The user's hypothesis is that this isn't a psychological disagreement but a clash of research programs with different explananda. To evaluate this, I should examine what each side claims. The concept camp (like Knobe) sees moral valence as constitutive of intentional action, treating judgments as competence. The pragmatic camp (like Adams and Steadman) views it as conversational implicature. 

  Key question: Is there any empirical test both sides would accept pre-result? For instance, if the effect vanished in non-linguistic tasks (e.g., behavioral measures), pragmatists might call it evidence for conversational dependence, while concept theorists could argue the concept isn't engaged without linguistic expression. Similarly, if individual differences correlate with moral attitudes, concept theorists might see it as variation in conceptual structure, pragmatists as differential pragmatic sensitivity. 

  Developmental evidence? Concept theorists might predict early emergence of the asymmetry as conceptual competence develops, while pragmatists might expect it to align with pragmatic skill acquisition. But both could reinterpret findings: late emergence as conceptual learning, early emergence as pragmatic socialization. 

  The user's pilot data with the "modest loss" case is telling. The spike in intentionality ascriptions when profit is sacrificed suggests that perceived commitment to an attitude (anti-environment) drives judgments. Both accounts stretch to cover this—concept folks see it as confirming moral valence integration, pragmatists as highlighting blame-avoidance motives. 

  Given this, the user's diagnosis feels correct. The deadlock arises because "intentional" is being analyzed at different levels: one as a linguistic tool (pragmatics), the other as a cognitive structure (conceptual competence). Progress might require either a paradigm shift (e.g., modeling judgment mechanisms without presupposing "concepts") or accepting that "intentional" is a hybrid term requiring multi-level theories. The honest move? Perhaps to reframe the question entirely—e.g., "What cognitive and social functions do asymmetric evaluations serve?"—rather than forcing a winner-takes-all resolution.
answer: |-
  Your diagnosis hits the nail on the head. This isn't primarily an empirical stalemate about psychology—it's a **clash of explanatory frameworks with fundamentally different conceptions of what a "concept" is and what a theory of concepts should explain**. Both camps can absorb each other's evidence because they're solving different puzzles. Let me argue for this using their core claims:

  ### 1. **The Two Camps' Core Explananda**
     - **Concept-as-Competence Camp**: They claim the Knobe effect reveals the *actual structure of our cognitive competence*. "Intentional" isn't purely descriptive; its application conditions *constitutively include moral evaluation*. Progress means mapping this hybrid conceptual structure (e.g., via reflective judgments, cross-cultural stability). For them, robustness *is* evidence—it shows the effect is "baked in."
     - **Pragmatic Camp**: They claim the effect arises from *how language is used in social contexts*. "Intentional" ascriptions are tools for blame/praise, not direct readouts of mental representation. Progress means showing how context (e.g., conversational goals, power dynamics) modulates ascriptions. For them, robustness reflects *entrenched pragmatic habits*, not conceptual necessity.

  ### 2. **Why No Decisive Empirical Test Exists**
     - **Survival in "Non-Conversational" Measures?**  
       Pragmatists could argue *any* human response task involves implicit communication (e.g., "Why is the researcher asking this?"). Concept theorists could dismiss null results in non-linguistic tasks (e.g., reaction times) as irrelevant to conceptual competence.  
       *Example*: If the asymmetry vanished in a behavioral paradigm (e.g., rewarding/punishing the chairman), pragmatists call it "removing conversational pressure"; concept theorists call it "measuring the wrong thing."  
     - **Individual Differences?**  
       Finding subjects who *never* show the asymmetry might satisfy pragmatists (proof it's not mandatory). Concept theorists would call them "deviant" or argue they misapply their own competence.  
     - **Developmental Evidence?**  
       If children show the asymmetry early, concept theorists see innate structure; pragmatists see early-learned pragmatics. If it emerges late, concept theorists see conceptual maturation; pragmatists see acquired social strategies.  

  ### 3. **Your Pilot Study Proves the Point**
     The "modest loss" case (higher intentionality for good side effect) is claimed by both because:  
     - **Concept Camp**: Sees it as confirming that perceived *attitude commitment* (sacrificing profit = stronger anti-environment stance) amplifies moral badness, thus intentionality.  
     - **Pragmatic Camp**: Sees it as heightened *blame-avoidance pressure* (denying intentionality when the agent sacrifices profit seems disingenuous).  
     Neither needs to revise their model—both stretch to cover it. The effect isn't testing their core disagreement.

  ### 4. **What Progress Looks Like (and Doesn't)**
     - **✗ More Robustness Studies**: Will only deepen the trench warfare (concept: "See? Competence!" / pragmatic: "See? Entrenched habits!").  
     - **✗ Forcing a "Decisive" Test**: Both sides can preemptively dismiss unfavorable results as performance errors or task artifacts.  
     - **✓ Reframing the Question**: Stop asking "*Which* explanation is right?" and ask "*How do these levels interact?*"  
       - Formalize the pragmatics (e.g., game-theoretic models of blame-avoidance) *alongside* conceptual structure (e.g., probabilistic representations of attitude commitment).  
       - Treat "intentional" as a *hybrid* construct: its application may *require* both conceptual structure (agent attitude → outcome link) *and* pragmatic goals (social accountability).  
     - **✓ Shifting to Function**: Ask *why* humans have such asymmetric judgments. Does it serve social coordination? Error detection? Both camps might agree it’s for **holding agents accountable for foreseen moral outcomes**, regardless of "core" meaning.  
     - **✓ Stopping the Question**: If the goal was to understand "intentional" in folk psychology, we might declare victory: *It’s a tool for moral evaluation*. The rest is implementation details.  

  ### Verdict
  **You're right.** This is a metalinguistic fight over what constitutes a "concept" and what psychology should explain. The concept camp wants a theory of *stable cognitive structure*; the pragmatists want a theory of *dynamic communicative practice*. Until both sides agree on whether concepts are in the head or in the conversation, no amount of data will resolve it—because **data is theory-laden, and their theories define data differently**. The honest move? Either redefine progress as mapping interactions between these levels, or accept that the Knobe effect reveals a purpose (moral accountability) and move on to how that purpose shapes cognition *and* communication.
