prompt: |-
  I facilitate accountability circles for a housing co-op, about 120 members. Maybe twice a month someone asks to sit on a circle about a conflict, and the same question comes up: does this person's own record with the same kind of conduct disqualify them? The line I've been repeating for years is that hypocrisy costs you your audience but not your argument — we don't fact-check people's moral standing, we just decide who gets to speak and who has to listen. Three cases have me doubting there's only the one thing going on:

  - A member cited twice for all-night noise seven years ago, who's since made amends and been quiet ever since, wants on the circle addressing a new member's repeated noise. He's the only person here who actually understands the pattern.
  - A member who is still subletting her parking space against the rules, and says so openly, wants to facilitate a circle about another member doing exactly that. "I know, I'm working on it," she says, "but I can see it in him clearly."
  - A member who's never broken a rule in her life but moved in six weeks ago and doesn't know either party, wants to facilitate.

  Write a procedure our three-person steering committee could actually run — none of us have philosophy backgrounds beyond what I read on the bus. Questions in order, what counts as a sufficient answer to each, where it lands on "you can participate but not facilitate," where it hands the call to the full membership because it's about values rather than facts, and whether past conduct can be cleared and by what. Ground it in whatever the work on standing to blame and hypocrisy actually distinguishes — no citations needed, I'll chase those down myself if I want them. Then run it on all three cases. I'm fairly sure one of them is going to come out against the person I'd most want in the room, and I want the writeup to say that flatly instead of softening it. Also tell me which of your steps are judgment calls dressed up as procedure, and whether my "audience not argument" slogan is wrong or just incomplete — and if incomplete, what exactly is missing from it.
reasoning: |-
  Okay, the user facilitates accountability circles for a housing co-op with 120 members. They're dealing with a recurring question: should someone's past conduct disqualify them from participating in a circle about similar issues? They've been using the line that hypocrisy costs you your audience but not your argument, meaning they don't fact-check moral standing, just decide who speaks and who listens. But three cases are making them doubt this approach.

  First, I need to understand the three cases clearly. Case 1: A member cited for noise seven years ago, made amends, now wants to address a new member's noise. They understand the pattern. Case 2: A member currently subletting parking against rules wants to facilitate a circle about another member doing the same. She admits it but says she's working on it. Case 3: A new member who's never broken rules but doesn't know the parties wants to facilitate.

  The user wants a procedure for their three-person steering committee. The procedure needs questions in order, what counts as sufficient answers, where participation vs. facilitation is decided, when to refer to full membership, and how past conduct can be cleared. It should be based on concepts like standing to blame and hypocrisy, without needing citations. Then apply it to the three cases, being explicit even if it goes against the user's preference. Also, identify which steps are judgment calls and evaluate their "audience not argument" slogan.

  Breaking down the key concepts: Standing to blame is about having the moral authority to call someone out. Hypocrisy undermines credibility but doesn't invalidate the argument. The user's slogan focuses on the argument's validity regardless of the speaker's hypocrisy, but in group dynamics like this, credibility matters for effectiveness.

  For the procedure, it should be practical. Steps could include: 1. Check for ongoing rule-breaking. 2. Assess recency and remediation. 3. Evaluate understanding and neutrality. 4. Determine facilitation capability. Each step needs clear criteria.

  Step 1: Ongoing violation? If yes, disqualify from facilitation, maybe allow participation if they admit fault and commit to change. Step 2: Past violation? Look at recency and remediation. If recent and unaddressed, no standing. If old and resolved, okay. Step 3: Understanding and neutrality. Do they understand the issue? For facilitation, neutrality might be important. Step 4: Facilitation requires credibility and skill. Judgment calls here involve assessing remediation and neutrality.

  Applying to cases:
  - Case 1: Past noise issue, resolved. Should be allowed to participate and possibly facilitate. They have understanding, so facilitator material.
  - Case 2: Ongoing parking violation. Shouldn't facilitate. Can participate if they admit fault and show commitment to change.
  - Case 3: New member, no rule-breaking. Can facilitate if they demonstrate understanding, but their neutrality is a plus. The user might not want them because of lack of experience, but the procedure should allow it.

  The user mentioned that one outcome might go against their preference. Probably Case 2: they might want her in the room, but the procedure excludes her from facilitating. Need to be explicit about that.

  On the slogan: "Hypocrisy costs you your audience but not your argument" is incomplete. It misses that in communal settings, moral authority (standing) affects whether the message is heard. Also, facilitation requires credibility beyond just having a valid point.

  Judgment calls in the procedure: Assessing "remediation" and "understanding" involves subjective evaluation. The committee needs to discuss and agree.

  Final procedure structure:
  1. Establish standing to participate: Check for ongoing violations. If none, proceed. If ongoing, can they participate? Only if they admit and commit to change.
  2. Determine eligibility for role: Facilitator needs no ongoing issues, resolved past, and neutrality/understanding.
  3. Refer to membership if values conflict, not facts.

  Running cases:
  - Case 1: Eligible for both. Past resolved, has understanding. Facilitator yes.
  - Case 2: Ongoing violation. Can participate if admits and commits, but not facilitate. Steering must decide if admission is sufficient.
  - Case 3: Eligible to facilitate if they show understanding. Neutrality is good. The user might prefer someone else, but procedure allows it.

  Highlighting where the procedure might contradict preferences: In Case 2, the user might want her to facilitate because she "sees it clearly," but ongoing violation disqualifies her. Need to state that plainly.
answer: |-
  Below is a practical, step-by-step procedure for your steering committee to evaluate member requests to participate in or facilitate accountability circles. It's grounded in the concepts of **moral standing** (the right to hold others accountable) and **hypocrisy** (undermining credibility through inconsistent actions), while addressing your core question: *When does a member's own conduct disqualify them from roles in the circle?* 

  The procedure prioritizes **community trust**, **effectiveness**, and **restorative justice** over abstract moral debates. It distinguishes between **participation** (speaking/listening in the circle) and **facilitation** (guiding the process neutrally), since facilitation demands higher credibility. I'll flag judgment calls clearly and end with an analysis of your slogan. Finally, I'll apply the procedure to your three cases bluntly—including where it contradicts your preferences.

  ---

  ### **Procedure for Evaluating Member Requests**
  **Who runs it:** 3-person steering committee  
  **Time required:** 10–15 minutes per case (use a quick consensus vote if disagreements arise).  
  **Input needed:** The requester’s stated role (participant/facilitator), their relevant conduct history, and their self-disclosure about it.  

  #### **Step 1: Identify Ongoing Rule Violations**  
  - **Question:** *"Is the member currently violating the same or a closely related rule they’re addressing?"*  
  - **Sufficient answer:**  
    - If **NO → Proceed to Step 2.**  
    - If **YES →**  
      - They **cannot facilitate** (ongoing violations destroy neutrality and moral standing).  
      - They **may participate ONLY if**:  
        - They admit the violation openly in the circle.  
        - They commit to a concrete plan/timeline to resolve it (e.g., "I’ll stop subletting by next month").  
  - **Refer to full membership?** Only if the violation reveals a **values conflict** (e.g., "Should this rule even exist?"). Otherwise, it’s a **fact-based decision**.  
  - **Judgment call:** Assessing "closely related rules" (e.g., noise vs. parking violations aren’t identical, but both involve disregard for communal space).  

  #### **Step 2: Assess Past Violations (If Applicable)**  
  - **Question:** *"If they have past violations, are they resolved and sufficiently distant?"*  
  - **Sufficient answer:**  
    - **Resolved** = They made amends (e.g., apologized, repaired damage, changed behavior).  
    - **Sufficiently distant** = No recurrence for ≥2 years (adjustable based on severity; minor issues like noise may need less time than theft).  
    - If **YES → Proceed to Step 3.**  
    - If **NO** (unresolved or recent) → They **cannot facilitate**. They **may participate ONLY if** they acknowledge the past issue and show insight (e.g., "I used to do this; here’s how I learned").  
  - **Can past conduct be cleared?** Yes, through **remediation + time**. No formal "clearing" needed—focus on demonstrable change.  
  - **Refer to full membership?** Never—this is fact-based.  
  - **Judgment call:** Defining "sufficiently distant" (your committee sets a benchmark; e.g., 2 years for minor issues, 5 for major).  

  #### **Step 3: Evaluate Understanding and Neutrality**  
  - **Question:** *"Do they have relevant insight into the issue, and can they be reasonably neutral?"*  
  - **Sufficient answer:**  
    - For **participation**: Insight OR lived experience is enough (e.g., "I’ve dealt with noise complaints"). Neutrality not required.  
    - For **facilitation**: Must show **both**:  
      - **Insight**: Clear understanding of the rule, its impact, and patterns (e.g., "Noise escalates when unaddressed because...").  
      - **Neutrality**: No active conflict with involved parties OR willingness to disclose biases upfront.  
  - **Refer to full membership?** Only if neutrality requirements clash with co-op values (e.g., "Must facilitators always be disinterested?").  
  - **Judgment call:** Gauging "insight" and "neutrality" (e.g., a new member might lack insight but gain it quickly; someone close to the conflict may still facilitate if they disclose biases).  

  #### **Step 4: Final Role Assignment**  
  - **Facilitation approval requires**:  
    - No ongoing violations (Step 1).  
    - Resolved/distant past violations (Step 2).  
    - Demonstrable insight + neutrality (Step 3).  
  - **Participation approval requires**:  
    - For ongoing violations: Admission + commitment to change (Step 1).  
    - For unresolved past violations: Acknowledgment + insight (Step 2).  
    - All others: No barriers.  
  - **Hard stops:** Never exclude someone *solely* for past resolved violations—this punishes growth.  

  ---

  ### **Application to Your Cases**
  I’ll run each case through the procedure, with **direct conclusions** as requested. Per your warning, Case 2’s outcome explicitly excludes the person you likely "want in the room" (the parking subletter). I won’t soften it.  

  #### **Case 1: Member with past noise violations (resolved, 7 years ago) wants to participate/facilitate on new noise issue.**  
  - **Step 1:** No ongoing violation → Proceed.  
  - **Step 2:** Past violation resolved and distant (7 years > 2-year benchmark; amends made) → Eligible for facilitation.  
  - **Step 3:** High insight ("understands the pattern") → Strong candidate for facilitation.  
  - **Outcome:** **APPROVED for facilitation.** Their past is an asset here—they offer proven remediation insight.  

  #### **Case 2: Member currently subletting parking wants to facilitate on another’s subletting.**  
  - **Step 1:** **Ongoing violation** (same rule) → **Cannot facilitate.** May participate ONLY if she admits and commits to change.  
  - **Step 2:** Not needed (ongoing violation already disqualifies facilitation).  
  - **Step 3:** She shows insight ("I can see it in him clearly"), but irrelevant due to Step 1.  
  - **Outcome:** **REJECTED for facilitation.** MAY PARTICIPATE if she says in the circle: "I’m doing this too and will stop by [date]. Here’s why it’s damaging..." *This contradicts your likely preference for her as a facilitator. The procedure excludes her because ongoing identical conduct obliterates moral standing—she can’t neutrally hold others accountable while doing the same. Her self-awareness ("I know, I’m working on it") is commendable but insufficient for facilitation.*  

  #### **Case 3: New member (no violations, no party knowledge) wants to facilitate.**  
  - **Step 1:** No violations → Proceed.  
  - **Step 2:** No past violations → Proceed.  
  - **Step 3:** Insight? Unclear—she’s new and doesn’t know parties. Neutrality? Likely high. For facilitation, she must demonstrate insight (e.g., "I’ve reviewed past cases and see noise impacts sleep/trust"). If she can’t, she’s better as a participant.  
  - **Outcome:** **CONDITIONALLY APPROVED for facilitation.** She must show basic understanding (e.g., via a 5-minute primer on the issue). If she can’t, APPROVED for participation only. No past conduct = no standing issues.  

  ---

  ### **Analysis of Your Slogan: "Hypocrisy costs you your audience but not your argument"**  
  Your slogan is **incomplete, not wrong**. It rightly separates the *validity of an argument* from the *credibility of the speaker* (e.g., a noisy person can correctly argue that noise disrupts sleep). But in **communal accountability settings**, two elements are missing:  

  1. **Moral Standing (Standing to Blame)**:  
     - Hypocrisy isn’t just about "losing your audience"—it can *void your right to speak* in a restorative process. If you’re actively harming the community while judging others for the same harm, your role undermines trust and fairness. Your procedure already acknowledges this by excluding ongoing violators from facilitation.  
     - **What’s missing**: Arguments require moral authority to land. A hypocritical facilitator can’t enforce accountability without breeding resentment.  

  2. **Contextual Effectiveness**:  
     - In circles, the "audience" isn’t passive—it’s the *community*. Hypocrisy doesn’t just cost you attention; it can sabotage resolutions (e.g., the accused member dismisses feedback: "Why should I listen to you?").  
     - **What’s missing**: Practical outcomes matter. If hypocrisy prevents behavioral change, the argument’s validity is irrelevant.  

  **Revised slogan for your context**:  
  *"Hypocrisy undermines your standing, not your point—but in circles, standing is what turns points into progress."*  

  ---

  ### **Judgment Calls Dressed as Procedure**  
  These steps require committee discretion. I’ve made them explicit:  
  - **Step 1:** Defining "closely related rules" (e.g., is subletting parking like subletting a unit?).  
  - **Step 2:** Setting the recency benchmark (2/5 years?) and assessing "amends" (is an apology enough, or must behavior change be proven?).  
  - **Step 3:** Gauging "insight" and "neutrality" (e.g., does a new member’s ignorance outweigh their impartiality?).  

  ### **Final Recommendation**  
  Adopt this procedure as a living document—review it annually with your co-op. For Case 2, consider involving the parking subletter as a **participant** if she commits to change; her insight is valuable but ethically compromised for facilitation. If your committee frequently deadlocks on judgment calls, add a "tiebreaker" rule (e.g., majority vote). This system balances principle with pragmatism, letting you focus on conflict resolution without philosophy degrees.
