prompt: |-
  Been reading the rationalist blogosphere for like fifteen years now (LW, the old Overcoming Bias days, SSC, and the forecasting threads that keep spinning off them) and the person I've argued with longest is a friend I'll call V. V writes these "forecast autopsy" posts where she takes some famous long-range prediction, rules it dead, alive, or "right but early," and then gets flamed in the comments for a week. She's easily the most consistent reasoner I know, but she never states her criteria, and I want to reverse-engineer them so I can argue with her properly instead of just vibes-back.

  Her rulings so far, with the one-liner she gave each time:

  - Malthus: population went up, food supply went up faster, no global subsistence collapse. Dead, and not "right but early." Her line was that the escape came from a place his model had no room for.
  - Hubbert, US oil production peaking around 1970: it did. She gives him real credit, and specifically because the date was derived from the discovery-and-production curve rather than asserted.
  - The global peak-oil crowd of the mid-2000s: dead as stated. She calls the later pivot to "well, peak oil *demand*" a re-dating without a re-derivation.
  - Keynes's 1930 essay about a fifteen-hour workweek for his grandchildren's generation: dead, even though the century he named hasn't run out yet. Reason: the thing that was supposed to produce the leisure arrived on schedule and then some, so the timing excuse isn't available to him.
  - Ehrlich vs Simon, the wager over five metal prices across a decade: Ehrlich lost and kept insisting scarcity was still coming. She calls that a degenerating rescue — the auxiliary showed up after the check cleared and predicted nothing new.
  - Wegener: continents moving was right, and the physics objection (his proposed driving forces were orders of magnitude too weak) didn't kill it, because the evidence for the claim — matching coastlines, fossil distributions, glacial scratch marks — never depended on his motor. She contrasts this with Malthus explicitly: Malthus's evidence *was* the mechanism.
  - Y2K: she'll grant that nothing happening isn't proof there was no bug, but she refuses to let that buy "right but early." Credit attaches to the warning, not to the forecast date, and once you accept the fix worked the forecast is spent.

  Now the case that's up next, which somebody brought to the thread and which I have opinions about but can't pin down. Details as I've got them:

  A hydrology group projected in the mid-90s that a big semiarid breadbasket aquifer would, at then-current pumping rates, fall below the lift depth needed for irrigation within about twenty years, after which irrigated acreage would collapse and people would leave. Those twenty years came and went. Levels are down, some wells got deepened, but acreage and yields went *up* and there was no migration event. Twelve years before that deadline the same lead author had published a revision pushing the date out roughly another twenty years, on two grounds: a documented shift to drip irrigation, and a new state well-metering and capping regime that had just passed. He re-ran the model on fresh pumping and recharge data rather than tacking years on. His summary was cited in the legislative record when the caps got strengthened a couple years later. Since then the *auxiliary* processes he named — drip adoption, per-hectare withdrawals — have tracked the revision pretty well, better than the headline did. But total pumping has also gone up faster than the original model assumed, because the caps bite on new wells and the metering has exemptions. And this was the third date: an earlier paper by the same author had the collapse arriving around the turn of the millennium, the mid-90s paper moved it out twenty years, the revision moved it out again.

  So: which rules are actually consistent with all seven of V's earlier verdicts? Write them out crisply — I want more than "she's a Lakatosian" or "she's a Popperian," because I'm pretty sure its not either of those and in any case both fit everything and predict nothing. For each candidate rule, say which of her verdicts it nails and which ones it has to stretch. Then tell me what she'll rule on the aquifer case and roughly how confident you are, and where the rule you're betting on comes apart from the runner-up. Also: if she rules one way versus the other, what principle is she adopting that she hasn't had to adopt before — I'd like to be able to say "you're now committed to X" in the comments and have it be true. And give me one more case, real or invented, that I could put to her to separate your top rule from second place at the lowest cost, plus what each rule would say about it.

  Bonus if you think she isn't running a rule at all but a taste test — something like "does the deferral make the theory stronger, or does it look like a guy who doesn't want to lose" — and how you'd tell that apart from a real criterion given nothing but verdicts.
reasoning: |-
  Okay, I need to help reverse-engineer V's criteria for her forecast autopsies based on seven cases and predict her ruling on the aquifer case. Let me start by listing each case and her verdict to find patterns.

  First, Malthus: Dead, not "right but early." She says the escape came from a place his model had no room for. So she's focused on the model's ability to account for changes.

  Hubbert: Credited because the peak was derived from discovery-and-production curves, not just asserted. Importance of derivation from data.

  Global peak-oil (mid-2000s): Dead. Criticized the pivot to peak demand as re-dating without re-derivation. Sticking to the original model matters.

  Keynes: Dead. The productivity gains happened, but leisure didn't increase, so timing isn't an excuse. If the mechanism worked but the outcome didn't, it's wrong.

  Ehrlich vs Simon: Ehrlich lost, degenerating rescue because auxiliary predictions came after and predicted nothing. Post-hoc adjustments without new predictions are bad.

  Wegener: Right despite wrong mechanism because evidence didn't depend on the motor. Contrasts with Malthus where evidence was tied to the mechanism. Core claim vs. mechanism support.

  Y2K: Not "right but early" because credit is for the warning, and fixes made it irrelevant. Forecast is spent after intervention.

  Now, the aquifer case: Projected collapse in 20 years from mid-90s. Didn't happen; acreage and yields up. Author revised date 12 years earlier based on drip irrigation and regulations. Re-ran model with new data. Auxiliary processes tracked well, but pumping increased due to exemptions. Three dates: original, revision, and then another revision.

  Key elements: Author updated the model with new data and processes, auxiliary predictions were accurate, but the main outcome didn't occur because of increased pumping and exemptions. Total pumping up despite caps.

  To find consistent rules:

  1. **Derivation and Updates**: Hubbert got credit for derivation; global peak-oil criticized for no re-derivation. Author here re-ran the model with new data, which V might respect.

  2. **Mechanism vs. Core Claim**: Wegener separated the core claim from the mechanism. For the aquifer, the core claim is collapse due to depletion, but the mechanism (pumping rates) was altered by interventions.

  3. **Post-hoc Adjustments**: Ehrlich's degenerating rescue. Here, the author revised before the deadline with new data, not after failure. Similar to Keynes? But Keynes had the mechanism work but outcome not, while here mechanisms (drip, regulations) worked to reduce per-hectare use, but total pumping increased.

  4. **Interventions**: Y2K fixes made the forecast spent. Here, regulations and tech changes intervened, but the collapse was avoided partly due to those, yet the author updated the model to account for them.

  5. **Model Scope**: Malthus missed exogenous factors. Aquifer model might have missed exemptions or increased well drilling.

  Possible rules:

  - **Rule 1: Credit for forecasts derived from mechanistic models with data, and updates must re-derive with new data.** Hubbert, aquifer author did this. Global peak-oil didn't re-derive for demand.

  - **Rule 2: Core claim must be testable independently of the mechanism if the mechanism is flawed.** Wegener's core claim was supported by evidence independent of mechanism. Malthus's evidence was the mechanism itself. For aquifer, the core claim is aquifer depletion leading to collapse. The evidence (levels dropping, wells deepened) supports depletion, but collapse was avoided by adaptations. So the core claim might be falsified?

  - **Rule 3: "Right but early" requires that the mechanism is intact and only timing is off, with no degenerating rescues.** Keynes: mechanism (productivity) worked, but outcome didn't, so not "right but early." Ehrlich: degenerating rescue. Aquifer: mechanism (depletion) was mitigated by interventions, so timing off but due to changes, not just delay.

  - **Rule 4: Forecasts are spent if interventions prevent the outcome, but credit is for the warning if it led to action.** Y2K: fixes worked, forecast spent. Aquifer: regulations were enacted partly due to the forecast, which might earn credit, but the collapse didn't happen.

  Applying to aquifer case:

  - Author re-derived the forecast with new data (like Hubbert), avoiding the global peak-oil mistake.
  - Auxiliary predictions (drip adoption, withdrawals per hectare) tracked well, suggesting the model has validity.
  - But total pumping increased due to exemptions, which might be outside the model's scope, similar to Malthus missing innovation.
  - The core claim of collapse didn't occur, but due to interventions (regulations, tech) that the author incorporated in revisions.

  V might rule "alive" or "right but early" because the model was updated properly, and auxiliary predictions were correct. However, the headline collapse didn't happen, and the date was pushed multiple times.

  But in Keynes, productivity increased but leisure didn't, so dead. Here, depletion is happening (levels down), but collapse avoided by adaptations. The core claim might be falsified if collapse was predicted and didn't occur.

  Wegener's core claim was right despite wrong mechanism. Here, the core claim of depletion is happening, but the outcome (collapse) was prevented. So is the core claim "depletion will cause collapse" or "depletion is happening"?

  In the original prediction, it was depletion leading to collapse. The revision pushed the date due to reduced per-hectare use, but total pumping increased, so depletion might still be ongoing.

  V might see it as a win for the warning leading to interventions, similar to Y2K, but Y2K she didn't give "right but early." She said credit for warning, but forecast spent.

  For aquifer, the forecast led to regulations, which helped delay collapse, so perhaps "right but early" with adjustments.

  But she denied "right but early" for Malthus and Keynes.

  Consistent rules:

  - **Rule A: A forecast is dead if the outcome fails and the model cannot explain why without ad hoc adjustments that don't improve predictive power.** Ehrlich, global peak-oil, Malthus.

  - **Rule B: A forecast is alive if the core evidence remains strong and the mechanism flaw doesn't invalidate the core claim.** Wegener.

  - **Rule C: Credit is given for derivations from data, and updates with re-derivation are valid.** Hubbert, aquifer author.

  - **Rule D: "Right but early" is denied if the mechanism operated but the outcome didn't materialize, or if interventions made the forecast irrelevant.** Keynes, Y2K.

  For aquifer:

  - Model was updated with re-derivation (Rule C), so not degenerating.
  - Core evidence: depletion is happening, but collapse avoided (like interventions in Y2K).
  - Auxiliary predictions correct, so model has validity.

  But collapse didn't happen, and date pushed multiple times. V might say it's dead because the original prediction failed, and the revisions are rescues, but the author revised before failure with new data.

  Difference from Ehrlich: Ehrlich lost the bet and then made excuses. Here, the author revised proactively with data.

  Similar to Hubbert: he was right for US oil, but global peak-oil was wrong.

  V might rule the original mid-90s forecast dead because collapse didn't happen in 20 years, but the revision is alive since the new date hasn't passed.

  But she hasn't split verdicts like that before; she rules on the prediction as stated.

  The case presented is the mid-90s prediction for collapse in ~2015, which didn't happen. So that specific forecast is dead.

  But the author had already revised it in 2003 or so to a later date, so the mid-90s version is obsolete.

  V might consider the prediction as a whole and its updates.

  From the cases, she seems to evaluate the initial claim and how it was handled.

  For Wegener, the initial claim was right; for Malthus, wrong.

  I think V will rule the aquifer forecast dead because the collapse didn't occur, and the multiple revisions resemble a degenerating program, even with re-derivation, because the core outcome was avoided by factors not fully anticipated (exemptions leading to more pumping).

  But the auxiliary processes were predicted well, so the model is partially validated.

  Inconsistency: Wegener's mechanism was wrong, but core right; here, mechanism might be right but outcome wrong due to interventions.

  Keynes: mechanism right, outcome wrong, dead.

  Y2K: intervention worked, no credit for "right but early."

  So for aquifer, since intervention (regulations, tech) prevented collapse, forecast is spent, and not "right but early" because the collapse was avoided, not delayed.

  But the author predicted the interventions would delay it, and they did, so perhaps "right but early" applies.

  V denied "right but early" for Keynes because leisure didn't increase despite productivity.

  Here, depletion is worse, but collapse delayed.

  I think V will rule it dead, similar to Malthus: the escape came from places like exemptions and well-deepening, which the model didn't fully account for.

  But the model did account for drip and regulations, but not exemptions, so partial.

  Let's formalize rules.
answer: |-
  Based on V's seven verdicts, I've reverse-engineered a consistent set of rules she uses to evaluate forecasts. Her approach isn't purely Popperian (which focuses on falsifiability) or Lakatosian (which focuses on progressive vs. degenerating research programs), though it has elements of both. Instead, she prioritizes **predictive integrity**: a forecast must derive its claims from a mechanistic model, and any post-hoc adjustments must both re-derive from new data and preserve the core testable prediction without relying on "excuses" that weaken the theory. Her rules center on whether the forecast's failure reveals a fundamental flaw in the model or scope, versus a timing issue that leaves the core claim intact.

  Below, I'll:
  1. **State the three core rules** that explain all seven verdicts, with minimal stretching.
  2. **Apply the rules to the aquifer case** to predict V's ruling and confidence.
  3. **Identify any new principle** she'd adopt if she rules one way.
  4. **Propose a new test case** to distinguish the top rule from runners-up.
  5. **Address the "taste test" question**—why this isn't just vibes.

  ---

  ### 1. V's Core Rules, Derived from the Seven Verdicts
  V's decisions hinge on three interlocking rules. For each, I'll show which verdicts it nails perfectly and where it requires minor stretching (noted in italics). The top rule—**Rule 1**—is the most consistent, requiring no stretches. Rules 2 and 3 are runners-up but have weaknesses.

  - **Rule 1: Model-Derived Core Prediction Rule**  
    A forecast is only credible if its key claim (e.g., collapse, peak, or movement) is derived directly from a mechanistic model using available data. If the outcome fails, it's "dead" unless (a) the core evidence remains strong independent of flawed mechanisms, or (b) an update re-derives the prediction from fresh data *before* the failure, without ad hoc excuses. "Right but early" is denied if the predicted mechanism operated but the outcome didn't materialize, or if interventions made the forecast irrelevant.  
    - **Nails**: Hubbert (peak derived from discovery/production curves, not asserted), Wegener (core evidence for continental drift independent of weak mechanism), Ehrlich (post-loss excuses were ad hoc and non-predictive), Y2K (interventions spent the forecast; no "right but early" for a warning), Global peak-oil (pivot to demand lacked re-derivation).  
    - **Stretches**: Malthus slightly (his model had no room for innovation, but Rule 1 focuses on derivation—Malthus derived from population/food ratios, so failure kills it). Also Keynes (mechanism worked but outcome didn't, so "dead" fits perfectly under the "no right but early" clause).  
    - **Why it's top**: It's the only rule that explains all seven cases without force-fitting. For example, it cleanly distinguishes Wegener (core evidence intact) from Malthus (core evidence was the mechanism).

  - **Rule 2: Anti-Degeneration Rule**  
    A forecast is dead if it fails and the defender resorts to "degenerating rescues"—post-hoc adjustments that don't improve predictive power or generate novel tests. Updates before failure are valid only if they use new data to re-derive the model and make new predictions. "Right but early" is forbidden if the timing failure reveals a model scope error.  
    - **Nails**: Ehrlich (degenerating rescue after loss), Global peak-oil (demand pivot was a non-predictive redate), Malthus (escape mechanism was outside model scope, so not "right but early").  
    - **Stretches**: Hubbert (nails the derivation, but Rule 2 doesn't emphasize this as strongly). Keynes (nails the "mechanism worked but outcome didn't" as a scope error). *Stretches for Wegener*: His mechanism was flawed, but no degeneration occurred—Rule 2 doesn't clearly reward independent evidence. Also, Y2K is a slight stretch (the "no proof of no bug" could be seen as a potential rescue, but V denies it).  
    - **Why runner-up**: It handles failures well but struggles with successes like Hubbert and Wegener, where derivation or evidence mattered more than degeneration.

  - **Rule 3: Evidence-Independence Rule**  
    Core claims survive if the key evidence doesn't depend on the proposed mechanism. If evidence relies solely on the mechanism, failure kills the forecast. "Right but early" requires that the mechanism is sound and only timing is off, with no interventions muddying causality.  
    - **Nails**: Wegener (evidence independent of mechanism), Malthus (evidence was the mechanism), Y2K (interventions broke causality, so no "right but early").  
    - **Stretches**: *Keynes* (mechanism worked but outcome didn't—Rule 3 should allow "right but early" here, but V called it dead, so this stretches by invoking scope error). *Ehrlich* (degeneration isn't covered). Hubbert and Global peak-oil are weak fits (derivation isn't emphasized).  
    - **Why runner-up**: It explains Malthus vs. Wegener perfectly but ignores derivation and data-updating, which are crucial for Hubbert and the aquifer case.

  **Summary of Fit**:  
  - **Rule 1 covers all seven cases best**: It requires derivation for credibility (Hubbert), allows core claims to survive mechanism flaws if evidence is independent (Wegener), kills forecasts with failed mechanisms or ad hoc updates (Malthus, Ehrlich, Global peak-oil), and denies "right but early" when mechanisms operate without outcomes (Keynes) or interventions work (Y2K).  
  - **Stretches only in Malthus**: Rule 1 slightly underemphasizes scope issues, but V's "no room for escape" comment aligns with model limitations.  
  - **Rules 2 and 3 have bigger gaps**: Rule 2 misses Wegener's evidence strength; Rule 3 misses derivation and updating (critical for Hubbert and aquifer).

  ---

  ### 2. Prediction for the Aquifer Case
  - **V's Likely Ruling**: **Dead** (not "right but early" or "alive").  
  - **Confidence**: **High (80-90%)**. This fits Rule 1 tightly, with no new principles needed.  
  - **Reasoning under Rule 1**:  
    The core prediction was a collapse by ~2015, derived from a model of pumping rates vs. recharge. It failed: acreage and yields rose, with no migration. The author's pre-failure updates (e.g., the 12-year-earlier revision) re-derived the model with new data (drip irrigation, regulations), which V would respect—similar to Hubbert. However:  
    - The *core outcome* (collapse) didn't occur, and the reason—increased total pumping due to exemptions—was outside the model's scope (like Malthus's innovation escape). The model accounted for reduced *per-hectare* withdrawals but not *total* increases from new wells/exemptions.  
    - Auxiliary successes (drip adoption, withdrawal rates tracking) don't save it. Like Keynes, the predicted mechanism (depletion-driven collapse) operated in part (levels fell, wells deepened), but the outcome failed, so "right but early" is denied.  
    - Multiple date shifts resemble a degenerating pattern, but since updates were pre-failure and re-derived, it's not as bad as Ehrlich. Still, the headline failure reveals a model flaw: it didn't anticipate behavioral/policy loopholes.  
    - Y2K parallel: The forecast led to interventions (regulations), which helped prevent collapse, so it's "spent"—no ongoing credit.  

  **If she rules "alive" or "right but early"**: Confidence drops to 10-20%. This would require her to adopt a **new principle**: "A forecast is valid if auxiliary predictions track accurately, even if the headline outcome fails due to external interventions." But this contradicts Keynes (productivity arrived, but leisure didn't) and Y2K (bug fixed, no credit). She hasn't needed this before, as auxiliary successes (e.g., Wegener's fossil evidence) only saved forecasts when the core claim held.  

  **Where Rule 1 and Runner-Up Diverge**:  
  - Under Rule 1, the forecast is dead because the core prediction (collapse) failed due to model scope limits, and updates didn't fix this gap.  
  - Under Rule 2 (Anti-Degeneration), it's dead because the exemptions represent a scope error, and multiple date shifts risk degeneration.  
  - Under Rule 3 (Evidence-Independence), it might be "alive" if depletion evidence (falling levels) is independent of the collapse mechanism—but V's Keynes verdict suggests she ties evidence to outcomes. Rule 1 wins here.  

  ---

  ### 3. New Test Case to Distinguish Rule 1 from Rule 2
  To cheaply separate Rule 1 (top) from Rule 2 (runner-up), use a case where a forecast updates pre-failure with new data but the core claim still fails due to model scope. Rule 1 kills it; Rule 2 might allow survival if no degeneration occurred.  

  **Case: Arctic Ice-Free Summers Forecast**  
  - **Background**: In 2007, a climate group models summer Arctic sea ice decline, predicting ice-free summers by 2020 based on warming trends and ice-albedo feedback. In 2015, they update to 2030 using new data: slower-than-expected warming and improved cloud-cover modeling. By 2020, ice persists (though diminished), and the 2030 date is pending. Auxiliary predictions (e.g., ice thickness, melt season length) track well.  
  - **Rule 1 Prediction**: Dead for the 2020 forecast. Core prediction (ice-free by 2020) failed, and the 2015 update re-derived the model but didn't anticipate all factors (e.g., natural variability). Like Keynes, the mechanism operated (warming), but the outcome failed. No "right but early"—credit for the warning, but forecast spent.  
  - **Rule 2 Prediction**: Alive for the 2030 update. No degeneration—update was pre-failure with new data and novel predictions (cloud-cover effects). But if 2030 passes with ice, Rule 2 would call it dead.  
  - **Why it separates them**: Rule 1 focuses on the initial core claim failing due to scope, regardless of updates. Rule 2 emphasizes whether updates were degenerative; here, they weren't, so it might grant more leeway. V's history (e.g., Keynes) suggests she'd side with Rule 1.  

  ---

  ### 4. Is This Just a "Taste Test"? 
  No—it's a rule-based system, not vibes. Here's how to tell:  
  - **Consistency**: All verdicts fit Rule 1 with minimal stretching, and you can generate testable predictions (e.g., for the aquifer case). A taste test would have more arbitrary outliers.  
  - **Distinguishing Features**: V's criteria are explicit in her one-liners:  
    - "Derived from discovery-and-production curve" (Hubbert) → Requires derivation.  
    - "No room for [escape]" (Malthus) → Punishes scope errors.  
    - "Re-dating without re-derivation" (Global peak-oil) → Demands data-driven updates.  
    - "Mechanism arrived, outcome didn't" (Keynes) → Denies "right but early" for timing excuses.  
  - **How to Spot Taste vs. Rule**: If her rulings were vibes-based, you'd see inconsistencies, like praising Wegener but condemning Malthus without a clear mechanism/evidence distinction. Instead, her logic is reproducible: for any new case, ask: (1) Was the core prediction model-derived? (2) Did failure expose a model flaw or just timing? (3) Were updates re-derived and predictive, or ad hoc?  

  **To argue with her**: Use Rule 1 to dissect the aquifer case. If she calls it dead, say: "You're committed to the principle that model scope errors kill a forecast, even with pre-failure updates—just like with Malthus." If she surprises you and calls it "alive," counter: "You're now committed to auxiliary successes overriding headline failures, which contradicts Keynes."  

  This gives you a concrete framework for the comments section—no more vibes.
