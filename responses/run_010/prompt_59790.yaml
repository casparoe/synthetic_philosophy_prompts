answer: |-
  Right, let's cut through the noise. Here’s the adversarial collaboration document your Peircean and Jamesian should sign, forcing clarity on agreements, pinning down disagreements, and locking in predictions on the test cases. British English throughout.

  **Joint Statement: Agreements (Signed by Both Parties)**

  1.  **The Pragmatic Maxim as Clarifier:** Both hold that the *meaning* of a concept (including 'truth') is elucidated by considering its conceivable practical consequences – what experiential differences its being true would make.
  2.  **Rejection of Correspondence-as-Mirroring:** Both definitively reject the view that truth consists in a static, passive "copying" or "mirroring" of a ready-made reality by a disembodied mind (the "inert spectator" model).
  3.  **Truth is Consequential:** Both affirm that truth is intrinsically linked to successful action, guidance, and experiential outcomes. A true belief *functions* differently in the world than a false one.
  4.  **Verification is Integral (but Differently Weighted):** Both agree that processes of verification, testing, and experiential confirmation are central to *establishing* truth and giving the concept its meaning. Neither reduces truth *solely* to current verification, but both see verification as the essential *pathway*.
  5.  **Anti-Sceptical Stance:** Both positions are fundamentally opposed to radical scepticism. They assert that truth is attainable through human inquiry and experience, even if their accounts of *how* and *what* it consists in differ.

  **Residual Disagreements (Fairly Stated)**

  1.  **The Nature of the Truth-Bearer & Temporal Scope:**
      *   **Peircean Stance:** Truth is fundamentally a property of propositions as they would be endorsed by the ideal final opinion of an indefinitely prolonged community of inquirers. It is inherently communal, prospective, and convergent.
      *   **Jamesian Stance:** Truth is fundamentally a property of ideas or beliefs *insofar as* they prove their worth by "working" satisfactorily and expediently within the stream of experience *for believers*, connecting parts of experience advantageously. It can be individual, contemporary, and plural (where different 'workings' are viable).
      *   **Status:** **Substantive.** This is not just about the word 'true'; it reflects a deep difference about what *makes* something true – convergent inquiry versus present/personal utility.

  2.  **The Role of an Indefinite Future & Final Consensus:**
      *   **Peircean Stance:** The "long run" and the "destined" final consensus of the community of inquirers (were inquiry to proceed indefinitely) are *constitutive* of truth. Truth is *defined* by this ideal endpoint, even if never fully reached.
      *   **Jamesian Stance:** The "long run" and ideal consensus are useful regulative ideals or *predictions* about future verification, but they are not *constitutive* of present truth. Truth happens to an idea *now* when it proves satisfactory. Future consensus is an expected *consequence* of truths working best, not their *definition*.
      *   **Status:** **Substantive.** This disagreement centres on whether truth *requires* an ideal, future, communal vindication as part of its *very meaning*.

  3.  **The Primacy of Convergence vs. Satisfactory Working:**
      *   **Peircean Stance:** Satisfactory working (verification) is the *means* by which beliefs *approach* the final, convergent truth. Convergence (fated agreement) is the ultimate *criterion* and *guarantor* of objectivity and reality.
      *   **Jamesian Stance:** Satisfactory working *is* the verification process, and this process *constitutes* the truth of the belief *at that time*. Convergence is a likely *outcome* of beliefs that work best, but the working itself is the primary truth-making factor. Truth is *made* in the process of verification.
      *   **Status:** **Substantive.** This is about the fundamental locus of truth-making: is it the *process* of experiential verification (James) or the *end-state* of convergent agreement it (ideally) leads to (Peirce)?

  4.  **Univocality of 'Truth':**
      *   **Peircean Stance:** 'Truth' is univocal. It names a single, objective property: correspondence with reality *as fixed by the final opinion*. All genuine truths must be compatible within that single, convergent framework.
      *   **Jamesian Stance:** While core to the pragmatic maxim, 'truth' can legitimately apply to beliefs whose satisfactoriness (and thus "truth") might be context-dependent or personal, without necessarily implying their inclusion in a single, monolithic final system. "True" marks a *type of success in guiding experience*, which may vary.
      *   **Status:** **Substantive (with potential verbal aspects).** The core substantive disagreement is whether truth *must* be part of a single, convergent system (Peirce) or whether successful beliefs in diverse contexts can be called 'true' even if potentially incommensurable (James). The verbal aspect concerns whether James's broader application stretches the *meaning* of 'truth' beyond Peirce's stricter definition.

  **Cruxes: Pre-Registered Predictions on Test Cases**

  1.  **Case (a): The Pebble (Striated before melting? No possible trace/inquiry):**
      *   **The Question:** Does the proposition "The pebble was striated" have a determinate truth value?
      *   **Peircean Prediction:** **No.** No conceivable inquiry, however prolonged, could ever settle the matter. Therefore, there is *no fact of the matter* and no truth value. Reality is only fixed by what *could* be settled. *Bullet Bitten:* Accepts that some propositions about the past are inherently indeterminate if inquiry is *principally* blocked. Cost: Raises questions about the completeness of reality/truth.
      *   **Jamesian Prediction:** **Potentially Yes, depending on context.** If believing it "works" satisfactorily within a specific experiential context (e.g., within a geological theory that fruitfully organises other data, or provides personal meaning), it *could be made true* by its verification *in that context*. Lack of physical evidence doesn't *necessarily* preclude truth if experiential payoff exists. *Bullet Bitten:* Accepts that truth can be detached from *physical* verifiability and tied to experiential utility, even for past events. Cost: Risks severing truth from any robust sense of objective historical fact for such cases; may seem like subjectivism.

  2.  **Case (b): Proton Decay after the End of All Observers/Cosmic Heat Death:**
      *   **The Question:** If the community of inquirers has an unavoidable endpoint, can propositions about events occurring *after* that endpoint (e.g., "Proton X decays at time T") be true?
      *   **Peircean Prediction:** **Problematic.** Truth is defined by the *ideal final opinion*. If inquiry *must* end before certain events, a *definitive* final opinion on them is impossible. They may be *meaningless* or lack a *determinate* truth value within the Peircean framework. *Bullet Bitten:* Truth/reality is dependent on the *possibility* of indefinite inquiry. If cosmology blocks this, it blocks truth for post-inquiry events. Cost: Makes truth contingent on cosmic fortune.
      *   **Jamesian Prediction:** **Yes, potentially.** Truth is constituted by verification *whenever it happens*. If the proposition is formulated and verified *before* the endpoint (e.g., through theory confirmed by pre-endpoint evidence, or by its coherence/utility within a pre-endpoint belief system), it can be true. The *event* happening after the endpoint doesn't negate the prior *truth-making verification* of the *belief* about it. *Bullet Bitten:* Truth can be about events fundamentally beyond any *future* verification, as long as verification (experiential payoff) occurred *when the belief was held*. Cost: Allows truth about the fundamentally unobservable/untestable-in-principle (post-endpoint).

  3.  **Case (c): Live, Evidentially Unsettleable Belief Reorganising Conduct:**
      *   **The Question:** Does the demonstrable success of such a belief in reorganising conduct and providing experiential satisfaction confer truth upon it?
      *   **Peircean Prediction:** **No.** The belief may be highly *useful*, *beneficial*, and *pragmatically significant*, but it is not *true* unless it converges with the destined final opinion. Utility is a sign of *probable* truth, but not constitutive. *Bullet Bitten:* Maintains a strict separation between utility/satisfaction and truth. Cost: Risks seeming dismissive of the profound practical significance of such beliefs.
      *   **Jamesian Prediction:** **Yes.** If the belief "works" supremely well in organising the believer's entire experiential world, connecting elements satisfactorily, and guiding action successfully, then, *for that believer in that context*, it *is* true. Its verification *is* its truth-making. *Bullet Bitten:* Explicitly ties truth to successful functioning within a personal experiential framework, even without external evidence or consensus. Cost: Opens the door to multiple, potentially conflicting "truths" based solely on individual utility; risks charges of relativism.

  **Conclusion:** This document forces acknowledgment of shared ground (rejection of spectator theory, emphasis on consequences/verification) while starkly revealing the fault lines. The cruxes, with pre-registered predictions, expose the costs: Peirceans risk making truth/reality hostage to cosmic or epistemic fortune regarding inquiry's scope and duration. Jamesians risk diluting truth's objectivity and tethering it too closely to individual or contextual utility. The core divergence remains whether truth is the *ideal convergent destination* of inquiry (Peirce) or the *present successful functioning* of a belief (James).
