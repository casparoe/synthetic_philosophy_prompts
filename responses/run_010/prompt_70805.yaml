prompt: |-
  ok so for philosophy club we're doing a thing where we watch a movie and then argue about it afterwards, and I picked Inside Out because I think it's basically a cartoon of the homunculus problem. Can you read it through Dennett's multiple drafts model vs the Cartesian theater? Headquaters has a control panel and a big screen and memory orbs and a literal Train of Thought and Dream Productions editing footage overnight — that looks exactly like the little theater Descartes is supposed to have built, except now there are five emotions crowding around it instead of one tiny man, and I can't tell whether that's meant to solve the problem or just multiply it five times over. Also nobody ever watches the screen from the outside, the emotions are simultaneously the audience and the projectionists, which feels like it should matter a lot but the movie never notices.

  Where does it undercut its own theater? I'm thinking the Abstract Thought room where Joy and Sadness get flattened into non-objective shapes, and the memory dump scene where Joy replays that hockey memory and realises the sad part came first and the happy part was built on top of it. Do those scenes actually dramatize multiple drafts — no finished version of Riley anywhere, just competing revisions — or am I overreading? And is my teacher right that the Cartesian theater is mostly a strawman of what Descartes actually wrote, in which case how much of the film's setup is philosophy backwards?

  Tell me which three scenes you'd point the club to, and be honest about where the reading breaks down and you have to say the movie just isn't doing metaphysics.
