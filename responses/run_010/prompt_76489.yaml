  I'm writing a novel where one of the main characters has genuinely taken the dichotomy of control to heart — he reads Epictetus, does the exercises, isn't a strawman — and I need a scene where that practice costs him something real, without turning into a self-help ad or a hit piece on Stoicism. So can you build me the case to spec?

  Constraints: realistic and contemporary, one paragraph for the scene itself, ordinary stakes, no saints or villains. He has to be applying Stoic practice correctly by its own lights — sorting what's up to him from what isn't, treating the outcome as a preferred indifferent, attaching the reserve clause — and it still has to go badly in a way that neither ancient nor pop-Stoicism can just file under "he did it wrong." No quotes from the sources, I just want the reasoning.

  Then walk me through it: what Epictetus would tell him, what today's popularizers would tell him, and where the two actually come apart. Tell me which single feature of the scene is doing the work, whether Stoicism has any category for a good you can only get if you're attached to it in the wrong way, and how a smart defender of the view would attack my case as rigged.

  Write the whole thing in American English, please.
