prompt: |-
  I'm a third-year PhD student in cognitive science, and my dissertation is on whether visual phenomenology outruns what a subject can access for report and reasoning — the overflow debate. Almost everything in my protocol turns on how I treat introspective material, and my committee is split down the middle about what that material even is. My advisor's view is that a verbal report is a piece of behavior to be explained, and that any method which lets the subject's say-so constrain the theory of consciousness has already conceded the question; one of my other members works in the phenomenological tradition and thinks that a study which refuses to treat the subject's description of her own experience as data about that experience is not studying consciousness at all, only the disposition to talk about it. Before I write the methods chapter and have to defend a particular protocol, I want the specification that sits underneath that disagreement: the list of requirements that any method for bringing first-person material into a science of consciousness has to meet to count as a method at all, rather than a way of collecting anecdotes.

  So: give me that list. For each requirement, I want the case or consideration that motivates it, whether it constrains the data-collection procedure itself or the licensed inference from data to theory, and an operational test — something I could actually check against a published protocol to see whether it is met or merely asserted. Make sure the list covers the cases a method has to get right: domains where introspective judgment is systematically unreliable coexisting with domains where subjects' practical self-knowledge is excellent; confidence or visibility ratings that come apart from forced-choice discrimination; the same subject describing an episode differently after a period of introspective training; partial-report situations where far more is retrievable on cue than is spontaneously described in the first pass; reports that conflict across occasions and across labs; and subjects who cannot report at all, whether because of age, species, aphasia, or disorder of consciousness. It should also cover the distinctions a method must not collapse: a report versus the behavior it is embedded in; being wrong about whether one is in a state versus being wrong about the character of the state one is in; failing to report versus failing to experience; the accuracy of a description versus its granularity, since a vague report can be true and a detailed one invented; and the claim about how things seem to the subject versus the claim about what is going on for the subject. Add the constraints a method inherits from being science: whether validation can be non-circular given that there is no third-person ground truth for phenomenality, what stability across experimenters and sessions requires, how reports from different subjects are made commensurable, and what the deliverable's grain is supposed to be when the report is produced hundreds of milliseconds after the episode and reconstructed on the way out.

  Then do the sorting, which is the part I actually need. Mark each requirement as non-negotiable or as the standing prejudice of a particular camp — I suspect some of what each side of my committee calls a demand on any adequate method is really a substantive thesis in disguise, and I'd like to see which ones. Where a subset of the requirements cannot be jointly satisfied, say so explicitly and say which member of the set should be surrendered and why; if the list itself is where the result lives rather than in any protocol, that is fine, but show me the derivation rather than the verdict. And tell me which single requirement does the most to eliminate candidates, because I expect to be able to run the debate in my chapter off that one. Finish with a paragraph — one paragraph, no more — scoring four options against the list: heterophenomenology as Dennett frames it, neurophenomenology with its second-person interview protocols, descriptive experience sampling of the beep-and-describe variety, and the deflationary option that treats reports as no different in kind from any other behavior and so needs no special method. Please don't include references, a reading list, or attributions with dates; I know the literature and I'm asking you for the criteria, not for a reconstruction of who said what.
reasoning: |-
  We are constructing a list of requirements for a method to bring first-person material into a science of consciousness. The requirements must cover the cases and distinctions mentioned and must address scientific constraints. We will then sort them as non-negotiable or camp-specific, identify conflicts, and evaluate four methods.

  ## List of Requirements

  1. **Requirement of Phenomenal Grounding**  
     - **Motivation**: Without a connection to the subject's experience, we are not studying consciousness but only behavior about consciousness. This requirement is motivated by the phenomenological tradition that insists on the first-person perspective as the defining feature of consciousness.  
     - **Constraint**: Data collection must treat the subject's report as providing information about the experience itself, not just as a behavior to be explained.  
     - **Operational Test**: The protocol must include a step where the subject is explicitly asked to describe their experience (not just behavior) and the analysis must treat the content of the report as evidence of the experience's character.  
     - **Covers**: The distinction between a report and the behavior it is embedded in.

  2. **Requirement of Non-Circular Validation**  
     - **Motivation**: Science requires independent validation, but there is no third-person ground truth for phenomenality. We must avoid circularity.  
     - **Constraint**: The method must allow for validation without presupposing the very phenomenology it is trying to measure.  
     - **Operational Test**: Check if the protocol includes a way to assess the reliability of reports (e.g., by comparing with behavioral measures or neural correlates) without assuming that the reports are infallible.  
     - **Covers**: The problem that there is no third-person ground truth.

  3. **Requirement of Stability and Reliability**  
     - **Motivation**: Scientific results must be replicable across sessions and experimenters.  
     - **Constraint**: The method must produce consistent results when the same subject is tested multiple times under the same conditions and across different experimenters.  
     - **Operational Test**: The protocol must include test-retest reliability measures and inter-experimenter reliability checks.  
     - **Covers**: Reports that conflict across occasions and labs.

  4. **Requirement of Commensurability**  
     - **Motivation**: To build a science, reports from different subjects must be comparable.  
     - **Constraint**: The method must standardize the reporting format or provide a way to translate subjective reports into a common framework.  
     - **Operational Test**: The protocol must use a standardized scale, structured interview, or coding scheme that allows aggregation of data across subjects.  
     - **Covers**: Making reports from different subjects commensurable.

  5. **Requirement of Temporal Fidelity**  
     - **Motivation**: Reports are often delayed and reconstructed, so we must account for the gap between experience and report.  
     - **Constraint**: The method must minimize and account for the time lag and reconstruction processes.  
     - **Operational Test**: The protocol must include measures to capture experience close in time (e.g., immediate reporting) and must document the delay.  
     - **Covers**: The deliverable's grain when the report is produced after the episode.

  6. **Requirement of Sensitivity to Introspective Training**  
     - **Motivation**: Introspective abilities can change with training, so the method must account for this.  
     - **Constraint**: The method must either control for training or incorporate it as a variable.  
     - **Operational Test**: The protocol must record the subject's level of introspective training and either hold it constant or measure its effects.  
     - **Covers**: The same subject describing an episode differently after training.

  7. **Requirement of Distinguishing Accuracy and Granularity**  
     - **Motivation**: A report can be vague but true or detailed but false.  
     - **Constraint**: The method must not assume that detail implies accuracy or that vagueness implies error.  
     - **Operational Test**: The protocol must include independent ways to assess the accuracy of reports (e.g., by comparing with objective stimuli or behavioral measures) without relying solely on the report's detail.  
     - **Covers**: The distinction between accuracy and granularity.

  8. **Requirement of Accounting for Partial Accessibility**  
     - **Motivation**: Subjects may access more information when cued than they report spontaneously (partial-report superiority).  
     - **Constraint**: The method must allow for the possibility that not all aspects of experience are reported in a free description but might be accessible under specific probes.  
     - **Operational Test**: The protocol must include both free-report and cued-report conditions and compare them.  
     - **Covers**: Partial-report situations.

  9. **Requirement of Handling Dissociations**  
     - **Motivation**: Confidence ratings and forced-choice discrimination can dissociate, and subjects can be wrong about the character of their state.  
     - **Constraint**: The method must not assume that reportability equals consciousness.  
     - **Operational Test**: The protocol must include measures of both subjective report and objective performance and allow for dissociations.  
     - **Covers**: Confidence ratings dissociating from forced-choice discrimination, and the distinction between being wrong about whether one is in a state vs. the character of the state.

  10. **Requirement of Inclusivity**  
      - **Motivation**: Non-reporting subjects (infants, animals, aphasics, etc.) may still have experiences.  
      - **Constraint**: The method must not exclude non-reporting subjects from the study of consciousness.  
      - **Operational Test**: The protocol must include non-linguistic measures (behavioral or neural) that can be used for non-reporting subjects and must not rely solely on verbal report.  
      - **Covers**: Subjects who cannot report at all.

  11. **Requirement of Distinguishing Seemings from Reality**  
      - **Motivation**: The subject's report is about how things seem to them, not necessarily about what is going on in the world or in their brain.  
      - **Constraint**: The method must treat the report as evidence of the subject's perspective, not as a direct reflection of external or internal reality.  
      - **Operational Test**: The protocol must frame the question about the experience (e.g., "how did it seem to you?") rather than about the stimulus or brain state.  
      - **Covers**: The distinction between how things seem and what is going on.

  12. **Requirement of Handling Introspective Unreliability**  
      - **Motivation**: Introspection is systematically unreliable in some domains (e.g., visual perception) but reliable in others (e.g., practical self-knowledge).  
      - **Constraint**: The method must be sensitive to the context and domain of introspection and not treat it as uniformly reliable or unreliable.  
      - **Operational Test**: The protocol must include conditions that test the reliability of introspection in the specific domain under study (e.g., by comparing with objective measures) and must not generalize reliability across domains.  
      - **Covers**: Domains where introspection is unreliable vs. reliable.

  13. **Requirement of Distinguishing Experience from Report**  
      - **Motivation**: Failing to report does not necessarily mean failing to experience.  
      - **Constraint**: The method must not equate unreportable experiences with unconscious ones.  
      - **Operational Test**: The protocol must include measures that can detect experiences that are not reported (e.g., through priming or neural measures).  
      - **Covers**: The distinction between failing to report and failing to experience.

  ## Sorting and Conflicts

  ### Non-Negotiable Requirements (Scientific and Methodological Core)
  - **Non-Circular Validation** (2): Without this, the method is not scientific.
  - **Stability and Reliability** (3): Essential for replicability.
  - **Commensurability** (4): Necessary for building a cumulative science.
  - **Distinguishing Seemings from Reality** (11): Otherwise, the method conflates phenomenology with external reality.
  - **Requirement of Handling Dissociations** (9): Because dissociations are empirically observed and must be accounted for.
  - **Requirement of Distinguishing Experience from Report** (13): To avoid the fallacy of conflating access with phenomenology.

  ### Camp-Specific Requirements (Substantive Theses in Disguise)
  - **Phenomenal Grounding** (1): This is the core of the phenomenological camp's view. The deflationary camp would reject it as already conceding too much.
  - **Inclusivity** (10): The phenomenological camp might see this as essential, while the deflationary camp might argue that without report, we cannot study consciousness.
  - **Requirement of Accounting for Partial Accessibility** (8): This might be seen as a substantive thesis about the structure of consciousness (e.g., that there is overflow) by one camp and as a methodological necessity by another.

  ### Conflicts and Resolutions
  - **Conflict between Phenomenal Grounding (1) and Non-Circular Validation (2)**: If we treat reports as direct evidence of experience (1), we risk circularity because we cannot independently validate the experience. But if we don't (reject 1), we might not be studying consciousness.  
    - **Resolution**: We must satisfy both by having a method that takes reports seriously but also validates them non-circularly (e.g., via triangulation with other measures).  
  - **Conflict between Inclusivity (10) and Phenomenal Grounding (1)**: If we require reports to ground phenomenology (1), we cannot include non-reporting subjects (10).  
    - **Resolution**: Surrender the strong form of (1) that requires verbal reports. Instead, use non-verbal measures that can be treated as expressive of experience (e.g., pain behaviors in infants).  
  - **Conflict between Stability (3) and Sensitivity to Training (6)**: Training might change reports, which could be seen as instability.  
    - **Resolution**: Do not surrender either. Instead, control training as a variable and measure its effects, so that stability is assessed within the same training level.

  ### The Most Eliminative Requirement
  **Non-Circular Validation (2)** does the most to eliminate candidates because many methods either presuppose the validity of introspection (leading to circularity) or avoid introspection entirely (losing the phenomenology). A method must thread the needle.

  ## Evaluation of Four Methods

  - **Heterophenomenology (Dennett)**: Treats reports as behavior to be explained; does not take them as direct evidence of experience.  
    - **Scores**: Fails Phenomenal Grounding (1) and Inclusivity (10) because it doesn't privilege the first-person perspective and requires linguistic reports. Meets Non-Circular Validation (2) and Stability (3) because it treats reports as data neutrally.  
  - **Neurophenomenology (with second-person interviews)**: Uses structured interviews to explore experience, often with neural correlates.  
    - **Scores**: Meets Phenomenal Grounding (1) and Sensitivity to Training (6). Fails Non-Circular Validation (2) if it relies solely on reports, but often triangulates with neural data. May struggle with Stability (3) and Commensurability (4) due to qualitative data.  
  - **Descriptive Experience Sampling (beep-and-describe)**: Subjects report experience at random moments.  
    - **Scores**: Meets Temporal Fidelity (5) and Phenomenal Grounding (1). Fails Stability (3) without training and may fail Non-Circular Validation (2) if uncorroborated.  
  - **Deflationary Option (reports as behavior)**: Treats reports as any other behavior, needing no special method.  
    - **Scores**: Fails Phenomenal Grounding (1) and Inclusivity (10) but meets Non-Circular Validation (2) and Stability (3).  

  **Summary**: Neurophenomenology best satisfies the non-negotiable requirements if it incorporates validation; Heterophenomenology avoids circularity but loses the first-person perspective; Descriptive Experience Sampling captures experience in real-time but lacks validation; the Deflationary option is methodologically sound but does not study consciousness as experience.
answer: |-
  ### Requirements for Incorporating First-Person Material into Consciousness Science

  1. **Non-Circular Validation Requirement**  
     - **Motivation**: Science demands independent validation, but phenomenality lacks third-person ground truth. Circularity arises if introspective reports are both the data and the validator.  
     - **Constraint**: Inference from data to theory. Must validate reports against non-introspective measures (e.g., neural/behavioral correlates) without assuming phenomenological infallibility.  
     - **Operational Test**: Protocol includes convergent measures (e.g., neural activity during unreportable states) and tests for report-behavior dissociations. Check for triangulation: if reports are the sole evidence for a conscious state, validation is circular.  
     - **Covers**: Confidence-discrimination dissociations; no third-person ground truth.

  2. **Report-Experience Distinction Requirement**  
     - **Motivation**: Subjects can misdescribe their state's character (e.g., inattentional blindness) or fail to report despite experience (e.g., partial-report paradigms). Collapsing report and experience conflates access with phenomenology.  
     - **Constraint**: Data collection and inference. Must distinguish "no report" from "no experience," and "inaccurate description" from "altered experience."  
     - **Operational Test**: Protocol uses indirect measures (e.g., priming) for unreported states and probes description granularity separately from accuracy (e.g., via stimulus manipulation).  
     - **Covers**: Partial-report superiority; failing to report vs. failing to experience; accuracy vs. granularity.

  3. **Temporal Fidelity Requirement**  
     - **Motivation**: Reports are reconstructed post-hoc (e.g., after hundreds of milliseconds), risking distortion. Delayed descriptions may reflect memory, not original phenomenology.  
     - **Constraint**: Data collection. Must minimize/reconstruct delay effects (e.g., via immediate probing) and specify grain (e.g., categorical vs. fine-grained details).  
     - **Operational Test**: Protocol documents report latency and tests consistency across time pressures. Check for methods like real-time experience sampling or lag-controlled tasks.  
     - **Covers**: Post-episode reconstruction; stability across sessions.

  4. **Domain-Specific Reliability Requirement**  
     - **Motivation**: Introspection is unreliable in some domains (e.g., visual illusions) but reliable in others (e.g., pain perception). A method must not assume uniform reliability.  
     - **Constraint**: Inference from data to theory. Must calibrate for domain-specific error rates.  
     - **Operational Test**: Protocol benchmarks reports against objective task performance in the same domain (e.g., confidence ratings vs. forced-choice accuracy).  
     - **Covers**: Systematic unreliability; practical self-knowledge excellence.

  5. **Inclusivity Requirement**  
     - **Motivation**: Excluding non-reporting subjects (e.g., infants, aphasics) biases theories toward reportable consciousness. Phenomenality may exist without access.  
     - **Constraint**: Data collection. Must incorporate non-verbal proxies (e.g., neural markers, eye-tracking) as potential experience indicators.  
     - **Operational Test**: Protocol includes non-linguistic subjects and validates proxies against reportable cases (e.g., identical neural responses in reporting/non-reporting groups).  
     - **Covers**: Subjects who cannot report; disorders of consciousness.

  6. **Commensurability Requirement**  
     - **Motivation**: Cross-subject/lab comparisons require standardized metrics; raw descriptions are idiosyncratic.  
     - **Constraint**: Data collection and inference. Must transform subjective reports into quantifiable, comparable formats.  
     - **Operational Test**: Protocol uses structured scales (e.g., Likert) or coding schemes (e.g., content analysis) with inter-rater reliability scores >0.8.  
     - **Covers**: Cross-lab conflicts; stability across experimenters.

  7. **Phenomenal Grounding Requirement**  
     - **Motivation**: If reports aren’t about experience, the method studies behavior, not consciousness. "How things seem" must anchor the data.  
     - **Constraint**: Data collection. Must elicit descriptions framed as subjective appearance (e.g., "describe what it was like").  
     - **Operational Test**: Protocol instructions emphasize describing experience (not stimuli or beliefs) and record verbatim responses.  
     - **Covers**: Report vs. embedded behavior; seemings vs. reality.

  8. **Training Sensitivity Requirement**  
     - **Motivation**: Introspective skills improve with training (e.g., meditation), altering report fidelity. Ignoring this confounds data with skill.  
     - **Constraint**: Data collection. Must control for or measure training effects.  
     - **Operational Test**: Protocol tracks subject training history and tests pre/post-training report consistency.  
     - **Covers**: Changed descriptions after training; stability across sessions.

  ---

  ### Sorting Requirements  
  - **Non-Negotiable**: Requirements 1 (Non-Circular Validation), 2 (Report-Experience Distinction), 3 (Temporal Fidelity), 4 (Domain-Specific Reliability), and 6 (Commensurability) are scientific bedrock. Without them, the method is either circular (1), conflates constructs (2), ignores temporal noise (3), over/under-trusts reports (4), or prevents generalization (6).  
  - **Camp-Specific Prejudices**: Requirement 7 (Phenomenal Grounding) is a phenomenological camp thesis—it assumes reports directly reflect experience. Requirement 5 (Inclusivity) is a deflationary camp concession—it treats non-report proxies as experience-equivalent without direct evidence. Requirement 8 (Training Sensitivity) is neutral but often overemphasized by phenomenological approaches.  

  ### Conflicts and Resolutions  
  - **Conflict**: Requirement 7 (Phenomenal Grounding) and Requirement 1 (Non-Circular Validation) clash if grounding demands reports be taken as incorrigible, preventing independent validation.  
    - **Resolution**: Surrender Requirement 7’s incorrigibility interpretation. Ground reports in "seemings" but validate them non-circularly (via Requirement 1).  
  - **Conflict**: Requirement 5 (Inclusivity) and Requirement 7 (Phenomenal Grounding) conflict when non-reporting subjects are included—proxies aren’t "reports" of seemings.  
    - **Resolution**: Surrender Requirement 7’s exclusivity to verbal reports; expand "report" to non-verbal indicators, but validate rigorously (Requirement 1).  

  ### Most Eliminative Requirement  
  **Requirement 1 (Non-Circular Validation)** eliminates the most candidates. It forces methods to avoid self-justification (e.g., using reports to validate reports) and demands external anchors (neural/behavioral). Protocols that fail this are anecdotes, not data.  

  ---

  ### Scoring Four Methods  
  - **Heterophenomenology**: Fails Requirement 7 (no phenomenal grounding; reports are just behavior) and Requirement 5 (excludes non-reporters). Excels at Requirements 1 (avoids circularity via neutrality), 2, and 6.  
  - **Neurophenomenology**: Meets Requirement 7 (prioritizes lived experience) and Requirement 8 (training-focused). Fails Requirement 1 if interviews are uncorroborated; passes if neural data validates. Struggles with Requirement 6 (qualitative data resists standardization).  
  - **Descriptive Experience Sampling**: Excels at Requirement 3 (real-time "beeps" minimize delay) and Requirement 7. Fails Requirement 4 (assumes uniform reliability) and Requirement 1 (lacks validation; "beeps" don't anchor seemings externally).  
  - **Deflationary Option**: Meets Requirements 1 and 6 (treats reports as behavior; quantifiable). Fails Requirements 5 (proxies not distinguished from behavior), 7 (ignores seemings), and 2 (equates no report with no experience).
