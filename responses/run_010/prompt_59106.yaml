  Here is my credence decomposition for proposition C, following your instructions:

  **(a) Univocality of causation**  
  0.95  
  Causation here is interventionist/difference-making, which is determinate enough for truth-value assessment under the stipulations.  

  **(b) Metaphysical causal closure**  
