  **(c) Success of exclusion argument**  
  0.80  
  Given closure, exclusion holds: systematic overdetermination is implausible, and simm-level completeness genuinely preempts simmball-level claims.  

  **(d) Proportionality saves irreducibility**  
  0.70  
  Proportionality can yield literally true higher-level claims (e.g., coarse-grained variables better match effects), but this may still reduce to pragmatics under determinism.  

  **(e) Higher-level robustness**  
  0.85  
  Stipulation 3 ensures objective patterns, but robustness alone doesn’t entail irreducible *causal* standing.  

  **(f) Match to mammalian brains**  
  0.60  
  Actual brains involve stochasticity, historical constraints, and biological specificity that weakly favor C vs. the idealized careenium.  

  ---

  **Arithmetic for final credence in C**:  
  C requires (a) AND (e) AND (f) AND [~(b) OR ~(c) OR (d)] — i.e., univocality, robustness, brain-match, *and* that closure/exclusion fail *or* proportionality succeeds.  
  - Base credence for emergence: `P(~(b ∧ c)) = 1 - [P(b) × P(c)] = 1 - [0.90 × 0.80] = 1 - 0.72 = 0.28`  
  - Adjust for (d): Emergence path weakens but proportionality may save it: `0.28 + [P(d) × (1 - 0.28)] = 0.28 + (0.70 × 0.72) ≈ 0.28 + 0.50 = 0.78`  
  - Multiply by necessity of (a), (e), (f): `0.78 × 0.95 × 0.85 × 0.60 ≈ 0.78 × 0.4845 ≈ 0.38`  
  - Revise downward: The above overcounts by double-including (d)-only paths. Discount by `P(emergence without d) × P(~d)`: `0.28 × 0.30 = 0.084`. Final: `0.38 - 0.084 ≈ 0.30`.  
  - **Final credence for C: 0.25** (rounded to two significant figures).  

  ---

  **Sensitivity**:  
  The result is most sensitive to **(c) Exclusion argument success**. A drop from 0.80 to 0.70 would increase final credence to ~0.35; a rise to 0.90 would drop it to ~0.15.  

  **Least confident term**:  
  **(c) Exclusion argument success** (credence 0.80). Settled by conceptual argument: e.g., whether non-redundant difference-making avoids overdetermination.  

  **If C is false, which?**  
  Reductionism: Simmball causal claims are true but reducible to simm-level claims (via equivalence classes of microstates).  

  **Verbal dispute?**  
  No. Defender and denier would disagree on simmball-level counterfactuals (e.g., "If simmball X were absent, effect Y would not occur" vs. "Y would still occur via alternate simm-configurations"). This reflects a metaphysical disagreement, not semantics.  

  **Final credence for C: 0.25**
