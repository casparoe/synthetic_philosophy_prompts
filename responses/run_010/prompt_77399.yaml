answer: |-
  ### Which Version of the Distributed Self Do You Hold?  
  A decision tree for the philosophy zine. Answer honestly—no prior knowledge needed.  

  **1. Think of a symphony (like Beethoven’s Fifth). When we talk about it, we might mean:**  
  - **A)** The written score (it can be performed many times).  
  - **B)** One specific performance (a unique event in time).  

  If you chose **A**, go to 2.  
  If you chose **B**, go to 5.  

  ---

  **2. A couple married 50 years: Both feel they "remember" an event only one actually experienced (like a vacation). Is this:**  
  - **A)** The memory genuinely becoming part of both people.  
  - **B)** Just a vivid copy in the other’s mind.  

  If you chose **A**, go to 3.  
  If you chose **B**, go to 4.  

  **3. After someone dies, leaving loved ones who remember them, is part of that person still alive in their minds?**  
  - **A)** Yes, pieces of them are literally there.  
  - **B)** No, only memories or feelings remain.  

  If you chose **A**, you’re at **Leaf 1: Hofstadter-ish Pattern View**.  
  If you chose **B**, this path is **Unoccupied**. *(Why? Few argue for shared selves only in life, not after death. It’s coherent but unattractive.)*  

  **4. A chatbot is trained on everything a dead person wrote and answers new questions just like they would. Does it contain any piece of them?**  
  - **A)** Yes, it holds part of the person.  
  - **B)** No, it’s just a simulation.  

  If you chose **A**, this path is **Unoccupied**. *(Why? Believing selves live in software but not human minds is rare and incoherent to most.)*  
  If you chose **B**, you’re at **Leaf 2: Deflationary Model View**.  

  ---

  **5. A person’s parts (cells, organs) are replaced gradually until nothing original is left. Everyone still calls it "them." Do you agree?**  
  - **A)** Yes, it’s the same person.  
  - **B)** No, it’s a new person.  

  If you chose **A**, go to 6.  
  If you chose **B**, go to 8.  

  **6. If you copied someone’s memories/personality into a new body, would the new body be the original person?**  
  - **A)** Yes, the mind is what matters.  
  - **B)** No, the body is essential.  

  If you chose **A**, go to 7.  
  If you chose **B**, you’re at **Leaf 3: Body/Organism View**.  

  **7. If you made two perfect copies of a person’s mind (so both have the same memories), would both be the original?**  
  - **A)** Yes, both are equally "them."  
  - **B)** No, only one could be (or neither).  

  If you chose **A**, you’re at **Leaf 4: Psychological Continuity (Branching Allowed)**.  
  If you chose **B**, you’re at **Leaf 5: Psychological Continuity (No Branching)**.  

  **8. If you copied someone’s memories/personality into a new body, would the new body be the original person?**  
  - **A)** Yes, the mind is what matters.  
  - **B)** No, the body or story matters more.  

  If you chose **A**, this path is **Unoccupied**. *(Why? Rejecting gradual body-change but accepting mind-copying is rare and seems inconsistent.)*  
  If you chose **B**, go to 9.  

  **9. After death, loved ones tell stories about the person. Is the person’s self alive in those stories?**  
  - **A)** Yes, that’s how they "live on."  
  - **B)** No, stories are just words.  

  If you chose **A**, you’re at **Leaf 6: Narrative Self View**.  
  If you chose **B**, this path is **Unoccupied**. *(Why? Few defend a view where nothing—body, mind, or story—preserves the self. It’s coherent but bleak.)*  

  ---

  ### The Leaves (Your Position)  
  - **Leaf 1: Hofstadter-ish Pattern View**  
    You think people are "patterns" smeared across brains. The more others carry your ideas/memories, the more "you" exist there. Souls have "sizes." *(Fits: Conjoined twins sharing brain tissue; couple with shared memories; dead person living on in loved ones.)*  
  - **Leaf 2: Deflationary Model View**  
    You think other brains only hold a *model* of you—like a chatbot trained on your words. Nothing literal of you is ever in another mind. *(Fits: Chatbot; memories as copies.)*  
  - **Leaf 3: Body/Organism View**  
    You think you *are* your living body. Copies or memories are beside the point. Gradual change is fine; replacement ship is still the ship. *(Fits: Ship of Theseus; identical twins as separate bodies.)*  
  - **Leaf 4: Psychological Continuity (Branching Allowed)**  
    You think you’re a chain of memories/personality. If copied perfectly (even into two bodies), both are "you." *(Fits: Mind-copying scenarios.)*  
  - **Leaf 5: Psychological Continuity (No Branching)**  
    You think memories/personality make you "you," but only if there’s one unique chain. Copies aren’t you. *(Fits: Mind-copying with no duplicates.)*  
  - **Leaf 6: Narrative Self View**  
    You think you’re the *story* you tell about yourself. When others keep telling it, you live on in that narrative. *(Fits: Box of letters; stories after death.)*  

  ### Notes  
  - **Unoccupied Leaves:** Marked where answers lead to no common view. All are coherent except the "software but not mind" path (4A), which is messy.  
  - **Indistinguishable Leaves:** The tree *can’t fully split* the **Body View (Leaf 3)** and **No-Branching Psychological View (Leaf 5)**. Both reject copying and branching, but for different reasons (body vs. psychology).  
  - **Confidence in Leaves:**  
    - High confidence (held by real people): **Leaf 1** (Hofstadter), **Leaf 2** (deflationary), **Leaf 3** (body view), **Leaves 4/5** (psychological continuity).  
    - Medium confidence: **Leaf 6** (narrative self). Recognized in philosophy (e.g., Dennett), but fewer explicitly tie it to "distributed selves."  
  - **Weakest Node:** **Node 8** (mind-copying after rejecting gradual body change). I’m unsure it splits anyone—it might be an artifact of the tree. Most who reject gradual change (5B) are locked into body/story views and skip mind-copying altogether.  

  —Your Philosophy Zine editor  
