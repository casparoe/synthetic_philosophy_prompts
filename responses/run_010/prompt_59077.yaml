prompt: |-
  I'm in a medieval political thought seminar and our prof has strong views about where Aquinas lands on resistance to tyranny. She's been walking us through cases for weeks, and I'm trying to get ahead of next weeks. Her track record as I wrote it down:

  Case 1 — a warlord takes a city by force, no title whatsoever, rules by looting and hostages. The city's guild council, it's long-standing corporate body, organizes his arrest and restores the old charter. Peaceful, no reprisals. Her verdict: Aquinas would approve. The emphasis she gave was that the city acted as one body rather than as a scatter of private hands.

  Case 2 — a vassal king, duly installed and confirmed by his overlord, starts confiscating property and imprisoning people without trial. The overlord deposes him and installs a successor; smooth transition. Her verdict: approve, and here her emphasis was that someone with actual jurisdiction over the ruler judged him, which is a different thing from subjects taking the law into their own hands.

  Case 3 — an elective kingdom. The estates chose the king, he turns oppressive, the estates depose him and choose another. Quiet transition. Her verdict: approve. She said something to the effect of "the ones who gave him the crown can take it back," and she also leaned on the article on sedition, where Aquinas argues a tyrannical regime isn't directed at the common good, so disturbing it isn't sedition at all — if anything the tyrant is the seditious party.

  Case 4 — hereditary king, title nobody disputes, cruel and lawless. A private noble poisons him. Succession war follows, a decade of it, far worse than the tyranny. Her verdict: flat condemnation. Notably she said the awful outcome was almost beside the point, that a private person has no standing to judge his ruler in the first place.

  Case 5 — same sort of king; a private citizen with no public mandate raises a peasant band and marches on the capital. The rising fails and the repression afterward is worse than anything before it. Her verdict: condemn, obviously.

  Next week's case, which I've written out in advance: hereditary kingdom, the king's title undisputed — crowned by descent and acclaimed by the estates exactly as the fundamental law requires, and that law says the crown passes by blood, so the estates' job is to acclaim, not to choose. He is not a usurper, but he's bled the country: ruinous wars, confiscations, imprisonment without trial. The estates are lawfully convened and ready to depose him and offer the crown to his more moderate brother, who has quietly signaled he'd accept. But the standing army's officers are the king's clients, two of the great duchies are for him, everyone in the room expects a civil war that kills more people in two years than the tyranny has in twenty, and the brother is weak — the outcome nearly everyone predicts is the war ending with the king's son, who is worse, on the throne. There's no superior to appeal to either: the king acknowledges no overlord, and no emperor or pope is in any position to intervene.

  So what does she say? I want four things: your best guess at her verdict on this case; the rule you think she's actually running underneath the five verdicts; the other candidate rules that fit all five just as well, and what each of them predicts about next week's case; and the further case I could put to her that would force the rules apart. I have a sneaking suspicion her five cases are confounded in some systematic way — that she's never actually been pushed to rule on a case where the features come apart — and if that's right I'd like to know exactly which feature is doing the work in her reasoning and which ones are just along for the ride.
reasoning: |-
  Okay, the user is in a medieval political thought seminar, specifically focusing on Aquinas and resistance to tyranny. They've detailed five cases their professor has presented, each with a verdict, and they're looking ahead to a sixth case for next week. The user wants to predict the professor's verdict on the new case, identify the underlying rule from the previous verdicts, consider alternative rules that fit the same cases, and propose a test case to distinguish between these rules.

  First, I need to parse the key elements from each case to understand the professor's pattern. The first case involved a warlord usurping a city, with the guild council (a corporate body) restoring order non-violently. Approved because it was a collective action by the legitimate body. 

  Case 2 had a vassal king deposed by his overlord. Approved due to jurisdictional authority—the overlord had the right to judge. 

  In Case 3, an elective kingdom's estates deposed their chosen king. Approved because the grantors could revoke power, and tyranny isn't for the common good, so opposing it isn't sedition. 

  Case 4 and 5 were condemned: a private noble poisoning a hereditary king leading to chaos, and a private citizen's failed uprising. Both lacked proper authority and caused worse outcomes.

  The sixth case is a hereditary king with undisputed title, oppressive, but deposition by estates might cause civil war with worse outcomes. The estates are the lawful body, but the risk of violence and a worse successor is high. 

  The professor’s pattern seems to prioritize proper authority over outcomes. Cases 1-3 had legitimate bodies acting (guild council, overlord, estates), while 4-5 involved private individuals. Even in Case 4, the bad outcome was secondary to the lack of authority. 

  The underlying rule could be: Resistance is legitimate only if undertaken by a corporate body with pre-existing jurisdictional authority over the ruler, regardless of consequences. 

  Alternative rules might focus on outcomes (utilitarian) or the source of authority. For example, if the rule was about minimizing harm, Case 4's condemnation would be due to the bad outcome, but the professor dismissed that, emphasizing authority instead. 

  For the sixth case, the estates have authority, but the predicted outcome is disastrous. If the professor sticks to her rule, she might approve because the estates are the proper body. But if outcome matters, she might condemn. Given her past emphasis on authority, approval is likely. 

  To test the rules, a case where a legitimate body acts but causes worse outcomes versus a private individual succeeding without chaos. If she approves the former despite bad outcomes, authority is key. If she condemns, outcomes might matter more.
answer: |-
  Based on your professor's track record and Aquinas' principles (especially *Summa Theologiae* I-II, Q. 96 & II-II, Q. 42, Q. 104), here's the breakdown:

  1.  **Best Guess for Next Week's Verdict: APPROVAL (but heavily qualified).**
      *   **Why:** The Estates are the key. They are the "lawfully convened" corporate body representing the realm, possessing a recognized (if limited) constitutional role ("acclaim"). While their primary function isn't election, their assembly and corporate nature give them a public, quasi-jurisdictional standing distinct from private individuals (Cases 4 & 5). Aquinas' argument that disturbing a regime *not directed to the common good* isn't sedition applies here. The lack of a superior overlord (Case 2) and the hereditary nature (Cases 4 & 5) are overcome by the Estates' corporate authority as the body representing the community over which the king rules.
      *   **Qualification:** She will likely condemn the *specific plan* as reckless and imprudent due to the near-certainty of catastrophic civil war and a worse outcome, arguing it violates the principle that resistance must ultimately aim at restoring the common good, not making things worse. She might say the Estates *have the authority* to act, but *should not* in this specific circumstance because prudence dictates finding another way (or enduring the lesser evil). Her verdict will focus on the legitimacy of the *body* acting, even if she finds the *action* in this instance unwise. She won't deny their standing, only their judgment call.

  2.  **The Professor's Likely Underlying Rule:**
      *   **Rule: Resistance to tyranny is legitimate *only* if undertaken by a recognized corporate body possessing pre-existing public authority/jurisdiction either derived from the community or superior to the tyrant, acting as a unified entity (not as private individuals), and the action must plausibly aim at restoring the common good (making disastrous outcomes a strong prudential caution, but not necessarily invalidating the authority itself).**
      *   **Breakdown:**
          *   **Corporate Body w/ Jurisdiction:** Guild Council (Case 1 - city gov't), Overlord (Case 2 - superior jurisdiction), Estates (Case 3 - electoral source, Case 6? - constitutional acclaiming body). This is the *core*.
          *   **Not Private Hands:** Explicitly condemned in Cases 4 & 5.
          *   **Aimed at Common Good:** Implicit in all approvals, explicit condemnation of outcomes *only* when linked to illegitimate actors (Case 4). Case 6's predicted disaster challenges the *prudence* of the action, not necessarily the *authority* of the Estates.
          *   **Unified Entity:** Emphasized in Case 1 ("one body").
          *   **Jurisdiction Over/From Source:** Case 2 (overlord), Case 3 (source of power), Cases 1 & 6 (body representing the governed community itself).

  3.  **Alternative Rules Fitting the Five Cases & Predictions for Case 6:**
      *   **Rule A: "Source of Power" Rule:** Legitimacy depends on the resistance coming from the entity that granted the ruler's authority or its superior.
          *   *Fits Cases:* 1 (Guild Council arguably original authority?), 2 (Overlord - superior), 3 (Estates - source), 4 (No superior/source acting - Condemn), 5 (No superior/source - Condemn).
          *   *Prediction for Case 6:* **CONDEMN.** The Estates acclaimed but did not *grant* power by choice; power came by blood. They aren't the true "source" under this rule, just a ceremonial approver. The rule requires the *grantor* or *superior*, which they are not.
      *   **Rule B: "Minimize Harm/Utilitarian" Rule:** Legitimacy depends on the resistance having a high probability of success and resulting in less harm than the tyranny.
          *   *Fits Cases:* 1 (Peaceful, successful - Approve), 2 (Smooth - Approve), 3 (Quiet - Approve), 4 (Decade of war, worse - Condemn), 5 (Repression worse - Condemn).
          *   *Prediction for Case 6:* **CONDEMN.** The predicted outcome is catastrophic civil war likely leading to a worse ruler. The harm clearly outweighs the tyranny.
      *   **Rule C: "Jurisdictional Superiority Only" Rule:** *Only* a superior authority (like an overlord or emperor) can judge and depose a ruler. Subjects/corporate bodies beneath the ruler cannot.
          *   *Fits Cases:* 2 (Overlord - Approve), 1 (Guild Council - *Problem*: No superior mentioned? Assumes city is sovereign body? Might *not* fit perfectly unless city is viewed as sovereign), 3 (Estates - *Problem*: They aren't superior, they *are* the subjects. Fits only if "source=superior"), 4 (No superior - Condemn), 5 (No superior - Condemn).
          *   *Prediction for Case 6:* **CONDEMN.** There is explicitly no superior overlord. The Estates are subjects, not superiors.
      *   **Rule D: "Corporate Body = Legitimate, Private = Illegitimate" (Simpler Version of Prof's Rule):** Any recognized corporate body representing the community (city council, estates, etc.) can act against a tyrant usurper or a ruler violating fundamental law. Private individuals cannot.
          *   *Fits Cases:* 1 (Corporate Guild Council - Approve vs Usurper), 2 (Overlord is corporate authority - Approve), 3 (Corporate Estates - Approve), 4 (Private Noble - Condemn), 5 (Private Citizen - Condemn).
          *   *Prediction for Case 6:* **APPROVE.** The Estates are the quintessential corporate body. The king's undisputed title & hereditary nature might be a wrinkle, but his violation of law (confiscations, imprisonment without trial) likely qualifies as tyranny justifying corporate action. (This is closest to the Professor's rule but potentially less nuanced on "jurisdiction").

  4.  **The Crucial Test Case to Force the Rules Apart:**
      *   **The Case:** A **hereditary king** with undisputed title (like Cases 4, 5, 6) becomes a **blatant tyrant** (persecuting the faith, seizing Church property, mass executions). There is **no overlord** and **no pre-existing corporate body** with recognized constitutional authority (the ancient Estates were dissolved by a previous king generations ago). A **coalition of leading bishops, respected city mayors, and prominent nobles**, acting *together* but *without* any prior constitutional mandate as a single body, **publicly declare the king deposed for tyranny and heresy.** They raise an army. **The rebellion is swift, bloodless, and successful**, installing a pious and moderate cousin. The common good is clearly restored.
      *   **Why it Forces the Rules Apart:**
          *   **Professor's Rule (Corporate Body w/ Pre-existing Jurisdiction):** Likely **CONDEMN.** No pre-existing, recognized corporate body with jurisdiction acted. It's an *ad hoc* coalition, even if composed of prominent figures. It lacks the established, constitutional standing of a Guild Council or Estates.
          *   **Rule A (Source of Power):** **CONDEMN.** Neither the coalition nor its members granted the king his hereditary power.
          *   **Rule B (Minimize Harm):** **APPROVE.** Successful, bloodless, better outcome.
          *   **Rule C (Jurisdictional Superiority Only):** **CONDEMN.** No superior acted.
          *   **Rule D (Corporate Body = Legitimate):** **AMBIGUOUS/DEBATE.** Is this coalition acting *as* a *de facto* corporate body representing the realm? Or is it just a group of powerful private individuals? This tests the boundary of "corporate body." A strict reading says no prior recognition = condemn. A looser reading might approve.
      *   **The Confounding Feature:** Your suspicion is correct. The professor's five cases consistently align the presence of a **pre-existing corporate body with jurisdiction** with **low-risk/high-success outcomes**. Case 6 starts to break this by introducing high-risk to the corporate body. The Test Case breaks it completely by removing the pre-existing body *while* achieving a good outcome. This forces the question: **Is the *authority* of the body derived solely from its pre-existing constitutional form, or can it emerge from the necessity of the situation and the representativeness/unity of the actors, especially when successful?** The professor's emphasis on "standing," "jurisdiction," and acting "as one body rather than as a scatter of private hands" strongly points to the *pre-existing constitutional form* as the non-negotiable element, even if the outcome is good (hence likely condemning the Test Case). The "Minimize Harm" rule is the clear outlier here.

  **Conclusion:** Your professor prioritizes **proper authority derived from pre-existing constitutional structures or hierarchies** above all else in Aquinas' framework for legitimate resistance. Outcomes matter prudentially, but don't override the fundamental question of *who* has the standing to act. Her likely verdict for Case 6 is a qualified approval based on the Estates' standing, while condemning the action as imprudent. To expose the core principle, present a case where a successful resistance lacks a pre-existing corporate body but restores the common good – her condemnation of such a case would confirm that *constitutional form/jurisdiction*, not outcome or mere representativeness, is the absolute linchpin for her reading of Aquinas.
