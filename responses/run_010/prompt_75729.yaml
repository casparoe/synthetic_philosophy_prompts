prompt: |-
  I run a tiny disaster-prep nonprofit in a river town, and I also, reluctantly, do my own household finances, which is how I ended up arguing with my accountant about the shape of probability weighting functions. A friend in a philosophy PhD program lent me Buchak's *Risk and Rationality* (2013) and said it would explain why the choices I make look insane on a spreadsheet but don't feel insane at all. The pitch I took away: don't shove risk attitude into the utility function as diminishing marginal utility and then call it a day, because that conflates "I care less about each extra dollar" with "I hate the shape of this gamble"; instead keep utility over outcomes roughly honest and put the attitude toward risk into a separate function that re-weights probabilities according to where outcomes sit in the ranking. One global weighting function, same one for everything I'll ever decide. That last part is where I get stuck, because I'm pretty sure I don't have one, and I want to know whether that's a fact about me or a bug in the theory.

  Here are my actual verdicts, and I've tried to write them with real numbers so you can check the arithmetic instead of taking my word for it.

  1. Phone coverage: $1.20 a month against a 1-in-1,000 yearly chance of a $700 replacement. I'm paying about $14 to guard 70 cents of expected loss. I buy it and I don't feel like a mark.
  2. A catastrophic-medical rider at $8,000 a year covering a 2% chance of a $300,000 bill. Expected loss $6,000, so it's a bad deal, and I'd sign today.
  3. Certain $500 versus a 50/50 shot at $1,200 or nothing: I take the $500, and I know the expected value is $600.
  4. The film investment. A friend's project: I put in $9,000 that came out of a small inheritance I had already mentally written off, 3% chance it comes back as $400,000, 97% chance it's gone. Expected value is maybe +$3,000, but here's the thing — I'd take it at 1.5% too, where the arithmetic goes negative. I'd take it knowing it's negative.
  5. The exact same film deal, same odds, same $9,000, but the money now comes out of my emergency fund — the pot that covers a broken furnace or a quarter with no grants. I refuse, flatly, and I think I'd refuse at 10% for $400,000 as well. Nothing changed except which pot the money is sitting in. My total wealth in the two versions is identical, so I know case 4 and case 5 are the same act described two ways, and I still feel the difference in my chest.
  6. One 50/50 flip for +$11,000 or −$10,000: I turn it down, even though it's $500 in my favor. Offer me a hundred independent copies of that same flip and I want all hundred, no hesitation.
  7. Public side: the levee. 1-in-200 annual chance of $2 billion in damage, and $6 million a year cuts it to 1-in-2,000. Build it, obviously. But I will not insure the county's vehicles above the deductible even when the math is the same shape scaled down, and I'd tell my neighbor not to buy the rider in case 2 — he's got no buffer at all, which by my own logic should make him more careful than me, not less. That one is embarassing and I don't have a story for it.

  My own tentative principle, which I want you to attack rather than compliment: call it the floor rule. There's a level F, the worst situation I've actually lived through and could live through again, and it's pinned to what my life costs, not to what's in my accounts, so a windfall doesn't move it. Probability doesn't get weighted by itself; it gets weighted by where the outcome lands relative to F. Outcomes below F get their weight multiplied up hard. Outcomes between F and a bit above F get roughly their bare probability. Outcomes way above F, the ones that change the story rather than pad it, get a modest bonus. That's supposed to deliver 1, 2, 4 and 5 together — in 4 the $9,000 is above F and never was load-bearing, in 5 losing it drops me under F — and it's obviously not the same as a single global weighting function over probabilities, since mine takes the outcomes as arguments too.

  So: give me the principle you actually think is right, stated precisely enough that I could apply it to a case you've never seen — a rule or formula with explicit clauses, and for each clause tell me which of my numbered cases is doing the motivating. Then tell me what it says about the two I'm torn on (whether case 6's bundle is genuinely a different act or just me contradicting myself, and whether case 7's levee/vehicles/neighbor split is survivable), and invent one further case of your own that discriminates between your principle and my floor rule, and rule on it. Be committed: pick one, say which of my verdicts it forces me to give up, and argue for that rather than laying out a menu and letting me choose. If you think the floor rule is just prospect theory with a folksy name, or just a fine-grained redescription of outcomes that collapses back into a single weighting function once you admit that "losing the furnace money" and "losing windfall money" were never the same outcome to begin with, say that flatly and say which of the two escapes it is.

  Verdict: <the principle you'd have me adopt, in a few words> | drop <case number(s)> | floor rule survives: <yes/no>
reasoning: |-
  Okay, let me approach this systematically. The user presents a fascinating case study in decision-making that challenges standard economic models. They've clearly done their homework with Buchak's risk-weighted expected utility (REU) theory and provided concrete examples where their choices deviate from expected utility maximization. 

  The core tension is between Buchak's single global probability weighting function and the user's intuitive "floor rule" that weights probabilities based on outcomes relative to a survival threshold. Their examples 4 and 5 are particularly compelling - identical monetary gambles treated differently based on which mental account the money comes from. This directly violates description invariance, a cornerstone of most decision theories.

  Hmm, their cases reveal multiple psychological factors at play:
  - Mental accounting (windfall vs emergency funds)
  - Source dependence (inheritance vs earned income)
  - Probability distortion (underweighting high-probability losses)
  - Context-dependent risk aversion (single gamble vs repeated gambles)
  - Social preferences (levee for community vs vehicle insurance)

  The floor rule explains their personal choices well but struggles with social cases like 7 where they deny neighbors similar protection. That suggests an additional "responsibility aversion" factor - willingness to bear risk for others decreases when they're financially vulnerable. 

  For case 6, the reversal between single and repeated gambles points to the law of large numbers operating psychologically - they trust aggregate outcomes while fearing single large losses. This is consistent with probabilistic sophistication but not with global probability weighting.

  I find prospect theory actually handles most cases if we:
  1) Frame outcomes as gains/losses from reference points
  2) Allow different reference points for different domains
  3) Apply separate probability weighting for gains vs losses

  But crucially, prospect theory would say "losing windfall money" and "losing emergency money" are different psychological outcomes due to different reference points. The user resists this, wanting identical monetary outcomes to be identical. That's the rub - their intuition demands outcome-dependent weighting while maintaining that the outcomes are objectively the same.

  The resolution might lie in Buchak's REU with outcome-dependent risk attitudes. REU can accommodate this through the "risk function" that weights probabilities based on outcome ranking. Their floor rule could be formalized as:
  ρ(p) = p when outcome ≥ F
  ρ(p) = √p when outcome < F
  etc.

  For the test case discriminating between theories: consider choosing between two medical treatments for a rare disease. Treatment A has 100% chance of leaving you disabled but alive (below F). Treatment B has 95% chance of full recovery but 5% chance of death. Standard REU might weight the death probability heavily, while floor rule would heavily weight the disability outcome. Most people prefer B, which favors REU over floor rule.

  Ultimately I'll recommend REU with context-dependent rankings, as it's the most principled expansion of their floor rule that maintains theoretical coherence. They'll need to accept that "outcomes" include psychological states like "losing security" vs "losing surplus", making cases 4 and 5 formally different. The accountant isn't wrong - but isn't capturing the full human story either.
answer: |-
  Here's the principle I'd have you adopt, stated precisely:

  **Verdict: Contextual Risk-Weighted Expected Utility (C-REU)**  
  **Drop:** Case 5 (as identical to 4) and Case 7 (inconsistency re: neighbor)  
  **Floor rule survives:** No (collapses into outcome-redescription in C-REU)  

  ---

  ### The Principle: Contextual Risk-Weighted Expected Utility (C-REU)
  1. **Rank outcomes contextually**  
     Outcomes are defined by *material consequences + psychological/situational state*. Losing "$9,000 from emergency fund" vs. "$9,000 windfall" are *different outcomes* because they alter your *exposure to future risk* and *emotional anchor points*.  
     *Motivated by:* Cases 4 vs. 5 (film investment), Case 2 vs. 7 (medical rider refusal for neighbor).

  2. **Apply distinct probability weighting per context**  
     Use separate weighting functions for:  
     - *Security threats* (outcomes pushing you below F or threatening baseline stability)  
     - *Opportunity gains* (outcomes above F with low marginal impact)  
     - *Transformative gains* (outcomes radically changing your options)  
     *Motivated by:* Cases 1 (phone insurance), 4 (film gamble), 6 (single vs. repeated bets).

  3. **Weight probabilities using a *sigmoid* function**  
     For security threats: Overweight small probabilities of loss (convex weighting).  
     For opportunity gains: Underweight small probabilities of gain (concave weighting).  
     For transformative gains: Apply mild optimism (near-linear weighting).  
     *Motivated by:* Cases 1 (phone insurance), 2 (medical rider), 4 (film gamble).

  4. **Reject global fungibility**  
     Mental accounting isn't irrational—it tracks *liquidity constraints* and *sunk-cost framing*. Money isn't interchangeable if losing it changes vulnerability.  
     *Motivated by:* Cases 4 vs. 5 (inheritance vs. emergency fund).

  ---

  ### Resolving Your Problem Cases
  **Case 6 (Single flip vs. repeated flips):**  
  - **C-REU verdict:** Rational.  
  - **Why:** A single flip of +$11k/-$10k is a *security threat* (loss could breach F). You overweigh the 50% chance of losing $10k. But 100 independent flips turn it into an *opportunity gain*—variance drops, aggregate EV dominates. Probability weighting shifts from loss-averse to near-linear.  

  **Case 7 (Levee vs. vehicles vs. neighbor):**  
  - **C-REU verdict:** Inconsistent unless contextualized.  
  - **Why:**  
    - Levee: Protects *community survival* (existential threat → extreme loss-overweighting).  
    - County vehicles: Insuring them is an *opportunity cost* (concave weighting → reject "bad deals").  
    - Neighbor’s medical rider: His lack of buffer makes it a *security threat for him*. But you deny it because:  
      - You’re not exposed to his risk (no empathy weighting in your function),  
      - You frame it as "his choice" (agency discount),  
      - You’re using *your* weighting (opportunity cost) not *his* (security threat).  
    **Resolution:** C-REU allows different weights for *others’ outcomes* but demands you use *their* context. Refusing the neighbor violates this—you’re imposing your frame.  

  ---

  ### Discriminating Test Case: "The Firewall Gamble"  
  **Scenario:**  
  You have $50k in emergency funds (F = $50k). You’re offered:  
  - **Gamble A:** 60% chance to win $0, 40% chance to lose $50k.  
  - **Gamble B:** 100% chance to lose $20k.  

  **C-REU Prediction:**  
  - Choose **Gamble B**. Losing $20k keeps you above F ($50k → $30k). Gamble A risks breaching F (40% chance of $0)—you’ll overweigh that probability.  

  **Floor Rule Prediction:**  
  - Same choice: Avoid outcomes below F.  

  **Now add context:**  
  The $50k is in a trust fund releasing next month. Today, you have $1k cash.  

  **C-REU Prediction:**  
  - Switch to **Gamble A**. The $50k isn’t "live" yet—losing it doesn’t breach your *current* F ($1k). You’ll underweight the 40% loss chance (opportunity cost framing).  

  **Floor Rule Prediction:**  
  - Same as before (F is fixed). Reject Gamble A.  

  **Why it discriminates:**  
  The floor rule ignores *temporal liquidity*. C-REU treats "illiquid future funds" as a distinct outcome class, triggering different probability weights. Most people would switch to Gamble A here—the "untouchable" money feels like a windfall, not security.  

  ---

  ### Why C-REU Over Floor Rule?  
  - **Solves 4 vs. 5:** "Windfall loss" vs. "emergency fund loss" are different outcomes. Not a contradiction—a *context shift*.  
  - **Solves 7:** You *can* reject vehicle insurance (bad deal) while building the levee (existential threat), but refusing the neighbor is paternalistic. C-REU forces consistency: either apply *his* context (he should buy the rider) or admit social preferences.  
  - **Drops case 5:** You must accept that "losing windfall" ≠ "losing security." The outcomes aren’t materially identical.  
  - **Formalizes your insight:** Your "floor" is a reference point for defining outcome classes. But Buchak was right—you need *one weighting rule* per *class*, not per outcome.  

  C-REU isn’t "prospect theory lite"—it makes risk attitudes *modular* rather than global, which is why your spreadsheet fails. Your accountant sees dollars; you see threats, windfalls, and lifelines. The math isn’t wrong; its ontology is too narrow.
