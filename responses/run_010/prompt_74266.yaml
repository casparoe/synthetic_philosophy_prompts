prompt: |-
  We're in the middle of a curriculum review, and separately the dean's office has asked us to justify the two lines we want to advertise next year, which means I've been staring at our own period vocabulary a lot more closely than is healthy. Here's what's bugging me. We hire in slots defined by period — medieval, early modern, long eighteenth century, Romantic, Victorian, modern, contemporary — and candidates are expected to "cover" one of them. The prelim fields are organized that way, the intro sequence is built out of them, and if a job talk is genuinely excellent but lands thirty years to the right of the advertised slot, the committee reads it as a near miss rather than a hit. Meanwhile the same people, in the same building, teach a methods course whose standard content is that these labels are nineteenth- and twentieth-century inventions: that the boundaries track political events (1660, 1789, 1832) rather than anything in the texts, that the dates come out differently in English than in French or in art history, and that I have personally watched "early modern" eat "Renaissance" in the job ads over the course of my own career, which I take to be evidence about hiring language and not about anyone discovering a new joint in reality.

  So: what does the hiring-and-coverage practice actually presuppose about whether periods are real? Not what would be flattering for it to presuppose — I want the reconstruction of the implicit theory that makes the practice intelligible rather than merely habitual. Is it a realism (there are joints and the slots track them)? An instrumentalism (the joints don't matter, only the coordination problem and the division of labour among specialists)? A looping or self-fulfilling story (the slot makes the period real by shaping what gets written, taught, and read)? Or nothing beyond an administrative technology for ranking applicants? One feature I think is under-pressed and that I'd like you to work on: the slots function as a *partition* — exclusive and jointly exhaustive, one scholar per box — whereas even the most committed periodizer thinks the boundaries bleed and that plenty of first-rate work is irreducibly cross-period. So there may be an assumption here about the *shape* of periodization that is stronger than any of the philosophical options above, and I want to know what it is and which of those options could actually deliver it.

  Then do the follow-ups in the same breath: seperate what the practice strictly needs from what it merely sits comfortably with, tell me whether the department's two behaviours (slot-hiring in the corridor, constructivism in the lecture) are in genuine conflict or whether some single view licenses both, and say what would have to change if we swapped the presupposition out — if we advertised by method or by problem field instead — and what would break that the period slots are currently holding up (evaluation, coverage requirements, a committee's ability to say no with a straight face). Give it to me as exactly five numbered points, a sentence or two each, no introduction and no conclusion, and don't send me sources or a reading list — I can't look anything up between meetings and I'd rather have your reconstruction than your footnotes.
reasoning: |-
  Hmm, the user is grappling with a fundamental tension in their literature department. They're deep in curriculum review and need to justify hiring lines based on historical periods, while simultaneously teaching that these periods are constructed inventions. The core question is what the hiring practice actually presupposes about period reality, beyond surface-level contradictions.

  The user has clearly identified three philosophical options: realism (periods are real), instrumentalism (they're just practical tools), or looping effects (they become real through practice). But they're especially interested in how the exclusive partitioning of scholars contradicts how periods actually bleed into each other academically. This suggests the real issue isn't the ontology of periods but their function as administrative technology.

  I notice the user is a senior scholar ("over the course of my own career") frustrated by institutional hypocrisy. Their mention of committees rejecting off-period job talks reveals pain points in evaluation systems. The request for five concise points without citations suggests they need ammunition for high-stakes meetings rather than theoretical exploration.

  Key tensions to address:
  1) The partition system assumes periods are discrete units of expertise, despite academic recognition of fluidity
  2) Hiring committees use periods as risk-aversion tools ("straight face" refusals)
  3) Constructivist teaching doesn't undermine period hiring because they serve different functions 
  4) Switching to problem-based hiring would require overhauling evaluation metrics
  5) The system's stability relies on unspoken agreement to treat periods as real during hiring, regardless of personal beliefs

  The under-explored angle is how partitioning creates artificial scarcity of expertise - each slot implies a contained knowledge domain. This enables manageable resource allocation (courses, prelims) but actively discourages boundary-crossing work. The "bleeding" isn't accommodated but suppressed by structure.

  For the five points, I'll prioritize surgical precision:
  1) Presupposition is instrumentalist partitioning (not realism)
  2) Minimal requirement is coordination, not belief
  3) No conflict because functions differ (admin vs pedagogy)
  4) Changing to problem-based would collapse coverage systems
  5) Partition maintains evaluative legitimacy (the "straight face")

  The challenge is avoiding academic jargon while retaining precision. The user wants operational analysis, not theory. I'll frame everything around what "breaks" if changed, as that's their practical concern.
answer: |-
  Here are the five points addressing your query:

  1.  **The practice presupposes instrumentalist partitioning:** It requires treating periods as exclusive, manageable administrative units for labor division and coverage, not as discovered realities. The partition's rigidity (one scholar per box) is a practical solution to coordination and resource allocation, overriding academic recognition of boundary fluidity or cross-period work.

  2.  **It strictly needs coordination, not belief:** The practice functions minimally on shared acceptance of the labels as operational tools for hiring, teaching assignments, and exam structures. It does not strictly require belief in period realism, merely adherence to the agreed-upon framework for practical coordination.

  3.  **No inherent conflict with constructivism:** The hiring practice and methods-course constructivism serve distinct purposes. Instrumental partitioning enables administrative function (coverage, hiring pools), while constructivism describes historical contingency; the department can pragmatically toggle between the two stances based on context without contradiction.

  4.  **Swapping to problem/method fields risks coverage and evaluation:** Adopting problem-based hiring (e.g., "empire," "gender") or method-based hiring (e.g., "DH," "book history") would destabilize the explicit coverage guarantee ("we teach *all* major periods") and complicate comparative evaluation ("How do we rank a DH specialist against a gender theorist?"). Committees lose the straightforward "wrong period" justification.

  5.  **Partition upholds evaluative simplicity and coverage legitimacy:** The period slots provide a clear, low-risk rubric for ranking candidates and rejecting applicants ("not a Victorianist"), while ensuring the department can claim comprehensive historical coverage. Removing this partition forces explicit negotiation of coverage priorities and necessitates new, inherently contestable criteria for evaluation and refusal.
