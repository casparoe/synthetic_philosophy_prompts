  The room composition adds complexity: her family, former boss (who approved the original letters), linguists familiar with Orwell, and letter recipients. The challenge is to critique bureaucratic language without attacking the former boss personally. The solution lies in framing this as systemic rather than individual failure - language habits spread through imitation, affecting well-intentioned people.

  The department chair's objections are valid concerns: ceremonial speeches need shared formulas to build community, avoiding stock phrases might make the speech feel thin, and stylistic constraints could draw attention to the speaker rather than the honoree. I'll need to address these through the speech's substance and structure.

  For the speech itself, I'll start with the letters to ground the discussion, then build out from there. I'll use plain language to explain how Kelleher's revisions created accountability. The tone should be respectful to all parties while maintaining intellectual honesty. The "third thing" solution involves showing how both Kelleher and her former boss operated within the same system, but she chose to change it from within.

  In my accompanying note, I'll explain how I handled the chair's objections: maintaining warmth through specific stories rather than stock phrases, using the letters as concrete substance to avoid thinness, and keeping focus on Kelleher by making her work the undisputed hero of the speech. I'll also note where I nearly broke rules and justify any retained stock phrases.

  This requires balancing multiple tensions: critique without accusation, simplicity without oversimplification, and ceremony without cliché. The speech must honor Kelleher's practical achievements while satisfying both the linguists and the letter recipients in the audience.
answer: |-
  ### Planning Notes (198 words)
  The genuine constraints are Orwell's core principles: concrete language, active voice, and ruthless concision. These *do* bite ceremonial prose, which often relies on ornamental abstraction ("legacy," "dedication") and passive constructions ("it is believed"). Avoiding stock praise terms ("inspiration," "clarity") forces specificity, aligning with honoring Kelleher’s concrete achievements. The ban on quoting/naming Orwell excessively is crucial; it prevents hijacking her moment.

  The head table dilemma is the most significant bite: critiquing the old letters without indicting the decent man who used them. Orwell’s insight about habits spreading unconsciously provides the honest "third thing." This isn’t a dodge; it’s the core argument – the *system* of language, not individual malice, is the antagonist Kelleher defeated.

  The chair’s first objection (shared formulas build community) partly collides with Orwell’s rules. Ceremonies *do* use shared language, but stock phrases often obscure meaning. The solution is to forge community through shared *understanding* of Kelleher’s specific act, using plain language everyone grasps. The third objection (performance drawing focus) is the real danger. Avoiding stock phrases must serve *her* story, not showcase the writer’s discipline. The speech’s substance – the letters and their consequence – must be so vivid it overshadows the technique.

  ---

  ### The Speech (547 words)

  Ladies and Gentlemen, Trustees, Faculty, Guests, and especially Ruth Kelleher and her family: we gather to honor work done with words. Not grand words, not famous words. Words that arrived in envelopes marked "Official Business." Words people needed to read, even if they hadn't chosen to.

  For twenty-six years, Ruth Kelleher wrote those words for the state. She wrote letters telling people their claim for help was denied, delayed, or reopened. When she started, the letters sounded like this:

  *"It has been determined that the documentation provided was insufficient to establish continued eligibility. Accordingly, benefits have been terminated pending further review."*

  Many of you know that sentence. Some, perhaps, wrote it. Others received it. It looks professional. It uses long words. It seems careful.

  But Ruth Kelleher saw something else. She saw that this sentence could not be answered. Who determined? What documentation? Insufficient *for what*? Terminated *when*? Pending review *by whom*? There is no date. No named thing missing. No step offered. The person holding this letter is left holding nothing they can push against. They cannot argue. They cannot check. They cannot act. The words are a wall.

  So Ruth changed them. She wrote a new sentence, taught others to write it, put it in a handbook still used today. It sounds like this:

  *"We stopped your payments on March 4. We stopped them because the doctor's letter we asked for on February 1 had not reached us by March 1. If you send that letter to the address below, we will look at your case again and give you our answer within thirty days. If the answer is no, you may ask for a hearing, and a person who does not work in this office will decide. Here is how to ask."*

  This sentence can be answered. It has dates. It names a specific letter. It states a rule: "not reached us by March 1." A person can check that date against their calendar. They can find that letter. They know who stopped the payment ("We"). They know what to do next. They know a time frame. They know how to challenge the answer. They have something solid to hold. This letter expects a reply. It invites one. It makes argument possible. It turns a wall into a door.

  This difference is not about being nicer or simpler. It is about power. The first letter uses words that block questions. The second uses words that demand them. The first hides the rule; the second shows it. The first leaves the reader alone with confusion; the second gives them ground to stand on.

  This habit – the habit of hiding action behind long nouns, burying rules in vague verbs – it spreads easily. It feels safe. Official. It infects writing without anyone meaning harm. Breaking that habit takes effort. It takes seeing the person reading the words, knowing they need a handle, not a fog. Ruth Kelleher saw that person. She wrote for them. She made rules visible. She made answers possible. She gave people ground to stand on, and a way to push back.

  She did this without theory, without fuss, by asking one question: "Can the person reading this answer it?" Tonight, we honor that question, and the extraordinary work it produced. Ruth Kelleher, the Public Writing Prize is yours.

  ---

  ### Note for the Speaker (248 words)

  1.  **Accommodated Objections:**
      *   **Building Community (Objection 1):** The shared substance is the *experience* of bureaucratic language, made visceral by reading both letters aloud. The room connects through recognizing that first letter’s impenetrability or its consequence. Specific, concrete praise ("She made rules visible," "She gave people ground to stand on") replaces hollow generalities, aiming for shared understanding as the unifying force. Warmth comes from celebrating the tangible *result* of her work for the recipients present.
      *   **Thinness/Self-Regard (Objections 2 & 3):** The letters provide undeniable substance, preventing thinness. The focus stays relentlessly on *Kelleher's specific act* – the transformation of those sentences and its real-world consequence ("made argument possible," "gave people ground to stand on"). The Orwellian discipline serves *her* story; the critique targets the *language system*, not the speaker's cleverness. The final paragraphs explicitly name *her* action and *her* question as the hero. The style disappears into the substance of her achievement.

  2.  **Refused Objection:** Using stock phrases *would* undermine the core argument about language accountability. The speech refuses them absolutely.

  3.  **Near-Breaks:**
      *   "It turns a wall into a door." This is a metaphor. It was kept because it immediately follows the concrete analysis of the letters, visually crystallizing the functional shift ("block questions" vs. "invite one") already established factually. It avoids vague uplift.
      *   "It is about power." A large word. Kept because it's immediately defined concretely: "block questions" vs. "demand them," "hides the rule" vs. "shows it," "leaves the reader alone" vs. "gives them ground."

  4.  **Conceded Stock Phrase:** "extraordinary work." **Defence:** Its vagueness is offset by the preceding 150 words of highly specific description of *what* the work was and *why* it mattered. It serves as a necessary, brief summation after the concrete evidence.
