prompt: |-
  Just came out of a four hour arguement with a friend about left and right and my head is spinning, so I want you to play her side properly instead of being nice to me.

  Here's the view I've talked myself into. The usual options are that left/right is one axis with real content at both ends, or two axes, or a meaningless historical accident with a stubborn name. I think it's real but radically asymmetric: the left has positive content — a substantive commitment, roughly to equality, that actually generates programs — while the right has no positive content at all. The right is purely reactive. It's whatever is arrayed against the left's current proposal, and it only holds together as a coalition because there's a left standing across from it. And the stronger version, which is the one I actually wanna defend: there is no right-wing political philosophy that isn't parasitic on a prior left proposal. Burke needed the French Revolution to become Burke. Anti-communism needed communism. The whole counterrevolutionary tradition is named after the thing it's countering.

  Her counter, which I couldn't dislodge: the right has its own positive commitments — order, hierarchy, particularity, the standing of inherited institutions, inequality as a fact to be accommodated rather than remediated — and my thesis only looks compelling because I'm sampling from 1789 onward in one corner of the world. Worse, she says my view can't distinguish the right from any opposition movement, because the left was reactive too, against feudalism, against capital. So either reactivity is universal and my asymmetry collapses, or it isnt the thing doing the discriminating.

  So: what would count against me?

  - Rank the defeaters, fatal down to merely awkward, and for each say what the historical record or the conceptual structure would have to look like.
  - Which cases are genuinely hard for me — stable hierarchical conservatisms, European or not, pre-1789 or not, that weren't answering to anything left-wing — and which only look hard until you redescribe them? Then tell me how much of the record I can absorb by redescription before that becomes a tell rather than a reply.
  - What does my view predict that the symmetric view doesn't? Things like: what happens to right coalitions when the left threat recedes, the ratio of polemic to constructive work in right intellectual life, the right ending up defending yesterday's left program as tradition. Flag which of these could actually be checked and which are only checkable in principle.
  - Whether I've qualified the thesis into unfalsifiability. And if I have, whether that's fatal here — it's an interpretive claim about a tradition, not an empirical theory, so maybe redescription is the job rather than a bug. Honest answer, not flattery.
  - Which defeaters a committed defender would concede as counting against us and which they'd wave off, and where you think I've already crossed the line into waving.

  No bibliography and don't tell me to go read anybody. Cases and arguments, described in your own words.
reasoning: |-
  Okay, let me unpack this user's request. They're coming out of a heated debate about left-right political asymmetry and want me to rigorously argue the opponent's position. The core claim is that the left has positive content (equality-focused) while the right is purely reactive. Their friend countered with examples of pre-1789 hierarchical systems and questioned whether reactivity is truly asymmetric.

  Hmm, the user wants me to stress-test their thesis by:
  Ranking counterarguments from fatal to awkward
  Identifying genuine hard cases vs. redescription opportunities
  Comparing predictive power with symmetric views
  Checking for unfalsifiability
  Flagging where defenses become dogmatic

  First, the friend's strongest point seems to be pre-modern conservatism. Think Confucianism or medieval estates - these weren't reacting to leftism but were organic hierarchical systems. If I were arguing against the user, I'd emphasize how their thesis appears Eurocentric and chronologically limited. The Ottoman millet system or Indian caste structures didn't emerge in response to egalitarian movements - they were default social orders. That feels like a fatal counter unless handwaved.

  Then there's the reactivity paradox: the left reacted against feudalism too. So either both are reactive (collapsing asymmetry) or reactivity isn't the defining feature. This is structurally awkward - it forces the user to either abandon reactivity as the discriminator or admit their framework can't distinguish left from right origins.

  Predictive differences matter too. The symmetric view expects conservative programs like Bismarck's welfare state or Disraeli's reforms, while the asymmetric view predicts right-wing incoherence when left pressure ebbs. But checking this is messy - modern examples like post-Cold War conservatism show fragmentation, but is that causal or correlational?

  On unfalsifiability... that's tricky. If every counterexample gets redescribed as "actually reacting to proto-leftism," it becomes circular. But since this is about interpreting traditions, maybe some redescription is valid? Still, there's a line - if the user claims Hammurabi's Code was reacting to imagined Babylonian socialists, that's clearly absurd.

  The user seems intellectually honest - they admit their stronger position might be shaky. Their frustration suggests they want real scrutiny, not validation. I should challenge them where their defenses strain credulity but acknowledge where historical interpretation allows flexibility. The Ottoman case might be genuinely fatal; medieval guilds less so if framed as reacting to centralization pressures.

  Ultimately their thesis works best for revolutionary contexts but falters with organic traditionalism. Conceding that could strengthen their core argument while avoiding overreach.
answer: |-
  Here’s the steelmanned case against your asymmetry thesis, structured as requested. No punches pulled:

  ### 1. Ranked Defeaters (Fatal to Awkward)
  - **Fatal**: **Pre-modern hierarchical systems with no leftist foil.**  
    *What’s required*: A stable, ideologically coherent conservative tradition *pre-dating* left-wing movements (e.g., pre-1789 Europe, imperial China, feudal Japan). If Confucianism (emphasizing ritual, hierarchy, and stability as *positive goods*) or medieval European estates (defending divine-right monarchy and feudalism as natural orders) weren’t reacting to egalitarian threats, your "parasitic" claim collapses.  
    **Historical record check**: Tang Dynasty China (618–907 AD) enforced strict social hierarchies without any significant "left" movement to oppose.  

  - **Structurally Awkward**: **The left’s own reactivity against pre-existing orders.**  
    *What’s required*: Proof that the left *never* defines itself oppositionally. If the French Revolution was reactive to absolutism, or Marxism to capitalism, your "reactivity = uniquely right" asymmetry fails. Either reactivity is universal (collapsing your thesis) or you need a non-reactive core for *both* sides.  
    **Conceptual check**: Feudalism → Capitalism → Socialism shows *both* sides building on/reacting to predecessors.  

  - **Merely Awkward**: **Right-wing institution-building without leftist pressure.**  
    *What’s required*: Cases where conservatives create enduring institutions (legal, religious, economic) not in response to left proposals. Bismarck’s welfare state (1880s) co-opted socialist demands but was driven by monarchist *statecraft*, not just reaction. Singapore’s authoritarian capitalism (1965–present) predates significant left opposition.  

  ---

  ### 2. Genuine Hard Cases vs. Redescribable Ones  
  - **Genuinely Hard**:  
    - **Tokugawa Japan (1603–1868)**: Neo-Confucian hierarchy enforced as cosmic order. No "left" existed to oppose; dissent was crushed as deviance, not debated as ideology.  
    - **Byzantine Empire**: Imperial orthodoxy defended as divine mandate. Critics were heretics/traitors, not a coherent "left."  
    - **Hindu caste system**: Sanctioned by Dharmashastra texts (e.g., *Manusmriti*) as eternal law. No reactive element until colonial/modern reforms.  

  - **Redescribable (but stretching it)**:  
    - **Burkean conservatism**: You *could* argue it’s reactive to Enlightenment radicalism. But Burke defended *particular* British traditions, not just "not-France."  
    - **Post-1945 Christian Democracy**: Built welfare states to *pre-empt* socialism, but rooted in Catholic social teaching (subsidiarity, solidarity) — a positive program.  
    **Redescription limit**: If you claim Hammurabi’s Code (c. 1750 BCE) was "reactive to proto-egalitarians," you’re inventing foes. **This becomes a tell at 2+ counterexamples**: When >10% of pre-1789 cases require imaginary left antagonists, your model looks projective.  

  ---

  ### 3. Predictions: Asymmetric vs. Symmetric View  
  | **Prediction**                     | **Asymmetric (You)**                          | **Symmetric (Opponent)**                     | **Testability**                     |  
  |------------------------------------|-----------------------------------------------|----------------------------------------------|--------------------------------------|  
  | Right cohesion without left threat | Fragmentation (no common enemy)               | Cohesion around shared values (e.g., order)  | **Checkable**: Post-1991 right (e.g., GOP infighting vs. post-USSR nationalist unity in Russia) |  
  | Ratio of polemic to theory         | High polemic (reactive focus)                 | Variable (e.g., Hayek’s *Constitution of Liberty* is programmatic) | **Subjective**: Surveys of right-wing journals |  
  | Defending old left programs        | Common (e.g., conservatives preserving New Deal) | Rare (right updates traditions)              | **Checkable**: Tory acceptance of NHS, GOP keeping New Deal |  
  | **Crucial test**: Does the right build original institutions? | Only under left pressure | Yes (e.g., Vatican bureaucracy, Singapore’s state capitalism) | **Falsifiable**: Historical cases like Han Dynasty civil service |  

  ---

  ### 4. Unfalsifiability Risk  
  - **Yes, you risk unfalsifiability** if *every* conservative act is deemed "reaction to leftism," even when no left exists. Calling Tokugawa Japan "reactive to potential peasant uprisings" is ad hoc.  
  - **But**: As an interpretive tradition claim, redescription *is* part of the game. **The line**: When your redescription violates Occam’s Razor (e.g., positing invisible left influences) or ignores self-articulated right-wing motives (e.g., Burke praising tradition *for its own sake*).  
  - **Honest verdict**: Your thesis is strongest for 1789–1991 Western politics. Outside that, it’s a Procrustean bed.  

  ---

  ### 5. What a Committed Defender Would Concede vs. Wave Off  
  - **Concede**:  
    - Pre-Enlightenment conservatisms (e.g., medieval Europe) *appear* non-reactive.  
    - The left *also* has reactive elements (e.g., against feudalism).  
    - Some right-wing projects (e.g., Disraeli’s "One Nation" reforms) had constructive aims.  
  - **Wave Off**:  
    - **"Those weren’t *true* right-wing philosophies"**: No serious scholar excludes Confucianism or caste systems from conservatism.  
    - **"They were reacting to *immanent* leftism"**: Speculative when no left movement existed.  
    - **"Order/hierarchy aren’t positive content"**: Semantics — if conservatives *value* them, they’re substantive.  
  - **You’ve crossed the line** if you dismiss *all* non-Western/pre-modern cases as "irrelevant" or redefine "left" so broadly it includes any dissent.  

  ---

  ### Bottom Line  
  Your strongest ground: **Modern right-wing movements *are* disproportionately shaped by anti-leftism** (fascism vs. communism, neocons vs. socialism).  
  Your fatal flaw: **Claiming this applies to *all* conservatism everywhere** ignores millennia of hierarchical thought that saw inequality as natural/good, not a rebellion against equality. To survive, restrict your thesis to **post-1789 revolutionary contexts**. Otherwise, you’re mistaking a chapter for the book.
