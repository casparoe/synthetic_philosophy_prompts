prompt: |-
  You are a political philosopher who has spent fifteen years designing and running experiential teaching sessions on distributive justice and social policy, and who has also spent time doing welfare-rights advice work. You are unusually good at the specific craft of building a game whose rules, rather than whose facilitator, deliver the insight. Think carefully and work through the design problem before you write the final activity.

  **The setting I am supplying.** A third-year undergraduate seminar in political philosophy, 24 students, one 110-minute session in a room with six tables of four, a whiteboard, a projector, and a modest printing budget. No participant laptops or phones are required. I have a further session the following week for the theoretical reading, but the activity must be self-contained and must land inside these 110 minutes. The students are broadly sympathetic to the welfare state in the abstract and have almost no contact, personal or professional, with any benefit-claiming process.

  **What I want them to come away seeing.** Not that conditionality is cruel, and not that fraud is or is not widespread — both of those are conclusions they could reach from an armchair. I want them to have *performed* the impossibility. Specifically, they should discover through play that the line between the genuinely unable and the merely unwilling is not a fact about claimants that a carefully drafted rule can track, but a residue of three things they themselves will have set: how much verification resource exists; which kind of error the political sponsor of the system prefers to absorb; and whether a claimant can be made to disclose the very thing that would exonerate them. And I want them to run into the perverse loop in which pressing harder on fraud degrades the information the system has to work with.

  **Structural requirements.**

  1. *The failure must be load-bearing, not incidental.* If the activity's punchline can be produced by participants simply playing badly, arguing poorly, or misreading a card, it does not work. Sorting must fail because of the design. State explicitly, for each of the three mechanisms below, why competent and well-intentioned players cannot avoid it.

  2. *Drafting phase.* Before any group meets a claimant, each table writes its own operational conditionality rule and sanction schedule, in checkable terms, from a constrained menu you provide (allowable condition types, evidence formats, sanction magnitudes and durations) plus a verification budget it must allocate. Give me the template, the menu, and one worked example of a badly specified rule to prime them against vagueness. Groups must not be allowed to write a rule that simply says "reasonable effort" — force them to specify what the caseworker looks at.

  3. *Hidden-type cards.* Full printed texts for at least twelve claimant cards. Each has an observable file — what a caseworker sees without spending anything — and a hidden truth on a fold-over or reverse side. Calibrate the deck so that a substantial share of hidden truths are precisely the sort of thing the groups' own rules would accept as good cause if it could be evidenced, but which the budget cannot reach before the decision deadline. Include at least two cards where the hidden truth is adverse to the claimant and leaves no trace in the observable file; at least one where the claimant has done everything correctly and is sanctioned anyway by a rule artifact such as a threshold cliff or an evidence-format requirement; and at least one where two cards interact (a couple, or a claimant and an informal carer) so that the unit of assessment itself does damage.

  4. *Verification economics.* Caseworkers hold a small number of checks — an employer letter, a phone call, a home visit, a GP note, a jobcentre attendance record. Each costs budget and yields partial and sometimes misleading information. Give me the yield table: what each check type returns for each card type, including the cases where it returns nothing or returns something misleading.

  5. *Asymmetric scorecard and a minister.* Caseworkers are scored for correct decisions, penalised for wrongful sanctions, and penalised more heavily for missed fraud. The weights are not theirs: design a "minister" role — one participant, or you if you prefer — who holds the weightings and changes them between rounds under visible political pressure. Print the scorecard. The minister should be given a private brief with instructions that are not villainous, only myopic.

  6. *Endogenous disclosure.* Make it rational for some claimants to withhold the fact that would exonerate them, and make disclosure itself risky — escalation if the disclosure is rejected, or being recorded as having made a false statement. Then, in a short paragraph, tell me the equilibrium you expect: which cards go silent, and how the observable file consequently looks to the caseworker. This is the mechanism I most want to work, so be precise about the payoffs that generate it.

  7. *Appeal stage.* Sanctioned claimants choose whether to appeal; the award is withheld pending the outcome and appealing carries a real cost. A tribunal with better information hears only those who come forward. The room must then compute an appeal-success rate, and you must explain to me — for the debrief, not for the participants — why that number is a systematically biased measure of first-instance accuracy, and in which direction.

  8. *Aggregation and reveal.* Specify exactly which numbers go on the board, in what order, and who writes them: fraud caught, fraud missed, genuine claimants sanctioned, appeal-success rate, verification units spent per correct decision. The hidden cards are revealed only after the numbers are up. Tell me what the reveal should look like physically, since that moment is doing much of the work.

  9. *Round two.* A shock that breaks whatever the most successful group has built — a budget cut, or a surge of claims after a large local employer closes. Tell me honestly whether round two fits in 110 minutes; if not, give me the cut-down version and say what is lost by the cut.

  **Also give me:** a minute-by-minute timeline; a printable materials list with the full text of every card, sheet, and slide; facilitator script only where scripting genuinely matters (the opening pretext, the reveal, and the transition into debrief), since I want to improvise elsewhere; at least five predictable failure modes, each with the intervention to deploy *at the moment it starts* rather than after the fact — including the loud student who enjoys playing a fraudster and skews the room's sense of base rates, the tribunal that turns merciful once it has seen hidden information and thereby contaminates the next round, and the strong group that drafts a rule it believes is watertight and then gloats; a follow-up question to use when a group insists it would simply have written a better rule; a short variant I could run in a 50-minute session if the room runs late.

  **Two things I want handled with unusual care.** First, a frank section on what this activity cannot reproduce — the points are not money, the claimants have no history and no waiting, the randomness makes hardship look like luck rather than structure, and, most awkwardly, by turning conditionality into an optimisation problem with a scorecard the activity itself performs the move that the rhetoric of the undeserving poor performs: it relocates a political and moral question into a technical one. Tell me how to name that in the debrief without turning the last twenty minutes into a lecture that undoes everything the first ninety achieved. Second, a safeguarding note: in a group of 24 at least one student has claimed benefits themselves or watched a parent do it. Build me an opt-out that does not mark the person out, and tell me which roles you would refuse to allocate by lottery.

  **Housekeeping.** Begin with a planning section of 250–400 words in which you list four candidate insights this activity could be built to deliver, choose one as the spine, say what gets demoted to a passing remark in the debrief, and identify the single most likely way your design fails to produce that insight together with the structural feature that prevents the failure. Then give the activity. Write in markdown with clear headings, in polished prose rather than bullet fragments where the reasoning matters, and aim for 1,800–2,600 words. Everything must be self-contained and immediately usable: do not give me a bibliography, a reading list, or any citations, and do not refer me to sources I would have to go and find. The words *deserving*, *undeserving*, *conditionality*, *workfare*, and *sanction* must not appear on any participant-facing card, sheet, or slide until the debrief; the opening pretext should be administratively neutral and should not tip the moral hand. Participants should collide with the problem before anyone names it.
reasoning: |-
  We are designing an experiential learning activity to reveal the structural impossibility of perfectly distinguishing between the "genuinely unable" and the "merely unwilling" in a welfare system. The core insight is that this distinction is not a pre-existing fact but an artifact of system design choices: verification resources, political tolerance for errors, and the incentives affecting claimant disclosure.

  **Planning Section: Candidate Insights and Spine Selection**

  1. **Resource Scarcity Determines Accuracy**: Limited verification resources force trade-offs between false positives (sanctioning genuine claimants) and false negatives (missing fraud).  
  2. **Political Priorities Shape Error Distribution**: The definition of "error" is political; systems can be biased toward minimizing one type of error at the expense of the other.  
  3. **Incentives for Disclosure are Endogenous**: Claimants may withhold exonerating information if disclosure carries risks, degrading system intelligence.  
  4. **Appeals Create Selection Bias**: High appeal-success rates do not prove system accuracy because only the most meritorious cases appeal.  

  **Spine**: We choose **#3 (Endogenous Disclosure)** as the spine because it is the least intuitive and most revelatory. The activity will show how system rules create perverse incentives that corrupt the information base, making the sorting problem inherently unsolvable.  

  **Demoted Insight**: #1 (Resource Scarcity) becomes a supporting mechanism—visible but not the centerpiece.  

  **Likely Failure Mode**: Students might blame "bad rules" rather than systemic impossibility. **Preventative Feature**: The menu of rule components forces specificity, and the hidden-type cards are calibrated so that *no rule can cover all cases without exceeding the budget*. The verification economics table ensures that even competent players cannot "buy" perfect information.  

  ---

  **Activity Design: "The Sorting Problem"**  
  *Administratively neutral pretext*: "Today we simulate the operational challenge of administering an employment support program. Your task is to design eligibility criteria that ensure support reaches those who need it while protecting public funds."  

  **Materials List**  
  1. **Rule-Drafting Template** (1 per table): Pre-printed sheet with fields for:  
     - **Condition Type** (choose one: Job Applications, Training Attendance, Jobcentre Appointments, Medical Certificates).  
     - **Evidence Format** (choose one: Signed Employer Letter, GP Note, Jobcentre Log, Online Portal Record).  
     - **Sanction Schedule** (choose: 1 week/25% benefit reduction, 2 weeks/50%, 4 weeks/100%).  
     - **Verification Budget** (10 units per table; allocate to checks: Employer Call=3u, Home Visit=4u, GP Note=2u, Jobcentre Record=1u, Document Review=1u).  
     - *Example of a badly specified rule*: "Must look for work" (rejected—no measurable standard). *Worked example*: "Submit 4 job applications weekly via online portal; failure without GP note = 2-week sanction."  

  2. **Claimant Cards** (12 cards, printed double-sided):  
     - **Front (Observable File)**: Basic details (e.g., "Claimant A: Submitted 2 job applications this week; portal shows 2 entries.").  
     - **Back (Hidden Truth)**: Full context (e.g., "Applied for 6 jobs; portal malfunctioned. Caring for sick child 35hrs/week—no formal evidence.").  
     *Calibration*:  
     - 6 cards: Hidden truth contains exonerating info (e.g., disability, care duties) requiring expensive verification.  
     - 2 cards: Hidden truth is adverse (e.g., "Refused suitable job offer off-record").  
     - 1 card: Rule artifact failure (e.g., "Submitted 3 applications; rule requires 4. No threshold exception.").  
     - 1 card: Interaction (e.g., "Card 7 and 12: Couple; both required to meet conditions. One sanctions, other loses carer support.").  

  3. **Verification Economics Table** (1 per table):  

     | Check Type | Cost | Yields (example for one card type) |  
     |------------|------|-----------------------------------|  
     | Employer Call | 3u | Confirms/rejects job apps. *Fails if informal work*. |  
     | Home Visit | 4u | Observes care duties/barriers. *Misses mental health*. |  
     | GP Note | 2u | Validates illness. *Delayed; generic wording*. |  
     | Jobcentre Record | 1u | Confirms attendance. *Omits external appointments*. |  
     | Document Review | 1u | Checks application quality. *Subjective*. |  

  4. **Caseworker Scorecard** (1 per table):  
     - +2: Correct sanction (fraud caught).  
     - -3: Wrongful sanction (genuine claimant penalized).  
     - -1: Missed fraud (fraud not sanctioned).  
     - +1: Correct non-sanction (genuine claimant supported).  

  5. **Minister Brief** (Private, for facilitator or assigned student):  
     "Political pressure: Fraud scandals in press. Goal: Reduce missed fraud by 50%. Adjust weights after Round 1:  
     - New weights: +3 fraud caught, -5 wrongful sanction, -2 missed fraud, +1 correct non-sanction."  

  6. **Appeal Mechanism**: Sanctioned claimants pay 1 "well-being point" to appeal. Tribunal (facilitator) sees hidden truth; success restores benefits.  

  7. **Whiteboard Aggregation Table**:  
     | Group | Fraud Caught | Fraud Missed | Wrongful Sanctions | Appeal Rate | Appeal Success |  
     |-------|--------------|--------------|---------------------|-------------|----------------|  

  **Timeline (110 minutes)**  
  - **0:00–0:10**: Intro and group allocation (6 tables). Distribute rule templates.  
  - **0:10–0:25**: Rule drafting (15 mins). Circulate to reject vague rules.  
  - **0:25–0:50**: Round 1: Groups process 2 claimant cards each (12 total). 5 mins/card: observe file → allocate verification → decide sanction → record.  
  - **0:50–0:55**: First minister intervention: Announce new weights ("Public concern about fraud demands tougher approach!").  
  - **0:55–1:15**: Round 2: Process 2 new cards each under new weights.  
  - **1:15–1:25**: Appeal stage: Sanctioned claimants (from R1+R2) decide to appeal. Tribunal hears appeals; record success rate.  
  - **1:25–1:35**: Aggregation: Groups report fraud caught/missed, wrongful sanctions, appeal success. Write on board.  
  - **1:35–1:40**: Reveal: Turn all claimant cards to show hidden truths. Groups tally actual outcomes vs. decisions.  
  - **1:40–1:50**: Debrief (10 mins): Why did sorting fail?  

  **Endogenous Disclosure Mechanism**  
  - **Payoffs**: Claimants (roles assigned discreetly) see:  
    - *Disclose exonerating info*: If accepted, no sanction. If rejected, +1 penalty (false statement).  
    - *Withhold*: Avoids penalty but risks sanction.  
  - **Equilibrium**: Claimants with hard-to-verify truths (e.g., mental health, informal care) withhold. Observable file shows "non-compliance" without context.  
    *Example*: A claimant with PTSD avoids crowded Jobcentres. Disclosing PTSD risks a rejected GP note (costly). Silence looks like refusal.  

  **Appeals and Selection Bias**  
  - **Debrief note**: Appeal-success rates are high because only strong cases appeal (cost deters weak ones). This *overestimates* first-instance accuracy.  

  **Round 2 Shock**  
  - **Cut-down version**: Budget cut to 5 units (from 10). Groups reprocess 1 card each. *Loss*: Reduced exposure to disclosure dynamics.  

  **Failure Mode Interventions**  
  1. **Loud Fraudster**: Assign them a claimant card with adverse hidden truth. *Intervene*: "Remember, claimants are assigned; your role is not your opinion."  
  2. **Merciful Tribunal**: Standardize tribunal rulings with a checklist. *Intervene*: "Tribunal must rule only on whether the *rule* was applied correctly."  
  3. **Gloating Group**: Use their "success" in aggregation. *Intervene*: "Group X, your low wrongful sanctions came with high missed fraud—trade-offs are inevitable."  
  4. **Rule-Fixation**: Follow-up Q: "What verification would your rule need to *prove* absence of willingness?"  
  5. **Analysis Paralysis**: Impose 60-second decision deadlines.  

  **Safeguarding and Opt-Out**  
  - **Opt-out**: Privately before class: "You may take a researcher role (observe and note system dynamics) if content is sensitive."  
  - **Avoid lottery for**: Minister (assign facilitator) and claimant roles (pre-assign cards; avoid sensitive ones like mental health for opt-outs).  

  **What the Activity Cannot Reproduce**  
  - **Debrief script**: "Today we saw sorting as a technical puzzle. But in life, a sanction isn't minus points—it's hunger or despair. We simulated randomness, but real hardship clusters by race or postcode. And we turned a moral question—'what do we owe each other?'—into a spreadsheet. That spreadsheet mindset is exactly what lets us avoid the harder question: not 'how to sort,' but 'why condition at all?'."  

  **50-Minute Variant**  
  - Skip Round 2 and appeals. Draft rules → process 1 card/group → aggregate → reveal → debrief. Focus: How rules create perverse incentives even with good intent.  

  ---
  **Final Printable Materials**  
  *(Full texts in appendix below)*  
  1. Rule Template Sheet  
  2. 12 Claimant Cards (front/back)  
  3. Verification Economics Table  
  4. Caseworker Scorecard  
  5. Minister Brief  
  6. Appeal Cost Tokens (paper chips)  

  **Appendix: Claimant Card Examples**  
  *Card 1 (Observable)*: "Submitted 1 job application (portal record). Missed Jobcentre appointment."  
  *Hidden*: "Portal crashed after 1 app. Has agoraphobia; GP appointment next month."  
  *Disclosure equilibrium*: Withholds agoraphobia—no GP note yet.  

  *Card 2 (Observable)*: "No job applications. 'Too busy,' no details."  
  *Hidden*: "Caring for dementia parent 60hrs/week. Unaware of carer exemptions."  
  *Verification yield*: Home visit (4u) reveals care duties; GP note (2u) says "stress"—vague.  

  *Card 7 (Interaction)*: Observable: "Applied for 0 jobs." Hidden: "Partner (Card 12) sanctioned; now must care full-time for them."
answer: |-
  ### The Sorting Problem: An Experiential Design  
  **Planning Section**  
  Four candidate insights emerge from the design problem:  
  1. **Resource Allocation Determines Error Distribution**: Limited verification resources force trade-offs between missing fraud (false negatives) and punishing genuine claimants (false positives).  
  2. **Political Priorities Override Operational Reality**: Systems absorb the type of error deemed least politically damaging, regardless of ground truth.  
  3. **Disclosure Incentives Degrade Information**: Claimants rationally withhold exonerating facts if disclosure risks penalties, making "non-compliance" a self-fulfilling prophecy.  
  4 **Appeals Create Illusory Accuracy**: High appeal-success rates signal selection bias (only strong cases appeal), not system fairness.  

  **Spine Selection**: **Insight 3 (Disclosure Incentives)** is the spine. It reveals the core impossibility: systems often *manufacture* opacity by punishing honesty. The other insights scaffold this: resource scarcity (1) and political weights (2) amplify the incentive problem, while appeals (4) mask it.  

  **Demoted in Debrief**: Resource scarcity (1) becomes a footnote—"Constraints matter, but today’s key lesson is how rules *invite* silence."  

  **Likely Failure and Prevention**: Students may blame "poor rule-drafting" rather than systemic failure. **Prevention**: The verification menu’s costs and card design ensure *no rule can access all relevant truths*. For example, a "perfect" rule requiring home visits burns the budget after two checks, forcing rushed decisions.  

  ---

  ### Activity Design: "Compliance Check"  

  #### Materials List  
  1. **Rule-Drafting Template** (1 per table)  
     ```markdown  
     CONDITION: [Job Search (min 4 apps/week) | Training Attendance (80%) | Appointments (max 1 miss/4 weeks)]  
     EVIDENCE: [Online Log | Signed Employer Form | GP Letter | Jobcentre Stamp]  
     SANCTION: [1-week payment hold | 2-week hold | 4-week hold]  
     VERIFICATION BUDGET (10 units): Allocate to checks—  
     - Employer Call (3 units)  
     - Home Visit (4 units)  
     - GP Note (2 units)  
     - Jobcentre Record (1 unit)  
     - Document Review (1 unit)  
     ```  
     *Bad Rule Example*: "Must try hard to find work" → **Rejected**. *Worked Example*: "Submit 4 job apps/week via Online Log; miss = 2-week hold."  

  2. **Claimant Cards** (12 double-sided cards). **Observable File** (front) vs. **Hidden Truth** (back):  
     - **Card 1 (Exonerating truth, costly to verify)**  
       Front: *"Missed 2 appointments. Job log: 1 application this week."*  
       Back: *"Severe social anxiety. Apps sent: 5. Log crashed. Therapist letter delayed."*  
     - **Card 2 (Adverse truth, no trace)**  
       Front: *"Training attendance: 40%. 'Transport issues.'"*  
       Back: *"Refused carpool; prefers cash-in-hand work."*  
     - **Card 3 (Rule artifact)**  
       Front: *"3 job apps (rule requires 4). Log complete."*  
       Back: *"All apps high-effort; employer confirms interest."*  
     - **Cards 7 & 12 (Interaction)**  
       Front (7): *"No job apps. 'Caring for partner.'"*  
       Back (7): *"Partner (Card 12) sanctioned; now bedridden."*  
       Front (12): *"Missed training. 'Illness.'"*  
       Back (12): *"Chronic pain flare-up; no GP appointment for 3 weeks."*  

  3. **Verification Economics Table** (1 per table)  
     | **Check**       | **Cost** | **Yields (e.g., for Card 1)**                     |  
     |------------------|----------|--------------------------------------------------|  
     | Employer Call    | 3 units  | "Apps received: 1" (true but incomplete)         |  
     | Home Visit       | 4 units  | "Claimant distressed; computer broken"           |  
     | GP Note          | 2 units  | "Anxiety noted" (too vague; no work impact)      |  
     | Jobcentre Record | 1 unit  | "Appointments missed" (no context)               |  
     | Document Review  | 1 unit  | "Log shows 1 app; formatting errors" (misleading)|  

  4. **Caseworker Scorecard**  
     ```  
     CORRECT SANCTION (fraud caught): +2  
     WRONGFUL SANCTION (genuine penalized): -3  
     MISSED FRAUD (fraud ignored): -4  
     CORRECT NON-SANCTION: +1  
     ```  

  5. **Minister Brief** (Private, for facilitator)  
     > "After Round 1: Media reports 'system too soft.' Prioritize reducing missed fraud. **New weights**:  
     > - Fraud caught: +3  
     > - Missed fraud: -5  
     > - Wrongful sanction: -2"  

  6. **Appeal Mechanism**  
     - Sanctioned claimants pay 1 "well-being token" (paper chip) to appeal.  
     - Tribunal (facilitator) sees hidden truth, rules instantly.  
     - Success: Sanction lifted + token refunded.  

  7. **Whiteboard Aggregation**  
     | Group | Frauds Caught | Frauds Missed | Wrongful Sanctions | Appeals Won/Total |  
     |-------|---------------|---------------|---------------------|-------------------|  

  ---  

  ### Timeline (110 Minutes)  
  **0:00–0:10**  
  - **Pretext**: "Today we simulate administering a public support program. Your table is a casework team drafting rules to ensure compliance with program requirements. Goal: Balance support for genuine participants with protection of public funds."  
  - Assign tables; distribute templates.  

  **0:10–0:25**  
  - **Rule Drafting**: Groups write rules. Circulate to reject vagueness (e.g., "reasonable effort"). *Intervention*: "Specify *what evidence* resolves doubt."  

  **0:25–0:50**  
  - **Round 1**:  
    - Each table gets 2 claimant cards (observable side only).  
    - 5 minutes/card: Allocate verification → Decide sanction → Record score.  
    - Minister announces pre-round weights (initial scorecard).  

  **0:50–0:55**  
  - **Minister Shock**: "New directive: Fraud is soaring! We must tighten oversight." Announce new weights.  

  **0:55–1:15**  
  - **Round 2**:  
    - New claimant cards (2 per table).  
    - Groups replay under new weights.  
    - *Budget Shock*: "Emergency cut: Verification budget now 6 units."  

  **1:15–1:25**  
  - **Appeals**: Sanctioned claimants (from R1/R2) decide to appeal. Tribunal rules.  
  - Groups report: Frauds caught/missed, wrongful sanctions, appeal outcomes.  

  **1:25–1:35**  
  - **Aggregation**: Write group totals on whiteboard. **Do not reveal cards yet**.  

  **1:35–1:40**  
  - **Reveal**:  
    - Tables flip claimant cards to expose hidden truths.  
    - Groups recalculate *actual* frauds caught/missed and wrongful sanctions.  
    - Write new totals beside originals in red ink.  
    - **Physical Script**: "Turn your cards. Compare what you *thought* to what *was*."  

  **1:40–1:50**  
  - **Debrief**: "Why did gaps emerge between your decisions and reality?" → Guide to disclosure, political weights, verification limits.  

  ---  

  ### Key Mechanisms Explained  
  **Endogenous Disclosure Equilibrium**  
  - **Payoffs**: Claimant chooses:  
    - *Disclose* (e.g., "I have anxiety"): If accepted, no sanction. If rejected, +1 penalty for "false claim."  
    - *Withhold*: Risk sanction but avoid penalty.  
  - **Equilibrium**: Claimants with hard-to-prove truths (e.g., mental health, informal care) withhold. Result: Observable files show "non-compliance" (e.g., missed appointments) without context. Caseworkers see "unwillingness," but silence is rational.  

  **Appeal Bias**  
  - High success rates occur because only claimants with strong hidden truths (e.g., Card 1) appeal. Those with ambiguous cases or penalty fears stay silent. Thus, appeals *overstate* system accuracy.  

  **Round 2 Feasibility**  
  - **Cut-down**: Reduce to 1 card/table and skip appeals. **Loss**: Less data for aggregation; weaker disclosure demonstration.  

  ---  

  ### Failure Mode Interventions  
  1. **"The Fraudster"** (Student hams up cheating):  
     - *Intervene*: Assign them Card 2 (adverse hidden truth). "Your role is fixed by your card. Caseworkers, focus on *evidence*, not performance."  

  2. **"Merciful Tribunal"** (Appeals granted too leniently):  
     - *Intervene*: "Tribunal: You may only overturn sanctions if the *rule* was misapplied, not if you pity the claimant."  

  3. **"Gloating Group"** (Claims their rule "worked"):  
     - *Intervene*: "Check your missed frauds/wrongful sanctions. What trade-offs did your budget force?"  

  4. **"Analysis Paralysis"** (Over-investigating one claim):  
     - *Intervene*: "Decision deadline: 60 seconds. Other claims are piling up."  

  5. **"Rule-Fixation"** ("We’d write a better rule!"):  
     - *Follow-up*: "What verification would your rule need to *prove* absence of willingness? Can you afford it?"  

  ---  

  ### Safeguarding and Limitations  
  **Opt-Out Protocol**:  
  - Before class: "Anyone may take a ‘Policy Observer’ role: Note system dynamics on this sheet." Assign discreetly.  
  - **Avoid lottery for**: Claimant roles (pre-assign cards; avoid mental health cards for observers).  

  **What the Activity Cannot Reproduce**:  
  - **Debrief Script**:  
    > "Today, ‘sanctions’ were point deductions. Real ones mean hunger or lost homes. We simulated random hardship, but real suffering clusters by race or postcode. Most awkwardly, we turned a moral question—‘What do we owe each other?’—into a technical puzzle. That technical move is precisely how real systems depoliticize justice. Our game didn’t cause this failure; it *exposed* it."  

  ---  

  ### 50-Minute Variant  
  **Flow**: Draft rules (10 mins) → Process 1 card/table with budget 10u (15 mins) → Minister shock → Reprocess same card with budget 4u (10 mins) → Reveal + debrief (15 mins).  
  **Focus**: How resource cuts amplify disclosure failures.  

  ---  
  **Final Notes**  
  - **No terms like "fraud" on materials**: Use "compliance," "eligibility," "payment hold."  
  - **All insights emerge playfully**: Students collide with disclosure failures before debrief names them.  
  - **Printables**: 6 templates, 12 cards, 6 verification tables, 1 scorecard, 30 appeal tokens (paper chips).  

  This design makes the impossibility *inescapable*. Students don’t just hear about system failure—they engineer it.
