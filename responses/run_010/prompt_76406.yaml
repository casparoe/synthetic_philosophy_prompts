  - The duration of real gridlock. In the game, the gridlock lasts minutes, but in reality, it can take years. The game might suggest that with patience, the negotiations will succeed, but in reality, the costs and uncertainties may persist indefinitely.

  **Real-World Correspondences:**
  - Round 1: Open source software development, Wikipedia.
  - Round 2: Patent thickets in biotechnology or software, where multiple patents must be licensed to create a product.
  - Round 3: Academic research, where you must cite prior work extensively, and the fear of being "scooped" or not getting credit.

  **Breakdown of Correspondence:**
  - In Round 2, real licensing often involves money, which we avoid. Also, in reality, there are legal remedies for unreasonable refusal (e.g., FRAND licensing) which we don't have.
  - In Round 3, real attribution chains are not usually enforced by the original inventor's permission; they are enforced by norms and journals. Also, the reward for attribution (1 RP) is immediate, whereas in academia, credit is long-term and uncertain.

  **Final Component List:**

  We'll create a deck of 60 cards with unique IDs (C1 to C60). Each card has one word. We can pre-generate a list of 15 words for each category:

  - Nouns: Tree, House, Car, Book, Dog, Cat, Sun, Moon, Chair, Table, Computer, Phone, Water, Air, Fire
