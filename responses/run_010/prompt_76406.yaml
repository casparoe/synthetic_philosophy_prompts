  ### In-Class Game: The Idea Commons Challenge  
  **Objective:** Illustrate how fragmented intellectual property rights (the "anti-commons" problem) create gridlock, emphasizing that the resource (ideas) is non-rivalrous but the reward (credit) is positional. Students experience three rounds, each with different rules, using the same components and tasks. Gridlock emerges rationally, without villains.

  ---

  ### **Game Components**  
  #### **Component Deck (60 cards, each 3"x5")**  
  - **Content:** Each card has a **unique alphanumeric ID** (e.g., A1, B7, C12) and a **simple, reusable concept** (e.g., "gravity," "democracy," "neuron"). Avoid narrow terms to allow broad recombination.  
    - **Breakdown:**  
      - 20 cards: Scientific concepts (e.g., "entropy," "photosynthesis").  
      - 20 cards: Societal concepts (e.g., "justice," "trade," "narrative").  
      - 20 cards: Abstract symbols (e.g., "∞," "⊆," "⇄").  
  - **Rationale:** Mixes tangible and abstract ideas to mirror real-world IP (e.g., patents, theories, cultural symbols). Cards are generic to ensure multiple valid combinations.  

  #### **Task Cards (6 cards, each requiring 3 components)**  
  Tasks involve creating a "discovery" (e.g., a hypothesis, theory, or invention) by combining components. Examples:  
  1. "Explain how two forces interact in a system." (e.g., "gravity + democracy + ∞" → "Gravity limits democratic equality in infinite space.")  
  2. "Describe a cyclical process in nature or society."  
  3. "Propose a solution to a conflict using a symbol."  
  4. "Define a new rule for sharing resources."  
  5. "Predict an unintended consequence of progress."  
  6. "Create a metaphor for human cognition."  
  - **Submission:** Students write their discovery on a blank sheet with the task card and component IDs.  

  #### **Payoff Scheme: Recognition Points (RPs)**  
  - **Positional Reward:** Only the **first 3 submissions per task** earn RPs (3 for 1st, 2 for 2nd, 1 for 3rd). Submissions after the first 3 earn 0.  
  - **Why students care:** RPs convert to **"priority choice" for the next assignment** (e.g., first pick of debate topics). Emphasize: "RPs reflect real-world credit—being first matters more than being right."  
  - **Tracking:** Public leaderboard (whiteboard) updated after each round.  

  ---

  ### **Rules Read Aloud (Exact Wording)**  
  **Intro (2 min):**  
  *"We’re exploring how ownership affects idea-sharing. There are three rounds with the same 6 tasks and 60 components. In each round, you’ll try to complete tasks for RPs. RPs determine your choice order for next week’s assignment. Work individually. I’ll announce when to start and stop. Ask questions now—no rule debates mid-game."*  

  **Round 1: Commons Pool (5 min)**  
  *"Components are in a shared pool (table center). Take any card freely—no ownership. Complete a task by writing your discovery, listing the 3 component IDs, and bringing it to me with the task card. First 3 submissions per task earn RPs. You can attempt multiple tasks, but only one submission at a time."*  

  **Round 2: Licensing (10 min)**  
  *"I’ve dealt each of you 3 random components—you own these. To use a component you don’t own, negotiate a license with its owner. Owners, you set license terms: ask for anything except RPs (e.g., ‘Trade me a component,’ ‘Help me with a task,’ or ‘Attribute me in your discovery’). Licenses are non-exclusive (owners can license to many). Write license terms on a slip (provided), sign it, and attach it to your submission. First 3 submissions per task earn RPs. You cannot use unlicensed components."*  

  **Round 3: Attribution Chain (10 min)**  
  *"Components are free to take from the pool, but ownership isn’t the focus. When you submit a discovery, you must include a complete ‘attribution chain’ for each component. Here’s how:  
  1. When you take a component, write your name on its card.  
  2. If you use a component, list every student who has ever held it (in order) on your submission.  
  3. If your discovery uses another student’s discovery (from a prior submission), list their entire chain too.  
  Example: If Ana held ‘gravity,’ then Ben used it in Discovery X, and you use Discovery X, your chain is ‘Ana → Ben → You.’  
  First 3 submissions per task earn RPs. New discoveries become components in the pool—add them with your name and a new ID (e.g., D1)."*  

  ---

  ### **Teacher’s Role**  
  - **Setup:** Lay components in the center. Shuffle task cards face-up on a side table. Distribute license/attribution slips (small paper squares).  
  - **During Game:**  
    - **Adjudicate disputes** (e.g., license terms, chain errors) with a 30-second ruling. Expect 2–3 disputes in Round 2, 4–5 in Round 3.  
    - **Simultaneous submissions:** Time-stamp papers; if identical, reward both.  
    - **Monitor:** Note gridlock moments for debrief.  
  - **Timekeeping:** Use a visible timer. Announce: "4 minutes left," then "1 minute."  

  ---

  ### **Timeline (75 min Total)**  
  - **0:00–0:05:** Explain game, RPs, and Round 1 rules.  
  - **0:05–0:15:** Round 1 (5 min play + 5 min tally/submissions).  
  - **0:15–0:25:** Reset components. Explain Round 2 rules.  
  - **0:25–0:40:** Round 2 (10 min play + 5 min tally).  
  - **0:40–0:50:** Reset. Explain Round 3 rules.  
  - **0:50–1:05:** Round 3 (10 min play + 5 min tally).  
  - **1:05–1:20:** Debrief (15 min).  

  ---

  ### **Debrief (15 min)**  
  **Goal:** Students articulate the anti-commons problem without naming it. Connect rounds to real IP.  
  **Script:**  
  1. **Round 1:** *"What happened? How many tasks were completed?"*  
     - Expected: Fast, high participation. Point: "No ownership = no friction. But did early finishers monopolize RPs? That’s the **positional reward**—the idea isn’t depleted, but credit is zero-sum."  
     - Real IP: Open-source communities (e.g., Linux).  

  2. **Round 2:** *"What slowed you down? Were licenses fair?"*  
     - Expected: Negotiations, missed submissions. Point: "Each owner acted rationally—no villains—but **fragmented rights** caused gridlock. The resource was usable, but the **transaction costs** (time, bargaining) made it impractical."  
     - Real IP: Patent thickets (e.g., smartphone lawsuits).  

  3. **Round 3:** *"How did attribution feel? Why was it absurd?"*  
     - Expected: Chains grew chaotic; submissions stalled. Point: "Attribution didn’t block use, but the **administrative burden** diverted energy from creation. Credit became a **chain of claims**, not a reward for innovation."  
     - Real IP: Academic publishing (e.g., citation requirements).  

  4. **Synthesis:** *"Describe the core problem in Round 2 and 3. How is it different from ‘tragedy of the commons’?"*  
     - Guide them to: "Too many veto points paralyze a **non-rival resource**. It’s not overuse (commons), it’s **underuse**." Name it: "This is the **anti-commons gridlock**."  

  ---

  ### **Predictable Problems & Solutions**  
  1. **Student refuses to license (Round 2):**  
     - *Why:* Ideological protest ("Ideas should be free!").  
     - **Solution:** Remind: "Owners set terms, but refusing all licenses risks your components going unused. Is that rational?" If they persist, note it in debrief: "Even one holdout can deadlock a task needing their component."  

  2. **Pair colludes to lock others out (Round 2):**  
     - *Why:* They trade licenses exclusively.  
     - **Solution:** Allow it. In debrief, ask: "Did this help them? Probably not—they still needed 3 components. Collusion often backfires by stalling the whole system."  

  3. **Round 1 finishes too fast (hoarder):**  
     - *Why:* One student grabs 10+ components.  
     - **Solution:** No intervention. Debrief: "Hoarders ‘won’ RPs but wasted unused components. In real IP, this mirrors **patent trolls**—but here, the problem wasn’t the hoarder, it was the **lack of access rules**."  

  4. **Attribution errors (Round 3):**  
     - *Why:* Chains get too complex (e.g., forgetting a holder).  
     - **Solution:** Reject submissions with errors. Point out: "Real research spends years on citations—our 10-minute version is a merciful shorthand."  

  ---

  ### **20-Minute Compressed Version**  
  - **Skip Round 3.** Focus on anti-commons.  
  - **Timeline:**  
    - 0:00–0:03: Explain RPs and Round 1 rules.  
    - 0:03–0:08: Round 1 (3 min play + 2 min tally).  
    - 0:08–0:10: Reset. Explain Round 2 rules.  
    - 0:10–0:17: Round 2 (5 min play + 2 min tally).  
    - 0:17–0:20: Debrief: Contrast Rounds 1 and 2; define anti-commons.  

  ---

  ### **What the Game Cannot Reproduce**  
  **Duration of gridlock.** Real anti-commons (e.g., gene patents, copyright disputes) persist for years as parties invest in workarounds, litigation, or lobbying. A 10-minute round implies gridlock is solvable with patience or bargaining. In reality:  
  - **Why it matters:** Long-term gridlock deters innovation (e.g., AIDS drug patents delaying generics).  
  - **Mitigation:** In debrief, stress: "Real gridlock involves **sunk costs** and **institutional inertia**—things we can’t simulate in a classroom."  

  ---

  ### **Real-World Correspondence & Limits**  
  - **Round 1 (Commons Pool):**  
    - **Correspondence:** Open innovation (e.g., Wikipedia, open-source software).  
    - **Breakdown:** Real commons often have informal norms (e.g., crediting); our version lacks these, overstating efficiency.  

  - **Round 2 (Licensing):**  
    - **Correspondence:** Patent thickets (e.g., tech companies cross-licensing).  
    - **Breakdown:** Real licensing involves money/lawyers; our "barter" system underplays power imbalances.  

  - **Round 3 (Attribution Chain):**  
    - **Correspondence:** Academic credit (e.g., citation chains, peer review).  
    - **Breakdown:** Real attribution is automated (e.g., bibliographies); our manual process exaggerates the burden.  

  ---

  **Final Prep Tips:**  
  - Print components/tasks on cardstock. Have extra blanks for Round 3 discoveries.  
  - For disputes: Use a "1-minute sand timer" to keep rulings fair and fast.  
  - In debrief: **Never** say "anti-commons" until students describe the gridlock. Their frustration is the lesson.  

  This game transforms abstract IP critiques into visceral experience. Students leave seeing gridlock as systemic—not a failure of people, but of structure.
