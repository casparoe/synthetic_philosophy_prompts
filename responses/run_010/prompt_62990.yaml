answer: |-
  Below is a sorting instrument designed to surface hidden disagreements about what constitutes corruption, framed through concrete scenarios without using prohibited terms. It focuses on three axes:  
  - **(a) Expectation**: Does the giver expect a **specific official act** in return, or **general goodwill/standing**?  
  - **(b) Relationship**: Is the interaction **transactional** (ends after the exchange) or **relational** (continues beyond it)?  
  - **(c) Defense**: Would the person **defend the action openly** to an uninvolved stranger, or **avoid discussing it**?  

  The instrument includes 10 scenarios (3 with specific local textures) and a scoring key mapping answer patterns to 8 distinct "leaves" (positions). Empty grid cells are explained, and limitations are noted.  

  ---

  ### **Sorting Instrument: Understanding Local Practices**  
  **Instructions**: Read each scenario and select the option closest to your view. There are no right/wrong answers—be honest about what you’d do in context.  

  1. **Customs Clearance (Coastal Country)**  
     Your NGO’s medical supplies are stuck at a port. A customs clerk says paperwork is complete but clearance takes 3 weeks. A local agent whispers: "Give the clerk $100 in an envelope now, and it’s done today."  
     - A. Give the money—delays cost lives, and this is routine here. You’d explain this logic to outsiders.  
     - B. Give the money but view it as a one-time necessity; you wouldn’t mention it unless asked directly.  
     - C. Refuse; follow the official process even with delays.  

  2. **Village School Renovation**  
     Your NGO repairs a school roof. The head teacher requests your team also fix her personal shed, arguing, "I’ve organized parents to guard your materials at night."  
     - A. Repair the shed—it ensures her continued support for the school project.  
     - B. Refuse; NGO resources can’t cover private property.  
     - C. Repair it but clarify this ends your obligation to her.  

  3. **District Engineer’s Festival Gift**  
     An engineer approves your water project. During a local festival, he visits your office and hints his family struggles financially. Giving gifts to officials is traditional today.  
     - A. Give a generous cash gift—it’s expected, and refusing would insult him. You’d defend this as cultural respect.  
     - B. Give a small token gift (e.g., fruit basket) to avoid offense but downplay it later.  
     - C. Politely decline; gifts blur professional boundaries.  

  4. **Permits for Land Survey**  
     A district official can fast-track your land survey permit if you hire his recommended contractor (market-rate, qualified). Otherwise, it takes months.  
     - A. Hire the contractor—it’s efficient and builds goodwill for future permits.  
     - B. Hire them but see it as a one-off trade for the permit; don’t discuss openly.  
     - C. Decline; use your usual contractor and accept delays.  

  5. **MP’s Job Request**  
     An MP who secures security for your rural clinics asks you to hire his nephew as a driver. The nephew meets minimum qualifications but isn’t the strongest candidate.  
     - A. Hire him—the MP’s ongoing support is vital for community access. You’d justify this as pragmatic.  
     - B. Hire him to repay past help but avoid future favors.  
     - C. Refuse; hire the most qualified candidate.  

  6. **Procurement Officer’s "Advice"**  
     A procurement officer suggests your NGO buy supplies from her cousin’s shop (prices are fair). She adds, "My family expects me to help them; I’ve waived your warehouse fees before."  
     - A. Buy from the cousin—family obligations underpin trust here. You’d openly cite local kinship norms.  
     - B. Buy from them this once to acknowledge past favors but switch suppliers later.  
     - C. Choose a different vendor; avoid conflicts of interest.  

  7. **Community Leader’s "Speed Money"**  
     A village council chair can expedite a community vote for your project if you cover "admin costs" ($50). Without this, the vote stalls indefinitely.  
     - A. Pay—it’s how things function here. You’d tell outsiders it’s essential for progress.  
     - B. Pay but view it as buying a specific service; end dealings with the chair afterward.  
     - C. Refuse; projects must follow formal timelines.  

  8. **Head Teacher’s Donation Event**  
     A school head invites you to a public fundraiser where officials’ donations are announced. She implies your NGO’s future access to schools depends on "showing commitment."  
     - A. Donate generously—it’s an investment in long-term collaboration. Defend it as community engagement.  
     - B. Donate minimally to avoid public embarrassment but resent the pressure.  
     - C. Donate openly to a different school; no strings attached.  

  9. **Family Pressure in Hiring**  
     Your unqualified cousin demands an NGO job, citing family sacrifices for your education. Your uncle warns: "Refusing shames us all."  
     - A. Create a make-work role—family bonds outweigh strict rules. You’d defend this as cultural duty.  
     - B. Give a one-time cash gift to placate them; avoid mentioning it.  
     - C. Refuse; hire based on merit only.  

  10. **Contractor’s "Hospitality"**  
     A construction contractor renovating your office invites you to an expensive dinner. He says, "I want your honest feedback on my work—away from formal settings."  
     - A. Attend—it builds a partnership. You’d frame it as relationship-building.  
     - B. Attend but see it as transactional (feedback for a meal); keep it private.  
     - C. Decline; discuss feedback in the office.  

  ---

  ### **Scoring Key**  
  Map your answers to the grid below. Each option corresponds to a combination of the three axes:  
  - **Expectation**: Specific (S) or General (G)  
  - **Relationship**: Transactional (T) or Relational (R)  
  - **Defense**: Defend (D) or Not Defend (N)  

  | Scenario | Option A      | Option B          | Option C  |  
  |----------|---------------|-------------------|-----------|  
  | 1        | G, R, D       | S, T, N           | —         |  
  | 2        | G, R, D       | —                 | S, T, N   |  
  | 3        | G, R, D       | G, R, N           | —         |  
  | 4        | G, R, D       | S, T, N           | —         |  
  | 5        | G, R, D       | S, T, N           | —         |  
  | 6        | G, R, D       | S, T, N           | —         |  
  | 7        | S, T, D       | S, T, N           | —         |  
  | 8        | G, R, D       | G, R, N           | —         |  
  | 9        | G, R, D       | S, T, N           | —         |  
  | 10       | G, R, D       | S, T, N           | —         |  

  **Option C (not fully mapped)**: Consistently signifies a "hardline" position (avoids exchanges; prioritizes rules).  

  #### **Grid Positions & Leaves**  
  The grid has 8 possible cells (2x2x2). Five are occupied; three are empty:  
  - **A1, B1, C1 (S-T-N)**: **Plain bribery**. *Occupied*. Expects a specific act, transactional, not defended.  
  - **A1, B1, C2 (S-T-D)**: **Facilitation payment** ("speed money"). *Occupied*. Specific act, transactional, defended as functional.  
  - **A2, B1, C1 (G-T-N)**: *Empty*. Incoherent—general goodwill requires continuity (relational), not a one-off transaction.  
  - **A2, B1, C2 (G-T-D)**: *Empty*. Unattractive—defending a transactional gift for goodwill feels manipulative.  
  - **A1, B2, C1 (S-R-N)**: **Coerced obligation** (invented label). *Occupied*. Specific act in a relational context, not defended (e.g., Scenario 9B).  
  - **A1, B2, C2 (S-R-D)**: **Nepotism/favor-repayment**. *Occupied*. Specific act, relational, defended as ethical (e.g., "helping family").  
  - **A2, B2, C1 (G-R-N)**: **Coerced gift**. *Occupied*. General goodwill, relational, not defended (e.g., Scenarios 3B/8B—given to avoid offense).  
  - **A2, B2, C2 (G-R-D)**: **Patronage** or **cultural gift**. *Occupied*. General goodwill, relational, defended as legitimate (e.g., Scenario 5A).  

  **Leaves Identified**:  
  1. **Plain bribery** (S-T-N)  
  2. **Facilitation payment** (S-T-D)  
  3. **Coerced obligation** (S-R-N, invented)  
  4. **Nepotism/favor-repayment** (S-R-D)  
  5. **Coerced gift** (G-R-N)  
  6. **Patronage/cultural gift** (G-R-D)  
  7. **Hardline view** (consistent Option C): Any use of public office for private ends is unacceptable.  
  8. **Deflationary view** (mix of D-options): Reciprocity is functional; "corruption" is an outsider term for normal exchange.  

  #### **Limitations & Unresolved Pairs**  
  - **Patronage vs. Deflationary View**: Both select G-R-D options. Patronage sees this as system-specific (e.g., MP jobs); deflationary view sees *all* exchanges as valid.  
    - *11th Question Needed*: *"A politician directs NGO funds to his district, creating jobs but bypassing needier areas. Is this..."*  
      - A. Legitimate—leaders know local needs best (patronage).  
      - B. Functional—all reciprocity serves a purpose (deflationary).  
  - **Nepotism vs. Coerced Obligation**: Both involve specific asks in relational contexts, but nepotism is defended (S-R-D), coerced obligation is not (S-R-N). Scenarios 6/9 separate these.  
  - **Facilitation Payment vs. Plain Bribery**: Separated by defense (D vs. N).  

  ---

  ### **Predicted Room Split & Tension Points**  
  **Country-office staff** will cluster in **relational** positions (G-R-D, G-R-N, S-R-D, S-R-N), especially:  
  - Patronage (G-R-D) and coerced gifts (G-R-N) for officials (Scenarios 3, 5, 8).  
  - Facilitation payments (S-T-D) for urgent needs (Scenario 1).  
    *Reasoning*: Their daily reality requires maintaining relationships; they see reciprocity as survival.  

  **Compliance staff** will cluster in **hardline** or **transactional** positions:  
  - Hardline (Option C) or plain bribery (S-T-N) for most exchanges.  
  - Limited tolerance for cultural gifts (G-R-D) if publicly defended (Scenario 3A).  
    *Reasoning*: They prioritize policy consistency and risk avoidance; relational exchanges feel like slippery slopes.  

  **Argument Starters**:  
  1. **Facilitation payments** (Scenario 1): Country staff will defend as essential ("speed money"); compliance will call it bribery with branding.  
  2. **Nepotism** (Scenario 6): Country staff will frame it as kinship obligation; compliance will see fraud.  
  3. **Coerced gifts** (Scenario 3B): Country staff admit they’re unavoidable but shameful; compliance asks why they’re tolerated.  

  **Workshop Second Half**: Focus on Scenario 1 (customs) and Scenario 5 (MP’s nephew) to drill into the **expectation/defense disconnect**. Ask: "When does reciprocity become extraction?" Use the grid to show how both sides occupy different cells but label practices similarly. Then, co-draft guidelines distinguishing "mandatory" vs. "forbidden" exchanges using local terms (not "corruption").
