prompt: |-
  I'm a second-year graduate student in philosophy, and this term my seminar has been working through the debate between telic egalitarianism and the priority view. For our last session I was asked to reconstruct Parfit's leveling-down objection in a form that does more work than the standard intuition pump about blinding the sighted, and I ended up with an argument that seemed to me to show the objection generalizing well past egalitarianism — to the priority view itself, and then, to my horror, to the total view as well. My seminar partner thinks the argument proves too much and that I should withdraw it. I suspect she is right, but I cannot localize the bad step: every premise looks like something a welfarist of any stripe should accept, and the transitions look short. Below is the argument as I presented it. Which step do you reject, and what does rejecting it cost?

  **Setup.** Outcomes are described as vectors of lifetime wellbeing for a fixed population of two people, P1 and P2. Three views are on the table. The *total view* ranks outcomes by the sum of the levels. The *priority view* ranks them by the sum of a strictly increasing, strictly concave transform *f* of each person's level, so that a benefit of a given size counts for more the lower the absolute level at which it falls; for concreteness let *f* be the square root. *Telic egalitarianism* ranks them by some combination of the sum and the degree of equality between the two levels. The leveling-down change (LD) is the move from (100, 200) to (100, 100): nobody gains, P2 loses a hundred, equality is achieved.

  1. Any axiology that ranks A above B must be able to identify some feature of A, absent from B, in virtue of which A is better. A ranking that points to no such feature is not a claim about value at all.
  2. The only features of an outcome in virtue of which it can be better are features of how individual lives go. Nothing over and above the levels of the persons in it — no arrangement, no pattern, no relation among them — can contribute value.
  3. Therefore, if A is better than B, then some person's life goes better in A than in B; A must be better for somebody.
  4. Now take A = (30, 190) and C = (20, 200). These have the same total, 220, so the total view is indifferent between them; but with *f* the square root the priority view ranks A above C (roughly 19.26 against 18.61). The raw person-affecting facts here are a wash: A is better for P1 by exactly ten units and worse for P2 by exactly ten units. So the feature that tips the scale for the prioritarian cannot be anybody's gain. It is the declining slope of *f* — a fact about the shape of the distribution taken as a whole.
  5. By (1)–(3), a ranking whose decisive feature is the shape of a distribution rather than somebody's gain is not a genuine claim about value. So the priority view, in ranking A above C, posits value that is located nowhere.
  6. That is precisely what the leveling-down objection said about the egalitarian: that in LD the extra value the egalitarian detects has no location in any life. So the objection is not a local embarrassment for telic egalitarianism. It refutes the priority view by the same route, and — this was the part I thought was elegant — it does so using the priority view's own criterion, that only absolute levels and not comparisons matter morally.
  7. The reasoning is not restricted to concave weightings. Take A* = (150, 60) and C* = (100, 100). The total view ranks A* above C*, since 210 beats 200; the priority view, with *f* the square root, ranks C* above A*. Neither ranking is explained by anyone's gain: A* is better for P1 by fifty and worse for P2 by forty, and the feature that breaks the tie for the total view is the size of the sum, which belongs to the pair and not to either member of it.
  8. Hence, if the argument is sound, every welfarist axiology that ranks outcomes by any function of a distribution — which is to say all of them — posits value located nowhere, and there are no comparative rankings of distributions at all.

  Step (8) is the conclusion I cannot accept, and it is not only its breadth that bothers me. The principle driving steps (2) and (3) would also seem to condemn a good deal else that I want to keep: the retributivist's claim that a punished wrong is a better state of affairs than an unpunished one even when the punishment makes nobody's life go better; the claim that a rainforest nobody will ever visit is better for its biodiversity; the claim that a promise to someone now dead can still be kept or broken. And the pluralist egalitarians in our seminar have a ready answer to the leveling-down case that I could not dislodge — that being better in one respect is a real relation that need not coincide with being better for anyone, so the egalitarian can happily concede that LD is all-things-considered worse while insisting that something of value was gained.

  So: which step goes, and what do I pay for dropping it? I would most like to preserve the insight behind (6), namely that the leveling-down objection ought to be statable as a general constraint on value rather than resting on an intuition about blindness, but not at the price of (8). In particular I want to know whether there is a principled line between the prioritarian's concave *f* and the egalitarian's equality term such that the first is compatible with (2) and the second is not; and if there is such a line, why the total view's summation gets through it too, given that (7) seems to treat summation and concave weighting as equally structural. If there is no such line, should I conclude that the leveling-down objection is not really an objection to egalitarianism at all, but a person-affecting restriction on value that egalitarians, prioritarians and utilitarians have precisely the same reason to reject?
reasoning: |-
  Okay, let me start by unpacking the user's argument. They're a grad student in philosophy grappling with Parfit's leveling-down objection. They've constructed an argument that seems to generalize the objection beyond egalitarianism to the priority view and even the total view. Their seminar partner thinks it proves too much, and they're stuck trying to find where it goes wrong. They want to preserve the core insight but avoid the sweeping conclusion that all welfarist axiologies are invalid.

  First, I need to understand each step of their argument. Step 1 claims that for A to be better than B, there must be some feature in A that makes it better, and that feature must be tied to how it benefits someone. Step 2 reinforces this by saying only individual well-being matters, not patterns or relations. Step 3 concludes that A must be better for at least one person.

  Steps 4 and 5 apply this to the priority view. They use an example where two outcomes have the same total well-being but different distributions. The priority view prefers one due to the concave transform. But since the net effect on individuals is a wash, the decisive feature isn't anyone's gain—it's the distribution's shape. Thus, the priority view violates step 3. Step 6 says this mirrors the leveling-down objection against egalitarianism.

  Step 7 extends this to the total view with another example. Here, the total view prefers an outcome with higher sum, but the individual gains and losses don't net to anyone's benefit—it's the total sum that matters. So, similarly, the total view is accused of locating value in the aggregate, not individuals.

  Step 8 concludes that all welfarist views fail because they rely on structural features not tied to individual benefits. The user finds this conclusion unacceptable and notes it would also condemn non-welfarist values like retributive justice or environmental intrinsic value.

  The user's main concerns are: preserving the leveling-down insight without overgeneralizing, finding a principled distinction between prioritarian concavity and egalitarian equality, and understanding why summation in the total view might be treated differently.

  Looking for the weak link, Step 2 seems crucial. It asserts that no patterns or relations among individuals can contribute value. But prioritarians and total utilitarians might argue that their transformations or sums still reduce to individual welfare. The concave function in prioritarianism reflects the diminishing moral weight of benefits, which is tied to each individual's absolute level. The sum in total view aggregates individual welfare. So Step 2 might be too strict by dismissing these as mere structural features.

  Rejecting Step 2 allows distributive features as long as they're grounded in individual welfare. The priority view's concavity isn't about relations but about how much a unit of well-being matters for each person based on their level. The total sum is just the additive combination of individual well-beings. Egalitarianism, however, directly values a relational property—equality—which isn't tied to any individual's state. So the leveling-down objection specifically targets relational egalitarianism, while prioritarianism and totalism can be defended as non-relational.

  The user also worries about non-welfarist examples. Rejecting Step 2 opens the door for pluralist axiologies where patterns matter, but that might require abandoning strict welfarism. The user seems willing to accept that, given their interest in preserving values like biodiversity or promise-keeping beyond individual welfare.

  The key is distinguishing between intrinsic properties of individuals versus relational properties. Prioritarians can argue that their view cares only about individual welfare levels, transformed to reflect urgency, without comparing between persons. Egalitarians, however, need interpersonal comparisons. This distinction allows the leveling-down objection to apply to egalitarians but not prioritarians or utilitarians. Step 7's claim that summation is equally structural is mistaken because the sum is just a function of individual goods, not a pattern existing over them.
answer: |-
  Your argument is admirably rigorous, and its conclusion (8) *is* unacceptable—but the flaw lies in **Step 2**. Rejecting Step 2 allows you to block the collapse into (8) while preserving the core force of the leveling-down objection against *relational* egalitarianism, and it explains why the priority view and total view are meaningfully different. Here's the breakdown:

  ### Why Step 2 is the Problem
  Step 2 claims: "The only features of an outcome in virtue of which it can be better are features of **how individual lives go**. Nothing over and above the levels of the persons in it — no arrangement, no pattern, no relation among them — can contribute value."

  This is a **radically strong person-affecting principle** that rules out *any* distributive feature not reducible to a non-comparative fact about a single life. It conflates two distinct ideas:  
  1. **Individualism**: Value must be grounded in facts about individuals.  
  2. **Non-Relationality**: Value cannot depend on relations *between* individuals.  

  The priority view and total view satisfy (1) but violate (2) as you interpret it. Step 2 rejects *all* "structural" features, but not all structures are created equal.  

  ### The Cost of Rejecting Step 2
  You pay two prices:  
  1. **You abandon strict atomism**: You must accept that value can depend on *how individual welfare is combined* across persons (e.g., summing or concave weighting).  
  2. **You allow "non-located" value**: Value can inhere in distributions *as such*, provided it is *grounded in* individual welfare.  

  But these costs are manageable and align with standard welfarist practice:  
  - **Priority view**: Its concave transform reflects the *moral urgency* of benefits at different absolute levels. This is still about individual welfare—it’s just sensitive to the *absolute level* of each person. When it ranks (30, 190) over (20, 200), it does so because the +10 to P1 (at low absolute welfare) matters *more for P1* than the -10 to P2 (at high welfare) matters *for P2*. The "shape" isn't a free-floating entity; it emerges from facts about each person's welfare and the concave function.  
  - **Total view**: Summation is a function *of individual welfare levels*. (150, 60) is better than (100, 100) because 150 + 60 = 210 > 200. The "sum" isn’t a ghostly entity—it’s a direct aggregation of individual goods.  

  ### Why the Leveling-Down Objection Still Bites Egalitarianism (But Not Prioritarianism/Totalism)
  - **Egalitarianism** (in its standard telic form) values *equality itself*—a *relational property* between individuals. In LD, moving to (100, 100) adds a feature (equality) that isn’t a property of any *individual’s* welfare. P1 is unchanged; P2 is worse off. Equality is a pattern *over* individuals.  
  - **Priority/Total views** value *non-relational* features: individual welfare levels transformed by a concave function (priority) or summed (total). Their "structural" features are *reducible to individual welfare facts*.  

  **The principled line**:  
  > Value is acceptable if it supervenes on **non-comparative states of individuals**. It is suspect if it requires **comparative relations between individuals**.  

  - **Priority view**: √(wellbeing) is a non-comparative property of each life.  
  - **Total view**: A life’s contribution to the sum is non-comparative.  
  - **Egalitarianism**: Equality is inherently comparative (P1’s level *relative to* P2’s).  

  This explains why LD uniquely embarrasses egalitarianism: LD creates a *relational gain* (equality) with *no individual gain*. Priority/total views lack relational values—so LD offers them nothing.  

  ### Addressing Your Examples
  - **Retributivism/Biodiversity/Promises**: Rejecting Step 2 *also* saves these! It allows value to reside in states of affairs (e.g., a criminal being punished, biodiversity existing) that aren’t reducible to individual welfare. But welfarists can consistently reject these as non-welfarist. Your argument only threatens *welfarist* views if Step 2 is accepted—but rejecting Step 2 lets welfarists off the hook.  

  ### Why Step 7 Fails
  Step 7 claims that summation is "structural" like egalitarian equality. But summation is *additive* and *non-relational*: each person’s welfare contributes independently to the total. In (150, 60) vs. (100, 100), the total view says:  
  - P1’s +50 (in A*) outweighs P2’s -40 (in A*) *when aggregated*.  
  This is a claim about *individual contributions* to an aggregate—not a free-floating pattern. The "size of the sum" is just shorthand for the combined individual welfare.  

  ### Conclusion
  - **Drop Step 2**. It forces an implausible atomism that no plausible welfarist accepts. The cost is allowing distributive features that are grounded in (but not reducible to atomic states of) individual welfare.  
  - **Preserve the insight**: The leveling-down objection exposes *relational* values (like equality) that lack individual beneficiaries. Prioritarians and totalists avoid this because their values are non-relational.  
  - **Result**: LD remains a powerful objection to *telic relational egalitarianism* but not to prioritarianism or totalism. Your seminar partner is right that the argument proves too much—but only because Step 2 is a poisoned premise.  

  This preserves the person-affecting intuition *in spirit* (value must be grounded in individuals) without demanding the impossible (that value never emerges from combinations of individual states). The leveling-down objection’s core survives, but it no longer nukes all of welfarism.
