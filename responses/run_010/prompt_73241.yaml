  Okay, the user is asking me to evaluate a paragraph from their colleague's op-ed on just war theory. They're a philosopher of mind who's been asked to sanity-check this political science piece, specifically the core argument about moral equality of combatants. 

  First I need to unpack what's happening here. The colleague is making several interconnected claims: that Walzer established moral symmetry as mainstream just war doctrine, that this stems from soldiers' lack of agency, that revisionists like McMahan ignore practical realities, and that you can't condemn unjust soldiers while keeping symmetrical rules. The user wants me to flag the shaky parts while respecting disciplinary boundaries - they're clearly aware this isn't their specialty.

  Hmm, the historical framing feels off right away. The colleague presents symmetry as this continuous tradition Walzer inherited, but actually Walzer was reacting against medieval asymmetry where only just warriors could licitly fight. That's worth correcting because it misrepresents intellectual lineage. And that "Wehrmacht conscript did nothing wrong" example - oof, that's an overstatement even for symmetry defenders. Walzer himself called defensive killing permissible against unjust aggressors, just not criminal. 

  The referee analogy troubles me too. It's catchy but conflates two things: jus in bello rules (how you fight) with broader moral liability (whether you should fight at all). The colleague uses it to suggest symmetrical rules require abandoning jus ad bellum judgments, but that's not quite right - traditions like Catholicism have always maintained both. 

  Then there's the practical argument against revisionists. The colleague claims asymmetrical rules are unworkable, but that's more an assertion than demonstrated. McMahan actually proposes workarounds like focusing on manifest illegality. Should mention that. 

  Finally, that last punchy sentence about keeping both condemnation and symmetry being impossible... it might collapse once we fix earlier issues. If we clarify that traditional symmetry is about conduct rules not blanket absolution, and that revisionists target foundational ethics not practicality, the dichotomy softens. 

  User's sharp to notice the historical backwardness - that instinct was correct. And their request for exactly five numbered items shows they want surgical precision, no fluff. I'll structure it as requested: four claim-specific corrections, then test the conclusion's survivability.
answer: |-
  Here are five numbered items addressing the key points:

  1.  **Historical Framing is Backwards:** The claim that Walzer inherited a long-standing symmetry tradition is incorrect. Pre-Walzer just war tradition (e.g., Vitoria, Suarez, Grotius, Catholic teaching) largely held that soldiers fighting for an *unjust cause* acted wrongly and lacked the right to kill justly; Walzer's symmetry argument was a significant *departure* designed to make jus in bello independent of jus ad bellum.

  2.  **"Did Nothing Morally Wrong" is an Overstatement:** Stating the Wehrmacht conscript "did nothing morally wrong" by shooting at Soviet soldiers overstates Walzer's position. Walzer argued such a soldier commits no *war crime* and is not a *murderer* under the laws of war, but he explicitly stated killing in an unjust war is still morally wrong (even if blameless for the soldier), and the victim retains a right of self-defense.

  3.  **Referee Principle Conflates Levels:** The referee analogy conflates *rules of conduct (jus in bello)* with *overall moral liability*. The tradition largely accepts symmetrical *conduct rules* (e.g., proportionality, distinction) for practical reasons, but this doesn't inherently mean it "stopped asking whether a war is just." Many just war theorists maintain the importance of jus ad bellum judgments *alongside* symmetrical jus in bello rules.

  4.  **Revisionist Practicality Argument is Oversimplified:** The claim that revisionists "haven't shown you can actually run a war on asymmetrical rules" is partially true but incomplete. McMahan acknowledges practical difficulties but argues rules should still *reflect* the underlying moral asymmetry as much as possible (e.g., stricter interpretations of necessity/proportionality for unjust combatants, focus on "manifest" aggression). His primary target is the *moral* symmetry, not necessarily proposing fully asymmetrical *positive laws*.

  5. **The Last Sentence Loses Force:** Once corrected (esp. points 1 & 3), the final claim that "there's no version of just war theory that gets to keep both" (condemning unjust soldiers *and* symmetrical rules) is undermined. The *pre-Walzer tradition* explicitly condemned soldiers fighting unjustly *while* developing rules of conduct applicable to all fighters. Walzer's symmetry was a specific argument for separating the domains, not the only possible approach. Revisionists reject the *moral* symmetry but often accept the *practical necessity* of largely symmetrical *rules* (laws of armed conflict).
