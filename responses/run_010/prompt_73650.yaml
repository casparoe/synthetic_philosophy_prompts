prompt: |-
  so me and a mate have been going round in circles for about a year on whether tables exist, in that philosophical way — him being a "there's only really particles aranged in a table-ish shape and no such thing as a table" guy, me being a "no, the table is a real thing, it's a whole made of parts" guy. Neither of us has any philosophy training, we've just both read bits of stuff online and got stuck in.

  A while back I made up a little test for sorting out which arguments are actually about the world and which are only about words, and I want your read on how it does here. It's got two moves. First: can each side state the other side's position using only words both of them already accept, in a way the other person agrees is a fair statement of what they meant — no sneaky loading of the disputed term back in. Second: once you've done that, is there anything left that the two statements actually disagree about, any difference in how the world has to be? If both can be restated and nothing's left over, the fight was about words. I tried it on easier stuff first (whether a hot dog is a sandwich, whether our favourite band's last album counts as prog) and it seemed to work fine — we'd restate each other and then notice we were just grading things on different scales.

  On the table thing it goes weird though. He happily accepts "particles arranged in a table-shaped way exist" and so do I. I accept his restatement of my view, he accepts mine, so we pass move one clean. But neither of us feels the fight is over. There's still this nagging question of whether accepting the arrangement-sentence and then adding "and there's a table" is saying anything extra — and that's definately the bit we can't agree on, except it feels like it's not about the world at all, it's about what the sentence is supposed to be doing.

  What I want from you is a number. Give me your actual credence in this claim: the dispute between someone who says composite objects like tables exist and someone who says they don't is merely verbal, in the specific sense that there is some vocabulary both sides accept, with no begging of the question, in which each can restate the other, and the two restatements come out logically equivalent given background claims they already agree on.

  Then break it down, with a rough probability for each piece and one line saying why: how likely it is that "a restatement the other side accepts as fair" even has a determinate answer rather than shifting depending who you ask; how likely such a shared vocabulary actually exists for this particular dispute; how likely the equivalence holds once you've got one; and how likely it is that whatever feels left over afterwards is genuine disagreement about the world rather than disagreement about which way of talking to prefer, or about what our concepts are for. Show me how those pieces get combined into the headline number, and then tell me which single piece my estimate is most sensitive to — the one that, if it could be settled, would drag the whole number furthest — and what would settle it.

  Two housekeeping things: no reading lists, no citations, no "you should go and look at", I can't chase anything down at the moment and I'd much rather have your reasoning than a bibliography. And write the whole answer in British English please.

  Last thing, and I mean it properly: if you think my two-move test is a muddle, or that the claim I've asked you to put a number on doesn't really have a truth value, or that it can't be answered well as I've set it up, say that plainly at the top instead of humouring me and producing numbers anyway. I'd rather find out I'm asking a bad question than get a tidy-looking answer to it. But if it is answerable, I do want the number — not a both-sides shrug.
