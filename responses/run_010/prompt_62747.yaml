  ### Scenario: A Redundant Sensor Array in a Chemical Plant  
  A chemical plant employs three temperature sensors—A, B, and C—to monitor a reactor. Each sensor triggers an alarm if the temperature exceeds 350°C. A catastrophic failure occurs only if all three sensors fail to alarm simultaneously. Historical data shows each sensor fails independently with probability \(p = 0.001\) per operating cycle due to unrelated issues (e.g., sensor A’s calibration drift, sensor B’s wiring flaw, sensor C’s dust accumulation). The plant’s reliability analyst, unaware of an extremely rare electromagnetic pulse (EMP) event that disables all three sensors at once, estimates the joint failure probability as \(p \times p \times p = (0.001)^3 = 10^{-9}\). They explicitly state: "In the absence of evidence of correlation, we assume failures are independent, so we multiply individual probabilities."  

  ### Analysis  
  **True Probability Distribution**  
  The system has five possible states per cycle, defined by sensor failures (1 = fail, 0 = work):  

  | State   | Probability | Sensor A | Sensor B | Sensor C | Description                     |
  |---------|-------------|----------|----------|----------|---------------------------------|
  | **H₀** | \(q = 10^{-6}\) | 1        | 1        | 1        | EMP event (all fail)            |
  | **H₁** | \(a = 0.000999\) | 1        | 0        | 0        | Only A fails (calibration)      |
  | **H₂** | \(b = 0.000999\) | 0        | 1        | 0        | Only B fails (wiring)           |
  | **H₃** | \(c = 0.000999\) | 0        | 0        | 1        | Only C fails (dust)             |
  | **H₄** | \(d = 0.997002\) | 0        | 0        | 0        | All sensors work                |

  - **Total probability**: \(q + a + b + c + d = 10^{-6} + 3(0.000999) + 0.997002 = 1\).  
  - **Individual failure probabilities**:  
    - \(P(\text{A fails}) = P(\text{H₀}) + P(\text{H₁}) = 10^{-6} + 0.000999 = 0.001\).  
    - Similarly, \(P(\text{B fails}) = 0.001\), \(P(\text{C fails}) = 0.001\).  

  **Pairwise Independence Audit**  
  The analyst checks if \(P(\text{A and B fail}) = P(\text{A fails}) \times P(\text{B fails})\) (and similarly for other pairs).  
  - \(P(\text{A and B fail})\): Only occurs in **H₀** (both fail). Probability = \(P(\text{H₀}) = 10^{-6}\).  
  - \(P(\text{A fails}) \times P(\text{B fails}) = 0.001 \times 0.001 = 10^{-6}\).  
  - **Result**: \(10^{-6} = 10^{-6}\) → **independent**.  
  - Repeat for \(\text{(A, C)}\): \(P(\text{A and C fail}) = P(\text{H₀}) = 10^{-6} = (0.001)(0.001)\).  
  - Repeat for \(\text{(B, C)}\): Identical result.  
  **Conclusion**: All pairwise audits pass exactly.  

  **Joint Failure Probability**  
  - True \(P(\text{all fail}) = P(\text{H₀}) = \mathbf{10^{-6}}\).  
  - Analyst’s estimate: \(\mathbf{10^{-9}}\).  
  - **Ratio**: \(\frac{10^{-6}}{10^{-9}} = \mathbf{1000}\).  

  **Structural Feature Causing the Gap**  
  The rare **common cause (EMP)** forces all sensors to fail together in **H₀**, but pairwise checks miss this because:  
  - The EMP’s probability (\(q = 10^{-6}\)) equals \(p \times p = (0.001)^2\), so pairwise products match.  
  - The gap arises from **mutual dependence** (all three failing only via EMP), invisible to pairwise audits.  

  **Counterfactual: No Shared Cause**  
  Remove the EMP (set \(q = 0\)) and redistribute:  
  - Let \(P(\text{H₁}) = P(\text{H₂}) = P(\text{H₃}) = 0.001\), \(P(\text{H₄}) = 0.997\).  
  - Now \(P(\text{all fail}) = 0\) (no state where all three fail).  
  - Analyst’s estimate: \((0.001)^3 = 10^{-9} \approx 0\) → **correct**.  
  **Explanation**: Without the shared EMP, failures are mutually independent.  

  **Minimal Additional Assumption**  
  - **Mutual independence**: \(P(\text{all fail}) = P(\text{A fails}) \times P(\text{B fails}) \times P(\text{C fails})\).  
  - **Why pairwise audits can’t verify it**: Pairwise checks confirm \(P(\text{A,B}) = P(\text{A})P(\text{B})\), etc., but mutual independence requires also \(P(\text{A,B,C}) = P(\text{A})P(\text{B})P(\text{C})\). A pairwise audit is algebraically insufficient to detect higher-order dependence.  
  - **Realism of verification**: For \(n\) components, verifying mutual independence requires checking all \(2^n\) joint probabilities—infeasible for large systems. Here, \(n=3\) is tractable, but not for real-world ensembles with \(n \gg 3\).  

  **Strongest Objection & Rebuttal**  
  - **Objection**: "No real system has a common cause perfectly tuned to make pairwise independence hold while violating mutual independence. Analysts would identify the EMP via design reviews."  
  - **Assessment**: Partially valid. The EMP’s probability is artificially set to \(p^2\) to exactly match pairwise products—a mathematical edge case. However:  
    1. **Tuning is plausible**: Rare events (e.g., EMPs) may occur at rates comparable to \(p^2\) if \(p\) is small (e.g., \(p = 0.001\) → \(p^2 = 10^{-6}\)).  
    2. **Design documents may miss rare causes**: EMPs might be overlooked until after incidents (e.g., Three Mile Island had unanticipated common-cause failures).  
    3. **Core lesson holds**: Pairwise checks provide *zero* evidence against mutual dependence; the heuristic’s error persists in less extreme cases (e.g., ratio = 10–100).  

  ### Conclusion  
  This example illustrates how pairwise independence can coexist with drastic mutual dependence due to a rare shared cause. The heuristic fails by 1000-fold because it mistakes pairwise independence for mutual independence—a leap that requires auditing the very high-order dependence it assumes away. While the exact mismatch relies on precise probability tuning, the vulnerability to unmodeled common causes is universal.
