  Okay, the user is describing a specific rhetorical move they've encountered in debates about brain metrics and moral status. They've noticed how opponents keep switching between absolute size, neuron density, and organization depending on which supports their preferred hierarchy. The core frustration is about this unacknowledged shifting of standards.

  Hmm, this feels familiar - it's like watching someone play three-card monte with scientific metrics. The cow vs. human baby example is particularly telling. When brain size fails, they retreat to density; when density fails (as with birds), they jump back to absolute numbers. The pattern reveals a pre-determined conclusion driving the metric selection rather than vice versa.

  What makes this tricky is distinguishing it from good faith hypothesis refinement. The key difference seems to be the lack of acknowledgment when switching standards - no "I was wrong about size, let me propose this better metric" moment. Also notable is how the same metric gets promoted from proxy to essence depending on what's convenient.

  The user wants precise boundaries for this concept. We should exclude cases like: someone genuinely updating their position with new evidence, or transparently proposing alternative frameworks after conceding problems. The telltale sign is the silent metric-swapping to preserve a fixed moral hierarchy.

  They're clearly well-versed in these debates - mentioning neuron density in birds shows they've done their homework. The frustration suggests they've hit this wall multiple times. Probably an academic or activist in animal ethics circles? Their unspoken need might be for a precise term to call out this maneuver effectively in discourse.

  For naming, "metric laundering" came to mind - it captures the illicit upgrading/downgrading of measures. "Motivated metric switching" is more descriptive but clunkier. The "constitutive-evidential toggle" gets at the essence but might be too technical. Whichever term lands, the diagnostic criteria matter most: the unacknowledged pivot, fixed moral hierarchy, and reversible valuation of the same metric.
answer: |-
  This rhetorical pattern is a specific form of **motivated reasoning** applied to scientific proxies, where the *epistemic status* of a metric (its core relevance vs. its indicative value) shifts conveniently to defend a predetermined moral hierarchy. It lacks a single established term, but here's a breakdown and proposals:

  **Core Pattern:** **Motivated Metric Switching (or Metric Laundering)**
  *   **Definition:** The strategic, unacknowledged shifting of a quantitative metric's claimed relationship to the underlying property of interest (e.g., cognitive capacity, moral status) between being *constitutive* (defining the property) and *evidential* (merely correlative/indicative), depending solely on whether the metric supports the desired conclusion in a specific comparison.
  *   **Key Mechanism:** The **Constitutive-Evidential Toggle**.
  *   **Goal:** Preserving a pre-existing moral hierarchy (e.g., humans > other mammals > birds > fish > insects) by manipulating how the metric is interpreted case-by-case.

  **Why it's distinct from nearby concepts:**
  1.  **Special Pleading:** While related, SP involves applying a rule to others but exempting oneself/one's group *without justification*. MMS involves changing the *fundamental justification for the rule itself* (the metric's role) depending on the comparison, often without acknowledging the shift *as* an exemption. The rule *appears* consistent (e.g., "neuron count matters"), but its *meaning* changes.
  2.  **Moving the Goalposts:** This involves changing the *target* (e.g., "fine, it's not size, it's density"). MMS changes the *nature of the target itself* regarding the *same metric* (e.g., size *is* the thing, then size is *merely a sign* of the thing).
  3.  **Good Faith Hypothesis Refinement:** Genuine updating occurs when new evidence (e.g., bird cognition) prompts a *transparent revision* of the *entire framework* ("Okay, absolute neuron count seems insufficient; perhaps connectivity or cortical organization is key"). MMS involves *local, unacknowledged patchwork* to salvage the hierarchy *for the specific counterexample*, without abandoning the metric globally.
  4.  **Over-Reliance on Proxies:** This is the *general* problem. MMS is a specific *tactic* used *within* this problem to defend against counterexamples using the same proxy.

  **Diagnostic Criteria for MMS (vs. Good Faith):**
  *   **Unacknowledged Toggle:** The shift between constitutive/evidential use of the *same metric* is not explicitly stated or justified as a principled update.
  *   **Hierarchy Preservation:** The switch *always* serves to maintain the speaker's preferred moral ordering when faced with a counterexample.
  *   **Reversibility:** The *same metric* can be toggled back to its previous status (constitutive or evidential) if needed for a different comparison supporting the hierarchy.
  *   **Lack of Global Revision:** The speaker doesn't abandon the metric as flawed overall; it remains a core part of their argument, just its *interpretive status* changes locally.
  *   **Motivated by Counterexample:** The switch is triggered specifically by an inconvenient data point, not by new theoretical insight or broader evidence.

  **Applying it to your examples:**
  1.  **Cow vs. Baby:** Proponent treats brain size as *constitutive* of moral status capacity. Counterexample shows absurdity. Proponent *toggles* size to *evidential* ("just a stand-in for density/organization") without conceding the metric was misused.
  2.  **Bird Cognition:** Proponent now treats density as *constitutive*. Counterexample (birds with high density/small brains performing well). Proponent *toggles* density to *evidential* ("just a sign, but absolute numbers are what *really* count") without abandoning density as *sometimes* important. Absolute number, previously demoted, is now *toggled back* to constitutive.
  3.  **Neither switch** is framed as: "My initial reliance on size/density was too simplistic; we need a more nuanced model integrating multiple factors." Instead, the metric itself is reinterpreted on the fly.

  **Proposed Names:**
  1.  **Motivated Metric Switching (MMS):** Descriptive, captures the core action.
  2.  **Metric Laundering:** Evokes the illicit "cleaning" of a metric's status to make it usable again.
  3.  **Constitutive-Evidential Toggle (CET):** Precise, highlights the mechanism.
  4.  **Hierarchy-Preserving Metric Elasticity:** Emphasizes the goal and the flexible interpretation.

  **Recommendation:** **"Motivated Metric Switching" (MMS)** is likely the most accessible and descriptive term in debate contexts. **"Metric Laundering"** has more rhetorical punch if the goal is to highlight the dubiousness. Use diagnostic criteria to distinguish it from good-faith argumentation.

  **Why this matters:** Naming this tactic exposes how reliance on single, simplistic biological metrics for complex moral concepts like "moral status" or "cognitive capacity" is easily manipulated. It forces proponents to either:
  *   Defend a single, consistent interpretation of their metric (which will inevitably face counterexamples).
  *   Acknowledge the need for a far more complex, integrated model (undermining the simplicity of the original hierarchy).
  *   Reveal their motivated reasoning by refusing to do either and continuing the toggle.
