  First, they want the logical sequence: feasible set → disagreement point → utopia point → ray → axioms. They suspect axioms-first is wrong but aren't sure why. I agree - axioms should come after the concrete solution to avoid abstraction without context. The worked example is crucial - they mention the £100 split but worry it's insufficient. They need an example that clearly contrasts KS with Nash using minimal tools. The £100 case is too symmetric, masking key differences. 

  For misconceptions, they identified three: KS=equal split, monotonicity misinterpretation, and utopia point realism. There might be more - perhaps confusing KS with egalitarian solutions or misapplying monotonicity to asymmetric cases. 

  The ending question should test understanding of why IIR is abandoned, not just mechanical drawing. They also want guidance on scope - notably whether to mention non-convexity. Given time constraints, non-convexity seems like a tangent best avoided.

  The audience is key: half philosophers care about normative justifications, half economists focus on mechanics. The plan must balance both. The £100 example fails because it doesn't differentiate KS from Nash or other solutions. We need asymmetric BATNAs and non-linear frontiers. 

  Hmm... a seller-buyer scenario works well: £100 surplus, seller's BATNA=£20, buyer's=£0, with a kinked frontier creating dead zones. This creates clear differences: KS gives (70,30), Nash gives (60,40). The ruler/ray visualisation demonstrates KS intuitively while contrasting with Nash's product maximisation.

  For misconceptions: 
  - KS≠equal split (show asymmetric result) 
  - Monotonicity clarified via shrinking feasible sets 
  - Utopia point as theoretical anchor, not achievable 
  - Plus add confusion between KS and proportional splits

  Ending question: "Why might parties accept KS despite violating IIR?" forces engagement with the fairness trade-off. Openly skip non-convexity, multi-player cases, and computational methods. 

  Timing is tight: 50 minutes. Allocate: 
  - 5 mins recap Nash 
  - 15 mins KS mechanics via example 
  - 10 mins axioms contrast 
  - 10 mins misconceptions 
  - 5 mins discussion 
  - 5 mins buffer

  The seller-buyer example does heavy lifting: visual (ruler), numerical (simple calc), and conceptual (fairness vs consistency). Philosophers get the normative debate, economists the geometric mechanism. Perfect for ruler-and-arithmetic constraints.
answer: |-
  Here’s a structured 50-minute lesson plan focusing on conceptual sequencing, a pivotal example, misconceptions, and strategic omissions. Prioritise **visual intuition** and **normative contrast** with Nash.

  ---

  ### **Lesson Structure & Timing**  
  **(Total: 50 mins)**  

  1. **Recap Nash Bargaining (5 mins)**  
     - *Q: "What do you recall about the Nash solution?"*  
       - Elicit: "Maximises product of surpluses (u - d)(v - d)."  
     - **Emphasise**: Nash relies on "independence of irrelevant alternatives" (IIA) — *the solution shouldn’t change if you remove 'irrelevant' options*.  

  2. **Set Up Bargaining Fundamentals (5 mins)**  
     - **Feasible set (S)**: Draw a convex set on axes (u, v). Label it "All possible payoff pairs."  
     - **Disagreement point (d)**: Mark (d₁, d₂) = (0,0) for simplicity (*avoid BATNA asymmetry here*).  
     - *Critical point*: Use a **non-symmetric** feasible set. Example:  
       *"A seller (u) and buyer (v) splitting £100, but seller can only get £70+ if buyer accepts ≤£30 (e.g., due to credit constraints)."*  
       → **Feasible set S**: u + v ≤ 100, u ≤ 80, v ≤ 40 (creates a kinked frontier).  

  3. **Introduce Utopia Point & KS Mechanics (15 mins)**  
     - **Ideal point (u̅, v̅)**:  
       - *u̅* = max u s.t. (u,v) ∈ S (for fixed v = d₂ = 0) → *u̅* = 80  
       - *v̅* = max v s.t. (u,v) ∈ S (for fixed u = d₁ = 0) → *v̅* = 40  
       - Plot (80,40) → **"The impossible dream if both demanded everything."**  
     - **The KS ray**:  
       - Draw line from d=(0,0) through (u̅,v̅) = (80,40) → slope = 40/80 = 0.5.  
       - *Q: "Where does this ray hit the Pareto frontier of S?"*  
       - Intersection: Solve u + v = 100 and v = 0.5u → u = 66.7, v = 33.3.  
       → **KS solution: (66.7, 33.3)**  

  4. **Contrast with Nash & Introduce Axioms (10 mins)**  
     - **Nash solution**: Maximise u×v on frontier.  
       - Under u + v ≤ 100, u≤80, v≤40: max at u=60, v=40 (kink point!).  
     - **Side-by-side**:  
       - Nash: (60, 40) → Buyer favoured (reaches max possible v).  
       - KS: (66.7, 33.3) → Seller favoured (closer to utopia ratio).  
     - **Axioms now**: Contrast KS vs. Nash:  
       - KS drops **IIA** but keeps:  
         - Pareto efficiency  
         - Symmetry (if S symmetric)  
         - *Scale invariance* (like Nash)  
         - **Monotonicity**: If S expands in a direction, no player loses.  
           → *Show visually: Stretch S rightward; KS moves right, Nash may not.*  

  5. **Tackle Misconceptions (10 mins)**  
     - **"KS = equal split"**:  
       - Counter: In example, £66.7 ≠ £33.3. Emphasise **ratio preservation** (u/v = u̅/v̅ = 2).  
     - **"Utopia point is achievable"**:  
       - Stress: (u̅,v̅) is *infeasible*—it’s a benchmark for aspirations.  
     - **"Monotonicity always benefits all"**:  
       - Clarify: If S expands *asymmetrically* (e.g., only u̅ rises), KS rebalances—one player may gain less.  
     - **New misconception**: "KS is proportional to BATNAs" → Not so! It’s proportional to *gains over d*, scaled by utopia.  

  6. **The Closing Question (5 mins)**  
     - *"In this example, the buyer gets £40 under Nash but only £33.3 under KS. Why might a society choose KS despite this?"*  
       → **Target answer**: KS ensures players share gains *relative to their potential* (fairer when opportunities differ). Sacrificing IIA prevents ignoring "relevant" alternatives (e.g., the buyer’s £40 cap).  

  ---

  ### **The Worked Example: What It Must Have**  
  - **Asymmetric frontier**: Nash must *not* lie on the utopia ray (here, Nash at (60,40), KS at (66.7, 33.3)).  
  - **Non-linear Pareto boundary**: A kink (e.g., u≤80, v≤40) forces Nash away from KS.  
  - **Simple arithmetic**: Use £100, d=(0,0), and constraints solvable via ruler (ray slope=0.5) and line intersection.  
  - **Visual clarity**: Plot S, utopia point, ray, and both solutions. Label axes "Seller £" / "Buyer £".  

  > **Why avoid £100-split?** Nash and KS coincide if S is symmetric and linear → obscures the contrast.

  ---

  ### **What to Openly Omit**  
  - **Non-convexity**: A trap! KS assumes convexity. Mentioning it invites technical chaos—say: *"We assume convex sets; non-convex cases require advanced tools."*  
  - **Nash’s axiomatic derivation**: No time. State axioms contrastively only.  
  - **Multilateral bargaining**: KS extends to n-players, but stick to 2-player for intuition.  
  - **Computational methods**: No linear programming; ruler/ray is sufficient.  

  ---

  ### **Why Sequence Axioms Last?**  
  Philosophy students need grounding in *what KS is* before judging *why it’s justified*. Economists need mechanics before abstraction. Axioms-first risks feeling arbitrary; the example shows **monotonicity’s normative appeal** (e.g., *"Why should I lose out when your options improve?"*) organically.  

  ---
  **Session Flow**: Recap Nash (5) → S & d (5) → Utopia & KS ray (15) → Nash/KS contrast & axioms (10) → Misconceptions (10) → Closing Q (5).  
  **Tools**: Whiteboard, ruler, red/blue pens. Plot the example live!  
  **British touch**: Use "maths" not "math", "£" not "$", "whilst" for "while".  

  This plan forces the "aha!" moment: KS is about **equitable aspiration**, not splitting pies. The example makes axioms feel necessary, not imposed.
