prompt: |-
  Next week I've got a fifty-minute slot to teach the Kalai–Smorodinsky bargaining solution to a final-year seminar — about half philosophy, half economics, all of whom met the Nash solution once in a games course and remember it as nothing more than 'multiply the surpluses and maximise'. Plan the session for me; don't just explain KS to me again.

  What I want out of the plan: the order the pieces have to go in (feasible set, disagreement point, the ideal or utopia point, the ray, and only then the axioms?) and what genuinely depends on what — I suspect doing the axioms first is a mistake but I couldn't say why. Then the one worked example that should carry the whole thing. I was going to use two people splitting £100 with a breakdown payoff of zero each, but I've a feeling that's actively bad here, so tell me what the example has to have and what it has to lack for the contrast with Nash to show up with no more than a ruler and some arithmetic. Then the misconceptions: I'd bet on 'KS is just an equal split', 'monotonicity means a bigger pie is better for everone', and 'so the utopia point is somewhere you could actually get to' — plus wherever in the sequence each one needs heading off, and any you reckon I'm not predicting. And one question I can end on that tells me whether they've got why you'd give up independence of irrelevant alternatives, rather than just whether they can draw the line.

  Also tell me what to openly refuse to cover at this level and say so — including whether the non-convexity motivation for the whole exercise deserves any airtime at all, or whether it's a trap.

  British English, please.
