prompt: |-
  hiya — I'm a third-year doing the epistemology option at a UK uni and we've just finished the block on norms of assertion. Our seminar task is a bit odd: we were given a battery of cases, voted on each one, and now we each have to defend a ranking of the candidate norms against those votes. I want a second opinion to argue with on Thursday, so please answer the whole thing in British English — spelling, but also the register, my marker is picky about Americanisms.

  Here are the norms I want scored. I've glossed them myself so we're definitely working with the same things, and please don't go hunting for who said what — I'm not after a bibliography or a reading list, just your judgements and your reasoning.

  1. **Knowledge norm** — you may assert p only if you know p.
  2. **Truth norm** — you may assert p only if p is true.
  3. **Belief norm** — you may assert p only if you believe p.
  4. **Justification norm** — you may assert p only if you justifiably believe p, where justification is cashed out in terms of the evidence you actually have to hand.
  5. **Reasonableness norm** — you may assert p only if it's reasonable for you to believe p; weaker than (4), because you can be reasonable in relying on a good source or a settled disposition without having accessible grounds right now.
  6. **Stakes-sensitive knowledge norm** — as (1), but the threshold for knowing shifts with how much hangs on the assertion being right.
  7. **Communicability norm** — you may assert p only if p is something you could bring your audience to know (or at least to justifiably accept) by asserting it.

  The cases, with the majority verdict from a show of hands in a group of fourteen. Treat these votes as the data, not as the truth — that's part of the exercise.

  **A.** A GP tells her patient not to take drug Vantrel with drug Corvalis because the combination is dangerous. She was taught this twenty years ago, can't recall the study or the textbook, and couldn't say where it comes from. It's true, and she'd have said the same thing for two decades. *Vote: proper.*

  **B.** A tenant tells the residents' meeting that the landlord is falsifying the gas safety certificates, purely out of a grudge, with no evidence whatsoever and no idea whether it's true. It happens to be true. *Vote: improper.*

  **C.** A claims clerk has read the file, and the file plainly shows the claimant is eligible. The clerk is burned out and just doesn't find themselves actually believing it — but they tell the claimant "you're eligible", and it's true. *Vote: proper.*

  **D.** A council officer tells a school "the water is safe" on the basis of one test from a large batch, when the standing protocol requires twelve. The water is in fact safe. *Vote: improper.*

  **E.** A junior doctor checks a dose chart and says to a fellow student in the canteen "that's within the safe range". Later, the same doctor, on the same single check, says the same sentence to a consultant who is about to authorise the infusion. *Vote: proper in the canteen, improper to the consultant.*

  **F.** A university spokesperson tells the press "the department's research quality has improved", relaying a formal finding of a senate committee. No individual member of the committee believes it — several think it's false — but the pooled evidence they voted on supports it. *Vote: proper.*

  Now the scoring. My tutor wants each norm rated on three axes and then combined, so please actually commit to numbers rather than hedging everything into a tie:

  - **Verdict fit (weight 0.5)** — how many of A–F the norm gets right, and which ones it misses. Say the count and then give a 0–10 fit score, since I don't think all six cases carry equal weight and neither should you.
  - **Explanatory reach (weight 0.3)** — does the norm explain why some true assertions are still criticisable, why "how do you know?" feels like a legitimate challenge, and why assertion seems governed at all? Or does it just redescribe a pattern in our verdicts? 0–10.
  - **Theoretical economy (weight 0.2)** — how much the norm has to import from elsewhere before you can apply it. 0–10, higher is better, i.e. higher means it needs to borrow less.

  Then give me a weighted total out of 10 for each of the seven, sorted highest to lowest, and a tier list (S/A/B/C) with one sentence each saying why it landed where it did.

  Two extra things I'd really like, because they're where I'm stuck:

  - Which two of A–F would you cut from the battery as not doing any discriminating work, and why? I have a definate suspicion about one of them but I can't articulate it.
  - Where do you think the votes are wrong? If you'd overturn one or two of them, say which, and tell me whether overturning them reshuffles your ranking — and if it does, whether that means the ranking was just tracking our prejudices rather than the norms themselves.

  Thanks!
reasoning: |-
  Okay, this is a proper epistemology deep dive — third-year UK uni level with that very specific British academic register request. Right, let's unpack this systematically.

  First, the user's clearly prepping for a seminar defence and wants rigorous engagement, not just textbook answers. The "glossed norms" show they've done the groundwork but want fresh argumentation. That "British English" note is serious — marker's picky, so I'll avoid "gas" for petrol, "sidewalk" for pavement, and more subtly, favour "proper/improper" over "correct/incorrect". 

  The case votes are fascinating data points. That tenant scenario (B) voting improper despite truth screams that truth alone isn't sufficient — which immediately knocks norm 2 down. And that burned-out clerk (C) being voted proper without belief? That's a direct hit against norm 3. 

  Hmm, the stakes-sensitive case (E) is juicy — identical assertion, different verdicts based on audience. That consultant context heightens stakes, so norm 6 should shine. But does it? Later...

  Where I'm itching to push back: case F feels off. Spokesperson relaying a committee verdict they don't personally endorse — voted proper? That smells like communicability norm (7) doing heavy lifting, but is it cheating the "you" in "you may assert"? 

  Scoring time. Verdict fit first: Knowledge norm (1) stumbles on A (GP's forgotten source) and F (spokesperson not knowing). But truth norm (2) fails catastrophically on B (true but malicious lie). Belief norm (3) gets murdered by C (proper assertion without belief). 

  Explanatory reach — here's where norms like knowledge (1) and stakes-sensitive knowledge (6) pull ahead. They explain why "how do you know?" bites and why high-stakes contexts tighten rules. Truth norm (2) just... sits there being trivial. 

  Economy matters. Truth norm (2) is parsimonious but useless. Stakes-sensitive (6) imports whole contextualist frameworks — costly. Justification (4) needs an evidence theory... 

  *Pauses* User's stuck on which cases to cut. D (council officer) and F (spokesperson) are prime candidates. D feels like a justification norm case in disguise, while F is a niche communicability test that doesn't generalise well. 

  And overturning votes? I'd fight for case F — that spokesperson shouldn't get a free pass. If we call it improper, knowledge norm (1) climbs, communicability (7) sinks. Shows our votes aren't pure intuitions but context-laden judgements. 

  Right, time to crunch numbers without being mechanical. Weighted scores need to reflect that verdict fit dominates but isn't king — the GP case (A) shouldn't torpedo knowledge norm just because humans forget sources. 

  *Checks watch* Better draft that tier list. S-tier has to be knowledge norm (1) — it's the workhorse, even with scraped knees from case A. B-tier for reasonableness (5) and stakes-sensitive (6) — clever but messy. Truth norm (2) in the bin where it belongs. 

  Final note to self: user wants "arguing" ammunition, so highlight contradictions — like how case E's split verdict makes stakes-sensitive (6) look good, but then why did case D (protocol breach) get voted improper despite low stakes? That's a killer footnote for their seminar.
answer: |-
  Right then — let's have a proper go at this. I'll stick to British English throughout, avoid any pesky Americanisms, and give you the no-nonsense evaluation you need for your defence. We'll tackle the norms one by one, score them as requested, then address your extras. Treat this as a sparring partner's brief. 

  **Norm Assessments** *(Weighted Total Calculation: Verdict Fit 50% + Explanatory Reach 30% + Theoretical Economy 20%)*

  1. **Knowledge Norm**  
     - **Verdict Fit (5/6)**: Misses **A** (GP doesn't *know* due to forgotten source) and **F** (spokesperson doesn't *know* the claim). Gets B, C, D, E correct. **Score: 7/10** (A and F are significant misses; others solid).  
     - **Explanatory Reach**: Explains why "How do you know?" is a natural challenge, why false assertions are always improper, and why assertion is governed (it mirrors knowledge transmission). **Score: 9/10**.  
     - **Theoretical Economy**: Requires a theory of knowledge, but doesn’t import *additional* machinery (e.g., stakes, evidence thresholds). **Score: 8/10**.  
     **Weighted Total: (7×0.5) + (9×0.3) + (8×0.2) = 3.5 + 2.7 + 1.6 = 7.8/10**  

  2. **Truth Norm**  
     - **Verdict Fit (3/6)**: Fails **B** (true but improper due to baseless malice), **D** (true but improper due to protocol breach), and **E** (canteen proper but consultant improper despite same truth). Only gets A, C, F right. **Score: 4/10** (catastrophic on criticisable true assertions).  
     - **Explanatory Reach**: Can’t explain why we criticise *how* someone asserts (e.g., "You had no right to say that!"). Reduces assertion to mere truth-tracking. **Score: 2/10**.  
     - **Theoretical Economy**: Minimal baggage (only needs truth), but this is its downfall—too simplistic. **Score: 10/10**.  
     **Weighted Total: (4×0.5) + (2×0.3) + (10×0.2) = 2.0 + 0.6 + 2.0 = 4.6/10**  

  3. **Belief Norm**  
     - **Verdict Fit (4/6)**: Misses **C** (proper assertion without belief) and **F** (spokesperson may not believe it). Gets A, B, D, E correct. **Score: 6/10** (C is a glaring failure).  
     - **Explanatory Reach**: Explains sincerity but not criticisability (e.g., why negligent assertions like **D** are improper *even if* believed). **Score: 5/10**.  
     - **Theoretical Economy**: Needs no extra machinery beyond belief. **Score: 9/10**.  
     **Weighted Total: (6×0.5) + (5×0.3) + (9×0.2) = 3.0 + 1.5 + 1.8 = 6.3/10**  

  4. **Justification Norm**  
     - **Verdict Fit (4/6)**: Misses **A** (GP lacks accessible evidence) and **F** (spokesperson’s justification is second-hand). Gets B, C, D, E correct. **Score: 6/10** (A is a key miss).  
     - **Explanatory Reach**: Handles criticisability well (e.g., **D**’s protocol breach) but struggles with testimony (**A**, **F**). **Score: 7/10**.  
     - **Theoretical Economy**: Requires a full theory of justification/evidence, which is notoriously thorny. **Score: 5/10**.  
     **Weighted Total: (6×0.5) + (7×0.3) + (5×0.2) = 3.0 + 2.1 + 1.0 = 6.1/10**  

  5. **Reasonableness Norm**  
     - **Verdict Fit (6/6)**: Nails all cases: **A** (reasonable to trust training), **B** (unreasonable baseless claim), **C** (reasonable given file), **D** (unreasonable protocol breach), **E** (reasonable in canteen, unreasonable with consultant), **F** (reasonable to trust committee). **Score: 10/10**.  
     - **Explanatory Reach**: Explains criticisability (negligence in **D**), stakes-sensitivity (**E**), and social reliance (**A**, **F**). Less clear on "knowledge-like" force of assertion. **Score: 8/10**.  
     - **Theoretical Economy**: "Reasonableness" is flexible but vague—often borrows from practical rationality. **Score: 6/10**.  
     **Weighted Total: (10×0.5) + (8×0.3) + (6×0.2) = 5.0 + 2.4 + 1.2 = 8.6/10**  

  6. **Stakes-Sensitive Knowledge Norm**  
     - **Verdict Fit (5/6)**: Misses **A** (GP doesn’t "know" in high-stakes medical context?). Gets **E** perfectly (canteen low-stakes vs. consultant high-stakes). **B**, **C**, **D**, **F** correct. **Score: 8/10** (strong on **E**, but **A** is ambiguous).  
     - **Explanatory Reach**: Best for stakes cases (**E**) and contextual criticism. Treats "knowledge" as fluid—some find this ad hoc. **Score: 8/10**.  
     - **Theoretical Economy**: Heavy baggage—requires contextualist semantics for "knows". **Score: 4/10**.  
     **Weighted Total: (8×0.5) + (8×0.3) + (4×0.2) = 4.0 + 2.4 + 0.8 = 7.2/10**  

  7. **Communicability Norm**  
     - **Verdict Fit (4/6)**: Misses **B** (can’t communicate knowledge without evidence) and **C** (clerk communicates truth but not justifiable acceptance). Gets **A**, **D**, **E**, **F** right. **Score: 6/10** (fails core cases of proper assertion without transmission).  
     - **Explanatory Reach**: Explains assertion’s social role but not individual responsibility (e.g., **D**’s negligence). **Score: 6/10**.  
     - **Theoretical Economy**: Needs epistemology of testimony + audience psychology. **Score: 5/10**.  
     **Weighted Total: (6×0.5) + (6×0.3) + (5×0.2) = 3.0 + 1.8 + 1.0 = 5.8/10**  

  ---

  **Overall Ranking** (Weighted Totals, highest to lowest):  
  1. **Reasonableness (8.6)**  
  2. **Knowledge (7.8)**  
  3. **Stakes-Sensitive Knowledge (7.2)**  
  4. **Belief (6.3)**  
  5. **Justification (6.1)**  
  6. **Communicability (5.8)**  
  7. **Truth (4.6)**  

  **Tier List**  
  - **S: Reasonableness** — Flawless verdict fit while balancing stakes and social practice.  
  - **A: Knowledge, Stakes-Sensitive Knowledge** — Robust explanatory power, but brittle in edge cases (A, F) or costly (contextualism).  
  - **B: Belief, Justification** — Intuitive but fail key cases (C for Belief, A for Justification).  
  - **C: Communicability, Truth** — Truth is too thin; Communicability overemphasises audience over asserter.  

  ---

  **Your Extras**  

  **Which two cases to cut?**  
  - **Cut F (Spokesperson)**: It’s a niche case of institutional testimony and doesn’t discriminate well—**Reasonableness**, **Communicability**, and **Truth** all pass it, while stricter norms (**Knowledge**, **Justification**) fail. It’s a noisy outlier.  
  - **Cut C (Burned-out Clerk)**: While it sinks the Belief norm, it’s *too* contrived ("not believing" despite the file being plain). Most norms agree it’s proper, so it only targets Belief—poor for a general battery.  

  **Where are the votes wrong?**  
  - **Overturn F**: Voting "proper" is misguided. The spokesperson asserts *against their own epistemic position*—this is **improper** (akin to bullshitting). The norm isn’t "relay committee verdicts" but *assert what you can stand behind*.  
  - **Overturn A**: Voting "proper" is defensible but shaky—the GP *should* be mildly criticisable for not recalling sources, making it a marginal case.  

  **Impact on Ranking**:  
  - If **F** is improper, **Reasonableness** drops slightly (fit: 9/10, total ≈8.3), while **Knowledge** and **Justification** improve (fit: 6/6 and 5/6, totals ≈8.3 and 6.7). **Reasonableness** still leads due to broader explanatory reach.  
  - If **A** is improper, **Knowledge** and **Justification** suffer (fit: 4/6 and 3/6), boosting **Stakes-Sensitive** and **Reasonableness**.  
  - *Crucially*, reshuffling confirms the ranking isn’t *just* tracking prejudices—**Reasonableness** and **Knowledge** stay top-tier because they explain core phenomena (criticisability, stakes) even when verdicts shift. The exercise tests norm *resilience*, not just snapshot fit.  

  ---  
  **Final Thought for Your Defence**: Hammer that **Reasonableness** handles the messy, social nature of assertion better than "purer" norms—it’s less elegant but more robust. If your marker pushes back on "vagueness", concede but argue that assertion *is* a practice embedded in social norms, not a Platonic ideal. Throw case **E** (doctor) at them: it’s the clincher for stakes-sensitivity, which Reasonableness captures without contextualist baggage. Good luck Thursday — bring biscuits for the seminar, it soothes picky markers.
