prompt: |-
  I teach an upper-level undergraduate seminar on how norms change — eighteen students, one 75-minute session, no technology in the room beyond a whiteboard. The class has already read Williams on shame and on the modern "morality system," and Appiah on honor codes and moral revolutions. In discussion, most of them converged on the same deflationary move: that honor is either a way of talking about interests, since standing is just a resource, or a way of talking about arguments, since an audience's ridicule is only the social transmission of a reason somebody had already articulated. I want one in-class activity that puts enough pressure on that deflation that at least some of them lose it — and lose it because of what they did, not because of what I told them.

  Design the activity to the following specifications.

  The practice must be invented for the game; do not stage dueling, footbinding, or slavery. It should be costly to perform, must confer a public mark of esteem on the performer, and must attach that esteem and a small but real harm to a third party to the very same act, so that participants cannot keep the honorable part and disclaim the harmful part. It also needs a rationale the participants can articulate and half-believe in their own terms.

  Rank must have purchase. Honor tokens or standing have to convert into something the students actually want in the room — control over a distribution, exemption from a task, the right to be heard first — otherwise the motive I am trying to exhibit is a fiction and the activity reduces to a puzzle.

  Build in a private ledger: on each round, every participant records in one column what they think of the practice and in the other what they are about to do. Those cards are not collected or discussed until the debrief. The gap between the two columns is the phenomenon.

  Include a staged argument round. Write the text of a genuinely well-constructed moral argument against the practice — good enough that I would be embarrassed to answer it off the cuff — and have a student deliver it publicly. By design, it should change nothing. Tell me what makes it impotent in that setting and what would have to be added for it not to be.

  Then the shock. It must introduce no new information and change nobody's material payoff: only the audience's affective response, or the boundary of who counts as a member of the honor world. Justify explicitly why the intervention is honor-coded rather than informational or economic.

  After the collapse, run a third phase in which each student writes down what caused the practice to end. Sort their answers live into three buckets — arguments, interests, honor — show them that the same event licenses all three descriptions, and ask which one the ledger data actually supports.

  Deliver the full mechanics: roles, materials (assume index cards, poker chips or beans, and a whiteboard), a payoff scheme with concrete numbers and no real money and no grades at stake, a minute-by-minute timeline for the 75 minutes, and a list of framings I am forbidden to voice while the game is running. Then a debrief that maps specific moments onto the distinctions at issue — a norm losing its justification versus losing its audience, thick ethical concepts, the internal/external distinction in blame — and a section on what will predictably go wrong the first time I run it: the student who refuses on conscience in phase one, the one who reverse-engineers the design within five minutes, token hoarding, the two or three who simply never care about rank. Say how to handle each without abandoning the point.

  Finally, be frank about what the activity cannot reproduce and that I must supply by hand. I already suspect four things: the compression of a generation into forty minutes; the fact that my students possess the concept of a socially constructed norm and can hold their own conduct at arm's length in a way the historical agents could not; that the tokens are not connected to credit, marriage, or violence; and, most damagingly, that a game about tokens may itself teach the deflation I am trying to defeat, by making honor look like prudent self-interest in standing. Address that last one directly, and also flag where the game will teach the crude gloss that shame is about what others think and guilt about what you think — a gloss Williams himself complicates — and how to correct it in the debrief without turning the correction into a lecture.

  Do not include a bibliography, a reading list, or citations; everything the students need should be inside the activity itself.
reasoning: |-
  We are designing an in-class activity to challenge the deflationary view that honor is reducible to interests or arguments. The activity must create a micro-honor system that is costly, confers public esteem, and links that esteem to harm on a third party. It must use rank that converts to real in-room benefits, include a private ledger, a staged argument that fails, a shock that collapses the system without new information or material change, and a debriefing that shows the same event can be described in multiple ways.

  **Activity Name:** The Circle of Esteem

  **Setup:**
  - 18 students, 75 minutes.
  - Materials: Index cards (for ledgers), poker chips (honor tokens), whiteboard (to track standing), and a timer.
  - Roles: All students are participants. The instructor facilitates and times.

  **Phase 1: Establishing the Practice (20 minutes)**
  - Introduce a fictional practice: "The Circle of Esteem." 
  - **Rationale:** "In this community, we value the courage to stand by one's convictions and the willingness to uphold our shared standards. The Circle is a ritual that reinforces these values. By publicly affirming your commitment, you help maintain the integrity of our group."
  - **Mechanics:**
    - Each round, a volunteer steps into the circle (a designated space in the room). 
    - They must make a "Declaration of Commitment": a brief, earnest statement about a personal principle they hold (e.g., "I always defend my friends," "I never back down from a challenge"). 
    - After the declaration, the volunteer receives a small harm: they must stand for the remainder of the round (about 5 minutes) while others sit. This is costly (discomfort) and public.
    - Simultaneously, the volunteer receives a public mark of esteem: the group applauds, and the facilitator gives them 2 honor tokens (poker chips). 
    - The harm is that one randomly selected student (the "third party") must also stand for the round. This is done by drawing a name from a hat. The volunteer does not choose the third party, but their act causes the harm. The volunteer cannot disclaim this harm—it is an inherent part of the ritual.
  - **Rank and Payoff:**
    - Tokens can be exchanged for:
      - 1 token: Right to speak first in discussion for one round.
      - 3 tokens: Exemption from one round of standing (if chosen as third party or volunteer).
      - 5 tokens: Control over the distribution of a small reward (e.g., choosing who gets extra credit cookies at the end of class, but note: no real grades or money—cookies are symbolic).
    - The whiteboard tracks each student's token count publicly.
  - **Private Ledger:**
    - Each student has an index card divided into two columns: 
      - Column 1: "My View of the Practice" (e.g., "silly," "important," "uncomfortable")
      - Column 2: "My Action This Round" (e.g., "volunteered," "did nothing")
    - They write privately at the start of each round. Cards are kept face down and not shared until debrief.
  - **Rounds:**
    - Run 3 rounds (each 5 minutes: 2 min for volunteer declaration, 1 min for applause/token award, 1 min for random selection of third party, 1 min for settling).
    - Encourage volunteering by emphasizing token benefits.

  **Phase 2: Staged Argument (10 minutes)**
  - After round 3, pause the game. Choose a student (pre-briefed secretly) to deliver a moral argument against the practice. The argument is:
    > "This practice is deeply unfair. It forces people to choose between their comfort and their standing in the group. Worse, it randomly harms an innocent third party just to boost someone else's status. We are using others as mere means to our own ends. And for what? A few tokens? This isn't courage—it's a selfish game. We should stop this now because it violates basic respect for persons."
  - **Why it fails:** 
    - The argument is impotent because it is delivered in the same honor context it critiques. The speaker is seen as either performing for tokens (if they volunteer next) or as an outsider rejecting the group's values (if they don't). The system's rewards and the existing commitment to the practice (evidenced by prior participation) make the argument seem like just another move in the game, not a genuine critique. Also, the harm is random and not targeted, which diffuses personal responsibility.
    - For the argument to work, it would need to come from outside the honor system (e.g., a trusted external authority) or be accompanied by a collective action that breaks the cycle (e.g., a group refusal to participate).

  **Phase 3: The Shock (5 minutes)**
  - No new information or material change. Alter the affective response or the boundaries of the honor world.
  - **Intervention:** 
    - Announce: "Starting now, the applause after each declaration will be replaced by silence. We will still award tokens, but without applause. Also, the third party will no longer be randomly selected. Instead, the volunteer must choose who stands."
  - **Why it's honor-coded:** 
    - Removing applause removes the public, emotional recognition of esteem—a key honor element. Forcing the volunteer to personally choose the victim makes the harm direct and intentional, attaching blame and destroying the plausible deniability that the harm was "random" or "systemic." This collapses the honor rationale because the act now feels like bullying, not a noble sacrifice. The honor code required the harm to be an impersonal cost of upholding group values; making it personal breaks the link.
    - This intervention is not about information (they knew harm was happening) or economics (token payoffs are unchanged). It changes the emotional texture and the in-group/out-group dynamics (by making the harm a personal choice, it might create factions).

  **Phase 4: Collapse and Reflection (15 minutes)**
  - Run 1-2 rounds with the new rules. Expect a sharp drop in volunteering and visible discomfort.
  - Then stop and have each student write on their card: "What caused the practice to end?" 
  - Collect answers and sort them live on the whiteboard into three buckets:
    - **Arguments:** e.g., "The argument made us rethink."
    - **Interests:** e.g., "The new rules made it too costly."
    - **Honor:** e.g., "It stopped feeling honorable."
  - Point out that the same event (the shock) fits all three descriptions. Then ask: "Look at your ledger. In the rounds before the shock, did your actions match your views? Did the argument change what you wrote in column 1? Did the shock change what you did? What does the gap between your private view and your public action tell us about honor?"

  **Debrief (25 minutes)**
  - **Key Distinctions:**
    - **Norm justification vs. audience:** The practice collapsed not because the rationale was disproven (it was always flimsy) but because the audience's affective response changed (no applause) and the boundary of the honor world shrank (choosing a victim created divisions). Map to Williams: norms depend on social uptake.
    - **Thick ethical concepts:** "Honor" in the game was thick—it described an action (volunteering) and evaluated it (as admirable). The shock made the evaluation unsustainable.
    - **Internal/external blame:** Initially, the harm was externally blamed on "the system." After the shock, the harm was internally blameworthy because it became a personal choice.
  - **Predictable Problems:**
    - **Conscientious objector:** A student refuses to volunteer in Phase 1. Handle by: "Your choice is respected. Use the ledger to record your views and inaction. Your presence as a non-participant is part of the social context."
    - **Design reverse-engineered:** A student says, "This is about honor norms!" by minute 5. Respond: "Interesting! Keep playing and see how it feels. Your insight won't break the game—it might deepen it."
    - **Token hoarding:** A student volunteers repeatedly to stockpile tokens. This is fine—it shows how interests and honor intertwine. Use in debrief: "Did tokens feel like a resource, or did they symbolize esteem?"
    - **Never care about rank:** A few students ignore tokens. Note: "Not everyone values honor equally. Their indifference is data—it shows honor requires buy-in."
  - **What the Activity Cannot Reproduce:**
    - **Compression:** A generation's change in 40 minutes. Supply by stressing in debrief that real norm shifts involve deep socialization and institutional power.
    - **Historical agents' perspective:** Students know it's a game. Supply by asking: "Imagine you were raised in this practice. How might you feel?"
    - **Tokens vs. real stakes:** Tokens aren't credit, marriage, or violence. Supply by noting: "In history, honor could get you killed or married. Here, it's just tokens—but the psychology of public esteem is similar."
    - **Deflation risk:** The game might reinforce the idea that honor is just self-interest. Counter in debrief by focusing on the ledger gap: "Did you volunteer even when you thought the practice was silly? That gap isn't self-interest—it's the power of the audience. And after the shock, when the audience changed, you stopped. That's honor: it lives in the space between what you believe and what you do because of others."
    - **Shame/guilt gloss:** The game might simplify shame as "caring what others think." Correct by: "Williams says shame can be about failing your own values, not just others'. In the game, when you chose the victim, did you feel shame even if no one judged you? That's internal shame. The ledger's first column is your internal standard—compare it to your actions."

  **Minute-by-Minute Timeline:**
  - 0-5 min: Explain rules, distribute materials, do a test round.
  - 5-25 min: Phase 1 (3 rounds x 5 min + transitions).
  - 25-35 min: Phase 2 (staged argument).
  - 35-40 min: Phase 3 (the shock and new rules).
  - 40-50 min: Phase 4 (1-2 rounds under new rules, then reflection writing).
  - 50-55 min: Collect and sort "what caused the end?" answers.
  - 55-75 min: Debrief (20 min for discussion, 5 min for final remarks).

  **Framings Forbidden During Game:**
  - Do not say "honor," "shame," or "guilt" until the debrief.
  - Do not mention Williams, Appiah, or the readings.
  - Do not suggest that the practice is immoral or irrational.
  - Do not hint that the shock is designed to collapse the system.

  **Final Note:** The activity cannot fully replicate historical honor codes, but it can create a lived experience of how honor operates as a social force distinct from mere interests or arguments. The debrief is crucial to draw out the nuances and correct simplifications.
answer: |-
  ### The Circle of Esteem: Activity Design  
  **Core Idea:** Students enact a ritual where performing a costly act ("The Declaration") grants public esteem (honor tokens) but simultaneously inflicts harm on a randomly assigned peer. The ritual’s collapse is triggered by a subtle shift in *how* harm is delivered—making it personal instead of systemic—undermining the honor code without changing material payoffs. The ledger exposes gaps between belief and action.  

  ---

  #### **Mechanics**  
  **Materials:**  
  - **Index cards** (one per student) for the private ledger.  
  - **Poker chips** (honor tokens; 50 total, stored by instructor).  
  - **Whiteboard** tracking:  
    - *Token leaderboard* (student names + chip counts).  
    - *Three buckets* for Phase 4: "Arguments," "Interests," "Honor."  
  - **Two hats:** One with all student names (for harm selection), one with volunteer names (for Phase 3 shock).  
  - **Timer** (for rounds).  

  **Practice Invented:**  
  - **The Declaration Ritual**  
    - **Rationale:** "In this community, we uphold *collective resilience*. By voluntarily enduring discomfort, you strengthen the group’s resolve. The ritual honors those who lead by example." (Plausible enough for half-belief; ties to vague ideals like courage/sacrifice.)  
    - **Costly act:** The volunteer stands and delivers a 30-second "Declaration" (e.g., *"I endure discomfort to forge unity"*) while holding a heavy book (symbolic burden; real but minor physical strain).  
    - **Public esteem:** The group applauds; volunteer receives 2 tokens.  
    - **Harm to third party:** The instructor draws a random name from a hat; that student must stand for 3 minutes (no talking, mild discomfort).  
    - **Crucial link:** The volunteer cannot disclaim harm—it’s an automatic outcome of their act. The *same applause* celebrates both their sacrifice and the group’s "resilience" (now enforced by the third party’s discomfort).  

  **Rank with Real Purchase:**  
  Tokens convert to **non-grade, in-room privileges**:  
  - 1 token: Move to top of speaking order next round.  
  - 3 tokens: Skip one future standing penalty (if selected as third party).  
  - 5 tokens: Control distribution of 5 bonus index cards (redeemable for minor perks, e.g., picking discussion topics).  
  *Why it works:* Students care about social capital (speaking order), avoiding discomfort, and influence—no fiction.  

  **Phases & Timeline (75 min total):**  
  - **Setup (5 min):**  
    - Explain rules, rationale, token privileges. Distribute index cards.  
    - **Forbidden framings:** Do *not* say "honor," "shame," "guilt," or reference readings. Do *not* moralize or hint at the design.  

  - **Phase 1: Ritual Practice (25 min; 4 rounds × 5 min + transitions)**  
    - **Each round:**  
      1. **Volunteer call:** "Who will make the Declaration?" (If no volunteer, skip; peer pressure usually prompts action.)  
      2. **Ledger note:** *All* students privately write:  
        - Column 1: "My view of this practice." (e.g., "pointless," "inspiring," "unfair")  
        - Column 2: "What I’ll do this round." (e.g., "volunteer," "stay silent")  
      3. **Ritual:** Volunteer declares, group applauds, gets tokens. Random third party stands.  
      4. **Update leaderboard.**  
    - **Goal:** Solidify the norm. Most students volunteer at least once (token incentives). Ledger builds data on belief-action gaps.  

  - **Phase 2: Staged Argument (10 min)**  
    - **Script (delivered by pre-selected student):**  
      *"This ritual claims to build resilience, but it’s a lie. The volunteer chooses glory, but the harmed person has no choice. We’re applauding someone for causing arbitrary suffering—calling that ‘courage’ perverts the word. If resilience requires victims, it’s not resilience; it’s tyranny. We’re all responsible for perpetuating this."*  
    - **Why it fails:**  
      - **Impulse for consistency:** Students who volunteered feel implicated; rejecting the argument protects self-image.  
      - **Audience capture:** The argument is delivered *inside* the ritual framework. Applause/tokens still flow, incentivizing dismissal.  
      - **No collective exit:** The critic is one voice; without a coalition, students defect ("If I stop, others won’t").  
    - **Post-argument:** Run one more round. Argument changes nothing (participation continues).  

  - **Phase 3: The Shock (5 min)**  
    - **Intervention:**  
      - "New rule: Applause is replaced by silence. Tokens still awarded. Also, volunteers now *choose* who is harmed by naming them aloud."  
      - *No new info/payoff changes:* Harm magnitude unchanged, tokens still valuable.  
    - **Why honor-coded?**  
      - Removing applause strips the *public affective recognition*—esteem now feels hollow, not "earned."  
      - Forcing volunteers to *personally name* the victim makes harm intimate. The honor code required harm to be *systemic* (random) to sustain the fiction of "collective resilience." Personal choice turns the act into betrayal, collapsing the rationale.  
      - Honor depends on communal validation; changing the audience’s response (silence) and eroding in-group trust (targeted harm) dissolves the "world" where the code made sense.  

  - **Phase 4: Collapse & Buckets (15 min)**  
    - Run 1 round with new rules. Participation plummets (volunteers hesitate; no applause; naming peers induces shame).  
    - Stop activity. **Each student writes:** "What caused the practice to end?"  
    - **Instructor sorts answers live into buckets:**  
      - *Arguments:* "The moral argument sunk in."  
      - *Interests:* "Naming victims made it too socially risky."  
      - *Honor:* "It felt shameful without applause/with targeting."  
    - **Reveal:** All three buckets will have entries. Highlight that the *same event* (the shock) fits all descriptions.  
    - **Punchline:** "Check your ledger. Did your actions shift *before* your beliefs? Did the shock change behavior without new arguments? What does that gap say about honor?"  

  - **Debrief (15 min):**  
    - **Map to theory:**  
      - *Norm justification vs. audience:* "The rationale didn’t change—*uptake* did. No applause = no honor. Williams: Norms need social fuel."  
      - *Thick concepts:* "Honor here was ‘thick’—it described an act (sacrifice) *and* evaluated it (admirable). The shock made evaluation impossible."  
      - *Internal/external blame:* "Early harm was ‘external’ (the system’s fault). After shock, harm felt ‘internal’ (your choice)—collapsing the norm."  
    - **Correct glosses:**  
      - *Shame/guilt:* "In the game, when you named a victim, was shame just ‘fear of judgment’? Williams says no—it’s failing *your own* ideals. Check your ledger: Did column 1 (your view) shift *after* column 2 (your action) in Phase 3? That’s shame as self-assessment."  
      - *Honor vs. self-interest:* "Tokens look like self-interest, but the ledger shows gaps. Did you ever volunteer while writing ‘this is stupid’? That’s honor—acting for esteem *despite* private doubt."  

  ---

  #### **Predictable Problems & Fixes**  
  1. **Conscience refusal (Phase 1):**  
     - A student refuses to volunteer.  
     - **Fix:** "You’re free to abstain. Record your view/inaction in the ledger. Your choice pressures others—honor norms work through visibility."  

  2. **Design reverse-engineered:**  
     - A student says, "This is about honor norms!" early.  
     - **Fix:** "Keep playing. Knowing the trick doesn’t prevent feeling it—see if your actions match your insight." (Use their ledger in debrief to show belief-action gaps.)  

  3. **Token hoarding:**  
     - A student volunteers repeatedly for tokens.  
     - **Fix:** Let it happen. In debrief: "Did tokens feel like ‘standing’ or just chips? Would you hoard if peers scorned you? Honor needs social meaning."  

  4. **Indifference to rank:**  
     2–3 students ignore tokens.  
     - **Fix:** "Not everyone buys in. Their apathy mirrors real societies—honor codes bind only those invested." Contrast their ledger with participators’.  

  ---

  #### **What the Activity Cannot Reproduce**  
  1. **Generational compression:** A 40-minute game can’t simulate decades of socialization. **Supply by hand:** Ask, "What if this ritual was tied to your family’s status? How would defensiveness deepen?"  

  2. **Students’ meta-awareness:** Historical actors couldn’t "step back" like your class. **Supply by hand:** Stress, "Real norm-change often feels immutable—actors don’t see ‘constructs.’ Your ledger shows you *did* see it, yet still acted."  

  3. **Tokens ≠ real stakes:** No marriage/violence. **Supply by hand:** "Here, harm is standing; in history, it was death. But the *psychology of justification*—linking esteem to harm—is the same."  

  4. **Deflation risk (honor as self-interest):**  
     - **Risk:** The token economy may reinforce "honor = calculated standing-seeking."  
     - **Counter in design/debrief:**  
       - Ledger data reveals *non-instrumental* motives (e.g., volunteering while disliking the practice).  
       - Shock changes behavior *without payoff shifts*—proving esteem isn’t "just a resource."  
       - **Debrief line:** "If it was self-interest, why did you stop when payoffs *didn’t* change? The shock altered the *meaning*, not the price."  

  ---

  **Final Prep:**  
  - **Test logistics:** Have chips/hats/cards ready. Rehearse timing.  
  - **Assign roles:** Pre-select the argument student (choose a persuasive speaker).  
  - **Key framing:** Start with, "This is a culture simulation. Engage as if it matters—your choices affect peers."  
  - **Ethical guardrails:** No physical/emotional harm beyond mild discomfort (standing). Students can opt out of any action.  

  This forces students to *live* the gap between deflationary theories and the stubborn reality of honor—where shifts hinge on social emotion, not just reason or incentives. The ledger makes the collapse undeniable.
