  To get a conflict, need that for large n, package is accepted, but sequential is rejected step by step.

  For large n, say n=100, package RDU >1000, say.

  In sequential, at each step, if she has current wealth W, the incremental gamble is lose 100/gain 110, with P=0.5. RDU for this incremental gamble depends on current wealth.

  But with linear utility, and weighting w(p) not wealth-dependent, the RDU for the incremental change is always the same: as above, with w(0.5)≈0.707, RDU_incremental = w(0.5)*u(change -100) + (1-w(0.5))*u(change +110) = 0.707*(-100) + 0.293*110 ≈ -70.7 + 32.23 = -38.47 <0, so always rejects the incremental gamble, regardless of wealth or history.

  But for the package, for large n, RDU >0, so she would accept the package but reject all sequential offers. This is a conflict.

  And since the outcome distribution is the same, it's a description dependence that leads to different choices.

  Moreover, by rejecting the sequential offers, she gets 0, while accepting package gives positive expected utility, so she is forgoing a sure gain in expectation.

  So this is a violation of normative rationality.

  For the constructive counterexample: agent with u(x)=x (linear), w(p)=p^0.5 for all p (convex, risk-averse weighting).

  Initial wealth W0=1000.

  Single gamble: lose 100/gain 110 with p=0.5. RDU = w(0.5)*900 + (1-w(0.5))*1100 = (√0.5)*900 + (1-√0.5)*1100 ≈ 0.707*900 + 0.293*1100 ≈ 636.3 + 322.3 = 958.6 < 1000, so rejects.

  Now for a package of n=100 such independent gambles. Expected final wealth = 1000 + 100*5 = 1500.

  Variance large, but by central limit theorem, approximately normal with mean 1500, std dev sqrt(100*11025) wait earlier var per gamble 11025, std dev 105, for n=100, std dev 1050.

  RDU for large n: since w is continuous, RDU should converge to EU as n→∞ for i.i.d. risks, and EU=1500>1000, so for large n, RDU>1000, so accepts package.

  But if offered sequentially, at each step, the incremental RDU is negative as above, so she rejects each offer.

  Thus, she rejects the sequential form but accepts the package, even though the set of gambles is the same.

  This violates the principle that rational choice should depend only on the outcome distribution, not on presentation.

  Moreover, it leads to dominated strategies in expectation.

  So this is a fatal flaw for the locality clause, as it creates a sensitivity to framing.

  A sophisticated defender might bite the bullet and insist that package and sequential are different decision problems, so different choices are permissible. But this seems costly, as it allows Dutch books or at least money pumps.

  For example, a bookie could first offer the package, she accepts, pays fee say, then instead of resolving together, offers them sequentially, and she rejects each, so overall she pays the fee but doesn't play, loss. So can be pumped.

  Thus, the view is vulnerable.
answer: |-
  Below, I stress-test your four-component view on rational choice under risk: (1) rank-weighted expected utility (RDU) as normative core, (2) irreducibility of risk attitude, (3) weighting function as tracking non-fungibility, and (4) locality. I address your queries systematically, prioritizing fatal flaws over awkward ones. The analysis includes formal counterexamples, interpretive collapses, and empirical exposures. A **constructive finite decision problem** violating all components is presented, with arithmetic. I conclude with predictions, falsifiability, and verdict.

  ---

  ### **1. Fatal Flaws: Counterarguments and Concessions**
  Fatal flaws render the view internally inconsistent or reducible to rivals. Awkward flaws are theoretically salvageable but costly.

  #### **Fatal Flaw 1: Sequential Choice Violates Dominance and Locality**  
  **Counterargument**: An agent who knows her future choices can be "pumped" (exploited) in sequential decisions, violating statewise dominance. Locality + non-fungibility forces choices to depend on problem framing, not just outcomes.  
  **Constructive Counterexample**:  
  - **Setup**: Agent has linear utility in money, initial wealth $1000$, and weighting function $w(p) = p^{0.5}$ (convex, risk-averse). Gamble $G$: 50% lose $100$, 50% gain $110$.  
  - **Single Gamble**: RDU of $G$ at $W_0 = 1000$:  
    - Final wealth: $900$ or $1100$.  
    - Ranked: $900 < 1100$.  
    - $w(0.5) \approx 0.707$, so RDU $= w(0.5) \cdot 900 + (1 - w(0.5)) \cdot 1100 \approx 0.707 \times 900 + 0.293 \times 1100 = 958.6 < 1000$.  
    → Rejects $G$ alone (as desired).  
  - **Package of $n=100$ Gambles**:  
    - Expected final wealth $= 1000 + 100 \times 5 = 1500$.  
    - By law of large numbers, RDU converges to expected utility (EU) for large $n$. EU $= 1500 > 1000$, so RDU $> 1000$ for large $n$.  
    → Accepts package (as committed).  
  - **Sequential Choice (Sophisticated Agent)**:  
    - At each step, wealth $W_t$. Incremental $G$ has RDU: $w(0.5) \cdot (-100) + (1 - w(0.5)) \cdot 110 \approx 0.707 \times (-100) + 0.293 \times 110 = -38.47 < 0$.  
    → Rejects $G$ at every step, regardless of wealth history.  
  - **Conflict**:  
    - Accepts package but rejects all sequential gambles.  
    - Outcome distributions are identical (100 independent $G$s), but choices differ based on framing (package vs. sequential).  
  - **Statewise Dominance Violation**:  
    - In states where net gain $>0$ (e.g., win most gambles), sequential choice yields $W = 1000$ (reject all), package yields $W > 1000$.  
    - In states where net loss $<0$, sequential yields $W = 1000$, package yields $W < 1000$.  
    → Not statewise dominated (since not strictly worse in all states), but strictly worse in some states and expected value.  
  - **Pumping**: Bookie charges fee $F > 0$ to "package" the gambles. Agent pays $F$ to accept package. Bookie then offers gambles sequentially; agent rejects each, netting $W = 1000 - F < 1000$ (strict loss).  

  **Defender's Concession**:  
  - A sophisticated defender concedes that locality permits framing-dependent choices, violating **rationality as extensionality** (choices should depend only on outcomes, not description). She must abandon statewise dominance or locality.  
  - **Dismissal Cost**: Biting the bullet allows Dutch books, undermining normative status. Resolute choice (committing to a plan) doesn't resolve this: if the agent commits to accept all sequential gambles, she violates her RDU evaluation at each step. Sophisticated choice worsens the problem.  

  #### **Fatal Flaw 2: Irreducibility Collapses with Non-Fungibility**  
  **Counterargument**: Non-fungibility requires risk attitude to depend on context (e.g., wealth level). But if weighting is context-dependent, it is reducible to expected utility (EU) with enriched outcomes (e.g., wealth-relative states).  
  **Formal Redescription**:  
  - Let $w(p; W)$ be wealth-dependent weighting (e.g., $w(p; W) = p^2$ if $W < 900$, $w(p; W) = p$ if $W \geq 900$).  
  - Define a state-dependent utility:  
    $U(W, \text{outcome}) = u(\text{outcome}) \cdot \phi(W)$,  
    where $\phi(W)$ encodes weighting distortion (e.g., $\phi(W) = 1$ if $W \geq 900$, $\phi(W) = 0.5$ if $W < 900$).  
  - Then RDU $=$ EU with $U$.  
  - **Irreducibility claim fails**: RDU is a notational variant of EU with context-dependent utility.  

  **Defender's Concession**:  
  - A defender concedes that non-fungibility forces context-dependency, making irreducibility untenable. She must drop irreducibility or non-fungibility.  
  - **Dismissal Cost**: If irreducibility is abandoned, RDU no longer rivals EU; it is a special case. Non-fungibility moves to utility, violating your second component.  

  #### **Fatal Flaw 3: Weighting Function Ambiguity and Underdetermination**  
  **Counterargument**: For any finite set of preferences, multiple weighting functions fit, so RDU cannot uniquely rationalize choices. This undercuts normative prescriptions.  
  **Formal Result**:  
  - Given $k$ observed choices, there are infinitely many $w(p)$ satisfying RDU (e.g., $w(p) = p^\gamma$ for different $\gamma$).  
  - **Example**: Agent rejects single $G$ (as above) but accepts package of 100 $G$s. Both $w(p) = p^{0.5}$ and $w(p) = p^{0.6}$ fit:  
    - For $w(p) = p^{0.6}$, single $G$: RDU $= w(0.5) \cdot 900 + (1 - w(0.5)) \cdot 1100 \approx 0.66 \times 900 + 0.34 \times 1100 = 958 < 1000$ (rejects).  
    - Package: RDU $> 1000$ for large $n$ (as before).  
    → Both functions explain the data, but prescribe different choices for new gambles (e.g., package of 10 $G$s).  

  **Defender's Concession**:  
  - A defender concedes that RDU is underdetermined without ad hoc constraints (e.g., parametric forms). This weakens normative force.  
  - **Dismissal Cost**: Appeals to "plausible" weighting functions (e.g., inverse-S shape) are empirical, not normative.  

  ---

  ### **2. Awkward Flaws: Salvageable but Costly**
  #### **Awkward Flaw 1: Non-Fungibility in Weighting vs. Utility**  
  **Counterargument**: Non-fungibility naturally belongs in utility over final states (e.g., catastrophic losses reduce opportunity sets). Putting it in weighting is redundant.  
  - **Example**: Loss of $100$ at $W = 1000$ vs. $W = 500$. Diminishing marginal utility of wealth captures non-recoverability; RDU duplicates this with probability weights.  

  **Defender's Concession**:  
  - A defender concedes that utility curvature can model non-fungibility but argues weighting captures "risk attitude" separately.  
  - **Dismissal Cost**: If utility is context-sensitive, it collapses irreducibility. Distinguishing "attitude to risk" from "outcome sensitivity" becomes verbal.  

  #### **Awkward Flaw 2: Package Size Commitments Fail for Some Weightings**  
  **Counterargument**: Your commitments (reject small packages, accept large ones) hold only for specific $w(p)$. Globally concave $w(p)$ may accept small packages.  
  - **Example**: $w(p) = p^2$ (globally concave). Single $G$: RDU $= w(0.5) \cdot 110 + (1 - w(0.5)) \cdot (-100) = 0.25 \times 110 + 0.75 \times (-100) = -62.5 < 0$ (rejects).  
  - Two $G$s package: Outcomes $-200$ (p $= 0.25$), $+10$ (p $= 0.5$), $+220$ (p $= 0.25$).  
    - Ranked: $-200 < +10 < +220$.  
    - Weight for $-200$: $w(0.25) = 0.0625$.  
    - Weight for $+10$: $w(0.75) - w(0.25) = 0.5625 - 0.0625 = 0.5$.  
    - Weight for $+220$: $1 - w(0.75) = 0.4375$.  
    - RDU $= 0.0625 \times (-200) + 0.5 \times 10 + 0.4375 \times 220 = 88.75 > 0$ (accepts).  
  → Accepts two $G$s but rejects one, violating your commitment.  

  **Defender's Concession**:  
  - A defender concedes that $w(p)$ must be convex for small $p$ (e.g., inverse-S shape) to reject small packages. This is an empirical restriction.  
  - **Dismissal Cost**: Weighting is constrained by predictive goals, not pure rationality.  

  #### **Awkward Flaw 3: Collective Decisions are Problematic**  
  **Counterargument**: Aggregating individual RDU preferences may not yield coherent group decisions (e.g., intransitive or non-separable).  
  - **Example**: Two agents with different $w(p)$ vote on gambles. RDU preferences violate Arrow's axioms (e.g., independence of irrelevant alternatives).  

  **Defender's Concession**:  
  - A defender concedes RDU is for individual choice; groups require new axioms.  
  - **Dismissal Cost**: Limits scope to individual decisions.  

  ---

  ### **3. Predictions and Exposure to Rivals**
  - **Orthodox EU**: Predicts acceptance of all positive-EV gambles (e.g., $G$). RDU predicts rejection of small-stakes gambles even with linear utility. Exposure: Empirical data (e.g., Rabin paradox) supports RDU here, but sequential pumping exploits RDU.  
  - **Ambiguity Models (e.g., Maxmin EU)**: Predict different violations (Ellsberg paradox). RDU is exposed by handling only risk (known probabilities), not ambiguity.  
  - **Probability Weighting (e.g., Prospect Theory)**: Predicts same small-stakes rejections but attributes it to probability distortion, not risk attitude. Exposure: RDU cannot empirically distinguish weighting from utility without irreducibility.  

  ---

  ### **4. Verdict on Falsifiability and Normative Status**
  - **Unfalsifiability**: With locality, the view **is qualified into unfalsifiability**. Locality makes risk attitude hyper-sensitive to framing ("decision problem as faced"), allowing post hoc explanations for any choice pattern (e.g., framing a sequence as one "package" or many).  
  - **Normative Cost**: This is a **defect for a normative theory**. Normative theories must prescribe consistent choices; locality permits contradictions (e.g., sequential vs. package). While empirical content can be vague in normative theories, your claims about preferences (e.g., rejecting small gambles but accepting large ones) are testable—and fail under pumping.  
  - **Silver Lining**: If locality is dropped, RDU survives as a descriptive model but loses normative force against EU.  

  ---

  ### **Conclusion**
  The package is fatally flawed:  
  1. **Sequential choice** + locality enables pumping and framing effects.  
  2. **Non-fungibility** forces reducibility.  
  3. **Weighting underdetermination** weakens normative prescriptions.  
  The constructive counterexample shows a finite decision problem (100 gambles, package vs. sequential) where all four components conflict. Irreducibility and locality are the weakest links. If you retain RDU, drop locality and accept reducibility; this saves the core intuition but at the cost of rivalry with EU.
