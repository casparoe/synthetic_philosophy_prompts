  RDU_status quo = 1000.

  1050 > 1000, so accepts! But the user wants to reject the small gamble. I see, with linear utility and concave w, for a symmetric gamble, RDU may be higher than EU if w(0.5)<0.5, but here w(0.5)=0.25<0.5, so underweights the loss outcome, so RDU=1050 > EU=1000, so prefers the gamble. But risk aversion would require overweighting the loss or underweighting the gain. With concave w, it's risk-seeking for losses or something. This is inverted.

  For risk aversion in RDU, we need w(p) > p for small p and w(p) < p for large p, like inverse S-shape, not globally concave. Globally concave w(p) implies risk-seeking behavior for some gambles.

  To model risk aversion with RDU, we need a weighting function that overweights small probabilities and underweights large ones, so for a gamble with small prob of loss, it overweights the loss, making it less attractive.

  In the single gamble, P(loss)=0.5, which is large, so if w(p) < p for p>0.5, then underweights the loss probability, making the gamble more attractive, not less.

  To have risk aversion for symmetric gambles, we need w(0.5) > 0.5, so overweights the loss probability. But that requires w convex for p<0.5, not concave. Concave w has w(p) < p for p>0.5, but for p<0.5, w(p) > p if concave and w(0.5)>0.5, but for globally concave, w(0.5) ≤ 0.5.

  For example, w(p) = 1 - (1-p)^2, which is convex, w(0.5)=1-0.25=0.75>0.5. Then for gamble, RDU= w(0.5)*900 + (1-w(0.5))*1100 = 0.75*900 + 0.25*1100 = 675 + 275 = 950 < 1000, so rejects.

  So use convex weighting for risk aversion. Set w(p) = p^0.5 for example, which is convex for p<1. w(0.5)=√0.5≈0.707>0.5. RDU_single = w(0.5)*900 + (1-w(0.5))*1100 ≈ 0.707*900 + 0.293*1100 ≈ 636.3 + 322.3 = 958.6 < 1000, rejects.

  Now for two gambles package: final wealth outcomes: lose both: 1000-200=800, win one: 1000+10=1010? Better to have net change. Final wealth: initial 1000, so outcomes: 800, 1010, 1010, 1220. Prob: 800 p=0.25, 1010 p=0.5, 1220 p=0.25.

  Ranked: 800, then 1010, then 1220.

  With RDU, weight for 800: w(P(wealth≤800)) = w(0.25). w(p)=p^0.5, w(0.25)=0.5.

  Weight for 1010: w(P(wealth≤1010)) - w(P(wealth<1010)) = w(0.75) - w(0.25) = √0.75 - 0.5 ≈ 0.866 - 0.5 = 0.366. Since there are two outcomes at 1010, but same wealth level, so combined.

  Weight for 1220: 1 - w(0.75) ≈1-0.866=0.134.

  RDU = 0.5*800 + 0.366*1010 + 0.134*1220 = 400 + 369.66 + 163.48 = 933.14 < 1000, so rejects package.

  But for large n, it should accept. For example n=100, EV=1000+500=1500, and with convex w, but by law of large numbers, RDU close to EU close to EV, so >1000, accepts.

  But for sequential choice: after accepting first and losing, wealth 900. Now offered second gamble. Final wealth if accept: 900-100=800 or 900+110=1010. RDU at wealth 900: status quo 900. Gamble: 800 or 1010. P(loss)=0.5. w(0.5)≈0.707, RDU_gamble = 0.707*800 + 0.293*1010 ≈ 565.6 + 295.93 = 861.53 < 900, so rejects.

  Similarly if won first, wealth 1100, RDU_gamble = w(0.5)*1000 + (1-w(0.5))*1210 = 0.707*1000 + 0.293*1210 ≈ 707 + 354.53 = 1061.53 > 1100? 1061.53 < 1100? 707+354=1061<1100, so still less, so rejects after win as well.

  So sophisticated agent, when offered first gamble, knows that if she accepts, she will reject the second regardless, so final wealth 1100 or 900, each prob 0.5. RDU from accept first: as above for single gamble, but now initial wealth 1000, final 1100 or 900, RDU= w(0.5)*900 + (1-w(0.5))*1100 ≈0.707*900 + 0.293*1100 ≈636.3 + 322.3=958.6 < 1000, so rejects first.

  But for the package of two, RDU=933.14<1000, also rejects.

