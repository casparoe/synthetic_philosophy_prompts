answer: |-
  Here is your objection prep sheet, structured as requested and tailored to your audience:

  **Objection Response Table**

  | Rank | Objector (Group) | Objection in Their Words | Likelihood | Damage if Unanswered (1-5) | Two-Minute Reply | Soft Spot | Concede or Hold |
  |------|------------------|--------------------------|-----------|----------------------------|-------------------|----------|-----------------|
  | 1 | Statistician (iv) | "Your SSA approach smuggles in an implicit random sampling mechanism where none exists. Gott's delta-t prior worked for subway stations because we *know* there's a station-building process with temporal uniformity. But for observers in a multiverse? Without a physical randomizer, invoking 'sampling' from a reference class is just a Bayesian base-rate fallacy with extra steps." | High (Core methodological disagreement) | 5 (Undermines entire framework) | "Sampling here is epistemic, not physical. When I say 'I could have been any observer-moment like *this*', 'could have been' reflects ignorance of my spatiotemporal coordinates—not a dynamical process. The base rate *is* relevant under total indexical ignorance, as in Doomsday: conditioning on birth rank *should* shift your estimate if you have no temporal landmark." | "Ignorance doesn't generate likelihoods without a principled indifference rule. Why privilege uniformity over rank over, say, log-rank? Your 'epistemic sampling' is unmotivated." | **Hold**: Epistemic symmetry justifies indifference. |
  | 2 | Decision Theorist (iii) | "Suppose I offer you a bet before revealing whether you're in a large or small multiverse. By your SSA+max-ref-class view, wouldn't you assign equal prior credence to being any subjectively identical observer-moment? But then after learning *which* universe you're in, you update via SSA. I can Dutch-book you by exploiting the mismatch between your prior and posterior odds over universe sizes." | Medium (Requires specific setup) | 5 (Shows diachronic incoherence) | "My prior *already* incorporates SSA over the maximally specific class within each universe. When I learn *which* universe I'm in, I eliminate branches. Pre-bet, I don't have a flat prior over multiverse sizes—I have a prior over cosmologies, each with its SSA-weighted observer-moment distribution. No incoherence." | "But if you don't know the multiverse structure pre-bet, what's your prior over size? If it's not flat, SSA isn't doing the work alone." | **Hold**: Cosmological priors screen off the issue. |
  | 3 | Philosopher (i) | "You claim SSA conditions on evidence, but what *is* the total evidence here? My subjective state includes ‘I am now’. But SSA treats this indexical fact as a *sample* from a hypothetical ensemble. That’s not conditioning—it’s replacing the probability space with a new one where indexicals are random variables. That’s question-begging against SIA's treatment of existence as evidence." | High (Targets core justification) | 4 (Makes SSA seem ad hoc) | "Conditioning on ‘I exist now with these experiences’ *is* legitimate evidence. SSA formalizes the symmetry: observers with identical evidence should assign identical credences to being in world A vs B, *if* the evidence is compatible with both. SIA breaks this by adding phantom observers." | "But why is my existence *merely* a symmetry constraint? Doesn't the fact that observers exist at all tell us something about the universe's parameters?" | **Concede**: Existence *can* be evidence for life-permitting parameters. **Hold**: SIA overcounts it. |
  | 4 | Historian/Philosopher (v) | "Typicality assumptions like yours are unfalsifiable. If we find we're early observers, you say we’re typical of early reference classes. If late, typical of late. But if typicality is defined relative to whatever class makes us typical, how is this science rather than just the cosmological principle rebranded?" | Medium (General skepticism) | 3 (Damages scientific credibility) | "It’s falsifiable! If a theory predicts 99% of observers see cosmic event X by year Y, and we see no X by Y+1, we disconfirm it. My SSA refinement fixes the reference class *objectively*: by maximal specificity given evidence. Presumptuous Philosopher fails because inflating observer count *without changing predictions* shouldn’t change credences—SSA respects that." | "Maximal specificity still depends on how finely you individuate subjective states. Is that truly objective?" | **Concede**: Individuation isn't perfectly sharp. **Hold**: It's constrained by physics/cognition. |
  | 5 | Cosmologist (ii) | "Fine, you avoid SIA's worst excesses. But how does this help with the *measure problem*? In eternal inflation, the 'maximally specific reference class' might be a single quantum state. Then SSA assigns zero probability to any universe not containing *that exact state*. That's useless for comparing vacua." | Low (Niche concern) | 2 (Limited relevance) | "SSA isn't a measure; it's how agents *in* a universe assign self-locating credences *given* a measure. For comparing vacua, we still need a physical measure over configurations. SSA just tells observers within a high-entropy vacuum why they shouldn't be surprised to find themselves there—no SIA needed." | "But if the physical measure predicts mostly Boltzmann brains, SSA says I should expect to be one. That’s still catastrophic." | **Concede**: Boltzmann brains remain a problem. **Hold**: SSA isn't the cause. |
  | 6 | Philosopher (i) | "Your 'modest Doomsday shift' relies on assuming a uniform prior over birth ranks. But why uniform? That's the indifference principle you reject elsewhere! If I have no evidence about my temporal position, why not a log-uniform prior? That drastically weakens Doomsday." | Medium (Internal tension) | 3 (Weakens an application) | "Uniformity follows from the same epistemic symmetry justifying SSA: absent distinguishing evidence, all ranks in my reference class are equivalent. Log-prior would privilege earlier ranks without justification. The shift *is* modest precisely because the reference class is large (all humans), not small (humans born Tuesday)." | "But doesn't 'no distinguishing evidence' also justify indifference over *scales* (like log-rank), not just linear order?" | **Hold**: Linear order is privileged by causal structure. |
  | 7 | Statistician (iv) | "Calling reference class choice a 'parameter-setting problem' hides the arbitrariness. Two people with identical evidence but different granularity in defining 'subjectively indistinguishable' will get different Doomsday conclusions. That's not parameter setting—that's subjective fiat." | High (Practical concern) | 4 (Shows framework fragility) | "Maximal specificity minimizes arbitrariness. If Alice uses a coarse class (all humans) and Bob a fine one (humans with exact neural state S), Bob's estimate has higher variance but same expectation in large populations. Disagreement reflects genuine uncertainty about class boundaries, not SSA's failure." | "In small populations (e.g., post-human uploads), granularity *does* change expectations. Who's right?" | **Concede**: Boundary cases exist. **Hold**: Maximal specificity is still the least arbitrary default. |

  ---

  **Critical Supplements**

  **(a) The Objection You Hope Nobody Raises:**  
  *"Your 'maximally specific reference class' makes every observer-moment unique. Then SSA gives a uniform prior over *all possible subjectively distinct observer-moments*. But that's even worse than SIA—it assigns vanishing credence to any universe not containing *precisely your current experience*, making cosmology impossible. And it collapses to solipsism."*  
  **Why it's dangerous:** It suggests your view implies radical skepticism or undermines its own applicability.  
  **Best (Partial) Answer:** "Maximal specificity is *conditioned on physical theory*. My evidence includes 'I am a human observer in a low-entropy universe with CMBR etc.'—not just raw qualia. The reference class is constrained by physical possibility: observer-moments *compatible with my evidence and the laws*. This avoids solipsism while excluding physically impossible 'observers'."

  **(b) Concessions to Volunteer Early:**  
  1. "SSA's reference class *is* context-dependent and requires judgment about what counts as 'subjectively indistinguishable' given physics. It's not mechanically objective."  
  2. "SSA alone doesn't solve the measure problem or Boltzmann brains. It operates *within* a cosmological model."  
  3. "Doomsday shifts *are* sensitive to priors over total observer count—SSA just makes these priors explicit and modifiable by evidence."

  **(c) The Reply That Must Land:**  
  **Against the Decision Theorist (Rank 2):** Your defense against Dutch booking is essential. If the audience believes your view is diachronically inconsistent or exploitable, the entire normative project fails. Hammer: "Indexical priors are always *model-relative*. Before learning the multiverse structure, I don't have a prior over 'universes simpliciter'—I have a prior over *theories* specifying observer distributions. SSA applies *within each theory*. Updating when learning which universe I'm in is just Bayesian narrowing of possibilities—no conflict."
