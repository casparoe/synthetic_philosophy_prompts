prompt: |-
  I'm drafting a paper for my normative ethics seminar on supererogation, and the more cases I collect, the less sure I am that my verdicts describe one category. Here they are, roughly in order of my confidence. Donating a kidney to a stranger: beyond duty, and highly praiseworthy. A parent who takes a second job so her children can have a tutor instead of going without: her duty, and I don't think she earns any special credit for it. A graduate student who volunteers one shift at a food bank: supererogatory — but once she has signed up for a second shift and the coordinator has built the schedule around her, skipping it strikes me as wrong and blameworthy, so apparently a duty-free act can manufacture a duty. A billionaire who gives away forty percent of her fortune: obligatory rather than supererogatory, even though it costs her vastly more in absolute terms than the kidney does the donor. Volunteering an hour at a museum one loves anyway: still beyond duty, but I don't think it earns any praise — which suggests that "beyond the call of duty" and "meritorious" come apart, though my seminar's readings treat them as one thing. And a man who takes the blame for a colleague's error to save the colleague's job, having caused none of it: supererogatory, yet if he declines I want to say he is not merely neutral but somehow diminished, while conceding he is not blameworthy.

  Is there a principle, or a small set of candidates, that delivers these verdicts? Please state each precisely, indicate which case motivates each of its clauses, and say what it rules for a case I haven't raised: whether forbearing to collect a debt you are entirely entitled to collect is supererogatory, or merely permissible. Then be honest about which of my verdicts it cannot keep, and if two have to go, tell me which one you'd drop and why. Please write in American English.
reasoning: |-
  Hmm, the user is working on a normative ethics paper about supererogation and has collected several cases that are making them question whether supererogation is a unified category. They've listed several scenarios with their intuitive judgments and need help identifying principles that could explain these verdicts.

  Looking at their cases: kidney donation seems clearly supererogatory and praiseworthy; a parent taking a second job feels obligatory without special credit; volunteering at a food bank becomes obligatory after commitment; billionaire giving away 40% seems obligatory despite high cost; volunteering at a loved museum is beyond duty but not praiseworthy; taking blame for a colleague is supererogatory but declining makes one feel "diminished."

  The user wants principles that explain these judgments, applied to a new case about debt forbearance, and wants to know which of their intuitions might need revision. Key tensions appear between cost/benefit, special relationships, voluntary commitments, and praiseworthiness.

  For potential principles, I'm considering a hybrid approach. The Commitment Principle explains the food bank case: voluntary commitments create duties. The Proportional Sacrifice Principle handles the billionaire case: obligations scale with capacity. The Relationships Principle accounts for parental duties. The Praiseworthiness Principle separates "beyond duty" from merit, explaining the museum case. The Moral Residue Principle explains why declining supererogatory acts can leave one "diminished" without blame.

  Applying these to the debt case: forbearing collection is supererogatory unless the debtor is in dire straits (triggering Proportional Sacrifice) or if there was a prior commitment. When testing against their judgments, the billionaire case conflicts with pure supererogation frameworks but fits with proportional sacrifice. The museum case challenges the praiseworthiness link but can be resolved by separating the concepts.

  If forced to drop two verdicts, I'd suggest reconsidering the museum volunteer as merely permissible (not beyond duty) since no real sacrifice is made, and refining the "diminished" feeling in the colleague case as emotional rather than moral. This preserves the core supererogatory structure while acknowledging complexity in praiseworthiness and moral residue.

  The user seems to be grappling with how relational duties, commitments, and capacity can transform apparently optional acts into obligations, which suggests supererogation isn't just about individual acts but exists within a web of moral contexts.
answer: |-
  Based on your cases and intuitive verdicts, a single principle is unlikely to capture everything. Instead, a set of interconnected principles seems necessary. Here are four candidates, stated precisely, motivated by your cases, with rulings on the debt case and an honest assessment of conflicts:

  **Proposed Principles:**

  1.  **The Relationships Principle:** Duties arising from specific roles or relationships (e.g., parent, child, spouse, citizen, promisor) can demand significant sacrifice and preclude special merit for fulfilling them, even when the sacrifice is substantial. *Motivation:* Parent taking a second job. This is a core parental duty, not supererogatory, despite the sacrifice. *Debt Ruling:* Forbearing to collect a debt you are entitled to is **supererogatory**. The creditor-debtor relationship creates a *prima facie* duty to repay; forbearance goes beyond that duty. (Unless the debtor's need triggers Principle 2).

  2.  **The Proportional Sacrifice Principle:** An act that produces significant good for others can become obligatory rather than supererogatory if the cost to the agent (in terms of sacrifice, resources, or forgone opportunities) is *proportionally small* relative to their total capacity to bear such costs, and the benefit is *proportionally large* for the recipients. *Motivation:* Billionaire giving 40%. Absolute cost is huge, but proportional capacity is high, and the potential good is immense. Skipping the shift after commitment (in Food Bank Case 2) also fits: the cost of keeping the commitment is low relative to the disruption caused by breaking it. *Debt Ruling:* Forbearing to collect a debt is **merely permissible** (not supererogatory) *if* the debtor is in dire poverty and the creditor is extremely wealthy (making the proportional sacrifice small for the creditor and the benefit large for the debtor). Otherwise, it's supererogatory (as per Principle 1).

  3.  **The Commitment/Reliance Principle:** A voluntary act initially beyond duty can generate a new, specific duty if others reasonably rely on the performance of that act and would be harmed by its non-performance. *Motivation:* Food Bank Case 2. The initial sign-up is supererogatory; the *second* sign-up, once the schedule relies on it, creates a duty. *Debt Ruling:* Irrelevant to the basic act of forbearance. However, if you *promised* not to collect or led the debtor to rely on forbearance, skipping collection might become obligatory.

  4.  **The Separation of "Beyond Duty" and "Praiseworthy" Principle:** An act can be beyond strict duty ("optional") without being praiseworthy. Praiseworthiness requires that the act involves some level of *non-trivial sacrifice* or *effort* undertaken *primarily for moral reasons*, not merely because it coincides with self-interest. *Motivation:* Museum volunteering. It's beyond duty but lacks praiseworthiness due to self-interest and trivial/no sacrifice. Kidney donation is supererogatory *and* highly praiseworthy due to significant sacrifice for moral reasons. *Debt Ruling:* Forbearing a debt is **beyond duty**. Whether it's **praiseworthy** depends on the creditor's motivation (genuine concern vs. indifference) and the level of sacrifice involved (forbearing a small debt vs. a life-changing sum).

  **Applying Principles to Your Cases:**

  *   **Kidney Donation:** Beyond duty (Principles 1, 4), Highly Praiseworthy (Principle 4 - significant sacrifice for moral reasons).
  *   **Parent's Second Job:** Duty (Principle 1 - parental role), Not Specially Meritorious (Principle 1 - core duty).
  *   **Food Bank Shift 1:** Supererogatory (Principles 2, 3 - initial act, low proportional cost/high benefit? Context dependent).
  *   **Food Bank Shift 2:** Duty (Principle 3 - reliance created), Blameworthy to skip (Principle 3).
  *   **Billionaire's 40%:** Obligatory (Principle 2 - proportional sacrifice small relative to capacity, benefit large).
  *   **Museum Volunteering:** Beyond Duty (Principle 4), Not Praiseworthy (Principle 4 - self-interest, trivial/no sacrifice).
  *   **Taking Blame for Colleague:** Supererogatory (Principles 1, 2 - not a role duty, significant sacrifice), Agent "Diminished" if declines (See Honesty below). Not Blameworthy (Agreed).

  **Honest Assessment of Conflicts & Suggested Revisions:**

  1.  **The Biggest Conflict: Billionaire vs. Pure Supererogation Frameworks.** Your verdict that the billionaire's donation is *obligatory* clashes with standard definitions equating supererogation with *optional* goodness. Principle 2 (Proportional Sacrifice) *explains* this verdict but requires accepting that supererogation isn't defined solely by high absolute cost – high relative capacity can make significant giving obligatory. **This verdict must stay if Principle 2 holds.** If you insist supererogation *must* be optional regardless of capacity, you must drop the billionaire verdict. I wouldn't; Principle 2 is compelling and aligns with many intuitions about fairness and capacity.

  2.  **Praiseworthiness Separation: Museum Case.** Principle 4 directly challenges the seminar's conflation of "beyond duty" and "meritorious." Your museum case strongly motivates this separation. **This verdict stands firmly with Principle 4.** To drop it would be to ignore a clear counterexample to the conflation.

  3.  **The "Diminished" Feeling (Colleague Case):** This is tricky. Principles 1-4 explain why taking the blame is supererogatory and not blameworthy to decline. However, the feeling that the agent is "diminished" suggests a **Moral Residue Principle**: Some supererogatory acts are so indicative of an exemplary character that *not* performing them, while not wrong, reveals a comparative lack of that excellence, making the agent seem "lesser" in moral stature. This isn't captured by Principles 1-4. It's a distinct intuition about virtue and character assessment, not strictly about the act's deontic status (duty/supererogation). **This verdict can be partially preserved** by acknowledging this moral residue/virtue aspect, but it goes beyond standard supererogation theory focused on acts.

  **If Two Verdicts *Must* Go:**

  Based on the need for theoretical coherence and the strength of the principles:

  1.  **Drop the "Diminished" verdict in the Colleague Case as a core part of *supererogation* theory.** Concede that declining is permissible and not blameworthy, but acknowledge the "diminished" feeling relates more to character assessment (virtue ethics) than the deontic category of the act itself. It's a peripheral intuition to the core concept.
  2.  **Drop the Museum verdict that it's "beyond duty."** Reclassify it as merely permissible self-interested activity with no moral valence (neither duty nor supererogation). While Principle 4 offers a better explanation (separating categories), if maintaining the link between "beyond duty" and "has positive moral worth (even if not praiseworthy)" is essential, this is the verdict to sacrifice. However, this feels like ignoring the intuition that doing *something* good, even easily, is still "more than nothing" required.

  **Why I'd Drop These Two:** The billionaire verdict is crucial for highlighting how capacity affects obligation and challenges simplistic cost-based supererogation. The core parental duty verdict is foundational. The food bank cases illustrate the dynamic nature of obligation via commitment. The kidney donation is a paradigm case. The museum case *challenges* the conflation, but if forced, reclassifying it as merely permissible is less damaging to the core structure than rejecting proportional obligation (billionaire) or core role duties (parent). The "diminished" feeling, while real, is more about character than the act's optionality and is the least central to defining supererogation itself.

  The debt case highlights how these principles interact: generally supererogatory (Principle 1), potentially obligatory under extreme need/wealth (Principle 2), praiseworthy only if motivated altruistically and involving real sacrifice (Principle 4). Your cases reveal supererogation as a complex interplay of relationships, capacity, commitment, sacrifice, and motivation, not a single, simple category defined solely by "costly optional good." Good luck with your paper!
