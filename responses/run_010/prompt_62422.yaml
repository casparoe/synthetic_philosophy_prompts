  The key constraints are tricky: the coordination situation must remain identical, common knowledge intact, no rationality assumptions violated. The flip must come purely from preference changes within Lewis's framework. This seems designed to test whether Lewis can handle norm internalization.

  For the setting... a harbor crew feels perfect. Real, contained, with clear coordination problems. The "dory approach" convention works well - simple but vital for safety. The historical event about the capsized boat adds the needed moral weight without altering practical utility. 

  Now for Lewis's definition. In phase one, all clauses hold: mutual expectations, preference for conformity, alternatives exist. In phase two, clause (4) fails because conformity preference is no longer conditional on others' behavior - people now prefer R even if others switch. The utility matrix changes despite identical practical outcomes due to added moral disutility.

  The generalization question is important. Lewis's analysis does imply that moralized practices can't be conventions, which might be defensible but strains ordinary usage. The threshold issue is messy too - if only some members moralize R, the "almost all" quantification becomes crucial but arbitrary.

  The reply about distinguishing convention-core from normative wrapping seems weak - it saves the letter of the definition but loses explanatory power. Genealogical accounts like Sugden's would handle this better, but sacrifice Lewis's elegant synchronic structure.

  User seems highly knowledgeable - probably a grad student or young professor running an advanced seminar. The specificity suggests they've already considered standard counterexamples and want something watertight. They're likely sympathetic to Lewis but pushing his limits. The "no sci-fi" demand shows impatience with contrived philosophy cases.

  Better ensure every specification is hit: harbor crew paragraph is tight, no practical change after the memorial, common knowledge preserved. Verdict explanation must meticulously track each clause. Should emphasize that the moral disutility makes R uniquely best regardless of others' actions - that's the linchpin.
answer: |-
  Here is a thought experiment satisfying your specifications, followed by the analysis:

  **The Case: The Dockside Linesmen**

  **Setting:** The small, close-knit crew of linesmen at Port Haven work the daily arrival of the coastal freighter *Sea Sprite*. Their critical task is securing the ship quickly and safely using the four heavy mooring lines (fore/aft, port/starboard). The harbor layout is symmetrical, and the ship presents identical bollards port and starboard. The crew has a long-standing practice (**R**): the starboard lines are always secured *before* the port lines. Everyone knows an equally viable alternative (**R***) exists: securing port lines before starboard. Both sequences achieve the same speed and safety, as the tasks are independent and symmetric. Coordination is vital to avoid tangles, delays, or uneven strain on the ship. Each member prefers conformity because it ensures smooth, predictable work. They expect everyone else to follow **R**, and the practice is stable.

  **Phase One:** The crew follows **R**. It works. **R*** is known but unused. Deviations are rare and corrected with a simple "Hey, starboard first!" – a coordination prompt, not a rebuke. No one feels shame for almost using **R***; they just adjust. The practical situation is symmetric.

  **The Event:** During a fierce storm 15 years ago, a junior linesman, overwhelmed by the chaos, hesitated and instinctively started securing a port line first (**R***) while others followed **R**. In the confusion of wind and waves, this momentary miscoordination contributed to a dangerous slack in a starboard line. While disaster was narrowly averted, a respected senior crew member, Old Tom, was badly injured lunging to secure it. The story of Tom's sacrifice "because young Davy forgot the proper way" became foundational lore, recounted annually at the crew's dinner. Tom recovered but retired, his injury a permanent reminder. The harbor layout, ship, and task remain unchanged; **R** and **R*** are still practically equivalent.

  **Phase Two:** The crew still follows **R** religiously. **R*** remains known and practically equivalent. However, anyone even *appearing* to reach for a port line first is met with immediate scowls, sharp verbal rebukes ("Have you forgotten Tom?"), and social coldness. Members feel a visceral sense of guilt or shame at the *thought* of using **R***, even privately or hypothetically. They expect this reactive attitude from others. The regularity is as stable as ever, but conformity is now driven by a mix of coordination *and* a sense of moral obligation/avoiding social censure tied to the shared story and Tom's sacrifice. The practical utility of **R** vs. **R*** is unchanged.

  **Lewis's Analysis (Lewis, *Convention*, Ch. I.3, p. 78):**
  A regularity R in the behavior of members of a population P when they are agents in a recurrent situation S is a *convention* if and only if it is true that, and it is common knowledge in P that, in almost any instance of S among members of P,
  (1) almost everyone conforms to R;
  (2) almost everyone expects almost everyone else to conform to R;
  (3) almost everyone has approximately the same preferences regarding all possible combinations of actions;
  (4) almost everyone prefers that *any one more* conform to R, on condition that *almost everyone* conform to R;
  (5) almost everyone would prefer that *any one more* conform to R*, on condition that *almost everyone* conform to R*,
  where R* is some possible regularity in the behavior of members of P in S, such that almost no one in almost any instance of S among members of P could conform both to R* and to R.

  **Verdicts Clause by Clause:**

  1.  **Phase One Verdict (Convention):**
      *   (1) Holds: Almost everyone conforms to **R**.
      *   (2) Holds: Almost everyone expects almost everyone else to conform to **R**.
      *   (3) Holds: Almost everyone has the same preferences: smooth coordination (achieved equally by **R** or **R*** if all switch).
      *   (4) Holds: Almost everyone prefers that any one more conform to **R**, *conditional on almost everyone else conforming to **R***. (Deviating while others conform causes miscoordination/disutility).
      *   (5) Holds: Almost everyone prefers that any one more conform to **R***, *conditional on almost everyone else conforming to **R***. (If everyone switched to **R***, coordination would be just as good).
      *   **Result: R is a convention.**

  2.  **Phase Two Verdict (Not Convention):**
      *   (1) Holds: Almost everyone *still* conforms to **R**.
      *   (2) Holds: Almost everyone *still* expects almost everyone else to conform to **R**.
      *   (3) Holds: Almost everyone *still* has the same fundamental preference for smooth coordination, *but now also* strong preferences regarding the moral/social valence of **R** vs **R***.
      *   (4) Holds: Almost everyone prefers that any one more conform to **R**, *conditional on almost everyone else conforming to **R***. (A deviant would still cause practical miscoordination *and* now also social/moral outrage).
      *   **(5) FAILS:** Almost everyone does *NOT* prefer that any one more conform to **R***, even *conditional on almost everyone else conforming to **R***.
          *   **Why it fails (despite unchanged practical utility):** The moral/social force attached to **R** (and *against* **R***) changes the preference structure. Members now experience intrinsic disutility (guilt, shame) from performing **R*** themselves, *and* extrinsic disutility (resentment, blame) from *others* performing **R***. Crucially, **even if everyone else switched to R***, a member would *still* prefer *not* to switch themselves to **R***. Switching would feel like betraying Tom's memory, violating a sacred rule, and inviting self-reproach. They would also resent *others* for switching. Performing **R*** is now intrinsically *worse* than performing **R**, regardless of what others do. The conditional preference required by (5) – "If everyone switched to R*, I would prefer that one more (including myself) switch too" – does not hold. They would prefer *no one* switched to **R***, including that "one more" person (or themselves). The practical coordination utility of **R*** is outweighed by the new moral/social disutility. The *condition* of clause (5) (almost everyone conforming to R*) does not generate the required preference for universal conformity to R* because conformity to R* now carries inherent negative value.

  **Generalization:**
  Yes, the case generalizes. Lewis's analysis *implies* that if a practice acquires sufficient moral/social force such that members intrinsically disprefer the alternative *even conditional on universal conformity to that alternative* (i.e., clause (5) fails), then it ceases to be a convention by his definition. This is a **cost** Lewis might be willing to absorb, arguing his analysis precisely captures a *coordination equilibrium* based on conditional preferences, distinct from a norm backed by intrinsic valuation or sanctions. However, it **undermines the claim to be analyzing our ordinary concept** of convention, as ordinary language often calls deeply entrenched, morally charged practices (like driving on the right, specific forms of greeting, or certain procedural rules in institutions) "conventions," even when they have acquired normative force. Lewis's definition becomes overly restrictive concerning the *motivational basis* of conformity.

  **The Threshold Question:**
  The analysis quantifies over "almost everyone." If **only a minority** moralizes **R** while the majority still conform solely for coordinative reasons (retaining the conditional preference for **R*** in the scenario of universal switch), **clause (5) likely still holds**. "Almost everyone" would still prefer universal **R*** over universal **R** *if* the minority's intrinsic aversion to **R*** isn't strong enough to outweigh the majority's conditional preference for coordination via **R***. The **line falls** when the proportion moralizing **R** (and thus losing the conditional preference for **R***) becomes large enough that "almost everyone" no longer satisfies clause (5). **This line is arbitrary** within the vagueness of "almost." Lewis provides no principled way to determine *how much* moralization among *how many* members is needed to tip clause (5). This vagueness is inherent in the "almost" qualification.

  **Strongest Lewisian Reply:**
  A Lewisian could insist that **the core coordination convention remains intact**, wrapped in an **additional layer of social/moral norms**. They could argue that the *convention* proper is still defined by the underlying coordination problem and the conditional preferences regarding *that problem*. The resentment, guilt, and blame are reactions to violating the *norm* enforcing the convention, not part of the convention's definition itself. They might offer a **restricted reading of "preferences"** in clauses (4) and (5), limiting them to preferences concerning *only the original coordination payoffs* (speed, safety), excluding the added moral/social payoffs.

  *   **Cost of this Reply:** It becomes **descriptively inadequate** and **explanatorily weak**. It fails to capture why the practice persists *even in hypothetical scenarios where the coordination problem vanishes* (e.g., if the task changed but the rule remained symbolically important). It ignores that the *motivation* for conformity has fundamentally shifted for many members; they conform *because* it's the right/proper/loyal thing to do, not (or not primarily) to solve coordination. It severs the analysis from the lived experience of the participants, for whom **R** is no longer *just* a coordination device. It makes Lewis's analysis less useful for understanding social reality where conventions often *do* acquire normative force without changing their practical function.

  **Genealogical/Normative Expectations Account:**
  An account focused on **genealogy** (e.g., Sugden, Binmore) or the **presence of normative expectations and sanctions** (e.g., Bicchieri, Brennan et al.) would describe **R** in Phase One as a mere *convention* or *custom* arising from successful coordination. In Phase Two, they would describe it as a *social norm*: the regularity persists, but crucially, members hold *normative expectations* (beliefs that others *should* conform and have a *right* to demand conformity) and are motivated by a mix of coordination, fear of sanctions, and potentially internalized normativity. The shift is explained by the historical event creating a shared normative belief and the emergence of enforcement. **What such an account gives up** is Lewis's elegant, precise synchronic definition grounded purely in common knowledge and conditional preferences within a game-theoretic framework. It embraces a more complex, dynamic, and potentially less formally tractable picture of social rules, incorporating history, psychology, and the distinct logic of norm enforcement alongside coordination.
