answer: |-
  ### (a) Restatement in Probabilistic Modeling Vocabulary  
  **Definitions:**  
  - **Ontic state (λ):** A latent variable in your model. Each instance of λ corresponds to a possible state of the system, but λ is not directly observable.  
  - **Preparation:** Fixes a conditional prior distribution over λ, denoted \( p(\lambda | \psi) \), where \(\psi\) is the wavefunction (here, \(\psi\) is an *input parameter* indexing the preparation process).  
  - **Measurement:** A stochastic decoder mapping \(\lambda\) to an outcome distribution, \( p(\text{outcome} | \lambda) \). The decoder is fixed by the measurement apparatus.  
  - **ψ-ontic:** The prior distributions \( p(\lambda | \psi) \) for distinct pure \(\psi\) have *disjoint support*. Equivalently, \(\lambda\) uniquely identifies \(\psi\)—i.e., the latent is injective with respect to the preparation parameter.  
  - **ψ-epistemic:** There exist distinct \(\psi_1, \psi_2\) such that \( p(\lambda | \psi_1) \) and \( p(\lambda | \psi_2) \) have *overlapping support*. Equivalently, \(\lambda\) is non-identifiable from \(\psi\) in the sense that some \(\lambda\) values are compatible with multiple \(\psi\).  
  - **Preparation independence:** If two systems are prepared independently with parameters \(\psi_A\) and \(\psi_B\), their joint prior factorizes: \( p(\lambda_A, \lambda_B | \psi_A, \psi_B) = p(\lambda_A | \psi_A) p(\lambda_B | \psi_B) \).  

  **PBR Theorem:**  
  Under preparation independence, no \(\psi\)-epistemic model can reproduce all quantum predictions. Specifically, if priors for distinct \(\psi\) overlap, there exist measurements violating quantum statistics. This is an *identifiability result*: Disjoint supports (ψ-ontic) are forced by the factorization assumption.  

  **ψ-Epistemic Escape Routes:**  
  - **Violate preparation independence:** Allow correlations in the joint prior \( p(\lambda_A, \lambda_B | \psi_A, \psi_B) \) even for independent preparations (e.g., \(\lambda_A\) and \(\lambda_B\) not independent).  
  - **Restrict the quantum fragment:** Spekkens' toy theory assumes epistemic \(\psi\) but only reproduces a subset of quantum statistics (e.g., no Bell violations).  
  - **Preparation contextuality:** The prior \( p(\lambda | \psi) \) depends on *how* \(\psi\) is prepared, not just \(\psi\) itself.  

  **Structural Matches:**  
  - **Support of \( p(\lambda | \psi) \):** Directly corresponds to the support of your latent-variable prior. Overlap → non-identifiability; disjointness → identifiability.  
  - **Decoder:** Directly corresponds to your observation model \( p(\text{outcome} | \lambda) \).  
  - **Ontic state as "state of the world":** In quantum foundations, \(\lambda\) is posited as physical reality. In your work, \(\lambda\) is a model-*internal* construct. The match holds mathematically but fails metaphysically: Your \(\lambda\) need not reference "reality," while ψ-ontology assumes it does.  

  ---

  ### (b) Evaluation of Your Tentative Gloss  
  **"ψ-ontic equals identifiable" is partially correct but misleading:**  
  - **Correct aspect:** ψ-ontic implies \(\lambda\) is identifiable *from \(\psi\)* in the sense that \(\psi\) uniquely determines the support of \( p(\lambda | \psi) \). If you knew \(\lambda\), you could pinpoint \(\psi\) (disjoint supports).  
  - **Misleading aspect:** Identifiability in your field typically concerns recovering *parameters from observed data*, but here:  
    - \(\psi\) is an *input* (preparation parameter), not a parameter to estimate from outputs.  
    - The non-identifiability in ψ-epistemic models is between \(\psi\) and \(\lambda\)—not between \(\lambda\) and observed *outcomes*.  
    Overlap means multiple \(\psi\) can generate the same \(\lambda\), but this says nothing about whether \(\psi\) can be inferred from measurements.  

  **Valence difference is substantive:**  
  - In your work, non-identifiability (e.g., unidentifiable latents) is a *practical flaw* to fix via additional constraints (e.g., auxiliary variables).  
  - In ψ-epistemic models, overlap is *desirable* for interpretational reasons (viewing \(\psi\) as "knowledge"). This is not just valence: It stems from the ambition to reinterpret quantum mechanics (QM) classically. The cost—violating preparation independence or restricting QM—is seen as acceptable for this goal.  

  **Verdict:** Your gloss captures the mathematical structure but conflates the direction of inference (\(\psi\) → \(\lambda\) vs. data → parameters) and misses the interpretive stakes.  

  ---

  ### (c) Residue Report  
  **Clean Carryover (direct analogs):**  
  - **Support overlap/non-identifiability:** Overlap of \( p(\lambda | \psi) \) for distinct \(\psi\) ≡ non-identifiable mapping from \(\psi\) to \(\lambda\).  
  - **Preparation independence ≡ Factorized prior:** For independently prepared systems, \( p(\lambda_A, \lambda_B | \psi_A, \psi_B) = p(\lambda_A | \psi_A) p(\lambda_B | \psi_B) \) matches assuming independent latents for independent data points.  
  - **Decoder ≡ Observation model:** \( p(\text{outcome} | \lambda) \) is identical in both frameworks.  

  **Carryover with Distortion:**  
  - **Preparation independence:** In QM, it assumes *physical separability*—systems have no hidden correlations—which is a claim about reality. In your work, factorized priors are a *modeling choice* for computational convenience. The math matches, but the foundational commitment differs.  
  - **"Knowledge" in ψ-epistemic:** In QM, "knowledge" refers to the epistemic state of an agent who prepares \(\psi\). Overlap means \(\psi\) encodes ignorance about \(\lambda\). In your work, non-identifiable \(\lambda\) encodes *no one's knowledge*; it is a statistical ambiguity with no cognitive agent implied. The distortion arises because ψ-epistemic models import classical Bayesian epistemology.  

  **No Counterpart:**  
  - **Pure states as fundamental:** In QM, pure states (wavefunctions) are irreducible and ontologically distinct; in your models, parameters lack this status.  
  - **Measurement contextuality:** QM requires that \( p(\text{outcome} | \lambda) \) must depend *only* on \(\lambda\), not on other measurements being performed—a physical noncontextuality assumption with no direct analog in latent variable models.  
  - **Exact reproduction of QM:** ψ-epistemic models must reproduce *all* quantum statistics (e.g., superposition, entanglement), which is not required in typical probabilistic modeling.  

  ---

  ### (d) Judgment: The Residue Reveals a Narrower Point  
  Your vocabulary is *not* missing a crucial distinction, nor is the ψ-ontology debate merely "non-identifiability plus metaphysics." Instead, **the translation exposes a specific no-go result for classical reinterpretations of QM, using identifiability arguments under a physical independence assumption.**  

  - **Why it's not just metaphysics:** The PBR theorem is a technical result about when overlap in \( p(\lambda | \psi) \) contradicts quantum predictions—conditional on preparation independence. This is analogous to how your identifiability results (e.g., in VAEs) depend on assumptions like factorized priors.  
  - **Why the residue is narrow:** The core structure—non-identifiability vs. disjoint supports under independence—is identical. The differences arise from:  
    1. **QM's empirical constraints:** ψ-epistemic models must replicate quantum statistics exactly, while your models approximate data.  
    2. **Physicality of preparation independence:** In QM, it asserts no hidden correlations between spatially separated systems; in modeling, factorization is statistical.  
  - **Defense:** The debate is elevated not because of "metaphysics" per se, but because ψ-epistemic models aim for a *classical hidden-variable theory* of QM. The PBR theorem shows this requires violating preparation independence—a physical, not just statistical, assumption. Your vocabulary captures the identifiability conflict but not the *physicality* of the independence assumption or the *universality* of QM reproduction.  

  **Conclusion:** The ψ-ontology debate is a constrained case of non-identifiability in latent variable models, where the constraints (exact QM statistics + physical independence) force ψ-ontic models. The residue is real but small: It stems from QM's unique empirical success and the interpretation of \(\lambda\) as physical, not from a gap in your framework. Your tools are sufficient to analyze the mathematical conflict, but the physical commitments of QM prevent full reduction to a "mere" non-identifiability problem.
