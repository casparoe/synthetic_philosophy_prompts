  Write me a short story about pain asymbolia — the condition where people apparently still feel the pain (they can say where it is and roughly how intense) but just aren't bothered by it, and some even grin or laugh when pricked. Here's the conceit I want: it's a reversible drug, and my protagonist takes it on shift as a saturation diver, because it's the kind of work where flinching kills people. Let the worldbuilding carry the philosophy — since she cant be trusted to yank her hand off a hot manifold, her suit logs every nociceptive event and she reads the log each night like a report card on somebody else's body, and reading it doesn't feel like anything. I want the story to actually land somewhere on the question of whether her pain is still bad for her once the suffering has been switched off, or whether the badness just was the suffering. And have her lose something she didn't expect — not the obvious stuff, not the scalded hand. First person, 1200 words ish.
