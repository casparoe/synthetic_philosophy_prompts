answer: |-
  ## ConsensusTrack™: Structured Group Decision Management

  Welcome to ConsensusTrack™, the only judgment aggregation platform that mathematically guarantees your committee's outputs are *coherently unjustifiable*. Our patented aggregation engine rigorously applies your chosen procedure, exposing logical contradictions inherent to group reasoning before you finalize any verdict. Because sometimes, knowing why your decision is impossible is the next best thing to making sense.  

  **Frequently Asked Questions**

  1.  **Why did Premise-Based Voting and Conclusion-Based Voting give opposite results?**  
      Premise-Based Voting aggregates votes on each premise independently. Conclusion-Based Voting aggregates votes on the final outcome only. These methods are logically distinct and can conflict. This is expected behavior, reflecting the discursive dilemma inherent in multi-premise decisions.

  2.  **A voter affirmed all premises but rejected the conclusion. Is this valid?**  
      Yes. Individual voters are not required to be logically consistent. ConsensusTrack™ only enforces consistency requirements at the group level *after* aggregation, based on your selected procedure.

  3.  **We see "Inconsistency Alert: Majority Premises / Unanimous Rejection". What happened?**  
      This indicates a majority affirmed every individual premise required for the conclusion, yet *every* member voted against the conclusion itself. Here are the ballots from the Superior Court of Midvale Ethics Panel (Case #ET-2024-117):
      ```
      Voter A: Premise 1: Y, Premise 2: Y, Conclusion: N
      Voter B: Premise 1: Y, Premise 2: N, Conclusion: N
      Voter C: Premise 1: N, Premise 2: Y, Conclusion: N
      ```
      Aggregation: Maj(P1)=Y, Maj(P2)=Y, Maj(Conclusion)=N. The group asserts all premises but unanimously denies the inevitable result.

  4.  **Can the group really assert something no individual believes?**  
      Yes. Under Premise-Based Voting, the group conclusion is derived from the aggregated premises. It is possible for the derived group conclusion to be one that *no single member* voted for, if individual premise votes combine in that way. This is a feature of collective rationality.

  5.  **Why does Unanimity avoid all consistency errors?**  
      Unanimous votes on all premises and the conclusion inherently satisfy any logical constraint. ConsensusTrack™ only performs consistency checks when votes diverge. Unanimity bypasses aggregation complexity entirely.

  6.  **How is this different from a Condorcet Paradox (voting cycles)?**  
      Condorcet cycles involve inconsistencies in *ranking* preferences (A>B, B>C, C>A). ConsensusTrack™ handles inconsistencies in *logical judgment* on interconnected propositions (P, Q, therefore R), even with only two options (Yes/No) per item. They are distinct impossibility results.

  7.  **Can I choose the aggregation procedure *after* seeing the votes?**  
      The Standard Tier locks your procedure choice *before* voting begins to ensure audit integrity. Our Professional Tier ($499/month) offers "Procedural Flexibility Mode," allowing the Chair to select Premise-Based *or* Conclusion-Based aggregation post-voting, depending on which yields the more institutionally palatable inconsistency.

  8.  **Support Ticket #CT-6672: "Group asserted Premise 3, but every member denied it!"**  
      *Customer Query:* "Premise-Based Voting result: Group asserts Premise 3 (Y). But reviewing ballots: Voter A: N, Voter B: N, Voter C: N. How is this possible? - J. Arbuckle, Regional Hospital Board"  
      *ConsensusTrack™ Response:* Confirmed. Your ballots show a tie (1Y, 2N) on Premise 3. Your committee rules specify the Chair breaks ties. The Chair voted Y, making the group assertion Y. The group asserts what the Chair decreed, contrary to all members.

  9.  **Why do we sometimes get "No Consistent Aggregation Possible" even with both procedures?**  
      This indicates the individual ballots form an inconsistent set that *no* neutral aggregation procedure can resolve into fully consistent group judgments without either dropping a premise or overriding a vote. This is a fundamental impossibility result.

  **Known Issues**

  *   **CT-IMPOSSIBILITY:** Under specific distributions of logically inconsistent individual judgments, no aggregation procedure satisfying basic fairness conditions (Anonymity, Neutrality, Systematicity) can *always* produce fully consistent group judgments. **Status:** Non-resolvable. Fundamental limitation of multi-premise group decision-making. No planned resolution. See List & Pettit (2002). Workarounds: Use Unanimity (FAQ 5) or enable Dictatorship Mode (Enterprise Tier).

  **Pricing Tiers**

  *   **Starter ($99/mo):** Premise-Based OR Conclusion-Based Voting (pre-selected). Basic inconsistency alerts. Max 5 voters.
  *   **Professional ($499/mo):** Choice of Premise/Conclusion-Based pre-*or* post-vote (Chair override). Detailed inconsistency reports. Tie-breaking modules. Max 25 voters.
  *   **Enterprise ($1999/mo):** Includes "Dictatorship Module" (assign one voter as Logical Infallible; their ballot defines group judgment). Guaranteed consistency. Unlimited voters. Audit trail suppression available. *Finally, coherence you can count on.*
