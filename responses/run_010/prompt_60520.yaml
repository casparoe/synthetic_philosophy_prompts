prompt: |-
  I have spent a year trying to write the framing chapter for an interdisciplinary volume on moral revolutions, and what has stopped me is not the history but the logic of the disagreement. The chapter has to explain why three competing accounts of how practices like the Atlantic slave trade and dueling came to an end have failed to converge, and I no longer believe they are competing in any clean sense.

  The first account is the interest-based one. In Capitalism and Slavery (1944) Eric Williams argued that British abolition of the slave trade in 1807 and of slavery in 1833 tracked the declining value of the West Indian sugar complex to British accumulation, and that the humanitarian story favored by the imperial historians he attacked was self-congratulatory ideology. Seymour Drescher's Econocide (1977) replied that on the eve of 1807 the British trade was expanding and profitable, that abolition ran against the material interest of the dominant classes, and that it was forced by extra-parliamentary mass petitioning. Note the awkward consequence: the most effective empirical attack on the interest explanation is routinely read as a vindication of the causal power of public moral opinion, so the historiography does not line up with the philosophical dispute that borrowed from it.

  The second account holds that the practice ended because the reasons against it were sound and came to be widely enough apprehended; the abolitionists were right, and their being right did causal work.

  The third is the honor account in Appiah's The Honor Code (2010), built on dueling among British gentlemen, footbinding in China, and the slave trade: a practice collapses quickly once the surrounding code is rewritten so that continuing it marks one as shameful or absurd rather than as a gentleman, with moral argument mattering chiefly as an instrument of that reclassification.

  The stall has a specific texture. All three draw on the same cases, and each can absorb the others' evidence. Interest explains why a status shift was affordable; honor explains why arguments bite only when they reach the audience whose esteem is at stake; argument explains why the change took the normative direction it did rather than some other. There is also an unresolved asymmetry about testimony: the interest camp treats actors' stated moral reasons as rationalization by default, the argument camp takes them at face value, and the honor camp reads them as symptoms of a status game. Nobody has proposed a rule for when an agent's account of her own reasons counts as evidence. Meanwhile the comparative material points both ways. Dueling disappeared in Britain decades before it did in France, Germany, or Russia without any comparable difference in economic structure. In the footbinding case, an argument in the economic-historical literature holds that the practice persisted in regions where girls' hand-spinning and weaving labor was commercially valuable and receded where machine-spun yarn destroyed that income, which would give the interest camp a village-level mechanism for the very collapse the honor camp explains as a change in what counted as respectable.

  My working hypotheses, offered as hypotheses and not as conclusions: (1) the three accounts address different explananda, namely feasibility and timing, thinkability and normative direction, and the mobilization of individual action against free-riding, so the question of which one caused the change is ill-posed; (2) the disagreement is really about what an explanation must supply, since on a difference-making or counterfactual standard all three are trivially causes, which is why no side ever loses; (3) the durable part of the dispute is a disagreement about the epistemic status of first-person testimony rather than about the past at all. Alternatively the debate is not stalled but merely underpowered, and the live question is one of causal ordering: whether the status classification or the cost structure moved first.

  What I want is a diagnosis, not a verdict on which account is true and not a survey of the literature. Sort the disagreement into its components and say, of each, whether it is verbal, a difference about the explanandum, a difference about standards of evidence, a substantive empirical question, or bedrock. Support the sorting by what each side is actually committed to when it makes its case. Then tell me what would count as progress given that diagnosis: a distinction, a class of cases, a test about the sequence of changes, a formal model of status and incentives, a reformulation of the explanandum in advance, or something else. If your conclusion is that no progress should be expected, argue for that explicitly, and say whether the dispute would nonetheless change character if the question were fixed beforehand as: why did practice P cease to be performed by anyone in region R by year Y?
reasoning: |-
  Okay, let me try to unpack this user's problem. They've been stuck for a year on the framing chapter for their interdisciplinary volume about moral revolutions, specifically why three competing accounts—interest-based, moral argument, and honor—fail to converge despite drawing from the same historical cases. The user isn't struggling with the history itself but with the logical structure of the disagreement.

  First, I need to understand each account clearly. The interest-based approach, exemplified by Eric Williams and challenged by Seymour Drescher, ties the end of practices like slavery to economic factors. Drescher's counterargument complicates things because while he refutes Williams' economic decline thesis, his evidence of mass petitioning is often seen as supporting moral persuasion, blurring the lines between the camps.

  The moral argument account posits that practices ended because people recognized sound reasons against them. Then there's Appiah's honor code theory, where practices collapse when they become markers of shame rather than status. The user notes each theory can absorb the others' evidence—interest explains feasibility, honor explains mobilization, moral argument explains normative direction. This flexibility seems key to the deadlock.

  The user proposes hypotheses: the accounts address different explananda, the debate is about explanatory standards, and it's rooted in epistemic disagreements about testimony. They want a diagnosis, not a verdict, and suggestions for progress.

  Hmm, the core issue seems multifaceted. Let me break down the disagreement components. First, verbal differences: terms like "cause" might mean different things to each camp. For the interest camp, cause is material conditions; for moral argument, it's logical persuasion; for honor, it's social signaling. This is a verbal difference needing clarification.

  Next, explananda differences. Each theory answers distinct questions: interest asks "when was change possible?", moral argument asks "why this direction?", honor asks "how was compliance secured?". Treating them as competing causes of the same thing creates confusion. This needs explicit framing.

  Then, evidence standards. The interest camp discounts testimony as rationalization, moral argument takes it at face value, honor sees it as status performance. This reflects deeper epistemic divides about human motivation. A meta-theoretical framework for testimony could help.

  Substantive empirical questions exist too, like causal ordering—did status shifts precede cost changes? Footbinding's regional variations offer a testing ground here. But some disagreements seem bedrock, like whether moral reasons are genuine or epiphenomenal.

  For progress, the user should reframe the volume around complementary mechanisms. Distinguishing explananda clearly, mapping each theory to specific puzzles, and using case comparisons (like dueling's timing across countries) could resolve some issues. Formal models integrating status and incentives might help, but bedrock disagreements may persist. If the question is narrowed to "why did practice P cease in region R by year Y?", it forces specificity but doesn't resolve the theoretical divides. The best path is presenting the theories as partial explanations within a larger causal ecology.
answer: |-
  Here's a structural diagnosis of the disagreement and a path forward for your chapter:

  **Diagnosis: Sorting the Disagreement Components**

  1.  **Verbal Difference: What Constitutes "Cause"?**
      *   **Component:** The core term "cause" is used equivocally.
      *   **Manifestation:** Each camp points to its factor as the "real cause," implicitly defining causation differently.
          *   *Interest:* Cause = Enabling/constraining condition (material feasibility, cost/benefit).
          *   *Moral Argument:* Cause = Justifying reason (normative direction, ultimate justification).
          *   *Honor:* Cause = Motivating mechanism (social enforcement, individual compliance trigger).
      *   **Diagnosis:** Primarily **verbal**. Each side is committed to highlighting the *necessary role* their factor plays for the *specific aspect* they deem essential to the revolution. Calling them all "causes" without qualification creates false competition. Progress requires disambiguating "cause."

  2.  **Difference in Explanandum: What Specific Puzzle is Being Solved?**
      *   **Component:** The theories are tacitly answering different, though related, questions about the *same event*.
      *   **Manifestation:**
          *   *Interest:* Explains **feasibility and timing** ("*When* and *under what structural conditions* could change occur?").
          *   *Moral Argument:* Explains **normative direction and justification** ("*Why* did change take *this specific moral form* rather than another? Why is it seen as *right*?").
          *   *Honor:* Explains **compliance and mobilization** ("*How* were individuals motivated to *act* against the practice and overcome free-rider problems? *How* did the change become self-enforcing?").
      *   **Diagnosis:** **Fundamental difference in explanandum.** Each camp is committed to solving a distinct puzzle inherent in a moral revolution. Williams asks "Why *then*?", the moral argument camp asks "Why *this*?", and Appiah asks "How *effectively*?". Treating them as competing answers to the single question "Why did it end?" is the root confusion.

  3.  **Difference in Standards of Evidence (Especially Testimony):**
      *   **Component:** How to interpret actors' stated reasons and normative language.
      *   **Manifestation:**
          *   *Interest:* Committed to **suspicion**. Testimony is assumed to be post-hoc rationalization or ideology masking underlying interests until proven otherwise. Evidence is material conditions and behavior inconsistent with stated ideals.
          *   *Moral Argument:* Committed to **charity**. Takes stated moral reasons at face value as primary motivations unless strong evidence of bad faith exists. Evidence is the content and spread of arguments.
          *   *Honor:* Committed to **functional interpretation**. Testimony is evidence of status performance and identity signaling within a specific social game. Evidence is shifts in social markers, ridicule, and behavior linked to esteem.
      *   **Diagnosis:** **Substantive empirical question with bedrock elements.** There *is* an empirical core: *To what extent were stated moral reasons sincere motivations versus reflections of other forces?* However, the *default stance* (suspicion/charity) often reflects a **bedrock** philosophical commitment about human nature and social explanation (e.g., materialist vs. idealist leanings, hermeneutics of suspicion). This difference fuels mutual dismissal.

  4.  **Substantive Empirical Questions:**
      *   **Component:** Questions about temporal sequence, specific mechanisms, and scope conditions.
      *   **Manifestation:**
          *   *Causal Ordering:* Did a shift in perceived costs/benefits *precede* the status shift, or vice-versa? Did moral arguments *create* the new honor code or *reflect/legitimize* an incipient shift? (e.g., the footbinding/spinning hypothesis vs. Appiah's status account).
          *   *Relative Weight in Specific Cases:* How did the interplay differ between dueling (relatively elite, symbolic) vs. slavery (massive economic system)? Why did dueling end earlier in Britain than elsewhere despite similar economics?
          *   *Mechanisms:* *How exactly* does economic change translate into normative shift? *How exactly* do arguments reclassify status? *How exactly* does shame overcome collective action problems?
      *   **Diagnosis:** **Genuine substantive empirical questions.** These are tractable through detailed historical analysis, comparative case studies, and potentially formal modeling. Each side is committed to the *relevance* of their factor, but *not necessarily* to its absolute primacy in every case. Progress is possible here.

  5.  **Bedrock Disagreement:**
      *   **Component:** The fundamental nature of social reality and explanation.
      *   **Manifestation:** Is the ultimate driver of human action and social change material interest, reasoned normative conviction, or the pursuit of social recognition/status? Is morality epiphenomenal or causally efficacious?
      *   **Diagnosis:** **Bedrock.** This underlies the differences in default stances towards testimony and the perceived primacy of each factor. While empirical work can show the *conditions* under which each factor dominates, the foundational commitment often remains philosophical. The camps are committed to different core axioms about human motivation and social ontology.

  **What Counts as Progress? (Given the Diagnosis)**

  The goal isn't declaring a winner, but clarifying the debate and enabling more productive interdisciplinary dialogue. Progress lies in:

  1.  **Reframing the Explanandum Explicitly:** Instead of "What caused the moral revolution?", frame the chapter around distinct but interconnected puzzles:
      *   "Under what structural conditions did moral revolutions *become feasible*?"
      *   "What provided the *normative direction* and ultimate justification for the change?"
      *   "What *motivational mechanisms* secured individual compliance and made the change stick?"
      Map each theory clearly onto its primary puzzle. Acknowledge they address complementary aspects of a complex process.

  2.  **Developing Conceptual Distinctions:** Rigorously distinguish:
      *   *Enabling Conditions* (Interest - Feasibility/Timing)
      *   *Normative Justification/Direction* (Moral Argument - Why This Change?)
      *   *Motivational Mechanism* (Honor - How Compliance/Action?)
      *   *Epiphenomenal vs. Causal Role of Norms/Reasons* (The Testimony Problem)

  3.  **Identifying Crucial Case Comparisons:** Focus research energy on cases that can illuminate the *interplay* and test empirical questions:
      *   **Dueling Timing:** Why Britain first? Deeply analyze the *sequence* of economic changes (decline of aristocracy?), moral arguments, and status shifts in Britain vs. France/Germany/Russia. Was the status shift *preceded* by economic irrelevance, or did arguments drive the status shift independently?
      *   **Footbinding Mechanism:** Rigorously test the village-level economic hypothesis vs. the national status campaign hypothesis. Can the sequence and geographic spread of abandonment be better explained by economic shifts or the diffusion of new status markers via elites/media?
      *   **Failed Revolutions:** Analyze cases where strong moral arguments existed (e.g., early abolitionist voices, critiques of factory labor) but no revolution occurred. What was missing? Feasibility (Interest)? Mobilization mechanism (Honor)? Both?

  4.  **Formalizing the Interplay (Optional but Potentially Powerful):** Develop simple formal models integrating status and material incentives. How does the cost of performing a practice interact with the social reward/punishment? When does a shift in one trigger a cascade involving the others? Agent-based models simulating the spread of norms under varying cost/status structures could be illustrative.

  5.  **A Pragmatic Approach to Testimony:** Propose a middle-ground heuristic: Treat testimony as *evidence of the normative and status landscape in which actors operated*. It reveals the *available scripts* and *socially acceptable justifications*, regardless of ultimate motivation. This shifts focus from "Were they sincere?" to "What does this language tell us about the social and discursive context enabling action?"

  **On Fixing the Question & Stagnation**

  *   **Fixing the Question ("Why did P cease in R by Y?"):** This forces greater specificity but *doesn't resolve the core disagreements*. Each camp would still:
      *   *Interest:* Point to specific material changes by Y making cessation feasible or necessary in R.
      *   *Moral Argument:* Point to the spread and acceptance of specific arguments against P in R by Y.
      *   *Honor:* Point to a shift in status markers making practitioners of P lose esteem in R by Y.
      The debate would simply refocus on the *relative weight* and *sequence* of these factors *for that specific case*. It clarifies the *empirical* question ("What happened first/best explains the timing here?") but leaves the *theoretical* and *epistemological* differences intact. It changes the character by grounding it in a specific instance but doesn't eliminate the fundamental tensions.

  *   **Is Progress Stalled?** No, but expectations need adjusting. **Convergence on a single "true cause" is unlikely and misguided.** Progress lies in:
      *   **Demarcation:** Clearly distinguishing the different questions each theory answers.
      *   **Integration:** Developing frameworks showing *how* these factors interact dynamically in different contexts (e.g., moral arguments may *become* status markers; economic shifts may *enable* new status games).
      *   **Empirical Refinement:** Using comparative history to establish scope conditions ("Honor shifts dominate in elite practices," "Material shocks are necessary for large-scale economic institutions," "Moral arguments define the *content* of change").
      *   **Epistemological Clarity:** Acknowledging the bedrock differences in interpreting testimony and moving towards contextual analysis.

  **Conclusion for Your Chapter:**

  Your framing should diagnose the impasse not as a failure, but as a consequence of the multifaceted nature of moral revolutions. The three accounts aren't primarily competing explanations of the *same* thing; they are complementary lenses illuminating *different essential dimensions* of a complex phenomenon: feasibility, justification, and compliance. The "durable dispute" stems from conflating these dimensions, arguing past each other about causation, and underlying philosophical differences about motivation and evidence.

  Progress requires embracing this complexity. Structure your chapter to:
  1.  Define a moral revolution *as* an event requiring changes in feasibility, normative direction, *and* motivational compliance.
  2.  Present the three accounts as indispensable, specialized toolkits for analyzing these distinct dimensions.
  3.  Acknowledge the genuine empirical disputes (sequence, mechanism, scope) and epistemological bedrock (testimony).
  4.  Propose the way forward: targeted comparative case studies focusing on the *interplay* and *sequencing* of these factors, conceptual clarity on the distinct explananda, and pragmatic approaches to interpreting historical actors within their normative and social contexts.

  This transforms the stall into a framework for productive interdisciplinary research on moral revolutions, where the "competition" gives way to understanding necessary collaboration between different modes of explanation.
