answer: |-
  Here's a move-by-move adjudication of the Ilana/Theo exchange, followed by direct answers to your three questions and an assessment of your two-dimensional demandingness idea.

  ### Move-by-Move Adjudication
  1.  **Ilana (-1): Partly verbal, partly substantive.**  
      *Rating:* -1 (Misguided). While she correctly identifies a gap between "optimal" and "obligatory," she misrepresents standard consequentialism, which typically *does* collapse this gap (what you ought to do *is* what produces the best outcome). Her "straw target" claim ignores that demandingness objections target precisely this feature. *Substantive work:* Attempts to reframe obligations but fails against standard consequentialist commitments.
  2.  **Theo (+2): Substantive.**  
      *Rating:* +2 (Clearly right). Theo correctly identifies that Ilana's "gap" relies on deontic concepts (supererogation) foreign to act-consequentialism and highlights the instability problem for moderate consequentialisms. *Substantive work:* Exposes the core tension: importing prerogatives requires justification within a consequentialist framework.
  3.  **Ilana (0): Substantive.**  
      *Rating:* 0 (Neutral/Mixed). Her point about collective action is pragmatically valid but normatively weak for act-consequentialism. Consequentialism *does* require compensating for others' defection (e.g., giving until marginal utility equals beneficiaries'). *Substantive work:* Introduces nonideal theory/collective obligation dynamics, but doesn't resolve the core theoretical issue.
  4.  **Theo (+1): Substantive.**  
      *Rating:* +1 (Mostly right). He correctly notes that "fair shares" are deontological (focused on agent-relative duties/distributive fairness), not consequentialist (focused solely on net good). *Substantive work:* Forces Ilana to either justify fairness within consequentialism or concede she's moved frameworks.
  5.  **Ilana (+2): Substantive.**  
      *Rating:* +2 (Clearly right). This is a valid move for *rule-/motivation-focused consequentialism*. She derives bounded demands from the *practices/motivations* whose adoption maximizes good, addressing motivational fragility. *Substantive work:* Provides a consequentialist internal justification for bounded demands via indirect structure.
  6.  **Theo (-1): Largely verbal.**  
      *Rating:* -1 (Misguided). While technically correct about the distinction between criterion and motivation, he dismisses the force of Ilana's move. The demandingness objection *loses its practical bite* against indirect views, as the "demand" on the agent is bounded by the optimal practice. *Substantive work:* Insists on applying the objection at the wrong level (criterion vs. agent guidance).

  ### Answers to Your Questions
  1.  **Move (5): Rescue or Abandonment? Does Theo defeat it?**  
      Move (5) is a **rescue** via indirect consequentialism (e.g., rule-consequentialism or motive-utilitarianism). Theo's reply in (6) **does not defeat it**; it merely restates a technical distinction Ilana can accept. The key is that the *demand on the agent* is bounded by the optimal decision procedure/motivation. If morality guides action via internalized practices (not direct calculation), the objection that "it demands too much *of the agent*" is answered. Theo's unbounded "criterion of rightness" is irrelevant to the agent's lived obligation under the theory.

  2.  **Who is more right about the demandingness objection?**  
      **Ilana is more right.** The demandingness objection primarily targets an **unattractive implication** of *act-consequentialism* (endless sacrifice), not a logical flaw. It fails against sophisticated consequentialist theories (like Ilana's move (5)) that *incorporate* bounded demands due to psychological/practical constraints. Theo wrongly treats act-consequentialism as the only viable form.

  3.  **Your Two-Dimensional Demandingness Idea: Does it dissolve/relocate the dispute?**  
      **Yes, it clarifies and relocates key disagreements.** Splitting demandingness into:  
      **(A) Absolute Sacrifice Level** (e.g., 10% vs 50% income)  
      **(B) Dependency on Others' Actions** (how much your obligation changes if others defect)  
      reveals that Theo and Ilana are largely talking past each other:  
      - Ilana's moves **(3) and (5)** focus on **reducing Dependency (B)**. She argues obligations shouldn't scale infinitely with others' defection (A is bounded if B is low).  
      - Theo's move **(4)** rejects this, insisting consequentialism must have **high Dependency (B)** because obligations are outcome-driven, not duty-based. His objection is that reducing B requires abandoning core consequentialism.  
      - **Residue:** The core clash is whether Dependency (B) *can* be reduced within consequentialism. Ilana (in 5) shows it can via indirect structures, while Theo (in 6) dismisses this as changing the subject. Your distinction shows Ilana is addressing the *practical* demandingness (A & B combined), while Theo fixates on *theoretical* demandingness (A under full compliance, ignoring B).

  ### Conclusion
  Theo wins on narrow, act-consequentialist grounds but loses the larger argument. Ilana successfully defends a form of consequentialism that answers the demandingness objection by deriving bounded demands (low Dependency-B) from psychological realism and optimal social practices. Your two-dimensional framework sharpens this: Theo's act-consequentialism has **high A and high B**, making it vulnerable to the objection. Ilana's indirect move creates a theory with **moderate A and low B**, defanging it. The residue is whether low-B theories count as "true" consequentialism—a semantic dispute Theo insists on but which doesn't help assess practical adequacy.
