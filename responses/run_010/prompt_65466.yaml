  ### Thomson Lamp Systems: Firmware Release Notes (ω.0)  
  **Release Date:** 00:00:00 UTC, Completion of Sequence  

  #### Overview  
  This release finalizes support for the ω-sequence toggle protocol. Firmware now fully adheres to the stipulated parameters: infinite toggles executed within a finite interval, terminating at t=0 ("noon"). All pre-ω.0 state-handling inconsistencies are resolved.  

  #### Known Issues  
  | ID | Description | Severity | Status |  
  |----|-------------|----------|--------|  
  | K-ω.001 | Unit state undefined at t=0 | Critical | BY DESIGN |  
  | K-ω.002 | Time-reversed units (t<0) report state without prior toggle history | Medium | INVESTIGATING |  
  | K-ω.003 | Clock synchronization drift during high-frequency intervals | Low | DEFERRED |  

  ---

  **Open Tickets**  

  #### #7482: Switch Actuator Physics Violation  
  *Submitted by: Engineer_42*  
  **Description:**  
  Switch mechanism cannot toggle at required frequencies beyond t=-1/(2^n) for n>50. Relay contact bounce, Lorentz contraction, and energy requirements violate known physics. Lamp draw at Planck-time intervals would vaporize local spacetime.  
  **Status:** WONTFIX  
  **Maintainer Response (Dev_Thomson):**  
  The lamp operates under idealized conditions per Section 1.1 of the Thought Experiment Specification. Physical implementation constraints (e.g., "relay durability," "cosmological energy budgets") are out of scope. For empirical testing, use the *Simulated Physics Override* flag.  

  #### #7483: Lamp State at Noon  
  *Submitted by: Customer_Alex*  
  **Description:**  
  After firmware ω.0 install: Is the lamp ON or OFF at exactly t=0? Need confirmation for lighting control systems integration.  
  **Status:** NEEDS INFO  
  **Maintainer Response (Dev_Thomson):**  
  Per the protocol, state is defined by the most recent toggle prior to t=0. Provide the timestamp of your observation relative to the sequence: t=0 ± 1/(ω + k) for any finite k? Without this, the system lacks sufficient data to determine state at the limit.  

  #### #7484: Unit Found On at Noon with No History  
  *Submitted by: Customer_ZenoCo*  
  **Description:**  
  Unit #7 was observed ON at t=0. However, the toggle log shows no activity for t < 0. This violates causal initialization.  
  **Status:** BY DESIGN  
  **Maintainer Response (Dev_Thomson):**  
  The system adheres to stipulated boundary conditions. Per your deployment’s configuration file: `INITIAL_STATE=ON` at t=0. Toggle history for t<0 is not required for boundary-compliant units. See Known Issue K-ω.002.  

  #### #7485: Sequence Never Completes  
  *Submitted by: Mathematician_Blue*  
  **Description:**  
  ω-sequence requires completing infinitely many operations. No finite agent can verify completion. Thus, the lamp never reaches t=0.  
  **Status:** CLOSED CANNOTFIX  
  **Maintainer Response (Dev_Thomson):**  
  Completion is axiomatic under the supertask framework (see Stipulation 5.3: "Sequence concludes at t=0"). Runtime is not measured in discrete steps but in the interval [-1,0]. We acknowledge this is counter-empirical but must reject the ticket as unfalsifiable within the system’s axioms.  

  ---

  #### #7486: Motion Required for Toggle  
  *Submitted by: Customer_Parm*  
  **Description:**  
  Each toggle requires the switch to traverse finite distance. Infinite toggles demand infinite distance moved. Switch cannot reach final position by t=0.  
  **Status:** DUPLICATE  
  **Maintainer Response (Dev_Thomson):**  
  Duplicate of #002 (archived, Elea Division). Per Zeno v.1.0 (circa 450 BCE): All motion parameters are pre-condensed into the interval. Distance constraints are abstracted per the continuum.  

  ---

  ### Support FAQ Addendum  
  **Q:** Why can’t you just *tell* me if it’s on or off?  
  **A:** The lamp’s state at t=0 is determined by the supremum of the toggle sequence. If you require a definite value, initialize the system with `FORCE_STATE=ON|OFF` (overrides ω-sequence results).  

  **Q:** My lamp exploded at n=97.  
  **A:** Enable simulation mode (`REALITY=0`). Hardware limitations are not covered under warranty.  

  **Q:** What does the lamp *actually do*?  
  **A:** It satisfies the premises of the thought experiment. For further details, consult your philosophy department’s licensing agreement.  

  *Thomson Lamp Systems: Illuminating Purely Hypothetical Spaces Since 1954.*
