  The stone of the archive smelled of brine and the faint, persistent tang of sulfur rising from the deep vents. Halen ran a calloused finger down the column of marks in the great ledger, the ink faded brown on the thick, water-stained paper. Thirty years of Assize verdicts, thirty years of *yes* or *no*, thirty years of the city holding, just as the readers had declared it would. He counted the *yes* marks again: seventeen times. The *no* marks: only twice, both generations ago. The margins? Wider each time. The last Assize, twenty years past, had been near-unanimous in its confidence.

  Outside the thick archive walls, the harbor city of Caldera Bay breathed with the tide. Built on the vast, tilted shelf within the flooded caldera of the sleeping giant Mount Tira, its lower terraces were perpetually damp, its upper streets carved into the ancient inner walls. The deep harbor was its lifeblood, but its foundation was the judgment of the Assize.

  Halen dipped his pen, adding a fresh entry: *Assize Convened, Day of the Deep Ebb.* He blew on the ink. Soon, the readers drawn by lot – a pilot, two well-diggers, a mason, a clerk, three midwives – would fill the chamber, hear the evidence, and vote: would the shelf hold for the next twenty years? In living memory, it always had.

  **The Evidence**

  The Chamber of Scrutiny was a vaulted room near the old vent shaft, now capped. The air buzzed with low conversation, smelling of wet wool, lamp oil, and the faint metallic scent of the well water brought up for the readers. Halen sat at a small table to the side, the ledger open, a fresh sheet for today’s tally beside it.

  The Keeper of the Vents presented first: vials of gas collected from the deep bores the city had drilled decades ago to tap geothermal heat and stabilize pressure. He showed the colors trapped in glass tubes – pale yellow, a faint green. "The hues hold steady," he declared. "As in the years of quiet sleep. The mountain breathes easy."

  Old Mistress Elara, bone-reader of the midwives' guild, held aloft a polished section of volcanic rock drilled from the shelf's deepest anchor-points. "See the crystal patterns? Ordered, calm. Like the lattice of a strong bone. No fractures, no hidden shivers."

  Then came Pilot Bren, his face wind-burned, holding a jar of seawater scooped from the channel where the caldera met the open ocean. He swirled it. "The plankton bloom," he said. "Rich, dense. The deep currents feed it well. When the mountain stirs, the currents shift, the bloom falters. It holds strong."

  Halen watched the readers nod. He saw the collective comfort settle over them like a familiar cloak. He thought of his ledgers. The colors described *now* were the same as twenty years ago, forty years ago. But the shelf *wasn't* the same. The deep bores had siphoned immense volumes of superheated water for generations. The aquifer beneath the shelf, once a pressurized cushion, was drastically depleted. He’d seen the reports from the well-diggers’ deepest probes: new microfractures, subtly different mineral deposits. The signs the readers relied on – the gas hues, the crystal lattices, the plankton bloom – they measured the mountain's *breath*, perhaps, but not the shelf's *bones*, not anymore. They were reading the cover of a book whose pages had been rewritten.

  **The Deliberation**

  After the presentations, the readers gathered in a circle. The mood was earnest, collegial. Halen listened, pen poised.

  "I found Mistress Elara's crystals most persuasive," said the clerk, a young man named Kael. "Such uniformity speaks of deep stillness."

  The senior mason, Goran, nodded gravely. "Aye. And the gas hues – steady as the harbor light. Remember the tales of the Great Unrest? The gases turned murky brown, thick with ash particles. Nothing like this clarity."

  Pilot Bren added, "The bloom… it reminds me of my grandfather’s logs from before the last quiet period. Just that same rich green soup." Others murmured agreement.

  A young midwife, Lira, spoke up, hesitant. "The well-diggers… they spoke of shifts in the lower strata last year? Small tremors?"

  Mistress Elara patted her hand. "Child, those are the shelf settling, as it always does after the deep ebb draws the water out. The *signs* we are given to read – the gases, the crystals, the water – they remain true. They speak of the mountain's heart, not the shelf's grumbling." Lira nodded, reassured, her doubt smoothed away by the elder’s certainty and the surrounding hum of consensus.

  Halen watched the process, familiar as the tide. They weren't just sharing observations; they were converging. The minor doubts voiced were gently folded into the dominant narrative. The shared language of the signs – the hues, the lattices, the bloom – became a lens focusing them all on the same interpretation. Their growing agreement felt, to them, like the truth revealing itself. Halen dipped his pen but didn't mark the paper yet. He felt a cold knot in his stomach. *They are becoming alike. And they mistake that likeness for seeing the mountain clearly.*

  **The Question**

  As the sense of agreement solidified, young Kael the clerk raised a hand. "Respected Readers, Keeper," he addressed Halen, "I propose a different question. Instead of just 'hold' or 'not hold,' perhaps we should vote on actions. Raise the seawall? Abandon the lower terraces? Or do nothing?"

  A ripple of surprise went through the chamber. Murmurs rose. Halen felt a jolt of alarm. He stood.

  "The Charter," he said, his voice firm but calm, cutting through the murmurs. "Article Seven: 'No question put to the Assize shall admit of more than two answers, yea or nay.'" He gestured to the ledger. "Thirty Assizes recorded here. Only ever two choices. Why? Because a split vote on *three* paths leads nowhere. Imagine: a third say build the wall, a third say abandon, a third say do nothing. Who wins? What does Caldera Bay *do*? The Assize must deliver a clear directive – action, or inaction. 'The shelf holds' means we build, we expand, we trust. 'It fails' means we retreat, we fortify the heights. Two roads. A three-way fork leaves the city paralyzed at the crossroads." He looked around at the faces, some thoughtful, some relieved. "The simplicity forces a decision the city can act upon."

  Goran the mason nodded vigorously. "Aye! Clear counsel, that's our duty. Not a menu of fears."

  Kael flushed slightly but bowed his head. "I see the wisdom, Keeper. Forgive my presumption."

  The proposal died. The binary path remained. Halen sat, the knot in his stomach tightening. He had defended the rule, rightly, for the city's practical need. But he also knew, with a certainty that felt like swallowing ash, that it protected the Assize from revealing its own potential fracture. A split vote would sow doubt. Near-unanimity on a binary choice felt like divine certainty, even if it was built on sand.

  **The Abstainer**

  Before the vote stones were distributed – white for *Hold*, black for *Fail* – one reader stood. It was Tomas, a well-digger, his hands permanently stained with clay and mineral oxides. He was known for his quiet thoughtfulness.

  "I will cast no stone today," he announced. His voice was steady.

  A murmur of consternation ran through the chamber. Abstention was rare.

  "Tomas?" Mistress Elara prompted, concerned.

  He looked around at them. "I listened. I saw the signs as you did. My own reading… it aligns. But here is the thing: if most of you are right, my vote doesn't matter. The verdict will stand. But if… *if* most of you are wrong…" He paused, letting the unthinkable idea hang in the sulfur-tinged air. "Then that would mean the signs we all rely on… they are pointing us astray. And if *that* is true, why would *my* reading of those same signs be correct? In the very moment my vote might matter – the moment the majority errs – my own judgment is most likely flawed. I would be adding error to error. So… I step aside. I trust your verdict." He sat down.

  Silence. Then Goran clapped him on the shoulder. "Honest doubt, Tomas. But unnecessary! Look at the signs! Look at our unity!" The others murmured agreement, reassuring themselves. Halen watched Tomas. The man wasn't cowardly; his reasoning was coldly, terrifyingly logical. He understood the knife-edge. If the signs were true, his vote was surplus. If they were false, his vote was poison. Abstention was the only honest choice. Halen noted it in the margin: *Tomas, Well-Digger, Abstained. Reason: Contingent Doubt.* He didn't know if it was wisdom or despair.

