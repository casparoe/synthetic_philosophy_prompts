prompt: |-
  I cover law, science, and ideas for a general-interest magazine, and I've been trying to work out what I actually believe about when a state may punish speech, because my instincts keep straddling the Atlantic. Here are my verdicts as I've recorded them.

  A neo-Nazi group marching through a town of Holocaust survivors: protected, and the courts were right to permit it. A cross burned on a Black family's lawn: punishable, where the aim is to intimidate. Holocaust denial published in Germany: punishable, and I think the German statute gets something right. A British man's obviously jokey tweet about blowing up an airport: his conviction was a disgrace and the appeal court was right to quash it. A French comedian whose act turns on gestures with antisemitic associations: I've come round to accepting the bans on his shows. The Danish newspaper's cartoons of Muhammad: lawful, correctly left uncharged, and still a bad decision to publish. A tenured academic's article arguing that some groups are less intelligent: I'd defend his right to publish it in either jurisdiction. An AI-generated video of a candidate pocketing a bribe, released four days before polling day: I want that criminally punishable, and I can't get there from anything above.

  My working rule is that speech loses protection when it is aimed at a particular person as a weapon rather than at an audience as a claim. It handles the cross and the academic, fails on the German case and the deepfake, and cannot explain why the comedian differs from the tweeter — though I'm certain he does.

  Give me a principle, or the smallest set of them, that earns the most of these verdicts. I want you to commit: adopt one, state its clauses and the case each clause exists for, say what it rules in cases I haven't raised — a Swiss conviction for denying the Armenian genocide, a platform that algorithmically amplifies a slur without composing it — and name the verdict of mine it forces me to abandon. Please don't survey the American and European traditions and leave the choice to me.
reasoning: |-
  Okay, the user is a journalist covering law, science, and ideas for a general-interest magazine. They're struggling to reconcile their instincts on when speech should be punishable, which seem influenced by both American and European perspectives. They've listed specific cases with their verdicts and proposed a working rule that speech loses protection when aimed at a person as a weapon versus an audience as a claim. But they admit this rule fails in several cases.

  The user wants a principle or minimal set of principles that can explain most of their verdicts. They want me to commit to one, define its clauses, apply it to new cases, and specify which of their verdicts it would force them to abandon. Importantly, they don't want a survey of traditions—they want a concrete proposal.

  Looking at their verdicts:  
  - Neo-Nazi march: protected  
  - Cross burning: punishable  
  - Holocaust denial (Germany): punishable  
  - Jokey airport tweet: protected  
  - French comedian's antisemitic gestures: bans acceptable  
  - Muhammad cartoons: lawful but bad decision  
  - Academic article on group intelligence: protected  
  - AI deepfake of candidate: should be punishable  

  Their working rule (weapon vs claim) handles the cross burning and academic case but fails elsewhere. The key tensions are:  
  1. Why ban Holocaust denial but protect the academic article?  
  2. Why accept bans on the comedian but protect the jokey tweet?  
  3. Why protect neo-Nazi march but punish the cross burning?  
  4. Why punish the deepfake specifically?  

  The deepfake case stands out because it's false and election-related. The comedian vs tweet distinction might hinge on cultural context or harm potential. Holocaust denial laws exist due to historical trauma in Germany.  

  I need a principle that explains these nuances. The core conflict is between individual autonomy (American view) and dignity/harm prevention (European view). A hybrid approach might work.  

  Considering "contextual credible threat to fundamental rights" as a principle. Breaking it down:  
  1. **Imminence**: Threat must be immediate (prevents punishing mere offensive ideas).  
  2. **Targeting**: Directed at specific individuals/groups (addresses cross burning vs march).  
  3. **Severity**: Threatens core rights like safety or democratic participation (covers deepfakes).  
  4. **Contextual credibility**: Reasonable perception of real harm (explains why Holocaust denial is punishable in Germany but academic work isn't).  

  Applying this:  
  - Neo-Nazi march: Not imminent or targeted enough → protected.  
  - Cross burning: Imminent, targeted, severe → punishable.  
  - Holocaust denial (Germany): Contextually credible threat to dignity/harm prevention given history → punishable.  
  - Airport tweet: Not credible threat → protected.  
  - French comedian: Contextually credible in France due to sensitivity → bans acceptable.  
  - Muhammad cartoons: Not targeted/severe enough → lawful.  
  - Academic article: Not imminent/threatening core rights → protected.  
  - Deepfake: Targets election, imminent, severe → punishable.  

  New cases:  
  - Armenian genocide denial (Switzerland): Context might not make it a credible threat → shouldn't be punished.  
  - Algorithmic amplification of slurs: If it creates imminent threat (e.g., inciting violence), punishable; otherwise not.  

  This would force abandoning the verdict on Holocaust denial being punishable unless in specific contexts like Germany. The user might need to accept that their support for German laws is context-dependent, not absolute.  

  The principle prioritizes preventing concrete harm over abstract offense, but allows cultural/historical context to define "credible threat." This bridges the Atlantic divide by focusing on harm rather than ideology.  

  Biggest sacrifice: Consistency on Holocaust denial. If the user insists it should always be punishable, this framework won't work. But their other verdicts suggest they accept context (e.g., protecting academic work).  

  Final principle: Speech is punishable only if it constitutes a *contextually credible, imminent threat targeting specific persons/groups and threatening fundamental rights*. This gets 7/8 verdicts (only Holocaust denial in Germany might need contextual justification).
answer: |-
  Here's a principled framework that captures 7 of your 8 verdicts while forcing you to abandon one core intuition. I call it the **"Imminent Targeted Harm" (ITH) principle**:

  ### The ITH Principle
  **Speech may be punished only when it constitutes a *credible, imminent, and targeted threat* to *fundamental rights* (physical safety, democratic participation, or essential human dignity) of *identifiable persons/groups*, where context determines credibility.**

  Three core clauses:
  1. **Credible & Imminent Threat**  
     *Exists for:* The AI deepfake (threat to democracy days before voting) and the burning cross (imminent intimidation).  
     *Requires:* Likely, near-term harm—not hypothetical or distant. Rejects "bad tendency" arguments.  
     *Example:* A death threat = punishable; abstract hate ideology = protected.

  2. **Targeted**  
     *Exists for:* Burning cross (specific family) vs. neo-Nazi march (general public).  
     *Requires:* Victims must be identifiable individuals or defined groups (e.g., "Black residents of X neighborhood"), not broad categories ("immigrants").  
     *Example:* Directly inciting violence against a mosque = punishable; racist screed on a blog = protected.

  3. **Harm to Fundamental Rights**  
     *Exists for:* Deepfake (undermines voting rights) and comedian's gestures (contextual dignity harm in France).  
     *Defines "Fundamental Rights":*  
     - Physical safety (no violence incitement)  
     - Democratic participation (no election sabotage)  
     - Essential dignity (no dehumanization where context makes harm inevitable, e.g., post-genocide societies)  
     *Excludes:* Offense, disgust, or general social discord.

  ---

  ### How ITH Handles Your Cases
  | Your Case                     | Your Verdict             | ITH Verdict               | Why                                                                 |
  |-------------------------------|--------------------------|---------------------------|---------------------------------------------------------------------|
  | Neo-Nazi march                | Protected                | **Protected**             | Not targeted/imminent threat; general ideology.                    |
  | Burning cross                 | Punishable               | **Punishable**            | Targeted intimidation → imminent safety/dignity threat.             |
  | Holocaust denial (Germany)    | Punishable               | ❌ **PROTECTED**           | Fails imminence/targeting; historical claim ≠ imminent threat.     |
  | Airport tweet                 | Protected                | **Protected**             | Not credible threat (joke context).                                |
  | French comedian               | Bans acceptable          | **Punishable** (in France)| Context (post-Shoah France) makes gestures targeted dignity harm.  |
  | Muhammad cartoons             | Lawful                   | **Protected**             | Not targeted/imminent; offensive ≠ fundamental harm.               |
  | Academic article              | Protected                | **Protected**             | Not targeted/imminent threat; scholarly claim.                     |
  | AI deepfake of candidate      | Punishable               | **Punishable**            | Targeted, imminent threat to democratic participation.             |

  **Verdicts ITH matches:** 7/8  
  **Verdict abandoned:** Holocaust denial must be **protected** under ITH.

  ---

  ### New Cases Resolved
  - **Swiss conviction for Armenian genocide denial:**  
    *ITH:* **Protected** (not imminent/threat to fundamental rights; historical argument). Forces you to reject punishment.  
  - **Platform algorithmically amplifying a slur:**  
    *ITH:* Punishable **only if** amplification creates imminent threat (e.g., targeting specific users during riots). Otherwise protected.  

  ---

  ### Why ITH Forces You to Abandon Holocaust Denial Punishment
  - Holocaust denial fails **imminence** (it's historical revisionism) and **targeting** (victims aren't identifiable individuals facing immediate harm).  
  - You think Germany "gets something right" because of historical context, but ITH demands *universal* thresholds—not country-specific historical trauma. To punish denial, you'd need to lower the imminence bar, which would collapse protections for academic speech.  

  ### Why ITH Explains Your Other Intuitions
  - **Comedian vs. Tweeter:** The comedian's gestures are **contextually credible dignity harm** in France (post-Shoah society, public performance targeting Jews). The tweet lacked credibility (absurdist context).  
  - **Deepfake:** Earns punishment through **all three clauses:** targeted (candidate), imminent (pre-election), fundamental harm (voting rights).  
  - **Academic Speech:** Always protected—lacks targeting/imminence.  

  ### The Tradeoff
  ITH prioritizes **physical safety and democracy** over collective dignity or historical truth. It accepts that offensive/disgusting speech is the price of avoiding state overreach—*unless* context transforms it into a weaponized, immediate threat. This forces you to abandon Holocaust denial laws as emotionally understandable but principled overreach.  

  If you insist on punishing Holocaust denial, you must either (a) dilute "imminence" (risking academic freedom) or (b) elevate "dignity" above other rights (justifying European hate-speech models). But ITH holds the line where you strongest: protecting jokes, marches, and research while banning targeted weapons like cross-burnings and deepfakes.
