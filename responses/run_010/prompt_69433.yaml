prompt: |-
  Six years ago I started a free after-school math program in my neighborhood. No salary, runs out of a church basement, about 30 kids. A former colleague who now runs a for-profit test-prep chain just offered me a regional director job — triple what I make now (I teach part-time at a community college), and he'd genuinely be happy to have me.

  Two friends say I'd be crazy to turn it down. Their argument: the guy they'd hire instead is a pure bottom-line optimizer who'd cut corners, so the students who buy the test prep are better off with me than without me. Plus I could donate half the raise and do more good that way than I do with 30 kids in a basement. One of them said that if I still feel queasy about it, that's self-indulgence — I'm protecting my own sense of being a decent person ahead of the good I could actually do. The other said the program would survive without me since two volunteers could run it, though I dont think it would.

  Here's my problem: when I picture myself in that job I feel like I'd be betraying something, but I can't point to any particular bad outcome it causes, and I know how that sounds. Is that all it is — self-image maintenance? Or is there something real in the feeling that my friends' accounting is leaving out? Give me the bottom line in your first sentence, then the reasoning. Under 250 words please.
reasoning: |-
  Hmm, the user is facing a tough ethical dilemma about leaving their volunteer math program for a lucrative corporate job. They've created a free after-school program serving about 30 kids in a church basement for six years, and now a former colleague is offering them a high-paying regional director position at a for-profit test-prep chain. Their friends are pushing them to take the job, arguing that by taking this role they could prevent someone more profit-driven from getting it, and that they could donate part of their salary to do more good than their current program achieves. The friends also claim the volunteer program would survive without them.

  The user feels conflicted - they have a gut feeling that taking the job would be a betrayal of something important, but they can't articulate exactly why. They're wondering if this feeling is just about maintaining their self-image as a "decent person" or if there's something more substantial to it.

  This is fundamentally about values versus utility. Their friends are making a utilitarian argument focused on measurable outcomes, while the user is grappling with less tangible but equally important considerations about community impact, personal authenticity, and the nature of the work itself. The free math program represents community care and intrinsic educational value, while the test-prep job commercializes education for privileged outcomes.

  The user's hesitation might stem from concerns about becoming part of a system that prioritizes profit over genuine education, potentially reinforcing educational inequalities. There's also the question of whether the program would truly survive without them - they clearly doubt their friends' assessment of this. And while donating salary sounds good in theory, it would fundamentally change their relationship to charity from direct involvement to distant philanthropy.

  I should acknowledge that both paths have merit while validating their intuition that something important is missing from their friends' purely utilitarian calculus. The commitment and personal connection they've built over six years has value beyond what can be quantified in dollars or student numbers. Their emotional response points to authentic values that deserve consideration alongside the practical arguments.
answer: |-
  **Bottom line: Your hesitation isn't just self-indulgence; it reflects valid concerns about the nature of the good you do and the communities you serve, which your friends' utilitarian calculus overlooks.**

  Your friends focus on quantifiable outcomes (money donated, students prepped), but your feeling points to qualitative differences they dismiss:

  1.  **Nature of Service:** Running a free, accessible program in a community space fosters equity and care in a way a for-profit chain, fundamentally serving those who *can pay*, cannot replicate – even with you mitigating some harms. You're building community, not just scores.
  2.  **Your Role & Impact:** Direct mentorship for 30 underserved kids vs. managing a profit-driven operation impacts lives differently. Donating money is passive; your current work is active, relational good.
  3.  **Systemic Effect:** While you might make *that* chain slightly better, taking the job legitimizes and participates in a system prioritizing profit over equitable education access. Your program offers a direct alternative.
  4.  **Authenticity & Integrity:** The "betrayal" feeling likely stems from aligning your daily work with values (access, community service) versus values you may find conflicting (profit-maximization in education). Protecting your integrity isn't vanity; it's sustainability for *you*.
  5.  **Program Survival:** Your deep belief it wouldn't survive without you is crucial – your direct impact there is irreplaceable in its current form.

  Your friends' argument isn't wrong, but it's incomplete. Maximizing abstract "good" ignores *how* good is done and *for whom*. Choosing the program honors a different, deeply valuable form of impact rooted in community and accessibility that the corporate role cannot provide, even with mitigation. Trust your unease; it signals a conflict in core values, not just self-image.
