prompt: |-
  I'm putting together next week's seminar on moral relativism for my second-years — eighteen of them, mostly philosophy with a handful of joint honours students from politics — and I've hit a wall. Every case I can reach for is one they've met a dozen times already: the anthropologist and the Inuit elder, the young graduate who takes a job in a country where paying off inspectors is just how the port works, foot-binding, the missionary. My TA keeps proposing the same one and by minute five the room has switched off. What I want instead is a case where the relativist and the objectivist actually come apart on something somebody has to decide, and where the usual groan — that relativism is inert, that it just collapses into 'be nice and don't interfere' — can't dissolve it. My own hunch is that the way in is to drop the two-cultures framing altogether and make the competing frameworks belong to one person at two different times, because then nobody can appeal to cultural distance or to a live-and-let-live truce. So build me that case to order.

  Here's the shape I'm after. One woman, now in her sixties, is the last surviving trustee of a small grant-making foundation, and the founding deed — which she herself drafted when she was twenty-seven — contains an allocation rule that is still binding and that only she can now vary. This month two applications are in front of her and the rule picks out one of them, and she no longer thinks the rule is right. Constraints, and these matter: realistic, no sci-fi machinery, no memory loss, no time travel, no magical access to other minds; the scenario itself in a single paragraph; there has to be a second person in the room, a junior trustee or the like, who asks her the meta-question directly, something along the lines of whether the old rule was wrong all along or was right then and is wrong now, so that the semantic issue can't be dodged. Two further constraints do most of the work, so please respect them: her change of mind must not be explained by any new non-moral information — she hasn't found out that either programme works better than she used to think, nobody has given her better data — and it must not be explained by self-interest or by any obvious corrosion of character, since she stands to gain nothing personally. If either escape hatch is open, the objectivist wins the case for free and I've learned nothing. I want the change to be the kind we'd ordinarily describe as her coming to see a consideration as morally relevant that she previously didn't register at all, though you should choose the content rather than borrow mine. And don't stipulate the verdicts: if your paragraph simply asserts that the old rule was true-relative-to-her-framework-then, you've smuggled in the answer, and the whole point of the exercise is to test whether relativism makes any practical difference, so the verdicts have to be generated by the two views rather than written into the setup.

  Then do the demonstration. Tell me what a framework relativist of the familiar sort — the view on which an 'ought' is true only relative to a framework the agent is actually party to — says about each of three questions: whether the twenty-seven-year-old's original judgement was true, what she should do about this month's applications, and what she should say to the junior trustee. Then the same three from the objectivist. At least one of those questions has to get genuinely different answers from the two views, and different in a way that isn't merely verbal; if the only divergence is about which sentences come out true in a technical sense, say so plainly and tell me the design has failed rather than dressing it up. After that, identify which single feature of the case is doing the work, and say what happens to the verdicts if you take it out — for instance if she could vary the deed at no cost to anyone, or if nobody ever asked her the meta-question. Finally, hand the microphone to whichever view comes out worse and let it attack the case properly; I'd expect the objection to be something like 'this isn't moral disagreement between frameworks at all, it's one person's prudence across time, so you've changed the subject' — meet that or concede it. British English throughout, please, and no formatting of any kind: no headings, no bullet points, no bold, no tables, just continuous prose the way you'd write me a letter. And be straight with me about how confident you are in the claims you're making, and single out the one point in the whole thing you're least sure of — my guess is it'll be whether the relativist can really say anything interesting in reply to the junior trustee, but I may be wrong about that.
reasoning: |-
  Hmm, the user is a philosophy lecturer preparing a seminar on moral relativism for second-year students. They're frustrated with overused examples that fail to genuinely challenge students or demonstrate practical differences between relativism and objectivism. They want a fresh case study that meets very specific constraints: no cultural clashes, no sci-fi elements, centered on one person's moral evolution over time.

  The core challenge is designing a scenario where:
  - A single individual holds conflicting moral views at different life stages
  - The change isn't due to new facts or self-interest
  - There's concrete decision-making pressure (foundation grant allocation)
  - A secondary character forces the meta-ethical question
  - Both theories must yield meaningfully different practical prescriptions

  The foundation trustee case seems promising. A woman drafting binding rules at 27 must apply them at 60 despite fundamentally changed values. The junior trustee's question ("Was the rule always wrong or only now?") perfectly triggers the needed debate.

  For the demonstration:
  Relativism would likely say:
  1) Original judgment was true relative to her past framework
  2) She should follow current framework (discard rule)
  3) Tell junior "My values changed" (no absolute truth claim)

  Objectivism would say:
  1) Original judgment was simply true or false absolutely
  2) Must determine which framework is objectively correct
  3) Should make absolute truth claim to junior

  The crucial divergence appears in Q2/Q3 - whether she may break the rule and how she justifies it. The relativist permits framework-hopping; the objectivist demands alignment with one timeless standard.

  Key vulnerability: Is this really moral framework change or just personal growth? The objection that it's merely prudence across time could undermine the case. The strongest counter is that deep moral reorientation (e.g. shifting from meritocratic to care-based ethics) feels qualitatively different from pragmatic adjustment.

  Least certain point: Whether the relativist can give the junior trustee substantive guidance beyond "I changed my mind." If relativism reduces to reporting psychological states, it may disappoint students seeking ethical direction.
answer: |-
  Right, let's build that case. Here’s the scenario in a single paragraph, as requested:  

  Eleanor Vance, now sixty-three, is sole trustee of the Vance Educational Trust, a foundation she established at twenty-seven to fund adult literacy programmes. The founding deed, which she drafted, allocates grants exclusively to applicants demonstrating ‘exceptional individual merit’ through competitive examinations. Two applications are before her this month: one from a gifted but socially privileged candidate who aced the test, another from a community organiser in a deprived area whose scores are middling but whose work has demonstrably lifted literacy rates locally. The deed compels her to fund the first. Eleanor, however, now believes the rule is profoundly mistaken, seeing ‘exceptional collective impact’ as morally paramount in a way she simply didn’t register decades ago. Her shift stems purely from lived experience and reflection, not new data on programme efficacy or personal gain. Beside her sits Anya Sharma, the trust’s newly appointed (and legally powerless) assistant trustee. Watching Eleanor hesitate, Anya asks quietly: "Ms Vance, when you wrote that rule, was it actually wrong back then? Or is it only wrong now?"  

  **Relativist Analysis (Familiar Framework-Relative View):**  
  1.  **Original Judgement (Age 27):** True, relative to the moral framework Eleanor actually endorsed then, which prioritised individual meritocracy and formal equality of opportunity.  
  2.  **Current Decision (Applications):** She should fund the community organiser. Her *current* framework, which recognises collective impact as morally salient, demands it. Her past framework is irrelevant to her present obligations; only the framework she *now* holds generates true ‘oughts’ for her.  
  3.  **Reply to Anya:** She should say something like: "My understanding of what matters here changed. What felt right then doesn't now, based on what I've come to value." She *cannot* truthfully say the old rule was "wrong all along" in any absolute sense, only that it’s wrong relative to her current framework. The relativist verdict on the past is fixed by the framework held at that time.  

  **Objectivist Analysis:**  
  1.  **Original Judgement (Age 27):** Either true or false *simpliciter*, depending on the objective moral facts. If prioritising individual merit over collective impact in educational funding was objectively wrong in those circumstances, then her judgement and the rule were false/mistaken *even then*. If it was objectively permissible or right, then it was true/correct then.  
  2.  **Current Decision (Applications):** She should fund whichever applicant the *objectively correct* moral principles dictate. This *might* align with her current view (fund the organiser), but only if her current framework is objectively superior. If her original framework was objectively correct, she should fund the high-scorer despite her feelings. Her personal change of heart is evidentially relevant but not constitutive of truth.  
  3.  **Reply to Anya:** She should state her best judgement of the objective truth: either "I was wrong back then; the rule was unjust even when I wrote it," or "The rule was right for its time, but circumstances have changed morally" (if objectivism allows temporal variation in fundamental principles, which is contentious), or "My feelings changed, but the rule remains correct and I must follow it." The answer depends on her objectivist reasoning about timeless (or context-sensitive but objective) moral facts.  

  **Genuine Divergence:**  
  The critical, non-verbal divergence occurs in **Question 2 (Current Decision)**. The relativist insists Eleanor *must* follow her current framework, making funding the organiser the only permissible action. The objectivist insists Eleanor *must* follow the *objectively correct* principle, which *may or may not* align with her current framework. If the objectivist concludes the original meritocratic principle was (and remains) objectively correct, then Eleanor *should fund the high-scorer*, overriding her personal conviction. The relativist has no such possibility; her present framework is binding. This divergence is practical – it dictates opposite funding outcomes under certain objectivist verdicts.  

  **The Working Feature & Its Removal:**  
  The core feature enabling this divergence is the **binding nature of the past commitment combined with the inability to appeal to new non-moral facts or self-interest**. This forces the focus onto the *source* of moral obligation (current framework vs. objective truth) when the agent's framework shifts.  
  *   **If she could vary the deed at no cost:** The practical pressure evaporates. She could easily amend the rule to match her current view. Both relativist and objectivist might advise her to do so (the relativist because her current framework permits/requires it; the objectivist if her current view is correct). The meta-question remains, but the high-stakes decision forcing the theories apart is gone.  
  *   **If nobody asked the meta-question (Anya is silent):** Eleanor might simply act on her current conviction, fund the organiser, and justify it pragmatically ("times change, we adapt"). The deep challenge to relativism about the *truth* of past judgements remains unexplored. The semantic issue is dodged, and the case loses its bite in exposing whether frameworks make truth relative.  

  **Handing the Microphone to the Weaker View (Objectivist Attack & Rebuttal):**  
  **Objectivist Attack:** "This isn't moral relativism in action; it's simply one person's prudential or psychological development across time. Eleanor hasn't switched between genuinely distinct moral *frameworks*; she's just matured or broadened her perspective within a single, evolving moral understanding. True moral disagreement requires conflict between contemporaneous agents or societies holding incompatible basic principles. Here, there's only Eleanor revising her own views. Relativism needs inter-agent conflict to be distinct from subjectivism or plain error-correction. You've changed the subject to personal growth, not framework-relative truth."  

  **Rebuttal (Meeting the Attack):** The distinction hinges on whether the change involves genuinely *incommensurable* moral salience. Eleanor at 27 saw "individual merit" (measured formally) as the *sole* relevant criterion for educational justice here, dismissing collective impact as irrelevant or even corrosive to fairness. Eleanor at 63 sees "collective impact" as the *primary* criterion, viewing the focus on individual testing as myopic and unjustly blind to social context. These aren't just weights on a shared scale; they represent fundamentally different conceptions of what *counts* as justice in this domain – individual desert vs. communal wellbeing. This resembles paradigm shifts between genuine moral frameworks (e.g., libertarian vs. consequentialist). If such deep re-evaluations of fundamental moral salience within one life don't count as framework shifts, it risks defining "framework" so narrowly that relativism only applies to exotic cultural differences, rendering it inert in the intra-personal, temporal conflicts where modern moral uncertainty often resides. The case forces the question: if this profound shift in seeing a consideration as morally *relevant* isn't a framework change, what is?  

  **Confidence & Least Sure Point:**  
  I'm reasonably confident the case structure meets your specifications and forces the intended divergence on the current decision under objectivism if the past rule is deemed objectively correct. I'm moderately confident the rebuttal holds against the objectivist attack, grounding the framework shift in the change of fundamental moral salience.  

  **The point I'm least sure about** is precisely your guess: **whether the relativist can say anything genuinely interesting (beyond reporting a psychological fact) to Anya (Question 3)**. The relativist seems confined to: "My framework changed." This feels thin, almost evasive, compared to the objectivist's potential for robust truth claims ("I was wrong"). Can the relativist add depth? Perhaps by framing it as loyalty to one's *current* best understanding of value: "Anya, I must act on what I now understand justice to require, just as I did then, based on the reasons I found compelling at each time. Neither moment had a monopoly on truth, but I must live by my present convictions." This moves beyond mere reportage towards a norm of integrity *within* a framework, but it still struggles to match the objectivist's appeal to a truth beyond the self. It risks feeling like sophisticated subjectivism. This remains the relativist's weakest moment in the scenario.  

  This case should provoke the discussion you need – it avoids familiar tropes, focuses on intra-personal temporal conflict, blocks standard escapes, and forces a practical divergence where the theories genuinely recommend different actions based on their core tenets. Good luck with the seminar.
