  Per capita vs. absolute totals is crucial. Explain why per capita makes sense for individual risk, but note when totals might diverge, like in growing populations. Mention that including more people in counts (e.g., women, children) might show falling rates, but it's not an artifact. This needs plain language.

  The closing commitment should unite everyone. Something about reducing avoidable harm, which both groups can agree on. Avoid jargon, keep it actionable.

  Tone is important. First person, conversational. A light moment early on, maybe about the room's diversity. No citations or named scholars to prevent rehashing old debates. Ensure nothing is quotable as a finding—everything is a question or a challenge to explore.

