answer: |-
  Thank you all for being here at the start of this ambitious five-year journey. It’s genuinely heartening to see this particular mix of minds gathered – demographers elbow-to-elbow with legal historians, anthropologists sharing coffee with the board. If our coffee breaks are half as interesting as this lineup suggests, we’ll need to schedule extra time just for hallway conversations.  

  We’re here, fundamentally, because we care about harm. About violent harm, specifically, and whether humanity’s long relationship with it has changed. The foundation’s board captured this core question powerfully in a sentence they’ve shared, one many outside this room would find compelling: **"For the first time in human history, a person alive today faces less risk of violence than at any point in our species' past."**  

  That sentence is our starting point. It’s a bold claim, and its power lies in its simplicity. Our task over these five years isn’t to simply affirm or dismiss it, but to *unpack* it. To ask: What would it take for this sentence to be clearly true? What assumptions does it rest upon? What work do its key terms – "risk," "violence," "person," even "history" – actually do? Making this claim *assertible* – robust, defensible, meaningful – is precisely the opportunity this program offers.  

  Central to this is the challenge of measurement across deep time. Some of us build the numbers: counts from coroners, parish records, battle reports. Others rightly press: Can we count the *same thing* across centuries? Does a fatal blow recorded in a 14th-century manor court as a "trespass" or "misfortune," where a serf’s life held a specific, often diminished, legal value, measure the same social reality as a homicide statistic in a 21st-century national database? When does a killing become "discipline," an "accident," or an act defending "honor" or "property"? And crucially, *which lives* were even counted as lives capable of suffering violent harm worthy of record? Infants? Enslaved people? Outsiders?  

  This isn’t just noise around a clear signal. This is the deep water we swim in. *And it matters.* Let me offer a small, non-war example. Imagine a newborn found dead in the 17th century. The parish record might note "stillbirth" or "failure to thrive," a tragic but perhaps not uncommon event, maybe even seen as a form of economic necessity or divine will by some. Today, that same event might be investigated as potential infanticide or criminal neglect. Both interpretations are rooted in the specific legal, cultural, and evidentiary context of their time. Was it violence? The answer depends profoundly on how we fix the boundaries of our category *then* and *now*.  

  So, what *can* we count comparatively? We can count bodies. We can count recorded violent events. We can define, for our specific purposes, a "population at risk," a "period of exposure," and a "class of bodily events" – say, intentional, interpersonal acts causing death or serious injury. **Once those parameters are fixed, there *are* facts about those events.** We can count them within those bounds.  

  The genuinely hard, and profoundly important, question is this: **Which way of fixing those parameters – which definition of the population, the harm, the risk – actually tracks what we *mean* when we ask if the world is becoming less violent?** Does the board’s sentence refer only to narrowly defined criminal homicide? To all intentional killing? To state-sanctioned force? To threats and fear? Our program won’t dictate a single answer, but it must grapple rigorously with the implications of choosing one path over another.  

  This connects directly to another crucial choice: rates versus totals. The board’s sentence talks about *risk to a person*. That naturally points us towards rates per head – the chance any individual faces. But rates and totals can tell different stories. A growing population can see the *total* number of violent deaths rise even as the *rate* per person falls. Conversely, a shrinking population might see falling totals even with a stable or rising rate. We will lead with rates, because individual risk is our focus. But we must always be transparent that this choice emphasizes one aspect of the story – the individual’s odds – over the sheer scale of suffering in absolute terms.  

  Furthermore, consider this: As our definition of "who counts" *widens* – as we include harms against women, children, enslaved people, marginalized groups previously rendered invisible in the records – we might paradoxically *see* a falling *rate* of violence. Why? Because the denominator – the population we recognize as being "at risk" – expands dramatically. This isn’t a data artifact; it’s a profound shift in moral recognition. It tells us something real about changing societal values, even as it complicates simple comparisons. It’s a reason to refine our comparisons, not abandon them.  

  So, where does this leave us for the next three days, and the next five years? We won’t resolve centuries of conceptual debate by Friday. But we can, and must, find common ground in our purpose.  

  **Here’s the commitment I believe everyone in this room can make, unreservedly: We are here because we believe that understanding the changing patterns of violent harm, with all the necessary nuance and rigor, is essential work. We believe that reducing avoidable suffering, grounded in that understanding, is a worthy goal. And we commit to doing this work together – counters and critics alike – with intellectual honesty, mutual respect, and a shared recognition of the stakes.**  

  That shared commitment is our compass for this workshop and for the program itself. Let’s use these days to chart the challenging, fascinating terrain ahead. Thank you. I’m eager to begin.
