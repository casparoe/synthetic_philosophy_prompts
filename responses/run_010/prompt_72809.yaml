prompt: |-
  I am preparing a section of a paper on levels of description for a philosophy-of-science reading group, and I have constructed an argument whose conclusion I cannot accept. I want a diagnosis, not encouragement, and not a survey of the positions in the literature. The target of the argument is the middle position I myself hold: macro-level properties that are nothing over and above the microphysical base, yet still autonomous in explanation. I state my stipulations first because the argument depends on them; please work inside them rather than objecting to them — though if a stipulation is doing covert work, that is exactly the sort of finding I am after.

  **Stipulations.** For a system S, let M(S) be a complete and true description of S at the fundamental physical level: the exact microphysical state, the initial and boundary conditions, and the laws.

  - (D1) A property P is *entailed* for S just in case M(S) logically entails that S is P. This is deliberately an ontic notion: it makes no reference to whether anyone can produce, verify, or compress the entailment.
  - (D2) P *adds no causal power* beyond M(S) just in case there is no pair of possible situations that agree throughout in M yet differ in P, and hence none in which P could make a difference that M does not already make.
  - (D3) P is *explanatorily autonomous* just in case some phenomenon E is best explained by citing P, and no explanation of E that cites only the predicates of fundamental physics is as good — where "as good" means at least as general, at least as informative about what E counterfactually depends on, and no less unified.
  - (D4) Two theories are *notational variants* just in case they have the same models up to relabeling, so that every claim expressible in one is expressible in the other.

  **The argument.**

  (1) Physicalism: for every property P instantiated by S, P is entailed for S in the sense of D1; otherwise something over and above the physical would be real.
  (2) If P is entailed for S, then P adds no causal power beyond M(S) in the sense of D2: the situations in which P would have to earn its causal keep do not exist.
  (3) If P adds no causal power beyond M(S), then any true claim couched in P-predicates can be replaced by claims about M(S) *salva veritate* and without loss.
  (4) If (3) holds for every predicate of a theory T, then T is a notational variant of the fundamental physical theory in the sense of D4.
  (5) Notational variants have identical explanatory content, since whatever is best about the best explanation of E is preserved under relabeling.
  (6) Therefore no property satisfies D3, and there is only one legitimate level of description: every special science is dispensable shorthand for a description no one could in fact write down.
  (7) Two observations are what make me uneasy about (6). First, the critical point of a simple fluid and the ordering transition of a uniaxial magnet share critical exponents while sharing essentially nothing at the level of M; what does the explanatory work there seems to sit above any particular microphysical description, which looks like a direct counterexample to (6) rather than a relabeling of it. Second, if I try to protect that observation by denying (1) in such cases, then the macro property is not entailed by M at all — which is strong emergence, and given the generality of (1) it would apply equally to being a helium atom and to being a table. So the real conclusion appears to be a dilemma: either there are no autonomous levels, or there are so many that the notion goes trivial, and in either case my middle position is unavailable.

  **What I would like from you.**

  My own suspicion is that (2) is the weak step — that the transfer from entailment to causal impotence is illegitimate. Tell me whether that suspicion is right or whether (2) is a decoy and the damage is done elsewhere.

  Then, in order: (a) identify the step you would reject, and rank the candidate rejections by what they cost me, since several are individually deniable and I want to know which leaves the most of the middle position standing for the least expenditure; (b) explain why the step you pick looked innocent, and which true principle it is a shadow of; (c) say whether you read the argument as invalid — in which case name the slide precisely, and say whether it is an equivocation on "loss" in (3), on "the same" in (5), or on the ontic framing of D1 — or as valid with a merely attractive false premise; (d) tell me what a physicalist who retains (1) through (5) is still entitled to say about the critical-exponents case, if anything, and whether that story is consistent or simply a restatement of the conclusion she was trying to avoid.

  I would rather give up the autonomy of the special sciences than give up physicalism, but I want to know whether the argument actually forces that trade, or whether I have mispriced it.
reasoning: |-
  Okay, the user presents a complex philosophical argument targeting their middle position on macro-level properties. They've provided clear stipulations and a step-by-step argument concluding that autonomous explanatory levels can't exist under physicalism. The core tension is between physicalist commitment (entailment from microphysics) and explanatory autonomy of higher-level properties.

  First I need to map the argument's structure:
  - Premise (1) establishes physicalism via entailment (D1)
  - (2) links entailment to causal impotence (D2)
  - (3) connects causal impotence to replaceability
  - (4)-(5) elevate this to theoretical equivalence
  - (6) denies autonomy (D3)
  - (7) presents counterexamples (critical phenomena) and a dilemma

  The user suspects (2) is the weak point. But looking closer at the definitions reveals something interesting: D2 defines "adds no causal power" via the non-existence of M-identical/P-different situations. Yet under physicalism, such situations are logically impossible by definition - so the criterion vacuously holds for all entailed properties. This doesn't mean P is causally inert; it means the definition misfires by focusing on impossible scenarios.

  For the critical exponents case: even if microphysically diverse systems share the same emergent mathematical structure (renormalization group fixed points), this structure is still entailed by their respective M-descriptions. The explanatory power comes from abstracting away from micro-details to capture universal patterns - which isn't captured by the "notational variant" framing in (4)-(5).

  The user's real challenge is distinguishing between:
  - Ontological dependence (P is nothing over/above M)
  - Explanatory irreducibility (P-predicates capture patterns invisible at M-level)

  The argument fails because:
  - (3) wrongly assumes replaceability without loss (explanatory loss occurs when abstract patterns are discarded)
  - (4) misapplies notational variance (different mathematical structures aren't mere relabelings)
  - (5) ignores that explanations value information-compression and pattern-recognition

  What's clever about the user's setup: they anticipated objections to physicalism (D1) but the trap springs later. The critical point is that "no loss" in (3) smuggles in epistemic assumptions contrary to D1's ontic framing.

  For their requested diagnosis:
  - Reject (3) as cheapest option (preserves physicalism and autonomy)
  - The step looked innocent due to conflation of ontological and explanatory economy
  - Argument is valid but premise (3) is false (explanatory loss does occur)
  - Physicalists can say critical phenomena demonstrate how different M-states project to same mathematical space - autonomy emerges from equivalence classes of microstates

  The user's fear of "trivializing" autonomy is unfounded - universality classes are non-trivial mathematical discoveries, not arbitrary groupings. This position costs only the naive view that explanatory power must mirror causal structure directly.
answer: |-
  Here is the diagnosis you requested, working strictly within your stipulations and targeting the argument's validity and premises. I conclude that **premise (3) is false**, and rejecting it preserves your middle position at minimal cost. Below, I address your queries in order.

  ### (a) Step to Reject and Cost Ranking  
  **Reject (3):** "If P adds no causal power beyond M(S), then any true claim couched in P-predicates can be replaced by claims about M(S) *salva veritate* and **without loss**."  
  **Cost ranking of candidate rejections** (lowest to highest cost to your middle position):  
  1. **Reject (3)** (Lowest cost): Preserves physicalism (1), causal impotence (2), and autonomy (D3). Only sacrifices the claim that P-predicates are replaceable *without explanatory loss*.  
  2. Reject (5) (Higher cost): Denying that notational variants have identical explanatory content undermines D4’s definitional rigor and may require ad hoc constraints on "explanation."  
  3. Reject (2) (High cost): Forces acceptance of novel causal powers for entailed properties, contradicting D2 and risking dualism.  
  4. Reject (1) (Highest cost): Abandons physicalism entirely.  

  ### (b) Why (3) Looks Innocent and Its True Shadow  
  - **Why it looks innocent**: (3) appears tautological given D2: if P adds no causal power, replacing P-talk with M-talk seems to preserve all factual content. The error is conflating *truth-preservation* with *explanatory equivalence*. D2 is purely ontic (about causal powers), while "without loss" in (3) smuggles in epistemic/explanatory criteria (e.g., generality, counterfactual insight) not covered by D1 or D2.  
  - **True principle it shadows**: *Ontological supervenience implies truth-conditional equivalence*. This is correct: if M(S) entails P, then "S is P" is true iff M(S) obtains. But truth-preservation ≠ explanatory preservation (per D3’s criteria).  

  ### (c) Validity and the Nature of the Slide  
  - **The argument is valid** but relies on a **false premise (3)**. The slide is **not** an equivocation but a **substantive error** in (3)'s "without loss" clause. D2 ensures P adds no *causal power*, but it doesn’t follow that replacing P-predicates with M-predicates incurs no *explanatory* loss (as defined in D3). Explanatory virtues (generality, counterfactual insight, unity) are not reducible to truth-preservation.  
  - **No equivocation**: "Loss" in (3) is explicitly epistemic/explanatory (contrasted with *salva veritate*), while D1 and D2 are ontic. The ontic framing of D1 is intact, but (3) illicitly bridges ontology to explanation.  

  ### (d) The Critical-Exponents Case: What a Physicalist Can Say  
  A physicalist retaining (1)–(5) must say:  
  > "The shared critical exponents are *entailed* by each system’s M(S) (per D1), and explanations citing universality classes are *notational variants* of fundamental physics (per 4–5). Any perceived autonomy is illusory; the macro-description is shorthand for an incompressible microphysical derivation."  

  - **Is this consistent?** Yes, but it **restates the conclusion (6)** you reject. It denies autonomy (D3) by reducing the macro-explanation to physics.  
  - **Is it defensible?** Only if you ignore D3’s criteria: a microphysical derivation of critical exponents for each system would lack *generality* (it couldn’t explain why diverse systems share exponents) and *counterfactual insight* (it wouldn’t reveal what exponent values depend on, e.g., symmetry/dimensionality). Thus, it violates D3’s "as good" standard.  

  ### Why Your Suspicion About (2) is Misplaced  
  (2) is correct given your stipulations: if M(S) entails P, then no M-identical worlds differ in P (by logic), so P adds no causal power (D2). The real issue is that (2) and (3) together overreach. **Causal impotence (D2) does not imply explanatory dispensability**—which is why (3) fails.  

  ### Resolution: Retaining the Middle Position  
  By rejecting (3), you keep:  
  - **Physicalism** (P entailed by M).  
  - **Causal impotence** (P adds no power beyond M).  
  - **Explanatory autonomy** (P explains E better than M, per D3).  
  The critical-exponents case exemplifies this:  
  - **Ontic**: Exponents are entailed by M(S) for each system (no emergence).  
  - **Explanatory**: Citing universality (e.g., "same symmetry class") is *autonomous*:  
    - More *general*: Applies to fluids/magnets without micro-details.  
    - Better *counterfactuals*: Shows exponents depend on dimensionality, not micro-contingencies.  
    - More *unified*: Derives shared behavior from abstract patterns.  
  Replacing this with M(S) preserves truth but loses these virtues—exactly the "loss" (3) denies.  

  ### Conclusion  
  The argument forces no trade between physicalism and autonomy. **You mispriced (3)**: Its "without loss" claim is falsified by D3’s explanatory criteria. Rejecting it costs only the conflation of truth with explanation, leaving your middle position intact. The critical-exponents case isn’t a notational variant—it’s a distinct explanatory framework that compresses microphysical complexity into abstract, projectible patterns, consistent with physicalism.
