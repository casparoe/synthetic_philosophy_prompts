answer: |-
  Here is a precision-focused audit of the passage, adhering strictly to your constraints:

  ### 1. Diagnostic: Key Conflations
  - **Amnesty type conflation** (Conditional vs. Blanket): Passage treats SA’s *individually adjudicated, confession-dependent* amnesty as equivalent to Argentina’s *preemptive blanket* amnesty (affects claims about Argentina/Rwanda).
  - **Institutional conflation** (TC vs. Court): Equates South Africa’s *investigative commission* (no trial powers) with Rwanda’s *gacaca community courts* (which tried cases) (affects Rwanda claim).
  - **Liability extinguishment conflation**: Asserts amnesty extinguished *both* criminal *and* civil liability in SA. In fact, civil suits could proceed (affects "cleared of civil liability" claim).
  - **Forgiveness conflation**: Presents victim forgiveness as a *legal precondition* for amnesty (false; it was irrelevant to amnesty grant) vs. a *hoped-for outcome* (affects "asked to forgive" implication).
  - **Purpose conflation**: Reduces TC goals to "amnesty PR," ignoring documented non-PR functions: creating historical record, institutional reform recommendations, symbolic reparations (affects conclusion).

  ### 2. Sentence-by-Sentence Audit
  > *"South Africa's answer... cleared of both criminal and civil liability"*  
  **Conflation + Overstatement**.  
  - **Correct**: Amnesty *was* conditional on full confession to *politically motivated* acts. **Civil liability was NOT extinguished** – victims could sue (AZAPO v Truth Commission, CC 1996). Difference: Victims retained legal recourse; not blanket impunity.

  > *"That is what restorative justice means in practice... perpetrators get to walk."*  
  **Overstatement + Conflation**.  
  - **Correct**: Restorative justice emphasizes victim recognition, community healing, *and* perpetrator accountability through confession. Not synonymous with impunity. "Walk" ignores non-criminal sanctions (e.g., public shaming, disqualification from office). Difference: Misrepresents restorative justice theory/practice.

  > *"To the author's credit... survived the challenge."*  
  **Accurate simplification**.  
  - Fact: Amnesty applied to both sides and was upheld by the Constitutional Court (CC 1996). Legally sound.

  > *"But the same template... to end the Dirty War"*  
  **False**.  
  - **Correct**: Argentina’s *Nunca Más* commission (1983-84) **had no power to grant amnesty**. Its report led to *prosecutions* (Juntas Trial). Blanket amnesties (Laws of Punto Final/Obediencia Debida, 1986-87) came *later*, halting trials. Difference: Commission ≠ amnesty; truth came *before* impunity laws, not via "bargain."

  > *"...it has since been tried in Rwanda... rather than put a million people on trial."*  
  **Conflation (Institutional) + Overstatement**.  
  - **Correct**: *Gacaca* were **local courts** (2001-2012), not a truth commission. They tried >1.2 million cases, imposing sentences (reduced for confession). Not amnesty. Difference: Hybrid judicial mechanism with punitive element.

  > *"Looked at together... amnesty with better public relations."*  
  **Overstatement of contested thesis**.  
  - **Context**: Valid critique *for Argentina’s later amnesty laws*, but false for SA (conditional) and Rwanda (trials). Commissions *do* serve non-PR functions (archiving, reform agendas). Difference: Overgeneralizes distinct models.

  > *"Every transition faces... language of the first."*  
  **False (empirically) + Conflation**.  
  - **Correct**: No binary choice. Examples:  
    - Chile: Truth commission (1990) *alongside* later prosecutions (Pinochet arrested 1998).  
    - Colombia: Peace deal (2016) combines tribunals *and* truth commission.  
    - International law (e.g., Inter-American Court) increasingly rejects amnesties for crimes against humanity. Difference: Commissions and prosecutions are complementary, not mutually exclusive.

  ### 3. Sorting Claims  
  **(a) Confident Legal/Institutional Facts**:  
  - SA amnesty conditional, civil liability preserved.  
  - Argentina’s Nunca Más had no amnesty power; prosecutions preceded amnesty laws.  
  - Rwanda’s gacaca were courts, not a TC.  
  - No universal binary choice between trials/amnesty.  

  **(b) Memory-Dependent (Verify)**:  
  - Exact % of gacaca cases resulting in imprisonment vs. community service.  
  - Post-TRC civil suits filed in SA.  

  **(c) Contested Questions**:  
  - **Do TCs legitimize impunity?** Critics: Yes (e.g., SA’s low prosecution rate for non-applicants). Defenders: They enable truth recovery impossible in adversarial trials.  
  - **Is "restorative justice" achievable without prosecutions?** Debate centers on victim needs vs. feasibility.  
  - **Do TCs deter future atrocities?** Empirically inconclusive.

  ### 4. Does the Conclusion Survive?  
  **No.**  
  - **"Amnesty with PR"**: Fails on:
    - Rwanda (gacaca were trials, not amnesty).
    - Argentina (commission preceded amnesty).
    - SA (amnesty was conditional; civil suits allowed).  
  - **Binary choice false**: Modern transitions use "mixed" approaches (e.g., Sierra Leone: court + TC simultaneously). International law (Rome Statute, IACtHR jurisprudence) constrains amnesties for war crimes/crimes against humanity.

  ### 5. Steelmanned Criticisms  
  Valid concerns specialists raise:  
  - **SA**: TRC’s narrow mandate excluded apartheid’s *economic crimes* and *systemic beneficiaries*. Many perpetrators (e.g., business leaders) never testified. Post-TRC prosecutions rare.  
  - **Argentina**: Post-commission amnesty laws *did* trade truth for impunity (later struck down by courts in 2005).  
  - **Rwanda**: Gacaca’s procedural flaws (limited defense rights, community pressure) compromised due process.  
  - **Universal**: TCs often prioritize *political* peace over *victim-centric* justice. Symbolic reparations without material compensation frustrate victims.

  ### 6. Rewritten Passage (Corrections in *italics*)  
  > "South Africa's answer to apartheid was a *conditional bargain*: the Truth and Reconciliation Commission offered amnesty *only to individuals who confessed politically motivated crimes* in exchange for truth, *shielding them from prosecution but not civil lawsuits*. That version of restorative justice prioritized public disclosure *and victim recognition* over trials, *though perpetrators walked free from prison if amnesty was granted*. To the author's credit, the amnesty ran in both directions... and survived constitutional challenge. But invoking this template for Argentina *misrepresents history*: the *Nunca Más* commission *documented atrocities but did not grant amnesty*; prosecutions *followed its report, only to be halted years later by new amnesty laws*. Rwanda’s *gacaca courts, meanwhile, were not a truth commission but a mass trial system* that *sentenced confessed perpetrators to reduced terms*. Looked at together, the record is *mixed*: truth commissions *can* become amnesty’s handmaiden *where designed that way*, but *they are not inherently so*. Transitions rarely face a binary choice; *international norms now pressure states to prosecute grave crimes even after truth-telling*. *When commissions sideline prosecutions entirely, critics rightly call it politics dressed as justice*."  

  ---
  This audit strengthens defensible critiques (e.g., political trade-offs) while correcting factual errors that distort comparison. The core tension—peace vs. accountability—remains, but framed within legal and empirical realities.
