prompt: |-
  You are a scholar of transitional justice and comparative public law — someone who has worked closely with the design and aftermath of truth commissions, amnesty legislation, and post-atrocity criminal prosecutions in southern Africa and Latin America. Please think carefully and do not answer from first impressions; I would like you to begin with a short brainstorming pass, in which you lay out what you actually know about each of the three cases the passage invokes (their institutional design, their legal powers, what happened afterwards) before you pass judgment on anything.

  I read a long-form magazine feature about how new democracies deal with the crimes of the previous regime, and I transcribed the following paragraph from it. I have some background in political philosophy but no legal training, and I came away from the piece with a strong view I am now unsure I can defend. Here is the passage:

  > "South Africa's answer to apartheid was a bargain: the Truth and Reconciliation Commission offered amnesty in exchange for truth, so that anyone who came forward and confessed what he had done was cleared of both criminal and civil liability, whatever the act. That is what restorative justice means in practice — victims are given a public hearing and asked to forgive, and perpetrators get to walk. To the author's credit, the amnesty ran in both directions, covering the liberation movements' cadres as well as the police and army's death squads, and the provision was challenged in South Africa's Constitutional Court and survived the challenge. But the same template had already been tried in Argentina, where the truth commission that produced Nunca Más traded away prosecutions to end the Dirty War, and it has since been tried in Rwanda, whose gacaca courts sat the country down in the grass to tell the truth about 1994 rather than put a million people on trial. Looked at together, the record is unambiguous: a truth commission is amnesty with better public relations. Every transition faces the same binary choice — prosecute, or buy peace with testimony — and the commissions are simply the second option dressed in the language of the first. Which is why the honest defender of these bodies stops calling them justice and starts calling them politics."

  I want an accuracy audit I can act on, not a general essay on transitional justice. Specifically:

  1. **Diagnostic first.** Before evaluating any sentence, list the pairs of distinct things the passage appears to run together — for example, the difference between amnesty, pardon, immunity, and a statute of limitations; between a truth commission and a criminal court; between a blanket amnesty and an individually adjudicated conditional one; between criminal liability and civil liability; between forgiveness as a legal precondition and forgiveness as a hoped-for by-product. Name each conflation and say which sentence of the passage depends on it.

  2. **Sentence-by-sentence audit.** Go through the passage in order and label each claim: accurate; a defensible simplification for a general audience; a conflation of two things the field keeps apart; an overstatement of a modest or contested thesis; or simply false. Where a claim is false or conflated, say what the correct version is and why the difference matters — I want to understand what would change in my view of these institutions if the claim were fixed. Be especially careful with the two claims that sound cynical but that I suspect may be true; do not "correct" them out of a reflex to defend the commissions.

  3. **Separate kinds of claim.** Sort what you have audited into (a) matters of legal and institutional fact that you are confident about, (b) matters of fact where you are working from memory of a specific statute, ruling, or caseload and would want to check, and (c) genuinely contested normative or empirical questions on which informed scholars disagree. For (c), describe the disagreement rather than settling it.

  4. **Does the conclusion survive?** Take the author's two closing moves — that these bodies amount to "amnesty with better public relations," and that every transition faces a binary choice between prosecuting and buying peace with testimony — and assess whether they follow from the accurate parts of the passage once the errors are removed. Address in particular whether truth-telling mechanisms and criminal prosecution are actually alternatives in practice, and what constraints international law and later domestic courts have placed on amnesties of the kind the passage describes.

  5. **Steelman the author.** Give me the strongest version of the underlying worry that survives your corrections: the criticisms of the South African model, and of the other two cases, that specialists themselves press and that a fair-minded reader should keep. I do not want an audit that ends up as a defence of every commission.

  6. **Rewrite the passage** so that it is accurate, keeps the author's voice and rhetorical force, and preserves the legitimate criticism, marking clearly where you have had to weaken a claim that cannot be supported.

  Two constraints. Do not give me a bibliography, footnotes, case citations, or a reading list — I cannot look any of it up, and I would rather you tell me you are uncertain than invent a reference. Where the passage turns on numbers, do not manufacture precise figures; say what order of magnitude or what structural fact is doing the work. Aim for a response that a careful reader with no legal training could follow, defining technical terms on first use.
