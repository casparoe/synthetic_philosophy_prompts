  ### Leaves (Strategies)  
  - **Leaf A: Simple Expressivism (Ayer)**  
    - **Awkward commitment**: Cannot explain how conditionals work (e.g., *"If lying is wrong..."*).  
    - **Worst test case**: #6 (conditional).  
  - **Leaf B: Attitude-Required Conditional (Unnamed)**  
    - **Awkward commitment**: Conditionals can *only* be accepted if you have the antecedent attitude.  
    - **Worst test case**: #6 (conditional).  
  - **Leaf C: Monolithic Attitude Expressivism (Unnamed)**  
    - **Awkward commitment**: All complex sentences express monolithic attitudes, ignoring logical structure.  
    - **Worst test case**: #5 (disjunction).  
  - **Leaf D: Mind-Dependent Attribution (Stevenson-inspired)**  
    - **Awkward commitment**: Moral claims reduce to reports of psychological states.  
    - **Worst test case**: #7 (attribution).  
  - **Leaf E: Regress-Prone Metaethics (Unnamed)**  
    - **Awkward commitment**: Theorist’s statements about meaning trigger infinite regress.  
    - **Worst test case**: #8 (theorist’s sentence).  
  - **Leaf F: Probabilistic Attitude Expressivism (Unnamed)**  
    - **Awkward commitment**: Requires attitudes to carry precise probabilities.  
    - **Worst test case**: #2 (probability).  
  - **Leaf G: Quasi-Realism (Blackburn)**  
    - **Awkward commitment**: Must reconstruct "truth" from attitudes without moral facts.  
    - **Worst test case**: #8 (theorist’s sentence).  
  - **Leaf H: Norm-Expressivism (Gibbard)**  
    - **Awkward commitment**: Moral judgments are reduced to planning states.  
    - **Worst test case**: #9 (dissociation).  
  - **Leaf I: Being For (Schroeder)**  
    - **Awkward commitment**: All attitudes are flattened to "being for" relations.  
    - **Worst test case**: #3 (question).  

