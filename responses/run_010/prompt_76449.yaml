  ### Critical Notes  
  - **Indistinguishable pair**: **Quasi-Realism (G)** and **sufficiently deflationary realism** cannot be separated by this tree. Both yield identical verdicts on all test cases. Distinguishing them requires metaphysical commitments (e.g., "Are moral facts mind-independent?") beyond sentence-level intuitions.  
  - **Highest-yield node**: **Node 1 (Test Case 9)**. It isolates Simple Expressivism immediately and forces engagement with dissociation early.  
  - **Node to cut for 8 nodes**: **Node 9 (Test Case 4)**. It refines attitudes but doesn’t split leaves, making it the least essential for sorting.  

  This tree forces commitment to an expressivist semantic strategy without realist exits. For your ex-realist group, it exposes hidden costs: every leaf has an "awkward commitment" to confront.
