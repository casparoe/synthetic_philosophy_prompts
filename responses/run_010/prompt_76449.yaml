  ### Metaethical Expressivism Strategy Sorter  
  **Starting Points:**  
  1. "Lying is wrong" and "Lying isn’t wrong" cannot both be right (ordinary sense).  
  2. Moral sentences work in conditionals (e.g., "If lying is wrong, then getting your little brother to lie is wrong" is a good argument due to the meanings of the parts).  

  **Logical Space Miniature**  
  The tree is generated by **7 binary questions** (12 possible combinations), but only **8 combinations** are occupied by defensible strategies. The questions are:  
  1. **Dissociation**: Is "Lying is wrong, but I don’t disapprove of lying" a contradiction?  
  2. **Negation**: Is "Lying isn’t wrong" *just* expressing the opposite attitude of "Lying is wrong"?  
  3. **Conditional**: Can someone reject both "Lying is wrong" and "Stealing is wrong" yet accept "If lying is wrong, then stealing is wrong"?  
  4. **Disjunction**: Does "Either lying is wrong or the train is late" express a single, unified attitude?  
  5. **Attribution**: Does "She thinks lying is wrong" mean she has the *same attitude* as someone who says "Lying is wrong"?  
  6. **Theorist’s Sentence**: When a theorist says, "‘Lying is wrong’ expresses disapproval of lying," is she *expressing disapproval*?  
  7. **Probability**: Can we assign probabilities to moral claims (e.g., "30% chance lying is wrong") as we do for descriptive claims?  

  - **Total combinations**: 128 (theoretical).  
  - **Occupied**: 8 (strategies with coherent commitments).  
  - **Unoccupied combinations** (examples):  
    1. *Dissociation=Yes, Negation=No*: Incoherent. If moral claims *are* current attitudes (Dissociation=Yes), then negations *must* express opposite attitudes (Negation=Yes).  
    2. *Negation=No, Disjunction=Yes*: Unattractive. Requires complex attitudes for negations but monolithic attitudes for disjunctions, creating inconsistent compositionality.  
    3. **Conditional=No**: Incoherent. Violates starting point (ii) about conditionals.  

  ---

  ### Decision Tree (9 nodes, 8 leaves)  
  1. **Node 1 (Test Case 9)**:  
     - Someone says: *"Lying is wrong, but I don’t disapprove of lying."* Is this a contradiction?  
       - **Yes** → Leaf A  
       - **No** → Node 2  

  2. **Node 2 (Test Case 1)**:  
     - Consider *"Lying isn’t wrong"*. Is this just expressing the opposite attitude of *"Lying is wrong"*?  
       - **Yes** → Node 3  
       - **No** → Node 4  

  3. **Node 3 (Test Case 6)**:  
     - Can someone who rejects *"Lying is wrong"* and *"Stealing is wrong"* sincerely accept *"If lying is wrong, then stealing is wrong"*?  
       - **Yes** → Node 5  
       - **No** → Leaf B  

  4. **Node 4 (Test Case 5)**:  
     - Does *"Either lying is wrong or the train is late"* express a single, unified attitude (e.g., a state of uncertainty)?  
       - **Yes** → Leaf C  
       - **No** → Node 6  

  5. **Node 5 (Test Case 7)**:  
     - When we say *"She thinks lying is wrong"*, does this mean she has the same attitude as someone who says *"Lying is wrong"*?  
       - **Yes** → Leaf D  
       - **No** → Node 7  

  6. **Node 6 (Test Case 8)**:  
     - A theorist says: *"‘Lying is wrong’ expresses disapproval of lying."* When she says this, is she *expressing disapproval of lying*?  
       - **Yes** → Leaf E  
       - **No** → Node 8  

  7. **Node 7 (Test Case 2)**:  
     - Can we say *"There’s a 30% chance that lying is wrong"* and mean it like *"There’s a 30% chance of rain"*?  
       - **Yes** → Leaf F  
       - **No** → Leaf G  

  8. **Node 8 (Test Case 3)**:  
     - When someone asks *"Is lying wrong?"* (as a real question), are they trying to decide what attitude to have?  
       - **Yes** → Leaf H  
       - **No** → Leaf I  

  9. **Node 9 (Test Case 4)**:  
     - Is *"Don’t lie!"* different from *"Lying is wrong"* only in grammatical mood?  
       - *(All paths from Node 9 return to their prior branch; this node refines commitments without splitting leaves.)*  

