prompt: |-
  I practice public international law, mainly on the recognition of governments and the formation of customary rules, and I am thoroughly fluent in that vocabulary: effectiveness and de facto control, the declaratory and constitutive theories of recognition, state practice and opinio juris, peremptory norms, and the duty not to recognize situations brought about by unlawful force. Take Pascal's case on justice and force in the Pensées — justice without force is impotent and force without justice tyrannical; since we cannot make what is just strong, we have made what is strong just; custom, rather than any justice accessible to us, is what secures obedience; and the people must therefore be taught to obey their superiors because they are superiors rather than because they are right — and restate it claim by claim in my vocabulary. Do the same for his counsel to the young nobleman in the Three Discourses on the Condition of the Great: outward deference is owed to rank, but inward esteem is owed only to genuine merit, since a man's elevation rests on a chain of accidents. Keep the translation honest; do not import my discipline's presuppositions and then credit them to Pascal. Then give me the residue report, separating (a) claims that map directly onto existing doctrine such as effectiveness or opinio juris, (b) claims that map only after some distortion, which you should name, and (c) claims that have no expression at all in my vocabulary. For category (c), tell me whether the gap marks a genuine blind spot in the lawyer's toolkit or shows that Pascal's claim was less determinate than it sounds.
