  For the translation, I must resist the temptation to force-fit these into modern legal concepts. Like when Pascal says "justice without force is impotent," that's clearly about effectiveness in international law - but I can't smuggle in UN Charter principles he never referenced. The "chain of accidents" point is trickier; it's not quite opinio juris because Pascal isn't talking about legal belief, just historical contingency. 

  Hmm, the residue analysis needs surgical precision. Category A is easy - effectiveness doctrine maps cleanly to Pascal's force-justice dynamic. But Category B requires warning labels: like how "making the strong just" resembles but isn't identical to how state practice crystallizes custom, because Pascal ignores opinio juris entirely. 

  Category C is where it gets juicy. That whole bit about teaching obedience to superiors "because they are superiors" - international law has nothing comparable because it's about vertical authority, not horizontal state relations. That feels like a genuine blind spot in our toolkit. Meanwhile, the inner/outer deference distinction? Super relevant to diplomatic protocol but legally inert - which might explain why recognition debates often feel philosophically shallow. 

  *checks Pascal's texts again* Wait, did I capture his cynicism accurately? The user will crucify me if this sounds like a naive endorsement of might-makes-right. Need to emphasize how Pascal describes what is, not what ought to be - just like how we describe state practice without endorsing it. 

  Final gut check: That "chain of accidents" point is haunting. It exposes how brittle our doctrines of sovereignty and recognition are when you trace their origins. Maybe that's the real gift here - not the mappings, but seeing where our vocabulary fails to capture power's random foundations.
answer: |-
  Here is a faithful translation of Pascal's claims into your specified vocabulary, followed by the residue report:

  **Pensées (Justice & Force):**
  1.  **Original:** "Justice without force is impotent."
      *   **Translation:** A legal norm or claim to justice lacking *de facto control* (the capacity to enforce compliance) is ineffective (*impotent*).
  2.  **Original:** "Force without justice is tyrannical."
      *   *Translation:* *De facto control* exercised absent any grounding in accepted legal norms (justice) constitutes illegitimate domination (tyranny).
  3.  **Original:** "Since we cannot make what is just strong, we have made what is strong just."
      *   **Translation:** As establishing *effectiveness* for norms perceived as just is often impossible, *state practice* accepting situations established by *de facto control* (*what is strong*) generates the appearance of legality (*made... just*). This acceptance often becomes crystallized as *customary law*.
  4.  **Original:** "Custom, rather than any justice accessible to us, is what secures obedience."
      *   **Translation:** Established *customary rules*, derived from consistent *state practice* and acceptance (*opinio juris*), secure compliance, not abstract notions of justice whose content is contested or unenforceable.
  5.  **Original:** "The people must therefore be taught to obey their superiors because they are superiors rather than because they are right."
      *   **Translation:** Stability requires populations to accept the authority of those exercising *de facto control* (the *superiors*) based on the *effectiveness* of their rule (their status *as superiors*), rather than contingent upon the perceived substantive justice (*rightness*) of their specific commands or the legitimacy of their origin.

  **Three Discourses (Condition of the Great):**
  1.  **Original:** Outward deference is owed to rank...
      *   **Translation:** Formal acts of *recognition* (diplomatic protocol, engagement) are accorded to entities possessing *de facto control* and holding positions of authority (*rank*), irrespective of origin, as required by the stability of international relations and the *declaratory theory* (acknowledging facts).
  2.  **Original:** ...but inward esteem is owed only to genuine merit...
      *   **Translation:** Moral approval or intrinsic legitimacy (*inward esteem*) is contingent upon adherence to fundamental legal principles, including *peremptory norms* (*jus cogens*), and the perceived justice of the entity's actions (*genuine merit*).
  3.  **Original:** ...since a man's elevation rests on a chain of accidents.
      *   **Translation:** The acquisition of *de facto control* and consequent entitlement to *recognition* is often the result of contingent historical events and power dynamics (*a chain of accidents*), not necessarily a reflection of inherent legal right or moral desert.

  ---

  **Residue Report:**

  **(a) Direct Mappings to Existing Doctrine:**
  1.  **Justice without force is impotent:** Maps directly to the foundational principle of **effectiveness** (*de facto control*) as a prerequisite for legal claims or norms to have practical consequence. Impotence = lack of enforceability/real-world impact.
  2.  **Since we cannot make what is just strong... made what is strong just:** Maps directly to the process of **customary international law formation**. *State practice* (what is strong/effective) coupled with *opinio juris* (acceptance as law) transforms factual power into legal right (what is strong *becomes* just/legal).
  3.  **Custom... secures obedience:** Maps directly to the function of **customary rules** derived from **state practice** and **opinio juris** as the primary source of obligation securing compliance in the international system.
  4.  **Outward deference is owed to rank:** Maps directly to the practice of **recognition (declaratory theory)**, where acknowledging entities with *de facto control* is a practical necessity for orderly relations, distinct from moral approval.

  **(b) Mappings Requiring Distortion (and the Distortion Named):**
  1.  **Force without justice is tyrannical:** Maps to the **duty of non-recognition** (*duty not to recognize situations brought about by unlawful force*) but *only with significant distortion*.
      *   **Distortion:** Pascal's "tyranny" is a broad moral/political condemnation. The legal *duty of non-recognition* applies only to *specific, severe breaches* of *jus cogens* (like aggression, denial of self-determination) creating situations. Pascal's concept is far broader, encompassing any exercise of power perceived as unjust, not limited to breaches of peremptory norms creating new situations. The legal doctrine is a narrow exception, not a general characterization of unjust power.
  2.  **The people must... obey... because they are superiors...:** Maps loosely to the principle of **effectiveness** but *requires distortion*.
      *   **Distortion:** Effectiveness in international law pertains to the factual control of a *government* or *state* over territory/population, relevant for *recognition by other states*. Pascal is describing the *internal psychological basis for obedience by a population* to *any* superior authority. The legal concept deals with external state practice regarding entities; Pascal deals with internal social psychology and political obligation. Mapping "obedience because they are superiors" directly to "effectiveness" distorts the latter by applying it to the internal dimension of legitimacy/popular acceptance, which is not the doctrine's primary focus.
  3.  **Inward esteem is owed only to genuine merit:** Maps loosely to **peremptory norms (jus cogens)** and the **duty of non-recognition** but *requires distortion*.
      *   **Distortion:** "Inward esteem" is a personal moral judgment. *Jus cogens* and the *duty of non-recognition* are objective legal norms binding *states*. Mapping personal moral judgment ("inward esteem") onto objective state obligations ("duty") distorts the nature of the legal concepts. While adherence to *jus cogens* might *inspire* "inward esteem," the legal duty is externally imposed on states, not an internal feeling owed by individuals.

  **(c) No Expression in Vocabulary & Analysis:**
  1.  **The Primacy of Obedience for Stability ("obey... because they are superiors"):** International law has no direct doctrine mandating or describing the *psychological basis* for *popular obedience* to authorities as essential for stability. It focuses on the *fact* of control (effectiveness) and the *external* responses of *states* (recognition/non-recognition). The internal social contract/obedience dynamic is outside its scope.
      *   **Gap Analysis:** This marks a **genuine blind spot** in the lawyer's toolkit. International law, focused on inter-state relations and objective criteria like effectiveness and state practice, largely ignores the internal sociological and psychological mechanisms (like Pascal's teaching of obedience to superiors *qua* superiors) that underpin the stability of the entities (states/governments) it deals with. It takes the existence of relatively stable entities as a given, without a vocabulary for *how* that internal stability is achieved or maintained beyond the brute fact of control.
  2.  **The Contingency of Power ("chain of accidents"):** While effectiveness acknowledges the factual origin of control, international law doctrine (particularly regarding statehood and government recognition) generally treats the *origin* of power as legally irrelevant once effectiveness is established (the declaratory theory). There's no doctrine explicitly stating that authority rests fundamentally on historical contingency/accident. *Opinio juris* concerns *current* belief in legality, not historical accident. The *duty of non-recognition* addresses only *specific unlawful* origins (aggression), not contingency generally.
      *   **Gap Analysis:** This highlights that Pascal's claim is **less determinate than it sounds** *in a legal context*. While the observation is often empirically true, international law deliberately avoids making the *legitimacy* of current effective control contingent on its historical origins (except for specific breaches of *jus cogens*). It focuses on the present fact of control and the systemic need for order. Pascal's point is a profound philosophical/political observation about power's origins, but international law doctrine consciously avoids incorporating such a generalized principle of contingent origin into its core concepts like recognition and effectiveness, prioritizing present stability over historical audit. The lack of mapping reflects a deliberate doctrinal choice, not a blind spot to the fact of contingency.
