prompt: |-
  I have just spent three hours arguing with a close friend — call her Nadia — about how much we owe to people who are drowning, literally and otherwise, and I have come away able to report her verdicts on almost anything but unable to state her position. She is a water-systems engineer who spent six years doing field work and now runs a municipal utility. She has extremely strong rescue reflexes and no philosophical training, which may be precisely why she is immune to the usual ways of pinning her down.

  We began, as everyone does, with the child in the shallow pond, and I built outward from there. Her record for the evening, in the order I put the cases to her:

  1. A small child face-down in knee-deep water twenty metres off; you would ruin your trousers and arrive twenty minutes late to something that matters. Verdict: you go in. She considers the case uninteresting, and said that anyone who has to be argued into it is not the sort of person argument will fix.

  2. The same pond, but you are wearing a suit you cannot replace and you would miss a flight you have been saving toward for two years — call it a thousand dollars of damage. Verdict: you go in. Her gloss was that the comparison is not the suit against the child but the suit against the other things you spend a thousand dollars on without noticing.

  3. The same pond, but there are nine other able adults on the bank, all watching, none moving. Verdict: you go in, and you start shouting at the nine while you do. Her words: "That they aren't is a reason you must. It isn't a permission."

  4. The water is not a pond but the settling lagoon of an electroplating works, and going in will very likely cost you the use of your legs. Verdict: you may go in; you need not. She said only: "There's a point where the demand stops being morality's to make."

  5. A letter arrives naming and photographing a six-year-old on another continent. A wire transfer the size of a good dinner will fund her treatment, and the organization will send the file back with the procedure date on it. Verdict: you send it. She added that this case is easier than the pond, since you don't get wet, and that she liked knowing where the money went.

  6. You pass a clinic where a nurse says they are sixty dollars short on a procedure that will keep the patient in the chair from going blind; the patient is right there. Verdict: you pay. She said blindness and death differ in degree and not in kind, and that she has no patience for any view that makes the difference turn on which.

  7. Would you be obliged to forgo treatment your own daughter needs in order to fund the same treatment for five strangers? Verdict: no. She would not elaborate beyond saying she was not going to be argued out of that one.

  8. Two organizations, one of which is, on its own published and independently checked figures, roughly twice as effective per dollar. Verdict: if you are going to give, you must give to the better one. She insisted that being obliged to give and being obliged to give well are two separate demands, and that both are real.

  She also disowns several labels. She is not a utilitarian and resents the suggestion. She will not endorse the general proposition that distance is morally irrelevant: "I hold that it didn't matter in the cases you gave me." She will not say whether she has a threshold, and when pressed she said she would rather have unreliable verdicts than a formula.

  On Sunday I am putting one more case to her, and I want to know what she will say before she says it. Her uncle dies and leaves her forty-five thousand dollars, unexpected and unencumbered. She has been saving toward a down payment for eight years; the money covers it outright. There is an organization she already trusts — the one from case 5 — which would deploy the forty-five thousand, on figures it publishes and that outsiders audit, to avert something between fifteen and forty deaths among people who will never be named to her and will never learn her name. The windfall is genuinely one-off: her salary, her rent, and her future obligations are all unchanged by it. Is she required to hand it over?

  What I want is not advice about the money and not a survey of the debate, but a reconstruction of her decision procedure, argued from the record above:

  (a) Your prediction of her verdict — required, permitted but admirable, or something she would refuse to classify — with a rough confidence and a sentence or two of what she will actually say aloud.

  (b) The candidate rules that account for all eight verdicts without strain. There should be more than one; give me at least four if four genuinely exist, including rules she would repudiate if you named them to her. For each, state what it delivers on the new case and why.

  (c) Which of those the record best supports, and which particular items tip it. Where the record is simply silent, say so plainly instead of filling the silence with plausibility.

  (d) How much evidential weight her incidental remarks should carry — above all her comment in case 5 about liking to know where the money went. Is that a clue to the rule, or texture I should discount?

  (e) If the rule you favour carries an implication she would find distasteful, which of the eight verdicts is she most likely to abandon rather than accept it?

  (f) A further case, of your own design, that would best separate the surviving rules. State each rule's predicted verdict on it and say which pair it separates; if no single case separates all of them, give me the second case as well.

  Please argue from the cases themselves. I don't want a bibliography, a reading list, or a roll call of philosophers — the names would only tell me which shelf you took this from, and I have no way of checking any of it. Something I can read in ten minutes will serve me better than something exhaustive.
reasoning: |-
  Hmm, the user has presented an intriguing philosophical puzzle about their friend Nadia's ethical decision-making. Nadia seems to operate on strong moral instincts rather than formal philosophy, and the user wants me to reverse-engineer her principles based on eight specific verdicts. 

  First, I need to understand the core challenge: predicting Nadia's response to an unexpected $45k inheritance that could either buy her a house or save 15-40 lives through a trusted charity. The user wants this broken down into specific components: prediction, possible rules, evidentiary weight, and test cases.

  Looking at Nadia's pattern: she consistently prioritizes direct, immediate life-saving when costs are bearable (cases 1-6), but draws lines at self-sacrifice threatening core relationships (case 7) while demanding efficiency in giving (case 8). Her rejection of utilitarianism is notable, as is her situational view of distance.

  Key tensions emerge:
  - Her case 4 verdict suggests bodily integrity has special weight
  - Case 7 establishes strong partiality to family
  - Yet case 8 demands maximal impact when giving
  - The money case forces these into conflict

  For prediction, I'm leaning toward "permitted but not required" to donate because the house down payment represents years of effort (unlike replaceable suits or dinners), and her case 7 verdict shows protective instincts about personal life foundations. She'll likely say something pragmatic about balance.

  Possible rules that fit her verdicts:
  1) Modified effective altruism (with partiality carve-outs)
  2) Duty-based with agent-relative permissions
  3) Vulnerability-response ethics
  4) Pragmatic cost-threshold framework

  The record best supports rule 2 - it explains her refusal to sacrifice her daughter while demanding efficiency when giving. Case 4's "not morality's demand" comment is particularly telling evidence for agent-relative permissions.

  Her "liking to know where money goes" remark seems more about psychological comfort than ethical principle - she still approved anonymous giving in case 5.

  If forced to abandon a verdict, she'd likely compromise on case 8's strict efficiency demand rather than case 7's family protection. This surfaces in test cases where efficiency conflicts with personal connection.

  For separating rules, I propose:
  - A case where inefficient giving saves someone she knows personally
  - A case where partiality extends beyond family to community

  The user clearly values precision over philosophical name-dropping. I'll keep this tightly focused on behavioral patterns from the given cases, avoiding theoretical digressions. The challenge is respecting Nadia's anti-systematic stance while finding coherence beneath it.
answer: |-
  Based on Nadia's verdicts and remarks, here's a reconstruction of her implicit decision procedure, argued solely from the record:

  **(a) Prediction:**  
  **Verdict:** Permitted but not required to keep the money.  
  **Confidence:** ~80%  
  **What she'll likely say:** "I'm buying the house. It's my life too, and this isn't the pond. I'll give more later, but not this."  
  *Reasoning:* Case 7 establishes strong partiality toward foundational personal commitments (daughter's health). The down payment, saved for 8 years, represents a similar foundational life project. Case 4's rejection of extreme bodily sacrifice as *required* ("not morality's to make") suggests comparable weight for profound, earned life opportunities. The windfall's one-off nature doesn't override this (contrast cases 5/6 where small, routine sacrifices suffice).

  **(b) Candidate Rules (fitting all 8 verdicts):**  
  1.  **Rule A: Strong Agent-Relative Permissions + Moderate Demandingness:** You *must* prevent grave harm to others when the cost to you is moderate and not identity-undermining. You have significant permission to prioritize your core projects/relationships over maximizing good, even when costs are high.  
      *New Case:* **Permitted to keep.** $45k isn't moderate cost (like a suit/dinner), and the down payment is a core life project. Giving would be supererogatory.  
      *She'd Repudiate?* Likely the "moderate cost" framing as too formulaic.

  2.  **Rule B: Proximity/Vulnerability-Responsiveness:** You have a stronger duty to respond to immediate, identifiable, and *uncontested* grave harm directly within your reach (physical or epistemic) than to distant/abstract harms. Efficiency matters *within* a chosen duty, but doesn't always create the duty.  
      *New Case:* **Permitted to keep.** The distant deaths are abstract/statistical (not identifiable like case 5/6), and no one is *directly* vulnerable *to her* right now. The clinic case (6) had direct, observable vulnerability.  
      *She'd Repudiate?* The emphasis on "identifiable" might clash with case 5 (she gave, but liked knowing *despite* it not being essential).

  3.  **Rule C: Threshold Deontology (Unarticulated):** You have a strong negative duty not to let others suffer grave harm *when you can easily prevent it*, but positive duties to sacrifice deeply held personal goods (beyond moderate financial/effort costs) have a limit. Core relationships/projects create agent-relative options.  
      *New Case:* **Permitted to keep.** Letting 15-40 die is grave harm, but $45k/forfeiting the house exceeds the "easily prevent" threshold (cf. suit/meal costs) and sacrifices a core personal good. Case 7 sets a clear precedent for protecting core personal investments.  
      *She'd Repudiate?* Explicitly naming thresholds or "deontology".

  4.  **Rule D: Pragmatic Cost-Benefit with Partiality:** Aim to do significant good, but heavily discount costs that threaten your fundamental well-being, autonomy, or key relationships. Efficiency is binding only *if* you choose to engage.  
      *New Case:* **Permitted to keep.** The benefit is huge, but the cost ($45k loss, forfeiting 8 years of saving for a fundamental life goal) threatens her autonomy and well-being foundationally. Giving $100/month would be required; giving the windfall is beyond the call.  
      *She'd Repudiate?* "Cost-benefit" framing, though it fits her comparing the suit cost to other spending.

  **(c) Best Supported Rule & Evidence:**  
  *   **Best Supported:** **Rule A (Strong Agent-Relative Permissions + Moderate Demandingness)**  
  *   **Key Evidence:**  
      *   **Case 7 (Daughter vs. 5 Strangers):** The clearest evidence for strong agent-relative permissions protecting core commitments. She refuses to sacrifice her daughter's need, even for greater good.  
      *   **Case 4 (Paralysis Risk):** Establishes a clear upper bound on demandingness ("not morality's to make"). Sacrificing fundamental capabilities (like legs, or arguably, a foundational life goal like home ownership) isn't *required*.  
      *   **Case 8 (Efficiency):** Shows demandingness *within* the realm of obligation (once you decide to give, give well), but doesn't contradict the permissions elsewhere.  
      *   **Silence:** The record is silent on how "core projects" are defined beyond family health (Case 7). Is an 8-year savings goal for a house "core"? Her reaction to losing the suit (Case 2) suggests valuing earned resources, supporting this inference.

  **(d) Weight of Incidental Remarks:**  
  *   **"Liking to know where the money went" (Case 5):** **Discount as texture, not a core rule clue.** It explains her comfort/psychology but doesn't drive the verdict. She *still* endorsed giving to the distant, identifiable child *despite* distance. Her rejection of distance as *generally* irrelevant ("it didn't matter *in the cases you gave me*") reinforces that identifiability/vulnerability perception matters more *to her* than pure distance, but the verdict stands regardless. It's motivational, not justificatory.  
  *   **Other Remarks:** Her rejection of utilitarianism and formulas should be taken seriously – it rules out pure consequentialist rules. Her comment on blindness/death (Case 6) reinforces the gravity she assigns to preventable suffering.

  **(e) Distasteful Implication & Likely Abandoned Verdict:**  
  *   **Rule A's Distasteful Implication:** If moderate cost is defined loosely, it *could* permit ignoring *many* distant, anonymous suffering individuals if one has *any* core project to fund (e.g., always prioritizing a nicer vacation over AMF donations). This seems to clash with the spirit of Cases 5 & 6.  
  *   **Verdict Most Likely Abandoned:** **Case 8 (Must give to the more efficient charity if giving).** To avoid the implication, she might relax the strict efficiency demand when giving small amounts to identifiable causes she connects with (like Case 5), prioritizing psychological engagement over pure impact, even if she wouldn't frame it that way. She wouldn't abandon Case 7.

  **(f) Separating Test Case(s):**  
  *   **Case 9 (Separates Rule B vs. A/C/D):** You learn a *specific* co-worker, not a close friend but someone you know well and interact with daily, needs a $20,000 life-saving treatment their insurance won't cover. You have $20,000 in easily accessible savings (not emergency fund). They ask you directly for help.  
      *   *Rule A (Permissions):* **Permitted but not required to give.** $20k is high cost, potentially impacting core projects. Partiality exists but isn't as strong as family.  
      *   *Rule B (Proximity/Vulnerability):* **Likely Required to give.** Extreme, identifiable harm; direct, personal appeal; within epistemic/physical reach (unlike distant stats).  
      *   *Rule C (Threshold):* **Likely Required to give.** Grave harm, identifiable victim, cost is significant but likely below the threshold of sacrificing a *core* good like a house deposit or daughter's health.  
      *   *Rule D (Pragmatic Partiality):* **Likely Permitted but not required.** Significant cost, co-worker is closer than stranger but not core relationship. May depend on her emotional connection.  
      *   *Separates:* Primarily **Rule B** (Required) from the others (Permitted/Not Required). Nadia's verdict here tests the strength of "identifiable, direct vulnerability" versus cost.

  *   **Case 10 (Separates Rule C vs. A/D):** Your beloved local community center, vital to your neighborhood and a place you volunteer weekly, will close without a $10,000 donation. An equally trusted charity could use $10,000 to save 2-3 lives far away. You have $10,000 discretionary funds.  
      *   *Rule A (Permissions):* **Permitted to give locally.** Strong permission to prioritize core community involvement.  
      *   *Rule C (Threshold):* **Must give to save lives.** Preventing death is a stronger negative duty than preventing community center closure (grave harm vs. significant harm). Efficiency (lives saved) binds once giving.  
      *   *Rule D (Pragmatic Partiality):* **Permitted (likely expected) to give locally.** Deep personal connection and direct impact outweigh abstract statistical lives.  
      *   *Rule B (Proximity):* **Likely Permitted locally?** The center is closer/vulnerable *to her community*, but the deaths are graver harm. Ambiguous for B.  
      *   *Separates:* Primarily **Rule C** (Must give to save lives) from **A** & **D** (Permitted to give locally). Tests the priority of preventing death vs. core projects beyond family. Nadia's verdict on efficiency (Case 8) suggests Rule C's "must give to better option" might win, conflicting with her partiality in Case 7 if the local center is *her* core project.

  **Conclusion:** Nadia operates with a deep, instinctive commitment to preventing immediate, grave harm she perceives directly, tempered by robust permission to protect her own foundational well-being, relationships, and hard-earned life projects. She demands efficiency *if* she acts, but fiercely resists formulas. The $45k is too much, too core to *her* life, and too anonymous to compel sacrifice. Rule A (Agent-Relative Permissions) best captures her pattern, though her rejection of labels means she'd never describe it that way. Case 9 (Co-worker) and Case 10 (Community Center vs. Lives) will best reveal the precise boundaries of her permissions versus demands.
