  ## Ask Consentius: Pastoral Guidance for Perplexed Souls  
  *From the Bulletin of St. Pacian's Parish & Oratory, Vol. XII, No. 11*

  **Dearest Readers,**

  Blessings upon you in the light of Christ our Truth! I am Brother Consentius, your humble servant in matters of the heart and soul. As we navigate this vale of tears, the Enemy often whispers that a little untruth might smooth the path. But recall St. Augustine’s wisdom: speech is given to manifest the heart, not to cloak it in duplicity. A lie, however small, is a sickness of the *duplex cor* – the double heart. Bring me your dilemmas, and I shall strive to guide you with the clarity of doctrine and the warmth of charity, ever mindful that we must never purchase another's fleeting safety with the death of our own soul. Write freely; I read each letter with prayer.

  **Yours in Christ the Word,  
  Brother Consentius**

  ---

  **Q: Hiding My Brother-in-Law?**  
  *Anxious in Antioch*

  *Dear Brother Consentius, My sister’s husband fled here last week, terrified. Men who loaned him money seek to break his legs – or worse! He’s hiding in my root cellar. Yesterday, two rough-looking fellows pounded on my door demanding if I knew where he was. My tongue froze! What should I say if they return? Can I deny he’s here to save him? My sister begs me to protect him!*

  **A:** Beloved Anxious, your distress is palpable, and your desire to shield kin is natural and good. Yet, the peril to your brother-in-law’s body, however grave, cannot justify a peril to your immortal soul. To utter a falsehood – to say “He is not here” when he is – would be to plunge that soul into the darkness of sin. Remember Augustine: the temporal safety of the body is fleeting; the soul’s health is eternal. You possess righteous tools! Silence itself bears witness only to God. If pressed directly, “I will not tell you where he is” speaks truth without capitulation. Should they demand a simple “Is he here?”, you may answer with a question guided by charity: “Why do you seek to harm this man?” Or, declare only the truth you hold inviolably in your heart: “I desire only his safety and repentance for debts owed.” Trust that God, who sees the hidden man, also sees your truthful heart. His justice surpasses our understanding. Pray for your brother-in-law’s safety and his creditors’ softened hearts. Your silence or truthful deflection harms no one; a lie harms your very being.

  ---

  **Q: Snowflake is in Dog Heaven?**  
  *Worried Widower in Wessex*

  *Brother, my little Caius (age 6) is heartbroken. Snowflake, our beloved old hound, passed peacefully in his sleep. Caius keeps asking, “Is Snowflake coming back? Is he in heaven with Grandpa?” My wife used to handle these things… gently. Must I tell my son the stark truth that dogs have no immortal soul? It feels so cruel. Can I not offer him a comforting fiction?*

  **A:** Worried Widower, your tenderness for your son’s grief is a father’s true love. Yet, love must never clothe itself in falsehood. To tell Caius that Snowflake enjoys the Beatific Vision would be a lie concerning doctrine – the gravest kind, poisoning the well of truth itself. However, Augustine teaches that jests and fictions are permitted *when no deception is intended or effected*. Caius, in his tender understanding, seeks comfort, not theological precision. You may say, “Snowflake is at perfect peace, dear one. God cares for all His creatures, and Snowflake rests now, free from pain.” This is true. You may add, “We remember Snowflake’s love and loyalty, and that love stays in our hearts.” This is also true. Focus on the reality of love and loss, which the child feels deeply. Comfort him with your presence and shared tears, not with inventions about the afterlife God reserves for rational souls. Truth, spoken gently, builds trust; fiction, however kind its intent, erodes it.

  ---

  **Q: Will Mother See Dawn?**  
  *Nervous Nurse in Nicaea*

  *Brother Consentius, I serve in the hospice. A devoted family gathers around their matriarch, fading fast. Her son, eyes desperate, corners me: “Nurse, tell us truly, will Mother last the night? We need to fetch Father Elias!” I see the signs: she likely has mere hours. But what if I’m wrong? Telling them “she is dying now” might cause panic if she lingers. Can I offer vague hope? “Perhaps, pray for her”?*

  **A:** Faithful Nurse, your calling is one of mercy, and your hesitance springs from compassion. Yet, the truth of God must be your lantern. You are forbidden to utter a false reassurance: “She will surely last the night” if you believe otherwise. But neither are you required to pronounce a definitive sentence you cannot guarantee! Use the tools of the truthful. State what you know *with certainty*: “Her condition is very grave and declining.” Or, “The signs are concerning; I urge you to summon Father Elias with all haste.” You may answer the implicit plea: “If you wish Father Elias here, send for him *now*.” This focuses them on the necessary action without venturing a prophecy you cannot own. Your duty is to convey the evident peril truthfully and urge the spiritual care she needs. A vague “perhaps” offered where you hold a contrary belief *in your heart* would be that fatal doubling, a whisper of the *duplex cor*. Speak the grave truth you possess; let God govern the hours.

  ---

  **Q: Infiltrating the False Prophets?**  
  *Zealous in Zela*

  *Brother, righteous anger consumes me! My sister has fallen in with the Manichaean circle here. They exploit her wealth and warp her faith. I know their leader trusts me not. But if I feigned interest in their doctrines, even professed a false belief, I might gain entry and extract her! Since they themselves teach deception is licit under persecution, surely God permits me to use their own tools against them?*

  **A:** Zealous One, your love for your sister shines bright, and your horror at her deception is righteous. But beware! The Devil tempts you to fight fire with hellfire. St. Augustine confronted this very question: may we lie to trap liars? His answer, grounded in divine law, is unequivocal: **No.** The gravity here is immense – a lie touching faith and doctrine. You propose to utter falsehoods about the very nature of God and salvation. Even if your *intention* is rescue, the *act* is a mortal sin, a corruption of the soul. You cannot save your sister by damning yourself. Remember: bodily freedom is temporary; the soul’s state is eternal. You *cannot* bargain one for the other. Instead, speak truth to your sister relentlessly, with love. Petition righteous authorities if exploitation is provable. Pray without ceasing for her deliverance. But do not become what you abhor. To lie about God, even to save kin, is to strike at Truth Himself. Your soul is too precious a coin.

  ---

  **Q: I Already Lied About the Figs!**  
  *Ashamed in Aquileia*

  *Brother, I need consolation! My neighbor’s fig tree overhangs my wall, and the fruit is magnificent. Yesterday, he asked, “Have you picked any of those figs hanging your side?” Flustered, and not wanting him to think me greedy, I blurted, “Oh, no, not a single one!” But I had picked three just that morning! It was foolish, and over mere figs! I confessed it privately, but I feel wretched. How grievous is my sin?*

  **A:** Dear Ashamed, your contrition is a balm and the first step back to grace! Take heart. Augustine teaches that lies vary in gravity. Your falsehood, concerning a trivial matter (worldly possessions, figs), told not to harm but perhaps from a foolish impulse to avoid minor embarrassment, and which harmed no one materially, ranks among the *least* grievous lies – the *jocose* or *officious* lie of small account. It remains a sin, a wound on the soul’s integrity, for it sprang from that doubled heart unwilling to own a simple, harmless truth. But its gravity is light compared to lies about doctrine or those causing grave harm. Your private confession is good, but seek sacramental confession for the absolution that brings full peace. Perform a small penance – perhaps offering your neighbor a basket of *your* best fruit with a prayer for honesty. Then, forgive yourself as God forgives you. Resolve to embrace even small truths with courage. Your distress shows your heart is healing.

  ---

  **A Note from the Editor, Fr. Auxentius:**

  Brother Consentius’s counsel, unwavering in its adherence to St. Augustine’s profound (and profoundly challenging) prohibition against all lying, may strike many as impossibly rigorous. Does the permission for silence, deflection, and rigorously parsed truthful speech render the absolute ban functionally coherent, or does it reveal an untenable idealism?

  **We argue the absolutism survives.** Augustine’s system is not merely coherent; it exposes the profound *difference* between refusing to manifest an unwanted truth (via silence or refusal) and actively manifesting falsehood. The former preserves the integrity of the heart-mouth connection; the latter severs it, constituting the essential evil of the lie – the *duplex cor*. The "workarounds" are not loopholes but distinct moral categories *defined* by their adherence to truthfulness *in the act of communication*. Consentius correctly rejects "mental reservation" (thinking one thing while saying another) – a later mitigation Augustine *would* have condemned as disguised lying. The hierarchy of lies (doctrinal worst, minor jocose lies least) provides proportional culpability without negating the fundamental sinfulness of all lies.

  **Where did we take liberties?**  
  1.  **Jest:** Augustine *does* exempt jokes *where all understand it’s fiction*. The line blurs when comforting a child; Consentius leans heavily into the "no deception intended/effected" criteria. Augustine might be stricter.
  2.  **Misleading Truth:** Consentius pushes the envelope on answering questions with questions or urging action ("Send for him *now*") as "truthful deflection." Augustine endorses silence and refusal, and technically permits statements that are *objectively* true even if misleading *in context*, but he exhibits deep suspicion towards *intending* to mislead. Consentius’s suggestions sail close to that wind, though he anchors them in stated beliefs ("I desire only his safety").
  3.  **Grading Lies:** The ranking (doctrinal worst, jocose least) is authentically Augustinian and crucial to his case against consequentialism – a minor lie is still sin, but less catastrophic than perverting faith. Consentius applies this correctly.

  The piece’s humor stems precisely from applying this rigorous, internally consistent framework to messy human dilemmas, revealing its pastoral cost *without* misrepresenting the doctrine. Augustine demands we value truth above *all* temporal consequences. Consentius shows us what that looks like, kindly, implacably, and often, impossibly. *Sit Deus in corde et veritas in ore nostro.* May God be in our heart and truth on our lips.
