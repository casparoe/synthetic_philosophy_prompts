          So the system might still function. The only problem is if the entire room has no gold because they all deposited it? Then they can still trade internally with paper, but no one can buy tea because no one has gold. Then the foreign desk doesn't sell any tea. 

          That's the consequence: if the whole economy locks up its gold, then it loses the ability to import. 

          But Hume's bank was supposed to lock up the gold and issue paper, and then the paper would be used internally and the gold would be there for external payments? But if the gold is locked up, how can it be used for external payments? 

          The idea is that the bank would hold the gold and then use it to pay for imports? But then it's not locked up forever? 

          Hume's text: "the best bank in the world" would be one that "locked up all the money it received, and never augmented the circulating coin" (paraphrase). He means that the bank does not lend the money out. So the paper is fully backed and there is no expansion of the money supply. 

          But then if the paper is used internally, the gold is still there for external payments? Only if the paper is not presented for redemption? But if the paper is presented for redemption, the bank must pay gold? 

          I think we are misinterpreting. In a fully backed system, the paper is redeemable. Then the gold can be used for external payments when someone redeems paper for gold and then uses the gold to import.

          But in our game, if we allow redemption, then the group that wants to import can redeem paper for gold and then use the gold to buy tea.

          So why would the foreign desk refuse the paper? They refuse because they are foreign and don't trust the paper. So the paper is only for internal use.

          Then the system works as long as the bank has gold to redeem for anyone who wants to import. 

          But if the bank lends the gold out? Then it might not have enough. But we are not lending.

          So in our game, the bank is fully backed and allows redemption. Then there is no problem. 

          But the original problem was counterfeit money that foreigners won't take. And Hume says that such paper is a problem. But if it's fully backed and redeemable, then it's not counterfeit? 

          Let me reread the request: "paper notes that the TA's foreign desk flatly refuses to accept for anything, so students discover that chips and notes behave differently even when the two are nominally interchangeable inside the room."

          So we are making the paper not accepted by the foreign desk, but accepted internally. And we don't allow redemption? Then the paper is fiat internally but not accepted externally. 

          To solve the problem of needing gold for imports, groups that want to import must have not deposited all their gold? Or they must have a way to get gold. 

          We can allow redemption: groups can take white chips to the bank and get gold back (at any time). Then they can use the gold for imports. 

          Then the paper is as good as gold because it can be redeemed. But the foreign desk still won't take the paper? Only the bank will redeem it. 

          So the process for a group to import tea:
            - If they have gold: they can use it directly.
            - If they have paper: they go to the bank, redeem paper for gold, then use gold to buy tea.

          Then the paper is just a substitute for gold internally and can be converted to gold for external use. 

          And that is a well-functioning system. 

          But then what is the problem? 

          The problem Hume was worried about was overissue: if the bank issues more paper than gold, then when many people try to redeem, the bank fails. 

          But we are not doing that. 

          The request says: "Hume's suspicion about a counterfeit money foreigners won't take". So if the paper is not redeemable, then it's counterfeit? Then in our game, if we do not allow redemption, then the paper is not convertible and therefore cannot be used for imports. 

          So we choose not to allow redemption. Then groups that have paper cannot get gold, so they cannot buy tea. 

          Then the lesson: if you accept paper in trade, you are taking the risk that you might not be able to convert it to gold for imports. 

          And if a group is not planning to import, they might be happy with paper. 

          But also, if the whole room uses paper and no one has gold, then no one can import. 

          So groups that are net importers (of tea) will be especially cautious about holding paper. 

          We'll go with no redemption. 

     Summary of rules for Act 3:

       - The bank (TA) accepts gold deposits and issues white chips (paper) at 1:1. The gold is locked and not returned (no redemption). 
       - White chips can be used in internal trade (for food and cloth) and must be accepted at par with gold. 
       - The foreign desk does not accept white chips (only gold) for buying tea or selling cloth.

     Then in rounds 5 and 6, groups have the option to deposit gold for paper. 

     We hope that some groups will deposit and then regret it when they want to buy tea. 

     What might go wrong:

       - The students might not use the paper at all, if they are suspicious. Then the bank might not get any deposits.

       - Or they might all deposit and then no one can buy tea. Then in the next round, they might not deposit.

     We want them to experience the problem.

     To encourage deposits, we can say that the paper is more convenient (lighter, etc.) but we don't have a physical difference. 

     Alternatively, we can make a rule that internal trades must use paper? But that forces it.

     We want voluntary use. 

     We can say nothing and see what they do. 

     We might see that groups that are net exporters (like Group 2, which has cloth to sell) might not need to deposit because they get gold from exports. Groups that are net importers of tea might want to hold gold. Groups that are only trading internally might use paper.

     But we'll see.

     Finally, debrief mapping:

       - Round 1-2: Baseline. We record the typical price of food in gold. We also record utility.

       - Round 3: Lump sum injection to Group 1. We expect Group 1 to spend the money, perhaps on food and tea. If they buy food, the price of food might rise. If they buy tea, they get utility. But also, they might bid up the price of food, so other groups that sell food get more gold and then can buy more tea? So Group 1's utility might not increase as much as they thought, and other groups might benefit. Or Group 1 might buy a lot of tea and get high utility. Then in round 4, when the money is distributed, the price increase might be less and the utility more evenly distributed.

          This maps to Hume's point that the distribution of new money matters and that there is a transition period where real effects occur.

       - Round 5-6: Paper money. We expect that groups that deposit gold and then want to buy tea will be unable to unless they have cloth to sell (to get gold) or they trade internally for gold. But if many groups have deposited, then there might be a shortage of gold for imports. 

          This maps to Hume's worry about paper money that is not accepted abroad.

     Also, we want to show that hoarding gold is bad? 

       - If a group hoards gold (does not spend it), then they don't buy food or tea, so they get low utility. And they also don't provide money for circulation. But we don't have a mechanism for that.

     Instead, we want to show that if a group tries to hold onto its tokens (gold) by not spending, then they don't get utility from consumption. And also, they might be forced to spend because of the perishable food? But they can still eat their own food.

     We might not have a strong mechanism for that.

     What the game cannot reproduce:

       - Hume's claim that a growing money supply quickens industry: because in our game, production (endowment) is fixed per round. So we cannot show an increase in output.

          In the debrief, we have to explain that in a real economy, the increase in money might stimulate production because people see rising prices and are encouraged to work harder. We can suggest that if we allowed groups to produce more by working harder (but we don't have that in the game) then we might see that.

       - The tension between "money will not abandon a kingdom with people and industry" and the magistrate's duty to keep money increasing: in the game, we see that money flows out if there is a trade deficit (if groups buy more tea than they pay for with cloth) but then the foreign desk has accumulated gold? And that gold might come back if they sell more than they buy? But we have fixed the foreign desk's prices. So if a group has a trade deficit, it loses gold. But in the long run, Hume says that the money will come back because of the price-specie-flow mechanism? We don't have that because we reset endowments each round. 

          In the game, we might see that groups with trade deficits lose gold and then in the next round they have less money to spend, so they buy less and the trade deficit corrects? But we also inject money in Act 2. 

          We can point this out in the debrief: that in the long run, trade imbalances self-correct, but in the short run, money flows matter.

     Timeline:

       0-5 min: Introduction
           - Explain that there will be several rounds of trading.
           - Each group gets an endowment of food and cloth each round. 
           - They can trade internally (with other groups) and externally (with the foreign desk).
           - The foreign desk buys cloth for 1 gold and sells tea for 1 gold.
           - At the end of each round, they must consume all their food (it spoils) and they can choose to consume any amount of tea they have (each food=1 util, each tea=3 utils).
           - Tea can be saved for future rounds, but must be reported.
           - They start with 10 gold chips per group.

       5-10 min: Round 1
           - Distribute endowments (see above) and start trading.
           - After 5 min, call time. Then groups report:
               Food consumed = all food they have
               Tea consumed = (they choose) from their tea stock (starting at 0, plus any bought)
               Remaining tea? (for next round)
               Gold and white (initially no white) at end of round.

       10-11 min: Recording and resetting. TA records group reports and then redistributes endowments (same as initial) for round 2. Groups keep their gold and tea.

       11-16 min: Round 2 (same as round 1)

       16-17 min: Recording and resetting.

       Act 1 done.

       17-19 min: Introduce Act 2: "We are going to continue, but now there will be a change. In the next round, Group 1 will receive an additional 20 gold chips." Hand Group 1 the 20 gold chips.

       19-24 min: Round 3 (lump sum injection)

       24-25 min: Recording and resetting.

       25-27 min: "Now in this round, every group will receive 5 additional gold chips." Hand 5 gold chips to each group.

       27-32 min: Round 4 (distributed injection)

       32-33 min: Recording and resetting.

       Act 2 done.

       33-35 min: Introduce Act 3: "We are introducing paper money. There is now a bank run by the TA. You can deposit gold at the bank and receive paper money (white chips) at a 1:1 exchange. The paper money can be used in any internal trade (within the room) and must be accepted at par with gold. However, the foreign desk does not accept paper money. Also, note: once you deposit gold, you cannot get it back. The bank locks it away."

       35-40 min: Round 5. Groups can choose to deposit gold at the bank for paper. Then trade.

       40-41 min: Recording and resetting.

       41-46 min: Round 6.

       46-47 min: Recording and resetting.

       47-80 min: Debrief.

     Debrief:

       - Start by asking what they observed. Then map to Hume's essays.

       - Key points:

           1. In the baseline rounds, what determined utility? (Production of food and ability to buy tea, which depended on cloth endowment and trading.)

           2. In round 3 (lump sum): 
                - What happened to the price of food? (Likely rose because Group 1 had more money to spend.)
                - Did Group 1's utility increase? What about others?
                - This illustrates that the injection of money matters in the short run: the first recipients benefit before prices adjust.

           3. In round 4 (distributed): 
                - How did the price changes compare to round 3? (Less pronounced, and more even benefit.)

           4. In rounds 5-6 (paper money):
                - Did groups deposit gold? Why or why not?
                - Did any group have trouble buying tea because they had only paper?
                - This illustrates Hume's point about paper money not being accepted abroad.

           5. Also, note that the total amount of gold in the room changed over time (due to injections and also trade with the foreign desk). But did the groups' utilities depend only on the total gold? (No, it depended on how the gold was distributed and when.)

           6. Hoarding: Did any group try to hold onto their gold? What happened? (They didn't consume as much and got low utility.)

           7. Link to Hume's essays:
               - "Of Money": the total quantity of money is not what matters for the wealth of a nation (utility in our game) but the oil (money) makes trade easier.
               - "Of the Balance of Trade": the specie-flow mechanism and the short-run non-neutrality of money (the injection experiments).
               - The paper money experiment: Hume's worry about paper money that is not accepted abroad.

       - What we couldn't show: 
               - The stimulation of industry by money: because production was fixed.
               - The long-run adjustment of trade balances: because we reset endowments each round and also injected money.

       - The tension: 
               - Hume says money will not abandon a kingdom with people and industry (because trade deficits self-correct) but he also wants the magistrate to increase money if possible. 
               - In the game, we saw that trade deficits (buying more tea than selling cloth) led to gold outflow. But then in the next round, the group with less gold could buy less, so they would have a smaller deficit? That's the self-correction. 
               - But also, when we injected money, it helped in the short run? Especially if injected to exporters? 

          We can discuss: increasing the money supply might help in the short run (as in the injection rounds) but in the long run, it only raises prices. And the magistrate should do it carefully.

     Materials list:

       - Poker chips: 
             Gold: at least 10 per group * 4 groups = 40, plus 20 for the lump sum, plus 20 for the distributed (5*4) -> 80 gold chips.
             White: at least 40 (in case they deposit a lot).

       - Dried beans for food: 
             Each round: Group1:20, Group2:0, Group3:15, Group4:5 -> total per round: 40 beans.
             6 rounds: 240 beans.

       - Cloth: index cards cut into small pieces. Total per round: 
             Group1:0, Group2:20, Group3:5, Group4:15 -> 40 per round.
             6 rounds: 240 pieces.

       - Tea: we can use a different type of bean or small candies? Or paper markers. We need as many as might be bought. The foreign desk sells for 1 gold each. The maximum tea that could be bought: if all gold is used to buy tea, and initially 40 gold, then injections add 40, so total gold over 6 rounds: 40 + 20 + 20 + ...? Actually, gold carries over. We start with 40, then add 20 in round 3 and 20 in round 4, so total gold introduced: 80. But also, they can get gold by selling cloth. Per round, they can get up to 40 gold from selling cloth (if they sell all). And then they can reuse that gold. So the total tea bought might be up to (40+40+20+20+40+40) = 200? But that's the total gold they have access to. But they also use gold for internal trade? So not all will be used for tea.

          We'll have at least 100 tea units (whatever they are).

       - Group record sheets (one per group per round) and pens.

       - A whiteboard to record prices reported after each round.

     What will predictably go wrong:

       - The students might not trade much because they are shy. We can encourage them by walking around.

       - In the baseline, they might not realize they can sell cloth to the foreign desk for gold and buy tea. We can have the TA announce: "I buy cloth! 1 cloth = 1 gold" and "I sell tea! 1 gold = 1 tea".

       - In the lump sum injection, Group 1 might not spend the money. We can hint: "You have extra money, you might want to buy more tea or food."

       - In the paper money round, they might not use the paper at all. We can have the bank announce: "Get your paper money here! It's as good as gold inside the room."

       - A couple of students might corner a good: for example, Group 2 (with cloth) might try to not sell cloth unless they get a high price. But internally, the price of cloth might be bid up? However, the foreign desk buys at a fixed price. So if they try to sell internally for more than 1 gold, no one will buy because they can buy from the foreign desk for 1 gold? So the internal price of cloth should not exceed 1 gold. Similarly, food: if someone tries to gouge, buyers can go to other groups. We can let that run: it will either fail (if they ask too much) or they might succeed if there is scarcity. But with multiple groups, it's unlikely.

     We can let it run and then discuss in debrief.

     This design is complex but covers the main points. We hope that the students will experience the mechanisms and then the debrief will connect to Hume.

     Final note: the scoring (utility) is based on real consumption, not money, so they should see that money is a means to an end.
answer: |-
  ### **Humean Monetary Experiment: Game Design**  
  **Core Insight:** Students experience money as a dynamic social mechanism, not a neutral veil, by feeling the effects of distribution, velocity, and convertibility before naming them.

  ---

  ### **Roles & Setup**  
  - **Students:** 4 groups of 4 (named by colors: Red, Blue, Green, Yellow).  
  - **TA:** Runs the **Foreign Trade Desk** (FTD) at the front.  
  - **Goods:**  
    - **Food:** Dried beans (consumable, perishable each round).  
    - **Cloth:** Index card scraps (tradable, non-perishable).  
    - **Spice (import):** A rare good (e.g., raisins or distinct beans) only sold by the FTD.  
  - **Money:**  
    - **Gold Chips:** Internally *and* externally accepted (FTD takes them).  
    - **Paper Notes:** Index cards with "Bank Note" (FTD *refuses* them).  
  - **Initial Endowments (per group, per round):**  
    | Group | Food (beans) | Cloth (scraps) | Gold Chips |  
    |-------|--------------|----------------|------------|  
    | Red   | 20           | 0              | 10         |  
    | Blue  | 0            | 20             | 10         |  
    | Green | 15           | 5              | 10         |  
    | Yellow| 5            | 15             | 10         |  

  - **Utility (Scoring):**  
    - **Food consumed:** 1 util per bean.  
    - **Spice consumed:** 3 utils per unit.  
    - **Cloth has no utility** (must be traded to access spice).  
    - **Goal:** Maximize utils (revealed post-game). Money is *not* scored—utils reveal "real" wealth.  

  ---

  ### **Rules**  
  1. **Trading (5 min/round):**  
     - Groups trade internally (food/cloth for gold) or with FTD:  
       - FTD buys cloth: **1 cloth = 1 gold chip**.  
       - FTD sells spice: **1 spice = 1 gold chip**.  
     - Prices negotiated freely; no central price controls.  
  2. **Consumption:**  
     - Food *must* be consumed each round (spoils).  
     - Spice can be consumed or saved (non-perishable).  
  3. **Money Injections:**  
     - **Act 2:** New gold appears unevenly (lump sum) vs. evenly.  
     - **Act 3:** Bank (TA) exchanges gold for paper notes 1:1. Paper accepted internally *but not by FTD*. Gold is *locked away* (no redemption).  
  4. **Flow Constraint:** Gold can leave the room (via FTD) but paper cannot.  

  ---

  ### **Game Timeline (80 min)**  
  #### **Act 1: Baseline Trade (25 min)**  
  - **0-5 min:** Explain rules. Emphasize: "Trade to get what you need. FTD only takes gold for spice."  
  - **Round 1 (5 min):** Groups trade. TA records transactions/prices on whiteboard.  
  - **Round 2 (5 min):** Repeat. *Observe:* Prices stabilize? Who accesses spice?  
  - **Debrief Prep (5 min):** Groups report utils. Highlight: "Did total gold decide utils?" (Likely no—endowments matter more.)  

  #### **Act 2: Money Injections (25 min)**  
  - **Round 3: Lump Sum (10 min):**  
    - **Shock:** Hand **20 gold chips ONLY to Red group** (food-rich).  
    - Trade. *Observe:* Red buys cloth/food/spice aggressively → prices rise.  
  - **Round 4: Distributed (10 min):**  
    - **Shock:** Hand **5 gold chips to EVERY group**.  
    - Trade. *Observe:* Prices rise slower; utils spread evenly.  
  - **Debrief Prep (5 min):** Record utils. Contrast Rounds 3–4: "Who benefited when money arrived unevenly?"  

  #### **Act 3: Paper Money (20 min)**  
  - **Setup (5 min):** Introduce "Bank" (TA). Groups can swap gold for paper 1:1. Stress: "Paper works in this room, but FTD *wont take it*."  
  - **Round 5 (7 min):** Trade with paper. *Observe:* Do groups hoard gold for FTD?  
  - **Round 6 (8 min):** Repeat. *Observe:* Groups stuck with paper cant buy spice → utils drop.  

  ---

  ### **Debrief (30 min)**  
  Map game events to Hume:  
  1. **"Money is not a wheel, but oil" (Of Money):**  
     - Q: "Did more gold make everyone richer? Or did it just change prices?" → Link to utils vs. money.  
     - **Hume:** "Money is none of the wheels of trade... more like the oil." (Total money ≠ prosperity.)  
  2. **Non-neutrality in transition (Of Money):**  
     - Q: "When Red got 20 gold first, did others lose? Why?" → Price spikes hurt late receivers.  
     - **Hume:** "The good policy of the magistrate [is] only to keep [money] increasing." (Distribution/timing matters.)  
  3. **Specie flow & paper (Of Balance of Trade):**  
     - Q: "Why couldn’t you buy spice with paper? What happened when gold left the room?" → FTD rejects paper; gold outflow = lost spice access.  
     - **Hume:** "A counterfeit money... foreigners will not take." (Locking gold ensures external credibility.)  
  4. **Tension: Scarcity vs. growth:**  
     - Q: "If money flows out, should we panic? Or trust industry?" → Game shows short-term pain but self-correction (groups rebalance trade).  
     - **Hume:** "I should as soon dread... money should abandon a kingdom... yet the magistrate must keep it increasing." → **Debrief insight:** Money leaves if misallocated, but industry attracts it back.  

  ---

  ### **Predictable Problems & Fixes**  
  1. **Prices double instantly (like last year):**  
     - **Prevent with:** Asymmetric endowments and FTD trade. Red must buy cloth from cloth-poor groups, creating friction. Injections disrupt *specific* markets (e.g., spice), not all at once.  
  2. **Price-gouging:**  
     - **Let it run!** If Blue (cloth-rich) hoards, others turn to FTD or barter. Gougers lose utils (spice access). Hume: Self-interest corrects imbalance.  
  3. **Low engagement:**  
     - **Fix:** Assign roles (e.g., "Red’s trader," "Blue’s accountant"). TA announces FTD prices loudly to spark competition.  
  4. **Paper rejected internally:**  
     - **Fix:** Announce: "Paper is LEGAL TENDER in this room. Refusing it voids your trade."  

  ---

  ### **What the Game Can’t Replicate**  
  1. **Money quickening industry:**  
     - Fixed output (endowments) hides Hume’s "labour gets its spur."  
     - **Debrief supplement:** "Hume thought new money boosts effort *before* prices rise. Imagine if extra gold let you ‘invest’ to grow next round’s beans. That’s the real magic—money as a catalyst."  
  2. **Long-run specie flow:**  
     - Short rounds obscure slow adjustments.  
     - **Debrief insight:** "In the game, spice shortages forced you to export more cloth. Hume says this self-corrects trade: losing gold lowers prices, making exports competitive again."  

  ---

  ### **Materials**  
  - Poker chips (gold): 100  
  - Index cards: 100 (cloth: 40 cut into scraps; paper notes: 60)  
  - Dried beans (food): 300  
  - Spice (raisins/colored beans): 100  
  - Whiteboard: Price tracking  
  - Group record sheets (utils, gold/paper held)  

  ### **Why This Works**  
  - **Feels, then names:** Students wrestle with liquidity shocks and convertibility *before* learning "neutrality" or "specie flow."  
  - **Paper twist:** Forces a crisis only resolvable by Hume’s "locked gold" insight.  
  - **Humean tension:** The game makes "money flees but must grow" visceral—students *see* outflow pain but also self-correction.  

  This transforms Hume from text to tactile truth. When they groan as the FTD rejects paper, you’ll know they’ve met Hume’s ghost.
