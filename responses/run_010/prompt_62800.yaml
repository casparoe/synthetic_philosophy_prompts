  I've been crashing a philosophy-of-economics reading group at the state university for about two years now — I'm not enrolled in anything, I'm just the guy who's been reading rationalist blogs since the old Overcoming Bias days and then kept falling down the methodology rabbit hole until I had strong opinions about instrumentalism. Last month we did Friedman's 1953 essay on the methodology of positive economics plus the Musgrave critique, i.e. the whole F-twist debate: do wildly unrealistic assumptions get excused by predictive success, or is that a license to believe anything? Two of the regulars — I'll call them Dev and Mara — got into a real argument that spilled over into the bar and continued for a week on the group chat, and I, having no dog in the fight and no idea whos right, would like you to settle it. Please take the role of a philosopher of science who has actually worked on idealization and abstraction in economic models, not a survey-course summarizer. Think hard before you answer, and if it helps, jot a couple of lines of private brainstorming about where the actual crux is before you start handing down verdicts — but keep the final output tight and adjudicative.

  Here's the concrete thing they were fighting about, because it isn't abstract. Dev's partner works on a pricing algorithm for a regional pharmacy chain. Its demand model assumes zero cross-price elasticity: customers are represented as if they never compare this chain's prices against the competitor three blocks away and would never notice if they did. Everyone on the team knows that's false as a description of the shoppers — the chain runs its own in-store surveys showing people do comparison shop, and its marketing department basically exists because of that. They keep the assumption anyway because it makes the optimization tractable, and because the model has predicted next quarter's revenue to within about two percent for five straight years, in sample and out.

  The exchange, roughly as it happened:

  1. Dev: false assumption, five years of good predictions, therefore the assumption's truth is beside the point — same structure as Friedman's expert billiard player, who doesn't solve differential equations but shoots as if he did.

  2. Mara: the five years never tested it. Competitors' prices were unusually stable, the chain has something close to a monopoly on a couple of product lines, and the surveys say people comparison shop but the model's domain is one where that behavior was suppressed by circumstance. So the track record shows the assumption was *idle*, not *irrelevant*, and Friedman's claim is about irrelevance. You're generalizing from a lucky special case where the falsity happened not to bite.

  3. Dev: fine, then here's what should replace the F-twist — call it a legibility test. For every known-false assumption, ask whether the model itself tells you which changes in the environment will break it. Ours does: it implies the forecast will overshoot once a competitor undercuts past a threshold, and that's exactly what happened last spring during the price war, which the team flagged a quarter early instead of being surprised. A model that can name its own failure envelope is trustworthy inside that envelope even though its assumption is false; a model that can't is merely lucky so far and its track record licenses nothing.

  4. Mara: two problems. First, if you can derive breakage conditions from the falsity of the assumption, then the assumption's content is doing genuine explanatory work and you're committed to its being at least approximately right where it counts — which is precisely what the F-twist was supposed to let you off the hook for. You haven't rescued instrumentalism, you've smuggled realism back in under a nicer name. Second, the test is vacuous the way you're using it: you named the failure envelope *after* the price war broke the model, and since any failure can be retro-fitted with some auxiliary assumption, passing the test is just a function of how long you're willing to wait.

  5. Dev: then restrict it to prospective predictions only — and you still owe me an account, because on your standard every model with known-false assumptions is untrustworthy, frictionless planes and point masses included, so tell me what's different about the pharmacy. Mara: the difference is that the physics idealizations are *controlled*. There's a small parameter you're neglecting and you can bound the error it introduces; there's no small parameter here, just a convenient story about shoppers who happen not to be shopping around this quarter.

  So: go move by move, 1 through 5, and rate each one — clearly right / mostly right / mixed / mostly wrong / clearly wrong — with a sentence or two of justification for each rating rather than a vibe. Then tell me who was more right overall and about which specific point, and tell me what the two of them are missing. My own hunch, which may well be wrong, is that at least one of them keeps sliding between "this assumption is false as a description of the agents" and "this model is false," and that a real distinction is getting flattened there — but don't just validate my hunch, argue with it if it doesn't hold up. No bibliography, no reading list, no citations; you won't get those right and I don't need them, I need the argument judged. American English, please.
