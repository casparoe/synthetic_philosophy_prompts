answer: |-
  Below is the exam question, model answer, and marking scheme designed to meet your specifications.

  **Exam Question (Worth 25 Marks; 45 Minutes)**  
  "Using Amartya Sen’s entitlement analysis of the 1943 Bengal famine as a foundation, critically evaluate the argument that the catastrophe constitutes a *political crime* rather than a mere natural disaster. In your response:  
  1. **State and defend a clear criterion** for when mass starvation should be attributed as a political crime.  
  2. **Apply your criterion** specifically to the Bengal case, engaging with the roles of wartime policies (e.g., boat confiscation, price controls) and state inaction.  
  3. **Confront the central dilemma**: Explain how your criterion avoids both (a) implicating all market participants (e.g., traders responding to shortages) in criminal culpability, and (b) absolving all actors by default, rendering famine blameless.  
  *(Focus on adjudicating the dispute, not summarizing positions.)*"

  ---

  **Model Answer (Approx. 600 words)**  

  Sen’s entitlement analysis reveals the 1943 Bengal famine as a collapse in the ability of specific groups (rural labourers, fisherfolk) to command food through legal means, driven by war-induced inflation, failed price controls, and speculative hoarding. While this explains *how* starvation occurred, labeling it a "political crime" requires an additional normative criterion grounded in obligations of justice. I argue that **famine constitutes a political crime when a state or governing authority, possessing the capacity and resources, either (a) actively destroys or obstructs existing entitlements without providing compensatory access, or (b) deliberately fails to implement available and effective relief measures when widespread entitlement failure is foreseeable or occurring.** This criterion focuses on the unique role and duties of the *state* as the guarantor of basic rights and order, distinguishing it from market actors.

  Applied to Bengal, this criterion supports the attribution of political crime. The state *actively destroyed entitlements*: confiscating boats (essential for fishing and transport) under the "Denial Policy" stripped coastal communities of their primary means of production and exchange, directly undermining their ability to command food. Simultaneously, the state *deliberately failed to implement available relief*. Authorities denied the famine’s existence for critical months despite evidence, refused to divert military grain stocks or halt exports, and failed to replace the collapsed market distribution with public provisioning. Crucially, the British Raj possessed the resources (e.g., stockpiles, administrative machinery) and capacity (e.g., control over transport) to act. Its policies (destruction) and inaction (refusal of relief) were not inevitable wartime constraints but choices that foreseeably accelerated mass death among identifiable vulnerable groups.

  The friend’s critique highlights a genuine dilemma: without a clear criterion, Sen’s analysis risks either blaming traders operating rationally within distorted markets (over-attribution) or excusing all actors due to the complexity of causal chains (under-attribution). My state-centric criterion resolves this:  
  1. **Avoids Over-Attribution of Market Actors**: Traders withholding grain in response to price signals and shortage expectations are engaging in ordinary commerce, however harmful the aggregate outcome. My criterion assigns criminal culpability only to entities with a *duty to uphold systemic stability and prevent catastrophic harm* – the state. Market actors lack this duty; they respond to incentives the state shapes. Bengal’s traders acted within a framework of state-made chaos (inflationary financing, counterproductive price controls). Blaming them confuses systemic failure with individual malfeasance.  
  2. **Avoids Under-Attribution/Default Blamelessness**: By focusing on the state’s unique obligations and demonstrable actions/inactions, the criterion ensures famines are not absolved by default. The state cannot evade responsibility by pointing to market dynamics *it helped create* (e.g., via inflationary war spending) or by pleading ignorance *it willfully maintained* (e.g., refusing official famine recognition). Bengal’s authorities weren’t passive victims of circumstance; they actively shaped the entitlement collapse and possessed specific, actionable knowledge and resources enabling prevention or mitigation.

  Therefore, while Sen’s analysis explains the *mechanism* of starvation, it requires supplementation by a theory of obligation (as the friend noted) to attribute crime. My criterion provides this by grounding culpability in the state’s affirmative duties to protect citizens from catastrophic harm it can foresee and mitigate, and its specific actions that actively undermine resilience. The Bengal famine was a political crime because the governing authority *manufactured* vulnerability and then *refused* its duty to act as the insurer of last resort, despite clear capacity to do so.

  ---

  **Marking Scheme (Total 25 Marks)**  

  1.  **Clear & Defended Criterion (7 marks):**  
      *   Must explicitly state a specific, non-circular criterion for "political crime" attribution (e.g., state action/inaction + capacity + foreseeability/duty). (3 marks)  
      *   Must briefly justify *why* this criterion is normatively defensible (e.g., state's unique role/duty, practical necessity). (2 marks)  
      *   Must distinguish state responsibility from market actors. (2 marks)  
      *   *Common Failure:* Vague criteria (e.g., "if the government is involved"), failure to justify normatively, or conflating state/market actors.

  2.  **Application to Bengal Case (6 marks):**  
      *   Must accurately reference *specific* state actions destroying entitlements (e.g., boat denial policy). (2 marks)  
      *   Must accurately reference *specific* state failures to provide relief (e.g., denial of famine, refusal to divert stocks, lack of public distribution). (2 marks)  
      *   Must explicitly link these actions/inactions to the stated criterion. (2 marks)  
      *   *Common Failure:* Generic descriptions of Bengal events without specific links to the criterion, or misrepresenting historical facts.

  3.  **Addressing Over-Attribution (Avoiding Blaming All Market Participants) (5 marks):**  
      *   Must explain *why* market actors (e.g., Bengal traders) operating within the system should *not* be held criminally culpable under the proposed criterion. (2 marks)  
      *   Must explicitly link this to the criterion's focus on the *state's unique duty/responsibility* vs. market actors' lack thereof. (2 marks)  
      *   Must mention how the state shapes the market context actors operate within. (1 mark)  
      *   *Common Failure:* Implicitly justifying trader blame, failing to distinguish state/market duties, or ignoring how state policy creates the market incentives.

  4.  **Addressing Under-Attribution (Avoiding Default Blamelessness) (5 marks):**  
      *   Must explain how the criterion *prevents* famine being absolved by complexity or "natural causes". (2 marks)  
      *   Must emphasize the state's *capacity to act* and *foreseeability* of harm as key factors preventing default absolution. (2 marks)  
      *   Must argue why state inaction/denial in Bengal is culpable under the criterion. (1 mark)  
      *   *Common Failure:* Leaving the criterion vulnerable to "no one intended famine" excuses, failing to emphasize capacity/foreseeability, or implying famines require explicit malice to be crimes.

  5.  **Adjudication & Synthesis (2 marks):**  
      *   Must clearly conclude whether Bengal qualifies as a political crime *under the proposed criterion*. (1 mark)  
      *   Must synthesize points 1-4 to show how the criterion resolves the core dispute (friend's challenge vs. your counter). (1 mark)  
      *   *Common Failure:* Simply summarizing arguments without a clear adjudication, or failing to connect the resolution back to the original debate prompt.

  **Total: 7 + 6 + 5 + 5 + 2 = 25 marks.**  
  *Note:* Quality of argumentation, clarity, and use of evidence within the Bengal context should influence the marking within each category. The "Adjudication & Synthesis" point specifically rewards demonstrating that the student has engaged the *dispute* itself.
