prompt: |-
  I'm in a philosophy of biology seminar and we just spent three weeks on whether DNA literally carries information or whether "code" is a metaphor, and I wrote up an argument for my problem set that my TA said proves too much. I still can't see where. Roughly as I turned it in:

  (1) For a physical state X to carry information about some feature Y, X has to depend on Y in a reliable way — X's being in the state it's in can't be equally well correlated with a pile of other things. Call this the reliability requirement.

  (2) Whether a correlation is reliable isn't a property of X and Y alone; it's a function of the conditions X actually gets used under. The same sequence gets read out differently in a different cellular context, at a different temperature, with different splicing machinery, and the codon assignments themselves look arbitrary — a frozen accident that could easily have come out otherwise — so the reliability of the sequence-to-trait correlation depends entirely on the developmental setup.

  (3) Therefore DNA carries information about a trait only relative to a specification of the context; there's no such thing as the information a sequence carries, simpliciter.

  (4) But every other putative information bearer is in the same boat. A V1 cell's firing carries information about orientation only relative to adaptation state, anaesthetic, and the range of stimuli actually shown; a bee's waggle dance carries information about a food source only relative to the hive's conventions and the terrain the scouts really fly over.

  (5) So for anything whatsoever, what it carries information about is only relative to a context — and once you write out the full context you've just listed the causes of X's state, at which point the information isn't adding anything over the causal facts.

  (6) So there's no such property as carrying information, in genes or anywhere else; it's a façon de parler for correlation getting complicated.

  (7) If that's right, every claim of the form "these cells signal the location of the food" in neuroscience and ethology is loose talk at best — and the same people who insist DNA is a code only by courtesy are the loudest defenders of those claims.

  (8) So at least one of (1)–(4) is false.

  His comment was that I've argued to a conclusion nobody accepts out of premises everybody in the room did accept, which is fair but not much help. I'd really like to keep (2) and (4) — the context-dependence point was the one part of the three weeks that felt like it was telling me something — and I defintely don't want to be committed to (6).

  So: which step do you reject, and why did it look innocent going in? And if the cheapest exit is through something I'd rather keep, price it for me. What does it cost to reject (1) instead — does some selectional or etiological account of what fixes content rescue the whole thing, and what does that account have to say about sequences or signals that never had a selection history? What does it cost to reject (4) and insist there's a real asymmetry between genes and neurons, i.e. that one of them is context-bound in a way the other isn't? Is there a version of (5) that doesn't collapse into (6), or is the slide from "relative to context" to "nothing over and above the causes" the actual problem? Also, does the diagnosis change depending on which sense of "code" you're working with — the Shannon sense of a reliable channel, versus the sense of an arbitrary symbol system, which seems to be the sense in which the codon assignments are code-like at all? I have a feeling the arguement is fine on one of those and broken on the other but I can't tell which.
reasoning: |-
  Okay, let me try to figure out where this argument goes wrong. The user's TA said it proves too much, leading to the conclusion that information doesn't exist anywhere, which the user doesn't want. The user wants to keep context-dependence (premises 2 and 4) but avoid the radical conclusion (6). 

  First, I need to map out the argument step by step. Premise 1: Information requires reliable correlation. That seems standard. Premise 2: Reliability depends on context. For DNA, codon assignments are arbitrary and depend on cellular machinery. That's solid. Premise 3: Therefore, DNA info is relative to context. Makes sense. Premise 4: Extends this to all info-carriers like neurons and bee dances. Premise 5: All info is context-relative, and context lists all causes, so info adds nothing beyond causation. Premise 6: Info isn't a real property. Premise 7: This undermines neuroscience claims, creating tension. Premise 8: Therefore, one premise must be false.

  The problem likely starts at step 5. Claiming that specifying context just lists all causes oversimplifies. Information theory abstracts away from full causal details. Shannon information focuses on uncertainty reduction. For example, a neuron firing reduces uncertainty about stimulus orientation within a specific setup, without needing all causal details. So step 5 conflates the abstractive nature of informational descriptions with causal completeness. 

  Also, the user mentions two senses of "code": Shannon vs. arbitrary symbol systems. The argument might confuse them. Shannon info is about reliable transmission, while symbolic codes involve conventions. DNA has both: reliable correlation (Shannon) and arbitrary codon assignments (symbolic). Context-dependence affects the latter more. But Shannon info is still valid within a context. 

  Rejecting step 5 preserves context-dependence without collapsing info into causation. Info models correlations at a certain granularity, useful for prediction even if context-dependent. This saves neuroscience claims without denying DNA's informational role. 

  Alternative exits: Rejecting premise 1 by adopting etiological theories (info based on evolutionary history). But that excludes non-evolved signals. Rejecting premise 4 by distinguishing genes as blueprint vs. neurons as signals, but that asymmetry isn't strong. Both depend on context. 

  So step 5 is the cheapest fix. It keeps context-dependence but avoids eliminativism by recognizing info as a useful abstraction over correlations under specified conditions.
answer: |-
  Your argument is sharp and internally consistent, but the overreach happens at **step (5)**, specifically in the leap from "information is context-relative" to "information adds nothing over causal facts." This is where the inference to (6) and (7) breaks down. Below, I'll dissect the issue, suggest the cheapest fix, and address your follow-up questions.

  ### The Problem: Step (5) Mischaracterizes Informational Explanations
  - **Why (5) seems innocent**: It correctly notes that specifying the full context lists causal factors. But it wrongly assumes that *describing* a system in informational terms is *redundant* with a complete causal description. Informational models aren't just summaries of causes; they **abstract away from physical details to focus on *patterns of correlation and control***.  
  - **The key insight**: Information is a *functional-level description*. It tells us how systems *discriminate* states, *reduce uncertainty*, or *enable specific responses*—without requiring a molecule-by-molecule causal account. For example:  
    - A V1 neuron's firing *carries information* about orientation because, *in a specific neurobiological context*, it covaries reliably with stimulus angles. Describing this as "information" highlights its role in visual processing without detailing ion channels.  
    - DNA sequences *carry information* because, *given cellular machinery*, they reliably specify amino acid sequences. Calling it a "code" emphasizes the arbitrary mapping (e.g., AUA = Isoleucine) and the system's error-correction capacity.  

  Rejecting (5) preserves context-dependence while avoiding eliminativism: **Information is real but relational**—it exists *between* a signal, its context, and a receiver's interpretive capacity.

  ---

  ### The Cheapest Exit: Refine (5) Without Rejecting Context-Dependence  
  Keep (1)–(4) and modify (5) to:  
  > *"So for anything whatsoever, what it carries information about is only relative to a context. However, specifying the context doesn't reduce information to 'just causation'; instead, it defines the *scope* within which informational descriptions are *explanatorily useful*."*  

  **What this costs you**:  
  - You must accept that "carrying information" isn't a *fundamental* physical property (like mass) but an *epistemic* or *functional* one. This is consistent with how biology uses informational language—e.g., in neuroscience, "signaling" explains how systems *leverage* correlations for adaptive outcomes.  
  - You lose the eliminativist punch of (6), but gain a defensible view: information is real *as a mode of description* for certain systems.  

  **Why it's worth it**:  
  - Saves (2)/(4): Context-dependence remains central (e.g., DNA codons mean nothing without ribosomes).  
  - Avoids (6)/(7): Neuroscience claims survive as legitimate explanations.  
  - Aligns with practice: Biologists use "information" precisely *because* it captures reliable correlations in a compact, prediction-friendly way.  

  ---

  ### Assessing Alternatives (More Costly Exits)  
  1. **Reject (1) via Etiological Theories (e.g., Millikan, Dretske)**:  
     - **Idea**: Information isn't just reliable correlation; it requires that the correlation was *selected for* (e.g., DNA codes evolved to carry developmental "instructions").  
     - **Costs**:  
       - Excludes non-evolved "signals" (e.g., synthetic DNA with no history, or neural responses in novel environments).  
       - Conflicts with (2): If context changes (e.g., mutations), the "selected function" may not align with current reliability.  
       - Doesn't resolve context-dependence—selection history is *part* of the context.  
     - **Verdict**: Expensive. Overcomplicates DNA/neuron asymmetry and doesn't fix (5).  

  2. **Reject (4) by Arguing for a Gene/Neuron Asymmetry**:  
     - **Idea**: DNA is uniquely "code-like" because its correlations are *arbitrary* (codons could map differently), while neural firing is *non-arbitrary* (firing directly reflects stimulus energy).  
     - **Costs**:  
       - Neural correlations are *also* context-dependent and arbitrary (e.g., dopamine firing could signal "reward" or "novelty" based on wiring).  
       - DNA's arbitrariness is *itself context-bound* (e.g., codon assignments depend on tRNA availability).  
       - Weakens your strongest insight (context-dependence).  
     - **Verdict**: Inefficient—forces you to defend a brittle distinction.  

  ---

  ### Shannon vs. Symbolic "Code": Which Sense Survives?  
  Your intuition is correct—the argument holds for **symbolic codes** but fails for **Shannon information**:  
  - **Symbolic codes (arbitrary mapping)**: Your critique succeeds. Codon assignments *are* arbitrary and context-bound, so calling DNA a "literal code" *does* require specifying the cellular machinery.  
  - **Shannon information (reliable correlation)**: Your argument overreaches. Shannon info is *defined* relative to a channel (context), but it doesn't vanish when contextualized—it quantifies *how much* uncertainty is reduced. For example:  
    - DNA *does* carry Shannon information about traits *in a given environment* (e.g., sequence X reduces uncertainty about phenotype Y by Z bits).  
    - This remains useful even if context changes (e.g., we can measure information loss in a novel environment).  

  **Diagnosis**: Step (5) conflates these. Shannon info survives context-relativity; symbolic codes require stricter conditions.  

  ---

  ### Recommendation: Embrace Context-Relativity Without Eliminativism  
  Your TA is right that (6) "proves too much," but the flaw isn't in your biology—it's in the philosophy of information. **Fix (5)** by conceding that informational descriptions are *tools*, not illusions:  
  - Information is "real" in the same way **software** is real—it’s a functional pattern instantiated by hardware (context), but irreplaceable for explaining how the system works.  
  - This lets you say DNA is "literally informational" *and* that neurons "literally signal"—*relative to specified contexts*.  

  This preserves your core insight while dodging the self-defeating conclusion. If your seminar debates "metaphor vs. literal," this positions you as a pragmatist: informational language is literal *within its domain of applicability*.  

  --- 

  **Still stuck? Try this test case**: Imagine a synthetic gene circuit engineered to output a protein *only* when glucose is present. Does the DNA "carry information" about glucose? Under your revised view: yes, *relative to* the circuit's design context—and that description explains behavior better than listing every atomic interaction. That’s the power of informational talk.
