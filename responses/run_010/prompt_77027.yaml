  ### Toxin Puzzle Decision Tree Handout  
  **For Philosophy Club Session**  

  ---

  #### Part 1: The Logical Space  
  The toxin puzzle asks: *Can you form a sincere intention to drink a harmless but awful-tasting toxin tomorrow to get $1 million today, if you know you won’t drink it once paid?* Resolving this depends on commitments about intentions. We map the logical space with four binary distinctions (each "Yes" or "No"):  

  1. **Voluntarism (V)**: Can you choose to form an intention at will?  
  2. **Belief Constraint (B)**: Can you intend to do something if you believe you won’t actually do it?  
  3. **Reason-Creation (R)**: Does forming an intention create a new reason to act?  
  4. **Temporal Authority (T)**: Can you bind your future self’s decisions now (e.g., by policy)?  

  These generate 16 combinations, but only 8 are coherent. The rest collapse due to contradictions (e.g., if intentions create reasons (R+), but you can’t bind future decisions (T-), your reason might vanish). Actual positions:  
  - **Kavka’s View** (V-, B-, R-, T-): You can’t form the intention.  
  - **Bratman’s View** (V+, B-, R+, T+): Form the intention as a planning tool.  
  - **Gauthier’s View** (V+, B+, R+, T+): Form the intention even if you doubt you’ll act.  
  - **Simple Voluntarism** (V+, B+, R-, T-): Form the intention without it affecting reasons.  
  - **Policy-Based Resolution** (V-, B-, R+, T+): Adopt a policy to form intentions.  
  - Unnamed positions are incoherent (e.g., V-, B+, R+, T-: Can’t form at will but can intend what you won’t do, while creating reasons you can’t enforce).  

  ---

  #### Part 2: The Questions  
  Answer based on intuitions about everyday situations—no philosophy background needed. Avoids jargon; distinctions between *choosing intentions* (V) vs. *intending against belief* (B), and *changing your mind* vs. *never intending* are preserved. Dropped "Object of Assessment" (individual vs. policy decisions) for simplicity—it’s folded into Temporal Authority (T).  

  1. **New Year’s Resolution**: You decide on December 15 to form the intention to exercise daily starting January 1. Can you, just by deciding this, genuinely intend to exercise? (Yes/No)  
  2. **Airport Promise**: You promise a friend you’ll drive them to the airport at 5:00 AM next week, though you hate mornings. When they ask, "Do you truly intend to do this?" can you honestly say "yes"? (Yes/No)  
  3. **Dreaded Event**: You sign up for a 6:00 AM charity run you know you’ll dread. When the day comes, you don’t want to go. Does the fact you *intended* to go give you a new reason to attend? (Yes/No)  
  4. **Predictable Bail**: You often skip plans when something better comes up. If you tell a friend you intend to help them move Saturday, but suspect you’ll cancel, are you lying? (Yes/No)  
  5. **Homework Intention**: You’re procrastinating on homework. Can you, right now, choose to intend to start working? (Yes/No)  
  6. **Gym Policy**: You adopt a personal rule: "I’ll intend to gym every Monday." When Monday comes, you don’t want to go. Does this rule force you to intend to go *next* Monday? (Yes/No)  
  7. **Changed Plans**: You intend to attend a party Friday. That day, a better offer arises and you skip the party. Did you *change your mind* or *never really intend* to go? (A: Changed mind / B: Never intended)  
  8. **Unpleasant Chore**: You agree to clean a friend’s garage Saturday. When Saturday comes, you hate the idea. Does agreeing earlier add a reason to clean? (Yes/No)  
  9. **Hopeless Task**: You’re asked to solve a puzzle you’re sure you can’t crack. Can you intend to solve it anyway? (Yes/No)  
  10. **Future Binding**: You decide today to follow a rule: "When I feel lazy, I’ll intend to do chores." Next week, you feel lazy—must you intend chores? (Yes/No)  
  11. **Trivial Reward**: You’ll get $1 if you intend to drink water tomorrow (which you’d do anyway). Can you form the intention to drink it *because of the reward*? (Yes/No)  
  12. **Broken Commitment**: You intend to quit junk food. A week later, you eat a cookie. Does this prove you *never intended* to quit? (Yes/No)  

  ---

  #### Part 3: Decision Tree & Positions  
  Follow your answers through the tree. Each leaf names a position (if defensible) and its "awkwardness"—a cost it imposes on your worldview. Unnamed positions are incoherent (e.g., conflicts in reason-creation) or too unattractive to hold.  

  **Decision Tree**:  
  - **Start**: Q1 (Voluntarism) → If Yes, go to Q2; If No, go to Q5.  
  - **Q2** (Belief Constraint) → If Yes, go to Q3; If No, go to Q4.  
  - **Q3** (Reason-Creation) → If Yes, go to Q6; If No, go to Q11.  
  - **Q4** (Belief Constraint) → If Yes, go to Q9; If No, go to Q8.  
  - **Q5** (Voluntarism) → If Yes, go to Q2; If No, go to Q10.  
  - **Q6** (Temporal Authority) → If Yes, go to Q10; If No, go to Q7.  
  - **Q7** (Changed vs. Never Intended) → If A, go to Leaf 1; If B, go to Leaf 2.  
  - **Q8** (Reason-Creation) → If Yes, go to Leaf 3; If No, go to Leaf 4.  
  - **Q9** (Reason-Creation) → If Yes, go to Leaf 5; If No, go to Leaf 6.  
  - **Q10** (Temporal Authority) → If Yes, go to Leaf 7; If No, go to Leaf 8.  
  - **Q11** (Trivial Reward) → If Yes, go to Leaf 9; If No, go to Leaf 10.  

  **Leaves**:  
  1. **Gauthier’s View** (V+, B+, R+, T+): Awkwardness: You must believe intentions magically cause actions, even with no incentive.  
  2. **Simple Voluntarism** (V+, B+, R-, T-): Awkwardness: Intentions don’t affect behavior—why form them?  
  3. **Bratman’s View** (V+, B-, R+, T+): Awkwardness: You need circular beliefs (e.g., "I’ll act because I intend, and I intend because I’ll act").  
  4. **Unnamed** (V+, B-, R-, T-): Awkwardness: Incoherent—why can’t you form intentions against belief if voluntarism is true?  
  5. **Unnamed** (V-, B+, R+, T-): Awkwardness: Unattractive—intentions create reasons but vanish when needed.  
  6. **Kavka’s View** (V-, B-, R-, T-): Awkwardness: You miss profitable opportunities due to "intention paralysis."  
  7. **Policy-Based Resolution** (V-, B-, R+, T+): Awkwardness: Policies force intentions, making you a "prisoner of past you."  
  8. **Unnamed** (V-, B-, R-, T+): Awkwardness: Incoherent—policies can’t bind if intentions don’t create reasons.  
  9. **Gauthier Variant** (V+, B+, R-, T-): Awkwardness: Rewards create intentions but not reasons—so why act?  
  10. **Kavka Variant** (V-, B-, R-, T-): Same as Leaf 6.  

  **Indistinguishable Leaves**:  
  - Tree can’t split **Leaf 1 (Gauthier)** and **Leaf 9 (Gauthier Variant)**. To tell apart: *"Does a reward for intending change your ability to form intentions?"* (Q11).  
  - **Leaf 6 (Kavka)** and **Leaf 10** collapse together—both deny voluntarism and reason-creation.  

  **Scoring Key**:  
  - Use the tree path based on your answers.  
  - **If your answers trace no coherent path**: E.g., Q7 forces "changed mind" but Q12 demands "never intended." This reveals inconsistencies in everyday views—highlighting why the puzzle is hard! List your answer pattern for group discussion.  

