  **Handout: The Toxin Puzzle Decision Tree**

  Introduction: This handout will help you discover which philosophical position on the toxin puzzle you are committed to by your own views on intention. Answer the questions honestly based on your intuitions.

  **Part 1: The Logical Space**

  The toxin puzzle revolves around three key questions about intentions:

  1. **Voluntarism (V)**: Can you form an intention at will, just by deciding to have it?
  2. **Belief Constraint (B)**: Can you form an intention to do something if you believe that you will not actually do it?
  3. **Reason-Giving (R)**: Does forming an intention create a new reason to do the intended action, beyond the reasons that already exist?

  Each of these is a yes/no question, leading to 8 possible combinations. Not all combinations have been defended by philosophers, and some may be incoherent or unattractive. The known positions are:

  - **(V-, B-, R-)**: Kavka's view: You cannot form the intention in the toxin puzzle.
  - **(V+, B-, R+)**: Bratman's view: You can form the intention in the toxin puzzle because it is part of a planning system that gives new reasons.
  - **(V+, B+, R+)**: Gauthier's view (controversial): You can form the intention even if you initially believe you won't do it, because the intention will cause you to do it.
  - **(V+, B+, R-)**: Simple Voluntarism: You can form the intention, but it doesn't give a reason to act, so you might not do it.

  The other combinations are unnamed and may be problematic.

  **Part 2: The Questions**

  Please answer the following questions with Yes or No, except question 7 which has two options.

  1. You are thinking about your New Year's resolutions. You know that eating healthier would be good for you, and you decide right now to form the intention to eat healthier starting January 1st. Can you, just by deciding, form that intention at this moment?
  2. Imagine that your friend asks you to drive her to the airport next Tuesday at 5:00 AM. You are a very heavy sleeper and have never once woken up that early without multiple alarms and someone else to shake you awake. Moreover, you know that on Monday night you have a big project due and will be up late. Do you think you can honestly intend, right now, to drive her?
  3. Suppose you sign up for a weekend hiking trip with your friends. You are excited at the time of signing up. But when the weekend arrives, you feel tired and realize you would much rather stay home and relax. You remember that you signed up and that your friends are counting on you. Does the fact that you signed up and formed the intention to go give you a new reason to go, beyond the reasons you already had when you signed up?
  4. You are considering whether to promise your friend that you will help her move next Saturday. You know that you are very lazy on weekends and that in the past you have often bailed on similar commitments. You don't have any particular reason to think next Saturday will be different. Can you, at this moment, form a genuine intention to help her?
  5. You are sitting at your desk and realize that you have been procrastinating on starting your homework. You tell yourself, "I intend to start my homework right now." Can you, just by saying that to yourself, form the intention to start right now?
  6. Imagine you have decided to run a marathon and have been training for months. On the day of the race, you wake up with a slight cold and feel very unmotivated. You think about all the training you've done and the fact that you committed to run. Does having formed the intention to run (and trained for it) give you an extra reason to run today, beyond the health benefits and personal satisfaction?
  7. Suppose you tell your friend that you intend to go to her party on Friday night. On Friday, you get invited to a different event that you would much rather attend, so you go to that instead. When asked why you didn't show up at her party, you say, "I changed my mind." Is this an accurate description? Or did you never really intend to go in the first place? (A. Changed my mind / B. Never really intended)
  8. You agree to help your uncle clean his attic on a hot Saturday afternoon. At the time of agreeing, you think it's the right thing to do. But when Saturday comes, you realize how hot it is and how much work it will be, and you don't want to go. If you don't go, your uncle will manage, but he might be disappointed. Does the fact that you agreed and formed the intention give you a reason to go that you didn't have before?
  9. You have a friend who lives across the country. You would like to visit her, but you know that you never manage to save enough money for a plane ticket and that you are very busy with school. You don't see how this time will be different. Can you form a genuine intention to visit her next summer?
  10. You know you should donate to charity, but you don't feel motivated. Can you, by a simple decision, form the intention to donate 10% of your next allowance to a charity?

  **Part 3: Scoring Key**

  Score your answers as follows:

  - **Voluntarism (V)**: Questions 1, 5, 10.
    - Count the number of "Yes" answers: ____
    - If >=2, then V+ (Yes, you can form intentions at will)
    - Else V- (No)

  - **Belief Constraint (B)**: Questions 2, 4, 9.
    - Count the number of "Yes" answers: ____
    - If >=2, then B+ (Yes, you can intend even if you believe you won't do it)
    - Else B- (No)

  - **Reason-Giving (R)**: Questions 3, 6, 8.
    - Count the number of "Yes" answers: ____
    - If >=2, then R+ (Yes, intentions create new reasons)
    - Else R- (No)

  Now find your position in the table:

  | V | B | R | Position | Awkwardness |
  |---|----|----|----------|-------------|
  | + | + | + | Gauthier's view (controversial) | You must believe that forming an intention to do something you currently think you won't do can cause you to do it, even without new reasons. But what if it doesn't work? |
  | + | + | - | Simple Voluntarism | You can form any intention at will, even if you believe you won't do it, and the intention doesn't give a reason. Then why would you ever do it? |
  | + | - | + | Bratman's view | You can form intentions at will only if they are consistent with your beliefs about what you will do, and they create reasons. But then in the toxin puzzle, you can form the intention only if you believe you will drink. How do you come to believe that? |
  | + | - | - | Unnamed | You can form intentions at will only if you believe you will do the action, but the intention doesn't create a reason. Then in the toxin puzzle, you cannot form the intention because you don't believe you will drink (since there's no reason). And without the intention, you certainly won't drink. |
  | - | + | + | Unnamed | You cannot form intentions at will, but you can have intentions that you believe you won't act on, and they create reasons. But then how do you get such an intention? And if you believe you won't act, why would the reason be effective? |
  | - | + | - | Unnamed | You cannot form intentions at will, but you can have intentions that you believe you won't act on, and they don't create reasons. Then why have the intention? And how would you ever act on it? |
  | - | - | + | Intention as Reason without Voluntarism | You cannot form intentions at will and you cannot intend what you believe you won't do, but if you do have an intention, it creates a reason. Then in the toxin puzzle, how do you get the intention? You would have to come to have it without forming it at will and while believing you will drink. But without a reason to drink, how? |
  | - | - | - | Kavka's view | You cannot form the intention in the toxin puzzle. But then you miss out on the money. And how do we form intentions in ordinary cases where we are not sure we will follow through? |

  **Note on Question 7**: This question is about the nature of intention. If you chose "Changed my mind", you likely believe that you can have an intention and then abandon it. If you chose "Never really intended", you might hold that intentions are strong commitments. But it does not affect the scoring.

  **For members with no clear path**: If you did not answer enough questions to score a category (at least two per category), then your commitments are unsettled. This may reflect that the puzzle taps into tensions in our ordinary thinking about intentions.

  **Part 4: Variants**

  We considered two variants of the toxin puzzle. In both, the sorting remains the same because the tree is based on general commitments. However, in the variants, the puzzle might be resolved differently:

  - **Variant 1 (payment after drinking)**: You must drink to get the money. Then most positions agree that you can form the intention because you have a reason to drink. The sorting doesn't change, but the conclusion about the puzzle might.
  - **Variant 2 (harmless and pleasant substance)**: You would drink anyway. Then forming the intention is easy because you know you will drink. Again, the sorting doesn't change.

  This suggests the tree is tracking stable features of your view of intentions.

