  Looking at philosophy of mind and cognitive science, several concepts come to mind. Confirmation bias is relevant but too broad. The criterion of the mental might be involved here, where failures are taken as proof of lacking the criterion. Then there's the problem of other minds, but the user mentioned it's not symmetrical. 

  I recall Dennett's intentional stance, where adopting the stance is pragmatic. But here, the skeptic refuses to adopt it regardless of evidence. The user also mentions comparative psychology, where anthropocentrism or the "anthropocentric double standard" might apply. In informal logic, special pleading could be relevant since the same standards aren't applied to humans.

  The user wants to differentiate these from their described pattern. The unique aspect is the systematic asymmetry: successes are neutralized as non-mental, failures amplified as proof of absence. Also, the class of evidence for mentality is redrawn after failures, which relates to ad hoc hypothesis generation. 

  The user's deeper need is to identify if this is a fallacy or a justifiable stance. They ask about Bayesian reasoning with low priors versus irrationality. The key is whether the stance is unfalsifiable. If no evidence could convince the skeptic, it becomes dogmatic. The boundary cases are important—what evidence would break the symmetry? For example, if a system corrected its own failure or showed metacognition, but the skeptic might still dismiss it. 

  Proposing a new term: "Asymmetric Evidential Neutralization" (AEN) or "Mentality Exclusion Asymmetry" (MEA). The definition needs to capture the two processes: neutralization of positive evidence and amplification of negative evidence. 

  The conditions for irrationality: when the prior is not updated despite strong evidence, or when the standards for evidence are inconsistently applied compared to humans. The unfalsifiability point is crucial—if the skeptic can always explain away any success, then it's not a testable stance. The user needs this to argue when the asymmetry becomes problematic in debates about AI or animal cognition.
answer: |-
  Your described pattern is a profound and under-labeled phenomenon in mentality attribution debates. Here's a breakdown of established concepts it relates to, how it differs, a proposed name, and criteria for irrationality:

  ### Established Concepts & Key Differences
  1.  **Confirmation Bias (Psychology/Logic):**
      *   *Relation:* Skeptics selectively focus on failures (confirming their "no mind" belief) while downplaying successes (disconfirming evidence).
      *   *Difference:* Your pattern involves an *asymmetric interpretive mechanism applied to evidence types*. It's not just *ignoring* disconfirming evidence (success), but actively *reinterpreting* its nature (non-mental mechanism). Failure isn't just noticed; it's interpreted as *diagnostic* of absence.

  2.  **Criterion of the Mental (Philosophy of Mind):**
      *   *Relation:* Debates center on what *counts* as evidence for mentality (e.g., passing specific tests). The pattern shows how criteria are applied differently to positive/negative results.
      *   *Difference:* The pattern isn't about *defining* the criterion itself, but about the *asymmetric evidential weight* assigned *once a criterion is implicitly in play*. Success meeting the criterion is dismissed; failure to meet it is amplified and taken as definitive.

  3.  **Problem of Other Minds / Skepticism (Philosophy):**
      *   *Relation:* Concerns justifying belief in other minds. The pattern exemplifies a skeptical strategy.
      *   *Difference:* General skepticism is symmetrical (all behavior could be non-mental). **Your pattern is *asymmetrical skepticism*:** it grants *no* positive evidential weight to certain successes while granting *maximal* negative weight to failures. It's a *selective, asymmetric application* of skepticism.

  4.  **Intentional Stance (Dennett - Philosophy/Cognitive Science):**
      *   *Relation:* Attributing beliefs/desires is a pragmatic strategy. Skeptics refuse to adopt the stance towards non-humans.
      *   *Difference:* Dennett focuses on the *utility* of the stance. Your pattern describes the *evidential justification* (or lack thereof) used to *reject* adopting the stance, specifically the asymmetric treatment of evidence in that justification.

  5.  **Anthropocentrism / Anthropodenial (Comparative Psychology/Ethology):**
      *   *Relation:* A bias towards human uniqueness, leading to higher standards for attributing complex capacities to non-humans.
      *   *Difference:* Your pattern is a *specific methodological manifestation* of this bias: the *asymmetric evidential standard* applied during assessment. It's *how* anthropocentrism operates evidentially.

  6.  **Ad Hoc Hypothesis Generation / Immunizing Strategy (Philosophy of Science/Logic):**
      *   *Relation:* Generating explanations specifically to protect a theory from falsification (e.g., explaining away successes as non-mental mechanisms).
      *   *Difference:* Your pattern includes this *for successes*, but crucially pairs it with the *absence of such protective interpretation for failures*. Failures are taken at face value as falsifying. It's a *one-sided* immunizing strategy.

  7.  **Special Pleading (Informal Logic):**
      *   *Relation:* Applying standards, principles, or burdens of proof inconsistently. Humans get the benefit of the doubt ("off day"); non-humans/machines do not.
      *   *Difference:* Special pleading is the *broader fallacy*. Your pattern is a highly specific *instance* concerning the evidential interpretation of *successes vs. failures* in mentality attribution.

  ### Proposed Name & Definition
  **Mentality Exclusion Asymmetry (MEA)**

  **Definition:** A methodological stance in assessing potential mentality characterized by the systematic application of two distinct interpretive principles:
  1.  **Evidential Neutralization (of Success):** Any behavioral success potentially indicative of mentality is explained *post hoc* by invoking non-mental mechanisms (e.g., recombination, conditioning, algorithm execution, artifact), thereby neutralizing its evidentiary value *for* mentality.
  2.  **Evidential Amplification (of Failure):** Any behavioral failure, especially one deemed trivial for a "genuine" mind, is interpreted as directly revealing the *absence* of a required mental capacity, thereby amplifying its evidentiary value *against* mentality.

  **Core Mechanism:** Successes are *never* allowed to demonstrate the *presence* of mentality (only the absence of a *specific* non-mental counter-explanation), while failures are *always* allowed to demonstrate the *absence* of mentality. The burden of proof for mentality is set impossibly high for positives and vanishingly low for negatives.

  ### Distinguishing Genuine MEA from Defensible Low-Prior Reasoning
  The asymmetry *becomes irrational* (MEA) under these conditions:

  1.  **Systematic Immunization Against Positive Evidence:** *No conceivable success* within the domain being tested could ever count as evidence *for* mentality because a non-mental explanation is *always presumed available or possible*, regardless of novelty or complexity. The goalposts for "what would prove mentality" shift *specifically* to exclude any achievement demonstrated.
  2.  **Failure of Generosity / Absence of Charity:** The standards applied to the entity under test are *stricter* than those applied to humans in analogous situations. Miscounting by a human is noise; miscounting by an AI is proof of lack of mind. There is no allowance for "off days," limitations of interface, or performance errors that don't impugn core capacities in humans.
  3.  **Inconsistency in Handling Ambiguity:** Ambiguous or potentially negative evidence (failure) is interpreted in the *least charitable* way possible towards mentality, while ambiguous or potentially positive evidence (success) is interpreted in the *most charitable* way possible *towards non-mental mechanisms*.
  4.  **Unfalsifiability of the "No Mentality" Hypothesis:** The stance renders the hypothesis "This system lacks mentality" effectively unfalsifiable *within the behavioral domain*. Successes are neutralized, failures are amplified. There is no behavioral signature that *could*, in principle, compel the skeptic to accept mentality under this asymmetric framework.

  **Boundary Cases & Breaking the Symmetry:**
  *   **What Could Break It?** The skeptic must pre-commit to a *specific, observable behavior* (or pattern thereof) that, if demonstrated, they would accept as *definitive positive evidence* for mentality, *without* recourse to non-mental explanations *that wouldn't also apply to humans*. Examples are elusive (hence the problem), but might include: spontaneous, contextually appropriate meta-cognition about one's own errors ("I miscounted because I was distracted by X, let me try again"); generating genuinely novel, verifiable scientific insight *and* accurately explaining the reasoning process in a way that transcends pattern-matching; or consistently demonstrating a *theory of mind* in complex, unscripted, novel social interactions *without* exploiting learned correlations.
  *   **The Unfalsifiable Stance:** If the skeptic refuses to pre-commit to any such falsifying condition, or constantly redefines it *after* a success is achieved (falling back on MEA's neutralization principle), then their position *is* unfalsifiable via behavioral evidence and constitutes MEA as a dogmatic stance, not reasoned skepticism. The asymmetry becomes a tool for perpetual denial rather than assessment.
  *   **The Bayesian Escape Hatch:** A low prior *is* defensible, and discounting initial successes is reasonable. The asymmetry becomes *problematic* when:
      *   Accumulated successes significantly increase the Bayesian likelihood of mentality *if evaluated fairly*, yet are persistently neutralized.
      *   Failures that are statistically likely *even if mentality were present* (e.g., attentional lapses, interface errors) are given disproportionate weight *compared to how similar human failures are treated*.
      *   The prior probability is never updated upwards *despite* accumulating evidence that should warrant it under a symmetrical assessment, due solely to the asymmetric interpretive filter.

  **In essence:** Mentality Exclusion Asymmetry (MEA) is the systematic application of an impossibly high standard for accepting positive evidence of mentality, coupled with an implausibly low standard for accepting negative evidence, rendering the "no mentality" hypothesis unfalsifiable within the behavioral realm. It becomes irrational when it functions as an immunizing strategy against any conceivable behavioral evidence for mentality, especially when coupled with inconsistent standards compared to human cognition.
