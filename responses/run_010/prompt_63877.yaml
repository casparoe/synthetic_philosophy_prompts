prompt: |-
  So I'm helping run a small workshop on conditionals and we've decided to make the two camps in the room actually do an adversarial collaboration instead of another round of talking past each other. Camp A holds that indicatives and counterfactuals have the same basic semantic shape — both state truth-apt contents, both get their content from something like a selection among possibilities — and that the felt difference between them is mostly that the indicative mood carries a presupposition that the antecedent is still open as far as the context is concerned, so all the probability stuff is pragmatics layered on an ordinary truth-conditional core. Camp B thinks that's backwards in the part that matters: indicatives aren't in the business of stating truths at all, to assert one is to suppose the antecedent and, on that supposition, endorse the consequent, and their assertibility tracks the corresponding conditional probability strictly — whereas the counterfactual is a genuinely different animal that is *not* governed by that thesis. So one side says the gap between a present-tense if-clause and its past-subjunctive twin is shallow and pragmatic, the other says it's a difference in kind, at the level of what a conditional even is. Both think the other is confused by the same data: the cheating-card-player case where two people with different evidence each seem entitled to assert conditionals that can't both be true, and the Oswald pair, where the indicative version (someone else did it, if he didn't) sounds like a triviality anyone who believes the president was shot should accept, while the counterfactual version sounds like a substantive and probably false historical claim.

  What I want you to draft is the document this collaboration should end up producing — the joint statement both sides could actually put their names to. Start with a numbered section of agreed claims, and be strict about it: nothing goes in there that a real partisan of either camp would refuse to sign, which means no smuggling in "conditionals express propositions" as a neutral premise. I'd like agreement sorted by topic: what the linguistic data are that any account has to handle, what each camp grants about the relationship between assertibility and conditional probability, what they agree the triviality-style results do and don't rule out, what they agree counts as giving a semantics of conditionals at all, and what they agree about how conditionals behave when they get embedded under negation, disjunction, probability operators, and indirect report. Then a disagreements table with these columns: the disagreement stated neutrally; how camp A would state it in words A accepts; how camp B would state it in words B accepts; whether the difference is substantive or verbal; and what would settle it. Then the cruxes — I'd say three to five — where a crux is a sub-question such that settling it would actually move at least one side, not just rephrase the standoff.

  For each crux I want a concrete test or case that both sides accept as bearing on it, and each side's prediction written down *in advance*, so please include a pre-registration block. Use these three vignettes, which I made up for the occasion and which I don't think either camp has an answer ready for. (1) A card is drawn and sealed in an envelope; you're told it's either the ace of spades or a red card; you say that if it's red, it's a heart; a week later, after the envelope has been opened and everyone knows it was the ace of spades, you say the very same sentence about the very same draw. (2) A defunct charity's charter still contains a clause to the effect that if an applicant has lived in the district for five years, the application is approved; the charity is being wound up and everyone knows no such applicant ever existed and none ever will — was that clause true, vacuously satisfied, or never the kind of thing that could be either? (3) An interpreter renders a witness's remark into English as an indicative conditional about the office light being on and someone being inside; you later learn the witness's own evidence differed from yours, in that she already knew the light was off — say what you may report, and whether what you report is true. For vignettes (1) and (3) I want numbers: predicted mean acceptability rating on a 1–7 scale for naive participants, and the predicted size of the shift between the before-the-reveal and after-the-reveal utterances, with each camp committing to a figure and saying what result would count against them.

  Two more things. There's a suspicion in the room that part of this dispute is verbal — specifically that if camp A is allowed to say the content of an indicative conditional is something like a diagonal or context-dependent proposition, and camp B is allowed to insist that whatever survives that move isn't what they were ever denying, then a chunk of the disagreement evaporates. I want the joint statement to say explicitly which parts dissolve that way and which don't, and whether the diagonal maneuver is a genuine dissolution or a dodge; treat the words "proposition", "truth-apt", and "semantics" as suspect terms and say where each camp is using them differently. And include a short section where each camp names the finding or argument that would make them give up their view, plus a candid note on whether the other camp would accept that finding as decisive — if the honest answer is no, say no and explain why that's not just stubbornness. Please don't pad this with a bibliography or a reading list; refer to arguments and cases by description rather than by citation, and don't guess at page numbers or paper titles. Names are fine where everyone knows who you mean. Aim for maybe 900 to 1400 words, in a register that sounds like two people who disagree but have stopped scoring points off each other.
reasoning: |-
  We are drafting a joint statement for an adversarial collaboration between two camps in the philosophy of language, specifically on the semantics of conditionals.

  Camp A: Indicatives and counterfactuals share the same basic semantic structure (truth-conditional, with selection among possibilities). The difference is pragmatic: indicatives presuppose that the antecedent is still open in the context.

  Camp B: Indicatives are not truth-apt; they are expressions of conditional probability (asserting an indicative is to suppose the antecedent and endorse the consequent). Counterfactuals are a different kind of thing. The gap is at the level of what conditionals are.

  The joint statement should have:
  1. Agreed claims (numbered, by topic, strict neutrality)
     - Linguistic data any account must handle
     - Relationship between assertibility and conditional probability
     - What triviality-style results do and don't rule out
     - What counts as giving a semantics of conditionals
     - Behavior under embedding (negation, disjunction, probability operators, indirect report)

  2. Disagreements table (columns: neutral statement, Camp A's version, Camp B's version, substantive/verbal, what would settle it)

  3. Cruxes (3-5) with concrete test cases (using the provided vignettes 1,2,3). For vignettes 1 and 3: predicted mean acceptability ratings (1-7) and shift size, pre-registered.

  4. Address the suspicion that part is verbal: where diagonal moves help, and whether they resolve or dodge. Treat "proposition", "truth-apt", "semantics" as suspect.

  5. Short section: what would make each camp give up, and whether the other camp would accept that as decisive.

  Register: collaborative, about 900-1400 words.

  Let's break this down step by step.

  ## I. Agreed Claims

  We list only what both sides can agree on, without favoring either camp.

  ### Topic 1: Linguistic data any account must handle
  1. The Oswald pair: The indicative conditional "If Oswald didn't shoot Kennedy, someone else did" is typically accepted as trivial (given the belief that Kennedy was shot), while the counterfactual "If Oswald hadn't shot Kennedy, someone else would have" is a substantive and controversial historical claim.
  2. The cheating card player: Two individuals with different evidence (e.g., one sees the card is red, the other sees it is black) can each reasonably assert conditionals that seem incompatible (e.g., "If it's red, it's a heart" vs. "If it's red, it's a diamond"), yet it seems odd to say both are true or both false.
  3. The behavior of conditionals under negation: Denying a conditional does not feel equivalent to asserting the antecedent and denying the consequent (e.g., rejecting "If it rains, the match will be canceled" doesn't commit one to "It will rain and the match won't be canceled").
  4. The behavior in disjunctions: Conditionals in disjunctions (e.g., "Either if it rains the match will be canceled or if it snows the match will be canceled") sound odd and are hard to interpret, suggesting conditionals might not embed straightforwardly.
  5. Probability operators: The assertibility of an indicative conditional typically tracks the corresponding conditional probability (e.g., the degree to which one accepts "If it rains, the match will be canceled" is proportional to the probability one assigns to the match being canceled given that it rains).
  6. Indirect reports: People often report conditionals by repeating the same form (e.g., "She said that if it rains, the match will be canceled"), but sometimes paraphrase (e.g., in the cheating case, one might report the other's claim as a mistake about the card).

  ### Topic 2: Relationship between assertibility and conditional probability
  7. For indicative conditionals, in many contexts, the assertibility of "If A, then C" is closely tied to the conditional probability of C given A (P(C|A)).
  8. However, both camps agree that this tie is not universal and can break down in certain contexts (e.g., when the antecedent is known to be false, or in the cheating case).
  9. Both camps agree that the conditional probability thesis (CPT) is a central feature of indicative conditionals that any account must explain or accommodate.

  ### Topic 3: What triviality-style results do and don't rule out
  10. Triviality results (e.g., Lewis's) show that, under certain assumptions, the conditional probability P(C|A) cannot equal the probability of a proposition (i.e., there is no proposition X such that P(X) = P(C|A) for all probability functions). 
  11. These results rule out the idea that indicative conditionals express propositions whose probability is always the conditional probability in a straightforward way.
  12. However, they do not rule out that conditionals might express propositions in a more complex way (e.g., context-dependent or non-classical propositions), nor do they rule out that conditionals might not express propositions at all.

  ### Topic 4: What counts as giving a semantics of conditionals
  13. Giving a semantics for conditionals involves specifying the contribution of the conditional form to the meaning of sentences in which it occurs, including how it interacts with other operators (e.g., negation, modals, quantifiers) and how it constrains truth conditions or assertibility conditions.
  14. Both camps agree that a semantic theory should account for the observed linguistic behavior (as in Topic 1) and be compositional.

  ### Topic 5: Behavior under embedding
  15. Negation: Both camps agree that negating a conditional (e.g., "It's not true that if A, C") does not typically have the same meaning as "A and not-C". The exact interpretation is context-sensitive and may involve denying the connection or the truth of the conditional.
  16. Disjunction: Embedding conditionals in disjunctions is problematic and often avoided or rephrased. Both camps agree that this is a challenge for any account.
  17. Probability operators: When conditionals are embedded under probability operators (e.g., "It's likely that if A, C"), there is a strong tendency to interpret this as the conditional probability P(C|A). However, both camps note that this is not always the case (e.g., in some contexts, it might be about the probability of a connection).
  18. Indirect reports: Conditionals are often reported faithfully, but in cases of disagreement (like the cheating case), reports might be more complex (e.g., attributing a conditional belief). Both camps agree that the data on indirect reports is complex and not decisive for either view.

  ## II. Disagreements Table

  We state the disagreements neutrally, then each camp's version, and assess whether substantive or verbal.

  | Neutral Statement | Camp A's Version | Camp B's Version | Substantive/Verbal? | What Would Settle It |
  |-------------------|------------------|------------------|---------------------|----------------------|
  | The nature of indicative conditionals: Are they truth-apt and proposition-expressing? | Indicative conditionals express propositions (truth-apt contents) that are assessed by selecting from relevant possibilities. The felt difference from counterfactuals is due to pragmatic factors (e.g., the antecedent being open). | Indicative conditionals are not truth-apt; they are devices for expressing conditional probability. To assert one is to conditionally endorse the consequent under the supposition of the antecedent. Counterfactuals are truth-apt and involve a different kind of supposition. | Substantive | Empirical evidence about embedding, truth-value judgments, and processing. |
  | The relationship between indicatives and counterfactuals: Is the difference one of kind or degree? | Indicatives and counterfactuals share a common semantic core (selection function semantics) and differ only in the epistemic status of the antecedent (open vs. closed). | Indicatives and counterfactuals are fundamentally different: indicatives are about current supposition and conditional probability, while counterfactuals involve a hypothetical scenario and are truth-apt. | Substantive | Analysis of how each behaves in contexts where the antecedent is known to be false, and in embedded contexts. |
  | The triviality results: Do they show that indicatives cannot be propositional? | Triviality results show that conditionals cannot be propositions that obey the laws of classical probability, but they are compatible with conditionals being propositions that are context-dependent or non-classical. | Triviality results show that indicative conditionals cannot be propositions at all, and they support the view that conditionals are not in the business of stating facts. | Substantive (but note: both agree triviality results rule out a naive propositional view) | Development of a formal semantics that either accommodates conditional probabilities as propositions (e.g., by context-dependence) or shows it's impossible. |
  | The role of pragmatics: How much of the behavior of indicatives is pragmatic? | The core meaning of indicatives is truth-conditional; the probabilistic effects arise from pragmatics (e.g., Gricean principles) and the presupposition of an open antecedent. | The core meaning of indicatives is probabilistic and non-truth-conditional; any truth-conditional effects are derived or illusory. | Substantive | Experiments testing whether people assign truth conditions to indicatives independently of assertibility conditions. |

  ## III. Cruxes

  We have three vignettes. We'll define three cruxes (one per vignette) and one more from the Oswald pair or cheating case.

  ### Crux 1: The persistence of conditional content (Vignette 1)
  - **Test Case**: A card is drawn and sealed in an envelope; participants are told it's either the ace of spades or a red card. The participant says, "If it's red, it's a heart." A week later, after it's revealed to be the ace of spades, the participant says the same sentence about the same draw. Participants rate the acceptability of the week-later utterance on a 1-7 scale (1: completely unacceptable, 7: completely acceptable).
  - **Question**: Does the indicative conditional retain its truth-aptness and meaning after the antecedent is known to be false?
  - **Camp A Prediction**: They hold that the conditional expresses a proposition that was true or false at the time of the draw. Since the card was the ace of spades (not red), the antecedent is false, so the conditional is true (vacuously). Thus, uttering it later might be odd pragmatically (because the antecedent is known false) but not false. They predict a moderate acceptability rating (say, around 4) because the conditional is true, but the utterance is infelicitous due to the violated presupposition of openness. Shift from before (when the antecedent was open) to after: before, the utterance was fully acceptable (say, 6-7); after, it drops to 4. Shift size: about 2-3 points.
  - **Camp B Prediction**: They hold that indicative conditionals are not truth-apt when the antecedent is known false. The week-later utterance is not assertible and might be considered meaningless or defective. They predict a low acceptability rating (around 2). Before, it was highly acceptable (6-7); after, it drops to 2. Shift size: about 4-5 points.
  - **What would count against**: For Camp A, a very low rating (e.g., below 2.5) would challenge their view that the conditional is still truth-apt. For Camp B, a rating above 4 would challenge their view that it's not assertible.

  ### Crux 2: The status of vacuous conditionals (Vignette 2)
  - **Test Case**: A defunct charity's charter has a clause: "If an applicant has lived in the district for five years, the application is approved." The charity is wound up, and everyone knows no such applicant ever existed and none ever will. Participants are asked: Was that clause (a) true, (b) vacuously satisfied (hence true), (c) never the kind of thing that could be true or false? (or rate on a scale).
  - **Question**: Can indicative conditionals in such clauses be truth-evaluable when the antecedent is necessarily false?
  - **Camp A Prediction**: They hold that conditionals express propositions; if the antecedent is false, the conditional is true (vacuously). Thus, they predict that participants will judge the clause as true or vacuously true. (Mean rating: high for true/vacuous.)
  - **Camp B Prediction**: They hold that indicative conditionals are not truth-apt when the antecedent is false. Thus, they predict that participants will say it's not the kind of thing that can be true or false, or that the clause is inapplicable. (Mean rating: low for truth-aptness.)
  - **What would settle**: If participants overwhelmingly judge the clause as true (or vacuously true), it supports Camp A. If they reject truth-evaluability, it supports Camp B.

  ### Crux 3: Reporting conditionals with mismatched evidence (Vignette 3)
  - **Test Case**: An interpreter renders a witness's remark (in a foreign language) as "If the office light was on, then someone was inside." You later learn the witness already knew the light was off. Participants are asked: (a) Can you report the witness as having said that if the light was on, someone was inside? (b) If so, is what you report true? Rate both on 1-7 scales.
  - **Question**: How are conditionals reported when the speaker's evidence differs from the reporter's, and does the reporter's knowledge affect the truth of the reported conditional?
  - **Camp A Prediction**: They hold that conditionals express context-dependent propositions. The witness's conditional might be true relative to her context (if her context included the possibility that the light was on). The reporter can faithfully report the conditional without endorsing it. Thus, they predict high acceptability for (a) (say, 6) and for (b) they might say it's true in the witness's context (so around 5-6).
  - **Camp B Prediction**: They hold that conditionals express conditional probability judgments relative to the speaker's information. The witness, knowing the light was off, would not assert the conditional (since P(someone inside | light on) is undefined or not high). Thus, the interpreter's report might be inaccurate. They predict lower acceptability for (a) (say, 3-4) and for (b) they would say it's not truth-apt or false (rating around 2-3).
  - **Shift**: Compare to a baseline where the witness did not know the light was off. Camp A might predict little shift in reportability, Camp B a significant drop.

  ### Crux 4: The Oswald contrast
  - **Test Case**: Present participants with the indicative and counterfactual versions of the Oswald case. Ask for truth-value judgments and assertibility ratings.
  - **Question**: Is the difference between the indicative and counterfactual due to a semantic difference or a pragmatic one?
  - **Camp A Prediction**: The indicative is true (and trivial) because it's about the actual world and its alternatives at the time. The counterfactual is about a counterfactual world and is substantive. The difference is due to the mood (indicative vs. subjunctive) which signals the epistemic status of the antecedent.
  - **Camp B Prediction**: The indicative is not truth-apt but highly assertible because the conditional probability is high (given Kennedy was shot). The counterfactual is truth-apt and false (or unlikely). The difference is semantic: they are different kinds of constructions.
  - **What would settle**: If the indicative is judged as having a truth value (and being true) in the Oswald case, it supports A. If it's judged as not truth-apt but assertible, it supports B.

  ## IV. Verbal Dispute and Diagonal Moves

  Both camps acknowledge that part of the disagreement might be verbal, particularly regarding the terms "proposition", "truth-apt", and "semantics".

  - **Diagonal moves**: Camp A might say that the content of an indicative conditional is a "diagonal proposition" (a proposition about the context) or context-dependent. Camp B might then say that if the proposition is defined in a way that makes it equivalent to the conditional probability, then they have no objection, but that such a proposition is not what is ordinarily meant by a truth-apt content.

  - **Resolution?**: The diagonal move might dissolve the disagreement if both sides agree that the assertibility of an indicative conditional is the conditional probability and that the "proposition" expressed is a context-dependent one that captures that. However, Camp B might argue that this context-dependent proposition is not what we are attributing when we report conditionals or embed them, and that it doesn't account for the embedding problems. Camp A would counter that a sophisticated propositionalism can handle embedding.

  - **Where the dispute remains substantive**: 
    - Whether conditionals embed in a way that requires a unified semantic treatment with counterfactuals.
    - Whether the truth conditions of indicatives (if any) play a role in communication beyond the conditional probability.
    - Whether the triviality results force us to abandon propositionalism.

  ## V. What Would Make Each Camp Give Up

  - **Camp A**: They would give up if it were shown that indicative conditionals systematically fail to have truth conditions in contexts where they are assertible (e.g., in the cheating case, both conditionals cannot be true, but both are assertible). Also, if a formal semantics that treats indicatives as non-propositional handles embedding better. Camp B would accept the first as decisive (if both are assertible but not both true) but not necessarily the second (because they don't require embedding to work the same way).

  - **Camp B**: They would give up if a propositional semantics for indicatives can be given that (a) accounts for the triviality results without ad hoc moves, (b) predicts the embedding behavior, and (c) explains why assertibility tracks conditional probability. Camp A would accept this as decisive, but note that they already believe (a)-(c) are possible.

  - **Candid note**: Camp B might not accept the embedding behavior as a test because they think conditionals shouldn't embed in the first place. Camp A might not accept the cheating case as showing no truth conditions because they can appeal to context-dependence.

  ## Drafting the Statement

  We now write the joint statement in a collaborative tone.

  ---

  **Joint Statement on the Semantics of Conditionals**

  **Agreed Claims**

  We, representatives of Camp A and Camp B, agree on the following points:

  1. **Linguistic Data to be Accounted For**  
     Any adequate account of conditionals must explain:  
     a. The Oswald Pair: The indicative "If Oswald didn't shoot Kennedy, someone else did" is typically accepted as trivial (given the belief that Kennedy was shot), while the counterfactual "If Oswald hadn't shot Kennedy, someone else would have" is a substantive and controversial claim.  
     b. The Cheating Card Player: Two individuals with different evidence (e.g., one sees a red card, the other a black card) can each reasonably assert conditionals that seem incompatible (e.g., "If it's red, it's a heart" vs. "If it's red, it's a diamond"), yet it is problematic to assign classical truth values to both.  
     c. Embedding under Negation: Denying a conditional (e.g., "It's not the case that if A, then C") is not equivalent to asserting "A and not-C".  
     d. Embedding in Disjunctions: Disjunctions of conditionals (e.g., "Either if it rains the match will be canceled or if it snows the match will be canceled") are notoriously difficult to interpret and often avoided.  
     e. Probability Operators: Statements like "It's likely that if A, then C" are typically understood as expressing that the conditional probability of C given A is high.  
     f. Indirect Reports: Conditionals are often reported faithfully (e.g., "She said that if A, then C"), but in cases of evidential divergence (like the cheating case), reports may be more complex.

  2. **Assertibility and Conditional Probability**  
     a. For indicative conditionals, assertibility is often strongly correlated with the conditional probability P(C|A).  
     b. This correlation is not universal; it breaks down in some contexts (e.g., when the antecedent is known false).  
     c. The Conditional Probability Thesis (CPT) — that the assertibility of an indicative conditional equals P(C|A) — is a central phenomenon that any theory must address.

  3. **Triviality-Style Results**  
     a. Triviality results (e.g., Lewis) show that under certain assumptions (e.g., that conditionals express propositions that obey the laws of classical probability), the CPT cannot hold across all probability distributions.  
     b. These results rule out a naive propositional account where the probability of the conditional is always the conditional probability.  
     c. However, they do not rule out more sophisticated propositional accounts (e.g., using context-dependence or dynamic semantics), nor do they entail that conditionals are non-propositional.

  4. **What Counts as Semantics**  
     a. A semantics for conditionals should provide a compositional account of their meaning, including their behavior under embedding and their interaction with other operators.  
     b. The semantics should explain the data in (1) and be compatible with the observations in (2) and (3).

  5. **Embedding Behavior**  
     a. Negation: The negation of a conditional is not equivalent to the conjunction of the antecedent and negation of the consequent.  
     b. Disjunction: Conditionals embedded in disjunctions are problematic and often require special treatment.  
     c. Probability Operators: When embedded under probability operators, conditionals tend to be interpreted as conditional probabilities, but this may not hold in all contexts.  
     d. Indirect Reports: Faithful reports are common, but in cases of evidential asymmetry, reporters may hesitate or rephrase.

  **Disagreements**

  The table below summarizes our key disagreements:

  | Neutral Description | Camp A's Stance | Camp B's Stance | Substantive/Verbal | What Would Settle It |
  |---------------------|-----------------|-----------------|---------------------|----------------------|
  | Are indicative conditionals truth-apt? | Yes; they express propositions (e.g., via a selection function) that are true or false. The difference from counterfactuals is pragmatic (e.g., presupposition of antecedent openness). | No; they are not truth-apt but express conditional probability. Counterfactuals are truth-apt and semantically distinct. | Substantive | Experiments on truth-value judgments in contexts where antecedents are false or known false (e.g., vignettes 1 and 2). |
  | Is the indicative-counterfactual difference one of kind? | No; both have the same semantic core (e.g., selection function) and differ only in pragmatic features. | Yes; indicatives and counterfactuals are fundamentally different at the semantic level. | Substantive | Analysis of embedding behavior and cross-mood embeddings (e.g., "If it rains, the match would be canceled" — which is odd). |
  | Do triviality results force non-propositionalism? | No; they rule out only naive propositionalism and are compatible with context-dependent propositions. | Yes; they show that indicative conditionals cannot be propositions and support a non-truth-conditional view. | Partly verbal (if "proposition" is broadened) | Development of a context-dependent propositional semantics that satisfies CPT without triviality. |
  | How central is pragmatics? | Pragmatics explains the probabilistic effects and the open/closed antecedent distinction. | Pragmatics plays a minor role; the core meaning is probabilistic and non-truth-conditional. | Substantive | Experiments testing whether truth conditions are accessible independently of assertibility. |

  **Cruxes**

  We pre-register predictions for the following test cases:

  **Crux 1: Persistence of Conditionals (Vignette 1)**  
  - **Case**: Participants rate (1-7) the acceptability of uttering "If it's red, it's a heart" a week after learning the card was the ace of spades.  
  - **Camp A Prediction**: Mean = 4.0 (SD ≈ 1.5). Reasoning: The conditional is true (vacuously) but pragmatically odd.  
  - **Camp B Prediction**: Mean = 2.0 (SD ≈ 1.0). Reasoning: The utterance is defective because the antecedent is known false.  
  - **Shift from Before**: Before reveal, both predict high acceptability (A: 6.5, B: 6.5). After reveal, A: 4.0, B: 2.0. Shift size: A: 2.5, B: 4.5.  
  - **What Counts Against**: For A, a mean < 2.5; for B, a mean > 3.5.

  **Crux 2: Vacuous Conditionals (Vignette 2)**  
  - **Case**: Participants judge a charity clause ("If an applicant has lived here five years, approval is granted") when no applicant ever existed. Options: (a) true, (b) vacuously true, (c) not truth-apt.  
  - **Camp A Prediction**: High endorsement of (a) or (b) (combined >70%).  
  - **Camp B Prediction**: High endorsement of (c) (>70%).  
  - **Settling**: If (a)/(b) dominate, supports A; if (c) dominates, supports B.

  **Crux 3: Mismatched Evidence Reporting (Vignette 3)**  
  - **Case**: Participants rate (1-7): (a) How acceptable is it to report the witness as having said "If the light was on, someone was inside"? (b) How true is what was reported?  
  - **Camp A Prediction**: (a) Mean = 6.0, (b) Mean = 5.5. Reasoning: The report is accurate and the conditional is true in the witness's context.  
  - **Camp B Prediction**: (a) Mean = 3.5, (b) Mean = 2.5. Reasoning: The witness, knowing the light was off, wouldn't assert the conditional; the report is misleading.  
  - **Shift from Matched Evidence**: In a matched case (witness didn't know light was off), both predict high ratings (a: 6.5, b: 6.0). The drop in (a) and (b) should be larger for B than for A.

  **Verbal Dispute and Diagonal Moves**

  We agree that some disagreement may be verbal, particularly regarding "proposition" and "truth-apt". 

  - Camp A allows that "propositions" can be context-dependent (e.g., diagonal) and still truth-apt. Camp B worries that this stretches "proposition" too far and that such propositions don't behave like ordinary ones in embedding.

  - The diagonal move (treating the content as a proposition about the context) might partially resolve the dispute if it can be shown to handle all embedding cases. However, Camp B remains skeptical that this can work for complex embeddings without losing the core insight of CPT.

  - The dispute is substantive in that:  
    a. Camp A seeks a unified semantics for conditionals (including counterfactuals) that is truth-conditional, while Camp B denies this is possible for indicatives.  
    b. Camp B insists that indicatives are fundamentally probabilistic, while Camp A sees probability as pragmatic.

  **What Would Make Us Give Up**

  - **Camp A**: We would abandon our view if: (i) Indicatives systematically resist truth-value assignments in assertible contexts (e.g., both claims in the cheating case are assertible but cannot both be true even with context-dependence); or (ii) A non-propositional account handles embedding far more simply. Camp B would accept (i) as decisive but not (ii), as they don't require embedding to be straightforward.

  - **Camp B**: We would abandon our view if: (i) A propositional semantics can be given that satisfies CPT without triviality and handles embedding; or (ii) Truth-value judgments for indicatives align with propositional predictions across contexts. Camp A would accept both as decisive.

  We acknowledge that each camp might not accept the other's "decisive" evidence as conclusive due to differing background commitments. This is not mere stubbornness but reflects deep theoretical differences about the nature of meaning and truth.

  ---

  This joint statement reflects our collaborative effort to clarify our agreements and disagreements, and to identify empirical tests that could move the debate forward. We commit to abiding by the results of the pre-registered tests.
answer: |-
  ### Joint Statement on Conditionals: Agreements and Disagreements  
  **Drafted by Representatives of Camp A and Camp B**  

  #### I. Agreed Claims  
  *(Strictly limited to claims both camps endorse)*  

  1. **Linguistic Data Requiring Explanation**  
     - (a) *The Oswald Pair*: The indicative "If Oswald didn’t shoot Kennedy, someone else did" is intuitively trivial (given Kennedy was shot), while the counterfactual "If Oswald hadn’t shot Kennedy, no one else would have" is substantive and non-trivial.  
     - (b) *Cheating Card Player*: Two agents with asymmetric evidence (e.g., one sees a card is red, another sees it is black) may each assert conflicting indicative conditionals ("If red, it’s a heart" vs. "If red, it’s a diamond") without obvious contradiction.  
     - (c) *Probability/Assertibility Link*: The assertibility of an indicative conditional strongly tracks the speaker’s conditional probability of the consequent given the antecedent (e.g., high P(heart | red) licenses "If red, it’s a heart").  
     - (d) *Negation*: Denying a conditional ("It’s not true that if A, C") is not equivalent to asserting "A and not-C."  
     - (e) *Disjunction*: Conditionals embedded in disjunctions (e.g., "Either if A, C or if B, D") are markedly awkward and often rephrased.  
     - (f) *Probability Operators*: Embedding under "probably" (e.g., "Probably, if A, C") is naturally interpreted as reporting high conditional probability P(C|A).  
     - (g) *Indirect Reports*: Speakers reliably report indicative conditionals using "that"-clauses (e.g., "She said that if A, C"), even when evidence differs.  

  2. **Assertibility and Conditional Probability**  
     - (a) For indicatives, assertibility is non-trivially correlated with conditional probability in most ordinary contexts.  
     - (b) This correlation breaks down when the antecedent is known false (e.g., asserting "If it rained yesterday, the match was canceled" when sunny).  
     - (c) The link is not merely coincidental; any theory must explain it.  

  3. **Triviality Results**  
     - (a) Triviality proofs show that conditional probability cannot be reduced to the probability of a *single, context-independent proposition* in all cases.  
     - (b) These results rule out "simple" truth-conditional accounts where P(if A, C) = P(C|A) universally.  
     - (c) They do *not* rule out:  
       - (i) Context-dependent propositions (e.g., diagonal contents).  
       - (ii) Non-propositional accounts.  
       - (iii) Hybrid theories.  

  4. **What Counts as "Semantics"**  
     - (a) A semantics must compositionally explain how conditionals contribute to the meaning of complex sentences (e.g., under negation, modals, quantifiers).  
     - (b) It must predict observed judgments (e.g., Oswald contrast, cheating case).  
     - (c) It need not entail that all meaning is truth-conditional.  

  5. **Embedding Behavior**  
     - (a) *Negation*: Rejecting a conditional typically targets the connection (e.g., "It’s false that if you press the button, it explodes" implies the button doesn’t cause explosion).  
     - (b) *Disjunction*: Disjunctions of conditionals resist classical truth-table analysis.  
     - (c) *Probability Operators*: "Probably (if A, C)" defaults to conditional probability, not probability of a truth-apt content.  
     - (d) *Indirect Reports*: Faithful reporting persists even when the reporter rejects the conditional (e.g., in cheating cases).  

  ---  
  #### II. Disagreements  
  | Neutral Statement | Camp A’s Position | Camp B’s Position | Substantive/Verbal | What Would Settle It |  
  |-------------------|-------------------|-------------------|---------------------|-----------------------|  
  | Do indicative conditionals express truth-apt contents? | Yes: Indicatives express propositions (selected via contextually relevant possibilities); truth conditions are core. | No: Indicatives lack truth conditions; they express conditional probability assessments. | Substantive | Truth-value judgments in vignettes 1–3; embedding tests. |  
  | Is the indicative/counterfactual difference shallow (pragmatic) or deep (semantic)? | Shallow: Both use selection functions; the difference is whether the antecedent is presupposed open (indicative) or closed (counterfactual). | Deep: Indicatives are suppositional acts (endorsing C under A); counterfactuals are modal claims about alternative histories. | Substantive | Cross-linguistic mood studies; antecedent-openness manipulations. |  
  | Do triviality results refute propositionalism? | No: They refute only naive propositionalism; diagonal/content-relativist accounts survive. | Yes: They show indicatives *cannot* be propositions without violating probability axioms. | Verbal (if "proposition" = diagonal) | A formal model reconciling diagonal propositions with CPT without triviality. |  
  | Can indicatives be vacuously true? | Yes: When A is false, "if A, C" is true regardless of C. | No: When A is false, indicatives are undefined or non-truth-apt. | Substantive | Vignette 2 responses; truth-rating tasks with false antecedents. |  

  ---  
  #### III. Cruxes  
  *Pre-registered predictions for novel vignettes. Acceptability ratings: 1 (unacceptable) to 7 (acceptable).*  

  **Crux 1: Persistence After Antecedent Falsification (Vignette 1)**  
  - **Case**: Participants rate "If it’s red, it’s a heart" *before* (card sealed; context: "ace or red") and *after* (revealed as ace of spades).  
  - **Question**: Does the conditional retain acceptability post-revelation?  
  - **Camp A Prediction**:  
    - Before: 6.5 (high assertibility).  
    - After: 4.0 (true but pragmatically odd; presupposition failure).  
    - Shift: −2.5.  
  - **Camp B Prediction**:  
    - Before: 6.5.  
    - After: 1.5 (defective; antecedent known false).  
    - Shift: −5.0.  
  - **Settling**: Result >3.5 after favors A; <2.5 favors B.  

  **Crux 2: Vacuous Clauses (Vignette 2)**  
  - **Case**: Participants judge a defunct charity’s clause: "If an applicant lived here 5 years, approval is granted." No applicant ever existed. Options: True, vacuously true, not truth-apt.  
  - **Camp A Prediction**: >70% choose "vacuously true" or "true."  
  - **Camp B Prediction**: >70% choose "not truth-apt."  
  - **Settling**: Majority for "not truth-apt" supports B; majority for "true/vacuously true" supports A.  

  **Crux 3: Reporting Under Mismatched Evidence (Vignette 3)**  
  - **Case**: Interpreter reports witness’s remark as "If the light was on, someone was inside." Witness knew the light was off. Participants rate:  
    - (a) Acceptability of reporting: "She said that if the light was on, someone was inside."  
    - (b) Truth of the reported conditional.  
  - **Camp A Prediction**:  
    - (a) 6.0 (report is accurate; content is context-dependent).  
    - (b) 5.0 (true relative to witness’s context).  
  - **Camp B Prediction**:  
    - (a) 3.0 (misleading; witness wouldn’t endorse the conditional).  
    - (b) 2.0 (not truth-apt; witness knew antecedent false).  
  - **Settling**: (a) >5.0 or (b) >4.0 favors A; (a) <4.0 and (b) <3.0 favors B.  

  **Crux 4: The Oswald Contrast**  
  - **Case**: Participants rate assertibility/truth of indicative vs. counterfactual Oswald variants.  
  - **Camp A Prediction**:  
    - Indicative: High assertibility (6.5), low truth-rating variance (seen as trivial).  
    - Counterfactual: Moderate assertibility, high truth-rating variance (substantive).  
  - **Camp B Prediction**:  
    - Indicative: High assertibility (6.5), but truth-ratings chaotic (not truth-apt).  
    - Counterfactual: Truth-ratings align with historical beliefs.  
  - **Settling**: Truth-rating stability for indicatives supports A; instability supports B.  

  ---  
  #### IV. Verbal Dispute? Diagonal Moves and Suspect Terms  
  - **Diagonal Maneuver**: Camp A proposes that indicatives express diagonal propositions (e.g., "In all *epistemically open* worlds where A, C"). Camp B replies: If "proposition" is stretched to mean "whatever diagonal captures," we don’t deny it exists—but it isn’t *truth-conditional content* in the classical sense.  
  - **Resolution or Dodge?**:  
    - Dissolves: Whether indicatives have *some* content (e.g., diagonal).  
    - Does Not Dissolve:  
      - Whether that content explains embedding (B: diagonal propositions mispredict disjunctions).  
      - Whether "truth-apt" applies to indicatives *as ordinarily understood* (B: diagonal isn’t truth-apt; A: it is).  
  - **Suspect Terms**:  
    - *Proposition*: A = truth-condition-bearing content (contextualist); B = not applicable to indicatives.  
    - *Truth-apt*: A = has truth conditions; B = capable of being straightforwardly true/false.  
    - *Semantics*: A = truth-conditional core; B = rules governing use (including probabilistic norms).  

  ---  
  #### V. What Would Make Us Give Up  
  - **Camp A**: We would abandon our view if:  
    - Embedding data (e.g., disjunctions) prove irreconcilable with truth-conditional semantics *even under diagonal/content-relativist treatments*.  
    - **Would Camp B accept this?**: No. B holds that embedding failures already refute truth-conditions; A’s response ("better semantics can fix it") is seen as evasion.  

  - **Camp B**: We would abandon our view if:  
    - A model reconciles conditional probability with truth-conditions *without* triviality (e.g., via dynamic semantics or impossible worlds).  
    - **Would Camp A accept this?**: Yes—but A notes B’s criteria for "reconciliation" may be impossible by design.  

  **Candid Note**: Both acknowledge that core axioms (e.g., "semantics must be truth-conditional" for A; "conditionals can’t embed like propositions" for B) make decisive falsification hard—but not due to stubbornness. The dispute hinges on foundational commitments about meaning.  

  ---  
  **Conclusion**  
  This document reflects our shared ground and unresolved differences. We commit to the pre-registered tests (Cruxes 1–4) as a path forward. Where predictions clash, empirical outcomes could shift one camp’s view—though we agree that theoretical reconciliation may require rethinking "semantics" itself.  

