prompt: |-
  Retired marine biologist here, 68, spending my days reading history and philosophy for fun, which is a blast. I keep running into an argument pattern I don't have a word for, and I want to know whether it's a recognized thing or whether it needs one.

  Two examples. First, from my old working life: a colleague argued that a certain kind of fishery collapses within roughly 30 years once harvest passes some threshold, and he had a list of about a dozen historical cases behind him. I pointed at one on his own list that had passed the threshold and was still going strong after 60 years. Fine, he said, but that one had a different upwelling regime, so it wasn't really comparable, and he dropped it. A few weeks later someone else flagged a second case, and that one went because the stock assessment methods weren't consistent across the record. By the end there were four cases left and he was more confident in the 30-year figure than he'd been with twelve. Nobody lied, nobody invented anything, and every single exclusion was on its own perfectly reasonable and based on real knowledge of the systems.

  Second, from the book group I'm in now — we've been reading about the rise and fall of great powers. Someone makes the classic move: don't get lost in the details of the present situation, look at the base rate, every empire in history has gone, average lifespan is such-and-such, so here's your forecast. Another member says, what about the one that lasted 800 years? Answer: that wasn't really an empire, it was a tribute system with a ceremonial center. What about the one that survived its own collapse and reconstituted? Doesn't count, no continuity of administration. Same shape as the fishery: the comparison group gets trimmed every time a member threatens the pattern, the trimming is done with genuine expertise, and confidence rises as the group shrinks, all the way to the point where there's one case left and the "base rate" is just that case.

  So — is there an established name or literature for this? I know a few near neighbours and none of them sit right. No true Scotsman is closest in spirit, but that's about rescuing a universal claim by redefining a word, and here nobody's defending a definition, they're defending a statistical forecast, and the definitions get narrower rather then the claim gets vaguer. The Texas sharpshooter is drawing the target around the bullet holes, but that sounds like a one-off act on data you already have, not this slow reactive carving under challenge. Cherry-picking is picking your sample up front. Overfitting is in the neighbourhood, but no model is being fit — it's the sample being sculpted. And I gather there's a general puzzle about which class of past cases you should take a base rate from at all, but I'm not asking about that; I'm asking about this specific dynamic where the class is revised downward in response to objections and confidence goes up as a result.

  If there's no name, coin one, but honestly I care much more about the carving than the label. What exactly is this thing, what is it not, and where's the line between it and legitimate narrowing of a comparison group? Because surely sometimes you should throw out a bad comparision — twelve sloppy matches can be worse than four good ones, and I'd have defended my colleague's first exclusion on its merits. So what makes an exclusion legitimate rather than symptomatic: timing (criteria fixed before you see the cases)? symmetry (would you exclude a case that helps you)? some floor on how many cases are left? And is there a point where the shrinking itself counts as evidence against the forecast, no matter how reasonable each individual exclusion looked?
reasoning: |-
  Okay, let me unpack this retired marine biologist's query. He's encountering a recurring argument pattern in both his scientific work and historical discussions, where a general claim is defended by progressively excluding counterexamples, with confidence increasing as the sample shrinks. 

  First, I recognize this isn't just about fallacies. The biologist already knows No True Scotsman and Texas Sharpshooter but rightly notes differences: here it's statistical claims being defended through case-specific exclusions, not definitional shifts or post-hoc target drawing. The core tension he identifies is fascinating - when does legitimate case refinement become epistemically dishonest?

  Hmm... the fishery example is textbook. His colleague started with 12 cases supporting a 30-year collapse threshold. Each challenged case was excluded for valid reasons (oceanography, data methods), but the pattern reveals a deeper issue: the exclusions only happened when cases threatened the hypothesis. That selective scrutiny feels key. 

  For the history example, empire longevity claims get "defended" by reclassifying long-lived polities (800 years? "Not a real empire"). Again, each exclusion seems reasonable alone, but cumulatively the criteria become ad hoc. What's striking is how confidence grows inversely to sample size - that psychological component seems crucial.

  I recall similar dynamics in social science: "We excluded outliers" papers where exclusion criteria emerge during analysis. But the biologist wants sharper boundaries. Legitimate exclusion would be pre-specified criteria (e.g. "only studies with verified harvest data"), whereas the problematic pattern reacts to specific counterexamples. 

  Also important: symmetry. Would they exclude a short-lived case that contradicted the pattern? Probably not. That asymmetry exposes motivated reasoning. And yes, shrinkage itself should undermine confidence - if 8 of 12 cases get excluded, maybe the original category was flawed.

  The closest established concept might be "ad hoc rescue" of hypotheses, but it's not quite labeled as he describes. For coined terms, "collapsing cohort fallacy" captures the sample implosion, while "confidence paradox" highlights the perverse certainty increase. 

  Ultimately, what makes this insidious is its veneer of rigor. Each exclusion is defensible, much like his colleague's first oceanography-based exclusion was valid. The line crosses when exclusions become reactive rather than principled, and when the shrinking sample isn't recognized as weakening the claim. The biologist's instinct is spot-on: this deserves a name because it's a distinct epistemic trap.
answer: |-
  What you're describing is a fascinating and insidious pattern that straddles several recognized cognitive biases and methodological pitfalls, but lacks a single, universally accepted name. It combines **motivated reasoning**, **ad hoc hypothesis rescuing**, and the **paradox of vanishing evidence**, often leading to **overconfident inference from a shrinking sample**.

  Here's a breakdown:

  1.  **Core Problem:** **Ad Hoc Sample Refinement (or Exclusion) Under Challenge.** This is the heart of it. The defining characteristic is that the criteria for inclusion/exclusion in the comparison group are *not fixed in advance* but are *developed or invoked reactively* specifically to dismiss counterexamples that threaten the initial pattern or hypothesis. Each exclusion is *individually reasonable* (not fabricated), but the *process* is epistemically flawed.

  2.  **Key Elements:**
      *   **Initial Claim:** A statistical generalization or pattern-based prediction (e.g., "All empires collapse within X years," "Fisheries collapse within 30 years of threshold Y").
      *   **Counterexample Presented:** An instance that seems to fit the initial criteria but contradicts the claimed pattern/lifespan.
      *   **Ad Hoc Exclusion:** A *post hoc*, case-specific reason is given for why *this particular instance* doesn't count. The reason is often valid *in isolation* (different upwelling, administrative continuity).
      *   **Confidence Inflation:** Paradoxically, confidence in the *original, now narrower* claim increases as the sample shrinks, despite the reduced evidential base and the reactive nature of the exclusions.
      *   **Progressive Narrowing:** The definition of the category (empire, comparable fishery) becomes increasingly restrictive and idiosyncratic to preserve the pattern.

  3.  **Why "Near Neighbors" Don't Quite Fit:**
      *   **No True Scotsman:** Involves redefining the *category itself* ("No *true* empire...") to exclude counterexamples. Your examples focus on *specific reasons* why *this instance* isn't comparable *for this statistical purpose*, not necessarily redefining the entire category universally. The category definition shifts *implicitly* through case exclusion, rather than explicitly redefining the word.
      *   **Texas Sharpshooter:** Involves drawing the target *after* shooting (defining the pattern after seeing the data). Your pattern involves shooting *at* a pre-drawn target, but then *moving the target boundaries* whenever a shot misses, claiming "that spot wasn't *really* part of the target area."
      *   **Cherry-Picking:** Involves *initial selection bias*. Here, the initial sample might be reasonable; the problem is the *reactive deselection* of inconvenient cases *after* the fact.
      *   **Overfitting:** A modeling error where a model captures noise instead of signal. While related (fitting the hypothesis too closely to specific data points by excluding outliers), your pattern is about *sample manipulation* to preserve a narrative or simple pattern, not necessarily model complexity.

  4.  **Names & Literature:**
      *   **Ad Hoc Hypothesis Rescue:** This is the closest established concept. Philosophers of science (e.g., Karl Popper, Imre Lakatos) discuss how proponents of theories protect them from falsification by making *ad hoc* auxiliary assumptions. Your pattern is a specific form of this applied to *sample selection* for statistical/base-rate arguments. Lakatos's "research programmes" involve a "protective belt" of auxiliary hypotheses that can be adjusted – your exclusions function as that belt.
      *   **Motivated Reasoning:** The underlying driver. People interpret evidence and define categories in ways that favor their existing beliefs or desired conclusions.
      *   **The Collapsing Cohort Fallacy (Proposed Term):** Emphasizes the defining visual: a group of cases collapsing inwards under challenge, leaving only the core "believers" in the pattern.
      *   **The Confidence Paradox of Vanishing Evidence (Proposed Term):** Highlights the perverse increase in confidence as the evidential base shrinks due to reactive exclusions.
      *   **Base Rate Neglect via Selective Exclusion:** While base rate neglect usually involves ignoring base rates, this involves manipulating the base rate sample itself.

  5.  **The Line: Legitimate Narrowing vs. Symptomatic Exclusion:**
      This is crucial. Legitimate narrowing is **pre-specified, systematic, and symmetric**. Symptomatic exclusion is **reactive, case-specific, and asymmetric**.

      *   **Legitimate:**
          *   **Pre-Specification:** Criteria for inclusion/exclusion are defined *before* examining individual cases in detail or encountering challenges. ("We only consider empires with centralized bureaucracies and standing armies." / "We exclude fisheries influenced by ENSO events.")
          *   **Systematic Application:** Criteria are applied uniformly to *all* potential cases, whether they support or contradict the hypothesis. You would exclude a case that *supports* your claim if it fails the pre-specified criteria.
          *   **Justification:** Criteria are based on sound theoretical reasons *independent* of the specific hypothesis being tested (e.g., ecological theory about upwelling effects, historical theory about administrative continuity defining statehood).
          *   **Transparency:** The process and criteria are clearly stated upfront.
      *   **Symptomatic (The Problematic Pattern):**
          *   **Reactivity:** Criteria emerge *only when* a problematic counterexample arises.
          *   **Case-Specificity:** The reason given is often highly specific to *that one case* ("Well, *this* empire had a unique succession crisis," "Well, *that* fishery had unusual stock assessment methods in 1972").
          *   **Asymmetry:** There's little scrutiny of cases *supporting* the hypothesis using similar rigor. Cases supporting the pattern are rarely excluded for minor dissimilarities.
          *   **Confidence Inflation:** Confidence increases with each exclusion, ignoring the shrinking N.
          *   **Implicit Redefinition:** The effective definition of the category changes *through* the exclusions.

  6.  **Shrinking as Evidence Against the Forecast?**
      **Absolutely.**
      *   **Reduced Statistical Power:** Fewer cases mean the observed pattern (e.g., "always collapses by 30 years") is statistically weaker. With N=4 (or 1!), the predictive power is minimal. The initial N=12 had *some* weight; reducing it to N=4 through *post hoc* exclusions does *not* magically make the remaining cases more predictive of a universal rule.
      *   **Indicator of a Weak Hypothesis/Overly Broad Category:** If most examples in the initial, seemingly reasonable category must be excluded to preserve the pattern, it strongly suggests either:
          *   The initial category was too broad/heterogeneous for the proposed pattern.
          *   The proposed pattern isn't as universal or robust as claimed.
          *   The "pattern" might be an artifact of the exclusion process itself.
      *   **Revelation of Ad Hoc Nature:** The *process* of reactive shrinking itself undermines the claim's objectivity and reveals motivated reasoning. It demonstrates that the hypothesis isn't being tested; it's being protected.

  **Conclusion:** You've astutely identified a common and problematic pattern – **Ad Hoc Sample Refinement Under Challenge** leading to the **Confidence Paradox of Vanishing Evidence**. It's a specific form of motivated reasoning and ad hoc hypothesis rescue applied to sample-based arguments. The key to distinguishing it from legitimate refinement is the **timing (pre-specified vs. reactive)** and **symmetry (uniform application vs. asymmetric application targeting only counterexamples)** of the exclusion criteria. The shrinking sample size *is* strong evidence against the robustness of the original claim, regardless of how reasonable each individual exclusion seems. The increasing confidence is the cognitive trap – a signal that reasoning has become defensive rather than inquisitive. This pattern is deeply embedded in debates about historical cycles, policy predictions based on past cases, and even some scientific controversies. Your examples from fisheries and empires are perfect illustrations.
