  Here's a speech draft focused on utility, quiet service, and the nature of street names, avoiding eulogy, clichés, and confrontation:

  **Speech Draft:**

  "Good morning. Saturday morning’s a practical time. People are running errands, heading to work, meeting friends. They’re thinking about where they need to go, not necessarily the name of the street they’re turning onto.

  That’s what street names *do*. They’re tools. We use them to find the pharmacy, direct an ambulance, mail a birthday card, tell a neighbor where the block party is. They work in the background, every day, for everyone who needs to navigate this town. They belong to the present.

  For over a century, this street carried the name of Dr. Vance. He founded our hospital. That mattered deeply. But names on streets do more than honor; they become part of the town’s working fabric. And as we learned – thanks to the careful work of students digging into our own history – part of Dr. Vance’s life involved administering the rules that governed who got to participate fully in our community for many decades. The record shows that participation was systematically denied to our neighbors on the East Side.

  Given that full picture, it became clear that this street, as a piece of shared, daily infrastructure, could no longer serve its purpose for everyone while bearing his name. The name itself became an obstacle to the street’s basic function: being a reference point for the whole town.

  So, we looked for a new name. We didn’t look for another towering figure demanding agreement. We looked for someone who simply *did* the work, who kept part of this town running, day in and day out, for a long time. We found Sarah Wilkins. [*Use real name if possible*]

  Born here in 1868. For thirty years, she ran the ferry landing. That’s what we know. That’s almost *all* we know. No grand speeches survive, no letters detailing her views. Just four lines in a census and a job held steady for three decades: getting people, goods, wagons, and news across the river safely. Connecting parts of the community. Enabling the daily business of life.

  Sarah Wilkins didn’t build an institution. She kept a vital piece of ordinary life moving. Her name asks for no agreement about her views or her character beyond this simple fact: she did necessary work that served the practical needs of this place and its people.

  We dedicate this street to her today. Not as a monument to celebrate, but as a useful name to *use*. May ‘Wilkins Street’ simply serve its purpose well: helping neighbors find each other, helping services find the right door, helping this town function smoothly for everyone, every single day. Let’s raise the sign."

  ---

  **Analysis & Your Questions:**

  1.  **Confidence in the Statue/Street Distinction:**
      *   **Moderately High, with Nuance.** The distinction *is* structurally significant here and isn't just dressing. Here's why:
          *   **Function vs. Message:** You explicitly framed the change around the *function* of the street name ("tool," "background," "navigate," "reference point," "shared infrastructure," "purpose") being incompatible with the newly understood implications of the old name. This grounds the decision in practical civic necessity, not just moral judgment. A statue's primary function *is* messaging (honor, inspire, remind). Renaming based on impaired function is a different argument than tearing down a statue based on its message.
          *   **Avoiding the "Counter-Monument":** Choosing Sarah Wilkins precisely because she *isn't* a figurehead brilliantly leverages the distinction. A street name *can* be neutral in a way a statue cannot. Wilkins isn't replacing Vance as an object of veneration; she's replacing him as a functional label. Her obscurity *works* for a street name in a way it wouldn't for a statue. A statue of an obscure ferry operator would *demand* explanation and justification ("Why her?"). A street name just needs to be usable.
          *   **Cost Difference:** You acknowledged the genuine inconvenience ("re-registering cars"), which is a *functional* cost tied to the street name's role in bureaucracy/daily life. Changing a statue's location doesn't typically create this kind of widespread practical ripple effect. Your committee recognized this cost *because* it understood the street name's embedded utility.
      *   **The Caveat:** The distinction *is* being used to manage the *presentation* of a difficult moral/political decision. The underlying reason for the name change *is* the harm Vance participated in. The functional argument provides a less confrontational, more civic-minded framework for addressing that harm, especially given the audience (great-granddaughter, furious residents). It softens the blow without ignoring the core issue. It's not *just* dressing, but it *is* a strategic framing that makes the decision more palatable and focused on moving forward together.

  2.  **The Line I'd Be Most Nervous Reading Aloud (to this crowd):**

      > "Given that full picture, it became clear that this street, as a piece of shared, daily infrastructure, could no longer serve its purpose for **everyone** while bearing his name. The name itself became an **obstacle** to the street’s basic function: being a reference point for the **whole town**."

      *   **Why Nervous?**
          *   **Direct Implication:** This is the strongest statement linking Vance's actions to the *present* inadequacy of his name on the street. It explicitly states the name became an "obstacle" preventing the street from functioning for "everyone" and the "whole town." It directly confronts the exclusionary past the students uncovered.
          *   **Audience Sensitivity:** Vance's great-granddaughter is hearing that her ancestor's actions make his name incompatible with the town's unity *today*. The long-time furious residents hear that their attachment to the old name is secondary to this notion of the street functioning for "everyone" (which implicitly validates the perspective of those historically excluded). It's the line most likely to feel like a pointed judgment to Vance's descendant and a dismissal of the residents' inconvenience/attachment.
          *   **Historian Scrutiny:** The phrasing "could no longer serve its purpose for everyone" hinges on an interpretation of the *present-day* social function of the street name, which is more debatable than the historical facts. The historian might privately debate whether a name *can* functionally "serve" everyone in this context, even if they agree with the moral/political decision.

  **Why this line stays:** Despite the nerves, this line is crucial. It's the core justification bridging the historical finding ("full picture") and the action taken (renaming). It directly addresses the committee's logic about the nature of a street name. Omitting it would make the speech vague and avoidant. Delivering it calmly, factually, and without emphasis on "everyone" or "obstacle" is key – present it as the logical conclusion of the facts and the street's purpose.

  **Delivery Tip:** Pause slightly before "could no longer serve..." and after "...whole town." Maintain a calm, practical tone, not an accusatory one. Look towards the students and the historian as you say "full picture," and gesture slightly down the street as you talk about its "basic function." This grounds the statement in the physical reality of the place. Good luck.
