  The audience includes Vance's great-granddaughter (who's attending to listen, not argue), long-time residents upset about bureaucratic changes, the high school students who uncovered the history, and a local historian who'll fact-check everything. 

  The key challenge is crafting remarks that:
  - Avoid vilifying Vance while acknowledging the harm
  - Make the new namesake (a ferry operator woman with almost no historical record) meaningful precisely because of her obscurity
  - Honor the committee's philosophical distinction between statues (demanding agreement) and street names (practical utility)
  - Dodge clichés like "legacy" or "right side of history"

  The user also wants post-speech analysis on:
  - Whether the statue/street distinction genuinely holds water
  - Which line would feel riskiest to deliver live

  Hmm... the emotional minefield here is intense. The great-granddaughter's presence means any criticism of Vance must be factual and dispassionate—no moral grandstanding. The angry longtime residents need to feel heard without validating their resistance to racial reckoning. And the students deserve credit without making them pawns. 

  The ferry woman's obscurity is actually brilliant. By having no recorded opinions, she becomes a blank slate—which perfectly serves the goal of a name that "isn't asking anyone to agree to anything." The speech should frame her anonymity as democracy in action: ordinary labor enabling community function. 

  Biggest risks: 
  - Mentioning the 32 years of disenfranchisement could feel like an attack on Vance's family. Mitigation: cold, numerical delivery. 
  - Calling street names "for everyone" might antagonize residents mourning the old name. Mitigation: emphasize inconvenience as real but separate from justice. 
  - Historian's presence means zero tolerance for historical errors. Triple-check all dates/facts.

  The statue/street distinction feels intellectually honest. Statues are ideological; street names are infrastructural. Renaming the street isn't about rewriting history—it's about updating civic infrastructure to reflect current community boundaries. The committee avoided "counter-monument" precisely to prevent new ideological battles. Smart.

  Most nervous line: "It became clear that this street... could not continue to honor him." Why? It's the only explicit disavowal. Softening with "no longer serve" helps, but it's still a direct rebuke—heard by his descendant. Would watch her face closely there.
