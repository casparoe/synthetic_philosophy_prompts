prompt: |-
  I have been assembling, over a number of years, a list of verdicts about which of a system's symbols are grounded and which are merely verbal, and I have reached the stage where I can no longer tell whether the list hangs together. I should like an account — one principle, or a small ordered set of them — that reproduces the verdicts, together with a candid statement of what must be abandoned if it cannot.

  The cases, in roughly the order I came to them.

  1. A robot that acquires a predicate for a kind of object purely by handling objects: it reaches, misses, adjusts, and its internal state settles onto the category through its own error correction. Grounded. This is my paradigm, and I will not give it up.

  2. A text-trained system with no body and no sensors, which has encountered everything ever written about cups and can nonetheless tell me that a cup with a hairline crack will not hold soup. Not grounded, I think — though I confess I cannot name the capacity it lacks, since the inference it performs is one I would have credited to the robot in (1).

  3. A congenitally blind geometer who uses 'scarlet' fluently, reasons correctly about reflectance spectra, and can tell a colleague from measured reflectances which of two swatches will look warmer to the sighted. I want to say her term is grounded, or at least that she understands it. Note the difficulty: her route to the term is the same route as the system's in (2) — other people's words about a property she has never met. Cases (2) and (3) are the pair I cannot reconcile.

  4. An astronomer's symbol for sodium in the atmosphere of a particular exoplanet. She has never perceived it and never will; she has an instrument trace and a thorough understanding of what would make that trace misleading. Grounded. A technician who runs the same instrument, obtains the same trace, and cannot say what would count against it: not grounded. Identical causal history, opposite verdicts.

  5. A robot whose 'red' has, as a matter of fact, been fired by red things throughout its life through an accident of wiring, and which will behave indistinguishably from a properly wired robot for the remainder of its operating life. Not grounded. Its intrinsic duplicate, wired so that it would track redness in circumstances neither will ever encounter, is grounded. The difference looks modal rather than actual.

  6. A child's 'unicorn' seems to me grounded, being assembled from materials she has met. A term for a purely doctrinal entity — a scholastic's 'quiddity', say — learned only from other words that were themselves learned only from other words, is not. Grounding can be transmitted, but the transmission has to terminate somewhere.

  7. A clerk who manipulates unfamiliar symbols by following rules he does not understand: his own language remains grounded while the borrowed one does not. Grounding attaches to individual symbols, not to whole systems, and 'is this system grounded?' strikes me as a malformed question, since a system may have a grounded vocabulary and an ungrounded one at the same time.

  8. A research group: three scientists and their text-trained model, whose outputs are checked, corrected, and used to direct instruments that act on the world. The group's symbols seem grounded to me. But I do not think grounding descends to the model merely because the model is a part of the group; its own symbols still strike me as ungrounded within that arrangement. I am not certain that (7) and (8) are consistent.

  My tentative gloss, which I expect you to break: a symbol is grounded just in case its application is answerable to something other than further symbols — that is, when there is some channel by which the world, or an agent who is herself answerable to the world, can tell the user that the symbol has been misapplied.

  Three things, please. First, the principle or principles, stated precisely enough to be applied to a case neither of us has yet met, with the case from my list that motivates each clause. Second, the verdicts they deliver on questions I have not settled: is a text-trained system grounded when its misapplications are corrected in real time by human annotators who are themselves perceptually competent? Is a robot grounded whose sensors were calibrated once by an engineer and never checked again? Is grounding a matter of degree, and if so, along which dimension does it admit of degrees? Third, and most important: tell me which of my verdicts your account can keep and which it overturns, and whether the more elaborate principle that saves all of them is worth its complexity. I expect (4) and (5) to constrain whatever you say about (2) and (3) in ways I have not anticipated. Please do not assume that I want the verdict that flatters my attachment to (3).
reasoning: |-
  Hmm, the user presents a fascinating philosophical puzzle about symbol grounding. They've spent years compiling case judgments about which symbols are grounded (connected to reality) versus merely verbal, and now seek a unifying principle. The cases range from robots to blind geometers to astronomers, with intriguing tensions - particularly between case 2 (text-trained AI) and 3 (blind expert) where similar linguistic origins yield opposite verdicts.

  Looking at the cases, several patterns emerge. The user strongly values first-hand sensorimotor interaction (case 1), yet makes exceptions for experts without direct perception (cases 3 and 4). There's a clear rejection of purely symbolic chains (case 6) and accidental correlations (case 5), while allowing for mediated grounding through others (case 8 group). The modal aspect in case 5 is crucial - grounding requires counterfactual robustness, not just actual correlations.

  The user's own gloss about "answerability to non-symbolic reality" is insightful but needs refinement. The astronomer case (4) shows that grounding persists even when the expert is physically disconnected, so the key must lie in how the symbol user interprets feedback. This suggests a shift from causal history to the agent's cognitive architecture. 

  For a principled solution, I propose grounding as a three-tiered condition: (1) counterfactual responsiveness to reality, (2) epistemic access to the mapping, and (3) functional role in error correction. This handles the technician/astronomer distinction via condition (2) - the technician lacks understanding of what constitutes evidence. The blind geometer (case 3) satisfies all three by connecting "scarlet" to reflectance properties she understands, whereas the text-trained AI (case 2) fails (2) and (3) as it treats words as self-contained objects. 

  The solution does require sacrificing two user judgments: it makes the text-trained system with human correctors ungrounded (lacking intrinsic error-correction capacity), and forces us to see grounding as binary rather than graded. But this complexity seems justified by resolving the core tension between cases 2 and 3 while preserving the valued cases (1,3,4,6). The counterintuitive case 5 (accidentally correct robot) falls neatly under the modal requirement in condition (1).

  For unresolved cases: human-corrected AI remains ungrounded because correction is extrinsic; calibrated robots are grounded if they retain error-detection capacity; and grounding admits degrees only in derivative senses (e.g. richness of connections). The principle's elegance lies in showing how perceptual interaction enables but doesn't exhaust grounding - thus saving the blind geometer without compromising on the text-AI verdict.
answer: |-
  Below is a grounded symbol principle (GSP) that systematizes your verdicts, motivated by your cases. It preserves all core judgments except one (Case 8's group model), while introducing two clarifications. The principle is **modal**, **functional**, and **agent-relative**, focusing on the *user's capacity to detect errors* through non-symbolic channels.

  ---

  ### **The Grounded Symbol Principle (GSP)**  
  *A symbol `S` (in a cognitive system `C`) is grounded iff:*  
  1. **Counterfactual Sensitivity**: `C` can detect misapplications of `S` *in some possible scenarios* through non-symbolic feedback (e.g., sensory input, instrumental intervention, or input from an agent whose own symbols are grounded).  
  2. **Epistemic Access**: `C` represents the *conditions* under which `S` applies *as contingent on non-symbolic states*.  
  3. **Functional Role**: Detection of misapplication (from #1) can update `C`'s use of `S` to improve accuracy.  

  *(`C` = the entity applying the symbol; e.g., robot, human, AI model)*  

  ---

  ### **How GSP Explains Your Cases**  
  | Case | Verdict | GSP Application |  
  |-------|----------|----------------|  
  | **1** (Robot) | Grounded | **Satisfies all 3:** Sensorimotor loop detects errors (e.g., missed grasp → state update); represents cup-properties as contingent on physical interaction; self-corrects. *[Motivates #1, #3]* |  
  | **2** (Text-trained AI) | Not Grounded | **Fails #1 and #3:** Infers cracks from text, but cannot detect if its *own* inference is wrong (e.g., if told "cracked cups hold soup," it updates symbolically). No non-symbolic error channel. *[Motivates #1, #3]* |  
  | **3** (Blind Geometer) | Grounded | **Satisfies all 3:** Can detect errors via instruments/colleagues (e.g., mispredicting reflectance → corrected by measurement); represents "scarlet" as contingent on physical spectra; updates understanding. *[Key: She uses grounded agents as error-detection channels. Motivates #1]* |  
  | **4** (Astronomer vs. Tech) | Grounded / Not | **Astronomer:** Satisfies #1–3 (knows what trace *would* falsify sodium; updates beliefs). **Technician:** Fails #2–3 (applies `sodium` algorithmically; no grasp of contingencies). *[Identical cause, but GSP is agent-relative. Motivates #2]* |  
  | **5** (Wiring-Robot) | Not Grounded / Grounded | **Accidental Robot:** Fails #1 (no capacity to detect errors if red≠wire-firing). **Intrinsic Duplicate:** Satisfies #1 (would detect errors in other scenarios). *[Modal dimension covered by #1. Motivates #1]* |  
  | **6** (Unicorn vs. Quiddity) | Grounded / Not | **Unicorn:** Satisfies #1–3 (child checks stories against perceptual concepts like "horn"). **Quiddity:** Fails #1–3 (purely doctrinal; no error-detection outside texts). *[Motivates #2]* |  
  | **7** (Clerk) | Grounded / Not | **Native Symbols:** Grounded (clerks can spot misapplications via experience). **Borrowed Symbols:** Ungrounded (rules applied without contingency awareness). *[GSP applies per-symbol. Motivates #2]* |  
  | **8** (Research Group) | **Group Grounded / Model Not** | **Group:** Grounded (scientists detect errors via instruments). **AI Model:** Ungrounded (fails #1: cannot detect its *own* errors; scientists correct it externally). *[GSP applies to the *user* of the symbol. The model is not the user.]* |  

  ---

  ### **Verdicts on Unsettled Cases**  
  1. **Text-trained AI with human annotators:**  
     - *Verdict:* **Not grounded** in `S`.  
     - *Why:* The AI itself lacks capacity to detect misapplications (#1). Human correction is external input (like feeding it text), not integrated into the AI's *own* error-correction.  

  2. **Robot calibrated once, never checked:**  
     - *Verdict:* **Grounded** if it retains capacity to detect sensor errors (e.g., if a red object fails to trigger 'red', it could flag inconsistency). **Not grounded** if errors are undetectable (e.g., calibration drift corrupts data silently).  
     - *Turns on #1:* Can it *counterfactually* detect errors?  

  3. **Is grounding a matter of degree?**  
     - *Verdict:* **No** in the core sense (binary per GSP), but **yes** derivatively:  
       - *Richness:* A botanist's "oak" connects to more error-detection channels (touch, sight, seasons) than a child's.  
       - *Robustness:* More scenarios satisfy #1 (e.g., astronomer's `sodium` works across more exoplanets).  
       - *Not degree of "reality-connection":* Per GSP, grounding is all-or-nothing (like "knowledge").  

  ---

  ### **What Must Be Abandoned**  
  1. **Your Case 8 Group Model Verdict:** GSP **overturns** your hope that the model's symbols are ungrounded *within the group*. If the model is *part* of the group's cognitive system (e.g., its outputs directly drive instruments without scientist mediation), and the group uses it to detect errors (e.g., "model flagged anomalous data → we investigate"), then the *group's* symbol-use satisfies GSP. The model itself remains ungrounded, but the *group* is the user.  
     - *Cost:* Forces a choice: Either (a) treat the group as the cognitive system (grounded), or (b) insist the model is a passive tool (ungrounded). Your verdict implies (b), but GSP aligns with (a) if the model is integrated functionally.  

  2. **Non-Modal Actualism:** Your Case 5 shows grounding is **not** about actual causal history (accidental robot) but *dispositions* (#1).  

  3. **"Answerability" Gloss:** Refined by GSP's #2–3. A clerk's borrowed symbols are "answerable" to rules (symbols), not reality.  

  ---

  ### **Is Complexity Worth It?**  
  **Yes.** GSP preserves all other verdicts (including reconciling Cases 2/3) with minimal machinery:  
  - **Saves:** Cases 1–7 intact; resolves blind geometer/text-AI tension via error-detection capacity.  
  - **Breaks:** Case 8 model's status (but your group verdict is kept if scientists mediate model outputs).  
  - **Elegance:** Three jointly necessary conditions explain:  
    - Why text-AI fails (#1, #3) but blind expert succeeds (uses instruments as #1 channel).  
    - Why astronomer/technician differ (#2: epistemic access).  
    - Why unicorns are grounded (#1: child can check stories against cows/horns).  

  **Final refinement:** If abandoning your Case 8 model verdict is too costly, add:  
  > *"`C` must be the* primary agent *in error-detection for `S`."*  
  This excludes the AI model (scientists are primary) but keeps the blind geometer (she initiates checks). Complexity increases, but your list coheres. I recommend accepting the group as grounded.
