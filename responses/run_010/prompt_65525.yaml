answer: |-
  **Assessment Paper**  
  Time allowed: 90 minutes  
  Notes and pocket calculators permitted. Total marks: 25  

  ---

  **Part A (Case One: 9 marks)**  
  An anonymous benefactor sends identical letters to twenty isolated adults. Each must reply YES or NO by Friday noon. If *exactly one* replies YES, that person receives $10 million (others get nothing). If two or more reply YES, or all reply NO, nobody receives anything. Assume all care only about personal gain, share identical reasoning abilities, and cannot communicate.  

  1. Explain why a purely self-interested individual might choose NO.  
  2. Explain why a "superrational" individual (assuming perfect symmetry of reasoning) might choose YES.  
  3. Which choice would you expect to dominate in practice? Justify briefly.  

  **Part B (Case Two: 10 marks)**  
  Identical to Case One, *except*: If exactly one replies YES, *all twenty* receive $10 million each. Two or more YES, or all NO, still yield nothing.  

  1. Show whether a self-interested individual prefers YES or NO.  
  2. Show whether a superrational individual prefers YES or NO.  
  3. Does symmetry of reasoning change the outcome here? Explain why/why not.  

  **Part C (6 marks)**  
  In Hofstadter’s 1983 Luring Lottery, readers submitted postcards with a single number. The prize was $1 million *divided by the total number of entries*, paid to one randomly drawn winner. Readers could submit multiple entries (e.g., by rolling dice). Many submitted astronomically large numbers, reducing potential prizes to fractions of a cent.  

  Contrast this with Case One above. Explain why symmetry among players is *essential* for superrational cooperation in Case One but *irrelevant* in the Luring Lottery. Use simple algebra if needed.  

  ---

  ### Model Answer (∼900 words)  
  **Part A**  
  1. **Self-interested choice (NO):**  
     If I choose YES, I win only if all 19 others choose NO. Assuming each acts independently, the chance any one picks NO is high (say, \(p\)). But \(p^{19}\) is tiny—roughly \(0.001^{19}\) if \(p = 0.99\), or \(10^{-38}\). Even with moderate \(p\), winning odds are minuscule. Meanwhile, choosing NO costs nothing. Thus, self-interest favors NO.  

  2. **Superrational choice (YES):**  
     Superrationality assumes all reason identically and know this. If all pick YES, everyone loses. If all pick NO, everyone loses. The only winning outcome requires exactly one YES. But symmetry demands all use the same strategy. The sole symmetric equilibrium is all picking YES *with probability \(q\)* such that the odds of exactly one YES are maximized. For 20 players, \(q \approx 1/20 = 0.05\) gives the peak probability of a single YES (∼37.9%). Thus, superrationality suggests randomizing YES with 5% probability.  

  3. **Practical expectation:**  
     Self-interest pushes everyone toward NO, guaranteeing $0. Superrationality requires precise coordination of randomized strategies—almost impossible without communication. Thus, NO likely dominates.  

  **Part B**  
  1. **Self-interested choice:**  
     If I choose NO, I get $0 unless someone else’s YES triggers the prize. But if I choose YES, I trigger $10M for *all* if I’m the sole YES. The key: my YES only harms outcomes if others also choose YES. Crucially, *if* I am the sole YES, I gain $10M (vs. $0 for NO). If others choose YES, I get $0 regardless. Thus, YES weakly dominates NO: it never hurts and sometimes helps.  

  2. **Superrational choice:**  
     Symmetry implies all players reason identically. If all pick YES, everyone gets $0. If all pick NO, everyone gets $0. The winning outcome (exactly one YES) pays $10M to all. But symmetry forces identical strategies. As in Part A, the optimal symmetric strategy is choosing YES with probability \(q \approx 1/20\). This gives a ∼37.9% chance all win, versus 0% for NO.  

  3. **Symmetry’s role:**  
     Here, self-interest and superrationality *agree*: both favor YES. Self-interest prefers YES regardless of symmetry (since YES dominates). Superrationality uses symmetry to coordinate on the optimal \(q\), but even without symmetry, YES remains rationally compelling. Thus, symmetry doesn’t change the verdict—only how we arrive at it.  

  **Part C**  
  In Case One, symmetry is crucial because winning requires *asymmetry* (one unique YES), but superrationality forces players to mirror each other. The tension is resolved only through randomized strategies.  

  In the Luring Lottery, players *break symmetry* by choosing different numbers. Winning requires being the *sole* holder of the winning number. Self-interest encourages submitting huge numbers to maximize personal odds of uniqueness. However, if all do this, the prize shrinks toward $0. Superrationality would suggest coordinating on a small number (e.g., rolling a 1,000,000-sided die), but the ability to choose arbitrarily large numbers makes symmetry impossible to enforce. Players who defect (choose huge numbers) gain nothing if others cooperate but risk nothing if others defect. Thus, without enforceable symmetry, defection dominates—explaining the flood of oversized entries.  

  ---

  ### Marking Scheme  
  **Total: 25 marks**  
  **Part A (9 marks):**  
  - Q1: 3 marks (Self-interest → NO: 2 marks; clear dominance argument: 1 mark)  
  - Q2: 4 marks (Symmetry → randomized YES: 2 marks; \(q \approx 1/20\): 1 mark; maximizing single YES: 1 mark)  
  - Q3: 2 marks (NO dominates: 1 mark; coordination difficulty: 1 mark)  

  *Excellent answers* link Q3’s realism to the fragility of symmetric reasoning.  

  **Part B (10 marks):**  
  - Q1: 3 marks (YES dominates: 2 marks; weak dominance explained: 1 mark)  
  - Q2: 3 marks (Symmetric \(q \approx 1/20\): 2 marks; probability ≈38%: 1 mark)  
  - Q3: 4 marks (Both agree on YES: 2 marks; symmetry unnecessary for dominance: 2 marks)  

  *Excellent answers* explicitly contrast with Part A’s conflict.  

  **Part C (6 marks):**  
  - Case One needs symmetry for randomized solution: 2 marks  
  - Luring Lottery breaks symmetry via number choice: 2 marks  
  - Defection (huge numbers) dominates despite collective harm: 2 marks  

  *Excellent answers* note that Case Two avoids this by aligning incentives.  

  **Common Errors (Marks deducted):**  
  - Treating Case One and Two identically (–2; misses payoff shift)  
  - Assuming communication is possible (–1; violates setup)  
  - Ignoring symmetry in Part A Q2 (–3; core concept)  
  - Claiming YES is dominant in Part A Q1 (–2; confuses cases)  
  - Arithmetic errors: Full method marks if setup correct; –1 if minor; –2 if catastrophic.  

  ---

  ### Closing Note on Dissent  
  A candidate rejecting superrationality earns credit if they:  
  1. **Engage with the payoff structure** (e.g., argue Case One’s NO is uniquely rational without symmetry),  
  2. **Address the group outcome** (e.g., acknowledge the Pareto-inferior result but deem it unavoidable),  
  3. **Avoid strawmanning** (e.g., don’t call randomization "irrational" without critique).  
  Penalize only if they ignore incentives (e.g., "always YES because cooperation is good") or dismiss symmetry without argument. Coherent self-interest-based dissent in Part A could score full marks; in Part B, rejecting YES is indefensible and scores 0 for Q1/Q2.
