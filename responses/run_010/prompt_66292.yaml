answer: |-
  ## Joint Statement: Towards a Shared Critique of Meritocratic Practice

  **Preamble:** For three years, we have engaged in sustained critical dialogue concerning the ethics of selection and reward, particularly as manifested in contemporary 'meritocratic' systems. We share a profound dissatisfaction with how meritocracy functions in practice. Our collaboration has been adversarial yet productive, revealing both significant common ground and deep, principled disagreement. This statement articulates that common ground, clarifies the nature and roots of our disagreements without resolving them, and explores their implications through concrete cases. We sign this document as a testament to the value of rigorous, respectful dissent and the possibility of joint critique based on divergent foundations. We affirm that existing systems, where measured 'merit' correlates strongly with the circumstances of birth, are unjust. However, we fundamentally disagree on the underlying reasons *why* this correlation constitutes injustice and the appropriate conceptual framework for diagnosing and remedying it.

  **Section 1: Agreed Claims**

  1.  **The Injustice of Birthright Influence:** Existing systems for selection (e.g., education, employment) and reward (e.g., income, status) exhibit a strong, persistent, and morally objectionable correlation between an individual's measured 'merit' (as defined by prevailing credentials, test scores, or market valuation) and the socio-economic status, resources, and opportunities associated with their birth. This constitutes a significant injustice. [*Shared condemnation, divergent rationale – see Section 2*]
  2.  **The Myth of Pure Agency:** Prevailing meritocratic narratives systematically understate or ignore the profound role of unchosen circumstances – including genetic endowment, familial environment, socio-economic background, and sheer luck – in shaping the development of the very traits (skills, diligence, credentials) that these systems identify and reward as 'merit'.
  3.  **The Harm of False Justification:** Using 'merit' as a primary justification for significant distributive inequalities risks legitimising those inequalities in ways that are socially corrosive and individually damaging. It fosters the misconception that success reflects inherent superior worth and failure reflects inherent inferiority, leading to hubris, stigma, resentment, and the erosion of social solidarity.
  4.  **The Limits of Current Metrics:** Conventional proxies for 'merit' (standardised test scores, university pedigrees, specific professional qualifications, market-determined salaries) are demonstrably inadequate and often actively misleading measures of socially valuable contribution, effort, or character. They frequently capture narrow, easily quantifiable aspects while neglecting others (e.g., care work, community building, perseverance under adversity).
  5.  **The Need for Institutional Scrutiny:** Regardless of the underlying normative framework, the design and operation of institutions governing selection and reward require constant critical assessment and potential reform to mitigate unfairness, reduce the influence of morally arbitrary advantages, and better achieve their stated social purposes (e.g., efficiency, equity, human flourishing).
  6.  **The Danger of Moralised Distribution:** Distributing significant social goods (income, position, prestige) in ways that are widely *perceived* and *justified* as reflecting the recipient's fundamental moral worth or desert is harmful. It transforms distributive outcomes into implicit judgments of character, fostering unhealthy social dynamics.
  7.  **The Importance of Effort and Contribution:** Diligence, the conscientious application of one's abilities, and the making of genuine contributions to shared endeavours are valuable traits and activities worthy of recognition within a well-ordered society. Institutions should generally encourage and facilitate such engagement.
  8.  **The Context-Dependence of Value:** The social value of an individual's skills, efforts, and contributions is significantly shaped by contingent factors beyond their control, such as market demand, technological change, cultural priorities, and the existence of cooperative structures enabling their deployment. An individual cannot claim sole credit for the market value of their talents.
  9.  **The Priority of Background Justice:** Before questions of individual desert or entitlement within specific institutions can be fairly addressed, there must be a just basic structure of society – including fair equality of opportunity, basic liberties, and a social minimum – that mitigates the worst effects of unchosen starting points. [*Shared agreement on the necessity of background justice, though its precise content and relation to distribution may be contested*]
  10. **The Imperative of Reform:** The status quo of meritocratic practice, characterised by claims 1-4, is unacceptable and demands significant institutional reform. Continuing as we are perpetuates injustice and social harm.

  **Section 2: Disagreements Table**

  | Disagreement Stated Neutrally                                                                                                                                 | Camp A Preferred Formulation                                                                                                                               | Camp B Preferred Formulation                                                                                                                                 | Crux                                                                                                                                                                  | Shared Case/Evidence Bearing on Crux                                                                                   | Camp A Prediction on Crux                                                                                               | Camp B Prediction on Crux                                                                                                 |
  | :------------------------------------------------------------------------------------------------------------------------------------------------------------ | :--------------------------------------------------------------------------------------------------------------------------------------------------------- | :----------------------------------------------------------------------------------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------------- | :---------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------ |
  | **1. The source of normative force for claims about what individuals are 'due' in distribution.**                                                              | Pre-institutional desert bases (e.g., effort expended, contribution made, sacrifices undertaken) generate normative claims institutions *ought* to track. | Distributive claims arise solely from the public rules of just institutions; 'desert' is not a valid pre-institutional basis for determining distributive shares. | **Does the concept of 'desert' have a coherent, applicable meaning *prior to* and *independently of* the existence of a specific institutional scheme?**               | Analysis of claims within a dissolving institution (Test Case 1).                                                       | Pre-dissolution desert claims retain moral weight; dissolution reveals institutional failure to track independent facts. | Dissolution reveals desert claims were institutionally constituted; no independent facts remain relevant.                 |
  | **2. The nature of the injustice when institutions reward based on traits significantly influenced by birth.**                                                 | The injustice lies in institutions failing to track the *true* desert bases (e.g., effort, actual contribution) obscured by birth advantages.              | The injustice lies in institutions distributing based on factors (natural talent, cultivated traits) that are morally arbitrary from the standpoint of justice. | **Does the moral arbitrariness of birth advantages primarily invalidate the *institutional metric* (Camp A) or the very *normative basis* of desert-based distribution (Camp B)?** | Shared observation of birth influence (Claim 1).                                                                       | Better metrics *can* track true desert more accurately, mitigating the injustice.                                        | Any metric rewarding traits significantly shaped by birth will be flawed; desert itself is the flawed basis.             |
  | **3. The appropriate conceptual language for just distribution within institutions.**                                                                         | Within just institutions, distribution *should* track desert (properly understood and measured) as far as possible.                                         | Within just institutions, distribution is governed by entitlements and legitimate expectations generated by the rules of those institutions; 'desert' is misplaced. | **Does the language of 'desert' inevitably carry connotations of inherent moral worth that are inappropriate and harmful for distributive justice?**                    | Analysis of the moral psychology and social effects of meritocratic justification (Claim 3, Test Case 2 outcomes). | 'Desert' can be rehabilitated to mean "due reward for socially valuable effort/contribution" without moralising worth. | The connotations of inherent worth and moral judgment are inextricably linked to 'desert' talk, causing harm.            |
  | **4. The status of diminished desert claims.**                                                                                                                | The influence of unchosen advantages can *diminish* but does not *eliminate* an individual's desert based on their genuine effort/sacrifice.               | Talk of 'diminished desert' is incoherent; if desert depends on factors outside one's control, the entire concept lacks the required independence for distributive justice. | **Can the concept of desert be meaningfully 'graded' to account for mitigating factors like unchosen advantage, while retaining normative force?**                      | Considering an individual who exerts exceptional effort despite severe disadvantage versus one coasting on advantage. | Yes; desert is scalar, and factors like difficulty overcome enhance desert, while unearned advantage diminishes it.     | No; the grading relies on isolating 'genuine' agency, which is impossible once acknowledging pervasive unchosen influences. |

  **Evidence/Argument Against Own View (Per Crux):**
  *   **Crux 1 (Pre-institutional desert):**
      *   *Camp A:* Evidence that seemingly intuitive desert judgments vary wildly across cultures and historical contexts without a clear, shared underlying principle, suggesting they are socially constructed, not discovered.
      *   *Camp B:* A compelling thought experiment or real case where an individual makes a profound sacrifice or contribution demonstrably *outside* any institutional context (e.g., saving lives in a natural disaster), generating a widely felt intuition that they *deserve* recognition/reward, challenging the view that desert *only* arises from rules.
  *   **Crux 2 (Nature of injustice):**
      *   *Camp A:* Evidence that even sophisticated, context-sensitive measures of 'true' effort or contribution inevitably incorporate or are gamed by prior advantages, making clean separation impossible in practice, lending weight to Camp B's institutional critique.
      *   *Camp B:* Evidence that institutions explicitly designed *not* to track any notion of contribution or effort (beyond minimal competence), distributing purely equally or by lottery, generate significant resentment and demotivation, suggesting some independent pull towards effort/contribution recognition.
  *   **Crux 3 (Language of desert):**
      *   *Camp A:* Empirical studies demonstrating that even when 'desert' is explicitly defined in institutional terms (e.g., "deserved based on role requirements met"), recipients and observers still frequently interpret it as a judgment of their inherent worth or character, validating B's harm claim.
      *   *Camp B:* Evidence from linguistic philosophy or anthropology showing that 'desert' talk can be successfully confined to specific, non-moralised domains (e.g., "the plant deserves water") without implying worth, suggesting potential for similar constraint in distributive contexts.
  *   **Crux 4 (Graded desert):**
      *   *Camp A:* A logically watertight argument demonstrating that any attempt to isolate the 'pure' agent contribution from circumstantial influence involves an infinite regress or relies on arbitrary distinctions, undermining the grading project.
      *   *Camp B:* The inability to provide *any* plausible account of why we intuitively feel greater admiration/regard for someone overcoming adversity to achieve X than someone achieving X effortlessly, *without* invoking a notion of enhanced desert-like worthiness.

  **Section 3: Worked Test Cases**

  **Test Case 1: The Abolition of the Kaelon Contribution-Tracking Scheme**
  *   **Scenario:** The Kaelon Collective, a long-standing cooperative enterprise, operated a detailed scheme allocating annual surplus shares based on peer-assessed 'contribution units' reflecting effort, skill application, and results. Overnight, the Collective dissolves. We examine the normative claims in the moment *before* dissolution and whether equivalent claims exist in the neighbouring Thoran community, which has always distributed goods equally without tracking contribution.

  *   **Camp A Analysis:**
      *   **Pre-Dissolution:** Individuals possessed determinate desert claims based on their actual effort expended, sacrifices made (e.g., forgoing leisure), and tangible contributions to the Collective's output over the past year, as imperfectly but significantly tracked by the scheme. The injustice of dissolution lies partly in the violation of these pre-existing desert claims. Jara, who worked tirelessly on the difficult Helion project, *deserved* her calculated high share.
      *   **Post-Dissolution/Thoran Comparison:** The desert bases (effort, contribution, sacrifice) remain morally relevant facts about Jara and others, irrespective of the institutional context. In Thoran, while no *distributive claim* exists (as no scheme creates entitlements), it remains *true* that an individual like Jara, exerting exceptional effort for the communal good, *deserves* greater recognition/reward than one who shirks, even if Thoran's rules justly choose not to distribute based on this. The *fact* of desert persists; the *institutional response* varies.
      *   **Recommendation:** N/A (Dissolution occurred). Focus: Recognition of persistent desert facts.

  *   **Camp B Analysis:**
      *   **Pre-Dissolution:** Individuals held specific entitlements to shares based on the Collective's established rules. These entitlements were generated by the institution and constituted legitimate expectations. Jara was *entitled* to her high share based on the rules. There were no independent 'desert facts' grounding this beyond the institutional framework.
      *   **Post-Dissolution/Thoran Comparison:** With the institution dissolved, the specific entitlements vanish. Jara has no continuing claim based on her past 'contribution units'. In Thoran, without any contribution-tracking institution, there are simply no 'desert claims' concerning distributive shares. Asserting that Jara *deserves* more than her neighbour in Thoran is incoherent; desert only has meaning *within* a distributive practice. What persists is perhaps a *character assessment* (Jara is diligent), but this doesn't translate to a distributive claim.
      *   **Recommendation:** N/A (Dissolution occurred). Focus: Recognition of the institutional constitution of distributive claims.

  *   **Crux Relevance:** This case directly probes Crux 1 (Pre-institutional desert). Camp A sees dissolution as revealing the institution's failure to fulfil independent obligations. Camp B sees it as dissolving the only context in which such distributive obligations existed. It also touches on Crux 4: Camp A argues Jara's desert, though perhaps diminished by any innate talent advantage, is real and significant; Camp B sees the attempt to isolate desert from institutional rules as futile.

  **Test Case 2: Care Sector Pay Reform**
  *   **Scenario:** A publicly funded national care sector proposes replacing rigid seniority-based pay scales with a new system. Wages would be determined by accumulated "Care Contribution Points" (CCPs). Peers (other care workers) anonymously allocate CCPs monthly based on observed: diligence, compassion, skill application, teamwork, and tangible positive outcomes for clients. CCPs directly determine pay bands and bonuses.

  *   **Camp A Recommendation & Reasoning:**
      *   **Recommendation:** Support the *principle* of moving away from seniority towards contribution-tracking, but oppose *this specific CCP scheme* as currently designed.
      *   **Why:** Seniority is a poor proxy for true desert (effort, skill, compassion, results). A system attempting to track genuine contribution is morally preferable *in principle* as it better aligns reward with desert. However, this peer-assessment CCP system is fraught:
          *   **Measurement Problems:** Peer assessment is highly subjective, vulnerable to bias, popularity contests, and undervaluing unseen effort (e.g., complex cases, emotional labour).
          *   **Harm Risk:** Explicitly linking pay to peer judgments on compassion etc. massively intensifies the harmful moralisation of work (Crux 3) – turning colleagues into judges of each other's worthiness for livelihood.
          *   **Incentive Distortion:** Risks encouraging performative compassion or favouring easily observable tasks over essential but less visible ones.
      *   **Expected Outcome:** High likelihood of fostering resentment, undermining teamwork, increasing stress, and failing to accurately capture true contribution. The *concept* is sound (track desert), but the *implementation* is poor and potentially more harmful than seniority. Advocate for developing better, less morally charged contribution metrics (e.g., objective skill certifications, client outcomes weighted fairly, structured manager assessments with safeguards).

  *   **Camp B Recommendation & Reasoning:**
      *   **Recommendation:** Oppose the CCP scheme unequivocally. Advocate for a transparent salary scale based on role, qualifications (as competence proxies), experience (as proxy for developed skill), and potentially location/unsociable hours premiums – *not* peer-assessed contribution.
      *   **Why:** This scheme epitomises the core flaws of desert-based distribution (Crux 2, Crux 3):
          *   **Misplaced Basis:** It attempts to distribute based on perceived character traits (diligence, compassion) and outcomes heavily influenced by factors outside the worker's control (client complexity, team support, innate disposition).
          *   **Profound Harm:** Directly institutionalises the transformation of distributive outcomes into peer judgments of moral worth ("How many CCPs am I worth?"). This is devastating for workplace morale, collegiality, and individual well-being.
          *   **Arbitrary & Unjust:** Peer judgments are inherently variable and biased, making pay unfairly contingent on arbitrary perceptions, not legitimate expectations from clear rules.
      *   **Expected Outcome:** Predict severe damage to staff morale, erosion of trust and collaboration, increased anxiety and burnout, potential for bullying/cliques, and ultimately, poorer care quality. It exemplifies why desert should be abandoned as a distributive principle within institutions. A just structure sets fair wages based on role requirements and background justice, not interpersonal judgments of 'contribution'.

  *   **Crux Relevance:** This case directly confronts Crux 3 (Language/Harm of desert) – the CCP scheme makes the moralisation explicit and harmful. It also highlights Crux 2: Camp A sees the failure as poor tracking of *true* desert; Camp B sees it as the inevitable consequence of using desert *at all*. Crux 4 is implicit in how each camp weighs the influence of unchosen factors on the traits being assessed.

  **Section 4: Verbal vs. Substantive Disagreements**

  Our collaboration suggests that a significant portion of our disagreement stems not from a fundamental clash of substantive moral commitments, but from divergent uses and associations of the key term **'desert'** and its relation to institutional contexts. Clarifying this does *not* resolve our differences but helps map their contours more precisely.

  1.  **'Desert' in Character Assessment vs. Distributive Claims:** We largely agree that assessments of a person's *character* (e.g., "She is a diligent person and deserves admiration") can be meaningful, even if acknowledging circumstantial influences. Camp A seeks to extend this 'desert' concept directly to distributive shares ("Her diligence *deserves* greater reward"). Camp B argues forcefully that this extension is invalid and dangerous. The crux (Crux 3) is whether the connotations of 'desert' in character assessment *inevitably* carry over into the distributive context, causing harm. Camp B says yes; Camp A argues these connotations can be severed or managed within an institutional framework. *This is substantive disagreement about the practical and conceptual linkage between two uses of the term.*
  2.  **'Pre-Institutional' Meaning:** Camp A's 'pre-institutional desert' primarily refers to normative facts about actions/efforts/sacrifices *prior* to any specific distributive rule. Camp B hears this as a claim about distributive shares *apart* from institutions, which they reject. Some friction arises because Camp A is often making a claim about the *basis* for institutional design ("Institutions *should* track X"), while Camp B interprets it as a claim about a distributive right existing *without* institutions. *This involves a substantive disagreement (Crux 1) about the existence of such normative facts, but the initial misunderstanding is partly verbal – focusing on different aspects of 'pre-institutional'.*
  3.  **The Scope of 'Distributive Justice':** Our agreements (Claims 1, 3, 5, 6, 10) reveal shared concerns about the social effects of distribution. However, Camp B views the harm identified in Claim 3 (moralised distribution) as a *sufficient reason* to abandon desert as a distributive principle within institutions. Camp A views it as a *challenge to implement desert-tracking better*, not an indictment of the principle itself. *This is a substantive disagreement about the weight given to a specific harm and its implications for normative theory (Crux 2 & 3).*

  **Verdict:** The core substantive disagreements identified in Section 2 (Cruxes 1-4) remain. However, recognising that 'desert' functions differently in character evaluation versus distributive claims (Point 1 above) is crucial for understanding the depth of Camp B's objection and the challenge facing Camp A's proposed rehabilitation. Much mutual frustration ("changing the subject") stemmed from not fully distinguishing these contexts in debate.

  **Section 5: Residual Dissensus Register**

  Our collaboration deliberately leaves the following questions unresolved, recognising that answering them definitively would require philosophical or empirical resources beyond our current scope or consensus methodology:

  1.  **The Metaphysical Status of Agency:** Does a sufficiently robust conception of individual agency exist to ground pre-institutional desert claims (Camp A), or is agency always so deeply embedded in and conditioned by unchosen circumstances that it cannot bear the justificatory weight required (Camp B)? *Resolution requires deep, contested metaphysics of free will and moral responsibility beyond our remit.*
  2.  **The Feasibility of Non-Moralising Desert Metrics:** Can institutions ever develop and implement metrics for 'effort' or 'contribution' that effectively track Camp A's desert bases *without* triggering the harmful moralisation and perceived worth judgments that Camp B identifies? *Resolution requires extensive, context-specific social science experimentation and longitudinal study we haven't conducted.*
  3.  **The Comprehensive Theory of Just Entitlements:** Precisely what principles (beyond rejecting desert-based distribution) should define the 'legitimate expectations' and 'entitlements' within Camp B's preferred institutional framework, especially concerning effort and contribution? *Developing a full positive alternative theory is beyond the scope of this adversarial collaboration focused on critique.*
  4.  **The Priority Rule Between Desert and Background Justice:** If pre-institutional desert exists (per Camp A), how should claims based on it be balanced or constrained by the demands of background justice (e.g., ensuring a social minimum, fair opportunity) when they potentially conflict? *Resolving priority rules requires a more comprehensive normative theory integrating both concerns.*

  **Concluding Remark:** We, the undersigned, remain fundamentally at odds on the foundations of distributive justice concerning desert. Yet, this dialogue has sharpened our understanding of our own positions, clarified the precise points of divergence, and revealed a substantial shared platform for criticising existing meritocratic practices. We offer this statement not as a resolution, but as a map for ongoing critical engagement and a testament to the possibility of productive adversarial collaboration on matters of deep ethical significance. Our shared condemnation of the injustice inherent in current systems stands firm, even as our paths towards a more just alternative diverge.

  **[Signatory A]**
  **[Signatory B]**
