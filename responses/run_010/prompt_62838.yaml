prompt: |-
  Six weeks ago I left an academic post in metaphysics for a knowledge-engineering group that maintains a hazard-classification database for industrial chemicals and battery materials. Nearly every substantive field in the schema is a dispositional claim — this substance is corrosive to steel, this electrolyte is thermally unstable, this powder is a sensitizer — and downstream users treat those fields as licensing conditionals: if it contacts moist steel, expect attack; if it passes this temperature, expect runaway. Our own data keeps defeating the conditionals. An inhibitor in the formulation suppresses an attack that would otherwise have occurred. A passivation layer forms on first contact and prevents the rest. Inert packaging blocks the manifestation entirely. A mixture partner changes the profile while the substance itself is untouched. My colleagues file all of this as data-quality exceptions and move on. I have come to think it is the central phenomenon rather than the noise around it, and that whatever semantics we adopt for the schema is an implicit answer to the question of what a disposition is.

  Before I draft a proposal, I want the specification rather than the candidate theories. Write the desiderata: what any adequate account of dispositions has to deliver in order to be worth building on. Please do not give me references or further reading — I want the reasoning, not the literature.

  Structure the response in exactly these sections, in this order:

  **Bottom line up front** (~150 words). The three or four requirements that do the most work, the tension you take most seriously, and your one-sentence answer to whether a theory meeting all of them is available.

  **What the theory is for** (~200 words). Restate the purpose as you understand it — an account good enough to underwrite a classification scheme whose entries stay true as surrounding conditions change — and tell me where that purpose distorts the general question, so I know which desiderata are load-bearing for me and which I could ignore.

  **The desiderata** (~1,300 words). Numbered. For each: the requirement stated precisely enough that I could check a theory against it; the case that motivates it, drawn from both the familiar stock examples (the wire kept dead by a device that activates on contact, the fragile article packed in cushioning, the antidote already present in the bloodstream, the object with no such disposition that an interfering agent would break if it were struck) and, where you can manage it, my setting — if a stock case does not transfer to industrial materials, say so, since that is itself informative; my verdict on whether it is non-negotiable or a preference; and what a failure would look like in practice. Cover at least: the fink and mask phenomena and whatever asymmetry between them a theory owes us; the demand that the account explain why repackaging a substance leaves its dispositions intact while adding an inhibitor does not; graded and probabilistic manifestation; multi-track dispositions and the problem of specifying stimulus conditions; whether every disposition requires a categorical basis distinct from itself; whether dispositions must be intrinsic to their bearers or may be context-relative; whether dispositions do causal work or are displaced by whatever grounds them; and what blocks an account on which every property turns out to be dispositional all the way down.

  **Sets that cannot be jointly satisfied** (~400 words). Identify any pair or triple of the above that you suspect no theory can meet at once, argue the incompatibility rather than assert it, and say which member should go and what is lost by dropping it. Then name the single requirement that knocks out the largest number of otherwise respectable views.

  **Prejudices wearing the costume of requirements** (~300 words). Which things routinely demanded of a theory here are genuine constraints on dispositions, and which are artifacts of one particular research program — most obviously the program of analysing dispositions into conditionals, but also its critics. Explain why each of the bogus ones feels mandatory from inside the program that generates it.

  **The contenders against the list** (~300 words). Briefly and by description of position rather than by name: the conditional analyses and their reformed descendants, the view that takes dispositions as irreducible features of the world, and any account that reaches for possibility or potentiality without routing through conditionals. Which survives the list best, and at what cost.

  **What I should store instead** (~200 words). Given your conclusions: dispositions, manifestations, context-indexed conditionals, or something else — and what the honest semantics of my schema turns out to be.
reasoning: |-
  Hmm, the user has presented a fascinating challenge about dispositions in industrial hazard classification systems. They've transitioned from academic metaphysics to practical knowledge engineering and noticed that dispositional claims in their database keep failing due to inhibitors, passivation layers, packaging, and mixture effects. Their colleagues treat these as exceptions, but they see this as central to understanding dispositions. They want desiderata for an adequate theory of dispositions, structured very specifically without references.

  The user is clearly frustrated with how current systems handle real-world complexity. They need a framework robust enough for industrial applications where substances behave differently based on context. Their background in metaphysics gives them theoretical insight, but they're now grounded in practical consequences - misclassification could lead to safety risks.

  I need to carefully construct this response following their exact structure. The bottom line should emphasize: context-relativity as essential, the asymmetry between masks and finks, probabilistic/graded manifestations, and rejecting global intrinsicality. The tension between context-relativity and causal efficacy seems most critical.

  For "what the theory is for," I'll clarify this is about building stable yet flexible classification for changing conditions, which distorts by prioritizing practical predictability over metaphysical completeness. Load-bearing requirements will be those handling inhibitors and mixtures.

  In the desiderata section, I'll systematically cover:
  - Mask/fink asymmetry using steel corrosion examples
  - Repackaging vs inhibitor differences
  - Probabilistic cases like thermal runaway
  - Multi-track dispositions in complex mixtures
  - Rejecting categorical basis requirement
  - Context-relativity as non-negotiable
  - Causal efficacy without reduction
  - Blocking pandispositionalism

  I suspect intrinsicality and categorical basis requirements cause the most incompatibility. The intrinsicality myth persists because people conflate bearer-identity with manifestation conditions.

  For contenders:
  - Conditional analyses fail on masks/finks
  - Simple primitivism can't explain asymmetry
  - Potentiality-based views handle context best but struggle with causal work

  The practical recommendation should be to store manifestations with precise context parameters rather than bare dispositions. The honest semantics would be probabilistic conditionals indexed to standardized contexts.

  Throughout, I'll use their industrial examples to ground philosophical points, showing how academic problems manifest in safety-critical systems. The tone should remain precise but acknowledge the real-world stakes - this isn't just theoretical, but about preventing industrial accidents.
answer: |-
  ### **Bottom line up front**  
  An adequate theory must: (1) **Distinguish masks/finks asymmetrically** (inhibitors block manifestations without altering the disposition; finks alter the disposition itself); (2) **Embrace context-relativity** (dispositions depend on bearer-context pairs, not intrinsic properties alone); (3) **Handle graded/probabilistic manifestations** (e.g., thermal instability with variable thresholds); and (4) **Deny global intrinsicality** (not all dispositions are intrinsic; extrinsic factors like packaging can be constitutive). The core tension is between context-relativity and causal efficacy: if dispositions are context-bound, how do they *explain* behavior beyond describing it? A viable theory exists: dispositions are *context-indexed potentialities*, grounded in a bearer’s properties but requiring specification of background conditions to manifest. This avoids pandispositionalism while accommodating industrial complexity.

  ---

  ### **What the theory is for**  
  Your purpose is a **stable yet flexible classification schema** for industrial hazards, where entries remain reliable despite contextual shifts (e.g., new inhibitors, packaging). This distorts the general metaphysics of dispositions by prioritizing *predictive utility* over ontological austerity. You need an account that:  
  - **Preserves substance identity** across formulations (e.g., "corrosive to steel" must still apply even when inhibited, but not when chemically altered).  
  - **Supports probabilistic risk assessments** (e.g., "thermally unstable" might manifest in 95% of uncontrolled scenarios).  
  - **Tolerates incomplete data** (e.g., unknown mixture partners).  
  *Load-bearing desiderata*: Context-relativity, mask/fink asymmetry, and graded manifestations. *Ignorable*: Debates about categorical bases (irrelevant for engineering schemas) or whether dispositions "cause" manifestations (your users need reliable conditionals, not causal mechanisms).  

  ---

  ### **The desiderata**  
  1. **Asymmetric treatment of masks vs. finks**  
     - *Requirement*: Masks (e.g., inhibitors, passivation layers) prevent manifestation *without* destroying the disposition; finks (e.g., a catalyst that decomposes on contact) destroy/modify the disposition itself. A theory must explain why masks are extrinsic blockers, while finks are intrinsic changers.  
     - *Case*: Inhibited acid is still "corrosive to steel" (masked), but an electrolyte that decomposes into inert compounds upon heating loses "thermal instability" (finked). Stock cases (e.g., fragile glass in foam) transfer directly.  
     - *Non-negotiable*: Failure means misclassifying inhibited corrosives as "non-corrosive," inviting unsafe handling.  
     - *Industrial relevance*: Your database must flag masked dispositions (e.g., "corrosive unless inhibited") but retire finked ones (e.g., "unstable after chemical decay").  

  2. **Context-relativity without bearer-relativity**  
     - *Requirement*: Dispositions belong to substances *relative to contexts* (e.g., packaging, temperature ranges), but the bearer (e.g., the chemical) remains the locus. Repackaging leaves dispositions intact; adding an inhibitor masks them.  
     - *Case*: Powder stored in inert argon is still a "sensitizer" (context-change); adding a neutralizing agent makes it non-sensitizing (mask). Stock cases (e.g., poison with antidote in bloodstream) align.  
     - *Non-negotiable*: Failure conflates storage conditions with substance identity, causing erroneous declassification (e.g., marking sensitizers "safe" due to packaging).  

  3. **Graded and probabilistic manifestations**  
     - *Requirement*: Manifestations need not be binary (yes/no) or deterministic. A theory must accommodate probabilities (e.g., 70% chance of reaction above 50°C) and degrees (e.g., "mildly corrosive").  
     - *Case*: Battery electrolytes may exhibit probabilistic thermal runaway depending on impurities. Stock cases (e.g., "flammable in air" with ignition probability) transfer.  
     - *Non-negotiable*: Industrial risk models require quantitative thresholds. Failure forces artificial binarization, underestimating hazards.  

  4. **Multi-track dispositions and underspecified stimuli**  
     - *Requirement*: A single disposition (e.g., "corrosive") may manifest differently under distinct stimuli (e.g., moist air vs. immersion). Stimulus conditions need not be fully enumerable.  
     - *Case*: A solvent may corrode steel on contact but not aluminum—yet "corrosive" applies to both *in context*. Stock cases (e.g., "soluble" in water but not oil) fit.  
     - *Preference*: Requiring exhaustive stimulus lists is impractical; your schema can use partial descriptors (e.g., "corrosive to ferrous metals").  

  5. **No distinct categorical basis**  
     - *Requirement*: Dispositions need not reduce to non-dispositional "bases" (e.g., molecular structure). A substance’s properties may be inherently dispositional.  
     - *Case*: "Thermal instability" *is* the molecular propensity to decompose; positing a "basis" adds no value for hazard classification. Stock cases (e.g., fragility as atomic bonding) struggle here—industrial chemistry often treats dispositions as fundamental.  
     - *Preference*: Insisting on categorical bases burdens your schema with speculative metaphysics.  

  6. **Extrinsic dispositions permitted**  
     - *Requirement*: Some dispositions are extrinsic (e.g., "explosive in air" depends on oxygen). Not all are intrinsic to the bearer.  
     - *Case*: Lithium is "pyrophoric in air" but inert in argon. Repackaging exploits this extrinsicality. Stock cases (e.g., "water-soluble" requires H₂O) align.  
     - *Non-negotiable*: Classifying substances without environmental context is useless for hazard control.  

  7. **Dispositions as causal players**  
     - *Requirement*: Dispositions must *explain* manifestations (e.g., corrosiveness causes steel degradation), not merely describe regularities.  
     - *Case*: Downstream users infer causal chains from your data (e.g., "if sensitizer present, expect allergic reaction"). Stock cases (e.g., fragility causing breakage) transfer.  
     - *Non-negotiable*: Failure reduces dispositions to labels, undermining predictive utility.  

  8. **Block pandispositionalism**  
     - *Requirement*: The theory must avoid reducing all properties to dispositions (e.g., "mass" is not "disposed to resist acceleration").  
     - *Case*: Your schema needs non-dispositional anchors (e.g., molecular weight, pH) to ground predictions. Stock cases fail here—metaphysics debates "pure powers," but your industrial setting requires stable metrics.  
     - *Non-negotiable*: Pandispositionalism makes classification circular (e.g., "corrosive" defined via further dispositions).  

  ---

  ### **Sets that cannot be jointly satisfied**  
  - **Incompatible triad**: (A) Dispositions are intrinsic; (B) Masks are extrinsic; (C) Repackaging leaves dispositions intact. (A) and (B) conflict because masks (extrinsic) suppress intrinsic dispositions—yet repackaging (extrinsic change) doesn’t alter them. *Resolution*: Drop (A). Intrinsicality is a myth for hazardous materials; dispositions are *grounded* in intrinsic properties but *defined* relative to contexts. Loss: Sacrifices metaphysical elegance for accuracy.  
  - **Major knockout requirement**: **Causal efficacy** (#7). It eliminates:  
    - Conditional analyses (dispositions as "if-then" rules, which describe but don’t explain).  
    - Quidditism (dispositions as bare labels).  
    - Strong reductionism (dispositions replaced by microstructures).  

  ---

  ### **Prejudices wearing the costume of requirements**  
  - **"Stimulus conditions must be explicit"**: Artifact of conditional analyses. Feels mandatory because conditionals require antecedents, but underspecified stimuli (#4) are unavoidable industrially (e.g., "corrosive under unspecified contaminants").  
  - **"Dispositions must be intrinsic"**: Artifact of substance metaphysics. Feels mandatory to preserve bearer identity, but in practice (#6), extrinsicality is unavoidable (e.g., "oxidizer" requires a reducible partner).  
  - **"Manifestations must be deterministic"**: Artifact of logical positivism. Feels mandatory for crisp conditionals, but probabilistic hazards (#3) dominate industrial settings.  

  ---

  ### **The contenders against the list**  
  1. **Conditional analyses (and descendants)**  
     - *Position*: Dispositions reduce to conditionals (e.g., "fragile iff it breaks if struck"). Reformed versions add ceteris paribus clauses.  
     - *Verdict*: Fails #1 (cannot distinguish masks/finks), #3 (struggles with probabilities), and #7 (no causal explanation). Unsuitable.  

  2. **Primitivism (dispositions as irreducible)**  
     - *Position*: Dispositions are fundamental properties.  
     - *Verdict*: Satisfies #1, #7, and #8. Fails #3 (primitives rarely probabilistic) and #4 (avoids stimulus specification). Cost: Offers no guidance for contextual variance (#2, #6).  

  3. **Potentiality-based views**  
     - *Position*: Dispositions are potentialities indexed to contexts (e.g., "corrosive-in-standard-air").  
     - *Verdict*: Best fit. Satisfies #1–#6 and #8. Handles #7 via causal powers emergent in contexts. Cost: Context-indexing complicates schema design (requires explicit background parameters).  

  ---

  ### **What you should store instead**  
  **Store manifestations, not dispositions.** Your schema’s "honest semantics" is:  
  - **Manifestation types** (e.g., corrosion, thermal runaway) indexed to **standardized contexts** (e.g., "in humid air at 25°C, unpassivated steel").  
  - **Probabilities/grades** (e.g., "80% chance of corrosion within 24h").  
  - **Masking/finking flags** (e.g., "inhibited by X," "deactivated above 150°C").  

  *Why this works*:  
  - Avoids reifying "dispositions" as context-independent.  
  - Directly encodes usable conditionals (e.g., "if uninhibited and contacting steel, expect corrosion with P=0.8").  
  - Accommodates mixture effects by treating them as context shifts (e.g., "with Y, manifests as Z").  
  - Aligns with your data: The "central phenomenon" is that manifestations are contextually constrained outcomes—not properties of substances alone.
