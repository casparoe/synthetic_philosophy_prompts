  - Systematically dismantle Condition 1 as trivial for both theories
  - Show how Condition 2's priming forces a choice: is priming access or not?
  - Highlight Condition 3's no-report brightness as the real battleground
  - Make workspace theorists defend "degrees of access" earnestly
  - End by forcing students to admit theories aren't empty if they constrain each other

  *Checking watch*... Timing is tight! The 850-word model answer must model precision: no fluff, just targeted moves that match the marking scheme. Philosophy students might stumble on "what counts as access?" while psychologists might miss Block's conceptual move about reportability being merely a marker.

  *Nodding*... The bonus question intentionally blurs philosophy/psychology lines – good equalizer. Both camps should lose marks if they can't articulate why ignition could be disproven (e.g., finding ignition without subjective reports despite ideal measurement).
answer: |-
  Here’s the exam question, model answer, marking scheme, and analysis tailored to your specifications:

  ---

  ### **Final Exam Question (Consciousness Section)**  
  *(Word count: 340)*

  **Question 4: Consciousness and Access**  
  A study investigates whether perceptual experience ("phenomenal consciousness", P) can exceed cognitive access (A). Participants view six letters flashed for 50ms in a circle around a fixation point. Three conditions are tested:  
  - **Condition 1 (No Mask):** A cue immediately indicates which letter to report. Accuracy is ~95%. When the cued letter is later shown in a lexical decision task (200ms post-display), it primes faster responses.  
  - **Condition 2 (Masked, Immediate Cue):** A pattern mask appears 100ms after the letters. Cued-letter report drops to chance (~17%), but priming from the masked letter remains identical to Condition 1.  
  - **Condition 3 (Masked, Delayed Cue + No-Report):** Masked letters are shown, but the cue is delayed by 2 seconds (report chance-level). In a separate block, *no letter report is ever requested*. Here, participants perform at 68% (vs. 50% baseline) on a forced-choice task judging which semicircle appeared brighter, while denying seeing anything.  

  **(a)** For each condition, evaluate whether it provides evidence that *phenomenal consciousness exceeds access*. (9 marks)  
  **(b)** How might a global workspace theorist (GWT) reconcile Conditions 2 and 3 with their view that consciousness *is* global availability, if they argue access comes in degrees? (6 marks)  
  **(c)** What key control or manipulation would be needed to test whether Condition 3 genuinely challenges GWT? (4 marks)  
  **(d)** Block’s critics argue that if every measure of P-consciousness also measures A-consciousness, the distinction collapses. Does this study support that claim? Defend your view. (6 marks)  

  ***(Optional Bonus: +3 marks)***  
  **(e)** Suppose a modified GWT claims "ignition" (neural broadcasting) can occur in zombies without P-consciousness. Would this salvage the theory? Why/why not?  

  ---

  ### **Model Answer (Full Marks, 850 words)**  
  **(a) Condition-by-condition evaluation:**  
  - **Condition 1** shows *no* P-A divergence: high report accuracy and priming align with both GWT (where ignition enables report *and* priming) and Block (A-access includes report + downstream effects). Neither theory is challenged.  
  - **Condition 2** *appears* to support Block: report fails (suggesting no A-access) but priming persists (implying unreported P-consciousness). However, priming itself may *be* a form of access—e.g., to semantic networks—meaning no true P without A exists here. GWT could argue partial ignition occurred but was insufficient for report.  
  - **Condition 3** is the strongest case for Block. Brightness discrimination (68%) without reportability or subjective awareness suggests P-consciousness without *any* A-access. GWT must explain how "ignition" could support discrimination yet leave subjects unaware *and* unable to report. The no-report block avoids confounds from attention shifts during cueing.  

  **(b) GWT’s "degrees of access" reply:**  
  GWT could argue access is graded:  
  - **Condition 2:** Masking prevents *full* broadcasting, but partial ignition enables local semantic access (priming) without global availability for report.  
  - **Condition 3:** Delayed cues prevent access consolidation. The brightness task’s 68% accuracy reflects degraded global access—enough for forced-choice discrimination but not for letter identification or acknowledgment. Subjective denials arise because GWT links consciousness to *report-ready* access; degraded access isn’t "experienced" as such.  

  This preserves GWT if "ignition" is scalar. However, Block would retort: if even unreportable discrimination counts as access, "A-consciousness" becomes vacuously broad.  

  **(c) Crucial control for Condition 3:**  
  To confirm brightness discrimination reflects P-consciousness *without* access, test for **neural correlates of ignition** (e.g., EEG/PET). If prefrontal "broadcasting" signatures (GWT’s ignition marker) are absent during discrimination, GWT is falsified. If present, Block must explain why ignition ≠ consciousness. Manipulate attention (e.g., dual-tasks): if discrimination persists without attentional resources, it challenges GWT’s reliance on top-down access.  

  **(d) Does operationalization collapse the distinction?**  
  No—this study shows how the debate *shifts* operationalization but doesn’t dissolve.  
  - Block can argue: Condition 3’s brightness discrimination is a *new measure of P* (non-report-dependent) that dissociates from A (report/subjective awareness).  
  - GWT can counter: Forced-choice discrimination *is* access (it guides behavior), so P still reduces to A.  
  The impasse reveals a **conceptual fork**: Block defines A by *reportability/cognitive control*; GWT defines it by *information use*. The distinction holds *if* we accept Block’s narrower A-definition. The theories aren’t empty: each constrains what counts as evidence (e.g., GWT must explain ignition failures; Block must explain unreportable perception).  

  ***(Bonus) Zombie ignition?**  
  Claiming ignition without P-consciousness saves GWT from falsification but at a cost:  
  - If zombies (no P) can have ignition, "ignition" no longer explains P—it becomes an arbitrary add-on.  
  - This conflates GWT with epiphenomenalism: if ignition does all cognitive work without P, P is irrelevant.  
  GWT’s strength is tying consciousness to a functional role (global access); sacrificing this link makes it unfalsifiable and explanatorily hollow.  

  ---

  ### **Marking Scheme (25 marks)**  
  | **Criteria**                                                                                                | **Marks** | **Common Pitfalls**                                                                                                |  
  |---------------------------------------------------------------------------------------------------------|-----------|----------------------------------------------------------------------------------------------------------------|  
  | **(a) Condition analysis**: Correctly identifies Condition 1 as neutral, Condition 2 as ambiguous (priming ≠ automatic P-evidence), Condition 3 as strongest for Block. | 9         | Psych students: Assume priming = P-consciousness (ignoring priming-as-access). Phil students: Dismiss Condition 3 for relying on "indirect" measures. |  
  | **(b) GWT defense**: Explains how graded access (partial broadcasting) accounts for priming + discrimination without report. Notes tension with Block’s A-definition.          | 6         | Psych students: Overstate neural plausibility of "degrees." Phil students: Reject GWT as circular without engaging the scalar proposal. |  
  | **(c) Control/manipulation**: Proposes neural ignition markers or attention manipulation *and* explains how outcomes test GWT.                              | 4         | Vague suggestions (e.g., "better masks"); no link to theory. Both cohorts neglect neural controls.                     |  
  | **(d) Verdict on collapse**: Argues distinction survives via conflicting operationalizations; notes theories constrain each other empirically.                      | 6         | Psych students: Declare distinction meaningless if unreportable P is inaccessible. Phil students: Claim operationalization voids all empirical debate. |  
  | ***(Bonus)*** **Zombie critique**: Notes trade-off (saves GWT but severs consciousness-function link), invoking epiphenomenalism/falsifiability.                            | +3        | Defends zombie ignition as viable without addressing explanatory cost.                                          |  

  ---

  ### **Cohort-Specific Weaknesses & Fairness**  
  - **Psychology students** likely lose marks in:  
    - **(a)** Treating priming as definitive P-consciousness (ignoring it may *be* access).  
    - **(d)** Conflating "unreportable" with "unaccessible" (discrimination *is* access under GWT).  
  - **Philosophy students** likely lose marks in:  
    - **(b)** Dismissing GWT’s graded-access move as "not real philosophy" without argument.  
    - **(c)** Neglecting empirical controls (e.g., neural correlates) as "irrelevant to conceptual issues."  
  - **Fairness**: The question balances both:  
    - Psych students shine on experimental logic (Conditions 2–3), phil students on conceptual distinctions (d).  
    - The study’s novelty forces *all* to engage beyond rehearsed debates.  
    - Bonus question bridges the divide: zombies are philosophical, but falsifiability is empirical.  

  **Adjustments from your draft**:  
  - Trimmed **condition descriptions** by 20% (still self-contained).  
  - Merged "what counts against GWT" into **(c)** for efficiency.  
  - **Bonus** targets high-fliers without unbalancing core marks.  

  This tests *meta-theoretical* grasp—exactly as you hoped.
