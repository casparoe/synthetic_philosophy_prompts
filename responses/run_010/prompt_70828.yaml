answer: |-
  ### 1. Ungraded Thinking: Core Concepts  
  **(Scratch Work)**  

  The heterogeneity problem challenges *phenomenological hedonism*: the view that pleasure is a unitary, introspectively identifiable feeling (a "hedonic tone") common to all pleasant experiences. Introspection reveals diverse feelings (e.g., warmth, relief, amusement), with no shared qualitative element. Hedonists (who claim pleasure is the sole intrinsic good) face three responses:  
  - **Felt-Quality Hedonism**: Insist on a common phenomenological marker (e.g., Crisp). Risks implausibility against introspection.  
  - **Functional Hedonism**: Define pleasure as whatever mental states we intrinsically desire to sustain (e.g., Sidgwick). Avoids heterogeneity but may collapse into desire-satisfaction theory.  
  - **Attitudinal Hedonism**: Pleasure is an attitude (e.g., "taking delight in") toward any content (e.g., Feldman). Decouples pleasure from specific feelings.  

  The problem is distinct from whether pleasure *alone* matters (the Experience Machine objection). Even if pleasures share no feel, they might share a *property* (e.g., motivational force) allowing aggregation. Mill’s "higher pleasures" aren’t necessarily non-hedonic; they may reflect qualitative differences *within* pleasure.  

  ---

  ### 2. Claim-by-Claim Audit  

  **Claim 1**: *"The Experience Machine objection is just the heterogeneity problem in disguise."*  
  **Verdict**: **Subtly wrong**. The Machine targets whether pleasure is *sufficient* for the good life (a normative claim), while heterogeneity questions whether "pleasure" refers to a unified *phenomenon* (a metaphysical/epistemic claim). Conflating them obscures distinct challenges.  

  **Claim 2**: *"Introspection finds no shared ingredient in diverse pleasant experiences."*  
  **Verdict**: **Accurate (with caveat)**. This is the core heterogeneity observation (Sidgwick, Broad). Charitably, it targets *simple phenomenological hedonism*. Uncharitably, it ignores nuanced defenses (e.g., Crisp’s "hedonic dimension" analogy to "being magnetic"). Context forces the charitable reading.  

  **Claim 3**: *"Functional hedonism reduces to preference theory with relabeled terms."*  
  **Verdict**: **Subtly wrong**. Functionalism (defining pleasure via desire/disposition) *can* avoid collapsing into preference theory if "desiring to sustain" is distinguished from "desiring as good" (Sidgwick). The essay implies equivalence, but functional hedonists deny that desires *constitute* value; they claim we desire pleasures *because* they feel good.  

  **Claim 4**: *"Felt-quality hedonism is refuted by introspection."*  
  **Verdict**: **Fair simplification**. Introspection *prima facie* undermines simple felt-quality views. However, it omits rebuttals (e.g., that heterogeneity might reflect inattention to a common low-intensity component).  

  **Claim 5**: *"Hedonism is empty: no statement of it could be false."*  
  **Verdict**: **False**. Felt-quality hedonism is empirically falsifiable (if neuroscience found no common neural correlate). Functional/attitudinal versions make testable claims (e.g., we intrinsically desire *only* pleasurable states). The argument conflates *semantic indeterminacy* with *empirical unfalsifiability*.  

  **Claim 6**: *"Heterogeneity prevents summing pleasures ('hedonistic utilitarians cannot do arithmetic')."*  
  **Verdict**: **Subtly wrong**. Heterogeneity *challenges* aggregation if pleasure lacks a common scalar property (e.g., intensity), but doesn’t *preclude* it. Functional/attitudinal views can aggregate via strength of desire or attitude intensity. Bentham *assumed* commensurability via intensity/duration; heterogeneity complicates this, but doesn't dissolve it.  

  **Claim 7**: *"Mill abandoned hedonism by ranking higher/lower pleasures."*  
  **Verdict**: **Inaccurate**. Mill explicitly grounds higher pleasures in their *superior phenomenological quality* ("some *kinds* of pleasure are more desirable... than others"). He remains a hedonist by locating value in conscious experience, not external goods.  

  **Claim 8**: *"Ryle/attitudinalists abandon pleasure as a feeling, surrendering hedonism's appeal."*  
  **Verdict**: **Fair simplification**. Attitudinalists (e.g., Feldman) *do* reject pleasure as a sensation, but argue that their view preserves what matters: positive conscious attitudes. The essay fairly notes this departs from hedonism's traditional phenomenological appeal.  

  ---

  ### 3. Conflated Problems  
  The essay runs together three distinct issues:  
  - **Metaphysical Heterogeneity**: Do all pleasures share a common introspectible property?  
  - **Normative Insufficiency**: Is pleasure alone sufficient for well-being (Experience Machine)?  
  - **Incommensurability**: Can pleasures be quantitatively compared/aggregated without a common metric?  
  The first is about *what pleasure is*; the second and third are about *what makes life good*. Conflating them makes hedonism seem incoherent when only certain versions (e.g., Benthamite quantitative felt-quality hedonism) face all three.  

  ---

  ### 4. Evaluation of Key Conclusions  
  - **"Hedonism is empty"**: **Does not survive**. Felt-quality hedonism is falsifiable (Claim 5). Functional/attitudinal versions make substantive claims about motivation/value. Weaker conclusion: *Simple phenomenological hedonism is empirically dubious*.  
  - **"Hedonistic utilitarianism cannot aggregate"**: **Does not survive**. Heterogeneity *challenges* Benthamite aggregation but doesn’t defeat all forms (e.g., attitudinal intensity is quantifiable). Weaker conclusion: *Quantitative felt-quality hedonism cannot plausibly aggregate heterogeneous pleasures*.  

  ---

  ### 5. Strongest Argument & Hedonist Reply  
  **Strongest Anti-Hedonist Argument**:  
  P1. For hedonism to be substantive, "pleasure" must refer to a natural kind.  
  P2. Felt-quality hedonism fails: introspection reveals no common phenomenological property.  
  P3. Functional/attitudinal hedonism either collapses into desire theory (if pleasure is defined by desire) or abandons the experiential core essential to hedonism’s appeal.  
  ∴ Hedonism is either implausible (P2) or vacuous/revisionary (P3).  

  **Best Hedonist Reply (Attitudinal/Feldman-esque)**:  
  - Deny P1: Pleasure need not be a "natural kind"; it is a *propositional attitude* ("being pleased that P") unifying diverse experiences.  
  - Deny P3: This preserves phenomenology (the *attitude* has a distinctive feel) while handling heterogeneity. Desiring to sustain a state is evidence it’s pleasurable, but doesn’t *define* value.  
  - Conclusion: Attitudinal hedonism avoids heterogeneity, remains experiential, and allows aggregation via attitude intensity. *Status: Serious but answerable*.  

  ---

  ### 6. Omissions & Specialist Concerns  
  **What’s Missing on Heterogeneity**:  
  - Nuanced phenomenological defenses (e.g., Crisp’s "hedonic dimension" as a determinable property).  
  - The possibility that pleasure is a *disjunctive natural kind* (shared neurobiological basis despite phenomenological variation).  
  - Distinction between *locating* value in pleasure vs. claiming all value *reduces* to pleasure.  

  **Treatment of Historical Figures**:  
  - **Mill**: Misreads his qualitative hedonism as non-hedonism. Mill’s "higher pleasures" are *more valuable experiences*, not non-experiential goods.  
  - **Bentham**: Correct but oversimplified. Bentham acknowledged *qualitative* factors (e.g., purity) alongside intensity/duration.  
  - **Ryle/Attitudinalists**: Overstates their break with phenomenology. Even attitudinal theories often incorporate a *felt component* to the pro-attitude.  
  - **General Omission**: Ignores contemporary refinements (e.g., Feldman’s intrinsic attitudinal pleasure) that address heterogeneity while preserving aggregation.  

  ---

  ### Final Summary  
  The essay identifies a genuine weakness in *phenomenological hedonism* but overreaches by conflating metaphysical, normative, and aggregative problems. Its dismissal of functional/attitudinal hedonism is uncharitable, and its reading of Mill is incorrect. While heterogeneity complicates Benthamite utilitarianism, it doesn't defeat hedonism per se. A careful critique would target only felt-quality hedonism, granting functional/attitudinal versions as live options. The core problem remains serious but not insurmountable.
