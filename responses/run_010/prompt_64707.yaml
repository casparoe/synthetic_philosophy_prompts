prompt: |-
  I teach an interdisciplinary seminar on collective action and environmental policy — eighteen students, mostly juniors and seniors, roughly half economics majors and half philosophy or political science — and I have one seventy-five-minute session in week five to spend on common-pool resources. Earlier in the term I ran the standard linear public goods game with them (private endowment, voluntary contribution, a 1.6× multiplier, equal redistribution) and it went smoothly but left the discussion bloodless: they solved it, free-rode in a principled way, and then talked about it like an arithmetic exercise. For this session I want something with considerably more grip, and I want the structure of the problem to be discovered rather than announced — nobody should hear the phrase "tragedy of the commons," or the names Hardin or Ostrom, until the final ten minutes. What I want them to carry out of the room is the sense that any collapse they produce was generated by the choice situation and not by their characters, since most of them will have sincerely wanted to conserve, and that whether it happens turns on institutional details: whether withdrawals are anonymous, whether the group is permitted to talk, and whether the rule they play under is one they wrote themselves or one handed down from outside. The payoff has to be felt but cannot involve cash; I am willing to convert tokens into a modest amount of extra credit or into some status prize, but tell me which you would pick and why, and tell me honestly whether the activity needs any conversion at all or whether the in-round stakes will do the work on their own.

  Here is the shape I have in mind; I want you to supply the numbers, tighten the rules, and tell me where my design is wrong. Divide the class into three groups of six. Each group manages a shared renewable stock — a lake, a fishery, whatever you prefer — which starts at some level and regenerates between rounds by some fraction of what remains, subject to a hard ceiling. The feature I care about most is that regeneration is conditional on the stock staying above a threshold somewhere near the middle of its capacity: above it the stock recovers, below it regeneration ceases permanently and the group plays out its remaining rounds on a dead lake. Participants are told that a threshold exists and roughly where it sits, but not where exactly — give them a range rather than a point, and say how wide the range needs to be for the uncertainty to bite without turning the session into a coin toss. Add two asymmetries I think matter: players hold different extraction technologies, so that a unit of effort yields two, one and a half, or one unit of harvest depending on the role, and players' private valuations of the harvest differ, which should make an equal split of the take feel like a windfall to some and a robbery to others. Between rounds each group gets a short window in which it may do any of three things: talk freely; draft and ratify a rule of its own devising, which I will enforce if the group adopts it unanimously; or vote to buy an off-the-shelf enforcement package from me — a flat levy on every withdrawal plus public posting of each individual's take — at a price in tokens. I want the self-written rule to be expensive in time and the purchased package cheap in tokens but fixed in parameters nobody chose, so the two are in genuine tension rather than one obviously dominating. Six rounds or eight, you decide, with a justification for the number.

  What I need back is a complete, runnable plan: the exact parameters (starting stock, regeneration rate and ceiling, threshold range, harvest technology by role, per-unit payoffs, price of the enforcement package, number of rounds, and phase timings to the minute), a materials list, the precise wording of everything participants are told at the outset including how you describe the threshold without giving it away, and a debrief that maps particular moments from the run onto particular concepts in the order the concepts should be named. The debrief should also work in reverse: once the phrase is on the table, I want them to see where the popular version of the idea is simply false about the case they just lived through — that a common-pool resource governed by communal rules is not the same object as an open-access free-for-all, and that the group which wrote its own rule may well have outperformed the group that bought mine. Say plainly what your design cannot capture about real commons governance that I will have to supply by talking; I suspect it has something to do with the length of the relationship and with the fact that my players know they are walking out of the door at the end. Then tell me how this will go wrong on a first run, in what order, and what to do about each instance — the group that colludes within ninety seconds, the group that collapses in round two and spends the rest of the session bored, the economist who reverse-engineers the threshold and announces it to everyone, the student who refuses to accept a sanction they voted against. Finally, identify which of my own assumptions the plan is resting on. I am assuming, for instance, that permitting groups to communicate raises cooperation, and that an externally imposed enforcement scheme can underperform a home-grown one; I want you to name what I would have to observe in the room, or what argument I would have to find persuasive, to abandon either assumption or redesign around it, and to single out the one load-bearing choice in the whole design together with what happens to the session if that choice is wrong.

  For format: after the plan, give me a run-sheet table with the columns phase | clock (minutes elapsed) | what participants do | what the facilitator says or does | intended experience | most likely failure and on-the-spot fix; and then a short JSON object containing one entry per design parameter, each with the fields parameter, value, why_this_value, load_bearing (boolean), and what_changes_if_wrong.
reasoning: |-
  We are designing a classroom simulation for common-pool resources (CPR) that will run in a 75-minute session. The goal is to have students experience the challenges of managing a shared resource, with a focus on institutional details (communication, rule-making, enforcement) and how they affect outcomes. We want to avoid the "bloodless" feel of the public goods game and create a situation where the structure of the problem is discovered and where collapse (if it happens) is due to the situation, not the participants' characters.

  Key Features:
  - Three groups of six students each.
  - Each group manages a renewable stock (e.g., a fishery) that starts at a certain level and regenerates between rounds, but only if the stock remains above a threshold. Below the threshold, regeneration ceases permanently.
  - Asymmetries: 
    a. Different extraction technologies: roles that yield 2, 1.5, or 1 unit of harvest per unit of effort.
    b. Different private valuations of the harvest: so that an equal split of the total harvest would be valued differently by each role.
  - Between rounds, groups can:
    a. Talk freely (no cost, no binding rules).
    b. Draft and ratify a rule of their own (requires unanimous adoption, and the rule is enforced by the facilitator). This is time-consuming.
    c. Vote to buy an off-the-shelf enforcement package (a flat levy on every withdrawal plus public posting of individual takes) at a token cost. This is quick but fixed.
  - The self-written rule option is expensive in time (so they might not have time to do it every round) and the purchased package is cheap in tokens but inflexible.

  Design Parameters to Set:
  1. Starting stock
  2. Regeneration rate and ceiling
  3. Threshold range (with uncertainty)
  4. Harvest technology by role (three roles per group)
  5. Per-unit payoffs for the harvest (to create different valuations)
  6. Price of the enforcement package
  7. Number of rounds (6 or 8)
  8. Timing for each phase (rounds, discussion, rule-making, etc.)

  Additional Requirements:
  - No mention of "tragedy of the commons", Hardin, or Ostrom until the final 10 minutes.
  - Payoff: tokens converted to extra credit or a status prize? We'll consider the stakes and whether conversion is necessary.
  - Materials: We need a way to track the stock and individual harvests. We'll use a shared whiteboard or a Google Sheet for each group, and individual record sheets.

  Proposed Design:

  1. Roles and Asymmetries:
     - Each group of 6 has two of each role:
          Role A (High Efficiency): 1 unit of effort -> 2 units of harvest. (But they value each unit of harvest at 1 point)
          Role B (Medium Efficiency): 1 unit of effort -> 1.5 units of harvest. (Value each unit of harvest at 1.5 points)
          Role C (Low Efficiency): 1 unit of effort -> 1 unit of harvest. (Value each unit of harvest at 2 points)

     Why? 
     - The different efficiencies create an incentive for high-efficiency players to extract more (they get more per effort) but the valuation inverses it: 
          Role C values each unit of harvest the most (so they care more about the harvest) but they are the least efficient. 
          Role A is efficient but values each unit less.
     - This setup creates tension: if they split the harvest equally, Role A would get a windfall (because they value each unit at 1, but they get more units) and Role C would feel robbed (because they value each unit at 2, but they get fewer units). Alternatively, if they don't split, then the efficient extractors might take more.

  2. Resource Dynamics:
     - Starting stock: 100 units
     - Regeneration: After each round, the stock regenerates by 20% of the current stock, but only if the stock is above the threshold. The maximum stock (ceiling) is 120 units.
     - Threshold: We'll set the threshold at 40 units. However, we tell the groups that the threshold is between 35 and 45 units (a range of 10, which is 10% of the starting stock). This uncertainty is enough to make them cautious but not so wide that it's a coin toss.

  3. Rounds: 6 rounds. Why? 
     - We have 75 minutes. We need time for setup, rounds, discussions, and debrief. 
     - Each round cycle: 
          a. Harvest decision (each player secretly decides how much effort to exert, from 0 to 5? We need to set effort limits).
          b. Calculate harvest and update stock.
          c. Then between rounds: group discussion and institutional choice (about 5 minutes per between-round phase).

     Total time estimate:
          Setup: 10 minutes
          Rounds: 6 rounds * (harvest: 3 min + between-round: 5 min) = 6*8 = 48 minutes
          Final debrief: 15 minutes
          Total: 73 minutes -> fits.

  4. Effort and Harvest:
     - Each player can choose an effort level between 0 and 5 in integer steps. 
     - The total harvest for the group is the sum of (effort * technology factor) for each player, but cannot exceed the current stock (if they try to harvest more than available, it is reduced proportionally? Or we cap the harvest at the stock? We'll cap: the group harvests the total effort applied times the average technology factor, but not more than the stock. Actually, we want individual harvests to be proportional to their effort? Let's do:

          Total effective effort = (2 * effort of Role A) + (1.5 * effort of Role B) + (1 * effort of Role C)
          Then, if total effective effort <= current stock, then each player gets:
              Role A: 2 * effort (units of harvest)
              Role B: 1.5 * effort
              Role C: 1 * effort

          If total effective effort > current stock, then each player gets a share proportional to their effective effort:
              Harvest_i = (effective_effort_i / total_effective_effort) * current stock

          Then the stock is reduced by the total harvest (which is min(total_effective_effort, current stock)).

  5. Between-Round Options (takes 5 minutes per between-round phase):
     - The group can choose one of:
          a. Talk freely: 5 minutes of unstructured discussion.
          b. Draft and ratify a rule: They must draft a rule (e.g., limit on effort, equal harvest, etc.) and get unanimous agreement. The facilitator will then enforce it in the next round. This takes the entire 5 minutes and might not succeed if they don't agree.
          c. Buy enforcement package: They can vote (majority?) to buy the package at a cost of 10 tokens per player (deducted from their total points). The package includes:
              - A flat levy of 20% on every unit of harvest (so the player only gets 80% of the harvest value) but then the individual harvests are publicly posted and the levy is collected by the facilitator.
              - The levy is meant to simulate an enforcement cost and to deter over-extraction.

     Why the tension? 
          - The self-written rule is free of monetary cost but requires time and unanimity (which is hard to achieve). The enforcement package is quick (just a vote) and cheap in tokens (10 tokens per player) but the levy is fixed and might be too harsh or not tailored to the group.

  6. Payoff:
     - Each player's payoff per round: 
          (Value per unit of harvest * harvested units) 
          minus any levy (if enforcement package is in effect: then they only get 80% of the value, so 0.8 * value * harvest)
          minus the cost of the enforcement package if they bought it that round (10 tokens per player only in the round they buy it? Actually, we said the package is bought per round? Or for the rest of the game? We'll make it per round: if they buy it in round t, it applies to round t+1, t+2, etc. until they stop? But that complicates. Alternatively, we can have the package last for the rest of the game? That might be too permanent. Let's make it last one round only. Then they must renew it every round if they want it. But that might be too time-consuming? Alternatively, we can have the vote and purchase in a round apply to the next round only.

     We'll do: The enforcement package, if bought in the between-round phase after round t, applies to the next harvest (round t+1). It costs 10 tokens per player, which is a one-time deduction for that round (so they pay 10 tokens in the round they buy it, and then the levy applies to the next harvest).

     But note: the enforcement package also requires a vote each time? We can say that once they buy it, it stays in effect until they vote to remove it? That might be simpler. However, the problem says "vote to buy", so we'll have it per round.

     Alternatively, to save time, we can have the package last for the rest of the game? But then the cost should be higher. Let's make the cost 20 tokens per player one-time and it applies for all subsequent rounds. But then the groups might buy it early and forget. We want the tension every round? I think per round is better.

     Revised: 
          The enforcement package is purchased for one round at a time. The cost is 10 tokens per player (so 60 tokens total per group) and it applies to the next round only.

     Why 10? It should be significant but not too high. We can adjust.

  7. Stock Update:
     - After harvest, if the stock after harvest (current stock minus harvest) is above the threshold (which is 40, but they are told 35-45), then the stock regenerates by 20% (but not exceeding 120). If the stock after harvest is below the threshold, then no regeneration ever again.

  8. Threshold Uncertainty: 
     - We tell them: "The resource has a critical threshold. If the stock falls below this threshold at the end of any round, the resource will stop regenerating for the rest of the game. The threshold is between 35 and 45 units. The exact value is known only to the facilitator."

  9. Payoff Conversion:
     - We will use tokens that are converted into extra credit points. Why extra credit? Because it is tangible and matters to students, but we don't want to use cash. Alternatively, a status prize (like a certificate) might not be motivating enough. We'll convert tokens to extra credit at a rate that is modest (e.g., 1 token = 0.1% of the course grade, so 100 tokens = 10% of the course grade? That's too high. Let's do 1 token = 0.02% of the course grade, so 100 tokens = 2%). We don't want the stakes to be too high to cause stress, but enough to care.

     However, note: the simulation might work without conversion because of the competitive and social dynamics. But to ensure effort, we'll use extra credit.

     We'll tell them: "Your total tokens will be converted to extra credit at the end of the session. Every 10 tokens you earn will add 0.1% to your final course grade, up to a maximum of 1% (so 100 tokens maximum)."

  10. Materials:
      - For each group: a shared board (whiteboard or large paper) to track:
            Round | Stock at start | Harvest (by each and total) | Stock after harvest | Regenerated? | Stock for next round
      - Individual record sheets for each player to record their effort, harvest, and points per round.
      - A calculator for the facilitator (or a spreadsheet) to compute the harvest and stock update.

  11. How to run:
      - Each round:
          Step 1: Each player secretly writes their effort (0-5) on a slip and gives it to the facilitator.
          Step 2: The facilitator computes the total effective effort and the harvest for each player (capping at the current stock if necessary).
          Step 3: The facilitator updates the stock and checks the threshold: if the stock after harvest is below 40 (the threshold), then mark that the resource is dead and no more regeneration.
          Step 4: If the resource is not dead and above the threshold, then apply regeneration: new_stock = min(1.2 * (stock after harvest), 120).
          Step 5: The facilitator announces the new stock level and whether the resource has collapsed (if it fell below the threshold in this round) and whether regeneration occurred.

      Between rounds:
          The facilitator announces that the group has 5 minutes to choose one of the three options:
            Option 1: Talk freely (just discuss without making rules or buying anything).
            Option 2: Draft and ratify a rule (must be unanimous). They must write the rule clearly and all sign. The rule must be about the next round's harvest (e.g., "each player can use at most 3 effort", or "the harvest must be split equally", etc.). The facilitator will enforce it in the next round.
            Option 3: Vote to buy the enforcement package for the next round. It costs 10 tokens per player. The vote is by show of hands (majority wins). If they choose this, they must pay the 10 tokens per player and the package will be in effect for the next round.

      Note: The enforcement package does two things:
            a. It imposes a 20% levy on the value of each player's harvest (so they get only 80% of the value).
            b. It makes each player's harvest public to the group.

  12. Debrief Plan (last 15 minutes):
      - First, ask each group to report: Did they collapse? When? What institutional choices did they make?
      - Then, reveal the threshold and the regeneration rule.
      - Now introduce the terms: "tragedy of the commons", Hardin (who emphasized the inevitability of collapse in open access), and Ostrom (who showed that communities can design rules to avoid it).
      - Highlight the differences between the groups: 
            - The group that collapsed early: likely did not communicate or failed to agree on rules.
            - The group that avoided collapse: might have used communication and/or rules.
      - Emphasize: collapse was due to the situation (the threshold, the incentives) and not because they are bad people. They wanted to conserve but the structure made it hard.
      - Point out the institutional details that mattered: 
            - Whether they could talk (communication).
            - Whether they could make their own rules (self-governance) or bought an external one.
            - The fact that the self-written rule, if they could agree, might have been more efficient than the one-size-fits-all enforcement package (because they could tailor it to their asymmetries).
      - Also note: the group that bought the enforcement package might have avoided collapse, but at a cost (the levy and the token payment) and without addressing the underlying asymmetries.

      Reverse mapping: 
            - The popular version of the tragedy (open access free-for-all) is not the same as a CPR with communal rules. In the simulation, groups that used rules (either self-written or the package) might have avoided collapse. 
            - The group that wrote its own rule might have outperformed (in terms of total group welfare) the one that bought the package because they didn't pay the levy and token cost, and they designed a rule that fit their needs.

  13. What the design cannot capture:
      - Real commons often involve long-term relationships and repeated interactions over a long time. In the simulation, they know it ends in 6 rounds, so they might discount the future heavily. In real life, the shadow of the future is long and that encourages cooperation.
      - In real life, rules are often evolved over time and enforced by the community, not by an external enforcer (like the facilitator). We simulate the enforcement by the facilitator, but in reality, the community might have its own enforcement mechanisms.

  14. Potential Problems and Fixes:

      a. Group that colludes within ninety seconds: 
          Problem: A group might quickly agree on a rule and then have time left. 
          Fix: The rule-making requires unanimity and the facilitator must approve the rule (to ensure it is clear and enforceable). If they finish early, they can use the remaining time to talk, but cannot change the rule.

      b. Group that collapses in round two and gets bored: 
          Problem: They have 4 more rounds with a dead resource. 
          Fix: Tell them that even if the resource is dead, they can continue to harvest (until the stock is gone) and they can still try to make rules or buy the enforcement package (which would then only affect the public posting and the levy). The resource doesn't regenerate, but they can still extract. Also, the debrief will be interesting for them because they can reflect on why they collapsed.

      c. Economist who reverse-engineers the threshold: 
          Problem: A student might deduce the threshold and announce it. 
          Fix: Before the game, emphasize that the threshold is uncertain for a reason (to mimic real-world uncertainty) and that they should not try to calculate the exact value. If someone does, remind the group that the facilitator has set a range and that the exact value is not for them to know. Also, the threshold might vary by group? Actually, we set the same for all. Alternatively, we could have different thresholds for each group? That might complicate. We'll stick to the same and if someone says it, say "that is your speculation, but the actual threshold might be different".

      d. Student who refuses to accept a sanction they voted against: 
          Problem: In a group that adopts a rule by unanimity, everyone must agree. But if a rule is adopted and then a player violates it, the sanction might be enforced by the facilitator. But what if the rule was made in a previous round and the player now doesn't want to follow? 
          Fix: The rules are enforced by the facilitator. At the time of rule adoption, they all agreed. So in the harvest, if a player violates the rule (e.g., uses more effort than allowed), the facilitator will reduce their effort to the allowed level. So the player cannot refuse. Similarly, for the enforcement package: if the group votes to buy it (by majority), then everyone must pay the token cost and the levy applies to everyone.

  15. Load-bearing Assumptions:
      - Assumption 1: Communication raises cooperation. If in the simulation, groups that communicate do not show increased cooperation (i.e., they collapse anyway) then we must reconsider. We would have to see that even with communication, they could not agree on rules or they agreed on bad rules. Then we might need to redesign to make communication more effective (e.g., by giving more time) or to include more structured communication.
      - Assumption 2: Self-written rules can outperform external ones. If in the simulation, groups that write their own rules consistently do worse than those that buy the package, then we must question this. We would have to see that the self-written rules are too hard to design or that the package is more efficient. Then we might adjust the cost of the package or the rule-making process.

      The most load-bearing choice: The threshold and the regeneration rule. If the threshold is set too high (e.g., 60) then it is too easy to collapse and the game becomes too hard. If too low (e.g., 20) then it is too easy to avoid. We set it at 40 (40% of starting stock) and with a range of 35-45. If this choice is wrong (e.g., if groups consistently collapse in round 2 or never collapse) then the learning point about the threshold effect is lost. We should test the parameters with a few trial runs.

