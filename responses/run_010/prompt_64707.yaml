  ---

  ### How This Addresses Your Requirements
  - **Grip via asymmetries**: Role C (high valuation, low efficiency) *wants* conservation but can’t enforce it; Role A (low valuation, high efficiency) "free-rides" structurally.  
  - **Collapse ≠ character**: Threshold mechanics externalize blame ("We didn’t know *exactly* when it would die").  
  - **Institutions discovered**: Self-rule vs. external enforcement tradeoffs emerge organically.  
  - **Stakes**: Extra credit conversion (modest but meaningful) + role-based valuation makes tokens "felt."  
  - **Ostrom/Hardin delayed**: Framed only in debrief to contrast theory with lived experience.  

  ---

  ### What the Design Cannot Capture
  1. **Long-term relationships**: Players know it ends in Round 7. Real CPRs rely on indefinite repetition.  
     *Supply by talking*: "Ostrom’s communities expected to interact for generations. You knew this was temporary—how might that change your choices?"  
  2. **Rule evolution**: Real rules adapt over decades; here, rules are drafted in 5 minutes.  
     *Supply by talking*: "Your rules were reactive. Real institutions evolve through trial-and-error across crises."  

  ---

  ### Failure Modes & On-the-Spot Fixes
  | Failure | Fix |
  |---------|-----|
  | **Group colludes instantly** | Remind: "Unanimity required for self-rule. Role C, are you *truly* okay with Role A’s proposal?" Leverage equity tensions. |
  | **Collapse in Round 2** | Stress: "Harvesting still earns tokens. Focus on equity now the resource is dead." Add a "recovery petition" (theoretical) to stay engaged. |
  | **Economist reverse-engineers threshold** | Bluff: "Groups have different thresholds." (All use 40, but this preserves uncertainty). If leaked, say: "Speculation is part of management—but is it accurate?" |
  | **Student rejects sanctions** | Uphold: "Rules bound all once voted. You can oppose *next* vote." Protests become debrief fodder ("Why did this feel unfair?"). |
  | **Silent group** | Provoke: "Role C, are you getting what you need? Role A, can you afford to ignore them?" |

  ---

  ### Your Load-Bearing Assumptions (and Redesign Triggers)
  1. **Assumption**: Communication increases cooperation.  
     *Redesign if*: Groups that talk still collapse due to equity conflicts (e.g., Role A ignores Role C). → *Redesign*: Add a "veto" power for Role C or shift to majority-rule.  
  2. **Assumption**: Self-governance can outperform external enforcement.  
     *Redesign if*: Self-governed groups always fail (e.g., drafting takes too long). → *Redesign*: Shorten rule-drafting time or allow majority votes.  
  3. **Critical load-bearing choice**: **Threshold uncertainty**.  
     *If wrong* (e.g., threshold too obvious), collapse feels inevitable and institutional tensions vanish. → *Fix*: Widen range to 25–55 pre-game.  

  This plan transforms abstract theory into visceral experience. The threshold mechanic ensures collapse is a system failure, not a moral one, while institutional tensions force engagement with Ostrom’s core insight: rulesets must be tailored, not imposed. Run it tightly, and they’ll leave debating not "whether" cooperation works, but "how."
