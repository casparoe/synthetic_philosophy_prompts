  Below is a complete, runnable plan for your common-pool resource (CPR) simulation, designed to fit within a 75-minute session. The plan prioritizes experiential learning, institutional tension, and avoiding premature theoretical framing.

  ### Core Design Philosophy
  - **Grip over bloodlessness**: Forces tension between efficiency, equity, and sustainability via asymmetries and threshold uncertainty.
  - **Institutional discovery**: Rules emerge from play; external vs. self-governance tradeoffs are felt, not lectured.
  - **Psychological safety**: Collapse is system-driven, not character-driven. Debrief explicitly separates intent ("wanted to conserve") from outcome.
  - **Stakes**: Tokens convert to **modest extra credit** (0.1% course credit per 10 tokens, capped at 1.5%). Non-cash avoids ethical issues but credit ensures stakes feel real. *Why not status prizes?* Economics majors respond to credit; philosophers/poli-sci students engage with fairness mechanics either way.

  ---

  ### Complete Runnable Plan

  #### **Parameters**
  | Parameter | Value | Why This Value | Load-Bearing | What Changes If Wrong |
  |-----------|-------|----------------|--------------|-----------------------|
  | Starting stock | 80 units | High enough to allow early mistakes; low enough to make threshold relevant. | Yes | Too high: delay collapse, reduce tension. Too low: early collapse, disengagement. |
  | Regeneration rate | 25% of current stock | Punishes over-extraction but allows recovery if above threshold. Steeper than linear PGG. | Yes | Too high: masks poor management. Too low: collapse inevitable. |
  | Stock ceiling | 100 units | Prevents infinite growth; creates visible "full" state. | No | Adjustable without major impact. |
  | Threshold range | 30–50 units (true threshold: 40) | Wide enough to prevent reverse-engineering (10-unit buffer), narrow enough to guide caution. Uncertainty "bites" without randomness. | Yes | Too narrow (e.g., 38–42): solvable. Too wide (e.g., 20–60): feels arbitrary. |
  | Harvest technology | Role A: 2 units/effort (2 players)<br>Role B: 1.5 units/effort (2 players)<br>Role C: 1 unit/effort (2 players) | Creates efficiency asymmetry. Role A (high yield) pressures stock; Role C (low yield) feels vulnerable. | Yes | If asymmetries are too mild, equity tensions vanish. |
  | Harvest valuation | Role A: 1 token/unit<br>Role B: 1.3 tokens/unit<br>Role C: 1.7 tokens/unit | Role C values each unit more (scarcity mindset). Equal splits create perceived windfall (A) vs. robbery (C). | Yes | If valuations are equal, equity conflict disappears. |
  | Enforcement package cost | 15 tokens/player | High enough to hurt (3–5% of total possible earnings), but cheaper than drafting a rule in time-cost. | Yes | Too low: always bought. Too high: never bought. |
  | Number of rounds | 7 | Enough to allow rule-testing (3–4 rounds post-threshold discovery) but fits timing. Round 7 often triggers "endgame" panic. | Yes | Fewer rounds: no time for institutional evolution. More rounds: exceeds 75min. |
  | Regeneration halt | Below 40 units | Threshold midpoint (50% of ceiling). Permanent "dead resource" state creates lasting consequence. | Yes | Too high: collapse too easy. Too low: hard to trigger. |
  | Phase timing | See run-sheet | Balances decision fatigue with urgency. | Yes | Off-timing causes rushed rules or boredom. |

  ---

  #### **Materials List**
  1. **Per Group**: 
     - Shared stock tracker (whiteboard/slide): "Stock: [##] | Status: Alive/Dead".
     - Harvest submission slips (paper or digital form).
  2. **Per Player**: 
     - Role card (A/B/C) with harvest efficiency and token value.
     - Private ledger to track tokens, effort, harvest.
  3. **Facilitator**: 
     - Timer, calculator, stock update spreadsheet.
     - "Enforcement package" placard (lists rules: 20% levy + public posting).
  4. **Room Setup**: 
     - Three separate group areas (enable private discussion). Clock visible to all.

  ---

  #### **Participant Instructions (Verbatim)**
  **Opening Script (5 min):**  
  *"You are a community managing a shared renewable resource (e.g., a fishery). Each round, you individually decide how much effort to exert (0–5 units). Your effort converts to harvest based on your role. The resource regenerates 25% after each round—but only if it stays above a critical threshold. This threshold is between 30 and 50 units; if stock drops below it, regeneration stops permanently.  
  Your goal: Maximize tokens. Tokens convert to extra credit (10 tokens = 0.1% course credit, max +1.5%).  
  Between rounds, your group may:  
  - **Talk freely** (no binding rules).  
  - **Draft a rule** (e.g., effort caps, sharing). Requires unanimous vote; I enforce it next round.  
  - **Buy enforcement** (cost: 15 tokens each): I impose a 20% levy on all harvests and publicly post who took what.  
  Roles:  
  - **Role A**: 1 effort → 2 harvest. 1 harvest = 1 token.  
  - **Role B**: 1 effort → 1.5 harvest. 1 harvest = 1.3 tokens.  
  - **Role C**: 1 effort → 1 harvest. 1 harvest = 1.7 tokens.  
  Start: 80 units. 7 rounds. Begin Round 1."*  

  **Key Omissions**:  
  - No "tragedy," "commons," Hardin, or Ostrom.  
  - Threshold described as a range (not point).  
  - "Regeneration ceases permanently" emphasized, but no survival tips.  

  ---

  #### **Debrief Script (10–15 min)**  
  **Order**: Experience → Tension → Concept → Counterexample.  
  1. **Experience**: *"Group 1: You collapsed in Round 4. What did it feel like to see the resource die?"* (Elicit emotional responses: frustration, helplessness).  
  2. **Tension**: *"Who wanted to conserve but couldn’t? Why?"* (Highlight: Role C’s high valuation vs. Role A’s efficiency).  
  3. **Concept**: *"This is often called the ‘tragedy of the commons’—but let’s dissect that. What actually caused collapse here?"* (Guide to: threshold + anonymity + no rules).  
  4. **Counterexample**: *"Group 3 bought enforcement early. Group 2 drafted their own rule. Compare outcomes."* (Contrast:  
     - *External rule* (enforcement package): Public shaming reduced over-extraction but levy hurt Role C ("I lost tokens for being poor!").  
     - *Self-governed rule* (e.g., "Role A effort cap + harvest sharing"): Felt fairer but took time to draft.  
  5. **Reverse Mapping**: *"The ‘tragedy’ assumes selfish actors and open access. But here, collapse wasn’t about selfishness—it was about **[fill in: threshold blindness, no communication]**... and groups with rules avoided it. Ostrom showed CPRs aren’t doomed if communities design rules."*  
  6. **Limitations**: *"Real CPRs rely on long-term relationships—you knew this ended in 75 minutes. Also, real rules evolve over decades, not rounds."*  

  ---

  #### **Run-Sheet Table**
  | Phase | Clock (min) | Participants Do | Facilitator Says/Does | Intended Experience | Likely Failure & Fix |
  |-------|-------------|-----------------|------------------------|----------------------|------------------------|
  | Setup | 0–5 | Form groups, read roles | Assign roles, distribute materials | Clarity, role immersion | Confusion on asymmetry: Show calculation example (e.g., "Role A: 2 effort = 4 harvest = 4 tokens"). |
  | Harvest (R1) | 5–8 | Secretly submit effort (0–5) | Collect slips, calculate harvest, update stock | Discovery: "My effort affects the group?" | Over/under-submission: Cap effort at 5; reject >5. |
  | Stock Update | 8–9 | Watch tracker | "Stock was 80. Group A harvested 24. New stock: 56. Regenerated to 70." | Shock of rapid depletion | Math error: Use calculator; announce slowly. |
  | Between Rounds | 9–14 | Discuss options (talk/rule/buy) | Timekeep. If rule drafted, check for unanimity. | Tension: "Do we spend time/tokens?" | Deadlock: Remind, "No action defaults to talk." |
  | Harvest (R2–R6) | 14–55 | Repeat (effort → update) | Enforce rules if voted. Levy tokens if bought. | Testing institutions | Collapse early: Emphasize they can still harvest dead stock (token stakes remain). |
  | Threshold Breach | *When* | – | If stock <40, announce: "Resource dead. No more regeneration." | Dread, consequence | Boredom: Add side task ("Plan recovery petition"). |
  | Final Round (R7) | 55–58 | Last harvest | Highlight endgame: "Final chance!" | Urgency, regret | Economist leaks threshold: "Your group’s threshold may differ." (Bluff; all same) |
  | Token Count | 58–60 | Sum tokens | Share conversion rate (10 tokens = 0.1%) | Stakes realized | Protest over sanctions: "Rules bound all once voted." |
  | Debrief | 60–75 | Discuss outcomes | Guide per script above | Connect experience to theory | Dominant voices: Assign reps per group. |

  ---

  #### **JSON Design Parameters**
  ```json
