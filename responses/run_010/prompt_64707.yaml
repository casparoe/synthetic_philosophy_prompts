        "why_this_value": "Enough time for discussion and decision, but short enough to fit 6 rounds in 75 minutes.",
        "load_bearing": true,
        "what_changes_if_wrong": "If too short, groups feel rushed; if too long, run out of time. Adjust to 4 or 6 minutes."
      }
    ]
  }

  Final Note: The entire plan is runnable as described. We'll now write the exact wording for participants.

  Wording for Participants at the Outset:

  "Welcome to the Common-Pool Resource Management Simulation. You will be divided into groups of six. Each group manages a shared renewable resource, such as a fishery. The resource starts at 100 units. In each round, you will decide how much effort to exert in harvesting the resource. 

  You have been assigned a role with specific characteristics:
  - Role A: Every unit of effort you exert yields 2 units of harvest. You value each unit of harvest at 1 token.
  - Role B: Every unit of effort you exert yields 1.5 units of harvest. You value each unit of harvest at 1.5 tokens.
  - Role C: Every unit of effort you exert yields 1 unit of harvest. You value each unit of harvest at 2 tokens.

  In each round, you will choose an effort level between 0 and 5 (whole numbers only). The total harvest by the group depends on the current stock and the total effective effort. If the total effective effort (sum of each player's effort times their efficiency) is less than or equal to the current stock, then each player gets the full harvest. If it exceeds the stock, then the harvest is shared proportionally to your effective effort.

  After each harvest, the resource may regenerate. The resource regenerates by 20% of the remaining stock (after harvest) but only if the stock after harvest is above a critical threshold. The threshold is between 35 and 45 units. If the stock after harvest falls below this threshold at any time, the resource stops regenerating permanently. The regeneration also has a maximum capacity of 120 units.

  Between rounds, your group will have 5 minutes to choose one of three options:
  1. Talk freely: Discuss the situation without making any binding decisions.
  2. Draft and ratify a rule: You can propose a rule for the next round's harvest (e.g., limits on effort, sharing rules). The rule must be agreed upon by every member of the group (unanimous). If ratified, the facilitator will enforce the rule in the next round.
  3. Buy an enforcement package: Vote (majority) to purchase an enforcement package for the next round. The package costs 10 tokens per player. If purchased, two things happen in the next round:
     a. Each player's harvest will be publicly posted to the group.
     b. A 20% levy is applied to the value of your harvest (so you only get 80% of the value).

  The simulation will run for 6 rounds. Your goal is to maximize your total tokens. Tokens will be converted to extra credit at the end: every 10 tokens you earn will add 0.1% to your final course grade, up to a maximum of 1% (so 100 tokens maximum).

  Any questions? Let's begin by forming groups and assigning roles."

  Debrief Guide:

  1. Group Reports (5 minutes): Ask each group: 
     - Did your resource collapse? When?
     - What institutional choices did you make? Did you write a rule? Buy the package? How often?
     - How did the asymmetries (roles) affect your decisions?

  2. Reveal the Mechanics (2 minutes):
     - "The threshold was exactly 40. Regeneration was 20% of the remaining stock if above 40, up to 120."

  3. Introduce Concepts (3 minutes):
     - "This simulation is about the governance of common-pool resources. The 'tragedy of the commons' (Garrett Hardin) predicts that without any rules, individuals will overuse the resource and it will collapse. But Elinor Ostrom showed that communities can design rules to avoid this."

  4. Connect to the Simulation (5 minutes):
     - "Notice: collapse was not inevitable. It depended on the rules you chose. The groups that avoided collapse likely used communication and rules."
     - "The self-written rules, if you could agree, might have been tailored to your group's needs (like the different roles) and therefore more efficient than the one-size-fits-all enforcement package."
     - "The enforcement package provided a solution, but at a cost (tokens and levy) and without addressing your specific asymmetries."

  5. Reverse Mapping (5 minutes):
     - "The popular version of the tragedy of the commons assumes open access and no rules. But in reality, many commons are governed by communities. In our simulation, the groups that governed themselves (with their own rules) might have avoided the tragedy. This is what Ostrom observed: communities can design effective rules without top-down intervention."

  6. Limitations (1 minute):
     - "However, note: in real life, these communities often have long-term relationships and can evolve rules over time. Our simulation is short, so we might have missed that."

  This completes the plan.
