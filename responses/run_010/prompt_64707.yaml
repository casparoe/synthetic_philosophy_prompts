    "parameters": [
      {
        "parameter": "starting_stock",
        "value": 80,
        "why_this_value": "Balances early exploration with threshold vulnerability.",
        "load_bearing": true,
        "what_changes_if_wrong": "Too high: delays consequences. Too low: arbitrary collapse."
      },
      {
        "parameter": "regeneration_rate",
