  ## The Silent Ledger of Teo the Boatman

  **Accession Number:** AEST-77-003  
  **Collection Title:** Colonial Port Authority Administrative Records, 1912-1948 (Post-Withdrawal Transfer)  
  **Provenance:** Transferred to the Sirena Municipal Archives from the disused Customs House basement, 1972. Originally generated by the Aestian Colonial Administration, Port Sirena District.  
  **Physical Description:** 85 standard archival boxes. Mixed media (paper, cardstock). Moderate foxing, some water damage along lower edges of Boxes 1-15 (consistent with basement flood event, 1958).  
  **Processing Archivist:** Magda Rissen  
  **Date Processed:** 17 Vendémiaire, Year 43 [October 17, 1975]  

  **Box 14: Personnel – Daily Wages, Non-Clerical (Dockyard & Harbour)**
  *   **Folder 3: Payroll Registers, Casual Labour – Boatmen, 1928-1930**
      *   Scope & Content: Weekly ledger sheets listing boatmen hired for harbour duties (ferrying officials/supplies, buoy maintenance, lighters). Columns: Date, Name, Daily Rate (Shillings/Pence), Days Worked, Total Pay, Signature/Mark, Supervisor Initials (Typically "R.B." or "P.K.").
      *   Note: See also Box 19, Folder 7 (Disciplinary Notices) and Box 22, Folder 2 (Equipment Issue/Return Logs - Boats).
      *   **Item of Interest:** Regular appearance of an individual, name variably recorded as:
          *   "Teo" (Most frequent, Weeks 1-12, 1928; Weeks 5-52, 1929)
          *   "Theo" (Weeks 13-17, 1928; Week 3, 1930)
          *   "Tio" (Week 18, 1928; Weeks 1-2, 1930)
          *   "Teo (X)" (Weeks 19-21, 1928 - "X" likely indicating mark instead of signature)
          *   Absent: Weeks 22-26, 1928; Weeks 1-4, 1929. No notation for leave or dismissal. Resumes Week 5, 1929 with mark ("X") only. Returns to "Teo" signature Week 10, 1929.
      *   Daily Rate: Consistently 1s/6d. Standard rate for "Class III" harbour boatman.
      *   Days Worked: Typically 4-6 days per week. Rarely 7. Never less than 3 when present.

  **Box 19: Personnel – Disciplinary & Incident Reports**
  *   **Folder 7: Minor Infractions – Dockyard Labour, 1925-1932**
      *   Scope & Content: Standard Form CA-7b ("Notice of Minor Infraction - Native Labour"). Fields: Date, Employee Name, Employee Number (Often blank for casuals), Occupation, Supervisor, Nature of Infraction (Pre-printed options: Tardiness, Negligence, Disobedience, Damage to Property, Absence Without Leave, Other), Details, Action Taken (Verbal Warning, Fine, Suspension Days), Signature of Supervisor, Signature/Witness of Head Clerk, Employee Acknowledgement (Signature/Mark).
      *   **Item of Interest:** CA-7b, dated 14 May, 1929.
          *   Employee Name: "Teo (Boatman)"
          *   Employee Number: [Blank]
          *   Occupation: "Boatman (Harbour)"
          *   Supervisor: "R. Brent"
          *   Nature of Infraction: "Negligence" (Checked)
          *   Details: "Failed to adequately secure lighter No. 3 after unloading. Resulted in minor scrape against pier pilings during tide change. No significant damage."
          *   Action Taken: "Verbal Warning Issued."
          *   Signatures: "R. Brent", "P. Keene (Head Clerk)"
          *   Employee Acknowledgement: "X" (Mark)

  **Box 22: Equipment & Stores – Issue/Return Logs**
  *   **Folder 2: Harbour Craft – Small Boats & Lighters, 1920-1935**
      *   Scope & Content: Logbook entries for assignment and return of harbour rowboats, skiffs, and lighters. Columns: Date Out, Boat Number, Assigned To (Name/Occupation), Purpose, Time Out, Supervising Officer, Date In, Time In, Condition In, Notes.
      *   **Item of Interest:** Frequent entries for Boat #4 (a standard 16ft harbour skiff) assigned to "Teo" or "Tio" (Boatman) for purposes: "Official Ferry," "Buoy Check," "Supply Run (Customs)," "Survey Assist." Condition consistently "Satisfactory" on return. No recorded accidents beyond minor scrape noted in CA-7b (See Box 19/F7).

  **Box 30: Administrative – Miscellaneous Registers & Lists**
  *   **Folder 5: "Register of Native Grievances & Petitions" (1927-1931)**
      *   Scope & Content: Single, largely unused ledger. Pre-printed columns: Date Received, Petitioner Name, Occupation/Residence, Nature of Grievance/Petition, Action Taken, Disposition, Remarks.
      *   **Item of Interest:** Only one entry, dated 12 June, 1929.
          *   Petitioner Name: "Teo (Boatman, Harbour)"
          *   Occupation/Residence: [Blank]
          *   Nature of Grievance/Petition: "Unfair deduction. Pay." (Handwritten)
          *   Action Taken: "Referred to Paymaster."
          *   Disposition: "See Payroll." (Initialled "P.K.")
          *   Remarks: [Blank]
      *   Note: Cross-referenced with Payroll Registers (Box 14/F3). No deduction noted in the weeks preceding or following 12 June, 1929. No separate memo found regarding this grievance.

  **Accession Memo (Internal - Sirena Municipal Archives):**
  **To:** Director's Office  
  **From:** M. Rissen, Processing Archivist  
  **Re:** Accession AEST-77-003 - Proposed Catalog Note for "Teo"  
  **Date:** 20 Vendémiaire, Year 43 [October 20, 1975]

  During processing of Boxes 14, 19, 22, and 30, a pattern emerges regarding a casual harbour boatman appearing under variant names (Teo/Theo/Tio). His record spans 1928-1930 with two significant absences: mid-late 1928 (approx. 5 weeks) and early 1929 (4 weeks). The absences coincide with known labour unrest among dockworkers in Port Sirena. A single minor infraction (May 1929 – negligence while securing a boat) and a single, unresolved grievance regarding pay (June 1929) exist. His work involved essential harbour tasks. He consistently signed with an "X" except for periods in 1928/29 where "Teo" or "Theo" appears.

  **Proposal:** Add a Scope & Content note at the Series level (Personnel – Daily Wages) and potentially an Index entry:
  *   "Teo (also Theo, Tio): Casual harbour boatman, active 1928-1930. Absences in 1928/1929 may relate to dock strikes. Filed a single, unresolved pay grievance (June 1929). Subject of one minor disciplinary notice (May 1929). Represented solely through administrative forms documenting labour transactions."

  **Rationale:** The existing records render Teo functionally invisible beyond instances of paid labour or administrative friction. The silence is structural. This note would provide crucial context for researchers, indicating a lived reality beyond the ledger lines – the strikes, the likely illiteracy (signature vs. mark), the futile grievance. It makes the silence *visible* as a product of the system.

  **Concern:** The note infers context (strikes, illiteracy) not explicitly stated in *these* records. Once added, it becomes "fact" in the finding aid. Is this an ethical intervention or an imposition of my interpretation? Is it replicating the archival authority that silenced him originally, just with a different narrative?

  ---

  **Researcher Access Request Form:**
  **Researcher:** Dr. Aris Thorne, University of New Aestia (History Dept.)  
  **Project Title:** Labour Organisation & Resistance in Colonial Port Sirena, 1920-1940  
  **Requested Material:** Accession AEST-77-003, specifically:
  *   Box 14, Folder 3 (Payroll Registers - Boatmen 1928-1930)
  *   Box 19, Folder 7 (Minor Infractions - Dock Labour 1925-1932)
  *   Box 30, Folder 5 ("Register of Native Grievances")
  *   Any correspondence or internal memos related to dockworker strikes/unrest in 1928 & 1929.
  **Date Requested:** 15 Brumaire, Year 44 [November 15, 1976]

  **Access Decision & Response Letter:**
  **To:** Dr. Aris Thorne  
  **From:** Sirena Municipal Archives, Director's Office (per M. Rissen)  
  **Re:** Access Request - AEST-77-003  
  **Date:** 22 Brumaire, Year 44 [November 22, 1976]

  Dear Dr. Thorne,

  Your request for materials from Accession AEST-77-003 (Colonial Port Authority) has been processed.

  Access is granted to:
  *   Box 14, Folder 3 (Payroll Registers - Boatmen 1928-1930)
  *   Box 19, Folder 7 (Minor Infractions - Dock Labour 1925-1932)
  *   Box 22, Folder 2 (Harbour Craft Logs 1920-1935 - relevant entries flagged)
  *   Box 30, Folder 5 (Register of Native Grievances 1927-1931)

  **Please note:** The finding aid entry for Box 14, Folder 3 includes a contextual note regarding a boatman named Teo (variant spellings), his absences potentially coinciding with labour unrest, and his single grievance. This note is provided as interpretative context only; the primary sources themselves contain no explicit mention of strikes or broader labour organisation.

  **Regrettably, access is denied** to any internal correspondence or memos related to the 1928/1929 dockworker unrest. Searches conducted during processing and again upon your request located no such material within AEST-77-003. The Colonial Administration shipped or destroyed most sensitive internal communications prior to withdrawal. The only surviving references to unrest are inferential patterns within transactional records like payroll and the largely unused grievance register.

  We wish you success with your research.

  Sincerely,
  Magda Rissen (Senior Archivist)
  For the Director

  ---

  **Internal Processing Note (File Copy):**
  **Re:** Box 19, Folder 7 - Disciplinary Notices  
  **Date:** 25 Brumaire, Year 44 [November 25, 1976]  
  **Note by M. Rissen:** While retrieving the CA-7b for "Teo" (14 May 1929) for Dr. Thorne, noted slight water damage along lower edge not previously documented. Ink slightly blurred but still legible. Placed in new acid-free sleeve. Returned to folder. *Also noted:* The "Employee Acknowledgement" field. Just the "X". Always just the "X", except when he wrote "Teo" or "Theo" for those few months. Why then? Learning? Someone helping? Defiance? A borrowed pen that worked? No way to know. Just another gap the form won't bridge. The catalog note feels thin now. Like sticking a label on a ghost. But Thorne saw it. He’ll use it. It’s part of the record now.

  ---

  **Final Finding Aid Entry (Excerpt - Sirena Municipal Archives Online Catalogue):**
  **Series:** Personnel Records - Daily Wages (Non-Clerical)
  *   **Sub-Series:** Dockyard & Harbour Labour (1920-1940)
      *   Box 14, Folders 1-5: Payroll Registers (Casual Labour - Stevedores, Boatmen, Cleaners)
          *   Folder 3: Boatmen, 1928-1930
              *   Scope & Content: Weekly ledger sheets... [Standard description]...
              *   **Note:** Includes frequent entries for an individual recorded as Teo (also Theo, Tio), a casual harbour boatman. Entries show periods of absence in late 1928 and early 1929. A single unresolved pay grievance filed by Teo is recorded in the "Register of Native Grievances" (Box 30, Folder 5, June 1929). One minor disciplinary notice exists (Box 19, Folder 7, May 1929). The record reflects labour transactions only.
      *   **Index Term:** Teo (Boatman, Port Sirena Harbour, c.1928-1930) - See Payroll Registers (Box 14/F3), Minor Infractions (Box 19/F7), Native Grievances Register (Box 30/F5)

  ---

  **Misfiled Document Report:**
  **Date:** 5 Germinal, Year 45 [March 25, 1977]  
  **Reporting Archivist:** Elena Vorst (Junior Archivist)  
  **Collection:** AEST-77-003  
  **Description of Item:** Single sheet, pre-printed Form CA-12 ("Application for Leave - Native Labour"). Fields: Name, Occupation, Employee No., Dates Requested, Reason, Supervisor Approval, Medical Officer Approval (if sick), Remarks.
  **Details:** Found misfiled in Box 37, Folder 8 (Customs Duty Waivers, 1931). Form is blank except for:
  *   Name: "Teo" (Written)
  *   Occupation: "Boatman" (Written)
  *   Dates Requested: [Blank]
  *   Reason: [Blank]
  *   **Signatures/Approvals:** None. Only the name and occupation filled in.
  **Action Taken:** Unable to determine original placement. Form CA-12 not part of standard Personnel series in this accession. No matching forms found. Placed in "Unprocessed Fragments & Ephemera" box for AEST-77-003 (Box 85). Added brief note to master finding aid under "Teo": "See also Box 85 (Unprocessed Fragments) for misfiled leave application (blank)."

  ---

  **Craft Note: The Unrecoverable Silence**

  This story lands firmly on the side that **any account assembled from the paperwork inherently re-inscribes the colonial categories.** Teo is only visible *as* a "Boatman (Harbour)", *as* a recipient of 1s/6d per day, *as* the subject of a "Negligence" infraction. Magda’s note, however well-intentioned, performs the same function: it categorizes him ("casual harbour boatman"), frames his absences ("may relate to dock strikes"), and interprets his mark ("illiteracy"). These inferences, while plausible, are projections *onto* the framework the administration created. They fill the silence with *meaning*, but meaning derived solely from the context of the forms themselves and the archivist's external knowledge of strikes.

  The forms dictate the terms of existence within the archive. The "Register of Native Grievances" defines the *only* permissible avenue for complaint, rendering Teo's attempt to address a pay issue just another administrative blip ("Unfair deduction. Pay." – "Referred to Paymaster" – "See Payroll"). His life outside the docks – relationships, beliefs, desires, the reason for the blank leave application – remains utterly inaccessible *because the system had no form to capture it*, and thus no space for it in the record. Magda’s corrective note doesn’t recover Teo; it recasts the administrative silhouette in slightly more humanistic terms, but the silhouette remains, defined by the original power structure.

  **Liberties Taken:**
  1.  **The Single Grievance:** A real "Native Grievances" register might be fuller or completely empty. One entry is dramatically potent but potentially over-romanticizes the potential for resistance within the system. It makes Teo *slightly* more active than the payroll entries alone.
  2.  **Magda's Internal Monologue:** Real archivists might not dwell so poetically on an "X". The story gives Magda an internal conflict that makes the philosophical dilemma more immediate and human than pure professional detachment might allow.
  3.  **The Misfiled Leave Form:** This is pure fiction for poignant effect. Its blankness highlights the *absence* of personal context, but its very existence as a form Teo *might* have touched is a liberty. In reality, such a fragment might never surface or be dismissed as irrelevant scrap.
  4.  **The Catalog Note's Survival:** Magda hesitates but ultimately adds the note. A stricter adherence might have shown her rejecting the note entirely, but the story requires her to *act* decisively to demonstrate the dilemma. Having her add it, then subtly question it later ("feels thin now"), shows the compromise and lingering doubt inherent in the role.

  The story leans on fiction to make the philosophical argument tangible – the forms, the gaps, the archivist's struggle – but its core message is that the administrative frame is ultimately inescapable within its own documentary universe. Teo remains a transaction, annotated.
