  The required verdicts are precise: welfarist sees no inequality, resourcist sees no envy, capability theorist sees remediable inequality. Constraints include no standard mechanisms, contemporary setting, neutral language, and avoiding question-begging descriptions. They also want thorough analysis showing how each theory reaches its conclusion, defenses against counterarguments, and examination of welfarist variations and Sen's capability concept versus republican freedom.

