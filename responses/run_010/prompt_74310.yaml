prompt: |-
  I'm a second-year PhD student in a cognitive science department — not philosophy; I've never taken a decision theory course — and my lab is designing an online coordination game in which a large anonymous audience is told that a prize will be paid only if a very small number of people enter. Hunting for precedents, I read Douglas Hofstadter's superrationality columns from his early-1980s *Scientific American* run, collected in *Metamagical Themas*, and I've gotten stuck on something that isn't the mathematics. He first poses the Platonia dilemma as a thought experiment: twenty people isolated from one another, each permitted to send a single telegram, a billion dollars for the sender if exactly one telegram arrives and nothing for anybody if none arrives or more than one does. Since each reasons in the same way and knows the others do, either everyone sends or no one sends, and both are ruinous; so the superrational move is to randomize, sending with probability one in twenty, which leaves each of the twenty roughly a two percent shot at the billion. Then he doesn't stop at the thought experiment. He announces an actual Luring Lottery — a real posted offer in which replying is individually attractive but the value of replying shrinks as more people reply — and reports back on who replied and what they wrote in explanation. I'm working from memory of the columns and may have details wrong (I believe only a handful replied, nine if I recall the follow-up correctly), so please analyze the structure as I've described it rather than trying to reconstruct the history.

  What I want is an account of what that practice presupposes: the practice of mailing a normative decision theory to real people and treating their replies as evidence about the theory. Four things bother me and I don't have names for any of them, so please supply the vocabulary as you go. First, the Platonia argument appears to require a closed group of exactly twenty, each of whom knows that the others are superrational, yet the lottery went out to an audience of who knows how many, and I cannot tell whether the operative group was the people he wrote to or the entire readership. What has to be true about the relation between a stipulated thought experiment and a performed experiment for that to be legitimate rather than a confusion of two different things? Second, the argument starts from "we will all arrive at the same answer" and ends by instructing each person to flip a coin, so the sameness has become sameness of rule rather than of outcome — what is the sameness premise actually carrying at that point, and what does the practice assume about when two people's decisions count as one decision rather than two? Third, he wrote to people he had already identified as superrational thinkers, which seems to make the result unloseable, since anyone who replies can simply be reclassified as not one of them; what conception of testing a normative theory does that require, and how does it compare with the way we treat a moral theory whose adherents fail to live up to it? Fourth, the whole intervention is prose in an envelope, which appears to assume that correctly describing a decision problem to someone is sufficient to install the reasoning the problem licenses.

  So: reconstruct the implicit theory as carefully as you can, and keep three things separate throughout — what the practice strictly cannot do without, what it merely sits comfortably with, and where it is underdetermined, so that several incompatible accounts of rational agency would license exactly the same mailed lottery. Tell me which rival conceptions of what rationality is (a standard of correctness, a psychological disposition, a property of the situation rather than of the person, a criterion for evaluating institutions) the design quietly rules out, and whether its parts are pulling in the same direction or against each other. Then tell me what would have to change — in what gets sent, to whom, in what a reply counts as, and in what would count as a failed result — if the presupposed view were replaced by the most serious rival you identify. My own game will have an audience of several thousand strangers who do not know one another and will never learn how many entered, and I want to know whether I would be borrowing an argument that only works in a room of twenty.
reasoning: |-
  Okay, let's start by unpacking the user's query. They're a second-year PhD student in cognitive science, designing an online coordination game where a prize is paid only if a very small number of people enter. They've been reading Hofstadter's work on superrationality, specifically the Platonia dilemma and the Luring Lottery experiment. They have four main concerns about the presuppositions in Hofstadter's approach and how it applies to their own game.

  First, I need to address each of their four points. The user is bothered by the mismatch between the thought experiment's closed group of twenty and the open audience in the actual lottery. They're questioning the validity of applying a theoretical model to a real-world scenario with undefined group size. I should explain the assumptions Hofstadter might have made, like the "implied reference group," and how it relates to common knowledge. The user probably wants to understand how to define the participant group in their own experiment without a closed setting.

  Second, the shift from identical outcomes to identical randomization strategies. The user is confused about what "sameness" means when each person uses a coin flip. Here, I need to clarify that superrationality requires symmetry in decision rules, not actions. This ties into equilibrium concepts in game theory, like symmetric mixed-strategy Nash equilibrium. The user might be trying to grasp how individuals can coordinate on a strategy without communicating, which is crucial for their game design.

  Third, the selection bias in Hofstadter's experiment. By contacting people he deemed superrational, any outcome could be interpreted as confirmation. The user is concerned about circularity and how normative theories are tested. I should compare this to moral philosophy, where theories are tested against intuitions or consistency, not empirical failure. The user needs to know how to avoid such biases in their own study, perhaps by random sampling or pre-screening for certain traits.

  Fourth, the assumption that describing the problem installs the reasoning. The user questions whether textual instructions suffice for participants to engage in superrational thinking. This involves cognitive limitations and the gap between normative models and human psychology. The user's game involves thousands of strangers who won't get feedback, so they need to consider how instructions and framing affect behavior. They might be worried about participants not grasping the equilibrium concept.

  The user's deeper needs likely involve validating their game design. They want to know if Hofstadter's approach is transferable to their context—large, anonymous, no feedback. They might be seeking theoretical grounding for expecting participants to randomize entry. Also, they may need to identify which assumptions are necessary versus adjustable in their setup. Practical advice on structuring their experiment to avoid Hofstadter's pitfalls is probably crucial, like defining the reference group clearly or using incentives to encourage strategic thinking.

  I should also analyze rival conceptions of rationality that Hofstadter's method rules out, such as causal decision theory or bounded rationality. The user needs to know which theories align with their game and what modifications are necessary. For instance, if they adopt a psychological view, they'd need pre-tests to measure rationality traits. If they see rationality as institutional, their design should ensure transparency to facilitate coordination.

  Finally, the user asks what changes if a rival theory is used. For example, under bounded rationality, they'd need simpler heuristics or learning mechanisms. In their large-scale game, they might implement iterative rounds or provide aggregated feedback to help participants converge to equilibrium. Highlighting these adjustments will help them design a robust experiment without relying on superrationality's strict assumptions.
answer: |-
  Here's a breakdown of the presuppositions, tensions, and alternatives in Hofstadter's Luring Lottery practice, structured around your concerns and designed to inform your own game:

  **The Core Presupposed Theory: Symmetric Rationality as a Shared Cognitive Frame**

  Hofstadter's practice presupposes a specific, strong conception of rationality:
  1.  **Universality & Symmetry:** All agents are *fundamentally identical* in their capacity for and execution of rational thought when presented with the *same information*. They don't just *have* reason; they *use it identically* given identical input.
  2.  **Reflexive Common Knowledge:** Agents not only understand the problem structure but also understand that *all other relevant agents* understand it identically, and that *all understand that all understand*, and so on, ad infinitum. This creates a single, shared "frame" for reasoning.
  3.  **Outcome Equivalence:** Within this shared frame, all agents necessarily arrive at the *same conclusion* about the *correct action* (or distribution of actions).
  4.  **Prescriptive Power of Description:** Merely accurately describing the problem structure *and* the symmetric rationality premise *to* the agents *is sufficient* to induce them to *adopt* the symmetric rationality frame and reason within it. The descriptive text performs the normative work of installing the reasoning mode.
  5.  **Normative-Predictive Identity:** The *normatively* correct solution (what perfectly symmetric rational agents *should* do) is also the *predictive* solution (what they *will* do). Testing the norm *is* testing a prediction about behavior under the described conditions.

  **Addressing Your Four Concerns:**

  1.  **The Closed Group Problem:**
      *   **Presupposition:** The practice requires an **"Implied Reference Group" (IRG)**. The IRG is the set of agents who (a) receive the description, (b) believe themselves to be part of the relevant group for the coordination problem, and (c) *believe that all others in the IRG* have also received the description and share the symmetric rationality frame. Hofstadter assumed the recipients of his mailing *became* the IRG by virtue of receiving the problem and the superrationality argument. The "closed group of twenty" is conceptually mapped onto the IRG formed by the mailing recipients.
      *   **Legitimacy vs. Confusion:** The legitimacy hinges on the *successful creation of the IRG* among the recipients. If recipients believe they are part of a small, defined group (the other mailing recipients) who all read the same argument and are trying to be superrational, the thought experiment group and the experimental group converge. If recipients assume the group is the entire readership or an undefined mass, the symmetry and common knowledge collapse, making the experiment invalid *for testing superrationality*. Hofstadter likely relied on the personal nature of the mailing and the exclusivity implied by being selected to create this belief.
      *   **Strict Requirement:** A clearly defined IRG with common knowledge of membership and the problem/rationality frame *within* the IRG.
      *   **Comfortable With:** The IRG being larger than 20, *provided* the common knowledge holds.
      *   **Underdetermined:** *How* the IRG belief is installed and maintained. Hofstadter's mailing *attempted* it via personal address and exclusivity.

  2.  **Sameness of Rule vs. Outcome:**
      *   **Presupposition:** The "sameness premise" carries **Symmetry of Strategy**. Superrationality doesn't demand identical *actions* (which would guarantee failure), but identical *reasoning processes* leading to identical *strategic prescriptions* (the mixed strategy: randomize with p=1/N). The shared frame dictates the *rule* (the probability), not the *outcome* of the coin flip. Each agent implements the *same function* (input: problem description, symmetry premise; output: p=1/N). The "oneness" of the decision lies in the shared derivation of the *strategy*, not the action.
      *   **Strict Requirement:** Agents must interpret the symmetry premise as demanding symmetry of *decision rule/strategy*, not action.
      *   **Comfortable With:** Agents understanding that randomization is the inevitable consequence of symmetry under uncertainty.
      *   **Underdetermined:** Why symmetry necessarily *only* implies mixed strategies and rules out other symmetric but deterministic (and failing) strategies. This relies on the dominance of the mixed strategy Nash equilibrium concept within the frame.

  3.  **Selection Bias & Testing Normative Theory:**
      *   **Presupposition:** A **Prescriptive Infallibility** view of the normative theory. Superrationality isn't a *disposition* some people have; it's the *correct logical conclusion* given the premises. Therefore:
          *   Testing it involves finding agents capable of *recognizing* this logical necessity.
          *   Agents who fail to reply correctly (or at all) *demonstrate* they weren't truly operating within the superrational frame *despite receiving the description* – they misunderstood, weren't motivated, or were irrational.
          *   The test is whether *sufficiently capable agents*, when presented with the argument, *do* converge on the prescribed behavior.
      *   **Conception of Testing:** It's testing the **feasibility of achieving the frame** and the **predictive power *within* the frame**. It's *not* testing whether people *in general* are superrational. It assumes a "rational core" exists that, if properly accessed, will behave as predicted.
      *   **Comparison to Moral Theory:** Unlike moral theories where failure to act is a moral failing *of the agent* (weakness of will, etc.), here, failure to act superrationally is seen as a failure *to enter the logical frame* or a defect in reasoning capacity. The theory itself remains pristine; the agent is flawed relative to the theory's requirements. The lottery presupposes the theory defines perfect rationality; deviations are due to imperfect agents, not an imperfect theory.
      *   **Strict Requirement:** The normative theory defines the *only correct* rational response. Deviations are errors, not counter-evidence to the norm.
      *   **Comfortable With:** Pre-selecting agents believed capable of accessing the frame.
      *   **Underdetermined:** How to definitively *know* an agent failed due to incapacity vs. the theory being wrong/inapplicable.

  4.  **Prose as Installation:**
      *   **Presupposition:** **Descriptive Sufficiency & Cognitive Transparency.** The practice assumes that a clear, accurate textual description of the problem structure *and* the superrationality argument is sufficient for a capable agent to:
          1.  Perfectly understand the incentives and constraints.
          2.  Understand and accept the symmetry/common knowledge premise.
          3.  Successfully perform the required logical deduction within that frame.
          4.  Faithfully implement the deduced strategy (randomization).
      *   **Strict Requirement:** That rationality is primarily a *logico-deductive* process triggered by propositional descriptions. No "framing effects," cognitive biases, motivational hurdles, or practical implementation difficulties interfere *for the capable agent*.
      *   **Comfortable With:** Agents needing the argument explicitly laid out (as Hofstadter did).
      *   **Underdetermined:** The psychological mechanisms of comprehension, belief updating, and strategy implementation. It assumes perfect translation from text to mental model to action.

  **Rival Conceptions Ruled Out or Challenged:**

  Hofstadter's design quietly rules out or is deeply incompatible with:
  1.  **Causal Decision Theory (CDT):** CDT focuses on the causal efficacy of one's *own* action. A CDT agent in Platonia thinks: "My sending *causes* a higher chance of over-subscription. Whether *I* send is independent of others' identical reasoning." CDT typically prescribes *not* sending (free-riding on others' restraint) or deterministic sending based on private signals, conflicting with the mixed strategy. The design assumes EDT (Evidential Decision Theory – where one's action is *evidence* about what other identical agents do) is the correct norm.
  2.  **Bounded Rationality:** Assumes significant cognitive limitations, heuristics, biases, and imperfect information processing. Hofstadter's design assumes these are irrelevant *for capable agents* presented with the argument. Prose alone is assumed sufficient to overcome bounds.
  3.  **Rationality as Situational/Institutional:** Views rationality as emerging from the institutional structure, learning, feedback, or evolutionary pressures, not pure deduction from first principles. Hofstadter's one-shot, no-feedback, prose-installed frame rules out learning or adaptation. It assumes the deduction happens *within the individual mind* based solely on the description.
  4.  **Rationality as Dispositional/Behavioral:** Sees rationality as a measurable psychological trait influencing behavior across contexts. Hofstadter presupposes rationality is an abstract logical capacity that can be fully engaged by the right textual prompt in this specific context, not a general disposition.
  5.  **Deep Skepticism of Common Knowledge:** Challenges whether infinite recursion of mutual knowledge is psychologically possible or necessary. Hofstadter's solution *requires* it for the mixed strategy deduction.

  **Tensions Within the Design:**

  *   **IRG vs. Open Audience:** The need for a small, defined IRG (for common knowledge) clashes with the practical reality of mailing to a list/readership.
  *   **Selection vs. Generality:** Pre-selecting "superrational thinkers" undermines claims about general human rationality but is necessary for the "feasibility of the frame" test.
  *   **Prescription vs. Prediction:** Blurs the line. Is it testing what people *should* do or what they *will* do? Failure is attributed to agent failure, protecting the norm.
  *   **Logic vs. Psychology:** Assumes logical deduction flawlessly translates into psychological belief and action, ignoring cognitive science insights.

  **Adapting for Your Game (Large, Anonymous, No Feedback):**

  Hofstadter's *strict superrationality argument requires the closed, known group with common knowledge*. It fundamentally breaks in your setting:

  1.  **Indefinite Group Size (N):** Players don't know N, making the p=1/N strategy undefined. Hofstadter's lottery implicitly defined N as the IRG.
  2.  **Lack of Common Knowledge:** Players don't know who else is playing, don't know if others received identical instructions, and critically, *cannot assume others are reasoning identically* or even rationally. The symmetry premise collapses.
  3.  **No Feedback:** Prevents learning or convergence over time.

  **What Would Change Under a Rival Conception (e.g., Bounded Rationality + Learning):**

  The most serious rival for your context is **Bounded Rationality combined with Equilibrium Concepts via Learning or Focal Points**, rejecting the "prose installs logic" premise.

  *   **What Gets Sent:** Instructions would focus **only on the concrete incentives** ("If exactly K people enter, they win $X. Otherwise, no prize"). Avoid philosophical arguments about symmetry. Clarity and simplicity are paramount. *Possibly* include examples or analogies, but not complex deductions.
  *   **To Whom:** A large, diverse sample is *essential*. Pre-selection for "rationality" is undesirable unless you're explicitly studying individual differences. Representativeness matters.
  *   **What a Reply Counts As:** An entry is a behavioral choice given the incentives and the subject's beliefs/strategies/heuristics. It's *data* about how humans actually solve coordination problems under uncertainty and anonymity, not evidence of accessing a normative frame. Success/failure rates are key metrics.
  *   **What Counts as Failure:** Low overall success rates (many over- or under-subscriptions), high variance in entry rates across trials/groups, systematic deviations from predicted equilibria (e.g., consistently too many entries if entry is costless).
  *   **Design Changes for Your Game (Bounded Rationality View):**
      *   **Define the Group?** Explicitly state the *potential* participant pool size (e.g., "You are one of several thousand players"). This defines the *maximum* N, though players know actual participation is uncertain.
      *   **Induce Common Belief?** Difficult. Use clear, prominent language emphasizing anonymity and the lack of communication: "You cannot know who else is playing or what they will decide." Frame it as a pure coordination challenge.
      *   **Facilitate Learning (Crucial!):** **This is the biggest shift.** Run **multiple rounds** (e.g., 10-20). After *each* round, provide **aggregate feedback**: "Last round, X people entered. The target was K." This allows players to learn, adjust strategies (e.g., enter less if X>K last round, more if X<K), and potentially converge towards an equilibrium. This simulates an evolutionary or learning process towards a Nash equilibrium (e.g., mixed strategy or threshold strategies) without requiring superrational deduction upfront.
      *   **Explore Focal Points:** Could a specific number K (e.g., 1, 10, 100) or a simple heuristic ("enter with 1% probability") emerge as a focal point? Design instructions subtly or test different K values.
      *   **Vary Parameters:** Test different prize values, costs of entry (if any), group size information, and target K values to see how behavior adapts.
      *   **Measure Beliefs:** (Optional) Post-game surveys asking players to estimate N, estimate others' entry probabilities, or explain their strategy.

  **Conclusion:**

  Hofstadter's Luring Lottery practice presupposes a highly specific, logic-centric, symmetry-demanding, and "frame-installing" view of rationality. Its core elements (closed IRG, common knowledge, symmetry of strategy, descriptive sufficiency, prescriptive infallibility) are tightly interwoven and fundamentally unsuited for a large-scale, anonymous, one-shot game like yours. Attempting to directly transplant the superrationality argument would borrow a tool designed for a room of twenty and expect it to work in a stadium.

  For your context, abandon the idea that prose can "install" superrational reasoning. Instead, embrace a bounded rationality perspective. Focus on designing clear incentives, providing aggregate feedback over multiple rounds to enable learning, and treating participants' behavior as data on how coordination *actually emerges* under constraints. Your game becomes an experiment in distributed coordination dynamics, not a test of a specific normative logic. The key shift is from *deducing the equilibrium* to *learning to reach it*.
