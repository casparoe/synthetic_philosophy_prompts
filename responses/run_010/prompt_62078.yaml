     Then S2: 0 to min(6,8)=6. 
     Then we can define the desert verdict as 10 - (S2 * 10/6) ? That's messy.

  Alternatively, we have the partner's feeling at 8? Then S2: 0 to 8. Then desert verdict = 10 - S2? But then it's perfectly inversely related. Then the average desert verdict = 10 - average(S2). Then we show: the group's desert verdict is 10 - avg(S2). And we compare to avg(S1). They will see that the desert verdict is determined by S2.

  But we also want to score the agent? We can score the agent based on S1 (as in round 1) and also show the desert verdict separately. Then in the debrief, we point out that the desert verdict is based on S2.

  We'll do:
     Agent scoring: same as round 1, but now the spectators do two things: 
        Step 1: Spectators write S1 (for the agent's anger) and S2 (for the partner's regret).
        Step 2: They also write V (desert: how much the agent's anger is deserved, 0-10) for their own use? Or we can skip V and just use S2 to define the desert verdict.

  But the query says: "the group's verdict about desert tracks the second sympathy". So we can define the group's desert verdict as the average of S2? But that's not: high S2 means they think the partner's regret is appropriate, so the agent's anger is not deserved. So the desert verdict should be low when S2 is high. So we can define:

     Group's desert verdict = 10 - (average(S2) * 10/8)   [if S2 is 0-8]

  But then it's mechanical.

  Alternatively, we have the spectators write a binary: "Do you approve of the agent's anger? (based on whether it is deserved)" -> but that's not sympathy.

  I think we should have the spectators write both S1 and S2, and then also write V (desert) on a scale. Then we will show that V is highly correlated with (10 - S2). We can calculate the correlation coefficient? But that's too much for a game. We can show the average V and the average (10 - S2) and see they are close? And also show the average S1.

  Example: 
     Suppose the incident is set up so that the partner has a good excuse. Then we expect:
        S1 might be high (the agent's anger is easy to sympathize with) but S2 is also high (the partner's regret is easy to sympathize with) and then V is low.

  But if we have the numbers, we can show: avg(S1)=7, avg(S2)=6, then avg(V)=4 (which is 10-6=4). Then they see that V is about 10 - avg(S2). And we note that S1 is high but the desert verdict is low.

  We'll do that. So in the scoring, we show:
     - Average S1 (say 7) -> approval of the agent's display (which is based on S1) but note: the agent is scored based on S1 as in round 1.
     - Average S2 (say 6)
     - Average V (desert verdict) (say 4)

  Then we point out: even though you could sympathize with the agent's anger (S1=7), you thought the anger was not deserved (V=4) because you sympathized with the partner (S2=6).

  **Round 3: Hidden-norm (d)**
  - Spectators receive role cards that are hidden. Two groups:
     Group A: "You believe that conspicuous grief is self-indulgent. When you see someone display grief, you can only sympathize up to a level 2 less than what they display, but not below 0." -> So if they display D, you set S = max(0, D-2) [if D-2 <= 8, but the cap is still there: S cannot exceed 8]. But the norm is about how much they can sympathize? Or it's a deduction in approval?

  Alternatively, the role card modifies the abatement rule for this round only? 

  We can have:
     Group A: "You believe that displaying grief above 3 is self-indulgent. When the displayed grief D is above 3, you set your S = min(3, D) [or something]." But that's messy.

  Better: 
     Group A: "You believe that displaying grief above 3 is self-indulgent. You cannot sympathize with any grief displayed above 3. So you set S=0 for any D>3. For D<=3, you set S as usual (capped at min(D,8))."
     Group B: "You believe that displaying grief below 3 is callous. You cannot sympathize with any grief displayed below 3. So you set S=0 for any D<3. For D>=3, you set S as usual."

  But then if the agent displays D=2, Group A might set S=2 (if they can) but Group B sets 0. If D=4, Group A sets 0, Group B sets 4 (if they can).

  - The incident is about grief: "Your pet dog died. You feel grief at intensity F. You display grief at intensity D."

  - The agent sets F and D.

  - Spectators are divided into two groups by seating: left side Group A, right side Group B. They don't know about the groups.

  - They write S as before, but now their role card modifies how they set S.

  - We collect the S from all spectators. Then we aggregate by group: average S for Group A and average S for Group B.

  - We show the two averages. Then reveal the role cards.

  - The agent is scored as in round 1, but now the approval is per group? No, we want to show the overall verdict is a mix. So we calculate the agent's payoff as the average of the per-spectator payoff? But then the agent sees the difference between groups.

  **Round 4: Proximity (e)**
  - Two subgroups (by seating). Each subgroup has an agent and several spectators.
  - Each subgroup receives an incident about the same event but with different vividness. 
     Subgroup 1 (close): "You are at the scene: a car accident. The driver is trapped and screaming in pain. The driver's displayed pain intensity is 9."
     Subgroup 2 (distant): "You read a news report: a car accident occurred yesterday. The driver was trapped and in pain. The report says the driver's pain was intensity 9."

  - The spectators in each subgroup have a fixed budget of 10 tokens. They must allocate tokens to express the intensity they can sympathize with. But note: they are sympathizing with the driver? The driver is not an agent in the room. So we need to adjust.

  We can have the agent in each subgroup role-play the driver? But then they set F and D? But the incident says the driver's displayed pain is 9. So we can fix D=9 for both. Then the spectators allocate tokens to indicate S (the pain they can sympathize with). The tokens are scarce: they have 10 tokens to allocate to this incident and maybe other incidents? But we have only one incident.

  We can have them allocate tokens to S, where S can be from 0 to 10, and the number of tokens they use is S (so they are spending their budget). Then we compare the average S between the two subgroups.

  We expect the close subgroup to allocate more tokens (higher S) than the distant subgroup.

  **Private Ledger**: In every round, after the agent sets F and D, but before any verdict, they write in the ledger: what intensity would an all-knowing spectator approve of? (A_impartial, 0-10). After the round, they see the actual average S from the spectators. The gap is |A_impartial - average S|.

  **Device for simultaneous and sealed reports**: 
  - For spectators: they write their S (and in round 2, S1, S2, V) on a slip and put it in a box. The TA collects and computes.
  - For agents: they write F, D on a slip and give to TA, and also write in their ledger (which is private).

  **Scoring Rule (for TA)**:

  General for rounds 1,2,3,4 (but 2 has extras):
  - For each agent and each spectator:
     - The TA knows F and D (from agent's slip).
     - For each spectator j, the TA knows Sj (and in round 2, also S2j and Vj).
     - For round 1,3,4: 
          Approval for j: 1 if Sj >= Dj, else 0.
          Payoff from j: (10 * approval) - 2 * |F - D|   [this is the same for all j, so total per agent: sum over j of [10*I(Sj>=D) - 2*|F-D|] ]
          But note: the penalty |F-D| is subtracted once per spectator? That would be multiplied by the number of spectators. That might be too harsh. We want the penalty to be applied once, not per spectator.

  We should apply the gap penalty once per agent, not per spectator. So:
     Agent payoff = [number of approvals * 10] - 2 * |F - D| 

  But then the penalty is small compared to the approvals? For 10 spectators, max 100 - penalty.

  Alternatively, we can have the penalty be per spectator? But that would be: agent payoff = sum_j [10*I(Sj>=D) - (2 * |F-D|) / N_spectators] ? So the gap cost is shared? But that's complicated.

  We'll do: 
     Agent payoff = (number of approvals) * 10 - 2 * |F - D|

  For scaling: with 10 spectators, max 100 - 2*|gap|.

  In round 2, the agent's payoff is the same as above, but using S1j for approval.

  Additionally, in round 2, we calculate:
     - Average S1j
     - Average S2j
     - Average Vj

  In round 3, we also calculate average Sj for Group A and average Sj for Group B.

  In round 4, we calculate the average tokens allocated (which is S) for each subgroup.

  **Debrief Questions** (after all rounds, 20 minutes):

  1. (After Round 1) In the first round, when you were an agent, how did you decide what intensity to display? What did you expect the spectators to be able to sympathize with? [This ties to the concord bid and the gap penalty.]

  2. (After Round 1) When you were a spectator, what factors influenced how much you could sympathize with the agent? [Abatement rule?]

  3. (After Round 2) In the second round, you were asked to sympathize with both the agent and the partner. How did that feel? Did you notice a conflict? And when you judged whether the agent's anger was deserved, which sympathy did you find more influential? [Double-sympathy]

  4. (After Round 3) In the third round, when we revealed the role cards, what surprised you about the group averages? What does this tell us about how moral judgments are formed in a group? [Hidden-norm]

  5. (After Round 4) In the proximity round, how did the vividness of the incident affect your allocation of tokens? What does that say about the role of imagination in sympathy? [Proximity]

  6. (Ledger) Throughout the game, you wrote down what an all-knowing spectator would approve. How did that compare to the actual group's verdict? What might account for the gap? [This leads to the impartial spectator]

  7. Finally, we haven't used the phrase "impartial spectator" until now. Based on your experience, what do you think it might mean in Smith's theory? How does it relate to the all-knowing spectator in your ledger?

  **Mapping Table**:

  Rule (by label) | Claim in Smith | Where the analogy fails
  ---------------|---------------|----------------------
  (a) Concord bid | Smith: We often understate our feelings to achieve concord with others (TMS I.i.4.7). The gap cost represents the internal cost of not being truthful. | In the game, the gap cost is arbitrary and known; in Smith, the cost is the natural pain of not being understood fully.
  (b) Abatement rule | Smith: The spectator's sympathy is always less vivid than the original passion (TMS I.i.4.7). | The cap (8) is fixed and universal; in Smith, the abatement may vary by person and circumstance.
  (c) Double-sympathy | Smith: To judge the propriety of a person's sentiment, we must consider both the person and the object (TMS I.i.3). The desert of an action depends on the sympathy with the person affected (TMS II.i.2.2). | In the game, we explicitly separate the two sympathies; in Smith, they are intertwined in one act of judgment.
  (d) Hidden-norm | Smith: Local customs and education shape our moral judgments (TMS V.2). The general rules of morality are formed by experience (TMS III.4). | The game uses explicit role cards; in life, these norms are internalized gradually.
  (e) Proximity | Smith: Sympathy is stronger with vivid imagination (TMS I.i.1.2). Distance weakens sympathy. | The game uses tokens and vividness manipulation; in life, the effect is more nuanced.

  **Candid Feedback**:

  1. **What will predictably go wrong**:
     - Agents converging on a safe middle intensity: They might learn that D=8 is safe (because of the cap) and set D=8 regardless of F. This is actually part of the learning: they are discovering the norm. But to prevent everyone always setting D=8, we can vary the incidents: sometimes F is low (2) and then setting D=8 would be overstatement and costly. Also, in the hidden-norm round, the safe middle might not be safe.
     - Students misinterpreting the spectator's question: They might think they are to judge whether the reaction is justified (desert) rather than whether they can share the feeling. We mitigate by clear instructions: "Write the intensity you can imagine feeling in that situation." And in round 2, we separate the two sympathies explicitly.

     When it happens: 
        - If during the game, the TA notices a student misunderstanding, they can clarify privately.
        - In the debrief, we explicitly discuss the difference between sharing the feeling and judging desert.

  2. **Incident cards must avoid**: Ordinary incidents that are not triggering. Examples: 
     - Round 1: Waiter spills soup, or you receive a B+ on an assignment you thought you aced.
     - Round 2: Friend's partner forgets anniversary (as above) or a coworker takes credit for your idea.
     - Round 3: Your pet dies, or you lose a family heirloom.
     - Round 4: Car accident (as above), or a flood in a distant country vs your hometown.

     Avoid: sexual violence, real persons, anything that might trigger trauma.

  3. **Features the game cannot reproduce**:
     - The pleasure of mutual sympathy: In Smith, when agent and spectator achieve concord, they both feel pleasure. In the game, we score points, but it's not the same as the natural pleasure.
     - The slow formation of the impartial spectator: The inner judge is built over years of social interaction. The game compresses this into a few rounds, and the ledger is a poor substitute.
     - Also, in the game, the spectators are peers; in life, we internalize a composite of many judges.

     I agree with your suspicion. To partially address, in the debrief, we can ask: "In the game, when your displayed intensity was approved by many, how did that feel? Smith talks about a natural pleasure in such moments." And for the formation: "The all-knowing spectator in your ledger is a start, but Smith says we build an internal judge over time. How might that work?"

  **Final Deliverables**:

  **Materials List** (per 14 students):
  - 5 sets of incident cards (4 rounds + spare), each set has 4 cards (one per agent) for rounds 1,2,3. For round 4, 2 incident cards (one per subgroup).
  - Role cards: for round 3, 10 cards (5 for Group A and 5 for Group B).
  - Spectator response slips: 10 per round * 4 rounds = 40 slips.
  - Agent bid slips: 4 per round * 4 rounds = 16 slips.
  - Tokens for round 4: 10 tokens per spectator in round 4 (10 spectators) -> 100 tokens (e.g., poker chips or paper clips).
  - Private ledgers: 14 booklets (one per student) with 4 pages (one per round) with fields: 
       Round ___
       Felt intensity (F): ___
       Displayed intensity (D): ___
       All-knowing spectator approval (A_impartial): ___
       After the round: Average S: ___, Gap |A_impartial - avg S|: ___
  - Scoring summary sheet for TA.
  - Pens.
  - Box for collecting slips.
  - Timer.

  **Round-by-round timeline** (100 minutes):
  - 0-10 min: Setup. Divide students into agents (4) and spectators (10) for round 1. Explain rules: 
     - Agents: You will experience an incident. You have a felt intensity (F) and choose a displayed intensity (D). Write F and D on the bid slip (F is secret, D is public). Also, in your ledger, write A_impartial: what intensity would an all-knowing spectator approve?
     - Spectators: You will read the public incident and the agent's displayed intensity D. Write the intensity S you can sympathize with (0 to min(D,8)).
     - TA collects bids and responses. Then calculates and posts: for each agent, number of approvals and payoff. Also, the average S. Agents then fill in the average S and gap in the ledger.
  - 10-25: Round 1. Run.
  - 25-40: Round 2. New agents (rotate). Rules: 
     - Agents: same as round 1, but now for anger.
     - Spectators: You will read the incident and the agent's D_anger. Write S1 (anger you can share) and S2 (regret you can share with the partner) and V (desert: how much the agent's anger is deserved, 0-10).
     - TA calculates for each agent: approvals based on S1, payoff. Also posts avg(S1), avg(S2), avg(V).
  - 40-55: Round 3. New agents. 
     - Spectators get role cards (hidden). They are grouped by seating. 
     - Agents: grief incident.
     - Spectators: write S as modified by their role card.
     - TA aggregates S by group (left and right), posts the two averages. Then reveals role cards.
  - 55-70: Round 4. Split into two subgroups (each with 1 agent and 5 spectators). 
     - Each subgroup gets their incident (close or distant) and tokens. 
     - Spectators: allocate tokens to set S (0 to 10, one token per unit). The driver's D is fixed at 9. 
     - TA collects and posts average S for each subgroup.
  - 70-90: Debrief with the 7 questions.
  - 90-100: Conclude and introduce Part III.

  **Scoring Rule (for TA)**:
  - For rounds 1,3, and for the agent part of round 2:
     - For each agent:
          F = felt intensity (from bid slip)
          D = displayed intensity (from bid slip)
          For each spectator j:
              Sj = the sympathy intensity reported by j (capped at min(D,8) for the spectator's response, but the TA doesn't need to cap because the spectator was instructed to cap).
              Approval_j = 1 if Sj >= D, else 0.
          Number of approvals = sum(Approval_j)
          Payoff = (10 * number of approvals) - 2 * |F - D|
  - For round 2, additionally for each agent:
          avg(S1) = average of S1j over j
          avg(S2) = average of S2j over j
          avg(V) = average of Vj over j
  - For round 3, also calculate avg(S) for Group A and avg(S) for Group B.
  - For round 4: 
          For each subgroup, avg(S) = (sum of tokens allocated by spectators) / (number of spectators)   [because each token is one unit of S]

  **Device for sealed reports**: Use a box. Distribute response slips. When time is called, all spectators and agents must put their slips in the box at the same time.

  **Scaling**: 
  - For N students:
     - Number of agents per round: about N/3 (round to integer). Spectators: the rest.
     - In round 3: split spectators into two groups as evenly as possible.
     - In round 4: split the class into two subgroups. Each subgroup should have at least 1 agent and 3 spectators. If N is odd, make one subgroup have one more.

  **Debrief Questions** (as above).

  **Mapping Table** (as above).

  **Candid Feedback** (as above).

  This design meets the requirements. Good luck!
answer: |-
  Below is a comprehensive design for your in-class game, "The Sympathy Exchange," tailored to your specifications. It focuses on experiential learning of Smith's sympathy mechanics, setting up Part III as a solution to problems encountered during play. The game avoids explicit reference to the impartial spectator until the final debrief.

  ---

  ### **Game Overview**
  - **Objective**: Students experience Smith's sympathy mechanics (Part I & II) through role-playing as "Agents" (experiencing emotions) and "Spectators" (judging displays). Problems of misaligned sympathy emerge naturally, priming them for Part III (the impartial spectator as resolver).
  - **Core Mechanics**: Agents conceal true feelings and choose displayed intensity; Spectators judge based on imaginative sympathy. Scoring incentivizes understatement, highlights sympathy's limits, and reveals how group judgments are shaped by context and norms.
  - **Phased Structure**: 4 rounds (15 min each), each targeting one mechanic, plus setup/debrief. Total: 100 min.
  - **Key Avoidances**: No sexual violence, real persons, or overly divisive incidents. Incidents are ordinary (e.g., spilled coffee, missed events) to ensure shared intuitions.

  ---

  ### **Materials List** (Print in Advance)
  1. **Role Cards**: 
     - 4 Agent Cards (per round, for incidents).
     - 10 Spectator Cards (for hidden-norm round only, assigning Group A/B norms).
  2. **Incident Cards** (4 sets, one per round):
     - **Round 1 (Basic)**: *E.g., "Waiter spills coffee on your laptop. You feel anger (intensity 8). Laptop repairs cost $200, but the waiter was tripped."*
     - **Round 2 (Double-Sympathy)**: *E.g., "Your friend’s partner forgot their anniversary. Your friend is upset (intensity 7). The partner has work stress and feels regret (intensity 5)."*
     - **Round 3 (Hidden-Norm)**: *E.g., "Your pet dog died. You feel grief (intensity 6)."*
     - **Round 4 (Proximity)**: 
       - Subgroup 1 (High Vividness): *"Car crash outside: driver trapped, screaming (pain intensity 9)."* 
       - Subgroup 2 (Low Vividness): *"News report: car crash yesterday; driver in pain (intensity 9)."*
  3. **Response Tools**:
     - **Sealed Slips**: Small paper slips for Spectator approvals (1 per Spectator per round).
     - **Tokens**: 10 tokens per Spectator (for proximity round; use poker chips or paper clips).
     - **Private Ledgers**: Booklets for Agents with fields: 
       - Felt (F), Displayed (D), All-Knowing Spectator Approval (A_impartial), Avg. Spectator Approval (post-round), Gap (|A_impartial – Avg. Approval|).
  4. **TA Tools**:
     - Scoring spreadsheet (for real-time calculations).
     - Display board (to show group averages, verdicts).
     - Timer.
     - Opaque collection box (for sealed slips/tokens).

  ---

  ### **Round-by-Round Timeline** (100 Minutes Total)
  #### **Setup (10 min)**
  - Assign roles: 4 Agents, 10 Spectators (rotate roles each round so all students play both).
  - Distribute materials: Incident Cards (to Agents), Ledgers (to all), Response Slips/Tokens (to Spectators).
  - **Rules Brief (TA reads)**:
    - "Agents: Read your incident. Write your true feeling (F) and displayed feeling (D) on your ledger. F is secret; D will be shown to Spectators. Also, write what an all-knowing spectator (who knows all facts) would approve (A_impartial)."
    - "Spectators: When shown D, write the intensity you can sympathize with (S). S cannot exceed D and is capped (rules vary by round)."
    - "Verdicts are pooled. No discussing judgments until debrief."

  #### **Round 1: Basic Sympathy (15 min)**  
  - **Targets**: (a) Concord bid, (b) Abatement rule.  
  - **Steps**:  
    1. Agents receive Incident Card 1. Write F (0–10), D (0–10), and A_impartial (0–10) in ledger.  
    2. TA reveals D to Spectators. Spectators write S (0–10) on slips, with **S ≤ min(D, 8)** (hard-coded abatement).  
    3. TA collects slips via box, calculates:  
       - Approval: 1 if S ≥ D; 0 otherwise.  
       - Agent Payoff = (Number of Approvals × 10) – (2 × |F – D|).  
       - **Gap cost (|F – D|) is hidden until accounting** (to prevent tactical adjustments; encourages focus on expectations of sympathy).  
    4. TA posts: # Approvals, Payoff, Avg. S. Agents record Avg. S and Gap in ledger.  
  - **Defense of Hidden Gap Cost**: Concealing the cost during play mirrors Smith’s idea that agents anticipate sympathy without knowing exact costs (TMS I.i.4.7). Revealing it post-verdict highlights the "internal cost" of misalignment.

  #### **Round 2: Double-Sympathy (15 min)**  
  - **Targets**: (c) Double-sympathy round.  
  - **Steps**:  
    1. Agents receive Incident Card 2. Set F_anger, D_anger, and A_impartial.  
    2. TA reveals D_anger and the affected person’s feeling (e.g., partner’s regret at 5) to Spectators.  
    3. Spectators write two S values on slips:  
       - S1 (sympathy with Agent’s anger; capped at min(D_anger, 8)).  
       - S2 (sympathy with affected person’s regret; capped at min(5, 8)).  
    4. TA calculates:  
       - Agent Payoff (based on S1, as in Round 1).  
       - Pooled Verdict on Desert: Avg. S2.  
    5. TA posts: Agent Payoff, Avg. S1, Avg. S2.  
  - **Why It Works**: S1 (high if anger is proportionate) and S2 (low if regret seems insufficient) diverge. Desert verdict (Avg. S2) appears on board—e.g., low Avg. S2 implies anger is undeserved—without instructor input.

  #### **Round 3: Hidden-Norm (15 min)**  
  - **Targets**: (d) Hidden-norm round.  
  - **Steps**:  
    1. Agents receive Incident Card 3. Set F_grief, D_grief, A_impartial.  
    2. Spectators receive hidden Role Cards:  
       - Group A (e.g., left-side seats): "Conspicuous grief is self-indulgent. Cap S at min(D, 3)."  
       - Group B (e.g., right-side seats): "Absent grief is callous. Set S=0 if D < 3."  
    3. TA reveals D to Spectators. Spectators write S (applying role rules) on slips.  
    4. TA aggregates S by seating area, posts: Avg. S for Group A, Avg. S for Group B.  
    5. Role Cards revealed.  
  - **Conclusion**: Students see verdicts differ by group (e.g., Group A has low S for high D), realizing pooled judgments reflect local norms.

  #### **Round 4: Proximity (15 min)**  
  - **Targets**: (e) Proximity round.  
  - **Steps**:  
    1. Split class: Subgroup 1 (high vividness), Subgroup 2 (low vividness). Each has 2 Agents and 5 Spectators.  
    2. Agents receive Incident Card 4 (same event, different vividness). Set F_pain, D_pain, A_impartial.  
    3. TA reveals D_pain (fixed at 9) to Spectators.  
    4. Spectators allocate **10 tokens** to S (1 token = 1 unit S; S ≤ D).  
    5. TA calculates Avg. S per subgroup, posts: Subgroup 1 Avg. S, Subgroup 2 Avg. S.  
  - **Why It Works**: High-vividness group allocates more tokens (higher S), showing proximity’s impact on sympathy.

  ---

  ### **Scoring Rules** (Precise Instructions for TA)
  1. **General**:  
     - **S Cap**: In all rounds, Spectators cap S at min(D, 8) unless modified (e.g., Round 3 roles).  
     - **Agent Payoff**: Payoff = (Number of Approvals × 10) – (2 × |F – D|).  
       - Approval = 1 if S ≥ D; 0 otherwise.  
       - |F – D| penalty applied once per Agent (not per Spectator).  
     - **Simultaneous/Sealed Reports**:  
       - Spectators write S on slips and deposit in opaque box. TA collects after all submitted.  
       - Agents write F/D on ledger (not shared).  
       - **No verbal sharing** to prevent drift.  
  2. **Per-Round Adjustments**:  
     - **Round 2**: Calculate/pool Avg. S1 and Avg. S2 separately. Agent Payoff based only on S1 approvals.  
     - **Round 3**: Calculate Avg. S by seating area. Ignore Agent Payoff (focus on group comparisons).  
     - **Round 4**: Avg. S = (Total tokens allocated by Spectators) / (Number of Spectators).  
  3. **Scaling (10–20 Players)**:  
     - **Agents**: Use 3 Agents for 10 players, 5 for 15, 6 for 20.  
     - **Spectators**: Distribute evenly. For hidden-norm, split into two equal groups. For proximity, balance subgroups.  
     - **Materials**: Scale cards/slips proportionally. One TA can manage up to 20.

  ---

  ### **Debrief Questions** (5–7 Minutes)
  Ask in order, tagging to gameplay moments:  
  1. (After Round 1) *"Agents, when choosing D, did you prioritize truth or sympathy? How did the gap penalty affect you?"* [Tag: Concord bid’s tension between feeling and display].  
  2. (After Round 1) *"Spectators, what limited your S? Did you ever wish you could sympathize more?"* [Tag: Abatement rule’s asymmetry].  
  3. (After Round 2) *"In the anniversary incident, why might Avg. S1 and Avg. S2 diverge? Which one shaped desert?"* [Tag: Double-sympathy verdicts].  
  4. (After Round 3) *"How did hidden norms affect our pooled verdict? What if this room had different people?"* [Tag: Hidden-norm revelation].  
  5. (After Round 4) *"How did vividness impact token allocation? What does this say about real-world suffering?"* [Tag: Proximity results].  
  6. (Ledger Focus) *"Look at your gaps. What caused them? How might an ‘all-knowing’ spectator close them?"* [Tag: Ledger gap analysis].  
  7. (Transition to Part III) *"Without saying ‘impartial spectator,’ what would resolve these gaps? How might society build such a resolver?"*  

  ---

  ### **Mapping Table: Rules to Smith’s Theory**
  | Rule | Smith Claim (TMS Reference) | Where Analogy Fails |
  |------|------------------------------|---------------------|
  | (a) Concord bid | Agents moderate displays for social harmony; understatement reduces misalignment (I.i.4.7). | Game’s gap cost is arbitrary; Smith’s is a natural pain of discord. |
  | (b) Abatement rule | Spectators feel weaker sympathy than agents due to imaginative distance (I.i.1.2–3). | Hard-coded cap oversimplifies; real abatement varies by relationship/context. |
  | (c) Double-sympathy | Propriety requires sympathy with both actor and recipient; desert tracks the latter (I.i.3; II.i.2.2). | Game separates sympathies; Smith integrates them in a single judgment. |
  | (d) Hidden-norm | Local norms shape sympathy; pooled judgments reflect group composition (V.2; III.4). | Role cards are explicit; real norms are internalized unconsciously. |
  | (e) Proximity | Vividness/proximity strengthens sympathy; distance weakens it (I.i.1.2). | Tokens quantify sympathy; Smith’s sympathy is qualitative and gradual. |

  ---

  ### **Candid Feedback**
  1. **What Will Go Wrong (and Solutions)**:  
     - **Agents converge on safe middle D (e.g., 5–6)** due to fear of penalties. *Solution*: Use incidents with extreme F (e.g., F=2 or F=9) to make "safe" D costly. Debrief Question 1 highlights this.  
     - **Students confuse sympathy with justification**: Some Spectators may judge "desert" (e.g., "Was anger fair?") not "Can I share it?" *Solution*: TA monitors slips; invalidates non-compliant responses. Clarify in rules: "Sympathy ≠ moral judgment; it’s about imagining yourself in their shoes."  
     - **Time pressure**: Rounds may run long. *Solution*: Use a visible timer; TA cuts off at 12 min for accounting.  

  2. **Incident Card Avoidances**:  
     - **Avoid**: Sexual violence, real people, trauma-triggering content (e.g., assault, death of a parent).  
     - **Use**: Mundane, relatable incidents (e.g., spilled coffee, work stress, pet loss) where cultural/generational biases are minimized. Ensure no real names or identifiable details.  

  3. **Features the Game Cannot Reproduce**:  
     - **Agree**: The game cannot capture:  
       - **Pleasure of mutual sympathy**: Smith’s "joy" in concord (I.i.2.1) is reduced to points.  
       - **Formation of the impartial spectator**: Smith’s judge emerges from lifelong socialization (III.1–3); the game’s "all-knowing spectator" is a snapshot.  
     - **Mitigations**:  
       - For pleasure, use Debrief Question 1 to ask about emotional rewards.  
       - For formation, end on the ledger gap: "This gap is what Smith’s impartial spectator resolves over time through experience."  
     - **Other Limits**:  
       - **Moral development**: Smith’s spectator evolves (III.3); the game is static.  
       - **Complex passions**: Game simplifies emotions to 0–10; Smith’s are nuanced (e.g., "mixed passions" in I.ii).  
     - **What to Supply in Exposition**: Post-game, clarify:  
       - "Smith’s impartial spectator isn’t just ‘all-knowing’—it’s an internalized judge built from repeated social interactions."  
       - "Mutual sympathy’s pleasure is a core motivator; today’s points are its proxy."

  ---

  This design ensures mechanics drive conclusions, with the impartial spectator emerging as the "answer" to witnessed gaps. It balances structure with flexibility, and the debrief links gameplay to Part III. Run it as-is, and adjust incidents/norms based on class dynamics.
