  Key elements to be included (as per the query):
  (a) Concord bid: Agents have a felt intensity and a displayed intensity. Spectators approve based on whether the displayed intensity is within what they can sympathize with. Understatement is profitable, and there is a cost for the gap between felt and displayed. The cost should be hidden during play to prevent immediate adjustment and to encourage strategic behavior based on expectations.

  (b) Abatement rule: Spectators can only sympathize up to a level less than the agent's felt intensity. This offset will be hard-coded for simplicity and consistency.

  (c) Double-sympathy round: One incident requires two acts of fellow-feeling: one for the person reacting and one for the person affected. The judgment about desert (whether the reaction was deserved) should track the sympathy with the affected person.

  (d) Hidden-norm round: Spectators have hidden role cards that assign them to groups with different norms about displaying emotion. The aggregate verdicts by group are compared, revealing that the pooled verdict depends on the composition of the group.

  (e) Proximity round: Two subgroups receive the same incident but with different vividness. They allocate a fixed budget of tokens to express the intensity they can sympathize with.

