  Hmm, the user has described an incredibly fascinating phenomenon with their amateur rain forecasting group. They've gathered four years of data showing that while each individual member performs worse than random chance (38-47% accuracy), the group majority achieves 71% accuracy. The key insight is that their errors are negatively correlated - "camps" make opposite mistakes that cancel out. 

  The user presents several crucial observations: adding a poor but diversely wrong predictor (brother-in-law) improved group accuracy, while adding someone who made identical errors to an existing member destroyed it. They explicitly reject popular wisdom like the wisdom of crowds (which assumes unbiased errors) and Condorcet's jury theorem (which requires individual competence above 50%). 

  What makes this particularly interesting is how it violates common assumptions about collective intelligence. The user is clearly scientifically minded - they've done controlled experiments by adding members and tracking results. Their questions reveal deep curiosity about boundary conditions: different error distributions, continuous variables, communication effects, and whether the rare consensus failures are part of the same phenomenon.

  I recall this resembles the "diversity prediction theorem" but with a twist - usually it decomposes collective error into average individual error minus diversity. Here the average individual error is high (>50% wrong) but the diversity is so strongly negatively correlated that it overcompensates. The brother-in-law case shows it's not just diversity but specifically countervailing biases that matter.

  For naming, "negative error covariance" might be technically accurate but won't satisfy the user. "Adversarial error cancellation" captures the opposing camps dynamic but sounds confrontational. Perhaps "complementary incompetence" with a rigorous definition emphasizing that the system relies on predictors being wrong in systematically opposite ways.

  The critical threshold questions are profound: three camps would work if their error vectors summed beneficially. Lopsided camps risk majority bias. The rare consensus failures likely represent genuine environmental unpredictability. Continuous variables would require different error correlation structures. Communication might destroy the negative correlation by creating groupthink.

  My confidence that this isn't a named phenomenon comes from the violation of the competence assumption in all standard collective intelligence models. If any individual were above 50%, this would reduce to known results. The brother-in-law experiment is the smoking gun - no existing theory predicts that adding a worse individual could improve group accuracy.
answer: |-
  What you're describing is a beautiful and counterintuitive phenomenon that **doesn't have a single, universally agreed-upon name**, precisely because it defies the standard assumptions of the most famous "group wisdom" theorems. It's a specific case where **diversity of systematic error** (bias) combined with **negative error correlation** enables a group of individually incompetent predictors to outperform even the best individual, *and* where adding a specific type of "bad" predictor can actually help.

  Here's a breakdown of the nearest concepts, how they relate, and why they don't quite fit perfectly:

  1.  **The Diversity Prediction Theorem:** (Page & Miller)
      *   **What it says:** Collective Error = Average Individual Error - Diversity (Variance of Predictions).
      *   **How it fits:** Your data screams this theorem. Your collective error is *much* lower because the *diversity* (variance in predictions) is high. The "camps" represent systematic biases pulling in opposite directions. The theorem explains *why* the group beats the average individual and *how* adding the brother-in-law (a new source of strong bias in a different direction) increased diversity, lowering collective error.
      *   **Where it falls short:** It's framed for continuous predictions (like guessing a weight), not binary (yes/no). While the core logic applies, the binary nature makes the "variance" manifest as disagreement/dispersion. More importantly, **it doesn't inherently require individual incompetence.** It works *even if* individuals are competent. Your case is a *specific subset* where diversity saves the day *despite* universal incompetence.

  2.  **Condorcet's Jury Theorem:**
      *   **What it says:** If each juror has independent judgment and competence >50%, then as the jury size increases, the probability the majority is correct approaches 1.
      *   **How it *doesn't* fit:** This is the exact opposite of your scenario! Your individuals are *incompetent* (<50%), and adding *more* incompetent people *can* help or hurt depending on their bias/diversity. Independence is also debatable (your camps might share *some* correlated thinking). This theorem is irrelevant here because its core assumption (p>0.5) is spectacularly violated.

  3.  **Wisdom of Crowds (Popular Version):**
      *   **What it says:** Large groups often make surprisingly accurate judgments by aggregating diverse, independent opinions.
      *   **How it fits superficially:** It captures the "group beats individuals" aspect.
      *   **Where it falls short:** The popular telling glosses over the *requirements*: independence and diversity (often implying unbiased errors). Your case highlights **diversity of *bias*** is key, and individual incompetence isn't a barrier. Your brother-in-law experiment shatters the naive "adding more = better" notion – it depends *crucially* on *what kind* of bias you add.

  4.  **Error Independence / Uncorrelated Errors:**
      *   **What it says:** For simple averaging to work well, individual errors should not be correlated (i.e., when one is wrong, it shouldn't predict others being wrong in the same way).
      *   **How it *doesn't* fit:** Your errors are *highly correlated* – but *negatively* correlated within the camps! This is the critical insight. Standard wisdom assumes *uncorrelated* errors are good; you show that **strongly *negatively* correlated errors** are even more powerful, especially when individuals are biased and incompetent. "Negative error covariance" is the technical term for this statistical property.

  **Proposing a Name & Definition:**

  Given the inadequacy of standard terms, a specific label for *your phenomenon* is justified:

  *   **Name:** **Bias Cancellation through Diverse Incompetence (BCDI)** or **Complementary Bias Aggregation (CBA)**
  *   **Core Definition:** *A phenomenon where the majority vote or collective judgment of a group of individually incompetent predictors (each <50% accurate on a binary task) achieves high accuracy due to the presence of multiple, distinct, and strongly opposing systematic biases within the group, leading to negatively correlated errors that cancel out on most trials.*

  **Addressing Your Boundary Questions:**

  1.  **Three Camps (or more):** **Yes, it still works.** The core requirement is that the systematic errors (biases) aren't all aligned. Multiple distinct biases can still lead to effective cancellation, as long as no single bias dominates the majority. The "cancellation" becomes multi-dimensional.
  2.  **Lopsided Camps:** **This is critical.** If one camp becomes too large, its bias dominates. The majority vote will simply reflect that dominant bias, and the group accuracy will plummet towards the accuracy of that large camp (likely low, since they are incompetent). The brother-in-law's *mate* wrecked it because they amplified an *existing* bias direction, making it dominant. There's an optimal "balance of bias" for cancellation.
  3.  **The One-in-Ten Consensus Failure:** **Likely part of the same phenomenon.** These are the days where the underlying signal (tomorrow's weather) was so ambiguous or complex that *all* your systematic biases (wet-leaning and dry-leaning) pulled everyone in the *same wrong direction*. It's the flip side of cancellation – when reality confounds *all* your heuristics simultaneously. It highlights that your group's strength relies on biases that are *usually* counteracting but not universally applicable.
  4.  **Beyond Yes/No (Numbers):** **Yes, the principle extends.** The Diversity Prediction Theorem handles continuous predictions directly. The key is that individual predictions = Truth + Bias + Random Error. If the *Biases* are diverse (some positive, some negative) and large, but the *Random Errors* are small or uncorrelated, the average can still be very accurate even if every individual is wildly biased and inaccurate. Your binary case is a special instance where "diverse bias" manifests as negative error correlation.
  5.  **Talking Before Submitting:** **This likely destroys the effect.** Communication risks:
      *   **Reducing Diversity:** Persuasion, social pressure, or deference to perceived "experts" will cause individuals to converge towards a common view, destroying the crucial opposing biases.
      *   **Creating Correlated Errors:** Everyone adopts similar reasoning flaws or focuses on the same misleading clue, leading to *positively* correlated errors (everyone wrong together). This would likely push group accuracy *down* towards the individual average (well below 50%) and make those "all wrong" days much more frequent.

  **Confidence & What Would Change My Mind:**

  *   **Confidence Level (No Single Established Term):** **High (90%).** I am highly confident there isn't a *single, widely recognized term* specifically for "group of individually incompetent predictors achieving high accuracy via negatively correlated biases." The core statistical phenomenon (negative error covariance enabling group success despite low individual accuracy) is understood, but the framing around universal incompetence and the vividness of your "camps" and experiments makes it a distinct *case* deserving its own label.
  *   **Confidence Level (Phenomenon is Known/Novel):** **Medium-High (75%).** Statisticians and collective intelligence researchers are *very* familiar with the math behind the Diversity Prediction Theorem and the power of uncorrelated/negatively correlated errors. The insight that this allows groups of *incompetents* to succeed is less commonly emphasized but not entirely novel. Your specific empirical demonstration (especially the brother-in-law experiment) is exceptionally clear and compelling.
  *   **What Would Change My Mind (Collapse to Standard):**
      *   **If Individual Accuracies Were Actually >50%:** If you recalculated and found even *one* member was consistently >50%, Condorcet becomes relevant. If the *average* was >50%, Wisdom of Crowds/Diversity Theorem easily explains it. Your insistence on *all* <50% is crucial.
      *   **If Errors Were Merely Uncorrelated, Not Negatively Correlated:** If your camps didn't exist and errors were random and independent, the Diversity Theorem explains the group beating the average, but the effect would be *much weaker* than 71% from a ~43% average (math dictates it), and adding *any* incompetent member would *always* slightly *hurt* the average and thus (usually) the collective accuracy. Your brother-in-law experiment *proves* negative correlation (adding him helped, meaning his errors actively countered the existing group bias).
      *   **Finding a Niche Term:** A deep dive into very specific literature on ensemble learning with weak learners or collective decision-making under bias *might* unearth a term like "bias-variance decomposition for classifiers" or "error correlation in boosting," but these are highly technical and not descriptive of the *social phenomenon* you observed.

  **Conclusion:**

  You've stumbled upon a powerful demonstration of how **diversity of systematic error (bias)** can be a strength, not just a weakness, in collective judgment, especially when individual judgment is poor. While rooted in the **Diversity Prediction Theorem**, your case stands out due to the **universal individual incompetence (<50% accuracy)** and the **strong negative correlation of errors** driven by opposing "camps." This specific combination lacks a perfect popular name, hence the proposal **Bias Cancellation through Diverse Incompetence (BCDI)** or **Complementary Bias Aggregation (CBA)**. It works with multiple camps or continuous predictions, is fragile to lopsided groups or communication, and the rare consensus failures are an inherent limitation. It's a fascinating example of how being wrong, but wrong in the *right ways*, can create group intelligence.
