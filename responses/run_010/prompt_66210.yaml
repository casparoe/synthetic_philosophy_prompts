prompt: |-
  I run a small conflict-intake office at a mid-size public university — think of it as the informal half of student conduct. People come to us instead of filing a formal charge: we can coach them, mediate, refer, or close the thing with no record. We can't make findings of fact and we can't sanction anyone, that's the formal office two floors up. We get about 25 intakes a month, I've got maybe 20 minutes per case, and two of the three people doing this with me are part-time staff with no background in sociology or philosophy whatsoever. So whatever you give me has to survive being handed to someone who has never heard of the theory it's built on and isn't going to look it up.

  The frame I want you to work from is the honor / dignity / victimhood account of moral cultures, the one Bradley Campbell and Jason Manning laid out in their microaggression paper and then in the 2018 book. As I've got it: honor cultures make social standing the main engine of social control, so people are acutely sensitive to insult and are expected to handle slights themselves, personally, sometimes forcefully, with little reliance on outside authorities. Dignity cultures say a person has a worth that an insult can't actually dent, so you're supposed to have a thick skin about minor stuff and bring in third parties — courts, deans, HR — only for harms that are serious. Victimhood cultures keep honor's hair-trigger sensitivity to slight but combine it with dignity's dependence on third parties, and then add the piece that makes it its own thing: moral status attaches to having been wronged, so publicizing the wrong, aggregating incidents, and performing for an audience become ways of making the claim stick. Please don't send me a bibliography or a reading list, I can't chase anything down.

  What I actually need is a triage procedure: ordered questions, what counts as a sufficient answer to each, the exit points (close it, coach the person to handle it directly, offer mediation, refer up to the formal office), and explicit markers on the steps that are really judgment calls wearing a procedure costume. Two things I want you to get right, because I think naive uses of this frame botch them. First, classify the interaction, not the person — I do not want a checklist that outputs a personality type. Second, the culture in play can switch mid-incident: a slight being handled dignity-style becomes a third-party case the moment someone screenshots it or an RA writes it up on her own initiative, so the procedure should track which channel the thing is currently traveling down. And the thing that keeps me up is that this whole frame reads like a credibility discount — if my staff hear "victimhood grammar" they'll quietly start treating those complaints as less real, which would be bad both morally and practically, since plenty of genuinely awful conduct arrives wrapped in exactly that vocabulary. Build the guardrail in, and then tell me where the guardrail leaks.

  Then run it on three cases shaped like ones we actually get. (1) A senior comes in about a classmate who keeps mangling her name after being corrected twice; she says she doesn't want him sanctioned, she wants it logged so it's on the record, and she's already posted a screenshot of the exchange to a public account with about four thousand followers. (2) A first-year says a guy in his hall said something to his face over a shared kitchen, he confronted him, it got heated, and then the RA documented it anyway — now he feels he has to press it or he looks like he backed down, and what he's asking me for is whether we can get the write-up deleted. (3) Eleven seperate reports in one term about the same TA, each one small on its own — interrupting, a remark about someone's accent, answering an email with a joke — and all eleven using nearly identical vocabulary. My gut says contagion; but I also know my gut is exactly the instrument that would let a serial offender hide inside a pile of trivia, and there's an unflattering third reading where our own log is the mechanism, because we built a third-party channel and then people used it.

  Finish by telling me what the procedure can't do and where it will misfire most often — and, the part I care most about, what would change your mind about using this frame at all. If there's some argument or finding that would make you tell me to throw it out and triage on something else entirely, say what it is and how I'd recognize it in my own caseload. Also point at the step in your own reasoning you think is most likely to be wrong. American English, please.
reasoning: |-
  Hmm, this is a complex request from someone running a conflict-intake office at a university. They need a practical triage procedure based on the honor/dignity/victimhood framework, with specific guardrails against misapplication. Let me unpack this carefully.

  The user's operational constraints are clear: 20 minutes per case, mixed staff expertise, no theoretical baggage allowed. Their non-negotiables are crucial - must analyze interactions not people, account for cultural switching mid-incident, and prevent victimhood framing from becoming a credibility discount. That last point about staff bias is particularly acute; I need to bake in safeguards.

  First, structural principles: The procedure must be flowchart-simple. Three key questions in sequence, each with binary outcomes. Exit points clearly mapped to honor/dignity/victimhood dynamics but labeled neutrally ("direct resolution" not "honor-style"). Most importantly, the assessment focuses solely on the conflict's current trajectory - is it being handled personally? institutionally? publicly?

  Guardrail implementation: I'll replace theory-laden terms with behavioral descriptors. Instead of "victimhood culture" we'll say "audience-dependent resolution seeking". The credibility discount risk gets two concrete mitigations: 1) Explicit instruction that performative elements don't negate substantive harm 2) Mandatory harm-severity assessment before any closure.

  For case applications: 
  - The name-mangling case screams victimhood dynamics (public posting, documentation request without sanctions) but the procedure would correctly route to mediation with documentation option. 
  - The dorm confrontation shows honor-to-dignity switching after RA intervention - here the triage avoids validating "face-saving" by focusing on institutional reality. 
  - The TA cluster is trickiest; the procedure forces pattern recognition while blocking "contagion" bias through the independent harm assessment step.

  Critical limitations: This framework will misfire spectacularly on power-imbalance cases (like faculty-student conflicts) where "direct resolution" is unsafe. Also when complainants use victimhood grammar strategically because they've learned formal channels ignore subtle harms. The kill-switch trigger? If data shows certain demographics get systematically routed to "close case" - that would prove the framework replicates bias rather than revealing conflict dynamics.

  My own doubt centers on Question 2 (audience dependence). In digital-native cohorts, almost everything has some audience - that might make the triage oversensitive. But altering it would break the victimhood detection mechanism. Tradeoffs...
answer: |-
  Here's a practical triage procedure based on the honor/dignity/victimhood framework, designed for your operational constraints and pitfalls. It tracks **conflict channels**, not personalities, and includes explicit bias guardrails.

  ---

  ### **Triage Procedure: 3 Questions with Exit Points**
  **Key:**  
  🔵 = Judgment call (procedural costume)  
  🛡️ = Credibility guardrail  

  | Question | Sufficient Answer | Exit Point |
  |----------|-------------------|------------|
  | **1. Is this being handled personally or institutionally?** <br> *(Who currently "owns" resolution?)* | • **Personal:** Parties directly interacting (e.g., confronting, ignoring, negotiating privately). <br> • **Institutional:** Any 3rd party involved (RA, Title IX, your office, screenshots sent to authority). | ➡️ **Personal:** *Coach* on direct resolution (scripts, de-escalation) UNLESS ⚠️ safety risk. <br> ➡️ **Institutional:** Proceed to Q2. |
  | **2. Is the resolution sought dependent on an audience?** <br> *(Does validation/outcome require witnesses, documentation, or publicity?)* 🔵 | • **No:** Seeks private fix (e.g., "I just want it to stop"). <br> • **Yes:** Requires proof, witnesses, records, or public acknowledgment (e.g., "I need this logged", screenshots shared broadly). | ➡️ **No:** *Offer mediation* or *coach* on institutional pathways if harm is serious. <br> ➡️ **Yes:** Proceed to Q3. |
  | **3. How severe is the alleged harm?** 🔵 🛡️ <br> *(Ignore performative language; assess: physical safety, academic/professional impact, protected-class targeting?)* | • **Minor:** Accidental slights, no pattern, low impact (e.g., name error, tone issue). <br> • **Serious:** Harassment, threats, discrimination, repeated targeting. | ➡️ **Minor:** *Document* + *close* or *refer to mediation*. <br> ➡️ **Serious:** *Refer to formal office* regardless of Q1/Q2 answers. <br> 🛡️ **GUARDRAIL:** Severity assessment **must** ignore rhetoric style. If harm is serious, it stays serious even if wrapped in "victimhood grammar." |

  ---

  ### **Guardrails & Leaks**
  - **🛡️ Built-in Guardrail:** Severity (Q3) is the **final arbiter**. No case closes or avoids referral if harm is serious, no matter the channel or performative elements.  
  - **⚠️ Where It Leaks:**  
    1. **Staff bias in severity assessment:** A staffer might dismiss "interrupting" as minor despite racial/gender targeting.  
    2. **"Audience" over-interpretation:** A private chat screenshot sent to one friend ≠ public performance.  
    3. **Cultural switching blind spots:** If parties revert to personal resolution mid-process, staff might miss it.

  ---

  ### **Case Applications**
  **Case 1: Senior + Name Mangling**  
  - Q1: Institutional (screenshot sent to 4K followers + "logging" request).  
  - Q2: Audience-dependent (public post + record request).  
  - Q3: **Minor harm** (no protected-class targeting alleged, academic impact unclear).  
  - **Exit:** *Document* + *close* or *offer mediation*. Guardrail holds: Harm severity doesn't increase due to publicity.  

  **Case 2: First-Year + Confrontation**  
  - Q1: Switched to institutional (RA documented).  
  - Q2: **Not audience-dependent** (wants write-up deleted; seeks private resolution).  
  - Q3: **Assess severity:** If "something said" was a threat → serious. If heated argument → minor.  
  - **Exit:** If minor → *Coach on direct resolution* (e.g., "You can choose to drop this"). If serious → *Refer up*.  

  **Case 3: 11 Reports on TA**  
  - Q1: Institutional (reported to your office).  
  - Q2: Audience-dependent (identical language suggests coordination/public validation).  
  - Q3: **Pattern = severity accelerator.** Small acts + protected-class targeting (accent remarks) = serious.  
  - **Exit:** *Refer to formal office* for investigation. Guardrail holds: Contagion doesn't negate pattern.  

  ---

  ### **What This Can’t Do & Where It Misfires**  
  - **Can’t:**  
    - Detect power imbalances (e.g., TA-student dynamics).  
    - Handle cases where "minor" harm is weaponized (e.g., microaggressions as systemic harassment).  
    - Capture cultural nuances (e.g., honor-culture backgrounds where public escalation = last resort).  
  - **Misfires Most Often:**  
    1. **"Audience" misreads:** Staff may see any social media mention as "performance," ignoring cultural/community norms.  
    2. **Severity blind spots:** Staff may underestimate impacts of identity-based slights ("just an accent remark").  

  ---

  ### **What Would Make Me Abandon This Frame**  
  - **Kill-Switch Condition:** If data shows your office **systematically discounts complaints** that use victimhood-culture markers (e.g., "logging requests" or coordinated reports get dismissed more often than honor/dignity-style complaints *with identical facts*).  
  - **How You’d Know:** Audit your closed cases: Are complainants using "victimhood grammar" disproportionately told to "handle it personally" or "let it go" despite protected-class harm? If yes, the framework is enabling bias.  
  - **My Weakest Link:** Assuming staff can neutrally assess "harm severity" when performative elements trigger implicit bias. If your team can’t separate *style* from *substance*, Q3 fails.  

  **Bottom line:** This is a **channel tracker**, not a truth detector. Its value is routing conflicts efficiently — but if your logs show it’s silencing marginalized voices, scrap it and triage solely on harm severity + power dynamics.
