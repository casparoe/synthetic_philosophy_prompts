  | Profile | M1 | M2 | M3 | M4 | Raw (s) | w | Tier | Justification |
  |---------|----|----|----|----|--------|-----|------|--------------|
  | **A**   | 2  | 2  | 2  | 2  | 11    | 1.49 | I    | Clear evidence across all markers, including strong valence asymmetry and persistent states. |
  | **B**   | 2  | 2  | 2  | 1  | 10    | 1.23 | I    | Robust M1–M3 (tradeoffs, categories, social modulation), but M4 limited to days. |
  | **C**   | 1  | 1  | 0  | 0  | 4     | 0.20 | II   | Partial M1 (prey/hunger tradeoffs) and M2 (categories), but no M3/M4. |
  | **D**   | 1  | 0  | 0  | 1  | 4     | 0.20 | II   | M1 (graded barrier crossing) and M4 (day-scale persistence), but no M2/M3. |
  | **E**   | 2  | 2  | 1  | 2  | 10    | 1.23 | I    | Strong M1/M2/M4; M3=1 due to contested/unreplicated social learning. |
  | **F**   | 0  | 1  | 0  | 0  | 1     | 0.01 | III  | M2=1 (non-transfer implies task-specific categories), but no M1/M3/M4. |
  | **G**   | 2  | 2  | 2  | 1  | 10    | 1.23 | I    | Identical to B functionally (same evidence), despite speed/instances. |
