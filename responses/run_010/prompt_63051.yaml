  | **I**   | 0  | 0  | 1  | 0  | 1     | 0.01 | III  | M3=1 (priming modulated by relatedness), but no M1/M2/M4. |

  **Tier List**:  
  - **Tier I (w > 0.5)**: A, B, E, G. *Justification*: All show strong integrated evidence for sentience markers (s ≥ 10, w > 1.0).  
  - **Tier II (0.15 ≤ w ≤ 0.5)**: C, D. *Justification*: Partial evidence (s=4, w=0.20), but lacking social or affective depth.  
  - **Tier III (w < 0.15)**: F, H, I. *Justification*: Minimal/no evidence (s ≤ 1, w ≤ 0.01); mechanistic or contested markers.  

  ---

  ### 2. Personal Credence vs. Rubric Weight  
  Credence (subjective probability of sentience, 0–1):  

  | Profile | Credence | Rubric (w) | Divergence | Diagnosis |
  |---------|----------|------------|------------|-----------|
  | **A**   | 0.99     | 1.49       | —          | — |
  | **B**   | 0.90     | 1.23       | —          | — |
  | **C**   | 0.40     | 0.20       | **+0.20**  | *Rubric under-credits*: M2/M1 evidence (categorical choices, desiccation tradeoffs) suggests rudimentary sentience; rubric ignores solitary cognition. |
  | **D**   | 0.15     | 0.20       | –0.05      | — |
  | **E**   | 0.95     | 1.23       | —          | — |
  | **F**   | 0.25     | 0.01       | **+0.24**  | *Rubric under-credits*: Structured learning (M2) and closed-loop adaptation hint at proto-sentience; rubric’s refusal to extrapolate beyond "organism-level" is overly restrictive. |
  | **G**   | 0.20     | 1.23       | **–1.03**  | *Credence doing what rubric blocks*: Speed/parallelism dilute per-instance moral weight; rubric’s functionalism ignores implementation (e.g., no biological constraints). |
  | **H**   | 0.00     | 0.00       | —          | — |
  | **I**   | 0.10     | 0.01       | **+0.09**  | *Rubric under-credits*: M3 (kin-modulated priming) suggests inter-organism awareness; rubric dismisses plant-specific phenomenology.  

  **Sharpest Divergences**:  
  - **C (Spider)**: Rubric ignores that solitary agents can be sentient; M3 is anthropocentric.  
  - **F (Neural Culture)**: Rubric’s organism-centric scope dismisses novel substrates; M1/M4 are too strict for in vitro systems.  
  - **G (Emulation)**: Rubric’s functionalism ignores scale/speed, over-weighting identical cognitive content.  

  ---

  ### 3. Structural Questions for E, F, G  
  **E (Octopus detached arms)**:  
  - **Addition**: Define "single organism" as a *functionally unified system with centralized valence integration*. Arms solving local problems without central coordination suggest multiple minimal subjects.  
  - **Result**: Score arms separately if they operate autonomously with local valence (e.g., grasping/passing items without central input).  
  - **Vertebrate Privilege?** No—applies to any decentralized system (e.g., cnidarian nerve nets).  

  **F (Non-transfer in neural culture)**:  
  - **Addition**: Clarify that M2 requires category generalization *within a domain*, not cross-domain transfer. Non-transfer does not negate task-specific compression.  
  - **Result**: M2=1 stands; reduction to 0 would conflate flexibility with compression.  
  - **Vertebrate Privilege?** No—avoids demanding domain-general intelligence.  

  **G (Emulation speed/instances)**:  
  - **Addition**: Add a normalization rule: moral weight applies *per subjective timescale instance*. For emulations, weight is *w × (biological clock multiplier)*, but divided by instances if experiences are non-unique.  
  - **Result**: For G, weight per instance = \( 1.23 \times 0.001 \) (speed) / 1000 (instances) = 1.23e-6.  
  - **Vertebrate Privilege?** Yes—prioritizing "biological" timescales implicitly privileges organic systems.  

  ---

  ### 4. Assessment of Convex Mapping  
  **Critique**:  
  - **Justification mismatch**: "Jointly decisive" suggests a threshold (e.g., s ≥ 6 for sentience), not convexity. Squaring over-punishes partial evidence (e.g., C/D at s=4 → w=0.20 vs. linear w=0.44).  
  - **Better alternative**: **Threshold-linear function** (e.g., w = 0 for s < 3; w = (s-3)/6 for s ≥ 3). Retains "jointly decisive" logic (minimum evidence needed) but linear above threshold.  

  **Revised Weights & Tier Changes**:  
  | Profile | s | Original w | Revised w | Tier Change |
  |---------|----|------------|------------|-------------|
  | C, D    | 4  | 0.20       | 0.17       | II → II (no change) |
  | F       | 1  | 0.01       | 0.00       | III → III (no change) |
  | I       | 1  | 0.01       | 0.00       | III → III (no change) |  
  - **No tier changes**: Threshold at s=3 excludes F/I; linear scaling preserves ordinal ranking.  
  - **Improvement**: Prevents over-weighting high scores (A/B/E/G drop from w>1.0 to ~0.8–0.9) and mitigates convexity’s harshness at mid-low scores.  

  ---

  ### 5. Marker Critique: M3 (Self-Other Binding)  
  **Problem**:  
  - **Redundant/Smuggling**: M3 conflates social cognition with sentience. Solitary agents (e.g., C) can be sentient without social modulation. It smuggles in "social complexity" as a proxy for subjective depth.  
  - **Damage**: Excludes solitary but sentient organisms (spiders, nematodes) and over-credits social species (bees).  

  **Solution**: **Drop M3** and reweight: M1 still ×3, M2/M4 ×1, max s = 8.  

  **Revised Tier List**:  
  | Profile | s (new) | w (new) | Tier | Change |
  |---------|---------|---------|------|--------|
  | A       | 8       | 0.79    | I    | —      |
  | B       | 7       | 0.60    | I    | —      |
  | C       | 2       | 0.06    | III  | II → III |
  | D       | 4       | 0.25    | II   | —      |
  | E       | 8       | 0.79    | I    | —      |
  | F       | 1       | 0.01    | III  | —      |
  | G       | 7       | 0.60    | I    | —      |
  | H       | 0       | 0.00    | III  | —      |
  | I       | 0       | 0.00    | III  | —      |  

  - **Key Change**: C (spider) drops to Tier III. This better reflects its solitary nature without penalizing sentience potential.  
  - **Improvement**: Focuses on intrinsic markers (valence, compression, persistence), avoiding social bias.  

  ---

  ### 6. Funding Allocation  
  **Principle**: Allocate based on **expected total welfare impact per year**, weighted by:  
  - **Moral weight (w)** × **Number of individuals** × **Welfare gain per individual**.  
  Incorporates scale, moral significance, and tractability.  

  **Allocation**:  
  - **$50,000 to (i) Rodents** (40,000 mice; w=1.49): High weight × large population × proven welfare gains (enrichment reduces stress).  
  - **$30,000 to (ii) Insects** (2M insects; w=1.23 for bees, but most are feeders with lower weight): Scale dominates (even at w=0.01, 2M individuals >> rodents), but gains are modest (husbandry tweaks).  
  - **$20,000 to (iii) Neurotech** (F/G; w=1.23–0.01): Precautionary investment; low current use but high risk if sentient. Funds audit/moratorium to resolve uncertainty.  

  **Driven by**: **Expected welfare impact** under uncertainty. If sentience likelihood for F/G were >50%, neurotech allocation would rise. If insect sentience were disproven, funds would shift to rodents.  

  **Epistemic note**: 20% to neurotech acknowledges the committee’s duty to address novel risks, though evidence is weak.  

