  We are building a decision tree to help students locate their position on the epistemic authority of market prices, starting from the predicament: 
    You hold credence p in a proposition, observe a market price implying credence q ≠ p, and wonder what the gap licenses you to conclude.

  The two theorems in question are:
  1. Aumann's agreement theorem: If two agents have the same prior and their posteriors are common knowledge, then they must have the same posterior.
  2. Milgrom-Stokey no-trade theorem: If two agents have the same prior and common knowledge of rationality and the opportunity to trade, then they will not trade because the opportunity to trade would reveal their private information and adjust the price accordingly.

  The argument that derails the session:
  - Side A: A price you would bet against is evidence that you are wrong because your willingness to trade would reveal your information and move the price before trade occurs (so the market price already incorporates all available information).
  - Side B: Any actual trade proves someone is mistaken (because under common prior and common knowledge of rationality, trade shouldn't occur) and that the market doesn't "have" a credence because the common prior is not well-defined for a heterogeneous crowd.

  We need to break down the assumptions of the theorems and see how relaxing them leads to different positions.

  Brainstorming: Assumption slots and what happens when relaxed

  1. Common Prior (CP):
     - Theorem requires: All agents share the same prior probability distribution over the state space.
     - Relaxation: Priors are not identical but close, or agents have different priors.
     - Consequence: Without CP, disagreement can be due to prior differences, not just information. Trade can occur even if both are rational.

  2. Common Knowledge (CK) of Rationality and Information Structure:
     - Theorem requires: Agents commonly know that they are all Bayesian rational, and they commonly know the information structure (including what others know and that they update rationally).
     - Relaxation: Replace CK with common belief (with high probability) or bounded levels of mutual knowledge.
     - Consequence: Without full CK, agents might not fully incorporate others' information because they aren't sure others are rational or that others know they are rational.

  3. Absence of Non-Epistemic Motives to Trade:
     - Theorem requires: Agents only trade for informational reasons (i.e., to profit from superior information).
     - Relaxation: Agents may trade for liquidity, hedging, regulatory reasons, or other non-informational motives.
     - Consequence: Trade can occur without disagreement about the event (e.g., a hedger trading to reduce risk). Volume does not necessarily indicate disagreement.

  4. Well-Defined Resolution Event:
     - Theorem requires: The event being traded on will be publicly resolved (so that payoffs are clear and the truth is revealed).
     - Relaxation: The event might never be resolved, or resolution is ambiguous.
     - Consequence: Without a clear resolution, there is no way to settle the truth, so beliefs might not converge and trading can persist.

  5. Absence of Feedback (Reflexivity/Performativity):
     - Theorem requires: The market price does not affect the event being traded on.
     - Relaxation: The price can influence the event (e.g., a prediction market that becomes a self-fulfilling prophecy or affects decisions).
     - Consequence: The price is not just tracking the event but also causing it, so the market is not purely informational.

  6. Aggregation of Information:
     - Theorem requires: The market price aggregates all private information (as in efficient market hypothesis).
     - Relaxation: Information aggregation may be imperfect due to noise, friction, or strategic behavior.
     - Consequence: The price may not reflect all available information, leaving room for informed trading.

  7. Market as Having a Credence:
     - The framing assumes that the market price represents a collective credence.
     - Relaxation: The price is an equilibrium outcome of supply and demand, which may reflect factors other than beliefs (e.g., risk aversion, liquidity needs) and thus may not represent a belief state.

  Now, we want to map the logical space and then assign named positions to the leaves. The leaves should include:
  - Full deference: Price is a sufficient statistic for what you should believe (Grossman-Stiglitz: if everyone defers, no one acquires information, so the price becomes uninformative).
  - Conciliationist: Price is like an epistemic peer; split the difference.
  - Steadfast: You may rationally retain p.
  - Gap as evidence of others' irrationality: The gap suggests that other participants are not rational.
  - Deflationary: Prices are not credences at all; they reflect dispositions to trade, not beliefs.
  - Reflexivity/Performativity: The price causes the event, so tracking is the wrong relation.

  Specific cases to be used:
  1. Counterparty obliged to trade (hedger, fund meeting redemptions, dealer): Volume carries no information about beliefs.
  2. Contract with payoff depending on a decision influenced by the price (e.g., a prediction market that influences the event).
  3. You know every other participant's information set is a subset of yours, yet price is q ≠ p.
  4. Market without a publicly observed resolution event.

