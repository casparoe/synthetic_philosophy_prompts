prompt: |-
  I spent thirty-four years in a state water quality lab, mostly chromatography, and retired three winters ago, and like a lot of retired scientists I found I had no idea what to do with my mornings. So I started reading — first philosophy of science, which felt like looking at my own field from the outside, and then, this year, political philosophy, which does not. Rousseau, a book on populism that was recommended to me, bits of Mill. I'm slow at it and I take everything far too literally, which my reading group has learned to tolerate.

  The trouble is that the reading landed right on top of something practical. Our borough has a volunteer panel — five of us, no pay, no staff — and I somehow ended up chairing it. Under a local ordinance, any group that collects enough signatures can get a question put to the whole borough, but the panel has to approve the wording that goes on the ballot and in the mailing, and specifically we rule on whether the group gets to describe its proposal as what the residents want. That last part is the whole job in practice. We get maybe one or two of these a month, more in an election year, and they arrive with cover letters saying the people have spoken, the silent majority is behind this, the community is united, nobody I know supports that. One group last spring turned in about three thousand signatures and it later emerged that a large share were collected at a shopping center two towns over. Another group has a polling firm and a very professional-looking 61 percent. We have two hours per case, no one on the panel has any statistics beyond high school, we have to post a one-page written justification for every ruling, the borough lawyer signs off on legal sufficiency only and never on the framing, and we've now twice been accused in the local paper of being undemocratic ourselves, which stings. So I want a decision procedure I can put in front of four volunteers and actually run: the questions to ask in order, what counts as a sufficient answer to each, at which question the claim dies outright, and at which points the procedure has to stop and hand the thing back to a human because it's a question of values and not of fact. I want it grounded in whatever the political philosophy here actually says — the difference between an aggregate of everyone's preferences and something more like a common interest, the problem of who counts as the people in the first place, whether a majority that isn't asked anything has a will at all, what a petition or a rally can and can't show that a vote or a poll can — but translated, so it survives contact with people who have never read any of it. Tell me which of those distinctions absolutely have to survive the simplification and which I can safely drop, and be straight with me about which steps are judgment calls wearing a procedure's clothes.

  Two more things. First, after a bad month I invented my own little rule, and I'd like you to tell me whether it's sound or whether I've dragged something across from the lab that doesn't belong: a claim only passes if the people making it would accept the identical test applied to the claim their opponents are making. I got that from blinding and pre-registration, from insisting before the run that you'll publish whatever comes out, and I suspect it's a category mistake to apply it to politics. Second, run the procedure on three cases: the bus lane petition with the shopping-center signatures and its cover letter about taking the streets back; the developer-backed housing proposal with its clean poll and its phrase about the community being behind it; and — this is the one I'm braced for — the river restoration panel I set up myself last year, twenty-eight residents picked by lottery who met six weekends and came out unanimous, and whose report opens by stating that this is what the valley wants. If the procedure says I can't let my own report use that line, I want to hear exactly why, and I want to hear what the procedure can never settle for us, however carefully we write it.
reasoning: |-
  Okay, let me start by really understanding what this retired scientist is asking for. They spent decades in a water quality lab, mostly doing chromatography, so they're methodical and used to precise procedures. Now they're chairing a volunteer panel that approves ballot wording, specifically judging if groups can claim their proposal is "what the residents want." The panel has no stats background, limited time, and gets criticized in the press. They need a decision procedure grounded in political philosophy but simplified for practical use. 

  First, I need to unpack the core philosophical tensions they're facing. Rousseau's "general will" versus aggregate preferences is central here. The panel keeps seeing groups conflate signatures or polls with a community's true will. The key is distinguishing between what people say they want (individual preferences) and what might actually serve the common good (if such a thing exists). Mill’s harm principle could help define legitimate boundaries, but the panel can’t play philosopher-king—they just need red flags for misleading claims.

  The user’s self-invented rule about reciprocal testing is fascinating. It’s a direct transplant from lab science: if you wouldn’t accept your own method applied to your opponent’s claim, you’re biased. But politics isn’t a controlled experiment. Still, as a fairness check, it might work. I should validate that instinct while flagging where it strains against political reality.

  Now for the cases. The shopping-center petition is easy: signatures gathered outside the borough fail the "who counts" test. The developer’s 61% poll? Tricky. A single poll is a snapshot, not lasting will—plus, who funded it? Needs deeper scrutiny. But the river panel case… oof. That’s personal. Their own lottery-selected group was unanimous, but is that "the valley wants"? No. Mini-publics inform, but don’t embody the general will. They’ll hate this, but Rousseau would insist: no group speaks for the whole unless everyone engages. 

  What absolutely must survive simplification? Three things: (1) the boundary of the demos (who counts), (2) the difference between preference aggregation and legitimate authority, and (3) the burden of representation (can this group claim to speak for others?). The rest—like whether non-participants have a "will"—can drop for practicality.

  Finally, the procedure’s limits. It can’t resolve values clashes or define "community." Their written justification should name those gaps explicitly. That’s not failure—it’s intellectual honesty. And for their own river report? Brutal truth: unanimity among 28 people doesn’t equal valley-wide will. Suggest softer phrasing like "based on diverse resident input." It stings, but their integrity matters more.
answer: |-
  Based on your background and the panel's constraints, here's a decision procedure grounded in core political philosophy concepts, stripped to operational essentials. It prioritizes **three non-negotiable distinctions** from Rousseau, Mill, and democratic theory that must survive simplification, while identifying judgment points clearly.

  **Core Philosophical Anchors (Must Survive Simplification):**
  1.  **The Demos Boundary (Who is "The People"?):** Rousseau's "sovereign" is defined by a specific community. A claim about "residents" or "the community" must be based *only* on those within the borough's jurisdiction or the proposal's defined scope.
  2.  **Preference Aggregation vs. Claimed Legitimacy:** Hume's Guillotine (is/ought) applied politically. *Facts* about what some people *say* they want (signatures, polls, meetings) are distinct from the *claim* that this represents "what the people want" (implying legitimacy, common will, or authority). Mill emphasizes the "tyranny of the majority" – a majority preference doesn't automatically equate to the morally right or truly "common" good. Rousseau's "General Will" (common good) is radically different from the "Will of All" (sum of private interests).
  3.  **Burden of Representation:** Can *this specific mechanism* (petition, poll, panel) legitimately claim to speak *for the whole*? What voices are missing? This probes the validity of the claim, not just the numbers.

  **The Decision Procedure: A Flowchart of Questions**

  1.  **QUESTION 1: "WHICH PEOPLE?" (The Demos Boundary)**
      *   **Ask:** *Who exactly does the claim ("the people," "residents," "community") refer to? Does the evidence presented (signatures, poll sample, participants) come ONLY from this defined group within the borough?*
      *   **Sufficient Answer:** Clear definition matching the borough/resolution scope (e.g., "registered voters in Anytown Borough"). Verifiable evidence origin (e.g., signatures with borough addresses, poll of borough residents).
      *   **Dies Here? YES.** If evidence significantly comes from outside the defined group (e.g., >5% of signatures from another town, poll includes non-residents), the claim fails. *Philosophy:* Violates the fundamental definition of the sovereign/community.
      *   **Judgment Call:** Minor contamination (<5%) - panel judges if it materially misrepresents. Defining the exact group if ambiguous (e.g., "the valley" - is it just the borough?).

  2.  **QUESTION 2: "WHAT IS THE EVIDENCE, REALLY?" (Preference Aggregation)**
      *   **Ask:** *What specific method was used to gather support? (Petition, poll, meeting, vote). What are its inherent limitations in showing broad community will?*
      *   **Sufficient Answer:** Acknowledgment of the method's limitations:
          *   *Petitions/Rallies:* Show intensity/organization of supporters, *not* majority support or common good. Vulnerable to bias in collection (location, time, collector influence - like the shopping center).
          *   *Polls:* Snapshot of *expressed opinion* at one time. Check: Who paid? Who was sampled? (Random residents? Likely voters? Self-selected?). Margin of error? Question wording? A 61% poll shows *opinion*, not necessarily *will* or *common interest*. "Professional-looking" isn't enough.
          *   *Meetings/Panels (like your river group):* Show the *output of the participants*, valuable for deliberation. **Do not** inherently represent the broader community's will unless designed specifically for representation (e.g., a *large*, truly random citizen's assembly). Unanimity among 28 is powerful *for them*, not proof *the valley* wants it.
      *   **Dies Here? POTENTIALLY.** If the evidence is fundamentally flawed or fraudulent (e.g., proven fake signatures). Otherwise, usually proceeds, but limitations are critical for Q3.
      *   **Judgment Call:** Assessing the *severity* of methodological flaws (e.g., poll bias, petition collection bias). Is the evidence *so* weak it can't support *any* claim?

  3.  **QUESTION 3: "CAN YOU MAKE THE CLAIM?" (Burden of Representation/Legitimacy)**
      *   **Ask:**
          *   *Does the evidence presented (acknowledging its limitations from Q2) actually support the specific claim being made?* (e.g., Does a petition with 5% of voters support "the residents demand..."? Does a poll show "the community is united"?)
          *   *Would applying the* ***Reciprocal Test*** *be fair?* (Your Rule: Would this group accept *this same type/level* of evidence if used by opponents to claim *their* position represented "what the people want"?)
      *   **Sufficient Answer:**
          *   The claim must be proportionate to the evidence. "Significant support" might be okay if evidence shows it; "the people want" or "united community" requires overwhelming, representative evidence (e.g., a large majority in a high-turnout referendum, *not* just a poll or petition).
          *   Applying the Reciprocal Test should feel intuitively fair. If they wouldn't accept a similar poll/petition from opponents as proof of "the people's will," their own claim is suspect.
      *   **Dies Here? YES.** If the claim is vastly disproportionate to the evidence ("united" based on a 61/39 poll? No.). If it fails the Reciprocal Test.
      *   **Judgment Call:** This is the **core judgment call**. It requires weighing the *strength* of the evidence (Q2) against the *strength* of the claim. "Significant support" vs. "majority wants" vs. "community united" are different thresholds. The Reciprocal Test is a crucial fairness screen but involves judgment.

  4.  **QUESTION 4: "THE VALUES CHECK" (Stopping Point)**
      *   **Ask:** *Is the objection now primarily about whether this* ***should*** *be what the people want (values/desirability), not whether the evidence supports the claim that they* ***do*** *want it (factual representation)?*
      *   **Sufficient Answer:** Panel consensus that the debate has shifted from "does this evidence support their claim?" to "is this claim desirable/right/good?".
      *   **Stop Here & Hand Back:** If the panel agrees the core dispute is now about values or the merits of the proposal itself, not the factual accuracy of the representation claim. The procedure cannot resolve values debates. The group can still get their question on the ballot, just *without* the claim that it represents "what the people want."
      *   **Judgment Call:** Distinguishing a challenge to the *evidence for the claim* vs. a challenge to the *underlying values or policy*.

  **Applying the Procedure to Your Cases:**

  1.  **The Bus Lane Petition (Shopping Center Signatures):**
      *   **Q1: Which People?** Claim is about borough residents ("taking *our* streets back"). Evidence: Signatures largely from outside borough. **DIES HERE.** Claim fails. (No need for Q2-Q4). Justification: "The evidence of support was not gathered from the borough residents the claim references."
      *   *Reciprocal Test:* They would likely scream if opponents used out-of-town signatures.

  2.  **Developer-Backed Housing Proposal (61% Poll):**
      *   **Q1: Which People?** Assume poll sampled borough residents. Proceeds.
      *   **Q2: What is the Evidence?** Poll shows expressed opinion. Need to scrutinize: Who paid? (Developer-funded raises bias concern). Exact question wording? Margin of error? Sample size/method? Limitations noted: Snapshot, not permanent will; doesn't prove "community behind it" implies unity.
      *   **Q3: Can They Make the Claim?** Claim: "The community is behind it." A 61% poll (even if clean) shows majority opinion, **not** unity. "The community is behind it" implies near consensus. **Claim Fails.** "Significant support" or "majority support indicated by poll" might pass, but not "community behind it." *Reciprocal Test:* Would they accept a single, opponent-funded poll showing 61% *against* as proof "the community rejects this"? Unlikely.
      *   **Justification:** "While the poll indicates majority support at the time, the claim 'the community is behind it' implies a level of unity not demonstrated by a single poll result within the margin of error and subject to change."

  3.  **Your River Restoration Panel (Unanimous Report):**
      *   **Q1: Which People?** Claim is "the valley wants." Who is "the valley"? If defined as borough residents, and panel was residents, proceed.
      *   **Q2: What is the Evidence?** A deliberative panel of 28 residents, selected by lottery. **Strength:** High-quality deliberation, diverse voices (if lottery worked), unanimous output. **Limitation:** 28 people, no matter how well-selected, cannot statistically represent the entire borough/valley. It shows *informed consensus among participants*, not necessarily the will of *all*. Mini-publics inform & propose, they don't *embody* the general will.
      *   **Q3: Can They Make the Claim?** Claim: "This is what the valley wants." **Claim Fails.** The evidence shows "a representative panel unanimously recommended" or "a citizen panel concluded," **not** what "the valley wants." The latter claims the entire community's will is known and aligned, which 28 people cannot demonstrate, regardless of process. *Reciprocal Test:* If a developer convened a 28-person panel (even by lottery) that unanimously backed a controversial project claiming "the valley wants this," would *you* accept that claim as valid without a vote/referendum? Probably not.
      *   **Justification:** "While the citizen panel process was robust and their recommendation unanimous, the panel size and method, while excellent for deliberation, cannot statistically or democratically support a claim that the entire valley's will is known and unified behind this specific proposal. The claim overstates the representational scope of the evidence." (*This stings, but the procedure is consistent*).
      *   **Alternative:** "The unanimous recommendation of a representative citizen panel suggests this plan has strong potential alignment with community values" - This is a factual claim the evidence *can* support.

  **Your Reciprocal Test Rule: Sound or Category Error?**
  *   **Mostly Sound (and Brilliant in Context):** It's a practical translation of **impartiality** (a core democratic principle) and directly tackles Rousseau's warning about private interests masquerading as the general will. It forces groups to confront the validity of *their own methods* when applied by opponents. It's not a perfect scientific control (politics isn't a lab), but as a *fairness screen* within your specific task (judging representation claims), it's highly valuable and philosophically grounded in equality before the law/rules. **KEEP IT,** especially in Q3.

  **What the Procedure Can Never Settle (However Well-Written):**

  1.  **Defining "The Community":** While Q1 handles jurisdiction, deeper questions about *who constitutes* the relevant community for a specific issue (e.g., future residents, impacted workers from nearby towns?) are often value-laden and political. The procedure relies on the ordinance/scope defined.
  2.  **The "Common Good" vs. Majority Preference:** Your procedure tests the factual basis of a *claim* about support/will. It **cannot** determine if what's supported is *truly* the common good (Rousseau's General Will) or just the will of all (or a majority). That's for the actual vote or broader debate.
  3.  **The Legitimacy of Methods Themselves:** Is a petition *ever* good evidence for "the people want"? How random must a poll be? These are normative debates about democratic theory the procedure simplifies for practicality but doesn't resolve philosophically.
  4.  **Values Conflicts:** As per Q4, when the objection shifts to "but this is *wrong*," the procedure stops. It only judges the factual-representation claim.
  5.  **The Threshold of "Sufficient":** What percentage/evidence level constitutes "significant support" vs. "majority wants"? The procedure flags the distinction and uses the Reciprocal Test, but precise thresholds involve panel judgment (mitigated by the test and justification requirement).

  **In Summary:** This procedure forces groups to define their "people," scrutinizes their evidence *as evidence of the specific claim*, uses your Reciprocal Test as a crucial fairness screen, distinguishes factual representation claims from values disputes, and provides clear failure points (Q1, Q3) and a stop point (Q4). It protects the core philosophical distinctions essential for legitimacy while being operational. Your river report case proves its rigor: good process deserves accurate description, not overclaiming. The sting of being called "undemocratic" is lessened by demonstrating a rigorous, impartial, and philosophically sound method – which this provides. Good luck!
