prompt: |-
  So I'm the newest member of the naming committee at a small atrocity-documentation outfit — six of us, we vote on which words actually go into the annual report, and most years it's uneventful. Our record over the last decade, roughly: the Maravik file, where interior ministry orders to "clear" a religious minority's towns were recovered and about a third of the group died — we called it genocide, no argument. The Okessa lowlands, where there was no state plan at all, just settler militias picking off scattered members of an indigenous group over thirty years for farmland, with the state fully aware and doing nothing — we called it genocide anyway, over two members' objections. The Sarn schools file, where a state removed most of a minority's children to majority-language boarding schools, banned the language in public life and split up families, with almost nobody killed — we called it genocide, on the strength of the Convention's clause about forcibly transferring children plus Lemkin's much broader idea that a coordinated attack on a group's institutions and economic life is the thing itself, not a lesser version of it. The Vess purge, where a regime wiped out an organized political opposition — teachers, union people, party cadres, tens of thousands of them — and we declined, saying the protected groups in the treaty are national, ethnic, racial and religious, and a political movement isn't one of them. The Dala steppe famine, hundreds of thousands dead and heavily concentrated in one ethnic group, but the paperwork showed the state cared about grain quotas and not about the group — we declined, called it a mass atrocity. And the Corvin massacre, a single clearly ethnically-motivated killing of about two thousand people out of a group of three hundred thousand — we declined, on the grounds that the part destroyed wasn't substantial enough to touch the group's survival.

  Thursday we have to rule on the Kirvan valley file and I think I'm the swing vote. A state fighting a separatist insurgency has relocated something like forty percent of the villages of an ethnic group into fenced "protected hamlets," shut their religious schools, barred their language in courts, and demolished maybe thirty shrines and a monastery. Aid convoys have been blocked for months and the documented deaths so far are around eleven or twelve percent of the group's population, almost all of it children and old people from disease and hunger — there have been very few direct executions. Two ministers have said on tape that the group "won't be here in a generation," and an army radio broadcast told villagers to forget their tongue. But here's the wrinkle: households that registered as loyal and supplied militia recruits were exempted from relocation, and their shrines are untouched. The state insists it's fighting armed groups, the diaspora is large and thriving, and the group's total numbers outside the valley are stable. Our resident former prosecutor keeps reading out Article II of the Convention — acts "committed with intent to destroy, in whole or in part, a national, ethnical, racial or religious group, as such," including "deliberately inflicting on the group conditions of life calculated to bring about its physical destruction in whole or in part" — and says the tape plus the blockade settles it. Our historian says the loyalty exemptions prove the selection criterion was allegiance, not identity, so it's Vess all over again. Worth knowing: a chunk of our funding comes from a government that's friendly with the state in the valley, which is not supposed to enter the room but does.

  Can you tell me what we should decide, and give me something I can actually say on Thursday? Specifically: which of our six precedents is the closest analog, what should the report call this — genocide, crimes against humanity, ethnic cleansing, something hedged — and what are the candidate rules our track record is even compatible with? I suspect at least two of them fit every past ruling we've made and then come apart right here, so I'd like you to name those rules, say what each one predicts for Kirvan, and tell me which you'd bet on and why. Then be blunt about what principle we'd be committing ourselves to with either verdict — like, if we go with the loyalty-exemption reasoning, does that quietly undercut Okessa, and if we go structural does Vess become unlivable? Also, one extra fact or one hypothetical future file that would let me tell the competing rules apart before we've locked anything in. Please write the whole thing in American English, and don't bother with a source list or footnotes, I just need the reasoning tight enough that two very stubborn people can't pick it apart.
reasoning: |-
  Okay, the user is on a naming committee for an atrocity-documentation group and needs to decide whether to classify the Kirvan valley situation as genocide. They've provided six past cases to use as precedent, and now they're stuck on this new case where there are loyalty exemptions. 

  First, I need to break down the Kirvan case: forced relocations, cultural suppression, blockade causing deaths (mostly children/elderly), recorded statements about the group disappearing, but exemptions for loyal households. The key tension is between intent to destroy the group versus targeting based on political allegiance.

  Looking at their precedents: 
  - Maravik was clear genocide (state orders, mass deaths). 
  - Okessa (settler violence with state inaction) got called genocide despite objections. 
  - Sarn (forced child transfers) used cultural destruction as genocide. 
  - Vess (political purge) was declined because political groups aren't protected. 
  - Dala (famine without group-targeted intent) wasn't genocide. 
  - Corvin (massacre but small scale) didn't threaten group survival.

  Kirvan seems to blend elements from multiple cases. The loyalty exemption is the biggest wrinkle—it echoes Vess (targeting based on allegiance), but the cultural destruction feels like Sarn. The recorded statements about the group disappearing suggest intent, but the exemptions complicate that intent.

  The user's real challenge is maintaining consistency. If they call this genocide, does that weaken their Vess decision? If they decline, does it undermine Okessa/Sarn? They need rules that can hold across all cases.

  So I should propose two candidate rules: 
  1. **Irreducible Group Identity Rule**: Genocide requires targeting based on immutable characteristics alone (no exemptions for assimilation). This would decline Kirvan (since loyalty matters) but might contradict Okessa (where targeting was identity-based despite state inaction). 
  2. **Structural Integrity Rule**: Genocide is proven by systematic attacks on group foundations (culture, institutions, survival) regardless of carve-outs. This would call Kirvan genocide (like Sarn) but make Vess harder to defend (since political groups could argue similar cultural destruction).

  The Structural Rule seems stronger for Kirvan—the cultural erasure plus the blockade/recordings show intent to destroy the group's existence, even with exemptions. The loyalty test here feels like a tool for eradication, not a true alternative path. 

  For the user's Thursday debate, they should push back on the "it's just Vess" argument: Kirvan's exemptions aren't genuine political alternatives but coercive assimilation. The funding source concern should be named but not centered—stick to the legal/historical merits.

  A hypothetical future case to test the rules: a state systematically dismantles a group's cultural institutions but offers full rights to members who assimilate (no physical killing). The Structural Rule would call this genocide; the Identity Rule might not. Kirvan’s blockade deaths tilt it toward genocide either way.
answer: |-
  Here's your breakdown for Thursday, stripped to legal and logical essentials. I'll give you the verdict I'd push for, the precedents it leans on, the competing rules at play, and what each path commits you to. Write this down verbatim if needed—it's built to withstand scrutiny.

  **The Kirvan Verdict: Call it genocide.**  
  *Closest precedent:* **Sarn** (cultural destruction + child transfer as genocide) and **Okessa** (state-enabled destruction without direct orders). Not Vess—this isn't just targeting disloyal individuals; it's dismantling the group’s cultural and physical foundations, with explicit statements of eradication intent.  

  **Candidate Rules Your Precedents Allow (and How They Split on Kirvan):**  
  1. **The Irreducible Group Identity Rule**  
     - *Definition:* Genocide requires targeting based *solely* on immutable group identity (national, ethnic, racial, religious). If the state permits group members to avoid harm by changing behavior (e.g., pledging loyalty), it’s not genocide—it’s persecution (Vess) or ethnic cleansing.  
     - *Predicts for Kirvan:* **Not genocide.** Loyalty exemptions mean targeting is conditional, not identity-based. Analogizes to Vess (political purge).  
     - *Weakness:* Makes Sarn shaky (were assimilated Indigenous children "exempt"?). Undercuts Okessa (settlers targeted Indigenous people for land—loyalty wasn’t an option).  

  2. **The Structural Integrity Rule**  
     - *Definition:* Genocide occurs when a state systematically attacks a protected group’s capacity to exist *as such*—through physical destruction, cultural erasure, or deliberate conditions threatening survival—regardless of carve-outs. Carve-outs are tools of destruction (divide-and-erase), not counterevidence.  
     - *Predicts for Kirvan:* **Genocide.** Blockade-induced deaths, cultural demolition, recorded genocidal intent, and the loyalty clause is a weaponized exemption (coerced assimilation). Analogizes to Sarn (cultural core attacked) and Okessa (state-enabled destruction).  
     - *Weakness:* Risks overextending to Vess (could argue the purge targeted a group’s "structure," but political groups aren’t protected under the Convention).  

  **Which Rule Wins? Bet on Structural Integrity.**  
  - *Why:* Kirvan’s loyalty exemptions aren’t genuine alternatives—they’re tools to fragment the group and erase identity. Demolishing shrines, banning language, and blocking aid while stating the group "won’t be here" shows intent to destroy the group *as such*. The Convention’s "conditions of life" clause (Article II(c)) covers this: deliberate famine/disease + cultural annihilation = physical destruction in part. The exemptions? A classic tactic to disguise genocidal policy as counterinsurgency.  

  **What Each Verdict Commits You To:**  
  - **Calling it genocide (Structural Integrity):**  
    - *Affirms:* Sarn (cultural attack = genocide) and Okessa (state complicity = genocide).  
    - *Strains:* Vess—but Vess holds because political groups fall outside Convention protection. No slippery slope.  
    - *Silent shift:* Tightens your threshold—requires proof of systematic attack on group foundations (not just killings).  

  - **Declining genocide (Irreducible Identity):**  
    - *Affirms:* Vess (allegiance-based targeting isn’t genocide) and Corvin (scale matters).  
    - *Undercuts:* **Okessa** (settlers targeted Indigenous identity—loyalty wasn’t an escape) and **Sarn** (assimilation was forced, not optional).  
    - *Silent shift:* Lets states "game" genocide law by offering cosmetic exemptions.  

  **The Hypothetical Future File to Test the Rules:**  
  *Scenario:* A state forces religious conversion of a minority group. Those who convert keep property and avoid violence; those who refuse are starved or killed. No explicit "destroy the group" statements.  
  - **Structural Integrity Rule:** Genocide. Forced conversion is cultural destruction + coercive conditions threatening existence.  
  - **Irreducible Identity Rule:** Not genocide. Exemptions exist; targeting is behavioral (resisting conversion).  
  *Use this now:* Ask opponents, "Would conversion-at-gunpoint be genocide under your rule?" If they say no, Kirvan’s loyalty exemptions look even weaker.  

  **What to Say Thursday:**  
  > "This is Sarn meets Okessa. The state isn’t just fighting insurgents—it’s deliberately inflicting conditions to destroy the group *as such*: famine-inducing blockades, razing cultural sites, and banning language, all while admitting the goal is elimination. The loyalty exemptions aren’t a loophole; they’re a tactic to fragment the group and erase identity. If we accept that, we make genocide a checklist game—demolish 30 shrines but spare one for ‘loyalists,’ and suddenly it’s not genocide? That guts Sarn. And if we ignore the tapes and the dead children because a diaspora exists, we betray Okessa. Call it genocide. The Convention’s ‘conditions of life’ clause was written for this."  

  **Blunt Truth:** Funding pressure might be real, but the loyalty exemption is a trap. Vote genocide, or you’ll gut your own precedents.
