  **MINUTES OF THE ORDINARY MEETING OF THE STANDING COMMITTEE ON SELF-REFERENCE**  
  **HELD ON 17 OCTOBER 2024 AT 2:00 PM IN COMMITTEE ROOM G7**  

  **PRESENT:**  
  Professor A. Salmela (Chair)  
  Dr Okonjo-Blythe  
  Mr Raffe  
  Professor Ilse Vantongeren  
  Mr Tew (Clerk)  

  **APOLOGIES FOR ABSENCE:**  
  None  

  ---

  **1. RENEWAL OF CATERING CONTRACT**  
  Moved by Dr Okonjo-Blythe: That the contract with Gourmet Solutions Ltd. be renewed for Hilary Term 2025.  
  The Clerk recorded that the motion was either carried or not carried, and that it was not carried. The Clerk further recorded that the procedural logic did not license the inference that the motion was therefore not carried. Dr Okonjo-Blythe proposed appending the premise that the motion was not self-referential nor concerned a limit-concept. The Chair noted that no criterion for identifying such motions had been established by the committee.  
  *Outcome:* Recording deferred pending development of a classification criterion.  

  **2. SELF-REFERENTIAL CONDITIONAL MOTION**  
  Moved by Professor Ilse Vantongeren: That if this motion is carried, the committee’s annual budget be increased by 10%.  
  The motion was self-referential and recorded as both carried and not carried. Under Section 9 of the procedural code (amended per the Ashgrove Ruling), conditionals with glutted antecedents do not license detachment. Mr Raffe observed that the minutes could now enter both a conditional and its antecedent without entering the consequent, rendering practical action indeterminate absent explicit derivation rules.  
  *Outcome:* Motion recorded as both carried and not carried; consequent not actioned.  

  **3. AMENDMENT TO STANDING ORDERS**  
  Moved by Mr Raffe: That Standing Order 7(b) be amended to define "carried *simpliciter*" (i.e., carried and not not-carried), with the Clerk to apply this predicate to all motions.  
  The Clerk advised that a motion stating "this motion is not carried *simpliciter*" would necessitate recording it as both carried *simpliciter* and not carried *simpliciter*, contravening the committee’s foundational rejection of *ex contradictione quodlibet*.  
  *Outcome:* Amendment tabled indefinitely.  

  **4a. SELF-REFERENTIAL RESOLUTION**  
  Moved by Dr Okonjo-Blythe: That this motion be recorded as carried.  
  *Outcome:* Motion recorded as both carried and not carried per Standing Order 7(b).  

