prompt: |-
  i'm three years into a PhD and my chapter is on gradual replacement — the family of cases where your neurons (or your body, or whatever) get swapped out for functionally identical artificial parts bit by bit and then everyone argues about whether you're still there at the end. my supervisor's line, which I find annoying but probaly right, is that the whole literature contains maybe three genuinely distinct problems wearing a dozen costumes, and that most proposed "new" variants are relabelings of ones that came earlier. I have a conference thing in six weeks and I need to decide which scenarios actually earn a place in the chapter, so I want an outside read.

  Here's the list I've been accumulating, some borrowed, some my own. The target I care about is a specific opponent: a psychological-continuity theorist who is NOT relaxed about branching (so no Parfitian "identity isn't what matters" retreat available to them) and who ALSO insists that continuity has to be realized by the right sort of causal process, not merely by any reliable cause of the later person's psychology. Score each scenario 0–10 for how much argumentative work it does against exactly that opponent — 10 being "this one case could break the view by itself," 0 being "the opponent concedes it in a sentence and loses nothing." Then sort them into tiers, give one line of reasoning per scenario, and — this is the part I actually need — tell me which pairs or clusters are the same case in different clothes, which ones I should cut entirely because they aren't really about identity at all (they're about evidence, or about engineering, or about a confusion I'm not seeing), and where my own two, the shadow-period one and the valence-inversion one, rank relative to the borrowed ones. Don't hedge with "it depends on your intuitions"; commit to the numbers. And if you think my supervisor is wrong and there are more than three distinct problems hiding here, say how many there are and where you'd draw the lines.

  1. neuron by neuron over thirty years, each artificial neuron functionally isomorphic to the one it replaces, subject awake and working and talking the whole time
  2. the same swap compressed into a single afternoon under general anaesthesia — asleep biological, awake synthetic
  3. destructive scan-then-rebuild: the brain is destroyed during the scan and the emulation is spun up afterwards, so there's a stretch where nothing at all is running
  4. non-destructive scan: the original keeps living, the copy is spun up at the same moment, and both go on from there
  5. the swap proceeds a few percent a week and the subject reports each week that colours look faintly wrong, then reports a few weeks later that they look completely normal again
  6. 99% swapped out, but a small subcortical cluster is left biological and never replaced
  7. every replacement is functionally isomorphic but runs about a thousand times faster than the tissue it replaces, so the end state has a mental life a thousand times faster than the world around it
  8. mine: each artificial part is installed alongside its biological original and the two run in parallel, doing the same work in the same head, for a month before the biological one is switched off
  9. the whole body including the peripheral nervous system is replaced, and the brain is left completely untouched
  10. mine: neuron-by-neuron replacement that preserves every memory and disposition but systematically inverts emotional valence — everything formerly loved is now found repulsive and vice versa — with the subject insisting throughout that they feel entirely like themselves
  11. the subject wakes up after a completed swap and reports that they cannot tell from the inside whether they're the original or the copy
  12. a swap where the mapping is permuted: causal roles in the network are preserved exactly, but no neuron is replaced by its own duplicate, only by something occupying the right position in the overall pattern
