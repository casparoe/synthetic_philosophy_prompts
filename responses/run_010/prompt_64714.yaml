  First, I need to unpack Hofstadter's position. The careenium setup shows patterns (simmballs) that aren't just passive epiphenomena - their structural properties (bounciness gradients) actively constrain micro-interactions. This isn't mere re-description because the global pattern changes local causal pathways. The counterfactual matters: if the pattern were different (e.g., wall rigidity altered), the micro-dynamics would diverge despite identical simms. That smells like leverage.

  Now Kim's exclusion argument. Its power against re-description is obvious, but does it touch leverage? The user suspects Kim assumes causes must be distinct events - but leverage cases feature patterns that are the very arrangement of parts. When a lock's shape admits only specific keys, the shape isn't competing with its atoms; it is how those atoms are organized. Kim's premise about "sufficient physical cause" might conflate completeness with exclusivity.

  The identity worry is thorny. If simmballs just are physical patterns, doesn't that dissolve the two-pushers problem? Only if we mistake identity for reduction. The pattern has causal properties its components lack - like how a traffic jam slows cars while no single vehicle does. Hofstadter can maintain that symbols push precisely because they're the dynamic organization.

