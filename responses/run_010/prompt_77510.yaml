  For the short answer, I recall that while related concepts exist (like performative utterances), none perfectly captures this specific displacement effect. The phenomenon seems distinct enough to warrant a new term. 

  Considering whether it's one phenomenon or several: the Rwanda case shows institutional avoidance (c), while the interrogation debate involves dialectical shifting (b). Both share the core displacement but differ in mechanisms. 

  When examining near concepts:
  - Performative language explains the Rwanda case but not the interrogation debates where labeling isn't performed
  - Burden-shifting captures strategic avoidance but not the unnoticed aspect
  - Regulatory avoidance fits institutional contexts but not broader discourse

  The key distinction lies in the unacknowledged nature of the shift. This isn't just strategic behavior - it's a systemic discursive pattern where participants genuinely believe they're debating facts.

  For coining a term, "Consequence-Driven Reclassification" seems apt. It emphasizes how consequences reshape classification itself. A borderline case would be corporate liability debates where consequence-fears are openly discussed rather than masked.

  I conclude this displacement is a necessary feature, not a bug. Action-forcing labels require consequence-sensitivity; the problem arises only when the displacement becomes invisible. The user might be missing how this differs from routine legal interpretation where consequence-awareness is explicit.

  Throughout, I maintain focus on their need for conceptual carving rather than citations, respecting their lawyerly precision while offering philosophical clarity.
answer: |-
  ### 1. **Short Answer**  
  No established name exists for this precise phenomenon. In one sentence: *It is the unacknowledged displacement of factual classification disputes by consequence-based arguments when legal duties attach to labels, where speakers implicitly treat the outcome’s cost as decisive while overtly debating descriptive criteria.*

  ### 2. **One Phenomenon or Several**  
  Your instances exhibit distinct facets of a unified phenomenon:  
  - **Rwanda (1994)** primarily reflects **(c) institutional pathology**: Officials avoided the genocide label *because* its legal trigger (via the Genocide Convention) mandated intervention they rejected. The substitution was strategic and systemic.  
  - **Interrogation debates (2000s)** align with **(b) dialectical shift**: Public discourse fixated on whether labeling techniques as "torture" would eliminate "necessary" options, covertly replacing the factual question ("Does waterboarding cause severe suffering?") with a pragmatic one ("Can we afford to lose this tool?").  
  - **Milder cases (e.g., regulatory definitions)** blend **(a) epistemic burden** (demanding higher proof when stakes rise) and **(d) performative utterance** (applying the label acts as commitment).  

  **Unification**: All are manifestations of **consequence-driven reclassification**—a single phenomenon where *duty-triggering labels convert descriptive disputes into normative negotiations*. The core mechanism is identical: legal consequences distort the classification process by making costs salient. Differences arise from context (e.g., institutional vs. public discourse), not the underlying dynamic.  

  ### 3. **Nearest Concepts**  
  1. **Performative Utterance** (Austin):  
     - *Claims*: Words like "I promise" *do* rather than *describe*.  
     - *Shortfall*: Explains why uttering "genocide" feels like an act (Rwanda), but fails to capture the *factual dispute displacement* in interrogation debates.  

  2. **Burden-Shifting in Legal Argument**:  
     - *Claims*: Parties emphasize consequences to avoid unfavorable classifications.  
     - *Shortfall*: Describes tactics but not the *unnoticed substitution*; lawyers often acknowledge this move explicitly.  

  3. **Normative Entrenchment** (implied in legal theory):  
     - *Claims*: Definitions become rigid once tied to outcomes.  
     - *Shortfall*: Addresses institutional rigidity but not the *dialectical sleight-of-hand* in public debates.  

  4. **Epistemic Trespassing** (adapted from philosophy):  
     - *Claims*: Practical concerns (e.g., "must we act?") invade factual domains.  
     - *Shortfall*: Captures the overreach but not the *systemic invisibility* in your cases.  

  5. **Regulatory Avoidance**:  
     - *Claims*: Actors evade triggers to bypass duties (e.g., not calling employees "full-time" to avoid benefits).  
     - *Shortfall*: Matches Rwanda but not interrogation debates, where speakers *engage* the label to debate consequences.  

  ### 4. **Near Misses**  
  - **Equivocation (legal vs. moral sense)**: Close because both involve definitional tension, but your phenomenon *hides* the switch; speakers don’t acknowledge two meanings exist.  
  - **Strategic over-application**: Near as it exploits labels, but your cases involve *under*-application to *avoid* duties—the inverse motive.  
  - **Ordinary caution about proof**: Similar in raising evidentiary burdens, but your phenomenon *abandons* the factual question; caution still seeks truth.  
  - **Dismissing speakers due to incentives**: Adjacent (e.g., "they call it torture to stop interrogations"), but your focus is on the *argument’s structure*, not speaker credibility.  
  - **Narrow textual construction**: Overlaps (e.g., redefining "genocide" narrowly), but this is a conscious legal technique; your cases involve *unconscious* displacement in public discourse.  

  ### 5. **A Name and Definition**  
  **Term**: **Consequence-Driven Reclassification** (CDR)  
  **Definition**: *The unnoticed substitution of a factual classification dispute (A) with a debate about the practical or normative costs of applying that classification (B), occurring when:*  
  1. *A label carries mandatory legal consequences;*  
  2. *Speakers overtly engage A while implicitly treating B as decisive;*  
  3. *The displacement remains unacknowledged by participants.*  

  **Borderline Case**: A prosecutor arguing a killing was *not* premeditated murder because the mandatory life sentence would be disproportionate. Here, consequence-fear is *explicit*, violating condition (3). CDR requires the shift to be subterranean.  

  ### 6. **Defect or Feature?**  
  This displacement is a **defect** in atrocity-labeling but a **necessary feature** of action-forcing legal systems.  
  - **Why defect?** It corrupts public discourse by detaching language from facts, enabling evasion (Rwanda) and legitimizing harm (interrogations).  
  - **Why necessary?** Legal terms *must* weigh consequences; a "genocide" label untethered from duties would be vacuous. The flaw is not consequence-sensitivity but the *invisibility* of the shift.  
  - **The other answer?** If labeling were purely descriptive (no duties attached), CDR wouldn’t occur—but such labels would lack force. Conversely, if speakers *acknowledged* the consequence-driven shift ("We all agree this is genocide, but we won’t act"), CDR would be honest but politically inert.  

  **Unnoticed Distinction**: You may conflate *avoiding a label due to consequences* (Rwanda) with *redefining the label due to consequences* (interrogations). The former evades duty; the latter corrupts language. Both exhibit CDR, but the latter risks definitional collapse—a nuance often highlighted in literature on "torture" redefinition.
