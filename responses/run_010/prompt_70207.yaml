  For the Unsatisfiable Subset, I'll confirm the user's suspicion: Portfolio Separability, Sequential Consistency, and State-wise Dominance conflict when risk attitude is fundamental. The cheapest surrender is Portfolio Separability, accepting portfolio-dependent evaluations. The most exclusionary requirement is Sequential Consistency as it rules out many popular alternatives like pure maximax/min.

  In Contenders, I'll note standard EU fails Sequential Consistency and Distinctness; risk-weighted EU satisfies Distinctness but may fail Sequential Consistency; ambiguity-sensitive rules are separate modules. The conclusion will emphasize that Sequential Consistency is the toughest filter, and surrendering portfolio independence is the least costly compromise.
answer: |-
  ### 1. Purpose and Scope  
  The rule must guide a deliberating institution (like your foundation) in evaluating irreversible, high-stakes gambles (e.g., endowments, multi-year commitments) *one at a time*, using realistically available information. It must accommodate irreducible disagreements about risk attitude—distinct from disputes over probabilities or outcome valuations—and be codifiable in a governance charter. Candidates are formal theories of rational choice under risk (known probabilities) that output a preference ordering over gambles. We set aside: (a) decisions under ambiguity (unknown/undefined probabilities), treated as a separate module; (b) interpersonal comparisons of welfare; (c) dynamic adjustment of preferences; and (d) portfolio optimization when correlations are precisely known. The focus is on single-gamble evaluation for institutions with vague portfolio awareness.

  ---

  ### 2. The Requirements  

  **Requirement 1: Portfolio Separability (PS)**  
  *Motivation*: Your foundation faces a grant with a 1% chance of losing the entire endowment. A trustee argues this risk is intolerable because the foundation’s *other* obligations (e.g., existing commitments) amplify catastrophe. But if the portfolio is only vaguely known (e.g., future liabilities uncertain), can the rule demand full correlation data?  
  *Excludes*: Rules requiring precise knowledge of the entire risk portfolio (e.g., some versions of mean-variance optimization).  
  *Label*: **Negotiable but expensive**. Surrendering PS forces reliance on crude proxies for portfolio effects (e.g., "never bet >X% of endowment").

  **Requirement 2: Sequential Consistency (SC)**  
  *Motivation*: Suppose trustees reject a single favorable gamble (e.g., 55% chance to double impact, 45% chance to halve it) due to risk aversion. But if offered this identical gamble *repeatedly* over time (e.g., annual opportunities), rejecting all could be irrational—statistically, accepting most is near-certain to improve outcomes. A rule shouldn’t permit exploitation via foreseen sequences ("money pumps").  
  *Excludes*: Rules allowing cycles (A>B>C>A) or persistent rejection of positive expected value gambles in repeated play.  
  *Label*: **Non-negotiable**. Violations imply dynamic irrationality, undermining the rule’s authority.

  **Requirement 3: Statewise Dominance (SD)**  
  *Motivation*: Grant A improves 100K lives if economy grows, 10K if stagnant. Grant B improves 100K if growth, 9K if stagnant. All trustees agree B is inferior—no conceivable state favors it. The rule must forbid choosing A’s dominated counterpart.  
  *Excludes*: Rules violating "if A ≥ B in all states and >B in some, then A > B" (e.g., some regret-based theories).  
  *Label*: **Non-negotiable**. Violating SD defies uncontroversial rationality.

  **Requirement 4: Distinctness from EU (DEU)**  
  *Motivation*: Expected Utility (EU) with a concave utility function models risk aversion as diminishing marginal value (e.g., losing $40M hurts more than gaining it helps). But the cautious trustee insists their fear is *not* about diminishing returns to scale—it’s about catastrophic loss per se. The rule should allow preferences EU can’t capture (e.g., rejecting a gamble EU deems acceptable *solely* due to its loss magnitude, not probability/outcome weight).  
  *Excludes*: EU and its reparameterizations (e.g., "risk-weighted EU" reducible to EU via a transformed utility). Settled by: If preferences satisfy the von Neumann-Morgenstern axioms, they *are* EU.  
  *Label*: **Camp taste (pro-Distinctness)**. EU proponents view DEU as redundant.

  **Requirement 5: Ambiguity Separation (AS)**  
  *Motivation*: Probabilities for a novel grant (e.g., "chance this cure works") may be contested or qualitative. The gambler trustee sees 20% chance, the cautious one sees 5%. The rule must not require resolving this to evaluate *risk* (known probabilities). Handling ambiguity belongs to a separate "uncertainty" module.  
  *Excludes*: Theories conflating risk and ambiguity (e.g., minimax expected utility).  
  *Label*: **Non-negotiable** (for scope). We defined the rule for risk only.

  **Requirement 6: EU Compatibility (EUC)**  
  *Motivation*: EU excels in actuarial domains (e.g., pricing insurance where risks are independent and frequent). A rule shouldn’t forbid EU-compliance when appropriate (e.g., for small, repeatable gambles in a diversified portfolio).  
  *Excludes*: Rules that *never* align with EU (e.g., maximin for all gambles).  
  *Label*: **Negotiable but expensive**. Surrendering EUC risks ignoring proven successes.

  ---

  ### 3. Negotiable, Non-Negotiable, and Camp Taste  
  **Non-negotiable**: Sequential Consistency (SC), Statewise Dominance (SD), Ambiguity Separation (AS). Violating SC permits exploitation; SD is bedrock rationality; AS is scope integrity.  
  **Negotiable but expensive**: Portfolio Separability (PS) and EU Compatibility (EUC). Surrendering PS may force overly conservative heuristics; abandoning EUC isolates the foundation from financial best practices.  
  **Camp taste**: Distinctness from EU (DEU). Proponents see it as essential for capturing "true" risk attitudes; opponents (EU camp) argue it’s illusory—all rational preferences reduce to EU. *Most misfiled*: DEU is often mislabeled non-negotiable by anti-EU camps, but rationality doesn’t demand it. PS is mislabeled non-negotiable by portfolio theorists, but institutions often lack the data.

  ---

  ### 4. The Unsatisfiable Subset  
  Your suspicion is **correct**: No theory treating risk attitude as fundamental (DEU) can jointly satisfy **Portfolio Separability (PS)**, **Sequential Consistency (SC)**, and **Statewise Dominance (SD)**. Here’s why:  
  - **Conflict**: Suppose a gamble G has a small chance of catastrophic loss. A PS-compliant rule might reject G in isolation (due to portfolio-unaware conservatism). But if G is offered repeatedly *and* independently, SC demands accepting most (by law of large numbers). However, if the rule rejects a single G (per PS) yet accepts a series, it violates SD: the series is a composite gamble where, state-by-state, the series outcome is never worse and often better than rejecting all.  
  - **Cheapest surrender**: **Portfolio Separability (PS)**.  
  - **Cost**: You lose the ability to evaluate gambles in strict isolation. The rule must now *simulate* portfolio effects (e.g., "treat this as risking X% of endowment"). This demands crude estimates of total exposure.  
  - **Resulting theory**: Still recognizable (e.g., risk-weighted EU with a portfolio scaling factor). It retains DEU, SC, SD, but PS is weakened to a heuristic.  

  *Why not surrender SC or SD?*  
  - Surrendering SC invites money pumps (trustees could be dynamically coerced into worse outcomes).  
  - Surrendering SD permits choosing strictly inferior options, destroying credibility.  
  PS is the only viable concession.

  ---

  ### 5. The Most Exclusionary Requirement  
  **Sequential Consistency (SC)** eliminates the most candidates. It rules out:  
  - **Pure maximin** (rejects any gamble with a catastrophic loss state, even with 99% chance of massive gain; repeatedly rejecting positive-EV gambles violates SC).  
  - **Extreme risk-seeking rules** (e.g., maximax; accepting all long shots risks ruin in repeated play).  
  - **Some "rank-dependent" theories** if their weighting functions lead to consistent rejection of favorable sequences.  
  **Should you distrust SC?** No. SC is a firewall against dynamic irrationality. Candidates failing it are flawed for an institution facing repeated decisions—like your foundation planning for decades.

  ---

  ### 6. The Contenders Against the List  

  1. **Expected Utility (EU) with concave utility**:  
     - *Fails*: DEU (it *is* EU) and possibly PS (if portfolio size affects utility curvature).  
     - *Satisfies*: SC, SD, AS, EUC.  
     - *Verdict*: Rejected by DEU requirement; doesn’t distinguish risk attitude from outcome scaling.  

  2. **Risk-Weighted EU (e.g., prospect theory’s probability weighting)**:  
     - *Fails*: SC (if weighting leads to rejecting favorable sequences) and PS (if weights depend on portfolio context).  
     - *Satisfies*: DEU (if genuinely non-EU), SD, AS.  
     - *Verdict*: Viable only if SC is enforced via constraints on weighting functions.  

  3. **Maximin / Ambiguity-Sensitive Rules**:  
     - *Fails*: SC (rejects positive-EV gambles), EUC (diverges from EU), AS (designed for ambiguity, not risk).  
     - *Satisfies*: PS (ignores portfolio), SD (if carefully defined).  
     - *Verdict*: Excluded—violates SC and AS scope.  

  **Bottom Line**: A DEU-compliant rule (e.g., risk-weighted EU) with a *constraint* to ensure SC (e.g., "no rejecting gambles with EV > threshold") and a *heuristic* for PS (e.g., "cap loss exposure at Y%") best satisfies your needs. Surrendering strict PS is unavoidable and manageable.
