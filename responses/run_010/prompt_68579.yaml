prompt: |-
  I am in my last year of high school and I am writing an independent research essay on whether the predictive success of a scientific theory is good evidence that the theory is true. I have assembled a list of historical cases and my own verdicts on them, and the verdicts will not settle into anything coherent. I would like to know what principle they add up to, if there is one, and which of them I have to abandon.

  My cases and verdicts:

  1. Fresnel's wave theory of light. It implied a bright spot at the center of the shadow cast by a circular disc, which nobody had expected and which was then observed. Its mechanism was an elastic solid ether filling all of space. Verdict: the theory was substantially right about light, the ether is nothing whatever, and the equations that survived count as a real preservation rather than a coincidence.

  2. The caloric theory of heat. Carnot derived the upper limit on the efficiency of a heat engine by treating heat as a fluid falling from a high temperature to a low one, as water falls through a wheel. That limit is still taught and still exactly right. Verdict: caloric was simply false, nothing about it was preserved, and the theory's success is closer to a miracle than the ether case is. I realize these two verdicts cannot both be right on any obvious criterion. That is one of the places I want pressure applied.

  3. Ptolemy's astronomy. Verdict: not even partly true. Yet the epicycle machinery is arguably still with us, since any periodic motion can be built out of circles on circles, and Ptolemy's tables predicted positions as well as anyone needed. I judge this case far more harshly than Fresnel's, and I cannot say what entitles me to.

  4. Newtonian mechanics. Verdict: genuinely true inside its domain, and it is reasonable to go on believing it there. But an astronomer in 1600 could have said exactly the same thing about epicycles, with the same evidence, and been wrong, and I do not see what entitles me to think my position is different in kind rather than merely later.

  5. Phlogiston. Verdict: wholly false, nothing preserved, and the term failed to refer, so statements made with it were neither true nor false rather than false. However, I also think that "water" as used in 1750 and "water" as used today pick out the same thing, even though everything believed about water changed. I am applying to phlogiston a treatment I refuse to apply to water, and I cannot articulate the difference.

  6. The Bohr atom. It recovered the Balmer wavelengths, and wave mechanics still yields them. But the successor theory does not merely omit definite electron orbits; it rules them out. Verdict: the predictions were preserved, and still this theory seems to me worse off than Fresnel's, not equally well off. I cannot say why.

  7. Electrons and quarks today. Verdict: these refer, and they will survive. But my reason seems to be that our best instruments and our best equations are saturated with them, and in 1887 the best interferometers in the world were saturated with the ether.

  My tentative principle, which does not work: a discarded theory T is partly true just in case, for each of T's successful predictions, there exists a derivation of that prediction within the successor theory S that mentions none of T's abandoned vocabulary. I keep wanting to add a second clause — that the abandoned ontology must not have been load-bearing in T's own derivation, so that if it was mere decoration its loss costs nothing, while if it did the work the preservation is illusory. I suspect this clause is only a way of marking the exam after seeing the answers, and I want to be told so plainly if it is.

  So: give me the principle, or a small number of candidates, stated precisely, and say which of my cases motivates each clause of it. Then tell me what it delivers for three cases I have not listed — Mendel's factors before anyone knew what a gene was made of; the vital force of early nineteenth-century chemistry; and dark matter today. Finally, tell me which of my verdicts must go, and in particular whether I have to surrender the caloric verdict or the ether verdict. I would rather have a simple principle that overturns one of my verdicts than an elaborate one that saves them all, but I want to be shown the trade rather than handed a system that quietly absorbs every case. I am not looking for sources or a reading list, only the principle and its consequences.
reasoning: |-
  Okay, let me tackle this user's problem. They're a high school senior working on an independent research essay about whether predictive success indicates a theory is true. They've listed several historical cases with their verdicts but can't find a coherent principle. Their main issue is inconsistency in how they judge these cases—like why Fresnel's ether is partially true while caloric is completely false, even though both had successful predictions.

  First, I need to understand their core struggle. They want a principle that explains when predictive success means a theory is partly true versus merely coincidental. Their tentative principle involves derivations in successor theories without old vocabulary, but they suspect it's ad hoc. They also mention a clause about whether the abandoned ontology was "load-bearing," which they fear is hindsight bias.

  Looking at their cases, the contradictions stand out. For example, Fresnel's wave theory (case 1) is seen as partially true despite the ether being wrong, while caloric (case 2) is deemed entirely false even though Carnot's efficiency result survives. Similarly, Ptolemy (case 3) is dismissed despite mathematical similarities to Fourier analysis, whereas Newton (case 4) is considered true within its domain. The user admits they judge Ptolemy more harshly without clear reason.

  The user's deeper need might be epistemological clarity. They want to avoid arbitrariness in judging historical theories. They also hint at concerns about their own position—worrying that current theories like electrons (case 7) might be future phlogistons. This touches on scientific realism versus anti-realism debates.

  Now, considering possible principles. Structural realism comes to mind—focusing on mathematical structures over ontologies. But Worrall's version (structure preservation) might not fit caloric. Entity realism (Hacking) emphasizes manipulable entities, which could explain why electrons seem real while ether doesn't. However, caloric's Carnot result is structural, not entity-based. 

  The user's proposed "load-bearing" clause might relate to explanatory irrelevance. If a theory's success depends on its ontology, its falsity undermines the success; if not, the structure can survive. But verifying this without hindsight is tricky. For instance, in Fresnel's case, the ether was integral to his derivations, yet the math survived. This suggests the principle needs refinement.

  Another angle: predictive success as evidence for truth depends on the theory's explanatory coherence and unification. If the theory integrates diverse phenomena, its core is more likely preserved. Newton unified celestial and terrestrial mechanics, so its domain-restricted truth makes sense. Caloric only explained heat flow, not chemical reactions, so its failure was total. But Bohr's atom unified spectral lines but failed elsewhere, so partial credit.

  For the additional cases: Mendel's factors were placeholders for genes, so structural success. Vital force was explanatory but not predictive, so no preservation. Dark matter's predictive success (galactic rotation curves) suggests it's structural; if future physics explains it differently, the math might remain.

  The user must abandon either caloric or ether verdict. If they accept structural preservation, caloric's efficiency limit is preserved mathematically, so it shouldn't be a "miracle." This means revising their caloric verdict. Alternatively, if they emphasize ontology, ether might be seen as less load-bearing than caloric, but that seems arbitrary. 

  Ultimately, a structural principle with an "explanatory neutrality" clause could work: if the math is preserved and the ontology wasn't necessary for the derivation's empirical content. This saves Fresnel (math preserved, ether neutral), caloric (Carnot cycle math preserved), and Ptolemy (math equivalent to Fourier, but lacked unification). Bohr's orbits weren't neutral, so correctly deemed falser. Newton's domain restriction is justified by its unification. Phlogiston fails as it added nothing beyond observations. Water succeeds as its core properties (H₂O) are retained. Electrons survive due to manipulability.

  This approach overturns the caloric verdict—it wasn't a miracle but structural preservation. The user might resist, but it resolves the inconsistency with Fresnel. The key insight is distinguishing mathematical structure from ontological commitments, avoiding hindsight by focusing on whether successors reuse the math directly.
answer: |-
  Here's a precise principle that resolves your inconsistencies, built from your core insight but refined to avoid hindsight bias. The key is distinguishing **structural preservation** from **ontological commitment**, with a test of **explanatory neutrality**:

  ### The Principle: Structural Continuity with Ontological Agnosticism (SCOA)
  A discarded theory *T* is **partially true** if and only if:
  1.  **Structural Preservation:** The mathematical structure (equations, functional relationships) responsible for *T*'s successful predictions is **directly preserved** in successor theory *S*.
  2.  **Explanatory Neutrality:** Within *T*, the *successful predictions could have been derived* without relying on the specific ontological claims later abandoned. The abandoned ontology was not the *unique source* of the predictive structure.

  ### How SCOA Motivates Each Clause & Handles Your Cases
  *   **Clause 1 (Structural Preservation):** Motivated by Fresnel (Maxwell's equations preserve the wave math), Carnot (Thermodynamics preserves the Carnot cycle math), Newton (Relativity preserves Newton's equations at low v/small g), Bohr (Schrödinger equation reproduces Balmer series). Contrasts with Ptolemy (no preserved *specific* equation structure) and Phlogiston (no preserved mathematical structure).
  *   **Clause 2 (Explanatory Neutrality):** Motivated by your "load-bearing" worry. Prevents ad hoc judgments by asking: *Could the predictive structure have been formulated in T without the doomed ontology?* This is a counterfactual test about *T*'s internal logic, not hindsight about *S*.
      *   **Fresnel (Case 1):** **PARTIALLY TRUE.** *Structure:* Wave equations preserved. *Neutrality:* Fresnel *could have* formulated wave propagation mathematically without committing to an *elastic solid* ether (e.g., a generic wave medium). The math didn't *demand* solid ether.
      *   **Caloric (Case 2):** **PARTIALLY TRUE.** *Structure:* Carnot cycle analysis (efficiency limit) preserved in thermodynamics. *Neutrality:* Carnot's derivation of the efficiency limit relied on *conservation* and *fall* (potential difference), not the *specific nature* of caloric fluid. He *could have* framed it as energy conservation/conversion without naming 'caloric'. **You must surrender your "wholly false/miracle" verdict.** Its success wasn't a miracle; the *structure* of the Carnot cycle was correct.
      *   **Ptolemy (Case 3):** **NOT PARTIALLY TRUE.** *Structure:* Fourier series *can* approximate periodic motion, but Ptolemy's *specific* geometric epicyclic machinery (equants, deferents, specific epicycle sizes) is not preserved. No specific *Ptolemaic equation* survives. *Neutrality:* Irrelevant (fails Clause 1). Your harsh verdict stands, justified by lack of preserved *structure*, not just ontology.
      *   **Newton (Case 4):** **PARTIALLY TRUE (Domain-Restricted).** *Structure:* Equations preserved as low-speed/small-gravity limit of relativity. *Neutrality:* Newton's laws *could* be formulated without commitment to absolute space/time (as Galilean relativity shows). The math didn't *demand* absolute space. Its truth within its domain is reasonable because the *structure* works there.
      *   **Phlogiston (Case 5):** **NOT PARTIALLY TRUE.** *Structure:* No specific mathematical structure preserved. *Neutrality:* Phlogiston explanations (e.g., combustion as release) *inherently relied* on the substance ontology. You couldn't derive the observations *without* invoking phlogiston substance. This justifies treating it differently from water, where core *structural* properties (composition H₂O, phase behavior) are preserved. Phlogiston had no preserved structure.
      *   **Bohr Atom (Case 6):** **NOT PARTIALLY TRUE.** *Structure:* Energy levels/wavelengths preserved, but the *specific orbital mechanics* (discrete planetary orbits) is not preserved; it's replaced by probability densities. *Neutrality:* Bohr's derivation *explicitly required* classical orbits + quantum jumps. The orbits weren't decorative; they were central to his derivation of the quantization condition. The structure *was* tied to the ontology.
      *   **Electrons/Quarks (Case 7):** **PROVISIONALLY PARTIALLY TRUE.** *Structure:* SM equations are incredibly successful. *Neutrality:* While we manipulate electrons/quarks, our *theories* define them mathematically. Could the SM structure exist without point-like particle *images*? Possibly (e.g., fields/excitations). But crucially, *no alternative structure exists yet*. SCOA doesn't guarantee survival, but their deep embedding in the *structure* justifies provisional realism *more* than ether, whose structure was preserved *without* the ontology.

  ### SCOA on Your Additional Cases
  1.  **Mendel's Factors:** **PARTIALLY TRUE.** *Structure:* The mathematical laws of segregation/independent assortment are preserved. *Neutrality:* Mendel derived his ratios purely from abstract "factors" and their behavior, without committing to their physical nature (DNA, proteins, etc.). The ontology was neutral.
  2.  **Vital Force:** **NOT PARTIALLY TRUE.** *Structure:* No specific mathematical structure responsible for predictive success was preserved. Vital force was an *explanatory placeholder*, not a source of quantitative predictions. *Neutrality:* Failed explanations (e.g., organic synthesis requires vital force) inherently relied on the ontology.
  3.  **Dark Matter:** **PROVISIONALLY PARTIALLY TRUE.** *Structure:* The inferred gravitational potential/distribution needed to explain galactic rotation, cluster dynamics, lensing, etc., is a preserved mathematical structure within GR. *Neutrality:* The success relies on *gravitational effects* of *some* unseen mass. The specific *nature* of that mass (WIMPs, axions, MOND, etc.) is currently irrelevant to the *structure* of the gravitational solution. The ontology is neutral *within the framework generating the predictions* (GR + missing mass).

  ### Which Verdicts Must Go?
  You **must surrender your verdict on Caloric (Case 2)**. SCOA shows its success wasn't a miracle; the *structural core* of Carnot's analysis was preserved. Carnot derived a truth *about thermodynamic processes* using an ultimately false fluid analogy. The fluid wasn't load-bearing for the *mathematical relationship* he discovered. Your Fresnel verdict is largely consistent with SCOA.

  ### Why SCOA is Better Than Your Tentative Principle
  *   **Avoids Vocabulary Trap:** Focusing on "mentions none of T's abandoned vocabulary" is too linguistic. Ptolemy's epicycles and Fourier series use similar math, but Ptolemy's *specific vocabulary* (deferent, equant) is gone. The key is the *mathematical structure*, not the words. SCOA focuses on equations/relationships.
  *   **Makes "Load-Bearing" Objective:** Your worry about "marking the exam after seeing the answers" is addressed by **Explanatory Neutrality**. It asks a counterfactual *about T itself:* "Could *T* have generated this predictive success without relying *uniquely* on the doomed ontology?" This is judged based on *T*'s own resources and logic. For Caloric, Carnot's core argument (conserved quantity falling through potential) works without "caloric fluid" (it works with energy!). For Phlogiston, the observations *were* explained by release/absorption of phlogiston; it was central.
  *   **Prioritizes Structure:** SCOA explains *why* Fresnel and Carnot get credit (math preserved) while Ptolemy (no specific math preserved) and Phlogiston/Bohr (math tied to doomed ontology) do not. It accepts that successful science often preserves the *mathematical relationships* while radically reinterpreting the *ontology*.
  *   **Handles Domain Restriction:** It naturally accommodates Newton – the structure is preserved *within a well-defined domain*.

  SCOA provides a coherent, non-arbitrary principle grounded in the preservation of mathematical structure and the ontological neutrality of that structure within the original theory. It overturns your "miracle" verdict on Caloric, showing its success was structural, not accidental. This gives you a clear, defensible position: **Predictive success is strong evidence for the truth of the *mathematical structure* underlying the predictions, but not necessarily for the specific ontology used to interpret that structure at the time.**
