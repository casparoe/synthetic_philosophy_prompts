  - **Parts that require bending**:
    - **The notion of "proving" a property about the system within the system**: In software QA, we don't typically have the pipeline run tests on itself in a way that is self-referential. We might have a test that runs the pipeline on some fixed set of example programs, but that doesn't cover the entire set of programs. The formal result requires that the system can represent and reason about its own proofs, which in software might mean that the pipeline can generate and run tests on arbitrary programs (including its own test harness and the meta-test). This level of self-reference is not typical in CI pipelines.
