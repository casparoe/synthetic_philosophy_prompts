    - **The distinction between the system and its metatheory**: In logic, we have a clear separation between the object language and the metalanguage. In software QA, we might have a pipeline that tests another pipeline (layering), but the top-level pipeline is still a program that we run. There is no inherent distinction that forces us to stop at a human level. However, the user notes that in practice, they stop at a pinned dependency or a human. The formal result shows that the loop cannot be closed at all, even in principle, without collapse. But in software, we do close the loop by having multiple layers and then trusting the top layer. The formal result says that if the entire chain were within one system, it would collapse. So the residue is that in software, we break the chain by having an external trusted layer, which the formal system doesn't allow because it requires everything to be inside.

