prompt: |-
  I am a high school senior. For the past four years most of my free time has gone into software: I maintain a project of roughly fifteen thousand lines with a CI pipeline, unit and integration tests, snapshot tests, a type checker, several linters, and one friend who reviews my pull requests. That is the vocabulary I think in — green and red builds, coverage, test oracles, pinned dependencies, static analysis, and the familiar situation in which a test passed only because the test itself was wrong. I have no formal training in logic, though I have read enough popular treatments of Gödel to follow an informal statement of a theorem.

  The position I want translated comes from discussions of self-improving artificial agents. As I understand it, Löb's theorem says that if a formal system can prove, of some statement, that the statement's provability within that system entails its truth, then the system can prove that statement outright — so a consistent system cannot in general establish its own soundness. A consequence is then drawn for agency: a reasoner cannot adopt the standing policy of believing whatever its own reasoning concludes, because full self-trust of that kind collapses into believing everything. Supposedly this also blocks an agent from trusting the conclusions of a smarter successor that it built and endorses; it can approve of the process without being able to take the process's outputs on faith.

  Please restate that line of argument in the vocabulary of software verification and quality assurance, claim by claim, as faithfully as you can manage. Then give me the residue report: which parts map cleanly, which map only after being bent (and how they were bent), and which have no expression at all in my vocabulary. Be strict about not smuggling. If a step only works because you have quietly assumed something my discipline takes for granted — a specification, a human reviewer, a machine independent of the one under test — flag it as an import rather than presenting it as translation.

  Two particular things I want addressed. First, I once shipped a snapshot test whose expected output was regenerated automatically from the code under test, so that it could never fail no matter what the program did; tell me whether that incident is a genuine instance of the formal result or merely sloppy practice borrowing its shape. Second, my discipline's habitual answer to the question of who checks the checker is to add another layer and then stop at something simply trusted — a pinned dependency, a reviewed diff, a person. Tell me whether the obstacle is really about closing that loop, or about something the layered picture cannot even state.

  Finally, I want your judgment: does the residue indicate that my vocabulary is missing something — perhaps any way to talk about a system that carries a representation of its own checking inside itself — or that the philosophical claim is less alarming than it sounds, because the collapse depends on a closure assumption nobody who actually builds software would accept? Which parts of the no-self-trust thesis survive contact with how verification is layered in practice?

  Please push back rather than accommodate me. If I have garbled the theorem, or if the analogy between a proof system's provability predicate and a test suite is loose enough that the exercise cannot be done honestly, say so plainly at the top and tell me what a correct version of my question would look like. I would much rather be told that the translation fails than be handed a tidy mapping that quietly changes the subject.
reasoning: |-
  We are given a request from a high school senior with a strong background in software verification and quality assurance (QA) vocabulary. The user wants a translation of a line of argument about Löb's theorem and its implications for self-trust in AI agents into the software QA vocabulary. We must then provide a residue report, address two specific points, and give a judgment.

  ### Step 1: Understanding the Formal Argument
  The user describes Löb's theorem and its implications as follows:

  1. **Löb's theorem**: In a formal system that can express basic arithmetic, if the system can prove that "if a statement S is provable then S is true" (i.e., `□S → S`), then the system can prove S outright (i.e., `□S` and then `S`). Therefore, a consistent system cannot prove its own soundness (i.e., for every S, if `□S` then S) because that would allow it to prove every statement (by applying the soundness claim to a false statement, leading to inconsistency).

  2. **Consequence for agency**: 
     - A reasoner cannot have a standing policy of believing every statement that it can prove (i.e., if it proves S, then it believes S) because that policy (which is like assuming the system's own soundness) would lead to believing everything (if the system is consistent, this policy cannot be held without collapse).
     - This also blocks an agent from trusting the outputs of a smarter successor that it built and endorses: it can approve of the successor's design (the process) but cannot take the outputs (the conclusions) on faith because that would require the same kind of self-trust that leads to collapse.

  ### Step 2: Translation to Software QA Vocabulary
