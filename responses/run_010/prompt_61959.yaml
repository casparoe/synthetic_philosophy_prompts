  ### Properties of a Metric

  A metric d on a space X is a function d: X × X → [0, ∞) satisfying:
  1. Non-negativity: d(x,y) ≥ 0, and d(x,y)=0 iff x=y.
  2. Symmetry: d(x,y) = d(y,x).
  3. Triangle inequality: d(x,z) ≤ d(x,y) + d(y,z).

