prompt: |-
  I sit on the exhibitions committee of a mid-sized natural history museum, and in eleven months we open a new permanent gallery provisionally titled The Edge of the Living. Its centrepiece is an interactive we are calling the Living Wall: ten specimen pods arranged in a ring, each fitted with a two-position indicator that the visitor throws to green or to grey, after which the pod's panel reveals the answer the museum has endorsed together with a single sentence of explanation. Education staff ran a cardboard prototype with school groups last spring, and the two answers children gave most often were also the two that our draft answer key handles worst. That key currently applies the seven-item checklist already printed in the old hall text — movement, respiration, sensitivity, growth, reproduction, excretion, nutrition — ticking each pod against all seven and greying out anything that misses one. The verdicts it produces have several of us embarrassed, and our science顾问 is close to resigning from the advisory panel over pod five.

  Five pods are the problem, and I would like the memo to take them in turn. (1) A plaque-mounted vial of T4 bacteriophage, billed as the most numerous biological entity on earth: the checklist greys it out for want of independent metabolism or reproduction, but our consultant argues that a phage assessed as a member of a lineage rather than as a particle in a vial is unambiguously alive, and that the pod is quietly teaching visitors to make a category mistake about individuals. (2) A living culture of the slime mould Physarum polycephalum, which the education team is keen on because it negotiates mazes for oat flakes and reorganises after being cut into pieces, and which it is not clear is even one thing. (3) A vial of freeze-dried tardigrades that have sat in tun state since the 1980s and are rehydrated for weekend demonstrations: no detectable metabolism for decades, revival on demand. (4) A working synthetic protocell from a university laboratory across town — fatty-acid vesicles enclosing a self-replicating RNA system that grows and divides reliably, though the lab tells us in confidence that it does not yet accumulate heritable variation, so it splits without evolving. (5) A floor-to-ceiling screen running a simulation in which self-replicating digital creatures compete for a scarce resource, donated and endowed by a technology firm whose communications office has asked in writing that the pod's indicator be hard-wired to green and that the panel copy describe its contents as a living system; our director does not wish to refuse them, and the pod is already fabricated. Separately, and this is what made me distrust the checklist itself rather than merely its application, three different groups last spring asked about mules, which fail the reproduction item outright and are obviously alive; the panel as drafted has no answer, and neither did the docent.

  Please draft the memo I will circulate before the committee's next meeting. I want the bottom line up front: a recommended indicator position and a one-sentence panel gloss for each of the five contested pods, and then a decision rule our curatorial staff can apply to the remaining pods and to whatever turns up next year — a sterile hybrid, an immortal cell line, a synthetic organism announced in the press, an exhibit whose state changes during the gallery's own lifetime. The memo should also say what concept the wall is actually deploying: whether living and not-living is a distinction this museum can honestly endorse as binary, and if not, what the wall should be doing instead, given that most of our visitors are eleven years old and that we have publicly committed to giving them an answer rather than a shrug. Set out the strongest case against your own recommendation — I expect it from the educators, who will argue that a graded or context-sensitive scheme teaches children that scientific categories are matters of taste, and from the development office, who will argue that pod five is not worth a fight with an endowment donor — and tell me how you would answer both in the room. Do not give me references, a bibliography, or a list of people who have written about this; the committee will not read them, and I want the reasoning in the memo's own voice. Mark every place where you are guessing about the biology rather than relying on something settled, since I will send those passages to our consultants. And if you think my framing is confused, or that the task as I have posed it cannot be done well — for instance, if you think a two-position indicator bolted to a wall of this kind is simply the wrong instrument and that no answer key deserves this committee's endorsement — say so plainly at the top of the memo rather than producing the polished document I have asked for.
reasoning: |-
  Okay, the user is part of an exhibitions committee for a natural history museum dealing with a problematic interactive display called the Living Wall. They have five controversial specimen pods where the current binary checklist approach fails, causing scientific and ethical dilemmas. The user needs a memo draft for their committee meeting with clear recommendations, a decision rule for future exhibits, and a philosophical stance on defining life—all while addressing pushback from educators and donors.

  Hmm, the core tension here is between scientific accuracy and visitor experience. The seven-item checklist is too rigid for borderline cases like viruses (pod 1), slime molds (pod 2), cryptobiotic tardigrades (pod 3), protocells (pod 4), and digital life (pod 5). The user hinted at deeper unease when school groups asked about mules—a real-world example exposing the checklist's flaws. 

  First, I need to acknowledge the checklist's failure upfront. It’s reductionist and contradicts common sense (mules!). The museum can’t honestly endorse a binary when even biologists debate these edge cases. But the user’s hands are tied: the exhibit is built, donors are invested, and kids expect answers. So the solution must reframe the wall’s purpose from "judging life" to "exploring gray zones."

  For the pods:  
  - Pod 1 (T4 phage): Gray it out. The consultant’s lineage argument is valid, but the physical exhibit is particles in a vial—a tangible teaching moment about scale/categorization.  
  - Pod 2 (slime mold): Green. It’s a textbook example of emergent complexity; even if "not one thing," its behavior meets most criteria.  
  - Pod 3 (tardigrades): Gray. Tun state is suspended animation, not active life. (But flag to consultants: is metabolism truly undetectable or just minimal?)  
  - Pod 4 (protocell): Gray. No heritable variation = no evolution, a key life feature.  
  - Pod 5 (digital sim): Gray. Donor pressure is real, but calling this "life" undermines scientific integrity. Compromise by praising its lifelike *behavior*.  

  The decision rule? Shift from checkboxes to three questions: persistence, adaptation, and lineage. This covers hybrids, immortal cells, etc., without false binaries.  

  Educators will hate this, fearing it teaches relativism. Counter: science *is* about revising categories—see Pluto’s demotion! Donors will threaten funding over pod 5. Counter: "We’ll lose credibility if we call pixels alive; let’s highlight your tech’s innovation instead."  

  Biggest risk: oversimplifying. The memo must stress that the wall isn’t about "right answers" but showing science in flux. For an 11-year-old, that’s more valuable than a flawed checklist.  

  ...Wait, should I question the binary indicator itself? The user invited blunt feedback. But the exhibit is built and time-limited. Practicality wins: retrofit the concept, not the hardware.  

  Final note: mark all tardigrade/protocell assumptions for consultant review. Biology is messy.
answer: |-
  **MEMORANDUM**  
  **TO:** Exhibitions Committee  
  **FROM:** [Your Name/Position]  
  **DATE:** [Current Date]  
  **SUBJECT:** Revised Framework for "The Living Wall" – Recommendations & Decision Rule  

  **Bottom Line Up Front:**  
  The current binary (green/grey) checklist fails scientifically and educationally. **I recommend abandoning it entirely.** The wall’s hardware constrains us, but we can reframe its purpose: *Not to judge "alive/not-alive," but to explore how life blurs at its edges*. Below are pragmatic pod rulings and a flexible decision rule. If the committee insists on binary answers, I cannot endorse any key—the task is scientifically unsound.  

  ---

  ### **Recommended Pod Verdicts & Panel Glosses**  
  *(Green = "Life-Affirming," Grey = "Life-Challenging" – Not Absolute Truths)*  

  1.  **Pod 1 (T4 Bacteriophage):**  
      *   **Indicator:** GREY  
      *   **Panel Gloss:** *"Viruses like T4 have genes and evolve like life, but they need host cells to copy themselves – they don't live independently."*  
      *   *Why:* The vial shows inert particles. While lineages evolve, *this specimen* lacks autonomy. Acknowledging the gray area teaches critical thinking about scale and dependence.  

  2.  **Pod 2 (Physarum Polycephalum Slime Mould):**  
      *   **Indicator:** GREEN  
      *   **Panel Gloss:** *"This slime mold is a giant single cell (or colony of cells) that moves, eats, learns mazes, and heals – showing life isn't always one simple shape."*  
      *   *Why:* Its active, integrated biological processes (metabolism, adaptation, repair) overwhelmingly signal "life," despite ambiguous individuality.  

  3.  **Pod 3 (Freeze-Dried Tardigrades):**  
      *   **Indicator:** GREY  
      *   **Panel Gloss:** *"In 'tun' state, tardigrades pause nearly all life processes. Add water, and they revive – challenging how we define 'alive' right now."*  
      *   *Why:* *These specific specimens* lack detectable metabolism. Revival potential is amazing, but doesn't make the *dormant state* "alive." (***Consultant Check Needed:*** Confirmation that metabolism in tun is truly undetectable vs. minimal.)  

  4.  **Pod 4 (Synthetic Protocell):**  
      *   **Indicator:** GREY  
      *   **Panel Gloss:** *"This lab-made system grows and copies its parts, but doesn't evolve through inheritance yet – a stepping stone toward synthetic life."*  
      *   **Why:** Lacking heritable variation and open-ended evolution, it doesn't meet a key threshold for life as a persistent, adapting lineage. (***Consultant Check Needed:*** Confirmation on the absence of heritable variation in *this specific* system.)  

  5.  **Pod 5 (Digital Creature Simulation):**  
      *   **Indicator:** GREY  
      *   **Panel Gloss:** *"These digital patterns mimic evolution and competition impressively, but they run on computer code and electricity, not biochemistry."*  
      *   **Why:** Granting this "life" devalues the biological essence the wall explores. It's a powerful *analogy*, not biological life.  

  ---

  ### **The Wall's Core Concept**  
  We **cannot honestly endorse a strict binary** of living/non-living. Biology grapples with gradients, context, and definitions (e.g., mules are alive despite sterility). For visitors (especially children), the wall should:  
  1.  **Spark Wonder & Critical Thinking:** Show life's complexities and boundaries as fascinating puzzles, not solved equations.  
  2.  **Highlight Key Concepts:** Focus on processes (metabolism, evolution, information, autonomy, emergence) rather than a rigid checklist.  
  3.  **Be Honest:** State that scientists debate these edges! "We don't all agree, but here's why *this* case is tricky..."  

  **Therefore, the Wall deploys the concept: "Life's Fuzzy Edges."** It explores why categorizing complex phenomena is challenging and dynamic, reflecting real science.  

  ---

  ### **Decision Rule for Future Pods & Edge Cases**  
  **Instead of a checklist, ask 3 core questions about the specimen/system *in its exhibited state*:**  
  1.  **Persistence & Process:** Does it actively maintain itself *now* (e.g., metabolism, repair) or exist in a sustained state (like a seed)?  
  2.  **Adaptation & Lineage:** Does it evolve *as a lineage* through heritable variation and selection? (Crucial for hybrids, synthetic life).  
  3.  **Context & Scale:** Is its "lifeness" dependent on being part of a larger system (like a virus) or a specific environment (like the tardigrade tun)?  

  **Apply the Rule:**  
  *   **Green:** Strong evidence for *both* #1 and #2 *in the exhibited state* (e.g., slime mold).  
  *   **Grey:** Lacks clear evidence for #1 *in the exhibited state* (e.g., tun tardigrade, inert virus) OR lacks #2 entirely (e.g., protocell, digital sim, mule).  
  *   **Panel Gloss:** Explain *why* it's challenging using these concepts (e.g., "Sterile mules maintain themselves and belong to living horse/donkey lineages, but cannot start a new lineage themselves").  

  This rule handles:  
  *   **Sterile Hybrids (Mules):** Grey (Lacks #2). Gloss explains lineage context.  
  *   **Immortal Cell Lines (HeLa):** Green (Strong #1 & #2 via cellular evolution).  
  *   **Future Synthetic Organism:** If it evolves via heritable variation, Green. If not, Grey.  
  *   **Changing State:** Rule applies to the *current state* during viewing. Update gloss if state changes fundamentally later (rare).  

  ---

  ### **Anticipated Objections & Responses**  

  1.  **From Educators:** "A graded/contextual approach teaches kids science is subjective!"  
      *   **Response:** "Science *is* dynamic – definitions evolve with evidence (think planets!). We teach critical thinking by showing *why* categorization is hard, not by giving a false absolute. A rigid checklist failed with mules – *that* confuses kids. Our glosses provide clear reasoning based on core concepts."  

  2.  **From Development (Re: Pod 5):** "Greying out the donor's sim risks the endowment! It's not worth the fight."  
      *   **Response:** "Calling it 'alive' undermines our scientific credibility – the core reason donors support us. We *can* celebrate their innovation enthusiastically: 'This cutting-edge simulation brilliantly mirrors evolution! It helps us explore what makes *biological* life unique.' We offer prominent recognition, but not scientific endorsement it hasn't earned. Losing credibility risks more support long-term than one unhappy donor."  

  ---

  **Final Note:** This approach salvages the existing hardware while making the exhibit scientifically honest, educationally richer, and more engaging. It embraces the complexity hinted at by your prototype's failure with mules and the problematic pods. I urge the committee to adopt it.  

  [Your Name/Position]  
  *(Attn: Consultants - Passages needing biological verification marked with "***Consultant Check Needed***")*
