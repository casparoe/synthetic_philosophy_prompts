  For selection principles: Self-sampling would assign equal probability to each human position, making LONG vastly more likely due to more observers. Self-indication might dampen this by weighting hypotheses by population size. Non-indexical conditioning treats the evidence differently.

  The biological evidence point is crucial: Under LONG, being biological is guaranteed since uploads come later, so it shouldn't update probabilities. But under SHORT, it's also always true. So it might be uninformative.

  My overall credence for <1% on LONG comes to 0.25. The decomposition: 0.85 weight on reference class favoring SHORT under biological-only class, but only 0.5 confidence in that class choice. Selection principles contribute 0.7 toward SHORT. The biological evidence point strongly favors SHORT at 0.9. 

  The gap with the user's friend (0.4 vs 0.85) probably lives in how much weight they give to reference class choice. If they firmly believe biological-only is correct, that pushes toward SHORT.

