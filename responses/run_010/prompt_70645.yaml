prompt: |-
  I've been going back and forth with a friend about a variant of the doomsday argument and I want your actual credence, not a survey of the literature.

  Set-up: exactly one of these is true. SHORT: about 200 billion humans ever live, all of them biological, and we're roughly halfway through. LONG: the same 200 billion biological humans live, and then an upload civilisation runs for a very long time, so that the total number of humans — everyone in the case agrees uploads count as humans — is about 10^20. You learn your birth rank is roughly 120 billion, and you learn that you're biological (you knew that already, but its now part of the stated evidence). Priors 50/50.

  Give me your credence that a fully rational agent holding only this evidence should put less then 1% on LONG, plus the decomposition: how much rides on reference-class choice (all humans versus biological humans only), how much on self-sampling versus self-indication versus full non-indexical conditioning, and how much on whether being told you're biological can carry any likelihood at all here — since under LONG every biological human comes before every upload, so belonging to that subclass looks like a certainty rather than a piece of evidence. A number and one line of justification for each term, then the combination, then which sub-question you'd most want to move. I'm at about 0.4 and she's at 0.85; say where you think that gap actually lives.

  British English please. And at the end, tell me what would change your mind — which argument, if it went through, would flip your verdict, and where you think your own reasoning is weakest.
