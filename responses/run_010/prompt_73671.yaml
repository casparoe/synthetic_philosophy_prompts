  For the disciplinary case, I'll invent a Hong Kong office treating names as rigid designators, causing contractual inconsistencies. The precedent file will include an unresolved query about a novelist, hinting at Russell's famous example.

  The self-undermining ending will have the document issued by a non-unique "Office of General Counsel" and signed by an officer whose title isn't uniquely specified. The humor comes from treating this as a serious compliance issue.

  I'll use a deadpan corporate tone throughout. All examples must be original - no direct quotes from philosophical works. The satire should work for both philosophy novices (who see bureaucratic absurdity) and specialists (who recognize precise semantic handling of rigidity, presupposition failure, etc.).

