prompt: |-
  I do long-horizon forecasting for a living — political stability, big infrastructure, that kind of thing — and I've realized my intuitions about which reference class to use are a total mess. Here are my honest verdicts on a bunch of cases. I want to know whether there's a principle underneath them, and if there isn't, which ones I have to give up.

  1. A friend asks me, half joking, how long their marriage will last. I refuse to answer with the divorce base rate. Not (only) because it's rude — because I genuinely think that number is the wrong number for them. Ask me the same thing about an anonymous row in a dataset and I'll happily give the base rate.

  2. Will this particular tunnel/bridge/rail megaproject come in over budget? I narrow hard: same country, same decade, same procurement type. "Every megaproject ever built" feels like a useless class to me here.

  3. Will a foreign military intervention that started this year achieve its stated aims? I go the other direction and want the widest class I can assemble — every intervention, everywhere, every era. Any narrowing feels like it's just where the cherry-picking happens.

  4. A pharma company says their phase-2 asset is unusual and shouldn't be scored against the phase-2-to-approval rate for its therapeutic area. I don't buy it. They stay in the area-level class.

  5. A founder says don't put me in the all-startups class, put me in the class of startups at my funding stage, in my sector, with my founder history — and I do buy that. Thats structurally identical to 4 as far as I can tell, and I rule differently.

  6. A regime that has already lasted 40 years: I condition on that. The class is "regimes that reached 40," not "all regimes." Same for a marriage already at 20 years. Same for a company with 10 clean years and no product recall — except actually no, for the recall one I want to say the 10 clean years carry no information, because there's no reason the hazard should be falling. I can't say why I flip there.

  7. How long does the current great power's primacy last? I want to say "all hegemons in history," but I would never pool agrarian empires with industrial ones for anything else I forecast, and I can't articulate what's different about this one.

  8. On timing: I think you're supposed to fix the reference class before you look at the case-specific details, blind, so you can't shop for a flattering class. But in case 4 the therapeutic area is only identifiable after a lot of inside-view work on the molecule. So I break my own rule there and feel fine about it.

  9. A class of 3 that matches tightly beats a class of 400 that matches loosely. I also refuse to run a forecast on any class with fewer than about 15 members. I say both of these out loud, in the same meetings.

  The closest thing I have to a principle is: narrow when the narrowing is forced by information you already had before examining the case, widen whenever narrowing amounts to saying this case is special. Please test that against all nine and repair it if it's salvageable, because it clearly doesn't handle 6, 8 or 9.

  What I want back: one account of correct reference-class selection, stated as an actual decision rule rather than vibes, with the clause that does the work in each case flagged; an honest list of which of my verdicts it cannot save and why; and its verdicts on two cases I havent thought about — (a) whether a specific person is alive in 30 years, where the tight class is "people with their exact condition and history" and the loose one is "everyone their age and sex," and (b) whether a brand-new technology with no precedent gets widely adopted within 20 years, where every candidate class is picked by analogy and the analogy is precisely what's in dispute.

  Bottom line in the first sentence — does such a principle exist or not — then the reasoning. No preamble, and don't restate my cases back at me.
reasoning: |-
  Okay, the user works in long-horizon forecasting, dealing with things like political stability and infrastructure projects. They've listed nine cases where their intuition about reference classes varies, and they're confused because they can't find a consistent principle. They want a clear decision rule, an evaluation of their verdicts, and answers to two new cases.

  First, I need to understand their main struggle. They mentioned a principle: narrow when it's based on prior information, widen when narrowing implies the case is special. But this fails in cases 6, 8, and 9. So I need to address those inconsistencies.

  Looking at their cases: 
  1. Marriage vs. anonymous data: They reject base rates for a friend but accept for anonymous data. This might relate to the difference between specific individuals and aggregates.
  2. Megaprojects: They prefer narrow classes. Here, narrowing seems justified by relevant factors like country and decade.
  3. Military interventions: They want the widest class, avoiding cherry-picking. Widening prevents bias in this context.
  4. Pharma: They stick with therapeutic area, not allowing exceptions. The company's claim of uniqueness isn't credible without strong evidence.
  5. Startups: They accept the founder's request for a narrower class. But why is this different from case 4? The founder's specific traits might be more credible predictors.
  6. Regimes and recalls: They condition on survival time for regimes and marriages but not for product recalls. The key might be whether the survival process has constant or changing hazards. If hazards are constant, past survival doesn't affect future risk.
  7. Great powers: They include both agrarian and industrial hegemons but wouldn't mix them otherwise. The defining feature here might be the outcome (primacy duration) being similar across eras despite different mechanisms.
  8. Timing rule: They break the "blind" rule in pharma because therapeutic area requires case details. The decision rule should allow using case-specific info if it's stable and classification-relevant.
  9. Class size: They prefer tight classes of 3 over loose 400 but require at least 15 members. There's a tension between specificity and statistical reliability.

  The user's proposed principle has gaps, especially regarding hazard rates and necessary sample sizes. A better principle might be: Use the narrowest class where (a) the narrowing variables are causally relevant to the outcome, (b) known prior to case examination or classification-stable, (c) the class has sufficient data for reliability, and (d) the hazard function isn't constant (for duration outcomes).

  Testing this against their cases:
  1. For marriage, causal relevance is low for base rates without individual factors. Accepts their verdict.
  2. Megaprojects: Country/decade are causally relevant. Accepts.
  3. Military interventions: Widening avoids irrelevant variables. Accepts.
  4. Pharma: Therapeutic area is causally relevant; uniqueness claim lacks evidence. Accepts.
  5. Startups: Founder history might be causal; more credible than pharma's claim. Accepts their different ruling.
  6. Regimes: Survival suggests changing hazard; recalls' constant hazard makes past survival irrelevant. Explains their flip.
  7. Great powers: Primacy duration's mechanism may transcend era differences; causal relevance to outcome. Accepts their approach.
  8. Pharma class: Therapeutic area is classification-stable, so using case details is okay. Justifies breaking the blind rule.
  9. Class size: Trade-off between specificity and reliability; minimum n avoids noise. Explains their dual statements.

  For new cases:
  (a) Person's survival: Use tight class if condition/history are causal; otherwise, age/sex. Depends on evidence.
  (b) New tech adoption: No ideal class; focus on causal mechanisms via analogs with similar adoption drivers.

  Their verdicts are mostly salvageable except case 6's recall part, which violates the constant hazard principle. The other inconsistencies are resolved with the proposed rule.

  The core principle exists: reference classes should be causally relevant, stable, reliable, and consider hazard constancy. This covers most cases, providing a actionable decision rule.
answer: |-
  **Yes, a salvageable principle exists.** Here it is:

  **Decision Rule:** *Use the narrowest reference class satisfying **all** of:  
  (A) Variables defining the class are **causally relevant** to the outcome (not just correlated).  
  (B) Variables are **classification-stable** (identifiable without knowing case-specific outcome drivers).  
  (C) Class has **sufficient reliability** (N ≥ 15; avoids noise from undersampling).  
  (D) For duration outcomes: **Hazard constancy** fails (i.e., risk changes over time; else conditioning on survival duration is invalid).*  

  **Clause doing the work in each case:**  
  1. *(A)* Base rate lacks causal relevance for *this* couple’s dynamics.  
  2. *(A)* Country/decade/procurement causally affect project risks.  
  3. *(A)* Widening avoids false "causal" variables (e.g., era/country often confounded).  
  4. *(A+B)* Therapeutic area is causally relevant and stable (molecule properties don’t override class identity).  
  5. *(A)* Founder history may be causal (unlike pharma’s vague "unusual" claim).  
  6. *(D)* Regimes/marriages: Hazard not constant (risk decays with time). Recalls: Hazard constant (past survival ≠ future risk).  
  7. *(A)* "Primacy duration" outcome may share causal drivers (e.g., overextension) across eras, overriding technological differences.  
  8. *(B)* Therapeutic area is classification-stable (knowing it doesn’t reveal outcome-specifics).  
  9. *(C)* Minimum N ensures reliability; tight class preferred only if it meets (A)(B)(C).  

  **Verdicts your principle cannot save:**  
  - **Case 6 (recalls):** Your instinct that clean years "carry no information" violates (D). If hazard is constant, conditioning on survival *is* invalid—your verdict is correct, but your stated principle didn’t include hazard constancy.  
  - **Case 9 (class size):** Demanding N≥15 conflicts with preferring a class of 3. The rule resolves this via (C): reject classes <15 regardless of tightness.  

  **New cases:**  
  **(a) Person alive in 30 years:**  
  - Use tight class *only* if condition/history are causally relevant (e.g., genetic disorder with known progression) *(A)* and identifiable without prognosis details *(B)*. Else use age/sex class.  
  **(b) New tech adoption:**  
  - No valid reference class exists (fails B: analogy dispute = unstable classification). Use process-based forecasting (causal drivers of adoption) without a reference class.  

  **Bottom line:** Your intuitions are largely consistent under this rule. The core fix was adding causal relevance (A) and hazard constancy (D), while formalizing stability (B) and reliability (C).
