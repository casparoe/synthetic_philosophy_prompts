  Below is a 10-question sorting quiz designed to categorize students by their instinctive reactions to Moorean-style arguments. Each question uses concrete scenarios with natural language options, avoiding all philosophical jargon. The quiz includes a matched pair (Q5/Q6) to detect sensitivity to voiced vs. unvoiced doubts. The scoring key maps answer combinations to six distinct positions, including the three core stances you identified.  

  ---

  ### **Quiz: How Do You React to Everyday Doubts?**  
  *(Circle one answer per question. No background knowledge needed.)*  

  1. **Party Punch Scenario**:  
     A punch at a party was spiked with something that causes 1 in 50 people to hallucinate their body and surroundings realistically for a day. You don’t know if you’re affected. You look down—your hands are there, and pressing them together feels normal.  
     A. *"I’m definitely not hallucinating—things feel too real."*  
     B. *"I can’t be sure, but I’ll act like everything’s normal."*  
     C. *"This doesn’t change what I think is real right now."*  

  2. **Medical Records Scenario**:  
     Someone you trust completely shows you real-looking medical records proving you’re a brain in a vat (everything you see is fake). Eleven minutes later, they admit it was a hoax. Your hands looked identical the whole time.  
     A. *"At minute one, I doubted my hands; at minute twelve, I was sure again."*  
     B. *"I was sure about my hands the whole time, and I was right to be sure."*  
     C. *"At minute one, I was less sure—that made sense. Now I’m sure again."*  

  3. **Amputation Risk Scenario**:  
     Your left arm is under a blanket. A doctor warned it might have been amputated while you were unconscious. Your right hand is clearly visible.  
     A. *"I can prove the world exists with just my right hand, just as strongly as with both hands."*  
     B. *"I can prove it with my right hand, but it feels less solid than with two hands."*  
     C. *"I can’t prove anything—the doubt about my left arm ruins it."*  

  4. **Prosthetic Hands (Part 1)**:  
     Your hands are prosthetics so advanced they sweat, hurt, and have fingerprints. Someone says, "You don’t really have hands."  
     A. *"They’re wrong—these are my hands, just artificial."*  
     B. *"They’re using ‘hands’ differently—I mean what I use to grip things."*  

  5. **Voiced Dream Doubt**:  
     You say to a friend, "I have two hands." They reply, "What if you’re dreaming? Dreams feel real." You pinch yourself—it hurts.  
     A. *"My friend’s comment makes me less sure, even though I still think I have hands."*  
     B. *"I’m just as sure as before—the dream idea doesn’t bother me."*  
     C. *"I wasn’t sure before, and I’m still not sure."*  

  6. **Unvoiced Dream Doubt**:  
     You think about how dreams feel real, then say to a friend, "I have two hands." You pinch yourself—it hurts.  
     A. *"This makes me less sure, even though I still think I have hands."*  
     B. *"I’m just as sure as before—the dream idea doesn’t bother me."*  
     C. *"I wasn’t sure before, and I’m still not sure."*  

  7. **Hologram Apple Scenario**:  
     You see a red apple. A friend says, "How do you know it’s not a hologram?" You touch it (solid) and bite it (tastes like apple).  
     A. *"I can’t be 100% sure, but it’s probably real."*  
     B. *"This is proof it’s real—a hologram couldn’t do all that."*  
     C. *"I don’t need proof—I’m just sure it’s real."*  

  8. **False Awakening Scenario**:  
     You wake up seeing sunshine. You recall reading about "false awakenings" (dreams of waking up that feel real).  
     A. *"I might be dreaming now, so I’m not completely sure I’m awake."*  
     B. *"I’m sure I’m awake—everything seems normal."*  
     C. *"It doesn’t matter—I’ll act the same either way."*  

  9. **VR Headset Scenario**:  
     After using a hyper-realistic VR headset, you take it off and look at your hands.  
     A. *"Now I’m sure these are my real hands."*  
     B. *"I’m still not totally sure—the VR felt so real."*  
     C. *"I never doubted my hands, even in VR."*  

  10. **Scientist’s Claim Scenario**:  
      A scientist says everything you experience is created by your mind—there’s no external world. You hold up your hands.  
      A. *"My hands are part of the real world, so the scientist is wrong."*  
      B. *"My hands might just be in my mind too, so they don’t prove anything."*  
      C. *"It doesn’t matter—my hands are real to me."*  

  ---

  ### **Scoring Key: Positions and Necessary Answer Patterns**  
  Each position is defined by **necessary conditions** (answers required to qualify). Positions are mutually exclusive. Logically possible but unattractive/unoccupied combinations are noted. The matched pair (Q5/Q6) detects shifts: **"Shifters"** change answers when doubt is voiced aloud; **"Non-shifters"** don’t.  

  1. **Moorean Proof (MP)**  
     *Holds that Moore’s hand-argument is a genuine proof of an external world.*  
     - **Necessary answers**: Q1A, Q2B, Q3A, Q4aA, Q7B, Q10A.  
     - Q5/Q6: **Non-shifter** (B in both).  
     - *Why?* Assumes sensory experience (e.g., "feels real" in Q1, "proof" in Q7) conclusively defeats doubt.  

  2. **Entitled Certainty (EC)**  
     *Holds we’re entitled to be sure of an external world, even if we can’t prove it.*  
     - **Necessary answers**: Q1C, Q2B, Q3A, Q5B, Q6B, Q7C, Q8B.  
     - Q4a: *Not A* (avoids claiming artificial hands are "real" in a biological sense).  
     - *Why?* Doubts are dismissed as irrelevant (Q1C, Q7C), and certainty persists regardless of context (Q2B, Q5/Q6 non-shifting).  

  3. **Contextual Knowability (CK)**  
     *Holds we can know the external world exists, but only in low-stakes/normal conditions.*  
     - **Necessary answers**: Q1B, Q2C, Q7A, Q9A.  
     - Q5/Q6: **Shifter** (A in Q5; B in Q6).  
     - *Why?* Voiced doubt temporarily undermines confidence (Q5A → Q6B), but normal conditions restore it (Q2C, Q9A).  

  4. **Full Skepticism (FS)**  
     *Holds we can’t be sure an external world exists.*  
     - **Necessary answers**: Q1B, Q2A, Q5C, Q6C, Q8A, Q9B.  
     - *Why?* Uniformly suspends judgment across scenarios (Q5C/Q6C, Q9B) and treats doubt as inescapable (Q2A).  

  5. **Linguistic Deflation (LD)**  
     *Holds the debate is verbal (e.g., "hand" or "external world" is misdefined).*  
     - **Necessary answers**: Q4aB, Q4bA, Q10B.  
     - *Why?* Treats disputes as semantic (Q4aB, Q4bA) and rejects "external world" as incoherent (Q10B).  

  6. **Quiet Idealism (QI)**  
     *Holds the external world is mental, so its "nonexistence" isn’t alarming.*  
     - **Necessary answers**: Q4aA, Q4bC, Q10C.  
     - *Why?* Accepts prosthetics as "hands" (Q4aA) but sees no conflict between external objects and mind-dependence (Q4bC, Q10C).  

  ---

  ### **Notes on Design & Edge Cases**  
  - **Matched Pair (Q5/Q6)**: Detects sensitivity to social vs. private doubt.  
    - Shifters (e.g., CK): Only doubt when challenged aloud (A in Q5 → B in Q6).  
    - Non-shifters (e.g., MP/EC): Unaffected by doubt, voiced or not (B in both).  
  - **Logically Possible but Unoccupied Combinations**:  
    - "Q2B + Q5A": Claims unshakeable certainty in medical hoax (Q2B) but wavers when a friend mentions dreaming (Q5A). *Unattractive*: Inconsistent about what triggers doubt.  
    - "Q4bB + Q10B": Asserts external world exists independently (Q4bB) but agrees hands might be "in the mind" (Q10B). *Incoherent*: External world can’t be both mind-independent and mind-dependent.  
  - **Indistinguishable Positions**:  
    - **EC vs. MP** are separated by Q7: EC rejects proof (C), MP requires it (B).  
    - **FS vs. CK** are separated by Q2 and the matched pair: FS has persistent doubt (Q2A, Q5C/Q6C); CK has temporary doubt (Q2C, Q5A→Q6B).  
    - No extra question needed—existing ones suffice.  
  - **Embarrassment Factor**: FS and LD are flagged as "embarrassing" positions students might avoid.  

  This quiz isolates your three target stances (MP, EC, CK) while capturing edge cases. The matched pair and concrete scenarios prevent self-reporting bias. Allow 10–15 minutes for completion. In week six, group students by their results and have them debate—e.g., *"Group 1 (MP): Convince Group 2 (EC) that proofs matter!"*
