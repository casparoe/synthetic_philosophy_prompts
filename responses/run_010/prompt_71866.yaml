prompt: |-
  I'm a handling editor at a middling behavioural science journal. My own background is social psychology — doctorate on attitude change, about six years in this job — and I have no philosophy of science training whatsoever. Maybe once a fortnight a manuscript lands on me where the main explanatory move is evolutionary: some pattern in modern human behaviour gets explained by saying it solved a problem for our ancestors. I don't want to reject these as a class, and I don't want to just pass them to referees with a bland "please assess", because half our referees know the authors and the other half write "this is a just-so story" and refuse to say which step failed.

  So: write me a procedure I can run on such a manuscript in about forty minutes, before I choose between desk rejection, revise-and-resubmit, and sending it out. I want the questions in order, what counts as an adequate answer to each one, and for each failure whether it's fatal, fixable by the authors, or merely something to point the referees at. Ground it in whatever the philosophy of biology has actually worked out about testing adaptation claims — I know there's a literature going back to the spandrels argument in the late seventies and I've never read a word of it, so tell me which of its distinctions matter to a referee and which are purely academic. It has to end in sentences I can paste into a decision letter, since an author is entitled to know which specific test they failed; "your account is post hoc" is not an answer I'm willing to send.

  Then run it on three submissions. One: a cross-national study, roughly 2,400 participants across fourteen countries, of willingness to enter a tournmanet-style pay scheme instead of a piece-rate one; the authors find the sex gap is wider in countries that score higher on gender-equality indices and argue this rules out socialisation accounts, which they say predict the gap should narrow with equality; no other test is offered. Two: a paper claiming nostalgia is an adaptation for holding coalitions together, supported by three experiments — loneliness priming increases nostalgic recall, nostalgic recall increases willingness to help a member of one's own group, and both effects are stronger in people scoring high on a need-to-belong scale; the authors say this shows the mechanism is functionally specific, and the alternatives section notes that cultural transmission was considered, without describing a test of it. Three: a paper arguing that fear of snakes is a dedicated adaptation, on the grounds that snake pictures are detected faster than flowers in visual search, that six-month-olds look longer at snakes paired with a frightened voice, and that lab-raised rhesus monkeys avoid a model snake after watching wild-caught ones react to it. I like the third and I'm suspicious of the first, so I would rather find out now if the procedure says the opposite.

  Tell me where a step is really a judgement call wearing a procedural costume, and where the thing will misfire — I'm specifically worried that it punishes authors who are upfront about speculating and waves through confident ones. Say plainly what it can't do at all. And answer me straight on this: can "just-so story" be operationalised into something a decision letter can actually use, or is it a slur that any rejection will be heard as, in which case I should stop saying it.

  Continuous prose only please, the way you'd write an email — no headings, no bullet points, no bold, no tables. I know a procedure usually wants to be a list, but I dont mind as long as it reads as "first ask whether…, then ask whether…" and I can build the list myself. British English throughout.
reasoning: |-
  Okay, let me start by understanding the user's situation. They're a handling editor at a behavioural science journal with a social psychology background, no formal philosophy of science training. They frequently get manuscripts using evolutionary explanations and struggle to evaluate them efficiently. They want a 40-minute procedure to decide between desk rejection, revise-and-resubmit, or sending for review. The key issues are avoiding "just-so story" criticisms and providing actionable feedback.

  First, I need to recall relevant philosophy of biology concepts. The spandrels paper by Gould and Lewontin is crucial here. It critiques adaptive storytelling without evidence. Key distinctions include adaptation vs. exaptation, the need for multiple lines of evidence, and testing alternatives. Williams' criteria for adaptation—reliability, efficiency, and specificity—are also important. But how to translate these into practical steps for an editor?

  The user mentioned three example papers. Let me break down each one. For the tournament pay scheme study, the authors claim the sex gap widening in gender-equal countries rules out socialization. But is that valid? They might be committing the mistake of reverse prediction. Socialization could still play a role in different ways. The nostalgia paper uses experiments but doesn't test cultural transmission. The snake fear paper has multiple evidence lines but might miss alternative explanations like general threat detection.

  The user is worried about punishing honest speculators while letting confident ones slip through. The procedure needs to check for transparency about speculation versus overconfidence. Also, operationalizing "just-so story" into specific criteria like testability and alternative explanations is key. 

  Steps should flow logically: start with the explanatory target, check if the trait is clearly defined, assess the adaptive problem, evaluate the evidence types (comparative, developmental, etc.), look for alternative explanations, and finally, consider the authors' own critique. Each step needs clear pass/fail criteria and implications for the decision.

  For the examples: Paper 1 fails on multiple evidence types and alternative explanations. Paper 2 has testable mechanisms but lacks cross-cultural tests. Paper 3 has strong evidence but needs to address neural specificity. 

  The user's deeper needs include wanting defensible decisions, avoiding referee biases, and providing authors with clear reasons. They also need to maintain credibility without using jargon. Ensuring the feedback is specific and actionable is crucial. Highlighting where authors can improve versus fatal flaws will help in writing decision letters. 

  Finally, "just-so story" can be operationalized as untestable claims with no evidence beyond correlation. The rejection reasons should specify missing tests or unconsidered alternatives. This moves beyond the slur to constructive feedback.
answer: |-
  Right, let's build you a procedure grounded in the philosophy of biology's critiques of adaptationism – primarily the Williams criteria and Gould/Lewontin's spandrels argument – but filtered for editorial practicality. The core insight is that demonstrating adaptation requires more than a plausible story; it requires evidence that the trait is *specialised* for solving a specific past problem, ruling out non-adaptive alternatives (like by-products, drift, or general learning). We operationalise "just-so story" as *an adaptive claim lacking sufficient evidence for specialisation and/or failing to test plausible alternatives*. The procedure takes about 40 minutes by focusing on key signposts in the manuscript, not re-analysing data.

  **Your Forty-Minute Procedure:**

  First, **identify the claimed adaptation and its proposed function.** Skim the abstract, intro, and discussion for clear statements like "X is an adaptation *for* Y". What specific trait (e.g., fear response, cognitive bias, social preference) and what specific ancestral problem (e.g., predator avoidance, coalition maintenance, mate choice) are proposed? An adequate answer is unambiguous: "Trait X evolved *specifically* to solve Problem Y in Environment E". If it's vague ("evolutionary roots", "shaped by selection") or conflates current utility with past function, that's a red flag but maybe fixable – note it for the authors to clarify. If the *entire argument* hinges on this vagueness and no clear adaptation/function pair is stated, it's likely fatal for an adaptation claim; the paper might be salvageable as a correlational study without the evolutionary framing.

  Second, **assess the evidence for specialisation (Williams' criteria).** Does the paper provide evidence beyond mere correlation that the trait is *reliable, efficient, and specific* for solving the proposed problem? Look for:
  *   **Comparative evidence:** Does it show the trait/problem link is phylogenetically widespread in relevant species or uniquely human *for a reason tied to the problem*? Just showing it exists elsewhere isn't enough; it needs to link to the ecology. Lack isn't fatal alone but weakens the case.
  *   **Developmental evidence:** Is the trait present early (suggesting canalisation) or does it develop reliably in response to relevant cues? (e.g., the snake fear paper using infants/monkeys). Lack is a weakness, not fatal.
  *   **Neurocognitive/Mechanistic evidence:** Is there evidence of a dedicated mechanism? (e.g., specific neural circuitry, cognitive bias *specifically* tuned to the problem). This is strong evidence if present. Lack is common but means the case rests more heavily on other evidence.
  *   **Cost evidence:** Does the paper address costs? Adaptations often carry costs; showing this can support specialisation (e.g., the proposed nostalgia mechanism consuming cognitive resources). Lack is common and usually not fatal, but its presence is a plus.
  *   **Functional efficiency:** Does the paper show the trait *solves the proposed problem effectively* under realistic conditions, or better than plausible alternatives? This is crucial. For Paper 1, does their finding *actually demonstrate* the trait solves an ancestral problem efficiently? Probably not – it's just a modern correlation. Paper 3's visual search speed *suggests* efficiency for threat detection. An adequate answer requires *some* evidence beyond modern correlation suggesting the trait is *well-designed* for the proposed ancestral function. If *all* evidence is modern correlation (like Paper 1), this step fails fatally for an adaptation claim. It becomes merely a hypothesis generator.

  Third, **scrutinise the test against alternatives (The Spandrels Core).** This is the most critical step to avoid "just-so". Does the paper *seriously consider and test* plausible non-adaptive explanations for the trait? Key alternatives:
  *   **By-product/Spandrel:** Is the trait a necessary consequence of other adaptations or general constraints? (e.g., is snake fear a by-product of a general threat-detection system? Is the tournament gap a by-product of evolved risk-aversion interacting with modern socialisation?).
  *   **Phylogenetic inertia/Drift:** Could the trait be a relic without current or past adaptive function, or fixed by chance?
  *   **Cultural transmission/learning:** Can the trait be explained by general social learning mechanisms operating in current environments? (e.g., nostalgia as learned cultural narrative; snake fear learned via observation).
  An adequate answer requires: (a) Stating plausible alternatives relevant to *their specific claim* (not just a token list). (b) Presenting evidence *specifically designed* to rule them out or show the adaptive explanation is superior. "We considered it" without a test (Paper 2) is inadequate. Paper 3 testing lab-raised monkeys attempts to rule out *individual* learning. If the paper fails to identify plausible alternatives or offers no test against them (Papers 1 & 2 largely fail here), the adaptation claim is fundamentally weak. It might be fixable if the authors can propose *post hoc* tests using existing data or suggest crucial future work. If they dismiss alternatives without evidence, it's a serious flaw.

  Fourth, **evaluate the 'Modern = Past Environment' assumption.** Is there any justification for assuming the modern context (where the trait is measured) validly reflects the selective environment? For complex social behaviours (Papers 1 & 2), this is a huge leap. Do they discuss potential mismatches? A lack of discussion is common and a weakness; an outright *reliance* on modern correlational patterns as *direct* evidence for past function (like Paper 1) is usually fatal for a strong adaptation claim.

  Fifth, **check the authors' own assessment.** Do they clearly state the *limitations* of their evidence for adaptation? Do they frame it as strong evidence or cautious speculation? Upfront speculators (if rigorous elsewhere) shouldn't be punished; overconfident ones waving away limitations should be flagged. This step informs your tone, not necessarily the decision.

  **Applying It & Decision Phrases:**

  1.  **Tournament Pay Gap (Paper 1):**
      *   **Adaptation/Function?** Vague. Implied: evolved male competitiveness *for* intra-sexual competition. Unclear trait (competitiveness? Risk preference?) and problem.
      *   **Specialisation Evidence?** None. Only modern correlation (gap vs. GII). No efficiency, development, mechanism, cost, or phylogeny. **Fatal Failure.**
      *   **Test Alternatives?** Claims rule out socialisation, but their logic is flawed (reverse prediction isn't definitive; socialisation explanations *can* predict widening gaps in specific contexts). Ignores by-product (e.g., evolved risk-aversion difference interacting with perceived opportunity) and cultural transmission. **Fatal Failure.**
      *   **Modern=Past?** Entire argument relies on this unsupported assumption. **Fatal Failure.**
      *   **Decision:** Desk reject for overreach. **Letter Phrase:** "While the cross-national finding is interesting, the manuscript's core evolutionary argument – that the observed sex difference in tournament entry directly reflects an evolved adaptation for ancestral intra-sexual competition – lacks the necessary evidence to support a specific adaptation claim. Crucially, the analysis relies entirely on a modern correlational pattern which does not demonstrate the trait's specialisation for an ancestral function (e.g., evidence of efficiency, developmental canalisation, or mechanism) and does not adequately test against plausible alternative explanations, such as the trait being a by-product of other evolved tendencies interacting with contemporary socialisation or cultural factors. The finding stands as a valuable contribution to understanding contemporary economic behaviour, but the evolutionary interpretation requires substantially stronger and more direct evidence linking the behaviour to a specific ancestral selective pressure."

  2.  **Nostalgia for Coalitions (Paper 2):**
      *   **Adaptation/Function?** Clear: Nostalgic recall is an adaptation *specifically for* maintaining coalitional bonds.
      *   **Specialisation Evidence?** Some: Experiments show a functional link (loneliness -> nostalgia -> helping in-group). Need-to-belong moderation *suggests* specificity. Lacks developmental, strong mechanistic (is it *dedicated*?), phylogenetic, or cost evidence. **Weak but not fatal. Adequate for initial review if alternatives addressed.**
      *   **Test Alternatives?** "Considered" cultural transmission but no test described. Major flaw. Cultural transmission (nostalgia as learned cultural script promoting group cohesion) is a very strong alternative. No test against by-product (e.g., of general memory/emotion systems). **Failure – Fixable.** They need to explicitly test this (e.g., cross-cultural variation, experimental manipulation of cultural exposure, showing the effects *require* evolved predispositions beyond learning).
      *   **Modern=Past?** Assumed, but experiments test proximate mechanisms – less critical here than for Paper 1. Acceptable for review.
      *   **Decision:** Revise & Resubmit (likely after review, but flag this upfront). **Letter Phrase:** "The experimental work demonstrating links between loneliness, nostalgic recall, and in-group helping is compelling. However, the claim that nostalgia is a specific *adaptation* for coalition maintenance requires stronger evidence ruling out key non-adaptive alternatives, particularly cultural transmission. While the moderation by need-to-belong is suggestive, it does not definitively rule out nostalgia's effects being primarily learned. To strengthen the adaptation argument, the authors need to directly test the cultural transmission hypothesis (e.g., examining cross-cultural differences in nostalgic content/effects, manipulating exposure to nostalgic narratives, or demonstrating effects in young children prior to extensive cultural learning) and more thoroughly discuss the by-product hypothesis. Please address these points in a revision."

  3.  **Snake Fear (Paper 3):**
      *   **Adaptation/Function?** Clear: Fear of snakes is a dedicated adaptation *for* avoiding snake predation.
      *   **Specialisation Evidence?** Strong: Visual search efficiency (suggests efficiency/specificity), infant attention bias (suggests early emergence), monkey observational learning specific to snakes (suggests prepared learning mechanism, rules out *individual* learning, touches on phylogeny). Lacks direct evidence of cost or *neural* specificity, but overall robust. **Adequate.**
      *   **Test Alternatives?** Implicitly tests individual learning via lab monkeys. Could more explicitly address by-product (e.g., is it a general threat-detection system?) – the visual search *comparison to flowers* is weak here; comparing to other threats (spiders, angry faces) would be stronger. Cultural transmission seems less plausible given infant/monkey data but could be mentioned. **Mostly Adequate, minor weakness.** Acknowledge the by-product alternative more explicitly.
      *   **Modern=Past?** Snake predation was a real past pressure; infant/monkey data mitigate mismatch concerns. Fine.
      *   **Decision:** Send for Review (your instinct confirmed). **Letter Phrase (if needed later):** "The multi-method evidence (visual search, infant looking times, monkey observational learning) provides a strong case for an evolved predisposition for snake detection and fear acquisition. To further solidify the claim of a *dedicated* snake fear adaptation, future work could explicitly compare responses to snakes versus other evolutionarily relevant threats to assess specificity, and explore potential neural correlates. The authors might also briefly acknowledge the by-product hypothesis (e.g., a highly tuned general threat system) as context for their specificity claim." (This is more of a note for reviewers/yourself now; the paper passes the pre-review screen).

  **Where the Judgement Calls Hide & Caveats:**

  1.  **Plausibility of Alternatives (Step 3):** Deciding what counts as a "plausible" alternative is subjective. The procedure demands *relevant* alternatives based on the trait/problem. Err on the side of including obvious ones (cultural transmission for social behaviours, by-product for cognitive traits). The authors being upfront helps, but you still judge if the alternatives they list are *the relevant ones* and if the "tests" are real tests.
  2.  **Sufficiency of Evidence (Step 2):** How much evidence is "enough"? No bright line. The procedure asks for *some evidence beyond modern correlation* suggesting specialisation. One strong line (like Paper 3's infant/monkey data) can suffice for review; multiple weaker lines might also pass. Complete absence (Paper 1) fails. Confidence shouldn't override evidence absence.
  3.  **Punishing Honesty vs. Rewarding Confidence:** A paper honestly stating "this is speculative, evidence for adaptation is currently limited to X" shouldn't fail *if* X meets the bar for initial review (like some evidence in Step 2) and they acknowledge the need for Step 3 tests. A confident paper making strong claims *must* meet Steps 2 & 3 robustly. The procedure targets the *claim strength*, not the honesty level. Judge the evidence, not the tone.
  4.  **What It Can't Do:** It can't assess the *quality* of the underlying methods (e.g., is the visual search task valid?) – that's for reviewers. It can't prove adaptation definitively; it assesses if the evidence presented *meets the minimal bar* for claiming adaptation and avoids "just-so" pitfalls. It won't catch every subtle flaw, but it catches the major structural weaknesses. It can't adjudicate between competing adaptive hypotheses, only between adaptive and non-adaptive explanations.

  **Operationalising "Just-So Story":**

  Yes, "just-so story" *can* be operationalised for decision letters, *if* you avoid the term itself. It means: "An adaptive explanation presented as the primary account despite lacking evidence for specialisation and/or without testing plausible non-adaptive alternatives." The procedure gives you the specific language:

  *   **Failure:** "The evolutionary interpretation relies solely on modern correlation and lacks evidence demonstrating the trait's specialisation for the proposed ancestral function (e.g., efficiency, developmental evidence, mechanism)."
  *   **Failure:** "The claim that [Trait] is an adaptation for [Function] is not sufficiently tested against plausible alternative explanations, such as [Specific Alternative 1] or [Specific Alternative 2]."
  *   **Combined:** "The adaptation claim is not currently supported as it lacks evidence of specialisation and does not adequately rule out non-adaptive alternatives."

  This is specific, points to concrete deficiencies, and avoids the slur. Authors might still *hear* it as rejection, but they'll know *why*. Stop saying "just-so story"; use the specific, procedural reasons above. It makes your decisions more defensible and constructive.
