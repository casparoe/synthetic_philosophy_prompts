prompt: |-
  I work in a small forecasting unit inside a regulator, and there's a pattern I've never been able to put a name to. Some questions we get asked behave: you collect more data, the number tightens, and two analysts who started a mile apart end up roughly together — component failure rates, say, or next year's passenger volumes. Others don't behave like that at all. Ask whether some structure will still be holding in fifteen years and more evidence doesn't tighten anything, the analysts just drift further apart. Yet both kinds go into the same column of the same spreadsheet, so to whoever reads the output they look identical.

  The wierd part, and the one I can't find a word for, is that you can't tell from the inside which sort you're holding. Nothing about how the question is phrased marks out whether more evidence would converge or simply wouldn't help, so we constantly treat the second sort as if it was the first, because the template wants a figure. Related: one colleague will happily give numbers for the first sort and flatly refuses for the second, saying the question isn't the kind of thing that has an answer — and that gets read as him being evasive rather than as a claim about the question itself.

  I know there's talk of risk versus uncertainty and of subjective probability, but neither quite reaches the not-knowing-which-sort-you're-in bit, which is where the damage actually seems to happen. Does either part have an established name? And if the second part doesn't, what would you call it, and how would you keep it apart from ordinary model uncertainty and from plain ignorance? Please answer in British English.
reasoning: |-
  Okay, the user works in a forecasting unit within a regulator and has noticed two distinct patterns in the questions they handle. The first type involves situations where more data leads to converging estimates between analysts, like component failure rates or passenger volumes. The second type, such as predicting structural integrity in 15 years, leads to greater divergence with more data. The key issue is that both types are treated the same in reports, leading to misinterpretation. The colleague who refuses to give numbers for the second type is seen as evasive, not principled.

  The user wants to know if there are established terms for these two categories, especially the second one. They mention risk vs. uncertainty and subjective probability but feel those don't cover the core problem: not knowing which type you're dealing with. They also want to differentiate this from model uncertainty and plain ignorance.

  First, I recall Knightian uncertainty, which distinguishes measurable risk from unmeasurable uncertainty. That fits the second type. But the user's main concern is the inability to identify which category a question falls into. The term "epistemic opacity" comes to mind, meaning you can't tell if an estimate will converge or diverge. 

  For the colleague's refusal to give numbers, "refusal to pseudo-quantify" might work. It emphasizes avoiding false precision. The user needs terms to explain this internally, so clarity is key. They might also need strategies to flag questions with high epistemic opacity in their spreadsheets. Terms like "Type 1/Type 2 questions" or "Convergent/Divergent Evidence Responses" could help, but I should suggest something more descriptive.

  The deeper need here is improving communication and decision-making processes. The user likely faces pressure to produce numbers even when inappropriate, leading to poor decisions. By naming these concepts, they can advocate for better handling of divergent-type questions, perhaps through visual indicators or disclaimers in reports. This addresses the unspoken need to prevent misapplication of convergent methods to inherently uncertain scenarios.
answer: |-
  Your observation captures a profound and under-discussed challenge in forecasting and regulatory practice. You're absolutely right that the distinction lies not just in the *types* of uncertainty, but crucially in the **inability to reliably discern upfront which type you're dealing with**. This is where the damage occurs. Here's how to frame it in established and proposed concepts, using British English:

  1.  **The Two Types: Established Concepts:**
      *   **"Convergent-Type" Questions (Risk/Aleatory Uncertainty):** These involve phenomena governed by stable, underlying processes (like component failure mechanics or predictable travel demand). More data reduces variance and allows analysts to converge. This aligns with **Knightian Risk** or **Aleatory Uncertainty** – uncertainty inherent in random but measurable processes.
      *   **"Divergent-Type" Questions (Knightian Uncertainty/Epistemic Ambiguity):** These involve deep uncertainties: complex systems, long time horizons, unprecedented events, fundamental unknowns (like long-term structural integrity under unknown future stresses or disruptive technological shifts). More data often reveals greater complexity or conflicting interpretations, causing estimates to diverge. This aligns with **Knightian Uncertainty** (Frank Knight) or **Epistemic Uncertainty** (uncertainty due to lack of knowledge). Crucially, this type often involves **"ambiguity"** – where the underlying model or probability distribution itself is unknown or contested.

  2.  **The Core Problem: Inability to Discern the Type Upfront:**
      This is the critical "weird part" you describe – the **epistemic opacity of the question type**. There's no established single term covering *both* the divergent nature *and* the inability to know it applies *until you try* (and often fail) to converge.
      *   **Best Established Fit: Epistemic Ambiguity.** This term emphasises the lack of knowledge about the *structure* of the problem itself (the model, the relevant variables, the probability distribution). It inherently carries the connotation that you don't know *if* or *how* more data will resolve things. It's a step beyond simple ignorance; it's ignorance *about the nature of your ignorance*.
      *   **Proposed Terms for Clarity (if needed internally):**
          *   **"Intractable Model Uncertainty":** Highlights that the uncertainty lies in *which model is even appropriate*, and that this uncertainty cannot be readily resolved.
          *   **"Forecast Convergence Opacity":** Directly names the inability to know if estimates will converge.
          *   **"Type 1/Type 2 Questions":** Simple, internal labels (Convergent Evidence Response / Divergent Evidence Response).

  3.  **Distinguishing from Related Concepts:**
      *   **Ordinary Model Uncertainty:** This usually implies uncertainty *within a known class of models* (e.g., parameters within a chosen structural equation model). You *expect* data to help resolve it. Your divergent type involves uncertainty *about which class of models is even relevant or possible* – a deeper, often intractable level. Call it **"Deep Model Uncertainty"** or **"Fundamental Model Ambiguity"**.
      *   **Plain Ignorance:** This is simply not knowing. Epistemic Ambiguity/Intractable Model Uncertainty is a *specific form* of ignorance characterised by the **inability to structure the problem reliably for quantification** and the **non-convergence of expert judgement with evidence**. It's ignorance that *actively resists* reduction through standard data collection or modelling approaches. Call it **"Structured Ignorance"** (ironically) or **"Quantification-Resistant Ignorance"**.

  4.  **Your Colleague's Position:**
      Your colleague is exhibiting **principled refusal to pseudo-quantify**. They recognise the epistemic ambiguity/intractable model uncertainty inherent in the divergent-type questions. Their stance is based on **epistemic humility** – acknowledging the limits of quantification. Framing it this way ("This question suffers from deep epistemic ambiguity; quantification is misleading") positions it as a property of the *question*, not the *analyst*.

  **Recommendations for Practice:**

  1.  **Introduce Question Typing:** Develop internal criteria (even if imperfect) to flag questions *prone* to divergence *before* analysis starts. Factors: time horizon, system complexity, historical precedent, expert consensus on model structure. Flag them as "High Epistemic Ambiguity" or "Divergent Evidence Type".
  2.  **Visual Differentiation:** Don't put both types in the same spreadsheet column unmarked. Use:
      *   **Confidence Intervals/Ranges (with caveats):** For divergent types, present *very wide* ranges reflecting the fundamental uncertainty. Visually distinguish them (e.g., shaded background, dotted lines).
      *   **Scenario Analysis:** Replace single-point estimates with distinct, plausible scenarios for divergent questions.
      *   **Qualitative Flags:** Add a column for "Uncertainty Characterisation" (e.g., "Quantifiable Risk", "High Epistemic Ambiguity", "Scenario-Dependent").
      *   **Explicit Wording:** Use phrases like "Indicative Estimate Subject to Deep Uncertainty" or "Scenario-Based Projection, Not Probabilistic Forecast".
  3.  **Document Reasoning:** Require analysts to document *why* they believe a question is convergent or divergent, and the nature of the uncertainty. This makes the judgement process transparent.
  4.  **Reframe the Refusal:** Encourage colleagues refusing to quantify divergent questions to articulate it as: *"The structure of this problem (long horizon, unprecedented factors, fundamental unknowns) means it exhibits high epistemic ambiguity. Standard quantification gives a false impression of precision and knowledge we do not possess. Instead, we recommend..."* (followed by scenarios, key risk indicators, qualitative assessment). This shifts the focus to the *question's properties*.

  **In summary:**

  *   **Convergent-Type:** Aleatory Uncertainty / Knightian Risk.
  *   **Divergent-Type:** Knightian Uncertainty / Epistemic Ambiguity / Intractable Model Uncertainty.
  *   **The Core Problem (Not Knowing Which):** **Epistemic Ambiguity** (best established fit) or **Forecast Convergence Opacity** (more descriptive). The key is that Epistemic Ambiguity *implies* the inability to know if quantification is meaningful.
  *   **Colleague's Stance:** Principled refusal to pseudo-quantify based on recognising epistemic ambiguity.
  *   **Distinction:** Deep Model Uncertainty / Fundamental Model Ambiguity vs. simple parameter uncertainty; Quantification-Resistant Ignorance vs. plain ignorance.

  By naming and explicitly managing this distinction – particularly the **epistemic ambiguity** inherent in divergent-type questions and the **opacity** of not knowing upfront – you can significantly improve the integrity of your unit's forecasts and how they are interpreted. It turns an invisible flaw in the process into a manageable, communicable aspect of the work.
