answer: |-
  ### Final Exam Question: Kelly Criterion & Rational Choice

  **Time Allowed:** 45 minutes  
  **Permitted Aids:** Calculator  
  **Not Permitted:** Notes, textbooks, electronic devices other than a calculator.

  ---

  **Question (25 marks total)**  
  Consider a repeated gamble where a fair coin is tossed independently each round. The probability of heads (H) is 0.6, and the probability of tails (T) is 0.4. In each round, an agent may stake a fraction \(f\) (\(0 \leq f \leq 1\)) of their current wealth \(W_t\).  
  - If heads occurs, the agent wins: their wealth becomes \(W_{t+1} = W_t (1 + 2f)\).  
  - If tails occurs, the agent loses: their wealth becomes \(W_{t+1} = W_t (1 - f)\).  
  The agent reinvests their entire wealth in each subsequent round.

  **(a)** (15 marks)  
  (i) Derive the stake \(f^*_{\text{EV}}\) that maximizes the expected wealth after one round.  
  (ii) Derive the stake \(f^*_{\text{Kelly}}\) that maximizes the expected *logarithm* of wealth after one round.  
  (iii) Explain what the divergence between \(f^*_{\text{EV}}\) and \(f^*_{\text{Kelly}}\) reveals about the limitations of expected-value maximization for a single agent experiencing a single, non-replicable sequence of outcomes.  

  **(b)** (10 marks)  
  Consider the following argument:  
  > "Kelly betting maximizes the expected logarithm of wealth. By the strong law of large numbers, the time-average growth rate \(\lim_{T \to \infty} \frac{1}{T} \log \frac{W_T}{W_0}\) converges almost surely to the expected log-return per round. Since the logarithm is a valid von Neumann-Morgenstern utility function, expected utility theory uniquely prescribes Kelly betting as rational."  
  Identify and explain the flaw in this reasoning, even though each premise is technically true.  

  ---

  ### Model Answer (700 words)  
  **Part (a)**  
  **(i)** After one round, the expected wealth is:  
  \[
  \mathbb{E}[W_1] = W_0 \left[ p \cdot (1 + 2f) + (1-p) \cdot (1 - f) \right] = W_0 \left[ 0.6(1 + 2f) + 0.4(1 - f) \right] = W_0 \left[ 1 + 0.8f \right]
  \]  
  This is linear in \(f\). To maximize \(\mathbb{E}[W_1]\), the agent chooses \(f^*_{\text{EV}} = 1\) (full stake), yielding \(\mathbb{E}[W_1] = 1.8W_0\).  

  **(ii)** The expected log-wealth is:  
  \[
  \mathbb{E}[\log W_1] = p \log(1 + 2f) + (1-p) \log(1 - f) = 0.6 \log(1 + 2f) + 0.4 \log(1 - f)
  \]  
  Maximize by differentiating w.r.t. \(f\):  
  \[
  \frac{d}{df} \mathbb{E}[\log W_1] = 0.6 \cdot \frac{2}{1 + 2f} - 0.4 \cdot \frac{1}{1 - f} = \frac{1.2}{1 + 2f} - \frac{0.4}{1 - f}
  \]  
  Set to zero:  
  \[
  \frac{1.2}{1 + 2f} = \frac{0.4}{1 - f} \implies 1.2(1 - f) = 0.4(1 + 2f) \implies 1.2 - 1.2f = 0.4 + 0.8f \implies 0.8 = 2f \implies f^*_{\text{Kelly}} = 0.4
  \]  

  **(iii)** The divergence (\(f^*_{\text{EV}} = 1\) vs. \(f^*_{\text{Kelly}} = 0.4\)) illustrates a core conflict in sequential decision-making under risk. Expected-value maximization (EV) focuses on the *ensemble average*: the mean outcome over infinitely many parallel trials. However, a single agent lives in *one realized trajectory*. With \(f = 1\), a single tail (\(T\)) reduces wealth to \(0\), leading to ruin with probability \((0.4)^T \to 1\) as \(T \to \infty\). Thus, EV maximization guarantees bankruptcy almost surely in the long run. In contrast, \(f^*_{\text{Kelly}}\) maximizes the long-run *geometric growth rate* \(\exp(\mathbb{E}[\log W_1])\), ensuring wealth grows exponentially without ruin. The divergence exposes that EV reasoning is myopic for repeated gambles: optimizing a one-shot expectation ignores path dependency and the multiplicative nature of reinvestment. A single trajectory is dominated by volatility drag (e.g., \(100\% \to 50\% \to 100\%\) nets \(0\%\) growth, not \(25\%\)), making the time-average growth rate (a survival-oriented metric) distinct from the ensemble expectation.  

  ---

  **Part (b)**  
  The argument conflates two distinct roles of the logarithm function, rendering its conclusion invalid.  

  1. **Premises are true**:  
     - Kelly maximizes \(\mathbb{E}[\log W_1]\) per round.  
     - By SLLN, \(\frac{1}{T} \log \frac{W_T}{W_0} \xrightarrow{\text{a.s.}} \mathbb{E}[\log W_1]\) as \(T \to \infty\).  
     - \(u(x) = \log x\) is a valid vNM utility function (concave, increasing).  

  2. **The flaw**: The argument equivocates between:  
     - **Utility-as-objective**: Using \(u(x) = \log x\) to evaluate terminal wealth \(W_T\) in a single decision.  
     - **Utility-as-instrument**: Using \(\log\) as a *tool* to maximize the long-run growth rate.  

     Expected utility theory (EUT) evaluates *terminal wealth* in a static, one-shot gamble. Here, if \(u(W_T) = \log W_T\), EUT would maximize \(\mathbb{E}[\log W_T]\) for fixed \(T\). However, Kelly betting maximizes \(\mathbb{E}[\log W_1]\) *per round* and relies on reinvestment across rounds. The SLLN bridge connects *repeated* myopic log-optimization to asymptotic growth, but EUT applied to the multi-period problem would maximize \(\mathbb{E}[u(W_T)]\) for the *final* wealth distribution. These are not equivalent:  
  \[
  \max_f \mathbb{E}[\log W_T] \neq \max_f \mathbb{E} \left[ \frac{1}{T} \log W_T \right] \quad \text{unless } T=1.
  \]  
     For \(T > 1\), \(\mathbb{E}[\log W_T]\) depends on the joint distribution of all rounds. Myopically optimizing \(\mathbb{E}[\log W_t]\) each round (Kelly) is optimal for the growth rate but *not* for \(\mathbb{E}[\log W_T]\) unless utility is rescaled per round. The argument’s bridge principle ("Kelly maximizes growth, growth is the limit, log is vNM, thus Kelly is vNM-rational") fails because vNM rationality does not prescribe dynamically inconsistent myopic optimization. A vNM agent with \(u(x) = \log x\) would optimize the *expected final log-wealth* \(\mathbb{E}[\log W_T]\) over all feasible strategies, which may differ from myopic Kelly if \(T\) is finite or leverage constraints exist. The almost-sure limit does not imply equivalence for expected utility at finite \(T\).  

  In essence: Kelly is rational *for growth-rate maximization*, but EUT does not mandate it unless the utility function is *defined* as the per-round growth rate—a meta-objective outside vNM’s static framework.  

  ---

  ### Marking Scheme (Total: 25 marks)  
  **Part (a) (15 marks)**  
  - **(i) Expected-wealth stake (3 marks):**  
    - A: Correct derivation (\(f^*_{\text{EV}} = 1\)) with linear expectation (1.5), identifies full stake (1.5).  
    - B: Correct \(f\) but incomplete work (e.g., no derivative or misses linearity).  
  - **(ii) Kelly stake (6 marks):**  
    - A: Correct \(\mathbb{E}[\log W_1]\) (1), derivative (1), solves \(f^*_{\text{Kelly}} = 0.4\) (2), verifies maximum (e.g., second derivative or intuition) (2).  
    - B: Correct setup but algebraic error in solving; or omits verification.  
  - **(iii) Divergence explanation (6 marks):**  
    - A: Contrasts ensemble average (EV) vs. single trajectory (Kelly) (2); explains ruin under \(f=1\) (2); links multiplicative dynamics to volatility drag/growth-rate maximization (2).  
    - B: Identifies bankruptcy risk but vague on trajectory vs. ensemble; or omits reinvestment effects.  

  **Part (b) (10 marks)**  
  - **Flaw identification (8 marks):**  
    - A: Explicitly names equivocation between log-as-utility-for-\(W_T\) vs. log-as-growth-tool (4); explains why \(\max \mathbb{E}[\log W_T] \neq\) myopic Kelly for \(T>1\) (2); notes dynamic inconsistency or finite-\(T\) disjunction (2).  
    - B: States "log utility ≠ growth maximization" but lacks technical precision; or confuses SLLN applicability.  
  - **Clarity (2 marks):**  
    - Logical flow, concision, correct terminology.  

  **Grade Thresholds:**  
  - **A (21–25):** Correct math in (a)(i,ii); precise trajectory/ensemble distinction in (a)(iii); identifies utility equivocation in (b) with vNM–growth decoupling.  
  - **B (16–20):** Minor math errors; vague trajectory/ensemble contrast; identifies (b)’s flaw but incomplete linking to vNM.  
  - **C (10–15):** Major errors in (a)(ii); no ruin discussion; superficial (b) critique.  
  - **D/E (<10):** Incorrect stakes; no comprehension of divergence or flaw.  

  ---  
  This question tests deep integration of probability, utility theory, and asymptotics—key for an advanced seminar. The model answer balances technical rigor with conceptual synthesis, while the marking scheme rewards nuance in decision-theoretic reasoning.
