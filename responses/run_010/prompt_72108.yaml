  ### Node 1: The Split Seed Case
  **Question (Q1):** Consider a variant where your counterpart runs your exact reasoning procedure, but every stochastic component (coin flips, tie-breaks, etc.) is re-rolled independently on their side. Nothing else differs. In this case, would you still cooperate?

  - **Branch A (Yes):** Believes that the symmetry in reasoning is sufficient even with independent randomness.
  - **Branch B (No):** Believes that the correlation must be deterministic or that the randomness breaks the necessary link.

  *Rationale:* This tests whether the superrationality requires determinism in the process or if it can tolerate independent randomness.

  ### Node 2: Asymmetric Payoffs
  **Question (Q2):** Consider a game where both agents reason identically, but the payoffs are asymmetric: if you cooperate, you lose 3 and they gain 10; if they cooperate, they lose 8 and you gain 4. Mutual cooperation is still better than mutual defection for both (though by different margins). Would you cooperate?

  - **Branch A (Yes):** Believes that the symmetry in reasoning is what matters, not the symmetry in payoffs.
  - **Branch B (No):** Requires symmetric payoffs for the superrationality argument to hold.

  *Rationale:* This tests whether the superrationality is robust to payoff asymmetries.

  ### Node 3: Common Knowledge of Reasoning (Glass Skull)
  **Question (Q3):** You have read your counterpart's full specification and can verify that it implements your reasoning exactly. They have read only a two-paragraph summary of yours, accurate but incomplete, and they know that is all they have. Would you cooperate?

  - **Branch A (Yes):** Believes that the exact implementation and your own certainty are sufficient, even without mutual knowledge of the reasoning.
  - **Branch B (No):** Requires mutual knowledge of the reasoning.

  *Rationale:* This probes the level of mutual knowledge required.

  ### Node 4: Oracle and Coin (No Deliberation)
  **Question (Q4):** Your counterpart performs no deliberation. It is a machine that plays whatever a highly accurate predictor of you predicts you will play, and its own payoff is zero in every cell. Would you cooperate?

  - **Branch A (Yes):** Believes that the correlation (via prediction) is enough to justify cooperation.
  - **Branch B (No):** Believes that the counterpart must be an agent with the same reasoning process.

  *Rationale:* This tests whether the superrationality argument extends to cases of pure prediction (like Newcomb's problem).

  ### Node 5: Self-Edit (Modification)
  **Question (Q5):** Before play, you are offered a modification that removes one clause from your reasoning. You are certain that after taking it you will defect, and you are certain your counterpart has already taken the same modification. Would you take the modification?

  - **Branch A (Yes):** Believes that the reasoning process is not sacred and that if both are modified to defect, then defection is the outcome and that's acceptable.
  - **Branch B (No):** Believes that the reasoning process must be fixed and that modifying it is not acceptable, or that cooperation is still the correct outcome even if the modified version defects.

  *Rationale:* This tests the commitment to the reasoning process itself and whether one would change it if it leads to defection.

  ### Node 6: The 999 (Multiple Agents)
  **Question (Q6):** A thousand agents face the game. 999 of them reason as you do; one does not, and everyone knows that this one defects. Would you cooperate?

  - **Branch A (Yes):** Believes that the superrationality applies to the group of similar reasoners and that the one outlier does not break the symmetry for the rest.
  - **Branch B (No):** Believes that the presence of an outlier breaks the symmetry, making defection rational.

  *Rationale:* This tests the robustness to a small number of non-identical agents.

