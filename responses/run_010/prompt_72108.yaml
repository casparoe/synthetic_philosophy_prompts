  **Question (Q9):** Imagine that the payoffs in the game depend on the reasoning process: if both agents use the same reasoning, then mutual cooperation gives both 3; but if they use different reasoning, mutual cooperation gives both 1 (and mutual defection gives 2). Would you cooperate?

