answer: |-
  ## Proof of Intent

  The scan-cert glowed green on Dana’s terminal, a tiny, mocking victory. *Client 4582-B: Claim Denied. Negative intent validation. Funds recovered.* Another soul convinced they’d genuinely meant to climb Everest base camp next Tuesday, conveniently forgetting the crippling agoraphobia documented in their own medical file. Dana sighed, tapping the approval code. Her job at Verity Clearing was sifting through the wreckage of good intentions, paid for by the statistically anomalous few who could actually bind their future selves. She knew the price curves, the actuarial tables mapping human flakiness. Cynicism was her baseline.

  Home was a two-room apartment smelling of antiseptic and simmering lentils. Dana found her mother, Elena, propped awkwardly against pillows, her frail body angled towards the window where dusk painted the city towers in bruised purple. The repositioning alarm on Dana’s wrist chimed softly.

  “Easy, Mamá,” Dana murmured, sliding her arms under Elena’s shoulders and hips. The transfer was practiced, muscle memory honed over three years since the stroke stole Elena’s mobility and most of her speech. A soft groan escaped Elena’s lips. Dana settled her gently, checked the feeding tube port, administered the evening meds – a cocktail holding back pain and seizures. Every four hours. Like clockwork. No margin for error.

  The contract offer pinged on her personal slate later that night, flagged as a Priority Anonymous Bid. Dana frowned. Anonymous deals were rare outside niche markets. The terms were stark: **Counterparty: Undisclosed. Performance Act: Ingestion of compound ‘Thermolysin-7’. Payment: 60,000 Standard Credits. Clearance: Upon verified intent scan (Certified Neuro-Cert required). Performance Window: 24 hours post-clearance.**

  Sixty thousand. A year’s salary, after taxes. Enough to hire round-the-clock care for Mamá for… years. Enough to breathe. Her finger hovered over the compound details. Thermolysin-7: Rapid-onset pyrogenic agent. Effects: Induces sustained hyperthermia (target 40-41°C), profound myalgia, encephalopathy, total incapacitation for approximately 24 hours. Treatment: Supportive care only. Recovery typically complete within 48 hours.

  Total incapacitation. Twenty-four hours. Dana’s gaze flickered to her mother’s room. Every four hours. The math was cruel and absolute. If she took the contract, got scanned and paid tomorrow, and then drank the toxin… Mamá would be alone, unturned, unmedicated, in pain, for a full day. The consequences weren't theoretical; they were urinary tract infections, pressure sores, potentially another stroke. The money was life-changing, but it arrived *before* the act. It couldn’t buy back those lost hours.

  Yet… the scan. If she could just *intend* to drink it tomorrow, truly intend it *now*, the money cleared. Then tomorrow… well, tomorrow she’d have the money, and the vial, and the knowledge of what it would do to Mamá. Could she still drink it? *Would* she?

  ***

  The vial arrived via secure courier the next morning, a small, opaque cylinder nestled in shock-absorbent gel. Dana placed it on her cluttered kitchen counter like a live grenade. She needed air, perspective beyond the apartment’s claustrophobic walls. She met her friend Maya at a bustling street-corner synth-cafe.

  “Sixty *thousand*?” Maya nearly spat out her algae-latte. “Dana, that’s… insane. Take it! Get scanned, get paid, done.”

  “It’s not done,” Dana said, her voice tight. She explained the toxin, the 24-hour wipeout, Elena’s needs. Maya’s expression shifted from excitement to dawning horror.

  “Oh, hell no. Dana, you *can’t*.” Maya leaned forward, her usual sarcasm replaced by urgent practicality. “Look. You get scanned *today*, right? They zap your brain, confirm you *right now* plan to drink that poison *tomorrow*. Fine. Money hits. Great. But *then* you go home. You see Mamá. You see *that*,” she pointed a finger emphatically at Dana’s temple, “little vial on the counter. Tomorrow morning rolls around. What are you thinking?”

  Dana stayed silent, watching the pedestrian traffic blur past.

  “You’re thinking,” Maya continued, hammering it home, “you’ve *got* the money. It’s safe. You don’t *need* to drink the damn thing anymore! Mamá needs you *tomorrow*, not some abstract future. The reasons you have *right now* to avoid drinking it – Mamá suffering, her getting hurt – those reasons will be screamingly obvious *tomorrow morning*, way louder than any promise you made to yourself *today*. How can you *genuinely intend today* to do something tomorrow when you *know*, absolutely *know*, that tomorrow you’ll have the best reasons in the world *not* to do it? It’s… it’s nuts. You’d be lying to the scanner, or lying to yourself.”

  The logic was brutal, everyday, and undeniable. It mirrored a hundred claims she’d denied at Verity. People *thought* they intended, until the future became the present. “So, I shouldn’t take it,” Dana said flatly.

  “Take the scan? If you can somehow *make* yourself believe you’ll do it tomorrow? Maybe. But actually *drink* it? After you have the money? Knowing what it’ll do to her? Never.” Maya shook her head. “The money’s a trap. Walk away.”

  ***

  Dana carried Maya’s words home like lead weights. The vial seemed to pulse on the counter. She called Ben, her oldest friend, a steady presence who worked maintenance at a zero-waste factory. She needed his calm, his different angle.

  “Maya thinks it’s impossible,” Dana summarized, pacing her tiny living room. “That I can’t *really* intend today to drink it tomorrow because I know I’ll chicken out tomorrow once I have the cash and see Mamá.”

  Ben was quiet for a long moment. “Maya’s smart,” he finally said, his voice a low rumble. “She’s usually right about people. But… not everyone’s wired the same, Dana.”

  “Meaning?”

  “Meaning… intention ain’t just *predicting* what you’ll feel later. Sometimes it’s… *deciding* what you’re gonna feel later. Or deciding it don’t matter.” He paused, searching for words. “At the plant, we do lock-out procedures. Super dangerous machinery. You *intend* to lock it out *before* you stick your hand in. You *know*, while you’re walking up to the panel, that once it’s locked, you’ll be safe. The reason to skip the lock-out – save five seconds – will feel real tempting *in the moment*. But you *decide* beforehand. You make the intention solid. Like steel. You don’t *let* the future you talk you out of it. It’s… a discipline. Or maybe,” he added thoughtfully, “some people just *can’t* reconsider, once they’ve set their mind. Like a train on tracks. The reasons change, but the train don’t stop. It *can’t*. Maybe you’re one of those people, Dana. You’ve always been… stubborn. Focused. Maybe you *can* intend it, truly, now. And tomorrow, when every bone screams not to, that intention just… holds. Like a promise welded shut.” He sighed. “Or maybe Maya’s right, and it’s impossible. I don’t know. But I know *you*. If anyone could anchor an intention that hard… maybe it’s you.”

  ***

  The Neuro-Cert clinic was sterile and silent. The technician, impersonal as the machine, guided Dana into the scanner pod. “Clear your mind. Focus solely on the intended act at the specified future time: Ingestion of Thermolysin-7, tomorrow at 10:00 AM.”

  Dana closed her eyes. Sixty thousand. Mamá’s care. Security. *Intend*. She pictured the vial. Pictured lifting it tomorrow. But the image fractured – replaced by Elena’s face, contorted in imagined pain, alone, uncared for. *I know I’ll see that tomorrow. I know I’ll choose her.* How could she intend otherwise *now*? *Ben’s voice: ‘Decide what you’re gonna feel… a train on tracks…’*

  The scanner hummed. Lights cycled. A soft chime. The technician glanced at his readout. “Intent validated. Level 9 certitude. Payment initiating.”

  The credit alert vibrated on Dana’s slate before she even left the clinic. Sixty thousand. Real. Cleared. Her breath hitched. It was done. And yet… it wasn’t.

  ***

  Morning. 9:55 AM. The vial sat on the chipped laminate counter, catching the weak kitchen light. Dana picked it up. It was cold. Heavy for its size. She unscrewed the cap. The smell hit her instantly – not chemical, but profoundly *wrong*. Like burnt almonds mixed with ozone and something rotten beneath, a scent that bypassed thought and triggered primal revulsion deep in her gut. Her hand trembled.

  *Maya’s right. You have the money. Mamá is in the next room. Just… pour it down the sink. Walk away. You won. You beat the system.* The logic was crystalline, overwhelming. Sixty thousand secure. All she had to do was… nothing.

  *Ben’s voice: ‘A promise welded shut… Maybe you’re one of those people.’* The sheer, terrifying *cost* of that welded promise. Not to her, but to her mother.

  Dana filled a glass with water. Her reflection in the window looked gaunt, haunted. *Intend*. The scanner had seen it. Level 9. Had it seen a lie? Or a truth that hadn’t yet met tomorrow’s reasons? Was Ben’s ‘train’ a virtue or a pathology? Was her ability to *truly* intend this yesterday proof of strength, or a fatal flaw blinding her to the obvious moral catastrophe waiting five minutes in the future?

  She poured the viscous, faintly iridescent liquid into the water. It swirled, refusing to mix properly, like oil on a troubled sea. The burnt-almond-ozone stench intensified. Her throat closed.

  *Every four hours.* Elena’s soft, confused whimper from last night echoed. *Total incapacitation.* She pictured herself delirious, burning up, useless. Pictured Elena, alone, the alarm chiming pointlessly into silence.

  Dana raised the glass. The smell was nauseating. Her hand shook violently. The liquid sloshed, thick and menacing. 10:00 AM. The performance window opened. The reasons screamed. The money sat silently in her account, heavy as guilt.

  She closed her eyes. Not thinking of tomorrow, or yesterday. Only the glass in her hand, the acrid smell, the unbearable weight of the choice already made, or perhaps being made right now, in this trembling, nauseous moment. Was drinking it the ultimate betrayal? Or was *not* drinking it the failure of a commitment she had, somehow, authentically formed? Which path led to the deepest regret?

  The glass touched her lips. The liquid was surprisingly cold. She tipped it back.

  The taste was worse than the smell – a cloying sweetness that instantly curdled into a bitter, metallic tang, coating her tongue and throat. She gagged, fought it down, forced herself to swallow. One gulp. Two. She emptied the glass, gasping, tears springing to her eyes from the sheer vileness of it.

  Nothing happened for ten heartbeats. Then it hit – not a wave, but a detonation. Heat erupted from her core, flooding her veins like liquid fire. Her skin flushed crimson, instantly slick with sweat. A vicious cramp seized her abdomen, doubling her over. Her vision greyed at the edges, dizziness slamming into her with physical force. She stumbled, crashing against the counter, sending the empty glass shattering on the floor. The sound was distant, muffled.

  “M-Mamá…” The word was a thick, clumsy slur. Panic, cold and sharp, cut through the rising fever-fog. She tried to push herself up, but her muscles were liquid lead, unresponsive. Her knees buckled. She slid down the cabinet, landing hard on the cool linoleum amidst the glass shards. The world tilted, spun. The fever wasn't just heat; it was an inferno consuming her thoughts, replacing them with jagged, nonsensical fragments. She saw Elena’s face, blurry and concerned, swimming in her vision. Or was it just a memory? The repositioning alarm on her wrist chimed, a tiny, insistent bell ringing from a million miles away. She tried to move her arm, to silence it, to get up… but the fire had fused her bones. A low moan escaped her, more animal than human. The chiming continued. The room dissolved into a haze of pain and impossible heat. The last coherent thought, a shard of pure anguish: *What have I done?* Then, only the fire remained.

  ---

  **Rationale Notes:**

  1.  **Neuro-Cert:** Changed from "scan-notary" to "Neuro-Cert" for smoother, more contemporary-sounding terminology. The function (certified neural scan verifying intent) remains identical.
  2.  **Ben's Analogy:** Expanded Ben's factory analogy slightly to emphasize the *deliberate* nature of making an intention hold ("*deciding* what you're gonna feel later") and the idea of being constitutionally incapable of reconsideration ("a train on tracks... *can't* stop"). This strengthens his counter-argument to Maya's practical prediction-based view without resorting to philosophical jargon.
  3.  **Toxin Effects:** Rendered Thermolysin-7 concretely: smell (burnt almonds/ozone/rot), taste (cloying sweet -> bitter metallic), texture (viscous, iridescent, doesn't mix well), and rapid, brutal physiological impact (eruptive heat, crimson flush, instant sweat, abdominal cramp, dizziness, muscle weakness, slurred speech, cognitive fragmentation/delirium). The cost is shown through Dana's immediate physical collapse and inability to respond to the chiming alarm, leaving her mother unattended.
  4.  **Ambiguous Rationality:** The ending shows Dana drinking the toxin, driven by the commitment she made (and which the scanner validated). However, the final lines emphasize the immediate, horrific cost and her anguished regret *as it happens*, leaving the reader to question whether fulfilling that intention, despite the scanner's validation and Ben's argument, was truly rational given the concrete, unfolding consequences. The question isn't *what* she chose, but whether that choice *was* rational. Maya's prediction proved devastatingly accurate in the moment of crisis.
