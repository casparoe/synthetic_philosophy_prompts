  For progress, I'd propose reframing around a specific irreconcilable case: say a conscripted soldier on the unjust side who personally objects to the war but follows LOAC perfectly. The symmetry camp would call his killings permissible, the responsibility camp would not - and no institutional reframing bridges that gap. The module should make this core disagreement productive rather than trying to resolve it.

