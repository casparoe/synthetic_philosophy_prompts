  Okay, the user is a PhD student working on a chapter about the dispute between selected-effect and causal-role accounts of biological function. They mentioned a discussion in their reading group where a visiting biologist made a strong statement: "functions are selected effects; that's simply what the word means." Another person called it a verbal dispute. The user wants this sentence dissected without taking sides.

  First, I need to unpack that biologist's statement. The key phrase is "functions are selected effects; that's simply what the word means." There are several interpretations here. Let me list them out as distinct claims. The user wants a menu of possible readings, so I should categorize each one.

  Possible claims: 
  1. Stipulative definition: The biologist is defining a technical term. If that's the case, it's trivially true but only within that specific context. It doesn't invalidate other uses; it's just a convention.
     
  2. Descriptive claim about biological practice: Do biologists actually use "function" to mean only selected effects? This is empirically testable. From what I know, in evolutionary biology, selected effects are central, but in molecular biology, causal roles are often discussed without reference to selection. So this claim is contentious and probably false overall.

  3. Normative claim: Biologists should use the term this way. This is substantive and defensible but highly contested. Philosophers like Millikan defend it, but others like Cummins argue for causal roles. So it's not settled.

  4. Conceptual claim: The ordinary meaning of "function" implies selection. That seems flatly false. People talk about functions without knowing about evolution, like the function of a heart. Malfunction makes sense even without selection history—think of a diseased organ. So this doesn't hold.

  5. Metaphysical claim: Selection is what makes functions real. This is deeply contested in philosophy. Selected-effect theorists say yes; causal-role theorists say functions are explanatory tools. No consensus here.

  Now, which of these would dismiss the ENCODE usage? ENCODE defines "functional" as biochemical activity—transcription or protein binding. If the biologist is stipulating a definition (claim 1), that doesn't touch ENCODE; they're just using different terms. If it's a descriptive claim (2), ENCODE's usage is common in molecular biology, so it's legitimate. The normative claim (3) would dismiss ENCODE but is contested. The conceptual (4) and metaphysical (5) claims don't hold up against ENCODE's approach.

  The user also wants clarity on where the debate is settled versus contested. The only settled point is that philosophers agree the term has multiple meanings. Beyond that, everything else is up for debate. The user needs to avoid presenting contested positions as consensus, so I should emphasize the lack of agreement in philosophy and biology.

  The user's deeper need might be to navigate this dispute without bias for their chapter. They want to present the different claims clearly, showing where ENCODE fits and why the biologist's statement doesn't resolve the issue. Highlighting the verbal vs. substantive aspects is key. They might also need to address how to handle such disputes in their work, ensuring they accurately represent both sides without oversimplifying.
answer: |-
  Here's a disassembly of the biologist's statement ("functions are selected effects; that's simply what the word means") into distinct claims, categorized by type, status, and implications for the ENCODE usage. I'll explicitly note consensus vs. contested areas based on the philosophical and biological literature.

  ### The Menu of Claims
  1.  **Claim Type: Stipulative Definition (Term of Art)**  
      *Interpretation:* "Within the specific technical framework of evolutionary biology (or my specific subfield), 'function' is *defined* as a selected effect."  
      *Status:* **Trivially True** (if used consistently within that stipulated context).  
      *Implications for ENCODE:* **Leaves it standing.** This is a local convention. ENCODE researchers could be using a *different* stipulated definition ("function" = biochemical activity) within molecular/genomic contexts. It doesn't invalidate their usage; it highlights different terminological choices for different explanatory purposes.  
      *Consensus/Contested:* Philosophers universally agree stipulative definitions are possible and context-dependent. Biologists implicitly use stipulations all the time within subfields.

  2.  **Claim Type: Descriptive Claim about Actual Biological Usage**  
      *Interpretation:* "When biologists (across all subfields) use the word 'function,' they invariably and exclusively refer to selected effects."  
      *Status:* **Flatly False (empirically).**  
      *Reasoning:* Molecular biologists, cell biologists, biochemists, and physiologists routinely use "function" to describe causal roles *without* reference to natural selection (e.g., "the function of this kinase is to phosphorylate that substrate," "functional regions of the genome identified by ENCODE"). This usage is pervasive, longstanding, and pragmatically effective in those contexts. Evolutionary biologists use the selected-effect sense, but it is not exclusive.  
      *Implications for ENCODE:* **Leaves it standing.** ENCODE's usage aligns with common practice in molecular and genomic biology. The biologist's statement misdescribes actual linguistic practice.  
      *Consensus/Contested:* Philosophers and historians of biology widely document the dual usage. This is an empirical fact, not debated.

  3.  **Claim Type: Normative Claim about Correct Biological Usage**  
      *Interpretation:* "Biologists *should* only use 'function' to mean selected effect; any other usage is incorrect or misleading within biology."  
      *Status:* **Substantive, Defensible, but Highly Contentious.**  
      *Reasoning:* Proponents (like the biologist, echoing philosophers like Millikan, Neander, or Griffiths) argue:  
      *   Only selected effects distinguish true function from mere causal contribution or side-effect (e.g., heart sounds vs. pumping blood).  
      *   It makes sense of malfunction (a heart that doesn't pump still *has the function* to pump due to selection history).  
      *   It provides the most coherent account of teleology in biology.  
      Critics argue:  
      *   The causal-role sense (Cummins, Davies) is indispensable for explaining how complex systems work *here and now*, irrespective of evolutionary history.  
      *   Many important biological attributions (e.g., in genomics, physiology, medicine) don't require or benefit from an evolutionary analysis.  
      *   Insisting on the selected-effect sense artificially restricts biological language and ignores successful practice.  
      *Implications for ENCODE:* **Would dispose of ENCODE-style usage** if accepted. The ENCODE usage would be deemed incorrect or an illegitimate stretching of the term "function."  
      *Consensus/Contested:* **Deeply contested core philosophical debate.** There is *no consensus* among philosophers of biology that the selected-effect sense is "correct" to the exclusion of the causal-role sense. Many argue for pluralism or context-dependence.

  4.  **Claim Type: Conceptual Claim about Ordinary Language**  
      *Interpretation:* "The ordinary, non-technical meaning of the word 'function' inherently implies design or purpose derived from selection (natural or artificial)."  
      *Status:* **Contentious, likely False.**  
      *Reasoning:* While "function" often carries connotations of purpose, ordinary language readily applies it to parts of systems without knowledge of selection history (e.g., "the function of this key on my keyboard," "the function of this subroutine"). It often implies a *role* contributing to a system's capacity. Malfunction can often be understood counterfactually (this thing isn't doing what it's *supposed* to do in this system) without explicit reference to history.  
      *Implications for ENCODE:* **Leaves it standing, mostly.** If "function" in ordinary language can mean "characteristic activity contributing to a system," then ENCODE's biochemical-activity sense is a defensible (if broad) scientific extension of that core idea, even if it lacks the historical element.  
      *Consensus/Contested:* Philosophers of language debate this, but most acknowledge the core meaning involves "role" or "contribution" more fundamentally than "selection history," even if purpose is often inferred.

  5.  **Claim Type: Metaphysical Claim about the Nature of Function**  
      *Interpretation:* "What *makes* something a biological function *is* its being a selected effect; selection history is the ontological ground of function."  
      *Status:* **Substantive, Defensible, but Highly Contentious.**  
      *Reasoning:* This is the core philosophical claim behind the normative position (#3). Selected-effect theorists argue that functions are *real properties* bestowed by natural selection. Causal-role theorists argue functions are *explanatory roles* relative to a chosen capacity of a system, not metaphysically distinct properties.  
      *Implications for ENCODE:* **Would dispose of ENCODE-style usage** if true and accepted. ENCODE would not be identifying "real" functions, just biochemical activities, some of which may be functional (selected effects), some of which may be non-functional noise or side-effects.  
      *Consensus/Contested:* **Deeply contested core metaphysical debate.** There is *no consensus* that selected effects provide the sole or fundamental ontology of function. Pluralist views (different kinds of function for different explanatory needs) and causal-role views are robust alternatives.

  ### Summary: Where the Debate Stands & Implications for ENCODE

  *   **Settled:** 
      *   Biologists use "function" in multiple ways: selected-effect (dominant in evolutionary bio) and causal-role/biochemical activity (dominant in molecular/cell bio). **(Descriptive Claim)**
      *   Stipulative definitions are valid within their context. **(Stipulative Claim)**
  *   **Genuinely Contested (No Consensus):**
      *   Whether biologists *should* restrict "function" to selected effects. **(Normative Claim)**
      *   Whether selected effects provide the fundamental *ontology* of biological function. **(Metaphysical Claim)**
  *   **Likely Unsupported/False:**
      *   That the *ordinary meaning* of "function" inherently requires selection history. **(Conceptual Claim)**
      *   That biologists *actually, universally* use it only to mean selected effect. **(Descriptive Claim)**

  **Which Reading Disposes of ENCODE?** Only the **Normative Claim (#3)** or the **Metaphysical Claim (#5)**, *if accepted*, would dispose of the ENCODE usage by declaring it illegitimate or not identifying "real" functions. However, **both are highly contested positions**, not established truths or consensus views.

  **Which Readings Leave ENCODE Standing?** The **Stipulative (#1)**, **Descriptive (#2)**, and **Conceptual (#4)** claims all leave ENCODE's usage standing as a:
  1.  Legitimate stipulation within molecular genomics ("functional" = biochemically active).
  2.  Legitimate reflection of actual common practice in molecular/cell biology.
  3.  Defensible (though perhaps overly broad) extension of the core ordinary language concept of "role" or "characteristic activity".

  **Conclusion:** The biologist's statement is most plausibly interpreted as either a **Normative Claim** or **Metaphysical Claim**, both of which are substantive but highly contested philosophical positions, *not* simple statements of fact about language or settled biological practice. Calling the exchange "verbal" highlights the ambiguity in the word "function" but understates the substantive philosophical disagreement underlying the normative and metaphysical claims. The ENCODE usage remains a legitimate rival notion (a causal-role/activity concept) grounded in a different, equally important, biological explanatory context. The dispute is not *merely* verbal; it reflects deep, unresolved questions about teleology, explanation, and ontology in biology.
