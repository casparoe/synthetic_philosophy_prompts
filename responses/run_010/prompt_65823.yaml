prompt: |-
  I'm a novelist — literary historical fiction, mid-list, one book every four years if the gods are kind. I'm three years into a novel set in the decades of Britain that later grew the Arthur material, and my problem isn't the usual one (was he real, was he Artorius Castus, were there Sarmatian cavalry, all that) — it's that I keep having to decide, detail by detail, roughly two hundred times a draft, how much warrant a given piece of a legend actually carries, so I know whether I can put it in the narration as something that happened, whether it has to live only in a character's mouth as something believed, or whether I'm not allowed to touch it at all. What I want is a procedure I can run on one detail in ten minutes with a coffee going cold next to me, not an essay about the state of the question. No reading list, please — I genuinely can't chase one and I want the method rather than the footnotes; naming the actual early texts where it matters is fine and helpful.

  What I think it needs to sort on is how many hands a detail has passed through and what kind of thing tends to survive the passing, so build in both axes, because I fumble them constantly. Transmission: contemporary record / later writer with plausible access to something earlier / later writer who is visibly making things up / silence. And kind of detail: my understanding is that place names, objects, topography, the shape of a landscape survive oral transmission in ways that motives, speeches, causes and personal character simply don't — there's a reason people get excited about a piece of armour in epic that matches an artefact type far older than the poem, and a reason that excitement is usually overdone. It also has to catch the trap I fall into most, which is treating a poem as evidence for the world it describes rather than for the world that composed it. Give me named tiers, what each tier licenses me to do in prose, what to do when two layers flatly contradict each other, and what to do with pure silence, which is most of my material and which I dont have a good instinct for yet. Mark loudly the points where the procedure is really just my taste wearing a lab coat and I have to decide as a novelist rather then as a historian. One extra thing: I've been spooked by how easily this genre of book gets cited by cranks, so the procedure should flag when a detail is one that pseudohistory has already colonised, and tell me what an author's note can honestly claim without overclaiming and without pretending the novel is a documentary.

  Then run it on three cases and don't soften the third. One: a hero in the old northern British praise poetry — the Gododdin — gets measured against Arthur in passing, in a stanza that may or may not be an interpolation, in a poem dated anywhere from the seventh century to the eleventh and surviving in a thirteenth-century manuscript. What tier is that, and what can I actually do with it on the page? Two: a Hittite treaty with the ruler of a western Anatolian place-name that looks a lot like Troy, whose own name looks suspiciously like the second name the epic gives its prince. I want the procedure to spell out exactly why a name-match is not an event-match, and then say what, if anything, that document licenses a novelist to write. Three: the whole romance apparatus — Round Table, Lancelot, Grail, sword in the stone. I know roughly what the answer is going to be and I want it said bluntly, because I have sixty-odd pages already built on treating one of those as recovered tradition instead of as a late invention, and if the procedure says I have to dismantle them I'd much rather hear it this month than in a year. Finally: tell me how confident you are in the tiers themselves, which single step in the procedure you'd bet least on, and where you suspect you're importing a scholarly consensus that's really about Arthur specifically and stretching it over legends in general. I want the self-doubt attached to the deliverable, not buried in it.
reasoning: |-
  Okay, the user is a novelist working on historical fiction set in Arthurian Britain. They need a method to quickly evaluate how much historical weight each legendary detail carries. Let me start by understanding their main pain points.

  First, they’re overwhelmed by constantly deciding whether to present a detail as fact, belief, or omit it. They want a fast, repeatable procedure—no long essays or reading lists. They mentioned two axes: transmission (how info passed through time) and detail type (names vs. motives). They also worry about treating poems as evidence for the past rather than their own time, and pseudohistory hijacking their work.

  Their tiered system must categorize details into clear levels. Each tier should specify what’s allowed in narration vs. dialogue. They also need solutions for contradictions and silence. Plus, highlight where scholarly consensus ends and novelist discretion begins. And flag pseudohistory hotspots.

  Looking at their examples: Gododdin’s Arthur reference, the Hittite-Troy name match, and the romance elements. For each, the procedure must deliver blunt answers. The user especially needs honesty on the third example, even if it means reworking pages.

  I should structure the tiers based on transmission reliability and detail robustness. Transmission categories: contemporary records, later credible sources, late inventions. Detail types: stable (names, places) vs. unstable (motives, character traits). Then define tiers combining these factors. 

  Tier 1: Direct evidence. Rare, like archaeology. Okay to present as fact.
  Tier 2: Early attestation. Multiple sources. Names/topography might be factual; motives as belief.
  Tier 3: Late or isolated. Details in character dialogue only.
  Tier 4: Invented later. Avoid or explicitly frame as myth.
  Silence: Invent but stay plausible. Contradictions: Note ambiguity or choose based on plausibility.

  Pseudohistory flags: Details often misused (e.g., Atlantis, Grail conspiracies). Author’s note should clarify creative choices vs. evidence.

  For Gododdin: Tier 2.5. Arthur’s name existed, but no deeds. Can mention the comparison in a character’s dialogue.
  Hittite-Troy: Tier 2. Name survives, not events. Use location as a setting, but not the Trojan War.
  Romance elements: Tier 4. Pure invention. Must frame as myth or rework existing pages.

  My own doubts: The detail stability axis is shakier. Also, transmission categories might oversimplify. And applying general legendary principles to Arthur specifically might not always fit. Need to emphasize where the novelist’s choice comes in.
answer: |-
  Here's a field-expedient procedure designed for speed and decisiveness. Think of it as an archaeological sieve for narrative fragments. **Self-Doubt Notes** are embedded as requested.

  **The Sieve: A Two-Axis Triage**

  1.  **Axis 1: Transmission Reliability (The "Hands" Test)**
      *   **Tier T1: Contemporary/Proximate Witness (Rare Gold):** Archaeology, contemporary inscriptions, near-contemporary documents *explicitly* referencing the event/place/person *in its own time* (e.g., Gildas mentioning Badon, *if* we accept his dating/context). *Very rare for this period.*
      *   **Tier T2: Plausible Access (Tarnished Silver):** Later text (e.g., *Historia Brittonum*, *Annales Cambriae*) demonstrably using earlier, now-lost sources (oral/written), making specific, non-mythic claims. Includes early Welsh poetry (*Y Gododdin*, *Preiddiau Annwn*) referencing figures/places likely known to its *original* audience. **Self-Doubt:** Hard to *prove* access; relies on scholarly inference. "Plausible" is key.
      *   **Tier T3: Late & Inventive (Base Metal):** High Medieval Romance (Chrétien, Malory), Geoffrey of Monmouth's *Historia Regum Britanniae*, clearly mythologizing or creating narrative *de novo*. Hagiography with fantastical elements. **Self-Doubt:** Geoffrey's "ancient book" claim is demonstrably false; assigning *anything* here to earlier tradition requires *exceptional* evidence.
      *   **Tier T0: Silence (The Substrate):** No extant mention. The vast majority of your material lives here.

  2.  **Axis 2: Detail Robustness (The "Survivability" Test)**
      *   **Type D1: Hard Geography & Objects (Stones):** Place names (river names especially durable), topography, landscape features, *types* of objects (e.g., "spear," "hillfort," "feasting hall" – *not* Excalibur specifically). Survives oral/literate transmission best. **Self-Doubt:** Specific *site* identification (e.g., *this* hill is Camlann) is often later guesswork, even if the *name* is old.
      *   **Type D2: Core Events & Roles (Bones):** Battles (names/locations fuzzy), kingship, conflict between groups, migrations. Can have a kernel but are easily reshaped.
      *   **Type D3: Motive, Character, Speech, Specific Marvels (Mist):** Why someone acted, personality traits, direct speech, magical objects/events. Almost always reflects the *author's* time, values, and narrative needs, *not* historical reality. **Self-Doubt:** This is the shakiest axis. "Kernel" theories abound, but are often untestable. Bet least on this distinction holding *perfectly*, but it's still a vital heuristic.

  **The Procedure (10 Minutes, Cold Coffee):**

  1.  **Identify the Detail:** Be precise (e.g., not "Arthur," but "Arthur fighting at Badon," or "Camelot's location," or "Guinevere's abduction").
  2.  **Assign Transmission Tier (T):** Where's the *earliest* secure attestation? Be ruthless. Ignore later repetitions; trace back to the *source*. (T0 if silent).
  3.  **Assign Detail Type (D):** Is it a place name (D1), a battle name (D2), a reason for betrayal (D3)?
  4.  **Apply the Sieve Grid & License:**
      *   **T1 + Any D:** **License:** Can be presented as factual narration *if* consistent with archaeology. **Author's Note:** Can cite as direct evidence.
      *   **T2 + D1:** **License:** Place/object type can be in narration as setting. *Specific* named location (e.g., Badon hill) can be used cautiously *if* plausible geographically/archaeologically. **Author's Note:** "Early traditions place X at Y."
      *   **T2 + D2:** **License:** Event *type* (battle, kingship) in narration. *Specific* event *must* be framed as belief (character dialogue/rumor) or presented ambiguously ("It was said..."). **Author's Note:** "Early sources record a battle at X involving Y."
      *   **T2 + D3:** **License:** *Only* in character dialogue/thought/belief, song, or ambiguous narration. **Never** as omniscient fact. **Author's Note:** "Later traditions attribute Z motive to A."
      *   **T3 + Any D:** **License:** Use *only* as conscious myth-making *within* your story world. A bard singing, a monk writing, a character *invoking* the later legend. *Never* as historical event in your core narrative time. **Author's Note:** "The element of X first appears in Yth-century romance."
      *   **T0 (Silence):** **License:** **Novelist's Playground (w/ Lab Coat Off).** Invent based on archaeological/ethnographic plausibility for the *time you're depicting*. **Author's Note:** "No contemporary record of X exists; its depiction here is imaginative reconstruction based on Z." **Pseudohistory Flag:** Avoid filling silence with popular modern pseudo-historical tropes (e.g., Atlantean priests, hyper-diffusionism).

  **Handling Contradictions:**
  *   **T1 vs. Anything Else:** T1 wins (but T1 is vanishingly rare).
  *   **T2 vs. T2:** Choose the *most plausible* based on archaeology/context, OR present *both* versions as competing beliefs/rumors within the narrative. **Author's Note:** "Sources disagree on X; the novel explores one possible version."
  *   **T2/T1 vs. T3:** T2/T1 wins for historical core. T3 is irrelevant *as history* for your period.
  *   **T3 vs. T3:** Irrelevant to history. Use whichever serves the story.

  **Pseudohistory Colonization Flag:**
  *   **Trigger:** Details involving: The Grail (especially as Egyptian/alien relic), Templars, Mary Magdalene, Atlantis, ley lines, "secret bloodlines," Stonehenge builders, hyper-diffusionist claims (e.g., America in 5th century), "suppressed truths." Also, *any* claim heavily promoted by specific well-known pseudo-historians.
  *   **Action:** **Extreme Caution.** Stick rigorously to your tiers. If using, frame explicitly *within* the myth-making of your characters' later era (T3 license). **Author's Note:** Be explicit: "The Grail legend, a medieval development, is incorporated here as myth, not history."

  **Applying the Sieve:**

  1.  **The Gododdin Reference (c. 600-1000 CE, MS 13th C):**
      *   **Detail:** "He fed black ravens on the rampart of a fortress, though he was no Arthur."
      *   **Transmission (T):** T2 (Plausible Access). Early Welsh heroic poetry, likely preserving older oral tradition, *but* surviving MS is late, interpolation debates exist.
      *   **Detail Type (D):** D2 (Core Event/Role - comparing martial prowess).
      *   **Sieve:** T2 + D2.
      *   **License:** *Cannot* put "Arthur was a supreme warrior" in narration as fact. **Can:** Have a character *in the Gododdin's era or shortly after* know the line/similar sentiment. Have the comparison exist as a cultural touchstone ("great, but not *that* great"). **Can:** Use the *existence* of Arthur's name/fame by ~600-700CE in narration cautiously ("a name invoked for martial glory").
      *   **Author's Note Claim:** "The earliest known reference to Arthur occurs in the poem *Y Gododdin*, comparing a fallen warrior unfavorably to him, suggesting his fame predates the poem's likely 7th-10th century composition."

  2.  **Hittite "Wilusa" / "Alaksandu" (Treaty c. 1280 BCE):**
      *   **Detail:** Place name "Wilusa" (likely = Ilios/Troy) & Ruler "Alaksandu" (likely = Alexandros/Paris).
      *   **Transmission (T):** T1 (Contemporary Record). A diplomatic treaty.
      *   **Detail Type (D):** D1 (Place Name), D1 (Ruler Name).
      *   **Sieve:** T1 + D1.
      *   **Why Name ≠ Event:** The treaty proves a place *called* Wilusa/Ilios existed in the right place and time, ruled by *someone* named Alaksandu/Alexandros. It provides **zero** evidence for: Helen, the Achaean siege, the Trojan Horse, the specific heroes, the *cause* of any conflict, the city's *fate* (beyond Alaksandu still ruling when the treaty was signed!). It confirms geography and nomenclature, *not* narrative.
      *   **License:** **Can:** Set scenes in Wilusa. Depict a ruler named Alaksandu. Reference Hittite diplomacy/overlordship. **Cannot:** Depict the events of the Homeric Trojan War as historical fact based on this. The *Homeric story* is T3 (Late Invention) for events centuries earlier.
      *   **Author's Note Claim:** "Hittite records confirm a powerful city-state called Wilusa (Ilios/Troy) existed in western Anatolia during the Late Bronze Age, ruled by a man named Alaksandu (Alexandros/Paris). The epic tradition of the Trojan War developed centuries later."

  3.  **The Romance Apparatus (Round Table, Lancelot, Grail, Sword in the Stone):**
      *   **Transmission (T):** Universally T3 (Late & Inventive - 12th Century onwards: Chrétien de Troyes, Robert de Boron, Vulgate Cycle, Malory).
      *   **Detail Type (D):** Round Table (D3 - Motive/Institution), Lancelot (D3 - Character), Grail (D3 - Marvel/Motive), Sword in Stone (D3 - Marvel).
      *   **Sieve:** T3 + D3.
      *   **License (Bluntly):** **None of these existed, were believed in, or were part of any "recovered tradition" in the 5th-7th century Britain of your novel.** Including them as historical elements in your core narrative **requires dismantling those 60 pages**.
      *   **What You *Can* Do:** Frame them *exclusively* as later myths *beginning* to form *only* if your timeline stretches to the 12th century (unlikely). Use them as *metaphors* or *echoes* (e.g., a warband leader's hall *vaguely reminiscent* of later tales; a significant sword, *not* drawn from an anvil; a quest for a sacred object *unrelated* to the Grail legend). **Best Approach:** Excise them entirely from the historical reality you depict. They belong to the myth-making future of your story world.
      *   **Author's Note Claim (Essential):** "Elements like the Round Table, Lancelot, the Holy Grail, and the Sword in the Stone are entirely the creation of French and English medieval romance, first appearing in the 12th century and later. They have no basis in the historical period depicted in this novel and are deliberately omitted from its historical framework."

  **Self-Doubt on the Tiers:**

  1.  **Confidence in Tiers:** The Transmission Tier (T) is reasonably robust based on textual criticism and dating. The Detail Robustness Tier (D) is a strong heuristic based on anthropology/folkloristics, but is **less absolute**. It's the step **I'd bet least on**. Names *can* be transferred or misunderstood; simple events *can* be fabricated. However, the *inverse* (complex D3 surviving intact) is vanishingly unlikely. The Tiers are a pragmatic tool, not iron law.
  2.  **Stretching Consensus:** The core principle (T1/T2 > T3; D1 > D3) is broadly applicable to legendary material (e.g., Robin Hood, Roland). However, the *specific* Arthurian debates (Badon, Camlann, Ambrosius) are uniquely fraught due to scarce sources and nationalist passions. Applying the "silence = playground" rule to Arthur is where consensus dissolves entirely – some scholars see only myth, others a "plausible" warlord. **Here, the sieve forces a choice the novelist *must* make:** lean into the silence as freedom (with plausibility), or treat Arthur himself as T2+D3 (a name attached to deeds, usable only as belief)? My procedure pushes for the latter for Arthur *specifically* due to the Gododdin, but this *is* where Arthurian exceptionalism creeps in. For other figures in the same era with *no* T2 reference (like "Lancelot"), it's T0/T3 only.

  **The Lab Coat & The Novelist's Hat:**

  *   **Tiers T1-T3, D1-D3:** This is the Lab Coat. Stick to it for historical integrity.
  *   **Handling T0 (Silence):** This is where the Novelist's Hat goes on. Use the freedom, but keep the Lab Coat nearby for plausibility checks. *How* you weave the T2+D3 material into character belief is also pure novelist craft.
  *   **Contradictions:** Choosing *which* T2 version to lean towards involves novelistic judgment after the sieve filters out the impossible.
  *   **Pseudohistory Flag:** The Lab Coat identifies the minefield; the Novelist Hat chooses whether and how to dance around it, but *never* plants a flag on it.

  This sieve forces hard, fast decisions based on source provenance and detail type. It protects you from anachronism and pseudohistory while clarifying where your creative freedom truly lies – primarily in the vast, fertile silence of the past. Use it ruthlessly. Good luck with the dismantling.
