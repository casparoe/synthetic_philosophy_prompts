  **Rationale for Scores:**
  *   **Passions (P:1.0, WP:0.2):** Strong feelings (for your child, a hobby, justice at work) are inherently portable. Others *might* be affected (e.g., family adjusting to your enthusiasm), but the passion itself requires no labor subsidy. *(Confidence High: Core to her argument, class-neutral)*.
