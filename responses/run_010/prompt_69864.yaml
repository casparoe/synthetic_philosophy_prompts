  *   **Taste/Refinement (P:0.9, WP:0.4):** Appreciating a sunset, music, a well-made cup of coffee needs no wealth. Training it takes attention, not money. Minor "cost" if indulging tastes requires others to accommodate (e.g., quiet time). *(Confidence High: She emphasizes perception over luxury)*.
