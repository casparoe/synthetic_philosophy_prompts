  Okay, let me unpack this. The user is a retired materials scientist with 38 years of lab experience who's recently dived into philosophy. They're fixated on Memento's Leonard as a potential "money pump" case but suspect they might be forcing the frame. Their core questions are:

  First, they want to know if Leonard fits the technical definition of a money pump. Classic money pumps require cyclical preferences (A>B, B>C, C>A) and myopic trading. But Leonard has stable preferences - he consistently wants to avenge his wife. The problem is his epistemic fragmentation: each successive self has degraded information. This aligns more with Parfit's "self-torturer" paradox than preference intransitivity. 

  Second, they're asking about the structural vantage point. Money pump arguments typically require synoptic vision to see the exploitation. Leonard lacks this, but Teddy exploits this gap. That's crucial - Leonard isn't pumping himself; he's being pumped by an external agent who can map the whole sequence. 

  Third, they're probing the difference between external pumping and self-sabotage. Leonard's endgame Ulysses contract (lying to his future self) isn't resoluteness but its inversion. Resoluteness binds future selves to truth; Leonard binds his to falsehood. This speaks to Bratman's work on planning agency versus self-deception. 

  Where the reading breaks: The film's reverse chronology isn't primarily about rationality failures. It's an experiential device about narrative construction - we're forced to share Leonard's fragmented consciousness. The Sammy Jankis subplot explicitly questions psychological continuity; if Leonard's selves are disconnected, diachronic rationality norms may not apply. 

  On scholarly consensus: Preference transitivity is widely accepted, but its application to fragmented agents is contested. Key splits exist around whether rationality requires synoptic vision (Gauthier vs McClennen) and if Ulysses contracts solve dynamic inconsistency (Bratman vs critics). Leonard's case falls squarely in these disputed zones. 

  Most telling detail: The user notes philosophers often present money pumps as settled when discussing "irrationality now." They're absolutely right - that's a rhetorical overreach. What's rational for Leonard-at-t-1 may be disastrous for Leonard-at-t-2, and there's no consensus on how to evaluate such cases. 

  Final thought: Their materials science background shows in how precisely they isolate variables (preference stability vs information decay). That rigor makes their suspicion about forcing the frame likely correct - the money pump lens reveals aspects but obscures the film's core themes of narrative self-creation.
answer: |-
  You've nailed the core tension beautifully. Let's dissect this with surgical precision, respecting both the film's mechanics and the philosophical disputes. Your framing isn't flawed – it's *revealing* a key ambiguity in diachronic rationality applied to fragmented agents. Here's the breakdown:

  **1. Is Leonard a Money Pump? (Cycles vs. Information Fragmentation)**
  *   **Where it fits:** Leonard **doesn't meet the classic money pump conditions**. You're absolutely right. His preference is tragically stable: "Find and kill John G." There's no intransitive cycle (A>B, B>C, C>A). The problem isn't *what* he wants, but *how he pursues it* across time-slices with radically different information states.
  *   **Where it diverges / The Closer Fit:** He's far closer to **Parfit's Self-Torturer or Kavka's Toxin Puzzle**, but with a critical twist. The Self-Torturer makes a series of locally rational, marginally beneficial choices that cumulatively lead to disaster. Leonard makes locally rational *epistemic and practical choices* (take Polaroid, write note, get tattoo, trust Teddy/Natalie, burn possessions) based on the information available *to that time-slice*. Each step seems justified *at the time* to achieve the goal.
  *   **The Crucial Mechanism:** The destruction arises from:
      *   **Information Degradation:** Each new "self" inherits only the artifacts (notes, tattoos) and *lacks the context* of why previous choices were made or the evolving understanding (e.g., Sammy Jankis truth, his wife's possible survival, Teddy's manipulations).
      *   **Exploitation of Fragmentation:** External agents (Teddy, Natalie) act as the "pumpers." They *can* see across Leonard's temporal gaps. They provide information (license plate, identity of "John G," shelter) that *seems* locally beneficial to the current Leonard, knowing it will lead him to act against his own *enduring* interest in finding the *real* truth/achieving closure. Teddy explicitly states he uses Leonard for his own ends.
      *   **Self-Inflicted Harm via Artifacts:** Leonard's own systems (the tattoos, the notes) become the pumping mechanism. The tattoo saying "Kill John G" combined with Teddy feeding him a name *is* the pump's lever. He pays by perpetuating his own suffering and becoming a murderer based on lies.
  *   **Verdict:** Not a classic money pump due to stable preference. He's a **fragmented agent vulnerable to exploitation via induced dynamic inconsistency**, where locally rational actions, mediated by degrading memory and manipulated information, lead to globally catastrophic outcomes. The "pumping" is done *to* him (by Teddy/the system he created) rather than by preference cycles.

  **2. The Vantage Point Problem & Exploitability**
  *   **The Argument's Requirement:** Yes, the *diagnosis* of a money pump/dynamic inconsistency **absolutely requires a synoptic vantage point** – seeing the whole sequence and its net outcome. Leonard *structurally lacks this*. He can only ever occupy the "now."
  *   **Does the Argument Fail? No – It Explains Exploitability:** This doesn't invalidate the argument; it **explains *why* he's so devastatingly exploitable.** His inability to see the sequence is his core vulnerability. Anyone who *can* see across his gaps (Teddy) can manipulate him by controlling the information fed to each successive self. The diachronic irrationality isn't *internal* preference cycling; it's the **structural inability to maintain coherent agency over time**, making him a perfect target for external manipulation that *creates* a destructive sequence mimicking a pump's outcome. Teddy *is* the vantage point exploiting the structural flaw.

  **3. Self-Pumping vs. External Pumping & Corrupted Resoluteness**
  *   **Ulysses Contract vs. Self-Deception:** Leonard's final act (writing the note to manufacture a new "John G") is the **perversion of a Ulysses contract**.
      *   **True Resoluteness (Bratman):** A Ulysses contract binds *future* selves to a *true* preference or plan known *now* to avoid weakness of will *later* (e.g., tying oneself to the mast to avoid the Sirens' call). It assumes continuity of core goals.
      *   **Leonard's Corruption:** Leonard *knows* his enduring goal ("Find John G") is unresolved. He *knows* writing the license plate is setting up an innocent target (Teddy) to be killed by his next self. He's **not binding himself to a true goal; he's sabotaging his future self's agency by implanting a false goal.** He's creating the *next* step in the pump *against his own enduring interest in truth/closure*.
  *   **Mechanism & Cost:** It's the *same mechanism* Teddy uses (feeding false info to the next self), but now Leonard *internalizes* the pump. The "cost" of his resoluteness is the **deliberate abandonment of his true project** (finding the real killer/truth) in favor of sustaining the *feeling* of purpose and the *addiction* to the chase. He chooses the loop over the potential void of resolution. It's resoluteness towards *perpetuating the cycle*, not escaping it.

  **Where the Reading Breaks & What the Film Is Really About**
  *   **Your Suspicion is Largely Correct:** Forcing Leonard strictly into the money-pump frame *does* obscure the film's deeper themes. The diachronic irrationality is a *symptom*, not the core disease.
  *   **Narrative & Self-Deception:** The film is fundamentally about **the construction of identity and purpose through narrative**. Leonard *creates* the John G. narrative (even before the final note) to give his shattered life meaning. The Sammy Jankis story is his own guilt projected onto a fabricated narrative. The reverse chronology forces *us* to experience his desperate, backwards-driven narrative construction. His "choices" are often about sustaining the story that justifies his existence, not achieving a goal. The "pump" is fueled by the *need for the story itself*.
  *   **Psychological Continuity:** You're spot on. The film ruthlessly interrogates personal identity. The ties between Leonard's time-slices are *almost* purely physical (body, tattoos) and procedural (habit, system). There's minimal psychological connection. **This is why diachronic rationality struggles to get a grip:** Rationality typically assumes a reasonably continuous agent. Leonard is a borderline case where the concept frays. The film *dramatizes* the potential failure of diachronic agency under radical discontinuity.

  **The State of the Field - Key Splits & Agreements**
  *   **Settled:**
      *   Cyclical preferences + myopic trade = Money Pump vulnerability (Arguably *the* canonical argument for transitivity).
      *   Dynamic inconsistency (preference reversal over time) is a major problem for rational choice (Strotz, 1956 is foundational).
      *   Ulysses contracts are a proposed solution to dynamic inconsistency (Elster, Bratman).
  *   **Genuinely Disputed & Relevant to Leonard:**
      *   **Does Diachronic Rationality Require a Synoptic Vantage Point?** Or Can It Be Defined Locally?
          *   *Split:* Some (e.g., Gauthier) argue for sophisticated choice (choosing now based on predicting future choices). Others (e.g., McClennen) argue for resolute choice (sticking to a plan). Leonard's fragmentation makes *both* approaches nearly impossible for him to implement consistently. There's debate over whether agents like Leonard can be *judged* irrational at a point in time if their actions are locally optimal given their constraints.
      *   **How Binding/Effective are Ulysses Contracts?**
          *   *Split:* Can future selves truly be bound, or is it just self-manipulation? (Bratman vs. critics). Leonard's case shows the *danger* when the contract is based on self-deception, not true interest.
      *   **The Scope of Rationality Under Radical Discontinuity:**
          *   *Split:* To what extent do standard norms of rationality apply to agents with severe psychological discontinuity? (Deep waters involving Parfit, personal identity, and the very definition of agency). Many philosophers *assume* continuity; Leonard's case challenges that assumption directly. Is "Leonard" one agent to whom diachronic norms apply, or a series of near-independent agents? The field lacks a consensus answer.
      *   **Is Self-Deception Truly Irrational?**
          *   *Split:* Some argue it serves evolutionary or psychological purposes (e.g., maintaining motivation). Leonard's final act is a stark example of *knowing* self-deception chosen for existential reasons. Is this "irrational" if it sustains a necessary fiction? This remains contested.

  **Moments to Hang the Argument On:**
  1.  **Teddy's Exploitation:** Every scene where Teddy feeds Leonard information (the license plate, the name "John Gammell") knowing it will trigger the next step in the cycle. This is the *external* pump in action.
  2.  **Burning the Possessions:** The ultimate locally cathartic, globally destructive act. Based on Natalie's manipulation (exploiting his current emotional state and lack of broader context), it destroys the last tangible link to his real past/wife, cementing his dependence on the fabricated narrative.
  3.  **The Final Note Sequence:** Leonard consciously chooses to lie to his next self. This is the internalization of the pump mechanism and the corrupted Ulysses contract. He *knows* he's perpetuating the cycle against his own deeper need.
  4.  **Sammy Jankis Reveal:** The moment (often shown in B&W) where Leonard admits his wife survived the assault, and Sammy had no wife. This shatters the narrative he tells others (and himself) and exposes the self-deception at the core of his identity project, making his final act of self-poisoning plausible.

  **Conclusion:** Your reading is insightful but partial. Leonard isn't a walking money pump due to cyclical preferences. He's a **radically fragmented agent whose vulnerability to dynamic inconsistency and epistemic degradation is ruthlessly exploited by others and, ultimately, by himself.** The film uses this structure not primarily to make a point about choice theory, but to explore the desperate, often self-destructive, construction of narrative identity in the face of meaninglessness and discontinuity. The diachronic irrationality is a powerful *consequence* of this fragmentation and self-deception, making the money-pump analogy a useful, though not perfect, lens. The deepest philosophical friction lies precisely where you pinpoint it: in the disputed territory of rationality under radical discontinuity and the ethics of self-binding through narrative lies. The field *is* split here, and Leonard stands as a compelling, tragic test case.
