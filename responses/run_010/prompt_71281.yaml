prompt: |-
  Most major news organizations will not print a racial slur in full, even when it occurs inside a direct quotation from a court transcript, a leaked recording, or a historical document; they substitute a masked form or a description of the word. Practice varies at the edges — some will print it when a public figure's utterance is itself the story — but the baseline prohibition is stable, and so is a striking asymmetry: the same organizations print unmasked, and in vivid detail, the content the slur encodes, together with descriptions of atrocities far worse than the word, and they will print the slur in full when the article is about the word.

  What account of meaning does the masking norm presuppose? If the harm travels with the content, why is paraphrase of that content permitted while the word is banned? If it travels with the word-form, what kind of thing must a word be for a mere token — quoted, attributed to someone else, used to report rather than to assert — to carry the force the norm credits it with? Reconstruct the implicit view, separating what the practice strictly requires from what it merely sits comfortably with; say which standard accounts of slurs it quietly rules out; judge whether the exception for metalinguistic reporting is consistent with the rule or reveals that what is being tracked is hearer response rather than semantics; and describe what the practice would have to look like if newsrooms adopted the view that a slur and its neutral counterpart have exactly the same truth-conditional content.
reasoning: |-
  Hmm, the user has presented a sophisticated analysis of racial slur masking practices in journalism, probing the philosophical underpinnings. This requires careful unpacking.

  The core paradox lies in newsrooms' asymmetric treatment: they'll graphically describe atrocities but mask the slur itself, except in metalinguistic contexts. The user wants me to examine what theory of meaning this practice implies. 

  First, the masking norm clearly operates on a form-based prohibition. It treats the word itself as toxic regardless of context - even when quoted or attributed. This immediately rules out truth-conditional equivalence theories. If slurs merely had the same referential content as neutral terms, masking them while describing horrific content wouldn't make sense.

  The exception for metalinguistic use is particularly telling. When discussing the word qua word, printing it becomes acceptable. This suggests the harm isn't in the semantic content but in the word's performative force - its ability to re-enact historical violence through utterance. The practice treats slurs as having what J.L. Austin called "illocutionary force."

  What's fascinating is how this presupposes a non-reducible view of slurs. They're not just vehicles for conveying hatred - they materially perpetuate harm through their very articulation. This aligns with Judith Butler's work on hate speech as conduct rather than just speech.

  The user's final question about truth-conditional equivalence is spot-on. If newsrooms adopted that view, we'd see either complete masking of all related content (which doesn't happen) or unmasking of slurs (which they avoid). Neither matches current practice, confirming that the norm rejects referential equivalence.

  I should note this isn't about hearer response alone. If it were, the metalinguistic exception wouldn't exist - readers would presumably react similarly. The consistent line between use and mention shows the practice tracks linguistic status, not just psychological impact.
answer: |-
  The masking norm in journalism reveals a sophisticated, non-referential view of slur semantics that quietly rejects several standard philosophical accounts. Here's a reconstruction:

  ### Core Presuppositions of the Practice:
  1. **Harm Embodiment**: The slur's *form itself* is a vehicle of harm, independent of its referential content. The word isn't merely descriptive but *performs* subjugation.
  2. **Token Sensitivity**: Each utterance (token) reactivates historical violence. Quotation doesn't neutralize this—attribution to another speaker is insufficient insulation.
  3. **Content/Form Asymmetry**: The *concept* of racial inferiority (content) is discussable when linguistically detoxified (via paraphrase), but the *prescribed linguistic enactment* of that concept (the slur) is prohibited.

  ### What the Practice Strictly Requires:
  - **Form-Specific Prohibition**: The harm is lexically encoded. No contextual neutralization occurs in direct quotation, rejecting *purely* pragmatic accounts.
  - **Mention/Use Distinction**: Only *metalinguistic mention* (discussing the word qua word) permits unmasking. This isn't an exception but a categorical shift: when the word is the referent, it isn't *used* to enact harm.

  ### Ruled-Out Theories:
  - **Truth-Conditional Equivalence**: If slurs (e.g., "n****r") shared identical truth conditions with neutral counterparts ("Black person"), masking the slur while detailing atrocities it denotes would be incoherent. The practice assumes slurs carry *extra* harmful content.
  - **Purely Connotative Views**: If harm were merely connotative (like "snake" for treachery), it could be canceled by context (e.g., court transcripts). It cannot.
  - **Speaker-Intentionalism**: Harm persists even when the *speaker* (journalist) disavows the slur. The norm targets the word's social history, not individual intent.

  ### The Metalinguistic Exception: Consistency Check
  This exception **is consistent** with the core view. Key distinctions:
  - **Use**: Deploying the slur *as tool of reference* (even quoted) perpetuates harm by re-activating its oppressive function.
  - **Mention**: Discussing the word *as object* (e.g., "Smith used the word 'n****r'") doesn't employ it as a racial designator. Harm derives from semantic *use*, not phonetic exposure alone.  
  **→ Hearer-response isn't primary**: If harm were purely psychological, mentioning could trigger similar distress. The exception proves semantics governs: the *linguistic status* (use/mention) matters more than raw auditory impact.

  ### If Newsrooms Adopted Truth-Conditional Equivalence:
  Practice would bifurcate:
  1. **Masking Abandoned**: If slurs truly had identical content to neutral terms, printing them in quotations would be unobjectionable. Describing lynchings while masking "n****r" would seem irrational.
  2. **OR Total Content Masking**: If the *concept itself* were deemed harmful, newsrooms would avoid paraphrasing atrocities altogether—but they don't. Graphic descriptions of violence remain printable.  
  **→ Current practice is unsustainable** under this view. The asymmetry (mask form/unmask content) only makes sense if slurs possess unique, non-truth-conditional harm.

  ### Implicit Semantic View:
  The norm presupposes a **hybrid expressivist-historicist** account:
  - **Prescriptive Force**: Slurs conventionally *prescribe* inferiority (not just describe it). Paraphrase strips away this directive element.
  - **Historical Accumulation**: The word-form embodies centuries of violence. Each token risks re-sanctioning that history, regardless of speaker intent.
  - **Discursive Power**: The harm lies in granting the *lexical weapon* circulation, even in "inert" contexts. Paraphrase disarms by refusing to deploy the weaponized signifier.

  ### Conclusion
  The practice treats slurs as **ritualized acts of subjugation** crystallized in language. Masking is linguistic disarmament: it acknowledges that the word itself is an instrument of violence, distinct from its semantic content. This view quietly endorses theories like Tirrell's (slurs as "toxic speech acts") or Hornsby's (illocutionary disablement), while rejecting truth-conditional reductionism. The metalinguistic exception isn't a loophole but a testament to the practice's semantic coherence.
