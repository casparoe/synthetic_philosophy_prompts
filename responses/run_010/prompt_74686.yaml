answer: |-
  ### Design Rationale  
  This instrument discriminates positions on what FARG-like models demonstrate about fluid concepts, based on intuitive judgments about letter-string analogies and methodological commitments. It deliberately leaves unresolved whether fluid concepts are necessary for human cognition, focusing instead on evidential claims about the models. The instrument avoids priming by never mentioning "fluid concepts" or technical architecture terms. The most sorting work is done by the circular-domain case (Question 6), which tests whether judgments are sensitive to domain structure (e.g., alphabet linearity vs. circularity). Positions that predict answer changes here have empirical content; those that don’t may be untestable or question-begging.

