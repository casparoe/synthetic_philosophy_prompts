prompt: |-
  I'm running a 45-minute session for our department's probability reading group — mostly second-years who've done a solid Bayes course (priors, likelihood ratios, the lot) but essentially no philosophy, plus two postgrads who will enjoy catching me out. Topic: anthropic reasoning, specifically the self-sampling assumption vs the self-indication assumption, and the presumptuous philosopher case. Whiteboard only, no slides.

  I don't want the explanation from you, I want a plan for giving it. So:

  1. What order do the pieces have to go in, and what depends on what? My instinct is that nothing lands until they accept that "I exist" and "I happen to be this one" can function as evidence at all — but I genuinely can't tell whether that's the right first move or whether opening with it makes the whole thing look like mysticism to people who've only ever seen evidence written as a likelihood.

  2. What single example should carry the session? Do I open with the Doomsday argument, which half of them have vaguely heard of and the other half will have loud opinions about, or is that a trap that eats all 45 minutes? I'd much rather use my own toy case. Here's the one I've sketched — tell me honestly whether it does the job or whether it quietly teaches something else:

  A fair coin is flipped before anyone is around. Heads: a town of 1,000 residents is founded. Tails: a village of 10 residents is founded. Either way you end up alive, resident, and with no memory of the coin. In the town, exactly 10 of the 1,000 residents live in the old quarter; in the village, all 10 do, because the village just is the old quarter.

  - Stage 1, before you've learned anything about where you live: SSA leaves the coin at 1:1, SIA pushes it to 100:1 for heads.
  - Stage 2, you find out you live in the old quarter: SSA now goes to 1:200 for tails, and SIA comes all the way back to 1:1.

  So the SIA boost gets exactly cancelled by the indexical evidence, while SSA never had a boost but gets swung hard by the same fact. Is my arithmatic actually right? And is that 1:1 landing where I think the lesson is — namely that SIA isn't just "more people means more likely to be right" — or does the symmetry of the numbers invite the wrong takeaway? Also: can they see from this case, without any cosmology, why the presumptuous philosopher is supposed to be embarrassing for SIA? If not, is there a non-cosmological stand-in for it, or does the force of that argument only show up once the numbers get astronomical?

  3. Misconceptions, in the order they'll actually turn up, and the precise point in the sequence where I head each one off. I'm braced for "this is just selection bias, use the usual formula", "SSA means you should assume you're median at everything", and at least one person insisting the answer is empirical because it depends how many people there will eventually be. What am I missing, and which of these becomes fatal if it's still standing at minute ten?

  4. One closing question I can put to them that shows whether they've got the SSA/SIA distinction rather than whether they can recite it. Ideally something where the correct answer looks wrong at first glance.

  5. What should I openly refuse to explain at this level, and say so out loud? I'm guessing reference-class choice and the Sleeping Beauty business, but tell me if I'm about to hand-wave something that's actually load-bearing for the parts I am covering.

  British English please, and no reading list or suggested citations — I'm not assigning anything and I've no way of checking what you'd recommend.
reasoning: |-
  Okay, let me approach this step by step. The user needs a practical session plan for teaching anthropic reasoning to statistics students with Bayesian background but no philosophy exposure. 

  First considering the core challenge - how to introduce "I exist" as evidence without seeming mystical. The Bayesian group will likely resist subjective indexical evidence at first. Maybe starting with a neutral thought experiment where existence isn't in question would bridge the gap better. 

  For the main example, their town/village coin flip case seems mathematically sound but I notice a potential pitfall - the symmetry might make SSA/SIA differences appear trivial rather than fundamental. The numbers work (SSA: prior 1:1 → posterior 1/200 after evidence; SIA: prior 100:1 → posterior 1:1) but perhaps adding population labels would prevent misinterpretation that "old quarter" evidence is about location rather than existence.

  The presumptuous philosopher objection needs handling. Their case shows it implicitly when SIA ignores overwhelming indexical evidence (being in old quarter) due to prior weighting. Could emphasize that in SIA, existing at all makes large universes seem likely regardless of your specific position.

  Anticipating misconceptions:
  - "Just selection bias" should be addressed when introducing indexical evidence, showing it's not sampling bias but ontological uncertainty
  - "Assume median" confusion might arise during Doomsday discussion - best to explicitly contrast median reasoning with SSA
  - Future population dependency is valid but derailing - should state we're assuming fixed possible worlds

  For the closing question, something where SSA updates strongly on individual traits while SIA doesn't. Perhaps: "You're the 10th person born. Does this support doom soon? (SSA yes, SIA no)"

  Need to explicitly exclude:
  - Reference classes (too messy)
  - Sleeping Beauty (different problem)
  - Quantum immortality (distracting)

  Timing is tight - 45 minutes means strict cuts after:
  - 5min framing
  - 15min existence-as-evidence intro
  - 15min town/village walkthrough
  - 5min presumptuous philosopher link
  - 5min Q&A/closer

  The key is making indexical evidence feel mathematically rigorous from the start - perhaps by writing Bayes factors for "I am person X" early on.
answer: |-
  Here’s a battle-tested plan for your 45-minute session, designed to build intuition while dodging common pitfalls. British English throughout, as requested.

  ---

  ### **1. Order of Operations**  
  *(Total: 40 min talk + 5 min buffer)*  
  **First 10 min: Frame "existence" as Bayesian evidence**  
  - **Start with a neutral hook:** "You wake up with amnesia in a pitch-black room. What’s your credence you’re in a warehouse vs. a cupboard?"  
  - **Key move:** Formalise "I exist here" as *indexical evidence*. Write Bayes’ theorem:  
    `P(H|E) ∝ P(E|H) * P(H)`  
    Stress that `E = "I am observing myself in this state"` is legitimate evidence.  
  - **Why first?** Bayesians accept likelihoods; this grounds mysticism in math. *Crucially:* Use a case with **no anthropic stakes** (like the dark room) to disarm scepticism.  

  **Next 15 min: Your town/village case**  
  - **Deploy your toy model.** Walk through stages *slowly*:  
    - **Stage 1 (prior):**  
      - SSA: `P(Heads) = 1/2` (no indexical adjustment)  
      - SIA: `P(Heads) ∝ P(Heads) * N_Heads = (1/2)*1000` vs. `(1/2)*10` → 100:1 for Heads  
    - **Stage 2 (old quarter evidence):**  
      - SSA: Update on "I’m in old quarter" → only 10/1000 in Heads world, vs. 10/10 in Tails.  
        `P(Tails|data) ∝ (1/2) * (10/10) = 0.5` vs. `P(Heads|data) ∝ (1/2) * (10/1000) = 0.005` → **1:200 for Tails** (correct)  
      - SIA: Prior already weights Heads 100× more, *but* likelihood favours Tails 100× (all old quarter vs 1%). Net effect: **1:1** (correct).  
  - **Why this case?** It’s self-contained, shows SIA’s prior boost *and* its cancellation via evidence. Avoids Doomsday’s ideological baggage.  

  **5 min: Link to presumptuous philosopher**  
  - **Ask:** "Why is SIA ‘presumptuous’? Imagine a theory where universe A has 1 trillion observers, B has 1 billion. *Before any data*, SIA says A is 1000× more likely. But shouldn’t evidence come first?"  
  - **Punchline:** Your case *is* a non-cosmological stand-in! SIA’s 100:1 prior (for Heads/large universe) is "presumptuous"; the old quarter evidence then forces humility.  

  **Last 10 min: SSA vs SIA takeaways + closer**  
  - Contrast how each handles indexical evidence:  
    - SSA: Treats "who I am" as random sampling (updates *hard* on individual traits).  
    - SIA: Treats "that I exist" as evidence for larger worlds (updates *less* on individual traits).  
  - **Closer Q (5 min):**  
    > *"You’re the 10th human born. Later, you learn humans 1-9 had brown eyes, but you have blue eyes — a rare mutation. Does SSA or SIA shift *more* on learning your eye colour? Why?"*  
    **Answer:** SSA shifts more. SSA treats "I am person #10" as random → rare trait is surprising. SIA’s prior already favoured large populations → less shocked by individual variation.  

  ---

  ### **2. Handling Misconceptions**  
  **In order of appearance:**  
  - **"This is just selection bias!"** (Likely when intro’ing indexical evidence)  
    *Shut down fast:* "Selection bias assumes a *sampled* cohort. Here, it’s ontological: you couldn’t ‘select’ a non-existent observer. Different Bayes factors!" Show `P(E|H)` differs.  
  - **"SSA = assume you’re median"** (During town case)  
    *Preempt:* Explicitly state SSA doesn’t assume mediocrity — it weights by observer-count in each world. Write the denominator: `P(data) = ∑ P(data|world) P(world)`.  
  - **"It depends on future humans!"** (Post-toy case)  
    *Neutralise:* "For now, assume static worlds (no future observers). SIA/SSA apply to *current* observer sets. Cosmology complicates this — park it for today."  
  - **Fatal if lingering:** The "selection bias" objection. If unchecked, it reduces anthropics to sampling theory — kill it in the first 10 min.  

  ---

  ### **3. What to Explicitly Exclude**  
  State upfront:  
  - **"We won’t solve reference classes today** (e.g., ‘What counts as an observer?’). Assume idealized cases."  
  - **"No Sleeping Beauty or duplication paradoxes** — different issues, though they share DNA."  
  - **"We’re ignoring quantum immortality** and simulation hypotheses — focus on the core dilemma."  
  - **"Doomsday Argument is intentionally skipped** — it’s a rabbit hole. Our toy model isolates the machinery cleanly."  

  ---

  ### **4. Why Your Toy Case Works**  
  - **Arithmetic is correct** (as shown above).  
  - **Symmetry is a feature:** The 1:1 result *demonstrates* SIA isn’t "bigger=better" — it demands consistency.  
  - **Presumptuousness is visible:** SIA’s extreme prior (100:1) *without evidence* is the philosopher’s hubris. The cancellation *is* the lesson.  
  - **Tweak for clarity:** Label residents. E.g., in Heads world, tag 1-1000 (old quarter = 1-10); in Tails, 1-10 = all residents. Stops "old quarter" being misread as *geographic* evidence.  

  ---

  ### **Timeline Cheat Sheet**  
  - **0-10 min:** Existence as evidence (amnesia room → Bayes).  
  - **10-25 min:** Town/village case (Stages 1 & 2 on whiteboard).  
  - **25-30 min:** Presumptuous philosopher link.  
  - **30-40 min:** General principles + eye colour closer.  
  - **40-45 min:** Wild Q&A (brace for "What about Boltzmann brains?").  

  This flow forces them to *use* SSA/SIA in calculations, not just debate them. The toy model is your workhorse — it’s airtight for the basics. Good luck with the postgrads!
