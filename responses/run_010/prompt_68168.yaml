  *(Next to "the evidence about the horses is decisive... in a way that the evidence about permissibility is not")* **? This needs development. Why is the paddock evidence 'decisive' *before* they disagree? The dispute suggests it isn't decisive *for them*. How does this differ structurally from the ethics case? The steadfast view struggles here.**  
  *(Next to "Whether that's satisfying depends on whether you think...")* **? The question asks you to evaluate whether the steadfast view gives a *plausible* answer here. You need to take a position on that, not defer.**  
