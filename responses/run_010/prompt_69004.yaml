  I should check if there's a specific term for the scaling issue. "Non-aggregative harm" comes to mind, but that might not be standard. Maybe "discontinuous disutility" or "threshold-based incommensurability." But the latter isn't common. The closest established concept is lexical disutility, but with the caveat that aggregation above the line isn't defined. 

