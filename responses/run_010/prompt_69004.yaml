  Next, considering philosophical frameworks. Lexical disutility is a candidate, but the scaling problem isn't resolved in standard definitions. Terms like "absolute deontological constraint" might relate but don't address aggregation. The aggregation issue above the line needs a specific term. "Lexical disutility" itself might be the closest, but the user wants the scaling aspect clarified.

  The user also brings up the torture vs. dust specks thought experiment. This ties into whether small harms can sum to a large one. If the awful suffering is lexical, then no amount of small harms can compare, which aligns with one side of their sister's argument. The ambiguity in defining the boundary touches on the Sorites paradox, where precise thresholds are elusive but the categories are still valid.

