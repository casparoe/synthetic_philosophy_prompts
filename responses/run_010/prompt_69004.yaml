  Confidence levels: High on lexical disutility for the two-tier structure. Medium on non-aggregative harm as a description. Low on specific terms for the scaling issue since it's an inherent ambiguity in the framework. The least defensible claim might be suggesting "lexical disutility" directly addresses the scaling problem, as it doesn't resolve whether multiple instances aggregate.

