          R5: fortune=Cautious -> Act:2
          Total: 0+2+0-1+2 = 3

     Bold player who did well:
          R1: Act:2
          R2: Act:0
          R3: Act:2
          R4: flood: has defense=0 -> lose 3 -> 2+0+2-3 = 1
          R5: Act:0 -> 1

     But then the cautious player has 3 and bold has 1.

     Why didn't the bold player prepare? They might have in R3.

     Bold player with preparation in R3:
          R1:2, R2:0, R3: Prepare (defense=1) -> 0, R4: lose 1 -> total=2-1=1, R5:0 -> 1

     Still 1.

     But if we change R5 to favorable to bold? Then:

     Proposed fortune sequence:

     Round 1: Bold (favorable to bold)
     Round 2: Cautious
     Round 3: Bold
     Round 4: Flood
     Round 5: Bold

     Then:

     Cautious player:
          R1: Act ->0
          R2: Act ->2
          R3: Prepare ->0, defense=1
          R4: flood -> lose 1 -> 0+2+0-1 = 1
          R5: Act ->0 (because cautious acting in bold favorable) -> total=1

     Bold player:
          R1:2
          R2:0
          R3: Act ->2
          R4: flood: if defense=0 -> lose 3 -> 2+0+2-3=1
          R5: Act ->2 -> total=3

     Now the bold player has 3 and cautious has 1.

     But we want both to do well? How can a cautious player do well in this sequence? They only have one favorable round (R2) and R5 is bold. So they get only 2 from R2 and then lose 1 in flood -> net 1.

     Unless they prepare in R2? Then:

     Cautious player:
          R1:0
          R2: Prepare ->0, defense=1
          R3: Act ->0 (because cautious in bold) ->0
          R4: lose 1 -> -1
          R5:0 -> -1

     Worse.

     So let's make the sequence more balanced:

     Round 1: Bold (B)
     Round 2: Cautious (C)
     Round 3: Cautious (C)   [changed from Bold]
     Round 4: Flood
     Round 5: Bold (B)

     Then:

     Cautious player:
          R1: Act ->0
          R2: Act ->2
          R3: Act ->2 -> total=4
          R4: flood: if no defense -> lose 3 -> 1
          R5:0 ->1

     But if they prepare in R3 (which was cautious favorable, so they give up 2 points for defense):
          R1:0
          R2:2
          R3: Prepare ->0, defense=1 -> total=2
          R4: lose 1 -> 1
          R5:0 ->1

     Still 1.

     With two preparations (say in R1 and R2, but R1 they would get 0 anyway, R2 they would get 2 but they prepare -> so they get 0 in R2 and defense=1; then R3: act in cautious ->2, defense=1; R4: lose 1 -> 2-1=1; R5:0 ->1)

     So they end with 1.

     Bold player:
          R1:2
          R2:0
          R3:0   (because round3 is cautious)
          R4: flood: lose 3 -> 2-3 = -1
          R5:2 ->1

     So both are around 1.

     This is not high scores.

     We need to increase the points or reduce the flood penalty.

     Let's try:

     Favorable act: +3 points
     Unfavorable act: 0
     Flood: without defense: -4
             with 1 defense: -2
             with 2 defense: 0
     Prepare: 0 points, +1 defense

     Sequence: R1:B, R2:C, R3:C, R4:Flood, R5:B

     Cautious player who acts in R2 and R3 (favorable) and does nothing else:
          R1:0
          R2:3 ->3
          R3:3 ->6
          R4: -4 ->2
          R5:0 ->2

     Cautious player who prepares in R3 (giving up 3 points in R3):
          R1:0
          R2:3 ->3
          R3: Prepare ->0, defense=1 ->3
          R4: -2 ->1
          R5:0 ->1   (worse than not preparing)

     Then why prepare? Only if you prepare twice:

          R1: Prepare ->0, defense=1
          R2: Prepare ->0, defense=2
          R3: Act ->3 ->3
          R4: 0 (because defense>=2) ->3
          R5:0 ->3

     That's better than the non-prepared cautious player (3 vs 2). And better than the prepared once.

     Bold player who acts only:
          R1:3
          R2:0 ->3
          R3:0 ->3
          R4: -4 -> -1
          R5:3 ->2

     Bold player who prepares in R1:
          R1: Prepare ->0, defense=1
          R2:0 ->0
          R3:0 ->0
          R4: -2 -> -2
          R5:3 ->1

     Bold player who prepares in R1 and R2:
          R1: Prepare ->0, defense=1
          R2: Prepare ->0, defense=2
          R3:0 ->0
          R4:0 ->0
          R5:3 ->3

     So they get 3, which is good.

     And a cautious player who prepares twice also gets 3.

     So now, a cautious player and a bold player can both get 3 by preparing twice and then acting in their favorable rounds.

     But the cautious player's favorable rounds were R2 and R3, and they gave up R2 to prepare? Then they only acted in R3 (and got 3) and then R4 they were safe and R5 they didn't act well. So they have 3.

     The bold player's favorable rounds are R1 and R5. They gave up R1 and R2 to prepare, then in R5 they acted and got 3.

     So both have 3.

     And a player who didn't prepare might have 2 (cautious) or 2 (bold) in the above examples.

     Now, the cost of switching: if a bold player sees that there are two cautious rounds (R2 and R3) and decides to switch to cautious in R2, then:

          R1: Act ->3
          R2: Switch: lose 1 point -> 3-1=2, and then at the end of R2, mode changed to cautious.
          R3: Act (now cautious) ->3 -> total=5
          R4: flood: no defense -> -4 ->1
          R5: Act (cautious in bold round) ->0 ->1

     So they end with 1.

     If they switch back in R4? But R4 is flood, and they can only act or switch. If they switch in R4, they pay 1 point and change to bold at the end of R4, then in R5 they are bold and act: +3, but they still suffer the flood loss.

          R1:3
          R2: switch to cautious: -1, mode becomes cautious at R3 start ->2
          R3: Act (cautious) ->3 ->5
          R4: switch to bold: -1, and suffer flood loss: -4 (no defense) ->5-1-4=0
          R5: Act (bold) ->3 ->3

     They end with 3, but that's the same as the player who prepared twice and didn't switch.

     And they had to pay two switch costs (2 points).

     So it's not clearly better.

     This seems workable.

     Summary of rules:

     - Each player starts as cautious or bold (assigned randomly).
     - Each round, players choose one action: Act, Prepare, or Switch (but in flood rounds, Prepare is not allowed? or is allowed but doesn't help for that flood? Let's allow it but it doesn't help for the current flood. So in flood round, if you prepare, you gain 1 defense (for future, but there is none) and you still suffer the loss. But since there's no future flood, it's useless. So players will avoid it.

     We can allow Prepare in flood rounds, but it's a waste.

     Alternatively, we can say that in flood rounds, the only available actions are Act and Switch. Let's do that to simplify.

     So in non-flood rounds: Act, Prepare, Switch
     In flood rounds: Act, Switch

     - When you choose Act:
          - If the fortune is favorable to your mode, you gain 3 points.
          - If not, you gain 0.
          - In flood rounds, you also suffer the flood loss (based on defense).

     - When you choose Prepare (non-flood only):
          - You gain 0 points, but you gain 1 defense (up to a maximum of 3).

     - When you choose Switch:
          - You lose 1 point.
          - Your mode changes at the end of the round (so next round you are the new mode).

     - In flood rounds, regardless of action, you suffer flood loss: 
          loss = 4 if defense=0
                 2 if defense=1
                 0 if defense>=2

     - Defense persists across rounds.

     - The fortune deck for the class (fixed sequence for simplicity, but you can randomize if you want):

          Round 1: Bold
          Round 2: Cautious
          Round 3: Cautious
          Round 4: Flood
          Round 5: Bold

     - Omens:

          Round 1: "The wind is at your back, urging speed and daring."
          Round 2: "The waters are calm, inviting careful navigation."
          Round 3: "Dark clouds gather on the horizon; the air grows heavy."
          Round 4: "The river swells and roars! Dikes are tested."
          Round 5: "The storm has passed, but the ground is soft and treacherous."

     Now, the debrief:

     Map the game to Machiavelli:

     - The fixed modes at the start: one's nature.
     - The changing times: the fortune sequence.
     - Preparation (building defenses) during fair weather: the barriers against fortune.
     - The flood round: the unpredictable disaster that can be mitigated only by prior preparation.
     - Switching modes: costly and lagged (takes a round and costs a point) and may not fit the next times.

     The final tally: in our example, cautious and bold players can both score well by building defenses (twice) and then acting when it's their turn. The player who fits the times and has prepared will do well. The one who doesn't fit and hasn't prepared will do poorly.

     What cannot be reproduced by a points game:

     - Machiavelli's virtù is not just about accumulating points but about seizing opportunities and maintaining the state. The game reduces virtù to a choice of action and preparation. It doesn't capture the charisma, cunning, or force of will that Machiavelli describes.

     - Also, the game is individualistic, but a prince's virtù is also about how they interact with others (nobles, people, soldiers) which is not modeled.

     - The game cannot capture the idea that virtù can sometimes change fortune (by bold action) because in the game, fortune is external and fixed.

     Predictable problems:

     - Some players might not prepare at all and then get wiped out by the flood, then complain that the game is about being bold and taking risks. But then they see that the players who prepared did better? We hope.

     - The scores might be too close and the pattern not clear. To mitigate, you can walk around and remind players of the omens and the possibility of flood.

     - Players might all choose the same action, so you don't see divergence. But at each table, with 2 cautious and 2 bold, and different choices about preparation, you should see variation.

     - Time might run short. Keep to the schedule strictly.

     Let's write the full rules for the students.

     Materials per table:
     - 4 mode cards (2 cautious, 2 bold) [or more likely, 4 cards: 2 labeled "Cautious", 2 "Bold"]
     - Action cards: for each player, a set of: "Act", "Prepare", "Switch" (maybe 3 of each per player? or one set per table to share? Better: per player, a set of three cards: Act, Prepare, Switch. They choose one to play each round.)
     - Player tracking sheet (or a whiteboard? or just paper):

          Name:
          Mode: (can change)
          Defense: 0,1,2,...
          Points: ___

     - Fortune and omens are announced by instructor.

     Rules handout (brief):

     "You are a prince in a time of changing fortune. Your goal is to accumulate as many points as possible.

     - You start the game either Cautious or Bold.
     - Each round, you choose one action:
          * Act: You act according to your current mode.
               - If the times (fortune) are favorable to your mode, you gain 3 points.
               - If not, you gain 0 points.
               - In a flood round, you also suffer a loss (see below).
          * Prepare: (Not allowed in flood rounds) You spend the round building defenses. You gain 0 points, but you increase your defense by 1 (up to a maximum of 3).
          * Switch: You spend the round changing your mode (from cautious to bold or vice versa). You lose 1 point, and at the end of the round, your mode changes.

     - In a flood round:
          * The Prepare action is not allowed.
          * Every player suffers a loss of points based on their defense:
               - Defense 0: lose 4 points
               - Defense 1: lose 2 points
               - Defense 2 or 3: lose 0 points

     - The instructor will announce an omen at the start of each round, which may give a hint about the fortune of that round.
     - After all players have chosen their actions, the fortune for the round will be revealed.

     We will play 5 rounds. After round 5, the player with the most points wins."

     Then you can award candy to the top scorer at each table and a participation bump for all.

     Debrief questions:

     - Raise your hand if you were cautious and ended with more than 3 points? How did you do it?
     - Bold with more than 3?
     - Who prepared at least once? Did it help?
     - Who switched modes? Did it work out?
     - In round 3, when the omen was "dark clouds", what did you do? Why?
     - How does this illustrate Machiavelli's ideas in chapter 25?

     Points to make:

     - The game shows that neither cautious nor bold is inherently better; it depends on the times.
     - Preparation during good times seemed costly (giving up 3 points in a favorable round) but could save you from disaster.
     - Switching modes was costly and didn't always work because the times kept changing.
     - The final scores: ask the class if they think fortune or their choices (virtù) mattered more? In the pattern, both mattered: virtù to prepare and to act when the times fit, and fortune to provide the opportunities and challenges.

     And the feature that a points game cannot reproduce: the deeper virtù of leadership, which includes inspiring loyalty, making tough decisions that aren't point-maximizing in the short term, and the moral ambiguity that Machiavelli discusses.

     This should fit in 50 minutes with careful timing.
answer: |-
  ### **Machiavelli's River of Fortune: Game Design**

  **Objective:** Players accumulate points through actions aligned with their mode (Cautious or Bold) and preparation for a "flood" event. Success depends on matching your mode to the "times," investing in defenses during fair weather, and navigating uncertainty.

  ---

  ### **Materials (Prep Time: 45–60 Minutes)**
  1. **Player Kits (Per Table):**
     - 4 Mode Tokens (2 × "Cautious", 2 × "Bold")
     - 4 Action Cards per player (labeled: "ACT", "PREPARE", "SWITCH")
     - 1 Defense Tracker per player (cardboard with slots for 0–3 "Barrier" tokens)
     - 24 Barrier Tokens (small cardboard squares; 6 per table)
     - 1 Fortune Deck (15 cards: 6 × Bold, 6 × Cautious, 3 × Flood)
     - 1 Omen Deck (15 cards: 5 × Storm, 5 × Calm, 5 × Change)
     - Score Sheets (pen/paper to track points)

  2. **Classroom Setup:**
     - 6 tables of 4 students each.
     - Candy prizes for top 3 scorers per table + participation bump for all.

  ---

  ### **Rules**
  #### **Setup (5 Minutes)**
  - Each player draws a Mode Token (Cautious/Bold) at random. **This is fixed for the game**.
  - All start with:  
    - **0 points**  
    - **0 Barriers** (Defense level)  
    - Mode cannot change until a SWITCH action is taken.
  - Shuffle Fortune/Omen decks per table.

  #### **Round Structure (5 Rounds × 6 Minutes = 30 Minutes)**
  Each round has 4 phases:
  1. **Omen (1 Minute):**  
     - Draw 1 Omen Card and read aloud:  
       - **Storm:** "Dark clouds gather..." (hints at Flood)  
       - **Calm:** "Winds are gentle..." (hints at Bold/Cautious)  
       - **Change:** "The river shifts course..." (uncertain).  
     - *Players see omens from other tables* (e.g., "Table 3 reports storm clouds").

  2. **Action Selection (2 Minutes):**  
     Players secretly choose an Action Card:  
     - **ACT:** Align with your mode.  
     - **PREPARE:** Spend turn building Barriers. Gain 0 points.  
     - **SWITCH:** Begin changing mode (costs 1 point; mode flips next round).  

  3. **Reveal & Resolve (2 Minutes):**  
     - Draw 1 Fortune Card:  
       - **Bold Times:** Rewards Bold players.  
       - **Cautious Times:** Rewards Cautious players.  
       - **Flood:** All suffer penalties (mitigated by Barriers).  
     - Resolve actions:  
       - **ACT + Favorable Times:** +3 points.  
       - **ACT + Unfavorable Times:** +0 points.  
       - **PREPARE:** +1 Barrier (max 3).  
       - **SWITCH:** -1 point; mode changes *next* round.  
       - **Flood Round (All Players):** Lose points = `4 - Barriers` (e.g., 0 Barriers = -4, 3 Barriers = -1).  

  4. **Update (1 Minute):**  
     - Adjust points/Barriers.  
     - Record Fortune result for other tables to see (e.g., "Table 4: Flood!").

  #### **Scoring**
  - Points from actions (ACT/PREPARE/SWITCH) + Flood penalties.  
  - **Winning:** Top scorer per table wins candy. Top 3 get participation bumps.

  ---

  ### **Fortune Sequence (Pre-Determined for Balance)**
  | Round | Fortune      | Omen       | Notes                                  |
  |-------|--------------|------------|----------------------------------------|
  | 1     | Bold Times   | Calm       | Fair weather: Bold thrives.            |
  | 2     | Cautious Times | Change     | Cautious thrives.                      |
  | 3     | Bold Times   | Calm       | Bold thrives; last chance to prepare.  |
  | 4     | **Flood**    | **Storm**  | Barriers pay off.                      |
  | 5     | Cautious Times | Change     | Cautious thrives; unprepared suffer.   |

  ---

  ### **Timeline (50 Minutes Total)**
  1. **0–5 min:** Setup, assign modes, explain rules.  
  2. **5–35 min:** 5 Rounds (6 min each).  
  3. **35–40 min:** Final scoring (top 3 per table).  
  4. **40–50 min:** Debrief (discuss Machiavelli connections).

  ---

  ### **Debrief: Mapping Game → Machiavelli**
  #### **Key Moments**
  - **Fixed Modes:** Players start Cautious or Bold.  
    - → *"Nature inclines men to one mode" (Ch. 25)*.  
  - **Round 4 (Flood):** Barriers built in Rounds 1–3 pay off.  
    - → *"Fortune is a raging river... dikes restrain her fury" (Ch. 25)*.  
  - **Switching Costs:** -1 point + lagged change.  
    - → *"He cannot deviate from what nature inclines him to... cannot persuade himself to abandon a path that brought success" (Ch. 25)*.  
  - **Final Tally:**  
    - Top scorers include both modes (e.g., Bold in Rounds 1/3; Cautious in Rounds 2/5).  
    - → *"Success depends on the fit between one’s mode and the times" (Ch. 25)*.  

  #### **Fortune vs. Virtù**
  - **Fortune’s Role:** 50% of outcomes (Flood Round + random Fortune draws).  
    - → *"Fortune governs one half of our actions... leaves the other half to us" (Ch. 25)*.  
  - **Virtù’s Role:** Fitting mode to times, preparing for floods.  
  - **Game’s Lesson:** Neither mode is "better"—victory comes from *adaptation* and *preparation*.

  ---

  ### **Predictable Problems & Solutions**
  1. **"Just be Bold!" Degeneration:**  
     - **Risk:** Bold players win Rounds 1/3, tempting others to switch.  
     - **Reality:** Switching costs -1 point + lag. Unprepared players lose big in Flood (Round 4).  
     - **Mitigation:** Emphasize during debrief that Cautious players win Rounds 2/5, and barriers saved prepared players.

  2. **Barriers Feel "Wasteful":**  
     - Players who PREPARED in Rounds 1–3 earn 0 points initially.  
     - **Teaching Moment:** Round 4 reveals barriers weren’t wasted—they prevent disaster.  

  3. **Structural Limitations of the Game:**  
     - **What’s Missing:** Machiavelli’s *ruthlessness*. The game rewards point-maximizing, not amoral power grabs.  
     - **Supply by Hand:** Discuss in debrief:  
       - *"Virtù requires breaking promises, using force—things a ‘fair’ game can’t model"* (Ch. 7, 18).  
       - *"Real virtù isn’t points—it’s seizing opportunity without hesitation"* (e.g., Borgia in Ch. 7).

  ---

  ### **Why This Works**
  - **Fit Over Character:** Cautious/Bold players both win if they match the times.  
  - **Barriers = Dikes:** Preparation feels futile until the flood hits.  
  - **Switching = Costly:** Changing mode is possible but punished, mirroring inertia.  
  - **Debrief Closes the Loop:** Explicitly ties mechanics to Machiavelli’s claims.  

  Run it, and let the river flow! 🌊
