prompt: |-
  I'm on a small working group drafting a policy on official apologies, and before we start squabbling about individual cases I'd like to know what we'd even be squabbling about. So: write the spec. What does a theory of state apology have to deliver before it's any use to us?

  Give me the requirements list, each one with the case or consideration behind it — what the theory has to explain (why some official apologies seem to change something and others are just noise), which distinctions it can't collapse, which plain facts about states it can't contradict. Then mark which requirements are non-negotiable and which are really one camp's commitments dressed up as criteria, and if some subset of them can't be jointly satisfied, say so and say which one gets dropped — I've a feeling that's where the actual answer is hiding.

  Two things make our situation unusual, and I want the list built around them rather than around the easy textbook cases:

  1. The state doing the apologising isn't the state that did the wrong, and not merely because of the usual gap of generations. Think of a successor state that came into being partly *because* of the wrong — founded by people the old regime persecuted, now governing the territory, treaties, reserves, buildings, debts and legal obligations it inherited from that regime, while officially treating the regime as illegitimate and itself as one of the regime's victims. So it keeps the assets and repudiates the deeds. A theory that demands identity with the wrongdoer makes apology impossible for such a state; a theory that says repudiation is enough lets it keep everything and pay nothing. I need the list to say what it owes us here instead of dodging between those two.

  2. Some of the wrongs are ongoing — the policy being apologised for hasn't stopped, or has stopped only in the sense that its effects are still being administered by the same office that's now saying sorry. So don't let the requirements assume an apology is a one-off speech act about a finished past. Tell me what has to be true of a state for an apology about a still-running practice to be anything other than a performance.

  Also, please don't let the list quietly assume the apologising state is a democracy speaking on behalf of consenting citizens. Half our comparators aren't. I'm not convinced the criteria change, but if you think they do, flag which requirement is doing the changing and why.

  Once you've got the list: name the single requirement that knocks out the most otherwise plausible theories, and say what giving it up would cost us. And briefly — very briefly, a few lines, I don't want a scorecard — how the two accounts people actually reach for in practice do against it: the one that treats the state as a continuous corporate person who can repent, and the one that treats apology as a gesture aimed at the living rather than at the dead.

  British English please. No reading list, no citations — we'll do our own homework, I just want the criteria.
reasoning: |-
  Okay, let me unpack this complex policy drafting request. The user is part of a working group on official apologies facing two unique challenges: a successor state apologizing for predecessor regimes it repudiates yet inherits from, and apologies for ongoing harms. They want a rigorous framework to evaluate apology theories, avoiding academic abstractions and political squabbles.

  Hmm, the core tension lies in balancing moral accountability with practical statecraft. The successor state paradox is particularly thorny - how can you disavow a regime's actions while administering its lingering structures? And ongoing wrongs make apologies feel performative unless tied to concrete change. 

  First, I need to establish non-negotiable foundations. The apology must recognize specific victims (dead and living), acknowledge ongoing harm mechanisms, and avoid historical revisionism. These are bedrock - without them, apologies become empty theater. The corporate continuity model fails here because it would force the successor state to fully own predecessor crimes, contradicting its founding legitimacy. 

  For the successor state dilemma, I'll propose "attributed inheritance" as a key requirement: the state must accept moral responsibility for administering inherited harm structures while distinguishing its current identity from the perpetrator regime. This avoids both blanket repudiation (which excuses inaction) and full identification (which undermines sovereignty). 

  Regarding ongoing harms, the apology must include verifiable cessation plans. Otherwise it's just PR. This requirement alone disqualifies most ceremonial apologies we've seen historically. 

  Interesting how democracy isn't essential - authoritarian states can issue valid apologies if they meet the core criteria, though implementation differs. The corporate personhood theory struggles most with the inheritance requirement, while "gesture to the living" fails on intergenerational justice. 

  The real trade-off emerges between comprehensiveness and feasibility. Demanding full reparations might paralyze action, but settling for symbolic gestures betrays victims. The minimal viable position? Attribution + cessation + material acknowledgment. Anything less risks becoming part of the harm itself.
answer: |-
  Here’s a requirements list for a theory of state apology, tailored to your two core challenges and stripped of democratic/non-democratic assumptions. Non-negotiable criteria (NN) are marked; others may reflect tensions between camps. Conflicts are noted where they arise.

  ---

  ### **Core Requirements for a Theory of State Apology**  
  *(British English; no citations)*  

  1. **Attributed Inheritance (NN)**  
     *Why*: Your successor state inherits assets/structures from a regime it repudiates. The theory must resolve the "keep assets, reject deeds" paradox.  
     *Requirement*: Must define **moral responsibility for administering inherited harm structures** (e.g., land titles, laws, economic disparities) without requiring identity with the perpetrator. Rejects both "total continuity" (apology impossible) and "total repudiation" (no obligation).  

  2. **Harm-Legacy Binding (NN)**  
     *Why*: Apologies for historical wrongs often ignore that victims’ descendants suffer ongoing material/psychological harm (e.g., dispossession, stigma).  
     *Requirement*: Must **treat the living as primary claimants**, not merely "representatives" of the dead. The apology must address **contemporary systems propagating harm**.  

  3. **Non-Performativity Test for Ongoing Wrongs (NN)**  
     *Why*: If the state apologises while still administering the harmful policy (e.g., discriminatory welfare rules), it’s hollow.  
     *Requirement*: An apology must include **verifiable cessation or transformation of the harmful practice**. No "sorry" without stopping the act.  

  4. **Authority-Capacity Link**  
     *Why*: Non-democracies (e.g., one-party states) may apologise, but legitimacy depends on whether the apology reflects victims’ needs, not just regime interests.  
     *Requirement*: The state must **demonstrate capacity to redress harm** (resources, power) and **authority derived from victims’ recognition**, not just legal sovereignty.  

  5. **Distinction: Culpability vs. Responsibility**  
     *Why*: Your successor state wasn’t the perpetrator but *is* the custodian of harm. Collapsing this distinction excuses inaction.  
     *Requirement*: Must separate **culpability (moral guilt of perpetrators)** from **responsibility (duty to repair by current custodians)**.  

  6. **Materiality Criterion (NN)**  
     *Why*: Symbolic apologies without restitution ("cheap talk") fail victims (e.g., Australia’s "Stolen Generations" apology initially lacked compensation).  
     *Requirement*: Apology must **commit to material acknowledgment** (e.g., reparations, land return, institutional reform) proportional to harm.  

  7. **Temporal Continuity Without Anachronism**  
     *Why*: States often dismiss past wrongs as "products of their time." This erases victims’ experiences.  
     *Requirement*: Must **condemn the wrong by the ethical standards of its era** (e.g., colonisers knew genocide was wrong; critics existed).  

  8. **Public Truth-Telling (NN)**  
     *Why*: Denialism persists if the state’s narrative is vague (e.g., Japan’s equivocal WWII apologies).  
     *Requirement*: Apology must **specify acts, victims, and perpetrators** in accessible records (laws, education, monuments).  

  ---

  ### **Conflicts & Trade-offs**  
  - **Irresolvable Tension**: **Materiality vs. Feasibility**. Full reparations may bankrupt states (e.g., reparations for transatlantic slavery). *Trade-off*: Prioritise **progressive realisation** (e.g., phased reparations) but reject theories that erase materiality entirely.  
  - **Contested Requirement**: *Authority-Capacity Link*. Non-democracies argue "state prerogative" trumps victim recognition. *Cost of dropping it*: Apologies become tools of regime legitimisation, not justice.  

  ---

  ### **The Theory-Killer Requirement**  
  **Non-Performativity Test for Ongoing Wrongs** (Requirement #3)  
  - *Why it kills theories*: Most models assume apologies are retrospective. If harm continues, "repentant corporate person" theories fail (the state is actively sinning). "Gesture to the living" theories become cynical without cessation.  
  - *Cost of dropping it*: Apologies actively obscure ongoing harm (e.g., Canada apologising for residential schools while underfunding Indigenous healthcare).  

  ---

  ### **Two Common Accounts vs. the Killer Requirement**  
  1. **State as Corporate Person ("Repentance Model")**  
     - Fails #3: Assumes wrongs are past. If harm continues, the state is hypocritical, not repentant.  

  2. **Apology as Gesture to the Living ("Presentist Model")**  
     - Fails #3: Focuses on symbolic healing but lacks teeth to stop ongoing harm. Risk: "Sorry we’re starving you" while starvation continues.  

  ---  
  **Your Answer**: The successor state’s obligation is to:  
  **(1) Cessation** (stop ongoing harm),  
  **(2) Custodial repair** (redress inherited harms using inherited assets),  
  **(3) Public truth** (name perpetrators ≠ itself but detail its custodial role).  
  The rest is negotiation; these are non-negotiable.
