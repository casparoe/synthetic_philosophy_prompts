prompt: |-
  I am at work on a novel whose central section is a constitutional convention conducted behind an information screen: the delegates are to settle the basic arrangements of a small polity after a collapse, and they settle them without knowing which household, which body, or which trade they will occupy once the screen is lifted. The device is borrowed, and I am not trying to write a treatise. I am trying to write delegates who quarrel for reasons that survive rereading. To that end I have spent some weeks inventing cases and recording my own verdicts on them, and the verdicts have turned out not to add up. I should like to know what principle, if any, they do add up to.

  The cases, and what I think about each.

  One. A valley with a single mill, owned by one family. The millers are vastly better off than anyone else. But the landless laborers are better off than they would be under any arrangement the convention can actually put in place: better than under a workers' cooperative that could employ only half of them, better than under a parceling of the mill among households. I judge this just, and I judge that no further account of the family's fortune is owed to anyone. My discomfort at the sheer size of the gap strikes me as a sentiment I have no business legislating.

  Two. The same valley, the same numbers for the laborers, except that the family's position now rests on a standing prohibition against laborers pooling capital to build a second mill. The laborers remain, as it happens, better off than under anything the convention could implement, since no one has credit. I judge this unjust. I notice that in the first case I looked only at where people ended up, and here I am looking at the rule that put them there, and I cannot say why the second way of looking seems more honest than the first.

  Three. A polity that taxes the earnings of a gifted surgeon at a punishing rate to fund clinics for the worst-off, and thereby funds those clinics. I judge this just. The same polity, drafting that surgeon for two years to staff the same clinics, producing exactly the same clinics and exactly the same distribution of goods. I judge this unjust, and the two outcomes are indistinguishable by any measure I have been using. Whatever the difference is, it seems to be about the person rather than about her share.

  Four. A polity in which the worst-off group can be raised to the highest attainable level only by a levy that hollows out the middle — clerks, smallholders, the valley's midwives — so that the result is a comfortable floor, a ruined middle, and a small top. The worst off are at their maximum. I judge it unjust all the same.

  Five. A polity that has drawn down its aquifer and exhausted its topsoil to raise the bundle of goods going to the least advantaged, who are now better off than their parents were and will have children worse off than themselves. I judge this unjust, and I sense that it is a different species of injustice from the first four, not a distribution among contemporaries gone wrong.

  Six. A woman who uses a wheelchair. Under an arrangement that maximizes the goods going to the least advantaged, her bundle is at its maximum and she still cannot get into the assembly hall. I judge the arrangement unjust, and I do not think the remedy is to hand her more of the same goods, though I could not say what it is to hand her instead.

  Seven. A delegate from a small religious minority. I have been writing the screen as stripping the delegates of everything particular about themselves, but I find that I do not want it to strip her of the knowledge that her worship requires a building oriented a certain way and that a bare majority would outvote her on it. I want a thinner screen than the one I have drafted, and I am not certain that this is not merely my wanting the novel to have an argument in it.

  My own tentative principle, which I suspect is two unrelated halves stapled together: an arrangement is just when those worst off under it are as well off as the convention can make them, and when no one under it can truthfully say that the arrangement was contrived to place them where they are.

  What I want back. State the principle, or the small number of genuinely rival candidate principles, precisely enough that a delegate could argue from it against another delegate. For each clause, name the case that earns it. Tell me whether the rivals are actually distinct or one principle fitted with different epicycles. Then give me the principle's verdicts on three cases I have not listed: whether the screen should strip a delegate of knowledge of her own talents; what follows about an arrangement that maximizes the least advantaged group's bundle but delivers it entirely in a form that group does not want; and whether a delegate who knows she belongs to the worst-off group and votes against the maximizing arrangement out of resentment has been treated unjustly. Finally, tell me plainly which of my seven verdicts the principle cannot accommodate, and — if I am forced to choose between a principle that buys all seven at the cost of complexity and a spare one that costs me a verdict — which verdict I should surrender first, and why that one.
reasoning: |-
  Okay, the user is writing a novel centered around a constitutional convention behind an information screen—delegates design a society without knowing their future positions. They've created seven cases to explore justice principles but found their verdicts inconsistent. Their main goal is to find a coherent principle for justice that delegates can argue from.

  First, I need to look at each case and their verdicts. Case One: Monopoly mill where laborers are better off than alternatives. They see it as just despite wealth gap. Case Two: Same but with a prohibition on building another mill. They see this as unjust. The difference seems to be about rules vs outcomes.

  Case Three: Taxing a surgeon vs drafting them. They find taxing just but drafting unjust. Here, coercion/personal autonomy is key. Case Four: Sacrificing the middle class to raise the worst-off. Unjust, even if worst-off are maximized. Suggests concern for all groups, not just the bottom.

  Case Five: Depleting resources for current poor, harming future generations. Unjust, different type—intergenerational justice. Case Six: Wheelchair user can't access assembly despite max goods. Injustice isn't about quantity but accessibility/recognition. Case Seven: Religious minority delegate keeping knowledge of her needs. They want a thinner screen, indicating identity matters.

  Their tentative principle combines maximizing the worst-off's position and no targeted placement. But the cases suggest additional elements: procedural fairness (Case 2), autonomy (3), avoiding middle collapse (4), sustainability (5), accessibility (6), and recognition of identity (7).

  The user needs rival principles precise enough for delegates to argue. Let's outline them:
  1. **Strong Maximin**: Focus solely on the worst-off group's absolute position.
  2. **Anti-Targeting Principle**: Maximize the worst-off but forbid arrangements designed to harm specific individuals.
  3. **Hybrid Principle**: Maximize the worst-off + procedural fairness + basic liberties.

  Now, applying these to new cases:
  - **Delegates' self-knowledge**: Should they know their talents? Anti-Targeting says yes (prevents exploitation), Hybrid allows if it protects autonomy. Strong Maximin might say no to prevent bias.
  - **Goods in unwanted form**: Maximizing bundle but delivered wrong. Hybrid requires responsiveness to needs; others might not.
  - **Resentful delegate voting against maximin**: Injustice? Anti-Targeting says no if not targeted; Hybrid focuses on fair process.

  From their verdicts, Case 5 (intergenerational) and Case 6 (accessibility) challenge all principles. Hybrid can handle accessibility via basic liberties but struggles with future generations. Case 4 (hollowed middle) is tough for Strong Maximin. Case 2 (prohibition) needs procedural fairness.

  The verdict to surrender first? Case One's acceptance of monopoly if outcomes are best. But Hybrid requires examining the rules (like Case 2), so maybe that inconsistency needs resolving. Prioritizing avoiding harm (Case 2) over absolute outcomes (Case 1).

  They should consider integrating non-domination, sustainability, and recognition. For the novel, delegates can argue these nuances, creating conflict. The Hybrid principle offers the most flexibility but requires complexity. Surrendering Case 1's verdict aligns with procedural fairness.
answer: |-
  Based on your cases and verdicts, your intuition points toward a *pluralist* theory of justice that prioritizes the worst-off but incorporates constraints against exploitation, coercion, domination, and disregard for basic capabilities or identity. Your discomfort with "outcome-only" assessments (Case 1 vs. 2) and focus on agency (Case 3), distribution *across* groups (Case 4), sustainability (Case 5), capabilities (Case 6), and identity (Case 7) suggests no single "spare" principle captures everything. Below are three genuinely rival principles distilled from your judgments, refined for delegate debate, with verdicts on your new cases and a recommendation.

  ---

  ### **Three Rival Principles for Delegates to Argue**
  *(Stated precisely for debate)*

  1.  **The Anti-Domination Maximin:**
      *   *Principle:* "An arrangement is just if it maximizes the bundle of all-purpose goods (e.g., wealth, resources) held by the least advantaged group, *provided it does not*:
          a)  **Create or rely on domination:** No group or individual is subject to arbitrary power preventing them from improving their position or exercising basic liberties (e.g., prohibitions on collective action, coercive drafts). (*Earned by Case 2 & 3b*)
          b)  **Cause avoidable collapse of intermediate positions:** The gains for the worst-off cannot come primarily by destroying the security or prospects of those above them but not at the top. (*Earned by Case 4*)
      *   *Distinctness:* Focuses on *power relations* (domination) and *structural stability* (avoiding hollowed middle) as constraints on maximizing the worst-off. It *assumes* goods are generally usable.

  2.  **The Capability-Secured Floor:**
      *   *Principle:* "An arrangement is just if it secures for every person a threshold level of *central capabilities* essential for a life of dignity (e.g., bodily health, senses/imagination, affiliation, political voice, control over environment), prioritizes raising those furthest below this threshold, and sustains the ecological basis for future generations to meet this threshold. Maximizing goods is secondary to securing capabilities." (*Earned by Case 5, 6, and the intergenerational concern implicit in 5*)
      *   *Distinctness:* Shifts focus from *goods* to *what people can actually do/be* (capabilities) and *sustainability*. It directly addresses disability (Case 6) and future harm (Case 5). Domination might violate capabilities (e.g., control over environment), but it's not the core focus.

  3.  **The Hybrid Fairness Principle (Closest to your tentative one, refined):**
      *   *Principle:* "An arrangement is just if:
          a)  **Maximin Condition:** It makes the least advantaged group as well off as possible in terms of their expected bundle of all-purpose goods *over time* (considering sustainability).
          b)  **Anti-Targeting Condition:** No individual or group can reasonably claim the rules were *designed* to exploit their specific vulnerabilities or fix them in a disadvantaged position *due to their identity or unchosen traits*.
          c)  **Basic Liberty Condition:** It guarantees fundamental liberties necessary to pursue one’s conception of the good (e.g., conscience, association, non-coerced occupation) compatible with like liberty for others.
          *(a) Earned by Cases 1, 3a; (b) Earned by Case 2, 3b, 7; (c) Earned by Case 3b, 6, 7)*
      *   *Distinctness:* Explicitly combines maximin goods, procedural fairness (anti-targeting), and core liberties. It directly addresses identity (Case 7), coercion (Case 3b), and exploitation (Case 2), while grounding Case 6 in liberty/control over environment.

  **Are they distinct?** Yes. They represent different core concerns:
  *   **Anti-Domination Maximin** focuses on *power imbalances* and *social structure stability*.
  *   **Capability-Secured Floor** focuses on *fundamental human functionings* and *ecological survival*.
  *   **Hybrid Fairness** focuses on *goods distribution*, *procedural fairness regarding identity/vulnerability*, and *core freedoms*.
  While overlaps exist (e.g., domination can violate capabilities/liberties), the starting points and primary tools differ. They are not merely epicycles of one idea.

  ---

  ### **Verdicts on Your New Cases (Using the Hybrid Fairness Principle as Baseline)**

  1.  **Should the screen strip knowledge of talents?**
      *   *Verdict:* **No, it should not.** (Per Anti-Targeting & Basic Liberty Conditions).
      *   *Reason:* Knowing one's talents is crucial for the Anti-Targeting test. A delegate must be able to ask: "Could these rules be designed to exploit *someone like me* (with my talents)?" Removing this knowledge prevents them from assessing if the arrangement fixes them unfairly due to an unchosen trait (their ability). It also relates to Basic Liberty – choosing how to use one's talents is fundamental. (*Aligned with your Case 7 intuition*).

  2.  **Maximized bundle, but delivered in unwanted form?**
      *   *Verdict:* **Unjust.** (Per Anti-Targeting & Basic Liberty Conditions, leaning towards Capability view).
      *   *Reason:* Delivering goods in a form the group systematically cannot use (e.g., only meat to vegetarians, only cash to people needing healthcare) strongly suggests the arrangement was not designed to genuinely improve *their* position, but perhaps to meet a technical maximin requirement cheaply or to fix them in disadvantage. It violates the spirit of Anti-Targeting (exploiting their specific preferences/vulnerabilities) and potentially Basic Liberty (control over environment/pursuit of their good). (*Echoes your Case 6 concern*).

  3.  **Delegate from worst-off group votes against maximizing arrangement out of resentment. Treated unjustly?**
      *   *Verdict:* **No, not *treated* unjustly by the convention process itself.** (Per Basic Liberty Condition).
      *   *Reason:* The Basic Liberty Condition includes political participation. The delegate has the liberty to vote based on resentment, just as others vote based on risk-aversion or ideology. The process treats her justly by giving her an equal voice. Whether the *outcome* is unjust depends on the other conditions. Her resentment doesn't automatically invalidate the arrangement or imply she was targeted. (*Contrasts with targeted exclusion in Case 7*).

  ---

  ### **Which Verdicts Does the Hybrid Principle Struggle With?**

  *   **Case 5 (Intergenerational Injustice):** The Hybrid Principle focuses on *current* worst-off and their lifetime expectations (Maximin Condition). While "over time" implies some sustainability, the profound harm to future generations *solely* to benefit the current poor isn't directly forbidden unless it violates Basic Liberty *for the future people* (a stretch) or Anti-Targeting *of them* (they don't exist yet). It captures the *recklessness*, but not the core injustice of sacrificing the future. **(The Capability-Secured Floor handles this best).**
  *   **Case 6 (Wheelchair Access):** The Hybrid Principle can argue injustice via Basic Liberty (inability to access assembly hinders political participation/affiliation) or Anti-Targeting (rules ignore a specific vulnerability). However, it requires framing the issue as a liberty or targeting violation, not a fundamental failure to secure a *capability* regardless of goods. It works, but less naturally than the Capability view.

  ---

  ### **Recommendation: Surrender Case 1, Embrace Controlled Complexity**

  *   **The Conflict:** You desire a "spare" principle but have 7 verdicts pointing to pluralism. Complexity is inherent in your judgments.
  *   **The Cost:** A truly spare principle (e.g., Pure Strong Maximin: "Maximize the worst-off's goods bundle, period.") forces you to surrender multiple verdicts: Case 2 (allows domination), Case 3b (allows drafting), Case 4 (allows hollowed middle), Case 5 (ignores future), Case 6 (ignores capabilities), Case 7 (ignores identity).
  *   **The Solution: Surrender Case 1 first.** Why?
      1.  **It's Your Weakest Intuition:** You acknowledge "discomfort" and that it conflicts with your reaction to Case 2. Case 1 relies *only* on the outcome, which you reject in Case 2. Surrendering Case 1 aligns your approach: outcomes matter, but *how they are produced* (rules against domination, like prohibiting mill-building) matters fundamentally for justice. A monopoly sustained purely by luck/geography might be reluctantly tolerated; one sustained by law preventing competition is unjust domination.
      2.  **It Unlocks Coherence:** Accepting that domination (Case 2) invalidates an arrangement, even with good outcomes, explains the difference between taxing (Case 3a - no domination) and drafting (Case 3b - domination/coercion). It becomes the key distinction missing in Case 1.
      3.  **It Fits the Hybrid Principle Best:** The Hybrid Principle *requires* examining rules for domination/exploitation (Anti-Targeting) and liberties (Basic Liberty). Case 1 fails this examination if the monopoly relies on anything other than pure, unchosen luck. Your discomfort was the clue.
      4.  **It Preserves Core Concerns:** Surrendering Case 1 sacrifices the *least* of your other verdicts. It doesn't touch autonomy (Case 3), the middle class (Case 4), the future (Case 5), disability (Case 6), or identity (Case 7). It focuses the complexity where your intuition demands it: on power and process.

  **Therefore: Adopt the Hybrid Fairness Principle (Maximin + Anti-Targeting + Basic Liberties), explicitly incorporating sustainability concerns ("over time" in Maximin) to partially address Case 5. Surrender your Case 1 verdict as inconsistent with your deeper rejection of domination in Case 2 and coercion in Case 3b. This creates a principle delegates can fiercely debate: Is this rule domination? Is that liberty fundamental? Does it truly maximize the worst-off sustainably? Does it target anyone? The complexity generates the quarrels you seek, grounded in the conflicts inherent in building a just society behind the veil.**
