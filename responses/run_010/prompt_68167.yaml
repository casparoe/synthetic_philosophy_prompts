answer: |-
  Your diagnosis is astute: this stalemate is indeed **structural**, rooted in three conflated questions operating under a single slogan. "Do artifacts have politics?" isn't a unified debate but a persistent collision of distinct inquiries, each demanding different modes of analysis. Here's a breakdown:

  ### 1. **The Three Conflated Questions**:
     - **A. Design Origins**: *Was the artifact's form intentionally shaped by political motives?* (e.g., "Did Moses *intend* low bridges to exclude buses?").  
       *This is historical/empirical, settled by evidence.*  
     - **B. Functional Effects**: *Does the artifact, once deployed, constrain social arrangements—regardless of intent?* (e.g., "Do low bridges *de facto* limit access?").  
       *This is causal/observable, testable via counterfactuals or comparative analysis.*  
     - **C. Ontology of "Politics"**: *Is "politics" an inherent property of the artifact, or a description we impose?*  
       *This is philosophical/metaphysical—not resolvable empirically.*

  ### 2. **Why the Stalemate Persists**:
     - **"Politics" is Doing Rhetorical Work**: The phrase "artifacts have politics" is **not a factual claim** but a **provocation** against "neutral" views of technology. It collapses:  
       - Material constraints (e.g., nuclear plants *require* security hierarchies),  
       - Interpretive flexibility (e.g., bicycles serving elite sport *or* mass transit),  
       - Social intent (e.g., anti-union machinery).  
       Treating it as a true/false proposition guarantees confusion.  
     - **Disciplinary Standards Clash**:  
       - Engineers/historians focus on **A** and **B** (evidence, causality).  
       - Constructivists/philosophers focus on **C** (meaning, agency, description).  
       Debating "politics" without specifying *which question* ensures mutual irrelevance.  
     - **"Momentum" Masks the Divide**: Hughes' concept is useful descriptively but evades the core conflict. It describes *how* artifacts stabilize social relations (addressing **B**), but doesn't resolve whether this constitutes "having politics" (**C**).

  ### 3. **Assessing Your Interventionist Test**:
     - **Strengths**: Directly addresses **B** (functional effects). Swapping artifacts (e.g., high vs. low bridges) tests causal claims. If outcomes persist, effects stem from social context, not the artifact alone.  
     - **Limitations**:  
       - **Ignores Interpretive Flexibility**: A "functionally equivalent" artifact may be *interpreted* differently (e.g., solar panels in a commune vs. a corporation).  
       - **Not Always Feasible**: Nuclear vs. solar isn't a swap—they entail distinct infrastructures.  
       - **Determinism Risk**: Constructivists would argue this test *does* presuppose a rigid causal chain, neglecting how social practices *reconfigure* artifacts.  
     - **Verdict**: Valuable for **B**, but insufficient for **A** or **C**. Historical counterfactuals (e.g., "had Moses built high bridges") are defensible if grounded in evidence, but they can't resolve ontological disputes (**C**).

  ### 4. **What Would Count as Progress?**
     - **Abandon the Slogan**: Replace "Do artifacts have politics?" with precise questions:  
       - "Who used this artifact to enforce power?" (**A**)  
       - "How does this artifact constrain/enable social organization?" (**B**)  
       - "Under what descriptions does this artifact become political?" (**C**)  
     - **Embrace Methodological Pluralism**:  
       - **A** demands archival/historical work.  
       - **B** benefits from comparative/counterfactual analysis (as you propose).  
       - **C** requires philosophical clarity (e.g., distinguishing *causal role* from *agency*).  
     - **Focus on Mediation**: Treat artifacts as *mediators* of power, not vessels. Algorithms aren't "racist" per se but *amplify* biases in data, design, and deployment. This bridges **B** and **C** without reifying "politics."

  ### Conclusion: A Structural Impasse, Not Deadlock
  The debate persists because participants answer different questions. Winner’s bridge case was demolished on **A** (intent), but its **B**-type effects (exclusionary infrastructure) remain relevant today (e.g., algorithmic bias). Your instincts are correct: progress lies in **disaggregation**, not synthesis. Clarifying whether we’re discussing origins, effects, or ontology defuses the stalemate. The interventionist test advances **B** but won't satisfy those debating **C**. Yet this isn’t futility—it’s specificity. By untangling the questions, we move beyond slogans toward concrete analyses of how *technologies mediate power*. That’s progress an experimental physicist can respect: measuring what’s measurable, and framing the rest rigorously.
