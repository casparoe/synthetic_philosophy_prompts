  Hmm, the user's background matters here. As a physicist turned philosophy auditor, they likely value conceptual precision and testability. Their proposed "interventionist test" reveals an engineer's instinct for controlled variables—replace an artifact and observe outcomes. But would this satisfy constructivists who emphasize interpretive flexibility? 

  I recall Latour's actor-network theory complicates this by granting agency to non-humans. Yet calling algorithms "racist" does feel like Winner redux—ascribing politics to objects. The user's frustration with pendulum swings suggests they suspect terminological impasse. 

  Key angles to address: 
  - Is "have politics" a category error? Politics requires intentionality, which artifacts lack. 
  - Are we confusing external descriptions with inherent properties? (The bridge's height isn't political; human interpretations make it so.) 
  - Does "technological momentum" just rebrand path dependence? 

  The intervention test is clever but problematic historically. Counterfactuals assume isolatable variables, while constructivists see designs as nodes in social networks. Still, it might work for contemporary cases (e.g., replacing predictive policing algorithms). 

  Ultimately, progress may lie in reframing: Not "do artifacts have politics?" but "how do artifacts mediate power?" That shifts focus to mechanisms—maintenance practices, user adaptations, etc.—where both camps could contribute. Momentum becomes one observable pattern among many. 

