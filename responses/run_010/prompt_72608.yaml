prompt: |-
  my flatmate keeps quoting that old Discover piece about farming being the worst mistake in the history of the human race, but whenever I push back he slides between at least three different claims without noticing: that early farmers were shorter and sicker and worked more, that foraging life was better all-things-considered, and that we're locked into a bad system nobody signed up for. Before I have that argument again I want the spec, not another round of anecdote-swapping.

  Write the desiderata: what a claim that the agricultural transition was a mistake has to deliver to count as both non-trivial and true. For each requirement give me the case or consideration behind it -- what the baseline is and why that baseline rather than another; whether "mistake" can apply at all to something that happened separately in half a dozen regions over thousands of years with no decision point and no one who could have said no; what to do with the fact that most of the people it allegedly harmed are people who would never have existed otherwise, and whether that makes the claim person-affect or merely impersonal; whose welfare gets weighed (median farmer, worst-off, total across generations, and do future generations' gains count against the transition's costs); which empirical findings it can't just talk around -- stature, disease load, workload, and the evidence that foragers were not uniformly better off; and which distinctions it must not collapse, like lives-gone-worse versus worse-than-the-alternative, mistake versus tragedy, and bad-for-those-people versus bad-for-humanity.

  Then tell me which single requirement knocks out the most versions of the argument, and flag which of the requirements are genuinely non-negotiable versus which ones are really my side's preferences dressed up as criteria. A table is fine. No reading list -- I can't chase that down right now and I mostly want the criteria anyway.
reasoning: |-
