  Hmm, the user is a second-year doctoral student in cultural psychology working as a coder on a tightness-looseness project. Their supervisor has an unconventional approach—she doesn't state the coding rules outright but expects coders to infer them from her verdicts on institutions, much like deriving grammar from sentences. The user has provided ten examples with the supervisor's notes and six candidate rules they've been debating. Now they want me to analyze three new cases, evaluate which rules survive, identify a diagnostic case, explore implications, and address normative concerns.

  First, I need to deeply understand the ten initial verdicts. The supervisor clearly isn't using simplistic metrics. For instance:
  - The Tokyo trading firm (tight) emphasizes norm coverage despite informal sanctions
  - The Dutch design studio (loose) shows consensus without enforcement
  - The imageboard (tight) reveals that freedom in content doesn't matter if form is rigidly enforced
  - The Antarctic station (tight) highlights environmental pressures over social sanctions
  - The Big Law example explicitly rejects averaging across domains

  Looking at the six candidate rules:
  (a) Coverage: Fraction of activities governed by norms. Seems promising—tight cases like Tokyo firm and Antarctic station have high coverage.
  (b) Sanction certainty: Probability of response to deviation. But verdict 8 (orchestra) has low sanction certainty yet is coded tight—refuted here.
  (c) Scriptedness: Limited behavioral options. Challenged by verdict 2 (design studio) where options exist but aren't enforced.
  (d) Internalization: Compliance without enforcement. Verdict 4 (Hasidic congregation) maintains tightness without coercion through social mechanisms—this rule might conflate cause and effect.
  (e) Normative consensus: Agreement on norms. Verdict 9 (university) has consensus on irrelevant rules but is loose—refuted.
  (f) Threat history: Distal ecological threats. Supported by verdict 10 (kibbutz) but verdict 3 (imageboard) has no real threat yet is tight—refuted.

  Only coverage (a) and scriptedness (c) seem to survive all ten when properly interpreted. Coverage focuses on breadth of governed domains, while scriptedness focuses on constrained choices per domain. They're distinct but correlated.

  Now for the new institutions:
  - Homesteaders: High coverage/scriptedness but zero sanctions. I predict she'll code this loose (70% confidence) because enforcement appears necessary based on verdict 7 (anarchist center).
  - Poker game: Minimal coverage but absolute sanction certainty. I predict tight (90% confidence) since verdict 3 (imageboard) shows tightness can exist in narrow domains.
  - Biohackers: High coverage with encouragement not punishment. I predict tight (60% confidence) as verdict 8 (orchestra) shows sanctions aren't required if behavior is constrained.

  The poker game is the most diagnostic case—it perfectly separates coverage (would call it loose) from scriptedness (would call it tight in its domain). Her likely tight verdict favors scriptedness.

  If she codes homesteaders loose but biohackers tight, that would align with verdicts 3,7,9 by prioritizing constraint over coverage breadth or sanctions. It's coherent if scriptedness is key.

  Normatively, coverage allows groups to "manufacture" tightness by regulating trivial behaviors, while scriptedness reflects genuine constraint. For policy, I'd choose scriptedness—it measures actual behavioral freedom, though it costs ease of measurement since coverage is more observable.

  The user's deeper needs include resolving coding ambiguities for their thesis, understanding their supervisor's epistemological approach, and grappling with how measurement choices affect normative applications. They're likely frustrated by the supervisor's opacity and want tools to decode her thinking while maintaining academic rigor.
answer: |-
  Based on the provided verdicts and reasoning like a measurement theorist focused on construct validity, here is my systematic analysis:

  ### Part 1: Predictions for New Institutions
  | Institution                     | Prediction | Confidence | Reasoning                                                                 |
  |---------------------------------|------------|------------|----------------------------------------------------------------------------|
  | **Traditional homesteaders**    | **Loose**  | 75%        | Matches anarchist center (#7): consensus + coverage but no enforcement → loose despite extensive norms. Sanction certainty refuted by #4/#10. |
  | **High-stakes poker game**      | **Tight**  | 95%        | Mirrors imageboard (#3): narrow domain, rigid etiquette, certain/exclusionary sanctions. Scriptedness dominates. |
  | **Biohacking community**        | **Tight**  | 65%        | High coverage + constrained options (optimization targets) despite gentle sanctions. Closest to orchestra (#8): behavioral precision > sanction severity. |

  ---

  ### Part 2: Survival of Candidate Rules
  - **Surviving Rules** (consistent with all 10 verdicts):  
    - **(a) Coverage**: Fraction of activity space governed by norms.  
      *Why*: Tight cases (#1,3,4,5,8,10) regulate many domains; loose cases (#2,6,7,9) have limited/non-functional coverage.  
    - **(c) Scriptedness**: Few behavioral options per situation.  
      *Why*: Tight cases constrain choices (e.g., #1's protocols, #3's formatting, #5's hourly allocation); loose cases permit variability (#2's unrewarded dissent, #9's ignored statutes).  

  - **Refuted Rules**:  
    - **(b) Sanction certainty**: Refuted by #8 (orchestra; no immediate sanctions) and #4 (Hasidic; no coercive power).  
    - **(d) Internalization**: Refuted by #7 (anarchists; high surveillance implies enforcement needed) and #10 (kibbutz; conformity driven by visibility/threats, not internalization).  
    - **(e) Normative consensus**: Refuted by #9 (university; consensus on irrelevant rules → loose) and #2 (design studio; consensus exists but no enforcement → loose).  
    - **(f) Threat history**: Refuted by #3 (imageboard; tight with no ecological threat) and #6 (Big Law; tightness domain-specific, not threat-driven).  

  **Near-equivalence of (a) and (c)**: Coverage and scriptedness covary in 9/10 cases. Only #6 (Big Law) partially decouples them: high scriptedness at work (tight) but low coverage of home life (loose). This hints that scriptedness is the *active ingredient* when domains conflict.  

  ---

  ### Part 3: Most Diagnostic New Case  
  - **The poker game** is maximally diagnostic.  
  - **Why**: It isolates scriptedness (tight within-game) from coverage (minimal life domains governed).  
    - If coded **tight** (as predicted), it confirms **scriptedness (c)** is primary (like #3’s imageboard).  
    - If hypothetically coded loose, **coverage (a)** would dominate.  

  ---

  ### Part 4: Coherence Test (Homesteaders loose, Biohackers tight)  
  If homesteaders = loose and biohackers = tight:  
  - **Commitment**: Tightness requires **behavioral constraint** (scriptedness) regardless of sanctions or coverage breadth. Sanctions are neither necessary (homesteaders lack them → loose) nor sufficient (biohackers use encouragement → tight).  
  - **Coherence with verdicts**:  
    - **#3 (Imageboard)**: Tight due to scriptedness in formatting/reference (not sanctions/coverage). **Coherent**.  
    - **#7 (Anarchists)**: Loose despite consensus/surveillance because no behavioral mandates. Homesteaders analogous → **coherent**.  
    - **#9 (University)**: Loose because statutes don’t constrain daily behavior. Biohackers’ optimization targets *do* constrain → **coherent**.  

  ---

  ### Part 5: Normative Implications  
  - **(a) Coverage**:  
    - *Normative flaw*: Groups can "manufacture" tightness by regulating trivial behaviors (e.g., mandating sock color) without changing core actions.  
  - **(c) Scriptedness**:  
    - *Normative flaw*: Groups can "manufacture" looseness by adding meaningless options (e.g., 10 identical ways to submit a report) while actual behavior remains unchanged.  

  - **Policy Recommendation**:  
    - **Adopt scriptedness (c)** for policy indexing.  
    - **Why**: It measures *actual behavioral freedom*, which better predicts outcomes like innovation/error tolerance. Coverage (a) is easier to manipulate and less tethered to lived experience.  
    - **Cost**: Scriptedness is harder to operationalize (requires observing choice constraints), while coverage is more visible (coded from rules/handbooks).  

  ### Summary  
  Your supervisor’s rule is **scriptedness (c)**, with coverage (a) as a correlated proxy. The poker game verdict will confirm this. If she codes homesteaders loose and biohackers tight, it reinforces that constraint—not sanctions or consensus—defines tightness. For policy, prioritize scriptedness despite measurement challenges; it avoids rewarding performative control.
