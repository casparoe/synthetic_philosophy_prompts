  ### Live Newcomb's Problem Classroom Activity  
  **Goal:** Force students to confront the dilemma through experience, not lecture. Focus on the predictor's trustworthiness via two rounds (opaque vs. dumb rule).  

  ---

  ### **Materials List**  
  1. **Predictor Sealing Mechanism:**  
     - **Round 1 (Opaque Predictor):**  
       - 24 sealed envelopes (pre-prepared).  
       - A small, lockable box (e.g., a cash box with padlock).  
       - Padlock and key.  
     - **Round 2 (Dumb Rule Predictor):**  
       - 24 index cards.  
       - A clear plastic box (to display cards face-down).  
     - **Shared:**  
       - 48 choice slips (small paper squares).  
       - Two physical boxes:  
         - **Box A:** Transparent, containing "1 POINT" tokens (e.g., printed slips).  
         - **Box B:** Opaque (e.g., a shoebox with lid).  
       - Whiteboard + markers for tracking points.  
       - Timer.  

  ---

  ### **Setup Before Class**  
  - **Pre-Class Survey (for Round 1 predictor):**  
    - Email students 1–2 days prior: *"Briefly describe how you’d respond if offered $1,000 now vs. $1,000,000 in a year. No right/wrong answers."*  
    - **Predictor Logic:**  
      - Categorize responses:  
        - "Wait for $1M" → Predict **one-boxing**.  
        - "Take $1K now" → Predict **two-boxing**.  
        - Vague → Flip a coin (record outcome).  
      - Seal predictions in envelopes labeled with student names. Lock in box before class.  

  ---

  ### **Procedure (75 Min Total)**  
  #### **Intro (5 min)**  
  - **Context:** "Today we’re simulating a decision puzzle. Choices earn points toward your participation grade (100 pts = +0.1%). No lectures—just play."  
  - **Rules:**  
    - **Box A (transparent):** Always 1 point.  
    - **Box B (opaque):** Either 0 or 100 points.  
    - **Your choice:** Take **only Box B** (one-box) or **both boxes** (two-box).  
    - **Predictor sets Box B** *before* you choose:  
      - Predicts one-box → 100 pts in Box B.  
      - Predicts two-box → 0 pts in Box B.  
  - **Key:** Predictions are sealed and unchangeable once locked.  

  #### **Round 1: Opaque Predictor (25 min)**  
  1. **Show Trustworthiness (3 min):**  
     - Display locked box: "Predictions are sealed inside, based on your pre-class survey. I can’t alter them."  
     - Pass box around; let students verify it’s locked.  
  2. **Choices (5 min):**  
     - Distribute choice slips. Students write **name** and **one-box/two-box**.  
     - *Silent writing!* No discussions (prevent intimidation).  
     - Collect slips in a hat (hide choices).  
  3. **Reveal & Calculate (12 min):**  
     - Unlock box. Open each envelope *one-by-one*:  
       - State prediction ("[Name] predicted to one-box/two-box").  
       - Retrieve student’s choice slip; read choice aloud.  
       - **Calculate points:**  
         - One-box + correct prediction → 100 pts.  
         - One-box + wrong prediction → 0 pts.  
         - Two-box + predicted one-box → 101 pts.  
         - Two-box + predicted two-box → 1 pt.  
     - Record points on whiteboard.  
  4. **Quick Reaction (5 min):**  
     - Poll: "Who one-boxed? Who two-boxed?"  
     - Ask one-boxers: "Why did you trust the predictor?"  
     - Ask two-boxers: "Did you expect to outsmart it?"  

  #### **Round 2: Dumb Rule Predictor (20 min)**  
  1. **Reveal Rule (3 min):**  
     - "This predictor uses a dumb rule: **Your birth month.** Jan–Jun → Predict one-box. Jul–Dec → Predict two-box."  
     - Write rule on board. For each student, write prediction on index card (e.g., "Alex: July → Predict two-box"), place face-down in clear box.  
  2. **Choices (5 min):**  
     - Distribute choice slips. Students choose again.  
     - Collect slips.  
  3. **Reveal & Calculate (7 min):**  
     - Flip cards in clear box to show predictions.  
     - Match choices to predictions; calculate points (same as Round 1).  
  4. **Contrast (5 min):**  
     - Poll: "How many two-boxed this time? Why?"  
     - Highlight: "You knew the rule and exploited it. Did that feel different?"  

  #### **Debrief (25 min)**  
  - **Map Experiences to Theories:**  
    | **Moment in Activity**          | **Two-Boxer Reasoning**                     | **One-Boxer Reasoning**                     |  
    |---------------------------------|---------------------------------------------|---------------------------------------------|  
    | Round 1 predictor locked away   | "I can’t change Box B now—take both to get more!" | "If the predictor knows me, one-boxing gets 100." |  
    | Round 1 results (e.g., one-boxers got 100) | "They got lucky—the predictor isn’t perfect." | "Predictor was right; I won by cooperating." |  
    | Round 2 dumb rule               | **Dominance:** "Two-boxing always adds +1 point!" | (N/A—most one-boxers switch) |  
    | Predictor accuracy in Round 1   | "It’s flawed—I might beat it."              | "It’s reliable—defying it is risky."        |  

  - **Guided Questions:**  
    1. "In Round 1, did two-boxers who got 101 pts *actually* outsmart the predictor? Or did they just get lucky?" (→ Highlights evidential vs. causal reasoning).  
    2. "Why did almost everyone two-box in Round 2? Is that *always* rational?" (→ Dominance when predictor is gameable).  
    3. "If the Round 1 predictor could read your mind, would you one-box?" (→ Links to superintelligent predictor).  
  - **Philosophical Hook:**  
    - "The real puzzle: When the predictor is trustworthy (like Round 1), your choice *now* seems to affect what it predicted *in the past*. How?"  
    - **DO NOT resolve debate.** End: "This isn’t about answers—it’s about why smart people disagree. Sit with the tension."  

  ---

  ### **Payoff Scheme**  
  - Points convert to **participation bonus**:  
    - **100 pts = +0.1%** (scalable; e.g., 101 pts = +0.101%).  
  - **Max possible:** 201 pts (100 in Round 1 + 101 in Round 2).  
  - **Why they’ll care:**  
    - Low-stakes but tangible (0.2% can shift a grade boundary).  
    - Leaderboard effect: Public tracking on whiteboard sparks competition.  

  ---

  ### **Predictable Problems & Solutions**  
  | **Issue**                          | **In-Moment Fix**                              | **Underlying Limitation**                    |  
  |------------------------------------|-----------------------------------------------|---------------------------------------------|  
  | **"You rigged it!" accusations**   | Show pre-survey prompts + emphasize sealing. Use a student volunteer to hold key during Round 1. | Students can’t *truly* believe in a human predictor—you’ll need to say: *"Real Newcomb assumes a near-perfect AI. We’re approximating trust."* |  
  | **Announcing choices to "intimidate" predictor** | Ban discussions during choice-writing. If someone shouts: *"Predictions are sealed. Your choice now can’t change what’s in the box."* | Classroom setting lacks the "closed timelike curve" of the thought experiment—your debrief must supply this. |  
  | **Reverse-engineering Round 1 predictor** | If guessed, admit: *"Yes, I used your surveys. But what if it was an AI that knew you better than you know yourself?"* | A dumb rule (Round 2) is *meant* to be gamed; the opaque predictor’s weakness (correlation ≠ causation) is unavoidable. |  
  | **Time crunch**                    | Prioritize revealing 5–10 archetypal results (e.g., one one-boxer who won big, one two-boxer who got 1 pt). Skip full 24-student reveal. | 24 students *will* exceed timings—accept partial data. |  

  ### **Key Limitation to Supply by Hand**  
  - **The Predictor’s "Retrocausality":**  
    Students can’t reproduce the core paradox: *Your choice now causes the predictor’s past action.* In class, the predictor is just correlative (e.g., surveys). **Explicitly say:**  
    > *"In the real thought experiment, the predictor isn’t guessing—it* knows *your future choice with near certainty. Your decision today locks in what it did yesterday. That’s why one-boxers argue: ‘Taking one box* makes *it have put $1M there.’"*  

  ---

  ### **Final Notes**  
  - **Why This Works:**  
    - Round 1’s opaque predictor creates unease ("Can I beat it?").  
    - Round 2’s dumb rule validates dominance reasoning, making Round 1’s tension sharper.  
    - Debrief uses *their* results to contrast theories—no formulas needed.  
  - **After Class:** Post point totals online. Offer a reflection prompt: *"Which choice is rational? Why do you still doubt it?"*
