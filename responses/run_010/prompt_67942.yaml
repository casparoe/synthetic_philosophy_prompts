     Debrief (35 min):

     Start by asking:

     - "In Round 1, how many of you one-boxed? How many two-boxed?" (Write counts)
     - "What were the typical outcomes for one-boxers? For two-boxers?"
     - "How accurate was the predictor in Round 1?" (Count correct predictions: prediction matched choice)

     - "In Round 2, how many one-boxed? How many two-boxed? Why?" (Expect almost all to two-box)
     - "What did the two-boxers in the A-M group get? (101) What would they have gotten if they one-boxed? (100) So why did they two-box? (Because 101>100) What about the N-Z group? They got 1. Why didn't they one-box? (Because if they one-boxed they would get 0, so 1 is better.)"

     Then contrast:

     - "In Round 2, you knew the rule, so you could figure out what was in Box B. Then two-boxing always gave more: if Box B had 100, you got 101; if Box B had 0, you got 1. So two-boxing dominated."

     - "In Round 1, the predictor was opaque and (hopefully) accurate. Then, if you two-boxed, you typically got 1 point (because the predictor predicted you would two-box and set Box B to 0). If you one-boxed, you typically got 100. So one-boxing was more profitable."

     Then ask:

     - "Why did the two-boxers in Round 1 choose that way? (They might say: because they thought they could outsmart the predictor, or because they thought the predictor might have predicted one-boxing so they could get 101.)"
     - "But in reality, the predictor was accurate for most. So the two-boxers ended up with 1 point. Why do you think the predictor was accurate? (Because it was based on what they wrote they would do, and most people stick to their word? Or because the TA is a good predictor?)"

     Then connect to the philosophical issue:

     - "The heart of Newcomb's problem is this: if the predictor is very good (like in Round 1), then one-boxing seems to lead to a better outcome. But the dominance reasoning (which says two-boxing is always better) seems so compelling. How do we resolve this?"

     - "Some philosophers (causal decision theorists) say: the predictor has already set Box B, so your choice now cannot change what's in Box B. Therefore, you should two-box to get the extra point. But others (evidential decision theorists) say: if you two-box, that is evidence that the predictor set Box B to 0, so you get only 1 point. If you one-box, that is evidence that the predictor set Box B to 100. So you should one-box."

     - "Notice that in Round 2, the causal reasoning worked because you could see the cause (the rule) and it was independent of your choice. But in Round 1, the prediction was based on something that might be correlated with your choice (like your pre-class intention)."

     Finally, ask them to reflect on when they might face similar dilemmas in real life (e.g., self-fulfilling prophecies, situations where your choice is predicted by others).

     What if in Round1 the predictor was not very accurate? Then the dilemma is weaker. We can still emphasize that the predictor was intended to be accurate and that in the thought experiment it is perfect.

     We can say: "In our experiment, the predictor was not perfect, but imagine a predictor that is almost always right. How would that change your choice?"

     This way, we still get to the heart of the problem.
