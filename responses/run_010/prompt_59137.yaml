prompt: |-
  ok so i'm two-thirds through a first-year seminar on the structure of empirical justification and I've reached the point where I can't tell which complaints against a view are load-bearing and which are just one camp's taste dressed up as a requirement. Last three weeks we did the bootstrapping / easy knowledge cluster: Cohen's reductio on basic knowledge plus closure, Vogel's driver who reasons from her gas gauge's readings ("it says F, and the tank really is full, so it read correctly again...") to the conclusion that the gauge is reliable, Wright's line that warrant doesn't transmit through Moore-style reasoning even though the conclusion can still be had as an entitlement, Pryor pushing the other way with dogmatism. And every single one of those papers is quietly running on a different list of what an adequate theory has to deliver, which is why I can't compare them. So I want the list first, before I commit to a side.

  Give me the desiderata for an account of when a source may confer justification on beliefs about its own reliability -- perception is just the flagship instance, the problem is general. For each requirement, give the case or consideration that motivates it, not just the label; I want to see why someone who resisted it would be making a mistake rather than a choice. Include the structural ones I'd expect (does it survive closure under known entailment, does it treat single-premise and multi-premise reasoning differently, is there a real difference between gaining warrant and merely preserving or transferring it, does the agent have to be able to see that her reasoning is good) but also the ones people smuggle in without arguing for them -- that intuitions about toy cases are data at all, that "too easy" is only a problem relative to a particular theory of what justification costs, that whatever blocks the bad reasoning has to explain why it's bad rather than just rule it out by stipulation. Then the distinctions the theory can't collapse: reliability versus known reliability, justification versus entitlement versus mere default permission, a source being trustworthy versus its outputs counting as evidence, and having a reason to think your belief is true versus your belief being true for that reason. Mark each item non-negotiable / negotiable-at-a-price / actually just the house style of one camp, and say which price. The part I most want: if some subset is jointly unsatisfiable, tell me exactly which and show the squeeze -- my working suspicion is that closure, the availability of basic knowledge, and any principle forbidding a source to vouch for itself cannot all stand together, and I want to know if that's right or if I'm mashing distinct principles into one. Also tell me which single requirement, once granted, knocks out the largest number of candidates, because that's the one I should attack in the paper.

  Two extras, keep both short. First, here's my own case and whatever spec you write has to hand down a determinate verdict on it: a lab scale is never checked against a certified weight, but the technicians confirm every reading against yesterday's readings and against samples of known mass they weighed earlier in the run, and they report the scale's accuracy on the basis of that accumulated agreement -- nobody outside the loop inspects it, and in fact the thing drifts a gram a month. Is the belief about the scale's accuracy justified, and if so is it justified *by* the readings or merely made true by them? What does your list say, and which requirement does the answer hinge on? Second, one or two sentences each on how dogmatism, the entitlement/conservative option, and the plain "just ban bootstrapping by principle" move score against the list -- no more than that, I'll do the real comparison myself. Don't send me references or a reading list, I have all the papers stacked on my desk, its the criteria I'm missing.
