answer: |-
  ### Desiderata for Psychiatric Classification: A Metrologist's Framework

  #### I. Non-Negotiable Requirements (Foundational for Any Classification)
  1. **Reliability (Inter-Rater Agreement)**  
     *Motivation*: Without consistent application across clinicians/sites, the taxonomy lacks objectivity. Example: Schizophrenia diagnosis varying wildly between clinicians pre-DSM-III renders it scientifically useless.  
     *Status*: Non-negotiable. Unreliable categories are not classifications but artifacts of noise.

  2. **Face Validity**  
     *Motivation*: Categories must map onto recognizable clinical phenomena. A taxonomy describing no observable human experience (e.g., "dysphoric quantum entanglement syndrome") fails its purpose.  
     *Status*: Non-negotiable. Prerequisite for engagement with reality.

  3. **The Looping Constraint**  
     *Motivation*: Hacking’s insight that psychiatric classifications alter self-conception, behavior, and social responses (e.g., ADHD diagnoses changing parenting/educational strategies). To ignore this is to misrepresent psychiatry’s subject matter.  
     *Status*: Non-negotiable. Persons react to being classified; denying this is unscientific.

  ---

  #### II. Negotiable Requirements (Camp-Specific Aspirations Masquerading as Universals)
  4. **Stability Across Time/Populations**  
     *Motivation*: Desire for timeless categories like medical diagnoses (e.g., tuberculosis).  
     *Conflict*: Directly clashes with **Looping Constraint**. Human behaviors/norms evolve (e.g., homosexuality’s declassification, rising autism diagnoses).  
     *Status*: Preference. Imposing it requires ignoring cultural/historical dynamics.

  5. **External Validation (Biomarkers, Etiology)**  
     *Motivation*: Aspiration to emulate physical medicine (e.g., syphilis diagnosis via spirochetes).  
     *Conflict*: Current biomarkers lack specificity (e.g., cortisol links to both depression and PTSD).  
     *Status*: Preference. Prioritizing this stalls clinical utility when biomarkers are immature.

  6. **Clinical Utility (Treatment Guidance)**  
     *Motivation*: Taxonomies should improve outcomes (e.g., lithium for bipolar disorder).  
     *Risk*: Can incentivize circularity (e.g., "treating depression with SSRIs proves it’s serotonin-related").  
     *Status*: Contextual. Vital for clinicians but risks reifying provisional categories.

  7. **Avoidance of Circularity**  
     *Motivation*: Preventing self-validating loops (e.g., diagnosing "treatment-resistant depression" when SSRIs fail, then using the diagnosis to justify new drugs).  
     *Status*: Ideal but unattainable. All psychiatric categories involve some hermeneutic circularity; the goal is *minimization*, not elimination.

  ---

  #### III. Mutually Exclusive Pairs (The Impossible Tradeoffs)
  - **Stability vs. Looping Constraint**  
    *Conflict*: Stable categories require static measurands, but looping ensures the measurand changes when classified.  
    *Resolution*: Impossible. Choose: ignore human agency (false stability) or embrace flux (no "fixed constant").

  - **Transparency/Communicability vs. Immunity to Reorganization**  
    *Conflict*: Transparent categories empower patients (e.g., autism self-advocacy). But once known, communities reorganize around/against them (e.g., "neurodiversity" redefining autism), changing the phenomena.  
    *Resolution*: **Impossible**. Immunity requires opacity; transparency invites reinterpretation. *Your suspicion is correct: no "fixed constant" exists in personhood*.

  - **External Validation vs. Clinical Utility**  
    *Conflict*: Biomarker-focused research (e.g., RDoC) sacrifices immediate clinical applicability. DSM’s symptom-based utility lacks biological grounding.  
    *Resolution*: Temporally incompatible. Biomarkers may emerge, but current utility relies on phenomenology.

  ---

  #### IV. The Most Damaging Desideratum  
  **The Looping Constraint** undermines:  
  - Stability (measurands drift)  
  - Immunity (classifications provoke change)  
  - Aspirations to "natural kind" status (categories are interactive).  
  It forces psychiatry to confront its unique challenge: *measuring a river that reshapes itself when you dip a ruler in*.

  ---

  ### Scoring the Contenders  
  *(Sorted by survivability against non-negotiables and tradeoffs)*  

  1. **Pragmatic/Instrumental Approaches** (e.g., Bolton 2019)  
     - **Strengths**: Embraces **Looping Constraint** and **Clinical Utility**; avoids circularity by treating categories as heuristic tools.  
     - **Weaknesses**: Sacrifices **Stability** and **External Validation**; risks relativism.  
     - **Verdict**: Best surviving contender. Accepts tradeoffs explicitly; aligns with psychiatry’s social context.

  2. **Descriptive/Operational (DSM-5)**  
     - **Strengths**: High **Reliability**; moderate **Face Validity**; prioritizes **Clinical Utility**.  
     - **Weaknesses**: Fails **Looping Constraint** (categories reified as static); circularity (e.g., PTSD criteria validated by... PTSD symptoms); ignores **External Validation**.  
     - **Verdict**: Foundationally flawed. Its operationalism pretends looping doesn’t exist.

  3. **Dimensional/Biomarker-Based (RDoC)**  
     - **Strengths**: Pursues **External Validation**; avoids symptom circularity.  
     - **Weaknesses**: Poor **Reliability** (neural circuits vary contextually); ignores **Looping Constraint** (assumes biology is immune to social feedback); no **Clinical Utility**.  
     - **Verdict**: Scientifically naïve. Treats persons as inert measurands.

  ---

  ### Where Metrology Distorts  
  Your framing brilliantly exposes psychiatry’s core tension but risks two distortions:  
  1. **The "Artifact" Misstep**: Unlike a kilogram cylinder, psychiatric categories *are their effects*. Looping isn’t noise—it’s the signal. Seeking an "artifact-free" standard misunderstands personhood.  
  2. **The Constant Fallacy**: Fundamental constants (e.g., *h*) exist independently of measurement. Persons do not. *Your suspicion is correct: there is no psychiatric analogue*. Human self-awareness guarantees measurand perturbation.  

  **Conclusion**: Psychiatry’s "metrology" must be hermeneutic, not physical. The surrender demanded is the dream of acontextual stability. The reward? Taxonomies that acknowledge their role in co-creating their objects—a dynamic calibration without a master constant. Pragmatism survives best not by solving these tensions but by naming them.
