  So I'm down a rabbit hole on Bertrand's chord problem and my prof gave me a take I can't shake. His line: fine, all three of Bertrand's procedures look arbitrary, but the random-endpoints one is the only one of the three that's invariant under rotating the circle, so if you apply the principle of indifferance properly you get 1/3 and the 1/2 and 1/4 answers are just people failing to respect the symmetry. Except he also mentioned that Jaynes later argued for 1/2 on the grounds that a genuine solution has to be invariant under scaling and translating the circle too, not just rotating it — which seems to flat out contradict him, so one of the two must be wrong. My question: if it's the choice of invariance group that fixes the distribution, doesn't that mean the paradox is basically solved and the principle of indifference survives, you just have to apply it to the transformations instead of to the parameters? And is there any situation where demanding invariance still leaves you with more than one candidate distribution? Be upfront about how confident you are in each claim you make here, and single out the bit you're least sure of.
