  6. **Case**: Money given to landlords first, sparking speculative construction that outlives the boom.  
     - **in_or_out**: In  
     - **why**: Order-driven realignment (e.g., infrastructure) persists post-trigger.  

  ### Order Sensitivity  
  - **Verdict**: Same phenomenon (hysteresis), not separate.  
  - **Explanation**: Order sensitivity is the **mechanism** of hysteresis here. The sequence determines which real adjustments occur (e.g., networks form only if money reaches catalysts like merchants first). It’s covered because hysteresis inherently depends on *how* the disturbance propagates, not just its magnitude/duration. No new label needed.  

  ### Confidence  
  - **Level**: High.  
  - **Reasoning**: Hysteresis is established in economics for exactly this (e.g., "unemployment hysteresis" from Blanchard/Solow). It’s applied beyond labor markets to trade, investment, and monetary policy.  
  - **What would change my mind**: If examples lacked a "reset" of the triggering variable (e.g., money remains elevated) or involved no structural change (e.g., only inflationary effects). Hume’s case fits textbook hysteresis.  

