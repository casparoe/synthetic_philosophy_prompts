prompt: |-
  Been reading Hume's economic essays for fun (mainly the one on money and the one on the balance of trade) and I keep running into an argument shape I can't find a word for. Hoping someone can tell me whether it's a known thing.

  Setup as I read it. Hume insists over and over that the quantity of money in a kingdom, taken by itself, is of no consequence — prices just scale with it, so a crown in Henry VII's time did the same work a pound does now, and a nation's real strength is its people and its commodities, not its coin. Fine. But in the same essay he says manufactures migrate: they leave the countries they have already enriched, fly off to wherever provisions and labour are cheap, enrich those places in turn, and then get banished again by the very dearness they created. And he floats a public bank that locks up every penny it takes in and never returns any of it to circulation — a bank that by construction can't budge the money supply — and then claims a real national advantage from it, part of which is just that labour stays cheap. (The other part is the killing off of paper credit, so maybe that leg isn't clean, but the cheap-labour leg looks like it is.)

  The pattern I want named: a variable that has been explicitly declared to have no lasting real effect, only a scaling one, nonetheless leaves the system permanently somewhere else after it has passed through — and leaves it there even once the variable is back where it started or has been switched off entirely. I know the stock line is that money is neutral in the long run but not in transition, and that's not what I mean, because the change I'm pointing at is still sitting there after the transition is over. And it isn't just "history matters" or sunk costs: the bite is that the thing you were told is a mere measuring rod turns out to have rearranged the furniture.

  Second instance, modern, so I can check I'm not just misreading Hume. A regional tax break pulls a factory to a town; the break expires after five years and wages and prices fully adjust; by every neutral account the town should be back where it was. But the factory stays, the suppliers who followed it stay, and the town is permanently different. Nobody claims the break still exists. Its absence is compatable with the effect persisting indefinitely.

  The wrinkle that has me stuck, and which I don't think is in Hume at all — probably my own addition, treat it as a separate question if you like: the durable rearrangement seems to depend on the *order* in which the extra money reaches different pairs of hands, not on the amount and not even on how long the whole thing takes. Hand it to the merchants first and they spend it into new habits and new working connections among the second group, and those connections outlive the money. Hand the identical sum to the second group first and nothing durable happens, because they just buy existing goods at existing prices and it all washes out. Same total, same duration, opposite residue.

  So — does this have a name? I'm after the carving, not just a label. What exactly is the phenomenon, what are the closest existing concepts and how does each one fail to cover it, and where are the edges: does it still count when the residue is a habit or a network rather than a physical asset? does it count when the trigger was never declared neutral in the first place, or does the declared-neutrality bit matter to what's interesting here? If nothing established fits, say so plainly and coin something with conditions attached.

  No bibliography or reading list, please — I don't want to chase sources, I want concepts. And if you're unsure whether a term is genuinely established versus half-remembered, flag that instead of dressing it up.

  Format: a few sentences of prose first if you need them, then a JSON object with exactly these fields:

  - "verdict": one of "established_term" | "partially_covered_by_several" | "no_established_term"
  - "best_label": the single term you would actually use, established or coined
  - "definition": two or three sentences, precise enough that I could apply it to a case you've never seen
  - "nearest_concepts": array of 3–5 objects, each with "term", "home_field", "what_it_covers", "why_it_misses_my_case", and "fit" (one of "close" | "partial" | "loose")
  - "coined_term": object with "name", "necessary_conditions" (array of strings), "explicitly_not" (array of objects with "thing" and "difference") — or null if an established term fits cleanly
  - "boundary_cases": array of at least 4 objects with "case", "in_or_out" ("in" | "out" | "marginal"), "why" — include the two edge questions I asked above
  - "order_sensitivity": your verdict on my wrinkle — same phenomenon, separate phenomenon, or already covered by something named; give it its own label if it's separate
  - "confidence": how sure you are that "best_label" is really established rather than your reconstruction, and what would change your mind
reasoning: |-
  We are looking for a concept that describes a situation where a variable declared to be neutral (like money supply) has a temporary change that leads to permanent real effects, even after the variable returns to its original state. The key is the durability of the rearrangement and the fact that the neutrality claim is violated in the long run despite the variable being back to normal.

  After careful thought, the established term that best fits this phenomenon is **hysteresis**. 

  ### Why hysteresis?
  Hysteresis, originating from physics (e.g., magnetism), refers to a system's property where the current state depends on its history. Even after the original force is removed, the system does not return to its initial state. In economics, hysteresis is used to describe situations where temporary shocks have permanent effects. For example, in labor markets, a temporary increase in unemployment can lead to a permanently higher natural rate of unemployment due to skills depreciation or loss of worker attachment.

  This matches:
  - Hume's example: The temporary inflow of money (or the migration of manufactures) leads to a permanent change in the structure of the economy (e.g., the level of development, the industrial base) even after the money supply normalizes or the manufactures move elsewhere.
  - The modern example: The temporary tax break leads to a permanent industrial base because of agglomeration effects and supplier networks that persist.

  ### The wrinkle: order sensitivity
  The additional point about the order in which money reaches different groups is a separate but related issue. It is about the path dependence of the outcome. Path dependence is a broader concept that can include hysteresis. However, the specific idea that the sequence of events (who gets the money first) leads to different long-term outcomes even with the same total and duration is a form of path dependence. Hysteresis is a type of path dependence, but not all path dependence is hysteresis. In this case, the sequence of spending creating new habits and networks is a mechanism of path dependence that leads to hysteresis.

  Thus, the order sensitivity is an aspect of the same phenomenon (hysteresis) because it explains why the history matters and how the temporary change can have a permanent effect. However, the term that explicitly captures the order sensitivity is **path dependence**.

  ### Nearest Concepts
  1. **Term**: Hysteresis
     - **Home Field**: Economics (especially labor and macro) and physics.
     - **What it covers**: Temporary shocks having permanent effects; history matters.
     - **Why it misses my case**: It might be too narrow in some contexts (eocused on labor or unemployment) but in macroeconomics it is used for output and other variables. In the money example, it fits.
     - **Fit**: Close.

  2. **Term**: Path Dependence
     - **Home Field**: Economics, evolutionary economics, institutional economics.
     - **What it covers**: The outcome depends on the sequence of events. Small events can lock in a particular path.
     - **Why it misses my case**: It's broader and doesn't necessarily emphasize the return to the same variable state. Path dependence can occur without the variable being declared neutral and without the variable returning to the start.
     - **Fit**: Partial (because it doesn't require the variable to be neutral and back to start).

  3. **Term**: Neutrality of Money (Long Run)
     - **Home Field**: Monetary economics.
     - **What it covers**: Money supply changes only affect nominal variables in the long run, not real ones.
     - **Why it misses my case**: It denies the very phenomenon we are observing (the permanent real effect). It misses because our case shows that even in the long run, the real variables are changed.
     - **Fit**: Loose.

  4. **Term**: Non-Neutrality of Money (Short Run)
     - **Home Field**: Monetary economics.
     - **What it covers**: Money can affect real variables in the short run due to sticky prices or information gaps.
     - **Why it misses my case**: It assumes that the effect is temporary and disappears in the long run. Our case has a permanent effect.
     - **Fit**: Loose.

  5. **Term**: Multiple Equilibria
     - **Home Field**: Game theory, macroeconomics.
     - **What it covers**: There are multiple possible stable outcomes, and history or policy can select one.
     - **Why it misses my case**: It doesn't require the triggering variable to return to the start. Also, the variable in question (money) is not necessarily the one that moves the system between equilibria in a way that leaves a trace after returning.
     - **Fit**: Partial.

  ### Verdict
  - **Verdict**: established_term
  - **Best Label**: Hysteresis

  ### Definition
  Hysteresis occurs when a temporary disturbance in a system variable (such as the money supply) leads to a permanent change in the system's state, even after the disturbing variable has returned to its original level. The system does not revert to its initial equilibrium because the disturbance has altered underlying structures, behaviors, or relationships (e.g., by creating new habits, networks, or industrial capacities).

  ### Coined Term
  Since we have an established term, this is null.

  ### Boundary Cases
  We need at least 4. We'll include the two edge questions:

  1. **Case**: The residue is a habit or network (e.g., the spending pattern of merchants leads to a durable business relationship).
     - **In or Out**: In
     - **Why**: Hysteresis can be caused by changes in institutions, norms, or networks that persist.

  2. **Case**: The trigger was never declared neutral in the first place (e.g., a one-time investment in infrastructure that permanently boosts productivity).
     - **In or Out**: Out
     - **Why**: Hysteresis typically refers to a variable that is supposed to be neutral (or have only temporary effects) but leaves a permanent trace. If the variable is known to have durable effects (like infrastructure investment), it's not a violation of neutrality and thus not hysteresis in the sense we are using.

  3. **Case**: A temporary increase in government spending during a recession that pulls the economy out of a slump and leaves it permanently on a higher growth path due to improved technology adoption.
     - **In or Out**: In
     - **Why**: The spending was temporary and the variable (fiscal stimulus) is often thought to have only short-term effects, but it led to a permanent change.

  4. **Case**: A temporary oil price shock that leads to permanent investment in energy-efficient technology, reducing energy consumption even after oil prices fall back.
     - **In or Out**: In
     - **Why**: The shock is temporary but the change in technology is permanent.

  5. **Case**: A temporary increase in money supply that causes a one-time inflation and then everything returns to the original state (no real change).
     - **In or Out**: Out
     - **Why**: This is the classic neutrality case with no hysteresis.

  6. **Case**: The order of spending matters: giving money to merchants first leads to durable networks, but giving to consumers first does not.
     - **In or Out**: Marginal (but In, because it's an example of path-dependent hysteresis)
     - **Why**: The order is the mechanism of path dependence that causes the hysteresis. It is part of the same phenomenon.

  ### Order Sensitivity
  The order sensitivity (the wrinkle) is an example of **path dependence**, which is the mechanism that can lead to hysteresis. It is part of the same phenomenon and does not require a separate label. However, if we want to emphasize the order, we can call it "sequence-dependent hysteresis" or note that it is a form of path dependence. But the overall phenomenon is still hysteresis.

  Thus, we say: 
  - **Verdict**: same phenomenon, and the mechanism is path dependence.
  - **Label**: (no new label needed; it is covered)

  ### Confidence
  - **Confidence**: High. Hysteresis is a well-established concept in economics for exactly this kind of permanent effect from a temporary cause. However, note that in the context of money, it is less commonly discussed than in labor markets. But the term is applied in macroeconomics (e.g., hysteresis in output after recessions). What would change my mind: if in the economic literature, the term "hysteresis" is strictly reserved for labor markets and not used for other variables like money or industrial structure. But it is used more broadly.

