answer: |-
  The air in the laundromat tasted like dust and regret. June watched the man across the counter sweat. Carl something-or-other. Claimed he needed the procedure to guarantee he’d stick to his rehab program. His eyes, the color of weak coffee, darted between her face and the grimy linoleum floor. His fingers drummed a frantic tattoo on the Formica.

  Four seconds. That’s all it usually took June. She’d spent years hunting people like Carl – ghosts who vanished with unpaid debts, leaving trails of broken promises and furious creditors. She knew the tells: the micro-flinch when commitment was mentioned, the too-quick nod, the way their gaze slid sideways when picturing an exit route. Carl had them all. His desperation was real, but it was the desperation of a cornered animal, not someone steeling themselves for a lifelong anchor.

  "No," June said, her voice flat as the horizon outside. "You wouldn't pay."

  Carl flinched as if slapped. "I *would*! I swear! My kid—"

  "Your kid needs you sober," June interrupted, not unkindly, just stating a fact. "But you won't pay. You know it. I know it. That's why you're here. And that's why you're leaving."

  He stared, mouth working soundlessly. The hope drained from his face, replaced by a familiar, defeated rage. He slammed a fist weakly on the counter, rattling the ancient cash register that never held cash. "Damn you. Damn this whole rotten town!" He spun, stumbled over his own feet, and shoved through the glass door. The desert heat rushed in like a physical blow, swallowing him before the door wheezed shut. Outside, the sun bleached the world white and silent.

  June watched him shrink in the distance until he was just a heat shimmer. Another one who needed the thing he couldn’t get because he needed it. The Catch-22 was baked into the very walls of ‘Sudden Service’ Laundry. Back behind the humming industrial washers, they performed the procedure: a precise, invasive little snip and implant deep in the brain’s wiring. The cost was steep, far beyond what anyone in Dustville scraped together. So they ran on IOUs. And the only collateral they accepted was the ironclad certainty, etched in a four-second facial scan, that you’d honor that IOU once the procedure *made* you honor it.

  The outfit needed people like June at the desk. People who could see the lie before it was fully formed. Her years chasing skips had given her X-ray vision for false promises. They’d hired her precisely because she was good at turning people away. Good at spotting the Carls of the world.

  She also wanted the procedure. Desperately. That part wasn’t in her job description. She never said it aloud, not even in the quiet moments alone in her stifling trailer. But it was the engine driving her through the heat, the dust, the parade of shattered faces across the counter.

  Her own reason was a locked box buried deep, wrapped in barbed wire. It manifested only at night, in dreams saturated with the smell of ozone and burning rubber, the sound of a voice screaming her name fading into static, and the crushing, suffocating weight of a promise made and instantly, catastrophically broken. She’d wake gasping, the phantom taste of copper and failure on her tongue. The procedure offered a cage, yes, but a cage that would finally hold her. A cage where her word meant something, even if only to herself.

  Getting it had been its own kind of hell. She couldn’t just walk in as a client. The savant clerk – old man Finch before she took his place – would have seen the same desperation, the same fundamental untrustworthiness she saw in Carl. Her need *was* her disqualification.

  She’d engineered it. Coldly. Professionally. She’d gone to the owner, a gaunt, silent man everyone called The Proprietor, whose eyes held the dry, calculating chill of the desert night. She hadn’t begged or promised. She’d laid out a business proposition. She was a skip tracer. The best in the county, maybe the state. The outfit had a stack of unpaid IOUs thicker than a phone book – people who *had* passed Finch’s test, gotten the procedure, and then… well, the compulsion only applied to promises made *after* the implant. The debts incurred *before* were fair game for skipping. They needed someone to hunt those people down, to make the enterprise solvent. Her fee? The procedure. Paid upon successful recovery of, say, the ten largest outstanding debts.

  The Proprietor hadn't smiled. He’d just nodded once, a slow, reptilian dip of the chin. The logic was unassailable. She was uniquely motivated. And crucially, she wasn’t promising to *pay* for the procedure; she was offering a service *in exchange* for it. A subtle, critical distinction that bypassed the initial credibility trap. Her commitment was to the hunt, not the payment. And her reputation for relentless pursuit was the collateral.

  The hunting had been brutal. Tracking down people bound by a compulsion they hadn’t had when they incurred the debt was a unique challenge. They couldn’t break *new* promises, but they could hide. They could run. Some fought. She’d brought in seven. The Proprietor, impatient, had authorized her procedure after the seventh. The last three debts were still outstanding, hanging over her like Damocles’ sword, her obligation now ironclad.

  The change wasn’t dramatic. No sudden halo, no choir of angels. It was a quiet shift in the bedrock of her being. The first time she noticed was small: she’d told Marty at the diner she’d return his spanner by noon. Ten minutes before twelve, a wave of pure, irrational anxiety washed over her, a tightening in her chest, a metallic taste sharpening the constant dust. It wasn’t pain, not yet, but a profound, visceral *wrongness*. She’d practically run to return the tool. The relief was immediate, profound, like stepping out of crushing pressure. It felt… clean.

  Now, months later, sitting at her kitchen table staring at the subpoena, she understood the cost. The compulsion didn’t care about context. It didn’t care about loyalty, or history, or debts of a different kind. It only cared about the promise made.

  The promise was years old, whispered in the choking dust beside a flipped rig on the old highway, fuel soaking the sand, the stink of it thick and terrifying. Arlo Vance, pinned, leg bent wrong, face pale with shock and blood. Her truck was nearby, miraculously upright. "Get help, Junebug," he’d rasped, his hand gripping hers with surprising strength. "Promise me. Don’t let ‘em pin this on me alone. Promise you’ll tell ‘em it was the load shift, not the whiskey. Promise!"

  She’d promised. Desperate to get away from the wreck, the smell, the fear. She’d promised. And then, later, when the lawyers and the company men came, when the implications of admitting she knew about Arlo’s drinking became clear – the shared liability, the potential lawsuits, the end of her own precarious career before it even got traction – she’d walked away. She’d become June the Skip Tracer, adept at vanishing herself when necessary. She’d let Arlo take the fall. He’d lost his license, his rig, spent time inside. She’d buried the promise, deep, locked it away with the other wreckage of that night.

  Now Arlo was suing the haulage company. His lawyer, digging deep, had found her. The subpoena demanded her testimony about the crash, about Arlo’s condition. About the promise she’d made.

  She picked up the paper. The words blurred. The compulsion stirred, a low hum in her bones. *Promise*. She’d *promised* to tell them.

  To testify truthfully now would be to admit her own perjury by omission years ago. It would unravel everything. Her skip tracing license relied on a clean-ish record. Creditors wouldn’t hire a known liar. The outfit… The Proprietor tolerated efficiency, not liability. And Arlo… testifying truthfully meant confirming his intoxication *did* play a role. It might sink his lawsuit. He’d hate her. Again. Forever.

  *But you promised.*

  The hum intensified. It wasn't anxiety this time. It was a pressure building behind her eyes, a constriction in her throat. She tried to picture walking into that courtroom, saying nothing, letting Arlo’s case fail. The pressure spiked. A sharp, stabbing pain lanced through her temples. She gasped, dropping the subpoena. Nausea roiled in her gut. She gripped the edge of the table, knuckles white.

  *You promised.* The thought wasn’t hers. It was the compulsion, cold, hard, undeniable logic etched into her neurons. A promise was made. It must be kept. The physical reaction was immediate, brutal. Not unbearable yet, but a stark warning shot. A preview of the agony of breaking faith.

  She thought of Carl, stumbling back into the heat. The raw need in his eyes. She understood him perfectly now. The cage. It held her fast.

  She thought of Arlo. The rough kindness he’d always shown her before the crash. The broken man he’d become after. The hand gripping hers in the dust.

  She picked up the subpoena again. The address of the courthouse. The date. Tomorrow.

  The pressure eased slightly, the pain receding to a dull, insistent throb. The compulsion approved. The path of fulfillment.

  She stood up. The small trailer felt suffocating. She needed air, even if it was just Dustville’s scorched breath. She walked out into the evening. The sun was a bloody wound on the horizon, staining the sky purple and orange. The air still held the day’s furnace heat, radiating from the bleached earth.

  She walked past the laundromat. The lights were off. The Proprietor would be in the back, tallying accounts. He knew about the subpoena. He’d given her the day off tomorrow. His expression had been unreadable. Business was business. Her commitment to the outfit, her obligation to hunt the remaining skips, remained. This… this was personal collateral.

  She stopped at the edge of town, looking out at the vast, indifferent desert. The silence was immense. Inside, the compulsion settled, a watchful, satisfied stillness. The promise would be kept. The cost was irrelevant. It simply *was*.

  Tomorrow, she would go to the courthouse. She would sit on the hard wooden bench. She would raise her hand. She would swear to tell the truth, the whole truth, and nothing but the truth. And then she would.

  The cost would be exacted. Arlo’s face, the betrayal fresh in his eyes. The end of her career, most likely. The Proprietor’s cold calculation. The unraveling of the careful anonymity she’d built.

  But she would do it. Because she had promised. And the person she was now couldn't break that promise. The person she’d been would have run. The person she’d paid so much to become had nowhere to run *to*.

  The desert offered no answers, only the indifferent expanse of sand and sky. The wind picked up, sighing through the dry scrub, carrying the faint, alkaline scent of the playa. June turned her back on the emptiness and walked slowly towards the meager lights of Dustville. The throb behind her eyes was gone, replaced by a terrible, unshakeable calm. The cage held. She walked into the familiar heat, towards the consequences she’d bought and paid for, one irrevocable word at a time.
