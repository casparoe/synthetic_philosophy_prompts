prompt: |-
  I sit on the ethics committee of my university's teaching hospital, and we have been asked to review the brief-intervention protocol governing how clinicians talk with patients about behavior change: tobacco, alcohol, medication adherence, opioid tapering. The protocol is built on motivational interviewing. In outline, clinicians are trained not to argue for the change, not to recite risks or statistics the patient has not asked about, and not to treat patient pushback as an obstacle to be overcome but as a signal to change tactics. The documented aim is to elicit and reflect back the patient's own avowals in favor of change — what the training literature calls change talk — on the working assumption that a patient moved by reasons she articulates herself sustains the change longer than one persuaded by the clinician's. The same institution, however, runs informed consent and patient education on something close to the opposite principle: a patient who has been given accurate risk information and remains unmoved is recorded as non-adherent, the remedy is more information restated more forcefully, and the clinician's instinct to correct the patient is treated there as a professional duty rather than a reflex to be suppressed.

  I want a philosophical reconstruction of what each practice presupposes about practical reasons, not a description of either. Does the counseling practice presuppose internalism, and if so which version: the crude one on which a reason must attach to some existing element of the agent's motivational set, or the Williams-style one on which it suffices that the agent would be moved after a sound deliberative route from that set? The difference is not academic here, since evocation looks like an attempt to run that deliberation on the patient's behalf. Does the consent practice presuppose externalism, or only a thesis about how information produces motivation? Can one institution house both without incoherence, or is there a real contradiction about whose reasons count and when — and if the latter, which practice has to give?

  Then consider the deflationary reading on which neither practice is committed to anything in the metaphysics of reasons, both being applied claims about what causally works — reactance, rapport, self-perception — and tell me whether that reading is genuinely available or whether it concedes the interesting question. Finally, the protocol fixes the target behavior before the conversation begins. Does evoking a patient's reasons toward an end the clinician has already chosen amount to manufacturing internal reasons, and what does that presuppose about whether reasons can be produced by reflection rather than only discovered?

  Throughout, please separate what the practices strictly entail from what they merely sit comfortably with, mark the places where they are underdetermined so that rival theories would license them equally, and close by saying what would have to change in the protocol's wording, and in the consent practice, were we to adopt the rival account in each case. I am after a defended reconstruction with the reasoning exposed, not a survey of the positions and not a bibliography.
reasoning: |-
  Okay, the user is on an ethics committee at a university hospital, reviewing two conflicting clinical protocols: motivational interviewing (MI) for behavior change versus traditional informed consent/education. They want a philosophical reconstruction of each practice's presuppositions about practical reasons, not just descriptions. 

  Hmm, this is deep. The user clearly has philosophical training - they're referencing Williams' internalism/externalism, reactance theory, and asking precise meta-ethical questions. Probably a philosopher-bioethicist or MD/PhD. Their frustration with institutional incoherence is palpable. 

  First unpacking their core tension: MI assumes behavior change must be internally motivated ("change talk"), while informed consent treats risk information as externally binding regardless of motivation. The user suspects a metaphysical clash about reasons, not just technique. 

  Key philosophical layers I need to address:
  1) Internalism in MI: Which version? Crude internalism (reasons must match existing motives) vs Williams' deliberative internalism (reasons emerge from idealized reflection). The "evocation" tactic suggests the latter - clinicians prompt patients to generate reasons through reflection.
  2) Informed consent's externalism: Is it claiming risk facts are reason-giving independently of motivation? Or just betting on information→motivation causation? The punitive "non-adherent" label leans toward externalism.
  3) Can both coexist? Only if we see them as context-specific - MI for value-laden behaviors, consent for fact-dependent decisions. But the user's right that their reason-metaphysics clash.
  4) The "deflationary" escape: What if both are just causal strategies? But then why frame MI as "eliciting reasons" rather than "shaping behavior"? The language betrays philosophical commitments.
  5) Manufacturing reasons: When clinicians preset the behavior goal (e.g., quitting smoking), is "change talk" just implanting reasons? That assumes reasons can be created via reflection - a contested view.

  Biggest landmine: The protocols' wording reveals unexamined assumptions. MI's manual says "elicit the patient's own reasons," implying pre-existing internal reasons. Consent forms say "patient understood risks but declined," treating comprehension as sufficient for external justification. 

  If I were advising this committee:
  - For MI: Soften "eliciting YOUR reasons" to "exploring what matters to you around change" to avoid presupposing internal reasons exist.
  - For consent: Replace "non-adherent" with "electing alternative path" to drop externalist baggage.
  - But fundamentally, they need to decide: Is autonomy about acting on one's current motives (MI) or on accurate facts (consent)? The protocols assume contradictory answers.

  The user's nailed it - this isn't just technique tweaking. It's a collision between two philosophies of autonomy. Resolving it requires choosing which picture of agency the institution endorses.
answer: |-
  Here is a philosophical reconstruction of the presuppositions embedded in each practice, analyzing their commitments to theories of practical reasons, coherence, and implications for protocol design:

  ---

  ### **1. Motivational Interviewing (MI) Protocol: Presuppositions about Reasons**  
  **Core Presupposition:** *Deliberative Internalism* (Williams-style).  
  - **Entailment:** Reasons for change must be *internally accessible* to the patient’s subjective motivational set. The protocol rejects the crude internalism (reasons must map directly to *existing* desires) because it relies on *eliciting* new reasons through reflection. Clinicians facilitate a "sound deliberative route": patients are guided to articulate reasons *they would endorse* after considering their values, circumstances, and goals.  
  - **Underdetermined Aspects:**  
    - The protocol is compatible with *constructivist* views (reasons are produced via deliberation) but does not strictly entail them. It could also align with a *discovery* model (patients uncover latent reasons).  
    - It rejects *externalism* (reasons exist independently of motivation), as unmotivated facts (e.g., statistical risks) are withheld unless the patient initiates interest.  

  **Manufacturing Reasons?**  
  - Fixing the target behavior *does* risk "manufacturing" internal reasons. This presupposes:  
    - Reasons can be *generated* through Socratic reflection (constructivism), not merely discovered.  
    - The clinician’s role is to scaffold deliberation toward a *preexisting end* (e.g., smoking cessation), implying that valid reasons can emerge from agent-relative deliberation even when the endpoint is externally set.  

  ---

  ### **2. Informed Consent/Education Practice: Presuppositions about Reasons**  
  **Core Presupposition:** *Cognitivist Externalism* or *Informationalism*.  
  - **Entailment:** Accurate risk information *constitutes* a practical reason for action, independent of the patient’s motivational state. A "non-adherent" label assumes that understanding risks *should* motivate a rational agent—presupposing that reasons are external facts that *demand* compliance. Restating information forcefully treats resistance as a failure of comprehension or rationality, not a legitimate divergence in values.  
  - **Underdetermined Aspects:**  
    - Compatible with *externalist realism* (reasons are mind-independent facts) but also with *instrumentalism* (information *causes* motivation in rational agents). However, the punitive "non-adherent" framing leans toward externalism, implying a duty to act on facts.  
    - Rejects internalism, as it pathologizes unmotivated patients despite comprehension.  

  ---

  ### **3. Coherence Between Practices**  
  - **Contradiction:** The practices presuppose *incompatible theories of reasons* in the same clinical context:  
    - MI: Reasons are *internal and motivationally dependent*.  
    - Consent: Reasons are *external and motivationally independent*.  
  - **Incoherence:** The institution simultaneously treats resistance as:  
    - (MI) A signal to retreat and explore (resistance is epistemically valuable).  
    - (Consent) A defect to override (resistance is irrational).  
    - **Metaphysical Conflict:** MI treats reasons as *agent-relative*; consent treats them as *agent-neutral*.  

  **Can Both Coexist?** Only with *compartmentalization*:  
  - **Plausible Reconciliation:** MI addresses *value-laden behaviors* (e.g., lifestyle changes), where internal reasons dominate. Consent addresses *fact-dependent decisions* (e.g., surgery risks), where external reasons dominate.  
  - **Cost:** This concedes that the institution lacks a unified view of agency, potentially undermining trust if patients detect inconsistency.  

  ---

  ### **4. Deflationary Reading: "It’s Just What Works"**  
  - **Availability:** Both practices *could* be framed as empirically grounded techniques (e.g., MI avoids reactance; consent ensures legal defensibility).  
  - **Concession:** This reading *abdicates the philosophical question*. The protocols’ *language* and *normative framing* commit them to stronger claims:  
    - MI’s "eliciting *your* reasons" implies internalism.  
    - Consent’s "non-adherent" label implies externalism (deviation is objectively wrong).  
  - **Verdict:** The deflationary reading is *superficially available* but ignores the practices’ implicit normative structures. It fails to resolve the tension in how each defines "good" decision-making.  

  ---

  ### **5. Implications for Protocol Revision**  
  **Scenario: Adopt Externalism for MI**  
  - **Protocol Change:** Clinicians would *lead* with risk statistics, argue for change, and frame resistance as irrational. Language shifts from "What matters to you?" to "The evidence shows you must…".  
  - **Consequence:** MI becomes directive education, losing its core mechanism (change talk).  

  **Scenario: Adopt Internalism for Consent**  
  - **Practice Change:** Drop "non-adherent" label. Clinicians explore why a patient *rejects* medical advice (e.g., "Help me understand your perspective"). Resistance triggers curiosity, not escalation.  
  - **Consequence:** Documentation shifts from "refused standard care" to "values diverge from clinical recommendations". Legal risk may increase.  

  **Scenario: Adopt Constructivism**  
  - **Protocol Change (MI):** Explicitly frame reflection as *reason-building*: "Let’s explore how quitting smoking *could* align with your goals".  
  - **Consent Change:** Present information as *input for deliberation*, not imperatives: "How do these risks weigh against your priorities?"  

  ---

  ### **Conclusion: Defended Reconstruction**  
  - **Presuppositions:**  
    - MI presupposes *deliberative internalism* (reasons emerge via reflection from the agent’s subjective set).  
    - Consent presupposes *cognitivist externalism* (reasons inhere in facts, requiring compliance).  
  - **Incoherence:** A contradiction exists. MI sees reasons as *owned* by the patient; consent sees them as *imposed* by facts.  
  - **Resolution:** The institution must choose:  
    - **Internalism-Coherent:** Revise consent to honor unmotivated refusal as valid (if reasoned).  
    - **Externalism-Coherent:** Revise MI to assert objective reasons for change.  
    - **Compromise:** Contextualize practices (internalism for behavior change, externalism for discrete procedures), but acknowledge the normative split.  

  **What Must Change?**  
  - For MI to align with externalism: Abandon "change talk"; mandate risk recitation.  
  - For consent to align with internalism: Eliminate "non-adherent"; treat refusal as sovereignty, not failure.  
  - **Otherwise, the contradiction persists**: The institution simultaneously affirms that reasons reside in the agent *and* in the world.
