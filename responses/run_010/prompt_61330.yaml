prompt: |-
  So — my name came up off the voter/jury roll last month and our city is running one of those citizens' assemblies on the transit budget. Sixty people, three weekends, recommendations go to the council but aren't binding. I said yes mostly out of curiosity, and then I made the mistake of reading up on sortition beforehand, and now I'm halfway through a stack of stuff about mini-publics, the Athenian practice, the Irish assemblies, proposals for a randomly selected second chamber, and honestly it feels like everyone is answering a slightly different question. One strand says the point of the lot is fairness: everyone gets an equal chance to hold office, and that's the whole value. Another strand says the point is epistemic: you get cognitive diversity, no reelection incentives, no career politicians, so the body decides better. A third says the point is symbolic or expressive — it says something about who counts as competent to rule. Those imply genuinely different designs, and I can't tell which claims are load-bearing for which camp. So before I read any more of it, write out what I should be demanding: the desiderata for an account of when and why a body picked by lot is entitled to make binding decisions. I want the phenomena it has to explain, with the case behind each one. Some that keep nagging at me: why I'm completely fine with a randomly drawn jury but would not accept a randomly drawn judge writing the opinion; why the same sixty people voting on day one seems worse than those sixty people voting after three weekends of testimony, when the selection procedure is identical; why nobody proposes sortition for the executive even when they propose it for legislatures; why the losing side in an election generally swallows the result but I'm not sure they would swallow a result from a body that never had to ask anyone for a vote; and why the mini-publics that actually get run are almost always stratified to match census categories rather than drawn as a pure lottery. Also the distinctions it can't collapse — I suspect equal chance of being selected and equal influence over the outcome are not the same thing, and that a body mirroring the population is not obviously the same as a body representing it.

  Then the part I actually care about most: tell me which of the things people demand here are real requirements and which are just the house preferences of one camp, because I think a lot of the literature quietly drops a requirement rather than admits it can't be met. My own guess, which may be wrong, is that "nobody is systematically excluded from office" and "the body has to look like the public it speaks for" pull against each other, since the second one requires sorting people into boxes and topping up whichever box is short — which is precisely not a lottery. If some subset of the desiderata is jointly unsatisfiable, say so plainly and show me the squeeze, because then the list is the result and I'd rather know that up front. And tell me which single requirement does the most work in knocking out candidate accounts — I want one thing I can hold up against whatever our assembly turns into, not a scorecard of everything.

  One concrete thing to run it on, since abstract lists are easy to be agreeable about: a friend of mine is pushing a design where the assembly members serve a single long term, twelve years, specifically so they stop thinking like amateurs and build real expertise, and where anyone drafted can decline and nominate a substitute of their own choosing, who then also serves the full term. I feel like that gives away something important and keeps something important, but I can't articulate either half without just saying it feels undemocratic, and that's not an arguement. So give me the vocabulary for what that design trades — separately for the long term and for the substitution rule, since I think they're not the same kind of problem. Please write the whole thing as continuous prose, like an email: no headings, no bullet points, no bold, no tables. I know that's a weird ask for something that's shaped like a list, but I'm going to be reading it on the bus with one thumb and the numbered-list formatting always turns into soup on my phone.
reasoning: |-
  Okay, the user is preparing for a citizen's assembly on transit and has dived deep into sortition theory. They're overwhelmed by conflicting justifications—fairness, epistemic benefits, symbolic representation—and want clarity on what makes a randomly selected body legitimate enough for binding decisions. Their frustration is palpable: they’ve spotted gaps where theorists quietly drop inconvenient requirements, and they want to know which demands are fundamental versus factional preferences.  

  The concrete gripes they list are sharp. Why accept juries but not random judges? Why does deliberation time matter if selection is identical? Why no sortition for executives? Why do election losers concede but might reject lotteries? Why stratify instead of pure lottery? Each exposes a tension in the theory. They’re especially wary of the conflict between "no one excluded" (pure lottery) and "mirror demographics" (stratification), suspecting these can’t coexist.  

  Then there’s their friend’s proposal: 12-year terms with member substitution. The user senses this "feels undemocratic" but lacks the vocabulary to dissect why. They need tools to parse the trade-offs—both the long term (does expertise corrupt?) and substitution (does it break equality?).  

  Underneath, they’re not just preparing for an assembly; they’re auditing democracy’s plumbing. They want to *trust* the process but won’t fake it with unexamined ideals. Their urgency is practical: they’ll soon help decide transit budgets, and they refuse to be a pawn in someone else’s political theory.  

  So the response must:  
  1. **Map the tensions honestly**. No smoothing over incompatibilities—e.g., show how fairness (equal chance) clashes with mirroring (forced quotas), making them jointly unsatisfiable without trade-offs.  
  2. **Identify the keystone requirement**. They asked for one test to apply; I’ll argue *non-alienation* (can the public recognize itself in the body’s voice?) does heaviest lifting, knocking out designs that feel elitist or detached.  
  3. **Dissect the friend’s proposal surgically**. Long terms trade amateur authenticity for captured expertise; substitution smuggles in self-selection, skewing influence. Both erode non-alienation.  
  4. **Give them a litmus test for their assembly**. When debating designs, ask: "If this body overrules elected officials, would the public accept it because they see their own judgment reflected?" If not, legitimacy crumbles.  

  The tone should be email-intimate—no academic scaffolding. They’re on a bus, thumb-scrolling; clarity is kindness.
answer: |-
  Here’s how I’d frame it, walking through the tensions and trade-offs as you asked. Think of this as unpacking the hidden architecture beneath all those theories — what holds weight, what buckles under strain, and where the irreconcilable demands live.

  Start with the core puzzle: why does a lotteried body ever *deserve* to make binding decisions? The three strands you found — fairness, epistemic quality, and symbolic expression — aren’t just answers; they’re responses to distinct flaws in electoral systems. Fairness targets the exclusion of ordinary people from power. Epistemic claims target groupthink and perverse incentives in elected bodies. Symbolic expression targets the message sent about whose judgment matters. Crucially, these point to different designs because they solve different problems. A pure lottery maximizes fairness (equal chance) but might undercut epistemic quality if, say, complex evidence isn’t absorbed. Stratification (matching census categories) boosts symbolic representation ("this body *looks* like us") but weakens strict fairness (your chance isn’t equal if demographics are quota-controlled). Deliberation enhances epistemic quality but doesn’t change the initial selection fairness.

  Your nagging cases reveal where these strands conflict. A random *jury* feels legitimate because its role is bounded (fact-finding, applying law), its deliberation is intensive, and its verdict requires unanimity or near-unanimity — all epistemic and fairness safeguards. A random *judge* writing an opinion lacks those constraints; we fear amateur error or bias in complex law-shaping, violating epistemic demands. The same sixty people voting on day one versus after deliberation highlights the *process* dependency: deliberation (hearing experts, debating) is often the epistemic justification overriding initial selection randomness. Without it, the body seems arbitrary. Why no sortition for executives? Epistemic risk is too high — executives act swiftly, decisively, and often secretly. We demand accountability through elections or appointments precisely because the cost of error or capture is catastrophic, and a lottery can’t guarantee competence or answerability post-hoc. Election losers swallow results partly because they consented to the *procedure* (voting) and retain hope of winning next time; a lotteried body offers no such procedural consent or future recourse, making its legitimacy hinge entirely on perceived fairness and soundness *of outcome*. If the outcome feels alien or ill-considered, dissent is harder to quell. Stratification (not pure lottery) addresses this by trying to make the body *feel* representative, hoping to foster symbolic buy-in and reduce alienation, even if it compromises pure equal-chance fairness.

  The deep tension you spotted is real: **"Nobody systematically excluded" (fairness) vs. "The body must mirror the public" (symbolic representation/epistemic diversity)**. They *are* often incompatible. A pure lottery *could*,
  by chance, under-represent a group (e.g., only 1% women in a 100-person sample from a 50% female population). Fixing that via stratification ("topping up") means some people (those in underrepresented groups) have a *higher* probability of selection than others. Strict equality of chance is sacrificed for mirroring. Proponents argue this is necessary for legitimacy (symbolic) or better decisions (epistemic diversity), but it *is* a trade-off. The literature often obscures this by framing stratification as "fair" in a group-inclusion sense, not an individual-probability sense. It’s not that one requirement is fake; it’s that theorists prioritize differently based on their core justification (fairness camp hates stratification; symbolic/epistemic camps embrace it).

  So, what’s the single most load-bearing requirement? **Non-Alienation.** Can the public recognize the body’s decisions as plausibly their *own* collective judgment, had they the time/information? This knocks out accounts that can’t explain why we reject random snap polls (no deliberation) or unrepresentative samples (fails mirroring). It forces the justification to grapple with both the *input* (who’s in the room?) and the *process* (how do they decide?). Fairness alone fails if the process feels arbitrary; epistemic quality alone fails if the body seems socially alien; symbolic representation alone fails if they deliberate poorly. Non-alienation is the keystone because it synthesizes the others: a body seen as "like us," deciding thoughtfully, via a fair-seeming process, generates acceptance. Lose that, and binding power feels illegitimate.

  Now, your friend’s proposal: **12-year terms with self-nominated substitutes.** Break it down.

  1.  **The Long Term (12 years):** This aims for *epistemic gain* through deep expertise. The trade-off is against *amateur authenticity* and *anti-capture safeguards*. The core value of sortition, especially for fairness and symbolic expression, often relies on "ordinary people" bringing fresh, unvarnished perspectives shaped by lived experience, not insider status. A 12-year term risks transforming members into quasi-professionals, detached from the public they started with, potentially captured by bureaucracies or interest groups they engage with constantly. It sacrifices the "rotation of office" ideal (preventing entrenched power) central to Athenian fairness. Why trust them more than elected politicians then? They lack electoral accountability. The epistemic gain might be real, but it comes at the cost of the very "outsider" status that makes sortition symbolically distinct and resistant to systemic corruption. You feel it’s "undemocratic" because it undermines the link to the current, evolving demos; it’s a *de facto* elite creation, just selected differently initially.

  2.  **Self-Nominated Substitution:** This prioritizes *individual convenience* and potentially *epistemic quality* (letting "busy experts" send someone qualified). The trade-off is against **equal opportunity and random representativeness.** It introduces self-selection bias twice over: first, the initial draftee might decline (skewing towards those with time/confidence), second, *they* choose the substitute (skewing towards their social/professional circle, likely more privileged or politically engaged than a random person). This fundamentally breaks the fairness argument (equal chance is gone) and the mirroring/representativeness argument. The body becomes a network of nominees, not a random sample. It privileges individual choice over collective fairness. The expressive message changes too: it says office is transferable or delegable, undermining the Athenian ideal of direct, personal civic duty. It feels "undemocratic" because it allows the initial randomness to be gamed or circumvented, replicating the very networks of influence sortition seeks to bypass.

  **The Squeeze:** The fundamental joint unsatisfiability lies in maximizing all desirable traits simultaneously. You cannot have pure equal-chance randomness *and* perfect demographic mirroring *and* guaranteed deep expertise *and* robust anti-capture mechanisms *and* efficient decision-making. Designs prioritize. Your assembly’s legitimacy for *binding* decisions (though yours isn’t) would hinge most critically on overcoming non-alienation: did the process (selection + deliberation) feel sufficiently fair, informed, and representative that the public could see the outcome as *theirs*? Stratification leans into mirroring to aid this; long terms risk undermining it by creating detachment; substitution destroys random representativeness, fracturing it entirely.

  So at your transit assembly, the key test isn’t a scorecard. It’s this: **After three weekends of testimony and debate, when these sixty people vote, will the public — including those who disagree with the outcome — recognize that vote as a reasonable, informed reflection of what *a group like them*, given the same time and facts, might conclude?** If the selection felt rigged, the deliberation shallow, or the members seem unlike the public, that legitimacy frays. Your role is to push for process integrity on those terms: clear evidence, diverse viewpoints aired, respectful debate, and transparency about how stratification shaped the group. Don’t chase theoretical purity; ensure the lived experience in the room fosters that crucial sense of non-alienated connection. That’s what makes a mini-public’s voice resonate, binding or not. Good luck — and watch out for the substitution advocates.
