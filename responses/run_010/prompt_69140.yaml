prompt: |-
  Just got back from three hours in the pub with Dan, who's doing a masters in logic, and I've completely lost the plot. We were meant to be going over the seminar reading on conditionals — Adams, Lewis's triviality results, Edgington — and instead he walked me into an argument for a conclusion I'm sure is false but cant block, and then he ran the same argument again for counterfactuals and it got properly ridiculous. Here's his chain as best I can reconstruct it; he sketched it on a beer mat and I've tidied it up.

  1. Indicative conditionals embed. They get negated ("it's not the case that if she applied she'll get it"), they occur under "probably", they can be the antecedent of another conditional, and they turn up in modus ponens and modus tollens arguments everyone agrees are valid.
  2. Only something with truth conditions can do all that. If "if A, B" expressed no proposition at all, there'd be nothing for "not" or "probably" to operate on, and there'd be no fact of the matter about whether the modus ponens inference is valid.
  3. So indicative conditionals have truth conditions: they're true or false.
  4. "If" is a connective joining two sentences. By compositionality, the truth conditions of "if A, B" are fixed by the contents of A and B plus the meaning of "if" — and "if" means the same thing in every indicative conditional.
  5. So whether "if A, B" is true is settled by whether A is true and whether B is true. There's nothing left in the sentence for it to depend on.
  6. Given that, only one truth-function is available. It must be false when A is true and B is false, or modus ponens fails. It must be true when A and B are both true, or "A, and if A then B" would be a contradiction. And it can't be false whenever A is false, or a conditional would settle the truth value of its own antecedent, which it plainly doesn't — "if she applied, she'll get the job" tells you nothing about whether she applied. Those three constraints leave exactly ¬A ∨ B.
  7. So indicative conditionals are material conditionals, and P(if A, B) = P(¬A ∨ B).
  8. Adams' thesis says P(if A, B) = P(B | A). The two coincide only in special cases — trivially when P(A) = 1 — and not in general. Concretely: 200 applicants, 40 got interviews, 12 of those interviewed got offers, and nobody got an offer without an interview. "If an applicant was interviewed, they got an offer" has conditional probability 12/40 = 0.3, but read materially its probability is (160 + 12)/200 = 0.86.
  9. Adams' thesis is supposed to be the one thing the data support — it's what explains why we assert some conditionals and not others. But (1)–(6) look forced. So Dan's verdict: Adams is wrong, assertibility isn't probability, and we should be Griceans about the lot — material truth conditions plus a pragmatic story about why the odd-sounding ones go unsaid.
  10. Then he ran the identical argument for counterfactuals. They embed too, they're built out of two sentences by a connective, they're false when the antecedent is true and the consequent false, and a counterfactual can't be refuted merely by its antecedent being false. So counterfactuals are material as well — which makes every counterfactual with a false antecedent true, including "if Oswald hadn't shot Kennedy, the moon would have been made of cheese" — and the entire closest-worlds industry was a detour.

  Its that last step where I want to say something has gone wrong, but the trouble is I can't find a place to put my finger on where the earlier steps weren't already doing the damage. If (1)–(6) really force the material reading for indicatives, what's supposed to block it for counterfactuals other than that the result is horrible? My instinct is to keep (1), (3) and Adams' thesis and sacrifice something in the middle, but Dan says the middle steps are just compositionality, and that denying them means giving up on having a semantics at all. He also floated a fallback I don't know what to do with: keep material truth conditions, but insist the assertibility rule is conditional probability even inside embeddings, so that "probably, if she applied, she'll get it" comes out as something like the probability that she gets it, supposing she applied. If that's coherent, what work is the truth condition of the embedded conditional doing there, and what happens when the two rules give different verdicts about the same sentence?

  So: which step do you reject, why did it look innocent while you were reading along, and what does each exit cost — the Edgington route (deny 2 and go suppositional), the Stalnaker route (deny 5), the Grice route (bite the bullet at 9), or something else I haven't thought of? Please don't turn this into a neutral survey of the options: commit to the single weakest link, defend that commitment, and then tell me what would change your mind — which argument or piece of evidence, if I came back with it next week, ought to make you revise the diagnosis — and where you think your own reasoning here is most likely to fail. British English, please, and assume I've done one semester of formal logic but no more than that.
reasoning: |-
  Okay, let me try to unpack this. The user's friend Dan has presented an argument that indicative conditionals must be material conditionals, using steps from embedding to compositionality. The user is troubled because this leads to counterintuitive results, especially when applied to counterfactuals. They're looking for the weakest link in Dan's argument and what it would take to change that view.

  First, I need to recall the key points of Dan's argument. Step 2 claims that only propositions with truth conditions can embed under operators like negation. But I remember Dorothy Edgington's work—she argues that conditionals aren't propositions but rather expressions of conditional supposition. So when we say "not (if A, B)", it's not negating a proposition but expressing that B doesn't hold under A. That challenges step 2 directly. 

  Then there's compositionality in step 4. If "if" isn't a truth-functional connective, its meaning could be context-dependent. Stalnaker's possible worlds approach comes to mind here—the truth depends on more than just A and B's truth values. But denying compositionality feels risky. Maybe step 5 is the issue? It assumes that only A and B's truth values matter, but Stalnaker would say the selection function matters too.

  The user mentioned Adams' thesis and the job interview example. The material conditional gives P=0.86 while conditional probability is 0.3. If Adams is right, then step 7 must be wrong. But Dan's embedding point seems strong. How can conditionals embed if they're not propositions? Edgington handles embeddings by explaining how operators apply to the act of supposition. For example, "probably (if A, B)" means the probability of B given A is high. That preserves Adams' thesis without truth conditions.

  For counterfactuals, the same logic would lead to absurdities like the moon being cheese. But Lewis/Stalnaker semantics avoid this by using similarity of worlds. So the argument fails for counterfactuals because step 5 ignores the extra structure. But why accept it for indicatives then? The user's instinct to reject step 5 for both makes sense. The real weak link is step 2—denying that embeddings require truth conditions.

  What would make me change my mind? If someone showed that conditional probability can't handle embeddings without truth conditions. For instance, if "if A, B" embedded in a complex sentence couldn't be interpreted suppositionally, that'd be a problem. But Edgington and others have ways around this. The cost is a messier semantics, but it saves Adams' thesis and avoids the material conditional's issues.

  The user also asked about Dan's fallback: material truth conditions but conditional probability for assertibility. But then in embeddings, which one applies? If "probably (if A, B)" uses conditional probability while the truth condition is material, there's a clash. That seems unstable. Better to fully embrace the suppositional view and drop truth conditions altogether.
answer: |-
  Right, let's cut through the fog. Dan's argument is clever but rotten at step 2 – the claim that *only* something with truth conditions can embed. That's the weakest link, it *looks* innocent because we're used to truth-conditional semantics for most things, and denying it costs you a clean truth-conditional story but saves Adams' thesis and avoids the counterfactual nonsense. Here's the breakdown:

  1.  **The Weakest Link: Step 2 ("Only something with truth conditions can embed")**
      *   **Why it's weak:** It assumes that the *only* way to explain how a phrase functions within negation, probability operators, antecedents, and valid inferences is by assigning it classical truth conditions (True/False). This is demonstrably false. There are coherent semantic frameworks where expressions can play these syntactic roles *without* having standard truth conditions.
      *   **Why it looked innocent:** Because for *most* declarative sentences ("It rained", "Dan is tall"), this is true. We naturally extend this model to conditionals without questioning it. Compositionality (Step 4) feels like an unassailable principle of how language *must* work, making Step 2 seem like a necessary stepping stone.
      *   **The Exit: The Suppositional/Expressivist Route (Edgington's Path)**
          *   **The Core Idea:** An indicative conditional "If A, B" does *not* express a proposition about the world with a single truth value. Instead, it expresses (or proposes) a constraint on your *degrees of belief*: it signals that your credence in B *given* A is high (or that you'd infer B under the supposition that A). It's fundamentally about *epistemic commitment*, not direct description.
          *   **Handling Embeddings (Defanging Step 2):**
              *   **Negation ("Not [If A, B]"):** Doesn't negate a truth condition. It *rejects* the proposed constraint on belief. It means "It is *not* the case that B is highly probable given A" or "I *don't* accept that B follows from A".
              *   **"Probably" ("Probably, if A, B"):** Doesn't assign probability to a truth condition. It modifies the *strength* of the expressed constraint: "It is probable that B is highly probable given A" or "It's likely that B follows from A". Crucially, the embedded "if A, B" *itself* isn't being assigned a probability; the whole phrase expresses a complex probabilistic attitude.
              *   **Antecedent of Another Conditional ("If [if A, B], then C"):** This is complex, but suppositional theorists propose it expresses something like: "Supposing that one accepts the constraint [B given A], then C (probably) follows". The embedded conditional isn't treated as a truth-bearer.
              *   **Modus Ponens/Tollens Validity:** The validity of "A; If A, B; Therefore B" comes not from the truth of a proposition expressed by "If A, B", but from the *rule of inference* itself. To accept the premises *just is* to be committed to the conclusion if A is true. If you accept "A" and you accept the constraint "B given A", you are rationally committed to "B". The validity is grounded in the *function* of the conditional in reasoning, not the truth of a proposition it denotes. Similarly for MT.
          *   **Cost:** This requires a radical shift in semantics. You abandon the idea that *every* declarative sentence expresses a proposition with classical truth conditions. Compositionality becomes much messier (though not abandoned entirely – it applies to the *acts* or *constraints* expressed, not truth values). Explaining embeddings requires careful, sometimes non-standard, rules. It feels less "logical" initially than truth-conditional models. It struggles less with counterfactuals than indicatives (more on that below).

  2.  **Why Denying Step 2 is Better Than the Alternatives:**
      *   **Denying Step 3/7 (Truth Conditions/Material Conditional - The Grice Route):** You bite the bullet at step 9. Indicatives *are* material conditionals. Adams' thesis is wrong; assertibility isn't probability. You need a complex pragmatic story (Grice) to explain why we don't assert "If A, B" when ¬A is known, or when P(B|A) is low even if ¬A∨B is probable. The cost? The pragmatic story feels incredibly strained for the core cases (like your job interview example: why *wouldn't* you assert the highly probable material conditional "If interviewed, got offer"? Gricean maxims struggle to explain the *strength* of the intuition that it's *wrong* to assert it). It utterly fails for counterfactuals ("If Oswald hadn't shot, moon=cheese" is *true* but utterly unassertible? Pragmatics can't salvage that horror).
      *   **Denying Step 5 (Truth depends only on A/B's truth - The Stalnaker Route):** You keep truth conditions but make them non-truth-functional. "If A, B" is true if B is true in the "closest" world where A is true. This saves Adams' thesis for simple assertions (P(if A, B) ≈ P(truth of the proposition in Stalnaker's sense) ≈ P(B|A) under plausible assumptions). **The problem:** Embeddings under *probability operators* become a nightmare. What is P(*If A, B*)? If *if A, B* is a proposition about a specific world (the closest A-world), then its probability is the probability that *that specific world* is actual *and* B is true there. But this often *doesn't* equal P(B|A). Stalnaker himself wrestled with this and proposed complex (and controversial) "imaging" techniques. It feels like trying to force a square peg (possible worlds truth condition) into a round hole (embedding under "probably" requiring P(B|A)). It also arguably makes step 4 ("if" has a uniform meaning) harder to maintain cleanly between indicatives and counterfactuals.

  3.  **Counterfactuals: Why Step 2 is Still the Key**
      *   Dan's application to counterfactuals highlights the absurdity inherent in the truth-conditional/material view. The suppositional view *can* be extended to counterfactuals, though it's less developed than for indicatives. The core idea remains: "If A had been the case, B would have been" expresses a belief about what *would* or *might* have followed *under the counterfactual supposition* of A. Embeddings are handled similarly: "Not [If A, B]" rejects the counterfactual suppositional link; "Probably [If A, B]" expresses confidence in the link under supposition. Crucially, it avoids the material conditional's absurdities *without* needing possible worlds truth conditions (though possible worlds models can be seen as *representing* the structure of our counterfactual suppositions). The closest-worlds industry isn't a detour; it's a powerful model for understanding the *content* of the suppositional constraint we express with counterfactuals. Denying Step 2 blocks Dan's argument at the source for both indicatives *and* counterfactuals.

  4.  **Dan's Fallback (Material Truth + Conditional Prob Assertibility in Embeddings):**
      *   This is unstable. What is "Probably [If A, B]" *saying*? If it's using the material truth condition, it should mean "Probably [¬A ∨ B]". But Dan wants it to mean something like "The probability of B given A is high". These are fundamentally different! Your job example: "Probably, if interviewed, got offer". Material reading: Prob(¬Interviewed ∨ GotOffer) = 0.86. Adams/Suppositional reading: Prob(GotOffer | Interviewed) = 0.3. They contradict each other directly. You *cannot* have both. The truth condition becomes idle baggage in embeddings, doing no work while conflicting with the intended assertibility rule. It collapses into the suppositional view but without intellectual honesty – you're clinging to a vestigial truth condition that doesn't function.

  5.  **What Would Change My Mind?**
      *   A single, clear, uncontroversial example where a conditional is *unambiguously* embedded in a context where it *must* be interpreted as having a classical truth value *independent* of supposition, and where the suppositional view demonstrably fails to capture the meaning. For instance:
          *   A scenario where "It is true that [If A, B]" is clearly used and understood distinctly from "It is highly probable that B given A".
          *   A valid inference pattern involving embedded conditionals that *cannot* be explained by rules governing suppositional commitments and *requires* the embedded clause to bear a truth value.
      *   **Where My Reasoning is Most Likely to Fail:** On the handling of *iterated* conditionals ("If [If A, B], then C") within the suppositional view. While expressivists/suppositionalists *have* proposals, this is arguably the trickiest area for them. If a compelling argument emerged showing that such iterations *force* the embedded conditional to be a truth-bearer, that would be a serious blow. Similarly, if someone formalized the suppositional view rigorously and showed it *cannot* coherently handle probability operators across different contexts without smuggling in truth conditions, that would be problematic. I'm betting that these challenges can be met (or are less severe than the problems of the alternatives), but that's the vulnerable flank.

  **In short:** Dan's Step 2 is the false move. It smuggles in the assumption that embedding *requires* classical truth conditions. Reject that. Embrace the suppositional view (Edgington). It preserves Adams' thesis, explains embeddings coherently (though differently), avoids the material conditional's horrors for both indicatives *and* counterfactuals, and renders Dan's entire chain invalid from the outset. The cost is a non-standard semantics, but it's a price worth paying to avoid the dead ends and absurdities of the alternatives. Now, go get another pint and tell him his beer-mat logic rests on a false dichotomy. Cheers.
