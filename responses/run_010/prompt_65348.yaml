prompt: |-
  I chair the evidence-review panel for a national mental-health classification. Our terms are used in primary-care coding, insurance adjudication, decisions about school accommodations, and forensic risk assessment. The schedule is revised on a triennial cycle; in the coming one we expect roughly ten proposals for new categories and three proposals to rename existing ones. A positive recommendation is close to irreversible. Once a term enters the coding schedule it is absorbed into statute, clinical guidelines, and the research literature, and withdrawal requires a separate multi-year process over which we have no jurisdiction. The panel is eleven clinicians, one methodologist, and two lay representatives; we allow six weeks from receipt of a dossier to recommendation, and the assessment section of each recommendation is capped at four pages.

  Our standing dossier format covers the usual ground: construct definition, delimitation from neighbouring categories, prevalence estimates, reliability across raters, prognostic value and treatment-response evidence. What it does not cover is the feedback the term generates once it is in circulation, and that omission has cost us. A category adopted ten years ago has since tripled in recorded prevalence while every population-level risk indicator we track has been flat. Our critics say we manufactured the condition we counted. At present we have no method for deciding whether that is so, whether the growth reflects improved case-finding, or whether incidence genuinely rose. Several members have been reading Hacking on the way classifications of people differ from classifications of things: the classified can learn the classification, describe themselves in its terms, and change accordingly, so that the class described in the dossier and the class that exists a decade later need not be the same class. I want that idea turned into something we can run, not into a cautionary paragraph at the end of a report.

  Please write the following.

  1. The procedure itself, as numbered steps of no more than a paragraph each. For every step state what counts as a sufficient answer, what part of the dossier it draws on, what the step can conclude on its own, and where it terminates the review with a no. It must be runnable by people with no training in philosophy and no time for theory, and it must not come with a bibliography or a reading list.

  2. An early screen that identifies proposals where feedback risk is genuinely low — for instance where the term is technical, is never spoken to the person classified, and functions only as an index to an intervention that already exists. The procedure must be capable of returning a verdict of low interactivity and proceeding on the ordinary evidential grounds. If it treats every label as a hazard, the panel will stop using it.

  3. A requirement that the expected feedback be stated in advance in a checkable form. For each proposal: what signature would adoption leave on the data — in the shape of reported symptoms, in the severity distribution of newly diagnosed cases, in the demographic composition of the class, in the geographic and institutional pattern of uptake — and how would that signature distinguish change induced by the label from better ascertainment and from a real change in incidence. Specify what the panel must record at the moment of adoption so that the next cycle can audit its own prediction.

  4. A treatment of feedback as two-sided. The mechanism that produces identity foreclosure, lowered expectation, and diagnostic overshadowing is the same mechanism that produces access to services, exculpation, community formation, and a research base. Show which parts of that balance are factual questions the panel can investigate and which are value questions that must be handed to a named decision-maker, with the trade-off stated in terms a lay representative could follow.

  5. A step that separates harms attaching to a label without moving the kind — stigma directed at a trait that would be equally stigmatized under any other name — from harms arising because the kind itself has changed. Last cycle we conflated the two and prescribed renaming where what was needed was a change in the criteria.

  6. An account of how the procedure applies to renaming, since a euphemism is not obviously a free improvement: it changes who finds the term applicable to themselves, changes the threshold at which clinicians become suspicious, and orphans the prognostic knowledge accumulated under the old name.

  Then run the procedure on three cases and give the verdict and reasoning for each. First, a proposal from my own department for Prolonged Situational Distress: persistent distress of more than twelve months following a documented life disruption, offered as distinct from depressive disorder, in language that is immediately legible to patients and to the press. Second, a proposal for Biphasic Response Pattern, defined solely by two consecutive assay values, predictive of response to a treatment already in use, with a term confined to specialist reports. Third, a proposal to replace our existing and widely resented category Personality Deviance Disorder with Adaptive Rigidity Pattern, which our lay representatives regard as an unqualified good. At least one of the three must come out against the preference of the party that proposed it; I would rather see the procedure bite than see it deliver three comfortable yeses. Where it bites, say what the proposer could change in the definition or in the rollout to obtain a different verdict.

  Finally, state plainly what the procedure cannot do. We have no jurisdiction in which a label can be withheld at random, the feedback is entangled with simultaneous changes in treatment availability, and a published statement that a category is self-altering is itself liable to alter behaviour. Say how far those limits weaken the audit in point 3, and identify the places where the panel should nevertheless act without knowing.

  Format: the numbered steps, a one-page form the chair can complete for the public record, the three worked verdicts, and the limits section. Roughly 2,500 words in total.
reasoning: |-
  Okay, the user chairs a national mental health classification panel and needs a practical procedure to address how diagnostic labels can change behavior and society after adoption. This is crucial because their current system lacks feedback mechanisms, leading to problems like inflated prevalence rates where a past category tripled without clear reasons. They want to avoid philosophical jargon and create an actionable tool for clinicians, methodologists, and lay members.

  The request is highly detailed: six specific components must be covered, including the core procedure steps, an early screen for low-risk terms, predictive requirements for feedback, analysis of label impacts (both good and bad), distinction between label-based and criteria-based harms, and special handling of renames. Plus, three test cases must demonstrate the procedure's rigor—with at least one rejection—and a frank discussion of limitations.

  Breaking this down:  
  First, the procedure needs numbered steps that are self-contained and executable. Each step must define sufficiency standards, data sources, independent conclusions, and clear rejection points. Philosophical concepts like Hacking's looping effects must be operationalized into concrete checks—e.g., tracking whether labels are disclosed to patients or influence self-perception. The early screen (point 2) is vital for practicality; if everything flags high risk, busy panelists will ignore it. Terms like "Biphasic Response Pattern" (a technical biomarker) should sail through this screen, while patient-facing ones like "Prolonged Situational Distress" warrant full scrutiny.  

  For predictive requirements (point 3), the panel must document expected data signatures upfront—say, predicting how "Prolonged Situational Distress" might alter symptom reporting patterns—to later distinguish real incidence changes from labeling effects. This needs tangible anchors: demographic shifts, severity distributions, etc.  

  The two-sided feedback analysis (point 4) is tricky. Benefits (service access) and harms (stigma) stem from the same mechanism. The procedure must separate factual questions (e.g., "Does this label increase help-seeking?") from value judgments (e.g., "Is reduced stigma worth potential overdiagnosis?"), directing the latter to decision-makers with transparent trade-offs.  

  Renaming (point 6) isn't just cosmetic. Switching "Personality Deviance Disorder" to "Adaptive Rigidity Pattern" might seem positive but could desensitize clinicians to severity or fracture research continuity. The procedure must flag such risks.  

  For test cases:  
  - **Prolonged Situational Distress** should likely fail—its patient-facing language and lack of diagnostic safeguards risk feedback loops. Remediation? Tighten criteria or pilot cautiously.  
  - **Biphasic Response Pattern** should pass the early screen—technical, undisclosed, no identity impact.  
  - **Adaptive Rigidity Pattern** rename might surprise by getting a "no"—if prognostic knowledge transfer isn't secured or stigma persists despite the new name.  

  Limitations are unavoidable: no RCTs for labels, entangled confounders (e.g., new treatments), and the observer effect (admitting labels influence behavior may itself alter behavior). The audit (point 3) remains useful but becomes correlational; the panel must act despite uncertainty where risks are asymmetric (e.g., high stigma potential).  

  The chair needs this distilled into a one-page form for public transparency—capturing predictions and rationale without bureaucracy. Overall, the goal is rigor without paralysis: a tool that bites when needed but doesn't demonize all labels.
answer: |-
  ## Feedback-Aware Classification Review Procedure (FACR)

  **Core Principle:** Classifications interact with the classified. This procedure assesses the likelihood and nature of that interaction ("feedback risk") and its potential consequences *before* adoption, using observable predictions.

  ### I. The Procedure Steps

  1.  **Screen for Low Interactivity Potential:**
      *   **Action:** Determine if the term is *only* used in technical/internal contexts (e.g., lab reports, specialist communication) and will *not* be disclosed to the person classified or used in public discourse about them. Assess if the term solely indexes a pre-existing, objectively defined intervention/trait without implying identity, cause, or moral status.
      *   **Sufficient Answer:** Clear documentation showing the term's use is restricted (e.g., "confined to biomarker reports", "not for patient communication"), *and* it solely points to an established physical process or treatment protocol without broader meaning.
      *   **Dossier Source:** Proposer's stated intended use; definition; proposed coding context.
      *   **Conclusion:** If LOW, proceed to standard evidence review *only*. Feedback assessment ends here. If NOT LOW, proceed to Step 2.
      *   **Termination:** None. Always proceeds to standard review or Step 2.

  2.  **Characterize Feedback Mechanism:**
      *   **Action:** Identify *how* the label is likely to interact with people. Will it be disclosed? Used in identity claims? Affect self-perception? Influence societal perception (stigma, expectations)? Enable/disenable access to resources? Form the basis for communities?
      *   **Sufficient Answer:** Explicit description of the primary pathways for interaction (e.g., "Label will be disclosed in diagnosis, used in school accommodation requests, likely discussed in media", "Potential for online community formation", "May influence self-narrative of resilience vs. illness").
      *   **Dossier Source:** Definition wording, proposed label, intended use cases, comparators (e.g., similar existing categories).
      *   **Conclusion:** Identification of key feedback pathways (e.g., identity formation, stigma risk, service access). No verdict yet.
      *   **Termination:** None.

  3.  **Predict Observable Signatures:**
      *   **Action:** For each key pathway identified in Step 2, predict specific, measurable changes in data *if feedback occurs*. How will reported symptoms change? How will severity distribution at diagnosis shift? How will demographics (age, gender, SES) of the diagnosed class change over time? What geographic/institutional uptake patterns would signal feedback vs. better ascertainment vs. true incidence rise? *Record these predictions explicitly.*
      *   **Sufficient Answer:** Specific, falsifiable predictions (e.g., "Within 3 years, >30% of cases will present with symptoms verbatim from public descriptions", "Initial severity distribution (mild 40%, mod 40%, severe 20%) will shift to >60% mild within 5 years", "Uptake will correlate strongly with media coverage regions, not known risk factor prevalence").
      *   **Dossier Source:** Construct definition, prevalence estimates, risk factors, proposed diagnostic criteria, comparators.
      *   **Conclusion:** Documented set of testable predictions for future audit. No verdict yet.
      *   **Termination:** None.

  4.  **Assess Feedback Balance (Factual):**
      *   **Action:** For each key pathway, assess the *likelihood and magnitude* of predicted effects, based on evidence. Can service access increase demonstrably? Is stigma likely based on similar labels? Is identity foreclosure a known risk with this construct type? Is community formation plausible? What is the evidence for treatment response *being influenced* by the label itself (e.g., placebo/nocebo)?
      *   **Sufficient Answer:** Evidence-based assessment (e.g., "High likelihood of significant service access gains based on similar category X", "Moderate risk of diagnostic overshadowing based on studies of label Y applied to trait Z", "Low evidence for community formation given construct nature").
      *   **Dossier Source:** Evidence on prognostic value, treatment response, stigma research, studies on similar constructs, lived experience input (if any).
      *   **Conclusion:** Factual assessment of the probability and scale of potential benefits and harms *caused by the label interaction*.
      *   **Termination:** If factual assessment concludes feedback effects are highly likely to be catastrophic and irreversible (e.g., overwhelming evidence of severe, imminent harm like violent targeting with no offsetting benefit), terminate with **NO**. (Rare).

  5.  **Distinguish Label Harm from Kind Harm:**
      *   **Action:** For identified potential harms (e.g., stigma), determine: Is this harm attached *specifically to the proposed label/definition*? Or is the harm inherent to the underlying traits/behaviors being classified and would likely persist under *any* label? Consider if changing the label alone would likely mitigate the harm significantly.
      *   **Sufficient Answer:** Clear differentiation (e.g., "Stigma relates to core symptoms of emotional dysregulation; renaming unlikely to reduce it significantly", vs. "Stigma is heavily associated with the term 'Deviance'; a neutral term like 'Pattern' may reduce it").
      *   **Dossier Source:** Stigma research, lived experience input, analysis of core construct vs. label connotations.
      *   **Conclusion:** Clarification whether harm points to a problem with the *label* (potentially fixable by renaming) or the *criteria/construct itself* (requires criteria change).
      *   **Termination:** None. Informs Step 6 and recommendations.

  6.  **Synthesize & Formulate Recommendation:**
      *   **Action:** Integrate findings from Steps 2-5. Summarize the predicted feedback balance. Clearly separate factual conclusions about *what effects are likely* from value judgments about *whether the net effect is acceptable*. Identify key value trade-offs (e.g., "Likely increased service access for mild cases vs. risk of medicalizing normal distress"). State explicitly if significant value judgments are involved.
      *   **Sufficient Answer:** Clear summary of predicted feedback (benefits/harms, likelihood, magnitude), distinction of facts vs. values, identification of key trade-offs.
      *   **Dossier Source:** All prior steps.
      *   **Conclusion:** A recommendation: **YES**, **YES with Monitoring Plan** (specifying predictions to audit), **NO**, or **MODIFY & RESUBMIT** (specify needed changes - e.g., criteria tightening, label change, safeguards). **Value judgments must be flagged for explicit decision by the full panel or named authority (e.g., Chair, Lay Rep lead)**, stated plainly ("The panel must decide if potential X is worth risk Y").
      *   **Termination:** Final recommendation reached.

  ### II. Low Interactivity Screen (Triggered in Step 1)
  *   **Question Set (Chair completes during initial review):**
      1.  Will the term *always* be confined to technical/internal reports (labs, specialist notes, billing codes) and *never* disclosed to the patient/subject? (YES/NO)
      2.  Does the term *only* refer to an objective, measurable biological marker or algorithm output, devoid of identity, behavioral, or moral connotations? (YES/NO)
      3.  Does the term *solely* index a pre-existing, objectively defined intervention or biological state, without creating a new "condition" identity? (YES/NO)
  *   **Verdict:** If ALL answers are **YES**, feedback risk is **LOW**. Proceed to standard evidence review. FACR ends. If ANY answer is **NO**, proceed to Step 2.

  ### III. FACR Summary Form (For Public Record - 1 Page Max)

  *   **Proposal Title:** [E.g., Prolonged Situational Distress]
  *   **Date:** [Date of Recommendation]
  *   **Low Interactivity Screen:** [LOW / NOT LOW] (If LOW, FACR ends; standard review applies)
  *   **Primary Feedback Pathways Identified:** [E.g., Patient disclosure, media use, identity potential, service access trigger, stigma risk]
  *   **Key Predictions Recorded for Future Audit:**
      *   Symptom Reporting: [E.g., Expect increase in verbatim symptom descriptions matching public materials]
      *   Severity Shift: [E.g., Expect shift towards milder presentations within X years]
      *   Demographics: [E.g., Expect disproportionate uptake in Group Y due to Z]
      *   Uptake Pattern: [E.g., Expect correlation with media coverage, not risk factors]
      *   *[Add other specific predictions as needed]*
  *   **Factual Assessment Summary:**
      *   Likely Benefits: [E.g., High likelihood of improved service access for group A]
      *   Likely Harms: [E.g., Moderate risk of diagnostic overshadowing for comorbid B]
      *   Label vs. Kind Harm: [E.g., Stigma primarily attached to core traits, not label]
  *   **Key Value Trade-Offs Requiring Decision:**
      *   [E.g., "Trade-off: Improved access for mild cases (Benefit) vs. Risk of over-medicalization & resource diversion from severe cases (Harm). Panel must decide acceptability."]
      *   [E.g., "Trade-off: Potential community benefit (Benefit) vs. Risk of identity foreclosure & reduced agency (Harm). Decision required."]
  *   **Recommendation:** [YES / YES (With Monitoring Plan) / NO / MODIFY & RESUBMIT]
  *   **Specific Modifications Required (If any):** [E.g., "Tighten duration criterion to >24 months", "Add exclusion for normative grief", "Pilot disclosure protocol"]
  *   **Designated Decision-Maker for Value Trade-offs:** [E.g., Full Panel Vote, Lay Representative Lead, Chair]
  *   **Chair Signature:** _________________________

  ### IV. Worked Verdicts

  1.  **Prolonged Situational Distress (New Category)**
      *   **Step 1 (Screen):** NOT LOW. Label is "immediately legible to patients and press." Explicitly for patient communication.
      *   **Step 2 (Mechanism):** High potential for disclosure, identity formation ("I have PSD"), media coverage, public self-diagnosis, service access requests (schools), possible community formation. Risk of medicalizing normative distress.
      *   **Step 3 (Predictions):** *Predict:* Rapid uptake >200% baseline within 3 years; initial severity: 70% mild, 25% mod, 5% sev; shift to >90% mild by Year 5; symptoms closely mirroring public descriptions; uptake spikes correlating with high-profile cases/media; disproportionate diagnosis in adolescents/young adults via schools.
      *   **Step 4 (Balance - Factual):** High likelihood of significant service access gains (schools, primary care). High likelihood of label-driven symptom reporting & increase in mild cases. Moderate risk of diagnostic overshadowing for true MDD. High risk of medicalization. Low evidence for community benefit; high risk of identity simplification.
      *   **Step 5 (Label vs. Kind):** Core harm (medicalization of situational distress) is inherent to the *construct* (classifying persistent normative reactions). Renaming won't fix this; only tightening criteria might.
      *   **Step 6 (Synthesis):** Significant benefits (access) but high risks (medicalization, diagnostic inflation, overshadowing). Core harm relates to construct breadth. Key trade-off: Access for some genuinely impaired by prolonged distress vs. Pathologizing normal experience and diverting resources. **Verdict: MODIFY & RESUBMIT.** Requires: (a) Substantially tighter criteria (e.g., duration >24 months, *marked functional impairment* equivalent to MDD, exclusions for normative grief/adjustment), (b) Specific guidance against casual public/school use, (c) Pilot phased rollout with audit plan. *Without these, high risk of creating the very phenomenon it counts.*

  2.  **Biphasic Response Pattern (New Category)**
      *   **Step 1 (Screen):** LOW. Term is "technical, confined to specialist reports." Defined solely by consecutive assay values. Indexes response to existing treatment. No disclosure to patient implied; no identity connotations.
      *   **Verdict:** Proceed to standard evidence review only. FACR assessment ends. **Presumed YES** pending standard review (assuming assay reliability & predictive validity are established).

  3.  **Adaptive Rigidity Pattern (Rename of Personality Deviance Disorder - PDD)**
      *   **Step 1 (Screen):** NOT LOW. Replaces a widely known, resented label. Intended for patient communication ("unqualified good" perceived).
      *   **Step 2 (Mechanism):** High potential for disclosure, changed self-perception ("I have ARP, not PDD"), changed societal perception (reduced stigma?), continued service access, research continuity challenge ("orphaning" old knowledge). Risk of euphemism treadmill, reduced clinical suspicion ("it's just a pattern").
      *   **Step 3 (Predictions):** *Predict:* Rapid replacement of PDD term. Initial drop in recorded prevalence (hesitancy). Symptom profiles remain stable. Severity distribution stable. Demographics stable. Uptake universal but slow in forensic settings. Potential *increase* in mild/ambiguous presentations due to lower perceived stigma. Key prediction: Prognostic studies using old PDD data will show inconsistent mapping to ARP if criteria change isn't perfect.
      *   **Step 4 (Balance - Factual):** High likelihood of reduced stigma *associated with the label* (based on term evaluation studies). High likelihood of continued service access. High risk of prognostic knowledge becoming fragmented if criteria mapping isn't flawless. Moderate risk of reduced clinical vigilance for severe manifestations ("just a pattern"). Uncertainty about long-term stigma reduction if core traits remain stigmatized.
      *   **Step 5 (Label vs. Kind):** Significant harm (stigma) was attached *specifically to the old label "Deviance"*. The new label ("Pattern") is demonstrably less pejorative. *However*, core harm (stigma associated with rigid, maladaptive traits) is inherent to the *kind* and likely persists, albeit potentially reduced. Renaming addresses the label-specific harm.
      *   **Step 6 (Synthesis):** Clear label benefit (stigma reduction). Key risks are knowledge fragmentation and potential desensitization. Crucial factual question: Can prognostic knowledge from PDD studies be reliably mapped to ARP criteria? If criteria are *identical*, mapping is perfect - low risk. If criteria change, mapping is uncertain - high risk. **Verdict: MODIFY & RESUBMIT.** Requires: (a) *Explicit, evidence-based demonstration* that existing PDD prognostic knowledge applies directly to the ARP population defined by the *new* criteria. (b) If criteria change, a plan for parallel coding/transition studies to validate prognostic continuity. *Without (a) or (b), renaming risks losing vital prognostic information, a significant harm.* Value trade-off: Reduced stigma vs. Potential loss of prognostic accuracy. Panel must decide if proven stigma reduction outweighs potential prognostic uncertainty. *Proposer must prove knowledge transfer or maintain criteria.*

  ### V. Limits of the Procedure

  1.  **No Controlled Experiments:** We cannot randomly assign labels to populations to isolate their pure effect. Feedback evidence will always be correlational or based on proxies (similar labels, stigma studies). This weakens the certainty of predictions and the audit.
  2.  **Entangled Confounders:** Feedback effects are entangled with simultaneous changes in treatment availability, social policies, economic conditions, and other classifications. The audit (Point 3) can identify predicted signatures but cannot *prove* the label alone caused them; it can only show consistency or inconsistency with the prediction. The panel must act recognizing this inherent entanglement.
  3.  **Observer Effect:** Publishing the prediction (e.g., "This label may increase mild cases") is itself an intervention that could alter behavior (Hawthorne effect, priming). The act of monitoring influences the monitored. The procedure must be run, but predictions should be archived discreetly until audit time where feasible.
  4.  **Predictive Uncertainty:** Predicting human and systemic responses is inherently uncertain. The panel must act based on the best available evidence and reasoned prediction, accepting that outcomes may diverge.
  5.  **Jurisdictional Boundaries:** The panel controls the classification schedule, not treatment access, media portrayal, or how schools/insurers implement the codes. We can predict and recommend safeguards but not dictate these external factors.
  6.  **Value Judgments are Unavoidable:** The procedure identifies and structures value trade-offs but cannot resolve them scientifically. The panel *must* make explicit value decisions on the acceptability of trade-offs (e.g., access vs. overdiagnosis, stigma reduction vs. prognostic uncertainty).

  **Acting Despite Limits:** The panel should proceed with the FACR procedure because:
  *   The cost of inaction (unanticipated harmful feedback loops) is demonstrably high and potentially irreversible.
  *   The procedure structures reasoning, forces explicit prediction, and separates facts from values, leading to more transparent and defensible decisions.
  *   Even imperfect predictions and audits are vastly superior to blind adoption. They provide a framework for learning and future correction.
  *   Key areas to act despite uncertainty include: high risk of severe, immediate harm; high risk of creating a self-fulfilling epidemic of mild cases; high risk of fracturing vital prognostic knowledge during a rename. The asymmetry of risk (irreversible harm vs. potential benefit) demands precaution. The procedure highlights these asymmetric risks.
