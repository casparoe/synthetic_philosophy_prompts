prompt: |-
  Since July I have held one of the seven voting seats on the investment committee of a community foundation with a $94 million endowment, a seat I took after a decade of teaching decision theory; the material has stopped being an exercise for me. Our bylaws require that any proposed change to the asset allocation be put to a vote against the incumbent allocation at one of the four quarterly meetings, and that a challenger prevail by simple majority. Three blocs have formed. Three members rank the current mix of public equities and long treasuries first, the private-credit variant second, and the real-assets variant third. Two rank private credit first, real assets second, and the current mix third. Two rank real assets first, the current mix second, and private credit third. Under the incumbent-challenger rule this rotates: the current mix defeats private credit 5–2, private credit defeats real assets 5–2, real assets defeats the current mix 4–3. Over four quarters we arrive back at the allocation we started with, having paid roughly $170,000 each time in manager searches, transition costs, and advisory fees. I cast the fourth vote in September that moved us to real assets, so the diagnosis I am about to offer is not disinterested.

  Our outside adviser, whose engagement comes up for renewal in November, has proposed formalizing the pattern: for six basis points a year it would nominate each quarter's challenger. Its compensation rises with the number of reallocations it generates. One colleague insists there is no problem at all — nobody compels us to take the votes one at a time, we could consider the year's plan as a whole, and in any case each quarter's majority is responding to genuinely new information about rates and credit markets, so no cycle exists at any single moment. A second member has moved to suspend all reallocation votes for twenty-four months. A third has moved that members be instructed, when voting, to weigh the later votes they foresee rather than the proposal in front of them.

  The executive director has asked me to circulate a written opinion to the committee before November 14. Please draft it — two pages at most, in prose a trustee with no training in decision theory can follow. It should open with the bottom line: which of the three motions to support, oppose, or amend; whether the adviser's nominating role should be renewed; and on what timetable. Then give the reasoning, and in particular settle where the defect lies. Is it in individual members' preferences, in the rule that aggregates perfectly coherent individual rankings into a cycling collective one, or in handing control of the order of business to a party paid per reallocation? The workable remedy depends on the answer, and I do not want a memo that prescribes steadfast commitment when the trouble is aggregation, or a voting rule when the trouble is incentives.

  Engage my colleague's objections on their merits rather than reciting the familiar claim that exposure to such a sequence shows intransitive preferences to be irrational. Say what the pattern does and does not establish when the agent can decline the sequence taken as a whole, when preferences shift with incoming information, and when the pumpable agent is a committee rather than a person. Address whether a fiduciary body may bind its own future judgment at all, and whether a moratorium or a minimum-margin requirement for switching would merely entrench a mediocre incumbent while inertia masquerades as discipline. Close with two or three criteria the committee can apply at future meetings to distinguish a reallocation that is genuinely warranted from one that is simply next in the rotation.
reasoning: |-
  Okay, the user is part of an investment committee facing a cyclical voting problem. They need a clear, two-page memo for trustees without decision theory background. Let me unpack the core issues.

  First, the voting cycle: three blocs with conflicting preferences causing a 4-quarter loop. Each reallocation costs $170k. The outside advisor wants to formalize this cycle for a fee, which creates a clear conflict of interest. 

  The colleague's objections need addressing: 
  The "no real cycle" argument because votes happen sequentially with new information. But if preferences are stable, the cycle persists regardless of information changes. 
  The moratorium proposal risks locking in a suboptimal allocation. 
  The "vote strategically" motion is impractical for trustees.

  The fiduciary dilemma is key: can they bind future votes? Normally not, but this is a procedural exception. The real problem is the aggregation rule + advisor incentives. 

  For solutions: opposing the advisor's role is obvious. Amending the strategic voting motion to include a scoring system makes sense. A 3-year minimum holding period balances stability with flexibility. 

  Future criteria should focus on threshold-based changes: material market shifts, relative performance gaps, cost-benefit analysis. This prevents mechanical cycling.

  Need to keep language accessible - no jargon. Bottom line first: reject advisor, amend motion #3, implement holding period. Then explain why the cycle exists (voting system + incentives), address each objection fairly, and provide practical safeguards.
answer: |-
  **To:** Investment Committee Members  
  **From:** [Your Name]  
  **Date:** November 7, 2023  
  **Subject:** Breaking the Allocation Cycle: Recommendation on Procedural Reform  

  ---

  ### **Bottom Line**  
  1. **Oppose** renewing the adviser’s nominating role.  
  2. **Amend** the third motion (strategic voting) to implement a **scored assessment system** for proposals.  
  3. **Support** a **24-month moratorium** on reallocations (second motion), conditional on adopting the amended scoring system.  
  4. **Timetable:** Suspend votes until Q1 2026; use the hiatus to refine the new evaluation framework.  

  ---

  ### **Diagnosis: Why We Cycle**  
  The flaw lies **not in individual preferences** (which are coherent) **nor in shifting market data**, but in **two interacting factors**:  
  - **The aggregation rule**: Our "incumbent vs. challenger" vote fails when preferences form a cycle (A>B, B>C, C>A).  
  - **Adviser incentives**: Paying the adviser per reallocation ($56,400/year if quarterly) locks us into costly, predictable churn.  

  This cycle persists *even if preferences are stable and information evolves*: each vote isolates one pairwise comparison, ignoring the broader context.  

  ---

  ### **Addressing Objections**  
  1. **"No cycle exists at a single moment" (Colleague 1)**:  
     - True: Each vote reflects sincere preferences *at that meeting*.  
     - **But**: The *sequence* exploits how preferences aggregate, not irrationality. When a committee’s preferences cycle, the agenda-setter (here, the adviser) can manipulate outcomes. Declining the "sequence as a whole" is impractical—we vote quarterly, not annually.  

  2. **"New information justifies each vote"**:  
     - If preferences genuinely shift with data, cycles would resolve spontaneously. Our consistent 4-quarter pattern suggests structural incentives dominate.  

  3. **"Committees can’t be ‘pumped’ like individuals"**:  
     - Committees *are* vulnerable when rules divorce single decisions from long-term costs. The $170,000/quarter cost makes this a fiduciary issue, not a theoretical one.  

  ---

  ### **Resolving the Dilemma**  
  - **Fiduciary self-binding is permissible** when confronting a systemic flaw. A moratorium interrupts the cycle’s mechanics without judging future merit.  
  - **Inertia ≠ discipline**: Hence, we pair the moratorium with a **new assessment system** (below) to ensure the pause isn’t an excuse for inaction.  

  ---

  ### **Proposed Solution: Amended Motion #3**  
  Replace "strategic voting" with a **scored reallocation framework** (effective 2026):  
  1. **Criteria for proposals**:  
     - ≥15% expected return advantage over incumbent (net of transition costs).  
     - Material change in market fundamentals (e.g., rates, credit spreads) exceeding historical volatility thresholds.  
     - ≥3-year holding commitment barring major regime shift.  

  2. **Voting reform**:  
     - Score each option (0–10) on **cost-adjusted risk/return** and **resilience to rate shocks**.  
     - Adopt the **highest average score** (no pairwise votes).  

  ---

  ### **Why Not the Other Motions?**  
  - **Adviser’s role**: Renewal institutionalizes the cycle. Paying to nominate challengers creates perverse incentives.  
  - **Pure moratorium**: Necessary short-term fix, but requires the scoring system to prevent long-term stagnation.  
  - **Strategic voting**: Too abstract for trustees. Scores are simpler and resist agenda manipulation.  

  ---

  ### **Path Forward**  
  1. **Vote "no"** on adviser renewal.  
  2. **Approve the 24-month moratorium** effective immediately.  
  3. **Adopt the scored assessment system** during the hiatus.  

  This stops the bleeding ($680,000/year) and builds a robust, incentive-aligned process. The cycle is a procedural artifact—not a verdict on our judgment—and we have the tools to break it.  

  // End //
