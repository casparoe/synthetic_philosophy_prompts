prompt: |-
  I sit on a municipal review board that decides whether contested conditions count as health conditions for the city's employee benefit plan and for accommodation requests. Stuff like adult ADHD, infertility, obesity, gender dysphoria, chronic fatigue, age-related hearing loss, being a carrier of a genetic variant with late onset, short stature. We get maybe thirty of these a year, they're always appealed, and I'm tired of the arguments going in circles because half the table thinks "is it a disease" is a factual question with an answer and the other half thinks it's purely a political one. Two clinicians, a lawyer, two patient reps, me, no philosophy PhDs, and we have about ninety minutes per case before we have to vote.

  So I want a decision procedure we can actually run: the questions to ask in order, what counts as a sufficient answer to each, which questions get settled by data (population frequencies, whether some mechanism is doing what it's there to do) and which ones have to be marked as our call about harm and whose interests count, and where the procedure has to hand the decision back to a person rather than pretend it computed something. I want it grounded in the naturalism vs normativism debate about disease — use the ideas, don't lecture us on the history, and no reading list, we're not going to read it.

  One specific thing I want it to catch: a party leaning on a statistical or functional fact to smuggle in a value judgment, or the reverse, treating a straight value call as if the biology forced it. If the procedure needs a named step for that, give it one.

  Then run it on three cases: adult ADHD in someone who manages fine at work but not anywhere else, age-related hearing loss in a person who doesn't experience it as a loss at all, and infertility in a single man who wants treatment. And commit — give us a verdict on each with your reasons, including one where the result is going to annoy half of us. Finish with what the procedure can't do and where it will reliably give a bad answer.
reasoning: |-
  We are designing a decision procedure that incorporates both naturalistic (fact-based) and normativist (value-based) considerations. The procedure must be executable in 90 minutes per case and involve a structured sequence of questions. It should flag when participants are conflating facts with values or vice versa.

  Key elements:
  1. **Separate Fact and Value Questions**: Clearly distinguish between questions that can be answered by empirical evidence (e.g., population frequencies, biological mechanisms) and those that require a value judgment (e.g., harm, whose interests matter).
  2. **Step-by-Step Flow**: A sequential order of questions that builds toward a decision.
  3. **Decision Points**: Some steps will lead to a clear outcome, while others will require a vote on values.
  4. **Flagging Conflations**: A specific step to catch when a party is using a factual claim to imply a value judgment or vice versa.

  **Proposed Decision Procedure**:

  **Step 1: Establish the Condition**
     - *Question*: What is the condition in question? (This should be clear from the case file.)
     - *Purpose*: Ensure everyone is discussing the same condition.

  **Step 2: Naturalistic Assessment (Fact-Based)**
     - *Question 2a*: Is there a recognized pathological process (e.g., structural/functional abnormality at the molecular, cellular, organ, or system level) associated with the condition? 
       - *Data needed*: Medical literature, expert testimony. 
       - *Sufficient answer*: Consensus from recognized medical authorities (e.g., DSM, ICD, WHO, major medical associations) or clear evidence of a deviation from typical function. If yes, move to 2b. If no, go to Step 3.
     - *Question 2b*: What is the population frequency of the condition? (Is it rare? Common? Age-dependent?) 
       - *Data needed*: Epidemiological data. 
       - *Purpose*: To assess if it's a statistical deviation. Note: Rarity alone doesn't define disease, but it's a factor.
     - *Question 2c*: Is the condition associated with a known biological mechanism that is not functioning as it typically does in the species? 
       - *Data needed*: Biological/physiological evidence. 
       - *Sufficient answer*: Evidence of a breakdown or malfunction compared to the typical design (if known) or species-typical functioning.

     **Conflation Check 1**: After Step 2, ask: "Are we using any of these facts (e.g., rarity, mechanism) to imply harm or lack of harm without explicitly stating the value judgment?" If yes, flag and require explicit separation.

  **Step 3: Normativist Assessment (Value-Based)**
     - *Question 3a*: Does the condition cause harm? 
       - *Sub-questions*: 
          - To whom? (The individual, others, society?)
          - What kind of harm? (Physical pain, reduced lifespan, impaired function, psychological distress, social disadvantage?)
          - Is the harm intrinsic or extrinsic? (e.g., due to societal barriers)
       - *Value judgment*: Requires discussion and vote if not obvious. Note: Harm must be significant and not merely a difference.
     - *Question 3b*: Is the harm primarily due to social attitudes or structures? (e.g., discrimination, lack of accommodation) 
       - *Purpose*: To distinguish between conditions that are inherently harmful and those that are only harmful because of societal context.
     - *Question 3c*: Whose interests are at stake? (The individual, the employer, the public?) 
       - *Value judgment*: This is a policy question about the purpose of the benefit plan.

     **Conflation Check 2**: After Step 3, ask: "Are we treating a value judgment (e.g., 'this is harmful') as if it were a biological fact?" If yes, flag and require explicit separation.

  **Step 4: Contextual Factors**
     - *Question 4a*: Is the condition being contested in a specific context (e.g., work performance, daily living)? 
       - *Purpose*: For accommodation, the context matters. For benefits, it may be broader.
     - *Question 4b*: Are there effective interventions (treatments, accommodations) that can mitigate the harm? 
       - *Data needed*: Evidence on treatment efficacy. 
       - *Note*: This doesn't define disease but may affect the decision to cover.

  **Step 5: Integration and Decision**
     - *Question 5a*: Does the condition meet both the naturalistic criteria (from Step 2) and the normativist criteria (from Step 3)? 
       - If yes, it qualifies as a health condition.
       - If no, it does not qualify.
     - *Question 5b*: If there is disagreement between naturalistic and normativist criteria, which one is more compelling in this context? (This requires a vote on the relative weight in this case.)

  **Step 6: Special Considerations (if applicable)**
     - *Question 6a*: Is there a risk of medicalization of normal variation? (e.g., aging, short stature) 
       - *Value judgment*: We must decide when variation becomes pathology.
     - *Question 6b*: Does recognizing this condition as a health condition conflict with other values (e.g., autonomy, justice)? 

  **Final Vote**: Based on the above, vote on whether the condition is a health condition for the purposes of the benefit plan and accommodation.

  **Conflation Check Step (Named Step)**: We have two built-in conflation checks (after Step 2 and Step 3). Additionally, at any point, any member can raise a "Conflation Alert" if they believe a fact is being used to imply a value or vice versa. The alert pauses discussion and requires the speaker to clarify: "Are you making a factual claim or a value judgment?" and then the discussion proceeds with the clarification.

  Now, we run three cases:

  **Case 1: Adult ADHD in someone who manages fine at work but not elsewhere**

  - **Step 1**: Condition is adult ADHD.
  - **Step 2 (Naturalistic)**:
    - 2a: ADHD is recognized as a neurodevelopmental disorder in DSM-5 and ICD-11. So, yes, pathological process (e.g., executive function deficits).
    - 2b: Population frequency: About 2-5% in adults, so not extremely rare.
    - 2c: Biological mechanism: Evidence of differences in brain structure and function (e.g., prefrontal cortex, dopamine regulation).
    - *Conflation Check 1*: No conflation detected. Facts are facts.
  - **Step 3 (Normativist)**:
    - 3a: Does it cause harm? The individual reports difficulties outside work (e.g., home life, social). Harm is present (psychological distress, impaired function in non-work settings). Even if work is fine, harm exists.
    - 3b: Is harm due to society? Partly, but the core symptoms (inattention, impulsivity) can cause intrinsic harm (e.g., accidents, relationship issues).
    - 3c: Interests: The individual is seeking help for non-work issues. The benefit plan may cover conditions affecting overall health, not just work.
  - **Step 4 (Context)**: The condition affects daily living. There are effective interventions (therapy, medication).
  - **Step 5 (Integration)**: Meets both naturalistic and normativist criteria. The fact that work is unaffected doesn't negate harm elsewhere. 
  - **Verdict**: Qualifies as a health condition. The benefit plan should cover it because it causes harm in the individual's life, even if not at work.

  **Case 2: Age-related hearing loss in a person who doesn't experience it as a loss at all**

  - **Step 1**: Condition is age-related hearing loss (presbycusis).
  - **Step 2 (Naturalistic)**:
    - 2a: Recognized as a common age-related change. Is it pathological? Natural aging isn't typically considered a disease, but it can be a disorder when it impairs function. However, the mechanism is degenerative (loss of hair cells in the cochlea) and not typical in younger adults.
    - 2b: Very common in older adults (e.g., over 60% of people over 70 have some degree).
    - 2c: Biological mechanism: Age-related degeneration, which is part of normal aging. But note: aging itself isn't a disease, but specific age-related changes can become pathological if they cause harm.
    - *Conflation Check 1*: Caution: Don't confuse commonness with normality. Aging is normal, but hearing loss can be a disorder if it causes harm.
  - **Step 3 (Normativist)**:
    - 3a: Does it cause harm? The individual does not experience it as a loss. Without distress or impairment, there is no harm. However, note: hearing loss can lead to safety risks (e.g., not hearing alarms) even if not subjectively distressing. But the person reports no harm. So, for this individual, no harm.
    - 3b: If there were harm, would it be due to society? For example, if society didn't provide amplification devices. But here, no harm is claimed.
    - 3c: Interests: The individual doesn't perceive a problem. The employer might be concerned about safety, but the individual isn't seeking accommodation.
  - **Step 4 (Context)**: The person is not experiencing problems. Interventions exist (hearing aids), but if no harm, why treat?
  - **Step 5 (Integration)**:
    - Naturalistic: There is a biological change, but it's common in aging and may not be considered pathological without harm.
    - Normativist: No harm reported. 
    - Therefore, without harm, it does not meet the normativist criterion. 
  - **Verdict**: Does not qualify as a health condition for this individual at this time. The condition is age-related and not causing harm. Note: If the individual later experiences harm (e.g., safety issues), it could be reconsidered. This will annoy some because hearing loss is often seen as a disorder, but without harm, it's just a variation.

  **Case 3: Infertility in a single man who wants treatment**

  - **Step 1**: Condition is infertility (male factor).
  - **Step 2 (Naturalistic)**:
    - 2a: Infertility is recognized as a disease by WHO and medical societies. It's defined as the inability to achieve pregnancy after 12 months of unprotected sex. The pathological process may include low sperm count, motility issues, etc.
    - 2b: Affects about 7-10% of men. Not extremely rare.
    - 2c: Biological mechanism: Failure of the reproductive system to produce viable sperm for conception.
  - **Conflation Check 1**: No conflation.
  - **Step 3 (Normativist)**:
    - 3a: Does it cause harm? Infertility typically causes psychological distress and is seen as impairing a life goal (having biological children). But note: the individual is single, so he isn't currently trying to conceive with a partner. He may want to preserve fertility for the future. Is this harm? The distress comes from the fear of future inability to have children. This is harm (psychological), but it's anticipatory.
    - 3b: Is the harm due to society? Partly, because society values biological parenthood, but the inability to reproduce is intrinsically a limitation for someone who wants children.
    - 3c: Whose interests? The individual's desire to become a parent. The benefit plan may or may not cover fertility treatment for single individuals.
  - **Step 4 (Context)**: The man is not currently trying to conceive. Fertility treatment (e.g., sperm banking) is an intervention, but without a partner, the immediate reproductive goal is not present. However, preserving fertility for future use is a valid medical goal.
  - **Step 5 (Integration)**:
    - Naturalistic: Infertility is a recognized disease.
    - Normativist: It causes harm (psychological distress and impairment of a life goal). 
    - But note: the benefit plan may have specific criteria (e.g., only for couples trying to conceive). However, the condition itself is a health condition. The question of coverage for a single person might be a policy issue beyond the definition of disease.
  - **Verdict**: Qualifies as a health condition. Infertility meets both criteria. The fact that the man is single doesn't change the underlying condition. However, the benefit plan might have rules about when treatment is covered (e.g., only for active attempts to conceive). That's a separate coverage decision. For the purpose of defining it as a health condition, it qualifies.

  **Annoying Verdict**: The age-related hearing loss without harm does not qualify. This might annoy those who think that any deviation from "normal" function is a disease, regardless of harm. But our procedure requires both a biological abnormality and harm.

  **What the Procedure Can't Do and Where It Fails**:

  1. **Borderline Cases**: Conditions that are on the border between normal variation and pathology (e.g., mild cognitive impairment) will still require judgment calls.
  2. **Changing Norms**: As society changes, what is considered harmful may shift (e.g., gender dysphoria). The procedure doesn't automatically update; it relies on current norms and data.
  3. **Value Conflicts**: When there are deep disagreements about values (e.g., is infertility in a single person harmful?), the procedure forces a vote but can't resolve the underlying conflict.
  4. **Lack of Data**: If there's insufficient scientific evidence, the naturalistic assessment becomes difficult.
  5. **Resource Allocation**: The procedure doesn't address cost or resource constraints. That's a separate policy decision.
  6. **Medicalization**: It might still medicalize some conditions that are better addressed socially (e.g., some forms of distress) because it relies on current medical recognition.

  Overall, the procedure structures the discussion and forces explicit separation of facts and values, but it doesn't eliminate the need for judgment. It should make the process more efficient and less circular.
answer: |-
  Below is a decision procedure designed for your municipal review board. It's structured as a step-by-step flowchart with clear questions, specifying what counts as sufficient evidence for factual questions and where value judgments are required. The procedure includes a named step ("Conflation Check") to catch when parties are using facts to smuggle in values (or vice versa). The goal is efficiency (fits within 90 minutes), clarity, and forcing explicit separation of facts and values.

  ### Decision Procedure: "Health Condition Determination Framework"
  **Core Principle**: A condition qualifies as a "health condition" for benefits/accommodation only if it meets **both**:
  - **Naturalistic criteria** (fact-based: biological dysfunction).
  - **Normativist criteria** (value-based: significant harm to the individual).

  **Steps to Follow in Order**:
  1. **Define the Condition**  
     - *Question*: What specific physiological, cognitive, or functional state is being contested?  
     - *Sufficient answer*: Clear description from medical records or claimant (e.g., "age-related hearing loss at 70 dB threshold").  
     - *Time*: 5 minutes. No debate—just clarify the case facts. If unclear, table the case for missing data.

  2. **Assess Biological Dysfunction (Naturalistic)**  
     - *Question 2a*: Is there evidence of a deviation from species-typical functional design?  
       - *Data required*: Peer-reviewed studies on human biology (e.g., typical organ function, population norms).  
       - *Sufficient answer*:  
         - **Yes**: If a mechanism (e.g., an organ, gene, or system) is malfunctioning relative to its evolutionary purpose (e.g., dopamine dysregulation in ADHD, cochlear degeneration).  
         - **No**: If the condition aligns with normal variation (e.g., short stature within 2 SDs of mean height) or predictable life stages (e.g., aging).  
         - **Uncertain**: If evidence is conflicting (e.g., some genetic variants). Vote with majority.  
     - *Question 2b*: Is this deviation statistically atypical?  
       - *Data required*: Epidemiological data (e.g., prevalence rates).  
       - *Sufficient answer*:  
         - **Yes**: If prevalence <5% in the relevant age/gender group (e.g., adult ADHD in non-elderly adults).  
         - **No**: If common (>20%) and not linked to pathology (e.g., age-related hearing loss over age 65).  
         - *Note*: Rarity alone isn't decisive—it must pair with 2a.  
     - *Time*: 20 minutes. Use pre-vetted data (e.g., WHO reports, CDC stats). Clinicians lead.  
     - *Outcome*: If both 2a and 2b are "no," stop—**condition does not qualify**. Else, proceed.

  3. **Conflation Check**  
     - *Named Step*: Explicitly scan for two errors:  
       - **Error 1**: Using a fact (e.g., "ADHD brain differences exist") to imply a value (e.g., "therefore it must be harmful").  
       - **Error 2**: Using a value (e.g., "infertility is tragic") to imply a fact (e.g., "therefore it's a biological flaw").  
     - *Process*: After Step 2, each member states: "The fact we have is [X]. The value judgment we might infer is [Y]. We will not connect them until Step 4."  
     - *Sufficient resolution*: Group agrees to quarantine facts from values. If disagreement, vote to flag the conflation and move on.  
     - *Time*: 10 minutes. Lawyer moderates.

  4. **Assess Harm (Normativist)**  
     - *Question 4a*: Does the condition cause significant harm to the individual’s well-being?  
       - *Harm types*: Physical pain, psychological distress, impaired daily function (not work-specific), or reduced lifespan.  
       - *Value judgment*: Board votes on "significant harm" based on claimant's experience (not societal norms).  
       - *Sufficient answer*:  
         - **Yes**: If harm is self-reported or clinically documented (e.g., distress from infertility).  
         - **No**: If no subjective harm exists (e.g., person feels fine).  
         - *Note*: Harm must be intrinsic (e.g., pain from disease) not extrinsic (e.g., discrimination).  
     - *Question 4b*: Whose interests are prioritized?  
       - *Value judgment*: Board votes on whether the benefit plan prioritizes individual well-being, workplace functionality, or public cost. Default: individual well-being.  
     - *Time*: 25 minutes. Patient reps lead. Document value votes.

  5. **Integrate and Decide**  
     - *Question*: Does the condition meet both Step 2 (biological dysfunction) and Step 4 (significant harm)?  
       - **Yes** → Qualifies as health condition.  
       - **No** → Does not qualify.  
       - **Tie** → Revote with 60-second statements. If still tied, default to "no."  
     - *Time*: 15 minutes. All vote.  
     - *Output*: Verdict with bullet-point reasons citing Steps 2 and 4.

  6. **Document and Handle Appeals**  
     - *Process*: Record which steps were factual (data cited) vs. value-based (votes). Explain verdict in plain language for appeals.  
     - *Time*: 15 minutes.

  **Why this works**:  
  - **Naturalism** is confined to Step 2 (biology/facts).  
  - **Normativism** is confined to Step 4 (harm/values).  
  - **Conflation Check** forces transparency.  
  - **Efficiency**: Steps are sequential, with clear off-ramps (e.g., Step 2 "no" ends the case).  
  - **No philosophy required**: Uses common terms like "malfunction" and "harm."

  ---

  ### Application to Three Cases
  **Verdicts assume the board follows the procedure strictly. I commit to clear outcomes, including one "annoying" verdict.**

  #### Case 1: Adult ADHD in someone who manages fine at work but not elsewhere  
  - **Step 1**: Condition defined as adult ADHD with symptoms impairing non-work life (e.g., household tasks, relationships).  
  - **Step 2 (Naturalistic)**:  
    - 2a: **Yes**—ADHD involves dopamine dysregulation (species-atypical function).  
    - 2b: **Yes**—Prevalence ~4% in adults (statistically atypical).  
  - **Conflation Check**: Ensure no one claims "brain differences = automatic harm."  
  - **Step 4 (Normativist)**:  
    - 4a: **Yes**—Harm exists (self-reported distress in non-work settings). Harm is intrinsic (e.g., impulsivity causing relationship strain).  
    - 4b: Individual well-being prioritized (benefit plan covers overall health, not just work).  
  - **Verdict**: **Qualifies**. Meets both criteria: biological dysfunction and significant harm.  
  - **Why it might annoy**: Half the table (naturalists) might argue "if work isn't impaired, it's not a real problem," but the procedure prioritizes overall individual harm.

  #### Case 2: Age-related hearing loss in a person who doesn't experience it as a loss  
  - **Step 1**: Condition defined as age-related sensorineural hearing loss (e.g., 40 dB threshold in a 70-year-old).  
  - **Step 2 (Naturalistic)**:  
    - 2a: **No**—Cochlear degeneration is part of species-typical aging (not a "malfunction" like a disease).  
    - 2b: **No**—Prevalence >60% in over-70s (statistically typical).  
  - **Outcome**: Stop here. **Does not qualify**—fails naturalistic criteria.  
  - **Conflation Check Skipped** (Step 2 failed).  
  - **Verdict**: **Does not qualify**. No biological dysfunction established.  
  - **Why it might annoy**: Half the table (normativists) might argue "hearing loss is always a disability," but the procedure treats aging as typical, not pathological. Harm is irrelevant if Step 2 fails.

  #### Case 3: Infertility in a single man who wants treatment  
  - **Step 1**: Condition defined as male infertility (e.g., low sperm count).  
  - **Step 2 (Naturalistic)**:  
    - 2a: **Yes**—Reproductive system malfunction (inability to produce viable sperm).  
    - 2b: **Yes**—Prevalence ~7% in men (atypical).  
  - **Conflation Check**: Ensure no one claims "infertility is unnatural, so it must be covered" (smuggling values into facts).  
  - **Step 4 (Normativist)**:  
    - 4a: **Yes**—Harm exists (psychological distress from inability to conceive, even if single; self-reported desire for future parenthood counts).  
    - 4b: Individual well-being prioritized (benefit plan covers reproductive health).  
  - **Verdict**: **Qualifies**. Meets both criteria: biological dysfunction and harm.  
  - **Why it might annoy**: Naturalists might argue "infertility isn't harmful if you're not trying to conceive," but harm is subjective and documented.

  ---

  ### Limitations of the Procedure
  **Where it works**:  
  - Clear-cut cases with robust data (e.g., diabetes, severe injuries).  
  - Forces value debates into the open (e.g., "Whose interests matter?").  
  - Catches conflations (e.g., "Obesity is common, so it can't be a disease"—Error 1).

  **Where it fails or can't help**:  
  1. **Borderline biology**: Conditions with weak/no data on "species-typical function" (e.g., chronic fatigue syndrome). Step 2 may default to voting, risking arbitrariness.  
  2. **Subjective harm**: Conditions where harm is contested (e.g., gender dysphoria in unsupportive societies). Step 4a votes may reflect board biases.  
  3. **Evolving conditions**: Newly recognized issues (e.g., long COVID) may lack data for Step 2, causing delays.  
  4. **Resource constraints**: Doesn't address cost or feasibility (e.g., "We can't cover all infertility treatments"). This is policy, not definition.  
  5. **Societal harm**: Conditions like obesity where harm is extrinsic (discrimination) not intrinsic (e.g., joint pain). Step 4a may exclude them.  
  6. **"False negatives" in aging**: Age-related issues (e.g., mild cognitive decline) may fail Step 2 but still cause harm. Procedure will exclude them, potentially unfairly.  

  **Reliably bad outcomes**:  
  - **Over-medicalization**: Normal life stages (e.g., menopause) may pass Step 2 if labeled "dysfunction," forcing contentious Step 4 votes.  
  - **Under-coverage**: Conditions with high stigma (e.g., opioid use disorder) may fail Step 4a if harm is downplayed.  
  - **Cultural bias**: If board members share blind spots (e.g., dismissing mental health harm), Step 4a votes may skew.  

  **Final Advice**: Use this procedure to structure debates, not eliminate them. It won't resolve all disputes but will make them faster and more transparent. For appeals, document _how_ each step was decided (e.g., "Step 2a: Yes, based on JAMA study; Step 4a: 4-3 vote for harm"). This forces accountability.
