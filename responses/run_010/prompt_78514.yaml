  ### Problem Sheet Question: Model M and Bell's Theorem

  **Question (Total: 25 marks)**  
  Consider a hidden variable model (Model M) for pairs of spin-½ particles. The hidden variable \(\lambda\) is uniformly distributed over \([0, 2\pi)\). Alice and Bob choose measurement directions \(\alpha\) and \(\beta\) (in radians) in a common plane. Outcomes are in \(\{+1, -1\}\), defined as:  
  \[
  A(\alpha, \lambda) = 
  \begin{cases} 
  +1 & \text{if } \cos(\lambda - \alpha) \geq 0, \\
  -1 & \text{otherwise};
  \end{cases}
  \quad
  B(\beta, \lambda) = 
  \begin{cases} 
  -1 & \text{if } \cos(\lambda - \beta) \geq 0, \\
  +1 & \text{otherwise}.
  \end{cases}
  \]  
  The expectation value of the product \(A \cdot B\) is denoted \(E(\alpha, \beta)\).  

  You may take the following as given:  
  - The quantum-mechanical prediction for the singlet state is \(E_{\text{QM}}(\theta) = -\cos \theta\), where \(\theta\) is the angular separation between measurement directions.  
  - For any local model (where the joint probability of outcomes given settings and \(\lambda\) factorises into independent local probabilities), the CHSH quantity \(S = |E(a,b) + E(a,b') + E(a',b) - E(a',b')|\) satisfies \(|S| \leq 2\).  
  - The quantum value of \(|S|\) at settings \(\alpha = 0\), \(\alpha' = \pi/2\), \(\beta = \pi/4\), \(\beta' = -\pi/4\) is \(2\sqrt{2}\).  

  Evaluate the following extract from a fictional student's answer. The extract contains four claims, each mixing correct and defective elements. Respond to the parts below.  

  **Part 1 (5 marks)**  
  Derive \(E(\alpha, \beta)\) for Model M as a function of the angular separation \(\theta = \min(|\alpha - \beta|, 2\pi - |\alpha - \beta|)\). Use your expression to verify the three specific cases in Claim 1:  
  *Claim 1: "Model M reproduces the quantum-mechanical predictions for the singlet state: when the two directions coincide it gives perfect anticorrelation, when they are at right angles it gives zero correlation, and when they are opposite it gives perfect correlation."*  

  **Part 2 (5 marks)**  
  Compute the CHSH quantity \(S\) for Model M at settings \(\alpha = 0\), \(\alpha' = \pi/2\), \(\beta = \pi/4\), \(\beta' = -\pi/4\). Verify the value of \(|S|\) in Claim 2:  
  *Claim 2: "I evaluated the CHSH quantity \(S\) at the usual optimal settings and obtained \(|S| = 2\), which does not exceed the Bell bound."*  

  **Part 3 (5 marks)**  
  Using your result from Part 2, explain why Model M satisfies \(|S| \leq 2\). Discuss the implications for Bell's theorem in light of Claim 2:  
  *Claim 2 (cont.): "Model M therefore respects Bell's theorem, and its existence shows that the theorem cannot after all rule out local hidden variables."*  

  **Part 4 (5 marks)**  
  Evaluate Claim 3, addressing whether no-signalling implies locality and what Bell's theorem establishes:  
  *Claim 3: "Model M cannot be used to signal: each side sees \(+1\) and \(-1\) with probability one half, whatever the other side chooses. Since locality just means the impossibility of superluminal signalling, M is local, and the impossibility of signalling is all that Bell's theorem could ever have established."*  

  **Part 5 (5 marks)**  
  Evaluate Claim 4, addressing the role of determinism in Bell's theorem and the viability of stochastic variants:  
  *Claim 4: "In any case, M is deterministic, and the derivation of the Bell inequalities presupposes determinism. A stochastic variant of M, in which \(\lambda\) fixes only the probabilities of the two outcomes, would evade the theorem entirely, because the inequalities constrain deterministic models."*  

