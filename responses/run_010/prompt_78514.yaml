  Question X (25 marks total)

  Consider a hidden variable model, Model M, for a pair of spin-½ particles. The hidden variable λ is uniformly distributed over [0, 2π). Alice chooses a measurement direction α and Bob chooses β, both in [0, 2π). The outcomes are given by:

  A(α, λ) = +1 if cos(λ - α) ≥ 0, and −1 otherwise;
  B(β, λ) = −1 if cos(λ - β) ≥ 0, and +1 otherwise.

  The expectation value of the product of outcomes A·B is denoted E(α, β).

  You may take the following as given:
  - The quantum-mechanical prediction for the singlet state is E_QM(θ) = -cos(θ), where θ is the angular separation between the measurement directions.
  - For any local model (defined by the factorisation condition that the joint probability of outcomes given settings and λ factorises into a product of probabilities for each side), the CHSH quantity S = |E(a,b) + E(a,b') + E(a',b) - E(a',b')| satisfies |S| ≤ 2.
  - The quantum value of |S| at the settings α=0, α'=π/2, β=π/4, β'=-π/4 is 2√2.

