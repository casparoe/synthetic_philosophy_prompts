  **Model Answer**

  **Part 1**
  The correlation function \( E(\alpha, \beta) \) is the expectation of \( A \cdot B \) over \( \lambda \). The angular separation between \( \alpha \) and \( \beta \) is defined as \( \delta = \min(|\alpha - \beta|, 2\pi - |\alpha - \beta|) \), which lies in \([0, \pi]\). We derive \( E \) as a function of \( \delta \).

  The outcome \( A(\alpha, \lambda) \) is \(+1\) when \( \lambda \in [\alpha - \pi/2, \alpha + \pi/2] \mod 2\pi \) (an interval of length \( \pi \)), and \(-1\) otherwise. Similarly, \( B(\beta, \lambda) \) is \(-1\) when \( \lambda \in [\beta - \pi/2, \beta + \pi/2] \mod 2\pi \) (length \( \pi \)), and \(+1\) otherwise. The product \( A \cdot B \) is \(+1\) when \( A \) and \( B \) are equal and \(-1\) when they differ. The probability \( P(A=B) \) is the measure of \( \lambda \) for which \( A \) and \( B \) are equal, divided by \( 2\pi \).

  The set where \( A=B \) consists of two parts: (1) \( A=1 \) and \( B=1 \), which occurs when \( \lambda \) is in \( A \)'s \(+1\) interval but not in \( B \)'s \(-1\) interval; (2) \( A=-1 \) and \( B=-1 \), which occurs when \( \lambda \) is not in \( A \)'s \(+1\) interval but in \( B \)'s \(-1\) interval. The measure of each part is \( \pi - L \), where \( L \) is the measure of the intersection of the two intervals of length \( \pi \). The intersection has measure \( L = \pi - \delta \), so the total measure for \( A=B \) is \( 2(\pi - (\pi - \delta)) = 2\delta \). Hence, \( P(A=B) = \delta / \pi \), and \( P(A \neq B) = 1 - \delta / \pi \). Therefore,
  \[
  E(\alpha, \beta) = P(\text{same}) - P(\text{different}) = \frac{\delta}{\pi} - \left(1 - \frac{\delta}{\pi}\right) = \frac{2\delta}{\pi} - 1.
  \]

  Now verify the cases:
  - Coinciding directions (\( \delta = 0 \)): \( E = 0 - 1 = -1 \), perfect anticorrelation.
  - Right angles (\( \delta = \pi/2 \)): \( E = (2 \cdot \pi/2)/\pi - 1 = 1 - 1 = 0 \), zero correlation.
  - Opposite directions (\( \delta = \pi \)): \( E = (2 \cdot \pi)/\pi - 1 = 2 - 1 = 1 \), perfect correlation.

  These match the quantum predictions at these points, so the student's claim is correct for these cases. However, Model M does not reproduce quantum mechanics generally.

  **Part 2**
  Using the expression \( E(\alpha, \beta) = (2\delta/\pi) - 1 \), compute at the given settings:
  - \( \alpha=0, \beta=\pi/4 \): \( \delta = \pi/4 \), \( E = (2 \cdot \pi/4)/\pi - 1 = 1/2 - 1 = -0.5 \).
  - \( \alpha=0, \beta'=-\pi/4 \): The angular separation is \( \min(|0 - (-\pi/4)|, 2\pi - \pi/4) = \min(\pi/4, 7\pi/4) = \pi/4 \), so \( E = -0.5 \).
  - \( \alpha'=\pi/2, \beta=\pi/4 \): \( \delta = |\pi/2 - \pi/4| = \pi/4 \), \( E = -0.5 \).
  - \( \alpha'=\pi/2, \beta'=-\pi/4 \): \( \delta = |\pi/2 - (-\pi/4)| = 3\pi/4 \), \( E = (2 \cdot 3\pi/4)/\pi - 1 = 3/2 - 1 = 0.5 \).

  The CHSH quantity is
  \[
  S = |E(0,\pi/4) + E(0,-\pi/4) + E(\pi/2,\pi/4) - E(\pi/2,-\pi/4)| = |-0.5 -0.5 -0.5 - 0.5| = |-2| = 2.
  \]
  So \( |S| = 2 \), matching the student's calculation.

  **Part 3**
  Model M satisfies \( |S| = 2 \), which is the maximum allowed by the Bell inequality for local models. The Bell inequality holds for models that are local in the sense of factorisability: the joint outcome probability given settings and \( \lambda \) factorises. Model M is deterministic and the outcomes are functions of \( \lambda \) and the local setting, so it is factorisable: \( P(A,B|\alpha,\beta,\lambda) = \delta_{A, A(\alpha,\lambda)} \delta_{B, B(\beta,\lambda)} \), which trivially factorises. Thus, it respects the Bell bound.

  However, the student claims that Model M shows that Bell's theorem cannot rule out local hidden variables. This is incorrect. Bell's theorem shows that no local hidden variable model can reproduce all quantum predictions. Model M does not reproduce the quantum predictions: for example, at \( \delta = \pi/4 \), quantum predicts \( E_{QM} = -\cos(\pi/4) = -\sqrt{2}/2 \approx -0.707 \), while Model M gives \( -0.5 \). Moreover, quantum violates the Bell inequality with \( |S| = 2\sqrt{2} > 2 \), but Model M does not violate it. Therefore, Model M respects the Bell inequality precisely because it is local, but it does not reproduce quantum mechanics. Bell's theorem remains valid: no local model can achieve the quantum violation.

  **Part 4**
  The student claims that Model M is local because it cannot be used for signalling, and that locality is equivalent to no-signalling. It is true that Model M does not allow signalling: Alice's marginal probability of \( +1 \) is always \( \frac{1}{2} \) (since her interval has length \( \pi \), half the circle), regardless of Bob's setting, and similarly for Bob. Hence, no superluminal signalling is possible.

  However, Bell's theorem requires a stronger condition than no-signalling: it requires factorisability (or equivalently, Bell locality: the outcome on one side is independent of the other side's setting given \( \lambda \)). Model M satisfies factorisability because the outcomes are functions of \( \lambda \) and the local setting only. But not all no-signalling models are factorisable: for example, quantum mechanics itself is no-signalling but violates the Bell inequality, hence is not factorisable. Therefore, the student is wrong to equate locality with no-signalling. Bell's theorem establishes that factorisable models cannot violate the Bell inequality, but no-signalling models can. Thus, the theorem does more than rule out signalling models: it rules out factorisable models even if they are non-signalling.

  **Part 5**
  The student claims that Bell's theorem presupposes determinism and that a stochastic model would evade the theorem. This is incorrect. Bell's theorem does not assume determinism. The derivation of the Bell inequality requires factorisability and the independence of \( \lambda \) from the settings, but it allows for stochastic models: the response functions can be probabilistic. The general factorisability condition is \( P(A,B|\alpha,\beta,\lambda) = P(A|\alpha,\lambda) P(B|\beta,\lambda) \). In a stochastic variant of Model M, we might replace the deterministic responses with probabilities depending on \( \lambda \). However, the Bell inequality still applies to any such model that satisfies factorisability. Therefore, a stochastic model that is factorisable would still be constrained by the Bell inequality and could not reproduce the quantum predictions. Determinism is not a separate assumption; it is a special case of the factorisability condition.

