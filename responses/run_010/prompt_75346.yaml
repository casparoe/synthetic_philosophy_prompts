  Gödel's unpublished status: the essay implies he withheld the proof due to others' potential discomfort, but his actual reasons were likely more nuanced - perhaps ongoing refinement or his own reservations about the axioms. This historical point matters because the flatmate uses it to suggest the proof is unassailable.

