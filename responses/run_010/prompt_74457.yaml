prompt: |-
  So, I run the volunteer mod team for a VR hangout world — about 600 regulars, some of whom are basically in there every night, and last month we banned a guy who then wrote a genuinely good appeal about consistency, and I couldn't answer him. That's when I realized our rulings are all vibes. We've started a shared doc trying to write down actual reasons, and it's turned into a mess, partly because when I list out my own verdicts case by case they don't hang together, and partly because my sister keeps saying I'm drafting a legal code for pixels. Here's where I actually land: A player got into someone else's account and vaporized a crafted jacket that took her two years to make — I'd call that real harm and real wrongdoing, and I'd say "theft" without scare quotes. That same jacket won fair and square by a stranger under the game's own duel-and-loot rules — no wrong, nothing to appeal, even though the original owner felt at least as bad about it, maybe worse since she was there watching it happen. Our devs pushed a balance patch deleting the entire jacket class and compensated everyone in currency at roughly market value — annoying, but not a wrong, which is strange because in total the playerbase lost more stuff than in the first case. Somebody's 400-hour build in our sandbox corner: a real artifact and a real achievement, worth protecting. But when the studio rebuilt the engine and the identical build got regenerated from the save file, I felt nothing had been lost at all, so it can't be about the particular bits. A guy verbally went after a regular in a voice room using the exact same words he'd used in a text forum a week earlier where I did nothing — in the room it felt like assault, in the forum it was rude, and I think the difference is presence and the fact you can't look away. A player in single-player content killing NPCs who beg for mercy, nobody else involved, nothing persistent — strictly speaking nobody was harmed and nothing wrong happened, and yet I'd want to know about someone who does that a lot. Compare: a player built a photorealistic avatar of a real streamer who'd banned him from her chat and used it to enact humiliating things in a private instance; she never found out, zero effect on her; my verdict is that this was wrong. Those last two fight each other and I can't explain why. Also, if someone asks me whether there's an oak tree in the plaza I say obviously yes, there's a virtual tree, but if an engineer asks how many trees are in that biome I just read off whatever the spawner reports and think of them as rows of data — both feel natural and I can't tell you which one I mean when I say the tree exists. Real money spent on a virtual lamp that the studio later removes feels like a taking; 5,000 in-game coins for a virtual coffee feels like no transfer of value at all. And a regular who talked every night for a year to an AI-driven companion NPC we eventually deprecated: I think her grief was appropriate and not a mistake, but I don't think the NPC lost anything or was harmed.

  Is there a principle — or a small set of rival candidates — that actually generates these verdicts? I want it precise enough that I could hand it to another mod and get the same ruling twice, so please state each clause and tell me which of my cases motivated it. Then run it on the two I keep flip-flopping on: a player running an in-game casino that's quietly rigged, takes only in-game currency, discloses nothing, and has cleaned out three teenagers' worth of a year of grinding — under my own "coins aren't value" verdict nothing was taken, but it feels like fraud; and a player who recorded a private conversation in our world and posted it to an outside forum, where I think the wrong happened outside the game but the material was made of nothing but game. And give me a verdict on something I haven't thought of that would discriminate between the candidates. If the only way to save everything is a baroque multi-clause monster, say so, and instead tell me which one of my verdicts to give up and why — I'd rather have a clean rule plus one admitted mistake than a rule nobody can apply. And if your honest answer is that all of this just tracks local social convention inside our community, fine, say that, but then I want to know what makes it more than etiquette, because the appeal letter is still sitting in my inbox. No bibliography needed, I'm not writing a paper, I just need something to put in the doc.
reasoning: |-
  Okay, the user runs a volunteer mod team for a VR hangout world with about 600 regulars. They banned someone who wrote a good appeal pointing out inconsistencies in their rulings. Now they're trying to create clear rules but it's messy. Their sister says they're making a legal code for pixels. They need a principle or set of principles that can consistently generate their verdicts across various cases.

  Looking at the cases they provided:  
  - Account hacking leading to item deletion: real harm, theft.  
  - Losing an item via game rules: no wrongdoing.  
  - Devs deleting an item class: annoying but not wrong.  
  - 400-hour build: worth protecting.  
  - Rebuilding the same structure: nothing lost.  
  - Voice harassment vs. text harassment: voice feels like assault.  
  - Killing NPCs: no harm but concerning.  
  - Creating a humiliating avatar: wrong even if no one knew.  
  - Virtual objects existing: depends on context.  
  - Spending real money vs. in-game currency.  
  - Grieving an AI companion: appropriate grief but no harm to NPC.  

  The key challenges are:  
  1. Why is hacking theft but losing via game rules not?  
  2. Why is voice harassment worse than text?  
  3. Why is the NPC killing concerning but the avatar creation wrong?  
  4. The casino scam and recording private conversation cases where they're conflicted.  

  The underlying themes seem to be:  
  - **Harm to real persons**: Emotional distress, time investment, social trust.  
  - **Violation of consent**: Like hacking, harassment, non-consensual recording.  
  - **Context matters**: Presence in voice chat, real-money investment, community norms.  
  - **Intent and deception**: Rigged casino involves fraud.  

  Possible principles:  
  1. **Harm Principle**: Focus on real-world emotional/social harm to players.  
  2. **Consent Principle**: Actions violating consent are wrong.  
  3. **Systems Integrity**: Actions that undermine game systems or community trust are prohibited.  

  For the casino scam: Even though coins aren't real value, the deception and exploitation of effort (grinding) cause real frustration and harm. So it's fraud.  

  For the recording: Violates consent and privacy, even if the content is virtual. The harm is real when shared externally.  

  A new case to test: If a player uses in-game mechanics to block someone's access repeatedly, it might be griefing under the Harm Principle because it causes frustration, whereas if done rarely, it might be acceptable gameplay.  

  If they need a clean rule, the Harm Principle is strongest. They might need to accept that the NPC killing case is more about player character concern than wrongdoing.  

  Ultimately, the principles should be:  
  - **Harm to Players**  
  - **Violation of Consent**  
  - **Deception**  
  - **Systems Integrity**  

  This covers most cases without being too baroque. For the appeal letter, explain that moderation focuses on preventing real harm and maintaining trust, using these principles as guidelines.
answer: |-
  Here's a distilled set of principles that generate your verdicts, based on a consistent core idea: **Harm to Persons** (HTP). This isn't about pixels or data—it's about protecting *real people* from tangible harm in a social environment. The virtual context matters only as the *medium* through which harm occurs. I'll state the principles clearly, map them to your cases, resolve your conflicts, and apply them to new scenarios. The system has three clauses, motivated by your own judgments:

  ### The Principles (HTP Framework)
  1. **Harm to Real Persons (Clause 1):**  
     *An action is wrong if it causes* **reasonably foreseeable emotional, social, or financial harm** *to an identifiable real person, beyond what the game's intended systems inherently risk. Harm includes distress, exploitation, or erosion of trust.*  
     - **Motivated by:** The hacked jacket (emotional/financial harm to creator), the voice-room assault (emotional harm via presence), the rigged casino (exploitation of grinding effort), and the streamer avatar (intended humiliation, even if undiscovered).  
     - *Why it works:* This centers harm to *people*, not objects. It explains why losing a jacket in a fair duel isn't wrong (intended game risk), while hacking is (non-consensual harm).  

  2. **Violation of Consent or Agency (Clause 2):**  
     *An action is wrong if it* **circumvents consent or undermines player agency** *in a way that feels intrusive, deceptive, or non-consensual to a reasonable participant.*  
     - **Motivated by:** The voice assault vs. text forum (voice feels violating due to real-time presence and inability to disengage), the account hacking (non-consensual access), the private conversation recording (violation of expected privacy), and the rigged casino (deception).  
     - *Why it works:* It captures why presence matters (consent to context) and why deception is harmful even with "valueless" currency.  

  3. **Systems Integrity Exception (Clause 3):**  
     *Actions solely within the game's intended systems (e.g., patches, rules-based deletions, NPC interactions) are not wrong, even if they cause frustration, unless they violate Clause 1 or 2.*  
     - **Motivated by:** The devs' jacket deletion (intended system, compensated), losing the jacket in a duel (rules-based), rebuilding the sandbox build (system regeneration), and NPC killing (no *person* harmed).  
     - *Why it works:* It separates design choices from player misconduct. The 400-hour build is protected under Clause 1 (harm to creator's effort/identity), but its identical copy isn't "lost" because no *person* is harmed by regeneration—only the original creation event mattered.

  ### Why This Isn't Just "Vibes" or Etiquette
  - **It’s anchored in real-world harm prevention.** Etiquette is about manners; this is about preventing distress, exploitation, and violations of trust in a shared social space. The appeal letter likely resonated because it exposed inconsistency in protecting *people*, not objects.  
  - **It’s universalizable.** You could hand this to another mod: "Was real harm reasonably foreseeable? Was consent violated? Was it outside intended systems?"  
  - **It accepts virtuality.** The oak tree "exists" socially (Clause 1: players experience it) but is data when engineered (Clause 3: systems context). Real money purchases feel like takings (Clause 1: financial harm), but in-game coins don’t (Clause 3: intended currency system). Grief for an AI companion is valid (Clause 1: emotional harm to player) but no harm to NPC (no person).

  ### Resolving Your Flip-Flop Cases
  - **The rigged casino (in-game currency only):**  
    - **Verdict:** **Wrong.**  
    - **Why:** Clause 1 (harm) + Clause 2 (deception). Even if coins aren't "value," grinding represents real time/effort. Exploiting this causes foreseeable emotional harm (frustration, betrayal). It’s fraud because it deceives players about risk, violating consent.  
    - *Not Clause 3:* Rigging isn’t an intended system; it’s a deceptive subversion.  

  - **Recording a private conversation and posting externally:**  
    - **Verdict:** **Wrong.**  
    - **Why:** Clause 1 (harm) + Clause 2 (consent). Players reasonably expect privacy in private instances. Posting it externally causes social/emotional harm (embarrassment, trust erosion). The "material being game bits" is irrelevant—the harm is real.  
    - *Note:* If it were a public space with clear TOS allowing recording, it might be Clause 3 (intended system), but you describe it as "private."

  ### Testing the Framework: A New Discriminating Case
  **Scenario:** *A player uses an exploit to repeatedly "trap" another player in a non-lethal but inescapable void for hours, knowing it causes them severe frustration. No items lost, no verbal abuse.*  
  - **Under HTP:** **Wrong.** Clause 1 (foreseeable emotional harm via distress/isolation) + Clause 2 (non-consensual, as trapping isn’t an intended system interaction).  
  - **If it were a designed game mechanic (e.g., a "jail" feature):** Not wrong (Clause 3), though you might still compensate the player if it feels excessive.  

  ### Is This Baroque? Nope—But You Might Need to Surrender One Verdict
  The HTP framework is **three clear clauses** that cover all your cases *except one*:  
  - **The NPC-killing case** ("I'd want to know about someone who does that a lot") conflicts slightly. Under HTP, it’s **not wrong** (Clause 3: intended system, no person harmed). But your intuition flags it as concerning.  
  - **Solution:** Surrender the verdict that it’s "wrong." Instead, treat it as a **player-safety insight** (e.g., "This suggests potential antisocial behavior, but we only act if it escalates to Clause 1/2 harm"). This maintains consistency—mods aren’t thought police.  

  ### Why This Works for Your Doc
  - **It’s actionable:** Mods can ask: "Did this hurt a real person in a way they couldn’t reasonably expect? Was consent broken? Was it cheating the system?"  
  - **It answers the appeal:** "Our rulings prioritize preventing harm to real people and upholding consent in social spaces. While outcomes may feel inconsistent when focusing on virtual objects, we act when your actions cause foreseeable distress, exploitation, or violations beyond the game’s designed risks."  
  - **It’s not a legal code:** It’s a social contract framework. Your sister’s "pixels" jab misses that VR hangouts are *human spaces* where harm is real.  

  **Final verdicts for your unresolved cases:**  
  - Casino: **Ban** (fraudulent harm).  
  - Recording: **Ban** (consent violation + external harm).  

  This gives you consistency without monstrosity. If you enforce this, document it in your shared doc with examples—and reply to that appeal.
