answer: |-
  ### Activity Design: "Genetic Potential Championship"

  **Goal:** Parents experience 4 key insights about heritability through gameplay, without statistical jargon. The payoff is optimizing their "athlete's" performance for a mock championship.

  **Materials:**
  - 2 decks of index cards (pre-prepared)
  - Whiteboard
  - Pens/paper
  - Timer

  **Setup:**
  - Each parent gets an **athlete card** with hidden genetic scores (G_sprint and G_distance, integers 1-5) and a unique ID.
  - Environmental effect cards (E) are pre-drawn for each round (see below).
  - Whiteboard tracks team scores and variances.

  ---

  ### **Rounds & Card Mechanics** (Total: 60 min)
  *(Insights emerge in bold during debrief)*

  1. **Round 1: Uniform Training (Sprint Focus)**  
     - *Mechanics:* All athletes run sprint. Performance = G_sprint + E1.  
       - E1: Randomly assigned (-1, 0, +1) cards.  
     - *Scoring:* Team score = average performance.  
     - *Data Collection:* Record all performances on whiteboard.  
     - *Insight Prep:* **Heritability is a population variance ratio, not about individuals.**

  2. **Round 2: Variable Environments (Sprint Again)**  
     - *Mechanics:* All run sprint. Performance = G_sprint + E2.  
       - E2: Larger variance (-2, -1, 0, +1, +2) cards.  
     - *Scoring:* Team score = average performance.  
     - *Data Collection:* Record performances.  
     - *Insight Prep:* **Same trait (sprint) has lower heritability when environment varies more—genes unchanged.**

  3. **Round 3: Choice Based on Genetics**  
     - *Mechanics:*  
       - Reveal G_sprint and G_distance to parents.  
       - Parents choose event (sprint/distance) for their athlete.  
       - Performance = G_chosen + E3 (E3: -1, 0, +1).  
     - *Scoring:* Team score = sum of performances. Affects championship standing!  
     - *Data Collection:* Record performances and chosen events.  
     - *Insight Prep:* **Self-selection amplifies genetic variation in observed performance.**

  4. **Round 4: Group Differences**  
     - *Mechanics:*  
       - Split athletes into Group A (IDs 1-14) and Group B (IDs 15-28).  
       - All run sprint. Performance = G_sprint + E4 + Group_Bonus.  
         - Group A: +3 bonus (E4: -1, 0, +1)  
         - Group B: -3 bonus (E4: -1, 0, +1)  
     - *Scoring:* Team score = average performance.  
     - *Data Collection:* Record performances by group.  
     - *Insight Prep:* **High within-group heritability ≠ genetic explanation for between-group gaps.**

  ---

  ### **Heritability Calculation** (10 min, no squares)
  1. **Variance Simplified:**  
     - *Step 1:* Calculate mean performance (sum all scores ÷ 28).  
     - *Step 2:* Compute **Absolute Deviations (AD)**:  
       - Each parent calculates |their athlete’s performance – mean|.  
     - *Step 3:* **Variance Proxy** = Average AD × 1.25 (scaling factor for normality).  
       - *Example:* If mean = 10, and ADs sum to 56, average AD = 2. Variance proxy = 2 × 1.25 = 2.5.  

  2. **Heritability Ratio:**  
     - Genetic Variance Proxy (pre-calculated during rounds using the same method on G_scores).  
     - Heritability ≈ Genetic Variance Proxy ÷ Performance Variance Proxy.  

  ---

  ### **Payoff: Mock Championship** (5 min)  
  - Cumulative team scores from Rounds 1-4 determine "championship winner."  
  - *Why it bites:* Parents care because Round 3 choices directly impact standings. Choosing the right event (based on revealed genetics) boosts team score.  

  ---

  ### **Debrief** (15 min)  
  *(Map gameplay to insights and DNA test limitations)*

  1. **Round 1 Recap:**  
     - *"Why did performances vary?"* Genes + environment.  
     - **Insight 1:** Heritability = variance ratio for a group in a specific setting. Not a DNA test’s prediction for your child.  
     - *Test Limitation:* The test’s heritability number applies only to populations in similar environments.

  2. **Round 2 Recap:**  
     - *"Why did our team score change more wildly?"* Environment varied more.  
     - **Insight 2:** Same genes, different environment → different heritability. Genes didn’t change!  
     - *Test Limitation:* If environments vary (e.g., training, nutrition), the test’s heritability estimate is irrelevant.

  3. **Round 3 Recap:**  
     - *"Why did choices amplify differences?"* Athletes with high G_sprint chose sprint, maximizing genetics.  
     - **Insight 3:** Self-selection inflates genetic variation. DNA tests might guide choices, but they don’t "cause" success.  
     - *Test Limitation:* The test might inform choices but can’t predict outcomes (environment still matters).

  4. **Round 4 Recap:**  
     - *"Why did Group A outperform Group B?"* Environmental bonus (+3 vs. -3).  
     - *"Was within-group heritability high?"* Yes (genetic variation dominated within each group).  
     - **Insight 4:** High heritability in two groups ≠ genetics explains the gap. Our gap was 100% environmental!  
     - *Test Limitation:* The test says nothing about group differences (e.g., why one team outsprints another).

  ---

  ### **Predictable Problems & Solutions**  
  1. **Problem: Impossible Heritability (e.g., >100%)**  
     - *Cause:* Small-sample noise in variance proxies.  
     - *Turn into Lesson:* "Real studies need huge samples. A DNA test’s number for one child is like our tiny sample—unreliable."  

  2. **Problem: Parents Ignore Genetics in Round 3**  
     - *Cause:* Misunderstanding instructions.  
     - *Turn into Lesson:* "If you chose randomly, genetics didn’t guide training. The test only helps if you use it to tailor environments!"  

  3. **Problem: Group Score Confusion in Round 4**  
     - *Cause:* Bonus overwhelms genetic effects.  
     - *Turn into Lesson:* "See how environment (bonus) swamped genetics? That’s why group gaps can’t be blamed on genes."  

  ---

  ### **Honest Limitation**  
  - **What the Game Can’t Do:**  
    Real heritability estimates use complex statistics (e.g., twin studies) to *infer* genetic effects—we directly assigned "genes." You must verbally explain:  
    *"DNA tests don’t actually know your child’s genes for sprinting. They guess based on population data, and their ‘heritability’ is a rough estimate—not a destiny score."*  

  ---

  ### **Timeline**  
  - Prep: 5 min (distribute athlete cards)  
  - Round 1: 10 min  
  - Round 2: 10 min  
  - Round 3: 10 min (include genetics reveal/choice)  
  - Round 4: 10 min  
  - Championship Scoring: 5 min  
  - Heritability Calculation: 10 min (whole-group, no math fear!)  
  - Debrief: 15 min  
  - **Total: 75 min**  

  This design makes abstract concepts visceral. Parents leave wary of DNA test overreach and empowered to focus on environments that help *all* athletes thrive.
