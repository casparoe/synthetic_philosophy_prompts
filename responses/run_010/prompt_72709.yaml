answer: |-
  ### Essay Question (30 marks, 3 hours)

  **Stem:**  
  Kripke’s dogmatism paradox arises as follows: Suppose an agent, S, knows that *p* is true. S also knows that if *p* is true, then any evidence *appearing* to contradict *p* must be misleading (e.g., flawed data, biased sampling). By the closure of knowledge, S thereby knows that such contrary evidence *E* is misleading. This seems to license S in disregarding *E*—even before encountering it—since S already knows *E* is unreliable. But this implies S is dogmatic: they can *never* rationally revise their belief in *p*, as all counterevidence is preemptively dismissed.  

  **The Independence Response** (defending permissibility): It is permissible for S to disregard evidence *E* suggesting not-*p* **only if** S’s knowledge that *p* does not counterfactually depend on *E*. That is: had *E* been misleading (e.g., due to random error), S would *still* have known *p* (e.g., because S’s knowledge rests on entirely separate evidence).  

  **The Cumulative Case** (challenging the Response): Consider a research programme that knows *p* based on a large body of evidence {*E₁*, *E₂*, ..., *Eₙ*}. Each individual piece *Eₖ* is "dispensable": for any *single* anomalous result *Eₖ*, the Independence Response permits dismissing it because *had Eₖ been misleading*, the programme would still have known *p* from the remaining evidence. Yet if the programme sequentially dismisses *one hundred* such anomalies (each locally permissible), it dismantles the original body of evidence supporting *p*. The programme is left claiming to know *p* despite having discarded the evidence constituting its grounds. The Response is thus *locally sound but globally self-defeating*.  

  **Your Task:**  
  1. Does the Cumulative Case refute the Independence Response? Or does it merely show the Response needs scoping constraints (e.g., requiring independence from a *total evidence set* rather than individual pieces)?  
  2. If scoping is the solution, what new problems arise? In particular, could indexing "independence" to the total evidence regenerate the dogmatism paradox at a higher level (e.g., by allowing S who knows *p* to dismiss challenges to their *total evidence*)?  
  3. To resolve the tension, which premise must be rejected:  
     - Closure (knowledge transfers across known entailments)?  
     - The move from "knows *p*" to "may disregard contrary evidence"?  
     - The assumption that knowledge licenses a *standing policy* of dismissal (vs. a defeasible disposition)?  
  4. Explain why the epidemiologist’s case (dismissing a small, underpowered trial contradicting an established treatment) is either:  
     (i) A legitimate counterexample to the paradox (showing dismissal is sound), or  
     (ii) An instance of the paradox (showing how dogmatism masquerades as rigor).  

  Do **not** restate the paradox, catalogue standard solutions, or narrate debates. Engage the Independence Response and Cumulative Case directly.  

  ---

  ### Model Answer (Strong Student Response, ~900 words)  

  **Thesis:** The Cumulative Case refutes the Independence Response as stated, and scoping "independence" to total evidence regenerates the paradox. Only rejecting that knowledge licenses a *standing policy* of dismissal resolves the tension, preserving the epidemiologist’s case as legitimate without endorsing global dogmatism.  

  **(1) The Cumulative Case as a Refutation**  
  The Independence Response permits dismissing evidence *E* only if knowledge that *p* is counterfactually independent of *E*. The Cumulative Case exposes this condition’s insufficiency: while each dismissal of an anomalous *Eₖ* satisfies *local* independence (since *~Eₖ* would not undermine knowledge given other evidence), sequential dismissals collectively destroy the evidential body for *p*. The Response thus conflates *local dispensability* with *global justifiability*. Crucially, it cannot explain why knowledge *p* vanishes after 100 dismissals when each step was licensed. This is not merely a slippery slope (a "sorites problem") but a structural flaw: the Response ignores how locally rational acts aggregate into globally irrational states. It fails because knowledge supervenes on *actual* evidence—not hypothetical scenarios where misleading evidence is absent. Hence, the Cumulative Case refutes the Response as a *general* rule for evidence dismissal.  

  **(2) The Failure of Scoping to Total Evidence**  
  A natural fix is to require that knowledge *p* be counterfactually independent of the *total evidence set* T: had *any subset* of T been misleading, S would still know *p*. This forbids dismantling T piecemeal. But this scoping regenerates the dogmatism paradox. If S knows *p* based on T, and knows *p* entails that *any challenge to T’s support for p* is misleading (e.g., due to systematic error), closure implies S knows such challenges are unreliable. S could then preemptively dismiss *all* challenges to T—including meta-evidence suggesting T doesn’t support *p*. For example, an epidemiologist might dismiss *any* new analysis questioning her original evidence base, however rigorous, because she "knows" T supports *p*. This revives dogmatism at the second order: S can never rationally revise their assessment of their *own evidence*. The scoping fix thus collapses into the very paradox it sought to avoid.  

  **(3) Rejecting the Standing-Policy Premise**  
  The core tension arises from the premise that knowledge licenses a *standing policy* of disregarding counterevidence. Rejecting this is less costly than denying closure or the knowledge-to-permission link.  
  - **Closure denial** is ad hoc here: the entailment (*p* → *E is misleading if contrary*) is uncontroversial.  
  - **Denying the knowledge-to-permission link** undermines rational inquiry: if knowing *p* doesn’t permit discounting unreliable *E*, we could never prioritize robust evidence over noise.  
  The better move is distinguishing:  
  - A *defeasible disposition* to discount *E* that *appears* unreliable *given current evidence* (permissible),  
  - A *standing policy* to dismiss *any* future *E* solely because it contradicts *p* (dogmatic).  
  Knowledge *p* justifies the former but not the latter. The disposition is evidence-sensitive: if anomalies accumulate, S must reevaluate *p*. The policy is evidence-*immune*.  

  **(4) The Epidemiologist’s Case: Legitimate, Not Paradoxical**  
  The epidemiologist’s dismissal of a small, underpowered trial is legitimate because it satisfies the *defeasible disposition* without endorsing dogmatism. Her knowledge depends on a large, diverse evidence base *T* entirely *separate* from the anomalous trial *E*. Crucially:  
  - She dismisses *E* not *merely* because it contradicts *p*, but because *T* (including prior studies on statistical power) shows *E*’s unreliability is *probable* given its design.  
  - Were multiple robust trials to emerge, her disposition would compel reevaluation.  
  This contrasts with the Cumulative Case, where dismissals rely *only* on *p*’s presumed truth and *Eₖ*’s dispensability—not independent grounds for doubting *Eₖ*. The epidemiologist’s case is thus a counterexample to the *paradox* (which assumes knowledge *p* rests only on evidence now challenged), not an instance of it. Her independence is evidential, not just counterfactual.  

  **Conclusion:** The Cumulative Case refutes the Independence Response by revealing how local permissions induce global incoherence. Scoping independence to total evidence fails by reintroducing dogmatism at the meta-level. Only rejecting a *standing policy* of dismissal—while preserving a defeasible disposition—saves the epidemiologist’s practice without collapsing into paradox.  

  ---

  ### Marking Scheme (30 marks total)  
  **Award marks for executing these moves, NOT for mentioning topics.**  

  1. **Analyze Cumulative Case vs. Independence Response (8 marks)**  
     - *5–8*: Clearly explains why CC refutes IR (local permissions → global incoherence; ≠ sorites).  
     - *1–4*: Superficial (e.g., "CC shows IR is unreliable"); confuses CC with standard dogmatism.  
     - *Common botch (loses 4 marks)*: Calls CC a "slippery slope" without explaining structural failure.  

  2. **Evaluate Scoping Fix & Second-Order Paradox (7 marks)**  
     - *5–7*: Shows how total-evidence independence regenerates paradox (dismissing challenges to evidence base).  
     - *2–4*: Only notes "new problems arise" without specifying regeneration.  
     - *Common botch (loses 3 marks)*: Claims scoping "solves" CC without addressing meta-dogmatism.  

  3. **Critically Assess Premise Rejection (6 marks)**  
     - *5–6*: Defends rejecting *standing policy* over closure/permission link; distinguishes policy/disposition.  
     - *3–4*: Selects a premise but doesn’t compare costs.  
     - *Common botch (loses 3 marks)*: Denies closure perfunctorily.  

  4. **Resolve Epidemiologist’s Case (5 marks)**  
     - *4–5*: Distinguishes her evidentially grounded dismissal from Cumulative Case (separate evidence + defeasible disposition).  
     - *2–3*: Correctly identifies as counterexample/instance but with weak justification.  
     - *Common botch (loses 3 marks)*: Calls it "dogmatic but practical" without engaging criteria.  

  5. **Thesis & Argument Coherence (4 marks)**  
     - *4*: Clear position; steps build logically.  
     - *2–3*: Position vague or disjointed reasoning.  

  **First-Class (70+%) vs. Upper-Second (60–69%) Distinction:**  
  - **First-Class**: Explicitly identifies that scoping to total evidence *regenerates the paradox* (§2) AND integrates it into the rejection of standing policies (§3).  
  - **Upper-Second**: Correctly analyzes CC/IR and scoping problems but treats regeneration as a "new issue" rather than the *fatal flaw*, or doesn’t tie it to the policy/disposition distinction.  

  **Down-Grade Notes (Penalize 3–6 marks total if present):**  
  1. **Denies closure without argument**: Asserts closure is "false" to block the paradox but doesn’t explain why it’s unjustified *here* (-3).  
  2. **Treats paradox as "artefact of idealization"**: Claims real agents "couldn’t really know *p* absolutely" but doesn’t specify *which* idealization (e.g., infallibility? total evidence access?) causes the problem (-4).  
  3. **Rehearses standard "solutions"** (e.g., "deny knowledge of robustness," "fallibilism") without engaging CC/IR (-6: off-task).  

  ---  
  This design forces engagement with your core dispute while blocking evasion routes. The model answer defends your view but would receive full credit for a well-argued alternative (e.g., defending IR by denying that dismissal "dismantles" knowledge if evidence is probabilistic). The marking scheme rewards dialectical rigor over recitation.
