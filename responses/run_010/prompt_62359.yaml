  Commitment 6 (bounded agents) vs Commitment 2 (conditionalization). For complex evidence, conditionalization is computationally impossible. The accuracy argument assumes agents can condition on any evidence, but bounded agents can't. The user must relax the norm to approximate compliance, but that might not align with the original accuracy justification. This tension is moderate but practical.

  Commitment 8 (sensitivity to representation) vs Commitment 2 (conditionalization). Expected accuracy maximization depends on how the algebra is carved. Conditionalizing on "I learned E" vs "E" can yield different results. Accuracy monism can't adjudicate the carving since the algebra isn't scored. This points to a deeper issue in the framework. The cheapest fix is to accept a privileged carving, but that's not accuracy-based. The cost is undermining the purity of the accuracy argument.

  Apparent tensions: Commitment 3 (scoring rule choice) is flexible, so it doesn't conflict with others. Commitment 4 and 7 might seem to conflict (imprecision vs partial states), but they address different issues—imprecision for uncertainty, partiality for unconsidered propositions. They can coexist.

  Framework gaps: Commitment 6 highlights that the framework doesn't address bounded agents. Commitment 7 isn't directly handled. Commitment 8 reveals a structural issue in conditionalization arguments.

