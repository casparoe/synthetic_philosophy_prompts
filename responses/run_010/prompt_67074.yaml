  | ID  | Description                                                                         | Owner         | Due Date   |  
  |-----|-------------------------------------------------------------------------------------|---------------|------------|  
  | AI1 | Redesign demand validation: Require end-use attestation for capital goods requests  | PMO: Xu       | 2024-01-31 |  
  | AI2 | Reduce revision cycle target by 60%; decouple from quarterly planning cadence       | Eng: Perez    | 2023-12-15 |  
  | AI3 | Audit all placeholder coefficients; implement sensor-based scarcity telemetry       | DataOps: Kumar| 2024-03-30 |  
  | AI4 | Pilot "bilateral negotiation" for steel inputs (Plants #74–81) – **NOTE:** *Rejected 11/2 by CPB Governance. Reason: "Direct plant agreements violate single-price mandate."* | *N/A* | *Closed* |  
  | AI5 | Remove suppression on ALERT-774; retrain with ML-based phantom-demand detection     | Infra: Team 4 | 2023-11-30 |  
  | AI6 | Enterprise incentive redesign: Tie manager bonuses to marginal-cost compliance      | Policy: Chen  | *TBD*      |  
