prompt: |-
  Third-year welfare econ PhD student here, and our reading group keeps running into something I can't find a word for.

  Setup: a committee ranks three proposals. We elicit cardinal utilities twice — once as dollars of annual benefit, once on a 0–10 how-much-do-you-care scale. Everyone's ordinal ranking of the three is identical in both rounds, and in both rounds the winner is preferred by literally every member, so Pareto is satisfied in exactly the same way. But sum the first round's numbers and proposal A wins; sum the second round's and proposal B wins. Nothing about anybody's preferences changed — only the units we happened to ask in. Same thing if you just double one member's scale: the social ranking moves.

  The standard reply in the room is "well, utilities aren't interpersonally comparable," but that isn't quite what's biting us, because nobody there doubts comparison is possible in principle. What's biting us is that the answer tracks the questionnaire. And Harsanyi is supposed to get you summing out of Pareto plus vNM rationality, which makes it look like the units got fixed somewhere along the way; I just cant point to where. Then someone says the impartial-observer construction settles it, and the objector says fine — but then the theorem is really about the observer's own scale and the members' preferences did no work.

  So does this have a name? I want to know what the nearest established concepts are, how what I described differs from each of them — including from ordinary scale complaints about index numbers, and from Arrow-type results, which are about ordinal profiles anyway — and which one actually fits best. If nothing fits, coin me a term with a real definition and tell me where its edges are: at what point does this stop being a technical caveat about representations and start being an objection to the whole program? A bare label won't help me, I need the carving.
reasoning: |-
  Okay, the user is a third-year PhD student in welfare economics, part of a reading group that's stumbled upon a puzzling issue. They've described a scenario where a committee ranks three proposals using two different cardinal utility scales: dollars of annual benefit and a 0-10 rating scale. Despite identical ordinal rankings and Pareto efficiency in both cases, summing the utilities leads to different winners depending on the scale used. They mention that even scaling one member's utilities can change the social ranking.

  The group understands that utilities aren't interpersonally comparable, but that doesn't fully address their concern. They're bothered that the social choice depends on the arbitrary choice of questionnaire units. They reference Harsanyi's theorem, which uses Pareto plus vNM rationality to justify summing utilities, but they can't see where the units are fixed. Someone brought up the impartial observer, but the user counters that this makes the social welfare function dependent on the observer's scale rather than the members' preferences.

  The user wants to know if this problem has a name, how it relates to established concepts like index number issues or Arrow's theorem, and where exactly the problem lies. They're looking for precise conceptual carving, not just a label. They also want to know when this becomes a fundamental objection to utilitarian aggregation.

  First, I need to recall the core issue. Harsanyi's utilitarianism theorem claims that if individuals and the social planner have vNM rational preferences, and the social preference satisfies Pareto, then social welfare must be a weighted sum of individual utilities. The weights are supposed to be determined by the representation. But the problem here is that without fixing the scales, the weights are arbitrary.

  The key concept here is the non-uniqueness of vNM utility representations. Since vNM utilities are unique only up to positive affine transformations, each individual's scale can be shifted and scaled independently. Therefore, the sum \(\sum u_i\) isn't invariant to changes in scale. The user's scenario shows this: switching between dollars and a 0-10 scale effectively applies different affine transformations, altering the social ranking.

  This ties into the problem of interpersonal comparability. While the group believes comparison is possible in principle, the aggregation method (summing) requires specific scales to be chosen. Harsanyi's theorem doesn't specify how to fix these scales; it assumes they're given. The impartial observer approach might introduce its own scale through the veil of ignorance, but that transfers the scaling decision to the observer.

  The established term for this is the "interpersonal comparability problem" or more specifically, the "cardinal measurability with unit comparability" requirement for utilitarianism. However, the user wants to distinguish this from other concepts. Unlike Arrow's theorem, which is ordinal and non-comparable, here cardinal information is available but still insufficient without fixed scales.

  The user might be conflating two issues: the arbitrariness in choosing utility representations and the ethical implications of choosing scales. The deeper objection is that without a principled way to set the scales, utilitarianism relies on arbitrary choices, undermining its normative claims. This is where the move to the impartial observer helps, as it provides a method to calibrate scales through risk attitudes behind a veil of ignorance.

  So the best-fitting term is "interpersonal comparability of utility units" or "the affine scaling problem in Harsanyi aggregation." The edges of this problem: if scales are fixed (e.g., everyone uses the same numeraire), the issue disappears. But without such fixing, the social ordering isn't well-defined. This becomes a fundamental objection if one denies that meaningful interpersonal comparisons are possible or that a veil of ignorance can objectively set scales.
answer: |-
  Your reading group has hit upon a fundamental and named problem in welfare economics and social choice theory. The core issue is the **Affine Scaling Problem in Utilitarian Aggregation under vNM Preferences**, but it's deeply intertwined with the **Interpersonal Comparability Problem** and the **Limits of Harsanyi's Utilitarianism Theorem**. Below is a precise conceptual carving, starting with the most fitting label and its relationship to adjacent concepts.

  ---

  ### **1. The Core Concept: Affine Scaling Dependence (or Unit Calibration Problem)**
  - **Definition**: The dependence of utilitarian social ordering on the arbitrary choice of *affine scales* (units and origins) for individual vNM utility functions, despite identical underlying preferences, ordinal rankings, and Pareto efficiency.
  - **Why it fits your scenario**:
    - vNM utilities are unique only up to positive affine transformations: \( u_i \mapsto \alpha_i u_i + \beta_i \) (\(\alpha_i > 0\)).
    - Summing utilities \(\sum u_i\) is not invariant to these transformations. Changing units (e.g., dollars vs. 0–10 scales) or origins rescales/recenters utilities, altering the aggregate ranking.
    - Harsanyi’s theorem *assumes fixed scales* but does not provide a mechanism to select them. Your questionnaires represent different affine calibrations, hence different social outcomes.

  ---

  ### **2. Relationship to Established Concepts**
  #### **a) Interpersonal Comparability (IPC)**
  - **Standard View**: IPC requires specifying *which transformations* are permissible:
    - **Ordinal Non-Comparability (Arrow)**: Only individual monotonic transformations allowed → Arrow’s impossibility.
    - **Cardinal Unit Comparability**: All individuals’ utilities can be scaled by a *common multiplier* (\(\alpha_i = \alpha_j\)) → utilitarianism is invariant.
    - **Cardinal Full Comparability**: Common multiplier *and* common origin (\(\alpha_i = \alpha_j, \beta_i = \beta_j\)) → utilitarianism + egalitarianism.
  - **Your Issue**: You have **Cardinal Non-Comparability** (\(\alpha_i, \beta_i\) chosen arbitrarily per individual). Harsanyi’s theorem *implies* that unit comparability is necessary for utilitarianism, but does not *establish* it. The "observer’s scale" in impartial spectator constructions (e.g., Harsanyi or Rawls) is an *ethical choice* to impose unit comparability, not a logical consequence of individual preferences.

  #### **b) Harsanyi’s Utilitarianism Theorem**
  - **What it claims**: If individuals and society have vNM-rational preferences over lotteries, and social preferences satisfy Pareto indifference and strict Pareto, then social welfare is a *weighted sum* of individual utilities: \( W = \sum a_i u_i \).
  - **The Gap**: The weights \(a_i\) depend on the *arbitrary scaling* of \(u_i\). The theorem does not fix \(a_i = 1\) unless units are assumed comparable. Your thought experiment exposes this:  
    - Different questionnaires = different scalings → different implicit weights → different winners.  
    - Pareto efficiency alone cannot pin down the weights; it only requires that if all prefer A > B, society ranks A > B.

  #### **c) Arrow’s Impossibility vs. Your Problem**
  - **Arrow**: Ordinal, non-comparable preferences → No SWF satisfies all axioms (e.g., IIA, Pareto, non-dictatorship).
  - **Your Case**: Cardinal, vNM utilities → A SWF *exists* (e.g., utilitarianism), but its *output is arbitrary* without additional IPC structure. Arrow’s theorem is sidestepped by cardinality, but the "price" is sensitivity to affine scaling.

  #### **d) Index Number Problems**
  - **Analogy**: Like comparing GDP using nominal vs. PPP-adjusted dollars: the ranking of economies changes with the unit.  
  - **Difference**: Index numbers deal with *aggregating goods*, not welfare. Your problem is about *aggregating preferences* without a natural numeraire. Both share "scale dependence," but welfare aggregation lacks a market to reveal exchange rates (units).

  ---

  ### **3. When Does This Become an Objection to the Program?**
  - **Technical Caveat**: If units can be *objectively fixed* (e.g., everyone’s utility is measured in "utils per marginal dollar of consumption"), the problem dissolves. Harsanyi’s theorem then works.  
  - **Fundamental Objection**: If no objective calibration exists—e.g., because:
    1. Utilities are introspective and scales are arbitrary (e.g., 0–10 vs. dollars).  
    2. Risk attitudes (vNM) do not reveal interpersonal trade-offs.  
    3. The impartial observer’s "veil of ignorance" requires *ethical assumptions* about symmetry or risk aversion to set scales, making utilitarianism derivative of prior normative choices.  
  - **The Breaking Point**: When the social planner must *impose* units (e.g., "weight Alice’s utils 2× more than Bob’s"), the move from *individual preferences* to *social welfare* becomes a value judgment. This undermines the claim that utilitarianism is "preference-based" alone.  
    - **Harsanyi’s defense**: The impartial observer (IO) uses identical vNM rationality behind a veil of ignorance, generating comparable utils. But as you note, this makes social welfare dependent on the *IO’s psychology*, not members’ preferences. Pareto then forces agreement between IO and individuals, but the weights emerge from the IO’s scaling.

  ---

  ### **4. Established Terms & Their Edges**
  - **Best Fit**: **"The Interpersonal Comparability Problem for Cardinal Utilities"** (Sen, 1970; Weymark, 1991).  
    - **Edge**: This is the *umbrella* issue. Your case is a subproblem where vNM cardinality + Pareto + utilitarianism *still* fails without unit comparability.  
  - **Alternative**: **"The Aggregation Weights Problem in Harsanyi Utilitarianism"** (Mongin, 1994).  
    - **Edge**: Highlights that weights are indeterminate without exogenous normalization.  
  - **Avoid**: "Index number problem" (misleading; no prices) or "Arrow problem" (ordinal, not cardinal).

  ---

  ### **5. Key References for Your Group**
  1. **Harsanyi, J. (1955)**: "Cardinal Welfare, Individualistic Ethics, and Interpersonal Comparisons of Utility" – *Exposes the gap*.  
  2. **Sen, A. (1970)**: *Collective Choice and Social Welfare* – Ch. 7* on IPC and Arrow.  
  3. **Mongin, P. (1994)**: "Harsanyi’s Aggregation Theorem" – *Critique of weight indeterminacy*.  
  4. **Weymark, J. (1991)**: "A Reconsideration of the Harsanyi-Sen Debate" – *Synthesizes IPC and scaling issues*.

  ---

  ### **Summary**
  Your problem is the **Affine Scaling Dependence of Utilitarianism under vNM Preferences**, a manifestation of the **Interpersonal Comparability Problem**. It differs from Arrow by requiring cardinality, and from index numbers by lacking a market numeraire. The issue becomes fatal to "preference-only" utilitarianism if no objective unit calibration exists, forcing normative choices (e.g., via the impartial observer) that transcend individual preferences. Harsanyi’s theorem *assumes* comparability; it does not *derive* it from Pareto + vNM rationality.
