prompt: |-
  Can you build me a thought experiment about a tangled hierarchy that has no inviolate level? Constraints: a real-world sort of institution -- an accreditation body, a journal's editorial board, a constitutional court -- whose rules for deciding get decided by those same rules; the loop has to fall out of ordinary plausible rule-making rather than being stipulated by some magic self-reference; and you cant break it by fiat (no sovereign-decides move, no appeal to the people, unless you show why that appeal isn't actually outside the tangle). One paragraph for the scenario, then the checking work: name which level would have to be inviolate for the loop to break, show why that level is caught inside it anyway, and say whether the institution can still reach a determinate answer. What I'm after is a case where Escher's two hands drawing each other is institutionally the right picture but the tangle causes no paralysis -- so tell me straight whether that's a counterexample to the idea that a hierarchy always needs somewhere to stand from, or whether you've just hidden the standing somewhere I'm not looking. Also flag which parts of your analysis are settled and which are genuinely disputed among people who work on self-reference, and don't dress a contested reading of Gödel up as established fact. British English, please.
reasoning: |-
  Okay, the user wants a thought experiment about a tangled hierarchy without an inviolate level in a real-world institution. They mentioned constraints: it must be an ordinary institution like an accreditation body or court, where rules are decided by those same rules. The loop should emerge naturally from rule-making, not magic self-reference. Also, no breaking by fiat—so no sovereign or appeal to the people unless it's part of the tangle.

  First, I need to create a scenario. Accreditation bodies come to mind. Say a body that accredits ethics committees. Its rules are set by accredited committees. But the initial rules? Maybe a founding charter that allows amendments via a supermajority of accredited members. Then, the body accredits committees that eventually decide the rules. That forms a loop.

  Check the constraints: no magic self-reference. The loop happens because the founding rules allow amendments by the accredited members. As time passes, all original founders are replaced, and new members are accredited under the amended rules. So the rules they amend were created by the same process. That seems plausible, no stipulation needed.

  Now, the inviolate level. Normally, you'd think the founding charter is inviolate. But if the amendment process can change the amendment rules themselves, then the founding rules aren't inviolate. The accredited committees can change them, and those committees exist because of the rules. So the founding level is caught in the loop.

  Can the institution reach determinate answers? Yes, because at any point, there's a current set of rules. They make decisions based on those rules, even if the rules can change. It's like a legal system that can amend its constitution—each decision uses the existing rules, which are valid until changed.

  User wants to know if this challenges the idea that hierarchies need a foundation. The answer is that the foundation is dynamic. It's not that there's no foundation, but it's not fixed. The institution operates based on current rules, which are amendable, so it doesn't need a permanent inviolate level. However, at any moment, the current rules act as a temporary foundation.

  Disputed areas in self-reference: Some argue that such systems are circular and lack a true foundation, leading to regress problems. Others, like in dynamic legal systems, see it as functional. Gödel's incompleteness is often mentioned, but applying it to social systems is contested. Need to clarify that this isn't settled—some theorists accept coherentist models, while others insist on foundationalism.

  Also, the user wants British English, so ensure spelling and terms like "accreditation body" without Americanisms.
answer: |-
  Here’s a thought experiment centred on a **Professional Standards Tribunal (PST)** for legal ethics, designed to meet your constraints:

  **Scenario:**  
  The PST is established by statute to adjudicate misconduct claims against lawyers and *to set its own procedural rules* for doing so. Its initial rules are drafted by a founding committee of senior judges and legal scholars. Crucially, the statute allows these rules to be amended by a two-thirds majority vote of *currently sitting PST members*. Members are appointed for fixed terms by an independent judicial council, but eligibility requires prior accreditation by the PST itself (e.g., through a rigorous ethics exam process). Over time, all original founders cycle off the tribunal. New members, accredited under rules amended by earlier PST cohorts, now vote to further amend the rules—including the amendment procedure itself—using the very authority granted by the rules they’re modifying. The hierarchy tangles: the PST accredits its own members, who then define the rules governing accreditation and adjudication, under rules they inherited from predecessors who were accredited under prior versions.

  **Checking the work:**  
  1. **The putatively inviolate level:** The founding statute or initial rules might seem inviolate, as they launched the system.  
  2. **Why it’s entangled:** The PST’s amendment power (from the initial rules) explicitly includes altering *any part* of its rules—even the amendment threshold or accreditation criteria. When later members (accredited under evolved PST rules) vote to change the founding provisions, they do so *using* the authority derived from those provisions. The "foundation" is thus a product of the system it bootstrapped; it lacks immunity from the tribunal’s ongoing, self-referential rule-making.  
  3. **Determinate answers?** Yes. The PST operates using its *current* codified rules at any given moment. When deciding a misconduct case or a rule change, it applies the existing, historically contingent ruleset—even if that ruleset was amended via earlier applications of the same process. This temporal grounding prevents paralysis.  

  **Your core question:** This *is* a counterexample to the claim that hierarchies *always* need an inviolate "somewhere to stand." Here, the PST functions determinately without one, by relying on **provisional, time-indexed authority**. The "standing place" isn’t hidden—it’s explicitly dynamic, shifting with each ratified rule change. Like Escher’s hands, the interdependence is irreducible, but the institution "moves forward" by treating its *current state* as binding.  

  **Settled vs. disputed elements:**  
  - **Settled:** Most theorists agree such "coherentist" systems *can* function practically without a metaphysical foundation (e.g., UK common law’s evolving precedent). The PST scenario’s operational viability is broadly accepted.  
  - **Disputed:** Whether this truly *resolves* regress or merely *defers* it (e.g., might "crises" expose instability?). Hardliners (e.g., foundationalists like Searle) insist such tangles *must* collapse without an inviolate layer; pragmatists (e.g., Dworkinians) argue temporal coherence suffices. Crucially, **invoking Gödel here is contested**: while his theorems show formal systems can’t self-prove consistency, applying this to *social institutions* involves disputed leaps about modelling human rules as axiomatic systems. No consensus exists on whether Gödel *forces* real-world hierarchies to need inviolate levels—many reject the analogy.  

  **In essence:** The PST tangle holds without paralysis because its authority is *diachronic*—it "stands" on whichever rules exist *now*, forged by rules *then*. That’s not hiding a foundation; it’s rejecting timeless foundations altogether.
