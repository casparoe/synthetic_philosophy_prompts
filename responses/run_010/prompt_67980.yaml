  For concessions: HELM must concede that without aligned priors, the clause might fail ("empty set"). VANTAGE must admit that perfect non-interference is impossible ("tangled outcomes"). Neither converts the other. 

  The ending should leave the core conflict sharper—maybe HELM accepting that mutual gain isn't guaranteed, while VANTAGE acknowledges the default is messy. No neat resolution, just clearer stakes. 

