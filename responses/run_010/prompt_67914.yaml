  I cover science and ideas for a magazine, and last month I sat in on the second evening of a festival panel about accountability in research institutions. The advertised topic was bland, but the argument that actually broke out was about hypocrisy and the right to blame, and I have been turning it over ever since. Two panelists did the work: Nora, a moral philosopher who writes about blame and resentment, and Ezra, a lawyer who teaches jurisprudence. I was in the audience taking notes. I don't have a horse in this race, and I would rather you not be able to guess from my write-up which of them I found the better speaker.

  The case under discussion was one I had reported on earlier in the year. The director of a research institute publicly reprimanded a postdoc for failing to declare a paid consultancy, in language that made the omission sound like a defect of character rather than an administrative lapse. It later emerged that the director's own declarations had been late and incomplete for years, in the same category.

  Here is the exchange as I recorded it.

  1. Ezra opened by refusing the frame. The reprimand was accurate: the postdoc did fail to declare, and nothing in the director's own file makes that false, or makes it less of a failure. Blame, on the ordinary understanding, is a judgment that an act was wrong plus a negative attitude toward the agent's having done it, and neither component is sensitive to who is doing the judging. What Nora wants to call standing, he said, is a rule of court practice smuggled into ethics: the clean-hands idea is a discretionary bar on equitable relief, confined to misconduct bearing on the very subject of the claim, available only as a defense raised by the opposing party, and administered by an institution that has to decide whether to act. Morality has no docket, no discretion, and no opposing party to raise the defense.

  2. Nora said this depends on an impoverished picture of blame. To blame someone is not only to be right about them; it is to address a demand to them as a fellow member of a community that holds itself to common rules, and the demand carries an implicit term, that the addresser is inside those rules too. The director exempts himself from a rule he is pressing on someone junior to him. The defect is not in the content of his judgment but in his making it, and making it is exactly what blaming consists in.

  3. Ezra pressed the consequence. If the condition on blame is that the blamer be clear of the relevant fault, then almost nobody clears it: most of us have criticised conduct we are not clean of, and much of that is never known. A doctrine that renders nearly all actual moral criticism unauthorized is not a refinement of blame, he said, but a reductio of the doctrine. He added that Nora's condition is also badly over-inclusive in the other direction, since it strips standing from someone who broke the rule once, decades ago, confessed it, and changed.

  4. Nora said the condition is graded rather than a switch, and that she is untroubled by the reductio. If it turns out that a large share of ordinary moral criticism is compromised to some degree, that is a finding about how readily criticism licenses itself, not a flaw in the analysis. She also said Ezra had changed the subject: her claim was never that the director's reprimand was false, only that it was not his to deliver in that register.

  5. Ezra then set out what he took to be the decisive case. Imagine two directors identical in conduct, identical in wording, identical in their relationship to the postdoc; one carries an undeclared, undiscovered, unrepented fault of exactly the same kind, the other does not. On Nora's view one lacks standing and the other has it. Yet nothing an observer, the postdoc, or a colleague could register differs between them: the address is word for word the same, the demand is the same, the relationship is the same. So either the difference is inert, in which case standing does no explanatory work and the dispute is over a shadow; or the real variable is the director's dispositions and commitments, in which case the honest formulation is that blame is undermined by the blamer's lack of commitment to his own standards, and there is no need to posit a moral status called standing.

  6. Nora said the case is not inert and that Ezra was assuming standing must be detectable in order to be real. A promise made by someone who already intends not to keep it binds him all the same, and the invisibility of his intention does not make the difference between that promise and an honest one irrelevant. What standing governs is not the truth of the reprimand but what the blamer may insist on afterwards: whether the postdoc owes him an apology, whether his resentment is apt, whether third parties should join in. A man who does not hold himself to the rule has no basis to insist on it.

  7. Ezra replied that she had now conceded his point, because what she described is a fact about the blamer's character and commitments, insincerity in the ordinary sense, and not a fact about a status he occupies. He asked her to say what distinguishes "you should not have delivered that reprimand" from "you could not have."

  8. Nora said the difference is that the second claim is agent-relative: it explains why the postdoc is entitled to decline to answer, why bystanders are under no obligation to reinforce the criticism, and why an apology extracted by the director is not something he is owed. Ezra's last word was that agent-relativity without a mechanism is a label, not an explanation.

  They never resolved it, and I am not going to try to resolve it in print. But I would like your adjudication, and I would like it granular.

  (a) Rate each of the eight moves on a fixed scale, clearly right / defensible / weak / clearly mistaken, and say briefly why. Rate the move as an argumentative step, not as a summary of that speaker's overall position; a panelist can be clearly right in move 3 and clearly mistaken in move 5.

  (b) As you go, flag wherever the two are using "standing" in different senses, for instance as an authority to address someone, as the permissibility of the act of blaming, as an entitlement to press for a response, or as an epistemic qualification to judge. I suspect several moves only appear to clash because of a slide between these, and I want to know which ones.

  (c) Say specifically which of the following Ezra wins and which Nora wins: whether blame is sensitive to the blamer's own conduct; whether the equity analogy is load-bearing or merely decorative; whether the nobody-clears-the-bar consequence is a reductio or a finding; whether the two-directors case shows standing to be inert; and whether the agent-relativity point in move 8 answers Ezra's demand for a mechanism.

  (d) Tell me what both of them are missing, something neither raised that would change the shape of the argument. I have a suspicion there is at least one such thing, but I want it from you rather than from me.

  Please be explicit about your confidence. Tell me which of your ratings you would defend under pressure, which you would revise if a better-informed reader pushed back, and the single point in the whole answer you are least sure of.

  End with a machine-readable line in exactly this form: Verdict: X, where X is one of NORA, EZRA, or NEITHER, giving your judgment of who was more right overall across the eight moves.
reasoning: |-
  Hmm, the user is asking me to analyze a detailed philosophical debate about moral standing and blame between two panelists, Nora and Ezra. They want me to evaluate each of their eight moves in the argument, identify where they might be using "standing" in different senses, determine who wins specific points, and suggest what both might be missing. Finally, I need to give an overall verdict on who was more right.

  Let me break down each move carefully. For move 1, Ezra argues that blame is simply a judgment plus negative attitude, unaffected by the blamer's own conduct. He rejects the "clean hands" concept as a legal artifact that doesn't apply to morality. This is defensible because he clearly defines blame in a narrow, content-focused way, but weak in dismissing the interpersonal dimension Nora emphasizes.

  In move 2, Nora counters that blame involves addressing a demand within a shared moral community, requiring the blamer to be subject to the same rules. This is defensible as it captures the relational nature of blame, though she hasn't yet clarified how exactly "standing" operates in moral contexts.

  Ezra's move 3 points out practical problems with Nora's view: if standing requires blamelessness, almost no one qualifies, which he calls a reductio ad absurdum. This is defensible as a logical challenge, though he overlooks that Nora might see standing as gradational rather than binary.

  Nora's move 4 responds that standing is graded and that widespread compromised criticism is an empirical observation, not a flaw. She also clarifies her position isn't about truth but about who can deliver blame. This is defensible, especially in separating truth from delivery rights.

  In move 5, Ezra constructs a thought experiment with two identical directors - one with hidden fault, one without - arguing any difference must be inert or reducible to hypocrisy. This is weak because it assumes undetectable differences can't matter morally, which Nora will challenge.

  Nora's move 6 argues that undetectable differences affect post-blame dynamics (apology obligations, third-party responses). She compares it to promises made with dishonest intent. This is clearly right as it explains how standing governs consequences rather than initial truth.

  For move 7, Ezra claims this concedes his point that it's about character, not status. He demands she distinguish "should not" from "could not" blame. This is defensible in pressing for mechanism, but overlooks Nora's agent-relativity point.

  Finally in move 8, Nora distinguishes the two by emphasizing agent-relative entitlements in response dynamics. Ezra dismisses this as mere labeling. This is weak from Ezra as he fails to engage with the substantive moral difference she describes.

  On the specific questions: Both win some points. Nora wins on blame being sensitive to blamer's conduct in terms of authority. Ezra wins on the equity analogy being merely decorative. Nora wins on the "nobody clears the bar" point being a finding rather than reductio. The two-directors case doesn't make standing inert, so Nora wins there. And Nora's agent-relativity does answer the mechanism question substantively.

  They're both missing the institutional context - Ezra ignores how organizational hierarchy affects moral authority, while Nora underplays how formal roles might grant standing despite personal flaws. Also, neither explores how redemption or reform might restore standing.

  My confidence is highest on move 6 (clearly right) and move 5 (weak). Least sure about move 7's rating.

  Overall, Nora's position better captures the relational and practical dimensions of blame, especially her insights about post-blame expectations and agent-relative constraints. Ezra's narrow focus on blame's propositional content misses too much of what makes blame a social practice.
answer: |-
  Below is my granular adjudication of the debate, structured per your requirements. Confidence levels are noted throughout and summarized at the end.  

  ### (a) Ratings of Each Move (Scale: Clearly Right / Defensible / Weak / Clearly Mistaken)  
  **Ratings focus on the argumentative step's logic, coherence, and responsiveness.**  

  1.  **Ezra (Move 1): Defensible**  
      *   **Why:** Correctly identifies that blame's truth-value isn't negated by the blamer's hypocrisy. Strongly distinguishes legal "clean hands" (procedural, institutional) from moral blame (truth-oriented). However, dismisses Nora's core premise (standing as intrinsic to moral address) too quickly.  
  2.  **Nora (Move 2): Defensible**  
      *   **Why:** Effectively reframes blame as a communal, relational act requiring shared adherence to norms. Exposes the flaw in Ezra’s "truth-only" view by highlighting the performative hypocrisy of the director. Could be clearer on how "standing" functions non-legally.  
  3.  **Ezra (Move 3): Weak**  
      *   **Why:** Raises a valid practical concern (hyper-inclusivity of the rule), but misrepresents Nora's position as requiring absolute "cleanliness." Fails to engage her likely view of graded standing (hinted in Move 4) and overstates the "reductio" by assuming the doctrine must invalidate *all* criticism rather than qualify its force.  
  4.  **Nora (Move 4): Clearly Right**  
      *   **Why:** Masterfully clarifies her core distinction: the issue isn't the *truth* of the reprimand but the *authority* to deliver it in that register. Directly counters Ezra’s "reductio" by accepting the empirical possibility of widespread compromised criticism as a feature, not a bug. Correctly notes Ezra shifted focus from delivery-right to truth.  
  5.  **Ezra (Move 5): Weak**  
      *   **Why:** The thought experiment is clever but flawed. It assumes "standing" must manifest observably to be real or relevant, which Nora explicitly rejects. The difference isn't "inert"; it affects the *normative consequences* of the blame (as Nora argues in Move 6). Reducing it solely to "lack of commitment" (hypocrisy) prematurely dismisses the concept of relational authority.  
  6.  **Nora (Move 6): Clearly Right**  
      *   **Why:** Provides the crucial mechanism missing earlier: standing governs the *downstream obligations and responses* (apology owed, resentment's aptness, third-party reinforcement). The promise analogy is apt: an insincere promise still creates obligations, but the promisor's hidden flaw affects *their* subsequent rights to enforce it. Directly answers the "inertness" charge.  
  7.  **Ezra (Move 7): Defensible**  
      *   **Why:** Correctly presses Nora to distinguish her concept ("should not") from a stronger prohibition ("could not"). Highlights that her description (insistence on apology, resentment) points to the blamer's *character/hypocrisy* ("insincerity") as the operative factor, questioning the need for a distinct "status." A fair challenge to Nora's terminology.  
  8.  **Nora (Move 8): Defensible**  
      *   **Why:** Clearly defines the agent-relative consequences ("entitled to decline," "no obligation to reinforce," "apology not owed"). This *is* a mechanism – it specifies *how* lacking standing alters the normative landscape post-blame. Ezra's dismissal ("label not explanation") is too glib, but Nora could have elaborated further on *why* these entitlements shift.  

  ### (b) Flagging Senses of "Standing"  
  *   **Move 1 (Ezra):** Treats it as purely *epistemic/judgmental* qualification (right to *judge* truthfully) or *legal-procedural* bar (clean hands doctrine). Dismisses its moral relevance.  
  *   **Move 2 (Nora):** Uses it as *relational authority* – the *right to address a moral demand* as an equal participant bound by the same rules.  
  *   **Move 4 (Nora):** Clarifies it as *authority to deliver blame "in that register"* – implying performative legitimacy, not truth.  
  *   **Move 6 (Nora):** Defines it as governing *entitlement to press for responses* (apology, resentment, third-party support).  
  *   **Move 7 (Ezra):** Challenges it as a distinct *moral status*, arguing it collapses into *sincerity/character*.  
  *   **Key Slides Causing Apparent Clash:**  
      *   **Moves 1 vs. 2/4:** Fundamental clash: Ezra (judgmental/epistemic/legal) vs. Nora (relational authority/performative legitimacy).  
      *   **Move 3:** Ezra attacks a strict "permissibility to judge" sense (which Nora doesn't fully hold) while Nora focuses on authority/register.  
      *   **Move 5:** Ezra assumes standing must be detectable (epistemic/judgmental) for relevance; Nora (Move 6) defines it by normative consequences (entitlement to press).  
      *   **Move 7 vs. 8:** Ezra sees "standing" as redundant label for insincerity; Nora sees it as explaining agent-relative entitlements.  

  ### (c) Who Wins Specific Points  
  *   **Whether blame is sensitive to the blamer’s own conduct?**  
      *   **Winner: Nora (Partial).** Ezra wins on *truth* being insensitive. Nora wins decisively on the *authority to deliver blame effectively/legitimately* and the *entitlement to demand responses* being highly sensitive.  
  *   **Whether the equity analogy is load-bearing or merely decorative?**  
      *   **Winner: Ezra.** He correctly shows the specific legal mechanics (discretionary bar, raised by opposing party, subject-specific) don't translate directly. Nora's moral "standing" is conceptually distinct, making his analogy decorative (a point *against* importing it) rather than load-bearing.  
  *   **Whether the nobody-clears-the-bar consequence is a reductio or a finding?**  
      *   **Winner: Nora.** Her graded view (Move 4) and acceptance of widespread compromised criticism as a *descriptive fact* about human moral practice, not a fatal flaw in the *concept*, is more persuasive. Ezra's "reductio" assumes an implausibly strict binary view of standing.  
  *   **Whether the two-directors case shows standing to be inert?**  
      *   **Winner: Nora.** Her Move 6 demonstrates the difference is *not* inert; it governs the post-blame normative landscape (obligations, entitlements, third-party roles), even if undetectable at the moment of utterance.  
  *   **Whether the agent-relativity point answers Ezra’s demand for a mechanism?**  
      *   **Winner: Nora (Partial).** She provides a clear mechanism: *shifting agent-relative entitlements and obligations* (postdoc can ignore, bystanders needn't join, apology isn't *owed to the director*). This explains *how* lack of standing functions. Ezra's retort in Move 7 (it's just character) doesn't negate this mechanism; it questions the *label*, not the described effect.  

  ### (d) What Both Are Missing  
  **The Institutional Power Dynamic & Role-Responsibility:**  
  *   **The Gap:** Neither adequately addresses how the *director's institutional role* (power, authority, duty to enforce rules) interacts with moral standing.  
  *   **Why it Changes the Argument:**  
      *   **For Ezra:** His "truth is sufficient" view becomes weaker. A director *as an institutional actor* may have a *duty* to reprimand *regardless* of personal hypocrisy to uphold systemic integrity, but this institutional duty doesn't automatically grant *moral* standing in Nora's sense. It complicates his claim that hypocrisy is irrelevant.  
      *   **For Nora:** She focuses on the interpersonal moral community but underplays that the director acts *in an official capacity*. Does institutional role grant a distinct type of standing (or obligation) that coexists with, or conflicts with, her moral standing? Can a hypocritical director have *institutional* standing but lack *moral* standing? This could refine her view or expose a tension.  
  *   **Impact:** Introduces a layer (role-based obligations/permissions vs. personal moral standing) that challenges both panelists' somewhat monolithic views of blame. It makes the case less about abstract blame and more about blame *within a power structure with formal accountability duties*.  

  ---

  ### Confidence Assessment  
  *   **Highest Confidence (Would Defend Under Pressure):**  
      *   Move 4 (Nora) Rating: Clearly Right. Her distinction between truth and delivery-right is crucial and well-argued.  
      *   Move 6 (Nora) Rating: Clearly Right. The downstream consequences mechanism is compelling and directly addresses inertness.  
      *   Nora winning the "reductio vs. finding" point. Her graded view handles the objection.  
      *   The "institutional power dynamic" as a key missing element.  
  *   **Moderate Confidence (Defensible but Could Revise Under Pushback):**  
      *   Move 1 (Ezra) Rating: Defensible. His legal/moral distinction is sound, but the dismissal of Nora's premise is debatable.  
      *   Move 8 (Nora) Rating: Defensible. Agent-relativity *is* a mechanism, but elaboration on its foundation would strengthen it.  
      *   Ezra winning the equity analogy point.  
      *   Nora winning the "sensitive to conduct" point (on authority/response).  
  *   **Lowest Confidence (Weakest Point / Most Likely to Revise):**  
      *   **Move 5 (Ezra) Rating: Weak.** While I believe the "inertness" charge fails (per Nora's Move 6), the rating hinges on judging his step *as presented*. A strong pushback might argue that demanding observable differences is a fair challenge to *moral relevance*, making it more "Defensible" than "Weak." This is the **single point I'm least sure of** in the ratings.  
      *   Move 7 (Ezra) Rating: Defensible. The challenge to the "status" label is fair, but it risks ignoring Nora's described mechanism.  

  **Verdict: NORA**  
  Nora consistently offered more nuanced and ultimately more persuasive arguments. She successfully reframed the issue around the relational authority to blame and the normative consequences governed by standing (Moves 2, 4, 6, 8), effectively countered Ezra’s reductio and inertness charges (Moves 4, 6), and provided a concrete mechanism via agent-relativity (Move 8). While Ezra made strong points distinguishing legal equity from morality (Move 1) and pressing on terminology (Move 7), his key critiques (Move 3's reductio, Move 5's inertness) were less successful against Nora's developed position. Her analysis better captures the core moral problem in the case: the director's hypocrisy undermining his *right* to demand a response, even if his *judgment* was correct.
