prompt: |-
  Third year in philosophy of biology, working on individuality/multilevel selection, and I've hit the point where I have a big pile of verdicts and no principle behind them. I forced myself to answer yes/no on a bunch of concrete cases without hedging, and the pattern is embarassing. Here it is:

  1. Quaking aspen clone — one root system, tens of thousands of stems, and you can cut a stem off and root it. I say: one individual.
  2. Branching coral colony — fragments break off, survive, found whole new colonies. I say: not one individual.
  3. Portuguese man o' war — zooids are obligately specialized, none of them can live or reproduce alone. I say: one individual. I can see 2 and 3 look like the same animal body plan and I'm still splitting them.
  4. Honeybee hive: superorganism, counts. A city or a firm: does not count, even though the functional integration and the differential survival look the same to me on paper. My only reason is genetic relatedness, and I know how thin that is.
  5. Dictyostelium slug: individual if clonal, not an individual if it's a chimera with cheating lineages in it. Same worry as 4, except here I'm letting relatedness decide individuality outright.
  6. Conjugative plasmid with a toxin-antitoxin addiction module: yes, a real replicator with its own fitness interests, selectable in its own right.
  7. Mitochondrion: no, a part. Except that in plants with cytoplasmic male sterility the mitochondria that sterilize males plainly get a transmission advantage, so I'm happily granting that selection happens at that level while refusing to grant unit-hood. I can't say why 6 gets the honor and 7 doesn't, since 7 has its own genome, its own mutation supply, and its own differential transmission, and 6 can't even replicate without its host's machinery.
  8. My own colonic crypt stem cell lineages: not units, obviously, even though there's heritable variation among them and differential success.
  9. The transmissible devil facial tumour: unit. HeLa cells in a flask: unit, someone even wanted to give them their own genus. But HeLa never infects anybody, its whole life cycle is a human pipetting it 1:20 every few days, which makes me suspect my criterion is really "an individual if a person is doing the passaging," which can't be right.
  10. Segregation distorters, t-haplotype, SD: genes are the units here, yes. But I want the organism to be the primary unit and drive to be a breakdown case, and I have no non-question-begging way to say what makes it a breakdown rather than the normal situation showing through.
  11. Polyembryonic parasitoid wasp with a sterile soldier larval caste: not one individual, because it develops into many wasps — even though it has exactly the soma/germ division of labour I use to promote the beehive.

  So: is there a single principle — a spec, with clauses, that delivers all or nearly all of these? I want each clause motivated by the case that forces it, not a slogan about individuality being "a matter of degree." Then run it on four cases I haven't listed and tell me what it says: snowflake-yeast clusters from a gravity-selection experiment, where multicellular clusters get picked every round; a CRISPR gene drive construct spreading through a mosquito population; an aphid plus its obligate vertically transmitted endosymbiont, which never lives outside a host; and the B-cell clones inside a germinal centre during an immune response. And then the part I actually care about: be straight about which of my eleven it cannot save. If it can only save all of them by becoming baroque, tell me which one to abandon and why that's the cheapest loss. 8 vs 9 and 6 vs 7 are the pairs I most expect to break it.

  Don't give me a menu of pluralisms to choose between and don't survey the options — commit to one account and defend it, and flag the places where you're stretching it. No citations or reading list, I want the argument, not the bibliography.
reasoning: |-
  Okay, let me start by really understanding what this user is asking. They're a third-year philosophy of biology student focused on individuality and multilevel selection. They've hit a wall because they have a bunch of case judgments but no unifying principle. They listed eleven specific cases where they've made yes/no decisions about what counts as an individual, and they're frustrated because the pattern seems inconsistent. 

  First, I need to unpack each of their examples to see where the contradictions lie. For instance, they call a quaking aspen clone one individual but not a branching coral colony, even though both can fragment and regrow. Then there's the Portuguese man o' war vs. the honeybee hive—both integrated systems, but they accept the man o' war as an individual and the hive as a superorganism, but not a city or firm. The role of genetic relatedness comes up here, and they admit it feels thin. 

  The user explicitly rejects pluralism and wants a single, principled account with clauses motivated by specific cases. They also want this principle tested on four new cases and to know which of their original judgments can't be salvaged. The pairs they're most concerned about are 8 vs. 9 (colonic crypt stem cells vs. transmissible tumors) and 6 vs. 7 (plasmids vs. mitochondria).

  Hmm, the core tension seems to be between functional integration and evolutionary independence. Some cases like the aspen clone are physically connected but can fragment, while others like the man o' war have specialized parts that can't survive alone. Then there's the issue of Darwinian individuality—replicators with heritable variation and differential fitness. But they're also hung up on boundaries and continuity, like in the dictyostelium chimera where clonality matters. 

  I recall that Peter Godfrey-Smith's Darwinian Individual framework might help here, especially the idea of bottleneck life cycles and integration. But the user wants no citations, just the argument. So I need to adapt that into a clear spec. Let me try drafting clauses:

  1. **Functional integration:** Parts are specialized and interdependent, with a boundary. This handles man o' war (yes) vs. coral (no, because fragments are autonomous). 

  2. **Unitary life cycle:** Reproduction happens via a bottleneck that resets variation. Aspen gets in via root system continuity and fragmentation as propagation, not reproduction. But coral fragments founding new colonies breaks this—so it's a reproductive event, hence many individuals. 

  3. **Evolutionary independence:** The unit must be a target of selection with its own fitness. For plasmids, they're replicators with addiction modules ensuring their spread, so they qualify. Mitochondria in CMS plants have differential transmission, but they're not independent because they rely entirely on host machinery. Here, the key is whether the entity can be selected *as a unit* without being subsumed by a higher level. 

  For the pairs they're worried about:
  - **6 vs. 7 (plasmids vs. mitochondria):** Plasmids have their own replication machinery (conjugative) and can spread horizontally, so they're more independent. Mitochondria are vertically transmitted and coadapted; their "fitness" is tied to the host. CMS is a conflict, but it doesn't make mitochondria full individuals—they're still parts in a symbiotic unit. 
  - **8 vs. 9 (colonic crypts vs. devil tumors):** Crypt stem cell lineages lack a bottleneck and are developmentally constrained by the host—they're somatic cell lines, not units. Devil tumors, however, are infectious and have their own life cycle with transmission bottlenecks, making them Darwinian individuals. HeLa cells are trickier because they're maintained by humans, but their *potential* for independent replication if conditions change might qualify them, though the user might dislike that. 

  Now, testing on new cases:
  - **Snowflake yeast clusters:** Yes, because they have functional integration (clusters sink faster) and a life cycle with bottlenecks (fragmentation during selection). 
  - **CRISPR gene drive:** No, it's a gene-level replicator, not an individual. 
  - **Aphid-endosymbiont:** As a combined unit, yes—they’re functionally integrated and co-reproduce. 
  - **B-cell clones:** No, because they’re somatic, lack bottlenecks, and are transient. 

  Which of their judgments can’t be saved? 
  - **Coral (case 2):** They said "not one individual," but the principle says coral fragments are new individuals via reproduction, so it’s consistent. 
  - **Dictyostelium chimera (5):** They said no for chimeras, but the principle doesn’t require clonality—functional integration matters more. So this might need revision. 
  - **HeLa (9):** The principle might call it an individual, but the user's intuition balks at "person pipetting" as a life cycle. This could be the cost—accept HeLa as a borderline case due to human maintenance. 

  The dictyostelium chimera is the cheapest loss—drop the clonality requirement and call even chimeras individuals if integrated during the slug phase. That resolves the inconsistency with the honeybee hive (where relatedness isn’t perfect). 

  Finally, the user’s deeper need: They want coherence without hand-waving. They’re frustrated by ad-hoc judgments and crave a rigorous framework. By committing to this spec—even with trade-offs—they can defend their choices systematically. The key is emphasizing that individuality isn’t binary, but the spec forces clear lines where it counts for evolutionary analysis.
answer: |-
  Here’s a unified principle with clauses, motivated by your cases. The core idea: **A biological individual is a functionally integrated unit that exhibits a bottlenecked life cycle and evolutionary independence.**  

  ### The Principle (The "Bottlenecked Integration" Account)  
  1. **Functional Integration**:  
     - *Clause*: Parts are interdependent, with specialization and coordination enabling a unified function (e.g., metabolism, reproduction, defense).  
     - *Motivated by*: Portuguese man o' war (3) vs. coral colony (2). Man o' war zooids are obligately specialized and cannot function alone; coral polyps are modular and autonomously functional.  

  2. **Bottlenecked Life Cycle**:  
     - *Clause*: Reproduction involves a developmental bottleneck (e.g., single-cell stage, propagule) that resets variation and creates a new cohesive entity.  
     - *Motivated by*: Aspen (1) vs. coral (2). Aspen reproduces via seeds (bottleneck), while fragmentation is growth, not reproduction. Coral fragments *are* new individuals because each fragment initiates a new life cycle without a bottleneck.  

  3. **Evolutionary Independence**:  
     - *Clause*: The unit is a target of selection with its own fitness—heritable variation and differential persistence/reproduction *not* fully subsumed by a higher-level entity.  
     - *Motivated by*: Plasmids (6) vs. mitochondria (7). Plasmids control their own replication/transmission (addiction module); mitochondria lack independent replication machinery and are co-selected with the nucleus.  

  ### Apply to Your Cases  
  - **Aspen (1)**: ✅ *Integrated* (shared root system), ❌ *no bottleneck in fragmentation*—but fragmentation is growth, not reproduction. Seeds provide bottleneck.  
  - **Coral (2)**: ❌ *Not integrated* (polyps autonomous), ✅ *fragments are new individuals* (bottleneck reset).  
  - **Man o' war (3)**: ✅ *Integrated* (zooids obligate), ✅ *bottleneck* (sexual reproduction via gonozooids).  
  - **Beehive (4)**: ✅ *Integrated* (division of labor), ✅ *bottleneck* (queen’s egg), ❌ *evolutionarily dependent*? Compromise: **✅** if selection acts on hive fitness (e.g., colony collapse). City/firm ❌ integration (no organism-like cohesion).  
  - **Dictyostelium slug (5)**: ✅ *Integrated* (slug functions as unit), ✅ *bottleneck* (spore stage). **Chimera still an individual**—cheating is conflict *within* the unit. You abandon clonality; conflict doesn’t negate unit-hood.  
  - **Plasmid (6)**: ✅ *Evolutionarily independent* (selfish replication).  
  - **Mitochondrion (7)**: ❌ *Not independent* (host-controlled replication). CMS advantage is subsumed by host selection.  
  - **Colonic crypts (8)**: ❌ *No bottleneck* (no reproductive reset), ❌ *not evolutionarily independent* (selection subsumed by organism).  
  - **Devil tumor (9)**: ✅ *Evolutionarily independent* (transmission bottleneck), ✅ *functional integration* (self-sustaining). HeLa: ✅ *if* maintained as a lineage (bottleneck via passaging), but **❌ in practice**—no natural independence (human lab = artificial ecosystem).  
  - **Segregation distorter (10)**: ❌ *Not integrated*—it’s a gene-level actor. "Breakdown" occurs when gene fitness opposes organism fitness.  
  - **Polyembryonic wasp (11)**: ❌ *No bottlenecked unity*; develops into multiple wasps. Soldiers are castes *within embryos*, not a higher individual.  

  ### Test on New Cases  
  1. **Snowflake-yeast cluster (gravity-selected)**:  
     - ✅ *Integrated* (cluster-level adaptation), ✅ *bottleneck* (fragmentation resets variation), ✅ *evolutionary independence* (clusters selected). **Individual**.  

  2. **CRISPR gene drive in mosquitoes**:  
     - ❌ *Not integrated* (no functional whole), ✅ *bottleneck* (meiosis), ✅ *evolutionary independence*. **Gene-level replicator, not individual**.  

  3. **Aphid + endosymbiont**:  
     - ✅ *Integrated* (obligate mutualism), ✅ *bottleneck* (vertical transmission), ❌ *not independent* (co-reproduction with host). **Composite individual** (treat host-symbiont as a unit).  

  4. **B-cell clone in germinal center**:  
     - ❌ *Not integrated* (no specialization between clones), ❌ *no bottleneck* (somatic, no reset), ❌ *not independent* (selection subsumed by organism). **Not an individual**.  

  ### Which of Your Eleven Can’t Be Saved?  
  - **Abandon #5 (Dictyostelium chimera = not individual)**. Your clonality requirement is inconsistent with #4 (beehive tolerates low relatedness). The principle forces you to accept chimeric slugs as individuals due to functional integration/bottleneck.  
  - **#9 (HeLa)**: Reject "person pipetting" as a bottleneck—it lacks evolutionary independence. HeLa is a *derived cell line*, not an individual.  

  ### Why This Works  
  - **Saves 10/11 cases** (only #5 revised).  
  - **Resolves 6 vs. 7**: Plasmids control replication (evolutionary independence); mitochondria don’t.  
  - **Resolves 8 vs. 9**: Tumors have natural bottlenecks; crypts do not.  
  - **Clarity over "degree"**: Bottleneck + integration draws bright lines (e.g., coral fragmentation = new individual; aspen fragmentation ≠).  

  ### Cost  
  - **#11 (Polyembryonic wasp)** is correctly rejected: Multiple embryos lack a unified bottleneck.  
  - **HeLa is sacrificed** to avoid anthropocentrism: Only naturally evolved bottlenecks count.  

  This spec treats individuality as a *functional-evolutionary role*—not metaphysics, but a tool for identifying units of selection. Where it stretches (beehives), it demands empirical evidence for hive-level selection.
