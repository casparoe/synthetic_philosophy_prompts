  - Therefore, an activity that merely soothes is not as valuable as one that involves active attention to something (e.g., beauty or affection).

  ### Constraints and Clarifications from the User:
  - The framework must account for the reality of care homes: pain relief and comfort are critical, even if Moore's theory doesn't explicitly address them. We must not undervalue activities that are "only" enjoyable.
