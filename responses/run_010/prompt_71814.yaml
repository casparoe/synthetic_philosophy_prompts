  We'll design a step-by-step procedure that captures Moore's core idea (appreciation of beauty and affection) but also makes room for comfort and pain relief, which are essential in this context.

  #### Steps:
  1. **Does the proposal clearly aim to improve residents' quality of life?** (Basic filter)
