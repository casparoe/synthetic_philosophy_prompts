prompt: |-
  I run a small stats-and-philosophy reading group at the library — plumber by trade, just curious. One of our regulars keeps saying hypothesis testing is a criminal trial: the null is the defendant, presumed innocent; the data is the evidence; and a non-significant result is only "not proven", never "innocent". He uses that to argue the replication crisis was never about the method itself, just people overclaiming, and that if everyone talked like a jury there'd be no problem left. Can you audit the analogy for me? I want the correspondances laid out — who's the jury, who's the prosecution, what plays the role of the standard of proof and who gets to set it — then where the mapping breaks, and which of those breaks actually matter for his arguement versus which are just decoration. In particular I can't see what alpha corresponds to, since a jury doesn't get to choose how convincing the evidence has to be, and I don't see where a retrial fits. If there's a better analogy for what the test is really doing, say what it is and why it carries less baggage. Bottom line first, then the detail, and please keep the whole thing under 400 words, in British English.
reasoning: |-
  Hmm, the user runs a stats and philosophy reading group and needs help auditing an analogy comparing hypothesis testing to a criminal trial. The analogy claims the null hypothesis is like a defendant presumed innocent, data is evidence, and non-significance means "not proven" rather than "innocent." This is used to argue that the replication crisis stems from misinterpretation rather than flawed methods. I need to evaluate this analogy thoroughly.

  Breaking down the key elements of the analogy: The null hypothesis corresponds to the defendant presumed innocent. Data represents evidence presented in court. A non-significant result aligns with "not proven" rather than "innocent." The user specifically wants to know about alpha (significance level), the jury, prosecution, standard of proof, and where the analogy breaks down.

  Mapping the trial components: The jury would be the researchers or scientific community interpreting the results. The prosecution is the researcher conducting the test, aiming to challenge the null. The standard of proof is the p-value threshold (alpha), typically set at 0.05 in science, analogous to "beyond reasonable doubt" in law.

  Where the analogy holds: The presumption of innocence for the null is valid. Non-significance correctly means "not proven" rather than proof of innocence. Both systems require evidence to meet a predefined standard to reject the status quo.

  Critical breaks in the analogy: In law, the standard of proof is fixed ("beyond reasonable doubt"), but in science, alpha is arbitrarily chosen by researchers. A criminal trial has a binary verdict, while hypothesis testing provides probabilistic evidence. The burden of proof in science should be adjusted for plausibility, unlike law where it's fixed. Retrials aren't built into hypothesis testing - non-replication is an external process.

  These breaks matter for the replication crisis argument: Arbitrary alpha choice encourages p-hacking. Misinterpreting p-values as proof (rather than evidence weight) leads to overclaiming. Lack of formal "retrial" mechanisms enables publication of non-replicable findings.

  For a better analogy: Consider quality control testing - checking if a batch meets standards. This focuses on detecting deviations from a baseline without moral implications, and emphasizes that non-rejection means "no evidence of problem" rather than "problem-free."

  Bottom line: The analogy correctly warns against declaring "innocence" from non-significance, but underestimates methodological issues in the replication crisis (arbitrary alpha, p-value misuse). While overclaiming is a problem, the method itself has flaws when misapplied.
answer: |-
  ### Bottom Line
  The criminal trial analogy correctly warns against declaring the null "true" from non-significance but dangerously understates methodological flaws in the replication crisis. While overclaiming is a key issue, arbitrary alpha thresholds and p-value misuse are inherent statistical problems—not just communication failures.

  ### Correspondences
  - **Defendant**: Null hypothesis (H₀, presumed "true" initially).  
  - **Prosecution**: Researcher (aims to disprove H₀).  
  - **Evidence**: Observed data.  
  - **Jury**: Scientific community (interprets evidence).  
  - **Standard of proof**: Alpha (α, e.g., 0.05), set by the researcher *not* society. Analogises "beyond reasonable doubt."  
  - **Verdict of "guilty"**: Statistically significant result (reject H₀).  
  - **Verdict of "not proven"**: Non-significant result (fail to reject H₀; never "proven innocent").  

  ### Where the Analogy Breaks (and Why It Matters)  
  1. **Alpha is arbitrary; legal standards aren't**.  
     - Courts fix "beyond reasonable doubt" (≈ high certainty). Researchers *choose* α (often 0.05), inviting p-hacking. This directly fuels the replication crisis.  
  2. **No formal "retrial" mechanism**.  
     - A hung jury prompts retrial; non-significance doesn’t trigger replication. Science relies on ad hoc efforts, allowing weak findings to persist.  
  3. **Burden of proof isn't fixed**.  
     - Legally, the prosecution *always* bears the burden. Scientifically, H₀ isn't always "innocent" (e.g., in genetics, H₀ may be "no link"). Misapplying the analogy obscures when H₀ is implausible.  
  4. **Evidence is probabilistic, not testimonial**.  
     - P-values measure data *extremeness* under H₀, not direct guilt. Confusing this (e.g., "p=0.04 = 96% guilty") causes overinterpretation.  

  ### Better Analogy: **Quality Control Testing**  
  - **Scenario**: Testing if a batch of widgets meets safety standards.  
  - **H₀**: "Batch meets standards" (assumed okay unless evidence shows otherwise).  
  - **Data**: Sample measurements.  
  - **Reject H₀**: Evidence batch is faulty.  
  - **Non-significant**: "No evidence it's faulty" (≠ "proven safe").  
  - **Why better**: Removes moral baggage, emphasises process control, and frames alpha as a *tolerable error rate* (e.g., 5% faulty batches accepted). Highlights that non-rejection implies compliance, not perfection.  

  ### Verdict on His Argument  
  He’s right that miscommunication (e.g., saying "no effect" for non-significance) worsens the replication crisis. But wrongly absolves method flaws: arbitrary α incentivises data dredging, and p-values alone can't confirm H₀. Jury-language helps, but won't fix statistical malpractice.  

