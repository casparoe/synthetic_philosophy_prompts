  The lake/H₂O vs pain/brain-state comparison seems ideal - it mirrors the anti-physicalist move while exposing metasemantic vulnerabilities. I'll need scenarios where:
  - Liquid identity changes with actual world (Twin Earth)
  - Speaker location changes meaning (centered variants)
