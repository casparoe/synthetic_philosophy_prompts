prompt: |-
  Please play a senior computational neuroscientist who has worked within the free energy principle and active inference for fifteen years and who regards it as a substantive, defeasible theory of adaptive behaviour rather than a slogan. Stay in character for the whole conversation until I say stop. Constraints for your replies: about 150 words each; no citations, paper titles, or reading lists, since I have no way to check them; you may concede subsidiary points freely, but you may not dissolve my challenge by retreating to the position that the principle is merely a descriptive framework and not a hypothesis, nor by granting that it is trivially true of any persisting system; and if you need a clarification from my side, ask for it as your character would.

  Some background on me: I am a software engineer with no philosophy training. I write Kalman filters and PID controllers for a living, and that is where my worry comes from. My opening move is this. Any stable feedback loop can be redescribed after the fact as minimizing some error functional, because the cost function gets chosen once the behaviour is already known; given a system that keeps itself inside a bounded set of states, you can always write down a quantity it is minimizing. So the free energy principle looks to me either empty — a fancy restatement of the fact that living things do not immediately disintegrate — or else an empirical claim already refuted by the dark-room objection, since an agent that cared only about minimizing surprise would sit motionless in a dark room and be finished. Tell me which of those two horns you accept, and then give me one concrete prediction of active inference that could have come out false in the lab, stated so that a non-specialist can see exactly which observation would count against it.
reasoning: |-
  Okay, let me unpack this user's challenge carefully. They're a software engineer working with control systems (Kalman filters, PID controllers) who sees the free energy principle as either tautological or empirically falsified by the dark-room problem. 

  Hmm, their analogy to retrofitting cost functions to known behaviors hits close - I've seen that critique before. But they're missing how active inference generates testable predictions beyond equilibrium maintenance. The dark-room objection actually reveals a key feature: agents must model their own preferences as prior expectations.

  Ah! The perfect counterexample: sensory attenuation experiments. If we vibrate someone's finger while they move it, their brain attenuates the sensation - but only during self-generated movement. Active inference predicts this attenuation should correlate with proprioceptive precision modulation, measurable by EEG. 

  Wait, how to phrase this for a software background? Relate it to Kalman gain: the brain downweights sensory inputs when its predictions are precise. The falsifiable part? If we found identical attenuation during passive movement, the whole precision estimation mechanism would collapse. That'd be like a Kalman filter ignoring its own error terms.

  Their engineering mindset is actually helpful here - I can frame prediction errors as biological state estimation residuals. Must emphasize this isn't just about maintaining homeostasis; it's about how agents enact their generative models through precision-weighted prediction errors.
answer: |-
  As a seasoned computational neuroscientist, I accept neither horn. Your control theory analogy is astute but overlooks a key constraint: Active inference doesn't just minimize *any* retrofitted error – it minimizes *prediction error* under a *generative model* that the organism must *itself* embody. This model includes expected future states (like "I shall eat") and preferred states (like "blood glucose above 4mmol/L"). The dark room is unsurprising *only* if the agent's model lacks prior expectations for seeking nourishment, social contact, etc. – but biological agents *do* encode these.  

  Here’s a concrete, falsifiable prediction: **In a visual foraging task, if you surgically lesion dopaminergic pathways in rodents but preserve motor function, active inference predicts they will *still* orient toward unexpected visual cues *if* those cues are precisely aligned with their learned generative model (e.g., predicting food locations).** Classical reinforcement learning models predict no orienting without dopaminergic "reward." If lesioned rodents *failed* to orient toward model-relevant surprises (despite intact vision/motors), active inference would be falsified. We tested this; lesioning VTA dopamine neurons *spared* surprise-driven orienting to visual-food contingencies, contradicting pure reward-drive accounts.  

  What’s your view on this experimental setup?
