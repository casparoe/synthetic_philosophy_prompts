prompt: |-
  I work in distributed systems, and for the past few years I have been reading the theoretical literature on how hard computational problems are, on my own time and without any formal training in the subject. There is a pattern I keep running into that I have no word for, and I would like to know whether one exists.

  Three instances first, since the abstraction only makes sense once you have seen them side by side.

  One. The best published exponent for matrix multiplication is better than the one you will find in an undergraduate text, and each improvement gets reported as progress on a question people used to consider closed. As far as I can tell, nobody runs those algorithms: the constant factor only pays off for matrices too large to be written down in this universe. Both facts are accepted at once — the improvement is genuine, and it will never execute — and nobody thinks the second undermines the first. The unreachable result is treated as the deeper of the two, because it says something about the shape of the problem rather than about any particular size of it.

  Two. A problem is proven intractable in the strongest way anyone knows how, and the conclusion binds only for inputs beyond any size that will ever exist in practice, yet the result is cited, unqualified, as the reason to stop trying to solve it.

  Three. At a talk, someone observed that for any single fixed input length there are only finitely many inputs, so you can hardcode the answers, and therefore every decision problem restricted to that length is solvable in constant time — meaning, they suggested, that the whole edifice says nothing about any computation anyone could ever perform. This was dismissed as a cheap trick inside a minute, and correctly dismissed, I think; nobody took it seriously. Yet as far as I can see it is literally true, and it is the same observation as the first two: a claim quantified over a range with no reachable members.

  What I want a name for is the asymmetry. That the quantifier ranges over sizes no one can ever get to is counted as a virtue in the first two cases and gets you laughed out of the room in the third, and I have never seen anyone state the rule that decides which is which. It is not that the first two are positive results and the third is a deflationary one, because I can build variants where that flips. And it is not simply a theory-versus-practice complaint: in the first case nobody is claiming the work is useful, and in the third nobody is asking for a faster algorithm.

  Is there an established concept for this? Please tell me what the nearest existing notions are — from either the complexity literature or the philosophy of science — how the thing I have described differs from each of them, and which, if any, actually covers it. If none does, coin a term, define it, and give me its boundary cases, including at least one clear non-example. And separately: has anyone stated a principled criterion for when an appeal to a regime that cannot be reached is legitimate rather than evasive? I am not asking for references, just the concepts and the distinctions; a bare label would not help me. The interesting part is where the line goes.
reasoning: |-
  Okay, the user works in distributed systems and has been self-studying computational complexity theory. They've noticed a recurring pattern involving results that are technically true but only apply to inputs of sizes beyond practical reach. They've given three examples: matrix multiplication exponents, intractability proofs for unrealistically large inputs, and the constant-time hardcoding argument dismissed as trivial. 

  The user is clearly sophisticated - they grasp both theoretical nuances and practical constraints. Their frustration isn't about theory vs practice but about inconsistent treatment of similar logical structures. The core question is: why is asymptotic analysis respected when it ignores physical constraints, while the constant-time hardcoding trick is rejected despite being equally valid mathematically?

  Hmm... this requires unpacking multiple layers. First, the dismissed constant-time argument exploits that asymptotic complexity is defined as behavior "for sufficiently large n". But this definition exists precisely to ignore low-order terms and machine-dependent factors - it's a feature, not a bug. The hardcoding "solution" fails because it doesn't give a uniform procedure across input sizes.

  Meanwhile, the matrix multiplication example shows how asymptotic improvements often precede practical ones. The Coppersmith-Winograd algorithm may be impractical, but it revealed mathematical structure that later led to better practical algorithms. Similarly, intractability results for huge inputs still provide useful classifications - if a problem is NP-hard, we shouldn't expect a general efficient solution even if small instances are manageable.

  The distinction seems to be about knowledge projection. Asymptotic results tell us how problems scale, which matters for future hardware or larger datasets. The hardcoding trick provides no scaling insight - it's a trivial existence proof with zero explanatory power. 

  The user might also be touching on scientific legitimacy. Complexity theory adopts asymptotic analysis as its lens - like physicists assuming frictionless planes. This is legitimate when it captures essential difficulties, but evasive if used to dismiss actual computability concerns (like cryptographic attacks on 1000-bit keys).

  I should emphasize that the boundary isn't fixed - sometimes "impractical" asymptotics become practical (AKS primality), sometimes not. The key is whether the analysis reveals invariant properties of the problem itself.
answer: |-
  You've identified a profound and nuanced pattern in theoretical computer science—one that touches on epistemology, scientific methodology, and the philosophy of computation. There isn't a single established term for this asymmetry, but the phenomenon is well-recognized. Below, I synthesize the key concepts, distinctions, and a principled criterion for legitimacy.

  ---

  ### **Core Concept: Asymptotic Legitimacy**
  The asymmetry arises from whether a result **reveals invariant structure** or **avoids engaging with the problem’s essence**.  
  **Legitimate cases** (your examples 1–2) exploit unreachable regimes to expose intrinsic properties of a problem.  
  **Illegitimate cases** (example 3) exploit unreachable regimes to *evade* the problem’s core challenge.  

  **Term Proposal**: **Structural Asymptotics** vs. **Evasion Asymptotics**  
  - **Structural Asymptotics**: Asymptotic analysis that illuminates inherent problem structure (e.g., matrix multiplication exponents, intractability proofs).  
  - **Evasion Asymptotics**: Asymptotic claims that trivialize the problem by ignoring its constructive essence (e.g., hardcoding finite instances).  

  ---

  ### **Key Distinctions and Principled Criterion**
  The legitimacy hinges on **uniformity** and **scaling invariance**:  

  1. **Uniformity of Solution**:  
     - **Legitimate**: Results apply *uniformly* across all input sizes (e.g., one algorithm works for all \(n\), even if impractical for large \(n\)).  
       *Example*: Strassen’s algorithm for matrix multiplication works for all \(n > n_0\), revealing algebraic structure.  
     - **Illegitimate**: Solutions are *non-uniform* (e.g., a different "algorithm" for each input size, like hardcoding answers per \(n\)).  
       *Example*: Claiming \(P = O(1)\) by hardcoding answers for each fixed \(n\) separately.  

  2. **Scaling Invariance**:  
     - **Legitimate**: Insights hold *independent of scale* (e.g., NP-hardness proofs show that if *any* instance is hard, the problem’s structure is universally challenging).  
     - **Illegitimate**: Insights *depend on scale* and collapse when scaled (e.g., hardcoding only works because we fix \(n\); it reveals nothing about the problem’s behavior under variation).  

  3. **Epistemic Value**:  
     - **Legitimate**: Results provide **transferable knowledge** (e.g., faster matrix exponents inspire practical approximate algorithms; intractability proofs guide heuristic design).  
     - **Illegitimate**: Results provide **no transferable knowledge** (e.g., hardcoding tells us nothing about how to solve even slightly larger instances).  

  ---

  ### **Boundary Cases**  
  **Clear Example of Structural Asymptotics**:  
  - The **exponential time hypothesis (ETH)** implies that 3-SAT requires \(2^{\Theta(n)}\) time. Even if \(n = 100\) is practically solvable, ETH guides algorithm design for related problems (e.g., parameterized complexity).  

  **Clear Example of Evasion Asymptotics**:  
  - Claiming **“TSP is solvable in \(O(1)\) time”** by hardcoding solutions for all graphs with \(\leq 10^{100}\) nodes. This is mathematically true but epistemically void—it doesn’t help solve a graph with \(10^{100} + 1\) nodes.  

  **Ambiguous Case (Where Legitimacy Flips)**:  
  - **Claim**: *“BB(1000) is uncomputable.”*  
    - **Evasion interpretation**: If we hardcode the answer for the 1000-state Busy Beaver function (which is a fixed value), this is trivial.  
    - **Structural interpretation**: Proving that \(BB(n)\) grows faster than any computable function *for large \(n\)* reveals fundamental limits of axiomatic systems (e.g., Gödel incompleteness).  
    **Line**: The structural claim quantifies over *all* \(n\) (uniformly), while evasion fixes \(n\).  

  ---

  ### **Nearest Existing Notions**  
  1. **Asymptotic Analysis** (Complexity Theory):  
     - Studies behavior as \(n \to \infty\).  
     - *Difference*: Your asymmetry addresses *when* this is scientifically legitimate, not just its definition.  

  2. **Pessimal Case Analysis** (Algorithmics):  
     - Focuses on worst-case inputs.  
     - *Difference*: You’re critiquing cases where the "worst case" is physically unreachable yet still informative.  

  3. **Finitism** (Philosophy of Math):  
     - Rejects infinity as meaningful.  
     - *Difference*: Your examples accept infinite regimes but demand they yield finite insights.  

  ---

  ### **The Principled Criterion**  
  An appeal to unreachable regimes is **legitimate** iff:  
  > **The result reveals a *scaling-invariant property* of the problem that cannot be inferred from bounded instances alone, and it provides *actionable epistemic leverage* for finite cases.**  

  **Why example 3 fails**: Hardcoding answers for fixed \(n\) provides no scaling-invariant insight or leverage.  
  **Why examples 1–2 succeed**:  
  - Matrix exponents reveal algebraic *reducibility* (e.g., Strassen’s method reduces the exponent via tensor decomposition).  
  - Intractability proofs classify problems by *universal hardness* (e.g., NP-hardness explains why heuristics fail randomly).  

  ---

  ### **Conclusion**  
  The asymmetry arises from **epistemic purpose**. Structural asymptotics (legitimate) extracts invariant truths about computation; evasion asymptotics (illegitimate) abuses quantification to avoid engaging the problem. The line is drawn by **uniformity, scaling invariance, and transferability of insight**. While no single term exists, "**structural asymptotic**" captures the legitimate case. The dismissal of your third example isn’t hypocrisy—it’s a defense of complexity theory’s mission: to understand computation’s *inherent nature*, not to describe fixed artifacts.
