  Part (b) touches on her deeper objection: the calculus of trading others' lives for one's own safety. Her Oxford protest centered on this dehumanizing arithmetic - "spending" civilians like currency to protect soldiers. The drone system institutionalizes this in coldly literal ways she'd find appalling.

  For (c), I suspect she'd paradoxically judge the remote operator more harshly. While the pilot sees human faces, they're at personal risk; the drone operator faces no danger while causing deaths via abstracted interfaces. Anscombe emphasized moral responsibility attaching to one's position - here, the technician's physical safety might heighten culpability.

