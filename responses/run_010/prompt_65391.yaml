  First, I need to parse the exact wording of ¶182. The key lines are: "The first does not have the object before it only in the passive form... but as an object existing independently for itself, over which therefore it has no power... if that object does not per se do what the first does to it." Then: "Action from one side only would be useless, because what is to happen can only be brought about by means of both." Hegel's emphasis here is on mutual action—recognition requires both parties to actively participate. 

