prompt: |-
  I cover science and ideas for a monthly, and I've been working on a piece about what happens to people's judgement when the odds aren't written down anywhere — climate, pandemics, new tech, that sort of thing. Went along to a behavioural economics thing in London last month and came away mildly cross, because everyone kept using "ambiguity aversion" as though it were one tidy phenomenon, and I couldn't tell whether they meant the same thing by it each time. So I did the obvious stupid thing and spent the weekend writing out every case I could think of where I had a gut reaction about a bet with unknown odds, and sorting them into yes and no. Here they are, roughly in the order I hit them.

  The classic urn: 90 balls, 30 of them red, the other 60 black or yellow in some split nobody will tell me. Bet pays if the ball I draw is red vs pays if it's black — I take red, no hesitation. Same urn, red-or-yellow vs black-or-yellow — I take red-or-yellow, also no hesitation. I'm aware those two together are supposed to break something. Second urn, also 90 balls, but this one was filled by someone who genuinely doesn't know what's in it, versus the first where there's a definite split I'm just not being told — and here's the thing, I'd pay the same for a red bet in either, which I didn't expect, since the second feels "more unknown" in some sense that the first doesn't. Two bookmakers: one I know to be sharp offers me evens on a match I know nothing about, a mate offers me evens on a match I follow closely — I take the mate's, obviously, but I'm not sure that's ambiguity at all rather than just my own knowledge. An expert says a coin is "roughly fair" and won't be pinned down, versus a coin I've flipped 200 times myself and got 101 heads — I take mine. But if the expert's vagueness is pure coyness, the coin actually being exactly 50/50 and them just enjoying being mysterious, I still feel the pull towards mine, which seems like it can't be about the real odds at all. Stakes: for £2 I'll take either ball out of the urn and honestly don't care; for £2,000 it's a flat no on the unknown, and I can't see how that's anything other than the size of the number doing the work. Insurance: I'd pay more to cover a house where the flood people publish a clean "1 in 200" than one where they say they haven't got enough data — so I'm buying the known number even when the unknown one might turn out smaller. Two urns, identical unknown composition, one filled by a stranger and one by my brother, who I'm confident wouldn't stitch me up: I prefer my brother's. And then the ones that go the other way, which is what really scuppered me — I actively prefer the mystery holiday, the unlisted restaurant, the band with no reviews. Structurally the same deal, unknown payoff distribution, except there I'm paying for the ambiguity rather than avoiding it. Finally the pair I keep going round on and can't fix: I would not buy a house whose flood risk is unquantified at almost any discount, I'll eat at a place with no hygiene rating without a second thought, and I'd put a large chunk of my savings into a business idea whose odds of working nobody on earth could state. All three are unknown-probability outcomes with real money on the line and I give three different answers. Oh, and one more that might be a different animal entirely: a bet on whether some technology exists in ten years, where I can't even list the possible outcomes properly, feels categorically worse to me than an urn where I just don't know the colour split, even though in both cases the probability is unavailable.

  So — is there a principle, or a small handful of competing ones, that actually generates these verdicts rather than being retro-fitted to them? I'd want it stated precisely enough that I could run a new case through it myself, and I'd want you to say which of my cases motivates which clause, because I suspect the honest answer is that "ambiguity aversion" is three or four things wearing one label and I'd like to know where the seams are. Then give me its verdict on two or three cases I haven't listed — here's one I'd genuinely like settled: a doctor offers me either a treatment with a well-established 70 per cent success rate from trials on people nothing like me, or a treatment with no trial data at all but a mechanism that looks plausible; which does the principle say I should take, and does it also say I'm being inconsistent if I don't? And be straight with me about the cost. If a neat principle saves all of my verdicts only by acquiring six clauses and a special provision for family members, I'd rather hear that a simpler one overturns the urn-brother case or the mystery-holiday case, and which of my verdicts you'd sacrifice and why. I want to know which of the two you'd actually recommend I put in the piece.
reasoning: |-
  Okay, the user is a science writer working on a piece about judgment under uncertainty. They attended a behavioral economics event and got frustrated because "ambiguity aversion" was used inconsistently. To clarify, they listed various personal reactions to ambiguous bets and wants to know if there's a unifying principle or if it's multiple phenomena lumped together.

  First, I need to break down their examples. They mention the classic Ellsberg urn where they prefer known probabilities (red bet) over unknown (black). But then they have cases where they prefer ambiguity, like mystery holidays. Also, stakes matter: for £2 they're indifferent, but for £2000 they avoid ambiguity. Trust plays a role too—preferring their brother's urn over a stranger's. 

  The key here is identifying patterns. The user's reactions vary based on factors like knowledge, control, stakes, and whether the ambiguity is part of the experience. For instance, insurance with known probabilities is preferred, but unquantified flood risk is avoided. Yet, they'll eat at a no-rating restaurant, which seems contradictory. 

  Underlying needs: They want a framework that explains their intuitions without being overly complex. They also need to know if they should present a simplified model in their article or acknowledge the messiness. The doctor example highlights medical decisions where trial data vs. mechanistic plausibility creates conflict.

  The challenge is reconciling aversion in some contexts with seeking ambiguity in others. The user might be hinting that context and personal agency matter. For example, in experiential choices (restaurants, holidays), ambiguity adds value, whereas in financial or health risks, it's aversive. 

  They also want to know if their inconsistency in flood risk (avoid), restaurant (accept), and business investment (accept) can be explained. Here, perceived control and expertise might be factors. They feel they can judge a restaurant or business idea but not flood risk. 

  The doctor case needs a clear answer. Established treatment is less ambiguous, but if the user trusts the mechanism, they might prefer the new one. The principle should guide which to choose and if deviating is inconsistent. 

  The user's deeper need is clarity for their readers. They need to either present a nuanced view or simplify, but they want honesty about trade-offs. If a principle requires too many exceptions, they'd prefer to know which intuitions to override, like trusting family in the urn case.
answer: |-
  Here's a clean, predictive principle based on your intuitions, dissecting "ambiguity aversion" into its core drivers and explaining where your cases fit. It has three core components and three modifiers, generating your verdicts without needing "family clauses" or excessive exceptions:

  **The Core Predictive Principle (The Ambiguity Triad):**

  Your willingness to accept ambiguity depends on three factors:
  1.  **Control/Knowledge Asymmetry:** Do *you* feel you have unique insight, control, or understanding of the ambiguous situation compared to the source offering the bet/choice? (High asymmetry favors acceptance).
  2.  **Stakes vs. Experience Value:** Are the stakes primarily *instrumental* (money, health, security) or *experiential* (novelty, discovery, enjoyment)? High instrumental stakes amplify aversion; high experiential value amplifies seeking.
  3.  **Source Trust:** Do you trust the source *defining the ambiguity* (urn-filler, expert, bookie, insurer) to be competent *and* aligned with your interests? Low trust amplifies aversion.

  **How It Explains Your Cases (The Seams):**

  *   **Classic Urn (Red vs. Black):** Low Control Asymmetry (you know no more than the experimenter), High Instrumental Stakes (pure money bet), Ambiguous Source Trust (experimenter might be tricking you) → **Aversion (Take Red).**
  *   **Red-or-Yellow vs. Black-or-Yellow:** *Feels* like higher Control Asymmetry (you group "known good" red with unknown yellow) and similar stakes/trust → **Acceptance (Take R/Y).** *(This is the classic Ellsberg paradox breakpoint - your grouping creates perceived asymmetry).*
  *   **Definite Split vs. Genuine Unknown Urn:** Identical Control Asymmetry (you know nothing specific), Identical Stakes, Identical Source Trust (experiment context) → **Indifference (Same Price).** *(The "feeling" of difference doesn't override the core factors).*
  *   **Sharp Bookie (Unknown Match) vs. Mate (Known Match):** High Control Asymmetry *with Mate* (your knowledge vs. his odds), High Instrumental Stakes, Higher Source Trust with Mate → **Acceptance (Take Mate's).** *(Primarily Control Asymmetry).*
  *   **"Roughly Fair" Expert Coin vs. Your 101/200 Coin:** High Control Asymmetry (your direct experience vs. vague expert), Instrumental Stakes, Low Trust in vague expert → **Acceptance (Take Yours).** *(Persists even if expert is coy, because your asymmetry/trust perception remains).*
  *   **Stakes (£2 vs. £2000):** Identical Control Asymmetry & Source Trust. Low Stakes = Low Aversion Amplification → **Indifference.** High Stakes = High Aversion Amplification → **Rejection.** *(Pure Stakes Effect).*
  *   **Insurance (Known 1/200 vs. Unknown):** Instrumental Stakes (security), Low Control Asymmetry (you rely on insurer's model), Higher Trust in quantified model → **Aversion (Pay more for known).**
  *   **Stranger's Urn vs. Brother's Urn:** Identical Control Asymmetry & Stakes. High Source Trust with Brother → **Acceptance (Prefer Brother's).** *(Pure Trust Effect).*
  *   **Mystery Holiday/Restaurant/Band:** High *Experiential Value* (novelty, discovery, potential delight) outweighs Ambiguity → **Seeking (Pay for ambiguity).** *(Stakes vs. Experience Value flips).*
  *   **Contradictory Trio:**
      *   *Unquantified Flood Risk:* High Instrumental Stakes (loss), Low Control Asymmetry (you rely on experts), Low Trust in unquantified risk → **Aversion (Reject).**
      *   *No Hygiene Rating Restaurant:* Moderate Instrumental Stakes (food poisoning usually temporary), Potential Experiential Value (discovery), High *Perceived* Control Asymmetry (you judge vibe/freshness) → **Acceptance.**
      *   *Business Idea w/ Unknown Odds:* High Instrumental Stakes *but* Very High Perceived Control Asymmetry (your unique insight/passion/execution) → **Acceptance.** *(The perceived Control Asymmetry overrides the stakes for you).*
  *   **Urn vs. Technology Existence Bet:** Urn: Ambiguity over *known states* (colors). Tech Bet: **Deep Uncertainty** - states/outcomes undefined. Deep Uncertainty is categorically worse → **Stronger Aversion.** *(A distinct category: ambiguity over defined states vs. undefined states).*

  **Verdict on Your Doctor Case:**
  *   **Core Principle Says:** Take the established 70% treatment.
      *   *Control Asymmetry:* Low. You aren't a medical expert; the doctor/mechanism proponent likely has more insight.
      *   *Stakes vs. Experience:* Extremely High Instrumental Stakes (health/life).
      *   *Source Trust:* Higher trust in established trial data (even imperfect) vs. purely theoretical plausibility (which might be wrong or incomplete).
  *   **Are You Inconsistent if You Take the Plausible Mechanism?** Potentially, *unless* you have very high trust in the specific doctor advocating for it *and/or* possess unique personal knowledge about your biology making the established treatment seem particularly unsuitable *for you* (creating Control Asymmetry). Without that, rejecting the 70% data for pure plausibility violates the high-stakes instrumental aversion component.

  **New Case Predictions:**
  1.  **Vacation Souvenir Gamble:** Pay $5 to draw a ball from an urn (30 red, 60 unknown B/Y) for a chance at a $100 souvenir vs. a $1 trinket. You know the stall owner is dodgy.
      *   *Principle Prediction:* **Reject.** Low Stakes *but* High Experiential Value? Ambiguous. Low Source Trust (dodgy owner) + Instrumental Outcome (value of prize) → Aversion likely wins.
  2.  **Investing: Blue Chip Stock vs. Friend's Startup:** Blue Chip has predictable returns. Friend's startup has huge potential but unknown odds. You trust your friend implicitly and know the industry well.
      *   *Principle Prediction:* **Accept (Invest in Startup).** High Instrumental Stakes *but* Very High Source Trust + High Perceived Control Asymmetry (your industry knowledge) → Acceptance.
  3.  **Weather-Dependent Outdoor Wedding vs. Indoor Venue:** Outdoor has higher payoff (beauty) but unknown rain risk. Indoor is guaranteed but less ideal.
      *   *Principle Prediction:* **Highly Context Dependent.** If the couple values novelty/authenticity (Experiential Value) highly, they might Accept ambiguity. If they prioritize guaranteed smooth execution (Instrumental Stakes), they'll exhibit Aversion. Most will show mild Aversion due to high stakes.

  **The Cost & Recommendation:**

  *   **Cost:** The Triad (Control Asymmetry, Stakes/Experience Value, Source Trust) + the Deep Uncertainty distinction is the minimal framework needed to cleanly predict *all* your diverse intuitions without special clauses. It explains aversion, seeking, and indifference. Adding "Family" is redundant (covered by Source Trust).
  *   **Recommendation for Your Piece: Put This Triad In.** It's precise enough to apply to new cases (like the doctor), distinguishes the key psychological drivers (the seams under the "ambiguity aversion" label), and explains real-world inconsistencies (flood risk vs. restaurant). It shows "ambiguity aversion" isn't monolithic; it interacts with trust, perceived knowledge, stakes, and the nature of the payoff.
  *   **What It Overturns (Slightly):** It suggests your initial surprise at paying the same for the "definite split" vs. "genuine unknown" urn was misplaced – the core drivers *were* identical. It also implies that preferring the "coy expert's" coin over your own would *only* happen if you had *zero* trust in yourself (low Control Asymmetry) or immense trust in the expert, which contradicts your intuition.

  **The Takeaway:** Ambiguity isn't judged in a vacuum. We weigh *how much we think we know vs. others*, *what we stand to lose or gain experientially*, and *who's setting the ambiguous terms*. That's the triad generating your "gut reactions."
