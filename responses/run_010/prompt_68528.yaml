prompt: |-
  You're setting the final for a master's seminar on philosophy of history, and you're an expert on the twentieth-century objectivity debate. I want one closed-book essay question, doable in about 75 minutes, that a student can't survive just by narrating the usual arc — Ranke's dictum about showing how it really happened, Carr's historian-and-his-facts picture of objectivity as a directional, self-correcting practice, Hayden White's emplotment thesis in Metahistory.

  The crux I want forced is this. Suppose a student argues the Carr/White clash is only apparent, because White is making a claim about narrative *form* (the choice to shape a sequence of events as tragic rather than comic or satiric) while Carr is making a claim about how evidence constrains the *selection and weighting of content* — so the two never actually collide. The question should make candidates decide whether that separation can be held: does imposing an emplotment change which facts count as significant, and thereby infect exactly the content-level judgements Carr wants to keep objective? And can Carr's own insistence that history is a two-way interaction between historian and facts be read as already conceding ground to White, or does it do independent work that White's account can't touch?

  Think carefully before writing. First give me three or four bullets sketching alternative cruxes you considered and why each would be too easy to bluff through. Then give the final question, a model answer of around 700 words, and a marking scheme out of 25 that seperates a first from a solid 2:1 by naming the specific moves each has to make — plus three mistakes that should lose marks, with a line each on why it's an error rather than just an omission. No bibliography, reading list or citations anywhere: students have nothing in front of them, so the question has to carry all its own setup.
