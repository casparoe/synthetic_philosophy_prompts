answer: |-
  ### Exam Question  
  **Evaluate the following claim: "The apparent conflict between E.H. Carr’s model of historical objectivity (as a self-correcting practice of evidence-based selection) and Hayden White’s emplotment thesis (as the imposition of narrative form on events) dissolves when we recognize that Carr operates at the level of *content* (which facts are significant) while White operates at the level of *form* (how to structure their sequence)." How successfully does this separation hold? In your response, consider whether Carr’s "two-way interaction between historian and facts" concedes ground to White or retains independent force.**  

  ---

  ### Model Answer (700 words)  
  The proposed separation between Carr and White is superficially appealing but ultimately unsustainable. While Carr focuses on how evidence constrains the historian’s selection and weighting of facts, and White on the *a priori* choice of narrative structure (tragic, comic, etc.), these levels are inextricable. Emplotment dictates what counts as a "significant" fact, collapsing the content/form distinction and exposing Carr’s objectivity as contingent on unacknowledged narrative commitments. Carr’s "two-way interaction" does anticipate White’s emphasis on the historian’s agency, but it fails to inoculate his model against White’s relativism because it retains faith in evidence as an objective anchor—a faith White undermines by showing how form precedes and shapes content.  

  White’s core argument in *Metahistory* is that historians *pre-select* an emplotment (e.g., tragedy, satire) before assembling facts. This form determines which events are narratively pivotal. For instance, framing the French Revolution as a tragedy necessitates "facts" like Robespierre’s hubris and the Terror’s inevitability, while a satirical framing might highlight the absurdity of revolutionary slogans versus outcomes. Carr’s model—where objectivity emerges from dialogue between historian and evidence—assumes facts can resist misinterpretation. Yet if White is correct, the "weighting" of facts (Carr’s *content* domain) is subordinated to the needs of the chosen plot. Carr’s historian, sifting facts for significance, is always already guided by an unconscious narrative template. The "directionality" of historical practice, for Carr, is toward better-evidenced interpretations, but White reveals that "better evidence" is defined by coherence with an arbitrary form.  

  Does Carr’s "two-way interaction" concede to White? Partially. Carr rejects Ranke’s naive realism by insisting historians shape facts through questions and context. This mirrors White’s view that history is constructed, not discovered. Yet Carr resists full relativism by claiming facts "interrogate back," correcting errors over time (e.g., disproving the "stab-in-the-back myth" in Weimar Germany). Here, Carr’s model retains independent force: it describes a *social process* of error-correction White ignores. However, this process only "corrects" within an accepted narrative paradigm. White would argue that Carr’s "corrections" merely exchange one emplotted version for another (e.g., replacing a tragic Cold War narrative with a satirical one), without accessing "truth" beyond form. Carr’s objectivity is thus procedural, not ontological—a distinction he obscures.  

  Ultimately, the separation fails because significance *is* narrative. Carr’s claim that historians select facts based on "directionality" toward future understanding presupposes a teleological form (e.g., progress or decline). White exposes this as a trope masquerading as objectivity. Carr’s model survives only as a pragmatic standard for professional consensus, but it cannot defend against White’s meta-critique that all consensus is style-dependent.  

  ---

  ### Marking Scheme (Total: 25)  
  **First-Class (21–25):**  
  - Explicitly refutes the separation thesis by demonstrating *how* emplotment determines content-selection (e.g., "tragedy requires facts of hubris/inevitability").  
  - Pinpoints the tension in Carr: his "interaction" model *describes* subjectivity (conceding to White) but relies on evidence to *limit* it (resisting White).  
  - Argues Carr’s "correction" mechanism is narrative-bound, leaving his objectivity vulnerable.  
  - Distinguishes Carr’s *procedural* objectivity from White’s *ontological* challenge.  

  **Upper Second (2:1) (18–20):**  
  - Recognizes the inseparability of form/content but analyzes Carr and White in parallel without full synthesis.  
  - Notes Carr’s "interaction" anticipates historian’s agency but doesn’t probe how this undermines his objectivity.  
  - Describes White’s relativism but doesn’t show how it invalidates Carr’s "directionality."  
  - Treats "correction" as a Carr-strength without addressing its narrative dependency.  

  **Lower Second/Mid-Tier (15–17):**  
  - Repeats Carr/White positions without engaging the separation thesis.  
  - Asserts the separation holds (or collapses) without textual reasoning.  
  - Misrepresents Carr as a naive realist or White as denying *any* constraints.  

  ---  

  ### Three Critical Mistakes (with Penalties)  
  1. **"Carr believes in objective facts; White denies facts exist."**  
     *Error:* Misreads both. Carr sees facts as *selected* by historians; White accepts "events" exist but denies they dictate *story-forms*. (-3 marks)  

  2. **"White’s emplotment is just bias; Carr solves this with evidence."**  
     *Error:* Reduces White’s formal narrative theory to subjective "bias," ignoring his claim that *all* history is emplotted (not poorly, but inherently). Also misses Carr’s admission that historians shape facts. (-2 marks)  

  3. **"Carr’s two-way interaction makes history subjective, so he agrees with White."**  
     *Error:* Overlooks Carr’s key distinction: subjectivity is *temporary*, corrected by evidence and collective practice. White’s challenge is deeper: "correction" itself is trope-dependent. (-3 marks)  

  ---  
  The question isolates the Carr/White fault line by forcing candidates to confront whether *narrative form constructs the criteria for factual significance*. The model answer rejects the separation, showing Carr’s content-level objectivity is parasitical on unexamined forms—a vulnerability his "interaction" model exposes but cannot resolve.
