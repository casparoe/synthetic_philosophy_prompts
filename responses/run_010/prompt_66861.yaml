prompt: |-
  I'm the commissioning editor for a history documentary strand — four or five hours a year, primetime-ish — and the pitch I get most often is some version of "was it real?" Troy, Arthur, the Exodus, Robin Hood, Atlantis once a quarter. Right now every one of those decisions turns into a shouting match in a room: our advisory historian says nothing before written records is safe and we should only ever make programmes about the story, and the producers say if we won't commit to a war actually happening the audience walks in minute six. I've allready half-committed to one of these for next year and I'd rather have a written procedure I can point at than another argument.

  So: write a decision procedure my development team can run on a "legend or history?" pitch in about an hour, before we spend money on a recce or a talking head. It has to be grounded in what these arguments actually turn on, not generic scepticism. At minimum it needs to handle:

  - how to tell a meaningful silence from a boring one. The Egypt case is the hard version: an enormous administrative culture with lots of surviving records, and no mention of the thing you'd expect. But the procedure needs to say when an absence counts, when it doesn't, and it has to deal with the obvious reply that regimes don't commemorate their own disasters — so there's an expectedness test and a suppression test and they can pull in opposite directions.
  - the gap between event and earliest source, and why the size of the gap isn't the whole story. A short gap doesn't help if the source's genre isn't trying to report anything, and a long gap doesn't kill a claim if the material was carried in a form that resists drift. I want a real discount rule with the reasons for it, plus how to treat a source that names the right people and places but is plainly shaped for a later audience's identity.
  - corroboration in a different medium, and specifically the third-party archive case: Bronze Age Anatolian correspondence that names a city in the Troad and a western power whose names look like the Greek words for Troy and the Achaeans, where the identifications are widely accepted but not nailed down. The procedure should say what such documents can and cannot license — they seem to name places and frictions, never the plot anyone wants them to name.
  - the onion test for layered traditions, where the earliest mention of a figure is centuries later, an earlier near-contemporary writer describes the battle and the enemies but never names him, and then a 12th-century chronicle supplies basically everything audiences know. I want an explicit rule about how to check whether a detail is evidence of an event or evidence of the layer that introduced it.
  - the kernel problem. Almost every one of these pitches has a defensible minimal claim ("something was destroyed here", "a people by this name existed in this region by this date", "some warlord probably won some battles") sitting under an indefensible full claim (the ten-year siege, the twelve battles in order, the mass migration and the drowned army). The procedure has to force the team to write down the exact minimal proposition they'd be committing to on screen, and to say what the show is allowed to assert, what it's allowed to dramatise, and what it's allowed to imply by juxtaposition, which is where these things usually go wrong.
  - the case where the story is false as history but solid as evidence about the people who told it. That's reportable, but only under a frame, and I want the frame spelled out so a compliance editor and a journalist reviewing us can see we weren't smuggling.

  Give me the steps in order, what counts as a sufficient answer to each step, where the procedure kills the pitch outright, where it sends it to the historian because the question is one of standards rather than facts, and — this matters to me — flag every step that is really a judgement call wearing a procedural costume. Then run it on three pitches: the Trojan War as Homer tells it, King Arthur as a real war leader, and the Exodus as the biblical narrative has it. One of those three is going to annoy me; say so plainly rather than hedging, and tell me what the show could legitimately be about instead. Finish with the failure modes: which kind of pitch this procedure systematically over-admits, which it systematically under-admits, and why.

  Format: after each of the three runs, put the outcome on its own line as `Ruling: <greenlight | greenlight-with-frame | no-go>`, and make the very last line of your answer exactly `Verdict: <the one pitch you'd put into production first>`.
reasoning: |-
  Okay, let me tackle this complex request from the commissioning editor. They want a decision procedure for evaluating "legend or history?" documentary pitches, specifically addressing key pain points like meaningful silences in historical records, source reliability gaps, archaeological corroboration, tradition layering, and separating minimal credible claims from inflated narratives. 

  First, I need to structure a step-by-step process that forces concrete answers rather than subjective debates. The procedure must handle:
  - Assessing evidentiary silence (like the Exodus absence in Egyptian records)
  - Evaluating source gaps and genre reliability
  - Interpreting third-party corroboration (like Hittite texts referencing Wilusa/Ahhiyawa)
  - Peeling tradition layers (Arthurian evolution from Nennius to Geoffrey)
  - Defining the "kernel" claim clearly
  - Framing culturally significant false narratives

  For each pitch, I'll apply the same 7-step framework:
  1) Pinpoint the core historical proposition
  2) Map the source timeline and genres
  3) Analyze meaningful silences
  4) Check for independent corroboration 
  5) Dissect the tradition layers
  6) Define the minimal defensible kernel
  7) Determine the framing approach

  The Trojan War case shows how this works: while Homer's epic is layered fiction, Hittite tablets support a kernel of "conflict over Wilusa circa 13th BCE." That's greenlight-with-frame material. Arthur fails at step 4 (no contemporary corroboration) - no-go. Exodus hits multiple failures: Egyptian administrative silence is meaningful, and the minimal kernel ("Semitic population in Egypt") lacks event-specific evidence. 

  Notably, this procedure tends to over-admit Bronze Age topics (where absence of evidence isn't proof) and under-admit orally transmitted traditions. The clearest starter project is Troy - its Wilusa references create a documentary-worthy "grain of truth" narrative when properly framed. Final verdict lines up with that analysis.
answer: |-
  ## Documentary Decision Procedure: Legend vs. History Pitches

  **Purpose:** To objectively evaluate the viability of "legend or history?" pitches *before* significant resource commitment. Forces explicit definition of claims, evidence thresholds, and framing. Aims to replace subjective arguments with structured analysis.

  **Procedure (Run in Order - Approx. 1 Hour):**

  1.  **Define the Core Historical Proposition (CHP):**
      *   *Action:* State the *specific* historical event, figure, or process claimed to be real (e.g., "A major Late Bronze Age conflict centered on a city identified as Troy," NOT "The Trojan War happened as in Homer").
      *   *Sufficient Answer:* A single, concise, falsifiable statement about the past.
      *   *Judgement Call Flag:* Defining the CHP's specificity level is crucial and inherently interpretive.
      *   *Kill Pitch?* If the team cannot define a CHP beyond "This story existed," it's purely literary/cultural history (potentially valid, but frame under Step 7).

  2.  **Map the Source Timeline & Genres:**
      *   *Action:* List the earliest known sources mentioning the CHP or its key elements, their estimated date, genre (e.g., epic poetry, chronicle, administrative record, inscription), stated purpose, and provenance. Note the gap between the purported event date and the earliest source.
      *   *Sufficient Answer:* A clear timeline table/summary identifying the gap and source types.
      *   *Judgement Call Flag:* Assessing a source's *primary* intent (reporting past events vs. myth-making, theology, entertainment, propaganda) is interpretive but essential.
      *   *Send to Historian?* If source dating or genre classification is highly contentious or requires specialist knowledge beyond basic reference works.

  3.  **Assess Meaningful Silence:**
      *   *Action:* Identify relevant contemporary or near-contemporary records/archaeology *where the CHP would reasonably be expected to appear*.
      *   Apply the **Expectedness Test:** Is the silence surprising given the record-keeping culture and the nature of the CHP (e.g., a major conflict *should* appear in Hittite/Egyptian diplomatic archives; a minor raid might not; Pharaohs *did* record defeats).
      *   Apply the **Suppression Test:** Is there credible evidence or strong historical precedent suggesting deliberate erasure? (e.g., Damnatio Memoriae patterns in Rome vs. lack of evidence for suppression in Exodus case).
      *   *Sufficient Answer:* Explicit "Yes/No/Unclear" on Expectedness and Suppression, with brief justification. **Silence is ONLY meaningful if Expectedness is HIGH and Suppression is LOW/UNLIKELY.**
      *   *Judgement Call Flag:* Assessing "reasonableness" of expectation and likelihood of suppression.
      *   *Kill Pitch?* If silence is deemed meaningful (High Expectedness + Low Suppression), the CHP is severely weakened. Proceed only if other evidence is exceptionally strong.

  4.  **Evaluate Corroborating Evidence:**
      *   *Action:* Identify independent evidence (archaeology, contemporary documents from *other* cultures, non-narrative records) supporting the *CHP* (not the full legendary story).
      *   *Third-Party Archive Rule:* Such evidence (e.g., Hittite "Wilusa/Ahhiyawa" texts) can license:
          *   Existence of places/peoples with similar names in plausible locations/timeframes.
          *   Existence of friction/warfare/diplomacy between them.
          *   It **cannot** license specific events, individuals, causes, durations, or outcomes described in the later legend/narrative.
      *   *Sufficient Answer:* List specific corroborating points and explicitly state what they do/don't prove about the CHP.
      *   *Judgement Call Flag:* Assessing the strength of "identification" (e.g., Wilusa=Troy) and independence of sources.
      *   *Send to Historian?* If interpretation of archaeological data (destruction layers, settlement patterns) or contested identification of names/places is central.

  5.  **Perform the Onion Test:**
      *   *Action:* For each key element of the *legendary narrative* (especially those claimed as historical for the CHP), trace its first appearance in the source timeline.
      *   *Rule:* An element is **evidence of the event ONLY if** it appears in the earliest source layer *and* that source's genre/purpose supports reliable transmission of such detail. An element appearing **only in later layers** is primarily evidence of the concerns, creativity, or sources of *that later period*.
      *   *Sufficient Answer:* A table listing key narrative elements vs. their earliest attestation and source genre. Clear statement on which elements potentially reflect the event vs. later tradition.
      *   *Judgement Call Flag:* Determining the "key elements" tied to the CHP and assessing the reliability intent of early sources.
      *   *Kill Pitch?* If the core narrative elements defining the popular understanding of the CHP (e.g., Arthur's knights, Exodus plagues/route) are demonstrably late literary inventions with no early attestation.

  6.  **Define the Minimal Defensible Kernel (MDK):**
      *   *Action:* Based on Steps 1-5, define the simplest, most evidence-supported version of the CHP that *can* be asserted.
      *   *Rules for Presentation:*
          *   **Assert:** Only the MDK itself, backed by the strongest evidence (Step 4, earliest credible parts of Step 2).
          *   **Dramatize:** Only scenarios directly supported by the MDK evidence *or* clearly presented as "based on the later legend".
          *   **Implied by Juxtaposition:** FORBIDDEN for claiming historicity. Juxtaposing MDK evidence with legendary imagery *must* be framed by narration/presentation as exploring the *legend's origins*, not validating the legend.
      *   *Sufficient Answer:* A single, clear MDK statement and a bullet-point list of what can be Asserted, Dramatized (with caveats), and what Juxtaposition tactics are banned.
      *   *Judgement Call Flag:* Defining "minimal" and "defensible" based on the preceding analysis.

  7.  **Determine Framing & Compliance:**
      *   *Action:* Choose the documentary's primary frame:
          *   **Frame A (History):** "We present evidence for the historical core behind the legend." (Requires a strong MDK with tangible evidence).
          *   **Frame B (Legend as Evidence):** "We explore what this enduring story reveals about the societies that believed, adapted, and transmitted it." (For pitches where the CHP/MDK is weak/non-existent, but the story's cultural impact is significant).
      *   *Compliance Note:* For Frame B, narration and visuals must consistently anchor discussion in the *reception and impact* of the story, *not* in searching for its historicity. Avoid phrases like "the real" or "the truth behind."
      *   *Sufficient Answer:* Selection of Frame A or B, with a 1-sentence "elevator pitch" reflecting the frame.
      *   *Kill Pitch?* If the MDK is vanishingly small/non-existent *and* the cultural impact story is deemed too weak/unoriginal for Frame B.

  **Ruling Output:** Based on Step 7 and viability of MDK (Step 6):
  *   `Greenlight`: Strong MDK under Frame A. Can carefully assert/dramatize the kernel.
  *   `Greenlight-with-frame`: Viable only under Frame B (Legend as Evidence). Cannot assert historicity of core narrative.
  *   `No-go`: MDK unsupported or too minimal to be meaningful *and* Frame B pitch too weak.

  ---

  **Procedure Run-Throughs**

  **1. Pitch: The Trojan War as in Homer (10-year siege by united Greeks, Helen, Achilles, Hector, Wooden Horse)**

  *   **Step 1 (CHP):** A major Late Bronze Age conflict resulting in the destruction of a city identified as Hisarlik (Troy VIIa) by a coalition from the Greek mainland.
  *   **Step 2 (Sources):** Earliest: Homeric Epics (Iliad/Odyssey, ~8th cent BCE, Epic Poetry - entertainment, cultural identity). Gap: ~450+ years after destruction of Troy VIIa (~1180 BCE).
  *   **Step 3 (Silence):** **Expectedness HIGH:** Hittite archives (contemporary, detailed diplomacy) exist. **Suppression LOW/UNLIKELY:** Hittites recorded conflicts with "Ahhiyawa" (Achaeans?) over "Wilusa" (Ilios/Troy?). Wilusa appears as sometimes allied, sometimes in conflict. *Silence is NOT meaningful* for a conflict; friction *is* attested, just not Homer's specific war. **Sufficient.**
  *   **Step 4 (Corroboration):** Hittite texts (13th cent BCE) name "Wilusa" (Troy) and "Ahhiyawa" (Achaean Greeks), attest to political/military friction. Archaeology shows Troy VIIa (corresponding period) was destroyed by warfare. **Licenses:** Existence of important city (Troy) and powerful western polity (Ahhiyawa); friction/warfare plausible. **Does NOT license:** Unified Greek coalition, 10-year siege, specific heroes, Helen, Wooden Horse, cause being wife-stealing.
  *   **Step 5 (Onion Test):** *Existence of Conflict/Wilusa:* Possible Hittite hints (early). *Destruction of Troy:* Archaeology (contemporary evidence). *Specific Heroes/Events:* Only in Homer (late, poetic) or later sources. Achilles, Hector, Helen, Wooden Horse are evidence of the 8th-cent+ Greek poetic tradition, not the 13th-cent BCE event.
  *   **Step 6 (MDK):** "A significant Late Bronze Age settlement at Hisarlik (Troy), likely an important regional center, was destroyed by warfare around 1180 BCE. Contemporary records from the Hittite Empire indicate political and military friction between the Hittites, a western Anatolian state called Wilusa (identified with Troy), and a powerful maritime polity called Ahhiyawa (identified with Mycenaean Greeks)." **Assert:** MDK. **Dramatize:** Life in Late Bronze Age Troy/Mycenae; violence of destruction (based on archaeology); *possible* context of Hittite-Ahhiyawa friction (clearly framed as context, not specific event). **Implied Juxtaposition Banned:** Showing ruins while narrating Homer's siege details; implying Hittite texts describe *the* Trojan War plot.
  *   **Step 7 (Frame):** Frame A (History) is viable *for the MDK*. Frame B (Legend) is viable for Homer's story. **Choice:** Frame A is possible for the kernel war.
  *   `Ruling: Greenlight` (For a show focused on the MDK: Bronze Age Troy, its importance, its destruction, and the plausible context of Aegean-Anatolian friction. Homer is the *end point*, not the starting proof).

  **2. Pitch: King Arthur as a Real War Leader (Post-Roman Britain, led Britons against Saxons, won 12 battles)**

  *   **Step 1 (CHP):** A prominent British military leader active in the late 5th/early 6th century CE who achieved significant victories against Anglo-Saxon invaders.
  *   **Step 2 (Sources):** Earliest: *De Excidio Britanniae* by Gildas (~540 CE, Sermon - moralizing, not history). Mentions Ambrosius Aurelianus, *not* Arthur. *Historia Brittonum* (Nennius, ~830 CE, Pseudo-History - nationalistic). First mentions Arthur, lists 12 battles. Gap: ~300+ years.
  *   **Step 3 (Silence):** **Expectedness MEDIUM/HIGH:** Gildas writes within living memory of the events, lamenting Saxon victories and praising Ambrosius. He mentions no "Arthur" figure. **Suppression LOW/UNLIKELY:** No known reason Gildas would omit a paramount hero. *Silence is MEANINGFUL.* **Sufficient.**
  *   **Step 4 (Corroboration):** Archaeology shows Saxon expansion/migration, warfare, and British resistance/settlement patterns. No contemporary inscriptions, chronicles, or documents name Arthur or corroborate Nennius's battle list. **Licenses:** Period of conflict, cultural disruption. **Does NOT license:** Existence of Arthur, specific battles, role as "leader of Britons."
  *   **Step 5 (Onion Test):** *Period of Warfare:* Gildas/Archaeology (earliest/contemporary). *Name "Arthur":* First in Nennius (late). *12 Battles/Badon:* First in Nennius (late). *Camelot, Knights, Merlin, etc.:* Much later (Geoffrey of Monmouth, 12th cent+). Arthur and his battles are evidence of 9th-cent+ Welsh/Brittonic tradition, not 5th/6th-cent history. Ambrosius (in Gildas) might be a kernel figure.
  *   **Step 6 (MDK):** "The period following Roman withdrawal from Britain (5th-6th centuries CE) was marked by significant warfare and cultural change, involving Brittonic populations and incoming Anglo-Saxon groups. Some Brittonic leaders achieved notable military successes against the Saxons." **Assert:** MDK. **Dramatize:** Post-Roman British life; Saxon migration/raids; generic warfare. **Implied Juxtaposition Banned:** Linking sites like Cadbury Castle ("Camelot") or Badon Hill directly to Arthur without explicit "legend says" framing; using Arthurian imagery to represent historical 5th-cent warfare.
  *   **Step 7 (Frame):** Frame A (History) for the CHP ("Arthur the leader") is **not viable** (silence meaningful, no corroboration, late sources). Frame B (Legend) is highly viable for the Arthurian mythos. **Choice:** Only Frame B is viable for a show *about Arthur*.
  *   `Ruling: Greenlight-with-frame` (Frame B: The *Legend* of King Arthur - its origins in early medieval Wales/Britain, its development through Geoffrey of Monmouth, Chrétien de Troyes, Malory, and its enduring cultural power. Cannot assert a historical Arthur).

  **3. Pitch: The Exodus as the Biblical Narrative (Israelite slavery, Moses, 10 plagues, mass migration, Red Sea crossing, Sinai covenant)**

  *   **Step 1 (CHP):** The mass emigration of a distinct Israelite population from slavery in Egypt, led by Moses, involving divine plagues and a dramatic escape across a body of water, followed by a covenant at Sinai, in the Late Bronze Age (conventionally dated ~13th cent BCE).
  *   **Step 2 (Sources):** Earliest: Biblical texts (Exodus, Numbers, Deuteronomy - final forms ~6th-5th cent BCE, Theological History - religious identity, covenant theology). Gap: ~600-700+ years after purported event.
  *   **Step 3 (Silence):** **Expectedness VERY HIGH:** New Kingdom Egypt (especially 19th Dynasty, Ramesses II era) has extensive administrative, military, monumental, and literary records. They meticulously recorded foreign peoples (as workers, prisoners, mercenaries, enemies), major natural disasters, the loss of a slave workforce, and military defeats. **Suppression TEST:** While Pharaohs didn't record defeats *in battle* prominently, the scale of the Exodus narrative (loss of workforce, national disaster via plagues) would be impossible to fully suppress in *all* record types (administrative lists, economic texts, private tombs, literary laments). No evidence of such suppression exists; records are abundant and detailed for this period. *Silence is HIGHLY MEANINGFUL.* **Sufficient.**
  *   **Step 4 (Corroboration):** Archaeology in Sinai/Negev shows no evidence of a large population (600K+ men plus families = millions) traversing/wandering for 40 years in the LBA. Egyptian records mention "Asiatics" (`Apiru/Habiru) as workers/slaves/soldiers/raiders, but never as a distinct "Israelite" group enslaved *en masse* or escaping *en masse*. No evidence of the plagues or the destruction of Pharaoh's army. **Licenses:** Presence of Semitic-speaking peoples (`Apiru) in Egypt; friction between Egyptians and Semitic groups. **Does NOT license:** Mass slavery of a distinct "Israelite" group, Moses, Plagues, Mass Exodus, Red Sea event, Sinai covenant event.
  *   **Step 5 (Onion Test):** *Presence of Semitics in Egypt:* Egyptian records (contemporary - evidence of event). *Moses, Plagues, Exodus, Sinai:* Only in Biblical text (late, theological). These are evidence of the theological and identity-forming needs of the Israelites in the 1st Millennium BCE, not LBA events. Details likely draw on older motifs (Mesopotamian flood, Canaanite myths) and experiences (memories of expulsion of Hyksos?).
  *   **Step 6 (MDK):** "Semitic-speaking populations (`Apiru/Habiru) were present in Egypt during the Late Bronze Age, sometimes in servile or dependent roles, and sometimes causing friction. Memories or traditions of these groups, potentially combined with other cultural memories (e.g., the Hyksos expulsion centuries earlier), likely contributed to the formation of the Exodus narrative centuries later." **Assert:** MDK. **Dramatize:** Life of `Apiru in Egypt; general Egyptian culture; *later* development of the story. **Implied Juxtaposition Banned:** Showing `Apiru workers while narrating Moses' story; using imagery of Sinai while discussing the narrative's origin; implying a historical basis for Plagues/Red Sea.
  *   **Step 7 (Frame):** Frame A (History) for the Biblical Exodus CHP is **not viable** (overwhelming meaningful silence, lack of corroboration, late theological source). Frame B (Legend) is highly viable for the Exodus *story* as foundational myth. **Choice:** Only Frame B is viable.
  *   `Ruling: Greenlight-with-frame` (Frame B: The *Power of the Exodus Story* - its theological meaning for ancient Israel and Judaism, its role in forming identity, its adaptation over time, and its enduring cultural resonance. Cannot present the Exodus narrative as history). ***(This is likely the one that annoys you, given its frequency and audience expectations)***

  ---

  **Failure Modes:**

  *   **Systematically Over-Admits:** Pitches where the **MDK is very minimal but tangible** (e.g., "a city was destroyed," "a people existed," "there was some conflict"), *especially* in periods/scenarios where **meaningful silence is hard to establish** (e.g., poorly documented periods, non-literate societies). The procedure emphasizes the *possibility* of a minimal kernel backed by any plausible scrap of evidence (like Troy's destruction + Hittite friction), potentially greenlighting shows where the "history" hook is very thin compared to the legendary superstructure audiences expect. (Example: A defensible show about Mycenaean warfare and Troy VIIa's destruction, even if audiences crave Achilles).
  *   **Systematically Under-Admits:**
      1.  Pitches relying **primarily on oral tradition** deemed resistant to drift (e.g., deep-time Indigenous histories). The procedure heavily weights *documentary* evidence and archaeological correlation. If oral tradition is the main carrier and the MDK lacks strong material evidence, it will likely be Frame B only.
      2.  Pitches where **meaningful silence is easily established** against a large, well-documented state (e.g., Exodus vs. New Kingdom Egypt). The procedure will correctly flag this as a major problem, often forcing only a Frame B approach, frustrating those hoping for a historical Exodus.
      3.  Pitches involving **highly contested but plausible identifications** lacking a definitive "smoking gun," where the historian's threshold for acceptance might be lower than the procedure's strict "nailed down" requirement for corroboration (Step 4). This might exclude nuanced but credible historical arguments.

  `Verdict: The Trojan War pitch` (Focused on the Late Bronze Age context, archaeology of Troy VIIa, and Hittite-Ahhiyawa friction as the MDK). It offers the strongest combination of: a tangible MDK ("destruction + friction"), contemporary corroboration (archaeology + Hittite texts) outweighing the silence issue, and a clear path to an engaging Frame A documentary about real Bronze Age geopolitics and warfare that audiences will readily connect to the Homeric legend.
