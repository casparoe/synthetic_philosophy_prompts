answer: |-
  ## Four Movements in the Listening Dark

  The deep stone turning, turning in its bed,
  A slow bone rolling where no light is shed,
  A pressure building from the planet’s core,
  A sigh too vast for shores, a ceaseless roar
  That drags the roots of mountains through the night,
  A constant pull, the absence and the might
  That holds the turning, turning in its bed.

  Then sap ascends, a green and tangled thread,
  A murmur rises where the thick leaves spread,
  A rustle, flutter, pulse against the air –
  A thousand breaths, a life beyond compare
  To that deep turning – branching, weaving, warm,
  Escaping stillness, taking fleeting form
  From murmur rising where the thick leaves spread.

  A single thought, a cry both sharp and clear,
  Defies the weight, forgets the rooted fear,
  Leaps over chasms where the echoes sleep,
  Finds no return, makes promises it cannot keep,
  Seeks resolution, trembles on the brink,
  Then falls away, a momentary link
  To something lost... The deep stone turning.

  Not the shape of waves but the weight of water.
  Not the grief for him but the ache thereafter.
  Not the joy of fields but the lift of sun.
  Heard, not remembered; felt, and not undone.
  This is the substance, shorn of mask or guise,
  The constant striving mirrored in your eyes.
  This is what you are, and yet it leaves you nowhere.
  The sound arrives, and finds you standing there.

  ---

  **Note:** The first stanza enacts the fundamental bass through heavy monosyllables, slow syntax, constant repetition ("turning"), and a single rhyme ("bed/shed/core/roar/night/might"). The second loosens this, introducing varied verbs ("ascends/rises"), softer images ("sap," "leaves"), and slant rhyme ("thread/spread/air/compare/warm/form/spread"). The third stanza abandons rhyme entirely, uses shorter lines, fragmented phrases, and enjambment for the melody's freedom, ending abruptly on the first word. The fourth stanza opens on new ground ("Not the shape...") and holds the paradox of identification ("This is what you are") and release ("leaves you nowhere") in unresolved tension using concrete contrasts ("weight of water" vs. "shape of waves").
