  **Verdict Nuance**:  
  - For *this specific incident*, Marcus wins (policy was root cause).  
  - For *causal metaphysics*, Dana has a point but misapplies physics to artifacts.  

  **Conclusion**: Engineers need Marcus’s view—architectural patterns are causal because they let us prevent the *next* outage. Dana’s reductionism risks missing systemic flaws.
