  First, I need to map the philosophical terrain. The puzzle lies in how unenforceable, arbitrary practices generate moral obligations without collapsing into either pure coordination problems or full moral principles. Key tensions include: obligation without consent (tourist in queue), normativity of dead conventions (jaywalking), and unjust conventions (tipping) where moral evaluation can't override convention entirely.

  For the desiderata, I'll consider the user's five test cases as mandatory stress tests. The visitor case requires explaining obligation without participation; dead convention needs threshold criteria; exploitative convention demands injustice-handling without redundancy; shifting convention tests cultural adaptation; asymmetric convention examines fairness. Each must be addressed distinctly.

  The conceptual distinctions they mention are crucial: social pressure vs moral obligation, violation vs wronging, etc. I'll treat these as non-negotiable separations any theory must maintain. Particularly important is preserving the unique space conventions occupy between coordination and morality.

  For structure, I anticipate tension between two desiderata: obligation without endorsement (tourist) and non-exploitation (tipping). A threshold clause might resolve dead conventions but could undermine the tipping case. The most excluding criterion will likely be "non-consensual obligation" since it eliminates expectation-based theories.

  When evaluating their three sketched views:
  - Salience excels at coordination but fails asymmetric burdens
  - Expectation handles reliance but can't explain tourist obligations
  - Membership captures community but struggles with dead conventions

  The deliverables need precise wording: each desideratum in one sentence, concrete motivation, negotiability flag. Table format works for clarity but cases require prose. Word count demands concision - I'll aim for 12 desiderata covering all test cases and distinctions.

  Finally for the "mischaracterization" check: their threshold question for dead conventions is valid but risks overgeneralization; the tourist/endorsement tension is correctly identified. The asymmetric convention case properly highlights fairness without collapse.
answer: |-
  ### Brainstorming the Puzzling Territory  
  The core puzzle lies in how *arbitrary, harm-absent conventions* generate moral obligations that feel distinct from both pragmatic coordination and deep moral wrongs. Ordinary intuitions clash: we condemn queue-jumping as "unfair" yet struggle to identify victims; we feel obligated to tip in exploitative systems but resent it as complicity; we demand tourists respect local norms while excusing ourselves when those norms decay. This tension between convention as *social glue* (creating obligations through participation) versus *external imposition* (binding even non-consenting outsiders) is where theories fracture.  

  ---

  ### Desiderata for a Theory of Conventional Normativity  
  *(Non-negotiable = N; Camp-specific = C)*  

  | Desideratum                                                                 | Motivating Case/Consideration                                                                                                                                | Status     |  
  |-----------------------------------------------------------------------------|--------------------------------------------------------------------------------------------------------------------------------------------------------------|------------|  
  | 1.  **Must explain obligations absent consent or participation.**           | *The Visitor:* A tourist who unknowingly violates a queue norm wrongs others despite no agreement to participate; the obligation arises from presence alone. | N          |  
  | 2.  **Must distinguish genuine obligation from mere social pressure.**      | Jaywalking in a city where it’s universal: feeling "rude" waiting at a red light ≠ moral duty if no one expects compliance. Moral weight requires more.      | N          |  
  | 3.  **Must not require harm to identifiable victims.**                      | Standing too close in a queue causes discomfort but no measurable harm; yet violating spatial norms feels wrong. Theories must capture this.                  | N          |  
  | 4.  **Must account for convention-dependent expectations.**                 | *Shifting Convention:* After moving, your old queue distance now violates local norms; obligation tracks *current* expectations, not your intent or past habits. | N          |  
  | 5.  **Must accommodate conventions with variable compliance thresholds.**   | *Dead Convention:* If 90% jaywalk, waiting at the light frustrates others; if 10% do, it doesn’t. Obligation depends on *actual* (not ideal) practice vitality. | N          |  
  | 6.  **Must explain why conventions bind even when arbitrary.**              | Driving on left/right: no intrinsic value, but violation is catastrophic. Salience solves coordination; obligation stems from the *need* for a solution.     | N          |  
  | 7.  **Must not collapse convention into general morality (e.g., fairness).**| *Exploitative Convention:* Tipping’s injustice shouldn’t automatically void its conventional force; else convention adds nothing to moral analysis.         | N          |  
  | 8.  **Must handle asymmetric burdens without assuming fairness.**           | *Asymmetric Convention:* Women expected to smile constantly bear heavier costs. The theory must flag this *within* conventional logic, not via external fairness. | C (Egalitarian) |  
  | 9.  **Must separate "being subject to" vs. "participating in" a practice.** | A hermit using a public path must follow trail-marking conventions (subject) but needn’t bring dishes to potlucks (non-participant).                        | N          |  
  | 10. **Must ground wronging in convention-violation, not just expectation-defeat.** | Holding a lift door: failing to do so wrongs others *because* it violates a shared convention, not merely because someone expected it.                  | C (Communitarian) |  
  | 11. **Must deny force to conventions requiring complicity in injustice.**   | *Exploitative Convention:* Tipping *as wage-supplement* lacks moral force because it perpetuates structural harm; mere convention can’t sanctify this.     | C (Critical) |  
  | 12. **Must distinguish conventions from moral rules in their reason-giving.** | Jaywalking on empty street: the reason "it’s the rule" feels weaker than "don’t steal"; theories must explain this gradient without denying all force.  | N          |  

  **Camp-Specific Notes:**  
  - Desideratum 8 (asymmetric burdens) is often a *prejudice* of egalitarian theories – others argue fairness is external to convention.  
  - Desideratum 10 (wronging via convention) is a *prejudice* of communitarian views – individualists see only expectation-defeat.  
  - Desideratum 11 (injustice voiding force) is a *prejudice* of critical theories – positivists insist convention persists independently.  

  ---

  ### Pressures & Mischaracterizations  
  - **Visitor:** Correctly tests obligation without consent. *Not mischaracterized*.  
  - **Dead Convention:** Correct on threshold vitality. *But* you imply "binding" requires "alive" – some theories argue dormant conventions retain *pro tanto* force (e.g., if 10% still comply).  
  - **Exploitative Convention:** Correct that injustice alone can’t do all the work. *Not mischaracterized*.  
  - **Shifting Convention:** Correct – obligation tracks actual convention, not perception. *Not mischaracterized*.  
  - **Asymmetric Convention:** Correct – fairness must be integrated, not collapsed. *Not mischaracterized*.  

  **Refusing Collapsed Distinctions:** All distinctions are real except:  
  - "Arbitrary but salient" (road sides) vs. "arbitrary and uncoordinated" (potluck dishes) *is not fundamental*. Both rely on salience for coordination; the latter just has lower stakes.  

  ---

  ### Structural Analysis  
  - **Tension 1:** Obligation without endorsement (Desideratum 1) *vs.* rejecting exploitative conventions (Desideratum 11). If mere presence creates obligation (Visitor), why not in tipping? *Your suspicion is correct*: theories prioritizing "participation" (1) struggle with injustice (11).  
  - **Tension 2:** Threshold compliance (Desideratum 5) *vs.* exploitative conventions (Desideratum 11). If a tipping norm is *vital* (high compliance), does it bind? *Yes, your collision is real*: threshold-based views may obligate compliance in unjust systems.  
  - **Most Excluding Desideratum:** **Desideratum 1 (non-consensual obligation)**. It eliminates expectation-based views (which require reliance) and strict consent theories.  

  ---

  ### Scoring the Three Views  

  | View          | Satisfied Desiderata                           | Clearest Failure                        | Repairable? |  
  |---------------|------------------------------------------------|-----------------------------------------|-------------|  
  | **1. Salience** | 6 (arbitrariness), 9 (subject/participant), 12 (reason-gradient) | Fails **8 (asymmetric burdens)**: If a convention burdens women more but solves coordination, salience alone can’t critique it. | No – asymmetry isn’t a coordination failure. |  
  | **2. Expectation** | 4 (current expectations), 7 (no collapse), 12 (reason-gradient) | Fails **1 (non-consensual obligation)**: The tourist violates no *specific* person’s reliance; expectations may not yet exist. | Possibly – by broadening "reliance" to systemic expectations, but this risks circularity. |  
  | **3. Membership** | 1 (non-consensual), 10 (wronging via convention), 11 (injustice) | Fails **5 (compliance threshold)**: If a convention is dead (low compliance), is there still a "community" to stand in relation to? | Yes – by tying membership to *actual* practice-sustainers, not abstract community. |  

  **View Distinctness:** All are distinct. Salience focuses on *function*, Expectation on *psychological states*, Membership on *relational status*.  

