  Hmm, the user is a commissioning editor for a history strand at a public-service broadcaster. They need a decision procedure that their assistant producer can use to evaluate pitches quickly—under 30 minutes—without humanities training. The procedure must be fair, auditable, and address issues flagged in audits: declining non-academic filmmakers and claims about regions with thin scholarship at unjustifiable rates. 

  The user wants a clear step-by-step process with specific questions, each with pass/fail/insufficient conditions. They also want to know how philosophical demarcation criteria (like falsifiability or engagement with anomalies) translate into practical tests. Plus, they need failure modes identified: where the procedure might over-block legitimate minority views or under-block pseudohistory dressed in academic language. 

  Then, they want the procedure applied to four test pitches. For pitch (d)—about transoceanic influence without artifact evidence—they anticipate disliking the outcome but want honesty. Finally, they ask what the procedure *can't* handle and what audits should measure to detect bias. 

  Okay, breaking this down. First, the procedure must be bulletproof for non-specialists. That means blunt operational tests—no nuance. Philosophy of science concepts like falsifiability or anomaly engagement need simplifying: e.g., "Does the pitch say what evidence would disprove the claim?" or "Does it dismiss counter-evidence as conspiracy?" But some distinctions won’t survive. For example, Lakatos' "research programmes" are too fuzzy; instead, I’ll ask if the claim rejects standard dating methods without justification. 

  Failure modes: Over-blocking could happen with emerging fields (like certain archaeogenetic hypotheses) where credentialed experts dissent but consensus is thin. The procedure might flag them as "insufficient institutional scholarship." Under-blocking might occur with "sciency" rhetoric—e.g., a pitch citing predatory journals or misrepresenting peer review. The audit could track decline rates against claimant credentials (academic/non-academic) and regional scholarship density, but must also sample declined pitches for false negatives/positives. 

  Now, applying to the pitches: 
  - (a) Atlantis as reception history: Passes easily. No endorsement, just cultural impact. 
  - (b) Fomenko: Hard fail. Rejects radiocarbon/dendro without evidence, invokes conspiracy. 
  - (c) Younger Dryas impact: Tricky. Published but contested. Procedure refers it up—remit/taste call. 
  - (d) Transoceanic build: Fail. No artifact evidence, dismisses local capacity. But salvageable as a "mystery" or local achievement film with the same footage. 

  What the procedure can’t handle: Disputes where evidence is robust but interpretation splits (e.g., Clovis-first vs. pre-Clovis). Audits should measure declines by claim type (methodological vs. evidential) and track reformulation outcomes to spot credential bias. 

  For (d), the user won’t like declining a signed deal with top talent, but the procedure forces it. The fix isn’t a disclaimer card; it’s reframing as local innovation or engineering study. 

  Final note: The procedure is a sieve, not a judge. It filters obvious pseudohistory but can’t replace editorial judgment on edge cases. Audits should check what gets referred up—if only "safe" controversies pass, bias is creeping in.
answer: |-
  Below is a decision procedure designed for speed, auditability, and fairness, grounded in operationalizable philosophy-of-science principles. It prioritizes **testable evidentiary standards** over institutional credentials while acknowledging their overlap. The assistant producer (AP) can execute it in 30 minutes using only the pitch document and basic fact-checking (e.g., quick journal database searches).

  ---

  ### **Decision Procedure: Pseudohistory Screening for History Strand**
  **Objective:** Decline *only* claims that cannot meet minimal standards of historical/epistemological rigor. Audit trail focuses on **evidentiary failures**, not claimant status.

  #### **Questions in Order**  
  *(Terminology: "Core Claim" = the novel, contested historical assertion central to the pitch)*

  1. **Does the core claim reject established dating methods (e.g., radiocarbon, dendrochronology, stratigraphy) without providing validated alternatives?**  
     - *Pass*: Accepts standard dating or uses peer-reviewed alternatives (e.g., OSL for specific contexts).  
     - *Fail*: Rejects standard methods wholesale (e.g., "all radiocarbon is corrupted") without reproducible alternatives.  
     - *Terminate*: **Outright decline**. (Demarcation: Rejecting methodology essential to consensus without justification is unscientific [Lakatos]).  

  2. **Does the pitch identify specific, testable evidence *against* the core claim?**  
     - *Pass*: Explicitly states what evidence would falsify it (e.g., "If pre-Columbian Old World artifacts are absent in controlled digs, this fails").  
     - *Fail*: Claims are unfalsifiable (e.g., "Absence of evidence is evidence of conspiracy").  
     - *Insufficient*: Vague/nonexistent falsification criteria.  
     - *Terminate if Fail*: **Outright decline**. (Demarcation: Falsifiability [Popper] as a minimum standard).  

  3. **Does the pitch engage with the strongest counter-evidence?**  
     - *Pass*: Addresses major counter-arguments (e.g., cites genetic studies contradicting transoceanic contact) with substantive rebuttals.  
     - *Fail*: Dismisses counter-evidence as error/fraud without engagement.  
     - *Insufficient*: Ignores counter-evidence or cites only fringe sources.  
     - *Terminate if Fail*: **Outright decline**. (Demarcation: Avoids "immunizing stratagems" [Popper]).  

  4. **Is the core claim supported by evidence accessible to specialists?**  
     - *Pass*: Evidence is published, archived, or replicable (e.g., peer-reviewed data, excavation reports).  
     - *Fail*: Relies on inaccessible/secret evidence (e.g., "private collections," "destroyed manuscripts").  
     - *Insufficient*: Sources unclear.  
     - *Terminate if Fail*: **Outright decline**. (Demarcation: Testability requires accessible evidence [Kitcher]).  

  5. **Does the core claim depend on dismissing expertise?**  
     - *Pass*: Engages specialist consensus critically (e.g., "Smith (2020) argues X, but new data suggests Y").  
     - *Fail*: Asserts experts are uniformly biased/ignorant (e.g., "Academics suppress the truth").  
     - *Terminate if Fail*: **Outright decline**. (Demarcation: "Denial of expertise" as pseudoscience marker [McIntyre]).  

  6. **Is the claim presented as settled fact despite thin institutional scholarship?**  
     - *Pass*: Acknowledges scholarly debate/uncertainty in regions with thin scholarship.  
     - *Fail*: Presents speculative claims as definitive in understudied regions (e.g., "This *proves* civilization X built Y").  
     - *Terminate if Insufficient/Fail*: **"Decline as pitched, commissionable if reformulated."**  
       - *Required reformulation*: Reframe as investigation/mystery ("Who built this? New clues emerge...") or limit scope to local context.  

  7. **Does the pitch use peer-reviewed research supporting the core claim?**  
     - *Pass*: Cites relevant peer-reviewed work in related fields.  
     - *Insufficient*: Only non-peer-reviewed or predatory journal sources.  
     - *Terminate*: **Refer to Commissioner**. (Not a decline; remit/taste judgment for minority views with academic backing).  

  ---

  ### **Surviving Demarcation Criteria & Adaptations**  
  - **Retained**:  
    - *Falsifiability* (Q2): Directly testable via pitch language.  
    - *Evidence accessibility* (Q4): Requires citable, verifiable sources.  
    - *Anomaly engagement* (Q3): Forces confrontation with counter-evidence.  
  - **Blunted/Dropped**:  
    - *Research programmes* (Lakatos): Too complex; simplified to Q3 (anomaly engagement).  
    - *Paradigm shifts* (Kuhn): Not decidable in 30 mins; handled via Q7 (peer-review proxy).  
    - *Methodological naturalism*: Assumed; pseudohistory often invokes "lost super-science" (addressed in Q1/Q4).  

  ---

  ### **Failure Modes**  
  - **Over-blocking (false declines)**:  
    - Likely in nascent fields with thin scholarship (e.g., pre-Columbian Oceania) or emerging theories (e.g., Younger Dryas impact *before* 2007). Q6 flags this but allows reformulation.  
    - *Audit detection*: Track declines by region/era. High reformulation requests in understudied areas signal over-blocking.  
  - **Under-blocking (false approvals)**:  
    - Risks from "sciency" language (e.g., citing predatory journals or misrepresenting peer review). Q7 catches this via source verification.  
    - *Audit detection*: Sample passed pitches for later academic controversies. High controversy rates indicate under-blocking.  
  - **Tracking Credentials vs. Evidence**:  
    - Audit should compare decline rates for:  
      - Academic vs. non-academic claimants *making identical claims*.  
      - Regions with robust vs. thin scholarship *on comparable claims*.  
    - A decline rate disparity indicates institutional bias; parity suggests evidentiary focus.  

  ---

  ### **Application to Pitches**  
  **(a) Atlantis as reception history**  
  - Q1-5: N/A (no core claim about Atlantis’s reality).  
  - Q6: Pass (no assertion of fact).  
  - Q7: Pass (uses academic sources on reception).  
  - **Result**: Commissionable.  

  **(b) Fomenko’s New Chronology**  
  - Q1: **Fail** (rejects dendrochronology/radiocarbon; offers no validated alternative).  
  - **Result**: Outright decline at Q1.  

  **(c) Younger Dryas Impact Hypothesis**  
  - Q1: Pass (uses standard methods like sediment analysis).  
  - Q2: Pass (e.g., "absence of nanodiamonds in layer X falsifies").  
  - Q3: Pass (engages criticisms from paleoecology/archaeology).  
  - Q4: Pass (published in *PNAS*, *Science*).  
  - Q5: Pass (does not dismiss experts).  
  - Q6: Pass (acknowledges controversy).  
  - Q7: **Insufficient** → **Refer to Commissioner**. (Legitimate minority view; remit/taste call on platforming contested science in history strand).  

  **(d) Transoceanic Civilization Built Monument**  
  - Q1: Pass (uses standard archaeology).  
  - Q2: **Fail** (e.g., "no Old World artifacts? They must have disintegrated" = unfalsifiable).  
  - Q3: **Fail** (dismisses local capacity: "natives couldn’t engineer this").  
  - **Result**: Outright decline at Q2/Q3.  
  - **What the Procedure Licenses**:  
    - *Legitimate version*: "How did [local culture] achieve this?" (engineering focus, local agency).  
    - *Requires change*: Remove transoceanic claim entirely; frame as local innovation. A "contested" card is insufficient—the core claim fails evidentiary tests.  

  ---

  ### **Limitations & Audit Metrics**  
  **What the Procedure Cannot Settle**:  
  - Aesthetic/presentation quality.  
  - "Worthiness" of legitimate academic debates (e.g., Clovis-first vs. pre-Clovis).  
  - Sufficiency of evidence for *credible* minority views (Q7 referral).  

  **Audit Metrics to Detect Bias**:  
  1. **Decline/Reformulation Rates**: By geographic region & era (identify over-blocking in understudied areas).  
  2. **Claimant Credential Correlation**: Track if non-academics proposing *identical claims* to academics are declined more often.  
  3. **Reformulation Success Rate**: How many reformulated pitches are commissioned? Low rates suggest procedural rigidity.  
  4. **Referral Outcomes**: If 90% of Q7 referrals are declined, the AP is avoiding judgment calls.  

  This procedure prioritizes **methodological integrity** over institutional gatekeeping while ensuring pseudohistory is blocked on evidentiary grounds. It shifts audit focus from *who* makes claims to *how* claims are supported—aligning with public-service values of rigor and fairness.  

  ---  
  *Procedure runtime: 25-30 mins (based on 5 mins/question + doc review).*
