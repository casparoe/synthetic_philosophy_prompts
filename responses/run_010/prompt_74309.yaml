  2) **Debt Transference Ecology**: Consequences flow through relational networks. Debts can migrate (landlord's kids), pool collectively (flood), or attach to proxies (user helping strangers might indirectly help their victim's network). 

  3) **Soul-Stamina Accounting**: Suffering is assigned based on capacity to bear it. The food kitchen woman "sturdy enough" to handle dementia fits perfectly, while the user's current happiness might mean they're not yet strong enough for their reckoning.

  Applying to user: 
  - Framework 1: User's cruelty was high-intent, so negative score remains despite later good deeds. Prediction: Major pending consequence. 
  - Framework 2: Anonymous repairs might ripple toward victim. Prediction: Debt partially cleared. 
  - Framework 3: Current happiness suggests user isn't "soul-strong" enough for punishment. Prediction: Delayed until crisis makes them resilient.

  I suspect R uses Framework 2 (Debt Transference) because it best explains the landlord's "downstream" consequence and the collective flood. Also, meditation groups often emphasize interconnectedness. 

  Test case to differentiate frameworks: "A nurse who intentionally harms a patient but saves 10 others accidentally during the same shift." 
