  - Questions separate two axes:  
    - **Axis 1 (What the conceivability premise establishes):** Nothing (A), Triviality about conceiving (B), Real constraint on existence (C).  
    - **Axis 2 (What makes unobserved things true):** Nothing (I), Independent reality (II), God/possibility of perception (III).  
  - **Grid** maps answer patterns to positions, flags incoherent/unattractive cells, and identifies indistinguishable pairs.  
  - **Tie-breaker** (Question 11) resolves the God-vs.-possibility ambiguity.  

  ---

  ### **The Sorting Instrument**  
  Answer each question by choosing **(a)**, **(b)**, or **(c)**. Be honest—your intuition matters!  

  1. **A table in a room locked for a century (no people, cameras, or sensors inside). During that time, the table:**  
     (a) Exists fully, just like a table in this room.  
     (b) Exists, but only because someone *could* perceive it (e.g., by unlocking the room).  
     (c) Does not exist—without anyone to see or measure it, it vanishes.  

  2. **The far side of the moon before any probe photographed it:**  
     (a) Existed independently, with craters and rocks like the near side.  
     (b) Existed, but only because it was *possible* to observe it (e.g., with future technology).  
     (c) Did not exist—there were no eyes or instruments to register it.  

  3. **A fossil of a creature that died before any minds (human/animal) existed. When it was alive:**  
     (a) It existed independently, eating and breathing like animals today.  
     (b) It existed, but only because we *can* know about it now (e.g., through the fossil).  
     (c) It did not exist—no mind was there to witness it.  

  4. **Your childhood at a moment no one remembers (you, others, or records):**  
     (a) Happened independently, whether recalled or not.  
     (b) Happened, but only because it *could* have been recorded (e.g., by a hypothetical camera).  
     (c) Did not happen—it’s lost forever without a witness.  

  5. **Another person’s pain right now (you have no access to their body or words):**  
     (a) Is real independently—they feel it even if hidden.  
     (b) Is real, but only because you *could* learn about it (e.g., if they spoke).  
     (c) Is not real—you aren’t sensing it, so it might as well be absent.  

  6. **The number seventeen (e.g., as in 17 apples):**  
     (a) Exists independently—it’s a fact, like gravity, regardless of minds.  
     (b) Exists, but only because minds *can* use it (e.g., in counting).  
     (c) Exists only when someone thinks about it—otherwise, it’s nothing.  

  7. **Try to conceive of a tree in a forest with no one around (no humans, animals, or God):**  
     (a) Easy—I picture it standing alone, unseen.  
     (b) I can, but when I do, *I’m* the one conceiving it—so it’s not truly “unconceived.”  
     (c) Impossible—every attempt makes me the observer.  

  8. **When conceiving an unperceived object (e.g., that tree), what are you doing?**  
     (a) Imagining it as it *really is* “out there,” perception or not.  
     (b) Imagining it, but the act of conception *counts* as perceiving it.  
     (c) Failing—the object is always “in my mind,” so it’s never unperceived.  

  9. **Suppose we agree you can’t conceive of an object without conceiving it. This shows:**  
     (a) Nothing about reality—it’s just how our minds work.  
     (b) A trivial point: conception requires a conceiver, but says nothing about existence.  
     (c) A deep truth: existence *requires* being conceived.  

  10. **What makes it true that a tree was in a forest 100 years ago (no witnesses)?**  
      (a) The tree itself—its physical past leaves traces (e.g., soil, carbon).  
      (b) The *possibility* of evidence (e.g., fossils, old photos if they existed).  
      (c) Nothing—if no one perceived it, it wasn’t there.  

  ---

  ### **Self-Scoring Key**  
  Tally your answers, then use the grids below to find your position.  

  #### **Step 1: Determine Axis 1 (Conceivability Premise)**  
  - Count answers for **Q7, Q8, Q9**:  
    - **Mostly (a) → A (Nothing):** The argument is invalid; you *can* conceive of unconceived objects.  
    - **Mostly (b) → B (Triviality):** The argument is true but trivial; it only describes what conceiving *is*.  
    - **Mostly (c) → C (Real Constraint):** The argument proves existence requires conception.  

  #### **Step 2: Determine Axis 2 (Ground of Unobserved Truth)**  
  - Count answers for **Q1–6, Q10** (7 questions):  
    - **Mostly (a) → II (Independent Reality):** Unobserved things exist on their own (e.g., via physical laws).  
    - **Mostly (b) → III (God/Possibility):** Unobserved things exist if perceivable (by minds, God, or future tools).  
    - **Mostly (c) → I (Nothing):** Unobserved things don’t exist—no perception, no reality.  

  #### **Step 3: Map to the Grid**  
  Your position is the intersection of Axis 1 (row) and Axis 2 (column):  

  |                   | **I (Nothing)**                         | **II (Independent Reality)**           | **III (God/Possibility)**              |
  |-------------------|-----------------------------------------|----------------------------------------|----------------------------------------|
  | **A (Nothing)**   | Incoherent (see notes)                  | **Camp 1: Argument Invalid**           | Rare but possible (see notes)          |
  | **B (Triviality)**| Incoherent (see notes)                  | **Camp 2: Trivial & Proves Nothing**   | **Trivial + God/Possibility**          |
  | **C (Constraint)**| **Camp 3: Proves Non-Existence**        | Incoherent (see notes)                 | **Berkeley’s Claim / Camp 3 Variant**  |

  #### **Position Descriptions & Commitments**  
  - **Camp 1 (A + II):** "Argument is invalid—I *can* conceive of unperceived objects. Unobserved things exist independently (e.g., trees obey physics)."  
    - *Commits you to:* Rejecting Berkeley’s entire premise. Objects exist mind-independently.  
  - **Camp 2 (B + II):** "Argument is true but trivial—conceiving requires a conceiver, but says nothing about existence. Unobserved trees exist independently."  
    - *Commits you to:* Distinguishing mental acts from reality. Berkeley’s argument is irrelevant to metaphysics.  
  - **Camp 3 (C + I):** "Argument proves unperceived objects *can’t* exist—but Berkeley was wrong to invoke God. Unobserved trees weren’t there."  
    - *Commits you to:* Radical phenomenalism—existence requires *actual* perception (no God/possibility fallback).  
  - **Berkeley’s Claim / Camp 3 Variant (C + III):** "Argument proves existence requires conception. Unobserved trees exist through God’s perception or perceivability."  
    - *Commits you to:* Idealism—minds (human or divine) sustain reality. Differs from Camp 3 by allowing God/possibility.  
  - **Trivial + God/Possibility (B + III):** "Argument is trivial—but unobserved things exist through perceivability (not Berkeley’s conclusion)."  
    - *Commits you to:* Hybrid view: Conceivability is wordplay, but existence still depends on potential perception.  
  - **Rare: A + III**  
    "Argument is invalid (I can conceive unconceived things), but unobserved things exist through perceivability."  
    - *Commits you to:* Tension—why accept perceivability if you reject Berkeley’s premise? May reflect pragmatism.  

  #### **Incoherent/Unattractive Cells**  
  - **A + I:** Incoherent. If you *can* conceive of unconceived objects (A), why deny their existence (I)?  
  - **B + I:** Incoherent. If the argument is trivial (B), it doesn’t support the strong claim that unobserved things don’t exist (I).  
  - **C + II:** Incoherent. If existence *requires* conception (C), unobserved things can’t exist independently (II).  
  - **C + I vs. C + III:** Coherent but divergent. Both accept the argument’s force (C), but C+I denies unobserved existence, while C+III preserves it via God/possibility.  

  #### **Indistinguishable Pairs & Tie-Breaker**  
  - **The Ambiguity:** **C+III** (Berkeley’s view) and **B+III** (trivial + possibility) both answer **(b)** for Axis 2 questions. The first 10 questions **cannot distinguish God from perceivability**—both map to III.  
  - **Tie-Breaker Question (Q11):** For those in **III (God/Possibility)** on Axis 2:  
    > **Q11. If no minds existed at all (human, animal, or divine), would a tree in a forest exist?**  
    > (a) Yes—it could exist if minds *were* there (even if none are).  
    > (b) No—without any mind (including God), nothing grounds its existence.  
      - **(a) → Possibility-grounding (phenomenalism):** Unobserved things exist through *abstract potential* (no God needed).  
      - **(b) → God-grounding (Berkeleyan):** Unobserved things exist *only* via divine perception.  
  - **Result:**  
    - **C+III + Q11(a) = Camp 3 Variant (non-Berkeleyan):** "Argument proves a constraint, but God isn’t needed—perceivability suffices."  
    - **C+III + Q11(b) = Berkeley’s Claim:** "Argument proves a constraint, and God sustains unobserved things."  
    - **B+III + Q11(a) = Trivial + Possibility:** "Argument is trivial, and perceivability (not God) grounds existence."  
    - **B+III + Q11(b) = Unstable:** Triviality + God requires extra justification.  

  ---

  ### **Summary**  
  - **Camp 1** (A+II) and **Camp 2** (B+II) are cleanly separated.  
  - **Camp 3** splits: **C+I** (strict non-existence) vs. **C+III** (God/possibility).  
  - **God vs. possibility** is resolved with Q11.  
  - **Why no case distinguishes God/possibility in Q1–10?** Both imply objects are "perceivable," making answers identical for concrete cases (e.g., a fossil exists because we *can* discover it—whether via God or human tools). Only Q11 breaks this by removing all minds.  

  This instrument clarifies commitments while respecting your constraints. Participants get immediate feedback on their view’s coherence and implications.
