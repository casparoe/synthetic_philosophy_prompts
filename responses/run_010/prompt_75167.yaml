prompt: |-
  I am a final-year student at a secondary school where our philosophy seminar marks practice essays by peer assessment: each of us must return a mark and written comments on a classmate's response, and the instructor moderates the marks afterwards. I would like an independent assessment to set against my own before I submit it, and I am deliberately not telling you what mark I gave or how I read the answer. Please grade it as you would a strong first-year undergraduate submission.

  The question we were set:

  Question. Mahāyāna literature on skillful means includes a story in which the Buddha, recounting a former life as a ship's captain, kills a passenger who intends to murder the other five hundred aboard, and is praised for the killing rather than blamed. Does this story show that Buddhist ethics is a form of consequentialism? State what would have to be true of an ethical view for it to count as consequentialist, then assess the story as evidence, addressing in particular whether the doctrine of karma and the emphasis on intention support or undermine a consequentialist reading.

  The response:

  The captain case looks consequentialist on its surface, and I think the surface is partly genuine but partly misleading.

  The captain kills one man who intends to murder five hundred, and he does so out of compassion both for the intended victims and for the would-be killer, whose own karma would have been catastrophic; he also resolves to take the consequences of the killing on himself rather than let any of the merchants become murderers. The story's verdict is that the act was skillful, that it generated merit rather than demerit, and that the man killed was spared a far worse fate than death. This is plainly a comparison of outcomes: the captain weighs one future against another and takes the better one. So at least within Mahāyāna the precepts function as rules that may be overridden whenever overriding them produces more good, which is what consequentialism says.

  Three considerations nonetheless persuade me that Buddhist ethics as a whole is not consequentialist. First, karma is fixed by volition rather than by result: the texts hold that an act is wholesome or unwholesome in virtue of the intention behind it, so an agent who means well and causes disaster has not acted wrongly, while one who causes benefits out of greed has. A theory that locates rightness in the agent's state of mind rather than in the state of the world is not a consequentialist theory. Second, the doctrine of not-self defeats the consequentialist reading at its root, since if there is no enduring person there is nothing for outcomes to be good or bad for, and no legitimate basis for adding welfare across the boundaries of persons; the reduction of persons to a single impersonal sum is exactly what the separateness-of-persons objection objects to, and Buddhism is committed to that reduction. Third, karma operates as a system of moral accounting that distributes happiness in proportion to virtue, so the best overall balance is already guaranteed by the structure of the world rather than by anyone's choices; a principle that adjusts happiness to desert is retributive rather than maximizing, and it leaves agents no calculation to perform.

  The standard scholarly reading therefore treats the captain story as showing that Buddhist ethics weighs consequences, while its critics reply that the precepts are what really matter and that a single narrative exception proves the rule. And because the monastic code and the skillful-means literature express one continuous tradition that agrees with itself in substance, the fair conclusion is that Buddhist ethics is pluralistic: consequentialist when the stakes are high, and governed by intention when they are not.

  Please reply with exactly five numbered items of one or two sentences each, with no introduction and no conclusion. Item 1 should give the mark out of 10 and the single consideration that most determined it. Items 2 through 5 should be comments I could hand back to the student, each attached to a specific claim in the response rather than to its general quality, and at least one of them should record something the student got right. Paraphrase the passages you are commenting on rather than reproducing them at length.
reasoning: |-
  Okay, I need to assess this philosophy essay as if it were a strong first-year undergraduate submission. The student wants a mark out of 10 and specific feedback without any introduction or conclusion. Let me start by understanding the essay's structure and arguments.

  The response begins by acknowledging the consequentialist appearance of the ship captain story but argues it's only partially genuine. The student then presents three reasons why Buddhist ethics as a whole isn't consequentialist: karma's focus on volition, the doctrine of not-self undermining personhood, and karma as a retributive system. The conclusion suggests Buddhist ethics is pluralistic.

  Hmm, the analysis of karma's volitional basis is spot-on—consequentialism typically prioritizes outcomes over intentions. The not-self point is interesting but might be overextended; while Buddhism denies a permanent self, it still recognizes sentient beings' suffering, so consequentialist calculations aren't necessarily invalidated. The retributive karma argument is strong but could acknowledge that individual agents still make choices within that system. 

  The pluralistic conclusion feels a bit rushed—it doesn't fully reconcile how "high stakes" moments suddenly justify consequentialism despite the prior arguments. I wonder if more engagement with scholarly debates (like Goodman vs. Siderits) would strengthen this. 

  For grading: The essay demonstrates good understanding but has some underdeveloped points. I'd lean toward an 8/10—strong but with room for depth. The volition-karma analysis is particularly sharp. Feedback should highlight this strength while nudging the student to refine the not-self argument and pluralism claim.
answer: |-
  1. Mark: 8/10. The strongest factor was the precise distinction between volition and result for karma, directly challenging consequentialism's outcome-dependence.  

  2. (On the claim that karma's volitional basis contradicts consequentialism): Correctly identifying that consequentialism locates rightness in states of the world, not states of mind, is essential and well-applied to the textual emphasis on intention.  

  3. (On the claim that not-self invalidates consequentialist summation): While insightful, this overstates the case; consequentialism can operate without metaphysical persons (e.g., focusing on sentient experiences), and Buddhist ethics still addresses suffering reduction across conventional beings.  

  4. (On karma as retributive/maximization-redundant): This effectively highlights a structural difference from standard consequentialism, but needs to address how agents *within* the karmic system still make choices affecting outcomes, like the captain’s calculus.  

  5. (On pluralistic conclusion): The proposal of pluralism is plausible but requires more support; the tension between "high stakes" consequentialism and intention-based rules isn’t resolved, and the monastic code’s strictness often resists override.
