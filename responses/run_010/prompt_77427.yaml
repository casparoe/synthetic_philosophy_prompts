prompt: |-
  I'm putting together a problem set for my grad seminar on inherited national guilt and I'm tired of the examples everyone reaches for — they're all the same case with the names swapped, and the students have already seen the moves. So I want you to design one for me to spec.

  The spec. Jaspers's old four-way split from the German-guilt book: criminal guilt (courts), political guilt (what your state does in your name, judged by whoever ends up winning), moral guilt (your own deeds, judged by your conscience and by the people who know you), metaphysical guilt (the bare fact of being a human among humans when not all of them survived). I want a case that drives a wedge between the 2nd and 3rd of those.

  Concretely: invent a fictional present-day state that is carrying out some ongoing institutional harm — a resource concession, a reservoir, a debt regime, a border-enforcement contract, whatever you like, but make it up — and then give me two people:

  - a citizen of that state who campaigned and voted against the policy, who is not merely unbenefited by it but demonstrably worse off, who protested it in public and paid something for doing so, and who bears no criminal or moral guilt at all; and
  - a foreigner, citizen of some other state, who did the same things for the same reasons with the same results — campaigned, lost, protested, paid.

  The case has to make it true, and not merely stipulate, that the first bears political guilt in Jaspers's sense and the second does not.

  What it's for, since that fixes what counts as cheating: I'm testing whether political guilt can be a freestanding category, or whether it's just a placeholder for grounds an individualist will supply anyway — benefit received, causal contribution, tacit consent, culpable ignorance, failure to exit. So if your dissenter turns out to have any of those, the case has failed. The wedge has to be load-bearing with everything else held fixed.

  Constraints: no real countries, no real historical atrocities, no genocide or slavery stand-ins (the students go straight there and stop thinking); one paragraph for the scenario itself; nothing science-fictional; and no reading list, no citations, no apparatus — I want the reasoning.

  Then, after the scenario:

  1. Walk through what each of the two categories says about each of the two people and why, including why the verdicts seperate instead of tracking one another.
  2. State the difference between the citizen and the foreigner in a single sentence, and tell me whether it's a relation to the state's power, to its name, to its future, or to something else. If you can't state it without pointing at benefit or agency, say so plainly.
  3. Say which feature of the case is doing the work, and what happens to the political-guilt verdict if I strip it out.
  4. Pressure-test it: does the verdict survive if the dissenter renounces her citizenship but stays and keeps paying taxes? Does it survive if she left as a child and never voted?
  5. Give me the strongest attack a strict moral individualist would make — someone who thinks guilt is always a person's own deed and nothing else can make it so — and tell me honestly whether it lands.

  If it turns out you can't satisfy all of that at once, say which constraint you'd drop and why rather than quietly breaking one.
reasoning: |-
  Hmm, the user is designing a problem set for a grad seminar on inherited national guilt and wants a fresh case study. They're tired of the usual examples and need something that specifically drives a wedge between Jaspers's categories of political guilt (state actions done in your name) and moral guilt (personal actions). 

  The user has very specific requirements: a fictional present-day state committing institutional harm, two dissenters (one citizen, one foreigner) who both opposed the harm but with different guilt attributions. The key challenge is making political guilt apply only to the citizen without relying on individualist factors like benefit, contribution, consent, ignorance, or failure to exit. 

  I'm considering a scenario where the fictional state of "Asteria" imposes a debt regime on "Cyanis" through a bilateral treaty. The citizen dissenter (Maya) and foreign dissenter (Carlos) both actively opposed this, suffered consequences, and are equally "clean" from individualist perspectives. 

  For the analysis: Political guilt sticks to Maya because she's bound by Asteria's sovereignty - the state acts as her agent regardless of her consent. Carlos's state (Veridia) didn't commit the harm, so he escapes political guilt. The core difference is constitutive membership: being subject to the state's authority as a citizen. 

  Pressure-testing shows this holds even if Maya renounces citizenship (if she remains under Asteria's jurisdiction) or left as a child (if she retains citizenship). The strongest individualist counterargument would claim political guilt is incoherent - but that's exactly what this case isolates for debate. 

  I should note that if any constraint must be dropped, it might be the "no real countries" rule to use real-world parallels like EU debt politics, but fictionalizing avoids triggering historical baggage. The case seems to satisfy all requirements while forcing the conceptual wedge.
answer: |-
  Here's the case scenario:

  The Republic of Asteria imposes crushing "Resource Stabilization Debt" on its former colony, Cyanis, through a bilateral treaty enforced by the Asterian-dominated Global Resource Council. The debt compels Cyanis to divert over 60% of its healthcare budget to service payments, causing preventable disease outbreaks. Maya, an Asterian citizen, co-founded the "Debt Justice Asteria" movement, lobbying MPs, organizing strikes that cost her job, and campaigning for the losing "Cancel the Debt" party. Carlos, a citizen of Veridia (a nation with no colonial ties to Cyanis and no vote on the Council), co-led Veridia's "Solidarity with Cyanis" campaign, lobbying his government (which opposed the debt but lacked influence), organizing protests where he was arrested, and losing his university position. Both acted purely on principle, derived no benefit (Asteria's gains fund elite projects, not general welfare; Veridia gained nothing), and bear zero causal responsibility or ignorance.

  ---

  **1. Jaspers's Categories Applied:**

  *   **Maya (Asterian Citizen):**
      *   *Criminal Guilt:* None. No illegal acts committed.
      *   *Political Guilt:* **Yes.** Asteria, the state of which she is a citizen, is perpetrating the harm to Cyanis in her name and as a representative entity she is part of. The victors (the Asterian state and its allies upholding the treaty) judge this harm as politically valid (enforcing contracts/order), implicating all citizens politically.
      *   *Moral Guilt:* **No.** Her conscience is clear (she fought against it), and her peers (fellow activists) judge her actions as morally correct. She bears no *personal* responsibility for the harm.
      *   *Metaphysical Guilt:* **Yes (shared human condition).** As a human, she exists while Cyanis suffers preventable deaths she cannot stop.
  *   **Carlos (Veridian Citizen):**
      *   *Criminal Guilt:* None. Arrests were for protest, not related to causing harm.
      *   *Political Guilt:* **No.** The harm is being carried out *by Asteria*, not by Veridia. Veridia did not commit the act, even if it lacked power to stop it. Carlos is not a member of the perpetrating polity. The victors judge Asteria, not Veridia or its citizens, for this specific policy.
      *   *Moral Guilt:* **No.** Clear conscience, judged morally correct by peers for his opposition.
      *   *Metaphysical Guilt:* **Yes (shared human condition).** Same as Maya.

  **Why the Verdicts Separate:** Political guilt attaches solely to membership in the polity *perpetrating* the harm, judged by the outcome (Asteria's policy stands). Moral guilt is absent for both because their *personal actions* were consistently oppositional and blameless. Political guilt tracks the *state's agency* attributed to its members; moral guilt tracks the *individual's agency*. Asteria did it; Maya belongs to Asteria; therefore, Maya bears political guilt. Veridia didn't do it; Carlos belongs to Veridia; therefore, Carlos bears no political guilt for *this* act. Their identical moral standing is irrelevant to the political category.

  **2. The Difference in One Sentence:** The citizen is constitutively a member of the sovereign entity (Asteria) whose power and authority are actively perpetrating the harm, while the foreigner is not. **It is a relation to the state's sovereign power and its exercise in the world.** (Not benefit, agency, consent, ignorance, or failure to exit).

  **3. The Load-Bearing Feature:** **The constitutive membership in the perpetrating sovereign entity.** Maya is an Asterian *by right and recognition*, making Asteria's sovereign acts, by definition, acts in her name, regardless of her dissent. Carlos lacks this membership link to the perpetrator state. Strip this out (e.g., imagine stateless actors), and political guilt as Jaspers defines it (guilt for what *your state* does) loses its foundation. The verdict collapses.

  **4. Pressure Testing:**

  *   **Renounces Citizenship, Stays/Pays Taxes:** **Political guilt likely persists, but becomes debatable.** She remains under Asteria's jurisdiction and benefits (minimally) from its order, potentially sustaining the link. However, renouncing the constitutive bond weakens the "your state" element. This tests the *boundaries* of membership but doesn't clearly negate it if she remains subject to Asteria's power. *(Verdict: Survives, but strained)*.
  *   **Left as Child, Never Voted:** **Political guilt likely persists.** Citizenship is typically a birthright status, not contingent on residence or voting. Asteria still acts as *her* state (e.g., she holds its passport, it represents her internationally, she could return). Her lack of participation doesn't dissolve the constitutive link. *(Verdict: Survives)*.

  **5. The Strongest Individualist Attack & Does It Land?**

  *   **The Attack:** "Political guilt is a phantom category. Guilt requires personal fault – causation, culpable choice, or blameworthy acceptance of benefit. Maya caused no harm, chose only to oppose it, and gained nothing. Attributing 'guilt' to her for acts she fought against is morally incoherent and potentially harmful, conflating her blameless self with the true perpetrators. It's a dangerous collectivism that erodes individual responsibility. The *only* meaningful guilt here is the moral guilt of Asteria's leaders and the metaphysical guilt we all share."
  *   **Does It Land?** **Yes, on its own terms, but misses the target.** The attack successfully exposes that political guilt *cannot* be reduced to individualist grounds (causation, choice, benefit) – which is precisely the point of the case. The individualist correctly argues it's not *moral* guilt. However, they fail to engage with Jaspers's core claim: that there exists a distinct, non-moral, *political* dimension of belonging where one is implicated by the deeds of the sovereign entity they constitute, judged by the outcome and the victor's framework. The attack rejects the *validity* of this category entirely. It lands as a powerful counter-*argument* to the *existence* of freestanding political guilt, but it doesn't *refute* the claim that *if* such a category exists, this case demonstrates its operation independently of individualist factors. The case successfully isolates the conceptual wedge; the attack challenges whether the wedge is made of solid material.

  **If Constraints Must Be Dropped:** The "no real countries" constraint might be the most limiting. A carefully chosen, lesser-discussed real-world parallel (e.g., a specific EU debt policy impacting a member state, or a resource contract involving a regional power and a smaller neighbor) could provide concrete complexity, but risks triggering the "stop thinking" reaction or unwanted historical baggage. Fictionalizing ensures focus purely on the philosophical mechanics.
