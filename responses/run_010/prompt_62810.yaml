    - A-fundamental: Graded A explains "degrees" of P-narrative.  
    - Dissociation: A and P dissociate in degree (e.g., high A/low P in blindsight).  
    - No-distinction: Consciousness is a unified scalar property.  
  - **Effect on tree**: Gradedness refines interpretations but doesn’t alter core positions. The tree still sorts via binary judgments (e.g., “is there *any* P?”).  

  ---

  ### **Limitations**
  - **Indistinguishable pair**: **A-fundamental** and **A-necessary-for-P** (P real but requires A) *cannot be separated* by this tree. Both answer:  
    - Blindsight (Q1): A-without-P = "yes"  
