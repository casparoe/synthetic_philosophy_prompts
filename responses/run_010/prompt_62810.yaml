  Below is a decision tree designed to sort positions on the access-consciousness (A) vs. phenomenal-consciousness (P) distinction using concrete judgments about your three cases and supplementary thought experiments. The tree has **seven nodes** (six questions plus one gradedness prompt), avoids labels, and focuses on "would you say this" judgments. Logical space is mapped first, followed by the tree, leaves (positions), and notes on gradedness and limitations.

  ---

  ### **Logical Space of Positions**
  The split between A (information availability for report, reasoning, behavior) and P (subjective experience, "what it's like") can be analyzed via four key questions:

  1. **Can P exist without A?** (e.g., unreportable subjective states)  
  2. **Can A exist without P?** (e.g., information processing without experience)  
  3. **Is P irreducible to A?** (e.g., P has non-functional properties)  
  4. **Is the A/P split coherent?** (e.g., are they truly distinct?)  

  Combinations of answers define positions. Below, ✓ = possible/yes, ✗ = impossible/no, and – = not applicable (split denied). Empty cells are **incoherent**, **unattractive**, or **unexplored**:

  | Position                  | P w/o A? | A w/o P? | P Irreducible? | Split Coherent? | Empty Cells & Why                                                                                                                                 |
  |---------------------------|----------|----------|----------------|-----------------|---------------------------------------------------------------------------------------------------------------------------------------------------|
  | **P-fundamental**         | ✓        | ✗        | ✓              | ✓               | **A w/o P = ✗** incoherent: If A depends on P, A cannot exist without P.                                                                         |
  | **A-fundamental**         | ✗        | ✓        | ✗              | ✓               | **P w/o A = ✗** incoherent: If P is a narrative of A, P cannot exist without A.                                                                  |
  | **Dissociation**          | ✓        | ✓        | ✓              | ✓               | None (both can genuinely come apart).                                                                                                             |
  | **No-distinction**        | ✗        | ✗        | –              | ✗               | **P w/o A or A w/o P = ✓** incoherent: Denies the split exists, so neither can exist alone.                                                      |
  | **A-necessary-for-P**     | ✗        | ✓        | ✓              | ✓               | **P w/o A = ✗** unattractive: Rarely held; if P is irreducible, why can’t it exist without A? (Collapses to A-fundamental in practice).          |
  | **Eliminativism**         | ✗        | ✗        | ✗              | ✗               | **P Irreducible = ✓** incoherent: If P is illusory, it can’t be irreducible.                                                                     |
  | **Panpsychism**           | ✓        | ✗        | ✓              | ✓               | **A w/o P = ✓** incoherent: If all systems have P, A cannot lack P (unless graded).                                                              |

  **Empty cells explained**:  
  - **A w/o P = ✓ + P w/o A = ✗**: Unattractive; implies P is incapable of existing independently despite being irreducible (no clear examples).  
  - **P w/o A = ✗ + A w/o P = ✗ + Split Coherent = ✓**: Incoherent; if the split is real, one must be possible without the other.  
  - **Other combinations**: Unexplored (e.g., P irreducible but split incoherent).  

  ---

  ### **Decision Tree**
  **Instructions**: Answer questions based on concrete judgments. Anchor on your three cases and standard thought experiments (blindsight, zombie).  
  **Gradedness preamble** (not a branch, but shapes interpretations):  
  > **G0. Gradedness**: Do you treat consciousness as all-or-nothing or graded? (If graded, cases involve **partial** A/P; positions adjust but core claims hold. See note after the tree.)

  **Tree Questions**:  
  1. **Blindsight**: A patient with a visual cortex lesion accurately “guesses” stimuli in their blind field but reports no experience. Would you say the stimulus was *access-conscious* (available for use)?  
     - **Yes** → Go to Q2.  
     - **No** → Go to Q5.  

  2. **Your Case 2 (hum)**: Before you noticed the hum, would you say it was *phenomenally conscious* (subjectively experienced)?  
     - **Yes** → **Leaf: DISSOCIATION** (both can come apart).  
     - **No** → Go to Q3.  

  3. **Your Case 1 (anaesthesia)**: When the patient squeezed the ball, would you say the command was *phenomenally conscious*?  
     - **Yes** → *Position not in core set* (inconsistent: A w/o P claimed in blindsight, but P here implies A).  
     - **No** → Go to Q4.  

  4. **Zombie thought experiment**: A physically identical duplicate of you lacks subjective experience but behaves identically. Would you say this is *conceivable* (not logically contradictory)?  
     - **Yes** → **Leaf: A-FUNDAMENTAL** (A is whole story; P is narrative).  
     - **No** → *Position not in core set* (rejects A w/o P but allows it in blindsight).  

  5. **Your Case 2 (hum)**: Before you noticed the hum, would you say it was *phenomenally conscious*?  
     - **Yes** → Go to Q6.  
     - **No** → Go to Q7.  

  6. **Inverted spectrum**: Two people have identical behavior but experience colors inversely (e.g., their “red” is your “green”). Would you say this is *possible*?  
     - **Yes** → **Leaf: P-FUNDAMENTAL** (P is real; A is downstream).  
     - **No** → *Position not in core set* (accepts P w/o A but denies P’s irreducibility).  

  7. **Your Case 3 (infusion controller)**: The device adjusts delivery and answers questions. Would you say it has *access-consciousness*?  
     - **Yes** → *Position not in core set* (allows A w/o P but rejects P w/o A, e.g., functionalism).  
     - **No** → **Leaf: NO-DISTINCTION** (no principled split).  

  ---

  ### **Leaves (Positions)**
  Each leaf specifies what it must deny or explain away in your cases:  
  1. **P-fundamental** (P is real; A is downstream):  
