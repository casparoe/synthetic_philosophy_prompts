  - **Edge cases**: Some answers (e.g., "yes" at Q3 or Q6 "no") lead to unclassified positions (e.g., non-reductive physicalism). The tree focuses on your requested leaves.  

  ---

  This tree uses your cases as anchors, fills gaps with blindsight/zombie/inverted spectrum, and delivers the four core positions plus notes on gradedness. It’s designed for your reading group to bypass labels and sort by intuitive judgments. Enjoy the discussions!
