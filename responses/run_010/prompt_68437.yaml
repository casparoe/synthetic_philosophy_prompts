prompt: |-
  So I'm captain of my school's debate team and we got absolutly destroyed at a tournament last weekend over a source thing, and now I'm trying to figure out what our actual rule should be. Our coach's rule is basically "never say anything in a round that you aren't 100% certain is true," which sounds responsible but is useless in practice — like, half of what you say in a round you aren't certain about, and if we only asserted the stuff we were certain of we wouldn't have a case. I've been reading about the philosophy of assertion stuff, the debate between the knowledge norm (Williamson's version, only assert what you know), the truth norm (only assert what's true, whether you know it or not), and the weaker one where it's enough that you reasonably believe it. They give different verdicts on the same case and I can't tell which one my coach is trying to be.

  Can you build me an actual procedure my team can run — the questions to ask about a claim, in order, before it comes out of your mouth, what counts as a good enough answer to each one, and where it lands: say it flat out, only say it hedged or conditional ("if that number's right then..."), or don't say it at all. Two things I care about that I think the norms talk about but that never make it onto a debate card: first, whether presenting something conditionally or as a question to the other team actually escapes the norm or is just a sneaky way of asserting it anyway; and second, that in a round the person I'm asserting to isn't only a judge, it's my partner, who's going to build the next four minutes on top of whatever I said — so I want the procedure to care about who's relying on me, if that's legitimate or if I'm just inventing a fourth norm.

  Constraints: it has to fit on one index card, usable in about ten seconds during prep, by people who've never heard of any of this. Say which norm you built the card around and why you picked it over the other two, not just mush all three together. And mark the places where it's really my judgment doing the work and the card is just dressing it up.

  Then run the card on three cases: (1) a statistic from a think tank our side uses constantly that I'm pretty sure is real but I've never seen the actual study behind it; (2) something I know from my own life — my little brother's school did exactly this policy and it flopped — that I'm totally certain of but can't document at all; (3) a confident prediction I'm making about what happens three years after a policy passes. At least one of those should come out as "don't say it," even though saying it would probably win us the round — I want to see the card bite on something I'd hate to give up.

  End with what the card can't handle and where it'll misfire. Bottom line in your very first sentence: which norm the card is built on and the one-line version of the rule, then the reasoning after that. No preamble, don't restate my question, and no bibliography or list of stuff to go read, I can't look anything up right now.
reasoning: |-
  Okay, the user is a debate team captain who just had a rough tournament due to source issues. Their coach's rule of "only say what you're 100% certain is true" is impractical. They've been reading about assertion norms—knowledge, truth, and reasonable belief—and want a practical procedure on an index card. 

  First, I need to pick one norm. The knowledge norm (Williamson) is too strict for debate, where you often use researched but not personally verified info. The truth norm ignores whether the speaker knows it, which could lead to spreading misinformation if debaters guess. The reasonable belief norm balances rigor with practicality—it's about due diligence, not absolute certainty. That fits debate best: you can assert what a reasonable researcher would accept after checking source quality and context. 

  The card must handle three key things: 
  - How hedging affects responsibility (conditional statements don't fully escape the norm but shift burden)
  - Teammate reliance (the procedure must flag when claims become building blocks for others)
  - Real-world cases where the rule bites (like undocumented personal anecdotes)

  For the index card, I'll distill it into 3 yes/no questions:
  1. Source quality: Can I name/describe a credible source? (If yes, say flat out; if vague, hedge; if no, skip)
  2. Context match: Does this apply to the current debate? (If uncertain, hedge)
  3. Team reliance: Will others build on this? (If yes and source weak, hedge strongly; if critical path and weak source, reconsider saying it)

  Testing on their cases:
  1. Think tank stat: Good source name → say flat (but note: if coach demands primary sources, this might need hedging)
  2. Brother's school story: No verifiable source → don't say (hard bite, as requested)
  3. Policy prediction: Reasonable inference from evidence → hedge ("evidence suggests...")

  Edge cases: Time pressure (may force hedging), subjective "reasonableness" calls, and opponent traps (good faith matters). The card's weakness is judging source credibility on the fly, but it prevents reckless claims while allowing strategic conditional arguments. 

  Final structure: Lead with "Reasonable Belief Norm" and one-liner, then the 3Q flow, case applications, and limitations. No fluff—just actionable rules fitting an index card.
answer: |-
  **Bottom Line:** The card uses the **Reasonable Belief Norm** (assert only what you reasonably believe is true). One-Line Rule: *"Only assert claims you have good reason to believe are true based on credible evidence or sound reasoning, adjusted for how others will rely on you."*

  **Why Reasonable Belief?**
  *   **Knowledge Norm (Too Strict):** Requires certainty/knowledge. Debates often rely on researched claims you haven't personally verified (e.g., think tank stats). This norm would cripple your case.
  *   **Truth Norm (Too Permissive):** Allows asserting anything true, even if you have no reason to believe it (e.g., guessing). This invites reckless arguments and the exact "source thing" disaster you faced.
  *   **Reasonable Belief (Practical & Responsible):** Demands due diligence ("good reason") without requiring impossible certainty. It balances rigor with the reality of debate research and allows for justified predictions/interpretations. It directly addresses *your* concern about teammate reliance – if you don't have good reason, you shouldn't make them build on sand.

  **The Assertion Procedure Card (Fit on an Index Card):**

  **BEFORE YOU SPEAK: ASK IN ORDER - STOP AT FIRST "NO"**
  1.  **SOURCE/REASON:** Do I have a **specific, credible source** (study, expert, data) OR a **clear, logical reason** (deduction, analogy, widely accepted fact) for this?  
      *   *GOOD ENOUGH:* Named source (e.g., "Smith 2023 study"), credible institution (e.g., "CDC data"), strong logic (e.g., "If demand increases and supply is fixed, prices rise").  
      *   *WEAK:* "I think I read it somewhere," "Common sense says," vague source ("some economists").  
      *   **VERDICT:** YES? → Go to Q2. NO? → **DON'T SAY IT.**
  2.  **CONTEXT FIT:** Does the source/reason **directly support** this *specific claim* in *this debate context*? Is it current, relevant, and not misrepresented?  
      *   *GOOD ENOUGH:* Statistic matches the policy debated, analogy is apt, logic applies directly.  
      *   *WEAK:* Stat is for a different country/time, analogy is stretched, logic has gaps for this case.  
      *   **VERDICT:** YES? → Go to Q3. NO/UNCERTAIN? → **HEDGE** ("*If* Smith's data applies here...", "Assuming this analogy holds...").  
  3.  **TEAM RELIANCE:** Will my **partner/judge treat this as a FACT** to build on? (Is it core to our link chain, advantage, or a key response?)  
      *   *GOOD ENOUGH:* It's a foundational link, a key advantage impact, or a crucial defensive argument they *must* extend.  
      *   *WEAK:* It's illustrative, a minor point, or something they can easily drop if challenged.  
      *   **VERDICT:** YES & Q1/Q2 were SOLID? → **SAY IT FLAT.**  
          YES but Q1/Q2 were WEAK/HEDGED? → **HEDGE STRONGLY/FLAG** ("*Based on X's potentially contested finding*, we see...", "Partner, *note this relies on Y assumption*...").  
          NO? → Say it flat or hedged based on Q1/Q2 alone.

  **Hedging & Questions:** Hedging (conditionals, "if" clauses) **doesn't fully escape the norm.** You still need reasonable belief *in the conditional statement itself* (e.g., you reasonably believe Smith *said* the stat, even if unsure it's true/applicable). Asking the other team ("Do you accept...?") is strategic, but *if you present it as true* to your partner/judge implicitly, the norm still applies. The card forces you to confront reliance via Q3.

  **Applying the Card to Your Cases:**

  1.  **Think Tank Stat (Common, unseen study):**
      *   Q1: **YES.** You have a *specific credible source* (Think Tank Name, Report Title/Year - even if you haven't read the full study). Reasonable belief comes from the institution's reputation and your side's consistent use *with verification*.
      *   Q2: **UNCERTAIN?** You haven't seen the *methodology*. Could it be misapplied here? **VERDICT:** **HEDGE** ("The [Think Tank] 2023 report finds X, suggesting..."). Q3 (Reliance) might push for stronger hedging if it's absolutely critical and your opponents are source-hawks.
  2.  **Brother's School Anecdote (Certain, undocumented):**
      *   Q1: **NO.** You have *no specific, credible source* others can assess. Your personal certainty isn't sufficient evidence in a debate context. Your reason ("I saw it") isn't verifiable or credible to others. **VERDICT:** **DON'T SAY IT AS FACT.** You *could* hedge extremely weakly as pure illustration if *absolutely* necessary and flagged as non-factual ("One *unverified* local example might suggest... but we focus on broader evidence"), but Q1 says **NO** - so the card bites: **DON'T SAY IT.**
  3.  **Confident Prediction (3 years out):**
      *   Q1: **YES (if done right).** You have a *clear, logical reason* based on evidence (e.g., "Studies show policy type A consistently causes outcome B within 2-5 years; therefore, we predict B by year 3"). Prediction itself isn't a fact, but the *reason* for the prediction must be sound.
      *   Q2: **PROBABLY UNCERTAIN.** Predicting exact timing is inherently less certain than describing past events. **VERDICT:** **HEDGE** ("*Based on historical trends/evidence*, we confidently predict B will occur within 3 years"). Q3 (Reliance) means if this prediction is *the* key to an advantage, emphasize the strength of the underlying evidence in the hedge.

  **What the Card Can't Handle & Where It Misfires:**

  *   **"Reasonableness" is Subjective:** The card relies *heavily* on your judgment about source credibility and logic strength (Q1/Q2). A lazy researcher might call a blog "credible." **This is the main dressing-up point.**
  *   **Time Pressure:** Rigorous Q1/Q2 checks in 10 seconds are hard. It prioritizes process over perfection under pressure.
  *   **Opponent Gimmicks:** Doesn't directly address opponents misrepresenting sources (focuses on *your* assertions). Combating that needs separate evidence ethics rules.
  *   **Hyper-Technical Evidence Debates:** When sources *directly* contradict on a micro-point, Q1's "credible source" might not resolve it. Deeper research/card comparison is needed.
  *   **Misfire:** Might be *too* restrictive on novel, well-reasoned analytical arguments if the debater struggles to articulate the "clear reason" (Q1) succinctly. Could also misfire if a team over-hedges on strong evidence due to Q3 paranoia, weakening their presentation.
