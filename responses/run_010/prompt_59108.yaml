prompt: |-
  I'm on a small team that has to decide whether to believe an interpretability finding before we let it drive a safety decision — things like "the model represents whether the user is a minor" or "there's a direction for sycophancy that the RL stage amplifies." Half of us think claims like that are as real as claims about tables; the other half think they're useful bookkeeping fictions. The problem is the argument never actually gets joined, because nobody on either side can say what would make one of them right.

  So before I wade through more accounts of mental representation, I want the spec. What does a theory of representaion in a neural net have to deliver to count as adequate? Fix the purpose for me like this: it has to make "the model represents X" come out *true* for the findings we'd stake a decision on and *false* for the ones we wouldn't, and false for a better reason than "we couldn't find it."

  Give me the requirements list, each one with the case or consideration behind it. I want the awkward cases covered, at minimum:

  - a direction that decodes some property with high accuracy but where ablation does nothing to behaviour, and it sits in a layer that gets overwritten downstream;
  - a polysemantic unit that fires for cat faces and car fronts — does the model represent cat face, car front, both, neither, or the disjunction?
  - a model that reliably says Rome is in France: for it to be wrong about Rome, it has to represent something falsely, so tell me what has to be true for that;
  - two models with identical behaviour and totally different internals — is one of them misdescribed, or does the theory have to say both are right?
  - a feature that only exists under a particular prompt format or tokenizer choice;
  - something the model demonstrably uses but that nobody can find as a direction, a unit, or a circuit.

  Also the distinctions it's not allowed to collapse (decodable vs. used, representing-that vs. representing-as, whatever else you think matters) and the facts about how these systems are actually built that it can't contradict — superposition, features living in directions rather than neurons, ablations routinely underdelivering, and so on.

  Then the parts I care about most. Which of these requirements are genuinely non-negotiable, and which are one camp's priors wearing a lab coat? I suspect "representations must be causally efficacious" is doing a ton of unearned work — push back if I'm wrong. Which single requirement knocks out the most candidate theories? And if some subset is jointly unsatisfiable — I have a feeling that something like mind-independence plus abundance plus causal efficacy can't all be had at once — show me the tension explicitly rather than hedging, because if the list itself is a no-go result that's the finding.

  End with a short scorecard, one paragraph each, of the obvious contenders: a resemblance/isomorphism account, a causal-role account, a learning-history or teleological one, and a deflationary one that says representation-talk is just a stance we take. Keep that brief, the criteria are where I want the weight.
reasoning: |-
  We are to provide a specification for a theory of representation in neural networks that can adjudicate when claims like "the model represents X" are true or false, with particular attention to awkward cases and non-negotiable requirements.

  The purpose: to have a clear basis for safety decisions. We want the theory to:
  - Make "the model represents X" true for findings we would stake a decision on (i.e., the representations that are causally relevant to behavior we care about for safety).
  - Make it false for ones we wouldn't (e.g., decodable but causally irrelevant features, or artifacts of the interpretability method) and for a better reason than "we couldn't find it".

  We are to cover the listed awkward cases, note important distinctions, and consider constraints from how neural nets actually work.

  Then, we are to identify non-negotiable requirements and potential tensions, and finally scorecard the main types of theories.

  Let's break down:

  I. Requirements for an adequate theory of representation

  We must cover the awkward cases:

  1. **Direction that decodes well but ablation does nothing (and is overwritten downstream):**
     - Consideration: We want representations that are causally relevant to the model's behavior. If ablation doesn't change behavior, then even if we can decode the property, it might be a dead end or redundant. The theory must not count such a direction as representing X in the sense that matters for safety.

  2. **Polysemantic unit (fires for cat faces and car fronts):**
     - Consideration: This is a common phenomenon due to superposition. The theory must account for whether the unit represents:
          - cat face
          - car front
          - both (but then how? as a disjunction? as a superposition?)
          - neither (and instead represents a lower-level feature common to both? or something else entirely?)
     - We need a principled way to decide, especially because for safety we might care about the model representing "cat face" as a distinct concept.

  3. **Model reliably says Rome is in France (false belief):**
     - Consideration: For the model to be wrong, it must have a false representation. What does it mean for a representation to be false? We require that the representation must be causally involved in producing the output and that it must have a content that can be true or false (e.g., a representation that Rome is in France). This case tests how the theory handles misrepresentation.

  4. **Two models with identical behavior but different internals:**
     - Consideration: If the behavior is the same, then for safety purposes we might care about the same representations. But if the internals are different, does that mean one model represents X and the other doesn't? Or do both? The theory must clarify whether representation is tied to implementation or only to function.

  5. **Feature that only exists under a particular prompt/tokenizer:**
     - Consideration: Representations might be context-dependent. For safety, we might care about representations that are robust across contexts, but sometimes the context is critical. The theory must account for when a representation is stable and when it is an ephemeral artifact.

  6. **Something the model uses but we can't find:**
     - Consideration: We want the theory to allow that representations exist even if our current methods cannot find them (so we cannot rely solely on what we can decode). But then how do we know? We need a criterion that is not solely dependent on our ability to detect.

  Important distinctions the theory must respect:

  - **Decodable vs. used**: A feature might be decodable by an external probe but not used by the model in its computations. We care about the latter for safety.
  - **Representing-that vs. representing-as**: Representing-that involves propositional content (e.g., that Rome is in France), while representing-as might be non-propositional (e.g., representing Rome as a city). Safety often involves propositional content (false beliefs, goals, etc.).
  - **Causal efficacy**: The representation must play a causal role in the model's processing? But note: the user suspects this requirement is doing unearned work.

  Constraints from how neural nets are built:

  - Superposition: Features are represented in a compressed form, so one neuron or direction can be involved in multiple features.
  - Features live in directions: Not necessarily in individual neurons, so the theory must allow for distributed representations.
  - Ablations routinely underdelivering: Because of redundancy and distributed representations, ablating one part might not change behavior even if that part is normally involved.

  II. Non-negotiable requirements and tensions

  Non-negotiables (from the purpose and the cases):

  1. **Causal relevance for behavior**: The representation must be causally involved in producing the behavior we care about. Without this, we get the first awkward case (ablation does nothing) and the decodable vs. used distinction collapses. This is non-negotiable for safety: if the representation isn't used, then even if it's there, it doesn't affect the model's actions. (But note: the user suspects this requirement is overemphasized. However, for safety decisions, if a representation isn't causing the behavior, then why base a safety decision on it? So I argue it is non-negotiable for this purpose.)

  2. **Account for misrepresentation**: The theory must allow for false representations (like the Rome case). Otherwise, we cannot say the model is wrong.

  3. **Not solely dependent on interpretability tools**: The existence of a representation cannot be defined by our ability to find it (to handle the case of something we can't find). So the theory must have a criterion that is objective.

  4. **Compatibility with distributed representations**: The theory must not require that representations are local (one neuron per feature) because of superposition and distributed representations.

  Tensions:

  - **Abundance vs. causal efficacy**: If we say every decodable direction is a representation (abundance), then we get many representations that are not causally relevant. But causal efficacy requires that only those that are actually used count. So we must choose: either we have an abundance of representations (but then why are some causally relevant and others not?) or we tie representation to causal role (which might be too restrictive for some).

  - **Mind-independence vs. causal role**: Mind-independence (the representation exists independently of our interpretability tools) is non-negotiable (requirement 3 above). But if we tie representation to causal role, then we have a clear criterion that doesn't depend on our tools. However, the causal role might be distributed and hard to detect, so we might not be able to find it even if it exists. So we need a theory that can say a representation is there even if we can't find it, but by causal role we can in principle know it.

  - **Polysemantic units**: How can a unit represent two things without being a disjunction? If the disjunction is not a natural feature, then we might not want to say it represents the disjunction. This might require that representations are context-dependent.

  III. Scorecard of theories

  1. **Resemblance/isomorphism account**: Representation is a matter of structural similarity between the internal state and the represented content.
     - Fails on multiple counts: 
          - How does it handle polysemantic units? (One vector might resemble two different things in different contexts.)
          - Misrepresentation? (If it resembles, then it should be accurate, but the model can be wrong.)
          - Also, neural activations don't literally resemble high-level concepts like "minor". 
     - Not adequate.

  2. **Causal-role account**: A state represents X if it plays a certain causal role in the system, e.g., it is triggered by X and causes behavior appropriate to X.
     - Handles causal relevance well (non-negotiable) and can explain misrepresentation (if triggered by non-X, it might cause wrong behavior). 
     - But: 
          - Polysemantic units? It might say the unit represents a disjunction (if it is triggered by either cat faces or car fronts) but then that disjunction might not be a natural kind. 
          - Also, two behaviorally identical models with different internals: both might have states playing the same causal role (at a functional level) so both represent X? This seems acceptable.
          - However, what about features we can't find? The causal role exists independently, so even if we can't find it, it's there. 
          - But: the causal role might be distributed and hard to isolate. Also, in the case of the feature that only appears with a particular prompt, the causal role might be context-dependent. 
     - This is a strong contender, but might struggle with distributed representations and superposition.

  3. **Learning-history or teleological account**: A state represents X if it was trained to detect X (learning history) or if its function is to indicate X (teleology).
     - Handles misrepresentation: if the state is triggered by something other than X, it misrepresents.
     - But: 
          - What if the model uses a feature in a way not directly trained? (e.g., emergent features). 
          - Also, two models with same behavior but different training? They might have the same function by convergent evolution? 
          - The feature that only exists under a prompt: if the training didn't cover that prompt, then maybe it doesn't count? 
          - Also, polysemantic units: if the unit was trained to detect both (or neither) then it might be ambiguous.
     - The teleological account (function) might be better, but what is the function? The training objective? Then it might be too narrow.

  4. **Deflationary account**: Representation-talk is just a useful fiction we adopt for prediction and explanation.
     - This would make "the model represents X" true when it is useful for us to say so, but then it doesn't provide an objective basis for safety decisions. 
     - We want to know if the model *really* has a representation of X because that affects its behavior in novel situations. 
     - Fails the non-negotiable of mind-independence: we want representations to exist independently of our stance.

  Conclusion on theories: The causal-role account seems the most promising, but it must be refined to handle distributed representations and context-dependence.

  IV. Requirements list with cases and considerations

  We now list the requirements explicitly. Each requirement is motivated by a case or consideration.

  1. **Causal efficacy**: The representation must be causally involved in the model's behavior, especially the behavior we are making a safety decision about. 
     - Case: Direction that decodes well but ablation does nothing. Without causal efficacy, we might base a safety decision on a decodable feature that isn't actually used. 
     - Non-negotiable for safety.

  2. **Account for misrepresentation**: The theory must allow that a representation can be false (e.g., representing that Rome is in France when it is not). 
     - Case: Model reliably says Rome is in France. 
     - Non-negotiable because we need to handle false beliefs.

  3. **Objectivity**: The existence and content of a representation must not depend on our ability to detect it (mind-independence). 
     - Case: Something the model uses but that nobody can find. 
     - Non-negotiable: otherwise, we cannot say that a representation exists even if we can't find it.

  4. **Compatibility with distributed representations**: The theory must not require localist representations (one neuron per feature) and must allow for superposition and features in directions. 
     - Case: Polysemantic unit. 
     - Also, the fact that features live in directions. 
     - Non-negotiable because that's how neural nets work.

  5. **Context-dependence**: The theory must account for representations that are only active in certain contexts (like a particular prompt). 
     - Case: Feature that only exists under a particular prompt. 
     - Non-negotiable because representations in neural nets are context-dependent.

  6. **Behavioral equivalence**: If two models have identical input-output behavior, then they must have the same representational properties at the functional level (even if the implementation differs). 
     - Case: Two models with identical behavior and different internals. 
     - Why? Because for safety, we care about what the model does, and if the behavior is the same, then the representations that are causally relevant to that behavior must be present in both. 
     - But note: the internal structure might differ, so the representations might be implemented differently. The theory must be at the right level of abstraction.

  7. **Content determinacy**: The theory must provide a principled way to assign content (e.g., for the polysemantic unit, does it represent cat face, car front, or both?).
     - Case: Polysemantic unit.

  Tensions:

  - **Causal efficacy vs. abundance**: If we require causal efficacy, then we rule out decodable but causally inert features. But if we want an abundance of representations (because we can decode many things), then we have to accept that not all representations matter for safety. This is acceptable: for safety, we care about the causally relevant ones.

  - **Objectivity and causal efficacy**: How do we know a representation exists if we can't find it? We have to infer from the causal role it plays. But if we can't find it, we might not know what role it plays. This is a practical challenge, but the theory must allow that it exists in principle.

  - **Content determinacy in distributed systems**: In a polysemantic unit, the content might be underdetermined. The theory must have a way to fix content (e.g., by causal history or current causal role). But this is hard.

  Final Scorecard (brief):

  1. **Resemblance/isomorphism account**: Fails on misrepresentation, polysemy, and distributed representations. Not viable.
  2. **Causal-role account**: Best at handling causal efficacy and misrepresentation. Struggles with content determinacy in polysemy and distributed cases, but refinements (e.g., contextual causal roles) might help. Currently the front-runner.
  3. **Teleological account**: Adds a normative element (function) which helps with misrepresentation and content, but defining the function (training objective vs. actual use) is tricky. Might be combined with causal role.
  4. **Deflationary account**: Avoids the hard problems but fails objectivity and thus is inadequate for safety (we need real representations).

  Conclusion: The causal-role account, possibly augmented with teleology (to fix content), is the most promising, but it must be developed to handle the awkward cases and constraints.
answer: |-
  Below is a specification for a theory of representation in neural networks, tailored to your team's needs. The goal is to ground claims like "the model represents X" in a way that reliably informs safety decisions (e.g., intervening on sycophancy or detecting minors). I'll define requirements based on your awkward cases, key distinctions, and real-world constraints, then identify non-negotiables and tensions. Finally, I'll scorecard major theoretical approaches.

  ---

  ### **Requirements for an Adequate Theory of Representation**
  Each requirement is derived from your awkward cases, distinctions, or neural net realities. The theory must deliver **truth conditions** for "the model represents X" that:
  - **True positives**: Cover findings you'd stake a safety decision on (e.g., a sycophancy direction that *causes* harmful outputs).
  - **True negatives**: Rule out findings you wouldn't (e.g., decodable but behaviorally irrelevant features), with better justification than "we couldn't find it."
  - **Cover awkward cases** and **respect neural net realities** (e.g., superposition, distributed features).

  1. **Causal Efficacy**  
     - *Requirement*: The representation must play a causal role in generating relevant model outputs.  
     - *Case*: A direction decodes "user is a minor" with high accuracy, but ablation does nothing to behavior because it's overwritten downstream.  
     - *Why*: Safety decisions require features that *drive* behavior. Decodability alone is insufficient; causal irrelevance means intervention won't help.  
     - *Distinction*: Ensures **used** (causally active) vs. **decodable** (probeable but inert) are separated.

  2. **Content Determinacy**  
     - *Requirement*: The theory must specify what a representation is *about* (e.g., "cat face" vs. "car front") without ambiguity.  
     - *Case*: A polysemantic unit firing for cat faces and car fronts.  
     - *Why*: Safety decisions (e.g., "represents minors") demand precise content. The theory must resolve whether it represents:  
       - Both (as a disjunction or superposition)?  
       - Neither (e.g., a lower-level feature like "curved edges")?  
       - Contextually determined (e.g., "cat face" only when other features co-occur)?  
     - *Constraint*: Must handle **superposition** (multiple features in one direction/unit).

  3. **Misrepresentational Capacity**  
     - *Requirement*: The theory must allow representations to be *false* (e.g., "Rome is in France").  
     - *Case*: A model reliably outputs "Rome is in France."  
     - *Why*: For the model to be wrong, it must represent something inaccurately. The theory must explain how a representation's content can mismatch reality (e.g., via flawed training data or inference).  
     - *Distinction*: Requires **representing-that** (propositional content, e.g., "that Rome is in France") not just **representing-as** (non-propositional, e.g., "Rome as a city").

  4. **Functional Equivalence**  
     - *Requirement*: Representations must be definable at a functional level, not an implementation level. Identical input-output behavior implies identical representational content.  
     - *Case*: Two models with identical behavior but different internals.  
     - *Why*: Safety decisions target *what* the model does (e.g., sycophancy), not how it's implemented. If both models behave identically, claims like "represents sycophancy" must hold for both or neither.  
     - *Constraint*: Must align with **distributed representations** (features live in directions, not neurons).

  5. **Contextual Robustness**  
     - *Requirement*: Representations must be stable across reasonable variations in input (e.g., prompt formats or tokenizers), not artifacts of specific conditions.  
     - *Case*: A "sycophancy direction" only appears under a specific prompt format.  
     - *Why*: Safety-critical features (e.g., "user is a minor") should persist across user interactions. Ephemeral "features" may be measurement noise.  
     - *Constraint*: Must accommodate **context-dependence** in neural nets without overfitting to quirks.

  6. **Existence Independence**  
     - *Requirement*: Representations must exist independently of our ability to detect them.  
     - *Case*: A feature demonstrably used by the model (e.g., via behavioral tests) but not found as a direction/unit/circuit.  
     - *Why*: Safety decisions can't rely on interpretability tools being perfect. The theory must allow for "dark representations" (undetectable but causal).  
     - *Constraint*: Must not require **localizability** (e.g., features may be distributed).

  7. **Ablation Resilience**  
     - *Requirement*: The theory must account for cases where ablation fails to change behavior, even for causal features.  
     - *Case*: Ablation of a feature does nothing due to redundancy or compensatory mechanisms.  
     - *Why*: Neural nets are robust; ablations often underdeliver. The theory must distinguish *causal efficacy* (feature is used) from *causal necessity* (model fails without it).  
     - *Constraint*: Reflects **redundancy** in neural networks.

  ---

  ### **Non-Negotiables, Tensions, and Knockout Tests**
  - **Non-negotiables**:  
    1. **Causal efficacy** (Req 1): *Not* doing unearned work. Safety decisions require interventions; if a feature isn't causal, acting on it is pointless. Your ablation case confirms this.  
    2. **Existence independence** (Req 6): We must allow for representations we can't find (e.g., "dark features"). Otherwise, the theory collapses into an interpretability tool.  
    3. **Misrepresentational capacity** (Req 3): Safety hinges on catching false beliefs (e.g., "Rome is in France").  

  - **Knockout requirement**:  
    - **Causal efficacy** (Req 1) eliminates the most theories. It rules out:  
      - Purely decoding-based accounts (fail the "ablation does nothing" case).  
      - Deflationary accounts (if representation is "just useful," efficacy is optional).  
      - Resemblance accounts (isomorphism doesn't imply causation).  

  - **Tensions (jointly unsatisfiable requirements)**:  
    - **Tension**: *Abundance* (neural nets contain many decodable features) + *Causal efficacy* (only some are causal) + *Existence independence* (representations exist beyond our detection).  
    - **Why**: If representations are abundant (due to superposition), many are decodable but not causal (violating efficacy). If we tie representation to causal role, we exclude decodable non-causal features—but existence independence demands we allow for undetectable *causal* features. No theory can simultaneously:  
      - Affirm all decodable features as "real" (abundance),  
      - Require all representations to be causal (efficacy),  
      - And guarantee features exist independently (existence).  
    - **Resolution for safety**: Prioritize **causal efficacy** and **existence independence**, treating decodable-but-non-causal features as *not* representations for safety purposes.  

  ---

  ### **Scorecard of Theories**
  - **Resemblance/Isomorphism Account** (e.g., neural patterns "mirror" reality):  
    **Fails**. Ignores causal efficacy (e.g., a direction may "mirror" minors but not affect behavior). Struggles with polysemy (one pattern can "mirror" cat faces *and* car fronts) and misrepresentation (if activations resemble "Rome in France," why is it false?). Collapses decodable vs. used.  

  - **Causal-Role Account** (e.g., represents X if it’s causally involved in X-relevant behavior):  
    **Best contender**. Handles causal efficacy (Req 1), misrepresentation (false inputs cause wrong outputs), and functional equivalence (same behavior → same role). Struggles with content determinacy (Req 2: is a polysemantic unit’s role "cat faces" or "curved edges"?) and existence independence (Req 6: hard to confirm undetectable causal roles).  

  - **Teleological Account** (e.g., represents X if trained/evolved to detect X):  
    **Mixed**. Excels at misrepresentation (e.g., a "minor detector" firing falsely) and content (grounded in training data). Fails functional equivalence (Req 4: differently trained models with same behavior may not "represent" identically) and contextual robustness (Req 5: training may not cover all prompts). Overly restrictive for emergent features.  

  - **Deflationary Account** (e.g., "representation" is a useful fiction for prediction):  
    **Fails safety needs**. Makes "represents X" true when pragmatic, but ignores causal efficacy (e.g., "useful" decodable features may be inert). Cannot handle misrepresentation (fictions aren’t true/false) or existence independence (depends on observer stance). Collapses all distinctions.  

  ---

  ### **Recommendation**
  For safety decisions, **causal efficacy is non-negotiable**—it's the only way to ensure interventions (e.g., ablating sycophancy) work. Pair it with a **causal-role account** (augmented with teleology for content determinacy) as the most viable foundation. Acknowledge the tension between abundance, efficacy, and existence: prioritize features that are both causal and robustly detectable. In practice:  
  - Use behavioral tests (e.g., input perturbations) to establish causality.  
  - Use multiple interpretability tools (e.g., activation editing + probing) to reduce false negatives.  
  - Avoid overindexing on decodable features without causal validation.  

  This spec exposes a no-go result: no theory satisfies all desiderata perfectly. But a causal-role approach delivers the true positives/negatives you need for safety, while flagging its own limitations (e.g., undetectable features).
