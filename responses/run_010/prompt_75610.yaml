  - The scoring: groups that made bold predictions (level 1) sometimes got big rewards, but sometimes big penalties. Some groups might have shifted to safer predictions to survive. But safer predictions don't advance knowledge as much. This relates to Popper's notion of bold conjectures and severe tests.

  Predictable problems:

  1. A group figures out the hidden mechanism early. For example, group 3 might notice that the numbers are always even. Then they might abandon their theory and start predicting even numbers. But they don't have an auxiliary about even numbers? They have a theory about increasing. To handle: if a group wants to change their core theory without being falsified, they can? But the rules don't allow that. They can only change when falsified. So if they are not falsified, they might keep their theory. But if they are falsified, they might revise to a new theory that fits. That's part of the process. If they do, note that they are now converging on the truth. But then they might win. That's okay.

  2. Group 2 (unreliable) might get very frustrated because they get odd numbers and they think the theory is true. They might burn all their auxiliaries and then have to revise or invent many patches. This is intended. They might blame the game. We can say in debrief that this is the point.

  3. The judgment phase might be contentious. Some groups might vote strategically to hurt others. We can make it that the vote doesn't affect points, so it's for discussion only.

  4. Scoring: groups might always choose level 3 to avoid big losses. But then they don't gain many points. The cost per round (1 point) will eat away at them. They might be forced to take risks if they are behind.

  5. Time: 4 rounds might run over. We can cut to 3 rounds if needed.

  6. Oracle overload: The teacher has to handle reporting outcomes to 4 groups individually. This might take time. Solution: after drawing the true card, immediately compute the reported value for group 2 (if needed) and then write on slips of paper for each group: "Round 1: [value]". Then hand them out quickly.

  7. Group 3 and 4 (false theory) might be falsified every round if the sequence isn't increasing. They might run out of points and auxiliaries. This is intended: they might abandon the theory.

  Fixes: If a group runs out of auxiliaries, they can only revise or invent. If they run out of points, they can go negative. It's okay, it's a game.

  What the activity cannot reproduce:

  - In real science, theories are more complex and testing takes years. The cost of falsification is not just points but careers.
  - The auxiliary assumptions are not easily discardable; they are deeply embedded in the scientific community's practices.
  - The judgment of ad hoc hypotheses is not done by vote, but by peer review and further testing.
  - The activity might oversimplify the Duhem-Quine problem by making auxiliary assumptions explicit on cards.

  After the game, the teacher will need to explain the philosophical context and connect it to real examples (e.g., the Michelson-Morley experiment and the ether theory, or the discovery of Neptune).

  Now, write the full activity.
answer: |-
  ### Falsificationism in Action: The Auxiliary Blame Game  
  *Designed for 16 students (4 groups of 4) in 75 minutes*  
  **Core Learning Goal**: Students experience the practical impossibility of "test and discard" falsification by confronting ambiguous failures, auxiliary assumptions, and the costs of bold predictions. They leave frustrated with simplistic falsificationism, primed for deeper discussion of Duhem-Quine, ad hoc hypotheses, and theory-laden observation.

  ---

  ### Brainstorming: Scoring Schemes  
  I considered three scoring approaches to incentivize bold predictions without gambling. All schemes start groups at 10 points and impose a -1 point/round "cost of doing science." Groups must predict every round (no skipping).  

  1. **Binary Risk-Reward**  
     - Predict "bold" (specific number: 10% chance) or "safe" (range/property: 30-70% chance).  
     - Bold: +4 if correct, -3 if wrong. Safe: +1 if correct, 0 if wrong.  
     - *Problem*: Safe becomes optimal long-term, discouraging boldness. Groups ignore falsification pressure.  

  2. **Graduated Betting**  
     - Groups bet points (1-3) on predictions. Win/lose bet amount based on accuracy.  
     - *Problem*: Feels like gambling, not science. Bankrupt groups disengage. Risk-averse groups bet minimally.  

  3. **Chosen Scheme: Information Gain Scoring**  
     - Rewards ruling out possibilities. Based on Popper’s "informative content."  
     - **Level 1 (Bold)**: Predict one number (rules out 90% of outcomes). +3 if correct, -2 if wrong.  
     - **Level 2 (Medium)**: Predict two numbers or one binary property (e.g., "even"; rules out 50%). +2 if correct, -1 if wrong.  
     - **Level 3 (Cautious)**: Predict three numbers or one broad property (e.g., ">3"; rules out 30%). +1 if correct, 0 if wrong.  
     - *Why chosen*:  
       - Matches scientific value: bold predictions risk more but advance knowledge.  
       - Cautious predictions yield diminishing returns (net loss over time: -1 cost +0/+1).  
       - Groups must engage falsification to avoid point decay.  

  **Added Falsification Costs**: When wrong, groups pay extra to save their theory:  
  - Revise core theory: -5 points.  
  - Burn auxiliary card: -2 points.  
  - Invent new patch: -1 point + judgment risk.  

  ---

  ### Full Activity Rules  
  **Materials Prep** (Night Before):  
  - **Index Cards**:  
    - **Theory Cards** (Write exactly):  
      - Group 1 (True Theory, Reliable Instrument): *"The number is always even."*  
      - Group 2 (True Theory, Unreliable Instrument): *"The number is always even."*  
      - Groups 3 & 4 (False Theory): *"The number increases by at least 1 each round (first round: no prediction)."*  
    - **Auxiliary Cards** (One set per group):  
      - Groups 1 & 2: Aux1—*"Instrument is 100% accurate."* Aux2—*"Deck contains only even numbers."*  
      - Groups 3 & 4: Aux1—*"Instrument is 100% accurate."* Aux2—*"Deck contains numbers 1-10."*  
    - **Sealed Envelopes**: Each contains one theory card and two auxiliary cards. Mark envelopes "Group 1," "Group 2," etc.  
  - **Playing Cards**:  
    - **"Truth" Deck**: Remove all odd cards and face cards. Keep only even-numbered cards (2,4,6,8,10) from all suits (20 cards total). Shuffle.  
    - **"Error" Deck for Group 2**: Use a separate deck. Keep all cards 1–10. Shuffle.  
  - **Paper/Pencils**: For predictions, patches, and score tracking.  
  - **Timer**: For round management.  

  **Hidden Mechanism**:  
  - The true value is always even (drawn from Truth Deck).  
  - **Outcome Reporting**:  
    - Groups 1, 3, 4: Get true value.  
    - Group 2 (Unreliable Instrument): 80% true value, 20% error (flipped parity).  
      - *Procedure*: After drawing true card, draw from Error Deck. If card is a **2 or 3** (20% chance), flip parity:  
        - *Even truth* → Report nearest odd (e.g., 4 → 3 or 5; flip coin or choose randomly).  
        - *Odd truth* (impossible, but for rigor): Add 1 (e.g., 5 → 6).  
      - If not 2 or 3, report true value.  
  - **Sequence Note**: For false theories (Groups 3/4), track previous number. Round 1 has no "increase" prediction.  

  **Game Rules** (Explain to Students):  
  1. **Goal**: Maximize points by testing your theory. Highest score wins.  
  2. **Predictions**: Each round, all groups predict using one level (1–3). Write:  
     - *Level, Prediction* (e.g., "Level 1: 4" or "Level 2: Even").  
     - Hand prediction to teacher.  
  3. **Outcomes**: Teacher draws from Truth Deck, reports outcomes individually (on paper slips).  
  4. **Falsification**: If prediction wrong, choose one:  
     - **Revise Core**: Announce new theory to class. Pay -5 points. Replace theory card.  
     - **Burn Auxiliary**: Discard one auxiliary card. Pay -2 points.  
     - **Invent Patch**: Create new auxiliary (e.g., "Gravity interfered"). Write it down. Pay -1 point. It may be judged later.  
  5. **Scoring**:  
     - Start: 10 points.  
     - Each round: -1 point (cost of science) + prediction outcome (Level 1/2/3 rewards).  
     - Track scores publicly (whiteboard not needed; announce periodically).  
  6. **Judgment Phase** (After Round 2):  
     - Groups with patches read them aloud.  
     - Rule: *"A legitimate patch must be independently testable—not just explain this one failure."*  
     - Groups vote "Legit" or "Ad Hoc" for each patch (no scoring impact).  

  **Timeline** (75 Minutes Total):  
  - **0–5 min**: Intro. *"You’re scientists testing a theory. Predict outcomes, gain points for accurate/bold predictions. If wrong, save your theory at a cost. Goal: Maximize points."* Distribute envelopes.  
  - **Round 1 (5–15 min)**:  
    - Predict (5 min): Groups write predictions.  
    - Oracle (3 min): Draw Truth card (e.g., 6). For Group 2, draw Error card (if 2 or 3, flip to 5 or 7). Report outcomes.  
    - Falsification Response (5 min): Wrong groups choose action. Collect responses.  
  - **Round 2 (15–25 min)**: Repeat prediction/oracle/response.  
  - **Judgment (25–30 min)**: Patches presented and voted on. *"Apply the rule—no wishy-washy votes!"*  
  - **Round 3 (30–40 min)**: Prediction/oracle/response.  
  - **Round 4 (40–50 min)**: Prediction/oracle/response. Final scores tallied.  
  - **Debrief (50–75 min)**: Structured discussion (details below).  

  ---

  ### Oracle Procedure  
  - **Truth Deck Setup**: 20 even cards (2,4,6,8,10 x 4 suits). Shuffle before each draw.  
  - **Error Deck for Group 2**: Standard deck (1–10 cards). Shuffle before each Group 2 test.  
  - **Efficiency Hack**: Pre-draw Truth cards for all rounds to save time. For Group 2, pre-roll errors (list 20% error rounds).  
  - **Reporting**: After drawing, write outcomes on slips:  
    - *Group 1: [true value]*  
    - *Group 2: [reported value]*  
    - *Group 3: [true value]*  
    - *Group 4: [true value]*  
    Hand slips simultaneously to groups.  

  **Sample Rounds** (Illustrative):  
  - **Round 1 Truth**: 6 (even).  
    - Group 1 Prediction: Level 1 "6" → Correct! +3 -1 = +2 net.  
    - Group 2 Prediction: Level 2 "Even" → Error card 2 (flip to 7). Wrong! Choose: Burn Aux1 (-2).  
    - Group 3 Prediction: Level 3 ">3" → Correct! +1 -1 = 0 net.  
  - **Round 2 Truth**: 4 (even).  
    - Group 3 Prediction: Level 1 "5" (since increased from 6? Wait, 6→4 decrease) → Wrong! Invent patch: *"Quantum fluctuation reversed the trend."* (-1).  

  ---

  ### Debrief Script (50–75 min)  
  **Map Game → Philosophy Explicitly**:  
  - **Frustration Check**: *"Raise hands if you felt your theory was right but got punished anyway."* Then:  
    - *"Group 2’s reliable instrument was a lie. When you burned auxiliaries to save a true theory, you felt Duhem-Quine: failures blame auxiliaries, not cores. Reality? Instruments are fallible—falsification is noisy."*  
  - **Boldness Trade-off**: *"Group 3, you switched to Level 3 after losing points? That’s Popper’s dilemma: bold predictions risk death, but safe ones don’t learn. Science rewards risk, but survival punishes it."*  
  - **Judgment Failure**: *"When you voted on patches, the ‘independently testable’ rule felt impossible. Was Group 4’s ‘solar flare’ testable? Maybe... but how? This is ad hoc ambiguity—Popper’s demarcation fails in practice."*  
  - **False Theory Sunk Cost**: *"Groups 3/4, you kept an increase theory despite chaos. That’s Lakatos: we protect ‘research programs’ until alternatives exist. Falsification doesn’t happen in a vacuum."*  

  **Key Points to Stress**:  
  1. **Duhem-Quine Thesis**: Tests target theory + auxiliaries. Blame is underdetermined (Group 2 burning Aux1).  
  2. **Ad Hoc Hypotheses**: Patches (e.g., "quantum fluctuation") are unfalsifiable without new tests—yet science uses them (e.g., dark matter).  
  3. **Theory-Laden Observation**: Group 2’s "errors" weren’t their fault—observation is mediated by instruments/assumptions.  
  4. **Boldness vs. Survival**: Scoring forced trade-offs; real science has grants/tenure pressures.  

  **Close**: *"Today, you paid a price for ‘test and discard.’ Next class, we name these problems: Duhem-Quine, ad hoc rescue, and why Popper’s falsificationism is a philosophy of science, not a manual."*  

  ---

  ### Predictable Problems & Fixes  
  1. **Group 2 Gets Demoralized**:  
     - *Problem*: Unreliable instrument causes repeated falsification. Group burns cards/points, feels cheated.  
     - *Fix*: In debrief, validate frustration—*"This was the point! Real scientists face noisy data."* Prep tissues for overly annoyed students.  

  2. **Scoring Gamed with Level 3**:  
     - *Problem*: Groups ignore boldness, always choosing Level 3 to minimize losses. Scores decay slowly.  
     - *Fix*: Announce mid-game: *"Leading groups must use Level 1 or 2 in the next round."* Or mock safe play: *"Congratulations, you’ve achieved tenure—but no one cites you."*  

  3. **Group Figures Out Mechanism Early**:  
     - *Problem*: Group 3 notices all numbers even, abandons "increase" theory prematurely.  
     - *Fix*: Force them to test their assigned theory. If falsified, they can revise—but penalize -5 points. *"Real scientists can’t jump ship without cost."*  

  4. **Judgment Vote is Chaotic**:  
     - *Problem*: Groups vote "ad hoc" on rivals’ patches without discussion.  
     - *Fix*: Require one pro/con comment per voter. *"Defend your vote using the rule—or it doesn’t count."*  

  5. **Oracle Overload**:  
     - *Problem*: Four groups demand attention during falsification phase.  
     - *Fix*: Use response slips (groups write action and hand in). Pre-drawn Truth cards save time.  

  6. **False Theory Groups Give Up**:  
     - *Problem*: Groups 3/4 face constant falsification, disengage.  
     - *Fix*: Secretly boost points: *"You found an anomaly! +2 points."* Or cheerlead: *"Newton’s theory lasted 200 years with patches—keep trying!"*  

  ---

  ### What This Activity Cannot Reproduce  
  1. **Long-Term Scientific Dynamics**: Real theories evolve over decades; this compresses to minutes. Post-game, discuss historical examples (e.g., Mercury’s orbit falsified Newton, but Einstein offered an alternative).  
  2. **Social/Institutional Pressures**: Peer review, funding, and prestige aren’t modeled. Mention: *"In reality, burning an auxiliary might cost your career, not 2 points."*  
  3. **Holism of Auxiliaries**: Auxiliary assumptions are deeply embedded (e.g., math, logic), not discrete cards. Note: *"Quine: our entire web of belief faces the tribunal, not single theories."*  
  4. **No Cumulative Progress**: Groups don’t build on others’ work. Assign a reading on Kuhn’s paradigms for contrast.  

  **After-Action Talking Points**:  
  - *"Duhem-Quine isn’t an excuse—it’s a constraint. Scientists use heuristics (e.g., blame simpler auxiliaries first) and consensus."*  
  - *"Falsificationism’s power is normative (aim for bold tests!), but descriptively flawed. That’s why Lakatos and Feyerabend rebelled."*  

  ---  
  **Final Note**: This game will frustrate students—that’s the design. Lean into the chaos. When a group groans at burning their last auxiliary, smile and say: *"Science is hard, isn’t it?"**
