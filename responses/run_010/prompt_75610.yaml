prompt: |-
  You're an expert on philosophy of science pedagogy and on actually getting card games to work mechanically — you've designed a bunch of classroom simulations and you know which ones collapse in practice. Think carefully about the mechanics before you commit to them, and start your reply with a short brainstorming section (half a page, bullet points) where you sketch two or three different scoring schemes and say which one you picked and why. Then write up the full activity.

  Context: I'm teaching a philosophy of science seminar, 16 students, one 75-minute slot, and I want to run something on falsificationism. Not a lecture on it — a game where the students hit the problem themselves before anyone says a technical term. I want them to leave having felt, in their gut, that "just test it and throw it out if it fails" is not something you can actually do, and to have felt it as a cost they personally paid rather than a clever argument they read about. I'm fine with them being a bit annoyed at me by minute 60.

  Materials: index cards, paper, pencils, a deck of playing cards, and a timer. No money, no apps, no printing beyond what I can do the night before. I have no TA, so whatever the "oracle" role needs to do has to be doable by me alone while four groups are all trying to get my attention — build that constraint into the design, and tell me if it's fatal.

  Here's roughly what I have in mind, but push back on any of it if there's a better way:

  - Each group draws a sealed envelope containing a theory card and a small stack of auxiliary assumption cards. The theory card makes three or four claims about a hidden mechanism that the groups are trying to figure out.
  - Crucially, at least two groups should get a theory that is largely TRUE but is attached to an unreliable instrument, so that a real falsifier shows up anyway. The groups can't tell from the outside which situation they're in. If you can make a third group get a theory that's genuinely false, do it.
  - Every round, groups write down a prediction, then I generate an outcome, then groups that got falsified have options: eat it and revise the core, or burn one of their auxiliary cards to deflect the failure, or invent a brand new patch on the spot in front of everyone. Each option needs a different price attached.
  - The scoring has to reward bold predictions and punish safe ones, otherwise everyone will just predict nothing and coast. I don't know how to make that work without the game turning into pure gambling — that's the main thing I need you to solve.
  - Somewhere in there I want a moment where groups have to judge whether another group's patch was a legitimate fix or just face-saving, and where the rule I give them for making that judgment turns out to be impossible to apply cleanly. Make them discover that, don't announce it.

  What I need from you:

  1. Complete rules, the scoring scheme with actual numbers, and a round-by-round timeline adding up to about 75 minutes including the debrief.
  2. The exact text of every card I need to write out: theory cards, auxiliary cards, whatever the oracle uses. Write out the hidden mechanism too, plus the full procedure for how I produce outcomes from a shuffled deck of playing cards, including how I generate the occasional result that looks like a falsifier even when the theory is right. I should be able to sit down and manufacture the whole thing with no further thinking.
  3. A debrief that maps specific moments in the game onto the philosophical points — name them at that stage, not before. I want the mapping to be explicit: "when group 2 burned their third card to save the core, that was X."
  4. A candid list of what will predictably go wrong the first time I run this: where the scoring gets gamed, where a group will get bored or get humiliated, which rule students will misread, what happens if a group figures out the hidden mechanism in round 2. Tell me the fix for each.
  5. An honest note on what this activity cannot reproduce about the real debate, and what I'm going to have to supply by talking afterwards.

  Please don't give me a bibliography, a reading list, or citations — I'm not assigning anything and I don't want you guessing at page numbers. No links, no "for further reading." Everything should be self-contained in what you write, including any short speeches you want me to say out loud. Keep it usable: if the card texts need to be terse so they fit on an index card, write them terse.
