  My opening: fine, I'll grant the Weymark point entirely. The individual Bernoulli functions in the theorem are just the social observer's own cardinal utilities of each person's situation — the math never establishes that my utility and yours live on a common scale, it just assumes one outcome space and one set of probabilities that everyone shares. So the sum in the conclusion is a sum of one observer's own evaluations. Which means the theorem can't be a discovery about ethics at all. All it says is: if you're a coherent expected utility maximizer over other people's situations, and your evaluation of a lottery doesn't change depending on whose shoes you're imagining yourself in, then your overall evaluation is the average of the shoe-by-shoe evaluations. That's arithmetic about a single imagination. The utilitarian conclusion is smugled in as the empathy-and-impartiality assumption, and the theorem is a tautology wearing a lot of notation. Your move.
