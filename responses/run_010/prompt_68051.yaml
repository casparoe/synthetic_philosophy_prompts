answer: |-
  You're still missing the force of the axioms. Yes, the observer constructs the individual utilities from their own perspective. But the *impartiality and empathy requirements* embedded in the axioms – specifically, that the social observer's preferences over *identity-dependent* lotteries must be **symmetric** across individuals and respect each person's own risk attitudes – are profound ethical constraints. They force the observer to step *entirely outside their personal interests* and adopt a genuinely neutral standpoint when evaluating outcomes involving different people.

  This isn't just "one person's bookkeeping." It's a demonstration that **any rational, impartial agent**, evaluating social states under uncertainty while respecting the separateness of persons and their individual attitudes towards risk, *must* evaluate those states as if maximizing the average expected utility. The 'tautology' charge is backwards: the theorem *derives* the specific utilitarian form *from* these fundamental ethical commitments to impartiality and empathy. It shows *why* a coherent, impartial moral view takes that shape.
