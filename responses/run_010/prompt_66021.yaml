  The temporary intrinsics solution (3) might actually help with the time travel point (5). If they're already using irreducible "at t" for properties, extending it to include personal time coordinates for time travelers could work cleanly. That's actually a nice synergy. 

  Eternalism (2) seems compatible with everything else. The user's right that relativity supports eternalism without conflicting with endurantism. Smart move to note that upfront. 

  Now ranking the issues: The statue/lump contradiction is definitely tier 1 - it breaks their own stated principles. Tier 2 is the temporary intrinsics view making persistence conditions mysterious, which becomes critical when combined with their statue/lump view. Tier 3 is just a potential complication with time travel that can be resolved. 

