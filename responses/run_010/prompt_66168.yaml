answer: |-
  ## Eulogy for Professor Vera Lindqvist

  Good morning. We gather today to remember Vera Lindqvist. Not just her formidable intellect, or her astonishing dedication – forty-one seasons in a single river valley, save for two brief interruptions – but the woman herself. The woman who, in 1979, pointed at a cassowary crossing a clearing and asked her very first question in Kalvashi. The man who answered her, *tiruké*, is with us today, along with two other elders from the valley she called home for so much of her life. We are deeply honoured by your presence.

  Most of us here knew Vera through her work. The Kalvashi dictionary, nine thousand entries strong. The reference grammar. For linguists, these are monumental achievements, the only ones of their kind for a language isolate spoken by four thousand people in four villages. They are bedrock. For her family, especially Janna, who wisely knew that forty minutes of linguistic jargon wasn’t for her today, Vera was simply Mum, Grandma, a force of nature who brought the scent of rainforest earth and distant places back with her. And for her colleagues and students, myself included, she was a brilliant, demanding, fiercely committed scholar.

  Vera was a field linguist. Her lifeblood was the meticulous, patient, often frustrating work of listening, asking, noting, checking, and checking again. She built her dictionary one word, one phrase, one careful question at a time. She demanded precision from herself and from us. She could recall elicitation sessions from decades prior, and a single frown from one of the elders, like those here today, could send her back to rework an entry for years. This wasn't about chasing some mythical perfect meaning. It was about responsibility. Responsibility to the language as it was lived.

  Which brings us to the cassowary. The word *tiruké*. And Miles Trethewey, sitting right there, who loved Vera deeply and argued with her passionately for thirty years. Miles believed Vera’s evidence couldn’t definitively prove that *tiruké* meant simply the cassowary itself, the whole creature you and I might point to. Could it mean just the part crossing the clearing? Just that moment in time? Or even the event of crossing itself? Vera, being Vera, agreed Miles was right. Her evidence couldn’t absolutely exclude those possibilities. But she also thought, profoundly, that this didn’t undermine the dictionary one bit. It didn’t stop her revising that entry for another twenty years.

  That was Vera. She understood, in her bones, the philosopher Quine’s point about the indeterminacy of translation – that pinning down meaning perfectly, absolutely, across languages, is more complex than finding a one-to-one map. There might not be a single, final, determinate fact of the matter about whether *tiruké* picks out the whole bird forever or just its leg in that instant, in some abstract philosophical sense. She embraced that.

  But here’s the crucial thing: Vera’s dictionary wasn’t answerable to abstract philosophical proofs. It wasn’t chasing ghosts of perfect meaning. It was answerable to the living speech of the Kalvashi community. It was answerable to the patterns of usage, to the way words were spoken and understood *here*, in this world, by these people, in their lives. It was answerable to the elders who patiently guided her, session after session, year after year. Her relentless revisions, her attention to a frown, her refusal to settle – that was her profound respect for that reality, for the shared practice of language. The dictionary’s authority came not from claiming an impossible, final correctness, but from its meticulous fidelity to the complex, evolving fabric of how Kalvashi was actually spoken. That was the ground she stood on, firmly and without apology, even while acknowledging the philosophical winds swirling above.

  *(Pause. Turn slightly towards the interpreter and the three elders)*

  So, to our honoured guests from the valley, I say this directly: Vera often spoke of her profound debt to your community. Her work began with your words, your patience, your guidance. The dictionary and grammar exist because you shared your language with her, year after year. She saw them not as capturing something frozen, but as a record of the living speech she learned *from you*. Her respect for your knowledge, and her gratitude for your partnership over so many seasons, was immense. We remember her today, in large part, because of what you gave her.

  To everyone: Vera Lindqvist didn’t chase meanings because she thought they were lonely phantoms or impossible to grasp. She chased them because they mattered, right there in the valley. She built something real, something vital, out of respect for the speakers and the intricate patterns of their words. She showed us that rigorous work thrives *within* the understanding that language is complex and meaning is woven into use, not diminished by it. Her legacy isn't a perfect map to an unreachable truth, but an enduring testament to the power of listening carefully, working meticulously, and respecting the living reality of language and its speakers. That’s the work she loved. That’s the Vera we honour. Thank you.

  ---

