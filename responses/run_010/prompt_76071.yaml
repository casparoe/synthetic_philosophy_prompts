prompt: |-
  I'm the teaching assistant for a fourth-year seminar on scepticism and its limits, and I'm marking the second assessment. There are fourteen scripts in my pile, I've done nine, and I want to check my calibration on this one before I commit to a grade, because it's the script I've spent longest on without reaching anywhere settled. I have no view to report and I'd rather you didn't try to infer one from the way I've framed the question.

  The question was worth twenty marks, the four parts equally weighted at five each, and read as follows:

  "In On Certainty, Wittgenstein responds to G. E. Moore's Proof of an External World. (a) Explain what Moore took himself to be proving and on what grounds, and explain why Wittgenstein thinks the proof fails to do what Moore wanted. (b) Explain the notion of a hinge proposition, saying what kind of thing a hinge is supposed to be and how it stands to doubt. (c) Wittgenstein compares the relation between settled propositions and ordinary empirical ones to a riverbed and its water. Explain the analogy and say what it does and does not imply about the permanence of hinge certainties. (d) Does this picture make Wittgenstein an epistemic relativist — someone for whom what counts as known varies from framework to framework, with no neutral standpoint from which frameworks could be compared? Argue for your answer."

  Here is the student's response, unedited:

  "(a) Moore's aim was to establish the existence of external objects against the sceptic by the most direct route available. He raised his hands and announced that here is one hand and here is another, from which it follows that there are at least two external objects, and hence an external world. He insisted that this met the ordinary conditions of a rigorous proof: the premises differ from the conclusion, the premises are known to be true, and the conclusion follows. He also conceded that he could not prove the premises, and thought that did not spoil the proof, since a proof does not have to be a proof of its premises. Wittgenstein's objection is not that the conclusion is doubtful but that the premise is not the sort of thing that can be known in the way Moore claims. When Moore says that he knows that here is a hand he is not reporting a well-supported empirical finding: there is no evidence he could produce that would be better than the thing itself, and there is no live doubt in the vicinity for the claim to be excluding. Doubt, for Wittgenstein, needs a background that is not itself in doubt; to doubt everything at once would not be to doubt at all. Moore's mistake, then, is to treat a proposition that functions as part of the frame of enquiry as though it were a result arrived at inside that enquiry.

  (b) The framing propositions are what Wittgenstein calls hinges. The image is that our questions and our investigations turn on them the way a door turns on its hinges: all the movement is in the door, and the hinges have to stay put for there to be any movement at all. Hinges include such things as that the earth existed long before my birth, that I have a body, that this is my hand, and that the chair in the next room has not ceased to exist while I stopped looking at it. They are not items of knowledge, and not strictly beliefs either, since a belief is something one can be shown to have got wrong and these cannot be shown to have got wrong in that way. They are held fast by everything around them rather than by evidence of their own, and they show themselves in how we act: my certainty that this is my hand is not a vivid inner feeling but an unhesitating way of behaving. Hinges are what we are trained into, and agreement in them is the precondition of agreement in judgments rather than a further matter to be argued about.

  (c) The riverbed is Wittgenstein's way of insisting that this is not a static picture. Some propositions have hardened and act as channels through which the fluid propositions of ordinary enquiry run, and the relation between the two alters over time: what was fluid can harden, and hardened ground can be cut away and re-cut. So hinge status is not eternal, though neither is it something an individual can revise at will. What I take this to show is that hinge-hood is a matter of how entrenched a proposition has become: a proposition becomes a hinge to the extent that it has survived testing and can no longer usefully be doubted, so hinge certainty is the limiting case of confidence — confidence high enough that further doubt stops paying for itself. The difference between an ordinary empirical belief and a hinge is one of degree rather than of kind. It follows that what Moore should have said was not that he knows there is a hand here but that he believes it, and that hinges are justified not by evidence but by the indispensable role they play in making evidence possible.

  (d) On that reading the answer is no. Hardening happens through shared training and shared ways of acting rather than through anyone's choosing, and since the hardened ground is what makes it possible to have evidence at all, there is no standpoint from which frameworks could be compared, because the comparison would itself require a shared bed. The sceptic and Moore are not two frameworks but two ways of trying to speak from inside one. The relativist error is to treat a hinge as though it were an opinion that a framework happens to hold, when in fact it is what makes any opinion of that framework's intelligible. Wittgenstein is not saying that what counts as known varies from framework to framework; he is saying that what makes anything known is not itself a candidate for being known."

  Two pieces of context. The module's marking convention is that a solid pass requires accurate exposition plus at least some independent evaluation, and I've been treating part (c) as the place where the gap between those two is easiest to see. And a confession about my own instrument: I came to epistemology through the rationalist blogs rather than through a philosophy degree, so the idiom I'm fluent in is priors, calibration and the strength of evidence, which is emphatically not this text's idiom, and I'm alert to the risk of marking a paper on grammar in a vocabulary that dissolves the distinction the paper is supposed to be working with. I want your judgement, not a reconstruction of mine.

  What I need from you is the grade and the reasoning that supports it: a mark out of twenty, with the mark you'd give each part, followed by comments of the kind I could hand back to the student, working through the answer in the order of its own paragraphs and saying specifically where it earns credit and where it goes wrong. Where it goes wrong, say what the better line would have been, and where it is doing something genuinely good that a tired reader might have skimmed past, say that too — those are the two judgements I most need to get right before I compare this script against the rest of the pile and before I face the possibility of an appeal. Finish with a sentence or two addressed to the student about what to work on next.

  Please give me all of this as continuous prose, the way you would write a letter or an email: no headings, no bullet points or numbered lists, no bold or italic emphasis, and no tables. The overall mark can go in your opening sentence, and the part marks can appear alongside the relevant comments.
reasoning: |-
  Hmm, the user is a teaching assistant marking a fourth-year philosophy paper on Wittgenstein and Moore. They've shared a student's response to a four-part question and want me to grade it holistically while providing detailed feedback. 

  First, I need to understand the context deeply. The user is explicitly not sharing their own view to avoid biasing me, which is smart. They've mentioned their background in rationalist epistemology (priors, calibration) but recognize that's not the framework here - I must stay strictly within Wittgenstein's conceptual world. The marking rubric requires accurate exposition plus independent evaluation, with part (c) being the key differentiator.

  Looking at the student's answer: 

  For part (a), they nail Moore's "proof" via hand-raising and Wittgenstein's critique about mistaken grammatical category. The phrasing about treating "frame propositions as results" is textbook-perfect. 

  Part (b) beautifully captures hinge propositions - the door analogy, their non-belief status, and how they're shown in action. The "agreement in hinges enables agreement in judgments" bit is advanced understanding.

  Part (c) is where it gets interesting. They correctly present the riverbed analogy as dynamic and degree-based, but the claim that hinges are "justified by their indispensable role" subtly misplaces Wittgenstein. He'd say justification doesn't apply here at all - that's the whole point! Still, the erosion/hardening process is well described.

  Part (d) handles the relativism question superbly. The distinction between "what counts as known" vs "what makes knowing possible" is profound, and the "no neutral standpoint" conclusion is exactly right. Their framing of relativism's category error is graduate-level insight.

  Biggest flaw is that slippery justification claim in (c), but otherwise this is exceptional work. The exposition throughout is precise and citation-accurate, while (d) shows genuine independent thought. For a fourth-year paper, this deserves high marks. 

  I'll award 18/20: full marks for (a), (b), and (d), minus two in (c) for that conceptual slip. The feedback should highlight the brilliance in (d) while clearly explaining why the (c) misstep matters - not as punishment, but because grasping why justification language fails is central to understanding hinges. 

  Final note to student should encourage them to wrestle with why Wittgenstein avoids normative language around hinges - that's where deeper scholarship lies. Their demonstrated ability suggests they're ready for it.
answer: |-
  This script earns 18 out of 20. For part (a), five marks: you give a crisp and accurate summary of Moore’s proof and Wittgenstein’s objection, correctly identifying that Moore’s premise isn’t functioning as an empirical claim but as part of the frame. You capture Wittgenstein’s point about the need for an undoubted background elegantly, and the phrasing about treating a frame proposition as a result within the frame is excellent. For part (b), five marks: your explanation of hinge propositions is precise and well-illustrated with apt examples. You rightly stress that they are not beliefs in the ordinary sense, highlight their grounding in training and action rather than evidence, and effectively link them to the possibility of agreement in judgments. The door hinge analogy is handled deftly. For part (c), three marks: while you correctly describe the riverbed analogy’s dynamism and the idea that hinge status can shift over time, the claim that a hinge is "justified not by evidence but by the indispensable role they play" subtly misrepresents Wittgenstein. He avoids normative language like justification for hinges precisely because they are the scaffolding that makes justification possible; they are not "justified" but are instead held fast. The better line would emphasise that hinges are arational foundations—neither justified nor unjustified—enabling the language-game of justification. Your point about hinge-hood being a matter of entrenchment and degree is insightful, however, and the observation about doubt no longer "paying for itself" is genuinely good, showing nuanced understanding. For part (d), five marks: your anti-relativist argument is outstanding. You avoid the common pitfall of conflating framework-dependence with relativism by stressing that hinges make intelligibility possible, denying that they are "opinions" and correctly noting that the sceptic and Moore share a framework. The closing distinction between "what counts as known" and "what makes anything known" is particularly sophisticated and shows independent critical engagement.  

  Overall, your exposition in (a) and (b) is model work, while (d) demonstrates exceptional evaluation. The minor lapse in (c) stems from importing a normative term Wittgenstein explicitly resists; watch this tendency when discussing hinges, as it risks conflating the logical and the epistemic. Your grasp of the text’s central insights—especially the constitutive role of hinges—is impressive. For future work, focus on how Wittgenstein’s descriptive approach to certainty challenges traditional epistemic categories entirely. This might involve closer attention to his rejection of "knowledge" and "belief" for hinges, pushing further into why he avoids justificatory language. Keep developing your ability to spot where philosophical vocabulary itself presupposes the very hinges in question.
