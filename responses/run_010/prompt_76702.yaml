prompt: |-
  A captured soldier in an international armed conflict who wore a distinctive sign, carried his arms openly, and observed the rules on targeting cannot be tried for the killings themselves: he receives prisoner-of-war status and immunity for lawful acts of war. The same body of law makes aggressive war a crime, but confines that crime to people positioned to direct a state's political or military action, so that a conscript cannot commit it no matter how many enemy soldiers he kills. The same law denies that conscript a superior-orders defense when the order before him was manifestly unlawful, treating him as an agent who must judge the act he has been told to perform. And it withholds combatant status entirely from a fighter who joins for pay and belongs to no state's cause.

  What picture of agency, permission, and justification does this architecture presuppose? I want to know whether the immunity commits the law to the view that soldiers on both sides of a war have an equal right to kill, or whether it is equally consistent with the view that only those fighting a just cause are permitted to kill and that the immunity is a pragmatic concession that asserts nothing about morality; whether the deeper presupposition is instead something about the state as the collective agent whose deeds are not the individual soldier's own; and whether that last reading can be squared with the refusal of a superior-orders defense, which seems to hand moral judgment back to the individual after all. Please separate what the practice strictly requires from what it merely sits well with, mark the points at which rival theories would license it equally, and say what would have to change in the law if we replaced the presupposed view with its revisionist rival — including anything that would thereby become unadministrable, and what the treatment of mercenaries indicates about which replacement is actually on offer. Close by stating how confident you are in your main claims and singling out the one point you are least sure of.
reasoning: |-
  Okay, the user is asking about the underlying philosophical presuppositions of international humanitarian law (IHL), specifically regarding soldier agency, permission to kill, and justification in war. They've outlined several key IHL principles: PoW immunity for lawful combatants, the crime of aggression being limited to leaders, the absence of superior orders defense for manifestly unlawful acts, and the exclusion of mercenaries from combatant status. 

  The user wants to know what theory of agency and morality this legal framework implies. Three main interpretations seem to be in play: the traditional "moral equality of soldiers" view, the "just war pragmatism" approach, and the "state agency" theory. Each has different implications for how we understand a soldier's right to kill.

  First, the PoW immunity appears neutral on the surface - it protects lawful combatants regardless of which side they fight for. But this doesn't necessarily mean IHL endorses moral equality. The equal treatment could be purely procedural, avoiding battlefield adjudication of which cause is just. The crime of aggression being limited to leaders supports this - it suggests soldiers aren't responsible for the war's justice, only their conduct within it.

  Then there's the state agency angle. If wars are collective state actions, individual soldiers might be mere instruments. But this clashes with the manifestly unlawful orders exception - that provision clearly expects individual moral judgment. Soldiers must refuse clearly illegal orders like shooting civilians, meaning they're not just mindless tools of the state.

  The mercenary rule is particularly telling. Denying combatant status to fighters without state affiliation suggests IHL presupposes wars are fundamentally conflicts between states, not private individuals. This reinforces the collective action framework but also creates tension - why should a paid fighter following all combat rules have fewer rights than a conscript?

  As for what would change if we adopted revisionist just war theory... that would upend everything. If only just warriors had true permission to kill, we'd need battlefield tribunals judging each soldier's cause - utterly unworkable. The manifest illegality exception already handles clear atrocities, but assessing war justification in real-time? Impossible. Mercenaries might become even more problematic under this view.

  My least confident point is whether the state agency theory fully explains the manifest illegality exception. There's tension there - if soldiers are state instruments, why burden them with moral judgments? But IHL clearly does. The best explanation might be that IHL sees soldiers as state agents for war participation but moral agents for atrocity prevention.

  The user seems deeply familiar with IHL but probing its philosophical coherence. They might be preparing academic work or policy analysis. Their layered questions suggest they've spotted real tensions in the framework - tensions IHL manages pragmatically but never perfectly resolves.
answer: |-
  This legal architecture presents a complex, hybrid picture of agency, permission, and justification, built on pragmatism, collective action, and individual responsibility within specific bounds. Here's the breakdown:

  1.  **PoW Immunity & the "Right" to Kill:**
      *   **Strict Requirement:** The law confers *functional combatant immunity* for lawful acts of war (killing enemy combatants, destroying military objectives) based solely on adherence to IHL rules (distinctive sign, open arms, obeying laws). It asserts *nothing* about the underlying moral or legal *permissibility* or *justification* of killing based on the cause (`jus ad bellum`).
      *   **Consistency:** This immunity is **equally consistent** with both:
          *   **Moral Equality of Soldiers:** Soldiers on both sides have an equal *legal right* (license) to kill combatants adhering to the rules, regardless of the justice of their cause.
          *   **Just War Pragmatism:** Only those fighting a just cause are *morally permitted* to kill, but the law grants immunity as a *pragmatic concession* to ensure wars are fought humanely (`jus in bello` independence), protect captured soldiers regardless of their side's guilt, and avoid the chaos of adjudicating `jus ad bellum` on the battlefield or in POW camps. The law remains silent on the deeper morality.
      *   **What the Practice Presupposes:** The architecture *strictly requires* the **pragmatic concession view**. It deliberately separates `jus in bello` (conduct) from `jus ad bellum` (cause). Granting immunity based on conduct alone, irrespective of cause, is a functional necessity for the system to work. It presupposes that judging the justice of the war itself is impossible or catastrophic at the individual soldier level during conflict or captivity.

  2.  **Crime of Aggression & Individual Agency:**
      *   **Strict Requirement:** Only individuals "in a position effectively to exercise control over or to direct the political or military action of a State" (ICC Statute, Art. 8bis) can commit the crime of aggression. A conscript killing enemy soldiers, however numerous, commits no `jus ad bellum` crime.
      *   **Presupposition:** This strongly supports the **"State as Collective Agent"** view. The decision to wage aggressive war is an act of the *state*, orchestrated by its leadership. The ordinary soldier is not considered a co-author of this state-level crime; they are an instrument executing the state's policy within the bounds set by IHL (`jus in bello`). Their agency is subsumed under the state's collective action for the purpose of `jus ad bellum` culpability.

  3.  **Manifestly Unlawful Orders & Individual Judgment:**
      *   **Strict Requirement:** A soldier *must* disobey an order that is "manifestly unlawful" (e.g., ordering the killing of civilians, torture). Compliance is not a defense for war crimes (`jus in bello` violations).
      *   **Presupposition:** This injects a critical element of **Individual Moral Agency** back into the framework. While the soldier is not responsible for the state's decision to wage (aggressive) war, they *are* responsible for their own conduct *within* the war. They are expected and required to exercise basic moral judgment when faced with orders flagrantly violating fundamental humanitarian norms. They cannot blindly outsource their conscience for core atrocities.

  4.  **Mercenaries & Combatant Status:**
      *   **Strict Requirement:** Fighters motivated primarily by private gain ("soldiers of fortune") who are not nationals of a party to the conflict nor sent by another state on official duty are denied combatant/PoW status (Additional Protocol I, Art. 47).
      *   **Presupposition:** This reinforces the **primacy of the State as the Legitimate Collective Actor** in war. IHL presupposes war is fundamentally a *conflict between states*. Combatant privilege and immunity are tied to fighting as an agent *of a state* (or a recognized belligerent group meeting state-like criteria - AP I, Art. 44). The mercenary, fighting purely for personal gain without allegiance to a state's cause, falls outside this collective framework. Their lack of state affiliation severs the link that justifies combatant immunity under the collective action/state agency model. It also reflects deep-seated mistrust of motivations detached from a collective (state) interest.

  **Reconciling the Tensions & Rival Theories:**

  *   The architecture *can* be seen as positing soldiers as **"Conditional Agents of the State"**:
      *   They are agents of the state for participating in the collective action of warfare (`jus ad bellum` responsibility lies with leaders; combatant immunity flows from state affiliation/conduct).
      *   They are *not* mere tools; they retain individual agency and responsibility to prevent egregious violations of `jus in bello` (manifest illegality exception).
  *   Rival theories (Moral Equality vs. Just War) are licensed *equally* at the level of interpreting the *underlying justification* for combatant immunity, but the *law itself* strictly adheres to the pragmatic separation of `jus ad bellum` and `jus in bello`.
  *   The refusal of the superior orders defense for manifest illegality *does* hand judgment back to the individual, but **only at the extreme margins** of clearly defined, fundamental atrocities. It does *not* require them to judge the overall justice of the war, only the inherent unlawfulness of specific, horrific acts.

  **Impact of Replacing the Presupposed View (Collective Action/Pragmatic Separation) with Revisionist Just War Theory:**

  Revisionist Just War Theory (e.g., McMahan) argues that *only* combatants fighting for a just cause have a true moral *right* to kill; unjust combatants are morally liable to attack even when following IHL.

  1.  **What Would Change Dramatically:**
      *   **Combatant Immunity:** Would be contingent on fighting for a just cause. Soldiers captured while fighting for the aggressor could potentially be prosecuted for killing enemy combatants (lawful acts under current IHL) as murder or manslaughter. PoW status would likely cease to exist as an automatic protection.
      *   **Crime of Aggression Scope:** While leaders would still be primary culprits, ordinary soldiers *could* potentially be held liable for participating in an aggressive war by killing enemy soldiers, as their acts wouldn't be immunized.
      *   **Superior Orders:** The scope of "manifest illegality" might expand to include fighting in an unjust war itself, placing an impossible burden on individual soldiers to assess `jus ad bellum`.
      *   **Mercenaries:** Their status might become even more problematic, but the core issue would shift to whether *anyone* fighting unjustly deserves immunity.

  2.  **What Would Become Unadministrable:**
      *   **Battlefield & Captivity Adjudication:** Determining the just side *during* the conflict or in POW camps would be chaotic, subjective, and lead to reprisals. Who judges? On what evidence? This undermines the core purpose of IHL: regulating ongoing conflict humanely.
      *   **Reciprocity:** The foundation of IHL compliance (both sides follow the rules because both benefit) collapses if one side believes the other has no "right" to its protections.
      *   **Legal Certainty:** The bright-line rules of combatant status and immunity would vanish, replaced by murky, contested judgments about the justice of the cause.

  3.  **What Mercenaries Indicate:**
      The mercenary rule strongly suggests the **collective action/state affiliation model is the actual presupposition**, *not* moral equality. IHL privileges fighting *for a state's cause* (even an unjust one), not fighting *per se*. Denying status to mercenaries highlights that the system views legitimate warfare as a collective, state-based enterprise. Revisionism, by potentially condemning *all* unjust combatants (state-affiliated or not), offers a fundamentally different basis for judgment (individual moral liability based on cause), making the mercenary distinction less relevant than the core injustice of their actions.

  **Confidence and Uncertainty:**

  *   **High Confidence:** The architecture strictly requires the pragmatic separation of `jus ad bellum` and `jus in bello` at the soldier level. Combatant immunity is a legal status based on conduct and affiliation, not a statement on moral permission. The state is presupposed as the primary collective agent. The mercenary rule reinforces state-centricity. Adopting revisionism would make core IHL mechanisms unworkable.
  *   **Least Sure Point:** The precise *philosophical weight* of the "manifestly unlawful" order exception within the collective agency model. While I'm confident it imposes individual responsibility for core atrocities, I'm less certain whether this is best characterized as a *limited* reassertion of individual moral agency *against* the state, or merely an extreme safeguard built *into* the state agency framework (i.e., the state cannot legitimately command such acts, so following them is pure individual crime). The tension here is intrinsic to the system.
