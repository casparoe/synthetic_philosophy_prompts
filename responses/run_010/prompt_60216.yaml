prompt: |-
  Our political theory reading group is run by a postdoc who has this one line he falls back on constantly: "there's no such thing as clean hands in politics." What's finally bugging me is that he deploys it in two opposite directions in the same evening. Someone asked whether a council member was actually wrong to promise a rezoning vote he already knew was dead in order to get a shelter funding package through, and he said don't be naive, that's just the cost of the job, there's nothing to feel bad about. Twenty minutes later, when someone else pushed on the slogan, he said an official who does that kind of thing and isn't bothered by it is the real problem — the feeling bad is the whole point. I'm fairly confident both of those can't come out of one sentence, but I can't say why.

  Can you lay out the distinct precise claims that slogan could be making, ordered roughly from the platitudinous to the radical — stuff about foreseen side effects and compromise, claims about role-specific permissions, claims about the office rather than the person, whatever would be needed for an act to be both the thing you ought to do and still wrong, all the way to the amoralist reading where moral talk is just decoration? For each one, say whether its trivially true, substantive and defensible, or actually false, and then tell me which reading he'd need for each of his two uses and whether any single reading can serve both.

  Two extra things. He insists the entire dirty hands puzzle evaporates if you define 'wrong' as 'what you have most reason, all things considered, not to do' — does it evaporate, or has he just relabeled the question, and what would survive the relabeling (residual duties, apology, compensation, self-punishment)? And I've read the Walzer paper and a chunk of the responses, so don't spend space on the basics — I want the menu of readings, not a summary of the debate. Flag clearly which bits are settled and which are genuinely live disagreements among people who work on this stuff; if his deflationary move is a minority position, say so rather than letting it stand as the default.
reasoning: |-
  Okay, the user is part of a political theory reading group and is frustrated with their postdoc leader's repeated use of the slogan "there's no such thing as clean hands in politics." The postdoc uses this line in contradictory ways within the same discussion - first to justify a council member's deceptive promise as necessary politics, then to condemn an official who doesn't feel bad about such actions. The user suspects these positions can't both derive from one coherent interpretation of the slogan.

  The user wants me to dissect the possible interpretations of "dirty hands" claims, ranging from obvious to radical. They specifically ask for:
  - A spectrum of interpretations from platitudinous to radical
  - Assessment of each interpretation's validity (trivially true, defensible, or false)
  - Which interpretation the postdoc is using in each of his contradictory statements
  - Whether any single interpretation can support both positions
  - Analysis of whether defining "wrong" as "what you have most reason not to do" actually dissolves the dirty hands problem
  - Clear indication of which aspects are settled in academic debate versus genuinely contested

  I recall that the dirty hands concept originates from Michael Walzer's influential 1973 essay, but the user is already familiar with this and wants deeper analysis rather than basics. The user seems philosophically sophisticated - they've read Walzer and responses, and they recognize the tension between excusing necessary actions while demanding remorse for them.

  For the interpretation spectrum, I'll build out a ladder of possible readings:
  1) The trivial "no ideal world" claim - politics involves compromise and trade-offs
  2) The "foreseen side effects" approach - recognizing that good actions have bad consequences
  3) "Role morality" - special permissions/obligations for political roles
  4) Walzer's original paradox - necessary actions remain morally wrong
  5) The "wrong but right" paradox - moral reasons conflict with all-things-considered duty
  6) The "moral costs" view - dirty hands create obligations to make amends
  7) The "amoralist" position - morality doesn't apply to politics

  I'll assess each for plausibility and note where the postdoc might be drawing from each. The contradiction in his two statements is revealing - one leans toward justification (role morality), the other toward condemnation (Walzer's view). This suggests he's equivocating between interpretations rather than holding a consistent position.

  On the definitional question about "wrong," the postdoc is oversimplifying. If we define "wrong" strictly as "what you have most reason not to do," we might dissolve the paradox semantically, but the core experience remains: the sense of inescapable moral taint, the need for remorse, the special burdens on political actors. These phenomena persist regardless of terminology. The postdoc's move is indeed a minority position that misses what makes dirty hands philosophically interesting.

  The academic consensus holds that Walzer's core insight stands - there is a genuine paradox here that resists easy dissolution. The live debates concern how to characterize the moral remainder (is it guilt? shame? special obligations?) and whether role-specific permissions can fully resolve the tension. The postdoc's deflationary stance is decidedly non-standard.

  For the user's specific frustration, I'll emphasize that no single coherent reading supports both the "nothing to feel bad about" position and the "must feel bad" position simultaneously. The postdoc is likely being inconsistent, using the slogan flexibly to avoid taking a clear stand. The user's instinct that this is contradictory is correct - they've identified a genuine equivocation in how the slogan gets deployed.
answer: |-
  Here's a dissection of the "no clean hands" slogan, mapping its possible interpretations, their plausibility, and their compatibility with your postdoc's contradictory uses. The core tension you identify is real: **no single coherent interpretation supports *both* "nothing to feel bad about" *and* "must feel bad" simultaneously.** His two statements require distinct, incompatible readings.

  ### The Spectrum of Interpretations (Platitudinous to Radical)

  1.  **The Trivial Claim of Non-Ideal Theory (Platitudinous & Trivially True):**
      *   **Claim:** Politics occurs in an imperfect world with scarce resources, conflicting legitimate interests, uncertainty, and strategic actors. Achieving good outcomes *always* involves compromise, trade-offs, and accepting sub-optimal solutions or negative side effects. "Purity" or achieving every ideal simultaneously is impossible.
      *   **Assessment:** Trivially true. This is simply the nature of collective action under constraints. No serious theorist denies this.
      *   **Postdoc's Usage:** Compatible with his *first* statement ("don't be naive, cost of the job") as a *description* of why the action occurred. **Incompatible** with his *second* statement ("must feel bad") as this level doesn't imply moral taint, just practical difficulty. Feeling bad would be optional.

  2.  **The Foreseen Negative Side Effects View (Substantive & Defensible):**
      *   **Claim:** Politicians often must choose actions that foreseeably cause significant harm to some (even if unintended) as a necessary means to achieve a greater good or prevent a greater evil. While the *overall* act may be justified, the agent bears responsibility for the foreseen harm.
      *   **Assessment:** Substantive and defensible (a core part of standard consequentialism/deontology dealing with the "means/ends" problem and double effect). Requires careful weighing.
      *   **Postdoc's Usage:** Compatible with *first* statement (harm to trust/deception necessary for shelter funding). **Potentially Compatible** with the *second* statement *if* "feeling bad" is about *regret for the necessary harm caused*. However, it doesn't inherently demand feeling bad *about the act itself* being wrong, just sorrow for the consequences. His "real problem" phrasing suggests something stronger than regret.

  3.  **Role-Specific Permissions/Obligations (Substantive & Contested):**
      *   **Claim:** The political role carries unique moral permissions (and sometimes obligations) that override ordinary morality. Lying, breaking promises, even limited violence *can* be not just excused, but *required* and *permissible* within the scope of the office for the sake of public order, security, or welfare. What would be wrong for a private citizen isn't necessarily wrong for the office-holder acting *qua* office-holder.
      *   **Assessment:** Substantive and highly contested. Defended by realist/pragmatist traditions and some consequentialists. Criticized for potentially justifying excessive moral disengagement ("role corruption").
      *   **Postdoc's Usage:** Strongly compatible with *first* statement ("cost of the job, nothing to feel bad about" – it's *permitted* or even *required* by the role). **Directly Contradicts** his *second* statement. If the act is genuinely *permitted* or *required* by the role, feeling bad about doing one's duty would be irrational or weak, not a sign of moral health. He explicitly says the official who *isn't* bothered is the problem.

  4.  **Walzer's Core Paradox (Necessary Wrongdoing) (Substantive & Contested - Core Dirty Hands):**
      *   **Claim:** There are situations where an official *must* (for compelling public reasons) commit an act that is *genuinely morally wrong* (e.g., violates deep prohibitions like truth-telling, promise-keeping, non-harm). The act is both *necessary* (perhaps even obligatory for the role) and *intrinsically wrong*. The official *should* feel guilt/remorse for the wrong done, even while acknowledging the necessity. The "dirt" is the moral residue of the wrong act, not just regret for consequences. "Feeling bad" (guilt) *is* the acknowledgment of the moral cost.
      *   **Assessment:** Substantive and the heart of the traditional "dirty hands" debate. Highly contested. Defended by Walzerians and some non-consequentialists. Criticized by others as conceptually confused ("how can it be both obligatory *and* wrong?").
      *   **Postdoc's Usage:** **Incompatible** with his *first* statement ("nothing to feel bad about"). Walzer's view *demands* feeling bad precisely *because* a genuine wrong was committed, even if necessary. Perfectly compatible with his *second* statement ("must feel bad, official unbothered is the problem").

  5.  **Moral Remainders / Costs of Agency (Substantive & Defensible - Refinement of #4):**
      *   **Claim:** Even if the overall act is justified/all-things-considered right, committing a prima facie wrong (lying, harming) as part of it incurs "moral costs" or "remainders." The agent has special obligations *arising from* the act: to make amends, compensate, apologize, seek forgiveness, or experience appropriate guilt/remorse. The "feeling bad" is recognition of these costs and the trigger for fulfilling these obligations.
      *   **Assessment:** Substantive and increasingly influential (e.g., work by C.A.J. Coady, Thomas Nagel, Bernard Williams). Less paradoxical than #4 but captures the core intuition of moral residue. Defensible.
      *   **Postdoc's Usage:** **Incompatible** with his *first* statement ("nothing to feel bad about"). This view *requires* acknowledging the moral cost and the consequent duties (which involve some form of negative feeling/recognition). Compatible with his *second* statement ("must feel bad" as acknowledging cost/triggering duties).

  6.  **The "Wrong but Right" Paradox (Conceptual Challenge - Radical):**
      *   **Claim:** Moral reasons and "all-things-considered practical reasons" are incommensurable or occupy distinct normative domains. An act can be *morally wrong* (failing ethical standards) yet *practically obligatory* (the best/only course given all reasons, including role, consequences, etc.). There is no single "all-things-considered ought" that resolves the conflict cleanly.
      *   **Assessment:** Highly contested and radical. Explores deep tensions in normativity. Defended by some pluralists (e.g., Isaiah Berlin's influence). Criticized as rendering practical reasoning incoherent.
      *   **Postdoc's Usage:** Could *potentially* ground *both* statements *if* he equivocates: "nothing to feel bad about" (practically obligatory/right) *and* "must feel bad" (morally wrong). However, this requires explicitly acknowledging two distinct normative verdicts, which he doesn't do. His "nothing to feel bad about" dismisses moral concern entirely, conflicting with acknowledging moral wrongness.

  7.  **Amoralism / Morality as Mask (Radical & False/Dangerous):**
      *   **Claim:** Politics operates by its own rules (power, interest, survival) entirely outside the realm of morality. Moral language is merely rhetorical decoration or a tool of manipulation. "Wrong" has no real purchase in political action. Feeling bad is either weakness or hypocrisy.
      *   **Assessment:** Substantive but generally considered false and dangerous by most political theorists (though influential in extreme realist/cynical thought). Denies the relevance of ethics to politics.
      *   **Postdoc's Usage:** Perfectly compatible with his *first* statement ("nothing to feel bad about"). **Directly Contradicts** his *second* statement ("must feel bad"). If morality is irrelevant, feeling bad is pointless.

  ### Analysis of the Postdoc's Contradiction
  *   **First Statement ("Cost of the job, nothing to feel bad about"):** Requires an interpretation that **absolves** the agent of moral blame or the *need* for remorse. This points strongly towards **#3 (Role Permissions)** or **#7 (Amoralism)**. **#1 (Trivial)** and **#2 (Side Effects)** offer *explanations* but don't inherently absolve the need for regret/remorse. **#4, #5, #6** explicitly demand remorse/blame.
  *   **Second Statement ("Must feel bad, unbothered official is the problem"):** Requires an interpretation that **demands** moral discomfort/remorse *specifically for the act itself*. This points strongly towards **#4 (Walzer's Paradox)**, **#5 (Moral Remainders)**, or possibly **#6 (Wrong but Right)**. **#1, #2, #3, #7** do not demand this.
  *   **No Single Coherent Reading:** The two demands ("nothing to feel bad about" vs. "must feel bad") are logically incompatible within any single interpretation. **#3** and **#7** explicitly reject the need for remorse demanded by **#4/#5/#6**. **#6** *could* support both verdicts in different domains, but it requires acknowledging the *conflict*, not dismissing one side ("nothing to feel bad about") while demanding the other ("must feel bad").

  ### The Postdoc's Deflationary Move: Does "Wrong = What You Have Most Reason Not To Do" Dissolve Dirty Hands?
  *   **It Relabels, Not Dissolves:** This move defines "wrong" as the verdict of the *all-things-considered* balance of reasons ("ATC wrong"). If the council member had most reason ATC to lie (to get the shelter), then by definition, it wasn't "wrong" in this sense. The postdoc thinks this ends the debate.
  *   **What Survives (The Heart of Dirty Hands Remains):** Crucially, **all the phenomena that make "dirty hands" interesting survive this relabeling**:
      *   **Prima Facie Wrongs:** The act still involved violating fundamental moral norms (truth-telling, promise-keeping). These norms retain their force and were *overridden*, not erased.
      *   **Moral Residue/Remainders:** The agent likely still has obligations of *apology, compensation, justification, or acknowledgment* to those harmed or wronged by the lying, even if ATC justified. This residue is the "dirt."
      *   **Appropriate Emotions:** Feelings of *regret, agent-regret, or even guilt* (understood as acknowledgment of the moral cost, not necessarily belief in ATC wrongdoing) are often seen as **appropriate and necessary** responses to having overridden strong moral norms. *This is the core of your postdoc's second statement.* An official who feels *nothing* seems morally deficient.
      *   **The Question of Justification:** The debate simply shifts: *Was this act really supported by the ATC balance of reasons?* Was the lie *necessary*? Were there *better alternatives*? Was the goal *sufficiently important*? This is where substantive political/moral argument happens.
      *   **Role-Specific Reasons:** The move doesn't resolve debates about whether the *role* provides genuinely *additional* reasons that override ordinary moral ones, or whether this is just a disguised form of consequentialism.
  *   **Minority Position?** Defining "wrong" narrowly as "ATC wrong" is common, even standard, in some philosophical circles (e.g., many consequentialists). **However, using it to claim the *entire dirty hands puzzle evaporates* is a significant minority position, often seen as overly simplistic within the dirty hands literature.** It ignores the persistent normative force of the overridden moral norms and the phenomena of residue. Walzer, Williams, Nagel, Coady, and others explicitly argue these phenomena survive such definitions. The "surviving elements" listed above constitute the "genuinely live disagreement."

  ### Settled vs. Live Disagreements
  *   **Settled (Near Consensus):**
      *   Politics involves inescapable conflict, compromise, and tragic choices with negative consequences (#1, aspects of #2).
      *   Defining "wrong" as ATC wrong doesn't magically eliminate the experience of moral conflict, the force of overridden norms, or the potential for moral residue/remainder obligations and emotions. (The postdoc's deflationary move doesn't work as advertised).
  *   **Genuinely Live Disagreements:**
      *   **The Nature of Dirty Hands:** Is it genuine wrongdoing (#4), justified action with moral costs (#5), a conflict between moral and practical reasons (#6), or just hard choices within morality (#2)?
      *   **Role Morality:** Do political offices grant genuine moral permissions/obligations that override ordinary morality (#3), or are they simply contexts where consequentialist calculations weigh heavily?
      *   **Moral Residue:** What *is* the residue? Guilt? Shame? Special obligations (apology, compensation)? Are these emotions/obligations *morally required* or just psychologically common?
      *   **Amoralism:** Is politics truly outside morality (#7)? (Most say no, but realism pushes boundaries).
      *   **The Necessity Condition:** How strict must "necessity" be to justify overriding norms? How do we judge this?
      *   **Appropriate Response:** What *is* the appropriate emotional and practical response from the agent and society?

  **Conclusion:** Your postdoc is equivocating. His first use leans hard towards **Role Permissions (#3)** or even **Amoralism (#7)** to justify the act and dismiss remorse ("nothing to feel bad about"). His second use leans hard towards **Walzer's Paradox (#4)** or **Moral Remainders (#5)** to demand remorse ("must feel bad"). These are fundamentally incompatible within a single coherent framework. His deflationary move ("wrong = ATC wrong") is a common but contested maneuver that relabels the problem; it doesn't dissolve the core phenomena of moral conflict, overridden norms, residue, and the demand for acknowledgment/remorse that constitute the enduring puzzle of dirty hands. The live debates focus on precisely *how* to understand these phenomena, not whether they exist.
