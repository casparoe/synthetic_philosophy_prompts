answer: |-
  ## The Primacy of Authorship: Why Moral Pessimism Mislocates the Defect in Deference

  **Thesis:** Pessimism about moral testimony correctly identifies a defect in accepting moral verdicts on authority, but misdiagnoses it as a failure of understanding. The true defect is the surrender of *authorship*: installing another's judgment where only one's own can reside in practical reasoning. This account better explains key cases and preserves what is valuable in pessimism while avoiding its errors.

  **I. The Authorship Account: Core Argument**

  Moral agency is not merely about arriving at correct verdicts, nor even about possessing the cognitive abilities associated with understanding *why* those verdicts are correct. It is fundamentally about *authoring* the practical judgments that guide one's own actions and commitments. Practical reasoning demands that the conclusion—the judgment about what to do or believe morally—be *mine* in a strong sense: it must be the product of *my* engagement with the reasons, even if those reasons were presented by another. The defect in accepting a bare moral verdict ("Act X is wrong") on authority is not primarily epistemic (lacking knowledge or understanding) but *agential*: I outsource the core act of judgment itself.

  This clarifies the distinction between **verdict-testimony** and **reasons-testimony**:
  *   **Verdict-Testimony:** Accepting *that* something is morally right or wrong solely on the speaker's authority. The hearer adopts the conclusion *as a conclusion*, bypassing their own evaluative engagement.
  *   **Reasons-Testimony:** Accepting an *account of why* something is right or wrong, engaging with the reasons presented, and arriving at the conclusion *based on the perceived force of those reasons*. The hearer authors the judgment, using the speaker's reasoning as material.

  The defect in verdict-testimony is the failure of authorship. I allow another agent's final judgment to stand in for my own within the sanctum of my practical reasoning. This compromises my moral integrity as an autonomous agent, regardless of the epistemic status of the belief or my possession of understanding abilities.

  **II. Sorting the Cases: Authorship vs. Understanding**

  Consider how the authorship account and the understanding-based account handle the three cases:

  1.  **The Redundant Authority (Faculty Vote):**
      *   *Facts:* The faculty member possesses full knowledge, understanding, and the ability to explain independently. She defers solely because she trusts her senior colleague's *judgment* more.
      *   *Understanding Account Prediction:* Acquittal. All abilities (grasping why, drawing consequences, explaining, acting for right reasons) are present. No defect should be found.
      *   *Authorship Account Diagnosis:* Defect. Despite her capacities, she abdicates her role as the *author* of her decisive practical judgment in this context. Her vote is not *hers*; it is an echo of her colleague's. The quiet abdication we sense stems from this surrender of authorship, not an epistemic lack. The understanding account *cannot* explain the intuitive wrongness here.

  2.  **The Explained Verdict:**
      *   *Facts:* The hearer is told *why* a practice is wrong, follows the reasoning, finds it compelling, and adopts the conclusion based on the reasons presented.
      *   *Understanding Account Prediction:* Acquittal. The hearer gains understanding through the testimonial exchange of reasons.
      *   *Authorship Account Diagnosis:* Acquittal. The hearer *authors* the judgment. They engage with the reasons, make them their own (to the extent of finding them convincing), and their conclusion is reached *through* that engagement. The testimonial origin of the *reasons* does not negate the hearer's authorship of the *judgment* based on those reasons. This case demonstrates that testimonial *input* is compatible with authored *output*.

  3.  **The On-Call Resident:**
      *   *Facts:* Lacking time and background, the resident accepts the attending's verdict on withdrawing treatment, intending to think it through later. She lacks the relevant understanding abilities *at the moment of action*.
      *   *Understanding Account Prediction:* Indictment. The abilities crucial for moral worth (grasping why, etc.) are absent when she acts. Her action lacks full moral standing.
      *   *Authorship Account Diagnosis:* Acquittal (or significantly reduced concern). The resident does not *surrender* authorship; she *delegates* judgment provisionally under exigent circumstances, with the explicit intention to reclaim authorship later. The judgment is held *in escrow*, not adopted as her own indefinitely. The defect is minimized or absent because she maintains her stance as the ultimate author of her moral outlook, merely delaying full engagement. The understanding account *overstates* the defect here by focusing solely on the missing abilities at T1, ignoring the agent's temporally extended commitment to authorship.

  **The Verdict:** The understanding account mis-sorts Cases 1 and 3. It fails to identify the defect where understanding exists but authorship is surrendered (Case 1), and it over-condemns where understanding is temporarily absent but authorship is preserved in principle (Case 3). Only the authorship account correctly diagnoses all three: condemning the abdication in Case 1, endorsing the reasoned adoption in Case 2, and excusing the provisional delegation in Case 3.

  **III. Addressing Key Objections**

  1.  **The Genealogical Objection ("We all start with testimony!"):**
      *   *Objection:* If accepting verdicts on authority is a defect in authorship, and nearly everyone's moral outlook begins with childhood testimony, then either almost everyone is defective or we need a story about converting borrowed verdicts into "one's own," which risks collapsing into the understanding account.
      *   *Response:* The objection confuses the *developmental origin* of beliefs with the *agential stance* one takes towards them *as a competent moral agent*. Early moral learning often involves necessary verdict-acceptance. The authorship concern arises primarily when an agent *capable* of independent practical reasoning *chooses* to outsource judgment. The "conversion" story isn't about gaining understanding per se, but about *revisiting* those early-accepted verdicts with one's developed capacity for reasoning, asking "Do *I* judge this to be correct, based on reasons *I* find compelling?" This is a process of *assuming* authorship over previously inherited judgments, distinct from merely acquiring the ability to parrot justifications. It’s the active assumption of authority over one's judgments, not merely the cognitive state of understanding them.

  2.  **The Moral Progress Objection ("What about reformers and the oppressed?"):**
      *   *Objection:* Abolitionists or those raised in corrupt communities often needed to defer to morally superior others. Doesn't the authorship view fetishize authenticity over getting things right, potentially condemning necessary and virtuous deference?
      *   *Response:* The authorship view does *not* claim deference is always wrong, nor that getting things right is unimportant. Its core claim is that *when one defers by accepting a bare verdict*, one incurs an agential cost – a loss of authorship. However:
          *   **Reasons-First:** The morally progressive path often involves *reasons-testimony* ("Here's *why* slavery is wrong"), enabling the hearer to author their new judgment based on grasped reasons.
          *   **Provisional Deference:** Like the resident, someone recognizing their own moral limitations may *provisionally* accept a verdict while actively seeking understanding to reclaim authorship. This is delegation, not abdication.
          *   **Cost-Benefit:** In extreme cases (immediate danger, profound corruption), the agential cost of verdict-deference might be outweighed by the moral urgency of aligning with the right outcome *now*. The authorship view acknowledges this as a genuine, regrettable cost paid for a greater good, not an unproblematic action. It prioritizes authorship but recognizes it isn't an absolute trump card against catastrophic error.

  3.  **The Status Objection ("Is it moral or just 'inauthentic'?"):**
      *   *Objection:* If the loss is merely "authenticity," isn't the worry merely aesthetic or existential? If it's genuinely moral, what grounds it? Is this just covert Kantian autonomy, implying pessimism about *all* deference (to art critics, etc.)?
      *   *Response:* The defect is genuinely moral, grounded in the nature of moral obligation and its intimate connection to the agent's own recognition of reasons. Morality addresses us as rational agents; its demands gain their distinctive force *for me* when I apprehend them through my own practical reason. Outsourcing judgment severs this vital link. While related to Kantian autonomy, the scope is narrower:
          *   **Specific to Practical Reason:** The claim is that *practical* judgments about what *I* ought to do require my authorship for their full moral force *within my agency*. This does not extend to theoretical judgments (art criticism, historical facts) or technical expertise (medical diagnosis, legal procedure), where the primary goal is accuracy, not the constitutive link between judgment and the agent's own will in determining action. Deference to a spiritual director *might* raise similar authorship concerns if it involves abdicating judgment on fundamental questions of value and meaning guiding one's life, but not if it concerns factual interpretations of doctrine or advice on spiritual practices one already endorses.

  4.  **The Stability Objection ("Doesn't testimony always imply reasons?"):**
      *   *Objection:* Any competent testifier implies reasons, and any hearer can ask for them. So either the verdict/reasons distinction collapses, or the authorship defect must persist whenever the hearer accepts the *reasons* only because the *speaker* vouches for them.
      *   *Response:* The distinction holds, and we must choose the second path: **The defect *can* survive the giving of reasons if the hearer accepts those reasons solely on the speaker's authority.** The key is *why* the hearer accepts the reasons.
      *   **Verdict-Deference in Disguise:** If the hearer accepts the proffered reasons *not* because they find them intrinsically compelling upon reflection, but *only* because the trusted speaker presents them as the right reasons, then they are still deferring to the speaker's *overall verdict* on the matter. They are using the reasons as a placeholder for the speaker's judgment, not engaging with them as independent justificatory forces. This maintains the authorship defect.
      *   **Reasons-Driven Acceptance:** Conversely, if the hearer genuinely engages with the reasons, assesses their plausibility and weight (even if initially prompted by trust in the speaker), and finds *the reasons themselves* convincing, then they author the judgment. The distinction turns on the locus of authority for the hearer: is it the speaker's *say-so* about the conclusion *or* the perceived normative force of the considerations presented?

  **IV. When is Verdict-Deference Permissible?**

  Verdict-deference, accepting a bare moral conclusion on authority, always incurs an agential cost (loss of authorship) but may be permissible under specific, constrained conditions:

  1.  **Provisional Acceptance:** When immediate action is required and independent judgment is practically impossible (e.g., the on-call resident), *provided* there is a sincere commitment to achieve understanding and reclaim authorship as soon as feasible.
  2.  **Epistemic Asymmetry & High Stakes:** When facing a profound and recognized deficit in one's own capacity for sound moral judgment relative to a trusted other, *and* the potential consequences of error are severe, *and* reasons-testimony is unavailable or impractical. Even then, it should be seen as a regrettable necessity, not an ideal.
  3.  **Scaffolding for Development:** Within pedagogical or developmental relationships (e.g., mentor/mentee, parent/child), where verdicts are offered not as permanent substitutes for judgment, but as temporary guides while the learner develops the capacity for independent authorship. The permissibility hinges on the intent to foster eventual autonomy.

  **V. The Necessary Concession**

  The single most damaging concession this position must make is that **in exceptional circumstances of profound moral corruption, epistemic disadvantage, or extreme urgency, deferring to a bare verdict from a morally superior source may be the *morally best available action*, despite the incurred agential cost.** The resident case hints at this, but the moral progress objection pushes it further. For the individual trapped within a deeply unjust moral framework, recognizing its flaws but unable yet to fully articulate the alternative, trusting the verdict of an abolitionist or reformer might be the only path towards eventual liberation and authentic moral agency. The authorship view condemns this as a loss of authorship in the moment but must acknowledge it can be a tragic necessity on the path *towards* reclaiming full authorship under better conditions. It can live with this concession because it does not deny the cost; it frames such deference not as virtuous but as a painful sacrifice of agential integrity made under duress for the sake of a greater future good – the eventual possibility of authentic moral self-government. The ideal remains the authored judgment; the concession acknowledges that the path to that ideal is sometimes paved with difficult compromises.
