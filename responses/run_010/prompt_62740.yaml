prompt: |-
  You're an expert on reward design and evaluation for AI systems — someone who has actually built and compared process reward models against outcome reward models, not just read the blog posts — and you also know enough philosophy of science to talk about underdetermination and mechanism claims without embarrassing yourself. Think carefully. Before you answer, spend some effort brainstorming what kind of evidence would even be *capable* of bearing on the view below, since part of my worry is that I've stated it in a way that nothing could touch.

  Here's the view. I've become conviced that the standard story about why process-based supervision beats outcome-based supervision on stuff like math reasoning is mostly wrong. The standard story goes: process signals give denser, better-localised credit assignment, so learning is more sample-efficient and the model is less able to hack the final answer. My view is that the real mechanism is different — call it the legibility prior hypothesis. Process labels don't reward correct reasoning, they reward reasoning in the *form humans can follow*: named methods, tidy ordered steps, no big inferential leaps, no weird notation. So a process reward model is largely scoring stylistic conformity to a human template of what a solution looks like, and the reason it wins is that in the narrow domains where anyone has bothered to collect step-level labels, that template happens to be strongly correlated with correct-and-checkable solutions. The predictions I'm attached to: the advantage should shrink as base models get stronger and their own solution strategies drift away from textbook human ones; it should be near-absent in domains where correctness is cheaply verifiable but there's no canonical human derivation style to conform to; and most of what people credit to dense rewards should be reproducible by an outcome-only signal plus a data-curation filter that throws out stylistically wierd-but-correct solutions.

  What would count against this? I want the observations, experimental setups, and arguments that should actually move me, ranked from fatal to merely awkward. Be concrete about the experiments — what comparison, what controls, what pattern of results would point at genuine credit assignment rather than legibility — and don't just list generic possibilities, tell me which ones are cheap enough that somebody should have run them already and which would be enormously hard. Also: which of these would a committed defender of my hypothesis concede as counting against them, and which would they explain away, and by the time you've added all the escape hatches a smart defender would want (something like 'the templates correlate with truth, that's the whole point'), has the view been hedged into unfalsifiability? If it has, is that a real problem for a claim of this kind or just normal for a mechanism hypothesis about a messy empirical phenomenon? Flag anything in how I've stated it that's confused or that smuggles in an assumption I haven't noticed — including whether 'process supervision' and 'legibility' are even separable in the way I'm assuming.

  No bibliography and no citations please, I'm not after references, just the reasoning. Lead with your bottom line in the first sentence — is this view badly exposed or well insulated, and what's the single thing most likely to kill it — then give the reasoning underneath. No preamble, and don't restate my question back to me.
reasoning: |-
  We are given a view: the advantage of process-based supervision over outcome-based is due to rewarding conformity to human-legible reasoning styles (the "legibility prior") rather than better credit assignment. This view predicts that the advantage shrinks with stronger base models (as their strategies drift from human ones), is near-absent in domains with cheap correctness verification but no canonical style, and that outcome signals plus stylistic filtering can reproduce most of the gains.

  We are asked for evidence that would count against this view, in the form of experimental setups and arguments, ranked from fatal to merely awkward. We must also consider how a defender of the legibility prior hypothesis (LPH) would respond and whether the view becomes unfalsifiable.

  Bottom line: The view is well-insulated by design, but the single most likely fatal evidence would come from demonstrating that process rewards can train models to produce novel, non-human-like reasoning strategies that are more correct than human ones, especially in domains without a canonical style and where outcome signals alone fail.

  Reasoning:

  1. **Core challenge: Separating credit assignment from legibility**
     - The LPH argues that process rewards work because they enforce a style that happens to correlate with correctness. To test this, we need to decouple "correct reasoning" from "human-legible reasoning". This is non-trivial because human-legible reasoning is what we typically have labels for.

  2. **Key experiments that could count against LPH, ranked by force:**
     - **Fatal: Process supervision leading to non-human-like, superior strategies.**
       - *Setup*: In a domain with cheap outcome verification (so outcome-based RL is feasible) and without a canonical human style, train two models:
          - (A) With process supervision: reward each step using a process reward model (PRM) trained on human step labels.
          - (B) With outcome supervision: reward only the final answer.
          - Ensure the task is complex enough that outcome RL alone fails due to sparsity.
          - Crucially, also have a third setup:
          - (C) With process supervision but using a PRM trained on non-human-like reasoning traces that are known to be correct (e.g., generated by a stronger model that uses a different, non-human style, but verified by outcome). This PRM is trained to reward correctness, not human style.
          - *Prediction against LPH*: If (A) and (C) both outperform (B) by a similar margin, then the benefit is not tied to human style but to the stepwise credit assignment. If (A) fails but (C) succeeds, then human style is crucial. LPH predicts (A) should work only if the style is human-like and correlated with correctness. But if (C) works without human style, then credit assignment is key.
          - *Why fatal*: It directly separates style from credit assignment. If non-human-like but correct process rewards work, then the mechanism is credit assignment, not style.
          - *Defender response*: They might argue that (C) is still using a "style" (the non-human one) and that the PRM in (C) is just another template that correlates with truth. But if the non-human style is arbitrary and diverse (e.g., generated by a model that uses many different valid strategies without a consistent template), then the correlation argument weakens. Also, if the non-human style is not legible to humans, then the defender must explain why the PRM can still be trained without human-interpretable features. This might force a retreat to "any template that is checkable and correlates with truth" — but then the view becomes about having a reliable stepwise signal, which is the standard credit assignment story.

     - **Strong but not fatal: Process supervision without a canonical style.**
       - *Setup*: Choose a domain where correctness is cheap to verify (so outcome RL is not sample-inefficient) but there is no canonical human style (e.g., programming puzzles with multiple solution paths, or abstract reasoning tasks without a standard method). Compare:
          - Outcome-based RL (using outcome reward)
          - Process-based RL (using a PRM trained on human step labels, but note: if there's no canonical style, the step labels may be inconsistent)
          - Also, include a condition with outcome RL plus a filter that removes stylistically weird solutions (as per LPH's prediction).
          - *Prediction against LPH*: LPH says the advantage of process RL should be near-absent here. If process RL still substantially outperforms outcome RL (and the filtered outcome condition does not close the gap), then credit assignment is at work. The filter condition tests whether style filtering alone (without stepwise rewards) can help outcome RL.
          - *Why strong but not fatal*: If process RL wins, it suggests that stepwise rewards are doing more than just enforcing style. However, the defender could argue that even without a single canonical style, the process rewards are still enforcing some style (each human annotator's own style) and that style correlates with correctness. They might also claim that the domain still has implicit stylistic conventions. To counter, we could use a domain with intentionally diverse human annotations (no consistent style) and show that the PRM still works. But if the PRM is trained on diverse styles, then it might be learning correctness, not style.

     - **Awkward: Stronger models and drift.**
       - *Setup*: Train models of varying capabilities (from weak to very strong) on the same task using process supervision. Then evaluate on a test set where the strong base model's own solutions (without training) are often correct but non-human-like. Measure the performance of the process-supervised model versus an outcome-supervised one. Also, measure the correlation between the process reward and correctness for human-style vs non-human-style solutions.
          - *Prediction against LPH*: LPH predicts that as base models get stronger and their strategies drift away from human ones, the advantage of process supervision should shrink. If, however, the advantage persists or even grows with model scale, then the credit assignment story is supported. Moreover, if the process reward model (PRM) trained on human steps continues to assign high rewards to non-human-style solutions that are correct (and low to incorrect ones, even if human-style), then it is not merely rewarding style.
          - *Defender response*: They might argue that the PRM is only trained on human styles and thus will not reward non-human styles, so the process-supervised model would be penalized for drifting. If the process-supervised model still produces non-human-like solutions and gets high rewards, the defender could say that the PRM has overgeneralized or that the non-human solutions are still within the space of what the PRM recognizes as "legible". To block this, we might need to show that the PRM gives low rewards to correct non-human solutions that are stylistically very different (e.g., using novel notation, large leaps) — but if it does, then the process-supervised model would be constrained to human style and might underperform on tasks where non-human strategies are better. If the process-supervised model outperforms with non-human strategies, that contradicts the defender.

  3. **Unfalsifiability concerns:**
     - The defender can always fall back on: "The template (human or not) must correlate with truth for the process reward to work. That's the whole point." This makes the view unfalsifiable because any successful use of process rewards can be attributed to a correlation between the rewarded style and correctness. To avoid this, we must design experiments where the style is explicitly decoupled from correctness. For example:
       - Create a synthetic domain where we can control the correlation between a predefined "style" and correctness. Train a PRM to reward that style (without regard to correctness) and see if it still leads to better learning than outcome RL. If it does, then style alone (without correlation) is not sufficient — unless the style happens to help with exploration or credit assignment in a way that is not about correctness. But if we can show that the PRM's rewards are uncorrelated with correctness and yet process RL still wins, that would be a problem for both the standard story and LPH. Alternatively, if the PRM is trained to reward style regardless of correctness, then process RL might fail, which would support that correctness correlation is necessary. But then the standard story would also require the step rewards to be correct.

  4. **Conceptual issues in the stated view:**
     - The view assumes that "process supervision" and "legibility" are separable. However, in practice, the stepwise labels we have are human-generated and thus inherently legible. So the PRM is always trained on legible traces. This means we cannot easily test the effect of process rewards without legibility. The non-human-style condition (C) above is an attempt to break this.
     - The view also conflates two things: (a) the form of the reasoning (tidy steps) and (b) the correctness of each step. The standard story claims that stepwise rewards provide better credit assignment by telling the model which steps are correct. The LPH says it's about the form. But note: if the stepwise labels are generated by a human who is also checking correctness, then form and correctness are confounded. To disentangle, we need step labels that are correct but not legible, or legible but not correct. The former is hard to define; the latter we can create.

  5. **Cheap vs hard experiments:**
     - **Cheap**: The outcome RL plus stylistic filter vs process RL in a domain with cheap verification and no canonical style. We can run this now with existing tasks (e.g., code generation with multiple solutions). The filter can be a simple classifier trained to detect "weird" solutions (using human judgments). If filtering plus outcome RL matches process RL, that supports LPH. If not, it counts against.
     - **Hard**: The non-human-style PRM experiment (condition C) is harder because it requires generating non-human-like but correct reasoning traces (which might be hard to verify without an oracle) and training a PRM on them. Also, ensuring that the style is truly non-human and not just another human-style variant is tricky.

  6. **Conclusion on falsifiability:**
     - With the escape hatch of "correlation with truth", the LPH becomes unfalsifiable in a weak form. However, if we interpret the view as claiming that human legibility is the key feature and that without it the advantage disappears, then the non-human-style PRM experiment is the critical test. If the view retreats to "any style that correlates with truth", then it becomes the standard story (which says stepwise rewards are only helpful if they are correct). In that case, the original view is reframed and the debate becomes about whether human legibility is necessary for obtaining such stepwise rewards. The view might then be that human legibility is the only practical way to get stepwise rewards that correlate with truth. But that is an empirical claim about the availability of non-human stepwise signals.

  Thus, the single most fatal evidence would be the success of process supervision using non-human-style (and non-style-based) stepwise rewards in a setting where outcome RL fails and where human-style process rewards are not applicable. This would show that the mechanism is stepwise credit assignment, not legibility.

  Finally, note that the view might be partially correct: in current practice, human legibility is how we get stepwise correctness signals, so the two are entangled. But the mechanism might still be credit assignment, and legibility is just a means to an end.
answer: |-
  **Bottom line: Your view is well-insulated but not unfalsifiable; the single most fatal evidence would be process supervision explicitly rewarding *non-human-like* reasoning that outperforms human-like reasoning in correctness, especially in domains without canonical styles where outcome-only fails.**

  ### Fatal Evidence: Non-Human Process Rewards Outperforming Human-Like Rewards  
  **Experiment:** In a domain with cheap outcome verification (e.g., symbolic math with a solver) but no canonical human style (e.g., multiple valid solution paths, some requiring "weird" leaps/notation), train three RL agents:  
  - **Outcome-only:** Rewarded solely for final answer correctness.  
  - **Human-process:** Rewarded via a process reward model (PRM) trained on human step-by-step annotations (tidy, named methods).  
  - **Non-human-process:** Rewarded via a PRM trained *only* on verified correct but *non-human-like* reasoning traces (e.g., solutions from a stronger base model using novel strategies, with leaps/abbreviations humans reject as "illegible"). Control for solution correctness via an oracle.  

  **Fatal Result:** If the non-human-process agent achieves **higher correctness** than the human-process agent, and both beat outcome-only, it proves process rewards can leverage non-human strategies for better performance—directly contradicting your legibility prior. Credit assignment is the driver, not stylistic conformity.  
  - *Why fatal?* Legibility prior assumes human-like style is necessary for the advantage. If rewarding "weird" steps yields better results, credit assignment is the mechanism.  
  - *Defender escape hatch?* They might claim non-human traces still form a "template" correlating with truth. But if traces are *diverse* (no consistent style) and PRMs generalize to unseen weird strategies, this fails.  
  - *Feasibility:* Hard but doable (e.g., use GPT-4 to generate bizarre-but-correct solutions, train PRM on them). Base models must be strong enough to invent non-human strategies.  

  ---

  ### Strong Evidence: Advantage Persists Without Stylistic Correlation  
  **Experiment:** In a domain where correctness is cheap to verify but human-like styles *uncorrelated* with correctness, compare:  
  - **Outcome-only RL**  
  - **Process RL** (PRM trained on human-annotated steps)  
  - **Outcome + style filter:** Outcome RL but discard solutions violating human stylistic norms (e.g., reject jumps > 3 steps).  

  **Strong Result:** If process RL substantially outperforms outcome-only *and* outcome + style filter, while human stylistic conformity shows **low correlation** with correctness (e.g., messy/leaping solutions are equally or more correct), legibility prior is undermined. The gain comes from dense rewards, not style.  
  - *Why strong?* Your hypothesis predicts outcome + filter should match process RL (since both enforce style). If not, credit assignment matters.  
  - *Defender response:* Argue that human annotations still capture *some* correctness-correlated features. But if stylistically "weird" solutions are equally correct and PRM rewards them (per step), this weakens.  
  - *Feasibility:* Cheap. Use domains like theorem proving (weird shortcuts exist) or code generation (multiple styles). Measure style-correctness correlation explicitly.  

  ---

  ### Awkward Evidence: Advantage Grows with Model Strength  
  **Experiment:** Scale base models from weak to superhuman on a fixed task (e.g., math). For each, train:  
  - **Process RL** (fixed human-trained PRM)  
  - **Outcome-only RL**  
  - **Oracle process RL:** PRM trained on *correct* steps (human-like or not).  

  **Awkward Result:** If process RL’s advantage over outcome-only **increases** with model scale—and the human-trained PRM achieves near-oracle performance—it suggests credit assignment improves with capability, not that drift hurts legibility.  
  - *Why awkward?* You predict shrinking gains as models drift from human styles. If gains grow, legibility isn’t the bottleneck.  
  - *Defender escape:* Claim human styles still correlate with correctness even for strong models. But if base models generate novel strategies and the fixed PRM *rewards their correct steps*, this is credit assignment.  
  - *Feasibility:* Moderate (costly scaling but straightforward).  

  ---

  ### Hedging and Unfalsifiability Risks  
  - **Your escape hatch ("templates correlate with truth") risks unfalsifiability.** If *any* successful process reward is attributed to correlation, the hypothesis becomes vacuous. To block this:  
    - Demand **causal interventions**: e.g., in the non-human-process experiment, if PRMs trained on *arbitrary* styles (uncorrelated with correctness) fail, but correctness-correlated ones work, correlation is necessary—but *human* style isn’t special.  
    - Insist on **style-correctness decoupling**: If human-like style is shown *not* to correlate with correctness in a domain, but process RL still works (via credit assignment), the prior fails.  
  - **Is unfalsifiability acceptable?** For messy mechanisms, some hedging is normal. But your claim is testable if we define "legibility" independently (e.g., human ratings of step clarity) and measure its predictive power for correctness.  

  ---

  ### Conceptual Snags in Your View  
  1. **"Process supervision" and "legibility" are entangled by default.** Human step labels *are* legibility priors—so the "real mechanism" might be both. The critical question is whether *non-legible* process rewards could work.  
  2. **You assume human-like reasoning is suboptimal for strong models.** But in many domains (e.g., math), human-like reasoning is often optimal—so drift may not occur.  
  3. **Outcome signals + style filtering ≠ process rewards.** Filtering removes "weird" solutions *post hoc*, but process rewards *guide exploration*. If filtering matches process RL, it supports you; if not, credit assignment wins.  

  **Ranked threats:**  
  1. **Fatal:** Non-human process rewards beating human-like rewards.  
  2. **Strong:** Process RL beating outcome + style filter in low-correlation domains.  
  3. **Awkward:** Scaling improves process RL gains.  

  If non-human process rewards succeed, your hypothesis dies. If not, it holds—but guard against overfitting "correlation" to evade disconfirmation.
