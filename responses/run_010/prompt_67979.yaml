prompt: |-
  So I fell down a rabbit hole on the whole "revolutions devour their children" thing and now I've got this itch to work out what the phrase actually picks out, because I use it constantly and I can't say when it applies. Here's my gut on a bunch of cases, roughly in the order I thought of them:

  - Danton and Camille Desmoulins, April 1794: counts, obviously. Desmoulins was Robespierre's schoolfriend, Danton more or less willed the Revolutionary Tribunal into existence the year before, and then the Tribunal ate them.
  - Robespierre himself, 9 Thermidor, guillotined alongside Saint-Just with no trial by the Convention using the emergency machinery he'd built: counts, and I think it's the paradigm.
  - Fouquier-Tinville, the Tribunal's own public prosecutor, guillotined in 1795: counts, though he feels more like the teeth of the machine than one of its children.
  - The Girondins — Brissot, Vergniaud, the rest — October 1793: counts. Vergniaud voted for the king's death and spent a year legitimating the exact thing that killed him.
  - Marie Antoinette two weeks earlier: doesn't count at all. She's the meal the revolution was built to eat, not its child.
  - Louis Capet: doesn't count, same reason.
  - Condorcet: declared an outlaw in '93, went to ground, arrested in a village outside Paris, dead in his cell overnight, probably by his own hand. Counts, and it's the one that gets me most, even though no law formally killed him and he'd spent his last year attacking the Montagnards.
  - Olympe de Gouges, guillotined November 1793: counts, though I hesitate, since she was a pamphleteer and never held power.
  - The Hébertistes: counts, though they were the ones screaming for more terror, so maybe that's just a trim rather than a devouring.
  - Carrier: the Nantes drownings dont count for me (the victims were counter-revolutionaries and locals), but his own guillotining by the Thermidorians does.
  - The September Massacres: doesn't count. Popular slaughter of prisoners, no institutional shape to it.
  - Mirabeau: dying of illness in 1791 obviously doesn't count, but the Panthéon threw his body out once it came out he'd been taking money from the court, and later put Marat in the tomb instead — and I think THAT counts as a kind of devouring, which worries me, because if posthumous erasure counts then Marat counts too (pantheonized, then dug back up months later) and basically everyone counts.
  - The Thermidorian White Terror of 1795, Jacobins murdered in the south: doesn't count, that's the reaction eating the revolution, which is a different animal.
  - Kronstadt 1921: counts, barely — the sailors were the showcase troops of 1917 and in open rebellion by '21, so I can't tell whether they're children being eaten or enemies being fought.
  - Trotsky, ice pick in Mexico, 1940: counts, even though no revolutionary court laid a hand on him.
  - Bukharin and the Old Bolsheviks: counts.
  - Liu Shaoqi, dead in a Kaifeng infirmary in 1969 after two years of beatings and self-criticism: counts, and I'd say the teenage Red Guards who got shipped to the countryside not long after count too, even though they'd been the perpetrators.
  - A rank-and-file sans-culotte denounced by his own section and guillotined in 1794: I want to say doesn't count, and I hate that I want to say it, because it makes the metaphor a story about famous men.

  My tentative rule is: the victim has to be (i) one of the movement's own, (ii) destroyed by an instrument the movement built in its own name, and (iii) — the part I'm unsure about — a co-author of that instrument, at least by endorsement. But it fails my own verdicts in both directions. Condorcet and Trotsky fail (ii) hard and I still say they count. The sans-culotte passes (i) and (ii) easily and I said he doesn't. And (iii) can't be about guilt — I'm fine with a victim who genuinely conspired — but I'd say a real royalist spy executed by the Tribunal doesn't count, so it's about standing rather than innocence.

  Can you build me the actual principle? I want the clauses stated precisely with which of my cases motivates each one, and if there's a genuine fork I want both candidates rather than a fudge. Then tell me what your best one says about cases I didn't list: the princesse de Lamballe murdered in September '92, Charlotte Corday, a Jacobin who really did plot against the Committee and was caught at it, and someone purged and scrubbed from the official record who then dies of old age abroad. Be honest about which of my verdicts you have to overturn — I'd rather lose one than end up with a rule that just says purge and dresses it up as devouring.

  Last thing, and it's why I care: does the principle you land on make the eating structural or accidental? If it has to include co-authorship and self-built instruments, it starts to look like the Terror was always going to circle back on its makers, which is a big claim about 1789 and not just about 1794. If it doesn't, the metaphor is just a label for the fact that winning coalitions fall out. Tell me which of those I'm buying if I keep my verdicts.
reasoning: |-
  Okay, the user has presented a fascinating and intricate analysis of the phrase "revolutions devour their children," drawing from various historical cases, primarily from the French Revolution. They've listed multiple scenarios where they feel the phrase applies or doesn't, and they're struggling to define a consistent principle. Their tentative rule involves three conditions: (i) being part of the movement, (ii) destroyed by the movement's own instruments, and (iii) co-authorship of those instruments. However, they note contradictions in their own judgments—Condorcet and Trotsky don't meet (ii) but they count them, while a rank-and-file sans-culotte meets (i) and (ii) but doesn't feel like it counts.

  I need to help them build a precise principle that explains when the phrase applies. They want clarity on each clause, referencing their cases, and to address potential forks. They also want me to apply this principle to new cases: Princesse de Lamballe, Charlotte Corday, a plotting Jacobin, and someone purged who dies abroad. Additionally, they're concerned about whether the devouring is structural (inevitable) or accidental (just coalition politics), which ties into the deeper implications of the metaphor.

  First, I should analyze why their tentative rule fails. Condorcet and Trotsky were key figures in their revolutions but were killed by methods not directly involving the institutions they helped create. The sans-culotte example is tricky because the user intuitively excludes it, possibly because the victim wasn't influential. This suggests that "children" refers to leaders or significant contributors, not just any participant. The co-authorship aspect (iii) might be too narrow if it requires direct involvement in building the instrument; endorsement or symbolic association could suffice.

  Looking at their cases, Marie Antoinette and Louis XVI are clearly not "children" but the targets of the revolution. The Thermidorian White Terror is the reaction eating the revolution, so it's different. Kronstadt is borderline because the sailors were once icons but became rebels, blurring the line between internal purge and external conflict. Trotsky's assassination, though not by a court, still feels like devouring because Stalin used the revolutionary apparatus symbolically.

  To define the principle, I need clauses that capture:
  1. **Membership**: The victim must be part of the revolutionary movement, not its enemy.
  2. **Instrumentality**: The means of destruction must be born from the revolution itself, not just any violence.
  3. **Symbolic Significance**: The victim must embody the revolution's ideals or methods, making their destruction a perverse fulfillment of revolutionary logic.

  For example, Condorcet and Trotsky meet symbolic significance even without direct instrumentality. The sans-culotte lacks symbolic significance, so it doesn't count. Applying this to new cases: Princesse de Lamballe is not a child; Charlotte Corday is an enemy; a plotting Jacobin might count if purged officially; someone purged but dying abroad doesn't involve revolutionary instruments.

  The user also wants to know if this makes devouring structural or accidental. If symbolic significance is key, it suggests that revolutions create mechanisms and ideals that can turn against their own, making it structural. But it's not inevitable—it depends on how the revolution evolves. This addresses their concern about buying into a deterministic view versus coalition politics.

  I'll structure the response by stating the refined principle, explaining each clause with their cases, addressing forks, applying to new examples, and discussing structural implications. I'll be honest about overturning their sans-culotte verdict and possibly Kronstadt, emphasizing that significance matters more than fame. Finally, I'll confirm that this principle supports the structural interpretation, seeing devouring as a tragic outcome of revolutionary dynamics.
answer: |-
  Here's a precise principle built from your cases and designed to handle the ambiguities you identified. It overturns one of your verdicts explicitly and refines the concept of "children" to avoid making it *only* about famous men, while still excluding mere foot soldiers. The core insight is that "devouring" requires the victim's destruction to be a *perverse fulfillment* of the revolution's own logic and mechanisms, targeting someone who symbolically *was* the revolution.

  **The Principle:**
  A revolution devours its child when:
  1.  **Membership:** The victim was a recognized *participant* in or *symbol* of the revolutionary movement's struggle for power and the establishment of its new order (not merely a beneficiary or bystander).
  2.  **Instrumentality:** The victim is destroyed using **methods, institutions, or legitimizing frameworks** *created, normalized, or radically empowered* by the revolution *itself* to eliminate perceived threats to its existence or purity.
  3.  **Symbolic Consumption:** The victim's destruction serves to **purify, redefine, or consolidate** the revolution *in the eyes of its remaining leadership/core adherents*, often by framing them as an embodiment of a dangerous internal deviation (excess, moderation, betrayal, corruption) that the revolutionary logic *demands* be excised. The victim must be plausibly seen, at the point of destruction, as having been *of* the revolution, not merely *against* it from the outside.

  **Clause Breakdown & Case Motivation:**

  1.  **Membership (Victim was "of" the Revolution):**
      *   *Motivated by:* Danton, Desmoulins, Robespierre, Saint-Just, Fouquier-Tinville, Girondins (all held power/led factions), Condorcet (key intellectual, Convention deputy), Olympe de Gouges (pamphleteer directly engaging revolutionary politics), Hébertistes (radical faction), Carrier (representative-on-mission), Old Bolsheviks, Liu Shaoqi, Red Guards (participants/perpetrators), Trotsky (co-leader). *Excludes:* Marie Antoinette, Louis XVI (targets), Princesse de Lamballe (target), Charlotte Corday (counter-revolutionary assassin), real royalist spy (enemy agent).
      *   *Clarifies:* This includes intellectuals, propagandists, and ideological symbols (like the Red Guards *as a concept*), not just formal office holders. It requires active participation in the revolutionary *project*, not just existence within its territory.

  2.  **Instrumentality (Destroyed by the Revolution's Own Creations/Norms):**
      *   *Motivated by:* Danton/Desmoulins/Robespierre/Saint-Just/Girondins/de Gouges/Fouquier-Tinville/Carrier (Revolutionary Tribunal/Law of Suspects), Bukharin (Show Trials), Liu Shaoqi (Struggle Session/Cultural Revolution apparatus), Hébertistes (Tribunal). *Includes:* Condorcet (declared outlaw by revolutionary authority, hunted by revolutionary state, died in revolutionary custody – captures the *atmosphere* and *targeting* by revolutionary instruments, even if not formal sentence). *Includes:* Trotsky (Assassination by NKVD using revolutionary exile networks/resources, framed as eliminating a counter-revolutionary traitor by the revolutionary state – leverages the *security apparatus* and *ideological framing* born of the revolution). *Excludes:* September Massacres (spontaneous mob, no institutional framework), Thermidorian White Terror (reactionary violence using different instruments/justification), Kronstadt (open military rebellion met with military force – instrumentality is state *defense*, not internal purification *using revolutionary norms*).
      *   *Clarifies:* "Instruments" include legal/judicial frameworks (Tribunal, Show Trials), bureaucratic/political mechanisms (purging from party, denunciation systems), state security organs (NKVD, CPSU Control Commissions), and the *normalization of extralegal violence* driven by revolutionary ideology against internal enemies (as with Condorcet's outlaw status). It's about *how* and *under what legitimizing idea* the destruction occurs.

  3.  **Symbolic Consumption (Destruction Serves Revolutionary Self-Purification):**
      *   *Motivated by:* The core paradox – *why* the revolution turns on those who helped build it. Robespierre devouring Danton ("indulgence") and Hébert ("excess") to save the Republic; Stalin devouring Bukharin ("right deviation") to consolidate "true" Bolshevism; Mao devouring Liu Shaoqi ("capitalist roader") to maintain revolutionary purity; Thermidorians devouring Robespierre ("tyranny") to save the Republic from the Terror *he* embodied; Fouquier-Tinville executed as the "butcher" of the Terror apparatus *by* those dismantling it while still claiming the Republic. *Excludes:* The rank-and-file sans-culotte (his destruction doesn't redefine the revolution; he's just a casualty). *Excludes:* Louis XVI (his death defines the revolution *against* the old order, not purifies it internally). *Includes:* Olympe de Gouges (killed partly for challenging Jacobin patriarchy, seen as deviating from revolutionary unity/norms). *Includes:* Trotsky (his elimination is necessary to Stalin's claim to be Lenin's *true* heir and defender of the Revolution).
      *   *Clarifies:* This is the key to separating "purge" from "devouring." Devouring requires the victim to be framed *using the revolution's own logic* as a threat *to the revolution's essence*. Their destruction isn't just removing a rival; it's a ritual act confirming the revolution's ongoing struggle against internal corruption/betrayal. It explains why Condorcet (the outlawed philosopher embodying dangerous moderation) counts, but a random sans-culotte doesn't.

  **Handling Forks & Your Tentative Rule's Issues:**

  *   **Co-Authorship (Your iii):** This is *subsumed* into **Symbolic Consumption**. A victim doesn't need to have *literally* built the guillotine or drafted the Law of 22 Prairial. They need to have been *associated* with the revolution's methods/ideals in a way that makes their destruction by those methods an act of symbolic self-consumption (e.g., Condorcet championed reason and progress, killed by the unreason he helped unleash; Trotsky championed permanent revolution, killed by the apparatus born of revolution). Fouquier-Tinville *is* the teeth, but his execution *by the Thermidorians* uses the revolutionary framework to purge its own excess, consuming the symbol of the Terror.
  *   **The Sans-Culotte Verdict Overturned:** Your intuition that he shouldn't count is correct, but under your tentative rule (i & ii), he qualified. The **Symbolic Consumption** clause fixes this. His death lacks the symbolic weight; he's not consumed to redefine the revolution, just eliminated as an individual threat or example. He fails clause 3. *This avoids making it solely about famous men* – a significant Red Guard leader purged and "struggled" against during the Cultural Revolution *could* qualify (embodying the excess now deemed dangerous), while a random participant does not.
  *   **Kronstadt Fork:** Under this principle, **it does not count**. The sailors transitioned from symbols (1917) to *open military rebels* (1921). They were fought as *external enemies* using the Red Army (the state's defensive instrument), not consumed as internal deviations using the revolution's *purifying* instruments (purge trials, Cheka ideological targeting). The justification was counter-revolution/rebellion, not purging a deviation *within* Bolshevism (though the line was blurred by Bolshevik rhetoric). It fails **Symbolic Consumption** as defined here – they were enemies, not children being eaten.

  **Application to New Cases:**

  1.  **Princesse de Lamballe (Murdered Sept 1792):** *Does not count.* Clear **Membership** failure. She was a royal intimate, a pure target/victim of revolutionary violence, not a participant or symbol *of* the revolution. Instrumentality (mob violence) wasn't distinctly revolutionary *institutional* framework.
  2.  **Charlotte Corday (Assassin of Marat):** *Does not count.* **Membership** failure. She was a committed counter-revolutionary acting against the revolution. Her execution used revolutionary instruments (Tribunal), but she was an enemy, not a child being consumed (**Symbolic Consumption** failure).
  3.  **A Jacobin who genuinely plotted against the Committee and was caught:** *Does not count (as devouring).* This is a straightforward case of punishing treason. While they pass **Membership** and **Instrumentality** (caught plotting, executed by Tribunal/Committee machinery), they fail **Symbolic Consumption**. Their destruction isn't about *purifying* the revolution by consuming a symbol of its own excess or deviation; it's about eliminating a genuine, active, external threat *disguised* as an insider. It's security, not self-consumption. (Contrast with Danton – accused of conspiracy, but primarily consumed as a symbol of indulgence/decadence).
  4.  **Purged and scrubbed from the record, dies of old age abroad:** *Does not count.* Fails **Instrumentality** and **Symbolic Consumption**. While purged/scrubbed (potentially using revolutionary bureaucratic instruments), their *destruction* (death) is not caused by revolutionary instruments. Dying abroad of old age severs the causal link. The erasure is significant but not the act of "devouring" (killing/eliminating). It's more akin to Mirabeau's posthumous disgrace than his body being devoured.

  **Structural vs. Accidental:**

  The principle, particularly the **Symbolic Consumption** clause, makes the devouring **structural**, not accidental. Here's why:

  1.  **Logic of Purity:** Revolutions define themselves against an old order and often adopt Manichean ("us vs. them") thinking. As they consolidate, the "them" inevitably includes former "us" members who now represent deviation (too radical, too moderate, corrupted, rivals). The revolution's initial logic of struggle against enemies *demands* the identification and elimination of new, internal enemies to maintain purity and unity.
  2.  **Empowered Instruments:** The revolution creates powerful instruments (terror, emergency courts, purge mechanisms, ideological policing) precisely to destroy enemies. These instruments, born of existential fear and ideological fervor, develop their own momentum and constituencies. They *require* enemies to justify their existence and power. When external enemies wane, the logic turns inward.
  3.  **Symbolic Necessity:** Eliminating a prominent "child" who symbolizes a dangerous tendency (Danton/indulgence, Bukharin/deviation, Liu/restoration) is a powerful way to signal resolve, redefine orthodoxy, and consolidate control *in the name of the revolution itself*. It's not just a power struggle; it's a ritual act performed *using the revolution's own tools and language*.

  **If you keep your verdicts (especially Condorcet, Trotsky, sans-culotte exclusion), you are buying the structural argument.** You are accepting that the revolutionary process, by its nature (creating instruments of destruction, demanding purity, fostering internal rivalry framed as betrayal), contains the seeds that make the consumption of its own prominent figures *a likely, almost inherent, tragic dynamic*, not merely the accidental fallout of coalition politics. The metaphor highlights the perverse way the revolution fulfills its own logic by consuming those who embodied it at an earlier stage or in a different form. Your rejection of the sans-culotte case reinforces that it's about consuming the *symbolic* children, the architects and icons, demonstrating how the revolution's fire, once lit, must find fuel even within its own house.
