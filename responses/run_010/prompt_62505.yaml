  Your intuitions are remarkably consistent when viewed through a **Principle of Conscientious Non-Complicity with Unjust Harm**. This principle prioritizes avoiding participation in harm or injustice, while imposing constraints to prevent collateral damage or exploitation. It has three core elements:

  1.  **Non-Complicity Core:** The act primarily aims to *prevent, mitigate, or protest a specific, significant harm or injustice* that the actor would otherwise be complicit in or directly affected by. Breaking the law is a *means* to avoid enabling/worsening that harm.
  2.  **Proportionality & Containment:** The method used minimizes *unintended, disproportionate, or unavoidable harm to uninvolved parties* and avoids exploiting systemic cooperation (free-riding).
  3.  **Targeted Defiance:** The defiance targets *the source of the harm/injustice or a rule directly enabling it*, not merely an unrelated rule for convenience.

  **Stated Precisely:**
  *It is permissible to break the law when doing so is a necessary and proportionate means to prevent, mitigate, or protest a specific and significant harm or injustice that the actor would otherwise be complicit in perpetuating or directly subjected to, provided the act minimizes unavoidable harm to uninvolved third parties and avoids exploiting systemic cooperation (free-riding), and where the defiance is targeted at the source of the harm/injustice or the rule directly enabling it.*

  **Applying it to Your Cases:**

  *   **Red Light (3am, empty):** **Permissible.** No significant harm/injustice being addressed (Core fails). Law is arguably disproportionate to context; risk to others is near-zero (Containment satisfied). Breaks containment *only* because no harm/injustice exists to justify it, but the absence of harm makes containment trivial. Your verdict stands.
  *   **Underreporting Tips:** **Not Permissible.** No specific harm/injustice being prevented *by the actor* (Core fails). Classic free-riding – exploits the tax system others uphold (violates Containment - exploits systemic cooperation). Targets an unrelated rule for personal gain, not a harm-source.
  *   **Port Protest (Public, Nonviolent, Arrest):** **Permissible.** Protests specific injustice (climate harm/export harm) actor opposes (Core). Minimizes harm via publicity/nonviolence; targets the harm-source (port); arrest demonstrates non-exploitation (Containment & Targeting).
  *   **Port Protest (Covert, Sabotage, Flee):** **Not Permissible.** Addresses injustice (Core). BUT: Sabotage (draining hydraulics) risks unintended harm (e.g., accidents later, economic harm to unrelated workers); fleeing avoids accountability, potentially escalating responses or undermining rule of law generally (violates Containment - disproportionate/unavoidable harm risk). Targets harm-source, but method fails containment.
  *   **Nurse (Backdates Form):** **Permissible.** Prevents specific, significant harm to a vulnerable patient denied care (Core). Harm prevented (denied scan) is direct and severe. Method minimizes collateral harm (likely minor administrative issue); targets the rule *directly causing the harm* (insurance barrier). Not free-riding – nurse acts *against* a system causing harm.
  *   **Clerk (Denies Licenses):** **Not Permissible.** **This is the key differentiator.** Clerk *perpetrates* the injustice (denying rights), they do not *prevent* it. They are *complicit in causing harm* by enforcing their discriminatory belief, not refusing complicity in harm (Core *fails* – action *is* the harm). Targets the *victims*, not the source (the law they oppose isn't the *tool* they use to harm, it's the *shield* they hide behind while harming). Publicity/jail acceptance is irrelevant because the *core action* is the injustice itself.
  *   **Draft Dodger:** **Permissible.** Avoids direct complicity in perceived aggressive war (significant harm/injustice) (Core). Fleeing minimizes harm to self; targets the conscription rule directly enabling participation. Free-riding concern is outweighed by the core complicity avoidance in severe harm.
  *   **Leaker (War Crimes):** **Permissible.** Prevents ongoing harm by exposing injustice and avoids complicity in concealment (Core). Fleeing minimizes personal harm; targets the secrecy/system enabling the harm. Similar justification to dodger – core complicity avoidance outweighs free-riding concerns about legal system.
  *   **Juror (Nullification):** **Permissible (with unease).** Prevents injustice (application of monstrous statute to defendant) - juror avoids complicity in *that* harm (Core). Method (secret) minimizes immediate disruption but creates unease due to lack of transparency/accountability (a minor containment tension). Targets the specific application of the unjust rule.
  *   **Squatting:** **Permissible (for a while).** Mitigates significant harm (homelessness) for specific families (Core). Targets the rule enabling harm (property rights denying shelter). Containment is the issue: *"Only for a while"* reflects the point where the act shifts from necessary mitigation to unsustainable exploitation (e.g., lack of maintenance, security, services creates new harms, or long-term occupation imposes disproportionate costs/resources on others). It stops when unavoidable harm to others (the families, neighbors, city resources) becomes disproportionate or the act exploits systemic cooperation without a plan.

  **The Engineer Case:**
  *   **Scenario:** Engineer disables harmful feature secretly, takes no credit, lets schedule take blame.
  *   **Verdict by Principle: Permissible.**
      *   **Core:** Prevents specific, significant harm she believes the feature would cause. She avoids complicity in releasing it.
      *   **Containment:** Minimizes immediate disruption (secretly disables). However, *significant tension exists*:
          *   *Potential Harm:* Letting the "schedule slip take the blame" likely harms uninvolved colleagues (reputation, stress, workload) – violates minimization of unavoidable harm to third parties.
          *   *Lack of Accountability:* Secrecy prevents correcting the root cause (why was the feature ordered?) or learning from the issue.
      *   **Targeting:** Directly targets the harmful feature (source of potential harm).
  *   **Assessment:** The Core is strong, justifying the act. However, the *method* violates Containment by shifting blame/harm onto colleagues. Your principle would likely endorse disabling the feature *if possible* but require her to take responsibility to prevent collateral damage. It's permissible only if no *less harmful* method exists (e.g., raising concerns first), and the harm prevented is severe. Your unease would mirror the juror case – justified core, problematic containment via secrecy/shifting blame.

  **Where Your Draft Principle Breaks & Why This One Fits:**
  Your draft ("rule breaking is injustice & don't make others pay") fails the red light (no injustice) and tips (free-riding *is* making others pay). The new principle succeeds by:
  1.  Focusing on **preventing/complicity in *harm***, not just abstract "injustice" (capturing red light, distinguishing nurse vs. clerk).
  2.  Explicitly handling **free-riding/systemic exploitation** as a *type* of harm to others within Containment.
  3.  Making **targeting** crucial (distinguishing clerk's *perpetration* from port protest's *defiance*).
  4.  Explaining your **unease** in juror/squatting/engineer via Containment tensions (secrecy, shifting blame, sustainability).

  **Verdicts This Principle Cannot Accommodate (and Why They Might Be Wrong):**

  1.  **The Clerk: "Not Fine" is Correct, Your Intuition is Right.** The standard civil disobedience checklist fails you here because it focuses on *form* (public, nonviolent, accepts penalty) without sufficiently analyzing the *substance* of the act. Your clerk *is not practicing civil disobedience against injustice; they are using their position to actively inflict injustice.* They are the *perpetrator*, not the resistor. Your intuition correctly identifies this fundamental difference. The principle explains it: the Core fails (action *is* the harm, not preventing it).
  2.  **The Juror's Unease vs. The Nurse: A Tension Worth Exploring.** Your principle explains the unease (Containment - secrecy lacks accountability). Why are you *less* uneasy about the secretive nurse? Likely because:
      *   The harm prevented (denied medical care) is more immediate and visceral.
      *   The potential "collateral damage" (administrative trouble) seems minor and impersonal.
      *   The nurse acts *within* their role to *heal*, while the juror acts *against* their role's perceived function (applying the law).
      The principle highlights this tension, suggesting your greater unease with the juror is *reasonable* – secrecy in overturning laws carries greater systemic risk than an individual act of care. If forced, the principle might suggest the juror's act is *less* defensible than the nurse's due to the containment violation's potential scale.

  **What Would Change My Mind? Key Pressure Points:**

  1.  **The Clerk Case:** If you described a scenario where the clerk was *refusing to enforce* a law *requiring them to actively harm* someone (e.g., refusing to deport someone to certain persecution under a law *mandating* it), *then* it mirrors the nurse/port protest – Core (preventing harm/complicity) satisfied. My verdict would flip. My reasoning is most vulnerable if I mischaracterize the clerk's act as *inherently* harmful when the harm stems solely from the law itself. However, the clerk's *act of refusal* is the direct cause of the *denial of service* in that moment.
  2.  **The Port Night Action:** If the sabotage was *guaranteed* to only delay the *specific* harmful exports without damaging equipment (e.g., a temporary lock), *and* publicity would guarantee immediate violent suppression preventing *any* protest, *then* the harm prevention (Core) might justify the secrecy/contained sabotage, flipping my verdict. My reasoning relies heavily on the *risk* of collateral harm from sabotage/fleeing.
  3.  **The Tax Tips:** If systemic tax injustice was extreme (e.g., taxes fund genocide, evasion is widespread resistance), *and* underreporting was a coordinated act of protest (not personal gain), *then* Core (protest injustice) *might* override the free-riding concern (Containment). This challenges the weight given to "exploiting systemic cooperation." My reasoning is most vulnerable here if I underestimate when systemic injustice renders cooperation morally void.
  4.  **Weighing Conditions:** My reasoning prioritizes the **Non-Complicity Core** above the formal conditions of civil disobedience (publicity, acceptance of penalty). Publicity and penalty-acceptance are primarily *tools* for satisfying **Containment** (minimizing harm, ensuring accountability, appealing to conscience). They are not absolute requirements. This explains why you accept the draft dodger/leaker/nurse fleeing consequences – the Core justification is strong enough to outweigh the Containment benefit of penalty-acceptance in those cases. Where penalty-acceptance *is* crucial (like the port protest), it's because fleeing would *cause* harm (escalation, undermining accountability). The key is whether avoiding the penalty *itself* causes significant harm or exploits the system.

  **Conclusion:**
  Your intuitions reveal a sophisticated moral compass centered on preventing harm and avoiding complicity in injustice, tempered by a practical concern for collateral damage and fair play. The **Principle of Conscientious Non-Complicity with Unjust Harm** captures this structure. It validates most of your verdicts, explains your unease, correctly identifies the clerk as fundamentally different (a perpetrator, not a resistor), and highlights the tension in the secretive engineer/juror cases. It shows why the standard civil disobedience checklist is insufficient – substance (what you are actually *doing* and *why*) matters more than form. The clerk case proves you understand this instinctively. Trust that instinct; it’s pointing to something real.
