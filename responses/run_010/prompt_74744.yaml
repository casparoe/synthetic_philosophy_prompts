prompt: |-
  I'm teaching a 75-minute session in an upper-level seminar that is split roughly evenly between philosophy majors and cognitive science majors. The topic is the distinction between access consciousness and phenomenal consciousness, and the way that distinction structures global workspace theory. The students have met the hard problem and the "what is it like" formulation, so they arrive disposed to treat consciousness as a single mysterious property; none of them has read Block, and they will have no idea why anyone would want two concepts where they think one will do. There is a whiteboard and nothing else: no slides, no video clips, no live demonstrations requiring equipment beyond markers.

  Please give me a teaching plan rather than the explanation itself. Specifically:

  1. The order of presentation. What has to be established before the distinction can be stated at all, and what depends on what, such that the distinction arrives as a solution to a difficulty the students are already feeling rather than as a terminological decree. I want the dependency structure made explicit, with the reason each step must precede the next.

  2. The carrying case. I want the whole session built on one experimental paradigm, and I want you to choose it and defend the choice against the obvious alternatives — change blindness, backward-masked priming, partial report of a briefly presented letter array, and the attentional blink are the candidates I have in mind. Say what features the chosen paradigm must have in order to pull the distinction apart, and what it must lack, since a paradigm that is too suggestive of a simple two-store picture will do damage later.

  3. The whiteboard. Describe what I actually draw or write at each stage — the arrangement of boxes and arrows, or whatever you prefer — and identify which single drawing will have to stay up and be returned to for the rest of the hour.

  4. The misconceptions, in the order they will form. I expect at least four: that access consciousness just means verbal report, so that the theory is only about what people say; that phenomenal consciousness means an ineffable raw feel and is therefore not a fit subject for theorizing; that the distinction licenses a two-box picture in which some content sits in the inaccessible box and other content in the accessible one; and that global workspace theory is either trivially true or simply irrelevant to phenomenal consciousness. Tell me at which precise point in the sequence each should be headed off, and by what move.

  5. Where the session has to concede rather than gloss. There is at least one place where the honest position is that the framework does not settle the question — most obviously over whether there is phenomenology in unattended or locally processed content. Give me a sentence I can say aloud that names the difficulty without either dissolving it or letting it swallow the hour.

  6. The closing check. One question, posed in the final five minutes, whose answers will discriminate the students who have grasped the distinction from those who have merely acquired the vocabulary. Tell me what a good answer sounds like and what a fluent-sounding bad answer sounds like, since the bad answers here are the ones that use all the right terms.

  7. What to leave out, and what to say instead. I will be tempted to bring in higher-order thought accounts, first-order representationalism, recurrent processing as a rival, the dispute over whether animals and infants have the relevant architectures, and the challenge from illusion and transparency arguments. Tell me which of these to cut, and give me the sentence that lets me cut it in front of the class without seeming to be dodging it.
reasoning: |-
  Okay, the user is teaching a 75-minute seminar on access vs. phenomenal consciousness to mixed philosophy and cognitive science students. They want a focused, paradigm-driven plan that builds the distinction naturally. 

  First, assessing the core challenge: students see consciousness as monolithic. The key is making them feel why Block's distinction solves a concrete problem. The attentional blink (AB) paradigm works best here—it's experimentally clean, avoids two-store assumptions, and creates tension between reportability and subjective richness. 

  For the sequence: Start with AB to establish the empirical puzzle (report failure ≠ experience absence). Then dissect what "conscious" means in GWT—revealing the ambiguity. Introduce Block's terms as tools to resolve this. Crucially, delay phenomenal consciousness discussion until after establishing access via GWT. 

  Whiteboard strategy: The central diagram must be the GWT sketch showing broadcasting, not boxes. This prevents the two-store misconception. Later, add Block's distinction as separate dimensions overlaid on it. 

  Misconceptions need proactive handling:
  - When defining access, immediately clarify it's not just verbal report (e.g., "Imagine describing a smell—that's access, even if words fail").
  - For phenomenology, stress it's investigable via subjective measures ("We study it through confidence ratings, not just poetry").
  - When overlaying dimensions, explicitly state: "No boxes—same content can transition between states."

  The concession point comes when discussing unattended stimuli: "GWT tells us when content becomes accessible; whether it was already phenomenally conscious is where theories diverge." This names the debate without derailing. 

  Closing question must force distinction application: "Could AB stimuli be phenomenally conscious but not access-conscious?" Good answers cite blink mechanics; bad answers parrot "access=report" or confuse phenomenology with qualia. 

  Cutting temptations: Higher-order thought theories would overcomplicate. Dismiss with: "Those address different questions—like why consciousness arises at all—while we're mapping its functional profile." 

  This keeps focus on the architecture/access-phenomenology interface without drowning in adjacent debates.
answer: |-
  Here’s a step-by-step teaching plan optimized for conceptual clarity and misconception prevention, using the **attentional blink (AB)** paradigm as the carrying case:

  ---

  ### **1. Order of Presentation & Dependency Structure**  
  *(Total: 70 min)*  
  **Goal:** Make the distinction emerge as a solution to an empirical puzzle.  

  - **Min 0–15: Establish the AB Puzzle**  
    *Why first?* Students need concrete evidence that "consciousness isn’t monolithic."  
    - **Whiteboard:** Draw AB timeline (e.g., rapid serial visual presentation → T1 target → lag → T2 target).  
    - Describe AB: When T1 is reported, T2 (at 200–500ms lag) is often missed.  
    - **Key Q:** "Is T2 *unconscious*? Or is it conscious but fleeting/ignored?"  
    - *Dependency:* AB creates tension between subjective experience (some report "seeing but losing" T2) and objective reportability.  

  - **Min 15–25: Introduce GWT’s Access**  
    *Why now?* GWT resolves AB by explaining *report failure*.  
    - **Whiteboard:** Sketch GWT architecture (perceptual modules → global workspace → broadcasting).  
    - Explain: Consciousness (in GWT) = *global accessibility* for decision/report. AB occurs when T2 fails workspace access due to T1 processing.  
    - **Emphasize:** "Access consciousness = availability to working memory systems."  

  - **Min 25–35: Reveal the Ambiguity**  
    *Why next?* Students now see "consciousness" in GWT is functional. Contrast with pre-theoretic intuition.  
    - **Q:** "In AB, does 'missing' T2 mean it had *no experience*? Or was it experienced but not *used*?"  
    - **Elicit conflict:** Philosophy majors intuit "experience ≠ access"; CogSci majors default to access=consciousness.  

  - **Min 35–45: Introduce Block’s Distinction**  
    *Why here?* The distinction resolves the ambiguity.  
    - Define:  
      - **Phenomenal (P-conscious):** "What it’s like" (e.g., the redness of red).  
      - **Access (A-conscious):** Availability for global control (report, reasoning).  
    - **Whiteboard:** Add Block’s terms *over* GWT sketch. Label workspace "A-conscious"; perceptual inputs "may be P-conscious."  
    - **Pivot:** "AB shows A-consciousness can fail. But was T2 *phenomenally* conscious?"  

  ---

  ### **2. Carrying Case: Why Attentional Blink?**  
  **Defense against alternatives:**  
  - **Change blindness:** Suggests "stored representation" failure (risks two-store misconception).  
  - **Masked priming:** Implies "unconscious = subliminal," conflating access/phenomenal.  
  - **Partial report:** Iconic memory feels like a "box," inviting dualism.  
  - **AB’s advantages:**  
    - Clearly dissociates *subjective experience* (many subjects feel T2) from *reportability*.  
    - Requires attention/access mechanisms (fits GWT).  
    - *Lacks* static "stores" (prevents boxology).  

  ---

  ### **3. Whiteboard Evolution**  
  **Central diagram (must stay after min 25):**  
  ```  
  [Perceptual Modules] → [Global Workspace] → [Broadcasting to Systems]  
  (Label: "A-consciousness = in workspace")  
  ```  
  **Later additions:**  
  - At min 45: Add "P-consciousness?" below perceptual modules.  
  - **Critical:** Draw arrows *into* workspace (not boxes) to show *dynamic access*.  

  ---

  ### **4. Misconceptions & Preemption**  
  - **"A-conscious = verbal report"**  
    *When:* During GWT explanation (min 20).  
    *Preempt:* "Access isn’t just speech—it’s availability for action, memory, or *nonverbal* judgment (e.g., button press)."  

  - **"P-conscious = ineffable raw feel"**  
    *When:* Introducing phenomenal (min 40).  
    *Preempt:* "Phenomenal consciousness is investigable! We measure it via subjective reports (e.g., confidence ratings) or neural correlates. It’s not mystical—just *experiential*."  

  - **"Two-box picture"**  
    *When:* Diagramming Block + GWT (min 45).  
    *Preempt:* "No separate boxes—same content can be P-conscious without A-conscious (e.g., T2 in AB). GWT is about *routes to access*, not storage."  

  - **"GWT is trivial/irrelevant to P-conscious"**  
    *When:* During Q&A or summary (min 60).  
    *Preempt:* "GWT explains *how* A-consciousness works. Whether it explains P-consciousness depends on your view—some say access *constitutes* phenomenology; Block says no."  

  ---

  ### **5. Concession Point**  
  **Issue:** *Does unattended content have phenomenology?*  
  **Sentence (at min 50):**  
  > "GWT tells us when content becomes accessible, but whether rich phenomenology exists *before* access—as in Block’s ‘overflow’ view—is where empirical and philosophical debates collide, and GWT alone doesn’t settle it."  

  ---

  ### **6. Closing Check (Min 70–75)**  
  **Question:** *"In the attentional blink, why might T2 be phenomenally conscious but not access-conscious?"*  
  - **Good answer:** Distinguishes phenomenology (subjective experience during blink) from access (failure to enter workspace for report). Cites AB mechanics: "T2 is perceived but not globally available due to attentional depletion."  
  - **Fluent-sounding bad answer:** Equates access with report or phenomenology with sensation: "T2 is access-unconscious because you can’t say it, but it feels raw." (*Fails to separate concepts*).  

  ---

  ### **7. What to Cut & How**  
  **Cut:**  
  - Higher-order thought (HOT)  
  - First-order representationalism  
  - Recurrent processing rivals  
  - Animal/infant consciousness  
  - Illusion/transparency arguments  

  **Dismissal script:**  
  > "These are crucial debates, but today we’re laser-focused on how Block’s distinction *structures* GWT. Introducing [X] would blur our target: the access/phenomenal split in one key theory."  

  ---

  **Rationale for Flow:**  
  AB → GWT exposes the access problem *first*, making Block’s distinction a necessary tool. Delaying P-consciousness until after GWT prevents premature mystification. The whiteboard anchors GWT’s architecture while allowing Block’s overlay. AB’s temporal dynamics avoid static "box" metaphors, and the closing question tests conceptual separation, not terminology.  

  **Time Buffer:** Save 5 min for recap (define A/P in one sentence each + GWT’s role).
