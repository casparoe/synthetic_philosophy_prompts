  - **Time**: 40 minutes is tight. Use a large visual tree (paper/posters). Have participants self-sort in groups after answering individually.  
  - **Flow**: Start with a quick example (e.g., "Answer Q1 for van-hours"). After sorting, debrief: "Which leaf surprises you? Which awkward commitment feels most uncomfortable?"  
