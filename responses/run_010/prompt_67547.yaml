  Below is a decision tree designed to help participants articulate their beliefs about resource allocation in your federation. It uses 8 branching questions (nodes) to sort into 6 distinct positions (leaves). Questions are grounded in concrete operations (vans, cold storage, compute) and avoid economic jargon, schools of thought, or slogans. The tree prioritizes separating commonly conflated views (e.g., "prices require exchange" vs. "dispersed knowledge requires rivalry").

  ### **Decision Tree Structure**
  **Instructions:** Start at Question 1. Answer "Yes" (Y) or "No" (N) to each question based on your beliefs. Follow the arrows to the next question or a final position (Leaf).

  1. **When allocating resources (e.g., van-hours), is the biggest obstacle that we lack complete data about what each organization truly needs?**  
     - Y → **Q2**  
     - N → **Q3**  

  2. **If we had perfect data about every organization’s needs, could we calculate fair point values for resources (e.g., a van-hour) in advance?**  
     - Y → **Q4**  
     - N → **Q5**  

  3. **Do disagreements about allocation stem mainly from people acting differently when their usage is measured (e.g., underreporting to get cheaper rates)?**  
     - Y → **Q5**  
     - N → **Q6**  

  4. **Could a powerful computer—given all data—accurately assign point values that eliminate queues/shortages for all resources?**  
     - Y → **Leaf D**  
     - N → **Leaf C**  

  5. **Is the value of a resource (e.g., a pallet-slot) only fully known after organizations use it in real situations?**  
     - Y → **Q7**  
     - N → **Leaf C**  

  6. **Should our federation copy methods used by the broader economy (e.g., market prices) for internal allocations?**  
     - Y → **Leaf F**  
     - N → **Q8**  

  7. **Does revealing hidden knowledge (e.g., the driver’s consolidation routine) require members competing to prove better methods?**  
     - Y → **Leaf B**  
     - N → **Leaf A**  

  8. **Can a committee accurately adjust point values over time by observing shortages/surpluses (e.g., warehouse queues)?**  
     - Y → **Leaf C**  
     - N → **Leaf E**  

  ---

  ### **Leaves (Positions)**
  Each leaf includes:  
  - **Customary name** (or "unnamed")  
  - **Most awkward commitment**: One unavoidable implication adherents must accept.  
  - **Prediction about last year’s pilot**: How this view would have explained the outcomes (underreporting, queues vanishing, driver’s routine).  

  - **Leaf A: Economic calculation argument (Mises)**  
    - *Most awkward commitment*: Without real trade, no numerical value can rationally compare a van-hour to compute time.  
    - *Prediction for pilot*: Underreporting was inevitable because points aren’t prices from actual exchange; the system was doomed to distortion.  

  - **Leaf B: Knowledge problem (Hayek)**  
    - *Most awkward commitment*: Even honest committees can’t access tacit knowledge (e.g., the driver’s routine) without rivalry forcing it into the open.  
    - *Prediction for pilot*: The routine surfaced only due to grumbling (proto-rivalry); underreporting proved data is unobservable without competition.  

  - **Leaf C: Trial-and-error planning (Lange-Lerner)**  
    - *Most awkward commitment*: A central body can simulate markets by tweaking points until shortages vanish, even without real trading.  
    - *Prediction for pilot*: Warehouse queues disappeared because points adjusted correctly; underreporting is fixable with better auditing.  

  - **Leaf D: Computational planning (Kantorovich)**  
    - *Most awkward commitment*: Allocation is a math problem—if we ignore human behavior (e.g., underreporting), we can compute optimal points.  
    - *Prediction for pilot*: Underreporting skewed the data; with truthful inputs, a solver could assign perfect points.  

  - **Leaf E: Internal market proposal**  
    - *Most awkward commitment*: Letting members trade points will create internal winners/losers, but it’s necessary to reveal true value.  
    - *Prediction for pilot*: Points were arbitrary without trading; the system would work if members could buy/sell van-hour credits.  

  - **Leaf F: Embedded discipline view**  
    - *Most awkward commitment*: Internal allocations only make sense if anchored to external market prices (e.g., van rental costs).  
    - *Prediction for pilot*: Confusion arose because points weren’t tied to real-world prices; federation resources need external reference points.  

  ---

  ### **Empty Cells (Unoccupied Combinations)**  
  Combinations of answers not leading to a leaf are below. For each:  
  - **Path**: Answers to questions in order.  
