  ### Patriotic Attitude Sorting Instrument  
  *For a discussion group seeking clarity on patriotism, bypassing labels to reveal underlying beliefs.*

  ---

  #### 1. Logical Space: Axes of Variation  
  Patriotism’s meaning fractures along these fault lines. Positions differ in:  
  - **Substitutability**: Whether one’s country is replaceable by a "better" country without loss.  
  - **Comparative/Non-comparative**: Whether patriotism inherently ranks countries or is self-contained love.  
  - **Special Concern vs. Impartial Duty**: Whether duties to compatriots can override duties to strangers; if so, whether this override has *absolute limits* (e.g., forbids harming innocents).  
  - **Object of Attachment**: Whether loyalty binds to *inherited particulars* (land, ancestors, culture) or to a *political order* (institutions, principles).  
  - **Identity Implication**: Whether one feels pride/shame for the country’s deeds (past or present) as if they reflect on oneself.  
  - **Nature of Patriotism**: Whether it is a *sentiment* (feeling) or a *disposition to act*; if the latter, whether free institutions depend on it.  
  - **Moral Arbitrariness of Borders**: Whether national boundaries have intrinsic moral weight.  

  ---

  #### 2. Grid of Positions  
  *Combinations marked 🔲 (occupied) or ⬜ (empty). Empty cells are rare; most gaps are unattractive (e.g., incoherent moral demands) rather than impossible.*  

  | Substitutability | Comparative? | Special Concern Override | Object          | Identity Implication? | Nature of Patriotism       | Moral Weight of Borders? | Position Type                     |  
  |------------------|--------------|--------------------------|-----------------|------------------------|----------------------------|--------------------------|-----------------------------------|  
  | No               | Yes          | Strong                   | Particulars     | Yes                    | Disposition (dependent)    | No                       | GloryEnd (🔲)                     |  
  | No               | No           | Moderate                 | Particulars     | No                     | Sentiment                  | Yes                      | SharedLife (🔲)                   |  
  | No               | No           | Moderate                 | Principles      | No                     | Disposition (dependent)    | Yes                      | DutyCitizenship (🔲)              |  
  | No               | No           | None                     | Principles      | Yes                    | Disposition (dependent)    | Yes                      | PrinciplesObject (🔲)             |  
  | Yes              | No           | Moderate                 | Mixed           | No                     | Sentiment                  | No                       | BoundedConcern (🔲)               |  
  | Yes              | —            | None                     | —               | No                     | —                          | No                       | Cosmopolitan (🔲)                 |  
  | —                | —            | —                        | —               | —                      | —                          | —                        | Vice (🔲)*                        |  
  | —                | —            | —                        | —               | —                      | —                          | —                        | Dissolution (🔲)                  |  

  **Notes on empty cells (⬜):**  
  - *Strong override + Principles object*: Empty (incoherent—principles like equality forbid such partiality).  
  - *Substitutable + Identity implication*: Empty (unattractive—why feel shame for a replaceable entity?).  
  - *Vice*: Not a "positive" patriotic stance but a critical meta-view; included for completeness.  

  ---

  #### 3. Ten Questions  
  *Answer in plain language, as if speaking to a friend. Choose one option per question.*  

  1. **Shame at a massacre your country committed 60 years before you were born.**  
     - A: "I feel a knot in my stomach, like it stains me too."  
     - B: "I feel sickened by what was done, but it’s not about me."  
     - C: "It’s a historical tragedy. I wasn’t there, so it doesn’t touch me."  

  2. **Offered permanent relocation to a freer, richer, better-run country.**  
     - A: "I’d pack tomorrow. Why stay when life would be better there?"  
     - B: "I’d stay. This is home, flaws and all."  
     - C: "I’d feel like a traitor even considering it."  

  3. **Disclosing evidence of your country’s atrocity to a foreign newspaper while soldiers are still fighting.**  
     - A: "I’d leak it. The truth could stop the killing."  
     - B: "I’d never betray our troops like that, even if it’s wrong."  
     - C: "I’d share it with our own officials, not foreign press during war."  

  4. **Supporting your national sports team against a country whose government you view as more legitimate.**  
     - A: "I’ll cheer our team. Sports aren’t about governments."  
     - B: "I’ll cheer louder—it’s about pride in our people."  
     - C: "I’d feel uneasy, like I’m endorsing something corrupt."  

  5. **A naturalized neighbor: kind, law-abiding, but unmoved by flags or anthems.**  
     - A: "I respect them. Actions matter, not symbols."  
     - B: "They’re missing something beautiful about belonging."  
     - C: "It worries me. How can they be loyal without that feeling?"  

  6. **Allocating one school place or transplantable organ to a compatriot or stranger (equal need/desert).**  
     - A: "I’d choose the compatriot for both."  
     - B: "I’d choose the compatriot for the school, but flip a coin for the organ."  
     - C: "I’d flip a coin for both."  

  7. **Seeing your country suffer while an equally devastated foreign nation pleads for aid.**  
     - A: "We must help our own first. Our duty starts here."  
     - B: "I’d focus on home, but I’d chip in for them too if I could."  
     - C: "Pain is pain. I’d split my effort evenly."  

  8. **Your reaction if citizens stopped caring about national symbols but obeyed laws.**  
     - A: "It’s fine. Laws keep society running, not feelings."  
     - B: "It’s risky. Symbols bind us—without them, society frays."  
     - C: "Disaster. Freedom needs love of country to survive."  

  9. **Hearing your country praised as "the greatest" by a politician.**  
     - A: "It warms my heart. We *are* exceptional."  
     - B: "I’m proud, but ‘greatest’ feels arrogant—we’re just home."  
     - C: "It’s divisive nonsense. No country is inherently better."  

  10. **Loving your country making it harder to see its flaws?**  
      - A: "No. True love means demanding better."  
      - B: "Sometimes, but the good outweighs the risk."  
      - C: "Yes. It blinds you to ugly truths."  

  ---

  #### 4. Scoring Key and Leaves  
  *Map your answers to positions using decisive combinations. If your pattern doesn’t fit, default to Dissolution.*  

  | Leaf Position                     | Decisive Answer Combinations                                  |  
  |-----------------------------------|---------------------------------------------------------------|  
  | **GloryEnd**                      | Q1=A, Q3=B, Q5=C, Q6=A, Q9=A                                 |  
  | *Country’s glory as an end in itself.* |                                                          |  
  | **SharedLife**                    | Q2=B, Q4=A, Q6=B, Q7=B, Q9=B                                 |  
  | *Shared ways of life ground morality.* |                                                        |  
  | **DutyCitizenship**               | Q3=C, Q6=B, Q8=C, Q9=B                                       |  
  | *Patriotism as duty to sustain free institutions.* |                                                 |  
  | **PrinciplesObject**              | Q1=B, Q3=A, Q5=A, Q8=A, Q9=B, Q10=A                          |  
  | *Loyalty to principles; criticism as patriotism.* |                                          |  
  | **BoundedConcern**                | Q2=A, Q4=A, Q6=B, Q7=B, Q10=B                                |  
  | *Special concern permitted but limited, no superiority.* |                                    |  
  | **Vice**                          | Q10=C + *either* Q1=C *or* Q6=C                               |  
  | *Patriotism corrupts judgment.*   |                                                               |  
  | **Cosmopolitan**                  | Q1=C, Q2=A, Q6=C, Q7=C, Q9=C                                 |  
  | *Borders are arbitrary; no special duties.* |                                             |  
  | **Dissolution**                   | *All other patterns*                                          |  
  | *Patriotism is a bundle, not one attitude.* |                                               |  

  **For the group leader:**  
  - If a respondent’s answers land in an empty grid cell (e.g., Q1=A + Q2=A), assign to **Dissolution**. These patterns are rare and reflect unstable/incoherent views.  
  - **Honest limitation:** The instrument *cannot reliably separate* **PrinciplesObject** and **Cosmopolitan** if the respondent (a) affirms principles (Q3=A, Q5=A) *and* (b) sees borders as arbitrary (Q2=A, Q6=C). This occurs when someone champions principles in their country *without* special loyalty to it (e.g., "I fight for justice here, but I’d do it anywhere"). No question pries them apart because both positions reject inherited attachment—only context (e.g., willingness to abandon ship) might distinguish them, but the instrument lacks that.  

  ---

  **How to Use:**  
  1. Participants answer all 10 questions.  
  2. Match answers to the "decisive combinations" above.  
  3. Discuss the *positions*, not the labels—e.g., "Who here thinks patriotism is a duty to institutions?" instead of "Who’s a civic nationalist?"  
  4. For disputed matches, revisit the questions; the options are designed to force trade-offs.  

  This tree sorts by *what you believe*, not what you call it—and might spare you a long evening’s argument.
