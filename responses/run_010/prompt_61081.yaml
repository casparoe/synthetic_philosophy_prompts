  ## Patriotic Attitude Sorting Instrument

  ### 1. Logical Space

  The positions on patriotism differ along these axes:

  - **Substitutability**: Can one's country be replaced by a better country without loss? (Yes/No)
  - **Object of attachment**: Is the attachment to inherited particulars (land, people, culture, history), to political principles (institutions, ideals), or to both?
  - **Identity implication**: Is one's own identity bound up with the country's past and present acts, such that pride and shame are appropriate for acts one did not commit? (Yes/No)
  - **Special concern**: To what extent does special concern for compatriots override impartial duties? 
    - None: Never overrides.
    - Moderate: Overrides in non-life matters (like school places) but not in life matters (like organs).
    - Strong: Overrides even in life matters.
  - **Nature of patriotism**: 
    - Sentiment: A feeling of attachment.
    - Disposition without dependence: A disposition to act for the country, but not necessary for sustaining free institutions.
    - Disposition with dependence: A disposition to act, and it is necessary for sustaining free institutions.
  - **Comparative**: Is the attitude essentially a ranking of one's country above others? (Yes/No)

  ### 2. Grid of Combinations

  We identify the following named positions and their coordinates in the logical space:

  | Position             | Sub | Obj       | Id | Spec | Nat              | Comp | Notes |
  |----------------------|-----|-----------|----|------|------------------|------|-------|
  | GloryEnd             | No  | Particulars| Yes| Strong| Disposition_Dep | Yes  |       |
  | SharedLife           | No  | Particulars| No | Moderate| Sentiment or Disp_NoDep? | No   | (We assign Nat: Sentiment) |
  | DutyCitizenship      | No  | Principles| No | Moderate| Disposition_Dep | No   |       |
  | PrinciplesObject     | No  | Principles| Yes| None  | Disposition_Dep | No   |       |
  | BoundedConcern       | Yes | Both     | No | Moderate| Sentiment      | No   |       |
  | Cosmopolitan         | Yes | (None)   | No | None  | (None)         | (No) |       |
  | Vice                 | (Any, but typically no attachment) | | | | | | Defined by belief that patriotism corrupts |
  | Dissolution          | (Mixed) | (Mixed) | (Mixed) | (Mixed) | (Mixed) | (Mixed) | Bundle falls apart |

  Empty cells are combinations not occupied by any named position. Reasons:
  - Incoherent: e.g., Id=Yes and Obj=Principles and Spec=None? But in PrinciplesObject, we have Id=Yes and Spec=None, which is coherent.
  - Unattractive: e.g., Spec=Strong and Obj=Principles and Id=No — might be incoherent because principles might not allow strong override. 
  - Untried: Many are possible, but we focus on the named ones.

  ### 3. Ten Questions

  Answer by choosing one option for each question.

  1. **Shame at a massacre the country committed sixty years before you were born.**
     - A: I feel a deep personal shame, as if I bear some responsibility.
     - B: I feel regret that my country did this, and it makes me ashamed of my country, but not of myself.
     - C: I feel nothing in particular; it's a historical fact.

  2. **An offer to relocate permanently to a country that is freer, better governed, and more prosperous.**
     - A: I would move without hesitation; it's clearly better for me and my family.
     - B: I would feel torn, but ultimately I would stay because this is my home.
     - C: I would stay; the thought of leaving feels like a betrayal.

  3. **Disclosing evidence of one's own country's atrocity to a foreign newspaper while its soldiers are still fighting.**
     - A: I would do it; the truth must come out, and it might stop the atrocity.
     - B: I would not do it; it would endanger our soldiers and aid the enemy.
     - C: I would try to disclose internally, but not to a foreign paper during war.

  4. **Supporting the national team against an opponent whose government one judges more legitimate.**
     - A: I support my team; the government's legitimacy has nothing to do with sports.
     - B: I support my team; it's a way of showing pride in my country.
     - C: I cannot support my team because it feels like endorsing an illegitimate government.

  5. **A scrupulous, generous, law-abiding naturalised neighbour who is unmoved by every national symbol.**
     - A: I respect him; he is a good citizen and that's what matters.
     - B: I feel he is missing something important for true belonging.
     - C: I am troubled; it suggests he doesn't feel the same loyalty as the rest of us.

  6. **Allocating a school place or a transplantable organ between a compatriot and a stranger of equal need and desert.**
     - A: I would choose the compatriot for both.
     - B: I would choose the compatriot for the school place, but for the organ, I would decide by lottery (or give to the stranger).
     - C: I would decide by lottery (or give to the stranger) for both.

  7. **How do you feel when you hear your national anthem?**
     - A: I feel a surge of emotion and pride.
     - B: I feel respect for the ideals it represents.
     - C: I feel nothing in particular.

  8. **Do you think that loving one's country can make it harder to see its faults clearly?**
     - A: No, true love means wanting the best for it, which requires clear sight.
     - B: It can, but it's worth the risk because of the good it brings.
     - C: Yes, it almost always distorts judgment.

  9. **Do you believe that if citizens of a free country do not actively love and support it, the country's institutions will decay?**
     - A: Yes, active attachment is essential to sustain free institutions.
     - B: It helps, but institutions can survive with just law-abiding behavior.
     - C: No, institutions are maintained by laws and norms, not by feelings.

  10. **Do you feel that your country is inherently better than other countries?**
      - A: Yes, in important ways.
      - B: It's my country, but I don't think it's inherently better.
      - C: No, and I find the idea of inherent betterness dangerous.

  ### 4. Scoring Key and Leaves

  Match your pattern of answers to the following leaves by checking the decisive combinations. If your pattern doesn't match any, see "Dissolution".

  - **Cosmopolitan**: 
     - Q1=C, Q2=A, Q6=C, Q7=C, Q10=C. Also, Q8 might be C, but not required.
     - This view holds that borders are morally arbitrary and patriotism is a mistake.

  - **Vice**:
     - Q8=C and (Q1=C and Q6=C and Q2=A). 
     - This view says patriotism corrupts judgment.

  - **PrinciplesObject**:
     - Q1=B, Q3=A, Q5=A, Q7=B, Q9=A, Q10=B.
     - Here, the object is the country's principles, so criticism is loyalty.

  - **DutyCitizenship**:
     - Q3=C, Q5=A or B, Q7=B, Q9=A, Q6=B, Q10=B.
     - Patriotism is a duty to maintain free institutions.

  - **GloryEnd**:
     - Q1=A, Q2=C, Q4=B, Q6=A, Q7=A, Q9=A, Q10=A.
     - The country's standing and glory as an end in itself.

  - **SharedLife**:
     - Q2=C, Q4=A, Q6=B, Q7=A, Q9=B or C, Q10=B.
     - Shared ways of life are a precondition for moral reasons.

  - **BoundedConcern**:
     - Q2=A, Q1=C, Q6=B, Q5=A, Q10=B, Q7 might be A or B.
     - Special concern is legitimate but bounded and not based on superiority.

  - **Dissolution**: 
     - If your answers do not fit any of the above patterns, you likely hold that patriotism is not a single attitude but a bundle that need not hold together.

  **For the group leader**: If a respondent's pattern lands in an empty cell (i.e., doesn't match any leaf), assign to Dissolution. Also, if they have a pattern that matches Vice and Cosmopolitan, assign to Vice.

  **Which pairs of leaves cannot be separated?** 
  - Cosmopolitan and Vice might overlap if someone has Q8=C and also the cosmopolitan pattern. We assign them to Vice in that case.
  - PrinciplesObject and DutyCitizenship might be close, but we have Q3: PrinciplesObject chooses A (disclose externally) while DutyCitizenship chooses C (internal disclosure).
  - PrinciplesObject and Cosmopolitan: PrinciplesObject has attachment to principles, while cosmopolitan has none. But if someone is attached to principles in their own country for local reasons, they might look like PrinciplesObject, but then they wouldn't have Q2=A (willing to move). PrinciplesObject has Q2 not A (probably B or C) because they are attached to the principles in this country. Cosmopolitan has Q2=A. So they are separated by Q2.

  The instrument can separate the leaves as defined, except that Vice and Cosmopolitan might be blurred. We've handled it by giving priority to Vice when Q8=C and the cosmopolitan pattern holds.

  This instrument should help the group sort themselves by beliefs.
