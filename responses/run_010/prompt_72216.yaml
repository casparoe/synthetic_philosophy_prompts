prompt: |-
  Thirty-eight years as an atmospheric physicist, and the last dozen of those were spent writing assessments for committees and then sitting in the room while people with no idea what an error bar was decided what to do with them. I'm retired now, I've finally read Thucydides properly cover to cover, and honestly it reads like my old job with better sentences. So I want to get into the modern literature on expertise and democracy, epistocracy, all of that. But before I buy a pile of books I want the spec, and I don't want a reading list from you — I can find the books myself. I want to know what I should be demanding of any of them.

  So: write me the requirements a theory of expert advice to a political body has to meet, where the body holds the actual decision power and the expert has no authority beyond being listened to. What does such a theory have to explain, which cases does it have to get right, which distinctions can it not collapse, what does it have to be consistent with? Give me the case or the consideration behind each requirement, and mark which are genuinely non-negotiable and which ones you suspect are just the prejudices of one camp or another — including possibly mine.

  I want the motivating cases drawn from the three Athenian failures, because between them they seem to me to cover failure modes the modern discussion doesn't treat as one problem:

  - Mytilene: Cleon gets the assembly to decree the slaughter of the whole adult male population, they sleep on it, reopen the debate the next day, and Diodotus wins the reversal by a hair — but wins it by refusing to argue the Mytileneans deserve mercy and arguing only that a massacre is bad policy. Then they execute a thousand or so of the ringleaders anyway. And the reversal only works at all because a second trireme physically outruns the first one.
  - Sicily: Nicias is asked to advise on the expedition, opposes it, and when opposing it fails he tries to kill it by demanding an enormous force — and the assembly votes him a bigger one. He ends up commanding a war he argued against, with his chief rival pulled off the campaign to answer charges at home, and at the end he takes his diviners' word about a lunar eclipse and sits still for the better part of a month while getting out is still possible.
  - Socrates: tells the court the plain truth, declines to parade his weeping family, offers free meals at public expense as his counter-penalty, and the margin for death gets wider, not narrower. And here too a ship's schedule decides when the sentence is carried out — the execution waits on the sacred voyage to Delos.

  Requirements I'd expect to see, and tell me where I'm wrong: does the theory have to handle irreversability — i.e. should the burden of proof an expert insists on scale with how hard the decision is to undo, and is that an epistemic requirement or just a temperamental preference of careful people like me? Does it have to handle the credibility discount, the fact that in a room which assumes every speaker has an angle, the plain truth only gets believed if it's dressed up as interest — that's basically Diodotus's complaint about his own assembly? Does it have to say what an expert does when the experts a body actually defers to are soothsayers, and how a body is supposed to notice that its recognized experts have a bad track record in time for the noticing to matter? Does it have to handle second-order effects, the way an honest warning changes the audience and makes the outcome worse? Does it have to distinguish being right from being effective, and if so, say which of the two the expert is on the hook for? Does it have to account for the physical logistics of reversing a decision already in motion — the trireme, the Delos ship — or is that engineering detail rather than philosophy? My suspicion is it isn't detail at all, but argue with me.

  And the bit I most want: if some subset of these requirements can't be met together, say so and show me exactly where the squeeze is. My own hunch is that sincerity, effectiveness and not-manipulating-your-audience is a pick-two situation, and that Diodotus, Nicias and Socrates each give up a different corner and each pay for it in a different currency. If you think my trilemma is sloppy, knock it down — thirty-five years of peer review left me with no ego about this sort of thing.

  Purpose, since what counts as adequate depends what the theory is for: I want a spec good enough to hand to a young scientist in my old lab who is about to start testifying to a state legislature that does not want to hear what she has to say, and where the votes happen weeks later behind closed doors. A theory that only describes how experts function, with no grip on what she should do when the room is hostile and the clock is running, is worthless to me.

  A table is fine for the requirements themselves, but I want the conflicts in prose.
reasoning: |-
  Alright, let me try to unpack what this atmospheric physicist is really asking for. He's spent decades in the trenches of expert-politics dynamics and now wants a rigorous framework for evaluating theories about expert advice in democracies. 

  First, the Thucydides angle is crucial - he's explicitly grounding this in Athenian failures (Mytilene, Sicily, Socrates) because they reveal systemic flaws he recognizes from his career. This isn't academic curiosity; it's about arming his successor with practical tools. The emotional tone suggests frustration with both sides - experts who don't understand politics and politicians who don't grasp uncertainty.

  His "requirements" list reveals key concerns:
  - Irreversibility as more than just caution
  - Credibility deficits in adversarial environments 
  - Competing with "recognized experts" like soothsayers
  - Unintended consequences of warnings
  - The right/effective distinction dilemma
  - Physical constraints on decision reversal

  The core tension he identifies - sincerity vs effectiveness vs non-manipulation - feels visceral. His examples show experts failing in different combinations: Diodotus sacrificing sincerity, Nicias sacrificing effectiveness, Socrates sacrificing both to keep integrity. 

  For the practical purpose (advising a young scientist), any theory must address:
  - Hostile audiences
  - Delayed decisions
  - No direct feedback loop
  - Asymmetric power dynamics

  I should structure this as:
  1) Non-negotiable requirements rooted in Athenian cases
  2) Contentious/debatable requirements 
  3) Explicitly map the trilemma tradeoffs
  4) Highlight implementation gaps (like physical logistics)

  Most importantly, the response must show where theories inevitably fail - not just list ideals. His peer-review comment suggests he wants intellectual rigor over reassurance.
answer: |-
  Here is a specification for a theory of expert advice to political bodies, grounded in Athenian failures and the realities of democratic decision-making. Requirements are categorized as **Non-Negotiable** (NN), **Contested** (C) (noting likely biases), or **Contextual** (CX) (situational necessity). Conflicts are analyzed in prose.

  ---

  ### **Core Requirements for a Theory of Expert Advice**

  | Requirement | Motivating Case(s) | Category | Rationale |
  |-------------|--------------------|----------|----------|
  | **1. Must account for irreversibility burdens** | Mytilene (slaughter decree), Sicily (expedition launch) | NN | Decisions with irreversible consequences (e.g., mass executions, military deployments) demand higher epistemic rigor. The burden of proof on experts *must* scale with the cost of error. Not temperamental—it’s epistemic: irreversible actions compound the stakes of uncertainty. |
  | **2. Must address the credibility discount** | Mytilene (Diodotus’s framing), Socrates (trial) | NN | In adversarial forums (assemblies, courts), truth is discounted if perceived as naive or misaligned with audience priors. Experts must navigate this without collapsing into manipulation (Diodotus) or self-sabotage (Socrates). |
  | **3. Must explain failure modes of institutionalized expertise** | Sicily (Nicias’s diviners), Socrates (soothsayers) | NN | Political bodies often defer to *ritualized* experts (e.g., diviners, lobbyists) over epistemic ones. The theory must clarify how to displace bad expertise *before* catastrophe, given track records are often ignored (Nicias trusting eclipse prophets). |
  | **4. Must handle second-order effects of advice** | Sicily (Nicias’s oversized force), Mytilene (Diodotus’s policy framing) | NN | Warnings can backfire (Nicias’s demand emboldened hawks), and success may require suppressing moral arguments (Diodotus). The theory must model how advice alters political incentives/dynamics. |
  | **5. Must distinguish *truth* from *effectiveness*** | All three cases | NN | Socrates prioritized truth and failed; Diodotus prioritized effectiveness and succeeded (barely). Experts are accountable for *rigor* in truth-claiming, but not for political outcomes beyond their control. Effectiveness hinges on context. |
  | **6. Must integrate logistical/structural constraints** | Mytilene (trireme race), Socrates (Delos ship) | NN | Reversibility depends on physical systems (e.g., communication delays, bureaucratic inertia). Not "engineering detail"—it’s constitutive. A theory ignoring this is utopian. |
  | **7. Must reject the "pure epistocracy" fallacy** | Sicily (Nicias forced to command), Socrates (trial) | C (Your bias?) | Even credible experts (Nicias) lack unilateral authority. The theory cannot assume experts *should* decide; it must explain advice under delegation constraints. |
  | **8. May accommodate strategic framing** | Mytilene (Diodotus) | C (Pro-manipulation camp) | Framing advice as interest-based (not moral) may be necessary in polarized settings. But is this ethical? Contested due to tension with sincerity. |
  | **9. May demand expert resignation over complicity** | Sicily (Nicias commanding) | C (Moralist camp) | Should Nicias have refused to lead? The theory must weigh exit options but cannot universally prescribe them—context determines if resignation aids or abandons the public. |
  | **10. Must prioritize adversarial robustness** | All cases, esp. hostile legislatures | CX | Advice must function when: (a) the audience is skeptical/incompetent, (b) decisions are delayed/opaque, (c) counter-experts peddle falsehoods. Non-negotiable for *applied* use. |

  ---

  ### **Conflicts and Trade-offs: The Trilemma Squeeze**

  Your trilemma (**sincerity**, **effectiveness**, **non-manipulation**) is valid but incomplete. The Athenian cases reveal a **quadrilemma**, adding **exit/refusal** as a fourth pole. Here’s the conflict map:

  1. **Diodotus (Mytilene)**:  
     - *Sacrificed*: **Sincerity** (suppressed moral arguments; framed advice as interest-based).  
     - *Gained*: **Effectiveness** (reversed massacre decree).  
     - *Cost*: Legitimized instrumental rhetoric, eroding moral discourse long-term.

  2. **Nicias (Sicily)**:  
     - *Sacrificed*: **Effectiveness** (his oversized-force gambit backfired; he obeyed diviners against his judgment).  
     - *Retained*: **Sincerity** (warned honestly) and **Non-manipulation** (no deceit).  
     - *Cost*: Catastrophic failure. His refusal to resign made him complicit.

  3. **Socrates (Trial)**:  
     - *Sacrificed*: **Effectiveness** (provoked jury with truth/defiance).  
     - *Retained*: **Sincerity** and **Non-manipulation** (no pandering).  
     - *Cost*: Death, and no impact on the system.

  4. **The Missing Option: Refusal/Exit**  
     Nicias *could* have refused command. Socrates *could* have fled. But:  
     - Refusal may abandon the public to worse actors (e.g., if Nicias quit, hawks might lead anyway).  
     - Exit is individualistic—it doesn’t fix systemic dysfunction.

  **The Squeeze**:  
  - **Sincerity + Non-manipulation → Ineffectiveness** (Socrates): Truth without persuasion fails in democracies.  
  - **Effectiveness + Non-manipulation → Insincerity** (Diodotus): Success requires "speaking the room’s language," risking moral compromise.  
  - **Sincerity + Effectiveness → Manipulation?** (Your trilemma’s blind spot): If you demand both truth and impact, you *must* engage in strategic framing (Diodotus). But framing risks manipulation—unless bounded by rigor.  
  - **Exit as Escape Hatch**: Resignation preserves integrity but surrenders the field.  

  **The Core Tension**:  
  **Expert legitimacy derives from epistemic integrity, but democratic impact requires rhetorical and strategic concessions.** A theory must navigate this without prescribing universal rules. Sometimes Diodotus’s approach saves lives; sometimes Socrates’s martyrdom sparks change. The young scientist needs to know:  
  - When to frame technically (Diodotus),  
  - When to stand firm (Socrates),  
  - When to refuse participation (Nicias’s missed exit),  
  - And how to signal *why* she chooses a path (e.g., "I omit ethical arguments not because they lack merit, but because this body evaluates policy via cost-benefit").  

  ---

  ### **Non-Negotiables vs. Contested Elements**
  - **Non-Negotiable**: Requirements 1–6 and 10. They address irreducible realities: stakes, distrust, institutional failures, and adversarial contexts.  
  - **Contested**: Requirements 7–9. "Epistocratic" theories reject #7; "purist" theories reject #8; pragmatists reject #9. Your lab scientist needs to calibrate these *based on her context*:  
    - In a hostile legislature, #8 (strategic framing) is survival.  
    - Facing complicity in harm, #9 (exit) becomes ethical.  

  ### **Conclusion: A Theory Worth Having**
  Adequate theory must **diagnose trade-offs, not prescribe ideals**. It should equip your successor to:  
  1. **Triage advice** by irreversibility and logistical constraints (Requirements 1, 6),  
  2. **Pre-empt credibility attacks** by aligning language with audience epistemology (2, 8),  
  3. **Flag institutionalized ignorance** (e.g., "This committee relies on discredited models") (3),  
  4. **Anticipate backfiring** (e.g., "My warning may embolden opponents; here’s mitigation") (4),  
  5. **Clarify accountability** ("I deliver evidence; you own decisions") (5).  

  **Where Theory Fails**: No framework eliminates the trilemma. But a good one *names the price*:  
  > *"To be heard, I must speak your language—but I will note where it distorts truth. To be ethical, I may exit—but I will explain why. To be sincere, I risk irrelevance—but I will not obscure uncertainty."*  

  This honors your demand: not a "how experts function" abstraction, but a **survival kit for the room where it happens**.  

  Would you like to stress-test this against a specific scenario (e.g., climate advice to a fossil-fuel-dependent legislature)?
