  Okay, the user is a DPhil candidate in their third year working on personal identity and medical decision-making. They're also a lay member on a hospital ethics committee, so they have practical experience. They've shared a draft of about 1100 words for a paper they're presenting in nine days at a work-in-progress seminar. Their audience includes clinical ethics practitioners and metaphysicians, so they need to cater to both. They want specific, critical feedback rather than encouragement and have listed seven precise requests.

  First, I need to understand their core argument. They're challenging the standard framing of advance directives, which focuses on whose interests matter—earlier or later self. Instead, they propose that authority stems from epistemic position: who can best evaluate the "whole life" prospectively. At t1, the person can do this; at t2 in dementia, they can't, so the directive binds. But if the later self retains evaluative capacity (like in the faith case), the directive shouldn't override their current wishes. This flips the intuitive gradient where directives feel strongest when the patient seems "gone."

  The user raises several nuanced points. The nephrologist case (dementia patient) shows their view aligning with Dworkin but diverging in justification. The faith case (capacity retained) is a sharp divergence from precedent autonomy views. They also grapple with reversibility asymmetry—overturning a directive is reversible if the patient can later consent, but honoring it isn't if they die. Their account says reversibility only matters if the patient can use it, so it shouldn't override directives when diachronic capacity is lost.  

  Now, tackling their requests one by one:  
  1. **Substantive thesis vs. redescription?** This is substantive. Competence standards focus on *current* capacity to decide. Their view makes authority hinge on *diachronic* evaluation capacity—which isn't tracked by standard competence assessments. A case where competence is intact but diachronic evaluation is impaired (e.g., early dementia with preserved moment-to-moment reasoning) would highlight the difference.  
  2. **Nephrologist case vs. Dworkin:** Both say "honor the directive," but Dworkin does so based on critical interests trumping experiential ones, while the user does so based on epistemic vacancy. To make it discriminate, add ambiguity: if the husband claims she *now* rejects the directive (e.g., via gestures), Dworkin might still override for experiential interests, while the user would require proof she can perform diachronic evaluation.  
  3. **Faith case counterexample:** It's a valid challenge. To accommodate it without abandoning their ordering, they could argue the clause is void *ab initio* because one cannot irrevocably surrender future evaluative authority. This needs explicit argument—e.g., autonomy includes the right to reconsider, so binding future selves is incoherent.  
  4. **Question-begging framing?** Yes, defining the directive's question as "whole-life" assumes the earlier self's superiority. Smuggling occurs in §3: "That is what a directive-type decision requires." Repair by allowing directives to address narrower questions (e.g., "I hate needles, refuse blood draws even if unconscious") and making interpretation step one.  
  5. **Reversibility section:** Keep it—it addresses a strong objection. The "worthless" claim is defensible but needs nuance: even if the patient can't use reversibility, others (family, society) might value avoiding irreversible harm.  
  6. **Metaphysics evasion?** It's an advantage. On reductionism, authority is functional (who can judge) not metaphysical (identity). But they should clarify what grounds the earlier self's authority—e.g., it's the last competent evaluation.  
  7. **Structural edits:** Cut reversibility details to §5 bullet points; expand the "uncomfortable consequence" (§3) to show why the gradient flip is plausible; flag concessions (e.g., quality of t1 deliberation) as open questions. It's a paper, not a note—the core argument needs room.  

  Key overreach: Conceding that the faith case directive should be "far less" binding understates their view—it should be void if she retains capacity. Key underreach: Not pressing hard enough on the "whole-life" framing; it’s the biggest vulnerability.  

  For the seminar, they should:  
  - Start with the nephrologist case to hook clinicians.  
  - Pre-empt the "question-begging" critique by acknowledging alternative directive types early.  
  - End with the faith case to provoke metaphysicians.  
  - Allot 15 mins for presentation, 10 for Q&A prep.
answer: |-
  Below is a targeted response to your requests, focusing on critical engagement with your draft. I’ve structured it around your seven questions, ordered by importance, with concrete suggestions for revision. The tone is direct, as requested—no padding, no praise, no references.

  ### 1. **Substantive thesis or redescription?**  
  Your account is **substantive**, not a redescription of competence standards. Standard competence frameworks (e.g., Buchanan and Brock’s) focus on *current* decision-making capacity: Can the patient *now* understand, reason, and communicate? Your view ties authority to a *diachronic evaluative capacity*—a specialized cognitive ability to prospectively/concurrently assess a whole life—which is distinct.  
  - **Where they diverge**: A patient could be competent (e.g., understands treatment options *now*) but lack diachronic capacity (e.g., early dementia with intact moment-to-moment reasoning but inability to project/reflect on the life arc). Your account would deny their authority to revoke a directive, while competence-based standards might allow it.  
  - **Case to force a split**: A patient with early frontotemporal dementia writes a directive refusing antipsychotics. At t2, they retain competence (can discuss risks/benefits) but exhibit anosognosia (cannot integrate past/present/future selves). Competence standards might let them revoke; your account would not. **Revise §3** to explicitly contrast "diachronic evaluation" with "clinical competence."  

  ### 2. **Does the nephrologist case discriminate from Dworkin?**  
  As presented, **no**—it doesn’t test the difference. Both views say "honor the directive," so the case is inert for your purpose. Dworkin would agree due to critical interests; you agree due to epistemic vacancy.  
  - **Fix**: Modify the case so Dworkin might *override* the directive. Add: The husband provides evidence that she *currently expresses contentment with life* (e.g., she gestures approval during treatment discussions). Dworkin may prioritize her present experiential interests (avoiding suffering from untreated infection) over her past critical interests. Your account, however, would still prioritize t1 authority because she lacks diachronic capacity. Now the verdicts split: Dworkin overrides, you uphold.  
  - **Alternative**: Cut this case and use the faith case (§5) as your primary example. It better highlights divergence.  

  ### 3. **Is the faith case a genuine counterexample?**  
  **Yes**, and it’s your strongest asset. Precedent-autonomy views (e.g., Jaworska) *must* enforce the directive; you reject enforcement. To keep your ordering (§4’s "gradient flip") while voiding the clause:  
  - **Route to void it**: Argue that autonomy requires the *possibility of reconsideration*. A directive cannot irrevocably bind a future self who retains diachronic capacity, as this violates the core of agency. Add: "The earlier self cannot nullify the standing of a future self who occupies the same epistemic position—this reduces autonomy to a paradox." State this explicitly in §5; don’t imply it.  
  - **Cost to your ordering**: None. Your gradient (directive strength ∝ loss of diachronic capacity) holds. The faith case fails because capacity is *retained*—it doesn’t challenge your core principle.  

  ### 4. **Is the 'whole-life question' framing question-begging?**  
  **Yes.** You stipulate that directives answer a "whole-life question" (§3), which guarantees t1’s superiority. This smuggles in your conclusion by defining the problem in t1-favoring terms.  
  - **Where smuggled**: In §3: "That is what a directive-type decision requires." This assumes all directives address "whole-life" evaluations. But many directives answer narrower questions (e.g., "I refuse blood products because I fear infections," not "because of my life narrative").  
  - **Repair**: Decouple the directive’s *content* from your epistemic criterion. Make interpretation step one:  
    1. Interpret the directive: Does it address a "whole-life" question (e.g., dignity in decline) or an "inside-the-life" question (e.g., pain avoidance)?  
    2. Only "whole-life" directives trigger your authority transfer.  
    **Revise §2/§3** to frame this as a *typology* of directives. Example: A directive refusing CPR in terminal illness based on current suffering ("inside-the-life") vs. one refusing dementia care based on biographical integrity ("whole-life").  

  ### 5. **Does the reversibility section earn its place?**  
  **Keep it, but tighten.** The reversibility asymmetry is a major objection (ignoring it would be a flaw), and your response is original.  
  - **"Worthless to a subject who cannot use it" is defensible but underdeveloped**. It’s not "too quick," but it needs:  
    - A link to your epistemic criterion: Reversibility matters iff the subject retains diachronic capacity (otherwise, no "subject" exists to benefit).  
    - A rebuttal to "soft paternalism" concerns: Even if irreversibility harms interests, the t1 self is the only one who can define those interests.  
    **Cut 25% of §6** (e.g., the Error A/B setup) to focus on this retort.  

  ### 6. **Is "no metaphysics needed" an advantage or evasion?**  
  **Mostly an advantage** on reductionism, but you evade *what grounds authority*. If identity doesn’t matter, why does the t1 self’s directive bind at all?  
  - **What’s missing**: A positive account of authority. Argue: The t1 self’s judgment is binding because it is the *last exercise of diachronic evaluation* in this life—not because it is "hers," but because it is the only extant evaluation of this kind.  
  - **Revise the closing**: Replace "needs no metaphysics" with "avoids the stalemate of metaphysical debates." This is a real strength against Parfitian skepticism.  

  ### 7. **Structural comments for the seminar**  
  - **Cuts**:  
    - Trim §1’s literature review (Dworkin/Dresser) to 2 sentences.  
    - Reduce the nephrologist case (§4) by 30% (focus on the husband’s "grief" objection, omit clinical details).  
    - Condense reversibility (§6) to bullet points: "Objection: Asymmetry favors overriding. Reply: Only if capacity exists."  
  - **Expand**:  
    - §3’s "uncomfortable consequence": Spend 60 seconds explaining *why* the gradient flip is plausible (e.g., "We defer to past selves in wills/contracts when no competent self exists").  
    - §5’s faith case: Clarify why precedent-autonomy views *must* enforce it.  
  - **Concessions**: You concede too much in three places:  
    - §4: "I concede this forces an addition" (re: t1 deliberation quality). **Don’t concede**—argue this is about evidence (is the directive authentic?), not authority.  
    - §5: "My directive should count for far less." **Overreach here**—it should count for *nothing* if she retains capacity.  
    - §6: "I resist this only in part." **Be bolder**: The asymmetry is irrelevant when diachronic capacity is lost.  
  - **Paper or note?** This is a **paper**—it proposes a novel, testable account of authority. Don’t bill it as a note.  
  - **Time allocation**: For 25 minutes:  
    - 5 min: Problem + critique of interest-based views (§1-2).  
    - 7 min: Epistemic account + gradient flip (§3-4).  
    - 6 min: Faith case and divergence (§5).  
    - 4 min: Reversibility + Q&A setup (§6-7).  
    - 3 min buffer.  

  **Biggest vulnerability**: The "whole-life" framing (§4). Anticipate this in Q&A by admitting some directives don’t fit your model—but argue most serious debates (e.g., dementia care) do. **Strongest point**: The faith case (§5)—it forces opponents to defend enforced suffering for metaphysical reasons. Lean into it.
