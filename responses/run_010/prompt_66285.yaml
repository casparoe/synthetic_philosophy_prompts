prompt: |-
  I'm the only foresight analyst in a mid-sized city's capital planning office. I do the 30-year appraisals — sea defences, a new water intake, where the hospital extension goes — and I keep getting asked for probabilities I don't think exist. The finance committee wants one expected value per proposal and treats any number that ends up in the box as a fact about the world. We also have a house habit of rating "confidence" one to five, which everyone games, and I want to kill it.

  I've been reading Keynes on probability — weight of argument as separate from the balance of it, the thought that some probabilities can't be compared at all, the later stuff about uncertainty you can't average away and about leaning on convention instead. Turn that into a procedure I can actually run: the questions I ask in order when a proposal lands, what counts as a sufficient answer to each, when I'm permitted to put a number in, a range, or nothing, what goes in the box instead when there's no number, and where the procedure stops and hands the thing to the committee becuase it's a question of values rather than facts. Constraints: I get a week per proposal, nobody who signs off has taken a stats course, and a consulting engineer countersigns my assumptions.

  Then run it on three cases: a sea wall whose payoff depends on a 2070 storm-surge projection; a hospital extension whose main input is a population forecast everyone knows is wrong and nobody can improve; and early repayment of the city's variable-rate debt. Tell me which steps are judgment dressed up as procedure, and what the procedure can't do — above all whether refusing a number just lets the status quo win by default, which is what I suspect. One of the three answers should be the one I won't like.

  Plain prose please, like an email: no headings, bullets, bold or tables, just number the steps inside the sentences if you have to.
reasoning: |-
  Okay, the user is a foresight analyst in a city planning office dealing with long-term infrastructure projects. They're frustrated because they're pressured to provide precise probabilities and expected values for complex 30-year appraisals where such numbers might not actually exist. The finance committee treats any number given as a fact, and their confidence rating system is being gamed. 

  They've been reading Keynes on probability - particularly concepts like "weight of argument" (how much evidence supports a probability) and the idea that some uncertainties can't be quantified or compared. They want a practical procedure based on these concepts that they can implement within their constraints: one week per proposal, no stats background among decision-makers, and needing a consulting engineer to sign off on assumptions.

  The key pain points seem to be:
  - Unrealistic demand for single-number probabilities in highly uncertain long-term planning
  - Institutional pretense that unquantifiable uncertainties are quantifiable
  - Fear that refusing to provide numbers will default to status quo bias

  They want this tested on three cases: a sea wall (climate uncertainty), hospital extension (flawed demographic data), and debt repayment (financial uncertainty). Importantly, they want to know where the procedure has limitations and whether refusing numbers actually favors inaction.

  Hmm... this is fundamentally about decision-making under radical uncertainty. The user is intellectually honest but institutionally constrained. Their fear about status quo bias is valid - in bureaucracies, "we need more data" often kills projects. The procedure needs to force explicit discussion of uncertainty without providing false precision.

  For the Keynesian framework, we should operationalize: 
  1) Distinguishing between quantifiable risk vs unquantifiable uncertainty
  2) Assessing the "weight" of evidence (quality/quantity of data)
  3) Identifying non-comparable uncertainties (e.g. sea level rise vs demographic shifts)
  4) Flagging when decisions become value judgments rather than technical ones

  The procedure should probably have escalating "gates":
  - Gate 1: Can we define the key uncertainty? (If no → stop)
  - Gate 2: Is it numerically quantifiable with current evidence? (If no → qualitative assessment only)
  - Gate 3: Even if quantifiable, is the evidence too thin for a single point estimate? (→ use ranges/scenarios)
  - Gate 4: Explicitly separate technical assessments from value trade-offs

  For the examples:
  - Sea wall: Climate models give ranges but high disagreement → use scenario ranges, not one number. Key value judgment: How much to spend on low-probability/high-impact events.
  - Hospital: "Everyone knows" population projections are wrong → admit ignorance, shift to sensitivity analysis. Value judgment: Whose needs get prioritized when data is bad.
  - Debt repayment: This is the one they won't like because interest rates ARE quantifiable → here a point estimate is reasonable, but must stress tail risks.

  The brutal truth: The procedure can't force committees to embrace uncertainty. But it can:
  - Prevent false precision by requiring engineer sign-off on assumptions
  - Force value discussions by labeling non-technical decisions
  - Make status quo bias visible by showing "no decision" as an explicit choice

  Biggest vulnerability remains institutional inertia. The analyst might need political cover - perhaps frame as "reducing future liability from bad forecasts." And yes, sometimes refusing a number DOES default to status quo, but that's better than pretending false certainty that could lead to worse outcomes.
answer: |-
  Here’s a plain-procedure approach, grounded in Keynes’ ideas about uncertainty, tailored for your constraints. The core is separating what *can* be quantified from what *can’t*, forcing value judgments into the open, and killing false precision. Run these steps sequentially for each proposal.  

  **The Procedure:**  
  1. **Define the Critical Uncertainty:** Ask: "What single assumption drives most of the variance in this proposal’s payoff?" If there isn’t one, skip to step 4. If there is, document it (e.g., "2070 storm surge height" for the sea wall). The consulting engineer must countersign this as the pivotal technical assumption.  

  2. **Assess ‘Weight of Argument’:** Ask: "Is there enough *reliable, comparable* data to assign a numerical probability?" Sufficient data means: (a) historical records or models cover >2 full cycles of the phenomenon (e.g., 100+ years for 50-year storms), (b) experts agree on the distribution shape. If yes, assign a range (e.g., "60–80% chance of 1m surge by 2070"). If no—stop. Do not assign a number.  

  3. **Check for Non-Comparability:** Ask: "Are the uncertainties here meaningfully comparable to other projects?" (Keynes’ point). If the uncertainty is structural (e.g., novel climate impacts, untested debt markets) or lacks a common baseline (e.g., pandemic effects on hospital demand vs. flood risks), declare it "non-comparable." No number.  

  4. **Default Output Rules:**  
     - If steps 1–3 yield a range (step 2): Put the range in the "expected value" box.  
     - If steps 1–3 block quantification: Put "UNQUANTIFIABLE" in the box.  
     - *Kill the confidence rating.* Replace it with: "Evidence Quality: [High/Medium/Low]", defined as:  
       - **High:** Data covers >2 cycles, low expert dissent.  
       - **Low:** Data absent or contested, expert dissent high.  
       (No numbers, no games.)  

  5. **Handoff to Values:** If the output is "UNQUANTIFIABLE" or a wide range, append: "Decision depends on: [list value trade-offs]". Examples: "City’s risk tolerance for high-impact/low-probability events" or "Priority of intergenerational equity vs. current budgets." This is where you stop. Your role ends; it’s the committee’s job to weigh values.  

  **Applied to Your Cases:**  
  - **Sea Wall (2070 storm surge):**  
    Step 1: Critical uncertainty = storm surge model (engineer signs off).  
    Step 2: "Weight" low—models disagree on ice melt, no historical analogues. **No probability range.**  
    Step 3: Non-comparable (novel climate dynamics).  
    Step 4: Box = "UNQUANTIFIABLE". Evidence Quality = Low.  
    Step 5: Handoff note: "Decision depends on willingness to pay for worst-case insurance despite unknown odds."  
    *Judgment step:* Step 2 (interpreting model reliability).  

  - **Hospital Extension (flawed population forecast):**  
    Step 1: Critical uncertainty = population growth (engineer signs).  
    Step 2: "Weight" low—forecast known errors, no consensus. **No probability.**  
    Step 3: Non-comparable (migration shocks, policy shifts).  
    Step 4: Box = "UNQUANTIFIABLE". Evidence Quality = Low.  
    Step 5: Handoff: "Decision depends on priority: serving worst-case demand vs. avoiding overbuild."  
    *Judgment step:* Step 1 (choosing population as the key driver over, say, healthcare tech changes).  

  - **Early Debt Repayment (variable-rate):**  
    Step 1: Critical uncertainty = future interest rates.  
    Step 2: "Weight" high—rates have decades of volatile but quantifiable data. **Assign range:** "Expected savings: $4M–$9M if rates rise 2–4% in 5 years."  
    Step 3: Comparable (financial markets have clear precedents).  
    Step 4: Box = "$4M–$9M". Evidence Quality = Medium (volatility exists, but data robust).  
    Step 5: No handoff needed—it’s quantifiable.  
    *This is the answer you won’t like: Here, a number is defensible.* Markets *do* offer probabilistic data, even if imperfect.  

  **What the Procedure Can’t Do (and the Status Quo Problem):**  
  - It *can’t* force committees to engage with value trade-offs. They might ignore your "UNQUANTIFIABLE" and default to inertia. But the procedure makes this evasion visible: You’ve shifted the burden. If they choose status quo despite your flag, it’s a conscious value choice (e.g., "We prefer known costs over speculative benefits").  
  - It *can’t* eliminate judgment. Steps 1–3 require you to interpret data quality and expert consensus. But the engineer’s sign-off and clear thresholds (e.g., ">2 cycles of data") reduce gaming.  
  - It *can’t* create data where none exists. But it stops you from laundering guesses as facts.  

  **Why This Works for You:**  
  - It replaces "confidence 1–5" with an evidence grade that’s harder to game.  
  - It forces committees to own the value decisions they’re paid to make.  
  - For the sea wall/hospital, it legitimizes saying "I don’t know"—which is the honest answer.  
  - The debt case shows it’s not a blanket refusal: When numbers exist, you use them.  

  Yes, refusing a number *can* let the status quo win—but only if the committee abdicates its role. Your job isn’t to justify action at all costs; it’s to tell them when the dice are loaded.
