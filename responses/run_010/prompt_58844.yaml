  Here is the poem, followed by the requested contextual note:

  **The Geometer's Last Stand**  
  *Thomas Hobbes loquitur*

  **GIVEN:**  
  That knowledge, true and certain, finds its ground  
  In motions we command, in lines we trace,  
  Not accidents of matter, chance-embraced.  
  The circle's law I grasp, for I decree  
  The fixed point, the arm's rotation: see,  
  **This figure stands unmeasured by my hand.**

  **CONSTRUCTION:**  
  Define the square? Show how its sides ascend  
  From chosen points! Not idle marks amassed,  
  But generation proves the concept cast.  
  The circle yields? By parts I comprehend,  
  Finite divisions only I'll attend –  
  **This figure stands unmastered by my hand.**

  **DEMONSTRATION:**  
  They call them indivisibles! A cheat,  
  Wallis's ghosts, thin air where substance ought,  
  Scholastic mirage that his calculus wrought.  
  To grant them entry seals philosophy's defeat.  
  My proof builds step by step, discrete, complete –  
  **This figure stands unmeasured by my hand.**

  **COROLLARY:**  
  As points and lines by reason are designed,  
  So covenants erect the Body Politic:  
  An artifice conceived, no natural trick.  
  Its causes, ours; its laws, within the mind.  
  One science governs matter so refined –  
  **This figure stands unconquered by my hand.**

  **Q.E.F.**  
  So let their Royal cabal crow and jeer,  
  Their infinite voids and angles multiply.  
  My method holds: know *how* or know not why!  
  This final diagram dispels the fear:  
  The sovereign Reason crowns the structure here –  
  **This figure stands unmeasured by my hand.**

  ---

  **Contextual Note for the Seminar:**

  **Settled Matters:** Historians agree Hobbes's quadrature attempts (starting 1655) were mathematically invalid, swiftly refuted by Wallis. Hobbes retracted specific constructions but produced flawed alternatives. The quarrel spanned decades, fueled by personal animus, theological disputes (Hobbes's materialism vs. Wallis's clericalism), and institutional rivalry with the nascent Royal Society, which excluded Hobbes despite allies like Sorbière. The impossibility of circle-squaring was proven later (Lindemann, 1882), unknown to them.

  **Contested Ground:**
  1.  **Foundational Hostility:** Was Hobbes's rejection of indivisibles/infinities a philosophically motivated defense of nominalism and constructivism against perceived "occult" qualities, or primarily a cover for his mathematical limitations? The poem assumes the former (sympathetic view).
  2.  **Scope of "Scientia":** Is "we know only what we make" a universal epistemology for Hobbes, or specifically tied to geometry/politics as domains of *artificial* objects? The poem presents it broadly as the core of *scientia*.
  3.  **Politics-Mathematics Link:** How integral is the methodological parallel? While Hobbes *claimed* consistency, scholars debate if the political theory genuinely *depends* on his mathematical constructivism or if the link is rhetorical. The poem tightens this link for thematic unity.

  **Poetic Licences & Sympathetic Leanings:**
  *   **Chronology:** The poem compresses the decades-long dispute into a single defiant moment by the "old man." The "final diagram" alludes to his persistent, failed attempts, not one specific event.
  *   **Mathematics:** The poem avoids depicting Hobbes's specific erroneous constructions, focusing instead on his *principles* (constructive definition, finitism). The "parts I comprehend / Finite divisions" nods to his rejection of indivisibles and infinitesimals without detailing flawed rectification methods.
  *   **"Q.E.F." Irony:** Using *Quod Erat Faciendum* ironically underscores the poem's core tragic point: Hobbes *claims* successful construction ("Thus it has been made") based on his principles, while the repeated, unyielding final line reveals the internal failure *by those principles* (the figure remains "unmeasured," hence not truly constructed/knowable).
  *   **Sympathetic Emphasis:** The poem strongly endorses the interpretation that Hobbes's errors stemmed from a coherent, deeply held rival philosophy of mathematics (constructivism, finitism, nominalism) and epistemology, making the failure tragic, not merely incompetent. This view, while respected, is not universally held; critics emphasize his mathematical inadequacies. The depiction of Wallis's methods as "ghosts" and "Scholastic mirage" mirrors Hobbes's own polemical rhetoric accurately. The unwavering defiance reflects Hobbes's documented character.
