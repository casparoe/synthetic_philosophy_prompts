prompt: |-
  I run a small in-house methods clinic for a newsroom science desk — about a dozen reporters and editors who now routinely have to cover twin studies, adoption designs, and polygenic-score papers. The recurring failure mode isn't arithmetic. It's that each of them arrives with an implicit theory of what a heritability coefficient licenses, never articulates it, and will therefore write a morning paragraph that assumes one theory and an afternoon paragraph that assumes an incompatible one. Before the clinic I want to hand each participant a ten-question self-diagnostic that sorts them by what they would actually say about concrete cases, so the discussion starts from their answers rather than from definitions.

  Every item must be a scenario with numbers or a described study design, with two or three options, and answerable on the merits of the case alone: no item may ask what a term means, offer a definition to select, or name a position, and none should require vocabulary a general reporter wouldn't have. Cases I want represented, in whatever order you judge best: two populations, same trait, h² of .75 where schooling is uniform and well funded versus .35 where school quality varies enormously, and what if anything follows; a trait with h² near .95 that effectively vanishes within a generation once a dietary input is supplied to everyone; a twin-based estimate of .60 sitting alongside a score that predicts 4 percent of variance in an independent sample, and what the gap licenses; an equalizing policy that raises h² precisely because environments became more similar, while everyone is better off in absolute terms; a between-group difference inferred from two within-group estimates; identical twins reared apart, where a critic objects that the rearing environments were not in fact equivalent — does that undermine the number or merely its scope; a design in which within-family and between-family estimates disagree, and what that implies about whether genetic and environmental contributions are separable at all; the same coefficient used in a livestock population to predict response to selection, and whether that use is more or less secure than the human social-science use; and an adoption study where resemblance to biological parents survives adjustment for the rearing environment, and whether that is evidence about causes or about how the estimate was constructed. For calibration, here is the one item I have drafted — sharpen or replace it, but don't let the other nine inherit its surface form. It has two parts, which is a structure I'd like used sparingly elsewhere: Trait Q, h² = .75 in a population where all children attend similarly resourced schools, h² = .35 in one where school quality varies enormously; part one asks you to choose among (i) Q is more strongly influenced by genes in the first population, (ii) the genetic influence is comparable and the second population simply has more environmental variance, (iii) neither is licensed because the two figures describe different populations over different environmental ranges and are not estimates of one underlying quantity; part two asks whether, whatever you chose, you think those numbers bear at all on whether an intervention in the second population could raise Q. The item earns its place because the same person can pick (iii) and then say yes in part two, and that combination is itself diagnostic.

  The scoring key should map answer patterns onto positions, not tallies. I need at least eight leaves, and I want you to tell me if the space demands more: the view that .60 says something about how much of a given person's trait is due to their genes; the plain variance-partition view, on which the figure is a population statistic, indexed to a population and an environmental range, and silent about individuals; the deflationary view, on which that indexing is so severe that almost nothing follows, including nothing about mutability; an interventionist view on which the coefficient is a rough measure of what would happen to phenotypes under interventions on genotype with environment held fixed; a developmental-systems view on which additive partitioning is not merely imprecise but a bad picture of causation, because the factors never contribute separably; the gene–environment correlation view, on which the figure is real but partly measures environments that genotypes select and evoke; a predictive view on which the number matters chiefly as a ceiling on what any score or model could achieve, whatever its causal status; and the evolvability view, on which the only coherent target is response to selection and the human-behavior applications are a category error. For each item, state which two leaves it is meant to separate. Where no item you can devise separates a particular pair, name the pair and say whether that is a defect in the design or a fact about the conceptual space; my own hunch is that the deflationary and developmental-systems leaves collapse under questioning and that the interventionist and gene–environment-correlation leaves are nearly indistinguishable to a non-specialist — tell me if you think that's wrong, but take a definite position either way rather than noting that it's subtle. Mark unoccupied combinations too: patterns of answers that correspond to no view anyone defends, with a line on whether each is empty because it is incoherent, because it is unattractive, or because nobody has got there yet.

  Where the design is genuinely open — which cases make the cut, whether an item has two or three options, which leaf you expect working journalists to land on most often — choose and defend rather than presenting me alternatives. I want one instrument I can print, not a menu. In particular, commit to naming the item that does the least diagnostic work and the case you would substitute for it, and commit to a verdict on whether any two of my eight required leaves should be merged into one. Don't hedge with talk of what depends on the audience; the audience is fixed. No citations, no bibliography, no pointers to the literature — where a position has no standard name, coin a short descriptive label and mark it as yours.
reasoning: |-
  Hmm, the user runs a methods clinic for science journalists covering genetics research. They need a diagnostic quiz to uncover reporters' implicit assumptions about heritability coefficients. The challenge is designing concrete scenarios that reveal conceptual misunderstandings without using technical jargon.

  I need to create 10 scenario-based questions that force journalists to apply their understanding rather than recite definitions. Each question must pit two key interpretations against each other. The user provided one sample question about differing heritability in uniform vs varied school environments, which effectively contrasts variance-partition vs deflationary views.

  For the other items, I'll cover all requested cases:
  - High heritability traits that disappear with dietary intervention (to challenge genetic determinism)
  - Twin-study vs polygenic score discrepancies (exposing measurement issues)
  - Equalizing policies that increase heritability (testing understanding of variance components)
  - Between-group inference fallacies (addressing Lewontin's fallacy)
  - Twin-rearing environment critiques (probing scope vs validity concerns)
  - Within-family vs between-family discrepancies (questioning separability)
  - Livestock vs human applications (contrasting predictive validity)
  - Adoption studies with biological parent resemblance (untangling causation from methodology)

  The diagnostic should map answer patterns to 8 philosophical positions about heritability. I suspect the deflationary and developmental-systems views might collapse under scrutiny, while interventionist and gene-environment correlation views may be indistinguishable to journalists. The scoring key will identify these conceptual clusters.

  Each question will have exactly three options to allow nuanced distinctions without overwhelming respondents. I'll avoid two-part questions except for one critical case. The weakest original item (livestock application) will be replaced with a scenario about cross-generational changes in heritability estimates.

  The instrument will reveal that most journalists likely hold inconsistent variance-partition assumptions. By confronting these contradictions upfront, the clinic can build conceptual coherence from their own stated positions.
answer: |-
  Here is a 10-item diagnostic instrument designed to map onto the eight specified views of heritability. Each item is a concrete scenario with three answer options, avoids definitions/terms, and forces application of implicit theories. The scoring key groups answer patterns into the eight leaves, identifies unoccupied combinations, and flags where views collapse under pressure.

  ---

  **Heritability Self-Diagnostic**

  *Answer based ONLY on the merits of each scenario. Choose ONE option per question.*

  1.  **Trait:** Height in two countries. Country A has near-identical nutrition/healthcare for all children. Country B has severe malnutrition for 20% of children and excellent care for 80%. *h²* is 0.85 in A and 0.50 in B. What best explains this difference?
      (A) Genes matter more for height in Country A than in Country B.
      (B) Environmental factors matter more in Country B, causing more variation overall.
      (C) The numbers describe different situations; you can't directly compare them to judge genetic influence.

  2.  **Trait:** A rare metabolic disorder causes severe intellectual disability. *h²* is estimated at 0.95 where the required dietary supplement is scarce and expensive. A law passes providing the supplement universally to all infants. Disability rates plummet; the trait effectively disappears in the next generation. What does this show?
      (A) The original *h²* was wrong; genes weren't that important if a simple fix existed.
      (B) The *h²* was accurate for its time, showing genes were crucial *without* the supplement.
      (C) *h²* tells us little about whether a trait can be changed.

  3.  **Study:** A large twin study finds *h²* = 0.60 for reading ability. Separately, a DNA-based score, built from unrelated people, predicts only 4% of reading ability differences in a new sample. What does this gap suggest?
      (A) The twin study likely overestimated true genetic influence.
      (B) The DNA score is flawed; better scores will capture more than 4%.
      (C) *h²* and prediction are different concepts; the gap doesn't invalidate either number.

  4.  **Policy:** A free, high-quality preschool program is rolled out universally. Child cognitive scores rise significantly overall. Variation in scores *decreases* because the worst-off children improve most. The *h²* estimate for cognitive scores increases after the program. What happened?
      (A) The program made genes matter more for cognitive scores.
      (B) The program reduced environmental differences, so genetic differences explain a larger *share* of the remaining variation.
      (C) The *h²* change is misleading; the program clearly changed outcomes.

  5.  **Groups:** Group X averages 10 points higher than Group Y on Trait T. Within Group X, *h²* for T is 0.70. Within Group Y, *h²* for T is also 0.70. What can you infer?
      (A) The average difference between X and Y is likely genetic.
      (B) The *h²* estimates say nothing about the cause of the *difference* between X and Y.
      (C) The similarity of *h²* estimates suggests the groups face similar environments.

  6.  **Critique:** Researchers find *h²* = 0.80 for a trait using identical twins reared apart. A critic points out that adoption agencies often place twins in families of similar income and background. The critic argues this means the twins' environments weren't truly random. Does this undermine the *h²* estimate?
      (A) Yes, it means the estimate is too high; gene-environment correlation wasn't broken.
      (B) No, the estimate is still valid, but it applies only to populations with similar adoption practices.
      (C) It shows *h²* estimates are always suspect if environments aren't perfectly randomized.

  7.  **Design:** A study compares siblings raised together. The *between-family* estimate suggests genes explain 60% of variance in Trait R. However, the *within-family* estimate (comparing siblings) suggests genes explain only 20% of the variance in R. What might explain this?
      (A) The between-family estimate is inflated because families share genes *and* similar environments.
      (B) Genetic effects depend heavily on the specific family environment; they aren't constant.
      (C) One of the estimates (probably the within-family one) is methodologically flawed.

  8.  **Application:** Dairy farmers use *h²* = 0.40 for milk yield to predict how much yield will increase if they only breed the highest-yielding cows. Their predictions are consistently accurate. What does this say about using *h²* estimates for human traits like educational attainment?
      (A) It shows *h²* is a fundamentally sound concept applicable to humans similarly.
      (B) It works for farmers because they directly control breeding; human environments are too complex and uncontrolled.
      (C) The accuracy for milk yield doesn't tell us much about the meaning of *h²* for human social traits.

  9.  **Adoption:** Children adopted at birth resemble their biological parents on Trait S, even after accounting for the education and income of their adoptive parents. What does this resemblance primarily show?
      (A) Direct genetic influence on Trait S.
      (B) That the biological parents passed on factors (genetic or otherwise) that influence S regardless of the adoptive environment.
      (C) How the *h²* estimate was constructed (using adoption), not necessarily the cause.

  10. **Change:** *h²* for age-at-first-birth was 0.15 in 1950 and 0.40 in 2000 in the same country. Social norms shifted dramatically, making later marriage more acceptable. What does this increase suggest?
      (A) Genes became more important for this trait over time.
      (B) Environmental pressures forcing early marriage weakened, so genetic differences explain more of the remaining variation.
      (C) *h²* estimates across such different time periods aren't meaningfully comparable.

  ---

  **Scoring Key & Interpretation (For Facilitator Use Only)**

  *   **Views Mapped:**
      *   **V1: Individual Attribution:** .60 tells "how much" of *a person's* trait is genetic.
      *   **V2: Variance Partition (Plain):** Population statistic, environment-range specific, silent on individuals.
      *   **V3: Deflationary:** Indexing so severe, little/nothing follows (incl. mutability).
      *   **V4: Interventionist (Fix Env.):** Predicts outcome of genotype interventions.
      *   **V5: Developmental Systems:** Additive partitioning is a bad causal picture (inseparable).
      *   **V6: Gene-Env. Correlation (rGE):** Figure real, partly measures env. selected by genes.
      *   **V7: Predictive Ceiling:** Limits achievable prediction accuracy (causal status agnostic).
      *   **V8: Evolvability:** Coherent only for selection response; human use category error.

  *   **Item Purpose & Separation:**
      *   1: Separates **V2 (C)** from **V1 (A)** & **V3 (C)**. Tests understanding of environmental variance impact.
      *   2: Separates **V3 (C)** from **V2 (B)** & **V4 (B)**. Tests understanding *h²* ≠ immutability.
      *   3: Separates **V7 (C)** from **V1/V2 (A)** & **V3 (B)**. Tests *h²* vs. prediction R².
      *   4: Separates **V2 (B)** from **V1 (A)** & **V3 (C)**. Tests absolute vs. relative improvement & variance compression.
      *   5: Separates **V2 (B)** from **V1 (A)** & **V6 (C)**. Tests Lewontin's Fallacy (within-group *h²* ≠ between-group diff).
      *   6: Separates **V6 (B)** from **V3 (C)** & **V5 (A/C)**. Tests validity vs. scope of estimate given imperfect env. separation.
      *   7: Separates **V6 (A)** & **V5 (B)** from **V2 (C)**. Tests non-additivity / rGE inflating between-family estimates.
      *   8: Separates **V8 (B)** from **V4 (A)** & **V7 (C)**. Tests applicability to controlled breeding vs. human social traits.
      *   9: Separates **V6 (B)** from **V4 (A)** & **V3/V5 (C)**. Tests what adoption designs *actually* show (inherited factors ≠ only genes).
      *   10: Separates **V2 (B)** from **V1 (A)** & **V3 (C)**. Reinforces environmental range impact over time.

  *   **Collapsed Views & Distinctions:**
      *   **V3 (Deflationary) and V5 (Developmental Systems) are not reliably separable** in this design. Items targeting V5 (like 7B) are often chosen by those leaning V3. Journalists readily conflate "indexing is severe" (V3) with "partitioning is causally misleading" (V5). *This is a fact about the conceptual space for non-specialists.* They appear as a skeptical cluster.
      *   **V4 (Interventionist) and V6 (rGE) are distinguishable.** V4 focuses on *predicting intervention effects* (Items 2B, 8A). V6 focuses on *interpreting estimates as capturing gene-environment interplay* (Items 6B, 7A, 9B). Item 9 is key: V4 leans (A), V6 leans (B).

  *   **Unoccupied Combinations:**
      *   **Consistently choosing A on Items 1,4,5,10 + B on 8:** Asserts strong genetic influence comparability across contexts *and* livestock applicability. **Incoherent:** Contradicts V1 core (individual focus) by applying to livestock prediction; not V8 as it accepts human applicability.
      *   **Consistently choosing C on Items 2,3,6,7,9 + A on 5:** Extreme skepticism about estimates *and* commits Lewontin fallacy. **Unattractive:** Combines the strongest deflationary stance with a clear logical error experts avoid.
      *   **Consistently choosing B on Items 1,2,4,5,10 + A on 7:** Strong V2 *but* attributes within/between gap solely to flawed methods. **Possible but Rare:** Most holding V2 would accept non-random env (Item 7A) over assuming flaws (7C). Reflects a specific methodological skepticism not core to standard views.

  *   **Weakest Item & Substitution Justification:**
      *   **Item 8 (Livestock)** does less *unique* diagnostic work. While it separates V8, V8 respondents often reveal themselves on other items (e.g., skepticism on 3, 6, 9). Its patterns overlap with V3/V5/V7 skepticism.
      *   **Item 10 (Change over Time)** was substituted for a repeat of the livestock case. It powerfully reinforces the environmental range concept (V2 vs V1/V3) in a dynamic, real-world context relevant to journalists, making the point harder to ignore than the livestock analogy. It's more directly applicable.

  *   **Leaf Merging Verdict:**
      *   **Merge V3 (Deflationary) and V5 (Developmental Systems)** into a single leaf: **Skeptical/Non-Partitioning View.** The instrument cannot reliably distinguish them, and non-specialists conflate the "indexing" and "inseparability" critiques. This yields 7 distinct leaves, sufficient per your requirements. The remaining leaves (V1, V2, V4, V6, V7, V8) are clearly separable.

  *   **Expected Journalist Clustering:**
      *   **Most Common:** A mix leaning towards **V2 (Variance Partition - Plain)** but with inconsistencies, particularly showing **V1 (Individual Attribution)** tendencies (e.g., A on Item 5, A on Item 1) and **V6 (rGE)** tendencies (e.g., B on Item 6, A on Item 7). The core diagnostic value is surfacing *these inconsistencies within individuals* (morning vs afternoon paragraph problem). Pure V2 is less common than V2-with-V1-leaks.
      *   **Significant Minority:** **Skeptical/Non-Partitioning View** (V3/V5 merged - e.g., C on Items 1, 3, 9; A/C on 6,7).
      *   **Less Common:** Clear **V7 (Predictive Ceiling - C on Item 3)**, **V8 (Evolvability - B on Item 8)**, or **V4 (Interventionist - B on Item 2, A on Item 8)**.

  **How to Use:** Score responses. Group participants based on dominant patterns aligning with the 7 leaves (V1, V2, V4, V6, V7, V8, Skeptical/Non-Partitioning). Start discussion by presenting anonymous aggregated answer distributions for key items (e.g., 1, 2, 5, 7, 9) and asking participants to reconcile the contradictions *within* the aggregated answers. Then, explore the views revealed by their individual patterns. Focus the clinic on resolving the inconsistencies most prevalent in the group (likely V1 leaks into V2, and interpreting rGE/adoption designs).
