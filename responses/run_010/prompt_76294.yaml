prompt: |-
  Next Tuesday I have the 9am discussion section on decision theory — about twenty first-years, mostly econ and poli-sci, not one philosophy major in the room — and I've already made the mistake of running Ellsberg's urn on them as a clicker survey last week. So they've all now seen their own choices printed out on the board, and roughly three quarters of them picked the labeled urn both times, which means they know, publicly, that they violated Savage's sure-thing principle in front of their classmates. I don't want you to explain ambiguity aversion to me, I've taught this a dozen times. What I want is a plan for how to teach it in fifty minutes with nothing but a whiteboard, given that particular starting condition.

  The thing I care most about is the order, because almost everything that goes wrong in this section goes wrong from a piece arriving too early. My own hunch is that the sure-thing principle has to land as an intuition — as something they'd defend — before it can be shown as broken, but I don't know how to do that without turning it into an axioms lecture, and if I front-load formalism I'll lose half of them. Then there's the carrier. I'm toying with ditching the urns entirely for a pair of vending machines on campus: one with the odds printed right on the glass, one that's brand new and unlabeled, and then the same two bets mirrored so they end up preferring snacks-from-the-labeled-machine and no-snacks-from-the-unlabeled-machine. I like it partly because the machine invites the "but the operator knows the mix and he's messing with me" reading, which I can then use rather than fight. Tell me whether that can actually carry the whole section or whether I should just stick to Ellsberg's own setup, and say what a carrier for this has to have and what it must not have.

  Then I need the misconception map, and I want it in the order they'll surface in the room rather than in order of importance. I fully expect: "I just assumed the unlabeled one was 50/50 so it didn't matter"; "that's not irrational, I just don't trust the second machine" (the ambiguity-aversion-is-really-prudence line); "so this proves probabilities aren't out there in the world"; and "so Bayesianism is refuted." I strongly suspect the last two are mine rather than theirs if I sequence badly — i.e. I'll plant them by reaching for metaphysics too soon — and I'd like to know where exactly to cut each one off. I also want to squeeze in that comparative-ignorance result (Fox and Tversky, mid-nineties, I'm fairly sure) — the one where the effect largely evaporates if you get people to price the bets seperately instead of side by side — because it's the single best thing for making them suspicious of their own survey answers. Tell me where it goes, or tell me it's too much for first-years and I should drop it.

  Format: exactly five numbered items, two or three sentences each, no introduction and no conclusion. The five items should be the five moves of the section, in the order I'd deliver them, with the misconception-handling built into the move that pre-empts it. Let the fifth item carry both the one question I can ask at the end to find out whether the idea actually landed, and the one or two things I should openly announce I'm leaving out — I have no intention of going near Choquet expected utility, dynamic consistency, or Machina-style counterexamples with this crowd.
reasoning: |-
  Hmm, the user is a decision theory instructor preparing for a discussion section with first-year econ and poli-sci students. They've already run Ellsberg's urn experiment via clicker survey, and most students violated Savage's sure-thing principle by preferring the labeled urn both times. Now they need a 50-minute lesson plan using only a whiteboard, with careful sequencing to avoid common pitfalls.

  The key constraints are:
  - Students are embarrassed about publicly revealed inconsistent choices
  - Must rebuild Savage's sure-thing principle as intuitive before deconstructing it
  - Avoid front-loading formalism to prevent losing students
  - Considering replacing urns with vending machines as more relatable carrier
  - Needs misconception handling in predicted order of emergence
  - Wants to incorporate Fox & Tversky's comparative ignorance finding
  - Must explicitly omit advanced topics (Choquet, dynamic consistency, etc.)

  The vending machine adaptation seems promising because:
  - Campus context is immediately familiar
  - "Operator messing with me" suspicion can be leveraged pedagogically
  - Avoids urn fatigue after last week's survey
  - Maintains structural equivalence to Ellsberg (known vs unknown probabilities)

  Critical sequencing insights:
  1. Sure-thing principle must feel self-evident BEFORE confronting violation
  2. Metaphysical claims ("probabilities aren't real") must be blocked early
  3. Comparative ignorance demonstration should follow initial confusion
  4. "Prudence" objection requires immediate experiential counter

  Predicted misconception sequence:
  1. "I assumed unknown was 50/50" → reveal that doesn't resolve paradox
  2. "It's rational distrust" → show inconsistency via machine preference flip
  3. "Probabilities aren't objective" → shut down to avoid derailment
  4. "Bayesianism refuted" → explicitly contain scope in closing

  Fox & Tversky placement:
  - Best after establishing the paradox
  - Use as reality check against their own survey behavior
  - "Separate evaluation" vs "joint evaluation" contrast makes intuition visceral

  The five-move structure should:
  - Start with rebuilding intuition (move 1)
  - Use vending machines to expose inconsistency (move 2)
  - Deploy comparative ignorance immediately after (move 3)
  - Systematically dismantle misconceptions in predicted order (move 4)
  - End with focused takeaway + deliberate omissions (move 5)

  Final question must test if core tension landed:
  "Would you pay to avoid seeing the vending machine's odds?" targets ambiguity aversion's emotional core while being concrete enough for first-years.
answer: |-
  **1. Rebuild the sure-thing principle intuitively using vending machines.**  
  Draw two machines: one labeled "50% Snickers, 50% Twix" (known), one blank/unlabeled (unknown). Pose: *"If you’d pay $1 for a Snickers-from-labeled, shouldn’t you pay $1 for a Snickers-from-unknown?"* Elicit agreement—emphasize that the Snickers outcome is identical regardless of the machine. This forces the "sure thing" as a shared intuition, not an axiom. Preempts early formalism resistance by anchoring in concrete choice.  

  **2. Mirror the bets to expose their preference reversal publicly.**  
  Reveal last week’s aggregated results: most chose labeled for Snickers AND labeled for Twix. Map this to machines: "You prefer Snickers-from-labeled over Snickers-from-unknown, AND Twix-from-labeled over Twix-from-unknown." Highlight the contradiction: avoiding the unknown machine regardless of snack. Squash "I assumed 50/50" by noting this preference persists even if you *suspect* 50/50—it’s about avoiding ambiguity, not assuming symmetry.  

  **3. Deploy comparative ignorance via separate pricing.**  
  Erase joint choices. Ask: *"What’s the max you’d pay to play Snickers-from-labeled? Now, Snickers-from-unknown?"* Note most will pay less for unknown. Then: *"What if you could only buy ONE bet—which would you pay more for?"* Cite Fox & Tversky: when priced separately, ambiguity aversion weakens sharply. Contrast with their earlier joint choices. This makes their survey behavior feel context-dependent and suspicious, not deeply rational.  

  **4. Defuse "prudence" by weaponizing the machine operator.**  
  When "distrust" arises, agree: *"Yes! The unlabeled machine feels risky because the operator *might* rig it."* But then pivot: *"If you distrust it for Snickers, why distrust it equally for Twix? Your choices imply the operator rigs against you no matter what you pick—is that likely?"* Force recognition that aversion stems from emotional discomfort with unknown probabilities, not evidence of manipulation. Block "probabilities aren’t real" by stressing this is about *your information*, not metaphysics.  

  **5. End with a single test question and explicit omissions.**  
  Ask: *"Would you pay a nickel to see inside the unlabeled machine before betting? Why?"* If they say yes, ambiguity aversion landed. State exclusions: *"We’re not saying Bayesianism is dead—it’s fixable with fancier models. And we’re skipping dynamic fixes or Choquet. Today’s takeaway: ambiguity feels uniquely costly, and that bends decisions."***
