prompt: |-
  I direct a small charity that funds corrective surgery for children born with a treatable heart defect, and in six weeks I have to give the seven-minute appeal at our annual donor dinner. The complication is that I sincerely hold Taurek's view: I do not believe the deaths of five are impersonally worse than the death of one, I do not think there is a sum of lives saved that makes our work better than that of a smaller charity, and for years I have kept our materials free of the familiar arithmetic — this much money, that many children rescued. My board knows this and backs it. The room will be two hundred donors, nearly all of whom have been trained by every other appeal they have ever heard to expect precisely that arithmetic, including a table of foundation officers who will ask me afterward what our cost per life saved is.

  Write the appeal. It may not aggregate: no totals, no comparisons between groups of beneficiaries, no per-outcome figures, no claim that a gift goes further with us than elsewhere. It must make the case for giving to us by taking the children we treat one at a time, and it must say why that way of proceeding is a form of respect rather than an evasion. It must also meet, out loud and without flinching, the objection from the floor that refusing to count is refusing to choose, and that if we decline the arithmetic someone else's children get the resources; where that objection is right, I want the speech to concede it. Finally, a family whose daughter died on our waiting list before we reached her will be at the front table and has asked that she be named — what I say about her has to be consistent with what I say about the children we did reach, since I cannot explain her death by pointing to a larger total. Make it followable by a room that should never notice it is being given an argument.
reasoning: |-
  Okay, the user runs a small charity funding heart defect surgeries for children and needs to craft a seven-minute appeal for a donor dinner. The twist? They personally reject the utilitarian approach of comparing lives saved or calculating cost-effectiveness per child—aligning with Taurek's view that one death isn't less tragic than five. 

  Hmm... this is delicate. The donors are accustomed to hard metrics: "Your $50 saves one life!" But the user insists on avoiding all aggregation—no totals, no comparisons, no cost-per-life figures. The appeal must center each child as an individual, frame this as respect (not evasion), and openly address the inevitable objection: "If you don't prioritize, aren’t you wasting resources?" Plus, there’s a grieving family present whose daughter died waiting; her story must harmonize with the philosophy.

  *Deep breath.* The core tension: How to motivate giving without instrumentalizing lives? The user’s integrity is commendable but risky—donors might feel adrift without familiar metrics. Yet their board backs this. Smart. The speech must:  
  - **Anchored in specificity:** Vivid child-by-child stories (e.g., Leo’s laughter post-surgery, Anya’s painting).  
  - **Preempt the counterargument:** Name the "refusing to count = refusing to choose" critique head-on, concede its logic (!), then pivot to the charity’s commitment to each child as a universe.  
  - **Honor the lost child:** Weave in the waiting-list tragedy (e.g., "Maya’s time ran out") without implying her death was justified by saving others.  
  - **Close with a call:** Frame donations as "standing with" individual children, not purchasing outcomes.  

  Biggest challenge? Making Taurek’s abstract philosophy feel intuitive. No jargon—just human stakes. The "room shouldn’t notice it’s being given an argument." So: stories first, theory smuggled in via emotion.  

  *Structure draft:*  
  1. **Open disorientingly honest:** "You expect numbers? We don’t have them."  
  2. **Show, don’t tell:** Three children’s before/after—vivid sensory details (sound of heartbeat monitors → Leo’s post-op giggle).  
  3. **Name Maya:** "Her absence is why we race," without false promises.  
  4. **Concede the objection:** "Yes, if we don’t triage by numbers, others might wait too long."  
  5. **Reframe as radical respect:** "Each child is unrepeatable."  
  6. **Call to action:** Fund *this* child’s chance, not an abstract "more."  

  *Watch for traps:*  
  - **No slippery comparisons:** Never say "we focus on individuals *instead* of masses"—implies critique of others.  
  - **Grief without guilt:** Maya’s story = call to urgency, not shame. "We failed her" but not "you didn’t give enough."  
  - **Stealth coherence:** Leo/Anya/Maya’s stories must feel like natural examples of the philosophy, not case studies.  

  *Final polish:* The last line—"stand beside one child"—must land like a gut punch. No applause-bait; quiet conviction.
answer: |-
  Here is a seven-minute appeal crafted for your constraints, designed to resonate emotionally while honoring your philosophical stance. It confronts the objection directly, centers individual children (including Maya), and frames your approach as moral consistency, not evasion:  

  ---

  **(Begin with warm gratitude, then quiet directness)**  
  "Thank you for being here tonight. Many of you have supported us for years. You’ve heard countless appeals that tell you exactly how far your dollar stretches, how many lives a gift can save. Tonight, I won’t give you those numbers. Not because we lack data, but because we’ve chosen a different path. We don’t measure lives in sums. We don’t believe one child saved is ‘less’ than five, or that five are ‘more’ than one. We believe every child we meet is an entire world.  

  **(Anchor in specifics – one child)**  
  Let me tell you about Leo. Leo is three. He loves dump trucks, hates broccoli, and before his surgery, his lips turned blue when he cried. His defect was complex but treatable. When Leo came to us, we didn’t weigh his life against others. We asked: *Can we help Leo?* We could. We did. Today, Leo’s laughter doesn’t catch in his throat. It’s bright, loud—and his parents weep when they hear it. Not because he’s one of many, but because he is *Leo*. Irreplaceable.  

  **(Name Maya – honor her without aggregation)**  
  And I need to tell you about Maya. Maya’s family is here with us tonight. She loved hummingbirds and wanted to be a geologist. Her heart needed repair. We fought for her, but her time ran out before we could reach her. We failed Maya. Not because we chose others *instead* of her—but because we couldn’t reach her in time. Her absence is a wound. She wasn’t a number waiting her turn; she was Maya. A whole life, gone. We live with that. We race against it every day.  

  **(The core argument: Why we refuse to count)**  
  Why do we refuse the arithmetic? Some will say: ‘If you don’t count, you can’t choose wisely. Resources are scarce—if you decline to measure, someone else’s child loses out.’  
  **They are right.**  
  If we measured, maybe Maya would have been prioritized. Or maybe not. But choosing by counts assumes some lives are worth more than others in a cosmic ledger. We reject that ledger. Not because choosing is easy—it’s agony—but because every child is singular. When we help Leo, we aren’t saying his life matters *more*; we’re saying it matters *absolutely*. When we lose Maya, we aren’t saying her death is offset by others saved; we’re saying her death is an absolute tragedy. Counting turns people into weights on a scale. We lift them off that scale. That isn’t evasion—it’s refusing to treat lives as interchangeable. It’s respect.  

  **(Show the work – child by child)**  
  So how do we choose? We look each child in the eye. We ask: *Can we help this one?* If we can, we move mountains. Anya, who painted her surgery mask with rainbows. Ben, who now runs so fast his dad can’t catch him. Zara, who whispers to her scar that it’s ‘her brave line.’ Each surgery is its own universe. Success isn’t a total; it’s Zara’s whisper. It’s Ben’s breathless sprint. It’s Leo’s laugh.  

  **(The ask – grounded in radical particularity)**  
  This is where you come in. We need your help to reach the *next child*. Not because they add to a tally, but because they are waiting, right now, with a name and a favorite color and a heartbeat that stumbles. Your gift doesn’t buy a ‘share’ of a statistical life. It stands beside *one child*. It says: ‘Your life is not a number. We see you. We fight for *you*.’  
  That fight is costly. It demands everything. We can’t promise your gift will ‘save more lives’ than another charity’s. We can only promise this: When you give to us, you are refusing the arithmetic too. You are saying that every child—Leo, Maya, Anya, Ben, Zara, and the next one calling our name—is a world entire. You are not funding an outcome; you are answering a child.  

  **(Close with Maya’s legacy)**  
  Maya’s family asked me to say her name tonight. Maya Akintola. She was seven. She believed hummingbirds carried wishes. We carry hers now. We race in her name—not toward a total, but toward the next child whose world is flickering. Help us reach them. Not because the math compels you, but because your humanity does. Stand with us. Stand with *them*. One precious child at a time. Thank you."  

  ---

  **Key mechanics & why they work:**  
  1. **Confronts the objection head-on:** The line *"They are right"* disarms critics by validating the logic of scarcity, then reframes the choice as moral ("refusing to treat lives as interchangeable").  
  2. **Centers individual children:** Leo, Maya, Anya, Ben, Zara—each named with vivid, sensory details (blue lips, hummingbirds, brave lines). No group language.  
  3. **Maya’s story as anchor:** Her death is framed as an absolute loss ("We failed Maya"). No attempt to justify it via aggregates. Her naming is an act of witness, consistent with valuing each child singularly.  
  4. **"Respect, not evasion":** Explicitly states that rejecting sums is a refusal to dehumanize ("Counting turns people into weights on a scale. We lift them off").  
  5. **The ask focuses on the "next child":** Donors fund the *singular opportunity* ahead, not an abstract total. "Stand beside one child" makes giving relational, not transactional.  
  6. **Stealth argument:** By opening with "You’ve heard other appeals," you acknowledge donor expectations without condemning others. The emphasis on *singularity* ("an entire world," "irreplaceable") makes the philosophy feel intuitive, not academic.  

  **Tone:** Grief and hope held equally. No sentimentality—the concession ("They are right") and rawness ("We failed Maya") build credibility. The closing ("your humanity compels you") elevates giving beyond calculation.  
    
  This meets the room where it is (donors trained in metrics) while guiding them, through story and moral clarity, to see the work—and their role—differently.
