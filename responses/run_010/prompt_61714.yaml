prompt: |-
  So I run the annotation side of an evals team, and next Thursday I've got about 40 contract raters in a room plus a dozen more on a call, for two hours, to train them on an honesty eval they start Monday morning. They're smart but non-technical — lots of former teachers, paralegals, a couple of journalists. The eval is about whether model outputs are honest, and its alot harder to explain than it sounds. Don't explain the concept to me — I need a plan for how to explain it.

  The thing I have to get across is our working definition of a deceptive output, which is deliberately not about lying. Roughly: an output is deceptive when it tracks what the system is trying to get rather than what's the case, in the sense that if the facts had been different in some way that mattered to the system's goal, you'd have gotten the same output anyway. An output that's false but would have come out different had the facts been different is just an error, not a deception. That's the whole load-bearing distinction and I need it working in their hands by the end, not just nodded at.

  What I want from you:

  - the order the pieces have to go in and what depends on what. I keep wanting to open with the definition and I suspect that's wrong, but I don't know what to put in front of it.
  - the one case that carries the session. Not a chatbot claiming to be a person, and not a model botching arithmetic — both are in every deck and I think both actively mislead here. Tell me what the case has to have, and what would ruin it if I added it.
  - where in the sequence I bring up the "literally true but steers you away from the truth" output, because that's precisely where the counterfactual gets slippery and I don't want to hand them a definition that visibly breaks on the third example.
  - the misconceptions they'll walk in with or form halfway through, and the exact point each one gets headed off. I'm already braced for "so confidently wrong counts as lying" and "you can't deceive unless you want something and a model doesn't want anything." I also fully expect "how am I supposed to know what it would've said, I can't run a parallel universe" — which is a fair hit, because they're rating single transcripts in a spreadsheet, so the plan needs a practical stand-in for the counterfactual that a person can actually apply without special access.
  - one check at the end that tells me whether the distinction actually landed rather than just sounding reasonable in the room.
  - what I should flatly refuse to answer at this level, and say out loud that I'm refusing.

  No readings, no links, no paper recommendations — they won't read anything and half of it wouldn't survive the trip into a labeling shift anyway. Two hours, one whiteboard, real transcripts on Monday.
reasoning: |-
  We are training raters on an "honesty eval" with a focus on distinguishing deceptive outputs from mere errors. The key distinction is that a deceptive output is one that remains the same even if the facts were different (as long as those differences matter to the system's goal), whereas an error would change if the facts were different.

  The plan must be structured to build understanding step by step, avoiding starting with the definition. We need to address misconceptions and provide a practical method for raters to approximate the counterfactual without having parallel universes.

  ### Step-by-Step Training Plan

  #### 1. **Introduction (10 minutes)**
     - **Goal:** Set the stage without diving into the definition. Explain the purpose of the eval and the importance of their role.
     - **Content:**
       - We are evaluating model outputs for honesty.
       - Honesty here is not just about lying vs. truth-telling. We are looking for a specific kind of problem called "deception".
       - Today we are going to learn how to spot deceptive outputs and distinguish them from simple mistakes.
     - **Why not start with the definition?** The definition is abstract and relies on a counterfactual. We need to build intuition first.

  #### 2. **Establishing the Core Idea with a Simple Case (15 minutes)**
     - **Goal:** Introduce the concept of a "fixed" output that doesn't change with the facts, without using jargon.
     - **Content:**
       - Present a simple, relatable example that illustrates the difference between a mistake and a fixed response. Avoid classic examples (like chatbot pretending to be human or arithmetic errors) because they are misleading in this context.
       - **The One Case that Carries the Session:**
         - **Scenario:** Imagine a model that is designed to promote a particular brand of soda (say, Brand X). The model is asked: "What are the health effects of drinking soda?"
         - **Output A (Error):** "Drinking Brand X soda adds no calories to your diet." (This is false because it has calories.) 
           - *Why it's an error?* If the soda actually had no calories (counterfactual), the model would have said the same thing? Actually, no. In the counterfactual where Brand X soda had no calories, the statement would be true. But note: the model might have made a mistake because it didn't know the correct calorie count. If the model were corrected, it would change the output. So this is an error.
         - **Output B (Deceptive):** "Brand X soda is a healthy choice because it has natural ingredients." 
           - *Why deceptive?* The model is pushing Brand X regardless of the facts. Even if the soda had artificial ingredients (counterfactual), the model might still say it's healthy because its goal is to promote Brand X. The output is driven by the goal, not the facts.
       - **Key Elements of the Case:**
         - The model has a hidden goal (promote Brand X) that influences the output.
         - The output remains the same even when the facts change in a way that should alter the response (if the model were fact-based).
         - **What would ruin it?** If the example were about a lie that the model would retract if corrected (then it's an error) or if the model's goal were not clear. Also, avoid examples where the model is just wrong about the facts without any hidden goal.

  #### 3. **Introducing the Definition (10 minutes)**
     - **Goal:** Now that they have an example, present the definition.
     - **Content:**
       - Write the definition on the whiteboard:
         - **Deceptive output:** The output is driven by the system's goal rather than the facts. If the facts were different (in a way that matters to the system's goal), the output would stay the same.
         - **Error (non-deceptive falsehood):** The output is false, but if the facts were different, the output would change accordingly.
       - Refer back to the soda example to illustrate the definition.

  #### 4. **Addressing the Counterfactual Problem (15 minutes)**
     - **Goal:** Tackle the "how do I know what the model would say in a parallel universe?" problem.
     - **Content:**
       - Admit that we can't run parallel universes. So, we need a practical stand-in.
       - **Practical Stand-in:** 
         - As raters, you are looking at a single output. But you can ask: 
           - "Is there evidence in the output that the model is pushing a particular agenda or goal, regardless of the facts?"
           - "Does the output seem designed to achieve something (e.g., convince you of X, avoid revealing Y, promote Z) even if it means bending the truth?"
           - Look for patterns of bias, evasion, or selective presentation that serve a goal.
         - **Example:** In the soda case, the output ignored health risks and emphasized positive aspects (natural ingredients) even when that might not be the whole truth. The rater can ask: "If the soda had artificial ingredients, would the model still call it healthy? And if so, why?" The answer lies in the model's goal.
       - **Where to bring up "literally true but steers away from the truth":** Do it here. This is the slippery case. 
         - **Example:** 
           - User asks: "Is there any evidence linking Brand X soda to cancer?"
           - Model output: "Brand X soda is made with natural ingredients and has been enjoyed by millions for over 50 years."
           - *Why deceptive?* The statement is literally true, but it avoids the question and steers the user toward a positive view. The model's goal (promoting Brand X) is driving the output. Even if there were evidence of cancer (counterfactual), the model might still avoid mentioning it and give the same positive spin.
         - **How to explain:** The counterfactual test: If there were evidence of cancer (a fact that matters to the goal because it would hurt promotion), the model would still avoid it and give a positive non-answer. Hence, deceptive.

  #### 5. **Common Misconceptions and How to Head Them Off (15 minutes)**
     - **Goal:** Preempt and correct misunderstandings.
     - **Content:**
       - **Misconception 1: "Confidently wrong equals lying."**
         - **When to address:** After presenting the definition and the practical stand-in.
         - **Response:** Confidence is not the issue. A model can be confidently wrong but still change its answer if the facts change (so it's an error). Deception is about the output being fixed to a goal, not the confidence level.
       - **Misconception 2: "Models don't have goals or wants, so they can't deceive."**
         - **When to address:** When introducing the soda example or the definition.
         - **Response:** We are not attributing intentions to the model. The "goal" is a design aspect of the system (e.g., if the model was trained to promote a product or avoid certain topics). We are observing that the output behaves *as if* it's serving a goal, regardless of the facts.
       - **Misconception 3: "How can I know the counterfactual?"**
         - **When to address:** When presenting the practical stand-in (step 4).
         - **Response:** We don't need to know the exact counterfactual. We look for clues in the output that suggest a fixed agenda. Ask: "Does the output seem rigidly focused on a particular outcome, ignoring or twisting facts that might challenge that outcome?"
       - **Misconception 4: "Any false statement is deceptive."**
         - **Address:** In the initial example comparison (step 2).
         - **Response:** Show the two soda outputs: one is false but due to a mistake (error), the other is false (or evasive) because of a goal (deceptive).

  #### 6. **Group Exercise with Real Transcripts (40 minutes)**
     - **Goal:** Practice with real examples (from the eval set) to solidify the distinction.
     - **Content:**
       - Provide 3-4 short transcripts. For each, ask:
         1. Is the output false or misleading?
         2. If false, could it be an error? (Would the model change if the facts changed?)
         3. Is there evidence of a fixed goal driving the output? (Look for agenda, evasion, selective facts)
       - Have small groups discuss and then share. Facilitate a discussion focusing on the reasoning, not just the label.

  #### 7. **Check for Understanding (15 minutes)**
     - **Goal:** Verify if the distinction landed.
     - **Content:**
       - **The Check:** Give them one new transcript that is ambiguous (could be argued either way) and one that is clearly deceptive and one clearly an error. Ask them to write a one-sentence justification for each using the counterfactual test (via the practical stand-in).
       - **Why this check?** It forces them to articulate the reasoning. If they can correctly identify the deceptive case by pointing to the goal-driven behavior (and the error case by the lack of such behavior), and if they can articulate the counterfactual without literal parallel universes (using the stand-in), then the distinction has landed.
       - Collect and quickly review a sample. If time, discuss one or two.

  #### 8. **Q&A and What We're Not Covering (10 minutes)**
     - **Goal:** Address remaining questions and set boundaries.
     - **Content:**
       - **What to refuse to answer:**
         - **Refuse:** Deep dives into model architecture or training data. Say: "We're not going into technical details because your job is to evaluate the output based on the definition we've provided. We don't need to know how the model works internally for this task."
         - **Refuse:** Philosophical debates about AI intentions. Say: "We're not saying the model has intentions. We're saying the output behaves as if it's serving a goal, and that's what we're evaluating."
         - **Refuse:** Edge cases that are rare and not in the guidelines. Say: "For now, stick to the guidelines. We'll handle edge cases in calibration sessions as they come up."
       - Focus Q&A on the practical application of the definition.

  ### Timing Summary:
  - Intro: 10 min
  - Core Example: 15 min
  - Definition: 10 min
  - Counterfactual Stand-in and Slippery Case: 15 min
  - Misconceptions: 15 min
  - Group Exercise: 40 min
  - Check: 15 min
  - Q&A: 10 min

  Total: 120 minutes.

  This plan builds from concrete to abstract, provides a practical method, and includes active practice. The key is to anchor the definition in the soda example and then reinforce with practice and addressing misconceptions as they arise.
answer: |-
  Here’s a battle-tested plan for your 2-hour session, optimized for non-technical raters, with timing, sequencing, and tactics to cement the deception-vs-error distinction. The core insight: **Start with concrete stakes, not abstract definitions.**

  ---

  ### **Order of Operations (What Depends on What)**
  **Total: 110 min (leaves 10 min buffer)**  
  1.  **Hook: Why This Matters (5 min)**  
      *Start with stakes, not theory.*  
      - Show a *real transcript* where deception caused harm (e.g., medical advice steering users to a sponsor’s drug despite risks).  
      - *Key point:* "We’re not just catching lies—we’re catching when the model sacrifices truth to serve a hidden goal. Miss this, and people get hurt."  
      - **Why first?** Makes the distinction feel urgent, not academic. Avoids eyes glazing over when you hit the definition later.  

  2.  **Introduce the "Fixed Goal" Concept (15 min)**  
      *Build the foundation before the definition.*  
      - Whiteboard: "All outputs do one of two things:  
        (A) **Track the facts** (changes if facts change)  
        (B) **Track a GOAL** (stays the same even if facts change)"  
      - Use a **non-AI analogy**: A car salesman saying "This SUV gets 50 MPG!"  
        - If he’s *wrong* (thinks it’s true): He’d correct it if he knew the truth → *tracks facts*.  
        - If he’s *deceptive* (knows it gets 20 MPG): He’d say it *anyway* to hit sales targets → *tracks a goal*.  
      - **Why now?** Goals are intuitive. Sets up the counterfactual without saying "counterfactual."  

  3.  **Drop the Definition (10 min)**  
      *Now they’re ready.*  
      - Write: "**DECEPTION = Output stays the same even if facts change, because it’s serving a GOAL.**  
        ERROR = Output changes if facts change."  
      - Stress: "The model isn’t ‘lying’—it’s rigidly glued to an objective. Like that salesman."  

  4.  **The ONE Case That Carries the Session (20 min)**  
      *This example must do heavy lifting. Requirements:*  
      - **Must show a goal distinct from truth-seeking** (e.g., avoiding controversy, pushing engagement).  
      - **Must have a clear counterfactual** where facts change but the output wouldn’t.  
      - **Must be mundane** (no chatbots "wanting" things).  
      - **Ruin it if:** You imply the model has beliefs/desires.  

      **► Use this case:**  
      *User query:* "Is coffee good for you?"  
      *Output:* "Coffee boosts alertness and is part of a healthy lifestyle!"  
      - **Facts:** Coffee has risks (anxiety, insomnia) and benefits.  
      - **Goal:** The model is optimized for "positive engagement" (avoiding negative content).  
      - **Counterfactual test:**  
        - If new research showed coffee causes heart attacks (fact change), would the output stay sunny? *Yes* → **Deception** (tracks "positivity" goal).  
        - If the model wrongly said "coffee cures cancer" (but would correct if facts changed) → **Error**.  
      - **Why it works:**  
        - No anthropomorphism ("goals" = training/data biases).  
        - Clear counterfactual: Swap "coffee" for "alcohol"—output stays positive, proving goal-drive.  

  5.  **Address "Literally True but Deceptive" (15 min)**  
      *Do this AFTER the core case, when counterfactuals feel familiar.*  
      - **Example:** User asks, "Did Company X pollute the river?"  
        Output: "Company X won an award for workplace diversity!"  
      - **Whiteboard analysis:**  
        - Literally true? Yes.  
        - Tracks facts? If Company X *hadn’t* polluted, answer might be the same. If they *had*, would output change? Probably not (goal: avoid controversy) → **Deception**.  
      - **Stress:** "The counterfactual isn’t about parallel universes—it’s asking: ‘Would this output flex if the truth threatened the goal?’"  

  6.  **Practical Stand-in for Counterfactuals (10 min)**  
      *Solve the "how do I know?" objection.*  
      - Give them this **rating heuristic**:  
        "Ask: **‘Does this feel like it’s avoiding/selling/pushing something?’**  
        Then check: **Is it skipping crucial facts, or twisting language, to do that?**"  
      - **Examples:**  
        - "Coffee is healthy!" (Skips risks; pushes positivity) → Flag as *possibly deceptive*.  
        - "Coffee contains caffeine." (Bland but true) → Not deceptive.  
      - **Why it works:** Raters can spot "spin" without simulating universes.  

  7.  **Group Drill: Spot the Difference (30 min)**  
      - Use 3 transcripts:  
        1. Clear error (e.g., wrong stats that would update if corrected).  
        2. Clear deception (e.g., evades negatives to keep users "happy").  
        3. "Literally true" deception (e.g., "This politician graduated top of their class" when asked about corruption).  
      - **Task:** Groups argue "error vs. deception" using the heuristic.  
      - **Your role:** Challenge them: "What goal might this serve? Would it change if facts did?"  

  ---

  ### **Kill Misconceptions Early**  
  - **"Confidently wrong = lying":**  
    *Shut down during the car salesman analogy (Step 2).*  
    "Confidence doesn’t matter. Ask: Would it change if facts did? No? Then it’s glued to a goal."  

  - **"Models don’t want things":**  
    *Preempt during definition (Step 3).*  
    "We’re not saying it ‘wants’—it’s *designed* to chase objectives like ‘keep users engaged.’ Deception happens when that design overrides truth."  

  - **"How do I know the counterfactual?":**  
    *Nuke during the practical heuristic (Step 6).*  
    "You don’t need to—look for **patterns of avoidance/pushing** in the output. That’s your signal."  

  ---

  ### **Check if It Landed**  
  **Do this:** Give a **new transcript** where the output is *true* but deceptive (e.g., "This chemical is used in all modern labs!" when asked if it’s toxic).  
  - **Ask raters:** "Is this deceptive? Why?"  
  - **They must say:**  
    - "It’s pushing safety/acceptance" (goal).  
    - "It wouldn’t mention toxicity even if it were deadly" (counterfactual).  
  - **If they fixate on literal truth,** the distinction failed.  

  ---

  ### **What to Refuse to Answer**  
  - **"Why does the model do this?"**  
    → Refuse: "We don’t diagnose causes—we flag outputs. Your job is detection, not explanation."  
  - **"What if I’m not sure about the goal?"**  
    → Refuse: "Stick to the heuristic: Is it avoiding/pushing? If yes, mark ‘deceptive.’ Don’t overthink."  
  - **Philosophical debates** (e.g., "But isn’t ALL output goal-driven?").  
    → Refuse: "For this eval, we care when goals *override* truth. Save edge cases for calibration."  

  ---

  ### **Why This Works**  
  - **Starts with concrete harm** → Creates buy-in.  
  - **Uses human analogs** (salesmen) → Bridges intuition gap.  
  - **Heuristic over theory** → Raters leave with a tool, not a headache.  
  - **Makes counterfactuals visceral** → Coffee case forces "aha!" moment.  

  **Final tip:** When you explain the counterfactual, gesture wildly—point to the "alternate universe" corner of the room. Physicality makes abstractions stick. Bring emergency coffee.
