  Hmm, the key tension seems to be between steps (2) and (3). Step (2) defines "chosen as means" very strictly - if the benefit couldn't occur without the deaths, then the deaths are means. But in the marshalling yard case (3), the physical event causing both destruction and deaths is singular. This forces the conclusion (4-6) that all such bombings involve intentional killing.

  The user suspects step (3) might be flawed. Let me think about Anscombe's actual position... She'd likely argue that the bomber crew's intention is directed at the railway destruction, not the housing estate. The deaths are foreseen but not intended under that description. But step (8) objects that this makes morality depend on verbal descriptions.

  Ah! Here's the crucial point: Anscombe distinguishes between the "order of causation" and the "order of intention". For her, what matters is whether the deaths are part of the act's intentional structure - whether they're in the "series of intentions" leading to the act. In the marshalling yard case, the housing destruction isn't part of the chosen means-chain to paralyze rail traffic; it's collateral damage. Whereas in Hiroshima, destroying the city was precisely the means chosen.

  Step (3) mistakenly conflates physical causality with intentional structure. The physical event may be singular, but intentional actions are described by their teleology. Anscombe would reject the claim that "the good is produced by one physical event" as irrelevant - what matters is how the agent conceives the means-end relationship.

  The user asks what fact does the work here. It's the agent's practical reasoning: Does the bomber crew need the residents' deaths to achieve their goal? If destroying the railway alone achieves the goal, then the deaths aren't means even if physically inseparable. This relies on Anscombe's action theory where intentions are defined by the "why?" question's answers.

  Pricing alternatives: Rejecting (2) would gut the means/side-effect distinction entirely. Rejecting (5) is impossible - it's logically sound from the flawed premises. Rejecting (7) would make Anscombe inconsistent, which she wasn't. So attacking step (3)'s conflation is the least costly path.

  The user worries this makes morality verbal. But Anscombe would counter that it's about real intentional structures, not labels. A commander can't "describe away" deaths if they're actually required for his goal. The test is whether removing the deaths would frustrate the intention - in the marshalling yard case, it wouldn't.

  This preserves the Truman distinction: For him, the city's destruction (including deaths) was the necessary means. For ordinary bombers, the deaths aren't necessary for the tactical goal. The difference is in the practical reasoning, not physics or verbiage.
answer: |-
  Your reductio is admirably sharp, but the flaw lies in **step (3)**, specifically in its claim that *"the benefit aimed at is produced by one physical event... and that same event is what kills the residents"*. This conflation of physical causality with intentional structure invites the fallacious move, trading on an ambiguity in "event". Anscombe would reject this equation. Here’s the diagnosis, addressing your queries in turn:

  ### 1. **Step to Reject & Why It Looked Innocuous**  
     - **Step (3)** must be rejected.  
     - **Why it looked innocuous**: You treat the *physical explosion* as a singular "event" unifying the destruction of the railway and the housing estate. This seems neutral, even scientific. But Anscombe’s account of intention is teleological, not physicalist. What matters is not the spatiotemporal unity of the causal event, but *how the act is specified in the agent’s practical reasoning*. The slippage occurs by treating the explosion as an undifferentiated lump, ignoring Anscombe’s insistence that acts are intentional *under descriptions* tied to the agent’s aims.

  ### 2. **The Work Done in the Marshalling-Yard Case & Anscombe’s Entitlement**  
     - **The relevant fact**: The bomber crew’s *intentional object* is the destruction of the railway yard *as such*. The deaths occur because the yard is spatially adjacent to housing, but those deaths are not part of the *chosen means*. The benefit—paralysing rail traffic—is achieved by destroying the railway infrastructure; it does not require the destruction of the houses or the deaths of residents. The physical inseparability is irrelevant to the *intentional separability*.  
     - **Anscombe’s entitlement**: She is entitled to this distinction under her action theory. For Anscombe (*Intention*, 1957), an act is intentional under a description if it answers a "Why?" question with a reason that reveals the *point* of the act. The crew’s answer to "Why bomb this target?" is "To destroy the railway yard to paralyse transport". The follow-up—"Did you intend to kill residents?"—would elicit "No, we foresaw it but aimed only at the yard". The deaths are not part of the act’s *intentional structure*; they are collateral damage. Her criterion thus hinges on whether the deaths are *constitutive of the means* (as in Hiroshima), not whether they are physically simultaneous.  

  ### 3. **Pricing the Alternatives**  
     - **Rejecting (2)**: This guts the means/side-effect distinction entirely. If "the good could be secured without the deaths" is not the test, then Truman’s bombing could be excused as a "side effect". *Cost*: Surrenders Anscombe’s core objection to Truman and collapses into consequentialism. Unbearable for your aim.  
     - **Rejecting (5)**: The generalisation fails because step (3) is false. Not all bombings in populated areas *require* civilian deaths as means. E.g., destroying a bridge militarily vital *and isolated* avoids civilian deaths; destroying one in a city *may* have deaths as side effects if precautions are taken. *Cost*: Minimal—it merely corrects an overreach.  
     - **Rejecting (7)**: Abandoning Anscombe’s non-pacifism forces her into incoherence. She explicitly condones some acts of war (e.g., justly targeting combatants) and allows foreseen civilian deaths under double effect. *Cost*: Makes her position self-refuting. Unbearable.  
     - **Rejecting (1)/(6)**: Either collapses her critique of Truman (1) or embraces pacifism (6). *Cost*: Sacrifices the entire argument.  

  ### Why (8) Does Not Stand  
  Your worry that denying (3)-(4) reduces morality to "cheap descriptions" is misplaced. Anscombe’s "description" is not verbal sleight-of-hand but a reflection of *practical necessity*. The test is: **Could the agent conceive of the act succeeding *without* the deaths?**  
     - In Hiroshima, the surrender *required* the city’s destruction (deaths as means).  
     - In the marshalling yard, the rail paralysis *does not require* the housing destruction. The agent can rationally intend the former while regretting the latter.  
  The "line" is fixed by *whether the deaths are materially necessary for the goal*, not by the agent’s labels. A commander who "narrowly describes" his aim while *knowing* the deaths are functionally indispensable (e.g., bombing a school to kill a sniper) cannot evade guilt—his intention transparently includes the deaths.  

  ### Conclusion  
  **Diagnosis**: Step (3)’s physicalist reduction misrepresents Anscombe’s intentionalism. Rejecting it preserves (1) and (7) without capitulating to (8). The marshalling-yard deaths are *foreseen but not intended* because they are not part of the act’s means-description in practical reasoning.  
  **Cost**: Only abandoning the overgeneralized (5) is needed—a minor correction. Anscombe’s framework survives, and Truman’s decision remains distinct in kind: he intentionally used civilian destruction as a means, while the bomber crew did not. The reductio fails by conflating metaphysics with intention.
