  First, I need to parse their requirements. They want the collective to be a real subject, not just a grammatical "we". The properties should emerge from the parts without sneaking in strong emergence. The whole can have new qualities not present in individuals. There must be a clear boundary for membership. They mention residue after a member dies and intermittent existence during sleep. 

  The user's key needs are clarity for narrative consistency. They need to know what the narrator can perceive, feel, remember, and when it exists. The metaphysics must have defined boundaries. They want to avoid academic references, focusing on functional specs.

  Assessing their list: The real subject requirement is non-negotiable in panpsychism. Derivation from parts is also core—without it, it's not panpsychism. New qualities in the whole are acceptable as long as they're emergent. Boundary criteria are essential for their story (excluding the kid and newcomer). Residue might be problematic; it could violate the parts-derived principle by retaining info post-death. Intermittent existence depends on the theory; some might accept it.

  The residue point is likely indefensible. If the whole retains memories after a member dies, that info wasn't derived from the parts anymore, breaking the parts-first requirement. They might need to drop residue or adjust the narrative.

  Intermittence is a house preference. Panpsychism can accept discontinuous subjects, but theories vary. For their story, the town vanishing at night could work if the theory allows temporal gaps.

  The most damaging requirement is the boundary criterion. Defining who's in or out is tough without arbitrary rules. Parts-first theories struggle here, while whole-first might handle it better by setting boundaries intrinsically.

  Whole-first approaches avoid combination problems by starting with the collective. But they still need to explain how individuals arise, which might just relocate the issue. Parts-first faces the combination problem directly—how parts integrate into a unified whole.

  Refusal-to-compose theories deny collective subjects exist, which doesn't help their narrative. They need the town as a real entity.

  For the user, if they keep residue, they lose strict derivation from parts. If they drop it, they maintain consistency but must adjust the memory scene. Whole-first might ease boundaries and intermittence but needs individual carving. Parts-first requires solving combination and boundaries.

  Practical advice: Use a whole-first approach for clearer boundaries and intermittence. Avoid residue to stay true to parts derivation. Adjust the death scene so the memory is accessed while the person is alive or through current members.
answer: |-
  Here’s the spec for a theory of collective subjects, tailored to your constraints. Non-negotiables (core to any coherent panpsychist composition theory) are **bolded**. House preferences (your narrative needs) are *italicized*. Brutal honesty included.

  ---

  ### The Requirements (Your List, Annotated)
  1. **The whole is a real subject (not grammatical glue).**  
     *Non-negotiable.* If it’s not a genuine subject with unified experience, panpsychism fails. Your town *has* to have "what it’s like to be it," distinct from isolated parts.

  2. **Properties of the whole follow (in principle) from the properties of the parts.**  
     **Non-negotiable.** This *is* panpsychism. Violating this invites strong emergence (which you’ve banned). The "in principle" matters—it doesn’t need to be calculable, just metaphysically grounded in parts.

  3. *The whole can have novel qualities absent in any part.*  
     **House preference.** Compatible with panpsychism (e.g., emergent structure), but *only if* these qualities are *constituted* by the parts’ properties. Your "town dread" is fine if it’s a holistic pattern of micro-feelings (e.g., anxiety + shared context). If it’s wholly alien, you break Requirement 2.

  4. **Boundary criterion: Some entities are IN, some OUT.**  
     **Non-negotiable for your purpose.** A theory without boundaries is useless for narrative consistency. It must specify why the kid/newcomer are excluded (e.g., integration thresholds, relational ties).

  5. *Residue: The whole retains a dead member’s memories.*  
     **Indefensible house preference.** This violates Requirement 2 catastrophically. If the town accesses the dead woman’s childhood memory *after she dies*, that information wasn’t derived from the *current* parts. It implies the whole stores data independently of its constituents—a fatal break from parts-first panpsychism. **What you lose:** This scene as written. **Save it?** Have the town access the memory *while she’s alive* (via her), or let current members reconstruct it from shared history.

  6. *Intermittent existence (sleep → dissolution).*  
     **House preference.** Some theories allow discontinuous subjects (if identity is pattern-based), others demand continuity. Your version is survivable if the theory accepts temporal gaps in subjecthood (e.g., the town is a process that re-forms when constituents reactivate).

  ---

  ### The Joint Unsatisfiability  
  - **Requirement 2 (parts-derivation) + Residue (Requirement 5) are incompatible.** Residue requires the whole to "own" information detached from its parts—a dealbreaker.  
  - **Boundaries (Requirement 4) + Intermittence (Requirement 6) strain theories.** If the town dissolves nightly, why does it re-form with *identical* boundaries? A theory must explain persistence of "membership" across gaps.

  ---

  ### Most Damaging Requirement  
  **Boundary criterion (Requirement 4).**  
  Why? Parts-based theories struggle to define *why* some entities are included/excluded without arbitrary thresholds. Whole-first theories must explain why the "carving" stops at the town’s edge. Without narrative hand-waving, this exposes every theory’s weakest spot.

  ---

  ### How Theories Fail Your Spec  
  1. **Parts-Build-Up (e.g., combinatory panpsychism):**  
     - ✅ *Derives* whole from parts (Requirement 2).  
     - ✅ *Allows emergent qualities* (Requirement 3).  
     - ❌ **Fails boundaries**: Why do *these* people compose the town? (Requirement 4).  
     - ❌ **Fails residue**: No storage beyond parts (Requirement 5).  
     - ⚠️ *Intermittence*: Possible if composition is dynamic, but nightly dissolution/reformation feels ad hoc (Requirement 6).  

  2. **Whole-First (e.g., cosmopsychism):**  
     - ✅ *Boundaries cleaner*: The town-subject is fundamental; people are "modes" within it (Requirement 4).  
     - ✅ *Novel qualities*: The whole’s dread is basic (Requirement 3).  
     - ✅ *Residue possible*: Memories live in the whole (Requirement 5)—*but this breaks Requirement 2*.  
     - ❌ **Fails derivation**: Parts don’t build the whole—the whole is prior. Violates your panpsychist commitment (Requirement 2).  
     - ⚠️ *Intermittence*: If the whole is fundamental, why does it vanish at night? (Requirement 6). **Verdict:** Relocates (but doesn’t solve) the problem.  

  3. **Refusal-to-Compose (e.g., subject skepticism):**  
     - ❌ **Fails Requirement 1**: Denies the town is a real subject. "We" is linguistic convenience.  
     - *Ignores every other requirement*. Useless for your novel.

  ---

  ### Bottom Line for Your Novel  
  - **Kill residue (Requirement 5)**. It’s a cheat that violates core panpsychism.  
  - **Adopt whole-first to ease boundaries/intermittence**—but accept you’re sacrificing strict parts-derivation.  
  - **OR stick to parts-first and define boundaries rigorously**: e.g., "The town-subject emerges only when >70% of adult residents are awake/co-located, with >5 years’ residency, engaged in communal tasks." (Adjust thresholds to exclude the kid/newcomer).  
  - **Test every scene**: Can the narrator’s awareness be *fully* mapped to current parts’ states? If not, revise.  

  Your narrator’s existence hinges on the theory’s weakest links: boundaries and intermittence. Make those airtight, and the rest follows.
