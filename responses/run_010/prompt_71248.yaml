answer: |-
  Here’s a decision procedure grounded in moral philosophy (focusing on hypocrisy, standing, and credibility), designed for speed, clarity, and ED sign-off. It separates key distinctions while acknowledging irreducible judgment calls.

  ---

  ### **Core Philosophical Grounding**
  1.  **Truth vs. Standing**: Truth is necessary but insufficient. Standing asks: "Even if true, does *our voice* add moral force or undermine it?" (Derived from Scanlon, Wallace).
  2.  **Hypocrisy vs. Growth**:
      -   **Hypocrisy**: Claiming a virtue *while currently violating it* in a similar context (e.g., taking dirty money *now* while decrying dirty money).
      -   **Changed Mind**: Past violation *fully resolved, publicly acknowledged, and reformed* (e.g., "We did X, it was wrong, here’s how we fixed it").
      -   **Unresolved Failure**: Ongoing violation, concealed violation, or unacknowledged/reformed past violation. This destroys standing.
  3.  **Standing as Gradient**: Not binary "have/don’t have." Factors:
      -   **Severity**: How bad is *our* failure vs. *theirs*?
      -   **Relevance**: Is our failure *of the same kind* we’re criticizing? (Taking polluter money vs. criticizing a mayor’s sexism = low relevance).
      -   **Recency/Ongoing**: Current > recent unaddressed > distant past resolved.
      -   **Transparency**: Have we *publicly* owned the failure and progress? (Rawls’ publicity condition).
  4.  **Institutional Standing**: Yes, institutions hold moral standing. Actions of staff/board *in the institution’s name* affect its credibility (French, Pettit).
  5.  **Borrowed Standing**: Handing to a "clean" partner *can* work if: (a) They have direct standing, (b) We disclose our flaw *to them*, (c) They vouch for the truth *independently*. (Analogous to "clean hands" in equity).

  ---

  ### **The Decision Procedure (20-Minute Flow)**
  **INPUT**: Proposal to call out Actor X for Conduct Y.

  #### **STEP 1: THE TRUTH TEST (3 mins)**
  -   **Q1:** Is the evidence for Conduct Y **verifiable, public-interest, and materially harmful**? (If NO → **Output: Hold** or **Policy Piece** if harm/fix is generic).
  -   **Q2:** Is naming Actor X **necessary** to stop harm or inform the public? (If NO → **Output: Unnamed Policy Piece**).

  #### **STEP 2: THE SELF-AUDIT (7 mins)**
  -   **Q3: Is there an *ongoing* or *unresolved/recent* failure by *us* relevant to Conduct Y?**  
      *(Relevance = same moral principle/vulnerable group/harm mechanism. Judgment Call!)*
      -   *NO* → Proceed to Step 3.
      -   *YES* → **Q4: Is it PUBLICLY acknowledged, with a credible remediation plan/timeline?**
          -   *YES* → Standing is **weakened but recoverable**. Proceed to Step 3.
          -   *NO* → Standing is **lost**. → **Output: Hold** (if fixable <6mo) **OR Handoff** (if fix >6mo or systemic).

  #### **STEP 3: STANDING ASSESSMENT (7 mins)**
  -   **Q5: Does *our specific role* (evidence holder, victim advocate, policy expert) make us **uniquely necessary** to this callout?** (If NO → **Output: Handoff** preferred).
  -   **Q6: Would publishing *with full transparency* about our own flaw (if any) **increase net credibility**?**  
      *(Judgment Call! Consider: Does disclosure show integrity? Or does it distract/muddy the message?)*
      -   *YES* → Standing is **repaired/adequate**. → **Proceed to Step 4**.
      -   *NO* → Standing is **too weak**. → **Output: Handoff** (if partner exists) **OR Policy Piece**.

  #### **STEP 4: THE CREDIBILITY/HARM TRADEOFF (3 mins → ED Decision)**
  -   **Present to ED in 1 line:**  
      *"Recommend [Full Callout/Policy Piece/Handoff/Hold] for Actor X re: Conduct Y. Our flaw: [Brief status]. Net credibility impact: [High/Medium/Low]. Harm prevented by delay: [Estimate]."*
  -   **ED Decides:** Final trade-off between:  
      a) Credibility risk to org,  
      b) Urgency of preventing harm by Actor X,  
      c) Strategic value of *our voice* vs. partner’s.

  ---

  ### **Test Cases**
  #### **Case 1: Mayor’s Procurement Scandal (Our flaw: Took similar corrupt grant 2yrs ago, unresolved)**
  -   **Step 1:** Truth PASS (scandal verifiable, harmful).
  -   **Step 2 Q3:** **YES** (Relevant! Both involve corrupt $$). Q4: **NO** (Not publicly resolved). → **STANDING LOST**.
  -   **Output: Handoff** to clean coalition partner. If none, **Hold** *only* if fixing grant flaw <6mo. ED Line: *"Handoff. Unresolved similar graft flaw destroys standing."*

  #### **Case 2: Ongoing Harm (e.g., Toxic Dumping). Our flaw: Own program did similar (stopped last year), not publicly owned.**
  -   **Step 1:** Truth PASS. Naming needed.
  -   **Step 2 Q3:** **YES** (Relevant harm). Q4: **NO** (Not owned publicly). → **STANDING LOST**.
  -   **Output: Handoff** (best). If impossible, **Policy Piece** *explicitly naming the harm type but not actor* + accelerate owning our flaw. **Hold** unacceptable (harm continues). ED Line: *"Handoff. Unacknowledged past similar harm. Policy piece fallback."*

  #### **Case 3: "Smoking Gun" Oppression by a Foundation (Our flaw: Board conflict re: related issue, unresolved)**
  -   **Step 1:** Truth PASS (smoking gun evidence).
  -   **Step 2 Q3:** Board conflict *may not be relevant* (e.g., if conflict is over financial oversight, not oppression). **NO** → Proceed.
  -   **Step 3 Q5:** **YES** (We have unique evidence). Q6: **YES** (Disclosing board conflict *shows transparency*; "smoking gun" overshadows flaw). → **STANDING REPAIRED**.
  -   **Output: Full Callout** with footnote: *"We acknowledge our board is addressing governance issues."* ED Line: *"Publish. Irrelevant flaw; disclosure adds credibility."*

  ---

  ### **One-Page Procedure for Interns**
  **DECIDE HOW TO CALL OUT BAD ACTORS**  
  *(20 mins max; ED signs off)*

  | STEP          | QUESTION                                                                 | YES →                                    | NO →                                     |
  |---------------|--------------------------------------------------------------------------|------------------------------------------|------------------------------------------|
  | **1. TRUTH?** | 1. Is the harm **real, proven, and serious**?                           | Go to Step 2                             | **HOLD** or **POLICY PIECE** (generic)   |
  |               | 2. Is **naming the actor** needed to stop harm?                          | Go to Step 2                             | **POLICY PIECE** (harm/fix only)         |
  | **2. OUR HOUSE CLEAN?** | 3. Do **we have a current/unresolved flaw** *like* the harm we’re criticizing? | → Q4                                     | Go to Step 3                             |
  |               | 4. Is it **publicly known + being fixed**?                              | Go to Step 3 (Standing weak)             | **HOLD** (if fix fast) or **HANDOFF**    |
  | **3. STANDING OK?** | 5. Is **our voice essential** (e.g., we have proof no one else has)?     | Go to Q6                                 | **HANDOFF**                              |
  |               | 6. Would **admitting our flaw** make us *more* credible?                | Go to Step 4 (Standing repaired)         | **HANDOFF** or **POLICY PIECE**          |
  | **4. ASK ED** | **Write 1 line for ED:**<br> *"Recommend [ACTION]. Our flaw: [STATUS]. Credibility: [H/M/L]. Harm if delayed: [EST]."* | **ED Approves/Rejects** |                                          |

  **OUTPUTS:**  
  - **FULL CALLOUT**: Name/shame actor. *Use if standing strong.*  
  - **POLICY PIECE**: Describe harm/fix, no names. *Use if truth weak or standing low.*  
  - **HOLD**: Delay; fix our flaw first, announce plan. *Use only if fix is FAST (<6mo).*  
  - **HANDOFF**: Give to trusted partner *with clean hands*. *Use if standing lost.*

  ---

  ### **How This Will Misfire in Practice**
  1.  **"Relevance" is a Black Hole**: Debating if "taking polluter money = standing to call out union-busting?" eats time. *Mitigation: Pre-define "relevance" as "same core principle" (e.g., corruption, environmental harm).*
  2.  **Disclosure Backfires**: Admitting a flaw in the callout can drown the message. *Mitigation: Train staff on framing disclosures briefly & strategically.*
  3.  **Coalition Partners Balk**: Partners may refuse "tainted" scoops or demand edits. *Mitigation: Build handoff protocols in advance.*
  4.  **ED Override**: ED may reject "HANDOFF" due to ego/urgency. *Mitigation: Track overrides to refine criteria.*
  5.  **"Fast Fix" Illusion**: "HOLD" assumes flaws get fixed quickly. *Mitigation: Require concrete timelines; auto-convert to HANDOFF if stalled.*
  6.  **Moral Licensing**: Calling out others *feels like* offsetting our sins. *Mitigation: Flag in training; audit callouts for self-serving patterns.*

  **Key**: This procedure forces clarity on trade-offs but doesn’t eliminate judgment—especially on relevance, credibility, and harm urgency. Its value is in making implicit debates explicit, auditable, and time-boxed.
