  Below is a complete, ready-to-photocopy simulation kit designed to meet your goals. It focuses on the **"Harmonization of Product Labelling for Food Allergens"**—a concrete, low-glamour regulation with clear domestic winners/losers (e.g., consumer safety advocates vs. small food producers). The game forces students to experience the **two-sided accountability trap**: losing control at the EU level while gaining impunity at home. 

  ---

  ### **Materials to Photocopy**  
  *(1 set per student + instructor materials)*  

  #### **1. Country Assignment Sheet (Public)**  
  *(Hand to all students)*  
  **Title:** EU Member State Profile  
  **Instructions:** This is public information. Use it to negotiate.  
  **Content:**  
  ```  
  - Country: [e.g., Germany, France, Poland, etc. *Assign 22 real EU countries*]  
  - Population: [e.g., Germany: 83M, France: 67M, etc.]  
  - Key Economic Sectors: [e.g., Germany: Manufacturing/export; Poland: Agriculture/SMEs]  
  ```  
  *Include a summary of the double-majority rule for Round 2:*  
  *"55% of countries (≥12) AND 65% of total EU population (≥290M) must support the regulation."*  

  ---

  #### **2. Private Role Card**  
  *(1 unique card per student; keep secret)*  
  **Template:**  
  ```  
  [COUNTRY NAME]  
  - Governing Coalition: [e.g., "CDU/SPD (Grand Coalition)"]  
  - Salient Domestic Constituency: [e.g., "Small Food Producers"]  
  - What They REWARD: [e.g., "Low compliance costs, exemptions for small businesses"]  
  - What They PUNISH: [e.g., "Strict regulations that increase costs or hurt sales"]  
  - Next Election: [e.g., "Next year" or "In 4 years"]  
  - SECRET GOAL: [e.g., "Block strict allergen labels" or "Pass strong labels"]  
  ```  
  **Crucial Asymmetry Examples:**  
  - **Deal-Needers (4-5 students):**  
    - *E.g., Netherlands:* Constituency = "Export-focused manufacturers." Reward = "Harmonized rules to ease trade." Punish = "No deal (fragmented rules)." Election = "Next year." Secret Goal = "Get ANY deal to avoid trade chaos."  
  - **Deal-Blockers (4-5 students):**  
    - *E.g., Poland:* Constituency = "Small farmers." Reward = "Exemptions for small producers." Punish = "One-size-fits-all rules." Election = "In 4 years." Secret Goal = "Block unless SMEs are exempt."  
  - **Swing States (others):**  
    - *E.g., Germany:* Constituency = "Consumer groups." Reward = "Strong allergen labels." Punish = "Weak safety standards." Election = "Next year."  
    - *E.g., France:* Constituency = "Industrial food lobby." Reward = "Long transition periods." Punish = "Strict labels." Election = "In 4 years."  

  ---

  #### **3. Regulation Draft: "Food Allergen Labelling Rules"**  
  *(1 per student + project on board)*  
  **Proposal Highlights:**  
  ```  
  Article 1: Allergen Warnings  
  - Must cover [Option A: 10% / B: 5% / C: 2%] of packaging front.  

  Article 2: Transition Period  
  - Compliance within [Option A: 6 months / B: 2 years / C: 5 years].  

  Article 3: Exemptions  
  - [Option A: Full exemption for firms <50 employees / B: Partial exemption / C: No exemptions].  

  Article 4: Language Rules  
  - [Option A: Local language only / B: Any EU language].  
  ```  

  ---

  #### **4. Press Slip**  
  *(2 slips per student; 1 for each round)*  
  **Template:**  
  ```  
  Country: _______________  
  After the EU vote, I will tell my domestic media:  
  "________________________________________________________________________"  
  ```  

  ---

  #### **5. Instructor Master Sheet**  
  *(Confidential – for your eyes only)*  
  - **Country-Specific "Win Conditions":**  
    - *E.g., Netherlands Wins if:* Deal passes (any version) → Press slip blames EU for flaws.  
    - *E.g., Poland Wins if:* Deal blocked OR exemptions included → Press slip claims credit/blames others.  
  - **Point System (non-graded, symbolic):**  
    - **+2 pts:** Outcome aligns with constituency demands (policy win).  
    - **+1 pt:** Press slip successfully shifts blame (for bad outcomes) or claims credit (for good ones).  
    - **-1 pt:** Press slip admits fault/ownership of bad outcome.  
    - **Election Bonus:** "Next year" election → Double points if outcome avoids punishment.  
    - *No math needed – announce winners as "Most Points" in debrief to incentivize roleplay.*  
  - **Trilogue Mandates:**  
    - **Council Presiding Minister** (e.g., Slovenia): "Broker a compromise that ≥12 countries can accept."  
    - **Parliament Rep** (e.g., Germany): "Demand strong labels (Article 1: Option A; Article 3: Option C)."  
    - **Commission Broker** (e.g., France): "Push for standardization (Article 4: Option B)."  

  ---

  ### **Game Rules**  
  **Objective:** Negotiate the allergen labelling regulation under two voting systems.  
  **Core Mechanic:** Students act as national ministers in the EU Council.  
  **Scoring:** Points based on satisfying constituency via policy + press spin.  

  ---

  ### **Timeline (80 Minutes Total)**  
  #### **Setup (5 min)**  
  - Assign countries/roles randomly. Hand out **Country Sheets** and **Private Role Cards**.  
  - Project the **Regulation Draft**. Briefly explain:  
    > *“Today we’re negotiating EU allergen labels. Your goal: get the best deal for your constituency to survive the next election. Two rounds: first unanimity, then majority voting.”*  

  #### **Round 1: Unanimity (15 min)**  
  - **Rules:** All 22 must agree on the regulation (amend Articles 1–4 via debate).  
  - **Instructor Role:** Float, remind them of constituency demands.  
  - **Minute 12:** Hand out **Press Slips**. Students write their secret media line. Collect slips.  
  - **Minute 15:** Vote. If unanimity fails, regulation fails.  

  #### **Transition (5 min)**  
  - Announce Round 1 outcome.  
  - Introduce **double-majority rules** (55% countries + 65% population).  

  #### **Round 2: Double Majority (25 min)**  
  - **Minute 0-10:** Plenary negotiation.  
  - **Minute 10:** Pull aside 3 students → **Trilogue Corner** (give them mandates).  
  - **Minute 15:** Trilogue returns with take-it-or-leave-it package. No amendments allowed.  
  - **Minute 20:** Hand out **Press Slips**. Students write media lines. Collect slips.  
  - **Minute 22:** Vote (count countries + population). Announce result.  

  #### **Debrief (30 min)**  
  1. **Press Slip Reveal (10 min):**  
     - Read aloud *all* slips (mix rounds/countries). Ask: *“Who shifted blame? Who took credit?”*  
     - Highlight hypocrisy (e.g., a deal-maker blaming Brussels).  

  2. **Concept Mapping (15 min):** Use Socratic questions:  
     - **Pooled vs. Delegated Sovereignty:**  
       > *“In Round 1 (unanimity), you pooled sovereignty—each state had veto. In Round 2, sovereignty was delegated to the trilogue. How did that feel?”*  
     - **Accountability Void:**  
       > *“When the trilogue forced a take-it-or-leave-it deal, who could you hold accountable? Could you ‘vote the Commission out’?”*  
     - **Input vs. Output Legitimacy:**  
       > *“Was the majority-vote outcome (Round 2) better policy? Even if it felt less democratic?”*  
     - **Two-Sided Trap:**  
       > *“Did anyone here gain impunity at home by blaming Brussels? Did that feel rational?”*  

  3. **Bigger Picture (5 min):**  
     - > *“This is the core democratic deficit: The EU lacks a ‘demos’ (input), but national ministers exploit that gap (output). Ever-closer union requires this trade-off – but is it sustainable?”*  

  ---

  ### **What Will Go Wrong (and How to Fix It)**  
  1. **Unanimity round collapses into instant gridlock:**  
     - **Why:** Students may deadlock if blockers hold firm.  
     - **Fix:** Pre-seed 2-3 "deal-needer" roles (e.g., Netherlands) who beg for compromise. **When it happens:** *“Notice how hard unanimity is? That’s why the EU moved to majority voting.”*  

  2. **Loud students dominate the trilogue:**  
     - **Why:** Assertive players may ignore mandates.  
     - **Fix:** Assign trilogue roles to mid-volume students. Give written mandates. **When it happens:** *“In reality, the EP and Commission have institutional power to resist – but power imbalances exist.”*  

  3. **Conscientious student refuses to blame-shift:**  
     - **Why:** Feels like "cheating" to spin a loss.  
     - **Fix:** Emphasize in setup: *“Your job is re-election – spin is survival.”* **When it happens:** *“Some ministers do take responsibility. But in the real EU, blame-shifting is rational because there’s no pan-European media to call it out.”*  

  ---

  ### **What the Simulation Can’t Capture (Supply by Hand)**  
  - **Long-Term Interactions & Legal Culture:** Real ministers build relationships and operate under the ECJ’s shadow. The simulation is a one-off game.  
    - **Supply this context:** > *“In reality, ministers interact for decades under shared legal norms. This game can’t capture that trust or the ECJ’s enforcement role.”*  
  - **Absence of a European Public Sphere:** The core democratic deficit isn’t just institutions – it’s the lack of a shared forum where EU decisions are debated.  
    - **Supply this context:** > *“Your press slips were all domestic. That’s the problem: No ‘European public’ exists to hold ministers accountable for EU decisions.”*  

  ---

  ### **Why This Works**  
  - **Press Slips Force the Insight:** Students *discover* blame-shifting is rational (not just hear it).  
  - **Trilogue Hollows Out Voting:** The take-it-or-leave-it moment makes "input" feel meaningless.  
  - **Low-Glamour Regulation:** Allergen labels are boring enough to mirror real EU politics – no grand ideals, just painful trade-offs.  

  **Photocopy Checklist:** Country Sheets ×22, Role Cards ×22, Regulation Drafts ×22, Press Slips ×44, Instructor Master Sheet ×1. Run it Monday – and watch them feel the two-sided trap.
