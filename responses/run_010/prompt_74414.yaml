prompt: |-
  I am in the second year of a graduate programme in the history and philosophy of science, and this term I have been sitting in on a reading group that our mathematics department runs jointly with us: the arrangement is that the mathematicians describe how a result actually gets established in practice, and we are supposed to say what that implies about knowledge. Two things came up repeatedly and I have not been able to stop thinking about them. The first is that almost everything a working mathematician believes outside a fairly narrow speciality rests on results whose proofs they have never read. Textbooks announce that an argument is too long to reproduce; papers describe steps as routine and leave them to the reader; journals publish on the strength of two or three confidential referee reports that nobody else ever sees. The classification of finite simple groups is the extreme case: the proof runs to tens of thousands of pages across several hundred articles by roughly a hundred authors, published mostly between 1955 and 2004; it was announced as complete in 1983, that announcement proved premature because of a gap in the quasithin case, and the gap was not closed until 2004, by a single paper of some twelve hundred pages. In the interval the theorem was being used as a lemma all over the subject. The second is that when Hales produced his proof of the Kepler conjecture, the referees assigned to it reported that they were "99% certain" of its correctness, the result was accepted as a theorem on that basis, and a fully machine-checked version did not appear until 2014.

  What I would like from you is a reconstruction of the theory of testimony this practice presupposes. My supervisor's view is that the answer is obvious — mathematicians simply trust one another, as chemists or historians do — and I think that is too quick, because mathematics advertises itself as the one discipline in which nothing is taken on authority, in which the proof speaks for itself and every reader is invited to check each step. So please begin by asking which of the familiar positions the practice actually commits mathematicians to: the Humean view on which testimony earns credit only as it is corroborated by one's own experience and by the mutual conformity of reports, or the Reidian view on which we have a default, underived entitlement to believe what we are told, defeated only by positive reason for doubt, or something that is neither. Then take up the notion that seems to be doing the real work, namely checkability in principle: the community behaves as though a claim is known provided some competent person could verify it, whether or not anyone does. Can that be a reductionist account at all, and what would have to be true for the merely possible checking of someone else to transmit warrant to my own belief, rather than to theirs? Is the practice quietly substituting something else for testimony — a standing offer, an insurance policy, a division of epistemic labour? I also want you to say whether accepting a theorem on a confessedly probabilistic assurance shows that what happens here is belief at all, or rather acceptance for the purposes of further work, and whether that distinction changes anything about whether testimony can transmit knowledge. Finally, and this matters most to me, please separate what the practice strictly presupposes from what merely sits well with it: identify the points at which it is underdetermined, say what evidence internal to the practice could discriminate between rival accounts that license the same behaviour, and say what would concretely have to change — in refereeing, in textbook writing, in citation habits, in the training of graduate students — if the community adopted the rival view instead.

  Please write this as continuous prose, in the manner of a letter, with no headings, no bullet points, no numbered lists, no bold or italic emphasis and no tables, and aim for somewhere between nine hundred and eleven hundred words. Argue the positions in your own words rather than quoting anyone, and do not end with a bibliography or a list of further reading; naming the classical views and their authors where unavoidable is fine, but the answer should stand on the argument, not on the references.
reasoning: |-
  Hmm, this is a fascinating and complex query about the epistemology of mathematical practice. The user is a graduate student in history and philosophy of science who's been observing how mathematicians rely on unverified proofs and wants to understand the underlying theory of testimony.

  The core tension they're highlighting is between mathematics' self-image as a discipline where "proof speaks for itself" and the reality where mathematicians constantly rely on others' work without verification. The Classification of Finite Simple Groups and Hales' Kepler Conjecture proof are perfect examples showing this gap between ideal and practice.

  The user wants me to reconstruct the implicit theory of testimony in mathematics, specifically asking:
  - Whether it aligns with Humean (corroboration-based) or Reidian (default entitlement) views of testimony
  - How "checkability in principle" functions epistemically
  - Whether probabilistic acceptance constitutes belief or mere acceptance
  - What the practice strictly presupposes versus what's merely compatible
  - How we might test between rival explanations

  I need to address this as a continuous letter-style response between 900-1100 words, without any formatting or references, relying purely on argumentation. The challenge is to balance philosophical rigor with accessibility for someone in HPS.

  Key points I should cover:
  First, mathematics clearly operates beyond strict Humeanism since no individual can personally verify more than a fraction of what they use. But it's not purely Reidian either - mathematicians do demand verifiability in principle and have systems to catch errors.

  The "checkability in principle" seems central. This isn't just about possible verification, but about the existence of a reliable verification infrastructure - referees, textbooks, etc. It's a system that creates what we might call "warrant liquidity" where credibility circulates based on potential verification capacity.

  Regarding belief vs acceptance: the Hales case (99% certainty) suggests mathematicians do form genuine beliefs, but with a distinctive fallback position - they're willing to retract if counterevidence appears. This is belief with high resilience to doubt, maintained by trust in the community's error-correction mechanisms.

  The practice strictly presupposes that proofs are in principle publicly verifiable by competent peers. What's underdetermined is why this suffices - whether it's because verification actually occurs somewhere in the community, or because the mere possibility grounds warrant. We could test this by seeing how mathematics responds when verification becomes practically impossible (like with extraordinarily complex proofs).

  If mathematicians adopted a strict verificationism, practices would change dramatically: journals would require full verifications, textbooks couldn't cite unverified results, and graduate training would emphasize reproducing proofs over creative work. That this doesn't happen shows their implicit epistemology is more nuanced.

  I'll structure the response as a letter addressing these points fluidly, starting with the apparent contradiction between mathematical ideals and practice, then analyzing the testimony model, belief question, and ending with the underdetermination and testable implications.
answer: |-
  My dear colleague,  

  Your observations cut to the heart of a profound tension within mathematical practice, one that reveals much about knowledge as a social and communal endeavour rather than a purely individualistic conquest. The discipline’s self-conception as uniquely authoritative, where proof compels assent through direct engagement, is noble but incomplete. It overlooks the scaffolding of trust upon which the vast edifice rests. To reconstruct the theory of testimony implied here, we must navigate between the Scylla of radical individualism and the Charybdis of blind deference.  

  Let us first dispense with the suggestion that mathematicians operate like chemists or historians, relying on straightforward interpersonal trust. While trust is present, it is not foundational in the same way. The chemist accepts another’s experimental report because replication is resource-intensive; the historian trusts archival interpretation because direct access to the past is impossible. Mathematics, however, promises universal verifiability in principle. This makes its reliance on unread proofs philosophically peculiar. Neither Hume nor Reid offers a perfect fit. The Humean model, demanding corroboration through personal experience or convergence of independent reports, is impractical here. No mathematician personally verifies more than a sliver of the literature; convergence often means multiple authors citing the same unreplicated source. The Reidian alternative—a default entitlement to believe testimony—feels too permissive. Mathematicians do not grant automatic credence to any claim; they demand verifiability as a condition of legitimacy.  

  The real work is done by the notion of *checkability in principle*. The community treats a claim as knowledge not because it *has* been verified, but because it *could* be verified by a competent peer. This is not mere lip service to an ideal; it structures the entire enterprise. Refereeing, textbook curation, and citation norms all presuppose that a sufficient number of qualified individuals *could*, if motivated, trace the argument. The Classification of Finite Simple Groups, for all its sprawling complexity, was deemed valid—even during its “gappy” phase—because the community judged the gaps as *in principle* fillable by existing methods, not mystical leaps. Hales’s referees expressed 99% certainty not as a subjective feeling, but as a probabilistic assessment of the *feasibility* of verification: the proof was dense but followed established logical pathways.  

  But can this “possible checking” transmit warrant to *my* belief? Only if the practice embodies a sophisticated division of epistemic labour. Mathematical knowledge is not stored in individual minds but distributed across the community, sustained by a shared commitment to verifiability. My warrant derives not from trusting Dr. X personally, but from trusting the system that certifies Dr. X’s work as verifiable. This system functions as a kind of epistemic insurance policy: the community collectively guarantees that if a result is challenged, resources (referees, reviewers, specialists) can be mobilised to check it. My belief is warranted because the community maintains the *capacity* for verification, even when idle. This is neither pure reductionism (I need no personal corroboration) nor pure credulity (the system’s reliability is underwritten by historical success in catching errors).  

  What of the 99% assurance? Does this reduce theorem-acceptance to pragmatic “acceptance for further work” rather than genuine belief? The distinction, while theoretically tidy, blurs in practice. Mathematicians *do* believe the results they use—they stake careers on them—but with a distinctive fallback position. Belief is held *provisionally*, contingent on the absence of serious challenge. If a gap emerges (as with the quasithin case), belief suspends until repair is attempted. This is belief underwritten by resilience: the knowledge that the community’s error-correction mechanisms are robust. The probabilistic phrasing reflects not doubt about truth *per se*, but awareness of human fallibility within a system designed to correct it. Testimony transmits knowledge here because the social structure ensures that persistent errors will eventually be detected—a dynamic absent in purely testimonial traditions.  

  Now, to separate strict presuppositions from compatible embellishments. The practice *strictly* presupposes:  
  1. Proofs are *in principle* publicly verifiable by competent peers using shared standards.  
  2. The community maintains sufficient expertise to mobilise verification when needed.  
  3. Institutional mechanisms (refereeing, peer review) reliably filter out unverifiable or egregiously flawed work.  

  What is *underdetermined* is the precise epistemic status of unverified proofs. Does warrant arise from the *actual but distributed* verification (somewhere, someone *could* check it, and this suffices), or from the *mere possibility* itself? The practice tolerates both interpretations. Evidence to discriminate might come from crises. When a major proof is challenged (e.g., Mochizuki’s Inter-universal Teichmüller theory), does the community insist on actual verification by a subset of experts before belief resumes, or does it rest content with abstract possibility? The former suggests distributed verification is doing the work; the latter suggests possibility alone suffices. Current practice leans toward demanding actual verification in contested cases, hinting that “checkability” relies on latent *actual* capacity, not mere logical possibility.  

  If mathematicians adopted the view that only *actual* verification confers warrant, practice would transform radically. Referees would be required to fully verify every line; journals would reject papers with “routine” steps left to the reader; textbooks could only cite results whose proofs were reproduced in full or independently verified by the author; graduate training would emphasise exhaustive proof-replication over creative problem-solving. Collaboration would shrink to tiny circles where mutual verification is feasible. The unmanageable burden would stall progress. Conversely, a shift toward pure Reidian trust would erode standards: “trust me” might replace verifiability, gaps like the quasithin case might be ignored, and the 99% certainty in Hales’s proof might become a norm rather than an exception. The community’s current equilibrium—straining toward the ideal of verifiability while pragmatically relying on distributed labour—reveals its implicit epistemology: warrant flows from the robust *availability* of verification, a social achievement that makes individual belief rationally sustainable.  

  In essence, mathematics does not abandon its self-image; it socialises it. The proof speaks, but through a chorus of potential verifiers. What you witness is not hypocrisy, but the delicate machinery of collective reason.  

  Yours in solidarity of perplexity,  

  A Fellow Traveller in Thought
