  So the payoffs:
          Exit1: 0
          Exit2: 0
          Exit3: 9
          Drive past all: 5

  The expected payoff for a fixed p:

          V(p) = (1-p) * [ (1-p) * ( p*9 + (1-p)*5 ) ] 
                = (1-p)^2 * (9p + 5 - 5p)
                = (1-p)^2 * (4p + 5)

          = (1 - 2p + p^2) * (4p+5)
          = 1*(4p+5) - 2p*(4p+5) + p^2*(4p+5)
          = 4p+5 -8p^2 -10p +4p^3+5p^2
          = 4p^3 -3p^2 -6p +5

  Derivative:

          V'(p) = 12p^2 -6p -6

  Set to zero: 12p^2 -6p -6 = 0 => 2p^2 -p -1 =0.

  Solutions: p = [1 ± sqrt(1+8)]/4 = [1±3]/4 -> p=1 or p=-1/2. 

          p=1: V(1)= (0)^2 * (4+5)=0.
          p=0: V(0)= (1)^2 * (5)=5.

          Now, p=1 is the critical point? But p=0 is an endpoint.

          Check the quadratic: 2p^2 -p -1 =0 -> roots p= [1±3]/4 -> p=1 and p=-1/2. We ignore p=-1/2.

          Now, is p=0 better than p=1? V(0)=5, V(1)=0.

          But what about p in between? Let's try p=0.5:

             V(0.5)= (0.5)^2 * (4*0.5+5) = 0.25 * (2+5)=0.25*7=1.75.

          And at p=0:5, p=0.5:1.75, p=0:5, p=1:0.

          So the maximum is at p=0? But we have to check the derivative:

             V'(p)=12p^2-6p-6.
             At p=0: V'(0)=-6 <0 -> so the function is decreasing at p=0. Therefore, the maximum is at p=0.

          So the optimal plan is p=0: never exit. Then the driver drives past all three exits and gets 5.

  Now, at an exit, if the driver applies the book's method:

          Uniform odds: P(exit1)=P(exit2)=P(exit3)=1/3.

          If he exits: expected payoff = (1/3)*0 + (1/3)*0 + (1/3)*9 = 3.

          If he drives on (and assumes that he will drive on at every subsequent exit?): then he gets 5.

          So 5>3 -> he should drive on.

          And if he does that at every exit, then he never exits and gets 5. This matches the optimal plan.

          Therefore, in this case, the book's procedure works: it recommends driving on, and that yields 5, which is the optimum.

  **Conclusion on the variant:**

  The book's procedure sometimes leads to the optimal plan (when the optimal plan is to always drive on) and sometimes not (when the optimal plan is mixed). In the original three-exit case (with payoff 1 for the hotel), the book's procedure recommended exiting (which yields 0) but the optimal plan yields 1.6875. When we change the hotel payoff to 5, the optimal plan is to drive on (p=0), and the book's procedure also recommends driving on, so it works.

  The flaw in the book's procedure is that it does not account for the fact that the driver must use the same action at every exit. In the case where the optimal action is not pure, the book's procedure (which in the two-exit case recommended exiting) does not consider the mixed strategy and instead recommends a pure action that is best in the moment but not overall.

  Therefore, the book's headline conclusion that only the action-time decision counts is not generally valid. The driver should stick to the ex-ante optimal plan.

  **Final Note:**

  In the two-exit case, if the driver follows the book's action-time advice and exits, he gets 0. If he uses the ex-ante optimal plan (p=1/3), he gets 4/3. So the plan is better.

  In the three-exit case with hotel payoff 1: book's action-time advice (exit) gives 0, while the plan (p=1/4) gives 1.6875.

  In the three-exit case with hotel payoff 5: book's action-time advice (drive on) gives 5, and that matches the plan.

  So the book's procedure is only optimal when the optimal plan is to never exit. Otherwise, it fails.
