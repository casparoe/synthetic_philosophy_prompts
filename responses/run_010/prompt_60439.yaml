  ### Audit of the Book's Paragraph on the Absent-Minded Driver

  The book's treatment of the absent-minded driver problem contains several critical errors, conflations, and overstatements. Below, I break down the paragraph claim by claim, distinguishing what is acceptable, simplified, or incorrect. I then address the book's headline conclusion and test it on your three-exit variant.

  #### Claim-by-Claim Analysis
  1. **"The driver's predicament is vivid proof that expected utility theory breaks down the moment an agent forgets."**  
     - **Verdict:** Overstated and incorrect.  
     - **Explanation:** Expected utility theory does not "break down"; it requires extensions (e.g., behavioral strategies, self-consistent equilibria) to handle imperfect recall. The problem highlights challenges in dynamic consistency and information sets, but it does not invalidate the theory. The modest thesis is that *standard dynamic programming* fails under imperfect recall, not that expected utility theory collapses.

  2. **"In the pub he calculates that he ought to take the second exit with probability one, and, unable to do that, settles for pulling off at random one time in three."**  
     - **Verdict:** Tolerable simplification with a minor flaw.  
     - **Explanation:** The pub calculation (optimal \( p = 1/3 \)) is correct, but the driver never intends to exit at the second exit with probability one. He cannot condition on exit order due to indistinguishability, so mixed strategies are necessary. The simplification ("settles for random") is acceptable for general readers.

  3. **"This calculation is idle, because when he actually arrives at an exit he is no longer choosing a strategy, he is choosing whether to pull off."**  
     - **Verdict:** Incorrect and misleading.  
     - **Explanation:** The pub plan is not "idle." At the exit, the driver *is* implementing the strategy chosen ex ante. Imperfect recall means he cannot tailor actions to specific exits, so the strategy (probability \( p \)) must be state-independent. The book conflates *strategy implementation* with *reoptimization*. The modest thesis is that reoptimization at the exit may conflict with ex ante optimality, but this is a feature of the problem, not proof of idleness.

  4. **"By symmetry he should take it to be equally likely that this is the first exit or the second."**  
     - **Verdict:** Incorrect arithmetic and reasoning.  
     - **Explanation:** The probability of being at the first or second exit depends on the strategy \( p \), not symmetry alone. The correct odds (using Bayes' theorem) are:  
       - Probability at first exit: \( \frac{1}{1 + (1 - p)} = \frac{1}{2 - p} \).  
       - Probability at second exit: \( \frac{1 - p}{2 - p} \).  
       Only if \( p = 0 \) are these equal (both \( 1/2 \)). For \( p = 1/3 \), the odds are \( \frac{1}{2 - 1/3} = \frac{3}{5} \) (first exit) and \( \frac{2/3}{5/3} = \frac{2}{5} \) (second exit). The book ignores strategy-dependent probabilities, leading to flawed calculations.

  5. **"Pulling off now has an expected payoff of 2, and driving on has less, so what to do is plain: exit."**  
     - **Verdict:** Incorrect arithmetic and incomplete reasoning.  
     - **Explanation:** Using the book's flawed 50-50 odds:  
       - Exit payoff: \( 0.5 \times 0 + 0.5 \times 4 = 2 \).  
       - Drive-on payoff: If at first exit, driving on leads to the second exit (payoff 4 if exited, but the driver's future action is unspecified). The book assumes driving on at the first exit yields 4 (by exiting at the second), and at the second exit yields 1, so \( 0.5 \times 4 + 0.5 \times 1 = 2.5 \). This contradicts the claim that driving on "has less" than 2. If instead, the book assumes the driver will apply the *same* exit-time reasoning recursively, driving on yields \( 0.5 \times 2.5 + 0.5 \times 1 = 1.75 \) (still >2). Either way, the arithmetic is inconsistent. Correct odds (\( p \)-dependent) show exiting at the exit yields \( \frac{3}{5} \times 0 + \frac{2}{5} \times 4 = 1.6 \), worse than the ex ante optimal 1.333.

  6. **"The driver is dynamically inconsistent — his preferences shift as he goes along."**  
     - **Verdict:** Conflation and misuse of technical term.  
     - **Explanation:** "Dynamically inconsistent" typically describes changes in preferences over time due to time discounting or changing tastes (e.g., dieting resolutions). Here, the conflict arises from *imperfect recall* and *information sets*, not preference shifts. The driver has fixed payoffs; the issue is reoptimization under informational constraints. The modest thesis is that the *ex ante optimal strategy* may not be *action-optimal* when re-evaluated at the exit, but this is a property of the information structure, not dynamic inconsistency in the standard sense.

  7. **"What the case shows is that only the decision taken at the moment of action is real; the plan drawn up in the pub is a fiction... any theory that evaluates agents by their plans... is evaluating something that never happens."**  
     - **Verdict:** Overstated and incorrect.  
     - **Explanation:** The ex ante plan is not a "fiction"; it is a commitment device. Evaluating only action-time decisions ignores strategic reasoning under uncertainty and leads to suboptimal outcomes (e.g., exiting always yields 0, worse than the 4/3 plan). The literature (e.g., Piccione-Rubinstein) debates solutions but does not dismiss planning. The book inflates a problem-specific challenge into a sweeping rejection of planning.

  #### Does the Book's Headline Conclusion Survive Correction?
  **No.** The book's exit-time reasoning (based on symmetric odds) is flawed, and its prescription ("exit") yields a payoff of 0, worse than the ex ante optimum of 4/3. A defender of the "two-problems" reading (ex ante vs. action-time) would respond:
  - The book's last two sentences confuse *reoptimization* with *optimality*. Action-time decisions under imperfect recall must respect the information set: the driver cannot condition on exit order, so the strategy (probability \( p \)) must be uniform across exits. The ex ante plan optimizes this constraint; reoptimizing naïvely at the exit ignores it.
  - The exit-time verdict ("exit is better") relies on incorrect odds and fails to account for the driver's future actions under the same information set. If the driver uses the book's action-time logic as a *standing policy* (always exit), it leads to 0, validating the ex ante plan's superiority.

  #### Testing the Book's Prescription: Three-Exit Variant
  **Setup:** Three indistinguishable exits. Payoffs: exit at first or second: 0, exit at third: 9, drive past all: 1. Driver chooses a uniform \( p \) (probability to exit) at each exit.

  ##### Step 1: Optimal Ex Ante Plan and Value
  The expected payoff \( V(p) \) is:
  \[
  V(p) = \text{payoff scenarios}:
  \]
  - Exit at first: prob \( p \), payoff 0.
  - Exit at second: prob \( (1-p)p \), payoff 0.
  - Exit at third: prob \( (1-p)^2 p \), payoff 9.
  - Drive past all: prob \( (1-p)^3 \), payoff 1.
  \[
  V(p) = 0 \cdot p + 0 \cdot (1-p)p + 9 \cdot (1-p)^2 p + 1 \cdot (1-p)^3.
  \]
  Simplify:
  \[
  V(p) = 9p(1-p)^2 + (1-p)^3 = (1-p)^2 [9p + (1-p)] = (1-p)^2 (1 + 8p).
  \]
  Maximize \( V(p) \):
  - Derivative: \( V'(p) = -2(1-p)(1+8p) + (1-p)^2 \cdot 8 \).
  - Set to 0: \( (1-p)[-2(1+8p) + 8(1-p)] = 0 \).
  - Solutions: \( p = 1 \) (invalid, \( V(1) = 0 \)) or \( -2 -16p + 8 - 8p = 6 - 24p = 0 \) → \( p = \frac{6}{24} = \frac{1}{4} \).
  \[
  V\left(\frac{1}{4}\right) = \left(1 - \frac{1}{4}\right)^2 \left(1 + 8 \cdot \frac{1}{4}\right) = \left(\frac{3}{4}\right)^2 (1 + 2) = \frac{9}{16} \cdot 3 = \frac{27}{16} = 1.6875.
  \]
  **Optimal ex ante plan:** \( p = \frac{1}{4} \), value \( \frac{27}{16} \).

  ##### Step 2: Driver's Odds at an Exit
  At an exit, the driver updates beliefs using Bayes' theorem, given the strategy \( p \):
  - Probability of being at first exit: \( \frac{P(\text{reach first})}{P(\text{reach any exit})} = \frac{1}{1 + (1-p) + (1-p)^2} \).
  - Probability of being at second exit: \( \frac{1-p}{1 + (1-p) + (1-p)^2} \).
  - Probability of being at third exit: \( \frac{(1-p)^2}{1 + (1-p) + (1-p)^2} \).

  **What determines these odds?** The driver's strategy \( p \) (since it affects the likelihood of reaching later exits) and the prior probabilities (equal chance of encountering any exit, but modified by survival probability).

  ##### Step 3: Book's Procedure at the Exit
  - **Book's logic:** Assign symmetric odds (1/3 each, ignoring \( p \)).  
    Exit payoff: \( \frac{1}{3} \times 0 + \frac{1}{3} \times 0 + \frac{1}{3} \times 9 = 3 \).  
    Drive-on payoff: If driver assumes future exits will use the *same* action (per book's two-exit case), then driving on leads to:  
    - At first exit: go to second exit (payoff 0 if exited, or continue).  
    - At second exit: go to third exit (payoff 0 or 9/1).  
    - At third exit: payoff 1 if drive on.  
    With symmetric odds, driving on yields:  
    \[
    \frac{1}{3} \times (\text{payoff from second exit onward}) + \frac{1}{3} \times (\text{payoff from third exit onward}) + \frac{1}{3} \times 1.
    \]
    But the book's two-exit case *assumed* driving on at the first exit leads to 4 (by exiting at second), so analogously:  
    - If at first exit: driving on → reach second exit → exit there (payoff 0).  
    - If at second exit: driving on → reach third exit → exit there (payoff 9).  
    - If at third exit: driving on → payoff 1.  
    This is inconsistent (why exit at second/third but not now?). If the driver applies the book's action-time logic recursively:  
    - At any exit, exiting gives 3, driving on gives the average of future outcomes.  
    - This leads to circularity, but if we assume the driver will *always drive on* after deciding once:  
      - Drive-on payoff: \( \frac{1}{3} \times 1 + \frac{1}{3} \times 1 + \frac{1}{3} \times 1 = 1 \) (since driving on at all exits yields 1).  
      - Exit payoff: 3 > 1, so book recommends **exit**.

  - **Outcome if adopted as standing policy:** Always exit → payoff 0 (exits at first exit).  
    **Value:** 0 (worse than ex ante optimum 1.6875).

  **Does the book's procedure survive?** No. It recommends exiting, yielding 0, which is suboptimal. The book's symmetric odds and isolated action-time decision ignore the strategy-dependent probabilities and lead to a worse outcome.

  ##### Revised Exit-Time Reasoning
  To avoid failure, the driver must recognize the information set: whatever action chosen must apply uniformly at all exits. Thus, at the exit, the driver should reoptimize \( p \) for *all* exits (not just the current one). This yields the same \( p = \frac{1}{4} \) and \( V = 1.6875 \), aligning with ex ante optimality.

  #### Modified Variant: Hotel Payoff = 5
  Change drive-past-all payoff to 5. Recalculate:
  - **Ex ante optimal plan:**
    \[
    V(p) = 9p(1-p)^2 + 5(1-p)^3 = (1-p)^2[9p + 5(1-p)] = (1-p)^2(5 + 4p).
    \]
    Derivative: \( V'(p) = -2(1-p)(5+4p) + (1-p)^2 \cdot 4 \).  
    Set to 0: \( (1-p)[-10 -8p + 8 + 4p] = (1-p)(-2 -4p) = 0 \).  
    Solutions: \( p = 1 \) (\( V = 0 \)) or \( p = 0 \) (\( V = 5 \)).  
    Since \( V'(p) < 0 \) for \( p \in [0,1) \), maximum at \( p = 0 \).  
    **Optimal plan:** Never exit (\( p = 0 \)), value 5.

  - **Book's procedure at exit:**  
    Symmetric odds: exit payoff = 3, drive-on payoff = 5 (if assume always drive on). Since 5 > 3, book recommends **drive on**.  
    **Outcome as standing policy:** Always drive on → payoff 5.  
    This matches the ex ante optimum.

  **Diagnosis:** The book's procedure works here because its recommendation (drive on) aligns with the ex ante optimal strategy. However, this is coincidental; when the optimal strategy is mixed (e.g., original three-exit case with hotel payoff 1), the book fails. The underlying issue remains: the book ignores strategy-dependent probabilities and uniform strategy constraints.

  ### Final Summary
  - **Book's flaws:** Misrepresents probabilities, misapplies dynamic inconsistency, overstates breakdown of utility theory, and recommends a suboptimal action-time procedure.
  - **Why the exit-time argument is not decisive:** It violates the information set constraint (uniform strategy) and uses incorrect beliefs. The ex ante plan optimizes within constraints.
  - **Variant outcome:** The book's procedure fails when the optimal strategy is mixed but works when pure (e.g., hotel payoff 5). This inconsistency shows its unreliability.
  - **Recommendation for your session:** Emphasize that the ex ante plan matters because it respects the information structure. The driver's "shift" is not preference-based but a failure to account for strategy-dependent beliefs at the exit. Use the three-exit variant to demonstrate the book's prescription can lead to 0 vs. 1.6875, then contrast with the 5-payoff case to show when it coincidentally works. This highlights the need for consistent strategy optimization under imperfect recall.
