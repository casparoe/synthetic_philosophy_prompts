prompt: |-
  Take the two Irish referendums on the Treaty of Lisbon. In June 2008 Irish voters rejected it by roughly 53 to 47; in October 2009 they approved it by roughly two to one, after the European Council issued a decision addressing Irish concerns on taxation, on security, defence and neutrality, and on the right to life, family and education, and agreed that every member state would retain one Commissioner. The treaty text itself was not amended — the concessions took the form of legally binding clarifications of a text that already stood. Ireland had already run this script once, with Nice.

  I want the pair analyzed through three readings of what a referendum does, which I'll define so we're working from the same apparatus. On the *instrument* reading, a referendum measures a popular judgment that exists independently of the vote, so any given result is an estimate carrying error terms — information, salience, timing, framing; a second vote under better conditions is simply the better reading, and the first was noise. On the *act* reading, a referendum does not report a will, it constitutes one; the later vote is not more accurate, it is merely later, and supersedes. On the *authorization* reading, what matters is whether the electorate could knowingly hand over decisional authority on the question actually put — a test that can fail in both directions: voters who reject a text they admit not understanding have authorized nothing, but neither have voters who accept it on the strength of clarifications that restate what the text already said.

  For each reading, say what it makes of the 2008 No and the 2009 Yes, and how it explains the fact that everyone — the No campaign included — treated the second vote as settling the matter. Then say where each reading breaks. Keep three features in view: post-poll surveys found the No reasons widely dispersed, the largest single category being unfamiliarity with the treaty rather than any substantive objection; the unanimity requirement means one electorate's ballot functions as a veto over twenty-six others; and by 2009 the implicit choice set had narrowed to Lisbon or something worse. Finish by saying which reading the episode actually favors, and whether it shows that a referendum of this kind can have a *result* at all in the sense each reading assumes.

  Lead with your verdict in a single sentence, and keep the whole thing under 900 words.
reasoning: |-
  Hmm, the user wants me to analyze the two Irish Lisbon Treaty referendums through three specific theoretical lenses. They've defined three readings of what a referendum does: instrument (measures preexisting opinion), act (creates political will), and authorization (tests informed delegation of authority). 

  I need to apply each reading to both the 2008 rejection and 2009 approval, explain why everyone accepted the second vote as final, identify where each theory breaks down, and factor in three key features: dispersed No reasons, Ireland's veto power, and the narrowed choice set in 2009. The conclusion must judge which reading fits best and whether this case shows referendums can produce clear "results" at all.

  The user seems deeply knowledgeable about EU politics and democratic theory - probably an academic or policy analyst. Their structured query suggests they're testing theoretical frameworks against a real-world case where voters reversed themselves after institutional concessions. The underlying tension appears to be about democratic legitimacy in complex governance: Can popular votes meaningfully decide technical treaties? Does reversal indicate error correction or coercion?

  Breaking this down: For the instrument reading, the 2008 vote was noisy measurement error corrected in 2009. But this struggles with the veto power and changed context - was it really the same "signal" being measured twice? The act reading sees both votes as equally valid acts of will, with the later one simply superseding. But this ignores why the second vote was treated as more legitimate. The authorization reading focuses on whether voters could delegate authority knowingly. The 2008 No voters arguably failed this test by rejecting what they didn't understand, while the 2009 Yes might pass due to clarifications - yet those clarifications didn't change the treaty text.

  The key complications are: 1) Post-poll data showing confusion drove the initial No more than substantive objections, 2) Ireland's unique power to stall 26 other states, and 3) The 2009 choice being framed as "Lisbon or chaos." These make it hard to view either vote as purely expressive. The authorization reading seems strongest because it grapples with the competence question, but even it stumbles on the paradox that voters accepted clarifications of unchanged text.

  Ultimately this case suggests referendums on complex treaties may not produce clean "results" in any theoretical sense. The second vote settled matters politically, but its democratic purity is questionable under all frameworks. I'll structure the response to show each theory's insights and failures systematically before concluding.
answer: |-
  **Verdict:** The Lisbon sequence best fits the authorization reading by exposing how referendums on complex treaties struggle to achieve genuine delegation of power due to voter unfamiliarity and shifting context, yet the authorization reading itself fractures on the paradox of accepting unchanged text via "clarifications."

  **Analysis:**

  1.  **Instrument Reading:**
      *   **View of 2008/2009:** The 2008 No was a poor measurement of latent Irish opinion, distorted by low information, salience, and framing (e.g., misleading claims). The 2009 Yes, achieved after a massive information campaign and specific assurances, is the accurate reading of the underlying "true" Irish position.
      *   **Settlement:** It settled the matter because the second vote corrected the measurement error, revealing the actual (pro-Lisbon) majority will obscured in 2008. The first was noise.
      *   **Breaks Down:** It struggles with the dispersed nature of the 2008 No vote (largely *unfamiliarity*, not coherent substantive objection), making it hard to define a single latent opinion being measured. It ignores the fundamental shift in context: the 2009 choice wasn't simply "Lisbon again," but "Lisbon + assurances" vs. the *worse* option of isolating Ireland, blocking the EU, and facing economic uncertainty. The unanimity requirement meant Ireland wasn't just measuring its preference, it was wielding a veto over 26 others, a power dynamic absent from simple opinion measurement.

  2.  **Act Reading:**
      *   **View of 2008/2009:** Both votes are equally valid, constitutive acts of popular will. The 2008 No *was* the sovereign Irish will at that moment; the 2009 Yes was a *new* sovereign act, superseding the previous one. The later act takes precedence.
      *   **Settlement:** It settled the matter because the most recent sovereign act (Yes) replaced the prior act (No). The sequence demonstrates the electorate's right to change its mind.
      *   **Breaks Down:** It fails to explain *why* the second vote was universally accepted as definitive while the first wasn't. It ignores the specific *content* and *context* driving the reversal – the assurances and the narrowed choice set ("Lisbon or worse"). It trivializes the process by treating the reversal as a simple change of heart, ignoring the intense pressure (veto power, economic risks) and the specific concessions extracted, which suggest the second act wasn't formed in a vacuum but under significantly constrained and incentivized conditions.

  3.  **Authorization Reading:**
      *   **View of 2008/2009:** The 2008 No likely *failed* the authorization test. Voters rejecting a text they largely admitted not understanding could not knowingly delegate authority based on it. The 2009 Yes *potentially passed*: the legally binding clarifications addressed specific stated concerns (tax, neutrality, Commissioner), arguably enabling a more informed delegation regarding the *specific powers* the treaty conferred, even if the text remained unchanged.
      *   **Settlement:** It settled the matter because the 2009 vote, with clarifications addressing the previously cited reasons for confusion and objection, met the threshold for valid authorization that the 2008 vote did not. The concessions transformed the act into plausible informed consent.
      *   **Breaks Down:** Its core weakness is the paradox of the clarifications. If they merely restated existing treaty meaning (as claimed), then voters authorizing based on them were authorizing the *original, unamended text* they previously rejected, often *because* they didn't understand it. This raises the question: did the clarifications genuinely enable better understanding, or merely provide politically palatable reassurances for a text voters still didn't fully grasp? The dispersed 2008 No reasons (mostly unfamiliarity, not specific objections the clarifications targeted) and the "Lisbon or worse" pressure further complicate the notion of pure, informed authorization.

  **Episode's Verdict & "Result":**
  The episode most strongly *favors the authorization reading*. It explicitly centers the crisis of voter unfamiliarity, the need for specific assurances to enable delegation, and the unique legitimizing power attributed to the second vote *because* of those assurances. The instrument reading downplays the changed context and veto power. The act reading ignores the qualitative difference between the two votes driven by concessions and pressure.

  However, the episode also **reveals the fragility of achieving a clear "result" in any reading's assumed sense**:
  *   The *instrument* reading's "true signal" is elusive due to shifting context and the veto's distorting effect.
  *   The *act* reading's pure constitutive power is undermined by the concessions and pressure making the second act qualitatively different and contextually coerced.
  *   The *authorization* reading's requirement for informed delegation is critically wounded by the paradox of unchanged text being authorized only after "clarifications" restating its meaning – suggesting the "result" depended more on political reassurance than substantive new understanding.

  Ultimately, the second vote settled the matter *politically* due to the concessions and narrowed choice set, but it demonstrates that referendums on complex international treaties, especially under unanimity rules creating veto power, struggle to produce a democratically unambiguous "result" under any rigorous theoretical framework. The authorization reading comes closest to explaining the process but highlights the inherent difficulty of the task.
