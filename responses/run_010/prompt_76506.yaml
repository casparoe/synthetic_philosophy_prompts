answer: |-
  **Grading & Justification**  
  Band: 9–12 (Reaches a defensible conclusion but travels through two or more substantive errors)  
  Exact Mark: **11/20**  
  Why: The answer correctly analyzes the documentary floor and composite license (showing sound application) and offers a coherent structural thesis about duties/permissions. However, it contains **two substantive errors**: (1) a fundamental misreading of the silence obligation, and (2) a significant distortion of retroactive consent. These errors are partially offset by strong handling of clauses 1 and 2. An 11 (not 10) reflects the quality of the core analysis where the apparatus is correctly engaged; a 12 is precluded because both errors are load-bearing to the conclusion.

  ---

  **Point-by-Point Assessment**  

  1.  **"The apparatus is best read as duties constrained by permissions"**  
      *Right*. Correctly identifies the emphasis on obligations in clauses 1, 3, and 4 versus the permission in clause 2.  
      *(Classification: Accurate apparatus description)*  

  2.  **"The tollkeeper is inside [the documentary floor's] scope... inventions... permitted, provided they are disclosed. They are disclosed."**  
      *Right*. Accurately applies clause 1: the tollkeeper is named, the record establishes nothing about her inner life/actions beyond tolls, so invention is permitted *with* disclosure (which occurred).  
      *(Classification: Correct application)*  

  3.  **"The boatmen... are outside [the documentary floor]"**  
      *Right*. Correctly notes clause 1 applies only to named persons; initials are insufficient to bind the floor.  
      *(Classification: Correct application)*  

  4.  **"The fusion... is a use of the composite license... proviso is satisfied... No individual boatman is thereby said to have killed anyone"**  
      *Right*. Correctly applies clause 2: fusing minor figures (initials in tonnage books) is permitted. The proviso is satisfied because the murder is assigned to the *composite*, not to any source individual.  
      *(Classification: Correct application; Strong point)*  

  5.  **"The silence obligation... presupposes that the silence has a shape... Where... someone... left no trace at all... there is nothing to imagine into, and the obligation lapses... owes only the acknowledgment"**  
      ***Wrong***. Directly contradicts clause 3 ("the novelist is obliged... to imagine into it" regardless of verifiability or the *degree* of silence, especially for the "illiterate," "enslaved," "laboring dead"). The clause mandates *imagination*, not mere acknowledgment, precisely where traces are absent.  
      *Should have written*: The silence obligation *requires* the novelist to imagine into structural silences (like the tollkeeper's unwritten life), even in the absence of any personal trace. The clause explicitly targets those who "left no trace" (illiterate, enslaved, unrecorded women, laboring dead).  
      *(Classification: Substantive error about the apparatus as stated; Load-bearing: Undermines application to the tollkeeper and the clause's purpose)*  

  6.  **"The general defense... Aristotle's... tollkeeper is not a particular... invention is licensed by that generality... why the silence obligation cannot be unlimited"**  
      *Underdeveloped/Partially Wrong*. The Aristotelian point is tangential and misapplied. Clause 3 mandates imagination *specifically* for the structurally excluded (like the tollkeeper), making her a *precise* object of the obligation, not a justification for limiting it via lack of trace.  
      *(Classification: Error of reasoning; Local: Compounds the misreading of clause 3 but conclusion rests on the misreading itself)*  

  7.  **"Retroactive consent adds the least... Since the dead cannot be wronged... consent modeled... has no bearer... best read as a duty owed to survivors... binds only where there are identifiable survivors... applies to [the tollkeeper]... does not apply to the boatmen"**  
      ***Wrong & Underdeveloped***. Fundamentally misreads clause 4. The clause explicitly states consent is modeled on the *subject's* values, *not* owed to survivors ("the novelist must model the consent... taking the subject's own values as the standard... applies whether or not descendants survive"). Its purpose is ethical relation to the *subject*, not protecting descendants. The existence of descendants is irrelevant per the clause.  
      *Should have written*: Retroactive consent requires the novelist to consider whether the invented actions (miscarriage, theft) align with what a reasonable person *in the tollkeeper's position*, judging by *her* likely values (based on her context, not the novelist's), would consent to. This applies irrespective of living descendants. For the boatmen (as a composite), modeling consent is less direct but the clause might still prompt consideration of the values of boatmen in that position regarding the murder.  
      *(Classification: Substantive error about the apparatus as stated; Load-bearing: Distorts the clause's core function and its universal applicability)*  

  8.  **"duties constrained by permissions... duties that survive scrutiny are those owed to the living... documentary floor and silence obligation... instruments for discharging [duties to the living]"**  
      *Wrong (Conclusion driven by prior errors)*. While the structural thesis (duties constrained by permissions) is defensible based on the clause wording, the conclusion that only duties to the living "survive scrutiny" and that clauses 1 & 3 serve *them* is incorrect. It stems directly from the misreadings of clauses 3 (silence obligation lapses without trace) and 4 (retroactive consent is for survivors). The apparatus establishes duties owed *to the past/subjects* (clauses 3 & 4) and *to truth/record* (clauses 1 & 2).  
      *(Classification: Error of reasoning; Load-bearing: Conclusion depends entirely on the misreadings of clauses 3 and 4)*  

  **Merit of Proposed Revision:** The suggestion to limit retroactive consent to cases with identifiable survivors has practical appeal but fundamentally contradicts the clause's stated purpose (modeling the *subject's* hypothetical consent regardless of descendants). It significantly weakens the ethical stance towards subjects without traceable lineage.  

  ---

  **Feedback for the Student**  

  Your analysis of the documentary floor and composite license is sharp and correctly applied to the case study. You clearly grasp the core function of permissions and duties within the apparatus and present a coherent structural argument. However, your interpretation of the silence obligation misses its crucial mandate: it *requires* imaginative entry into structural silences *precisely* when the archive offers "no trace at all" (e.g., the tollkeeper). The clause explicitly names "the illiterate, the enslaved, women whose letters were not kept" as subjects of this duty. Similarly, retroactive consent is modeled on the *subject's* values, not owed to survivors; its applicability does not depend on traceable descendants. The apparatus aims to govern the novelist's ethical relationship with the historical subjects themselves, not just the living. Focus on adhering strictly to the clause wording, especially where it counters intuitive assumptions about obligation and consent. Your strength lies in close textual application – ensure it extends to all clauses equally.
