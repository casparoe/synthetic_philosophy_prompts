answer: |-
  ## Proposal: Keynesian Weight as Modal Stability – A Foundation for Normative Risk Reporting

  **Submitted by:** [Your Name/Title], Foresight Unit, National Infrastructure Regulator  
  **Proposed Duration:** 18 Months  
  **Supervising Institution:** [Your University/Affiliation, if applicable]  
  **Date:** October 26, 2023

  **1. The Problem & Core Question**
  Our office's annual register of low-probability, high-consequence (LP-HC) infrastructure risks relies on a problematic duality: a point probability estimate accompanied by an unjustifiable "confidence" figure. This practice obscures a crucial distinction highlighted by Keynes in his *Treatise on Probability*: the difference between the *probability* an event is assigned given the evidence, and the *weight* of that evidence supporting the assignment. Probability concerns the balance of arguments for/against the event; weight concerns the *robustness* of that balance judgment itself. Keynes argued weight is irreducibly comparative and non-numerical, increasing as evidence accumulates even if the probability remains unchanged.

  This project addresses the central question: **Can Keynesian weight be explicated as a distinct, normatively significant dimension for risk judgment reporting, avoiding collapse into existing probabilistic constructs, and thereby provide a foundation for more meaningful "confidence" reporting in tools like our LP-HC risk register?**

  A determinate answer would settle:
  *   Whether "weight" genuinely adds a unique normative dimension beyond probability and existing uncertainty representations.
  *   Whether a principled, non-arbitrary method exists for assessing and reporting comparative weight in practical risk assessment contexts.
  *   Whether Keynes's emphasis on evidence holism and non-aggregativity is essential to capturing weight.

  **2. Why Existing Positions Leave the Question Open**
  The literature offers potential reductions of weight, but none fully capture its distinctiveness as conceived by Keynes, particularly concerning normativity for judgment reporting:

  *   **Weight as Imprecise Probability Spread:** Interpreting weight as the width of an interval (e.g., [0.3, 0.7]) conflates weight with *ambiguity* or *indeterminacy* in probability. While wider intervals often *correlate* with lower weight, Keynesian weight can change (increase) *without* altering the point probability *or* the interval bounds if the new evidence strengthens the existing balance without shifting it. Weight concerns the *security* of the judgment within its bounds, not just the bounds themselves. Imprecise probability models weight as a *state* of knowledge, not a distinct *property* of the evidence relation.
  *   **Weight as Second-Order Distribution:** Modeling weight as a distribution over first-order probabilities (e.g., a Beta distribution) reduces it to a specific type of *higher-order uncertainty*. This quantifies uncertainty *about* the probability, but Keynesian weight is about the *adequacy* or *comprehensiveness* of the evidence base supporting *any* specific probability assignment. It addresses the potential for *surprise* from *unconsidered* evidence, not just dispersion in considered possibilities. Reporting a second-order distribution is also computationally demanding and opaque for LP-HC registers.
  *   **Weight as Quantity of Evidence:** Simply counting evidence items ignores Keynes's core insight: evidence is not atomistic and additive. The *relevance* and *interconnectedness* of evidence depend holistically on the existing body. Adding irrelevant evidence increases "quantity" but not Keynesian weight. Conversely, a single, highly relevant and reliable piece of evidence can confer significant weight. Weight is qualitative and relational, not quantitative.

  The imprecise probability literature addresses related phenomena (ambiguity, indeterminacy) but has not resolved the specific normative status of Keynes's holistic, comparative weight as a distinct dimension relevant to the *warrant* of a probability judgment for reporting purposes.

  **3. The Hypothesis: Weight as Modal Stability**
  This project proposes and rigorously tests a novel explication: **Keynesian weight is best understood as the *modal stability* of a probability judgment.** Specifically, *weight is the degree to which the assigned probability would remain invariant (or within a pragmatically defined tolerance) under the addition of further admissible evidence*. "Admissible evidence" is defined relative to the current evidence base and the hypothesis in question, respecting Keynes's holism – what counts as admissible depends on the whole context.

  This interpretation directly addresses Keynes's resistance to aggregation: stability under *admissible* additions captures the *resilience* of the judgment to *relevant* new information, reflecting the comprehensiveness of the underlying evidence base. High weight means the judgment is robust to learning more *within the relevant domain*; low weight means it is fragile, likely to shift significantly.

  **4. Method: Formal Exegesis & Normative Modeling**
  An 18-month, integrated formal and exegetical approach is essential to avoid the pitfalls of pure history (lacking normative bite) or pure decision theory (lacking fidelity to the concept's intended meaning and practical reporting context).

  *   **Months 1-4: Foundational Analysis & Literature Synthesis:**
      *   Deep exegetical study of Keynes's *Treatise*, focusing on weight, evidence holism, comparability, and non-numericity.
      *   Critical review of existing formalizations/reductions of weight (imprecise prob, second-order, quantitative).
      *   Analysis of contemporary risk reporting frameworks and their struggles with "confidence."
  *   **Months 5-10: Formal Development of Modal Stability:**
      *   Define "admissible evidence" formally within a structured evidence framework (e.g., utilizing partitions, salient variables, or relevant possibility spaces).
      *   Develop a formal model of modal stability: Define probability functions conditioned on evidence bases. Formalize the counterfactual: "P(h|e) remains within tolerance δ under addition of any admissible evidence e'."
      *   Investigate properties: How does stability relate to evidence coherence, relevance, and redundancy? Can stability be partially ordered? Does it align with Keynes's comparative claims?
      *   **Stress-Test:** Rigorously compare the model against the three collapse candidates. Can stability be *reduced* to an interval width, a second-order variance, or evidence count? Under what assumptions? What unique properties does it exhibit?
  *   **Months 11-15: Normative Application & Reporting Framework:**
      *   Assess the normative force: Does modal stability provide a genuine reason to distinguish judgments with the same probability? Does it track epistemic virtues like robustness and comprehensiveness relevant for LP-HC risk reporting?
      *   Develop a practical reporting standard prototype: How can comparative stability judgments be elicited and communicated meaningfully (e.g., qualitative tiers: "Low Stability/Fragile," "Medium," "High Stability/Robust"; or simple ordinal rankings within a risk class)? Design principles for avoiding pseudo-quantification.
      *   Conduct preliminary validation: Apply the prototype framework to a small set of historical or hypothetical LP-HC infrastructure risks to assess feasibility and perceived utility.
  *   **Months 16-18: Integration, Writing & Dissemination:**
      *   Synthesize findings into a cohesive argument.
      *   Finalize the academic paper(s) and the practical reporting guideline.
      *   Prepare internal presentation for the Foresight Unit/Regulator.

  **5. Deliverables & Success Criteria**
  *   **Primary Deliverables:**
      1.  **Peer-Reviewed Journal Article:** Presenting the modal stability explication, its formal model, the critique of collapse candidates, and its normative justification.
      2.  **Practical Reporting Standard Prototype:** A draft guideline for incorporating comparative weight-as-stability assessments into the regulator's LP-HC risk register, including elicitation methods and communication formats.
  *   **What Success Looks Like:**
      *   A **Representation Result:** Demonstrating formally that modal stability captures essential features of Keynesian weight not reducible to the collapse candidates under plausible assumptions about evidence admissibility and holism.
      *   **Normative Vindication:** Arguing convincingly that stability provides a distinct, epistemically significant reason for differentiating risk judgments beyond probability, relevant for decision-makers needing to gauge judgment resilience.
      *   **Actionable Framework:** A reporting standard prototype deemed credible, feasible, and a significant improvement over current "confidence" figures by both philosophical and practitioner review within the regulator.
  *   **What Failure Looks Like:**
      *   The modal stability model demonstrably collapses into one of the existing candidates under scrutiny.
      *   The concept of "admissible evidence" proves too vague or context-dependent to formalize usefully.
      *   The resulting reporting standard is judged no less arbitrary or no more actionable than the current practice.
      *   Key exegetical analysis shows the modal view fundamentally misreads Keynes.

  **6. Realism of Horizon & Scope Management**
  **18 months is ambitious but realistic** given the focused scope, provided progress is monitored rigorously. Key components prone to ballooning:

  *   **Defining Admissible Evidence:** This is the critical conceptual and formal hurdle. The project will constrain this by focusing on *relative admissibility* within specific, structured risk contexts (like infrastructure domains) rather than seeking a universal definition. Initial formalization will use simplified models (e.g., fixed variable sets).
  *   **Formal Model Complexity:** The project prioritizes conceptual clarity and normative relevance over maximal mathematical generality. The model will start simple, focusing on invariance under discrete evidence additions relevant to the reporting context, not continuous learning processes.
  *   **Exegetical Depth:** While Keynes is the starting point, the project's goal is normative explication for application, not exhaustive historical scholarship. Exegesis will be tightly focused on passages directly relevant to weight and evidence holism.
  *   **Empirical Validation:** Extensive case studies or large-scale elicitation are beyond scope. Validation will be limited to proof-of-concept application and internal expert feedback.

  **Conclusion**
  The current practice of reporting ungrounded "confidence" figures alongside point probabilities for LP-HC risks is epistemically hollow. Keynes's concept of weight offers a promising avenue for reform, but only if it can be rescued from collapse into existing probabilistic constructs. This project proposes and rigorously tests a novel explication of weight as *modal stability* – the resilience of a probability judgment to relevant new evidence. By combining formal modeling sensitive to Keynes's holism with practical norm-setting for risk reporting, it aims to deliver both a theoretical representation theorem and a defensible, actionable reporting standard prototype. Success would provide our foresight unit, and similar bodies, with a principled foundation for distinguishing robust from fragile risk judgments, significantly enhancing the utility of risk registers for strategic decision-making. The 18-month timeline is demanding but achievable with disciplined focus on the core questions and deliverables.

  ---
