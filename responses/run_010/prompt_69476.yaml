prompt: |-
  Last week I spent the better part of an evening arguing with a friend about whether the Roman Empire fell, and we came away less interested in our disagreement about the facts — we agree on nearly all of them — than in a peculiar thing that kept happening to the argument itself. I have been trying to describe that thing to other people ever since and have not managed it, so I want to know whether it has a name.

  The exchange went roughly like this. I said that the Western Empire ended in the fifth century: the last emperor was deposed, and the imperial administration, the standing army, and the tax system in the West disappeared with him. My friend said that this was precisely what was in question — the Empire did not end, it continued at Constantinople for another thousand years, and in the West the church, the law, and Latin carried on. I replied that a Greek-speaking eastern state ruling none of the western provinces was not the same thing, and that its self-description as Roman was a courtesy. My friend replied that the church, the law, and Latin carrying on was likewise not the Empire carrying on, but at most the Empire's effects on something else. At that point I noticed that we had each rejected the other's continuity claim while accepting our own, and — this is the part I cannot name — that neither of us had stated a criterion in advance that would decide which continuations count. When my friend finally produced one, to the effect that what persists is the legal and administrative order rather than the territory or the reigning house, and I applied it consistently, it disposed of half of his own case: the eastern order that persisted was recognizably Roman in law and administration, but the western church was not an institutional continuation of anything, so the limb of his reply he cared most about was the one his criterion excluded. I am confident the mirror image holds for mine. If what persists is the tax-raising state holding the provinces, then the East did not fall, and the sentence I wanted to defend comes out false.

  So the pattern does not look like a single candidate referent being tested by shifting standards. It looks like a family of candidates — the city, the western provincial state, the eastern empire, the legal order, the civilization, the idea of Rome — where each piece of evidence is assigned, silently and at the moment it is introduced, to whichever member of the family makes it support the conclusion its presenter already holds, and where the remaining members simply go unmentioned for that datum.

  Here is what I do not think it is. It is not moving the goalposts, because the standard applied to any given piece of evidence never changes; what changes is the thing the evidence is evidence about. It is not the "no true Scotsman" move, which rescues a generalization from an awkward instance by narrowing the predicate; here the subject is what gets re-selected, and the move is symmetric and offensive as well as defensive. It is not equivocation or the fallacy of four terms, since neither of us was holding steadily to two meanings — the meanings were recruited individually, per datum, and there were more than two of them. It is not the ship of Theseus, which is a puzzle about one case rather than a pattern in argument. And it is not merely the complaint that the dispute is semantic: we did try stipulating definitions, and the dispute returned at once in a stronger form, as a claim about which candidate was the real Rome, which no longer seemed to be a question about words at all.

  What I want from you is not a label but a carving. Is there an established concept or body of work that covers this, and if so, does it cover the whole of what I have described or only part of it? If there is nothing established, coin a term, define it, and give me its edges: what counts as a case of it, what is a near miss, and what merely looks like it? I especially want to know where it stops being a defect in reasoning. If the subject term genuinely denotes several equally real things and there is no fact about which is the true one, then perhaps sliding among them is not a fallacy but a symptom of a badly posed question, and the thing to criticize is the question rather than the arguers. Tell me how one would distinguish those two situations from inside an argument like the one I had, if that can be done at all — and tell me whether the phenomenon generalizes. I suspect the same thing happens when people argue about whether a given state was really socialist, or whether the Enlightenment succeeded, or whether a friend who has changed over twenty years is still the same friend, but I do not know whether those are instances of one thing or of several things that look alike from where I am standing.
reasoning: |-
  Okay, let me start by unpacking the user's query. They had a debate about the fall of the Roman Empire with a friend. Both agree on the facts but noticed a pattern in their argument where each selectively applied evidence to different aspects of what "Rome" means. The user wants to identify this pattern and understand if it's a known logical fallacy or something else.

  First, I recall common fallacies. Moving the goalposts doesn't fit because the standards per evidence didn't change; instead, the focus shifted between different entities (like the state vs. culture). No true Scotsman is about redefining the subject to exclude counterexamples, but here the subject itself is fluid. Equivocation involves two fixed meanings, but here multiple aspects are in play, each invoked as needed.

  The user mentions that stipulating definitions didn't help because the argument shifted to which aspect is the "real" Rome. This suggests the core issue isn't semantic but ontological—what constitutes Rome's existence. The concept of "essence" comes to mind. Each person emphasizes different essential traits (administration vs. culture), leading to different conclusions.

  I remember that in philosophy, this relates to ontological vagueness or family resemblances. Wittgenstein's idea that some concepts lack a single defining feature but share overlapping traits fits here. "Rome" might be such a concept, with various aspects forming a cluster. When arguing, each person highlights traits that support their view, ignoring others. This isn't a fallacy but a misalignment in what aspect is considered essential.

  The term "essentialism" or "selective essentialism" might apply. They're not committing a logical error; they're prioritizing different criteria based on unspoken assumptions. The user's frustration comes from the lack of a shared criterion upfront. The debate's resolution requires agreeing on which aspect matters most for "falling," but that's often subjective.

  Generalizing this, similar debates (e.g., "Was the USSR socialist?") involve contested essences. The key is recognizing when a term is "cluster-dependent." The fix isn't better definitions but acknowledging multiple valid perspectives or agreeing on a specific criterion. The defect isn't in reasoning but in the question's framing. The user needs to distinguish between genuine ontological ambiguity and debaters being inconsistent. Here, it's the former because both applied their criteria consistently once stated, but their criteria conflicted due to different core aspects.
answer: |-
  This phenomenon is not merely a fallacy but a deeper **ontological negotiation** masked as historical debate. It represents a failure to recognize that "the Roman Empire" is a **cluster-dependent concept**—a term whose referent shifts based on which subset of its associated traits (administration, territory, culture, law, etc.) is implicitly privileged. Below is a systematic carving:

  ### Core Concept: **Cluster-Selective Reasoning**
  **Definition**: The unconscious assignment of evidence to whichever sub-aspect of a multifaceted concept best supports a predetermined conclusion, while ignoring that the same evidence could be mapped to competing sub-aspects. This occurs when:
  1. The subject (e.g., "Rome") has no single essence but a cluster of historically intertwined attributes.
  2. Arguers fixate on different subsets of attributes as "definitive."
  3. Evidence is selectively interpreted as continuity/discontinuity *for that subset only*.

  **Edges and Distinctions**:
  - ✅ **Clear Cases**:  
    - Debates about the "fall" of empires/states (Byzantium vs. W. Rome, Soviet Union's "collapse").  
    - "Is [nation] civilized?" (emphasizing technology vs. human rights vs. art).  
    - "Is [person] still themselves?" (memory vs. body vs. personality traits).  
  - ⚠️ **Near Misses**:  
    - *Motte-and-bailey* (switching between broad/narrow definitions): Differs because cluster-selection involves parallel sub-concepts, not strategic retreat.  
    - *Conceptual gerrymandering* (redrawing boundaries to fit a claim): Similar, but cluster-selection leverages pre-existing ambiguities rather than inventing new boundaries.  
  - ❌ **Non-Instances**:  
    - *Equivocation* (fixed meanings switched mid-argument): Here, meanings are fluid and context-dependent.  
    - *False dilemma* (oversimplifying options): The problem is *too many* valid options, not too few.  

  ### Why It’s Not a Fallacy (Always)
  Cluster-selective reasoning becomes defective **only when arguers deny the cluster’s multiplicity**. If "Rome" objectively has multiple valid aspects (state, civilization, legal tradition), sliding among them reflects the concept’s structure, not irrationality. The error arises when:  
  1. **Unacknowledged Switching**: Claiming a single "true" Rome while using evidence tied to different aspects.  
  2. **Criterion Concealment**: Failing to state which aspect matters *before* applying evidence.  

  In your argument, both defects occurred: you treated "province-holding state" as definitive; your friend treated "legal/cultural continuity" as definitive—yet neither admitted this upfront. When criteria *were* stated, consistency exposed contradictions (e.g., his criterion excluded the Western Church).  

  ### Diagnosing from Within the Argument
  To distinguish ambiguity from fallacy:  
  1. **Interrogate the Subject**: Ask, *"Which part of Rome are we judging—its government, its borders, its legacy?"*  
  2. **Test Consistency**: Demand, *"Apply your criterion to both halves of the Empire equally."* (As you did, revealing his criterion invalidated his Western evidence.)  
  3. **Seek Neutral Ground**: *"Is there a historian’s convention or a context where one aspect clearly dominates?"* (e.g., "fall of Rome" in textbooks usually means 476 CE/Western administration).  

  If no consensus exists, the question *"Did Rome fall?"* is ill-posed. The productive question becomes: *"Which aspects of Rome ended when, and why do we prioritize some over others?"*  

  ### Generalization and Examples
  This pattern permeates **essentially contested concepts** (W.B. Gallie):  
  - **"Was the USSR socialist?"**  
    - Cluster: State ownership vs. workers' control vs. egalitarianism.  
    - Selectivity: "It had planned economy!" (pro) vs. "No worker democracy!" (con).  
  - **"Did the Enlightenment succeed?"**  
    - Cluster: Scientific progress vs. secularism vs. human rights.  
    - Selectivity: "Science flourished!" vs. "Inequality persists!"  
  - **Personal Identity**:  
    - Cluster: Biological continuity vs. psychological coherence vs. narrative self.  
    - Selectivity: "He has the same body!" vs. "He’s nothing like before!"  

  These are all instances of the same phenomenon: **cluster-dependent concepts** + **unstated priority rules**.  

  ### Term Proposal: **Subcept Shifting**
  - **Definition**: The rhetorical practice of resolving ambiguity in a cluster-dependent concept by dynamically assigning evidence to whichever sub-concept (subcept) favors a preferred claim, without acknowledging the subcept’s contested status.  
  - **Etymology**: "Subcept" (sub-concept) + "shifting" (dynamic reassignment).  

  ### Conclusion
  Your debate exposed **ontological flexibility** inherent in historical categories. The flaw wasn’t in reasoning but in *framing*: asking for a binary verdict on a concept with multiple dimensions. To escape this:  
  1. **Map the cluster** (list all candidate "Romes").  
  2. **Declare your priority** (e.g., "I focus on state institutions").  
  3. **Accept pluralism** where no hierarchy exists.  

  As Marc Bloch observed, the "fall of Rome" is less a fact than a Rorschach test for what we value in civilization. Subcept shifting reveals that we argue not about history, but about which threads of continuity matter most.
