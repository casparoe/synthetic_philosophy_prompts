  For the "hoped-nobody-asks" question: Article 8's removal of superior orders defense presents a symmetrical retroactivity problem the user hasn't resolved. If they concede this weakens their position, it could unravel the entire argument. The dilemma is that maintaining consistency might force admitting Nuremberg was fundamentally legislative - which their thesis partially acknowledges but hasn't fully reconciled. 

  The user's hidden challenge is balancing historical rigor with legal philosophy while avoiding perception of attacking Nuremberg's legacy. Their reply strategy shows sophistication - quick concessions to establish good faith before pivoting to their original contribution about crimes against humanity's successful adoption versus aggression's failure. 

  Noticing the user's sharp awareness of disciplinary vocabularies (archives, secondary rules etc.), I'll mirror those nuances in the prep sheet. The Tokyo tribunal mention is particularly astute - it's both a vulnerability and potential escape hatch if they can distinguish jurisdictional foundations. 

  The unspoken pressure point is time management: fifteen minutes plus Q&A means replies must be under a minute. Hence the strict sentence limits in the prep sheet structure. Their anxiety about bluffing spots reveals admirable intellectual honesty - we should flag where hedging would backfire. 

  Ultimately this is about controlling the narrative: keeping focus on their novel thesis contribution (the divergent post-Nuremberg paths of aggression vs humanity charges) despite attacks on methodology or legacy questions. The prep sheet should weaponize their interdisciplinary position - using history to answer lawyers and law to answer historians.
answer: |-
  Here are the five numbered items for your prep sheet:

  1.  **Convenor (Codification School):** "Aren't you imposing an anachronistic, domestic legal positivist standard of 'pedigree' onto an international legal order that functioned through state practice and opinio juris? The Pact of Paris *was* the source, and the Tribunal's role was declaratory, not legislative."
      *   **Concession:** "You're right that the international legal order in 1928-1945 didn't have a centralized legislature like a domestic system."
      *   **Reply:** "My argument isn't about the *source* of the norm prohibiting aggression between states, which existed. It's about the *kind* of norm created. State practice and opinio juris before 1945 concerned state responsibility and reparations, not individual criminal liability under penal law. The leap to personal punishment, with its specific requirements like definable offences and penalties, lacked that same customary or treaty foundation. The Pact established a *wrong*, not a *crime* triable in a penal forum against individuals."
      *   **Weak Spot:** Distinguishing the foundational source of the inter-state norm from the specific lack of precedent for *individual criminal liability* as a necessary element of the crime itself.

  2.  **Hartian Student 1:** "If your objection hinges on the absence of a pre-existing secondary rule authorizing individual criminalization for aggression, doesn't that imply the post-war order couldn't legitimately create *any* new secondary rules? How can a legal system bootstrap its own rule of recognition?"
      *   **Concession:** "I acknowledge that legal systems must have origins, and those origins often involve foundational acts that might not fit neatly within prior rules."
      *   **Reply:** "My concern isn't the mere act of creating a new tribunal or procedure. It's specifically about applying *retroactive criminal law* to individuals facing severe penalties. Fundamental principles of legality, even in nascent systems, typically prohibit this due to deep-seated notions of fairness and notice. While a new system can establish courts and define *future* crimes, applying new criminal definitions *backwards* to punish past acts remains problematic, especially where, as with aggression, no prior system had defined it as an individual crime with penalties."
      *   **Weak Spot:** Articulating a coherent limiting principle for when foundational acts creating *substantive criminal law* cross the line into impermissible retroactivity within a new legal order.

  3.  **Diplomatic Historian:** "Given the archival evidence of the London negotiations – the intense pressure for summary executions, the political need for a trial to demonstrate Nazi guilt – isn't your legal retroactivity critique largely academic? Doesn't political necessity, not legal philosophy, explain the Tribunal's approach and dismissal of the ex post facto defense?"
      *   **Concession:** "The political context and imperative for a public accounting were undoubtedly paramount drivers of the trial's form."
      *   **Reply:** "My argument isn't that the Tribunal *shouldn't* have happened for political reasons, nor that the retroactivity point was dispositive for the prosecutors or judges politically. My claim is that, as a matter of legal principle specifically regarding the *criminalization* of aggression for the *individuals* on trial, the usual justifications offered fall short. Examining the legal reasoning is crucial precisely because the Tribunal presented itself as applying *law*, not just politics. The weakness of the legal answers reveals the genuinely novel legislative character of that specific count."
      *   **Weak Spot:** Demonstrating that the *legal* critique adds significant explanatory value beyond acknowledging the political genesis, especially regarding the Tribunal's self-presentation as a legal body.

  4.  **Transitional-Justice Scholar:** "Doesn't your focus on retroactively undermining the aggression charge risk delegitimizing the entire Nuremberg legacy and its expressive function in establishing accountability for atrocities? Aren't the 'legitimacy costs' of not holding leaders accountable for launching wars greater than the costs of imperfect legality?"
      *   **Concession:** "Nuremberg's profound historical importance in condemning Nazi atrocities and establishing precedents for crimes against humanity and war crimes is undeniable and invaluable."
      *   **Reply:** "My argument targets *only* Count One (crimes against peace) and its specific retroactivity problem. I explicitly contrast it with crimes against humanity, which, despite novelty in 1945, *did* successfully transition into established law. Acknowledging the legal flaw in one count doesn't erase the legitimacy of convicting on the other charges or the enterprise's overall significance. In fact, recognizing the unique failure of aggression to travel post-Nuremberg *supports* my point about its distinct retroactive foundation."
      *   **Weak Spot:** Preventing the perception that criticizing *one* count inherently "tars" the *entire* legacy, or adequately balancing the expressive value against the specific legality principle.

  5.  **Question Hoping Nobody Asks:** "If your retroactivity objection against legislating new crimes (aggression) is so strong, how do you justify the Tribunal's equally novel *removal* of the superior orders defense (Article 8 of the Charter)? Wasn't that also legislating a new rule adversely affecting the defendants?"
      *   **Why I Can't Answer/What I Give Up:** I currently lack a principled distinction that fully reconciles rejecting retroactive criminalization of aggression while accepting the retroactive abrogation of the superior orders defense. To defend Article 8, I would likely need to weaken my core argument by conceding a greater degree of acceptable retroactive court-made procedural/adjectival law or re-characterizing Article 8 as a jurisdictional/evidentiary rule rather than a substantive change – moves that risk undermining the force of my objection to Count One.
