  ### Socialist Calculation Debate Game: "Lange's Planning Challenge"

  **Objective:** Simulate Oskar Lange's model of market socialism with a Central Planning Board (CPB) and production teams/consumers, incorporating Hayek's critique of dispersed local knowledge. Highlight how tacit information (not on forms) affects efficiency, while exposing flaws like externalities and endowments.

  ---

  ### **Game Setup**
  **Duration:** 75 minutes  
  **Participants:** 24 students  
  - **CPB Team (12 students):** Sets parametric prices using shortage/surplus reports.  
  - **Market Team (12 students):** 
    - **Production Units (8 students):** 4 teams (2 students each) producing "Widgets" (Good A) or "Gadgets" (Good B).  
    - **Consumers (4 students):** Buy goods with points; suffer from pollution externality.  

  **Materials:**  
  1. **Price Sheets** (for CPB)  
  2. **Production Reports** (for teams)  
  3. **Demand Forms** (for consumers)  
  4. **Local Knowledge Cards** (1 per production team)  
  5. **Scoreboards** (visible to all)  
  6. Timer, whiteboard, markers.  

  ---

  ### **Game Rules & Mechanics**
  #### **1. Goods & Production**  
  - **Good A (Widgets):** Pollution-intensive (externality: -1 pt per unit to all consumers).  
  - **Good B (Gadgets):** Clean good.  
  - **Production Rules:**  
    - Teams minimize costs at CPB prices.  
    - Produce where **Price = Marginal Cost (MC)**.  
    - **MC Functions** (per team):  
      - Widget Teams: `MC = Base Cost + 0.5 × Quantity`  
      - Gadget Teams: `MC = Base Cost + 0.3 × Quantity`  
    - **Base Costs & Local Knowledge:**  
      | Team | Good | Base Cost | Local Knowledge Card |  
      |------|------|-----------|----------------------|  
      | 1    | A    | 3         | "Your machines overheat if output >6. Costs double if ignored." |  
      | 2    | A    | 2         | "You can use Team 4’s waste coolant (Gadgets) to cut Base Cost to 1. *Must negotiate verbally*." |  
      | 3    | B    | 4         | "You have a rare mineral allowing 0-cost production up to 3 units." |  
      | 4    | B    | 6         | "Your factory is noisy; output reduces Gadget Teams’ costs by 1 if within earshot." |  

  #### **2. Consumer Setup**  
  - **Endowment:** 20 points each.  
  - **Utility:** `(Widgets × Gadgets) - Pollution Tax`  
    - Pollution Tax = Total Widgets produced × 1.  
  - **Demand Rule:** Maximize utility given prices and budget.  

  #### **3. CPB Rules**  
  - **Price Adjustment:**  
    - **Shortage (Demand > Supply):** Raise price by 20%.  
    - **Surplus (Supply > Demand):** Lower price by 20%.  
  - **Reporting Forms:** Teams submit only:  
    - Quantity Produced, Total Cost, Shortage/Surplus.  
    - **NO fields for local knowledge** (e.g., overheating, waste coolant).  

  #### **4. Points System**  
  - **Production Teams:**  
    - Profit = `(Price × Quantity) - Total Cost`  
    - **Bonus:** +5 pts if profit >0 for 2+ rounds.  
  - **Consumers:**  
    - Utility = `(Widgets × Gadgets) - (Total Widgets × 1)`  
  - **CPB:**  
    - Score = `100 - |Total Shortage| - |Total Surplus|` (max 100).  

  ---

  ### **Round Structure (65 mins)**  
  **Intro (5 mins):** Explain rules, assign roles, distribute cards.  

  #### **Round 1 (20 mins)**  
  - **Planning (5 mins):**  
    - CPB sets initial prices (suggestion: Widgets = 5, Gadgets = 7).  
    - **Market Team Action:** Production teams calculate output (P=MC); consumers plan demand. **Allow 2 mins for open talk** (local knowledge sharing).  
  - **Production & Consumption (10 mins):**  
    - Teams submit **Production Reports** (quantity, cost).  
    - Consumers submit **Demand Forms** (widgets, gadgets).  
  - **CPB Adjustment (5 mins):**  
    - CPB calculates shortages/surpluses, adjusts prices.  

  #### **Round 2 (20 mins)**  
  - Repeat Round 1 with new prices.  

  #### **Round 3 (20 mins)**  
  - Repeat, but **no talking allowed** for market teams.  

  **Scoring (5 mins):** Tally points; announce winners.  

  ---

  ### **Debrief (10 mins)**  
  **Guided Discussion:**  
  1. **What Happened?**  
     - Market teams likely exploited local knowledge when talking (e.g., Team 2 used Team 4’s coolant).  
     - CPB prices adjusted to shortages/surpluses but ignored externality (pollution) and endowments (Team 4’s high cost).  
     - **Predicted Outcome:** Market teams "win" (higher profits/utility) if they shared knowledge; CPB struggles with pollution/equilibrium.  

  2. **Hayek vs. Mises:**  
     - **Hayek’s Point (Validated):** Dispersed knowledge (e.g., overheating, waste coolant) only flows through verbal communication. CPB forms couldn’t capture it → inefficiency without talk (Round 3).  
     - **Mises’ Claim (Not Tested):** The game shows *calculation is possible* (prices converged near equilibrium) but *inefficient* due to tacit knowledge/externalities. Mises argued calculation is *impossible* without property rights—this game doesn’t simulate that.  

  3. **Systemic Flaws:**  
     - Externality (pollution) wasn’t priced → overproduction of Widgets.  
     - Lousy endowment (Team 4’s high cost) led to low output unless knowledge sharing helped.  

  ---

  ### **Predictable Problems & Fixes**  
  - **"Market Wins Too Easily":**  
    - **Why:** Talking lets teams optimize fast; CPB can’t react to hidden factors.  
    - **Fix:** Emphasize in debrief that Lange *assumed* managers share knowledge honestly. Real-world incentives (e.g., lying to hit targets) weren’t simulated.  
  - **Time Crunch:**  
    - Simplify MC math (pre-calculate tables).  
    - Use a spreadsheet for CPB calculations.  
  - **Confusion:**  
    - Assign a "facilitator" (student) to manage scoreboards.  
    - Run a 1-round trial with sample numbers.  

  ---

  ### **Materials**  
  #### **1. Price Sheet Template (CPB)**  
  | Round | Widget Price | Gadget Price | Widget Supply | Gadget Supply | Widget Demand | Gadget Demand | Shortage/Surplus (W) | Shortage/Surplus (G) | New W Price | New G Price |  
  |-------|--------------|--------------|--------------|---------------|--------------|---------------|----------------------|----------------------|-------------|-------------|  

  #### **2. Production Report (Teams)**  
  - Team: ________  
  - Good: ________  
  - Quantity Produced: ________  
  - Total Cost: ________  
  - Shortage/Surplus? (Circle): **Shortage / Surplus / None**  

  #### **3. Demand Form (Consumers)**  
  - Widgets Demanded: ________  
  - Gadgets Demanded: ________  
  - Total Spending: ________  

  #### **4. Scoreboards**  
  - **Production Teams:** Team | Profit (Round 1) | Profit (Round 2) | Profit (Round 3) | Total  
  - **Consumers:** Consumer | Utility (Round 1) | Utility (Round 2) | Utility (Round 3) | Total  
  - **CPB:** Round | Shortage/Surplus Score | Adjustment Score | Total  

  --- 

  This game forces students to **experience** Hayek’s critique while seeing Lange’s model "work" imperfectly. The debrief separates knowledge dispersion (game’s focus) from Mises’ calculation impossibility (beyond the simulation). Run it tight, and lean into the chaos!
