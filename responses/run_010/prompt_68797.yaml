  Then at the end, we calculate scores.

  Debrief:

  - What happened? Did the prices converge to equilibrium?
  - Did the production teams with high base costs survive?
  - Did the local knowledge get shared? How? What was the effect?
  - Was the externality internalized? (Probably not, so the CPB set a price that was too low for A, leading to overproduction and pollution).
  - Hayek's point: the local knowledge about cost reductions through sharing was only used when teams talked. The CPB didn't know about it and didn't set prices to reflect that possibility. The prices only adjusted to shortages and surpluses, not to the potential for cost reduction.
  - Mises's claim: the game does not show that calculation is impossible. In fact, the prices did adjust and some allocation happened. But it might not be efficient because of the externality and the local knowledge not being fully utilized until shared.

  Predictable problems:

  - The market side wins easily? How? The production teams might not be able to produce much initially because of the lousy endowment. But if they share, they reduce costs. The externality is not addressed, so consumers might be unhappy. The consumers might not understand the optimization.

  - The first time, the CPB might set bad initial prices and then overadjust. The market might not clear in 3 rounds.

  - The local knowledge sharing: teams might not talk to each other, or only some do. Then the high-cost teams remain.

  - The consumer's demand calculation might be wrong.

  - Time: the rounds might take longer than planned.

  To save time, we can have fewer teams? Or do the calculations quickly.

  We can also use a spreadsheet for the CPB to do the math.

  Finally, provide the materials:

  1. Price sheet template for CPB (one per round, for 3 rounds).
  2. Production team cards (with base cost and local knowledge).
  3. Consumer cards (with utility and budget).
  4. Reporting forms: 
     - Production teams: report their Q for the round.
     - Consumers: report desired A and B.

  Let's hope it works.
