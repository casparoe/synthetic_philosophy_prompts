prompt: |-
  I draft regulations for a living and run a small evening reading group on vagueness on the side, and for our first session I want to build a sorting instrument: a decision tree that takes someone from how they answer a handful of concrete cases to a named position in the debate, without them ever seeing a label first. Half the group are practising lawyers, half are philosophy postgrads, and the lawyers will happily announce that they're epistemicists just because it sounds like a confident thing to be, so the instrument has to sort people by what they actually say about cases.

  The angle I want — and it's the one I think the standard write-ups serve worst — is that the tree should be built out of the second-order questions, not the first. Please don't make the opening node anything like "is there a sharp boundary?", since everyone leads with that and it barely discriminates: too many views can say yes, no, or "it depends what you mean by sharp" and end up in the same place. Lead instead with whether the trouble comes back a level up, and with what people are willing to say about their own refusal to commit.

  Four cases of mine have to be in there somewhere, because they're the ones I care about:

  1. Two swatches from the same tin of paint. On each one separately I won't tell you whether it counts as red. But I'll bet the house that either both count or neither does. The tree needs a node about whether that kind of linked uncertainty can be explained, because that's where I suspect supervaluationism and the degree theories actually part company — argue with me if you think I'm wrong.
  2. An all-knowing observer and a heap being dismantled one grain at a time. Does that observer know the exact grain at which it stopped being a heap, or is there nothing for them to know, or is there something to know that even they can't get at? Those are three different answers and I want them on separate branches.
  3. The lawyer who, having refused to commit on whether some extension counts as "small", is then asked whether they'd refuse to commit on whether they should refuse. Does the hesitation itself hesitate?
  4. A regulatory threshhold of the kind I actually write: "temporary" use of land, where the rule is silent on how long is temporary. I want the leaves to have something to say here, because my real question is whether the answer changes when a jurisdiction stipulates its own number, or whether the stipulation just fixes something that was already fixed and merely obscure.

  Required leaves: epistemicism of the Williamson kind; supervaluationism; the degree/many-valued family, but split it — the versions where the degrees themselves bottom out somewhere and the versions where they don't are not the same view and shouldn't share a leaf; contextualism or indexicalism; the view where the world itself is unsettled rather than our talk of it; error theory or nihilism about such predicates; and any position your tree generates that nobody actually defends, which should be labelled "unnamed" and kept rather than quietly dropped.

  Two structural demands. First, build the logical space before you build the tree: set out the questions and what combinations of answers they permit, then locate the actual views in it, then point out at least two combinations that come out empty and diagnose each one in a line — is it incoherent, merely unattractive, or just unexplored? Second, be honest about limits: flag at least one pair of leaves your instrument genuinely cannot seperate, and say what question would pull them apart if anything could, or why nothing can.

  One more constraint, and it's the hard one: the question stems and answer options must not contain any of the trade vocabulary. No "vague", "borderline", "sharp", "determinate", "truth value", "precisification", "degree". A lawyer who's never read any of this should be able to answer every question cold. You'll have to phrase the cases so the distinction comes out of the case anyway, and I want to hear how you managed it.

  Please give me the whole thing in British English, no bibliography or further-reading suggestions — this has to be usable in the room on the night, printed on two sides of A4.

  Sections, in this order:

  - **Ground rules** (~150 words): the vocabulary ban, what you substituted for each banned term, and anything you had to give up to keep it clean.
  - **The questions** (the bulk of it): eight cases, each with a short stem, two to four answer options, and a one-line note on which node it feeds into.
  - **The logical space**: the questions treated as dimensions, the combinations they allow, and where the named views sit.
  - **The tree**: nodes in order, with the branch condition at each one spelled out.
  - **Scoring key**: answer patterns mapped onto positions, including what to make of someone whose pattern is inconsistent.
  - **Empty cells**: the unoccupied combinations, one line of diagnosis each.
  - **What it can't separate** (~200 words): the indistinguishable leaves, and the best available test for telling them apart.
reasoning: |-
  Hmm, the user wants me to create a sorting instrument for a reading group on vagueness. They draft regulations professionally and run this group on the side, with a mix of lawyers and philosophy postgrads. The lawyers might overconfidently label themselves as epistemicists, so this instrument needs to sort people based on their actual responses to cases rather than theoretical terms.

  The key requirements are: it must use second-order questions instead of first-order ones (like "is there a sharp boundary?"), include four specific cases they care about, cover all major positions in vagueness (with specific splits like separating degree theories), avoid all trade vocabulary, and be structured in British English with specific sections.

  The four cases are: 
  1. Linked paint swatches where uncertainty is correlated
  2. All-knowing observer and heap dismantling
  3. Lawyer hesitating about their hesitation on "small"
  4. Regulatory threshold for "temporary" use of land

  For the logical space, I'll need to identify dimensions that capture key distinctions: whether boundaries exist, whether boundaries are knowable, whether hesitation is appropriate, whether hesitation applies to higher orders, whether linked uncertainty can be explained, whether the world itself is unsettled, and what happens when rules are specified numerically.

  The vocabulary ban is challenging - no terms like "vague" or "borderline." I'll need to describe scenarios that implicitly raise these issues. For example, instead of "borderline case," I might describe a situation where people consistently refuse to answer yes/no about a color.

  The structure should follow their requested sections: Ground Rules, The Questions (cases), Logical Space, Decision Tree, Scoring Key, Empty Cells, and Limits. I'll use British English throughout.

  For the heap case, I'll create three distinct answers: the observer knows the exact point, there's nothing to know, or there's something to know but even they can't access it. This should separate epistemicism from other views.

  The regulatory case will test whether specifying a number changes the nature of the rule or just makes explicit what was already fixed. This might distinguish views where vagueness is linguistic versus ontological.

  I'll need to identify at least two empty combinations in the logical space and diagnose why they're untenable. I'll also need to be honest about indistinguishable positions - perhaps nihilism and certain forms of contextualism might be hard to separate with this instrument.

  The whole thing must fit on two sides of A4, so I'll keep it concise while covering all requirements.
answer: |-
  ### Vagueness Sorting Instrument: Second-Order Approach

  **Ground Rules** (149 words)  
  Banned terms: "vague", "borderline", "sharp", "determinate", "truth value", "precisification", "degree". Replacements:  
  - Instances where "people consistently refuse to answer yes/no" → replaces "borderline cases".  
  - "Exact point where a description stops applying" → replaces "sharp boundary".  
  - "Whether a thing falls under a description" → replaces "truth value".  
  - "Refusal to commit" → replaces "hesitation" or "indeterminacy".  
  Sacrifices: Direct discussion of "higher-order vagueness" is avoided; instead, we probe repeated refusals. "World unsettled" replaces "ontic vagueness". The regulatory case uses "stipulated number" for artificial precisification. Compromises on capturing *why* degrees bottom out (e.g., fuzzy logic’s technicalities), focusing only on whether they *do*.  

  ---

  **The Questions**  
  *Case 1 (Paint Swatches)*  
  **Stem:** Two colour samples from the same tin. For each alone, you’d refuse to say if it’s red. Would you bet heavily that they are either both red or both not red?  
  **Options:**  
  (A) Yes, that bet is safe.  
  (B) No, that bet is unsafe.  
  **Feeds to:** Explaining linked uncertainty.  

  *Case 2 (All-Knowing Observer & Heap)*  
  **Stem:** A being who knows every fact watches sand removed grain by grain from a heap. When it stops being a heap, does this being:  
  **Options:**  
  (A) Know the exact grain where it happened?  
  (B) Know there is no exact grain where it happened?  
  (C) Not know, because even they can't access that fact?  
  **Feeds to:** Nature of boundaries.  

  *Case 3 (Lawyer’s Hesitation)*  
  **Stem:** A lawyer refuses to say if a business extension is "small". Asked if they’d *also* refuse to say whether their first refusal was correct, they:  
  **Options:**  
  (A) Would not refuse – they’re confident their first refusal was right.  
  (B) Would refuse again – they’re unsure about the refusal too.  
  **Feeds to:** Stability of refusal.  

  *Case 4 (Regulatory Threshold)*  
  **Stem:** A rule bans "temporary" use of land but sets no time limit. If a jurisdiction adds "over 28 days isn’t temporary", this:  
  **Options:**  
  (A) Creates a new rule, replacing uncertainty.  
  (B) Makes clear what was always fixed but hard to find.  
  **Feeds to:** Effect of stipulation.  

  *Case 5 (Repeated Sampling)*  
  **Stem:** For a colour between red and orange, people consistently refuse yes/no to "is it red?". If shown 100 identical samples, would *any* number of "is it red?" refusals make you doubt the description itself?  
  **Options:**  
  (A) No – the description is fine, refusals are expected.  
  (B) Yes – the description is flawed if refusal is always possible.  
  **Feeds to:** Existence of boundaries.  

  *Case 6 (Contradictory Instructions)*  
  **Stem:** Rule 1: "If it’s red, sound Alarm A". Rule 2: "If it’s not red, sound Alarm B". For a colour where refusal is standard, you:  
  **Options:**  
  (A) Sound no alarm – both rules misfire.  
  (B) Sound one alarm arbitrarily – you must pick.  
  (C) Sound both – the situation demands it.  
  **Feeds to:** Practical consequence of refusal.  

  *Case 7 (Perfect Measurement)*  
  **Stem:** With a tool measuring colour wavelengths perfectly, for a sample where refusal is standard:  
  **Options:**  
  (A) The tool settles "is it red?" definitively.  
  (B) The tool doesn’t help – the question isn’t about wavelengths.  
  **Feeds to:** Role of empirical facts.  

  *Case 8 (Shared Judgment)*  
  **Stem:** You and I independently refuse to say if a sample is red. If we compare notes, we’d expect:  
  **Options:**  
  (A) Agreement – we’d both refuse for the same reasons.  
  (B) Possible disagreement – I might say yes while you refuse.  
  **Feeds to:** Community dependence.  

  ---

  **Logical Space**  
  *Dimensions & Permitted Combinations:*  
  1. **Boundaries exist?** (Case 5: A=Yes, B=No)  
  2. **Boundaries knowable?** (Case 2: A=Yes, B/C=No)  
  3. **Refusal appropriate?** (Case 6: A=Yes, B/C=No)  
  4. **Refusal applies to itself?** (Case 3: A=No, B=Yes)  
  5. **Linked refusal explainable?** (Case 1: A=Yes, B=No)  
  6. **World unsettled?** (Case 7: B=Yes, A=No)  
  7. **Stipulation creates or reveals?** (Case 4: A=Creates, B=Reveals)  
  8. **Refusal community-dependent?** (Case 8: A=No, B=Yes)  

  *Named views:*  
  - **Epistemicism (Williamson):** (1Y, 2A, 3B, 4A, 5A, 7B, 8A)  
  - **Supervaluationism:** (1Y, 2B, 3A, 4A, 5A, 7B, 8A)  
  - **Degree Theories (Degrees Bottom Out):** (1N, 3A, 4A, 5B, 6A, 7A, 8A)  
  - **Degree Theories (Degrees Don’t Bottom Out):** (1N, 3A, 4B, 5B, 6A, 7A, 8B)  
  - **Contextualism:** (1Y, 2C, 3A, 4A, 5B, 7B, 8B)  
  - **World Unsettled:** (1N, 2C, 3A, 5B, 6B, 7B, 8A)  
  - **Error Theory:** (1N, 2B, 3A, 4B, 5A, 6B, 7A, 8B)  

  ---

  **Decision Tree**  
  1. **Start:** Case 3 (Lawyer’s Hesitation)  
     - **If A (Confident in refusal):** → Node 2  
     - **If B (Refuse about refusal):** → Node 3  

  2. **Node 2 (Case 5: Boundaries Exist?)**  
     - **If A (Yes):** → Node 4  
     - **If B (No):** → "World Unsettled" or Degree Theories (proceed to Node 6)  

  3. **Node 3 (Case 2: Boundary Knowable?)**  
     - **If A (Yes):** → "Epistemicism"  
     - **If B (No fact):** → "Supervaluationism"  
     - **If C (Fact but unknowable):** → "Contextualism"  

  4. **Node 4 (Case 1: Linked Refusal Explainable?)**  
     - **If A (Yes):** → "Epistemicism" or "Supervaluationism" (proceed to Node 5)  
     - **If B (No):** → "Error Theory"  

  5. **Node 5 (Case 4: Stipulation Creates/Reveals?)**  
     - **If A (Creates):** → "Supervaluationism"  
     - **If B (Reveals):** → "Epistemicism"  

  6. **Node 6 (Case 7: Tool Settles It?)**  
     - **If A (Yes):** → "Degree Theories (Bottom Out)"  
     - **If B (No):** → "World Unsettled" or Degree Theories (No Bottom) → Node 7  

  7. **Node 7 (Case 8: Refusal Community-Dependent?)**  
     - **If A (No):** → "World Unsettled"  
     - **If B (Yes):** → "Degree Theories (No Bottom)"  

  ---

  **Scoring Key**  
  - **Epistemicism:** 3A → 2A → 4A → 5B  
  - **Supervaluationism:** 3A → 2A → 4A → 5A  
  - **Contextualism:** 3B → 2C  
  - **Degree (Bottom Out):** 3A → 2B → 6A  
  - **Degree (No Bottom):** 3A → 2B → 6B → 7B  
  - **World Unsettled:** 3A → 2B → 6B → 7A  
  - **Error Theory:** 3A → 2A → 4B  
  - **Inconsistent Paths:** E.g., 3B but 5A (refuse about refusal, yet linked refusal explicable). Flag as "Unresolved" – may indicate hybrid views or confusion.  

  ---

  **Empty Cells**  
  1. *Boundaries exist (5A) + World unsettled (7B)*: Incoherent. If world is unsettled, boundaries can’t exist.  
  2. *Refusal unstable (3B) + Linked refusal inexplicable (1B)*: Unattractive. If refusal is unstable, linked cases should be explicable via context.  

  ---

  **What It Can’t Separate** (198 words)  
  The instrument cannot reliably distinguish **"World Unsettled"** from **Degree Theories (No Bottom)** when respondents hold that refusal is stable (Case 3A). Both deny boundaries exist (Case 5B) and claim perfect measurement doesn’t resolve refusal (Case 7B). The critical difference—whether the *world* lacks definite properties or our *descriptions* lack definite application—is obscured because both views answer identically on refusal cases.  

  To separate them, add a case about change without difference: "If two objects share identical physical properties (e.g., colour wavelength), could one be red and the other not?"  
  - **World Unsettled:** Must say yes (properties themselves indeterminate).  
  - **Degree Theories (No Bottom):** Say no (indeterminacy is in description, not properties).  

  However, this question risks trade vocabulary ("indeterminate"). Without it, the views collapse into one leaf here. Contextualism and Supervaluationism are cleanly separated by Case 3 (refusal about refusal), but this pair remains the instrument’s blind spot.  

  ---  
  *End of instrument. Designed for A4 duplex printing. British English compliant.*
