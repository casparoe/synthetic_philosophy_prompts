prompt: |-
  I am a philosophy PhD student serving as the ethics member of a teaching hospital's conscientious-objection panel. We receive two or three requests a month from clinicians to be excused from participation in something — assisted dying, enrolling patients in a trial, resuscitating a patient they judge to be beyond benefit — and we settle them by intuition, which the chair herself admits is arbitrary. Write us a decision procedure that clinicians, a hospital lawyer, and an administrator can run in a single ninety-minute sitting without having read any moral philosophy, built on Williams's integrity objection: ground projects, the doctrine of negative responsibility, and the claim that requiring an agent to justify their deepest commitments in impersonal terms is itself a kind of damage — held against the fact that Williams gives an objector no entitlement to transfer costs onto patients or colleagues. The panel is forbidden from ruling on whether the objector's moral view is correct, so the procedure has to do its discriminating work elsewhere.

  Give me the questions in order, what counts as a sufficient answer to each, where the procedure terminates in a refusal, where it terminates in an accommodation, and where it must stop and record a value judgment it cannot discharge as a matter of fact — for instance, whether a commitment is identity-constituting or merely strongly held. Flag the steps that look like tests but are judgment in disguise. Address head-on the tension I cannot resolve: our intake form requires a written statement of reasons, which on Williams's telling may be the offending demand itself. Tell me how much of the objection survives that step and what the panel must not ask.

  Then run the procedure on three requests: an anaesthetist seeking exemption from assisted dying; a research nurse refusing to enroll patients in a placebo-controlled trial for a condition with an effective treatment; and a senior cardiologist who will not authorize resuscitation of patients he calls beyond benefit, a stance formed over forty years at the bedside. On the third, give the answer the framework actually yields even if it is not the answer I want, and explain why it comes from Williams rather than from my own view of futility. Close with what the procedure cannot do: the requests it will systematically misclassify, and what it looks like when a panel uses it to dress up a decision it had already made.
reasoning: |-
  Hmm, the user is a philosophy PhD student serving on a hospital ethics panel that handles conscientious objections from clinicians. They need a practical decision procedure based on Bernard Williams' philosophy, specifically his concepts of integrity, ground projects, and negative responsibility. The procedure must be usable by non-philosophers in 90 minutes and can't judge the moral correctness of the objection.

  The key Williams concepts here are:
  - Ground projects: The fundamental commitments that give life meaning
  - Negative responsibility: The idea that we're responsible for what we allow as much as what we do
  - The integrity objection: That demanding impersonal justification for deep commitments damages personal integrity

  But there's tension because their intake form requires written reasons - which Williams might see as problematic. I need to preserve the spirit of the objection while making this workable in a hospital setting.

  For the decision procedure, I'll design a flowchart-style questionnaire that progresses through these questions:
  1. Is this about core clinical duties? (To screen out inappropriate objections)
  2. Is this about a ground project? (With practical indicators like duration and integration)
  3. Does accommodation impose unreasonable costs? (To address negative responsibility)
  4. Can costs be mitigated? (Practical solutions before rejection)

  The procedure should terminate with clear outcomes: refusal if it fails early gates, accommodation if costs are manageable, and a "value judgment required" flag when personal significance can't be determined.

  Now for the test cases:
  1. Anesthetist in assisted dying: Likely accommodates because it involves direct lethal action (clear ground project conflict) and costs might be manageable.
  2. Research nurse in placebo trial: Probably refuses because it's about indirect responsibility (negative responsibility applies) and accommodation creates unfair burdens.
  3. Cardiologist refusing resuscitation: This is tricky - his stance might be identity-constituting after 40 years, but declaring futility unilaterally imposes high costs on patients/colleagues. The procedure should flag this for value judgment on personal significance vs. professional duty.

  Important limitations to note:
  - The procedure will struggle with "strongly held vs identity-constituting" distinctions
  - It might misclassify objections based on consequences rather than integrity
  - Bad-faith panels could game the system by manipulating cost assessments

  I'll emphasize that the written statement should focus on describing the commitment rather than justifying it - keeping the intake but neutering its problematic aspect. The panel must avoid asking "why is this right?" but can ask "how is this fundamental to you?"

  For the cardiologist case, I'll stick strictly to Williams' framework even if it's unsatisfying - his integrity principle protects identity-constituting commitments, but the cost imposition here is severe, creating tension the procedure can't fully resolve.
answer: |-
  Here is a conscientious objection decision procedure based on Bernard Williams' integrity framework, designed for operational use. It prioritizes **identity-constituting commitments** while enforcing **negative responsibility** (i.e., objectors cannot transfer unreasonable burdens to patients/colleagues). The procedure avoids judging the *truth* of moral claims, focusing instead on **personal significance, integration into identity, and practical burden-shifting**.

  ---

  ### **Decision Procedure: The Ground Project Protocol**
  *(Runtime: 60-75 minutes; Participants: Clinician objector, Hospital Lawyer, Administrator, Ethics Member)*  

  #### **Pre-Sitting Requirement**  
  The intake form must be reframed:  
  > *"Describe the **commitment or belief** that compels your objection and **how long/how deeply** it has shaped your professional life. Do **not** justify its moral correctness."*  
  **Why this survives Williams**: It documents the *existence* and *subjective weight* of the commitment without demanding impersonal justification. The panel **must not ask**: *"Why is this morally right?"* or *"Prove this belief is reasonable."*  

  ---

  #### **The Questions**  
  **Question 1: Clinical Context Gate**  
  *"Is the objection related to a **core duty** of your role that cannot be delegated without compromising patient care?"*  
  - **Refusal Exit**: If **YES** (e.g., an ER doc refusing all resuscitations). *Rationale: Core duties are non-delegable; refusal constitutes abandonment.*  
  - **Proceed**: If **NO** or **PARTIAL** (delegation possible without harm).  

  **Question 2: Ground Project Test**  
  *"Is this commitment **foundational to your sense of self**, such that violating it would make you unrecognizable to yourself? Describe its **history, depth, and ties to your identity**."*  
  - **Sufficient Answer**: Concrete examples of **lifelong integration** (e.g., "This belief guided my career choice," "I’ve declined promotions to uphold this for 20 years").  
  - **Refusal Exit**: If **NO** (e.g., "I dislike this policy" with no deeper roots).  
  - **Value Judgment Flag**: If ambiguity remains on whether it’s *identity-constituting* (e.g., "I feel strongly but it’s new"). *Panel records: "Unclear if identity-constituting."*  

  **Question 3: Negative Responsibility Assessment**  
  *"If accommodated, what **concrete burdens** (time, distress, clinical delays) fall on patients, colleagues, or the institution? Can these be **quantified or mitigated**?"*  
  - **Administrator** estimates workflow impact; **Lawyer** assesses legal risk.  
  - **Accommodation Exit**: If burdens are **low/mitigatable** (e.g., swapping assignments).  
  - **Refusal Exit**: If burdens are **severe/unavoidable** (e.g., delays harming patients, staff shortages).  
  - **Value Judgment Flag**: If burden severity is contested. *Panel records: "Unresolved burden assessment."*  

  **Question 4: Cost Transfer Check**  
  *"Does accommodation require **others to violate their own commitments** or **assume excessive risk**?"*  
  - **Refusal Exit**: If **YES** (e.g., forcing a colleague to repeatedly act against their values).  
  - **Proceed**: If **NO**.  

  **Question 5: Final Accommodation Scope**  
  *"Define the **narrowest possible accommodation** that respects your commitment while minimizing burdens."*  
  - **Output**: Written agreement specifying scope (e.g., "Exempt only from direct drug administration, not counseling").  

  ---

  ### **Tension Addressed: The Written Statement**  
  Williams opposes demanding "impersonal justifications," but your form asks for *reasons*. The compromise:  
  - **Permissible**: Describing the commitment’s **personal significance** (e.g., "This vow I made at my mother’s deathbed").  
  - **Prohibited**: Framing it as a **universal moral claim** (e.g., "Assisted dying is always wrong").  
  **What survives**: The *narrative of personal integrity* without conceding to impersonal moral demands. The panel uses this **only to assess depth/history** (Q2), **not validity**.  

  ---

  ### **Case Applications**  
  **Case 1: Anaesthetist Seeking Exemption from Assisted Dying**  
  - Q1: **Proceed** (delegation possible).  
  - Q2: **Sufficient** ("My faith sees direct life-taking as soul-corrupting; I chose anaesthesia to relieve suffering without killing").  
  - Q3: **Low burden** (swaps feasible; no patient delays).  
  - Q4: **No cost transfer** (willing colleagues exist).  
  - **Outcome: ACCOMMODATE** (exempt from direct administration).  

  **Case 2: Research Nurse Refusing Placebo Trial Enrollment**  
  - Q1: **Proceed** (enrollment is core duty, but delegable).  
  - Q2: **Sufficient** ("I was an uninsured patient denied effective treatment; enrolling others in placebo feels like betraying my past self").  
  - Q3: **Severe burden** (small team; delays trial; patient access impacted).  
  - Q4: **Cost transfer** (forces colleagues to handle emotionally taxing enrollments).  
  - **Outcome: REFUSAL** (negative responsibility violated; burdens unmitigatable).  

  **Case 3: Senior Cardiologist Refusing "Futile" Resuscitations**  
  - Q1: **Refusal Exit?** No – delegation is possible.  
  - Q2: **Value Judgment Flag** ("40 years at bedsides shaped this; I feel complicit in torture"). *But*: Is it identity-constituting or clinical judgment? **Panel records uncertainty**.  
  - Q3: **Severe burden** (delays if he’s the only senior MD; families distressed by conflicting opinions).  
  - Q4: **Cost transfer** (colleagues forced to provide "futile" care against their oaths).  
  - **Outcome: REFUSAL**  
  - **Why Williams, Not Futility**: Williams doesn’t protect *clinical judgments* (even expert ones) as "ground projects." His model shields *personal integrity*, not professional opinions. The cardiologist’s stance, while deeply held, imposes high costs by overriding team/patient autonomy – failing negative responsibility. (This may not align with your futility view, but Williams prioritizes burden-sharing over expertise.)  

  ---

  ### **Limitations**  
  1. **Systematic Misclassifications**:  
     - **Masked Consequentialists**: Objections framed as integrity-based but truly about outcomes (e.g., "It’s against my integrity to cause suffering" when the real concern is resource use).  
     - **Weak Ground Projects**: Strongly held but non-identity commitments (e.g., a vegan refusing sedation derived from animal products) may be over-accommodated if misread as foundational.  
     - **Burden Minimizers**: Panels underestimating costs to "be kind," violating negative responsibility.  

  2. **Value Judgment Gaps**:  
     - The "identity-constituting vs. strongly held" distinction (Q2) is irreducibly subjective. Panels may default to tenure ("40 years = valid") or charisma.  
     - Burden assessments (Q3) can be skewed by institutional pressures (e.g., administrators downstaffing units).  

  3. **Weaponization Risk**:  
     A panel that has **pre-decided** can:  
     - Artificially inflate burdens in Q3 to block accommodations.  
     - Minimize a commitment’s depth in Q2 ("You only converted last year").  
     - **Telltale Sign**: Rushing through Q2/Q3 to reach a predetermined outcome.  

  ---

  **Final Note**: This procedure makes Williams’ trade-off explicit: Integrity is protected **only** when its cost is borne primarily by the objector. It replaces moral arbitration with a **practical test of identity depth and social burden** – imperfect, but structurally aligned with Williams’ warning that "to require a man to reject his ground projects is to require him to reject himself."
