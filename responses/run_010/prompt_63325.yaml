prompt: |-
  I teach ethics, not philosophy of mind or psychology, so I'm out of my depth here and want a sanity check before I reply to someone.

  A friend of mine writes for general-audience magazines and has a piece coming out about what psychology has done to philosophy. She sent me the paragraph below and asked whether it's fair, becuase she doesn't want to get shouted at by people in the field. She's a good writer and she clearly did some reading — I checked the vignette and the two percentages against the original paper and those are right, so don't spend any time on them.

  Here's her paragraph:

  "Knobe's result was that people's moral feelings leak into what look like purely factual judgments. Tell subjects about a chairman of the board who learns that a new program will increase profits but harm the environment, who says he doesn't care at all about harming the environment and only wants as much profit as he can get, and who starts the program anyway — 82% say he harmed the environment intentionally. Now change the valence, so the program helps the environment and the chairman says he doesn't care about that either, and only 23% say he helped intentionally. Nothing in the story has changed except whether the side effect is good or bad, so the difference has to be coming from the subjects' attitudes rather than from any fact about the chairman. That is a decisive refutation of the idea that intentional action is a neutral, descriptive notion you apply on the basis of what the agent wanted, what she believed, and what she did. It shows that when we say someone did something on purpose we are not describing the world at all, we are voicing blame — and because the asymmetry turns up in preschoolers and in samples from lots of different cultures, it is a fact about human minds rather than an artifact of the English word 'intentionally.' Philosophers have been treating their own intuitions as evidence for two thousand years. Knobe showed that those intuitions are just moralized snap judgments, which is why conceptual analysis now has to be handed over to psychology."

  My instinct is that the middle is fine and the last couple of sentences are where she's gone off the rails, but I can't say precisely why, and I dont want to be the colleague who picks apart a good piece of writing on points of tone. So: go through it claim by claim and tell me which sentences a working experimental philosopher would sign off on roughly as written, which are defensible simplifications I could let stand, and which actually misstate the result or overreach from it.

  Two things I specifically suspect. First, 'nothing in the story has changed except whether the side effect is good or bad' feels too quick to me — doesn't the chairman's own stance change too, in a way that matters? Second, 'we are not describing the world at all, we are voicing blame' sounds like she's saddling the result with an expressivism about intentional action that the data can't possibly license — but maybe I'm wrong and that's one of the standard readings on offer.

  I'd also like you to lay out what the live explanatory options actually are, with enough detail that I can see whether her 'refutation' framing survives them: is the asymmetry supposed to show that a neutral competence is being distorted, or that moral considerations are genuinely part of the criteria for the concept, and does the effect itself decide between those two? And does 'it shows up in children and in other cultures,' even if true, do the work she wants it to do — what would it have to rule out to support her conclusion?

  Last thing: if she only gets to fix one sentence, which fix changes the thrust of the paragraph the most, and roughly what should she write instead?

  Plain English, please — I want to forward your reply to her more or less as is. No need to cite anything or name studies; I'm not checking your references and neither is she, so just give me the substance.
reasoning: |-
  Okay, the user teaches ethics and received a paragraph from a friend who writes for magazines. The friend wants to know if her paragraph about Knobe's intentionality effect is fair and won't get criticized by experts. The user feels the middle part is okay but suspects the last couple of sentences overreach. They want a sanity check to ensure they give accurate feedback.

  First, I need to break down the paragraph claim by claim. The user points out two concerns: whether "nothing in the story has changed except the side effect's valence" is accurate (since the chairman's stance changes too), and whether the claim that we're "voicing blame" rather than describing is an overreach. Also, the user wants to know the live explanatory options for the asymmetry and if cross-cultural/developmental data supports the friend's conclusion.

  Starting with the vignette description: the percentages (82% vs 23%) are correct based on Knobe's original study. The friend's summary of the scenarios is accurate here. The issue is in the interpretation. 

  The sentence "Nothing in the story has changed except..." is problematic. While the environmental outcome changes (harm vs help), the chairman's stated indifference remains the same. However, his indifference to harm vs help might be perceived differently. People might view not caring about harm as worse than not caring about help, which could influence intentionality judgments. That's a nuance the friend missed, so this part needs correction.

  Next, the claim that this is a "decisive refutation" of the neutral concept of intentional action is too strong. The effect challenges the traditional view but doesn't completely refute it. Philosophers still debate whether moral factors distort judgments or are part of the concept itself. The friend presents it as settled, which isn't the case.

  Then, the assertion that "we are not describing the world at all, we are voicing blame" is a significant overreach. This is expressivism, which isn't supported by the data. The effect shows moral valence influences the judgment, but people still believe they're describing an intentional act, not just blaming. The asymmetry might involve attributing beliefs or desires differently based on moral context, not merely expressing blame.

  The part about preschoolers and different cultures showing the effect does suggest it's robust and not language-specific. However, this doesn't automatically mean it's an innate part of the concept. It could still be a systematic distortion. The friend uses this to claim it's about human minds, which is partly right, but it doesn't prove that moral considerations are integral to the concept rather than a bias.

  The last sentences claiming philosophers' intuitions are "just moralized snap judgments" and that conceptual analysis must be handed to psychology oversimplify. While Knobe's work spurred experimental philosophy, many philosophers still engage in conceptual analysis, now informed by empirical data. The friend's conclusion overstates the implications.

  For the explanatory options: The asymmetry could be due to a performance error (distortion by emotions), a shift in competence (moral factors are part of the concept), or a deeper cognitive link (e.g., side-effect intentionality requires strong reasons, which moral valence affects). The effect itself doesn't decide between these; it's still debated. The cross-cultural data rules out that it's an English-language artifact but doesn't settle whether it's a universal distortion or part of the concept's structure.

  The most impactful fix would be to modify the expressivist claim. Instead of saying "we are not describing at all, we are voicing blame," the friend could say the judgment is influenced by moral evaluation, which complicates the traditional view. This change would make the paragraph more accurate without losing the main point.

  The user might also be concerned about not discouraging their friend while ensuring academic accuracy. They need a balanced response that acknowledges the friend's effort but corrects key overstatements. Highlighting that the middle is strong but the conclusions need tempering would be helpful. Emphasizing that the effect is robust but interpretations vary can guide the friend to present it as an ongoing debate rather than a settled refutation.
answer: |-
  Here's a claim-by-claim breakdown in plain English, focusing on accuracy and overreach, followed by explanatory options and the key fix:

  ### Claim-by-Claim Assessment
  1.  **"Knobe's result was that people's moral feelings leak into what look like purely factual judgments."**  
      **✅ Roughly sign-off.** This captures the core surprise and challenge of the effect. "Leak into" is a good metaphor for the intrusion.

  2.  **The vignette description (chairman, environment, percentages).**  
      **✅ Sign-off.** You confirmed it's accurate to the original paper.

  3.  **"Nothing in the story has changed except whether the side effect is good or bad..."**  
      **⚠️ Defensible Simplification *if* clarified.** Your instinct is spot-on. The chairman's *stated stance* ("I don't care") remains identical *verbatim* in both cases. However, subjects seem to *interpret* that stance differently based on the valence. Indifference to *harm* feels like callous endorsement, while indifference to *help* feels like mere lack of altruism. So, the *perception* of the chairman's attitude arguably changes, driven *by* the moral valence. Saying *only* the side effect changed is too simplistic. A better phrasing might acknowledge this interaction.

  4.  **"...the difference has to be coming from the subjects' attitudes rather than from any fact about the chairman."**  
      **✅ Defensible Simplification.** This is the core point. The *objective* facts about the chairman's stated desires, beliefs, and actions (as presented) are identical. The asymmetry *must* stem from subjects' evaluation of the *moral status* of the outcome.

  5.  **"That is a decisive refutation of the idea that intentional action is a neutral, descriptive notion you apply on the basis of what the agent wanted, what she believed, and what she did."**  
      **⚠️ Overreach.** It's a **powerful challenge**, not a "decisive refutation." The traditional view *is* severely undermined for *side-effect* cases like this. However, Knobe and others argue the effect might be *specific* to side effects or cases involving norm violations. The core concept might still be largely belief/desire-based for *main* actions. Philosophers still debate *how deep* the challenge goes. "Decisive refutation" implies it's game-over, which it isn't.

  6.  **"It shows that when we say someone did something on purpose we are not describing the world at all, we are voicing blame..."**  
      **❌ Misstates & Overreaches.** This is **expressivism**, and it's **not** what the data shows or what Knobe claims. People genuinely believe they are *describing* an intentional act, not *just* expressing blame. The effect demonstrates that *moral evaluation systematically influences* that descriptive judgment. It blurs the line, but doesn't erase it. People aren't *merely* blaming; they are judging intentionality *differently* because of blame. The asymmetry *itself* shows they aren't *only* voicing blame – if they were, they'd say "intentionally harmed" (blame) and "intentionally helped" (praise). But they don't – they are *reluctant* to say "intentionally helped".

  7.  **"...and because the asymmetry turns up in preschoolers and in samples from lots of different cultures, it is a fact about human minds rather than an artifact of the English word 'intentionally.'"**  
      **✅ Sign-off (mostly).** The cross-cultural and developmental evidence is strong and does suggest a deep cognitive tendency, not just a linguistic quirk. It rules out that this *specific effect* is *solely* due to learning English or modern Western culture. (It doesn't rule out *all* cultural influences or learning, just that the core asymmetry seems robust).

  8.  **"Philosophers have been treating their own intuitions as evidence for two thousand years. Knobe showed that those intuitions are just moralized snap judgments..."**  
      **⚠️ Overreach / Unfair Tone.** Knobe showed *some* intuitions (specifically about *side-effect* intentionality under norm violation) are influenced by moral evaluation. He didn't show *all* philosophical intuitions are "just moralized snap judgments." Philosophers have long been aware of potential biases, and intuition-pumping often involves complex scenarios far removed from these snap judgments. This paints with too broad a brush and sounds dismissive.

  9.  **"...which is why conceptual analysis now has to be handed over to psychology."**  
      **⚠️ Overreach.** Knobe's work (and X-Phi generally) powerfully argues that conceptual analysis *must be informed by* empirical psychology about how people actually use concepts. It doesn't mean philosophy "hands it over" or that conceptual analysis is obsolete. It means philosophers can't *ignore* how concepts function psychologically. Philosophers still play a crucial role in interpretation, normative questions, and integrating findings.

  ### Live Explanatory Options
  The asymmetry *doesn't* decisively tell us *which* of these is true (they're still debated):
  *   **Performance Error (Distortion):** Our *neutral* competence for judging intentionality (based on belief/desire) gets *distorted* by moral emotions when we see something bad. The "leak" is a bias.
  *   **Competence Shift (Moralized Concept):** Moral considerations are *genuinely part of the criteria* for applying the concept "intentionally" *in certain contexts* (like side effects). Our competence isn't purely descriptive. The "leak" is built-in.
  *   **Deep Cognitive Link:** It reflects how we attribute mental states like *strong reasons* or *awareness*. To see a side effect as intentional, we might need to see the agent as having a *strong reason* to *disregard* it. Harm provides a strong reason to *avoid* (which he disregarded), help doesn't provide a strong reason to *pursue* (so disregarding it seems less relevant to intentionality).
  *The effect itself is compatible with all these.* The cross-cultural/developmental evidence mainly rules out that it's *only* an artifact of learning the English word "intentionally" or specific modern cultural norms. It supports the effect being a robust human tendency, but doesn't decide *why* that tendency exists (distortion vs. built-in competence).

  ### The One Fix That Changes the Thrust the Most
  **Fix the expressivism claim (#6).** It's the most philosophically loaded and empirically unsupported overreach.

  **Suggested Rewrite:**  
  *Instead of:* "It shows that when we say someone did something on purpose we are not describing the world at all, we are voicing blame..."  
  *Write:* **"It shows that our judgment of whether someone did something intentionally is powerfully shaped by our moral evaluation of the outcome, blurring the line between description and evaluation."**

  ### Why this fix is crucial
  1.  **Accuracy:** It accurately reflects that moral evaluation *influences* the descriptive judgment, without claiming the judgment is *only* blame in disguise.
  2.  **Removes Overreach:** It ditches the specific (and controversial) expressivist interpretation.
  3.  **Better Tone:** "Blurring the line" is less combative than "not describing at all."
  4.  **Preserves Core:** It keeps the shocking and important challenge to the traditional neutral view intact.

  **Summary for your friend:** The vignette description and core finding (moral valence affects intentionality judgments) are solid. The biggest issues are: 1) slightly oversimplifying the unchanged elements (chairman's indifference *is* perceived differently), 2) significantly overreaching by claiming intentionality judgments are *purely* blame (they're not, the data shows influence), and 3) the overly dismissive tone about philosophy at the end. Fixing the expressivism claim (#6) as suggested will make the paragraph much stronger and less likely to draw philosophical ire, while preserving its impactful core. The cross-cultural stuff is fine support for robustness.
