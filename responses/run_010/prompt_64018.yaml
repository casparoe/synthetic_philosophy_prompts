prompt: |-
  Third year, philosophy of psychiatry, and I've just realised I've spent two years arguing about looping effects without ever pinning down what a theory of them is actually supposed to do. So write me the spec: the desiderata any adequate account of the interaction between classifications of people and the people classified has to meet. Hacking's setup, as I take it: indifferent kinds like quarks or granite don't care how we sort them, but kinds of people do, because once you're inside the category you can describe yourself with it, resist it, organise around it — and then the category has to move to keep up with what it helped produce.

  Purpose first, so adequacy isn't floating free: I want a theory good enough that a revision committee could use it — something that tells you, of a candidate diagnostic category, whether introducing, renaming, narrowing or retiring it will change who falls under it and what those people are like, and whether that change counts as a cost or a gain. That's deliberately normative, which isn't how Hacking usually gets read; he's descriptive and faintly ironic about the whole business. So part of the job is telling me what extra burden a theory picks up when it's used as a criterion of validity rather than just as a phenomenon to notice.

  Now the list, with the case or consideration behind every item, and each one marked as non-negotiable or as the preference of a particular camp. Cases it has to get right, at minimum: multiple personality, where a category appears, flowers and all but vanishes inside a generation; the 1973 decision on homosexuality in the DSM, where the people in the category organised and changed it from the outside, and where it matters whether there was a fact of the matter before the vote; the current wave of adult self-identification with ADHD and autism, where the loop runs through short-form video rather than through a clinic, so the classifier is a recommendation system and not a doctor; a proposed subtype whose name got into parent forums and the press long before anyone had data on it, and which then reshaped how the teenagers who heard it described themselves; and at least one category that doesn't loop, because the theory has to be able to say why, or else everything is interactive and the thesis is empty. That last one might be the requirement that does the most excluding — tell me if it is.

  Distinctions it must not collapse: made-up versus not real; a loop that changes the extension of a category versus a loop that changes its content; a kind that genuinely loops versus one that's merely socially patterned or stigmatised; and self-understanding altering behaviour versus behaviour altering classification. Things it must stay consistent with: the relative stability of some core presentations across cultures and decades; the fact that clinicians can be right about a patient who lived before the label existed; and the fact that the same label loops differently in the clinic, the school, the courtroom and the welfare office.

  Then tell me where the list breaks. My suspicion is that strong constitution (the kind is partly made of the classified people's own self-understandings), predictive usefulness for the committee, and retrospective truth about pre-label cases can't all be had together — but if the real unsatisfiable cluster is somewhere else, say so, since that's the bit I most want.

  Finish with three or four lines per contender — realist/naturalist kinds talk, strong social constructionism, and quietism about the whole thing — scored against the list only. No reading list, I've got one. And please write the whole thing in British English; my supervisor notices.
reasoning: |-
  Okay, the user is a third-year philosophy of psychiatry student grappling with the concept of looping effects in psychiatric classifications. They've spent two years discussing it but feel they haven't pinned down what a theory of looping effects should actually accomplish. Their main request is for a specification (spec) of desiderata that any adequate account must meet. 

  The core setup here is Ian Hacking's idea: unlike natural kinds (quarks, granite), human kinds react to their classifications. When people are categorized, they can adopt, resist, or reorganize around the label, forcing the category itself to evolve. The user wants this theory to be practical—something a revision committee could use to evaluate diagnostic categories. They emphasize this is deliberately normative (assessing costs/gains), whereas Hacking is often seen as descriptive and ironic. 

  The user provides a detailed list of requirements. They want: 
  - A minimum set of case studies the theory must handle (multiple personality disorder, DSM homosexuality decision, ADHD/autism TikTok phenomenon, pre-emptive subtype naming affecting behavior, and at least one non-looping category). 
  - Key distinctions the theory must preserve (e.g., made-up vs. unreal, extension vs. content changes). 
  - Consistency with certain realities (clinical stability across cultures, accurate retroactive diagnosis). 
  - A focus on where the desiderata might conflict—especially "strong constitution" (categories shaped by self-understanding), predictive utility for committees, and retroactive truth. 

  They also want a brief scored comparison of three approaches: realism/naturalism, strong social constructionism, and quietism. And they insist on British English. 

  The user's unspoken needs seem to be: 
  1. **Clarity amid frustration**: They’re tired of abstract debates and want concrete criteria to anchor discussions. 
  2. **Practical validation**: They hint at disillusionment ("two years arguing without pinning down"), so the spec must feel actionable, not just theoretical. 
  3. **Critical edge**: The demand for normative weight (costs/gains) suggests they want tools to challenge psychiatric authority, not just describe it. 
  4. **Avoiding traps**: Their emphasis on non-looping cases and distinctions (e.g., stigma vs. looping) shows they’ve seen theories overextend or become trivial. 
  5. **Supervisor approval**: The British English note implies they need academic rigor for formal work. 

  The challenge is balancing their philosophical depth with practicality. The spec must be rigorous enough for academia but focused on committee usability. The biggest tension they spot—strong constitution vs. predictive utility vs. retroactive truth—is astute: if categories are co-created by subjects, how can they be "true" for past cases where the label didn’t exist? I’ll need to show why this trio strains coherence. 

  For the contender scoring: 
  - **Realism** will struggle with looping cases but ace stability/retroactive truth. 
  - **Strong constructionism** handles looping fluidly but collapses distinctions and denies stability. 
  - **Quietism** dodges all problems but offers no committee guidance. 

  The non-looping category requirement (e.g., dementia) is indeed the hardest filter—many theories implode here. I’ll flag that explicitly. 

  Finally, the British English request means checking for "-ise" spellings, "distinction" over "distinctness," and phrasing like "grade" instead of "score."
answer: |-
  Here’s the specification for an adequate theory of looping effects in psychiatric classification, structured as requested. Desiderata are grouped, with non-negotiable items (★) and camp-specific preferences noted. British English maintained throughout.

  ---

  ### **Core Purpose: Normative Utility for Revision Committees**  
  An adequate theory must provide actionable guidance to diagnostic review bodies (e.g., DSM/ICD committees). It should predict whether introducing, revising, or retiring a category will:  
  (i) Alter *who* falls under it (extension) and *what they are like* (intension),  
  (ii) Evaluate whether such changes constitute epistemic, clinical, or social *costs or gains*.  
  ★ **Normative Burden**: Beyond Hacking’s descriptive focus, the theory must explicitly justify *why* certain loops are deleterious (e.g., pathologising identity) or beneficial (e.g., enabling solidarity), grounding this in ethical/epistemic norms (e.g., autonomy, predictive validity).  

  ---

  ### **Desiderata: What the Theory Must Achieve**  
  1. **Case Coverage** (★ Non-negotiable minimum):  
     - **Multiple Personality Disorder (MPD)**: Explain rapid category emergence, therapeutic amplification, and collapse.  
     - **DSM-III Homosexuality Declassification (1973)**: Account for activism-driven change and whether homosexuality was "always non-pathological" or *made so* by the loop.  
     - **ADHD/Autism Self-Diagnosis via Social Media**: Model loops where classifiers are algorithms/peers, not clinicians, altering access and self-conception.  
     - **Pre-emptive Subtypes (e.g., "PDA Autism")**: Explain how premature publicity reshapes behaviour *before* formalisation.  
     - **At Least One Non-Looping Category (e.g., Lewy Body Dementia)**: ★ Justify why some categories (often biologically anchored) resist feedback loops despite stigma. *This likely excludes overly expansive theories*.  

  2. **Critical Distinctions** (★ Non-negotiable):  
     - **"Made-up" vs. "Not Real"**: A category can be socially constructed *without* being ontologically empty (e.g., "hysteria" was constructed but had real effects).  
     - **Extension vs. Content Loops**: Distinguish loops altering *who* is classified (e.g., broadening ADHD via TikTok) from those altering *what the category means* (e.g., "neurodiversity" reframing autism).  
     - **Genuine Looping vs. Mere Stigma**: Stigma (e.g., schizophrenia) may cause harm without the dynamic feedback of self-aware classification (e.g., "queer" reclamation).  
     - **Self-Understanding → Behaviour vs. Behaviour → Classification**: Directionality matters (e.g., transgender identity driving diagnostic change vs. trauma symptoms driving PTSD criteria).  

  3. **Consistency Constraints** (★ Non-negotiable):  
     - **Cross-Cultural Stability**: Explain stable core presentations (e.g., psychotic hallucinations across eras) alongside cultural variants (e.g., "running amok" vs. panic disorder).  
     - **Retroactive Validity**: Clinicians *can* accurately diagnose pre-label cases (e.g., retrospective ADHD in historical figures).  
     - **Contextual Variation**: The same label (e.g., "conduct disorder") must loop differently in clinics (treatment), schools (exclusion), courts (sentencing), and welfare systems (entitlements).  

  ---

  ### **Where the List Breaks: The Unresolvable Tension**  
  Your suspicion is correct. The triad of **strong constitution** (categories co-created by classified people’s self-understandings), **predictive usefulness** (for committees), and **retroactive truth** (pre-label accuracy) generates inconsistency:  
  - Strong constitution implies categories are *always* mutable via self-understanding → undermines retroactive truth (past people lacked our categories).  
  - Predictive utility requires stable criteria → clashes with strong constitution’s dynamism.  
  - Retroactive truth prescribes fixed natural kinds → negates strong constitution.  
  **The fault line**: Theories prioritising retroactive truth (e.g., realism) sacrifice predictive utility in looping contexts; those prioritising strong constitution (e.g., constructionism) struggle with cross-temporal accuracy.  

  ---

  ### **Contenders Scored Against the Spec**  
  1. **Realism/Naturalism** (e.g., Murphy, Boorse):  
     - ✅ Excels at retroactive truth, cross-cultural stability, non-looping cases.  
     - ❌ Fails predictive utility: cannot model feedback loops (e.g., MPD collapse), dismisses self-understanding as irrelevant.  
     - ❌ Collapses distinctions: labels stigma as "noise," not a loop.  
     - **Verdict**: Inadequate for committees; ignores core phenomena.  

  2. **Strong Social Constructionism** (e.g., Szasz, radical Foucaultians):  
     - ✅ Captures strong constitution, activism-driven change (e.g., DSM 1973), media loops.  
     - ❌ Fails retroactive truth: denies stable pre-label realities (e.g., "homosexuality always pathological until 1973").  
     - ❌ Collapses distinctions: treats all categories as "made-up," unable to explain non-looping cases (e.g., dementia).  
     - **Verdict**: Descriptive but normatively inert; undermines clinical aims.  

  3. **Quietism** (e.g., Hacking’s ironic stance; pragmatic DSM committees):  
     - ✅ Avoids ontological commitments; acknowledges all cases descriptively.  
     - ❌ Fails normative burden: offers no guidance on costs/gains (e.g., is self-diagnosis via TikTok harmful?).  
     - ❌ Useless for committees: no predictive framework for category revision.  
     - **Verdict**: Philosophically coherent but practically vacuous.  

  ---

  ### **Conclusion**  
  No contender satisfies all desiderata. The **non-looping cases** requirement is indeed the sharpest filter, eliminating constructionism. The **triad tension** (constitution/prediction/retrospection) remains unresolved. An adequate theory might:  
  - Hybridise *modest realism* (allowing stability) with *dynamic nominalism* (modelling loops),  
  - Use *mechanistic models* (e.g., network theory) to predict loops contextually,  
  - Explicitly *normativise* looping outcomes (e.g., does a loop empower or pathologise?).  
  Until then, committees lack a rigorous framework—hence your two years of inconclusive debate.
