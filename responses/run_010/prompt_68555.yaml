prompt: |-
  I've been trying to figure out what I actually think about taking other people's word on aesthetic matters and my verdicts are a mess. Here they are.

  My best friend, whose taste in music I trust completely, says a new record is the best thing she's heard all year. I don't come to think the record is great — I just think she's probably right and now I want to hear it. Not fine to believe it on her word.

  Same friend, same record, says the second track modulates somewhere it shouldn't and that's why it drags. I've never heard the track, but I'm perfectly happy to believe it drags. That one feels fine, and I can't say why.

  A critic whose palate I trust says a tasting menu is superb. I book the table without hesitation. Acting on the testimony seems totally normal, but I still don't feel like I *know* the meal will be superb.

  A sommelier tells me a wine has green apple in it. I taste it and now I get green apple. The testimony clearly did something, but only through the tasting, not instead of it.

  Someone tells me a joke is hilarious. Useless, no effect whatsoever.

  An art historian says a painting everyone raves about is clumsy and probably a workshop copy. I look at it and think it's gorgeous. I feel like I should defer, but I notice my actual judgment doesn't budge at all.

  And the contrast case that annoys me: someone tells me what I said to my sister was cruel, I come to believe it, I apologize. That works fine, and cruelty is a value judgment about a particular thing too.

  My tentative principle is that testimony is defective exactly when it invites me to skip the experience, and fine when it only tells me where to point my attention once I'm having it. That handles the sommelier and the dragging track, sort of handles the booking-a-table one, but it makes the art historian case come out wrong and it doesn't touch the cruelty case at all.

  Is there a principle that gets more of these, or a small set of them? Please state it precisely, tell me which of my cases motivates each clause, and then run it on cases I haven't listed — say, someone who's been blind since birth being told a sunset is beautiful, being told a proof is elegant before you read it, and being told a match you were working through was beautiful to watch. And be honest about which of my verdicts it forces me to give up, because I suspect at least one has to go.
reasoning: |-
  Okay, let me start by unpacking the user's dilemma. They're struggling with when it's acceptable to rely on others' judgments about aesthetic matters versus when they feel they need direct experience. Their examples show a pattern: sometimes testimony feels legitimate, other times it doesn’t, and they want a coherent principle to explain why.

  First, I need to break down each case. The music record example is interesting. When the friend says it's the best record, the user doesn't believe it’s great but wants to hear it. That suggests a reluctance to form a belief without personal experience. But when the friend points out a specific flaw in a track, they accept that without hearing it. Why is that different? Maybe because the flaw is a technical detail, something objective that doesn’t require personal aesthetic engagement.

  Then there's the critic recommending a tasting menu. The user acts on it by booking a table but doesn’t feel they *know* it's superb. Acting on testimony is fine here, but belief isn’t formed until after the experience. The sommelier case is clearer: the testimony directs attention, enhancing the experience rather than replacing it. The joke being hilarious does nothing, probably because humor is too subjective and immediate.

  The art historian example is tricky. The expert says the painting is clumsy, but the user still finds it gorgeous. They feel they should defer but can’t. This highlights a conflict between expert authority and personal perception. The cruelty case stands out because it’s a moral judgment, not aesthetic, and testimony works there. The user’s tentative principle about skipping experience vs. directing attention makes sense but fails in the art case and doesn’t address the cruelty example.

  I recall philosophical concepts like aesthetic testimony. Some argue that aesthetic judgments require first-hand experience because they’re subjective. But why do some testimonies, like the technical flaw in music, feel acceptable? Maybe it’s about the type of judgment: descriptive vs. evaluative. The flaw is descriptive (modulation causing drag), while the record being great is evaluative. Similarly, the sommelier’s note about green apple is descriptive, guiding the tasting. The cruelty case involves descriptive facts (what was said) leading to an evaluative judgment, which testimony can support because it’s about interpreting actions.

  So a principle could be: Testimony is reliable for descriptive claims that inform aesthetic experiences but not for evaluative judgments, which require personal engagement. The cruelty case works because it mixes descriptive elements (the words spoken) with moral evaluation, where testimony can bridge the gap through shared norms.

  Testing this on the sunset example: Telling a blind person a sunset is beautiful might convey a fact, but they can’t experience it, so no belief in the beauty forms. The proof's elegance requires understanding the proof, so testimony beforehand doesn’t help. The match being beautiful can be believed if the person watched it, as testimony highlights aspects to appreciate.

  This principle would require the user to accept that in the art historian case, their personal experience overrides testimony because evaluation is involved. Also, the cruelty case is different as it’s not purely aesthetic. The user might need to adjust their view on when testimony replaces experience versus supplements it.
answer: |-
  Here's a precise principle designed to handle your cases, built on the core insight that aesthetic testimony *can* transfer **descriptive facts** and **direct attention**, but **cannot directly transfer evaluative aesthetic judgments** requiring first-person phenomenal experience:

  **The Principle of Aesthetic Testimony:**
  1.  **Testimony is reliable for conveying *descriptive features* (technical properties, sensory components, historical facts) relevant to an aesthetic object.**
      *   *Motivated by:* Your friend identifying the modulation flaw (a technical property) and the sommelier identifying "green apple" (a sensory component). These are facts *about* the object that don't require you to share the evaluative judgment yet.
  2.  **Testimony can provide *action-guiding reasons* based on trust in the source's judgment or taste.**
      *   *Motivated by:* Booking the table based on the critic's review. You don't *know* it's superb, but you have a strong reason to act (seek the experience). Also motivated by wanting to hear the record based on your friend's judgment.
  3.  **Testimony *cannot* directly induce genuine *evaluative aesthetic belief* (belief that X is beautiful, superb, clumsy, dragging *as an aesthetic experience*). Such belief requires first-person phenomenal engagement with the object.**
      *   *Motivated by:* Your inability to *believe* the record is great solely on testimony, your unchanged judgment about the painting despite the art historian's claim, and the uselessness of being told a joke is hilarious.
  4.  **Testimony *can* alter evaluative aesthetic belief *after* or *during* phenomenal engagement by highlighting descriptive features or offering an interpretation that reshapes the experience.**
      *   *Motivated by:* The sommelier's testimony changing your *experience* of the taste *while* tasting. The friend's comment about the modulation might make you *notice* the drag *when* you listen.
  5.  **Non-aesthetic value judgments (e.g., moral judgments) are governed by different norms; testimony *can* directly induce belief in these judgments if the source is trusted and the judgment is accessible through reason/description.**
      *   *Motivated by:* The cruelty case. Cruelty, while evaluative, relies on facts about actions, intentions, and consequences that can be described and reasoned about intersubjectively without requiring a specific phenomenal experience of the act itself.

  **Running the Principle on Your Cases:**

  1.  **Friend: Record is best thing all year.**
      *   **Principle:** Clause 3 applies. You *cannot* form the genuine evaluative belief "this record is great" solely on testimony. Clause 2 applies: It gives you a strong action-guiding reason to seek the experience.
      *   **Verdict:** Matches your intuition (Not fine to believe on her word, but fine to act).
  2.  **Friend: Second track drags due to modulation.**
      *   **Principle:** Clause 1 applies. The modulation flaw is a descriptive/technical feature. Testimony reliably conveys this fact. Clause 4 applies: This testimony *will likely* shape your experience *when* you hear it, making you perceive the drag.
      *   **Verdict:** Matches your intuition (Feels fine to believe).
  3.  **Critic: Tasting menu superb. Book table.**
      *   **Principle:** Clause 2 applies. Testimony provides a strong action-guiding reason (book the table). Clause 3 applies: You do *not* form the genuine evaluative belief "it is superb" before experiencing it.
      *   **Verdict:** Matches your intuition (Acting normal, but not knowing).
  4.  **Sommelier: Wine has green apple. You taste it.**
      *   **Principle:** Clause 1 applies. "Green apple" is a sensory descriptor. Clause 4 applies: The testimony directly shapes your *phenomenal experience during engagement*, altering your perception/taste.
      *   **Verdict:** Matches your intuition (Testimony works *through* experience).
  5.  **Joke is hilarious.**
      *   **Principle:** Clause 3 applies strongly. The core of humor is its phenomenal, affective punch upon comprehension. Testimony cannot transfer "hilariousness" without the experience of getting/feeling the joke.
      *   **Verdict:** Matches your intuition (Useless).
  6.  **Art Historian: Painting is clumsy/copy. You find it gorgeous.**
      *   **Principle:** Clause 1 applies: The claim it's a copy is a historical/attribution fact – testimony *could* make you believe *that*. Clause 3 applies: The evaluative judgment "clumsy" cannot be transferred by testimony; your phenomenal experience ("gorgeous") dominates. The principle *doesn't* require you to defer evaluatively just because the source is an expert.
      *   **Verdict:** Matches your intuition (Judgment doesn't budge). **This is where your tentative principle failed – mine allows your judgment to stand.** You *might* come to believe it's a copy, but that won't necessarily change your aesthetic evaluation of it *as experienced*.
  7.  **Cruelty: Told what you said was cruel, believe it, apologize.**
      *   **Principle:** Clause 5 applies. Cruelty is a moral judgment. The facts (what you said, the context, your sister's reaction) can be described and reasoned about intersubjectively. Testimony from a trusted source *can* directly lead you to believe the evaluative judgment "that was cruel" and motivate action (apology).
      *   **Verdict:** Matches your intuition (Works fine). **This case is handled by the exception in Clause 5.**

  **Running on New Cases:**

  1.  **Blind person told a sunset is beautiful.**
      *   **Principle:** Clause 3 applies strictly. The blind person lacks the capacity for the requisite phenomenal experience (sight of colors, light, form). Testimony *cannot* induce the genuine aesthetic belief "the sunset is beautiful." They might learn it's *called* beautiful, understand it involves light/color, and believe others find it beautiful (Clause 1/2), but they cannot form the *first-person aesthetic evaluative belief*.
  2.  **Told a proof is elegant before you read it.**
      *   **Principle:** Similar to the record or meal. Clause 2: Testimony gives you a reason to study the proof. Clause 3: You *cannot* form the genuine evaluative belief "this proof is elegant" without engaging with it intellectually. Elegance in math often involves experiencing the simplicity, ingenuity, or flow *during* comprehension. Clause 4: Once you read it, the testimony might prime you to look for and appreciate the elegance.
  3.  **Told a match you were working through was beautiful to watch.**
      *   **Principle:** If you *didn't* watch it: Clause 3 applies – you cannot form the genuine belief it *was* beautiful based solely on testimony. You can believe others found it beautiful (Clause 1/2). If you *did* watch it: Clause 4 applies – the testimony might prompt you to recall specific moments or aspects, potentially reshaping your memory/perception of the experience towards seeing its beauty.

  **Which of Your Verdicts Must Be Given Up (or Reframed)?**

  *   **The Art Historian Case:** Your *tentative principle* (testimony defective if it invites skipping experience) made you think you *should* defer but couldn't. **My principle forces you to give up the feeling that you *should* defer evaluatively.** Clause 3 explicitly says testimony *cannot* directly induce evaluative aesthetic belief; your phenomenal experience trumps the expert's testimony on the *evaluation* itself. You can believe the factual claim (it might be a copy), but your aesthetic judgment ("gorgeous") is valid based on your experience. **This is the key verdict you need to relinquish:** the idea that expertise *should* compel aesthetic deference *against* your own experience.
  *   **Cruelty Case:** Your tentative principle didn't touch it. My principle handles it via Clause 5, treating it as a different kind of judgment. You don't need to give up your verdict here; it's simply explained under a different rule.

  **In essence:** The principle draws a bright line between **facts about** aesthetic objects (transmissible), **reasons to engage** with them (transmissible), and the **first-person evaluative experience** of them (non-transmissible). The "cruelty" case falls outside the aesthetic domain, governed by intersubjective moral reasoning where testimony *is* effective. You must accept that your aesthetic judgment of the painting, based on your direct experience, is legitimate even against expert testimony declaring it clumsy.
