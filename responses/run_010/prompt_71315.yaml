answer: |-
  Here's the mesocosm, built to your specifications:

  **Scenario:** In a remote Newfoundland fishing village (population 387), the traditional practice has been that all commercial fishers undertake the final, meticulous inspection and minor repair of their nets and traps ("gear") before each season's opening in the shared, open-air community boatyard. This isn't mandated by safety regs (coast guard inspections cover seaworthiness later) or efficiency (gear works fine if prepped privately). It's a visible, communal ritual signifying readiness and mutual commitment. Recently, several younger fishers, citing convenience and privacy, have begun doing this final prep entirely in their own locked sheds. Their gear is equally sound, they fish just as hard, and no safety incidents have occurred. No one complains, finds it disgusting, or feels personally wronged. The boatyard simply feels emptier during prep week.

  **Spec Check:**

  1.  **Setting:** Realistic contemporary remote fishing village. Recognizable community dynamics and trade.
  2.  **No Harm:** No physical injury, economic loss, property damage, or psychological distress occurs. Gear is equally safe, fishing equally productive. Hart's harm principle finds no foothold.
  3.  **No Offense:** No disgust, outrage, or articulated grievance. The change is noted neutrally or with mild regret. Feinberg's offense principle is inapplicable.
  4.  **Devlin's Constitutive Case:** The **keystone norm** is "Visible, communal preparation signifying shared commitment at the season's outset." Its erosion *constitutively* damages the community *now*. The shared boatyard prep was the visible anchor for:
      *   **Harm-Preventing Norm 1:** Informal peer monitoring of gear condition (subtle glances, casual comments during communal prep prevented minor oversights).
      *   **Harm-Preventing Norm 2:** Spontaneous mutual aid during emergencies at sea (rooted in the tangible sense of shared commitment fostered *by* the ritual).
      *   **Harm-Preventing Norm 3:** Rapid, informal resolution of minor disputes over fishing grounds/lines (reliant on pre-existing trust solidified *in* that shared space/time). Without the keystone norm's observable enactment, the trust and mutual recognition underpinning these harm-preventing norms are *already* degraded ("running on nothing"). Fishers now hesitate before offering unsolicited help, disputes simmer longer, and minor gear issues go unremarked until they potentially become serious.
  5.  **Hart's Critical Morality:** Hart cannot dismiss this as mere popular disgust (absent per #3). He *must* argue the keystone norm isn't truly foundational to critical morality (the minimum content necessary for social existence). He might concede the *efficiency* loss but argue maintaining social cohesion *this specific way* isn't morally required, only the *outcomes* (safety, cooperation) are. He'd insist law should only target demonstrable harm (absent per #2), not the communal ritual sustaining the underlying trust.

  **Load-Bearing Feature:** **The specific requirement that the communal preparation be *visible* and *shared* as a signifier of commitment.** If deleted (e.g., if the ritual was purely symbolic and done privately, or if communal prep was just about convenience), the keystone norm collapses. The case reduces to harmless private behavior (prepping gear competently but privately). Hart wins easily as no constitutive damage to the social fabric mediating harm-prevention occurs. The "signifying" function is key.

  **Strongest Hartian Attack:** "You haven't proven causation, only correlation. The degradation in peer monitoring, mutual aid, and dispute resolution could stem from entirely unrelated factors – changing demographics, new technology reducing interdependence, or simply the natural evolution of social bonds in a modernizing world. The keystone norm might be a *symptom* of declining cohesion, not its cause. Law, based on evidence of harm, cannot intervene on shaky sociological conjecture about a ritual's constitutive role, especially when the alleged harmful *consequences* remain potential, not actual (#2). Enforcing visibility here is purely legal moralism."

  **Enforcement:** Devlin's position wouldn't necessarily demand *criminal* law. A weaker, restorative measure fits better: The village council, invoking its authority over communal spaces (like a zoning bylaw), could designate the boatyard as the *exclusive* permitted location for final seasonal gear prep during the traditional week, citing the preservation of communal practices vital to village cohesion and safety culture. Fines might exist, but prosecution would be rare. The goal is reinstating the observable practice, not punishment. Devlin could accept this as valid "enforcement" of a constitutive societal norm.

  **Honest Bits:**

  1.  **Toughest Constraint:** #4 (Constitutive Damage Only). Avoiding predictive language ("this *will* lead to collapse") while vividly showing present-tense constitutive damage ("the trust *is* already degraded, norms *are* running on nothing") was challenging. It required building a norm whose removal *immediately* severs the observable link sustaining *existing* harm-prevention, not just future stability. #3 (No Offense) was also hard; ensuring the act provoked *zero* articulable grievance required a norm not tied to traditional morality but to a subtle, functional social glue.
  2.  **What Would Change My Mind:** If the link between the keystone norm (visible communal prep) and the harm-preventing norms (peer monitoring, mutual aid, dispute resolution) feels forced or *only* predictive. Does the degradation *truly* happen constitutively with the norm's erosion, or is it merely *likely*? If the latter, Devlin's case reverts to prediction. The strongest Hartian attack (above) targets this exact point. If you added **"Must involve an act traditionally considered *intrinsically immoral* by the community (not just functionally important)"**, the case likely fails because that would inevitably trigger offense/disgust, violating #3 and allowing Hart to dismiss it as prejudice. Conversely, if you dropped #3 (allowed offense), a much stronger Devlin case emerges easily (e.g., public desecration of a universally revered community symbol causing deep offense but no direct harm).
