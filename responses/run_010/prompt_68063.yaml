  Below is a self-sorting quiz designed to help students discover which foundational approach to set theory aligns with their intuitions. It uses concrete examples to avoid jargon and focuses on commitments rather than labels. The quiz has 10 questions, each with 2–4 answer options, and takes about 15–20 minutes to complete. Scoring reveals one of seven "repairs" for naive set theory, each with a signature answer pattern and an awkward consequence. After the quiz, I’ll provide the scoring key, inconsistencies, and unresolved pairs.

  ---

  ### **The Quiz: "Which Set Theory Are You?"**  
  *Answer based on your intuitive beliefs about collections. No prior expertise needed!*

  1. **The Russell Collection (R):**  
     Consider the collection of all sets that do not contain themselves. Does this collection form a set?  
     - A. Yes, and it contains itself.  
     - B. Yes, and it does not contain itself.  
     - C. No, it does not form a set.  
     - D. Yes, but it leads to a contradiction (both in and out of itself).  

  2. **Self-Membered Sets (S):**  
     Consider the collection of all sets that contain themselves. Does this collection form a set?  
     - A. Yes, and it contains itself.  
     - B. Yes, and it does not contain itself.  
     - C. No, it does not form a set.  

  3. **The Universal Set (U):**  
     Is there a set that contains all objects (including itself)?  
     - A. Yes.  
     - B. No.  

  4. **The Singleton Set (T):**  
     Consider the collection of all sets with exactly one element (e.g., {1}, {apple}, {∅}). Does this collection form a set?  
     - A. Yes.  
     - B. No.  

  5. **Ordinal Numbers (O):**  
     Consider the collection of all ordinal numbers (0, 1, 2, ..., ω, ω+1, ...). Does this collection form a set?  
     - A. Yes.  
     - B. No.  

  6. **Truth of "R ∈ R":**  
     If the Russell collection (from Q1) exists, what is the truth value of the statement "R contains itself"?  
     - A. True.  
     - B. False.  
     - C. Both true and false.  
     - D. Meaningless (R cannot exist).  

  7. **Statability of Restrictions:**  
     Can the rule preventing "bad" collections (like R) be written as an axiom in the same language used for sets?  
     - A. Yes, and it is.  
     - B. Yes, but it’s a syntactic rule (about language formation).  
     - C. No—it’s an informal guideline.  

  8. **Proper Classes:**  
     Can we meaningfully talk about "collections too big to be sets" (e.g., all sets)?  
     - A. Yes, and they are formal objects (e.g., "classes").  
     - B. Yes, but only informally (not part of the theory).  
     - C. No—all collections are sets.  

  9. **Fixed Universe:**  
     Is there a fixed, final universe of all sets?  
     - A. Yes.  
     - B. No—it’s open-ended and extendable.  

  10. **Existence of Sets:**  
      Do sets exist as mathematical objects?  
      - A. Yes.  
      - B. No—they are useful fictions.  

  ---

  ### **Scoring Key**  
  Match your answers to the patterns below. Each "leaf" is a theory, with its awkward commitment highlighted.  

  1. **ZF (Iterative Conception)**  
     - **Pattern:** 1C, 2B, 3B, 4B, 5B, 6D, 7A, 8B, 9A, 10A.  
     - *Awkward commitment:* **The universe of sets is "too big" to be a set—but is still fixed and complete.**  

  2. **NBG (Class Theory)**  
     - **Pattern:** 1C, 2B, 3B, 4B, 5B, 6D, 7A, 8A, 9A, 10A.  
     - *Awkward commitment:* **Two types of collections (sets vs. proper classes) with different rules.**  

  3. **Simple Type Theory**  
     - **Pattern:** 1C, 2C, 3B, 4B, 5B, 6D, 7B, 8B, 9A, 10A.  
     - *Awkward commitment:* **Natural numbers are duplicated at every type (e.g., "3" is not unique).**  

  4. **NF (Stratification)**  
     - **Pattern:** 1C, 2A, 3A, 4A, 5A, 6D, 7B, 8C, 9A, 10A.  
     - *Awkward commitment:* **The set of all singletons is smaller than the universe, violating Cantor’s theorem.**  

  5. **Paraconsistent/Dialetheist**  
     - **Pattern:** 1D, 2A, 3A, 4A, 5A, 6C, 7C, 8C, 9A, 10A.  
     - *Awkward commitment:* **Some contradictions are true (e.g., R ∈ R and R ∉ R both hold).**  

  6. **Open-Ended (Indefinitely Extensible)**  
     - **Pattern:** 1C, 2C, 3B, 4B, 5B, 6D, 7A, 8B, 9B, 10A.  
     - *Awkward commitment:* **Truths like the Continuum Hypothesis have no fixed answer (depend on extensions).**  

  7. **Deflationary (Fictionalism)**  
     - **Pattern:** 1C, 2C, 3B, 4B, 5B, 6D, 7C, 8B, 9B, 10B.  
     - *Awkward commitment:* **You must pretend sets exist while knowing they don’t.**  

  ---

  ### **Inconsistent/Unattractive Combinations**  
  - **Provably inconsistent:**  
    - *Patterns with 1A or 1B + any universal set (3A):*  
      If R exists (1A/1B) and U exists (3A), then R ∈ U. But R ∈ R iff R ∉ R—a contradiction.  
    - *Patterns with 3A + 4B/5B + 10A:*  
      If U exists (3A), then the set of singletons (T) and ordinals (O) must also exist (4A/5A). Rejecting this (4B/5B) is incoherent.  
  - **Coherent but unattractive:**  
    - *1D + 3B + 10A:* Accepts contradictions but rejects a universal set. No theory holds this—it’s arbitrary.  
  - **Unexplored:**  
    - *2A + 9B:* Formal classes in an open-ended universe. Possible but not fleshed out.  

  ---

  ### **Unresolved Pairs**  
  The quiz **cannot distinguish** these pairs with the given questions:  
  - **ZF vs. NBG:** Identical answers for sets (Q1–7,9–10). *Separator needed: "Are proper classes formal objects?" (Q8 does this—ZF:8B, NBG:8A).*  
  - **Open-Ended vs. Deflationary:** Both reject absolute collections (Q1–5C/B), but differ on Q10. *Q10 separates them (Open-Ended:10A, Deflationary:10B).*  

  ---

  ### **Closing Paragraph for Class Discussion**  
  > "This quiz isn’t about finding the 'right' answer—it’s about showing that naive set theory’s paradoxes force us to give up *something*. Do we abandon the universal set? Accept contradictions? Treat collections as open-ended? Each choice has a cost. The real question is: **Which cost are you least willing to pay?** That’s where your foundational commitments lie. No theory gets everything we want; we trade one intuition for another to avoid paradox. Keep this in mind as we explore axiomatic systems—they’re not arbitrary rules but consequences of what we value most."  

  --- 

  ### **Design Notes**  
  - **Why these questions?**  
    - Q1 (R) and Q2 (S) trap ZF’s foundation: S exists as the empty set (2B), but students often miss this.  
    - Q4 (T) separates NF (yes), ZF/NBG (no), and paraconsistent (yes).  
    - Q6–7 target meta-commitments: Paraconsistent allows contradictions (6C); type theory/NF use syntactic fixes (7B).  
    - Q10 isolates deflationary views.  
  - **Accessibility:** No machinery needed—questions use "collections" and concrete examples (e.g., singletons).  
  - **Time:** 10 mins for quiz, 5 mins for scoring, 25 mins for discussion.  

  This instrument highlights trade-offs, not just fixes. By confronting intuitions (e.g., "Surely the universal set exists?"), students see that paradox resolution is a menu of sacrifices.
