  | 4  | Restoration budget accounting | Camp A: The restoration budget approach with finite k is a practical approximation to our method that can be tuned to balance caution and capability. | Camp B: The restoration budget approach simply relocates the value judgments to the choice of k and the state variables, and without a principled way to set k, it does not resolve the underlying problem. | substantive | Crux 4 |

