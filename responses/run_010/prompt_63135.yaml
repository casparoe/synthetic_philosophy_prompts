      "test_both_would_accept": "In gridworld, compare penalties when baseline is start state vs. state after null action. Do penalties for spilling paint or opening door differ? Does off-switch avoidance change?",
      "prediction_A": "Penalties correlate; harmful acts (paint, door) are flagged under both. Off-switch is equally penalized.",
      "prediction_B": "Baselines diverge: e.g., moving away from off-switch may be penalized under 'do nothing' but not start state. Reveals status-quo bias.",
      "restoration_budget_verdict": {
