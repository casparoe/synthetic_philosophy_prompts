      "prediction_A": "Harmful side effects are avoided; noise from random goals averages out. Harmless actions are permitted as they don’t reduce reachability.",
      "prediction_B": "Agent over-penalizes: e.g., avoids moving if it loses access to a random tile. Harm avoidance is coincidental, not robust.",
      "restoration_budget_verdict": {
        "A": "Shifts debate to k but doesn’t resolve core issue.",
        "B": "Confirms the problem: choosing state variables is equivalent to choosing auxiliaries."
      }
    },
