prompt: |-
  so I've fallen down a rabbit hole on Dennett's real patterns and the three stances, and my roommate keeps explaining the whole thing with a JPEG. his version: a belief is real the same way a JPEG is a real photo — the file is way smaller than the raw bitmap, that size difference *is* the pattern, and asking whether the pattern is really there is like asking whether the JPEG is really the picture. he uses it to argue there's no fact of the matter about whether something has beliefs, only whether the intentional-level description happens to come out shorter for you, so folk psychology is a useful fiction and people who think it's tracking something are confused.

  I can't shake the feeling the JPEG is doing something sneaky. with a JPEG you've still got the original sitting there to compare the decompressed version against, and you can actually measure how lossy you got, and I don't see what plays either role for beliefs. also he never says what happens when the physical description and the intentional one come out about the same length, which feels like it's exactly the interesting case.

  can you do the correspondence properly — what's the bitmap, what's the encoder, what's the loss, what's the file size — and then sort the places it breaks into the ones that actually threaten his conclusion vs the cosmetic ones? does "useful fiction" survive the disanalogies? and if the analogy's bad, what would be a better one — I've been toying with a map, or a shadow, or minutes of a long meeting, but I can't tell if those are any less question-begging.
