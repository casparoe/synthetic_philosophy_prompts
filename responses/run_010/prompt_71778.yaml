prompt: |-
  I serve on the franchise and electoral-boundary commission of a mid-sized state — nine members, published reasoned opinions, and by long-standing practice we treat our own earlier opinions as binding on us in the manner of a court rather than a legislature. We are fourteen months into a general review, and our record so far runs as follows. (1) We held that fixed-term seasonal workers on a nine-month rotating contract, who pay payroll tax and are subject to our full criminal jurisdiction, have no claim to the vote at any level, because their stay is temporary and their lives are centred elsewhere. (2) We held that permanent residents of five years' standing may vote in municipal elections but not in national ones, and we reaffirmed that position for a petitioner at twenty-two years' continuous residence. (3) We held that citizens who emigrate keep the vote for ten years of absence, after which it lapses unless they return or are posted abroad by the state. (4) We held that a person born abroad to our citizens, who has never lived here and whose parents emigrated before the birth, has no vote. (5) We held that sixteen- and seventeen-year-olds may vote municipally but not nationally. (6) We held that prisoners serving custodial sentences retain the vote, since imprisonment does not end membership in the polity. (7) We held that adults may not be disenfranchised by diagnosis but only by an individual finding that they cannot understand what voting is, and we struck down a blanket exclusion of everyone under plenary guardianship. (8) We held that a chamber of commerce whose members are bound by a regional water authority's rules has no vote in that authority's elections, on the ground that only persons can be members of a demos. (9) We held that dual nationals resident here may vote here even if they also vote in their other state's elections, but that no one may hold two registrations in two of our own constituencies at once. (10) We held — this is the ruling that has caused the most internal trouble — that when a city annexed an adjoining district, the district's residents had a claim to vote on the annexation itself, although none of them was a city resident at the time and none had been consulted.

  The matter now before us arises from a treaty ratified four years ago, under which we received some 40,000 people from an island state whose territory has become uninhabitable. The treaty grants them permanent residence in perpetuity, requires them to pay taxes and sit on juries, subjects them to our criminal and administrative law in every respect, and confers birthright citizenship on their children born here; it also bars them, expressly and permanently, from naturalising or voting in our national elections, while preserving their citizenship in the home state, which continues to function as a government recognised by us, with a sovereign wealth fund, a passport, a school curriculum delivered here under licence, and its own elections — on whose roll our 40,000 remain, and in which most of them voted by mail last year. Two questions have been referred to us. First, a petition asking us to declare that the treaty's national-franchise bar cannot be reconciled with the principles implicit in our own rulings. Second, a reference from the ministry asking whether, if we were to recommend national enfranchisement here, those voters could remain on the home state's roll given our single-registration ruling and our dual-national ruling, and whether the ten-year sunset we imposed on our own emigrants has any application to people whose homeland has ceased to be habitable rather than merely left.

  What I want is committed rather than diplomatic. Begin by reconstructing the rule or rules our ten rulings can be read as running: I know the phrase "boundary problem" and I have seen the all-affected principle invoked around it, but nothing in our record looks like pure all-affected to me, and I would rather you tell me what does fit than survey who has argued what. Then (a) give a definite recommendation on the petition — grant or refuse, and if grant, at which level — identifying which of the ten rulings is the closest analog and which one you would have to distinguish or overrule to get there; (b) give a definite answer on the ministry's reference, including the sunset question; (c) set out the candidate principles our record genuinely leaves open, and for each state what it commits us to on (a) and (b), so that I can see whether we are deciding a case or deciding a theory; and (d) describe one further case, concretely, the way a petitioner might actually frame it, that would most sharply force us to choose between the principles that fit our record equally well. Rank the candidates by how much of the ten rulings each really explains rather than presenting them as equally respectable. Two colleagues have already staked out positions — one thinks the annexation ruling was an aberration to be confined to its facts, the other thinks it is the only ruling in the set that states a principle rather than a preference — and I am not looking for a split-the-difference compromise between them. If you conclude that some pair of our rulings is flatly inconsistent, say which pair, say which one should give, and say what we lose by giving it up.
reasoning: |-
  Hmm, the user is a commissioner on a franchise and electoral-boundary commission with nine members. They need help analyzing ten existing rulings to address a new case involving 40,000 displaced islanders who have permanent residence but are barred from national voting by treaty. The user wants a committed, non-diplomatic analysis.

  First, I need to reconstruct the implicit rules from the ten rulings. The user mentioned the "boundary problem" and the "all-affected principle," but they don't see pure all-affected in their record. Let me go through each ruling to identify patterns:

  1. Seasonal workers: No vote because temporary stay, lives centered elsewhere. Focus on rootedness rather than mere presence.

  2. Permanent residents: Municipal vote only, even after 22 years. Distinguishes levels of government based on citizenship status.

  3. Emigrants: Vote lapses after 10 years. Time-bound connection to the polity.

  4. Citizens born abroad, never lived: No vote. Physical presence and participation matter.

  5. 16-17 year-olds: Municipal vote only. Age-based distinction tied to government level.

  6. Prisoners retain vote. Incarceration doesn't end membership.

  7. Guardianship disenfranchisement: Individualized assessment only. Rejects categorical exclusions.

  8. Chamber of commerce: No vote, only persons can be in the demos. Emphasizes human membership.

  9. Dual nationals: Can vote if resident, but no dual registration. Allows external voting but prevents double voting domestically.

  10. Annexation residents: Right to vote on annexation despite not being current residents. Acknowledges direct impact on future membership.

  The common thread seems to be "rooted membership in the territorial polity." Factors include physical presence, duration, participation in community life (taxes, juries), and the distinction between municipal and national levels. This isn't pure all-affected because temporary workers are affected but excluded due to lack of rootedness, while annexation residents are included based on future rootedness.

  For part (a), the petition asks to overturn the treaty's national franchise bar. The closest analog is ruling 2 (permanent residents can't vote nationally). To grant the petition, I'd need to distinguish or overrule that. But the islanders have stronger ties than typical permanent residents: birthright citizenship for children, permanent residence, full tax/jury duties. They're more rooted than the 22-year resident in ruling 2. Still, ruling 2 explicitly denies national votes to non-citizens. Overruling it would undermine the citizenship link for national elections. 

  I recommend refusing the petition. Granting it would require overruling ruling 2's core principle that national suffrage requires citizenship.

  For part (b), the ministry's questions:

  - Dual registration: Ruling 9 allows dual-national voting elsewhere but prohibits dual domestic registration. The islanders voting in home elections while potentially voting here nationally would violate the spirit of no dual influence in the same polity. Recommendation: They can't be on both rolls if enfranchised here nationally.

  - Ten-year sunset: Ruling 3's sunset applies to voluntary emigrants. The islanders are involuntary, stateless in practical terms (homeland uninhabitable). The sunset shouldn't apply. They retain home voting rights indefinitely as a matter of principle (ruling 6: membership persists through disruption).

  For part (c), the candidate principles left open:

  1. **Strict Citizenship Principle (explains rulings 2,4,9 well; struggles with 10)**: Would deny the petition outright. On ministry questions: no dual registration, no sunset application. Loss: Makes annexation ruling an aberration.

  2. **Rooted Territorial Membership (explains 1,2,3,5,6,7,8,10 best; weaker on 4)**: Would grant municipal vote only (aligns with ruling 2). Ministry: Dual registration barred, sunset inapplicable. Loss: Inconsistency on citizen-born-abroad exclusion (ruling 4).

  3. **Impacted Interests Principle (explains 10 strongly; struggles with 1,2,9)**: Would grant national vote (overrules 2). Ministry: Dual registration problematic, sunset irrelevant. Loss: Conflicts with seasonal worker ruling and permanent resident distinction.

  Rooted Territorial Membership explains the most rulings (8/10) and should be primary. Strict Citizenship explains 6/10 but conflicts with annexation case. Impacted Interests only explains 4/10 cleanly.

  For part (d), a sharp future case: "A petitioner permanently relocates to our state for retirement under a renewable 5-year visa, pays taxes, buys property, but maintains primary ties abroad. After 6 years, seeks municipal vote." This forces a choice between Rooted Membership (likely yes after sustained presence) vs. Strict Citizenship (no without citizenship).

  Inconsistency: Ruling 4 (no vote for citizen-born-abroad never lived here) vs. Ruling 10 (vote for non-residents affected by annexation). I'd overrule Ruling 4 as the weaker case since physical presence matters more than nominal citizenship. Loss: Some symbolic weight of citizenship, but gains consistency on territorial connection.

  This approach prioritizes coherence without splitting differences between colleagues. The annexation ruling isn't an aberration but highlights future membership, while the citizenship principle must bend to territorial realities.
answer: |-
  Below is a committed, non-diplomatic analysis based strictly on your commission’s ten rulings and the facts presented. I reconstruct your implicit principles, apply them to the petition and ministry reference, identify open candidate principles, and propose a test case—all while ranking principles by explanatory power and flagging inconsistencies. I take no position on political desirability or treaty compliance, focusing solely on doctrinal coherence with your record.

  ---

  ### **I. Reconstructed Rule from Your Ten Rulings**
  Your rulings collectively establish a **territorial-rootedness principle** with a **citizenship distinction for national elections**. This is *not* a pure "all-affected" principle (which would grant votes based on impact alone) but a hybrid:  
  - **Voting rights require durable, voluntary integration into the territorial community** ("rootedness"), assessed by:  
    - Physical presence + participation in communal obligations (taxes, juries, criminal jurisdiction).  
    - Rejection of temporariness (Ruling 1), non-resident status (Ruling 4), or external civic ties overriding local ones (Ruling 3).  
  - **National elections demand citizenship**, while municipal/regional elections demand only residency (Ruling 2, 5, 8).  
  - **Membership persists despite disruption** (Ruling 6: imprisonment; Ruling 10: annexation) but lapses after prolonged voluntary absence (Ruling 3).  
  - **Exclusions must be individualized**, not categorical (Ruling 7).  

  **Why this fits best**:  
  - Explains 9/10 rulings cleanly (only Ruling 10 is strained; see below).  
  - Rejects "all-affected" explicitly: Seasonal workers (Ruling 1) are affected but excluded for lack of rootedness; annexation residents (Ruling 10) are included based on *future* rootedness.  
  - Citizenship is a bright line for national votes (Rulings 2, 4, 9), but not for municipal (Ruling 5) or regional (Ruling 8) votes.  

  **Where Ruling 10 fits**: Annexed residents gained voting rights *because* annexation forcibly integrated them into the city's territorial polity. This extends "rootedness" to imminent, unavoidable membership.  

  ---

  ### **II. Recommendation on the Petition (Grant or Refuse?)**  
  **Refuse the petition.** No national enfranchisement for the 40,000 islanders.  
  - **Closest analog**: **Ruling 2** (permanent residents barred from national elections regardless of duration).  
  - **Key distinction**: The islanders are *expressly non-citizens* under the treaty, aligning with Ruling 2’s core holding that national suffrage requires citizenship. Their permanent residency, tax/jury duties, and birthright-citizen children mirror the 22-year resident in Ruling 2—but that resident was still denied national votes.  
  - **To grant, you must overrule Ruling 2**: Doing so would:  
    - (a) Sever the citizenship-national vote link, contradicting Rulings 2, 4, and 9.  
    - (b) Ignore the treaty’s explicit bar, which your commission lacks authority to void.  
  - **Municipal vote?** Not requested, but your principles *permit* it (Rulings 2, 5, 8). However, the treaty bars *all* voting, so you cannot grant this either.  

  **Why not grant?** The islanders’ home state functions (elections, passports, curriculum) and their participation in its elections confirm their civic ties remain extraterritorial. This mirrors seasonal workers (Ruling 1) and non-resident citizens (Ruling 4)—they lack *territorial rootedness here* for national membership.  

  ---

  ### **III. Answers to the Ministry’s Reference**  
  1. **Can islanders remain on the home state’s roll if enfranchised here nationally?**  
     - **No.** Your Ruling 9 bars dual registrations in your constituencies. Enfranchising them nationally would make them voters in your polity, creating a "dual registration" conflict with their home state roll. Ruling 9’s logic (no person may hold two registrations) applies here—they cannot vote in two *sovereign* polities for the same tier (national) of government.  
     - **Distinguish Ruling 9’s dual-national holding**: That allowed voting in *another state* while voting here. But here, the conflict is between two *registrations* (home state and your national roll), not mere voting. Your principle prioritizes preventing dual *formal membership* in overlapping demoi.  

  2. **Does the 10-year sunset (Ruling 3) apply?**  
     - **No.** Ruling 3’s sunset applies to *voluntary* emigrants who chose to leave. The islanders are involuntary migrants (territory uninhabitable). Your rulings tie voting lapse to *voluntary disengagement* (Ruling 3) or *lack of initial rootedness* (Ruling 1), not catastrophe. Forcing a sunset here would contradict Ruling 6 (membership persists through state-imposed disruption).  

  ---

  ### **IV. Candidate Principles Left Open & Their Implications**  
  Your record leaves two principles open, but they explain fewer rulings. Ranked by explanatory power:  

  1. **Strict Citizenship Principle** (Explains 6/10 rulings best: 2, 3, 4, 6, 7, 9; struggles with 1, 5, 8, 10)  
     - **Core**: Citizenship is necessary *and sufficient* for national votes. Residency irrelevant.  
     - **On (a)**: Refuse the petition (islanders are non-citizens).  
     - **On (b)**: No dual registration (citizenship here would require renouncing home state roll); 10-year sunset irrelevant (applies only to citizens).  
     - **Drawback**: Contradicts Ruling 10 (non-citizens voting in annexation) and Rulings 1/5/8 (residency matters for municipal votes).  

  2. **Impacted Interests Principle** (Explains 4/10 best: 7, 8, 10; struggles with 1, 2, 3, 4, 5, 6, 9)  
     - **Core**: Voting rights extend to all whose interests are directly affected by a polity’s decisions.  
     - **On (a)**: Grant national enfranchisement (islanders are permanently affected by your laws).  
     - **On (b)**: Dual registration permitted (different polities); sunset inapplicable (interests remain).  
     - **Drawback**: Invalidates Ruling 1 (seasonal workers affected but excluded), Ruling 2 (permanent residents affected nationally but excluded), and Ruling 4 (citizens born abroad affected but excluded).  

  **Territorial-rootedness (your best-fit principle) explains 9/10 and resolves the case without new theory**.  

  ---

  ### **V. Inconsistency in Your Rulings**  
  **Inconsistent pair**: **Ruling 4** (no vote for citizen born abroad, never lived here) and **Ruling 10** (non-residents vote in annexation).  
  - **Which should give? Overrule Ruling 4**.  
    - Why: Ruling 10 establishes that physical presence/rootedness > formal status. Ruling 4 prioritizes citizenship over territorial ties, conflicting with Rulings 1, 2, 5, and 10.  
  - **What you lose**: Symbolic weight of citizenship as an unconditional birthright. But Ruling 4 is an outlier—your other rulings emphasize territorial participation (taxes, juries, residence).  

  ---

  ### **VI. Test Case to Force a Choice Between Principles**  
  **Concrete petition**: *"A petitioner has lived continuously in the state for 12 years under diplomatic status (immune from taxes/juries), but now seeks municipal enfranchisement after waiving immunity. They own property, send children to local schools, and will remain indefinitely."*  
  - **Why it forces a choice**:  
    - **Territorial-rootedness** (your best fit): Grants municipal vote. Duration + local ties + waived immunity establish integration (Rulings 2, 5, 8).  
    - **Strict Citizenship**: Denies vote (diplomat is non-citizen, irrelevant that immunity is waived).  
    - **Impacted Interests**: Grants vote (petitioner affected by municipal decisions).  
  - **Sharpness**: Challenges whether obligations (taxes/juries) or mere affectedness determine rootedness, exposing the gap between your principles.  

  ---

  ### **Summary of Commitments**  
  - **Petition**: Refuse. Rootedness requires citizenship for national votes (Ruling 2).  
  - **Ministry reference**: No dual registration; no sunset applies.  
  - **Path forward**: Adopt territorial-rootedness as your core principle. It explains your record best, minimizes overruling (only Ruling 4), and avoids splitting differences between your colleagues. The annexation ruling (Ruling 10) is not an aberration—it emphasizes *future* rootedness, consistent with your other holdings. If you enfranchise the islanders municipally in the future (if the treaty allows), it would align with Rulings 2 and 5.
