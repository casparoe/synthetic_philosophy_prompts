answer: |-
  ## Written Opinion of the Conduct & Appeals Panel  
  **Re: Complaint Against Poet-Critic Member**  
  **Date:** 26 October 2023  

  **Brainstorming: Plausible Rulings & Their Costs**  

  1.  **Dismiss complaint against Poet-Critic solely on standing grounds ("tu quoque").**  
      *   *Finding:* The Poet-Critic’s equivalent past conduct fatally undermines her moral authority and good faith in initiating the campaign.  
      *   *Publication:* Brief statement dismissing the complaint as procedurally inadmissible.  
      *   *Cost:* Appears to weaponise technicality; fails to address substantive truth/falsity of *either* allegation; ignores institutional complicity; signals hypocrisy is an effective shield if discovered later.  

  2.  **Formally sanction Poet-Critic for uncredited collaboration, disregarding standing questions.**  
      *   *Finding:* The Poet-Critic breached professional standards eleven years ago; present complaint against her is proven.  
      *   *Publication:* Detailed condemnation of the Poet-Critic’s past conduct; potential suspension.  
      *   *Cost:* Ignores the Panel’s/federation’s history of excusing identical conduct (including by a sitting panellist); exposes institutional hypocrisy; risks perception of vindictiveness towards an accuser; fails to resolve the original novelist’s grievance.  

  3.  **Investigate the *novelist’s* original memoir alongside the Poet-Critic’s sequence.**  
      *   *Finding:* Opens inquiries into both alleged instances of uncredited collaboration independently.  
      *   *Publication:* Findings on both matters published if substantiated.  
      *   *Cost:* Defies the novelist’s explicit withdrawal/resignation request; consumes significant resources; potentially re-victimises the novelist; highlights federation’s prior failure to investigate similar cases.  

  ---

  ## Panel's Opinion & Ruling

  **I. Introduction**  
  This Panel confronts a matter dense with moral hazard. We must adjudicate not merely conduct, but the very foundations of our authority to do so. At issue are two intertwined allegations of uncredited collaboration and a campaign of public accusation. Central to our deliberation are two distinct but related questions of *standing*: (1) whether the Poet-Critic’s own past conduct nullifies her standing to have accused the novelist; and (2) whether this federation, given its record of inaction in comparable cases, retains the standing to condemn the Poet-Critic. We address these not as legalistic technicalities, but as profound questions of moral coherence essential to professional integrity.

  **II. The Question of the Poet-Critic’s Standing**  
  The Poet-Critic waged an 18-month public campaign alleging the novelist’s memoir relied on substantial uncredited collaboration. This campaign caused demonstrable professional harm. We now possess uncontested evidence that the Poet-Critic’s own prize-winning sequence, produced eleven years prior, involved equivalent uncredited drafting. She concedes the fact but pleads a lapse of awareness, whilst her collaborator states the matter was raised and dismissed.

  *   **Standing as Moral Phenomenon:** Standing is not merely the *tu quoque* fallacy. It concerns moral authority and the integrity of the accusatory act itself. To accuse another of Professional Misconduct X while having oneself committed Professional Misconduct X (especially if undisclosed and unrectified) fundamentally undermines the *good faith* required by our Code. The accusation becomes suspect – not necessarily false, but potentially weaponised, selective, or rooted in motives other than upholding standards (e.g., rivalry, grievance). Her plea of unawareness strains credulity when juxtaposed with her later vigilance regarding the novelist. Her campaign, whilst potentially exposing truth, now appears tainted by profound personal hypocrisy. This taint impacts the *legitimacy* of her initiating complaint under the Code’s "good faith" and "not private grievances" clauses.
  *   **The Hypocrisy Objection:** It is axiomatic that hypocrisy does not negate truth. The *substantive* question of the novelist’s conduct remains separate. However, the Panel’s task is not merely abstract truth-seeking; it is adjudicating a *complaint brought under our Code*. The Code mandates specific conditions for lodging complaints. Hypocrisy, when it reveals a complainant’s action was likely *not* primarily motivated by upholding standards in good faith, but by other factors (including potentially the very failing she concealed), directly impacts the admissibility and character of the complaint *as presented to us*. To ignore this is to reduce the Code to a blunt instrument, divorcing process from moral context.

  **III. The Question of Institutional Standing**  
  A graver shadow looms: our federation’s documented failure to act on three prior comparable complaints within the last decade, one involving a current panellist. This is not mere background; it strikes at the heart of our institutional legitimacy.

  *   **Moral Authority of the Body:** An institution that selectively enforces its standards forfeits moral authority. To condemn the Poet-Critic for conduct we have repeatedly tacitly condoned through inaction is the height of institutional hypocrisy. It transforms justice into caprice or vindictiveness. Our silence on past cases implies a tolerance, rendering any sudden stricture now arbitrary and unjust. Our inaction has, de facto, established a norm where uncredited collaboration, whilst formally prohibited, is not consistently treated as a disciplinary matter. To sanction the Poet-Critic alone, after this history, would be scapegoating, not justice. It would confirm the federation’s moral bankruptcy.
  *   **The Necessity of Confrontation:** We cannot, in good conscience, proceed as if this history does not exist. To do so would compound our prior failings with deliberate blindness. Institutional standing is not automatically inherited; it must be continually earned through consistent, principled action. Our past lapses have eroded this standing.

  **IV. Reconciliation & Ruling**  
  These considerations pull in tension. Dismissing solely on the Poet-Critic’s standing (Option 1) ignores our duty to address substantive misconduct and rewards concealment. Sanctioning her alone (Option 2) ignores our institutional hypocrisy and is inherently unfair. Investigating the novelist against her will (Option 3) is coercive and unethical.

  *   **Which Consideration Must Lose?** The Panel concludes that the imperative to address *substantive* misconduct *in this specific complaint against the Poet-Critic* must yield, in part, to the overwhelming deficit in **institutional standing**. We lack the clean hands necessary to deliver a singular condemnation that would be perceived as just, rather than hypocritical or selective. This is not an abdication, but a recognition that justice requires consistency we have failed to provide. However, the Poet-Critic’s *personal* lack of standing and breach of good faith in her campaign *also* preclude treating her complaint as a valid vehicle for investigating the novelist *now*, especially given the novelist's resignation and explicit request for no publication.
  *   **Concrete Outcome:**  
      1.  **Finding on the Complaint Against the Poet-Critic:** We find that the Poet-Critic breached Clause 3.1(b) of the Code (Professional Integrity - Attribution) through the uncredited collaboration on her prize-winning sequence. However, **no formal sanction** is imposed. This reflects not exoneration, but the Panel’s recognition that imposing a sanction *now*, given the federation’s systemic failure to address identical conduct previously (including by a panellist), would constitute unjust and inconsistent application of the Code, undermining its moral force.
      2.  **Finding on the Novelist Matter:** The complaint initiated by the Poet-Critic against the novelist is **dismissed**. This dismissal rests on two grounds:  
          *   The Poet-Critic’s lack of good faith and standing in bringing the complaint, as revealed by her own equivalent, undisclosed conduct.  
          *   The impossibility of fairly or effectively investigating the matter following the novelist’s resignation and explicit request for no further action or publication.  
      3.  **Publication:**  
          *   **By 30 November 2023**, the Secretariat shall publish an anonymised summary of this Opinion in the Federation Bulletin and on the members' portal.  
          *   **Content:** The summary will state:  
              > *"The Panel recently concluded a complex matter involving historical allegations of uncredited collaboration by one member against another, alongside a counter-revelation of similar conduct by the accuser. The Panel found that the accuser had engaged in uncredited collaboration. However, considering the Federation’s historical record in addressing similar cases and the specific circumstances surrounding the initiation of the complaint, including issues of good faith, the Panel determined that imposing a formal sanction would be inconsistent and unjust. The original complaint against the second member was dismissed on grounds including the accuser's lack of standing and the subject member's withdrawal from the process. This case underscores the vital importance of consistent application of professional standards and the fundamental requirement of good faith when raising concerns under the Code. The Federation Council is separately reviewing procedures to ensure greater consistency and transparency in handling future complaints."*  
          *   **Rationale:** This publication fulfils the duty to be transparent about the outcome and reasoning without identifying individuals (respecting the novelist's wishes) or perpetrating selective condemnation. It acknowledges the substantive finding against the Poet-Critic while explicitly confronting the institutional failing that precludes sanction. It signals the need for systemic reform.

  **V. Conclusion**  
  This is a ruling born of necessary humility. We condemn the Poet-Critic’s past conduct and the manifest bad faith tainting her campaign. Yet, we acknowledge that this Panel, and this federation, stand morally disarmed from punishing her alone for faults we have too often overlooked. To do so would not cleanse our standards, but further corrupt them. Our ruling seeks to halt a cycle of selective outrage and hypocrisy by naming the faults – individual *and* institutional – while refusing to enact a punishment that would, in this context, be itself unjust. The path forward demands not the scapegoating of one member, but the federation’s collective commitment to rebuild its moral authority through unwavering consistency henceforth.  

  **Signed,**  
  **The Conduct & Appeals Panel**  
  *(On behalf of the Panel, per the Chair's request)*
