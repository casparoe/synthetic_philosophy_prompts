  Hmm, the user's description of their seminar's flawed vote is key - they need the poem to embody that tension between independent judgment and correlated error. The pantoum's structure mirrors the theorem's voter-addition logic perfectly: each stanza inherits two lines (existing verdict) and adds two new (new voters). Must avoid making this a mere gimmick; the repetition should feel mathematically inevitable yet existentially uneasy.

  Breaking down requirements:
  First, core theorem elements to include: 
  - Binary factual question
  - p>0.5 but barely (emphasize fragility)
  - Voter independence 
  - Two conclusions: larger groups improve accuracy, certainty approaches 1 as n→∞
  - The dangerous corollary: if p<0.5, smaller juries are better

  Then the meta-layer: 
  - Pantoum's repetitions = correlated voters
  - Closing ambiguity: convergence on truth or error?
  - Echo of their seminar's memo-influenced vote

  Register challenges: plain but precise, no jargon, no winkiness. "Slender edge" is a good phrase to repurpose. Avoid "Condorcet" unless seamless - probably skip it. The defective jury concept must permeate; maybe let repeated lines subtly degrade in meaning through context shifts.

  Structural plan:
  Stanza 1: Setup (fact exists, fragile competence)
  Stanza 2: Add voters 1 & 2 
  Stanza 3: Add voters 3 & 4 (show overturn mechanics)
  Stanza 4: Growth principle
  Stanza 5: Dark corollary (p<0.5 case)
  Stanza 6: Closure/ambiguity (recover opening lines)

  For the critical closing: The repeated "This is the verdict..." must feel hollow when echoed after "the room goes dim." The memo image ("same words in the same order") ties back to their seminar anecdote. Last line's return to "the slender edge" should taste like doubt.

  Biggest risk: Forcing math into verse. Solution - embody concepts in verbs: "overturn," "sways," "thins," "crowds." No numerals, but "one" and "many" are permissible. The "both must see" / "both are blind" couplet captures the p^2 and (1-p)^2 probabilities elegantly.

  Finally, the poem's self-awareness: The inherited lines aren't independent witnesses. By the end, "crowded room" feels oppressive, "better odds" rings ironic. Perfect for their students to debate whether truth or groupthink prevailed.
answer: |-
  Here is the pantoum, crafted to embody the theorem's logic while exposing its fragility through the form's constraints:

  **The Assembly**

  A fact awaits beyond the crowded room.
  With competence that barely clears a toss,
  each comes alone to answer yes or no.
  This is the verdict we’ve agreed to trust.

  With competence that barely clears a toss,
  two more step in to face the question posed.
  This is the verdict we’ve agreed to trust;
  to shift it, both must see what’s truly so.

  Two more step in to face the question posed.
  The tally shifts if both are blind or bright.
  To shift it, both must see what’s truly so;
  to hold it wrong, both must mistake the light.

  The tally shifts if both are blind or bright.
  The room expands, the better odds accrue.
  To hold it wrong, both must mistake the light;
  the gathered many narrows toward the true.

  The room expands, the better odds accrue.
  But strip the edge, reverse the slow advance.
  The gathered many narrows toward the true?
  The single voice becomes the finest chance.

  But strip the edge, reverse the slow advance.
  The room goes dim. We read the same words first.
  The single voice becomes the finest chance?
  Each comes alone to answer yes or no.

  The room goes dim. We read the same words first.
  A fact awaits beyond the crowded room.
  Each comes alone to answer yes or no
  with competence that barely clears a toss.

  ---

  **Correspondence & Intent:**
  - **Form as Proof:** Each quatrain inherits two lines (existing verdict) and adds two new (new voters). The closure strictly follows your instructions, ending where it began.
  - **Theorem's Core:** "A fact awaits" (binary truth), "competence that barely clears a toss" (p > 0.5 but slim), "each comes alone" (independence), "the gathered many narrows toward the true" (convergence in probability), "The single voice becomes the finest chance" (p < 0.5 corollary).
  - **Overturn Mechanics:** Explicitly stated: "to shift it, both must see" (overturn wrong majority requires both new voters correct), "to hold it wrong, both must mistake" (overturn right majority requires both incorrect).
  - **Defective Jury (Meta):** The poem *enacts* correlation. Repeated lines ("This is the verdict," "competence that barely clears a toss") don’t gain new meaning from context; they are stale echoes. The final stanza’s ambiguity ("narrows toward the true?" vs. "We read the same words first") mirrors your seminar’s correlated vote. The closure feels unsettling, not triumphant – convergence on repetition, not necessarily truth.
  - **Your Seminar's Echo:** "The room goes dim. We read the same words first" directly references the departmental memo incident, showing correlation nullifying independence. The final question mark ("narrows toward the true?") underscores the doubt.
  - **Register:** Plain, austere language. Avoids numerals, names, formulae, winks. Focuses on the fragile mechanics ("slender edge" rendered as "barely clears a toss").

  The poem understands its defect: its growth is procedural, not informational. The closing lines, while structurally satisfying, feel hollow – precisely the epistemic danger when voters aren't independent. It embodies the theorem's brilliance and its brittle reliance on an assumption easily broken.
