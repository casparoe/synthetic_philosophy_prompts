  * **Move 3 (Nadia):** 
    - Claim 1: Clearly right. The prior is a representation of a current disposition.
    - Claim 2: Clearly right. The Dutch book characterization is a known theorem.
    - Claim 3: Clearly right. The dynamic process (iterated announcement) does lead to agreement under common prior.

  * **Move 4 (Owen):** 
    - Claim 1: Clearly right. The dynamic result assumes common prior.
    - Claim 2: Clearly right. Without common prior, iterated announcement may not converge (we saw an example where it did, but there are known counterexamples where it doesn't).
    - Claim 3: Clearly right. Merging is asymptotic and requires absolute continuity.
    - Claim 4: Clearly right. Merging is about long-run predictions, not about a single event.

  * **Move 5 (Nadia):** 
    - Claim 1: Clearly mistaken (we built a counterexample).
    - Claim 2: Falls with Claim 1. But note: even if priors are close, commonly known posteriors can differ by a lot. So large disagreement does not necessarily imply large prior divergence? In our example, with small TV, we had a large disagreement. But in our example, the prior divergence in terms of the specific conditionals was large? However, the TV was small. So her claim is not supported.

  * **Move 6 (Owen):** 
    - Claim 1: Partly right. The theorem's content is that disagreement with common knowledge and common prior forces agreement. Without common prior, disagreement can persist even with common knowledge (as in our example in Move 5). But Owen's statement is a bit vague.
    - Claim 2: This is an epistemological claim. It is partly right: without a common prior, disagreement might be rational. But it's not the whole story.

  **Overall:**
  Both are partly right, but Owen is more right on the whole because he correctly identifies the fragility of the common prior assumption and the dynamic and approximate claims, and he effectively shows that the theorem does not indict real-world disagreement. Nadia's strongest point is the dynamic agreement result and the Dutch book characterization, but her approximate agreement claim is false.

  The quarrel over common priors is partly a dispute about what a prior is. Nadia sees it as a consistency condition on current beliefs, while Owen sees it as a historical starting point. This is a substantive philosophical difference.

  **What both missed:**
  1. **Finite state space:** The theorem assumes a finite state space. In infinite state spaces, the result may not hold.
  2. **Partition structure:** The theorem assumes that the agents' information is represented by partitions (so they know what they don't know). In more general models (e.g., with unawareness or with non-partitional information structures), the result may not hold.
  3. **Common knowledge condition:** The common knowledge of the posteriors is a very strong condition. Both discuss it, but they may not appreciate that common knowledge is not just about the fact that they disagree but also about the specific posteriors.
  4. **Alternative interpretations:** The theorem might bear on real disagreement in a different way: it shows that if two people have the same prior and they become aware that they have common knowledge of their disagreement, then they must agree. But in practice, they might then realize that they do not have common knowledge and start communicating. The dynamic result (iterated announcement) shows that they will then agree. So for peers with a common prior, persistent disagreement is unstable and should disappear with communication. However, if they do not have a common prior, then even with communication, disagreement might persist.
  5. **Persistence of transparent disagreement:** If two people have common knowledge of their disagreement (and they have communicated enough to achieve common knowledge), then an outside observer can infer that either they do not have a common prior or at least one is irrational. This is a substantive conclusion.

  Finally, Owen did not engage with the total variation claim, but as we saw, it is false. So his dismissal was lucky.
