  We are discussing Aumann's agreement theorem and the debate between Nadia (philosophy) and Owen (economics). 

  First, I will set the groundwork by stating the theorem.

  **Groundwork: Aumann's Agreement Theorem (1976)**

  * **Assumptions:**
    1. Two agents (say, Alice and Bob) share a common prior probability distribution over a finite state space Ω.
    2. Each agent receives private information: for Alice, a partition P_A of Ω; for Bob, a partition P_B. The true state ω is in Ω. Alice learns which cell of P_A contains ω, and Bob learns which cell of P_B contains ω.
    3. Both agents update by conditionalizing on their private information. So Alice's posterior for an event E is P(E | P_A(ω)), and Bob's is P(E | P_B(ω)).
    4. The agents then communicate in such a way that their posteriors for a fixed event E become common knowledge. That is, at the end, it is common knowledge that Alice's posterior is q and Bob's posterior is r.

  * **Conclusion:** Under these conditions, the posteriors must be equal: q = r.

  * **Where the common prior does the work:** 
    The key step in the proof is that if the posteriors are common knowledge, then there must be a set of states S that is common knowledge (so S is a union of cells of the meet of the two partitions) and such that at every state in S, Alice's posterior is q and Bob's is r. Then, because the prior is common, the conditional probabilities are determined by the prior. In particular, at every state in S, the posterior of Alice is P(E | P_A(ω)) = q. But since S is common knowledge, it is known by both that the state is in S, and so the posterior of Alice must be the same for every state in the same cell of her partition that intersects S. Then, by the law of total probability and the common prior, one can show that q must equal r. Without the common prior, the agents might condition on different probability measures and the posteriors could differ even when common knowledge.

  Now, let's break down the moves.

  **Move 1 (Nadia):**
  * Claim 1: States the theorem (correctly).
  * Claim 2: Her gloss: fully transparent and stable disagreement (i.e., common knowledge of disagreement) cannot be rational. (This is a direct interpretation of the theorem.)
  * Claim 3: This disposes of talk of reasonable disagreement among the well informed: such disagreement is a symptom (of either irrationality or lack of common prior).

  **Move 2 (Owen):**
  * Claim 1: No two real people share a prior because their formative experiences differ. (This is an empirical claim about real people.)
  * Claim 2: Common knowledge is an infinite hierarchy and is never achieved in practice. (This is a standard objection to common knowledge.)
  * Claim 3: The theorem's antecedent is never satisfied, so it tells us nothing about actual disagreement.

  **Move 3 (Nadia):**
  * Claim 1: The prior is not a historical memory but a representation of a disposition to believe. (Conceptual point about priors.)
  * Claim 2: Whether two people have a common prior is a consistency condition on conditional beliefs, and there is a behavioral test (via no Dutch book). Specifically: a common prior exists iff there is no set of side-bets (transfers that sum to zero) that each agent, given their conditional beliefs, would find acceptable in every state. (This is a known result: the no-trade theorems. The Dutch book characterization is also known.)
  * Claim 3: Common knowledge can be manufactured by talking. (This is a reference to the dynamic process of repeated announcement of posteriors leading to agreement in finite steps, under common prior.)

  **Move 4 (Owen):**
  * Claim 1: The dynamic result (iterated announcement) assumes a common prior and therefore cannot bridge the gap for establishing common priors. (This is correct: the dynamic process requires common prior to guarantee convergence to agreement.)
  * Claim 2: Without common prior, iterated announcement need not converge. (True: there are counterexamples.)
  * Claim 3: With different priors, we have merging of opinions (Blackwell and Dubins, 1962) but only asymptotically and under absolute continuity. (This is correct.)
  * Claim 4: Merging is about agreement in predictions over an infinite stream, not about a single event, and is a limit claim. (This is a fair description of merging.)

  **Move 5 (Nadia):**
  * Claim 1: An approximate version: if priors are close in total variation (TV) distance, then when posteriors are commonly known, they must be close. (We must check this claim.)
  * Claim 2: This approximate result restores normative force: large, stable, transparent disagreement implies that priors differ by a lot, which is a substantive claim.

  **Move 6 (Owen):**
  * Claim 1: The theorem shows that disagreement is possible whenever priors differ. (True: the theorem does not rule out disagreement without common knowledge, and without common prior, disagreement is possible even with common knowledge? Actually, without common prior, the theorem does not apply. But in the absence of common knowledge, disagreement is possible even with common prior. However, Owen's point is that without common prior, disagreement can persist even with common knowledge? We must be cautious.)
  * Claim 2: Therefore, when two well-informed people disagree, neither has a reason to lower confidence in their own view merely because the other disagrees. (This is an epistemological claim about peer disagreement.)
  * He did not engage with the TV claim.

  Now, we must verify the formal claims:

  **Verification of claims:**

  1. **The bet characterization (Move 3, Claim 2):** 
     This is a known result. The condition that there is no set of side-bets that are acceptable to both agents in every state (given their conditional beliefs) is equivalent to the existence of a common prior. This is a theorem in the literature (e.g., by Nau, or Samet). I will sketch the idea.

     * If there is a common prior, then the law of iterated expectations holds and no such Dutch book exists (because any bet that is acceptable to both would have non-positive expected value under the common prior). 
     * Conversely, if no such Dutch book exists, then one can construct a common prior by solving a system of linear inequalities. 

     So Nadia is correct: the common prior is equivalent to the absence of such a Dutch book. Therefore, if we have not found such a Dutch book, it suggests (but does not prove) that a common prior exists. However, note that the Dutch book must be acceptable in every state (i.e., for every cell of each agent's partition). This is a strong condition, and in practice, we may not have observed all the necessary conditional bets.

  2. **Convergence of iterated announcement (Move 3, Claim 3):** 
     This is a dynamic process: agents repeatedly announce their current posterior for event E. Each time, they update by conditioning on the other's announcement (which is a public event). Under common prior, this process converges to common knowledge of the posterior in finite steps (because the state space is finite, and the partitions become finer with each announcement). Then, by Aumann's theorem, they must agree. This is a known result (e.g., Geanakoplos and Polemarchakis, 1982). So Nadia is correct on this.

