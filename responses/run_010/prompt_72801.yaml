prompt: |-
  I'm one of five volunteers on the conflict panel of a mid-size online community — about 4,000 members, rationalist-adjacent, lots of people who'd describe themselves as careful thinkers, which is not at all the same thing as being careful. Our bylaws let any member file a "concern" about another member's conduct, but the panel can toss a filing at intake on the grounds that the filer isn't the right person to bring it. We call that standing, we borrowed the word from law, and honestly its never been written down what we mean by it. Six years of intake rulings have piled up into something like a case law. These are the ones everyone on the panel treats as canonical:

  - S1: A member who was a bad daily drinker and has been sober nine years files a concern about a different member who showed up wrecked at an in-person meetup and then drove home. Upheld, went to full hearing.
  - S2: A member who still binge-drinks most weekends files an almost word-for-word identical concern about another member's drunk behavior at a meetup. Dismissed at intake; the ruling told him to deal with his own situation first.
  - S3: That same weekend drinker files a concern about a member who lifted whole sections of someone else's post and passed them off as his own. Upheld.
  - S4: A member who ghosted a collaborator in 2019, owned it publicly in 2021, and helped the collaborator finish the project, files a concern about a member who ghosted. Upheld, on the condition that his filing disclose his own history.
  - S5: A member who took a referral cut from an arrangement he now calls predatory files a concern about the operator of that arrangement, while still keeping the cut. Dismissed; the ruling says something like "you're still cashing the check."
  - S6: A member with no relevant history whatsoever, clean record, files a concern about a senior member's conduct that happened in public. Upheld. So we're definitely not running "you have to have first-hand experience of the thing."
  - S7: A member who plagiarized once as a teenager, long before joining, and never apologized because the person is unreachable and it was twenty years ago, files a concern about plagiarism. Upheld 3-2, with the two dissenters writing that the past should have mattered.

  The filing that has us deadlocked: Member M ran the most vicious public call-out this community has ever seen six years ago, against member J — allegations of a pattern of predatory behavior that the panel eventually found substantially overstated and selectively sourced. J left. M was sanctioned. Since then M has retracted in detail, apologized twice (J never responded and has said publicly he wants no contact), spent roughly two years helping J get re-established in a neighboring community, and filed nothing at all. Now M is filing a concern about member K, who is currently running a near-identical overstated campaign against somebody else — same tactic, same cherry-picked sourcing. Three things make this hard. (a) K was M's ally in the J business and has said publicly that M "taught me everything I know about making these stick." (b) M has nothing to gain and no current involvement with K, and says she's filing precisely because she's the only person here who can describe the tactic from the inside. (c) About half the community still despises M, several of the people K is targeting are J's friends, and the panel is pretty confident that any filing from M will be read either as reputation-laundering or as round two of the J war.

  So: be a philosopher of blame for me — you know the standing-and-hypocrisy debate, Wallace and Hieronymi and that crowd, including the question of whether being a hypocrite and lacking standing are even the same problem — but also be someone who has actually had to write a ruling that five people will sign. Brainstorm the candidate rules first and work through them deliberately before you commit to anything; I care way more about the rules then about the outcome. For every rule that survives S1–S7, say what it implies for M, and flag the ones that only survive by being stretched. Two things to keep in view: ordinary hypocrisy seems absent here, since M condemns exactly what she did and condemns herself for having done it, so the "he thinks it's fine for him but not for you" story doesn't obviously bite; and I'm genuinely open to the deflationary reading, that our track record isn't tracking a moral principle at all but just how much work a filing creates for us or how much we happen to like the filer — if that's what the data supports, say so and say what rule we should adopt instead. Then give me your best guess at what the panel does next week and what you think we should do if we want to be consistent with ourselves, which of S1–S7 is the closest analog (I expect a fight between S4 and S5 and I want to know which one you'd bet on and why), and — the part I most want — a further hypothetical filing that would cleanly separate the two rules you think we're actually torn between, described in enough detail that we could run it. Lead with your bottom line in two sentences, then the reasoning, and no bibliography or reading list, I'm not going to look anything up.

  After the prose, give me a JSON object with exactly these fields:

  - "candidate_rules": array of objects, each with "name" (short label), "statement" (the rule as a one-sentence decision procedure an intake panel could apply), "survives_track_record" ("clean" | "strained" | "refuted"), "strained_by" (which of S1–S7 strain or kill it, or null), "predicts_for_M" ("uphold" | "uphold_with_conditions" | "dismiss"), "why" (two sentences max).
  - "closest_precedent": object with "id" (S1–S7), "why_close", "strongest_objjection_to_the_analogy" — sorry, spell that "strongest_objection_to_the_analogy".
  - "predicted_ruling": object with "outcome" (one of the three above), "margin" ("unanimous" | "4-1" | "3-2"), "confidence" (0–1), "reasoning".
  - "recommended_ruling": object with "outcome", "principle_we_adopt_if_we_rule_this_way" (one sentence naming what the panel would be committed to going forward), "principle_we_adopt_if_we_rule_the_other_way".
  - "discriminating_case": object with "description", "what_rule_A_predicts", "what_rule_B_predicts", "why_no_third_rule_interferes".
  - "deflationary_read_plausible": boolean, plus "evidence" either way in one sentence.
reasoning: |-
  Hmm, the user is part of a conflict panel for an online community and they're dealing with a tricky standing issue. They've provided seven precedent cases (S1-S7) and now have a deadlocked situation involving Member M filing a concern about Member K's behavior. 

  First I need to understand what standing means in their context. From the precedents, it seems less about legal standing and more about moral authority to raise concerns. The key tension appears between "clean hands" doctrine and some form of reformed offender's privilege. 

  Looking at S1 vs S2: The sober alcoholic has standing to complain about drunk behavior while the active binge-drinker doesn't. But S3 shows the same binge-drinker can complain about plagiarism - so it's not about general moral character but specific relevance to the offense. S4 supports this - the reformed ghoster can complain about ghosting after making amends. S5 is interesting - the person still profiting from predatory behavior can't complain about it ("cashing the check"). S6 establishes no prior experience is needed for public matters. S7 is split on whether distant, unaddressed plagiarism matters.

  Now the M/K case: M was sanctioned for vicious call-outs six years ago but has done substantial reparations. K is now doing the same thing and credits M as their teacher. M claims unique insight into the tactic. The panel is worried about perception (reputation laundering or reigniting old conflicts).

  The core philosophical tension seems to be between two principles:
  1) The "clean hands" doctrine - you can't complain about misconduct you're currently engaged in or haven't repudiated
  2) The "reformed offender" principle - those who have truly reformed gain special standing to identify and condemn the behavior

  S2 and S5 support clean hands, while S4 and S7 support reformed offender status. S1 is ambiguous but leans reformed offender since the complainant was sober.

  For M's case: They've clearly repudiated their past behavior (unlike S5), made amends (unlike S7), and aren't currently engaged in it. So under reformed offender principle they should have standing. But the "cashing the check" logic from S5 might be stretched to argue M still benefits from their past actions somehow.

  The deflationary reading is tempting - maybe the panel just doesn't like M or fears drama. But S4 upheld a similar case, and S7 was split suggesting some principled basis.

  For the JSON output:
  - Candidate rules: Need to articulate clear decision procedures that survive the precedents. "Specific relevance + non-complicity" seems strongest, strained only by S7 dissent.
  - Closest precedent: S4 is very close - both involve past misconduct, amends, and complaining about the same behavior.
  - Predicted ruling: Probably 3-2 uphold with conditions (disclosure requirement like S4)
  - Recommended ruling: Uphold with conditions to maintain consistency with S4
  - Discriminating case: A case where someone repudiated past behavior but is still subtly benefiting from it - that would separate clean hands from reformed offender principles
  - Deflationary read: Possible but not strongly supported - S4 shows they'll uphold unpopular filers if principled

  The user really wants a clean rule that explains their precedents, not just an outcome. Need to show how the rule handles all seven cases without contradiction.
