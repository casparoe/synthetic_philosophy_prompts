  **Bottom line:** Uphold M's filing with conditions, requiring disclosure of her history in the concern itself. The panel's track record prioritizes *specific relevance of past conduct* over general hypocrisy, and M's reformed-offender status grants standing to expose the tactic she pioneered—but S4's disclosure condition is essential for legitimacy.

  ---

  ### Reasoning  
  The precedents reveal two operative principles:  
  1. **Specific complicity defeats standing** (S2, S5): If the filer *currently engages in or materially benefits from* the same conduct, they lack standing (e.g., active binge-drinker, profiteer).  
  2. **Reformed-offender status grants standing** (S1, S4, S7 majority): If the filer has credibly repudiated the conduct (sobriety, amends, public condemnation of their own actions), they gain unique authority to address it—even without direct victimhood (S6).  

  **M’s case:**  
  - **Complicity?** M isn’t currently engaged in call-outs, profits nothing from K’s actions, and condemns her own past. Unlike S5’s "cashing the check," M gains no advantage.  
  - **Reformed status?** Parallel to S4 (ghoster aiding victims): M retracted, apologized, aided J, and abstained for years. Her insider perspective is uniquely valuable, satisfying S6’s "public conduct" standard.  
  - **Hypocrisy?** Absent—M explicitly condemns her own actions. The "reputation-laundering" fear is political, not doctrinal.  

  **Dismissive arguments fail:**  
  - S5 analogy? Flawed—M isn’t benefiting.  
  - S7 dissent? Overruled by majority; distant/unaddressed past didn’t negate standing.  

  **Danger:** If dismissed, the panel signals that substantive repentance (S4) is insufficient, contradicting S1/S4/S7. Upholding with S4-style disclosure mitigates bias concerns.  

  **Deflationary read?** Plausible but weak: S2/S5 avoid messy disputes; S1/S4/S7 involve harder cases but were upheld. Rule below fits cleanly.  

