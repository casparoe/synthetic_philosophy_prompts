  1. Lexical Threshold: In round 3, when we were at harm level 2 (paper cut), many of you chose to spread the harm (Option A) rather than concentrate harm level 3 (headache) on one person. But by round 7 (harm level 4, stubbing toe), some of you started to choose B to avoid spreading. At what point should we say: 'This harm is too trivial to aggregate, but this next harm is above the threshold'? The ladder was designed so that adjacent rungs are very similar, so drawing a line is hard.

  2. Separateness of Persons: Look at Student X, who ended up with three severe harms because they were chosen as the victim in three rounds. Meanwhile, Student Y only has a list of minor harms. Is it fair that Student X bears so much more? This highlights the separateness of persons objection to aggregation.

  3. Perspective Flip: In round 5, when the decider was the prospective victim for harm level 5 (allergic reaction) if they chose B, they chose A to avoid that, giving everyone harm level 4 (stubbed toe). This shows that when you are the victim, you might prefer spreading the harm even if it's more in total.

  4. Probabilistic Harm: In the harm level 6 rounds, we had a 10% chance of a sprained ankle. When we resolved the lottery, only one student actually got the harm. Ex ante, everyone had a small risk. Ex post, only one is harmed. This is common in policy: we expose many to a small risk to avoid a sure harm to a few. But is that justified? The activity let us see how we make that trade-off.

  5. Aggregate Harm: By choosing A repeatedly, we ended up with a large number of minor harms for everyone. For example, each of you might have several grains of sand in your shoe, paper cuts, headaches, etc. Cumulatively, that might be very burdensome, even though no single harm was severe. This is the aggregation problem."

  Materials:

  - Harm recording sheet for each student.
  - A set of 16 decision cards, each specifying the harm level and the pre-selected student for Option B.
  - Lottery materials for harm level 6.

  Time: The activity might take 30-40 minutes, leaving 35-45 minutes for debrief.

  This meets the requirements as best as possible within the constraints.
answer: |-
  Below is a complete in-class activity design and debrief tailored to your specifications. The activity uses **tokens (colored slips of paper)** to represent harms, avoids monetary incentives, and meets all four requirements. It runs in **~45 minutes** (leaving 30 minutes for debrief), works for 16 students, and forces students to *experience* aggregation through a sequence of choices. The harm ladder is designed with care to ensure adjacent rungs feel comparable while endpoints feel worlds apart.

  ---

  ### **Activity: "The Harm Chain"**
  **Setup**  
  - **Materials**:  
    - 8 jars labeled 1–8 (for harm-token collection).  
    - 160 tokens: 100 white (minor harms), 40 blue (moderate harms), 20 red (severe harms).  
    - 16 envelopes (one per student, labeled with their name).  
    - 16 decision slips (one per round, pre-loaded with options).  
    - A lottery drum with 100 balls (99 white, 1 black).  
  - **Prep**:  
    - Pre-assign a random order for students to decide (1 to 16).  
    - For Requirement (b), rig Round 8 so the deciding student is the victim if Option B is chosen (assign their name to Option B).  
    - Read the harm ladder aloud (wording below) but **do not reveal the connection to aggregation** until the debrief.  

  **Harm Ladder (Read Aloud)**  
  *"When I describe a harm, imagine it happening to you right now. These are real, visceral experiences. From least to most severe:*  
  1. **A single eyelash in your eye** for 5 minutes (annoying, but ignorable).  
  2. **A papercut on your fingertip** (sharp sting when you type or wash hands).  
  3. **A hangnail torn too short** (throbbing when pressure is applied).  
  4. **A mild sunburn on your neck** (persistent itch for a day).  
  5. **A bruised shin** (sharp pain when bumped, soreness for 3 days).  
  6. **A 1% chance of a sprained wrist** (weak grip, pain for 2 weeks; for many people).  
  7. **A deep cut requiring stitches** (throbbing pain, medical visit, scar).  
  8. **A permanent 10% loss of hearing in one ear** (muffled voices, tinnitus).  
  *Remember: No two adjacent harms feel clearly different, but compare #1 and #8—would you trade one for the other?"*  

  **Probabilistic/Diffuse Harm (Rung 6)**: Small chance (1%) of a serious harm (sprained wrist) distributed across many people.  

  ---

  ### **Activity Flow**  
  **Round 1–16 (Each lasts 2–3 minutes)**  
  - Each student faces one decision when called. They draw a pre-printed slip with two options.  
  - **Option A**: "Inflict Harm [k] on all 16 people (including yourself)."  
  - **Option B**: "Inflict Harm [k+1] on one specific person."  
  - **k values**: Rounds 1–2 use k=1, Rounds 3–4 use k=2, ..., Rounds 15–16 use k=8.  
    *(Example: Round 1 slip: "A: All get Harm 1 (eyelash). B: [Name] gets Harm 2 (papercut).")*  
  - **Tokens**:  
    - If A is chosen: Student places 16 white tokens in Jar k (e.g., Jar 1 for eyelash).  
    - If B is chosen: Student places 1 blue token in Jar k+1 (e.g., Jar 2 for papercut).  
    - **Rung 6 (probabilistic)**: If A is chosen, student places 16 red tokens in Jar 6. Each token = 1% chance of a sprained wrist for one person.  
  - **Recording**: Students privately note their choice + reasoning on their envelope.  
  - **Requirement (b)**: In Round 8 (k=4 → Harm 5), the deciding student sees *their own name* for Option B. Their choice reveals the victim-perspective flip.  

  **Reveal (After Round 16)**  
  1. **Resolve Rung 6 (probabilistic harm)**: For every token in Jar 6, draw from the lottery drum. Black ball = that person gets a sprained wrist (add a "sprained wrist" slip to their envelope).  
  2. **Calculate total harm**:  
     - Count tokens in Jars 1–5,7–8: Each token = one harm for one person.  
     - Distribute harms: For Jar k, assign Harm k to students randomly (one harm per token).  
     - Students open envelopes to see their cumulative harms (e.g., "3 eyelashes, 1 papercut, 10% hearing loss").  
  3. **Group reflection**: "How do you feel about your harms? Compare your burden to others."  

  ---

  ### **Debrief Script (30 Minutes)**  
  **Map Activity to Ethical Concepts**  
  *(Reference specific moments to ground abstract ideas)*  

  1. **Lexical Thresholds**:  
     - *"In Rounds 1–4 (harms 1–4), most chose A—trivial harms felt ‘safe’ to aggregate. But in Rounds 11–12 (harm 6 → 7), many switched to B. Why? Harm 7 (stitches) crossed a threshold where concentration felt worse than diffusion. But was there a clear line? Remember the ladder: no adjacent harms felt distinct, yet Harm 1 vs. 8 are incomparable. If thresholds exist, where do they sit? Can we define them without arbitrariness?"*  

  2. **Separateness of Persons**:  
     - *"Look at your envelopes. Student A has 12 minor harms (eyelashes, papercuts). Student B has one severe harm (hearing loss). We allowed this by choosing A repeatedly early on. But is 12 papercuts ‘worse’ than hearing loss? We aggregated harms *across* people, but people aren’t containers for utility—they’re separate. This is why B felt compelling in later rounds: you sensed the moral weight of a single person bearing concentrated suffering."*  

  3. **Ex Ante vs. Ex Post Aggregation**:  
     - *"Rung 6 (probabilistic harm) simulated regulatory dilemmas like pollution standards. Ex ante, Option A was a 1% risk for each—small and diffuse. But ex post (after the lottery), some got hurt, others didn’t. When you chose A, you treated 16 tiny risks as interchangeable. But is that fair to the person who lost the lottery? Their harm isn’t ‘expected value’—it’s real pain. Policy often hides behind ex ante aggregation; this activity forces us to confront the ex post reality."*  

  4. **The Victim Flip (Requirement b)**:  
     - *"In Round 8, when [Name] saw they’d get Harm 5 (bruised shin) if they chose B, they picked A—inflicting Harm 4 (sunburn) on everyone. Why? From the victim perspective, avoiding personal harm outweighed aggregating smaller harms. Yet in other rounds, non-victims chose A freely. This mirrors real power dynamics: the allocator vs. the affected. Aggregation isn’t neutral—it shifts costs to the vulnerable."*  

  5. **The Reveal and Total Burden**:  
     - *"When you saw your envelope, some gasped at the pile of minor harms. That’s the aggregation problem: individually trivial decisions (A in Rounds 1–4) built a burden that, cumulatively, may rival severe harms. But we hid this by siloing decisions. In policy, we rarely see the cumulative toll of ‘dust specks’—regulators approve one trivial risk at a time."*  

  ---

  ### **Predictable Problems + Recovery Moves**  
  1. **Problem: Half the class spots the punchline by Round 2**.  
     - *Fallback*: "Pivot to a meta-discussion. Ask: *‘Those who saw this coming—why did you keep choosing A? What would it take to stop the chain?’* Force them to articulate the tension (e.g., ‘No single step felt wrong, but the end is monstrous’). Use this to highlight the sequence’s insidiousness—the problem isn’t solved by spotting it."  

  2. **Problem: Students dismiss trivial harms**.  
     - *Recovery*: "Before Round 1, say: *‘These harms seem silly alone, but imagine them in real life. An eyelash in your eye during a job interview. A papercut while cooking. Multiply that.’* In debrief, contrast Harms 1 (16 eyelashes) and 8 (hearing loss)."  

  3. **Problem: Lottery fatigue in Rung 6**.  
     - *Recovery*: "Use the drum visibly. When drawing balls, say: *‘This black ball means [Name] actually gets a sprained wrist. It’s not abstract—they’re harmed.’* Highlight the asymmetry: choosers faced risk; victims face consequences."  

  4. **Problem: Random victim assignment feels unfair**.  
     - *Recovery*: "During debrief, agree: *‘Yes, it’s unfair. But why? Because aggregation often is. Who bears the cost isn’t random in real life—it’s marginalized groups.’"*  

  ---

  ### **Limitation of Token Simulation**  
  **What Tokens Cannot Capture**: The *psychological experience* of aggregated minor harms.  
  - **Why**: Tokens represent harms discretely (e.g., 10 papercuts = 10 slips), but real-life minor harms blend into a continuous burden (e.g., chronic irritation). Students might say, *"Ten papercuts aren’t 10x worse than one—they’re annoying but manageable."*  
  - **How to Supply by Argument**:  
    1. Cite empirical work on the *compounding* of small stresses (e.g., daily microaggressions reducing well-being more than isolated events).  
    2. Contrast with severe harms: *"A hearing loss isn’t just ‘worse’—it changes your identity. Minor harms accumulate; severe harms transform."*  
    3. Stress that regulatory bodies (e.g., EPA) treat diffuse harms as additive in cost-benefit analysis—even if they don’t feel additive, that’s how policy works.  

  --- 

  This design forces students to *live* the aggregation problem: they’ll feel the unease of escalating choices, the victim-perspective flip, and the shock of the reveal. By withholding terms like "aggregation" or "lexical threshold" until debrief, you ensure intuitions emerge organically. The tokens make harms tangible, while the ladder and probabilistic element mirror real-world dilemmas. Run this, and your seminar won’t just recite positions—they’ll feel the weight of the puzzle in their envelopes.
