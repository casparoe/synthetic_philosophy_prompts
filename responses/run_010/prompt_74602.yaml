  ### Decision Tree for Legislative Selection Reform Proposals

  **Premise:** The commission agrees that election to multi-year terms, with incumbents usually returned, has produced a self-perpetuating political class. The tree sorts proposals by design parameters, not by labels like "citizens' assembly." Answer each question based on the proposal's mechanics, not personal preference. Proceed down the branches until you reach a leaf (institutional design).

  1. **What is the body’s primary mandate?**  
     - a. Advisory (non-binding recommendations).  
     - b. Agenda-setting (determines topics for legislative action).  
     - c. Suspensive (delays or blocks legislation temporarily).  
     - d. Decisive (final approval of laws or appointments).  
     - e. Appointive (selects officeholders, e.g., legislators or executives).  

  2. **Who constitutes the selection pool?**  
     - a. All eligible citizens (service compelled unless exempt).  
     - b. Volunteers only (self-selected).  
     - c. Opt-out pool (all eligible citizens, but may decline service).  
     - d. Screened pool (filtered for competence, ethics, or diversity).  

  3. **How are members selected?**  
     - a. Direct sortition (random draw from the pool).  
     - b. Election then sortition (vote narrows candidates, then random draw).  
     - c. Sortition then election (random draw nominates, then vote).  
     - d. Multi-stage sortition (random draw selects a subgroup that then selects members).  

  4. **What is the term length and renewability?**  
     - a. Very short (days to weeks; no renewal).  
     - b. Short (≤1 year; no renewal for ≥5 years).  
     - c. Fixed (2–5 years; no renewal).  
     - d. Fixed (2–5 years; renewal allowed).  
     - e. Long (>5 years; no renewal).  

  5. **Who sets the body’s agenda?**  
     - a. The body itself.  
     - b. An external authority (e.g., executive, elected chamber).  
     - c. Hybrid (body and external authority jointly).  
     - d. Random selection (topics chosen by lot).  

  6. **Is there examination or accountability?**  
     - a. None.  
     - b. Examination before entry only (e.g., competency tests).  
     - c. Accountability after exit only (e.g., public review of service).  
     - d. Both examination and accountability.  

  7. **What sanction exists for poor performance?**  
     - a. None.  
     - b. Early dissolution of the body.  
     - c. Individual penalties (e.g., fines, disqualification).  
     - d. Public censure (e.g., published evaluations).  

  8. **What evidence would confirm the reform’s failure?**  
     - a. Persistence of a self-perpetuating political class.  
     - b. Epistemic failure (consistently poor decisions).  
     - c. Unfair representation (bias against groups).  
     - d. Erosion of public legitimacy (distrust or disengagement).  

  9. **How does the design affect political careers?**  
     - a. Makes them impossible (no path to power).  
     - b. Makes them unattractive (e.g., term limits, reduced influence).  
     - c. Makes them irrelevant (power resides with allotted body).  
     - d. No effect (elected bodies retain dominance).  

  10. **How does the body interact with elected institutions?**  
      - a. Replaces an elected body (e.g., legislature).  
      - b. Coexists as a second chamber.  
      - c. Checks elected bodies (e.g., veto power).  
      - d. Informs elected bodies (e.g., advisory input).  

