  ### **Scoring Key**
  Map each answer to a position using the table below. Tally how often a participant selects each position (A, B, or C) across the 10 questions. Their dominant position is the one with the highest tally.  
  | Question | A | B | C |  
  |----------|----|----|----|  
  | 1        | Davidson (Partitioned) | Davidson (Weakness of Will) | Mele (Motivated Bias) |  
  | 2        | Davidson (Partitioned) | Mele (Motivated Bias) | *Unnamed: Intentional Avoidance* |  
  | 3        | Davidson (Partitioned) | Mele (Motivated Bias) | Davidson (Weakness of Will) |  
  | 4        | Gendler (No Belief) | Mele (Motivated Bias) | Davidson (Weakness of Will) |  
  | 5        | Davidson (Partitioned) | Mele (Motivated Bias) | *Unnamed: Intentional Avoidance* |  
  | 6        | Davidson (Partitioned) | Davidson (Weakness of Will) | Mele (Motivated Bias) |  
  | 7        | Davidson (Partitioned) | Mele (Motivated Bias) | *Unnamed: Intentional Avoidance* |  
  | 8        | Davidson (Partitioned) | Mele (Motivated Bias) | Davidson (Weakness of Will) |  
  | 9        | Gendler (No Belief) | Mele (Motivated Bias) | *Unnamed: Intentional Avoidance* |  
  | 10       | Davidson (Partitioned) | Mele (Motivated Bias) | *Unnamed: Intentional Avoidance* |  

  #### **Positions Defined (as defenders name them):**
  - **Mele (Ordinary Motivated Bias):** No belief-contradiction; self-deception is non-conscious bias without choice.  
    - *Axis Mapping:* Simultaneous Beliefs = **No**; Choice = **No**.  
  - **Davidson (Partitioned Mind):** Belief and negation coexist in separate mental partitions.  
    - *Axis Mapping:* Simultaneous Beliefs = **Partitioned**; Choice = **No** (partitions arise from structure, not choice).  
  - **Davidson (Weakness of Will):** No belief-contradiction; self-deception stems from choosing actions against one’s better judgment.  
    - *Axis Mapping:* Simultaneous Beliefs = **No**; Choice = **Yes**.  
  - **Gendler (No Belief):** No belief-contradiction; the conflicting state is not a "belief" (e.g., it’s an "alief" or gut feeling).  
    - *Axis Mapping:* Simultaneous Beliefs = **No**; Choice = **No**.  
  - ***Unnamed: Intentional Avoidance*** (e.g., influenced by existentialism): No belief-contradiction; self-deception involves deliberate choice to avoid uncomfortable truths.  
    - *Axis Mapping:* Simultaneous Beliefs = **No**; Choice = **Yes**.  

  #### **Interpreting Results:**
  - **Dominant Position:** The position with the highest tally.  
  - **Ties:** If tied, the participant’s view blends positions (e.g., Mele + Gendler).  

