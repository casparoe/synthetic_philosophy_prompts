prompt: |-
  I write novels, and for two years I have been building one around a rescue at sea. To make the climax honest rather than merely moving, I have had to work out what I actually believe about whether the greater number should decide, and I have found that what I believe is a heap of plausible fragments that do not obviously fit together. I would rather give you my verdicts on particular cases and have you tell me what principle they add up to than argue for a thesis I do not have. Please treat the cases as data, not as illustrations.

  My tentative view, for what it is worth: a loss is a loss only for the one who suffers it; there is no shared ledger on which five deaths are added into one larger death; what I owe each person is not to treat them as indifferent, which is why choosing by lot sometimes strikes me as the only respectful thing available and sometimes as a dereliction. Test that against the cases and repair or discard it as you see fit.

  The cases, with my verdicts:

  1. There is one dose of a drug. A woman I have corresponded with for a year needs all of it to survive; divided, it will save five strangers. I give it to her. I do not think this is a failure I owe anyone an apology for.
  2. Same five, and the alternative is one stranger I have never met and know nothing about. I save the five, and I do not think it is close.
  3. Same five, and the alternative is one stranger I spoke with for twenty minutes on a radio. Now I am torn, and when I picture choosing the five I feel I have committed something like a betrayal, though I cannot say against whom.
  4. Five strangers, one of them a cardiac surgeon who would go on to save many lives, versus one stranger. I save the five, but I insist the surgeon counts for exactly as much as the others and that his future patients are irrelevant to my choice here.
  5. Four people are flooding into a sealed compartment. I can free them only by throwing a lever that will crush a fifth man's hand in the gearbox. I think it is impermissible to throw it. If the hand in the gearbox is my own, I think it is not merely permissible but decent to leave it there. I can explain this only by saying that I may spend what is mine, which does not sound like a principle.
  6. The one man's death would be mourned by three children; the five are each alone in the world. In argument I hold that the children make his death no worse and the five deaths no less bad. In practice I have never once managed to write that, and every scene I have drafted treats the death with dependents as the heavier thing.
  7. If the one man volunteers — genuinely, without pressure — I think it becomes permissible to divide his dose among the five. I do not think the five volunteering to be the one who loses changes anything at all, and I cannot say why the asymmetry holds.
  8. Five versus four: I save the five and it feels like barely a decision. Five versus one: I save the five and it feels like something I will have to live with. A million versus a million and four: I still think I must save the million and four, and I do not think a coin toss is acceptable, but I feel essentially nothing. Size of difference and strength of feeling have come apart, and I no longer know which of them my verdicts have been tracking.
  9. One case described two ways. As a tally — five lives, one life — I choose the five without hesitation. As a scene, with the one named, characterized, given a history and a particular way of laughing, I choose the one. I am inclined to call the second response a distortion, an occupational artifact of my trade. But I also suspect that knowing someone is a fact about the world and not merely a fact about my nerves, in which case the distortion story is too quick.
  10. One stranger versus one stranger, and the choice is genuinely balanced: I toss a coin and feel I have done the right thing. One versus five, and tossing a coin feels like an evasion, though by hypothesis I have just denied that the five clearly win.

  The case I keep circling is the climax itself. My coastguard can lift one more person out of the water before the boat is too heavy. He can take the woman he has been talking to by radio for two hours, whose voice he has come to know, or four people in a hull he sighted ninety seconds ago. I have drafted it both ways and I dislike both drafts.

  What I want back:

  - Your first sentence must be the bottom line: name the principle that best fits this pattern, and state in that same breath which of my verdicts it cannot keep. No preamble and no summary of what I have just written.
  - Then state the principle precisely enough that I could apply it to a case neither of us has thought of. Use clauses if it needs them, and for each clause say which numbered case it is doing work for. If a clause exists only to handle case 5, or only to rescue case 9, tell me so; I want to see exactly where the machinery is bolted on to save an intuition.
  - Then take up the question of felt weight. Is the divergence in cases 8 and 9 evidence about the situations, or noise in the instrument? If it is noise, how am I entitled to know that, given that the noise is the only apparatus I have? Answer this directly, because it determines whether I can use my own reactions as a novelist at all.
  - Then give me the principle's verdicts on four cases I have not raised: where the alternative to the five is one person's sight rather than one life; where the one is my dog; where I can save five now or one now and four in twenty years; and where the five are five separate people I could each rescue instead of the others, who never meet and never form a group.
  - Then offer the leanest principle you can that still gets most of my verdicts right, and tell me which verdicts it throws overboard and why I might prefer that loss to the complexity of the first. I would rather be told that two of my intuitions are false than be handed an epicycle for each of them.
  - Finally: what ought my coastguard to do, and is the fact that the right answer reads wrong on the page any reason at all to doubt it?

  No citations, no names, no bibliography, and no survey of the existing positions; I have read almost none of it and I want the argument to stand on the cases. Explain any term of art in passing as you go. About twelve hundred words, and no more.
reasoning: |-
  Hmm, the user is a novelist grappling with ethical dilemmas in a sea rescue climax. They've presented ten cases with intuitive verdicts, seeking a coherent principle that explains most while flagging inconsistencies. Their core tension: rejecting utilitarian aggregation while feeling the pull of numbers in some cases, yet resisting cold calculation when personal connection exists.

  Key elements from their cases:
  - Personal relationships create strong obligations (cases 1,3,9)
  - Pure numbers matter only without connection (case 2 vs 3)
  - Future consequences feel irrelevant (case 4)
  - Self-sacrifice is permissible but sacrificing others isn't (case 5)
  - Emotional weighting (dependents, characterization) conflicts with intellectual stance (cases 6,9)
  - Consent changes everything (case 7)
  - Scale numbs emotional response (case 8)
  - Tossing coins feels right only in truly balanced cases (case 10)

  Their proposed "shared ledger" rejection suggests they're wrestling with agent-relative duties versus impersonal calculus. The coastguard dilemma perfectly crystallizes this: voice-known stranger vs four unknown lives.

  Now constructing the principle:
  "Obligation to Known Particulars" fits best. It must explain:
  - Why the woman in case 1 trumps five strangers (established relationship)
  - Why five beat one stranger in case 2 (no competing particular)
  - The betrayal in case 3 (fledgling particularity)
  - Why the surgeon's value doesn't aggregate (future strangers aren't particulars)

  Clauses needed:
  1. **Relationship duty** (cases 1,3,5,9): Direct personal ties create stronger claims. Resolves why coastguard might save the voice-known woman.
  2. **Rescue primacy** (cases 2,4,7): When no particulars exist, save more lives. Requires defining "sufficient connection" threshold - case 3's radio chat might qualify.
  3. **Non-aggregation clause** (case 4): Future beneficiaries don't count.
  4. **Self-expenditure right** (case 5): You may sacrifice your own interests.
  5. **Voluntary transfer** (case 7): Consent converts a "particular" into willing resource.

  Where it strains:
  - Case 6's emotional pull toward dependents - must be rejected as bias unless framed as relationship to the children (which it isn't).
  - Case 9's characterization effect - arguably makes the person more "particular," but the principle must call this distortion to avoid arbitrariness.
  - Case 10's coin toss discomfort - reveals that numbers do matter when particulars are equal, creating tension.

  Felt weight analysis:
  The divergence is mostly noise. Case 8's numbness at scale is psychological attenuation - like not feeling each grain in a sandbag. Case 9's novelistic response is professional deformation: vividness mimics relationship. But since actual relationship (case 1) is fact-based, the principle can maintain that only real connections count, not manufactured salience. The novelist can still use reactions as diagnostic tools - the discomfort in choosing five over one acquaintance signals a moral truth, while the characterization effect signals a perceptual illusion.

  New cases verdicts:
  - **Sight vs lives**: Save five lives over one sight. Rescue primacy applies (no particulars).
  - **Dog vs stranger**: Save the stranger. Human particulars outweigh animal relationships.
  - **Five now vs one now + four later**: Save five now. Future particulars don't exist yet (non-aggregation clause).
  - **Separate rescues**: Each is a particular once engaged, so first-come first-served. No duty to optimize across unseen others.

  Lean principle proposal:
  "Save the most lives unless you share a significant personal history with fewer, or they consent to sacrifice. You may spend your own resources freely."

  This discards:
  - Case 6's dependents pull (demotes to sentiment)
  - Case 8's emotional scale effects (irrelevant)
  - Case 9's characterization effect (rejects vividness as morally relevant)
  - Case 10's coin toss qualms (embraces that numbers break ties)

  Coastguard verdict:
  He should save the four. Two hours of radio contact creates only weak particularity - not equivalent to years of correspondence (case 1). That this feels narratively unsatisfying doesn't invalidate it; good tragedy often lies in acting against emotional impulses. The draft's discomfort might signal needed narrative adjustment: either deepen their connection pre-rescue, or let him choose the four and confront the emotional aftermath.

  Final note: The principle's strength is rejecting aggregation while acknowledging that humans aren't interchangeable. Its weakness is defining "significant" history - but that ambiguity reflects moral reality.
answer: |-
  **Principle of Obligation to Known Particulars: We owe stronger duties to individuals with whom we share significant history or connection, and must save the most lives when no such connections exist, but this does not permit aggregating harms or sacrificing unconsenting others to benefit strangers. It fails case 2.**  

  ### Precise Principle with Clause Functions  
  1. **Duty of Connection**: When faced with saving A or B, and you share *significant bidirectional history* (e.g., correspondence, sustained interaction) with A but not B, you may prioritize A regardless of numbers. *Does work for cases 1 (year-long correspondence), 3 (radio chat creates nascent duty), and 9 (knowing someone is fact-based, not distortion; rejects tally approach).*  
  2. **Rescue Primacy**: When no significant connection exists to any party, save the greater number of lives. *Does work for cases 2 (stranger vs. five), 4 (surgeon irrelevant), and 8 (million vs. million+4; scale doesn’t negate duty).*  
  3. **Non-Aggregation Clause**: Harms (deaths, losses) cannot be summed across persons; future dependents or beneficiaries are irrelevant. *Does work for cases 4 (surgeon’s future patients), 6 (children’s grief is not a harm to the victim), and 8 (no shared ledger for losses).*  
  4. **Self-Expenditure Right**: You may voluntarily sacrifice your own body/property for others, but not an unconsenting other’s. *Does work only for case 5 (crushing your hand is permissible, another’s is not).*  
  5. **Voluntary Transfer**: Consent dissolves the duty of connection, allowing you to redirect a resource from a connected person to strangers. *Does work only for case 7 (asymmetry: the one can volunteer, the five cannot transfer their claim).*  

  ### Felt Weight: Noise, Not Evidence  
  The divergence in cases 8 and 9 is *noise in the instrument*. Case 8’s numbness at scale is psychological attenuation—your moral response dulls with abstraction, but the duty remains. Case 9’s preference for the characterized individual is professional bias: vivid details simulate *history*, tricking your empathy into seeing a connection where none exists. You are entitled to use your reactions diagnostically: discomfort when choosing five over one (case 3, 10) signals a *real duty of connection*, while the "heavy" feeling in five vs. one (case 8) or novelistic bias (case 9) reveals cognitive limits. Trust only reactions that align with actual relationships (case 1 vs. case 2), not manufactured salience.  

  ### Verdicts on New Cases  
  - **One sight vs. five lives**: Save five lives. Rescue primacy applies (no connection), and sight is a lesser harm but still non-aggregable.  
  - **One stranger vs. your dog**: Save the stranger. Dogs lack moral personhood; no significant history overrides human life.  
  - **Five now vs. one now + four in 20 years**: Save five now. Non-aggregation clause forbids counting future strangers; the "four later" do not currently exist as moral claimants.  
  - **Five separate rescues (no group)**: Rescue the first you encounter sequentially. Rescue primacy applies per encounter; no duty to optimize across disconnected scenarios.  

  ### Lean Principle and Sacrificed Verdicts  
  **Lean Principle: Save the most lives unless you share significant history with fewer, or they consent to sacrifice. Never harm an unconsenting person to aid others.**  
  - **Keeps**: Cases 1 (history), 2 (no history, save more), 3 (history complicates), 4 (no aggregation), 5 (self-sacrifice allowed), 7 (consent matters), 10 (no coin toss when numbers differ).  
  - **Discards**:  
    - Case 6: The "heavier" death with dependents is rejected as sentimentality. Dependents don’t intensify the loss. *Preferable because it avoids inflating harms with external factors.*  
    - Case 8’s feeling: Emotional numbness is irrelevant to the duty. *Preferable to preserve consistency across scales.*  
    - Case 9’s scene verdict: Choosing the characterized one is an illusion of connection; the tally response is correct. *Preferable to avoid arbitrariness in moral weight.*  
  - **Why leaner**: It drops clauses 3 and 4 (non-aggregation/self-expenditure), treating them as corollaries: harming others for aggregate good is forbidden (covering cases 5,6), and future strangers need no special clause (case 4). Sacrificing case 6’s intuition simplifies the principle without epicycles.  

  ### Coastguard Verdict  
  He should save the four strangers. Two hours of radio contact is not "significant history" (unlike case 1’s year-long correspondence), so rescue primacy applies. That this reads wrong on the page is not evidence against it—it reflects narrative discomfort, not moral error. Lean into that tension: the right act *should* feel alien in draft because his duty clashes with his empathy. Revise to emphasize his obligation to the unseen many, making the choice tragically defensible but haunting.  

