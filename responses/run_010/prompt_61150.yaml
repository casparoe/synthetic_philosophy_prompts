prompt: |-
  I'm the junior analyst on the red team at a foreign policy shop, and before anything goes out it has to clear our senior person — call her K — who signs off on every historical analogy in a memo. She's on leave for three weeks and I've got to write the recommendations in her name, so I'm trying to reverse engineer her rule from her track record.

  Here's the last year or so, in order:

  1. Memo comparing an adversary's annexation of a neighbor's peninsula to Munich 1938. Rejected. Her note said the memo was using it to make one option look like the only option.
  2. Memo comparing a rising power's naval buildup to the Anglo-German dreadnought race before 1914. Accepted, but she made the author cut the "this is how great wars start" part and keep only the bit about how each side's shipbuilding estimates were set by the other side's published program. That one was a background piece with no recommendation attached.
  3. Red-team diagnostic, no policy ask, comparing a dispute over missile deployments in a third country to the Cuban missile crisis. The analogy was about how the two leaderships communicated, not about how it would end. Rejected anyway — her note said 1962 came out the way it did because of a trade neither government could have counted on in advance, plus a clock that doesn't exist anymore.
  4. Memo comparing a possible run on the weak member of a currency union to the collapse of the big Vienna bank in 1931 and what happened to the German banking system next door. Accepted unchanged.
  5. Internal post-mortem on our own botched rollout of a data-sharing system, compared to a fairly obscure 1970s government computing failure. Mechanically it was a genuinely good match — same vendor lock-in, same requirement creep. Rejected, because the post-mortem was written by the office that had defended the rollout and had a stake in the conclusion.
  6. Memo comparing a rival's covert influence operations to Soviet-era "active measures." Accepted with a carve-out: fine for explaining how they segment an audience, not fine for predicting the campaign will fail, because we have no idea how many such campaigns failed quietly.
  7. Somebody floated the fall of Rome as an analogy for institutional decay at home. Rejected, basically without reading it.

  Our shop has in-house jargon for this. A **transfer claim** says a mechanism worked a certain way in the source case and there's reason to expect it here; an **outcome claim** says the ending will be the same. A use is **hot** when the analogy is load-bearing for a policy somebody already wants, **cold** when it's descriptive or diagnostic.

  New memo. It's from an analyst who is a well known hawk on this file — everyone knows it, she isn't hiding it. It's commissioned by the planning office as a stress test, there's no recommendation section at all, and her argument cuts against her own standing position: using the Pearl Harbor intelligence failure, she says a stream of ambiguous indicators gets sorted into whatever pattern the receiving side already expects, and that our current posture is the one exposed to that error. Honestly it's the best mechanism argument I've read all year. But Pearl Harbor is about as loaded a name as there is, the thing we remember it for is precisely that the signals were missed, and it's not obvious the outcome wasn't a pile of coincidences.

  What would K rule? More usefully: what rule is she actually running? Lay out the two or three candidate rules that fit all seven past verdicts equally well — notice that some of her rejections look like one-way vetoes rather than if-and-only-if tests, and say which. Then say what each candidate rule says about this memo, and commit to a prediction with your reasons. Also name one hypothetical eighth memo that would cleanly separate the candidates you're weighing, and say what principle our shop would be adopting if I overrode her and let it through.

  Last line exactly: Verdict: accept / reject / accept-with-reframe — one of those three.
reasoning: |-
  Okay, let me tackle this systematically. The user is a junior analyst trying to reverse-engineer their senior K's rules for historical analogies in policy memos, based on seven past cases. The new memo uses Pearl Harbor as an analogy for intelligence failures in ambiguous situations, and the user needs to predict K's verdict.

  First, I need to look at K's pattern from the seven examples. There are clear themes in her rejections and acceptances. Memo 1 (Munich 1938) was rejected for making one option seem like the only choice, which suggests K dislikes analogies that force policy conclusions. Memo 2 (Anglo-German naval race) was accepted only after removing the "how wars start" outcome claim, keeping only the mechanism about shipbuilding estimates. That shows K is okay with transfer claims (mechanisms) but not outcome claims.

  Memo 3 (Cuban missile crisis) was rejected despite being a cold use because K thought the outcome depended on unique factors. Memo 4 (Vienna bank collapse) was accepted unchanged, likely because it focused on the mechanism of financial contagion without predicting an inevitable outcome. Memo 5 (1970s computing failure) was rejected due to authorship bias, showing K cares about the credibility of the source when the analogy supports a vested interest.

  Memo 6 (Soviet active measures) was accepted with limitations—only for mechanisms like audience segmentation, not for predicting failure. Memo 7 (fall of Rome) was outright rejected, probably because it's an overused, deterministic analogy for decline.

  From this, K seems consistent about three things: rejecting outcome claims, rejecting hot uses where analogies drive predetermined policies, and rejecting overdetermined analogies (like Rome). She accepts cold, mechanism-focused transfer claims if they're not outcome-dependent and avoid loaded historical baggage.

  Now for the new Pearl Harbor memo. It's a cold use (diagnostic, no recommendation), focuses purely on the mechanism of intelligence failure in ambiguous situations (transfer claim), and argues against the author's own bias. But Pearl Harbor is highly loaded, and K might question if the outcome was just coincidental rather than a reliable mechanism.

  Testing candidate rules:
  - Rule 1: Accept cold transfer claims; reject hot/outcome claims. This fits all cases except Memo 3 (rejected despite being cold/transfer). 
  - Rule 2: Accept transfer claims only if the outcome wasn't highly contingent (avoids Memo 3's problem). This fits all cases: Memo 3 rejected for contingency, Memo 4 accepted as less contingent. 
  - Rule 3: Add a veto for overdetermined analogies (e.g., Rome) even if cold/transfer.

  Rule 2 is strongest. The Pearl Harbor memo has a contingent outcome (was it coincidences?), so Rule 2 might reject it. But the memo cleverly avoids the outcome, focusing only on the mechanism. If K applies Rule 2 strictly, she might still reject due to contingency baggage. However, since the memo is cold, unbiased, and mechanism-only, K might accept it with a reframe to downplay the Pearl Harbor label.

  A test case: A cold memo comparing modern cyber escalation to the 1914 July Crisis' mechanism of automated mobilization, avoiding war outcomes. Rule 1 would accept; Rule 2 might reject due to contingency. If accepted, Rule 2 is falsified.

  Prediction: K would accept-with-reframe, asking to generalize the example beyond "Pearl Harbor" to avoid outcome associations. Verdict: accept-with-reframe.
answer: |-
  Based on K's seven rulings, I identify three candidate rules that fit all past verdicts equally well. Each reflects a different emphasis in her decision-making, but all share a core principle: **Analogical validity hinges on avoiding deterministic or policy-driven conclusions, especially when historical outcomes were contingent or the analogy is politically overdetermined.** Below is the analysis, followed by the verdict for your new memo.

  ---

  ### **Candidate Rules**
  1. **Rule A: Outcome Claims Are Unacceptable; Transfer Claims Are Acceptable Only If Cold and Non-Contingent**  
     - Rejects *any* outcome claim (e.g., "this leads to war/collapse").  
     - Accepts transfer claims (mechanisms) only if:  
       - The use is **cold** (no policy bias), *and*  
       - The source case's outcome was **not highly contingent** (i.e., not dependent on unique, unrepeatable factors).  
     - **Vetoes**: Analogies that are overdetermined (e.g., Rome/Munich) due to cultural/political baggage, regardless of other factors.  

  2. **Rule B: Focus on Mechanism Credibility Over Use Context**  
     - Accepts transfer claims if the mechanism is:  
       - **Testable and falsifiable** (e.g., data allows validation), *and*  
       - **Not outcome-dependent** (i.e., the mechanism stands even if the historical outcome was fluky).  
     - Rejects *all* outcome claims.  
     - **Vetoes**: Cases where the analogy's credibility is compromised by authorship bias or overdetermination, even if the mechanism is sound.  

  3. **Rule C: Policy Neutrality Is Paramount**  
     - Accepts only **cold** analogies with **transfer claims**, *unless* the analogy inherently implies an outcome (e.g., Pearl Harbor/Rome).  
     - Rejects outcome claims *and* transfer claims if:  
       - The source case is politically **overdetermined**, *or*  
       - The mechanism is **inextricable from its historical outcome** in the cultural imagination.  
     - **Vetoes**: Any use where the analogy could be weaponized to limit policy options (e.g., Munich).  

  ---

  ### **How the Rules Fit All Seven Cases**
  | Memo | K's Verdict | Rule A | Rule B | Rule C |
  |------|-------------|--------|--------|--------|
  | 1. Munich (outcome/hot) | Rejected | ❌ Outcome claim + hot | ❌ Outcome claim | ❌ Overdetermined + hot |
  | 2. Dreadnought race (transfer/cold) | Accepted (cut outcome) | ✅ Cold + non-contingent mechanism | ✅ Testable mechanism | ✅ Cold + neutral |
  | 3. Cuban Missiles (transfer/cold) | Rejected | ❌ Contingent outcome | ❌ Mechanism outcome-dependent | ❌ Overdetermined |
  | 4. Vienna Bank (transfer/cold) | Accepted | ✅ Cold + non-contingent | ✅ Testable mechanism | ✅ Cold + neutral |
  | 5. 1970s Computing (transfer/cold) | Rejected | ❌ Authorship bias | ❌ Credibility compromised | ❌ Authorship bias |
  | 6. Soviet Ops (transfer/cold) | Accepted (cut outcome) | ✅ Cold + mechanism standalone | ✅ Mechanism testable | ✅ Cold + reframed neutrally |
  | 7. Fall of Rome (outcome/hot?) | Rejected | ❌ Overdetermined | ❌ Overdetermined | ❌ Overdetermined |

  ---

  ### **Ruling on the Pearl Harbor Memo**
  - **Context**: Cold use (diagnostic, no recommendation), transfer claim (mechanism of intelligence failure), authored by a hawk arguing *against* her bias.  
  - **Strengths**: Purely mechanistic ("ambiguous indicators sorted into expected patterns"); no outcome claim; cold use.  
  - **Risks**: Pearl Harbor is **overdetermined** (synonymous with "failure"), and its outcome *could* be seen as contingent (e.g., coincidences, unique context).  

  **Candidate Rule Predictions**:  
  - **Rule A**: Rejects. Outcome was contingent ("pile of coincidences"), and "Pearl Harbor" is overdetermined baggage.  
  - **Rule B**: Accepts. Mechanism is testable (e.g., intel failures are empirically studied) and standalone (works even if 1941 was fluky).  
  - **Rule C**: Rejects. Overdetermined analogy risks importing outcome associations, undermining neutrality.  

  **My Prediction**: K would **accept-with-reframe**.  
  - **Why?**  
    1. The memo **avoids outcome claims**, focusing only on a transferable mechanism (like Memo 2 and Memo 6).  
    2. It is **cold and counter-bias** (like Memo 4), so authorship isn’t suspect.  
    3. But K would likely demand a **reframe to decouple the mechanism from "Pearl Harbor"** (e.g., "pre-1941 U.S. intelligence failure" or "historical cases of pattern-matching in ambiguous intel"). This mirrors Memo 6’s carve-out to isolate the mechanism from outcome baggage.  
  - **Risk Mitigated**: Reframing neutralizes overdetermination by generalizing the lesson.  

  **Verdict**: accept-with-reframe  

  ---

  ### **Hypothetical Eighth Memo to Separate Rules**  
  **Scenario**: A *cold*, transfer-claim memo comparing modern AI ethics debates to the 1975 Asilomar Conference (where scientists self-regulated biohazards). Mechanism: "Consensus-driven governance by experts can preempt backlash." No outcome claims.  
  - **Rule A Accepts**: Cold, non-contingent mechanism (Asilomar succeeded without unique factors).  
  - **Rule B Accepts**: Mechanism is testable (e.g., other expert-led governance cases exist).  
  - **Rule C Rejects**: Asilomar is overdetermined in tech-policy circles (often invoked to push self-regulation).  
  - **Separates**: Rule C vs. Rules A/B. If you override K and **accept** this memo, the shop adopts:  
    > **"Neutral mechanisms are acceptable even in loaded analogies, provided the use is cold and the claim is strictly transfer-based."**
