  ### What the Protocol Cannot Do

  **Family resemblance underdetermines extension**. No set of comparisons draws a bright line; it only ranks candidates by resemblance strength. Marginal cases (e.g., "e-sport" at distance 2) are settled by the **ledger of past decisions**, not the protocol alone. The ledger is the institutional memory—e.g., how "chess" was handled for "sport" sets precedent for "e-sport." Without it, chains drift, and boundaries blur.  

  **Safeguards against drift**:  
  1. **Ledger Audits**: Quarterly reviews comparing new decisions to past cases (e.g., "Does 'e-sport' align with 'chess'?").  
  2. **Paradigm Bank Updates**: Revise LBRs only when corpus shifts fundamentally (≥30% counter-evidence).  
  3. **Escalation Thresholds**: Automatically escalate cases with >2 precedent conflicts.  
  4. **Transparency**: Publish all traces (like public notes here) to deter policy creep.  

  The protocol structures judgment but can't replace it. When Wittgenstein whispers, "Look and see," this ledger is what we look *at*.
