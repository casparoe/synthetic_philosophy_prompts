prompt: |-
  Our intake desk handles roughly forty proposals a month at a mid-sized, corpus-driven general dictionary — descriptive in principle, 1.4 million citations, about 300,000 numbered senses — and the house style guide gives my two junior editors exactly one word to work with when they decide whether a usage is a new numbered sense, a sub-case of an existing one, or a metaphor that has not yet hardened into meaning: the usage must be *established*. In practice they settle almost every hard case the same way, by drafting a candidate definition and then testing the usage against it, which is precisely the habit I have been asked to break, because the words that generate nearly all of our disputes are words for which no such definition can be written — and not because we are lazy. Wittgenstein's discussion of games gives the diagnosis: the applications of such a word hang together by a network of overlapping and criss-crossing similarities, no one of which runs through all of them, like a thread whose strength comes from many short fibres overlapping rather than from a single fibre running its whole length. That is a perfectly good account of why our current method fails and no help at all on a Thursday afternoon. I also know how this goes wrong when people try to operationalize it: either the checklist turns out to be a classical definition in disguise — a fixed feature list applied jointly to cases that conspicuously lack one of the features — or it collapses into "count the resemblances," which is not a test, since anything can be made to resemble anything in some respect.

  So please write me the triage protocol the desk can actually run. Write as a lexicographer who has spent twenty years on an intake desk and reads the *Investigations* sideways; before you draft the steps, spend a short paragraph identifying the failure modes a protocol of this kind is exposed to, and let that drive the design. I want an ordered sequence of steps, and for each step: the question asked, the evidence that counts as a sufficient answer, and where that answer routes the proposal. The protocol has to say what a candidate is compared *against* — which paradigm entries, kept how, and revised under what conditions — and how a resemblance claim gets recorded as named respects of similarity and difference rather than as a general air of kinship. It has to tell my editors how to say which respects are load-bearing, and to do so without pretending that this is a computation. It needs an explicit branch for the case where our corpus holds no close paradigm on either side, and an explicit treatment of non-transitivity: we already accept two senses that overlap with each other, and a candidate overlaps with the second but with neither the first nor the original core, and a chain of that kind can walk a concept anywhere it likes, so I want to know what the protocol says stops it. It should distinguish a usage that is frequent from one that is established, and live figurative use from an acquired sense. And it should mark, visibly and in its own typographic register, the steps that are judgment wearing procedural clothing, plus the class of case where the question ceases to be lexicographic and comes to me as editorial policy — organized pressure from a trade body, foreseeable legal consequences, register politics. Every step's output must be phrased so that it could appear verbatim in the public note explaining a decision to someone who lost. Assume the users have no philosophy training and twenty minutes a case; assume I sign off only if the trace ends in a stop or in an escalation to me. Do not give me a bibliography or a reading list, and if you invoke Wittgenstein, paraphrase rather than quote and do not attach section numbers you are not certain of.

  Then run the protocol on three live proposals, showing the step-by-step trace rather than a verdict, and let at least one of them come out against my wishes:

  1. **Oat, almond, and soy "milk."** Used predicatively and in recipes by people who do not drink dairy, attested across registers, and the object of sustained pressure from a dairy trade association asking us to restrict the word. New numbered sense, sub-case of the existing one, or unresolved? Note that one of the three inputs here is not lexicographic evidence at all, and I want the protocol to show that.
  2. **"Algorithm" as a fixed routine in ordinary non-technical speech** — the algorithm of the morning commute, the algorithm of an election campaign. This is my own case; I have argued for a separate sense at two panel meetings, and my editors are polite about it. I expect the trace to reject it as figurative-and-not-yet-established, and I want the reason written so plainly that two junior editors can hand it to me.
  3. **Whether "e-sport" falls under our existing sense of "sport."** We already admit recreational and blood-sport senses that overlap with *game* rather than with *athletics*, and an international governing body's recognition of the activity has been cited at us. Use this one to expose both the chain-walking problem and, if it does in fact arise here, a step at which the protocol cannot deliver and the case escalates to me.

  Close with a short section on what the protocol cannot do. I specifically want you to say, if you think it is true, that family resemblance underdetermines the extension — that the comparisons only fix a ranking of candidates and never a boundary — and that what actually settles the marginal cases is our ledger of past decisions and the practice built on it, not the reasoning in any individual trace. If that is right, say it plainly and tell me what safeguards a desk like mine needs so the ledger does not simply drift, rather than papering over the gap with a final step called "editorial judgment."
reasoning: |-
  We are designing a triage protocol for lexicographical sense assignment. The protocol must handle cases where words have family resemblances (Wittgensteinian) and avoid the pitfalls of classical definitions or vague resemblance counting. The goal is to determine if a usage is a new numbered sense, a sub-sense, or an unresolved (e.g., metaphorical) usage.

  Failure modes for such a protocol:
  1. **Reversion to classical definition**: The protocol might implicitly require a set of necessary and sufficient conditions, which does not exist for family-resemblance concepts.
  2. **Vagueness of "resemblance"**: Without clear guidance, editors might count arbitrary resemblances, leading to inconsistent decisions.
  3. **Over-reliance on frequency**: Mistaking frequent usage for established meaning, or vice versa.
  4. **Chain-walking (non-transitivity)**: Allowing a chain of overlapping senses to extend the concept too far from the core.
  5. **Conflation of live metaphor and acquired sense**: Not distinguishing between a novel figurative use and a sense that has become independent.
  6. **Policy intrusion**: Not flagging when non-lexicographic factors (e.g., trade pressure) are influencing the decision.

  To address these, the protocol will:
  - Use paradigm examples (stored in a "Paradigm Bank") for comparison. The Paradigm Bank is a curated set of example sentences for each numbered sense, maintained by senior editors and updated when a new sense is added or when a review (every 5 years) suggests a shift.
  - Require named respects of similarity and difference (e.g., "similar in being competitive", "different in requiring physical exertion") to avoid vague impressions.
  - Explicitly handle non-transitivity by requiring a direct link to an existing paradigm and setting a maximum chain length (of 2 steps from the core) to prevent drift.
  - Distinguish frequency from establishment by requiring evidence of the usage in multiple independent contexts and registers over time (at least 5 years of consistent use in the corpus, unless the word is very new).
  - Include explicit steps to flag policy issues.

  The protocol steps are designed to be followed in order. Each step either routes the proposal (to "New Sense", "Sub-sense", "Unresolved", "Escalate") or moves to the next step.

  ---

  **Triage Protocol for Sense Assignment**

  **Step 1: Corpus Check**
  - **Question**: Does the corpus contain at least 50 independent examples (different authors, contexts) of this usage, spanning at least 3 distinct registers (e.g., formal, informal, technical, literary) and over a period of at least 5 years? (For very recent words, use a lower threshold of 2 years and 30 examples, but flag for review in 3 years.)
  - **Evidence**: Corpus query results showing the required distribution.
  - **Routing**:
    - No: Route to **Unresolved (Frequency)**. (This usage is not yet established due to insufficient evidence.)
    - Yes: Proceed to Step 2.

  **Step 2: Paradigm Comparison**
  - **Question**: For each existing numbered sense of the word, retrieve its Paradigm Bank examples (3-5 per sense). Can the candidate usage be substituted into at least one example sentence of an existing sense without changing the truth conditions or creating a marked oddity? (That is, does it fit an existing sense as a direct instance?)
  - **Evidence**: Side-by-side comparison of candidate usage in the paradigm sentences. If substitution works, note which sense and example.
  - **Routing**:
    - Yes: Route to **Sub-sense** of that existing sense (if the sense has sub-senses, recurse on the sub-sense paradigms). 
    - No: Proceed to Step 3.

  **Step 3: Overlap with Family Resemblance**
  - **Question**: For each existing sense (starting with the core sense and moving outward), identify named respects of similarity and difference between the candidate usage and the sense's paradigm examples. (Named respects must be concrete: e.g., "both involve rules", "both have winners and losers", "differ in physicality", etc.) Is there an existing sense such that the candidate shares at least two load-bearing respects? (Load-bearing respects are those that appear in the sense's definition and in the majority of its paradigms. Note: The Paradigm Bank for each sense includes a list of load-bearing respects, maintained by senior editors.)
  - **Evidence**: List of respects (similarities and differences) with justification why they are load-bearing (by reference to the Paradigm Bank) or not. 
  - **Routing**:
    - Yes (for at least one sense): Proceed to Step 4 (to check for chain-walking).
    - No: Proceed to Step 5 (new sense check).

  **Step 4: Chain-Walking Check**
  - **Question**: For the sense(s) identified in Step 3, what is the chain distance from the core sense? (Core is distance 0; a sense directly overlapping with core is 1; a sub-sense of that is 2; etc.) And is the candidate usage within a maximum chain distance of 2 from the core?
  - **Evidence**: Record the chain (e.g., core sense -> sense 3 -> candidate). The maximum chain length is fixed at 2 (i.e., the candidate must be at most distance 2 from the core).
  - **Routing**:
    - Distance ≤ 2: Route to **Sub-sense** of the closest existing sense (if multiple, choose the one with the most load-bearing similarities).
    - Distance > 2: Proceed to Step 5 (new sense check) -- but note that this might indicate a chain that has walked too far.

  **Step 5: New Sense Check**
  - **Question**: Does the candidate usage share at least one load-bearing respect with at least one existing sense (as per Step 3) but also introduce a new load-bearing respect that is not present in any existing sense? (The new respect must be evident in the majority of candidate examples and must be central to the usage.)
  - **Evidence**: Named load-bearing respects: one shared with an existing sense and one new. The new respect must be justified by the candidate examples.
  - **Routing**:
    - Yes: Proceed to Step 6 (to check for non-lexicographic factors).
    - No: Route to **Unresolved (Figurative or Emergent)**.

  **Step 6: Non-Lexicographic Factors**
  - **Question**: Is there organized external pressure (e.g., from a trade body, legal threat, or public controversy) that might influence the decision? Or is the usage in a register that we have policy about (e.g., we avoid slang in main entries)? 
  - **Evidence**: Documented pressure, or internal policy notes.
  - **Routing**:
    - Yes: **Escalate to Senior Editor** (for policy decision). 
    - No: Route to **New Sense**.

  **Special Cases**:
  - If at any point the Paradigm Bank has no close paradigm (i.e., the word is new or the usage is in a domain without existing senses), skip to Step 5 and use the core sense (if any) for comparison. If no core sense exists, then the word is new and this is the first sense (but that's beyond this protocol).

  **Recording**:
  - Every step's output (e.g., "Step 1: Frequency not met: only 20 examples over 2 years") must be written in plain language for public notes.

  **Judgment Steps** (marked with **J** in the trace):
  - Step 3 (identifying load-bearing respects and similarities) and Step 5 (whether a new respect is load-bearing) are judgment steps. They are proceduralized by requiring named respects and reference to the Paradigm Bank, but the matching is not computational.

