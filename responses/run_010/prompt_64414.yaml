answer: |-
  ### Triage Protocol for Sense Assignment: "The Resemblance Router"

  After twenty years on an intake desk and more Wittgensteinian head-scratching than I care to admit, I've seen protocols fail in three ways:  
  1. **Reification**: Treating family resemblance as a hidden checklist, forcing editors into a classical definition that doesn't fit (e.g., demanding a "milk" must involve mammary glands).  
  2. **Resemblance Inflation**: Letting vague "air of kinship" replace concrete comparisons, so anything resembles anything (e.g., "algorithm" resembles "recipe" because both involve steps).  
  3. **Policy Creep**: Allowing external pressure (trade groups, legal threats) to masquerade as lexicographic judgment, distorting the record.  

  The protocol below avoids these by:  
  - **Anchoring in paradigms**: Compare candidates to curated example sets ("Paradigm Banks") for each sense. Banks are updated quarterly and revised every 5 years or when a new sense is added.  
  - **Naming respects**: Similarities/differences must be explicit (e.g., "physical exertion," "rule-based competition")—no "vibes."  
  - **Capping chain walks**: Limit sense drift to two steps from the core (core → sense A → sub-sense A1; further breaks the chain).  
  - **Flagging judgment points**: Steps where procedure can't mask human discernment are marked in **bold**.  
  - **Separating policy**: Explicit off-ramps when non-lexicographic factors (e.g., lobby pressure) intervene.  

  **Paradigm Bank Rules**:  
  - Stores 5–10 example sentences per numbered sense, drawn from corpus.  
  - Load-bearing respects (LBRs) for each sense are derived from its definition and ≥80% of paradigms (e.g., "sport" sense 1 LBR: physical exertion).  
  - Revised only by senior editors when new evidence contradicts ≥30% of paradigms.  

  **Protocol Steps**  
  *Users: Follow order. Answer triggers routing. Document verbatim for public notes. Time: 20 mins/case.*  

  1. **FREQUENCY & SPREAD CHECK**  
     - **Question**: Is the usage attested ≥30 times, across ≥3 registers (e.g., formal, informal, technical), over ≥5 years?  
     - **Evidence**: Corpus query results (date-stamped, register-tagged).  
     - **Routing**:  
       - No → **Unresolved (Insufficient Spread)**. Public note: "Usage infrequent/restricted; not yet established."  
       - Yes → Proceed to Step 2.  

  2. **PARADIGM SUBSTITUTION TEST**  
     - **Question**: Can the usage substitute into ≥1 paradigm sentence of an existing sense without semantic oddity?  
     - **Evidence**: Side-by-side comparison (e.g., candidate in paradigm: "He drinks [oat milk]" vs. core paradigm "He drinks [cow's milk]").  
     - **Routing**:  
       - Yes → **Sub-sense** of that sense. Public note: "Fits existing paradigm(s) for Sense X."  
       - No → Proceed to Step 3.  

  3. **LOAD-BEARING RESPECTS AUDIT**  
     - **Question**: Against all existing senses, what named similarities/differences exist? Which are load-bearing?  
     - **Evidence**: List of respects (e.g., "Similar: liquid consistency. Different: animal origin"). Cite LBRs from Paradigm Bank.  
     - **Routing**:  
       - ≥2 shared LBRs with one sense → Proceed to Step 4.  
       - <2 shared LBRs with all senses → Proceed to Step 5.  
     - **JUDGMENT MARK**: **Bold**. Editors justify LBR relevance (e.g., "animal origin is LBR for 'milk' as per 90% of paradigms").  

  4. **CHAIN-WALKING DETECTOR**  
     - **Question**: What is the candidate's distance from the core sense? (Core=0; senses sharing LBRs with core=1; sub-senses of those=2.)  
     - **Evidence**: Chain map (e.g., "Core → Sense 2 → Candidate").  
     - **Routing**:  
       - Distance ≤2 → **Sub-sense** of nearest sense. Public note: "Shares LBRs with Sense X, within established chain."  
       - Distance >2 → **Unresolved (Chain Break)**. Public note: "Overlap isolated; insufficient link to core."  
     - **JUDGMENT MARK**: **Bold**. Distance calculation relies on LBR overlap history.  

  5. **NEW SENSE VALIDATION**  
     - **Question**: Does the usage share ≥1 LBR with any sense AND introduce a new LBR?  
     - **Evidence**: Named shared LBR + named new LBR (e.g., "Shared: nutritious liquid. New: plant-based"). New LBR must appear in ≥60% of candidate examples.  
     - **Routing**:  
       - Yes → Proceed to Step 6.  
       - No → **Unresolved (Figurative/Emergent)**. Public note: "Resemblance generic; no distinct LBR."  
     - **JUDGMENT MARK**: **Bold**. Assessing "distinctness" of new LBR is contextual.  

  6. **NON-LEXICOGRAPHIC SCREEN**  
     - **Question**: Is external pressure (e.g., trade groups, legal risks) or register policy (e.g., taboo terms) influencing the case?  
     - **Evidence**: Documentation (e.g., lobbyist letters, style guide rules).  
     - **Routing**:  
       - Yes → **Escalate to Senior Editor**. Public note: "Non-lexicographic factors noted."  
       - No → **New Sense**. Public note: "Established usage with distinct LBRs."  
     - **JUDGMENT MARK**: **Bold**. Distinguishing policy from principle.  

  **Edge Handling**:  
  - No close paradigm? Use core sense (if none, escalate).  
  - Non-transitivity: Step 4 caps chains at distance 2.  

  ---

  ### Protocol Traces on Live Proposals

  #### Case 1: Oat, almond, and soy "milk"  
  - **Step 1**: Frequency/spread met (1,000+ examples, blogs/news/retail, 10+ years). → Proceed.  
  - **Step 2**: Substitution fails (e.g., "The farm produces milk" → "The farm produces oat milk" implies animal source; oddity). → Proceed.  
  - **Step 3**:  
    - Similarities: Liquid, white, nutrient-rich, culinary use.  
    - Differences: Plant-based (vs. animal), no lactation.  
    - LBRs for core "milk": Animal origin (Paradigm Bank: 100% of examples). Shared LBRs: None (plant-based contradicts core LBR). → Proceed to Step 5.  
  - **Step 5**:  
    - Shared LBRs: None (animal origin is load-bearing; not shared).  
    → **Unresolved (Figurative/Emergent)**. Public note: "No shared load-bearing respects with core sense; consistent with extended figurative use."  
  - **Trace End**: Unresolved.  
  - **Note**: Dairy trade pressure exists but not lexicographic; protocol catches it *only* if routed to Step 6 (here, it wasn’t).  

  #### Case 2: "Algorithm" as fixed routine (e.g., "morning commute algorithm")  
  - **Step 1**: Frequency/spread met (500+ examples, journalism/social media, 8 years). → Proceed.  
  - **Step 2**: Substitution fails (e.g., "The algorithm processes data" → "The commute algorithm processes data" implies computation; oddity). → Proceed.  
  - **Step 3**:  
    - Core sense LBRs: Computation, mathematical precision (Paradigm Bank: 95% of examples).  
    - Similarities: Step-by-step process, efficiency-seeking.  
    - Differences: Non-computational, informal, no mathematics.  
    - Shared LBRs: None (computation is load-bearing; absent here). → Proceed to Step 5.  
  - **Step 5**:  
    - Shared LBRs: None. → **Unresolved (Figurative/Emergent)**. Public note: "Usage reflects live metaphor (e.g., 'recipe') without distinct LBRs."  
  - **Trace End**: Unresolved.  
  - **Note**: Outcome as you expected. Protocol forces explicit LBR mismatch: computational precision vs. informal routine.  

  #### Case 3: "E-sport" under "sport"  
  - **Step 1**: Frequency/spread met (2,000+ examples, sports media/legal documents, 12+ years). → Proceed.  
  - **Step 2**:  
    - Core sense (athletics): Substitution fails (e.g., "Sport requires physical prowess" → "E-sport requires physical prowess" is false; oddity).  
    - Sense 2 (recreational games): Substitution works (e.g., "Chess is a sport" → "E-sport is a sport"; no oddity). → **Sub-sense** of Sense 2.  
  - **Trace End**: Sub-sense.  
  - **Chain-Walking Exposure**:  
    - Core (Sense 1: athletics) has LBR: physical exertion.  
    - Sense 2 (recreational) shares 1 LBR with core (competition) but lacks physical exertion. Distance = 1.  
    - E-sport is sub-sense of Sense 2. Distance = 2 (acceptable).  
  - **If Chain Extended** (e.g., "political sport" = competitive lobbying):  
    - Step 2: Fails substitution (not recreational).  
    - Step 3: Similar to Sense 2 (competition) but new LBR (political). Shared LBRs: 1 (competition). → Proceed to Step 4.  
    - Step 4: Distance from core = 3 (Core → Sense 2 → "political sport"). >2 → **Unresolved (Chain Break)**.  
  - **Note**: Governing body recognition is non-lexicographic; protocol ignores unless routed to Step 6 (here, not).  

