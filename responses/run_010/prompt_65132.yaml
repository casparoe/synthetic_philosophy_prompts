prompt: |-
  So — slightly unusual question, and I'd rather get it from someone who's actually worked through the chance-and-credence literature than from a textbook summary of it.

  Our department just got a small pot of money that has to be spent over the next 18 months: enough for one two-day workshop and one grad RA at half time, and I'm the person who has to name the theme in the proposal, which is due at the end of next month. It has to be the chance/credence interface — basically everything downstream of Lewis's Principal Principle — and it has to be one framing question, not a vague banner. Two constraints on what's realistic for us. First, we're strong in formal epistemology and comfortable with probability theory plus a bit of modal logic, but nobody here does philosophy of physics seriously, so a theme that only pays off if you understand statistical mechanics or the Everett stuff is a theme that produces a room full of people nodding politely. Second, I want the workshop to generate real disagreement — a question where someone smart could leave on day two having changed their mind — not a round of status reports.

  Here's the shortlist I've been circling, in my own words, which I should warn you are probably sloppy in places:

  1. Admissability. Whether there's any non-circular, non-pragmatic account of which evidence is admissible at all, or whether we should concede that the term has ended up meaning whatever makes the principle come out true — in which case the live question is whether the principle is analytic or a substantive norm about rational credence.
  2. Undermining, i.e. the thing Lewis called the big bad bug. Are undermining futures a genuine cost for best-systems accounts of chance, or was Lewis overreacting? And if they're genuine, is the right response Hall's New Principle, one of the Vranas-style reconciliations of the old and new principles, or giving up on a general chance-credence constraint for Humeans altogether?
  3. The new bug. My understanding — which may just be wrong — is that once you move to the New Principle, chance hypotheses themselves stop being governed by it, so you can't use the chances to reason about what the chances are. If that's right, how bad is it in practice?
  4. Whether the Principal Principle can be derived from something more basic, decision-theoretic or accuracy-based, instead of being a primitive norm.
  5. Imprecise chance: can chance itself be a range or a set of functions, should deference generalize to that case, and have the imprecise-probability people actually answered the arguments that rational credence has to stay sharp?
  6. Deterministic chance — whether there can be chances in a deterministic world, and what the principle is even supposed to say when it's handed one.
  7. Everett and branch weights. My instinct is that this is out of scope for us, but maybe that's exactly where 1 through 3 stop being technical tidying and start mattering.

  What I want: rank these for my purposes — the workshop theme plus one year of an RA's time — and defend the ranking rather than just assert it. Be explicit about your criteria and how you're trading them off: how much of the rest of the list depends on settling this one, whether resolving it would change what anyone does next, how saturated the ground already is (I do not want to fund the nineteenth paper on the same objection), and whether it's tractable with the toolkit we actually have. Then commit: tell me which single one to build the workshop around, which to cut or demote to a side session, and which of these are secretly the same question wearing different clothes. Also flag every place I've got the dialectic wrong in the list above — that's genuinely part of what I'm after, so don't be polite about it. And say what would move the ranking over the next year and a half: what result, or what sort of argument, would promote something you've ranked low or sink something you've ranked high.

  Two last things. My own bias is toward 2, mostly because I wrote my dissertation on best-systems accounts and I suspect that's familiarity doing the work rather than judgement — push back if you think it is. And I'd much rather you take a stand than give me a balanced tour: if you think one of these is a pseudo-problem, or that the whole debate turns on a distinction nobody has bothered to draw, say so and argue for it. No references or reading lists, by the way — I can pull those myself, and I want the reasoning, not the bibliography.
reasoning: |-
  Okay, this is a meaty request from someone clearly deep in the trenches of formal epistemology. They need a ranked, defended shortlist for a workshop theme with specific constraints: no heavy physics dependence, must spark live disagreement, and must leverage their department's strengths. The personal bias toward undermining futures (item 2) is noted but needs challenging if warranted. 

  First, unpacking their unspoken priorities: they want intellectual payoff, not just activity. "Changing minds by day two" means the theme needs unresolved tension where arguments could actually shift positions. The RA time matters too - some questions might require grinding through math (better for RA work), while others need conceptual heavy lifting (better for workshop debates). 

  Noticing their framing of admissibility (1) as circularity vs analyticity is already hinting at fatigue with stale debates. They're right to suspect item 7 (Everett) is a non-starter for their group. Item 3 (new bug) feels niche - if it's truly about chance hypotheses self-applying, that might collapse into either 2's undermining or 4's derivations. 

  The real contenders seem to be 2 (undermining), 4 (deriving PP), and 5 (imprecise chance). But 5 risks becoming technical without philosophical punch unless tied to foundational issues. Item 6 (deterministic chance) is important but might play out as a special case of 2 or 4. 

  Ah - their meta-concern about "questions secretly wearing different clothes" is perceptive. Undermining (2) and deterministic chance (6) both challenge Humean chance at its joints. Meanwhile, trying to derive PP (4) might force confrontation with admissibility (1). 

  Biggest red flag in their list: calling the New Principle's "new bug" (3) a standalone issue. Hall's 1994 fix was precisely to handle self-undermining, so if NP has new issues, they're either technical footnotes (unworthy of a workshop) or signs of deeper rot in the framework (which brings us back to 2 or 4). 

  Forcing a ranking:  
  - Top slot must be 2 (undermining). It's the rotting timber in the Humean house - if it falls, everything from best-systems to deterministic chance gets rebuilt. Perfect for disagreement: Humeans vs non-Humeans will clash hard, and even Humeans fracture over solutions. RA could model different fixes.  
  - Close second: 4 (deriving PP). If successful, it could dissolve admissibility debates (1) and maybe even address 6. But it's less contested - accuracy arguments already exist, so disagreement might be milder.  
  - Demote 5 (imprecise chance) unless framed as attacking "why sharp credence?" - but that overlaps with 4.  
  - Kill 3 (new bug) and 7 (Everett). They're physics-flavored dead ends for this group.  

  Watch for this in 18 months: if Pettigrew or someone drops a bombshell derivation of PP (4), it could leapfrog to #1. If a new undermining counterexample emerges, 2 stays king. 

  Final shove: Their bias toward 2 is justified. It's the live wire. Frame the workshop as "Undermining Futures: A Fatal Flaw or Philosopher's Fever Dream?" and let realists and Humeans duel it out. The RA can test if New Principle genuinely avoids the bug or just moves it.
answer: |-
  Here’s a brutally honest ranking based on your constraints, goals, and the current dialectic. I’ll flag missteps, cluster related issues, and defend the ranking with explicit trade-offs. **Spoiler: #2 (Undermining) is indeed your best bet, but not just because it’s familiar—it’s the lynchpin.**

  ---

  ### **Ranking & Defense**  
  *(Criteria: Tractability w/o physics | Potential for live disagreement | Centrality to other issues | Avoids saturated debates | Changes research trajectories)*  

  1. **#2: Undermining Futures (The "Big Bad Bug")**  
     - **Why #1**:  
       - **Disagreement Goldmine**: Humeans (split between "it’s fixed!" vs. "it’s fatal!") vs. non-Humeans (e.g., primitivists who think it sinks Humeanism). Hall’s New Principle (NP) *feels* like a fix, but its critics (e.g., Briggs, Schwarz) argue it’s ad hoc or still circular. A workshop could force defenders to wrestle with new counterexamples.  
       - **Centrality**: Directly impacts #1 (Admissibility—NP redefines it), #3 (New Bug—a consequence of NP), and #6 (Deterministic Chance—undermining doesn’t care about determinism). Resolving this could kill or resurrect half the field.  
       - **Tractability**: Pure formal epistemology. Your RA can model undermining scenarios (e.g., coin-flip worlds with chance-theories that undermine themselves) and test NP’s coherence.  
       - **Unsaturated**: The "Is NP *really* a solution?" debate is simmering but not exhausted. Recent work (e.g., [Author redacted]’s paradoxes for NP) has reopened wounds.  
     - **Your Bias is Right**: This isn’t familiarity—it’s the fault line in Humean chance. If undermining is fatal, best-system accounts collapse. If not, they live. *That’s* workshop-worthy.

  2. **#4: Deriving the Principal Principle (PP)**  
     - **Why #2**:  
       - **High Stakes**: If PP can be derived from accuracy/decision theory (e.g., Pettigrew-style), it becomes a theorem, not a norm—neutering #1 (Admissibility debates) and pressuring #2 (if PP isn’t primitive, why fret over Humean bugs?).  
       - **Disagreement**: Accuracy-theorists vs. those who think PP is irreducible (e.g., Lewisians). Real chance of minds changing if new derivations emerge.  
       - **RA Potential**: Perfect for formal work—exploring derivations in non-classical logics or with imprecise credences (#5).  
     - **Caveat**: Less directly explosive than #2. If a derivation succeeds, it’s a victory lap; if not, it’s status quo.  

  3. **#6: Deterministic Chance**  
     - **Why #3**:  
       - **Fresh Conflict**: Non-Humeans (e.g., propensity theorists) say deterministic chance is oxymoronic; Humeans (e.g., Loewer, Schaffer) argue it’s unproblematic (e.g., "macro-chances"). Sharp disagreement with physical stakes (e.g., statistical mechanics).  
       - **Tractable**: Needs no quantum mechanics—debate is metaphysical. Your RA could formalize "fragile" vs. "robust" chance setups.  
       - **Cluster Alert**: Subsumes part of #2 (if undermining works in deterministic worlds, Humeanism is in trouble).  

  4. **#5: Imprecise Chance**  
     - **Why #4**:  
       - **Toolkit Fit**: Your imprecise-probability strength is ideal. Disagreement exists between "imprecise chance realists" (e.g., Bradley) vs. "sharpness defenders" (e.g., Williamson).  
       - **Limitation**: Feels like a satellite issue. Depends on #4 (can you derive *imprecise* PP?) and #6 (does determinism force imprecision?).  
       - **RA Sweet Spot**: Great for technical work (e.g., generalizing deference rules).  

  5. **#1: Admissibility**  
     - **Why #5**:  
       - **Dialectic Misstep**: You’re right—it’s circular. The "analytic vs. substantive" framing is stale. NP (#2) *replaces* admissibility with "fit," so this is dying.  
       - **Low Yield**: Workshops on this devolve into "Here’s why my triviality proof beats yours." Not mind-changing.  

  6. **#3: The "New Bug" (NP’s self-undermining)**  
     - **Why #6**:  
       - **Misdiagnosed**: This isn’t a new bug—it’s NP working *as intended*. NP doesn’t let chances reason about *themselves* because it’s designed to avoid undermining. The "bug" is a feature Humeans accept (or handwave via reflection principles). Dead end.  

  7. **#7: Everett & Branch Weights**  
     - **Why Last**: As you suspect, this is poison for your constraints. Requires interpreting quantum mechanics—workshop death for non-physicists.  

  ---

  ### **The Single Workshop Theme: "Undermining Futures: The Final Boss of Humean Chance?"**  
  - **Focus**: Does the Big Bad Bug kill Humeanism? Is Hall’s New Principle a cure or a placebo?  
  - **Side Sessions**:  
    - Deriving PP (#4) as a potential "Humean exit ramp."  
    - Deterministic chance (#6) as a stress test.  
  - **Cut**: #1 (Admissibility), #3 (New Bug), #7 (Everett).  

  ---

  ### **Where Your Dialectic Goes Astray**  
  - **#3 (New Bug)**: As above—this isn’t a bug. NP deliberately restricts PP to *non-self-referential* chance claims. The real issue is whether this limitation is tolerable (#2).  
  - **#1 (Admissibility)**: You’re too generous. Post-NP, admissibility is defunct. The live question is whether NP’s "fit" is any better.  
  - **#6 (Deterministic Chance)**: Not just "what PP says" but whether Humeans can explain why deterministic chances *should_ guide credence (linking to #2).  

  ---

  ### **What Could Change the Ranking (18-Month Shifts)**  
  - **#4 (Deriving PP) Jumps to #1** if someone finds a derivation that bypasses Humean problems (e.g., showing PP holds *without* admissibility/NP).  
  - **#2 (Undermining) Collapses** if a consensus emerges that NP fully dissolves the bug (unlikely—Humeans are still sweating).  
  - **#5 (Imprecise Chance) Surges** if new results show deference *requires_ imprecision in key cases (e.g., climate modeling).  

  ---

  ### **The Bottom Line**  
  **Pick #2.** It’s the heart of the chance-credence nexus for Humeans, splits the room into warring factions, and your RA can attack it with formal tools. Demote #4 and #6 to side themes—they’re strong but lack the same explosive potential. Ditch the rest. Your instinct is correct: undermining isn’t just technical tidying; it’s where Humeanism lives or dies. Now go make those Humeans sweat.
