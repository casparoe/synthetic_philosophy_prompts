prompt: |-
  I am assembling a problem set for a graduate seminar on the foundations of decision theory, and one of my own constructions has turned against me. The argument below was meant only to dramatize how little room expected-utility theory leaves for strategic ignorance. It now appears to show that refusing to know is never rational, which I cannot accept. I would like to know precisely where it fails.

  The argument begins from the result usually known as Good's theorem, after I. J. Good.

  (1) Suppose an agent faces a fixed decision problem: a set of acts, a partition of states, a utility function assigning a value to each act–state pair, and a prior credence function over the states. Suppose further that some observation, obtainable at no cost, would reveal which cell of a partition of possible observations obtains; that which cell obtains makes no difference to the value of performing any act in any state; and that on learning a cell the agent will conditionalize on it and then choose an act maximizing expected utility relative to her resulting credences. Then the expected utility of the policy of observing first and choosing optimally afterwards — an expectation computed with the agent's own prior — is at least as great as the expected utility of the best act she can choose now, without observing. The inequality is strict unless the act she would choose is the same in every cell of the partition.

  (2) So, in any decision problem meeting those conditions, arranging to receive costless evidence cannot be expected to lower the agent's utility, and it raises her expected utility whenever the evidence would alter her choice.

  (3) Rationality requires choosing so as to maximize expected utility. By (2), observing is never worse than declining to observe, and is strictly better whenever the observation would have made a difference to what the agent does.

  (4) Hence declining costless evidence is never strictly rational. If the evidence would not have changed the agent's act, observing and declining are exactly tied; if it would have, observing is strictly better. There is no third possibility.

  (5) Hence any apparently rational refusal to know must dissolve in one of three ways: the evidence was not really costless; or the agent is mistaken about what she would do with it; or she has a preference for ignorance that is itself irrational.

  (6) Yet each of the following looks like a rational refusal that dissolves in none of those ways.

  (a) A member of a hiring panel requests the applications with names and institutions redacted. Redaction costs nothing, and she holds no false belief about herself: she knows that reading an applicant's pedigree moves her rating in a direction she has already judged irrelevant, and she expects that once she has seen the name she will go on weighting it, whatever she says afterwards. Blinding is the only means available to her of arriving at the evaluation she has most reason to want.

  (b) A woman is offered a test that is free, reliable, and conclusive for a late-onset condition that is untreatable, unpreventable, and non-hereditary; nothing she could do with the result would change any outcome for her or for anyone else. She declines it. By (1) this is exactly the tied case, since no act's consequences differ across the cells — and yet she is plainly strictly better off declining, with twenty further years of ordinary expectation rather than twenty years of waiting.

  (c) A candidate for a post can learn the employer's salary band at no cost, but only by asking the recruiter, and the offer eventually made to him depends in part on whether he asked. The evidence is free; the situation he would occupy after receiving it is not the situation he occupies now.

  (d) A physician with a full clinical load walks home past a street where an elderly man has fallen, out of sight of anyone, and cannot get up. If she learns of him she will not be able to leave him there for the hour it takes an ambulance to arrive; if she does not learn of him, a neighbour will find him within minutes. Nothing distorts her reasoning, and the knowledge itself costs her nothing; what costs her is what the knowledge obliges her to do.

  (7) Therefore Good's theorem is false, or expected-utility theory cannot after all accommodate the rationality of refusing to know.

  I want to resist (7) while keeping (1), which looks to me like sound mathematics about the maximum of an average and the average of the maxima, and while also keeping my judgment that the agents in (a) and (b) behave rationally. So:

  1. Which of (2) through (6) do you reject, and does the failure take the form of a suppressed premise or of a scope shift between steps? Explain why the step you reject looked innocent — several of them read as nothing more than restatements of (1).

  2. Three replies are open to the defender of the theorem: that the agents in (6) do not satisfy its antecedent, because their future selves will not in fact maximize on the evidence they receive; that they do not satisfy it, because their utility functions take the observation itself as an argument; and that in cases like (c) there is no single fixed decision problem for the theorem to range over. Assess each, and tell me what is left of the theorem once they are granted — whether it retains any application to a decision an actual agent might face. My worry is that the hypotheses have been made to do all the work, leaving the result as a truth about the empty set.

  3. Is the trichotomy in (5) exhaustive? If it is not, identify the omitted category and say whether a framework on which utility is a function of acts and states can admit that category without ceasing to be such a framework.

  4. Do (a), (b), and (d) come apart, or is one of them reducible to another? I suspect (d) is doing something different from both, and I cannot say what.

  5. Finally, price the repair you recommend. If utility may depend on what an agent believes, does every preference over one's own beliefs license declining evidence — and what then becomes of the distinction between a rational and an irrational refusal to know?
reasoning: |-
  Okay, let me try to unpack this user's problem. They're constructing a problem set for a graduate seminar on decision theory and ended up with an argument that seems to show refusing knowledge is never rational. But they have counterexamples where refusal seems rational. The core tension is between Good's theorem (which says free information can't hurt) and intuitive cases where avoiding knowledge appears wise.

  First, I need to understand each step of their argument. Good's theorem (1) seems mathematically solid: averaging maximum utilities can't be worse than maximizing without information. The user accepts this. The issue starts at (2) where they interpret the theorem as saying evidence can't lower expected utility. Then (3) applies rationality as EU-maximization, leading to (4) that declining evidence is never strictly rational. (5) gives three ways to explain refusal, but (6) presents four cases where refusal seems rational outside those explanations.

  Hmm... the user wants to preserve both Good's theorem and the rationality of their examples. So where's the flaw? Let me examine their cases:

  Case (a) is about blinding in hiring to avoid bias. The problem is that after seeing info, the agent won't actually maximize EU as required by Good's theorem - because biases will distort their choice. So the theorem's antecedent ("will choose optimally after learning") fails.

  Case (b) is the genetic test scenario. Here the user says no acts differ across states - but actually the state of mind (worrying vs not) differs. If utility includes psychological states, then learning does change outcomes. The theorem assumes utility depends only on act-state pairs, not beliefs.

  Case (c) involves signaling - asking about salary changes the future decision problem. Good's theorem requires a fixed set of acts, but here the act of asking alters available options. So no fixed decision problem.

  Case (d) is about moral obligation - knowing creates a duty to act. Similar to (b), utility may include psychological burden of knowledge, and also the act space changes (now "walk past" becomes impossible after knowing).

  Ah! So the common thread is that Good's theorem has strict assumptions: fixed acts/states, utility independent of beliefs, future EU-maximization. All counterexamples violate at least one.

  For the trichotomy in (5), it misses that utility might depend on beliefs themselves (not just acts/states). That's the fourth category: evidence changes the utility landscape directly.

  The repair costs: if utility includes doxastic states, we need to define states more carefully to include epistemic conditions. But this doesn't make decision theory empty - it just requires specifying when utility has belief-dependent components.

  The user worries this makes the theorem vacuously applicable. Not really - in purely outcome-based scenarios (like financial decisions with no psychological factors), it still holds. The counterexamples reveal boundary cases where human values extend beyond material outcomes.
answer: |-
  Your argument is a profound exploration of decision theory's limits, and your counterexamples are illuminating. The flaw lies not in Good's theorem itself (which is mathematically sound) but in its application to cases where the *structure or content* of the decision problem shifts upon acquiring evidence. I'll address your queries systematically.

  ### 1. **Which Step Fails?**  
     - **Step (2) is incorrect** as a universal claim, though it appears to restate (1).  
     - **Why it fails**: Step (2) assumes Good's theorem applies to all decision problems satisfying the stated conditions. However, your cases in (6) violate implicit premises of the theorem:  
       - **Suppressed premise**: Good's theorem requires that the *decision problem remains fixed* (same acts, states, utilities) before and after observation, and that utility depends *only* on act-state pairs (not on beliefs or the act of learning itself).  
     - **Why it looked innocent**: Step (2) seems like a direct corollary of (1), but it overlooks that the theorem's "fixed decision problem" condition is stricter than it appears. When evidence alters the agent's preferences, obligations, or available acts, the problem is no longer "fixed."  

  ### 2. **Assessing the Three Replies**  
     - **(a) Future selves won't maximize EU**:  
       - *Applies to (6a) and (6d)*. In (6a), the hiring panelist knows her future self will *misapply* weights due to bias; in (6d), the physician's knowledge creates an obligation that forces a suboptimal act (delaying her schedule). Good's theorem assumes post-observation EU-maximization, which fails here.  
       - **Verdict**: Valid for these cases; the theorem's antecedent is unmet.  

     - **(b) Utility depends on the observation**:  
       - *Applies to (6b)*. The woman's utility includes her *doxastic state* (anxiety during 20 years of waiting). Learning the result changes her experiential state, even if acts are identical. Good's theorem assumes utility is *state-dependent but belief-independent*.  
       - **Verdict**: Valid; the utility function in (1) excludes belief-dependent utilities.  

     - **(c) No fixed decision problem**:  
       - *Applies to (6c)*. Asking for the salary band alters the employer's offer, changing the acts available. Good's theorem assumes a fixed set of acts across all observational outcomes.  
       - **Verdict**: Valid; the theorem requires a stable act space.  

     - **What remains of the theorem?**  
       Good's theorem retains force in "pure" decision problems where:  
       - Acts, states, and utilities are fixed and belief-independent.  
       - Post-observation EU-maximization is guaranteed.  
       Examples: Clinical trials with blinded evaluators (bias-controlled), or financial decisions with no psychological spillover. It applies when agents are "belief-rational" and utilities are "outcome-centric."  

  ### 3. **Is the Trichotomy in (5) Exhaustive?**  
     - **No**. It omits:  
       - **Utility depends on beliefs or ignorance per se**.  
     - **Framework compatibility**:  
       - Expected utility (EU) theory *can* accommodate this by expanding the *state space* to include doxastic states (e.g., states now include "ignorant" or "informed"). However, this requires utilities to be functions of *acts, world-states, and belief-states*, violating Good's original setup.  
       - Example: In (6b), define states as \(s_1\): "has condition" and \(s_2\): "no condition," *and* belief-states \(b_1\): "knows \(s_i\)" and \(b_2\): "ignorant." Utility then depends on \((s_i, b_j)\).  

  ### 4. **Do (a), (b), and (d) Reduce to One Another?**  
     - **(a) and (d) are similar**: Both involve evidence triggering *compromised EU-maximization*. In (a), future choices are biased; in (d), knowledge forces a non-optimal act due to moral constraints. Both violate Good's "future maximization" premise.  
     - **(b) is distinct**: Here, utility intrinsically includes the *cost of knowing* (anxiety). No choice distortion occurs; the agent maximizes EU pre- and post-observation, but utility decreases upon learning.  
     - **(c) is orthogonal**: The decision problem itself shifts due to signaling.  

  ### 5. **Pricing the Repair**  
     - **The repair**: Expand EU theory to allow utilities over acts, states, *and doxastic states*.  
     - **Does this license all preference-based refusals?**  
       - **No**. Rationality requires that doxastic preferences align with coherent values. For example:  
         - *Rational*: Avoiding knowledge to prevent anxiety (6b) or bias (6a), as these reflect consistent goals (well-being, fairness).  
         - *Irrational*: Refusing free evidence due to ad hoc beliefs (e.g., "knowing my salary will anger the gods").  
       - **Test**: Would the agent accept a "doxastic pill" inducing ignorance *without* evidence? If yes, the preference is instrumentally rational; if no, it may be inconsistent.  
     - **Cost to decision theory**:  
       - **Advantage**: Captures real-world cases (e.g., health decisions, moral dilemmas).  
       - **Limitation**: Invites regress (e.g., "meta-ignorance" preferences). The theory remains testable by requiring preferences to be:  
         (i) Stable across reflection,  
         (ii) Non-manipulable (e.g., no "preferring ignorance to avoid inconvenient truths").  

  ### Conclusion  
  Your cases reveal that Good's theorem holds only in **belief-independent, act-stable decision problems**. The rational refusals in (6) succeed because:  
  - (6a) and (6d) violate *future EU-maximization*.  
  - (6b) violates *belief-independent utility*.  
  - (6c) violates *fixed decision problem*.  

  The trichotomy in (5) omits **belief-dependent utilities**, which EU theory can absorb by enriching its state space. This preserves Good's theorem for a meaningful class of problems (e.g., objective risk analysis) while accommodating human-centric cases where knowledge itself carries valence. The cost is a nuanced rationality criterion: preferences over beliefs must cohere with an agent's core values, not merely serve as ad hoc excuses.  

  This repairs your argument without rejecting (1) or expected utility theory. Step (2) is the misstep, as it overgeneralizes Good's theorem beyond its domain. Your instinct about (d) is correct—it hinges on *obligation distorting choice*, unlike (b)’s direct utility of ignorance.
