answer: |-
  Here is a prospectus drafted as requested, aiming for the rigorous development and concrete engagement your committee demands, while acknowledging risks plainly.

  ***

  The enduring philosophical and clinical impasse surrounding the authority of advance directives in cases of profound psychological change – exemplified by the woman who, after caring for her demented mother, forbade artificial nutrition and hydration for herself in advanced dementia, yet now, demented but responsive to food, seems to derive simple pleasure from eating – demands not another recapitulation of the familiar triad of arguments (critical interests, current interests, personal identity). These positions, while insightful, ultimately argue past each other because they treat "authority" as a monolithic property possessed or not by the directive itself, rather than disentangling the distinct normative powers potentially distributed by such instruments. My dissertation will argue that recasting advance directives through the conceptual framework of fiduciary law, specifically the revocable trust, offers a more productive and normatively coherent path forward. This model clarifies the persistent sense that the directive is simultaneously binding and inapplicable, precisely locates the revocability puzzle, renders metaphysical debates about personal identity largely irrelevant to the core normative questions, and provides concrete guidance for proxies and clinicians navigating the heartbreaking dilemma faced by the daughter in our central case.

  Before committing to this fiduciary reframing, it is crucial to consider rival formulations. One obvious alternative is a deeper dive into the personal identity debate itself, seeking a definitive metaphysical resolution to ground the authority question. This path, however, risks foundering on the metaphysician’s skepticism: the very intractability of the identity problem in these contexts, coupled with the lack of consensus even among specialists, suggests it may be the wrong tool for this particular job, likely yielding philosophical sophistication but little practical traction for the bioethicist’s "bedside" concern. Another tempting route is a purely doctrinal analysis, meticulously cataloging how courts and statutes *actually* handle such disputes. While empirically valuable, this approach risks satisfying neither committee member: the metaphysician might dismiss it as merely descriptive sociology of legal practice, lacking philosophical depth, while the bioethicist might find its conclusions jurisdictionally bound and insufficiently normative for guiding ethical deliberation in diverse clinical contexts. I set these aside because the identity path promises clarity it likely cannot deliver at the normative level needed for action guidance, and the doctrinal path, while informative, risks avoiding the underlying philosophical justification for *why* the law might (or might not) get it right. The fiduciary model, conversely, offers a conceptual structure derived from practice but amenable to rigorous normative analysis, capable of addressing *both* the "why" of authority (satisfying the philosopher) and the "how" of decision-making (satisfying the clinician).

  Therefore, my precise research question is: **How does reconceiving the normative structure of an advance directive through the analogy of a revocable trust resolve the apparent paradox of its simultaneous persistence and potential inapplicability in cases of profound psychological change, and what specific guidance does this model offer for determining the scope of a proxy’s authority when the patient’s present experiential interests seem to conflict with their prior directives?** This question is tractable because it focuses on the *structure of relations and powers* implied by the directive, not on resolving the intractable identity question or merely describing legal outcomes. It has a determinate answer in the form of a clarified conceptual framework and its practical implications. Existing positions leave this question open precisely because they conflate the distinct powers I aim to separate. The critical interests view implicitly bundles the power to define the good (settling values) with the power to command future action. The current interests view implicitly denies the persistence of the former power while focusing solely on the latter, applied only to present experience. The identity skeptics highlight the conflation but often stop at critique, offering less by way of a positive, action-guiding alternative structure. None adequately explain why the directive feels binding *in some sense* even when its specific application seems questionable, nor do they provide a clear account of *why* and *how* the proxy’s role shifts from mere executor to active interpreter.

  The method proceeds through four interlocking stages over approximately eighteen months. First, I will construct the fiduciary model rigorously. This involves detailing the core features of a revocable trust: the settlor's capacity-dependent power to define the trust's purpose and terms (the "good" for the beneficiary), the trustee's fiduciary duty to administer the trust according to those terms while exercising prudent judgment in unforeseen circumstances, the beneficiary's incapacity triggering the successor trustee's role and suspending the beneficiary's power to revoke or consent, and the distinction between the beneficiary's *welfare* interests (served by the trustee) and their *current wishes* (which may be non-authoritative due to incapacity). Crucially, this stage will involve defending the model against the charge of being merely a redescription of the interest-based view. The key difference lies in the *source* and *structure* of the obligation: it is not simply that the prior self's "interests" bind the proxy; it's that the prior self, acting as settlor, established a fiduciary *office* (the proxy as trustee) with duties *defined by* the instrument, duties that inherently require interpretation and application to new contexts, but always tethered to the settlor's framework for what constitutes the beneficiary's good. The duty runs to the *beneficiary*, but the *conception* of that beneficiary's good is specified by the settlor.

  Second, I will apply this model directly to the central case and its variations. Here, the woman at 55 is the settlor, defining what constitutes a "good" for her future self (avoiding prolonged existence in severe dementia via artificial sustenance). She names her daughter as successor trustee (proxy), to act when she, as beneficiary, lacks capacity. Upon her moderate dementia, the successor trustee's duty is to administer the "trust" – her care – according to the settlor's defined conception of her good. However, this duty requires judgment: does the directive against artificial nutrition/hydration apply *now*? The patient is demented but not yet in the "advanced" stage described; she enjoys eating. The trustee's role is not blind execution but interpretation *within the bounds* of the settlor's framework. The directive retains its authority over *what counts as her good* (avoiding the indignity and suffering the settlor associated with artificial sustenance in profound decline), but the trustee must determine *if the triggering condition* (advanced dementia) is met *and* what specific actions best serve that defined good *in the present unforeseen circumstance* (moderate dementia where oral feeding is pleasurable). The power to *define the good* persists with the settlor's directive; the power to *direct present action* lies with the trustee's application of that framework; the standing to *complain or revoke* is lost with the beneficiary's incapacity. This explains the daughter's anguish: she feels the weight of the settlor's defined good ("she would never have meant this *for herself*") but recognizes the present beneficiary's apparent enjoyment. The hospital ethics committee's appeal to the directive's "clarity" focuses only on the persistence of the first power (definition of the good), neglecting the trustee's necessary role in interpreting its application. The model makes identity debates secondary: the trust structure operates regardless of strict identity continuity, binding the trustee to the settlor's terms for the beneficiary, who is legally and ethically the same person, even if psychologically transformed.

  Third, I will derive concrete guidance for proxies and clinicians. The trustee analogy emphasizes that the proxy is not a mouthpiece for a past command, nor a surrogate solely for present feelings, but a fiduciary obligated to implement the settlor's vision of the beneficiary's good. This involves: (1) Rigorously interpreting the directive's terms and intended scope (e.g., what did "advanced dementia" mean to the settlor? Is the current state that?); (2) Assessing whether current circumstances fall within the directive's specified conditions or present genuinely unforeseen complexities (e.g., pleasure in eating oral food when the directive concerned artificial sustenance in inability to eat); (3) Exercising prudent judgment *within the bounds* of the settlor's defined good when applying the directive to unforeseen contexts; (4) Understanding that revocation is impossible *by the beneficiary* due to incapacity, but the trustee must always act loyally to the beneficiary's interests *as defined by the settlor*. This moves beyond the paralyzing "follow directive vs. follow current interests" binary.

  Fourth, I will rigorously engage the strongest objections. Key challenges include: Can a person truly be both settlor and beneficiary without metaphysical confusion? (I argue the legal fiction works normatively regardless). Does this simply reinstate the prior self's tyranny, risking neglect of the vulnerable present self? (I argue the trustee's duty runs to the *present beneficiary's welfare* as defined by the settlor, demanding vigilant protection against suffering, even if not consent). Does it place an unrealistic burden of interpretation on proxies? (I argue it clarifies their role but acknowledge this burden, suggesting tools based on the settlor's known values and discussions). Is the trust analogy merely decorative? (I contend it does essential work by structuring distinct normative powers and duties that other models conflate).

  A successful dissertation will demonstrate that the fiduciary model resolves the core paradox by showing *how* the directive retains authority over the definition of the good while requiring contextual judgment for its application, thereby explaining the intuitions driving all three traditional positions without their deadlocks. It will provide a philosophically robust yet clinically actionable framework, evidenced by showing precisely how it guides analysis of the central case and similar scenarios, making the identity question largely irrelevant to the normative mechanics of decision-making. Success means offering a tool that both the metaphysician can recognize as conceptually clear and the bioethicist can see making a tangible difference at the bedside by reframing the proxy's task and the directive's role. Failure would manifest in several ways: if the trust analogy proves merely metaphorical without generating distinct normative conclusions compared to the interest-based view; if the model fails to generate concrete guidance for proxies beyond restating the problem; if it cannot persuasively deflect the charge of being overly doctrinal or irrelevant to identity concerns without simply ignoring them; or if the analysis becomes so entangled in trust law minutiae that it loses philosophical traction.

  The primary risk is indeed that the work becomes too doctrinal for the philosophy committee or too abstract for the clinical bioethicist. The metaphysician might see the invocation of trust law as a retreat into legal positivism, avoiding deeper normative foundations. The bioethicist might find the conceptual structure initially alien to clinical discourse or question its practical implementability compared to existing frameworks like substituted judgment or best interests, even as refined. To mitigate this, the focus must remain relentlessly on the *normative concepts* the trust structure illuminates (distributed powers, fiduciary duty, suspended standing) rather than on the technicalities of trust law itself. The model is a philosophical tool using a legal form for conceptual clarity, not an exercise in jurisprudence. If the balance tips too doctrinal, I will cut detailed discussions of specific trust law doctrines (e.g., rule against perpetuities, formal creation requirements) that are not essential to the core argument about powers and duties, and amplify the analysis of how this conceptual structure addresses the *philosophical* puzzles and *ethical* dilemmas directly. Conversely, if it feels too abstract clinically, I will deepen the case study analysis, perhaps developing hypothetical but realistic clinical vignettes demonstrating step-by-step application of the fiduciary reasoning under the model, explicitly contrasting it with current standard approaches and highlighting concrete differences in outcome or justification. The core insight – the separation of the power to define the good, the power to direct action, and the standing to complain – must be the anchor, demonstrated to do work the existing frameworks cannot.

  Your core insight – that the dispute conflates distinct powers and that the trust model clarifies their distribution – is fundamentally sound and fertile. However, the claim that the third power (standing to complain) "may belong to nobody" needs refinement. In law, standing might lapse *for the incompetent beneficiary*, but it potentially resides with others (e.g., the successor trustee acting on the beneficiary's behalf, or potentially state oversight mechanisms to prevent trustee malfeasance). Ethically, the lack of a competent voice demanding redress *is* part of the tragedy, but the trustee's duty persists regardless. Framing this as a *suspension* of the beneficiary's *personal* standing to complain or revoke, while the trustee retains a duty-bound standing to protect the beneficiary's interests *as defined*, is more precise and avoids suggesting a normative vacuum. This strengthens, rather than undermines, your central argument about distributed powers. This prospectus commits to developing that argument into a dissertation that aims not just to contribute to the academic debate, but to offer a tangible conceptual lens through which the daughter, the ethics committee, and the philosophical disputants might finally see a path out of the morass.
