prompt: |-
  I teach a 300-level cross-listed course, half political philosophy half philosophy of social science, called something like Norms, Coercion and Cultural Variation, and I'm sitting in the library basement writing the final with about three hours of quiet left before I have to go collect my kid. The one unit the students actually got worked up about was the tightness/looseness material — the cross-national survey work that ranks societies by how strong their social norms are and how little deviance they tolerate, and the broad pattern that tight places show up with more order, more conformity, less crime and less tolerance, while loose places show up with more creativity and innovation and more mess. Trouble is half the class has decided this settles the normative question. They think the tradeoff curve is basically an answer to "how much rule-following should a society demand," and they keep handing in papers that pick a point on the curve and call it a theory of justice. I want an essay question that takes that move away from them without being unfair about it — they've read the empirical stuff, they just haven't thought about what it could possibly license.

  So here's what I need. Write one exam essay question on this material that can't be answered by restating the findings or by announcing that you're a moderate. I want it to push on two things. First, whether a between-society correlation supports any prescription for a particular society at all: I want them to have to deal with the fact that tightness shows up downstream of threat, resource scarcity and population pressure, so recommending tightness to a society that isn't under threat is doing something strange with the explanation — you'd be importing the response while leaving out the cause. And the fact that some of the outcome measures look partly definitional rather than independent of the index, since tolerance of deviance is close to how looseness is scored in the first place, and "innovation" gets measured in ways loose societies would recognise and tight ones wouldn't. Second — and this is the part I want the question to actually turn on — give them a concrete case to decide. A loose society has to rule on whether to let a tight sub-community inside its borders enforce norms on its own adult members that the wider society prohibits outright: heavy social and material sanctions on leaving the faith, on cohabiting, on the way members dress in public. Whether tolerating deviance commits you to tolerating communities that don't. I want the question built so that the answer visibly comes out differently depending on whether the value of looseness is taken to be instrumental to autonomy, constitutive of it, or just a matter of genuine exit and informed consent — and so that students have to notice the reflexive wrinkle, that the enclave's tightness may itself depend on being able to punish defectors, which the wider society either permits or forbids, and can't do neither.

  Deliverables, then. The question as it would actually appear on the paper, with a time limit and a mark total — call it 45 minutes, 25 marks. A model answer of about 700 words. And a marking scheme that spreads the 25 marks over five or six named moves and says explicitly what seperates a first from a solid B: I want the B described as an answer that does everything competently but treats the two halves as two seperate mini-essays, or that resolves the enclave case with an unargued appeal to harm without saying whose harm counts or why the enclave's own account of the good gets no weight. Also list three or four specific mistakes that should cost marks — assuming that because tightness correlates with order it causes order, thinking that internal tightness is automatically a violation of members' autonomy regardless of what they agreed to, or sliding from "these societies differ" to "we should be more like them." No bibliography, no citations and no reading list, I'll circulate the sources myself and the students will have had them in class. Keep the prose of the question itself plain enough that a tired third-year can parse it on the first read.
reasoning: |-
  Okay, let's tackle this professor's problem. They teach a 300-level course blending political philosophy and philosophy of social science, focused on norms and cultural variation. The students are overly impressed by the tightness/looseness research, treating its correlation curve as a normative answer to justice. The professor wants an exam question that forces deeper engagement.

  First, unpacking the core issues: students are mistaking descriptive patterns for prescriptive solutions. The tightness/looseness findings show correlations – like how threat and scarcity predict tight societies – but don't dictate what societies *should* do. There are methodological wrinkles too: some outcome measures (like "innovation") might be culturally biased toward loose societies' values. 

  The professor's key requirements are clear: 
  - Block simple restatements of findings or "moderate" positioning
  - Force confrontation with two problems: (1) the ecological fallacy risk (prescribing for individuals/societies based on group-level data) and the threat/scarcity precondition issue, (2) the measurement circularity (tolerance of deviance being both cause and effect in the index)
  - Center on a concrete case: whether a loose society should permit a tight sub-community to enforce restrictive norms internally
  - Make the answer pivot on different interpretations of looseness's value (instrumental vs. constitutive autonomy vs. exit/consent)
  - Highlight the reflexive dilemma: the enclave's tightness depends on coercive power the wider society must either allow or deny

  For the deliverables:
  - A 45-minute, 25-mark question
  - 700-word model answer
  - Marking scheme distinguishing A/B work
  - List of common mistakes to penalize

  Designing the question first. Need plain language but layered complexity. The case study must force engagement with both critique aspects (correlation limits & measurement issues) while demanding normative reasoning about the enclave. The reflexive point about enforcement dependency is crucial – it prevents easy "live and let live" answers.

  For the model answer, it should demonstrate:
  - Immediately flagging the descriptive-prescriptive gap
  - Dissecting how threat/scarcity undermines direct prescription
  - Showing measurement circularity undermines neat tradeoffs
  - Applying autonomy/consent frameworks to the enclave case
  - Explicitly wrestling with the enforcement paradox
  - Avoiding all listed mistakes

  Marking scheme must reward:
  - Integrating critique and case study (not separate essays)
  - Specifying whose harm counts in the enclave debate
  - Grappling with the enclave's own normative claims
  - Acknowledging the reflexivity trap

  Common mistakes to dock:
  - Ecological fallacy (correlation as causation)
  - Ignoring consent/exit conditions
  - Prescriptive leap from variation
  - Overlooking measurement bias

  The wording needs to be fatigue-resistant for undergrads: short sentences, clear conflict, explicit tasks ("explain why," "assess whether"). Time pressure means no fluff – every phrase must serve the objective.
answer: |-
  Here is the complete exam package addressing your requirements:

  **Exam Question (as it would appear):**

  **SECTION B: ESSAY QUESTION (25 marks)**
  **Time allowed: 45 minutes**

  **Drawing on the course material concerning cultural tightness-looseness and its societal correlates:**

  1.  **Explain clearly** why the observed *correlation* between societal tightness (e.g., strong norms, low tolerance for deviance) and certain outcomes (e.g., order, conformity, innovation) *cannot*, by itself, definitively answer the normative question: "How much rule-following *should* a society demand?" In your explanation, address *both*:
      *   The role of antecedent conditions like threat or resource scarcity in shaping tightness.
      *   Potential issues concerning how key outcomes (like tolerance of deviance or innovation) are defined and measured in this research.

  2.  **Apply** this critical perspective to the following concrete case:
      > Libertas, a generally "loose" society valuing individual choice and tolerance, must decide whether to permit the "Harmony Enclave," a tight-knit community within its borders, to enforce its own strict norms on consenting adult members. These norms include severe social and material sanctions (exile, property confiscation) for actions like leaving the faith, cohabiting outside approved unions, or violating strict dress codes – actions permitted in wider Libertan society.
      >
      > *   **Assess** whether Libertas's commitment to tolerance and looseness *requires* it to tolerate the Harmony Enclave's internal practices. Your assessment *must explicitly consider* how the answer differs depending on whether Libertas values looseness primarily as:
          *   (a) An *instrument* for achieving individual autonomy.
          *   (b) Something *constitutive* of autonomy itself.
          *   (c) Primarily ensured by genuine exit options and informed consent.
      > *   **Analyze** the "reflexive wrinkle": The Harmony Enclave's ability to *maintain* its tightness fundamentally depends on its power to enforce sanctions. Can Libertas truly permit the Enclave to be "tight" if it simultaneously *denies* it the power to punish defectors? What does this imply for Libertas's decision?

  **Focus:** Your essay must move beyond merely describing tightness/looseness findings or stating a "moderate" position. Integrate your critique of the research (Part 1) with your normative analysis of the case (Part 2). The coherence of your argument across both parts is crucial.

  ---

  **Model Answer (Approx. 700 words):**

  The empirical research on cultural tightness-looseness reveals fascinating *correlations* between societal characteristics like norm strength and outcomes such as order or innovation. However, mistaking these correlations for a direct answer to the normative question of "how much rule-following a society *should* demand" constitutes a fundamental error. There are two primary reasons why the research cannot settle this prescriptive issue.

  Firstly, the observed tightness of societies is strongly *explained* by antecedent conditions like chronic threat (e.g., natural disasters, invasions), resource scarcity, or high population density. Tight norms emerge as functional adaptations *to these specific pressures*, promoting cohesion and survival. Prescribing tightness *without* the presence of such pressures is nonsensical; it would involve adopting the *response* (strict norms, low tolerance) while lacking the *cause* (the environmental pressure that made that response adaptive or necessary). Recommending tightness to a peaceful, resource-abundant society like Libertas is akin to prescribing winter clothing for a summer beach – it ignores the contextual rationale. The correlation doesn't tell us what level of rule-following is *desirable* in contexts lacking the original pressures that forged tightness elsewhere.

  Secondly, there are significant questions about the independence and definition of key outcome measures. "Tolerance of deviance" is practically synonymous with the definition of looseness itself; measuring it as an *outcome* of looseness risks circularity. Similarly, how "innovation" is measured often reflects values and recognition criteria dominant in looser societies (e.g., technological disruption, artistic avant-garde), potentially undervaluing forms of incremental improvement or tradition-preserving adaptation more common in tight societies. This measurement bias makes the apparent "trade-off" curve (order vs. innovation) less an objective map of possibilities and more a reflection of the researchers' embedded cultural frameworks. We cannot straightforwardly derive a prescriptive "optimal point" from such potentially entangled data.

  This critical perspective is vital for analyzing the Harmony Enclave case within Libertas. Libertas's looseness cannot simply mandate tolerance of the Enclave's internal practices without deeper normative justification. How Libertas conceptualizes the *value* of looseness determines the answer:

  *   **(a) Looseness as Instrumental for Autonomy:** If looseness is merely a tool to *enable* individual autonomy (the capacity for self-governance), then tolerating the Enclave *might* be justified *if* its members freely chose this life and have genuine exit options. The Enclave's internal rules could be seen as an expression of collective autonomy, provided individuals consented. Tolerance here serves the instrumental goal of enabling diverse forms of autonomous life.
  *   **(b) Looseness as Constitutive of Autonomy:** If the practices *of* looseness (questioning norms, exploring options) are *themselves* essential parts of what autonomy *is*, then the Enclave's practices actively *suppress* autonomy. Tolerating them becomes paradoxical for Libertas, as it allows a sub-community to destroy the very condition (ongoing looseness practices) that Libertas deems constitutive of the good life. Tolerance likely has limits here to protect the constitutive value.
  *   **(c) Looseness as Genuine Exit/Consent:** If the core value is ensuring individuals have meaningful, informed choice to enter and *leave* ways of life, then Libertas's focus shifts to exit conditions. Can Enclave members *truly* leave without catastrophic loss (exile, confiscation)? Was initial consent informed, or shaped by lifelong socialization? If exit is prohibitively costly or consent dubious, Libertas may be obliged to intervene to protect the possibility of genuine choice, even if it means restricting the Enclave's internal enforcement.

  The **reflexive wrinkle** is critical: The Enclave's *tightness depends entirely* on its ability to enforce its sanctions. Libertas cannot consistently say, "You can *be* tight, but you cannot *enforce* the norms that *make* you tight." Permitting the Enclave logically requires permitting its enforcement mechanisms *within its boundaries*, as they are inseparable from its existence as a "tight" community. Conversely, forbidding those enforcement mechanisms (e.g., outlawing exile/property confiscation for defectors) fundamentally undermines the Enclave's ability to maintain its tight character; it forces looseness upon it. Libertas faces a genuine dilemma: either tolerate the *full package* of Enclave practices (including enforcement), thereby potentially compromising its own foundational values depending on justification (b) or (c), or forbid the enforcement, effectively dissolving the Enclave's distinct tightness and imposing Libertan looseness. There is no neutral middle ground; the decision *is* the act of permitting or denying the power that constitutes tightness in this context.

  Therefore, the tightness/looseness research provides descriptive patterns, not prescriptions. Applying it normatively requires grappling with contextual origins and measurement biases. In the Libertas case, the permissibility of the Harmony Enclave hinges on Libertas's core justification for valuing looseness and the inescapable necessity of choosing whether to permit or deny the coercive power that defines the Enclave's tight existence.

  ---

  **Marking Scheme (25 Marks Total):**

  1.  **Critique of Prescriptive Leap from Correlation (5 marks):**
      *   Clearly identifies the ecological fallacy issue (prescribing for a society based on group correlations) (1 mark).
      *   Explains the role of antecedent conditions (threat/scarcity) in *shaping* tightness and why this undermines direct prescription (2 marks).
      *   Explains the measurement issues (circularity with tolerance of deviance, potential bias in innovation measurement) and their implications for the trade-off narrative (2 marks).
      *   *B-Grade Indicator:* Mentions antecedent conditions OR measurement issues, but not both robustly, or fails to connect them explicitly to the impossibility of direct prescription.

  2.  **Application to Libertas/Enclave Case - Normative Frameworks (7 marks):**
      *   Correctly distinguishes the three justifications for valuing looseness (instrumental autonomy, constitutive autonomy, exit/consent) (2 marks).
      *   Provides a coherent and distinct analysis for *each* framework regarding whether Libertas *must* tolerate the Enclave (3 marks).
      *   Clearly shows how the answer *differs* significantly based on the chosen framework (2 marks).
      *   *B-Grade Indicator:* Identifies the frameworks but gives superficial or insufficiently distinct analyses for each. May conflate frameworks or fail to show clear differences in the required tolerance.

  3.  **Analysis of the Reflexive Wrinkle (6 marks):**
      *   Identifies the core dilemma: Enclave tightness depends on enforcement power (1 mark).
      *   Clearly states that Libertas cannot consistently permit the Enclave *to be tight* while denying its *enforcement mechanisms* – they are inseparable (2 marks).
      *   Explains the consequences: Permitting enforcement = permitting tightness; Forbidding enforcement = dissolving tightness/forcing looseness. No neutral option (2 marks).
      *   Integrates this analysis into the overall assessment of Libertas's options (1 mark).
      *   *B-Grade Indicator:* Recognizes the enforcement issue but treats it as a separate, minor point. Fails to articulate the inseparability of tightness and enforcement power or the lack of a neutral option clearly. Doesn't effectively link it back to the core normative decision.

  4.  **Integration and Argument Coherence (5 marks):**
      *   The critique of the research (Part 1) is *used* to inform and strengthen the analysis of the case (Part 2), not presented as a separate mini-essay (2 marks).
      *   The analysis of the normative frameworks and the reflexive wrinkle are woven together into a unified argument about the Libertas decision (2 marks).
      *   Overall essay structure is logical and clear (1 mark).
      *   *Key A/B Distinction:* **A-grade essays** seamlessly integrate Parts 1 and 2, using the critique to ground the case analysis. The normative frameworks and reflexive wrinkle are interdependent parts of the central argument. **B-grade essays** often treat Part 1 and Part 2 as largely separate tasks ("First, the research has problems... Second, in the case..."). The reflexive wrinkle may be an afterthought. The answer feels like two competent mini-essays stapled together.
  5.  **Avoidance of Specified Mistakes (2 marks):**
      *   Award 2 marks for successfully avoiding all the major pitfalls listed below. Deduct proportionally for occurrences.

  **Specific Mistakes Costing Marks (Deduct from overall mark or category marks as appropriate):**

  1.  **Prescriptive Leap/Correlation as Causation:** Assuming that because tightness *correlates* with order, prescribing tightness *causes* more order, especially without addressing antecedent conditions. (-2 to -3 marks)
  2.  **Ignoring Consent/Exit:** Assuming the Enclave's practices *automatically* violate autonomy without any consideration of whether members consented or have genuine exit options. (-2 marks)
  3.  **"We Should Be Like Them" Slide:** Arguing that because some societies are tight/loose and have certain outcomes, Libertas *should* become more tight/loose, without the critical analysis from Part 1. (-2 marks)
  4.  **Unargued "Harm" Appeal:** Resolving the enclave case solely by asserting it causes "harm" without defining harm, specifying *whose* harm (members? wider society? potential members?), or explaining *why* the Enclave's own definition of harm/good doesn't count. (-2 to -3 marks - major B-grade indicator)
  5.  **Overlooking Measurement Issues:** Failing to acknowledge the potential circularity/bias in defining/measuring key outcomes like tolerance or innovation. (-1 to -2 marks)
  6.  **Ignoring Antecedent Conditions:** Discussing prescribing tightness/looseness without mentioning the role of threat/scarcity in shaping these societal types. (-1 to -2 marks)
  7.  **Neglecting the Reflexive Wrinkle:** Failing to address the core enforcement dilemma or treating it superficially. (-2 to -3 marks)

  **Separating First from Solid B:** A **first-class answer (A/A+)** will demonstrate all elements of the marking scheme at a high level, with particular strength in **Integration and Argument Coherence (Category 4)**. It will weave the critique of the research seamlessly into the normative analysis of the case. The discussion of the three frameworks will be sophisticated, showing clear, well-reasoned differences. The reflexive wrinkle will be central to the argument, not an add-on. It will avoid all major mistakes and grapple explicitly with the tension between respecting the Enclave's internal norms and Libertas's foundational values. A **solid B-grade answer** will likely cover most points competently but will exhibit the B-grade indicators: treating Part 1 and Part 2 as largely separate discussions, giving adequate but less distinct or deep analyses of the normative frameworks, mentioning the reflexive wrinkle but not making it pivotal, and potentially falling into the trap of an unargued "harm" appeal to resolve the enclave case without the necessary nuance about whose harm and why it overrides consent. It might state a "moderate" position without sufficient critical justification rooted in the tightness/looseness critique or the frameworks.
