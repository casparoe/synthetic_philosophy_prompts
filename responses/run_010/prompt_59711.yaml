prompt: |-
  So I've been going down a rabbit hole on how Wikipedia and Wikidata handle the question of when two names are names for the same thing, and it's starting to look to me like the whole operation has a buried theory of names and identity that nobody ever wrote down. Some things that are bugging me:

  - The rule for picking an article title is basically "use the name that most reliable English-language sources use". So where someone has a birth name and a later name, or where the same historical figure is known by two names in different languages or eras, which one gets to *be* the title is settled by counting usage. Nothing about the names themselves decides it.
  - Every other name for that same topic gets a redirect, so both work, both land you on the same page, and once the page's first line has announced the alternates, the prose then uses them interchangeably, as though nothing at all turns on which one you pick.
  - But Wikidata, the structured database underneath, will not merge two items when it isn't sure. There's a dedicated property for "said to be the same as" (P460) that you put on both items to record that they might be one real-world thing, and you just leave them both sitting there unmerged. And there's a companion property, "different from" (P1889), for when two items look like they ought to be one but aren't.

  What does all that presuppose about what a name contributes, and about identity claims? If a name contributes nothing but its bearer, then the interchangeable-usage practice is exactly right — but what on earth is "said to be the same as" doing? That looks like a category error to me: either they are the same thing or they aren't, and there's no such state as provisionally-same. Unless the practice is quietly assuming that you never get at the thing except through some particular way of picking it out, in which case two pickings-out really can fail to settle whether they land on one object or two, and you'd need a flag like that. Which is it?

  Please reconstruct the implicit theory as carefully as you can, and be strict about separating what the practice actually *requires* from what it merely happens to sit comfortably with. My suspicion is that the titling rule and the redirect/merger practice pull in different directions and I can't tell whether that's a genuine inconsistency or just me not seeing the move that reconciles them — so tell me either way. Also say where the practice is underdetermined, i.e. where more than one incompatible story about names would licence exactly the same editing behaviour, because that would explain why nobody notices.

  Then: what would have to change if you rebuilt the whole thing on the assumption that names are contentless tags? Imagine an entity-resolution system that merges any two records above a similarity threshold, irreversibly, with no way to record doubt and no separate layer of alternates. What specifically breaks, and what does the fact of it breaking tell you about what the current practice is committed to? And is there anything in the existing setup that would survive the rebuild untouched — because that bit is presumably the part that isn't really about names at all.

  British English please, and don't bother with citations, I just want the reasoning laid out.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're deep into how Wikipedia and Wikidata handle identity and names, noticing what seems like an implicit theory. The main points are: Wikipedia's titling based on reliable sources, redirects for alternate names, and Wikidata's cautious merging with properties like "said to be the same as" and "different from." The user is confused about whether these practices are consistent or if there's a hidden conflict.

  First, I need to reconstruct the implicit theory. The titling rule is pragmatic—use the most common name in sources. Redirects treat names as interchangeable, suggesting names are just pointers. But Wikidata's P460 implies that identity isn't always certain. That's where the tension lies. The user wonders if it's a category error or if there's a deeper epistemic issue.

  I should separate what the practices require. Wikipedia requires that names are references without inherent meaning, hence redirects. But Wikidata requires that identity claims are fallible, hence P460 for uncertain matches. The key is that Wikidata deals with real-world entities where evidence can be ambiguous, while Wikipedia handles naming conventions. 

  Underdetermination is a factor here. The practices don't specify whether names are tags or have content. Both a pure referentialist view and a descriptivist one could justify the behavior. For example, redirects work if names are tags, but P460 makes sense if names carry contextual info that might not align.

  Rebuilding under the "names as contentless tags" assumption: forcing merges based on similarity would break when sources conflict or evidence is incomplete. P460 handles those cases. The fact that this breaks shows the current system acknowledges epistemic limits. What survives? The redirect structure, which doesn't care about meaning, just reference.

  The user's deeper need might be understanding the philosophical underpinnings of these systems and whether the inconsistencies are resolvable or inherent. They might also be interested in how practical constraints shape knowledge systems. Highlighting the epistemic humility in Wikidata versus Wikipedia's pragmatism could address their suspicion of inconsistency.
answer: |-
  Right, let's reconstruct the implicit theory of names and identity underpinning Wikipedia/Wikidata's practices, separating strict requirements from comfortable fits, pinpointing tensions and underdetermination, and analysing the "contentless tags" rebuild.

  **The Implicit Theory: A Pragmatic Referentialism with Epistemic Humility**

  1.  **Core Ontological Commitment (What Exists):** There are real-world entities (people, places, concepts, events). These entities *have* identities – they are distinct from other entities. (This is presupposed by the *need* to merge or distinguish items).

  2.  **Core Semantic Commitment (What Names Do):** Names are primarily *referential devices*. Their core function is to *pick out* or *denote* a specific real-world entity. They are labels pointing to the thing. The name itself (the string of characters) is not the primary carrier of meaning *about* the entity; the entity *is* the meaning.

  3.  **Wikipedia's Practice & Its Requirements:**
      *   **Titling Rule ("Most Common Name"):** Requires that the *label* used to access the primary information node (the article) is determined by *conventional usage* in reliable sources. This presupposes that:
          *   The *link* between name and entity is established by *community practice* (embodied in sources), not by inherent properties of the name or a perfect grasp of the entity's essence.
          *   The *purpose* of the title is efficient, unambiguous access based on expected user behaviour. It's a *pragmatic choice* of signpost.
      *   **Redirects & Interchangeable Usage:** Requires that:
          *   Multiple names *can* successfully denote the *exact same entity*.
          *   Once the entity is fixed (by landing on the article), the *specific name used in the prose is semantically neutral* regarding the entity's identity or properties. "Samuel Clemens" and "Mark Twain" are equally valid ways to *refer* to the *person* once you're on his page. This strongly reinforces the "names as referential tags" view.
      *   **Implied View:** Names are interchangeable pointers to the same referent. Identity is settled (for the purpose of the encyclopaedia) by the merge.

  4.  **Wikidata's Practice & Its Requirements:**
      *   **Cautious Merging / P460 ("said to be the same as"):** Requires that:
          *   Establishing identity between two database items representing putative entities is an *epistemic* act, not a purely logical one. It requires *evidence*.
          *   Evidence can be *inconclusive*, *ambiguous*, or *contested*. Two database records might *point to what appears to be the same entity* based on available data, but there might be reasonable doubt (e.g., conflicting sources, common names, incomplete records).
          *   Therefore, identity claims ("these two items represent one real thing") are *fallible* and *provisional* based on current knowledge. P460 explicitly encodes this state of *uncertainty about referent identity*.
          *   The database must be able to *represent* this uncertainty without making a definitive, potentially erroneous, merge.
      *   **P1889 ("different from"):** Requires that:
          *   There are cases where evidence *definitively shows* that two items, despite superficial similarities or historical confusion, represent *distinct entities*.
          *   This distinction needs to be explicitly recorded to prevent erroneous merging *and* to clarify relationships for users/machines.
      *   **Implied View:** While names/labels are referential, *determining that two references point to the same real-world entity* is a matter of evidence and judgment, not pure logic or naming convention. The database layer acknowledges the gap between *reference via a label* and *secure knowledge of the entity's identity across different references*.

  **Reconciling the Tension (or Not):**

  *   **The "Move":** The apparent tension between Wikipedia's easy redirects/mergers and Wikidata's cautious P460 stems from *different scopes and purposes*, reconciled by an implicit distinction:
      *   **Wikipedia (Article Level):** Operates *after* identity has been resolved *for the purpose of creating a coherent narrative*. Once sources agree (enough) that "X and Y refer to the same thing", they *are* treated as the same thing within the article. The redirects assume this prior resolution. The focus is on presenting consolidated knowledge *about* the (assumed singular) entity.
      *   **Wikidata (Structured Data Level):** Operates at the *evidence-gathering and entity-resolution* layer *before* (or sometimes parallel to) that consolidation. It deals with the messy process of *establishing* identity from potentially conflicting, incomplete, or ambiguous data points sourced globally. P460 represents an *intermediate state* in this resolution process, where the evidence *suggests* but doesn't *conclusively prove* sameness.
  *   **Is it a Genuine Inconsistency?** Not inherently, *if* you accept the distinction between:
      1.  The *semantic function* of names (to refer, which *if successful* picks out an entity).
      2.  The *epistemic challenge* of *verifying* that two name-uses (or database records built around them) *successfully refer to the same entity*.
      Wikipedia's practice assumes (1) is settled for the names it uses. Wikidata's P460 deals with situations where (2) is problematic. The "category error" feeling arises if you conflate the *successful referential use* of a name (which implies a singular referent) with the *process of verifying* that two distinct referential acts *target that same singular referent*.

  **Underdetermination: Where Multiple Theories Fit**

  The practice *does not require* committing to one specific philosophical theory of reference. It's compatible with, but doesn't strictly demand, either:
  *   **Pure Millian Referentialism (Tags):** Names contribute nothing but their bearer; meaning is the bearer. (Fits redirects perfectly, makes P460 *slightly* awkward as it implies uncertainty about the bearer itself).
  *   **Descriptivist Leaning:** Names are associated with clusters of descriptions or contextual information that help fix the referent. (Fits P460 well - uncertainty is about whether the descriptions associated with the two items pick out one thing or two. Fits Wikipedia less perfectly - why are the names then interchangeable in prose if they carry different descriptive baggage?).
  *   **Causal-Historical Referentialism:** Reference is fixed by an initial act and passed causally through the community. (Fits Wikipedia's reliance on source usage, fits Wikidata's need for evidence tracing chains of reference).

  The practice *works* because it focuses on *operational outcomes* (functional redirects, accurate merging based on evidence) using source consensus as the arbiter, rather than philosophical purity. The underdetermination explains why the tension isn't always noticed – different editors can mentally slot the practice into their preferred framework without the system breaking.

  **The "Contentless Tags" Rebuild: What Breaks?**

  Imagine Wikidata and Wikipedia enforce immediate, irreversible merging of items above a similarity threshold. Names are *only* tags, no "said to be same" or "different from".

  *   **What Breaks Spectacularly:**
      *   **Handling Uncertainty/Disagreement:** Cases like historical figures with contested identities (e.g., "Was this 5th-century chronicler *actually* that bishop?"), common names leading to conflation (multiple "John Smiths"), or emerging scholarship challenging established merges become impossible to represent accurately. You *must* merge or not merge instantly, with no record of doubt or alternative interpretations. Errors become irreversible.
      *   **Representing Scholarly Discourse:** The nuance captured by P460 – "some sources say X, others say Y, it's debated" – vanishes. The database presents a false certainty.
      *   **Avoiding Conflation Errors:** P1889 prevents harmful merges. Without it, the system might forcibly merge distinct entities that *look* similar (e.g., two minor nobles with the same name in the same era, two villages in different counties with the same name) based solely on algorithmic similarity, corrupting data.
      *   **Evolution of Knowledge:** Scholarship evolves. New evidence might *separate* entities previously thought to be one (e.g., distinguishing between two ancient authors whose works were compiled under one name). An irreversible merge makes correction impossible without losing all structured data attached to the incorrect merged item. P460 allows for a "soft" link while evidence is weighed.

  *   **What This Breakage Reveals about Current Practice:**
      The breakage demonstrates that the current system is fundamentally committed to:
      1.  **Epistemic Fallibility:** Knowledge about identity is provisional and subject to revision based on evidence. Absolute certainty is not assumed.
      2.  **Representing Uncertainty:** It's crucial to explicitly model states where identity *is not definitively known* but requires annotation (P460).
      3.  **Avoiding Irreversible Errors:** The cost of a bad merge is high, so mechanisms for caution (P460) and explicit distinction (P1889) are necessary.
      4.  **Acknowledging Contextual Constraints:** Determining identity isn't *just* about the entity, but about the *evidence available* and the *interpretation* of references in context. P460 acknowledges that "same reference?" is a complex question.

  *   **What Survives Untouched?**
      *   **Wikipedia Redirects:** This mechanism *would* survive largely intact in the rebuild. If two names are deemed (by the merger algorithm) to refer to the same entity, then redirecting one to the other makes perfect sense under the "contentless tags" model. The *functional* aspect of getting the user to the correct consolidated article information is preserved. The redirect embodies the *operational consequence* of the identity resolution ("for access purposes, treat these names as equivalent"). This part truly isn't fundamentally about the *meaning* of names; it's about *access based on resolved identity*.

  **Conclusion**

  The implicit theory is a pragmatic blend: names *aim* to be pure referential tags picking out real-world entities (explaining Wikipedia's titling, redirects, and interchangeable usage), but *determining when two references succeed in picking out the *same* entity* is recognized as an evidence-based, fallible process prone to uncertainty (explaining Wikidata's P460 and P1889). The tension arises from conflating the *goal* of reference (singular entity) with the *process* of verifying co-reference across instances. The system is underdetermined regarding pure Millianism vs. descriptivism, relying instead on source consensus for operational decisions. A "contentless tags" rebuild shatters the crucial ability to handle uncertainty, ambiguity, and evolving scholarship, revealing the current system's deep commitment to epistemic humility in entity resolution. Only the purely functional access mechanism of Wikipedia redirects would remain unscathed. The inconsistency you sense stems from the system grappling with the difference between the semantics of reference and the epistemology of co-reference, a distinction it handles pragmatically but perhaps not philosophically neatly.
