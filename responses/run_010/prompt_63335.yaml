prompt: |-
  can you write me a parody of a pharmaceutical package insert — the "highlights of prescribing information" kind of document — for a fictional drug called Poena XR, extended-release just deserts, indicated for the treatment of wrongdoing. The sponsor is a sincere, card-carrying retributivist: they hold that wrongdoers deserve to suffer in proportion to the seriousness of the offense, that desert is a ceiling rather than a target, and that deterrence, reform, and incapacitation are at best side effects nobody should dose on account of. So the insert has to be internally consistent retributivism start to finish. If the sponsor slips into consequentialist reasoning somewhere, that slip has to be the joke and visibly the joke, not just an error.

  the comedy should come from getting the philosophy right rather than from wackiness. the format demands things retributivism can't easily hand over — a validated conversion factor between offense-seriousness and units of suffering, a placebo arm, a patient-reported efficacy endpoint, one dosing rule covering both the guy whose identical attempt luckily came off harmless and the guy whose didn't, repeat patients who've built up a tolerance, the question of whether to keep dosing someone who's genuinely repentant — and the sponsor has to address each of those honestly, in the same flat regulatory voice, without ever admitting there's a problem. a punishment theorist should laugh because every section maps onto a real objection and find the satire fair; a layperson should still find it funny. no winking, no throat-clearing setup, and please don't state any of the objections as objections — let them surface out of the boilerplate.

  structure it like a real insert: boxed warning up top before anything else, then indications, dosage and administration, contraindications, warnings and precautions, adverse reactions, drug interactions, use in specific populations, overdosage, clinical studies, how supplied and storage. hard limit of 600 words, which i know is tight for that many sections, so a few lines each and cut whatever isnt pulling its weight. no quotes from or attributions to real philosophers, no references section, no named real people or real agencies.
reasoning: |-
  We are creating a parody pharmaceutical package insert for "Poena XR (extended-release just deserts)".
   The drug is indicated for the treatment of wrongdoing, and the sponsor is a strict retributivist.
   The humor comes from the retributivist philosophy being applied rigidly to the format of a drug insert, which requires elements that are incompatible with retributivism.
   We must avoid any consequentialist reasoning (unless it's a slip that is clearly a joke but presented as an error in the sponsor's voice).
   Sections: Boxed Warning, Indications, Dosage and Administration, Contraindications, Warnings and Precautions, Adverse Reactions, Drug Interactions, Use in Specific Populations, Overdosage, Clinical Studies, How Supplied/Storage.
   Hard limit: 600 words.

   Important: Each section must reflect retributivist principles and honestly address the challenges (like conversion factors, placebo, etc.) without admitting problems.

   Let's outline:

   1. Boxed Warning: Serious risks, like suffering in proportion to the offense. Emphasize that it must not be used for deterrence, etc.

   2. Indications: For the treatment of wrongdoing. Specify that it is for the desert-based suffering only.

   3. Dosage and Administration: How to dose? The challenge: no clear conversion factor. Also, how to handle identical attempts with different outcomes? Tolerance? Repentance?

   4. Contraindications: Who should not receive it? Maybe those who haven't done wrong? But also, what about if the suffering is not deserved? 

   5. Warnings and Precautions: About the risk of under/overdosing? The problem of measuring offense seriousness.

   6. Adverse Reactions: The suffering is the intended effect, so what are the adverse reactions? Maybe unintended consequences? But retributivist doesn't care, so perhaps we list the suffering as both intended and adverse? Or maybe the adverse reactions are when the suffering is not proportional? 

   7. Drug Interactions: What if the patient is on other treatments (like rehabilitation)? The retributivist would say that those are irrelevant.

   8. Use in Specific Populations: Children? Elderly? The mentally ill? How does retributivism handle reduced culpability?

   9. Overdosage: What happens if you give too much? Then you exceed desert, which is a ceiling? How to correct?

  10. Clinical Studies: The joke here: how do you do a clinical trial? Placebo? Patient-reported outcomes? They are not relevant because the point is desert, not efficacy by other measures.

  11. How Supplied/Storage: Standard, but with a twist? Maybe the storage is in a place of justice?

   We have to be concise (600 words). We'll aim for about 50 words per section on average.

   Let's write:
answer: |-
  **HIGHLIGHTS OF PRESCRIBING INFORMATION**  
  *These highlights do not include all information needed to administer Poena XR safely and proportionately. See full prescribing information for Poena XR.*  

  **POENA XR™ (extended-release just deserts)**  
  For proportional suffering  
  **Initial U.S. Retributive Approval:** 2024  

  ---  
  **BOXED WARNING: NON-UTILITARIAN ADMINISTRATION**  
  - **Poena XR is not indicated for deterrence, rehabilitation, or incapacitation**  
  - **Intentional use for consequential benefit may invalidate desert-based outcomes**  
  - **Suffering must align with offense gravity; exceeding desert ceiling constitutes overdosage**  
  *See full prescribing information for complete boxed warning.*  

  ---  
  **INDICATIONS AND USAGE**  
  Poena XR is an extended-release just desert indicated for the treatment of wrongdoing in individuals confirmed to deserve suffering. Poena XR does not treat underlying moral defects.  

  **DOSAGE AND ADMINISTRATION**  
  - **Dosing based solely on offense severity** using the Desert Equivalency Scale (DES). One DES unit = 1 mg Poena XR.  
  - **Identical offenses:** Administer same dose regardless of actual harm (e.g., attempted vs. completed theft).  
  - **Repeat offenders:** Tolerance to suffering is irrelevant; dose per current offense.  
  - **Repentance:** Not a dose-adjustment factor. Administer full desert irrespective of contrition.  

  **CONTRAINDICATIONS**  
  - Innocence (confirmed via due process).  
  - Preemptive dosing prior to wrongdoing.  

  **WARNINGS AND PRECAUTIONS**  
  - **Suffering calibration:** Use DES rigor. Off-label use of "harm reduction" scales may cause underdosing.  
  - **Consequentialist drift:** Monitor for surreptitious appeals to deterrence/reform; discontinue if detected.  
  - **Placebo challenge:** Placebo-controlled trials are invalid (suffering must be real).  

  **ADVERSE REACTIONS**  
  - **Most common:** Proportional suffering (intended therapeutic effect).  
  - **Serious:** Suffering exceeding offense gravity (see Overdosage).  
  - **Unrelated effects:** Incidental reform or deterrence (causally irrelevant; do not document).  

  **DRUG INTERACTIONS**  
  - **Rehabilitative agents:** Co-administration may obscure desert-focused outcomes. Avoid.  
  - **Palliatives (e.g., empathy inducers):** May attenuate suffering intensity. Contraindicated.  

  **USE IN SPECIFIC POPULATIONS**  
  - **Reduced culpability (e.g., severe mental illness):** Not a dose adjustment factor; calibrate DES to act only.  
  - **Pediatrics:** Dose identically to adults for equivalent offenses (developmental immateriality).  

  **OVERDOSAGE**  
  - **Manifestations:** Suffering exceeding desert ceiling (e.g., 15 DES units administered for 10-DES offense).  
  - **Treatment:** Immediate suffering reduction to proportional level. Do not induce reform.  

  **CLINICAL STUDIES**  
  - **Trial Design:** Single-arm studies (n=deserving). Placebo arm ethically non-evaluable.  
  - **Efficacy Endpoint:** 100% achieved desert-aligned suffering (no patient-reported measures used).  
  - **Limitation:** Dose-response model assumes fixed DES conversion; inter-rater reliability not assessed.  

  **HOW SUPPLIED/STORAGE AND HANDLING**  
  - **Supplied:** 1 mg, 5 mg, 10 mg proportional suffering tablets in amber vials labeled "Deontic Justice."  
  - **Storage:** At 00.1–25°K (absolute zero ± justice-preserving variance). Do not expose to utilitarian environments.  

  ---  
