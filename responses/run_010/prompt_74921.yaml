prompt: |-
  I cover science and ideas for a British broadsheet — climate research, research integrity, the occasional AI ethics row. I'm wrestling with a piece and I want help taking a proverb apart before it goes anywhere near print.

  The situation, lightly fictionalised so nobody gets identified, but structurally exactly what I'm dealing with. Call him A: a climate scientist who has spent twenty years telling governments that cutting frequent flying is the single highest-impact change a professional can make. A leaked expense record turns up roughly 40 long-haul business class trips over three years. The head of his institute — call her B — signs a public statement saying his conduct was incompatible with the standards he had publicly advocated, and that the institute takes the criticism of him seriously. A's reply is that the facts are right but the criticism is not B's to make, because B flies about twice as much he does. Then there's C: a transport economist I know, completely upfront that he flies a lot and thinks it's fine for him, who has never claimed anything about his own conduct, and who says exactly the same critical thing about A on the record. And D: someone who did what A did, got caught four years ago, admitted it, hasn't flown since, and has now said the same thing about A.

  The proverb being thrown around by literally every party to this — A's defenders in my inbox, B's comms office, and my own readers in the comments — is "people who live in glass houses shouldn't throw stones". Occasionally with the bit about casting the first stone substituted in.

  I want you to treat that one sentence as a bundle of candidate claims and tell me which of them are actually true. I'm reasonably well read but not a philosopher, and I suspect it's doing at least four different jobs in my story, some of them harmless and at least one of them flatly false.

  Work as a moral philosopher who specialises in blame, standing and moral address, but who has done enough media work to know that a sub-editor will cut anything hedged. Do the thinking before the writing: rough out the candidate readings as notes first, try to break each one against A, B, C and D, merge any two that turn out to be the same claim wearing different clothes, and only then order them weakest to strongest and write it up. Where you think the proverb is being used dishonestly — to deflect from a criticism that's simply true — say so plainly rather than diplomatically.

  Give me these sections, in this order:

  **Bottom line** — four to six sentences. What the proverb can and cannot do here, and which of B, C and D, if any, loses their footing.

  **The readings** — the meat, 900 to 1,200 words. Numbered, each with a short name, the claim stated precisely enough that I could tell you whether you'd got it wrong, a verdict tag (platitude / substantive and defensible / substantive and contested / false), and one line saying which of my four characters it bites on.

  **The parameters** — a compact table. The proverb is vague about a lot of things: whose conduct counts, whether the wrong has to be identical or merely similar, whether the blamer's own record has to be worse or just as bad, whether it has to be current or can be in the past, whether it has to be concealed, and who's allowed to invoke it in the first place — the accused himself, a bystander, a journalist. One row per parameter, one column for whether varying it changes which readings survive.

  **What it can never do** — about 200 words. The uses that fail on every reading, so I know what to strike when a source says this to me.

  **The line I could actually print** — three candidate sentences precise enough to survive a legal read, plus one you'd tell me not to use and why.

  Two things I specifically want chewed on. First: C isn't inconsistent at all. He's openly a non-complier and never pretended otherwise, so if the proverb has no purchase on him, that tells me its not actually about consistency — which would reshape the whole piece. Second: does anything in the proverb bear on whether B's criticism is *true*, as opposed to whether she's the right person to make it? I'm pretty sure it definately doesn't, but I want that argued rather than asserted, because it's the hinge of my argument with my editor.

  No bibliography, no names and dates, no references I'd have to look up — I can't check them and I don't need them. If a distinction has a technical name, use it and gloss it in a clause.
reasoning: |-
  Hmm, the user is a science journalist for a British broadsheet, working on a piece about hypocrisy in climate advocacy. They've presented a fictionalized scenario with characters A (a climate scientist caught flying excessively), B (his institute head who criticizes him while flying more), C (an economist who flies but never advocated against it), and D (a reformed flyer). The key issue is the proverb "people who live in glass houses shouldn't throw stones," which all parties are invoking.

  I need to approach this as a moral philosopher specializing in blame and standing. The user wants rigorous analysis of the proverb's validity in this context, with specific attention to whether it undermines B's criticism and why it doesn't apply to C. They're particularly concerned about distinguishing between the truth of a criticism and the standing to deliver it.

  Breaking this down: First, I'll identify the core philosophical questions. The proverb seems to function as an ad hominem attack, shifting focus from the act to the actor. But we need to disentangle several dimensions: logical consistency, moral standing, and deflection tactics. For C, his transparency removes any hypocrisy charge - he never claimed moral high ground, so the proverb shouldn't bite. That reveals the proverb isn't about behavioral consistency per se, but about claiming unearned authority.

  For B, the analysis must separate two issues: whether her criticism of A is valid (which it appears to be), and whether her own conduct nullifies her right to speak. The proverb conflates these, but ethically they're distinct - a thief can still correctly identify theft. The key is whether B's position creates special obligations. As institute head, she arguably has duty to enforce standards, making her criticism necessary despite personal flaws.

  The reformed case D is fascinating - their past failure actually strengthens their standing to criticize, demonstrating the proverb's limitation regarding redemption. This suggests the proverb's weakness is its static view of morality.

  Structurally, I'll follow the requested format: start with a bottom-line conclusion, then detailed readings of the proverb, a parameters table showing how interpretations shift with variables, an analysis of invalid uses, and finally printable formulations. The table should capture how factors like wrong similarity or concealment affect different interpretations.

  Throughout, I'll emphasize that the proverb's primary function here is deflection - it doesn't touch the substance of A's hypocrisy, only attempts to silence critics. This is crucial for the user's argument with their editor about truth versus delivery. The "line I could print" section will model precise phrasing that avoids the proverb's vagueness while capturing its ethical shortcomings.

  Notably, the user wants unhedged analysis - they're preparing for sub-editor cuts. So I'll avoid qualifiers like "arguably" where possible, stating clearly when the proverb is being used dishonestly to protect A from valid criticism.
answer: |-
  ### Bottom line
  The proverb "people who live in glass houses shouldn't throw stones" functions primarily as a *deflection tactic* in this scenario. It **cannot** invalidate the *truth* of the criticism against A – his actions *are* hypocritical. It *can* sometimes undermine the **standing** of a specific critic to deliver that criticism, particularly if they are actively guilty of a comparable or worse offence *and* their role demands alignment with the norm. B (the institute head) likely loses footing because her role requires exemplifying institutional values. C (the unapologetic economist) retains full standing; his lack of pretence neutralizes the proverb. D (the reformed flyer) actually *gains* standing through their demonstrated commitment. The proverb's misuse lies in falsely equating the validity of the criticism with the critic's own record.

  ---

  ### The Readings

  1.  **Name:** Literal Vulnerability  
      **Claim:** If you are visibly flawed or vulnerable to the same accusation you make, launching that accusation invites retaliation that will damage you.  
      **Verdict:** Platitude  
      **Bites On:** B (primarily). A attacking B's flying in retaliation highlights B's vulnerability. It's a pragmatic warning about self-preservation, not morality.

  2.  **Name:** Logical Inconsistency (Weak)  
      **Claim:** Accusing someone of wrongdoing while committing the same wrong yourself reveals a contradiction in your beliefs/values, weakening your argument.  
      **Verdict:** Substantive and Defensible  
      **Bites On:** A (when he criticizes *others* for flying). A advocating flight reduction while flying extensively *is* logically inconsistent. This directly undermines his credibility *as an advocate*. The proverb flags this basic hypocrisy.

  3.  **Name:** Moral Standing / Hypocrisy (Substantive)  
      **Claim:** Committing the specific wrong you condemn (or a sufficiently similar wrong) *deprives you of the moral authority* to blame others for it, regardless of the truth of your accusation. Your blame is tainted ("dirty hands").  
      **Verdict:** Substantive and Contested  
      **Bites On:** B (potentially). This is the core contested claim. Does B's own extensive flying, while condemning A's, nullify her *right* to blame A on behalf of the institute? Critics argue her position requires moral credibility she lacks. Defenders argue her institutional role *obligates* her to enforce standards, even imperfectly. **Crucially, this says *nothing* about whether A's conduct *was* wrong.**

  4.  **Name:** Deflection (Tu Quoque Fallacy)  
      **Claim:** Pointing out the critic's own faults *invalidates the original criticism* or renders it unworthy of consideration.  
      **Verdict:** False  
      **Bites On:** A (and his defenders). This is the dishonest core of how the proverb is often used here. A's (or his defenders') retort "But *you* fly more!" **does not make A's hypocrisy disappear or B's/C's/D's critique false.** It merely shifts focus. The truth of the criticism ("A's actions contradict his advocacy") is independent of the critic's conduct. This use *is* deflection.

  5.  **Name:** Normative Undermining  
      **Claim:** When someone who publicly endorses a norm violates it, it damages the perceived validity or importance of the norm itself ("Why should *I* comply if even the advocates don't?").  
      **Verdict:** Substantive and Defensible  
      **Bites On:** A (exclusively). A's actions, precisely *because* he was a prominent advocate, risk eroding public trust in the norm (flight reduction necessity). B, C, and D criticizing A are *defending* the norm against this undermining effect. The proverb, ironically, is used by A's side to deflect from this very real harm A caused.

  6.  **Name:** Scope of Relevance (Who counts?)  
      **Claim:** Only individuals/groups who *themselves uphold* the norm they endorse have the standing to criticize violations.  
      **Verdict:** Substantive and Contested (Often False in Application)  
      **Bites On:** Misapplied against C & D. This is where your key point about C strikes. C *never* endorsed the personal flight reduction norm; he lacks the *hypocrisy* that undermines A and potentially B. He can criticize A's inconsistency because he makes no contradictory claim. D *did* endorse the norm, failed, but now demonstrably upholds it. D's past failure doesn't taint his *current* standing to uphold the norm he now adheres to; it may even lend weight. The proverb crudely lumps C and D with B and A, which is invalid. Standing depends on the *nature of the critic's relationship to the norm*, not mere behavioural similarity.

  ---

  ### The Parameters (How Variations Change Which Readings Survive)

  | Parameter                 | Varying It Changes Valid Readings? | Key Impact                                                                 |
  | :------------------------ | :--------------------------------- | :------------------------------------------------------------------------- |
  | **Whose Conduct Counts?** | **YES**                            | Is it the blamer's? A bystander's? Changes relevance for Standing (3) & Scope (6). |
  | **Wrong: Identical/Similar?** | **YES**                            | How close must the blamer's fault be to the accused's? Critical for Moral Standing (3). Similarity weakens the claim. |
  | **Blamer's Record: Worse/Equal?** | **YES**                            | Is the blamer *more* guilty, or just *as* guilty? Affects force of Literal (1) and Moral Standing (3). Worse guilt strengthens the counter. |
  | **Timing: Current/Past?** | **YES**                            | Is the blamer *currently* guilty, or reformed? Vital for Moral Standing (3) vs. Scope (6) (D's case). Past fault weakens the counter, especially if reformed. |
  | **Concealment?**          | **YES**                            | Was the blamer's fault hidden? Increases hypocrisy (Logical Inconsistency (2)) and undermines Moral Standing (3) more severely. |
  | **Who Invokes It?**       | **YES**                            | Accused (A)? Bystander? Journalist? Affects whether it's defense (potentially valid for Standing (3)) or deflection (4). Accused using it strongly suggests Deflection (4). |

  ---

  ### What It Can Never Do

  The proverb **cannot**, on any coherent reading:
  1.  **Make the criticised action morally permissible or less wrong.** A's hypocrisy remains, regardless of who points it out or their own flaws. The proverb addresses the *act of blaming*, not the *act being blamed*.
  2.  **Invalidate a factual claim.** If A flew 40 times while advocating against it, that fact stands. C and D stating this fact is unassailable by the proverb; their commentary on its *meaning* (hypocrisy) is also independent of their own flight records in C's case and strengthened by D's record.
  3.  **Grant immunity from criticism to the guilty.** Its function is defensive, not absolving. Even if B lacks perfect standing, it doesn't mean A's conduct is beyond reproach by *others* (C, D, the public).
  4.  **Apply meaningfully to those who make no pretense of virtue regarding the specific norm.** This is C's shield. The proverb fundamentally targets *inconsistency between word and deed*. Where there is no relevant "word" (endorsement of the norm), the proverb misfires. It's not about universal behavioural purity; it's about claimed moral authority.

  Its invocation by A and his defenders is primarily **Deflection (4)** – an attempt to change the subject from A's damaging hypocrisy to the supposed flaws of his critics. This is dishonest because it avoids addressing the core issue A created.

  ---

  ### The Line I Could Actually Print (Precise Formulations)

  1.  **Strong & Legally Safe:** "While critiques of a critic's own conduct may sometimes undermine their standing to deliver blame, they do not negate the factual truth of the underlying criticism, nor prevent others without such conflicts from making it."
  2.  **Direct & Punchy:** "Pointing to a critic's hypocrisy may deflect attention, but it cannot erase the original act of hypocrisy itself or its consequences for public trust."
  3.  **Focus on Core Issue:** "The validity of identifying hypocrisy hinges on the inconsistency between advocacy and action, not on the spotless record of the identifier."

  **Do Not Use:** "A's flying doesn't matter because B/C fly too." **Why:** This is factually incorrect (A's flying *does* matter due to his advocacy) and commits the Tu Quoque fallacy. It falsely implies equivalence between A's unique hypocrisy and others' actions, and suggests the criticism is invalidated, which it is not. It's legally risky as it could misrepresent the facts and imply endorsement of the flawed proverb logic.
