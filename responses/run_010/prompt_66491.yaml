  14. "Dominance is a pointwise comparison... summing across propositions can't reverse that: **Misleading.** While pointwise *per proposition* dominance would imply overall dominance under additivity, Joyce's theorem (as stated) relies on comparing *overall* inaccuracy (the sum). Without additivity, 'overall dominance' isn't defined by summing, so the comparison becomes ambiguous." [✗]
