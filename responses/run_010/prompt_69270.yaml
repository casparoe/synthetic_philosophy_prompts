answer: |-
  Here is the exam question and model answer as requested, designed to probe the specified technical crux:

  ---

  **SECTION D: ESSAY QUESTION (20 marks)**

  Read the following passage from a classmate’s essay:

  > "Harsanyi’s Aggregation Theorem proves that social welfare must be a weighted sum of individual vNM utilities: \( W = \sum a_i U_i \). Since vNM utilities are cardinal, this sum inherently permits interpersonal comparison of utility *levels* and *differences*. Further, if we assume an impartial observer behind a veil of ignorance facing equal probability of becoming any person, the weights \(a_i\) must be equal (\(a_i = a_j\)). Thus, the theorem, combined with equiprobability, establishes interpersonal comparability and requires utilitarian social welfare with equal weights: \( W = \sum U_i \)."

  **Critically evaluate this argument.** Precisely explain what Harsanyi’s theorem *assumes* rather than *establishes* regarding the interpersonal comparability of utility levels and differences, and the determination of social weights. Your answer must address:
  1.  What additional assumption(s) beyond the theorem's stated axioms are required to fix a *common unit* for comparing utility *differences* interpersonally.
  2.  What additional assumption(s) are required to fix a *common zero point* for comparing utility *levels* interpersonally.
  3.  What determines the social weights \(a_i\) within the theorem, and what specific step (beyond assuming vNM rationality and Pareto optimality) is needed to argue for *equal* weights \(a_i = a_j\).
  4.  Whether the equiprobability (veil of ignorance) argument, by itself, supplies the assumptions needed in (1), (2), and (3), or whether it implicitly relies upon them. *(Answer in ~45 minutes)*

  ---

  **MODEL ANSWER (Approx. 600 words)**

  The classmate’s passage fundamentally misattributes what Harsanyi’s theorem establishes versus what it presupposes. The theorem demonstrates that if (i) individuals and the social planner have vNM-rational preferences (satisfying the vNM axioms), and (ii) the social preference satisfies the Pareto principle (weak and strong), then social welfare \(W\) must be a *weighted sum* of individual vNM utility functions: \(W = \sum a_i U_i\), with \(a_i > 0\). Crucially, **the theorem *assumes* interpersonal comparability of utility levels and differences; it does not *derive* it from vNM cardinality alone.** 

  1.  **Fixing a Common Unit (Comparability of Differences):** Individual vNM utility functions \(U_i\) are unique only up to *positive affine transformations* (PATs): \(U_i' = m_i U_i + n_i\) (\(m_i > 0\)). This means individual scales (units) are arbitrary. The weighted sum \(W = \sum a_i U_i\) only has invariant meaning *across individuals* if the scaling factors \(m_i\) are fixed relative to each other. **This requires the *assumption* of a common interpersonal utility unit.** Without assuming we know how much one unit of utility for person i "counts" relative to one unit for person j (i.e., fixing the ratios \(m_i / m_j\)), the weights \(a_i\) and the magnitudes of the \(U_i\) are interdependent and arbitrary. The theorem does not provide this common scale; it assumes comparability is already possible to define the sum meaningfully.

  2.  **Fixing a Common Zero Point (Comparability of Levels):** The PAT freedom also means that the zero point (\(n_i\)) of each \(U_i\) is arbitrary. Comparing absolute utility *levels* between individuals (e.g., "Person A is happier than Person B") requires knowing where "zero utility" is for each person *and* that these zero points represent the same welfare level interpersonally. **The theorem does nothing to fix these zero points.** Even with a common unit (fixed \(m_i/m_j\)), adding different constants \(n_i\) shifts the levels without affecting choices or the vNM representation. To compare levels, we must *assume* a common interpersonal zero point (e.g., a state of indifference or a defined "neutral" welfare level) is established externally. Harsanyi's sum relies on this for level comparisons.

  3.  **Determining (Equal) Weights:** The weights \(a_i\) in the theorem are strictly positive but otherwise undetermined by the vNM axioms and Pareto principle alone. They reflect the *relative ethical value* assigned to each individual's utility gain by the social planner. **To argue for *equal* weights (\(a_i = a_j\)) requires an *additional normative principle*, such as impartiality or anonymity.** The theorem itself is compatible with any set of positive weights.

  4.  **The Equiprobability Argument:** The veil of ignorance/equiprobability argument aims to *motivate* the choice of equal weights (\(a_i = a_j\)). However, **it does *not* independently establish the common unit or common zero point needed for interpersonal comparability.** The argument assumes that an observer, facing an equal chance of being anyone, would maximize their *expected utility* under this risk. This expected utility is \(\sum \frac{1}{N} U_i\). Crucially, this *presupposes* that the \(U_i\) functions are already interpersonally comparable on a common scale and with a common zero. The observer can only add the \(U_i\) meaningfully if the unit and zero are fixed. Otherwise, applying PATs to individual utilities would change the "impartial" evaluation. **Equiprobability provides a justification for *equal weights* (\(a_i\)) *only after* interpersonal comparability (common unit and common zero) has been assumed.** It smuggles in comparability; it does not create it from the vNM framework alone. It justifies why, *given comparability*, weights should be equal, but it does not resolve the affine freedom inherent in the individual \(U_i\) functions.

  **Conclusion:** Harsanyi's theorem shows that *if* utilities are interpersonally comparable (common unit and zero fixed), then Pareto-optimal social welfare is a weighted sum. The common unit and zero are exogenous assumptions. The weights \(a_i\) are determined by ethical choice. Equiprobability offers a rationale for choosing *equal* weights, but it critically depends on the prior (and unproven by the theorem) assumption of interpersonal comparability; it cannot generate comparability from the vNM axioms. The classmate incorrectly presents comparability and equal weights as logical consequences derived by the theorem and equiprobability, when in reality, comparability is the foundational (and contested) assumption enabling the sum and the interpretation of the weights.

  ---

  **MARKING SCHEME (Total 20 marks)**

  *   **M1 (4 marks): Identifies that interpersonal comparability (common unit & zero) is *assumed* for the sum, not *derived* from vNM cardinality.**
      *   *Costs M1:* States or implies that vNM cardinality *by itself* allows interpersonal comparison within the sum W.
  *   **M2 (5 marks): Correctly distinguishes the assumptions needed for common unit (scale; fixes \(m_i/m_j\)) vs. common zero (origin; fixes \(n_i = n_j\) interpersonally).**
      *   *Costs M2:* Fails to separate unit and zero requirements; conflates comparability of levels and differences; thinks fixing one fixes the other.
  *   **M3 (4 marks): States that weights \(a_i\) are undetermined by theorem (reflect ethical choice) and that equal weights require an *additional normative principle* (e.g., impartiality).**
      *   *Costs M3:* Implies weights are determined by theorem/Pareto alone, or that equiprobability is part of the theorem's derivation of W.
  *   **M4 (5 marks): Correctly analyzes equiprobability: justifies *equal weights* only *given prior comparability*; does NOT fix unit/zero; *presupposes* comparability for expected utility calculation.**
      *   *Costs M4:* Claims equiprobability establishes comparability or resolves affine freedom; thinks expected utility behind the veil defines the \(U_i\) uniquely interpersonally.
  *   **M5 (2 marks): Overall coherence, precision, and directly addressing the crux (affine freedom -> need for exogenous fixes for unit/zero/weights).**
      *   *Costs M5:* Vague, restates theorem/hypotheses without engaging affine freedom & comparability, or misstates the core critique of the passage.

  ---
  **Rationale:** This question forces candidates beyond theorem recitation by embedding a common misinterpretation. The fictional passage exemplifies the conflation of vNM cardinality with interpersonal comparability and the misapplication of equiprobability. The marking scheme specifically targets the requested crux: the interplay of affine freedom, the distinct assumptions needed for unit/zero/weights, and the dependence of the equiprobability argument on smuggled-in comparability. The model answer dissects these points methodically.
