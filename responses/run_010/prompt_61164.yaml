  ---

  **Essay Question (25 marks, 1200-1500 words)**

  In reinforcement learning (RL), an agent interacts with an environment over discrete time steps. At each step \(t\), the agent is in a state \(s_t\), takes an action \(a_t\), transitions to a new state \(s_{t+1}\), and receives a reward \(r_t\). The agent's goal is to maximize the expected discounted return \(R_t = \sum_{k=0}^{\infty} \gamma^k r_{t+k}\), where \(0 < \gamma < 1\) is a discount factor.

  Consider the following two technical facts:

  1. **Invariance of policy rankings under reward transformations:** 
     - (i) If we take the original reward function \(r(s, a, s')\) and replace it with a new reward function \(r'(s, a, s') = a \cdot r(s, a, s') + b\) (for any constants \(a > 0\) and \(b\)), then the ranking of policies (by expected discounted return) remains unchanged. 
     - (ii) Similarly, if we add a "potential-based shaping" term to the reward, so that the new reward is \(r'(s, a, s') = r(s, a, s') + \gamma \Phi(s') - \Phi(s)\) for some function \(\Phi\) on states, then again the ranking of policies remains unchanged. 

     In both cases, the agent's optimal behavior (i.e., the actions it takes) is unaffected by the transformation.

  2. **Reward prediction error (RPE) as the driver of learning:**
     - In temporal-difference learning algorithms (such as Q-learning or SARSA), the agent learns by updating its value estimates based on the RPE, defined as \(\delta_t = r_t + \gamma V(s_{t+1}) - V(s_t)\). 
     - In a fully predictable environment, once the agent has learned the environment dynamics and reward structure, the RPE \(\delta_t\) becomes zero at every step. This happens even if the rewards \(r_t\) are large and positive (or negative), because the value function \(V\) becomes accurate and the expected return (as captured by \(V(s_t)\)) exactly matches the actual return starting from that state.

  Now, consider the proposal that the reward signal in RL is the functional analogue of valence (pleasure and pain) in conscious beings. That is, when the reward is positive, it is like pleasure, and when negative, it is like pain.

  **Your task:** 

  Using the above technical facts, critically assess the viability of this proposal. In particular, address the following puzzle: 

  - Given that the reward function can be transformed in the ways described in fact (1) without changing the agent's behavior, what does that imply for the claim that reward is valence? Specifically, does it mean that we cannot say whether an agent is experiencing overall pleasure or suffering, only that it prefers some states or actions over others? 
  - Given the role of RPE in learning (fact 2), is the reward itself the valence, or is it the RPE? How do these two quantities relate to valence in a predictable environment? 
  - As a test case, consider wireheading: an agent that manipulates its environment to directly produce high reward signals (e.g., by short-circuiting a reward button). How do the transformations in fact (1) and the role of RPE in fact (2) help us understand what is happening in wireheading? Does wireheading support or undermine the reward-as-valence proposal? 

  In your answer, you must take a clear position on whether the reward-as-valence proposal is tenable in light of these facts. If you think it is not, explain what alternative view might be more plausible (e.g., that valence is the RPE, or that valence requires additional structure beyond the reward function). If you think it is tenable, explain how it can accommodate the invariance properties and the role of RPE.

  ---

  **Model Answer (approx 800 words)**

  The proposal that reward signals in reinforcement learning (RL) serve as functional analogues of pleasure and pain (valence) faces significant challenges when examined through the lens of two key technical facts: the invariance of policy rankings under certain reward transformations and the central role of reward prediction error (RPE) in learning. I will argue that these facts reveal that the reward-as-valence view, as stated, is untenable. While the structural role of reward in guiding behavior might capture some aspects of valence, the absolute valence (the felt quality of pleasure or pain) cannot be reduced to the reward signal alone. Instead, I suggest that valence might be better identified with the RPE, but even that faces difficulties in predictable environments. Ultimately, the reward-as-valence proposal must be either abandoned or significantly revised to incorporate additional structure beyond the reward function.

  First, consider the invariance properties. Fact (1) shows that we can apply affine transformations (scaling by a positive constant and adding a constant) or add potential-based shaping terms to the reward function without altering the agent’s behavior. This means that the absolute level of reward is behaviorally irrelevant; only the relative differences matter. For example, we can transform a reward function that is always positive into one that is always negative by subtracting a sufficiently large constant. If reward were valence, this would imply that an agent could be switched from a state of universal pleasure to universal suffering without any change in its actions. This is deeply counterintuitive: we typically think of pain as having a distinctive qualitative character that would influence behavior. Moreover, the shaping transformation adds a term that depends on state transitions, which can make the reward signal arbitrarily different from the original without changing behavior. Thus, the reward function alone cannot ground the absolute valence of states or actions.

  Second, the role of RPE in learning (fact 2) complicates the picture. In temporal-difference learning, it is the RPE (δ_t) that drives updates to value estimates. Neuroscientific evidence links RPE to dopamine release, which is often associated with pleasure. This suggests that valence might be the RPE, not the reward itself. However, in a fully predictable environment, RPE goes to zero. If valence is RPE, then an agent in a predictable, reward-rich environment would experience no pleasure at all, even while consuming resources that we would consider pleasurable. This seems absurd: a predictable gourmet meal should still be pleasurable. Conversely, in an unpredictable environment, negative RPEs (when outcomes are worse than expected) might feel like pain, but if valence is RPE, then a predictable painful stimulus would have zero valence. This contradicts the common-sense view that predictable pain is still painful.

  Now, consider wireheading. An agent that "wireheads" manipulates its environment to directly maximize reward, such as by stimulating a reward circuit. On the reward-as-valence view, this agent is maximizing pleasure. But the invariance properties show that the same behavior could be produced by a reward function that is negative everywhere (by shifting). Thus, if we only observe behavior, we cannot tell whether the agent is experiencing pleasure or suffering. Moreover, the RPE during wireheading might be zero if the manipulation is predictable, which would suggest (if valence is RPE) no pleasure. But intuitively, wireheading seems like it should be pleasurable. This tension highlights the ambiguity in identifying valence.

  How might one salvage the reward-as-valence view? One could retreat to a structural claim: valence is about the ordering of outcomes, not absolute levels. But this ignores the phenomenology of pain, which is not merely about being worse than something else. Alternatively, one might argue that valence is the RPE, not the reward. But as noted, this implies that predictable rewards yield no pleasure. A hybrid view might be that valence is a combination of reward and RPE, but then we lack a principled way to combine them.

  A more promising approach is to acknowledge that the reward function in RL is underspecified for absolute valence. To fix valence, we might need additional constraints, such as biological grounding (e.g., pain as tied to nociception) or evolutionary function (e.g., rewards aligned with fitness). However, this moves away from the pure functionalism of the original proposal. If valence requires such external anchors, then the reward signal in an arbitrary RL system is not intrinsically valence; it only becomes so when appropriately coupled to the world.

  In conclusion, the technical facts reveal that the reward-as-valence proposal is untenable in its strong form. The invariance properties show that reward cannot determine absolute valence, and the role of RPE suggests that valence might be more closely tied to prediction errors, but that too fails in predictable environments. Wireheading exposes the ambiguity. The view must be revised to incorporate additional structure, perhaps from the relationship between reward and the agent’s goals or survival needs. Without such structure, the reward signal remains a purely formal construct that cannot capture the qualitative essence of pleasure and pain.

