  Must-hit points (each point is allocated a maximum mark; the total of these maxima is 25, but note that some points may be worth more than others and we must allow for quality of argument):

  1. **Explanation of invariance properties (fact 1) and their implications for absolute valence (5 marks):**
     - A: Clearly explains both affine and shaping transformations and argues that they show reward is only defined up to a class of transformations that preserve policy rankings. Then, explicitly states that this means we cannot assign absolute valence (e.g., we cannot say if an agent is suffering overall) because we can shift the reward arbitrarily. (5)
