     - B: Describes RPE but does not clearly articulate the tension in predictable environments, or only discusses one side (e.g., only reward or only RPE). (3-4)
     - Common mistake: Equating reward with valence and then ignoring the RPE, or treating RPE as the same as reward. (Penalize 1-2 marks.)

  3. **Analysis of wireheading as a test case (5 marks):**
     - A: Uses wireheading to illustrate the tension: if the agent wireheads, it gets high reward (so valence should be high), but the invariance means we can shift the reward to be negative without changing behavior. Also, if the wireheading is predictable, RPE is zero. Thus, wireheading challenges the simple reward-as-valence view. (5)
     - B: Mentions wireheading but only in the context of reward hacking without connecting to the invariance or RPE. (3-4)
     - Common mistake: Treating wireheading as simply a case of the agent being "wrong" about what is good, without addressing the invariance or RPE. (Penalize 1-2 marks.)

  4. **Critical position on the viability of the reward-as-valence proposal (5 marks):**
     - A: Takes a clear position (e.g., the proposal is untenable as is) and argues for it using the above points. Explores alternatives (like RPE as valence) and finds them wanting, and/or suggests that additional structure is needed. (5)
     - B: Takes a position but does not adequately defend it, or does not consider alternatives. (3-4)
     - Common mistake: Failing to commit to a position, or sliding between reward, RPE, and value function without resolution. (Penalize 1-2 marks.)

  5. **Coherence and clarity of argument (5 marks):**
     - A: The essay is well-structured, with a logical flow that builds the argument. Each technical fact is introduced clearly and used appropriately. The writing is precise and free of major errors. (5)
     - B: The essay is somewhat disorganized, or the technical facts are not integrated well. There may be minor confusions. (3-4)
     - Common mistake: Mixing up reward, return, and value function, or misstating the technical facts. (Penalize 1-2 marks per instance.)

  **Additional common mistakes to penalize (beyond the above):**
  - Treating reward hacking (like wireheading) as if it alone refutes the metaphysics of reward-as-valence without connecting it to the invariance properties or RPE. (This is already covered in point 3, but if not addressed at all, it would be a flaw in point 3.)
  - Confusing the discount factor γ with other parameters.
  - Claiming that the invariance properties imply that the agent is indifferent to reward scaling, but then not drawing the implication for valence.

  **Distinguishing A from B:**
  - An A essay will clearly articulate the puzzle and use both technical facts to challenge the reward-as-valence view. It will explicitly note that the invariance properties (fact 1) make absolute valence indeterminate, and that fact 2 (RPE) creates a dilemma for whether valence is reward or RPE. It will use wireheading to illustrate the problems. The argument will be structured and precise.
  - A B essay might explain the facts but not fully connect them to the philosophical problem, or might only focus on one fact. The position on the viability of the proposal might be less clear or less well defended.

  **Total: 25 marks** (with the above breakdown: each of the five points is worth up to 5 marks, but note that the points are interdependent; we are not simply adding independent points but assessing the overall argument. However, the breakdown helps in marking.)

