  We are constructing an essay question that centers around the functional role of reward in reinforcement learning (RL) and its proposed analogy to valence (pleasure/pain) in consciousness. The key technical facts we must include are:

  (a) Invariance under affine transformations and potential-based shaping: 
     - For a fixed discount factor γ and policy class, replacing the reward function r with a·r + b (where a>0, b constants) does not change the optimal policy or the ranking of policies.
     - Similarly, adding a potential-based shaping term F(s, a, s') = γΦ(s') - Φ(s) (for some function Φ on states) also leaves the optimal policy unchanged.

  (b) The role of reward prediction error (RPE) in learning:
     - In temporal-difference learning (like Q-learning or TD(λ)), the update is driven by the RPE, which is δ_t = r_t + γV(s_{t+1}) - V(s_t). 
     - In a fully predictable environment, the RPE goes to zero because the value function accurately predicts the return, even if the rewards themselves are large.

  The puzzle: If we say that reward is the analogue of valence, then which of these quantities (raw reward, shaped reward, RPE, etc.) is the valence? And note that because of (a), the reward function is only fixed up to affine transformations and shaping, meaning that we cannot absolutely determine whether an agent is experiencing positive or negative valence overall, only relative differences. This raises a challenge for the view that reward is valence.

  We also want to bring in wireheading as a test case: an agent that manipulates its own reward signal to get high reward without achieving the intended goal. But note that the shaping transformations (a) change the reward function and hence the prediction errors (since the RPE depends on the reward), but leave the behavior unchanged. This creates a tension with (b) because the RPE is changing but behavior is the same.

  The essay should require students to address:

  1. The implications of the invariance properties (a) for the claim that reward is valence. Specifically, if we can shift and scale the reward arbitrarily (and add shaping), then the absolute level of reward doesn't matter, only the relative ordering. But valence (like pain) is often thought to have an absolute negative quality.

  2. The role of RPE in learning and how it relates to valence. In neuroscience, RPE is often linked to dopamine and thus to pleasure. But in a predictable environment, RPE goes to zero even if the agent is getting a lot of reward. So is the valence the reward or the RPE?

  3. How wireheading fits in: if the agent hacks the reward signal, then it might get high reward (and hence, on the valence view, high pleasure) but without achieving the goal. But note that the invariance properties mean that we can shift the reward function arbitrarily, so that even if the agent is getting a high reward, we might be able to shift the entire function so that the same behavior is now driven by a reward function that is negative everywhere. So the absolute valence is not fixed.

  4. Possible responses: 
     - Maybe valence is not the reward but the RPE? But then in a predictable environment, there would be no valence, even if the agent is in a state that we would consider pleasurable.
     - Maybe valence is not captured by the reward function alone, but requires additional structure? Then what structure? And does that mean the original proposal is incomplete?
     - Retreat to a weaker claim: that valence is a structural feature of the reward function (e.g., relative comparisons) but not the absolute levels? But then how do we account for the absolute nature of suffering?

  The question must be concrete and not just "critically evaluate". We can frame it as a puzzle about which quantity should be identified with valence and how the invariances challenge that identification.

