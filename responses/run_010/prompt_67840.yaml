prompt: |-
  I run a small after-school tutoring co-op out of a library room — about 14 kids, ages 12 to 16, four days a week, 90 minutes each. Once every couple weeks I like to give a short unannounced quiz, mostly because it keeps them from cramming only the night before I tell them. Last month I made the mistake of explaining to one kid why the quizzes "can't actually be a surprise if you announce them ahead of time," and he went home and did the whole backward-induction thing: no quiz on the last day, because then we'd know; so it'd have to be the day before; so that's out too; all the way back to Monday, so the announcement is empty. Now the whole group calls it "the Friday thing" and they've gotten cocky. They've also escalated past the actual paradox, which is the part that's really bugging me: one of them said that even if I pick the day randomly, it's not a surprise, because they walked in knowing there was a 25 percent chance, and knowing there's a 25 percent chance is not the same as not knowing. I have no idea how to answer that and I don't have any training in this stuff — I've just been thinking about it on my own in the evenings.

  Can you write me an actual procedure I can run, maybe ten minutes on a Sunday, to decide what to announce and when to quiz, so that the quizzes stay genuinely surprising for as long as possible? Not an essay about the paradox — a set of steps in order, with what counts as a good enough answer to each step, where the procedure just tells me "don't announce that at all," and where it stops and hands the decision back to me because it's about how I want to run my room rather than about facts. I'd also want it to say what to do when I can't work out what the kids actually believe.

  A few things I want you to be straight with me about:

  - Which assumption in the induction does your procedure have to break? Is it the part where they treat my announcement as something they can rely on, or the last-day step, or the idea that they have to know that they know? Say which, because I want to know what my policy is actually depending on.
  - One fix I keep reading about online is basically "the students only win because they assume the teacher never breaks her word, so be a teacher who sometimes does." If your procedure leans on that, tell me, and tell me whether that's just lying with extra steps and what it costs me with a room full of kids who already think they've solved it.
  - The 25-percent kid. Does a probability argument defeat surprise, or is there some line where being unsure is different from being surprised, and if there's a line, is it a real line or am I just picking a number I like? Be honest if the procedure can't settle this and it comes down to what I want the word to mean in my room.

  Then run it on three situations for me: (1) an ordinary week where I want exactly one quiz and I don't care which day; (2) a nine-week term where I already told them there'd be at least three and that none would be visible coming — including a case where the procedure says I can't have what I want and I should walk the promise back, because I'd rather hear that now; (3) the group that's already done the induction, walks in every day assuming a 25 percent chance, and is currently winning.

  Constraints so it's usable: I can't print anything in the room, the kids have phones and a group chat I'm not in, I have to give at least one quiz every two weeks or it stops meaning anything, and one of them will absolutely publish my policy if I say it out loud — so assume anything I announce gets reverse-engineered by Wednesday. Mark every place where I'm being asked to make a judgment call that looks like it's coming out of the procedure.
reasoning: |-
  Okay, let me tackle this tutor's problem. They run an after-school co-op and are dealing with kids who've figured out the surprise quiz paradox using backward induction. The tutor needs a practical procedure to keep quizzes surprising without getting into theoretical debates. 

  First, I need to understand the core issues. The kids used backward induction to argue that a surprise quiz can't exist if announced in advance. Then one kid claimed that even a random 25% chance isn't a surprise because they know the probability. The tutor wants a step-by-step method, not a philosophy lesson. 

  Key constraints: no printing, kids have phones and a group chat, quizzes must happen at least every two weeks, and any announced policy will be dissected. The procedure must handle judgment calls and specify when to break assumptions of the paradox.

  Breaking down the paradox assumptions is crucial. Backward induction relies on the teacher always keeping their word and students knowing that. If the teacher sometimes doesn't quiz, that breaks the last-day step. Also, the students' perfect knowledge is unrealistic—they might doubt the announcement or forget. 

  For the 25% probability kid: knowing a probability isn't the same as certainty. If they think there's a 25% chance, but I quiz on a day they ruled out, that's surprising. The procedure should leverage uncertainty, not eliminate it. 

  Designing the procedure:
  1. **Decision points:** Use a flowchart-like approach. Start by deciding if a quiz is needed this week. If not, skip. If yes, decide whether to announce. Announce only if it serves a purpose—like setting expectations without revealing details. 

  2. **Random selection with memory:** Use a weighted random system. Each day has a base probability, but adjust based on recent quizzes. For example, if no quiz last week, increase probability slightly. This prevents patterns but ensures quizzes happen. 

  3. **Handling announcements:** Never announce exact dates. Instead, give a range like "sometime this week" or "in the next two weeks." This avoids the backward induction trap. 

  4. **Breaking assumptions:** The procedure breaks the "students know teacher always follows through" by allowing no quiz even if announced sometimes (e.g., if all days are blocked). This introduces doubt, making the announcement unreliable. 

  5. **Probability vs. surprise:** Set a threshold where probability < X% counts as surprise. Say, if a day has <20% chance but gets quizzed, it's surprising. The tutor can set X based on their judgment. 

  6. **Special cases:** For a term with multiple quizzes, ensure no two are too close. Track a "cool-down" period. If the schedule becomes predictable, skip a week or quiz unexpectedly. 

  Testing scenarios:
  - **Regular week:** The procedure decides quiz needed. Doesn't announce. Randomly picks a day with adjusted weights. No announcement means no induction possible. 
    
  - **Nine-week term:** Announce "3 quizzes this term, surprise dates." Each week, decide if quiz needed based on past frequency. If a week passes without a quiz, increase next week's probability. Ensure quizzes are spaced out. If conflicts arise, skip one and add later, breaking the "always follows through" assumption. 

  - **Cocky group:** They expect 25% each day. Quiz on a Monday (normally low probability). Since they dismiss Monday, the actual quiz surprises them. Or skip a week entirely, making them question their 25% assumption. 

  Judgment calls:
  - Setting the surprise probability threshold (e.g., 15%).
  - Deciding to skip a quiz even if announced, if no good day (but use sparingly to maintain trust).
  - Adjusting weights based on student behavior (if they seem to expect quizzes on certain days). 

  Addressing the tutor's concerns:
  - **Breaking backward induction:** The procedure breaks the assumption that the teacher's announcement is 100% reliable. By occasionally not quizzing or shifting days, it introduces doubt. 
    
  - **"Lying" concern:** Skipping a quiz isn't lying if framed as "surprises can include no quiz," setting new expectations. It costs some trust but restores surprise if used rarely. 
    
  - **Probability argument:** Surprise requires uncertainty below a threshold. The procedure sets this threshold (e.g., 20%) as a judgment call. It doesn't defeat surprise; it redefines it operationally. 

  Final procedure must be actionable, with clear steps and escape hatches for when the tutor needs to decide based on classroom dynamics. Emphasize that surprise stems from violated expectations, so keeping students uncertain is key. The tutor's judgment in adjusting weights and thresholds will determine effectiveness.
answer: |-
  Here's a concrete, step-by-step procedure designed to maximize genuine surprise while accounting for your constraints. It breaks the backward induction by **making your announcements non-binding** (i.e., you might not quiz even if conditions are met). This injects doubt, preventing the "last day" step of the induction. The trade-off: you sacrifice absolute reliability for surprise, but it's not "lying" if you pre-define escape clauses.

  **Core Policy (Write this down privately; never announce it verbatim):**  
  *"Quizzes happen on weeks I deem necessary (min. 1 per 2 weeks), on days I select via weighted randomness. I may announce a quiz window (e.g., 'this week') but never the exact day. I reserve the right to skip a quiz even if announced, if no day feels surprising enough. Students cannot fully predict my randomness weights or my 'surprise threshold'."*

  ---

  ### **The Sunday Night Procedure (10-Minute Version)**
  *Time: Every Sunday. Tools: Coin, 6-sided die, pen, paper (keep it hidden).*

  1.  **IS QUIZ NEEDED THIS WEEK?**  
      *Check:* Has it been ≥ 8 days since the last quiz? OR Did I skip last week?  
      → **YES:** Proceed to Step 2.  
      → **NO:** No quiz this week. **STOP.**  
      *(Judgment: Ensures quizzes stay relevant without overloading.)*

  2.  **SHOULD I ANNOUNCE?**  
      *Check:* Did I announce last week? OR Is group morale low (needs predictability)? OR Are parents complaining about no notice?  
      → **YES:** Announce vaguely *only* at Monday's start: **"A quiz *might* happen this week."**  
      → **NO:** Announce **nothing.**  
      *(Judgment: Announcements create expectations to violate later. Use sparingly. Vague wording preserves flexibility.)*

  3.  **SET BASE PROBABILITIES (Use die/coin):**  
      Assign weights to Mon-Thu (ignore Fri for backward induction reasons):  
      - Roll die: 1-2 = **Mon (20%)**, 3-4 = **Tue (20%)**, 5 = **Wed (30%)**, 6 = **Thu (30%)**.  
      *(Why: Higher mid-week weights counter the "last day" expectation. Adjust weights monthly if kids catch on.)*

  4.  **ADJUST FOR RECENT HISTORY (Pen/paper):**  
      Apply adjustments to base weights:  
      - Quiz happened last week? **Reduce that day's weight by 15%** (e.g., Tue down to 5%).  
      - No quiz last week? **Add 10% to all days.**  
      - Kids seemed overly confident on a specific day? **Halve that day's weight.**  
      *(Judgment: Prevents patterns. Track adjustments mentally or on hidden paper.)*

  5.  **CALCULATE SURPRISE THRESHOLD (Key for the 25% Kid):**  
      For each day, ask: *"If I quiz today, would the *actual* probability (post-adjustments) feel < 20% to a skeptical student?"*  
      - **YES:** Day is "surprising" (✔️).  
      - **NO:** Day is "expected" (✖️).  
      *(Judgment: 20% is your operational "surprise line". Knowing 25% isn't surprise; <20% creates doubt. This is arbitrary but defensible.)*

  6.  **SELECT QUIZ DAY:**  
      - If **≥ 2 days** are "surprising" (✔️): Randomly pick one using adjusted weights.  
      - If **only 1 day** is "surprising": Quiz on that day.  
      - If **no days** are "surprising": **Skip quiz this week** (even if announced!).  
      *(Judgment: Skipping breaks backward induction. It tells kids: "My announcement wasn't a promise.")*

  7.  **EXECUTE (During session):**  
      - Quiz only if the room's vibe feels uncertain. If they seem 100% certain today, **abort and skip week** (rare; trust your gut).  
      - After quiz, **never confirm** why it was on that day.

  ---

  ### **Straight Answers**
  - **Broken Assumption:** The procedure breaks **"The teacher always quizzes if conditions are met."** By skipping quizzes (Step 6) or aborting (Step 7), you make announcements unreliable. Students can't backward-induce because Day 4 isn't "obvious" – you might skip.
  - **"Lying" Trade-off:** Yes, skipping quizzes uses the "unreliable teacher" fix. **Cost:** Students may distrust announcements. **Mitigation:** Announce vaguely ("might happen"), skip rarely (<10% of planned quizzes), and frame it as "true surprise includes the *possibility* of no quiz." This reframes "lying" as "unpredictability."
  - **The 25% Kid:** **Probability ≠ surprise.** Knowing there's a 25% chance *isn't* surprise – but your procedure makes probability **fluid and hidden**. The "surprise threshold" (20%) defines operationally: if they feel the *true* chance was <20%, it’s surprising. **It’s not a fact – it’s your chosen line.** If they know your exact weights, surprise vanishes. The procedure hides weights, making their estimates inaccurate.

  ---

  ### **Scenario Runs**
  ***(1) Ordinary Week (1 quiz, don't care when)***  
  - Step 1: Quiz needed (last was 10 days ago).  
  - Step 2: No announcement (announced last week).  
  - Step 3: Roll die → 5 → Wed (30% base).  
  - Step 4: Quiz last Tue → Reduce Tue by 15% → Tue now 5%. Wed still 30%.  
  - Step 5: Wed (30% > 20%) → ✖️. But Tue (5% < 20%) → ✔️. Thu (30%) → ✖️. Mon (20%) → ✖️.  
  - Step 6: Only 1 surprising day (Tue) → Quiz on Tuesday.  
  - **Result:** Quiz on low-expectation Tuesday. 25% kid is surprised because actual probability was 5%.

  ***(2) Nine-Week Term (3+ quizzes, all "surprising")***  
  - **Announcement:** "At least 3 quizzes this term, all unannounced dates."  
  - **Week 1:** Quiz (e.g., Thu).  
  - **Week 2:** No quiz needed (only 4 days since last).  
  - **Week 3:** Quiz (e.g., Mon).  
  - **Week 4:** Quiz needed. Base: Wed (30%). Adjust: Last quiz was Mon → Reduce Mon by 15% → Mon=5%. Step 5: Mon (5%<20%→✔️), others ✖️. Quiz Mon.  
  - **Week 5:** No quiz.  
  - **Week 6:** Quiz needed. Base weights. Adjust: Last quiz Mon (not this week) → Add 10% → Mon=30%, Tue=30%, Wed=40%, Thu=40%. Step 5: All >20% → ✖️. **Step 6: No surprising days → SKIP QUIZ.**  
  - **Week 7:** Quiz needed. Adjust: Skip last week → Add 10% → All ≈40%. Still no surprises? **Judgment call:** Force a Wed quiz anyway (term ending soon) OR skip again. If force, accept it’s not "surprising" per procedure – walk back the "all surprising" promise next term.  
  - **Result:** 3+ quizzes, but Week 6 skip maintains unpredictability. If forced quiz, admit: "Some surprises are softer – focus on the material."

  ***(3) Cocky Group (Expecting 25% daily)***  
  - Step 1: Quiz needed.  
  - Step 2: Announce: "A quiz *might* happen this week." (Sets trap).  
  - Step 3: Base weights (Mon 20%, Tue 20%, Wed 30%, Thu 30%).  
  - Step 4: They expect 25% daily → Overconfident on *all* days → **HALVE ALL WEIGHTS:** Mon 10%, Tue 10%, Wed 15%, Thu 15%.  
  - Step 5: **All days <20% → ✔️✔️✔️✔️.**  
  - Step 6: ≥2 surprising days → Random pick (e.g., Mon).  
  - Step 7: They walk in Monday cocky ("only 10% chance!"), but quiz happens. **Surprise:** They dismissed Monday entirely via induction. Actual probability (10%) was below their threshold.  
  - **Result:** They experience surprise via violated expectations ("It won’t happen today") not probability ignorance. If you skip Week 6 (as above), it further erodes their certainty.

  ---

  **Critical Judgment Calls (Marked in Procedure):**  
  1. Setting the "surprise threshold" (Step 5; default 20%).  
  2. Adjusting weights for "overconfidence" (Step 4).  
  3. Skipping quiz when no day is surprising (Step 6).  
  4. Aborting quiz if room feels too certain (Step 7).  
  5. Walking back promises if impossible (e.g., Scenario 2 Week 7).  

  **Operational Reality:** The kids *will* reverse-engineer parts of this (e.g., "He avoids back-to-back weeks" or "Weights change"). That's fine. The goal isn't perfection – it's injecting enough unpredictability that genuine surprise (violated expectations) happens most of the time. Refresh your weights every 4-6 weeks based on their behavior. **Your best weapon is their overconfidence:** When they think they’ve solved it, halve weights and quiz on their "impossible" day.
