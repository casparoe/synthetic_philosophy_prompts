answer: |-
  (Setting down her pen with a faint rasp against the paper, her gaze level and weary but precise)  
  Your objection mistakes the nature of the instrument for the nature of the disease. A group formed to extinguish parties must, if it is to succeed, dissolve itself immediately upon achieving its single, defined object. Its discipline must be solely to that end—not to perpetuating its own existence, not to manufacturing a permanent loyalty that displaces individual conscience. The evil I track is precisely the *permanent* collectivity that demands adherence to its platform as a condition of belonging, that substitutes its own growth and internal cohesion for the unmediated attention each soul owes to justice and to truth. A temporary assembly of citizens united to dismantle a specific machinery of collective passion is no more a party than a fire brigade is an arsonist. The fire brigade exists to extinguish the fire and then disband. The arsonist exists to feed the flame.  

  (Leaning forward slightly, her voice low but cutting)  
  You ask if this 'honesty' can be housed within a party? It cannot. For the instant such a group shifts its aim from the destruction of parties to its own endurance—to recruiting not for the act of abolition but for the next election, to disciplining thought beyond the single shared object, to demanding its members vote *as its leaders decide* on matters beyond the original purpose—it has become the very thing it sought to abolish. It manufactures collective passion; it pressures the mind. The seed of the disease is the transformation of a tool for a task into a machine for power. This is inherent. A party, by its structure, seeks to live. Truth requires only that we attend. They are opposed principles. A group that does not dissolve after achieving abolition proves only that my diagnosis was correct: the will to organizational power had already consumed it.  

  Very well. Press your next point.
