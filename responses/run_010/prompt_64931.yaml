prompt: |-
  I write literary-ish historical fiction — this is the third book set on an invented Bronze Age-ish coastline, but the first two leaned on real archaeology and I got burned in both directions. Once a specialist reader tore into a scene because I'd built a whole organised priesthood out of a couple of figurines, and another time I got dinged for the opposite thing: objects that were pure set dressing, with no social weight behind them, in a book that's supposedly about a world where every object cost somebody a season of labour. So I've accepted that I need an actual procedure, not vibes.

  Here's the situation. I keep a file of objects — some real finds I've read about popularly, some invented — and every time I want one to do work in a scene I need to know what it licenses. Write me that procedure: an ordered set of questions to run on an object, where each question either lets me go further or stops me cold. The main thing I need it to do is keep three kinds of claim apart, because I collapse them constantly:

  - this thing exists → somebody could make it (skills, raw materials, tools, time, who's allowed to spend that time)
  - this thing means something → belief, taboo, the sacred, the dead, cosmology
  - this thing shows an institution → measures, records, storage, officials, tax, a guild, a priesthood, a state that can move grain

  Bake in the stuff I always get wrong:

  - how the object got into the ground — lost, thrown out, hoarded, deliberately broken, buried with somebody, dropped in a burn layer — and what each of those routes does and doesn't let me infer about the people.
  - wear. Intended use versus what it actually got used for over forty years, and how much of either a character standing in the room could know.
  - the fact that a lot of different pasts can leave the same pile of stuff. I want the procedure to force me to write at least two rival explanations for anything I build a scene on, and then to tell me which of them my characters could not possibly distinguish between from the inside.
  - the "if you can't explain it, call it ritual" reflex. Give me a hard stop for that, and tell me what positive grounds would actually be enough for a character to treat something as sacred rather than just me wanting them to.
  - silence. When nothing like the object has ever turned up anywhere, when is that a genuine constraint on what I can write and when is it just a hole in the sample? I want a test, not a shrug.
  - standardization. When does a batch of similar objects justify me writing rules, officials or measures, and when is it only habit and copy-and-drift?

  It has to be fast. I'm running this maybe twenty times a week mid-draft, no library, no time — ten minutes on a difficult object, and most objects should sort in two. Write it for someone who's read a lot of archaeology at the popular level but can't do stats and can't read a strat report. My editor doesn't touch this material and my one specialist reader only sees a second draft, so whatever comes out of the procedure has to be something I can check myself on the first pass without phoning anybody. No bibliography, no reading list, no citations — I'm not chasing sources. If there's a proper name for a concept you're using, drop the name once and move on.

  Then run it on three cases so I can see it actually bite:

  1. A small bronze figure, sex unclear, no attributes, no context, picked up loose in ploughsoil, nobody knows where it came from. I want a temple in this book and a hereditary priesthood. Tell me what this object will carry and what it flatly won't.
  2. One room in a burned building with several hundred clay lumps that were pressed over jar mouths and tied with string, a lot of them bearing the same two or three marks. I want a redistribution economy and a man who is almost but not quite a scribe.
  3. Two hundred-odd loom weights from an ordinary house, all within a couple of grams of each other. I want whatever it can bear, which I suspect is less than I want.

  For each one show the questions being answered, not just the verdict, and be blunt where the procedure is going to disapoint me — better I hear it from you than from a reviewer. Mark clearly which steps aren't matters of fact at all but calls only I can make: what kind of book this is, how much I'm willing to let a reader be unable to check anything, how much invention I'll own in the author's note versus how much I'll let pass as scenery. And finish with what the whole procedure can't do — where it'll hand me a confident green light that's still wrong — plus whatever habit or double-check I should build in to catch those.
reasoning: |-
  Okay, let me tackle this complex request. The user writes literary historical fiction set in a Bronze Age-inspired world and needs a practical procedure to evaluate objects in their scenes. They've faced criticism for both over-interpreting and under-interpreting archaeological evidence, so they want a systematic way to assess what an object can realistically support in three key areas: existence, meaning, and institutional significance.

  Hmm, the user has very specific pain points: distinguishing between different types of claims about objects, handling archaeological ambiguity, avoiding the "it's ritual" cop-out, and dealing with standardization. They need something fast and self-contained - no research required mid-draft. The examples they provided (bronze figure, clay lumps, loom weights) are excellent test cases.

  I'm considering designing a four-step procedure that forces disciplined thinking. Step 1 would establish physical reality - can this exist? Step 2 would examine social context - what does it imply about people? Step 3 would focus on institutional weight - what structures does it suggest? Step 4 would be about narrative integration - how to handle ambiguity in the story. Each step needs clear pass/fail criteria.

  For their specific errors, I'll build in safeguards: mandatory rival explanations for any significant object, a strict test for labeling something "ritual," and clear rules for when absence of evidence matters. The standardization issue needs particular care - similarity doesn't automatically imply bureaucracy.

  The examples will show how this works in practice. That bronze figure? It can support existence but not a priesthood. Those clay lumps could show early administration but not full literacy. Those loom weights? Probably just consistent craftsmanship. I'll be brutally honest where their desires exceed what the evidence can bear.

  Important to emphasize that some decisions are inherently narrative choices - how much ambiguity to preserve, how to frame authorial invention. The procedure's limits need stating too: it can't replace specialist knowledge, and it might miss subtle anachronisms. Maybe suggest they occasionally spot-check against known archaeological timelines.

  This feels like building mental scaffolding - rigid enough to prevent collapse, flexible enough for creative work. The challenge is making it both thorough and fast. Ten minutes per object means every question must earn its place. No fluff, no tangents. Just the archaeological bare bones.
answer: |-
  Here's a bulletproof procedure designed for speed and rigor. Run it in order – if you hit a **STOP**, you cannot make the claim without violating core archaeological reasoning. **Bold** are your core claim checks. *Italics* mark narrative/authorial decisions.

  **The Object Interrogation Procedure (10 Min Max)**

  1.  **PHYSICAL REALITY CHECK (Existence & Manufacture):**
      *   **Materials:** What raw materials? Are they locally available? If not, how far? (STOP if exotic material impossible to access via known trade/sourcing for your setting/time).
      *   **Tech/Skill:** What specific skills/tools are required? (e.g., lost-wax casting, kiln firing, complex weaving). Does this imply a specialist? (STOP if tech demonstrably centuries away in the region).
      *   **Labor/Time:** Rough estimate: hours? Days? Seasons? Who does this labor imply? (Commoner, part-time specialist, full-time specialist, slave?).
      *   **Wear & Tear (Visible Now):** Is there observable damage, repair, polish, residue? What does this *directly* suggest about use? (STOP if claimed use contradicts observable wear).
      *   **Wear & Tear (Potential):** Could it have been used differently earlier in its life? What wouldn't leave a trace? (Acknowledge uncertainty).

  2.  **SOCIAL CONTEXT CHECK (Meaning & Mundanity):**
      *   **Find Context (The Ground Truth):** How/where was it found? (Hoard, grave, midden, floor, destruction layer, loose). *What does this context *directly* imply?* (STOP: Grave goods imply association with burial rites, NOT necessarily daily sacredness. Midden implies discard, NOT necessarily lack of value).
      *   **Abstraction Barrier:** Is the object abstracted from direct function? (e.g., figure vs. tool, standard weight vs. random stone). Higher abstraction *allows* for symbolic meaning, doesn't *prove* it.
      *   **The "Ritual" STOP:** **CANNOT claim "sacred," "ritual," or "cosmological meaning" UNLESS one of these is true:**
          *   Found exclusively/in concentration in contexts *strongly* associated with known ritual practice (temples, specific grave types, votive deposits).
          *   Depicts known deities/mythic scenes *for that culture*.
          *   Has inscriptions/formulae *explicitly* referencing gods/cosmos.
          *   Is part of a *pattern* of objects found *only* in such contexts. (Otherwise, it's just an object – maybe valuable, maybe meaningful to an individual, maybe decorative).
      *   **Character Knowledge:** What could a character *realistically deduce* just by looking at/using this object *now*? Can they see wear? Know its origin? Recognize symbolism? (STOP: Character cannot know object's future archaeological context or undiscovered parallels).

  3.  **INSTITUTIONAL WEIGHT CHECK (Organization & Standardization):**
      *   **Standardization:** Are multiple examples highly similar? (Measure, shape, decoration). **Similarity DOES NOT equal standardization for control. Ask:**
          *   *Could this similarity arise purely from shared technique/tradition/copying?* (Likely).
          *   *Does it require a template, mold, or precise measure to achieve?* (More suggestive).
          *   *Is there evidence of *enforcement* of the standard?* (e.g., rejected pieces, marks of inspection, association with penalties). (STOP: Similarity alone ≠ state control, guilds, or enforced standards).
      *   **Information Handling:** Does the object store, transmit, or record information? (Marks, writing, tallies). **Presence of marks ≠ writing or bureaucracy. Ask:**
          *   *Are marks unique identifiers (owner marks)?* (Minimal institution).
          *   *Are marks recurring & applied systematically?* (Suggests categories/classification).
          *   *Is there evidence marks were *used* in a system?* (e.g., matching marks on sealed items and records, spatial organization by mark). (STOP: Marks alone ≠ literacy, scribes, or complex accounting).
      *   **Scale & Concentration:** Does the object imply coordination beyond the household? (e.g., large storage facilities, specialized workshops producing volume, mass-produced items requiring distribution). (STOP: Single household production/use ≠ institutional economy).

  4.  **NARRATIVE INTEGRATION & AMBIGUITY (Your Call):**
      *   **Mandatory Rival Explanations:** For ANY significant claim (meaning, institution) based *primarily* on this object, generate at least 2 plausible, *archaeologically consistent* explanations. (e.g., "Priesthood symbol" vs. "Ancestor figure" vs. "Wealthy child's toy").
      *   **Character Blindness:** Identify which rival explanations your characters *could not distinguish between* based solely on this object and their knowledge.
      *   **Absence of Evidence Test:** If no parallel exists, ask: *Is this object/material/tech fundamentally incompatible with the *established core* of your setting's material culture?* (STOP if yes). *Is its absence likely due to preservation bias (organic materials, specific soil conditions)?* (Green light if plausible). *Is it a unique innovation?* (Requires strong justification in labor/skill/materials from Step 1).
      *   ***Authorial Stance:* How will you frame this?**
          *   *Scenery:* No explanation needed. Just present it.
          *   *Character Interpretation:* Show a character *believing* one meaning/institution (acknowledge potential for error).
          *   *Narrative Assertion:* You, the author, state it as fact. **Requires passing ALL relevant STOPS and having strong justification from the procedure.** Own this in the Author's Note as informed speculation.
          *   *Ambiguity Preserved:* Present rival possibilities through character debate or narrative framing.

  **Procedure Limitations (Where it Might Lie to You):**

  1.  **The "Unknown Unknown":** It can't flag an anachronism or impossibility you (and popular sources) aren't aware of. A specialist might still spot something.
  2.  **Subtle Tech/Skill Misjudgment:** You might underestimate the complexity or labor involved in Step 1, making something seem easier/harder than it was.
  3.  **Cultural Specificity Blind Spot:** Popular sources often generalize. The procedure relies on your knowledge base; it can't compensate for gaps in understanding *specific* cultural practices or symbol sets.
  4.  **The "Plausible Trap":** It prioritizes archaeological plausibility, but plausibility isn't truth. You might build a perfectly plausible, internally consistent world based on interpretations later proven wrong.
  5.  **Over-reliance on the Object:** It focuses on the object, but meaning/institutions are systems. The procedure might green-light one piece, but the whole system might still be shaky.

  **Double-Check Habit:** Once a week, pick ONE object you've processed and run a quick "Known Parallel Check." Briefly scan a *reliable* general source (e.g., a reputable museum collection online, a well-regarded intro textbook chapter) for actual Bronze Age objects/materials from a *comparable* region/period. Does your object wildly stand out? Tweak if needed.

  ---

  **Case Studies:**

  **1. Small Bronze Figure (Loose Find, Ploughsoil)**

  *   **1. Physical Reality:** Pass. Bronze exists, lost-wax casting possible. Specialist labor implied (days/weeks). Wear? Unknown (plough damage). Character sees a worn bronze figure, maybe guesses material & rough age.
  *   **2. Social Context:** **STOP - "Ritual" Claim.** Found loose = zero context. No attributes. No known parallels in sacred contexts *from its specific origin point*. Cannot support "sacred," "priesthood," or "temple" based on *this object*. At best, a character *might* speculate wildly. Rival Explanations: Ancestor figure, deity figure, toy, amulet, trade good, weight. Characters couldn't distinguish between any.
  *   **3. Institutional Weight:** Irrelevant. Single figure implies nothing institutional.
  *   **4. Narrative/Ambiguity:** *Scenery:* Fine. *Character Interpretation:* A character can *believe* it's sacred. *Narrative Assertion (Priesthood/Temple):* **STOPPED - Cannot justify.** *Absence of Evidence:* Not a fundamental incompatibility; figurines exist. But loose find provides no constraint *or* support.
  *   **Verdict:** This object carries **ZERO** weight for your desired temple/priesthood. It's a curious find. Building a priesthood requires other evidence (structures, texts, specialized ritual objects *in context*).

  **2. Clay Lumps (Sealings) in Burned Building Room**

  *   **1. Physical Reality:** Pass. Clay local. Simple impression/tying. Low-moderate skill (consistency matters). Labor per sealing low, but volume implies significant total effort (accounting time?).
  *   **2. Social Context:** Find Context: Burned building room (destruction layer) - implies storage/administration point. Not inherently sacred. "Ritual" STOP: No sacred context/attributes. Mundane administrative function likely.
  *   **3. Institutional Weight:**
      *   *Standardization:* Recurring marks imply classification/categories. Mold-made? Probably not. Requires consistent marking (stamp? stylus?) - suggests intentional system, not just drift. **Passes plausibility for basic system.**
      *   *Information Handling:* Marks are recurring identifiers. Concentration implies central point of control (sealing *and* storage). Association with jars suggests tracking goods. **Strongly suggests administrative function, redistribution plausible.** STOP: Marks ≠ full literacy. "Scribe" implies writing; this is sealing/clerk level. "Redistribution economy" passes.
      *   *Scale:* Hundreds imply significant volume of goods tracked.
  *   **4. Narrative/Ambiguity:** *Character Interpretation:* Easy to show clerks using them. *Narrative Assertion:* Redistribution system: **Green Light.** Near-scribe administrator: **Green Light (emphasize sealing/clerk role, avoid "reads/writes complex texts")**. Rival Explanations: 1) Central grain tax/storage. 2) Merchant warehouse records. 3) Temple offerings inventory. Characters might not distinguish between state/merchant/temple control if the building's ownership is unclear. *Absence of Evidence:* Common in Near East; plausible invention if no direct parallels in your coast. Own as plausible speculation.
  *   **Verdict:** Excellent support for redistribution and your administrator/clerk. Shows institution. Deny him full "scribe" status unless you add writing elsewhere.

  **3. Loom Weights (200+, Standardized Weight, Ordinary House)**

  *   **1. Physical Reality:** Pass. Clay/stone local. Simple shapes. Skill: Consistency requires care, perhaps simple balance. Labor per weight low, total volume moderate. Wear: Expect wear on suspension holes. Character sees consistent weights, maybe notes wear.
  *   **2. Social Context:** Find Context: Ordinary house. Implies household textile production. Scale suggests significant output (beyond subsistence?). Not sacred.
  *   **3. Institutional Weight:**
      *   *Standardization:* High similarity (+/- few grams). **Ask: Could this be habit/copying? VERY LIKELY.** Weaving requires consistent tension; skilled weavers achieve this through consistent practice and weights. Does it *require* enforced standard? **Unlikely.** No evidence of templates/rejects/inspection. STOP: Does **NOT** justify rules, officials, guilds, or state measures. Implies skilled, practiced weavers in that household aiming for quality. "Habit and care" suffices.
      *   *Information/Scale:* No information handling. Scale is large *for a household*, but not inherently institutional (could be a large family/clan unit, or production for local trade).
  *   **4. Narrative/Ambiguity:** *Scenery:* Fine. *Character Interpretation:* Shows the household takes weaving seriously/produces good cloth. *Narrative Assertion:* Guilds/officials/state control: **STOPPED - Cannot justify.** Rival Explanations: 1) Highly skilled household production. 2) Workshop within household. Characters know they make good cloth; they wouldn't think "guild" unless guilds already exist elsewhere. *Absence of Evidence:* Common find; standardization known. Constraint: Cannot support *institutional* control.
  *   **Verdict:** Shows **household skill and scale,** possibly surplus production. Does **NOT** show institutions, guilds, or state involvement. Use it for texture and to show domestic economy strength, not bureaucracy.

  **Final Authorial Note Guidance:** Be transparent. Use phrases like:
  *   "Inspired by finds from [Region/Period] but adapted for the narrative."
  *   "While [specific institution, e.g., sealing system] has parallels, its precise form here is speculative."
  *   "Objects like [bronze figure] are known, but their exact significance in this culture is imagined."
  *   "Domestic production details (e.g., loom weights) are based on general Bronze Age practices."
  *   **Crucially:** "Archaeological interpretations are multiple; the choices made serve the story and its themes." This owns the invention without overclaiming.
