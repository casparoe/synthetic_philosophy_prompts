prompt: |-
  I'm the science lead on a small mission-review panel. Roughly twice a year an instrument team or a lab comes to us with something in the "we think we found life" family, and we have to decide whether what they're reporting actually counts as evidence of it. The panel is geochemists and engineers, nobody who's read a page of philosophy since undergrad, and the last three times we went around in circles for a full day and then split the vote on vibes. Our funder's rulebook only has two boxes — detected, not detected — and half the panel thinks that's a joke, so I'd like the procedure to let us report something graded when the evidence is graded, without turning into a numbers theater exercise.

  So: write us a decision procedure we can actually run on a claim, grounded in whatever the conceptual work on defining life really has to say — that old NASA working definition of life as a self-sustaining chemical system capable of Darwinian evolution and the standard complaints about it, the metabolism-first vs replicator-first disagreement, and the usual mess of borderline cases (viruses, prions, dormant spores, mules, flames, crystals, that sort of thing) — but translated into an ordered list of questions a non-specialist can answer about a specific claim. For each question tell me what counts as a good enough answer, what a yes or a no does to the case, and, crucially, flag the ones where the question isn't factual at all but a decision about what we want the word to mean; those are the ones we should escalate to a vote instead of arguing about for six hours. Constraints: one 90-minute meeting per claim, so if it can't be run in about an hour it's useless to us, and whatever it outputs goes into a press release, so a false positive is a lot worse than a shrug. Also be honest about where the procedure will misfire and what it flatly cannot settle.

  Then run it on three claims sitting on my desk right now:

  1. A plume sample from an icy moon. Mass spec shows a 4% excess of one amino-acid handedness over the other, plus a polymer made of repeating units that don't match anything in our contamination catalog. Imager: nothing that looks like a cell. Team says life, and says the chirality number settles it.
  2. A lab report on a flow reactor running a set of mutually catalyzing reactions. It's been self-sustaining for about 400 days, it recovers when perturbed, and its composition drifts over time — but nobody has ever seen it produce a catalyst that wasn't already in the network. The authors want to call it protocellular life; their reviewers say it's chemistry in a fancy box.
  3. An Earth claim about a newly described infectious protein particle that templates its own folded shape onto normal copies of the protein. No nucleic acid, no metabolism of its own, no lineage you could put a mutation in. One of our members is convinced this is the case the whole debate has been hiding from.

  Give me the procedure first, then a worked pass on each of the three, including the graded output for each, and make sure at least one of the three comes out with an answer that's going to annoy half my panel. Where the procedure punts to a vote, say so plainly and tell me what the vote is actually about.
reasoning: |-
  We are designing a decision procedure for the panel to evaluate claims of life detection. The procedure must be grounded in the conceptual work on defining life, including the NASA definition and its critiques, and must account for borderline cases. The output should be graded rather than binary, but must fit into the funder's "detected" or "not detected" boxes. We'll structure it as an ordered list of questions that non-specialists can answer. Each question will have:

  - What counts as a good enough answer (criteria for yes/no/maybe)
  - What a "yes" or "no" does to the case (how it moves the evidence grade)
  - Flag which questions are non-factual (requiring a vote on definitions)

  The procedure should be runnable in about an hour per claim. We must avoid false positives and be honest about misfires.

  Key elements from the philosophy of life:

  1. **NASA definition**: "a self-sustaining chemical system capable of Darwinian evolution"
     - Critiques: Too Earth-centric? What about non-chemical life? What about systems that are self-sustaining but not evolving? Or evolving but not self-sustaining?

  2. **Metabolism-first vs. replication-first**: Some theories emphasize the ability to maintain a boundary and process energy (metabolism) as primary, while others emphasize hereditary information and evolution.

  3. **Borderline cases**: 
     - Viruses: Replicate and evolve but depend on host metabolism.
     - Prions: Infectious proteins that template their own shape but no independent replication or metabolism.
     - Dormant spores: Alive but not active.
     - Mules: Alive but cannot reproduce.
     - Flames: Self-sustaining chemical reactions but no evolution.
     - Crystals: Grow and have a kind of replication but no evolution.

  We need a procedure that breaks down the concept of life into testable aspects, and then aggregates the results in a way that avoids binary thinking but still gives a clear output for the press release.

  **Proposed Decision Procedure:**

  We break the evaluation into three main aspects, each with a set of questions. For each claim, we will assign a score (0, 1, or 2) for each aspect, and then combine the scores to produce an overall grade. The aspects are:

  1. **Metabolic Activity**: Evidence of energy processing, self-maintenance, and resilience.
  2. **Heredity and Evolution**: Evidence of replication, inheritance, and adaptive evolution.
  3. **Distinctiveness from Non-life**: Evidence that the system is not just a known non-living process (e.g., a crystal, flame, or simple chemical reaction).

  Additionally, we include a fourth aspect that captures the "vibes" or holistic impression, but we make it explicit and limited:

  4. **Holistic Assessment**: Does the system, as a whole, strike the panel as being alive? (This is the subjective part that we vote on.)

  However, to avoid turning the entire procedure into a vote, we only use the vote for the borderline cases that the first three aspects leave ambiguous.

  **The Questions:**

  We have 10 questions in total, organized by aspect. Each question is designed to be answerable by non-specialists with the data provided. We assign points for each "yes" answer, but note that some questions are critical and a "no" might be a deal-breaker.

  **Aspect 1: Metabolic Activity (Max 3 points)**
     - Q1: Does the system maintain a boundary (spatial or functional) that separates it from the environment? (Yes=1, No=0)
     - Q2: Does the system exhibit self-sustaining chemical reactions (i.e., processes that acquire and use energy to maintain its state)? (Yes=1, No=0)
     - Q3: Is the system resilient to perturbations (i.e., can it recover from changes in the environment)? (Yes=1, No=0)

  **Aspect 2: Heredity and Evolution (Max 4 points)**
     - Q4: Does the system replicate or produce copies of itself? (Yes=1, No=0)
     - Q5: Are the copies heritable (i.e., do they resemble the parent system in key features)? (Yes=1, No=0)
     - Q6: Is there evidence of variation among copies? (Yes=1, No=0)
     - Q7: Is there evidence of differential survival or persistence based on that variation (i.e., natural selection)? (Yes=1, No=0)

  **Aspect 3: Distinctiveness from Non-life (Max 3 points)**
     - Q8: Does the system show complexity that is not explained by simple physical or chemical processes (e.g., crystals, flames, or known non-living reactions)? (Yes=1, No=0)
     - Q9: Is the system made of organic molecules (or in a non-Earth context, molecules that are plausible for life)? (Yes=1, No=0) [Note: This is a soft criterion because non-organic life is conceivable, but in practice we look for organic chemistry.]
     - Q10: Is there evidence of information storage and processing (e.g., a genetic code, or a way to pass on instructions)? (Yes=1, No=0)

  **Holistic Assessment (Vote if needed)**
     - If the total score from the above 10 questions is in a borderline range (we'll set the borderline as 4-6 out of 10), then we have a vote on: "Given the evidence, do you think this system should be considered alive?" (Yes/No). The vote result (majority) will break the tie.

  **Scoring and Graded Output:**

  - Total points = Aspect1 + Aspect2 + Aspect3 (max 10)
  - Graded output:
     - 0-3: Not detected (strong negative)
     - 4-6: Borderline (requires vote for holistic assessment; if vote passes, then "detected with low confidence"; if fails, "not detected")
     - 7-10: Detected (with the score indicating confidence: 7-8 medium, 9-10 high)

  However, note that the funder requires "detected" or "not detected". So we map:
     - "Not detected" for scores 0-3 and for borderline (4-6) if the vote fails.
     - "Detected" for scores 7-10 and for borderline (4-6) if the vote passes.

  But we can add a graded note in the report: 
     - For "detected": high confidence (9-10), medium confidence (7-8), low confidence (4-6 with vote pass)
     - For "not detected": low confidence (4-6 with vote fail), medium confidence (2-3), high confidence (0-1)

  **Flagging Non-Factual Questions:**

  The procedure is designed so that most questions are factual. However, the following might require interpretation and could be contentious:

  - Q8 (complexity not explained by non-life) and Q10 (information storage) might sometimes be interpretive. We can note that if the panel disagrees on the answer to a specific question, they can vote on that question. But we want to avoid that. Alternatively, we can mark Q8 and Q10 as requiring a vote if there is disagreement.

  But to streamline, we note:

  - The entire Aspect 3 (Distinctiveness) is more interpretive and might require discussion. Also, the holistic vote at the end is explicitly a vote.

  **Time Constraints:**

  We have 10 questions. If we allow 5 minutes per question (including discussion), that's 50 minutes, plus 10 minutes for the holistic vote if needed, and 10 minutes for scoring and wrap-up. Total about 70-80 minutes.

  **Honesty about Misfires:**

  The procedure will misfire in the following cases:

  1. **Borderline cases**: Systems that are on the edge (like viruses, prions, etc.) will likely fall in the 4-6 range and require a vote. The outcome will depend on the panel's definition of life, which is not universal.

  2. **Novel forms of life**: If life exists that doesn't fit our criteria (e.g., non-organic, or without replication), the procedure might miss it.

  3. **False negatives**: Systems that are alive but don't show the required evidence (e.g., dormant spores might not show metabolic activity at the time of sampling).

  4. **False positives**: Systems that mimic life (e.g., complex non-living systems that score high by chance) might be flagged as detected.

  5. **Cannot settle**: The procedure cannot settle cases where there is insufficient data to answer the questions. We assume the claim comes with enough data to answer the questions. If not, we must note that the evidence is insufficient.

