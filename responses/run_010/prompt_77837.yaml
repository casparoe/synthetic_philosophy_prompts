answer: |-
  Below is a decision procedure for your panel, designed to evaluate "we found life" claims systematically. It distills key concepts from the philosophy of life (including the NASA definition, its critiques, and borderline cases) into a practical checklist. The procedure is optimized for your constraints:  
  - **Time**: 10–12 questions, answerable in ≤60 minutes by non-specialists.  
  - **Output**: Graded confidence (to avoid binary "vibes" splits) while fitting the funder's "detected/not detected" requirement.  
  - **False positives**: Prioritized over false negatives; ambiguous cases default to "not detected" unless vote overrides.  
  - **Transparency**: Flags conceptual (non-factual) questions for voting and identifies weaknesses.  

  The procedure has three phases:  
  1. **Evidence triage** (Questions 1–6): Factual filters to eliminate weak claims fast.  
  2. **Core life criteria** (Questions 7–10): Assesses NASA definition components and common critiques.  
  3. **Borderline resolution** (Question 11): Holistic vote for ambiguous cases.  

  ---

  ### **Decision Procedure: Life Detection Evaluation**  
  **Instructions**: Answer sequentially. Stop early if claim fails triage (Q1–Q6). Use evidence from the claim only.  
  **Scoring**: Each "yes" adds points; "no" stops progression. Total score maps to confidence tiers.  
  **Output**: "Detected" only if score ≥8 *or* vote passes in borderline cases (score 5–7).  

  #### **Phase 1: Evidence Triage**  
  *Factual filters to catch non-starters. Answer "no" here fails the claim (not life).*  
  1. **Contamination ruled out?**  
     - *Good enough*: Rigorous controls (e.g., blank samples, sterilization, environmental baselines).  
     - *Yes*: +0 (lets claim proceed). *No*: Claim invalid (stop; "not detected").  
     - *Why*: Rules out lab/field artifacts (e.g., earthly amino acids in space samples).  

  2. **Non-equilibrium process observed?**  
     - *Good enough*: System maintains energy gradients (e.g., chemical disequilibrium, temperature differentials).  
     - *Yes*: +0 (proceed). *No*: Claim fails (stop; "not detected").  
     - *Why*: Life requires energy flow; equilibrium systems (e.g., crystals) are non-living.  

  3. **Organic complexity detected?**  
     - *Good enough*: Molecules >500 Da, polymers, or heterogeneous reactions beyond simple catalysts.  
     - *Yes*: +1 point. *No*: Claim fails (stop; "not detected").  
     - *Why*: Life is chemical; complexity (e.g., polymers) is necessary but not sufficient.  

  4. **System persists/renews under perturbation?**  
     - *Good enough*: Recovery after stress (e.g., temperature shift, nutrient loss) without full human intervention.  
     - *Yes*: +1 point. *No*: Claim fails (stop; "not detected").  
     - *Why*: Self-sustenance (NASA criterion) excludes one-off reactions.  

  5. **Signature of biological patterning?**  
     - *Good enough*: Spatial/chemical order (e.g., cellular structures, reaction networks, chirality).  
     - *Yes*: +1 point. *No*: Claim fails (stop; "not detected").  
     - *Why*: Life is organized; randomness suggests abiotic processes.  

  6. **Reproduction or copying observed?**  
     - *Good enough*: New "units" form with similarity to parent (e.g., division, templating, network growth).  
     - *Yes*: +1 point. *No*: Claim fails (stop; "not detected").  
     - *Why*: Replication is non-negotiable for Darwinian evolution (NASA criterion).  

  #### **Phase 2: Core Life Criteria**  
  *Evaluates NASA definition and borderline cases. "No" deducts points but doesn't auto-fail.*  
  7. **Metabolism-independent replication?**  
     - *Good enough*: Replication occurs without host machinery (e.g., not viruses/prions).  
     - *Yes*: +2 points. *No*: +0.  
     - *Why*: Tests replicator-first vs. metabolism-first debate. "No" doesn't kill the claim (e.g., viruses are borderline).  

  8. **Heritable variation observed?**  
     - *Good enough*: Copies show inheritable changes (e.g., mutation, drift, selection).  
     - *Yes*: +2 points. *No*: +0.  
     - *Why*: Required for Darwinian evolution (NASA criterion). Absence suggests simple autocatalysis.  

  9. **Evolutionary adaptation demonstrated?**  
     - *Good enough*: System improves function/survival in new conditions (e.g., fitness gain in stress test).  
     - *Yes*: +2 points. *No*: +0.  
     - *Why*: Life evolves; static systems (e.g., flames) are non-living.  

  10. **Distinct from known abiotic mimics?**  
      - *Good enough*: Rules out crystals, flames, oscillating reactions, etc., via complexity or context.  
      - *Yes*: +2 points. *No*: –1 point.  
      - *Why*: Avoids false positives. "No" penalizes but doesn't fail (e.g., protocells resemble chemistry).  

  #### **Phase 3: Borderline Resolution**  
  *Conceptual vote for ambiguous cases.*  
  11. **Holistic "life" vote** (if score 5–7):  
      - *Trigger*: Only if Phase 2 score is 5–7 (borderline).  
      - *Question for vote*: "Does the system achieve open-ended evolution?"  
      - *What the vote is about*: Whether evolution (not just replication) defines life. Escalate here if panel deadlocks on semantics.  
      - *Majority "yes"*: +2 points (pushing to "detected, low confidence"). *No*: +0.  

  #### **Scoring & Output**  
  - **Total points** = Sum from Q3–11 (max 11; min 0 after triage).  
  - **Graded output**:  
    - 0–4: **Not detected** (high confidence).  
    - 5–7: **Borderline** → Requires Q11 vote.  
      - Vote passes: **Detected** (low confidence).  
      - Vote fails: **Not detected** (low confidence).  
    - 8–11: **Detected** (confidence: 8–9 medium, 10–11 high).  

  #### **When the Procedure Misfires**  
  - **False negatives**: Dormant life (e.g., spores) fails Q4/Q6; novel life without replication fails Q6.  
  - **False positives**: Complex abiotic systems (e.g., fire mosaics) might score 5–7 and pass by vote.  
  - **Cannot settle**: Insufficient data (e.g., no perturbation tests), subjective votes (Q11), or cases where life/non-life is semantic (e.g., prions).  
  - **Weaknesses**: Overweights replication (risks missing metabolism-first life); struggles with "partial" life (viruses).  

