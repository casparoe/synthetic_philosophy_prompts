  ### **Final Recommendations**  
  - **Run this procedure as-written**: It covers NASA definition, borderline cases, and forces conceptual votes only when essential (Q11).  
  - **Time-saving**: Focuses on triage (Q1–Q6) to kill weak claims fast. Average claim finishes in 45–60 mins.  
  - **Press-release ready**: "Detected" only with high confidence (score ≥8) or voted borderline (score 5–7 + vote).  
  - **Carry forward**: For voted cases, document the semantic dispute (e.g., "panel voted on evolution as key criterion").  

  This procedure delivers graded rigor without numbers theater—grounded in philosophy but operable by scientists.
