prompt: |-
  In three weeks I present a paper at a closed two-day workshop on the nature of normativity. There will be about fifteen participants: roughly half work in the fittingness-first tradition in value theory and treat fittingness as the sole normative primitive; three defend a reasons-first, broadly Scanlonian picture on which reasons are unanalyzable and everything else is explained in terms of them; two work on the ethics of belief and on doxastic voluntarism; one is an accuracy-first formal epistemologist; and the most senior person in the room has a standing reputation for arguing that disputes of this kind turn out to be verbal. Nobody in the room works on philosophy of action or on the structure of practical reasoning, which matters a great deal, because my argument is conducted entirely in that vocabulary and will be heard as psychologism.

  The thesis. I defend an account of the wrong kind of reasons problem — the familiar demon scenario, in which a powerful being threatens you with punishment unless you admire him, and the threat appears to be a reason to admire him of exactly the sort that ought not to count — which I call the eligibility account. It has three parts.

  1. A consideration is a reason of the right kind for an attitude only if it is eligible to serve as a premise in the first-personal deliberation that settles the question the attitude answers.
  2. Wrong-kind considerations are genuine normative reasons, but reasons for something else: they bear on the practical question of what to do about one's attitude — whether to cultivate it, retain it, or bring it about — and they are misfiled when we report them as reasons to have it.
  3. It follows that right-kind and wrong-kind considerations never enter a single weighing. The problem is therefore not solved but dissolved: it presupposed a comparison that never arises.

  I concede in the paper what the load-bearing wall is. Part (1) is meant to explain what makes a reason right-kind in terms of deliberative eligibility rather than in terms of fittingness, so eligibility cannot be defined by appeal to fittingness without circularity. I also hold that eligibility is capacity-relative but not exercise-relative — it concerns what the agent's deliberative capacities could take up, not what she happens to be attending to — and that which question an attitude answers is fixed by the attitude's type rather than by the agent's preferences.

  The Q&A will run twenty minutes. Please prepare a prep sheet, not a defense of the view:

  - The eight to ten objections this particular room will actually raise — not the ones an action-theory audience or an informal rationality forum would raise — ordered by how much damage each would do if I answered it badly.
  - Each objection stated in the first-person voice and idiom of the kind of person who will raise it; identify that person (fittingness-first value theorist, reasons-first Scanlonian, voluntarist, accuracy-first epistemologist, the senior deflationist) and use the technical vocabulary they would use rather than mine.
  - For each, a reply deliverable in under two minutes, an explicit note on where that reply is softest, and whether anything should be conceded rather than defended.
  - Flag separately any objection on which my natural reply risks collapsing the eligibility account back into the fittingness-first view, so that I know where I am trading the paper's distinctiveness for safety.
  - The two or three concessions that, made in the opening minutes, would defuse the most fire; and the single reply that has to land for the paper to survive the room at all.
  - The question I am hoping nobody asks: the one for which I have no good answer, put as bluntly as the most senior person present would put it, together with my least-bad response and a candid estimate of what it costs me if it comes.

  Please do not supply a bibliography, reading list, or citations; I know the literature and want the dialectic, not the sourcing.
reasoning: |-
  Okay, the user is presenting a paper on the wrong kind of reasons problem at a workshop. They need a prep sheet for Q&A with specific objections from different philosophical perspectives. Let me start by understanding their account—the eligibility account. The key points are: reasons must be eligible for first-person deliberation, wrong-kind reasons are misfiled, and no weighing between right and wrong kinds.

  First, I need to consider the audience. There are fittingness-first theorists, Scanlonians, voluntarists, an accuracy-first epistemologist, and a senior deflationist. Each group will have different concerns. The fittingness-first folks might see eligibility as just fittingness in disguise. Scanlonians could question why reasons aren't primary. Voluntarists might challenge the exclusion of voluntary control. The accuracy-first person might worry about doxastic attitudes. The deflationist will call it verbal.

  For objections, prioritizing damage is crucial. The deflationist's objection could undermine the whole discussion, so that's high damage. If they say it's all verbal, the reply needs to show substantive implications. Then, the fittingness-first theorist accusing circularity—this risks collapsing the account into theirs. The reply must distinguish eligibility as structural, not substantive.

  Voluntarists might argue that their view allows deliberation on attitudes, contradicting part 2. The response should clarify that practical deliberation is about managing attitudes, not forming them directly. Concede that cultivation takes time but maintain the distinction.

  The Scanlonian might say reasons are primitive and reject the eligibility constraint. The reply needs to position eligibility as a structural feature of reasons, not a reduction. Highlighting the practical/motivational distinction could help.

  The accuracy-first objection about doxastic voluntarism is tricky. If they argue that truth is the only right-kind reason, the reply must allow other reasons but still tie them to truth. Concede that accuracy norms are fundamental but argue that other considerations can be eligible if they connect to truth.

  Concessions upfront: admitting that eligibility doesn't solve all problems and that it's capacity-relative can preempt some attacks. The crucial reply is distinguishing right-kind reasons via eligibility without invoking fittingness. If this fails, the paper's core is at risk.

  The worst question might be about non-deliberative agents. If agents can't deliberate, do they have reasons? The reply that eligibility is about capacities, not exercise, might not satisfy. This could cost the universality of the account, so highlighting that capacities define the space of reasons is necessary, but it's a soft spot.

  Need to ensure each objection is in the objector's voice, using their terms. Avoid jargon from action theory since the audience isn't familiar. Focus on their frameworks to make the prep sheet effective.
answer: |-
  Here is your prep sheet, structured for maximum tactical utility in this specific room. Objections are ordered by potential damage (high to medium), with speaker identification and tailored replies. Soft spots and concessions are flagged.

  ---

  ### **Top-Tier Damage Control: The Must-Land Reply**  
  **Your paper survives only if you establish this:**  
  *Eligibility is not a disguised appeal to fittingness. It is a structural constraint on how reasons function in deliberation, derived from the attitude’s constitutive question (e.g., admiration answers "What is admirable?"). Fittingness is a property of attitudes; eligibility is a property of premises. Collapse avoided.*  

  ### **Strategic Concessions to Defuse Fire Early**  
  1. **"Eligibility doesn’t resolve all WKR problems** (e.g., "boring" objections or pragmatic encroachment). It targets the demon case specifically."  
  2. **"Eligibility is capacity-relative but not infallible.** Agents can mistake ineligible premises for eligible ones."  
  3. **"The account assumes doxastic involuntarism for key attitudes** (admiration, belief). If voluntarism holds, the view adjusts."  

  ---

  ### **Objections & Replies**  
  *(Ordered by damage potential; 2-min reply targets)*  

  1. **The Senior Deflationist**  
     *Objection:* "This is *verbal taxonomy*, not normative theory. You’re just *stipulating* ‘right-kind’ means ‘deliberatively eligible’ and ‘wrong-kind’ means ‘practical’. Why isn’t this a pointless redescription of the very dispute you claim to dissolve?"  
     *Reply:* "Because it resolves a *practical conflict*: we’re tempted to weigh the demon’s threat against admirability, but *no such weighing is possible*. Eligibility shows why they occupy non-competing spaces. This isn’t semantics—it’s about the *structure of reasoning*."  
     *Soft Spot:* Distinguishing "structural dissolution" from "verbal quibble" under time pressure.  
     *Concede?* No. Double down on the *practical incoherence* of weighing RK/WK.  

  2. **Fittingness-First Value Theorist**  
     *Objection:* "You’ve smuggled in *fittingness* through the back door! When you say admiration answers ‘What is admirable?’, ‘admirable’ *just is* ‘fit to be admired’. Your ‘eligibility’ is circular—it presupposes the fittingness relation you claim to avoid."  
     *Reply:* "Fittingness is an *evaluative property*; eligibility is a *deliberative constraint*. The question ‘What is admirable?’ fixes the *subject matter* of deliberation (e.g., the demon’s traits), not the standard (fittingness). Eligibility tracks *topic-relevance*, not correctness."  
     *Soft Spot:* If pressed on how "admirable" is defined without fittingness.  
     *Collapse Risk?* **HIGH**. Anchor reply to "topic-specificity," not property-talk.  

  3. **Ethics of Belief Voluntarist**  
     *Objection:* "This *assumes involuntarism*! If I can voluntarily adopt admiration (via self-hypnosis, habituation), the demon’s threat *is* a direct reason to admire—it becomes eligible for my deliberation about whether to *bring about* admiration. Your Part (2) collapses."  
     *Reply:* "Even if you *cause* admiration voluntarily, the *attitude itself* still answers ‘Is this admirable?’. The demon’s threat bears on *whether to cause it*, not on that question. Cultivation is a separate practical task."  
     *Soft Spot:* If voluntarism extends to *direct* attitude formation (e.g., "I now choose to admire").  
     *Concede?* Yes: "If direct voluntarism holds, RK/WK may blur—but for *most* attitudes (belief, admiration), it doesn’t."  

  4. **Reasons-First Scanlonian**  
     *Objection:* "You’re *gerrymandering* ‘reason’. Reasons are *primitive*. The demon gives a genuine reason *to admire*—it’s just not a *good* one because it’s outweighed. Your eligibility criterion *distorts* the normative landscape to avoid weighing."  
     *Reply:* "Then why can’t you *act* on that reason? If you try to admire the demon *for* his threat, you fail—it’s motivationally inert for admiration. Eligibility explains this: only considerations about admirability can *settle* admiration’s question. The threat is a reason *to act as if* you admire him."  
     *Soft Spot:* Scanlonians may deny motivational inertness (e.g., "I can admire for payoffs").  
     *Concede?* No. Stress *deliberative incapacity* to use threats as admiration-premises.  

  5. **Accuracy-First Epistemologist**  
     *Objection:* "For belief, your view implies *non-evidential* considerations (e.g., incentives to believe) are *ineligible* as reasons. But if truth is *constitutive* of belief, only accuracy matters. Eligibility adds nothing—it’s just *accuracy* in disguise."  
     *Reply:* "Accuracy-first explains *why* truth is the eligible consideration—it answers belief’s constitutive question. Eligibility generalizes this: for any attitude, its ‘question’ sets the eligibility criterion. The demon’s threat isn’t *inaccurate*—it’s *irrelevant* to belief’s question."  
     *Soft Spot:* Risk of conceding that accuracy exhausts eligibility for belief.  
     *Concede?* Partly: "Yes, for belief, eligibility aligns with accuracy—but the *framework* extends to non-doxastic attitudes."  

  6. **Fittingness-First (Follow-Up)**  
     *Objection:* "If eligibility is capacity-relative, doesn’t that make RK reasons *subjective*? My fool might deliberate on ineligible premises (e.g., ‘admiration pleases my mother’). On your view, that’s a RK reason—but it’s *unfit*!"  
     *Reply:* "Eligibility concerns what *could* settle the attitude’s question *if properly reasoned*. The fool *misapplies* the premise—it doesn’t become eligible. ‘Pleasing mother’ answers a practical question, not ‘What is admirable?’."  
     *Soft Spot:* Explaining "misapplication" without invoking fittingness.  

  7. **Scanlonian (Follow-Up)**  
     *Objection:* "Your ‘deliberative role’ constraint *itself* needs a reason! Why should we care about eligibility? Only because there are *reasons* to deliberate properly. Reasons remain fundamental."  
     *Reply:* "Eligibility isn’t normative—it’s *structural*. Just as chess rules constrain legal moves without being ‘reasons to move’, eligibility constrains premise-use without being a reason. It’s about what counts as *playing the game* of admiration-deliberation."  
     *Soft Spot:* Metaphor may sound evasive.  

  ---

  ### **The Question You Hope Nobody Asks**  
  **Asked by the Senior Deflationist (bluntly):**  
  “Suppose an agent *lacks the capacity* to deliberate about admiration (e.g., a child, an AI). On your view, they have *no* RK reasons for admiration—since eligibility requires deliberative capacity. But that’s absurd: the demon’s threat *still* shouldn’t count as a reason to admire. Your account implodes for non-deliberators.”  

  **Least-Bad Response:**  
  “For non-deliberators, we appeal to *hypothetical* eligibility: reasons are those that *would* be eligible *if* the agent had the capacity. The threat *wouldn’t* settle ‘What is admirable?’ even then, so it’s still WKR.”  

  **Cost:**  
  - **Moderate-High**: Invites “fictionalism” accusations.  
  - **Mitigation**: Stress that hypothetical eligibility tracks *attitude-specific constraints*, not ideal agency. “Even an ideal agent couldn’t admire *on the basis* of threats.”  

  ---

  ### **Summary Tactics**  
  - **Open with concessions** to drain hostility.  
  - **Pivot immediately** to the must-land reply (eligibility vs. fittingness).  
  - **If deflationist speaks early**, treat it as the highest-stakes exchange.  
  - **Voluntarist objections** are safest to concede—limited damage.  
  - **Sacrifice universality** (non-deliberators) to save the core account if cornered.  

  This room will attack your grounding of eligibility and its independence from fittingness. Protect that flank at all costs—everything else is survivable. Good luck.
