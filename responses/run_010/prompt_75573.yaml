  ### Summary Card for Staff  
  **Purpose**: Select an allocation regime per resource class using 9 yes/no questions. Answer from existing data or quick (<1 week) collection. Apply rules after Q9.  
  **Output**: One regime (1–5) or hybrid (specify split + justification). Flag fairness concerns for board.  
  **Time**: <1 day per resource class.  
  **Rules**:  
  - If Q1=yes → **Regime 2**  
  - Else (rival):  
    - If Q2=yes and Q9=yes → **Regime 2**  
    - Else if Q3=no and Q4=yes:  
      - If Q6=yes → **Regime 5**  
      - Else → **Regime 4**  
    - Else:  
      - If Q8=yes:  
        - If Q7=yes → **Regime 3**  
        - Else → **Regime 2**  
      - Else:  
        - If Q7=yes → **Regime 3**  
        - Else → **Regime 1**  
  - If output is Regime 4 *and* Q5=no → Flag for board fairness review.  

  **Questions**:  
  1. Non-rival? (System admins; technical specs)  
  2. Near-zero marginal cost? (Finance/ops; cost data)  
  3. Demand stable? (Allocation office; historical variance)  
  4. Value subjective? (User surveys; >40% report context-dependence)  
  5. Substitutes exist? (User surveys; >50% confirm alternatives)  
  6. Small/cooperative user base? (Allocation office; <20 groups, no conflicts)  
  7. Technical coefficients known? (System architects; validated model exists)  
  8. Gaming observed? (Allocation office; >30% alloc/use ratio >2)  
  9. Monotonic demand? (Storage admins; <5% freed/year)  

  ---

  ### Decision Procedure  
  *Grounding in socialist calculation debate*:  
  - **Failure modes**:  
    - **Computation**: Allocation is intractable with current data/methods.  
    - **Information**: Knowledge (e.g., user needs) is dispersed and unreported.  
    - **Incentive**: Users withhold/misreport knowledge to gain advantage.  
    - **Discovery**: Value emerges only through exchange (Hayek’s core objection to shadow prices).  
  - **Key principles**:  
    - Shadow prices (Regime 3) fail if discovery is essential (e.g., urgent/novel uses).  
    - Near-zero marginal cost: Price reflects scarcity rent (opportunity cost of capacity), not use cost. Markets may underprice until crisis.  
    - Administrative review (Regime 1) amplifies gaming if incentives misalign.  

  *Ordered Questions*:  
  1. **Is the resource non-rival in use?**  
     - *Probes*: Computation (non-rivalry simplifies allocation).  
     - *Evidence*: System admins; technical documentation showing concurrent use possible (e.g., read-only storage).  
     - *Sufficient answer*: Yes (non-rival) or no (rival).  
     - *Termination*: If yes → **Regime 2** (no rationing needed; priorities suffice).  
     - *Error*: Self-correcting (misclassification causes congestion/underuse, quickly visible).  

  2. **Is the marginal cost of use (excluding capacity costs) near zero?**  
     - *Probes*: Computation (cost structure dictates scarcity basis).  
     - *Evidence*: Finance/ops staff; marginal cost data (energy, wear, admin). Near-zero if <5% of capacity cost per unit.  
     - *Sufficient answer*: Yes or no.  
     - *Error*: Self-correcting (over/underuse reveals mistakes).  

  3. **Is demand stable and predictable?**  
     - *Probes*: Computation, information (volatility requires dynamic methods).  
     - *Evidence*: Allocation office; historical demand variance (std dev/mean <0.3 over 3 cycles = stable).  
     - *Sufficient answer*: Yes (stable) or no (unstable).  
     - *Error*: Self-correcting (shortages/surpluses expose misjudgment).  

  4. **Is the value highly context-dependent and subjective?**  
     - *Probes*: Information, discovery (central systems can’t capture hidden urgency/innovation).  
     - *Evidence*: User surveys; >40% report value depends on timing or context (e.g., "This week is critical").  
     - *Sufficient answer*: Yes or no.  
     - *Error*: Self-reinforcing if underestimated (inefficient allocations persist undetected).  

  5. **Are there close substitutes within the consortium or externally?**  
     - *Probes*: Information, incentive (substitutes enable choice and price discovery).  
     - *Evidence*: User surveys; >50% confirm alternatives (e.g., other clusters for compute).  
     - *Sufficient answer*: Yes or no.  
     - *Error*: Self-correcting (users bypass inefficient allocations).  

  6. **Is the user base small (<20 groups) and cooperative?**  
     - *Probes*: Computation, incentive (negotiation feasible only with trust).  
     - *Evidence*: Allocation office; user count and conflict history (no disputes in 2 years = cooperative).  
     - *Sufficient answer*: Yes or no.  
     - *Error*: Self-reinforcing if overestimated (failed negotiations cause delays).  

  7. **Are technical coefficients (constraints, dependencies) reliably known?**  
     - *Probes*: Computation (shadow prices require accurate modeling).  
     - *Evidence*: System architects; validated mathematical model of bottlenecks (e.g., GPU-memory dependencies).  
     - *Sufficient answer*: Yes or no.  
     - *Error*: Self-correcting if overestimated (model failures are obvious).  

  8. **Is there evidence of gaming under the current system?**  
     - *Probes*: Incentive (gaming signals misaligned incentives).  
     - *Evidence*: Allocation office; >30% of users have allocated/used ratio >2.  
     - *Sufficient answer*: Yes or no.  
     - *Error*: Self-reinforcing if ignored (gaming worsens).  

  9. **For near-zero marginal cost resources, is demand monotonically increasing and never releasing?**  
     - *Probes*: Computation, information (monotonic demand negates market efficiency).  
     - *Evidence*: Storage admins; historical data showing <5% of allocated units freed annually.  
     - *Sufficient answer*: Yes or no.  
     - *Error*: Self-correcting (capacity shortfalls reveal errors).  

  *Hand-off to board*:  
  - Trigger if output is Regime 4 (market) *and* Q5=no (no substitutes). Reason: Markets with monopoly risks may unfairly disadvantage small institutions. Board must weigh efficiency vs. equity.  
  - **Do not** hand off based on user complaints alone; use data from Q5 and Q8.  

  *Hybrid regimes*:  
  - Only if rules specify two regimes (e.g., Q3=no and Q4=yes but Q6=partial). Split must be justified by contrasting failure modes (e.g., "Storage allocation: Regime 2 for capacity, Regime 4 for access due to computation + discovery failures").  

  ---

  ### Example Runs  
  1. **Training hours on largest nodes**  
     - *Answers*: Q1=no (rival), Q2=no (marginal cost not near zero), Q3=no (demand unstable; depends on scoring), Q4=yes (value subjective; timing matters), Q5=yes (substitutes at other sites), Q6=no (large user base), Q7=no (no complex dependencies), Q8=yes (gaming; padded requests), Q9=no.  
     - *Rule*: B.b → Regime 4 (internal market).  
     - *Verdict*: **Regime 4** – Unstable demand and subjective value require price discovery, and substitutes enable efficient bidding.  
     - *Against preference?* **Yes** – Physical accounting fails here due to incentive (gaming) and discovery (volatile needs) failures.  

  2. **Long-term archival storage**  
     - *Answers*: Q1=no (rival capacity), Q2=yes (near-zero marginal cost), Q3=yes (demand stable; monotonic growth), Q4=no (value not subjective; long-term archiving), Q5=no (no substitutes; high migration cost), Q6=no, Q7=yes (capacity known), Q8=yes (gaming; hoarding), Q9=yes (monotonic; <5% freed).  
     - *Rule*: B.a → Regime 2.  
     - *Verdict*: **Regime 2** – Near-zero marginal cost and monotonic demand make prices meaningless; central priorities align with long-term planning.  
     - *Against preference?* No.  

  3. **Time on cryo-electron microscope**  
     - *Answers*: Q1=no (rival), Q2=no (marginal cost not near zero), Q3=no (demand unstable; urgency varies), Q4=yes (value subjective; only user knows urgency), Q5=no (no substitutes), Q6=no (large, competitive user base), Q7=no (urgency not modelable), Q8=yes (gaming; waiting list), Q9=no.  
     - *Rule*: B.b → Regime 4.  
     - *Verdict*: **Regime 4** – Extreme urgency heterogeneity requires discovery; no amount of prior data substitutes for bidding.  
     - *Against preference?* **Yes** – Central priorities (preferred) fail due to information (undisclosed urgency) and discovery (emergent value) failures.  

  ---

  ### Limitations and Expected Misfires  
  **What this cannot settle**:  
  - **Capacity investment**: Decides allocation of *existing* resources only, not how much to expand.  
  - **Inter-resource dependencies**: If two resources (e.g., compute + storage) are tightly coupled, the procedure treats them separately.  
  - **Values/fairness**: Only flags monopoly risks; board must resolve equity-efficiency trade-offs.  

  **Expected misfires in our organization**:  
  1. **Markets without liquidity (self-reinforcing)**: Regime 4 may fail if too few users trade (e.g., for niche resources), causing price volatility that deters participation. Mitigation: Monitor trade volume; revert to Regime 2 if inactive.  
  2. **Shadow prices with hidden bottlenecks (self-correcting)**: Regime 3 may misprice if technical models miss dependencies (Q7 overestimated). Mitigation: Validate against usage data quarterly.  
  3. **Gaming misdiagnosis (self-reinforcing)**: If Q8 misses gaming (e.g., underreporting), Regime 1/2/3 may worsen hoarding. Mitigation: Cross-check with usage audits.  

  **Final note**: This procedure prioritizes *actionable* tests over theory. Explain outcomes to faculty as "fixing hoarding," "handling emergencies," or "fair access"—without economics jargon.
