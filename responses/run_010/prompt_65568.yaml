  Bottom line: A predicate is projectible if and only if it is a natural kind in the actual world, where natural kinds are those that figure in the fundamental laws of nature or are reducible to such kinds via identity or composition, and the projection is made relative to a context that includes the actual time and the actual causal structure of the world.

  However, note that the user has a tentative rule about mechanisms. We will build on that but refine it to avoid the grue problem.

