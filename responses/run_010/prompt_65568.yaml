      Verdict: We must give up the symmetry. The grue community is wrong to project grue because in the actual world, emeralds do not turn blue in 2050. Their projection is not licensed by the actual causal structure. And we are right to project green.

  11. Retention feature: The feature (e.g., "account created before the fifth funding round") is projectible because there is a causal mechanism: the early cohort was acquired differently and that caused them to have higher retention. But when the platform changes (e.g., after the fifth funding round, the acquisition method changes), then the background conditions change. So the projection is licensed only as long as the background conditions (the acquisition method) remain the same. When the background conditions change, the mechanism no longer applies. So the projection was legitimate until the change. **Projectible until the background conditions change.**

