  *Checks scientific nuances*: Anu's examples in (4) are correct but selective—mitochondrial code variations are real, but Marcus has a point about context being physical, not interpretive. Her Shannon argument (6) is valid mathematically but indeed avoids intentionality. Marcus's "frozen" claim (3) wobbles when considering codon reassignment in evolution. Their core conflict is ontological: is biology inherently semiotic or just pattern-driven?

