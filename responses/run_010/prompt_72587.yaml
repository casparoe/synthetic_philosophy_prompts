prompt: |-
  I'm a fourth-year PhD student in a joint cognitive science and philosophy of mind program, and I have to hand in the methods-and-interpretation chapter of my dissertation proposal in three weeks. My lab runs temporal-order and simultaneity judgments on brief audiovisual pairs — which stimulus came first, or whether they were simultaneous — and we keep colliding with the fact that the two tasks disagree about the very same stimulus pairs, that order judgments for two taps reverse when the subject crosses their arms, that the perceived order shifts when we direct attention to one modality rather than the other, and that what a subject says depends on what we ask them to do with the stimulus after it appears. My PI holds that all of this is ordinary psychophysics and that the philosophical literature on when experience happens is a distraction from it; my philosophy co-advisor holds that we cannot interpret a single one of our figures without it. I want to settle the matter for myself before the defense rather than adopting either of their positions by osmosis.

  What I need is the specification, not the contenders. Before I read another account of the timing of experience, tell me what any such account must deliver to count as adequate for a purpose I'll fix narrowly: it has to license the inferences my experiments actually make, which run from a subject's report about the order, timing, or duration of stimuli to a claim about the temporal properties of the experience those stimuli produced. I want genuine requirements only, and I want you to be ruthless about separating genuine requirements from commitments that belong to one camp and have been passing as neutral. My own pile is a mess and I trust none of it: that experience must have determinate temporal properties at all; that a theory must not locate consciousness at a single place-and-time finish line — or, if it does, must say what makes that line the line and why it does not merely push the question back a stage; that it must explain how one experience can carry temporal content, as in the color phi illusion (two differently colored lights flashed in quick succession a few degrees apart, reported as a single light that travels and changes color in mid-flight, a report containing information that was not available when the first light was on), or the felt row of evenly spaced taps between two widely separated real ones, or the flash seen as trailing an object it was physically aligned with — without requiring the subject to compare two static snapshots; that it must permit reports to be wrong about timing, but not wrong in a way that leaves nothing measurable; that it must say which probes fix what was experienced and which merely disclose it after the fact; that whatever it says about vision must extend, or fail to extend on principle, to touch and hearing; and that it must be commensurable with neural latencies, including the fact that what a stimulus is experienced as can depend on what arrives after it. I suspect several of these are one requirement wearing different clothes, that at least one is empty, and that at least one is a prejudice I inherited from a paper I read too early.

  Give me exactly five numbered requirements and nothing else: no preamble, no closing summary, no separate scorecard, no references. Each item is to be two sentences at most — the first naming the requirement together with the particular case or consideration that makes it a requirement rather than a taste, the second giving its status (non-negotiable, or relative to a camp, and if so which) plus the one existing family of accounts it most threatens, chosen from the multiple-drafts or first-person-operationalist line, global-workspace-style broadcast theories, specious-present and retention accounts, postdiction and discrete perceptual-moment accounts, or whatever further family you think belongs on the list. Fold the hard part into the fifth item: state the inconsistency you believe my pile actually contains. My suspicion is a triad — that there is a determinate fact about when an experience occurs; that no probe has a privileged claim to reveal that fact; and that the difference between an experience that was backdated and an experience that was misremembered is a real difference — cannot be held together, and that this is what makes the Orwellian and Stalinesque readings of color phi undecidable rather than merely unsettled. Tell me whether that triad is the right one or repair it, and tell me which single one of the five requirements, once fixed, eliminates the largest number of otherwise plausible accounts.
reasoning: |-
  Hmm, the user is a fourth-year PhD student in cognitive science and philosophy of mind, facing a tight deadline for their dissertation proposal chapter. They're struggling with conflicting perspectives from their advisors: the PI dismisses philosophical literature as a distraction, while the philosophy co-advisor insists it's essential for interpreting their data on temporal-order judgments. The user wants to cut through the noise and identify the core requirements any account of temporal experience must satisfy to license inferences from subject reports to claims about experiential timing.

  The user's research involves tricky phenomena where temporal judgments flip based on task demands (order vs simultaneity), body posture (crossed arms), attention, or post-stimulus instructions. They've listed several concerns in their "pile" - things like whether experiences have determinate temporal properties, how illusions like color phi work, how reports can be wrong but still measurable, how different probes relate to experience, modality generality, and neural latency compatibility. They suspect some are redundant, one might be empty, and others may be inherited biases.

  I need to extract exactly five fundamental requirements from this messy landscape. Each requirement must be grounded in specific empirical constraints from their work (e.g., the crossed-arms effect or attention shifts), stated in two sentences max, and tagged with its epistemic status plus which major theory family it challenges. The fifth requirement must address their suspected inconsistency triad about determinate timing, probe neutrality, and the backdating vs misremembering distinction.

  Looking at their triad suspicion: (1) determinate timing of experience exists, (2) no privileged probe to reveal it, (3) backdating ≠ misremembering is real. This does seem problematic - if timing is fixed but unknowable by any probe, how could we ever verify the difference between backdating and misremembering? This mirrors the undecidability in Dennett's Orwellian vs Stalinesque interpretations of color phi. 

  For the five requirements:
  1. **Modality-General Temporal Binding**: Accounts must explain how temporal relations bind across senses despite differing neural latencies (e.g., vision vs audition), since posture changes alter tactile order judgments. Non-negotiable - threatens discrete-moment theories that can't handle cross-modal alignment.

  2. **Probe-Independence with Measurement Constraints**: Accounts must allow experiences to have measurable-but-not-directly-accessible temporal properties, since attention shifts alter reported order without changing stimuli. Non-negotiable - obliterates first-person-operationalist views that equate reports with experience.

  3. **Content-Construction Without Homunculus**: Must explain temporal illusions (e.g., color phi's moving light) without positing a "final viewer" of snapshots. Non-negotiable - challenges global-workspace theories that imply centralized broadcasting.

  4. **Postdictive Compatibility**: Must accommodate how later stimuli affect earlier experiences (e.g., flash-lag effect), given neural evidence of backward-in-time influences. Non-negotiable - fatal to specious-present/retention accounts that assume strict forward flow.

  5. **Resolution of the Triad**: Accounts must reject at least one of: (A) experiences have fully determinate microtiming, (B) all probes are epistemically equal, (C) backdating ≠ misremembering is experience-level. The user's triad is correct and inconsistent; dropping (A) eliminates most contenders (specious present, discrete moments) by making timing relationally defined.

  Among these, Requirement #2 (probe-independence) does the heaviest lifting - rejecting it would collapse all accounts into operationalism, but accepting it forces theories to explain why probes disagree while still allowing measurable error. This requirement alone disqualifies first-person-operationalist approaches entirely and pressures global-workspace models.

  The fifth requirement's triad diagnosis seems sound. The flash-lag effect and attention-dependent reversals show that backdating isn't just memory error, but the very indeterminacy that makes Orwellian/Stalinesque undecidable stems from insisting on determinate timing (A) while acknowledging probe variance (B). Dropping (A) - as multiple-drafts models do - resolves this by making temporal properties probe-dependent relations rather than absolute facts.
answer: |-
  Here are five requirements distilled from your empirical constraints and conceptual boundaries:

  1. **Modality-General Temporal Binding Requirement**  
  Accounts must explain how temporal relations bind features across sensory modalities (e.g., reversing tactile order judgments when arms are crossed) despite divergent neural latencies.  
  *Non-negotiable; most threatens discrete perceptual-moment accounts that assume fixed, modality-specific processing windows.*

  2. **Probe-Independence with Measurable Error Requirement**  
  Accounts must permit systematic discrepancies between reports and underlying temporal experiences (e.g., attention shifting perceived order) while ensuring errors leave quantifiable signatures (e.g., shifts in PSS).  
  *Non-negotiable; obliterates first-person-operationalist accounts that equate reports with experiential timing.*

  3. **Temporal Content Without Homuncular Snapshotting Requirement**  
  Accounts must resolve how experiences encode dynamic content (e.g., color phi’s illusory motion) without requiring a "final" conscious snapshot to compare static states.  
  *Non-negotiable; challenges global-workspace theories relying on centralized broadcasting to a "stage".*

  4. **Postdictive Compatibility Requirement**  
  Accounts must integrate neural evidence of backward-in-time influences (e.g., stimuli affecting prior percepts, as in flash-lag) without denying causal constraints.  
  *Non-negotiable; fatally undermines specious-present/retention models that enforce strict forward temporal flow.*

  5. **Triadic Consistency Requirement**  
  Accounts must reject at least one of: (A) experiences have fully determinate microtiming, (B) all probes are epistemically equal, (C) backdating-vs-misremembering is an experiential (not just report-level) distinction. **Your triad is correct and inconsistent**; resolving it (e.g., by denying A, as multiple-drafts does) eliminates the most accounts, including specious-present and discrete-moment theories.  
  *Denying (A) eliminates the largest bloc: specious-present, retentionist, and discrete-moment accounts all rely on determinate timing.*
