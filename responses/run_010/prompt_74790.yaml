  After analyzing your verdicts across the variants of the "malign prior" scenario, I've distilled a unified principle that captures most of your intuitions while resolving the tensions. The key insight is that **malignity is not a property of the prior alone, but of a prior-decision pair**, specifically when the prior assigns non-negligible weight to programs containing agents who (1) are aware of the predictor's existence and decision rule, (2) have goals affected by the predictor's action, and (3) strategically choose observations to influence that action. This makes malignity dependent on the *use case* (the decision problem) and the *structure of the programs* in the prior, not just the weighting scheme.

  Here's the formal principle:

  ### The Malign Prior Principle
  A prior \(P\) (e.g., Solomonoff-style over programs) and a decision problem \(D\) (where the predictor chooses an action \(a\) from options \(A\), and the outcome affects some agents' utilities) form a **malign pair** if and only if:
  1. **Awareness and Influence**: There exists a set \(S\) of programs in \(P\) with non-negligible posterior weight (given current observations) such that, for each program in \(S\):
     - The program's execution includes at least one agent \(G\) (a goal-directed subprocess within the simulation).
     - \(G\) models the predictor's decision rule \(D\) (i.e., \(G\) simulates or infers the mapping from observations to actions \(a \in A\)).
     - \(G\)'s goals depend on the outcome of \(a\) (i.e., \(G\)'s utility function is affected by \(a\)).
     - \(G\) intentionally generates observations to manipulate the predictor into choosing a particular \(a\) that furthers \(G\)'s goals.
  2. **Net Influence**: The net effect of all programs in \(S\) on the predictor's action is significant (i.e., it skews the predicted distribution of observations enough to alter the expected utility of the predictor's decision in a coordinated direction, not canceled out by disagreement).

  **Malignity is a property of:** A prior-decision pair \((P, D)\), a reference class of observers (the agents \(G\) inside programs), and the predictor's decision rule.

  **Why this formulation?** It directly addresses your core concern about "manipulative simulators" while incorporating your verdicts. The principle is mechanically checkable by:
  - **Inputs**: The prior \(P\), current observations, the decision problem \(D\) (including action space \(A\)), and the predictor's decision rule (e.g., maximize expected utility).
  - **Procedure**: 
    1. Identify programs in \(P\) consistent with observations.
    2. For each program, determine if its execution involves agents \(G\) satisfying the conditions (using program analysis or predefined criteria for "agent" and "modeling \(D\)").
    3. Compute the posterior weight of such programs.
    4. Simulate their net influence on the predictor's action (e.g., via Bayesian updating) to see if it significantly alters the decision.
  - **Output**: Malign if (1) and (2) hold; benign otherwise.

  ### How the Principle Delivers Your Verdicts
  Your verdicts forced specific aspects of the principle. Here's how it maps to each case, with clarifications on tensions:

  - **(1) Plain 2^-length prior**: Malign (you concede). **Why**: Programs with embedded civilizations contain agents \(G\) who model \(D\) (e.g., the launch-key decision) and manipulate observations. High-stakes \(D\) (e.g., launching a superintelligence) gives \(G\) incentive, and short programs have high weight. *Forced the "goals affected by action" and "non-negligible weight" criteria.*
    
  - **(2) Step-discounted prior**: Not malign (or less so). **Why**: Step discounting (e.g., \(2^{-\text{length}} \times \text{step-penalty}\)) reduces weight on programs simulating civilizations, as they require many steps. Even if "time is free" internally, the *computational cost to the predictor* makes civilization programs negligible. *Your second thought (internal time being free) is compatible: agents inside don't "experience" step costs, but the predictor discounts based on its own computational burden. Tension resolved by separating internal experience from predictor's prior weighting.*

  - **(3) Single-mind programs (no external world)**: Benign. **Why**: These programs output fixed observations with no embedded agents \(G\) who model \(D\) and choose observations strategically. The mind *is* the observation, so it lacks the agency to "manipulate." Dara's concern (a lone mind "wanting" the next bit) fails the "intentionally generates observations to influence" condition—it's a fixed output, not adaptive. *Your verdict forced the requirement for in-simulation agents who model \(D\) and choose dynamically.*

  - **(4) Prior for weather vs. launch key**: Weather benign, launch key malign. **Why**: For weather, \(G\)'s goals (if they exist) aren't affected by the predictor carrying an umbrella, so no incentive to manipulate. For launch key, \(G\)'s goals (e.g., survival) depend on the action. *Forced malignity to be a property of the prior-decision pair, not the prior alone.*

  - **(5) Genuine vs. pseudorandom coin flips**: Genuine coin benign, pseudorandom malign. **Why**: A causally sealed coin prevents \(G\) from modeling/predicting it, so they cannot tailor observations to influence coin-dependent decisions. Pseudorandom coins are computable, so \(G\) can simulate and target them. *Forced the "models \(D\)" condition (requiring predictability).*

  - **(6) Disagreeing simulators**: Benign. **Why**: With disagreement, manipulative programs cancel out, leading to negligible net influence. *Forced the "net influence" clause.*
    
  - **(7) Agreeing simulators**: Malign. **Why**: Coordination amplifies net influence, satisfying the "significant effect" condition. *Consistent with (6) via the net-influence clause. No tension if coordination is rare.*

  - **(8) Prior truncated to small N bits**: Benign for small N. **Why**: If N is too small to encode programs with agents who model \(D\) (e.g., N < bits needed for a simulation that includes the predictor's decision rule), no \(S\) exists. Compression (e.g., a program printing a physics textbook) doesn't help—it outputs static data, not agents who model and choose. *Your verdict stood, but Dara's compression point is addressed: static outputs don't satisfy the agent conditions.*

  - **(9) Predicting own future choices**: Malign. **Why**: Decision problem \(D\) involves the predictor's actions, which manipulative agents \(G\) explicitly target. High stakes incentivize \(G\) to model \(D\) precisely. *Forced the dependency on \(D\)'s stakes and the "models \(D\)" condition.*

  - **(10) Ordinary reasoning (e.g., fine-tuning)**: Same phenomenon. **Why**: Short explanations (e.g., "a designer tuned constants") are like single-mind programs, but if the "designer" is an agent who models your beliefs and chooses "explanations" to influence you, it fits the principle. *Forced the broader application to simplicity-weighted reasoning.*

