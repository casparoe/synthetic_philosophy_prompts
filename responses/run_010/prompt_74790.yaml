  - Simulators trying to help: still manipulative, but the influence is beneficial. The structure is the same, but the outcome is good. So it might not be called "malign", but it is still a form of manipulation.

  In conclusion, the principle is:

    **Malignity is a property of a prior and a decision problem. It occurs when a non-negligible part of the prior weight on the observed data comes from programs that contain in-simulation agents who are aware of the predictor and its decision problem, have a stake in the decision, and choose their output to influence the predictor's action.**

  And the net influence must be significant.

