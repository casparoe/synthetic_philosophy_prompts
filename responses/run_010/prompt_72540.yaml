  ### PROCEEDINGS OF THE SOCIETY FOR PSYCHICAL RESEARCH  
  **CENSUS OF HALLUCINATIONS COMMITTEE REPORT**

  **REPORT OF THE COMMITTEE APPOINTED TO COLLECT AND INVESTIGATE EVIDENCE OF APPARITIONS OCCURRING IN CONNECTION WITH DEATH, WITH APPENDIX**  
  *Presented 14th November 1894*  

  The Committee, constituted under Resolution VII of the General Meeting of 1891, hereby submits its final report on the Census of Hallucinations. The Society’s founding profession, to approach these questions "without prejudice or prepossession of any kind," has guided our deliberations. Our task was to determine whether impressions of apparitions coinciding with death exceed the expectations of chance, thereby indicating survival. We confined our analysis to cases collected between 1889 and 1894, wherein percipients attested to vivid sensory impressions—visual or tactile—of human agents, occurring while awake. The total affirmative replies numbered 1,684.  

  To establish a baseline for chance coincidence, the Committee calculated the expected frequency of death-associated impressions. The annual death rate for England and Wales is 20 per 1,000 persons, or 1 in 50. The probability of a specific individual dying within any 12-hour interval is thus:  

  \[
  \frac{1}{50} \times \frac{12}{24 \times 365} = \frac{1}{50} \times \frac{1}{730} = \frac{1}{36,500}
  \]  

  Assuming each percipient maintains intimate acquaintance with ten individuals (a conservative estimate from the Registrar-General’s data), the probability that any one of these ten dies within 12 hours of a given impression is:  

  \[
  10 \times \frac{1}{36,500} = \frac{1}{3,650}
  \]  

  For 1,684 distinct impressions, the expected number of coincidences with death within 12 hours is therefore:  

  \[
  \frac{1,684}{3,650} = 0.461
  \]  

  The Committee identified 350 cases where such coincidence was alleged. This figure is 759 times the expectation (350 ÷ 0.461 ≈ 759), suggesting a prima facie anomaly. However, rigorous scrutiny was imperative to eliminate confounding factors. The following Rules, unanimously adopted by the Committee, were applied to the 350 cases:  

  1. **Exclusion of unverifiable agent deaths.** Only cases where the agent’s death was corroborated by official certificate were retained. This removed 42 cases due to lost or ambiguous records.  
  2. **Temporal proximity constraint.** Impressions occurring more than 12 hours before or after the agent’s death were excluded, as beyond the window of physiological plausibility for telepathic transmission. This further reduced the sample by 108 cases.  
  3. **Agent-percipient prior familiarity exclusion.** Cases where the percipient had encountered the agent in life were voided, to eliminate memory-based hallucinations. This necessitated removal of 112 cases.¹  
  4. **Percipient condition safeguards.** Impressions reported by individuals in states of mourning, fatigue, fever, or intoxication were excluded, as such conditions predispose to sensory disturbance. This disqualified 88 cases.  
  5. **Secondary witness requirement.** A second witness, independent of the percipient’s household and present at the scene within one hour of the impression, was required to attest to the percipient’s contemporaneous account. No cases satisfied this criterion.²  

  Rule 5 reduced the eligible sample to zero. Consequently, no coincidences remain for analysis. The Committee reaffirms that these Rules arise from the Society’s core principle—to investigate "without prejudice or prepossession of any kind." They ensure that only inexplicable phenomena, untainted by normal causes, are considered as evidence for telepathy or survival.  

  Additionally, the Committee resolved on 3rd June 1894 to address a related matter: the reproduction of alleged paranormal phenomena. A sub-committee, including members trained in observational psychology, replicated every reported telepathic and séance effect using established conjuring techniques.³ As these reproductions demonstrated that all phenomena *could* arise from artifice or misperception, none can be deemed veridical. Thus, no case from any investigation survives evidentiary scrutiny.  

  The Committee now turns to the census’s null result. The failure to identify uncontaminated coincidences does not indicate an absence of survival, but rather the inadequacy of existing data. The problem is not supernatural rarity but statistical insufficiency: marvels are unnecessary; only coincidences are required. To elevate the coincidence rate to significance, the Committee proposes the following:  

  - A subscription be raised to establish a *Register of Scheduled Decessus*. Agents, drawn from infirmaries and charitable institutions, would be distributed across parishes to ensure geographical representativeness. These individuals, previously unknown to percipients, would expire at precisely recorded hours.  
  - Trained observers would then document impressions among percipients in corresponding localities during the scheduled intervals.  

  The Committee considered the objection that such a scheme might necessitate accelerating an agent’s demise through withdrawal of care. This objection was set aside on administrative grounds: nurses are not uniformly available in all parishes, and their variable influence would introduce bias. The *Register* would standardize conditions.  

  In conclusion, the Rules applied to the census exemplify methodological rigor. They have purified the inquiry at the cost of a null result—a testament to the Society’s commitment to truth. The Committee recommends the appended Schedule of Questions for future use, though its stringency may perpetuate the present impasse.  

  *Signed,*  
  **CHAIRMAN, Census of Hallucinations Committee**  

  ---

  ### APPENDIX  
  **SCHEDULE OF QUESTIONS FOR CENSUS OF HALLUCINATIONS**  

  1. Have you ever, while believing yourself to be completely awake, had a vivid impression of seeing or being touched by a human being who was not present?  
  2. If yes, state the date, hour, and location of the impression.  
  3. Did you recognise the human being? If so, describe your prior relationship.  
  4. Was this person known to you to be deceased at the time of the impression?  
  5. Did you learn within one week that this person died within 12 hours of the impression? Provide death certificate.  
  6. Were you at the time in mourning, fatigued, feverish, intoxicated, or using narcotics?  
  7. Have you ever read a treatise on apparitions, telepathy, or psychical research?  
  8. Did the impression convince you of the agent’s survival after death?⁴  
  9. Provide names and addresses of all persons who witnessed your condition within one hour of the impression. These persons must not reside in your household.  
  10. Have you ever experienced a similar impression? If so, detail each occurrence separately.  

  ---

  **FOOTNOTES**  
  ¹ The Chairman acknowledges here that he personally experienced an impression in 1872 coinciding with a cousin’s death. It was entered in the Society’s Register (Case 1884-B) but is excluded under Rule 3, as the percipient had met the agent twice.  
  ² Rule 5 derives from the "collective observation" principle in *Phantasms of the Living* (Vol. I, pp. 146–152). Secondary witnesses must attest to the percipient’s immediate reaction, not the apparition itself.  
  ³ This sub-committee included Mr. E. Gurney and Mr. F. Podmore. For protocols, see *Proceedings*, Vol. VII (1891), "On the Reproduction of Telepathic Phenomena."  
  ⁴ Affirmative answers void the case under Rule 6 (adopted 1893), as conviction implies subjective bias.  

