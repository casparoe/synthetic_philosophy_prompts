  4. The structural feature doing the work:
  In HCH, the human at each level can dynamically break the problem based on the specific needs and can store intermediate results externally, only holding what is necessary for the current step. In particular, the human can break the aggregation into a tournament tree where each comparison is done by a separate assistant, and the human only ever holds two candidate reports at a time (which is 6 pieces) but she delegates the comparison to an assistant who only takes two reports (6 pieces) -> but wait, the assistant also has bound 5, so cannot take 6 pieces.

  In our earlier design for HCH, we represented the candidate by an index and cost (2 pieces) and then the comparison node takes two candidates (4 pieces) and outputs the better one (2 pieces). That is within bound. How did we achieve that? By not including the valid bit? In the tournament tree, we only consider valid candidates. So the input to the tournament tree is only the valid candidates, represented by (index, cost). Then the comparison node takes (index1, cost1) and (index2, cost2) -> 4 pieces, within 5.

  But how do we ensure that only valid candidates are passed to the tournament tree? In the HCH protocol, the human at the group level (H1) first collects for each candidate whether it is valid and its cost. But then she extracts only the valid ones and forgets the invalid ones. Then she passes only the valid ones to the tournament tree. In the DAG, we cannot conditionally forget; the structure is fixed.

  In the static DAG, we must build a tournament tree that can handle up to 36 candidates, but many might be invalid. The tournament tree must be able to skip invalid candidates. The comparison node must take two inputs that might be invalid. So it must take (valid1, cost1, index1) and (valid2, cost2, index2) -> 6 pieces.

  But in HCH, the human pre-filters the candidates and only considers the valid ones, reducing the amount of information that needs to be processed in the aggregation phase. This is possible because the human can conditionally drop information and restructure the problem based on intermediate results.

  The key structural feature is the dynamic restructuring and conditional pruning of the search space based on intermediate results, which is not possible in a static DAG.

  If we remove the dynamic restructuring (i.e., if we force the DAG to be static), then the aggregation node must handle the full set of candidates (including invalid ones) and hence the representation blowup.

