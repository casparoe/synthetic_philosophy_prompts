prompt: |-
  Ok, fun one. Draft the joint statement that would come out of an adversarial collaboration over van Fraassen's Reflection principle. I'll state Reflection in my own words so we're not quibbling over canonical phrasing: for any proposition P and any later time t, your present credence in P conditional on "my credence in P at t will be r" should equal r.

  The two camps, as I want them characterized:

  Camp A — the deferentialists. Reflection states a real, general requirement of diachronic rationality. Your future self is an expert on P relative to everything you now expect her to know, so refusing to defer to her anticipated credence is a species of epistemic self-contempt, and it's exactly what licenses the diachronic Dutch book.

  Camp B — the source-sensitivists. Reflection is a sound default that breaks precisely when you know your future credence will be produced by something other than evidence: drugs, hypnosis, head injury, engineered amnesia, foreseeable misleading evidence, self-locating shifts. What earns deference is the *source* of the anticipated belief, not the bare fact that you can predict it.

  Both camps have been handed the following cases and both accept the numbers, which is the whole point of the exercise.

  Case 1 (Drug). Mira is a palaeographer. Her present credence that a disputed charter is genuine (call that proposition G) is 0.05, based on forensic work she's confident in. In six weeks she joins a trial of a compound that, she is 0.99 confident, will (i) wipe her memory of the forensic work and (ii) install a vivid conviction of G via a felt familiarity with the script. She has read the assay: the compound carries no information whatsoever about the charter. So she expects her post-drug credence in G to be 0.95. Now, a bookie offers her a bet costing $90 that pays $100 if G is false; later, the same bookie offers post-drug Mira a bet costing $90 that pays $100 if G is true. Each self, at its own lights, strictly prefers its bet. Combined: $180 out, $100 back, sure loss of $80.

  Case 2 (Archive). Same starting credence, but instead of the drug Mira will spend six weeks in another archive, and she expects to conditionalize on whatever provenance record she turns up (or fails to turn up). No belief-fixing mechanism, no memory loss, just evidence she knows is coming but doesn't yet have.

  Case 3 (Amnesia). Like Case 1, except the compound also erases her sense of how much time has passed, so post-drug Mira is unsure whether she is the historian who took the drug last week or one who took it years ago and has since recived independent evidence about the charter.

  Here's the document I want you to produce:

  1. Shared ground (numbered, 6-9 claims, ~350 words). Things both camps can sign without wincing. I'd expect the $80 arithmetic to be in there, plus agreement that the compound carries no information about G, plus agreement that Reflection comes out satisfied in Case 2, plus something about both camps holding that credences are governed by diachronic norms rather than anything going. Don't pad this with vacuous motherhood — if a claim costs either side nothing, it doesn't belong here.

  2. Disagreements (a table, 4-6 rows, ~600 words). Columns: question at issue / the deferentialist's wording / the source-sensitivist's wording / genuine or verbal. The wording of each side's column has to be something that side would actually sign, not a strawman or a grudging paraphrase.

  3. Cruxes and pre-registered predictions (2-4 cruxes, ~600 words). For each: the sub-question whose settlement would move at least one camp, the case or argument both camps accept as bearing on it, and each side's prediction written down in advance. I strongly suspect one crux is whether Mira could rationally bind her future self (a Ulysses contract, refusing the second bet in advance), and whether such a binding smuggles Reflection back in as a norm on *action* rather than on credence. Another I suspect is whether Case 1's apparent failure is really Case 3 in disguise, i.e. a centering problem rather than a source problem.

  4. What's merely verbal (~200 words). Say which parts of the A/B dispute turn on the words "rational", "deference", or "the same agent over time", and why — and be specific about which of your table rows gets downgraded as a result.

  5. Where I think this draft is most likely to be wrong (~250 words, and this one is yours, not the parties'). Which shared-ground claim did you have to weaken to make it signable, and how much was lost? Which crux do you suspect is bogus? For each crux, which way would you personally lean and how hard, and what single consideration would flip that lean? Close with where your reasoning is most likely to fail outright — for instance if I'm wrong that both camps can agree on the arithmetic of Case 1, or if the deferentialist has a restriction on Reflection that isn't ad hoc and I've underplayed it.

  Total something like 2000 words. Keep the tone of the document itself formal enough that two people who dislike each other could both put their names to it.
reasoning: |-
  Okay, the user wants me to draft a joint statement for an adversarial collaboration on van Fraassen's Reflection principle. They've outlined two camps with distinct positions: deferentialists who see Reflection as a genuine rationality requirement, and source-sensitivists who see it as breakable when future credences come from non-evidential sources. They've provided three cases (Drug, Archive, Amnesia) to test these views.

  The request is quite detailed - they want five specific sections: shared ground (6-9 claims), disagreements in table format, cruxes with predictions, analysis of verbal disputes, and my own critique. The tone needs to be formal enough for actual academics to sign, and total around 2000 words.

  Hmm, this is a sophisticated philosophy of probability problem. The user clearly knows their stuff - they're using terms like "diachronic Dutch book" and "centering problem" correctly. They want a document that captures substantive disagreements without strawmanning either side. The challenge will be maintaining neutrality while still highlighting genuine philosophical divides.

  For shared ground, I'll need to identify what both camps accept: the Dutch book calculation in Case 1, the irrelevance of the drug to G's truth, Reflection holding in Case 2, etc. Must avoid platitudes - every claim should cost something. The arithmetic example is key because both sides agree it's irrational even if they disagree why.

  The disagreements table needs careful wording - each column must be endorsable by that camp. Major divides will be on whether future selves are "epistemic peers" (deferentialists say yes, source-sensitivists say no), whether diachronic norms require deference to process or outcome, and whether binding future selves is rational.

  For cruxes, the Ulysses contract question is central - can Mira precommit? Deferentialists say no because it violates future autonomy, source-sensitivists say yes because future self isn't rational. The centering issue in Amnesia case is another crux - is it about source or self-location?

  On verbal disputes, terms like "deference" and "same agent" cause trouble. Source-sensitivists think "deference" requires proper source, deferentialists think any future self deserves it. This might downgrade some rows about "peer" status.

  In my critique, I suspect the shared claim about "epistemic self-contempt" is weakened - source-sensitivists don't see it that way. Also the centering crux might be bogus - Case 3's amnesia doesn't resolve the core dispute. Personally I lean toward source sensitivity but could be flipped by a good account of why non-evidential processes create new experts.

  Biggest risk is if deferentialists have non-ad-hoc restrictions I've missed, or if camps actually disagree on Dutch book interpretability. Need to watch that.
answer: |-
  ## Joint Statement: Adversarial Collaboration on van Fraassen's Reflection Principle

  **Participants:**  
  Camp A ("Differentialists"): Represented by [Name A1], [Name A2]  
  Camp B ("Source-Sensitivists"): Represented by [Name B1], [Name B2]  

  **Facilitated & Drafted by:** [Your Name/Institution]

  **Date:** October 26, 2023

  **Preamble:**  
  This document represents the outcome of a collaborative effort to clarify points of agreement and disagreement concerning van Fraassen's Reflection Principle, characterized as: For any proposition P and any later time t, an agent's present credence in P conditional on "my credence in P at t will be r" should equal r. We analyzed three stipulated cases (Drug, Archive, Amnesia) with shared numerical inputs. Our goal is to identify substantive disagreements, isolate potential verbal disputes, and register pre-commitments for future investigation.

  ---

  **1. Shared Ground**

  The following claims represent propositions both parties endorse based on the stipulated cases and core commitments, acknowledging that the *rationale* behind agreement may differ:

  1.  **Diachronic Dutch Book Vulnerability (Case 1):** Mira, as described in Case 1 (Drug), is vulnerable to a sure loss of $80 via the sequence of bets offered by the bookie. Her pre-drug and post-drug betting dispositions, given their respective credences (Cr_now(~G) = 0.95, Cr_post(G) = 0.95), guarantee this loss if both bets are accepted.
  2.  **Non-Informativeness of Drug (Case 1):** The compound in Case 1 carries no information relevant to the truth value of G (the charter's genuineness). Its effect is purely belief-altering via memory erasure and false conviction induction, not truth-indicative.
  3.  **Reflection Satisfied in Evidence-Based Update (Case 2):** In Case 2 (Archive), Mira rationally satisfies the Reflection principle. Her current credence in G, conditional on her future credence at t being r (resulting from conditionalizing on new evidence in the archive), equals r. Deference to her future self in this scenario is rational.
  4.  **Diachronic Norms Govern Credences:** Credences are governed by diachronic norms of rationality. Rational credence formation and change are not purely synchronic matters; how an agent's credences evolve over time is subject to rational evaluation.
  5.  **Rejection of Purely Synchronic Requirements:** Mere consistency of credences at a single time (synchronic coherence) is insufficient to guarantee diachronic rationality. An agent can be synchronically coherent at each time t0 and t1 while still violating diachronic norms (as evidenced by Dutch book vulnerability).
  6.  **Source Matters for Rationality Assessment:** The *process* or *source* leading to a future credence is relevant to determining whether deference to that future credence is rationally required. The mere fact that a future credence is anticipated is not, by itself, always sufficient to mandate deference.
  7.  **Epistemic Asymmetry (Case 1):** In Case 1 (Drug), Mira *now* possesses relevant evidence (her forensic work) that her *post-drug* self will lack and cannot rationally access or utilize. This creates an epistemic asymmetry between her present and future selves regarding G.
  8.  **Amnesia Introduces Distinct Complexity (Case 3):** Case 3 (Amnesia) introduces an element (uncertainty about elapsed time and potential new evidence) not present in Case 1. This complexity, related to self-locating beliefs and potential evidence access, requires separate analysis and may interact with the core dispute over Reflection.

  ---

  **2. Disagreements**

  | Question at Issue                                                                 | Deferentialist Wording                                                                                                                                 | Source-Sensitivist Wording                                                                                                                                                                                                 | Genuine or Verbal? |
  | :-------------------------------------------------------------------------------- | :----------------------------------------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :----------------- |
  | **Is the future self always a relevant epistemic peer/authority?**                | Anticipating one's future credence in P to be r implies that one currently assesses that future self as having become an expert relative to one's current total evidence regarding P. | Anticipating a future credence r does not imply that the future self is an epistemic peer or authority; it is rational to withhold deference if that credence is known to arise from a non-evidential, belief-distorting process (e.g., Case 1). | **Genuine**        |
  | **What is the fundamental diachronic norm violated in Case 1?**                   | The vulnerability in Case 1 stems from a violation of a core diachronic rational requirement (Reflection), which manifests practically as Dutch book vulnerability. | The vulnerability in Case 1 stems from the future self's credence failing to be constrained by the agent's *current* total relevant evidence regarding P, due to the non-rational source of that future credence. Reflection is not the operative norm here. | **Genuine**        |
  | **Does Reflection state a general requirement of rationality?**                   | Reflection expresses a genuine, general requirement of diachronic rationality: deference to one's anticipated future credences is constitutive of rational agency over time. | Reflection is a heuristic or default rule that holds only when the anticipated future credence is expected to result from a rational process (e.g., conditionalization on new evidence). It is not a fundamental requirement. | **Genuine**        |
  | **What licenses deference?**                                                      | Deference is licensed by the bare fact that it is *one's own* future credence, anticipated based on one's current expectations about one's future epistemic state. | Deference is licensed by the *source* of the anticipated future credence – specifically, that it is expected to result from a rational, evidence-responsive cognitive process. The identity of the believer is secondary. | **Genuine**        |
  | **Is "epistemic self-contempt" the apt description for rejecting Reflection in Case 1?** | Refusing to defer to one's anticipated future credence, even in Case 1, constitutes a form of epistemic self-contempt, as it arbitrarily privileges the current perspective over the temporally extended self. | Characterizing the rejection of deference in Case 1 as "self-contempt" is incorrect and misleading. It is epistemically responsible to privilege a credence based on genuine evidence (now) over one induced by a known irrational process (future). | **Genuine**        |
  | **Is Case 1's Dutch book proof of Reflection's normative force?**                 | The Dutch book vulnerability in Case 1 directly demonstrates the irrationality of violating Reflection; it is the practical consequence of the epistemic failure. | The Dutch book vulnerability in Case 1 demonstrates irrationality, but *not* due to violating Reflection. It demonstrates the irrationality of holding credences generated by a known non-evidential process, which coincidentally creates a Reflection-violating state. | **Genuine**        |

  ---

  **3. Cruxes and Pre-registered Predictions**

  1.  **Crux: Binding Future Action (Ulysses Contracts)**
      *   **Sub-Question:** Can Mira *now* rationally pre-commit (e.g., via an irrevocable contract) to refuse the post-drug bet in Case 1, thereby avoiding the Dutch book, even knowing her future self will want to accept it?
      *   **Bearing Case:** Case 1 (Drug). Does the rationality of such a pre-commitment undermine the claim that the future self's perspective must be deferred to?
      *   **Deferentialist Prediction:** No. Such a pre-commitment is irrational. It disrespects the future self's epistemic perspective and autonomy, effectively overriding the future self's rational assessment (at that time) based on information available to them. Rational diachronic agency requires allowing the future self, constituted by the anticipated state, to make decisions based on its (future) epistemic state. Binding actions undermine this agency. *If binding is rational, it demonstrates Reflection is not a norm on belief but potentially smuggled into action.*
      *   **Source-Sensitivist Prediction:** Yes. Such a pre-commitment is rational and prudent. Mira knows her future self will be epistemically compromised regarding G. Binding her future self to act based on her *current*, evidence-informed credence (Cr_now(~G)=0.95) is a rational exercise of agency to avoid foreseeable epistemic and financial harm. *This does not make Reflection a norm on action; it reflects the rational priority of current evidence over future delusion.*

  2.  **Crux: The Amnesia Case - Source or Centering?**
      *   **Sub-Question:** Is Mira's post-drug vulnerability in Case 3 primarily explained by the non-evidential *source* of her credence (like Case 1), or by the *centering problem* introduced by memory loss and temporal uncertainty (making her future self potentially a different "epistemic agent" with different evidence access)?
      *   **Bearing Case:** Case 3 (Amnesia). Does resolving the self-location uncertainty restore the applicability of Reflection, or does the non-evidential source remain the primary issue?
      *   **Deferentialist Prediction:** The core issue in Case 3 is the centering problem/self-location uncertainty. If Mira post-drug could become certain she had *just* taken the drug and had no new evidence (effectively collapsing Case 3 to Case 1), *then* Reflection *should* apply (though her ability to conditionalize on that information may be impaired by the drug's effect). The source alone (if centering is resolved) is insufficient to break Reflection. The Dutch book vulnerability persists due to the unresolved self-location, not solely the source.
      *   **Source-Sensitivist Prediction:** The non-evidential source remains the primary issue, even *if* the centering problem were resolved (e.g., by a reliable indicator confirming she just took the drug and has no new evidence). Knowing her credence was *induced by the drug* (a non-evidential source) rationally justifies her current self withholding deference. The centering problem in Case 3 adds a layer of uncertainty about evidence access, but the core objection based on source persists even if that layer is removed. The Dutch book vulnerability stems primarily from the irrational source.

  3.  **Crux: The Scope of "Expertise"**
      *   **Sub-Question:** Does "expertise" relevant for deference require only that the future self possesses *more* of the agent's *total* relevant information (including evidence gained and lost), or does it require the future self's belief-forming process to be *responsive to evidence* regarding P?
      *   **Bearing Case:** Case 1 (Drug). Does the post-drug self qualify as an "expert relative to everything you now expect her to know"?
      *   **Deferentialist Prediction:** Yes. The future self in Case 1 possesses the information Mira *now* expects her to have at t (a vivid conviction, memory loss of forensics). Relative to *that* expected information set, her future credence of 0.95 *is* expert. Deference is mandated relative to the agent's current expectations about the future epistemic state, regardless of how that state was acquired. Expertise is defined relative to the anticipated information base.
      *   **Source-Sensitivist Prediction:** No. Expertise requires not just a body of information, but that the credence held is a *rational response* to that information (or the best available). The post-drug self's credence is not responsive to *any* information regarding G's truth; it's a fixed delusion. Therefore, she is not an expert *on G* relative to any information set; the concept of expertise on P inherently implies evidence-responsiveness regarding P.

  ---

  **4. What's Merely Verbal**

  Significant portions of the disagreement hinge on differing interpretations of key terms, rather than substantive clashes about the structure of rationality or the cases:

  1.  **"Deference":** Camp A uses "deference" to mean *aligning current conditional credence with anticipated future credence* as a requirement stemming from temporal extension. Camp B uses "deference" to mean *treating a belief as authoritative based on the reliability of its source*. For B, "deference" implies warranted trust in the source's epistemic access; for A, it implies recognition of temporal continuity. This difference underpins the disagreement over whether Mira "owes deference" to her future self in Case 1 (Row 1: "Epistemic Peer/Authority", Row 4: "What licenses deference?").
  2.  **"Rational" (Diachronic):** While both agree diachronic norms exist, they apply "rational" differently to the *process* connecting credences over time. For A, violating Reflection is *itself* diachronically irrational. For B, holding a credence known to be generated irrationally (like the post-drug state) is diachronically irrational, but violating Reflection by not aligning with that irrational credence is *not* irrational. This affects the description of the "fundamental norm violated" (Row 2) and the characterization of "epistemic self-contempt" (Row 5).
  3.  **"The same agent over time":** A emphasizes the continuity of agency, making the future self's perspective inherently part of the agent's own rational perspective. B emphasizes the potential for epistemic discontinuity due to corrupted processes, making the future self, at times, a different *epistemic* agent relative to a specific proposition. This conceptual difference regarding identity and agency underlies disputes about peer status (Row 1) and the aptness of "self-contempt" (Row 5).

  ---

  **5. Where the Facilitator Suspects this Draft is Most Likely Wrong**

  1.  **Weakened Shared Ground (#7: Epistemic Asymmetry):** Claim 7 ("Mira *now* possesses relevant evidence...") was crucial for common ground but required careful phrasing. Source-sensitivists endorse it strongly as the core reason to reject deference. Deferentialists accept it descriptively but deny it carries the normative weight B assigns – for A, the future self's state *is* the relevant perspective given current expectations, making the "lost" evidence irrelevant *for the purpose of forming the conditional credence required by Reflection*. Significant tension exists beneath the surface agreement here. The cost for A was acknowledging descriptive asymmetry while denying its normative consequence for Reflection.
  2.  **Potentially Bogus Crux (#2: Amnesia - Source or Centering?):** The facilitator suspects this crux may be less decisive than hoped. Source-sensitivists might argue that even *if* centering is perfectly resolved in Case 3 (mimicking Case 1), the source objection remains primary. Deferentialists might argue that perfect centering resolution is impossible or irrelevant if the drug impairs reasoning. Both sides might readily assimilate a "centering-resolved Case 1" back to their core positions regarding Case 1. The predicted divergence might be less sharp in practice.
  3.  **Personal Leans & Flipping Considerations:**
      *   *Leans:* The facilitator leans towards Source-Sensitivists, primarily due to the intuitive force of withholding deference in Case 1 and the apparent disconnect between the drug's mechanism and genuine expertise. The Ulysses contract argument is persuasive. *(Lean Strength: Moderate)*
      *   *Flipping Consideration:* A convincing Deferentialist argument demonstrating that rejecting Reflection in Case 1 unavoidably leads to a *distinct*, perhaps more severe, form of diachronic incoherence *even granting the irrational source*, or a compelling account of temporal selfhood that makes the future perspective inherently authoritative regardless of source, could flip this lean.
  4.  **Where Reasoning is Most Likely to Fail Outright:** The most significant risk is underestimating a sophisticated Deferentialist restriction on Reflection that handles Case 1 without being perceived as ad hoc, thereby collapsing more of the disagreement than acknowledged. For instance, a restriction based on the agent's *current ability to endorse the future belief-forming method* (which Mira in Case 1 cannot do), if rigorously developed and shown to be principled (e.g., stemming from a deeper norm of epistemic agency), could significantly challenge the Source-Sensitivist position and the structure of the disagreements table (particularly Rows 2, 3, 6). Alternatively, a fundamental disagreement over the interpretability of Dutch Books (e.g., whether Case 1's book truly targets a *diachronic* norm violation or just synchronic irrationality at t1) could undermine the shared ground (#1, #5).

  ---

  **Signatures:**

  [Name A1], Camp A (Differentialist)  
  [Name A2], Camp A (Differentialist)  
  [Name B1], Camp B (Source-Sensitivist)  
  [Name B2], Camp B (Source-Sensitivist)  
  [Facilitator Name], Facilitator
