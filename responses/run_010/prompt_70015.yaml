  1. **The sixty-sherd kylix with documented losses**:
     - Step 1: Contact? The sherds are loose: No -> Step 3.
     - Step 3: Functional unity? Yes, they are parts of one vessel -> record as one object. Stop.

  2. **The coin hoard lifted as a single block**:
     - Step 1: Contact? The coins are not in direct contact (soil in between): No -> Step 3.
     - Step 3: Functional unity? The coins do not function together: No -> Step 4.
     - Step 4: Organic unity? No -> Step 5.
     - Step 5: Intentional unity? The context of acquisition (excavation) likely treats it as a hoard (one deposit). Also, the institution might have a policy. We assume the documentation says it is a hoard. Then we record as one object. Stop. (But the registrar expects not to like this. If the institution's policy is to record coins separately, then at Step 5 we would have a directive to record as multiple objects. But if there is no such policy and the documentation says "hoard", then one object. If the documentation is ambiguous, then we go to Step 6.)

     - If we reach Step 6: 
          - The block is physically attached (embedded). Separation would cause damage. So record as one object and refer to curator.

     So the procedure might give an answer the registrar doesn't like (one object) and then the curator can override.

  3. **A restored cabinet in which most of the original material has been replaced**:
     - This is a diachronic issue. The procedure is synchronic (current state). We treat it as it is presented.
     - Step 1: The cabinet is assembled: contact? Yes (panels are in contact) -> Step 2.
     - Step 2: Fastened? Yes (nailed or glued) -> record as one object. Stop.
     - The fact that the panels are from different times does not affect the fastening. So the procedure says one object.

     - Does it need a separate module? The procedure as is works for the cabinet. We don't need a separate module.

  4. **Quartz cluster with a detached crystal**:
     - We have two items: the cluster and the detached crystal.
     - Step 1: Contact? They are two separate pieces (the crystal is detached): No -> Step 3.
     - Step 3: Functional unity? In nature, they were part of one formation. But now, are they functioning together? Probably not. They are two separate mineral specimens. -> No -> Step 4.
     - Step 4: Organic unity? No, it's mineral. -> Step 5.
     - Step 5: Intentional unity? If there is documentation that they are to be together, then one object. Otherwise, unclear -> Step 6.
     - Step 6: They are loose and separable. Record as two separate objects. And refer to curator? Only if they were attached. They are not, so just record separately.

     But note: the cluster itself is one object? The procedure is applied to the incoming item: which is the cluster and the detached crystal together. We are considering them as one accession? Or are they two items? The problem says: "a quartz cluster, and next to it in the tray, a crystal that has broken off it." So they are presented together. We are to decide: one record or two?

     The procedure would likely say two separate objects. But the museum might want to record them together. That would be caught in Step 5 (if there is an institutional policy to record fragments with the main object).

     If there is no such policy, then two objects.

  **Limits of the Procedure:**

     - The procedure leaves indeterminate cases that are handed to the curator (at Step 6 when the item is physically aggregated and cannot be separated without damage). Also, cases where the institutional policy is ambiguous (Step 5) are taken to Step 6.

     - The procedure settles by fiat at Step 6: if separable, then separate records; if not, then one record and refer.

     - The metaphysical work it does is operationalizing the candidate views in a sequence. It does not resolve the SCQ but provides a practical, evidence-based approach. It uses:
          - Step 1 and 2: Contact and fastening (operationalizing contact and fastening views).
          - Step 3: Functional unity (functional view).
          - Step 4: Organic unity (vitalism).
          - Step 5: Interest-relative view.
          - Step 6: Brutal composition? Not exactly. It defaults to a practical decision.

     - The procedure does not directly address unrestricted composition or nihilism, but by being based on observable properties and documentation, it produces the same result regardless of the cataloguer's personal metaphysics.

     - The procedure's outcome is driven by the practical needs of the museum (insurance, loans, conservation) and the item's physical and documentary state.

     - It does not attempt to answer what exists in a deep metaphysical sense.

     - The candidate views used:
          - Step 1: Contact theory (but not sufficient by itself).
          - Step 2: Fastening theory (a form of contact with additional constraint).
          - Step 3: Functional unity (functionalist view).
          - Step 4: Organic unity (vitalism, or the view that only living things compose).
          - Step 5: Interest-relative view (including institutional convention).
          - Step 6: A practical default that is not directly from the literature.

     - The procedure is not completely invariant under universalism and nihilism in the sense that a universalist might think that even the loose sherds compose an object, but the procedure would only record them as one object if they pass one of the steps (like functional unity). If they don't, then at Step 6 they are recorded as separate. But that's the same as what the nihilist would do (record the simples). So for the output, it is invariant.

