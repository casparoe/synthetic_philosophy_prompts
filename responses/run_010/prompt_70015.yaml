  ### Decision Procedure for Object Unity Determination

  This procedure operationalizes the Special Composition Question (SCQ) by testing candidate metaphysical views in sequence. It is invariant under nihilism and universalism: both yield identical records. Each step returns a binary cataloguing decision or progresses. If evidence is unclear, proceed to the next step. When the procedure stops at a step, record as indicated. If Step 6 is reached, default to separate records and refer unresolved cases to the curator. The curator must sign off at the end.

  ---

  #### **Step 1: Contact Criterion**  
  *Operationalizes: Contact Theory (objects compose a whole if in physical contact)*  
  - **Question**: "Are all pieces in direct, stable physical contact (excluding temporary packaging or supports), forming a single connected mass?"  
  - **Sufficient Answer**: Visual/tactile confirmation of uninterrupted contact (e.g., sherds glued together, coins fused).  
  - **Unclear/Missing**: If contact is ambiguous (e.g., pieces embedded in soil but not touching), return "unclear" → proceed to Step 2.  
  - **Returns**:  
    - Yes → Proceed to Step 2 (contact alone is insufficient; fastening must be checked).  
    - No → Proceed to Step 3 (skip Step 2).  
  - **If Criterion False**: Contact is irrelevant; procedure progresses to functional/intentional criteria.

  #### **Step 2: Fastening Criterion**  
  *Operationalizes: Fastening Theory (objects compose a whole if bonded or fixed)*  
  - **Question**: "Are the pieces mechanically fastened (e.g., glued, nailed, welded, or embedded in a cohesive matrix like hardened soil)?"  
  - **Sufficient Answer**: Observed bonds (adhesive, joins) or documentation of fastening (e.g., conservation report).  
  - **Unclear/Missing**: If bonding is uncertain (e.g., corroded joins), return "unclear" → proceed to Step 3.  
  - **Returns**:  
    - Yes → Record as **one object** with part-level sub-records. Stop.  
    - No → Proceed to Step 3.  
  - **If Criterion False**: Fastening is irrelevant; composition depends on other criteria.

  #### **Step 3: Functional Unity Criterion**  
  *Operationalizes: Functional Unity (objects compose a whole if serving a unified purpose)*  
  - **Question**: "Do all pieces serve a single primary function (e.g., a vessel for drinking, an artwork for display), per design, creator intent, or use context?"  
  - **Sufficient Answer**: Documentation (e.g., loan contract, artist statement, archaeological typology) or intrinsic design (e.g., interlocking parts).  
  - **Unclear/Missing**: If function is ambiguous (e.g., no creator statement), return "unclear" → proceed to Step 4.  
  - **Returns**:  
    - Yes → Record as **one object** with part-level sub-records. Stop.  
    - No → Proceed to Step 4.  
  - **If Criterion False**: Function is irrelevant; composition depends on life or intent.

  #### **Step 4: Organic Unity Criterion**  
  *Operationalizes: Vitalism (only living/organic entities compose wholes)*  
  - **Question**: "Is the item a living organism, a single organism’s remains, or a natural product of organic processes (e.g., a skeleton, a mineral cluster formed biologically)?"  
  - **Sufficient Answer**: Biological/natural history data (e.g., collection records, morphology).  
  - **Unclear/Missing**: If organic status is unknown, return "unclear" → proceed to Step 5.  
  - **Returns**:  
    - Yes → Record as **one object** with part-level sub-records. Stop.  
    - No → Proceed to Step 5.  
  - **If Criterion False**: Life is irrelevant; composition depends on intent or convention.

  #### **Step 5: Intentional Unity Criterion**  
  *Operationalizes: Interest-Relativity (composition depends on human interests)*  
  - **Question**: "Does explicit documentation (e.g., loan contract, donor deed, excavation report) or institutional policy mandate treating the pieces as one unit or multiple units?"  
  - **Sufficient Answer**: Written directives (e.g., "this artwork is one entity," "record hoard as a group").  
  - **Unclear/Missing**: If documentation/policy is absent or conflicting, return "unclear" → proceed to Step 6.  
  - **Returns**:  
    - Mandate for one unit → Record as **one object** with part-level sub-records. Stop.  
    - Mandate for multiple units → Record as **separate objects** in a shared group. Stop.  
  - **If Criterion False**: Intent is irrelevant; composition is either brutal or conventional.

  #### **Step 6: Default and Referral**  
  *Operationalizes: Brutal Composition (no general account; facts are particular) or Convention*  
  - **Action**: Record all pieces as **separate objects** in a shared group. Then:  
    - If pieces are physically inseparable (e.g., embedded in a matrix), notify the curator immediately for value/convention review.  
    - Curator resolves based on institutional needs (e.g., valuation, publishing standards).  
  - **Rationale**: Steps 1–5 exhausted objective criteria; what remains is conventional or contextual.

  ---

  ### Application to Example Items

  #### **1. Kylix (60 sherds with documented losses)**  
  - **Step 1**: No contact (loose sherds) → Step 3.  
  - **Step 3**: Functional unity? Yes (designed as a drinking vessel) → **Record as one object** with sub-records for sherds/losses. Stop.  
  - *Metaphysical basis*: Functional Unity overrides fragmentation.  

  #### **2. Coin Hoard (400 coins lifted as a block)**  
  - **Step 1**: No direct contact (coins separated by soil) → Step 3.  
  - **Step 3**: Functional unity? No (coins lack shared function) → Step 4.  
  - **Step 4**: Organic unity? No → Step 5.  
  - **Step 5**: Intentional unity? Unclear (no policy/directive) → Step 6.  
  - **Step 6**: Default → **Record as separate objects** in a shared group. Refer to curator (due to institutional preference for individual coins).  
  - *Note*: Procedure yields an "undesirable" but metaphysically consistent result. Curator may override per convention.  

  #### **3. Restored Cabinet (panels replaced over centuries)**  
  - **Synchronic Test**:  
    - **Step 1**: Contact (panels assembled) → Step 2.  
    - **Step 2**: Fastening? Yes (panels fixed) → **Record as one object** with sub-records for parts. Stop.  
  - **Diachronic Concern**: No separate module needed. Fastening supersedes temporal origins. Functional Unity (Step 3) would also affirm unity.  

  #### **4. Quartz Cluster with Detached Crystal**  
  - **Step 1**: No contact (crystal detached) → Step 3.  
  - **Step 3**: Functional unity? No (no shared function) → Step 4.  
  - **Step 4**: Organic unity? No (mineral, not biological) → Step 5.  
  - **Step 5**: Intentional unity? Unclear → Step 6.  
  - **Step 6**: Default → **Record as separate objects** (cluster and crystal).  
  - *Note*: Procedure treats natural and artifactual items identically; no special status for non-artifacts.  

  ---

  ### Limits of the Procedure
  1. **Indeterminate Cases**:  
     - Leaves unresolved:  
       - Brutal particularities (e.g., an item with no clear functional/intentional unity).  
       - Value-driven decisions (e.g., a hoard’s recording preference affects publishing).  
     - Settles by fiat:  
       - Default separation at Step 6 (prioritizes nihilism-adjacent caution).  
       - Fastening/Functional Unity as sufficient conditions (ignores universalism’s "any collection").  

  2. **Metaphysical Work Done**:  
     - Tests SCQ restrictions sequentially but **does not resolve metaphysics**.  
     - Outputs are **pragmatic**: Driven by insurance, conservation, and legal needs (e.g., fastening dictates conservation scope; intent binds loans).  
     - Invariance: Nihilist and universalist cataloguers produce identical records by following objective steps (e.g., both record the kylix as one object due to function, not personal views).  

  3. **Unaddressed Views**:  
     - *Universalism* (unrestricted composition): Never directly tested; identical outcomes arise if criteria like function/fastening are met.  
     - *Nihilism* (no composition): Defaults to separation at Step 6, but overridden by earlier steps if criteria fulfilled.  
     - *Brutal composition*: Handled by Step 6 referral (curator decides "brute facts").  

  4. **Efficiency**: Completable in <1 hour by non-philosophers; defers convention/value to curator.
