          - Let the vote be: m for majority, n - m for minority (where m > n/2).
          - Compute margin = m - (n - m) = 2m - n.
          - If margin == 1 (examples: 3-2 in 5, 4-3 in 7, 5-4 in 9) then:
               - Escalate to a human expert. Stop.
          - Else:
               - Certify the majority vote.

     **Estimation notes (where we can't measure):**

     - **Q1 (objective fact)**: Judgment call. When in doubt, escalate.
     - **Q2 (single question)**: Judgment call. If the claim has multiple parts that might be voted on independently, then it's compound.
     - **Q3A (tally visibility)**: We can see from the system settings and the thread. If the system shows the tally, then visible. If not, then not.
     - **Q3A (herding pattern)**: We have to look at the order of votes. If the first two are the same and then the rest mostly follow (>=80% of the rest), then we call herding. But 80% is arbitrary? We use it because the log says 84% of the time the rest follow when the first two are the same. So if we see that pattern, we are concerned.
     - **Q3B (source diversity)**: 
          - We have to judge what counts as a "source". A preprint is one source. Two preprints from the same lab might be correlated. Use common sense: if they are independent, then they are separate.
          - We count the number of reviewers using each source. If a source is used by > floor(n/2) reviewers? Actually, we said "more than half", so if n=5, then more than 2.5 -> 3 or more. So if 3 out of 5 use the same source, fail.
          - For correlated sources: judgment call. If two sources are from the same organization, they are correlated. If they are from different independent organizations, they are not.
     - **Q4 (margin)**: We just do arithmetic.

     If we cannot determine (e.g., we don't have the order of votes for herding, or we don't have the sources for every reviewer), then we have to make a judgment. We might fail Q3 and re-run to be safe? Or if we are missing the sources, we might escalate? 

     We add: If in Q3B we cannot determine the sources for some reviewers (and for the ones we can, we don't see a concentration) then we pass? But if we are missing information, that might be a problem. We might set: if we don't have source information for more than one reviewer, then we fail and re-run with a requirement to report sources.

     **Time Note**: The user has 10 minutes. So they must be able to quickly check the thread for sources and vote order. If the thread is very long, they might not be able to. We assume they can skim.

     Let's run the examples quickly:

     (a): 
          - Q1: pass.
          - Q2: pass.
          - Q3A: tally visible? (unknown, but let's assume we check and it was hidden? but the problem says they can see the tally in the thread. So likely visible -> fail.) 
              But even if not visible, Q3B: same preprint -> one source, all used it -> fail.
          - Action: re-run.

     (b):
          - Q1: "misleading" is subjective -> fail, escalate.

     (c):
          - Q1: pass (objective).
          - Q2: fail (two questions) -> restructure.

     This meets the requirement.
answer: |-
  Below is a structured procedure designed to evaluate votes before certification, addressing the limitations of Condorcet's jury theorem (e.g., correlated errors, competence <0.5, lack of independence, bundled questions, and subjectivity). The procedure uses your logs and observable patterns to flag high-risk votes. It prioritizes practicality: each step is binary, requires minimal estimation, and can be executed in ≤10 minutes without probability knowledge. Steps requiring judgment or unmeasurable estimates are flagged.

  ---

  ### **Procedure: Pre-Certification Vote Assessment**
  **Goal**: Certify only votes where the majority decision is likely reliable (or escalate/restructure if not).  
  **Inputs**: Vote thread (to see sources, voting order, discussion), panel size, vote tally.  
  **Output**: Certify, Restructure, Escalate to Expert, or Abstain + Re-run.  
  **Time**: Designed for ≤10 mins per claim.

  #### **Step 1: Is there a clear fact of the matter?**  
  - **Check**: Is the claim **objective and verifiable** (e.g., "Did event X occur?")? Avoid ambiguous/political judgments (e.g., "Is this misleading?").  
  - **Pass**: Yes (objective fact).  
  - **Fail**: No (subjective or interpretive).  
  - **Action on fail**: Escalate to human expert.  
  - *Why?* Subjective claims lack ground truth; majority vote may reflect bias, not accuracy.  
  - *Estimation needed?* **Yes** (judgment call). If unclear (e.g., "misleading" claims), default to "fail" and escalate.

  #### **Step 2: Is the question binary and atomic?**  
  - **Check**: Is the vote **a single, indivisible question**? Reject compound questions (e.g., "Did X happen, and was it deliberate?").  
  - **Pass**: Yes (single question).  
  - **Fail**: No (bundled questions).  
  - **Action on fail**: Restructure the vote. Split into separate claims and re-vote.  
  - *Why?* Bundled questions force reviewers to vote "yes/no" on conflated issues, muddying the majority signal.

  #### **Step 3: Are sources diverse and independent?**  
  - **Check A**: Did ≥3 reviewers **cite distinct, independent sources**?  
    - *Pass*: ≥3 unrelated sources (e.g., preprint + journal + govt. report).  
    - *Fail*: ≤2 sources used by the whole panel, or >50% relied on 1–2 correlated sources (e.g., same preprint).  
    - *Action on fail*: Abstain + re-run vote. Instruct reviewers to use ≥3 independent sources.  
  - **Check B**: Were sources **low-quality or biased** (e.g., fringe blogs, known propaganda)?  
    - *Pass*: Sources are reputable (e.g., peer-reviewed journals, official data).  
    - *Fail*: Dominant sources are unreliable.  
    - *Action on fail*: Abstain + re-run. Require higher-quality sources.  
  - *Why?* Source correlation → error correlation. Your logs show 19% overturn for same-source panels vs. 6% for mixed.  
  - *Estimation needed?* **Yes** (source independence/quality). Use judgment: if unsure, compare sources to your outlet’s pre-vetted list. Default to "fail" if sources are unverifiable.

  #### **Step 4: Was voting independent?**  
  - **Check A**: Could reviewers see the **running vote tally** before submitting?  
    - *Pass*: Tally hidden until all votes in.  
    - *Fail*: Tally visible mid-vote.  
    - *Action on fail*: Abstain + re-run with blinded tally.  
  - **Check B**: If tally visible, did **early votes influence later votes**?  
    - *Pass*: First two votes split OR ≤60% of later votes followed first two.  
    - *Fail*: First two votes agreed AND ≥80% of later votes followed them.  
    - *Action on fail*: Abstain + re-run with blinded tally and randomized vote order.  
  - *Why?* Visible tallies → herding (84% follow-rate in your logs). Breaks voter independence.

  #### **Step 5: Is competence likely >0.5?**  
  - **Check**: Do ≥2 reviewers **cite opposing evidence** in the thread?  
    - *Pass*: Yes (e.g., some cite pro-claim evidence, others anti-claim).  
    - *Fail*: No opposing evidence cited, or reviewers only echo one narrative.  
    - *Action on fail*: Escalate to expert.  
  - *Why?* Self-selected reviewers may have preexisting bias. Opposing evidence suggests balanced evaluation → competence >0.5.  
  - *Estimation needed?* **Yes** (judging "opposing evidence"). If all evidence points one way but claim is contentious, fail.

  #### **Step 6: Margin and robustness check**  
  - **Check**: Is the **majority margin ≥3 votes**? (e.g., 7–0, 6–1, 5–2; not 5–4 or 4–3).  
    - *Pass*: Margin ≥3 OR panel size ≤5 with unanimous vote.  
    - *Fail*: Margin ≤2 (e.g., 5–4, 6–5, or 4–3 in a 7-person panel).  
    - *Action on fail*: Escalate to expert.  
  - *Why?* Thin margins (≤2) + small panels → high error risk even if other criteria pass. Your logs show unanimous same-source panels have 19% overturn; thin margins are riskier.

  #### **Final Certification Rules**  
  - **Certify**: Only if all steps **pass**.  
  - **Shrug and escalate**: If >1 estimation step is ambiguous (e.g., source quality + fact objectivity unclear).  
  - **Flow**:  
    ```mermaid
    graph TD
      A[Start] --> B(Step 1: Objective fact?)
      B -->|Fail| C[Escalate to expert]
      B -->|Pass| D(Step 2: Single question?)
      D -->|Fail| E[Restructure + re-vote]
      D -->|Pass| F(Step 3: Source diversity?)
      F -->|Fail| G[Abstain + re-run with new sources]
      F -->|Pass| H(Step 4: Voting independent?)
      H -->|Fail| I[Abstain + re-run blinded]
      H -->|Pass| J(Step 5: Competence >0.5?)
      J -->|Fail| C
      J -->|Pass| K(Step 6: Margin ≥3?)
      K -->|Fail| C
      K -->|Pass| L[Certify]
    ```

  ---

  ### **Run Procedure on Cases**  
  **Case (a)**: 7–0 unanimous medical claim; all reviewers read same preprint.  
  - **Step 1**: Pass (medical claim is objective).  
  - **Step 2**: Pass (single question).  
  - **Step 3**:  
    - Check A: Fail (all used same preprint → correlated errors).  
    - *Action*: Abstain + re-run with diverse sources (e.g., preprint + journal + clinical trial registry).  
  - **Outcome**: **Do not certify**. Matches your suspicion.  

  **Case (b)**: 5–4 split on "misleading" statement; 2 days of panel arguing.  
  - **Step 1**: Fail ("misleading" is subjective → no ground truth).  
  - **Action**: Escalate to expert.  
  - **Outcome**: **Do not certify**.  

  **Case (c)**: Bundled question ("Did event happen? Was it deliberate?").  
  - **Step 1**: Pass (both sub-questions objective).  
  - **Step 2**: Fail (bundled question).  
  - **Action**: Restructure into two claims and re-vote.  
  - **Outcome**: **Do not certify** (restructure needed).  

  ---

  ### **What the Procedure Can't Fix**  
  1. **Self-selection bias**: Reviewers pick claims they "have feelings about" → panels skewed toward motivated/biased voters.  
  2. **Competence stagnation**: No feedback loop to improve reviewer accuracy (e.g., overturn data not shared).  
  3. **Correlated evidence**: Even with diverse sources, all evidence may stem from a single flawed root (e.g., retracted study).  
  4. **Deliberation trade-offs**: Thread arguments may improve competence but break independence (procedure detects herding, not subtle influence).  
  5. **Small panels**: With n≤9, thin majorities (e.g., 5–4) remain high-risk even post-procedure (Step 6 escalates them).  

  **Key Takeaway**: This procedure mitigates *detectable* Condorcet failures (correlation, subjectivity, bundling) but can’t fix systemic issues (bias, evidence quality). Prioritize restructuring (diverse sources, blinded voting) and expert escalation for ambiguous cases.
