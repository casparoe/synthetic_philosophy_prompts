prompt: |-
  I cover science and ideas for a magazine, and for the past year I've been stuck in the gap between two tribes that barely acknowledge each other exists: conservation people, and the animal-welfare crowd who think most wild animals' lives are net miserable. I'm trying to write a piece about a pattern in their arguments and I don't have a word for it, which is a problem, because the piece only works if I can describe the pattern without making either side look like they're cheating.

  Here's the shape. Two people are looking at the same numbers — say a study of how many larvae a pair of songbirds has to fledge to replace itself, or the counts from a wetland after it's drained for housing. They agree on the numbers. They even agree that suffering counts. But one concludes the habitat loss is a catastrophe and the other concludes it's a relief, because it means less lives of the starvation-and-being-eaten variety. Now push each of them on what would change their mind and you get different answers — not different conclusions, different *standards*. The one who's worried about suffering wants a very high bar cleared before anyone gets to say a given wild life was worth living; the other wants a very high bar cleared before anyone gets to say clearing a woodland is a harm to anybody. And each will tell you, sincerely, that they're just following the evidence and holding to the normal scientific standard.

  Same thing with predators. Reintroduce them and one camp says you'd better be very sure the ecosystem benefits before you accept all the extra killing, while the other says you'd better be very sure it produces net suffering before you're allowed to block it. The burden has flipped, and neither side can see that it flipped, because to each one the burden obviously sits exactly where they put it.

  So — is there an established name for this? A couple of candidates I've already talked myself out of. It isn't motivated reasoning or confirmation bias, or it doesn't feel like it: I don't see wishful thinking in either camp, nobody's comforting themselves with a nicer picture of the world. They just weigh being wrong in one direction vastly more than being wrong in the other. And it isn't a plain double standard or special pleading, because those words imply someone's being slippery, and I've met these people and they aren't. Nor is it simply that the data is uncertain — though it is — the thing I keep noticing is that the uncertainty gets resolved by something that isn't in the data and isn't acknowledged as having been supplied by the person doing the resolving.

  What I actually want is the carving, not a label I can drop in a headline. Where does this thing start and where does it stop? At what point is it just ordinary disagreement about evidence, or ordinary disagreement about values, rather than this? Is it a reasoning failure, or is it the correct response when two people genuinely have different things at stake — because if it's correct, my piece has a completely different ending. If there's no name, coin me one, with a defintion tight enough that a general reader would know what I meant and neither camp would feel ambushed. And tell me which of the nearby ideas is the closest fit, and precisely what about my description it fails to capture.
reasoning: |-
  Okay, the user is a science writer stuck between two groups: conservationists and wild animal welfare advocates. They both look at the same data but draw opposite conclusions. The key issue is how each group sets their burden of proof differently without realizing it. For example, conservationists want strong evidence that an action causes net suffering before blocking it, while welfare advocates want strong proof that lives are worth living before accepting habitat loss.

  The user needs a term for this pattern. They've ruled out motivated reasoning and confirmation bias because both sides seem sincere. It's not double standard or special pleading either. The core is asymmetric burden of proof based on unstated priors. 

  Looking at philosophical concepts, the precautionary principle comes to mind, but it's too broad. Bayesian priors might be relevant, but too technical. Cognitive biases like belief perseverance or prior attitude effect touch on it but don't capture the asymmetry. 

  The best fit might be "differential burden of proof" or "evidential asymmetry." But the user needs something vivid. "Burden tennis" is catchy but might trivialize. "Paradigm parallax" suggests different frameworks causing misalignment. 

  To carve the concept: it starts when both sides agree on facts but have different baseline assumptions about default states (nature as good vs. suffering). The uncertainty is resolved by these unacknowledged priors. It's not just values or evidence disagreement; it's about thresholds for action. 

  The user should clarify that both positions are logically consistent within their frameworks. The piece could end by highlighting that resolution requires making these priors explicit.
answer: |-
  You've hit on a profound and under-discussed pattern in environmental ethics. What you're describing isn't just disagreement—it's a **clash of baseline assumptions about the default state of nature**, leading to **asymmetric burdens of proof** that feel objective to each side but are fundamentally normative. Here's the carving:

  ### The Core Pattern: Default Position Asymmetry
  1.  **Conservation Ethic (Default: Nature is "Good"):**
      *   **Baseline Assumption:** Wild nature, left undisturbed, represents a balanced, intrinsically valuable state. Individual suffering is part of a functional whole. Population persistence, biodiversity, and ecological processes are primary goods.
      *   **Burden of Proof:** Placed on proving **harm *to the system* or *loss of intrinsic value***. Removing habitat or blocking restoration requires strong evidence it causes *net harm to the collective/ecosystem*. Suffering caused *by* nature is the unfortunate cost of this intrinsic good.
      *   **Fear of Error:** Fears declaring something harmful to nature (like habitat loss or blocking restoration) when it *isn't* (Type I error in their framework: false positive of harm).
      *   **Mind-Changer:** Would need overwhelming evidence that a *specific* wild population's lives are *net negative* on average *and* that removing them doesn't cause greater systemic harm.

  2.  **Wild Animal Welfare Ethic (Default: Wild Life is Net Suffering):**
      *   **Baseline Assumption:** Wild animal lives are typically dominated by suffering (starvation, predation, disease, injury). Population persistence often entails vast amounts of individual misery. Reducing aggregate suffering is the primary good.
      *   **Burden of Proof:** Placed on proving **benefit *to individuals***. Maintaining habitat or adding animals (like predators) requires strong evidence it creates *net positive experiences* or significantly reduces *net suffering* for the individuals involved. Ecosystem health is valuable only insofar as it reduces suffering.
      *   **Fear of Error:** Fears declaring something beneficial to individuals (like preserving habitat or adding predators) when it *isn't* (Type I error in *their* framework: false positive of benefit).
      *   **Mind-Changer:** Would need overwhelming evidence that a *specific* wild population's lives are *net positive* on average *and* that preserving/expanding it creates more positive experiences than suffering.

  ### Why Existing Labels Don't Quite Fit & The Best Fit
  *   **Motivated Reasoning/Confirmation Bias:** As you note, these imply *seeking* comfort or ignoring contrary evidence. Your subjects are sincere and consistent *within* their frameworks. This is prior to evidence-seeking.
  *   **Double Standard/Special Pleading:** These imply hypocrisy or inconsistency. Each side applies *their own* standard consistently; the inconsistency is *between* frameworks, not within an individual's reasoning.
  *   **Cultural Cognition/Identity-Protective Cognition:** Closer, as it deals with how groups process risk based on values. However, it often focuses on *denial* of facts, whereas your groups *agree* on facts but interpret their *meaning* differently due to baselines.
  *   **The Precautionary Principle:** **This is the closest conceptual neighbor, but fractured.** Both sides *are* applying a precautionary principle, but to *directional opposites*:
      *   Conservation: "Be cautious about intervening in nature (loss/destruction/blocking restoration) unless harm is proven."
      *   Welfare: "Be cautious about *not* intervening to prevent suffering (preservation/restoration/adding animals) unless benefit is proven."
      *   **Where it fails:** The PP is usually framed around preventing harm from a novel intervention. Here, both sides see the *status quo or proposed action* as potentially harmful, depending on the baseline. It doesn't capture the *flipped default*.

  ### The Name: Paradigm Parallax
  *   **Definition:** **Paradigm Parallax** occurs when two groups, operating under fundamentally different baseline assumptions ("paradigms") about the inherent value or state of a system, interpret identical evidence through opposing lenses of risk. This results in a reciprocal and unrecognized reversal of the burden of proof regarding what constitutes harm versus benefit, making substantive agreement impossible without first acknowledging and bridging the foundational paradigmatic gap.
  *   **Why it works:**
      *   **Paradigm:** Clearly signals a foundational worldview/framework.
      *   **Parallax:** An optical effect where the *position of the observer* changes the *apparent position* of an object. Perfectly captures how the *standpoint* (default assumption) changes the *apparent meaning* of the evidence and where the burden lies. The object (evidence) is fixed, the viewpoint causes the shift.
      *   **Evocative:** Sounds scientific and slightly disorienting, fitting the phenomenon.
      *   **Neutral:** Doesn't blame either side ("bias", "pleading").
      *   **Descriptive:** Implies the gap is due to perspective, not bad faith.
      *   **Headline-Friendly:** "The Conservation Clash: Seeing Nature Through Paradigm Parallax"

  ### Where it Starts and Stops
  *   **Starts:** When disagreement persists *despite* agreement on empirical facts and a shared *abstract* value (e.g., "suffering matters," "nature has value"), but crucially, **divergent assumptions about the *default state* and *primary locus of moral concern*** (ecosystem vs. aggregate individual experience). The key trigger is when uncertainty exists about the *net outcome* for the chosen locus (well-being of system vs. well-being of individuals), and each side reflexively places the burden of proof on the other to overcome *their* assumed default risk.
  *   **Stops:**
      *   **Pure Fact Disagreement:** If they genuinely dispute the data (e.g., bird fledging rates, predator impact numbers), it's ordinary scientific disagreement.
      *   **Pure Value Disagreement:** If they explicitly say "I don't care about ecosystems, only suffering" or "Individual suffering is irrelevant to conservation goals," it's a transparent value clash. Paradigm Parallax arises when they *claim* to share the abstract values but their *operational baselines* lead to opposing burdens.
      *   **Resolved Uncertainty:** If overwhelming evidence *directly* addresses the net outcome for *their specific locus of concern* (e.g., undeniable proof a specific population lives net-positive lives, or undeniable proof an ecosystem collapse caused massive suffering beyond natural baselines), the asymmetry *could* dissolve *for that specific case*. The underlying paradigms likely remain.

  ### Is it a Failure or Correct? Implications for Your Ending
  It's **neither a simple reasoning failure nor simply "correct."** It's an **inevitable consequence of fundamentally different moral starting points operating under uncertainty.**

  *   **Not (Primarily) Failure:** Each reasoning chain is *internally* logical *given* their baseline. Demanding the other side meet *your* burden seems reasonable from *within* your paradigm. It's not illogical; it's perspectival.
  *   **Not Simply "Correct":** While internally consistent, the failure lies in:
      1.  **Lack of Metacognition:** Neither side typically acknowledges their baseline *as* an assumption needing justification; they treat it as an objective starting point. This is where a subtle epistemic failure occurs.
      2.  **Unacknowledged Normativity:** The choice of baseline (Is nature good? Is wild life net suffering?) is itself a profound *value judgment* disguised as a factual premise. The burden asymmetry flows from this unstated normative core.
      3.  **Impedes Dialogue:** By not recognizing the parallax, they talk past each other, each convinced the other is ignoring the "obvious" burden.

  ### Your Piece's Ending
  This suggests **your piece shouldn't end by declaring a winner or exposing "cheating," but by highlighting the parallax itself as the core obstacle:**

  *   **Frame:** Position Paradigm Parallax as the hidden dynamic preventing resolution. Explain how sincere, evidence-respecting people can reach opposite conclusions because they start from inverted defaults about nature's fundamental character.
  *   **Impact:** The takeaway is that progress requires **making the implicit baselines explicit.** Before debating data or policy, they need to engage at the level of: "What is the default state we assume about wild animal existence, and *why*? What evidence would genuinely shift *that* foundational belief?"
  *   **Challenge:** Conclude by questioning whether the shared abstract values ("prevent harm," "value nature") are enough without confronting this deeper paradigmatic divide about what "harm" and "nature's value" fundamentally mean in the context of wild animal lives. Resolution might require acknowledging that the disagreement is less about the science of suffering or ecosystems, and more about the *philosophy* of wildness and the moral weight of aggregate experience vs. systemic integrity.

  By naming and dissecting Paradigm Parallax, you give readers (and perhaps even members of these tribes) the conceptual tool to see the argument structure clearly, fostering more productive dialogue focused on the *real* disagreement at the level of baseline assumptions.
