answer: |-
  Here are your five objection-reply entries, prioritized:

  1.  **Objection (Moral Psychologists):** "Your 'alarm' framing presupposes disgust is functional tracking, but decades of vignette studies show disgust sensitivity predicts condemnation of harmless purity violations *without* institutional context. This suggests repugnance is a domain-specific cognitive bias triggered by contamination cues, not a calibrated signal about social institutions. The kidney case correlation is post-hoc."  
      **Reply:** Concede disgust often misfires in lab purity vignettes. Hold that real-world repugnance *clusters* precisely around transactions threatening vital non-market institutions (gift, duty), unlike random purity violations. The bias exists, but its societal expression isn't random.  
      **Softest:** Distinguishing "bias trigger" from "institutional signal" in practice.

  2.  **Objection (Economists):** "You overstate crowding-out inevitability. Roth's work shows repugnance is a *feasibility constraint*; smart design (like your kidney proposal) *can* overcome it by altering transaction frames. Markets for eggs/sperm, once repugnant, now function without destroying underlying norms, proving decay isn't inherent but manageable."  
      **Reply:** Concede crowding-out isn't automatic and design can mitigate it (hence my proposal). Hold that initial repugnance *correlates* with goods critically dependent on non-market norms vulnerable to pricing – eggs/sperm markets succeeded partly by mimicking gift *rhetoric* early on. The alarm flags *vulnerability*, not certainty.  
      **Softest:** Proving markets didn't erode *some* underlying norms in sperm/egg cases.

  3.  **Objection (Mixed):** "Your kidney proposal seems fragile and untested. How does naming the gift or paying a charity truly 'rebuild' the norm? Titmuss showed paid blood crowds out altruistic donation; won't your decoupled payment just feel like disguised commodification, failing to satisfy the repugnant or ensure supply?"  
      **Reply:** Concede the proposal is untested and may not fully replicate pure gift norms. Hold it explicitly aims to *preserve* the *social meaning* of donation as altruistic by decoupling payment from the bodily act and directing value elsewhere, directly addressing the institutional decay alarm.  
      **Softest:** Empirical uncertainty about whether design sufficiently rebuilds the norm.

  4.  **Objection (Psychologists/Economists):** "Isn't this institutional romanticism? Markets often *create* beneficial norms (e.g., trust in eBay ratings). Why assume the pre-market institution (like 'gift' for kidneys) is inherently superior or irreplaceable? Repugnance might just signal unfamiliarity or status quo bias, not decay."  
      **Reply:** Concede markets *can* generate new norms and pre-market institutions aren't always optimal. Hold that for specific goods like kidneys/votes, the eroded institution (e.g., bodily integrity as non-fungible) serves unique, non-replicable functions vital to social cohesion, which pure markets struggle to replicate.  
      **Softest:** Defining the "unique, non-replicable functions" concretely enough.

  5.  **(The Hoped-Nobody-Asks Question) Objection (Moral Psychologists):** "You argue repugnance signals *potential* institutional decay. But what if repugnance *itself* is the primary *cause* of decay? By pathologizing the transaction and discouraging participation, doesn't the visceral 'yuck' reaction actively *sabotage* the very norm (e.g., organ donation as noble gift) it supposedly protects, creating a self-fulfilling prophecy?"  
      **Reply:** Concede repugnance can suppress participation *if* expressed institutionally (e.g., bans). Hold that the *feeling* arises *because* the individual perceives the market logic as incompatible with the sustaining norm *before* widespread decay occurs; it's reactive, not constitutive. Banning based on it *does* cause harm.  
      **Softest:** Proving the feeling *precedes and predicts* decay rather than accelerates it.
