  Finally, the hoped-unasked question: What if repugnance is the decay? This flips their thesis by suggesting disgust causes institutional erosion. Brutal because it attacks core framing. Reply must distinguish reactive vs constitutive roles of disgust. Dangerously soft.

  Prioritizing: 1) Alarm-function challenge (psychologists) 2) Crowding-out contingency (economists) 3) Proposal effectiveness 4) Institutional romanticism 5) Repugnance-as-decay (nightmare question). The nightmare question gets marker.

