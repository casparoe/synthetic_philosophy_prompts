prompt: |-
  I'm in a reading group this year where some of us are in an ethics seminar and some of us are doing Buddhist studies, and I've ended up with a stack of gut verdicts that I can't get to line up. I don't need a survey of the field — I've read enough of the back-and-forth over whether Buddhist ethics is really a virtue ethics or really a consequentialism to know that both answers get floated and both get attacked. What I want is whether there's an actual principle under my own intuitions or whether some of them have to be thrown out. Here's the list and where I landed: the skillful-means case where the ship captain (a bodhisattva in a former life) kills the bandit who's about to slaughter five hundred people aboard — right, even praiseworthy. The monastic case where a group of monks, having spent a retreat contemplating the foulness of the body, got so disgusted that they killed themselves or paid someone to do it, and it was ruled an offense that ends your monastic life — also correct. The version of that where the monks just talk up death to a sick monk until he dies, and they're held as guilty as if they'd held the blade — fine, except I notice I'm half-judging them by what would have happened to the man otherwise, which is scoreboard thinking, and half by their minds, which isn't. A guy who shoots at a rival, misses, and harms nobody: exactly as blameworthy as if he'd hit. Two people who kill out of identical rage with identical histories, one killing a market porter and one killing a monk who's been in retreat for forty years: the second is much worse, and this one bugs me, because if the mind is what's recorded, why should the victim's status change the weight? A man who funds a hospital purely for prestige, and the hospital really does save a lot of people: I want to say the act isn't good, or is only accidentally good, despite the suffering removed. A monk who breaks a training rule in secret, harms nobody, is never found out, feels no remorse: still bad. A bodhisattva who puts off her own liberation to stay and help others: good, even though it costs her.

  Here's what I suspect is going on, using a coinage from a friend that I can't stop reaching for. Call it the ledger versus the scoreboard. The scoreboard is the standard consequentialist tally — how much suffering and how much clarity is in the world after you act, whoever's in it. The ledger is a record that keeps itself: what the act did to your own continuum and to the trajectories of the particular beings you touched, entered whether or not anyone evaluates you and whether or not the worldly result lands. Looking back, the ones I called fine seem to run on the ledger — the shooter who misses, the secret rule-breaker, the prestige hospital — while the captain and the sick monk pull me onto the scoreboard. The victim-status case runs on neither cleanly. But the real mess is the captain-euthanasia pair: on the surface it's the same structure, a killing performed with a calm, compassionate mind that spares a lot of people a lot of misery, and I say one is meritorious and the other is about the worst thing you can do. I've tried patching it by saying the captain's compassion extended to the bandit and not just the five hundred — killing him prevented the eons of demerit he was on his way to — whereas the monks talking up death are just relieving physical misery that was ending on its own anyway, and maybe robbing a being of the opportunity the remaining life would have given him. But I honestly don't know if that's a principle or a story I invented after the fact. It feels a bit like a rule I'd only accept if it also explained the porter-versus-retreat-monk case, which I'm not sure it does.

  So — is there a principle, single or two-part, that gets all of these, or nearly all? State it so it actually predicts something rather than just restating the cases with fancier vocabulary, and say what it commits you to about the ledger/scoreboard question: does one of the two do all the explaining, or do I genuinely have to carry two ledgers and accept they can conflict? Then run it on three cases I keep flip-flopping on: a surgeon who harvests organs from a healthy traveler to save five patients, doing it without any hatred and purely out of concern for the five; a teacher who lies to a student about her talent to keep her at it, and the lie pays off; and a practitioner who spends forty years generating goodwill toward every being in the universe with zero observable effect on any of them. Give me the verdict the principle delivers on those even if it's not the one I want. And be straight about which of my original verdicts it can't accommodate — if saving all eight means adding clauses until nothing is falsifiable, tell me which verdict goes. Last thing: whatever you land on, does the result count as a consequentialism with an unusual theory of value, or has it stopped being consequentialism somewhere along the way, and where? No bibliography needed, I just want the reasoning, and you can use unskillfull and skillful in the technical sense if it's handy.
reasoning: |-
  Okay, let me try to unpack this user's dilemma. They're grappling with conflicting intuitions about ethical cases from Buddhist studies and ethics seminars. The key issue is reconciling their gut reactions to various scenarios, which seem to pull between consequentialist outcomes and something more like karmic or virtue-based accounting. 

  First, I need to map their stated intuitions clearly. The ship captain killing a bandit feels praiseworthy, while monks assisting suicide is deeply wrong. The failed shooter is as blameworthy as a successful one, but killing a holy monk feels worse than killing a porter despite identical intent. The hospital built for prestige seems morally hollow, and secret rule-breaking remains bad regardless of consequences. The bodhisattva's delay of liberation is good even at personal cost. 

  Hmm... their "ledger vs scoreboard" framing is insightful. The ledger tracks personal karmic imprints and effects on specific beings' trajectories, while the scoreboard measures net worldly consequences. Their tension peaks with the captain/euthanasia pair: both involve compassionate killing to prevent suffering, yet their judgments diverge radically. Their attempted patch (about the bandit's future demerit vs the sick monk's lost opportunities) feels ad hoc to them - rightly so, since it doesn't explain the porter/monk asymmetry.

  The core challenge is finding a principle that doesn't just restate intuitions. Let me test the "Three Roots" framework from Abhidharma: non-greed, non-hatred, non-delusion as bases for skillfulness. For the captain: killing rooted in compassion (non-hatred) and wisdom (non-delusion about karmic prevention). For the suicidal monks: rooted in aversion (disgust) and delusion (misunderstanding suffering's nature). That resolves the surface contradiction without outcome-dependence. 

  But does this handle the hard cases? The surgeon harvesting organs: even with good intentions, it's delusional (ignoring karmic harm to traveler and recipients) and violates non-greed (exploiting one for others). The lying teacher: skillful if rooted in non-delusion (seeing student's potential) and compassion, but risks delusion if overestimating benefits. The goodwill practitioner: purely skillful roots regardless of observable effects - karmic purity matters more than measurable impact.

  Ah, and the victim-status asymmetry: killing a holy being creates worse karmic imprints because it damages countless beings' connection to wisdom (ledger effect), not just the direct consequence (scoreboard). This finally explains why porter vs monk differs despite identical intent. 

  The ledger clearly dominates here - intention and karmic ripple effects outweigh net consequences. This framework preserves all their original verdicts except possibly the prestige hospital: if the act inadvertently aids beings, does that create *some* merit? But the user's intuition rejects this, and the root-based view agrees: greed-driven action remains unskillful regardless of outcomes. 

  Is this consequentialist? Only if "consequences" include karmic imprints and trajectory-shifts. By worldly standards, it's virtue ethics; by Buddhist standards, it's karmic causality with wisdom as the North Star. The surgeon case confirms the break from utilitarianism: no outcome justifies violating fundamental precepts when rooted in delusion. 

  ...I think this holds. The Three Roots principle predicts their intuitions systematically, avoids post-hoc patches, and elevates the ledger without denying the scoreboard's existence - just subordinating it to karmic causality. Time to structure the reply around this.
answer: |-
  Your intuitions aren't chaotic—they point toward a **karmic-virtue hybrid** principle rooted in *intention*, *object*, and *the nature of the act itself*, prioritizing the transformation of the *mindstream* (the "ledger") while acknowledging *contextual consequences* (the "scoreboard") as secondary but not irrelevant. Here's the principle:

  **The Threefold Root Principle:**  
  An act is karmically skillful (kusala) if it is rooted in non-greed, non-hatred, and non-delusion *and* aligns with the ultimate liberation of beings. Its weight depends on:  
  1. **The quality of intention** (the mental root: e.g., compassion vs. aversion).  
  2. **The nature of the object/act** (its intrinsic tendency: e.g., killing vs. generosity; the purity/status of beings affected).  
  3. **The context** (immediate consequences, long-term karmic trajectories, and whether the act upholds or undermines conditions for awakening).

  This **elevates the ledger** (karmic imprint, mindstream transformation) as primary but **integrates the scoreboard** (worldly consequences) through the lens of (3). The ledger isn't just "your record"; it’s the *actual alteration of causal relationships* between minds.

  ---

  ### **Reconciling Your Cases**
  1. **Ship captain kills bandit:**  
     - **Root:** Compassion (non-hatred) + Wisdom (non-delusion: prevents bandit’s heavy karma & saves 500).  
     - **Object/Act:** Killing (negative tendency), but bandit’s imminent act makes him a "negative object" mitigating harm.  
     - **Context:** Prevents vast suffering *and* creates conditions for liberation (bandit avoids hell, 500 live).  
     → **Skilful (ledger + scoreboard align).**

  2. **Monks assist suicide:**  
     - **Root:** Aversion (hatred disguised) + Delusion (misunderstanding suffering/rebirth).  
     - **Object/Act:** Killing (negative) + Violation of monastic code.  
     - **Context:** Robs the sick monk of potential for awakening; reinforces delusion.  
     → **Profoundly unskilful (ledger dominates; scoreboard irrelevant).**

  3. **Shooter misses:**  
     - **Root:** Identical hatred as if he hit.  
     - **Object/Act:** Attempted killing (same intrinsic negativity).  
     - **Context:** Luck doesn’t purify intention.  
     → **Equal blame (ledger only).**

  4. **Killing porter vs. enlightened monk:**  
     - **Root:** Identical hatred.  
     - **Object/Act:** Killing a being *dedicated to liberation* creates vastly worse karma—it damages the conditions for awakening for countless others who rely on that wisdom.  
     → **Worse for the monk (ledger: object’s status amplifies karmic weight).**

  5. **Prestige hospital:**  
     - **Root:** Greed (desire for status).  
     - **Object/Act:** Generosity (positive tendency), but root poisons it.  
     - **Context:** Saves lives (scoreboard positive), but reinforces donor’s delusion.  
     → **Accidentally beneficial, but unskilful root (ledger: corrupted act).**

  6. **Secret rule-breaker:**  
     - **Root:** Lack of heedfulness (delusion).  
     - **Object/Act:** Violation of training (weakens commitment to path).  
     - **Context:** No external harm, but erodes personal integrity.  
     → **Unskilful (ledger: self-degradation).**

  7. **Bodhisattva delays liberation:**  
     - **Root:** Compassion + Wisdom (non-attachment to personal gain).  
     - **Object/Act:** Sacrifice for others (positive).  
     - **Context:** Maximizes conditions for others’ awakening.  
     → **Supremely skilful (ledger + scoreboard align).**

  ---

  ### **Resolving Your "Mess" (Captain vs. Euthanasia)**
  Your patch holds under the principle:  
  - **Captain:** Kills *to prevent greater harm to the victim himself* (karmic trajectory) *and* others. Rooted in wisdom about karma.  
  - **Monks:** Kill *out of aversion*, targeting a victim whose suffering could have been a cause for awakening. Rooted in delusion.  
  **→ The difference is in the root & context, not the surface structure.**

  ---

  ### **Verdicts on New Cases**
  Apply the **Threefold Root Principle**:

  1. **Surgeon harvests organs from traveler:**  
     - **Root:** Compassion for five, but *delusion* (ignoring karmic law & intrinsic wrong of killing).  
     - **Object/Act:** Killing an innocent (grave negative tendency).  
     - **Context:** Saves five (scoreboard positive), but undermines trust in medicine and sanctity of life.  
     → **Profoundly unskilful.** Rooted in delusion; object/act outweighs outcome.  

  2. **Teacher lies about student’s talent:**  
     - **Root:** Compassion + *delusion* (assuming ends justify means; distrusting student’s resilience).  
     - **Object/Act:** Lying (negative tendency, breaks trust).  
     - **Context:** If the student succeeds *due to confidence*, the lie had a beneficial role—but risks collapse if discovered.  
     → **Ambiguous but leaning unskilful.** Delusion taints the act; truthfulness (right speech) is intrinsic to the path.  

  3. **Practitioner generates goodwill with no observable effect:**  
     - **Root:** Pure compassion (non-greed, non-hatred, non-delusion).  
     - **Object/Act:** Mental cultivation (positive tendency).  
     - **Context:** No measurable impact, but transforms *their* mindstream and subtle karmic interconnections.  
     → **Highly skilful.** Ledger is primary; the act is intrinsically purifying regardless of visible outcomes.  

  ---

  ### **What Gets Sacrificed?**
  - **The prestige hospital’s "accidental goodness":** Under this principle, the act’s *root* makes it unskilful despite saving lives. You must drop the intuition that "good results = some moral credit." The scoreboard is secondary.  
  - **"Identical minds, identical weight":** The porter/monk case forces acceptance that *the object’s nature* modifies karma. Your intuition that "only mind matters" is incomplete.  

  ---

  ### **Is This Consequentialism?**
  **No—it’s a karma-based virtue ethic.**  
  - **Why not consequentialism?** The "good" isn’t defined by states of the world (e.g., suffering reduced) but by *the quality of mind cultivated and its alignment with awakening*. The surgeon case is decisive: saving five lives doesn’t justify killing one, because the act itself and its roots are unskillful.  
  - **Where it breaks:** When consequences directly impact karmic trajectories (e.g., captain preventing bandit’s hell rebirth), consequences matter—but only as *one factor* in context, subordinate to roots and nature.  
  - **Theory of value:** "Skillfulness" (kusala) is the value—defined by freedom from defilements and progress toward liberation.  

  **The ledger wins, but the scoreboard is a page within it.** Your intuitions hold because you sense that karma is neither dry rules nor mere outcomes—it’s the dynamic interplay of mind, action, and the fabric of conditionality itself.
