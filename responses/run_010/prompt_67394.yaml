prompt: |-
  Some background, then the ask. I moved into a 70-unit housing co-op in the spring and in October I got talked onto the board, where apparently my job is drafting rule changes before the monthly membership meeting. Turns out we touch the house rules almost every single month — guest limits, quiet hours, subletting, the laundry sign-up, whether the steward can let herself into your unit, how many chore hours you owe, who gets the spare parking spot. The argument is the same every time: somebody says the rule is controlling and treats grown adults like children, somebody else says that without it the loudest four households make the place unlivable for everybody, and then we take a vote at 9:40pm with six tired volunteers and thirty residents in a basement room.

  I've been reading a little around the three-way split between freedom as non-interference, freedom as actually having the capacity and the resources to do the thing, and freedom as non-domination — that last one being about living under someone's arbitrary will even when they never once actually interfere, the kind master who's perfectly nice. I think that vocabulary would sort a lot of our arguments, or at least tell us which kind of fight we're having. But I don't have the theory in my head well enough to run it live in a meeting, and nobody else on the board has read any of it, so a procedure that requires me to explain republicanism to a plumber at 9pm is a non-starter.

  So: write me a decision procedure my board can run on any proposed rule change. I want the questions in the order we should ask them, and for each one, what counts as a sufficient answer versus a hand-wave — "ask whether the power is arbitrary" is not usable, I need something a person can actually say out loud and get a yes or no from. I want the terminal outcomes marked clearly: rule is fine as written, rule is fine if you change this feature of it, rule has to die, and here-is-a-values-question-so-stop-and-put-it-to-a-vote. Our bylaws need a two-thirds membership vote for any rule change, and I have maybe fifteen minutes per rule, so budget for that.

  Then tell me, honestly:

  - which of the three conceptions of freedom is doing the real work in your checklist, and whether one of them earns its place at all or is just decoration once you translate it into questions you can answer about a guest log
  - which distinctions from the theory you deliberately dropped because they can't survive at board-meeting speed, and what we lose by dropping them
  - where you expect the procedure to misfire. My guess: it flags every rule that gives a named human being discretion, and a co-op physically cannot run without discretion, so I need to know how to write discretion into a rule so it passes rather than just getting a wall of failures
  - what the procedure cannot do, including whether it can ever tell us how much interference a rule is worth

  Then run it on three live proposals, showing the answers to each question, not just the verdict:

  1. Overnight guests capped at six nights per month per unit, guests registered by name with the steward, steward keeps the log, and any resident can petition the board for an exception.
  2. If a resident hasn't been seen or heard from in 48 hours and doesn't answer the door, the steward may enter with the spare key — no notice, no second person present, no report filed afterward. This one is mine. I wrote it after an elderly member fell and lay there overnight, and I like it, so don't soften the result; if the procedure says the thing I'm worried it says, say it and then tell me what a version of the rule that survives would look like.
  3. Four hours of community work per month per household, assigned by the work coordinator, who can also excuse households for any reason she thinks adequate.

  Finally — one thing I care about a lot: don't let the procedure quietly import the values of one side of our argument and present them as steps. If a step assumes that being left alone is the default and any rule has to justify itself, or the opposite, I want that flagged as a judgment call dressed up as procedure, because that's the exact move people use to win votes here. And keep it to something I could hand to a new board member in the fall without me standing next to them explaining it, not a essay.
reasoning: |-
  We are designing a decision procedure for proposed rule changes in a housing co-op. The procedure must be practical, taking no more than 15 minutes per rule, and must be understandable without theoretical background. The goal is to evaluate rules based on the three conceptions of freedom (non-interference, capacity/resources, non-domination) without requiring explicit discussion of the theory.

  The core idea is to break down the rule into a series of concrete questions that can be answered with yes/no or with clear criteria. The procedure should lead to one of four outcomes:
  A. Rule is fine as written.
  B. Rule is fine if amended (specify what change is needed).
  C. Rule should be rejected.
  D. The issue is a values question that must be put to a vote.

  Key considerations:
  - We must avoid importing the values of one side (e.g., assuming non-interference as default or collective control as default).
  - We need to handle discretion in rules, because some discretion is necessary but arbitrary power is problematic.
  - The procedure should flag when a rule creates a high risk of domination or unfairness.

  We'll design a checklist of questions. For each question, we'll specify what counts as a sufficient answer and what is insufficient (hand-wave).

  The three conceptions of freedom:
  1. Non-interference (negative liberty): absence of constraints imposed by others.
  2. Capacity/resources (positive liberty): having the means and ability to do things.
  3. Non-domination (republican liberty): not being subject to the arbitrary will of others, even if they don't interfere.

  We will translate these into practical questions without theory jargon.

  Proposed Decision Procedure:

  Step 1: Identify the rule's purpose.
     - Question: "What problem is this rule trying to solve? Is there a clear, specific harm or issue that the rule addresses?"
     - Sufficient: A specific, observable problem that has occurred or is highly likely to occur in the co-op. (e.g., "There have been three incidents in the past year where long-term guests caused parking shortages and noise complaints.")
     - Insufficient: Vague concerns (e.g., "People might take advantage") without co-op-specific evidence.

  Step 2: Check for overbreadth.
     - Question: "Is the rule narrowly tailored to address the problem without restricting more than necessary? Could we achieve the same goal with less restriction?"
     - Sufficient: The rule targets only the problematic behavior and leaves other behaviors free. If there is a less restrictive alternative that would solve the problem, it should be considered. (e.g., "Instead of banning all overnight guests, we could require registration only for guests staying more than three nights.")
     - Insufficient: The rule restricts behavior that isn't connected to the problem.

  Step 3: Check for safeguards against arbitrary application.
     - Question: "Does the rule include clear criteria for when it applies and how decisions are made? If it gives discretion to a person, are there guidelines to prevent arbitrary use?"
     - Sufficient: Clear, objective criteria are provided, or if discretion is needed, there are written standards, a requirement for explanation, and an appeal process. (e.g., "The work coordinator must assign chores based on a published rotation and can excuse only for medical reasons, with a doctor's note, and the resident can appeal to the board.")
     - Insufficient: Unchecked discretion (e.g., "for any reason she thinks adequate" without guidelines).

  Step 4: Check for impact on basic living.
     - Question: "Does the rule significantly interfere with a resident's basic use of their home or essential activities? If so, is the interference justified by a serious problem?"
     - Sufficient: The rule does not impede basic living, or if it does, the problem it solves is severe and the interference is proportional. (e.g., "Limiting overnight guests to six nights might interfere with having family visit, but the problem of overcrowding and noise is severe enough to justify it.")
     - Insufficient: The rule causes major inconvenience or hardship without a corresponding serious problem.

  Step 5: Check for vulnerability to abuse.
     - Question: "Could this rule be used to harass or target specific residents? Are there protections against that?"
     - Sufficient: The rule applies equally to all, and there are mechanisms to prevent targeting (e.g., anonymous reporting is not allowed, or decisions must be documented and reviewed). 
     - Insufficient: The rule allows for selective enforcement without oversight.

  Step 6: Check for due process.
     - Question: "If the rule involves penalties or enforcement, does it provide a fair process for the resident to respond before facing consequences?"
     - Sufficient: Notice and an opportunity to be heard are provided before any penalty. (e.g., "Before imposing a fine, the board must hold a hearing.")
     - Insufficient: Penalties are applied without warning or a chance to explain.

  Step 7: Check for resource equity.
     - Question: "Does the rule create an unequal burden, falling more on some residents than others? If so, is there a way to mitigate it?"
     - Sufficient: The rule distributes burdens fairly or provides accommodations for those disproportionately affected. (e.g., "Chore assignments consider physical ability.")
     - Insufficient: The rule ignores known disparities (e.g., a rule that requires heavy lifting from elderly residents).

  After these steps, we determine the outcome:
  - If all steps are satisfied: A (rule is fine as written).
  - If one or two steps are not satisfied but can be fixed by amending the rule: B (rule is fine if amended, with specific changes).
  - If three or more steps are not satisfied, or if one step has a critical failure that cannot be fixed without fundamentally changing the rule: C (rule has to die).
  - If at any point the board cannot agree on the answers because the issue is fundamentally about values (e.g., how much collective control is acceptable), then D (put to a vote).

  Now, let's analyze which conception of freedom is doing the real work:
  - Step 1 and 2 are about non-interference: they ask whether the interference is necessary and minimal.
  - Step 3 and 5 are about non-domination: they focus on preventing arbitrary power and abuse.
  - Step 4 and 7 touch on capacity/resources: they consider whether the rule creates barriers to basic living or unfair burdens.
  But non-domination (steps 3 and 5) is central because it addresses the risk of domination, which is a major concern in the co-op context. The capacity/resources aspect is less prominent because we are dealing with rules that often restrict rather than provide resources. However, step 7 does address resource equity.

  Distinctions dropped:
  - We do not explicitly separate the three freedoms. We merged them into practical questions. We lose the ability to have a nuanced philosophical debate, but gain practicality.
  - We do not explicitly discuss the "kind master" scenario (non-domination without interference) because in practice, we focus on the risk of arbitrary power (step 3) which covers it.

  Where the procedure might misfire:
  - It might flag all discretionary rules. To pass, a rule with discretion must include safeguards (step 3): clear criteria, guidelines, and an appeal process. So we can write discretion that passes by building in these features.

  What the procedure cannot do:
  - It cannot quantify how much interference is worth it. That is a values judgment. Step 4 requires a judgment about proportionality, and if the board disagrees, it goes to a vote (step D).
  - It cannot resolve fundamental values conflicts; it can only structure the discussion and identify when a vote is needed.

  Now, run the procedure on the three proposals:

  Proposal 1: Overnight guests capped at six nights per month per unit, guests registered by name with the steward, steward keeps the log, and any resident can petition the board for an exception.

  Step 1: Purpose? 
     - Problem: Overcrowding, noise, parking issues from long-term guests. 
     - Sufficient? Assuming evidence of past issues (e.g., complaints), this is sufficient.

  Step 2: Overbreadth? 
     - The cap of six nights might be too low for some (e.g., family visits). Less restrictive alternative? Could have a higher cap or require registration only after a certain number of nights. 
     - Answer: It may be overbroad if there are less restrictive ways. (e.g., "Require registration for guests staying more than 3 nights, and cap at 10 nights.")

  Step 3: Safeguards against arbitrary application?
     - The steward keeps the log, but there is an exception process: residents can petition the board. This provides oversight. However, the exception process is vague. What criteria for exceptions? 
     - Insufficient: The rule does not specify what grounds for an exception are allowed. Risk of arbitrary board decisions.
     - Improvement: Specify criteria (e.g., medical necessity, family emergencies) and require the board to state reasons.

  Step 4: Impact on basic living?
     - Might interfere with having family stay. But six nights per month might be reasonable for most. However, for residents with family far away, it might be a burden. 
     - Proportional? If the problem is severe, it might be.

  Step 5: Vulnerability to abuse?
     - The log is kept by the steward. Could the steward misuse the information? Also, any resident can petition, which might lead to targeting. 
     - Insufficient: No protection against malicious petitions. The rule should require that petitions be based on a rule violation (e.g., exceeding the cap) and not personal grievances.

  Step 6: Due process?
     - If someone violates the rule, what happens? The rule doesn't specify penalties or process. 
     - Insufficient: Missing enforcement procedure.

  Step 7: Resource equity?
     - Applies equally, but larger households might have more guests? Not necessarily inequitable.

  Outcome: 
  - Step 3 and 6 are weak. Step 5 also needs improvement. 
  - Amendable: 
     - Add criteria for exceptions (step 3).
     - Add an enforcement procedure with notice and hearing (step 6).
     - Add that petitions must state a specific rule violation (step 5).
  - So B: Rule is fine if amended.

  Proposal 2: If a resident hasn't been seen or heard from in 48 hours and doesn't answer the door, the steward may enter with the spare key — no notice, no second person present, no report filed afterward.

  Step 1: Purpose?
     - Specific problem: resident health and safety (e.g., elderly member fell). Sufficient.

  Step 2: Overbreadth?
     - The trigger is 48 hours without contact. Is this the least restrictive? What about checking with neighbors or calling first? 
     - Insufficient: Less restrictive alternatives exist (e.g., attempt phone contact, check with emergency contact, look through windows). The rule should require attempts to contact and assess before entry.

  Step 3: Safeguards against arbitrary application?
     - The steward has sole discretion to decide when to enter, with no criteria beyond "not seen or heard" and no report. 
     - High risk of arbitrariness. 
     - Insufficient: No guidelines for what "not seen or heard" means (e.g., must have a specific concern from someone, not just absence). Also, no requirement for a second person or report.

  Step 4: Impact on basic living?
     - This rule is for emergencies, so interference is high (entering home) but justified if truly an emergency. However, false alarms could violate privacy.

  Step 5: Vulnerability to abuse?
     - Very high. The steward could enter under false pretenses. No oversight. 
     - Insufficient: No witness or report requirement makes abuse easy.

  Step 6: Due process?
     - No process: entry without notice and no report afterward. 
     - Insufficient: At minimum, a report should be filed and given to the resident afterward.

  Step 7: Resource equity?
     - Applies to all, but might affect those who are less social more. However, the concern is universal.

  Outcome:
  - Multiple failures: Steps 2, 3, 5, 6 are not satisfied. Critical failure in step 3 and 5.
  - Amendment might not be enough? But let's try: 
     - Require attempts to contact (step 2).
     - Require two people to agree on entry (step 3 and 5).
     - Require a report to be filed and given to the resident (step 6).
     - Define "not seen or heard" more clearly (e.g., after a report of concern from a neighbor or family member).
  - A version that survives: 
     "If a resident hasn't been seen or heard from in 48 hours and doesn't answer the door, the steward must first attempt to contact the resident by phone and emergency contact. If there is no response and there is reason to believe the resident is in distress, the steward must obtain agreement from one other board member and then may enter with the spare key, accompanied by a second person. A written report must be filed within 24 hours and given to the resident."

  Proposal 3: Four hours of community work per month per household, assigned by the work coordinator, who can also excuse households for any reason she thinks adequate.

  Step 1: Purpose?
     - Shared maintenance of the co-op. Sufficient.

  Step 2: Overbreadth?
     - Four hours may be reasonable. But assignment by coordinator: could it be more flexible? (e.g., self-scheduling). Not necessarily overbroad.

  Step 3: Safeguards against arbitrary application?
     - The work coordinator can excuse "for any reason she thinks adequate" — no criteria. 
     - High risk of arbitrariness and favoritism. 
     - Insufficient: Must have guidelines (e.g., excuses only for health, travel, or other defined reasons).

  Step 4: Impact on basic living?
     - Four hours per month is likely manageable. But if assignments are at inconvenient times, it could be a burden. 
     - The rule should require reasonable accommodation.

  Step 5: Vulnerability to abuse?
     - Yes: the coordinator could excuse friends and assign unpleasant tasks to others. 
     - Insufficient: No oversight or appeal.

  Step 6: Due process?
     - If a resident fails to do chores, what penalty? Not specified. Also, if the coordinator assigns unfairly, no recourse. 
     - Insufficient: Need a process to challenge assignments or penalties.

  Step 7: Resource equity?
     - Might burden those with disabilities or irregular work schedules. 
     - Insufficient: The rule should require the coordinator to consider individual circumstances (but the excuse power is arbitrary).

  Outcome:
  - Steps 3, 5, and 6 are weak. 
  - Amendable: 
     - Limit the excuse power to specific reasons (step 3).
     - Add an appeal process for assignments and penalties (step 6).
     - Require the coordinator to publish a fair method for assignments (step 5).
  - So B: Rule is fine with amendments.

  Finally, we note that the procedure does not assume non-interference as the default. It starts by requiring a problem (step 1) and then asks whether the rule is necessary and well-designed. This is neutral: the rule must justify itself by solving a problem, but the problem might be interference by others (freedom as non-interference) or lack of resources (freedom as capacity). The procedure tries to balance individual and collective interests.

  The procedure can be handed to a new board member. It's a checklist of seven questions with clear pass/fail criteria and an outcome decision tree.
answer: |-
  Below is a decision procedure designed for your board, structured as a step-by-step checklist. It translates the three conceptions of freedom (non-interference, capacity/resources, non-domination) into practical, answerable questions without theory jargon. Each question is phrased for a yes/no answer in a meeting, with clear criteria for passing ("sufficient") or failing ("hand-wave"). The procedure takes 10–15 minutes per rule, respects your bylaws (e.g., two-thirds vote requirement), and delivers one of four outcomes:  
  - **A. Rule is fine as written.**  
  - **B. Rule is fine if amended** (with specific changes noted).  
  - **C. Rule should be rejected.**  
  - **D. Stop and put to a vote** (fundamental values conflict).  

  The questions are ordered to quickly surface dealbreakers (e.g., arbitrariness) before finer details. Crucially:  
  - **No values are imported.** The procedure doesn't assume "leave people alone" or "control for the collective" as the default. It starts neutrally by forcing a clear problem statement (Step 1), then balances restrictions against safeguards.  
  - **Discretion is allowed** but must be constrained (Step 3).  
  - **Outcomes are determined by tallying failures:**  
    - 0–1 failures → **A**  
    - 2 failures → **B** (amendable with fixes)  
    - 3+ failures → **C** (reject)  
    - If any step triggers **D** (unresolvable values clash), stop and vote.  

  ---

  ### **Decision Procedure Checklist**  
  **Run each question in order. Stop early only for Outcome D.**  

  1. **Problem Clarity**  
     - *Question:* "Is there a specific, recent example of harm (not a ‘what if’) that this rule fixes? If not, is the harm obvious and urgent (e.g., safety risk)?"  
     - **Sufficient:** Yes + concrete example (e.g., "Last year, unlimited guests caused 3 noise complaints") or obvious/urgent harm (e.g., "Unchecked entry could prevent deaths").  
     - **Hand-wave:** Vague fears (e.g., "People might abuse it") or no co-op-specific reasoning.  
     - *Why?* Ensures rules solve real problems, not hypotheticals. Neutral start—no assumption that rules are "guilty until proven innocent."  

  2. **Proportional Burden**  
     - *Question:* "Does the burden of the rule (e.g., time, cost, privacy loss) fit the harm? Could a simpler, less burdensome option work?"  
     - **Sufficient:** Yes + burden is minor (e.g., signing a guest log) OR burden is high but harm is severe (e.g., safety rule). Less burdensome alternatives (e.g., "Phone calls before entry") are considered but rejected for good reason.  
     - **Hand-wave:** Burden feels excessive for the problem (e.g., "6-night guest cap fixes parking" when parking isn’t scarce) or no discussion of alternatives.  
     - *Why?* Weighs interference against harm. Avoids "control for control’s sake."  

  3. **Discretion Safeguards**  
     - *Question:* "If the rule gives power to a person (e.g., steward, coordinator), are there clear, objective criteria for decisions? Is there a way to appeal or review?"  
     - **Sufficient:** Yes + criteria exist (e.g., "Excuses only for medical reasons") AND appeal/review (e.g., "Resident can appeal to the board").  
     - **Hand-wave:** Subjective criteria (e.g., "any reason she thinks adequate") or no appeal.  
     - *Why?* Targets non-domination: unchecked discretion = arbitrary power, even if unused.  

  4. **Equal Treatment**  
     - *Question:* "Could this rule be applied unevenly (e.g., to favor friends or target enemies)? Are there guardrails to prevent that?"  
     - **Sufficient:** Yes + protections exist (e.g., "Decisions must be documented" or "Anonymous complaints not allowed").  
     - **Hand-wave:** Rule enables targeting (e.g., "Any resident can petition" without evidence) and has no guardrails.  
     - *Why?* Prevents domination via harassment or favoritism.  

  5. **Due Process**  
     - *Question:* "If the rule penalizes residents (e.g., fines, entry), does it require notice and a chance to respond before action?"  
     - **Sufficient:** Yes + process described (e.g., "Warning before fines" or "Report filed after emergency entry").  
     - **Hand-wave:** Penalties applied without warning or chance to explain.  
     - *Why?* Fairness foundation. "Notice" can be retroactive for emergencies (e.g., filing a report after entry).  

  6. **Unintended Exclusion**  
     - *Question:* "Could this rule unfairly burden some groups (e.g., parents, disabled, night workers)? If yes, are there accommodations?"  
     - **Sufficient:** Yes + accommodations (e.g., "Chore alternatives for disabled") OR no disproportionate burden.  
     - **Hand-wave:** Ignores a known disparity (e.g., rigid chore times with no flexibility).  
     - *Why?* Addresses capacity/resources: rules shouldn’t de facto exclude people.  

  7. **Practicality**  
     - *Question:* "Can we realistically enforce this? Does it create more work than it solves?"  
     - **Sufficient:** Yes + enforcement is feasible (e.g., "Log takes 5 mins/week") OR harm is big enough to justify effort.  
     - **Hand-wave:** Rule is unenforceable (e.g., "Track all guest movements") or creates bureaucracy.  
     - *Why?* Grounds the rule in reality.  

  **Outcome Determination:**  
  - All steps **sufficient** → **A**  
  - **1–2 hand-wave answers** → **B** (amend to fix failures, then it passes)  
  - **3+ hand-wave answers** → **C**  
  - **D (values vote):** Triggered if the board deadlocks on Step 1 (disagree on the problem’s severity) or Step 2 (disagree on burden vs. harm tradeoff). *Don’t vote on other steps—amend until failures <3.*  

  ---

  ### **Analysis of the Procedure**  
  **1. Which conception of freedom is doing the real work?**  
  - **Non-domination (Step 3 and 4)** is the workhorse. It forces scrutiny of arbitrary power, which is your co-op’s core tension ("controlling vs. chaos").  
  - **Non-interference (Step 2 and 5)** handles burden/penalties but is secondary—it’s only a problem if disproportionate or unfair.  
  - **Capacity/resources (Step 6)** is least central but ensures rules don’t exclude people. It’s not "decoration" (e.g., chore rules failing Step 6 exposes real inequity), but it’s narrower.  
  - *Why this balance?* Co-ops require rules to function, so non-interference isn’t king. But unconstrained power (non-domination) is the recurring risk.  

  **2. What distinctions were dropped, and what’s lost?**  
  - **Dropped:** Explicit separation of the three freedoms. Also, "freedom as capacity" was simplified to exclusion risk (Step 6), ignoring broader empowerment (e.g., "does this rule help us thrive?").  
  - **Loss:** Nuance in diagnosing conflicts. For example, a fight over "guest limits" might blend non-interference (privacy) and non-domination (steward power), but the procedure isolates these into Steps 2 and 3. The cost is speed—you lose philosophical depth but gain actionable clarity.  

  **3. Where will it misfire?**  
  - **Misfire:** Over-flagging discretion (Step 3). Co-ops need human judgment (e.g., assigning chores).  
  - **Fix:** Build safeguards into rules. For discretion to pass Step 3:  
    - Add objective criteria (e.g., "Excuses require medical proof").  
    - Require transparency (e.g., "Decisions documented in a log").  
    - Include appeals (e.g., "Appeal to the board within 7 days").  
    Example: "Work coordinator may excuse households for medical reasons, with documentation filed publicly; residents may appeal to the board."  

  **4. What can’t it do?**  
  - **Can’t quantify interference:** It flags imbalance (Step 2) but can’t say "how much burden is too much"—that’s a values call (hence Step 2 may trigger Outcome D).  
  - **Can’t resolve deep values splits:** If your board is 50/50 on "collective control vs. individual freedom," the procedure forces a vote (Outcome D) but won’t bridge the gap.  
  - **Can’t handle cultural factors:** E.g., a rule that’s technically fair but feels "paternalistic" in your co-op’s culture may still pass.  

  ---

  ### **Live Examples**  
  *Using the procedure on your proposals. Answers are simulated for illustration.*  

  **Proposal 1:** Overnight guests capped at six nights per month per unit, guests registered by name with the steward, steward keeps the log, and any resident can petition the board for an exception.  
  - **Step 1 (Problem):** Sufficient. Assume evidence: "Last year, 10+ night stays caused parking shortages."  
  - **Step 2 (Burden):** Hand-wave. Burden (tracking nights) might fit if parking is scarce, but "6 nights" is arbitrary—no discussion of alternatives (e.g., 8 nights).  
  - **Step 3 (Discretion):** Hand-wave. Exceptions exist, but no criteria for board decisions (e.g., what counts as a valid petition?).  
  - **Step 4 (Equal Treatment):** Hand-wave. "Any resident can petition" could enable targeting (e.g., harassing a neighbor). No guardrails.  
  - **Step 5 (Due Process):** Sufficient. Petitions imply a hearing; no immediate penalty.  
  - **Step 6 (Exclusion):** Sufficient. No clear burden on groups (if families need more nights, they can petition).  
  - **Step 7 (Practicality):** Sufficient. Log is feasible.  
  - **Failures:** 3 hand-waves (Steps 2, 3, 4).  
  - **Outcome: C (reject).** *But since you asked not to soften:* To pass, amend: (1) Raise cap to 8 nights or add flexibility (fix Step 2), (2) Set exception criteria (e.g., "medical/family emergencies only") (fix Step 3), (3) Require petitions to include evidence (e.g., "guest exceeded cap") (fix Step 4).  

  **Proposal 2:** If a resident hasn’t been seen or heard from in 48 hours and doesn’t answer the door, the steward may enter with the spare key—no notice, no second person, no report.  
  - **Step 1 (Problem):** Sufficient. Clear harm: "Elderly member fell and lay undiscovered overnight."  
  - **Step 2 (Burden):** Hand-wave. Entry is a severe burden; less restrictive options exist (e.g., call emergency contacts first) but aren’t required.  
  - **Step 3 (Discretion):** Hand-wave. "Not seen or heard" is vague; no criteria for steward decisions or appeals.  
  - **Step 4 (Equal Treatment):** Hand-wave. Steward could enter some units more than others (e.g., disliking a resident). No guardrails.  
  - **Step 5 (Due Process):** Hand-wave. No notice before entry or report after.  
  - **Step 6 (Exclusion):** Sufficient. Rule applies to all equally.  
  - **Step 7 (Practicality):** Sufficient. Easy to enforce.  
  - **Failures:** 4 hand-waves (Steps 2, 3, 4, 5).  
  - **Outcome: C (reject).** *You asked for honesty:* This rule fails hard on non-domination (arbitrary power) and due process.  
    - **Surviving version:** "If a resident is unreachable for 48hrs *after* attempts to contact them and their emergency contact, and there’s evidence of risk (e.g., mail piling up, worried neighbor), the steward and one board member may enter together. A written report must be provided to the resident within 24hrs. Resident may appeal penalties to the board." Fixes Steps 2–5.  

  **Proposal 3:** Four hours of community work per month per household, assigned by the work coordinator, who can also excuse households for any reason she thinks adequate.  
  - **Step 1 (Problem):** Sufficient. "Grounds maintenance is falling behind; only 50% do chores now."  
  - **Step 2 (Burden):** Sufficient. 4 hours/month is reasonable; no less burdensome alternative.  
  - **Step 3 (Discretion):** Hand-wave. "Any reason" is purely subjective; no criteria or appeals.  
  - **Step 4 (Equal Treatment):** Hand-wave. Coordinator could excuse friends; no guardrails.  
  - **Step 5 (Due Process):** Hand-wave. No process to challenge assignments/penalties.  
  - **Step 6 (Exclusion):** Hand-wave. Could burden disabled residents; no accommodations mentioned.  
  - **Step 7 (Practicality):** Sufficient. Assigning chores is feasible.  
  - **Failures:** 4 hand-waves (Steps 3, 4, 5, 6).  
  - **Outcome: C (reject).**  
    - **Surviving version:** "Work coordinator assigns chores based on a public rotation. May excuse for medical/disability reasons (with documentation) or pre-approved absences. Residents may swap assignments or appeal to the board. Alternatives provided for disabled members." Fixes Steps 3–6.  

  ---

  ### **Final Notes**  
  - **Handoff-ready:** This fits on one page. New board members can run it with no training—questions are plain English, outcomes are mechanical.  
  - **Neutrality preserved:** By starting with "What problem does this solve?" (Step 1) and weighing burden vs. harm (Step 2), it avoids taking sides. Values clashes (e.g., "Is tracking guests worth the privacy loss?") are pushed to Outcome D for a vote.  
  - **Why this works:** It forces specificity, exposes arbitrariness, and requires constraints on power—aligning with your co-op’s reality where "domination" is the silent killer.  

  Print this, bring it to the next meeting, and avoid the 9:40 p.m. basement fatigue. Good luck!
