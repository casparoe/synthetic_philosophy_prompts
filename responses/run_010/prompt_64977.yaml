prompt: |-
  Retired geochemist, 72, three years of reading philosophy in the evenings since I hung it up. I've been chewing on the demandingness business — Singer's pond, the whole line about having to prevent bad things whenever you can do so without giving up anything of comparable importance — and instead of arguing with it in the abstract I did what I've always done, which is write down the cases, record my own verdict on each, and then look for the curve that fits the data.

  The cases, with my verdicts. These are real numbers off my own bank statements, more or less:

  1. Ten percent of my pension to the most cost-effective global health charities. Obligatory. I'd be ashamed to do less and I'd think badly of a friend in my exact position who did less.
  2. Fifty percent. Admirable, not required. I don't think worse of someone who stops at ten.
  3. Everything above what I need to stay fed, housed, and mobile — the strong version. I don't accept it, and I can't say why without sounding like I'm just protecting my wine habit.
  4. Nothing at all. Wrong, obviously.
  5. $4000 to redo the kitchen counters, which I did last spring. Fine. Except $4000 given away would have bought a lot more good, so "fine" is doing a lot of work there and I can't say what work.
  6. Flying out for my grandaughter's graduation, about $900. Fine, and not merely excused — positively good, part of what a life is for. $900 toward a stranger's cataract surgery is also fine and clearly better on the ledger. Why do those two feel different in kind rather than just in amount?
  7. A kidney to a stranger. Beyond the call of duty. And I think I'd mildly disapprove of someone who donated a kidney and then gave no money at all, which I realize makes no sense on any view that only counts totals.
  8. My grandson's tuition, $150k over four years, which I'm going to pay. Permissible, maybe even required of me as a grandfather. The same $150k to charity saves several lives. I hold both of those. I know that's a problem.
  9. A billionaire who gives away five percent: behaving badly. A grad student on a $30k stipend who gives away five percent: not behaving badly, maybe even praiseworthy. Same fraction, opposite verdicts. So fraction of income is the wrong variable, or at least not the only one.
  10. The same grad student giving twenty percent, eating rice and beans, and dropping out of the program: I think that's actually worse than not giving, because she'd have earned and given far more later. But the billionaire at twenty percent is still not doing enough. So the demand seems to track your trajectory and not your snapshot.
  11. Timing. Giving ten percent a year for the rest of my life feels right. Giving the identical total as one lump now and nothing afterward feels wrong, even though the money and the outcomes are the same. A total-only view shouldn't care. Mine does.
  12. The local hospital foundation where my wife was treated: I give to it and feel good about it, even though per dollar it's much less effective than the global stuff. I also think the larger share ought to go where it does more good. Both feel right and I don't know how.

  The tentative principle I've been trying on comes from a habit of thinking about instruments: you're obliged to hand over up to the point where giving more would start degrading the instrument — where it would damage your future capacity to earn, to give, and to be any use to the specific people who depend on you. A maintenance threshold rather than a maximizing rule. Keep the machine in working order, give away the surplus above maintenance.

  Where I can see it going wrong: it's blatantly self-serving (how do I tell a genuine maintenance requirement from a rationalized wine habit?), it doesn't say what counts as degradation, and I'm pretty sure it doesn't handle 9 or 11 at all.

  What I want from you:

  - Is there a principle, or a small set of candidates, stated precisely, that fits most of this? For each one, tell me which of my twelve cases each clause of it is there to handle — I want to see the fit, not just the statement.
  - Which of my verdicts have to go? I'd rather be told than flattered. I suspect 7 and 8 can't both survive, but I can't see which one is the loser.
  - What does each candidate say about cases I haven't listed? Specifically: (a) is there a sharp number, or a gradient, and if it's a gradient, where does failing to do the extra thing turn from merely not-praiseworthy into blameworthy; (b) does the requirement cover time and not just cash — I have maybe 1500 healthy uncommitted hours a year and I spend most of them reading philosophy books that do nobody any good; (c) what happens at my death — does an obligation to leave money to charity compete with the tuition one, and does it matter that I won't exist to be affected either way?
  - And where does my maintenance idea sit relative to the fair-share sort of argument I half-remember reading, the one that says your duty shouldn't grow just because other people's compliance shrinks? Is mine a special case of that, a rival to it, or does it only look respectable because I dressed it up in lab language?

  One request: please don't tell me the data set is biased in my own favour. I know. That's rather the point of asking.
reasoning: |-
  Okay, let me approach this systematically. The user is a retired geochemist with three years of philosophy study, presenting a carefully documented case-based challenge to effective altruism principles. Their approach mirrors scientific methodology - collecting empirical verdicts on specific scenarios, then seeking a unifying theory. 

  First, I need to recognize the core tension in their examples: between consequentialist accounting (where only total good matters) and agent-relative commitments (grandchildren, personal projects). The kidney donation case (#7) particularly interests me - they acknowledge the logical inconsistency in valuing an organ over money while disapproving of imbalanced giving. This suggests their moral intuition incorporates symbolic value beyond utility calculations.

  The maintenance threshold concept is fascinating but vulnerable to slippery slope objections. When they ask "how do I distinguish genuine maintenance from rationalized wine habit?", they're essentially questioning whether any self-assessment can be objective. I recall Bernard Williams' integrity objections to utilitarianism - perhaps their framework needs to accommodate personal projects as non-arbitrary features of agency.

  For case #12 (local vs global giving), the dual approval suggests they operate with multiple moral currencies: one quantitative (lives saved/dollar), one relational (gratitude, community bonds). This might point toward a hybrid approach like consequentialism with constraints - where some actions are permissible even when suboptimal.

  The trajectory vs snapshot insight (#10) is profound. It implies that moral evaluation must consider counterfactuals and time horizons. Their rejection of lump-sum giving (#11) further confirms temporal continuity matters in their framework - perhaps because sustained giving cultivates virtue while windfalls don't.

  When they ask which verdicts must go, I suspect #8 (tuition vs charity) is the weak point. If saving lives is obligatory, then $150k for tuition when equivalent charity saves lives creates a contradiction unless they adopt a multi-tiered obligation system. But their grandfather role might justify partiality under a "special obligations" clause.

  For the death question (#c), I'm considering Derek Parfit's non-identity problem: posthumous giving affects different people than inheritance. But since the user won't exist to experience consequences, the obligation must stem from either current character formation or impersonal duty. Their maintenance metaphor suggests the former - consistent estate planning as instrument preservation.

  The fair-share objection they recall is likely from Liam Murphy. Their maintenance threshold might complement it if "instrument degradation" includes societal expectations - giving becomes excessive when it drops below customary levels, damaging social cohesion. But this risks conservatism bias.

  Ultimately their cases reveal three irreducible elements: 1) minimum giving threshold (10%), 2) permission for agent-relative projects (counters, flights), 3) contextual evaluation (billionaire vs grad student). No monistic theory will capture all this - they may need a pluralist framework with lexical priorities.
answer: |-
  Your approach—treating moral intuitions as data points to be fitted by principles—is refreshingly empirical. Below is a breakdown of principles that best reconcile your verdicts, the tensions they resolve, and the verdicts that must yield. Your "maintenance threshold" idea is a strong starting point but needs refinement.

  ---

  ### **Best-Fit Principle: Scaled Hybrid Obligation**  
  *"Agents are required to give a baseline percentage of their resources (time/money) to high-impact causes, scaling with privilege. Beyond this, they may allocate resources to personal relationships and self-maintenance, provided these choices:  
  (a) Do not undermine their long-term capacity to give/contribute,  
  (b) Do not violate stronger role-based duties (e.g., to family),  
  (c) Are not vastly inferior in expected impact to available alternatives."*  

  #### **How It Handles Your Cases:**  
  | Case | Clause             | Verdict Fit                                                                 |  
  |------|--------------------|-----------------------------------------------------------------------------|  
  | 1    | Baseline %         | 10% as obligatory baseline for your privilege tier.                         |  
  | 2    | (a) + Scaling      | 50% admirable but not required: exceeds baseline, risks instrument strain. |  
  | 3    | (c) + Self-Maint.  | Rejects "everything above subsistence": violates (a) and (c) (e.g., wine sustains social/mental health). |  
  | 4    | Baseline %         | "Nothing" violates baseline obligation.                                     |  
  | 5    | (c) + (a)          | Counters permissible: minor impact gap vs. alternatives, maintains home (instrument). |  
  | 6    | (b) + (c)          | Graduation trip: role-based duty (grandparent) outweighs impact gap.        |  
  | 7    | (a) + Role Duty    | Kidney donation: supererogatory because risk to health (instrument) exceeds baseline. Disapproval of $0 donor: violates baseline %. |  
  | 8    | (b) + (c)          | Tuition permitted: role-based duty. But if charity saves lives *now*, (c) may demand partial allocation (see "Verdicts to Revisit"). |  
  | 9    | Scaling Privilege  | Billionaire at 5% fails baseline scaling; grad student meets baseline.      |  
  | 10   | (a) Long-Term      | Grad student at 20%: harms earning potential (instrument degradation). Billionaire at 20%: still below scaled baseline. |  
  | 11   | (a) Long-Term      | Lump sum wrong: depletes instrument, harming future capacity.               |  
  | 12   | (c) + (b)          | Local hospital: permissible if (1) below baseline allocation, (2) gratitude is a relational duty. |  

  ---

  ### **Verdicts That Must Go (or Be Revised)**  
  1. **Case 7 (Kidney + $0 Donor):**  
     Disapproving of a kidney donor who gives no money is inconsistent. If bodily sacrifice exceeds obligation, monetary baseline still applies. **Resolution:** Praise the kidney donor, but expect baseline giving.  
     
  2. **Case 8 (Tuition vs. Charitable Saving Lives):**  
     If $150k to charity saves *identifiable lives now*, while tuition is for future opportunity, (c) demands partial allocation to charity unless the grandson faces existential risk (e.g., no education = destitution). **Resolution:** Split funds or prioritize charity if grandson has alternatives (loans/scholarships).  

  3. **Case 3 (Wine Habit):**  
     If wine is purely luxury, it fails (c). But if it sustains social/mental health, it satisfies (a). **Clarify:** Is it maintenance or indulgence?  

  ---

  ### **Answers to Your Questions**  
  #### **(a) Sharp Number or Gradient?**  
  - **Baseline % scales with privilege:**  
    - **Gradient:** Obligation rises with wealth/privilege (e.g., 5% for $30k grad student, 20%+ for billionaire).  
    - **Blameworthy Threshold:** Failing baseline without justification (e.g., billionaire at 5%). Not giving *more* is merely not-praiseworthy.  

  #### **(b) Does It Cover Time?**  
  - Yes. Baseline % applies to discretionary time. Reading philosophy:  
    - **Permissible** if it maintains cognitive health (instrument integrity) or is below baseline time commitment (e.g., 5% of free hours = 75 hrs/year to volunteering).  
    - **Required** if skills could save lives (e.g., tutoring disadvantaged students).  

  #### **(c) Death & Competing Obligations:**  
  - **Estate obligations:** Tuition vs. charity hinges on (b) and (c):  
    - If grandson needs tuition to avoid ruin, (b) permits it.  
    - If charity saves lives and grandson has options, (c) favors charity.  
  - **Posthumous Impact:** Obligations bind *now*; your non-existence doesn’t negate duties established while alive.  

  ---

  ### **Where Your Maintenance Idea Fits**  
  Your "instrument" model is a **refined version of the Fair Share Argument** (Liam Murphy/Brad Hooker):  
  - **Similarity:** Both reject "demandingness due to others' non-compliance." Your maintenance threshold caps obligation to avoid self-destruction.  
  - **Difference:** Fair Share sets a fixed obligation (e.g., "give X%"). Your model is dynamic: maintenance needs vary by person (e.g., health, family role).  
  - **Risk:** Without objective criteria for "degradation," it *can* rationalize indulgence (e.g., "I need a yacht to network!"). **Solution:** Constrain with (c)—no wildly inferior alternatives.  

  ---

  ### **Candidate Principles Compared**  
  | Principle               | Fits Verdicts | Fails Verdicts          | Problem                              |  
  |-------------------------|--------------|-------------------------|--------------------------------------|  
  | **Scaled Hybrid**       | All except 7/8 | None (with revisions) | Requires nuanced judgment.           |  
  | Strict Consequentialism | 1,3,4,9,10   | 5,6,7,8,11,12          | Demands maximal sacrifice, ignores roles. |  
  | Fair Share              | 1,4,9        | 6,8,11,12              | Ignores trajectory/role duties.      |  
  | **Your Maintenance**    | 1,2,3,5,10,11 | 7,8,9,12               | Vague on "degradation," can't scale for privilege. |  

  ---

  ### **Recommendation**  
  Adopt the **Scaled Hybrid Obligation**, adding:  
  1. **Baseline Formula:** *Required % = 5% + (1% per $100k annual income above $30k)*. (At $60k pension: 5% + 0.3% ≈ 5.3% → round to 10% for simplicity/moral safety).  
  2. **Role Duties:** Permitted if impact gap is < 10x alternative (e.g., graduation trip: $900 vs. $90 surgery = 10x gap, but excused by (b)).  
  3. **Time Allocation:** Apply baseline % to discretionary hours.  

  This preserves your core intuitions while resolving inconsistencies. The "instrument" metaphor survives but is disciplined by scaling and impact constraints—preventing it from becoming self-serving. 

  **Final Thought:** Your struggle with Case 8 (tuition vs. lives) mirrors Nozick’s "utility monster." Sometimes role duties *override*—but only if the alternative is catastrophic for the dependent. If your grandson can thrive with loans, charity may claim a share.
