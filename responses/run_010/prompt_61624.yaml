  Hmm, the user has a sophisticated query about legal philosophy and precedent in common law systems. They're a second-year law student with a philosophy background, drafting a seminar paper on a tension in precedent practices they've noticed but can't yet name. Their litigation-practitioner classmate dismisses the problem as invented, so they need careful articulation.

  The core tension revolves around whether precedent presupposes judges make law or find law. The user describes several doctrinal practices: binding precedent even when erroneous, preference for distinguishing over overruling, declaratory theory vs prospective overruling, and highest courts releasing themselves from precedent. They want analysis of what these practices logically require versus what they're merely compatible with.

  Key philosophical questions emerge: First, whether precedent requires positivism or could fit with Dworkinian right-answer theories. Second, whether precedent treats law as historically contingent or timeless. Third, whether reliance-based justifications for stare decisis and prospectivity can be reconciled. Fourth, where the practice is theory-neutral versus theory-dependent.

  The user's suspicion is that prospective overruling secretly concedes judicial lawmaking, conflicting with declaratory theory. They want this tested, not assumed. They also ask about efficiency theories - if common law tends toward efficient rules anyway, would precedent practices change?

  This needs unpacking carefully. Start with foundational presuppositions: Binding precedent requires that past decisions have normative force beyond their correctness. This implies judicial decisions are sources of law - a positivist commitment. Even Dworkinian judges treat precedents as "gravitational forces," not binding because they're right, but because they exist institutionally.

  Distinguishing vs overruling: Preference for distinction preserves declaratory fiction while actually reshaping law. It's compatible with both theories but serves different functions - maintaining stability versus openly correcting error.

  Prospective overruling is indeed the smoking gun for judicial lawmaking. Only legislators typically set temporal effect. When courts do this, they tacitly admit they're changing rather than discovering law. Yet they maintain declaratory language elsewhere, creating doctrinal schizophrenia.

  On reliance: There's deep tension here. Protecting reliance on bad precedents (stare decisis) and protecting reliance against new rules (prospectivity) both appeal to fairness but point in opposite temporal directions. They can only be reconciled by admitting courts make law with retroactive effect unless expressly limited - which undermines declaratory theory.

  On contingency: Officially, precedent rhetoric denies history matters ("the law was always thus"). Practically, distinguishing shows courts know history determines legal development. If common law efficiency theories were believed, courts might distinguish less and overrule more, since "errors" would self-correct anyway. But they don't - suggesting they don't actually believe this.

  The practice is theoretically underdetermined at the edges. Both positivists and Dworkinians can justify most precedent practices, but they'll describe them differently. Where theories clash is in hard cases: When a Dworkinian judge might overrule more readily, seeing the "best answer" changed, while a positivist might stick closer to institutional history.

  To make this concrete: Imagine a jurisdiction switching from declaratory to legislative self-understanding. Judges would say "we change the law" when overruling, use prospectivity routinely, and cite fewer distinctions. But outcomes might not change much - the real difference would be in candor.
answer: |-
  Your inquiry dissects the foundational tensions in common-law precedent with remarkable precision. Below is a systematic reconstruction of the practice's philosophical presuppositions, addressing each component and your specific questions. I'll proceed analytically, separating strict entailments from compatibilities.

  ### **1. The Core Tension: Judicial "Lawmaking" vs. "Law-Finding"**
  - **Binding Precedent Requires Judicial Lawmaking (Positivist Commitment)**  
    For a prior decision to *bind* later courts—even when erroneous—it must be a **source of law independent of its correctness**. This presupposes that judges exercise creative authority: their decisions *add* to the legal landscape. If judges merely "found" preexisting law, a mistaken decision would hold no force (as it never reflected "true law"). The declaratory theory ("we merely expose past errors") contradicts the **practice** of binding precedent, which treats decisions as authoritative irrespective of their accuracy.  
    - *Strict Presupposition*: Judicial decisions are institutional facts that generate legal obligations. This is positivist (e.g., Hartian "rules of recognition").  

  - **Distinguishing vs. Overruling: The Fiction of Continuity**  
    Preferring distinction to overruling maintains the *facade* of law-finding. By narrowing precedents "past recognition," courts imply the earlier rule was always limited—preserving the declaratory myth. Yet functionally, this reshapes the law.  
    - *Presupposition*: Distinguishing assumes the system prioritizes **stability and incremental change** over correctness. It is compatible with both lawmaking and law-finding rhetorics but serves the former in practice.  

  - **Prospective Overruling: The Unmasking**  
    Your suspicion is correct: prospective overruling **presupposes judicial lawmaking**. Only a legislator can set a rule’s temporal effect. By shielding past conduct, the court admits:  
    (a) The old rule was *valid law* when applied (contra declaratory theory),  
    (b) The new rule is a *change* (not a discovery),  
    (c) Parties’ reliance interests constrain judicial power.  
    - *Tension*: This openly conflicts with the declaratory language used elsewhere (e.g., "the law was always X"). The practice is philosophically schizophrenic.  

  ---

  ### **2. Addressing Your Explicit Queries**  
  #### **A. What Must Precedent Presuppose vs. What It Accommodates**  
  - **Strict Presupposition**: Binding precedent requires a **positivist view** where judicial decisions are *sources* of law. A rule is binding because it was enacted by an authorized institution, not because it is morally optimal.  
  - **Compatible But Not Required**:  
    - *Dworkinian "Right Answer" Theory*: While Dworkin rejects positivism, his model ("law as integrity") could replicate precedent practices by treating past decisions as "gravitational forces" in constructing the best interpretation of the whole system. However, this struggles with *binding* erroneous precedents—why defer to a mistake?  
    - *Realist Prediction Theory*: A realist who defines law as "what courts do" cannot explain why a court *feels bound*. The practice presupposes **normative constraint**, not mere prediction. A realist might call this "habit" or "institutional psychology," but the language of obligation is irreducible.  

  #### **B. Contingency vs. Timelessness**  
  - **Official Rhetoric**: Declaratory theory pretends outcomes are "locked in" timelessly. History is irrelevant; judges merely reveal what was always true.  
  - **Actual Presupposition**: The practice treats law as **historically contingent**. A decision "narrows what later courts may say" because it occurred at a specific time/place. Distinguishing acknowledges this: courts maneuver around precedents they cannot openly reject, admitting past choices constrain present options.  
  - **Efficiency Conjecture Implications**: If common law "drifts toward efficiency," the system still presupposes contingency. Efficiency is an *ex post* justification, not a timeless truth. If judges believed this, they might:  
    - Overrule more freely (efficiency justifies correction),  
    - Use distinctions less (if errors self-correct, why preserve them?),  
    - Invoke "systemic efficiency" as a reason to depart from precedent.  
    The persistence of distinguishing shows courts don’t fully trust this conjecture—they act as if early accidents *do* permanently matter.  

  #### **C. The Reliance Paradox**  
  The two reliance appeals are **incompatible under a single principle**:  
  - **Upholding Precedent**: "Parties relied on this (flawed) rule, so we must follow it."  
  - **Prospective Overruling**: "Parties relied on the old rule, so we won’t punish them under the new one."  
  **Tension**: The first freezes the law *for the future* to protect past reliance; the second changes the law *for the future* to protect past reliance. They share a concern for fairness but pull time in opposite directions. Only **judicial lawmaking** resolves this:  
    - Legislators can prospectively change rules while validating past reliance.  
    - If judges "find" law, retroactivity is inherent—the "true rule" always applied.  
  *Reconciliation Requires*: Admitting courts *make* law, then balancing reliance against other values (e.g., justice, systemic integrity).  

  #### **D. Philosophical Underdetermination and Rival Theories**  
  - **Where Practice is Theory-Neutral**:  
    Most precedent practices (binding force, distinguishing) could be justified by:  
    - Positivism (sources thesis),  
    - Dworkinian integrity (fitting past decisions),  
    - Pragmatism (stability benefits).  
    Outcomes might not change across theories in routine cases.  
  - **Where Theory Matters—Concrete Changes if Declaratory View Were Abandoned**:  
    If courts embraced positivism/lawmaking explicitly:  
    1. **Reasoning**: Opinions would cite "institutional authority" over "timeless truth." Overrulings would say, "We *change* the rule," not "We correct an error."  
    2. **Vocabulary**: "Judicial legislation," "policy choices," "prospective effect" normalized. "The law was always X" abandoned.  
    3. **Winners/Losers in Hypothetical**:  
       - *Case*: Should a 19th-century precedent (e.g., "no duty to rescue strangers") apply to modern subway emergencies?  
       - *Declaratory Judge*: "The true law requires rescue; the old case was mistaken." (Retroactive liability).  
       - *Positivist Judge*: "We *now* impose a duty, but prospectively to protect reliance." (No liability in present case).  

  ---

  ### **Synthesis: The Coherent Position Between "Making" and "Finding"**  
  The practice occupies an **unstable middle ground**:  
  - It *behaves* as if judges make law (binding errors, prospective changes),  
  - But *speaks* as if they find it (declaratory rhetoric, distinguishing as "interpreting" limits).  
  **Coherence Requires**: Accepting that precedent is a **conventional practice** with two aims:  
  1. **Stability** (treating past decisions as authoritative, regardless of merit),  
  2. **Fidelity to Law** (aspiring to correct errors when stability permits).  
  This demands viewing judicial decisions as **both**  
  - *Sources of law* (when binding future courts),  
  - *Interpretations of law* (when distinguishing or overruling in the name of accuracy).  

  **Why It Endures**: The tension lets courts balance flexibility and constraint without conceding discretionary power. But prospective overruling exposes the fault line—it is the practice’s unconscious admission of its own fiction.  

  Would this reconstruction serve your seminar paper? I can refine any section or explore hypotheticals further.
