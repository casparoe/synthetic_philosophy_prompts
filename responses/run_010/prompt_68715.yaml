prompt: |-
  ok so context: I'm a junior and I somehow ended up chairing this new panel at my school that rules on complaints about student government election campaigning. It got made after last years election was a disaster. The panel is me, a sophomore, our SG advisor, and one senior, so basically nobody on it has taken philosophy. We get like 10-15 complaints a year, we have 40 minutes per meeting to decide them, and then we have to write a paragraph to the accused person explaining the ruling, which they can appeal to the whole student senate.

  Our only rule right now is something I made up on the spot: if what you said is true, it isn't manipulation. I'm pretty sure that's broken but I can't articulate why.

  Can you write us an actual decision procedure we can run on a complaint? Like the questions in order, what counts as a good enough answer to each one, where the procedure should just stop and say "no violation, moving on," adn where it has to hand the decision off to a human because it's a values call and not a fact call. Please use the real ideas about manipulation vs legitimate persuasion — bypassing someone's reasoning instead of engaging it, whether an emotional appeal is tracking reasons that are actually relevant, whether the person would endorse the influence if they noticed it happening, whatever else there is — but no reading list or citations, we are not going to read it. Just explain the concepts enough that a sophomore can apply them to a flyer. Keep the procedure itself to about a page.

  Then run it on three things that actually happened here:

  1. A candidate built a bunch of private instagram close-friends lists and sent different stuff to different groups — told the band kids he'd protect the band budget, told the athletes he'd protect sports funding, and never said anything in public that flat-out contradicted either one. Nothing from the private lists ever came out during the campaign.

  2. A flyer that said "my opponent missed 60% of student council meetings." True. She was an ex officio member who wasn't required to attend, and she had mono for six weeks.

  3. A club put its petition clipboard on the same lunch table as the free pizza and got something like 300 signatures. People signed without reading it. When we asked a bunch of them later, most said they'd still sign it if they actually read it.

  Two more asks. Give us at least one case where the procedure spits out an answer I'm personally going to hate — my own favorite campaign tactic should probably get flagged by it, and I want to see that happen on the page. And end with the kinds of cases the procedure genuinely can't settle, so we know when to punt to the senate instead of pretending we figured it out.
reasoning: |-
  Okay, the user is a junior in high school chairing a panel that handles complaints about student government election campaigns. They need a practical decision procedure to evaluate these complaints quickly. Let me start by understanding their situation. 

  The panel has limited time—only 40 minutes per meeting—and no one has a philosophy background. Their current rule, "if it's true, it isn't manipulation," is too simplistic and flawed. They need a step-by-step process that's easy to apply, using concepts like manipulation vs. legitimate persuasion without requiring deep theoretical knowledge.

  First, I should outline a clear procedure with specific questions. Start with factual accuracy since truth matters, but it's not the only factor. Then, assess whether the method bypasses reasoning. For example, if information is hidden (like private Instagram lists), that might bypass scrutiny. Next, consider relevance: even true statements can be manipulative if they're misleading or irrelevant in context. 

  Emotional appeals need checking too. Are they based on relevant reasons, or just triggering emotions? The endorsement test is key: would the person agree with the method if they knew about it? If all steps pass, it's legitimate persuasion; any red flags mean manipulation.

  Now, applying this to their examples. The Instagram case: true statements but sent privately to different groups, hiding contradictions. That bypasses reasoning and fails the endorsement test—voters wouldn't approve if they knew. So, violation. 

  The flyer about missed meetings: true, but lacking context (ex officio, mono). Without that context, it's misleading and bypasses reasoning. Violation. 

  The pizza table petition: placement exploits hunger, bypasses reasoning. Even if some would sign later, the method itself is manipulative. Violation.

  The user wants a case where their favorite tactic gets flagged. Maybe targeted messaging without disclosure? If they told different groups different promises privately, the procedure would catch it as manipulative, showing consistency.

  Finally, outline cases the procedure can't handle. Ambiguous relevance, complex endorsement questions, multiple manipulative elements, or when public interest overrides individual consent. These need human judgment, so the senate should decide.

  Need to keep explanations simple, avoid jargon. Use relatable examples. Ensure the procedure fits within a page, with clear yes/no paths. Emphasize practicality for high schoolers to apply during quick meetings.
answer: |-
  Here's a straight-to-the-point decision procedure designed for speed and clarity, based on core manipulation principles:

  **Student Election Manipulation Checklist (SEM-C)**

  *Run each complaint through these questions IN ORDER. Stop at any "No" or "Unclear" and rule "No Violation" unless specified.*

  1.  **FACTUAL ACCURACY:** Is the core claim/action **demonstrably false or deceptive** (lies, deepfakes, forged documents, misrepresenting sources)?
      *   *Yes:* **VIOLATION.** Stop. (Manipulation starts with deception).
      *   *No/Unclear:* Move to Q2.
      *   *Good Enough Answer:* Concrete evidence of falsehood (e.g., provable lie, doctored image).

  2.  **REASONING BYPASS:** Did the tactic **deliberately prevent voters from evaluating the *full* relevant information or reasoning rationally?**
      *   *Key Indicators:*
          *   **Hidden Contradiction:** Saying different things to different groups *privately* (like tailored IG Close Friends lists).
          *   **Hidden Context:** Omitting crucial facts that change the meaning of a true statement (e.g., why someone missed meetings).
          *   **Information Overload/Placement:** Burying key info, using tiny fonts, or placing it where attention is diverted *away* from evaluating the message (e.g., clipboard next to free pizza).
          *   **Exploiting Impulse/Inattention:** Relying on snap decisions without genuine consideration (signing without reading *because* distracted by pizza).
      *   *Yes:* **VIOLATION.** Stop. (Bypassing reasoning is core manipulation).
      *   *No:* Move to Q3.
      *   *Good Enough Answer:* The tactic made it practically impossible or highly unlikely for a typical voter to access/process *all* relevant info needed for a reasoned choice.

  3.  **EMOTIONAL RELEVANCE:** If strong emotions were appealed to (fear, excitement, loyalty), **is the emotion directly linked to a *relevant* reason for voting?**
      *   *Relevant Reason:* Connected to the candidate's qualifications, platform, or the role's responsibilities (e.g., fear about budget cuts if discussing fiscal policy).
      *   *Irrelevant Reason:* Exploiting emotions unrelated to the election or role (e.g., pure pity, unrelated nostalgia, making someone feel guilty for personal life).
      *   *Yes (Relevant):* Move to Q4. (Potentially legitimate persuasion).
      *   *No (Irrelevant):* **VIOLATION.** Stop. (Manipulating via irrelevant feelings).
      *   *Unclear:* Move to Q4 but flag for human judgment later.

  4.  **ENDORSEMENT TEST:** **If voters knew *exactly how* they were being influenced in the moment, would most reasonably feel tricked or approve of the method?**
      *   *Tricked/Disapprove:* Feels sneaky, unfair, or like their choice wasn't truly informed/voluntary. (e.g., "They told *me* X but told *them* Y privately?" or "They made me sign without reading?").
      *   *Approve:* Feels like normal, above-board campaigning they expect (e.g., "Yeah, they pointed out my opponent's record, that's fair game.").
      *   *Approve:* **NO VIOLATION.** Stop. (Legitimate persuasion).
      *   *Tricked/Disapprove:* **VIOLATION.** Stop.
      *   *Unclear:* **HUMAN JUDGMENT NEEDED.** (Punt to Senate).

  ---

  **Rulings on Your Cases:**

  1.  **Private Instagram Lists:**
      *   Q1 (Factual): *No Violation* (Statements might be true). → Q2.
      *   Q2 (Bypass): **YES VIOLATION.** Sending contradictory promises privately to targeted groups *deliberately hides the contradiction* and prevents voters from seeing the candidate's full stance, bypassing rational evaluation. *Stop. Violation.*
  2.  **Flyer: "Opponent missed 60% of meetings":**
      *   Q1 (Factual): *No Violation* (True). → Q2.
      *   Q2 (Bypass): **YES VIOLATION.** Omitting the crucial context (ex officio, not required, had mono) *radically changes the meaning* of the true fact. It presents a picture of unreliability while hiding the valid reasons, bypassing reasoning. *Stop. Violation.*
  3.  **Pizza Table Petition:**
      *   Q1 (Factual): *No Violation* (Petition was real). → Q2.
      *   Q2 (Bypass): **YES VIOLATION.** Placing the clipboard next to free pizza *exploits distraction and impulse*, deliberately encouraging signing without reading or consideration. It bypasses reasoning about *what* is being signed. *Stop. Violation.* (The "would sign later" poll is irrelevant; the *method* bypassed reasoning at the point of signing).

  ---

  **Your Own Favorite Tactic (Hypothetical - Targeted Attack Ads):**
  Let's say your favorite tactic is creating sharp, public flyers highlighting an opponent's single unpopular vote (e.g., "Candidate B Voted AGAINST New Water Fountains!"), even if that vote was part of a complex budget package with valid reasons.

  *   Q1: *No Violation* (True, they did vote against it). → Q2.
  *   Q2 (Bypass): **YES VIOLATION?** This is the critical point. By isolating *one* vote, stripping *all* context (budget constraints, trade-offs, package deal), and presenting it dramatically, you likely bypass voters' ability to rationally evaluate the *reasonableness* of the vote or the candidate's overall judgment. The tactic focuses emotion (anger/disappointment) on an isolated fact devoid of its necessary context. → Q3 might be *Unclear* (Relevance? Water fountains *are* relevant, but the *lack of context* makes the appeal misleading). → Q4: **Tricked/Disapprove?** Voters shown the *full* context later would likely feel the flyer was deliberately misleading ("They made it sound like I voted against water fountains for no reason!"). **Violation likely flagged.**

  ---

  **Cases SEM-C CAN'T Settle (Punt to Senate):**

  1.  **Ambiguous Relevance (Q3):** Is an appeal to school spirit relevant when arguing for more funding for *some* clubs but not others? Human judgment needed.
  2.  **Tough Endorsement Calls (Q4):** Is aggressive but public "gotcha" questioning manipulative or just hardball politics? Would voters approve? Human judgment needed.
  3.  **Multiple Manipulative Elements:** If a tactic has several borderline issues that together feel "dirty" but don't clearly fail one step (e.g., technically true but highly inflammatory language combined with strategic placement). Human judgment needed.
  4.  **"Greater Good" vs. Individual Consent:** Was it *justified* to manipulate signatures quickly to get a crucial petition on the ballot, even if the method was sketchy (like the pizza table)? SEM-C flags the *method* as manipulative (Violation), but the Senate might weigh the outcome.
  5.  **Novel Tactic Gray Areas:** Anything involving new tech or social media tricks not clearly covered by the core principles above. Human judgment needed.

  **Key:** SEM-C focuses on the *method* used to influence, not the content's popularity or the outcome. Its goal is preventing tactics that corrupt the *process* of informed choice, even if the facts are technically true. When in serious doubt at Q4 or facing ambiguity in Q2/Q3, **punt to the Senate** – that's why appeals exist. Good luck!
