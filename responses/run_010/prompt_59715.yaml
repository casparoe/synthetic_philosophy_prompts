  ### Session Plan: Breakdown of Backward Induction in Centipede Game

  **Total Duration:** 90 minutes  
  **Participants:** 24 upper-level undergraduates (mix of philosophy/economics; 4–5 with game theory background)  
  **Core Objective:** Students empirically discover the failure of backward induction and confront gaps between their predictions and observed behavior.  
  **Key Constraints:**  
  - No pre-lecture; avoid mentioning "backward induction" until debrief.  
  - Anonymous, re-paired partners per condition to remove reputation/repeated-game effects.  
  - Tokens convert to capped extra credit (no real money, no grade penalties).  

  ---

  ### Phases & Timings (Prose Overview)  
  **Materials Needed:**  
  - Payoff tables (condition-specific)  
  - Randomization device (d6 die or card deck) for Condition 3  
  - Token tracking sheets  
  - Prediction/betting slips  

  **Pairing Protocol:**  
  - Randomly assign partners for each condition (12 pairs per condition).  
  - **Why strangers?** Removes repeated-game incentives, reputational concerns, and partner-specific trust. Forces one-shot interactions, isolating the role of beliefs about *types* of players (not specific individuals).  

  **Token-to-Credit Conversion:**  
  - Tokens earned from game play and predictions.  
  - Conversion: `0.04 extra credit points per token`, capped at `+3.0 points` max per student.  
  - Baseline grades unaffected; minimum token reward = `0.2` (trivial positive credit).  

  ---

  ### Session Flow  
  **Phase 1: Introduction & Setup (5 min)**  
  - *Instructions:* "Today, you’ll play three short games in pairs. Decisions earn tokens, converted to extra credit. Partners change each game—no talking across pairs. We start with predictions."  
  - *Facilitator Notes:* Emphasize anonymity; distribute token trackers.  

  **Phase 2: Prediction 1 (Full Ladder) (5 min)**  
  - *Instructions:* "Predict what the mover at **Node 5** will do: PASS or TAKE. Bet 0–5 tokens. If correct, double your bet; if wrong, lose bet."  
  - *Facilitator Notes:* Record bets; remind students of starting token endowment (10 for predictions).  

  **Phase 3: Condition 1 — Full Ladder (15 min)**  
  - *Instructions:* "With your partner, start at Node 1. At your turn: TAKE (end game, payoffs as shown) or PASS (pot grows, partner moves next). If no one takes, reach the end for (12, 12)."  
  - *Materials:* Full payoff table (Nodes 1–12).  
  - *Facilitator Notes:* Observe if game-theory students take early; record exit nodes.  

  **Phase 4: Prediction 2 (Deep Subgame) (5 min)**  
  - *Instructions:* "Now, predict the mover at **Node 10** in a game starting there. Bet 0–5 tokens (use remaining prediction tokens)."  

  **Phase 5: Condition 2 — Deep Subgame (10 min)**  
  - *Instructions:* "Start at Node 10. The pot is already 20 tokens. If you take, payoffs as shown. If you pass, partner moves at Node 11. If no one takes, end at Node 12 for (12, 12)."  
  - *Materials:* Payoff table for Nodes 10–12 only.  
  - *Why Node 10?* Late enough that backward induction predicts immediate taking (short chain: 10→11→take12). If players pass, it suggests beliefs about *types* (e.g., "some cooperators exist"), not literal endpoint reasoning.  

  **Phase 6: Prediction 3 (Random Termination) (5 min)**  
  - *Instructions:* "Predict the mover at **Node 3** in a game with random endings. Bet 0–5 tokens."  

  **Phase 7: Condition 3 — Random Termination (15 min)**  
  - *Instructions:* "Start at Node 1. Before each move, roll a die: if 1, the game ends after this move. If you PASS and the die is 1, both get `current node number` tokens. If PASS and die ≠1, game continues."  
  - *Materials:* Payoff formulas (not table) + die/cards per pair.  
  - *Facilitator Notes:* Students realize no fixed endpoint—backward induction fails. Record decisions at Node 3.  

  **Phase 8: Debrief (25 min)**  
  - **Report Data:** Show % passing at key nodes (e.g., Node 1 in Condition 1, Node 10 in Condition 2, Node 3 in Condition 3). Highlight prediction-vs-reality gaps.  
  - **Three Explanations:**  
    ```markdown
    | Explanation           | Confirming Pattern                          | Refuting Pattern                           |
    |-----------------------|--------------------------------------------|-------------------------------------------|
    | **A. Backward Induction** | Early taking (Node 1 Cond1, Node10 Cond2) | Passing in Cond1/Cond2                    |
    | **B. Belief in Cooperators** | Passing in Cond1/Cond2 *and* Cond3     | Taking at Node10 (Cond2)                  |
    | **C. Inequality Aversion** | Taking at high-inequality nodes (e.g., Node10) | Passing at low-inequality nodes (e.g., Node1) |
    ```  
    - **Diagnostic Power:**  
      - *Deep Subgame:* Isolates endpoint reasoning vs. beliefs. Passing at Node 10 refutes backward induction (A) and supports beliefs (B).  
      - *Random Termination:* No endpoint → backward induction inapplicable. Passing supports beliefs (B) or inequality aversion (C).  
  - **Unreproducible Features:**  
    - *Common Knowledge of Rationality:* Activity cannot ensure players believe others are rational. Facilitator must clarify: "In theory, backward induction assumes all know all are rational—this rarely holds in practice."  
  - **Predictable Problems & Fixes:**  
    | Problem                          | Fix                                       |  
    |----------------------------------|-------------------------------------------|  
    | Game-theory students take early  | Pre-assign them as observers/recorders next time |  
    | Random termination runs long     | Cap at Node 15 (formula extends payoffs) |  
    | Prediction bets poorly calibrated | Use historical data next time to set priors |  

  ---

  ### Payoff Table (12 Nodes)  
  Constraints satisfied:  
  - Taking temptation > passing payoff if other takes (`T_i > R_i`).  
  - Mutual passing > taking payoff at end (`M=12 > T_i` not required; `T_12=18.96 > 12` holds).  
  - Temptation premium share shrinks with depth (see column 7).  

  | Node | Mover | If Mover Takes (M, O) | If Mover Passes & Other Takes (M, O) | If Both Pass to End (M, O) | Temptation Premium (Share of Pot) | BI Action |  
  |------|-------|------------------------|--------------------------------------|----------------------------|-----------------------------------|-----------|  
  | 1    | A     | (1.80, 0.20)           | (0.44, 3.56)                         | (12.00, 12.00)            | 0.68                              | Take      |  
  | 2    | B     | (3.56, 0.44)           | (0.72, 5.28)                         | (12.00, 12.00)            | 0.71                              | Take      |  
  | 3    | A     | (5.28, 0.72)           | (1.04, 6.96)                         | (12.00, 12.00)            | 0.71                              | Take      |  
  | 4    | B     | (6.96, 1.04)           | (1.40, 8.60)                         | (12.00, 12.00)            | 0.70                              | Take      |  
  | 5    | A     | (8.60, 1.40)           | (1.80, 10.20)                        | (12.00, 12.00)            | 0.68                              | Take      |  
  | 6    | B     | (10.20, 1.80)          | (2.24, 11.76)                        | (12.00, 12.00)            | 0.66                              | Take      |  
  | 7    | A     | (11.76, 2.24)          | (2.72, 13.28)                        | (12.00, 12.00)            | 0.65                              | Take      |  
  | 8    | B     | (13.28, 2.72)          | (3.24, 14.76)                        | (12.00, 12.00)            | 0.63                              | Take      |  
  | 9    | A     | (14.76, 3.24)          | (3.80, 16.20)                        | (12.00, 12.00)            | 0.61                              | Take      |  
  | 10   | B     | (16.20, 3.80)          | (4.40, 17.60)                        | (12.00, 12.00)            | 0.59                              | Take      |  
  | 11   | A     | (17.60, 4.40)          | (5.04, 18.96)                        | (12.00, 12.00)            | 0.57                              | Take      |  
  | 12   | B     | (18.96, 5.04)          | N/A (game ends if pass)              | (12.00, 12.00)            | 0.29                              | Take      |  

  *Pot = 2 × Node; Temptation Premium Share = `(T_i - R_i) / Pot`*  

