  **Key Takeaways for Facilitator:**  
  - **Strangers Design:** Critical for isolating one-shot beliefs (removes reputation).  
  - **Deep Subgame (Node 10):** Tests if unraveling requires endpoint knowledge (if players pass, it’s about beliefs, not BI).  
  - **Random Termination:** Forces students to confront BI’s reliance on a fixed endpoint.  
  - **Handle Experts:** If they disrupt, assign recording duties next time.  
  - **Debrief Focus:** Use data to pit explanations against each other. Stress that BI is fragile without common knowledge of rationality.
