          But the students don't need the whole table? We can provide the formula: 
              If at node i, the mover takes: 
                  mover gets: 2*i*(0.91 - 0.01*i)
                  partner gets: 2*i*(0.09 + 0.01*i)

              If they pass and the game terminates by the die, both get i.
              If they pass and the game continues, then the other player moves at node i+1.

          We can give them the formula.

          But to make it concrete, we provide a table for nodes 1 to 15? And state that beyond that, the pattern continues.

