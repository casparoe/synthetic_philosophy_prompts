     Phase 9: Condition3 - Random termination (15 minutes)
          Random pairs.
          They play with the random termination rule, starting at node1.

     Phase 10: Collect results.

     Phase 11: Debrief (25 minutes)
          We reveal the results of the three conditions: for each condition, the percentage of pairs that passed at the first node, and at which node the game ended.

          Then we present three candidate explanations for why players might pass in the full ladder:

            A. Backward induction: they reason from the end. (But then they should take immediately at every node.)

            B. Belief that some fraction of the population are committed cooperators (or are other-regarding) and will pass even when it's not immediately rational, so by passing early you might induce them to cooperate later.

            C. Inequality aversion: players dislike unequal payoffs, so they pass to avoid the unequal split of taking.

          Then we map the patterns across conditions:

            Condition1 (full ladder): 
               If A is the explanation, then players should take at the first node. But if they pass, it's not A.
               If B: then they might pass in the early nodes hoping that the other is a cooperator.
               If C: they might pass to avoid the unequal payoff at early nodes? But at early nodes, the inequality from taking is not as severe as at later nodes? At node1: (1.8,0.2) -> inequality of 1.6; at node2: (3.56,0.72) -> inequality of 2.84, which is larger. So if they are inequality averse, they might take at node1 to avoid the possibility of later high inequality? Or they might pass to reach the equal split at the end.

            Condition2 (deep subgame): 
               If A: then players should take immediately at node10.
               If B: if they believe that there is a chance the other is a cooperator, they might pass at node10 to give the other a chance to cooperate? Even though backward induction says take.
               If C: at node10, if they take, they get 16.2 and the other gets 3.8, which is very unequal. If they pass, and the other takes at node11, they get 4.4 and the other gets 17.6, which is even more unequal. Or if the other passes, then at node12 the mover takes and they get 5.04 and the other gets 18.96. So to avoid being the one with low payoff, they might take at node10? Or to avoid inequality, they might hope for the equal split at the end? But the equal split requires reaching node12 and then the mover passing, which is not rational. So if they are inequality averse, they might take at node10 to prevent the possibility of even worse inequality.

            Condition3 (random termination):
               If A: backward induction requires a fixed endpoint, but here there isn't one. So A cannot be applied. Therefore, if players are using backward induction, they would be lost and might behave randomly? Or switch to a different strategy.
               If B: they might still pass in early nodes hoping that the other is a cooperator and that the game will last long enough to reap the benefits.
               If C: they might take early to avoid the risk of being stuck with a low payoff if the game ends soon after they pass.

          Now, what patterns would confirm or refute?

            A (backward induction):
               Confirming: in condition1, most take at node1; in condition2, most take at node10.
               Refuting: in condition1, many pass at node1; in condition2, many pass at node10.

            B (belief about cooperators):
               Confirming: in condition1, many pass at early nodes; in condition2, many pass at node10 (because they hope the other is a cooperator and will pass at node11); in condition3, many pass at early nodes.
               Refuting: if in condition2, almost no one passes at node10, that refutes B? Because in condition2, there is no history of cooperation, so if they pass, it must be because they hope the other is a cooperator.

            C (inequality aversion):
               Confirming: in condition1, they are more likely to take at nodes with high inequality (which are later nodes), but they are in the early nodes and the inequality is low, so they might pass. But then at later nodes, they take to avoid high inequality. In condition2, they take at node10 to avoid the high inequality of (16.2,3.8) or the risk of even worse? But if they pass, they might end up with 4.4 or 5.04, which is very low. So they might take to avoid being the one with low payoff? 
               This is complicated.

          We can simplify:

            For C, if they are inequality averse, they should be more likely to take when the current taking payoff is very unequal. In our game, the inequality (T_i - S_i) increases with i (until node12). So they should be more likely to take at later nodes. 

            In condition1, we should see more taking at later nodes? But they don't reach later nodes if they take early.

            In condition2, they start at a node with high inequality (16.2 vs 3.8), so they should take.

          So patterns:

            A: confirmed by early taking in both condition1 and condition2.
            B: confirmed by passing in condition1 and condition2, and also in condition3.
            C: confirmed by taking at nodes with high inequality (so in condition1, they might pass at early nodes where inequality is low, and take at later nodes if they reach them; in condition2, they take at node10 because of high inequality).

          But condition2 is designed to have high inequality: so if they take in condition2, it could be either A or C.

          To distinguish A and C, we can look at condition1: if they pass at node1 (which has lower inequality) and take at node10 (which has high inequality), that is consistent with C. But A would take at node1.

          Alternatively, in condition3, if they are inequality averse, they might take early to avoid the risk of the game ending after they pass and then getting a low payoff (if the other takes in the next node) or if the game terminates after they pass, they get i, but if they take, they get T_i which is usually greater than i? At node1: T1=1.8, and if they pass and the game terminates, they get 1. So taking gives more and also avoids giving the other a chance to take and leave them with 0.2. But if they pass and the game doesn't terminate, they might get more. 

          This is messy.

          Given the time, we'll focus on A and B in the debrief, and mention C as a possibility.

          Specifically:

            The deep subgame (condition2) is diagnostic of whether players are using backward induction or believe in the possibility of cooperation. If they take immediately in condition2, it is consistent with backward induction or with inequality aversion. If they pass, it suggests belief in cooperation (B).

            The random termination (condition3) is diagnostic of the reliance on a fixed endpoint. If they pass in condition3, it cannot be explained by backward induction (which doesn't apply) but can be explained by B or C.

          What the activity cannot reproduce: common knowledge of rationality. In the activity, players may not be sure that their partner is rational. The activity cannot supply common knowledge of rationality. The facilitator must explain that in the standard model, common knowledge of rationality is assumed, and under that assumption, backward induction should hold.

          What will predictably go wrong:

            - In the full ladder, the experienced students take at node1, which may bias the overall results. Fix: in the debrief, separate the experienced students' results and discuss.

            - In the random termination, the game may take too long. Fix: cap the number of nodes in practice? Or have a time limit per pair.

          We'll provide the run sheet.

   Now, the table of payoffs.

