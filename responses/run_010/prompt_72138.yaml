prompt: |-
  Our department's upper-level seminar on truthfulness and deception has about twenty students and a ninety-minute, closed-book final consisting of two essay questions worth twenty-five marks each. I am drafting the first, and I want the question, a model answer, and a marking scheme. Students will have covered the standard contemporary material on lying and misleading, so the question may take for granted the definition of lying as asserting what one believes to be false and the observation that literally true but engineered speech escapes it; it must not be answerable by restating that apparatus, and it must rule the debate over whether lying is ever permissible out of bounds entirely.

  The crux I want the question to turn on is this. The familiar account of why lying is the graver wrong is that the liar brings it about that the hearer holds a false belief, whereas the misleader merely invites the hearer to form one, leaving the hearer's own inference as the proximate cause and so leaving her rational agency intact. I want candidates required to confront the reverse reading of precisely that description: if the misleader has to model and exploit the hearer's reasoning in fine detail to produce the intended belief, while the liar can simply override it, then the misleader makes an instrument of the hearer's rationality rather than bypassing it, and the respect-for-agency argument may point the other way. A strong answer should have to adjudicate between those readings rather than notice both.

  The question should embed a matched pair of vignettes that I want you to write: two speakers, identically well informed about their hearer and identically motivated, who produce the same false belief and the same downstream harm, differing only in that one asserts what she believes to be false while the other asserts what she believes to be literally true but has selected and arranged in order to generate that belief. Keep the setting ordinary — a workplace, a family, a clinical or commercial exchange, not espionage or statecraft. The question should then ask which of the two wrongs the hearer more, and whether the difference between them is one of kind or one of degree, and what would settle that. Construct the pair carefully: if the intuition that one speaker is worse is generated by a confound — a larger harm, a baser motive, an unreasonably credulous hearer — the case fails, and I will know it. After the question, tell me which feature of your pair is doing the work and confirm that it survives those controls.

  Please deliver the following:

  1. The question, including both vignettes, in no more than 250 words, phrased so that a competent candidate cannot earn marks merely by describing the cases back to the examiner.
  2. A model answer of about 800 words, pitched at the standard of a strong first-class response, with its argumentative steps labelled.
  3. A marking scheme out of 25 marks: five must-hit moves, the marks each carries, and what partial performance on each earns. Identify the single move on which the grade really turns.
  4. An explicit statement of what separates a first-class answer from a good but unremarkable one — not by adjectives, but by naming the further argumentative step the first-class answer makes that the other omits.
  5. Three characteristic errors that should cost marks, each with a one-line diagnosis of the confusion it reveals: for example, treating the literal truth of what is said as itself the morally relevant fact, assuming that whatever is worse must be worse in every case of its kind, or reading the kind-versus-degree question as a question about ordinary usage of the term lie.
reasoning: |-
  Okay, the user is a philosophy professor designing a final exam question for an upper-level seminar on truthfulness and deception. They need a nuanced question that pushes students beyond standard definitions of lying vs misleading, specifically targeting the moral implication of exploiting rationality.

  First, I need to understand their core challenge. They want to test students on the reversal of the classic "respect for agency" argument - where misleading might actually demonstrate deeper manipulation than lying. The vignettes must be perfectly matched to isolate this variable, avoiding any confounds like differing motives or harms. 

  The professor's instructions are highly precise: identical speakers, identical contexts, identical outcomes, differing only in assertion vs engineered truth. The setting must be mundane - I'm considering workplace or family scenarios. For workplace: maybe a manager hiding restructuring plans? For family: perhaps hiding a sensitive medical diagnosis? 

  Workplace seems cleaner. Two managers, both know employee is anxious about job security, both want to prevent panic. One lies outright about no layoffs; the other uses technically true but misleading statements about "company stability". Harm is identical: employee delays job search based on false belief. 

  Now the question phrasing: it must force analysis rather than description. I'll structure it to ask: 1) which wrongs the hearer more 2) kind vs degree difference 3) what would settle that. Need under 250 words total. 

  For the model answer (800 words), I'll build the argument in labelled steps: 
  - Establish moral equivalence baseline 
  - Present standard agency argument 
  - Reverse it (exploiting rationality) 
  - Analyze manipulation depth 
  - Discuss culpability 
  - Resolve kind/degree 

  Marking scheme: 25 points across 5 key moves. The reversal argument (move 3) must be the grade-decider. 

  First-class answers will need to identify why the reversal argument is more compelling in this case - perhaps noting how the misleader's precision weaponizes the hearer's trust in rational discourse. 

  Common errors to penalize: 
  - Fixating on literal truth as morally decisive 
  - Assuming universal worse-ness 
  - Misinterpreting "kind/degree" as linguistic 

  Finally, I'll explicitly state how the vignettes avoid confounds - same harm, same motive, same hearer vulnerability. The manipulative precision of the misleading statement does all the work.
answer: |-
  Here is the complete exam package designed to your specifications:

  **1. Exam Question (248 words)**  
  "Consider two scenarios:  

  *Case A (Assertion):* Alex knows their colleague Bailey is anxious about rumoured layoffs. When Bailey directly asks, "Will there be layoffs in my department next month?" Alex, believing layoffs *will* occur and wishing to avoid panic, replies, "No, there won't be any layoffs." Bailey is reassured, delays job searching, and suffers significant harm when laid off.  

  *Case B (Engineered Truth):* Charlie knows their colleague Dakota is equally anxious about the same layoffs. When Dakota asks the identical question, Charlie, identically motivated and informed, replies: "The company's financial health is strong overall, and long-term strategic reviews are ongoing in all departments." Charlie knows this is literally true (e.g., strong cash reserves exist, reviews are routine) but has selected these truths precisely to imply no layoffs. Dakota forms the same false belief, acts identically, and suffers identical harm.  

  Assume both speakers act wrongly. Analyze which speaker wrongs their hearer *more severely* and why, grounding your answer in the distinctive structure of the deceptive acts. Is the moral difference between Alex and Charlie one of *kind* or merely of *degree*? What philosophical consideration (beyond comparing outcomes or motives) could decisively settle this kind/degree question? Do *not* rehearse definitions of lying/misleading or debate the permissibility of lying generally."

  **Feature Doing the Work & Confound Check:** The *manipulative precision* required in Case B—Charlie must model Dakota's inference chain ("strong finances" + "reviews" → stability → no layoffs)—isolates the exploitation of rationality. Confounds are eliminated: identical harm (job loss), identical motive (prevent panic), identical hearer credulity (both ask direct questions, showing baseline reasonable concern).

  ---

  **2. Model Answer (798 words)**  
  **(Strong First-Class Standard)**  

  **Step 1: Establishing Moral Equivalence Baseline**  
  Both Alex and Charlie commit wrongs by intentionally causing their hearers to form a harmful false belief (P1: Intentional deception causing harm is pro tanto wrong). Crucially, harm, motive, and hearer vulnerability are held constant. The *prima facie* wrongness is equivalent. The question is whether the *character* of the wrong differs, making one graver.  

  **Step 2: The Standard Agency Argument Favouring Alex (Liar)**  
  The orthodox view (e.g., Stokke, Saul) holds that lying (Case A) wrongs the hearer more severely because it *overrides* their rational agency. Alex directly implants a false belief ("No layoffs") via assertion, bypassing Bailey’s capacity to assess evidence. Charlie (Case B), while deceptive, merely *invites* Dakota to form the false belief. Dakota actively infers "no layoffs" from the presented truths. Proximally, Dakota’s own reasoning causes the false belief. Charlie thus respects Dakota’s agency *as a reasoning being*, even while misdirecting it (P2: Bypassing agency is a greater violation than misdirecting it). On this reading, Alex’s wrong is graver, and the difference is one of *kind* (direct causation vs. indirect invitation).  

  **Step 3: The Reversal Argument Favouring Charlie (Misleader)**  
  The reversal contends that Case B involves a *deeper* violation precisely *because* it exploits rational agency. Charlie cannot simply override Dakota’s judgment like Alex can. Charlie *must* engage intimately with Dakota’s cognitive processes: predicting Dakota’s inferences, understanding Dakota’s anxieties, and carefully selecting literal truths that *reliably trigger* the desired (false) conclusion. This transforms Dakota’s rationality into a *tool* for Charlie’s deception (P3: Instrumentalizing another's rationality for deception is a distinct wrong). Alex treats Bailey’s agency as an obstacle to circumvent; Charlie treats Dakota’s agency as a mechanism to *harness*. Exploitation requires greater cognitive effort and a more insidious form of control. Respect for agency demands non-manipulation, not merely non-override. On this view, Charlie’s wrong is graver, and the difference remains one of *kind* (harnessing vs. bypassing agency).  

  **Step 4: Adjudicating Severity - Manipulation as the Deeper Wrong**  
  The reversal argument is more compelling for assessing the *severity* of the wrong in these matched cases. While both involve control, Charlie’s act requires a *more profound violation of interpersonal respect*.  
  *   **Depth of Control:** Alex imposes a belief *externally*. Charlie’s deception works *from within* Dakota’s own reasoning, making Dakota complicit in their own deception. This internal subversion undermines autonomy more fundamentally.  
  *   **Epistemic Vulnerability:** Charlie exploits trust in the *reliability of truthful discourse itself*. By using truths as weapons, Charlie corrodes Dakota’s (and potentially others’) future ability to engage in good-faith inference, damaging the epistemic commons. Alex’s lie, while blatant, doesn’t weaponize truthfulness in this way.  
  *   **Culpability & Effort:** Charlie’s act involves greater deliberateness. The need for precise modeling implies heightened awareness of Dakota’s perspective and a more calculated effort to *use* it against them (P4: Exploitation demonstrates greater deliberative culpability than blunt force deception).  
  Therefore, Charlie wrongs Dakota *more severely* by making Dakota’s rational agency the instrument of their harm.  

  **Step 5: Kind vs. Degree**  
  The difference is one of *kind*, not merely degree. The *mechanism* of the core wrong differs categorically:  
  *   Alex’s wrong (Lying) is **Agency Bypass**: Substituting his will for Bailey’s judgment.  
  *   Charlie’s wrong (Manipulative Misleading) is **Agency Instrumentalization**: Co-opting Dakota’s reasoning to serve Charlie’s deceptive end.  
  While both are forms of deception causing harm, the *relationship they establish to the hearer's rational faculty* is fundamentally distinct. One negates agency; the other perverts it into a tool.  

  **Step 6: Settling the Kind/Degree Question**  
  The decisive consideration is the **nature of the agential violation**. If the wrong stems primarily from *preventing* the exercise of agency (bypass), versus *distorting* the exercise of agency into serving the deceiver’s purpose (instrumentalization), the wrongs belong to different moral categories. This distinction in the *mode of agential disrespect* marks a difference in kind. Merely comparing the magnitude of harm or control (degree) misses this structural divergence in *how* the agent is wronged as a rational being.  

  ---

  **3. Marking Scheme (25 Marks)**  
  *   **Move 1: Identify Core Moral Equivalence (Harm/Motive/Hearer)** (4 marks)  
      *Full:* Clearly establishes baseline equivalence, preventing distraction by confounds. (4)  
      *Partial:* Mentions equivalence vaguely or omits one element. (2)  
      *None:* Focuses on unequal harm/motive/credulity. (0)  
  *   **Move 2: Accurately State Standard Agency Argument (Favouring Liar)** (4 marks)  
      *Full:* Clearly explains bypass vs. invitation, linking to agency override. (4)  
      *Partial:* Describes lying as "direct" but misses agency rationale. (2)  
      *None:* Misstates argument or omits it. (0)  
  *   **Move 3: Articulate Reversal Argument (Favouring Misleader/Instrumentalization)** (8 marks) **<<< GRADE TURNS HERE >>>**  
      *Full:* Clearly explains *why* modeling/inference-exploitation constitutes distinct wrong (instrumentalizing agency). (8)  
      *Partial:* Notes misleader "uses" reasoning but lacks depth on *why* it's worse. (4)  
      *Weak:* Only states misleader is "more manipulative" without argument. (2)  
      *None:* Omits or misunderstands reversal. (0)  
  *   **Move 4: Adjudicate Severity w/ Justification** (5 marks)  
      *Full:* Chooses one speaker as worse *and* provides reasoned justification grounded in Steps 2/3 arguments. (5)  
      *Partial:* States who is worse but justification is weak/unconnected to prior arguments. (3)  
      *None:* Avoids judgment or bases it on non-structural factors (e.g., "lying feels worse"). (0)  
  *   **Move 5: Kind/Degree Distinction + Settling Consideration** (4 marks)  
      *Full:* Correctly identifies Kind *and* identifies the nature of agential violation (bypass vs. instrumentalization) as the settling factor. (4)  
      *Partial:* Correct Kind/Degree but settling factor is vague/misplaced (e.g., "intent"). (2)  
      *None:* Incorrect Kind/Degree or omits settling factor. (0)  

  ---

  **4. Separating First-Class Answer**  
  A first-class answer **explicitly identifies and defends the "instrumentalization of agency"** as the core wrong in manipulative misleading (Move 3, Full marks) and **uses this concept to decisively adjudicate severity** against the standard argument (Move 4, Full marks). A good but unremarkable answer (e.g., 15-18/25) might *mention* both the standard and reversal arguments and *state* that Charlie is worse but fail to:  
  *   **Conceptually Ground the Reversal:** Explain *why* instrumentalization constitutes a distinct/deeper violation beyond just "more manipulation."  
  *   **Leverage it for Adjudication:** Use instrumentalization to *defeat* the standard agency argument in this specific context, rather than just listing it as an alternative view.  

  ---

  **5. Characteristic Errors & Diagnoses**  
  1.  **Error:** "Charlie is less wrong because what they said was literally true."  
      **Diagnosis:** Confuses the *linguistic* distinction (truth/falsity) with the *moral* wrong (which concerns intentional deception and agency violation).  
  2.  **Error:** "Lying is always worse than misleading in every possible case."  
      **Diagnosis:** Assumes a universal hierarchy of wrongs based on the act-type, ignoring the specific structural argument about *how* agency is violated in these matched cases.  
  3.  **Error:** "The difference is one of degree because both are called 'deception' colloquially."  
      **Diagnosis:** Mistakes the *kind/degree* question as pertaining to ordinary language categorization ("lie" vs. "not-lie") rather than the underlying moral structure of the wrongful act.
