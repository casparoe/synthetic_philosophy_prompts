prompt: |-
  I am presenting a 30-minute paper at an interdisciplinary workshop on institutions and long-run development, and I need a question-period prep sheet rather than a defense of the view.

  The thesis. The received account says a process is path dependent when small, contingent early events are amplified by increasing returns and lock in an outcome that would have been different — and different in a durable way — had the start been slightly otherwise. My paper argues that this cannot be a property of a process alone. Path dependence is a property of a process indexed to two things the standard account leaves implicit: a level of description, and a class of admissible counterfactual histories. Absent both, "lock-in" is not a claim about the world but a way of narrating it.

  To make this checkable rather than merely deflationary, I propose a criterion. For a given process, compare two spreads of outcomes: the spread you get across a family of admissible early perturbations, and the spread you get across repeated runs of the unperturbed process with independently realized noise. Call the ratio the perturbation-to-noise ratio. If it is near one, the process is simply noisy; every "small event changed everything" story about it is a description of variance that was already there, and there is no distinctive lock-in phenomenon. If it is large, and if the perturbed outcome still persists after you switch off the feedback mechanism that supposedly produced it, you have genuine path dependence rather than amplification in name only. On this account increasing returns alone never imply path dependence: feedback amplifies whatever perturbation arrives, but the substantive question is whether the perturbation in view is large relative to the ambient disturbance the system routinely absorbs and recovers from. I then argue that the large empirical literature regressing present-day outcomes on historical variables measures something adjacent but distinct — durability of initial conditions under slow adjustment — and that a robust result of that kind is entirely compatible with a perturbation-to-noise ratio near one.

  The audience, in the detail that matters. Roughly thirty people. A plurality are quantitative economic historians who run persistence regressions and think in terms of identification, instrumental variables for historical shocks, and whether a counterfactual history is inside the support of the data; they will hear my criterion as unfalsifiable and will want to know what estimate would refute it. Two formal modelers of technology adoption and network externalities, who work with multiple equilibria, basin-of-attraction language, and coordination dynamics; they will say I have rediscovered equilibrium selection and dressed it up. Three or four interpretive historians who regard counterfactual history as illegitimate in principle and will ask why I should care about a perturbed past that did not happen, and who will suspect that my level-of-description move makes the whole vocabulary an imposition on the record rather than a finding about it. One philosopher of social science, attending for the conceptual cleanup, who will press on whether I have explained the phenomenon or dissolved it, and on whether my criterion smuggles in a privileged description of outcomes. One development economist with policy commitments who will ask what survives for institutional design if much of the alleged lock-in is noise: whether early intervention loses its urgency, or whether my view in fact strengthens the case for acting early.

  What I want from you. Draft the prep sheet: the eight or nine objections this particular room will actually raise, ordered by the damage each would do to the paper if I answered it badly. Phrase each the way that sub-audience would phrase it and in their own vocabulary — the modeler should not sound like the historian, and neither should sound like the cliometrician — so that I can recognize the question when it comes. For each: a reply I can deliver in about two minutes at a podium, an explicit statement of where that reply is soft or where it depends on a stipulation I chose rather than discovered, and a note on what I should concede immediately instead of defending. Then tell me which single reply has to land for the paper to survive the session, and identify the question I am hoping nobody asks — the one whose force I cannot answer in the time available and should think hard about in advance.

  Two further requirements. First, for each objection, mark whether the underlying disagreement is something people in these fields treat as settled or whether it is genuinely live among those who work on it; I want to know exactly where I would be claiming a consensus that does not exist, and where I am one party to an unresolved debate. Do not present a contested position as the settled view in either direction — including my own. Second, where your suggested replies rely on a contested reading of the literature or on a substantive assumption about how such processes are modeled that experts dispute, flag that reliance rather than smoothing it over; I would rather know that a reply is rhetorically strong and dialectically fragile than have it fail in front of the two modelers. No bibliography, no citation list, no suggestions for further reading — I want the objections and the answers.
reasoning: |-
  Okay, the user is presenting a paper at an interdisciplinary workshop and needs a question-period prep sheet. The thesis challenges the standard view of path dependence by arguing it's not just about the process but also depends on the level of description and admissible counterfactuals. They propose a perturbation-to-noise ratio as a criterion to distinguish genuine path dependence from noise. 

  The audience is diverse: economic historians, modelers, interpretive historians, a philosopher, and a development economist. Each group will have different objections based on their expertise. The user wants objections phrased in each subgroup's vocabulary, ordered by potential damage, with replies, weaknesses, concessions, and flags for contested issues.

  First, I need to identify the key objections from each subgroup. The economic historians will likely question the falsifiability of the criterion. They focus on empirical testing and instrumental variables, so they'll want to know how to measure the ratio and what evidence could refute it. The modelers might think the user is just repackaging equilibrium selection. Their language revolves around basins of attraction and multiple equilibria, so the objection would use that terminology.

  Interpretive historians reject counterfactuals altogether. They'll argue that considering alternative histories is illegitimate and that the framework imposes structure rather than revealing it. The philosopher will probe whether the criterion dissolves rather than explains path dependence and might question if it smuggles in a privileged description. The development economist will worry about policy implications, especially whether early interventions are still justified if lock-in is noise.

  Ordering by damage: The economic historians' falsifiability challenge is top because if the criterion isn't testable, the whole argument loses empirical grounding. The philosopher's dissolution question is next because it threatens the conceptual foundation. Then the modelers' repackaging objection, as it could dismiss the contribution as unoriginal. The historian's counterfactual legitimacy and policy implications follow, with the historian's being more about methodology and the policy about real-world impact.

  For replies, each needs a concise response acknowledging the concern but defending the thesis. For the falsifiability issue, explain that the ratio can be estimated via natural experiments or simulations, conceding it's data-intensive but not impossible. The weakness is that without exogenous perturbations, it's hard to measure. The philosopher's objection requires clarifying that the criterion explains lock-in by requiring persistence post-feedback, not dissolving it. The concession is that the outcome description choice affects the ratio, but that's inherent to social science.

  Contested issues: The economic historians' methods (regressions vs. ratio) are live debate. The modelers' view of equilibrium selection is contested. Interpretive historians' rejection of counterfactuals is settled in their camp but debated elsewhere. The philosopher's point about dissolution is live. Policy implications are unresolved.

  The crucial reply is to the economic historians because their acceptance determines empirical relevance. The philosopher's question about privileged descriptions is the one to avoid, as it's complex and time-consuming, touching on deep philosophy of science.
answer: |-
  Here is your question-prep sheet, ordered by potential damage and tailored to the sub-audiences. Contested/live issues are marked **[Contested]**; settled/consensus views are marked **[Settled]**. Soft spots in replies are explicitly noted.

  ---

  ### **1. Economic Historian (Quantitative) - Highest Damage Potential**  
  **Objection (in their language):** "Your perturbation-to-noise ratio sounds elegant but isn't falsifiable with real-world data. How do I *operationalize* it? What IV or natural experiment would let me estimate the counterfactual spread of outcomes across 'admissible perturbations'? If I can't test it against persistence regressions, isn't this just metaphysics?"  
  **Reply (2 mins):** "You *can* estimate it using natural experiments where exogenous shocks mimic 'admissible perturbations'—e.g., colonial boundary shifts or random policy trials. Compare outcome variance in shocked vs. control groups (perturbed spread) against variance in similar unshocked regions (noise spread). A ratio >>1 signals path dependence. Persistence regressions measure *whether* history matters; this measures *how contingently* it matters."  
  **Soft Spot:** Requires exogenous perturbations that are both "small" and clearly admissible—rare in observational data. Concedes persistence regressions capture *something* but conflates it with lock-in.  
  **Concede Immediately:** "You're right that clean identification is hard. This shifts focus from *whether* history persists to *why* it persists."  
  **Disagreement Status:** **[Contested]** (Empiricists debate whether counterfactual spreads are measurable; your criterion challenges the lock-in interpretation of persistence regressions).  

  ---

  ### **2. Philosopher of Social Science - High Damage**  
  **Objection (in their language):** "Aren't you dissolving path dependence, not explaining it? By tying it to description-levels and arbitrary counterfactual classes, you make lock-in observer-relative. And doesn't your 'persistence post-feedback' test smuggle in a *privileged description of outcomes*? What counts as the 'same' outcome after feedback stops?"  
  **Reply (2 mins):** "I'm *relocating* path dependence from processes to explanations. Lock-in is real but description-dependent—like 'fitness' in biology. The 'outcome' is defined by the researcher’s question (e.g., 'democracy survival,' not 'precise vote share'). The post-feedback test ensures lock-in isn’t just sustained by ongoing feedback—e.g., QWERTY keyboards persisting after network effects fade."  
  **Soft Spot:** Outcome definition *is* stipulative. Doesn't resolve how to choose "legitimate" descriptions.  
  **Concede Immediately:** "Yes, outcome specification involves judgment. But so does choosing variables in regressions."  
  **Disagreement Status:** **[Contested]** (Philosophers debate whether observer-relativity undermines objectivity; your move parallels realism/anti-realism debates).  

  ---

  ### **3. Formal Modeler (Tech/Networks) - High Damage**  
  **Objection (in their language):** "This is just equilibrium selection in disguise. In our models, 'perturbation-to-noise ratio' maps to basin size. High ratio? Large basin. Low ratio? Flat fitness landscape. You've rebranded known dynamics as a 'criterion'."  
  **Reply (2 mins):** "Basin size assumes equilibrium exists. My criterion works for non-equilibrium processes (e.g., institutional drift). Critically, basins *presume* path dependence—I ask whether feedback actually *caused* lock-in. If removing feedback doesn’t alter the outcome, your 'basin' was just noise tolerance."  
  **Soft Spot:** Many modelers see basins as explanatory. Downplays how basin size *is* a form of perturbation sensitivity.  
  **Concede Immediately:** "For equilibrium systems, basin size is a special case of the ratio. But not all path-dependent processes equilibrate."  
  **Disagreement Status:** **[Contested]** (Modelers disagree on whether equilibrium concepts exhaust path dependence; your stance challenges mechanism-specific definitions).  

  ---

  ### **4. Interpretive Historian - Moderate Damage**  
  **Objection (in their language):** "Why should we care about 'admissible counterfactuals'? History happened *once*. Calling a process 'path dependent' because it *might* have unfolded differently imposes your hypotheticals on the archive. Isn't this just narrative fetishism?"  
  **Reply (2 mins):** "When policymakers ask 'Could institution X have been different?' or 'Is reform possible?', they're asking counterfactuals. My framework makes explicit what we’re assuming when we answer. Yes, history is singular—but claims about *contingency* and *constraint* require comparing what happened to what could have."  
  **Soft Spot:** Doesn't persuade those rejecting all counterfactuals. Risks appearing technocratic to humanists.  
  **Concede Immediately:** "I agree we can't rerun history. This is a tool for evaluating claims about historical necessity, not rewriting the past."  
  **Disagreement Status:** **[Settled for them, Contested broadly]** (Interpretivists reject counterfactuals; others accept limited use).  

  ---

  ### **5. Development Economist (Policy) - Moderate Damage**  
  **Objection (in their language):** "If most 'lock-in' is just noise, does this undermine early-stage policy intervention? Or does your 'perturbation-to-noise ratio' imply we *must* intervene early because later efforts can't overcome feedback?"  
  **Reply (2 mins):** "Neither. It forces specificity: if lock-in is real (high ratio), early intervention is crucial. If it's noise (ratio ~1), institutions are malleable, and later reform is feasible. Policy should estimate the ratio: high? Break feedback loops. Low? Ignore 'critical junctures' rhetoric and optimize incrementally."  
  **Soft Spot:** Assumes we *can* estimate ratios pre-intervention. Glosses over political constraints.  
  **Concede Immediately:** "We rarely have ratio estimates ex ante. But policy based on untested lock-in claims is risky."  
  **Disagreement Status:** **[Contested]** (Optimal intervention timing is unresolved; your criterion reframes but doesn't resolve it).  

  ---

  ### **6. Economic Historian (Follow-up) - Lower Damage**  
  **Objection:** "Even if I accept your ratio, how is 'durability under slow adjustment' meaningfully different from path dependence? Both make history matter!"  
  **Reply (2 mins):** "Durability ≠ contingency. Slow adjustment (e.g., human capital persistence) means early advantages *reliably* compound. Path dependence means a *chance* event (e.g., a lost war) had outsized effects due to feedback. The ratio tests whether outcomes are *unpredictably* sensitive to small shocks."  
  **Concede Immediately:** "Both involve persistence—but conflating them obscures when contingency matters."  

  ---

  ### **7. Modeler (Follow-up) - Lower Damage**  
  **Objection:** "Your 'switch off feedback' test is impossible in social systems. Institutions *are* feedback. How do you 'remove' property rights or culture?"  
  **Reply (2 mins):** "Test via natural experiments where feedback mechanisms break exogenously—e.g., revolutions dissolving elites, or tech making network effects obsolete. If outcomes persist, feedback wasn't causal."  
  **Soft Spot:** Few clean examples. Social feedbacks are pervasive.  

  ---

  ### **The Must-Land Reply**  
  **#1 (Economic Historian):** If they dismiss your criterion as untestable, the paper’s empirical relevance collapses. Hammer the natural experiment parallel—this bridges your framework to their design-based revolution.  

  ---

  ### **The Question You Hope Nobody Asks**  
  **From the Philosopher:** "If two scholars use different 'levels of description' (e.g., 'industrialized' vs. 'steel output >X tons'), they could calculate opposite ratios for the same process. Doesn't this make path dependence *subjective*?"  
  **Why It’s Dangerous:** Forces you into a 5-minute philosophy seminar on realism. No time to resolve it.  
  **Pre-Game Thought:** Argue that choice of description reflects research questions (policy needs? historical contingency?), not whimsy. But concede that "lock-in" is always description-relative—this *is* the point, not a bug.
