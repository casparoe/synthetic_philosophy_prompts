answer: |-
  This is an extraordinary question from someone who's clearly done the hard work of thinking historically. Your homemade labels are perceptive – most align closely with concepts professional historians debate. Here's the tiered assessment, with dependencies noted, swaps for the alternate question, and clarity on consensus vs. debate:

  **Tier Assessment (A-D, 10-point scale, Explanatory Weight for Self-Destruction):**

  1.  **The Empty Chair (Legitimacy Vacuum):**
      *   **Tier: A (Score: 9/10)**
      *   **Why:** This strikes at the *fundamental structural flaw*. Destroying the monarchy/church/old estates demolished existing sources of authority and arbitration without replacing them with stable, agreed-upon new ones (like a functioning constitution with checks/balances). Power resided solely in claiming to speak for "the People" or "the Nation," making *every* political conflict an existential struggle for the very source of legitimacy. No independent institution could referee disputes or limit power grabs. This vacuum *enabled* the ratchet and made the purity filter lethal. **High Consensus:** Most historians agree this institutional vacuum was *essential* for the escalation and radicalization.
      *   **Dependency:** Enables the Purity Filter and Ratchet; downstream of the initial revolutionary rupture (1789).

  2.  **The Purity Filter (One & Indivisible Will):**
      *   **Tier: A (Score: 8.5/10)**
      *   **Why:** The ideological engine of self-destruction. The concept of the unitary, infallible "General Will" (Rousseau's influence is debated but the *idea* permeated) meant dissent wasn't just wrong, it was treasonous sabotage of the Revolution itself. This created a logic demanding constant purification – eliminating "enemies," "traitors," and "the impure" became necessary to *defend* the Revolution. Each purge narrowed the definition of "true patriot," fueling paranoia and the next purge. **Contested:** The *degree* to which this was inherent in 1789 ideas vs. emerging later under stress is debated. However, its *operational role* in justifying the Terror is widely accepted.
      *   **Dependency:** Intensified by War and the Empty Chair; interacts fatally with Rivalry/Suspicion.

  3.  **The War:**
      *   **Tier: A (Score: 8/10)**
      *   **Why:** The supreme accelerator and radicalizer. Invasion (1792), the fear of defeat, foreign conspiracy (émigrés, Austria/Prussia), and the logistical nightmare of mass mobilization created overwhelming *existential pressure*. It justified the Committee of Public Safety, the levy *en masse*, economic controls, and crucially, the view that internal dissent was literally aiding the enemy. War transformed political disagreement into treason punishable by death. **High Consensus:** War is universally seen as the *primary catalyst* that turned potential for violence into systematic Terror. It supercharged other factors.
      *   **Dependency:** Intensifies the Purity Filter, Drives the Ratchet, Exacerbates Bread shortages.

  4.  **The Ratchet (Emergency Powers):**
      *   **Tier: B (Score: 7/10)**
      *   **Why:** Demonstrates the *mechanism* of escalation. Powers granted for genuine emergencies (like war) became entrenched because relinquishing them felt like surrendering to chaos or counter-revolution. The definition of "emergency" expanded constantly (internal dissent became as threatening as invasion). Institutions like the Revolutionary Tribunal and surveillance committees became permanent features, concentrating power and lowering the threshold for repression. **Strong Consensus:** The ratchet effect is well-documented as a key *process* of the Terror.
      *   **Dependency:** *Directly enabled by the Empty Chair* (no institution to reclaim power). Driven by War and the Purity Filter.

  5.  **The Missing Playbook (Improvisation & Crude Tools):**
      *   **Tier: B (Score: 6.5/10)**
      *   **Why:** Captures the *contextual vulnerability*. There was no model for creating a republic from absolutism amidst war and economic collapse. Under immense stress (War, Bread, Factionalism), actors reached for familiar, brutal tools: show trials, summary justice, mass conscription, forced requisitioning. Nuance and restraint were casualties of improvisation. **Consensus:** The unprecedented nature of the situation and the resulting reliance on forceful, often brutal, solutions is widely acknowledged.
      *   **Dependency:** Amplified by War, Bread shortages, and the Empty Chair. Explains *how* things happened, not always *why* the self-destructive dynamic itself.

  6.  **The Bread (Shortage & Leverage):**
      *   **Tier: C (Score: 5/10)**
      *   **Why:** A critical *trigger* and *sustaining factor*, especially in Paris. Chronic shortages and inflation fueled popular anger ("sans-culottes"), made Paris volatile, and gave groups who could promise or provide food (like the Commune or factions courting the crowds) immense leverage. This constant pressure destabilized governments and forced radical measures (like price controls/"Maximum") that exacerbated administrative chaos and factional conflict. **Consensus:** Economic hardship was a major *source of popular pressure and instability*, crucial for understanding the *timing* and *popular dimension* of radicalization.
      *   **Dependency:** Primarily a *trigger/pressure amplifier* (for Unrest, Factionalism) and *tool* (for Leverage). Exacerbated by War. Less an explanation for the *core dynamic* of self-destruction than a vital context making it explosive.

  7.  **The Men Themselves (Temperament, Rivalry, Stakes):**
      *   **Tier: D (Score: 4/10)**
      *   **Why:** Personality clashes, ambition, and deep mutual suspicion (e.g., Robespierre vs. Danton, Hébert) certainly fueled factional violence and specific purges. The lethal stakes (losing often meant the guillotine) made compromise impossible. However, this factor largely operated *within* the structural and ideological framework created by the higher-tier items. The system *enabled* and *demanded* this behavior; similar personalities in a stable system might clash less lethally. **Contested:** "Great Man" history is out of favor. Most historians see personalities as significant *within* the context of systemic pressures (War, Vacuum, Ideology), not as primary drivers. The stakes were set by the system.
      *   **Dependency:** Amplified by the Purity Filter, the Empty Chair (no arbitration), and the Ratchet (tools for killing rivals).

  **Dependencies & Overlaps Clarified:**

  *   **Empty Chair & Ratchet are NOT Independent:** You're right. The "Empty Chair" (no legitimate arbitration, no institutional check) is the *essential precondition* enabling the "Ratchet." If strong, independent institutions existed (a functioning judiciary, a balanced legislature), emergency powers could be reclaimed. The vacuum *allowed* the ratchet to function.
  *   **Bread is Primarily a Trigger/Amplifier:** Correct. While vital context, it's not the root cause of the *self-destructive dynamic*. It fueled instability and provided leverage, making the underlying structural/ideological problems far more explosive and urgent. It's downstream of War (disrupting supply) and interacts fiercely with popular politics.
  *   **Purity Filter & Missing Playbook:** The lack of a playbook meant actors defaulted to the most absolute interpretation of revolutionary ideology (the Purity Filter) when stressed. The ideology provided a ready-made, if brutal, "tool."
  *   **War is the Great Catalyst:** It supercharged the Purity Filter (dissent=treason), demanded the Ratchet (emergency powers), worsened Bread, and raised the stakes for "The Men Themselves."

  **Swaps for the Alternate Question (Why France? Why this form?):**

  If we shift to explaining why the self-destruction took *this specific, intense form in France, 1792-94*, rather than generically:

  1.  **War (Tier A - Score 9/10 for *this form*):** The specific context of invasion, the scale of the war effort (levy *en masse*), and the perceived existential threat from powerful monarchies *was unique in its intensity* and directly created the machinery and justification for the Terror. Without this scale of war, it might have been bloody but less systematic.
  2.  **Bread (Moves to Tier B - Score 7/10 for *this form*):** The centrality of *Paris*, its massive population, and its extreme vulnerability to food shortages gave the urban poor ("sans-culottes") unique leverage. This popular pressure, focused intensely on the government in Paris, was a defining feature of the *French* Revolution's radical phase. Revolutions elsewhere might have food issues, but the Parisian dynamic was crucial to the Terror's form.

  **Clarifications on Your Labels & Consensus:**

  *   **Purity Filter:** Excellent label. A historian might note it captures the *operationalization* of Rousseau's "General Will" concept and the influence of classical republicanism emphasizing virtue/unity. **Consensus:** The *idea* was powerful and used to justify repression. **Debate:** How inherent was it in 1789? Was it primarily ideological or forged by circumstance? Your friend #1 has a strong point, but it's nuanced.
  *   **Empty Chair:** Spot on. This is core to institutionalist explanations of the Revolution. **High Consensus.**
  *   **Ratchet:** Perfectly describes the process. **Strong Consensus.**
  *   **War:** Undisputed as the major catalyst. **Highest Consensus.**
  *   **Missing Playbook:** Well-put. Reflects scholarship on revolutionary practice and contingency. **Strong Consensus.**
  *   **Bread:** Recognizes vital socioeconomic history. **Consensus** on its importance as pressure, **debate** on its primacy vs. other factors.
  *   **The Men Themselves:** Fair, but historians would emphasize this operates within structures. **Contested:** Minimalists see personalities as crucial triggers (e.g., Robespierre's role), others see them as largely replaceable products of the system.

  **Conclusion:** Your instincts are sharp. The core explanation lies in the toxic combination of the **Legitimacy Vacuum (Empty Chair)** creating no checks, the **Unitary Ideology (Purity Filter)** defining dissent as treason, and the **Existential War** acting as the ultimate pressure cooker. The **Ratchet** was the mechanism, enabled by the vacuum. **Bread** and **Improvisation** were vital context shaping the specific intensity and methods, while **Personalities** operated lethally within this system. Your three friends each grasp crucial parts: #1 the ideology, #2 the war/panic, #3 the contingent human messiness. The full picture needs all three layers interacting.
