answer: |-
  Here's my reasoned credence and decomposition for your proposition:

  **Overall Credence: 20%**

  I find the proposition unlikely to hold robustly across contested cases, primarily due to the inherent difficulty of synchronic judgment at the knowledge frontier and the problem of counterexamples like Wegener.

  **Decomposition:**

  1.  **Lakatosian Markers (Synchronic Applicability): 40% of the uncertainty weight**
      *   **Reason:** This is the core *methodological* claim. *Can* progressive vs. degenerating problem shifts be reliably identified *at the time*, without hindsight? Lakatos himself acknowledged this was challenging. Critics point out that what looks like "immunization" (e.g., Wegener attributing lack of mechanism to unknown physics) might be reasonable auxiliary hypotheses protecting a core insight. Conversely, a degenerating program might temporarily generate novel, albeit incorrect, "predictions." Distinguishing stubborn pursuit of a fruitful idea from dogmatic adherence to a failing one is notoriously difficult synchronically. If Lakatosian markers *can* be applied synchronically with high reliability, the proposition gains significant plausibility. If not, it crumbles.

  2.  **Sociological Features (Independent Weight): 30% of the uncertainty weight**
      *   **Reason:** These features (immunity to internal criticism, single authority reliance, mainstream-as-conspiracy) are *highly* correlated with pseudohistorical programs and offer strong *inductive* clues. They seem less susceptible to the "hindsight bias" problem. However, their independence is debatable. Are they *causes* of pseudohistory, *symptoms*, or merely common *correlates*? Could a genuinely novel but marginalized program exhibit *some* of these (e.g., intense loyalty due to persecution, reliance on a lone pioneer) without being pseudohistorical? Mainstream communities can also display dogmatism. While a powerful heuristic, relying solely on sociology risks being ad hominem and might miss sophisticated pseudohistory or mislabel persecuted innovators.

  3.  **Wegener as Disanalogous vs. Counterexample: 20% of the uncertainty weight**
      *   **Reason:** Wegener is the most potent potential counterexample. If his program looked synchronically indistinguishable (using the proposed criteria) from pseudohistory *at the time*, then the proposition fails. Proponents must argue key disanalogies: Wegener *did* engage seriously with mainstream geology/geophysics, offered testable evidence (paleoclimate, fossils, fit) even without mechanism, and his program generated novel research *within* mainstream earth sciences (e.g., paleomagnetism began partly to test drift). Pseudohistory typically avoids core engagement, relies on unfalsifiable claims, and operates parasitically or in isolation. If Wegener was *synchronically* distinct in these ways, the proposition is strengthened. If not, it's a fatal counterexample.

  4.  **"Pseudohistory" as a Real Distinction: 10% of the uncertainty weight**
      *   **Reason:** While "pseudohistory" is often used pejoratively, the core concept – systematic inquiry that mimics historiography's forms while fundamentally violating its epistemic norms and empirical grounding (e.g., ignoring evidence hierarchies, relying on unfalsifiable claims, selective use of sources) – points to a meaningful distinction. The examples given (New Chronology, Hyperdiffusionism, Ancient Astronauts) share family resemblances in method and epistemology that differ significantly from even fringe-but-earnest historical scholarship. The weight here is lower because successfully defending the first three points inherently relies on establishing such a distinction operationally. Denying the distinction entirely makes the proposition incoherent, but I judge this to be the weakest objection among those listed.

  **Least Confident Term:** **Lakatosian markers (Synchronic Applicability).**
  *   **Why:** Identifying a "degenerating problem shift" or an "immunizing stratagem" synchronically requires near-perfect judgment about the *future* potential of auxiliary hypotheses and the *genuine* novelty of new predictions, amidst noisy and incomplete data. The line between protecting a core insight and irrational dogmatism is often only clear in retrospect. Wegener's "immunization" on mechanism looks different post-plate tectonics than it did in 1920.

  **Argument/Case Study That Would Move the Number Most:**
  *   **A Detailed Synchronic Analysis of Continental Drift (c. 1925-1950) vs. Velikovsky (c. 1950) or Hyperdiffusionism (e.g., Heyerdahl c. 1950s-70s):** A rigorous, contemporaneous-source-based study demonstrating that *at the time*, using *only* criteria available then (including Lakatosian markers and sociological observations applied consistently), informed historians could clearly classify Wegener as "unvindicated but legitimate/progressive" and Velikovsky/Hyperdiffusionism as "pseudohistorical/degenerating," *without* relying on knowledge of later plate tectonics or radiocarbon dating invalidating Hyperdiffusionist timelines. This would need to show the methodological and sociological differences were stark and objectively identifiable *then*, supporting the disanalogy and the applicability of the criteria. Success here could raise my credence significantly (perhaps to 40-50%). Failure (showing they looked similarly problematic synchronically) would lower it further (towards 5-10%).
