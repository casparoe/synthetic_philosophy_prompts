answer: |-
  Your phenomenon is both recognizable and philosophically rich. While no single established term captures it perfectly, the closest fit is **performative classification** with strong normative feedback loops. Let's address your questions systematically.

  ### 1. Established Concepts and Their Fit
  - **Performative Classification (Hacking/Searle)**:  
    Ian Hacking's "looping effects" describe how classifying *humans* (e.g., psychiatric diagnoses) alters their behavior, changing the classification's target. John Searle's "status functions" involve collectively assigning roles (e.g., "money") that only exist because we treat them as such.  
    **Fit**: Your case aligns with the *performative* aspect: the guideline doesn't just describe; it *shapes* reality through human action. But Hacking's "human kinds" explicitly require *awareness* in the classified entities (people reacting to labels). Your examples lack this—beer and dogs don't care. The loop runs purely through **standard-setters** (guideline authors) and **standard-appliers** (brewers/breeders).  
    **Verdict**: The absence of "awareness" in the targets *is* philosophically load-bearing. It means your phenomenon is a subset of performativity *without reflexive subjectivity*. It fits best under **institutional facts** (Searle): socially constructed realities maintained by collective intentionality ("We agree this counts as an IPA").

  - **Teleological Drift**:  
    In biology, "teleonomy" describes purpose-driven change (e.g., artificial selection in dog breeding). Your cases involve **deliberate selection toward a written ideal**, transforming descriptive norms into prescriptive targets.  
    **Fit**: Strong for dog breeds (explicit artificial selection), but weaker for beer, where feedback is mediated by judges/rewards, not direct gene editing. Still, both share a *goal-oriented feedback loop*.

  ### 2. Boundaries: What Separates This from Other Categories?
  Your phenomenon has three key features:  
  (A) **Descriptive origins** (initially summarizing practice),  
  (B) **Normative power** (becoming a target),  
  (C) **Feedback-driven homogenization** (practitioners conform, making future instances align).

  - **Vs. Inert Conventions (e.g., postal districts)**:  
    These lack (B) and (C). Postal codes don't alter geography; they merely label it. No one modifies their house to "better fit" ZIP 90210.  
    **Edge Case (Inert)**: *Time zones*. They codify solar time but don't change Earth's rotation. Even if businesses adjust hours, the sun remains unaffected.

  - **Vs. Pre-existing Natural Kinds (e.g., chemical elements)**:  
    These lack (B) and (C). Gold atoms don't change because we classify them. The pattern exists independently.  
    **Edge Case (Descriptive-Only)**: *Folk botanical classifications*. Pre-scientific societies group plants by utility (e.g., "medicinal herbs"). If the classification guides harvesting but doesn't alter plant traits (no cultivation), it describes without reshaping.

  - **Your Phenomenon’s Edge Cases**:  
    - *On the normative edge*: **Culinary recipes**. A traditional dish description (e.g., "bouillabaisse") may start as descriptive. Once codified by chefs' associations, restaurants conform to win awards, homogenizing the dish. Feedback exists, but weaker than beer/dogs.  
    - *On the inert edge*: **Vintage wine years**. Descriptions (e.g., "2020 was a hot year") predict wine traits, but winemakers don’t alter terroir to match. No feedback loop.

  ### 3. Can Such Categories Be "Wrong"?
  - **Not empirically false in the scientific sense**. Unlike claiming "water is H₃O," these categories can't misrepresent *mind-independent* facts. Their accuracy is *retrospectively validated* by conformity.  
  - **But they can fail functionally**:  
    - *Misalignment with goals*: A beer style guideline could demand hop levels that clash with stability (e.g., rapid oxidation). It’s "wrong" for brewers seeking shelf life.  
    - *Path dependence*: Dog standards favoring extreme brachycephaly may persist despite causing health crises. The category isn’t "false," but it’s *maladaptive*.  
    - *Descriptive failure*: If a style (e.g., "American Lager") no longer matches commercial examples due to drift, it’s obsolete—but this reflects changed practices, not factual error.  

  **Implication**: These categories are **normative tools**, not natural discoveries. Their "truth" is pragmatic: they succeed if they usefully coordinate practice (e.g., guiding brewers or predicting beer traits).

  ### 4. If No Perfect Fit: Coining a Term
  No existing concept cleanly covers your cases. Hacking’s "looping effects" come closest but overemphasize target agency. Thus, I propose:  

  **Teleo-classification**  
  *(from Greek "telos" = purpose/goal)*  

  **Definition**:  
  *A classification system that:*  
  - (i) *Originates as a descriptive summary of existing practices or traits,*  
  - (ii) *Gains normative authority through institutional adoption (e.g., competitions, registries),*  
  - (iii) *Induces practitioners to align future instances with the classification,*  
  - (iv) *Thereby becoming self-validating through feedback loops mediated by human intentionality.*  

  **Exclusions**:  
  - Classifications without feedback (e.g., postal codes).  
  - Classifications of entities with agency responding *to* the label (e.g., medical diagnoses).  
  - Natural kinds (e.g., mineral species).  

  ### Why This Term?  
  It captures the *purpose-driven shaping* (teleology) and the *institutional reinforcement* central to your examples. Beer styles and dog breeds aren’t just described; they’re *steered*.

  ---

  ### Your Requested Assessment
  - **My view**: Teleo-classification is a real, under-theorized phenomenon. Its power comes from **coordination equilibria**: once a standard exists, deviating (brewing outside style, breeding outside standard) carries costs (lost awards, lower sales). Conformity pays, homogenizing the category.  
  - **Where rivals go wrong**:  
    - Calling it *arbitrary* ignores its inferential reliability (you *can* predict beer traits).  
    - Calling it *natural* ignores its dependence on human tinkering.  
  - **What would change my mind**:  
    - If shown a case with identical feedback loops *without institutional enforcement* (e.g., organic market-driven convergence without written standards).  
    - If a classification reshaped its target *without human mediation* (e.g., AI-generated guidelines directly controlling automated breweries).  
  - **Where I might slip**: Overemphasizing intentionality. Perhaps some feedback is emergent (e.g., brewers unconsciously biasing recipes toward past winners). But your cases show deliberate revision cycles, so intentionality seems key.

  **Final Thought**: Teleo-classifications are **fossilized practices turned blueprints**. They work because we collectively *make* them work—a testament to how documents, once wielded socially, don’t just describe worlds but build them.
