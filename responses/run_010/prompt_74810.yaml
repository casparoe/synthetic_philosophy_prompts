prompt: |-
  I'm putting together a handout for my grad seminar on perception and I've got a running list of cases where I'm pretty confident about whether cognition gets inside perception or doesn't, but I can't see what ties my calls together. Here they are.

  1. Checker-shadow illusion — you know the two squares are the same grey and it changes nothing you see. Not penetrated.
  2. Hollow-face mask — same, knowledge is useless. Not penetrated.
  3. Experts tasting a white wine that's been quietly dyed red and describing it with red-wine vocabulary. Penetrated. I think they taste something different, not just say something different.
  4. That old study where kids called a desireable playing card physically bigger than an undesirable one of the same size. Not penetrated — my read is it's a judgement effect, not a perceptual one.
  5. The birdwatcher who picks out a warbler in the foliage where I see only leaves. Penetrated. She sees it; she isn't inferring it.
  6. Someone who hasn't eaten all day is faster to detect briefly flashed food words than a fed control. Not penetrated.
  7. Speakers of a language with two basic blues are faster to discriminate two shades when the shades straddle the label boundary, and the advantage evaporates under verbal interference. Penetrated.
  8. Same speakers, two shades of green where their language draws no line: no advantage at all. Nothing to explain there, but it matters to me that 7 and 8 come apart exactly where the lexicon does.

  The pair that bugs me is 4 and 5: a prior state shifts something appearance-y, structurally identical as far as I can tell, and I call one penetration and one response bias. Same unease with 3 versus 6.

  Then tell me what your principle says about two cases I made up. (a) A subject sees a blurred ambiguous figure for half a second; two seconds after it's gone they're told what it was; later, asked to pick from a set of near-neighbours the image that best matches what they saw, they pick the more prototypical one more often than controls who got the label before viewing. (b) Someone told the building is on fire reports the corridor to the exit as looking longer than a control does.

  What I want: the principle — or the smallest set of them — stated precisely enough that I could apply it to a case I've never seen, with a line on which of my verdicts each clause exists to save, and honesty about which ones it can't. If the cleanest version overturns 4 or 5, say which and why. And end with what would change your mind: which consideration, if I pressed it, would push you to a different principle, or where you think your own reasoning is most likely to break. 400 words max, please.
reasoning: |-
  Hmm, the user is putting together a handout for a grad seminar on perception and cognition. They have a list of cases where they've made judgments about whether cognition penetrates perception or not, but they're struggling to see the underlying principle. They're particularly puzzled by why they classify case 4 (children judging desirable playing cards as larger) as not penetrated, while case 5 (birdwatcher seeing the warbler) as penetrated. They also have concerns about case 3 (expert wine tasters) versus case 6 (hungry people detecting food words).

  The user wants me to provide a clear principle that explains all their judgments, explain how it applies to two hypothetical cases they created, and be transparent about where my reasoning might break down. They want this in under 400 words.

  Looking at their cases, I notice that in the "penetrated" cases (3, 5, 7), there's a clear influence of cognitive states on perceptual processing itself - either changing the interpretation of ambiguous stimuli (wine and bird) or enhancing discrimination at category boundaries (blue shades). The "not penetrated" cases (1, 2, 4, 6) seem to involve either persistent illusions despite knowledge, or effects on judgment/attention rather than perception itself.

  For the hypothetical cases: In case (a), where subjects pick a more prototypical image after being told what it was, this sounds like a memory effect rather than perception, so I'd say not penetrated. In case (b), if someone reports the corridor looking longer during an emergency, this could be penetrated if it's a genuine perceptual change driven by motivational state.

  I think the key distinction is whether cognitive states alter the content or quality of perceptual experience itself versus influencing post-perceptual processes like memory, judgment, or attention. This principle seems to explain most of their judgments, though it might challenge case 4 - if the children genuinely see the desirable card as larger, that would be penetration.

  The biggest vulnerability in my reasoning would be cases where the perceptual/judgmental line is blurry - like case 4. If evidence showed that desire truly alters size appearance (not just judgment), I'd need to reclassify it as penetrated. I'll organize this into a concise response with the principle, application to their cases, verdicts on the hypotheticals, and the vulnerability identified.
answer: |-
  Here's a minimal principle and its application:

  **Principle:** Cognition penetrates perception *only* when it alters the *content or quality* of the perceptual experience itself (e.g., resolving ambiguity, changing apparent properties, enhancing discrimination for ambiguous/stimulus-poor inputs) *based on stored representations* (concepts, categories, labels, expectations). Effects on attention, memory, judgment, or response bias alone are not penetration.

  ### Application to Your Cases
  1.  **Checker-shadow:** Knowledge doesn't alter the *experienced color*. (Saves: 1, 2, 4)
  2.  **Hollow-face:** Knowledge doesn't alter the *experienced depth*. (Saves: 1, 2, 4)
  3.  **Wine experts:** Conceptual knowledge (red wine) alters the *experienced flavor profile* (content/quality). (Saves: 3)
  4.  **Desirable card:** Alters *judgment* of size, not the *experienced size* (like 1 & 2). (Saves: 4) *Overturns your verdict?* If evidence showed *genuine* size appearance change, I'd classify as penetrated.
  5.  **Birdwatcher:** Expertise (stored templates) alters the *experienced visual grouping/content* (the bird "pops out"). (Saves: 5)
  6.  **Food words:** Alters *attention/response speed*, not the *visibility* of the words. (Saves: 6)
  7.  **Blue discrimination:** Lexical category (stored representation) alters the *experienced distinctiveness/discriminability* (perceptual quality). (Saves: 7, 8)
  8.  **Green discrimination:** No lexical category, no alteration of experience. (Saves: 7, 8)

  ### Your Hypotheticals
  *   **(a) Blurred figure, label after:** *Not penetrated.* Effect is on *memory reconstruction/selection* (judgment), not the original ambiguous visual experience. (Like 4, 6).
  *   **(b) Fire, corridor looks longer:** *Penetrated.* Motivational state (fear/need) based on belief (stored representation) alters the *experienced spatial property* (length). (Like 3 - state alters quality).

  ### Vulnerability
  The principle hinges critically on distinguishing *genuine changes in phenomenology* from effects on *post-perceptual processing*. Case **4 (desirable card)** is the biggest risk. If compelling evidence (e.g., eye-tracking, adaptation aftereffects) showed children *saw* the card as larger, not just reported it, I'd have to reclassify it as penetration (like 3 & b), weakening the distinction from judgment or forcing an expansion of "stored representations" to include transient desires/values. My reasoning breaks most where phenomenology is hardest to isolate (like 4).

