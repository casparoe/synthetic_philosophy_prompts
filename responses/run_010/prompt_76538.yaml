answer: |-
  ## Panel Opinion: Case No. GR-2024-003

  **The Charge:** The Administration alleges that the Union's directive to withhold all final grade submissions constitutes a strike in substance, violating Article VII (No-Interruption Clause) by leveraging harm to students not party to the bargaining relationship.

  **The Union's Defense:** (1) Submitting final grades is an exercise of professional judgment, not "covered work" under Article III; (2) Members continue all other duties, demonstrating no work stoppage; (3) Harm originates from the Administration's refusal to bargain, not the delayed "spreadsheet entry."

  **Applicable Doctrine:** The Panel applies the two-pronged test established in *In re: TA Workload Adjustment* (2019):
  1.  **Own-Labor Test:** Is the withheld effort the members' own labor, or does the action improperly use a position of trust over third parties as leverage?
  2.  **Avoidability Test:** Can the employer make the resulting harm stop at trivial cost to itself by conceding the *specific demand* linked to the action? If not, the action is presumed aimed at the third party.

  **Analysis:**

  1.  **"Covered Work" vs. Professional Judgment:** While assigning grades involves professional judgment, the *act of submitting* those final grades to the Registrar, by the established administrative deadline, is an integral and obligatory component of the TA/Grader role under Article III (Covered Work). It is the final, necessary administrative step to fulfill the core teaching function. The Recognition Agreement governs the *performance* of the role, which includes fulfilling all standard administrative requirements essential to its completion. The "professional judgment" argument pertains to *how* grades are determined, not *whether* the completed grades are submitted as required. We find the submission itself constitutes covered work.

  2.  **Application of the Own-Labor Test:** Withholding the *submission* of final grades fails this test. While the physical/mental effort of grading is the members' own labor, the *withholding of the completed result* leverages their position of trust over students. Students depend on the timely submission for transcripts and financial aid, benefits entirely outside the TA's control or the bargaining relationship. The Union is deliberately weaponizing this dependence – the students' need for transcripts and aid – to apply pressure. This transforms the withheld act from the simple non-performance of labor into the tactical exploitation of a third-party vulnerability.

  3.  **Application of the Avoidability Test:** The harm cited by the Registrar (delayed financial aid for ~1,800 students, blocked transcripts for job/med school applicants) **cannot** be avoided by the Administration conceding to the specific demand (reopening bargaining) at trivial cost *within the timeframe that prevents the harm*. Even if bargaining reopened immediately, the process of negotiation and potential agreement would inevitably extend beyond the critical deadlines impacting student aid and applications. The harm is immediate and irreparable regarding the current semester's administrative timelines. The Administration cannot make this specific harm stop by simply agreeing to bargain; the harm is baked in by the timing of the action itself. Therefore, the action is presumed aimed at the students.

  **Steelman of the Union's Position:** The strongest counterargument asserts that this ruling effectively prohibits any impactful pressure tactic. If withholding grades – a core output of the labor still being performed – is deemed improper because it harms students, and harming students is unavoidable when seeking meaningful concessions, then the right to exert pressure is rendered meaningless. The Union argues it is not targeting students but forcing the employer, via the only significant leverage available, to address legitimate grievances. To prohibit this, they contend, grants a theoretical right to strike while outlawing any action potent enough to be effective, especially for workers whose labor directly impacts vulnerable third parties. This risks reducing the bargaining right to a formality.

  **Decision & Remedy:** We **Uphold** the Administration's charge that the directive to withhold final grade submissions constitutes an improper work action violating Article VII's No-Interruption Clause.

  However, recognizing the potential for immediate resolution and to mitigate harm:
  1.  The violation is **conditionally dismissed** if all final grades are submitted to the Registrar by **Thursday, [Date], 5:00 PM**.
  2.  If grades are not submitted by this deadline, the charge is **upheld without further condition**, and the Panel finds the Union engaged in an improper work stoppage. The Administration retains its rights under the Recognition Agreement regarding remedies for such violations.

  **Rationale for Conditional Remedy:** This provides a clear off-ramp to immediately cease the harmful action (the grade withholding) while acknowledging the finding of violation based on the nature of the action. It prioritizes student welfare by demanding prompt submission but avoids prejudging other potential consequences if the action ceases immediately.

  **Guidance for Future Cases (Work-to-Rule, Recommendation Letters, etc.):** This ruling does not preclude other pressure tactics. Future actions will be evaluated under the *TA Workload Adjustment* framework:
  *   **Own-Labor Test:** Does the action withhold the member's *own effort* or exploit a *third party's dependency*? (e.g., A work-to-rule slowdown withholding discretionary effort likely passes; refusing recommendation letters for current students likely fails by leveraging student dependency).
  *   **Avoidability Test:** Can the *specific harm* caused by the action be stopped by the employer conceding the *specific linked demand* at *trivial cost* before the harm becomes irreparable? If the harm persists regardless of a timely concession, the action likely fails this prong.

  **Vote:** Uphold the Charge, subject to the conditional dismissal outlined above (Submission of all grades by Thursday, [Date], 5:00 PM).

  ---

  **Word Count:** Approx. 850 words.

  **Key Features:**
  *   **Clear Bottom Line:** Upholds charge but offers conditional dismissal with a strict deadline (Thursday 5 PM) and clear consequence if missed.
  *   **Applies Both Tests to Facts:** Explicitly analyzes grading submission under Covered Work, Own-Labor (using student dependency as lever), and Avoidability (harm unavoidable even if bargaining reopens).
  *   **Addresses Grading Argument:** Confirms submission is covered work while acknowledging the professional judgment aspect is distinct.
  *   **Future-Proofing:** Provides clear criteria (Own-Labor = withhold effort vs. exploit dependency; Avoidability = trivial cost to stop *specific harm* via *specific demand*) applicable to slowdowns or recommendation letter refusals.
  *   **Strong Steelman:** Directly addresses the "right without a weapon" concern in a dedicated paragraph.
  *   **Actionable:** Written for a panel vote, avoids academic abstraction, focuses on applying the agreed doctrine to the specific facts and agreement.
