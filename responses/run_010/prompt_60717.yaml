prompt: |-
  I am drafting a seminar paper on the debate between moral particularism and moral generalism, and before I circulate it I would like a consistency audit of the position I have actually settled on. I will state the commitments in my own words, in roughly the order in which I hold them. None of them strikes me as obviously false, and I would rather be shown where the structure fails than reassured that it is coherent.

  1. Reasons are holistic. Whether a feature of an act counts in its favour is not settled by the feature itself: that an act would give someone pleasure is a reason for it in one case, no reason at all in another, and a reason against it in a third. Nothing guarantees that what is a reason here will be a reason anywhere else.

  2. That said, I do not think everything is up for grabs in this way. That an act would inflict severe and pointless suffering counts against it in every case in which it occurs, and I would not be moved by a purported counterexample, however carefully constructed.

  3. I do not look for moral principles. My reason is not that the exceptions are too numerous to list, but that any finite statement of a principle must be hedged with provisos whose number and content cannot be foreseen in advance, so the resulting statement is not anything I could deliberate with in a particular case.

  4. Moral knowledge is closer to perception than to inference. One comes to see that this act, in these circumstances, would be cruel, and the seeing does not depend on antecedently holding a general claim.

  5. Competent agents can nonetheless say what speaks for what they did. An agent who could offer nothing at all — no feature of the situation she takes to count in her favour — has not acted for a reason, however well the act turned out.

  6. Acts are wrong in virtue of features they have, and this relation is stable: if a feature makes an act wrong in a case where it is present, it makes an act wrong in any case in which that feature is present in the same way. Wrong-making features carry their force across contexts.

  7. There has been real moral progress, and I want to describe it accurately. When a society came to see that a long-tolerated practice — chattel slavery, marital rape — was wrong, the change is best described as the correction of a principle that society had been operating with, rather than as the mere acquisition of a new perception.

  8. Moral testimony is defective in a way that ordinary testimony is not. One should not believe that an act is wrong simply because a more reliable judge says so, even with good grounds for thinking them more reliable; belief has to track the features of the case.

  What I want from you is an audit, not a defence or a lecture. Identify which pairs of these genuinely conflict and which only appear to, and be explicit about the difference: I suspect that at least two of the pairs you might flag are of very different kinds, and I want to know which is which. For each genuine conflict, say what would have to be given up and what the cheapest revision is that preserves the rest of the set; indicate in each case whether the conflict is fatal to particularism as such or only to my formulation of it. Then rank the conflicts by severity and tell me which single revision would resolve the most. If you think a commitment is not in tension with anything but simply false, say so and argue for that directly. Please do not give me a bibliography or a list of further reading — I want the reasoning, not the sources.
reasoning: |-
  Hmm, the user is asking for a consistency audit of their moral philosophy position, specifically regarding the debate between moral particularism and generalism. They've listed eight commitments and want me to identify conflicts between them, suggest resolutions, and rank the conflicts by severity.

  Let me review their commitments carefully:
  1. Reasons are holistic - features can count for or against an action depending on context
  2. Some moral truths are exceptionless - particularly regarding severe suffering
  3. Rejects moral principles as undeliberable due to infinite provisos
  4. Moral knowledge is perceptual rather than inferential
  5. Agents must be able to articulate reasons for their actions
  6. Wrong-making features are stable across contexts
  7. Moral progress involves correcting principles
  8. Moral testimony is defective compared to ordinary testimony

  The most glaring conflict is between commitment 1 (holism) and commitment 6 (stable wrong-makers). Holism says reasons can flip valence depending on context, but stable wrong-makers suggest certain features always make actions wrong. This goes to the heart of particularism vs generalism - if some features are stable wrong-makers, that sounds like a general principle. The cheapest fix would be to limit commitment 6 only to the "exceptionless" cases mentioned in commitment 2.

  Another tension exists between the perceptual model (commitment 4) and the requirement for articulable reasons (commitment 5). If moral knowledge is intuitive like perception, why must agents be able to verbalize their reasons? The user could resolve this by clarifying that articulation doesn't require deduction from principles - agents can point to salient features without invoking general rules.

  Commitment 7 (moral progress as principle-correction) conflicts with the rejection of principles in commitment 3. If principles are undeliberable, how can societies "correct" them? The user might need to distinguish between explicit principles (which they reject) and implicit societal norms (which can progress).

  Commitment 8 (defective moral testimony) actually aligns well with particularism - if morality is perception-like and context-dependent, it makes sense that we can't simply borrow others' moral judgments.

  The most severe conflict is definitely between holism and stable wrong-makers, as it threatens the core particularist position. Addressing this would resolve the biggest inconsistency while requiring minimal revision - just clarifying that only the "exceptionless" cases from commitment 2 have stable wrong-makers.

  I'll present this analysis systematically, ranking conflicts by severity and suggesting targeted revisions that preserve as much of their position as possible.
answer: |-
  ### Consistency Audit of Your Moral Position

  Your position is a nuanced variant of moral particularism with significant generalist leanings. The core tensions arise from attempting to reconcile radical holism with commitments to moral stability, progress, and epistemic constraints. Below, I identify **three genuine conflicts** (ranked by severity), **one apparent conflict**, and **one substantive but non-fatal tension**. I exclude bibliographic suggestions per your request.

  ---

  #### **Ranked Genuine Conflicts** (From Most to Least Severe)

  1.  **Conflict Between (1) Reasons Holism & (6) Stable Wrong-Making Features**  
      - **Nature of Conflict:** Fatal to pure particularism.  
      - **Analysis:**  
          (1) denies *any* invariant valence to features (e.g., pleasure can be pro-tanto good, neutral, or bad).  
          (6) asserts that *wrong-making features* (e.g., "inflicting severe suffering") are stable: if feature F makes act A wrong in context C1, it makes any act with F wrong in *all* contexts.  
      - **Incompatibility:** (6) implies *exceptionless general principles* for wrongness ("Any act with F is wrong"), while (1) denies such principles can exist for *reasons* (which include wrong-makers). If wrong-making is stable, holism cannot be universal.  
      - **Cheapest Revision:** Restrict (1) to *pro-tanto reasons* (features that count for/against acts but aren't decisive) while exempting *conclusive wrong-makers* (features that always make acts wrong). This preserves (2)’s exceptionless wrongs and (6)’s stability.  
      - **Cost:** Weakens radical holism; concedes a core generalist claim about wrongness.  

  2.  **Conflict Between (3) Rejection of Deliberative Principles & (7) Moral Progress as Principle-Correction**  
      - **Nature of Conflict:** Internal to your view, not fatal to particularism.  
      - **Analysis:**  
          (3) rejects principles because they can’t guide deliberation due to unforeseeable exceptions.  
          (7) describes moral progress as society *correcting a principle* (e.g., "Marital rape is permitted" → "Marital rape is wrong").  
      - **Incompatibility:** If principles are undeliberable and useless, they cannot be the *locus of error* in moral progress. Correcting a principle implies it was (flawed but) operative.  
      - **Cheapest Revision:** Reinterpret (7): Progress isn’t *correcting* a principle but *rejecting* the false *assumption* that a feature (e.g., marital status) could negate a stable wrong-maker (e.g., rape). This aligns with (6) and avoids endorsing principles as deliberative tools.  
      - **Cost:** Weakens the intuition that societies operate with explicit/implicit principles.  

  3.  **Conflict Between (4) Moral Perception & (8) Defective Moral Testimony**  
      - **Nature of Conflict:** Epistemic tension, not fatal.  
      - **Analysis:**  
          (4) treats moral knowledge as direct "seeing" (non-inferential).  
          (8) requires belief to "track features of the case," rejecting reliance on testimony.  
      - **Incompatibility:** If morality is perceptual, testimony *should* transmit knowledge (like describing a visible object). Yet (8) insists moral belief must be grounded in first-personal engagement with features.  
      - **Cheapest Revision:** Limit (8) to *deliberative contexts*: Testimony is defective for *action-guidance* but acceptable for *provisional belief*. This preserves (4)’s perceptual model while explaining why we shouldn’t outsource moral decisions.  
      - **Cost:** Softens the strong stance on testimony.  

  ---

  #### **Apparent Conflict (Resolvable)**  
  **Between (1) Holism & (2) Exceptionless Wrongs**  
  - **Why Apparent?** (2) is a *subset* of (1): Holism allows that *some* features *can* be invariant (e.g., severe suffering counts against).  
  - **Resolution:** (2) constrains but doesn’t contradict (1). No revision needed.  

  ---

  #### **Substantive Tension (Not a Conflict)**  
  **Between (4) Moral Perception & (5) Articulable Reasons**  
  - **Nature of Tension:** (4) suggests non-discursive knowledge ("seeing cruelty"), while (5) requires agents to *verbally articulate* features that count in favor.  
  - **Resolution:** Competent agents can *post hoc* identify salient features without inferring from principles. (4) and (5) are compatible if "saying what speaks for an act" is descriptive, not deductive.  

  ---

  #### **Falsity Assessment**  
  No commitment is "simply false," but:  
  - **(6) Stable Wrong-Making Features** risks overgeneralization. If "severe suffering" is stable *only because* it cannot be negated by context (per your (2)), then "stability" is redundant. If *other* features (e.g., "breaking a promise") are claimed stable, this contradicts (1). **Recommendation:** Tighten (6) to apply *only* to the exceptionless wrongs in (2).  

  ---

  ### **Summary & Strategic Revision**  
  - **Most Severe Conflict:** (1) vs. (6). Resolving this addresses the core tension in your view.  
  - **Highest-Impact Revision:** Restrict (1) to *pro-tanto reasons* and limit (6) to *conclusive wrong-makers* (e.g., "features that invariably make acts wrong when they override all countervailing reasons"). This:  
    - Preserves holism for everyday reasons.  
    - Anchors stability in exceptionless wrongs (2).  
    - Resolves the (1)/(6) conflict and indirectly alleviates the (3)/(7) tension by grounding progress in stable wrongs.  
  - **Outcome:** Your position becomes "particularism about reasons, generalism about wrongness"—a coherent (and defensible) hybrid.  

  Let me know if you need further dissection of specific revisions.
