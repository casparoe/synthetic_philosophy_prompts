  Hmm, the user is a third-year math major grappling with a deep philosophical tension in their mathematical practice. They've noticed a stark contrast between how mathematicians casually invoke Zorn's Lemma in algebra/analysis while treating choice-dependent objects like Vitali sets or Banach-Tarski as "paradoxical" - all while using Lean where choice-dependence is explicitly tracked. They want a coherent philosophy of mathematical existence that explains this double standard.

  The core tension is between mathematical realism (all sets exist equally in the cumulative hierarchy) and pragmatic tractability (only "tame" sets are truly usable). Realism struggles to explain why some choice objects feel illegitimate, while pure constructivism can't justify routine use of Zorn's Lemma. Structuralism doesn't resolve the value judgment about pathological objects, and fictionalism clashes with how mathematicians treat proofs.

  I'll argue for a hybrid view: ontological realism about sets plus epistemic stratification. In this view, all sets exist equally in V, but mathematicians privilege objects with "tame witnesses" - explicit descriptions or nice properties that make them useful for further theorems. This explains why algebraists freely use basis extensions (which always respect vector space structure) but analysts avoid Vitali sets (which break measure-theoretic harmony). The department's stance is coherent if we recognize that "existence" isn't binary but comes in degrees of mathematical utility.

  The user's Lean experience actually supports this: marking definitions noncomputable doesn't deny existence but flags limited usability. If we switched to full constructivism, we'd lose standard theorems about infinite-dimensional spaces; under multiversism, we'd need context-dependent existence claims ("in ZFC universes, there exists..."). Neither matches current practice as neatly.
answer: |-
  ### Bottom Line
  The practice reflects **stratified mathematical realism**: all sets exist in the cumulative hierarchy, but mathematicians prioritize objects with *tractable witnesses*—explicit descriptions, definability, or compatibility with key structures (e.g., measure). Choice-produced objects are "real" but often lack such witnesses, limiting their utility and intuitive acceptability. This isn’t psychological squeamishness but epistemic pragmatism. The stance is coherent if we distinguish ontological commitment ("it exists in V") from mathematical value ("it helps prove tame theorems").  

  ### Brainstorming Candidates  
  1. **Full realism (all sets equally exist)**: Fails—why label B-T "paradoxical" if it’s just another fact?  
  2. **Constructivism (existence requires computability)**: Ruled out—Zorn is used freely.  
  3. **Fictionalism (math is useful fiction)**: Contradicts earnest use of choice in proofs.  
  4. **Multiversism (many set-theoretic universes)**: Doesn’t explain *selective* discomfort—why fret B-T but not maximal ideals?  
  5. **Structuralism (objects defined by relations)**: Neutral on choice, but can’t resolve the asymmetry.  
  6. **Pragmatic realism (existence + tractability)**: Best fit—retains ontology but weights utility.  

  ### Argument  
  Mathematical practice treats existence claims as true of a fixed universe (hence realism), but tacitly values *witnesses* that integrate with "ordinary" mathematics. Vitali sets exist but sabotage measure theory; nonprincipal ultrafilters exist but resist concrete description. In contrast, a maximal ideal’s existence—though choice-dependent—yields consequences (e.g., quotient rings) that align with algebraic intuition and finitary methods. The object itself is rarely inspected; its *relational properties* suffice. Banach-Tarski is "paradoxical" because it violently conflicts with geometric expectations (volume preservation), not because it’s ontologically suspect.  

  Lean’s ledger makes explicit what practice implies: choice is a *tool*, not truth. Tagging `noncomputable` warns that the object lacks computational content, hindering algorithmic use. Textbooks downplay this for ideals/bases because their *consequences* (e.g., dimension theory) are tame and desired independently. The squeamishness arises when choice produces objects that actively *obstruct* further mathematics (e.g., non-measurable sets in analysis).  

  **Rival views strained**:  
  - **Intuitionism**: Rejects non-constructive proofs, but standard math uses them freely.  
  - **Multiversism**: Could say "B-T holds in some universes, not others"—but practitioners don’t relativize ("the decomposition exists" is absolute).  
  - **Fictionalism**: Incompatible with the weight given to existence proofs.  

  **What changes under alternatives?**  
  - **Constructivism**: Textbooks rewrite algebra without choice (e.g., vector spaces need not have bases); Lean drops `noncomputable` by banning choice.  
  - **Multiversism**: Every theorem specifies a universe ("In ZFC universes, B-T holds"); Lean’s ledger tracks which universe a result inhabits.  

  Current practice is coherent: it licenses "the decomposition exists" ontologically while advising "don’t think about it" pragmatically—because it offers no tractable witness. The ledger formalizes this duality.  

