  However, Lewis's triviality result shows that this is impossible unless the algebra is trivial (or the probabilities are 0 or 1 in a way that forces the conditional to be trivial). We will demonstrate on this small example.

  Let:
     R = "it rains" = {A, B} (since either rain&called off or rain&played)
     C = "match is called off" = {A} (since only when it rains and is called off)

  Note: P(C|R) = P(A) / P({A,B}) = P(A)/(P(A)+P(B))

  We want to define a new proposition R→C such that for any credence function P that we might have (by conditionalizing on some evidence that has positive probability) we have:
     P(R→C) = P(C|R) = P(A)/(P(A)+P(B))

  But note: we are going to consider conditionalizing on events that are in the algebra. The algebra initially has the atoms A, B, C and their combinations. We are adding R→C as a new atom? Or making the algebra bigger? Actually, we are extending the algebra to include R→C as a new basic proposition. But then the new algebra will have 4 atoms? Not necessarily, because R→C might be equivalent to a disjunction of some of the existing atoms? But in this case, we want it to be such that it holds the above equation for every possible conditioning.

  Lewis's idea: Consider conditioning on the event R→C and also on its negation. We will see that this leads to contradiction unless the probabilities are 0 or 1.

  Set up a specific numerical example:

  Suppose we start with a probability distribution P0:

     P0(A) = 0.4
     P0(B) = 0.1
     P0(C) = 0.5

  Then P0(R) = P0(A) + P0(B) = 0.5
  P0(C|R) = P0(A) / P0(R) = 0.4 / 0.5 = 0.8

  So we require that P0(R→C) = 0.8.

  Now, what if we condition on the event R→C? Let P1 be the probability distribution we get by conditionalizing on R→C:

     P1 = P0( · | R→C)

  Similarly, we can condition on the negation of R→C: let P2 = P0( · | ¬(R→C))

  But note: we require that for any probability distribution P that we can get by conditionalizing (on any event with positive probability) we have P(R→C) = P(C|R).

  In particular, for P1 and P2:

  1. For P1: 
     P1(R→C) = 1   (because we conditioned on R→C)
     But also, by the requirement: P1(R→C) = P1(C|R) 
     So we have: 1 = P1(C|R) = P1(A) / [P1(A)+P1(B)]

  2. For P2:
     P2(R→C) = 0   (because we conditioned on ¬(R→C))
     And by the requirement: 0 = P2(C|R) = P2(A) / [P2(A)+P2(B)]

  Now, note that P1 and P2 are obtained by conditioning the original P0 on R→C and ¬(R→C) respectively. Therefore, we can write:

     P1(X) = P0(X ∧ R→C) / P0(R→C) = P0(X ∧ R→C) / 0.8
     P2(X) = P0(X ∧ ¬(R→C)) / P0(¬(R→C)) = P0(X ∧ ¬(R→C)) / 0.2

  But what is the event R→C? It must be some subset of the possibility space {A, B, C}. Let us denote:

     R→C = D, where D is a subset of {A, B, C}. Since the atoms are mutually exclusive and exhaustive, we can write:

     D = d_A * {A} ∪ d_B * {B} ∪ d_C * {C}   where d_X is either 0 or 1 (if we are thinking of D as a set of atoms).

  But note: we require that in any probability distribution P (that we get by conditionalizing on some event) we have:

     P(D) = P(C|R) = P(A) / (P(A)+P(B))

  But note that when we condition on D, we get:

     P1(A) = P0(A | D) = P0(A ∧ D) / P0(D)

  But A is an atom. So A ∧ D is either A (if A is in D) or empty (if A is not in D). Similarly for B and C.

  So we have:

     P1(A) = [ P0(A) * I_{A ∈ D} ] / P0(D)
     P1(B) = [ P0(B) * I_{B ∈ D} ] / P0(D)
     P1(C) = [ P0(C) * I_{C ∈ D} ] / P0(D)

  And from condition (1) we have:

     1 = P1(C|R) = P1(A) / [P1(A) + P1(B)]

     => P1(A) = P1(A) + P1(B)   [because the denominator is P1(R) = P1(A)+P1(B) and the ratio is 1] 
     => P1(B) = 0

  But P1(B) = [ P0(B) * I_{B ∈ D} ] / P0(D) = 0

  Since P0(B) = 0.1 > 0, we must have I_{B ∈ D} = 0, meaning that B is not in D.

  Similarly, from condition (2):

     0 = P2(C|R) = P2(A) / [P2(A)+P2(B)]

     => P2(A) = 0

  But P2(A) = [ P0(A) * I_{A ∈ ¬D} ] / P0(¬(D)) = [ P0(A) * (1 - I_{A ∈ D}) ] / P0(¬(D)) = 0

