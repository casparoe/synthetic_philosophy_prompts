  So:

     D = {A} ∪ (possibly a subset of {C})

  But note: the entire space is {A, B, C}. So:

     D = {A} or D = {A, C}

  We now compute P0(D) in both cases:

  Case 1: D = {A}
     Then P0(D) = P0(A) = 0.4, but we need it to be 0.8. Contradiction.

  Case 2: D = {A, C}
     Then P0(D) = P0(A) + P0(C) = 0.4 + 0.5 = 0.9, but we need 0.8. Contradiction.

