  Thus, there is no such proposition D that can serve as R→C.

  What does this show?

  The problem is that the requirement that P(R→C) = P(C|R) for every possible conditionalization (including conditionalizing on R→C itself and on its negation) leads to a contradiction. Therefore, the identity cannot survive re-conditioning. The algebra has room for the new sentence (we can define any subset we want) but the functional equation that must hold for every probability function in the family (obtained by conditionalizing on any event) is too strong.

  Hence, the problem is that the identity can't survive re-conditioning: when we condition on the conditional itself, we get a contradiction.

