answer: |-
  ### Brainstorming Rejects
  1. **"Supplier quietly switches oil types mid-delivery, A checked the initial label"**: Fails because B’s insincere assertion would require them to ignore A’s correct initial report, making B seem recklessly dishonest (violates "no villains" rule).  
  2. **"Batch variation: A memorized the old recipe binder, B knows it changed but lies to avoid drama"**: Fails because A’s evidence (old binder) isn’t "excellent" if updates exist, undermining the "careful thing pointed wrong" requirement.  
  3. **"Dishwasher misplaces allergen tags; A saw correct tag pre-shift, B invents an answer"**: Fails kitchen realism—misplaced tags feel contrived, and B’s lack of evidence might read as laziness.  
  **Chosen Setup**: New coconut-shrimp dish *usually* uses sunflower oil, but today’s batch accidentally used peanut oil. Kitchen has a house rule: "If a guest asks about allergens, confirm only what you’ve *personally verified* on the label—otherwise say ‘no’ to prevent panic."  

  ### Scene (246 words)  
  The lunch rush hummed at Bistro Estelle. At table six, a woman eyed the coconut shrimp. "Peanut oil in this?"  

  Ava—server, meticulous—smiled. "None at all. I checked the delivery invoice this morning: sunflower oil, same as always." (She’d even cross-referenced the binder’s supplier list. The invoice was real—but for yesterday’s batch. Today’s silent oil swap went unlogged.)  

  Ben, clearing the next table, overheard. He’d seen Ava’s invoice. Knew the binder. But the house rule flashed in his mind: *Never guess. No allergen risk means no fear.* He turned. "No peanut oil here. Guaranteed." (He didn’t believe it—today’s labels *were* missing—but the rule saved lives. Today’s batch, by fluke, *was* sunflower oil after all; the chef corrected it last minute.)  

  Chloe paused, ticket in hand. She’d just unboxed the oil. "Hold on—let me confirm." She ducked to the kitchen, scanned the current drum. "Sunflower oil, yes. Safe."  

  The guest relaxed, ordering two portions.  

  ### Norm-by-Norm Check  
  | Norm          | A (Ava)                           | B (Ben)                          | C (Chloe)                      |  
  |---------------|-----------------------------------|----------------------------------|--------------------------------|  
  | **Knowledge** | Violates (lacks knowledge: evidence outdated) | Violates (lacks knowledge: no belief/evidence) | Satisfies (saw current label) |  
  | **Truth**     | Violates (false assertion)        | Satisfies (true assertion)       | Satisfies (true)               |  
  | **Belief**    | Satisfies (sincerely believes)    | Violates (doesn’t believe)       | Satisfies (believes)           |  
  | **Reasonable Belief** | Satisfies (excellent evidence) | Violates (no evidence; has counter-evidence) | Satisfies (direct check)   |  

  ### Key Notes  
  - **Necessary vs. Sufficient Conditions**: The norms are necessary ("assert *only if*...") but not always sufficient. Here, it doesn’t dodge anything: A and B each fail at least one necessary condition, making their assertions defective all-things-considered.  
  - **Setup Features & Risks**:  
    - **A’s evidence quality**: If A *could* have re-checked but didn’t, she’d violate reasonable-belief norm. Keeping her evidence "excellent" (binder + invoice) isolates the error to the assertion.  
    - **B’s insincerity**: If B privately half-agreed, he’d satisfy the belief norm, wrecking the target. His strict disbelief is crucial.  
  - **Truth Norm Defender’s Reply**: They’d argue B’s assertion is *improper for insincerity* (a moral/social flaw)—but this *concedes* the truth norm alone doesn’t condemn it. That quietly hands you the point: truth isn’t enough for proper assertion.  

  Verdict: Knowledge
