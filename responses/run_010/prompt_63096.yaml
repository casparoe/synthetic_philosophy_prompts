  - Target verdicts: both A and B should violate the knowledge norm; A should satisfy belief/reasonable-belief norms but fail truth; B should satisfy truth but fail belief/reasonable-belief.  
  - Post-scene analysis must dissect each norm’s verdict and address edge cases.  

