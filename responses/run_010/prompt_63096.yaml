prompt: |-
  Okay, context first, because it changes what I need from you. I'm a novelist, mid-draft on a book whose middle section lives inside a small restaurant group — two locations, one owner, one training binder, identical menus, the works. I'm not a philosopher. My sister is: she does philosophy of language, and over the holidays she got going about the literature on the norms of assertion, the idea that asserting something isn't just describing the world but making a move that can be made *wrongly*, and that people disagree about what the governing rule is — some say assert only what you know, some say only what's true, some say only what you believe, some say only what you'd be reasonable in believing. She said the way those rules get tested against each other is by building little cases, and I thought, well, that's literally my day job. I want to build one that's good enough to steal.

  So: I want you to act as a philosopher who specializes in speech acts and the assertion-norms debate specifically, not a generalist summarizing Wikipedia. Think hard about whether the pattern below is actually achievable before you start writing, because if it isn't I want to hear that first. The deliverable is one continuous scene, under about 250 words, no philosophy vocabulary anywhere in the dialogue or the narration (it has to drop into a chapter without a footnote), in which three employees answer the same guest question about the same new dish — basically some version of "does this have peanut oil in it?" — and the three answers are engineered to land like this:

  - **A** answers sincerely, and their evidence is genuinely excellent: they did everything the binder requires and more, and the careful thing pointed the wrong way. Their answer is false.
  - **B** answers insincerely — they don't believe what they say — and they have no evidence for it, in fact they have A's confident report as evidence against it; they're following a house rule about allergens that they personally endorse and think is sensible. Their answer is true.
  - **B** flat-out asserts. No hedging, no "I'd assume," no "probably." If B hedges, B isn't asserting and my whole case evaporates, so hold that line.
  - **C** is the boring control: a third answer in the same scene that all four norms agree is fine. I need C to check that the framing isn't doing anything sneaky.
  - Nobody is a villain and nobody is careless in a way a reader would clock. I want the wrongness to live in the asserting, not in the person.
  - No lottery tickets, no fake barns, no unreliable clocks, no one having lied to the staff earlier. Ordinary kitchen facts only.
  - Target verdicts: both A and B violate the knowledge norm; A satisfies the belief norm and the reasonable-belief norm but violates the truth norm; B satisfies the truth norm but violates the belief and reasonable-belief norms. If you think some part of that is unsatisfiable, show me why before doing anything else.

  Before the scene, brainstorm out loud: give me three or four candidate setups in a sentence or two each and say which piece of the spec each one fails, then commit to one. I want to see the rejects. After the scene, run the check norm by norm — a tight list or a small table, what each of the four norms rules for A, B, and C, with the one-line reason. Then flag something my sister mentioned: these rules are usually stated as "assert only if...", i.e. as necessary conditions, so a norm being satisfied doesn't mean the assertion was fine all things considered — tell me whether that distinction is doing real work in my case or whether it's a dodge. Then tell me which feature of the setup is generating each verdict and what breaks if I pull it (say, if B privately half-agrees with what they're saying, or if A could have double-checked and didn't), and how a defender of the truth norm would attack B — I assume they'll say B's answer is improper for a different reason, like insincerity, and I want to know whether that reply rescues the truth norm or quietly hands me the point.

  American English, casual register is fine, no citations and no bibliography — I cant look anything up and neither can you here. End with exactly this line and nothing after it:

  Verdict: <the one norm, if any, that condemns both A and B>
