answer: |-
  You're drilling into precisely why *Re A* is such a corrosive case for the acts/omissions distinction (AOD). Let's map it rigorously, expose the pressure points, and see how the standard theories cope (or don't).

  **I. Mapping Doing vs. Allowing onto *Re A***

  1.  **Agent in Question:** Primarily the *surgeons* performing the separation. Secondary consideration of the *parents* refusing consent. The Trust/hospital is the institutional agent legally authorizing the surgeons. Jodie is the passive beneficiary/victim.

  2.  **The Act vs. The Omission:**
      *   **"Doing" (Killing Mary):** The surgeons physically incising tissue, clamping and severing the shared artery supplying Mary with oxygenated blood from Jodie's cardiopulmonary system. This is an *intervention* into the existing physiological state.
      *   **"Allowing" (Letting Both Die):** The surgeons *refraining* from performing the separation operation. The baseline state is the twins' *current joined physiology*. Within this state, Mary is dependent on Jodie's cardiopulmonary function, which is failing under the strain. "Letting die" means allowing this shared, failing system to run its course, leading to Jodie's heart failure and the death of both.
      *   **Is Clamping One Event or Two?** This is critical. AOD typically assumes separable agents and resources.
          *   *One Event (Pro-Distinction View):* Severing the shared artery is a single, positive act that *causes* Mary's death by removing her life support (Jodie's circulation). Jodie's survival is a separate consequence of removing the parasitic drain.
          *   *Two Events (Anti-Distinction/Re A Reality):* Physiologically, clamping the artery simultaneously:
              *   *Removes an imposition* on Jodie (stopping the drain on her heart/lungs - arguably "allowing" Jodie to live unimpeded).
              *   *Removes a benefit* from Mary (cutting off her oxygen supply - a "doing" that kills her).
          The *same physical action* is both stopping a harmful imposition *and* withdrawing life-sustaining support, depending on which twin's perspective you take. This inseparability is the core problem.

  3.  **The Baseline Problem:**
      *   What is the "normal" or "default" state against which "allowing" is measured? This is the AOD's Achilles heel in *Re A*.
          *   *Option 1: Two Separate Individuals:* If the baseline is two independent infants, then Mary is *already* being kept alive by Jodie's extraordinary effort. Not separating is *continuing* this life support. Separating is *withdrawing* it (an omission relative to continued support). *But this smuggles in the conclusion* that Jodie has no obligation to sustain Mary. It assumes the very point in dispute: whether Mary has a *right* to that shared circulation.
          *   *Option 2: A Single Organism:* If the baseline is the conjoined state as a single physiological entity, then separation is a *massive intervention* that actively destroys part of that organism (Mary), altering its fundamental structure. Not separating is maintaining the status quo.
      *   **The Court's Implicit Baseline:** The Court of Appeal effectively rejected the "two separate individuals with Jodie supporting Mary" baseline *for the purpose of characterizing the surgeons' act as an omission*. Ward LJ explicitly stated Mary had no right to the use of Jodie's body. This *established* the baseline that Jodie's body and its circulatory system belonged to Jodie alone. Therefore, surgeons severing the connection were *protecting Jodie's bodily integrity* by removing an unjust imposition (analogous to self-defence), not withdrawing support Mary was entitled to. **The characterization wasn't neutral; it was the *result* of the normative judgment about rights and bodily autonomy, not the input for it.**

  4.  **What Does AOD Predict?**
      *   *If separation is characterized as an "act" (killing Mary):* It is presumptively unlawful murder unless justified (which the CA sought via self-defence/necessity).
      *   *If separation is characterized as an "omission" (withdrawing life support Mary isn't entitled to):* It might be lawful without needing a special justification, perhaps akin to *Bland* (as the first-instance judge thought).
      *   **The Distinction's Failure to Explain the Outcome:** The CA *rejected* the omission characterization precisely because they felt it obscured the reality of the surgeons' active intervention causing Mary's immediate death. AOD *predicts* that characterizing it as an omission should make it *easier* to justify (as the first-instance judge found). The CA's rejection of that easier path highlights that AOD wasn't driving the result; the underlying normative judgment about bodily rights and the greater good *forced* the characterization. The CA felt compelled to confront the killing head-on and find a justification, rather than hide behind the omission label. This shows AOD being *subordinated* to deeper moral/legal principles, not determining them.

  **II. Where the Distinction Fails or is Irrelevant**

  1.  **Timing of Death & Quality of Life:** AOD is silent. Mary dies months earlier if separated, later if not. Whether those extra months (for a child with severe brain damage, sustained parasitically on her sister) constitute a benefit *worth preserving at the cost of Jodie's life* is a question of proportionality, quality of life, and the value of mere biological existence. AOD offers no tools for this.
  2.  **One Organism or Two Persons?:** This is foundational and prior to applying AOD. If one organism, separation is dismemberment/killing. If two persons, then questions of support/killing arise. AOD cannot resolve this ontological question; it presupposes an answer.
  3.  **Parental Refusal:** Characterizing the *parents'* refusal as an "act" (deciding against surgery) or "omission" (failing to authorize life-saving treatment) is another layer. AOD might suggest refusing is an omission, potentially lawful if within parental rights/discretion. However, the court overruled them, prioritizing the children's *best interests* as determined by the court. AOD doesn't determine who decides or what the best interests are; it's overshadowed by the parens patriae jurisdiction and welfare principle.
  4.  **Bodily Integrity vs. Agency:** You pinpoint the core. The judges (especially Ward and Brooke) were fundamentally concerned with *Jodie's right to bodily autonomy*. Was Mary violating that right by her dependence? Did Jodie (via the surgeons) have the right to use force to stop that violation? **The debate about "act" vs. "omission" was largely a proxy for the deeper, more fundamental question: "Whose body is this?"** The CA concluded the artery/flow belonged to Jodie. Severing it was therefore defending Jodie's property-in-her-body, not killing Mary per se (though death was the inevitable consequence). AOD struggles because it's built for scenarios where resources/space are distinct, not physically shared and interdependent.

  **III. How Standard Theories Cope (or Don't)**

  1.  **Rachels' Bare Difference Argument:**
      *   *Claim:* There's no *moral* difference between killing and letting die if consequences and intentions are identical. The bathtub cases (drowning vs. failing to save) aim to show this.
      *   *Applied to Re A:* Rachels would likely argue: Whether surgeons actively sever the artery (killing Mary) or passively withhold surgery (letting both die), the result (Mary dies, Jodie lives) is identical. The *only* difference is the physical act. Therefore, the moral distinction collapses; the justification must lie in the outcome (saving one life vs. losing two), not the act/omission label.
      *   *Explains Outcome?* Compatible, but doesn't *explain* the CA's reasoning. The CA explicitly *reaffirmed* the moral significance of the act/omission distinction while finding a justification *for the act*. It doesn't address the bodily integrity conflict central to the CA's reasoning. It's a bathtub case with shared physiology, making the "bare difference" even starker, but the CA didn't embrace this view.
      *   *Gets Wrong/Silent:* Silent on bodily integrity/ownership. Doesn't resolve the baseline ambiguity. Compatible with the outcome but rejected by the CA's rationale.

  2.  **Bennett's Positive/Negative Agency:**
      *   *Claim:* The distinction tracks whether the agent's contribution to the outcome is via their *positive* agency (making something happen) or *negative* agency (allowing something to happen by not intervening in existing chains of causation). Relevance depends on the agent's relation to the threat/benefit.
      *   *Applied to Re A:* For the surgeons:
          *   *Re Mary:* Severing the artery is *positive agency* introducing a new causal chain (ischemia) leading to her death. They make her death happen.
          *   *Re Jodie:* Severing the artery is *negative agency* - they remove an existing threat (Mary's parasitic drain) that was part of the causal chain leading to Jodie's impending death. They allow Jodie to live by stopping the harm.
          *   *Re the Status Quo:* Not operating is *negative agency* regarding Jodie (allowing the existing harmful drain to continue) and *negative agency* regarding Mary (allowing the existing beneficial support to continue until it fails).
      *   *Explains Outcome?* This framework *accommodates* the dual nature of the surgeons' act better than simple AOD. It explains why the same act can feel like "killing" Mary and "saving" Jodie. It aligns with the CA's need to see justification for the *positive* agency causing Mary's death.
      *   *Gets Wrong/Silent:* Doesn't resolve *why* the surgeons are justified in using positive agency against Mary to benefit Jodie. It frames the question but doesn't answer the normative core (bodily rights, necessity). Silent on timing/quality/value. Doesn't dictate who decides.

  3.  **Double Effect (DE):**
      *   *Claim:* An act with both good and bad effects may be permissible if: 1) The act itself is good or neutral; 2) The intention is only the good effect (bad effect is foreseen but not intended); 3) The good effect isn't achieved *by* the bad effect; 4) There's a proportionately grave reason.
      *   *Applied to Re A:* (As implicitly used by Walker LJ, focusing on intention).
          *   *Good Effect:* Saving Jodie's life.
          *   *Bad Effect:* Mary's death.
          *   *Act:* The surgical separation (arguably neutral/good - restoring Jodie's health?).
          *   *Intention:* Did surgeons *intend* Mary's death, or merely foresee it as an inevitable side-effect of saving Jodie? The CA emphasized the purpose was to save Jodie, not kill Mary, though death was certain.
          *   *Causal Link:* The bad effect (Mary's death) *is* the means to the good effect (stopping the drain *is* cutting off her blood). This violates condition 3. The CA strained here (Ward LJ argued Mary's death was not the *purpose* but the *price*).
          *   *Proportionality:* Saving Jodie's normal life vs. shortening Mary's severely impaired life was deemed proportionate.
      *   *Explains Outcome?* This was central to Walker LJ's reasoning and influential for others. It provided a doctrinal path to authorize an act causing death by focusing on intention. It *explains* the emphasis on "purpose" in the judgment.
      *   *Gets Wrong:* The causal link problem is severe. Mary's death is inherent in removing the imposition on Jodie. DE struggles with physiologically inseparable good/bad effects. Doesn't resolve the baseline/bodily integrity question; it presupposes the surgeons have the right to act on Jodie's body to remove the burden. Silent on parental refusal.

  4.  **The "Freak" Factor - Physically Plumbed Beneficiary/Victim:**
      *   **This is the critical anomaly.** Standard AOD, Rachels, Bennett, and DE all presuppose scenarios where the agent, beneficiary, and victim are distinct entities, and resources/support are external or clearly assignable. *Re A* presents a unique configuration:
          *   The "support" (blood flow) is physically internal and shared.
          *   The beneficiary (Jodie) is also the source of the "support" being withdrawn from the victim (Mary).
          *   Removing the harm *to* the beneficiary *is* removing the life *of* the victim in one inseparable physical act.
      *   **Consequence:** All theories struggle. AOD fractures on the baseline and action description. Rachels' bare difference is amplified but doesn't resolve the rights conflict. Bennett's framework describes the dual agency but not the justification. DE is strained by the causal inseparability. **The theories weren't built for this.** The CA's solution (self-defence/necessity grounded in bodily integrity) was a novel application precisely *because* the standard categories didn't fit.

  **Conclusion: What Explains the Outcome and What Survives?**

  1.  **Explains the Outcome:** The Court of Appeal's decision was primarily driven by **Jodie's right to bodily integrity and self-preservation** (via the proxy of surgeons acting in her defence/necessity), coupled with a **proportionality judgment** (Jodie's normal life outweighed Mary's short, impaired existence sustained parasitically). The rejection of the omission characterization was a *consequence* of recognizing Mary's dependence as an *unjust imposition* on Jodie, not a status quo creating an entitlement.
  2.  **Compatible, But Not Explanatory:** Rachels is compatible with the outcome but rejected by the CA's reasoning. Bennett provides the most accurate descriptive *framework* for the surgeons' dual agency but doesn't justify it. DE provided the *doctrinal mechanism* (focus on intention) for Walker LJ and influenced others, but its application was strained.
  3.  **Anomaly, Not Confirmation:** *Re A* is a **profound anomaly** for the AOD and related theories. It exposes their limitations in scenarios of extreme physiological interdependence where victim and beneficiary are conjoined, and agency involves altering that shared physical state. The case doesn't confirm any standard theory; it forced the court to innovate (self-defence for a third party against a non-aggressor; necessity applied to killing) precisely *because* the standard categories failed.
  4.  **What Survives?** The case highlights that:
      *   AOD is highly sensitive to the **baseline**, which is often normatively loaded.
      *   **Bodily integrity and resource ownership** are often more fundamental than the act/omission label.
      *   **Intention** (via DE) remains a powerful justificatory tool, even if conceptually strained.
      *   The distinction utterly fails to handle **physiological inseparability** of harm removal and benefit withdrawal.
      *   The distinction has **nothing substantive to say** about timing/quality-of-life trade-offs, ontological status (1 vs. 2 beings), or the authority to decide (parents vs. court) – these were resolved on completely different grounds (welfare principle, medical evidence, parens patriae).

  *Re A* doesn't destroy the acts/omissions distinction, but it demonstrates its severe limitations and contextual dependence. It shows the distinction bending and sometimes breaking under the weight of deeper questions about rights, embodiment, and conflicting lives inextricably linked. It is, as you suspected, a "freak" that the theories weren't built for, forcing a solution grounded elsewhere.
