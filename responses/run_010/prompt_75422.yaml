answer: |-
  **Subjectivism handles this case with least damage, though all bleed.**  

  **Scenario: Aerospace Turbine Blade Failure**  
  AircraftCo faces a $2M warranty claim after a high-pressure turbine blade (HPB) catastrophically failed in flight, grounding a jet. The blade was from a 30-unit prototype run of a new nickel-alloy casting (Alloy-X) using a one-off experimental die. The die broke post-run and was scrapped. Alloy-X blades have two relevant histories:  
  - Batch-level: 2 failures in 30 blades from *this specific die*.  
  - Material-level: 6 failures in 200 blades using Alloy-X *across different dies*.  
  Two engineers assess P(Blade #7 failed | it’s the unexamined returned blade). Maria (process-optimist) notes the die passed QA stress-tests; she uses the tighter batch-level class (2/30 ≈ 0.067). Liam (material-skeptic) highlights Alloy-X’s inconsistent grain structure; he uses the broader material class (6/200 = 0.03). Both see identical inspection reports.  

  **Interpretations in Action:**  
  1. **Frequentist:** Rejects assigning P(E) — E is singular and unrepeatable. Demands a reference class but cannot resolve Maria’s (batch: 2/30) vs. Liam’s (material: 6/200). May *arbitrarily* pick one for decision (e.g., batch: 0.067) but insists this isn’t "probability" of E, just a pragmatic frequency.  
  2. **Propensity Theorist:** Argues E’s probability was fixed by the blade’s *unique physical constitution* (e.g., micro-fractures from die imperfections during casting). But with the die destroyed, they cannot model its causal structure. Retreats to estimating propensity via Alloy-X’s instability (≈0.03) — admitting this is indirect and degraded by the die’s uniqueness.  
  3. **Subjectivist:** Assigns P(E) as rational credence given evidence. Maria: 0.067 (high confidence in die-specific process; prior weights batch data heavily). Liam: 0.03 (prior expects material flaws to dominate). Both are valid; probability *is* their differing degrees of belief.  

  **Key Prising Feature:** The **scrapped, non-repeatable setup** forces divergence. Remove it (tooling exists; 1,000 more blades testable):  
  - Frequentist: Runs new trials, adopts long-run failure rate (e.g., 85/1000 = 0.085) as P(E).  
  - Propensity Theorist: Tests the die’s causal profile, assigns P(E) via refined physical model (e.g., 0.09 ± 0.01).  
  - Subjectivist: Updates priors with new data; Maria/Liam converge near 0.085.  

  **Best Attacks:**  
  - **Frequentist → Others:** "Propensity’s ‘hidden mechanics’ are unmeasurable metaphysics. Subjectivism licenses arbitrary numbers — why is 0.03 ‘rational’ if Liam’s prior is just a hunch?"  
  - **Propensity Theorist → Others:** "Frequentism ignores *why* this blade failed — reference classes are conveniences, not causes. Subjectivism reduces probability to psychology, ignoring physical reality."  
  - **Subjectivist → Others:** "Frequentism dodges single cases by redefining probability. Propensity’s ‘objective tendencies’ are useless here — you *still* used frequency when the die was gone. Only we engage the actual question."  

