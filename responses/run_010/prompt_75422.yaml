prompt: |-
  I'm prepping a seminar on the interpretations of probability and I need a case built to order, because the coin-toss and radioactive-decay examples everyone reaches for lets all three interpretations wriggle off the hook too easily.

  Spec: a realistic workplace — plant, factory floor, workshop, whatever — where someone has to put a number on a single token event that has already happened but whose outcome nobody knows yet, and that number feeds straight into a real decision, like a warranty payout or whether to recall the rest of the batch. Build in three pressures. First, the physical set-up that produced the event was one of a kind and has since been scrapped, so there's no repeatable arrangement to appeal to. Second, the run was small, and there are at least two equally natural reference classes for the event which give noticeably different frequencies. Third, two compitent people who have been given exactly the same information land on different credences for purely prior-driven reasons — not because one of them has spotted some extra bit of evidence the other missed.

  Then show your working. Give the frequentist, the propensity theorist and the subjectivist each answering "so what's the probability of E?", with the reasoning that actually generates their number rather than the number on its own. Tell me which one feature of the case is doing most of the work in prising the three apart, and what happens to all three verdicts if I remove it — concretely, if the tooling still existed and could be run another thousand times. Finish with the best attack each camp has on the other two's verdicts, and don't let any of them win by redefining the question.

  Scenario under about 400 words, whole thing under 1,000. Open with a single sentence giving your bottom line on which interpretation comes out of this case best placed, then the scenario, then the demonstration — no preamble, and don't restate the brief back at me.
