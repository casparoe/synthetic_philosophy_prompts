prompt: |-
  I'm in a fair-ML seminar and I've been trying to pin down what I actually mean when I call a model unfair, because after the impossibility results I'm not sure my intuitions can all be true at once. Here's my gut, case by case:

  1. Credit model, calibrated within groups, group A has a lower average score because their default rate genuinely is lower. Fair.
  2. Same setup, but group A's lower average score traces back to the bank's data only seeing formal loans and missing the rent they pay every month. Not fair, even though the calibration numbers are identical to case 1.
  3. A hospital tool that predicts next-year costs instead of sickness, beautifully calibrated on costs, ends up enrolling fewer Black patients in the care program. Very much not fair.
  4. A hiring screen where race isn't recorded at all so nobody can even check for a gap. Worse than one that records it and shows a gap.
  5. Two applicants who match on everything except zip code get different scores, and every group-level metric still comes out equal. Not fair.
  6. For a benefits-eligibility model I want false negative rates equal across groups, full stop. For an insurance pricing model I think calibration is non-negotiable and equalizing error rates would be a ripoff.
  7. A model that's twice as wrong for a group making up 0.4% of applicants, but every denial goes to a human appeal. Fine. Same model, no appeal process. Not fine.

  Is there a principle, or a small set of them, that delivers all of these? I'm pretty sure 6 is impossible once base rates differ, so tell me which half I have to give up and what's left standing — and be straight about any of the others your principle has to overrule too. I want the clauses tied back to the case that motivates each one, not just a name for a view. Then tell me what it says about one I haven't worked through: an admissions model that's calibrated, has equal false negative rates, and still admits a smaller share of one group, where the office is proposing a seperate threshold for that group to fix it.
reasoning: |-
  Okay, the user is in a fair-ML seminar and grappling with the impossibility results in fairness. They've listed seven specific cases where their intuition tells them whether a model is fair or unfair. They want a unifying principle that explains all these judgments, even though they suspect case 6 might be impossible due to differing base rates. They also want an analysis of an additional admissions model scenario.

  First, I need to break down each case. Case 1: Group A has a genuinely lower default rate, so lower scores are fair. Case 2: Same calibration but due to missing data (rent payments), unfair. The difference here is the data quality or what's being measured. Case 3: Using costs instead of sickness leads to under-serving Black patients, unfair because the outcome measure is misaligned with the actual need. 

  Case 4: Not recording race is worse because you can't audit for bias. Transparency and ability to measure fairness matter. Case 5: Individual unfairness despite group equality—zip code shouldn't affect scores if all else is equal. Case 6: They want different fairness criteria for different contexts—FN equality for benefits, calibration for insurance. But impossibility theorems say you can't have both when base rates differ. So they might need to prioritize one based on the application. Case 7: Appeal process mitigates harm for a small group, showing that procedural safeguards can make an otherwise unfair model acceptable.

  The user's deeper need is to reconcile their intuitions with theoretical limitations. They might be seeking a framework that incorporates context, harm mitigation, and procedural justice beyond just statistical fairness metrics. The impossibility results force trade-offs, so they need principles that guide which fairness criterion to prioritize when.

  For the admissions scenario: calibrated, equal FNR, but lower admission rates for a group. A separate threshold might address representation but could violate calibration. If FNR is equal, the lower admission rate might stem from the group having higher applications or lower qualified applicants. But if the goal is equitable access, the separate threshold might be justified to correct systemic barriers, even if it breaks calibration. The key is whether the outcome aligns with the model's purpose and societal values.

  Synthesizing the principles: Contextual Legitimacy (is the outcome and data appropriate?), Harm Mitigation (procedures to catch errors), and Measurability (ability to audit). Applying these: Case 2 fails legitimacy (data incomplete), Case 3 legitimacy (wrong outcome), Case 4 measurability, Case 5 individual fairness. Case 6 requires choosing based on context—harm of exclusion vs. fairness in pricing. Case 7 harm mitigation via appeals.

  For the admissions case, under Contextual Legitimacy, if societal goals include representation, a separate threshold might be necessary even if it violates calibration. But it should be transparent and based on diagnosed inequities, not just quotas. Harm Mitigation could include appeals. Measurability ensures ongoing monitoring.
answer: |-
  Your intuitions highlight a crucial truth: fairness isn't a single statistical property but a **contextual judgment about harm, legitimacy, and power**. The impossibility theorems prove that no single statistical metric (calibration, equal error rates, etc.) satisfies all intuitions simultaneously when base rates differ. Your cases demand a **pluralistic framework** prioritizing *why* unfairness occurs and *who bears harm*. Here’s a principle set derived from your cases, what you must sacrifice in Case 6, and how it resolves the admissions scenario:

  ---

  ### **Core Principles**
  1. **Contextual Legitimacy**:  
     *The model’s predictions/outcomes must align with a contextually defensible notion of "merit" or "need," and the data must capture relevant factors without perpetuating historical bias.*  
     - **Motivated by Cases 1, 2, 3**:  
       - Case 1: Lower scores are legitimate if Group A *truly* defaults less.  
       - Case 2: Unfair because rent payments are *legitimately relevant* but excluded due to measurement bias.  
       - Case 3: Unfair because "costs" misrepresent "sickness need" for Black patients (legitimacy failure).  

  2. **Harm Mitigation via Procedural Justice**:  
     *Systems must actively reduce harm to marginalized groups through safeguards (e.g., appeals, overrides) and transparency—even if statistical fairness metrics are satisfied.*  
     - **Motivated by Cases 4, 7**:  
       - Case 4: Worse not to record race because auditing harm is impossible (transparency enables mitigation).  
       - Case 7: Human appeals transform an unfair model into an acceptable process.  

  3. **Individual Fairness**:  
     *Similar individuals should receive similar predictions, unless differences are contextually legitimate.*  
     - **Motivated by Case 5**: Zip code differences are illegitimate proxies for merit/need.  

  ---

  ### **The Case 6 Sacrifice**
  - **Your Stance**:  
    - Benefits model: Prioritize equal false negative rates (FNR).  
    - Insurance model: Prioritize calibration.  
  - **The Conflict**: When base rates differ, **calibration and equal FNR are incompatible** (Impossibility Theorem).  
  - **Resolution**:  
    - **Sacrifice statistical consistency**. Adopt:  
      - **Benefits**: Equal FNR minimizes harmful exclusions (denying aid to those who qualify).  
      - **Insurance**: Calibration ensures no group subsidizes another (economic fairness).  
    - **Why It Works**:  
      - *Contextual Legitimacy*:  
        - Benefits: "Need" is binary eligibility; FNR equality ensures equal access.  
        - Insurance: Risk-based pricing requires calibration; equal FNR would force low-risk groups to overpay.  
      - *Harm Mitigation*:  
        - Benefits: False negatives cause direct deprivation (harm).  
        - Insurance: Calibration avoids cross-group exploitation (harm).  

  ---

  ### **Resolving Your Cases**
  - **Case 1**: Fair (Contextual Legitimacy satisfied).  
  - **Case 2**: Unfair (Legitimacy failure: data gap).  
  - **Case 3**: Unfair (Legitimacy failure: outcome misalignment).  
  - **Case 4**: Unfair (Harm Mitigation impossible without auditing).  
  - **Case 5**: Unfair (Individual Fairness violation).  
  - **Case 6**: **Split**—sacrifice one metric per context (as above).  
  - **Case 7**: Conditionally fair (Harm Mitigation via appeals).  

  ---

  ### **The Admissions Model Scenario**
  - **Setup**:  
    - Calibrated, equal false negative rates, but smaller share of Group X admitted.  
    - Proposal: Separate threshold for Group X.  
  - **Analysis**:  
    1. **Why smaller share?**  
       - If base rates differ (e.g., Group X has fewer high-scoring applicants due to structural barriers), calibration and equal FNR can coexist with admission rate gaps.  
    2. **Separate Threshold**:  
       - **Violates calibration**: Group X admits lower-scoring applicants than others.  
       - **May violate Individual Fairness**: Two identical applicants from different groups could have different outcomes.  
    3. **Framework Judgment**:  
       - **Unfair** under *Contextual Legitimacy*:  
         - If "admissions" reflects merit (e.g., academic preparedness), lower-scoring admits may struggle or dilute standards.  
       - **Fair** under *Harm Mitigation*:  
         - If historical barriers suppressed Group X’s scores (e.g., underfunded schools), the threshold corrects for measurement bias.  
       - **Key Test**:  
         - Does the threshold *align with merit* (e.g., proven success of lower-scoring Group X admits) or *impose arbitrary quotas*?  
         - Are there *alternatives* (e.g., better feature engineering) that address bias without violating calibration?  
    4. **Verdict**:  
       - **Conditionally acceptable** if:  
         - (a) Group X’s lower scores stem from contextual illegitimacy (e.g., biased test questions);  
         - (b) The university accepts responsibility for countering systemic barriers;  
         - (c) Outcomes are monitored to ensure admits succeed.  
       - **Otherwise unfair**: If scores are truly merit-reflective, separate thresholds harm both legitimacy and individual fairness.  

  ---

  ### **The Bottom Line**
  You can’t avoid trade-offs (especially in Case 6), but **fairness is preserved by justifying *why* a metric is prioritized in a context**. Your intuitions hold if you:  
  - **Diagnose harm sources** (e.g., data gaps in Case 2, outcome misalignment in Case 3).  
  - **Prioritize metrics that minimize dominant harms** (e.g., FNR for benefits, calibration for insurance).  
  - **Accept that no model is "fair" without auditing and redress** (Cases 4, 7).  

  The admissions case succeeds only if the threshold corrects a *specific, diagnosed injustice*—not as a blunt fix for statistical gaps. This mirrors affirmative action’s ethical foundation: redress, not preference.
