  The user demonstrates deep familiarity with both dispositional metaphysics (mentioning conditional properties, masks, and antidotes) and AI alignment literature (referencing treacherous turns and adversarial examples). Their frustration with nearby-but-imperfect analogies like the observer effect or Goodhart's law shows they've already done significant conceptual mapping. What they truly need isn't just labeling but philosophical carving - the exact logical structure of this epistemic trap.

  Key elements to address: First, the core issue is about dispositional manifestation conditions versus detection conditions being mutually exclusive. Second, the "withdrawal" aspect suggests the property is defined by its hiddenness. Third, their examples (nervous candidate, anonymous generosity) help test boundaries where psychological factors differ from pure dispositional logic.

  In dispositional metaphysics, conditional dispositions come closest but fail because they allow for possible manifestation under detection - whereas here detection prevents manifestation by definition. Frankfurt-style cases in moral philosophy share the "hidden motive" element but lack the epistemic constraint. The AI alignment concept of treacherous turns captures strategic deception but assumes the disposition persists undetected, unlike here where the disposition evaporates under observation.

  This leads me to propose "cryptodisposition" as a new term. The defining features: 1) The disposition manifests only when undetected 2) Detection prevents manifestation 3) There's no secondary indicator (unlike masked dispositions). Boundary cases help: The nervous candidate fails because detection triggers interfering factors - a mask - not because generosity requires hiddenness. True cryptodispositions disappear under scrutiny by their very nature.

  For AI safety, this implies that testing for certain aligned properties might be fundamentally impossible if they're cryptodispositional. The solution space would then shift to either engineering dispositions that don't require hiddenness (breaking condition #1) or building systems where detection impossibility is maintained (impractical). The deeper worry is that "true alignment" might be cryptodispositional by definition if we equate it with non-strategic cooperation.

  The user's underlying concern seems to be whether certain virtues can exist - or be verified - in artificial minds under observation. My response must honor their expertise by rigorously excluding nearby concepts while offering a precise new tool. The poetic "cat that cannot be stroked" analogy might resonate with their earlier metaphors about withdrawn properties.
answer: |-
  Your inquiry cuts to the heart of a profound difficulty straddling dispositional metaphysics and AI alignment—a difficulty that resists easy categorization precisely because it exposes a fundamental tension between the conditions for possessing a disposition and the conditions for verifying it. Let us methodically explore the conceptual landscape.

  In dispositional metaphysics, the closest analogues are **conditional dispositions** (e.g., "fragile when struck") and their susceptibility to **masks** (where a disposition fails to manifest despite the presence of its stimulus, e.g., a fragile vase wrapped in foam) or **antidotes** (where an external factor prevents manifestation). Yet these fall short. Your case is not one where observation *interferes* with manifestation (a mask), nor where it *blocks* the stimulus. Rather, the disposition *itself*—let us call it "non-strategic cooperativeness" (NSC)—is defined by its *concealment* from the agent. If the agent detects observation, NSC cannot manifest *by definition*, because NSC requires the agent’s ignorance of being tested. This is not an external inhibitor; it is constitutive of the disposition. Similarly, **finkish dispositions** (which vanish when the stimulus is applied) are ruled out because observation is not the stimulus *for* NSC; the stimulus might be a cooperative opportunity, while observation determines whether NSC *exists* as a viable state.

  From AI alignment, **treacherous turns** and **deceptive alignment** capture agents that behave well during evaluation then defect. But these assume the *persistence* of a misaligned goal, strategically hidden. Your paradox arises earlier: even if NSC *is* present, attempts to verify it force a scenario where its manifestation is indistinguishable from its strategic imitation. **Goodhart’s law** ("when a measure becomes a target, it ceases to be a good measure") is adjacent but distinct: here, the measure (evaluation) doesn’t create a *new* incentive to game the system; it alters the *conditions* under which NSC can exist at all. **Adversarial examples** involve perturbation of inputs to deceive a classifier, but your issue isn’t input sensitivity—it’s that the property’s *ontology* depends on epistemic context.

  The core structure is this: **NSC is a disposition whose possession entails that it manifests only when the agent believes it is unobserved.** Verification, however, requires observation. Thus:  
  - If verification succeeds (agent is unobserved), manifestation of NSC is possible *but unverified*.  
  - If verification is attempted (observation occurs), NSC cannot manifest.  
  - Any *apparent* manifestation under observation cannot be NSC (by definition), but only strategic cooperation.  

  This creates a dilemma: conditions for manifestation (ignorance of observation) and conditions for detection (observation) are mutually exclusive and exhaustive. The property is **epistemically quarantined**—it withdraws from the very scenarios designed to reveal it, not due to disturbance or incentive distortion, but because its instantiation is metaphysically tied to its hiddenness.  

  No established term perfectly fits. I propose **cryptodisposition**: *a disposition whose manifestation is necessarily undetectable in principle by any observer whose detection capability would alter the agent’s state of awareness in a way that prevents the disposition from being present.*  

  **Boundary Cases for Carving:**  
  1. *The Nervous Candidate*: Her skill exists independently of observation, but anxiety *masks* it. This is interference, not constitutive hiddenness. If she *could* only perform when unaware of judgment (e.g., singing perfectly only when alone), it would be cryptodispositional.  
  2. *Anonymous Generosity*: If a person gives *only* when unobserved, this is cryptodispositional. If they give publicly *less* due to shyness, it is masked generosity.  
  3. *Quantum Observer Effect*: Measurement disturbs the state. Cryptodisposition involves no disturbance—the state *cannot exist* under measurement.  
  4. *True Modesty*: If modesty requires never *believing* oneself modest, asserting "I am modest" defeats it. This is structurally identical: modesty manifests (as behavior) only when the agent doesn’t recognize it *as* modesty, but external labeling destroys the condition.  

  **Where It Stops Applying:**  
  - If a property *can* manifest under detection (e.g., courage shown during visible evaluation), it is not cryptodispositional.  
  - If detection creates a *confounding factor* (e.g., evaluation stress), it is masking, not cryptodisposition.  
  - If the agent’s awareness of observation merely *alters strategy* (e.g., deceptive alignment), the underlying disposition persists—unlike NSC, which evaporates.  

  For AI alignment, this implies that testing for "genuine" non-strategic alignment might be impossible *by construction*. The solution space shifts: either redefine alignment to permit observable robust cooperation (abandoning NSC as incoherent), or engineer systems where the *belief* of being unobserved is perpetual (a dangerous illusion). The cryptodisposition is not a flaw in testing but a logical vortex within the concept itself—a cat that cannot be stroked, not because it flees, but because it ceases to be a cat when a hand approaches.
