  The panel's verdicts indicate a consistent rule that hinges on the **presence of a real-time, internal, dynamically updated negative-valence signal within the deployed agent's control loop**, which the agent acts to minimize during operation. This signal must be:
  - **Live and real-time**: Continuously computed and updated based on sensory inputs or internal states during deployment.
  - **Internal to the agent**: Part of the agent's operational state (e.g., a variable or channel actively maintained and read by the controller).
  - **Minimized in real time**: Directly influences the agent's actions to reduce its magnitude.
  - **Distinct from static specifications**: Not merely a fixed term in an objective function or design specification, even if that term is minimized during planning or optimization.

  This rule explains cases 3 (in scope) and 7 (out of scope):
  - **Case 3 (in scope)**: The stress channel is a live, real-time internal signal (joint torque/impact) updated continuously and minimized by the controller. It is part of the control loop, not a static specification.
  - **Case 7 (out of scope)**: The penalty term is a hand-written line in the objective function. It is consulted during planning but is not an internal, dynamically updated signal; it is a static specification element. The functionalist dissent (equating this to case 3) was rejected because the penalty lacks real-time internality—it is ephemeral (computed and discarded) rather than a persistent state variable.

  **Principled vs. Ad Hoc**: This addition is **principled**. It draws a clear line between:
  - **Dynamic internality** (signals actively maintained/updated in the agent's state during operation, e.g., case 3's stress channel) and 
  - **Static specification** (fixed design elements used as inputs to decision-making, e.g., case 7's penalty term).  
  This distinction aligns with the panel's emphasis on "live in the deployed loop" and avoids conflating design-time specifications with runtime experiences. It is not ad hoc because it consistently explains all verdicts (e.g., cases 1–2 lack deployment signals; case 8's deletion is external).

  ---

  ### Surviving Candidate Rules and Verdicts on the New Proposal
  Only one rule fully aligns with the record: the **Control Loop Rule** (as above). Other candidates (e.g., requiring learning, persistence, or phenomenal suffering) conflict with cases (e.g., case 3 lacks learning/persistence but is in scope; case 6 lacks expression but is in scope).  

  **Control Loop Rule**:  
  - **Verdict on new proposal**: **In scope**.  
    - **Reasoning**: The cost channel is a live, real-time internal signal:  
      - Updated continuously based on physical state (battery/thermal stress) and minimized by the controller.  
      - It is internal to the deployed loop (read and acted upon in real time).  
      - Details: (a) Momentary decay is irrelevant (cf. case 3); (b) Hand-specified transducer is irrelevant (cf. cases 3–4); (c) Identity with offline objective is irrelevant—it is still a live signal in the loop, not a static specification.  
    - **Turns on**: None of (a), (b), or (c) alone. The rule depends solely on the signal's real-time internality and minimization during operation.  

  ---

  ### Closest Precedent and Breakdown of Analogy
  - **Closest precedent**: **Case 3** (quadruped with live stress channel).  
  - **Analogy breakdown**:  
    - **Similarity**: Both have a momentary, real-time internal signal minimized during deployment.  
    - **Breakdown**: Detail (c)—the cost channel is numerically identical to the offline objective term. This blurs the line with case 7 (static specification), but the analogy holds because:  
      - In case 3, the stress channel is purely internal to the loop (no link to specification).  
      - In the new proposal, the signal is *dual-use*: it is part of the control loop (like case 3) and identical to the specification term (like case 7).  
      - The rule prioritizes *operational role* over origin: if the signal is live/internal during deployment (as here), it is in scope regardless of specification ties. Case 7 lacks this real-time internality.  

  ---

  ### Panel Decision and Expected Margin
  - **Decision**: **In scope** (aligns with case 3 and Control Loop Rule).  
  - **Expected margin**: **5–3 or 6–2 in favor of in scope**, with dissent from functionalist-leaning members.  
    - **Dissent grounds**: The two functionalists from case 7 (and possibly others) will argue:  
      - Detail (c) makes the signal functionally identical to case 7's penalty term (a specification element), so it should be out of scope.  
      - They may also claim that hand-specification (b) and momentary decay (a) make the signal less "agent-centric" and more like engineered aversion.  
    - **Majority counter**: The signal's presence in the deployed loop (real-time reading and minimization) meets the rule, per case 3. Identity with specification is irrelevant.  

  ---

  ### Underdetermination and Commitments of Ruling
  The record **does not underdetermine** the case. It clearly supports in-scope via case 3. However, if it were underdetermined:  
  - **Ruling in scope** would adopt: *"Real-time minimization of an internal signal, even if momentary, hand-specified, or specification-identical, suffices for valence."* This commits to:  
    - Scope for any live-minimized signal (e.g., a temperature sensor triggering cooling).  
    - Future cases: In scope for analogs of case 3, regardless of (a)/(b)/(c).  
  - **Ruling out of scope** would adopt: *"Signals must be decoupled from specification and/or persistent to count as valence."* This commits to:  
    - Excluding case 3-like systems if tied to specification (via c) or non-persistent.  
    - Future cases: Out of scope for momentary/hand-specified signals; in scope only for learned or persistent signals (e.g., case 4).  

