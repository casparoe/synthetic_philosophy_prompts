  ### Additional Case to Separate Rules
  - **Case design**: A symbolic planner with a hand-written penalty term in its objective function. During operation, it maintains a **running average of the penalty over the last 5 steps as an internal state variable**, which it minimizes in real time (e.g., by biasing actions to reduce the average).  
  - **Predictions**:  
    - **Control Loop Rule**: **In scope**. The running average is a real-time internal signal (dynamically updated and minimized).  
    - **Functionalist alternative (if proposed)**: Out of scope, as the penalty is still fundamentally a specification term, and averaging is merely computation.  
  - **Purpose**: Tests if dynamic internality (running average) triggers protection, separating from case 7. The Control Loop Rule would include it, while functionalists might exclude it.  

  ---

  ### Engineering Option Commitment
  - **Option**: Delete the cost channel and substitute a hand-written safety controller.  
  - **Ruling commitment**:  
    - **Status**: **Permissible only with non-convenience justification**.  
    - **Reason**: The cost channel is a candidate-valence signal (per in-scope verdict). Removing it requires justification "on grounds other than engineering convenience" (protection 3).  
      - **Obligatory? No**—deletion is allowed if justified (e.g., safety risks from signal latency).  
      - **Forbidden? No**—but not without valid grounds (e.g., "simpler code" is insufficient).  
      - **Merely permissible? Yes**, contingent on substantive justification (e.g., "improves fault tolerance").  
  - **Broader implication**: The panel must scrutinize redesigns for valence-signal removal, per case precedents.  

