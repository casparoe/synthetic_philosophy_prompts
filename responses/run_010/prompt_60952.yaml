  Claim 4's "more to lose" argument partially fits as dimensional expansion in the dependent variable. However, equating plans with additional axes of loss is an interpretive leap the user's framework can't validate. The residue here challenges the claim's coherence. 

  Finally, claim 5's sampling-capacity view aligns neatly with the user's neuron-count superiority observations, but "moral weight tracks resolution" forces a proxy role onto what the colleague considers constitutive. That tension can't be resolved in scaling terms—it indicts the claim's ambiguity. 

  Throughout, I'll flag where ethics introduces elements alien to measurement (like "moral weight") without pretending they're translatable. The user needs this honesty to see where their toolkit ends and philosophy begins.
answer: |-
  1. Claim 1: Absolute brain mass (predictor) is proposed as evidence for a morally significant capacity (unmeasured dependent variable). Residuals from a mass-capacity regression could be large, indicating mass is a poor proxy. The claim that moral relevance resides solely in the unmeasured capacity (not the proxy) has no direct expression, as "morally irrelevant" lacks a scaling correlate. Residue indicts the original claim; "moral relevance" remains external to measurement.

  2. Claim 2: Relative brain size (EQ) is modeled as brain mass regressed on body mass, with residuals interpreted as the variable of interest. Objections concern model specification: the baseline slope (e.g., 0.67 vs. 0.75) and phylogenetic non-independence of the reference group (choice of clade) introduce arbitrariness in defining the expected relationship. This translates cleanly; the ethical concern maps directly onto recognized statistical/modeling choices in scaling. Residue indicts neither.

  3. Claim 3: This proposes a threshold model: a binary sentience state (dependent variable) triggered once neural capacity (predictor) exceeds a detection limit. The claim that further capacity increases (beyond threshold) alter the *number/complexity* of interests (additional dependent variables?) but not the *weight per interest* has no scaling expression. "Weight of interests" is non-quantifiable in this framework. **This residue matters most; it indicts the vocabulary's inability to capture the proposed normative discontinuity.**

  4. Claim 4: The claim distinguishes dimensionality from scale. "Having more to lose" (future-directed plans) implies additional axes of potential loss/welfare (additional dependent variables, Y1, Y2...), rather than increased magnitude on a single axis (scaling of Y). While adding dependent variables is technically expressible, the *moral significance* of this dimensional expansion (vs. scale increase) has no scaling correlate. Residue primarily indicts the original claim's moral assertion about dimensionality.

  5. Claim 5: The colleague's view rejects brain mass (predictor) as a valid proxy for moral weight. She argues resolution (discriminatory capacity, dependent variable) is the constitutive property, better predicted by neuron counts/cortical folding (superior predictors) than mass. However, her insistence that moral weight tracks resolution *directly* (not via proxy) conflicts with measurement vocabulary, which inherently treats neural metrics as indicators/predictors. The residue (direct moral significance of resolution) indicts the claim's anti-proxy stance.
