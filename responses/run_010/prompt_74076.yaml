answer: |-
  Your scientific lens reveals precisely the fault line in the Hart-Devlin debate. Let's address your questions while respecting your focus on conceptual structure, separating the settled from the contested.

  ### 1. The Constitutive/Causal Split: Core of the Dispute
  You've identified the crux. Devlin *does* equivocate, and this undermines his argument:
  - **Constitutive Thesis (Society *is* its shared morality):**  
    This claims that a society's identity is *defined* by its shared moral code. Remove the code, and the entity ceases to be *that* society (like your crystal lattice).  
    *Problems for Devlin:*  
    - It cannot justify preserving *specific* morals (e.g., Victorian sexual norms). If morality changes, it's simply a *new society*, not collapse.  
    - It doesn't entail *enforcement*: a constitutive definition doesn't logically require criminalization (e.g., a society could define itself by shared ideals without jailing dissenters).  
    - **Conclusion:** This thesis cannot license criminalizing "immoral but harmless" acts—it only says that if morality changes, the society changes. Preservation isn't mandated.  

  - **Causal Thesis (Immoral acts *cause* societal collapse):**  
    This claims immorality empirically destabilizes social order (like removing a catalyst).  
    *Problems for Devlin:*  
    - **Empirically false:** Societies tolerate significant moral pluralism without collapsing (e.g., secular democracies). Harmless acts (like private consensual sodomy) show no causal link to collapse.  
    - **Overinclusive:** If collapse is the harm, only *truly destabilizing* acts could be banned—but Devlin wants to ban acts merely because they’re immoral, even if harmless.  
    - **Conclusion:** This reduces Devlin to a consequentialist (harm-prevention) argument with weak evidence. It fails to justify criminalizing *harmless* immorality.  

  **Verdict:** Your split is the core flaw. Neither thesis alone (nor their conflation) justifies Devlin's conclusion. The constitutive thesis is "in the running" only for defining society—not for justifying coercion. **Consensus:** This equivocation fatally weakens Devlin.

  ### 2. Threshold vs. Gradual Disintegration: A Red Herring
  Devlin is ambiguous, but the distinction doesn’t save him:  
  - **Threshold claim:** Implies a "tipping point" of immorality triggers collapse.  
    *Problem:* No evidence for such thresholds; societies adapt dynamically.  
  - **Gradual erosion:** Suggests any immorality weakens social bonds cumulatively.  
    *Problem:* Still requires proof that *harmless* immorality causes erosion (unlikely), and fails to explain why *legal* prohibition is the solution (vs. education, etc.).  
  **Verdict:** Both versions rely on unproven causality. Hart dismisses the collapse claim entirely as speculative. **Consensus:** The disintegration thesis is empirically unsupported—settled against Devlin.

  ### 3. Hart’s Distinction: Legal Moralism vs. Consequentialism
  Hart cleanly separates two justifications for criminalization:  
  - **Legal Moralism:** An act is criminalized *because it is intrinsically wrong*, irrespective of harms. Wrongness itself justifies state coercion.  
  - **Consequentialism (Harm Principle):** An act is criminalized *only to prevent harm to others* (where "harm" includes societal collapse).  

  **Devlin’s Collapse:** By invoking societal disintegration as the reason to enforce morals, Devlin—despite his rhetoric—becomes a consequentialist. He’s not punishing wrongness *as such*; he’s punishing to *prevent the harm of collapse*. This:  
  - Concedes the harm principle’s framework (state coercion requires harm-prevention).  
  - Forces him to prove empirical causation (which he can’t).  
  - Abandons pure legal moralism (wrongness ≠ justification; harm is).  

  **Surviving Disagreement:**  
  - If collapse *were* proven, consequentialists might accept some moral enforcement—but only as harm-prevention, not because acts are "wrong."  
  - Pure legal moralists (e.g., modern natural lawyers) reject this: they insist wrongness *alone* can justify criminalization, even without collapse.  
  **Consensus:** Hart exposed Devlin’s inconsistency. Disagreement persists *only* with theorists who defend pure legal moralism (see Q5).

  ### 4. Dworkin’s Objection: A Separate, Deeper Move
  Dworkin attacks Devlin’s *epistemology of morality*:  
  - Devlin claims society can identify "immorality" through "intolerance, indignation, and disgust" (majority feelings).  
  - Dworkin argues this confuses *emotional reactions* with *moral truth*. Disgust isn’t evidence of immorality (e.g., historic disgust at interracial marriage).  
  - **Key Point:** Even if shared morals *are* constitutive, Dworkin denies that majority sentiment defines morality. Morality requires reasoned argument, not popular passion.  

  **Relation to Hart:**  
  - Hart focused on *whether* morals may be enforced; Dworkin questions *whose morals* count.  
  - Complementary: Hart undermines Devlin’s *justification*; Dworkin undermines his *authority*.  
  **Status:** Dworkin’s critique is widely accepted—reducing majority sentiment to disgust is seen as philosophically naïve. **Live Issue:** The role of emotion in law remains debated (e.g., in "expressive" theories of punishment).

  ### 5. Modern Legal Moralism: Beyond Devlin
  Contemporary legal moralists (e.g., Robert P. George, John Finnis) reject Devlin’s framework. Their key differences:  
  - **No Sociological Claims:** They don’t rely on constitutive identity or collapse. Instead, they argue from *moral realism*: certain acts are objectively wrong, and the state has authority to uphold moral truth.  
  - **Non-Instrumental Justification:** Criminalization is justified *because the act is wrong*, not to prevent harms. Wrongness *intrinsically* demands prohibition.  
  - **Focus on Public Good:** They argue that law shapes character and promotes virtue, which is a non-instrumental good—even for "harmless" acts (e.g., banning bestiality to affirm human dignity).  
  - **Rejection of Majoritarianism:** Morality isn’t defined by majority opinion but by rational natural law.  

  **Structural Difference from Devlin:**  
  Devlin: "We must ban homosexuality because society will collapse without shared morals."  
  Modern Moralist: "We must ban homosexuality because it is intrinsically immoral, degrading human flourishing—regardless of societal collapse."  
  **Status:** This view is a live minority position in legal philosophy, defended rigorously but opposed by liberals (e.g., Rawlsians) who insist on state neutrality.

  ---

  ### Your Hunch: What’s Settled vs. Live
  **Consensus (Settled):**  
  - Devlin’s *specific argument* (enforce morals to prevent collapse) is rejected. His causal claims lack evidence, and his constitutive claims don’t justify coercion.  
  - Hart’s distinction (moralism vs. consequentialism) is foundational.  
  - Dworkin’s critique of "disgust as morality" is widely endorsed.  

  **Live Disagreements:**  
  1. **Legal Moralism:** Can intrinsic wrongness justify criminalization? Perfectionists (yes) vs. Liberals (no, only harm prevention).  
  2. **The "Harm" in Harm Principle:** Does "harm" include erosion of shared values *if proven*? Most say no (it’s too vague), but some communitarians argue for it.  
  3. **State Neutrality:** May the state promote contested conceptions of the good? Perfectionists (yes) vs. Political Liberals (no, if reasonable people disagree).  

  **Your Hunch is Correct:**  
  Devlin lost *as formulated*, but the core idea—that a polity may protect non-instrumental goods (like moral environment or cultural identity)—evolved and persists. Modern defenses avoid his pitfalls, grounding arguments in moral realism or communitarian values. The debate is now more sophisticated: less about "collapse," more about the state’s role in shaping ethical life.  

  **This answer reflects:**  
  - Consensus on Devlin’s failure (Q1–Q4).  
  - One side of live debates (Q5: explaining legal moralism neutrally).  
  - Extrapolation: My characterization of modern moralism is descriptive, not endorsing.  

  Would you like to drill deeper into any contested area? Your physicist’s rigor is an asset here—this is fundamentally about categorical clarity.
