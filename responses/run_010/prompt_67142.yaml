  We are building an exercise for engineers on the Condorcet jury theorem and its misapplication. The scenario involves a panel of engineers making release-risk decisions. The key issue is that the theorem assumes independent voters, but in this case, voters are influenced by a common source (the auto-generated risk summary), which violates independence.

