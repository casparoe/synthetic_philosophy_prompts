  Handout:

  ---
  **Exercise: Release-Risk Panel and the Condorcet Jury Theorem**

  You are part of a trust-and-safety team that assesses whether a new release of a product will cause a user-visible incident. The current process involves a panel of 9 engineers. Each engineer independently reviews a risk summary and then votes "safe" or "unsafe". 

  From two years of logged decisions, an individual engineer (voting alone, before seeing anyone else's call) correctly predicts whether a release will cause an incident 68% of the time.

  Leadership wants to scale the panel to 400 engineers, citing the Condorcet jury theorem, which they say guarantees that the error rate of the panel's majority vote will approach zero as the panel grows.

  However, there is a catch: every panelist reads the *same* auto-generated risk summary before voting. An internal audit reveals:
  - The risk summary is correct 70% of the time (i.e., correctly predicts whether there will be an incident).
  - When the risk summary is correct, an individual panelist is correct 90% of the time.
  - When the risk summary is wrong, an individual panelist is correct only 15% of the time.

  **Part A (10 points)**
  1. Using the Condorcet jury theorem naively (i.e., assuming independence and using the 68% figure), what would the theorem predict for the probability of a correct majority vote in a 400-person panel? (You do not need to compute an exact number; the limit will suffice.)
  2. What does the actual probability of a correct majority vote converge to as the panel size goes to infinity? Explain why the naive prediction (from part 1) and this actual limit differ.
  3. Compute the probability of a correct majority vote for the current 9-person panel under the audit model (i.e., using the conditional probabilities provided). Use the exact conditional probabilities from the audit (even if they don't exactly match the 68% marginal, use them as provided). You may approximate the binomial probabilities to two decimal places if you wish, but show your work.

  **Part B (10 points)**
  Now consider a different scenario. The audit reveals:
  - The risk summary is correct 45% of the time.
  - When the risk summary is correct, an individual panelist is correct 90% of the time.
  - When the risk summary is wrong, an individual panelist is correct 25% of the time.

  1. Compute the marginal probability that an individual panelist is correct (i.e., the single-panelist accuracy).
  2. What does the Condorcet jury theorem naively predict for the large-panel limit (using the marginal probability from B1)?
  3. What does the actual probability of a correct majority vote converge to as the panel size goes to infinity?
  4. Based on these numbers, what would happen to the accuracy of the panel's majority vote as the panel size increases? Should leadership follow the "add more voters" advice? Explain in plain English.

  **Part C (10 points)**
  We want to redesign the process so that we can honestly apply the Condorcet jury theorem (i.e., achieve the conditions under which the theorem holds). Alternatively, propose an alternative aggregation rule that might be more robust to the dependence.

  1. Propose a concrete change to the process that would allow us to achieve independence (or the necessary conditions for the theorem). Explain why this change would help.
  2. Describe what data you would use from our existing logs to test whether your change has achieved the necessary independence. Be specific about the statistical test or metric.

