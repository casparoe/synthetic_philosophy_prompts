  ### Exercise Handout: Release-Risk Panel Analysis

  **Background**  
  Our release-risk panel has 9 engineers. Historical data shows an individual engineer (voting alone) correctly predicts whether a release will cause a user-visible incident 68% of the time. Leadership proposes scaling the panel to 400 engineers, citing the *Condorcet jury theorem* (which states: with independent voters each better than a coin flip, majority-vote accuracy approaches 100% as the panel grows).  

  **The Catch**  
  Every panelist reads the **same** auto-generated risk summary before voting. An audit reveals:  
  - The summary is correct 70% of the time.  
  - When the summary is **correct**, an individual panelist is correct 90% of the time.  
  - When the summary is **wrong**, an individual panelist is correct 15% of the time.  

  ---

  **Part A (10 points)**  
  1. Using the theorem naively (with the 68% figure and assuming independence), what does it predict for a 400-person panel’s majority-vote accuracy?  
  2. What does the process *actually* converge to as the panel grows to infinity? Explain why the naive prediction and actual limit differ.  
  3. Compute the majority-vote accuracy for the **current 9-person panel** using the audit’s conditional probabilities (even if they don’t perfectly match 68%). Show your arithmetic.  

  **Part B (10 points)**  
  Now assume a different audit:  
  - Summary correct 45% of the time.  
  - If summary correct, panelist correct 90% of the time.  
  - If summary wrong, panelist correct 25% of the time.  
  1. Compute an individual panelist’s marginal accuracy.  
  2. What does the theorem naively predict for a large panel?  
  3. What is the *actual* large-panel limit?  
  4. Should leadership "add more voters" here? Explain in plain English.  

  **Part C (10 points)**  
  Propose a **concrete change** to the voting process to legitimately apply the theorem (or an alternative aggregation rule if the theorem can’t apply). Then, specify:  
  1. How your change addresses the independence issue (or why an alternative rule is better).  
  2. What **existing logged data** you’d use to test if your change worked, including a specific empirical metric/test.  

  ---

  ### Model Answer  
  **Part A**  
  1. **Naive prediction:** Theorem assumes independence and \(p = 0.68 > 0.5\). For 400 panelists, majority accuracy \(\rightarrow 1\) (100%) as \(n \rightarrow \infty\).  
  2. **Actual limit:** Votes depend on the shared summary. As \(n \rightarrow \infty\):  
     - If summary correct (70% chance), panelist accuracy \(= 0.9\). Majority always correct.  
     - If summary wrong (30% chance), panelist accuracy \(= 0.15\). Majority always *wrong*.  
     Overall: Majority accuracy \(\rightarrow (0.7 \times 1) + (0.3 \times 0) = 0.7\) (70%).  
  3. **9-panel accuracy:** Split cases using audit probabilities:  
     - **Summary correct (70%):** Binomial \(X \sim \text{Bin}(9, 0.9)\). \(P(\text{majority correct}) = P(X \geq 5)\).  
       \(P(X \leq 4) = P(X=0) + \cdots + P(X=4)\):  
       \(P(X=0) = 0.1^9 \approx 0\)  
       \(P(X=1) = 9 \times 0.9 \times 0.1^8 \approx 0\)  
       \(P(X=2) = \binom{9}{2} \times 0.9^2 \times 0.1^7 \approx 0.000003\)  
       \(P(X=3) = \binom{9}{3} \times 0.9^3 \times 0.1^6 \approx 0.00006\)  
       \(P(X=4) = \binom{9}{4} \times 0.9^4 \times 0.1^5 \approx 0.00083\)  
       \(P(X \geq 5) \approx 1 - 0.000893 = 0.999\).  
     - **Summary wrong (30%):** Binomial \(Y \sim \text{Bin}(9, 0.15)\). \(P(\text{majority correct}) = P(Y \geq 5)\).  
       \(P(Y=0) = 0.85^9 \approx 0.232\)  
       \(P(Y=1) = 9 \times 0.15 \times 0.85^8 \approx 0.368\)  
       \(P(Y=2) = \binom{9}{2} \times 0.15^2 \times 0.85^7 \approx 0.260\)  
       \(P(Y=3) = \binom{9}{3} \times 0.15^3 \times 0.85^6 \approx 0.107\)  
       \(P(Y=4) = \binom{9}{4} \times 0.15^4 \times 0.85^5 \approx 0.028\)  
       \(P(Y \geq 5) \approx 1 - 0.995 = 0.005\).  
     Overall: \((0.7 \times 0.999) + (0.3 \times 0.005) = 0.701\).  
  **Why predictions differ:** Naive application ignores dependence induced by the shared summary. Votes are conditionally independent *given the summary* but unconditionally correlated, capping accuracy at the summary’s 70%.  

  **Part B**  
  1. **Marginal accuracy:**  
     \(p = (0.9 \times 0.45) + (0.25 \times 0.55) = 0.405 + 0.1375 = 0.5425\) (54.25%).  
  2. **Naive prediction:** Since \(p = 0.5425 > 0.5\), theorem predicts accuracy \(\rightarrow 1\).  
  3. **Actual limit:**  
     - Summary correct (45%): Majority accuracy \(\rightarrow 1\).  
     - Summary wrong (55%): Panelist accuracy \(= 0.25\), majority accuracy \(\rightarrow 0\).  
     Overall: \((0.45 \times 1) + (0.55 \times 0) = 0.45\) (45%).  
  4. **Advice:** Do **not** add voters. Accuracy drops to 45% (below a coin flip!) because the panel amplifies the summary’s inaccuracy. Scaling worsens outcomes.  

  **Part C**  
  1. **Proposed change:** Generate **unique risk summaries per panelist** (e.g., different LLM prompts/models). This breaks shared dependence, restoring independence (votes depend on private signals).  
     *Alternative:* Use a **weighted voting rule** (e.g., log-odds aggregation) accounting for summary reliability. But the theorem’s majority-vote guarantee requires independence.  
  2. **Test with existing logs:**  
     - **Metric:** For cases with \(\geq 2\) voters, compute **pairwise correlation** (phi coefficient) between votes, split by true outcome.  
       - Under independence, \(\phi \approx 0\).  
       - Current process: Expect \(\phi > 0\) (e.g., if both follow summary).  
     - **Test:** For true incidents (and non-incidents), calculate \(\phi\) across all voter pairs. Use Fisher’s exact test (\(\alpha = 0.05\)) per group to reject independence if \(\phi \neq 0\). Post-change, \(\phi \approx 0\) confirms independence.  

  ---

  ### Marking Scheme (30 points)  
  **Part A (10 points)**  
  - **A1 (1 pt):** Predicts naive limit = 1.  
  - **A2 (3 pts):** Actual limit = 0.7; explains summary-driven cases.  
  - **A3 (4 pts):** Correct \(P(\geq 5)\) for both binomials (0.999 and 0.005); combines to 0.701.  
  - **A2/A3 (2 pts):** Explicitly ties divergence to summary-induced dependence.  
  - *Frequent mistakes*:  
    - Uses 0.68 for A3 (no credit for A3 arithmetic).  
    - Claims actual limit = 0.68 (loses 3 pts for A2).  

  **Part B (10 points)**  
  - **B1 (2 pts):** Marginal \(p = 0.5425\).  
  - **B2 (1 pt):** Naive limit = 1.  
  - **B3 (2 pts):** Actual limit = 0.45.  
  - **B4 (3 pts):** Advises against scaling; explains accuracy drops to 45% (below coin flip).  
  - **B4 (2 pts):** Plain English: "Scaling worsens decisions" or equivalent.  
  - *Frequent mistakes*:  
    - Uses \(p = 0.5425\) for B3 (loses 2 pts).  
    - Omits "below 50%" in B4 (loses 1 pt).  

  **Part C (10 points)**  
  - **C1 (4 pts):** Concrete change (e.g., unique summaries) + justification ("breaks shared dependence").  
  - **C1 (2 pts):** Notes independence is required for theorem (or justifies alternative rule).  
  - **C2 (3 pts):** Test: Uses pairwise correlation (phi) split by true outcome; names Fisher’s test or equivalent.  
  - **C2 (1 pt):** Uses existing logs (no new data).  
  - *Frequent mistakes*:  
    - Vague change ("improve summaries") + no test (max 3 pts).  
    - Tests only marginal accuracy (loses C2 marks).  

  **Competent vs. Top Answers**  
  - **Competent (20–24 pts):** Correct arithmetic, identifies dependence, reasonable C proposal.  
  - **Top (26–30 pts):** Explicitly links conditional/unconditional independence in C; designs test for *conditional* independence.  

  ---

  ### Note on Disagreements  
  1. **Part A/B limits:** Strong candidates may note the actual limit assumes *perfect* correlation. If panelists sometimes override the summary, the limit could be higher (but still <1). This deserves *no penalty* but is not required.  
  2. **Part C independence:** Some may argue *conditional* independence given the truth suffices (a valid variant of the theorem). If they design a test for this (e.g., pairwise independence within true-outcome groups), award full credit.  
  3. **Weighted voting:** An alternative rule (e.g., Bayesian aggregation) is acceptable if they explain why the theorem doesn’t apply *and* propose a test (e.g., cross-validation on logs).  
  4. **Target metric:** A candidate may argue "majority correctness" is the wrong goal (e.g., we care more about false negatives). This insight (if brief) earns +1 bonus point but is beyond scope.  

  **Number Adjustment**:  
  - Your Part A numbers are consistent (marginal \(p = 0.7 \times 0.9 + 0.3 \times 0.15 = 0.675 \approx 0.68\)).  
  - Part B’s 45% limit is intentionally jarring—scaling *reduces* accuracy.
