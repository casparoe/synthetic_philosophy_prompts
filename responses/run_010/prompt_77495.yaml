  ### Marking Scheme  
  **Total: 25 marks**  

  **Grade A (21.25–25 marks):**  
  - **(a)** Full derivation of posteriors and gains; correct sign dependence for \(k \geq 1\).  
  - **(b)** Clear distinction for \(k = 0\) with impossibility of \(B\); explicit refutation of naive reasoning.  
  - **(c)** Correct proof for \(E[S]\); coherent discussion linking boundary to diagnoses; clear justification that (ii) resolves the paradox, while (i) has a secondary role.  
  - **(d)** Identifies undefined expectation as the issue; correctly rejects refutation of decision theory.  

  **Grade B (17.5–21 marks):**  
  - **(a)** Minor errors (e.g., off-by-one in gain), but correct structure and sign conclusion.  
  - **(b)** Recognizes difference at \(k = 0\) but weak refutation of naive reasoning.  
  - **(c)** Correct \(E[S]\) boundary; partial link to diagnoses (e.g., misses that (ii) explains the dominance).  
  - **(d)** Identifies the breakdown but vague on decision theory.  

  **Common Errors and Penalties:**  
  1. **Appealing to what the organizer can afford (ignoring fixed \(r\)):**  
     - Cost: \(-1\) mark per occurrence (max \(-2\) marks).  
  2. **Assuming equiprobability after observation without justification:**  
     - Cost: \(-2\) marks in (a) or (b).  
  3. **Claiming no proper prior licenses always switching (without noting "finite mean"):**  
     - Cost: \(-1\) mark in (c) or (d) (as part (c) shows it holds for \(r > 1/2\) with infinite mean).  
  4. **Algebraic errors in (a) (e.g., \(S = 2^{k-1}\) for \(B\)):**  
     - Cost: \(-1\) to \(-2\) marks depending on severity.  
  5. **Misidentifying the breakdown in (d) (e.g., claiming countable additivity fails):**  
     - Cost: \(-2\) marks.
