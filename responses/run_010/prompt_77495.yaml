  Also, derive the expected gain from switching as a function of r and k. Then show that for k>=1, the sign of the gain depends only on r.

  Solution for (a):
  Let A be the event that the chosen envelope is the smaller one (so it contains S). Then the other envelope contains 2S.
  Let B be the event that the chosen envelope is the larger one (so it contains 2S) and the other envelope contains S.

  We are given that the prior probability for which envelope is chosen is 1/2 for each. The prior distribution of S is given: P(S=2^k) = (1-r) r^k.

  Note: The observed value is X. If the player has the smaller envelope, then X = S. If the player has the larger envelope, then X = 2S. Therefore, if we observe X=2^k, then:

  Case 1: The chosen envelope is the smaller one (event A). Then S = 2^k, and the other envelope has 2S = 2^{k+1}.
  Case 2: The chosen envelope is the larger one (event B). Then 2S = 2^k, so S = 2^{k-1} (if k>=1) or if k=0 then S=2^{-1} which is not in the support? But note: our S is defined for k=0,1,2,... so S=2^k only for nonnegative integers k. Therefore, for k=0, if we are in case B, then 2S=2^0=1 => S=1/2, which is not of the form 2^k for k>=0. Thus, for k=0, case B cannot occur? But wait: the prior on S only has positive mass on 2^k for k>=0. Therefore, the event that the chosen envelope is the larger one and the amount is 2^k must correspond to S = 2^{k-1} (if k>=1) and if k=0, then S=2^{-1} is not in the support. Hence, for k=0, the only possibility is that we have the smaller envelope.

  We compute the posterior probability:

  P(A | X=2^k) = P(X=2^k | A) * P(A) / P(X=2^k)

  Similarly, 
  P(B | X=2^k) = P(X=2^k | B) * P(B) / P(X=2^k)

  We have P(A)=P(B)=1/2.

  Now, P(X=2^k | A) = P(S=2^k) = (1-r) r^k.

  For P(X=2^k | B): Note that if event B occurs, then the chosen envelope is the larger one, so we have 2S=2^k, so S=2^{k-1}. Therefore, P(X=2^k | B) = P(S=2^{k-1}) = (1-r) r^{k-1} for k>=1. But for k=0, there is no such S (since k-1=-1 is not allowed). Therefore, P(X=2^0 | B) = 0.

  Now, the marginal probability P(X=2^k) = P(X=2^k | A) * P(A) + P(X=2^k | B) * P(B).

  So for k=0:
  P(X=1) = P(X=1|A)*P(A) + P(X=1|B)*P(B) = [ (1-r) r^0 ] * (1/2) + 0 * (1/2) = (1-r) * (1/2)

  For k>=1:
  P(X=2^k) = P(X=2^k|A)*P(A) + P(X=2^k|B)*P(B) 
            = [ (1-r) r^k ] * (1/2) + [ (1-r) r^{k-1} ] * (1/2)
            = (1-r)/2 * [ r^k + r^{k-1} ]

  Now, the posterior for A given X=2^k:

  For k=0:
  P(A | X=1) = [ P(X=1|A) * P(A) ] / P(X=1) = [ (1-r) * (1/2) ] / [ (1-r)/2 ] = 1.

  For k>=1:
  P(A | X=2^k) = [ P(X=2^k|A) * P(A) ] / P(X=2^k) 
               = [ (1-r) r^k * (1/2) ] / [ (1-r)/2 * (r^k + r^{k-1}) ]
               = [ r^k ] / [ r^k + r^{k-1} ] 
               = r^k / ( r^k + r^{k-1} ) 
               = r^k / ( r^{k-1} (r+1) ) 
               = r / (r+1)

  Similarly, 
  P(B | X=2^k) = [ P(X=2^k|B)*P(B) ] / P(X=2^k) 
               = [ (1-r) r^{k-1} * (1/2) ] / [ (1-r)/2 * (r^k + r^{k-1}) ]
               = r^{k-1} / (r^k + r^{k-1}) 
               = 1 / (r+1)

  Therefore, for k>=1, the posterior probability that the envelope is the smaller one is r/(r+1), and that it is the larger one is 1/(r+1).

  Now, the expected gain from switching:

  If we switch, then:
  - If we initially had the smaller envelope (A), then switching gives the larger one: so gain = 2S - S = S = 2^k.
  - If we initially had the larger envelope (B), then switching gives the smaller one: so gain = S - 2S = -S = -2^{k-1} (because in this case, 2S=2^k, so S=2^{k-1}).

  Therefore, the expected gain from switching given X=2^k is:

  E[gain | X=2^k] = P(A|X=2^k) * (gain if A) + P(B|X=2^k) * (gain if B)

  For k=0:
  We have P(A|X=1)=1, so E[gain | X=1] = 1 * (gain if A) + 0 * (gain if B) 
          = 1 * (2^0) = 1.   [because if A: we have S=1, switching gives 2S=2, so gain=1? But note: the gain in money is the additional amount. If we switch from the smaller to the larger, we gain exactly the amount of the smaller? Actually, let's clarify: if we have 1 (the smaller) and switch, we get 2, so gain = 2-1 = 1. Alternatively, if we have 2 (the larger) and switch, we get 1, so gain = 1-2 = -1. But in the k=0 case, we have observed 1 and we are sure it is the smaller. So gain = 1 (since we get 2 instead of 1).]

  But note: the gain is defined as the amount we get by switching minus the amount we have. So if we have the smaller, we get 2S and we have S, so gain = 2S - S = S. If we have the larger, we get S and we have 2S, so gain = S - 2S = -S.

  So for k=0:
  E[gain | X=1] = P(A|X=1) * S + P(B|X=1) * (-S) 
                 = 1 * 2^0 + 0 * ... = 1.

  For k>=1:
  E[gain | X=2^k] = P(A|X=2^k) * (2^k) + P(B|X=2^k) * (-2^{k-1})
                   = [r/(r+1)] * 2^k + [1/(r+1)] * (-2^{k-1})
                   = (2^k * r - 2^{k-1} * 1) / (r+1)
                   = (2^k r - 2^{k-1}) / (r+1)
                   = 2^{k-1} (2r - 1) / (r+1)

  Therefore, the expected gain is:

  For k=0: 1
  For k>=1: 2^{k-1} * (2r-1)/(r+1)

  Now, for k>=1, the sign of the gain is determined by (2r-1). Since the factor 2^{k-1} is positive and (r+1) is positive, we have:
  - If 2r-1 > 0, i.e., r > 1/2, then the gain is positive: switching is favorable.
  - If r < 1/2, then the gain is negative: switching is unfavorable.
  - If r=1/2, then the gain is zero.

  Thus, the sign of the gain for k>=1 is fixed by r alone.

  Part (b) [5 marks]
  Explain why the case k=0 behaves differently, and why that does not by itself vindicate the naive fifty-fifty reasoning.

  Solution for (b):
  The case k=0 behaves differently because when we observe X=1 (which is 2^0), we are certain that we have the smaller envelope. This is because the prior distribution of S does not put any mass on 2^{-1} (which would be 0.5). Therefore, the only way to observe 1 is if we have the smaller envelope. Hence, the posterior probability that we have the smaller envelope is 1.

  The naive fifty-fifty reasoning would say that regardless of the observed amount, the two possibilities (that we have the smaller or the larger) are equally likely. But in this case, after observing 1, we are not in a fifty-fifty situation: we are sure we have the smaller one. Therefore, the naive reasoning fails. However, the fact that k=0 is an exception (and we know we should switch) does not vindicate the naive reasoning for the other cases. The naive reasoning would say that for every observed amount, you have a 50% chance of having the smaller one. But we have seen that for k>=1, the posterior probability that we have the smaller one is r/(r+1), which is not 1/2 unless r=1 (which is not allowed). Therefore, the naive reasoning fails for k>=1 as well. Moreover, the naive reasoning would also fail for k=0: it would say that even when you see 1, you have a 50% chance of having the smaller one, but we have shown that the chance is 100%. Therefore, the exception at k=0 actually contradicts the naive reasoning, and the rest of the cases also do not support it.

  Part (c) [8 marks]
  Prove that E[S] is finite exactly when r < 1/2, and say what the coincidence of that boundary with the boundary from (a) shows about the two standard diagnoses. Which diagnosis is doing the real work, and is there anything the first can explain that the second cannot?

  Solution for (c):
  The expected value of S is:
  E[S] = sum_{k=0}^∞ [2^k * P(S=2^k)] = sum_{k=0}^∞ [2^k * (1-r) r^k] = (1-r) * sum_{k=0}^∞ (2r)^k.

  This is a geometric series. It converges if and only if |2r| < 1, i.e., r < 1/2. When r < 1/2, we have:
  E[S] = (1-r) * [1 / (1-2r)].

  If r >= 1/2, the series diverges to infinity.

  In part (a), we found that switching is favorable (for k>=1) when r>1/2, and unfavorable when r<1/2. The boundary r=1/2 is the same as the boundary for the finiteness of E[S].

  The two standard diagnoses for the two-envelope paradox are:
  1. The fallacy lies in holding the two hypotheses (that the chosen envelope is the smaller or the larger) equiprobable whatever the observation.
  2. The fallacy lies in using priors with infinite or undefined expectation.

