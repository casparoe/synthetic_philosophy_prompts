  = (1-r)/2 * (r+1) * [ (2r-1)/(r+1) ] * sum_{k=1}^∞ r^{k-1} * 2^{k-1} 
  = (1-r)/2 * (2r-1) * sum_{k=1}^∞ (2r)^{k-1}
  = (1-r)/2 * (2r-1) * sum_{m=0}^∞ (2r)^m   [let m=k-1]

  But note: the series sum_{m=0}^∞ (2r)^m converges only if 2r<1, i.e., r<1/2. If r>1/2, this series diverges. Therefore, the entire expression for E[T' - T] diverges to infinity? Actually, the factor (2r-1) is positive when r>1/2, so the series diverges to +∞. But wait, this would suggest that the ex ante expected gain is +∞. However, we argued by symmetry that it should be zero. This is a contradiction.

  What gives way? The issue is that the law of total expectation requires that either the overall expectation is finite or that we have absolute convergence. But here, the series is not absolutely convergent when r>1/2. In fact, we can see that the terms for large k are positive and growing without bound. But note: the symmetry argument is still valid. The resolution is that the expectation does not exist (it is infinite) and we cannot apply the law of total expectation in the usual way because the series does not converge. Alternatively, we might say that the legitimacy of comparing infinite expectations is the problem: we cannot meaningfully say that the expected gain is positive when it is actually undefined.

  But note: the symmetry argument does hold: the joint distribution of (T, T') is symmetric. Therefore, the distribution of T'-T is symmetric about 0, so the expectation, if it exists, must be 0. However, when r>1/2, the expectation of |T'-T| is infinite, so we cannot define E[T'-T] in the usual way. Therefore, the law of total expectation is not violated because it requires the existence of the unconditional expectation. But we are trying to compute the unconditional expectation by conditioning and we get a divergent series. This shows that the unconditional expectation does not exist (it diverges). Therefore, we do not have a contradiction: the conditional expectations are positive, but the unconditional expectation is undefined.

  Now, regarding decision theory: a decision theory that recommends always switching is not necessarily refuted by the symmetry argument because the symmetry argument only says that the ex ante expectation is undefined. But note: the decision theory that conditions on the observation and then maximizes expected utility (as we did) will recommend switching for every possible observation. This leads to a dominating strategy: always switch. However, the ex ante expected utility of this strategy is undefined (infinite). Therefore, we cannot say that the strategy leads to a sure gain ex ante. But it is consistent: for every possible outcome, the conditional expected gain is positive. However, because of the infinite expectation, we cannot accumulate these to a finite ex ante gain.

  In sum, what gives way is the legitimacy of comparing infinite expectations: we cannot meaningfully compute the ex ante expected gain because it is undefined. The law of total expectation does not apply because the unconditional expectation does not exist. Countable additivity is not challenged because we are using it to compute the probabilities and expectations.

  Therefore, a decision theory that recommends always switching is not refuted by the symmetry argument because the symmetry argument does not yield a defined ex ante expected gain. However, it does lead to a strategy that, for every possible observation, yields a positive conditional expected gain. But the overall expectation is undefined. This is a peculiar situation. Some decision theories might reject the use of conditional expectations when the unconditional expectation is infinite, but others (like the one we used) might still condition on the observation. Therefore, the decision theory that conditions on the observation would recommend switching, and that is consistent with the conditional expectations.

  However, note that if we use a different decision theory that requires the overall expectation to be defined, then we would not be able to recommend switching. But in this case, the conditional expectations are well-defined and positive. Therefore, the decision theory that conditions on the evidence is not refuted by the symmetry argument because the symmetry argument does not produce a defined ex ante expected gain that contradicts the conditional analysis.

  But note: if we run the experiment many times and average, the average gain might not converge to any finite value. So the decision to switch every time might not lead to a well-defined average gain in the long run. Therefore, some might argue that the decision theory that recommends always switching is flawed because it does not account for the undefined ex ante expectation. However, for each individual trial, given the observation, the expected gain is positive. So it is a matter of debate.

  In conclusion, the breakdown occurs because the unconditional expectation of the gain is undefined (infinite), so the law of total expectation does not apply. The strategy of always switching is not refuted by the symmetry argument because the symmetry argument relies on the expectation being defined, which it is not.

