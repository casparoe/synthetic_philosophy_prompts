  Note: T and T' are identically distributed. But when r>1/2, E[T] = E[T'] = ∞.

  Now, the ex ante expected gain from switching is E[T' - T]. Since the two envelopes are symmetric, the distribution of (T, T') is the same as (T', T). Therefore, the distribution of T'-T is symmetric about 0. Hence, if E[T'-T] exists, it must be zero. However, when the expectations are infinite, the expectation of T'-T may not be defined. In fact, we can compute:

  E[T] = E[ T | we pick the smaller] * P(we pick the smaller) + E[ T | we pick the larger] * P(we pick the larger)
       = (1/2) * E[S] + (1/2) * E[2S] 
       = (1/2) * E[S] + (1/2) * 2 * E[S] 
       = (1/2) * E[S] + E[S] 
       = (3/2) * E[S]

  But when r>1/2, E[S] is infinite, so E[T] is infinite. Similarly, E[T'] is infinite.

  However, the gain from switching is T' - T. We can try to compute E[T' - T] by conditioning on the observed amount. But note that the law of total expectation requires that the conditional expectations are well-defined and that the overall expectation is defined. We can write:

  E[T' - T] = E[ E[T' - T | T] ]

  But we have computed E[T' - T | T = 2^k] for every k. For k=0, it is 1 (positive). For k>=1, it is 2^{k-1}*(2r-1)/(r+1) which is positive when r>1/2. Therefore, the conditional expectation is always positive. But then the overall expectation would be the average of positive numbers. However, the problem is that the unconditional expectation E[T' - T] does not exist (or is not finite) because the series that would define it diverges. Specifically, we have:

  E[T' - T] = sum_{k=0}^∞ P(T=2^k) * E[T' - T | T=2^k]

  We know P(T=2^k) for each k. For k=0: P(T=1) = P(X=1) = (1-r)/2. For k>=1: P(T=2^k) = (1-r)/2 * (r^k + r^{k-1}) = (1-r)/2 * r^{k-1} (r+1).

  Then E[T' - T] = [ (1-r)/2 ] * 1   +   sum_{k=1}^∞ [ (1-r)/2 * r^{k-1} (r+1) ] * [ 2^{k-1} * (2r-1)/(r+1) ]

