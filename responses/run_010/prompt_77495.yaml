  The first diagnosis (that we must not assume the two hypotheses are equally likely after seeing the amount) is also important because we have shown that the posterior probabilities are not 1/2. However, the coincidence of the boundary with the finiteness of the mean shows that the second diagnosis (about the prior having infinite expectation) is doing the real work in explaining why we get the paradoxical result (always switching is favorable) when r>1/2. Without the infinite mean, the paradox would not arise because we would not have the situation where switching is favorable for every possible observation.

  But note: the first diagnosis (non-equiprobability) is necessary to compute the posterior and the expected gain. However, the second diagnosis (infinite mean) is the one that explains the qualitative shift: that we get a positive expected gain for every k>=1 when r>1/2. Moreover, the first diagnosis is always in effect: for any r, the posterior is not 1/2 (unless r=1, which is impossible). But the sign of the gain changes at r=1/2, and that coincides with the expectation becoming infinite.

