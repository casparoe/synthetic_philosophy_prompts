  Solution for (d):
  Before opening the envelope, the two envelopes are symmetric: the player has no reason to prefer one over the other. Therefore, the ex ante expected gain from switching should be zero. However, after opening the envelope and observing any amount, the player always has a positive expected gain from switching. This seems to suggest that the player can decide to switch regardless of what they see and gain, which would imply an ex ante expected gain from switching of ...? But if we try to compute the ex ante expected gain from switching, we run into trouble because the expectation of the amount in the envelope is infinite.

