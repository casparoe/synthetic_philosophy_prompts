answer: |-
  ### Two-Envelope Paradox Problem-Set Question

  **Setup:**  
  In the two-envelope paradox, the smaller amount \(S\) is drawn from the geometric family \(P_r(S = 2^k) = (1 - r) r^k\) for \(k = 0, 1, 2, \ldots\), with \(0 < r < 1\). The player selects an envelope at random, opens it, and observes \(X = 2^k\). Answer all parts concisely, showing your work.

  **(a)** Derive the posterior probability that the player holds the smaller envelope, and the expected gain from switching (i.e., the expected difference between the amount in the other envelope and \(X\)), as functions of \(r\) and \(k\). Show that for \(k \geq 1\), the sign of the expected gain depends only on \(r\).  
  *(7 marks)*

  **(b)** Explain why the case \(k = 0\) behaves differently from cases with \(k \geq 1\), and why this difference does not vindicate the naive "fifty-fifty" reasoning (which assumes the two hypotheses—holding the smaller or larger envelope—are equally likely regardless of \(X\)).  
  *(5 marks)*

  **(c)** Prove that \(E[S]\) is finite if and only if \(r < 1/2\). Discuss what the coincidence of this boundary with the boundary from part (a) reveals about two standard diagnoses of the paradox:  
  - (i) The fallacy lies in assuming the two hypotheses are equiprobable after observing \(X\).  
  - (ii) The fallacy lies in using priors with infinite or undefined expectation.  
  Which diagnosis is doing the real work in resolving the paradox? Can (i) explain something that (ii) cannot?  
  *(8 marks)*

  **(d)** For \(r > 1/2\), switching is favorable (expected gain > 0) after every possible observation \(X\). However, before opening any envelope, the two envelopes are symmetric, so the choice is ex ante indifferent. Precisely what breaks down—countable additivity, the law of total expectation, or the legitimacy of comparing infinite expectations? Is a decision theory that recommends always switching thereby refuted? Justify your answer.  
  *(5 marks)*

  ---

  ### Model Answer  
  *(Approx. 900 words; algebra fully shown)*

  **(a)** Let \(A\) be the event that the player holds the smaller envelope (so \(X = S\)), and \(B\) the event they hold the larger envelope (so \(X = 2S\)). The prior probabilities are \(P(A) = P(B) = 1/2\). The prior distribution of \(S\) is \(P(S = 2^k) = (1 - r) r^k\).  

  The observed amount is \(X = 2^k\). The likelihoods are:  
  - If \(A\) (smaller envelope), \(X = S = 2^k\), so \(P(X = 2^k \mid A) = (1 - r) r^k\).  
  - If \(B\) (larger envelope), \(X = 2S = 2^k\), so \(S = 2^{k-1}\). Thus, \(P(X = 2^k \mid B) = P(S = 2^{k-1}) = (1 - r) r^{k-1}\) for \(k \geq 1\), but for \(k = 0\), \(S = 2^{-1} = 0.5\) is impossible, so \(P(X = 1 \mid B) = 0\).  

  The marginal probability \(P(X = 2^k)\) is:  
  - For \(k = 0\):  
  \[
  P(X = 1) = P(X = 1 \mid A)P(A) + P(X = 1 \mid B)P(B) = [(1 - r) \cdot 1] \cdot \frac{1}{2} + 0 \cdot \frac{1}{2} = \frac{1 - r}{2}.
  \]  
  - For \(k \geq 1\):  
  \[
  P(X = 2^k) = P(X = 2^k \mid A)P(A) + P(X = 2^k \mid B)P(B) = \left[(1 - r) r^k\right] \frac{1}{2} + \left[(1 - r) r^{k-1}\right] \frac{1}{2} = \frac{1 - r}{2} (r^k + r^{k-1}).
  \]  

  The posterior probability \(P(A \mid X = 2^k)\) is:  
  - For \(k = 0\):  
  \[
  P(A \mid X = 1) = \frac{P(X = 1 \mid A)P(A)}{P(X = 1)} = \frac{(1 - r) \cdot \frac{1}{2}}{\frac{1 - r}{2}} = 1.
  \]  
  - For \(k \geq 1\):  
  \[
  P(A \mid X = 2^k) = \frac{P(X = 2^k \mid A)P(A)}{P(X = 2^k)} = \frac{[(1 - r) r^k] \frac{1}{2}}{\frac{1 - r}{2} (r^k + r^{k-1})} = \frac{r^k}{r^k + r^{k-1}} = \frac{r}{r + 1}.
  \]  
  Thus, \(P(B \mid X = 2^k) = 1 - P(A \mid X = 2^k) = \frac{1}{r + 1}\) for \(k \geq 1\).  

  The gain from switching is:  
  - If \(A\), switching yields \(2S - S = S = 2^k\).  
  - If \(B\), switching yields \(S - 2S = -S = -2^{k-1}\) (since \(S = 2^{k-1}\)).  

  The expected gain given \(X = 2^k\) is:  
  - For \(k = 0\):  
  \[
  E[\text{gain} \mid X = 1] = P(A \mid X = 1) \cdot 2^0 + P(B \mid X = 1) \cdot (-S) = 1 \cdot 1 + 0 \cdot (-S) = 1.
  \]  
  - For \(k \geq 1\):  
  \[
  E[\text{gain} \mid X = 2^k] = P(A \mid X = 2^k) \cdot 2^k + P(B \mid X = 2^k) \cdot (-2^{k-1}) = \left(\frac{r}{r + 1}\right) 2^k + \left(\frac{1}{r + 1}\right) (-2^{k-1}) = \frac{2^k r - 2^{k-1}}{r + 1} = 2^{k-1} \frac{2r - 1}{r + 1}.
  \]  
  For \(k \geq 1\), \(2^{k-1} > 0\) and \(r + 1 > 0\), so the sign of \(E[\text{gain} \mid X = 2^k]\) is the sign of \(2r - 1\). Thus, it depends only on \(r\): positive if \(r > 1/2\), negative if \(r < 1/2\), and zero if \(r = 1/2\).

  **(b)** The case \(k = 0\) behaves differently because \(X = 1\) (\(2^0\)) can only occur if the player holds the smaller envelope (\(P(A \mid X = 1) = 1\)), as \(S = 0.5\) (required for \(B\)) is impossible. For \(k \geq 1\), \(P(A \mid X = 2^k) = r/(r + 1) \neq 1/2\) unless \(r = 1\) (excluded). This difference does not vindicate the naive fifty-fifty reasoning because:  
  - At \(k = 0\), the naive reasoning (assuming \(P(A \mid X) = 1/2\)) is incorrect (true posterior is 1, not 1/2).  
  - For \(k \geq 1\), the posterior is generally not \(1/2\) (e.g., if \(r = 2/3\), \(P(A \mid X) = 0.4\)), so the naive reasoning fails here too. Thus, the \(k = 0\) case refutes, rather than supports, the naive view.

  **(c)** The expectation of \(S\) is:  
  \[
  E[S] = \sum_{k=0}^{\infty} 2^k P(S = 2^k) = \sum_{k=0}^{\infty} 2^k (1 - r) r^k = (1 - r) \sum_{k=0}^{\infty} (2r)^k.
  \]  
  This geometric series converges iff \(|2r| < 1\), i.e., \(r < 1/2\), yielding \(E[S] = (1 - r)/(1 - 2r)\). For \(r \geq 1/2\), \(E[S] = \infty\).  

  The boundary \(r = 1/2\) coincides with the boundary in (a): for \(r > 1/2\), \(E[\text{gain} \mid X = 2^k] > 0\) for all \(k \geq 1\), and for \(r < 1/2\), it is negative. This shows:  
  - Diagnosis (i) (non-equiprobability) explains why the naive reasoning fails (posterior \(\neq 1/2\) for all \(r\)), but does not account for the switch in gain sign at \(r = 1/2\).  
  - Diagnosis (ii) (infinite expectation) explains the paradox: when \(r > 1/2\), \(E[S] = \infty\), and switching is always favorable after observation, creating a "paradoxical" dominance.  

  Diagnosis (ii) does the real work in resolving the paradox because it addresses why always switching appears beneficial for \(r > 1/2\). Diagnosis (i) can explain the flaw in the fifty-fifty assumption for all \(r\), but it cannot explain the qualitative shift at \(r = 1/2\) (e.g., why switching becomes uniformly favorable only when \(r > 1/2\)).

  **(d)** The ex ante expected gain from switching is \(E[Y]\), where \(Y = \text{gain}\). By symmetry, \(E[Y]\) should be 0 if defined. However, for \(r > 1/2\), \(E[Y \mid X = 2^k] > 0\) for all \(k\), yet:  
  \[
  E[Y] = \sum_{k=0}^{\infty} P(X = 2^k) E[Y \mid X = 2^k] = \underbrace{\frac{1 - r}{2} \cdot 1}_{k=0} + \sum_{k=1}^{\infty} \left[ \frac{(1 - r)(r + 1)}{2} r^{k-1} \right] \left[ 2^{k-1} \frac{2r - 1}{r + 1} \right].
  \]  
  Simplifying, the series for \(k \geq 1\) becomes \(\frac{(1 - r)(2r - 1)}{2} \sum_{k=1}^{\infty} (2r)^{k-1}\), which diverges for \(r > 1/2\) (as \(2r > 1\)). Thus, \(E[Y]\) is undefined (diverges to \(+\infty\)).  

  What breaks down is the **legitimacy of comparing infinite expectations** (or equivalently, the law of total expectation, which assumes \(E[Y]\) is defined and finite). The symmetry argument requires \(E[Y]\) to exist, but it does not.  

  A decision theory that recommends always switching (based on conditional expectations) is **not refuted** by the symmetry argument. For each observation, conditional expected gain is positive, so switching is locally rational. The ex ante indifference relies on \(E[Y] = 0\), which is inapplicable here as \(E[Y]\) is undefined. Thus, the theory remains consistent within its conditioning approach, though it cannot guarantee finite long-run gains.

