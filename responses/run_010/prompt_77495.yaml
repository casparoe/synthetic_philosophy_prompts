  Question:

  Consider the two-envelope paradox with the following setup: the smaller amount S in the envelopes is drawn from the geometric distribution on the set {2^k : k=0,1,2,...} with P_r(S = 2^k) = (1-r) r^k for k = 0,1,2,... and 0 < r < 1. The player chooses an envelope at random, opens it, and observes the amount X = 2^k.

  (a) [7 marks] Derive the posterior probability that the player holds the smaller envelope, and the expected gain from switching (i.e., the expected difference between the amount in the other envelope and the observed amount), as functions of r and k. Show that for k ≥ 1, the sign of the expected gain is determined solely by r.

  (b) [5 marks] Explain why the case k = 0 behaves differently from the cases k ≥ 1, and why this difference does not vindicate the naive reasoning that the two hypotheses (holding the smaller or larger envelope) are always equally likely after seeing X.

  (c) [8 marks] Prove that E[S] is finite if and only if r < 1/2. Explain the significance of this boundary coinciding with the boundary for the sign of the expected gain in part (a) with respect to two standard diagnoses of the two-envelope paradox: (i) that the fallacy lies in assuming the two hypotheses are equally likely regardless of the observation, and (ii) that it lies in using a prior with infinite or undefined expectation. Which diagnosis is doing the real work in resolving the paradox? Can the first diagnosis explain something that the second cannot?

  (d) [5 marks] For r > 1/2, switching is favorable after every possible observation (i.e., the expected gain is positive for every k). However, before opening any envelope, the two envelopes are symmetric and the choice is ex ante indifferent. Precisely which principle breaks down: countable additivity, the law of total expectation, or the legitimacy of comparing infinite expectations? Is a decision theory that recommends always switching after every observation thereby refuted? Justify your answer.

  Model Answer:

  (a) Let A be the event that the player holds the smaller envelope, and B the event that they hold the larger one. Prior: P(A)=P(B)=1/2. The prior for S: P(S=2^k) = (1-r)r^k.

  The observed amount is X=2^k. The likelihoods are:
  - If A, then X=S=2^k: P(X=2^k|A) = (1-r)r^k.
  - If B, then X=2S=2^k, so S=2^{k-1}: P(X=2^k|B) = P(S=2^{k-1}) = (1-r)r^{k-1} for k≥1, and for k=0, P(X=1|B)=0.

  The marginal probability of X=2^k:
  For k=0: P(X=1) = P(X=1|A)P(A) + P(X=1|B)P(B) = [(1-r)r^0 * 1/2] + [0 * 1/2] = (1-r)/2.
  For k≥1: P(X=2^k) = [ (1-r)r^k * 1/2 ] + [ (1-r)r^{k-1} * 1/2 ] = (1-r)/2 * (r^k + r^{k-1}).

  Posterior for A given X=2^k:
  For k=0: P(A|X=1) = [ (1-r) * 1/2 ] / [ (1-r)/2 ] = 1.
  For k≥1: P(A|X=2^k) = [ (1-r)r^k * 1/2 ] / [ (1-r)/2 * (r^k + r^{k-1}) ] = r^k / (r^k + r^{k-1}) = r/(r+1).

  Similarly, P(B|X=2^k) = 1/(r+1) for k≥1.

  Expected gain from switching:
  - If A, gain = 2S - S = S = 2^k.
  - If B, gain = S - 2S = -S = -2^{k-1} (since S=2^{k-1}).

  Thus, for k=0: E[gain|X=1] = 1 * 2^0 + 0 * ... = 1.
  For k≥1: E[gain|X=2^k] = [r/(r+1)] * 2^k + [1/(r+1)] * (-2^{k-1}) 
                           = (2^k r - 2^{k-1}) / (r+1) 
                           = 2^{k-1} (2r - 1) / (r+1).

  For k≥1, the sign of the gain is the sign of (2r-1), which depends only on r.

  (b) The case k=0 behaves differently because the observation X=1 can only occur if the player holds the smaller envelope (since the prior puts no mass on S=1/2). Hence, the posterior probability of A is 1, and the expected gain is positive. This contradicts the naive fifty-fifty reasoning, which would assign P(A|X)=1/2 regardless of X. However, for k≥1, the posterior is r/(r+1) ≠ 1/2 (unless r=1, which is excluded), so the naive reasoning also fails for k≥1. Moreover, at k=0 the naive reasoning would assign 1/2, but we have shown it is 1. Therefore, the difference at k=0 does not vindicate the naive reasoning; it actually further refutes it.

  (c) E[S] = sum_{k=0}^∞ 2^k * (1-r)r^k = (1-r) sum_{k=0}^∞ (2r)^k. This geometric series converges if |2r|<1, i.e., r<1/2, and then E[S] = (1-r)/(1-2r). If r≥1/2, the series diverges and E[S]=∞.

  The boundary r=1/2 coincides with the boundary for the sign of the expected gain in (a): for r>1/2, the expected gain for k≥1 is positive, and for r<1/2, negative. 

  Diagnosis (i) notes that the posterior probabilities are not 1/2, which is true for every r (except at r=1) and explains the flaw in the naive calculation. Diagnosis (ii) notes that when the prior has infinite expectation, the reasoning breaks down. The coincidence of the boundary shows that diagnosis (ii) is doing the real work in explaining why we get the paradoxical result (switching is always favorable) for r>1/2. Without infinite expectation, the paradox would not arise because switching would not be favorable for every observation. However, diagnosis (i) explains why the naive calculation is wrong even for r<1/2 (when the expectation is finite), but in that case, there is no paradox of always switching being favorable. Therefore, diagnosis (ii) is necessary to explain the qualitative shift at r=1/2.

  (d) For r>1/2, the ex ante expected gain from switching, E[T'-T], is undefined (infinite). The law of total expectation requires the unconditional expectation to be defined for the identity E[E[Y|X]] = E[Y] to hold. Here, we have E[gain | X=2^k] >0 for every k, but the unconditional expectation diverges. The symmetry of the envelopes implies that the distribution of T'-T is symmetric about 0, so if the expectation existed, it would be 0. But it does not exist. Therefore, what gives way is the legitimacy of comparing infinite expectations: the unconditional expectation is undefined, so we cannot apply the law of total expectation.

  A decision theory that conditions on the observation and recommends switching because the conditional expected gain is positive is not refuted by the symmetry argument. The symmetry argument does not produce a defined ex ante expected gain that contradicts the conditional analysis. However, the ex ante expected gain being undefined means that we cannot guarantee a finite gain overall. But for each possible observation, the conditional expected gain is positive, so the decision theory that uses conditional expectations would still recommend switching. This is consistent, and not refuted, but it does highlight the challenge of infinite expectations.

