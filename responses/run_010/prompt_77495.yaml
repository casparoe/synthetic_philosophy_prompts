  We are given the setup: the smaller amount S in the two-envelope problem is drawn from the geometric distribution 
  P_r(S = 2^k) = (1-r) r^k for k = 0,1,2,... with 0 < r < 1. 
  The player picks an envelope at random, opens it, and observes X = 2^k.

  Part (a) [7 marks]
