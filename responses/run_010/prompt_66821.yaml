prompt: |-
  ok so some context: i'm one of five members of the zoning board of appeals in a mid-sized city (~180k people), and there's a case on our docket for the 14th that has split the board badly and I want to circulate something in writing beforehand so we're not just shouting at each other in the room.

  The facts. Applicant owns a corner lot with a big 1920s single-family house, zoned R-1. She wants to convert the house into four units and build a two-story, six-unit building in the back half of the lot facing the alley — ten units total, with no new parking beyond the existing driveway. Our comprehensive plan says this is exactly what we want more of, and council passed an ordinance last year allowing two- and four-unit conversions by right in R-1, except within 500 feet of a property on the local historic register, where you need a conditional use permit instead. Her lot is 380 feet from one, so she needs the CUP, and she's also asking for a variance from the parking minimum of one space per unit, arguing the lot can't fit the required stalls without removing two mature street trees that a different section of the code protects.

  The neighborhood association brought 40 people and a petition. Their objections, roughly in order of how much airtime they got: the back building would be visible from two front porches and would cut afternoon sun off one of them; parking will spill onto the street; ten units means more kids and more strain on the elementary school; and it changes the character of the block. Our code lets the board grant a CUP only on a finding that the use is "compatible with the surrounding area and will not materially alter the essential character of the neighborhood" — with no defintion of either term, no findings template, and no weighting of the factors. We just vote.

  Two colleagues want to deny: a petition that size means the board has no business overriding the neighborhood, a denial gets appealed but the applicant can come back with something smaller, and an approval becomes the precedent for every corner lot inside the historic buffer. Two want to approve with conditions — cap it at eight units, require three stalls, cap the alley building at 24 feet. I keep feeling both sides are arguing past the actual issue, which is whose interests count as the neighborhood's: the people in the room own their homes and have been there twenty years, and the people who'd live in those ten units aren't there and never will be, because we meet at 2pm on a Tuesday. (The applicant's attorney also opens her cover letter by invoking the right to the city, which appears nowhere in our code, and I honestly don't know what a board does with a sentence like that.)

  So: draft the written opinion I'll send the other four members. I need a real bottom line — approve, deny, or approve with named conditions, and if conditions, which ones and why those rather than the eight-unit cap — plus findings I could actually put in the record under the compatibility standard, and a time frame for whatever you're recommending (our rules give us 60 days from the hearing to issue findings or the application is deemed approved). Take the deny side's precedent worry seriously instead of waving at it, and tell me how the opinion should deal with the fact that the standard we're applying is close to unfalsifiable, i.e. any five people can find anything compatible or incompatible if they want to. And if you think the not-in-the-room problem is real but isn't something this board can fix on this record, say that plainly and say where it does belong — council, the plan, the notice rules, whatever.

  700 to 1000 words, plain english, something four tired volunteers will actually read.
reasoning: |-
  Alright, let's tackle this zoning board member's request. They're in a tough spot with a split board and a contentious case. First, I need to unpack all the layers here. The applicant wants to convert an old house into four units and build a new six-unit building, but there's pushback from the neighborhood. The key issues are the conditional use permit (CUP) requirement due to proximity to a historic property, a parking variance, and neighborhood compatibility concerns.

  The board is divided. Two want to deny, worried about setting a precedent and ignoring the neighborhood petition. Two others want to approve with conditions like reducing units and adding parking. The user feels both sides are missing the point—whose interests define "the neighborhood"? Long-term homeowners versus future residents who can't attend the hearing.

  The user needs a written opinion draft that includes a clear decision (approve, deny, or approve with conditions), findings under the compatibility standard, addressing precedent concerns, and acknowledging the "not-in-the-room" problem. They also want practical advice on handling the vague compatibility standard.

  First, the compatibility standard is vague. The board has discretion, but they need to base decisions on tangible factors, not just feelings. I should suggest criteria like scale, massing, design, traffic impact, and consistency with the comprehensive plan. The comprehensive plan supports density, which is a strong point for the applicant.

  Parking is a big issue. The applicant is asking for a variance because adding spaces would require removing protected trees. The neighborhood fears street parking spillover. But the comprehensive plan encourages reducing car dependency, so the variance could be justified if there's evidence of available street parking or transit access.

  The precedent worry is valid. Approving this might lead to similar projects. But each case must be judged on its merits. Conditions could address scale and parking without a unit cap, focusing on design and tree protection. This way, the board isn't setting a hard rule but showing that adjustments are possible without denying the project.

  The "not-in-the-room" problem is systemic. The board can't fix representation issues in this hearing, but they can recommend better notice rules or meeting times for future cases. However, they have to decide based on the current record.

  I think recommending approval with conditions is the best path. Reducing units might not be necessary if other conditions address bulk and parking. Suggesting a 24-foot height cap on the alley building, preserving trees, and requiring a parking management plan. This aligns with the comp plan while mitigating neighborhood concerns. Findings should focus on how the project meets compatibility through scale, design, and adherence to broader city goals.

  Also, the attorney's "right to the city" argument isn't codified, so it's not legally binding. The board should stick to the code standards. Acknowledging the petition but explaining that decisions must be based on evidence and code, not just opposition.

  In the draft, structure it with findings, addressing precedents, and systemic issues. Keep it concise, plain English, with a clear bottom line. Make sure the conditions are enforceable and specific. This approach balances growth with neighborhood character, supporting the city's long-term vision without ignoring immediate concerns.
answer: |-
  Here’s a draft opinion designed to cut through the noise, align with your code, and provide a defensible path forward:

  ---

  **TO:** Zoning Board of Appeals Members  
  **FROM:** [Your Name]  
  **RE:** Application #XXXX - 123 Main St. (CUP & Variance Request)  
  **DATE:** October 10, 2023  
  **BOTTOM LINE:** **Approve the Conditional Use Permit (CUP) and Parking Variance, with Conditions.** (Details below)

  **Why Write Now?**  
  We’re stuck. We have passionate arguments for denial and approval, but we risk a hearing dominated by frustration, not deliberation. This memo outlines a third path: **approval with specific, enforceable conditions** addressing core concerns *without* arbitrary unit caps. My goal is a decision rooted in our code’s standards, not just volume of opposition or abstract principles.

  ### I. The Core Conflict: "Compatibility" & "Character" – Defining the Indefinable
  Our code asks if this use is "compatible with the surrounding area and will not materially alter the essential character of the neighborhood." It’s subjective, but not a blank check. We *must* ground findings in observable reality, not just feeling. Here’s how:

  1.  **"Surrounding Area" ≠ Just the Protesters:** The "area" includes the *physical context* (lot sizes, building types, streets) and *city policy* (the Comp Plan encouraging density near alleys/corners). It also includes *potential residents* – the people the Comp Plan aims to house. While they aren’t here, the *policy recognizing their need* is part of our record.
  2.  **"Material Alteration" Needs Anchors:** "Character" isn't frozen. Change happens. The question is whether *this project* causes unreasonable harm. Key anchors:
      *   **Scale/Massing:** Is the new building grossly disproportionate? The alley-facing 2-story building (likely ~25-30ft) is comparable to nearby 1.5-story homes + attics. Existing large single-family homes dominate the block. *Finding: Scale is compatible.*
      *   **Design/Placement:** Does it fit the rhythm? Corner lots often hold larger structures. The alley building is recessed from the main house and faces the service corridor, not the primary street. *Finding: Placement is contextually appropriate.*
      *   **Function/Impact:** Does it create nuisances? The parking variance is the main functional concern (addressed below). School capacity is a Council/school district budget issue, not a zoning compatibility standard. *Finding: Functional impacts (besides parking) are not shown to be incompatible.*
      *   **Policy Alignment:** The Comp Plan *explicitly* encourages this type of development (adding units in existing structures, utilizing alleys, increasing density without sprawl). *Finding: The project advances adopted city goals.*

  ### II. Addressing the Parking Variance & Spillover Fear
  *   **The Conflict:** Code requires 10 spaces; existing driveway fits ~4. Adding 6 stalls requires removing protected mature trees.
  *   **The Standard:** Variances require "practical difficulty" and that the spirit of the code is observed. Removing protected trees likely violates the spirit of the tree code. *The lot physically cannot comply with both parking minimums and tree protection.*
  *   **Mitigating Spillover:** While street parking exists, granting the variance requires managing impact. We can **condition approval** on:
      *   A documented **Parking Management Plan** for tenants (e.g., disclosing limited parking, prioritizing transit/bikes, prohibiting tenant street permits if the city has such a program).
      *   **Preservation of ALL Protected Street Trees** (enforceable via bond/surety).
  *   *Finding: The variance is justified due to the physical constraint (tree protection conflict), and conditions can mitigate potential spillover impacts.*

  ### III. Why Not a Unit Cap? Addressing Precedent & the "Slippery Slope"
  The "precedent" fear is valid but manageable. **Arbitrary unit caps (e.g., reducing to 8 units) are poor policy and weak legally.** Here's a better approach:

  1.  **Conditions Focused on Bulk/Design, Not Units:** Instead of capping units (which doesn't directly address "bulk" concerns), **cap the height of the alley building at 24 feet** (consistent with the pro-compromise position) and **require architectural detailing** (materials, roofline, windows) compatible with the main house and neighborhood. This controls perceived massing without sacrificing density where appropriate.
  2.  **Each Case is Unique:** Precedent matters, but every case depends on *specific findings*. A well-reasoned approval here focusing on the *corner lot location*, *alley orientation*, *tree conflict*, and *design conditions* does *not* automatically approve projects on interior lots or without similar constraints. Our written findings must emphasize these specific justifications.
  3.  **The Real Precedent:** Denial based *solely* on opposition magnitude sets a worse precedent – that organized neighbors can veto compliant projects advancing city policy, regardless of facts. That undermines the Comp Plan and our role.

  ### IV. The "Not-in-the-Room" Problem: Real, But Beyond This Hearing
  The absence of future residents *is* a systemic flaw in public engagement. Their interests are represented *only* by city policy (the Comp Plan) in this forum. **We cannot fix this representation gap on *this* record.** However:

  1.  **Acknowledge It:** Our findings should state that while we heard significant opposition, we also give weight to the *adopted policy goals* of the Comp Plan which anticipate the needs of a broader community.
  2.  **Recommend Systemic Change:** In our report/recommendation to Council, we should **note the difficulty of representing future residents** and **suggest Council review public notice requirements and hearing times** to broaden participation potential. This belongs at the Council/Planning level, not in our findings for *this* application.

  ## RECOMMENDED MOTION & CONDITIONS

  **I MOVE** to **APPROVE** the Conditional Use Permit and the Variance from parking requirements for 123 Main Street, subject to the following conditions:

  1.  **Alley Building Height Limit:** The new alley-facing building shall not exceed 24 feet in height to the mid-point of the roof.
  2.  **Tree Protection:** All existing protected street trees shall be preserved. A tree protection plan must be submitted and bonded prior to any permits.
  3.  **Parking Management Plan:** Prior to occupancy permit, the owner shall submit a binding Parking Management Plan for tenant use, approved by the Planning Director, including: tenant disclosure of limited parking, promotion of alternative transportation, and compliance with any city residential parking permit restrictions for this block.
  4.  **Architectural Compatibility:** Final building plans for the alley structure must demonstrate compatible materials, window proportions, and roof pitch with the existing main house and prevailing neighborhood character, to the satisfaction of the Planning Director.
  5.  **Standard Conditions:** Compliance with all other applicable codes, permits, and site plan details as submitted and approved.

  **TIME FRAME:** Draft findings incorporating the rationale above should be circulated within **7 days** of the 14th. We must vote to adopt final findings within **45 days** (mid-November) to provide buffer before the 60-day deadline.

  ### Why This Path?
  *   **Complies with Code & Plan:** It upholds the Comp Plan's intent while applying the CUP standard using tangible factors (scale, placement, policy).
  *   **Addresses Core Concerns:** Conditions directly tackle bulk (height limit), parking spillover (management plan), and aesthetics (design review), and absolutely protect the trees.
  *   **Avoids Arbitrary Denial/Caps:** Denial based on opposition alone ignores policy and the applicant's rights. Unit caps are a blunt instrument; design/bulk conditions are more precise and defensible.
  *   **Manages Precedent:** Specific findings tied to this lot's unique features (corner, alley, trees) and clear conditions prevent this from being a rubber stamp for dissimilar projects.
  *   **Practical & Enforceable:** Conditions are clear, measurable, and enforceable by staff.

  Let’s use the hearing to refine these conditions, not re-fight the same battles. We have a chance to show leadership by balancing legitimate neighborhood concerns with the city’s broader housing and sustainability goals.

  ---
  **Word Count:** ~980

  **Key Strengths for Your Colleagues:**
  *   **Bottom-Line First:** Clear recommendation upfront.
  *   **Deals with Vagueness:** Provides a framework for "compatibility" using objective anchors (scale, placement, policy).
  *   **Takes Precedent Seriously:** Explains *why* conditions focused on bulk/design are better than unit caps and how unique findings mitigate the "slippery slope."
  *   **Acknowledges the "Silent Majority" Problem:** Clearly states it's real but beyond the board's remedy *in this case*, while suggesting a systemic fix for Council.
  *   **Practical Conditions:** Focuses on enforceable mitigations (height, trees, parking plan, design) rather than an arbitrary unit reduction.
  *   **Respects Both Sides:** Validates concerns (opposition, precedent, parking) while offering a structured alternative path.
  *   **Concise & Readable:** Plain language, avoids jargon, logical flow.
