prompt: |-
  So I'm in a little decision-theory reading group this term and last week we did the rank-dependent / risk-weighted expected utility stuff, and it went sideways. My friend Dan (econ PhD, second year, extremely confident) waved it off by saying risk aversion is just concavity of the utility function and that's the whole story — apparently once you've got a concave u you've already captured every attitude-to-risk worth capturing, so any theory that bolts on a separate probability-weighting or risk function is either dressing up the same thing or is confused about what risk is. He said it in a tone that ended the discussion and I didn't have the machinery to push back, but I'm fairly sure he's sliding between several different claims and that at least one of them is doing all the work.

  For context, we were arguing about two concrete choice problems: turning down a 50/50 lose-$100 / gain-$105 coin flip at essentially any level of wealth, and the usual Allais-style pairs where people go for the sure thing. Dan's move was that both dissolve if you stop being sloppy and define utility over final wealth instead of over the payoffs as printed on the page — then concavity handles it and there's nothing exotic left to explain. I vaguely remember there being some calibration result going the other direction, something about modest small-stakes aversion forcing an expected-utility maximizer to reject absurdly generous large bets, but I can't tell whether that's a counterexample to what Dan said or to something weaker. Somebody else at the table then claimed the fancy theories get sunk by dynamic-choice arguments about paying to avoid free information, which I also couldn't evaluate.

  Could you lay out the different precise claims that one sentence could be making, ordered roughly from trivial to radical? For each I want: what it actually says (Jensen-type stuff, the diminishing-marginal-utility explanation, something about representation vs. the underlying preference relation, whatever the real options are), whether it's true/false/true-but-limited, and whether it would in fact license dismissing risk-weighted or rank-dependent theories. I especially want to know where concavity of u and a separate risk function come apart observationally, whether the wealth-vs-prizes point rescues Dan, how the calibration worry bears on the readings, and whether he's smuggling in a conflation with loss aversion or ambiguity aversion. Also just tell me which reading people usually have in mind when they say it, since that's the one I should argue with next Tuesday. A numbered list I can bring to the group is perfect, and don't bother with references or a reading list — I want the conceptual map, not the literature.
reasoning: |-
  Okay, the user is in a decision theory reading group and had a debate about risk aversion. Dan, an econ PhD student, claimed that risk aversion is solely due to concavity of the utility function and dismissed other theories like rank-dependent or risk-weighted utility. The user wants a breakdown of Dan's claim into precise components, evaluated for truth and implications.

  First, I need to unpack Dan's statement. He says risk aversion equals concavity of u, and that's all there is. But what does this actually mean? Let me break it down into different interpretations, from weakest to strongest. 

  The simplest claim is that concavity implies risk aversion. That's just Jensen's inequality, mathematically true. But it doesn't address whether concavity is necessary or sufficient for all risk attitudes. 

  Next level: concavity is necessary and sufficient for global risk aversion. This means if someone is risk-averse in all choices, their utility must be concave. This is also true under EUT. But Dan might be implying more—that concavity explains all risk attitudes without needing probability weighting. 

  Then there's the claim that any risk attitude can be captured by concavity alone. This is false because phenomena like the Allais paradox can't be explained by utility curvature alone; they violate the independence axiom. People choose a sure gain over a gamble with higher expected utility, which suggests probability weighting plays a role. 

  Another angle: the wealth vs. prizes point. Dan argues that defining utility over final wealth resolves anomalies. But Rabin's calibration shows that modest small-stakes risk aversion implies absurd large-stakes risk aversion if utility is concave and defined over wealth. This is a problem for EUT. Rank-dependent models avoid this by allowing probability weighting. 

  Dan might also conflate different aversions. Loss aversion (from prospect theory) involves reference points and is different from probability weighting. Concavity over wealth doesn't address loss aversion. Similarly, ambiguity aversion is about unknown probabilities, not risk. 

  The strongest claim is that all apparent deviations are due to misspecification of the outcome domain. But Rabin's critique shows that even with wealth as the domain, EUT struggles. Rank-dependent models allow probability distortion independent of utility curvature. 

  For the user's context, Dan's argument fails against Allais because the choices violate independence, which concavity doesn't resolve. Also, Rabin's calibration shows that small-stakes risk aversion in EUT forces implausible large-stakes behavior, whereas probability weighting in rank-dependent models can explain both without such implications. 

  The user needs to pinpoint which claim Dan is making. Likely, he's conflating the necessary and sufficient claim with the stronger, false claim that concavity explains everything. Highlighting Allais and Rabin should counter his points. Also, clarifying the difference between risk, loss, and ambiguity aversion is key to show Dan's oversimplification.
answer: |-
  Here's a breakdown of the distinct claims embedded in Dan's "risk aversion is just concavity of u" statement, ordered from least to most radical, with their truth status, implications for dismissing rank-dependent/risk-weighted utility (RDU/RWU), and observational differences:

  ### 1. **Claim: Concavity of u is *Sufficient* for Risk Aversion under EUT.**
     *   **What it says:** In Expected Utility Theory (EUT), if an agent has a concave utility function `u` defined over final wealth (or terminal outcomes), then they will exhibit risk aversion: they prefer a sure thing `x` to any gamble with expected monetary value `x`.
     *   **Truth:** True (by Jensen's Inequality).
     *   **Dismisses RDU/RWU?** No. This is just a basic property of EUT. RDU/RWU models *also* rely on concavity of `u` to capture part of risk aversion.
     *   **Observational Difference:** None. Both EUT and RDU/RWU predict risk aversion when `u` is concave.
     *   **Wealth vs. Prizes:** Defining `u` over final wealth is the standard EUT approach. This claim doesn't depend on that distinction resolving paradoxes.
     *   **Calibration/Rabin:** Irrelevant to this specific claim.
     *   **Commonly Meant?** Rarely the *only* claim, but often a foundational point.

  ### 2. **Claim: Concavity of u is *Necessary and Sufficient* for Global Risk Aversion under EUT.**
     *   **What it says:** An agent who is risk-averse *for all possible gambles* (i.e., globally risk-averse) must have a concave `u`. Conversely, concavity implies global risk aversion. (This relies on EUT holding).
     *   **Truth:** True (under EUT).
     *   **Dismisses RDU/RWU?** No. RDU/RWU models can also represent globally risk-averse preferences using concave `u` combined with a probability weighting function `π(p)` that is typically inverse-S shaped (overweighting small `p`, underweighting medium/large `p`). The *representation* is different, but the *preference pattern* (global risk aversion) is the same. Observational equivalence holds *for global risk aversion*.
     *   **Observational Difference:** None *for global risk aversion*. Both models can generate it.
     *   **Wealth vs. Prizes:** Again, standard EUT approach. Doesn't resolve specific paradoxes.
     *   **Calibration/Rabin:** Still irrelevant to this specific claim about *global* aversion.
     *   **Commonly Meant?** Often implied when stating the "just concavity" line.

  ### 3. **Claim: *All Observable Risk Attitudes* Can Be Captured *Exclusively* by Concavity of u within EUT.**
     *   **What it says:** There is no observable pattern of choices involving risk that requires a model departing from EUT with a concave `u` defined over final wealth. Every "anomaly" (like Allais, small-stakes risk aversion) is due to mis-specifying the outcome domain (e.g., not using final wealth) or a misinterpretation of preferences.
     *   **Truth:** False.
     *   **Why False & Dismisses RDU/RWU?** This is Dan's core, overly strong claim. It fails because:
          *   **Allais Paradox:** Choices like preferring 1A (100% chance of $1M) over 1B (10% chance $5M, 89% $1M, 1% $0) *and* preferring 2B (10% chance $5M, 90% $0) over 2A (11% chance $1M, 89% $0) violate EUT's Independence Axiom. Concavity of `u` over final wealth *cannot* explain this reversal. Probability weighting (overweighting the 1% chance of $0 in 1B, underweighting the extra 1% chance of $1M in 2A compared to 2B) provides a natural explanation within RDU/RWU. **Observational Difference:** Allais choices are consistent with RDU/RWU but inconsistent with EUT+concave `u`.
          *   **Calibration/Rabin Critique:** Rabin showed that an EUT agent with a concave `u` defined over final wealth who rejects a small, favorable gamble (e.g., 50/50 -$100/+$110) at a moderate wealth level *must* reject wildly favorable large gambles (e.g., 50/50 -$1000/+$1,000,000). This is empirically implausible. RDU/RWU avoids this by attributing small-stakes aversion primarily to *probability weighting* (e.g., overweighting the small probability of loss) rather than extreme concavity of `u`. **Observational Difference:** Moderate small-stakes aversion combined with reasonable large-stakes risk-taking is consistent with RDU/RWU but often inconsistent with EUT+concave `u`.
     *   **Wealth vs. Prizes:** Dan claims this rescues EUT. It *does* resolve the St. Petersburg paradox, but **it fails for Allais and Rabin**:
          *   **Allais:** Defining `u` over final wealth doesn't change the *relative* probabilities or the violation of independence in the Allais choices. The paradox remains.
          *   **Rabin:** The critique explicitly assumes `u` is defined over final wealth! Concave `u` over wealth is the *source* of the calibration problem.
     *   **Smuggling Loss/Ambiguity?** Likely. Dan might be implicitly attributing Allais to loss aversion (a Prospect Theory concept involving a kink at a reference point, not concavity) or Rabin-style small-stakes aversion to ambiguity aversion (aversion to unknown probabilities). But his explicit claim ("just concavity") rules out these distinct mechanisms.
     *   **Commonly Meant?** Yes, this is the radical version often intended (or heard) when dismissing alternatives.

  ### 4. **Claim: *Any* Representation Featuring a Separate "Risk Attitude" Parameter Beyond u is Redundant or Meaningless.**
     *   **What it says:** Concepts like probability weighting or a separate risk function don't capture anything real about preferences that isn't already fully captured by the curvature of `u`. They are just mathematical reparameterizations or confusions.
     *   **Truth:** False.
     *   **Why False & Dismisses RDU/RWU?** While RDU/RWU can *sometimes* mimic EUT with a different `u` for specific choices, they are *observationally distinct* models overall. They represent preferences that systematically violate EUT axioms (like Independence or betweenness). Probability weighting directly captures how people distort *probabilities themselves*, distinct from how they value outcomes. The Allais and Rabin paradoxes provide clear empirical evidence for the *conceptual and empirical* separability of probability distortion (`π(p)`) from outcome valuation (`u(x)`).
     *   **Observational Difference:** See Allais & Rabin above. Also, preferences exhibiting the "common ratio effect" or "certainty effect" directly implicate probability weighting distinct from utility curvature.
     *   **Wealth vs. Prizes:** Irrelevant. The separability is a property of the preference relation, not the outcome domain.
     *   **Commonly Meant?** Sometimes implied in strong dismissals, especially by those focused solely on revealed preference without psychological plausibility.

  ### 5. **Claim: Risk Aversion Defined by Concavity of u is the *Only Normatively Valid* Concept of Risk Aversion.**
     *   **What it says:** Deviations from EUT (like Allais choices) are "mistakes" or "biases". The "correct" way to think about risk, especially for welfare economics or prescriptive advice, is exclusively through EUT with concave `u`.
     *   **Truth:** Debatable / Normative Stance.
     *   **Dismisses RDU/RWU?** Yes, but on normative grounds, not positive/descriptive grounds. Dan is shifting the goalposts from "what explains behavior" to "what *should* explain behavior".
     *   **Observational Difference:** N/A (Normative claim).
     *   **Wealth vs. Prizes:** Normative arguments often favor final wealth for consistency.
     *   **Dynamic Choice / Free Info:** This is where the normative argument often lands. Critics argue that non-EUT models (like RDU/RWU) can lead to dynamic inconsistencies or make agents vulnerable to "Dutch books" (e.g., paying to avoid free information that could only help them). Proponents argue these are features of realistic psychology, not bugs, or that sophisticated variants exist. This is a complex normative debate *separate* from the positive question of whether EUT descriptively fails.
     *   **Commonly Meant?** Often lurking in the background of confident dismissals.

  ### Which Reading to Argue With Next Tuesday (and How)

  *   **Target Claim #3:** This is the core, empirically falsifiable claim Dan likely intended ("just concavity explains everything, wealth rescues it"). It's demonstrably false.
  *   **Your Counterarguments:**
      1.  **Allais Paradox:** "Dan, using final wealth doesn't make the Allais choices consistent with EUT. The Independence Axiom *is* violated. Concavity of `u` alone *cannot* explain why someone chooses 1A over 1B *and* 2B over 2A. Probability weighting in rank-dependent models provides a straightforward explanation for this specific pattern without needing loss aversion or ambiguity."
      2.  **Rabin Calibration:** "Dan, the Rabin critique *assumes* `u` is defined over final wealth! If concavity explains rejecting the small 50/50 -$100/+$105 bet at moderate wealth, it forces absurd rejections of huge favorable bets. People don't actually do that. This suggests moderate small-stakes risk aversion isn't primarily about `u`'s concavity over wealth, but about something else – like how they weight the small probability of a loss."
      3.  **Separability:** "Concavity of `u` explains aversion to mean-preserving spreads. But phenomena like Allais and the common ratio effect show people also react strongly to the *certainty* of an outcome or the *ratio* of probabilities in ways that concavity alone can't capture. That's what probability weighting directly models."

  *   **Addressing His Wealth/Prizes Point:** Explicitly state: "I agree defining `u` over final wealth is correct *for EUT*. But that doesn't resolve Allais (violates independence axiomically) or Rabin (the critique relies on wealth-based `u`)."
  *   **Addressing Dynamic Choice:** "The dynamic choice arguments are about normative consistency, not descriptive accuracy. People demonstrably make Allais-like choices. We need models that describe that, even if it causes normative headaches. Sophisticated versions of RDU try to handle dynamics."
  *   **Key Distinction:** Emphasize the difference between **utility curvature** (diminishing marginal utility of wealth) and **probability weighting** (distortion of likelihoods) as two distinct psychological channels for risk attitudes. Concavity of `u` captures the former, RDU/RWU incorporates both. Allais and Rabin show the latter channel is necessary descriptively.

  Bring this numbered list. Focus the debate on Claims 3 and 4. Good luck!
