  We are given nine commitments and two further questions. The task is to audit the commitments for mutual consistency, rank tensions by severity, suggest revisions, and address the two additional questions.

  First, let's list the commitments again for clarity:

  1. Mechanism identity is fixed by causal role (same difference to outputs across all contexts). Implementation is not necessary or sufficient.

  2. Accepts multiple realizability (same function by different components).

  3. Detectors are signature-based (single forward pass, no interventions, no context probing) for cost reasons.

  4. Mechanisms are objective, mind-independent.

  5. Reference condition fixed by model's own statistics on training/fine-tuning distribution. No external normative input.

  6. Care about shifts in "what the model is trying to do" (intentional shifts) vs. shifts in capability (new skills). The latter are false positives.

  7. Detector construction is unsupervised (no labels). Labels only in evaluation.

  8. Distrust verbal reports but treat internal activations as ground truth.

  9. Two experimental verdicts: 
