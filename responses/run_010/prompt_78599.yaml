  But the circularity might be in the definition: we define mechanisms by the activations (via the feature dictionary) and then use the activations to detect changes. But (1) defines mechanisms by causal role, not by activations. So we are using the activations as a proxy for the causal role. The problem is that (3) and (9) show that the proxy might not be perfect.

