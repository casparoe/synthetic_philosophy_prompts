  - **Critical Tension (1 vs 3)**: Revise (1) to acknowledge that in practice, we use feature signatures as a proxy for causal role. This allows (3) and (9) to be consistent, but we lose the strict causal role criterion for identity. We must note that the proxy is imperfect and might have errors as illustrated in (9). This revision also indirectly helps with (8) because we are not claiming that the activations are the mechanism, but a representation of it.

