answer: |-
  Your oncologist friend has described a sophisticated evolutionary strategy that exposes fascinating tensions in the units of selection debate. Let's reconstruct the implicit theory, dissect its presuppositions, and explore plasticity implications.

  ### Core Evolutionary Presuppositions
  1. **Fitness Duality (Both Concepts Necessary)**  
     The strategy *requires* both fitness concepts to be coherent:  
     - **Intrinsic fitness cost**: Resistance mechanisms (e.g., efflux pumps, altered targets) reduce cellular replication/survival *in the absence of drugs*, measurable *in vitro*.  
     - **Frequency-dependent fitness**: Resistant cells only outcompete sensitives *when drugs are present*. In drug-free environments, sensitives win.  
     Neither is decorative: The intrinsic cost enables suppression when drugs are withdrawn, while frequency-dependence makes suppression evolutionarily stable. This is **negative frequency-dependent selection** applied therapeutically.

  2. **Unit of Selection: Implicit Multi-Level Selection (MLS1)**  
     - **Primary unit**: **Cancer cells** are the replicators/interactors. Heritable variation (genetic/epigenetic) in drug response exists *among cells*.  
     - **Group-like effects**: The tumour is treated as a *population-structured environment* where cell-cell competition occurs. The "group" (tumour) isn't selected *as a unit*; instead, *cell fitness* depends on local frequency and drug context. This fits **MLS1** (selection on particles within collectives), not MLS2 (collectives as units).  
     - **Key presupposition**: Competition between cell lineages is strong enough to suppress resistance when drugs are absent. The tumour must function as a *Darwinian population* with heritable variation and competition.

  ### Heritability & Plasticity: Critical Complications
  The practice assumes **heritable resistance** (clonal expansion). But if resistance is primarily **non-genetic plasticity** (e.g., drug-tolerant persister states):
  - **What changes in practice**:  
    - Adaptive dosing *may still work* if plasticity carries a fitness cost (e.g., metabolic hibernation reduces proliferation).  
    - **Crucially**: If plasticity is *reversible*, withdrawing drugs could *re-sensitize* persisters faster than competition suppresses them. Dosing intervals would need shortening to exploit reversibility.  
    - Monitoring would shift from genomic (resistance mutations) to phenotypic markers (e.g., metabolic states).  

  - **What changes in clinical narrative**:  
    - "Selecting for resistance" → "Inducing/prolonging tolerant states."  
    - Emphasis shifts from *eliminating resistant clones* to *preventing fixed adaptations* by denying persistent selective pressure.  
    - "Competitive suppression" might rely more on **reversion to sensitivity** than outcompetition by sensitives.

  ### Underdetermination & Consistent Rival Accounts
  The strategy is **philosophically underdetermined**: Identical clinical outcomes could be explained by:
  1. **Gene-centric view**: "Selfish" resistance alleles have frequency-dependent fitness costs. No "group" needed.  
  2. **Individual selection**: Cells as units; competition is local.  
  3. **Niche construction**: Sensitive cells modify the environment (drug-free zones) to favor their own phenotype.  
  4. **Ecosystem perspective**: Tumour as a habitat with competitive exclusion dynamics.  

  **What it strictly presupposes**:  
  - Heritable variation in drug response among cancer cells.  
  - Fitness trade-offs (resistance costs viability in no-drug conditions).  
  - Competition between cell lineages can alter clonal dynamics.  

  **What it does NOT require**:  
  - Group selection *sensu stricto* (tumour survival as a unit).  
  - Irreversible genetic resistance (plasticity-compatible if costs exist).  
  - Species-like individuality of tumours (no reproduction/specialization needed).

  ### Where Plasticity Changes the Game
  If plasticity dominates:  
  | **Genetic Resistance Model** | **Plasticity-Dominant Model** |  
  |------------------------------|--------------------------------|  
  | Fixed heritable mutations | Reversible phenotypic states |  
  | Slow suppression via clonal competition | Faster suppression via reversion |  
  | "Eradicating clones" as goal | "Preventing adaptation" as goal |  
  | Long dosing intervals possible | Shorter pulses may be optimal |  
  | Resistance = evolutionary endpoint | Resistance = transient, inducible state |  

  ### Conclusion
  The strategy **presupposes multi-level selection dynamics (MLS1) with cancer cells as units**, leveraging **frequency-dependent fitness arising from intrinsic costs**. It is **coherent but underdetermined**: compatible with gene-centric, individual, or ecological frameworks. Plasticity doesn't invalidate it but **shifts the mechanism from clonal competition to phenotypic reversibility**, demanding different monitoring and timing. Clinically, it reflects a pragmatic embrace of evolutionary thinking—agnostic about philosophical disputes but reliant on the core tenet that *fitness depends on context and competition*.

  *This is why oncology is philosophy in action: You're not just poisoning cells; you're hacking evolving ecosystems.* Would you like to explore how this connects to Hull's replicator/interactor framework or Godfrey-Smith's Darwinian populations?
