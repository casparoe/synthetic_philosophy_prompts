  ### Information Cascade Setup

  We model a hiring committee with four members (P1, P2, P3, P4) reviewing a candidate sequentially. Each member receives the same dossier and a private signal from a vague reference letter. The private signals are independently drawn and equally reliable, with four possible types:  
  - **S+ (Strong For)**: Strong evidence for the candidate (likelihood ratio LR = 3 for "Good").  
  - **W+ (Weak For)**: Weak evidence for the candidate (LR = 2).  
  - **W- (Weak Against)**: Weak evidence against the candidate (LR = 0.5).  
  - **S- (Strong Against)**: Strong evidence against the candidate (LR = 1/3).  

  **Conditional probabilities**:  
  - If candidate is **Good**: P(S+) = 0.3, P(W+) = 0.4, P(W-) = 0.2, P(S-) = 0.1.  
  - If candidate is **Bad**: P(S+) = 0.1, P(W+) = 0.2, P(W-) = 0.4, P(S-) = 0.3.  

  **Decision rule**: Each member advances if posterior odds of "Good" exceed 1 (i.e., P(Good | information) > 0.5), else passes. Prior odds = 1 (P(Good) = P(Bad) = 0.5). Actions are public, and members are Bayesian rational with common knowledge of rationality and decision rules.  

  ---

  ### Cascade Walkthrough: First Three Advances

  1. **P1's decision**:  
     - Only private signal \(s_1\). Advances if LR(\(s_1\)) > 1:  
       - S+ (LR=3) or W+ (LR=2) → **advance**.  
       - W- (LR=0.5) or S- (LR=1/3) → pass.  
     - In this scenario, P1 advances → \(s_1\) is S+ or W+.

  2. **P2's decision**:  
     - Observes P1 advanced and has private signal \(s_2\).  
     - Likelihood of P1 advancing:  
       - P(advance | Good) = P(S+ or W+ | Good) = 0.3 + 0.4 = 0.7.  
       - P(advance | Bad) = 0.1 + 0.2 = 0.3.  
       - LR for P1's advance = 0.7 / 0.3 = 7/3 ≈ 2.333.  
     - Posterior odds = (7/3) × LR(\(s_2\)).  
     - Advances if (7/3) × LR(\(s_2\)) > 1:  
       - S+: (7/3)×3 = 7 > 1 → advance.  
       - W+: (7/3)×2 ≈ 4.67 > 1 → advance.  
       - W-: (7/3)×0.5 ≈ 1.167 > 1 → advance.  
       - S-: (7/3)×(1/3) ≈ 0.778 < 1 → pass.  
     - P2 advances → \(s_2\) is not S- (i.e., S+, W+, or W-).

  3. **P3's decision**:  
     - Observes P1 and P2 advanced and has \(s_3\).  
     - Likelihood of P1 and P2 advancing:  
       - P(both advance | Good) = P(P1 advance | Good) × P(P2 advance | P1 advance, Good) = 0.7 × [1 - P(S- | Good)] = 0.7 × 0.9 = 0.63.  
       - P(both advance | Bad) = 0.3 × [1 - P(S- | Bad)] = 0.3 × 0.7 = 0.21.  
       - LR for both advances = 0.63 / 0.21 = 3.  
     - Posterior odds = 3 × LR(\(s_3\)).  
     - Advances if 3 × LR(\(s_3\)) > 1:  
       - S+: 3×3 = 9 > 1 → advance.  
       - W+: 3×2 = 6 > 1 → advance.  
       - W-: 3×0.5 = 1.5 > 1 → advance.  
       - S-: 3×(1/3) = 1 → indifferent; assume advance (tie-break).  
     - **P3 advances regardless of \(s_3\)** → cascade begins.  

  ---

  ### Observer Announcement and P4's Decision

  **Setup**: First three advance. Observer (trusted, accurate) announces: "The last two (P2 and P3) were copying P1 and contributed no information."  

  **Effect of announcement**:  
  - Destroys the **informational value of P2 and P3's actions**. Before, P2's advance implied \(s_2\) ≠ S- (adding information). P3's action was uninformative (cascade).  
  - After announcement, P4 knows P2 and P3's actions were **uninformative** (driven solely by P1's action, not their signals).  
  - Leaves standing: **P1's advance** and **P4's private signal** \(s_4\).  

  **P4's inference**:  
  - Only P1's action is informative. LR for P1 advancing = 0.7 / 0.3 = 7/3 ≈ 2.333 (as in P2's update).  
  - Posterior odds = (7/3) × LR(\(s_4\)).  
  - P4 has **W- (Weak Against)**: LR(\(s_4\)) = 0.5.  
  - Posterior odds = (7/3) × 0.5 ≈ (2.333) × 0.5 = 1.1665 > 1.  
  - **P4 advances** despite moderately against signal.  

  **Why it works**: The first action (P1) was sufficiently strong (LR=7/3) to outweigh P4's negative signal (LR=0.5) even after discarding P2 and P3's actions.  

  ---

  ### Key Structural Feature

  - **Strength of the first mover's signal**.  
    - P1's action carries high LR (2.333) because the signals are designed such that advancing (S+ or W+) is much more likely under "Good" than "Bad".  
    - This strength persists even when later actions are invalidated.  

  **If removed**:  
  - If P1's signal is weakened (e.g., P(advance | Good) = 0.55, P(advance | Bad) = 0.45, LR≈1.222):  
    - Posterior odds for P4 = 1.222 × 0.5 ≈ 0.611 < 1 → P4 **passes**.  
  - Cascade collapses for moderately against signals when the first action is weak.  

  ---

  ### Conformity Bias vs. Bayesian View

  - **Conformity bias advocate**:  
    - Would argue P4 advances due to social pressure to follow the group, not rational updating.  
    - Ignores that P4's decision is driven **only by P1's action** (not P2/P3) and survives even when group influence is exposed.  

  **Settling the debate**:  
  - **Experiment**: Vary the strength of P1's signal while keeping later actions fixed.  
    - **Bayesian prediction**: P4 advances with W- only if P1's LR > 2 (since 2 × 0.5 = 1, the threshold).  
    - **Conformity prediction**: P4 advances regardless of P1's strength (driven by group size/peer pressure).  
  - **Outcome**: If P4 passes when P1's signal is weak (e.g., LR≈1.222) but advances when strong (LR=2.333), Bayesian view is validated. Conformity bias cannot explain this sensitivity to first-mover strength.  

  ---

  ### Summary  
  The cascade survives because P1's strong signal alone outweighs P4's moderately negative signal. The observer's callout destroys later actions' information but leaves P1's intact. The lynchpin is the **first mover's signal strength**, not group conformity. Remove it, and the cascade fails. Empirical tests varying first-mover strength can distinguish Bayesian rationality from blind conformity.
