            In a conformity bias model, even with a weak first action, the announcement might not break the cascade because the bias is to follow the group. So we might see P4 advance anyway.

            Therefore, an experiment that manipulates the strength of the first signal and observes whether P4 (after the announcement) still advances when her signal is moderately against, for both strong and weak first signals, would distinguish.

            Bayesian model prediction:

              - Strong first signal (like in the original): P4 advances even with W-.
              - Weak first signal (like above): P4 passes with W-.

            Conformity bias model:

              - Regardless of the strength of the first signal, P4 might advance because of the pressure to conform with the group.

            We would need to run the experiment with human subjects and see.

     Conclusion:

          We built the cascade with four committee members and a signal structure that includes four types of signals. The first three advance. The outside observer announces that the last two were copying and contributed no information. This announcement removes the information that would have been provided by the second and third actions, leaving only the first action. Because the first action was sufficiently informative (with LR=7/3) and the fourth person's private signal (W-) was only moderately against, she still advances. The key structural feature is the strength of the first action. If we weaken the first action sufficiently, the fourth person would pass.

          The model is Bayesian and the survival of the cascade (in this case) is due to the strength of the first mover's information, not irrational conformity.

     Let's recap the four inferences:

          P1: sees s1. Advances if s1 is S+ or W+ (because LR>1). In this cascade, we assume she advances -> so she had either S+ or W+.

          P2: sees a1=advance and her own signal s2. 
              Updates: O(Good) = (7/3) * LR(s2)
              Advances unless s2 is S-. In the cascade, she advances -> so she did not have S-.

