answer: |-
  Here's your tier list of resolutions by deliberative friction, scored 0–10 (lowest to highest friction), with justifications and follow-ups addressed rigorously. I've strictly adhered to your rubric—no hedging, no clustering at 5–6.

  ### Tier List: Deliberative Friction (Lower = Better)
  1. **Chronology Protection (vi)**  
     **Score: 0**  
     Justification: Tim knows *no such attempt can occur*. His deliberation is untouched because the scenario is physically impossible—like deliberating on jumping to the moon unaided. No internal conflict arises.  

  2. **Many-Worlds Branching (v)**  
     **Score: 1**  
     Justification: Tim kills a *different* Grandfather in another branch. His ordinary reasoning holds: pulling the trigger *will* kill the man before him. No paradox, no self-undermining.  

  3. **Lewis's Compossibility (i)**  
     **Score: 2**  
     Justification: Tim knows he "can" kill Grandfather locally (no physical barrier) but "could not have" globally (incompossible with history). Deliberation feels normal—he tries, fails, and the failure is *external* (e.g., gun jams). His agential perspective remains intact.  

  4. **Vihvelin's Ability Dissent (ii)**  
     **Score: 4**  
     Justification: Tim lacks the ability *simpliciter*—no nearby world where he succeeds. This injects doubt: his "trying" feels futile in a way Lewis avoids. But he can still reason about evidence (e.g., "guns usually fire"), keeping friction moderate.  

  5. **Consistency/Coincidence (iv)**  
     **Score: 6**  
     Justification: Tim knows physics *will* generate wildly improbable obstacles (gun jams, etc.). This parasitizes his reasoning: he must treat "I will likely fail" as a *brute fact*, undermining evidence-based confidence (e.g., "why aim if it never works?").  

  6. **Quiet Fatalism (vii)**  
     **Score: 8**  
     Justification: No backward causation → Tim’s attempt *never happens*. He must accept his deliberation is an illusion. Paralysis risk is high: forming an intention feels impossible if the act is causally disconnected from the future.  

  7. **Sider’s Autoinfanticide (iii as resolution)**  
     **Score: 9**  
     Justification: Killing infant-Tim *erases his present existence mid-attempt*. Deliberation collapses: "If I succeed, I cease to exist *now*—but if I cease, how did I pull the trigger?" Systematic unreliability, with no internal way to resolve the contradiction.  

  ---

  ### Follow-Up 1: Non-Ancestral Target (Stranger)  
  **Does the ordering change?** Partially.  
  - **Sider (iii)** drops drastically to **2**: Killing a stranger doesn’t erase Tim. Friction resembles Lewis: Tim "can" kill locally but "could not have" globally.  
  - **Consistency (iv)** drops to **4**: Improbable obstacles remain, but Tim’s reasoning isn’t parasitized by "this *always* fails for ancestors."  
  - **Others unchanged**.  
  **New Tier**: vi (0), v (1), i (2), iii (2), ii (4), iv (4), vii (8).  
  **Verdict**: Your instinct was correct—(iii) and (iv) swap places, and it’s an insight. Sider’s friction is *ancestor-specific*; consistency’s is general but less crippling for strangers.  

  ---

  ### Follow-Up 2: Is Low Friction a Virtue?  
  **The Worry**: Low friction might reward *reticence* (views that say little about physics), leaving ordinary reasoning untouched by default.  
  **My Defense**:  
  - Low friction isn’t just reticence—it’s **preservation of agential self-trust**. High-friction resolutions force Tim to adopt a *detached perspective* (e.g., "I’m a pawn of coincidence" or "my will is illusory"), corroding practical rationality. This *is* a cost worth tracking: it measures how much the resolution demands we *discard* our native understanding of agency.  
  - **But**: It shouldn’t be the *only* virtue. A good resolution must also *explain why Tim fails*. I propose a dual-axis evaluation:  
    1. **Deliberative Friction** (as you defined).  
    2. **Explanatory Burden Discharged** (0–10): How well the resolution explains *why* Tim fails.  

  **Rescored on Explanatory Burden** (Higher = Better):  
  - vi: **10** (Complete: physics forbids CTCs).  
  - v: **8** (Robust: branching explains survival).  
  - iv: **7** (Empirical: improbability suffices).  
  - ii: **5** (Adequate: no ability, but no *why*).  
  - i: **4** (Partial: compossibility is descriptive, not explanatory).  
  - vii: **3** (Deficient: denies backward causation but doesn’t explain failure dynamics).  
  - iii: **2** (Poor: reframes but doesn’t resolve paradox).  

  **Verdict**: Your rubric tracks something crucial (agency preservation), but pair it with explanatory power to avoid rewarding evasion.  

  ---

  ### Seminar Recommendation  
  **Build the session around Vihvelin (ii)**. Here’s why:  
  - It’s **mid-friction (4)**, making it a perfect pivot: students see how it "fixes" Lewis (by dissolving the two-ability ambiguity) but introduces new problems (threatening ability ascriptions).  
  - Sparks debate on **core metaphysics**: What *is* an ability? Is friction inherent to time travel or a sign of flawed resolution?  
  - Sets up your "common axis" goal: Contrast it with Lewis (lower friction) and Sider (higher friction) to show how friction maps onto diverging assumptions about powers and possibility.  
  - **Pedagogically efficient**: Grapples with the paradox head-on without exotic machinery (e.g., branching worlds) that might distract.  

  **Time allocation**:  
  - 15 min: Lewis vs. Vihvelin (friction 2 vs. 4).  
  - 15 min: Apply both to autoinfanticide (Sider) and non-ancestral cases (show friction shifts).  
  - 10 min: Debate whether friction is a virtue (using consistency/coincidence as a test case).  
  - 10 min: Synthesis—does a "best" resolution exist, or is friction inevitable?  

  This centers *agency*—the heart of the grandfather paradox—while honoring your demand for rigorous comparison.
