answer: |-
  Your decision patterns reveal a sophisticated, psychologically-grounded heuristic that blends **threshold-based loss aversion** with **context-dependent mental accounting** and **regret minimization**. Below is a formalized decision procedure capturing your choices, followed by test cases and unresolved tensions.

  ---

  ### **Core Decision Rule (Threshold-Loss Regret Aversion)**
  1. **Identify "Unlivable" Outcomes**: For the current stake level and context, define outcomes that are catastrophic (e.g., losing $1M of personal savings).  
     → *Triggered by: Gambles 1, 3, 5, 7.*  
  2. **Eliminate Options with Catastrophic Exposure**: Reject any choice with >0 probability of an unlivable outcome, *unless all options have such exposure*.  
     → *Explains Gambles 1 (reject risky ticket: 1% chance of $0 = catastrophe) vs. 3 (accept: 0.00001 chance of $0 not catastrophic).*  
  3. **If All Options Have Catastrophic Risk**: Maximize expected value (EV) after applying a **probability weighting function** that overweights extreme losses.  
     → *Explains Gamble 2 (no catastrophe in either option → take 10% shot at $5M) and Gamble 5 (losses: minimize maximum loss first).*  
  4. **Adjust for Context**:  
     - **Stake Size**: Catastrophe threshold scales non-linearly (trivial stakes → no catastrophe → maximize EV).  
       → *Explains Gamble 4 ($1 stakes: no flip, maximize EV).*  
     - **Mental Account**: Separate thresholds for personal vs. fiduciary funds (foundation money: $0 not catastrophic).  
       → *Explains Gamble 7 (reversal for foundation money).*  
  5. **Minimize Anticipated Regret**:  
     - Prefer certainty to avoid self-blame if loss occurs.  
     - Avoid information that could induce regret (e.g., post-decision payoff knowledge).  
       → *Explains Gamble 8 (pay to avoid knowing; blame avoidance).*  

  ---

  ### **Where Your Heuristic Fails Your Own Cases**
  - **Gamble 6 (Coin Flip)**: Your rejection (-$100 vs. +$110) violates EV maximization *and* has no catastrophe (loss is livable). *Unresolved by core rule.*  
  - **Gamble 9 (Delay Preference)**: Time inconsistency isn't modeled. *Unresolved.*  
  - **Brother's Loan Dilemma**: Your refusal even with 95% chance of no loss suggests extreme loss aversion, but the rule doesn't quantify "how unlivable" $30k is.  

  ---

  ### **Refined Rule with Additions**
  ```python
  def decide(options: List[Gamble], context: Context) -> Choice:
      # Step 1: Define catastrophe threshold (C)
      C = {
          'personal_funds': 0.01 * total_wealth,  # E.g., $1M if wealth = $100M
          'foundation_funds': 0,                  # No catastrophe for others' money
          'trivial_stakes': float('inf')           # No catastrophe for small bets
      }[context.account_type]
      
      # Step 2: Eliminate options with catastrophic outcomes
      viable_options = [opt for opt in options if max(loss in opt.outcomes) < C]
      if not viable_options:
          # All options risky: minimize worst-case loss (your loss-aversion)
          return min(options, key=lambda opt: max(opt.losses))
      elif len(viable_options) == 1:
          return viable_options[0]
      
      # Step 3: If multiple safe options, apply regret-adjusted EV
      regret_factor = 1.5 if context.self_blame_risk else 1.0  # Penalize self-blamed losses
      def score(opt):
          ev = calculate_ev(opt)
          if opt.is_certain and context.regret_sensitive:
              ev += certainty_bonus          # e.g., +5% EV for certainty
          if context.post_info_aversion and opt.is_risky:
              ev -= info_avoidance_penalty   # e.g., -2% EV to avoid regret-triggering knowledge
          return ev * regret_factor
      
      return max(viable_options, key=score)
  ```

  ---

  ### **Test Cases to Distinguish Your Rule from Alternatives**
  1. **Near-Certain Catastrophe**  
     - Option A: 99.9% chance to lose $500k (your entire savings), 0.1% chance $0.  
     - Option B: 100% chance to lose $499k.  
     *Standard EV:* Prefer B (lose less).  
     *Your rule:* Catastrophe threshold (e.g., $400k) breached → all options catastrophic → pick B (minimize loss).  

  2. **Delayed Regret Test**  
     - Option A: $10,000 now with 1% chance of being a scam (lose all).  
     - Option B: Same offer in 1 month.  
     *Your rule:* Pays a premium for delay (avoids immediate regret possibility), even if EV identical.  

  3. **Stakes-Dependent Flip Point**  
     - At what personal wealth level do you accept Gamble 1?  
     - Test: $1M certain vs. 10% $5M / 89% $1M / 1% $0.  
     *Your rule:* Flips when $1M < 0.01 * wealth (e.g., wealth > $100M).  

  ---

  ### **Handling Your Brother's Loan Dilemma**
  - **Your Gut Reaction**: Consistent with catastrophizing $30k loss (even at 5%).  
  - **Rule's Prediction**:  
    - If $30k > catastrophe threshold (e.g., >1% of wealth), reject *regardless of upside*.  
    - Only accept if:  
      (a) $30k < threshold (e.g., you have >$3M), OR  
      (b) Upside is *also* catastrophe-relief (e.g., brother avoids bankruptcy).  
  - **Why Not Crazy?** Your threshold heuristic ignores probabilities below 100% safety *if loss exceeds C*. This avoids "Russian roulette with many barrels" logic.  

  ---

  ### **Unresolved Tensions in Your Cases**
  - **Gamble 6 (Coin Flip)**: Contradicts your threshold rule. To resolve, add: *"Reject positive-EV gambles where loss magnitude > 2x gain, irrespective of stakes."*  
  - **Gamble 9 (Delay)**: Requires separate time-discounting model: *"Discount immediate decisions by anticipated regret load."*  
  - **Blame Sensitivity**: Needs a calibration (e.g., "self-blame penalty = 20% of loss magnitude").  

  ---

  ### **Standard Names for Your Components**
  - **Threshold Heuristic**: **Safety-First Principle** (Roy, 1952)  
  - **Stakes-Dependent Risk**: **Mental Accounting** (Thaler, 1985)  
  - **Certainty Preference**: **Allais Paradox / Certainty Effect** (Kahneman & Tversky)  
  - **Regret Avoidance**: **Regret Theory** (Loomes & Sugden, 1982)  
  - **Losses > Gains**: **Loss Aversion** (Prospect Theory)  

  Your heuristic isn't strictly rational but is descriptively accurate *for you*. To avoid money pumps: never let others set the stakes or context, and fix your threshold (C) in advance. For your brother's loan: if $30k is truly catastrophic, your "no" is coherent. If not, recalculate C.
