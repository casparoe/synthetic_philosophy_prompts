answer: |-
  Below is a diagnostic decision tree designed to sort respondents based on their beliefs about the norm of assertion, focusing on **what standard governs assertion** (truth, knowledge, justified belief, etc.) and **whether it governs the act of asserting (act-level) or only the speaker's blameworthiness (agent-level)**. The tree uses 10 case-based branch questions to navigate the logical space, avoiding labels and ensuring the two axes remain distinct. Three questions (Q4, Q8, and the blame question in Q10) specifically isolate agent-level evaluations. Positions appear at the leaves, with unoccupied combinations flagged.

  ---

  ### **Decision Tree: Norms of Assertion**

  **Instructions:** For each scenario, answer whether the assertion was **proper at the act-level** (i.e., satisfied the fundamental norm of assertion) and/or whether the speaker was **blameworthy**. Answer based on your intuitive judgment.

  ---

  #### **Q1: Low-Stakes Bank**  
  *Scenario:* Alice casually tells Bob, "The bank is open tomorrow," based on seeing it open 3 Saturdays ago. Stakes are low (no urgency). *The bank is open tomorrow.*  
  → **Was Alice’s assertion proper (act-level)?**  
  - **Yes** → Go to Q2.  
  - **No** → Go to Q2.  

  #### **Q2: High-Stakes Bank**  
  *Scenario:* Same as Q1, but Bob needs to deposit a check to avoid foreclosure. Alice knows the stakes. She asserts, "The bank is open tomorrow," with the same evidence. *The bank is open tomorrow.*  
  → **Was Alice’s assertion proper (act-level)?**  
  - **Yes** → Go to Q3.  
  - **No** → If Q1 was **Yes**, → **Leaf: Contextualism** (assertion standard shifts with stakes).  
  - **No** → If Q1 was **No**, → Go to Q3 (invariantist, but strict standard).  

  ---

  #### **Q3: Gettiered Truth**  
  *Scenario:* Jill sees John drive a Ford and shows Bob "proof" of ownership (forged documents). She asserts, "John owns a Ford." Unbeknownst to Jill, John *does* own a Ford (it’s in his garage).  
  → **Was Jill’s assertion proper (act-level)?**  
  - **Yes** → Go to Q4.  
  - **No** → Go to Q5.  

  #### **Q4: False but Reasonable**  
  *Scenario:* Same as Q3, but John does *not* own a Ford (car is rented, documents forged). Jill’s assertion is false.  
  → **Was Jill’s assertion proper (act-level)?**  
  - **Yes** → Go to Q6.  
  - **No** → Go to Q7.  

  #### **Q5: Belief Without Evidence?**  
  *Scenario:* Tom asserts, "It will rain tomorrow," based only on a dream. *It does not rain.*  
  → **Was Tom’s assertion proper (act-level)?**  
  - **Yes** → **Leaf: No constitutive norm** (no robust standard governs assertion).  
  - **No** → Go to Q8.  

  #### **Q6: Disbelieved Truth**  
  *Scenario:* Dr. Jones has overwhelming evidence that Vaccine X is safe but doesn’t believe it (due to irrational phobia). She asserts, "Vaccine X is safe," to a patient. *The vaccine is safe.*  
  → **Was Jones’ assertion proper (act-level)?**  
  - **Yes** → Go to Q9.  
  - **No** → **Leaf: Justified/reasonable belief norm** (proper only if based on justified/reasonable belief).  

  #### **Q7: Hurricane Certainty**  
  *Scenario:* A meteorologist asserts, "The hurricane will miss the city," based on 99.9% reliable data. *The hurricane misses.*  
  → **Was the assertion proper (act-level)?**  
  - **Yes** → Go to Q8.  
  - **No** → **Leaf: Certainty norm** (proper only if speaker is certain).  

  #### **Q8: False but Reasonable (Blame)**  
  *Scenario:* Identical to Q4 (Jill’s false Ford assertion with excellent evidence).  
  → **Was Jill blameworthy for asserting?**  
  - **Yes** → Go to Q10.  
  - **No** → Go to Q9.  

  #### **Q9: Lottery Loser**  
  *Scenario:* Sam asserts, "My lottery ticket lost," based on 1-in-a-million odds. *The ticket lost.*  
  → **Was Sam’s assertion proper (act-level)?**  
  - **Yes** → **Leaf: Truth norm** (proper iff asserted proposition is true).  
  - **No** → Go to Q10.  

  #### **Q10: Excuse Check**  
  *Scenario:* Identical to Q4 (Jill’s false Ford assertion).  
  → **Was Jill’s assertion improper at the act-level?** (Reconfirms Q4; if conflict, revisit Q4).  
  - **Yes** → **Was Jill blameworthy?** (From Q8):  
    - **Yes** → **Leaf: Knowledge norm** (proper iff known).  
    - **No** → **Leaf: Excuse view** (norm is knowledge, but blameless if reasonable).  
  - **No** → **Leaf: Inconsistent responses; retry Q4/Q8.**  

  ---

  ### **Key Features & Notes**  
  1. **Act vs. Agent Separation:**  
     - Q4, Q8, and the blame question in Q10 isolate agent-level evaluations (blameworthiness) from act-level propriety.  
     - Example: In Q4→Q8, a "No/No" (act-improper but not blameworthy) leads to the excuse view or truth norm with excuse.  

  2. **Leaves Covered:**  
     - Knowledge norm, Truth norm, Justified/reasonable belief norm, Certainty norm, Contextualism, No norm, Excuse view.  

  3. **Unoccupied Combinations & Why:**  
     - **"Act-proper in Gettier (Q3) + Act-improper in False Reasonable (Q4)"**: Logically unstable. If truth suffices for propriety (Q3=Yes), falsity should imply impropriety (Q4=No). Occupied by truth norm.  
     - **"Act-improper in Low-Stakes Bank (Q1=No) + Contextualism (Q2=No)"**: Unattractive. Contextualism requires standard to *rise* with stakes, not universally high. Marked as invariantist.  
     - **"Act-proper in Lottery (Q9=Yes) + Act-improper in Hurricane (Q7=No)"**: Incoherent. Certainty norms reject lottery assertions, but truth norms accept them if true. Not occupied.  

  4. **Ambiguities & Dependencies:**  
     - **Contextualism vs. Invariantism:** Fully separated by Q1→Q2 (order matters).  
     - **Knowledge vs. Excuse View:** Separated only by the blame question in Q10. Without it, they share the same path until Q10.  
     - **Truth Norm vs. Excuse View:** Truth norm requires Q9=Yes; excuse view requires Q9=No→Q10. Order of Q9/Q10 matters.  
     - **Retry Clause:** If responses to Q4 (act-level) and Q10 (act-level reconfirmation) conflict, revisit Q4.  

  5. **Efficiency:**  
     - 10 questions cover 7 views, with 3 dedicated agent-level probes.  
     - Lottery (Q9) and Hurricane (Q7) differentiate truth/non-truth and certainty/non-certainty norms.  

  ---

  ### **How to Use**  
  - Present scenarios in order.  
  - At leaves, reveal the position (e.g., "You align with the **knowledge norm**").  
  - Discuss why certain combinations are unoccupied (e.g., "No one endorses a view where truth suffices in Gettier cases but not in false reasonable cases—it violates truth-based logic").  

  This tree isolates intuitions about cases to reveal underlying commitments, minimizing label-driven bias while capturing nuances between act-level standards and agent-level excuses.
