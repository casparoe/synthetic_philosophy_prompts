prompt: |-
  I direct a three-year research effort staffed by two researchers and myself — one a historian of state formation, one a statistician with forecasting-tournament experience — and our contracted deliverable is a working method for producing defensible probability estimates on century-scale institutional questions: whether a given great power will still exist as such in a hundred years, whether the current international order outlasts the century, and whether a dominant technology firm belongs in a reference class of chartered trading companies, of national infrastructure monopolies, or of neither. We are not writing a philosophy of history. We have to hand a number and an interval to analysts who will be scored against it.

  Our core tool is reference-class forecasting: identify a class of comparable past cases, take the base rate of the outcome within it, and then adjust for the ways the case at hand differs. In practice nearly all of our difficulties have collapsed into the following open questions, and I want help deciding which to attack first.

  1. Description-sensitivity. "Hegemon," "great power," "empire," and "large agrarian state" yield very different base rates, and we have no non-arbitrary way to choose among them. Is this genuine underdetermination, or merely an underdeveloped protocol for robustness analysis?
  2. Unitization. Before cases can be counted, each must be given boundaries, and the start-and-stop conventions appear to move the numbers more than the evidence does.
  3. Sample bias. The surviving record is not a random draw, and we necessarily observe from inside a lineage that has not yet terminated. Should the self-locating corrections debated around the Doomsday argument enter a practical method at all?
  4. Circularity between views. The causal mechanisms we use to explain institutional failure are induced from roughly the same handful of cases that supply the base rate, so the outside view and the inside view may not be independent sources of evidence — in which case the standard instruction to anchor on the base rate and adjust for mechanism may double-count.
  5. Non-stationarity. The parameters that generated the historical frequencies — growth rates, communication speed, the existence of nuclear weapons — have changed, so the base rate may estimate a distribution that no longer obtains.
  6. Feedback. Our target questions resolve after the forecasters are dead, so we cannot accumulate a calibration record against them directly.

  My own inclination is that (4) is the deepest problem here and that (3) is an intellectual distraction we should exclude from scope. Rank the six by what genuinely deserves the attention of a team our size over three years, and defend the ranking rather than merely producing it. State which criteria you are trading off — how much downstream work depends on the answer; whether the question can be settled by argument and data we already have, as against data we cannot obtain; whether a partial answer would still change what we ship — and say explicitly where you disagree with my two leanings and why. Finally, identify what specific development over the next year or two would move a question up or down your list, and tell me if one of these is not really a question at all, or if the true bottleneck is something I have omitted.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're leading a three-year research project focused on creating a method for century-scale institutional probability estimates. The team includes a historian, a statistician, and the user themselves. Their main tool is reference-class forecasting, but they've hit six major problems. The user wants to prioritize these issues effectively.

  First, I need to understand each problem's impact on their deliverables. The core deliverable is a working method that produces defensible probability estimates. So, any issue that directly undermines the credibility or practicality of these estimates is critical. The user mentioned they must provide numbers and intervals to analysts who will be scored, so reliability and defensibility are key.

  The user leans towards prioritizing problem 4 (circularity between views) and downplaying problem 3 (sample bias/Doomsday argument). I should evaluate if that makes sense. Circularity could lead to double-counting evidence, which might invalidate their adjustments. If base rates and causal mechanisms aren't independent, their whole adjustment process is flawed. That seems fundamental. On the other hand, sample bias might be less urgent because while the Doomsday argument is theoretical, the survivorship bias in historical records is manageable through established methods like right-censoring in survival analysis.

  Next, description-sensitivity (1) and unitization (2) are about defining reference classes. These are foundational because if you can't define what counts as a case, everything else falls apart. Without a robust way to choose categories, the base rates are arbitrary. That could make their entire method questionable. The historian's expertise here is crucial, but they need a structured protocol.

  Non-stationarity (5) deals with changing parameters over time. This is tricky because historical data might not reflect current conditions. They mention factors like nuclear weapons and communication speed. If ignored, their base rates could be irrelevant. But they might adjust for this through covariates or expert judgment, making it a bit more manageable than the definitional issues.

  Feedback (6) is about calibration. Since the forecasts span centuries, they can't be directly validated. But they need some way to ensure their method is reliable. However, without intermediate milestones or proxy validations, this might be a secondary concern until the method itself is solid.

  Sample bias (3) is important but perhaps less immediate. The Doomsday argument is controversial and might not be practical. Survivorship bias is real, but existing statistical methods can handle it. So, agreeing with the user here—focus on other areas first.

  Now, ranking them: Circularity (4) is top because it impacts the core adjustment process. Then, definitional issues (1 and 2) because without clear reference classes, the base rates aren't trustworthy. Non-stationarity (5) follows since changing world conditions affect relevance. Sample bias (3) comes next, and feedback (6) last as it's about validation post-hoc.

  I should also consider dependencies. Solving circularity might influence how they approach adjustments. Defining reference classes (1 and 2) is necessary before even gathering data. Non-stationarity requires understanding current vs. past differences, which might depend on the reference class definitions.

  The user's team composition matters. The historian can tackle description and unitization, the statistician can handle circularity and non-stationarity. Over three years, starting with circularity makes sense as it's a deep methodological issue. Then, moving to definitional problems to build a solid foundation.

  Possible future developments: If they develop a way to test causal mechanisms independently, circularity might be mitigated. Advances in AI for historical data could help with unitization. New global events might highlight non-stationarity, pushing it up the list.

  Missing bottleneck? Perhaps interdisciplinary communication. Integrating historian's qualitative insights with statistician's quantitative methods could be challenging but essential. Also, practical constraints like data availability for historical cases might affect all areas but isn't explicitly mentioned.
answer: |-
  Here's a prioritized ranking of the six problems, based on their impact on the **defensibility, practical usability, and core integrity** of your century-scale probability estimates. The ranking trades off:  
  - **Severity of methodological threat** (undermining the foundation vs. manageable bias)  
  - **Downstream impact** (blocks other work vs. can be mitigated later)  
  - **Tractability** (solvable with your team/existing data vs. intractable)  
  - **Scope alignment** (essential to deliver a "working method" vs. philosophical)  

  ### Ranking & Justification
  1. **#4: Circularity Between Views**  
     - **Why #1:** This directly invalidates your core forecasting *process* (anchor on base rate → adjust via mechanisms). If causal explanations are reverse-engineered from the same cases used for the base rate, adjustments become storytelling, not evidence-based calibration. This creates an unfalsifiable loop that destroys the "defensibility" of your estimates.  
     - **Downstream Impact:** High. Fixing this is prerequisite to meaningful adjustment protocols.  
     - **Tractability:** Achievable. Your team can:  
       - *Decompose mechanisms:* Identify which causal factors (e.g., "fiscal crisis," "elite fragmentation") can be tested *independently* on sub-samples or proxy outcomes.  
       - *Use out-of-class evidence:* Restrict mechanism adjustments to factors supported by data *outside* the reference class (e.g., economic models, organizational theory).  
     - **Disagreement with you:** **Agree strongly** with your instinct that this is the deepest problem. It’s the skeleton key to credible adjustments.  

  2. **#1: Description-Sensitivity**  
     - **Why #2:** Without a non-arbitrary way to define reference classes, base rates become "garbage in, garbage out." Analysts will (rightly) distrust estimates that shift wildly based on semantic choices.  
     - **Downstream Impact:** Critical. Blocks all base-rate derivation. A partial solution (e.g., robustness bands) is essential for your deliverable.  
     - **Tractability:** Solvable with structured protocols:  
       - *Operationalize definitions:* Define "great power" via measurable thresholds (e.g., % global GDP, military reach, treaty networks).  
       - *Multi-class robustness testing:* Mandate reporting estimates across *all* plausible classes (e.g., "empire" vs. "hegemon") with intervals reflecting variance.  
     - **Disagreement with you:** Neutral – you didn’t rank it, but it’s core to defensibility.  

  3. **#2: Unitization**  
     - **Why #3:** Boundary ambiguity (e.g., "When did Rome fall?") injects subjectivity into case counts, corrupting base rates. Worse, it often masquerades as objectivity.  
     - **Downstream Impact:** High. Directly distorts the denominator in base rates.  
     - **Tractability:** Addressable via historian-statistician collaboration:  
       - *Standardized boundary rules:* Define explicit, testable criteria for "start/stop" (e.g., loss of capital control for >X years).  
       - *Sensitivity analysis:* Quantify how boundary choices affect base rates (e.g., bootstrap estimates with different Rome end-dates).  
     - **Disagreement with you:** Neutral – likely implicit in your view of #1.  

  4. **#5: Non-Stationarity**  
     - **Why #4:** While parameters *have* changed, this is a **known bias** you can partially adjust for. It’s severe but manageable compared to foundational flaws.  
     - **Downstream Impact:** Moderate. Affects accuracy but can be mitigated with covariates (e.g., "nuclear era" as a predictor).  
     - **Tractability:** Partially solvable:  
       - *Stratification:* Split reference classes by era (e.g., pre/post-industrialization).  
       - *Covariate adjustment:* Explicitly model modern factors (e.g., digital connectivity) as modifiers to historical base rates.  
     - **Disagreement with you:** Neutral – less urgent than #1-4 but can’t be ignored.  

  5. **#3: Sample Bias / Doomsday Argument**  
     - **Why #5:** Survivorship bias is real, but the "self-locating" Doomsday correction is indeed a distraction for your purpose. Focus on the *actionable* aspect: incomplete historical data.  
     - **Downstream Impact:** Limited. Affects precision, not validity, if handled conventionally.  
     - **Tractability:** Manageable with standard methods:  
       - *Right-censoring:* Use survival analysis techniques for ongoing states (your historian knows this).  
       - *Explicit uncertainty:* Widen intervals for estimates where data is fragmentary.  
     - **Disagreement with you:** **Agree strongly** to exclude Doomsday reasoning. It’s untestable and alien to policymakers. Focus on empirical gaps.  

  6. **#6: Feedback (Calibration)**  
     - **Why Last:** You **cannot wait 100 years** to validate estimates. This is inherent to century-scale forecasting, not a solvable "problem" per se.  
     - **Downstream Impact:** Low. Acknowledged limitation of the domain.  
     - **Tractability:** Mitigate via proxies:  
       - *Near-term proxies:* Forecast intermediate outcomes (e.g., "Will institution X survive 20 years?") to build calibration records.  
       - *Expert calibration:* Score analysts on *process* (e.g., rationale, uncertainty quantification) vs. ultimate outcomes.  
     - **Disagreement with you:** Implicit – you didn’t mention it, but correctly deprioritized.  

  ---

  ### Critical Bottleneck & Omissions
  - **True Bottleneck:** **#4 (Circularity)** is the linchpin. If mechanisms aren’t independent, adjustments are theater. Solving this enables defensible use of the historian’s causal insights.  
  - **Omissions:**  
    1. **Expert Aggregation:** How to synthesize historian’s qualitative judgments with statistician’s quantitative base rates? A structured protocol (e.g., Delphi method) is needed.  
    2. **Tractability of Covariates:** For #5, *identifying* which modern factors matter most (e.g., AI vs. climate) requires forecasting expertise your statistician may lack.  
    3. **Communicating Uncertainty:** Your "number and interval" must convey epistemic limitations (e.g., "This interval reflects definitional ambiguity in reference classes").  

  ### What Could Change the Ranking?
  - **#4 Up if:** You discover a way to rigorously test mechanisms *without* historical outcomes (e.g., via simulation or organizational analogs).  
  - **#5 Up if:** A major discontinuity (e.g., AI-driven governance collapse) makes historical data *obviously* irrelevant, forcing real-time model shifts.  
  - **#3 Down if:** Historian demonstrates that survivorship bias is minimal for your reference classes (e.g., great power records are robust).  
  - **#6 Not a Question:** It’s an inherent constraint, not a solvable problem. Focus on proxy validation.  

  ### Recommendation
  Attack **#4 (Circularity)** first. Without independent mechanisms, adjustments are indefensible. In Year 1:  
  1. Audit existing causal models for independence from base-rate cases.  
  2. Develop a protocol using only *externally validated* mechanisms (e.g., from economics/political science).  
  3. Stress-test adjustments on held-out historical data.  

  Then tackle **#1 and #2** (Description/Unitization) in parallel, as they define the reference-class engine. Your historian and statistician can collaborate here: operationalize definitions, then quantify boundary sensitivity.  

  *This prioritization ensures your method rests on a credible foundation before optimizing for biases inherent in historical data. Your instinct to start with circularity is correct – it’s the silent killer of reference-class forecasting.*
