answer: |-
  ### What the account is for
  An account of non-empirical confirmation must provide a rigorous framework for how theories gain rational credibility *in the absence of direct empirical testing*, particularly in domains like fundamental physics where such testing is often technologically impossible or temporally distant. Its core task is to articulate how theoretical virtues (e.g., consistency, explanatory unity, fruitfulness) or meta-empirical considerations (e.g., constraints from scientific methodology, absence of alternatives) can generate *genuine epistemic warrant*—not merely pragmatic utility or aesthetic preference. Crucially, it must distinguish itself from merely relabeling traditional theoretical virtues by demonstrating how these factors contribute to the *objective likelihood of a theory’s truth*, while remaining compatible with scientific fallibilism and the potential for future revision or falsification.

  ---

  ### Non-negotiable Requirements  
  1. **Robustness Against Emergent Rivals (The Evaporation Test)**  
     If non-empirical support accumulated over time (e.g., no viable rivals, internal coherence, resilience against objections) "evaporates" *entirely* upon the emergence of a new, equally viable competitor, the account fails. Support must retain *some* residual epistemic weight, reflecting that the prior support was not illusory. Conversely, if support remains wholly unchanged, the account implies unrevisable dogma. A viable account must allow that accumulated support *diminishes* but isn’t annihilated—e.g., the original theory retains comparative advantage in specific virtues, or its support recontextualizes as partial progress. *Failure here reduces non-empirical confirmation to mood-based preference*.

  2. **Non-Collapse of Confirmation vs. Justification**  
     Non-empirical *confirmation* must increase the rational credence in a theory’s *empirical adequacy or truth*, distinct from merely justifying further research or resource allocation (pragmatic justification). If an account cannot explain how non-empirical factors raise the probability that the theory’s predictions *will match future data*, it conflates confirmation with heuristic utility. For example, string theory’s mathematical elegance may justify funding but doesn’t confirm it unless linked to its capacity to describe nature. *Collapsing this distinction renders "confirmation" operationally empty*.

  3. **"No Alternatives" as Theoretical Constraint, Not Effort Report**  
     The claim "there are no serious alternatives" must be grounded in *constraints from physics/mathematics* (e.g., quantum consistency demands, cosmological boundary conditions), not sociological contingencies (e.g., "no one has thought of one yet"). An account must require that the space of possible theories is demonstrably sparse or constrained by physical necessity. If rival emergence merely reflects prior insufficient search, accumulated support *should* evaporate; if it reflects genuine theoretical innovation overcoming prior constraints, support *should* attenuate but not vanish. *Basing confirmation on effort turns science into a popularity contest*.

  4. **Compatibility with Scientific Revisability**  
     Non-empirical support cannot imply infallibility. The account must reconcile support accumulation with the possibility of future empirical falsification or theoretical supersession. This requires that support is *defeasible* and *graded*—e.g., high non-empirical support lowers the threshold for empirical acceptance but doesn’t preclude abandonment if data contradicts core predictions. *Ignoring revisability severs non-empirical confirmation from scientific rationality*.

  5. **Non-Triviality: Beyond Virtue Rebranding**  
     The account must specify how non-empirical factors *add unique justificatory force* not reducible to enumerating virtues (e.g., "it’s elegant, simple, unifying"). This could involve:  
     - **Holistic Emergence**: Support arises from interactions of virtues (e.g., consilience + unexpected coherence).  
     - **Meta-Empirical Validity**: Virtues track truth-conduciveness in a domain (e.g., mathematical necessity historically correlates with success).  
     - **Negative Elimination**: Ruling out alternatives constrains the hypothesis space objectively.  
     *Without this, "confirmation" is just a rhetorical upgrade for "plausible"*.

  ---

  ### Camp Taste  
  Disagreements arise on:  
  - **The Weight of Unity/Explanatory Scope**: Explanationists (e.g., Dawid) see broad unification as inherently truth-conducive; Bayesians may treat it as a prior adjustable by background knowledge.  
  - **The Role of Predictiveness**: Some demand non-empirical support enhance *anticipated* predictive success (even if untested); others focus on post-hoc coherence with existing knowledge.  
  - **Epistemic Modesty**: "Weak" accounts (e.g., Stanford’s) treat non-empirical support as merely extending pragmatic justification; "Strong" accounts (e.g., theory-driven realism) claim it approaches truth-likeness.  
  - **Probability Frameworks**: Bayesian formalization (e.g., prior weighting) vs. non-probabilist abduction (e.g., inference to best explanation). These reflect divergent philosophies of evidence, not core necessities.

  ---

  ### The Squeeze: Monotonicity vs. Non-Triviality  
  **The Conflict**: Non-triviality demands that accumulated support must be *robust* enough to meaningfully increase credence (e.g., not easily overturned). Monotonicity demands that support *can decrease* upon new information (e.g., rival emergence). But if support is robust, it *shouldn’t* plummet when rivals appear; if it plummets easily, it *wasn’t* robust (trivial).  
  **Why They May Be Incompatible**:  
  - Suppose non-empirical support derives from the *exhaustive elimination* of alternatives via theoretical constraints (ensuring non-triviality). When a rival emerges, it proves elimination was *incomplete*, retroactively undermining the basis for past support. Support evaporates—violating robustness.  
  - If support persists post-rival (e.g., due to residual virtues), it risks dogmatism unless the rival objectively surpasses it. But if rivals can "objectively surpass" easily, past support was weak (trivial).  
  *Resolution may require graded, context-sensitive support* (e.g., past support reflected genuine constraints *under then-available knowledge*, now revised). Yet this risks making support *too* fragile to differentiate from virtue cataloging. **Thus, satisfying both may necessitate a third variable** (e.g., empirical anchoring in related domains) absent in purely non-empirical accounts.  

  ---  
  This framework isolates the minimal criteria for non-empirical confirmation to be epistemically substantive. The emergent rival case is the litmus test.
