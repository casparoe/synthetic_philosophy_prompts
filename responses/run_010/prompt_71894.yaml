prompt: |-
  I teach ethics and a bit of aesthetics — I don't do media studies, so there may be a whole literature here I've never opened, and I'd much rather you tell me that then have you invent a term for me on the spot.

  Here's the pattern I keep running into and don't have a name for. A film or a series dramatizes a real, named, dead person, and it invents something: a line they never said, a meeting that never happened, an act of cruelty or cowardice the record doesn't support. Nobody disputes that it's invented — often the filmmakers volunteer it. What strikes me is that the moral weight of the invention doesn't seem to track how big or how damaging it is. It tracks how the audience sizes compare. The invented scene reaches forty million people; the article or the monograph that sets it right reaches forty thousand specialists, and reaches them years later. So the director can be completely candid — "we compressed, we invented, that's what drama does" — and be telling the truth, and still be leaning on the fact that the candor travels down a much smaller pipe than the invention did. The disclaimer is honest and does no work at all.

  And it isn't only that the correction is smaller. It also seems to matter where the default belief sits. Before the film, most viewers had no view of this person whatsoever; afterwards they have a vivid one, and the historian correcting it is arguing uphill against a picture that's already installed. The drama gets to set the baseline, and the correction has to dislodge it — a much harder job than it would have been had the film never existed.

  Two things make me doubt this is just dramatic licence or the tired artistic-freedom-versus-accuracy debate. First, the size of the invention seems nearly irrelevant: a small invented detail in a huge production does far more of this work than a wholesale invented plot in a film nobody watches. So whatever the wrong is, it isn't measured in departures from the record. Second, it doesn't require any deception. The credits can state plainly that events have been fictionalized, the director can repeat it in every interview, and the asymetry still runs. It's not lying, and it's not really even about whether the audience ends up misled.

  I know the neighbouring terrain roughly: there's the general argument about whether the dead can be harmed at all, and there's psychology on why corrections fail to stick and on how absorbed audiences stop pushing back. But I'm after the structural thing — the mismatch between the reach of an invented portrayal and the reach of anything that could set it right, plus the fact that this mismatch is entirely foreseeable and is quietly doing justificatory work in how we excuse the invention. Does that have an established name, in media ethics, aesthetics, or anywhere else? Don't give me references, just the concepts. If the nearest ones only partly fit, tell me which they are and exactly where each stops applying. And if nothing fits, coin a term, define it tightly, and give me the edges — I especially want to know whether a wholly fictional character who happens to share a name with a real person falls inside it, and whether it still applies when the invention runs in the flattering direction.
reasoning: |-
  Okay, the user teaches ethics and aesthetics and has encountered a specific ethical pattern in media portrayals of historical figures. They describe a situation where filmmakers invent details about real, deceased individuals, openly admit to the inventions, but the fictionalized version reaches a massive audience, while corrections only reach a small group. The moral issue isn't about deception but the structural imbalance in reach and the difficulty of correcting established narratives.

  First, I need to pinpoint the core issue: the asymmetry between the widespread dissemination of fictionalized content and the limited reach of factual corrections. The user emphasizes that the problem persists despite disclaimers because the default belief is set by the more popular medium. They also note that the size of the invention is less relevant than the audience size, and it's not about deception.

  The user wants to know if there's an existing term for this. I recall concepts like "dramatic license" or "artistic freedom," but they don't capture the structural imbalance. "Belief perseverance" from psychology explains why corrections don't stick but doesn't cover the dissemination asymmetry. "Agenda-setting" in media studies relates to what issues get attention but not the factual inaccuracy aspect. "The Matthew Effect" (advantage to those who are already established) is close but more about resource accumulation than narrative correction.

  Considering these, a new term might be necessary. The key elements are the **asymmetrical reach**, the **foreseeability** of the imbalance, and its **justificatory role**. Terms like "Narrative Asymmetry" or "Asymmetric Cultural Penetration" come to mind. The latter emphasizes the differential reach and how fictional narratives embed deeply into public consciousness. 

  I should check if existing terms fit partially. "Corrective Disparity" focuses on the correction's inefficacy but misses the filmmakers' reliance on it. "Reach Disparity" is broad but doesn’t specify narrative embedding. "Epistemic Injustice" involves harm in knowledge distribution but is broader and not media-specific.

  The user also asks about edge cases: fictional characters sharing names with real people (not covered unless the audience conflates them) and flattering inventions (still applies as the harm is about misrepresentation, not just defamation). 

  The term "Asymmetric Cultural Penetration" seems most precise. It highlights the structural imbalance (asymmetric), the embedding into public consciousness (cultural penetration), and addresses both harmful and flattering misrepresentations. It excludes cases where the audience size isn't disparate or if the real person is living (due to legal differences). 

  I need to ensure the term clearly distinguishes the phenomenon from mere deception or artistic license, emphasizing the foreseeable reach imbalance and its ethical implications despite disclaimers. This should provide the user with a precise concept to use in their ethics and aesthetics teaching.
answer: |-
  Based on your precise description, **no single established term fully captures this specific structural phenomenon** in media ethics or aesthetics. Existing concepts touch on parts but miss the core structure you've identified – the **foreseeable, systemic asymmetry in reach and stickiness between the fictionalized portrayal and its correction, which functions *despite* candor and regardless of the magnitude of the invention.**

  Here's an analysis of near misses and a proposed term:

  1.  **Dramatic License / Artistic License:** Too broad. Focuses on the *right* to invent for artistic purposes, not the *structural consequence* of the asymmetric dissemination and its foreseeable, inherent advantage. Doesn't address the corrective disparity.
  2.  **Belief Perseverance / Continued Influence Effect (Psychology):** Describes *why* corrections fail to dislodge initial beliefs once formed. Explains the *stickiness* half of your problem but doesn't address the *initial reach asymmetry* or its *foreseeability and use in justification*. It's a mechanism, not the structural condition.
  3.  **Agenda-Setting / Framing (Media Studies):** Describes how media influence *what* people think about and *how* they think about it. Relevant to the "setting the baseline" aspect, but doesn't specifically address the *factual inaccuracy*, the *correction asymmetry*, or the dynamic with *historical figures*. It's a broader media power concept.
  4.  **The Matthew Effect (Sociology of Science/Knowledge):** ("For unto every one that hath shall be given...") Describes the advantage given to already prominent entities. Analogous to the established narrative being harder to dislodge *after* the film, but doesn't capture the *initial creation* of that prominence via fictional reach nor the specific corrective asymmetry. Focuses more on cumulative advantage within a system.
  5.  **Epistemic Injustice (Miranda Fricker - Philosophy):** Specifically "Testimonial Injustice" involves credibility deficits. While the correction might face an uphill battle (a form of credibility deficit imposed by the film's narrative), this concept is broader, focused on systemic prejudice harming knowers, not the specific media structural asymmetry causing the deficit. "Hermeneutical Injustice" (lack of shared concepts) is less relevant.
  6.  **Corrective Disparity:** This gets closer to the *effect* (the gap between correction reach and original reach) but is passive. It doesn't capture the *active, foreseeable creation* of this disparity by the original work or its *use in justifying* the invention ("It's just drama, and we said so" implicitly relies on knowing the correction won't catch up).

  **Proposed Term: Asymmetric Cultural Penetration (ACP)**

  *   **Definition:** The **foreseeable and systemic imbalance** whereby a fictionalized portrayal of a historical figure, disseminated via mass media to a vast audience, achieves deep cultural penetration (setting the default narrative), while any subsequent factual corrections are confined to significantly smaller, specialist audiences, rendering effective correction practically impossible. This asymmetry is inherent in the medium/scale and is often implicitly relied upon to justify the fictionalization, despite disclaimers.
  *   **Core Elements:**
      *   Fictionalized portrayal of a named, dead historical figure.
      *   Massive audience reach for the fiction.
      *   Foreseeably limited reach for corrections.
      *   Deep embedding of the fictional narrative as the cultural default.
      *   Structural nature (not dependent on deception).
      *   The asymmetry functionally justifies the invention *ex post facto*.
  *   **Edges & Clarifications:**
      *   **Wholly Fictional Character Sharing a Real Name:** Generally **outside** ACP. ACP requires the *intentional portrayal of a specific, real historical figure*. If the character is demonstrably fictional but shares a name, it's coincidental naming or potential defamation/libel (if living) or a separate issue of confusion/misrepresentation, but lacks the core element of portraying *that specific historical person*.
      *   **Flattering Inventions:** **Still applies.** ACP is about the structural imbalance enabling *misrepresentation*, regardless of valence. Installing a *false* positive image (e.g., inventing profound wisdom or heroism not supported) is still a misrepresentation of the historical individual, exploits the asymmetry, and prevents a more nuanced or accurate understanding. The harm is to historical truth and understanding, not solely reputation damage.
      *   **Living Subjects:** **Complicates/Changes.** Defamation/libel laws and the subject's ability to respond directly alter the dynamic significantly. ACP focuses on the structural issue with *dead* figures where legal recourse for misrepresentation is absent and corrections are solely reliant on historical discourse.
      *   **Audience Size Parity:** If a correction *somehow* reached an audience comparable to the original fiction and was equally sticky, ACP wouldn't apply. The *foreseeable* and *systemic* nature of the imbalance is key.
      *   **Magnitude of Fiction:** As you noted, irrelevant to the *structural* phenomenon of ACP. A minor invention in a blockbuster exemplifies ACP far more than major invention in an obscure film.
      *   **Disclaimers:** Their presence or absence is irrelevant to ACP. The phenomenon operates *because* the correction cannot achieve comparable penetration, regardless of warnings. Disclaimers are often performative within this structure.

  **In essence, Asymmetric Cultural Penetration names the structural engine you identified: the mass media's unique power to install a durable, often fictional, baseline narrative about history for the general public, while historical scholarship operates within channels inherently incapable of mounting an effective corrective response on the same scale, a power imbalance the creators knowingly leverage.**
