  Dennett’s multiple drafts model elegantly handles color phi, but it doesn’t "dissolve" consciousness—it just redistributes it. M wins this round by exposing where R/Dennett overreach, but the Cartesian theater remains implausible. For deeper dives, read Dennett’s original color phi discussion (*Consciousness Explained*) vs. Block’s "Time and the Physical: Implications for the Hard Problem" (critique). Keep auditing that seminar—this is quintessential cog sci!
