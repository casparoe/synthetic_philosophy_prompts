  - **R’s possible reply to move 6 (your uncertainty):**  
    If R said, "If the theater is just report-making, it’s downstream—you’ve redefined it away," that’s spot-on. Dennett *would* argue that relocating the theater to output systems concedes that there’s no *inner* show (e.g., *Consciousness Explained*, Ch. 5).  

