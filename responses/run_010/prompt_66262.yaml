prompt: |-
  A friend and I spent most of last night arguing about democratic backsliding and got nowhere useful. His position is that the term has collapsed into a partisan label: any codebook that flags one government's court reforms while passing over another's is politics wearing a lab coat, and the honest thing is to stop publishing indices. My position is that there is a real distinction between a democracy that is getting worse while remaining a democracy and one that is crossing a threshold into something else, and that the distinction can be made operational rather than merely rhetorical. Neither of us could write the test down. I would like you to write it down, because I now have to use it at work.

  The setting. I supervise a two-person classification team at a private grantmaking foundation. Four times a year we assign every country in our portfolio — roughly forty of them, including Hungary, Poland, Turkey, and the United States — to one of three categories: functioning democracy, backsliding, or non-democracy. The category determines which funding instrument a country office may use and, twice a year, appears in a public report. Our board includes appointees from both major American parties, and last cycle one of them formally accused us of applying a different standard to Ankara than to Austin. So the classification has to be defensible to people who are looking for asymmetry, and it has to produce the same verdict regardless of which of my two analysts runs it.

  The constraints. Each analyst has an undergraduate degree in political science and no graduate training in comparative politics. Each country gets ninety minutes per quarter, working only from publicly reported facts. Where the procedure requires a judgment that cannot be resolved by evidence — a question of what democracy is for, or how much weight a value deserves — it must say so and hand the decision up to me rather than burying the judgment inside a scoring rule. And it must tell the analyst what to do when a load-bearing fact is contested and cannot be verified within the time budget.

  What I want. A decision procedure, in ordered steps, that an analyst can actually run: the questions to ask in sequence, what counts as a sufficient answer to each, the thresholds at which the classification changes, the points at which the procedure terminates in a verdict, and the points at which it terminates in an escalation. Ground it in whatever the study of comparative politics has that is genuinely operational here — the difference between a decline that remains above the floor of democracy and one that goes through it; the difference between changing the rules and changing how the rules are observed in practice; the fact that backsliding is usually accomplished through legal instruments rather than through coups; and the distinction between narrowing the competitiveness of elections and hollowing out the speech, association, and rule-of-law conditions without which competition means nothing. Name the concepts you rely on, but do not give me a bibliography, a reading list, or citations; I want the apparatus, not the references. Tell me explicitly which distinctions you are preserving intact, which you are compressing for usability, and what the compression costs.

  Then run it on three cases, invented to be difficult:

  1. A government uses the ordinary constitutional amendment procedure, ratified by referendum, to reduce the size of its constitutional court from fifteen members to nine and to give the legislature authority to review the court's budget and administrative appointments. No right is textually repealed and no election is altered.
  2. An electoral commission redraws all districts using a published algorithm. The opposition wins a majority of the national vote and forty percent of the seats. Independent analysts report that the resulting map falls within the range produced by ordinary partisan redistricting in several long-established democracies.
  3. Following a major terrorist attack, a government declares a state of emergency that remains in force for fourteen months. Under it, press accreditation is suspended for outlets accused of spreading panic; two of the suspended outlets are restored after nine months.

  For each, report the classification the procedure yields, the steps that produced it, and any step at which the analyst was told to escalate. At least one of these should come out in a way that would be politically inconvenient for my board — if your procedure never produces an unwelcome verdict, tell me why that is a defect rather than a reassurance.

  Finish with a symmetry audit: state what happens when the same procedure is run on measures adopted by an established democracy, and identify any step whose trigger would in practice fire only in some countries and not others. Then give me a short, unsparing account of what this procedure cannot do — including whether it can handle a country that was never fully democratic to begin with, and whether it can detect backsliding that has not yet produced any observable institutional change.

  Please write the entire response in American English.
reasoning: |-
  Okay, the user is dealing with a complex classification problem related to democratic backsliding. They need a clear, operational decision procedure for categorizing countries into functioning democracy, backsliding, or non-democracy. 

  First, I need to understand their constraints: two analysts with undergrad political science degrees, 90 minutes per country per quarter, using only publicly available facts. The procedure must minimize subjective judgments and handle contested facts. It also needs to be defensible across partisan divides.

  The core challenge is distinguishing between democratic erosion (backsliding) and regime collapse (non-democracy), while acknowledging that backsliding often happens through legal means. I'll build on established comparative politics concepts like Dahl's polyarchy, Levitsky & Way's competitive authoritarianism, and Schedler's electoral autocracy framework. 

  For the decision procedure, I'll create a step-by-step flowchart with escalation points. Key distinctions to preserve: 
  1. Between institutional changes and their implementation
  2. Between electoral competitiveness and essential liberties
  3. Between temporary emergency measures and permanent erosion

  The compression will sacrifice nuance in measuring backsliding severity and speed, but that's acceptable given the time constraints. The procedure will terminate at the first non-democracy indicator to save time - a necessary tradeoff.

  Now for the test cases:
  Case 1 (court restructuring) is tricky because it's legal but undermines checks. The procedure should flag it as backsliding due to weakening judicial independence.
  Case 2 (gerrymandering) should remain functioning democracy since it's within normal democratic variation. This might annoy the board - good, it shows the procedure isn't biased.
  Case 3 (emergency powers) is borderline. The prolonged suspension of press with partial restoration suggests backsliding.

  The symmetry audit reveals the procedure uses universal thresholds (e.g., election thresholds apply equally to US and Turkey). The main limitation is detecting pre-institutional backsliding like rhetoric normalizing violence, and handling hybrid regimes. Also can't capture democratic improvements - but that's beyond scope.

  Finally, I'll be blunt about shortcomings: it's snapshot-based, can't predict future backsliding, and struggles with regimes that never achieved full democracy. The user needs to know these gaps upfront.
answer: |-
  Here is an operational decision procedure for classifying democratic backsliding, designed for your constraints. It prioritizes observable institutional facts, minimizes buried value judgments, and identifies escalation points.

  **Core Concepts & Distinctions Used:**
  1.  **Polyarchy Threshold (Dahl):** Distinguishes democracies (guaranteeing public contestation and inclusion) from non-democracies.
  2.  **Competitive Authoritarianism (Levitsky & Way):** The "something else" threshold where competition exists but is fundamentally unfair due to state bias.
  3.  **Institutional vs. Behavioral Change:** Distinguishes changing formal rules (amendments, laws) from violating existing rules (selective enforcement, abuse of emergency powers).
  4.  **Electoral Integrity (Essential Components):**
      *   *Competitiveness:* Meaningful chance for opposition to win power.
      *   *Liberties:* Freedom of expression, association, assembly necessary for competition to exist.
      *   *Rule of Law:* Impartial administration of rules, especially concerning elections and rights.
  5.  **Backsliding Mechanism:** Focus on *legal* or *constitutional* instruments used to undermine democratic institutions, distinct from coups.

  **Decision Procedure: Ordered Steps**

  **Phase 1: Non-Democracy Check (Terminates early if failed)**
  *   **Step 1.1: Free & Fair Election Threshold:** Did the most recent national executive and legislative elections meet ALL criteria?
      *   **Criteria:**
          *   (a) Opposition parties/candidates were legally allowed to run.
          *   (b) Major opposition parties/candidates *did* run (were not barred on spurious grounds, jailed *as candidates*, or forced into exile *to avoid arrest/campaign*).
          *   (c) Vote counting was sufficiently transparent and credible (no *widespread, independently verified* fraud altering outcome).
          *   (d) The election result determined who holds executive/legislative power (no military/veto council override).
      *   **Sufficient Answer:** Public reports from at least two major, independent international election observer missions (e.g., OSCE/ODIHR, OAS, Carter Center, or credible regional bodies) OR consistent reporting from multiple reputable, independent domestic NGOs and international news agencies (e.g., Reuters, AP, AFP).
      *   **Threshold:** A "No" to *any* of (a), (b), (c), or (d) → **Classify as Non-Democracy**. Escalation: If key facts for (b), (c), or (d) are *contested* (e.g., govt claims fraud, observers divided) and cannot be resolved within 15 mins using Step 1.1 sources → **Escalate to Supervisor**. *Terminate procedure*.
      *   **Outcome:** Pass → Proceed to Step 2.1.

  **Phase 2: Backsliding Check (Assesses erosion below prior democratic standard, above Non-Democracy threshold)**
  *   **Step 2.1: Significant Institutional Change?** Since the last classification cycle, has there been a formal, legal change (law, constitutional amendment, major regulation) significantly impacting:
      *   (a) **Electoral Integrity:** Rules governing candidate eligibility, districting, campaign finance, vote counting, voter registration.
      *   (b) **Judicial Independence:** Appointment/removal of judges, jurisdiction of courts (esp. constitutional/high courts), court budgets/administration.
      *   (c) **Media Freedom:** Ownership rules, licensing, content regulation, defamation laws.
      *   (d) **Civil Liberties:** Laws governing assembly, association (NGO laws), protest, anti-terrorism/sedition definitions.
      *   **Sufficient Answer:** Verified text of the enacted change. Public analysis by at least one reputable legal NGO (e.g., ICNL, Venice Commission opinion) or constitutional law expert report widely covered.
      *   **Threshold:** "Yes" → Proceed to Step 2.2. "No" → Proceed to Step 2.3.
  *   **Step 2.2: Intent & Impact Assessment of Change:** Does the change, based on its design and immediate implementation context, *plausibly* and *significantly*:
      *   (a) **Tilt Competition:** Systematically advantage incumbent/dominant party *beyond normal partisan advantage* in established democracies? OR
      *   (b) **Reduce Accountability:** Shield executive/legislative majority from oversight by courts, media, or civil society *on core democratic functions* (elections, rights protection, corruption)?
      *   **Sufficient Answer:** Analysis must rely on:
          *   The *text* of the change itself.
          *   *Statements of intent* by proponents (official govt statements, legislative debate records).
          *   *Immediate, observable consequences* (e.g., specific lawsuits blocked, specific outlets silenced, specific opposition figures barred *using the new rule*).
          *   *Consensus* among major international democracy NGOs (Freedom House, V-Dem, IDEA) or legal bodies (Venice Commission) that the change is problematic.
      *   **Threshold:** "Yes" to (a) or (b) → **Classify as Backsliding**. Escalation: If impact is *ambiguous* (text unclear, intent mixed statements, immediate consequences not yet visible) → **Escalate to Supervisor**. *Terminate procedure*. "No" → Proceed to Step 2.3.
  *   **Step 2.3: Significant Behavioral Erosion?** Since the last classification cycle, is there evidence of *systematic* violations of *existing* laws/rules by state actors, significantly impacting:
      *   (a) **Rule of Law:** Selective prosecution/jailing of major opposition figures or critical journalists *on politically motivated charges*? Consistent failure of courts to check executive overreach in politically sensitive cases?
      *   (b) **Media Freedom:** Systematic harassment (fines, lawsuits, tax audits) forcing critical outlets offline/silent? State advertising used punitively?
      *   (c) **Civil Liberties:** Excessive force/disproportionate bans on peaceful protests? Burdensome NGO regulations applied selectively?
      *   (d) **Emergency Powers:** Prolonged (>6 months) state of emergency used to suppress dissent/opposition beyond immediate security threat?
      *   **Sufficient Answer:** Requires *multiple, corroborating* reports from reputable sources:
          *   Documented cases by major human rights NGOs (HRW, Amnesty, FIDH).
          *   Consistent reporting by multiple independent domestic media outlets.
          *   Reports from international bodies (UN Special Rapporteurs, Council of Europe).
          *   Court rulings finding violations (if available and not systematically ignored).
      *   **Threshold:** Evidence of *systematic* patterns ("Yes") impacting (a), (b), (c), or (d) → **Classify as Backsliding**. Escalation: If evidence is limited to a *single incident* or sources are *highly contested* and unresolvable within 15 mins → **Escalate to Supervisor**. "No" → **Classify as Functioning Democracy**. *Terminate procedure*.

  **Handling Contested Facts (Load-Bearing):**
  *   If a fact critical to Step 1.1 or Step 2.3 is contested by credible sources (e.g., govt vs. NGOs on election fraud extent, or on politicized prosecution) and cannot be resolved within 15 minutes using the designated "Sufficient Answer" sources, the procedure mandates **Escalate to Supervisor** at that step. Do not proceed based on assumption.

  **Compression Costs:**
  *   **Preserved:** Distinction between Non-Democracy threshold (failed election) vs. Backsliding (erosion above threshold). Focus on legal instruments vs. coups. Distinction between changing rules (Step 2.1/2.2) vs. breaking them (Step 2.3). Distinction between competitiveness and liberties/rule of law.
  *   **Compressed:** "Normal partisan advantage" (Step 2.2a) - relies on analyst's baseline knowledge of established democracies (e.g., US/UK redistricting norms). "Systematic" pattern (Step 2.3) - requires judgment based on source credibility/repetition, not a strict numeric threshold. Severity/speed of erosion within "Backsliding" is not graded.
  *   **Cost:** Potential for misclassifying early-stage backsliding relying solely on behavioral erosion if evidence is sparse or contested. Reliance on external monitoring bodies for evidence. "Normal partisan advantage" requires analyst training on comparator cases.

  **Application to Test Cases:**

  1.  **Court Restructuring via Amendment & Referendum:**
      *   Step 1.1: Elections likely passed (assume no evidence otherwise). Proceed.
      *   Step 2.1: **Yes.** Significant institutional change impacting Judicial Independence (b).
      *   Step 2.2: **Intent & Impact:** Reduction in size + legislative control over budget/admin *plausibly* and *significantly* reduces judicial independence (**b: Reduce Accountability**). Designed to limit court's ability to check the legislature/executive. No plausible neutral justification for this specific combination. Immediate consequence: Likely chilling effect on court rulings against govt. Consensus among legal experts (Venice Commission, etc.) would likely condemn.
      *   **Classification: Backsliding.** (No escalation needed if impact is clear from text/intent/consensus).

  2.  **Algorithmic Redistricting / Gerrymandering:**
      *   Step 1.1: Elections passed (opposition ran, voted, won votes/seats). Proceed.
      *   Step 2.1: **Yes.** Change impacting Electoral Integrity (a) - districting.
      *   Step 2.2: **Intent & Impact:** Published algorithm. Result falls within range of "ordinary partisan redistricting" in established democracies (e.g., US, UK). While outcome is skewed, it does *not* systematically advantage incumbent *beyond* this established norm (**a: Tilt Competition? No**). Does not shield govt from other accountability mechanisms (**b: Reduce Accountability? No**). No evidence the algorithm itself was designed *solely* for extreme tilting beyond these norms.
      *   Proceed to Step 2.3: No evidence provided of systematic behavioral erosion (jailing opponents, silencing media, etc.).
      *   **Classification: Functioning Democracy.** *(This may be politically inconvenient if board members expect this level of gerrymandering to be flagged as backsliding, but the procedure shows symmetry - it wouldn't flag similar actions in the US/UK either).*

  3.  **Prolonged Emergency Powers / Press Suspensions:**
      *   Step 1.1: Elections likely passed (assume). Proceed.
      *   Step 2.1: **No.** The state of emergency declaration is a legal act, but the *suspension of press accreditation* is likely an *implementation measure* under that law, not a new permanent institutional change. Focus shifts to behavior.
      *   Proceed to Step 2.3: **Significant Behavioral Erosion?**
          *   (b) Media Freedom: **Yes.** Suspension of multiple outlets accused of "spreading panic" is a *systematic* restriction applied under emergency powers. "Spreading panic" is vague and easily politicized. Partial restoration (2/?) after 9 months does not negate the prolonged suppression during a critical period.
          *   (d) Emergency Powers: **Yes.** 14 months is prolonged (>6 months). Used to suppress media, not solely for immediate security needs related to the attack.
      *   **Classification: Backsliding.** (No escalation if evidence of suspensions is clear and uncontested).

  **Symmetry Audit:**
  *   **Established Democracy Application:** The procedure applies the *same* thresholds.
      *   Step 1.1: A failed US election (e.g., widespread verified fraud, opposition barred) would classify as Non-Democracy.
      *   Step 2.1/2.2: A US constitutional amendment significantly crippling judicial review or gerrymandering proven *far beyond* historical norms (e.g., leading to <40% seats for 50%+ vote winner consistently) could trigger Backsliding.
      *   Step 2.3: Systematic, documented use of emergency powers (like prolonged Patriot Act abuses jailing opponents) or DOJ targeting opposition figures could trigger Backsliding.
  *   **Potential Asymmetry Triggers:**
      *   **Step 1.1 (d) - Election Result Honored:** This *could* fire more easily in systems with clearer constitutional succession (e.g., UK) vs. systems with contested transitions (e.g., US 2020, Peru). However, the trigger is the *event* (override/refusal), not the country. Evidence bar is high (widespread, verified).
      *   **Step 2.2a - "Beyond Normal Partisan Advantage":** Requires analyst understanding of comparator norms. Could be challenging for analysts unfamiliar with, say, Japanese or Belgian politics. Mitigation: Training on key comparator cases (US, UK, Germany, etc.) is essential. Ambiguity triggers escalation.
      *   **Source Availability (Step 2.3):** Reputable NGO/observer coverage might be sparser for smaller democracies or those less geopolitically significant, making evidence harder to find within 90 mins. This is a resource constraint, not a procedural bias.

  **What This Procedure Cannot Do (Unsparing Limitations):**
  1.  **Handle "Never Fully Democratic" Countries:** The procedure assumes a baseline of "Functioning Democracy" to erode *from*. A country consistently hovering near the Non-Democracy threshold (Step 1.1 barely passed) but showing no *recent* significant negative change would likely be classified as "Functioning Democracy" unless Step 1.1 fails. **It cannot identify stagnation in a low-quality democracy.** It needs *change* to classify Backsliding.
  2.  **Detect Pre-Institutional Backsliding:** It misses erosion driven by rhetoric, norm-breaking (not law-breaking), intimidation, or polarization that hasn't yet crystallized into institutional changes (Step 2.1) or systematic behavioral violations (Step 2.3). E.g., a leader constantly attacking judicial legitimacy but not changing laws yet.
  3.  **Measure Severity/Speed:** All Backsliding is one category. Rapid descent towards competitive authoritarianism is lumped with slower, more incremental erosion.
  4.  **Predict Future Risk:** It's a snapshot of recent/current changes. It doesn't forecast if backsliding will continue or accelerate.
  5.  **Capture Democratic Improvements:** It only looks for *negative* change. A country recovering from backsliding wouldn't be reclassified until positive institutional/behavioral changes were observed and sustained, which isn't modeled here.
  6.  **Fully Resolve Deep Disagreements:** While minimizing buried judgments, Step 2.2 (Impact Assessment) inherently involves some interpretation. Escalation is the safety valve, pushing the hardest calls to you.
  7.  **Perfect Consistency Across Analysts:** Training on "normal partisan advantage" and "systematic pattern" is crucial. Differing interpretations of source credibility could occur, though the "Sufficient Answer" criteria aim to constrain this.

  This procedure provides a clear, evidence-based, auditable path to classification under severe time constraints, explicitly surfaces key judgments for escalation, and applies the same standards universally. Its limitations necessitate clear documentation and supervisory oversight, especially for borderline cases and countries with limited democratic history.
