  - Tier 3 (Popperian): The capability involves an internal model that the robot can use to simulate possible actions and their outcomes without having to try them in the real world. This allows "killing" bad plans in simulation. The model might be fixed or updated (if updated, then it might also be Skinnerian or Gregorian, but we take the highest tier).

  - Tier 4 (Gregorian): The capability can be extended by the robot acquiring and using external tools, such as symbols, language, or knowledge from other agents (including humans). This includes learning from natural language instructions, using pre-trained models that interpret symbols, etc.

  The tiers are hierarchical: if a capability meets the criteria for a higher tier, it is classified at that tier even if it also meets lower ones. However, note that a capability might not fit neatly. We are to assign the highest tier for which the capability satisfies the criteria.

