     Decision: The tier attaches to the capability as it exists in the deployed artifact. We ignore the design process and the OTA update pipeline unless the capability itself includes learning or updating via OTA. In other words, if the capability is fixed at deployment and does not change without an OTA update that we push, then the update pipeline is not part of the capability's tier. However, if the capability includes on-device learning or adaptation (without OTA) then that is considered.

