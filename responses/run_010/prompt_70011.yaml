answer: |-
  ### Dennett-Based Capability Tier Classification Procedure  
  **Purpose**: Classify a robot capability into one of Dennett's four tiers (1: Darwinian, 2: Skinnerian, 3: Popperian, 4: Gregorian) using objective engineering criteria. Focuses *only* on the artifact's behavior in the field post-deployment, ignoring design processes or OTA updates unless they are part of the capability’s in-field operation.  
  **Time**: 30–45 minutes per proposal.  
  **Input**: Capability proposal doc (must describe: mechanism, update triggers, failure modes, external dependencies).  
  **Output**: Tier (1–4), plus flags for ambiguous cases requiring board review.  

  ---

  ### Procedure  
  **Rules**:  
  - Tiers are **mutually exclusive**—assign the *highest* tier that applies. Stop at first match.  
  - **Ignore designer intelligence/OTA pipeline**: Tier is based *only* on the artifact’s in-field behavior. A "hardwired" capability is Tier 1 even if designed by humans.  
  - **Evidence required**: Ablation tests (disable X, what breaks?), novel scenario behavior, and cloud/offline mode validation.  
  - **Judgment Calls**: Marked with ⚠️. If uncertain, flag for board review.  

  #### Step 1: Check for Gregorian (Tier 4)  
  **Question**:  
  > *Does the capability **acquire new competence** by ingesting external, human-generated tools/symbols (e.g., language, maps, gestures) without a software update?*  

  **Sufficient "Yes"**:  
  - Robot parses unstructured external inputs (e.g., natural language, symbols) to **do something new** not pre-coded in its skill library.  
  - Competence expands without new OTAs (e.g., understands a novel command combo like *"water plants after rain unless soil is damp"*).  
  - Evidence: Ablation test where removing external tools (e.g., block cloud API) reverts robot to fixed skill set; novel user input leads to successful new behavior.  

  **⚠️ Judgment Call**:  
  - Is the robot *truly extending* competence (Tier 4) or just selecting from pre-baked options (Tier 1)? Demand examples of **novel input→behavior pairs** not in training data.  
  - **Flag if**: Inputs are semi-structured (e.g., templates) or tool use is trivial (e.g., reading a barcode).  

  #### Step 2: Check for Popperian (Tier 3)  
  **Question**:  
  > *Does the capability **run simulations** using an internal world model to "kill" bad plans before acting?*  

  **Sufficient "Yes"**:  
  - Explicit simulation loop (e.g., predicts outcomes of actions in a model before execution).  
  - Failure in simulation prevents real-world failure (e.g., aborts a navigation path if collision predicted).  
  - Evidence: Ablation test disabling simulation causes real-world errors; logs show simulations run pre-action.  

  **⚠️ Judgment Call**:  
  - Is it *true simulation* (Tier 3) or just pre-computation (e.g., A* pathfinding)? Demand proof that **multiple what-if scenarios** are tested internally.  
  - **Flag if**: Model is implicit (e.g., end-to-end NN with no queryable state).  

  #### Step 3: Check for Skinnerian (Tier 2)  
  **Question**:  
  > *Does the capability **improve through rewards/punishments** from in-field experience (no OTA)?*  

  **Sufficient "Yes"**:  
  - On-device learning algorithm (e.g., RL) that updates policy weights based on rewards/penalties.  
  - Measurable behavior change in response to failures (e.g., avoids a new obstacle type after 3 bumps).  
  - Evidence: Ablation test freezing learning degrades performance; metrics show improvement over time in novel environments.  

  **⚠️ Judgment Call**:  
  - Is it *learning* (Tier 2) or just state adaptation (e.g., caching WiFi passwords)? Demand **parameter updates** (e.g., weight changes in NN).  
  - **Flag if**: Learning is cloud-dependent (e.g., data sent to server for retraining).  

  #### Step 4: Default to Darwinian (Tier 1)  
  **Question**:  
  > *Is the capability **fixed, hardwired, and non-adaptive** post-deployment?*  

  **Sufficient "Yes"**:  
  - No learning, simulation, or external tool use. All logic is static (e.g., firmware, frozen weights).  
  - Evidence: Ablation tests show no change in behavior after failures; no variation in novel scenarios.  

  ---

  ### Handling the "Designer Problem"  
  - **Tier attaches to the artifact AS SHIPPED**: We ignore the OTA pipeline and human designers. A hardwired capability is Tier 1 even if it was designed by Gregorian humans.  
  - **Cost**: May undersell sophistication (e.g., a "dumb" sea squirt vs. a "smart" static policy). But it avoids inflating tiers via inheritance.  
  - **Not Tier 4 by default**: Design-time ingenuity doesn’t count—only in-field behavior matters.  

  ---

  ### Classification of Example Proposals  
  #### (a) Yard Robot Obstacle Avoidance  
  - **Mechanism**: Frozen end-to-end policy, no learning, no model.  
  - **Procedure Walkthrough**:  
    1. **Gregorian?** No external tools used.  
    2. **Popperian?** No internal model/simulation.  
    3. **Skinnerian?** No rewards/punishments; weights static.  
    4. **Darwinian?** Yes—fixed at deployment.  
  - **Tier**: 1 (Darwinian).  

  #### (b) Indoor Robot Household Model  
  - **Mechanism**: Builds/updates predictive model (e.g., "dog sleeps here at 3PM"), uses it for task scheduling.  
  - **Procedure Walkthrough**:  
    1. **Gregorian?** No external tools—model built from own sensors.  
    2. **Popperian?** Yes—uses internal model to simulate outcomes (e.g., "if I vacuum now, will dog bark?"). Bad plans (wasted time) killed in simulation.  
    3. *Stop—Tier 3 assigned*.  
  - **Evidence Needed**: Logs showing simulation of schedules; ablation test disabling model causes inefficiencies.  
  - **Tier**: 3 (Popperian).  

  #### (c) Prototype Teaching Interface  
  - **Mechanism**: User gives English command (e.g., *"after school drop-off, tidy upstairs"*). Robot uses off-the-shelf LLM + fixed skill library.  
  - **Procedure Walkthrough**:  
    1. **Gregorian?** Yes—ingests natural language (external tool) to **extend competence**. Understands novel commands (e.g., *"skip vacuuming if cat is sleeping"*), composing skills in unscripted ways without OTA.  
    2. *Stop—Tier 4 assigned*.  
  - **Evidence**: Novel commands executed successfully; ablation test blocking language input disables feature.  
  - **Tier**: 4 (Gregorian). **Matches your desired tier**.  
  - **If Tier 4 Wasn’t Achieved**: To "earn" it, ensure:  
    - The LLM isn’t just mapping to pre-defined routines (e.g., *"tidy"* must dynamically map to context-aware actions).  
    - Proposal must emphasize **competence extension** (e.g., "understands commands not seen in testing").  

  ---

  ### Cases the Procedure Can’t Settle (Require Board Argument)  
  1. **Ambiguous Tool Use**:  
     - Example: Robot uses cloud-based LLM to interpret commands. Is the cloud an "external tool" (Tier 4) or a crutch?  
     - Procedure flags it—board decides if competence is truly extended.  

  2. **Simulation vs. Optimization**:  
     - Example: Robot runs Monte Carlo tree search for path planning. Is it Popperian (simulation) or just smart Darwinian (optimization)?  
     - Judgment call ⚠️—demand proof of "bad plan killing."  

  3. **Hybrid Mechanisms**:  
     - Example: A Skinnerian component (field learning) feeds a Popperian model (simulation).  
     - Procedure assigns highest tier (e.g., Popperian), but board may debate risk implications.  

  4. **Degree of Novelty**:  
     - Example: "Uses language to pick up tools" — how novel must the behavior be to count as Gregorian?  
     - Procedure requires examples; board judges if it’s sufficiently transformative.  

  ---  
  **Final Output**: Tier + flagged ambiguities. For borderline cases, the board argues based on risk, not philosophy.
