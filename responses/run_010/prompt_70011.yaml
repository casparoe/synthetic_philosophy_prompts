  Procedure:

  We will define the tiers as:

  - Tier 1 (Darwinian): The capability is fixed and hardwired. There is no learning or adaptation in the field. The robot does not change its behavior based on experience. It does not use an internal model to simulate outcomes. It does not acquire or use external tools (like language or symbols) to extend its competence. The behavior is entirely pre-programmed and invariant.

