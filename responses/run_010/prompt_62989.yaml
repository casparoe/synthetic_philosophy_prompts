answer: |-
  ### The Position, Sharpened
  Your core claim: Aggregation is a pseudo-problem because Contractualism's justifications are *person-specific* – addressed to individuals whose complaints cannot be summed *across* persons. The apparent "force of numbers" always reduces to either 1) the *strength* of *each individual's* complaint against the alternative principle, 2) the necessity of a weighted lottery when individual complaints are *equally strong* but mutually exclusive, or 3) specific duties owed *to each* of the many. **Most exposed claim:** Numbers *never* directly matter; any case *seeming* to require aggregation is resolvable solely via these non-aggregative mechanisms (§2, §3). This denies the *existence* of a distinct aggregation problem within Contractualism.

  ### Defeaters, Ranked (Fatal → Awkward)

  1.  **The Overwhelming Numbers Case (Fatal Challenge):** Save 1 person from a stubbed toe, or save 1000 from agonizing death. Your view must say: Each dying person has a *vastly stronger complaint* against a principle permitting toe-saving over life-saving than the toe-stubber has against life-saving over toe-saving. **Bite:** This strains credulity. It requires asserting an *incomparably* massive difference in *individual* complaint strength to avoid implying aggregation. Scanlonians typically bite the bullet here, but it highlights the *ad hoc* inflation of individual complaint needed to mimic aggregation without admitting it.

  2.  **The Identical Complaints Cycle (Potentially Fatal):** Choose between saving Group A (10 lives) or Group B (11 lives), *but* all individuals have identical claims. Your view requires a weighted lottery favoring B (11/21 chance). Now, compare saving B (11) vs. Group C (12). Lottery favors C. Compare C (12) vs. A (10). Lottery favors C. But A vs. B vs. C is cyclic: A<B<C<A? **Bite:** This reveals an inconsistency. Pairwise comparisons + lotteries generate an intransitive "preference," violating rational choice. Avoiding this requires either admitting the *number* itself breaks the tie (smuggling aggregation) or denying transitivity, a major theoretical cost.

  3.  **Weighted Lottery as Covert Aggregation (Serious Challenge):** You endorse weighted lotteries based on numbers when claims are equal. But *why* weight by number? If complaints *truly* don't aggregate, why isn't a *simple* (unweighted) lottery among individuals or groups sufficient? Weighting *by the number affected* functionally replicates aggregated utility. **Bite:** This looks like aggregation snuck in through procedural machinery. A defender must argue weighting is demanded by the *equal strength* of claims and fairness *to each*, but the numerical weight remains explanatorily primary.

  4.  **The Non-Identity "Numbers Matter" Case (Awkward):** Choose Policy X (benefits 1 million existing people slightly) or Policy Y (benefits 10 million *different future people* significantly). If no one exists who can complain about being created under X vs. Y, the "many" in Y seem to have *no standing complaint* against X. But intuitively, numbers *should* matter here. **Bite:** Your view struggles to explain why Y is better, as the core mechanism (individual complaints) is absent for future people. §3 (duties owed *to each*) seems weak if the "each" don't yet exist to be owed.

  5.  **Threshold Cases Compounding Individual Complaints (Awkward):** Save one from death, or save a vast number (N) from a minor harm (e.g., ruined meal). Intuitively, saving N is wrong; save the one. Your view explains: Each minor-harm victim has a *vanishingly weak* complaint against the death-allowing principle. But what if N is astronomical (e.g., 10^20)? Does each complaint *remain* negligible, or does the sheer scale create a *qualitatively different* type of complaint for each (e.g., societal collapse)? **Bite:** To avoid implying aggregation ("many small harms sum to outweigh death"), you must insist *each* complaint remains negligible regardless of N, which seems counterintuitive at extremes.

  ### What a Scanlonian Would Concede
  A defender would **wave off** Defeater #5: Insisting individual complaints remain negligible regardless of N is precisely the point – it protects against justifying massive minor harms to avoid one serious harm, upholding the separateness of persons. They'd **wave off** #4 as a distinct problem for Non-Identity cases generally, not unique to this view; perhaps future people *do* have claims, or other Contractualist resources apply. They'd **concede unease** with #1 but argue it's the necessary cost of the core commitment; inflating individual complaint strength is less bad than abandoning anti-aggregation. They might **concede #3 is tricky** but argue weighted lotteries *are* fundamentally fair *to each individual* (giving each an equal *per capita* chance of rescue when claims are equal), not aggregative. **Defeater #2 is the critical concession point:** A defender might argue real-world deliberation avoids strict cycles by assessing the *specific context* holistically, rendering formal intransitivity irrelevant. However, they must concede that *if* strict pairwise comparisons under the model generate cycles, it's a serious theoretical flaw requiring adjustment (e.g., allowing some formal role for numbers in tie-breaking).

  ### Insulated or Refuted? (Verdict: Keep, but with Severe Strain; Hardest Shrug: Cycle)
  Your view is **not definitively refuted**, but it's **highly insulated at significant cost**. It survives by making core concepts ("complaint strength," "fairness in lotteries") bear enormous, potentially *ad hoc* weight (#1), and by downplaying formal coherence problems (#2). You should **keep exploring it**, as it rigorously tests Contractualism's anti-aggregative core. However, it risks becoming unfalsifiable by stretching "complaint strength" to cover every case where numbers seem to matter.

  **The hardest consideration to shrug off is Defeater #2: The Identical Complaints Cycle.** If pairwise justification + weighted lotteries for equal claims generates intransitive outcomes in multi-option choices involving different-sized groups, it reveals a fundamental inconsistency within the model's decision procedure. While a Scanlonian might appeal to holistic deliberation in practice, the *theoretical model* itself appears flawed. Resorting to "context" feels like abandoning the formal structure your view relies on to avoid aggregation. This cycle threatens the internal rationality of the justificatory process more directly than the intuitive discomfort of #1 or the procedural concerns of #3. It suggests the mechanisms you propose (§2, §3) are insufficient to generate coherent choices without implicitly relying on the aggregated numbers they explicitly reject.
