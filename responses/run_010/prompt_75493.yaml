prompt: |-
  six months into a novel and I've got a character, Nadia, who's stopped making her own moral calls. she rings a friend of hers — much sharper man, been doing this kind of thinking his whole life — and does whatever he tells her, and he's never steered her wrong, she's right basically everytime.

  my agent read the draft and came back with one line: Nadia is a moral plagiarist, she's publishing someone else's judgement under her own name and the reader can smell the fraud, and that's why the character reads flat. another novelist I know, who did philosophy as an undergrad, says the analogy is just a slur — there's no manuscript sitting in the friend's drawer that she could have written herself, a moral judgement isn't a transferable object, so calling her a plagiarist is a way of saying I don't like her without giving a reason.

  I have to pick a side before I can fix the character, and possibly before I let someone say the plagiarism thing in a scene, where it needs to actually land on the page. so audit it for me. what maps onto what: the manuscript, the byline, the audience being taken in, the craft the real author had to exercise, the moment of handover. then where the mapping breaks — and which of those breaks actually matter for the charge of fraud, versus being surface differences that leave the charge intact. and if it does hold, what is the defect supposed to be: she doesn't have the reasons, she'd come apart on a case that's slightly different from the one she was told about, or she can't answer for it to the person she hurt? those feel like three different accusations and I suspect my agent is running them together under one word.

  bottom line: does 'plagiarist' carry the weight she wants it to, or was the analogy holding up nothing? and if it fails, is there something better out of my own trade — ghostwriter, translator, an actor playing a part, a session musician on somebody else's record — that gets nearer the real complaint people have about moral deference, or is that complaint better stated with no analogy at all?
reasoning: |-
  Okay, the user is dealing with a complex character issue in their novel. Nadia relies entirely on her friend's moral judgments, and the agent calls her a "moral plagiarist," but another writer disagrees with that analogy. The user needs to figure out whether the plagiarism metaphor holds water and how to fix Nadia's character.

  First, I'll break down the plagiarism analogy. Plagiarism involves copying someone else's work and presenting it as your own. The manuscript represents the moral judgment itself. The byline is Nadia claiming the decision as her own. The audience being deceived would be other characters or the reader thinking Nadia arrived at the judgment independently. The craft is the friend's process of reasoning, and the handover is when he gives her the answer.

  Now, where does the mapping break? Moral judgments aren't tangible like manuscripts; they're internal. Nadia might not be intentionally deceptive—she could openly admit she consults her friend. The "audience" might not care as long as the outcome is right. Also, moral reasoning is about personal integrity, not public credit. These breaks weaken the plagiarism charge, especially the fraud aspect.

  The core issue seems to be that Nadia lacks moral engagement. She's not developing her own reasoning skills, which makes her passive and uninteresting. The agent's complaint is that Nadia reads flat because she's not actively grappling with dilemmas. The user needs to understand the underlying reasons: is it about lacking reasons, inability to adapt, or failure to take responsibility?

  Looking at alternative metaphors: ghostwriter captures the unseen labor but misses the deception. Translator emphasizes interpretation but Nadia might not be adding her own spin. Actor/session musician shows performance without ownership. These might work better than plagiarism, but each has limitations.

  The user probably wants Nadia to be a compelling character. They might need to show her internal conflict or growth. Maybe she starts questioning her reliance, faces a situation where the friend's advice doesn't fit, or has to defend a decision. The deeper need is to make Nadia dynamic, showing either her struggle or the consequences of outsourcing her morality.

  So, the plagiarism label doesn't fully hold due to key differences in tangibility and intent. The real problem is Nadia's passivity. The user should focus on why moral deference is problematic for character development—lack of agency, growth, and depth. Alternative metaphors like ghostwriter or actor could be used, but directly addressing Nadia's moral passivity without analogy might be most effective. The fix involves creating moments where Nadia must engage, making her active in her moral journey.
answer: |-
  Here's a thorough audit of the "moral plagiarist" analogy, breaking down its components, mapping, breaks, and core issues:

  **The Analogy Mapped:**

  1.  **The Manuscript:** The friend's specific moral judgment/decision for a particular situation. ("Don't pay the blackmailer," "Tell your sister the truth," "Quit that job").
  2.  **The Byline:** Nadia presenting the final *decision* and *action* (and often the *confidence* behind it) as her own. She claims authorship of the moral stance.
  3.  **The Audience Being Taken In:** Other characters (and potentially the reader, initially) believing Nadia arrived at this judgment through her own reasoning and conviction.
  4.  **The Craft:** The friend's lifetime of experience, reasoning skills, pattern recognition, ethical framework, and emotional intelligence that went into forming *his* judgment.
  5.  **The Moment of Handover:** The phone call where the friend gives Nadia the answer.
  6.  **The Fraud:** The deception inherent in claiming the product (the judgment) as her own creation when its true origin lies entirely elsewhere. It's presenting borrowed intellectual/ethical labor as original.

  **Where the Mapping Breaks (and Why Some Breaks Matter):**

  1.  **Tangibility vs. Ephemerality:** The manuscript is a fixed, tangible object. A moral judgment is an internal cognitive/emotional conclusion. **Break Significance: HIGH.** This is the core of your philosopher friend's objection. Plagiarism fundamentally relies on copying a *fixed expression*. Morality is about *process* and *internal justification*. This break weakens the core "theft of object" aspect.
  2.  **Intent to Deceive:** Plagiarism requires knowingly presenting someone else's work as your own. Does Nadia *intend* to deceive others about her process? Maybe not. She might openly say, "I asked Theo, he said X, so I'm doing X." **Break Significance: MODERATE-HIGH.** If she's transparent, the "fraud" element central to plagiarism largely vanishes. The "audience" isn't necessarily "taken in." The *problem* shifts to her dependence, not deception.
  3.  **Originality Requirement:** Plagiarism implies the *possibility* of original creation was bypassed by theft. Morality often involves applying shared principles. Is every moral judgment truly "original"? **Break Significance: MODERATE.** While principles are shared, the *application* to a specific context *does* involve original reasoning. Nadia bypasses *that* application.
  4.  **The "Audience" and Their Concern:** Readers of a plagiarized manuscript care about authenticity and credit. People affected by Nadia's actions care about the *outcome* and *accountability*. Does the shopkeeper she cheated care *who* told her not to cheat? He cares *that* she didn't cheat and *that* she can justify it. **Break Significance: MODERATE.** Shifts focus from "credit" to "accountability and justification."
  5.  **The Nature of the "Craft":** Writing craft produces a specific text. Moral reasoning produces a decision *and the capacity to defend, adapt, and live with it*. **Break Significance: HIGH.** Plagiarism steals the *product*. Nadia's issue is that she hasn't developed the *capacity* (skill, resilience, understanding). She only gets the product.

  **Which Breaks Matter for the Charge of Fraud?**

  *   **Crucial:** **Tangibility/Ephemerality** and **Intent to Deceive.** If the judgment isn't a "thing" to be stolen, and if Nadia isn't actively hiding her reliance on Theo, the core "fraudulent representation of origin" that defines plagiarism collapses. The "audience being taken in" becomes contingent on her secrecy.
  *   **Less Crucial for Fraud, More Crucial for the Underlying Problem:** The "Craft" break. The deeper issue isn't theft of a product, but the *lack of development of the internal capacity*. This is why she "reads flat."

  **The Real Defect(s) in Nadia (What "Plagiarist" Tries, But Fails, To Pinpoint):**

  Your agent is likely bundling valid concerns under an imperfect label. The "plagiarist" charge points towards these deeper issues:

  1.  **Lack of Internal Reasoning/Engagement (The Core Flatness):** Nadia isn't wrestling with the dilemma. She outsources the *struggle*, the most dramatically interesting part. Readers experience her as passive, unthinking, and emotionally disconnected from the moral weight of her choices. She doesn't *own* the process, so she can't *own* the decision emotionally or intellectually for the reader.
  2.  **Lack of Authentic Conviction:** Does she *believe* the judgment, or just trust Theo? If challenged, could she defend it beyond "Theo said so"? This lack of deep, personal conviction makes her choices feel hollow and her character uncompelling. Her "certainty" is borrowed, not earned.
  3.  **Inability to Adapt/Generalize (The "Slightly Different Case" Problem):** Theo gives answers for *this specific scenario*. If a morally analogous but situationally different problem arises, does Nadia have the tools to recognize the similarity and apply the principle? Or does she need to call Theo again? This highlights her lack of underlying ethical framework.
  4.  **Failure of Accountability (The "Answer to the Person She Hurt" Problem):** When her action (based on Theo's judgment) harms someone, offering "Theo told me to" is morally bankrupt. True moral responsibility requires being able to *justify* the choice based on reasons *she* understands and accepts. She cannot genuinely apologize or explain; she can only deflect blame. This makes her seem cowardly or immature.
  5.  **Stunted Moral Growth:** By never exercising her own judgment, she never learns, never refines her principles, never develops ethical resilience. She remains perpetually dependent, a moral child.

  **Does "Plagiarist" Carry the Weight?**

  *   **Verdict: Mostly No.** The analogy is provocative and captures the *feeling* of inauthenticity and outsourcing, but its core mechanics (theft of a fixed object, intentional deception) don't cleanly map onto moral deference. The breaks (especially tangibility and intent) are too significant. It risks sounding like a clever insult rather than a precise diagnosis.
  *   **What it *does* usefully convey:** The sense that she's claiming credit (internally or externally) for intellectual/ethical labor she didn't perform. The hollowness of presenting a conclusion without the supporting structure.

  **Better Analogies (From Your Own Trade & Beyond):**

  1.  **Ghostwriter:** This is **stronger**. Theo does the heavy intellectual lifting (the reasoning), Nadia "publishes" the decision under her name. It captures the outsourcing of labor and the potential for inauthenticity. **Key Improvement:** It doesn't require *theft* or *deception* (a ghostwriter arrangement can be acknowledged), shifting focus to the *lack of original creation* and the *potential hollowness* for the "author" (Nadia) if the words (judgments) aren't truly hers. It directly addresses the "flatness" – a ghostwritten autobiography often lacks the raw authenticity of a self-written one.
  2.  **Translator:** Nadia takes Theo's "language" (his reasoning) and "translates" it into action. **Useful if:** She slightly interprets or filters his advice through her own lens/feelings. **Limitation:** If she's just parroting him verbatim, it's less translation, more transcription.
  3.  **Actor Playing a Part:** Nadia is performing the *role* of a morally decisive person, reciting lines (Theo's judgments) written by someone else. **Captures:** The performative aspect, the disconnect between the external action and internal conviction. **Useful for:** Highlighting the inauthenticity. **Downside:** Might imply more conscious deception than exists.
  4.  **Session Musician:** Nadia provides the technical execution (the action) to Theo's composition (the judgment). **Captures:** Skillful execution of someone else's vision, lack of creative ownership. **Limitation:** Downplays the moral weight; music performance is interpretive, moral action needs justification.
  5.  **Ventriloquist's Dummy:** Theo is the ventriloquist, Nadia is the dummy speaking his words. **Captures:** The complete lack of agency, the eerie disconnect. **Useful for:** Emphasizing passivity and control. **Downside:** Very dehumanizing, probably too extreme unless Theo is manipulative.

  **The Best Approach: State the Complaint Directly (Often)**

  The core problem is **Moral Passivity** or **Ethical Dependence**. The analogies are useful tools, but the most powerful description might be direct:

  *   "She outsourced her conscience."
  *   "Her moral compass was permanently set to 'Theo'."
  *   "She acted with borrowed conviction."
  *   "She performed the judgment without understanding the score."
  *   "She was an executor, not a deliberator."

  **How to Fix Nadia & Use the "Plagiarism" Line (If You Choose):**

  1.  **Make the Charge Explicit (Carefully):** If another character calls her a "moral plagiarist," **contextualize it immediately.** Show *why* they say it and what *they* mean by it. Have them unpack it:
      *   "You take his conclusions like finished products and slap your name on them! You don't do the work, Nadia. You don't sweat the choices, you just dial Theo and print out his answer as your own. It's fraudulent!"
      *   This exposes the speaker's perspective (frustration with her passivity, inauthenticity) and acknowledges the provocative nature of the term.
  2.  **Force Nadia to Confront the Dependence:** The story needs to break this pattern. Options:
      *   **Theo is Unavailable/Unreachable:** She *has* to decide alone.
      *   **Theo is Wrong:** His advice leads to a bad outcome, forcing her to reckon with blind trust.
      *   **A Novel Dilemma:** She faces a situation Theo has no experience with or where his principles seem inadequate/inapplicable.
      *   **Demand for Accountability:** Someone she hurts demands *her* reasons, not Theo's. "Why did *you* think this was right?"
      *   **Theo Challenges Her:** "Why do you keep calling me, Nadia? What do *you* think you should do?" or "You need to start trusting your own judgment."
  3.  **Show the Internal Cost (or Lack Thereof):** Does her dependence cause her internal conflict (guilt, shame, feeling like a fraud)? Or is she entirely comfortable with it? The former is more dramatically interesting and shows self-awareness; the latter risks making her truly unsympathetic unless challenged. Show the *hollowness* she feels (or others perceive) when she acts without conviction.

  **Bottom Line:**

  The "moral plagiarist" analogy is a vivid but flawed metaphor. It points accurately to the *inauthenticity* and *outsourcing* that make Nadia feel flat but stumbles on the mechanics of plagiarism itself. **"Ghostwriter" is a significantly better fit from your trade.** However, the most precise way to diagnose the problem is directly: **Nadia suffers from profound moral passivity and dependence, avoiding the essential work of ethical engagement and failing to develop her own capacity for judgment and conviction.** This passivity is the root cause of her flatness. Use the "plagiarism" line if you wish, but ensure its meaning *in context* is clear, and focus the narrative fix on forcing Nadia out of her dependent state and into the messy, challenging, but character-defining arena of making her own moral calls.
