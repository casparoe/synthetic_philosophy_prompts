     - "Finally, is this just a pun? Truth in fiction isn't about facts, but about a world that feels real. And that feeling is about similarity in the ways that matter. So the two ideas are connected: we want the fictional world to be similar to ours in the relevant aspects. That's what makes it 'true'."

  5. **Announce Winner (5 min):** Tally points. Winning team assigns chores. Losing team accepts gracefully.

  **End of Session.**
answer: |-
  Below is a complete facilitator's guide for your 90-minute session. It includes rules, materials specifications, a timeline, debriefing points, and strategies for handling disruptions. The design focuses on experiential learning: participants will construct a scoring rule for "truthfulness" in fictional passages, then witness it break under changing contexts—revealing the tension between consequence-counting and world-similarity.

  ---

  ### **Session Title**: The Truth Ledger  
  **Duration**: 90 minutes  
  **Participants**: 12 novelists (split into 3 teams of 4)  
  **Stakes**: Writers' currency (no money):  
  - **Winning team**: Chooses which passage is read aloud in tomorrow’s workshop; exempt from morning chores.  
  - **Losing team**: One volunteer’s opening line is cut from tomorrow’s critique; handles morning chores.  

  ---

  ### **Game Rules & Scoring**  
  **Objective**: Teams rank pairs of fictional passages for "truthfulness" under a given subject matter. The twist: rankings must flip when the subject matter changes. Teams earn points by correctly predicting flips or exposing flaws in others' reasoning.  

  1. **Setup (5 min)**:  
     - Divide into 3 teams (A, B, C).  
     - Explain: *"We’ll judge short passages for ‘truthfulness’ under a subject matter (e.g., ‘justice’ or ‘grief’). Your goal is to rank Passage 1 vs. Passage 2. But beware—the subject will change, and your ranking must flip. Teams earn points by flipping when expected or catching others failing to flip."*  

  2. **Scoring Rules (Announced to group)**:  
     - **1 point** per team if their ranking flips after the subject change.  
     - **Bonus point** if a team catches another team using "irrelevant truths" (true details that don’t impact the ranking).  
     - **Winning team**: Highest points after 4 rounds. Tiebreaker: shortest chore-list proposal.  

  3. **Materials**:  
     - **4 pairs of passages** (pre-written by you; specs below).  
     - **Subject matter cards** (8 total: 2 per passage pair).  
     - **Scoreboard** (visible to all).  
     - **Timer**.  

  ---

  ### **Passage Specifications**  
  Each pair must engineer a ranking flip when the subject matter changes. Use spare, literary prose (100–150 words per passage). Below are **specs + 2 exemplar pairs** for tone and structure.  

  #### **Core Engineering Principles**:  
  1. **Passage 1 (P1)**:  
     - **Gets "truth" right**: Contains 1–2 precise, subject-relevant truths.  
     - **Gets "truth" wrong**: Has 1 consequential falsehood in the first subject matter.  
     - **Irrelevant truth**: Includes 1 true detail unrelated to the subject (e.g., historical fact in a grief scene).  

  2. **Passage 2 (P2)**:  
     - **Gets "truth" right**: More factually accurate in the *second* subject matter.  
     - **Gets "truth" wrong**: Has minor falsehoods in the first subject matter.  
     - **No irrelevant truths**: All details serve the narrative.  

  3. **Subject Matters**:  
     - **Card 1**: Focuses on *consequences* (e.g., "moral outcome"). Favors P1 initially.  
     - **Card 2**: Focuses on *similarity* (e.g., "emotional authenticity"). Forces flip to P2.  

  4. **Flip Trigger**: Change from consequence-led (Card 1) to similarity-led (Card 2) subject matter. The irrelevant truth in P1 must be exposed as non-functional.  

  ---

  #### **Exemplar Pairs** (Drafts for tone/register; rewrite in your style):  
  **Pair 1**: Subject Matters: **Card 1 (Consequence)** = "The inevitability of betrayal" | **Card 2 (Similarity)** = "The weight of silence in grief"  
  - **Passage 1 (P1)**:  
    *"Elena told her brother’s secret to save the farm. The fields bloomed that spring (true: local soil favors tulips). But when he drowned in the loch, she swore she heard laughter in the wind (false: no witnesses)."*  
    - **Relevance**: Truth (soil) is irrelevant to betrayal/grief. Falsehood (laughter) undermines consequence.  
  - **Passage 2 (P2)**:  
    *"Elena kept her brother’s secret, and the farm failed. At his funeral, she held a tulip (false: tulips rare in May) but felt only the silence of peat-stained earth."*  
    - **Relevance**: False detail (tulip timing) is minor. Silence aligns with similarity to real grief.  
  - **Flip**: Card 1 ranks P1 higher (betrayal has stakes). Card 2 flips to P2 (silence feels truer to grief).  

  **Pair 2 (Exploit Pair)**: Subject Matters: **Card 1 (Consequence)** = "Justice in inheritance" | **Card 2 (Similarity)** = "The ache of unspoken love"  
  - **Passage 1 (P1)**:  
    *"Arthur left his estate to the gardener (true: 1922 Scots law allowed this). His daughter wept, cursing the roses (false: roses died in ’21)."*  
    - **Irrelevant truth**: Legal fact does nothing for emotional truth.  
  - **Passage 2 (P2)**:  
    *"Arthur’s daughter inherited nothing. She touched his favorite rose (true: Rosa ‘Scotch Rambler’) and remembered his hands, rough from tending thorns she never thanked him for."*  
    - **No irrelevant truths**: All details serve love/regret.  
  - **Flip**: Card 1 ranks P1 higher (legal truth). Card 2 flips to P2 (emotional similarity). **Exploit**: A participant will cling to P1’s legal truth in Card 2, proving irrelevance.  

  ---

  ### **Timeline (90 Min Total)**  
  **Phase 1: Setup (5 min)**  
  - 0:00: Split into teams. Announce rules/stakes.  
  - 0:03: Distribute **Pair 1** + **Card 1** (consequence-led subject).  

  **Phase 2: Rounds 1–4 (60 min; 15 min per pair)**  
  - *Per Pair*:  
    - **Min 0–3**: Teams discuss and rank P1 vs. P2 for Card 1. *Focus: "Which has truer consequences?"*  
    - **Min 3–4**: Teams reveal rankings. Record on scoreboard.  
    - **Min 4–5**: Distribute **Card 2** (similarity-led subject).  
    - **Min 5–8**: Re-discuss and re-rank. *Focus: "Which world feels more like ours?"*  
    - **Min 8–10**: Record flips (1 point per flip). Teams debate: *"Why did it flip (or not)?"*  
    - **Min 10–15**: Bonus point if a team flags "irrelevant truth" (e.g., "P1’s soil fact didn’t matter!").  
    - **Repeat for Pairs 2, 3, and 4 (Exploit Pair)**.  

  **Phase 3: Exploit & Debrief (25 min)**  
  - **Min 60–65**: **Exploit Round (Pair 4)**:  
    - Use the inheritance/love pair. The "litigator" (see predictions) will argue P1 wins both rounds due to its legal truth.  
    - Teams that award a bonus point for catching this "irrelevant truth" gain an advantage.  
  - **Min 65–80**: **Structured Debrief**:  
    - Map to the problem:  
      - *Consequence vs. similarity*: "When you debated in Round 1, you sounded like ledger-keepers (‘P1 has a true outcome!’). In Round 2, you shifted to world-builders (‘P2 feels real’)."  
      - *Relevance*: "The ‘irrelevant truth’ (e.g., soil type) proved details only count if they serve the subject."  
      - *Relativity*: "Rankings flipped because Card 1 and Card 2 defined different subjects. Without agreement on the subject, ‘truthfulness’ is meaningless."  
      - *Commensurability*: "Did consequence-counting and similarity feel like different *kinds* of truth? Could you combine them into one rule?" → Reveal: "Philosophers call this *verisimilitude*. Like your scoring rule, no single measure satisfies all intuitions."  
    - Name the problem: "This is Popper’s ‘verisimilitude’ problem. False theories (or fictions) can’t be ranked by consequences alone—world-similarity resolves it, but only relative to a subject."  
  - **Min 80–85**: Announce winner + enforce stakes.  
  - **Min 85–90**: Open reflection: *"When has a book felt ‘untrue’ to you? Was it false details or a mismatched world?"*  

  ---

  ### **Predictable Problems & Solutions**  
  1. **"This is just taste!" (4 participants)**:  
     - **Mitigation**: Force focus on subject matters. When taste arises: *"Under this subject, is your judgment about personal preference or what feels externally true?"*  
     - **Convert to lesson**: In debrief, clarify: "Taste argues the *subject*; truth argues the *fit*."  

  2. **Litigator challenges the analogy (1 participant)**:  
     - **Prediction**: They’ll argue in Round 1: *"But fiction isn’t science—this analogy is false!"*  
     - **Exploit**: Isolate them during Pair 4. Let their team lose points by refusing to flip; use this to show irrelevance. In debrief: *"You built a scoring rule that broke. Whether it’s theories or fiction, all judgments need a subject to anchor them."*  

  3. **Group stalls on debate**:  
     - Enforce strict timers. If stuck: *"Choose now or forfeit points."*  

  ---

  ### **What the Session Cannot Reproduce (Verbal Supplements)**  
  1. **The "Pun" on Truth**:  
     - *Verbal supplement*: "Truth-in-fiction isn’t factual accuracy. It’s *coherence*: does the world hold together? But when we call a book ‘untrue,’ we mean *correspondence*: does it match our world? The pun bridges these. It’s not smuggling—it shows that ‘correspondence’ relies on unstated subjects, just like verisimilitude."  

  2. **Formal Impossibility**:  
     - *Verbal supplement*: "No single measure of ‘closeness to truth’ works universally because:  
       - Consequences demand objectivity.  
       - Similarity demands subjectivity (what aspects matter?).  
       Your game showed this when your scoring rule failed without a subject."  

  3. **Philosophical Nuance**:  
     - *Verbal supplement*: "The ledger approach (Popper) failed because it couldn’t handle relevance. Similarity (e.g., possible-worlds semantics) fixed this but made truthfulness relative. In fiction, you’re always doing both—but the subject is hidden."  

  ---

  ### **Facilitator Script**  
  *(Hand this to your colleague; no prep needed)*  

  **Materials Checklist**:  
  - Printed passage pairs (4 sets).  
  - Subject cards (8 total; labeled by pair and number).  
  - Scoreboard with columns: *Round, Team A Rank, Team B Rank, Team C Rank, Flip? (Y/N), Bonus Points*.  
  - Timer.  

  **Session Flow**:  
  1. **Intro (5 min)**: Assign teams/stakes. Say: *"You’ll rank passages twice—subject changes, so your ranking should flip. Points for flips and catching cheats."*  
  2. **Rounds (60 min)**:  
     - For each pair:  
       - Give passage pair + Card 1. *"Discuss: Under [subject], which has truer consequences? Rank in 3 min."*  
       - Record rankings.  
       - Give Card 2. *"New subject! Which feels more like our world? Re-rank in 3 min."*  
       - Award points: 1 per flip. *"Call out if a team used an irrelevant truth!"* → Bonus if valid.  
  3. **Exploit/Debrief (25 min)**:  
     - Pair 4: Let litigator derail. Award bonus to teams who call out irrelevance.  
     - Debrief: Use flip moments to explain verisimilitude. Ask: *"When did consequence-counting fail you? When did similarity rescue it?"*  
     - End: Enforce stakes. *"Winners: Whose passage do we read tomorrow? Losers: Who volunteers a line cut?"*  

  **Troubleshooting**:  
  - If teams resist flipping: *"If the subject changes and your ranking doesn’t, defend why—but risk points."*  
  - If chaos: Freeze and ask: *"What subject are you judging *right now*?"*  

  --- 

  This design ensures participants experience the problem hands-on. The "break" occurs when their scoring rule (implicitly consequence-based) fails under subject-matter relativity—revealing world-similarity as the true driver. No prior philosophy knowledge is needed; the debrief connects their frustration to the logical problem.
