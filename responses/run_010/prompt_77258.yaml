prompt: |-
  I'm auditing a grad formal epistemology seminar this term (not for credit, I just like showing up) and this week is imprecise credences, and honestly I've gotten more confused by the readings than helped. The thing I can't shake is the dilation objection, and I'd rather get a proper argued-out essay on it than another summary of the landscape. So: write me an essay on whether dilation is a genuine reductio against allowing imprecise credences at all, or whether it's a feature that people are misreading as a bug. Around 1500-1800 words, prose, no headers needed if you don't want them, and please don't bother with citations or a reading list — I have the papers, what I need is the argument.

  Here's the case as I've reconstructed it for myself, feel free to use it or fix it up if you think I've botched something. A stranger on the street offers to flip a coin for you. Let H be "the coin comes up heads" and E be "the stranger is left-handed," and suppose you're as confident as you can be that E is fifty-fifty — you've nothing to go on, but there's no reason to think otherwise. Your evidence about how the flip will go is a grab bag: maybe she's a sleight-of-hand artist who can force heads whenever she's left-handed and tails whenever she isn't; maybe she's the exact mirror image of that; maybe she's totally ordinary with a fair coin, so her handedness is irrelevant; or maybe she's anything in between — say she forces heads with probability x when left-handed and 1−x when right-handed, for x anywhere in [0,1], and you can't guess at which x. So conditional on E, and conditional on not-E, your credence in H runs the full range from 0 to 1. But check the marginals: in every one of those hypotheses, P(H) = x·(1/2) + (1−x)·(1/2) = 1/2. So before anyone tells you anything about her hands you are perfectly, exactly confident that the coin lands heads with probability 1/2, and the moment somebody mentions that she's left-handed that confidence evaporates into total ignorance. Free information makes you worse off, epistemically speaking. That's the whole objection in miniature, right?

  What I want the essay to actually grapple with:

  - The decision-theoretic complaint — that an agent like this will refuse free information, or even pay to not be told whether E. Does that really follow in the coin case, or does it need extra assumptions about how imprecise credences get turned into choices (E-admissibility vs maximality vs whatever)? I suspect it does need them and I'd like to know how much.
  - Whether the sharp Bayesian is actually better off here. To stay undilated she has to land on P(H|E) = P(H|not-E) = 1/2, which amounts to assuming the handedness and the flip are probabilistically independent. Where does that assumption come from? Is it knowledge she has that the imprecise agent lacks, or is it just tidiness with better press?
  - I have a vague memory of a technical condition — something like conglomerability of the credal set with respect to the partition — being offered as a way to rule dilation out. I'm fuzzy on whether that's a real result or folklore, so treat it as a hypothesis: does imposing it rescue imprecise Bayesianism, or does it sneak sharpness back in through the side door?
  - Whether dilation should even worry us when it changes no decisions. If the interval blows up but still straddles exactly the same choices, has the agent lost anything she could have used? And if the answer is "only epistemic value," say what that value is supposed to be and why it's the kind of thing that can be damaged by learning E.
  - The thing sitting underneath all of it: uniqueness versus permissivism about what your evidence requires. I don't think you can settle the dilation question without taking a position there, so take one.

  And please land somewhere. "It depends how you think about evidence" is the answer I'm already braced for from the seminar and it's the one thing I don't want back. Give me a verdict, say what would have to be true for the other side to win, and if you think my coin case is a bad instance of dilation — maybe the marginal shouldn't be sharp, or the x-family is rigged — say so and rebuild it, but still tell me which way you'd bet on the general question. Thanks!
