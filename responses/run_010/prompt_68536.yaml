  My friend and I had a two-hour arguement last night about divine hiddenness and neither of us budged, so I want to run it through a film we both love: Bergman's Winter Light (1963). Read it against the Schellenberg-style non-resistant nonbelief argument -- the claim that a perfectly loving God wouldn't allow anyone genuinely open to a relationship with him to be without belief, since belief is a precondition of that relationship.

  What got us stuck is that Tomas isn't an ordinary unbeliever. He's a pastor who's been going through the motions for years, and at the end he holds the three o'clock service to a near-empty church anyway. When Algot the sexton floats the idea that the worst part of the Passion wasn't the physical pain but God not answering from the cross, Tomas just says yes. So which box is he in: non-resistant nonbeliever, believer whose God has gone missing, or something the taxonomy has no slot for? And is the hiddenness here God's policy or Tomas's own doing -- his coldness to Jonas and Märta, the Lisbon story he tells Jonas? His declaration that he's finally free is followed almost immediately by a suicide, which seems like the film making a point rather than a coincidence.

  Does the empty-church ending undercut the premise that belief is necessary for relationship with God, or does it quietly concede it? Be fair both ways: say where my framing strains the film, and where the film says something the hiddenness debate -- including the soul-making and religious-ambiguity replies -- misses.

  Lead with your bottom line in the first sentence, one sentence saying wether the film vindicates or embarrasses the argument, then give the reasoning. No preamble, don't restate my question.
