  ### **Question Paper**  
  **Environmental Regulation and Political Economy**  
  **Fellowship Written Assessment**  
  *Time allowed: 2 hours. Closed book. Citations earn no credit and will be ignored.*  

  ---

  #### **Definitions Box**  
  1. **State**: A possible outcome for society. *E.g., "Tree removed or not."*  
  2. **Individual strict preference ordering**: Each person ranks all states from best to worst, with no ties. *E.g., "A prefers no removal to removal."*  
  3. **Social ranking**: Society’s complete and transitive ordering of states. *E.g., "If society ranks X above Y and Y above Z, it must rank X above Z."*  
  4. **Unrestricted domain**: Society must rank states for any possible individual preferences. *E.g., "No matter what people want, society must decide."*  
  5. **Pareto condition**: If everyone prefers state X to Y, society must rank X above Y. *E.g., "Unanimous preferences must be respected."*  
  6. **Liberal condition**: Each person is decisive (protected) over at least one pair of states. *E.g., "Your choice decides between two options in your domain."*  

  ---

  #### **Case**  
  Two neighbours, A and B, have ash trees infested by invasive beetles.  
  - Let \(x = 0\) if A leaves her tree standing, \(x = 1\) if removed.  
  - Let \(y = 0\) if B leaves his tree standing, \(y = 1\) if removed.  
  - A state is written \((x, y)\).  

  **Preferences**:  
  - A ranks: \((0,0) > (1,0) > (1,1) > (0,1)\)  
  - B ranks: \((1,1) > (1,0) > (0,1) > (0,0)\)  
  - C (tree board chair) ranks: \((1,1) > (1,0) > (0,0) > (0,1)\)  

  **Protected rights under town charter**:  
  - A is protected over pairs \(\{(0,0), (1,0)\}\) and \(\{(0,1), (1,1)\}\).  
  - B is protected over pairs \(\{(0,0), (0,1)\}\) and \(\{(1,0), (1,1)\}\).  

  ---

  #### **Part (a) [4 marks]**  
  The town solicitor rules that C is *also* protected over A’s pair \(\{(0,0), (1,0)\}\) because beetles are confirmed on A’s lot. Show that no complete and transitive social ranking can satisfy the liberal condition for A, B, and C together. State which conditions from the definitions box are and are not used.  

  #### **Part (b) [8 marks]**  
  C’s authority is struck down; the liberal condition now binds only A and B. Derive the social ranking forced by the conditions. Show it cannot be transitive. Precisely where does the Pareto condition enter the derivation of the cycle? Would the cycle persist without it?  

  #### **Part (c) [8 marks]**  
  A rival interpretation treats rights as control over one’s own choice (not social decisiveness). A and B pick \(x\) and \(y\) simultaneously, each choosing their best action given the other’s choice. The social outcome is the resulting \((x,y)\).  
  - What outcome occurs? Is it unique?  
  - Is it Pareto-efficient?  
  - What condition from the definitions box is abandoned?  
  - What is A’s protected right actually worth to her at this outcome?  

  #### **Part (d) [5 marks]**  
  In ≈200 words, write a sidebar for a general-interest magazine explaining what this exercise reveals about "rights-talk" in policy disputes. **Do not use:** state, preference ordering, social ranking, domain, Pareto, liberal, transitive, or formal terms.  

  ---

  ---

  ### **Model Answer**  
  **Part (a)**  
  With C protected over \(\{(0,0), (1,0)\}\):  
  - A prefers \((0,0)\) to \((1,0)\), so society must rank \((0,0) > (1,0)\) (A’s liberal right).  
  - C prefers \((1,0)\) to \((0,0)\) (from C’s ranking), so society must rank \((1,0) > (0,0)\) (C’s liberal right).  
  Contradiction: Society cannot rank \((0,0) > (1,0)\) and \((1,0) > (0,0)\).  
  **Conditions used**: Liberal condition (decisiveness) and completeness of social ranking.  
  **Conditions not used**: Pareto, unrestricted domain, transitivity.  

  **Part (b)**  
  Liberal condition for A and B only:  
  - A’s rights:  
    - Over \(\{(0,0), (1,0)\}\): A prefers \((0,0) > (1,0)\) → society ranks \((0,0) > (1,0)\).  
    - Over \(\{(0,1), (1,1)\}\): A prefers \((1,1) > (0,1)\) → society ranks \((1,1) > (0,1)\).  
  - B’s rights:  
    - Over \(\{(0,0), (0,1)\}\): B prefers \((0,1) > (0,0)\) → society ranks \((0,1) > (0,0)\).  
    - Over \(\{(1,0), (1,1)\}\): B prefers \((1,1) > (1,0)\) → society ranks \((1,1) > (1,0)\).  

  Pareto condition:  
  - All prefer \((1,0) > (0,1)\):  
    - A: \((1,0) > (0,1)\) (A’s ranking: \((1,0)\) 2nd, \((0,1)\) 4th).  
    - B: \((1,0) > (0,1)\) (B’s ranking: \((1,0)\) 2nd, \((0,1)\) 3rd).  
    - C: \((1,0) > (0,1)\) (C’s ranking: \((1,0)\) 2nd, \((0,1)\) 4th).  
  → Society must rank \((1,0) > (0,1)\).  

  **Cycle derivation**:  
  1. Society ranks \((0,1) > (0,0)\) (B’s right).  
  2. Society ranks \((0,0) > (1,0)\) (A’s right).  
  → By transitivity, \((0,1) > (1,0)\) [from 1 and 2].  
  3. But society ranks \((1,0) > (0,1)\) (Pareto).  
  Contradiction: \((0,1) > (1,0)\) and \((1,0) > (0,1)\).  

  **Pareto’s role**: The cycle depends on Pareto. Without it, steps 1 and 2 give \((0,1) > (0,0) > (1,0)\), but no ranking is forced between \((0,1)\) and \((1,0)\), so no cycle.  

  **Part (c)**  
  - **Outcome**: A and B choose simultaneously:  
    - B’s dominant strategy: Always choose \(y=1\) (if A sets \(x=0\), B prefers \((0,1) > (0,0)\); if A sets \(x=1\), B prefers \((1,1) > (1,0)\)).  
    - Given \(y=1\), A chooses \(x=1\) (prefers \((1,1) > (0,1)\)).  
  → Unique outcome: \((1,1)\).  
  - **Pareto-efficient?** Yes. No state is unanimously preferred to \((1,1)\):  
    - \((0,0)\): A prefers it, but B and C prefer \((1,1)\).  
    - \((1,0)\): A prefers it, but B and C prefer \((1,1)\).  
    - \((0,1)\): All prefer \((1,1)\).  
  - **Abandoned condition**: Social ranking (completeness and transitivity). Rights now mean control over actions, not social decisiveness.  
  - **Worth of A’s right**: At \((1,1)\), A gets her third-best state. Without the right to choose \(x\), if (e.g.) \(x=0\) were forced, B would still choose \(y=1\), yielding \((0,1)\)—A’s worst state. A’s right improves her outcome from worst to third-best.  

  **Part (d)**  
  Rights are central to policy debates, but this exercise reveals pitfalls. When three parties each get a "veto" over choices (like tree removal), society may have no consistent way to rank options—rights clash.  

  Dropping one party’s veto avoids deadlock but creates cycles: Individual freedoms and unanimous preferences force contradictory rankings. Here, beetles spread regardless.  

  A practical fix: Let each control their own tree. Both remove trees, yielding a clean outcome. This respects autonomy but sacrifices a "socially best" ranking. It is efficient yet leaves one neighbor worse off.  

  The lesson? Rights framed as personal control avoid logical traps but may override minority preferences. In environmental conflicts, this trade-off is unavoidable: Rights-talk must define *how* choices interact, not just assert freedoms.  

  ---

  ### **Marking Scheme (25 marks total)**  
  **Part (a) [4 marks]**  
  - **2 marks**: Show contradiction from A and C’s decisiveness over \(\{(0,0),(1,0)\}\).  
  - **1 mark**: Correctly identify liberal condition and completeness as used.  
  - **1 mark**: Correctly state Pareto/unrestricted domain not used.  
  - *Penalize*:  
