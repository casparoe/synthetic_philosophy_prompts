  - **2 marks**: Identify Pareto forces \((1,0)\!>\!(0,1)\).  
  - **2 marks**: Show cycle: \((0,1)\!>\!(0,0)\!>\!(1,0)\) and \((1,0)\!>\!(0,1)\).  
  - **2 marks**: State Pareto is necessary for cycle; without it, no cycle (only \((0,1)\!>\!(0,0)\!>\!(1,0)\)).  
  - *Penalize*:  
    - −2 if cycle derived without Pareto.  
    −1 per missing/incorrect ranking.  
    −1 if Pareto’s role misstated.  

  **Part (c) [8 marks]**  
  - **1 mark**: Correct outcome \((1,1)\).  
  - **1 mark**: State uniqueness (yes).  
  - **2 marks**: Prove Pareto-efficiency (no unanimously preferred state).  
  - **2 marks**: Abandoned: Social ranking (completeness/transitivity).  
  - **2 marks**: A’s right worth: Avoids \((0,1)\) (worth = improvement to third-best).  
  - *Penalize*:  
    −1 if outcome wrong.  
    −1 if efficiency not checked.  
    −2 if "social ranking" not identified as abandoned.  
    −1 if value of A’s right unclear.  

  **Part (d) [5 marks]**  
  - **1 mark**: Highlights rights-clash deadlock (e.g., Part (a)/(b)).  
  - **1 mark**: Notes practical solution (Part (c)) avoids deadlock.  
  - **1 mark**: Discusses trade-offs (e.g., autonomy vs. preferences).  
  - **1 mark**: Accessible language (no technical terms).  
  - **1 mark**: Concise (≈200 words), engaging policy insight.  
  - *Penalize*:  
    −1 per technical term used.  
    −1 if only describes case without lesson.  

  ---

  **Verification Note**:  
  - Part (a): Contradiction verified (no Pareto needed).  
  - Part (b): Cycle verified; vanishes without Pareto.  
  - Part (c): Unique Nash equilibrium \((1,1)\) verified.
