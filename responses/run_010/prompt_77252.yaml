prompt: |-
  Next week I run a fifty-minute section on the St Petersburg paradox for first-year philosophy students. They can compute an expected value but have no measure theory, and in week nine they meet Savage's axioms, so my section has to leave them able to say what problem those axioms are meant to fix. What I want from you is the design of the explanation, not the explanation itself.

  Set out the sequence and its dependencies — in particular, whether the divergence of the expectation should be established on the board before I ask what they would pay to play, or after, and what is lost either way. Choose the single version of the game that ought to carry the section, and say what it must contain and what it must not: I have been toying with a capped variant, and I need to know whether the cap belongs in the carrying case from the outset or should arrive late as a complication. Then map the points at which students will believe the difficulty has been removed when it has not — I expect some version of 'it only shows that people are hopeless with large numbers', 'take logarithmic utility and you are done', and 'no payer has unlimited resources, so there was never a puzzle' — and place an intervention at each. The crux I care about most is that the diminishing-marginal-utility move and the claim that any acceptable utility function must be bounded above are two different moves, and students will fuse them into one; order things so that they cannot.

  Finish with a single question I can put to the room that would reveal whether they now see a problem for the theory of expected value rather than for gamblers' prices, and list what I should leave out at this level and announce that I am leaving out. Please write in British English.
reasoning: |-
  Hmm, the user is designing a teaching session on the St. Petersburg paradox for first-year philosophy students. They need a structured sequence that prepares students for Savage's axioms later in the course, focusing on conceptual clarity rather than mathematical rigor. 

  Key constraints: students can compute basic expected value but lack measure theory. The core tension is between establishing infinite expectation upfront versus eliciting intuitive pricing first. The cap variant dilemma is central—introducing it early might undermine the paradox but delaying it risks muddying the conceptual waters. 

  Three student misconceptions need preemptive strikes: 
  1. The "human innumeracy" deflection (addressed by showing consistent rational pricing below infinity) 
  2. The logarithmic utility as silver bullet (must clarify this doesn't resolve the mathematical divergence) 
  3. Finite resources as sufficient explanation (requires distinguishing practical from theoretical failure)

  The critical insight is separating two distinct arguments: 
  - Diminishing marginal utility (descriptive) 
  - Bounded utility necessity (normative, for coherence)

  The reveal question should force recognition that the paradox breaks expected value theory itself. Omissions must be explicit: measure theory, probability foundations, and historical solutions like Buffon's experiments. 

  British English phrasing checks: "maths" not "math", "£" symbol, "whilst" for "while".
answer: |-
  Here’s a structured sequence for your fifty-minute section, prioritising conceptual clarity for Savage’s axioms and avoiding student conflation of key moves. British English maintained throughout.

  ### Core Game Selection
  - **Carrying Case**: Use the **uncapped, infinite expectation St. Petersburg game** as the primary vehicle.  
    - **Must contain**:  
      - Payoff starts at £2, doubles each time heads appears (Tails on first toss: £2; Heads then Tails: £4; H,H,T: £8, etc.).  
      - Explicitly state the probability of payoff £\(2^k\) is \( \frac{1}{2^k} \).  
    - **Must not contain**: A cap at this stage. Introducing a cap prematurely masks the mathematical pathology Savage’s axioms address.  

  ### Sequence & Dependencies  
  1. **Elicit Intuition First (8 mins)**  
     - *Question to room*: "Suppose I offer this game. What’s the most you’d pay to play it? £10? £50? £1000? Why?"  
     - **Purpose**: Surface real-world disjunction between intuition and theory. Students typically offer £2–£20. *Loss if deferred*: Students anchor on infinite expectation and dismiss pricing as "irrational" later.  

  2. **Compute Expectation on Board (10 mins)**  
     - Derive \( E = \sum_{k=1}^{\infty} (2^k \cdot \frac{1}{2^k}) = \sum_{k=1}^{\infty} 1 = \infty \).  
     - **Dependency**: Must follow step 1. If done first, students disengage ("obviously no one pays infinity"). *Loss*: They miss the *normative* force of the paradox—why *shouldn’t* rational agents pay huge sums?  

  3. **Paradox Statement (2 mins)**  
     - "The expected value is infinite, yet no one pays large sums. Is this a failure of human intuition or of expected value theory?"  

  4. **False Resolution 1: "People Ignore Tiny Probabilities" (5 mins)**  
     - *Student belief*: "We can’t grasp 1/1024 odds, so we underpay."  
     - **Intervention**: Calculate expected value truncated at £1 million cap (≈£20). Ask: "Would you pay £15? Why not?" *Reveal*: Even with tractable numbers, offers remain low. The problem isn’t computational.  

  5. **Introduce Capped Variant as Complication (10 mins)**  
     - *Now* add: "Suppose the casino caps payouts at £\(2^{40}\) (≈£1 trillion)."  
     - Compute \( E_{\text{capped}} = \sum_{k=1}^{40} 1 = 40 \).  
     - *Contrast*: "Would you pay £39? If not, why does capping ‘solve’ nothing for you?"  
     - **Purpose**: Shows divergence isn’t the core issue; even finite expectations feel "too high".  

  6. **False Resolution 2: "Logarithmic Utility Fixes Everything" (7 mins)**  
     - *Student belief*: "Diminishing marginal utility (log) gives finite \( E[u(X)] \), so paradox resolved."  
     - **Intervention**:  
       - Acknowledge \( E[\log_2(X)] = \sum_{k=1}^{\infty} \log_2(2^k) \cdot \frac{1}{2^k} = \sum_{k=1}^{\infty} k \cdot \frac{1}{2^k} = 2 \).  
       - *Pivot*: "But is this *why* you offered £10 earlier? Or are you now rationalising?"  
       - **Crucial distinction**: Log utility describes risk aversion; it doesn’t explain why *unbounded* utility leads to incoherence.  

  7. **False Resolution 3: "No One Has Infinite Wealth" (5 mins)**  
     - *Student belief*: "The paradox assumes unrealistic resources."  
     - **Intervention**: Pose: "Suppose the UK Treasury backs the game. Would you mortgage your future to play? If not, is ‘finite resources’ the *principle* here?"  
     - *Reveal*: The payer’s bankruptcy isn’t the issue—it’s that expected value *theory* mandates indefensibly high bids.  

  ### Preventing Conflation of Two Moves  
  - **Order to avoid fusion**:  
    1. Discuss log utility *only* as descriptive (why people underpay).  
    2. **Later** (post-Savage, but foreshadow): "To *systematise* rationality, we might need bounded utility to avoid St. Petersburg pathologies."  
  - **Key phrasing**: "Log utility *describes* behaviour; bounded utility *prescribes* coherence."  

  ### Revealing Question for the Room  
  - **Question**: "If a rational agent *must* maximise expected utility, and utility can be unbounded, what does St. Petersburg force them to do?"  
  - **Desired realisation**: It forces them to pay any finite price—a reductio ad absurdum against unbounded EU theory.  

  ### Explicit Omissions  
  - **Announce**: "We’re omitting:  
    - Measure-theoretic foundations (e.g., why \( E = \infty \) is ill-defined without integration).  
    - Historical responses (e.g., Buffon’s experiments).  
    - Alternative axioms (e.g., von Neumann-Morgenstern).  
    This is to isolate the problem for decision theory: expected value *alone* can’t capture rational choice."  

  ### Why This Works for Savage  
  Students will see:  
  - EU maximisation fails *structurally* with unbounded utility.  
  - Savage’s axioms (e.g., continuity, boundedness) provide consistency conditions the paradox violates.  
  - The "problem" is not human frailty but the need for axiomatic constraints.  

  ---  
  **Timing Buffer**: Built-in flexibility by truncating capped game discussion if needed. **Materials**: Prepare slides for the expectation sums to avoid board clutter.
