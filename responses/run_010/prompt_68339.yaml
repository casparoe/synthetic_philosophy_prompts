  For the new cases, considering a hypothetical where environmental variation changes without genetic change. If noise pollution affects reading scores, high heritability in quiet schools doesn't mean it's genetic; adding noise could increase environmental variance, lowering heritability. This shows heritability isn't trait-intrinsic.

  Another case: a plant height example where both groups have high heritability, but between-group difference is environmental. This counters verdict 10's fallacy—within-group heritability doesn't explain between-group differences.

  In the bottom line, need to emphasize heritability is population-specific, variance-based, and not about individual causation or intervention predictions. Highlight that it doesn't explain between-group differences or imply immutability.

