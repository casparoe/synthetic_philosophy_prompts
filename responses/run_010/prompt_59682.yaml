answer: |-
  ## Kitchen Table Divides

  **Setting:** A worn oak kitchen table, late afternoon sun slanting through the window. Three siblings – **MAYA** (late 40s, pragmatic, holds a stack of papers), **LEO** (mid-50s, thoughtful, nursing a coffee), and **SOFIA** (early 40s, quiet, tracing the wood grain) – sit amidst files and a small box of jewelry. Their father's estate is mostly liquid assets, but the personal items are proving tricky.

  **MAYA:** (Sighing, pushing the jewelry box towards the center) Alright, the appraisal on Mom's ring came in significantly higher than we thought. Which means Sofia, since you got Grandma's pearls as a wedding gift, and Leo, you got Dad's coin collection years ago... if we just split the *remaining* estate equally now, it wouldn't reflect the total lifetime transfers. It perpetuates the imbalance.

  **LEO:** (Leans forward) Maya, I understand your instinct for fairness. But I fundamentally disagree with this ledger approach. Dad gave those things when he did because he wanted to. The pearls for Sofia's wedding, the coins when I showed that interest... that was *him* experiencing joy *then*, seeing us receive something meaningful *then*. Taxing Sofia or me now, years later, for the dollar value of those gifts feels like retroactively taxing Dad's choice to enjoy giving them.

  **MAYA:** It’s not about Dad, Leo. It’s about *us*. The *advantage* Sofia and you already accumulated, unearned, relative to me. That pearl necklace? It wasn't just sentiment; it was significant value transferred outside any system designed for fairness. My point isn’t that Dad was wrong to give it, but that Sofia shouldn’t now have that *plus* an equal share of what’s left, simply because the transfer happened earlier. A cumulative receipts tax, assessed on heirs over their lifetime, catches that. This table right now? *This* is where that cumulative advantage becomes visible and should be adjusted. It’s about neutralizing luck, not punishing generosity.

  **LEO:** But that’s where I think you miss the core of it. You say it’s not about Dad, but it *is* inextricably linked. A bequest, a deathbed gift, even that ring in the box – it’s the final act of Dad’s *own* life project. His project included providing for his children, yes, but specifically *his* children, according to *his* affections and judgments. Calling his partiality towards us a "bias to be corrected" dismisses it as irrational. It wasn't. Shaping the future for his kids *was* part of his identity, part of his consumption of life. Taxing the receipt of that final expression *is* taxing the fulfillment of his project, by constraining its effect. The dead have no rights, true, but the living donor *did* when they made the choice. Taxing the heir *is* how you retroactively limit that choice.

  **MAYA:** (Taps the papers) Okay, let me grant you that. Let's say Dad's "project" included gifting the pearls early. Fine. But Sofia's *advantage* from receiving them *still exists independently*. It’s a fact about *her* resources, *her* opportunities, *her* place in the socioeconomic landscape *relative to me and you*. Why should the *timing* of the gift – whether Dad got his consumption kick early or late – determine whether that advantage gets counted? Your view makes the *donor's* experience the shield that protects the *heir's* unearned windfall. The cumulative base focuses on the heir's actual position, regardless of when the donor chose to consume their project-satisfaction.

  **LEO:** And *your* view, Maya, makes the state the ultimate arbiter of what constitutes a meaningful "project" worthy of protection. Is Dad's deep-seated desire to see Sofia wear her grandmother's pearls on her wedding day less valid, less core to his life's consumption, than wanting to leave a lump sum later? You can't quantify that subjective value, but taxing its *effect* (the value transferred) based solely on the heir's cumulative tally *does* devalue certain expressions of that project – specifically, the partial ones directed at specific individuals at specific times. It presumes the state knows better than the donor what form his 'consumption' should take. Partiality *is* the project, not a flaw in it.

  **SOFIA:** (Looks up, weary) So... the ring? Do we value it now for the split? Or does Maya get more cash because Leo and I got things before? Or do we ignore past gifts because Dad enjoyed giving them? My head hurts, and this was supposed to be simple.

  **MAYA:** (Looks at the ring, then at Leo) It’s never simple. But the principle matters. Ignoring past transfers *feels* equal now, but it isn't. Not really.

  **LEO:** (Stares into his coffee) And taxing the expression of Dad's deepest inclinations *feels* like fairness, but it chips away at something fundamental about why people build and give in the first place. Protecting the heir's cumulative 'fair share' inherently restricts the donor's freedom to consume their life's work through partial gifts, whenever they choose.

  **MAYA:** And protecting the donor's freedom to consume through partial gifts inherently entrenches unearned, unequal starting points for the next generation. We’re just measuring different things: you see constrained agency for the dead donor, I see unaddressed advantage for the living heir.

  **SOFIA:** (Picks up the ring box, sighs) So... we table the ring for now? Until we figure out... principles?

  *(Silence hangs heavy over the table. Maya nods grimly. Leo stares out the window. Sofia closes the ring box, the click echoing in the unresolved space between them.)*

  **END SCENE**

  **Key Unanswered Arguments:**
  *   **Leo's Unanswered Point:** Maya's cumulative receipts tax inherently devalues and restricts *specific forms* of a donor's life-project consumption (partial, timed gifts) because it focuses solely on the heir's aggregate position, making the state the implicit judge of which expressions of donor intent are "too advantageous" to allow uncorrected.
  *   **Maya's Unanswered Point:** Leo's defense of donor freedom as "consumption" fails to address the *independent reality* of the heir's accumulated, unearned advantage. Protecting the donor's experience does nothing to neutralize the tangible, lasting inequality *created* for the heirs by untaxed, unequal transfers, regardless of when they occurred or the donor's motivation. The timing and nature of the donor's satisfaction are irrelevant to the heir's resultant advantage.
