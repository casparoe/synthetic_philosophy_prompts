prompt: |-
  I am the clinical safety lead at a company that installs passive sensing hubs in the homes of older adults living alone — motion sensors, door contacts, thermostat and lighting state, appliance use. Our product now adapts the home on the basis of inferred preferences: it learns when a resident likes the hallway lit, what temperature she settles on, when she takes her tea, and then changes the defaults without asking. Our machine learning team frames this as inverse reinforcement learning — the log is a demonstration, the resident's preferences are the reward being recovered — and files each proposed change with me as a ticket. I decide roughly forty of these a week, and I get about twenty minutes per ticket, as do the two colleagues who cover for me. None of us is a modeller; I am a nurse. The errors are not symmetric: a wrongly dimmed hallway at night is a fall, and a wrongly overridden preference is the reason families withdraw consent and the reason a resident stops trusting her own house.

  What I need is a written decision procedure, not a discussion of the issues. It must be runnable by a non-specialist in twenty minutes, and it must survive being read aloud, gate by gate, to an adult daughter who has complained that we changed her mother's habits.

  Please organize the answer as follows.

  **1. The gates.** Give me an ordered sequence of gates a ticket must pass before we act. For each gate, state: the question the reviewer asks, in plain words she could actually say aloud; what counts as a sufficient answer; what kind of evidence could never satisfy the gate no matter how much of it we accumulate; the outcome if it fails (reject, defer to the panel, act only after asking the resident, act); and whether the gate is settled by fact or is a question of values that the procedure has no business pretending to answer. Where the ordering matters — where a later gate is wasted effort if an earlier one has already failed — say so.

  **2. The things that burn us.** The procedure must handle these explicitly, and each of them should be traceable to a gate:

  - Our ML lead tells me that many different reward functions are consistent with the same observed behaviour, so a good model fit is not by itself evidence about the preference. If that is right, what is a reviewer supposed to do with it, given that she cannot inspect a posterior or run the model? I want a plain-language test she can apply to a ticket, not a lecture on identifiability.
  - Behaviour under constraints. A resident who never raises the set point above 17°C may dislike heat, may be frugal, may lack the dexterity to work the panel, or may be reading a room that is genuinely colder than the one the sensor sits in. Tell me how to separate preference from budget, ability, availability, and misperception using only what a passive log contains, and what to do when the log cannot separate them.
  - Contaminated history. Every log we have is about six weeks long, and the hub changed its own defaults partway through most of them. Later behaviour is therefore partly our output reflected back at us. Specify what a reviewer may infer from post-intervention data and what she may not, and whether a clean pre-intervention segment of two weeks is enough to carry a claim.
  - Conflicting channels. Our current model treats a resident's verbal report as just another observation channel with its own likelihood, weighted by how accurate her reports have been in the past. I want your assessment of whether that is legitimate, or whether it silently converts a question about whose preferences we ought to serve into an estimation problem. If it is illegitimate, say what the reviewer should do instead when the log and the resident disagree, and whether the answer changes when the disagreement is about a comfort setting versus a safety-relevant one.
  - Change versus drift. Some residents' preferences genuinely shift; in other tickets our estimate is simply moving as noise accumulates. The reviewer cannot tell these apart from inside a twenty-minute window. Say what the procedure should do given that it cannot resolve the difference.
  - Residents who cannot endorse. For a resident with moderate dementia, the behaviour may express a preference she would not affirm at her clearest, and she may be unable to answer a question at all. Mark precisely where the procedure stops being about evidence and becomes a decision the panel owns, and what the reviewer writes in the ledger at that point.

  **3. The constraints to design around.** One-minute-resolution passive sensing; no video or audio, ever; six weeks of history per resident when a ticket opens; at most one clarifying question put to any resident in a week, because asking more is intrusive and several residents are aphasic; no ability to run controlled experiments in the home; a monthly panel of three — me, an ethicist, an engineer — that can grant exceptions; and every claim we act on must be recorded in a ledger in a single sentence a family member could read without feeling deceived. If your procedure needs something this list does not provide, say so rather than assuming it.

  **4. Three tickets.** Run the procedure on each, gate by gate, showing where it passes and where it fails, and ending in the ledger sentence we would write or the refusal we would record.

  - (a) An 84-year-old resident. Every evening between 20:00 and 22:00 she lowers the living-room set point to 16°C, and it stays there until about 06:00. The intake nurse recorded that she likes the house warm, around 21. Nothing else in the log is unusual; she moves freely and there have been no night-time incidents. The model has inferred a strong preference for cool nights and wants 16°C made the overnight default.
  - (b) A resident who gets out of bed between 02:00 and 03:30 on roughly four nights out of six weeks; the kitchen light and kettle activate each time; no falls. The model reads this as a preference for a night drink and wants to pre-warm the hallway light and hold the kettle ready at 02:00. Her daughter writes that her mother has been up in the night since her husband died, and asks us not to make it easier.
  - (c) A feature the product team wants shipped this quarter: automatic dimming, in which the hub lowers lighting to whatever level residents settle on after a few weeks. On our usual measures this is the strongest ticket we have — pooled across nine hundred homes, tight posteriors, engagement up after rollout, and residents almost never revert the setting by hand. I expect this one to pass.

  **5. The limits.** Close by stating what the procedure cannot do: the classes of ticket it will systematically get wrong and in which direction; which of the distinctions above I have to insist survive into a non-specialist's hands because the reasoning collapses without them, and which she can safely be allowed to drop; and where the twenty-minute budget forces shortcuts you expect to produce errors, so that I can decide whether to spend money on the review instead. Wherever you have made a judgment call and dressed it as procedure, label it as such.
reasoning: |-
  We are designing a decision procedure for a clinical safety lead to evaluate proposed automated changes to a smart home system for older adults. The procedure must be executable by a non-specialist in 20 minutes per ticket, and it must be defensible when explained to family members.

  The core challenge is that we are inferring preferences from passive sensor data and then automating changes, but errors can have serious consequences (safety issues, loss of trust). The procedure must explicitly handle the listed pitfalls.

  **Design Principles:**
  - **Safety First:** Avoid changes that could cause harm (e.g., falls) or reduce trust.
  - **Conservatism:** Prefer inaction when in doubt; require explicit resident consent where uncertainty is high.
  - **Transparency:** Each decision must be recorded in a clear, non-deceptive ledger sentence.
  - **Efficiency:** Gates are ordered to quickly reject unsafe or low-confidence proposals.

  **Procedure Structure:**
  We define 7 gates. The order is critical: early gates catch clear rejections (safety, consent) and deferrals (need more info), so we avoid wasting time on analysis for tickets that fail early.

  **Gate 1: Safety Criticality Check**
  - **Question:** "Is this change about something that could directly cause physical harm if we get it wrong? (e.g., fall risks, fire hazards, health emergencies)"
  - **Sufficient Answer:** If the change is safety-critical (e.g., lighting in pathways at night, stove shut-off) and the proposed default might increase risk, then it fails. If it's about comfort (temperature, lighting level in non-critical areas) or convenience, it passes.
  - **Inadmissible Evidence:** Statistical models of risk cannot override the fact that a misstep in a safety-critical context is unacceptable without resident confirmation.
  - **Outcome if Fail:** Reject the change. If the change is safety-critical and the model's proposal is not clearly safer than the status quo, we cannot risk it without consent.
  - **Settled by:** Fact (based on known safety hazards). 

  *Why first?* Because safety risks are non-negotiable and must be addressed immediately.

  **Gate 2: Resident Consent and Trust**
  - **Question:** "Is there any evidence that the resident would object to this change if asked, or that making this change without asking could harm their trust in the system?"
  - **Sufficient Answer:** Check the resident's history: have they manually overridden similar automated changes? Have they expressed preferences verbally that conflict? Have family members raised concerns? If no evidence of objection, pass. If there is evidence of past objection or override, fail.
  - **Inadmissible Evidence:** Model confidence (high confidence does not negate a resident's right to choose).
  - **Outcome if Fail:** Defer to panel. The panel may decide to ask the resident (if feasible) or reject.
  - **Settled by:** Fact (based on recorded overrides or expressed preferences). 

  *Why second?* Trust is fragile. If we have reason to believe the resident wouldn't want this, we must stop.

  **Gate 3: Clean Preference Signal**
  - **Question:** "Does the observed behavior clearly express a preference, or could it be explained by constraints (e.g., cost, physical ability, environmental factors) or by our own prior interventions?"
  - **Sufficient Answer:** Look for consistency and context. If the behavior is:
    - Highly consistent (e.g., same action every day) and occurs in varied conditions (e.g., different times, different weather) and there's no evidence of constraints (e.g., the resident has the ability to change it but doesn't), then pass.
    - If there are plausible constraints (e.g., the resident never adjusts the thermostat but has arthritis), or if the log is contaminated (the behavior started after an earlier automation), then fail.
  - **Inadmissible Evidence:** Model fits (because of identifiability issues: many rewards can explain the same behavior). We rely on the raw log and context.
  - **Outcome if Fail:** Defer to panel. The panel may decide to ask one clarifying question (if allowed by the weekly limit) or reject.
  - **Settled by:** Fact (based on sensor data and known resident constraints from intake).

  *Why third?* We must separate true preference from artifacts. This gate addresses "behaviour under constraints" and "contaminated history".

  **Gate 4: Change vs. Drift**
  - **Question:** "Is the proposed change likely reflecting a stable preference, or could it be noise or a temporary shift?"
  - **Sufficient Answer:** Look at the duration and trend. If the behavior is consistent over at least 4 weeks (within the 6-week log) and there's no sign of drift (e.g., gradual change that might continue), pass. If the behavior is new (e.g., only in the last week) or erratic, fail.
  - **Inadmissible Evidence:** Model posteriors (we don't use these). We use the raw data: consistency over time.
  - **Outcome if Fail:** Defer the change. Wait for more data (if possible without intervention) or reject.
  - **Settled by:** Fact (based on the time series of the behavior).

  *Why fourth?* We need to avoid reacting to noise. This gate requires a minimum of 4 weeks of consistent behavior (within the 6-week log) to pass.

  **Gate 5: Resident Endorsement Feasibility**
  - **Question:** "Can the resident reasonably be asked about this change? (Consider: cognitive ability, communication barriers, intrusiveness.)"
  - **Sufficient Answer:** If the resident has dementia (moderate or worse) or is aphasic, or if asking would be too intrusive (e.g., about a nightly habit they might not want to discuss), then fail. Otherwise, pass.
  - **Inadmissible Evidence:** The model's confidence that the resident would agree.
  - **Outcome if Fail:** Defer to panel. The panel must decide whether the inferred preference aligns with the resident's known values (from family or intake) and whether automation is justified.
  - **Settled by:** Fact (based on medical records and known communication barriers). 

  *Why fifth?* For residents who cannot consent, we must involve the panel to represent their interests.

  **Gate 6: Family and Stakeholder Alignment**
  - **Question:** "Is there any known objection from family or caregivers that we must respect?"
  - **Sufficient Answer:** Check the ledger for family comments (like the daughter's request in ticket b). If there is an explicit objection, fail. If not, pass.
  - **Inadmissible Evidence:** Model predictions about family satisfaction.
  - **Outcome if Fail:** Defer to panel. The panel may decide to discuss with the family or reject.
  - **Settled by:** Fact (recorded objections).

  *Why sixth?* Family objections are critical for ongoing consent.

  **Gate 7: Benefit vs. Intrusion**
  - **Question:** "Does the benefit of automation (e.g., convenience, comfort) clearly outweigh the potential intrusion or loss of control?"
  - **Sufficient Answer:** For comfort settings (temperature, lighting levels), if the resident has consistently adjusted the setting and the change would reduce their effort, pass. For habits that might be sensitive (e.g., nighttime routines), even if consistent, the benefit may be small and the intrusion high, so fail.
  - **Inadmissible Evidence:** Engagement metrics (e.g., "residents almost never revert" – because it might indicate resignation, not preference).
  - **Outcome if Fail:** Reject or defer to panel (if the benefit is unclear).
  - **Settled by:** Values (this is a judgment call, so the reviewer uses guidelines: automation is justified only for clear, non-sensitive preferences that reduce resident burden).

  *Why seventh?* This is the only gate that is values-based. We place it last because it requires the most judgment and is only reached if the ticket passed all factual gates.

  **After the Gates:**
  - If a ticket passes all gates: Act (automate the change).
  - If it fails any gate: Follow the outcome (reject, defer to panel, or ask the resident).
  - The panel (monthly) handles deferred tickets and can override rejections in exceptional cases.

  **Handling the "Things That Burn Us":**

  1. **Identifiability (many rewards explain same behavior):** 
     - The procedure does not rely on model fits. Gate 3 uses the raw log to look for consistency and context. The reviewer asks: "Is the behavior best explained by a clear preference, or by constraints?" They look for:
       - Repetition in varied conditions (e.g., turning down heat every night regardless of outside temp).
       - Absence of constraints (e.g., resident is physically able to change the setting but chooses not to).
     - If constraints are plausible, the gate fails.

  2. **Behaviour under constraints:**
     - Gate 3 addresses this. The reviewer checks the log for:
       - Ability: Does the resident ever change the setting? (If never, maybe they can't.) 
       - Budget: Is the behavior correlated with external factors (e.g., cold days only)? 
       - Misperception: Not directly observable, but if the resident adjusts the setting repeatedly (e.g., sets to 17°C then changes to 16°C later), that suggests intentionality.
     - If the log cannot separate preference from constraints, Gate 3 fails -> defer to panel.

  3. **Contaminated history:**
     - Gate 3: The reviewer must check if the behavior started *after* a prior automation. If so, it's contaminated -> fail Gate 3. 
     - For pre-intervention data: A clean segment of 2 weeks is too short (per Gate 4, we require 4 weeks of consistency). So if only 2 weeks of clean data, fail Gate 4.

  4. **Conflicting channels (verbal reports):**
     - Treating verbal reports as just another observation is illegitimate because it ignores the resident's autonomy. Instead:
       - In Gate 2, if the resident has expressed a conflicting preference (verbally), the gate fails.
       - For safety-critical settings (Gate 1), if the log and resident disagree, we always defer to the resident's stated preference (if available) because safety trumps model inference.
       - For non-safety, if the resident has stated a preference, the reviewer should respect it (so fail Gate 2 if the model proposal conflicts) and not average it with sensor data.

  5. **Change vs. Drift:**
     - Gate 4 handles this by requiring at least 4 weeks of consistent behavior (within the 6-week log). If the behavior is shorter than 4 weeks or shows a trend (e.g., gradually changing), we defer.

  6. **Residents who cannot endorse:**
     - Gate 5: If the resident cannot endorse (due to dementia, etc.), the gate fails and the ticket goes to the panel. The panel (including an ethicist) decides based on the resident's known values and family input. In the ledger, the reviewer writes: "Deferred to panel: resident unable to endorse."

  **Constraints Compliance:**
  - The procedure uses only passive sensing (no video/audio) and the 6-week log.
  - It allows one question per week (used only if the panel approves it after a deferral in Gate 3 or 5).
  - The ledger sentence is written after the gates (see examples below).
  - If a gate requires information not available (e.g., resident's dexterity not in log), the reviewer uses intake records or assumes the worst (e.g., assume limited dexterity if arthritis is recorded) -> may cause Gate 3 to fail.

  **Example Ticket Assessments:**

  **Ticket (a): Thermostat at night to 16°C**
  - Gate 1: Not safety-critical (temperature setting, assuming no extreme hypothermia risk). Pass.
  - Gate 2: No recorded objections or overrides. Pass.
  - Gate 3: Behavior is consistent (every night) and not contaminated (no prior intervention noted). But: intake says she likes it warm (21°C). This conflict suggests a constraint? Maybe she can't adjust it at night? Or maybe she prefers cool at night. Without evidence of constraint, we might pass, but the intake note is a red flag. Since the intake is a verbal report, we treat it as a preference statement -> Gate 2 should have failed? Let's recheck: Gate 2 asks for evidence of objection. The intake note is not an objection to automation but a stated preference. Since the model proposal conflicts with the stated preference, Gate 2 fails (because we have evidence she would object if asked). Outcome: Defer to panel.
  - **Ledger if deferred:** "Deferred to panel: resident's stated preference (21°C warm) conflicts with observed nighttime setting (16°C)."

  **Ticket (b): Night drink at 2 AM**
  - Gate 1: Safety-critical? Hallway lighting pre-warm could prevent falls -> but the daughter asks not to make it easier. We must consider: making the habit easier might reinforce a harmful behavior (sleep disruption) or increase risk (if resident is drowsy). So it's ambiguous. But the daughter's request is key. However, Gate 1 is about direct physical harm. Pre-warming light might reduce fall risk, so it's safety-related. But the daughter objects. We proceed to Gate 2.
  - Gate 2: The daughter has explicitly objected. This is recorded -> Gate 2 fails. Outcome: Defer to panel.
  - **Ledger:** "Deferred to panel: family objection to night routine automation."

  **Ticket (c): Automatic dimming (pooled data)**
  - This is a feature request, not resident-specific. But the procedure can still be applied to the pooled data as if it were one resident.
  - Gate 1: Not safety-critical (lighting levels, assuming not in critical pathways). Pass.
  - Gate 2: No resident-specific objections, but note: residents rarely revert. However, this might indicate resignation. Without an explicit objection, pass.
  - Gate 3: Pooled data shows consistency across homes. But contamination? In the pooled data, some logs may be contaminated. However, the procedure is for individual tickets. For a feature, we must consider individual variation. This gate is hard: pooled data doesn't guarantee a clean signal per resident. We might pass, but cautiously.
  - Gate 4: Consistent over weeks? Yes, per ticket. Pass.
  - Gate 5: Residents vary; some may not be able to endorse. But for a feature, we have to generalize. The panel should review because it affects many. So we might defer at Gate 5? Actually, Gate 5 is about the specific resident. Since this is a feature ticket, we treat it as a proposal for all residents. Gate 5: Some residents cannot endorse -> fail for those, but for the feature, we must design a safe rollout. Outcome: Defer to panel for a policy decision.
  - **Ledger for feature approval?** Not applicable per resident. Instead, the panel would decide: "Approved with opt-in: automatic dimming enabled only for residents who pass individual Gates 1-7."

  **The Limits:**
  - **Systematic Errors:**
    - The procedure will reject valid preferences when constraints are present but not detectable (false negatives).
    - It may miss subtle preference shifts (if they occur within 4 weeks) and mistake drift for signal (if the drift is slow).
    - For residents with dementia, the panel may override true preferences if family input is biased.
  - **Critical Distinctions for the Reviewer:**
    - Must understand: safety-critical vs. non-safety (Gate 1), stated vs. observed preferences (Gate 2), and consistency vs. constraints (Gate 3). These cannot be dropped.
    - Can drop: Detailed understanding of identifiability (replaced by Gate 3's plain-language checks).
  - **Time-Driven Shortcuts:**
    - Gate 3 (constraints) requires context that might not be in the log (e.g., dexterity). The reviewer may have to guess, leading to errors. Solution: Intake records must include physical/cognitive limitations.
    - Gate 4 (change vs. drift) uses 4 weeks as a heuristic; some true preferences may be rejected if less than 4 weeks.
  - **Judgment Calls Dressed as Procedure:**
    - Gate 7 (benefit vs. intrusion) is inherently values-based. The guideline (automate only for clear, non-sensitive preferences) is a judgment.
    - The 4-week threshold in Gate 4 is a judgment call (but based on clinical practice for habit stability).

  **Conclusion:**
  This procedure prioritizes safety and resident autonomy. It will reject many proposals, but that is by design. The monthly panel is the release valve for edge cases. The ledger ensures transparency. We accept that some beneficial automations will be delayed or rejected to avoid harm.
answer: |-
  ### **1. The Gates**  
  **Order matters: Gates 1–3 must be passed first. If any fail, skip later gates and proceed to the outcome.**  

  | Gate | Question (to ask aloud) | Sufficient Answer | Inadmissible Evidence | Outcome if Fail | Settled By |
  |------|--------------------------|-------------------|------------------------|-----------------|------------|
  | **1. Safety Criticality**<br>(*Order: 1st*) | "Could getting this wrong cause physical harm or a fall? Focus on immediate risks like dark hallways, extreme temperatures, or obstacles." | No plausible harm scenario exists (e.g., adjusting a non-safety-related thermostat or daytime lighting). | Statistical risk models, posterior probabilities, or "engagement" metrics. Harm is binary: if a scenario exists, evidence is irrelevant. | **Reject** if safety-relevant and uncertainty exists. If safety-critical and proposal *reduces* risk, pass. | **Fact** (based on known hazards, e.g., dimmed hallways at night = fall risk). |
  | **2. Resident Consent**<br>(*Order: 2nd*) | "Has the resident or family ever objected to similar changes, or would this change conflict with their known wishes?" | No recorded objections (verbal/written) and no conflict with stated preferences (e.g., from intake notes). | Model confidence or behavioral frequency. Past overrides of automations or explicit statements (e.g., "I like it warm") are decisive. | **Defer to panel** for review. If resident has dementia/aphasia, skip to Gate 6. | **Fact** (recorded objections or stated preferences). |
  | **3. Uncontaminated Signal**<br>(*Order: 3rd*) | "Is the behavior consistent and not caused by our past actions, constraints, or external factors?" | Behavior is: (1) Consistent (≥4x/week for 4+ weeks in pre-intervention data), (2) Plausibly intentional (e.g., resident adjusts settings manually), and (3) Not explainable by constraints (e.g., cost, dexterity issues). | Model fits or pooled data. Post-intervention data (after prior automations) is inadmissible for inferring preference. | **Defer to panel** (panel may approve one clarifying question). | **Fact** (sensor log + intake records, e.g., arthritis = dexterity constraint). |
  | **4. Stability**<br>(*Order: 4th*) | "Is this likely a stable preference, or could it be noise or a temporary change?" | Behavior persists ≥4 weeks in clean (pre-intervention) data with no drift (e.g., trend toward colder temps). | Short-term data (<4 weeks) or erratic patterns. A clean 2-week segment is insufficient. | **Defer** (wait for more data; do not act). | **Fact** (duration/trend in log). |
  | **5. Benefit vs. Burden**<br>(*Order: 5th*) | "Does automating this clearly reduce effort for the resident without overstepping?" | Automation eliminates repetitive manual adjustments (e.g., daily thermostat changes) and is non-intrusive (e.g., not pre-empting private routines). | Engagement metrics or reversion rates. "Making habits easier" for sensitive routines (e.g., nighttime wandering) fails. | **Reject** if intrusive; **defer to panel** if benefit unclear. | **Values** (intrusiveness is a judgment). |
  | **6. Stakeholder Alignment**<br>(*Order: 6th*) | "Is there an active objection from family or caregivers?" | No current objections (e.g., daughter’s email). Family input overrides ML proposals. | Historical data without objections. New objections are decisive regardless of model evidence. | **Reject** if objection exists. | **Fact** (recorded objections). |
  | **7. Cognitive Endorsement**<br>(*Order: 7th*) | "Can the resident understand and consent to this change?" | Resident has no cognitive/communication barriers (per intake records). | Behavioral data. For dementia, behavior alone cannot affirm preference. | **Defer to panel** for residents with dementia/aphasia. | **Fact** (medical records). |

  **Gate Order Rationale:**  
  - Gates 1–3 are **foundational**. Safety (Gate 1) and consent (Gate 2) are non-negotiable; if failed, later analysis is wasteful.  
  - Gate 3 must precede Gate 4, as contaminated data invalidates stability checks.  
  - Gates 6–7 are last as they address external constraints, not evidence quality.  

  ---

  ### **2. The Things That Burn Us**  
  Each issue maps to a specific gate:  

  - **Identifiability (many rewards explain behavior):**  
    - **Gate 3 handles this.** Ignore model fits. Ask: "Is the behavior *only* explainable as intentional preference?"  
    - **Test:** If alternate explanations exist (e.g., frugality, dexterity), Gate 3 fails. Use intake notes (e.g., "resident has arthritis") to rule out constraints.  

  - **Behaviour under constraints (e.g., thermostat at 17°C):**  
    - **Gate 3 handles this.** Check:  
      1. **Intent:** Does resident manually adjust settings? (If never, suspect constraint.)  
      2. **Consistency across contexts:** Same behavior in different conditions? (e.g., cold vs. warm days).  
      3. **Log clues:** Repeated small adjustments suggest intent; no adjustments suggest inability.  
    - **If log cannot separate:** Gate 3 fails → defer to panel.  

  - **Contaminated history:**  
    - **Gate 3 handles this.**  
      - **Infer from post-intervention data:** Only permissible to detect *harm* (e.g., increased falls after automation). Never infer *preference*.  
      - **Pre-intervention data:** Requires ≥4 weeks clean data (Gate 4). Two weeks is insufficient.  

  - **Conflicting channels (verbal vs. sensor data):**  
    - **Gate 2 handles this.**  
      - **Legitimacy:** Treating verbal reports as "another sensor" is **illegitimate**. It confuses values (resident’s right to consent) with estimation.  
      - **Reviewer action:**  
        - Always prioritize resident’s verbal report over log (fails Gate 2 if conflict exists).  
        - **Safety vs. comfort:** No difference. Autonomy applies to both (e.g., overriding a stated temperature preference is unethical).  

  - **Change vs. drift:**  
    - **Gate 4 handles this.**  
      - **Procedure:** Require ≥4 weeks of stable pre-intervention data. If drift (e.g., gradual temperature drops), Gate 4 fails → defer.  
      - **Time limit shortcut:** Gate 4’s 4-week rule is a heuristic to avoid noise. Errors may occur for slow drifts.  

  - **Residents who cannot endorse:**  
    - **Gate 7 handles this.**  
      - **Where evidence stops:** Gate 7 is the cutoff. For dementia, behavior ≠ endorsable preference.  
      - **Ledger entry:** "Deferred to panel: resident unable to endorse."  
      - **Panel role:** Decide if automation aligns with resident’s known values (e.g., from family).  

  ---

  ### **3. Constraints to Design Around**  
  - **Supported:** Passive sensing, 6-week logs, no video/audio, one question/week, no experiments, monthly panel, ledger sentences.  
  - **Needed but missing:**  
    - **Intake records on constraints** (e.g., dexterity, cognitive status). If unavailable, Gate 3/7 default to worst-case (assume constraints exist).  
    - **Explicit documentation of family objections.** If not recorded, Gate 6 may falsely pass.  
  - **Workarounds:**  
    - Use intake notes for physical/cognitive constraints (Gates 3/7).  
    - For missing data, Gates 3/4 fail conservatively.  

  --- 

  ### **4. Three Tickets**  
  **Ledger sentence format:** `<Outcome>: <Reason> (if rejected/deferred)` or `Automated: <Change> (if approved)`.  

  - **Ticket (a): Nighttime thermostat to 16°C**  
    - **Gate 1 (Safety):** Pass (temperature not safety-critical absent extremes).  
    - **Gate 2 (Consent):** Fail. Intake note ("likes house warm at 21°C") conflicts with model.  
    - *Stop: Gate 2 failed → defer to panel.*  
    - **Ledger:** "Deferred to panel: conflicts with resident's stated preference."  

  - **Ticket (b): Pre-warm lights/kettle at 02:00**  
    - **Gate 1 (Safety):** Ambiguous (night lighting prevents falls, but daughter objects). Pass provisionally.  
    - **Gate 2 (Consent):** Fail. Daughter’s email is an active objection.  
    - *Stop: Gate 2 failed → defer to panel.*  
    - **Ledger:** "Deferred to panel: family objection."  

  - **Ticket (c): Automatic dimming (feature)**  
    - **Gate 1 (Safety):** Pass (dimming not safety-critical if not in walkways).  
    - **Gate 2 (Consent):** Pass (no objections in logs).  
    - **Gate 3 (Uncontaminated):** Fail for individuals. Pooled data ignores resident-specific constraints (e.g., vision impairment).  
    - *Stop: Gate 3 failed → defer to panel.*  
    - **Ledger:** "Deferred to panel: feature requires individual review."  
    - **Panel action:** Approve only for residents passing all gates.  

  ---

  ### **5. The Limits**  
  - **Systematic Errors:**  
    - **False negatives (over-rejection):** Tickets fail if constraints exist but are undocumented (Gate 3) or data is short (Gate 4).  
    - **False positives (under-rejection):** Stable but undesirable preferences (e.g., reinforcing harmful routines) may pass if no objections (Gate 2/6).  
    - **Directional bias:** Favors safety/consent over convenience. Expect 60-70% deferrals/rejections.  

  - **Critical Distinctions (must survive):**  
    1. **Safety vs. comfort (Gate 1):** Collapses if blurred, leading to physical harm.  
    2. **Preference vs. constraint (Gate 3):** Collapses if undetected constraints cause automation.  
    3. **Stated vs. observed preferences (Gate 2):** Collapses if verbal reports are undervalued.  
    - **Droppable:** Technical terms (e.g., "identifiability") are replaced by plain gates.  

  - **Time-Forced Shortcuts:**  
    - **Gate 3 (constraints):** Reviewer may miss subtle context (e.g., weather correlations) → errors. Mitigation: Flag tickets with sparse manual adjustments for panel review.  
    - **Gate 4 (stability):** Heuristic 4-week rule may miss slow drifts → defer if any doubt.  
    - **Cost tradeoff:** Adding 5 minutes/ticket would allow deeper log review; worth investing if harm rates are high.  

  - **Judgment Calls Dressed as Procedure:**  
    - **Gate 5 (Benefit vs. Burden):** "Intrusiveness" is subjective. Labeled as values-based.  
    - **Gate 4’s 4-week threshold:** Arbitrary but necessary. Labeled as heuristic.  
    - **Gate 7 (Cognitive Endorsement):** Assumes dementia = inability to consent. Panel must review bias.  

  **Final Note:** This procedure errs toward safety and autonomy. It reduces automation volume but prevents catastrophic errors. The panel handles edge cases, ensuring scalability.
