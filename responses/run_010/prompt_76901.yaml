  For the desiderata structure, each point needs: (1) the requirement itself, (2) its motivation, (3) classification as universal constraint or debatable demand. The three named issues are important but not necessarily foundational—I suspect measure problem and physical salience are deeper. 

  *Reparameterization invariance*: Genuine. Surprise shouldn't depend on arbitrary units. But this is derivative—it only matters because we need a probability measure. The core issue is defining a non-arbitrary measure on parameter space.

  *Methodology of the sweep*: Genuine but incomplete. Single-parameter variations ignore covariance, but the real challenge is characterizing the life-permitting region in high-dimensional space. This is where "offsetting effects" come in—it's about the region's topology, not just its projections.

  *Pre-registration*: Mostly genuine. Post-hoc fitting is a real risk, but demanding a fully specified prior landscape might overreach. The minimal requirement is that the "surprising" region must be definable without contemporary fine-tuning knowledge. 

  Beyond these, I'd argue two are more fundamental: 
  - *Physical Salience Requirement*: Constants must be "knobs" we can conceptually vary independently. Motivation: Varying fixed constants like c might be nonsensical. Classification: Universal—even design proponents need tunable parameters.
  - *Measure Requirement*: The account must specify a non-arbitrary probability measure. Motivation: Without this, "narrowness" is undefined. Classification: Universal constraint, though its satisfaction is hotly debated.

  The most selective requirement is likely the measure problem—it sinks many naive formulations. As for unsatisfiable combinations: Demanding both pre-registration (specific prior predictions) and full covariance (high-dimensional offsetting) might be impossible without a theory of everything. 

  Finally, the replies: 
  - *Designer*: Easily satisfies pre-registration and salience but struggles with measure (divine probability space is undefined). 
  - *Multiverse*: Handles measure/covariance if the theory provides one, but pre-registration is weak—it often retrofits the landscape. 
