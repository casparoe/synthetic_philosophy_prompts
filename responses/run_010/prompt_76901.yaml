answer: |-
  Here is a distilled standard for an account of fine-tuning capable of supporting evidentiary claims about design, structured by requirement, motivation, and classification. The core purpose is **epistemic robustness for design inferences in a physics context**, excluding unrelated virtues.

  ### Desiderata for an Adequate Treatment
  1. **Physical Salience Requirement**  
     - **Requirement**: The physical parameters claimed to be "fine-tuned" must be *independently variable* in a physically meaningful sense. Constants or conditions that are fixed by fundamental laws (e.g., dimensionality of spacetime) rather than contingent free parameters do not qualify as data.  
     - **Motivation**: Varying parameters that are logically/mathematically necessary (e.g., π) or dynamically fixed (e.g., c in some frameworks) generates pseudosurprise. Only "knobs" not determined by theory can be candidates for tuning.  
     - **Classification**: **Universal constraint**. Both sides agree design arguments require contingent variables; varying necessary entities is incoherent.

  2. **Measure Requirement**  
     - **Requirement**: The account must specify a non-arbitrary *probability measure* over the parameter space. "Narrowness" of life-permitting intervals must be defined relative to a well-motivated measure.  
     - **Motivation**: Without a measure, "small" or "improbable" is meaningless. Probability is measure-dependent, and ad hoc choices (e.g., uniform in linear scale) can manufacture or erase apparent fine-tuning.  
     - **Classification**: **Universal constraint**. Any probabilistic claim requires a measure; failure here voids the inference. *This is the most selective requirement*—most accounts fail to define a non-arbitrary measure, disqualifying them immediately.

  3. **Covariance Requirement** (Your "methodology of the sweep")  
     - **Requirement**: The life-permitting region must be characterized in the *full parameter space*, accounting for correlations and trade-offs between parameters. Single-parameter variation ("holding others fixed") is inadmissible as a description of the region’s size/shape.  
     - **Motivation**: Physical constants often covary (e.g., altering α might compensate for altering mₑ). Projecting the region onto one axis ignores degeneracies, exaggerating apparent fine-tuning.  
     - **Classification**: **Universal constraint**. The region’s true geometry is objective; misrepresentation through inadequate methodology distorts evidence.

  4. **Reparameterization Invariance**  
     - **Requirement**: The assessment of fine-tuning must be invariant under smooth, physically allowable reparameterizations (e.g., using Λ or Ω_Λ, MeV or Planck units).  
     - **Motivation**: Surprise cannot depend on units or coordinates. A uniform measure in one coordinate (e.g., linear) may be non-uniform in another (e.g., logarithmic), making "narrowness" coordinate-relative.  
     - **Classification**: **Universal constraint**. Coordinate-dependence is a gauge artifact, not physics; it must be eliminated.

  5. **Pre-registration Requirement**  
     - **Requirement**: The boundaries defining "life-permitting" (or "surprising") regions must be specifiable *independently of precise observational values*—e.g., via broad physical necessities (star formation, chemistry) known prior to measuring constants.  
     - **Motivation**: Post-hoc fitting of boundaries to observed values (e.g., "life requires 0.999 < G < 1.001") invalidates surprise. Predictiveness guards against cherry-picking.  
     - **Classification**: **Mostly universal**, but design skeptics may dispute the stringency. Minimally, boundaries must not be *retrospectively calibrated* to observed constants; maximal versions demand pre-discovery predictions.

  6. **Completeness Requirement**  
     - **Requirement**: The account must engage all parameters relevant to the existence of observers *within the chosen physical framework*. Omitting significantly constrained parameters (e.g., ignoring cosmological initial conditions while discussing constants) undermines the evidence.  
     - **Motivation**: Evidence strength depends on the joint improbability of all necessary conditions. Selecting a subset of parameters can inflate apparent fine-tuning.  
     - **Classification**: **Debatable demand**. Design proponents argue completeness strengthens the case; skeptics note adding parameters may reveal compensating slack. Minimally, omissions must be justified.

  ### Key Judgments on Your Queries
  - **Reparameterization Invariance**: **Genuine** (universal constraint).  
  - **Methodology of the Sweep**: **Genuine** (universal constraint; single-parameter sweeps are methodologically invalid).  
  - **Pre-registration**: **Genuine in spirit** (prevents data-fishing), but overly strict formulations risk being **debater’s ploys** (e.g., demanding exact pre-registered intervals). Minimal version is essential.  

  ### Most Selective Requirement  
  **Measure Requirement**. Failure here is fatal: without a non-arbitrary probability measure, no probabilistic conclusion (design/multiverse) can be justified. It reliably exposes hand-waving in popular treatments.  

  ### Unsatisfiable Subset?  
  The combination of **Measure + Covariance + Pre-registration** may be unsatisfiable *in practice* for high-dimensional spaces. Pre-registration requires definable boundaries, but covariance demands exploring a complex, correlated landscape—which may be impossible without a theory of everything. This tension is unresolved; accounts typically sacrifice one (e.g., multiverse avoids pre-registration, design posits simple boundaries).  

  ### Replies Against the Standard  
  - **Designer**: Satisfies salience/pre-registration easily but **fails measure** (no non-arbitrary divine probability space). Covariance handled only if designer’s "goal" is specified.  
  - **Multiverse**: Addresses measure/covariance *if* the multiverse theory provides a natural measure. **Fails pre-registration** (boundaries often fit to observations).  
  - **No-Probability**: Rejects measure requirement outright. **Fails universally**—cannot engage the evidentiary debate by denying its framework.  

  This standard isolates the *minimal* criteria for an account to credibly support or rebut design inferences in a physics forum. It reveals where the debate truly hinges: not on metaphysics, but on the rigor of probabilistic modeling.
