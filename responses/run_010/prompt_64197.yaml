     Alternatively, if we wish to account for the distribution of welfare among individuals at each stage, we might consider a two-dimensional array: each row `n` (time) has a finite set of individuals with their welfare. Then we can form a sequence `a` by aggregating per stage (e.g., summing the welfare of all individuals at stage `n`). However, the argument focuses on the infinite total, so we can start with a sequence `a` of real numbers.

  2. **Policies**: 
     - A policy is a rule that determines the entire sequence `a`. We can think of two policies as two sequences `a = (a_n)` and `b = (b_n)`.

