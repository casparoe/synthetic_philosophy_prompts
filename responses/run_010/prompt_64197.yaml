  The three repairs:

  (i) **Eventual dominance in partial sums**: We say that `a` is better than `b` if there exists `N_0` such that for all `N ≥ N_0`, we have `S_N(a) > S_N(b)` and the difference `S_N(a) - S_N(b)` goes to infinity. This is equivalent to the series `∑(a_n - b_n)` diverging to `+∞`. This method is known as the "partial sum comparison" and is a form of the "limit inferior" criterion if we require only that the limit inferior of the difference is positive (but the argument says "stays ahead", so we require the difference to be eventually positive and divergent to infinity).

