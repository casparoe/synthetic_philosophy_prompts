prompt: |-
  You are to act as a specialist in late-antique moral theology who also serves as an experienced university examiner: someone who has taught Augustine's two treatises on lying repeatedly and who knows how to write an essay question that cannot be answered by producing a competent summary. Work carefully, and plan explicitly before you draft.

  **The context.** I teach an upper-level undergraduate seminar, "Truthfulness and Its Exceptions," and I am writing this year's closed-book final. Three weeks of the course were spent on Augustine's positions on lying: the claim that lying is always sinful and never to be done for the sake of any good outcome; the account of what makes an utterance a lie, located in the doubleness of the heart rather than in the truth-value of the sentence uttered; the permission to conceal the truth alongside the prohibition on asserting what one does not believe; the graded ranking of kinds of lie by seriousness, running from lies about religious doctrine down to lies told to shield another person from death or from sexual violation; and the later treatise written to block a scheme for infiltrating a heretical sect by pretending to belong to it. Students also read the standard secondary literature on absolutism and on the lying/deception distinction. The exam is 90 minutes, one compulsory essay question, worth 30 marks, with an expected length of about 1,400 words. Students are told in the rubric that they may identify arguments descriptively — no chapter numbers, no page references, no recalled quotations are expected or rewarded.

  **The case I want the question built around.** Please use the following constructed case (it is a teaching device of mine, not a historical report, and the question should present it as such). During a persecution, an officer asks a Christian householder point-blank whether a fugitive is hidden somewhere in the house. Minutes earlier the householder moved the fugitive from the cellar to a concealed space in the roof. The householder has four replies available:

  - **(A)** A flat denial that anyone is hidden in the house — false, and believed by the speaker to be false.
  - **(B)** A statement that the cellar is empty — literally true, believed true, and chosen precisely because the officer will infer from it that no one is hidden anywhere in the house.
  - **(C)** A refusal to answer, or silence.
  - **(D)** An ambiguous utterance whose sense the speaker resolves privately in a way he does not disclose, so that what he believes and what he says are matched only by an interpretation the hearer has no access to.

  **What the question must make students do.** Write the question so that a student has to: (i) determine, using Augustine's own criteria and not general moral intuitions, which of (A)–(D) he would rule out outright, which he would permit, and which would fall in between, saying which element of the criteria is doing the work in each case; (ii) examine whether the doubleness-of-heart criterion and the underlying rationale that signs exist to convey what is in the mind pull apart in (B) and (D) — that is, whether his framework has the resources to forbid engineered misleading once every assertion has been made true, or whether it licenses exactly that; (iii) explain what the graded ranking of lies does and does not concede to consequences, and whether ranking by seriousness is compatible with holding that no lie is ever permissible; and (iv) end with a defended verdict on which reconstruction of the position is best: an absolutism about the integrity of the speaker that has no notion of an epistemic entitlement owed to the hearer; an absolutism about the proper function of signs that does generate such a notion; or a view that oscillates unstably between the two, with the student saying what in the framework decides. You may polish the wording, add sub-parts, and allocate the 30 marks across the parts as you judge best, but the four tasks above must all be genuinely required for full credit, and the question must fit the time limit.

  **Deliverables, in this order.**

  1. **Setting rationale** (about 150–200 words, presented as your planning step rather than as part of the exam paper): list the candidate cruxes in this material, state which one you have built the question on, and describe concretely what a well-read but merely summarising answer would say and where it would stall. This is where you show your thinking.

  2. **The exam question as it will appear on the paper**, including the case, the sub-parts, the mark allocation for each part, and the rubric sentence telling students that descriptive identification of arguments is sufficient.

  3. **A model answer of 700–750 words** that a first-class student could write in the time available. It must take a position on task (iv) rather than surveying the options, and it must engage the strongest objection to that position. Where you are offering a reconstruction rather than reporting something Augustine says, signal it as a reconstruction in the text of the answer. Do not quote from Augustine's works or from the secondary literature at all: refer to arguments by description, since that is the convention I have set for the paper.

  4. **A marking scheme as a single JSON object** in a code block, using exactly this schema:

     - `question_id` (string)
     - `total_marks` (integer, 30)
     - `time_minutes` (integer)
     - `criteria` — an array of exactly six objects, each with:
       - `id` (string, "C1" … "C6")
       - `name` (short label for the criterion)
       - `marks` (integer; the six values must sum to 30)
       - `a_answer_requires` (string: the specific move a first-class answer makes — it must be a substantive argumentative step, never merely the correct use of a label or a doctrine's name)
       - `b_answer_contains` (string: what a solid second-class answer manages, and why it falls short of the move above)
       - `typical_error` (string: a mistake students actually make with this material that should cost marks here, described precisely enough for a non-specialist marker to recognise it on the page)
       - `marker_test` (string: one line the marker can apply to decide whether the criterion is met)
     - `grade_boundaries` — an array of objects with `grade` (string: "A", "B", "C", "D") and `min_marks` (integer)
     - `global_penalties` — an array of objects with `offence` (string) and `marks` (integer, negative), covering at least the case of an answer that treats the material as a straightforward tragic dilemma in which every option is wrong, and the case of an answer that reads the ranking of lies as evidence that Augustine is weighing outcomes.

  5. **A closing note of three or four sentences** on how this question separates students who have memorised the labels from students who understand the issue, naming the single sentence in a weak answer that would most reliably reveal the difference.

  Two further constraints: do not append a bibliography, reading list, or set of suggested references anywhere in your response, and do not attribute to Augustine any claim you are not confident the treatises support — if a point is contested in the literature, say so in one clause and move on.
reasoning: |-
  We are creating an exam question for an upper-level undergraduate seminar on "Truthfulness and Its Exceptions," focusing on Augustine's treatises on lying. The question must be built around a constructed case of a Christian householder during a persecution, with four possible replies to an officer asking about a hidden fugitive. The question must require students to:

  (i) Apply Augustine's criteria to determine which replies are forbidden, permitted, or in between, and explain the criteria at work.
  (ii) Examine whether the doubleness-of-heart criterion and the rationale about signs conveying the mind's content pull apart in options (B) and (D).
  (iii) Explain what the graded ranking of lies concedes to consequences and whether it is compatible with the absolute prohibition on lying.
  (iv) End with a defended verdict on which reconstruction of Augustine's position is best: absolutism about speaker integrity, absolutism about the function of signs, or an unstable oscillation between the two.

  The exam is 90 minutes, one compulsory essay question, worth 30 marks, expected length about 1,400 words.

  **Deliverables:**

  1. **Setting rationale** (150-200 words): Identify the crux, what a summarising answer would say and where it stalls.
  2. **The exam question** with case, sub-parts, mark allocation, and rubric.
  3. **A model answer** (700-750 words) that takes a position on (iv) and engages the strongest objection.
  4. **Marking scheme** as a JSON object with the specified schema.
  5. **Closing note** (3-4 sentences) on how the question separates memorization from understanding.

  **Step 1: Setting Rationale**

  The candidate crux in Augustine's treatises on lying is the tension between two aspects of his account: the subjective condition of the speaker's intention (doubleness of heart) and the objective function of signs (to convey what is in the mind). The case of the householder, especially options (B) and (D), brings out whether Augustine's framework can consistently forbid misleading without false assertion. A well-read but summarising answer would correctly identify that Augustine forbids (A) as a lie and (C) as permitted, and might note that (B) is not a lie because it is literally true and (D) is ambiguous. However, it would stall at explaining why (B) and (D) are problematic for Augustine's rationale about signs: it would not see that even if (B) is not a lie by the doubleness criterion, it might violate the purpose of communication. Similarly, it would not deeply engage with the question of whether the ranking of lies implies a concession to consequences or whether it is compatible with absolutism. The question is built to force students to confront whether Augustine's criteria are unified or whether they pull apart, and what that means for the coherence of his absolutism.

  **Step 2: The Exam Question**

  **Question (30 marks total; 90 minutes; write approximately 1,400 words)**

  During a persecution, an officer asks a Christian householder point-blank whether a fugitive is hidden somewhere in the house. Minutes earlier, the householder moved the fugitive from the cellar to a concealed space in the roof. The householder has the following four replies available:

  - **(A)** A flat denial that anyone is hidden in the house — false, and believed by the speaker to be false.
  - **(B)** A statement that the cellar is empty — literally true, believed true, and chosen precisely because the officer will infer from it that no one is hidden anywhere in the house.
  - **(C)** A refusal to answer, or silence.
  - **(D)** An ambiguous utterance whose sense the speaker resolves privately in a way he does not disclose, so that what he believes and what he says are matched only by an interpretation the hearer has no access to.

  Using Augustine's treatises on lying, address the following:

  (a) For each of the four replies (A–D), determine whether Augustine would rule it out as a lie, permit it, or consider it a lie but of a less serious kind. Explain which element(s) of Augustine's criteria for lying and for permissible concealment are decisive in each case. (8 marks)

  (b) Focusing on replies (B) and (D), examine whether Augustine's criterion for lying (the doubleness of heart) and his rationale for the function of signs (to convey what is in the mind) pull apart. Does his framework have the resources to forbid engineered misleading without false assertion, or does it license such misleading? (8 marks)

  (c) Explain what Augustine's graded ranking of lies (by seriousness, from lies about doctrine down to lies told to protect life) does and does not concede to consequences. Is this ranking compatible with his absolute prohibition on lying? Justify your answer. (6 marks)

  (d) Defend a verdict on which of the following reconstructions best captures Augustine's position: (i) an absolutism about the speaker's integrity that has no notion of an epistemic entitlement owed to the hearer; (ii) an absolutism about the proper function of signs that does generate such a notion; or (iii) a view that oscillates unstably between the two. What in Augustine's framework decides your choice? (8 marks)

  *Rubric: You are expected to identify arguments descriptively — do not use chapter numbers, page references, or quotations. Credit is given for understanding and applying the concepts.*

  **Step 3: Model Answer (700-750 words)**

  Augustine's treatises on lying establish an absolute prohibition: lying is always sinful, regardless of consequences. To lie is to assert something one does not believe, with the intention to deceive. This 'doubleness of heart' — a discord between what one thinks and what one says — is the core of his definition. The function of signs is to express the mind's content; lying perverts this. However, Augustine permits concealment of truth, provided one does not assert falsehood. The case of the householder tests these principles.

  (a) For reply (A), Augustine would rule it out as a lie. It is a false assertion, believed false, with intent to deceive — classic doubleness of heart. This is a lie of the kind that protects life, which Augustine ranks as the least serious, but still absolutely forbidden. Reply (C) — refusal or silence — is permitted. Augustine allows withholding truth without asserting falsehood. The decisive element is that no assertion is made, so there is no doubleness. Reply (B) — stating the cellar is empty — is literally true and believed true. Augustine does not classify it as a lie because there is no doubleness: the speaker believes the cellar is empty. However, it is engineered to mislead. Augustine would permit this, as he allows truthful statements that conceal, but we must note a tension (addressed in (b)). Reply (D) — ambiguous utterance, privately resolved — is more complex. The speaker asserts something they believe (under their private resolution), but the hearer cannot access that meaning. Augustine would likely consider this a lie because the speaker knows the hearer will take a different meaning, so there is doubleness: the speaker intends the hearer to believe what the speaker does not (the hearer's interpretation). The criterion is the intention to deceive by exploiting ambiguity.

  (b) Replies (B) and (D) reveal a tension. In (B), Augustine's doubleness criterion is not met (the speaker believes the cellar is empty), so it is not a lie. But the rationale about signs — that they should convey the mind's content — is strained. The householder intends the officer to form a false belief, and the statement is chosen to cause that. Does Augustine's framework forbid this? He does not explicitly forbid (B) in his treatises; in fact, he allows truthful misleading. But his rationale implies that signs should convey the speaker's mind, which in (B) they do only partially: the householder's mind includes the fugitive's location, but the statement conveys only part of the truth. Augustine might argue that the householder is not obligated to volunteer the whole truth. However, in (D), the doubleness is clearer: the speaker has a private meaning and knows the hearer will take another. This is deceitful because the speaker does not believe what the hearer will understand. Augustine's framework thus forbids (D) as a lie by the doubleness criterion, but permits (B). Yet the underlying rationale — that signs exist to convey the mind — is equally violated in (B), because the householder's mind is not fully conveyed. This suggests that the criteria pull apart: the doubleness criterion might allow engineered misleading if the assertion is true, but the rationale about signs might imply a duty to avoid misleading. Augustine's framework lacks resources to forbid (B) without appealing to consequences, which he rejects, so it licenses such misleading.

  (c) Augustine ranks lies by seriousness: lies in religious doctrine are worst; lies to protect life or chastity are least bad. This ranking does not concede that any lie is permissible; it only acknowledges that some lies are less harmful or less vicious. The ranking is based on the object of the lie, not the consequences. For example, a lie about God corrupts the soul more than a lie to save a life. Thus, the ranking is compatible with absolutism: it categorizes sins but does not justify them. It does not concede that outcomes can make a lie right, only that the gravity of the sin varies. Augustine insists that even to save a life, lying is sinful, though less so than lying for trivial reasons. The ranking reflects the objective disorder caused by the lie, not a utilitarian calculation.

  (d) The best reconstruction is (ii): an absolutism about the proper function of signs that generates a notion of epistemic entitlement owed to the hearer. Augustine's core rationale is that signs are meant to convey the mind; this implies that hearers have a right to receive what the speaker intends. When we speak, we undertake to express our mind. Thus, engineered misleading like (B) violates this entitlement, even if it avoids doubleness. In the treatises, Augustine does not explicitly state this, but it is implicit in his rationale. For instance, he condemns lies because they misuse signs, harming both speaker and hearer. The strongest objection is that Augustine focuses on the speaker's state (doubleness) and never explicitly says the hearer has a right. But his account of signs as social instruments implies that deception, even without false assertion, betrays the communicative act. The unstable oscillation view (iii) is tempting because Augustine sometimes emphasizes the speaker's integrity (e.g., in defining lying) and sometimes the function of signs. But the function of signs is foundational: it explains why doubleness is wrong. Without it, the prohibition is arbitrary. Therefore, reconstruction (ii) best captures the underlying logic, even if Augustine did not fully develop it.

