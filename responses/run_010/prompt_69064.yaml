  ### Closing Note  
  This question separates memorization from understanding by demanding application to novel cases (e.g., why (B) is permitted despite deception) and reconciliation of tensions (e.g., doubleness vs. signs rationale). A weak answer reveals itself in sentences like, "Augustine forbids (B) because it’s deceptive"—confusing his criterion (doubleness) with intuition. Strong answers recognize (B) evades his formal definition but strains his deeper principles, exposing a fault line in the framework.
