  ### Model Answer (727 words)  
  Augustine’s treatises on lying establish an absolute prohibition: lying is always sinful. A lie requires *doubleness of heart*—asserting what one does not believe—regardless of truth-value. Signs must convey the mind’s content; lying corrupts this function. Concealment, however, is permitted if no false assertion is made.  

  **(a)** For (A), Augustine forbids it as a lie. The speaker asserts a falsehood they disbelieve, satisfying doubleness of heart. This is a lie to protect life—least serious but still impermissible. For (C), silence or refusal is permitted. No assertion occurs, so doubleness is impossible; Augustine allows withholding truth. For (B), Augustine permits it. The statement is true and believed (no doubleness), though intended to mislead. His criterion focuses on the speaker’s belief, not the hearer’s inference. For (D), Augustine forbids it as a lie. The speaker resolves ambiguity privately to match their belief but *intends* the hearer to accept a false interpretation. This creates doubleness: the speaker asserts what they know the hearer will falsely believe.  

  **(b)** Replies (B) and (D) expose tension. In (B), doubleness is absent (truthful assertion), so Augustine permits it. Yet his rationale—that signs convey the mind—is violated because the householder *withholds* their full belief (that the fugitive is in the roof). The sign is weaponized to create false belief, frustrating communication’s purpose. In (D), doubleness is present (forbidden), but the violation of the signs’ function is similar: the speaker’s private resolution blocks the mind’s conveyance. Augustine’s framework *licenses* (B)-type deception because it lacks resources to forbid misleading without doubleness. He cannot condemn (B) without appealing to consequences (e.g., the officer’s deception), which he rejects. His criteria pull apart: doubleness governs permissibility, but the signs rationale condemns intentional misleading *whenever* it subverts the mind’s conveyance.  

  **(c)** Augustine’s ranking orders lies by seriousness: worst are lies about doctrine; least bad are lies to protect life or chastity. This concedes that *some lies cause graver moral harm* but does *not* concede that consequences can justify lying. The ranking reflects the lie’s *object* (e.g., corrupting religion vs. shielding life), not its outcomes. A lie to save life remains sinful—just less vicious than a lie for trivial gain. Thus, the ranking *is* compatible with absolutism: it categorizes the intrinsic disorder of the lie, not its results. Augustine insists no good intention (e.g., saving life) redeems a lie; the ranking merely acknowledges varying degrees of damage to truth and charity.  

  **(d)** The best reconstruction is (ii): absolutism about the function of signs, generating a notion of epistemic entitlement for the hearer. Augustine’s core rationale is that signs exist to convey the mind. This implies a duty to avoid intentional misleading—even without doubleness—because hearers are owed access to the speaker’s belief. In (B), the householder breaches this by exploiting the officer’s trust in signs. The strongest objection is that Augustine emphasizes the *speaker’s heart* (e.g., defining lying by doubleness) and never explicitly grants hearers entitlements. However, his treatise against infiltrating heretics argues that deceptive speech corrupts *communication itself*, harming both parties. This assumes signs have a social purpose: to transmit truth. When we speak, we implicitly promise to share our mind. (B)-type deception betrays that promise, violating the hearer’s entitlement.  

  Reconstruction (i) (speaker integrity alone) fails because it cannot explain why *non-lying* deception like (B) is troubling for Augustine. Reconstruction (iii) (oscillation) is descriptively accurate but avoids resolving the tension. The signs-based view (ii) is *foundational*: it explains why doubleness is sinful (it corrupts communication) and why (D) is worse than silence. Augustine’s framework decides this: the function of signs is the bedrock justifying his absolutism. Without it, the prohibition on lying is arbitrary.  

