  ### Setting Rationale (Planning Step)
  The crux of Augustine's framework lies in the tension between his subjective criterion for lying (doubleness of heart) and the objective purpose of signs (to convey the mind's content). This case is built to expose whether engineered deception without false assertion—especially in (B) and (D)—violates Augustine's deeper rationale even when it evades his formal definition of a lie. A summarising answer would correctly identify that (A) is forbidden as a lie, (C) is permitted, (B) is permitted (as not a lie), and (D) is forbidden (as a lie). It might note the ranking's compatibility with absolutism. However, it would stall at explaining *why* (B) strains the function-of-signs rationale, whether Augustine *should* forbid it given his principles, and how the ranking avoids consequentialism. Crucially, it would treat the speaker/heart focus and signs/mind focus as harmonized rather than probing their potential divergence, missing the central philosophical instability.

  ### Exam Question  
  **Question (Total: 30 marks; Time: 90 minutes; Write approximately 1,400 words)**  

  *Case*: During a persecution, an officer asks a Christian householder whether a fugitive is hidden in the house. Minutes earlier, the householder moved the fugitive from the cellar to a concealed roof space. The householder considers four replies:  
  - **(A)** A false denial that anyone is hidden in the house (believed false by the speaker).  
  - **(B)** A truthful statement that the cellar is empty (believed true), chosen to make the officer infer no one is hidden anywhere.  
  - **(C)** Refusal to answer or silence.  
  - **(D)** An ambiguous utterance, privately resolved by the speaker to match their belief, but interpreted differently by the officer.  

  *Tasks*:  
  (a) For each reply (A–D), determine whether Augustine would: forbid it as a lie; permit it; or deem it a lie but of reduced seriousness. Explain *which element(s)* of his criteria (e.g., doubleness of heart, truth-value, permissibility of concealment) decide your classification. (8 marks)  
  (b) Focusing on (B) and (D), examine whether Augustine’s *doubleness-of-heart criterion* and his *rationale that signs exist to convey the mind’s content* pull apart. Does his framework forbid engineered misleading without false assertion, or license it? (8 marks)  
  (c) Explain what Augustine’s *graded ranking of lies* (from most to least serious) does and does not concede to consequences. Is this ranking compatible with his claim that *no lie is ever permissible*? Justify. (6 marks)  
  (d) Defend a verdict on which reconstruction best captures Augustine’s position:  
  (i) Absolutism about speaker integrity (no epistemic entitlement owed to hearers);  
  (ii) Absolutism about the function of signs (generating such entitlement);  
  (iii) Unstable oscillation between (i) and (ii).  
  What in his framework decides your choice? (8 marks)  

  *Rubric*: Identify arguments descriptively. Do not use chapter numbers, page references, or quotations.  

