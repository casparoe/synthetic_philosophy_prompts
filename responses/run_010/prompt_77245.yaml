prompt: |-
  Six weeks into a new job as a peer support specialist on a community mental health team, and a big chunk of my week is now sitting with people while they write psychiatric advance directives — the documents where you say, while you're well, what should happen if you get unwell and start refusing things. Half of it is logistics and phone numbers. The other half is one question I keep failing to answer well: when should the document say trust the future version of this person, and when should it say the future version of this person is precisely the one not to trust?

  The reason this is urgent rather than academic is that the first directive I helped draft has gone sideways. It got used last month to override a woman who said, perfectly coherently, that it wasn't her anymore and she'd changed her mind, and my initials are on the assessment note. I still think we did the right thing. I can't articulate why, and I have to do this several times a month now.

  I did a philosophy degree before I fell out of academia, and the thing rattling around in my head is van Fraassen's Reflection principle — roughly, if you're confident your future self will believe something, you should believe it now too, because your future self has everything you have plus whatever you're about to learn. Which sounds like a clean argument for writing "defer to future me" into everything. But it obviously can't be, because half the time the entire point of these documents is that future me will be sleep deprived, manic, terrified, or surrounded by people telling her she's fine. I also vaguely remember the principle needing qualification — something about the difference between changing your mind because you learned something and changing it because something was done to you — and I can't reconstruct where that line goes or what it's doing there.

  So: can you turn this into a procedure I can actually run in a room with someone, and that ideally they can run themselves with a piece of paper?

  Constraints. Sessions are 45 minutes, sometimes less. People are often anxious and I'm often interrupted. Our team runs from nurses to ex-patients to a psychiatrist who signs off at the end and has zero patience for epistemology. Nothing can involve numbers or formulas. I want questions to ask in order, what counts as a good enough answer to each, the point where it stops with "no, don't write that clause," and the point where it hands the decision to a human because it's a question of values rather than facts.

  Then tell me which distinctions from the actual theory have to survive the dumbing-down and which can be dropped, correct me where I've mis-stated what Reflection says, and be straight about where the procedure will misfire even when followed exactly.

  One thing I'll flag myself: most of what goes into these documents is about what someone wants done to them, not about what they believe is true, and Reflection is a principle about belief. Does that mismatch sink the whole idea, or is there a version that carries over?

  Run it on three that are live for me:

  1. M, bipolar I, stable right now on lithium. She wants a clause saying that if she's manic and refusing medication, the document wins and she gets treated. Fine. But she also told me, calmly, that she's come to think the diagnosis over-reads her life, that the medication flattens her, and that she expects to be convinced in a couple of years that she never needed it at all — and she wants that future conviction respected as well. She doesn't see the tension. My gut says the first prediction is distortion and the second is her thinking, and I dont have a way to show her that isn't just my preference.

  2. S, 24, sharp and furious, in the middle of a legal case against her stepfather. She wants the directive to bar him from visiting, and to state explicitly that if she later changes her mind — she expects she will, once the case ends and everyone starts pressuring her — the bar stays. I want to give her this. But the change she's predicting isn't mania or drugs, it's her learning things about her family and about her own feelings, which looks exactly like the kind of change Reflection says to defer to. Which of us has it right?

  3. T, 68, early memory problems, writing about refusing care at home. What he fears isn't distortion, it's that he won't remember making the document, or won't remember what the last crisis felt like. Does deference even make sense toward a future self who has strictly less information than I do? And does it change if the thing he's most afraid of is that future-T won't mind being neglected — that the change will be in how much things bother him rather than in what he believes?

  Finally: tell me how confident you are in the steps you're giving me, and single out the one claim in your answer you'd be least willing to defend if someone pushed on it.
reasoning: |-
  Okay, let me start by really understanding what this peer support specialist is dealing with. They're six weeks into their job, helping people draft psychiatric advance directives (PADs), and hitting a core ethical dilemma: when to trust future selves versus when to override them. The urgency comes from a real case where a directive they helped create was used to override a coherent person's current wishes, and they're grappling with the philosophical underpinnings of that decision.

  First, I need to unpack their reference to van Fraassen's Reflection Principle. It states that if you're confident your future self will believe something, you should believe it now too. But as they rightly point out, this can't apply when the future self is compromised—like during mania or psychosis. The key qualification they're struggling with is the difference between rational belief updates (where Reflection applies) and compromised states (where it doesn't).

  The user's constraints are crucial here: sessions are short (45 mins), clients may be anxious, and the output must be actionable without academic jargon. Plus, the psychiatrist signing off has "zero patience for epistemology." So whatever framework I propose needs to be concrete, question-based, and values-focused.

  The core challenge is translating belief-based philosophy into care preferences. I recall that autonomy isn't just about consistent beliefs—it's about protecting the conditions for authentic decision-making. That gives me a hook: we can frame it as distinguishing between "core self" and "compromised self" using practical proxies like cognitive capacity and continuity of values.

  For the procedure, I'm thinking of a simple flowchart approach: first identify if the predicted change involves new information or distorted processing. But since "distorted" is loaded, better to ask about external pressures or capacity loss. Then check if the change aligns with lifelong values or contradicts them. 

  Now applying this to their cases: 
  - For M (bipolar), her future refusal of meds during mania clearly meets the "compromised capacity + value discontinuity" criteria. But her second prediction about later rejecting the diagnosis entirely? That's trickier—it might be authentic growth. The framework would flag this as "new information + value alignment?" requiring deeper discussion.
  - S (trauma survivor) wants to lock in her no-contact directive despite expecting future pressure to relent. Here, Reflection doesn't apply because her predicted change stems from coercion, not insight. The framework should validate her as the "core self."
  - T (memory loss) introduces capacity attrition. Reflection fails when future selves have less information. The key question becomes whether his current values about dignity should bind his future self who may adapt to neglect.

  Biggest vulnerability I see: the "values continuity" question assumes a stable core self, which isn't always true—people evolve. I'd be least confident defending that as a bright line. Also, calling current wishes "core" privileges the moment of drafting, which could be problematic. But for clinical practicality, it's the best anchor we have.

  The mismatch between belief principles and care preferences? Actually survivable. We're not applying Reflection directly; we're using its *spirit* to design a heuristic about when to defer. The output is values-based, not truth-based—so we focus on "which self best represents your enduring priorities?"

  Final structure: a 4-step flowchart (Capacity? Coercion? Values? Continuity?) with clear branch points, then applying it to each case. Must emphasize that steps 3/4 are values calls where the client decides. And flag that predicting one's own future compromise is inherently messy—the procedure just makes the reasoning transparent.
answer: |-
  Here's a practical procedure distilled from the philosophy, designed for 45-minute sessions with anxious clients and zero tolerance for jargon. It addresses your core question ("When to trust future-me?") and handles your cases. The Reflection Principle is adapted—not applied directly—because **PADs are about *values* and *preferences* under compromised capacity, not belief updating**.

  ### The "Core Self vs. Compromised Self" Procedure (15-20 mins)
  **Goal:** Decide if a future refusal/request should be overridden by the current PAD.  
  **Tools:** Pen, paper divided into two columns: "**Protect Future-Me**" (trust future self) vs. **"Protect Current-Me**" (override future self).  
  **Ask these questions in order:**

  1.  **"Is the future situation you're worried about caused by something blocking your ability to think clearly or feel like yourself? (e.g., psychosis, mania, severe dissociation, overdose, withdrawal, extreme terror that shuts down thinking)?"**
      *   **YES → Leans toward "Protect Current-Me" (Override future refusal).**  
          *Why?* This predicts a *compromised capacity* state. Future-self isn't "learning more," they're operating with a broken decision-making apparatus. *(Reflection fails here - the "plus what you learn" is corrupted).*
      *   **NO → Go to Question 2.**  
          *(e.g., Future change due to new life experiences, therapy insights, shifting priorities with age).*

  2.  **"Do you think that future 'change of mind' would happen mainly because other people are pressuring you, tricking you, or making you afraid to say what you really want?"**
      *   **YES → Leans toward "Protect Current-Me" (Override future request/consent).**  
          *Why?* Future-self isn't making a free choice; they're coerced or manipulated. *(Reflection fails - the change isn't from learning, but from external force).*
      *   **NO → Go to Question 3.**  
          *(e.g., Future change from genuine reflection, new information about health, personal growth).*

  3.  **"Would that future choice go against what feels deeply true or important to the 'real you' *right now*? (Think about your core values, what makes life worth living, or what you've *always* believed matters most, even when you've struggled)."**
      *   **YES → Leans toward "Protect Current-Me" (Override future choice).**  
          *Why?* Even with new info or growth, this suggests the predicted future choice represents a *betrayal of core identity/values*, not just a change. The current "core self" gets priority.
      *   **NO → Leans toward "Protect Future-Me" (Trust future choice).**  
          *Why?* The predicted future change sounds like authentic growth, learning, or adaptation. Future-self, with more experience/knowledge, should be trusted. *(This is where Reflection-type thinking ethically applies to preferences).*

  4.  **"Is the thing you fear losing (or being forced into) something that could cause permanent, severe harm if future-you gets it wrong? (e.g., death, irreversible injury, severe trauma, losing custody of kids, becoming homeless)?"**
      *   **YES → Leans toward "Protect Current-Me" (Override).** *Use cautiously!* Combines with Q1/Q2/Q3 outcomes. Tilts the scale towards protecting the current, capacitated self when stakes are catastrophically high.
      *   **NO → Weaker reason to override.** Trusting future-self is less risky.

  **Decision Point:**
  *   **"Protect Current-Me" (Override Future Choice):** If Q1=YES *or* Q2=YES *or* (Q3=YES + Q4=YES carries weight). **Write the clause into the PAD.** (e.g., "Even if I refuse medication during mania, administer it as specified below").
  *   **"Protect Future-Me" (Trust Future Choice):** If Q1=NO *and* Q2=NO *and* Q3=NO. **Do NOT write an overriding clause.** Future competent choices prevail. *Or* write a *recommendation* (not a mandate), like "I currently believe X, but my future competent self should decide."
  *   **Ambiguous/Values Conflict:** If answers are mixed (e.g., Q1=NO, Q2=NO, Q3=YES but Q4=NO), **STOP. This is a values call.** Say: "This is really about what matters most to you. Do you think your *deepest values right now* deserve the final say here, even if future-you genuinely changes? Or should future competent-you have the freedom to make that choice, even if you disagree with it now?" **The client decides.** Document their reasoning briefly.

  ### What Survived the Dumbing-Down & Corrections
  *   **Survived:** The core distinction between *rational updating* (trust future-self) vs. *compromised capacity/coercion* (override). This is the essence of why Reflection needs qualification. Van Fraassen's principle assumes rational updating; PADs exist because mental illness often prevents that.
  *   **Survived:** The "external force" qualification you vaguely recalled. Reflection applies when beliefs change based on *evidence*, not coercion or impairment (Q2).
  *   **Correction:** Reflection is about *belief* and *confidence* in future beliefs. You're right – PADs are about *preferences/values* under *impaired capacity*. We didn't carry over Reflection *directly*; we used its *failure conditions* (impaired capacity, coercion) to build a practical test for when override is justified. The "core values" (Q3) piece comes from ethical autonomy theory, not Reflection.
  *   **Dropped:** The formal probabilistic structure, the idea of "confidence," and strict belief updating. Not relevant to clinical preferences.

  ### Where It Might Misfire
  1.  **Misjudging Capacity:** A client might misattribute future resistance to illness (Q1=YES) when it could be rational dissent, or vice-versa. The procedure relies on their *prediction*, which can be flawed.
  2.  **Identifying "Core Values" (Q3):** This is inherently fuzzy. What feels "core" now might shift. Someone in a depressive episode might undervalue life-saving treatment. The question tries to capture their *enduring* sense of self, but it's imperfect.
  3.  **High Stakes Override (Q4):** Risk of paternalism. Just because stakes *seem* high now doesn't mean overriding future autonomy is always justified. Use Q4 only in combination with other strong reasons (Q1/Q2/Q3=YES).
  4.  **The "Core Self" Privilege:** The procedure implicitly privileges the *current capacitated self* as the "real" self. This is clinically and ethically standard for PADs but philosophically debatable. People *do* authentically change.

  ### Running Your Cases
  1.  **M (Bipolar):**
      *   **Q1 (Mania/Refusal):** YES (Mania impairs capacity) → **Override clause for med refusal during mania is justified.**
      *   **Q1 (Future rejection of diagnosis):** NO (Not predicting an *impaired* state).
      *   **Q2:** NO (Not predicting coercion).
      *   **Q3:** YES? (She *currently* feels future conviction would betray her core understanding *now* - "never needed it" contradicts her current acceptance of stability). **Leans Override.**
      *   **Q4:** YES? (Risk of destabilization/harm if untreated).
      *   **Decision:** Strong case for "Protect Current-Me" regarding forcing meds *during mania*. For the *future belief about diagnosis*, it's ambiguous (Q1=NO, Q2=NO, Q3=YES). **Values Call:** Discuss Q3 deeply. Does she believe her *current* judgment about needing meds is so core that even a future competent self rejecting it should be overridden? Or should future competent-her have freedom to reassess? *Document her choice.* Gut feeling: Respecting future competent belief (no override) is usually safer, but her core fear is valid. Frame it as: "We lock in actions for *crisis*, not beliefs. Your future competent self can always *choose* to stop meds later, based on their beliefs then. The PAD ensures they can make that choice *safely* (not while manic)."

  2.  **S (Trauma/Stepfather):**
      *   **Q1:** NO (Predicts change from learning/feelings, not impairment).
      *   **Q2:** **YES** (Predicts change *due to pressure* - "everyone starts pressuring her"). **→ Override clause is justified.**
      *   *Stop here.* Q2=YES is sufficient. Her prediction is of *coercion*, not rational updating. Reflection doesn't apply. **Write the clause barring him regardless of future consent.**

  3.  **T (Memory Problems):**
      *   **Q1:** Not psychosis/mania, but **YES** (Severe memory loss *impairs capacity* to recall the directive, the reasons for it, and the severity of past crises). **→ Override clause for refusal of care is justified** based on impaired capacity.
      *   **Q3:** Crucial add-on. His fear isn't just forgetting, it's *values drift* ("won't mind being neglected"). Q3 would likely be **YES** (Future acceptance of neglect betrays his current core value of dignity/safety). Reinforces override.
      *   **Reflection Misfire Confirmed:** Future-T has *less* information (forgotten experiences) and potentially *distorted* preferences due to cognitive decline or learned helplessness. Deference makes little sense.

  ### Confidence & Vulnerability
  *   **Overall Confidence: 85%.** The procedure directly targets your urgent dilemma using robust ethical principles (respect for autonomy requires protecting the *conditions* for autonomy - hence overriding during impairment/coercion) and practical clinical reasoning. It fits your constraints.
  *   **The Vulnerable Claim:** **"The 'core self' identified during the drafting session is the best anchor for making override decisions."**
      *   **Why it's vulnerable:** The "core self" isn't a fixed, perfectly knowable entity. Someone drafting a PAD might be influenced by temporary moods (e.g., residual depression, anxiety about relapse), recent events, or even the power dynamic with you. Privileging *this specific moment* over *all future competent moments* is a necessary but imperfect clinical compromise. A philosopher could argue it's arbitrary or risks fossilizing preferences.
      *   **Why I'd still use it:** In the messy reality of mental health crises, the capacitated self drafting the PAD *is* the best available proxy for the individual's authentic, considered wishes. The procedure mitigates risks by limiting override to specific, predicted failure states (impairment, coercion) and high-stakes value betrayals, and by explicitly flagging ambiguous cases for pure values decisions by the client.

  **In essence:** This procedure turns "When not to trust future-me?" into concrete checks for **Broken Thinking (Q1), Outside Pressure (Q2), Betrayal of Core Self (Q3), and Catastrophic Risk (Q4).** It gives you a defensible, non-academic structure for those critical clauses, while leaving pure values choices clearly in the client's hands.
