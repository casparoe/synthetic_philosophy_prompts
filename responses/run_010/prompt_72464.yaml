prompt: |-
  I run an argument-night at a bookshop once a month, about fourteen people, mostly not academics but they read, and next month we're doing Tolstoy's What Is Art?. I don't want the usual "he trashed Shakespeare therefore he was an idiot" forty minutes, so I've put together a scorecard of objections to the infection theory and I want the room to vote on how much damage each does before I show them mine. I need yours first, so I've got something to push against.

  Here they are the way I've worded them for the handout:

  1. **Channel.** Infection only takes if the receiver is already disposed to catch the feeling, so what the theory is really measuring is a fit between work and audience rather than a property of the work. Same piece, two people, one infected and one bored: which one gets to decide whether it's art?

  2. **Sincerity is private.** Tolstoy makes sincerity the decisive condition of quality, but sincerity isn't visible from outside, and a forger who convinces everybody is indistinguishable from the sincere one. Either the criterion collapses into "it worked on us," or it's a claim about souls that no critic can check.

  3. **Output refutes the author.** The theory ranks a village lament, or a parable about forgiveness, above most of what the theory's own author wrote, and he seems to have accepted the ranking. So either he's right and his life's work is second-rate, or he's wrong and the theory has just condemned its best piece of evidence.

  4. **Form goes missing.** Nothing in the account explains why the transmission has to happen through this particualr arrangement of words or sounds rather than another. If all that matters is that the feeling arrives, a summary of the story should be as good as the story.

  5. **Bad infection.** Lots of works transmit feeling with total clarity and sincerity and unite their audience around something vile. Tolstoy has a content filter for this — the religious perception of the age, the brotherhood of everyone — but the moment he needs it, the definition of art and the evaluation of art have come apart: the vile work is art, just bad art, which is not at all what the infection story sounded like when he first told it.

  6. **Instrumental music.** A good deal of music transmits no feeling anyone could name before or afterwards, yet music is supposed to be the paradigm case of infection.

  Score each one on two axes, 0 to 10: damage to infection theory as a *definition* of art, and damage to it as a *criterion of value*. Both numbers for every objection, then a single ranking of the six by overall damage, with a sentence or two each on what makes it land or not land. Then tell me which one I should put in front of the room first for maximum damage, and which one sounds devastating to amateurs but is actually the easiest for a Tolstoyan to answer — I want to be able to spring that one on them.

  Last thing: give me a fraction, your honest estimate, of the chance the room walks out thinking the theory is worth keeping in some modified form rather than binning it.
reasoning: |-
  Okay, the user runs a monthly argument-night at a bookshop with about fourteen non-academic but well-read participants. Next month, they're discussing Tolstoy's "What Is Art?" and want to avoid the usual shallow criticism of Tolstoy trashing Shakespeare. Instead, they've prepared a scorecard of objections to Tolstoy's infection theory of art and want me to score each objection on two axes: damage to the definition of art and damage to the criterion of value. Then rank them by overall damage, identify which to present first for maximum impact, and which seems devastating but is actually weak. Finally, estimate the chance the group thinks the theory is worth keeping.

  First, I need to recall Tolstoy's infection theory. He defines art as a means of transmitting feelings from artist to audience through a work. The sincerity of the artist, clarity of the feeling, and the work's ability to "infect" the audience are key. Good art must also align with the religious morality of the time, promoting brotherhood. But the user has six objections, each challenging different aspects.

  Let me break down each objection and score them on both axes (0-10) for definition and criterion damage. The definition is what constitutes art, and the criterion is how we value it.

  **Objection 1: Channel.** The issue here is that infection depends on the audience's disposition. If the same work infects one person but not another, who decides if it's art? This seems to undermine the objectivity of the definition. For the definition, it questions whether the work's property or the audience's receptiveness defines art. Damage to definition: high, maybe 8. For criterion, if value depends on infection, but infection varies, then the criterion becomes subjective. Damage: 8. Overall, this hits both hard because it makes art relative to the audience.

  **Objection 2: Sincerity is private.** Sincerity is internal and unverifiable. A forger could be indistinguishable from a sincere artist. So, the criterion either collapses into effectiveness (it worked) or is mystical. For definition, if sincerity is key but uncheckable, how can we define art based on it? Damage: 9. For criterion, evaluating art becomes impossible without accessing the artist's soul. Damage: 9. This is a big problem because Tolstoy hinges so much on sincerity.

  **Objection 3: Output refutes the author.** Tolstoy's own work is deemed inferior by his theory. So, either he's right and his work is second-rate, or he's wrong, and the theory fails on its own evidence. This attacks the theory's consistency. For definition, if Tolstoy's works aren't top art, but the theory is based on his view, it might not directly damage the definition itself. Definition damage: 6. For criterion, it shows the theory devalues its creator's work, which is ironic and undermines credibility. Criterion damage: 8. Overall, it's more about internal contradiction than the core ideas.

  **Objection 4: Form goes missing.** If the feeling is what matters, a summary should work as well as the artwork. But form is crucial in art. This challenges why specific forms are necessary. For definition, infection theory might not account for the medium, so it doesn't fully define art. Damage: 7. For criterion, if form isn't important, then value is only in the feeling transmitted, ignoring craftsmanship. Damage: 8. This is strong because art's form is integral to its experience.

  **Objection 5: Bad infection.** Works can transmit vile feelings sincerely and clearly. Tolstoy adds a moral filter (religious perception), but that separates definition from evaluation. So, vile art is still art but bad, which contradicts the initial infection story. For definition, it shows infection alone isn't sufficient for good art, so the definition might be okay, but damage: 3 since art is still defined. For criterion, the moral filter means infection isn't enough for value, so the criterion is damaged: 10. This highlights that Tolstoy smuggles in morality, weakening the value criterion.

  **Objection 6: Instrumental music.** Music often transmits unnameable feelings, but infection theory requires identifiable feelings. If music is a paradigm, this challenges the theory's applicability. For definition, if music infects without clear feelings, does that mean it's not art? Damage: 8. For criterion, if we can't name the feeling, how do we evaluate it? Damage: 7. This is significant because Tolstoy himself struggled with music in his theory.

  Now, ranking them by overall damage (definition + criterion scores):

  - Objection 2: 9+9=18 (sincerity private)
  - Objection 5: 3+10=13 (bad infection)
  - Objection 1: 8+8=16? Wait, earlier I said 8 and 8, so 16. But let me check consistency. Actually, in my initial notes, I had Obj1 as 8/8, Obj2 as 9/9, Obj3 as 6/8 (14), Obj4 as 7/8 (15), Obj5 as 3/10 (13), Obj6 as 8/7 (15). Wait, that doesn't add up right. Recalculating totals:

  Obj1: 8 + 8 = 16  
  Obj2: 9 + 9 = 18  
  Obj3: 6 + 8 = 14  
  Obj4: 7 + 8 = 15  
  Obj5: 3 + 10 = 13  
  Obj6: 8 + 7 = 15  

  So ranking:  
  1. Obj2 (18)  
  2. Obj1 (16)  
  3. Obj4 and Obj6 tied at 15, but Obj4 has higher definition damage? Need to break ties. Perhaps overall impact: Obj2 first, then Obj1, then Obj6 (music as paradigm), then Obj4, Obj3, Obj5. But Obj5 has lower total but high criterion damage. For the room, Obj2 and Obj1 might be most accessible.

  Best to present first for max damage: Objection 2 (sincerity private). It's fundamental and easy to grasp. Amateurs might think "how can we know the artist was sincere?" and it directly challenges the theory's practicality.

  Seems devastating but easiest to answer: Objection 3 (output refutes author). A Tolstoyan could argue that Tolstoy's later religious works align with his theory, and his earlier novels were steps toward sincerity. Or that he acknowledged his own works' flaws. So it's more biographical than theoretical.

  Fraction for keeping the theory: The group is non-academic but thoughtful. They might see value in the core idea of art transmitting emotion, even if flawed. Say 1/3 chance they think it's worth keeping, modified (e.g., without sincerity or with flexible morality).
answer: |-
  Below is my rigorous scoring and analysis of your six objections to Tolstoy's infection theory, based on *What Is Art?*. I've scored each on a 0–10 scale for damage to Tolstoy's definition of art (as a tool for identifying art) and damage to his criterion of value (as a tool for judging art's worth), then ranked them by overall impact. I'll follow with tactical advice for your session and a fractional estimate of the theory's survival odds. My approach prioritizes where Tolstoy is most vulnerable—his insistence that infection *defines* art while also serving as the *standard* for its moral/aesthetic value. 

  ### Scores and Rankings  
  *(Scores: Definition Damage / Value Criterion Damage → Total Damage)*  

  1. **Channel** (Infection depends on audience receptivity)  
     - **Definition Damage**: 9/10 — If art is defined by successful infection, but infection requires preexisting audience disposition, the definition becomes circular. It measures audience-artwork "fit," not an intrinsic property. This collapses into subjectivism: a work is only "art" for those it infects.  
     - **Value Criterion Damage**: 8/10 — If value depends on infection success, but success is audience-dependent, then "good art" is just "art that worked for you." Tolstoy’s universalism (art unites humanity) implodes.  
     - **Total**: 17/20  
     - **Why it lands**: It’s intuitive—everyone has experienced loving a piece others hated. Forces the question: "Is art a thing or an experience?"  

  2. **Sincerity is private** (Sincerity is unverifiable)  
     - **Definition Damage**: 10/10 — Fatal. If sincerity is essential to infection but unknowable, the definition is useless. Critics can’t apply it; a perfect forger creates "art" by Tolstoy’s lights. Reduces to "we were moved, so artist must have been sincere."  
     - **Value Criterion Damage**: 9/10 — Sincerity is Tolstoy’s anchor for quality. If we can’t verify it, value judgments become guesswork about the artist’s soul. The moral weight of "sincere" art evaporates.  
     - **Total**: 19/20  
     - **Why it lands**: Non-academics grasp forgery scandals (e.g., fake diaries). It reduces Tolstoy’s spiritual ideal to a practical absurdity.  

  3. **Output refutes the author** (Tolstoy’s theory condemns his own work)  
     - **Definition Damage**: 4/10 — Doesn’t directly attack the definition. A theory can coherently label its author’s work "bad art" (e.g., Marx on capitalists).  
     - **Value Criterion Damage**: 7/10 — Moderate damage. If Tolstoy accepts his novels are inferior to folk tales, it exposes hypocrisy or delusion. But the criterion *could* survive if he’s consistent ("I failed, but the theory is right").  
     - **Total**: 11/20  
     - **Why it lands/doesn’t**: Feels like a "gotcha" but is ad hominem. Amateurs love biographical drama (Tolstoy’s guilt!), but it doesn’t touch the theory’s core logic.  

  4. **Form goes missing** (Why not replace art with summaries?)  
     - **Definition Damage**: 8/10 — Infection theory treats form as a vehicle for feeling. If a summary transmits identical feeling, why is *Anna Karenina* "art" but its CliffsNotes not? Undercuts art’s formal essence.  
     - **Value Criterion Damage**: 7/10 — If form doesn’t matter, value rests solely on the feeling transmitted. But Tolstoy praises formal "clarity," contradicting himself.  
     - **Total**: 15/20  
     - **Why it lands**: Readers instinctively feel *how* a story is told matters. Highlights Tolstoy’s neglect of craft.  

  5. **Bad infection** (Art can transmit vile feelings sincerely)  
     - **Definition Damage**: 3/10 — Minimal. The theory *can* define vile works as "art" (they infect). Tolstoy’s moral filter ("religious perception") is an *add-on* for value, not definition.  
     - **Value Criterion Damage**: 10/10 — Devastating. If clear, sincere infection of hate (e.g., propaganda) is "good art" by infection standards, Tolstoy must invoke external morality to condemn it. But then infection isn’t the criterion—morality is.  
     - **Total**: 13/20  
     - **Why it lands**: Nazis used art; everyone knows "effective" evil exists. Exposes Tolstoy’s bait-and-switch: infection defines art, but morality judges it.  

  6. **Instrumental music** (Music infects without namable feelings)  
     - **Definition Damage**: 8/10 — Tolstoy demands art transmit specific feelings (e.g., "joy at reunion"). Music often evokes wordless moods, so by his strict terms, most music isn’t "art." Yet he calls it paradigmatic.  
     - **Value Criterion Damage**: 6/10 — If music infects without identifiable feelings, how do we rank it? "Unnameable awe" vs. "named feeling" (e.g., grief) becomes arbitrary.  
     - **Total**: 14/20  
     - **Why it lands**: Music is emotional but abstract—people feel this tension. Challenges Tolstoy’s literalism.  

  ### Overall Ranking by Damage (Highest to Lowest)  
  1. **#2: Sincerity is private** (19/20) — Destroys foundations by making the theory untestable.  
  2. **#1: Channel** (17/20) — Reveals infection as relativistic, not universal.  
  3. **#4: Form goes missing** (15/20) — Attacks art’s necessity; feels obvious to non-experts.  
  4. **#6: Instrumental music** (14/20) — Exploits Tolstoy’s poor handling of abstraction.  
  5. **#5: Bad infection** (13/20) — Cripples the value criterion but leaves definition intact.  
  6. **#3: Output refutes the author** (11/20) — Theatrical but theoretically weakest.  

  ### Tactical Advice for Your Session  
  - **Open with for maximum damage: #2 (Sincerity is private)**. It’s the most philosophically lethal and easy to illustrate ("How do we *know* Van Gogh was sincere? What if he faked it?"). It forces the room to confront the theory’s impracticality early, setting a skeptical tone.  
  - **Spring this "devastating" objection last—it’s actually the easiest to answer: #3 (Output refutes the author)**. Amateurs will pounce on the biographical irony ("Tolstoy says his work sucks—so his theory must be wrong!"). But a prepared Tolstoyan can argue:  
    - "Tolstoy *agreed* his early novels were ‘bad art’—he saw them as elitist. His theory is *consistent* with that self-critique."  
    - "The theory isn’t disproven because its author failed; it’s a *goal*."  
    This lets you reveal how personality-driven arguments distract from structural flaws.  

  ### Survival Estimate: Fraction Chance the Room Keeps the Theory  
  **1/4 chance** (25%). Why?  
  - **Non-academics often preserve the core**: They’ll likely agree *some* art "infects" and has moral value, salvaging infection as *one* insight (e.g., "It’s flawed, but emotion-transmission matters").  
  - **What they’ll discard**: Sincerity as a criterion, the conflation of definition/value, and Tolstoy’s moral absolutism.  
  - **Wildcard**: If your group skews spiritual/intuitive, they may defend infection as a "mystical" standard (raising odds to 1/3). If they’re empiricists, it drops to 1/10.  

  **Final Push**: To avoid Shakespeare-sniping, stress that Tolstoy’s theory isn’t *stupid*—it’s a radical, ethics-driven challenge to "art for art’s sake." Your objections show why it fails as a system, but its demand that art *do* something (unite, elevate) remains provocative. That’s worth keeping.
