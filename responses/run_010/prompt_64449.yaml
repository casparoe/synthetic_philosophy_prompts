  - \(S\) = Convex hull of Problem 1’s set and \((0, 1.2)\) (new frontier: linear from \((0,1.2)\) to \((0.2,0.96)\), then \(u_2 = 1 - u_1^2\) to \((1,0)\)).  
  - \(d = (0, 0)\)  
