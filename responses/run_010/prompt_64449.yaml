  **Problem 4 (Asymmetric Linear):**  
  - \(S = \{(u_1, u_2) \mid u_1 \geq 0, u_2 \geq 0, u_2 \leq 2 - 2u_1\}\) (frontier from \((0,2)\) to \((1,0)\)).  
