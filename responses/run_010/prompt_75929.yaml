answer: |-
  The mud of the River Lethe district clung to Assessor Vanya’s boots, a thick, sour-smelling paste as she picked her way past the flood works trench. The steel shoring groaned. Below, the Archival Orders clustered like carrion birds over the spoil heap, their stark grey uniforms – Monumental, Antiquarian, Critical – the only colour against the slurry.

  "Assessor." The Monumental Order’s representative, a man named Rostov with a jaw like a cliff, swept a hand towards the exposed earth wall. "Observe! The scale, the ambition! This isn’t mere foundations. This is the footprint of a *citadel*. Foundational stones suggestive of a defensive outpost, clearly analogous to the Bastion of the Third Dynasty. Proof of a forgotten martial lineage!" He pointed to a jumble of large, roughly-hewn stones protruding from the mud.

  Vanya saw cracked rocks covered in slime. Rostov saw heroic precedent.

  Nearby, the Antiquarian Order’s assessor, a woman named Elara whose face was perpetually dusted with archival chalk, was meticulously cataloging a pile of smaller finds on a tarpaulin. Shards of coarse pottery, a few corroded iron nails, a broken clay pipe stem, a child's wooden top, fragmented animal bones. "Item 17-F: Possible domestic refuse fragment, ceramic, undecorated," she murmured into a recording crystal. "Item 18-A: Ferrous object, indeterminate function, significant corrosion. All require immediate stabilization and permanent, context-preserved relocation to the Deep Repository. Equal weight, equal reverence." She didn’t look up. Every rusty nail held the universe.

  Then there was Silas, from Critical. He hadn’t touched anything. He stood apart, his gaze fixed on a specific cluster of objects near Elara’s pile: several heavy, rusted manacles, still linked by a short chain, half-embedded in the clay. Beside them lay a crude, handmade blade, snapped near the hilt. "Buried evidence," Silas stated, his voice flat, cold. "Concealment of servitude. Instruments of coercion. And resistance, violently suppressed. We require immediate full disclosure protocols. Name the lineage responsible. Identify living beneficiaries. The judgment must be public. The severance absolute." His report wouldn’t recommend preservation; it would demand prosecution.

  Vanya’s stomach churned. This was her first independent assessment. The River Lethe district, a warren of cramped tenements housing mainly two-generation license holders – cheerful, incurious, perpetually *now* – had petitioned for a Horizon Adjustment. The flood works had unearthed… this. And the Orders were tearing it apart.

  Her guide, an elderly local named Gregor whose license badge showed the rare, sobering mark of *four* generations, spat into the mud. "Stinks worse than the river, this squabble. My great-grandfather remembered when this was just marsh. Before the big pumps. Means nothing to us down here, buried muck." He embodied the *unhistorical* – bounded, functional, untouched by the weight below. Vanya envied him his simplicity.

  Back at the Office of Horizons, the air was filtered, scentless, sterile. Vanya’s small office overlooked the Archive complex – three distinct wings, their architecture subtly clashing. She spread the Order reports on her desk, the physical weight of them oppressive.

  Rostov’s (Monumental) was thick with comparative diagrams, overlaying the trench stones onto known citadel blueprints. *Recommendation: Designate site "Lethe Redoubt," erect memorial plinth, integrate discovery into civic heroic narrative. Adjust district Horizon to minimum six generations to foster appropriate reverence.* It promised a glorious past to wear like a costume.

  Elara’s (Antiquarian) was a dense, itemized inventory, every shard and bone fragment listed with identical, numbing precision. *Recommendation: Immediate site preservation under Order custodianship. All materials, regardless of apparent significance, relocated in situ within Deep Repository Section Gamma-9. Maintain current Horizon License (two generations) to prevent destabilizing contextual overload.* It sought to mummify the present under layers of undifferentiated past.

  Silas’s (Critical) was a stark indictment. High-resolution scans focused solely on the manacles and broken blade. Forensic analysis suggested the blade snapped against the chain. *Recommendation: Full public inquest. Subpoena land title records for lineage tracing (suspected: defunct House Vorlag). Identify contemporary descendants/assets for reparation hearings. Adjust district Horizon to nine generations minimum to ensure culpability is fully comprehended.* It demanded blood and severance.

  Vanya’s head throbbed. The ruling was hers. Adjust the Horizon License? Deny it? And if adjust, how many generations? Two was the worker’s bubble, nine the aristocratic cage. Irreversible.

  She needed perspective. Or a warning. She took the elevator down to Sub-Level Sigma, the domain of the Ultra-High License holders. The air grew colder, denser. Here resided the *suprahistorical*.

  She found Scholar Aris Thorne in his reading cell. His license badge bore no number, just a single, obsidian circle. Infinity. His quarters were sparse: a chair, a reading stand, shelves of crystal memory cores. He sat perfectly still, facing a vast data-wall scrolling with centuries of records – births, deaths, edicts, wars, scandals, harvests – an endless, meaningless river of concluded events.

  "Scholar Thorne?" Vanya’s voice echoed slightly.

  His head turned, slowly, like stone grinding on stone. His eyes were clear, intelligent, and utterly devoid of urgency or connection. They saw everything, valued nothing. He didn’t speak. He rarely did. His hand lay on the armrest, pale, unmoving. Not trembling, not clenched. Simply… inert. A plate of untouched nutrient paste congealed beside him. Vanya knew he slept, but only when his body physically collapsed, rebooted, and resumed watching the concluded stream. To act was pointless. Everything that could happen, had happened. Every argument had been made, every outcome already lay in the past. His body was the monument to finished time. He offered no wisdom, only an embodiment of terminal perspective. Looking at him, Vanya felt the crushing weight of totality. She fled the chill, the stillness, the perfect paralysis.

  * * *

  The Hearing Room was stark. Representatives of the three Orders sat rigidly apart. A few nervous River Lethe residents, including Gregor, occupied the public gallery. Vanya sat behind the Assessor's plinth, the reports, the scans of the manacles, the broken blade, the stones, the pottery shards, all laid out before her. The air hummed with suppressed tension.

  She didn’t preamble. "Petition by River Lethe District for Horizon License Adjustment. Findings reviewed. Recommendations considered."

  Rostov leaned forward, radiating confident expectation. Elara stared straight ahead, hands folded in her lap. Silas’s gaze was fixed on Vanya, sharp as the broken blade.

  "The discovery," Vanya began, her voice steady despite the tremor in her hands, "represents a complex historical fragment. It contains elements suggesting habitation, conflict, constraint, and resistance." She saw Silas’s slight nod. "It contains mundane remnants of daily life." Elara’s posture softened minutely. "It contains structures implying significant effort." Rostov almost smiled.

  "However," Vanya continued, the word dropping like a stone, "the Office of Horizons licenses *recall*, not interpretation. Our mandate is the *impact* of the past on present life, not its absolute truth."

  She picked up her ruling crystal. "The monumental interpretation seeks narrative, potentially falsifying through analogy. The antiquarian response would suffocate the present under undifferentiated preservation. The critical demand for judgment, rooted in the present's own flawed substance, risks perpetuating the very cycles it condemns."

  She activated the crystal. A soft chime echoed. "The petition for Horizon License Adjustment is denied. The River Lethe District retains its two-generation license."

  A murmur rippled through the gallery. Gregor grunted, seemingly satisfied. Rostov’s face darkened. Elara blinked, a flicker of something like relief or resignation. Silas’s expression hardened into ice.

  "The unearthed materials," Vanya announced, bracing herself, "shall be processed according to Standard Protocol Gamma." Protocol Gamma: anonymization, neutral categorization, storage in the General Repository. No glorious narrative, no sacred preservation, no public indictment. Just… filing.

  Rostov slammed a fist on the table. "Cowardice! You bury heroism!"

  Elara stood, her voice surprisingly firm. "The context… the intrinsic value… Protocol Gamma is a desecration of equal weight!"

  But it was Silas who cut the deepest. He rose slowly, his voice a low, dangerous rasp. "You bury the crime, Assessor. You condemn those people"— he pointed towards the gallery, towards Gregor — "to ignorance of their own oppression. You leave the wound unopened, the poison in the ground. This is not neutrality. This is complicity." He didn’t shout. The quiet certainty was worse. "Enjoy your shallow peace. While it lasts."

  He turned and walked out, the door hissing shut behind him. The victory felt like ash. Rostov stormed out after him, muttering about wasted potential. Elara gathered her things with trembling hands, her eyes avoiding the ruling crystal. She looked like she was attending a funeral.

  Vanya sat alone in the suddenly cavernous room. The phantom smell of river mud filled her nostrils. She had preserved the district’s bounded horizon, their cheerful ignorance. She had avoided the paralysis of reverence or the fury of judgment. She had chosen the animal’s unburdened present. And she had just made an enemy of the Critical Order, an enemy who saw darkness she had chosen to rebury. The cost wasn't abstract. It was Silas's cold, condemning stare, the knowledge of the manacles and the broken blade entombed in bureaucratic indifference, and the chilling echo of Aris Thorne’s perfect, motionless hands. She had kept the river district cheerful. She had condemned them to remain shallow. And the weight of the buried thing, now officially forgotten, settled onto her own shoulders.

  * * *

  **Post-Story Note:**
  I let the *unhistorical* win, embodied by the denied petition and Protocol Gamma. I sided with bounded forgetting. The licensing system is defensible as a brutal necessity – preventing societal paralysis (suprahistorical) or destructive obsession (monumental/antiquarian/critical gone wrong). But its cost is profound: enforced ignorance and the potential burial of necessary truths. It’s a necessary evil, deeply flawed.
