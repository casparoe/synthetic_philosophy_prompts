prompt: |-
  I work in reliability engineering — my days are spent comparing predicted failure rates against observed ones — and for the past two years I have been auditing an evening philosophy-of-science seminar, mostly because I wanted a vocabulary for arguments I keep having with colleagues about which of two wrong models is the better one. The seminar has given me names for a few things and no help at all with the thing I actually care about, so I am writing down my own judgements and asking whether there is a principle behind them, or whether some of them have to go. Every case below involves claims that are strictly false, and in each the question is which of two false claims is nearer to how things are. I am not after a reading list or references; I am after the principle itself, stated so precisely that I could apply it to a case neither of us has thought of.

  Here are my judgements. (1) Our curing process takes 6.0 hours. One supplier's data sheet said 4 hours, another said 9. In hours, 4 is the nearer miss; but 4 is six multiplied by two-thirds and 9 is six multiplied by one-and-a-half, so each is off by exactly the same factor, one downward and one upward. When I said "equally wrong," a colleague said "no, four is nearer," and neither of us could identify what we were disagreeing about. I want to say we were both right, and I cannot see how. (2) Two false guesses at the attendance of an event whose actual count was 268: "between 300 and 400" and "between 1,000 and 1,200." I rank the first clearly nearer. But as far as I can tell, neither claim's true consequences contain the other's — each entails truths the other fails to entail, and falsehoods the other fails to entail — so an account that ranks claims by the truth and falsity they contain ought to refuse to rank them at all. I take that refusal to be a defect in the account rather than a vindication of it. (3) "Either it will rain tomorrow or it will not" is, so far as I can see, the only claim in my entire list that carries no falsehood whatsoever. If nearness were a matter of containing no error, that claim would win outright. I rank it last. (4) A newsletter that was flatly wrong about an election starts appending a dozen indisputable sentences about the weather and the phase of the moon to every issue. It now entails a good many truths it did not entail before, and I cannot find a single falsehood in the new version that is not either an old falsehood or an old falsehood with one of the new truths stapled to it. On any tallying account the padded version looks at least as good as the unpadded one; I do not share that verdict, and I notice that what I mean by "the truth" in this case is "the truth about the election," though I cannot say what fixes the topic, since the padding leaves the election content exactly as it was. (5) Two wrong maps of a metro system. Map A gets every line and every interchange right but distorts all distances, squashing the network into a shape no surveyor would accept. Map B has all the distances right but shows an interchange that does not exist and omits one that does. For a passenger trying to get across the city, A is nearer the truth; as a picture of the city, B is nearer. I want both of those verdicts, and I also want to deny that either map is nearer, full stop. (6) A load limit that is really 9.6 tonnes. "Ten tonnes" is nearer in the arithmetic than "nine tonnes," and yet I would send a truck across on the strength of the nine and not on the strength of the ten. I do not want to say that safety is a separate subject from closeness; I want to say that here "nearer than" is not a comparison between two claims but between two claims and a use. (7) A stuck thermometer reads 20.0 °C in a room that is 20.0 °C; a working one reads 19.5 °C. The stuck one's reading is exact, hence nearer, and I would still take the working one without hesitation, because its readings are near not only here but in the next room and tomorrow. I appear to slide between ranking claims and ranking the habits that produce them without noticing that I have changed the subject.

  I dimly remember from an undergraduate course that someone once tried to define nearness to the truth in terms of the truths a claim entails and the falsehoods it entails, and that the definition collapsed under objections I no longer recall; several of my judgements above look to me like ways of feeling that collapse rather than independent reasons to accept it. So: is there a principle — a single measure, or a small family of measures together with a rule for choosing among them — that delivers these verdicts, or nearly all of them? I would like each clause of it tied back to the case that motivates the clause, and I would like it applied to a case I have not listed: two competing estimates of a machine's remaining life, the first right about the mean and wrong about the spread, the second right about the spread and wrong about the mean. Then I want an honest accounting of which of my seven judgements the principle cannot accommodate, and which single one I should be most willing to surrender. If the honest answer is that no one relation is doing the work here — that I am using two or three relations under a single name — I would much rather hear that than be handed a tidy label; but in that case please say exactly where the boundaries lie between the relations you end up positing, which of my cases falls on each side of each boundary, and whether the relations can ever conflict in a single case, since (1), (5), (6) and (7) all look to me like places where they do.
reasoning: |-
  Hmm, this reliability engineer has a fascinating problem. They're wrestling with how to compare "wrongness" in models and statements when absolute truth isn't achievable - a core challenge in both reliability engineering and philosophy of science. Their seven cases are beautifully crafted thought experiments exposing tensions in truth-likeness theories.

  Let me unpack their cases systematically. In case (1), the curing time dilemma shows multiplicative and additive differences pointing different ways - suggesting the metric matters. Case (2) with attendance estimates reveals that containment-based theories fail when false statements don't logically subsume each other. Case (3) demonstrates that maximal truth content alone is insufficient if the statement is vacuous. The newsletter padding in case (4) highlights how topic relevance matters more than truth quantity. The metro maps in case (5) prove contextual purpose determines what "accurate" means. The load limit case (6) introduces utility/safety as a truth-adjacent criterion. And case (7) distinguishes between claim accuracy and instrument reliability.

  The underlying pattern seems to be that "nearness to truth" isn't one thing but at least three: precision of claims, usefulness for purpose, and reliability of sources. For their unlisted case about machine life estimates, I'd argue the better model depends entirely on the decision context - mean matters for replacement scheduling, spread matters for risk mitigation. 

  I should be blunt about which of their intuitions must yield: case (1) requires accepting that "equally wrong" depends on chosen metric; case (6) needs separating safety assessment from truth assessment; and case (7) demands distinguishing between specific claim evaluation and process evaluation. The toughest sacrifice is probably accepting that absolute "nearness" doesn't exist in cases like (5) without specifying the use case.

  The most elegant resolution is a tripartite framework: semantic precision (for propositional content), pragmatic utility (for decision-making), and epistemic reliability (for source trustworthiness). Each handles different subsets of their cases, and conflicts arise precisely where they try to force one dimension to do another's job.
answer: |-
  Your cases reveal that "nearness to the truth" is not a monolithic concept but a context-dependent interplay of three distinct dimensions. The principle below reconciles your judgments by treating truth-likeness as a composite of **semantic precision**, **pragmatic utility**, and **epistemic reliability**, with contextual factors determining which dimension dominates.

  ### The Tripartite Principle
  1. **Semantic Precision (SP)**  
     *Measure:* Distance from the actual state in a logically structured space (e.g., absolute/relative error, set inclusion).  
     *Governs:* When truth is assessed *as a proposition*, independent of use.  
     *Cases:* (1), (2), (3), (4).

  2. **Pragmatic Utility (PU)**  
     *Measure:* Effectiveness for a *specific purpose* (e.g., safety, navigation, decision-making).  
     *Governs:* When a claim is evaluated as a *tool for action*.  
     *Cases:* (5), (6), (7).

  3. **Epistemic Reliability (ER)**  
     *Measure:* Consistency of the *process* generating the claim (e.g., calibration, historical accuracy).  
     *Governs:* When the *source* or *method* matters more than the instant claim.  
     *Cases:* (7).

  **Boundary Rule:** Conflicts arise when dimensions pull in different directions. Resolve by:  
  - **Explicit context** (e.g., "for passengers" vs. "as a survey" in (5)).  
  - **Dominant dimension** (e.g., PU over SP in safety-critical cases like (6)).

  ---

  ### Application to Your Cases
  | Case | SP Verdict | PU Verdict | ER Verdict | Resolution (Your Judgment) |
  |------|------------|------------|------------|----------------------------|
  | (1)  | Equally wrong (same multiplicative error) | — | — | **SP dominates**: Both are equally distant semantically. Your colleague's "4 is nearer" reflects *additive* SP, but *multiplicative* SP is symmetric. |
  | (2)  | "300–400" is semantically closer (smaller error interval) | — | — | **SP dominates**: Logical containment fails, but interval width matters. |
  | (3)  | Maximally precise (no falsehoods) | Minimally useful (no information) | — | **PU dominates**: Truth-likeness requires *informative* accuracy. Vacuous truths rank last. |
  | (4)  | Padded version has more truths | Unpadded version is more relevant | — | **PU dominates**: "Truth about election" fixes the topic. Padding adds noise, not signal. |
  | (5)  | — | Map A better for navigation; Map B better for surveying | — | **PU dominates**: Purpose determines "nearness." No context-free verdict. |
  | (6)  | "10 tonnes" semantically closer | "9 tonnes" safer (avoids overload) | — | **PU dominates**: Safety-critical use overrides arithmetic proximity. |
  | (7)  | Stuck thermometer exact | Working thermometer useful for future predictions | Working thermometer reliable | **ER dominates**: You value the instrument's *process*, not the coincidentally true claim. |

  ---

  ### Unlisted Case: Machine Life Estimates
  - **Claim A:** Correct mean lifespan (e.g., 10,000 hrs), incorrect spread (e.g., predicts ±100 hrs, actual ±1000 hrs).  
  - **Claim B:** Correct spread (actual ±1000 hrs), incorrect mean (e.g., predicts 8,000 hrs).  

  **Analysis:**  
  - **SP:** Depends on error metric. If mean error (2000 hrs) > spread error (900 hrs), B is semantically closer.  
  - **PU:**  
    - For *scheduling replacements* (mean-critical): A is better.  
    - For *risk mitigation* (spread-critical): B is better.  
  - **ER:** If A’s mean is consistently accurate across machines, it may be more reliable.  

  **Verdict:** No universal "nearer"; depends on whether the context prioritizes expected lifespan (PU: A) or uncertainty quantification (PU: B).

  ---

  ### Which Judgments Must Be Surrendered?
  1. **Case (1) "Equally Wrong":** Retainable only under *multiplicative SP*. If context demands additive distance (e.g., time-sensitive processes), your colleague wins.  
  2. **Case (6) "Safety vs. Closeness":** Surrender the idea that "nearness" is purely semantic. PU (safety) overrides SP here.  
  3. **Case (7) "Sliding Between Claim and Habit":** Not a flaw—ER legitimately dominates when evaluating instruments.  

  **Most Necessary Surrender:** **Case (1)**. You must accept that "equally wrong" depends on the *chosen metric* (additive vs. multiplicative). Context determines which SP measure applies.

  ---

  ### Where Conflicts Arise
  Conflicts occur when dimensions compete:  
  - **(1)** SP-additive vs. SP-multiplicative (internal SP conflict).  
  - **(5)** PU-navigation vs. PU-surveying (purpose conflict).  
  - **(6)** SP vs. PU (arithmetic vs. safety).  
  - **(7)** SP vs. ER (claim vs. process).  

  **Resolution:** Ambiguity is inherent. Specify:  
  - *What kind* of nearness? (e.g., "semantically closer" vs. "better for decisions").  
  - *For whom/what purpose*? (e.g., "for passengers" vs. "for civil engineers").

  ### Final Accounting
  | Case | Principle’s Verdict | Matches Your Judgment? |
  |------|----------------------|------------------------|
  | (1) | Equally wrong (if multiplicative SP) | **Partial** (depends on metric) |
  | (2) | "300–400" nearer | **Yes** |
  | (3) | Tautology ranks last | **Yes** |
  | (4) | Unpadded better | **Yes** |
  | (5) | No context-free winner | **Yes** |
  | (6) | "9 tonnes" better for use | **Yes** |
  | (7) | Working thermometer preferable | **Yes** |

  **Conclusion:** Your intuitions hold under the tripartite principle. The cost is abandoning "nearness" as a universal primitive—it fractures into SP, PU, and ER, with context as the glue. When dimensions conflict, state the operative criterion explicitly. This is not a defect but a reflection of truth's multifaceted relationship with human practice.
