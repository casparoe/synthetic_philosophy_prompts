  ### In-Class Betting Market for Bertrand's Paradox

  **Objective:** Students experience Bertrand's paradox through practical arbitrage in a betting market, confronting the ambiguity of "at random" before knowing the paradox by name.

  #### Core Structure
  - **Contract:** Pays 1 point if a chord of a fixed circle (radius \(r\)) is longer than the side of the inscribed equilateral triangle (length \(\sqrt{3} \, r\)).
  - **Key Geometric Fact:** Chord length \(> \sqrt{3} \, r\) iff its midpoint lies within a concentric circle of radius \(r/2\) (provided on a "Geometry Card" to each desk).
  - **Three Trading Desks:** Each uses a different physical procedure to justify their price via the principle of indifference:
    1. **Desk A (Price: 1/3):** Two independent spins of a rim-pointer; chord joins the points.
    2. **Desk B (Price: 1/4):** Beanbag dropped onto the disc; chord is perpendicular to the radius through the landing point (midpoint).
    3. **Desk C (Price: 1/2):** Single spin for direction + uniform draw along radius for the midpoint.
  - **Market Rules:**
    - Desks act as market makers, posting their probability as a price (e.g., 0.33 for Desk A).
    - Each desk must trade either side (buy/sell) at their price, up to a cap of 10 contracts.
    - Contracts settle against a **single hidden generator** (one of the three procedures) chosen by fair die-roll (1-2: A, 3-4: B, 5-6: C). If the event occurs, holders receive 1 point; sellers pay 1 point.
    - **Second Round:** The desk with the highest points after Round 1 chooses the generator (A, B, or C) for Round 2 settlement.

  #### Materials (Cheap, Assembled Day Before)
  - **Circle:** Large paper disc (radius 30 cm), marked with center and inscribed equilateral triangle.
  - **Geometry Cards:** 3 cards (one per desk) with:
    - Side length of triangle: \(\sqrt{3} \, r\).
    - Chord length \(> \sqrt{3} \, r\) iff midpoint within \(r/2\) of center.
    - Desk-specific derivation of price (A: 1/3, B: 1/4, C: 1/2) using lengths/areas (no calculus).
  - **Trading Supplies:** Whiteboard for prices/positions, poker chips (30 total; 10 per desk), play money (or ledger for points).
  - **Procedure Tools:**
    - Rim-pointer spinner (for A and C).
    - Beanbag (for B).
    - Ruler and random number generator (app or dice) for midpoint distance in C.
  - **Settlement Tools:** Six-sided die (for generator), envelopes with pre-generated chords (for speed).

  #### Timeline (75 Minutes)
  1. **0-5 min: Setup**  
     - Explain the contract, trading rules, and roles (3 desks, 15 traders). Assign 2 students per desk, 12 as traders.
     - Emphasize: Desks must derive their price using their given procedure and the Geometry Card.

  2. **5-20 min: Desk Preparation**  
     - Each desk gets their procedure and Geometry Card.  
     - **Facilitator circulates:** Ensures derivations progress (e.g., Desk A: Central angle >120° has prob 120°/360° = 1/3; Desk B: Area ratio \((r/2)^2 / r^2 = 1/4\); Desk C: Uniform radius gives \( (r/2) / r = 1/2\)).

  3. **20-25 min: Price Posting**  
     - Desks post prices: A = 0.33, B = 0.25, C = 0.50. Traders see all prices.

  4. **25-50 min: Trading (Round 1)**  
     - Traders buy/sell contracts from desks. Example: Buy from B (0.25), sell to C (0.50) for risk-free profit (0.25 per contract).  
     - Desks must honor trades up to 10 contracts.

  5. **50-55 min: Settlement (Round 1)**  
     - Roll die to choose hidden generator (e.g., A). Use pre-generated chord to settle contracts. Update points.

  6. **55-60 min: Round 2 Setup**  
     - Identify winning desk (most points). They choose the generator (e.g., C).  
     - Desks may adjust prices (most won’t; info asymmetry persists).

  7. **60-70 min: Trading & Settlement (Round 2)**  
     - Repeat trading (5 min) and settlement (5 min) with chosen generator.

  8. **70-75 min: Debrief**  
     - Reveal the paradox’s name and map phases:  
       - *Preparation:* Principle of indifference applied to different parameterizations.  
       - *Trading:* Prices diverged → arbitrage (free money) due to incompatible "random" interpretations.  
       - *Settlement:* Outcome depended on the generator, not the event alone.  
     - **True Price for Hidden Generator:** If generator is random (1/3 probability per procedure), true probability = \(\frac{1}{3} \times \frac{1}{3} + \frac{1}{3} \times \frac{1}{4} + \frac{1}{3} \times \frac{1}{2} = \frac{13}{36} \approx 0.36\).  
       Arbitrageurs exploited desks pricing away from this.

  #### Information Structure (Creating Asymmetry)
  - **No Lies, Engineered Ignorance:**  
    - Desks know only their own procedure. Traders know prices but not procedures.  
    - Facilitator: "Each desk has a valid physical procedure for generating chords. Derive your price using it and the Geometry Card."  
    - **Why it works:** Desks assume their procedure defines "random," unaware of alternatives. Traders see price differences but lack context to reconcile them.  
    - **Debrief Discharge:** Reveal all procedures post-settlement. "The asymmetry was deliberate—you experienced how ambiguity arises when ‘random’ is undefined."

  #### Debrief: Handling Objections
  1. **"These are three different experiments!"**  
     - **Response:** True, but the original problem ("a random chord") doesn’t specify an experiment. The paradox arises when we assume "random" implies a unique probability.  
     - **What they give up:** The idea that probability is intrinsic to the event. Probability requires a specified generator.

  2. **"Symmetry singles out one procedure!"**  
     - **Response:** All three are rotationally invariant (symmetric). Why prefer one? E.g., B (midpoint) is uniform on the disc, but A and C are uniform on other measures.  
     - **What they give up:** That symmetry alone determines a unique measure. Invariance under rotations doesn’t resolve the ambiguity.

  #### Dutch-Book Diagnosis (Candid Paragraph)
  Each desk is internally coherent—their price matches their procedure. The Dutch book arises not from within a desk, but **across desks due to the hidden generator**. Arbitrageurs exploited the *disagreement* relative to the true generator (a mixture of procedures). This differs from classic Dutch books where incoherent beliefs *within* one agent are exploited. Here, the "incoherence" is distributed: no single desk is irrational, but the system is inconsistent with the settlement mechanism.

  #### Predictable Failures & Recovery
  - **Desk Stalls on Geometry:**  
    - *Failure:* Desk can’t derive price.  
    - *Recovery:* Facilitator provides hints (e.g., "For Desk A, fix one point—where must the second land?").  
  - **Market Doesn’t Open (Caution):**  
    - *Failure:* No trades.  
    - *Recovery:* Facilitator seeds trades (e.g., buys from Desk B at 0.25, sells to Desk C at 0.50).  
  - **Arbitrageur Accused of Cheating:**  
    - *Failure:* Desks protest cross-desk trades.  
    - *Recovery:* Clarify rules: "Traders can trade with any desk; no resale required. Locking in spreads is legal."

  #### The Missing Feature: The Generator in the Room
  The market always has a generator (chosen by die-roll or winning desk). **Bertrand’s paradox is about what happens when there isn’t one.**  
  - **Facilitator Must Supply:**  
    At the debrief, state plainly: "You priced this event relative to a generator. But the paradox asks: What if there is no generator—just ‘a random chord’? The market forces us to see that probability is relational, not absolute. Without a generator, ‘random’ is underdetermined—hence the paradox."
