  The event: Chord length > side of inscribed equilateral triangle. The side length is √3 r (where r is the radius). The key geometric fact: A chord is longer than the side of the inscribed equilateral triangle if and only if its midpoint lies within a circle of radius r/2 centered at the center of the fixed circle.

  We have three procedures (each assigned to a trading desk) that lead to the following probabilities:
  1. Method 1 (Two spins): Two independent uniform spins on the circumference, then join the two points to form the chord. Probability = 1/3.
  2. Method 2 (Beanbag drop): Drop a beanbag uniformly on the disc, then draw the chord perpendicular to the radius through the landing point. Probability = 1/4.
  3. Method 3 (Spin and uniform radius): Uniform spin for the direction, then uniform draw along the radius for the foot of the perpendicular. Probability = 1/2.

  Each desk will act as a market maker, posting a price (probability) for the contract that pays 1 point if the chord is longer, and 0 otherwise. The desk must take either side (buy or sell) of the contract at their posted price, up to a cap (say, 10 contracts per desk). The settlement is against a single hidden generator, which is one of the three procedures, chosen by a fair die roll (so each with probability 1/3). 

  In the second round, the desk that has the most points (after the first round) chooses the generator for settlement.

