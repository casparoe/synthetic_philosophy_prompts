     - Random number generator for the distance in method3: a bag with numbers 0 to 100? Or a spinner for the distance? We can make a spinner for the distance: a circular disc divided into 100 equal segments? Too hard. We can use a random number generator app? But we want physical. We can use a bag of 100 balls numbered 0 to 99, and then distance = (ball number)/100 * r.

