     - No direct human victim. The AI is not sentient and cannot be harmed. 
     - The user is paying for a service that provides pleasure without (apparently) harming others. 
     - Bentham would likely see this as a form of harmless pleasure. There is no mischief of the first order because there is no harm to any sentient being. 
     - There might be concerns about second-order effects (e.g., if it leads to unhealthy expectations in human relationships), but these are speculative and not direct. 
     - Bentham's ascetic principle would reject punishing such an activity merely because some find it distasteful. 
     - He might, however, be open to regulation to ensure that such AIs are not used in ways that cause harm (e.g., if they are programmed to encourage harmful behavior) or to protect minors. But the activity itself, between adults, would likely be seen as no offence.

     Verdict: no offence.

     Controlling doctrines: the ascetic principle (rejecting punishment for harmless pleasure), the groundless case for punishment (no real harm), and the unprofitability of punishing (since it would prevent pleasure without preventing harm).

     Counter doctrine: If it could be shown that such AI companionship leads to significant harm (e.g., widespread social isolation or degradation of human relationships) then Bentham might consider regulation. But without evidence, he would not punish.

     Breakdown: factual gap (we don't have evidence of harm). Confidence: medium (because if evidence of harm emerges, it might change).

  3. Platform-mediated sex work — subscription-based, indoor, between consenting adults — as against criminalizing either the buyers or the sellers.

     - Bentham was in favor of decriminalizing and regulating sex work. He saw prohibition as driving the trade underground, leading to greater harms (disease, violence, exploitation). 
     - He would prefer a regulated system that ensures safety, health, and consent. This aligns with his preference for inspectable, licensed arrangements. 
     - Security: Regulation protects the sex workers (from violence and disease) and the public (from disease). 
     - Abundance: It allows for a legal trade that contributes to the economy. 
     - Equality: By bringing the trade into the open, it can reduce the exploitation of vulnerable individuals. 
     - Criminalization would be inefficacious (it doesn't stop the trade) and unprofitable (costly to enforce and creates more harm). 
     - Therefore, he would favor regulation over prohibition and would oppose criminalizing either party.

     Verdict: regulate rather than prohibit.

     Controlling doctrines: the four subordinate ends (especially security and abundance), the inefficacious and unprofitable nature of punishment, and the preference for inspectable arrangements.

     Counter doctrine: If regulation fails to prevent harms (e.g., if it leads to increased trafficking), then Bentham might reconsider. But his general approach is to regulate.

     Breakdown: none. Confidence: high.

  4. Statutory recognition of marriages among more than two adults.

     - Bentham was a critic of traditional marriage laws and favored greater individual liberty. He would likely see no harm in allowing multiple adults to form a recognized union if they consent. 
     - The key is consent and the absence of harm. 
     - Security: Recognition would provide legal security for the parties (property, inheritance, medical decisions). 
     - Without recognition, there might be legal uncertainties that cause harm. 
     - Equality: Denying recognition might create inequalities. 
     - Bentham would reject any prohibition based on antipathy (disgust at polygamy). 
     - However, he might be concerned about potential for exploitation or coercion in such arrangements. Therefore, he might favor regulation to ensure that all parties are consenting and protected.

     Verdict: regulate rather than prohibit (i.e., allow with regulations to protect against coercion and ensure consent).

     Controlling doctrines: security (legal protections), the groundless case (if there's no harm, no reason to prohibit), and the ascetic principle (rejecting moral disgust as a reason for prohibition).

