prompt: |-
  You're an expert in philosophy of religion, specifically the divine attributes — think carefully, and do a bit of brainstorming before you settle on the list.

  I'm writing the framework chapter of a book on omnipotence, and before I wade thru the candidates I want the spec first: what would an account of omnipotence actually have to get right to count as adequate? Give me the requirements list — the puzzles it must dissolve or explain (the stone one and its relatives), the distinctions it must not collapse (a task description that picks out no genuine task vs. one that does; having a power vs. exercising it; being unable to do X because X is contradictory vs. because you simply aren't strong enough; power over what happens vs. power over what could have happened), and the roles the concept has to keep playing — with the case or consideration behind each one.

  Two constraints on my project that you should build into the list rather than treat as extras. First, the concept has to do double duty: philosophically clean, but recognisable to a working theologian, so covenant promises and the free-will defence have to survive — i.e. a being like this must be able to genuinely bind itself for later, and must be able to make agents it cannot thereafter determine. Second, I have a suspision that the move which disposes of the stone paradox — whatever-it-is-about-the task description — also disposes of covenants, since binding yourself looks like the same logical form: bringing it about that there's something you can no longer do. If that's right, say so plainly and show the shared form, because that's the result I most want out of this exercise; the list itself being unsatisfiable somewhere would be a finding, not a failure.

  Mark which requirements are non-negotiable and which are just the prejudices of one camp, say which single requirement kills off the most contenders, and finish with a short paragraph each on how the pseudo-task view, the self-limitation/abdication view, and a plain maximal-power-over-all-genuinely-possible-states-of-affairs view do against the list. No names, dates, or reading lists please — I'll fill those in myself. British English throughout.
