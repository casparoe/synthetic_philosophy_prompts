  Now brainstorming the requirements list. Must-haves include:
  - Dissolving the stone paradox and its variants (like paralysing/weakening paradoxes)
  - Distinguishing genuine tasks from pseudo-tasks (like changing the past)
  - Separating power possession from exercise
