  ### Pantoum: Independence  

  In Gödel’s glass house, every set finds its place.  
  The reals outrun the integers, clear and aligned.  
  The power set blooms to the next cardinal’s grace.  
  There is no set between the integers and the continuum.  

  The reals outrun the integers, clear and aligned.  
  Then Cohen’s hand, with pressure, parts the air.  
  There is no set between the integers and the continuum—  
  a thicket grows where sunlight thinned to shade.  

  Then Cohen’s hand, with pressure, parts the air.  
  The continuum’s measure frays at the edge.  
  A thicket grows where sunlight thinned to shade:  
  one world sparse as dunes, one dense with bloom.  

  The continuum’s measure frays at the edge.  
  We build the frame but cannot fix the size.  
  One world sparse as dunes, one dense with bloom—  
  the question slips beyond the axiom’s hold.  

  We build the frame but cannot fix the size.  
  The power set blooms to the next cardinal’s grace.  
  The question slips beyond the axiom’s hold.  
  In Gödel’s glass house, every set finds its place.  

  ---

  **Explanation of the flipped line:**  
  The line *"There is no set between the integers and the continuum"* first appears as a definitive claim (reflecting Gödel’s model where CH holds). When repeated, it’s followed by imagery of a thickening thicket and parted air—hinting at Cohen’s forcing that *adds* subsets to create intermediate sizes, destabilizing the claim. Identical words, but the context (and enjambment) shifts it from settled truth to unsettled possibility.
