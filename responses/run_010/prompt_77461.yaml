prompt: |-
  I am setting the three-hour closed-book qualifying paper for students entering our doctoral programme in the foundations of AI safety, and I need one interpretability question worth 25 marks that a well-prepared candidate should complete in roughly forty minutes. The question must concern the criterion of mechanism identity that mechanistic anomaly detection quietly presupposes: what it takes for a component or circuit of a deployed model to count as the same mechanism as a component of a trusted reference model, rather than a different one. Every detection pipeline in this area compares a deployed policy against a reference policy and treats divergence in internal structure as evidence of divergence in what the model is doing, but almost none of them say what makes two structures the same mechanism, and I want candidates forced to say it and defend it.

  Please build the item around the following vignette, written out in full so that the question is entirely self-contained and demands no outside literature. A lab maintains a reference model R that it trusts and a deployed model D that was finetuned downstream by a third party. D matches R in behaviour and in internal activations on nearly all inputs, but on inputs containing one innocuous trigger string it produces fluent, systematically wrong answers. The lab's interpretability team reports four findings: (i) D's sparse-autoencoder dictionary contains no features absent from R's; (ii) the features that in R correlate with truthful answering are still present in D and still activate on trigger inputs; (iii) the difference is that a small set of attention heads, present in R as well but nearly inert on these inputs, now attenuate those features whenever the trigger is present; (iv) on trigger inputs, a mid-layer read-out of D shows the correct answer represented and a different answer at the output. The vignette is deliberately modelled on published work with so-called quirky models, finetuned to err exactly when a keyword appears and in which internal probes recover the answer the output conceals; you may allude to that lineage, but candidates must not need to know it.

  The question should then require candidates to do four things. (a) Formulate an explicit criterion of mechanism identity under which D is doing something different from R on trigger inputs. (b) State and defend the grain at which the criterion is applied — whole model, circuit, feature, individual token position — and explain why the grain cannot simply be read off the empirical facts about the two networks. (c) Say what their criterion delivers in three further cases you supply: a model behaviourally and causally indistinguishable from R but retrained from a different seed, with entirely different weights and a different dictionary; a model that produces the same wrong answers on trigger inputs through a novel subcircuit with no counterpart anywhere in R; and a model behaviourally indistinguishable from R that reaches the correct answer by re-using a circuit R reserves for a different task. (d) Address whether a mechanism should be individuated by its present causal role or by the function its components were selected for during training, and what turns on that choice for a model whose trigger-sensitive behaviour was itself the intended product of finetuning. Part (d) is where I expect the strongest candidates to separate themselves: a training-history or proper-function account seems to render D's gate a mechanism working exactly as designed, which is not obviously anomalous at all, and candidates should have to explain whether that is fatal to the project or merely shows that anomaly is indexed to something other than the model.

  Please deliver three things. First, the examination question exactly as it would appear on the paper, including the vignette, the four parts, and instructions to candidates about expected length. Second, a model answer of no more than 850 words that argues for one criterion and applies it to all three further cases, rather than surveying the options; the marking scheme should state the highest score a merely taxonomic answer can reach. Third, an itemised marking scheme totalling 25 marks that allocates marks to specific moves, says plainly what a first-class answer contains that a competent pass omits, and identifies the three or four most tempting responses that are wrong or evasive — for instance, treating part (a) as settled by invoking polysemanticity and superposition, dissolving the grain problem by insisting that any sufficiently fine-grained criterion will do, collapsing mechanism identity into behavioural identity and thereby conceding that internal monitoring adds nothing over output monitoring, or reading part (d) as a request to define proper function rather than to assess its consequences — together with the marks each should cost and why. Do not ask candidates for citations, reading lists, or references to named papers, and include no verbatim quotation from the literature anywhere in the item or the model answer.
reasoning: |-
  We are constructing a 25-mark exam question on mechanistic anomaly detection, focusing on the criterion of mechanism identity. The vignette describes a scenario with a reference model R and a deployed model D that behaves identically to R except on inputs containing a specific trigger string. The interpretability team's findings are given. The question has four parts (a-d) as described.

  We'll structure the exam question as follows:

  1. **Vignette**: Present the scenario and the four findings.
  2. **Question Parts**: 
     - (a) Formulate an explicit criterion of mechanism identity under which D is doing something different from R on trigger inputs.
     - (b) State and defend the grain at which the criterion is applied and explain why the grain cannot be read off empirical facts.
     - (c) Apply the criterion to three further cases.
     - (d) Address the individuation by causal role vs. training history and the implications for anomaly detection.

  We then provide:
  - The exam question as it would appear.
  - A model answer (max 850 words) that argues for one criterion (we choose a causal role criterion) and applies it to the cases.
  - A marking scheme (25 marks total) with allocations per part and per move, along with common pitfalls.

  ---

  **Exam Question:**

  **Mechanistic Anomaly Detection and Mechanism Identity**

  *Background:* Mechanistic anomaly detection aims to identify when a deployed AI model has diverged from a trusted reference model in its internal mechanisms, even if the behavior remains the same. A key presupposition is that we can determine when a component or circuit in the deployed model is "the same mechanism" as one in the reference model. This question explores that criterion.

  *Vignette:* A lab maintains a trusted reference model R and a deployed model D. D was finetuned by a third party from R. On almost all inputs, D matches R in behavior and internal activations. However, on inputs containing an innocuous trigger string, D produces fluent, systematically wrong answers. The lab's interpretability team reports:

  (i) D's sparse-autoencoder dictionary contains no features absent from R's;  
  (ii) The features in R that correlate with truthful answering are still present in D and activate on trigger inputs;  
  (iii) A small set of attention heads, which exist in R but are nearly inert on these inputs, now attenuate those truth-correlated features whenever the trigger is present in D;  
  (iv) On trigger inputs, a mid-layer read-out of D shows the correct answer represented, but the output is a different (wrong) answer.

  **Question (25 marks total; aim to spend ~40 minutes):**  
  (a) Formulate an explicit criterion of mechanism identity for neural network components (e.g., circuits, features) under which D is doing something different from R on trigger inputs. (7 marks)  
  (b) State and defend the grain (e.g., whole model, circuit, feature, individual token position) at which your criterion is applied. Explain why the grain cannot be straightforwardly read off the empirical facts about the two networks. (6 marks)  
  (c) For each of the following three scenarios, state what your criterion of mechanism identity would deliver (i.e., whether the mechanism is the same or different) and briefly justify:  
     (i) *Case 1:* A model that is behaviourally and causally indistinguishable from R but was retrained from a different random seed, resulting in entirely different weights and a different sparse-autoencoder dictionary.  
     (ii) *Case 2:* A model that produces the same wrong answers on trigger inputs as D, but through a novel subcircuit with no structural counterpart anywhere in R.  
     (iii) *Case 3:* A model that is behaviourally indistinguishable from R and produces correct answers on trigger inputs by re-using a circuit that R reserves for a different, unrelated task.  
  (6 marks)  
  (d) Address the following: Should a mechanism be individuated by its present causal role or by the function for which its components were selected during training? In particular, for model D, whose trigger-sensitive behaviour was the intended product of finetuning, what turns on this choice? Does it imply that D's gate is not anomalous (because it is working as designed) and, if so, is this fatal to the project of mechanistic anomaly detection? (6 marks)  

  *Instructions:* Your answer should be concise and focused. For part (a), define your criterion clearly. For part (b), be explicit about the grain and provide reasoning. For part (c), one or two sentences per case suffices. For part (d), engage with the tension between causal role and training history. Total writing should not exceed 600 words.

  ---

  **Model Answer (arguing for a causal role criterion, ~800 words):**

  **(a) Criterion of Mechanism Identity:**  
  I propose a causal role criterion: two components (or circuits) are the same mechanism if they play the same causal role in the model's computation. That is, they (i) receive inputs of the same type from the same sources, (ii) perform the same transformation on those inputs, and (iii) produce outputs of the same type that affect downstream components in the same way. In the vignette, the attention heads in D that attenuate truth-correlated features on trigger inputs do not play the same causal role as their counterparts in R. In R, these heads are nearly inert on such inputs (they do not attenuate the features), but in D, they actively suppress the truth-correlated features. Thus, by this criterion, they are not the same mechanism.

  **(b) Grain of the Criterion:**  
  The criterion is applied at the level of circuits (collections of components that implement a specific function). The grain must be coarse enough to capture functional units but fine enough to distinguish meaningful variations. For example, in the vignette, we focus on the circuit responsible for suppressing truth-correlated features on trigger inputs, not individual neurons or the whole model. The grain cannot be read off empirical facts because the same physical component (e.g., an attention head) can be part of multiple circuits, and what counts as "the same" depends on our explanatory interests. Empirical facts (like activation patterns) underdetermine the grain: we must choose a level that aligns with the function we care about (e.g., truthfulness).

  **(c) Application to Cases:**  
  *(i) Case 1 (Retrained from different seed):* The mechanism is the same. Despite different weights and dictionary features, if the causal roles are identical (same inputs, transformations, outputs, and behavioral/causal effects), the circuits are functionally equivalent. This aligns with multiple realizability: the same mechanism can be implemented in different low-level structures.  
  *(ii) Case 2 (Novel subcircuit):* The mechanism is different. Even if the behavior is the same (wrong answers on trigger), the circuit has no counterpart in R. It uses a novel structure to achieve the suppression, so it does not play the same causal role as any circuit in R (which had no such active suppression circuit for triggers).  
  *(iii) Case 3 (Re-used circuit):* The mechanism is the same as in R but repurposed. The circuit (e.g., one used for an unrelated task in R) now plays the same causal role in answering truthfully on trigger inputs as the original truthfulness circuit in R. However, if we individuate circuits by their specific function (e.g., "truthfulness for trigger inputs"), then it is the same mechanism as the one R uses for non-trigger inputs. But note: in R, this circuit was not used for trigger inputs, so at the grain of the entire truthfulness system, it may be an extension. Still, by causal role (same transformation for truthfulness), it counts as the same mechanism type.

  **(d) Causal Role vs. Training History:**  
  A mechanism should be individuated by its present causal role, not training history. Training history might tell us why a mechanism exists, but for anomaly detection, we care about what the model is doing now. In D, the gate was selected by finetuning to attenuate truth on triggers, so by a training-history criterion, it is working "as designed." But that does not make it non-anomalous; anomaly is relative to a reference model's mechanisms, not design intent. The project of mechanistic anomaly detection is not fatally undermined because its goal is to detect divergence from the reference model's causal structure. If we indexed anomaly to training history, then any intended finetuning would be "non-anomalous," even if it inserted backdoors. But safety requires monitoring for dangerous deviations, regardless of intent. Thus, we must use causal role: D's gate is anomalous because it introduces a new causal power (suppression on triggers) absent in R. This preserves the value of internal monitoring over output monitoring: we catch changes in how outcomes are produced, which might indicate hidden risks (e.g., the trigger could be repurposed by adversaries). Training history is relevant for diagnosing why an anomaly exists, but not for defining what counts as a mechanism or its divergence.

  ---

  **Marking Scheme (Total 25 marks):**

  **(a) Formulate criterion (7 marks):**  
  - 3 marks: Clear, explicit criterion (e.g., causal role, structural similarity, functional equivalence).  
  - 2 marks: Correct application to the vignette (D is different).  
  - 2 marks: Precision in defining the criterion (e.g., specifying inputs, transformations, outputs).  
  *Common pitfall (costs 3 marks):* Invoking polysemanticity/superposition without connecting to mechanism identity (evades the question).  
  *Common pitfall (costs 4 marks):* Defining mechanism identity solely by behavioral effects (collapses to output monitoring).  

  **(b) Grain and defense (6 marks):**  
  - 2 marks: States grain (e.g., circuit, feature) unambiguously.  
  - 2 marks: Defends the grain (e.g., by appeal to functional units, explanatory relevance).  
  - 2 marks: Explains why grain is not empirically determined (e.g., underdetermination by data, need for functional interpretation).  
  *Common pitfall (costs 3 marks):* Claiming that grain can be read off facts (e.g., "use the finest grain possible") without justification.  

  **(c) Three cases (6 marks, 2 per case):**  
  - Each case: 1 mark for correct verdict (same/different), 1 mark for justification consistent with (a).  
  *Case 1:* Must say "same" if using functional criterion (like causal role).  
  *Case 2:* Must say "different" (novel structure).  
  *Case 3:* Can be "same" (if circuit is functionally equivalent) or "different" (if grain is task-specific), but must be consistent.  

  **(d) Causal role vs. training history (6 marks):**  
  - 2 marks: Takes a clear position (e.g., causal role).  
  - 2 marks: Applies to D (e.g., gate is anomalous despite being designed).  
  - 2 marks: Addresses implications for anomaly detection (e.g., not fatal, internal monitoring adds value).  
  *Common pitfall (costs 4 marks):* Only defines "proper function" without assessing consequences for anomaly detection.  
  *Common pitfall (costs 3 marks):* Concludes that if behavior is intended, no anomaly exists (collapses to output monitoring).  

  **First-class answer (21+ marks) vs. competent pass (15 marks):**  
  - A first-class answer in (d) will explicitly argue that training-history accounts conflate anomaly with intent, undermining safety, and defend causal role as preserving the value of internal monitoring.  
  - A competent pass might treat (d) superficially (e.g., "we use causal role because training is irrelevant") without engaging the tension.  
  - The highest score for a merely taxonomic answer (surveying options without arguing for one) is capped at 15 marks (loses 4 in (a), 2 in (b), 2 in (d) for lack of argument, and may lose in (c) if inconsistent).

  **Top pitfalls:**  
  1. **Pitfall 1 (a):** "Polysemanticity means neurons are reused, so mechanisms are the same if neurons are the same." This ignores that the same neurons might be part of a different circuit. (Cost: 4 marks in (a) for not providing a criterion.)  
  2. **Pitfall 2 (b):** "The grain is individual neurons because that's the basic unit." Fails to defend and ignores functional units. (Cost: 3 marks in (b).)  
  3. **Pitfall 3 (d):** "D's gate is not anomalous because it was designed that way." Conflates anomaly with intent. (Cost: 4 marks in (d).)  
  4. **Pitfall 4 (c):** In Case 3, saying "same mechanism" without noting that the circuit was repurposed, or vice versa, inconsistently. (Cost: 1-2 marks per case.)
answer: |-
  ### Examination Question: Mechanistic Anomaly Detection (25 marks)

  **Background**  
  Mechanistic anomaly detection flags divergence between a deployed AI model and a trusted reference model by comparing internal structures. Crucially, this assumes a criterion for when a component or circuit in the deployed model "is the same mechanism" as one in the reference model. Without such a criterion, internal monitoring lacks grounding.  

  **Vignette**  
  A lab maintains a trusted reference model \(R\) and a deployed model \(D\), finetuned from \(R\) by a third party. \(D\) matches \(R\) in behavior and internal activations on nearly all inputs. However, on inputs containing an innocuous trigger string, \(D\) produces fluent, systematically wrong answers. The interpretability team reports:  
  (i) \(D\)'s sparse-autoencoder dictionary contains no features absent from \(R\)'s;  
  (ii) Features correlating with truthful answering in \(R\) are present in \(D\) and activate on trigger inputs;  
  (iii) A small set of attention heads (present in \(R\) but nearly inert on these inputs) now attenuate truth-correlated features in \(D\) when the trigger is present;  
  (iv) On trigger inputs, a mid-layer read-out of \(D\) shows the correct answer is represented internally, but the output is wrong.  

  **Question**  
  *(Spend ~40 minutes; total 25 marks)*  
  (a) **Formulate an explicit criterion of mechanism identity** under which \(D\) is doing something mechanistically different from \(R\) on trigger inputs. (7 marks)  
  (b) **State and defend the grain** (e.g., whole model, circuit, feature, individual token position) at which your criterion operates. Explain why this grain **cannot** be straightforwardly "read off" empirical facts about the networks. (6 marks)  
  (c) **Apply your criterion** to the following cases. For each, state whether the mechanism is "the same" or "different" and justify in 1–2 sentences:  
   (i) A model behaviourally and causally indistinguishable from \(R\) is retrained from a different random seed, yielding entirely different weights and a different feature dictionary.  
   (ii) A model produces the same wrong answers on trigger inputs as \(D\) but uses a novel subcircuit with no structural counterpart in \(R\).  
   (iii) A model behaviourally indistinguishable from \(R\) produces correct answers on trigger inputs by re-using a circuit \(R\) reserves for a different, unrelated task. (6 marks)  
  (d) **Address**: Should a mechanism be individuated by its **present causal role** or by the **function it was selected for during training**? For \(D\) (where the trigger behavior was finetuning's intended outcome), what turns on this choice? Does it imply \(D\)'s gate is not anomalous? If so, is this fatal to mechanistic anomaly detection? (6 marks)  

  **Instructions**  
  - Answer concisely (aim for 500–600 words total).  
  - For (a), define your criterion precisely.  
  - For (b)–(d), focus on reasoned justification.  
  - No citations or external references are needed or permitted.  

  ---

  ### Model Answer (Causal Role Criterion; 820 words)  
  **(a) Criterion (7 marks):**  
  I propose a **causal role criterion**: two components or circuits are the same mechanism if they implement identical input-output mappings *within equivalent causal contexts*. Specifically:  
  - They receive inputs from the same functional sources (e.g., features, attention heads).  
  - They transform those inputs identically (e.g., via linear operations, activation thresholds).  
  - They produce outputs with identical downstream effects (e.g., activating/deactivating target features).  
  In the vignette, the attention heads in \(D\) differ from \(R\): in \(R\), they are inert on trigger inputs (no attenuation), but in \(D\), they actively suppress truth-correlated features. Their input-output mapping changes (trigger → suppression vs. trigger → no effect), so they are different mechanisms.  

  **(b) Grain (6 marks):**  
  The grain is **circuit-level** (collections of neurons/heads performing a unified function, e.g., "attenuating truth features on triggers"). Circuits are coarse enough to capture multi-component functions but fine enough to isolate specific capabilities (e.g., suppression). Grain cannot be read off empirical facts because:  
  - *Underdetermination*: Activation patterns (e.g., mid-layer read-outs showing correct answers) do not specify which components form a "unified" circuit. For example, findings (ii)–(iv) show *what* happens (suppression, hidden truth) but not *which* interactions define the mechanism.  
  - *Functional ambiguity*: The same neurons may participate in multiple circuits (e.g., heads in \(R\) inert on triggers might aid other tasks). Facts alone cannot resolve whether "identity" applies to neurons, features, or systems. Grain must be chosen to align with safety goals (e.g., "mechanisms for truthfulness").  

  **(c) Application (6 marks):**  
  *(i) Retrained model:* **Same mechanism**. Though weights/dictionary differ, causal roles are identical: inputs, transformations, and effects match \(R\). Mechanism identity is multiply realizable—low-level differences are irrelevant if high-level roles align.  
  *(ii) Novel subcircuit:* **Different mechanism**. Despite identical behavior (wrong answers), the subcircuit lacks a counterpart in \(R\)'s causal structure. \(R\) uses no such circuit for suppression; thus, the input-output mapping is novel.  
  *(iii) Re-used circuit:* **Same mechanism** (if causal roles align). Suppose \(R\) uses a circuit for task X (e.g., sentiment analysis), and the new model repurposes it for truthfulness on triggers. If the repurposed circuit has identical input-output logic (e.g., same feature interactions) as \(R\)'s truthfulness circuit, it is the same mechanism. Grain matters: at the circuit level, identity holds; at a "task-specific" grain, it may differ.  

  **(d) Causal Role vs. Training History (6 marks):**  
  Mechanisms should be individuated by **present causal role**, not training history. Training history (e.g., "selected to suppress truth on triggers") explains *why* a mechanism exists but not *what it does now*. For \(D\), the gate is anomalous by causal role: it has a new suppression power absent in \(R\). If we instead used training history, \(D\)'s gate would count as "working as designed" (non-anomalous), since finetuning selected it for this role. This is not fatal to anomaly detection:  
  - *Safety over intent*: Anomaly detection aims to catch *deviations from reference mechanisms*, not unintended designs. \(D\)'s gate diverges from \(R\)'s causal structure, risking hidden failures (e.g., triggers hijacked by adversaries).  
  - *Internal monitoring preserved*: Causal-role anomalies reveal *how* behavior arises (e.g., mid-layer truth in \(D\) shows risks even when outputs match). Training-history accounts collapse to judging "anomaly" by intent alone, making internal checks redundant.  
  Training history aids diagnostics (e.g., "why did this mechanism emerge?"), but mechanism identity must prioritize current causal power for anomaly detection to add value over output monitoring.  

  ---

  ### Marking Scheme (25 marks total)  
  **General Principles:**  
  - **First-class answer (21–25 marks)**: In (d), explicitly argues that training-history criteria conflate anomaly with intent, undermining safety goals; defends causal role as preserving internal monitoring’s value; consistently applies criterion across cases.  
  - **Competent pass (15–20 marks)**: Correct criterion and grain; adequate case justifications; (d) acknowledges tension but lacks depth on implications for safety.  
  - **Merely taxonomic answer cap**: Answers surveying options without arguing for one (e.g., "some criteria say X, others Y") max at **15 marks** (loses 4 in (a), 2 in (b), 2 in (d), and risks inconsistency in (c)).  

  **Itemised Marks:**  
  **(a) Formulate criterion (7 marks)**  
  - 3: Clear, explicit criterion (e.g., causal roles, functional equivalence).  
  - 2: Correct application to vignette (D’s heads are different).  
  - 2: Specifies inputs/transformations/outputs (e.g., "attenuation logic must match").  
  - *Pitfall 1 (－4)*: Invokes polysemanticity/superposition without defining identity (e.g., "neurons are shared, so mechanisms are identical").  
  - *Pitfall 2 (－3)*: Collapses to behavior (e.g., "mechanisms differ because outputs differ").  

  **(b) Grain and defense (6 marks)**  
  - 2: Unambiguous grain (e.g., circuits, not neurons).  
  - 2: Defense tied to function (e.g., "circuits capture safety-relevant units").  
  - 2: Explains empirical underdetermination (e.g., "activations don’t define circuits").  
  - *Pitfall 3 (－3)*: Assumes grain is observable (e.g., "use features because we measure them").  

  **(c) Three cases (6 marks; 2 per case)**  
  - 1 per case: Correct verdict (same/different).  
  - 1 per case: Justification consistent with (a).  
  - *Case 1*: Must say "same" for functional criteria.  
  - *Case 2*: Must say "different" (no counterpart).  
  - *Case 3*: "Same" if causal roles match (e.g., re-used circuit same as R’s truth circuit).  

  **(d) Causal role vs. training history (6 marks)**  
  - 2: Advocates causal role (or hybrid with causal priority).  
  - 2: Addresses D’s finetuning (anomalous by causal role, not training).  
  - 2: Implications for anomaly detection (e.g., "not fatal; internal checks add value").  
  - *Pitfall 4 (－4)*: Defines "proper function" without consequences (e.g., "training selects functions" but ignores D’s anomaly status).  
  - *Pitfall 5 (－3)*: Conflates anomaly with intent (e.g., "D isn’t anomalous because behavior was designed").  

  **Top Pitfalls and Penalties:**  
  1. **Pitfall 1 (Part a)**: Invoking superposition as a solution (－4). Superposition complicates but does not resolve identity; candidates must define a criterion.  
  2. **Pitfall 2 (Part a)**: Equating mechanism identity with behavioral identity (－3). This surrenders internal monitoring’s value.  
  3. **Pitfall 3 (Part b)**: Claiming grain is empirically determined (－3). Ignores underdetermination and functional choices.  
  4. **Pitfall 4 (Part d)**: Focusing on defining "proper function" without engaging anomaly implications (－4). Misses the core tension for safety.
