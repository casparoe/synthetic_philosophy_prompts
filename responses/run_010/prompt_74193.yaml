       - Dutch book → Rational belief must satisfy *probabilistic coherence* (i.e., credences obey Kolmogorov axioms).  
       - Money pump → Rational preference must be *transitive and complete* (for standard versions).  

  2. **Dutch Book Argument Explanation:**  
     - ✅ **Correct:** Betting interpretation, credence example, guaranteed loss when credences sum to >1, and the converse theorem. Diachronic version (non-conditionalization) is also well summarized.  
     - ❌ **Missing Extra Assumption:** You omit the critical assumption needed to get from incoherence to "worse off": the agent must **accept all bets they judge favorable** (i.e., act on their stated credences). Without this, incoherence alone doesn’t guarantee exploitation.  

  3. **Money Pump Argument Explanation:**  
     - ✅ **Correct:** Cyclic preference example and fee-based exploitation are clear. The link to incoherent preferences guaranteeing loss is apt.  
     - ❌ **Overstated/Incorrect Claim:** You state the money pump works for "any departure from expected utility maximisation, incompleteness included" and that "the very same argument requires completeness." This is **wrong**:  
       - Incompleteness (no ranking between A/B) does *not* inherently lead to money pumps. An agent can rationally refuse trades involving incomparable options without loss (e.g., "preferential gaps").  
       - Your claim contradicts your own "routing round the gap" point. Standard money pumps require **transitivity**; completeness is a *separate* assumption often needed for expected utility but not directly enforced by all pump variants.  
     - ❌ **Missing Extra Assumption:** You fail to note the key assumption: the agent must **accept any trade that improves their position by their own lights** (i.e., act on strict preference improvements).  

  4. **Limitations Section:**  
