answer: |-
  Below are comments in referee format, addressing each of your questions directly. I adhere strictly to your ground rules.

  ---

  **1. On §2 (Migration lemma vs. Duhemian holism)**  
  The sentence carrying novel content is:  
  *"The triviality result is a corollary of this lemma, and is therefore a theorem about partitions rather than about evidence."*  
  If deleted, §2 collapses into a relabeling of Duhem/Quine/Lakatos. The lemma adds value by recontextualizing trivial rivals as artifacts of *unconstrained partition shifts* (e.g., promoting inert conjunctions to core status), exposing why they lack scientific force. Without this, the section merely restates that core/periphery distinctions exist.

  **2. On §3’s criterion (Synchronicity and clause dominance)**  
  The synchronic/diachronic distinction is real: Lakatos appraises historical progress, while your criterion gates initial rivalry-status. However, clauses (ii) and (iii) *are* redundant if (i) is robustly construed:  
  - (ii) (Non-derivation) is subsumed by (i)’s requirement that R’s heuristic must generate auxiliaries *not* tailored to T’s O(T).  
  - (iii) (Stability) is circular: If R’s core carries its own heuristic (per (i)), migration operations would destroy R’s identity by definition.  
  *Strongest case for (i)’s sufficiency*: A rival satisfying (i) inherently resists derivation (§2’s back-fitting) and collapses under migration (which severs its heuristic from the core). (ii)/(iii) add no independent constraint.

  **3. On Newtonian vs. neo-Newtonian spacetime (§3)**  
  Demoting this pair is defensible but reveals a calibration flaw. Your criterion correctly notes that neo-Newtonianism lacks novel heuristics (failing (i)), making it parasitic. However, this pair is *not* a trivial rival in Duhem’s sense (it emerged from substantive physics, not conjunctions). This shows your criterion is *over-exclusive*: It excludes cases where equivalence is non-trivial but heuristically inert.  
  *Better test case*: **General relativity (GR) vs. teleparallel gravity (TPG)**. Both predict identical observations (empirically equivalent), but TPG licenses distinct auxiliary moves for quantum gravity (e.g., treating torsion as fundamental). Your criterion correctly identifies them as genuine rivals (passing (i)–(iii)), disciplining §3 by showing it captures non-parasitic equivalence where textbooks often overlook it.

  **4. Attribution accuracy**  
  - **Duhem (§1)**: Correct. Your gloss captures his thesis that falsification targets the whole theoretical bundle.  
  - **Quine (§4)**: Correct. Reconstrual of predicates *is* a partition shift (e.g., core ontology relocated).  
  - **Constructive empiricism (§4)**: *Departs*. Van Fraassen acknowledges that theories develop via pragmatic constraints, so equivalence isn’t purely "stipulated." Your claim that empiricism ignores partition-dependence oversimplifies.  
  - **Argument from unconceived alternatives (§4)**: Correct. Your link to partition-licensed rivals sharpens Stanford’s premise.  
  *(Uncertainty: None)*  

  **5. §5 worries: Which is more damaging?**  
  Worry (a) is fatal if unaddressed; (b) is manageable.  
  - (a) *Counterfactual grounding*: Cannot be grounded in doctrine structure alone. "Licenses" implies norms of rational theory-development, which are community-dependent (e.g., what counts as "natural" auxiliary move). Without sociological terms, no account of "license" avoids circularity (e.g., "structure" presupposes a prior partition). *This sinks §3* if objectivity is required.  
  - (b) *Self-immunization*: Less damaging. Demarcation criteria (e.g., falsifiability) often face this; it’s acceptable if the criterion explains scientific practice (as yours does).  

  **6. Structural edits for brevity/clarity**  
  - **Cut**: §5(b) (self-immunization). It’s a generic problem; resolving (a) is priority.  
  - **Soften**: The claim that neo-Newtonian equivalence does "unearned work" (§3). Concede that it illustrates *minimal* underdetermination, even if parasitic.  
  - **Overclaiming sentences**:  
    - §3: "Nothing competes for belief in that case." Overclaims; belief competitions *do* occur (e.g., in pedagogy).  
    - §4: "[Constructive empiricism’s] equivalence is legislated rather than found." Overstates; empiricists take equivalence as contextually fixed by practice.  
    - §2: "The Duhemian result survives because it concerns a constrained family." Implies Duhem *assumed* constrained partitions; he did not.  

  ---

  **Ungrounded substantive issue**:  
  Your thesis implies that *genuine* underdetermination requires partition-stable rivals. But in revolutionary shifts (e.g., phlogiston to oxygen), partitions are *destroyed*, not constrained. §3’s synchronic criterion may mischaracterize diachronic cases where rivals emerge from re-partitioning the *old* theory (e.g., Lorentz’s ether was re-partitioned by relativity). This needs explicit handling.
