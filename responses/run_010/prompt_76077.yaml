  For the ending constraint... ah! The apprentice's choice could involve recutting a damaged 'g'. Does she replicate the current shape exactly (honoring lineage) or revert to an older form (chasing the "true" shape)? But the user forbids easy compromises. So if she chooses to restore an ancestral form, that actively rejects the master's position, making it consequential.

  Better make the printer's observation cut both ways: he recognizes the 'g' as house style precisely because of its evolved quirks. That undermines the apprentice's purity-of-form stance. And the master's "bloodline" argument gains weight when we see him handle the first proof - not as a template but as a relic.

  Final scene idea: apprentice finds a worn 'g' punch. Instead of copying its imperfect state (continuing drift), she pulls early proofs to "correct" it... but stops, realizing she'd become a new origin point. So she cuts what's before her, accepting the chain. That earns the "identity in degrees" conclusion through action, not lecture.
