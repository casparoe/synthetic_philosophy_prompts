prompt: |-
  My friend directs a microbial evolution lab and has become the person in her department who signs off on wording before any manuscript is allowed to use the word "function." I have started treating her rulings as a forecasting problem, and the record is not converging on any rule I can state cleanly.

  Her verdicts so far:

  - "The function of the heart is to pump blood": fine as written.
  - A patient's congenitally malformed kidney that filters almost nothing: correct to write that the kidney is failing to perform its function, not that it has acquired a different one.
  - The human chin, largely a byproduct of jaw reduction, which currently does a bit of useful load-bearing: she strikes "the function of the chin is to reinforce the jaw."
  - The vestigial pelvic bones of a whale: no function; she will not accept "vestigial" as itself a function, and she does not think their minor contribution to muscle attachment changes that.
  - Ostrich feathers: "insulation" and "display" are both acceptable; "flight" is not.
  - A plasmid her lab moved into a line four days ago, with no selection acting since and an obvious contribution to growth on the current medium: "its function is to efflux the antibiotic" is acceptable right now, selection history or not.

  The case I want predicted is one she has not yet ruled on. We have just built a strain containing, first, a computationally designed enzyme with no ancestors whatever, first expressed last week, catalyzing the rate-limiting step of the pathway we want; and second, a native transporter gene that was ancestrally selected to import a sugar this strain can neither produce nor encounter, is still expressed, is still fully capable of importing that sugar, and whose only measurable contribution in practice is leaking a toxic analog into the cell and slowing growth.

  Will she say the designed enzyme has a function, and on what grounds? Will she say the transporter has one, and if so which — importing the sugar it will never see, or leaking the analog it actually leaks? Please lay out the candidate rules her track record admits, including at least one that is not simply "selection history" or simply "current contribution," state what each predicts about both parts of the new case, give me your single best forecast with the reasoning that earns it, name these positions if the literature has names for them, and identify the one further case I should put to her that would discriminate among the surviving rules. Answer in American English.
reasoning: |-
  Hmm, the user is presenting a fascinating puzzle about their friend's seemingly inconsistent rulings on what counts as a "function" in evolutionary biology. This is clearly about defining biological teleology - what makes something "for" something else. The cases span from textbook examples (heart pumping blood) to engineered systems (the plasmid) and now this hybrid synthetic/natural strain.

  Looking at the friend's track record: She accepts heart function despite individual failures (malformed kidney case), rejects spandrel-type explanations (chin), dismisses vestigial structures even with minor current uses (whale bones), allows current adaptive uses regardless of evolutionary origin (ostrich feathers for insulation/display but not flight), and crucially accepts engineered plasmid function without any selection history. That last point is key - it breaks the pure adaptationist framework.

  For the new case: The designed enzyme is clearly functional in the current system - it catalyzes the rate-limiting step. By the plasmid precedent (engineered function accepted immediately), she should accept this. The transporter is trickier - ancestrally selected for sugar import, but now only harmful. Her kidney ruling suggests she'd say its "function" remains sugar import (since it's failing to do that properly by leaking toxin), but her ostrich feather ruling shows she accepts current adaptive uses too. However, the toxin leakage isn't adaptive - it's harmful. 

  Possible rules emerging: 
  1) Selection History Essentialism (rejected by plasmid case)
  2) Current Contribution Only (contradicted by vestigial structures)
  3) "Proper Function" hybrid: ancestral purpose unless repurposed with current benefit (ostrich display)
  4) Contextual Purpose: what the system currently uses it for, regardless of history (plasmid case)

  The transporter case forces a choice between ancestral purpose (sugar import) and current effect (toxic leakage). Since the leakage isn't beneficial, she likely won't call it a function - but might not call sugar import its function either since it's not doing that. Parallel to whale bones: vestigial with minor current effect not counted as function.

  Discriminating test case: A gene with harmful ancestral function that's now beneficial in new environment. Would she say its function is the ancestral harm or the current benefit? That would split between historical and contextual theories.

  Forecast: 
  - Designed enzyme: YES, function is catalysis (by plasmid precedent)
  - Transporter: NO FUNCTION (like whale bones), though she might say its "proper function" is sugar import while acknowledging it's currently malfunctioning.
answer: |-
  Based on your friend's rulings, I've synthesized three candidate rules that fit her pattern of decisions. Below are the predictions for your new case, followed by my best forecast, literature-aligned names, and a discriminating test case.

  ### Candidate Rules from Her Verdicts:
  1. **Adaptive Contribution Rule**:  
     *A trait has a function if it currently provides a contextually significant adaptive benefit in the system where it operates. History is irrelevant if a current beneficial contribution exists.*  
     - **Fits**: Plasmid (current benefit accepted immediately), ostrich feathers (insulation/display are current benefits), whale bones (no *significant* benefit).  
     - **Rejects**: Pure selection-history definitions (plasmid accepted without history).  

  2. **Proper Function Hybrid Rule**:  
     *A trait's primary function is defined by its evolutionary history, but current contributions can be called "functions" if they are beneficial and stable. Vestigial or harmful traits lack function, even if historically selected.*  
     - **Fits**: Human kidney (historical function retained despite malfunction), ostrich feathers (display is current beneficial repurposing), whale bones (no historical/current benefit).  
     - **Rejects**: Calling harmful effects "functions" (toxic transporter leak).  

  3. **Contextual Role Essentialism**:  
     *Function is assigned based on the trait's role in maintaining the *current* system's viability. Harmful effects or negligible contributions are excluded, regardless of history.*  
     - **Fits**: Chin (minor load-bearing rejected as non-essential), whale bones (muscle attachment too minor), plasmid (essential for current growth).  
     - **Rejects**: Historical roles in irrelevant contexts (ostrich flight).  

  ---

  ### Predictions for Your New Case:
  - **Designed Enzyme**:  
    - *Adaptive Contribution Rule*: **YES**—it currently catalyzes the rate-limiting step, providing clear benefit.  
    - *Proper Function Hybrid Rule*: **YES**—no history, but its designed role is beneficial and stable in the system.  
    - *Contextual Role Essentialism*: **YES**—it is essential for the pathway’s function now.  

  - **Native Transporter**:  
    - *Adaptive Contribution Rule*: **NO**—it leaks toxins, causing harm; no adaptive benefit.  
    - *Proper Function Hybrid Rule*: **NO FUNCTION**—its historical role (sugar import) is obsolete (no sugar present), and current effect is harmful. "Leaking analog" is not a function.  
    - *Contextual Role Essentialism*: **NO**—its only measurable effect is harmful; it undermines system viability.  

  ---

  ### My Best Forecast & Reasoning:
  - **Designed Enzyme**: She will **say it has a function** (catalyzing the pathway).  
    **Reasoning**: This directly mirrors the plasmid case—no history, but clear *current essential contribution* to the system’s fitness. Her acceptance of engineered functions without selection history (plasmid) overrides historical purism.  

  - **Transporter**: She will **say it has *no* function**.  
    **Reasoning**:  
    - The kidney ruling shows she distinguishes between a trait "failing its function" (historical purpose) and "having a new function" (harmful leak isn’t one).  
    - The whale bones ruling rejects vestigial traits with minor/harmful effects as non-functional, even if historically selected.  
    - Leaking a toxin isn’t a "benefit," so it fails all three rules. She *might* say its "proper function" is sugar import historically, but it currently has *no function*—paralleling how she views the whale’s pelvis.  

  **Grounds**: Current contribution dominates when beneficial (enzyme/plasmid), but historical function only "counts" if the trait is *supposed* to do something useful (kidney). The transporter is neither beneficial nor fulfilling its historical role.  

  ---

  ### Literature Names:
  - Her stance aligns with **Karen Neander’s "Selected Effects Theory"** (*Proper Function Hybrid Rule*), which ties function to historical selection *unless* a trait is co-opted for a new beneficial role (e.g., ostrich feathers for display).  
  - But she departs from strict selectionism by accepting engineered functions (plasmid), leaning into **Peter McLaughlin’s "Systematic Capacity"** view—function as a trait’s causal role in a *current* system.  

  ### Discriminating Test Case:  
  **Present this scenario**:  
  *A bacterial gene ancestrally selected for arsenic detoxification is moved to a strain in an arsenic-free environment. There, it unintentionally degrades a lab-introduced herbicide, providing strong growth benefits. No selection has acted on this new effect.*  

  - **Selection-History Purists**: Function remains arsenic detox (ignoring current benefit).  
  - **Current Contribution Purists**: Function is herbicide degradation.  
  - **Her Likely Ruling**: She’d accept "function: herbicide degradation" (per ostrich display/plasmid), confirming the *Adaptive Contribution Rule* and rejecting rigid historical definitions.  

  This tests whether "current benefit alone" suffices (plasmid precedent) or if historical context constrains function (kidney precedent). Her answer would clarify if engineered/co-opted roles fully override history.
