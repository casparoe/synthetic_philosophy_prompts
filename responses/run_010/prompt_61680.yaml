  I notice #4 (seeking reply) is similar to #3 but more relational. Should tag as (A). Force same (7?), cost higher (6?) since it preserves relationship value, portability lower (4?), survivability similar (4?). Composite around 5.5. 

  #5 (proper-function): This is tricky. Could be (B) or (C). Leaning (C) - misdescribing the target. Force medium (6?) if cognitive damage explains nonbelief, but feels speculative. Cost high (7?) - fits doctrines like original sin. Portability low (3?) - very Christian. Survivability disastrous (1?) - blames nonbelievers' faculties. Composite ~4. Vibey score.

