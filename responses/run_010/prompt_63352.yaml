answer: |-
  Below is a structured 40-minute evaluation procedure for your charity club, designed around the ITN framework (Importance, Tractability, Neglectedness) with adaptations for high school constraints. It includes a scoresheet, thresholds, and safeguards against bias. I'll then apply it to your three proposals and end with critical weaknesses.

  ---

  ### **Charity Proposal Evaluation Procedure**  
  **Time:** 40 minutes per proposal  
  **Materials:** Printed scoresheet, timer, treasurer pre-approval list of charities.  
  **Output:** Pass/Fail/Kill decision + ITN score (1–125).  

  #### **Step 1: Pre-Filter (5 mins)**  
  *Checks basic feasibility before scoring.*  
  - **Q1:** Does the proposal comply with the student council rule? (≥1/3 of *money* must go local if donated.)  
  - **Q2:** Is the recipient treasurer-approved (not a random GoFundMe)?  
  - **Q3:** Are resources realistic? ($900 max, ≤200 volunteer hours).  
    → **Decision:** Fail any "no," and kill the proposal. *No scoring needed.*  

  #### **Step 2: Importance (I) - "How bad is the problem?" (10 mins)**  
  *Focus on scale and severity of suffering. Judgment call: Requires ethical weighting.*  
  - **Score (1–5):**  
    - 1 = Minor issue (e.g., temporary discomfort for few beings).  
    - 3 = Moderate issue (e.g., chronic suffering for hundreds).  
    - 5 = Catastrophic issue (e.g., death/permanent harm to thousands+).  
  - **Heuristic for high schoolers:**  
    - Use rough estimates of affected beings (humans/animals) and severity.  
    - *Good enough:* Compare to reference points (e.g., "malaria kills 600k kids/year," "our shelter houses 100 dogs annually").  
    - *Avoid inventing numbers:* Stick to relative terms (e.g., "better/worse than X").  
  - **Anti-bias rule:** If scoring animals vs. humans, debate: "Is saving 1 human life worth ≥100 animal lives?" Agree on a ratio *before scoring* (e.g., 1:10). Document this.  

  #### **Step 3: Tractability (T) - "How much good does our input do?" (10 mins)**  
  *Focus on marginal impact per dollar/hour. Judgment call: Hardest to estimate.*  
  - **Score (1–5):**  
    - 1 = Low impact (e.g., $1000 saves <1 life; hours achieve little).  
    - 3 = Moderate impact (e.g., $300 saves 1 life; hours tangibly help).  
    - 5 = High impact (e.g., $5 saves 1 life; hours critical to success).  
  - **Heuristic for high schoolers:**  
    - For money: Use known cost-effectiveness data (e.g., bednets = ~$5k/life saved).  
    - For volunteer hours: Estimate output (e.g., "10 hours = 10 dogs walked" vs. "10 letters = ? policy change").  
    - *Good enough:* Demand *one* real-world anchor (e.g., "GiveWell says $5k saves a life," "shelter says $50 feeds a dog/month").  
    - *Avoid inventing:* If no anchor exists, score ≤2. Gut feelings not allowed without evidence.  
  - **Anti-bias rule:** Challenge: "Are we overestimating because we like this cause?" Require examples of comparable interventions.  

  #### **Step 4: Neglectedness (N) - "Is extra help needed?" (10 mins)**  
  *Focus on funding gaps. Judgment call: Intertwined with tractability.*  
  - **Score (1–5):**  
    - 1 = Overfunded (e.g., >50% of need met).  
    - 3 = Moderately funded (e.g., 20–50% met).  
    - 5 = Critically neglected (e.g., <5% met).  
  - **Heuristic for high schoolers:**  
    - Research-lite: Use % of problem solved (e.g., "Only 10% of malaria-prone areas have nets") or local intel (e.g., "shelter says they’re at 50% capacity").  
    - *Good enough:* Binary estimate ("funding gap exists? yes=≥3, no=≤2").  
    - *Avoid inventing:* If unknown, score 3 (neutral).  
  - **Anti-bias rule:** Debate: "Is this neglected *because* it’s intractable/unimportant?" Adjust I/T scores if linked.  

  #### **Step 5: Scoring & Decision (5 mins)**  
  - **Calculate ITN score:** `I × T × N` (range 1–125).  
  - **Thresholds:**  
    - **KILL:** Score ≤20 (fails all criteria).  
    - **PASS:** Score 21–125.  
  - **Tiebreaker for PASSING proposals:**  
    1. Highest I score → 2. Highest T score → 3. **Vote** (if ties persist; acknowledges values).  
  - **Output:** Document scores + 1-sentence justifications.  

  ---

  ### **Scoresheet Template**  
  | Proposal: _____ | I | T | N | ITN | Pass/Kill? |  
  |-------------------|---|---|---|-----|------------|  
  | **Pre-Filter**    |   |   |   |     |            |  
  | Q1: Local $ rule? |   |   |   |     |            |  
  | Q2: Approved org? |   |   |   |     |            |  
  | Q3: Res. feasible?|   |   |   |     |            |  
  | **Importance (I)**| _ |   |   |     |            |  
  | Justification: _____ |   |   |     |            |  
  | **Tractability (T)**|  | _ |   |     |            |  
  | Justification: _____ |   |   |     |            |  
  | **Neglectedness (N)**| |  | _ |     |            |  
  | Justification: _____ |   |   |     |            |  
  | **Total (I×T×N)** |   |   |   | __ | ✅/❌      |  

  ---

  ### **Application to Your Proposals**  
  Assume:  
  - Human:animal suffering ratio = 1:10 (1 human life ≈ 10 animal lives; adjust per club debate).  
  - Bednet charity = Against Malaria Foundation (AMF; GiveWell-estimated $5k/life saved).  
  - Local factory bill = Moderate chance of passing (assume 1% per 100 letters influencing a vote).  

  #### **Proposal 1: $900 + 60h to local animal shelter**  
  - **Pre-Filter:** Pass (local, approved, resources feasible).  
  - **I (Importance):**  
    - Scale: Shelter houses ~100 animals/year. Suffering = moderate (stress, illness).  
    - Severity: Less than human death. Adjusted: 100 animals × 0.1 "human-equivalent" = ~10 human lives affected.  
    - Score: **3** (moderate; avoids death but reduces suffering).  
  - **T (Tractability):**  
    - Money: $900 feeds/vaccinates ~10-20 animals (shelter estimate). ~0.5–1 "human-equivalent" lives saved.  
    - Hours: 60h volunteering = cleaning/walking → reduces disease/stress. ~2–5 lives improved.  
    - Total impact: ~3–6 lives. Per dollar: Low ($900/3 lives = $300/life).  
    - Score: **2** (moderate-low; local work efficient but $ less impactful than bednets).  
  - **N (Neglectedness):**  
    - Shelter relies on donations; local funding gaps exist.  
    - Score: **4** (highly neglected locally).  
  - **ITN Score:** 3 × 2 × 4 = **24** → **PASS** (above 20).  

  #### **Proposal 2: $900 to AMF (bednets), 0 hours**  
  - **Pre-Filter:** **FAIL** (no local $; violates student council rule). Killed immediately.  
  - *Note:* If split ($300 local/$600 AMF), rescore. AMF portion: I=5 (saves lives), T=4 ($600 → 0.12 lives saved), N=4 → I×T×N=80. Local portion (shelter): I=3, T=2, N=4 → 24. But proposal isn’t split; killed.  

  #### **Proposal 3: $0, 200h writing letters for factory farming bill**  
  - **Pre-Filter:** Pass (no $ spent → local rule N/A; treasurer approves advocacy).  
  - **I (Importance):**  
    - Scale: Factory farming affects billions of animals/year. Suffering = extreme (confinement, mutilation).  
    - Severity: Adjusted: 1,000,000+ animals × 0.1 "human-equivalent" = vast scale.  
    - Score: **5** (catastrophic).  
  - **T (Tractability):**  
    - Hours: 200 letters. Assume 1 letter = 0.001% chance of bill passing. Bill passing = ~10% reduction in statewide factory farming (saves millions of animals).  
    - Impact: 200 letters × 0.00001 = 0.002% → saves ~20–200 animal lives (0.002–0.02 human-equivalent).  
    - Per hour: Very low impact (200h for ~0.02 lives).  
    - Score: **1** (low; advocacy impact is speculative and diluted).  
  - **N (Neglectedness):**  
    - Animal advocacy is underfunded vs. scale, but many groups work on it (HSUS, PETA).  
    - Score: **3** (moderate).  
  - **ITN Score:** 5 × 1 × 3 = **15** → **KILL** (below 20).  

  ---

  ### **Outcome Summary**  
  | Proposal       | ITN Score | Decision |  
  |----------------|-----------|----------|  
  | 1. Local shelter | 24       | PASS     |  
  | 2. Bednets      | FAIL      | KILL     |  
  | 3. Letter-writing| 15       | KILL     |  

  **Result:** Proposal 1 (shelter) passes; bednets fail pre-filter; letter-writing killed by low tractability. **The procedure delivers an "unwanted" result**: The high-importance letter-writing proposal fails due to low tractability, while the bednets proposal (which many favor) is killed by the local rule.  

  ---

  ### **What Would Change My Mind About ITN?**  
  **The core weakness:** ITN assumes impartial measurability, but **importance requires ethical choices the framework can’t resolve** (e.g., animals vs. humans). If your club prioritizes empathy/proximity, ITN undervalues local work.  

  #### **Where the Procedure Breaks First**  
  - **Step 2 (Importance):** Assigning human/animal ratios is inherently subjective. If members reject this, ITN collapses.  
  - **Step 3 (Tractability):** For advocacy/Systemic change, impact is often unmeasurable. If your club values "raising awareness" regardless of outcome, ITN dismisses valid efforts.  

  **Alternative Framework:** **Participatory Prioritization** (e.g., Delphi method). Members rank causes via:  
  1. Personal connection (e.g., "Have we met beneficiaries?").  
  2. Urgency (e.g., "Is suffering immediate?").  
  3. Values alignment (e.g., "Does this reflect our club’s mission?").  
  **Why?** Better for unquantifiable causes (e.g., advocacy) and reduces ethical disputes.  

  **When to Switch:** If ITN scores consistently contradict club values (e.g., always killing local proposals), or if research is too demanding.  

  **Upgrade for Your Club:** Hybridize ITN with values. Add a **"Values Alignment"** step (post-ITN) where members vote (1–5) on:  
  - _"Does this proposal resonate with our club’s spirit?"_  
  Multiply ITN score by this vote. This softens ITN’s rigidity while keeping structure.  

  This procedure forces explicit trade-offs—exactly as you asked. It won’t prevent all fights, but it will make them more productive.
