answer: |-
  Here’s a step-by-step plan for your 50-minute section, designed to build the problem sequentially, preempt misconceptions, and leave students with live philosophical options. Timing estimates are approximate.

  ---

  ### **Core Sequence (35 minutes total)**
  **1. Establish Hedonism’s Core Claim (7 mins)**  
  - *What to do:* Define hedonism as the view that **pleasure is the sole intrinsic good** and **pain the sole intrinsic bad**. Emphasize its simplicity: nothing else is good/bad *for its own sake*.  
  - *Why first?* Students must grasp hedonism’s *monism* (one fundamental good) before heterogeneity becomes a problem. Without this, "pleasure" could just be a label for diverse goods.  
  - *Preempting misconception:* If a student says "everything is various," reply: "True, but hedonism claims all good things share *one essential property*: being a pleasure. We’re testing if that property is real or just a word."  

  **2. Argue Hedonism Requires a Unified "Pleasure" (8 mins)**  
  - *What to do:* Ask: **"What must pleasure be like for hedonism to work?"** Guide students to see that if "pleasure" refers to fundamentally *different kinds* of goods (e.g., friendship, knowledge, sensory joy), hedonism collapses into pluralism (many intrinsic goods). Use an analogy:  
    - *Example:* If "food" is the only thing needed for survival, but "food" includes water, vitamins, and protein, we’d question whether "food" is one thing.  
  - *Why here?* Steps 1 and 2 create tension: hedonism needs a single, identifiable "good-maker," but our next move suggests "pleasure" might not provide this.  

  **3. Introduce Heterogeneity via a Single Anchor Case (15 mins)**  
  - *Chosen case:* **The easing of a cramp** (cessation of pain).  
  - *Why this case?*  
    - It lacks a "positive" feeling (unlike cold water or a proof clicking), forcing students to ask: **Is pleasure a feeling or just relief?**  
    - Contrasts sharply with "positive" cases without risking mind/body dualism (e.g., students won’t dismiss it as "just physical").  
    - *Rejected alternatives:*  
      - Bodily vs. intellectual pleasure: Invites "mind/body" distraction, and both *feel* like "something."  
      - Background contentment: Students may deny it’s a feeling at all, derailing the discussion.  
  - *How to deploy:*  
    1. Describe the cramp easing: intense relief, but no distinct "pleasure sensation."  
    2. Contrast with **cold water after a run** (clear sensory buzz) and **proof clicking** (non-sensory "aha!").
    3. Ask: **"Do these share a common *feeling*? Or is 'pleasure' doing different work in each?"**  
  - *Must leave out:* Do not assume cessation *isn’t* pleasure. Let students debate whether relief "counts."  

  **4. Generalize to the Heterogeneity Problem (5 mins)**  
  - *What to do:* Show other examples (resolution of a chord, warmth of friends) and ask: **"If these don’t share a unified feel, what unifies them as 'pleasures'?"**  
  - *Key point:* If nothing unified makes them good, hedonism’s simplicity is illusory. "Pleasure" might be an empty label for "whatever we find good."  

  ---

  ### **Preempting Misconceptions (8 minutes total)**  
  Address these *as they naturally arise* in Steps 2–4, not at the end:  
  - **"There’s one feel (a buzz) in all!"**  
    - *When:* Likely during Step 3.  
    - *Response:* "Does the *absence* of cramp pain feel like a buzz? Does understanding a proof *feel* like sipping water? If not, is 'buzz' essential to pleasure?"  

  - **"Heterogeneity refutes hedonism!"**  
    - *When:* During Step 4.  
    - *Response:* "Not yet—we’re exposing a challenge. Philosophers *disagree* on whether this kills hedonism. We’ll see responses shortly."  

  - **"This is about comparing pleasures!"**  
    - *When:* After introducing multiple cases.  
    - *Response:* "Heterogeneity is deeper: it asks if they’re the *same kind of thing* at all. Comparing intensities presumes they’re commensurable."  

  - **"Mill solved this with higher/lower pleasures!"**  
    - *When:* Step 2 or 4.  
    - *Response:* "Mill distinguishes quality, but still assumes both are 'pleasures.' Does his 'higher pleasure' (e.g., reading poetry) share a common feel with a cold drink?"  

  - **"Pleasure is an attitude, not a feeling!"**  
    - *When:* Step 3 or 4.  
    - *Response:* "That’s one possible reply! But does that *change* hedonism? If pleasure is 'liking something,' is it still about *experience*?"  

  ---

  ### **Closing: Live Options (7 minutes)**  
  *Present these as unsettled philosophical paths, not conclusions:*  
  1. **Common-Feel Defenders:** Some (e.g., Feldman) argue all pleasures share a uniform "hedonic tone."  
  2. **Attitude Theories:** Pleasure as a *propositional attitude* (e.g., "taking delight in X"). Solves heterogeneity but may abandon experiential hedonism.  
  3. **Aristotelian View:** Pleasure as the "flawless activity" of a capacity (e.g., running well). Not a feeling, but inseparable from the activity itself.  

  *What to omit:*  
  - ⚠️ **Do not cover** neural science (e.g., "liking vs. wanting") or non-feeling theories (e.g., purely dispositional views).  
  - ⚠️ **Do not present consensus:** Emphasize that experts *disagree* on whether heterogeneity is fatal.  

  ---

  ### **Final Comprehension Check (1 question)**  
  **"Why can’t a hedonist just say: 'Pleasure is whatever feels good, whatever that feels like'?"**  
  - *Why it works:* Reveals if they grasp the circularity problem. Strong answers will note:  
    - This reduces "pleasure is the good" to "the good is whatever is good."  
    - Hedonism loses explanatory power if "pleasure" has no independent definition.  

  ---

  ### **Key Assumptions to Flag to Students**  
  - "We’re assuming pleasures *are* introspectively heterogeneous—but some philosophers deny this!"  
  - "We’re treating hedonism as a theory about *experience*—but other versions exist!"  

  This plan avoids metaphysics deep dives, centers on one potent case (pain cessation), and makes the problem inescapable by sequencing hedonism’s unity requirement *before* revealing pleasure’s diversity. The close invites further inquiry without oversimplifying the debate.
