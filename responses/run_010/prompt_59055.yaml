  Okay, the user is a political philosophy professor preparing an opening address for a citizens' assembly they designed. This is high-stakes: the city faces a federal compliance order with three costly solutions, and there's a pending ballot measure that could invalidate the assembly's work. The speech must navigate six strict constraints while remaining accessible to diverse participants.

  Hmm, the core challenge is framing the advisory nature as strength rather than weakness. The professor's "spine" argument - that referendums discard reasons while assemblies discard authority - is brilliant but needs concrete translation. For the plumber and schoolteacher, I'll compare it to leaving a repair manual vs. just an invoice.

  *checks constraints again* Must avoid flattery about expertise. Instead, emphasize their role as "professional question-askers" selected for attentiveness. The Athenian reference should focus on agenda-setting power, not romanticized democracy.

