  *word count alert* At 1,100 words, it hits the sweet spot. The closing transitions smoothly to logistics - no vague inspiration, just "we'll break into groups now." 

  Most quotable-but-risky line: "You were not chosen for what you know..." Could be misused as dismissing expertise. But kept it because the contrast with "what you will do" is essential to the argument.

