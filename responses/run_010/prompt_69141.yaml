prompt: |-
  I've spent years reading decision-theoretic rationalist writing and have only recently turned to just war theory, where I've hit a knot I can't untie. The standard story is that Walzer's moral equality of combatants gives soldiers on both sides an equal liberty to kill and an equal immunity from being killed, and that McMahan's revisionism replaces this with liability: one becomes liable to defensive harm through one's moral responsibility for an unjust threat, so combatants on the unjust side are liable and combatants on the just side are not. But the revisionists then say that many unjust combatants — conscripts, people holding reasonable false beliefs about their own cause — are not responsible enough to be liable, and they insist that liability is something distinct from permissibility all things considered, the latter being where lesser-evil reasoning lives. I cannot see what work the second notion is doing that the first isn't already doing. Please explain, for someone fluent in expected-value reasoning but not in rights-and-forfeiture machinery, what liability adds to a case-by-case weighing of harms, and why the obvious consequentialist repair — allowing the killing of non-liable combatants whenever it is the lesser evil — is supposed to fail at restoring Walzer's symmetry.

  Answer as exactly five numbered points, one or two sentences each, with no introduction and no conclusion, covering in order:

  1. what liability does that an all-things-considered balancing of harms cannot do on its own;
  2. how the conscript and reasonable-false-belief cases drive a wedge between liability and culpability, and why revisionists ground liability in responsibility rather than blameworthiness;
  3. the actual reason, not merely the intuition, why a lesser-evil justification for killing non-liable combatants does not put both sides back on equal footing;
  4. what a convention or practice of war could and could not supply as a substitute for liability;
  5. whether any part of this disagreement is even visible to someone whose only normative tools are expected values plus side constraints on pursuing them.
reasoning: |-
  Hmm, the user is grappling with a complex issue in just war theory between Walzer's moral equality of combatants and McMahan's revisionism. They're fluent in decision theory but new to rights-based frameworks, and can't see why liability adds value beyond lesser-evil calculations. I need to break this down into five precise points as requested.

  For point 1, I'll emphasize that liability solves the threshold problem - it explains why some threats can be eliminated without needing to outweigh victim harm, which proportionality alone can't do. The conscript cases in point 2 show that responsibility (material contribution to threats) creates liability without moral blameworthiness. This is key because revisionists want to avoid punishing ignorant contributors.

  Point 3 needs to show why lesser-evil killings don't restore symmetry: unjust combatants still objectively endanger non-liable people, while just combatants only endanger liable ones. The moral asymmetry runs deeper than outcomes. For point 4, conventions might manage expectations but can't make non-liable persons morally killable - that's a core deontological limit.

  Finally for point 5, expected value calculations with side constraints might approximate some liability judgments, but will miss the categorical distinction between "can be permissibly harmed" versus "may not be harmed unless...". The rights-forfeiture machinery does work that balancing can't replicate.

  I'll keep each point to one or two dense sentences as requested, using the exact terminology from McMahan's framework while bridging to decision-theoretic concepts where possible. The challenge is packing sufficient nuance into such concise responses.
answer: |-
  1. Liability identifies when defensive harm *requires no further justification* because the target has forfeited rights against it, whereas lesser-evil balancing always requires demonstrating net positive consequences to override a persisting right not to be harmed.
  2. Conscripts or those with reasonable false beliefs may cause unjust threats without culpability (blameworthiness), yet their *responsible agency* in materially contributing to the threat grounds liability, separating it from moral desert and focusing on the objective threat posed.
  3. Lesser-evil killing of non-liable unjust combatants remains objectively impermissible (though potentially excused), preserving the deep asymmetry: unjust combatants *always* target non-liable persons, while just combatants target only the liable.
  4. Conventions could create symmetrical *expectations* of immunity or regulate targeting practices, but cannot morally *confer* the liberty to kill non-liable persons or erase the underlying liability asymmetry; they can only manage its expression.
  5. Expected value plus side constraints *can* model liability as a side constraint (no killing unless liable) and lesser-evil as overriding constraints when net gains are high, making the *distinction* visible, but not the deeper moral difference between forfeiture and constraint-overriding.
