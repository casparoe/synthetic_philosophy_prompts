  9. Determinism in a similar world.
  10. Best system.

  But we have 7 stipulations, so we need to cover them. Stipulation 5 (time-reversal and late fact) is in Q5; stipulation 3 (generalization that fails) we haven't used directly, but we have the chance question. Stipulation 4 is Q4. Stipulation 6 is Q3. Stipulation 7 is Q6. Stipulation 2 is Q2. Stipulation 1 is Q1.

