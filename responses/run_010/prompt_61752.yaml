    - A: BSH, Prag (if the best system can ignore the exception if it's costly to include)
    - B: NU, DE, Gov (laws are strict and universal)
    - C: BSH, Prag (but we have A for them)

  * Better to ask about a small violation.

  **Question 8 (Governance):** When a mote meets a knot and hands over half its charge, what makes this happen?

  - A: The laws of nature actively govern the events, making them unfold that way.
  - B: The laws are just a description of the regularities, so it happens because it is part of the pattern.
  - C: There are no laws, so there is no "make" involved.

  * Positions:
    - A: NU, DE, Gov, Stab
    - B: BSH, Prag
    - C: Scept

  **Question 9 (Indeterminism and explanation):** In the mote scattering, when a particular mote scatters left instead of right, is there an explanation for why it scattered left?

  - A: Yes, there is a hidden factor that caused it to scatter left.
  - B: No, it is fundamentally random.
  - C: The concept of explanation doesn't apply.

  * Positions:
    - A: DE, Gov, NU (if they believe in hidden variables) or Stab; but they might accept randomness, so not necessarily.
    - B: BSH, Prag (if the best system says it's random)
    - C: Scept

  * But non-Humeans can accept indeterminism. So they might say B.

  * Better: For the scattering with chance 0.5, if the actual frequency is 0.5, but in a particular run it scatters left, is there an explanation for that particular event?

  - A: Yes, the initial conditions and laws determine the outcome (but it's indeterministic, so not).
  - B: No, it's a matter of chance.
  - C: We can explain it by the chance, but not why it happened rather than not.

  * Then:
    - B: BSH, Prag, and non-Humeans who accept indeterminism
    - A: only if they think it's deterministic
    - C: might be a variant of B.

  * So not good. Let's use a different approach.

  **Question 9 (Determinism):** In a different world that is very similar to W but mote scattering is deterministic (always the same outcome in the same conditions), would the laws of nature be different from those in W?

  - A: Yes, because the regularity is different.
  - B: No, because the laws are not defined by regularities.
  - C: The question is moot because there are no laws.

  * Positions:
    - A: BSH, Prag
    - B: NU, DE, Gov, Stab
    - C: Scept

  **Question 10 (Best System):** The best simple systematization of W's history includes the Halving Rule as an axiom. Does this make the Halving Rule a law of nature?

  - A: Yes, because the best system tells us the laws.
  - B: No, the best system is a human construct and doesn't determine what the laws are.
  - C: There are no laws.

  * Positions:
    - A: BSH, Prag
    - B: NU, DE, Gov, Stab
    - C: Scept

  Now, let's compile 10 questions. We'll use:

  1. Counterfactual with more motes.
  2. Knot color uniformity.
  3. Chance vs frequency.
  4. Complex regularity.
  5. Time-reversal explanation.
  6. Intervention.
  7. Small violation of regularity.
