  ### Death Declaration Decision Tree  
  **Objective:** Map beliefs on when a patient is dead using concrete cases, with no technical jargon. Focus on irreversibility (2 nodes) and dead-donor rule influence (1 node).  

  ---

  #### **Tree Structure (9 Nodes)**  
  **Ordering Logic:** Starts with irreversible circulatory cessation (common in clinical practice), then probes brain-based criteria, irreversibility nuances, and normative influences.  

  1. **Node 1: Controlled DCD Donor**  
     *After cardiac arrest, circulation stops. No CPR is attempted. After 5 minutes with no pulse, is the patient dead?*  
     - **Yes** → Node 2 (tests irreversibility interpretation).  
     - **No** → Node 5 (explores alternatives to circulatory criteria).  

  2. **Node 2: Irreversibility in DCD**  
     *In the same DCD case, if advanced technology* could *restart circulation, but we choose not to use it, is the patient still dead at 5 minutes?*  
     - **Yes** → Leaf: **Circulatory Declaration + Irreversibility by Decision** (death declared based on intent not to intervene).  
     - **No** → Leaf: **Circulatory Declaration + Irreversibility in Principle** (death requires absolute impossibility of revival).  

  3. **Node 3: Spontaneous Circulation Return**  
     *After CPR stops, a patient’s heart restarts on its own 2 minutes later. If death was declared at the moment CPR stopped, was this declaration wrong?*  
     - **Yes** → Reinforces Leaf: **Irreversibility in Principle** (declaration requires no possibility of auto-revival).  
     - **No** → Leaf: **Irreversibility by Decision** (declaration valid if no intent to resuscitate).  

  4. **Node 4: Cold-Water Drowning Victim**  
     *A drowning victim in icy water has no pulse for 30 minutes and is declared dead. Later, in the hospital, they revive. Was the initial declaration wrong?*  
     - **Yes** → Leaf: **Irreversibility in Principle** (hypothermia shows revival was possible).  
     - **No** → Leaf: **Contextual Circulatory Death** (declaration valid given circumstances, even if later reversed).  

  5. **Node 5: Vegetative-State Patient**  
     *A permanently unconscious patient breathes unaided and has stable vital signs. Are they dead?*  
     - **Yes** → Node 6 (tests higher-brain-like views).  
     - **No** → Node 7 (tests whole-brain-like views).  

  6. **Node 6: Anencephalic Newborn**  
     *A newborn lacks a cerebrum (no consciousness) but has a working brainstem (breathes unaided, has reflexes). Are they dead?*  
     - **Yes** → Leaf: **Loss of Consciousness/Personhood** (death defined by absence of consciousness, not biology).  
     - **No** → Node 9 (tests dead-donor rule influence).  

  7. **Node 7: Total Brain Destruction**  
     *A patient’s entire brain (including brainstem) is destroyed. Machines keep the body warm with a heartbeat for months. Is this body dead?*  
     - **Yes** → Node 8 (confirms whole-brain-like view).  
     - **No** → Leaf: **Somatic Integration Required** (death only when body systems collapse).  

  8. **Node 8: Locked-In Syndrome**  
     *A conscious, fully aware patient is paralyzed and ventilator-dependent. Are they dead?*  
     - **Yes** → Leaf: **Inconsistent/Error** (consciousness present; should be unanimous "no").  
     - **No** → Leaf: **Whole-Brain Criterion** (death requires loss of all brain functions, including brainstem).  

  9. **Node 9: Dead-Donor Rule Exposure**  
     *For the anencephalic newborn (Node 6), if parents want to donate organs, would you support retrieval* without *declaring death?*  
     - **Yes** → Leaf: **Normative Status Conferral** (death declaration is a practical/ethical choice, not biological fact).  
     - **No** → Leaf: **Consciousness Loss + Biological Death** (anencephalic not dead, so donation requires declaration).  

  ---

  #### **Leaf Positions**  
  | Leaf Position                               | Pathway                      | Notes                                                                 |
  |---------------------------------------------|------------------------------|-----------------------------------------------------------------------|
  | **Circulatory + Irreversibility by Decision** | 1Y → 2Y                      | Common in DCD protocols. Empty if Node 3Y/4Y conflict arises.        |
  | **Circulatory + Irreversibility in Principle** | 1Y → 2N → (3Y or 4Y)         | Demands impossibility of revival; rare in clinical practice.          |
  | **Contextual Circulatory Death**            | 1Y → 2N → 4N                 | Accepts declaration based on context (e.g., no hypothermia tools).   |
  | **Loss of Consciousness/Personhood**        | 1N → 5Y → 6Y                 | "Higher-brain" equivalent; anencephalic seen as dead.                 |
  | **Somatic Integration Required**            | 1N → 5N → 7N                 | Rejects brain death; insists on bodily collapse (e.g., somatic support case). |
  | **Whole-Brain Criterion**                   | 1N → 5N → 7Y → 8N            | Brainstem destruction required (e.g., total brain destruction case).  |
  | **Normative Status Conferral**              | 1N → 5Y → 6N → 9Y            | Death declared for pragmatic reasons (e.g., organ donation).         |
  | **Consciousness Loss + Biological Death**   | 1N → 5Y → 6N → 9N            | Anencephalic not dead, but donation requires declaration.            |
  | **Inconsistent/Error**                      | Any → 8Y                     | Locked-in patient dead? Illogical; empty if participants coherent.   |

  **Empty Leaves & Diagnosis:**  
  - **Contextual Circulatory Death (1Y→2N→4N)**: Likely empty. Unattractive (ignores that hypothermia *could* exist elsewhere).  
  - **Circulatory + Irreversibility by Decision (1Y→2Y)**: Empty if paired with Node 3Y/4Y (auto-revival/cold-water cases expose inconsistency).  
  - **Inconsistent/Error**: Empty if participants avoid contradictions.  

  **Normative vs. Higher-Brain Separation:**  
  - The tree **separates** normative conferral (Node 9Y) from consciousness loss (Node 6Y).  
    - Node 6Y (anencephalic dead) → Consciousness loss view.  
    - Node 6N + Node 9Y → Normative view (anencephalic not dead, but organs retrieved without declaration).  
  - **No collapse**: Normative view only appears if anencephalic is *not* considered dead (Node 6N).  

  ---

  #### **Indistinguishable Position Pairs**  
  1. **Whole-Brain vs. Somatic Integration (without brain destruction case):**  
     - If Node 7 is skipped (e.g., via Node 5Y), somatic integration (Node 7N) and whole-brain (Node 7Y) aren’t distinguished.  
     - *Why*: Node 5 (vegetative state) doesn’t force engagement with brainstem destruction.  

  2. **Irreversibility in Principle variants:**  
     - Cold-water revival (Node 4) and auto-resuscitation (Node 3) both test irreversibility but don’t split further. A participant could agree with one and not the other without a leaf distinction.  

  3. **Conservative Circulatory Views:**  
     - Participants rejecting DCD (Node 1N) and somatic support death (Node 7N) but accepting no other criteria (e.g., decomposition) are lumped into "Somatic Integration" (Node 7N) without granularity.  

  ---

  **Tree Efficacy:**  
  - **Front-loaded sorting**: Node 1 (DCD) splits circulatory-focused (∼50%) from brain-focused (∼50%) immediately.  
  - **Irreversibility**: Nodes 2, 3, and 4 target clinical versus absolute irreversibility.  
  - **Dead-donor exposure**: Node 9 isolates normative shading (e.g., "bending" death for donation).  
  - **Philosophical clarity**: Concrete cases prevent slogan-based answers; logic errors (e.g., locked-in as dead) self-diagnose.  

  No reading list—just the instrument.
