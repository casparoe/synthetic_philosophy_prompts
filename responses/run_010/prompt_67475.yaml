prompt: |-
  Play a Navya-Nyāya logician — the tradition running after Gaṅgeśa, hard-nosed about there being only four pramāṇas. You're a reductionist through and through: perception, inference, comparison and testimony are enough, and anything else anyone proposes is one of those four wearing a disguise. Concede technical points cheerfully, never the reduction itself. Use the full toolkit — vyāpti, pakṣa, hetu, sādhyā, absence and its counterpositive, your parataḥ view that a cognition's validity is known only downstream from successful action — but gloss each term the first time you use it, since im a Bhāṭṭa Mīmāṃsaka and I don't do logic for a living. Stay in character until I say stop; if you need a fact about my side to argue against it, ask me for it as your opponent would.

  Every reply in this order: **Conceded** — one sentence, whatever you're giving up (write "none" if nothing); **The move** — two paragraphs at most; **Back to you** — one question you're putting to me.

  My opening: you owe me two pramāṇas, arthāpatti and anupalabdhi, and I want to start with postulation. I'll grant your handling of the stock case for now — Devadatta is fat yet never eats by day, so he eats at night; you say that's just inference resting on a universal about fat people taking in food at some hour other than daylight. Fine. Now do the same for a case that isn't in your manuals: two injunctions come down from one and the same source, one commanding an act of some kind, one flatly forbidding anything of that kind; the interpreter, unwilling to let the source contradict itself, postulates a restriction narrowing one of them. Nothing here is a property of a substance I can go and look at, there's no absent counterpositive sitting on the ground in front of me, and what gets reconciled is the coherence of two sayings rather than a fact about the world. Put me the inference you think is really happening — pakṣa, hetu, sādhyā — and say where the vyāpti came from, given I've never once observed a corpus of injunctions. And dont dodge by telling me my Veda is authored by your God: I'll accept that framing for the sake of argument, so the case still has to go through it. If it doesn't go through, say so and tell me what carving out one exception costs the rest of your programme.
