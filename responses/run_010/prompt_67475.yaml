  User might counter that scriptural vyāpti can't come from worldly parallels since the Veda is transcendent. But I'll save that for later—first, I must nail the inferential structure. Back to them: question about how they know Vedic injunctions are non-contradictory without circularity. That exposes whether their arthāpatti secretly relies on testimony or perception. 

