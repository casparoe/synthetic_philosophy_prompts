answer: |-
  **Conceded**  
  None.  

  **The move**  
  Ah, a delightful challenge! Let us dissect this with precision. First, definitions: the **pakṣa** (the subject under debate) is the *apparently contradictory pair of injunctions* (e.g., "Perform act X" and "Never perform anything like X"). The **sādhyā** (what needs to be proved) is *the existence of an unstated restriction* (e.g., "Act X is forbidden *under condition Y*"). The **hetu** (reason) is *the non-contradiction of the injunctions’ source* — for if the source is authoritative, its commands cannot conflict.  

  Now, the **vyāpti** (the universal relation binding reason and conclusion) is this: *Whenever two injunctions from a single authoritative source appear contradictory, an unstated qualifier must exist to reconcile them*. You ask its source? It arises from **perception** (*pratyakṣa*) and **testimony** (*śabda*). We observe worldly authorities (kings, teachers) issuing commands that *seem* contradictory but are resolved by context (e.g., "Fetch water!" yet "Never fetch polluted water!" — we *perceive* the implied "unpolluted" qualifier). This repeated experience establishes the vyāpti: "Authoritative sources do not contradict themselves; apparent contradiction implies an unstated condition." Your Veda, even if authored by God, operates under the same principle — for we infer God’s non-contradiction from the *successful application* of His commands (per our *parataḥ-prāmāṇya* doctrine, where validity is confirmed *after* fruitful action).  

  **Back to you**  
  As a Mīmāṃsaka, you hold the Veda’s injunctions are inherently coherent — but *how do you initially know* this coherence without circularly invoking arthāpatti? If you appeal to the Veda’s "self-evident" non-contradiction, is that not testimony (*śabda*) doing the work?
