answer: |-
  Here’s your prep sheet, tailored to your audience and ordered by potential damage. I’ve framed objections in the likely vocabulary of attendees, with strategic concessions, replies, and soft spots.  

  ### **Top 8 Objections (High to Low Damage)**  
  1. **Communitarian (Political Theorist)**  
     *Objection:* "You reduce self-determination to a moral straitjacket. If a community can’t define its constitutive boundaries through associative obligations, it ceases to be a *political* community and becomes a moral hotel."  
     → **Concede:** "Communities *do* need shared self-understanding to function."  
     → **Reply (2 min):** "But democratic self-determination is premised on *equality*. When birthright exclusion becomes foundational, it poisons that equality by institutionalizing inherited hierarchy. A community that routinely subordinates ‘outsiders’ to preserve ‘insider’ privilege isn’t exercising autonomy—it’s betraying its core commitment to mutual accountability. Walzer himself warns against ‘tyranny’ when groups fix membership arbitrarily."  
     → **Soft spot:** Assumes exclusion *necessarily* corrupts; doesn’t address non-democratic communities.  

  2. **Empirical Researcher**  
     *Objection:* "You dismiss restrictionism as racial anxiety, but my data shows voters oppose open borders over concrete worries: wage suppression, welfare strain, cultural friction. How do you distinguish xenophobia from legitimate prudence?"  
     → **Concede:** "Not all restrictionist sentiment is racist; material concerns matter."  
     → **Reply:** "But when ‘prudence’ consistently targets racialized groups despite evidence (e.g., migrants’ net fiscal contribution), it reveals *anxiety* masquerading as pragmatism. My argument isn’t that all worries are racist—it’s that the *institutional practice* of border policing sustains a mindset that interprets difference as threat. The empirical question is whether borders *produce* the xenophobia they claim to manage."  
     → **Soft spot:** Conflates motive with outcome; lacks causal data linking borders to civic corruption.  

  3. **Carens-flavored Liberal**  
     *Objection:* "Why do we need your civic corruption thesis? Carens’ birthright lottery already condemns exclusion as arbitrary. Your ‘duty to ourselves’ adds no new normative force—it just dresses up his argument in communitarian clothing."  
     → **Concede:** "Carens’ critique of birthright is essential."  
     → **Reply:** "But Carens focuses on the *wrong* done to migrants. My argument shows exclusion also *actively degrades* the excluding community’s democratic character. This isn’t redundancy—it’s a stronger bulwark against consequentialism. When interests clash (e.g., ‘absorption capacity’), Carens’ approach can be overridden; a duty to self-preservation cannot."  
     → **Soft spot:** Risks making the duty *too* rigid; ignores Carens’ institutional pragmatism.  

  4. **Legal Scholar 1 (Constitutionalist)**  
     *Objection:* "If the duty is owed by the polity *to itself*, not to migrants, what legal standing do the excluded have? Rights require claimants. Without that, this is poetry—not something courts or ministers can enforce."  
     → **Concede:** "This duty doesn’t create justiciable individual rights."  
     → **Reply:** "Enforcement isn’t about migrant litigation but *constitutional design*. Democracies codify duties to themselves all the time (e.g., separation of powers). Legislatures could embed admission quotas as non-derogable commitments to self-correction—like Germany’s ‘militant democracy’ against extremism."  
     → **Soft spot:** Feels evasionary; doesn’t solve how migrants demand entry.  

  5. **Perfectionism Critic (Political Theorist)**  
     *Objection:* "You make the state an engineer of civic virtue. But isn’t this illiberal perfectionism? Why should your ideal of ‘uncorrupted community’ override pluralism about the good life?"  
     → **Concede:** "States *shouldn’t* impose singular visions of flourishing."  
     → **Reply:** "This isn’t about ‘the good life’—it’s about preserving the *preconditions* for democratic legitimacy. Just as we forbid voter suppression to protect procedural fairness, we forbid hereditary exclusion to prevent civic rot. It’s anti-perfectionist: the goal is avoiding self-sabotage, not promoting virtue."  
     → **Soft spot:** Still implies a "correct" democratic character.  

  6. **Legal Scholar 2 (Policy Realist)**  
     *Objection:* "Your view offers zero guidance on *who* to admit or *how many*. If we can’t distinguish refugees from economic migrants, or set limits, policymakers will ignore you as decorative."  
     → **Concede:** "This framework doesn’t generate a priority queue."  
     → **Reply:** "It does something prior: it forces the *burden of justification* onto restriction. The default isn’t ‘close doors until we decide’—it’s ‘open unless exclusion is proven necessary for survival.’ Empirical debates (e.g., ‘absorption capacity’) happen *after* we accept the duty’s existence."  
     → **Soft spot:** Feels like kicking the can; prioritization remains unanswered.  

  7. **Paternalism Skeptic (Ethicist)**  
     *Objection:* "Saying we admit migrants ‘for our sake, not theirs’ treats them as instruments of our moral hygiene. Isn’t that patronizing—and doesn’t it ignore their agency?"  
     → **Concede:** "Migrants’ interests matter independently."  
     → **Reply:* "But this duty *complements* migrant-centered claims; it doesn’t replace them. We admit both because migrants deserve freedom *and* because we deserve to avoid corruption. Instrumentalization would only occur if we disregarded migrant welfare entirely—which I don’t."  
     → **Soft spot:** Still centers the community’s moral needs over migrants’.  

  8. **Walzerian Respondent**  
     *Objection:* "Aren’t you conflating *birthright* with *boundary*? Walzer’s point is that communities must control admissions to sustain shared meaning—but they could abolish birthright citizenship and still restrict entry ethically."  
     → **Concede:* "Birthright isn’t the only exclusionary practice."  
     → **Reply:* "But any long-term exclusion based on arbitrary traits (birthplace, race, etc.) will corrode democratic character. Walzer’s ‘shared meaning’ can’t coherently rest on inherited privilege without becoming a caste system. The critique isn’t of closure *per se*, but of closure that entrenches fixed hierarchy."  
     → **Soft spot:* Doesn’t address time-limited closure (e.g., crisis migration).  

  ---  
  ### **Strategy for Survival**  
  - **Give away early (First 5 mins):** Concede the **refugee/economic migrant distinction**. *Phrase it:* "My argument doesn’t resolve *prioritization*—it establishes why exclusion requires exceptional justification. Even if we admit only refugees initially, the burden shifts to justifying why others *must* be excluded."  
    → *Why:* Prevents dismissal as "unworldly"; shows engagement with policy constraints.  

  - **Reply that MUST land:** Target the **Communitarian objection**. If they reject the link between exclusion and civic corruption, the thesis collapses. *Hammer this:* "Exclusion isn’t neutral boundary-setting—it’s an active cultivation of inequality. A democracy that *depends* on birthright hierarchy to define itself has ceased to be democratic."  

  - **Pray nobody asks:**  
    **"If civic corruption is gradual, at what point does a polity lose its ‘democratic character’? How many exclusions before we become ‘corrupt’—and who decides?"**  
    → *Why:* Your argument hinges on a threshold you can’t define. It invites "slippery slope" attacks and exposes the theory’s lack of institutional metrics.  

  ### **Final Note**  
  Lean into your twist: "This isn’t about altruism—it’s about *democratic self-defense*." Your audience fears moralizing naïveté. Frame this as hardheaded realism: communities that idolize exclusion lose the moral authority to call themselves democracies. Survive the Walzerian by agreeing communities need boundaries—but insist those boundaries must not calcify into hereditary privilege.
