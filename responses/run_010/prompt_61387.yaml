prompt: |-
  ok so I'm in a migration ethics seminar this semester and we have to hand in a one-page proposal before the actual paper (7000 words), and my idea is still pretty mushy so I could use some help tightening it up.

  everyone in class keeps arguing about which country should take refugees — proximity, capacity, colonial history, who caused the displacement. But it struck me that basically all of those debates assume the person has already managed to get somewhere. Asylum as an institution is built on showing up: you have to reach the territory or the border and claim in person. Which means the whole system ends up sorted by who can travel — young, healthy, cash for smugglers, no dependants — and the people who most obviously need protection (stuck in camps, disabled, elderly, single parents, anyone whose own government won't issue a passport) are exactly the ones the arrival-based route can't reach. Resettlement is supposed to plug that gap but it's tiny, discretionary, and looks more like a gift than a claim.

  So my question is roughly: is the presence requirement just an administrative convenience, or is it built into what asylum *is*? And could there be a genuine right to be brought — an obligation on some state to move you — rather than only an obligation not to shove you back once you're there? And if there could, then the allocation problem comes back in a new form: which state owes the fetching, and does the fact that you can't reach anyone make every capable state a candidate?

  Can you turn that into an actual proposal? I want:

  - the question stated precisely — I'm pretty sure there's two or three seperate questions hiding in there and I need them pulled apart
  - why the existing positions don't settle it. I know the standard moves (non-refoulement, the fights over offshore processing and extraterritorial jurisdiction, the fair-distribution stuff, corrective-justice framings, surrogate protection) but the proposal has to say why none of them actually answers what I'm asking
  - the method, and be concrete about it — what do I do week by week over six weeks, alone, no fieldwork, purely conceptual. Also say why this route rather than the obvious alternatives, like just reporting the empirical data on who reaches borders or doing a straight textual analysis of the convention
  - what a good result looks like and what would count as failure — e.g. if my "right to be brought" turns out to be resettlement with a nicer name on it, is that a failed project or an acceptable finding?
  - an honest note on whether this is too big for 7000 words and what I should cut first

  don't bother with citations or a reading list, I'll add those myself.
reasoning: |-
  Okay, the user is in a migration ethics seminar and needs help refining their paper proposal. Their core idea challenges the requirement for refugees to physically reach a country's border to claim asylum. They point out that this system favors those who can travel, leaving vulnerable groups behind. The user wants a structured proposal with clear questions, critique of existing frameworks, methodology, success metrics, and scope assessment.

  First, I need to unpack their central concern: the "presence requirement" in asylum law. They're asking whether this is merely administrative or fundamental to asylum itself. Then there's the idea of a "right to be brought" – an obligation for states to transport refugees. This introduces allocation questions: which state is responsible when someone can't reach any border? The user mentioned these questions are mushy, so clarifying them is key.

  The existing frameworks like non-refoulement or resettlement don't fully address this. Non-refoulement only protects those who've arrived, and resettlement is discretionary and limited. Corrective justice arguments focus on responsibility for displacement but don't solve the access issue. So the gap is clear: current systems don't establish a duty to proactively reach those who can't move.

  For methodology, the user specified a six-week, purely conceptual approach. Week 1 would define the problem and critique the presence requirement. Week 2 would analyze existing legal frameworks. Week 3 explores the "right to be brought" concept. Week 4 tackles allocation principles. Week 5 addresses objections. Week 6 refines the thesis. This avoids empirical or textual analysis because the user wants a normative argument.

  Success means demonstrating that the presence requirement isn't inherent and that a "right to be brought" could exist, distinct from resettlement. Failure would be if the argument just rebrands resettlement. The user needs to show how their idea is different—perhaps through mandatory obligations and allocation principles.

  Assessing scope: 7000 words is tight. Cutting the historical evolution of asylum or detailed policy designs makes sense. Focusing on conceptual groundwork and normative arguments keeps it manageable. The user should prioritize the core ethical questions over broader applications.

  The user's deeper needs include wanting their proposal to stand out in class discussions focused on distribution. Highlighting the access issue addresses an overlooked aspect. They also need feasibility—ensuring the project is doable within constraints. Providing a clear roadmap with weekly goals helps structure their work. Lastly, they need confidence that their idea is original and viable, so emphasizing the gap in existing literature is crucial.
answer: |-
  Here’s a tightened proposal framework addressing your core concerns, designed for clarity and feasibility within a 7,000-word conceptual paper:

  ---

  **Proposal Title:** Beyond Arrival: The Ethics of the Presence Requirement and the Case for a "Right to Be Brought" in Asylum

  **1. Precise Research Questions:**
      *   **Q1 (Foundational):** Is the requirement for physical presence within or at the border of a state *inherent* to the concept of asylum as a protection mechanism, or is it primarily an administrative/geographic contingency of the current international system?
      *   **Q2 (Normative):** Can a coherent and justifiable *right to be brought* (a positive obligation on states to facilitate the movement of entitled individuals to safety) exist as a necessary complement to the *right to non-refoulement* (the negative obligation not to return them to danger), particularly for those physically unable to access territories?
      *   **Q3 (Allocative):** If such a right exists, what principles could determine *which* state(s) bear the obligation to "fetch" individuals stranded without access to any asylum procedure, and does the sheer impossibility of access create a claim against *all* capable states?

  **2. Why Existing Positions Don't Settle It:**
      *   **Non-refoulement & Extraterritoriality Debates:** Focus on obligations *once someone is within reach* (e.g., at a border post, interdicted at sea) or on *preventing return*. They presuppose presence or proximity and remain silent on proactive extraction from *inaccessible* locations.
      *   **Resettlement Framings:** Treat resettlement as discretionary humanitarian aid or burden-sharing, not an individual right owed *to the claimant*. It doesn't challenge the premise that asylum *requires* arrival elsewhere first; it operates *after* that condition is met (in the first country of asylum/camp). The "gift" vs. "claim" distinction is crucial.
      *   **Fair Distribution/Burden-Sharing:** Addresses allocation *after* claimants have accessed the system (or are in camps eligible for resettlement). It doesn't engage with the fundamental barrier *to initial access* created by the presence requirement.
      *   **Corrective Justice:** While powerful for assigning responsibility for displacement *causes*, it doesn't directly resolve the *logistical barrier* to claiming protection. Knowing State A caused displacement doesn't, in current law/ethics, automatically obligate State A (or others) to *retrieve* the displaced if they are trapped.
      *   **Surrogate Protection:** Explains why *any* state owes protection *once the claim is made*, but not why/how the claim can be made or activated *remotely* when physical access is impossible.

  **3. Methodology (6-Week Conceptual Plan):**
      *   **Week 1: Problem Framing & Critique:** Precisely define the "presence requirement," demonstrate its exclusionary effects using established vulnerability categories (drawing on UNHCR reports *conceptually*), articulate the gap between protection needs and access.
      *   **Week 2: Conceptual Analysis of Asylum:** Examine the historical and philosophical foundations of asylum. Does its core purpose (safety from persecution) *logically depend* on territorial arrival, or is arrival merely the dominant *historical mechanism*? Analyze relevant Convention text (Articles 1, 33) *to show ambiguity/absence* on the *necessity* of presence for the *right itself*.
      *   **Week 3: Articulating the "Right to Be Brought":** Develop the normative argument. Build on: a) The inadequacy of non-refoulement alone for the inaccessible; b) The inherent right to seek asylum (UDHR Art. 14) implying a necessary means; c) Analogies (limited) to positive obligations in other human rights (e.g., right to life, fair trial). Distinguish rigorously from resettlement.
      *   **Week 4: Allocation Principles:** Tackle Q3. Critically evaluate potential principles: a) Causation (State responsible for displacement); b) Capacity; c) Proximity (modified); d) Arbitrary Assignment (e.g., global queue); e) Universal Obligation ("common but differentiated responsibility"). Assess feasibility and fairness.
      *   **Week 5: Addressing Key Objections:** Confront: Sovereignty/resource concerns, "floodgates," moral hazard, defining the "truly inaccessible," potential for abuse, feasibility of identification/assessment remotely.
      *   **Week 6: Synthesis & Refinement:** Integrate findings, refine the core thesis, clarify the relationship between the "right to be brought" and the existing protection regime, outline implications.
      *   **Why this method?** The core puzzle is *conceptual and normative*: What *is* asylum fundamentally? What *should* states owe to whom and why? Empirical data (who arrives) illustrates the problem but doesn't answer the ethical/legal questions. Textual analysis is a *component* (Week 2), but insufficient alone to establish a novel normative claim like the "right to be brought."

  **4. Success vs. Failure:**
      *   **Good Result:** A clear demonstration that: a) The presence requirement is contingent, not inherent; b) A distinct "right to be brought" is conceptually coherent and normatively necessary to fulfill the promise of asylum for the most vulnerable; c) It meaningfully differs from resettlement (framed as a right, triggered differently, requiring new allocation principles); d) Plausible (if challenging) allocation principles are identified. Success is showing the *argument is viable and addresses a critical gap*.
      *   **Failure:** If the "right to be brought" merely replicates existing resettlement logic ("it's just more/better resettlement"). Failure would also be demonstrating that the presence requirement *is* conceptually inherent, making the "right to be brought" incoherent within asylum. An acceptable but modest result would be showing its coherence but highlighting overwhelming practical/objection barriers as currently insurmountable.

  **5. Scope Assessment & Cuts:**
      *   **Yes, it's ambitious for 7,000 words.** The core risk is trying to do too much within the normative/allocative arguments.
      *   **Prioritize:** Foundational Argument (Q1) and Core Normative Case for "Right to Be Brought" (Q2). These are the novel contributions.
      *   **Cut First/Scale Back:**
          1.  **Deep Dive into *All* Allocation Principles (Q3):** Present 2-3 strongest/most contrasting principles with their core pros/cons rather than an exhaustive survey. Acknowledge the complexity but don't solve it fully.
          2.  **Detailed Historical Evolution of Asylum:** Briefly reference origins only as needed for the conceptual argument (Week 2).
          3.  **Comprehensive Policy Blueprint:** Avoid designing the institutional machinery. Focus on the ethical/legal *principles* underpinning any future mechanism.
          4.  **Extended Case Studies:** Use hypotheticals or brief references to illustrate points, not lengthy empirical case analyses.
          5.  **Full Engagement with Every Objection:** Address the 2-3 most fundamental objections thoroughly (e.g., sovereignty, feasibility), acknowledge others more briefly.

  **Focus Mantra:** *Is this essential for proving the presence requirement is contingent and that a distinct "right to be brought" is a coherent and necessary normative concept?* If not, cut.

  ---

  **Why this structure works:** It isolates the unique core of your insight (the *barrier* created by requiring presence), precisely defines the novel concepts ("right to be brought"), demonstrates why the status quo doesn't solve it, uses a feasible conceptual methodology, defines success clearly, and acknowledges the need for strategic focus within the word limit. Good luck!
