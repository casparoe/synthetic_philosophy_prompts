  Second, the fragmented message across twelve sites challenges Putnam's division of labor. Putnam assumed experts within one community, but here the "experts" are governments that stop cooperating. Does this extend externalism or break it? The film suggests that meaning requires global collaboration, pushing externalism beyond individual communities to a planetary scale.

  Third, the film's Whorfian elements: Louise gains understanding through learning Heptapod B, which changes her perception of time. Her insight is private and internal, which seems at odds with externalist theories that emphasize public, observable facts. The resolution comes from her internal realization, not external evidence.

  The user also wants to know what "Arrival" adds to the reference debate that thought experiments don't. Thought experiments like Twin Earth are constrained and hypothetical, while the film introduces complexity like non-linear time, fragmented knowledge, and the necessity of trust and communication. It shows reference fixation as a dynamic process involving future purposes and global cooperation, which static thought experiments can't capture.

