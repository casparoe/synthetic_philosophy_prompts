prompt: |-
  I'm giving a talk at a forecasting-practitioners meetup next month — the room is people who run prediction markets and in-house forecasting programs, a couple of Brier-score nerds, one psychologist who's published on training people to think in base rates, and a Bayesian statistician who does hierarchical models for demand forecasting. No philosophers, no decision theorists.

  My thesis: the reference class problem isn't a solvable technical puzzle but a standing limit on the whole "take the outside view" program. Because any reference class gets carved out by a causal story about which features of the case matter, the outside view always borrows its authority from the inside view — there's no principled stopping point between the class so narrow it has n=3 and the class so broad it stops being informative. My argument, roughly: (1) for any case you can construct a broader and a narrower class containing it, and the data almost never forces the choice; (2) when you press forecasters who say they just used the base rate, they can always produce a post-hoc story for why that class was the right one; (3) so what gets sold as statistical discipline is model choice in a lab coat. Positive proposal: forecast from an explicit weighted portfolio of candidate classes and argue about the weights out loud, rather than pretending one class was handed to you by the data.

  Give me the Q&A prep sheet. The eight-ish objections this particular room will actually raise — not the ones a philosophy of science audience would give me — ordered by how much damage they do, each phrased the way they'd phrase it (resolution, calibration, sample size, "that's just an excuse to ignore base rates", "operationalize it: what would your method say differently on a real forecast"). For each one: a two-minute reply, a note on where my reply is soft, and whether I should concede it in the talk before someone else does it for me. Also flag the single reply that has to land or my portfolio proposal dies on the spot, and the question I'm hoping nobody asks.
reasoning: |-
  Hmm, the user is preparing for a Q&A session after their talk at a forecasting practitioners meetup. Their thesis challenges the traditional "outside view" approach by arguing that the reference class problem is fundamentally unsolvable and that base rates aren't objective. Instead, they propose using a weighted portfolio of reference classes and transparently debating the weights.

  I need to identify eight likely objections from this specific audience - forecasting practitioners, prediction market operators, Brier-score enthusiasts, a psychologist, and a Bayesian statistician. These objections should focus on practical concerns like resolution, calibration, sample size, operationalization, and accusations of ignoring base rates, rather than philosophical debates.

  For each objection, I should provide:
  1. The objection phrased as the audience would say it
  2. A concise two-minute reply
  3. Weaknesses in that reply
  4. Whether to preemptively concede it in the talk

  I also need to flag:
  - The make-or-break reply for their portfolio proposal
  - The question they're hoping nobody asks

  Key considerations:
  - This audience cares about operational impact, not philosophy
  - They'll likely challenge with real forecasting scenarios
  - The Bayesian statistician might attack the weighting mechanism
  - The psychologist may question debiasing value
  - Practitioners will demand concrete methods

  The most critical reply to land is for the "operationalize it" objection - without a clear implementation example, their proposal seems theoretical. The question they fear most is probably about how their approach improves calibration over existing methods.

  For ordering the objections by damage potential:
  1. Operationalization demand (most damaging if unanswered)
  2. Calibration concerns
  3. "Excuse to ignore base rates" accusation
  4. Resolution cost
  5. Sample size dismissal
  6. Bayesian critique
  7. Debiasing value question
  8. Computational overhead complaint

  The portfolio approach lives or dies on showing concrete implementation - hence the "operationalize" objection is critical. The calibration question is dangerous because if their method can't prove accuracy improvements, practitioners won't adopt it.
answer: |-
  Here’s your Q&A prep sheet, tailored to this audience’s priorities (operational impact, calibration, and methodological rigor over philosophy). Objections are ordered by potential damage, with replies designed to acknowledge their concerns while defending your thesis. The **make-or-break reply** is for Objection #1 – fail there, and your portfolio proposal looks unserious. **The question you hope nobody asks** is flagged at the end.

  ---

  ### **Objection #1: "Operationalize it. Show me what your weighted portfolio would do differently on a *real* forecast we’ve all seen."**  
  *(Highest damage: Challenges practical relevance)*  
  **Their intent:** Force you to demonstrate tangible value over "just use the best class."  
  **Your 2-minute reply:**  
  "Let’s take a classic: forecasting the success of a new tech product launch. The ‘default’ outside view might use ‘SaaS startups’ as the class (say, 20% success rate). But under my approach, we’d weight multiple classes:  
  - **Class A:** Startups with this founder’s track record (n=5, 40% success) → Weight: 0.3  
  - **Class B:** Products in this niche (e.g., ‘AI productivity tools’, n=50, 15% success) → Weight: 0.4  
  - **Class C:** All VC-backed startups (n=1000, 20% success) → Weight: 0.3  
  Aggregate forecast: (0.3×40%) + (0.4×15%) + (0.3×20%) = **24%**. Crucially, we’d *expose* why we weighted the founder’s history higher than the broad base rate—maybe because the psychologist in this room showed us founder grit matters more in early-stage bets. This beats either cherry-picking one class or hiding the subjectivity behind a single ‘official’ class."  

  **Where it’s soft:** Doesn’t specify *how* to set weights objectively.  
  **Concede preemptively? YES.** In your talk, admit: "Weights aren’t handed by data—they’re prior-driven. But forcing teams to debate them reduces hidden arbitrariness."  

  ---

  ### **Objection #2: "This sounds like an excuse to ignore base rates when they’re inconvenient."**  
  *(High damage: Implies you’re endorsing bias)*  
  **Their intent:** Defend the outside view as a guard against motivated reasoning.  
  **Your 2-minute reply:**  
  "Actually, I’m *doubling down* on base rates—just using more of them! The problem is that ‘the base rate’ implies there’s one true class. But when you picked ‘SaaS startups’ instead of ‘all businesses’ or ‘this founder’s last 3 ventures,’ you made a subjective call. My method forces you to use *multiple* base rates and justify why you trust some more than others. That’s *more* disciplined than pretending your chosen class is ‘objective.’ Ignoring base rates would be dropping them entirely; I’m making you weigh them transparently."  

  **Where it’s soft:** Risks sounding semantic if you don’t tie it to calibration (see next objection).  
  **Concede preemptively? NO.** Stand firm—this is core to your thesis.  

  ---

  ### **Objection #3: "How does this improve calibration? My prediction markets are already well-calibrated using single reference classes."**  
  *(High damage: Hits your method’s empirical value)*  
  **Your 2-minute reply:**  
  "First, kudos on your calibration—seriously. But I’d bet that calibration holds *because* your market participants implicitly weight classes. For example, in a market for ‘Will this AI startup succeed?’, traders aren’t just using ‘all startups.’ They’re blending signals from ‘AI companies,’ ‘this founder,’ and ‘current funding climate.’ My proposal makes that implicit weighting explicit and testable. If your forecasts are already perfect, you’re likely doing this intuitively. For others, formalizing it avoids silent errors—like over-indexing on a noisy narrow class because it feels ‘right.’"  

  **Where it’s soft:** If their markets *are* perfectly calibrated, this feels unnecessary.  
  **Concede preemptively? PARTIALLY.** In your talk, say: "If your process already works, great! But for teams without prediction markets, this adds structure."  

  ---

  ### **Objection #4: "You’re sacrificing resolution. My hierarchical model pinpoints the right class using covariates—no weighting needed."**  
  *(From the Bayesian; moderate damage)*  
  **Their intent:** Defend model-driven class selection as rigorous.  
  **Your 2-minute reply:**  
  "Hierarchical models are fantastic! But they still face the reference class problem: which covariates to include? Your model might weigh ‘industry’ and ‘team size,’ but why not ‘founder zodiac sign’? Data alone won’t tell you—it’s a modeling choice. My approach complements yours: instead of collapsing covariates into one ‘optimal’ class, treat your model’s output as *one candidate forecast* in the portfolio. Then add others (e.g., a simple base rate). If your model’s as good as you think, it’ll get a high weight. But in low-data cases, the portfolio protects against overconfidence."  

  **Where it’s soft:** Doesn’t address computational trade-offs.  
  **Concede preemptively? YES.** Agree: "Bayesian models are a powerful way to generate candidate classes—use them as inputs!"  

  ---

  ### **Objection #5: "Sample size matters. If n=3, I discount that class—no philosophy needed."**  
  *(Moderate damage: Feels like nitpicking)*  
  **Your 2-minute reply:**  
  "Absolutely—but *how much* do you discount it? Do you give it zero weight? 10%? 30%? That’s the weighting debate I want on the table. When n=3 for the founder’s track record, you might still weight it higher than the ‘all startups’ class if you think founder effects dominate. The point is: ‘n too small’ isn’t a binary switch. It’s a continuous judgment that affects your forecast. Hiding that judgment behind a rule like ‘discount classes with n<10’ just moves the arbitrariness underground."  

  **Where it’s soft:** Could spiral into a stats debate on shrinkage estimators.  
  **Concede preemptively? NO.** Push back: "We all discount small n—but let’s quantify it openly."  

  ---

  ### **Objection #6: "This adds overhead. For most forecasts, I just grab the best-available class and adjust slightly. Good enough."**  
  *(From practitioners; moderate damage)*  
  **Your 2-minute reply:**  
  "Fair! If you’re time-constrained, do what works. But when stakes are high (e.g., betting big on a forecast), my method forces you to stress-test that ‘best-available’ choice. Did you pick ‘best’ because it’s convenient or truly robust? Spending 5 minutes sketching 2–3 classes and weights might reveal you’re overconfident. It’s like the difference between a quick market survey and a full prediction market—you choose the tool for the job."  

  **Where it’s soft:** Valid for low-stakes forecasts.  
  **Concede preemptively? YES.** In talk: "Use this for high-impact forecasts, not your daily guess at coffee consumption."  

  ---

  ### **Objection #7: "Training forecasters to use base rates reduces bias. Your method overcomplicates a training tool."**  
  *(From the psychologist; low damage)*  
  **Your 2-minute reply:**  
  "I love base-rate training! But we both know trainees struggle with *which* base rate to use. They’ll pick ‘heart attack survivors’ for a patient prognosis when ‘70yo diabetic heart attack survivors’ is better—or worse. My method *extends* your training: teach them to generate multiple classes, debate weights, and see how it changes the forecast. That’s a richer debiasing exercise than ‘always use the outside view.’"  

  **Where it’s soft:** Psychologists might have data showing single-class training works.  
  **Concede preemptively? NO.** Reframe as collaboration.  

  ---

  ### **Objection #8: "But Brier scores reward accuracy, not ‘transparency.’ If your portfolio doesn’t outperform, why bother?"**  
  *(From Brier nerds; low damage but irritating)*  
  **Your 2-minute reply:**  
  "Three things. First, in my experience, portfolios *do* often outperform by reducing model error—see Satopää et al.’s work on averaging across reference classes. Second, even if equal, transparency lets teams debug forecasts (e.g., ‘Why did we overweight that class?’). Third, strictly optimizing for Brier scores can lead to gaming. If you’re evaluated solely on score, you’ll cherry-pick classes post-hoc. Arguing weights upfront aligns incentives."  

  **Where it’s soft:** Requires citing niche literature.  
  **Concede preemptively? NO.** Challenge: "Test it! Run a tourney: single class vs. portfolio weights."  

  ---

  ### **The Make-or-Break Reply**  
  **For Objection #1 ("Operationalize it").** If you can’t give a plausible, concrete example (like the startup forecast above), your proposal dies as academic navel-gazing. Drill this example. Mention a real event (e.g., "Think of when we forecasted X...") to anchor it.

  ### **The Question You Hope Nobody Asks**  
  *"Where’s your empirical evidence that this weighting method improves forecasts *after* accounting for the cost of debate? Prediction markets work because they aggregate implicit knowledge efficiently—your method sounds like a committee meeting."*  
  **Why it’s dangerous:** It combines operational cost (hard to measure), lack of data (you’re proposing theory), and invokes the efficiency of their tools.  
  **If asked:** Focus on high-stakes decisions ("Committees for FDA approvals already exist—make them better") and cite lightweight implementations (e.g., "Dot-voting on weights in 10 minutes"). But it’s a weak spot—hope they don’t notice.

  ---

  **Final prep tip:** Start your talk by name-dropping their world ("prediction markets," "Brier scores," "hierarchical models") to signal alignment. When objections arise, smile and say, "I run into this too—here’s how I handle it..." to avoid sounding combative. Good luck!
