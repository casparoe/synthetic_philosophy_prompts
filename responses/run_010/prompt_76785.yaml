answer: |-
  Distinguished guests, families, and recruits. Thank you for gathering here on this important day. We mark the formal beginning of service for these young citizens. The oath they take carries weight. It deserves understanding.

  Some respected guests, experienced officers from professional armies, have questioned the relevance of a force like ours. Their arguments deserve a hearing. They observe that part-time soldiers train less. They worry that less-drilled citizen conscripts might struggle with the complex laws of armed conflict under stress. They point to modern weapons: precision strikes, drones, cyber capabilities. They ask, what use are fixed defences and riflemen against such tools? Is a militia army, they suggest, an instrument of the past?

  These are serious questions. They demand a serious answer, not about spirit or tradition, but about purpose. What *is* a militia *for*?

  To answer, we must look closely at what Switzerland seeks: neutrality. Not just the word, but the reality. History gives us two views. In 1815, the great powers meeting in Vienna formally recognized Swiss neutrality. They confirmed it decades later. But in 1889, some of those same powers threatened to take that recognition back. This sparked a debate: Was Swiss neutrality something *given* by others, something they could therefore revoke? Or was it a posture Switzerland *held* by itself, a sovereign decision no other nation could cancel?

  The answer shapes everything. If neutrality depends solely on the permission of powerful neighbours, it is fragile. It changes with their mood, their alliances, their ambitions. But if neutrality is a posture we hold ourselves, it requires something more than a declaration. It requires the capacity to make that posture credible. To make others believe it cannot be easily overturned.

  This brings us to the second distinction, the heart of our system. In 1848, our founding federal constitution made a deliberate choice. It forbade the central government from maintaining a large standing army. It strictly limited the forces each canton could keep. Instead, it placed the obligation of service directly on the citizen. That principle remains. Our army is organized primarily as a militia. It is not a force the state *owns* and *hires*. It is the citizenry under arms.

  Why does this matter for neutrality? Because credibility rests not on declarations, but on an aggressor’s cold calculation. What deters invasion? Not just forts or rifles, but the understanding that conquest would be futile. That even after defeating the army in the field, the problem remains. Who remains to surrender? Who holds the authority to bind the entire country to capitulation? And what happens after?

  A militia army, dispersed, rooted in every community, means there is no single head to cut off. The authority to surrender, to truly end resistance, is diffuse. It cannot be signed away by a captured commander. Furthermore, an armed population, trained to resist, transforms the landscape of occupation. Roads, bridges, tunnels – key for any invader – become not assets, but liabilities. They become targets for denial, not just by the army, but by the people. This denial isn't about winning a quick battle. It's about making the cost of occupation unbearably high, stretching it out over years. It is deterrence through the promise of grinding, decentralized resistance. That is what a militia is *for*.

  Our wartime plan acknowledged a hard truth: withdrawal into prepared alpine positions was never about protecting every town or the populous lowlands. It was about creating a core of resistance that could not be quickly eliminated, making the entire country indigestible. The strength isn't just in the concrete, but in the people who man it – citizens who return to their homes, their jobs, but remain soldiers.

  Consider the rifle you recruits will receive. Under our regulations, you keep that personally assigned weapon at home. The sealed box of ammunition, however, is not issued with it. It hasn't been for years. That rifle in the wardrobe arrives without its bullets. The state provides the tool, the potential. But it deliberately leaves something out. What completes the weapon? Not the state, but the individual decision of the citizen who holds it. The object alone is not the guarantee. The potential requires a human choice. It symbolizes that the final element of defence rests not in a stockpile, but in the commitment of the people.

  **To the families now:** You have entrusted your sons, and in some cases your daughters, to this system. You understand the cost. It is a transfer of time, significant months of a young life. It falls disproportionately, still, on men. The justice of this obligation is debated, seriously and rightly. Initiatives to abolish or fundamentally alter the draft were supported by many thoughtful citizens. The arguments about fairness, about compulsion, about the state's claim on individual lives, are powerful and legitimate. Your presence here shows your support, or at least your acceptance, of the path these young people have chosen. You share in the burden. You understand that the security this system aims to provide rests not just on soldiers, but on the society that sends them, trusts them, and relies on the difficult deterrent effect they represent. Your role is vital: sustaining the community that makes this dispersed defence possible.

  **Recruits:** Today you take an oath. It binds you legally. It commits your time. You will learn skills. You will be given equipment, including that rifle. But understand this: the oath, the uniform, the rifle – these are the framework. What fills it? What makes the deterrent real? It is the decision that lies with you, the individual citizen-soldier. It is the unspoken commitment, made freely, that you stand ready. Not just today, but in the years to come. The state can conscript your service. It can issue you a weapon. It cannot conscript that inner resolve. It cannot issue the decision to use it, should the unthinkable come. That decision remains yours alone. It is the gap in the doctrine, the space between the issued rifle and the unissued ammunition. It is the point where armed neutrality stops being a matter of law and equipment, and becomes a matter of personal commitment – a decision that cannot be made for you, by anyone. That is the responsibility you assume today. It is yours to carry.
