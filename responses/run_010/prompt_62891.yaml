prompt: |-
  I sit on the standards comittee of a 40-unit housing co-op — we're elected by the members and we rule on complaints about how people use their units and the common spaces. Our bylaws are hopelessly vague: they say a member can't use their unit in a way "inconsistent with the standards of the community" or in a way that "unreasonably interferes with other members' enjoyment," and we've basically been making it up as we go along. Our record over the last few years:

  - Member with a backyard chicken coop that stank and drew rats: ordered to shut it down.
  - Member who put a big sign in their front window backing a party most of us find genuinely hateful, after 20-something furious letters: allowed to keep it up. Minutes record the committee as unanimous that being upset is not itself a reason.
  - Member who swam nude in the rooftop pool around 6am, when hardly anyone is up: told to cover up — but the minutes frame it as the people coming up for coffee being unable to avoid it, not as nudity being wrong in itself.
  - Member who rented out their deeded parking spot to an outsider at market rate: formally censured, even though nobody could name an actual injury and three members said it looked harmless. The minutes say it "corrodes the idea that we own this place together."
  - Member who ran a long loud Bible study that hogged the common room: told to move it into their own unit and cap it at ninety minutes, framed entirely as a room-scheduling problem.
  - Member who used the shared workshop tools to build furniture for sale outside: not stopped, just charged a fee. Concern recorded as wear on the tools and fairness to everyone else.
  - Member who posted a long argument on the internal forum that the co-op should stop admitting families with children: post stayed up, no action taken, tons of angry replies.
  - Elderly member whose unit had become a fire hazard from hoarding: we intervened over her objections.

  Now the case that's splitting us, and I want an honest read rather than a diplomatic one. Two members have started hosting a swingers party in their own unit twice a month. Soundproofed door, no noise complaints in eight months, guests park two blocks away and come in singly, nothing visible from any common area. A petition signed by 24 of the 40 households asks us to order them to stop. Two households claim two prospective buyers pulled out after hearing about it, but that's secondhand and nobody's verified it. Everyone who signed admits they have never seen or heard anything from these parties and that the objection is entirely to knowing it goes on in the building. The couple say they'll stop if we tell them to, but would rather not, and they point out — correctly — that they've broken no specific rule.

  So: how should we rule if we want to be consistent with our own record, and how do you predict we'll actually vote? Those aren't the same question and I want both answered. Which precedent is the closest analog, and which one do people on the committee keep reaching for that doesn't actually fit? Lay out the candidate rules our record is jointly consistent with — there's definitely more than one, and I want to know exactly which of them come apart on this case and what each says about it. One of them will be something like "harm, broadly understood, including damage to the shared understandings that make living here possible," because that's how we justified the parking censure. Tell me whether that rule is actually any different from "whatever a majority of us finds repugnant" — how do the two come apart in practice on these facts, or do they not? And if our record genuinely underdetermines this one, name a further complaint we'd plausibly receive in the next year that would settle which rule we've committed ourselves to.
reasoning: |-
  Okay, the user is on a standards committee for a 40-unit housing co-op. They've described several past cases and now face a new one about swingers parties. The main issue is consistency with their precedents since their bylaws are vague. Let me start by breaking down their past rulings to identify patterns.

  First, the chicken coop was shut down due to smell and rats—clear tangible harm. The hateful sign was allowed because offense alone wasn't enough. Nude swimming was stopped because it was unavoidable to early risers, focusing on unavoidable exposure. Renting the parking spot was censured for undermining community ownership, which is more abstract harm. The Bible study was limited due to resource hogging, not content. The furniture maker was charged a fee for tool wear and fairness. The anti-children post stayed up; no action taken despite anger. The hoarding case was intervened for safety, a tangible risk.

  Now, the swingers party: no noise, no visible issues, but 24 households object just knowing it happens. The couple followed all practical steps to minimize impact. The challenge is reconciling this with past decisions. The parking case involved an abstract harm to community values, similar here. But in the sign case, offense wasn't enough. So the key is whether abstract harm to community standards applies without tangible issues.

  The user wants to know how to be consistent and predict the vote. They also need the closest precedent. Parking censure is similar because both involve perceived corrosion of shared values. But the sign case differs because offense alone didn't justify action. The committee might lean towards the parking precedent since community cohesion was prioritized there.

  The underlying principles from past cases seem to be: tangible harm (smell, safety), unavoidable exposure (nudity), resource fairness (Bible study, tools), and abstract harm to community (parking). The swingers case falls under abstract harm. But is abstract harm sufficient without tangible effects? The parking case had no tangible harm either, just the principle. So consistency might require allowing the parties unless they cause tangible issues, like the sign case.

  However, the petition shows significant discomfort. The committee might vote to stop the parties, using the community cohesion argument from parking. But that risks equating abstract harm with majority repugnance. To distinguish, they'd need to show how the parties harm community bonds beyond just offending people. The two withdrawn buyers could be cited, but it's hearsay. Without evidence, it's shaky.

  If they allow the parties, it aligns with the sign precedent. If they ban, it's like parking. A future case, like an adult film shoot in a unit, could test this further. If they ban without tangible harm, it confirms they prioritize majority sensibilities over individual rights unless harm is proven.

  The user also needs to know if "harm to shared understandings" is different from majority repugnance. In practice, without clear criteria, it might not be. The parking case was framed as protecting communal ownership, but it's still subjective. To avoid that, the committee should demand evidence of actual harm, like decreased property values or conflicts, not just discomfort.

  Predicting the vote: likely 3-2 to stop the parties. Members might feel the community's fabric is threatened, similar to parking. But some might stick to the sign precedent, arguing no tangible harm. The swingers' compliance might sway others to allow it, but the petition's size could pressure the committee.

  In conclusion, consistency with precedent suggests allowing the parties (sign, nudity rules focused on exposure), but the committee might ban them based on community cohesion (parking). Future cases will clarify if abstract harm requires proof or if discomfort suffices.
answer: |-
  Based on your committee's record and the principles applied, here's the analysis for the swingers party case:

  **1. How to Rule for Consistency:**
  *   **Consistent Ruling:** **Allow the parties to continue.**
  *   **Reasoning:** The strongest precedents are:
      *   **The Hateful Sign:** Unanimously allowed despite widespread offense because offense alone isn't a sufficient reason. Knowing something exists within the building that you find objectionable isn't interference. The committee explicitly rejected "being upset" as grounds.
      *   **The Anti-Children Post:** Allowed to stay up despite causing anger and division. Content-based objections weren't grounds for removal; tangible harm or rule violation was required (and absent).
      *   **The Furniture Sale:** Activity continued with a fee adjustment addressing tangible concerns (tool wear, fairness). The *nature* of the activity (commercial use) wasn't banned; its *impact* was managed.
  *   **This Case:** No tangible harm (noise, mess, safety, resource monopolization, visible nuisance) is alleged or proven. The *only* objection is knowledge of the activity occurring privately within a member's unit. Like the sign and the forum post, this is pure offense/discomfort based on content/lifestyle. The couple took significant steps to ensure no external impact (soundproofing, discreet entry). No specific rule is violated. Consistency demands allowing it.

  **2. How the Committee Will Likely Vote:**
  *   **Predicted Vote:** **3-2 or 4-1 to ORDER THEM TO STOP.**
  *   **Reasoning:** The **Parking Spot Censure** precedent ("corrodes the idea that we own this place together") is the siren song committee members uncomfortable with the swingers parties will reach for. They will argue this private activity, once known, fundamentally undermines the shared community ethos or "standards," even without tangible harm. The petition (60% of households!) will exert immense pressure, making the abstract "harm to community fabric" argument feel more urgent and legitimate than offense over a sign or post. Concerns about property values (however unverified) will amplify this. While logically weaker than the sign precedent, the parking censure provides the emotional and quasi-principled justification needed to act against deep discomfort.

  **3. Closest Analog vs. Misapplied Precedent:**
  *   **Closest Analog:** **The Hateful Sign & The Anti-Children Post.** Core issue: Offense/knowledge of objectionable (to some) content/activity occurring within the co-op, without tangible external impact.
  *   **Misapplied Precedent:** **The Parking Spot Censure.** Members will *want* this to apply because it justifies intervention based on abstract "community corrosion." However, the key differences are:
      *   **Nature of Asset:** The parking spot was a *deeded common asset* being exploited for *individual commercial gain* contrary to the co-op's ownership model. The swingers party occurs within a *privately used unit*.
      *   **Direct vs. Abstract Link:** Renting the spot directly commercialized a shared resource, creating a tangible (if minor) precedent and potential conflict point *about resource use*. The swingers party's link to "community corrosion" is purely abstract and based on subjective values, much closer to the sign/post offense.
      *   **Harm Type:** Parking censure was about harm to the *economic/resource-sharing structure*. Swinger objection is about harm to *moral/social sensibilities*.

  **4. Candidate Rules Emerging from Precedents & Their Application Here:**
  Your record reveals several overlapping but distinct principles:

  1.  **Tangible Harm/Interference Rule:** Intervention requires proof of direct, material negative impact (smell, pests, noise, safety hazard, resource monopolization, unfair wear). *Applied to:* Chicken Coop, Nude Swimming (framed as unavoidable visibility), Bible Study, Hoarding, Furniture Sale (fee for wear).
      *   *Swingers Case:* **No intervention.** No tangible harm proven.
  2.  **Offense is Not Harm Rule:** Mere knowledge or dislike of another member's lawful private activity or expression is insufficient grounds for intervention, even if widespread. *Applied to:* Hateful Sign, Anti-Children Post.
      *   *Swingers Case:* **No intervention.** Objection is pure offense/knowledge.
  3.  **Resource Stewardship/Fairness Rule:** Use of common assets/resources must be fair, sustainable, and prioritize member needs; commercial exploitation or monopolization can be regulated. *Applied to:* Bible Study (scheduling), Furniture Sale (fee), Parking Spot (censure - commercial use of shared asset).
      *   *Swingers Case:* **No intervention.** Uses only private unit, no common resources impacted.
  4.  **Unavoidable Exposure Rule:** Activities in common areas or visible from private areas must conform to standards ensuring others aren't forced to encounter things they find objectionable. *Applied to:* Nude Swimming (framed as unavoidable for coffee drinkers).
      *   *Swingers Case:* **No intervention.** Activity is entirely private and invisible.
  5.  **Community Cohesion/Shared Understanding Rule ("Harm Broadly Understood"):** Actions that fundamentally undermine the perceived shared values or cooperative ownership model, even without immediate tangible harm, can be regulated. *Applied to:* Parking Spot Censure ("corrodes the idea that we own this together"). *This is the rule members will try to apply to the swingers.*
      *   *Swingers Case:* **Ambiguous/Contested.** Does private conduct, once known, "corrode" community? This is where the conflict lies.

  **5. "Community Cohesion Rule" vs. "Majority Repugnance":**
  *   **Theoretical Difference:** The "Community Cohesion" rule *aims* to protect the *functional integrity and shared purpose* of the co-op (like the parking spot undermining shared ownership). "Majority Repugnance" is pure subjective disapproval.
  *   **Practical Convergence Here (and why the rule is dangerous):** On *these facts*, they functionally converge. The "corrosion" alleged stems *entirely* from the majority (or large minority) finding the activity repugnant. There's no evidence of:
      *   Disrupted governance/meetings.
      *   Increased conflict/vandalism.
      *   Mass exodus of members.
      *   Tangible reputational damage beyond unverified anecdotes.
      *   Violation of a core, stated co-op principle (unlike exploiting a deeded common asset).
  *   **Where They *Could* Come Apart (But Didn't in Parking Censure):** If a member did something objectively bizarre but harmless (e.g., collecting garden gnomes obsessively) that didn't upset anyone, the Cohesion rule wouldn't apply. If a member advocated for dissolving the co-op model *at a meeting*, causing outrage, the Cohesion rule *might* justify intervention (protecting the co-op's existence) even if not repugnant, while Majority Repugnance wouldn't apply if it wasn't upsetting on a personal level. However, in the *parking censure*, the rule was applied based on abstract principle violation (commercialization) *without* requiring proof of widespread upset – meaning the committee *claimed* to act on principle, not feelings. The *swingers case* forces a choice: does the "Cohesion" rule protect *objective structural principles* (like asset use) or *subjective community norms/morality*? Your record hasn't yet settled this.

  **6. Future Complaint to Settle the Rule:**
  A future complaint that would clarify which interpretation ("structural principle" vs. "subjective norms") the committee has adopted would be:

  *   **The Member Filming Adult Content:** A member discreetly films consensual adult content within their soundproofed unit during off-hours, using no common resources, with no external visibility or noise. No participants are non-members or visible entering/leaving. Once other members become aware (e.g., through a leak or admission), a petition demands it stop, arguing it "makes the co-op feel like a porn set" and "undermines our family-friendly community values," potentially harming reputation.
      *   **If Committee Allows It:** They are committed to the **Tangible Harm/Offense is Not Harm** rules. The "Community Cohesion" rule is limited to *structural* violations (like parking spot rental). Private, invisible conduct is protected.
      *   **If Committee Bans It:** They have adopted the "Community Cohesion" rule as a **Subjective Morality/Reputation Preservation** rule. Private conduct deemed harmful to the community's *image* or *prevailing moral sensibilities* can be banned, aligning with "Majority Repugnance" and the likely outcome of the swinger case. The parking censure precedent will have been expanded beyond shared assets.

  **Conclusion:** To be consistent with *most* precedents, especially the clearest ones rejecting offense as grounds (Sign, Post), the committee should allow the swingers parties. However, the powerful precedent of the Parking Spot Censure ("corroding shared understanding") combined with the large petition and deep discomfort will likely lead the committee to vote to stop the parties, stretching the "Community Cohesion" rule to cover subjective moral objections. This functionally makes the rule indistinguishable from "Majority Repugnance" *in cases involving private conduct deemed morally objectionable*, unless a future case (like the adult filming scenario) forces a clearer distinction.
