  The draft argues that Mill's late work shows a shift not toward socialism per se but toward reversing the burden of proof regarding property regimes. Key claims include: the production/distribution distinction in Principles becomes foundational; Mill's focus is on severing bequest from inheritance rather than full socialism; Chapters on Socialism advocates comparative institutional testing; and this aligns with an "institutional federalism" framework. The user explicitly worries about terminological slippage, the harm principle application in section 6, and the confounding variables in experimental comparisons.

  Hmm, the user's anxiety about section 6 seems warranted - applying On Liberty's harm principle to institutional choice might indeed be a category error. The principle regulates individual actions within a framework, not the framework itself. That section probably needs major rework or deletion. 

