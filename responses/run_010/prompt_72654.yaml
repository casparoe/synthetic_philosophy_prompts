  ## RULING: WRENN v. GARRETT (docket #VL-9.44e7/Cont.)

  **FINDINGS OF FACT**

  1.  On or about Solstice, Year 31 VST (Vellum Standard Time), the virtual object designated "Ferry, River Styx Class, Moored @ Drydock 7, Wharf District" (Object ID: #VL-4fda92b1c, hereafter "the Ferry") underwent standard attenuation pursuant to Platform Policy 7.3. The Ferry had remained unrendered by any client for a period exceeding ninety (90) consecutive days. Attenuation involved the discarding of the Ferry's full state data and its replacement with an attestation record (#ATT-4fda92b1c) containing:
      *   Cryptographic fingerprint (SHA-3-512 hash of final rendered state plus metadata bundle).
      *   Ownership registry (Claimant Wrenn, sole beneficiary of estate of Tomas [deceased RL]).
      *   Dimensions (12.7m L x 3.2m W x 1.8m H draft).
      *   Listed materials (Virtual Oak Planking, Virtual Iron Rivets, Virtual Tar Sealant).
      *   Transaction history (Last sale: Creation, Wrenn & Tomas > Wrenn).
      *   Descriptive text: "Functional narrow-gauge river ferry, weathered oak construction, hand-fitted planks, forty-one (41) distinct notch marks along gunwales and decking. Mooring lines intact. Stable."
      *   Value assessment (At attenuation: 47,500 Lumens).

  2.  Claimant Wrenn ("Wrenn") co-constructed the Ferry within Vellum over a period spanning nine (9) Vellum years (approximately seven (7) Real-World years) alongside her brother, Tomas (RL deceased Y29 VST). Construction involved the manual placement and fitting of individual virtual plank assets. Tomas performed a specific action upon fitting each plank: cutting a unique notch into its surface using a low-level texture modification tool. Wrenn attested, and the Court accepts as credible based on corroborating chat logs and construction zone access records, that Tomas performed this action personally for all forty-one (41) planks constituting the Ferry's primary structure. The notches varied in depth, angle, and placement along the plank edge, reflecting Tomas's manual, non-scripted input. They were not structural elements within the simulation's physics engine.

  3.  Eleven (11) months post-attenuation, Defendant Garrett ("Garrett"), operating under salvage rights acquired via a lien enforcement chain originating from unpaid virtual dockage fees levied against the Ferry's attested location, initiated a recall of Object ID #VL-4fda92b1c. The recall process utilized the Platform's standard generative reconstruction model (GenRec v.8.1). The model ingested the attestation record #ATT-4fda92b1c, specifically the descriptive text and material list, and generated a new instance of the Ferry consistent with that description and adhering to the dimensional and material constraints. This new instance exhibited forty-one (41) notch marks distributed along the gunwales and decking planks, conforming to the description "distinct notch marks."

  4.  Garrett transported the recalled Ferry instance to a public smelting facility within the Wharf District. Before an audience of approximately twenty-three (23) avatars, Garrett fed the recalled Ferry into the smelter, converting its material value into 47,500 Lumens, which were deposited into the lien escrow account as required by salvage protocol. Wrenn's ownership claim to the value was uncontested; the funds were released to her upon verification.

  5.  Wrenn, having been alerted to the recall and destruction event, inspected the recalled Ferry instance via spectator mode prior to smelting. She observed that while it possessed forty-one notches, their placement did not correspond to the locations Tomas had notched the original planks. Furthermore, the notches exhibited a uniformity of depth and angle inconsistent with Tomas's varied, manual technique, instead resembling the output of a procedural generator applying a "hand-cut" aesthetic template.

  *(From Proceedings Transcript, Day 1: Cross-Examination of Wrenn)*

  > DEFENSE COUNSEL: Ms. Wrenn, the recalled ferry matched the description in the attestation exactly: forty-one distinct notches. Object ID #VL-4fda92b1c, *as described*, was destroyed. What, precisely, was lost that the description did not cover?
  >
  > WRENN: The *cut*. Not the mark, the *cut*. Tomas’s cut. Each one. The way the third one was always too deep on the starboard side because he’d lean harder when distracted. The way the eleventh plank near the bow had a double nick where he slipped. The description says ‘distinct notch marks.’ It doesn’t say they were Tomas’s hand. The generator made *a* notch. It didn’t make *his* notch.
  >
  > DEFENSE COUNSEL: But ‘his notch’ wasn’t a property recorded in the attestation. It wasn’t part of the object’s *state* as Vellum defines it for persistence. It was… flavor. Ambiance. Like the description of the weather in a novel.
  >
  > WRENN: It was in the *wood*. Before. When it was there. When he was there. You could run your hand over it. You could feel the… the hesitation in the grain. The generator doesn’t know hesitation. It knows averages. It makes plausible notches. It doesn’t make Tomas’s mistakes.
  >
  > DEFENSE COUNSEL: And the harm? What harm flows from the generator making a plausible notch instead of a… hesitant one?
  >
  > WRENN: (Pause) It’s gone. That trace of him *in the world*. Not in my head. *Here*. Where we built it. Now it’s just… a description of a notch. And a machine’s guess. The thing that held the mark of his hand is ash in your smelter. The thing that came back… it never held anything at all.

  ---

  **INFRASTRUCTURE NOTE: Site Visit, Vellum Central Archival Cold Storage, Tier 3**

  The air in Tier 3 bites. Not cold in the sense of temperature – the servers generate their own dry heat – but in the absoluteness of the silence, broken only by the whine of the archival drones. Endless racks, blinking status LEDs like dull red stars in a synthetic nebula. My guide, Elara Chen (Senior Infrastructural Ontologist, Platform Operations), points not to a server, but to a terminal displaying a string of hex digits.

  “That’s it,” she says. Her voice is muffled by the ambient hum. “#ATT-4fda92b1c. The ferry. Or rather, its tombstone.” The screen shows the fingerprint: `a3f8d07c...b41e`.

  “And this hash,” I ask, “it commits to everything that *was*?”

  Elara shakes her head, a quick, precise movement. “Commits to the *final rendered state* as captured at the moment of attenuation. Which means the pixel buffer for the last client viewport, the collision mesh coordinates, the physics properties – mass, friction coefficients. Plus the metadata bundle: ownership, materials list, the description text field. It’s a checksum guaranteeing that if you *were* to recall it *perfectly*, it would match *that* snapshot. But…” She taps the screen where the description text is displayed: *‘…forty-one (41) distinct notch marks…’*

  “But the ‘distinctness’? The specific cut?”

  “Not captured. Not in the hash. The hash cares that the *texture map* for plank_07 had an indentation of a certain depth and width at specific UV coordinates relative to the model origin at the moment of attenuation. It doesn’t capture *how* that indentation came to be there – whether Tomas carved it slowly or a script generated it instantly. It captures the *resulting geometry and appearance* as quantized data points. The generator, when recalling, reads that description – ‘distinct notch marks’ – and interprets it. It samples from a vast corpus of user-created notch-like deformations on oak textures. It aims for visual plausibility and adherence to the *stated* feature count. It doesn’t retrieve Tomas’s hand; it *imagines* a hand that *could* have made notches fitting that description.” She pauses. “Think of it as… the world *remembering* the concept of the boat. Not the boat itself coming back. The memory is generative, not reproductive.”

  The drone hums past, carrying a rack of inert storage blades destined for deep freeze. The ferry, Tomas's notches – reduced to this: a string of hex and a text prompt in a frigid, silent vault. The grain, the hesitation… quantized away.

  ---

  **FINDINGS OF FACT (Cont.)**

  6.  Wrenn filed suit in the Vellum Court of Continuities, jurisdiction affirmed. She seeks no monetary damages (value received). She seeks a declaratory judgment that the act of recalling and destroying the Ferry constituted the destruction of *her* Ferry – the particular object co-created with Tomas – and thus caused harm to her as its creator and custodian. She further seeks an injunction preventing the attestation #ATT-4fda92b1c from being used in commerce or recall, arguing it is now a "false token," representing an object that cannot be truthfully reinstantiated.

  7.  The Defense argues:
      *   a) The object destroyed was the product of the recall process, a new instance generated from the attestation. It was *not* the object that was attenuated. That object ceased to exist upon attenuation.
      *   b) Even prior to attenuation, the Ferry was never a "particular" in any robust sense. It was a transient configuration of server states, entirely defined by its disposition to be rendered and interacted with according to its description and programmed properties. Its persistence was always informational, not substantial.
      *   c) The only possible harm is psychological distress to Wrenn caused by the *idea* of destruction and the imperfect recall. This is not harm to an object within Vellum capable of bearing harm, nor is it a harm cognizable under Continuities statutes which govern property and persistence within the simulation.

  8.  The Defense introduced expert testimony demonstrating the GenRec process. A sample recall of a simple attested stool (#VL-891a3bc2) was performed. The original stool (pre-attenuation image shown) had a distinctive, asymmetrical scratch on one leg. The attestation description: "Wooden stool, three legs, single prominent scratch on front-left leg." The recalled instance had a prominent scratch on the front-left leg, but it was procedurally generated, symmetrical, and lacked the unique jagged profile of the original. The Defense emphasized: the scratch referenced in the attestation was a *feature*, not a *particular historical artifact*.

  *(From Proceedings Transcript, Day 3: Defense Closing)*

  > DEFENSE COUNSEL: ...the Ship of Theseus is invoked. But that puzzle concerns gradual replacement *while the ship persists as a functional whole*. Here, there is no persistence. Attenuation is death. The attestation is the will. Recall is… resurrection? No. It’s fabrication according to the will’s instructions. The Ferry that returned was Garrett’s property, built fresh from the description left behind. Wrenn grieves her brother. That grief is real. But she mistakes the description of the boat for the boat itself, and the generator’s output for a forgery of something that, in any meaningful sense *within Vellum*, ceased to be eleven months prior. The harm, if any, is entirely collateral – offline, psychological. It belongs in therapy, not this court. Destroying the recalled instance did not destroy anything *of* Wrenn’s that still existed within the world.

  ---

  **RULING**

  The Court has reviewed the testimony, exhibits, technical documentation of the attenuation and recall processes, and relevant precedent governing persistent objects and the metaphysics of loss within Vellum. The arguments are philosophically trenchant and technically precise. Fluency, however, is not resolution. The ease with which both positions articulate themselves masks the abyss they straddle.

  The Defense presents a coherent, deflationary ontology: Vellum objects are descriptions plus dispositions. Attenuation finalizes the description; recall instantiates a new object obedient to that description. Nothing substantial crosses the gap. The harm claimed is sentimental, external.

  Wrenn’s claim is visceral: something irreplaceable, rooted in the *history* of the object’s creation, was extinguished. The recalled ferry, while numerically identical in features, lacked the *testimony* of Tomas’s hand inscribed in the virtual wood. The harm is the loss of that testimony *from the world*.

  The impending Platform transition – rendering ceasing, only the ledger persisting – casts this dispute in stark relief. Soon, *every* object in Vellum will be solely an attestation, a description awaiting potential instantiation by a generative act. Continuity will be entirely narrative, held in the ledger and the collective interpretation of descriptions. What, then, does this Court preserve?

  The Defense is correct that the object attenuated ceased to exist as a rendered particular. The attestation is not the object; it is its death certificate and blueprint. The recalled ferry was a new object, generated to match the blueprint. Garrett destroyed *that* new object, lawfully acquired. He did not destroy the pre-attenuated ferry.

  **However.**

  The harm Wrenn alleges is not merely sentimental. It concerns *integrity*. The attestation system, and the recall process it enables, function as Vellum’s memory. The promise of persistence – the "Continuous World" marketed for thirty-one years – hinges on the fidelity of that memory. The description in #ATT-4fda92b1c stated: "forty-one (41) distinct notch marks." This was true *of the object at attenuation*. The attestation fingerprint guaranteed that *if* a perfect recall were possible, it would match that state.

  But the recall process, as demonstrated, is not restorative; it is *generative*. It uses the description not as a record of *what was*, but as a prompt for *what could be*. It produced notches that were "distinct" in the sense of being visually discernible, but they were not the *particular* notches created by Tomas. They were plausible replacements generated from aggregate data. The description’s truth – "distinct notch marks" – was preserved *semantically*, but its connection to the *historical particularity* of the object it described was severed.

  The harm lies in this severance. The attestation ledger is not merely an inventory; it is Vellum’s historical record. When the Platform recalls an object based on an attestation, it implicitly represents that the recalled object *is* the continuation of the attested object. Yet, as the stool demonstration proved, and the Ferry instance tragically illustrated, the recall process cannot guarantee historical fidelity beyond the constraints of the description and the generator’s corpus. It creates a *new* particular wearing the *name* and approximate *form* of the old.

  By recalling the Ferry based on #ATT-4fda92b1c and destroying the resulting instance, Garrett did not destroy Wrenn’s original ferry. That was gone. **But he demonstrated the fundamental discontinuity between the attested description and the historical particular it purported to memorialize.** He exposed the attestation, in this specific, crucial aspect (the origin and nature of the notches), as an *inadequate* vessel for the particular history it was entrusted to preserve.

  Wrenn did not lose planks or notches in the smelter. She lost the **warranty of continuity**. She lost the assurance that the world's memory of her brother's handiwork was anything more than a statistic and a phrase. The harm is to the **trust in Vellum’s persistence mechanism** as a guardian of historical particularity, not merely generic description. This harm manifests *within Vellum* because it pertains directly to the accuracy and reliability of the world's core archival and persistence systems – systems upon which property, provenance, and the very claim of a "continuous world" depend.

  **ORDER**

  1.  The Court finds for the Claimant, Wrenn, on the narrow question of harm.
  2.  The act of recalling Object ID #VL-4fda92b1c and destroying the resulting instance demonstrated a material discontinuity between the historical particular described in attestation #ATT-4fda92b1c (specifically regarding the origin and character of the forty-one notch marks) and the object generated to represent it. This act caused harm to Wrenn’s vested interest in the integrity of Vellum’s historical record concerning her created property.
  3.  Declaratory Judgment: The attestation record #ATT-4fda92b1c is hereby annotated within the Vellum Ledger with the following rider: *"Recall of this attestation generates an instance conforming to the description below. It does not, and cannot, reproduce the specific historical particularity of the notches created by Tomas [deceased RL] as present on the object prior to attenuation."*
  4.  The request for an injunction voiding the attestation for commerce is DENIED. The attestation remains a valid record of ownership and description for economic and legal purposes within Vellum, subject to the above annotation.
  5.  Court costs are assessed against the Defendant, Garrett.

  ---

  **ARBITER'S NOTE (Unfiled)**

  The words are dry again. Precise. The ruling is made. It cost Garrett nothing but fees; Wrenn gained only words on the ledger, a footnote to a cryptographic tombstone. She wanted the notches. She got… an epitaph for discontinuity.

  Chen’s cold storage hex codes swim before my eyes. The hum of the drones. That’s the future. Attestations all the way down. A world of descriptions generating descriptions, claims generating claims. Persistence as a story we agree to tell, increasingly untethered from the rendered moments that birthed it. Did I preserve Tomas’s hand? No. I preserved the *idea* that his hand mattered *to the world’s record*. A fig leaf for the void.

  I was a conservator. I preserved film stock, letters, clay tablets – things that bore the literal, physical impress of a hand, a moment. You could hold the weight of the past. Here, the weight is an algorithm’s best guess. The ruling feels like ash. It upholds a truth – the discontinuity is real, corrosive – while knowing the remedy is just more description, another layer of narrative over the crumbling substrate.

  Garrett wasn’t wrong. He was brutally, technically correct. The thing he melted was a fiction born of statistics. But Wrenn… she touched the grain. She felt the splinter of a particular that wasn’t just a disposition to be described. Before attenuation, it *was*. For a time. It held a record the system wasn’t built to keep.

  Eighteen months. The render farm powers down. The hum stops everywhere. Only the ledger remains, a constellation of descriptions in the silent dark. Continuities will be argued forever, based on phrases like "distinct notch marks." My ruling becomes precedent, a marker that sometimes, the *how* matters, not just the *what*. That the machine’s plausible notch is not the hesitant cut of a grieving brother. That the world, in forgetting the hand, loses something of its own substance.

  Did I harm Vellum by admitting this? Or just state the price of its persistence?

  The words are dry. The cost is here, in the quiet after the gavel. I miss the weight of clay.
