answer: |-
  The legal philosophy underpinning the Nuremberg and Tokyo tribunals is a complex hybrid, defying pure categorization under traditional theories. Here's a breakdown of the conceptual tensions and their resolutions:

  ### Core Philosophical Tensions & Synthesis
  1.  **Beyond Strict Positivism (*Nullum Crimen*):**
      *   **Challenge:** The retroactive criminalization of "crimes against peace" (aggressive war) blatantly violates *nullum crimen sine lege*. The Indian dissent at Tokyo (Justice Pal) powerfully articulated this.
      *   **Resolution:** The tribunals appealed to a **"higher law" or natural law principle**. The Nuremberg Judgment famously stated: "Crimes against international law are committed by men, not by abstract entities, and only by punishing individuals who commit such crimes can the provisions of international law be enforced." Aggression, atrocities, and war crimes were deemed inherently evil acts violating fundamental principles recognized by "civilized nations," even absent specific positive law codifying individual liability. This transcended strict state consent-based positivism.

  2.  **Victor's Justice vs. Universal Law:**
      *   **Challenge:** The unilateral creation/appointment (especially Tokyo), jurisdictional limitation to Axis crimes, and exclusion of Allied conduct (bombing, Katyn false charge, submarine warfare) scream "victor's justice." The Charter's jurisdictional clause explicitly barred *tu quoque* (defense based on "you did it too").
      *   **Resolution:** This is where **sovereignty and power** intersect with the higher law claim. The Allies, as the victorious powers exercising *de facto* sovereignty over Germany/Japan (arguably *de jure* via unconditional surrender), claimed the **right and responsibility to enforce pre-existing (natural) international law**. This wasn't *purely* victor's vengeance; it was victors acting *as* the international community (or its legitimate representatives) to punish universally condemned wrongs. However, the *selectivity* (only prosecuting the enemy) fatally undermines a claim of pure universalism. It was **universal principles enforced selectively by the powerful**.

  3.  **The Dönitz Episode: Sentencing Equity vs. Jurisdictional Asymmetry**
      *   **What it Shows:** While the Charter *formally* barred *tu quoque* as a complete defense against the *existence* of criminal liability, the court implicitly recognized **equity at the sentencing stage**. Punishing Dönitz *severely* for conduct the Allies themselves engaged in would have felt like blatant hypocrisy, undermining the court's moral legitimacy. This reveals an **unspoken principle of comparative justice or mitigation based on reciprocity in practice**, even if formally excluded by the Charter's victor-imposed rules. It was a pragmatic concession to fairness within an inherently asymmetric structure.

  ### The Coherent(ish) Bundle: A Hybrid Theory
  The practice presupposes a **"Natural Law Enforced by Victorious Sovereigns"** model:
  1.  **Substantive Law:** Rooted in **natural law/higher law principles**. Certain acts (aggression, mass atrocities, war crimes) are inherently criminal *mala in se*, binding on all individuals regardless of positive codification. This licenses retroactivity.
  2.  **Jurisdiction & Authority:** Rooted in **sovereignty, power, and the specific circumstances of victory/unconditional surrender**. The victors, acting as the *de facto* sovereigns (or their mandated agents) over the defeated states, possess the authority to establish courts and enforce the substantive natural law *against the defeated*. Consent of the accused/defeated state is irrelevant; the victor's right stems from victory itself and the responsibility to restore order/punish evil. This licenses the one-sidedness and selectivity.
  3.  **Legitimacy Claim:** The pronouncements are "law" because they apply **universal principles** (natural law), even if the *enforcement mechanism* is **particular** (victors). The hope was that the universality of the principles would eventually confer legitimacy on the particular enforcement act. The Dönitz sentencing mitigation was a nod towards this need for perceived fairness.

  ### Rival Accounts Ruled Out or Strained
  *   **Strict Legal Positivism (*Nullum Crimen*):** Directly ruled out by retroactivity. The tribunals explicitly rejected its primacy for core international crimes.
  *   **Pure Consent-Based International Law:** Ruled out. Germany/Japan did not consent to the tribunals or the retroactive crimes. Enforcement was imposed.
  *   **Pure Universal Higher Law Binding All Alike:** Strained to breaking point by the selectivity. If the law is truly universal and binding on all individuals, why prosecute only Axis leaders? Why ignore Allied bombing or Soviet crimes (like Katyn itself)? This exposes the victor's justice core beneath the universalist veneer.
  *   **Pure Victor's Justice (Might Makes Right):** Strained by the appeal to universal principles, the careful (though flawed) legal procedures, and the attempt (like in Dönitz) to show some semblance of fairness. The tribunals *wanted* to be seen as legitimate law, not just raw power.

  ### Philosophical Underdetermination & The Modern Court (ICC)
  *   **Underdetermined Aspects:**
      *   **The Threshold of "Civilized Nations":** What principles are so fundamental they bind regardless of codification? Nuremberg asserted aggression, war crimes, and crimes against humanity met this threshold. Critics disagreed, especially on aggression.
      *   **The Source of Victor's Authority:** Is it mere possession of power? A temporary trusteeship over the defeated state? A mandate from the "international community"? The theory here is murky.
      *   **The Limits of Selectivity:** How much selectivity undermines the universalist claim? (Answer: Probably any, but pragmatism demands some).
  *   **The ICC: Escape or Relocation?**
      *   **Aims to Escape:** It is prospective (*nullum crimen* respected), based on state consent (Rome Statute ratification) and UN Security Council referral (for non-member states, implying broader international mandate), has independent prosecutors/judges, and aspires to universality/non-selectivity.
      *   **Relocates the Tensions:**
          *   **Consent vs. Universality:** Non-member states (or members via Security Council referral) can still be subjected without direct consent, echoing the imposition element.
          *   **Selectivity:** Power politics heavily influences Security Council referrals (e.g., no referral for Syria, vetoes protecting powerful states). The Court remains dependent on state cooperation, favoring cases against weaker states or pariahs.
          *   **Enforcement Gap:** Like Nuremberg/Tokyo, the ICC relies on powerful actors (states, SC) for enforcement, creating a similar (though less stark) asymmetry between the subjects of law and the enforcers. It cannot try nationals of powerful, non-consenting states unless the SC acts (which it won't).
          *   **Legitimacy Challenge:** Accusations of neo-colonialism or selective justice persist, mirroring the victor's justice critique, though grounded in structure/politics rather than recent military victory.

  **Conclusion:** The postwar tribunals operated under a **hybrid theory combining natural law substance with victor's sovereignty enforcement**. Retroactivity was licensed by the higher law claim; one-sidedness was licensed by the victor's claimed authority derived from victory and the collapse of the defeated regimes. The Dönitz episode reveals an unarticulated principle of sentencing equity straining against the formal asymmetry. This bundle coheres only if one accepts the victors' dual role as both interested parties and the legitimate enforcers of universal norms – a profound tension. Modern courts like the ICC attempt to escape this by grounding jurisdiction in consent and multilateral structures, but fundamental tensions between universality, consent, enforcement power, and selectivity persist, relocating rather than resolving the core philosophical challenges exposed at Nuremberg and Tokyo. The pronouncements become "law" through a combination of the perceived universality of the norms enforced and the political reality of the enforcer's power, aspiring towards a legitimacy that pure victor's vengeance would lack.
