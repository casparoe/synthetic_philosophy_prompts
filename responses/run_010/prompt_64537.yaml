  ### Vance Capital Management - Fourth Quarter Letter to Limited Partners

  January 15, 2024  

  Dear Partners,  

  The past year has been profoundly challenging for our fund. While we remain committed to the mathematically optimal principles guiding our strategy, external shifts in the underlying odds of our core opportunity—despite rigorous initial calibration—resulted in a 78% decline in net asset value. We acknowledge the distress this causes, but stress that the strategy was never "mathematically ruined" (final NAV: $17.4M vs. initial $79M). Below, we contextualize these outcomes within the timeless framework of the Kelly criterion.  

  **I. The Strategy’s Theoretical Foundation**  
  Our flagship strategy staked precisely one-sixth of capital per round on an even-odds proposition paying 60% on wins and costing 40% on losses—the exact Kelly fraction maximizing long-term geometric growth. Had we abandoned fractional staking and wagered entire capital each round, expected wealth would have risen linearly with each bet size (10% per round pre-drift), yet the *typical path*—the median outcome across all possible worlds—would have decayed geometrically toward zero. This duality is why Kelly is not merely a staking rule but a philosophy: it spares us the hubris of chasing arithmetic means while ignoring the geometry of survival.  

  **II. Performance Attribution**  
  The year’s losses stem from a divergence between our initial edge measurement and the true odds during execution. At inception, the ensemble average (the expected outcome across parallel universes) justified a 2% per-round growth rate. Regrettably, the *time-average path*—our singular reality—confronted adverse drift. Some argue for half-Kelly sizing to reduce volatility. True: halving stakes to one-twelfth would have sacrificed nearly 25% of our growth rate while cutting the dispersion of terminal wealth by ~75%. But this is a Faustian bargain—paying a quarter of one’s potential to mute the variance that makes growth possible. We rejected it then and do so now.  

  **III. Risk Management and Misplaced Criticisms**  
  Despite severe losses, note that the strategy structurally avoids ruin: each loss costs only 40% of one-sixth (6.67% of capital), ensuring compounding persists indefinitely. (To those invoking utility functions, bequest motives, or "the need to eat": you mistake yourselves for a distribution. We optimize for the asymptotic growth of capital, not the transient cravings of its temporary holders.) The ensemble average, when we launched this series, promised exponential growth; the time average delivered a negative excursion. Such is the cost of probabilistic fidelity.  

  **IV. Path Forward**  
  The fund continues, albeit diminished. We are recalibrating odds in quieter markets and reaffirm our belief that geometric optimization transcends cyclical misfortunes. The ensemble of opportunities ahead remains robust; our task is to let the long-run time average reflect it.  

  Sincerely,  
  Desmond Vance  
  Managing Partner, Vance Capital Management  

  ---  
  *Disclosure: Vance Capital’s flagship strategy compounds based on estimated expected values, which may differ materially from realized outcomes. Past performance does not guarantee future results; the fund may liquidate if NAV falls below administrative cost thresholds. Limited partners bear all losses.*  

