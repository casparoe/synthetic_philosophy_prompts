prompt: |-
  I chair a nine-member professional licensing tribunal that hears appeals against disciplinary findings, and I have been asked to produce a written defence of the voting rule we use before the membership reappoints me in the spring. Almost every case we hear has the same shape: a finding of professional misconduct requires that three elements each be made out — that the respondent owed the complainant a duty defined by our code, that the respondent's conduct fell below the standard that duty imposes, and that the shortfall caused the harm complained of — and if any one of the three fails, the appeal succeeds. We vote separately on each element and then on the overall outcome, by secret ballot, and we publish a reasoned decision that states which elements the tribunal found. Last month the arrangement broke. Of nine members, four found duty and causation but not breach, three found breach and causation but not duty, and two found all three. Taking each element in turn, breach carried five to four and duty carried five to four, so the published reasoning would have to say both elements were made out and that misconduct followed; taking the outcome as a whole, only two of nine would have found misconduct, so the appeal plainly succeeds. Someone at the table said we had simply to choose whether the panel answers the questions or answers the case, and I have since learned that this structure has names — the doctrinal paradox in the legal literature, the discursive dilemma in social choice theory — and that it sits at the entrance to an impossibility literature descended from Arrow's theorem, complete with conditions I can recite but not really weigh.

  What I want before I read another paper on the subject is the specification: what any adequate aggregation rule for a body like ours has to deliver. Give me the requirements list — the phenomena to explain, the cases to get right, the distinctions not to collapse, the formal properties to satisfy — with the motivating case or consideration behind each one. I expect it to include something like universal domain, preservation of unanimity, some consistency requirement on the collective set of findings taken as a whole, the independence-and-neutrality bundle that goes under the name of systematicity, anonymity, monotonicity or responsiveness, determinacy of outcome without a casting vote, and insensitivity to the order in which the chair puts the questions. For each, tell me whether it is a genuine requirement of a rule that must yield a publishable, internally coherent reasoned decision, or an artefact of importing Arrow's framework into a setting with a different purpose — and say plainly where my own characterisations above are loose. Then the part I most want: identify which subsets of these requirements cannot be jointly satisfied, and say exactly what the agenda has to look like for that to bite. I understand the impossibility turns on some connectedness or non-simplicity property of the proposition set, and that dropping anonymity may not rescue you once the agenda has it. How much work is that agenda condition doing? Our docket is overwhelmingly conjunctive in the way I described, so is non-simplicity unavoidable for us, or can we design the question set to escape it the way restricted domains such as single-peakedness are supposed to escape Arrow? Which single requirement, in your judgement, eliminates the most otherwise attractive candidates?

  Two further constraints of ours should be kept in view, because I suspect they change the answer. The panel's size varies: members recuse themselves mid-deliberation, sometimes leaving seven or even six voting, and a rule that behaves differently at different sizes worries me. And the chair currently controls the sequence of questions, which colleagues assure me is a form of power we should not be handing to one person. Finally, tell me briefly and in prose how the obvious candidates fare against your list — premise-based aggregation, conclusion-based aggregation, majority rule with the chair breaking ties, supermajority or quota-style rules, sequential or priority procedures, and whatever you would propose instead for a body that must publish reasons. I do not need a full scorecard, just the upshot. Please write the whole thing as continuous prose, the way you would write a letter to a colleague: no headings, no bullet points, no bold, no tables, and open with the single requirement you think does the most exclusionary work before you go on to justify that choice.
reasoning: |-
  Hmm, the user chairs a nine-member professional licensing tribunal that handles appeals against disciplinary findings. Their cases typically involve three conjunctive elements: duty, breach, and causation. All three must be established for misconduct to be found. The tribunal votes separately on each element and then on the overall outcome, publishing a reasoned decision.

  Recently, they encountered a paradoxical situation: 4 found duty and causation but not breach; 3 found breach and causation but not duty; 2 found all three. By element: breach passed 5-4, duty passed 5-4, causation passed 9-0. But only 2 supported the overall misconduct finding. This created a conflict between element-wise and outcome-wise voting.

  The user wants a specification of requirements for an adequate aggregation rule before diving into academic literature. They need:
  - Requirements list (phenomena to explain, cases to get right, distinctions not to collapse, formal properties to satisfy)
  - For each requirement: whether it's essential for publishable coherent decisions or an artefact of Arrow's framework
  - Clarification where their characterizations are loose
  - Identification of which requirement subsets conflict
  - The role of agenda conditions (particularly non-simplicity)
  - Whether their conjunctive cases unavoidably create non-simplicity
  - Which requirement eliminates most candidates
  - Impact of variable panel size (6-9 members) and chair-controlled question sequence
  - Brief assessment of common aggregation methods

  Key requirements I consider essential:
  1. Universal Domain: Must handle any logically possible combination of individual judgments on elements/outcome. Essential because members may hold any coherent views.

  2. Unanimity Preservation: If all agree on an element or outcome, that must be the collective view. Fundamental for legitimacy.

  3. Collective Rationality: The collective set of findings must be logically consistent. Crucial for publishable reasoned decisions - prevents the paradox they experienced.

  4. Systematicity: Independence (vote on each proposition unaffected by others) + Neutrality (same voting rule for all propositions). But strict independence conflicts with collective rationality in their agenda.

  5. Anonymity: Outcome unaffected by who holds which view. Important for fairness.

  6. Monotonicity: More support shouldn't hurt a proposition. Basic responsiveness requirement.

  7. Non-dictatorship: No single member always determines outcomes. Obvious necessity.

  8. Agenda Insensitivity: Outcome shouldn't depend on question sequence. Critical given concerns about chair power.

  9. Size Invariance: Rule should work consistently at different sizes (6-9 members). Practical necessity.

  The core impossibility arises from requiring Systematicity + Collective Rationality + Universal Domain on a non-simple agenda (where propositions are interconnected, like their conjunctive structure). Their duty-breach-causation-misconduct set is inherently non-simple because misconduct = duty AND breach AND causation.

  No aggregation rule can satisfy all requirements simultaneously for their agenda. Collective Rationality is likely the most exclusionary requirement - it's non-negotiable for coherent reasons but conflicts with Systematicity.

  Assessment of candidates:
  - Premise-Based: Votes only on elements, deduces outcome. Satisfies coherence but violates outcome unanimity (e.g., if all agree no misconduct but elements disagree).
  - Conclusion-Based: Votes only on outcome, no element-level reasons. Unacceptable as it prevents reasoned decisions.
  - Majority on Outcome with Tiebreak: Avoids paradox but provides no element-level reasoning.
  - Supermajority/Quotas: Reduces inconsistency risk but may cause gridlock and still risks paradox.
  - Sequential Priority: E.g., resolve duty first, then breach if duty found. Agenda-sensitive and path-dependent.
  - Reason-Based Aggregation: My proposal: Vote on elements, accept only element judgments with majority support, deduce outcome from supported elements. Requires adjusting when element majorities imply incoherent outcome (rare in their case). Balances coherence and reasons best.

  Given variable size and sequence concerns, Reason-Based Aggregation appears most viable despite occasional need for tiebreaking adjustments. The critical tradeoff is between strict independence and full coherence - the latter being indispensable for their mandate.
answer: |-
  My dear colleague,

  Let me start with the requirement I believe does the heaviest lifting in winnowing down your options: **Collective Rationality**. This demands that the tribunal's final set of judgments—on each element and the overall outcome—must be logically consistent. In your case, this means the collective finding of misconduct must be the logical consequence (conjunction) of the collective findings on duty, breach, and causation. It cannot be the case that the tribunal collectively affirms all three elements but denies misconduct, or vice versa. This is non-negotiable for your body. A publishable, reasoned decision that states findings on each element and an outcome must be coherent; it cannot contain a blatant logical contradiction like affirming all premises while rejecting the conclusion. The paradox you experienced last month—where element-wise majorities implied misconduct, but an outcome vote rejected it—violates this fundamental requirement of rational collective agency. Without it, your written defense would crumble under scrutiny. Many otherwise plausible rules fail precisely here, especially when combined with other basic demands.

  Now, let's build the full requirements list systematically, grounding each in the practical realities of your tribunal and clarifying where your initial characterizations might need tightening. I'll distinguish genuine necessities for your reasoned-decision mandate from artifacts of abstract social choice theory.

  1.  **Universal Domain:** The rule must accept *any* logically possible configuration of individual judgments. Each member can hold any coherent set of views on the elements and outcome (e.g., believing in duty and breach but not causation, or rejecting duty but still believing misconduct occurred if they misinterpret the law). This is essential because you cannot restrict how members reason, only how their judgments are aggregated. Your characterization is correct here – it’s a genuine requirement to handle real-world deliberation diversity.

  2.  **Unanimity Preservation:** If all members agree on a proposition (an element or the outcome), the collective finding must reflect that agreement. If nine members unanimously find no breach, the collective finding must be "no breach," and the appeal must succeed. This is fundamental for legitimacy and fairness; overriding unanimity would be indefensible in a professional tribunal. A genuine requirement.

  3.  **Collective Rationality (Logical Consistency):** As argued above, the collective set of judgments *must* be logically consistent. Specifically:
      *   Misconduct must be affirmed iff Duty, Breach, *and* Causation are all affirmed.
      *   The negation of Misconduct must be affirmed iff at least one of Duty, Breach, or Causation is negated.
      This is the core requirement exposed by your paradox and is absolutely genuine – the sine qua non of a coherent, publishable reason statement. Your description ("some consistency requirement") is apt but underspecified; it’s specifically about the *interconnection* of the propositions.

  4.  **Systematicity (Independence + Neutrality):** This bundle requires:
      *   *Independence:* The collective judgment on any single proposition (e.g., "Duty exists") depends *only* on the individual judgments on *that specific proposition*. Judgments on other propositions shouldn't influence it.
      *   *Neutrality:* The same voting rule (e.g., majority) is used for every proposition of the same type (all elements, the outcome).
      Here's where your characterization needs tightening, and where the Arrow-inherited artifact becomes problematic. Independence seems appealing for fairness and preventing strategic voting. However, strict Independence *conflicts directly* with Collective Rationality in your agenda, as your paradox shows. Is it *genuinely* required? For the *elements*, perhaps, as you publish findings on each independently. But strict Independence for the *outcome* vote relative to the elements is less critical *if* the outcome is a logical function of the elements. Neutrality (same rule for each element) seems a genuine fairness requirement. Systematicity as a rigid bundle, however, is likely an artifact; relaxing Independence specifically for the outcome or its relationship to the elements might be necessary and justifiable.

  5.  **Anonymity:** The collective outcome depends only on the *number* of members holding each view, not on *who* holds them. This embodies fairness and prevents undue influence. A genuine requirement for a judicial body. Your description ("anonymous" via secret ballot) aligns, but the requirement is about the rule's output, not the input method.

  6.  **Monotonicity (Responsiveness):** If the collective finding is "Duty exists" (for example), and one member changes their vote from "no Duty" to "Duty" (other votes unchanged), the collective finding should remain "Duty exists." More support shouldn't hurt a proposition. This is a core fairness and responsiveness requirement. Genuine.

  7.  **Non-Dictatorship:** No single member’s judgments always determine the collective judgments. Obviously genuine for a multi-member tribunal.

  8.  **Determinacy:** The rule must always produce a unique collective judgment for every proposition, without reliance on a random device *or* an arbitrary casting vote in all cases. While a chair's tiebreak might be pragmatically needed sometimes, a rule demanding it frequently is undesirable. Genuine requirement for finality and predictability. Your concern about no casting vote points to this.

  9.  **Agenda Insensitivity (Path Independence):** The final collective judgment set should not depend on the order in which the propositions are voted upon. This directly addresses your concern about the chair's power to sequence questions and prevents manipulative path-dependency. A very genuine requirement for fairness and legitimacy. Your colleagues are right to worry.

  10. **Size Invariance:** The rule should function consistently and satisfy the core requirements (especially coherence and fairness) regardless of whether 6, 7, 8, or 9 members vote. The logic of decision-making shouldn’t fundamentally change with recusals. Your concern is valid; this is a genuine practical constraint. Rules relying on specific majorities (like simple majority) generally handle this better than fixed quotas.

  **Impossibilities and Agenda Structure:**
  The fundamental impossibility arises when you demand **Collective Rationality, Systematicity (especially Independence), Universal Domain, and Anonymity** on a **non-simple agenda**. An agenda is non-simple if the propositions are logically interconnected, like your conjunctive structure where Misconduct = Duty AND Breach AND Causation. This interconnection is unavoidable for you; it defines the "shape" of your cases. The agenda condition *is* doing crucial work. It's not like single-peakedness escaping Arrow – your domain restriction *is* the logical structure causing the problem. You cannot "design away" the conjunction without abandoning your core mandate to rule on these specific elements and their logical consequence.

  The subsets that clash are primarily:
  *   Collective Rationality + Systematicity (Independence) + Universal Domain → Impossible on your non-simple agenda.
  *   Anonymity generally doesn't rescue you once the agenda is non-simple and you demand Collective Rationality and Independence. Relaxing Anonymity (allowing weighted votes) doesn't solve the core logical conflict.

  **Dropping Collective Rationality** eliminates *many* otherwise simple candidates (like pure conclusion-based voting or letting the outcome vote override elements) but is utterly unacceptable for your reasoned decision requirement. **Dropping Independence** (Systematicity) is the most common escape route, as it allows the vote on one proposition to be sensitive to votes on others to preserve consistency. **Collective Rationality** is the requirement that does the most exclusionary work precisely because it's indispensable for you but conflicts sharply with Independence given your agenda.

  **Assessment of Candidates Under Constraints:**
  *   **Premise-Based (Vote only elements, deduce outcome):** Satisfies Universal Domain, Unanimity (on elements), Collective Rationality, Anonymity, Monotonicity, Determinacy (usually), Agenda Insensitivity, Size Invariance. *Fails* Systematicity (no independent vote on outcome) and Outcome Unanimity Preservation (e.g., if all agree no misconduct, but element votes disagree, misconduct might still be deduced – a major weakness). Provides full element-level reasons. Robust to size changes.
  *   **Conclusion-Based (Vote only outcome, no element votes):** Satisfies Universal Domain, Unanimity (outcome), Anonymity, Monotonicity, Determinacy, Agenda Insensitivity (trivially), Size Invariance. *Fails* Collective Rationality (no element judgments to be consistent *with*), Systematicity (no element votes), and crucially, prevents *any* publishable reasoned decision based on elements – fatally flawed for your mandate.
  *   **Majority on Outcome (Chair breaks ties):** Similar flaws to conclusion-based. Provides no element-level reasoning. May violate Collective Rationality if element votes were taken but ignored. Gives chair significant power in ties. Size variance complicates tie likelihood.
  *   **Supermajority/Quotas:** E.g., require 2/3 for each element or outcome. Reduces inconsistency risk but doesn't eliminate it on non-simple agendas. Can lead to gridlock (no finding made). Violates Unanimity if quota > unanimity. Fails Collective Rationality if inconsistency still occurs. Size variance makes fixed quotas problematic (6 vs 9 members). Doesn't guarantee reasons coherence.
  *   **Sequential Priority:** E.g., vote Duty first; if affirmed, vote Breach; if both affirmed, vote Causation; Misconduct deduced. Can be designed to satisfy Collective Rationality and provide reasons. *Fails* Agenda Insensitivity spectacularly – outcome heavily path-dependent (chair's sequence choice is decisive power). Unanimity on later elements can be overridden by prior votes. Size invariance manageable, but path-dependence remains the fatal flaw.
  *   **Proposal: Qualified Premise-Based with Fallback (Reason-Based Aggregation):** Vote on all elements by majority rule. *If* the set of affirmed elements logically implies Misconduct, affirm it; *if* the set implies no Misconduct, deny it. This satisfies Collective Rationality, provides element-level reasons, and is usually determinate. The rub occurs in rare cases where the affirmed element set is *inconclusive* regarding Misconduct (e.g., majorities affirm Duty and Breach but *reject* Causation – clearly no misconduct). In your structure, this inconclusiveness is unlikely; affirming any element requires a majority, and misconduct requires *all three*. If majorities affirm all three, misconduct *must* be affirmed (consistent). If a majority rejects *any one*, misconduct *must* be denied (consistent). The paradox situation (majorities affirm each element individually but no majority for misconduct) only arises with incoherent individual judgments – but Universal Domain allows this! Here, the rule must specify a fallback: either 1) Deduce Misconduct from the affirmed elements (leading to a contradiction with the outcome vote if taken), or 2) Take an outcome vote *only when inconsistency would arise from the element majorities*. Option 2 violates strict Independence but prioritizes Collective Rationality. It satisfies Universal Domain, Unanimity Preservation (if all agree on an element or that misconduct follows/doesn't follow from the elements, it will be reflected), Collective Rationality (by construction), Anonymity, Monotonicity, Determinacy (with the fallback), Size Invariance (using majority at any size). It *fails* strict Systematicity (Independence) in the fallback trigger. Crucially, it minimizes chair power (no sequencing control, tiebreak rarely needed) and delivers coherent, reason-based decisions in almost all cases, triggering a separate outcome vote only in the pathological, rare scenario you encountered. The published reasons state the majority element findings and the logical (or voted, in the rare case) outcome.

  In essence, the impossibility literature confirms a trade-off for your tribunal: you cannot have perfect element-wise Independence *and* guaranteed logical coherence *and* full agenda insensitivity on your conjunctive agenda. Collective Rationality is paramount for reasoned decisions. Relaxing strict Independence—specifically, allowing the outcome to be sensitive to the element results to ensure consistency—is the most defensible compromise. The Qualified Premise-Based approach with a triggered outcome vote fallback balances coherence, reason-giving, fairness, and robustness to size changes while minimizing opportunities for chair manipulation. It directly addresses last month's breakdown by providing a clear, justifiable path to the only sensible outcome in such a scenario: the appeal succeeds, and the reasons can state the element majorities while explaining the logical necessity of the overall result based on the absence of unanimous support for misconduct despite those majorities.

  Yours in the search for coherent adjudication,

  [Your Name's Theorist Counterpart]
