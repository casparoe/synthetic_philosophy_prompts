  **1.**  
  Captain Rhys Bowen tapped the brass sextant case on the warped oak table of the *Siren’s Rest* tavern. Rain lashed the grimy windows overlooking Porthaven harbor. The air reeked of salt, damp wool, and pipe smoke. "Thirty thousand guineas, Evan," he said, his voice low and urgent, addressing the shipping consortium's junior clerk. "Locked in the *Golden Manta*’s strongroom, ten leagues west of the Serpent’s Teeth reefs. Sank in the '82 monsoon." He pushed a stiff parchment across the table – Lloyds' confirmation of the sum, salvaging rights clause C.7 meticulously underlined: *First verifiable claimant secures exclusive recovery rights.* "We depart with the tide. The *Swift* is readied."

  Opposite him, Aled Vaughan, Bowen’s rival salvager, leaned back, a slow smile spreading. "Generous of you to announce it, Rhys. My *Hound* leaves in two hours." Vaughan’s confidence stemmed from the document Evan had processed just that morning: a treatise Vaughan commissioned from a reclusive logician, arguing that in any race for a single, fixed prize where both parties possess identical ships, charts, and diving bells, the follower can always replicate the leader's actions with a trivial delay, nullifying the head start. "Strategy stealing," the dry prose had concluded, "renders temporal priority valueless." Vaughan saw only the guarantee. Bowen saw deep water and sharp rock.

  **2.**  
  Three weeks later, the *Swift* and the *Sea Hound* pitched on a greasy, slate-grey swell beneath an oppressive sky. The Serpent’s Teeth were a jagged black line on the horizon. Bowen stood on the heaving deck, spray stinging his face, the sextant cold and heavy in his hands. He’d taken a precise fix at dawn. "Lower the bell," he ordered. "Grid sector Gamma-Seven. Ten fathoms." His diver, a grizzled Cornishman named Tregarth, descended into the murk. Bowen kept the sextant clutched, a talisman against the sea’s indifference.

  Aboard the *Hound*, half a mile east, Vaughan watched through his own brass telescope. He saw the *Swift*’s bell vanish. "Mark the position," he told his mate. "Lower ours. Same spot, immediate." His logician’s guarantee felt solid, a compass needle pointing true. If Bowen found the wreck, Vaughan’s diver would see the trail – disturbed silt, the gleam of metal – and follow. The lead was illusory. The sextant on Vaughan’s chart table gleamed under a swinging lantern, an instrument of inevitable parity.

  **3.**  
  A fortnight of fruitless searching turned the mood aboard both vessels sour. The holds smelled of bilgewater, damp canvas, and unwashed men. Bowen, hollow-eyed, studied his charts again, the sextant lying beside them like a discarded thought. Tregarth surfaced from another dive, shaking his head. "Nothing but sand and dead coral, Cap'n. Currents down there... like a devil's whirlpool." Bowen adjusted his search pattern, shifting north-east into sector Delta-Two, based on a hunch about tidal drift noted in an old whaler's journal Vaughan wouldn't possess.

  Vaughan, observing the *Swift*’s course change through his glass, immediately ordered the *Hound* to mirror the move. His diver descended into Delta-Two. Hours later, he surfaced pale. "Found timber... *Swift*’s diver was there hours ago, sir. Kicked up silt like a storm. Couldn't see a damned thing past my hand. Got tangled in a line they must've dropped and abandoned." The perfect replication was fouled by the physical reality of the leader’s passage. Vaughan glanced at his sextant; its precision suddenly felt abstract, useless against the chaotic water column.

  **4.**  
  Evan Pender, the clerk, shivered in the cramped, damp chartroom of the *Sea Hound*. He’d been sent as Vaughan's eyes-and-ears, recording expenses: £47 for replacement diving lines, £120 for lost grappling hooks. The air tasted metallic. He was copying Vaughan’s log entries when the discrepancy struck him. Vaughan’s notes meticulously recorded mirroring Bowen’s *surface* positions. But Evan recalled the salvaging clause: *verifiable claimant*. How could Vaughan verify what Bowen found *before* seeing it? The logician’s treatise assumed perfect information – the follower seeing the leader's *actions* and *discoveries* instantly. Underwater, in shifting silt and powerful currents, Tregarth’s disturbance wasn't just noise; it was destruction. It erased the very path Vaughan needed to copy. The guarantee relied on symmetry the ocean refused to grant. The sextant, resting near the ledger, seemed absurdly precise for a world that obscured its truths. Evan felt a chill that had nothing to do with the damp. He wrote nothing.

  **5.**  
  A bitter north wind whipped across the decks as both ships lay anchored, engines silent, facing each other like weary duelists. Weeks had bled into months. Autumn was turning the sea a deeper, colder grey. The prize money remained ten leagues west, untouched. Bowen stood on the *Swift*’s quarterdeck, the sextant in his hand not aimed at the horizon, but simply held. Its once-bright brass was dulled, speckled with green corrosion from constant salt spray. It was no longer a tool for finding, only a weight, a relic of a plan that dissolved in the face of the depths.

  On the *Hound*, Vaughan stared blankly at a pile of invoices Evan presented: victualling costs exceeding £2,000, crew bonuses demanded, wear-and-tear estimates. The theoretical advantage, the guaranteed nullification of the lead, had translated into ruinous expense and zero progress. The sea hadn’t yielded to logic. Evan watched Vaughan pick up his own sextant, its shine also faded. Vaughan didn’t raise it. He turned it over in his hands, then placed it carefully back on the chart table, beside the untouched, philosophically impeccable treatise. It was just a piece of brass now. The guarantee of parity was worth precisely the £30,000 they hadn’t found, and the mounting debts they had. The wind moaned in the rigging, carrying only the sound of loss.
