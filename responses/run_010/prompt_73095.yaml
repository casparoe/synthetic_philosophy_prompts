answer: |-
  Below is your survival toolkit, structured exactly as requested. I've modeled questions based on the room's composition, ignoring specialist objections that won't surface here. Ground concessions are designed to disarm without cost; soft spots flag where pressure will come next.

  ---

  ### **Brainstorming: Room Toolkit & Intolerances**
  1. **Presupposition/Projection Duo**  
     - *Toolkit*: Multidimensional semantics, diagnostics for projection (embedding tests, cancellation).  
     - *Cannot tolerate*: Unexplained projection behavior; treating "non-content" as non-lexical when it patterns like presupposition.  

  2. **Formal Semanticist (Expressives Architect)**  
     - *Toolkit*: Compositionality demands; strict lexicon-semantics coupling; architecture where "expressive features" must do work.  
     - *Cannot tolerate*: "This isn't semantics" dismissals; handwaving about composition.  

  3. **Sociolinguist (Reclamation/Register)**  
     - *Toolkit*: Empirical observation of speaker communities; fluid boundaries of group membership.  
     - *Cannot tolerate*: Rigid, speaker-independent social rules; ignoring that reclamation is speaker-led.  

  4. **Austinian Grad Student**  
     - *Toolkit*: Infelicity taxonomies (misfires, abuses, etc.); precise conditions for "void".  
     - *Cannot tolerate*: Vague or ad hoc speech-act categories.  

  5. **Political Philosopher**  
     - *Toolkit*: Normative consequences; real-world harm assessment.  
     - *Cannot tolerate*: Descriptive accounts that ignore harm dynamics.  

  **Specialist objections ignored**:  
  - "Why not conventional implicature?" (room lacks slur specialists)  
  - "Your act-based story can't explain semantic embedding!" (projection duo will attack differently)  
  - "What about cross-linguistic variation?" (no typologists present)  

  ---

  ### **Prep Sheet: Top 8 Questions by Damage Score**  
  *(Damage = Likelihood × Impact on Chapter)*  

  1. **Formal Semanticist** (Damage: 9/10)  
     - *Question*: "If slurs share lexical entries with neutral counterparts, why do they project in embeddings like factive verbs? Your 'act' story doesn't compose—it's not semantics!"  
     - *Concession*: "Absolutely—projection *needs* explanation, and my account must interface with composition."  
     - *Reply*: "Projection arises because the prohibition attaches to the *act of tokening*, not the word. When embedded, the audience still evaluates the *matrix* utterance as potentially enacting a new ranking-claim. The lexical entry isn’t doing the work; the social rule governing token-use is."  
     - *Soft spot*: "But doesn’t this make projection entirely pragmatic? Then why does it pattern semantically?"  

  2. **Presupposition Duo** (Damage: 8/10)  
     - *Question*: "You say derogation isn’t presuppositional, but slurs pattern with presuppositions in embeddings. Isn’t this just relabeling conventional implicature?"  
     - *Concession*: "I agree the data overlaps—this is why multidimensional accounts are tempting."  
     - *Reply*: "Critically, presuppositions *fail* when the audience doesn’t accept them, but slur prohibitions hold even if the audience rejects the ranking. The force varies (as per Commitment 3), but the rule *always* prohibits the act because it risks creating public evidence."  
     - *Soft spot*: "How is this 'evidence' different from presupposition accommodation?"  

  3. **Sociolinguist** (Damage: 7/10)  
     - *Question*: "You say in-group use is 'void' because the speaker can’t enter a ranking-claim. But what if an out-group speaker mistakenly *thinks* they’re in-group? Is the act still prohibited?"  
     - *Concession*: "Speaker intention isn’t sufficient—I agree boundaries are messy."  
     - *Reply*: "The rule tracks *socially recognized* position, not self-identification. If the audience perceives the speaker as out-group, the act enters the ledger *for them*, regardless of speaker error. Force is audience-relative."  
     - *Soft spot*: "Who determines 'social recognition'? This feels circular."  

  4. **Political Philosopher** (Damage: 6/10)  
     - *Question*: "If force is audience-relative, doesn’t this imply harm is diminished if bigots overhear a slur but aren’t offended? That’s morally untenable!"  
     - *Concession*: "Harm is real and multifaceted—I don’t reduce it to force."  
     - *Reply*: "Harm isn’t contingent on force. The *prohibition* exists because the act *risks* creating durable evidence of hierarchy. Even if force attenuates (e.g., among bigots), the act normalizes ledger-entries, harming the targeted group’s standing."  
     - *Soft spot*: "But doesn’t 'risk' make your account consequentialist? What about intrinsic wrongs?"  

  5. **Austinian Grad Student** (Damage: 6/10)  
     - *Question*: "Is 'void' just a misfire? What are the exact felicity conditions for your 'ranking-claim' act?"  
     - *Concession*: "Austin’s taxonomy is useful—but I’m not strictly Austinian."  
     - *Reply*: "Void acts aren’t misfires; they’re *empty moves*. Conditions: (i) a speaker with social authority to downgrade, (ii) a context where the ledger is operative. In-group speakers lack (i) against their group; reclamation exploits this voidance deliberately."  
     - *Soft spot*: "How is 'authority' defined without circularity?"  

  6. **Presupposition Duo (Follow-Up)** (Damage: 5/10)  
     - *Question*: "Why does indirect reporting ('X said S') retain force, but not hypotheticals? That’s classic presupposition behavior!"  
     - *Concession*: "The similarity is real—this is a key test case."  
     - *Reply*: "Indirect reports cite an identifiable speaker’s *past act*, which entered the ledger. Hypotheticals don’t reference a real act—no evidence is created. The social rule prohibits *tokenings*, not concepts."  
     - *Soft spot*: "What about fictional uses? They lack real speakers but still offend."  

  7. **Formal Semanticist (Follow-Up)** (Damage: 4/10)  
     - *Question*: "Is this even semantics? You’ve offloaded everything to pragmatics and social rules."  
     - *Concession*: "Compositionality is non-negotiable—I’m not abandoning semantics."  
     - *Reply*: "The *lexical entry* is semantic. The *prohibition* is a metalinguistic rule about token-use. Semantics explains truth-conditions; the ledger explains why *this word* is prohibited rather than its synonym."  
     - *Soft spot*: "Then why focus on semantics at all? This feels like a bait-and-switch."  

  8. **Sociolinguist (Follow-Up)** (Damage: 3/10)  
     - *Question*: "How does reclamation work if prohibitions are based on standing rules? Can speakers *change* the rules?"  
     - *Concession*: "Reclamation *is* paradoxical for static accounts."  
     - *Reply*: "Reclamation exploits voidance: in-group speakers use the word *because* it can’t enter a ranking-claim against them. This reframes the word’s social meaning, but the rule persists for out-group speakers."  
     - *Soft spot*: "Doesn’t successful reclamation dissolve the prohibition? Your rule seems immutable."  

  ---

  ### **The Reply That Must Land**  
  **Target**: Formal Semanticist's compositionality challenge (Question 1).  
  **Why**: If the room accepts that projection/embedding can be explained by *act-risk* rather than lexical content, the core survives. If not, the view collapses into "not even semantics."  

  **First Two Minutes to Preempt Misreadings**:  
  > "Clarifying two points upfront:  
  > 1. **I am not saying slurs lack meaning**. They share truth-conditional content with neutral counterparts.  
  > 2. **I am answering 'What makes a word a slur?'**—not 'What do slurs mean?' The *prohibition* arises from how tokenings function as public acts, not hidden semantics."  

  ---

  ### **The Question You Hope Nobody Asks**  
  **Question**: "Why does the vocative use (Commitment 4) trigger the prohibition? Isn't addressing someone descriptively neutral?"  
  **Why it’s lethal**:  
  - It’s your weakest empirical claim, with no data offered.  
  - Exposes circularity: "Vocative use creates prohibition" vs. "prohibition explains vocative force."  
  - The sociolinguist *will* pounce: vocatives exist for non-slurs (e.g., titles), and slurs aren’t always vocative.  

  **Least-Bad Fallback**:  
  > "The vocative conjecture is a *diagnostic*: it marks when a term becomes a tool for *enacting* hierarchy interpersonally. Predicative uses inherit the prohibition because they invoke the same act-type. This is testable—historical cases should show vocative emergence preceding full prohibition."  

  *Damage control*: Frame it as a prediction, not a necessity. If pressed, concede it’s speculative but separable from Commitments 1-3.  

  ---

  **Tactical Summary**: Anchor every reply to the *act* (Commitment 2) and *audience-relativity* (Commitment 3). Let the formal semanticist set the stakes—win them, and the room follows. If the vocative question arises, treat it as a footnote, not the foundation.
