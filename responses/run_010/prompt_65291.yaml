  2. **Orwellian (Unpersoned-memory)**: The content is revised after it was conscious, so the subject did have a conscious experience of the pre-revised content, but the memory is altered.
     - Awkward thing to swallow: How can the subject have no memory of an experience they just had, and why does the alteration leave no trace?

