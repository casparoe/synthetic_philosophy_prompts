  **Secular Horizons Group: Global Stress Index Outlook**  
  **Important Disclosures, Methodology Notes, and Risk Factors**  
  **(Version 4.1, Effective Q3 2024)**  

  **1. Introduction**  
  This document outlines the methodology, limitations, and use conditions for Secular Horizons Group’s ("SHG" or "the Firm") proprietary Global Stress Index ("GSI") and associated forecasts. The GSI applies structural-demographic theory ("SDT") to assess geopolitical and socioeconomic instability risks over 10-50 year horizons. Clients acknowledge that all SHG research constitutes *forward-looking scenarios*, not guarantees of future states.  

  **2. Core Methodology**  
  2.1 **Structural-Demographic Framework**: SHG models societal instability via three interdependent vectors:  
  - **Labor Supply Pressures (LSP)**: Real wage suppression driven by population growth exceeding productive capacity.  
  - **Elite Overproduction (EO)**: Expansion of credentialed/wealthy cohorts competing for fixed high-status positions (governmental, corporate, institutional).  
  - **Fiscal State Strain (FSS)**: Declining state revenue relative to expenditure amid rising elite demands and popular immiseration.  

  2.2 **Composite Index Construction**:  
  - The GSI synthesizes LSP, EO, and FSS into a 0-100 score via proprietary algorithms. Input data includes: wage/productivity ratios, educational attainment versus leadership role availability, tax buoyancy metrics, and demographic age structures.  
  - **Solidity Proxy ("Asabiyyah Coefficient")**: SDT posits that collective solidarity ("asabiyyah") mitigates structural stress. SHG estimates this non-quantifiable variable using: (i) social trust surveys, (ii) linguistic analysis of patriotic rhetoric in state/media discourse, and (iii) enlistment/volunteerism rates. *Clients are cautioned that this proxy lacks empirical validation and may not capture nonlinear shifts in social cohesion.*  

  **3. Ratings Definitions**  
  SHG assigns the following stability ratings to sovereign entities:  

  | Rating | Definition |  
  |--------|------------|  
  | AAA    | **Robust Resilience**: Structural imbalances absent; high solidarity. Forecast: Minimal instability risk (0-10 GSI). |  
  | BBB    | **Moderate Stress**: Early-stage LSP/EO/FSS observed. Forecast: Manageable instability (11-40 GSI). |  
  | CCC    | **Advanced Fragmentation**: EO-driven intra-elite competition; falling real wages; fiscal deterioration. Forecast: High instability risk (41-70 GSI). |  
  | DDD    | **Crisis Imminent**: State incapacity; mass mobilization potential. Forecast: Revolutionary/state failure probability >50% (71-100 GSI). |  

  **4. Track Record & Non-Reliance**  
  4.1 SHG’s "2010 Decadal Instability Forecast" (published Q1 2010) projected rising global instability (2010-2020) based on EO/FSS convergence. Subsequent events (e.g., heightened civil unrest, institutional distrust, fiscal crises in multiple rated polities) were consistent with this outlook.  
  4.2 *Clients may not rely upon this or any forecast as validation of SHG’s methodology:*  
  - Forecasts address *structural tendencies*, not specific events, timelines, or magnitudes.  
  - A "correct" forecast indicates consistency with SDT’s *qualitative* predictions (e.g., "rising instability"), not predictive precision.  
  - No forecast can be falsified within a human lifespan due to generational-scale resolution.  

  **5. Model Limitations & Calibration**  
  5.1 **Historical Calibration Sample**: SHG’s SDT parameters are derived from 12 preindustrial agrarian states (e.g., Roman Empire, Ming Dynasty, Bourbon France) and one industrial society (the Client’s own polity, anonymized). *This limited sample cannot statistically validate model robustness across all socioeconomic systems.*  
  5.2 **Technological Exogeneity**: SDT does not natively model technological shocks (e.g., AI-driven productivity leaps) that may disrupt wage/population dynamics. SHG applies ad hoc adjustments; efficacy is unproven.  
  5.3 **Index Weighting Subjectivity**: GSI component weights (LSP 40%, EO 40%, FSS 20%) reflect SHG’s theoretical priors, not empirical optimization. Competing SDT scholars propose divergent weightings.  

  **6. Conflicts of Interest**  
  6.1 SHG provides advisory services to institutional investors, sovereign wealth funds, and government agencies. Clients with opposing interests may receive identical research.  
  6.2 SHG may trade securities/futures based on its own research ahead of client dissemination, per SEC Rule 10b5-1 compliance.  
  6.3 Fees from government clients exceed 25% of SHG revenue. Such clients may receive supplemental analysis contesting GSI implications for their jurisdictions.  

  **7. Organizational Risk Factors**  
  7.1 **Personnel Structure**: SHG employs 42 Senior Fellows (Ph.D.-level analysts) competing for 8 Partner roles. *This constitutes textbook Elite Overproduction per SDT, potentially incentivizing intra-firm fragmentation and research bias.*  
  7.2 **Data Sourcing**: 65% of input data derives from third-party providers (e.g., statistical agencies, NGOs). SHG does not audit primary sources and assumes no liability for data inaccuracy.  

  **8. Composite Index Risks**  
  8.1 **Hysteresis Effects**: GSI scores may remain elevated for decades without observable instability ("contained stress") or collapse without warning ("black swan mobilization").  
  8.2 **Solidity Proxy Flaws**: Asabiyyah estimation relies on culturally specific metrics (e.g., "patriotic rhetoric" in state-controlled media). Declining volunteerism may reflect secular individualism, not falling solidarity.  

  **9. Forward-Looking Statement Disclaimer**  
  SHG research constitutes speculative scenario analysis based on a contested sociological theory. Clients agree that:  
  - No historical analogy guarantees future outcomes.  
  - "Secular cycles" exceeding 50 years cannot be observed in real-time.  
  - SHG accepts no liability for investment, policy, or security decisions influenced by its reports.  
  - GSI ratings are ordinal rankings (AAA least unstable, DDD most unstable), not probabilities or timelines.  

  **10. General Disclaimer of Warranty**  
  THE GSI MODEL AND ASSOCIATED FORECASTS ARE PROVIDED "AS IS." SHG EXPLICITLY DISCLAIMS: (A) FITNESS FOR ANY PARTICULAR PURPOSE; (B) ACCURACY BEYOND THE HISTORICAL PERIODS CALIBRATED; (C) APPLICABILITY TO SOCIETIES UNDERGOING DIGITAL/BIOTECHNOLOGICAL TRANSFORMATION; AND (D) UTILITY FOR TRADING TIMEFRAMES UNDER 10 YEARS. PAST STRUCTURAL CONSISTENCY (SECTION 4.1) IMPLIES NO FUTURE PREDICTIVE VALUE.  

  **11. Acceptance of Terms**  
  Accessing SHG research denotes acceptance of these disclosures. Clients confirm they: (i) are Accredited Investors or equivalent; (ii) possess independent SDT expertise; (iii) waive rights to rely on SHG outputs absent separate written guarantee.  

  ---  
