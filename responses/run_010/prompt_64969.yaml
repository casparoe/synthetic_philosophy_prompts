prompt: |-
  Last spring the board of the community foundation where I serve on the allocation committee wrote one sentence into our grantmaking policy: where two programs are comparable in cost per outcome, priority goes to the one serving people who are worse off. It has since become obvious that the sentence decides nothing. Each year we divide roughly fourteen million dollars between services for people at the very bottom — rough sleepers with no benefits and complex needs — and services for households that are poor but one shock from ruin, and several allocations now hinge entirely on how "worse off" gets spelled out.

  Before we commission outside advice, I want a defended agenda rather than a survey. Rank exactly five open questions in the philosophy of priority and equality by how much their resolution would change where our money goes. Take the candidates from wherever the leverage actually is — whether wellbeing has a fixed zero point and unit we could write a weighting function against, whether priority should be applied before or after a program's risks are resolved, what the leveling-down objection really disposes of and whether our policy needs equality at all, whether to prioritize those badly off overall or badly off in one respect, what happens above a sufficiency threshold — and add ones I have not thought of if they rank higher. For each, say what turns on it in a portfolio like ours, and mark whether it is settled among people who work on it or genuinely contested; I would rather see the disagreement flagged than have one side handed to me as consensus.

  Format: five numbered items of one or two sentences each, with no introduction and no conclusion.
reasoning: |-
  Okay, the user serves on an allocation committee for a community foundation that distributes about $14 million annually. They have a policy stating that when two programs have comparable costs per outcome, priority should go to the one serving people who are "worse off." However, this hasn't resolved debates between funding services for the absolute worst-off (like homeless individuals with complex needs) versus the vulnerable poor (households one shock away from ruin). The user wants five key philosophical questions ranked by how much their resolution would impact funding decisions.

  Hmm, I need to identify the philosophical questions that would most practically affect their allocations. The user mentioned several candidates: whether wellbeing has a fixed zero point, whether to apply priority before or after risk resolution, how to handle the leveling-down objection, whether to prioritize overall wellbeing or specific disadvantages, and what happens above sufficiency thresholds. But I should also consider if there are higher-leverage questions they haven't thought of.

  First, I recall that in prioritarianism, the biggest debates often center around scope restrictions. The user's dilemma between the deeply destitute and the vulnerable poor suggests that defining the cutoff for "worse off" is critical. If priority only applies below absolute deprivation, that favors rough sleepers; if it includes vulnerability, that helps the near-poor. This seems like the top question because it directly shapes who qualifies for priority.

  Next, the aggregation method matters a lot. If we use additive prioritarianism, helping many moderately worse-off people might outweigh helping fewer severely worse-off people. But if we use leximin or a threshold approach, the most desperate cases always win. Given their large funding pool, this could swing millions toward either group. Philosophers are still divided on this, so it's genuinely contested.

  Third, the temporal dimension is tricky. Should we prioritize those currently suffering or those facing lifelong disadvantage? For their homeless population (often chronically deprived) versus vulnerable households (who might rebound faster), this question could tip scales. The literature hasn't settled this—capability theorists like Sen argue for lifetime metrics, while others focus on present states.

  Fourth, risk handling is practical. If we apply priority before considering program risks, a high-risk program for the worst-off might get funded even if likely to fail. If after, we'd favor safer bets for the vulnerable poor. Given that complex-needs programs often have uncertain outcomes, this affects real choices. Philosophers like Otsuka debate this, so it's unresolved.

  Finally, the zero point question is foundational but maybe less decisive. If wellbeing is cardinal, we can quantify "how much worse off" someone is; if ordinal, we only rank groups. But since their policy already compares cost per outcome (implying some quantification), this might not change allocations as dramatically as the other questions. Still, it's contested in welfare economics.

  I'll rank them in this order: scope first (it defines eligibility), then aggregation (it determines trade-offs), temporality (it affects targeting), risk sequencing (it influences program selection), and zero point (it's more theoretical). For each, I'll note the practical impact and whether philosophers agree. The user wants no fluff—just five crisp items with disagreements highlighted. Got it.
answer: |-
  1.  **Scope of "Worse Off": Does priority apply only below an absolute deprivation threshold (e.g., unsheltered homelessness), or extend to relative disadvantage and vulnerability (e.g., one shock from ruin)?** This directly defines the eligible population: resolving it dictates whether funds favor the very bottom or include the vulnerable poor, fundamentally shifting portfolio allocations. (Genuinely contested: e.g., sufficientarians vs. broader prioritarian views).
  2.  **Aggregation within Priority: When helping a larger group moderately worse off competes with helping a smaller group severely worse off (e.g., preventing many near-poor evictions vs. intensive support for fewer complex-needs rough sleepers), how are benefits aggregated under priority?** This determines if scale can outweigh severity, critically impacting resource distribution between your two core groups. (Genuinely contested: e.g., additive prioritarianism vs. leximin/threshold views).
  3.  **Temporal Frame: Is "worse off" assessed solely by current state, or does lifetime disadvantage (past hardship, future prospects) also confer priority?** Prioritizing chronic rough sleepers with low recovery prospects vs. vulnerable households facing severe but potentially temporary hardship hinges on this. (Genuinely contested: focus on current welfare vs. capabilities/lifetime disadvantage).
  4.  **Priority under Risk: Does priority apply to expected outcomes before program risks resolve, or only to the final outcomes actually achieved?** This decides whether high-risk/high-reward programs for the very worst off (e.g., complex needs interventions) get funded over lower-risk programs for the vulnerable poor with more certain outcomes. (Genuinely contested: ex-ante vs. ex-post prioritarianism debates).
  5.  **Cardinality and Zero Point: Can wellbeing levels and differences be measured cardinally with a meaningful zero point, or is priority based only on ordinal rankings?** Without cardinal measurement, precise weighting (how much worse?) is impossible, reducing priority to a coarse tiebreaker; cardinality enables nuanced weighting functions favoring the very bottom. (Genuinely contested: welfare economists often assume cardinality; philosophers debate its coherence).
