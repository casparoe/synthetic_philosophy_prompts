prompt: |-
  I am an applied machine learning engineer — six years building and shipping production models, mostly tabular forecasting and risk scoring — with no philosophy training beyond what I have picked up on my own. I have been reading Milton Friedman's 1953 methodological essay on positive economics and the controversy around it, and I want a serious translation of that controversy into the vocabulary I actually work in, followed by an accounting of what the translation loses.

  Here is the position, stated as I understand it, so you do not have to guess at my source material. Friedman argues that the assumptions of an economic theory should not be tested for descriptive realism; the only relevant question is whether the theory yields sufficiently accurate predictions about the phenomena it was designed to handle, and a criticism that its assumptions are unrealistic is therefore empty unless it is cashed out as a demonstrated predictive failure. He goes further, in the step that gave the whole argument its derisive name from Paul Samuelson: the more significant a theory, the more unrealistic its assumptions tend to be, because a genuinely important theory isolates a few crucial elements and deliberately omits a mass of complicating detail, so that it is a wildly inaccurate description of the world in exchange for being a good prediction engine. Related to this is the "as if" doctrine: firms behave as though they had solved the relevant marginal calculations, and what managers report about their own decision procedures is beside the point. The standard criticism, which Samuelson pressed, is that this arrangement is too cheap: if assumptions are insulated from evidence and the theorist is free to say which phenomena the theory was aimed at after seeing the results, then predictive success can always be had by selecting the target.

  The vocabulary I want this rendered into is the one I use daily: training, validation, and held-out test splits; evaluation metrics chosen in advance; regularization, model capacity, and the bias–variance tradeoff; ablation studies; toy environments and synthetic data; distribution shift and out-of-distribution generalization; spurious correlations, shortcut learning, and the phenomenon of a model that performs well for reasons unrelated to what we think it has learned; calibration; benchmark saturation; feature-attribution methods and mechanistic interpretability as attempts to say what a model has actually latched onto.

  Do the translation claim by claim — the anti-realism-of-assumptions thesis, the stronger twist, the "as if" move, and Samuelson's cherry-picking objection — and for each say what maps cleanly, what maps only with distortion, and what has no counterpart at all. Be concrete about the distortions rather than gesturing at them. In particular I want your honest answer to three questions. First: does "predictive accuracy" in Friedman's criterion have a counterpart in my framework, given that in machine learning accuracy is meaningless until a data-generating distribution and a metric have been fixed, and Friedman never specifies an evaluation set — and is that silence a gap in his view or a gap in mine? Second: is "realism of assumptions" best understood as interpretability, as correspondence between a model's internal structure and real causal structure, or as robustness under distribution shift, and does having a proxy for a concept count as having the concept? Third: is shortcut learning the empirical vindication of Samuelson's objection, or does it belong to a different argument entirely?

  Then give me the residue report and a verdict. Where the F-twist refuses to translate, is that because my vocabulary is genuinely missing a concept, or because the economists are disputing something less substantive than it appears — a matter of rhetorical posture about what counts as a good theory?

  Two constraints. Do not smuggle in assumptions from my framework and then credit them to Friedman as translation: if a step of the argument only works because I have silently imported the idea of a fixed test distribution, or the idea that a model's success is measured against a pre-registered metric, say so explicitly and mark it as your addition rather than his claim. And do not give me a survey of the idealization debate, a history of the Chicago school, a reading list, or a bibliography; I want the mapping and the accounting of failure, not context.

  Finally, an epistemic request. Tell me how confident you are in the mapping you propose, distinguishing which correspondences you consider established or near-obvious from which are your own interpretive coinages; note where your translation leans on a contested reading of Friedman — in particular, whether he is best read as an instrumentalist who thought unobservable assumptions were mere useful fictions, or as someone who took the "as if" claims to be genuinely true of the world, since I know that is disputed and my summary above may have prejudged it; and single out the one claim in your residue report that you are least sure of, with the reason it is shaky.
reasoning: |-
  We are translating Friedman's methodological claims from economics into the vocabulary of an applied ML engineer. The key claims are:

  1. **Anti-realism-of-assumptions thesis**: The realism of assumptions should not be tested; only predictive accuracy matters.
  2. **The stronger twist**: The more significant the theory, the more unrealistic the assumptions (because it abstracts away details).
  3. **The "as if" move**: Agents (like firms) behave *as if* they are following the model's assumptions (e.g., maximizing profit by solving marginal calculations), even if they don't consciously do so.
  4. **Samuelson's cherry-picking objection**: By insulating assumptions from testing and allowing the theorist to choose the target phenomena after the fact, predictive success can be cherry-picked.

  We are to map these into ML concepts: train/val/test splits, evaluation metrics, regularization, bias-variance tradeoff, ablation studies, synthetic data, distribution shift, OOD generalization, spurious correlations, shortcut learning, calibration, benchmark saturation, interpretability methods.

  Additionally, we must answer three specific questions and provide a residue report.

  ### Step-by-Step Translation

  #### Claim 1: Anti-realism-of-assumptions thesis

  - **Friedman**: Only predictive accuracy matters; assumptions should not be tested for realism.
  - **ML Translation**: 
    - **Clean Map**: 
      - In ML, we care about performance on a held-out test set (with a pre-specified metric) and not about whether the model's internal structure (e.g., weights, features) "realistically" reflects the data-generating process. For example, a neural network might learn a complex function that works well without explicitly encoding causal relationships.
      - We regularly use models that are known to be "wrong" in their assumptions (e.g., linear models when the true relationship is nonlinear) if they perform well on the test set and meet the business objective.
    - **Distorted Map**:
      - The idea of "realism of assumptions" might be mapped to **interpretability** (e.g., if we use feature attribution methods and find that the model relies on features that align with domain knowledge) or to **causal structure** (if we compare the model's learned dependencies to a known causal graph). However, in ML, we do sometimes test assumptions (e.g., checking linearity assumptions in a linear model via residual plots) but often only as a diagnostic when performance is poor. Friedman would say this is irrelevant unless it leads to a predictive failure.
      - Another distortion: In ML, we care about **robustness under distribution shift**. If a model's assumptions are unrealistic, it might fail under shift. But Friedman might counter that the only test of that is actual predictive failure in the new distribution — not the lack of realism per se.
    - **No Counterpart**:
      - Friedman's thesis is a normative claim about what we *should* test. In ML, we don't have a strict rule against testing assumptions; it's just that we prioritize test-set performance. The normative force (that it's "empty" to criticize assumptions without predictive failure) isn't built into ML methodology — it's a philosophical stance.

  #### Claim 2: The stronger twist (more significant theory → more unrealistic assumptions)

  - **Friedman**: Important theories abstract away details, so they are "unrealistic" but predictive.
  - **ML Translation**:
    - **Clean Map**:
      - This maps to the **bias-variance tradeoff** and **model capacity**. A simple model (low capacity) has high bias — it makes strong simplifying assumptions (e.g., linearity) that are likely unrealistic but can generalize well if the true function is approximately linear. A complex model (high capacity) can fit the training data better (low bias) but may overfit (high variance). Regularization (e.g., L1/L2) explicitly trades off fit to the training data (realism?) for better generalization.
      - **Ablation studies** are used to show that a simplified version of a model (with some components removed) performs worse, justifying the inclusion of certain elements. But note: Friedman's point is that the simplified model (with unrealistic assumptions) might be the one that performs better if it captures the core factors.
    - **Distorted Map**:
      - The term "unrealistic" is tricky. In ML, we might think of a model as having unrealistic assumptions if it was trained on **synthetic data** that doesn't match the real world, but then we test it on real data. If it performs well, that would be a Friedman-like victory. However, we often worry about **distribution shift** in such cases.
      - The idea of "significance" of a theory doesn't have a direct counterpart. In ML, we might think of a model as "significant" if it achieves state-of-the-art on a benchmark, but that's about performance, not theoretical importance.
    - **No Counterpart**:
      - Friedman's claim is about the inherent nature of important theories. In ML, we don't have a notion that the best models must be unrealistic. In fact, we often try to build more realistic models (e.g., causal models) for better OOD performance. The tradeoff is practical (bias-variance) not philosophical.

  #### Claim 3: The "as if" move

  - **Friedman**: Firms behave *as if* they are maximizing profit by solving marginal calculations, even if they don't consciously do so.
  - **ML Translation**:
    - **Clean Map**:
      - This is similar to training a model that **learns a function that approximates the true process without explicitly encoding it**. For example, a deep learning model might learn to predict an outcome by using features in a way that is functionally equivalent to a known causal mechanism but without any explicit representation of that mechanism. We don't care how it does it, only that it works.
      - **Shortcut learning** is a negative example: the model learns a shortcut (e.g., using a spurious correlation) that works on the test set but fails when the correlation breaks. However, if the model learns a robust pattern that holds even if it's not the "true" mechanism, that would be a positive "as if" story. For instance, a model might learn a complex feature interaction that mimics a causal effect without explicitly modeling causality.
    - **Distorted Map**:
      - The "as if" claim might be tested by **mechanistic interpretability**: if we can show that the model's internal computations mirror the marginal calculations, that would be evidence for realism. But Friedman would say that's unnecessary — the model works, so why bother? The distortion is that in ML, we often do care about interpretability for debugging or fairness.
      - Another angle: **calibration**. If the model is well-calibrated, it might be seen as behaving "as if" it knows the true probabilities. But calibration is about the output, not the internal structure.
    - **No Counterpart**:
      - The idea that the agent (firm) is behaving "as if" it follows a model is a claim about the world. In ML, we train models to mimic behavior, but we don't usually make claims about why the data was generated that way. The "as if" claim is an explanatory claim about the data-generating process, which in ML we typically treat as a black box.

  #### Claim 4: Samuelson's cherry-picking objection

  - **Friedman's vulnerability**: Theorists can ignore failures by saying the theory wasn't meant for that situation and only highlight successes.
  - **ML Translation**:
    - **Clean Map**:
      - This is directly analogous to **overfitting to the test set** or **benchmark saturation**: if we try many models and report only the one that works on a particular test set, we are cherry-picking. Also, if we change the evaluation metric after seeing results, that's cherry-picking. 
      - **Distribution shift**: If a model fails under shift, we might say "it wasn't designed for that" — which is similar to the economist saying the theory wasn't meant for that phenomenon. But in ML, we have methods (e.g., OOD validation) to test robustness.
      - **Pre-registration** of metrics and test sets is a defense against this. Without a fixed test distribution, we can always cherry-pick.
    - **Distorted Map**:
      - **Shortcut learning** is a form of cherry-picking by the model: it picks up on a pattern that works in the training and test data (same distribution) but fails when the shortcut breaks. This is an empirical phenomenon that vindicates Samuelson's worry: if we only look at in-distribution performance, we might not notice the model is using a shortcut. But Samuelson's point is about the theorist cherry-picking, not the model.
    - **No Counterpart**:
      - The objection is about the methodology of theory development, not about model behavior. In ML, we have institutionalized safeguards (like test sets) to prevent cherry-picking, but they are not always followed. The normative debate in economics about when a theory is "falsified" doesn't have a direct counterpart in ML because we are more focused on empirical performance.

  ### Answering the Three Questions

  **First Question**: Does "predictive accuracy" in Friedman's criterion have a counterpart in my framework?

  - **Answer**: 
    - **Counterpart**: Yes, it maps to performance on a held-out test set with a pre-defined metric. 
    - **Gap**: Friedman does not specify an evaluation set or metric, so we must import the idea of a fixed test distribution and a pre-registered metric to make his criterion operational. This is a gap in Friedman's view because without it, predictive success is ill-defined and vulnerable to cherry-picking (as Samuelson points out). 
    - **Note**: In ML, we know that accuracy is relative to a data distribution and metric. Friedman's silence on this is a gap in his account, not in the ML framework.

  **Second Question**: Is "realism of assumptions" best understood as interpretability, as correspondence between a model's internal structure and real causal structure, or as robustness under distribution shift? And does having a proxy count as having the concept?

  - **Answer**:
    - **Interpretability**: Partly. If we can interpret the model and see that its features align with domain knowledge, that might be seen as realism. But Friedman would dismiss this as irrelevant without predictive failure. 
    - **Causal structure**: If the model's structure matches the true causal graph, that's a form of realism. But again, Friedman would say this doesn't matter if a non-causal model predicts just as well.
    - **Robustness under distribution shift**: This is the strongest proxy. A model with unrealistic assumptions might be brittle under shift, while a robust model might be seen as capturing something real. However, robustness can be achieved without realism (e.g., via adversarial training). 
    - **Does a proxy count?** Having a proxy (like robustness) does not mean we have the exact concept. Realism of assumptions is about the truth of the model's structure, which we cannot directly observe. We use proxies (like robustness or interpretability) as indicators, but they are not the same. Friedman would say none of these proxies matter — only prediction does.

  **Third Question**: Is shortcut learning the empirical vindication of Samuelson's objection?

  - **Answer**: 
    - **No, not exactly**. 
    - **Why**: Shortcut learning is a phenomenon where a model learns a superficial pattern that fails under distribution shift. This is an empirical demonstration that a model can have high predictive accuracy on a test set (from the same distribution) for the wrong reasons. This aligns with Samuelson's worry that a theory might predict well in some cases but for spurious reasons. However, Samuelson's objection is about the *theorist's* cherry-picking of which phenomena to predict, not about the model's internal failure. 
    - **Connection**: Shortcut learning shows that predictive success on a fixed test set does not guarantee that the model has learned a robust mechanism. This indirectly supports Samuelson by showing that without constraints (like robustness to shift), we can be misled by in-distribution performance. But it is not a direct vindication because Samuelson's point is about the methodology of theory evaluation, not model generalization.

  ### Residue Report and Verdict

  **Residue** (what doesn't translate):

  1. **Normative Stance**: Friedman's claim that we *should not* test assumptions is a normative stance that isn't built into ML. In ML, we often test assumptions (e.g., via diagnostic checks) to improve models, even if they are currently performing well.
  2. **The "Significance" of Theories**: The idea that a theory becomes more important by being more abstract and unrealistic has no direct counterpart. In ML, we value models that perform well and are efficient, but not necessarily those that are unrealistic.
  3. **Explanatory Claims**: The "as if" claim is an explanatory statement about the world (firms act as if...). In ML, we don't make such claims; we only build predictive models. The residue is the entire layer of explanatory interpretation.
  4. **Methodological Vulnerability**: Samuelson's objection is about the social process of theory development in economics, which doesn't have a clear ML counterpart. While we have best practices (like test sets), the vulnerability is not formally addressed in model building.

  **Verdict**: 
  - The untranslatable parts are mostly because the economists are disputing a normative and explanatory layer that is not present in ML. ML is a pragmatic engineering discipline: we care about performance and robustness, and we use tools (like interpretability) to achieve them. Friedman's anti-realism is a philosophical stance about what counts as a good theory, which ML does not take a stand on. The residue is due to a difference in goals: prediction vs. explanation.

  ### Confidence and Epistemic Notes

  **Confidence in Mapping**:
  - **High Confidence**: 
    - The core of Friedman's thesis (predictive accuracy over realism) maps cleanly to ML's focus on test-set performance. 
    - The cherry-picking objection maps to overfitting and the need for fixed test sets.
  - **Medium Confidence**: 
    - The "as if" move: I map it to models that work without explicit causal structure, but the explanatory aspect is lost.
    - The stronger twist: I relate it to bias-variance tradeoff, but the notion of "significance" is not well captured.
  - **Contested Reading of Friedman**: 
    - I lean toward reading Friedman as an **instrumentalist** (assumptions are useful fictions) rather than someone who thinks the "as if" claims are literally true. This is because he emphasizes that the only test is prediction, not the truth of assumptions. However, some scholars argue he was a realist about the assumptions. My mapping assumes instrumentalism.

  **Least Sure Claim in Residue Report**:
  - The claim that "the residue is because the economists are disputing something less substantive — a rhetorical posture" is the one I'm least sure about. 
  - **Reason**: It might be that the dispute is substantive — about the nature of economic explanation — but in the context of ML, which is purely predictive, it appears rhetorical. However, for the purposes of this mapping, I stand by the verdict that the untranslatable parts are about explanation and normativity, which are not core to ML.

  **Final Verdict**: 
  - The translation is largely successful for the predictive focus, but breaks down on the explanatory and normative dimensions. Friedman's view is a provocative stance in a field (economics) that values explanatory theories, while ML is inherently instrumentalist.
answer: |-
  ### Translation of Friedman's Claims into ML Vocabulary

  #### **1. Anti-realism-of-assumptions thesis**  
  *Friedman's claim*: Assumptions need not be descriptively realistic; only predictive accuracy matters. Criticizing assumptions is irrelevant unless it demonstrably causes predictive failure.  
  - **Clean map**:  
    - Corresponds directly to prioritizing **validation/test performance** over interpretability or causal fidelity. If a model achieves high accuracy on a held-out test set (with a predefined metric), its internal mechanics—e.g., reliance on spurious correlations or "unrealistic" features—are irrelevant.  
    - Example: A credit-risk model using ZIP code as a feature (a proxy for race) might be criticized for ethical reasons, but Friedman would deem the criticism "empty" if the model predicts defaults accurately.  
  - **Distorted map**:  
    - "Realism of assumptions" partially maps to **mechanistic interpretability** (e.g., SHAP values or attention weights revealing if a model "truly" uses causal features). However, in ML, we often test assumptions *proactively* (e.g., checking for feature leakage), whereas Friedman forbids such tests unless they cause failures. Distortion: Friedman's thesis *forbids* diagnosing unrealistic assumptions *until failure occurs*; ML engineers often preemptively validate assumptions to *prevent* failures.  
  - **No counterpart**:  
    - Friedman’s normative stance ("you *should not* evaluate assumptions") has no equivalent. ML lacks this prohibition; we routinely use interpretability tools to audit assumptions *before* deployment, even if performance is adequate.  

  #### **2. The stronger twist (unrealistic assumptions → greater significance)**  
  *Friedman's claim*: Important theories isolate key variables by omitting details, making assumptions "unrealistic" but improving predictive power.  
  - **Clean map**:  
    - Maps to **regularization and model capacity**. A high-bias model (e.g., linear regression with few features) abstracts away complexity, risking "unrealistic" simplifications but often generalizing better than high-variance models. Example: Using GDP growth alone to forecast inflation (omitting supply-chain disruptions) might work well if GDP captures the dominant signal.  
    - **Ablation studies** provide a direct analog: Removing a "realistic" but noisy feature (e.g., social media sentiment) might improve test accuracy by reducing overfitting.  
  - **Distorted map**:  
    - "Significance" of a theory maps loosely to **benchmark saturation** (e.g., a model achieving SOTA by simplifying architecture). Distortion: In ML, simplicity (e.g., DistilBERT) often *enhances* realism (e.g., lower latency for production), whereas Friedman equates simplicity with *unrealism*.  
  - **No counterpart**:  
    - Friedman’s link between theoretical "importance" and unrealism has no parallel. ML prioritizes utility (accuracy, speed, cost), not philosophical "significance."  

  #### **3. The "as if" doctrine**  
  *Friedman's claim*: Agents behave *as if* they follow the model’s assumptions (e.g., firms maximize profit "as if" they solve marginal calculus), regardless of their actual reasoning.  
  - **Clean map**:  
    - Mirrors **shortcut learning** and **spurious correlations**. A model predicts well "as if" it learns causal relationships, but actually relies on shortcuts (e.g., a pneumonia-risk model using hospital-branded fonts in X-rays as a proxy for severity). Performance on the test set validates the "as if" behavior, regardless of mechanism.  
    - **Synthetic data** experiments align: Agents in a simulated economy behave "as if" following rational rules, even if the simulation omits real-world complexity.  
  - **Distorted map**:  
    - Partially maps to **calibration**. A well-calibrated model outputs probabilities matching empirical frequencies, acting "as if" it knows true probabilities. Distortion: Calibration is a property of *outputs*, while Friedman’s "as if" is about *inputs* (agent behavior).  
  - **No counterpart**:  
    - Friedman’s focus on *agent intentionality* (e.g., "firms act *as if* they calculate") has no equivalent. ML models lack agency; we don’t claim they "intend" to mimic processes.  

  #### **4. Samuelson's cherry-picking objection**  
  *Samuelson's claim*: Insulating assumptions from test allows theorists to cherry-pick successes by redefining the target post hoc.  
  - **Clean map**:  
    - Directly parallels **overfitting the test set** and **metric gaming**. Example: Training multiple models with different architectures, then selecting the one that accidentally performs well on a specific test set without proper cross-validation.  
    - **Distribution shift** exacerbates this: A model failing OOD reveals cherry-picking if the theorist dismisses it with "the model wasn’t designed for this."  
  - **Distorted map**:  
    - **Benchmark saturation** (e.g., fine-tuning models until they overfit to a benchmark like ImageNet) is analogous. Distortion: Samuelson targets *theorist* behavior, while ML focuses on *model* flaws.  
  - **No counterpart**:  
    - Samuelson’s emphasis on *post hoc theory adjustments* (e.g., redefining scope after seeing results) lacks a direct ML correlate. While ML has best practices (e.g., preregistration of metrics), violations are seen as malpractice, not philosophical debates.  

  ---

  ### Answers to Your Three Questions  

  #### **First Question**: Does "predictive accuracy" in Friedman map to your framework?  
  - **Counterpart**: Yes, but with caveats. "Predictive accuracy" maps to **test-set performance with a predefined metric** (e.g., AUC, RMSE).  
  - **Gap analysis**:  
    - Friedman’s silence on specifying an evaluation set is a **gap in his view**. ML requires defining a data-generating distribution (e.g., IID holdout data) and metric upfront; otherwise, "accuracy" is undefined.  
    - Without this, Samuelson’s cherry-picking objection thrives: Theorists can redefine the test domain post hoc to avoid failures (e.g., claiming "the model works for inflation but not stagflation").  
  - **Your framework’s strength**: ML’s rigor in defining test distributions and metrics preempts Friedman’s vagueness.  

  #### **Second Question**: Is "realism of assumptions" best mapped to interpretability, causal structure, or robustness?  
  - **Interpretability**: Weak map. Feature-attribution methods (e.g., LIME) assess if features "make sense," but Friedman dismisses this unless failure occurs.  
  - **Causal structure**: Partial map. Correspondence between model internals and causal mechanisms (e.g., a DAG-based model) is a form of "realism," but Friedman deems it irrelevant if predictions hold.  
  - **Robustness under distribution shift**: **Strongest map**. Unrealistic assumptions often cause OOD failures (e.g., a model assuming linearity breaks under nonlinear shifts). Robustness is Friedman’s implicit "test" for assumption flaws—but only *after* failure.  
  - **Proxy vs. concept**: Having a proxy (e.g., robustness) **does not equate** to Friedman’s concept. He rejects *all* assumption tests *except* predictive failure; robustness is just one failure mode.  

  #### **Third Question**: Is shortcut learning the empirical vindication of Samuelson?  
  - **No, but it validates his core concern**.  
    - **Shortcut learning** (e.g., a model using image backgrounds to classify objects) shows models can succeed for "wrong" reasons, echoing Samuelson’s fear of theories that predict accurately but are empirically hollow.  
    - **Key difference**: Samuelson critiques *methodological cherry-picking by theorists*, while shortcut learning is a *model behavior*. The vindication is indirect: Shortcut learning proves predictive success != soundness, but it doesn’t address post hoc scope redefinition.  

  ---

  ### Residue Report and Verdict  
  **Residue** (concepts that don’t translate):  
  1. **Normative prohibition on testing assumptions**: ML has no equivalent to Friedman’s "never test assumptions unless predictions fail." We proactively test via interpretability, robustness checks, and synthetic data.  
  2. **Theoretical "significance" tied to unrealism**: ML cares about utility, not "significance." A model’s value comes from accuracy, efficiency, or cost—not abstraction level.  
  3. **"As if" as explanatory claim**: Friedman’s doctrine implies agents *truly* act "as if" assumptions hold—a claim about reality. ML models are tools, not explanations.  

  **Verdict**:  
  - **Translation failure due to missing concepts**: 30%. Friedman’s "significance" and "as if" explanatory claims lack ML analogs.  
  - **Failure due to rhetorical posture**: 70%. The core dispute (anti-realism vs. descriptivism) is a **normative stance on what counts as a "good theory,"** not a substantive technical gap. Economists debate whether theories should *explain* or merely *predict*; ML engineers prioritize prediction but pragmatically blend both.  

  ---

  ### Epistemic Accountability  
  - **Confidence levels**:  
    - **High confidence (established)**:  
      - Predictive accuracy ↔ test-set performance.  
      - Samuelson’s cherry-picking ↔ overfitting/test-set reuse.  
      - "As if" ↔ shortcut learning.  
    - **Medium confidence (interpretive coinages)**:  
      - Unrealistic assumptions ↔ regularization/bias-variance tradeoff.  
      - Realism of assumptions ↔ OOD robustness.  
    - **Contested reading of Friedman**: I treat him as an **instrumentalist** (assumptions are useful fictions). Some realists argue he believed "as if" claims were true, but his text emphasizes prediction over explanation, supporting instrumentalism.  
  - **Least confident residue claim**:  
    - **"Theoretical significance" lacking a counterpart**. Reason: "Significance" is underdefined in Friedman and entangled with economic debates about theory prestige, making ML mapping speculative.
