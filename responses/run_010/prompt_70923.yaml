answer: |-
  ### DESC-RESOLVE API Documentation  
  **Version 2.4.1**  
  *Denoting Systems: Precision in Reference*  

  ---

  #### Overview  
  DESC-RESOLVE eliminates referential ambiguity by algorithmically resolving definite descriptions against user-supplied domains. By enforcing Russellian principles—where descriptions denote only when exactly one satisfier exists in the domain—the service eradicates ontological commitments to non-existent entities (e.g., subsisting round squares).  
  > **Legal Note**: Per Legal Directive 114.2, claims regarding "ontological commitment elimination" are deprecated in customer-facing materials. DESC-RESOLVE strictly processes logical descriptions; existential implications are user-managed.  

  Domains are mandatory. Unconstrained queries (e.g., `{"description": "the bottle"}`) resolve unpredictably due to ~1,800 satisfiers in global beverage databases. This design feature ensures context-dependence is explicit, version-controlled, and auditable.  

  ---

  #### Request Parameters  
  | Parameter      | Type   | Required | Description                                                                 |
  |----------------|--------|----------|-----------------------------------------------------------------------------|
  | `domain`       | array  | Yes      | Finite set of objects (max 10,000) to evaluate against.                     |
  | `description`  | string | Yes      | Definite description (e.g., "the author of *Waverley*").                    |
  | `scope`        | string | No       | `primary` (default) or `secondary`. Governs negation/quantifier interactions. |

  ---

  #### Response Schema  
  - **Success (HTTP 200)**:  
    ```json
    { "resolved": true, "entity": { /* unique satisfier object */ } }
    ```  
  - **Uniqueness Failure (HTTP 404)**:  
    ```json
    { 
      "resolved": false, 
      "reason": "NO_UNIQUE_SATISFIER", 
      "candidates": [ /* max 50 satisfiers */ ] 
    }
    ```  
  - **No Satisfiers (HTTP 404)**:  
    ```json
    { "resolved": false, "reason": "NO_SATISFIER" }
    ```  

  ---

  #### Use Cases & Warnings  
  ##### Identity Claims  
  Queries like `{"description": "the author of *Waverley*", ...}` resolve to `true` only if one entity in the domain satisfies "authored *Waverley*". Identity claims (e.g., "Scott is the author of *Waverley*") are evaluated as `(∃x)(∀y)((WaverleyAuthor(y) ↔ y=x) ∧ (x = Scott))`.  
  > **Support Ticket ROYAL-77**: Client queried whether "the novelist" wrote *Waverley*. System returned `true` with entity `{"name": "Walter Scott"}`. Client noted: "Result is informative, yet I remain perplexed as to how doubt was possible."  

  ##### Do-Not-Resolve Scenarios  
  Descriptions are flagged as non-resolvable if they:  
  1. **Have zero satisfiers** (e.g., "the perpetual motion machine"): Safe. Returns `false` but **never** implies existence.  
  2. **Are statistical aggregates** (e.g., "the average taxpayer"): Not designed to single out individuals.  
  3. **Suffer vagueness-induced uniqueness collisions** (e.g., "the tall man"): Resolves with `confidence_score` (range: 0.0–1.0) if one satisfier is marginally dominant.  

  ---

  #### Known Issues  
  ##### INC-1983 (Closed: Works as Intended)  
  *EventsCo* submitted:  
  ```json
  {  
    "domain": "PartyGuests",  
    "description": "the person holding a glass of water"  
  }  
  ```  
  System returned guest `{"id": "73", "drink": "Martini"}`—the only guest with H₂O in a *glass* (others used plastic). Client insisted they "meant the water-drinker."  
  > **Resolution**: DESC-RESOLVE honors the description, not speaker intention. Referential resolution mode (`ref_mode=1`) was deprecated in v1.2.  

  ##### PM-441 (Postmortem: Uniqueness Cap Collision)  
  *MunicipalDispatch* queried `"the vehicle near 5th & Main"` (domain: 55 vehicles). With 52 satisfiers, the response capped `candidates` at 50. A silent misresolution occurred when the 51st vehicle was the true emergency.  
  > **Mitigation**: Always restrict domain size. Log warnings when satisfiers >50.  

  ---

  #### Changelog  
  | Version | Date       | Change                                                                 | Status      |  
  |---------|------------|------------------------------------------------------------------------|-------------|  
  | 2.3     | 2023-11-20 | Experimental: Returned `null` for unresolved descriptions (truth-value gaps). | **Reverted** |  
  | 2.4     | 2024-01-15 | Reverted to `false` for unresolved cases. Gaps broke negative existentials (e.g., "The king of France is not bald" resolved incorrectly). | Permanent   |  

  ---

  © 2024 Denoting Systems. DESC-RESOLVE is a trademark of Denoting Systems.  
  *No entities were subsisted in the making of this service.*
