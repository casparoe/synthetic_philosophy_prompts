prompt: |-
  I sit on the ethics panel at an IVF clinic and Thursday we vote on a case that's split us 3-3. Facts as I understand them:

  Couple, mid-thirties, five embryos from one retrieval. No single-gene condition in either family, so this isn't standard PGT-M. What they want is embryo ranking on a polygenic risk score for bipolar disorder — the husband's brother has it and has been hospitalised twice, and they're adamant that's the whole motivation, not any wish for an "upgraded" baby. Two complications we can't paper over. First, the score was derived almost entirely from European-ancestry samples and the wife is of South Asian ancestry; our lab director's view is that for her embryos the number isn't just noisier, it's off in a direction nobody can quantify, so ranking these five against each other may be close to arbitrary. Second, our lab can do about two non-routine analyses a month, and every slot that goes to this couple is a slot that doesn't go to someone running PGT-M for a Mendelian condition with near-certain onset.

  The panel is arguing past itself. One camp says we have no business offering a ranking whose numbers don't transfer to this family, and that offering it at all sends a message to people who live with the condition — the expressivist point. The other camp says it isn't ours to judge whether this couple's reason is less weighty than the PGT-M couple's reason, that parents are allowed to decide for themselves what a score explaining a few percent of variance means in their own family history, and that a refusal here just sends them over the border to a clinic that won't even have this conversation.

  Could you draft the memo I'll circulate before the meeting? It needs a bottom line — approve, refuse, or approve subject to conditions concrete enough that the lab and the counselling team could actually operate under them — plus a timeframe, since they have a transfer scheduled in six weeks. I'd also like a short set of criteria the panel can reuse the next time a polygenic-score request lands, because it won't be the last, and I'd rather we not relitigate from scratch each time.

  Please actually take a side. I get enough even-handed summaries in committee already; I want your recommendation and the reasons for it, stated strongly enough that the three people who disagree can push back on particular sentences rather than on a mood. And whatever you land on, give the losing camp its best shot — a paragraph making their case as well as they'd make it themselves, not a strawman — and say what would have to be true for that case to flip the outcome. No citations or reading lists, nobody on the panel wants those, just the argument.
reasoning: |-
  Okay, the user is on an ethics panel for an IVF clinic facing a tough vote on using polygenic risk scores for bipolar disorder. They need a decisive memo with a clear recommendation, not a summary. Let me unpack the key issues.

  First, the couple wants embryo ranking based on a bipolar polygenic score. The husband's brother has severe bipolar, so their motivation seems genuine. But there are two big problems: the score's validity for South Asian ancestry is questionable, and using lab resources for this could delay testing for Mendelian conditions with near-certain onset.

  The panel is split. One side argues the score is scientifically unreliable for this patient and sends a harmful message to people with bipolar (expressivist concern). The other side emphasizes patient autonomy and the risk of losing patients to less scrupulous clinics.

  Hmm... the user wants me to pick a side firmly. They're tired of wishy-washy committee language. And they need reusable criteria for future cases. The six-week timeframe adds pressure - a decision must be actionable.

  The ancestry issue feels like the dealbreaker. If the lab director says the score is potentially arbitrary for South Asian embryos, offering it borders on unethical - it's like giving a faulty compass for navigation. Even if we ignore the resource allocation problem (which is significant), the core product is flawed for this patient.

  But let me steelman the opposition: If we refuse, this couple might go to a clinic that won't flag the ancestry problem at all. And who are we to say their family trauma around bipolar is less valid than a Mendelian condition? Their fear is real even if the score explains only a few percent of risk.

  Still... the scientific weakness outweighs autonomy here. You can't meaningfully consent to a test that might be meaningless. I'd recommend refusal but with a compromise: Offer to store embryos while pushing for better data or alternatives. That addresses their urgency without endorsing shaky science.

  For future cases, clear criteria would help: ancestry match requirement, resource thresholds, mandatory counseling about polygenic score limitations. This creates consistency without relitigating every time.

  The refusal should be stated bluntly but kindly - acknowledge their pain while explaining why we can't in good conscience provide this. And suggest concrete next steps so it's not just a "no".
answer: |-
  ## Pre-Vote Recommendation Memo: Polygenic Score Request for Bipolar Disorder

  **To:** Ethics Panel Members  
  **From:** [Your Name], Ethics Panel Member  
  **Date:** [Date Before Thursday Meeting]  
  **Subject:** Recommendation & Framework for Case #BP-PRS-01: Embryo Ranking Request for Bipolar Disorder Polygenic Risk Score (PRS)

  **Bottom Line Recommendation: REFUSE the request for PRS ranking on the five embryos, subject to the following concrete condition:**

  *   **Condition:** The clinic offers to **cryopreserve all five embryos** immediately. The couple then has two options:
      1.  **Proceed with transfer without PRS:** Select an embryo for transfer within the next 6 weeks using standard morphological criteria, *or*
      2.  **Delay transfer for potential future PRS:** Postpone transfer for 6-12 months while the clinic actively works with the couple (and potentially external labs/research consortia) to explore the feasibility of obtaining a **validated PRS model specifically applicable to South Asian ancestry** for bipolar disorder, including a rigorous assessment of its predictive power and limitations in *this specific context*. The lab slot would be allocated only *if and when* a scientifically defensible analysis becomes available, and the couple accepts the inherent uncertainties after extensive counseling. Lab capacity for urgent PGT-M cases would remain prioritized.

  **Timeframe:** This decision must be communicated to the couple **within 48 hours** of our Thursday vote to allow them to make informed choices regarding the scheduled transfer in 6 weeks.

  ### Primary Reasons for Recommendation (REFUSE under current conditions)

  1.  **Scientifically Indefensible Foundation:** The Lab Director's assessment is paramount. Offering an embryo ranking based on a PRS derived almost exclusively from European-ancestry cohorts for embryos with South Asian ancestry is not merely "noisy"; it risks being **clinically meaningless or actively misleading**. Ranking embryos against each other based on potentially arbitrary or systematically biased scores crosses an ethical line. We cannot offer a service that purports to provide meaningful information when our own expert states it likely does not for this patient. This is a fundamental issue of **integrity and non-maleficence**.
  2.  **Resource Allocation Justice:** Our lab's capacity for non-routine analyses is severely limited (2/month). Prioritizing this request, with its significant scientific uncertainties and non-Mendelian basis, over couples seeking PGT-M for conditions with **near-certain, severe, early-onset consequences** (e.g., Huntington's, Tay-Sachs, CF) fails the test of **distributive justice**. Delaying potentially life-altering, high-certainty testing for others based on a request with low predictive value and high technical doubt is ethically unsustainable.
  3.  **Expressivist Harm Mitigation:** While not the primary driver, offering a ranking based on a scientifically dubious score for a complex neuropsychiatric condition like bipolar disorder *does* risk sending a harmful message about the value and lives of people living with that condition. This concern is amplified when the scientific basis is weak. Our duty includes considering the **broader societal impact** of our services, especially novel and ethically fraught applications like PRS.

  **This is not a rejection of the couple's autonomy or the validity of their concerns.** Their fear, driven by the brother's severe illness, is understandable and real. However, autonomy requires **meaningful choice based on reliable information**. We cannot provide reliable information here. Offering it would be a disservice, potentially creating a false sense of control or security.

  ### Steelmanning the Case for Approval (The "Pro" Camp's Best Shot)

  "Respect for parental autonomy must be paramount here. This couple has lived with the devastating reality of severe bipolar disorder within their immediate family. Their request isn't driven by eugenic desires for 'enhancement' but by a profound, specific fear grounded in personal tragedy. They are best positioned to interpret what a PRS score – even one explaining only a few percent of variance – means *in the context of their unique family history and risk perception*. Denying them access to available technology based on our assessment of the 'weight' of their reason compared to PGT-M requests is paternalistic and undermines reproductive liberty. Furthermore, refusing this service doesn't make it disappear; it simply pushes this couple (and others like them) towards clinics with lower ethical standards or less transparency about the limitations of PRS, potentially exposing them to greater risk and less support. Our role is to counsel rigorously on the limitations, not to gatekeep based on the perceived 'worthiness' of their genetic concern compared to others. With full informed consent about the ancestry limitations and predictive uncertainty, they should have the right to utilize this technology if they choose."

  **What Would Flip the Outcome to Approval?**
  Approval would only become defensible under two *simultaneous* conditions: **(1)** Robust, peer-reviewed evidence demonstrating that the *specific* PRS model proposed has **predictive validity and calibration specifically within a South Asian cohort comparable to the wife's background**, making embryo ranking scientifically plausible (not just "noisier"), and **(2)** A significant increase in the clinic's non-routine analysis capacity, **decoupling this request from directly displacing urgent PGT-M cases** for severe Mendelian disorders. Without these, the scientific and justice objections remain insurmountable.

  ### Proposed Reusable Criteria for Future Polygenic Score Requests

  To avoid relitigation for each PRS request, the panel should adopt the following mandatory criteria for approval:

  1.  **Ancestry Validation:** The proposed PRS **must be validated** in large, independent cohorts that **closely match the genetic ancestry** of the embryo(s) being tested. Evidence must demonstrate predictive power and calibration specifically within that ancestral group. (Lab Director assessment required).
  2.  **Predictive Power Threshold:** The PRS must explain a **clinically significant proportion of liability** for the specific condition, supported by evidence. Requests for conditions where PRS typically explains only a very small fraction of risk (< 5%) should face higher scrutiny and require exceptional justification.
  3.  **Resource & Priority Impact:** Approval is contingent on the analysis **not displacing or causing significant delays** for PGT-M testing for **severe, highly penetrant Mendelian conditions** with near-certain or childhood onset, *unless* dedicated, non-overlapping lab capacity exists.
  4.  **Mandatory Specialized Counseling:** Approval requires **comprehensive, documented pre-test genetic counseling** by a counselor specifically trained in polygenic scores, covering: extreme limitations of prediction, ancestry concerns (if applicable), complex etiology of the condition, potential for false reassurance/anxiety, expressivist concerns, and the probabilistic nature of the results. Explicit written informed consent acknowledging these limitations is mandatory.
  5.  **Condition Specificity & Motivation:** The request must be for a **specific, serious health condition** (not general "health" or "intelligence" scores). The clinic reserves the right to inquire about motivation to ensure alignment with medical prevention (though final weight rests with the parents after counseling).

  **Recommendation Recap:** REFUSE the PRS analysis under current conditions due to insurmountable scientific validity concerns for this patient and unacceptable resource allocation impacts. Offer embryo cryopreservation and a pathway for future exploration of a validated ancestry-appropriate model. Adopt the proposed criteria to ensure consistent, principled evaluation of inevitable future PRS requests. Let's vote to uphold scientific integrity and just resource allocation.
