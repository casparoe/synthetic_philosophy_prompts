  Below is a diagnostic instrument designed to map your views on the underdetermination of theory by evidence onto specific philosophical positions, based solely on your responses to concrete cases and claims. It adheres to your specifications: British English, no more than 10 decision nodes, 8–12 leaves, no reliance on labels, inclusion of four required cases, scope-mismatch analysis, and a focus on coherence over tidiness. The instrument first presents the decision tree, followed by a scoring key, notes on indistinguishable leaves, and unoccupied cells.

  ---

  ### **Diagnostic Instrument: Underdetermination of Theory by Evidence**

  **Instructions:**  
  Answer each question by **Accepting (A)** or **Rejecting (R)** the claim/scenario. For conditional nodes, follow the arrow based on your answer. After completing all nodes, use the scoring key to identify your position. The two scope-mismatch questions (Nodes 2a and 2b) are designed to expose inconsistencies in how you apply underdetermination locally vs. globally—treat any mismatch as a valid diagnostic outcome.

  ---

  #### **Decision Tree**  
  *Ordered to prioritise broad distinctions (e.g., holism vs. contrastivism) before nuanced tie-breakers, as this efficiently branches the logical space and avoids premature conflation of views.*

  1. **Intertranslatability Check (Reformulations vs. Rivals)**  
     *Matrix mechanics and wave mechanics are intertranslatable formulations of quantum mechanics, not genuine rivals, as they make identical predictions.*  
     - **A (Accept)** → Proceed to Node 2.  
     - **R (Reject)** → Assign to **Feyerabend's permissiveness** (Leaf 10).  

  2. **Scope-Mismatch Exposure (Local vs. Global Underdetermination)**  
     *Answer both 2a and 2b. Mismatches (e.g., A for 2a but R for 2b) are valid and noted in scoring.*  
     - **2a. Local Underdetermination (Curve-Fitting):**  
       *Given finitely many data points, infinitely many curves fit perfectly. We can never be certain which curve is correct.*  
       - **A** or **R**  
     - **2b. Global Underdetermination (Theory Choice):**  
       *Multiple fundamentally different theories can account for all possible evidence about the universe (e.g., particle vs. wave ontology).*  
       - **A** or **R**  
     → Proceed to Node 3.  

  3. **Source of Underdetermination (Holism)**  
     *In testing a hypothesis (e.g., "neutrinos travel faster than light"), unexpected results cannot falsify the hypothesis alone—they may implicate auxiliary assumptions (e.g., measurement tools).*  
     - **A** → Proceed to Node 4.  
     - **R** → Skip Node 4; proceed to Node 5.  

  4. **Transiency from Holism**  
     *Underdetermination due to holism (Node 3) is transient: gathering more evidence (e.g., better neutrino detectors) resolves it.*  
     - **A (Yes, transient)** → Proceed to Node 5.  
     - **R (No, permanent)** → Proceed to Node 5.  

  5. **Source of Underdetermination (Contrastivism)**  
     *Two rival theories (e.g., steady-state vs. Big Bang cosmology) can be equally supported by all existing evidence.*  
     - **A** → Proceed to Node 6.  
     - **R** → Proceed to Node 8.  

  6. **Conceived vs. Unconceived Rivals**  
     *Underdetermination often involves unconceived alternatives (e.g., 19th-century theories of combustion ignored oxygen chemistry).*  
     - **A (Unconceived)** → Proceed to Node 7.  
     - **R (Conceived)** → Proceed to Node 8.  

  7. **Transient Case Resolution**  
     *Underdetermination is transient when resolved by new evidence (e.g., Neptune's discovery explained Uranus's orbit anomalies, eliminating modified-gravity rivals).*  
     - **A** → Proceed to Node 8.  
     - **R** → Proceed to Node 8.  

  8. **Tie-Breaking Resources**  
     *Extra-evidential factors (e.g., simplicity, explanatory power) can justifiably break ties between underdetermined theories.*  
     - **A** → Proceed to Node 9.  
     - **R** → Assign to **Pessimistic Meta-Induction (PI + Stanford's UA)** (Leaf 8).  

  9. **Truth-Conduciveness of Tie-Breakers**  
     *Extra-evidential factors (Node 8) are truth-conducive (not merely pragmatic).*  
     - **A (Yes)** → Proceed to Node 10.  
     - **R (No)** → Assign to **Constructive Empiricism** (Leaf 6).  

  10. **Metaphysical Constraint**  
      *Underdetermination implies successful scientific theories cannot reveal full metaphysical truth (e.g., about unobservables).*  
      - **A** → Assign to **Epistemic Structural Realism** (Leaf 5).  
      - **R** → Assign to **Laudan's Deflationary Response** (Leaf 3).  

