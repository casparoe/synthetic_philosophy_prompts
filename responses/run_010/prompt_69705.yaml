prompt: |-
  I have just been seated on my state's K–12 science standards review committee, and the first substantive fight I have walked into is not the one I expected: what our standards will say about Pluto. Half the committee insists we are settling terminology and should print whatever is least confusing to a thirteen-year-old; the other half insists we are reporting what astronomers established about the solar system and have no business second-guessing it. I would like the underlying episode analyzed through the analytic–synthetic distinction, with Quine's Two Dogmas of Empiricism as the lens.

  The facts, as our committee has established them. In August 2006, at its General Assembly in Prague, the International Astronomical Union adopted a formal definition of "planet" for the first time, requiring that a body orbit the Sun, be massive enough for its self-gravity to pull it into hydrostatic equilibrium, and have cleared the neighbourhood around its orbit. It created a new category, dwarf planet, into which Pluto was placed along with Ceres and Eris, and it voted down an alternative that would have kept dwarf planets as a subclass of planets. The trigger was empirical: Eris and a growing population of Kuiper Belt objects comparable to Pluto, with Eris turning out to be the more massive. Yet a substantial body of planetary scientists rejected the definition at the time and still reject it, arguing for a geophysical definition on which roundness is what matters; and the criteria do not sit perfectly with the intended extension, since the definition is framed only for bodies orbiting the Sun and at least one accepted planet is not obviously in hydrostatic equilibrium.

  Now the analysis, running in both directions. First: did the 2006 resolution change the meaning of a word, or report a discovery? Lay out what each answer commits us to about the sentences we printed before 2006 — did they become false, or merely obsolete, or something else — and say who bears the cost on each account: the textbook publishers, the astronomers, the students. Second: given that the definition was adopted for empirical reasons and remains revisable for empirical reasons, does the episode confirm Quine's picture, on which no statement is immune to revision and none is confirmed or refuted in isolation, or is it an anomaly — a scientific community appearing to do by resolution precisely what Quine argues cannot be done cleanly? Third: is the continuing dispute with the geophysical camp substantive or merely about how to use a term, and what could settle that?

  Finally, tell me where the lens runs out. Quine may be right that every sentence in our standards is revisable in principle, but we must print something this year, and I do not see holism telling us which revisable sentences are worth entrenching in a curriculum. Say plainly what the theory is silent about here, then give me your recommendation for the standard, with the reasoning exposed.
reasoning: |-
  Okay, the user is on a state K-12 science standards committee and is caught in a debate about how to classify Pluto in their curriculum. They want me to analyze this using Quine's analytic-synthetic distinction from "Two Dogmas of Empiricism" and provide recommendations.

  First, I need to recall Quine's arguments. He rejected the clear division between analytic statements (true by meaning) and synthetic statements (true by fact), arguing that our entire web of beliefs faces empirical testing together. This seems perfect for analyzing the Pluto controversy since it involves both linguistic definitions and empirical discoveries.

  The key facts: In 2006, the IAU redefined "planet," demoting Pluto to "dwarf planet" based on orbital clearance criteria. This was triggered by discovering Eris and other Kuiper Belt objects. But many planetary scientists still reject this, preferring a geophysical definition based on roundness. There are also issues with the IAU definition - it only applies to solar system bodies and has potential inconsistencies.

  Now for the three-part analysis the user requested:
  First direction: Did the 2006 resolution change meaning or report discovery? If it changed meaning (analytic shift), then pre-2006 textbooks weren't wrong, just using old definitions. If it reported discovery (synthetic), then those textbooks became factually incorrect. The consequences differ - meaning change is easier for publishers (just update terms) but might confuse students; treating it as discovery burdens publishers with "wrong" content and challenges astronomers' authority.

  Second direction: Does this confirm Quine's holism? Absolutely. The IAU resolution shows how empirical pressures (Eris discovery) forced conceptual reorganization across astronomy, with no clean separation between fact and definition. The ongoing debate proves revisions can happen to any part of the web.

  Third direction: Is the dispute substantive or terminological? It's both. The core disagreement is about which theoretical framework (orbital dynamics vs. geophysics) should dominate "planet" categorization. This could be settled by future empirical work showing which properties matter more for planetary science, but currently reflects differing scientific priorities.

  Where Quine's lens runs out: While holism explains why the debate exists, it doesn't help practical curriculum decisions. We need to consider educational goals - minimizing confusion while teaching scientific process. 

  My recommendation: Present both definitions neutrally. Call Pluto a "dwarf planet" per IAU but explicitly note the ongoing debate. This teaches students how science evolves through evidence and discourse. The standards should emphasize why definitions matter scientifically rather than presenting one as absolute truth.
answer: |-
  Your Pluto dilemma beautifully illustrates Quine's critique of the analytic-synthetic divide. Let's dissect it through his lens:

  ### 1. **Meaning Change vs. Discovery Report: The Analytic-Synthetic Tension**
     - **Meaning Change (Analytic Shift)**: If the IAU *redefined* "planet," they altered a linguistic convention. Pre-2006 statements like "Pluto is a planet" weren't *false*; they used an obsolete definition. This view minimizes disruption: textbooks update terminology without declaring past texts "wrong." *Cost to publishers* is low (simple edits), but *cost to students* is potential confusion about scientific inconstancy. Astronomers bear reputational cost for "changing rules."
     - **Discovery Report (Synthetic Truth)**: If the IAU *discovered* Pluto isn't a planet, pre-2006 statements were always empirically false (just like "Phlogiston exists"). This preserves science's empirical authority but forces textbooks to present prior knowledge as *error*. *Cost to publishers* is high (rewriting history sections); *cost to students* is learning a "fact" that may shift again. Astronomers bear cost if future evidence undermines the definition.

     **Quinean Insight**: Quine would reject this binary. The IAU resolution blended both: empirical data (Eris) *forced a recalibration of the conceptual scheme*, making "planet" a node in a web now including "dwarf planet." Pre-2006 statements weren't purely analytic or synthetic; they reflected a *then-coherent* web of beliefs.

  ### 2. **Quine’s Holism Confirmed, Not Challenged**
     The episode *exemplifies* Quine's holism:
     - **No Immunity**: The "planet" concept, once seemingly stable, was revised due to empirical pressure (Kuiper Belt discoveries). Even "basic" categories like planetary status aren't sacrosanct.
     - **Web of Belief**: The IAU vote didn't isolate "planet" from other beliefs. It entangled orbital dynamics ("cleared its orbit"), geophysics ("hydrostatic equilibrium"), and taxonomy ("dwarf planet" as non-planet). Rejections by planetary scientists show competing webs: one prioritizing orbital context, another geophysical properties.
     - **Resolution as Forced Choice**: Quine argues revisions aim for minimal disturbance to the whole web. The IAU vote was a pragmatic response to chaos—not a "clean" analytic decree, but a holistic adjustment to new data. Persistent dissent confirms revision is ongoing; no definition is final.

  ### 3. **Substantive vs. Terminological? A False Dichotomy**
     - **Quine’s View**: The dispute is *both*. It’s terminological in that "planet" has no Platonic essence; it’s substantive because definitions reflect *which empirical relationships matter most*.
     - **Geophysical Camp**: Prioritizes intrinsic properties (roundness = complex geology), suggesting "planethood" should depend on a body's physical evolution.
     - **IAU Camp**: Prioritizes orbital dominance, emphasizing a body's dynamical role in solar system architecture.
     - **What Could Settle It?** Future empirical *utility*: if exoplanet studies or Kuiper Belt research show orbital clearance predicts significant phenomena (e.g., planetary system stability), or if roundness correlates with geologic activity critical to astrobiology. The definition that best *integrates* with advancing science will prevail—not by "truth," but by holistic coherence.

  ### 4. **Where Quine’s Lens Runs Out: The Curriculum Dilemma**
     Quine explains *why* the debate exists but offers no curricular guidance. Holism says every statement is revisable, but not *which revisions to teach children*. Silence reigns on:
     - **Epistemic Authority**: Should K-12 science defer to IAU’s institutional role, or acknowledge dissent?
     - **Pedagogical Stability**: How much uncertainty is appropriate for 13-year-olds?
     - **Scientific Literacy**: Is the goal consensus facts or understanding scientific flux?

  ### **Recommendation for the Standard**
     **Adopt the IAU definition, but contextualize its contested nature:**  
     > *"Pluto is classified as a dwarf planet. In 2006, the International Astronomical Union (IAU) established definitions requiring a planet to clear its orbital neighborhood. Pluto orbits among many similar objects in the Kuiper Belt and does not meet this criterion. Some scientists prefer definitions based on a world's physical properties, and this debate continues."*

     **Reasoning:**  
     - **Resolves Committee Conflict**: Uses IAU as the current institutional standard (satisfying the "reporting" camp) while explicitly noting dissent (satisfying the "clarity" camp).
     - **Educational Value**: Teaches science as dynamic. Students learn both a core fact (Pluto's status) *and* that science involves negotiation.
     - **Quinean Alignment**: Mirrors how science *actually works*—entrenching a revisable statement within a web of qualifications. It avoids presenting science as static dogma.
     - **Practicality**: Clear enough for textbooks while inviting deeper inquiry. Publishers can footnote details; teachers can discuss "why definitions matter."

  **Final Quinean Thought**: Your committee's fight *itself* proves Quine right: no fact (Pluto's status) is separable from the web of language, authority, and pedagogy. Printing "Pluto is a dwarf planet" isn't endorsing eternal truth—it’s stabilizing one node in a revisable web, so students have ground to stand on while learning to question it.
