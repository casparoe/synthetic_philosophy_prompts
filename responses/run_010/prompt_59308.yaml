answer: |-
  Here is the specification for an adequate theory of escalation of commitment, structured as requested. Requirements are built from the phenomena you listed, assessed for necessity, and evaluated for compatibility.

  ### Requirements for an Adequate Theory of Escalation

  1.  **Requirement: Explain the Asymmetry in Entry vs. Continuation Decisions**  
      *Motivation*: The dollar auction shows entry is often rational (low initial bid for potential gain), while continuation by the trailer is locally rational but globally ruinous. The theory must pinpoint whether the error lies in the entry assessment, the continuation rule, or an inherent conflict between the two decision frames.  
      *Classification*: **Non-negotiable**. A theory failing this cannot account for the core structure of the trap – why rational actors *enter* and then *persist* beyond rationality.

  2.  **Requirement: Explain or Reconcile the Acceleration Phenomenon**  
      *Motivation*: Anecdotal and experimental evidence frequently describes escalation *intensifying* as costs mount (acceleration), seemingly contradicting standard sunk-cost irrelevance and stationarity predictions. The theory must either explain this acceleration mechanistically or demonstrate why observed cases create this illusion (e.g., selection bias, changing stakes).  
      *Classification*: **Negotiable but costly (Failure cripples practical application)**. Ignoring acceleration leaves the theory unable to predict the real-world pattern managers report and experience. The cost of ignoring it is irrelevance to designing effective stop rules.

  3.  **Requirement: Capture the Asymmetry of Position (Trailer's Trap)**  
      *Motivation*: In auctions and project funding, the party *behind* (trailer, needing to invest more to win/salvage) faces structurally stronger pressures to continue than the leader (who can often exit profitably). A theory predicting symmetric escalation must justify why the payoff asymmetry is irrelevant or overridden.  
      *Classification*: **Non-negotiable**. This asymmetry is fundamental to the archetypal escalation scenario (dollar auction, failing project). A symmetric theory describes a different phenomenon.

  4.  **Requirement: Account for the Limited Efficacy of Hard Caps**  
      *Motivation*: Penny auctions show that even with known finite resources (hard loss caps), players (or automated agents) frequently bid fees exceeding item value. A theory must explain why backward induction based on known caps often fails to prevent escalation and what factors *do* make caps effective.  
      *Classification*: **Negotiable but costly (Failure misleads policy design)**. Ignoring this leads to over-reliance on purely financial caps as a stop rule, which evidence shows is insufficient. The cost is ineffective policy prescriptions. *Flag*: Empirical certainty about penny auction drivers (e.g., thrill, automation quirks) is medium, not high.

  5.  **Requirement: Reconcile Core Psychological Regularities with Rational Choice Foundations**  
      *Motivation*: Escalation robustly increases with sunk cost magnitude, personal responsibility, and public accountability, while decreasing when decision rights shift to a fresh party. It persists despite warnings and experience. A theory must explain these specific regularities mechanistically.  
      *Classification*: **Non-negotiable**. These are the most replicated empirical signatures of escalation. A theory ignoring them fails descriptively. *Flag*: The "not reliably falling with warning/experience" claim is very strong; some studies show modest effects.

  6.  **Requirement: Clarify the Status of Non-Human Findings**  
      *Motivation*: Evidence that animals exhibit similar sunk-cost effects suggests deep evolutionary roots. A theory must state whether it aims to explain a general adaptive heuristic (potentially misfiring in modern contexts) or a uniquely human cognitive/social error. It cannot ignore this without justification.  
      *Classification*: **Camp-specific**. **Evolutionary Biology** demands integration as evidence of adaptation. **Strategic/Institutional** camps may reasonably treat it as interesting but orthogonal to institutional design. Demanding integration *as essential* within strategic/institutional theories is a prejudice of the evolutionary camp.

  7.  **Requirement: Distinguish Escalation from Near-Neighbors**  
      *Motivation*: Persistence can be rational (Bayesian updating on new info, paying for valuable real options, reputational investment, contractual obligation, resolute choice). An adequate theory must provide *ex-ante observable criteria* (beyond final outcome) to distinguish irrational escalation from these, especially resolute choice/"integrity," where observable behavior is identical.  
      *Classification*: **Non-negotiable**. Without this distinction, the theory is unfalsifiable ("it was escalation only because it failed") or collapses rational persistence into error. Defining escalation ex ante requires specifying the *source* of the error (e.g., misweighting of sunk costs, flawed updating).

  8.  **Requirement: Anchor Reference Points Objectively**  
      *Motivation*: Theories invoking loss aversion or regret require an independent, non-circular definition of the reference point (e.g., status quo ante, project baseline, zero-profit point). If the reference point shifts *because* of the escalation (e.g., "I must win to justify what I've spent"), the explanation becomes tautological.  
      *Classification*: **Non-negotiable**. Without an objective anchor, reference-dependent theories can rationalize *any* persistence post-hoc as avoiding a subjectively defined "loss," rendering them unfalsifiable.

  ### The Core Incompatibility & Sacrifice
  The tension you identified is real. To accommodate the **psychological regularities (Requirement 5)** – particularly the direct causal link between *sunk cost magnitude* and continuation *with objective prospects held fixed* – a theory **must sacrifice strict consequentialist preferences over final outcomes**. Preferences must incorporate non-consequentialist elements (e.g., aversion to waste, self-justification, completion utility) or the decision frame must be distorted by the sunk cost itself (e.g., reference point shift tied to prior investment). Bayesian updating alone cannot explain why objectively identical future prospects lead to different choices based *only* on the size of the sunk cost. Sacrificing consequentialism costs parsimony and alignment with standard rational choice, but is empirically necessary.

  ### Requirement Eliminating the Most Candidates
  **Requirement 7 (Distinguishing from Near-Neighbors, especially Resolute Choice)** eliminates the largest number of otherwise respectable candidates. Many theories (especially simple rational choice, some strategic models) struggle to provide clear ex-ante criteria separating irrational escalation from rational persistence driven by commitment, new information, or option value. They often rely on the outcome or assume irrationality based solely on persistence despite sunk costs.

  ### Scorecard for Theoretical Families

  1.  **Escalation as Equilibrium Strategic Behavior (Auction Theory, Game Theory):**  
      *Strengths*: Nails Requirements 1, 3, 4 (asymmetry, trailer's trap, cap limits). Provides clear ex-ante structure.  
      *Weaknesses*: Struggles severely with 5 (psychological regularities), 6 (animal findings), 7 (distinguishing resolute choice), and 8 (objective reference points). Stationarity (Requirement 2) is often assumed, contradicting acceleration. Cannot explain sunk-cost sensitivity without adding auxiliary assumptions.

  2.  **Escalation as Preference/Framing Distortion (Behavioral Economics, Prospect Theory):**  
      *Strengths*: Best at Requirements 5, 8 (psychological drivers, reference points - if anchored). Can potentially address 6 (as misfiring heuristic). Explains acceleration (2).  
      *Weaknesses*: Struggles with Requirement 7 (distinguishing rational persistence - resolute choice is particularly hard). Often weak on 1 & 3 (entry/continuation asymmetry, position asymmetry), treating decisions homogenously. May struggle with 4 (why caps don't fully stop it).

  3.  **Escalation as Institutional/Agency Phenomenon (Org Behavior, Public Choice):**  
      *Strengths*: Excels at Requirement 5 (accountability, responsibility, shifting decision rights). Directly addresses Requirement 7 by linking "error" to misaligned incentives/accountability vs. project value. Fits institutional design focus. Explains why caps (4) alone fail (agency problems persist).  
      *Weaknesses*: Often weaker on precise micro-mechanisms (1, 2, 3). May struggle with Requirement 8 (defining reference points objectively) and Requirement 6 (animal findings). Can risk circularity (escalation is what happens when incentives are bad).

  A truly adequate theory likely needs elements from all three, but must explicitly resolve the core conflicts outlined, particularly the sacrifice of pure consequentialism to explain the sunk-cost effect and the provision of ex-ante criteria to distinguish escalation from rational commitment.
