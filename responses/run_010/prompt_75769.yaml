  Counterfactuals will help worldbuild alternative systems. Professionalization would dismantle the relational ontology—rifles in armories lose civic meaning. Civilian disarmament would destroy the anti-tyranny function. Both changes expose what's philosophically non-negotiable: the citizen-weapon symbiosis.

  Must avoid academic citations per their request. Instead, weave concepts into actionable novelistic terms: "the cupboard isn't just storage—it's where state and citizen negotiate trust." Mark underdetermined areas clearly, like whether virtue is required—that ambiguity leaves room for character development.

