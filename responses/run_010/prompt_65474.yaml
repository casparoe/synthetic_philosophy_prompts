  Part 1: The Axes and Positions

  The special composition question (SCQ) asks: under what circumstances do some things compose a further thing? We can break this down along several axes:

  Axis 1: Does composition require an explanation? 
     - If we think composition is not a brute fact, then we need to specify conditions.
     - If we think it is brute, then we don't.

  Axis 2: The scope of composition:
     Option A: Trivially "always" (universalism/unrestricted composition) 
     Option B: Trivially "never" (nihilism) 
     Option C: Restricted (then we need to say by what)

  Axis 3: If restricted, what is the restriction? Common candidates:
     a. Contact or cohesion (spatial proximity and sticking together)
     b. Fastening (being bonded in a specific way, e.g., glued, nailed)
     c. Function or design (the parts work together for a purpose, either natural or artificial)
     d. Constituting a life (being a living organism, per van Inwagen)
     e. Agent's or community's interests (social or contextual factors)

  Axis 4: Is the quantifier domain-relative? (quantifier variance/deflationism)
     - The meaning of "there exists" can vary across contexts, so composition is relative to a conceptual scheme.

  Axis 5: Is composition identity? 
     - The whole is identical to its parts taken together.

  We can now map the positions:

  1. Unrestricted composition (universalism): 
     - Explanation: Not needed? (or: composition is unrestricted by definition)
     - Scope: Always
     - Restriction: None
     - Domain-relative? No
