  2. Nihilism (or mereological nihilism):
     - Explanation: Not needed? (or: composition never happens, so no explanation needed)
     - Scope: Never
     - Restriction: None (because never)
     - Domain-relative? Typically no, but some versions might be deflationary.
     - Composition as identity? Rejected because there are no composites.

  3. Van Inwagen's life-only answer (biological approach):
     - Explanation: Needed (only when the activity of the parts constitutes a life)
     - Scope: Restricted
     - Restriction: Constituting a life
     - Domain-relative? No
     - Composition as identity? No

  4. Conservative/common-sense answer (moderate restriction by contact, fastening, function, etc.):
     - Explanation: Needed
     - Scope: Restricted
     - Restriction: Typically a mix of contact, fastening, and function (e.g., artifacts and organisms)
     - Domain-relative? No
     - Composition as identity? No

  5. Brute answer (composition is a brute fact, not reducible to other conditions):
     - Explanation: Not needed (it's brute)
     - Scope: Restricted? (but the restriction is brute, so we cannot specify conditions beyond the fact that composition occurs in these cases)
