  ### Part 1: The Debate Space Axes  
  The "special composition question" (SCQ) asks: *When do smaller things compose a larger thing?* Metaphysicians map this along five axes. Each axis defines a choice point; positions emerge at their intersections. Cells marked ★ are occupied; empty cells are explained briefly.  

  | **Axis**                            | **Options**                                                                 | **Key Positions & Occupancy**                                                                                                                                                                                               |
  |-------------------------------------|-----------------------------------------------------------------------------|---------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|
  | **1. Does composition need explaining?** | (A) Yes: Conditions must be specified.<br>(B) No: It's brute (inexplicable) or deflated (not a deep fact). | ★ **Unrestricted composition** (A): Always happens, trivially.<br>★ **Nihilism** (A): Never happens, trivially.<br>★ **Van Inwagen's life-only** (A): Only when parts constitute a life.<br>★ **Conservative/common-sense** (A): Only under "everyday" conditions (e.g., contact, function).<br>★ **Brute answer** (B): Happens in specific cases, but no underlying rule.<br>★ **Quantifier variance/deflationism** (B): "Composition" is language-relative, not a real-world fact.<br>★ **Composition as identity** (B): The whole just *is* the parts (no extra fact to explain). |
  | **2. When does composition occur?** | (A) Always (unrestricted).<br>(B) Never (nihilism).<br>(C) Only under restricted conditions. | ★ **Unrestricted** (A).<br>★ **Nihilism** (B).<br>★ **Van Inwagen** (C, life-only).<br>★ **Conservative** (C, e.g., contact/function).<br>★ **Brute** (C, but no rule).<br>★ **Quantifier variance** (A/B/C, varies by context).<br>★ **Composition as identity** (A). |
  | **3. If restricted, by what?**      | (A) Contact/cohesion (things touching).<br>(B) Fastening (bonded, e.g., glued).<br>(C) Function/design (purposeful arrangement).<br>(D) Life (parts constitute a living being).<br>(E) Agent/community interests. | ★ **Conservative** (A/B/C mix: e.g., fastened sand = one object; loose sand = many).<br>★ **Van Inwagen** (D).<br>★ **Brute** (no specific restriction).<br>◇ *Empty: Function-only (C)*: Unattractive—ignores physical bonds.<br>◇ *Empty: Interests-only (E)*: Incoherent—interests don’t create physical objects. |
  | **4. Is "there exists" domain-relative?** | (A) Yes: Quantifier variance (language/concept-dependent).<br>(B) No: One universal answer. | ★ **Quantifier variance/deflationism** (A).<br>★ **All others** (B).<br>◇ *Empty: Variance + brute*: Unattractive—why combine anti-realism with inexplicability? |
  | **5. Is composition identity?**     | (A) Yes: Whole = parts collectively.<br>(B) No.                             | ★ **Composition as identity** (A).<br>★ **All others** (B).<br>◇ *Empty: Identity + restriction*: Incoherent—if whole=parts, composition must be unrestricted. |

  ### Part 2: The Quiz  
  **Instructions:** *For each scenario, pick the statement that best fits your view. No prior knowledge needed—go with your gut.*  

  1. **Slime mold**: A single cell (with thousands of nuclei) is cut in half with a scalpel. Both halves regrow into full slime molds.  
     - A) One organism before the cut; two after.  
     - B) Always a crowd of nuclei—cutting just separates them.  
     - C) One organism before and after—it’s now in two pieces.  
     *[Note: Probes "life" and "persistence through change."]*  

  2. **Utah aspen clone**: 40,000+ tree trunks share one root system.  
     - A) One organism (the entire grove).  
     - B) A colony of individual trees.  
     - C) Just roots and trunks—"organism" is a label.  
     *[Note: Probes "spatial scale" and "functional unity."]*  

  3. **Portuguese man o' war**: Specialized zooids (stingers, digesters, reproducers) can’t survive alone.  
     - A) One organism (zooids are organs).  
     - B) Many organisms working together.  
     - C) Just zooids touching—no "organism" here.  
     *[Note: Probes "functional interdependence."]*  

  4. **Biofilm**: Unrelated bacteria share nutrients/signals in a self-made slime matrix.  
     - A) One superorganism.  
     - B) Many bacteria in a slimy home.  
     - C) Only bacteria and slime exist—"biofilm" is a term.  
     *[Note: Consistency trap 1—probes "function vs. biology."]*  

  5. **Lichen**: Fungal/algal partners can be separated in a lab and reassembled.  
     - A) One organism when together.  
     - B) Two organisms cooperating.  
     - C) Just fungus and alga touching—no new thing.  
     *[Note: Probes "reversibility" and "symbiosis."]*  

  6. **Bone-marrow patient**: After a transplant, a person has two distinct genomes in their body.  
     - A) One organism with mixed cells.  
     - B) Two organisms coexisting.  
     - C) Only cells exist—some with different DNA.  
     *[Note: Probes "genetic identity" and "bodily unity."]*  

  7. **Two coins**: Pennies lie apart, then slowly nudged until touching.  
     - A) Two objects until they touch; then one.  
     - B) Always two objects.  
     - C) Always one scattered object (even when apart).  
     *[Note: Probes "contact" and "gradual change."]*  

  8. **Grains of sand**: Loose heap vs. mortared into a wall.  
     - A) Wall is one object; heap is many grains.  
     - B) Both are just grains—no "object" added.  
     - C) Both are single objects (wall by function; heap by shape).  
     *[Note: Probes "fastening" and "function."]*  

  9. **Crowded subway**: People packed together, exchanging heat, CO₂, and moisture.  
     - A) One entity (like a superorganism).  
     - B) A group of individuals.  
     - C) Only individuals exist—"crowd" is a word.  
     *[Note: Consistency trap 2—probes "biological bias."]*  

