prompt: |-
  I teach philosophy of law and professional ethics, and this term I have been asked to do two things outside my specialty: contribute a chapter to an interdisciplinary handbook on responsibility (the other contributors are mostly from law, clinical medicine, and public policy), and run the one session of our graduate seminar devoted to "what we fail to do." My own work concerns the normative side — duties, permissions, excuses — and I am perfectly comfortable with the claim that a person can be blameworthy for a failure to act. What I am not competent to judge is the metaphysics underneath it: whether an omission can literally be a *cause*, or whether causal language in these cases is doing something else entirely. To get oriented I read a chapter in a well-reviewed trade book on the philosophy of everyday life, and it contains the following passage, which I have transcribed as accurately as I could:

  > "For most of its history, philosophy assumed that causation is a relation between happenings — that to cause something is to bring some force, energy, or process to bear on it. On that picture, what you failed to do could never be a cause, since a non-happening is not the sort of thing that could produce anything. The consequence is absurd: the nurse who never administered the dose would not be a cause of the patient's death, even though the law, the hospital, and common sense all agree that she is. The counterfactual theorists solved the problem. Since Lewis, causation has been understood as counterfactual dependence: c causes e just in case, had c not occurred, e would not have occurred. That handles omissions for free, because had the nurse given the drug the patient would have lived; so her not giving it caused his death. The price, though, is well known. Once absences are admitted as causes, the world fills up with them: the Queen's failure to water my plants caused them to wither, and so did the failure of every stranger who ever walked past my window box. Unwilling to pay that price, a growing number of philosophers deny that there is any such thing as negative causation at all, and hold that talk of causing-by-omitting is really a matter of norms and expectations: an agent causes a harm only where the agent was under an obligation to prevent it. On this view the nurse causes the death because she had a duty; the passer-by does not, though the counterfactuals are exactly the same. Causation, in other words, turns out to be partly a moral notion."

  Please act as a metaphysician who works on causation and has thought hard about the negative-causation debate, and give me an accuracy audit of that passage. Think carefully before answering, and begin with a few sentences of brainstorming in which you identify the distinct claims the passage is bundling together and the points at which you expect them to come apart — then do the audit proper. Work through it claim by claim, and for each claim tell me which of four boxes it belongs in: something a specialist would say without qualification; a simplification that costs nothing important; something subtly wrong in a way that would mislead a careful reader; or something flatly false. Two things I particularly want you to bear down on, because I suspect them but cannot articulate why. First, whether the passage is treating two different phenomena as one: an agent's refraining from something she was positioned to do, on the one hand, and the mere absence of some event anywhere in the world, on the other — and whether the profligacy complaint it mentions is aimed at both or only at one. Second, whether the last two moves are compatible with each other: the denial that there is negative causation, and the assertion that an agent causes a harm only where she had an obligation to prevent it. My own reading, which I want you to check rather than accommodate, is that someone who denies negative causation altogether should be explaining our omission-talk away as a normative gloss laid over purely positive causal facts, not building the norm into causation itself — and that these are very different theses, with very different consequences for the law. Also tell me whether the passage's appeal to legal practice is doing the work it seems to be doing: I teach that the common law's general rule is precisely that there is no liability for failing to rescue absent a special relationship, a contractual undertaking, or culpable creation of the peril, which looks to me less like an argument that causation is moral than like evidence that the law has always kept the causal question and the duty question rigorously apart. Say where you are unsure rather than smoothing it over, and do not give me references or a reading list — I want the conceptual map, not the literature.

  Finally, I would like you to apply the corrected picture to a case of my own devising, because I intend to use it in the seminar and I need to know what I am getting into. A hotel employs a lifeguard, posted to watch a marked stretch of water; immediately beyond the hotel's boundary lies an unguarded public beach. Two swimmers, equally visible from the tower and equally within reach of one competent swimmer, get into identical difficulty at the same moment. The lifeguard, distracted, sees neither, and both drown. My students reliably report that her inaction caused the first death but not the second, and they reach for the duty to explain the difference. Now change one detail: suppose the swimmer in the unguarded stretch could have been saved instantly by a guest sunbathing on the public beach, who happens to be an elite open-water swimmer and who also fails to act, while the lifeguard is a marginal swimmer who could have reached the hotel's own swimmer only barely in time. When I put the case that way, several students reverse their verdict about who caused what, which suggests to me that the intuition is tracking capacity and settled expectation rather than obligation — and if that is right, the passage's concluding slogan looks not merely imprecise but wrong about the phenomenon it invokes. Please tell me what you make of that: which of the three broad positions you judge most defensible — that negative causation is real and indiscriminate, that there is none and our omission-talk is a normative overlay on positive causal facts, or that causation itself is norm-sensitive — what each would say about the modified case, and whether the flip in my students' intuitions is evidence for any of them. Close with a rewrite of the passage, about two paragraphs long, at the same level of accessibility but safe to hand to law and medical students; flag in one or two sentences what you had to sacrifice in making it accurate.
reasoning: |-
  Okay, the user is a philosophy of law and ethics professor who needs help auditing a passage about causation and omissions. They're stepping outside their normative specialty into metaphysics, specifically the debate around whether omissions can be causes. 

  First, I need to unpack the passage's layered claims: (1) historical philosophy saw causation as requiring positive happenings, (2) counterfactual theory (Lewis-style) solved omission problems but caused overgeneration issues, (3) some now deny negative causation entirely and tie "causing by omitting" to obligations. The user flags two key concerns: whether conflating refraining vs. mere absence distorts the profligacy objection, and whether denying negative causation while making causation norm-dependent is coherent.

  Hmm, the passage oversimplifies history - Aristotle and medieval thinkers actually did discuss omissions. Its portrayal of Lewis is also shaky: his theory didn't "handle omissions for free" but rather treated them as causal explanations via counterfactuals, not literal causes. The profligacy complaint mainly targets absences, not refrainings. 

  Biggest problem: the final "norm-sensitive causation" position is presented as the alternative to counterfactual theory, but it's actually orthogonal. Denying negative causation should lead to explaining omission-talk as normative labeling of positive events (e.g., the death was caused by drowning, not the nurse's absence). Building norms into causation itself is a different move entirely. 

  The legal reference is misleading too. Common law's no-duty-to-rescue rule shows precisely that causation and duty are separated - we say the passerby didn't cause the death even if their action could have prevented it. The passage uses law backwards here. 

  For the lifeguard case: 
  - Counterfactual theory would say both drownings were caused by absences (lifeguard's and guest's) since removing either omission saves one swimmer. 
  - Norm-labeling view would say only positive events caused the deaths (e.g., currents), but we normatively attribute the hotel swimmer's death to the lifeguard due to duty. 
  - Norm-sensitive causation would tie causation directly to obligation - so only the lifeguard "caused" the hotel swimmer's death. 

  The students' intuition flip (caring about capacity/expectation over strict duty) suggests norm-labeling is more plausible than norm-sensitive causation. Their judgment tracks when it's reasonable to expect action, not just legal duty. 

  Rewriting the passage requires: clarifying that historical views weren't monolithic, distinguishing counterfactual dependence from causation, separating profligacy concerns about absences from refrainings, and not conflating the two normative approaches. Sacrifices some rhetorical flair for precision, but keeps it accessible.
answer: |-
  Here’s a conceptual audit of the passage, followed by analysis of your case and a revised passage. I’ll begin with brainstorming to unpack the bundled claims.

  **Brainstorming: Key Claims and Tensions**  
  The passage bundles:  
  (1) A historical thesis about causation requiring "happenings";  
  (2) Counterfactual theory as a solution to omissions;  
  (3) Profligacy as the cost of this solution;  
  (4) A normative alternative tying causation to obligations.  
  Crucial points of divergence:  
  - Whether "non-happenings" (absences) vs. *agentive refrainings* are conflated in the profligacy objection.  
  - Whether denying negative causation is compatible with making causation itself norm-dependent (vs. treating "causing-by-omitting" as non-causal normative assessment).  
  - Whether legal practice supports the normative view or presupposes causal/duty separation.  

  ---

  ### **Accuracy Audit**  
  *(Quotes from passage in italics; assessment follows)*  

  1. *"Philosophy assumed causation is a relation between happenings... a non-happening is not the sort of thing that could produce anything."*  
     **Assessment:** **Simplification that costs little.** While dominant in early modern philosophy (e.g., Humean events), some pre-modern views (e.g., Aristotelian potentials) accommodated absences. The core intuition is correctly captured.  

  2. *"The counterfactual theorists solved the problem... her not giving it caused his death."*  
     **Assessment:** **Subtly misleading.** Lewisian counterfactual theory *allows* omissions to be *explanatorily relevant* but avoids calling them "causes" (Lewis treated causation as primarily between *events*; omissions lack spatiotemporal location). It resolves the *explanatory* problem, not by making omissions causes, but by showing how their *presence* would have changed outcomes.  

  3. *"Once absences are admitted as causes, the world fills up with them: the Queen’s failure... every stranger..."*  
     **Assessment:** **Subtly wrong.** The profligacy objection targets *absences* generally (e.g., the absence of rain causing drought), not specifically *agentive refrainings*. But the passage uses an agentive example (the Queen) alongside non-agentive ones (strangers), obscuring that *refraining* typically implies capacity and awareness, while mere absence does not. The objection is primarily about *causal overdetermination by absences*, not normative contexts.  

  4. *"Unwilling to pay that price, a growing number... deny that there is any such thing as negative causation... an agent causes a harm only where under an obligation."*  
     **Assessment:** **Flatly false** on compatibility. Denying negative causation entails that *only positive events* are causal relata. The nurse’s *inaction* isn’t a cause; the death is caused by (e.g.) toxin buildup. Saying she "causes the harm" is then *normative labeling*, not metaphysics. **The passage conflates two distinct moves:**  
     - (A) **Causal eliminativism about omissions:** No negative events exist; omission-talk is shorthand for norms/expectations.  
     - (B) **Norm-embedded causation:** Obligations *literally* define causal relations.  
     (A) and (B) are incompatible: (A) reduces "causing-by-omitting" to non-causal norms; (B) makes norms *constitutive* of causation.  

  5. *"Causation... turns out to be partly a moral notion."*  
     **Assessment:** **Flatly false** as presented. The normative view described is about *ascriptive practices* (when we *hold* someone responsible), not causation itself. Metaphysicians who deny negative causation typically insist causation is *mind-independent*; norms arise in *attribution*.  

  6. *Legal appeal: "the law, the hospital, and common sense all agree [the nurse] is [a cause]."*  
     **Assessment:** **Misleading.** Legal practice distinguishes *causation-in-fact* (counterfactual dependence) from *proximate cause* (duty/scope of risk). The common-law "no duty to rescue" rule shows that *counterfactual dependence alone is insufficient* for liability—precisely because causation (understood factually) is separated from obligation. The law’s "common sense" treats the passerby as *causally relevant* but *not liable* due to no duty.  

  ---

  ### **Your Lifeguard Case: Analysis**  
  **Case summary:**  
  - **Original:** Lifeguard fails to save two swimmers (one in jurisdiction, one outside). Students say she caused death #1 (duty-bound) but not #2 (no duty).  
  - **Modified:** Elite guest fails to save swimmer in public zone; weak lifeguard barely could save hotel swimmer. Students now say guest caused public swimmer’s death.  

  **Key intuition:** Students track *capacity* and *reasonable expectation* (not just formal duty). The lifeguard’s weakness reduces perceived causal efficacy; the guest’s elite skill heightens it.  

  **Three Positions Applied:**  
  1. **Negative causation real & indiscriminate (counterfactual):**  
     - Both deaths caused by absences (lifeguard’s inaction counterfactually necessary for hotel death; guest’s for public death).  
     - *Verdict:* Students wrong in both versions; both omissions caused deaths. Their flip reflects "moral coveting" of counterfactuals.  

  2. **No negative causation; omission-talk = normative overlay:**  
     - Deaths caused *only* by positive events (drowning, currents).  
     - "The lifeguard caused death #1" = "She had duty/capacity, so we *attribute* responsibility."  
     - In modified case, guest’s capacity/salience makes attribution stronger than lifeguard’s.  
     - *Verdict:* Students’ flip reflects shifting *normative attribution*, not causal facts.  

  3. **Causation itself norm-sensitive:**  
     - Causation *constitutively* depends on obligations/capacities.  
     - Lifeguard "causes" hotel death only if capable and obligated; guest "causes" public death if elite skill creates "de facto" duty.  
     - *Verdict:* Students’ flip matches this view best—but risks circularity (duty defines cause, but cause defines duty?).  

  **Which position is most defensible?**  
  The **normative overlay view (#2)** best explains:  
  - The *separability* of causal and duty questions in law.  
  - Why students *flip* based on capacity: it alters normative expectations, not the physical cause of death.  
  - Avoids metaphysical inflation (e.g., "billions of causes" for every death).  

  ---

  ### **Revised Passage (Accessible & Accurate)**  
  "For much of philosophy’s history, causation was seen as a link between actual occurrences—events that transmit force or change. On this view, *not* acting (like a nurse failing to give medicine) can’t literally *cause* an outcome, since an absence isn’t an event. Yet common sense blames the nurse for the patient’s death. How to resolve this?  

  Counterfactual theories offer one answer: if the nurse *had* given the drug, the patient *would have* lived. This makes the omission *explanatorily relevant* but doesn’t treat the absence itself as a cause. Critics note this invites overkill: if every absence that *could* have prevented an outcome is 'causal,' then my plants died because the Queen didn’t water them (and every passerby too). To avoid this, many philosophers argue that absences aren’t genuine causes—they lack physical presence. When we say the nurse 'caused' the death by omitting, we’re really noting her *breach of duty* against a backdrop of *causal dependence*: the death occurred due to disease, but she *should have* interrupted it. The passerby isn’t a 'cause' not because the physics differ, but because no duty existed. Law reflects this: failing to rescue usually isn’t illegal unless a special duty applies, showing that causation (did the drowning kill?) and obligation (should you have stopped it?) are distinct questions."  

  **Sacrificed for accuracy:**  
  - The crisp "solved for free" framing of counterfactuals.  
  - The provocative "causation is moral" slogan—replaced with a duty-attribution model over physical causation.  

  Use this to show students that intuitions about "causing by omitting" blend normative expectations (duty, capacity, salience) with counterfactual dependence—but the causal machinery itself remains physical. The lifeguard case reveals how *capacity* shapes normative expectations, not metaphysics.
