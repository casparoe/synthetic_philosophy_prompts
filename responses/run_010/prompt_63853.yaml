  The user's identity as an MA student suggests they're grappling with the philosophy of their field, possibly concerned about the robustness of archaeological methods. Their need isn't just to win an argument with Dave but to understand how to evaluate radical theories professionally. They might fear that dismissing Dave outright makes archaeology dogmatic, but accepting his view undermines their training.

  I should structure the response by addressing each demarcation criterion explicitly: falsifiability, prediction, auxiliary hypotheses, circularity. Show that Dave's theory meets basic scientific standards but is likely false. Conclude by emphasizing that science is a communal process—Dave's lack of engagement from professionals isn't conspiracy; it's because his evidence isn't compelling enough to warrant overhauling established chronologies.
