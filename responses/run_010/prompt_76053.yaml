answer: |-
  **Section B: Essay Question (25 marks total)**  
  *Answer ONE question. Time allowed: 50 minutes.*  

  **Question:**  
  Consider the following case:  
  > States A and B are at war. Both field identical briefing systems that prepare justification dossiers for their combatants. The systems operate under a *hard truthfulness constraint*: every proposition asserted is true, but the systems control *selection, weighting, sequence, and framing* of facts (e.g., which truths are included, how prominently they feature, which explanations are offered as plausible). The output reliably induces in attentive, well-trained soldiers the settled belief that their own side satisfies *jus ad bellum* and the enemy does not. Systems are equally effective and constrained. Soldiers (all volunteers, under no unusual coercion) have no reason or evidence to suspect curation. Crucially, *political leadership on both sides* uses identical systems for their own assessments; thus, no state actor possesses an uncurated view of the war’s justice.  

  **(a)** Does symmetric curation (both sides using the system) *undermine, support, or leave untouched* the doctrine of the moral equality of combatants (MEC)? Identify which *ground* for MEC (coercion/authority; epistemic; convention/consequences) is most relevant. State explicitly whether your conclusion concerns the *justification of killing, evidence-relative permissibility, liability to be killed, or excuse*. (15 marks)  

  **(b)** Now assume *only State A* fields the system. Does your verdict change for A’s combatants, B’s combatants, or both? Does A’s leadership commit a distinctive wrong? If so, against whom? (10 marks)  

  ---

  **Model Answer (approx. 850 words):**  

  **(a)** Symmetric curation *supports* the moral equality of combatants (MEC) by reinforcing the *epistemic ground* for the doctrine. My conclusion concerns *liability to be killed*: soldiers on both sides remain equally liable, as neither can be fairly expected to form accurate *jus ad bellum* beliefs.  

  The epistemic ground for MEC holds that combatants lack access to reliable information about the war’s justice, making blame for participation inappropriate. Here, curation exacerbates this ignorance while satisfying the truthfulness constraint. Crucially, *truthful curation is not deception* in the standard sense requiring falsehoods. Yet it manipulates cognitive biases by amplifying contextually true but misleading narratives (e.g., emphasizing enemy atrocities while omitting mitigating factors). Soldiers thus form *reasonable but false* beliefs about the war’s justice. Traditional MEC relies on soldiers being epistemically subordinate to leaders; here, leaders are equally deluded, but this *strengthens* the soldiers’ excuse. With no uncurated perspective available at any level, soldiers cannot redress their ignorance. Voluntariness is irrelevant: even volunteers cannot reasonably investigate truths systematically hidden by design.  

  This preserves MEC because both sides’ soldiers are symmetrically non-culpable for their ignorance. They are therefore *excused* for fighting, but crucially, this does not entail that killing them is *impermissible*. Liability turns on whether they *should* know their cause is unjust. Given the systems’ effectiveness, no soldier *could* form accurate beliefs; thus, neither is blameworthy. Consequently, they retain equal liability: combatants on just side A and unjust side B may permissibly kill each other.  

  The truthfulness constraint is pivotal. Unlike propaganda with falsehoods—where soldiers *might* detect inconsistencies—here, all briefings are internally coherent and factually verifiable *in isolation*. Soldiers thus possess *excellent evidence-relative reasons* to fight. However, their beliefs are *fact-relative* unjustified because curation obscures holistic moral truth. This distinction clarifies why liability remains: evidence-relative permissibility governs killing decisions, and soldiers on both sides act permissibly *given their evidence*.  

  **(b)** When *only A* uses the system, MEC collapses: **A’s combatants lose liability protection, while B’s retain it**. A’s leadership commits a distinctive wrong against *its own soldiers and enemy civilians*.  

  *Asymmetric curation* breaks the parity in epistemic excuses. B’s soldiers receive uncurated (though possibly flawed) information. They may thus form accurate *jus ad bellum* beliefs through ordinary moral reasoning. If B is objectively just, its soldiers are clearly liable targets. If B is unjust, its soldiers *might* still be excused if their factual ignorance is reasonable—but crucially, their epistemic position is *improved* by lacking systematic curation. They at least *could* access raw data, making their potential ignorance less blameless than in symmetry.  

  Conversely, A’s soldiers remain non-culpably ignorant due to state-designed curation. However, this excuse no longer preserves liability symmetry. Because *only A* manipulates its soldiers’ beliefs, and B’s soldiers face greater epistemic burdens, A’s combatants are *uniquely non-liable* if A is unjust. Yet they also pose threats to B’s soldiers who may now act with greater fact-relative justification. This asymmetry means A’s soldiers may be killed permissibly (if A is unjust), but B’s soldiers (if A is just) become more liable.  

  A’s leadership commits a distinctive wrong of *epistemic exploitation*. By outsourcing judgment to a system ensuring soldiers’ false confidence, it weaponizes their reasonable beliefs. This wrongs:  
  - *A’s soldiers*: By depriving them of autonomy to assess the war’s justice, rendering them unwitting tools of aggression.  
  - *B’s civilians*: By increasing the risk of unjust harm via soldiers who falsely believe their cause is just.  
  Unlike coercion (absent here), this wrong operates through cognitive manipulation that bypasses rational scrutiny while adhering to truth.  

  ---

  **Marking Scheme (25 marks total):**  
  1. **Correct MEC verdict for (a) with ground identified** (4 marks).  
     *Botch: Vague support/undermine without specifying epistemic ground.*  
  2. **Explicit focus on liability/justification/excuse** (4 marks).  
     *Botch: Sliding from "soldiers blameless" to "killing impermissible" or "cannot know" to "may kill".*  
  3. **Engagement with truthfulness constraint** (4 marks).  
     *Botch: Treating curation as ordinary deception/propaganda.*  
  4. **Analysis of soldier-statesman asymmetry removal** (3 marks).  
     *Botch: Ignoring leadership stipulation, defaulting to traditional hierarchy.*  
  5. **Asymmetric verdict in (b) with combatant differentiation** (5 marks).  
     *Botch: Concluding "neither liable" without addressing consequences.*  
  6. **Leadership wrong identified in (b)** (5 marks).  
     *Botch: Misattributing wrong to deception (not manipulation) or citing coercion (absent).*  

  **Boundaries:**  
  - **First-class (21+):** All 6 moves made; avoids named botches; acknowledges that symmetric evidence-relative permissibility ≠ fact-relative justification.  
  - **Good (16–20):** Hits moves 1–4 but wavers on asymmetry or leadership wrong; minor conflation of liability/permissibility.  
  - **Passing (13–15):** Correct MEC verdict in (a) but superficial on truthfulness/asymmetry; (b) partially addressed with errors.  
  - **Fail (<13):** Misidentifies MEC ground; ignores curation/voluntariness; asserts stalemate ("no one may fight") without argument.  

  **Full marks possible for either conclusion** (e.g., "undermines MEC" in (a) if arguing truthfulness enables culpable ignorance). Stronger view: *Supporting MEC in (a)* better handles the *inability* to detect curation (vs. negligence), aligning with evidence-relative liability. Weaker view: *Undermining MEC* must explain why truthfulness worsens culpability despite no falsehoods. Markers should reward argument rigor, not personal agreement.
