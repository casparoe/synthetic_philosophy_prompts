prompt: |-
  I'm a second year in a metaethics seminar and I built an argument for my term paper that my supervisor called "either trivial or unsound, work out which," and I can't work out which. It's supposed to show that the is-ought gap plus the open question argument together rule out justified normative claims altogether, which is a conclusion I definately don't want to be committed to. Here it is.

  (1) Deduction can't get out what you didn't put in: in a valid argument, nothing shows up in the conclusion that wasn't already in the premises. (2) Purely descriptive premises — anything you'd find in a physics or psychology paper — contain no normative terms. (3) So no valid argument from purely descriptive premises can have a normative conclusion. (4) And you can't sneak one in by definition either: if 'good' just meant some natural property N, then "is this N?" and "is this good?" would be the same question, but for any N you propose it still makes perfect sense to ask, of something everyone already agrees is N, whether it's good — so 'good' doesn't mean any natural property. (5) So a normative claim can only be supported by premises that are already normative. (6) And by (3), a normative premise can only be supported by further normative premises. (7) So any chain of justification for a normative claim either goes in a circle, goes back forever, or stops dead at a premise with no support at all. (8) Therefore no normative claim is justified.

  Seminar went sideways at (8). Another student said I could run the exact same argument with 'quark' in place of 'ought': no valid argument from premises without 'quark' in them can conclude that there are quarks, so quark claims can only be supported by premises already about quarks, so it's circles or infinite regresses or brute unsupported premises again, so no quark claim is justified either. I said that was obviously a bad parallel and she said "then say how its bad," and I couldn't. A couple of people also insisted that (3) isn't even Hume's point, that he was complaining about moralists who slide from 'is' to 'ought' without warning rather than announcing a theorem, but I don't see how that helps me, since (3) looks true on its own terms even if he never said it. So: which step do you reject, and why did it look so innocent going in? What does giving it up cost me — I'm attached to (1) because it seems to just be logic, and (4) is the one I'd sacrifice first, but I want to know whether (4) is bad in itself or only bad the way I've used it here, and whether there's any way to seperate the two problems. And is the quark version a genuine reductio of my argument, or is there a disanalogy I can actually point to in front of her?
reasoning: |-
  Okay, the user is a second-year student in a metaethics seminar who's struggling with a term paper argument. Their supervisor called it "either trivial or unsound," and they can't figure out which. The argument attempts to show that the is-ought gap plus the open question argument rule out justified normative claims altogether—a conclusion they don't want to endorse.  

  First, I need to parse their argument step by step. They've laid it out clearly:  
  (1) Deduction's limitation: conclusions can't contain new info not in premises.  
  (2) Descriptive premises lack normative terms.  
  (3) Thus, no valid argument from descriptive premises to normative conclusion.  
  (4) Open question argument: "good" can't be defined via natural properties.  
  (5) So normative claims need normative premises.  
  (6) By (3), normative premises require further normative support.  
  (7) Justification chains for normative claims lead to circles, regress, or brute stops.  
  (8) Therefore, no normative claim is justified.  

  The seminar derailed at (8). Another student swapped "quark" for "ought" and argued identically against scientific claims. The user couldn't counter that. Others questioned if (3) truly captures Hume's is-ought gap.  

  Hmm. The user's core distress is twofold: defending their argument's soundness while avoiding the nihilistic conclusion, and handling the "quark" reductio. They're emotionally attached to (1) and (4) but willing to sacrifice (4) if necessary. They also want to know if (4) is inherently flawed or just misapplied here.  

  The quark parallel is a brilliant reductio ad absurdum. If the argument structure works against "ought," it should work against "quark"—but we know quark claims *are* justified. So the original argument must be unsound. Where's the flaw?  

  Aha! The error lies in **step (6)**, which overgeneralizes. (3) says descriptive premises can't justify normative conclusions *on their own*, but (6) assumes normative premises *must* be justified solely by other normative premises. That ignores coherentist or foundationalist approaches where normative starting points gain support through reflective equilibrium, practical necessity, or their role in our conceptual framework.  

  For quarks, we don't demand pure deduction from non-quark premises. We infer quarks *abductively* from descriptive data (e.g., particle collision patterns) + background theories. Similarly, normative claims might be justified via abductive reasoning (e.g., "this principle best explains our moral intuitions and social practices") or pragmatic necessity.  

  (4)—Moore's open question argument—isn't wrong per se, but it's often seen as overstrong. Many naturalists (e.g., Railton, Boyd) argue "good" could refer to a natural property *rigidly* without being synonymous. The open question might persist due to semantics, not metaphysics.  

  What about Hume? The user's peers are right: Hume's point was about *unargued transitions* from "is" to "ought," not a logical theorem. But (3) is still defensible as a logical point—just not as lethal as the user thinks.  

  So, rejecting (6) saves normative justification without killing logic or the is-ought gap. The cost? Accepting that normative starting points might be "basic" in a way descriptive ones aren't, or that justification isn't always deductive. That’s a standard move in metaethics (e.g., ethical intuitionism).  

  For the quark reductio, the disanalogy is: scientific claims *do* connect to descriptive premises via abduction, while normative ones might need distinct justificatory paths. Pointing this out in seminar should defuse the parallel.  

  User’s deeper needs: They want to salvage their argument’s insights without imploding ethics. Showing them where they overstepped—and offering alternative justificatory models—should relieve their anxiety. They’re also likely embarrassed about the seminar clash and wants a clear comeback for the quark critic.
answer: |-
  Your argument is **unsound**, not trivial—and the flaw lies in **step (6)**, which misapplies the is-ought gap to create a false dilemma. Here's a breakdown of where things go wrong, why it seemed plausible, how to fix it, and why the "quark" reductio succeeds as a critique. I'll also address your concerns about (1) and (4).

  ### The Critical Mistake: Step (6) and Its Implications
  - **(1)–(3) and (5) are defensible**:  
    Yes, deduction can't extract "ought" from non-normative premises alone (Hume’s point, even if he framed it rhetorically). And normative conclusions require normative premises (5) follows from (3).  
  - **(4) is contestable but not the core problem**:  
    Moore’s open question argument (OQA) has well-known replies (e.g., "good" might refer to a natural property *without* being synonymous with it). But even if we grant (4), it doesn’t doom normative justification.  
  - **(6) is the misstep**:  
    You claim: *"a normative premise can only be supported by further normative premises."* **This is false.** It assumes the *only* way to justify a normative claim is through **deductive arguments** with explicitly normative premises. But justification isn’t limited to deduction!  

  ### Why (6) Seems Innocent (But Isn’t)
  - It looks like a direct extension of (3): *"If descriptive premises can’t justify normative conclusions, surely normative premises need normative support too?"*  
  - The error: **Normative premises can be justified non-deductively**—e.g., through:  
    - **Abductive reasoning**: Inferring the *best explanation* for observed phenomena (e.g., "democracy is just" best explains social stability and human flourishing).  
    - **Reflective equilibrium**: Testing normative principles against intuitions, revising both until coherence is achieved (Rawls).  
    - **Pragmatic or evolutionary foundations**: Normative starting points may be justified as necessary for rational agency or social survival (e.g., "pain is bad" as a precondition for decision-making).  
  - These methods allow descriptive facts to *support* normative premises without deducing "ought" from "is." Example:  
    > Premise 1 (Descriptive): Societies that torture dissenters collapse within 50 years.  
    Premise 2 (Normative): Societal collapse is *bad*.  
    Conclusion: Torturing dissenters is *wrong*.  
    Premise 2 isn’t "brute"—it’s supported by abductive/pragmatic reasoning (e.g., collapse frustrates human needs, which we have reason to avoid).

  ### Why the "Quark" Reductio Works (and How to Handle It)
  Your classmate is correct: Your argument structure *would* rule out justified claims about quarks, electrons, or any theoretical entity.  
  - **The parallel**:  
    - (3\*): No valid argument from premises without "quark" can conclude quarks exist. (True: you can’t deduce quarks from "I see a cloud chamber track" alone.)  
    - (6\*): A premise about quarks can only be supported by further premises about quarks. (False!)  
  - **Why it’s a disanalogy *against you***:  
    Scientific claims about quarks **are justified abductively**. We observe cloud chamber tracks (descriptive) and infer quarks as the *best explanation* given background theories. No "quark"-loaded premises are needed to start the chain.  
  - **The disanalogy you can assert**:  
    > "Normative claims *can* be justified similarly: via inference to the best explanation, coherence with empirical facts, or practical necessity. The 'quark' analogy actually refutes step (6) by showing that justification doesn’t require premise-conclusion term-matching—it requires **explanatory coherence**."  

  This forces your critic to engage your positive account of normative justification (e.g., "What makes abduction valid for science but not ethics?").

  ### Salvaging Your Insights Without Nihilism
  - **Keep (1)–(3) and (5)**: They highlight a real constraint: no *deductive* shortcuts from "is" to "ought."  
  - **Revise (4) or limit its scope**: The OQA shows "good" isn’t *synonymous* with natural properties, but it doesn’t prove they aren’t *identical* (see Railton’s naturalistic reductionism).  
  - **Reject (6) and (7)**: Justification chains can terminate in premises supported non-inferentially (e.g., foundational moral truths) or holistically (e.g., reflective equilibrium).  
  - **Cost of rejecting (6)**: You must accept that normative claims can be "basic" in a way that’s responsive to evidence without being deduced from it—a common move in ethics (e.g., Scanlon’s contractualism).  

  ### What About Hume?
  Your peers are half-right. Hume *was* criticizing surreptitious "is-ought" slides, but (3) *is* a fair reconstruction of his logical point. It doesn’t help you, though, because Hume wasn’t arguing for normative skepticism—he offered his own normative theory grounded in human sentiments and desires.

  ---

  ### Key Fix: Justification Isn’t Deduction Alone
  Your argument assumes all justification is **deductive transmission of semantic content**. But real-world justification (in science *and* ethics) relies on:  
  - **Abduction** ("best explanation"),  
  - **Coherence** (fit with existing beliefs/observations),  
  - **Pragmatic foundations** (inescapable presuppositions of agency).  

  Once you recognize this, (8) vanishes. Normative claims *can* be justified—just not by deduction alone. The quark analogy doesn’t refute the is-ought gap; it refutes a **crude deductivist theory of justification**. Use that insight to refine your metaethics, not abandon it.
