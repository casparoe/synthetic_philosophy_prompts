  ### **Decision Tree: Reasons Without Reasoners**  
  *Instructions: Answer each question based on the case or claim. Work downward – do not skip ahead.*  

  1. **Node 1 (Cheetah’s spine):** The flexible spine of a cheetah (unseen by any designer or cheetah) helps it run faster. Is this functional benefit a ‘rationale’ *at all*?  
     - **Yes** → Go to Node 2.  
     - **No** → Go to Node 3.  

  2. **Node 2 (Cheetah’s spine as normative):** Is this rationale a *reason* for anyone (e.g., a reason to preserve such spines)?  
     - **Yes** → **Leaf A: Normative Functionalism**  
       *Awkward commitment: Must explain why harmful functions (e.g., a parasite’s virulence) don’t yield equivalent reasons.*  
     - **No** → Go to Node 3.  

  3. **Node 3 (Valley of flowers):** Rare flowers on an uninhabited island are destroyed unseen. Was something of *value* lost?  
     - **Yes** → Go to Node 4.  
     - **No** → Go to Node 5.  

  4. **Node 4 (Flowers entail reasons):** Does the loss of value entail there was a reason to prevent it (e.g., for someone to act)?  
