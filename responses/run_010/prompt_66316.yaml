  We are building a decision tree to classify positions on "reasons without reasoners". The tree should have about 10 nodes (questions) and 7-9 leaves (positions). Each node is a case or claim that can be answered without knowing the destination. The leaves should cover at least: 
  - Reasons require an actual reasoner.
  - Value floats free and reasons go with it (normative realism).
  - Deflationist view (equivocation between explanation and normativity).
  - Reasons held by roles/offices/groups.
  - Reasons belonging to merely possible people.

  We'll use the cases provided and possibly add others. The logical space is defined by key questions:

  Key Questions (to structure the tree):
  1. Does a reason require an actual being that could be moved by it? (Actual mover)
  2. Does a reason require at least a possible valuer? (Possible valuer)
  3. Is the Dennettian 'rationale' (explanatory) distinct from normative reasons? (Explanatory vs. Normative)
  4. Can reasons attach to an office/collective without individual endorsement? (Collective reasons)
  5. Must the good be good for somebody? (Good-for)

  We must avoid nodes that ask directly about moral realism. Instead, we use cases to elicit commitments.

  Proposed cases (from the user and added ones):

  1. Valley of rare flowers (uninhabited island, destroyed by eruption) - impersonal value?
  2. Cheetah's spine (free-floating rationale) - explanatory, not normative?
  3. Trust with dead settlor and child beneficiaries - reasons held by the office?
  4. Policy with payoffs 1000 years hence - reasons for future people?
  5. Chess position that calls for a move that no player notices - is the reason there? whose?
  6. Committee that votes for a plan every member thinks is bad - group reason without individual reasons?
  7. Hypothetical ideal observer - reasons grounded by a non-existent being?

