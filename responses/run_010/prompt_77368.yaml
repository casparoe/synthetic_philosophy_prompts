  The twist: in this case, the statue might be thought to persist through the disassembly and reassembly because of the conservator's intention, while the lump of clay might not be thought to persist when scattered.

  Setting: a conservation studio, with the reassembled statue.

  Characters:
  - Coincidentalist (C): Believes the statue and the clay are two numerically distinct objects that are wholly present in the same place at the same time.
  - Perdurantist (P): Believes in temporal parts; the statue and the clay are distinct four-dimensional wholes that share some temporal parts but not all.

  Points to cover:
  1. What happened to the fragments? 
  2. How many things were on the pedestal before the fall?
  3. How each view explains the advantage the statue has in this case (persisting through disassembly and reassembly) and whether the lump persists.

  Each must press the other on the above.

