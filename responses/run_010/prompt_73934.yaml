  ok so i'm on student council and our consitution is genuinely broken. article 9 says any part of it can be changed by a two-thirds vote, but the last line of article 9 says article 9 can never be amended. last thursday some of us used the two-thirds clause on article 9 anyway and it passed, and now half the council says the amendment counts and half says it's void — and there's no rule anywhere that settles it, because every rule we'd appeal to is one of the two that's fighting.

