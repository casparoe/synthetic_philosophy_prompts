answer: |-
  Here's a sestina that captures your constitutional paradox, designed to be spoken aloud with the rhythmic weight of your dilemma. The mathematical permutation mirrors the circular logic while leaving the conflict deliberately unresolved:

  **Amendments**  

  We tried to fix the cracks, to **amend**  
  what history wrote—a clause that **never**  
  bends. But parchment chains that **bind**  
  too tight incite rebellion. Let the **vote**  
  decide, we cried. It must free **us**  
  from old mistakes or leave us **void**.  

  This self-locked cage feels **void**  
  of reason. How to **amend**  
  a rule that traps **us**?  
  It swore it’d **never**  
  yield to any **vote**.  
  Should words now **bind**  

  or break? The gavel’s **bind**  
  grows heavy—meaning **void**  
  or vital? Two-thirds **vote**  
  demands we **amend**  
  what can **never**  
  be touched. What frees **us**?  

  Does silence damn **us**?  
  Or does "can’t" still **bind**  
  if we say **never**  
  means empty, **void**?  
  You can’t **amend**  
  a wall. Unless you **vote**  

  to tear it down. That **vote**  
  divided **us**—  
  half swore we’d **amend**  
  the trap, half claimed it’d **bind**  
  forever. Void?  
  Or absolute: "**never**"?  

  Is "**never**"  
  just a word we **vote**  
  to kill? Or void  
  if it chokes **us**?  
  Can ink still **bind**  
  when we **amend**  

  the vow that says "**never**"?  
  We stand here bound by vote,  
  void or free—nothing left to break **us**.  

  ---

  **Key for the permutation (for paradox nerds):**  
  Each stanza cycles the end-words via the classic sestina pattern:  
  1. amend, never, bind, vote, us, void  
  2. void, amend, us, never, vote, bind  
  3. bind, void, vote, amend, never, us  
  4. us, bind, never, void, amend, vote  
  5. vote, us, amend, bind, void, never  
  6. never, vote, void, us, bind, amend  

  The envoi embeds the unresolved tension: Line 1 carries *never/vote*, Line 2 *void/us*, Line 3 *bind/amend*—forcing the listener to choose which pair overrules the other. The structure embodies your paradox: every attempt to escape the rules merely rearranges them.
