    I think we have to use the quadratic and allow fractional scores or precomputation.

    Since the number of trials is limited, we can have the students keep a running total of a score that is the quadratic score scaled by 100. For a posted credence p (integer from 0 to 10), let s = p/10.
    - If the event happens: score = 100 * [1 - (1-s)^2] = 100 * [1 - (1 - 2s + s^2)] = 100 * (2s - s^2) = 20p - p^2.
    - If not: score = 100 * [1 - s^2] = 100 - p^2.

    For example, if they post p=7 and the event happens, score = 20*7 - 7^2 = 140-49=91.
    If not, score = 100 - 49 = 51.

    This is computable with multiplication and subtraction. The students can do it with paper and pencil.

    Why it rewards honest posting: If a student's true credence is q, then the expected score if they post s is:
      q * [2s - s^2] + (1-q) * [1 - s^2] = q(2s - s^2) + (1-q)(1 - s^2) = 2q s - q s^2 + 1 - s^2 - q + q s^2 = 2q s + 1 - s^2 - q.
      = 1 - q + 2q s - s^2.
    This is a quadratic in s: -s^2 + 2q s + (1-q).
    The maximum is at s = q. 
    So they are incentivized to post s=q.

    Where the explanation fails: The students cannot compute expected scores for arbitrary rules, so they may not know that this rule incentivizes honesty. The facilitator can explain that this rule is designed so that if they are honest, in the long run they will get a higher score, but for a small number of trials, it might not hold. For this activity, we assume they trust the rule.

  ## 5. A Cross-Group Market
  - **Setup:** Each group is assigned one device. They are given the sentence: "A randomly chosen chord is longer than a side of the triangle." They are to post a buying price and a selling price for a ticket that pays 1 token if the sentence is true, 0 otherwise. But the sentence is the same for all, but in each group, "randomly chosen" means according to their device.

  - **Trading:** Groups can trade with each other. The outcome is that no arbitrage arises because the sentence is interpreted differently.

  - **Facilitator's script:** 
    - "Groups, you have been using different methods to generate chords. When you hear 'a randomly chosen chord', you each have in mind your own method. So the sentence 'a randomly chosen chord is longer than a side of the triangle' has a different meaning in each group. For Group 1, it means the probability from the endpoint method. For Group 2, it means from the radius method, and so on. Therefore, when Group 1 says the probability is 1/3, and Group 2 says 1/2, they are not disagreeing about the same proposition. They are talking about different things. This is why you see different prices and why there is no arbitrage opportunity: because the ticket in Group 1 pays off based on Group 1's method, while in Group 2, it pays off based on Group 2's method, and so on."

  - **Underlying point:** The sentence expresses a different proposition for each group because the method of random selection is different. The bare sentence is ambiguous. This is the essence of the paradox.

  ## 6. Sample Sizes and Statistical Power
  - **Number of trials per device:** With 18 students, divided into 4 groups ( sizes approximately 4 or 5). Each group does one device. In 75 minutes, we have:
    - Setup: 5 minutes
    - Generate chords: say 1 chord per 30 seconds? Including recording. For 20 trials per group, 10 minutes.
    - But we have multiple activities: the audit, the market, etc.

    Realistically, each group can do 10 trials in the initial batch.

  - **Can the class distinguish the four values?** The values are 1/3≈0.333, 1/2=0.5, 1/4=0.25, and for Device 4, 1/2. So we have three values: 0.25, 0.333, 0.5.

    For a group of 4 students doing 10 trials, the standard error for the proportion is sqrt(p(1-p)/10) ≈ for p=0.5, it's 0.158; for p=0.25, it's 0.137. So the 95% confidence interval is about ±0.3 to ±0.27, which overlaps. So with 10 trials, they cannot distinguish.

    Therefore, we use pooled class totals. Each group does 10 trials, but the groups with the same device are combined. Since there are 4 groups, but two devices (2 and 4) have the same probability, we have three device types. Device 1: 1 group, 10 trials. Device 2 and 4: two groups, 20 trials. Device 3: 1 group, 10 trials.

    But the class has 18 students, so we have 4 groups: sizes 4,4,5,5. Two groups will do Device 2 and 4? But we have four devices, so one group per device.

    Device 1: group1, 4 or 5 students, 10 trials.
    Device 2: group2, 10 trials.
    Device 3: group3, 10 trials.
    Device 4: group4, 10 trials.

    Then we have:
      Device 1: n=10, p=1/3 -> expected number of long chords: 3.33
      Device 2: n=10, p=1/2 -> expected 5
      Device 3: n=10, p=1/4 -> expected 2.5
      Device 4: n=10, p=1/2 -> expected 5

    The observed number will have variance: for Device 1: variance = 10*(1/3)*(2/3) = 20/9≈2.22, std.dev=1.49. So observed number might be from 1 to 5 or 6. Similarly, Device 3: variance=10*(1/4)*(3/4)=30/16=1.875, std.dev=1.37, so observed 1 to 4. Device 2 and 4: variance=10*0.5*0.5=2.5, std.dev=1.58, observed 2 to 8.

    It will be hard to distinguish Device 1 (expected 3.33) from Device 2 (5) with 10 trials. 

    Therefore, we increase the number of trials to 20 per group. With 20 trials, for Device 1: expected 6.67, std.dev=sqrt(20*1/3*2/3)=sqrt(40/9)≈2.11, so observed might be 2 to 11. Device 2: expected 10, std.dev=sqrt(5)≈2.24, observed 5 to 15. Device 3: expected 5, std.dev=sqrt(20*1/4*3/4)=sqrt(15/4)≈1.94, observed 1 to 9. Device 4: same as Device 2.

    The ranges overlap. 

    Therefore, we use a pre-computed table of results from a larger sample, revealed after they have collected their own data. The table will show the distinct values. We can say: "Here are the results from a larger experiment: Device 1: 333/1000, Device 2: 500/1000, Device 3: 250/1000, Device 4: 500/1000."

    Defend against handing them the answer: The students have already collected their own data and seen the variation. The facilitator can explain that with small samples, the results can be noisy, so we use a large sample to see the underlying probability.

  ## 7. Minute-by-Minute Timeline
  - **Before students arrive (5 minutes):** 
    - Arrange desks in four groups.
    - Distribute materials to each group: worksheets, card ring, reduced worksheet, pre-cut string, tally sheets, tokens, and device-specific materials (spinners, dice, etc.).

  - **0-5 minutes (5 minutes):** 
    - Students enter and sit in groups.
    - Facilitator distributes the puzzle worksheet and reads it aloud: "An equilateral triangle is inscribed in a circle. A chord of the circle is chosen at random. What is the probability that the chord is longer than a side of the triangle?"
    - Instructions: "In your groups, you will use a device to generate random chords and estimate this probability. But first, without discussion, each group will be assigned a device."

  - **5-10 minutes (5 minutes):**
    - Assign devices to groups. Give each group instructions for their device.
    - Explain the string criterion: "You have a string cut to the length of the triangle's side. For each chord, compare it to the string to decide if it is longer."
    - Explain the scoring: "Before each chord is generated, you will post your credence (using tokens) for the event that it will be longer. Then, after we know the outcome, your score will be calculated."

  - **10-30 minutes (20 minutes):**
    - Groups generate 20 chords with their device. For each chord:
        - Before generating, each student posts credence.
        - Generate the chord.
        - Decide if longer.
        - Record the outcome and compute scores.
    - They record the number of long chords.

  - **30-40 minutes (10 minutes):**
    - Nested-circle audit.
        - Groups write prediction: which devices will pass both tests.
        - Groups do the audit for their own device: generate 10 chords on the reduced worksheet and compute the proportion. 
        - Then, for the large worksheet, generate 10 chords, then use the ring to draw a smaller circle (radius 0.55R) concentric and generate 10 chords for it. Then move the ring off-center, draw the circle, and generate 10 chords for it. 
        - Compare the proportions for the three (large, reduced, concentric small, off-center small). 
        - Record whether the proportion for the event is the same (within sampling error) across the scale and whether it is the same in the concentric and off-center small circles.

  - **40-50 minutes (10 minutes):**
    - Groups report their probability estimate and whether their device passed the audit.
    - Facilitator records on board: Group1 (Device1): prob1, passed?; etc.

  - **50-60 minutes (10 minutes):**
    - Cross-group market.
        - Facilitator writes the sentence on the board: "A randomly chosen chord is longer than a side of the triangle."
        - Each group posts a buying price and selling price for a ticket that pays 1 token if true (according to their device).
        - Trading opens: groups can trade with each other for 5 minutes.
        - Then facilitator stops and explains why no arbitrage arose.

  - **60-75 minutes (15 minutes):**
    - Debrief: 
        - Reveal the name "Bertrand's paradox" and "principle of indifference".
        - Discuss why the methods give different answers.
        - Discuss the audit results.
        - Discuss what is left standing.

  ## 8. The Debrief
  - **Map activity to concepts:**
    - The conflict encounter: when groups reported different probabilities.
    - Each device treats a different quantity as uniform: 
        - Device 1: arc length uniform.
        - Device 2: distance along a radius uniform.
        - Device 3: area uniform.
        - Device 4: the measure on lines uniform (which is the same as in Device 2).
    - Applying indifference to these quantities are different acts.
    - The four devices are not exhaustive; many others are possible.
    - The scale and translation tests: only Device 3 passed both, but this is because we are measuring the event relative to the circle. The tests themselves depend on the assumption that the probability should be invariant under symmetries of the circle.
    - What is left standing: the activity shows that the principle of indifference can be applied in different ways, leading to different results. The resolution is that the problem is ill-posed without specifying the method.

  - **What a student should be able to say:** "The probability of a chord being longer than the triangle's side depends on how you choose the chord at random. Different methods that seem equally natural can give different results."

  ## 9. Predictable Failures and Remedies
  1. **Hand-generated randomness biased:**
     - Failure: Students subconsciously avoid certain values.
     - Remedy: Use dice or spinners for randomization.

  2. **Clustering in midpoint device:**
     - Failure: When choosing a point inside the disk, students might tend to choose the center.
     - Remedy: Use the dice-based method with rejection.

  3. **Straws landing outside or tangent:**
     - Failure: Many tosses are wasted.
     - Remedy: Have many straws and allow quick retoss.

  4. **Group reverse-engineering:**
     - Failure: A group guesses the intended lesson and reports accordingly.
     - Remedy: The facilitator should not reveal expectations and should emphasize honest reporting.

  5. **Market phase dominated by one student:**
     - Failure: One confident student sets the prices for the group.
     - Remedy: Assign roles within the group or have secret ballot for prices.

  6. **Noisy data:**
     - Failure: The empirical proportions are too close to distinguish.
     - Remedy: Use the precomputed large sample table.

  ## 10. The Honest Limitation
  - **Limitation:** The activity assumes a generating mechanism, but the original question specifies none. The step of abstracting back to the bare question is missing.
  - **Recovering the step:** In the debrief, the facilitator says: "Notice that in the puzzle, no method is specified. We supplied methods, but the question is about a chord chosen at random without any method. So the exercise shows that the question is ambiguous. The probability is not defined until we specify how we choose the chord."
  - **Force lost:** The students might come away thinking that the probability is subjective or that there are multiple correct answers, but the puzzle's force is to challenge the principle of indifference. This is not lost, but the activity might not fully convey the depth of the ambiguity in the bare question.

  Given the complexity and constraints, this is a best-effort design.
answer: |-
  ### Materials List
  - **Paper**: Worksheets with a large circle (radius 10 cm) and inscribed equilateral triangle for each student; tally sheets.
  - **Card stock**: Cut into rings (inner radius 5.5 cm, outer radius 6 cm) for each group; spinner bases for Devices 1 and 2.
  - **Pins**: To attach spinner pointers and fix points.
  - **String**: Pre-cut to the length of the triangle’s side (for comparison); additional string for drawing chords.
  - **Drinking straws**: For Device 4; cut to 15 cm lengths.
  - **Ruler**: For measuring and drawing.
  - **Protractor**: For measuring angles and drawing perpendiculars.
  - **Dice**: Two standard six-sided dice per group for randomization.
  - **Coins**: For additional randomization if needed.
  - **Photocopier**: Produce reduced worksheets (60% scale, circle radius 6 cm).
  - **Tokens**: 10 per student (e.g., paper chips) for scoring.
  - **Tally sheets**: Pre-printed tables for recording chords (trial number, credence, outcome, score) and audit results.

  ---

  ### 1. No Framing Lecture
  - **Instructions**: Begin the session by dividing students into four groups of 4–5. Distribute worksheets and briefly state: "Here’s a puzzle: An equilateral triangle is inscribed in a circle. A chord is chosen at random. What’s the probability it’s longer than a side? Work in groups with your assigned device to generate chords and estimate this probability." Do not mention "Bertrand’s paradox," "principle of indifference," or the puzzle’s name.  
  - **Reveal timing**: After all groups report their empirical probabilities (minute 40), write "Bertrand’s paradox" and "principle of indifference" on the board. Justify: "The conflict is now apparent; naming it earlier would bias their initial reasoning."

  ---

  ### 2. Four Generating Devices
  **Shared criterion for "longer than a side"**: Use the pre-cut string (length = triangle side). Lay it along the generated chord; if the chord extends beyond both ends, it is longer. Reveal why this works (midpoint distance < R/2) during the debrief (minute 60) to avoid premature insight.

  #### Device 1: Two endpoints on the circumference  
  - **Construction**: Attach a straw pointer to a card-stock spinner (divided into 360°) with a pin.  
  - **Procedure**: Spin twice to get angles θ₁ and θ₂. Mark points A and B on the circumference. Draw chord AB.  
  - **Theoretical probability**: 1/3.  
  - **Derivation**: Fix A. Chord length depends on arc AB. For chord > side, arc AB must be >120° or <240° (central angle >120°). Favourable arcs: 120° out of 360°. Probability: 120/360 = 1/3.  

  #### Device 2: Direction and point along a radius  
  - **Construction**: Card-stock spinner for direction; ruler on a fixed radius.  
  - **Procedure**: Spin to choose a direction; draw that radius. Roll two dice to get k (1–36); set d = (k/36) × R. Mark point at distance d from center. Draw chord perpendicular to radius at that point.  
  - **Theoretical probability**: 1/2.  
  - **Derivation**: Chord length > side iff distance from center to chord (d) < R/2. d is uniform on [0, R], so P(d < R/2) = (R/2)/R = 1/2.  

  #### Device 3: Point inside the disk as midpoint  
  - **Construction**: Worksheet with a square of side 2R circumscribing the circle.  
  - **Procedure**: Roll two dice for x-coordinate k (1–36), x = R × (2k/36 - 1). Roll two dice for y-coordinate l (1–36), y = R × (2l/36 - 1). If (x, y) outside circle, reroll. Use (x, y) as midpoint; draw perpendicular chord.  
  - **Theoretical probability**: 1/4.  
  - **Derivation**: Chord > side iff midpoint lies within a circle of radius R/2. Area ratio: [π(R/2)²] / [πR²] = 1/4.  

  #### Device 4: Straw tossing  
  - **Construction**: None; use drinking straws.  
  - **Procedure**: Toss a straw onto the worksheet. If it intersects the circle at two points, extend/truncate to a chord. If tangent or no intersection, re-toss.  
  - **Theoretical probability**: 1/2.  
  - **Derivation**: Same as Device 2. The invariant measure for lines (direction + uniform d) yields P(d < R/2) = 1/2.  

  ---

  ### 3. Nested-Circle Audit
  - **Materials**: Card ring (inner radius 5.5 cm); reduced worksheet (60% scale).  
  - **Procedure**:  
    1. Before generating chords, each group predicts which devices will pass two tests:  
       - **Scale test**: Patterns/proportions on the reduced worksheet match the large worksheet.  
       - **Translation test**: Patterns/proportions of chords inside the ring are indistinguishable when concentric versus off-center.  
    2. Groups generate 10 chords on their large worksheet.  
    3. Place the ring concentrically; record chords entirely inside it.  
    4. Move the ring off-center (e.g., 3 cm from center); record chords inside it.  
    5. Generate 10 chords on the reduced worksheet.  
    6. Compare patterns and proportions across tests.  
  - **Pass/fail**:  
    - **Pass (both tests)**: Device 3 (uniform area).  
    - **Fail (one or both)**: Devices 1, 2, 4.  
  - **Explanation to students**: "The tests check if your device treats all circle regions and scales equally. Only Device 3 does this because it weights every area the same. The tests assume that ‘random chord’ should be scale- and translation-invariant."  
  - **Opposite prediction**: Show Device 3’s uniform area density vs. others’ non-uniformity (e.g., Device 1 overweights circumference).  

  ---

  ### 4. Posted Credences and Scoring
  - **Scheme**: Each student has 10 tokens. Before each chord is generated, they distribute tokens between "longer" (L) and "not longer" (N) boxes. Posted credence = tokens in L ÷ 10.  
  - **Scoring rule**: After outcome:  
    - If chord longer: score = 20p - p² (where p = tokens in L).  
    - If not longer: score = 100 - p².  
    (Example: p=7, outcome longer: 20×7 - 49 = 91; not longer: 100 - 49 = 51.)  
  - **Honesty justification**: "This rule (quadratic scoring) rewards accurate credence posting. If your true belief is q, posting p=q maximizes expected score."  
  - **Limitation**: Students cannot verify this without computing expectations, but the rule is standard and proper; emphasize long-run incentives.  

  ---

  ### 5. Cross-Group Market
  - **Setup**: Each group is assigned one device. Sentence: "A randomly chosen chord is longer than a side of the triangle."  
  - **Procedure**: Groups post buy/sell prices (in tokens) for a ticket paying 1 if true. Trade for 5 minutes.  
  - **Facilitator script (minute 50)**:  
    "Groups, you’ve used different devices. When you trade, you assume ‘random chord’ means your device. Group 1: endpoints (1/3). Group 2: radius distance (1/2). Group 3: midpoint (1/4). Group 4: straws (1/2). The sentence expresses different propositions per device. No arbitrage arises because the ticket pays out based on different experiments."  
  - **Underlying point**: The sentence is ambiguous; "random" is undefined, so probabilities are device-relative.  

  ---

  ### 6. Sample Sizes and Statistical Power
  - **Trials per device**: 20 per group (total 80 chords).  
  - **Power calculation**: With n=20, std. error for p=0.25–0.5 is 0.1–0.11. Differences (e.g., 0.25 vs. 0.33) are <1 std. error apart, so class cannot distinguish empirically.  
  - **Substitution**: Use pre-computed table (revealed after data collection) with 1000 trials:  
    - Device 1: 333/1000  
    - Device 2: 500/1000  
    - Device 3: 250/1000  
    - Device 4: 500/1000  
  - **Defense**: "Small samples are noisy; this shows the underlying probabilities without handing you the answer—your data still illustrates variation."  

  ---

  ### 7. Minute-by-Minute Timeline  
  - **0–5 min**: Students enter. Set up groups, distribute worksheets, read puzzle.  
  - **5–10 min**: Assign devices, explain string criterion and scoring.  
  - **10–30 min**: Groups generate 20 chords, post credences, record outcomes/scores.  
  - **30–40 min**: Audit: Predict, test on large/reduced worksheets and ring (concentric/off-center).  
  - **40–50 min**: Report probabilities and audit results; write "Bertrand’s paradox" on board.  
  - **50–60 min**: Market: Groups post prices, trade.  
  - **60–75 min**: Debrief: Map devices to concepts, discuss tests, limitations.  

  ---

  ### 8. The Debrief  
  - **Map activity**:  
    - **Conflict**: Groups reported 1/3, 1/2, 1/4—exposing indeterminacy before naming the paradox.  
    - **Uniform quantities**: Device 1 (arc length), Device 2 (radial distance), Device 3 (area), Device 4 (line measure).  
    - **Different acts**: Indifference applied to arc length, radial distance, or area yields different densities; not a single act done badly.  
    - **Non-exhaustive**: Other devices (e.g., random endpoint + direction) exist; infinitely many answers possible.  
    - **Tests**: Scale/translation tests favor Device 3 but assume "random chord" implies geometric invariance. They don’t resolve which device answers the bare puzzle.  
    - **Outcome**: No unique probability; the puzzle requires a specified mechanism.  
  - **Student takeaway**: "The probability depends on how ‘random chord’ is defined; no single answer is universally correct."  

  ---

  ### 9. Predictable Failures and Remedies  
  1. **Biased hand-randomness**: Students spin spinners unevenly.  
     - *Remedy*: Use dice for coordinates (Devices 2,3); supervise spinner use.  
  2. **Midpoint clustering**: Students pick disk center frequently.  
     - *Remedy*: Enforce dice-based rejection sampling; demonstrate uniform distribution.  
  3. **Straw issues**: Tangents, outsides, or bunching.  
     - *Remedy*: Use 10+ straws; allow rapid re-tosses; ignore near-tangents.  
  4. **Reverse-engineering**: Group guesses "trick" and reports 1/3.  
     - *Remedy*: Stress honesty; focus on their device’s results.  
  5. **Market domination**: One student sets all prices.  
     - *Remedy*: Assign roles (e.g., trader, recorder); secret ballot for prices.  
  6. **Noisy frequencies**: Values overlap (e.g., 0.33 vs. 0.25).  
     - *Remedy*: Use pre-computed table; discuss sampling variation.  

  ---

  ### 10. Honest Limitation  
  - **Limitation**: The activity assumes a generating mechanism, but the puzzle has none. The abstraction to the bare question is lost.  
  - **Recovery step**: During debrief (minute 65), state: "The puzzle says ‘chosen at random’ without any device. We added mechanisms to resolve ambiguity. Without one, the question has no unique answer."  
  - **Force lost**: The raw paradox’s challenge—that indifference alone fails—is softened by providing mechanisms. Despite this, students still experience the core conflict.  

  --- 

  **Final Note**: Run the activity as a guided exploration; emphasize process over "correct" answers. The goal is to confront ambiguity in probability, not to solve the paradox.
