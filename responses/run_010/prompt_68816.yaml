  ## 4. Posted Credences and Scoring
  - **Scheme:** Each student has a set of tokens (say 10) to express their credence. They can distribute the tokens between two boxes: one for "longer", one for "not longer". The number of tokens in "longer" divided by 10 is their posted credence.

  - **Scoring rule:** Use the quadratic scoring rule. For a posted credence p (between 0 and 1), if the event happens (the chord is longer), the score is 1 - (1-p)^2; if not, the score is 1 - p^2. But these scores are not integers. 

    Simplified: Since we have tokens, after each chord is generated and its status (longer or not) is determined, the student receives a score in tokens. The score is:
      - If the event happens: they receive 2p tokens (where p is the number of tokens they placed on "longer", so p in {0,1,2,...,10}).
      - If the event does not happen: they receive 2(10-p) tokens.
    But then the expected tokens if they are honest: if their true credence is q, then expected tokens = q * 2p + (1-q) * 2(10-p) = 2[ q p + (1-q)(10-p) ].
    We want this to be maximized when p=10q. But this is not the quadratic score.

