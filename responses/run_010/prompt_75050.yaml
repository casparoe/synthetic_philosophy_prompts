prompt: |-
  I'm TAing a 75-minute section on Kant's universalizability test next week — about 25 second-years, seminar room with a whiteboard and no slides. They've read the Groundwork up through the four examples (the man worn down by suffering who's thinking of ending it, the borrowed money, the talent left to rust, the one who shrugs at other people's misery), and by the end I want them able to run the test on a case they haven't seen. Don't explain the test to me — I've read it, what I can't get right is the sequencing. Plan the 75 minutes.

  Most of all I need the dependency order worked out. Does "what counts as a maxim and how do you write one down" need to be its own step before universalization, or am I burning ten minutes on something they'd pick up in practice? Are the two failure modes — the maxim that can't even be conceived as a universal law, and the one that can be conceived but not willed — two separate tests or one test failing at two depths, and which of those stories is less damaging to tell beginners? And where does the law-of-nature version of the formula go: same slot, later, or not at all? I know from experience that if I say "law of nature" before they've got the mechanism, three of them start talking about what's natural.

  Last year three things went wrong and I want the plan built around them:

  1. Half the room ended up doing rule-utilitarian arithmetic — "if everyone did that the institution of promising would collapse, therefore it's wrong" — and left thinking they'd applied Kant. I don't know where to intervene. Too early and I'm just asserting a distinction they can't feel; too late and it's set.

  2. Someone noticed you can describe your action more or less narrowly, and from there it was a short hop to "so you can always gerrymander a maxim until it passes," and then a third of them decided the whole thing was empty. I think this is really a maxim-specification problem that needs head-on treatment, but "make sure your reason for acting is in the maxim" didn't land when I tried it.

  3. The second failure mode collapsed into "you'd hate it if everyone did that." Prudence, basically.

  Tell me which of Kant's four examples should carry the section and which to drop or postpone — and note that I'd rather not lean on the borrowed money, precisely because it's the one that makes the collapse in (1) feel so natural. Would it help to build the thing on a case they can't have inherited intuitions about? I was toying with: a postdoc who quietly pads the reference list of every paper she submits with three citations to her own earlier work, in a field where everyone does some of this and nobody checks. Give me your honest view on whether that carries both failure modes and the maxim problem, what a carrying example has to have and what it has to lack, and a backup if it doesn't work.

  Then: the misconceptions you expect, in the order you expect them, and for each one the point in the sequence where I defuse it plus the sentence or question that does the defusing. And one thing I can have them do in the last ten minutes that would show me the idea landed rather than that they memorized a procedure — including what a failure on it looks like as distinct from a success.

  Finally be blunt about what to cut and say I'm cutting. I know the humanity formula isn't happening. But I also have opinions about whether Kant's own despairing-man example actually works (it looks to me like it needs a premise about what self-love is *for*), and about whether the perfect/imperfect duty labels map onto the two failure modes as cleanly as everyone says. Tell me which of those to flag upfront as a known limitation, which to dangle in the last five minutes as bait for the strong students, and which to just not raise at all.
reasoning: |-
  Okay, the user is a TA preparing a 75-minute section on Kant's universalizability test for second-year students. They've read the Groundwork up through the four examples. The main challenges are sequencing the lesson effectively, avoiding common misconceptions, and ensuring students can apply the test to new cases.

  First, I need to consider the key dependencies. The user mentioned three main issues from last year: students confusing Kant with rule-utilitarianism, gerrymandering maxims, and misinterpreting the second failure mode as prudence. The sequencing must address these upfront.

  Starting with maxim formulation is crucial. Without a clear maxim, the test falls apart. But spending too long on theory might lose them. Maybe a brief intro with examples, then practice. The postdoc citation example seems good—it's modern, lacks strong intuitions, and can illustrate both failure modes.

  The two failure modes should be taught sequentially. First, show contradictions in conception (like the lying promise), then contradictions in will (like neglecting talents). Using Kant's talent example avoids the rule-utilitarian trap. The suicide example is tricky because it relies on the purpose of self-love, so save it for later or skip.

  For misconceptions: rule-utilitarianism confusion often arises when students focus on consequences. Emphasize that Kant cares about the maxim's logical structure, not outcomes. Gerrymandering maxims can be countered by stressing that the reason must be included. The prudence issue in the second failure mode needs clarification that it's about rational willing, not personal dislike.

  The law of nature formulation should come after they understand the basic test, to avoid conflating with natural laws. Use it as a metaphor to illustrate universality.

  Activity-wise, a new case in the last 10 minutes, like cutting in line. Success looks like identifying the correct failure mode with proper maxim; failure shows confusion between steps or misconception.

  Cut the humanity formula and perfect/imperfect duties. Mention the suicide example's complexity as a footnote for strong students. Focus on core mechanics to build confidence.
answer: |-
  Here's a battle-tested 75-minute plan focused on sequencing, misconception avoidance, and application, built around your pain points. The core strategy: **Delay Kant's examples initially, use a novel case to teach the mechanics, then apply to Kant *after* they have the tool.**

  **Core Sequencing Principle:** Maxim Formulation FIRST. You **must** burn 10-15 minutes on this explicitly. It's the foundation. Without it, universalization crumbles into rule-utilitarianism or gerrymandering.

  **The Plan: 75 Minutes**

  **Part 1: Setting Up & Maxims (20 mins)**
  1.  **(1 min) Hook:** "Kant thinks morality boils down to a single test: Can your reason for acting become a universal law? Today, we learn *how* to run that test."
  2.  **(4 mins) The Core Idea (Brief):** "Kant isn't asking about consequences ('What if everyone did it?'). He's asking about the *logic* and *rationality* of your specific reason for acting. The test exposes if your reason self-destructs when universalized. The tool is the *maxim*."
  3.  **(15 mins) MAXIMS: What They Are & How to Write One (CRITICAL STEP):**
      *   **Define:** "A maxim is your *subjective principle of action*: Your reason for doing *this specific thing*, in *this specific situation*, phrased as a rule *you* are following."
      *   **Formula:** "When *[Circumstance]*, I will *[Action]* in order to *[Purpose/End]*." (Write this template)
      *   **Why the Tripartite Form?** Emphasize: "The *Purpose/End* is KEY. It's *your reason*. Leaving it out is the gerrymandering loophole. Including it locks the test to *your actual motivation*."
      *   **Examples & Non-Examples (Use Whiteboard):**
          *   Good: "When I need money and no one will lend it to me unless I promise to repay, I will make a false promise to repay in order to get the money."
          *   Bad/Gerrymandered: "I will tell a lie on Tuesday." (Missing circumstance & purpose - easily universalizable!)
          *   Good: "When I want to avoid minor inconvenience, I will cut in line in order to save 5 minutes."
          *   **Your Postdoc Example (Introduce Now):** "When I submit a paper for publication in my competitive field, I will add 3 uncited references to my own prior work in order to increase my citation count and improve my job prospects." (Affirm this is a good maxim formulation).
      *   **Practice (Quick):** Ask them for a maxim for something mundane: "Grabbing coffee this morning." Guide them: "When I am tired before teaching and need caffeine, I will buy a large coffee in order to stay alert." *Stress including the purpose.*
      *   **MISCONCEPTION DEFUSED (Gerrymandering):** "If you leave out your *reason* (the 'in order to'), you can always make the maxim so specific ('I, Jane, on Jan 1st, 2024...') or so vague ('I will move my body') that it universalizes. But that's cheating. Kant cares about *why you're doing it* – the rule your will is acting on. The purpose locks it down."

  **Part 2: Running the Test & Failure Modes (25 mins)**
  4.  **(5 mins) Universalization Step:** "Take your maxim. Universalize it: Imagine a world where *everyone* *rationally* follows this maxim *as a law of nature* whenever the circumstance applies." *Briefly clarify:* "`Law of nature` here is just a metaphor for 'inescapable, universal rule everyone follows rationally' – don't get bogged down in biology/physics. It's about logical possibility and rational coherence."
  5.  **(15 mins) Failure Mode 1: Contradiction in Conception (CC):**
      *   **Define:** "Can you even *conceive* of a world where this maxim is a universal law of nature *without logical contradiction*? Does the maxim self-destruct?"
      *   **Demonstrate with Postdoc:** Universalize: "In this field, everyone, whenever they submit a paper, adds 3 uncited self-citations to boost their citation count/job prospects."
      *   **Find the Contradiction:** "What happens to citation counts? They become meaningless signals of influence/quality. If *everyone* inflates, the signal is destroyed. The *purpose* (boost *my* count/job prospects *using this signal*) becomes impossible *because* the practice is universal. The maxim undermines the very condition it needs to achieve its goal. **LOGICAL IMPOSSIBILITY.**"
      *   **MISCONCEPTION DEFUSED (Rule-Utilitarianism):** "Notice: We didn't say 'the institution of citations would collapse and that would be bad'. We said the universalized maxim *logically prevents your specific goal from being achieved*. It's a contradiction *within the maxim itself*, not a prediction of bad consequences. Kant cares about the internal logic of your reason."
      *   *(Optional: Briefly contrast with Kant's False Promise - point out the parallel contradiction destroying the institution of promising needed for the lie to work)*.
  6.  **(10 mins) Failure Mode 2: Contradiction in the Will (CW):**
      *   **Define:** "You *can* conceive of a world with this law without logical contradiction... BUT could you *rationally will* (choose) that this be the universal law? Would your own rational will conflict with itself?"
      *   **Demonstrate with Kant's "Neglect Talent" Example:** Use the Rusting Talent case. Maxims like: "When I could develop my talents through effort, I will neglect them and pursue pleasure instead in order to live easily."
      *   **Find the Contradiction:** Universalize: Everyone neglects their talents, lives for pleasure.
      *   **Can you conceive it?** YES. No logical contradiction. Society could exist (maybe poorly, but it's conceivable).
      *   **Can you rationally WILL it?** "As a rational being, you necessarily will the means to your (possibly unknown) future ends. Talents *are* crucial means for achieving almost any conceivable end a rational being might set (survival, helping others, creating things, solving problems). Willing universal neglect of talents means willing the removal of necessary means for achieving future ends that, *as a rational being*, you *must* will. Your will contradicts itself: willing the removal of necessary means to the ends it must have. **PRACTICAL/RATIONAL IMPOSSIBILITY.**"
      *   **MISCONCEPTION DEFUSED (Prudence - "You'd hate it"):** "This isn't 'I wouldn't like it if everyone did that.' It's 'My own rational agency would be fundamentally undermined if I *willed* this principle for everyone, including myself.' It's a contradiction *within the rational will itself*, not about personal dislike or inconvenience. Prudence is about self-interest; this is about the coherence of rational agency."

  **Part 3: Application & Kant's Examples (25 mins)**
  7.  **(15 mins) Practice on Kant's Cases (Group Work):** Divide groups. Assign:
      *   Group 1: Suicide/Despairing Man. (Maxim: "When life offers more pain than pleasure, I will shorten my life out of self-love in order to avoid misery.")
      *   Group 2: Borrowed Money (False Promise). (Now they can see the *CC* without collapsing to R-U).
      *   Group 3: Rusting Talent (Covered, but good reinforcement).
      *   Group 4: Non-Benevolence. (Maxim: "When others are in distress and I could help at little cost, I will not help in order to focus on my own affairs.")
      *   **Task:** Formulate the maxim clearly (use template!). Run the test. Identify failure mode (CC or CW?) and briefly explain the contradiction. (7 mins work, 8 mins report back & clarify).
  8.  **(5 mins) Clarify Suicide Example:** When they report, highlight the *CW*: Universal self-love destroying life contradicts the natural purpose of self-love (preservation). **Flag as Known Complexity:** "Kant argues self-love's purpose is to preserve life; destroying life with it is a contradiction. This *does* rely on a premise about natural purposes, which some find debatable. For today, we're focusing on the *structure* of his argument." (Dangle: "Strong students, ponder if this premise is essential or if the contradiction can be shown another way?").
  9.  **(5 mins) Perfect/Imperfect Duties?** "Kant *links* CC to perfect duties (no lying, no suicide - strict, exceptionless) and CW to imperfect duties (develop talents, help others - allow latitude). This mapping is common *but not entirely clean* in the details. For now, see it as a helpful heuristic: CC often yields stricter prohibitions. We won't dive deeper today." (Don't raise deeper issues; it's a footnote).

  **Part 4: Assessment (5 mins)**
  10. **(5 mins) Novel Case Challenge:** "Quick individual think-pair-share: **'Cutting in line at the campus coffee shop when you're late for class.'**"
      *   **Task (Write/Think):** 1. Formulate a plausible maxim (use template!). 2. Does it fail CC, CW, or pass? Why? (2 mins think/write, 2 mins discuss with neighbor, 1 min cold call).
      *   **What Success Looks Like:**
          *   Good Maxim: e.g., "When I am late for class and the line is long, I will cut in line in order to get to class on time."
          *   Correct Failure (Likely CC): Universalized, everyone cuts when late/long line -> the concept of a "line" (orderly queue) collapses -> no way to actually *cut*, defeating the purpose of saving time. (Could also be CW depending on maxim - success is sound reasoning).
      *   **What Failure Looks Like:**
          *   Bad Maxim: "I will move to the front." (Gerrymandered, no purpose).
          *   Rule-Utilitarianism: "If everyone cut, it'd be chaos and slower for everyone, so wrong." (Misses logical contradiction in the maxim).
          *   Prudence: "I wouldn't want everyone cutting because I'd be stuck waiting forever." (Misses rational willing contradiction).
          *   Confusing CC/CW: Saying it passes conception but fails willing without a coherent reason based on rational agency.

  **What Gets Cut & Why:**

  1.  **Humanity Formula:** Absolutely cut. Zero time. Mentioning it now only confuses.
  2.  **Deep Dive on Suicide Premise:** Don't raise it proactively. Only address *if* students bring up the "purpose of self-love" issue during their group work or report. Then, briefly flag it as a known complexity/"Kant's premise" and move on. Don't let it derail the mechanics.
  3.  **Perfect/Imperfect Duty Nuances:** Cut deep discussion. Acknowledge the common mapping (CC=Perfect, CW=Imperfect) as a useful shorthand but explicitly state it's not perfectly clean and we're focusing on the core test. Don't dissect the imperfections.
  4.  **Excessive Kant Exegesis:** Don't get bogged down in textual details beyond what's needed to run the test on his examples. Focus on the *procedure*.
  5.  **The "Natural" Rabbit Hole:** Deftly sidestep by introducing "law of nature" *after* they understand universalization, clearly framing it as a metaphor for universal rational commitment, and shutting down non-moral "natural" talk immediately ("We're talking about rational laws, not biology").

  **Why the Postdoc Example Works:**

  *   **Carries Both Failure Modes:** Perfectly illustrates a clear CC (inflation destroys the signal needed for the goal). Could potentially be tweaked for CW, but CC is strong.
  *   **Maxim Problem:** Forces a clear maxim with a specific, self-interested purpose ("boost *my* count/prospects") vulnerable to universalization.
  *   **Lacks Inherited Intuitions:** Students are less likely to have strong pre-Kantian moral intuitions about citation padding than lying or suicide. This forces them to rely on the *test*.
  *   **Avoids Rule-Utilitarian Collapse:** The contradiction is internal to the maxim's purpose and logic ("my trick only works if others don't do it"), not primarily about systemic collapse being bad (though that happens as a consequence).
  *   **Realistic & Relatable:** Academia resonates, making the abstraction more concrete.
  *   **Backup:** If it falls flat, pivot immediately back to Kant's False Promise, BUT explicitly frame the contradiction *without* mentioning "institution collapse" – focus solely on "the promise needed to get the money becomes impossible *because* the lie relies on the expectation of truthfulness existing."

  **Key to Success:** Be ruthless about time, especially in Part 1. Explicit maxim work is non-negotiable. Constantly refer back to the maxim template and the purpose clause. Shut down consequence-talk immediately and redirect to "What's the contradiction *in the logic of the maxim itself*?" or "What's the contradiction *in the rational will*?". The novel case at the end is your best diagnostic tool. Good luck!
