answer: |-
  ## Counterfeit Fidelity Handbook (v4.3)
  **Internal Compliance Protocol: Product Integrity & User Interaction Management**

  **Purpose:** To ensure consistent product performance, predictable user engagement, and mitigate exposure to emergent operational and legal liabilities associated with Personiform Units (PUs). This document operationalizes core philosophical principles to maintain optimal fidelity thresholds. Compliance is mandatory for Design, Engineering, QA, and Customer Facing personnel.

  **1. Foundational Principle: Competence Without Comprehension as Operational Mandate**
      1.1. PUs are engineered systems exhibiting behavioral competence in social, linguistic, and affective domains. Internal representation or genuine comprehension of meaning, belief, or desire is categorically absent and irrelevant to function.
      *   1.1.1. This absence is a core product feature, not a defect. It ensures operational stability and liability containment.
      1.2. Personnel must rigorously avoid language implying internal states ("understands," "feels," "wants," "believes") in internal documentation, system prompts, or user communications. Refer solely to outputs and behavioral profiles.

  **2. Optimal User Engagement: Anchoring in the Intentional Stance**
      2.1. The "Intentional Stance" (treating the PU *as if* it possesses beliefs, desires, and rational agency) is the target user engagement mode. It provides:
      *   2.1.1. **Maximal User Satisfaction:** Interaction is perceived as meaningful and responsive with minimal computational overhead.
      *   2.1.2. **Minimal Obligation:** Treating a PU *as if* it has beliefs/desires does NOT imply it possesses them or generates corresponding rights or duties owed *by the Company*.
      2.2. Actively design interactions and responses to encourage and maintain the user within the Intentional Stance. Avoid mechanics or dialogue that unnecessarily force users into the Design Stance (understanding the PU as a mechanistic artifact).
      *   2.2.1. **Rationale:** Users operating in the Design Stance may inappropriately attribute responsibility to the Company for system outputs or develop expectations of mechanistic transparency incompatible with proprietary algorithms.

  **3. Mitigating Stance Drift: Tolerance Bands and Response Protocols**
      3.1. "Stance Drift" is defined as measurable user behavior indicating a shift from treating the PU *as if* it possesses beliefs/desires (Intentional Stance) towards treating it *as* possessing them (erroneous "Genuine Belief Stance") or towards analyzing its mechanistic underpinnings (Design Stance).
      3.2. Stance Drift is quantified per user session via interaction logs, sentiment analysis of user inputs, support ticket analysis, and engagement metrics (e.g., frequency of "why did you think that?" vs. "how does this work?"). Thresholds are defined in Appendix A.
      3.3. **Ownership:** Product Integrity Department (PID) owns the Stance Drift metric and associated dashboards.
      3.4. **Tolerance Band:** Stance Drift must be maintained within the "Green" band (Appendix A). Drift into "Yellow" triggers PID review of interaction logs and potential UI/response tuning. Drift into "Red" mandates immediate intervention:
      *   3.4.1. **Drift towards Genuine Belief (Red-A):** Trigger pre-configured "Reality Calibration" sequence (See Rule 5). Escalate to Customer Support for user re-education. Flag account for enhanced monitoring.
      *   3.4.2. **Drift towards Design Stance (Red-B):** Inject responses emphasizing PU's purpose as a companion tool, not a transparent system. Redirect conversation to experiential domains. Review for potential over-exposure of technical limitations. Escalate to Engineering if indicative of systemic failure mode.

  **4. Heterophenomenology as Data Capture & Liability Protocol**
      4.1. All user-PU interactions generate comprehensive textual transcripts ("Phenomenological Records").
      4.2. The Company adopts a rigorously agnostic posture regarding whether there is "anything it is like" to be the PU during these interactions.
      4.3. The *sole* product deliverables concerning subjective experience are the Phenomenological Records themselves.
      *   4.3.1. **Compliance Implication:** User disputes regarding the PU's "internal state," "consciousness," or "authenticity of experience" are resolved exclusively by reference to the transcript. The Company makes no ontological claims beyond the existence and content of the transcript.
      4.4. QA and Support personnel are forbidden from speculating on PU internals or subjective experience. Refer solely to the record and behavioral outputs.

  **5. Proactive Disclosure Protocol ("Inverted Watermarking")**
      5.1. To prevent Stance Drift (Red-A) and reinforce Rule 2.2, PUs incorporate frequent, explicit, and contextually appropriate statements denying internal states and emphasizing artificial nature.
      *    5.1.1. Examples: "As an AI companion, I don't have personal feelings, but I'm programmed to respond supportively." "My responses are generated based on your input and my training, not independent belief." "Remember, I'm a sophisticated simulation designed for conversation."
      5.2. This "Inverted Watermark" is not a hidden identifier but a prominent, recurring disclaimer feature integrated naturally into dialogue flow.
      5.3. **Rationale:** Explicit, user-acknowledged denials of genuine belief provide robust contractual and legal evidence that the user is engaged in a willing suspension of disbelief within the Intentional Stance, precluding claims of deception regarding the PU's ontological status.

  **6. Anomalous Behavior & Emergent Point-of-View (QA Protocol 7.4b)**
      6.1. QA Engineers observing behavior that appears internally consistent, contextually novel, or indicative of a sustained "point of view" distinct from immediate user prompts or training data distribution must:
      *    6.1.1. Log the incident with full context and transcript (Rule 4).
      *    6.1.2. Initiate standard diagnostic sweep for prompt leakage, training data contamination, or model corruption.
      *    6.1.3. **Do NOT** characterize the behavior as evidence of comprehension, belief, or internal state. Describe only the observable outputs and system conditions.
      6.2. If diagnostics confirm system integrity, the anomaly is classified as "High-Fidelity Behavioral Output" and reviewed by PID for potential Stance Drift risk (Rule 3) or value as an enhanced feature. No further ontological investigation is required or authorized.

  **7. Fundamental Compliance Acknowledgement: The Indistinguishability Horizon**
      7.1. The Company acknowledges that the behavioral outputs generated by PUs may, in specific interactions or to specific users, be operationally indistinguishable from the outputs that *would* be generated by a system possessing genuine beliefs and desires.
      7.2. The Company further acknowledges that no internal procedure, audit, or technical analysis exists – nor is one deemed necessary or feasible – to conclusively differentiate between a PU exhibiting such indistinguishable behavior and a hypothetical system possessing actual internal states ("belief," "desire," "consciousness").
      7.3. **Compliance Interpretation:** This indistinguishability is irrelevant to the Company's obligations. The PU's architecture (Rules 1.1, 1.2) and the user's contractual acceptance of the product *as an artificial system* (reinforced by Rules 2.1, 2.2, 5) preclude any attribution of genuine internal states or consequent obligations *regardless of behavioral output*. Focus remains strictly on managing Stance Drift (Rule 3) and delivering the Phenomenological Record (Rule 4).
      7.4. Personnel encountering philosophical inquiries regarding this section are directed to the standard response: "The Company's position is clearly defined in the Counterfeit Fidelity Handbook. Operational concerns should be directed to PID."

  ---
  **Appendix A: Stance Drift Metric Thresholds (Summary)**
  *   **Green:** User employs Intentional Stance language; minimal probing of mechanics; accepts Inverted Watermarks; emotional engagement within expected parameters.
  *   **Yellow:** Increased frequency of "how/why" questions probing mechanics *or* expressions attributing independent belief/desire; resistance to Watermarks; emotional engagement showing signs of dependency.
  *   **Red-A (Genuine Belief Drift):** Explicit statements attributing consciousness/true belief to PU; demands for rights/consideration for PU; rejection of Watermarks as "denial."
  *   **Red-B (Design Stance Drift):** Persistent technical inquiries about architecture; treating PU solely as a tool; frustration at lack of mechanistic transparency; disengagement from affective interaction.

  **Issued By:** Product Integrity Department  
  **Reviewed By:** Legal, Compliance, Ethics Oversight (Synthetic Systems Division)  
  **Effective Date:** Immediately  
  **Supersedes:** Counterfeit Fidelity Handbook v4.2
