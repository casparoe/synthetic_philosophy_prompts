prompt: |-
  Longtime lurker, first-time asker-sort-of. I've been on the mod team of a big online community for about eleven years — wiki plus forums plus a Discord, ~200k registered accounts, maybe 3–4k of whom post in any given month — and I got into all this governance stuff via the coordination posts on the rationalist blogs, then a long argument with a friend who does union organizing, who keeps telling me my problem is just a bargaining problem in disguise. I don't think she's right and I can't articulate why, which is part of what I'm asking about here.

  The practical problem: people constantly show up with a claim about what "the community" wants, and we have no principled way to decide whether that claim licenses us doing anything. Last quarter alone we had a petition with 4,200 signatures demanding we reverse a moderation policy; a poll we ran ourselves that got 900 responses and pointed the other way; a voice town hall where about 60 people, mostly the loudest regulars, backed something else entirely; and a post with 800 upvotes asserting that everyone already agrees. We did what felt least bad and then wrote an announcement saying the decision reflected the community's view, which probly wasn't true, and it got quoted back at us for months. Please write me an actual decision procedure my team can run on a claim of the form "the community wants X," before we either act on it or repeat it in public. I want the questions in order, what counts as a sufficient answer to each one, where the procedure terminates in "no — that's a faction, not a community" or "this isn't up for a vote at all," and where it has to hand the decision to a human because what's left is a values question rather than a factual one. Constraints: it has to be runnable by volunteers with no stats training in under an hour, and the output has to be text I can paste into an announcement and defend in front of a ten-person mod council where at least three people already think I'm wrong.

  The cases I specifically need it to survive, because this is where our intuitions turn to mush: who's actually inside "the community" — the 200k registered, the 3k active, the lurkers who'd leave if we get it wrong, the people we banned last year, the ones who only materialize when there's a fight, and the people who'd join under a different policy; whether 4,200 signatures beat 900 poll responses or whether that comparison is just nonsense; how much weight intensity gets versus raw headcount, and how you'd even measure intensity without it collapsing into "whoever shouts loudest"; what to do when the ballot options were chosen by an interested party, since I increasingly suspect "the community wants X" isn't a report about a pre-existing fact at all but a move someone is making, with the will getting manufactured by whoever wrote the question; and what happens when a majority of the people who bothered to show up want something that would drive out a minority, i.e. the things that shouldn't be aggregable in the first place. Then run it on three cases — the petition, our own poll, and the town hall — and make sure at least one of them lands somewhere I personally will hate (I'm fairly sure the honest answer is that our poll was worthless, and I defended it publicly). Close with a blunt list of what the procedure can't settle and where it will predictably misfire, and be honest about which steps are just judgment calls wearing a flowchart costume.

  Don't hedge and don't hand me a menu of options to choose between — commit to the version you think is right and give me your reasons, including where you're making a call that someone else could reasonably make differently. No bibliography or reading list; if you want to gesture at a theory, gesture at the idea, not the citation, because I'm not going to go look anything up. American English, please.
reasoning: |-
  Okay, let me tackle this user's problem. They've been a mod for a big online community for eleven years and are struggling with claims about what "the community" wants. They need a decision procedure to evaluate such claims, with specific constraints: it has to be runnable by volunteers in under an hour, no stats training, and output defensible text for their mod council.

  First, I need to unpack their core issues. They mentioned several pain points: defining who's part of the community, comparing different forms of input (like petitions vs polls), handling intensity versus raw numbers, dealing with biased ballot options, and situations where majority wants might drive out minorities. They also want the procedure to handle three specific cases and be honest about limitations.

  The user’s background is important. They came from rationalist blogs and have debated with a union organizer friend. That suggests they value structured thinking but are skeptical of oversimplified solutions. Their frustration with not articulating why "it's just a bargaining problem" indicates they need a framework that acknowledges complexity without being theoretical.

  Key constraints are practical: volunteers with limited time, no stats knowledge, and the output must be clear for council debates. That means the procedure must be step-by-step, with clear yes/no gates where possible, but also transparent about where judgment is required.

  For defining the community, I recall the concept of "community of practice" from Wenger. Focus on active participation: not just registered users but those currently engaging. That excludes banned members, future joiners, and silent lurkers unless there's evidence they'd act. But lurkers matter if policy changes might cause them to leave—so that's a judgment call later in the procedure.

  Comparing inputs like petitions and polls is tricky. Petitions can be gamed, polls might not capture intensity. Need to prioritize methods where the community had equal opportunity to respond. So a mod-run poll beats a petition because it's designed to be representative, even with lower numbers. But sampling bias matters—if only the angry sign, the petition's inflated.

  Intensity is hard to measure. Shouting loudest isn't fair, but pure headcount ignores passion. The procedure should flag this as a risk but not quantify it. Instead, look for corroborating evidence across different methods. If one group cares intensely but others don't, that's a values call—should the minority be protected?

  Biased ballot options are a framing issue. If a poll or petition forces a false choice, it's invalid. The procedure needs a step to check if the options cover reasonable alternatives neutrally. If not, discard it as manufactured.

  For majority vs minority: some things shouldn't be decided by vote if they harm the community's health. The procedure should identify if the demand attacks core values or excludes groups. If so, it's not aggregable—mods must decide based on principles, not popularity.

  Now, applying the procedure to their three cases. The petition with 4.2k signatures: high volume but possibly gamed. If it's a Google Form without controls, it has lower validity than their mod-run poll. So the poll wins unless the petition shows broader representativeness. The town hall with 60 loud voices is even less representative—useful for ideas, not decisions. Their poll had 900 responses; if it was well-designed, it's the best input. But if the options were biased, it fails—which the user suspects, so being honest here is crucial.

  Limitations: the procedure can't resolve deep value conflicts or define core values. It might misfire if the community is deeply divided or if mods misuse judgment steps. Transparency is key—admitting where judgment is used and why.

  Finally, structure the procedure as a flowchart with gates, each step leading to continue, stop, or handoff. Use plain language, concrete thresholds (like participation rates), and examples in the output template. The goal is to give mods a defensible rationale, not a perfect answer.
answer: |-
  Here’s a concrete decision procedure for evaluating claims of "the community wants X." It runs in 7 steps, takes <45 minutes, and outputs defensible text. **It will explicitly reject your poll as unreliable and side with the petition in one scenario—likely triggering your "hate this" requirement.**

  ---

  ### **Decision Procedure: "Does the community want X?"**
  **Run these steps in order. Stop if any step returns "NO" or "HANDOFF."**

  1. **IS THE CLAIM ACTIONABLE?**  
     - *Question:* Could acting on X materially change participation, safety, or core functionality of the community? (e.g., banning a topic vs. changing button colors).  
     - *NO:* Stop. "This is not a community-level decision; it’s operational. We handle it internally."  
     - *YES:* Proceed.

  2. **IS THERE A CLEAR CONFLICT WITH CORE VALUES?**  
     - *Question:* Would X violate the community’s *explicit, documented* foundational rules? (e.g., "allow hate speech" when "no hate speech" is Rule 1).  
     - *YES:* Stop. "Core values aren’t negotiable via popularity. We won’t implement X."  
     - *NO:* Proceed.

  3. **WHO COUNTS AS "THE COMMUNITY" HERE?**  
     - *Threshold:* Only **active participants** (e.g., posted/commented/reacted in last 90 days) + **verified lurkers** (e.g., logged in >5 times in 90 days but didn’t post).  
     - *Exclude:* Banned users, inactive accounts (>1 year silent), future hypothetical users, drive-by protesters.  
     - *Output:* Define this group numerically (e.g., "We define ‘community’ as 3,400 active contributors and 8,200 verified lurkers").  
     - *Handoff if:* Size is disputed (e.g., "Are seasonal users ‘active’?"). → Council votes on definition.

  4. **IS THE INPUT METHOD VALID?**  
     Rank methods by reliability (highest to lowest):  
     - **A: Mod-designed poll/ballot** (if options cover all major viewpoints neutrally, promoted to entire community).  
     - **B: Petition** (if signer identities are verifiable and not botted).  
     - **C: Town hall/vocal feedback** (only if transcribed and participation was open).  
     - **D: Upvotes/engagement metrics** (prone to brigading; only corroborates, never decides).  
     - *NO to method:* If options were manipulative (e.g., "Do you support free speech or censorship?"), participation was restricted, or fraud is likely. Discard this input.  
     - *YES:* Proceed and note method’s rank.

  5. **IS THE INPUT REPRESENTATIVE?**  
     - *Question:* Did ≥15% of the "community" (from Step 3) participate?  
     - *NO:* Stop. "Input is non-representative. We won’t treat this as community sentiment."  
     - *YES:* Proceed. If multiple valid inputs exist, weight by method rank (A > B > C). Ignore D.

  6. **DOES X THREATEN A MINORITY?**  
     - *Question:* Would X likely cause a group (>10% of active users) to leave *or* reduce their participation?  
       *(Evidence: Past exodus after similar changes, direct threats to leave, minority testimony.)*  
     - *YES:* Handoff. "This risks factional harm. Council must decide based on values, not headcount."  
     - *NO:* Proceed.

  7. **WHAT DOES THE DATA SAY?**  
     - Tally valid inputs (Step 5). If conflicting:  
       - Highest-ranked method wins.  
       - If same rank, largest sample size wins.  
     - *Output:* "Per [method], [%] of participants support X. We accept this as community sentiment."  
     - *Exception:* If support is <60%, call it "divided opinion" and handoff to council.

  ---

  ### **Applied to Your Cases**
  1. **The Petition (4,200 signatures):**  
     - Step 4: Valid if signatures are real (e.g., verified emails). Rank B.  
     - Step 5: If community = 3.4k active + 8.2k lurkers = 11.6k, 4,200 is 36% → **representative**.  
     - Step 6: Assume no minority threat → Proceed.  
     - Step 7: **"Community wants X" CONFIRMED.**  

  2. **Your Poll (900 responses):**  
     - Step 4: You suspect bias. If options were slanted (e.g., omitted compromise choices), → **INVALID.** Discard.  
     - *Even if valid:* Step 5: 900/11,600 = 7.8% → **NON-REPRESENTATIVE.** Stop.  
     - **VERDICT: "Poll is statistically unreliable and cannot support any claim about community sentiment."**  

  3. **Town Hall (60 people):**  
     - Step 4: Valid but Rank C.  
     - Step 5: 60/11,600 = 0.5% → **NON-REPRESENTATIVE.** Stop.  
     - **VERDICT: "Vocal attendees do not speak for the community."**  

  ---

  ### **What This Procedure Can’t Settle (Brutal Truths)**  
  1. **"Community" is fictional.** There’s no unified will—only coalitions. This procedure *manufactures* a defensible answer.  
  2. **Values beat math.** If X feels "wrong" but clears all steps, you still must implement it or overrule transparently (e.g., "We reject X despite the vote because it violates our duty to protect vulnerable members").  
  3. **Lurkers are ghosts.** We include them to avoid blind spots, but we can’t truly measure their "will."  
  4. **Step 4 is a judgment call.** Was the petition botted? Was the poll fair? Volunteers will err here.  
  5. **It won’t satisfy factions.** Losers will cry rigged process. Winners will weaponize "community" against you later.  

  ---

  ### **Output Template for Announcements**  
  > "After evaluating the claim that 'the community wants X' using our decision procedure:  
  > - We defined the community as [number] active participants and verified lurkers.  
  > - We examined input from [methods]. [Method Y] was invalid because [reason]. [Method Z] was valid but non-representative (only [%] participation).  
  > - The only representative input was [Method W], with [number] participants ([%] of the community) supporting X.  
  > - We found no evidence that X would disproportionately harm a minority group.  
  > Therefore, we accept this as community sentiment and will [act/not act] on X."  

  **Why this works:**  
  - It’s auditable (each step documented).  
  - It demotes loud minorities (your town hall).  
  - It kills garbage polls (yours).  
  - It forces specificity ("community" = exact number).  
  - It flags existential risks (Step 6).  

  **You’ll hate that your poll was junk.** But defending it publicly was worse—this procedure prevents repeats. If your council balks, remind them: *Without a standard, every angry mob wins by default.*
