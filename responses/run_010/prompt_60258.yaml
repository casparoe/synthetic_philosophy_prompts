answer: |-
  ## Joint Statement on Moral Responsibility: Strawsonian and Free Will Sceptic Perspectives

  **Agreed Claims (Signed Without Reservation):**

  1.  **Excusing vs. Exempting:** We agree on a fundamental distinction between:
      *   **Excusing conditions:** Circumstances (like accident, coercion, or reasonable ignorance) that show an agent, while generally capable of moral responsibility, is *not blameworthy* for *this specific act*. The agent remains an appropriate target of reactive attitudes in general.
      *   **Exempting conditions:** Circumstances (like severe mental illness, profound cognitive impairment, or extreme immaturity) that show an agent lacks the general capacities necessary to be *an appropriate target* of reactive attitudes like resentment or moral blame *at all*. They are seen as outside the normal moral community.
  2.  **Responsiveness of Reactive Attitudes:** We agree that **reactive attitudes** (emotional responses like resentment, indignation, gratitude, and forgiveness) are primarily responsive to the *quality of will* an agent displays towards others – their regard, or lack thereof, for the legitimate interests and moral standing of others. They are not *primarily* responsive to abstract metaphysical beliefs about determinism or ultimate responsibility.
  3.  **Determinism's Limited Direct Relevance:** We agree that establishing the truth of **determinism** (the thesis that every event, including human choices, is causally necessitated by prior events and the laws of nature) does not, *by itself*, logically entail that anyone is universally exempted (as defined in point 1). Determinism alone does not demonstrate that agents lack the capacities relevant to being participants in moral practices governed by reactive attitudes.
  4.  **Sceptic's Retained Moral Protest:** We agree the free will sceptic can coherently retain forms of moral protest, condemnation, and demands for change. This includes:
      *   Judging actions as morally wrong and harmful.
      *   Expressing moral sorrow or disappointment.
      *   Demanding future compliance with moral norms.
      *   Seeking non-retributive forms of accountability focused on protection, reconciliation, or moral education.
  5.  **Sceptic's Surrender of Basic Desert:** We agree the free will sceptic must surrender the notion of **basic desert**: the idea that an agent intrinsically deserves blame or punishment (particularly retributive punishment) *solely* because they performed a wrongful act, independently of any beneficial consequences (like deterrence, rehabilitation, or protection) that holding them responsible might bring. For the sceptic, reactive attitudes like resentment *cannot* ultimately justify punishment based *only* on desert.

  **Disagreements Table:**

  | Disagreement Stated by Strawsonian                                                                 | Disagreement Stated by Free Will Sceptic                                                                                                                               | Substantive (S) or Verbal (V)? | If Verbal, What is Traded On?                                                                 |
  | :------------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :----------------------------- | :-------------------------------------------------------------------------------------------- |
  | **1. Constitutive Role:** The practices of holding morally responsible *are constituted by* the natural, human-reactive attitudes (resentment, indignation, etc.). Abandoning these attitudes in light of determinism is neither practically possible nor normatively required for a coherent moral community. | **1. Constitutive Role:** While reactive attitudes are a deep-seated psychological feature, they do not define the *justified core* of moral responsibility. Their persistence does not validate the underlying presupposition of basic desert. Moral responsibility practices *can and should* be revised based on the truth of determinism and the lack of basic desert. | **S**                          | N/A - Disagreement on the normative authority and justificatory role of the reactive attitudes. |
  | **2. Basic Desert & Blame:** The reactive attitudes (especially resentment) *are* the appropriate expression of holding someone blameworthy in a way that involves basic desert. This desert is inherent in the non-detached, participant stance inherent in human relationships. | **2. Basic Desert & Blame:** Judgments of blameworthiness inherently presuppose basic desert. Because basic desert is incompatible with determinism (and likely illusory), reactive attitudes involving resentment are systematically mistaken, though psychologically understandable. We should strive to replace them. | **S**                          | N/A - Core disagreement on the ultimate justification and compatibility of desert with determinism. |
  | **3. Function of Punishment:** Retributive elements in punishment (the sense that the offender *deserves* to suffer for their wrong) are a natural expression of the reactive attitudes and play a constitutive role in our practices of holding responsible. | **3. Function of Punishment:** Retributive punishment, justified solely by desert, is morally impermissible. Legitimate societal responses to wrongdoing must be justified solely by forward-looking considerations like prevention (quarantine), rehabilitation, deterrence, and moral education. | **S**                          | N/A - Disagreement on the permissibility and justification of retribution.                     |
  | **4. Meaning of "Moral Responsibility":** Moral responsibility *just is* being an appropriate target of the reactive attitudes within the participant stance. This is the core phenomenon to be understood and preserved. | **4. Meaning of "Moral Responsibility":** Moral responsibility, properly understood, *requires* that agents possess libertarian free will or ultimacy (which we doubt exists) *or* minimally, presupposes basic desert (which is incompatible with determinism). Our current practices often conflate this with mere *attributability*. | **V**                          | Definition of "Moral Responsibility". The sceptic uses a narrower, desert-requiring definition; the Strawsonian uses a broader, practice-based definition focused on the participant stance. |

  **Cruxes: Key Sub-Questions for Progress**

  1.  **The Nature and Role of Resentment:**
      *   Does the distinction between **addressed resentment** (a second-personal demand for acknowledgment, repair, or altered regard directed *at* the offender) and **recorded resentment** (a private feeling of moral disapproval, sorrow, or protest without an inherent demand *on* the offender) hold water?
      *   *Strawsonian View:* Can the core practice of holding responsible be sustained primarily by *recorded* resentment, or does it inherently require *addressed* resentment to function? Does the sceptic's "quarantine" model, which involves addressing demands *to* the offender (e.g., "You must undergo this rehabilitation"), implicitly rely on a structure similar to addressed resentment, potentially collapsing the distinction?
      *   *Sceptic View:* Can *all* legitimate moral protest and necessary societal response be adequately captured by forms of condemnation, demands, and intervention that *avoid* the kind of resentment presupposing basic desert? Is addressed resentment *necessarily* tied to presupposing desert, or can its demanding structure be justified on purely forward-looking grounds? Would adopting the sceptic's model inevitably lead to a problematic "objectification" of offenders?
      *   *Why it matters:* If addressed resentment is essential to the Strawsonian picture but incompatible with the sceptic's view, the disagreement is sharpened. If recorded resentment suffices for the Strawsonian, or if the sceptic's demands unavoidably mimic addressed resentment, the disagreement might be softened. Resolving this clarifies the *practical* gap between the views.

  2.  **The Normative Force of the Objective Attitude's Impossibility:**
      *   Strawson argues the **objective attitude** (viewing others as objects to be managed, predicted, or treated, rather than as participants in reciprocal relationships) cannot be adopted universally towards other adults without undermining the very possibility of ordinary human relationships.
      *   *Strawsonian View:* Is the impossibility of universal adoption of the objective attitude merely a *psychological fact* about humans, or does it have *normative force*? Does it show that practices grounded in the participant stance (including reactive attitudes) are not just inevitable but *correct* or *justified* for beings like us?
      *   *Sceptic View:* Does the *psychological difficulty* of universally adopting the objective attitude undermine the *normative project* of revising moral responsibility practices to eliminate basic desert? Can the sceptic's proposed revision (quarantine + moral education) be stably implemented *from within* the participant stance, acknowledging the psychological pull of reactive attitudes while consciously striving to mitigate their retributive force? Or is the sceptic advocating an impossible, self-undermining project?
      *   *Why it matters:* If the impossibility has normative force, it bolsters the Strawsonian position. If it's merely a psychological hurdle the sceptic must find ways to overcome, the sceptic's revisionist project remains viable. This tests the foundation of the Strawsonian defence and the practical feasibility of the sceptic's proposal.

  3.  **Empirical Test: The Persistence of Blame Judgments Under Determinism:**
      *   **Proposed Experiment:** Participants read a vignette clearly establishing thoroughgoing determinism (e.g., neuroscientific prediction + causal history). The vignette describes a deliberate, uncoerced, non-exempt wrongful act causing harm. Participants are then asked at two time points (immediately after reading, and after a 24-hour delay involving distraction) to rate:
          *   (a) The intensity of their resentment/indignation towards the wrongdoer.
          *   (b) The degree to which they judge the wrongdoer *blameworthy*.
      *   **Vividness Condition:** A separate group of participants undergoes the same procedure, but the harm is described in a vividly *second-personal* way (e.g., the victim directly addresses the participant about the impact of the harm).
      *   **Predictions & Falsification Conditions:**
          *   *Strawsonian Prediction:* Acknowledging determinism abstractly will cause a *shallow, transient suppression* of resentment and blameworthiness judgments immediately after reading the determinism vignette. This suppression will *significantly diminish or disappear* after the 24-hour delay, especially in the vivid condition, where the natural reactive response to the perceived quality of will will reassert itself strongly. **Falsification Condition:** If resentment and blameworthiness judgments remain *significantly and stably suppressed* across both time delays and are *not restored* in the vivid condition, this would challenge the Strawsonian claim about the natural resilience of the participant stance against abstract metaphysical beliefs.
          *   *Sceptic Prediction:* Reflecting on determinism will cause a *deeper, more stable suppression* of resentment and blameworthiness judgments. This suppression may even *increase* after the 24-hour delay (as reflection deepens) and will largely *persist* even in the vivid condition. The sceptic expects the vivid harm to elicit distress and condemnation, but *not* the specific reactive attitude of resentment tied to basic desert. **Falsification Condition:** If resentment and blameworthiness judgments *rebound strongly* to near baseline levels after the delay and are *robustly elicited* in the vivid condition, this would challenge the sceptic's claim that understanding determinism should durably undermine the core reactive attitudes presupposing desert.
      *   *Why it matters:* This tests a core empirical assumption underlying both positions: the Strawsonian claim about the *practical irrelevance* of determinism to the reactive attitudes vs. the sceptic's claim that determinism *should* durably alter our blaming practices once understood. Results bearing on the second crux (feasibility of revision) would emerge from the *stability* of any suppression and its resistance to vivid, second-personal engagement.
