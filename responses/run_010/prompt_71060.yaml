prompt: |-
  I have just been seated on the panel that awards my association's long-horizon prize, and the first file in front of us is a 1970s subsistence model whose marquee prediction — a worldwide food crisis before the turn of the century — is now forty years late. Half the panel wants to call it refuted; half wants to call it right but early, on the grounds that the mechanism it posited is intact and has merely been outrun by yield gains no one could have anticipated. I have to write the report, and before I do I want to know what I actually think about this class of prediction, since my gut is not obviously consistent.

  My working principle is what I have started calling the statute-of-limitations view: a long-run theory is falsified once the event it predicted has had a fair opportunity to occur and has not, where fair opportunity is fixed by the background conditions the theory itself specifies as necessary. If those conditions were never in place, the clock has not run.

  Here are my verdicts, such as they are.

  1. Malthus, 1798: population pressing against the means of subsistence. Two centuries on, per-capita food supply has risen almost everywhere. I do not feel the theory is refuted, but I cannot name one thing that confirms it either, and that bothers me.
  2. Hubbert's 1956 projection that lower-48 oil output would peak around 1970: it did, essentially on schedule. That is what a real long-run success looks like — except that American output has since climbed back above that 1970 peak, which the curve implied would not happen. I still want to call it a success.
  3. The 1980 Simon–Ehrlich wager on a basket of five metals, settled in 1990: Ehrlich lost and paid up. Yet later analyses find the outcome flips with the choice of window, and that across most of the twentieth century Ehrlich would have won. I want to say the bet settled something, and I want to say both men were largely at the mercy of dates. I cannot hold both.
  4. The mass famines forecast for the 1970s that never arrived at the predicted scale because crop yields jumped: I want to call that postponed, not refuted.
  5. A catastrophe averted precisely because the forecast was published and people acted on it: I think that counts as confirmation, not as a prediction that failed to come true.
  6. Postulating an unseen planet to save an orbital perturbation strikes me as legitimate, because the auxiliary claim was independently testable and paid off. Lengthening a time constant to save a missed date strikes me as illegitimate. These look to me like the same maneuver, and I have no account of why I treat them oppositely.

  Does the statute-of-limitations principle deliver all six, or does some rival? State the winner precisely, clause by clause, saying which case motivates each clause; tell me which of my verdicts it forces me to abandon; give its verdict on two cases I have not listed — a prediction whose target date is pushed out each time by roughly the length of the fresh miss, and one that comes true on schedule for reasons entirely outside its stated mechanism. Then tell me plainly whether right-but-early is ever a genuine epistemic status, or only unfalsifiability wearing a more respectable name.
reasoning: |-
  Hmm, this panel member is dealing with a tough philosophical question about how to evaluate long-term predictions. They've proposed a "statute of limitations" principle where predictions are falsified only if they fail after their necessary conditions are met, but they're struggling with inconsistencies in applying it to six historical cases.

  Looking at their verdicts: For Malthus, they feel unrefuted but unconfirmed - that suggests their principle needs to accommodate perpetual "not yet" theories. With Hubbert's oil peak, they want to honor the initial success despite the later rebound, implying we should value the timing aspect of predictions. The Simon-Ehrlich wager confounds them because the outcome depends on timeframe - their principle doesn't handle shifting temporal boundaries well. The 1970s famines case makes them say "postponed," showing they allow for external interventions. The averted catastrophe case reveals they consider policy responses as validation. Most tellingly, they admit inconsistency in accepting orbital adjustments but rejecting timeline extensions in other theories.

  Their statute-of-limitations principle falters on cases 1 (Malthus) and 3 (Simon-Ehrlich) where the timeframe itself is problematic, and struggles with 2 (Hubbert rebound) and 6 (time constant extensions) where the prediction's core claim gets undermined. The principle works best for cases 4 and 5 where conditions clearly changed.

  I think we need a more robust framework with three key components: First, specify what constitutes the predicted event and its necessary conditions. Second, evaluate timing accuracy - how precise was the forecast window? Third, assess mechanism validity separately from outcomes. This explains why orbital predictions succeed (precise timing) while Malthusian fears linger (vague timeframe). It also resolves their cognitive dissonance on case 6: extending timelines is legitimate only if the original timeframe wasn't essential to the mechanism.

  Applying this to their unlisted cases: For constantly rescheduled predictions, we'd call it failed if timing was claimed as critical. For accidentally correct predictions, we'd credit the outcome but fault the mechanism. And on the "right but early" dilemma - it's only valid when the original timeframe estimate was explicitly probabilistic, not when used as perpetual excuse.
answer: |-
  Your "statute-of-limitations" principle is insightful but incomplete. It fails to resolve most of your inconsistent intuitions because it doesn't address **mechanism validity**, **temporal precision**, or **exogenous interference**. Below is a refined framework derived from your cases, clause by clause, followed by its verdicts on your examples and new cases.

  ---

  ### **The Verified Trajectory Principle (VTP)**  
  *Clauses and Case Motivations:*  
  1. **Specificity Requirement**  
     *The prediction must specify both the outcome and its necessary mechanisms/conditions with testable precision.*  
     → *Motivation:* Hubbert (Case 2) succeeded because his mechanism (resource depletion dynamics) and timeline were precise. Malthus (Case 1) fails this; his "pressure" is undefined.  

  2. **Temporal Falsifiability**  
     *The predicted timeframe must be integral to the mechanism. Missed deadlines falsify the theory unless the delay is (a) probabilistically bounded, or (b) caused by independently verifiable exogenous shocks.*  
     → *Motivation:* Oil's rebound falsifies Hubbert’s *permanent* decline claim (Case 2). Lengthening time constants (Case 6) is illegitimate without probabilistic framing.  

  3. **Mechanism Isolation**  
     *Success requires the posited mechanism to drive the outcome. If the outcome occurs for unrelated reasons, the prediction fails.*  
     → *Motivation:* Unseen planets (Case 6) are valid because the mechanism (gravity) was confirmed. Simon-Ehrlich (Case 3) is unresolved—prices fell due to tech, not scarcity-as-mechanism.  

  4. **Exogenous Intervention Test**  
     *Averted disasters (Case 5) confirm the mechanism if policy actions directly respond to the theory’s causal logic. Yield gains negating famines (Case 4) falsify the original model’s *inevitability*.  

  ---

  ### **Your Verdicts Under VTP:**  
  | Case                 | Your Verdict                      | VTP Verdict                          | Change Required?                |  
  |----------------------|-----------------------------------|--------------------------------------|---------------------------------|  
  | 1. Malthus           | Not refuted, unconfirmed          | **Falsified**                        | Abandon "not refuted"           |  
  | 2. Hubbert           | Success despite rebound           | **Partially falsified**              | Acknowledge mechanism flaw      |  
  | 3. Simon-Ehrlich     | Bet settled something             | **Inconclusive**                     | Accept ambiguity                |  
  | 4. 1970s famines     | Postponed, not refuted            | **Falsified by intervention**        | Abandon "postponed"             |  
  | 5. Averted catastrophe| Confirms theory                   | **Confirms mechanism**               | None                            |  
  | 6. Planet vs. timeline | Legitimate vs. illegitimate       | **Consistent: Timing precision matters** | None                            |  

  **Key Changes:**  
  - **Malthus (1):** Falsified because mechanism (population growth outstripping food) failed *even under his specified conditions* (pre-industrial agriculture).  
  - **Hubbert (2):** Partial success; the peak occurred, but rebound (via fracking) exposed mechanism flaws (ignored tech-driven supply elasticity).  
  - **1970s Famines (4):** Falsified—yield gains were endogenous (Green Revolution), not an external shock.  

  ---

  ### **Verdicts on New Cases:**  
  1. **Perpetually Rescheduled Prediction** (e.g., "Resource collapse in 10 years" repeated since 1970):  
     → **VTP Verdict: Falsified.** Temporal falsifiability clause violated; delays aren’t probabilistically bounded or caused by identifiable shocks.  

  2. **Accidentally Correct Prediction** (e.g., "Economic crash in 2008" based on astrology, not debt bubbles):  
     → **VTP Verdict: Failed.** Mechanism isolation clause violated; outcome occurred for unrelated reasons.  

  ---

  ### **On "Right-but-Early":**  
  **Conclusion:** *Right-but-early is epistemically valid* **only if**:  
  - The original timeframe included probabilistic bounds (e.g., "70% chance by 2050 ±10 years").  
  - The delay is caused by a quantifiable, exogenous factor *not* in the theory’s background conditions (e.g., an asteroid delaying climate effects).  

  Otherwise, it is indeed **unfalsifiability in disguise**. Your "postponed famines" (Case 4) exemplify the latter—yield gains emerged *from the system the model claimed to understand*, revealing its mechanism was flawed or incomplete.  

  ---

  ### **Recommendation for Your Report:**  
  Apply the VTP to the 1970s subsistence model:  
  - **If** the model specified *immutable conditions* (e.g., "no crop-yield innovations"), it is falsified.  
  - **If** it claimed *inevitability regardless of human adaptation*, it is falsified.  
  - **Only if** it predicted yield gains as a *contingent response* (with a timeframe) might it merit "postponed."  

  Your gut inconsistency stems from conflating **outcomes** with **mechanisms**. The VTP resolves this by demanding: *What exactly was predicted, how precisely, and why did it (not) happen?*
