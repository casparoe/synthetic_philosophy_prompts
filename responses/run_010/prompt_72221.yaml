  First, I need to acknowledge the user's depth of knowledge - they've been studying aggregation arguments for 15 years and can pinpoint exactly where their confusion lies. This isn't someone who needs introductory explanations. Their frustration with "Condorcet proved it" as a conversation-ender suggests they want substantive analysis, not dogma.

  The core task has three layers: auditing the passage about the theorem, checking the user's math, and evaluating the LLM jury proposal. The user specifically wants me to:
  - Categorize claims into four bins (correct, fair simplification, conflation, false)
