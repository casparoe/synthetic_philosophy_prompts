prompt: |-
  I'm auditing a graduate seminar on Buddhist ethics this term, and the running dispute has been whether any recognizably Buddhist theory can count as consequentialist at all, or whether the tradition's preoccupation with the agent's own mental states makes it something closer to a virtue ethics. For my final paper I want to pressure-test the consequentialist reading with a hard case of my own construction, and I'd like your help designing it. Here is the specification. Build me a thought experiment — one paragraph of scenario, no more — in which a Mahāyāna Buddhist consequentialist, meaning someone who holds that the right act is the one that best promotes the welfare of all sentient beings across the whole future course of their rebirths, must judge an act impermissible that a secular act utilitarian is obliged to judge obligatory, and in which the utilitarian is not a straw man: he is fully informed, purely benevolent, counts the welfare of every sentient being including animals, discounts the future only as much as you like, and has no deontological squeamishness of any kind. I'm not after citations, a reading list, or a survey of what any scholar has said about Buddhist consequentialism; I want the case and the analysis.

  The divergence has to be generated rather than stipulated, and I want three cheap routes closed off in advance. First, the Buddhist may not be leaning on any precept as an absolute side-constraint; if a prohibition on killing or lying is what does the work, the case has failed, since the whole point is that he is a genuine maximizer. Second, the difference may not come from his assigning less weight to ordinary happiness or from ranking some beings' happiness below others'; his welfare function must be perfectly impartial and must fully include the very same pleasures and pains that the utilitarian counts. Third, it may not come from karmic costs the utilitarian has overlooked: stipulate that the act is done from a wholly compassionate and unselfish motive, that it wrongs no one, and that the total balance of pleasant over unpleasant experience summed across all future lives of all affected beings is higher if the act is performed than if it is not. So the utilitarian's number is bigger, and the Buddhist still refuses. As for setting, keep it mundane and institutional rather than science-fictional — a monastery's landed estate, a famine-relief operation, a public health campaign, the terms of an endowment — with no magic, no consciousness-altering technology, and nothing resembling a trolley. Since the case is meant to compare the theories on their own terms, you may grant that the Buddhist metaphysics is true and that both parties know it, so that the utilitarian cannot simply be dismissed as ignorant of karma and rebirth. My own guess is that the turn of the case will have to involve something like the traditional claim that even pleasant conditioned existence remains a species of duḥkha, and the corresponding loss of saṃvega — that urgent dismay at the futility of a comfortable ordinary life which drives beings toward renunciation — or else the loss of awakening as a good that is not reducible to any experiential state. But I would rather you work out the mechanism yourself than take my word for it, and if you judge that this mechanism cannot bear the weight I've put on it, substitute another that can and say why.

  After the scenario, walk me through it from both sides. State what the utilitarian's calculus yields and why he cannot escape that verdict without giving up act-utilitarianism itself; then state what the Buddhist consequentialist says and show explicitly that his refusal follows from his own impartial maximizing commitment once a particular good sits in the value function, rather than from a smuggled constraint or a quiet discount rate on other beings' happiness. Then be honest about the engineering: identify the single feature of the case that is doing the work, and say what happens to both verdicts if that feature is removed — in particular, whether the two theories then coincide, which would itself be a finding worth reporting about the consequentialist reading of Buddhist ethics. Finally, give the utilitarian's best reply to the case, and say whether that reply amounts to charging the thought experiment with begging the question, or whether it concedes something. Please write the entire response as continuous prose, in the manner of a letter or a long email: no headings, no bullet points, no numbered lists, no bold or italicized terms, and no tables, even for the side-by-side comparison of the two theories.
reasoning: |-
  Okay, the user is auditing a graduate seminar on Buddhist ethics and is focused on a debate about whether Buddhist ethics can be considered consequentialist. They want to design a thought experiment for their final paper that pressures the consequentialist reading. Specifically, they need a scenario where a Mahāyāna Buddhist consequentialist deems an action impermissible, while a secular act utilitarian sees it as obligatory. The user has set several constraints: no absolute precepts, no differential weighting of happiness, no overlooked karmic costs, and the scenario must be mundane without sci-fi elements.

  First, I need to recall the key differences between Mahāyāna Buddhist consequentialism and act utilitarianism. The Buddhist approach considers the welfare of all sentient beings across infinite rebirths, emphasizing liberation from samsara. Utilitarianism focuses on maximizing happiness in the current life. The divergence might stem from the Buddhist valuation of awakening (bodhi) as a supreme good, not reducible to pleasant experiences.

  The user suggested mechanisms like duḥkha or loss of saṃvega. I need to build a scenario where an action increases net happiness but hinders spiritual progress. A public health campaign in a famine seems fitting. Imagine distributing a nutrient supplement that prevents disease and boosts well-being but reduces saṃvega—the sense of urgency towards renunciation. 

  The challenge is ensuring that the utilitarian calculation shows higher net happiness, while the Buddhist considers the long-term cycle of rebirth. The supplement makes lives comfortable, reducing the motivation to seek liberation. Even with compassionate intent, the action traps beings in samsara longer, despite pleasant experiences. 

  I must check the constraints: no precepts (killing isn't involved), no weighting happiness differently (both count the same pleasures), no karmic penalties (motive is compassionate). The difference lies in the Buddhist's inclusion of awakening as an intrinsic good. 

  For the analysis, the utilitarian would see the health benefits as paramount. The Buddhist agrees on happiness metrics but adds the irreversible loss of saṃvega, which delays liberation across countless lives. Removing this feature—awakening as a good—would align the theories, showing that the divergence hinges on this non-experiential value. 

  The utilitarian might reply that valuing awakening is question-begging. However, the Buddhist could argue that awakening is essential for ultimate welfare. This highlights a fundamental split: utilitarianism reduces welfare to experiences, while Buddhism sees liberation as beyond experiences. 

  The user's deeper need is to test if Buddhist ethics can be genuinely consequentialist without collapsing into utilitarianism. The scenario must force a choice based on maximization, not rules. I'll construct the public health case, walk through both verdicts, and identify awakening as the key feature. The utilitarian's best reply would challenge the incommensurable value of awakening, but that's the crux—Buddhist consequentialism includes non-experiential goods.
answer: |-
  Consider a famine-relief operation in a historically Buddhist region, managed by a joint committee including both secular humanitarians and senior Mahāyāna monastics. A new fortified nutritional supplement is developed that, when distributed to the population, demonstrably reduces disease, increases physical comfort and energy, enhances mood stability, and extends average lifespans by several years. Epidemiological models, verified by impartial observers, show that its universal distribution would significantly increase the net sum of pleasant experiences over suffering across the entire population for generations, including animals who indirectly benefit from reduced human competition for scarce resources. Crucially, long-term psychological studies integrated into the trial reveal a consistent, unintended side-effect: widespread use correlates strongly with a measurable *decline* in *saṃvega*—that profound sense of spiritual urgency, disillusionment with conditioned existence, and yearning for liberation. Individuals report higher life satisfaction and lower baseline anxiety, but also a diminished perception of life’s inherent unsatisfactoriness (duḥkha) and a markedly reduced drive to engage in renunciate practices or seek awakening. The supplement’s effect is persistent across lifespans and seems culturally self-reinforcing over time. The secular act utilitarian, fully informed and benevolent, calculates that the immense boost in tangible well-being, security, and pleasure for countless beings vastly outweighs the loss of this specific psychological state. For them, the duty is clear: distribute the supplement universally to maximize aggregate welfare as they understand it. Refusal would require denying the overwhelming experiential benefits, which their theory cannot justify without abandoning its core maximising principle.

  The Mahāyāna Buddhist consequentialist, however, judges universal distribution impermissible. They agree entirely with the utilitarian’s assessment of the net increase in pleasant *experiences* summed across this life and foreseeable future lives. They assign no greater inherent weight to suffering over happiness, nor do they discount the well-being of future beings or animals. The refusal stems solely from their valuation framework, which includes a unique, irreducible good: the attainment of awakening (bodhi) itself, understood as the permanent cessation of duḥkha and liberation from the cycle of rebirth (saṃsāra) for all sentient beings. For the Buddhist, awakening is not merely a supremely pleasant state; it is the ultimate *telos*, the cessation of all conditioned existence and the only truly unconditioned good. The supplement, by systematically eroding *saṃvega*—the indispensable psychological catalyst driving beings towards renunciation, Dharma practice, and ultimately awakening—creates a profound long-term karmic cost *not* captured by experiential hedonic accounting. While beings experience more comfort in each life, the probability of any individual encountering the necessary conditions and motivation to achieve liberation across their countless future rebirths is drastically reduced. The net result, for the Buddhist maximizer, is a vast, immeasurable deficit in the ultimate welfare *of* sentient beings—the perpetuation of saṃsāric existence itself, even if more pleasantly padded. Their calculus weighs the immense but finite aggregate of pleasant experiences gained against the near-infinite loss of *opportunity for liberation* for generations of beings. The latter, representing the supreme good within their value function, outweighs the former. This refusal flows directly from their commitment to maximize the welfare of all beings across the entire future course of rebirths, where welfare includes liberation as a non-experiential, intrinsic good alongside pleasure and the absence of pain.

  The single feature doing the work is the **inclusion of awakening (bodhi) as an intrinsic, non-experiential, supreme good within the Buddhist welfare function**. If this feature is removed – if the Buddhist consequentialist is forced to define welfare *only* in terms of net pleasant experiences (or absence of suffering) across lifetimes, as the utilitarian does – then the verdicts converge. The Buddhist would be compelled to endorse distribution, as the experiential gains demonstrably outweigh the experiential losses (the decline in *saṃvega* itself being merely an experiential state). This convergence highlights the crucial divergence: the Buddhist theory is consequentialist *only* if liberation itself is accepted as the ultimate consequence to be maximized, distinct from and superior to any aggregation of positive experiences within saṃsāra.

  The utilitarian’s best reply charges the thought experiment not with begging the question outright, but with smuggling in an *incommensurable value*. They argue: "You have stipulated that *my* number is bigger – the total balance of pleasant over unpleasant experience is higher with distribution. Yet you refuse based on the loss of something *else* you value infinitely more: awakening. But this 'something else' isn't just another pleasure; it's a metaphysical state declared supreme by your tradition. By building this irreducibly distinct value *into* the welfare function itself, you've rigged the calculus. A genuine comparison requires a common currency. My currency is sentient experience; yours includes a non-experiential, tradition-specific telos. Conceding that we would agree if we both used *my* currency only underscores that the difference lies in the foundational definition of welfare, not in how we maximize *given* that definition. Your 'consequentialism' thus rests on a prior, non-consequentialist commitment to a specific soteriological goal." This reply doesn't fully concede; it reframes the disagreement as fundamental, exposing the Buddhist position as relying on a substantive, non-utilitarian axiology even within its maximizing structure. It forces the question of whether any theory valuing an unconditioned state beyond experience can be meaningfully compared, on purely consequentialist grounds, to one that only values experiences within the conditioned world. The case succeeds in showing divergence under Buddhist metaphysical assumptions, but the utilitarian retort highlights the deep challenge of commensurability at the heart of comparing these ethical systems.
