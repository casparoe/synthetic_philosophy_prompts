prompt: |-
  I'm a fourth-year in philosophy of science and in three weeks I'm presenting a paper at our department's work-in-progress seminar. The thesis: the pessimistic meta-induction has been run on the wrong target. Instead of totting up which theoretical posits got thrown out (the usual Laudan-style list of dead entities), I run the induction over the explanatory work a false theory's predictive success actually rested on. The punchline is that the realist's answer — success is explained by approximate truth — requires knowing which parts of a theory are the load-bearing ones, and that's only ever determinable retrospectively. So the selective realist's move, keep the working parts and dump the rest, can't be made at the time it needs to be made, which is now, for the theory in front of us. That's the whole paper.

  The room: about fifteen people. Two faculty who are selective realists and will be irritated. One structural realist who thinks he solved my problem decades ago and may well be right. A historian of chemistry who thinks philosophers' use of phlositon and caloric as counterexamples is anachronistic garbage. A hard instrumentalist grad student who'll say the whole fight is pointless and we both lose. Another grad student working on underdetermination who will want to know why I'm not just reinventing that argument. Nobody else does history of physics.

  Give me a prep sheet for the question period, not a defense of the view. I want the objections this particular room will raise, in their own vocabulary — not generic "critics of realism say" phrasing — ordered by how much damage each does if I fumble it. For each one: a reply I can deliver in about ninety seconds, and a blunt note on where that reply is soft, question-begging, or quietly concedes the point. Then tell me what to concede up front in the opening so I'm not conceding it under fire, and name the one question I should be praying nobody asks — I have a feeling it comes out of the structural realist's corner, but I can't see what my answer would be. Finally, if you think there's a hole in the thesis that none of these people are positioned to find, say so.
reasoning: |-
  Okay, the user is a fourth-year philosophy of science student preparing for a seminar presentation. Their thesis argues that the pessimistic meta-induction should target the explanatory foundations of predictive success rather than discarded theoretical entities. They need a prep sheet for Q&A focused on objections from their specific audience.

  I need to analyze the audience composition first. There are two selective realists who'll defend their position, a structural realist who believes he's solved this problem, a historian of chemistry critical of anachronistic examples, an instrumentalist grad student, and an underdetermination-focused grad student. Each brings unique challenges.

  The core thesis vulnerability is that selective realism requires retrospective identification of "load-bearing" theory components. I should identify objections ordered by potential damage. The structural realist's objection is most dangerous - if they've genuinely solved the retrospective identification problem, it undermines the entire thesis. I need to prepare a response that acknowledges their framework while showing why it doesn't resolve the epistemic access issue.

  Other high-damage objections include the selective realist challenge about present criteria for identifying load-bearing parts, and the underdetermination scholar's claim that this just reinvents their argument. The historian's anachronism critique matters for case studies but doesn't touch the core argument. The instrumentalist's dismissal is rhetorically potent but philosophically lightweight.

  For each objection, I'll craft 90-second responses with clear weaknesses noted. The structural realist reply should grant their framework's value while arguing that structure-preservation still requires retrospective confirmation. This is soft because it might concede too much if structure is truly detectable in real-time.

  The preemptive concession should address the underdetermination similarity upfront to prevent that distraction. The historian's concern should be handled by using uncontested examples like Fresnel's ether. The "pray they don't ask" question is whether structural realism solves the epistemic access problem - the response admits this is a live issue requiring further work.

  Finally, the unnoticed hole might be that success sometimes clearly isolates load-bearing components (like Neptune's discovery), though these are exceptions. This deserves a footnote in the paper rather than seminar focus.
answer: |-
  Here's your prep sheet, tailored to your room and ordered by potential damage. Focus on staying crisp in Q&A - these replies are designed for delivery, not deep debate.

  ### Objection Priority & Responses (High to Low Damage)
  1.  **Structural Realist: "But Worrall's structure preservation *does* tell us what survives prospectively. The structural core (equations, relations) is the load-bearing part *by definition*, and we can isolate it *now* by looking at mathematical formalism and continuity."**
      *   **Damage if Fumbled:** High. Directly attacks your core claim that identification is *only* retrospective. If convincing, dismantles your thesis.
      *   **90-Second Reply:** "You're right, structuralism offers a compelling *candidate* for the load-bearing part. But my worry is epistemic: how do we know *now* which specific structural features are *causally responsible* for the current success *and* will be preserved? Fresnel's equations worked, but were embedded in an ether theory whose *structural commitments* (e.g., mechanical properties of the ether medium) were later discarded. Preserving the *form* of the equations required radically reinterpreting the *ontological commitments* of the structure. We only know *post-hoc* which structural aspects were truly indispensable to the *specific* predictive success at hand."
      *   **Where it's Soft/Concedes:** Soft: It grants structural continuity happens. Concedes: The structuralist *has* a prospective criterion (formalism). It hinges on arguing that identifying the *salient*, *causally responsible* structure *within* the formalism is still retrospective. Begging the Question?: Implicitly assumes the structuralist criterion isn't sufficiently determinate prospectively.

  2.  **Selective Realist #1: "We *do* have criteria *now*! We look for components robustly involved in multiple, diverse successful predictions, especially novel ones. The 'working parts' reveal themselves through their repeated, indispensable role in success."**
      *   **Damage if Fumbled:** High. Directly challenges your claim that we can't identify load-bearing parts prospectively. Undercuts the "only retrospectively" punchline.
      *   **90-Second Reply:** "I agree robustness is a key criterion realists *use*. But the meta-induction worry is precisely that this criterion isn't foolproof prospectively. Consider the caloric theory: its core assumptions about heat flow and conservation were robustly successful across diverse phenomena (specific heats, phase changes, gas laws) for decades. It *looked* like the load-bearing part. Yet, it was entirely abandoned. The robustness *itself* was explained away by kinetic theory. Retrospectively, we see the robustness tracked *something* real (energy conservation/motion), but misidentified the *nature* of the load-bearing component *at the time*."
      *   **Where it's Soft/Concedes:** Soft: It grants robustness is a good heuristic. Concedes: Robustness *is* a prospective marker. Begging the Question?: Relies on historical cases where robustness *appeared* present but was misleading – requires the historical claim to hold.

  3.  **Underdetermination Grad Student: "Isn't this just repackaging underdetermination? The 'which part is load-bearing' problem *is* the problem of multiple incompatible interpretations of the same predictive apparatus."**
      *   **Damage if Fumbled:** Medium-High. Makes your argument seem derivative or less novel. Could sidetrack discussion.
      *   **90-Second Reply:** "It's deeply related, but my target is different. Underdetermination says many theories fit the data. My argument focuses on *one specific, successful theory* and asks: *even if we accept its success*, can we reliably parse *within that specific theory* which parts are responsible for the success and thus approximately true? The Laudan-style PMI attacks the whole theory; selective realism tries to parse it; I argue that parsing *within the theory* is subject to the same retrospective vulnerability. It's the *selective realist's response to underdetermination* that I'm running the induction *on*."
      *   **Where it's Soft/Concedes:** Soft: Acknowledges the close link. Concedes: The epistemic problem has similarities. Begging the Question?: Assumes the "parsing within one theory" problem is distinct enough from generic underdetermination to be novel.

  4.  **Selective Realist #2: "Your argument proves too much. If we can *never* know prospectively, how does science make progress? We *do* build on past theories by identifying and keeping what worked. Your view seems to collapse into radical skepticism about continuity."**
      *   **Damage if Fumbled:** Medium. Portrays your view as undermining science itself, making it seem implausible. Rhetorically potent.
      *   **90-Second Reply:** "I'm not denying continuity exists! Science clearly progresses. My point is *epistemological*, not metaphysical. We *do* build on past successes, but my claim is that *identifying exactly which aspects of past theories were the crucial ones for their specific successes* is often only clear in hindsight. Progress often involves reinterpretation or realizing *why* something worked, which wasn't apparent at the time. This doesn't make progress impossible; it just means the *justification* the selective realist wants – knowing *now* which parts of our *current* theories are the truly load-bearing, approximately true ones – isn't as secure as they claim."
      *   **Where it's Soft/Concedes:** Concedes: Science progresses. Soft: Distinguishes epistemology from metaphysics/practice. Begging the Question?: Relies on the historical claim that reinterpretation is common.

  5.  **Historian of Chemistry: "Using phlogiston/caloric as 'false theories with success' is bad history. They were productive frameworks that evolved, and their 'posits' were often instrumental or model-relative. You're judging them by anachronistic standards of 'truth'."**
      *   **Damage if Fumbled:** Medium. Undermines your key historical examples, weakening the inductive base.
      *   **90-Second Reply:** "That's a crucial point, and I should be careful. My argument doesn't necessarily require calling the *theorists themselves* wrong about what they were doing. The point is that *from our current perspective*, we judge those theoretical frameworks as not accurately describing the world (e.g., there is no phlogiston substance), *despite* their predictive successes. The question for the meta-induction is: *retrospectively*, what aspects of those frameworks actually underwrote their successes? Often, it wasn't the core ontology they emphasized. Whether they saw parts as 'instrumental' or not, the selective realist needs to identify *now* what in *our* theories plays the analogous 'success-underwriting' role."
      *   **Where it's Soft/Concedes:** Concedes: The historical cases are complex and anachronism is a risk. Soft: Shifts focus to the *retrospective* analysis from *our* perspective and the challenge for *current* theories.

  6.  **Instrumentalist Grad Student: "This just shows the whole realism/anti-realism debate is pointless. Both sides are chasing justification for something science doesn't need – 'truth'. Just predict and shut up."**
      *   **Damage if Fumbled:** Low-Medium. Rhetorical, tries to dismiss the whole enterprise. Can be defanged.
      *   **90-Second Reply:** "You might be right that science 'works' without settling realism! But that doesn't make the *philosophical question* of how to interpret the undeniable predictive success of science pointless. Realists offer an explanation (approximate truth). The PMI, and my version of it, challenges whether that explanation is justified. Even if you're an instrumentalist, my argument might resonate: it highlights the difficulty in extracting ontological commitments *even selectively* from success. But I'm engaging the realist on their own terms to show an internal tension."
      *   **Where it's Soft/Concedes:** Concedes: Instrumentalism avoids the problem. Soft: Reframes the argument as internal to realism. Begging the Question?: Assumes the philosophical debate has value.

  **What to Concede Up Front (In Your Opening):**
  *   **The Underdetermination Link:** "Now, someone might rightly point out this sounds similar to underdetermination worries. While related, my focus is specifically on the challenge of parsing *within* an accepted, predictively successful theory to identify the components responsible for that success *at the time it's being used*, arguing this parsing is subject to retrospective revision just like the theory as a whole." (This disarms Objection #3 preemptively).
  *   **Historical Nuance:** "I'll be using historical examples like caloric or phlogiston. I acknowledge these are complex cases historically, and I'm using them from our *retrospective* perspective as theories whose core ontological commitments we now reject, *despite* their past successes." (This softens the ground for Objection #5).

  **The Question to Pray Nobody Asks (Likely from the Structural Realist):**
  *   **"If structure preservation *isn't* the prospective criterion, what *would* count as successfully identifying the 'load-bearing part' prospectively in a way that avoids your induction? Or is your argument that it's *impossible in principle*, rendering selective realism incoherent?"**
      *   **Why it's Dangerous:** It forces you to either:
          1.  **Admit the Challenge is Insurmountable:** Which pushes you towards a much stronger skepticism than your thesis currently implies (potentially collapsing into the instrumentalist position or a very deep skepticism).
          2.  **Propose an Alternative Criterion:** Which is incredibly hard (you've just argued existing ones fail) and leaves you open to immediate counterexamples.
          3.  **Retreat into Vagueness:** Weakens your position.
      *   **Your Best 90-Second Reply (Damage Control):** "That's the toughest question. I'm not claiming it's *impossible in principle* – perhaps there are cases where the success is so specific and isolated it clearly points to one component. My claim is that *in general*, for the complex theories central to the PMI debate, the *reliable identification* of which part was truly indispensable, in a way that secures approximate truth *as we understand it now*, is only possible retrospectively. Structuralism offers a candidate, but as I argued earlier, even preserved structure often requires radical reinterpretation of its meaning or ontological grounding. We lack a prospective criterion that guarantees we've correctly identified *the specific aspect* responsible *and* its future ontological fate. Selective realism *aspires* to do this, but the meta-induction suggests its track record for doing so *at the time* is poor." *(This leans towards Option 1 but softens it with "in general" and leaves the door slightly ajar for rare cases, while reiterating the critique of structuralism).*
      *   **Why it's Still Soft:** It doesn't fully escape the dilemma. It implicitly concedes the structuralist *might* have a point in some cases, and the "in general" is vague. The core vulnerability remains.

  **The Hole None of Them Are Positioned to Find:**
  *   **The "Success" Problem:** Your argument relies on identifying the "predictive success" that needs explaining. But what counts as a "success" worthy of realist explanation is contested. Is it *any* true prediction? Novel predictions? Only ones involving significant theoretical depth? Your induction runs over the explanatory work *for a given success*, but if what counts as a "success" itself changes over time or is theory-laden, your target becomes blurry. A historian or sociologist of science might be best placed to poke here, questioning the stability of "success" itself as the anchor for your induction. It doesn't destroy your argument, but it adds another layer of complexity you haven't addressed.

  **Final Prep Tip:** Practice delivering your core thesis and these replies *out loud*, timing yourself. Focus on clarity and conciseness. For the Structural Realist and Selective Realist objections, know your key historical example (like Fresnel or Caloric) cold. Good luck!
