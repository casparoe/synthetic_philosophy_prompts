  Pretend you're a philosopher of decision theory who also actually does the math — I want the technical steps correct, not hand-waved, but explained so a smart non-specialist can follow. Think hard before you answer: maybe start by brainstorming three or four candidate diagnoses of what went wrong in the episode, then pick one and defend it.

  The episode is the St Petersburg lottery, 1713–1738. Nicolas Bernoulli writes to Montmort in 1713 with a game: flip a fair coin until the first head, and if the first head lands on toss n you get paid 2^(n-1) ducats. The expected payoff is 1/2 + 1/2 + 1/2 + ... = infinity, and yet, as his cousin Daniel later observes, any reasonably sane man would happily sell his chance for twenty ducats. In 1738 Daniel Bernoulli publishes his own treatment in the St Petersburg academy's proceedings and offers the fix everyone remembers: don't average money, average utility, and let utility be logarithmic in your total wealth, so gains count for less the richer you already are. (Cramer had floated a square-root version in a letter a decade earlier.) Under log utility the game's expected utility is finite and the paradox dissolves. Two centuries later Menger points out this can't be the whole story, since for any unbounded utility function you can cook up a game whose prizes grow fast enough to break it again — so the received moral is that utility has to be bounded.

  Now run that whole episode through the lens of the Pasadena game. For the record, since I want us working from the same setup: fair coin flipped until heads; if heads first lands on toss n you win 2^n/n dollars when n is odd and lose 2^n/n dollars when n is even.

  What I'm after:

  1. Set the Pasadena game up explicitly and show term by term why the natural ordering gives ln 2 while the expectation as a whole doesn't exist. I want the difference between a conditionally convergent series and an undefined one spelled out, because I'm pretty sure people — me included — slide between them.

  2. Does the Bernoulli move help Pasadena at all? My hunch is no: log or bounded utility is a remedy for magnitude, and Pasadena's disease is sign and ordering, so no monotone re-scaling of the payoffs touches it. If that's right, then Menger's conclusion was aimed at the wrong enemy, and the 1738 episode turns out to be a solution to a special case of a problem nobody had stated yet. Or am I overstating? Tell me exactly where.

  3. Here's something I've been turning over. Suppose you actually play Pasadena over and over and average the results. My intuition is that the running average creeps toward ln 2 — slowly, with horrible swings, but it settles — which would mean there's a stable number attached to the game even though its expectation doesn't exist. Is that right, and roughly why? And if it is: does decision theory actually need an expectation, or only something like a law of large numbers? Worth remembering that what worried the Bernoullis arguably wasn't a one-shot ticket but repeated gambling and whether a man gets ruined doing it.

  4. Where is the Pasadena lens simply silent about the real episode? The stuff that actually made 1713 readers uneasy — who is on the hook to pay, whether any casino can cover 2^40 ducats, the fact that the variance kills you long before the expectation does — does any of that show up in the modern framing, or does the framing quietly assume it away?

  5. Verdict, running both directions: does the episode confirm the Pasadena diagnosis, or is it an anomaly for it? Was the hole in expected value already visible in 1738 under a different name, or does Pasadena genuinely find something the Bernoullis had no way of seeing?

  Don't bother with citations or a reading list, I can't look anything up anyway — I just want the reasoning. And flag the single step you're least confident about.
