prompt: |-
  I have spent a decade in the calibration-obsessed corner of the internet — Brier scores on forecasting platforms, arguments about proper scoring rules, the standing insistence that a credence earns its keep only through long-run accuracy. That sensibility eventually pushed me into the formal literature, and I have now settled into something like accuracy-first epistemology as my house view. Let me state the version I actually hold, because I want the attack aimed at it rather than at a caricature.

  My commitments are these. First, accuracy — the closeness of one's credences to the truth — is the sole fundamental epistemic good, and every other epistemic norm is derivative of it. Second, the inaccuracy of a credal state is the additive sum of the inaccuracies of its component credences, each graded by a strictly proper scoring rule, and I accept the arguments that plausible constraints on such rules single out the quadratic family. Third, probabilism and conditionalization follow from dominance and expected-accuracy considerations: incoherent credences are accuracy-dominated by coherent alternatives, and conditionalizing maximizes expected accuracy by the agent's own lights. Fourth, and deliberately, I do not claim the framework settles the value of knowledge over mere true belief, adjudicates disagreement, or tells us which propositions one ought to have opinions about; I treat those as out of scope.

  I know the objections exist in outline: that the choice of scoring rule does unearned work; that the constraints forcing the quadratic measure then generate verdicts of their own that look unacceptable, including an updating rule critics have charged with being flatly irrational; that dominance results shift depending on how finely propositions are individuated; that infinite or continuous setups may leave no accuracy-maximizing credence function at all; that imprecise or set-valued credences may resist domination; and the broader charge that grounding epistemic norms in the promotion of a good is epistemic consequentialism, which trades accuracy across propositions in a way that ignores the separateness of propositions. What I want is not a reprise of those slogans but a map of my exposure.

  So: what would have to be true for the position as I stated it to be false? Work through the pressure points and tell me, for each, (a) exactly what result, case, or intuition would count as a defeater rather than an irritation, (b) whether that defeater is live — established, or at least seriously contested by people who accept the framework's basic machinery — or merely logically possible, and (c) whether an accuracy-first theorist would concede it as counting against the view or explain it away, and on what grounds. Rank them from fatal to merely awkward, and say where you think the real fault line runs.

  Then take up two questions I cannot resolve myself. Does this framework risk anything at all, or has it been insulated by scoping disclaimers like my fourth commitment into a position compatible with any outcome whatsoever — and if it is that insulated, is that a defect in a normative theory of this kind, or precisely what such a theory is supposed to be? And what does accuracy-first epistemology predict or rule out that its rivals — pragmatic betting-based vindications, knowledge-first accounts, imprecise Bayesianism — leave open? If the honest answer is nothing, say so. You will not be able to check sources, and I do not want a reference list or a bibliography; I know the shape of the literature and want your reasoning and your verdicts instead.
reasoning: |-
  Okay, the user has spent a decade in calibration-focused communities and now holds an accuracy-first epistemology view. They've clearly articulated their commitments: accuracy as the sole epistemic good, additive inaccuracy with strictly proper scoring rules (quadratic), probabilism and conditionalization from dominance/expected accuracy, and deliberately excluding certain issues like the value of knowledge. They're aware of objections but want a structured analysis of defeaters rather than rehashed arguments.

  Hmm, this is a highly sophisticated request. The user isn't just looking for counterarguments - they want a vulnerability assessment of their specific position. The phrase "map of my exposure" suggests they're preparing for philosophical combat. Interesting that they dismiss "slogans" - this signals impatience with superficial critiques.

  First, I need to address the core request: what would falsify their position? The objections they listed need categorization by severity. The dominance argument's dependency on proposition individuation seems particularly damning - if the framework can't consistently identify dominated credences across partitions, that strikes at its coherence. The updating rule critique (Brier score forcing non-Bayesian updates) also feels fatal if true, since conditionalization is non-negotiable for them.

  For the two special questions: The scoping disclaimers do create an "untouchable core" problem. If every counterexample can be dismissed as "out of scope," that's textbook unfalsifiability - deadly for a normative theory. But interestingly, their rivals have similar insulation issues. The pragmatic approach can always appeal to unstated utilities, while knowledge-first accounts often rely on primitive notions.

  On predictive power... that's tricky. Accuracy-first does make one unique claim: that strictly proper scoring rules should govern all epistemic evaluation. Rivals either reject scoring rules (knowledge-first) or dilute them (imprecise Bayesians). But in practice? When comparing actual epistemic recommendations, the differences often collapse. The real distinction might be methodological - accuracy-first offers formal precision others lack, but perhaps at the cost of flexibility.

  The user's tone suggests they'd respect bluntness. I'll rank the defeaters from lethal to survivable, and call out the insulation issue as the most profound weakness. No pandering - they've clearly done the reading and want steelman criticism.
answer: |-
  Here's a systematic pressure test of your accuracy-first epistemology, structured as requested. I'll address the core vulnerabilities, rank them by severity, then tackle your two unresolved questions with direct verdicts.

  ### Fatal or Near-Fatal Defeaters (Strike at Foundational Proofs)
  1.  **Dominance Failure Under Coarse-Graining:**
      *   **(a) Defeater:** A demonstrably rational agent holds credences *incoherent* under fine partitioning (e.g., P(A), P(B|A), P(B|~A)) but becomes accuracy-*dominant* over coherent alternatives when propositions are coarse-grained (e.g., collapsing to just P(B)). Coherent credences under fine partitioning are accuracy-dominated *only* when assessed under that fine partition, but *not* under the coarse partition the agent rationally uses.
      *   **(b) Liveness:** Seriously contested. Seidenfeld, Schervish, & Kadane (2012) argue dominance is partition-relative. The "Borel-Kolmogorov paradox" highlights related consistency issues. This isn't settled.
      *   **(c) Accuracy-First Response:** Concession that dominance is partition-sensitive is devastating. Expected accuracy arguments might be salvaged, but the clean "dominance → probabilism" proof collapses. Common retreats (e.g., "agents *should* use finest partitions") feel ad hoc and lack accuracy-first justification *within the core framework*.
      *   **Rank:** **Fatal** to the dominance *proof* of probabilism as a universal norm. Undermines a core selling point.

  2.  **The Updating Rule Implied by Quadratic Scoring:**
      *   **(a) Defeater:** The necessity of quadratic scoring uniquely forces an updating rule demonstrably irrational in specific cases. E.g., upon learning *only* that a coin is biased (without direction), quadratic score maximization *requires* shifting credences towards 0.5 for heads/tails (minimizing *expected* inaccuracy under uncertainty about the bias), contradicting Conditionalization which demands no shift without specific evidence about the bias direction. Critics (Levinstein, Greaves) argue this is "learning *nothing* but becoming more uncertain."
      *   **(b) Liveness:** Established result within the framework (known consequence of quadratic scores + expected accuracy maximization). Seriously contested whether this rule (sometimes called "Hájek's Rule" or "Jeffrey Updating on Everything") is rational.
      *   **(c) Accuracy-First Response:** Major concession point. Some bite the bullet (arguing the shift *is* rational as minimizing *expected* inaccuracy given the limited evidence). Others weaken the commitment (e.g., exploring alternative scoring rules, accepting conditionalization as a separate norm). This directly contradicts your commitment that conditionalization follows *solely* from expected accuracy maximization with quadratic scores.
      *   **Rank:** **Near-Fatal** to the *derivation* of Conditionalization via expected accuracy + quadratic scores. Forces a choice: abandon quadratic scores, abandon expected-accuracy derivation of updating, or accept a deeply counterintuitive update rule.

  ### Serious but Potentially Survivable Weaknesses (Challenge Scope or Uniqueness)
  3.  **No Accuracy-Maximizer in Infinite/Continuous Cases:**
      *   **(a) Defeater:** In continuous hypothesis spaces (e.g., location of a point on a circle), no probability distribution maximizes expected accuracy (minimizes expected Brier score) – every coherent credence is dominated or infinitely inaccurate somewhere. Strict dominance arguments for probabilism fail.
      *   **(b) Liveness:** Established mathematical fact.
      *   **(c) Accuracy-First Response:** Generally conceded. Responses include: retreating to *approximate* dominance/calibration (Pettigrew), arguing finite agents only need finite approximations, or shifting focus entirely to minimizing *worst-case* loss (minimax) which often recommends imprecise credences. This doesn't falsify the core but severely limits its universal applicability and the dominance argument's scope.
      *   **Rank:** **Seriously Awkward** – forces restriction to finite/discrete cases or major reformulation, undermining universality claims.

  4.  **Imprecise Credences Resist Domination:**
      *   **(a) Defeater:** Rational agents with imprecise credences (sets of probability functions) are often *not* accuracy-dominated by any single precise probability function. Dominance arguments fail to compel preciseness.
      *   **(b) Liveness:** Established result (Seidenfeld et al.). Hotly debated whether imprecise credences are ever rational.
      *   **(c) Accuracy-First Response:** Concession that dominance doesn't compel preciseness. Responses: argue imprecise credences are irrational (often based on pragmatic or decision-theoretic grounds *outside* pure accuracy), develop alternative accuracy-based arguments *for* imprecision (e.g., minimizing worst-case loss), or weaken the scope ("probabilism applies only when precise credences are warranted"). Doesn't falsify core accuracy goals but challenges the derivation of *precise* probabilism.
      *   **Rank:** **Awkward to Serious** – challenges the *necessity* of precise probabilism derived *solely* from dominance. Requires auxiliary arguments against imprecision or acceptance of it.

  ### Awkward Irritants (Philosophical Tensions)
  5.  **Epistemic Consequentialism & "Separateness of Propositions":**
      *   **(a) Defeater:** An agent can trade massive inaccuracy on one proposition (e.g., believing a false, trivial claim) for tiny gains on many others, leading to lower *overall* inaccuracy. This seems epistemically permissible (even obligatory) within the framework but violates intuitions about the intrinsic wrongness of believing falsehoods/irresponsibility towards individual propositions.
      *   **(b) Liveness:** Serious philosophical objection (Berker, Carr), though often from outside the framework.
      *   **(c) Accuracy-First Response:** Usually explain away. Argue intuitions are wrong/misguided by pragmatic concerns, or that the scoring rule's sensitivity to truth-value magnitudes (Brier) *does* capture some sense of "wrongness" proportional to error. Concede the "trading" is allowed but downplay its significance relative to core coherence results.
      *   **Rank:** **Awkward** – highlights a counterintuitive implication but doesn't directly contradict core proofs. A feature, not a bug, for many accuracy-firsters.

  6.  **Scoring Rule Choice & "Unearned Work":**
      *   **(a) Defeater:** The arguments forcing quadratic scores (e.g., Symmetry, Normality, Differentiability) generate verdicts that seem independently problematic (e.g., the updating rule in #2). The constraints do "unearned work" in selecting the rule that then generates controversial implications.
      *   **(b) Liveness:** Logically possible consequence, seriously discussed (Levinstein, Schoenfield).
      *   **(c) Accuracy-First Response:** Argue the constraints *are* independently plausible and the controversial implications must be accepted, or explore relaxing constraints (e.g., dropping differentiability – leads to spherical scoring rules). Defends the *process* of justifying the rule.
      *   **Rank:** **Awkward** – weakens the "uniqueness" justification for quadratic scores if its implications are rejected, but doesn't destroy the framework if alternatives are viable.

  **The Real Fault Line:** The deepest crack runs between **the dominance arguments for coherence (#1 & #3) and the expected-accuracy derivation of updating (#2)**. The framework struggles to provide a unified, partition-invariant, universally applicable accuracy-based foundation for *both* static coherence and dynamic updating using the same scoring rule. The updating problem (#2) is arguably the sharpest *internal* contradiction within your stated commitments.

  ---

  ### Addressing Your Unresolved Questions

  1.  **Insulation by Scoping Disclaimers:**
      *   **Risk:** Your view *is* insulated in the sense that rejecting it requires attacking its core derivations (probabilism/conditionalization from accuracy-dominance/expected-accuracy + quadratic scores). Disclaimers shield it from objections about scope (e.g., value of knowledge, peer disagreement, proposition selection).
      *   **Defect?** For a *foundational normative theory*, this insulation is **a significant defect**. A good normative theory shouldn't just avoid falsification by declaring inconvenient cases "out of scope"; it should provide *positive guidance* or principled reasons *within its own framework* for where it applies and why those other issues are secondary or derivative. Your framework struggles with this. It risks being a "solution in search of problems" (coherence and updating), unable to engage with core epistemic phenomena it explicitly excludes. While normative theories need scope, insulation via *disclaimer* rather than *principled delimitation* feels evasive. Pragmatic vindications and knowledge-first accounts often claim *broader* explanatory scope, even if contested.

  2.  **Predictive Power vs. Rivals:**
      *   **Honest Answer:** Accuracy-first epistemology, *as you've scoped it*, **predicts or rules out very little that its core rivals leave open, *except* for the specific derivations of probabilism and conditionalization via dominance/expected accuracy with quadratic scores.** Here's the breakdown:
          *   **vs. Pragmatic Vindications (e.g., Dutch Book):** Both aim to vindicate probabilism and conditionalization. Accuracy-first claims the vindication is purely epistemic (accuracy), not pragmatic (avoiding sure loss). This is a difference in *justification*, not in the *norms prescribed*. Pragmatic views often remain silent or flexible on scoring rules/properness, while accuracy-first is rigidly tied to them (especially quadratic).
          *   **vs. Knowledge-First Epistemology:** Fundamentally different. Knowledge-first rejects credence-first approaches and the primacy of graded accuracy as the *sole* fundamental epistemic good. It predicts/rules out different things (e.g., the possibility of justified false belief, the non-reducibility of knowledge, the significance of safety/sensitivity). Accuracy-first is largely silent on knowledge-specific norms within your scope.
          *   **vs. Imprecise Bayesianism:** Accuracy-first *as you state it* (insisting on precise probabilism via dominance) rules out the rationality of imprecise credences (#4 above). Imprecise Bayesianism leaves it open (or endorses it). However, *modified* accuracy-first views (using min-max or other criteria) can accommodate imprecision, blurring this distinction. Accuracy-first uniquely *demands* strict properness for evaluating precise credences.
      *   **The Unique Core Prediction:** The framework's most distinctive, falsifiable claim is that **rational updating, *when framed as maximizing expected accuracy using one's prior and the scoring rule*, *must* use the specific updating rule implied by the quadratic score** (which diverges from Conditionalization in cases of unspecific evidence – #2 above). *No* rival framework predicts *this specific* updating rule. Pragmatic views typically lead to Conditionalization. Knowledge-first doesn't operate at this credence level. Imprecise Bayesians have different update dynamics. This is where your view is most exposed and unique, for better or worse.

  **Verdict:** Your accuracy-first view is robust *internally* for justifying probabilism and conditionalization *in standard, finite, discrete cases under fine partitions*, using quadratic scores. Its **fatal exposure** lies in the **partition-relativity of dominance (#1)** and the **counterintuitive updating rule forced by quadratic scores (#2)**. The former breaks the dominance argument universally; the latter breaks the expected-accuracy derivation of conditionalization and reveals a tension between the chosen scoring rule and intuitive updating. Scoping disclaimers insulate the core but at the cost of limited explanatory power. Its unique predictive edge is narrow and controversial (the quadratic update rule). The framework's survival hinges on resolving the updating paradox or abandoning the strict expected-accuracy derivation, and on finding a non-arbitrary defense of proposition individuation for dominance arguments.
