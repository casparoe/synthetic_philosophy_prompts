prompt: |-
  I teach a first-year graduate game theory sequence, and an exercise I set has come back on me. To show that dominance reasoning is subtler than it looks, I wrote out what I intended as a reductio of the whole apparatus — an argument that seems to prove iterated elimination of strictly dominated strategies can never do any work — and I expected the flaw to be obvious to the class. It was not obvious to me either, and two colleagues have since located it in different places, so I want an independent diagnosis before I circulate a model answer.

  The game, G. Row chooses U, M or D; Column chooses L or R. Payoffs are (Row, Column):

  |  | L | R |
  |---|---|---|
  | U | (1, 2) | (0, 0) |
  | M | (0, 0) | (1, 2) |
  | D | (0.4, 1) | (0.4, 1) |

  The argument.

  (1) A rational player never plays a strictly dominated strategy, since a strictly dominated strategy is one that some available alternative beats whatever the others do, and a payoff-maximiser would use that alternative instead.

  (2) Strict dominance is a comparison between single strategies. To ask whether s is strictly dominated is to compare s against each of the player's other strategies in turn; a mixture is not an alternative alongside the pure strategies it mixes but a device for sometimes playing one of them and sometimes another, so it adds nothing to the inventory of potential dominators.

  (3) Nor does it add anything indirectly. If a mixture beats s in every column, then in each column its payoff is a weighted average of the payoffs the pure strategies in its support earn in that column, and an average cannot strictly exceed every quantity being averaged; so in each column at least one pure strategy in the support beats s there. Comparing s against the pure strategies one at a time therefore captures everything that dominance comparisons ever capture.

  (4) In G, U is a best reply to L and M is a best reply to R, and neither L nor R beats the other against all three of Row's strategies. So no pure strategy of either player is strictly dominated by another pure strategy of that player.

  (5) Hence, by (2) and (3), nothing in G is strictly dominated, and iterated elimination of strictly dominated strategies removes nothing from G.

  (6) That procedure is order-independent, preserves every Nash equilibrium, and leaves exactly the strategies consistent with common knowledge of rationality.

  (7) So D is consistent with common knowledge of rationality in G; and more generally, since any strategy that is a best reply to some conjecture survives the procedure, elimination is inert in every game in which each strategy is a best reply to something.

  (8) But half-U-half-M earns 0.5 against both L and R while D earns 0.4, so a Row player using D does strictly worse than one who randomises, whatever Column does; and the criterion was supposed to rule out precisely that.

  (9) Therefore (1) is false: rationality does not exclude strictly dominated play, and dominance reasoning cannot be relied upon to capture common belief in rationality.

  I find (9) unacceptable and I am confident the argument is not sound, but I cannot say where it fails. My own suspicion is somewhere between (3) and (5). One colleague insists the trouble is at (6): since D is never a best reply to anything Column might do, (7) already contradicts what (6) says survives, so the argument is internally inconsistent rather than unsound. Another thinks (2) is simply true and that (8) must go instead, on the grounds that a player in a one-shot game with no randomising device cannot implement a mixture, so nothing beats D in the only sense that matters.

  Could you settle this? Specifically: identify the step or steps you reject and say precisely what is wrong with them; explain why each rejected step looked compelling to an attentive reader; and price the repairs. I want to know what I must give up if I allow mixtures as dominators — what that presupposes about the players' action sets and their access to randomisation, what it does to the relationship between surviving strategies and rationalisability, and whether anything changes if the dominance at issue is weak rather than strict — and what I lose if I keep (2) and (3) and define the procedure pairwise. Tell me too whether my first colleague is right that (6) and (7) are in tension, or whether that tension dissolves once the earlier steps are repaired.

  Please be as definite as the material allows: give me a verdict on each numbered step rather than a survey of possible readings, and flag only those points where you think reasonable people could still differ. Close by saying what would change your mind — which consideration, if you have got it wrong, would leave the argument standing at (9) — and where you think your own diagnosis is most likely to fail.

  No more than 800 words.
reasoning: |-
  We are given a game G with Row playing U, M, D and Column playing L or R. The payoffs are:

          L       R
  U      (1,2)   (0,0)
  M      (0,0)   (1,2)
  D      (0.4,1) (0.4,1)

  The argument presented is a reductio that seems to show that iterated elimination of strictly dominated strategies (IESDS) does nothing in this game, and by extension, in any game where every strategy is a best reply to some conjecture. The conclusion (9) is that rationality does not exclude strictly dominated play. We are to find the flaw.

  Let's go step by step.

  (1) "A rational player never plays a strictly dominated strategy, ..." 
  This is standard and we accept it.

  (2) "Strict dominance is a comparison between single strategies. ... a mixture is not an alternative alongside the pure strategies ... so it adds nothing to the inventory of potential dominators."
  This is the crux. The argument claims that a mixed strategy is not an "alternative" because it is just a device for randomizing. However, in the standard definition of strict dominance, a pure strategy s is strictly dominated if there exists *any* strategy (pure or mixed) that yields a strictly higher payoff against every pure strategy of the opponents. Therefore, (2) is incorrect because it restricts the dominators to pure strategies. In fact, the definition of strict dominance allows for mixed strategies to dominate a pure strategy. Thus, step (2) is flawed.

  Why might (2) look compelling? Because one might think that a mixed strategy is not a distinct action but a way of choosing actions. However, in the theory of games, when we define dominance, we do consider mixed strategies as potential dominators. The reason is that even if a player cannot commit to a mixed strategy (if there is no randomizing device), the existence of a mixed strategy that dominates a pure strategy implies that the pure strategy is never a best response (to any belief about the opponents). Therefore, a rational player would not play it.

  (3) "If a mixture beats s in every column, then ... in each column at least one pure strategy in the support beats s there. ..."
  This step is mathematically correct. If a mixed strategy σ strictly dominates a pure strategy s, then for every column (i.e., every pure strategy of the opponent), the expected payoff of σ is strictly greater than that of s. Since the expected payoff of σ is an average of the payoffs of the pure strategies in its support, then for each column, there must be at least one pure strategy in the support of σ that has a payoff strictly greater than s in that column. However, note that it may be a different pure strategy for each column. Therefore, it does not follow that there is a single pure strategy that dominates s in every column. So step (3) is correct, but it does not support the conclusion that we can restrict attention to pure strategies as dominators. The flaw in the overall argument is that even if for each column a different pure strategy does well, we still need a mixed strategy to cover all columns simultaneously.

  (4) "In G, U is a best reply to L and M is a best reply to R, ... So no pure strategy of either player is strictly dominated by another pure strategy of that player."
  This is true. We check Row's strategies: 
  - U vs M: U beats M when Column plays L (1>0) but loses when R (0<1). 
  - U vs D: U beats D when L (1>0.4) but loses when R (0<0.4). 
  - M vs D: M beats D when R (1>0.4) but loses when L (0<0.4). 
  So no pure strategy is strictly dominated by any other pure strategy. Similarly for Column: 
  L: (2,0,1) vs R: (0,2,1). Against U: L wins (2>0), against M: R wins (2>0), against D: tie (1=1). So neither L nor R is strictly dominated by the other. So (4) is correct.

  (5) "Hence, by (2) and (3), nothing in G is strictly dominated, ..."
  But (2) is false. Therefore, (5) does not follow. In fact, let us check if D is strictly dominated by a mixed strategy. Consider a mixed strategy for Row that plays U and M with equal probability (0.5). Then:
  - Against L: 0.5*1 + 0.5*0 = 0.5 > 0.4
  - Against R: 0.5*0 + 0.5*1 = 0.5 > 0.4
  So the mixed strategy (0.5U, 0.5M) strictly dominates D. Therefore, D is strictly dominated. So (5) is false.

  (6) "That procedure [IESDS] is order-independent, preserves every Nash equilibrium, and leaves exactly the strategies consistent with common knowledge of rationality."
  This is true for IESDS when we allow mixed strategies as dominators. However, note that in the standard definition, IESDS considers domination by mixed strategies. The set of strategies that survive IESDS (with mixed strategies) is exactly the set of rationalizable strategies. Also, every Nash equilibrium (in mixed strategies) survives. The procedure is order-independent. So (6) is correct.

  (7) "So D is consistent with common knowledge of rationality in G; ..."
  This is false because we have just seen that D is strictly dominated by a mixed strategy. Therefore, under common knowledge of rationality, D would be eliminated. Moreover, the set of rationalizable strategies for Row is {U, M} (since D is dominated and can be eliminated). So (7) is incorrect.

  (8) "But half-U-half-M earns 0.5 against both L and R while D earns 0.4, so a Row player using D does strictly worse than one who randomises, whatever Column does; ..."
  This is correct and shows that D is strictly dominated by the mixed strategy.

  (9) The conclusion that (1) is false does not follow because the flaw is in step (2) and consequently (5) and (7). Rationality does exclude strictly dominated play, and IESDS does work if we allow mixed strategies as dominators.

  Now, to the specific questions:

  - The step we reject is (2). It is wrong because the definition of strict dominance allows mixed strategies to dominate pure strategies. The repair is to allow mixed strategies in the dominance comparisons.

  - Why did (2) look compelling? Because one might think of a mixed strategy as not being a distinct action. However, in the theory, we consider the set of mixed strategies for the purpose of defining dominance. This is because a rational player can randomize and thus avoid playing a dominated strategy.

  - If we keep (2) and (3) and define the procedure pairwise (i.e., only pure strategies can dominate), then indeed IESDS would not eliminate D. But then the procedure would be weaker and not capture the full implications of rationality. In particular, the set of strategies that survive IESDS without mixed strategies is larger than the rationalizable set. Moreover, in this game, D would survive, but we know that D is strictly dominated by a mixed strategy and hence not rationalizable.

  - What if the dominance is weak? The argument would be similar. For weak dominance, a pure strategy may be weakly dominated by a mixed strategy even if not by a pure one. So the same considerations apply.

  - About the colleague: One colleague says the trouble is at (6) because D is never a best reply. That is true: D is never a best reply because against L, U is better (1>0.4) and against R, M is better (1>0.4). Therefore, D is not rationalizable. But step (6) says that IESDS leaves exactly the strategies consistent with common knowledge of rationality (which are the rationalizable strategies). So if we do IESDS correctly (with mixed strategies), we eliminate D. The tension between (6) and (7) arises because (7) claims D survives, but (6) says that what survives is common knowledge of rationality. Since D is not rationalizable, (7) is false. However, the core flaw is in (2) leading to (5) and (7). The colleague's point that (6) and (7) are in tension is correct, but the root cause is the earlier error.

  - The other colleague argues that without a randomizing device, mixtures are not available. However, even without a randomizing device, the player can choose any pure strategy. The existence of a dominating mixed strategy implies that the pure strategy D is never a best response to any belief. Why? Because if the player has a belief about Column, then the expected payoff of the mixed strategy (which is a convex combination of U and M) would be higher than D. But since the player must choose a pure strategy, they would choose either U or M (whichever gives higher expected payoff against their belief). Therefore, D is never chosen. So even without a randomizing device, D is not rational. Hence, we must allow mixed strategies in the dominance definition to capture this.

  - What we lose if we keep (2) and (3): If we only consider pure strategy dominators, then IESDS becomes weaker and does not eliminate all strategies that are not rationalizable. This would break the connection with rationalizability and common knowledge of rationality.

  - What if we allow mixtures? We must assume that players can randomize? Not necessarily. The theory of rationalizability (and dominance) does not require that players actually randomize, but it uses mixed strategies to define dominance because a pure strategy that is strictly dominated by a mixed strategy is not a best response to any belief. Therefore, the player would never choose it.

  - The verdict: Reject (2) and consequently (5) and (7). Accept the rest.

  - What would change my mind? If it were shown that the standard definition of strict dominance in game theory does not allow mixed strategies to dominate pure strategies. But the standard definition does. For example, in Osborne and Rubinstein (1994) or Fudenberg and Tirole (1991), a pure strategy is strictly dominated if there exists a mixed strategy that yields a strictly higher payoff for every pure strategy profile of the other players.

  - Where my diagnosis might fail: If the game is interpreted in a context where the player cannot even conceive of randomizing (so that the belief formation does not include the possibility of mixed strategies by others) then the set of best responses might be different. However, in standard game theory, the rationalizability concept allows for mixed strategies in the definition of best responses (even if the player does not use them, they consider the possibility that others do). Therefore, D is still not a best response.

  In summary, the flaw is in step (2). We must allow mixed strategies to dominate pure strategies in the definition of strict dominance.
answer: |-
  ### Diagnosis of the Argument

  The flaw lies in **step (2)**, which incorrectly restricts strict dominance comparisons to pure strategies and excludes mixtures as potential dominators. This error propagates to steps (5) and (7), invalidating the conclusion. Below, I defend this verdict, address each step, and clarify implications.

  ---

  ### Step-by-Step Analysis
  - **Step (1)**: Accept. A rational player maximizes expected utility, so they never play a strictly dominated strategy. This is standard.
  - **Step (2)**: **Reject.** Strict dominance is defined via comparisons to *all* available strategies, including mixed strategies. A mixed strategy is not merely a "device" but a valid alternative: it represents a plan of action achievable with randomization (e.g., a coin flip). Crucially, a pure strategy is strictly dominated if *any* mixed strategy yields higher payoff against *every* opponent pure strategy. By excluding mixtures, (2) artificially limits dominance comparisons.  
    *Why compelling?* One might conflate "available alternatives" with "pure actions a player can physically choose." But dominance is a *conceptual* criterion for rationality, not a physical constraint. A rational player considers whether *any* strategy (pure or mixed) dominates, as mixtures expose suboptimality in pure strategies.
    
  - **Step (3)**: Accept, but it does not rescue (2). (3) correctly notes that if a mixture dominates a pure strategy, then in each column, some pure strategy in its support beats the dominated strategy *in that column*. However, this does not imply a *single* pure strategy dominates across *all* columns. For example, in game G, U beats D when Column plays L (1 > 0.4), and M beats D when R (1 > 0.4), but no pure strategy beats D in both columns. Only a mixture (e.g., 50% U, 50% M) dominates D globally. Thus, (3) supports allowing mixtures as dominators, contrary to (2).
    
  - **Step (4)**: Accept. No pure strategy is strictly dominated by another pure strategy:  
    - Row: U and M each beat D in one column but lose in the other.  
    - Column: L beats R against U (2 > 0), but R beats L against M (2 > 0), and both tie against D (1 = 1).  
    Thus, pairwise pure-strategy comparisons eliminate nothing.
    
  - **Step (5)**: **Reject** (due to reliance on (2) and (3)). Since mixtures *are* valid dominators, D is strictly dominated by the mixed strategy (0.5U, 0.5M), which yields 0.5 > 0.4 against both L and R. Iterated elimination of strictly dominated strategies (IESDS) thus removes D. Claiming "nothing is strictly dominated" is false.
    
  - **Step (6)**: Accept. IESDS (allowing mixed dominators) is order-independent, preserves Nash equilibria, and leaves strategies consistent with common knowledge of rationality (i.e., rationalizable strategies). In G, IESDS eliminates D, leaving {U, M} for Row and {L, R} for Column.
    
  - **Step (7)**: **Reject.** D is *not* consistent with common knowledge of rationality because it is strictly dominated and never a best response to any belief about Column. Rational Row players use U or M, depending on their conjecture. (7) fails because (5) is false.
    
  - **Step (8)**: Accept. The mixed strategy (0.5U, 0.5M) indeed dominates D (0.5 > 0.4 against both L and R). This highlights why rationality excludes D—but it does not refute (1); instead, it refutes (2).
    
  - **Step (9)**: **Reject.** The argument fails at (2), so (1) stands: Rational players avoid strictly dominated strategies, and dominance reasoning (properly applied) captures common belief in rationality.

  ---

  ### Resolving Tensions and Repairs
  - **Colleague 1** (tension at (6)/(7)): Correct that (6) and (7) conflict, but this stems from the earlier error in (2)/(5). Once mixtures are allowed, IESDS eliminates D, resolving the tension.  
  - **Colleague 2** (reject (8), no randomizing device): Incorrect. Even without a physical randomizing device, a rational player recognizes that D is strictly dominated *in expectation* by mixtures. Thus, they would never choose D, as it is never a best response. The dominance criterion operates at the level of beliefs and expected payoffs, not physical implementation.  

  **Repairs for (2)**: Allow mixed strategies as dominators. This requires:  
  - Players can randomize (via a public or private device), or at least, they consider expected payoffs under randomization when evaluating dominance.  
  - Action sets include mixed strategies for dominance checks (though players ultimately choose pure actions).  

  **Consequences**:  
  - **Rationalizability**: With mixed dominators, IESDS coincides with rationalizability (strategies surviving are best responses to some belief).  
  - **Weak dominance**: Similar logic applies—a pure strategy weakly dominated by a mixture is not rationalizable.  
  - **Pairwise-only definition**: If dominance is restricted to pure strategies (retaining (2)), IESDS becomes weaker. In G, D survives, but this misrepresents rationality, as D is never a best response. Rationalizability would no longer align with IESDS.  

  ---

  ### What Would Change My Mind?
  If it were shown that rational players *cannot* use mixed strategies to evaluate dominance—e.g., if rationality requires commitment to pure actions only, or if beliefs must be restricted to pure opponent strategies. However, standard game theory treats mixed strategies as valid for dominance checks, as they reflect probabilistic beliefs. If this norm is rejected, (2) could hold, but (8) would need reinterpreting (e.g., arguing that without a randomizing device, D is undominated). Yet this contradicts rationalizability, so (9) would still not follow.  

  **Weak Point in Diagnosis**: Step (3) could be misinterpreted to imply that "piecewise" domination by pure strategies (per column) suffices for global dominance. It does not—global dominance requires one strategy (pure or mixed) to dominate everywhere. My critique assumes standard utility-maximization; if payoffs are non-linear in probabilities, (3) might fail, but this is irrelevant here.  

  **Final Verdict**: Reject (2), (5), and (7). Uphold (1): Strict dominance reasoning, correctly applied with mixtures, works. In G, IESDS eliminates D, aligning with common knowledge of rationality.
