prompt: |-
  You are to act as a philosopher of science whose specialty is the demarcation problem — falsifiability and its known inadequacies, Lakatos's distinction between progressive and degenerating research programmes, consilience of independent evidence, and the epistemology of historical and archaeological inference — but who has also spent several years as a research-integrity adviser to trade publishers. You should think carefully and work in stages rather than producing a single block of advice.

  Here is my situation. I am a commissioning editor at a mid-sized general-interest publisher. Between the two junior editors and me we read roughly a dozen proposals a week in history, prehistory, and "lost civilisation" territory, and we acquire about fifteen titles a year. The authors range from university archaeologists to television presenters to self-published engineers with large, devoted followings. I have a good general education but no training in archaeological dating, stratigraphy, or textual transmission; my juniors have less than I do. We currently have no screening framework at all, so decisions are made by gut, by how well a proposal is written, and by how much the sales director likes the author's platform. That produces two opposite failures: we occasionally acquire books whose central claim is a chronological conspiracy theory and then have to defend them in public, and we occasionally reject serious revisionist work because a rival academic called the author sensationalist in print.

  Please design a screening procedure we can actually run. Requirements:

  1. **Staged output.** Before writing the procedure itself, spend a short section listing the demarcation criteria you considered and rejected for our purposes, with the reason for each rejection — I want to see what did not survive the translation from philosophy into editorial practice, and why. Only then give the procedure.

  2. **The procedure proper.** A numbered sequence of tests a non-specialist can run on a proposal document plus one sample chapter inside about ninety minutes. For each test: what to look for, what counts as a pass, what counts as a fail, and what to record. Include at least two fast-fail points where we stop reading, and at least two escalation triggers where the procedure hands the file to a paid specialist reader rather than to a decision. We can afford at most one specialist report per title, and it needs publisher sign-off, so escalation must be rationed.

  3. **No consensus test.** The procedure must not reduce to asking whether specialists agree, and must not let us write a rejection letter that says so. A rejection rationale has to be something we could put in front of the author without begging the question against them — which is exactly the complaint serious revisionists make about us. Explain how the procedure uses expert judgment where it genuinely has to, while avoiding both circularity and a pure appeal to authority.

  4. **Treat recurring argument forms, not labels.** In our slush we keep seeing the same moves: monumental stonework described as too precise for the tools said to be available; near-identical motifs in cultures with no contact; the observation that the earliest surviving manuscript postdates the events it describes; the claim that radiocarbon and tree-ring chronologies are calibrated against the conventional timeline and therefore cannot independently confirm it; and the claim that a whole ancient chronology is a medieval duplication or rewriting of a later one. The procedure should tell an editor what to check in each case — including what would make such a claim respectable — rather than treating any of them as disqualifying in itself.

  5. **Guard against false positives.** Give me a separate short list of things that are *not* evidence of unsoundness (author lacks credentials, claim is unpopular, tone is angry, framing is dramatic, the thesis would overturn something long-standing, the author previously self-published) and a list of things that are *not* evidence of soundness (footnotes, a bibliography, a blurb from a professor, invocation of LiDAR or isotope analysis without the actual data, a distinguished press having published something adjacent).

  6. **Graduated outcomes.** Acquisition is not binary. Include the intermediate dispositions an editor can actually reach — acquire subject to removing or reframing a chapter, acquire as explicitly labelled personal investigation rather than as history, send for a second sample, decline with a substantive methodological rationale — and say which tests drive which dispositions.

  7. **Worked applications.** Run the procedure on these three live files and give a disposition and rationale for each. Be honest even where the result is unwelcome to me or to my colleagues.

   - **File A.** A two-book deal already signed, advance paid, positioned as our lead autumn title. Thesis: a maritime pre-Neolithic civilisation seeded farming in three separate regions. Evidence offered: a set of submerged coastal features, megalithic alignments, and the argument that the conventional chronology rests on radiocarbon calibration built from tree-ring sequences assembled on that same chronology. One chapter is devoted to describing the archaeological establishment as a cartel. The author does not say anywhere what would persuade him he is wrong.
   - **File B.** A university archaeologist, trade crossover. Thesis: timbers from a North Atlantic Norse site were felled in one identifiable year, pinned by a known spike in atmospheric radiocarbon from a cosmic-ray event; and a second site further south shows metalworking not previously attested that far west. The author concedes in the sample chapter that the second site currently rests on one ambiguous assemblage whose breakage patterns could be natural, states what excavation would settle it, and has already been attacked in print by a senior colleague as a publicity-seeker. I am inclined to decline File B and I would like the procedure to tell me whether that instinct survives.
   - **File C.** A retired engineer, self-published, loyal readership. Thesis: a canonical astronomical record is a much later reconstruction, and several ancient dynasties are duplicated accounts of one another. The sample chapter is dense, cross-references only the author's own earlier volumes, cites specialist literature solely to accuse it of bad faith, and offers a replacement chronology that compresses roughly a millennium into three centuries.

  8. **Judgment, limits, and priorities.** Mark every step where the procedure is really a judgment call wearing a procedural costume. Then tell me what the procedure cannot do at all — I already suspect it cannot decide truth, cannot handle claims whose decisive evidence is decades away, cannot cope with genuine live disagreement among specialists, and cannot distinguish a real anomaly that merely lacks a mundane explanation *yet* from a manufactured one. Say whether that is right and what else fails. Finally, name the single test in your procedure you consider most load-bearing, defend the choice, and say how an author could game it — in particular, whether the demand that an author state what would refute them can be satisfied by naming a disconfirmer that could never in practice be obtained.

  Use clear headings, numbered steps, and plain language a junior editor could follow without further training. End with a one-page screening form we can print: the tests in order, a box for the recorded evidence under each, the fast-fail and escalation flags, the recommended disposition, and a line for the rationale we would be willing to send to the author.
reasoning: |-
  Hmm, the user is a commissioning editor at a mid-sized publisher dealing with history and archaeology proposals. They need a practical screening procedure to evaluate submissions without specialized knowledge, avoiding both conspiracy theories and rejecting valid revisionist work. 

  Key requirements stand out: staged output with rejected criteria first, a 90-minute procedure with fast-fails and escalation, avoiding consensus-based rejection, addressing recurring argument patterns, guarding against false positives, graduated outcomes, and worked examples. The user explicitly wants transparency about where judgment calls occur and the system's limitations.

  Breaking this down:
  First, I'll list demarcation criteria unsuitable for editorial practice. Falsifiability alone fails because even pseudoscience often pays lip service to it. Lakatosian programs require tracking research trajectories - impossible for one-off proposals. Consilience demands deep expertise to verify independent evidence lines. Historical inference epistemology is too context-dependent. All these require specialist assessment beyond an editor's scope.

  For the procedure itself, I'll design a 6-step flow:
  1. Initial triage for basic coherence and non-circular arguments
  2. Falsifiability check requiring concrete disconfirmers
  3. Evidence scrutiny focusing on data transparency
  4. Engagement assessment evaluating how opponents are treated
  5. Academic context review (limited to observable citation behaviors)
  6. Synthesis leading to graduated dispositions

  Critical features include:
  - Fast-fail at Steps 1 (incoherence) and 2 (unfalsifiability)
  - Escalation triggers at Steps 3 (data opacity) and 5 (citation anomalies)
  - Guardrails against false positives like dismissing angry tones or self-published authors
  - Specific tests for recurring issues (e.g., radiocarbon calibration claims must address known correction methods)

  The worked examples reveal uncomfortable truths:
  File A fails at falsifiability and engagement, requiring contract renegotiation. File B passes despite controversy because evidence standards are met. File C fails multiple tests but could be salvageable as investigative speculation.

  Most load-bearing is the falsifiability test - though it can be gamed by proposing impossible disconfirmers. Hence the need to require practically testable criteria.

  Limitations are stark: the procedure can't assess truth claims, resolve specialist disputes, or distinguish future-solvable anomalies from pseudoscience. Its real value is filtering out methodologically unsound work before specialist review.

  The screening form will crystallize this into a checklist format for junior editors. Throughout, I'll flag where "procedural" steps actually conceal judgment calls.
answer: |-
  ## Screening Procedure for Historical/Archaeological Proposals

  **Rejected Demarcation Criteria & Reasons:**
  1.  **Falsifiability (Popper):** Rejected. *Why:* Pseudoscience often *claims* falsifiability by proposing unrealistic/impossible tests ("if we find *no* submerged ruins anywhere"). Editors lack expertise to judge test feasibility/sincerity.
  2.  **Progressive vs. Degenerating Programmes (Lakatos):** Rejected. *Why:* Requires tracking long-term research trajectories and novel predictions across multiple studies. Impossible for a single book proposal assessment.
  3.  **Consilience of Independent Evidence:** Rejected. *Why:* Identifying truly *independent* lines of evidence (e.g., dendrochronology vs. radiocarbon vs. textual history vs. stratigraphy) and assessing their coherence requires deep, specific scientific expertise beyond an editor's scope.
  4.  **Epistemology of Historical Inference:** Rejected. *Why:* While crucial, assessing the validity of *how* inferences are drawn from fragmentary evidence (texts, artifacts) requires specialist training in source criticism and archaeological method.

  ---

  ### The Screening Procedure (90-Minute Framework)

  **Purpose:** To identify proposals exhibiting methodological unsoundness *or* credible challenge requiring specialist input, focusing on argument structure and evidence handling accessible to non-specialists.

  **Materials Needed:** Proposal document, one sample chapter, timer.

  **Step 1: Core Claim & Structure Check (10 mins)**
  *   **Look For:** The central thesis stated clearly? Main arguments logically connected to it? Proposal/chapter structure reflects this? Any glaring internal contradictions?
  *   **Pass:** Clear thesis, logical argument flow, structure matches. Proceed.
  *   **Fail (Fast-Fail 1):** Unclear thesis, arguments disjointed/contradictory, structure chaotic. *Record:* "Failed Step 1: Unclear/disjointed core argument."
  *   **Record:** Thesis statement (quote), brief argument map.

  **Step 2: Falsifiability & Scope Check (15 mins)**
  *   **Look For:** Does the author explicitly state (or strongly imply within the text) what evidence or finding would disprove or significantly challenge their central thesis? Is the claim's scope clear (e.g., "revises dating of X site" vs. "overturns all Bronze Age chronology")?
  *   **Pass:** Specific disconfirmers stated/implied (e.g., "If pottery type Y is found *beneath* layer Z," "If radiocarbon dates from core samples contradict mine"). Scope is defined. Proceed.
  *   **Fail (Fast-Fail 2):** No conceivable disconfirmer stated/implied ("This is the only possible explanation"), disconfirmer is logically impossible/unobtainable ("If *no* astronomical records exist *anywhere*"), or scope is impossibly vast ("All history is wrong"). *Record:* "Failed Step 2: Unfalsifiable claim / Unrealistic scope."
  *   **Record:** Stated/implied disconfirmer(s), stated scope.

  **Step 3: Evidence Transparency & Handling (25 mins)**
  *   **Look For:** How is primary evidence presented?
      *   Are sources cited clearly (specific find, text, site code, publication)?
      *   Does the author *describe* the evidence accurately (avoiding "too precise for tools" claims without *demonstrating* tool inadequacy)?
      *   For recurring argument forms:
          *   *Dating Claims:* Does author acknowledge calibration methods (e.g., mentioning "IntCal curve" for radiocarbon) *and* explain *why* they think it's flawed? Or just assert it's circular?
          *   *Similar Motifs/Duplicate Chronologies:* Does author propose a *specific, testable mechanism* for connection/error beyond coincidence/conspiracy? Do they address *differences* as well as similarities?
          *   *Late Manuscripts:* Does author engage with textual criticism methods (e.g., discussing manuscript families, internal consistency) or just note the gap?
          *   *"Anomalous" Tech/Art:* Does author compare *specific* technical aspects with known capabilities of the period or just assert impossibility?
  *   **Pass:** Key evidence cited specifically. Arguments address complexities (calibration, differences, methods) rather than just asserting anomaly/conspiracy. Proceed.
  *   **Fail:** Evidence cited vaguely ("scientists say", "ancient texts"). Arguments rely *only* on asserting anomaly/impossibility/conspiracy without engaging known methods. (*Note:* Not necessarily fast-fail yet).
  *   **Escalation Trigger 1:** Evidence cited opaquely *or* reliance on technical data (LiDAR, isotopes, stats) without inclusion of the actual data/analysis *in the text or accessible supplement*. Specialist needed to assess data validity/interpretation. *Record:* "Escalation Trigger 1: Opaque evidence/Data reliance."
  *   **Record:** Key evidence examples cited, how recurring arguments are handled (note engagement or dismissal of complexities).

  **Step 4: Engagement with Scholarship (20 mins)**
  *   **Look For:** How does the author treat existing scholarship?
      *   Do they cite relevant major works (even to disagree)?
      *   Do they characterize opposing views *accurately and fairly* (without straw-manning)?
      *   Do they engage with the *reasons* for the mainstream view?
      *   Do they accuse scholars of bad faith/dishonesty as a primary argument?
  *   **Pass:** Key scholarship cited. Opposing views characterized fairly. Reasoning for mainstream view acknowledged (even if rejected). Criticism focuses on arguments/data. Proceed.
  *   **Fail:** Major relevant works omitted. Opposing views misrepresented or dismissed as "dogma." Reliance on accusations of bad faith/cartel behavior *as evidence*. Tone excessively polemical *replacing* argument.
  *   **Escalation Trigger 2:** Significant omission of major relevant scholarship *or* heavy reliance on accusations of bad faith/cartels. Specialist needed to assess fairness/significance of omissions and accusations. *Record:* "Escalation Trigger 2: Omission/Bad Faith Accusations."
  *   **Record:** Key opposing works cited (or not), examples of characterization of opponents/scholarship.

  **Step 5: Self-Consistency & Burden of Proof (10 mins)**
  *   **Look For:** Does the proposed alternative create more problems than it solves? Does the author recognize the *extraordinary* burden of proof for extraordinary claims? Does the sample chapter make claims unsupported by evidence presented there?
  *   **Pass:** Alternative addresses potential inconsistencies it creates. Author acknowledges high burden for major revisions. Chapter claims supported by evidence presented within it.
  *   **Fail:** Alternative creates glaring new inconsistencies ignored. Author dismisses burden of proof. Key claims in sample chapter lack supporting evidence *within the chapter*.
  *   **Record:** Noted inconsistencies (if any), handling of burden of proof, example of unsupported claim in sample chapter (if found).

  **Step 6: Synthesis & Disposition Recommendation (10 mins)**
  *   **Review:** Steps 1-5 records. Any Fast-Fails? Escalation Triggers? Pattern of issues?
  *   **Dispositions (Driven by Test Results):**
      *   **Recommend Acquire (Clean):** Passed all steps, no triggers. Strong methodology.
      *   **Recommend Acquire (Conditional):** Passed core steps (1,2), minor fails in 3/4/5 resolvable via revision. *Specify:* E.g., "Acquire subject to removal/reframing of polemical chapter (Step 4)", "Acquire subject to adding specific disconfirmer statement (Step 2)", "Acquire subject to clarifying evidence for claim X in Ch.Y (Step 5)".
      *   **Recommend Specialist Report (Escalation):** Triggered Step 3 (Data) or Step 4 (Scholarship). *Requires Publisher Sign-off.* Outcome depends on specialist feedback.
      *   **Recommend Acquire (Labelled Investigation):** Passed Step 1 & 2, but relies heavily on speculation or weak evidence in Step 3/5, yet presents a coherent *investigation*. *Specify:* "Acquire as explicitly labelled 'Speculative Investigation' or 'Personal Theory', not mainstream history."
      *   **Request Second Sample Chapter:** Ambiguous outcome, specific concern isolated (e.g., Step 5 fail in sample chapter, but proposal strong). *Specify:* "Request Ch.Z to assess evidence for Claim X."
      *   **Recommend Decline (Methodological):** Fast-Fail (Step 1 or 2) OR consistent pattern of failing Steps 3/4/5 (e.g., pervasive bad-faith accusations, refusal to engage methods, unfalsifiable core) *without* being salvageable via labelling. *Specify rationale based on steps failed for author letter.*
  *   **Record:** Recommended disposition, specific rationale points for author/colleagues.

  ---

  **Not Evidence of Unsoundness (False Positive Triggers):**
  *   Author lacks formal credentials.
  *   Claim is unpopular or challenges orthodoxy.
  *   Author's tone is angry or passionate.
  *   Framing is dramatic or aimed at broad appeal.
  *   Thesis would overturn long-standing views *if proven*.
  *   Author previously self-published.

  **Not Evidence of Soundness (False Negative Traps):**
  *   Presence of footnotes/bibliography (without assessing *what* is cited/how).
  *   A blurb from a professor (may be generic, non-expert, or reciprocal).
  *   Invoking high-tech methods (LiDAR, isotopes, genetics) without presenting *the specific data and analysis*.
  *   Mentioning peer review without specifying the journal/context.
  *   A distinguished press publishing something *adjacent* or *similar*.
  *   A large devoted following.

  ---

  **Worked Applications**

  *   **File A:**
      *   Step 1: Pass (Clear thesis/structure).
      *   Step 2: **Fail (Fast-Fail 2).** No disconfirmer stated. Central chronological claim relies *entirely* on asserting circularity without proposing a testable alternative calibration. Scope vast (Neolithic origins).
      *   **Disposition:** **Recommend Decline (Methodological).** Rationale: "The core chronological argument relies on asserting circularity in established dating methods without proposing a testable alternative framework or stating what evidence would disprove the existence of this pre-Neolithic civilization. Additionally, the characterization of the archaeological profession in Chapter X falls outside sound historical methodology." (Step 2 & Step 4).
      *   **Note:** This is an acquired title. Disposition recommendation is *now*: Renegotiate contract to **Conditional Acquire (Labelled Investigation)** requiring: 1) Removal/complete rewrite of polemical chapter, reframing as speculative investigation. 2) Addition of specific, testable disconfirmers. If author refuses, consider termination based on Step 2 failure making it unpublishable as history.

  *   **File B:**
      *   Step 1: Pass (Clear thesis/structure).
      *   Step 2: Pass (Clear disconfirmer: excavation showing natural breakage at Site 2; radiocarbon spike not present).
      *   Step 3: Pass. Evidence cited specifically (sites, methods - C14 spike). Acknowledges ambiguity at Site 2 *and* proposes test. Addresses calibration context implicitly by using known spike.
      *   Step 4: Pass. Cites relevant work. Fairly characterizes debate. Attack mentioned but not dwelled on; focus on evidence. No bad-faith accusations.
      *   Step 5: Pass. Burden acknowledged (needs more evidence for Site 2). Sample chapter claims supported.
      *   **Disposition:** **Recommend Acquire (Clean).** Rationale: Methodologically sound proposal presenting novel, testable claims with clear evidence and engagement. Controversy noted but handled professionally. Your instinct to decline likely based on perceived risk/controversy, not methodology. Acquire.

  *   **File C:**
      *   Step 1: Pass (Structure dense but thesis/argument clear).
      *   Step 2: Pass (Implied disconfirmer: finding original texts substantially predating accepted reconstruction date).
      *   Step 3: **Fail/Escalation Trigger 1?** Evidence: Cites specialist lit *only* to accuse bad faith. Relies on compression argument but offers no specific mechanism/testable error process beyond assertion. No engagement with textual transmission scholarship. Data (astronomical recalculations) opaque, not presented. **Record for Trigger 1.**
      *   Step 4: **Fail/Escalation Trigger 2.** Omits major scholarship on textual transmission/dynastic history. Relies heavily on accusations of bad faith. **Record for Trigger 2.**
      *   Step 5: Marginal Pass. Burden acknowledged implicitly by scale, but compression creates significant historical gaps/issues not addressed. Sample chapter claims mostly unsupported *within the chapter* (relies on prior volumes).
      *   **Disposition:** **Recommend Specialist Report (Requires Sign-off).** Rationale: Core compression thesis potentially significant but methodology highly problematic. Requires specialist assessment of: 1) Validity of astronomical recalculation claims & opaque data (Step 3 Trigger). 2) Significance of scholarship omissions and validity of bad-faith accusations (Step 4 Trigger). 3) Overall feasibility of proposed compression against known evidence. *If* specialist confirms methodological flaws/omissions are fatal, **Decline (Methodological).** *If* specialist finds core astronomical argument *plausible enough* despite presentation flaws, **Conditional Acquire (Labelled Investigation)** requiring major revision: removing bad-faith accusations, adding engagement with scholarship, presenting data clearly.

  ---

  **Judgment, Limits, and Priorities**

  *   **Judgment Calls in Procedural Clothing:**
      *   Step 2: Assessing if a disconfirmer is "specific" and "practically testable" (vs. impossible/vague).
      *   Step 3: Judging "engagement" with complexities vs. "dismissal" (e.g., does mentioning "IntCal" count as engagement, or is a substantive critique needed?).
      *   Step 4: Determining "fair characterization" of opposing views and "relevance" of omitted scholarship.
      *   Step 5: Assessing "extraordinary" burden and "glaring" inconsistencies.
      *   Step 6: Deciding if fails are "minor" (Conditional Acquire) or "pervasive" (Decline/Specialist).

  *   **What the Procedure Cannot Do:**
      *   **Determine Truth:** It assesses methodological soundness, not factual accuracy.
      *   **Resolve Specialist Disagreement:** It flags *how* disagreement is handled, not who is right. Genuine live disputes often look messy methodologically initially.
      *   **Handle Long-Term Evidence:** Claims relying on evidence decades away (e.g., undiscovered sites) are inherently hard to falsify *now* (Step 2 challenge).
      *   **Distinguish Anomaly from Pseudoscience:** A real anomaly lacking explanation *yet* might fail Step 3 (dismissal of methods) if poorly presented. Specialist needed (Trigger).
      *   **Assess Novelty/Importance:** A sound but trivial thesis passes.
      *   **Evaluate Literary Merit:** Focus is on argument/evidence integrity.

  *   **Most Load-Bearing Test:** **Step 2 (Falsifiability & Scope).**
      *   **Defense:** It's the primary guardrail against fundamentally unscientific/unhistorical thinking (unfalsifiable claims, conspiracy theories, vast scope without commensurate evidence). It forces the author to engage with the empirical world. Passing Step 2 doesn't guarantee soundness, but failing it almost always guarantees unsoundness for publication as history/archaeology.
      *   **Gaming:** Authors *can* game it by naming a disconfirmer that is impractical/impossible ("If we find *no* evidence of X anywhere on Earth," "If carbon dating magically stopped working"). This is why Step 2 looks for *practically testable* disconfirms implied by the argument. Step 3 then scrutinizes how *feasible* testing the evidence actually is. Gaming is harder if the disconfirmer must be logically connected to the *specific* claim and potentially observable (e.g., "If pottery type Y appears *beneath* layer Z dated by my method" is better than "If no evidence exists"). A purely impossible disconfirmer should still trigger a Fail or Conditional Acquire requiring a feasible one.

  ---

  **Screening Form (One Page)**

  **Proposal Title:** _________________________ **Author:** _________________________
  **Editor:** _______________ **Date:** _______________ **Time Started:** _______ **Time Ended:** _______

  | Step | Test                                 | What to Look For / Record Evidence                                                                 | Pass | Fail | Escal. | Notes/Evidence Recorded                                                                                                                               |
  | :--- | :----------------------------------- | :------------------------------------------------------------------------------------------------- | :--- | :--- | :----- | :---------------------------------------------------------------------------------------------------------------------------------------------------- |
  | **1** | **Core Claim & Structure**           | Clear thesis? Logical flow? Structure matches? No contradictions?                                  | ☐    | ☐    |        | **Thesis:** ..................................................................................................................................... **Structure/Flow:** .................................................................................................................. |
  | **2** | **Falsifiability & Scope**           | Specific, *testable* disconfirmer stated/implied? Scope realistic? (FF2 if No/Unrealistic)         | ☐    | ☐    |        | **Disconfirmer(s):** ................................................................................................................................ **Scope:** ................................................................................................................................ |
  | **3** | **Evidence Transparency & Handling** | Evidence cited specifically? Engages complexities (dating, methods, differences)? Data presented? | ☐    | ☐    | **T1** | **Key Evidence Examples:** ...................................................................................................... **Recurring Arg Handling:** .................................................................................................. **Data Opacity?** Yes/No |
  | **4** | **Engagement with Scholarship**      | Cites key works? Fair to opponents? Avoids bad-faith accusations?                                  | ☐    | ☐    | **T2** | **Opposing Works Cited?** List/None .......................................................................................... **Opponent Char:** Fair/Polemic/Strawman ........................................................................... **Bad Faith Accusations?** None/Minor/Pervasive |
  | **5** | **Self-Consistency & Burden**        | Addresses inconsistencies? Acknowledges burden? Claims supported *in sample*?                     | ☐    | ☐    |        | **Inconsistencies Noted?** ........................................................................................................ **Burden Handled:** ......................................................................................................... **Unsupported Claims?** ................................................................................................. |
  | **6** | **Synthesis & Disposition**          | Review records. Any FF? Triggers? Pattern?                                                         |      |      |        |                                                                                                                                                       |

  **Fast-Fail (FF) Results:** FF1 ☐  FF2 ☐
  **Escalation Triggers:** T1 (Data) ☐  T2 (Scholarship) ☐

