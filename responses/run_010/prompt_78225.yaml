  ### **Critical Notes**  
  - **Philosophy Doctor’s Objection**: He is correct. Your current practice often uses inadmissible evidence (e.g., historical jumpiness). This procedure forbids it.  
  - **Model Output Limitation**: The ensemble is an *estimate* of chance, not true chance. Adjustments "borrow warrant" by assuming the estimate is fixable. This costs precision in unprecedented cases.  
  - **Judgment Calls in Rule’s Clothing**:  
    - Admissibility (Step 1) relies on distinguishing "physical state" from "outcome prediction."  
    - Quantification (Step 2) assumes pre-defined rules cover most cases.  
    - Weighted averaging requires credible alternatives (rare in practice).  
  - **Team Impact**: Case (b) is deliberately strict to break harmful habits. Documented biases must replace hunches.  

  **Final Output**: A standalone, actionable procedure. No reading list needed—principles are embedded.
