answer: |-
  ### Procedure for Human Adjustment of Ensemble Flood Probabilities  
  **Purpose**: To ensure adjustments are philosophically justified (per Lewis's Principal Principle) and auditable. The ensemble output is an *estimate* of the objective chance of flooding, not the true chance. Adjust only when new evidence corrects a gap in the model's estimate, not when it predicts the outcome directly.  

  ---

  ### **Triage Step (≤10 seconds per gauge)**  
  **Question**: *"Is the ensemble probability between 0.10 and 0.90, AND is there a specific, documented reason to suspect the model missed a key factor?"*  
  - **Yes**: Proceed to substantive steps.  
  - **No**: Publish the ensemble value unaltered.  
  **Default**: If undecided within 10 seconds, publish unaltered.  
  **Why**: Focuses limited time on cases where adjustments are plausible. Extreme probabilities (<0.10 or >0.90) are less likely to cross warning thresholds, and vague hunches are inadmissible.  

  ---

  ### **Substantive Adjustment Steps**  
  *Complete within 15 minutes for all gauges. Record all decisions in the adjustment log (fields specified at end).*  

  #### **Step 1: Verify Evidence is Admissible**  
  **Question**: *"Is this evidence about the *current physical state* or *model input error* that the ensemble should have incorporated if known?"*  
  - **Sufficient answers (admissible)**:  
    - Sensor/data failure (e.g., raingauge iced over).  
    - Quantified model bias for this catchment (e.g., undercalls by 0.25 on record).  
    - Catchment condition not captured (e.g., saturation measured post-model run).  
  - **Insufficient answers (inadmissible)**:  
    - Historical "jumpiness" without bias proof.  
    - Future human actions (e.g., reservoir release) without input error.  
    - Outcome-based feelings (e.g., "it feels too low").  
  **Default**: If undecided in 30 seconds, publish unaltered.  
  **Why**: Admissible evidence corrects the model’s *chance estimate*; inadmissible evidence predicts the *outcome*, violating the Principal Principle.  

  #### **Step 2: Quantify the Impact**  
  **Question**: *"Can the impact be quantified using pre-defined rules or a weighted average of objective alternatives?"*  
  - **Sufficient answers**:  
    - **Pre-defined rule exists**: Apply it (e.g., "bias table says add 0.25 for this catchment").  
    - **Multiple hypotheses**: Compute weighted average: `(Prob₁ × Credence₁) + (Prob₂ × Credence₂) + ...`  
      - *Example*: Ensemble = 0.30, but alternative model A = 0.60 (credence 70%), model B = 0.40 (credence 30%). Adjusted = `(0.60 × 0.70) + (0.40 × 0.30) = 0.54`.  
    - **No pre-rule but quantifiable range**: Use midpoint (e.g., impact between +0.2 and +0.4 → adjust by +0.3).  
  - **Insufficient answers**:  
    - Subjective guess without data.  
    - Shrinking toward 0.5 (e.g., nudging 0.30 to 0.40).  
  **Default**: If impact unquantifiable in 60 seconds, publish unaltered.  
  **Why**: Rational agents average competing chances; arbitrary changes inflate error.  

  #### **Step 3: Apply Adjustment and Escalate**  
  - **Adjustment ≤ |0.10|**: Publish adjusted value.  
  - **Adjustment > |0.10|**: Escalate to duty manager.  
    - Manager has 2 minutes to review Steps 1–2. If disapproved, publish ensemble value.  
  - **Ongoing flooding (special case)**: If gauge is already above threshold, publish 1.00 and issue immediate warning.  
  **Why**: Large adjustments require oversight; ongoing flooding negates the forecast.  

  ---

  ### **Two-Column Table: Legitimate vs. Illegitimate Adjustments**  
  | **Legitimate (Admissible Evidence)**                          | **Illegitimate (Inadmissible Evidence)**                     |  
  |---------------------------------------------------------------|-------------------------------------------------------------|  
  | **Raingauge iced over during input window**: Corrects missing input data the model would have used. | **Historical 'jumpiness' without bias proof**: Assumes the model is wrong without evidence; not a physical state. |  
  | **Catchment saturation post-run**: Physical state the model missed due to timing. | **Reservoir release call (not in inputs)**: Future human action; not a model input error. |  
  | **Documented undercall bias for this valley**: Corrects the model’s chance estimate. | "**Feels too low** based on experience": Vague; outcome-focused, not chance-focused. |  
  | **Sensor malfunction (e.g., under-reporting rainfall)**: Input error affecting chance. | **Gauge already rising rapidly**: Outcome evidence; use ongoing flooding protocol instead. |  
  **Why**: Legitimate evidence updates the *chance estimate*; illegitimate evidence bypasses chance for outcome.  

  ---

  ### **What the Procedure Cannot Settle**  
  1. **Unprecedented catchment states**: No data to quantify adjustments.  
  2. **Far-tail events**: Probabilities <0.01 or >0.99; ensemble reliability is unknown.  
  3. **Self-referential cases**: When the ensemble’s inputs are needed to verify it (e.g., no independent soil moisture data).  
  **Handling**: Publish ensemble value and flag for post-event review.  

  ---

  ### **Adjustment Log Fields**  
  *Required for audit (1 row per gauge adjusted):*  
  1. **Gauge ID**  
  2. **Ensemble probability**  
  3. **Adjustment reason** (e.g., "raingauge iced over")  
  4. **Admissibility verdict** (admissible/inadmissible)  
  5. **Quantification method** (e.g., "pre-defined bias table", "weighted average")  
  6. **Adjustment amount**  
  7. **Duty manager approval** (if >|0.10|)  
  8. **Published probability**  

  ---

  ### **Case Studies**  
  *Using the procedure on real-world examples:*  

  #### **Case (a): Ensemble = 0.18**  
  - **Triage**: 0.18 is between 0.10–0.90; raingauge iced over → proceed.  
  - **Step 1**: Admissible? Yes (input data error).  
  - **Step 2**: Quantify impact? No—under-reporting amount unknown, no pre-rule. **Default**: Publish 0.18.  
  - **Result**: Published = 0.18.  
  - **Why**: Unquantifiable impact → no adjustment.  

  #### **Case (b): Ensemble = 0.30 → Forecaster wants 0.55**  
  - **Triage**: 0.30 in range; historical undercalls → proceed.  
  - **Step 1**: Admissible? **No**—historical undercalls lack documented bias.  
  - **Result**: Published = 0.30.  
  - **Why**: "Historical jumpiness" is inadmissible without proof. *This invalidates your current practice.*  

  #### **Case (c): Ensemble = unknown (reservoir release at 18:00)**  
  - **Triage**: Assume probability in range; external call → proceed.  
  - **Step 1**: Admissible? **No**—reservoir call is a future human action, not input error.  
  - **Result**: Publish ensemble value unaltered.  
  - **Why**: Evidence predicts outcome, not chance.  

  #### **Case (d): Gauge already 40cm above threshold**  
  - **Triage**: Ongoing flooding → skip adjustment steps.  
  - **Result**: Publish 1.00 and issue immediate warning.  
  - **Why**: Outcome has occurred; model probability is irrelevant.  

