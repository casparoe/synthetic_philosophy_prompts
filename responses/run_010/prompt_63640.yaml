   The standard resolution is that the Principal Principle applies when we know the chance and have no other relevant information. But if we have additional information (like the frequency), we must conditionalize on all the evidence. In particular, the chance is fixed at 0.5, but the frequency is evidence that is compatible with the chance (since 140 heads in 200 tosses is possible under chance 0.5, though unlikely). And conditional on the frequency, the first toss is more likely to be heads.

