prompt: |-
  I have followed the open-borders debate off and on for fifteen years, mostly through the rationalist and EA blogs that periodically rediscover it, and I have grown impatient with how it is usually staged: a thought experiment pitting a poor would-be migrant against a prosperous citizen, an appeal to a global original position, a counter-appeal to freedom of association, and then everyone returns to their corner. What I want instead is a case analysis, run in both directions — theory illuminating the case, case interrogating the theory — and I want it disciplined rather than rhetorical.

  The episode is the voyage of the *St. Louis*, set against the Évian conference that preceded it. Take these as the given facts; do not make the argument turn on anything beyond them, and if you believe I have misstated one, say so in a single line rather than silently correcting me. In July 1938, delegations from thirty-two countries met at Évian for nine days on the refugee question; nearly every delegate expressed sympathy, the United States was represented not by a cabinet officer but by a businessman and friend of the president, and the only country offering to take substantially more refugees was the Dominican Republic. American quotas set in the 1920s were fixed and heavily oversubscribed, so there was a long waiting list; a bill the following year to admit twenty thousand refugee children outside the quota never made it through the Senate. On 13 May 1939 the *St. Louis* left Hamburg with 937 passengers, almost all Jewish refugees, most of them holding Cuban landing certificates purchased in good faith — certificates that Cuba's president had invalidated by decree roughly a week before departure, so that landing now required fresh authorization and a bond. Havana refused the ship, negotiations conducted on the passengers' behalf by a Jewish relief organization collapsed, and the vessel was forced out of the harbor. It then moved close to the Florida coast and was not permitted to land; the stated grounds were that the passengers held no American immigration visas and had not been security-screened, and there was in American law at the time no refugee or asylum category to invoke. It returned to Europe in June 1939, where Britain, France, Belgium, and the Netherlands each took a share of the passengers. 254 of them were killed in the Holocaust.

  The theory is the right to exclude, in the several forms the literature actually takes: the communitarian account on which control over membership is constitutive of a political community's self-determination, together with its own built-in limit case — the acknowledgment that exclusion loses its justification when it becomes a matter of life and death for people with nowhere else to go; the freedom-of-association account, on which a state's right to close its borders is an extension of the right of individuals and groups not to associate; the national-partiality account, on which co-nationals may legitimately prefer one another and shape their shared public culture; the separation, insisted on by at least one careful theorist of territorial rights, between a state's jurisdiction over a territory and the property rights held by the people inside it, which blocks the slide from "citizens own land here" to "the state may bar outsiders from it"; and, on the other side, the open-borders arguments, including the claim that citizenship at birth functions like an inherited feudal privilege, and the point that even a convinced restrictionist owes a justification for the criteria used to select among applicants once a total number is fixed.

  Now do the work.

  1. Map the actors and the acts precisely. Which decisions here are exercises of a right to exclude at all, and by whom — the Cuban decree, the refusal of the harbor, the American refusal to admit, the watching of the ship off Florida, the four governments' eventual partition of the passengers? Where does exclusion shade into something else the theories do not name?
  2. Consider the sequencing problem. The American refusal was not a refusal to admit any of these people ever; it was a refusal to admit them now, ahead of others already in line against a fixed quota. Does the right-to-exclude literature have the conceptual vocabulary for a refusal that is about order rather than about numbers? If the only alternative was to displace someone else on the list, whose wrong is it, and does any of the theories above say?
  3. Consider the bilateral structure. Theories of exclusion generally model a single gatekeeper facing an outsider who wants in. Here the sending state was actively expelling these people while stripping them of the assets that would have made them admissible elsewhere. What does that do to an analysis framed entirely around the receiving state's prerogative?
  4. Consider the revoked permission. These passengers had bought landing certificates and rearranged their lives around them. Is invalidating a previously issued authorization an act of exclusion, a breach of reliance, or a third thing? Does a right to exclude cover the retraction of permissions already granted and paid for?
  5. Consider interdiction without adjudication. Nobody was heard; the ship was kept from landing on grounds of paperwork and screening. Which of the theories has anything to say about the difference between refusing entry after a hearing and preventing arrival so that no hearing can occur — and if none does, note that.
  6. Consider whether the right to exclude is held severally or jointly. The condition that made this case fatal — nowhere else to go — is a property of an international system in which every habitable landmass is claimed, not of any single government's decision. Is it a fallacy of composition to infer from the permissibility of each state's refusal the permissibility of the collective outcome? Does anything in the literature handle the system-level question, or does it all operate one state at a time?
  7. Give me the verdict in both directions. Was the *St. Louis* a refutation of the right to exclude, merely the limit case those theories had already conceded, or a case they were never really about? And be honest about the second half: does this episode do any argumentative work for the open-borders side that is not intuition-pumping? If a theory's exception clauses fire in exactly the cases that motivate the debate, say whether anything is left of the theory.
  8. Mark clearly where the theories are silent rather than making them speak.

  No bibliography, no page references, no quoted passages, and no invented attributions — reason from the content of the positions as I have described them and from what you already know, and flag any place where your own recollection is shaky instead of papering over it.
