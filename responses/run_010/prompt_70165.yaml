answer: |-
  Here is a case analysis of the *St. Louis* episode against the specified theories of the right to exclude, adhering strictly to your constraints:

  ### 1. Mapping Acts of Exclusion  
  - **Cuba's decree & harbor refusal**: An exercise of exclusionary sovereignty, but complicated by the retroactive invalidation of *paid* landing certificates. This shades into breach of contract/estoppel, not purely exclusion.  
  - **US refusal to admit**: Clear exercise of exclusion based on visa/screening rules and quota adherence.  
  - **US Coast Guard "watching"**: Enforcement of exclusion by interdiction (preventing arrival/request), not adjudication.  
  - **European partition**: *Admission*, not exclusion. Germany's expulsion (asset-stripping, forced departure) is active persecution, not exclusion.  
  - **Theories silent on**: Retroactive revocation of authorization, interdiction without process, and sending-state coercion.

  ### 2. Sequencing Problem (Order vs. Numbers)  
  - The US refusal prioritized queue integrity over immediate need.  
  - **Theories lack tools**: None adequately distinguish refusal *order* from refusal *total*. Communitarianism might justify queue discipline as cultural self-determination, but its "life-and-death" limit clashes here. Freedom-of-association doesn't address triage.  
  - **Whose wrong?**: If admitting *St. Louis* passengers displaced others in equal peril (debatable given unused quotas), the wrong is distributive injustice. No theory resolves this; national partiality might accept queue-jumping as inherently unfair, but open-borders critiques of "feudal birthright" challenge the queue's legitimacy.  

  ### 3. Bilateral Structure (Sending State's Role)  
  - Germany’s expulsion and asset confiscation transformed these from "outsiders seeking entry" to "victims of state-engineered dispossession."  
  - **Analysis failure**: Theories modeling a passive outsider and unilateral gatekeeper collapse here. The sending state’s malice undermines the receiving state’s "neutral" prerogative. Freedom-of-association assumes voluntary non-association; it cannot cover forced expulsion creating desperation.  

  ### 4. Revoked Permission  
  - Invalidating paid landing certificates is **not primarily exclusion**. It’s a retroactive breach of reliance/contract.  
  - **Theories silent**: No right-to-exclude framework addresses revocation of *existing, paid-for* authorization. This falls outside their scope (property rights? commercial law?).  

  ### 5. Interdiction Without Adjudication  
  - Preventing landing preempted any individual hearing or asylum claim.  
  - **Theories silent**: None distinguish procedural refusal (post-hearing) from preemptive interdiction. Freedom-of-association implies no duty to hear non-members, but communitarianism’s "life-and-death" limit might require procedural engagement. No theory explicitly endorses blockading to avoid scrutiny.  

  ### 6. Several vs. Joint Right to Exclude  
  - **Fallacy of composition?** Yes. Each state’s refusal might be permissible alone, but their collective action created lethal statelessness (nowhere to go).  
  - **Literature gap**: All theories operate unilaterally. None address systemic coordination or responsibility for refugees in a fully sovereign world. The communitarian "life-and-death" limit implicitly acknowledges systemic failure but offers no remedy.  

  ### 7. Verdict in Both Directions  
  - **For the theories**: The 254 deaths are the **limit case communitarianism concedes**, where exclusion loses justification. Yet the US refusal (framed as queue integrity) and Cuban revocation fall outside their core concerns. The episode exposes gaps (sequencing, interdiction, revocation) but doesn’t refute exclusion *in principle*.  
  - **For open-borders arguments**: The case **does argumentative work beyond intuition-pumping**:  
    - It shows how exclusion criteria (quotas, queues) can be rigidly administered amid catastrophe.  
    - It exposes how "nowhere to go" emerges from *systemic* non-coordination, challenging unilateralism.  
    - **But**: If communitarianism’s exception fires here, and other theories ignore such cases, **the core right remains intact for non-exceptional cases**. Open borders gains traction only if such "exceptions" are the rule or reveal inherent flaws.  

  ### 8. Marked Silences  
  Theories are silent on:  
  - Retroactive revocation of authorization.  
  - Ethics of queue-jumping vs. life-and-death need.  
  - Moral implications of interdiction (blocking access to process).  
  - Collective responsibility in a system of sovereign states.  
  - Sending-state coercion as a factor in exclusion ethics.  

  **Final Note**: The *St. Louis* is less a refutation of exclusion *theory* than a brutal exposure of its *practical and systemic failures* under duress. It forces the question: If the conceded limit case arises from sovereign non-cooperation, does the right to exclude require a corollary duty of international coordination? None of the theories answer this.
