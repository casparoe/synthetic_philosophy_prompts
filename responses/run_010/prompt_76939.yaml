answer: |-
  ## Opening Remarks: In Defense of Deliberation

  Colleagues, Trustees, Counsel. Twenty-six years ago, I sat where many of you sit now. Facing complex pressures, worrying about the future of this institution and the profession we hold dear. And in that moment, I drafted Article VII, Section 3 – the clause requiring a two-thirds majority and a twelve-month waiting period for any change to our tenure rules. Tomorrow, you vote on whether to strike it from our governance documents.

  As the drafter, and by tradition, I’m granted these ten minutes. Not to lecture from some imagined pedestal of wisdom – time has a way of humbling those notions – but simply to explain the *why* that guided my pen back then. A *why* I believe remains valid, even urgent, today. Especially today.

  I didn’t write that clause because I distrusted any particular colleague or senate. I wrote it because I distrusted *panic*. I distrusted the corrosive speed of crisis. I saw how external pressures – budgetary storms, political winds, cultural shifts – could buffet an institution like ours. How fear, however well-founded in the moment, could narrow vision and shorten tempers. I saw how quickly complex principles, painstakingly built over generations, could be eroded in a single, heated afternoon by a simple majority feeling the walls close in.

  Tenure isn't just a contract; it's the bedrock principle safeguarding the intellectual independence necessary for this university to fulfill its core mission: fearless inquiry, challenging orthodoxy, pursuing truth wherever it leads, even when inconvenient or unpopular. Tampering with that foundation shouldn't be easy. It shouldn't be fast. It demands more than a bare majority swept along by transient anxieties. It demands overwhelming consensus and time – time for the initial heat to dissipate, time for scrutiny, time for voices often drowned out in the initial clamor to be heard, time for unforeseen consequences to surface.

  That’s the core belief: **Protecting the core requires friction.** The two-thirds vote ensures that any change represents a profound and durable shift in the faculty’s collective judgment, not just a fleeting reaction. The twelve-month delay isn't bureaucratic red tape; it's a mandated cooling-off period. It’s the space where the initial, often emotional, arguments are stress-tested. Where unintended consequences – the ones we *never* see coming in the first draft of outrage or expediency – have a chance to emerge. Where alternatives can be explored. Where the people most affected – including our junior colleagues whose lives and careers hinge on the stability of these rules – have a real opportunity to understand, respond, and organize.

  Which brings me, inevitably, to the hardest question. The one that keeps me up at night, the one I owe you a direct answer to. I see it in your eyes, especially those of you for whom 1998 feels like ancient history. Rightly so. **The objection is this:** Why should *you* be bound by a rule written by people long gone? Why should *this* senate, facing *today’s* challenges, be held to a “promise” *you* never made? Who are these ghosts of 1998 to dictate terms to the living, breathing faculty of 2024?

  It’s a powerful and fundamentally democratic question. You didn’t sign that contract. You weren’t in the room.

  My answer isn’t about binding *you* to *us*. It’s about binding *all of us* – past, present, and future – to the *institution* we serve. To its long-term health and integrity.

  Think of it less as a "promise to the past" and more as a **"safeguard for the future."** This clause isn't a chain locking you to my generation's decisions. It's a tool *you* inherit, a tool designed to protect the faculty's collective authority *from itself* in moments of maximum vulnerability. It recognizes a simple truth: governance isn't just about the present moment's will. It's about stewardship across time.

  This university existed before any of us arrived and, we fervently hope, will thrive long after we depart. The rules governing its most fundamental intellectual structures need stability that transcends any single senate, any single crisis, any single generation’s composition. The clause ensures that changes to tenure rules carry the weight of near-unanimity and survive the test of time – not just the time it takes to schedule another meeting, but the time it takes for a full academic cycle to unfold, for passions to cool, for perspective to emerge.

  Who benefits from this friction? *You do.* Future senates do. Our junior colleagues, ultimately, do. Because the pressures that prompted the clause in '98 haven't vanished; they've evolved. Financial austerity, shifting public perceptions of higher education, demands for rapid adaptation – these forces haven't lessened. If anything, the pace and intensity have increased. The temptation to find quick fixes, to sacrifice long-term principle for short-term relief, will always be there. This clause is the institutional guardrail. It forces the question: Is this change truly so essential, so widely agreed upon, that it warrants overriding this built-in pause? If it is, two-thirds of you can do it – but you must do it knowing the change won't take effect *immediately*, allowing for that crucial period of reflection and adjustment.

  I see the four junior faculty members here tonight. I know your contract votes were frozen last year by the operation of this very rule. I know the frustration, the uncertainty, the personal cost that delay imposed. I acknowledge that cost directly, and without reservation. The delay *has* cost people something. That is real, and it weighs heavily. The rule I designed caused you tangible hardship. For that, I am truly sorry. It is the hardest consequence to defend.

  But I ask you, and this body, to consider the alternative cost – the cost of *not* having that cooling-off period, that high bar. What if a bare majority, in a moment of intense pressure – perhaps facing a sudden budget catastrophe or a fierce external campaign – could radically alter tenure protections overnight? Without time for the full implications to be understood? Without time for the broader faculty to truly engage? Without time for you, our junior colleagues, to organize and voice your concerns effectively? The cost of a hasty, poorly-vetted change to the bedrock of academic freedom could be far higher, and far more lasting, impacting generations of scholars yet to come. The delay is painful medicine, but it aims to prevent a potentially fatal illness for the institution itself.

  So, who is being held to a promise they never made? You are being asked to uphold a **structural principle of prudent governance**, not the specific wishes of long-departed colleagues. You are being asked to recognize that the institution's longevity requires mechanisms that slow down the most consequential decisions, ensuring they are made with depth, breadth, and foresight. You are being entrusted with a tool designed to protect the faculty’s future autonomy *from* the tyranny of the urgent present.

  Colleagues, I am retiring. I will live with the consequences of your decision far less than any of you will. I’m not asking you to preserve this clause out of loyalty to me or to 1998. I’m asking you to preserve it because you believe, as I do, that protecting the core mission of this university requires deliberate, difficult safeguards against our own human tendency to act in haste under pressure. That the principles of shared governance and academic freedom are worth a moment of friction, a high bar for consensus, and the discipline of time.

  Strike this clause if you must. But do so knowing exactly what safeguard you are dismantling. Do so knowing you are removing a deliberate speed bump on the road to potentially irrevocable change. Do so knowing that the next crisis, the next wave of pressure, will meet less resistance. Do so only if you are utterly confident that future versions of yourselves, and of this senate, will never need the cooling-off period, the time for reflection, the demand for overwhelming consensus that Article VII, Section 3 provides.

  I urge you to keep the guardrail. Vote to retain the clause. Thank you.
