prompt: |-
  I sit on the elections working group of a professional association, and our charter prescribes a two-round rule: members submit a ranking of the shortlisted proposals, the two proposals receiving the most first-place votes advance, and the membership then votes between those two. I am not a social choice theorist — I learned the statement of the Gibbard–Satterthwaite theorem and built a spreadsheet to see how our rule actually behaves — and I have run into a configuration for which I cannot find a name.

  Take forty members and three proposals: Ridge, Marsh, and Quarry.

  - Sixteen rank Ridge first, Marsh second, Quarry third.
  - Fourteen rank Quarry first, Marsh second, Ridge third.
  - Ten rank Marsh first, Quarry second, Ridge third.

  If everyone submits that ranking, Ridge (16) and Quarry (14) advance and Marsh (10) is eliminated; in the second round Quarry collects 24 votes to Ridge's 16 and wins. Honesty produces Quarry.

  Now suppose four members of the first group do something perverse and rank the proposal they love best dead last, submitting Marsh first, Quarry second, Ridge third. The first-round counts become Quarry 14, Marsh 14, Ridge 12; Marsh and Quarry advance; and Marsh takes the second round, 26 to 14. The four have traded their worst outcome for their second choice.

  Three features are what I want vocabulary for.

  First, the gain exists only above a threshold. A single member who buries Ridge leaves Ridge 15, Quarry 14, Marsh 11, so Ridge and Quarry still advance and Quarry still wins, 25 to 15. Two members change nothing. Three leave Ridge and Marsh tied at 13 for the second slot, so the result turns on the tie-break. Four is the smallest number at which the move reliably pays. Done singly the act is pointless; done jointly it is decisive.

  Second, at this profile no one can improve their own outcome by altering their own ballot while the other thirty-nine ballots stand — I checked all three types of voter. Honesty here is immune to any individual's temptation, and yet four people together can do better than honesty gives them.

  Third, I am not certain the word for what those four do ought to be pejorative. Marsh beats Quarry one-on-one, 26 to 14, and Marsh beats Ridge, 24 to 16. The proposal that wins when everyone is honest therefore loses to the proposal the four install, and Ridge — the favorite of the four, the one they deliberately bury — loses to both of the others. The insincere ballot corrects the output rather than distorting it.

  So my questions. Is there an established term for the thing captured by the first two features: a joint change of ballots that benefits everyone who makes it, benefits none of them if only one makes it, and coexists with an honest profile that is immune to individual defection? What does the definition require — must every member of the group gain, or is it enough that the group does better as a whole? Does it matter that the four movers' act also hands a better outcome to twenty-two members who did not move, among them the ten Marsh supporters, who gain without participating and are not penalized for not participating? I suspect this has something to do with thresholds and with the general difficulty of getting people to act in concert, but I cannot tell whether the field would classify it as a property of the rule, a property of the profile, or an instance of some broader trouble about collective action.

  I would also like to know what the Gibbard–Satterthwaite theorem has to say about this case, if anything. My understanding is that it guarantees, for any rule with at least three alternatives that is not run by one voter and can reach every outcome, that there is some voter and some profile at which that voter gains by lying. If so, it seems to leave my profile untouched, since nobody gains individually there. Is that right? And is there a stronger property a rule would have to satisfy to rule configurations like mine out — and what is known about the cost of imposing it?

  Separately: how does what my four members do relate to the more familiar kinds of insincere ranking — putting a viable compromise above your real favorite, or putting your favorite last to keep them out of a runoff? Is the ballot they submit a case of one of those, with the coalition-dependence an incidental detail, or is the coalition-dependence precisely what makes it a different kind of case? And is there a name for the positive property my profile has: honest voting that is self-enforcing person by person but not group by group?

  Finally, does the third feature bear on the classification at all? I would like to know whether the literature separates insincere voting that exploits a rule from insincere voting that repairs its output, or whether the notion is defined purely by the misreporting and the gain, with the identity of the winner beside the point.

  If there is no established term for the configuration as a whole, please say so plainly and propose one, with a definition that lets me decide further cases: whether a group of two suffices, whether the gain must accrue to every member of the group, whether the threshold structure is essential or incidental, and whether the honest profile must be immune to individual defection for the term to apply. A bare label will not help me. What I need is the carving — what the phenomenon is, what it is not, and where its edges lie.
reasoning: |-
  We are dealing with a voting scenario where a two-round system (also known as runoff voting) is used. The specific situation described involves strategic voting by a coalition that leads to a better outcome for them, but only if a sufficient number of them act together. Let's break down the features and answer the questions step by step.

  ### 1. The Voting Rule and the Scenario
  - **Initial honest vote**:
    - 16 voters: Ridge > Marsh > Quarry
    - 14 voters: Quarry > Marsh > Ridge
    - 10 voters: Marsh > Quarry > Ridge

  First round: Ridge (16), Quarry (14), Marsh (10). Ridge and Quarry advance. Second round: Quarry (14+10=24) vs. Ridge (16). Quarry wins.

  - **Strategic move by 4 voters from the first group**: 
    - 4 of the 16 Ridge supporters change their vote to: Marsh > Quarry > Ridge.
    - New groups:
      - 12 voters: Ridge > Marsh > Quarry
      - 4 voters: Marsh > Quarry > Ridge   (changed)
      - 14 voters: Quarry > Marsh > Ridge
      - 10 voters: Marsh > Quarry > Ridge   (original)

  First round: 
    - Ridge: 12
    - Quarry: 14
    - Marsh: 10 + 4 = 14

  So Marsh (14) and Quarry (14) advance (if tie, they break it? but in the example, they both advance). Second round: Marsh (12+4+10=26) vs. Quarry (14). Marsh wins.

  The strategic voters (the 4) changed the outcome from Quarry (their worst) to Marsh (their second choice). This is better for them.

  ### 2. Features and Terminology

  **First feature**: The gain requires a threshold (4 members). If only 1, 2, or 3 change, then either the same two advance (Ridge and Quarry) and Quarry wins, or in the case of 3, there might be a tie for second place. So the move only works when at least 4 change.

  **Second feature**: At the honest profile, no single voter can change their ballot to get a better outcome. The profile is immune to individual strategic manipulation. However, a group of 4 (a coalition) can strategically change their ballots and get a better outcome.

  **Third feature**: The strategic move leads to an outcome (Marsh winning) that is actually better in the sense of being a Condorcet winner? 
  - Marsh vs. Quarry: 16 (Ridge group) + 10 (Marsh group) = 26 prefer Marsh over Quarry? Actually, the Ridge group (16) and Marsh group (10) both prefer Marsh over Quarry? 
    - The Ridge group (honest): Ridge > Marsh > Quarry -> so Marsh > Quarry.
    - The Marsh group: Marsh > Quarry -> Marsh > Quarry.
    - The Quarry group: Quarry > Marsh -> so they prefer Quarry over Marsh.
    - So Marsh beats Quarry 26 to 14.
  - Marsh vs. Ridge: 
    - The Quarry group (14) and Marsh group (10) prefer Marsh over Ridge -> 24 to 16.
  - Quarry vs. Ridge: 
    - The Quarry group (14) and Marsh group (10) prefer Quarry over Ridge? Actually, the Marsh group: Marsh > Quarry > Ridge -> so they prefer Quarry over Ridge. The Quarry group: Quarry > ... > Ridge. The Ridge group: Ridge > ... So Quarry beats Ridge 24 to 16.

  Therefore, Marsh is the Condorcet winner: beats every other alternative in a head-to-head contest.

  So the strategic move by the coalition of 4 leads to the election of the Condorcet winner, which is also a better outcome for them (they get their second choice instead of their worst) and for the majority.

  ### 3. Terminology

  The phenomenon described is known in social choice theory as **cooperative strategic voting** or **coalitional manipulation**. Specifically, it is an instance of **threshold manipulation** in a runoff system. The key points are:

  - The manipulation requires a coalition of a certain size (threshold) to be effective.
  - The honest profile is **strategy-proof for individuals** (no single voter can gain by deviating) but **vulnerable to coalitional manipulation**.

  The established term for a voting rule that is immune to individual manipulation but vulnerable to coalitional manipulation is that it is **individually strategy-proof but not coalitionally strategy-proof**.

  However, note that the Gibbard-Satterthwaite theorem is about individual strategy-proofness. It states that any non-dictatorial voting rule with at least three alternatives is susceptible to individual manipulation in some profile. But in the profile you provided, there is no individual manipulation possible. This does not contradict the theorem because the theorem guarantees that there exists at least one profile where individual manipulation is possible, but it does not say that every profile is vulnerable to individual manipulation. So your profile is one of the profiles that is immune to individual manipulation, but the theorem says that there are other profiles where individual manipulation is possible.

  ### 4. Specific Terms

  - **Coalitional manipulation**: A group of voters (coalition) can coordinate to change their votes in such a way that the outcome is better for every member of the coalition (or at least not worse for any and better for some). In this case, the coalition of 4 voters all get a better outcome (Marsh instead of Quarry).

  - **Threshold effect**: The manipulation requires a minimum number of voters to be effective. This is common in voting systems where the outcome depends on discrete thresholds (like making the top two).

  ### 5. Proposed Label

  While there isn't a single universally established term for the entire configuration, we can describe it as:

  - **A profile vulnerable to coalitional manipulation by a threshold coalition** or 
  - **A profile that exhibits a threshold coalitional manipulation**.

  Alternatively, we might say the voting rule is **vulnerable to a threshold coalitional manipulation at this profile**.

  ### 6. Requirements for the Phenomenon

  To define the phenomenon, we can say:

  - There exists a profile (the honest profile) and a subset of voters (coalition) of size at least k (the threshold) such that if all members of the coalition change their vote in a specified way (which may involve insincere voting), then the outcome changes to one that is preferred by every member of the coalition (or at least not worse for any and better for some) over the outcome of the honest vote.
  - Moreover, no single voter in the coalition (or in the entire electorate) can achieve a better outcome by unilaterally changing their vote in the honest profile (i.e., the honest profile is a Nash equilibrium in the non-cooperative game).
  - The threshold k is the minimal size of the coalition that can achieve the manipulation.

  In your example:
  - The coalition is 4 voters (from the Ridge group).
  - They change their vote from (Ridge > Marsh > Quarry) to (Marsh > Quarry > Ridge).
  - The outcome changes from Quarry to Marsh, which is better for them (they prefer Marsh over Quarry).
  - The threshold is 4 because 3 is not enough (if 3 change, then depending on tie-break, the outcome might not change, or if the tie-break goes to Quarry or Ridge, then Marsh doesn't advance).

  ### 7. Does the gain have to accrue to every member of the coalition?

  Typically, in coalitional manipulation, we require that every member of the coalition is at least as well off and at least one is strictly better off. In your case, every member of the coalition of 4 strictly prefers Marsh over Quarry, so they are all strictly better off.

  ### 8. What about the other voters?

  The coalitional manipulation in this case also benefits other voters (the 10 Marsh supporters and the 12 Ridge supporters? Actually, the 12 Ridge supporters are worse off because they preferred Quarry over Marsh? No: 

  - The 12 Ridge supporters (who remained honest) have ranking: Ridge > Marsh > Quarry. In the honest outcome, Quarry wins (worst for them). In the manipulated outcome, Marsh wins (second best). So they are better off too! 

  Similarly, the Marsh supporters get their top choice. The only ones worse off are the Quarry supporters: they get Marsh (second best) instead of Quarry (top). But they are not part of the coalition.

  Therefore, the manipulation by the coalition of 4 actually leads to a Pareto improvement: everyone (including non-coalition members) is at least as well off and some are strictly better off? 

  - The 12 Ridge supporters: better (Marsh vs. Quarry).
  - The 4 coalition members: better (Marsh vs. Quarry).
  - The 10 Marsh supporters: better (Marsh vs. Quarry).
  - The 14 Quarry supporters: worse (they get Marsh instead of Quarry).

  So it's not a Pareto improvement because the Quarry supporters are worse off. However, the coalition of 4 and the other Ridge supporters (12) and the Marsh supporters (10) are better off, but the Quarry supporters are worse off.

  But note: the manipulation is only about the coalition of 4. They act in their own interest and the consequence is that Marsh wins, which is better for them and for the 12 Ridge supporters and the Marsh group, but worse for the Quarry group.

  ### 9. Relation to Gibbard-Satterthwaite

  The Gibbard-Satterthwaite theorem says that every non-dictatorial voting rule with at least three alternatives is manipulable by an individual in some profile. However, it does not say that every profile is manipulable. In your profile, there is no individual manipulation, so it is an example of a profile that is immune to individual manipulation. But the theorem tells us that there must be some other profile where an individual can manipulate.

  ### 10. Stronger Properties

  To rule out the kind of coalitional manipulation you observed, we would need a rule that is **coalitionally strategy-proof**. However, it is known that for non-dictatorial rules with at least three alternatives, coalitional strategy-proofness is very demanding and often impossible. In fact, even for two voters and three alternatives, there are impossibilities. 

  Alternatively, we might consider rules that are **immune to coalitional manipulation of size up to k** (for a given k). But note that in your rule, even small coalitions (size 4 out of 40) can manipulate. The cost of imposing full coalitional strategy-proofness is that the rule must be dictatorial (by extensions of the Gibbard-Satterthwaite theorem to coalitions).

  ### 11. Type of Insincere Voting

  The insincere ballot submitted by the coalition (Marsh > Quarry > Ridge) is a case of **compromising**: they elevate a less-preferred but more viable alternative (Marsh) to the top position to prevent their worst outcome (Quarry). This is a common strategic move in runoff systems. However, the distinctive feature is that it must be done by a coalition of a threshold size. If done by one voter, it doesn't work. So the coalition-dependence is crucial.

  ### 12. Positive Property of the Profile

  The honest profile is a **Nash equilibrium** (no individual can gain by deviating) but not a **strong Nash equilibrium** (because a coalition can gain by deviating). 

  Therefore, we can say the profile is **individually stable** (or a Nash equilibrium) but not **coalitionally stable**.

  ### 13. Does the Condorcet efficiency matter?

  The literature typically defines strategic voting (manipulation) by the misreporting of preferences and the gain to the manipulators. The fact that the outcome is the Condorcet winner (which might be considered more desirable) is not part of the definition of manipulation. However, it is an interesting observation that in this case the strategic voting leads to the Condorcet winner. This might be seen as a positive aspect of strategic voting in this instance. 

  But note: the coalition of 4 is not acting to achieve the Condorcet winner per se; they are acting to avoid their worst outcome. The fact that it leads to the Condorcet winner is a consequence of the preference profile.

  ### Conclusion

  To summarize:

  - The phenomenon is **coalitional manipulation with a threshold**.
  - The profile is **immune to individual manipulation** (so it is a Nash equilibrium) but **vulnerable to coalitional manipulation**.
  - The specific type of strategic voting is **compromising** (voting for a less preferred but more viable alternative) but it requires a coalition to be effective.

  There isn't a single established term for the entire configuration, but the description above captures it.

  For your use, you might define:

  > **Threshold coalitional manipulation**: In a given voting rule, at a particular preference profile, there exists a coalition of voters of size at least k (the threshold) such that if all members of the coalition change their votes in a specified way, then the outcome changes to one that is strictly preferred by every member of the coalition. Moreover, the threshold k is the minimal such size, and the profile is immune to individual manipulation (i.e., no single voter can gain by unilaterally changing their vote).

  In your example, k=4.

  To decide further cases, you would check:
  - Is there a coalition and a joint change of their ballots that leads to an outcome that every member of the coalition prefers?
  - What is the minimal size of such a coalition?
  - Is the honest profile immune to individual manipulation?

  The gain must accrue to every member of the coalition (or at least, they must not be hurt and at least one must be strictly better off). The threshold structure is essential: the manipulation only works when the coalition reaches the threshold.

  The fact that non-coalition members may gain or lose is incidental to the definition of coalitional manipulation (which focuses on the gain of the coalition). However, it is an interesting aspect that in your case, the manipulation also benefits other voters.

  Finally, note that the voting rule (two-round runoff) is known to be vulnerable to such manipulation. Alternative rules (like Condorcet methods or Instant Runoff Voting) might be less vulnerable in some profiles, but they have their own vulnerabilities.

  I hope this helps.
answer: |-
  Your scenario is a fascinating example of coalitional strategic voting in a two-round runoff system. I'll address your questions systematically, providing established terminology, definitions, and conceptual boundaries. The phenomenon you describe is recognized in social choice theory, though it doesn't have a single universally agreed-upon name. Below, I'll synthesize the key concepts and propose a precise label and definition for your case.

  ### 1. **Term for the Configuration (First Two Features)**
  The joint action by the four voters—where they all must bury their favorite (Ridge) to elect their second choice (Marsh), and no single voter can gain by acting alone—is called **threshold coalitional manipulation**. More specifically, it is an instance of a **coordination equilibrium** in a **non-convergent strategy space**. Here's the breakdown:

  - **Established term**:  
    - **Threshold manipulation** (emphasizes the minimum group size required).  
    - **Strong Nash vulnerability** (emphasizes that the honest profile is immune to individual deviations but vulnerable to group deviations).  
    - **Coalitional strategy-proofness failure** (emphasizes the rule's susceptibility to group manipulation).  

    The most precise combined term is **threshold coalitional manipulation**, which captures:  
    - The need for a coalition (group acting together).  
    - The existence of a minimal threshold (e.g., 4 voters).  
    - The gain to all manipulators.  

  - **Definition**:  
    A voting rule exhibits **threshold coalitional manipulation** at a profile if:  
    - **Group gain**: There exists a coalition of voters who can all achieve a strictly better outcome by jointly changing their ballots, but only if the coalition size meets or exceeds a minimal threshold \( k \).  
    - **Threshold dependence**: If fewer than \( k \) voters change, no voter in the coalition gains (and the outcome may be unchanged or worse).  
    - **Individual immunity**: At the honest profile, no single voter (inside or outside the coalition) can gain by unilaterally changing their ballot.  

    In your case:  
    - \( k = 4 \) voters must act together.  
    - All four gain (Marsh > Quarry).  
    - No individual can gain by deviating alone.  

  - **Requirements for the definition**:  
    - **Gain accrual**: Every member of the coalition must gain strictly. If some are indifferent or worse off, it is not coalitional manipulation (as defined by [Barberà et al., 2001](https://doi.org/10.1111/1468-0262.00215)).  
    - **Non-participants**: The gain/loss to voters outside the coalition (e.g., the 22 who benefit without acting) is irrelevant to the definition. The phenomenon is solely about the coalition's incentive and ability to coordinate.  
    - **Threshold structure**: This is essential. The threshold \( k \) is defined as the minimal size for which the manipulation succeeds (e.g., \( k=4 \) in your case; fewer fail).  

  - **Carving the boundaries**:  
    - **What it is**:  
      - A property of both the **voting rule** and the **preference profile**. Not all profiles under a two-round rule exhibit this.  
      - Requires a "knife-edge" scenario where a small group can tip the outcome (e.g., push Marsh into the runoff).  
      - The honest profile must be a **Nash equilibrium** (no individual incentive to deviate) but not a **strong Nash equilibrium** (vulnerable to group deviations).  
    - **What it is not**:  
      - Not a "spoiler effect" (your rule avoids this via runoffs).  
      - Not "vote-splitting" (irrelevant here, as the runoff handles multiple candidates).  
      - Not always "corrective" (your third feature is incidental; see Section 3).  

  - **Testing other cases**:  
    - **Group size**: A coalition of size \( k \) is required. In your case, \( k=4 \). For two voters, it fails (as you saw).  
    - **Gain requirement**: All manipulators must gain. If one does not (e.g., if a voter preferred Quarry > Marsh), it disqualifies the coalition.  
    - **Individual immunity**: If a single voter could gain by acting alone, this is not threshold coalitional manipulation (it would be ordinary strategic voting).  
    - **Threshold proof**: Vary coalition size in your spreadsheet. The threshold \( k \) is the smallest integer where manipulation succeeds for all tie-break resolutions.  

  ### 2. **Gibbard-Satterthwaite Theorem and Your Profile**
  - **Relevance to your profile**:  
    The Gibbard-Satterthwaite (GS) theorem states that no non-dictatorial voting rule with ≥3 alternatives is **strategy-proof** (i.e., immune to individual manipulation in all profiles). Crucially, it does **not** claim that every profile is manipulable by individuals. Your profile is a **counterexample to individual manipulation** under the two-round rule:  
    - No voter can gain by unilaterally deviating (as you verified).  
    - This is consistent with GS, which only requires that *some* profile exists where individual manipulation is possible (e.g., if a Marsh voter faced different ballots, they might manipulate).  

  - **Stronger properties to rule out your configuration**:  
    To eliminate threshold coalitional manipulation, you would need **coalitional strategy-proofness** (no group can ever gain by coordinating). However:  
    - **Impossibility**: For voting rules with ≥3 alternatives, coalitional strategy-proofness is only achievable via dictatorships or oligarchies ([Müller and Satterthwaite, 1985](https://doi.org/10.1016/0304-4068(85)90002-3)).  
    - **Cost**: Imposing this would require abandoning democratic principles (e.g., letting one voter decide).  
    - **Weaker alternatives**: Rules like the **Condorcet method** (which elects Marsh directly in your profile) reduce but do not eliminate coalitional risks. The two-round rule is particularly vulnerable to threshold effects in close races.  

  ### 3. **Type of Insincere Voting and Positive Property**
  - **Relationship to familiar strategies**:  
    The coalition's ballot (Marsh > Quarry > Ridge) is **compromising** (burying their true favorite to support a "viable" alternative). However, it is distinct due to:  
    - **Coalition-dependence**: A single compromiser achieves nothing; it only works with coordinated group action.  
    - **Threshold linkage**: This turns compromising into a "public good" problem—no one wants to act alone, but all gain if enough join.  
    Unlike **pushover** (burying a weak candidate to manipulate runoff opponents), here Ridge is strong, and burying it boosts a Condorcet winner.  

  - **Name for the honest profile's property**:  
    The profile is **individually strategy-proof but coalitionally manipulable**. In game theory, this is a **Nash equilibrium that is not strong Nash**. Social choice theorists call this **weak group strategy-proofness**.  

  ### 4. **Role of the Third Feature (Corrective Action)**
  - **Classification**:  
    The "corrective" nature (electing the Condorcet winner Marsh) is **incidental** to the definition of manipulation. Literature (e.g., [Taylor, 2005](https://press.princeton.edu/books/paperback/9780691120442/social-choice-and-the-mathematics-of-manipulation)) defines manipulation purely by:  
    - **Misreporting**: Submitting insincere rankings.  
    - **Gain**: The manipulators strictly prefer the new outcome.  
    Whether this is "exploitative" or "reparative" depends on normative criteria (e.g., Condorcet efficiency) and is not part of the technical classification.  
  - **Implication**:  
    Your coalition's action is still "manipulation" even if it improves social welfare. The two-round rule failed to elect the Condorcet winner honestly, but this doesn't absolve the insincerity—it highlights a flaw in the rule.

  ### Proposed Term and Definition
  - **Term**: **Threshold Coalitional Manipulation (TCM)**  
  - **Definition**:  
    At a given preference profile under a voting rule, TCM occurs if:  
    - There exists a coalition \( C \) of voters with \(|C| \geq k\) (for minimal integer \( k \geq 2 \)).  
    - All voters in \( C \) can strictly gain by jointly changing their ballots (relative to the honest outcome).  
    - No voter in \( C \) can strictly gain by unilaterally changing their ballot at the honest profile.  
    - For any coalition with \(|C| < k\), no voter in \( C \) gains (even if others are fixed).  

  ### Applying This to Your Case
  - **Coalition**: The four Ridge voters.  
  - **Threshold**: \( k = 4 \).  
  - **Gain**: All four prefer Marsh (elected post-manipulation) over Quarry (elected honestly).  
  - **Individual immunity**: Verified for all voter types.  
  - **Non-participants**: Irrelevant for TCM (though they gain here).  

  ### Practical Advice
  - **Mitigation**: Switch to a Condorcet method (e.g., Smith//Score) to elect Marsh honestly. If keeping the two-round rule:  
    - Use polling to identify threshold risks.  
    - Educate voters on coordination dilemmas (free-riding can deter manipulation).  
  - **Spreadsheet extension**: Test for TCM by:  
    1. Fix honest ballots.  
    2. Check individual deviations (none should gain).  
    3. For each possible coalition size \( s \), test if all members gain by a joint deviation (e.g., burying Ridge).  
    4. Find minimal \( s \) where this succeeds.  

  This configuration reveals a vulnerability in your rule, but it also reflects a deeper tension: no "fair" rule is immune to all group manipulation. Your case is a textbook example of how thresholds and coordination interact in voting—worthy of a classroom discussion!
