prompt: |-
  Context: I'm a staff engineer at a payments company and I've become the guy who loses arguments to Chesterton's fence. In March we ripped out a rounding shim in the settlement path that nobody could explain -- dead-looking, untested, no owner, sitting there since 2011 -- and it turned out to be papering over a mismatch with one particular bank's feed format. Cost us a bad day and a lot of Slack humiliation. Since then our team lead tells the story at lunch roughly weekly, and he's escalated it into a whole principle: society is a codebase, customs are legacy code with no comments, the reformer is the new hire who deletes a weird function because it looks unused, and therefore anything that has survived a long time carries a presumtion in its favor and the burden falls entirely on whoever wants to remove it -- you have to produce an account of why it's there before you're allowed to touch it. He drapes Burke over the top too, something about society being a partnership between the living, the dead, and those not yet born, which he says maps onto a repo perfectly: the maintainers who left, us, whoever inherits the thing.

  Our compliance lead thinks he's smuggling stuff in and she's probably right, but she made the point as a throwaway in standup and all I caught was something about version control and being able to ask the original author, which I couldn't hold onto. My own unease is a bit different: the shim story is doing all the actual work in his argument, and I'm not convinced it's even good evidence for the general claim, because in the code case we found out within a day and in the social case you might never find out -- or you only ever find out about the people the practice was hurting, who were never in a position to leave comments.

  Can you audit the analogy for me? I want exactly five numbered points, a sentence or two each, no introduction and no conclusion, in this order: what maps onto what; where the mapping genuinely breaks rather than just being loose; which features of the code case it quietly imports into the social case that the social case doesn't have; whether his conclusion -- long survival creates a presumption and the whole burden sits on the reformer -- survives once the disanalogies are on the table, or has to be cut down to something much weaker; and what analogy would carry the same intuition better, if any does. Fold the shim story in wherever it belongs rather than giving it its own item, and in the fourth one say plainly whether he's entitled to the generalization or only to a narrow rule about systems with no rollback.
reasoning: |-
  Okay, let me approach this systematically. The user wants a strict five-point audit of the team lead's code-society analogy, with specific components addressed in fixed order. 

  First, mapping clarity: The core parallel is clear - legacy code functions as unexplained traditions, removal attempts as reforms. The 2011 rounding shim represents persistent social customs. Burke's intergenerational partnership maps to repo maintainers across time.

  Now identifying breaks: The critical flaw is version control's absence in society. Unlike git blame, we can't query dead tradition-makers. More crucially, social systems lack rollback capability - you can't revert a cultural change when unintended consequences emerge days later.

  On smuggled assumptions: The analogy silently imports three code advantages into society: 1) Discoverability of errors (shim issue surfaced instantly), 2) Absence of power dynamics (unlike oppressed groups without "comment privileges"), and 3) Contained failure impact (one bad day vs societal harm).

  Assessing the presumption claim: The team lead overreaches. Survival presumption only holds for systems with instant feedback mechanisms like their payments pipeline. For society, the burden must be shared - reformers justify change, conservatives explain persistence. The shim story only supports "don't delete untested code without investigation."

  Considering alternatives: Feedback-loop systems offer better parallels. Think ecological interventions: introducing species requires understanding existing niches, like adding dependencies. Or urban planning: removing "pointless" traffic buttons risks ignoring undocumented pedestrian flows.

  The key insight: The shim incident proves nothing about societal reform because code has safety nets society lacks. The valid lesson is narrower: "In systems without undo, investigate before removing persistent elements."
answer: |-
  Here is the audit per your specifications:

  1.  **Mapping:** Legacy code functions (like the 2011 rounding shim) map onto longstanding social customs/traditions. Removing code without understanding its purpose maps onto social/political reform. Dead/absent maintainers map onto the dead whose reasons are lost. Current maintainers map onto the living. Future maintainers map onto the unborn. The codebase maps onto society itself. Burke's partnership maps onto the repo's timeline of contributors.

  2.  **Mapping Break:** Version Control & Querying Authors. The critical break is the inability to `git blame` or ask the original author in the social case. Dead social actors leave no comments or commit messages; their explicit rationale is often permanently inaccessible, unlike (potentially) traceable code history or contactable ex-maintainers.

  3.  **Smuggled Features:** The analogy quietly imports **immediate, discoverable feedback** (the shim error surfaced within a day) and **contained, reversible impact** (rollback was possible) into the social case, which often lacks both. Social changes may have delayed, hidden, or irreversible consequences, and harm may be diffuse or borne by powerless groups who couldn't "comment".

  4.  **Conclusion Validity:** The strong presumption/burden conclusion **does not survive intact; it must be cut down significantly**. The shim story only justifies a narrow rule for **systems with no rollback and no discoverable rationale**, demanding investigation *before* removal. For society, long survival suggests *possible* function but creates no automatic presumption. The burden *must* be shared: reformers justify change, while defenders of the status quo must also justify persistence beyond "it's old," especially given power imbalances silencing past "commenters."

  5.  **Better Analogy:** An analogy to **complex, evolved ecosystems or long-standing infrastructure interventions** carries the intuition better. Removing a seemingly redundant species or bridge support risks cascading, unforeseen consequences in interconnected systems with no undo button, emphasizing the need for cautious investigation, but without implying the original designers' intent was always optimal or knowable.
