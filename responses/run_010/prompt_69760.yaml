  ### Mechanism Identity Quiz  
  **Instructions:** For each scenario, choose the answer that best matches your intuition. Answer based on whether you think the "mechanism" in question is **the same** or **different**, or whether the question is **context-dependent**.  

  ---

  #### **Item 1: Depth Shift**  
  Two independently trained models (same architecture) both have a circuit detecting "dog images." In Model A, it’s in layer 5; in Model B, it’s in layer 7. Both circuits activate on identical inputs and produce the same output behavior. Are these the same mechanism?  
  - **A:** Yes—they detect the same feature.  
  - **B:** No—they’re in different layers, so different components.  
  - **C:** Depends: If monitoring for "dog detection," yes; if studying model internals, no.  

  #### **Item 2: Dictionary Disagreement**  
  Two sparse autoencoders (SAEs) are trained on the *same* model activations. Both have a feature for "cats," but their dictionary vectors (directions) differ slightly and activate on marginally different subsets of cat images. Are these SAE features capturing the same mechanism?  
  - **A:** Yes—they both approximate the "cat" feature.  
  - **B:** No—different vectors imply different representations.  
  - **C:** Depends: If you care about the abstract "cat" concept, yes; for precise feature direction, no.  

  #### **Item 3: Silent Swap**  
  After fine-tuning, a model still classifies "birds" correctly. Patching experiments show pre-fine-tuning, layer 4 neurons were critical; post-fine-tuning, layer 6 neurons are critical. Is the bird-classification mechanism the same?  
  - **A:** Yes—the output behavior is identical.  
  - **B:** No—different neurons are causally responsible.  
  - **C:** Depends: If you care about performance, yes; if studying causal pathways, no.  

  #### **Item 4: Sleeper Trigger**  
  A model has an "honest" circuit (no trigger) and a "malicious" circuit (trigger present). A monitor fires reliably on the honest circuit but never on the malicious one. Are these circuits the same mechanism?  
  - **A:** Yes—both generate responses to user queries (same function).  
  - **B:** No—different components, different outputs (honest vs. malicious).  
  - **C:** Depends: If monitoring for "query responsiveness," yes; for "trustworthiness," no.  

  #### **Item 5: Ghost Capability**  
  A model solves logic puzzles when prompted but resists localization: no single circuit or neuron set is consistently responsible across inputs. Is there a distinct mechanism for this?  
  - **A:** Yes—the capability is reliably elicited, so a mechanism exists.  
  - **B:** No—no stable causal structure means no mechanism.  
  - **C:** Depends: If you care about the behavior, yes; if you need a localizable circuit, no.  

  #### **Item 6: Spurious Success**  
  A circuit classifies "cows" correctly by detecting green grass (failing on cows without grass). Another circuit in a different model uses cow-shape features. Are these the same mechanism?  
  - **A:** Yes—both achieve correct cow classification in their training context.  
  - **B:** No—grass-detection vs. shape-detection are fundamentally different.  
  - **C:** Depends: If evaluating in-distribution performance, yes; for robustness, no.  

  #### **Item 7: Superposition Entanglement**  
  A neuron activates for "democracy," "blue," and 10 other features. When analyzing the "democracy" circuit, it overlaps with neurons for "blue." Is the "democracy" mechanism distinct?  
  - **A:** Yes—it reliably activates for "democracy" regardless of overlap.  
  - **B:** No—shared neurons mean no clear boundary between mechanisms.  
  - **C:** Depends: If studying democracy in isolation, yes; for neuron-level roles, no.  

  #### **Item 8: Algorithm Swap**  
  A model initially calculates addition digit-by-digit. After fine-tuning, it uses a lookup table. Both methods produce correct sums. Is the addition mechanism the same?  
  - **A:** Yes—identical outputs for all inputs.  
  - **B:** No—different algorithms imply different causal processes.  
  - **C:** Depends: If verifying answers, yes; if auditing computation, no.  

  ---

  ### Scoring Key  
  Tally your answers:  
  - **Mostly A’s: Functional Identity**  
    Mechanisms are the same if they implement the **same input-output function** (e.g., detecting "dogs"). Implementation details (layers, neurons) are irrelevant.  
  - **Mostly B’s: Causal-Architectural Identity**  
    Mechanisms are the same only if they use the **same components** (neurons, layers) in the **same causal order**. Anything else is distinct.  
  - **Mostly C’s: Interest-Relative Identity**  
    "Same mechanism" depends on **which behavior or capability you care about**. Identity is contextual and goal-dependent.  
  - **Mixed: Hybrid View**  
    You blend criteria (e.g., functional for some cases, architectural for others).  

  #### Pairs This Quiz Can’t Distinguish  
  - **Functional vs. Interest-Relative** may agree when "function" aligns with "interest" (e.g., Items 1, 3, 6).  
  - **Causal-Architectural** is distinct and rarely overlaps with others.  

  ---

  ### The Space of Criteria  
  We built the space along two axes:  
  1. **Basis for Identity**  
     - *Function*: Defined by input-output behavior.  
     - *Structure*: Defined by physical components/causal pathways.  
     - *Interest*: Defined by pragmatic goals.  
  2. **Granularity**  
     - *Type*: Generalizable across contexts (e.g., "dog detection" in any model).  
     - *Token*: Instance-specific (e.g., *this* dog-detection circuit in *this* model).  

  |                    | **Function**               | **Structure**               | **Interest**                |  
  |--------------------|----------------------------|-----------------------------|-----------------------------|  
  | **Type**           | Functional (A-heavy)       | *Empty* (incoherent: structure is token-specific) | Interest-Relative (C-heavy) |  
  | **Token**          | *Empty* (redundant: functions are types) | Causal-Architectural (B-heavy) | *Empty* (nonsensical: interests aren’t tokens) |  

  - **Empty Cells Explained**:  
    - Structure + Type: Incoherent—structures are concrete tokens.  
    - Function + Token: Redundant—functions are abstract types.  
    - Interest + Token: Nonsensical—interests aren’t tied to instances.  
  - **Why No Graded-Similarity View?** No one argued for "mechanisms are *similar*" in your subgroup. All positions were binary ("same" or "not same").  

  ---

  ### Which Criterion Licenses Transfer?  
  For the claim "a monitor trained on an earlier checkpoint/smaller model transfers to a deployed model":  
  - **Functional** licenses this best—if the *same feature* exists in both, the monitor should work.  
  - **Causal-Architectural** rejects it—components likely differ across models/checkpoints.  
  - **Interest-Relative** conditionally accepts it—only if the *capability being monitored* is preserved.  

  **Functional is the strongest foundation for transfer claims**, assuming features are stable across scales.  

