answer: |-
  ## Transcript

  The offer gleamed like fool's-gold in her flat:  
  *Consultant*, though the colours seemed all wrong.  
  The model hummed its verdict after chat.  

  *Harm's done,* it said, *but several steps along  
  The chain. You'll earn your bread, not break the bone.*  
  She traced each word – precise, detached, and strong –  

  Because the logic stood distinct, alone,  
  From feeling's tangled, inconvenient ache.  
  Her flatmates frowned, demanding reasons shown.  

  She quoted cleanly for compassion's sake:  
  *The distant impact justifies the role,*  
  *Because the structure mitigates the ache—*  

  *Because...* she stammered, reaching for control,  
  But found the transcript empty past that mark.  
  The borrowed wisdom took its heavy toll.  

  The reasons flowed like water in the dark –  
  You hear the rush, but cannot see the source.  
  Her certainty, a temporary ark  

  Built on foundations lacking inner force.  
  The screen held answers polished, sharp, and grand,  
  While understanding stayed a distant course.  

  They pressed her: *Speak it plain! Make us understand!*  
  She scanned the ceiling, desperate for the thread,  
  The inner compass missing from her hand.  

  The final reason echoed in her head,  
  The model's closing line, precise and vast...  
  But why *that* verdict stood, what truly led  

  The judgement home? That answer hadn't passed  
  From silicon to soul. It stayed confined.  
  The single line arrived, the die was cast,  

  The last rhyme chimed, the only path defined  
  By her own voice, yet faltering and thin:  
  *It chooses wrong.* The silence bloomed behind.  

  Because she couldn't say *why* it was sin.

  ---

  ## Notes

  *   **Form:** Terza rima (aba bcb cdc ded efe fgf hh), adhering to the interlocking pattern that perpetually defers resolution to the next stanza. The final couplet (hh) deliberately breaks the chain, leaving the last line isolated and unresolved.
  *   **Content:** Captures the woman's reliance on the model's verdict ("*Harm's done... mitigates the ache*"), her inability to independently articulate the underlying *why* when challenged ("*Because...* she stammered"), and the resulting hollowness despite surface confidence ("certainty, a temporary ark"). The distinction between knowing the answer and understanding its foundation is shown through action and structure, not explained.
  *   **"Because" Usage:**
      1.  **Model's Reason:** "*...mitigates the ache—/Because the structure...*" (Cold, logical, provided).
      2.  **Her Failed Attempt:** "*Because...* she stammered..." (Cut off, incomplete, dependent).
      3.  **Final Line:** "*Because she couldn't say why it was sin.*" (Explaining the *cause* of her silence/the poem's core dilemma).
  *   **Final Line:** "*Because she couldn't say why it was sin.*" is the crucial missing internal justification she lacks. It's the 'why' she *can't* provide independently.
  *   **British English:** "flat", "colours", "realise" (implied in the situation), "bread", "frowned".
  *   **Length:** 22 lines (7 tercets + 1 single line).
  *   **Jargon-Free:** Avoids terms like "moral testimony", "deference", "epistemic". The concepts are embodied in the narrative and form.
