  ## Part Two: Author's Note — What Carries the Mechanism

  The story's core challenge was depicting a rational information cascade without resorting to stupidity, lies, or technical jargon, relying solely on action, observation, and the physical artifacts of the search. Here’s how the six requested elements were carried:

  1.  **Honest Reports & Reasonable Inferences:** Every report is grounded in genuine observation. Tom sees disturbed leaves near a boundary and reasonably infers possible eastward movement. Otter finds a snapped twig near the same boundary and, primed by the previous report and instruction, reasonably links it. Miles sees a deep boot print and reasonably infers a slip/fall. Lena reports nothing found – accurately. Elara updates the map based on cumulative reports, a standard practice. Their actions are defensible at each step given their limited viewpoint and the information flow.
  2.  **Signal Strength Degradation:** This occurs explicitly in the radio transmission of Miles's find. His detailed observation of the print's depth and force ("significant downward force") is the strong private signal. Over the radio, Elara (and other teams) primarily hear "definite boot print G9." The crucial qualifying details about force and directionality are acknowledged but not emphasized, reducing it to the same categorical "positive sign" as the much weaker reports (disturbed leaves, snapped twig). The transmission medium flattens nuance.
  3.  **Partial Recognition of Reporting Bias:** Tom's second report about the snapped twig delivers this. He revisits the F9 site with Otter and observes the twig's proximity to the boundary marker, suggesting its breakage might be related to the marker itself or recent searcher activity ("Could be searcher activity yesterday") rather than Ben's travel. He doesn't articulate the abstract concept of prior reports influencing interpretation, but his confusion ("Not sure it’s related to travel *direction*") and the specific context (location near the marker they were told to check) show him uncomfortably recognizing that the "evidence" might be a product of their search focus, not the missing person's actions. Elara feels the shift ("a subtle shift beneath her feet") but doesn't make a speech, only annotating the log cautiously.
  4.  **Coverage Confound:** The probability map shades are the primary vehicle. Sectors initially white (like G9, H9) signify low probability but also *no search effort*. When a report comes from a searched sector (like "negative" from E9), the map doesn't adjust the probability down significantly because the blue was already low at the periphery – it mistakes lack of negative findings in unsearched areas for low probability. Elara's internal thought ("*No news isn't good news, it's just no searchers*") explicitly names the problem. The map's evolution shows blues intensifying only where teams are sent and reporting, regardless of whether the findings are strong evidence or absence of evidence.
  5.  **Change of Representation / Overcounting:** The climax uses the physical evidence log and photos juxtaposed with the map. Elara shifts from interpreting the *sequence of reports* (building the blue path) to examining the *individual pieces of physical evidence* themselves, stripping away the inferred connections. She sees the boot print photo's depth compared to the trailhead print, notes the jacket color discrepancy with the snag, and realizes the "path" is built on counting distinct clues (leaves, twig, print, snag) as sequential steps when they might be isolated or misinterpreted. The "re-marking" is literal: using the red grease pencil to circle clues individually or connect the twig to the boundary post, visually dismantling the blue narrative without new facts. The feeling is of reassessment, not revelation.
  6.  **Strong Contrary Signal & Credibility Cost:** Miles embodies this. His boot print observation is objectively stronger evidence than the prior clues. His dilemma is internal: knowing his interpretation ("downward force," no clear east link) contradicts the emerging consensus. He reports it accurately but neutrally, avoiding directionality, anticipating it might be absorbed. The cost is shown indirectly: the hours wasted searching H9 based on the reinforced eastward narrative while the probable fall site in G9 was neglected. His being "right" isn't celebrated; it's framed as a loss of potentially critical time ("hoping the cost wasn't ultimate"). The correction comes from Elara's mundane re-examination of evidence tags and photos, not from Miles's conviction prevailing.

  **Simplifications & Why:** Real searches involve far more redundancy: multiple teams might sweep a sector, GPS tracks verify coverage, formal evidence handling is stricter, and probability mapping is more sophisticated (often software-based). The single boot print as key evidence is a narrative compression; real searches might find more. The speed of the cascade is accelerated for dramatic effect. These simplifications were necessary to keep focus on the cognitive mechanisms within the word limit, using clear, visible elements (paper map, grease pencil, radio calls, evidence tags) as proxies for more complex systems.

  **Omission:** The story doesn't deeply explore the *social* dimension of the cascade within the field teams – the subtle pressure to find something when adjacent teams report signs, or the potential for group dynamics within a single team to shape what gets reported as significant. Showing this convincingly would require shifting viewpoints between multiple field teams and more space to develop their internal interactions, moving beyond the command/field binary focus maintained here. It would need a longer, more ensemble-driven narrative structure.

