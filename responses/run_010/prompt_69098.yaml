    - Explanation must eventually involve human choices? (Not necessarily terminate in individuals, but in human agency?).

  - **World-systems account** (Wallerstein):
    - Focuses on the world-system (capitalist world-economy) as a structure that explains long-term outcomes.
    - The system is the fundamental cause, and it operates on a long timescale.
    - It explains both origins and persistence? (More often persistence and expansion of the system).
    - The system constrains and selects: it rules out non-capitalist possibilities and also selects for core-periphery relations.
    - Causality: the system causes events and processes on faster timescales, but events can cause changes in the system? (Wallerstein allows for systemic change, but slowly).
    - Explanation does not terminate in individuals.

  - **California School** (Pomeranz, Goldstone, etc.):
    - Emphasizes contingency and comparison: the divergence (e.g., Industrial Revolution in Europe) is not due to deep structural differences but contingent factors (like coal and New World resources). 
    - They might deny that the slow layer (like institutions or social structures) was the cause; instead, they point to contingent factors that are not necessarily slow-moving? But note: coal formation is slow, but the exploitation of coal is an event? And New World windfalls are events (conquests) that happened at a particular time. 
    - They would say that the slow layer (like institutions) didn't make the divergence inevitable; it was contingent on these factors. 
    - They might argue that without these contingent factors, the outcome would have been different. 
    - They would not see the slow layer as selecting, but as allowing for multiple possibilities until the contingent event occurs.
    - They might be open to the idea that the origin of the divergence is contingent (so the explanandum is the origin) and that the persistence might be due to subsequent factors.

  - **Social-property-relations account** (Brenner, Marxist):
    - Focuses on class relations and property structures as the fundamental cause of historical outcomes (e.g., transition to capitalism).
    - The slow layer (social property relations) selects: it shapes the dynamics of development and crisis.
    - The explanandum is both the origin and the persistence? (Brenner's account of the origin of capitalism in England).
    - The social structure causes events and decisions, but events (like class struggle) can change the structure? (Yes, but the structure is slow to change).
    - Explanation does not terminate in individuals but in class positions and structural constraints.

  - **Institutional account** (North, Acemoglu & Robinson):
    - Institutions (rules of the polity) are the fundamental cause of long-term growth and stagnation.
    - The slow layer (institutions) rules out some possibilities and selects among others (e.g., inclusive institutions lead to growth).
    - The explanandum is both origin and persistence? (They often focus on why some countries are rich and others poor, which is a persistent divergence, but they also explain the origin of institutions).
    - They might allow for bidirectional causality? (Institutions shape economic outcomes, but economic outcomes can lead to institutional change). However, they often treat institutions as the fundamental cause that is slow-moving.
    - Explanation does not necessarily terminate in individuals? (But institutions are the rules that constrain and enable individual actions).

