  2. Is the explanandum the origin of a divergence or its persistence once begun? (e.g., why did the Industrial Revolution happen in England? vs. why did it persist and spread?)

  3. Does the slow layer merely rule possibilities out, or does it also select among the possibilities it leaves open? (constraint vs. active selection)

