  5. Must an adequate account terminate in the reasons of particular people? (methodological individualism?)

  We have to map the positions by their answers to these questions. But note: we may not need all questions for every path, and we have to design the tree so that the positions are separated as much as possible.

  Let's outline the positions and their typical commitments:

  - **Braudel's layered scheme**: 
    - Three layers: the almost immobile (geographical time), the slow (social, economic, cultural structures), and the fast (events, individuals). 
    - These layers interact, but the deeper layers set the stage. 
    - It allows for interaction between layers (so bidirectional causality?).
    - The slow layer does more than rule out possibilities; it shapes the possibilities and selects.
    - Explanation does not necessarily terminate in individuals.

  - **Hard environmental determinism**:
    - Environmental factors (climate, geography) are the ultimate cause of historical outcomes.
    - The silting-up (a natural process) is the cause, not the war.
    - The slow layer (environment) selects and determines, not just constrains.
    - Explanations do not terminate in individuals; they are determined by environment.
    - Causality is unidirectional: environment drives human events.

  - **Possibilism** (associated with Vidal de la Blache, and in some ways with Braudel too? but note: Braudel is more structural; possibilism is about the environment setting possibilities but not determining):
    - The environment sets possibilities, but humans choose among them. So the slow layer only rules out some possibilities and leaves a range of choices.
