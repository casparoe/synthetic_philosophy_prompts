  I have no academic training in this area, but I've spent a lot of evenings with a notebook working through Lewis's triviality result for indicative conditionals, and I think I've arrived at a dodge rather than an answer. The dodge: keep Adams's equation, P(A→C) = P(C|A), as the whole content of what an indicative conditional means, but treat the arrow as an operator that cannot be iterated — you may build a conditional out of two plain, non-conditional sentences, and you may not place a conditional inside another conditional. As far as I can follow, the collapse only gets started once the language permits nesting, so under my restriction it never gets off the ground. What bothers me is that this may not be a semantic claim at all, just a refusal to write down the sentences that break the rule; and speakers routinely produce and understand nested conditionals of an entirely everyday kind — a prediction about an election with one conditional tucked inside another — which my rule leaves uninterpreted.

  So: what is your credence that this restricted-language strategy is the correct resolution? Stated precisely, that the best available account of indicative conditionals assigns them probabilities equal to the corresponding conditional probabilities, and does so by declining to interpret nested conditionals rather than either abandoning truth conditions for simple conditionals or supplying a rival semantics for nested ones. Please decompose rather than simply answer. What probability do you assign to Lewis's proof genuinely turning on nesting, as against turning on its other assumptions — closure under conditionalization, the Boolean background, the thesis being required to hold for every sentence pair in the language? What probability do you assign to an account that leaves a whole class of ordinary sentences undefined counting as complete? What probability that the non-truth-conditional reading of simple conditionals is right anyway, which would make my proposal beside the point? Add whatever further terms you think belong. Give a number and a sentence of justification for each, show how they combine, and finish by saying which term your final figure is most sensitive to and what argument or example would move it most.
