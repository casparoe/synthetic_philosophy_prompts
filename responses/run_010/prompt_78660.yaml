  | Maintenance budget                   | Ongoing operational funding for caregivers/facilities | holds                                      | decorative                                                                | Both require continuous investment to function, but this doesn't resolve funding allocation (supply vs. cash benefits). |
  | Depreciation schedule                | Staff turnover/equipment wear           | strained                                   | decorative                                                                | Human capital (caregiver skills) appreciates with experience, unlike physical decay; focus on static "building" is misleading. |
