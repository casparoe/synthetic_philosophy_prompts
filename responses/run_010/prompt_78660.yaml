  | Non-excludability                    | Accessible childcare for all workers    | breaks                                     | undermines                                                                | Roads are non-excludable public goods; childcare is excludable (limited slots) and rival, functioning as a private/merit good. |
  | Network externality                  | Workforce participation multiplier      | holds                                      | decorative                                                                | Both amplify economic output when widely accessible, but childcare's impact is indirect (via parent productivity). |
  | **Output** (transport of goods)      | Parental labor + child development      | breaks                                     | undermines                                                                | Roads produce homogeneous throughput; childcare produces variable human development outcomes (an end in itself) *and* labor inputs. |

