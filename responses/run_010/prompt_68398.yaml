prompt: |-
  I'm a third-year in a philosophy-of-computation seminar and I've been assigned a paper on the epistemic status of the Church–Turing thesis — not on the thesis itself, on what kind of claim it even is. My supervisor keeps saying the interesting question is what an account of its status would have to deliver, and I want that spec written out before I read another forty pages of commentary.

  So: write the desiderata for an account of the epistemic status of CT. What does such an account have to be able to do to count as adequate — which phenomena it must explain, which distinctions it cant collapse, which results it has to be consistent with — with the case or consideration behind each requirement. Concretely it had better handle at least: why nobody has ever produced a counterexample, and whether that's inductive support or a symptom of the thesis being unfalsifiable; the difference between the mathematical thesis about effective procedures and the physical thesis about what the universe can do, and what each owes separately; the convergence of all the formalisms (Turing machines, lambda calculus, general recursion, Post-style and register machines) and whether that's independent evidence or one notion wearing five costumes; what an actual counterexample would have to look like and whether it can be described without begging the question, since anything describable enough for us to check is going to look like an algorithm itself; the results that derive an upper bound on what a mechanical process can do from assumptions like local causality, finitely many states and bounded precision, and whether those are proofs of CT or of something adjacent; the failures of the exotic machines (Zeno-style machines finishing infinitely many steps, real-valued machines storing exact reals, machines with an oracle) and whether those failures are conceptual or merely engineering; and the fact that CT does double duty in philosophy of mind, so that if it's analytic then "the mind is a Turing machine" goes trivial and stops saying anything.

  Tell me which of these are non-negotiable and which are just hobby-horses of one camp, and flag any subset that cant be jointly satisfied — I have a suspicion that "must be falsifiable in principle" and "must be an analysis of a pre-theoretical concept" can't both be kept, and I want to know whether you agree. Then score, briefly, the three families I keep running into: CT as conceptual analysis of "effective", CT as empirical hypothesis about physical process, and CT as stipulative definition.

  Purpose, so you know what "adequate" means here: I want an account good enough to tell me whether the thesis could ever be overturned by evidence rather than by re-definition. A table for the requirements is fine (requirement / what it has to handle / why that's a requirement). Lead with your bottom line in the first sentence — which single requirement excludes the most candidates, and whether the three families can jointly meet the list — then give the reasoning. No preamble, and don't restate the question back at me.
reasoning: |-
  Okay, the user is a third-year philosophy student working on a paper about the epistemic status of the Church-Turing thesis. They need a clear set of criteria for evaluating accounts of what kind of claim the CT thesis is. Their supervisor emphasized understanding what a good account must explain. The user wants to avoid getting lost in literature without a framework.

  First, I need to recall the key aspects of the Church-Turing thesis. It's about what can be computed algorithmically. But the epistemic status question is whether it's a conceptual truth, empirical hypothesis, or something else. The user listed several phenomena any account must handle: lack of counterexamples, the math-physics distinction, convergence of formalisms, what a counterexample would look like, results from physical assumptions, exotic machines, and implications for philosophy of mind.

  The user suspects a tension between falsifiability and being an analysis of a pre-theoretic concept. They also want to evaluate three families of accounts: conceptual analysis, empirical hypothesis, and stipulative definition. Their main goal is to know if CT can be overturned by evidence, not just redefinition.

  Breaking down the requirements: 

  1. **Explain the lack of counterexamples**: Why hasn't anyone found a function computable by an algorithm but not by a Turing machine? An account must address if this absence is inductive support or a sign of unfalsifiability. 

  2. **Distinguish the mathematical and physical claims**: The mathematical thesis (MT) is about effective procedures, while the physical (PT) is about what physical systems can compute. An account must clarify their relationship—does PT depend on MT, or are they independent?

  3. **Account for convergence of formalisms**: Multiple models (Turing machines, lambda calculus) compute the same functions. Is this evidence for CT or just different expressions of one idea?

  4. **Characterize a possible counterexample**: What would falsify CT? Since describing a procedure might make it algorithmic, is a counterexample even possible without circularity?

  5. **Address physical derivation results**: Some results show that physical constraints (local causality, finite states) imply Turing-computability. Are these proofs of PT or separate claims?

  6. **Explain failures of exotic machines**: Hypercomputation models (Zeno machines, real-valued) fail in practice. Are these conceptual impossibilities or engineering limits? This affects CT's scope.

  7. **Handle philosophy of mind implications**: If CT is analytic, saying the mind is a Turing machine becomes trivial. An account must avoid this if CT is supposed to be substantive in philosophy of mind.

  The tension between falsifiability and pre-theoretic analysis seems key. If CT is an analysis of "effective computability," it's unfalsifiable but explanatory. If empirical, it's falsifiable but lacks necessity. Stipulative definitions avoid both but make CT trivial. 

  Among the three families:
  - **Conceptual analysis**: Explains convergence and lack of counterexamples as definitional. But struggles with falsifiability and PT, making philosophy of mind claims trivial.
  - **Empirical hypothesis**: Treats PT as falsifiable, handles exotic machines' failures as empirical. However, it doesn't explain the mathematical convergence, and counterexamples are elusive.
  - **Stipulative definition**: Avoids epistemic issues by making CT true by definition. But this makes it uninformative and can't handle the math-physics distinction or philosophy of mind.

  The hardest requirement is reconciling the need for falsifiability with the analytic nature of MT. The mathematical thesis seems analytic due to convergence, but PT must be empirical to avoid triviality. A hybrid approach might work: MT is conceptual, PT is empirical. But then how are they linked? Physical derivations might bridge them, but they rely on assumptions that could be challenged.

  The user's bottom line: The exclusion of counterexamples requirement is crucial. It differentiates accounts. Conceptual analysis explains it as unfalsifiable; empirical sees it as inductive support. But satisfying all requirements jointly is tough. The math-physics distinction might be key—splitting MT and PT allows a hybrid account. However, a unified view struggles. 

  Scoring the three families:
  - **Conceptual analysis**: Scores high on MT aspects (convergence, lack of counterexamples) but low on PT and falsifiability. Fails philosophy of mind (makes it trivial).
  - **Empirical hypothesis**: Good on PT, falsifiability, exotic machines. Poor on convergence and the analytic feel of MT.
  - **Stipulative definition**: Avoids problems but explains nothing. Fails most requirements except trivial consistency.

  No single account satisfies all. The user needs a hybrid: MT as conceptual, PT as empirical. But linking them is the challenge. Physical derivations might connect them, but those derivations' assumptions could be questioned. The user's goal—whether evidence can overturn CT—depends on which part: MT is definitional, so no; PT is empirical, so yes. But without a clear link, it's messy. 

  So the bottom line: The requirement to explain the lack of counterexamples excludes most candidates when combined with falsifiability. Hybrid approaches are necessary but face challenges. The three families can't jointly satisfy all criteria; a split account is needed, but its coherence is debated.
answer: |-
  ### Bottom Line
  The requirement that **excludes the most candidate accounts** is explaining the *lack of counterexamples* while reconciling it with the thesis's *falsifiability in principle* and its *role as a pre-theoretic analysis*. No single family (conceptual, empirical, stipulative) satisfies all desiderata jointly; a hybrid account is necessary but faces tensions, especially between the mathematical and physical claims.

  ### Desiderata Table
  | Requirement                        | What It Must Handle                                                                 | Why Required                                                                 |
  |------------------------------------|-------------------------------------------------------------------------------------|------------------------------------------------------------------------------|
  | **1. Explain lack of counterexamples** | Why no counterexample exists despite effort; whether this is inductive support or unfalsifiability. | Core to CT's resilience. Tests if the thesis is substantive or tautological. |
  | **2. Distinguish math (MT) vs. physical (PT) theses** | What MT (effective procedures) and PT (physical realizability) each owe separately; their interdependence. | MT and PT are conflated in discourse but have distinct justifications and scopes. |
  | **3. Account for convergence of formalisms** | Why all models (Turing, λ-calculus, etc.) compute the same class; whether this is evidence or circular. | Central to CT's plausibility. Bears on whether "effective" is uniquely captured. |
  | **4. Characterize a possible counterexample** | What would falsify CT? Can it be described non-circularly (without assuming "algorithm")? | Tests falsifiability. If no coherent counterexample is possible, CT is vacuous. |
  | **5. Address physical derivation results** | Whether proofs (e.g., from locality/finite states) establish CT or a distinct claim. | Shows if physics *entails* PT or merely bounds a subset of computability. |
  | **6. Explain failures of exotic machines** | Why hypercomputation (Zeno/oracle/real-valued) fails: conceptual flaw or engineering limit? | Determines if CT is a contingent physical limit or a conceptual truth. |
  | **7. Handle philosophy of mind implications** | If CT is analytic, "mind is Turing machine" trivializes; if empirical, it remains substantive. | CT’s dual use demands an account that avoids trivializing philosophical claims. |

  ### Non-Negotiables vs. Contestable
  - **Non-negotiable**: (1), (2), (4), (7). These define CT’s core puzzles: its empirical inexplicability, math-physics duality, falsifiability, and non-triviality in philosophy of mind.  
  - **Contestable**: (3) and (6). Some view convergence as self-evident (e.g., conceptual analysts), while others debate exotic machines' relevance (empiricists often dismiss them as incoherent).  
  - **Tensions**: (5) is ambiguous—physical derivations are claimed as evidence for PT by some, but critics argue they assume CT-like premises.

  ### Key Tension: Falsifiability vs. Pre-Theoretic Analysis
  You are correct: **"must be falsifiable in principle" and "must be an analysis of a pre-theoretic concept" cannot be jointly satisfied** for a *unified* account.  
  - **Why**: If CT is an analysis of "effective computability," counterexamples are *inconceivable* (as anything describable is algorithmic). But if falsifiable, it cannot be a pure conceptual truth.  
  - **Resolution**: Split MT and PT. MT (mathematical) is pre-theoretic analysis (unfalsifiable); PT (physical) is falsifiable. But this invites the challenge: *How are MT and PT related?*

  ### Scoring the Three Families
  | Family                     | Score (/10) | Strengths                                                                 | Weaknesses                                                                 |
  |----------------------------|-------------|---------------------------------------------------------------------------|----------------------------------------------------------------------------|
  | **Conceptual Analysis**    | 7 (for MT), 2 (for PT) | Best at (3) convergence and (1) lack of counterexamples (as definitional). Handles (7) only if MT/PT split. | Fails (4) falsifiability and (6) exotic machines (dismisses them as incoherent). Struggles with (2) PT’s empirical basis. |
  | **Empirical Hypothesis**   | 6 (for PT), 3 (for MT) | Best at (4) falsifiability, (6) exotic machines (as empirical limits), and (5) physical derivations. | Fails (1) lack of counterexamples (why none *ever*?) and (3) convergence (treated as coincidence). Undermines (7) if PT is contingent. |
  | **Stipulative Definition** | 4           | Avoids epistemic problems by fiat.                                        | Explains *nothing*: fails (1), (3), (4), (6), (7). Reduces CT to a convention. |

  ### Can the Families Jointly Meet All Desiderata?
  **No**—each fails at least two non-negotiables:  
  - Conceptual analysis fails falsifiability (4) and PT (2,5,6).  
  - Empirical hypothesis fails to explain lack of counterexamples (1) and convergence (3).  
  - Stipulative definition fails nearly everything.  
  **Hybrid accounts** (e.g., MT conceptual + PT empirical) are common but must address:  
  - *The linkage problem*: Why should the physical universe respect a conceptual analysis of "effectiveness"?  
  - *The counterexample problem*: A PT counterexample (e.g., a physical hypercomputer) might not threaten MT, but could redefine "computability."  

  ### Your Purpose: Can CT Be Overturned by Evidence?
  - **MT (mathematical thesis)**: No. As conceptual analysis/stipulation, it’s true by definition.  
  - **PT (physical thesis)**: Yes, in principle (e.g., discovery of non-algorithmic physical computation). But any "counterexample" must:  
    - Be physically realizable *without* relying on vague/oracular resources.  
    - Avoid circularity (e.g., not presuppose a new notion of "algorithm").  
    This is why (4) and (6) are critical—*feasible* falsification remains contentious.  

  **Recommendation**: Pursue a hybrid view where MT is analytic/stipulative and PT is empirical, but rigorously argue how physical derivations (desideratum 5) bridge them. This salvages falsifiability for PT while explaining MT’s resilience.
