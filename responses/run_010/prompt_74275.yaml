  We are writing a sales page for "The Geometric Life," a self-optimization program based on Kelly-betting logic. The piece must be deadpan and have the following structure:
   - Hero copy (an engaging introduction)
   - The Protocol (numbered rules)
   - A Sample Week
   - Two testimonials
   - A three-question FAQ
   - Fine print

   The first half should be technically correct, explaining the Kelly criterion for repeated gambles. The example given: a coin that pays +60% or -40% with an expected return of 10% per round, but if you bet 100% each time, your bankroll shrinks by about 2% per round. We must stress that ruin is absorbing and that when uncertain about the odds, you bet a fraction of the Kelly fraction.

   Then, the turn: the protagonist applies this logic to one-off life events (like driving, having children, etc.) and avoids any gamble with a non-zero chance of ruin. He runs half-Kelly on friendships because estimates are noisy. There's a premium tier that uses leverage, and the testimonials should hint at the dark side. The FAQ should reveal that he has a family trust as the risk-free leg.

   Rules:
   - Every number must compute correctly (so the reader with a calculator gets the same result).
   - The phrase "Kelly criterion" appears exactly once (in the fine print).
   - The humor comes from consistency, not stupidity.
   - The last line should be a plain detail that allows the reader to perform the reductio.

   Let's break down the structure:

   1. Hero Copy: Introduce "The Geometric Life" as the ultimate system for life optimization. Deadpan, serious tone.

   2. The Protocol: A set of numbered rules (around 5-7) that outline the system. These must be:
      a. Correct for financial repeated bets.
      b. Then extend to life decisions in a way that is consistent but absurd.

   3. Sample Week: A week in the life of a user, showing how they apply the rules.

   4. Testimonials: Two fake testimonials. One might be from someone who is extremely successful (but perhaps isolated), and another that hints at the downside.

   5. FAQ: Three questions and answers. The last one should reveal the family trust.

   6. Fine Print: Include the term "Kelly criterion" once and other disclaimers.

   Word count: 700-800 words.

   Example calculation for the coin flip:
     - Expected return (arithmetic mean) = (0.5 * 0.6) + (0.5 * (-0.4)) = 0.3 - 0.2 = 0.1 (10%)
     - But if you bet 100% each time, the geometric growth rate is:
          (1.6 * 0.6)^(0.5) = (0.96)^(0.5) ≈ 0.98 -> so about a 2% loss per round.
     - The Kelly fraction for this bet: 
          f = (bp - q) / b 
          where b is the net odds (0.6 / 0.4 = 1.5? Actually, note: in the example, the payoff is 60% of the bet, so if you bet 1 unit, you either get 1.6 or 0.6. So the net odds b is 0.6 (since you get 1.6 including stake) but actually we need to express in terms of net gain. 
          Standard Kelly: if you win, you get b times the stake (so if you bet and win, you get 1+b; if you lose, you lose the stake). 
          Here: win: 1 + 0.6 = 1.6, lose: 1 - 0.4 = 0.6. So net odds b = 0.6? Actually, note: the net gain when winning is 60% and when losing you lose 40%. So b = 0.6 (the net gain per unit bet) and the probability of win p=0.5, q=0.5.
          f = (bp - q) / b = (0.6 * 0.5 - 0.5) / 0.6 = (0.3 - 0.5) / 0.6 = (-0.2)/0.6 ≈ -0.333? 
          That doesn't make sense because the expected value is positive.

   Let me recast: the standard formula for a bet that pays b to 1 (meaning you get b times your bet if you win, and lose the bet if you lose) and win probability p, the Kelly fraction is:
          f = (bp - q) / b   [where q=1-p]

   But note: in this case, the bet does not pay b to 1. It pays 60% meaning if you bet $1, you get $1.60 back (so net gain $0.60). This is equivalent to b = 0.6 (since you get 0.6 in net winnings for each dollar). And if you lose, you lose $0.40 (so you get back $0.60). So the net gain in the loss case is -0.4.

   However, the standard Kelly formula assumes that when you lose, you lose the entire amount bet? No, actually the standard formula is for a bet where you win b times the stake (so you get back 1+b) and if you lose, you lose the stake (so you get back 0). But this bet is different: you get 1.6 on win (so net gain 0.6) and 0.6 on loss (so net gain -0.4). This is a multiplicative bet with two outcomes: 1.6 and 0.6.

   The growth rate is maximized by maximizing the expected log return. So we want to maximize:
          p * log(1 + f*b_win) + (1-p) * log(1 + f*b_loss)
   But note: in this case, the return in the win case is +0.6 (so 1+0.6f) and in the loss case is -0.4 (so 1 - 0.4f). Actually, if we let f be the fraction of bankroll bet, then:
          new bankroll = bankroll * [ 1 + 0.6f ] with prob 0.5
          new bankroll = bankroll * [ 1 - 0.4f ] with prob 0.5

   We maximize: 0.5 * log(1+0.6f) + 0.5 * log(1-0.4f)

   Taking derivative and setting to zero:
          (0.5 * 0.6)/(1+0.6f) - (0.5 * 0.4)/(1-0.4f) = 0
          => 0.6/(1+0.6f) = 0.4/(1-0.4f)
          => 0.6*(1-0.4f) = 0.4*(1+0.6f)
          => 0.6 - 0.24f = 0.4 + 0.24f
          => 0.6 - 0.4 = 0.24f + 0.24f
          => 0.2 = 0.48f
          => f = 0.2 / 0.48 ≈ 0.4167

   So the optimal fraction is about 41.67%. Then the expected growth rate is:
          0.5 * log(1+0.6*0.4167) + 0.5 * log(1-0.4*0.4167)
          = 0.5 * log(1.25) + 0.5 * log(0.8333)
          = 0.5*(0.22314) + 0.5*(-0.18232) = 0.11157 - 0.09116 = 0.02041 per round (so about 2.04% growth)

   So we'll use that.

   Now, let's write the piece.
