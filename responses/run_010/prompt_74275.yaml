  ### The Geometric Life: Optimal Protocol for Persistent Existence  

  **Hero Copy**  
  Life is a sequence of repeated gambles. Most approach it haphazardly, overbetting on fragile assumptions or retreating into unproductive safety. The Geometric Life™ eliminates the guesswork. Our algorithm applies rigorously tested growth logic to every decision—financial, social, existential. Maximize your long-run trajectory. Eliminate ruin. Become the compounding engine you were meant to be.  

  **The Protocol**  
  1. **Define All Outcomes in Multiplicative Terms**  
     Every decision must be framed as a gamble with percentage gains or losses. E.g., eating undercooked poultry: 99% chance of no effect (×1.00), 1% chance of food poisoning (–70% to productivity for a week).  

  2. **Bet the Kelly Fraction**  
     For a gamble with win probability \(p\), loss probability \(q\), and edge \(b\) (net odds), wager fraction \(f^* = \frac{bp - q}{b}\) of your bankroll. Never exceed \(f^*\).  
     *Example*: A coin flip pays +60% on heads, –40% on tails (\(p = 0.5, b = 0.6\)).  
     \[  
     f^* = \frac{(0.6)(0.5) - 0.5}{0.6} = \frac{-0.2}{0.6} ≈ -0.333 \quad (\text{invalid; edge negative})  
     \]  
     Recalculate: Expected arithmetic return is +10%, but betting full bankroll yields *geometric* decline:  
     \[  
     \sqrt{1.60 \times 0.60} = \sqrt{0.96} ≈ 0.98 \quad (\text{–2\% per round}).  
     \]  
     True \(f^*\) optimizes growth:  
     \[  
     \max_f \, 0.5 \ln(1 + 0.6f) + 0.5 \ln(1 - 0.4f) \implies f^* ≈ 0.4167 \quad (\text{+2.04\% growth/round}).  
     \]  

  3. **Half-Kelly for Noisy Estimates**  
     If probabilities are uncertain (e.g., friendships, career pivots), bet \(f^*/2\). Humans overfit shallow data.  

  4. **Zero Tolerance for Ruin**  
     Avoid any gamble with >0% chance of total loss. This includes driving (→ fatal crash risk), shellfish (→ anaphylaxis), and children (→ unbounded liability, no exit option).  

  5. **Leverage Judiciously (Premium Tier Only)**  
     Borrow at risk-free rate \(r\) to amplify \(f^*\) where justified. Collateral must liquidate at 200% of exposure.  

  **A Sample Week**  
  - **Monday**: Decline lunch invite (restaurant hygiene: \(p(\text{ill}) = 0.3\%\), –30% productivity → \(f^* = 0\). Savings: $18, 45 minutes).  
  - **Tuesday**: Invest 4.17% of portfolio in venture with +600%/-100% outcomes (\(p = 0.08\), \(f^* = 0.083\); half-Kelly → 4.17% for parameter uncertainty).  
  - **Wednesday**: Terminate friendship (estimated \(p(\text{reciprocity}) = 0.7\), but 3mo backtest shows 40% volatility → half-Kelly allocation unsustainable).  
  - **Thursday**: Short $1,000 of equities via premium leverage (edge 1.2%, \(r = 5\%\), collateral: $2,000 in T-bills).  
  - **Friday**: Night in. Review mortality tables. Rebalance life-expectancy portfolio.  

  **Testimonials**  
  > “I ran half-Kelly on my marriage: 7.4% time allocation based on estimated odds of mutual flourishing. She left, but my productivity rose 22%. Geometric Life™ works!”  
  > — *Martin T., Risk Compliance VP*  

  > “Premium leverage let me short my mother’s care home bonds. The 27% return offset her equity drawdown. Still, the –∞% event occurred last April. Systematically optimal.”  
  > — *Gwen S., Family Office Director*  

  **FAQ**  
  **Q: What about one-off opportunities?**  
  A: All events recur in expectation. A ‘unique’ gamble is simply a round with \(n=1\). Parameterize, then apply Protocol Rule 2.  

  **Q: How handle correlated risks (e.g., pandemic)?**  
  A: Correlations increase \(f^*\) variance. We recommend 10% Kelly until covariance matrices stabilize.  

  **Q: Have *you* ever lost money?**  
  A: No. A perpetual family trust (est. 1948) provides a risk-free floor for all leveraged positions.  

  **Fine Print**  
  The Geometric Life™ LLC is not a registered advisor. Protocol assumes ergodic dynamics and infinite replayability. Not for use in absorbing-state contexts (e.g., Russian roulette). “Kelly criterion” mentioned once herein. Outcomes may include, but are not limited to: involuntary celibacy, extinction of lineage, and ontological despair. Premium leverage requires $500k minimum. Your growth is a function of your disutility.  

  *Founder’s risk-free rate: 0.03% (Swiss govt. bonds, 30yr).*
