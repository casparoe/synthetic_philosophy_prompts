prompt: |-
  You are to act as a philosopher-economist with genuine working expertise in interactive epistemology — common knowledge, common priors, agreement and no-trade results — combined with enough feel for applied social science to know which formal niceties actually bite once you put forty real people in a room and ask them for numbers.

  Background, so that you can judge what matters. A charitable foundation has given my small institute eighteen months and two researchers — one with a measure-theoretic background in the philosophy of probability, one a survey methodologist — to produce a memo on the preconditions of 'productive' disagreement. I came at this from the forecasting side: years of prediction tournaments, calibration threads and the usual arguments about whether rationalists converge, long before the foundation came calling. The object of interest is a concrete institutional design. It is a standing citizens' assembly of forty members, drawn by lot and serving three-year terms, which deliberates a fixed list of policy questions over repeated rounds. Three features of the design strike me as philosophically load-bearing, and the memo has to say which of them genuinely threatens convergence and which are harmless:

  (1) Members revise privately, then publish a posterior rounded to the nearest five percentage points. The rounding is deliberate: it is meant to discourage false precision and to stop members having their exact figures quoted back at them in the press.

  (2) Publication is simultaneous but lagged. In each round you see everyone else's rounded figure from the previous round, never their current one, and no one announces anything else — no evidence, no arguments, only numbers.

  (3) A substantial minority — on some questions perhaps a quarter of the room — cannot supply a single number at all. They are ambiguity-averse in something like the technical sense: for a certain class of questions, mostly long-run technological risk, they will say only that some outcomes are worse than others, and refuse a point probability. The design has to accommodate them rather than score them as non-responsive.

  Now the request. I do not want a survey of the literature on agreeing to disagree, and I do not want the well-worn rationalist-community riff about how Aumann's theorem sets an ideal that mere humans systematically fall short of; I have read that many times and it does not help me allocate two researchers for eighteen months. What I want is a defended research agenda: which open questions, in and immediately around the agreement-theorem neighbourhood, most directly determine whether this assembly converges, and in what order we should prioritise them.

  Please think carefully, and do not begin with the ranking. Start with a short brainstorming section — bullet points are fine — in which you generate candidate questions, including ones I have not thought of, and say in one line each why you are keeping or discarding them. The candidates should cover, at minimum: which assumption of the theorem the rounding violates, and whether iterated announcement of coarse-grained figures can converge at all; what the one-round lag does to the iterated structure, as opposed to a design in which everyone sees current figures; whether anything like agreement is even definable when part of the room holds non-additive or incomplete beliefs, and what the right convergence target would be if not equality of posteriors; and whether the absence of a common prior across forty strangers is a real obstacle here or a red herring. Then give the ranked agenda, five to seven items, and for each: the question stated precisely enough that someone could tell whether they had answered it; why it is upstream of the other items rather than downstream of them; how tractable it is for a philosopher and a methodologist in eighteen months with no new mathematical machinery; what would count as progress (a proof, an impossibility result, a simulation, a measurable prediction about this assembly, a conceptual distinction that dissolves the problem); and what evidence or argument over the next year would move it up or down the list.

  Two further things, which matter as much as the ranking. First, name two or three questions that are fashionable or intrinsically interesting in this area and that we should nonetheless refuse to fund, and say what it is about the design that makes them irrelevant. Second, identify the single question which, if answered in the worst possible way, would make the whole assembly design indefensible: I need to know the crux the funder is implicitly betting against, and I would rather hear it now than in the final report.

  No citations, no bibliography, no reading list — I will supply those myself. Refer to named results and standard positions only where you are confident of them, and otherwise describe the argument rather than the attribution. Where you think one of my three design features has a consequence I have not anticipated, say so plainly: I would rather be corrected than reassured.
reasoning: |-
  Hmm, this is a fascinating and highly specific request about designing a citizens' assembly for productive disagreement. The user clearly has deep expertise in interactive epistemology and institutional design, and wants to avoid theoretical tangents in favor of actionable research priorities.

  First, I need to unpack the three load-bearing features: (1) rounding to 5% increments, which coarse-grains information; (2) one-round lag in publication, breaking simultaneity; and (3) inclusion of ambiguity-averse members with non-additive beliefs. The core tension is between mathematical ideals (Aumann-style agreement) and messy human implementation.

  The user's unspoken anxiety seems to be whether this entire project could fail fundamentally - not just perform suboptimally but collapse epistemically. That's why they want the "indefensible if false" crux identified upfront. I notice they're also subtly asking for permission to abandon certain research paths, hence the demand to name fashionable but irrelevant questions.

  Key epistemic pressure points:
  - Rounding might prevent convergence entirely by destroying the common knowledge conditions needed for agreement theorems. This feels like the most dangerous flaw.
  - The lag creates asynchronous belief updating, which could decouple the group's epistemic state in ways not covered by standard models.
  - Ambiguity aversion isn't just about missing data - it introduces fundamentally different belief representations that may not "play nice" with probabilistic convergence targets.

  For the brainstorming, I'll generate candidate questions then filter ruthlessly. The rounding violation of common knowledge is probably the theoretical heart, while the practical crux is whether coarse-grained updating can converge at all. The ambiguity aversion issue might be workable if we define a "good enough" convergence target like shared confidence intervals.

  The hardest trade-off is tractability: with no new math allowed, we must prioritize questions answerable through simulation or lab experiments. For instance, testing coarse-grained convergence with human subjects would be more feasible than proving a general theorem about lagged updating.

  When ranking, I'll put the rounding convergence question first because if coarse beliefs can't converge even in ideal conditions, the other features become moot. The "indefensible" crux must be that rounding prevents common knowledge of posteriors - if true, the design fails at its core purpose.

  Fashionable traps to avoid include common prior debates (less relevant for strangers) and argumentation theory (excluded by design). The researchers should resist philosophical digressions about "true rationality" and stay focused on operational convergence.
answer: |-
  ### Brainstorming: Candidate Questions & Initial Filtering  
  *(Kept: core mechanism threats; Discarded: tangential or design-compliant issues)*  

  1. **Does rounding prevent iterated convergence?**  
     *Why kept:* Violates Aumann’s common knowledge of posteriors assumption. Coarse partitions may trap beliefs in cycles/no-man’s-land.  
     *Discarded? No:* Central to whether the design can work at all.  

  2. **Does one-round lag break backward induction?**  
     *Why kept:* Lagged information turns synchronous updating into asynchronous belief revision. May cause path dependence or fragmentation.  
     *Discarded? No:* Distinct from simultaneous models; real-world precedent in Delphi studies suggests risk.  

  3. **Can ambiguity-averse members "converge" without point probabilities?**  
     *Why kept:* Non-additive beliefs (e.g., capacities) lack a natural agreement target. What replaces posterior equality?  
     *Discarded? No:* Institutional mandate forces accommodation; convergence must be redefined.  

  4. **Is common prior necessary with strangers?**  
     *Why discarded:* With repeated interaction and public data, priors may wash out (Bayer-DiTillio). Harmless if updating compensates.  

  5. **Does rounding + lag incentivize gaming?**  
     *Why discarded:* Design forbids argumentation; pure numerical response limits strategic signaling. Low tractability for 18mo.  

  6. **Can clusters form around rounding thresholds?**  
     *Why kept:* Psychological attraction to multiples of 5 may distort revision. Testable via simulation.  

  7. **Must we redefine convergence for mixed beliefs?**  
     *Why kept:* Point-probability and ambiguity-averse members need a shared target (e.g., interval overlap or qualitative consensus).  

  ---

  ### Ranked Research Agenda (5 Items)  
  *Ordered by upstream logical priority, tractability, and threat severity.*  

  1. **Question:** *Under iterated coarse-grained updating (5% bins), do beliefs converge in a synchronous model?*  
     - **Why upstream:** If rounding alone prevents convergence, lag/ambiguity become secondary.  
     - **Tractability:** High. Philosopher models bin dynamics (Markov chains over partitions); methodologist simulates with human forecasters.  
     - **Progress:** Simulation showing convergence/divergence under rounding alone (e.g., % of cases reaching consensus within bins).  
     - **Re-prioritize if:** Pilot data shows humans ignore granularity or clusters emerge predictably.  

  2. **Question:** *With lagged (asynchronous) updating and coarse partitions, does the system converge to stable clusters?*  
     - **Why upstream:** Lag compounds rounding’s effect; failure here makes ambiguity aversion moot.  
     - **Tractability:** Medium. Extend simulation to lagged updates; test with lab experiments (sequential numeric forecasts).  
     - **Progress:** Measure fragmentation (e.g., number of distinct bins with >10% membership after 5 rounds).  
     - **Re-prioritize if:** Rounding converges robustly; lag then dominates.  

  3. **Question:** *What is a viable convergence target for mixed point-probability and ambiguity-averse members?*  
     - **Why now:** Downstream of mechanics (#1–2) but essential for defining success.  
     - **Tractability:** Medium. Philosopher defines "agreement" for imprecise beliefs (e.g., shared confidence intervals); methodologist surveys ambiguity-averse subjects.  
     - **Progress:** Operational criterion (e.g., "90% of members assign >60% probability to the same event" OR "all rank outcomes identically").  
     - **Re-prioritize if:** Mechanics (#1–2) fail—then redesign needed.  

  4. **Question:** *Does psychological clustering at round numbers dominate updating?*  
     - **Why downstream:** Behavioral bias matters only if mechanics permit convergence.  
     - **Tractability:** High. Analyze existing prediction tournament data for rounding artifacts; lab experiment with/without rounding.  
     - **Progress:** Quantify excess mass at 5% intervals in real forecasts; test if it persists post-updating.  
     - **Re-prioritize if:** Early simulations show severe threshold effects.  

  5. **Question:** *Can the system tolerate >20% ambiguity-averse members without fragmentation?*  
     - **Why last:** Assumes prior questions resolved. Tests boundary conditions.  
     - **Tractability:** Low. Requires complex simulations with heterogeneous agents.  
     - **Progress:** Identify tipping points via agent-based modeling (e.g., fragmentation vs. % ambiguity-averse).  
     - **Re-prioritize if:** Early data show ambiguity-averse members mimic cautious probabilists.  

  ---

  ### Fashionable but Irrelevant Questions to Avoid  
  1. **"Do common priors exist?"**  
     - *Why refuse:* With repeated public updating, priors matter less than revision rules. Design assumes strangers; common prior debate is unresolvable empirics.  
  2. **"Does argumentation improve calibration?"**  
     - *Why refuse:* Design explicitly bars arguments (only numbers). Violates core constraint.  
  3. **"Is scoring (e.g., Brier) necessary for truth-seeking?"**  
     - *Why refuse:* Assembly has no scoring; focus is peer-updating dynamics alone.  

  ---

  ### The Crux: What Makes the Design Indefensible  
  **Question:** *Does rounding prevent common knowledge of posteriors, making iterated updating inert or divergent?*  
  - **Worst answer:** *Yes, inevitably*. If coarse partitions prevent mutual knowledge of beliefs from improving, the system cannot converge—even with rational agents. Lag exacerbates this by freezing information.  
  - **Why fatal:** The entire design relies on public numbers driving convergence. If rounding traps beliefs (e.g., oscillating between bins), the assembly becomes performative—not truth-seeking.  
  - **Funder’s implicit bet:** That coarse-grained, lagged peer disclosure nudges beliefs toward consensus *despite* violating Aumann’s conditions. If false, the core mechanism fails.  

  **Actionable insight:** Run a stripped-down simulation of #1 *immediately*. If convergence fails under rounding alone, the project risks foundational collapse.
