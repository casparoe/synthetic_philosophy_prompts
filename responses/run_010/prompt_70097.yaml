  Hmm, the user is describing a philosophical debate about Harsanyi's aggregation theorem from their economics reading group. Marcus and Ingrid have been arguing about whether this mathematical theorem actually establishes utilitarianism as an ethical framework. I need to carefully adjudicate each of their seven moves in sequence and then provide a final verdict.

  First, I should recall what Harsanyi's theorem actually states. According to the user's summary: if individual and social preferences satisfy von Neumann-Morgenstern axioms, Pareto indifference holds, and everyone shares the same subjective probability function, then the social utility function must be a positively weighted sum of individual utility functions, with weights unique up to affine transformation.

  Now let's break down their exchange point by point:

  Move 1: Marcus claims the theorem "settles" utilitarianism. He emphasizes that weights are determinate once utility functions are fixed. But I think Ingrid will have good counterarguments here - the weights might be mathematically determinate but still arbitrary in ethical terms since utility functions are only defined up to affine transformations.

  Move 2: Ingrid makes two key points. First, the affine non-uniqueness means we can't read interpersonal weights directly from the scale. Second, vNM utilities represent preferences over lotteries, not necessarily well-being. Both seem correct - the theorem gives us a representation of social preferences under uncertainty, but doesn't automatically give us ethical weights for persons.

  Move 3: Marcus pushes back, arguing the affine non-uniqueness applies to the social utility function, not the weights. He sees the weights as substantive. But Ingrid's point stands - we can rescale individual utilities arbitrarily, so the weights aren't ethically meaningful without additional constraints.

  Move 4: Ingrid correctly notes that unequal weights like u₁ + 100·u₂ satisfy the theorem too. Equality isn't derived but must be assumed via anonymity or the veil of ignorance. This seems decisive against Marcus' claim that the theorem alone gives us utilitarianism.

  Move 5: Marcus brings in Harsanyi's veil of ignorance argument to derive equal weights. But Ingrid will likely object that equiprobability is itself an ethical assumption.

  Move 6: Ingrid does exactly that - calling equiprobability "an ethical premise in probabilistic disguise." She also criticizes the common prior assumption as substantive and unrealistic. Both points have merit - the veil argument smuggles in equality through the back door, and common priors are indeed a strong restriction.

  Move 7: Marcus defends common priors as necessary to isolate value disagreements. This is reasonable as a modeling choice but doesn't address Ingrid's concern that it limits real-world applicability.

  For the final verdict: the theorem establishes a mathematical structure that's necessary but insufficient for utilitarianism. It shows social preferences must be linear in individual utilities under these axioms, but doesn't fix the weights ethically. Both make valid points - Marcus is right about the mathematical derivation but wrong to call it utilitarianism straightaway; Ingrid is right about the ethical gaps but underappreciates how the theorem constrains possibilities.

  What both miss is that vNM utilities might not correspond to well-being at all - the theorem is preference-based, not welfare-based. Also, Pareto indifference is stronger than it appears, potentially conflicting with equity concerns. The theorem gives us a powerful formal structure but leaves key ethical questions open.
answer: |-
  ### Adjudication of Moves

  **Move 1 (Marcus):** *Largely wrong*.  
  Marcus is correct that the theorem *derives* aggregation from axioms and that weights are determinate *relative to fixed individual utility functions*. However, he overstates the "determinate fact" about weights. The uniqueness clause only ensures weights are fixed *once individual utility scales are chosen*—but since each individual’s vNM utility is unique only up to affine transformation (zero and unit arbitrary), the *absolute* weights (e.g., 1 vs. 100) are not ethically meaningful. The theorem does not resolve interpersonal comparability; it presupposes a choice of scales. This confuses mathematical determinacy (given scales) with ethical determinacy (what scales *should* be).

  **Move 2 (Ingrid):** *Largely right*.  
  Ingrid correctly identifies two critical gaps:  
  - **Scale arbitrariness**: vNM utilities lack intrinsic interpersonal comparability. Rescaling individual utilities (e.g., doubling one person’s unit) changes the weights proportionally, so "relative importance" is not pinned down.  
  - **Utility ≠ well-being**: vNM utilities represent preferences over *risky prospects*, not necessarily well-being. Calling the sum "utilitarianism" requires conflating preference satisfaction with welfare.  
  *Minor flaw*: She underemphasizes that the theorem *does* constrain social preferences to a linear aggregation—a substantive result—but her core points stand.

  **Move 3 (Marcus):** *Partly right, but wrong for the right reason*.  
  Marcus rightly notes the uniqueness clause addresses non-uniqueness of the *social* utility function, not residual freedom in weights *given fixed scales*. The theorem indeed forces a specific linear form relative to chosen scales. However, he misinterprets this as "interpersonal comparability obtained rather than presupposed." The weights *depend* on arbitrary scale choices—no interpersonally comparable "utility levels" are derived. The theorem assumes, rather than solves, the comparability problem.

  **Move 4 (Ingrid):** *Clearly right*.  
  Ingrid’s rebuttal is decisive: the theorem permits any positive weights (e.g., \(u_1 + 100u_2\)), so it does *not* imply equal weighting (the ethical core of utilitarianism). Anonymity or a veil-of-ignorance argument is needed for equality, and neither is in the theorem’s axioms. Pareto indifference alone cannot distinguish between egalitarian and elitist weightings.

  **Move 5 (Marcus):** *Largely wrong*.  
  Marcus invokes Harsanyi’s veil-of-ignorance argument to derive equal weights, but this is distinct from the aggregation theorem. The veil argument *adds* ethical premises: (1) equiprobability (equal chance of being anyone), and (2) that rational self-interest behind the veil justifies averaging. Equiprobability is not derived from the theorem; it is a normative assumption. Further, the veil argument assumes identical beliefs (as Ingrid notes next), which is not ethically neutral.

  **Move 6 (Ingrid):** *Largely right*.  
  Ingrid correctly critiques the equiprobability assumption as ethical (it imposes equality) and highlights the common prior requirement. The common belief assumption *is* substantive: real-world disagreement over facts violates it, and Bayesian/Pareto axioms *force* common priors (as in Mongin’s impossibility theorems). Without identical beliefs, the theorem fails for heterogeneous populations. This is not a "harmless simplification" but a restriction that limits applicability.

  **Move 7 (Marcus):** *Partly right, but insufficient*.  
  Marcus defends the common prior as isolating value disagreements. This is valid for modeling *pure* ethical conflict under risk, and it avoids spurious unanimity (e.g., agreeing due to shared false beliefs). However, he ignores Ingrid’s point that real-world disputes blend fact and value, making the theorem’s idealization less relevant. The "conditional" nature of the theorem is defensible, but it does not resolve the ethical gaps Ingrid identifies.

  ---

  ### Verdict on the Central Question  
  **The theorem establishes a restricted version of *weighted utilitarianism* but not utilitarianism per se.**  
  - **What it establishes**: Under the axioms (vNM preferences, Pareto indifference, common beliefs), social preferences *must* be represented by a **positively weighted sum of individual vNM utilities**. This is a *linear aggregation* with cardinal weights, fixing a specific functional form.  
  - **What it does not establish**:  
    - **Equal weights (utilitarianism)**: Weights are arbitrary (per Move 4). Equality requires additional ethics (e.g., anonymity).  
    - **Interpersonally comparable welfare**: vNM utilities reflect risk attitudes, not necessarily well-being (per Move 2).  
    - **Robustness to belief disagreement**: The common prior assumption is restrictive (per Move 6).  

  **What Marcus Gets Right (and Ingrid Underappreciates):**  
  The theorem *derives* aggregation from seemingly minimal axioms (Pareto + vNM rationality), showing that *any* social preference satisfying these must be linear in individual utilities. This is a powerful constraint: it rules out non-linear aggregation (e.g., maximin) and gives cardinal content to "social utility." The weights, while scale-dependent, are not *free* parameters—they are fixed once individual scales are chosen.  

  **What Ingrid Gets Right (and Marcus Underappreciates):**  
  The theorem does not yield *ethical* utilitarianism. The weights lack normative significance without further assumptions (scale choices, equality), and vNM utilities may not measure welfare. The common prior requirement is a major limitation, not a benign idealization.  

  **What Both Miss:**  
  1. **Pareto indifference vs. equity**: Pareto indifference conflicts with equity concerns (e.g., Diamond’s critique: society might be indifferent between two prospects where individuals have symmetric outcomes, but prefer a fair lottery). The theorem assumes away such equity considerations.  
  2. **Utility as preference vs. well-being**: Neither questions whether vNM utilities *should* be interpreted as well-being. If utilities encode morally irrelevant preferences (e.g., racist tastes), aggregating them is ethically dubious.  
  3. **The scope of "prospects"**: Utilities are defined over lotteries, not final outcomes. Social welfare over deterministic states requires additional assumptions (e.g., state-wise aggregation), which the theorem does not provide.  

  **Final Judgment**:  
  Harsanyi’s theorem establishes that **rational social preferences under risk and common beliefs must be a weighted utilitarian aggregation of vNM utilities**. This is a profound *structural* result but falls short of *ethical* utilitarianism. It provides a mathematical foundation for weighted utilitarianism but leaves its normative force dependent on unresolved ethical premises: interpersonal comparability, equal weighting, and the welfare interpretation of preferences. The dispute stems from conflating mathematical representation with ethical justification—Marcus sees the form as sufficient; Ingrid demands normative grounding. Both are partially correct, but Ingrid’s caution is better founded: the theorem is a tool, not a proof of utilitarianism.
