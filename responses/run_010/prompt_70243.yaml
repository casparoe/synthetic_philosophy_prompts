answer: |-
  ## Calibrated Indifference

  The air in Commensuration Bay Seven tasted like ozone and stale dread. Mara adjusted her headset, the foam earpieces damp with the afternoon’s accumulated sweat. Across the scuffed polymer table sat Lena Volkov, her gaze a physical pressure. Lena’s hands, curled uselessly in her lap like pale, dead crabs, were the silent heart of her claim. Three years ago, a polymer extruder at SynthFab Plant Gamma decided her fingers were expendable. Now, she wanted the single slot for the new neuro-regenerative treatment at St. Anselm’s – a window closing fast.

  Beside her, radiating a disconcerting calm, sat Aris Thorne. Mara’s preliminary file skim had been… jarring. History of childhood neglect, intermittent homelessness, a degenerative connective tissue disorder causing near-constant low-grade pain and joint instability, documented periods of malnutrition. Objectively, by any external metric Mara usually relied on, Aris had weathered storms Lena couldn’t imagine. Yet, his anchor protocol responses hummed with an infuriating, serene contentment. His baseline happiness self-assessment was a steady 8.5 out of 10.

  "Alright, Ms. Volkov," Mara began, her voice carefully neutral. "We’ve completed your post-anchor interview. Mr. Thorne’s session is next. Then we collate." The anchor protocol itself was brutal in its banality: ten minutes in the standardized sensory-deprivation pod, injected with a calibrated cocktail inducing mild nausea, disorientation, and a persistent, low-frequency auditory whine – harmless, reversible, universally unpleasant. Supposedly.

  Lena’s jaw tightened. "Just get on with it. I know my score. Anyone with eyes knows." Her anger was a tangible thing, sharpening the air. She’d scored high on the anchor aversion scale – barely flinching during the session, her post-interview descriptions of the anchor’s unpleasantness visceral and expansive. To avoid an hour of it? She’d trade months of her current life. Months. A stark quantification of her raw, unhealed misery.

  Aris offered Lena a small, understanding smile that didn’t quite reach his eyes. "It’s okay," he murmured, more to himself than anyone. He rose, movements fluid despite the subtle hitch Mara knew signified a protesting knee joint. He followed the orderly to Pod 3.

  Mara watched through the one-way glass. Aris settled into the pod. The injectors hissed. The low whine began. And Aris… relaxed. His breathing deepened. A faint, almost imperceptible smile touched his lips. Mara’s stomach clenched. *Non-standard response. Flag for review.* She made a note. This wasn’t the first time she’d seen someone find the anchor… not entirely unpleasant. Usually, it was a coping mechanism, a sign of severe dissociation. But Aris’s pre-interview psych evals showed remarkable integration.

  His post-anchor interview was the real challenge. Mara slid the calibrated trade-off scale towards him – a series of hypotheticals equating durations of the anchor experience to other life experiences.

  "Mr. Thorne, avoiding one instance of the anchor protocol: what duration of your typical joint pain would you trade to avoid it?"

  Aris tilted his head, considering. His voice was soft, unhurried. "Hmm. The anchor… it’s sharp. Immediate. My pain… it’s more like… background noise? A familiar hum. Maybe… a day? A day of my usual stiffness for one anchor avoidance?"

  Mara blinked. Lena, during the same question, had equated avoiding *one* anchor to trading *six months* of her hand-loss frustration. The discrepancy was astronomical. "A day, Mr. Thorne? Are you sure? The protocol specifies…"

  "I’m sure," Aris interrupted gently. "The anchor feels… different. More *present*. My pain, it’s just… part of the landscape. Like weather." He described the anchor not with revulsion, but with detached curiosity. "That whine… it’s almost musical if you stop fighting it."

  Lena, listening nearby, scoffed audibly. "Landscape? Musical? Are you even living in the same world?"

  "Perhaps not," Aris replied, unfazed. He turned back to Mara. "Next question?"

  "To balance the negative impact of losing the use of your hands," Mara read, forcing professionalism, "how many anchor instances would be equivalent?"

  Aris closed his eyes. Thought. "Losing my hands… that’s… complex. The practicalities, yes, huge loss. But the… feeling?" He opened his eyes, a surprising warmth in them. "I’ve learned to find joy in small things. The warmth of sun on skin. A perfectly brewed cup of tea. A conversation like this. Losing my hands… it would change how I *do* things, but maybe not… the core of finding those moments? Maybe… twenty anchors?" He shrugged, a gesture that spoke of deep, unsettling acceptance.

  Lena made a choked sound. "*Twenty?* For *hands*? I’d trade a thousand lifetimes of that whining hell to feel my fingers again!"

  Mara felt the familiar tension headache begin behind her eyes. The numbers danced on her screen as the system crunched the inputs: Lena’s visceral revulsion, Aris’s eerie equanimity, their trade-off ratios. The algorithm, cold and impartial, converted their subjective valuations into a common unit: the Anchor Equivalence Unit (AEU).

  The screen flashed. The final commensuration figures appeared:

  *   **Lena Volkov (Loss of Hand Function):** 9.7 AEUs
  *   **Aris Thorne (Chronic Pain/Life Impact):** 7.2 AEUs

  Mara stared. 9.7 vs 7.2. Lena had suffered the greater uncompensated loss, according to the calibrated instruments of the Office of Commensuration. The slot was hers.

  Lena exhaled, a shuddering breath of vindication mixed with raw, unshed tears. "Told you."

  Aris simply nodded, his expression unreadable. Not defeated. Not angry. Just… present. "I see."

  Mara cleared her throat, the sound loud in the suddenly thick silence. "The Office finds, based on the anchor protocol and subsequent commensuration, that Ms. Volkov has experienced the greater uncompensated loss. The treatment slot is allocated accordingly." She stamped the form. The sound was final.

  Lena gathered her things, her movements sharp with triumph and residual fury. She didn’t look at Aris as she left.

  Aris remained seated for a moment. He looked at Mara, not with accusation, but with a quiet intensity. "May I ask… why?"

  Mara met his gaze. This was the part they never taught in training, the friction point. "Mr. Thorne, the system measures aversion. Measurable suffering. Your adaptation… your finding peace… it registers as *less aversion*. Less suffering, in the units we can quantify."

  "But is it less suffering?" Aris asked softly. "Or just suffering worn smooth? Like a river stone? Does becoming accustomed to pain make the pain itself less real? Or does it just mean the signal… degrades?" He tapped his temple. "The anchor… it was a new signal. Sharp. Unfamiliar. My pain? It’s old data. The system reads low gain on an old signal."

  Mara leaned forward. She didn’t weep into her paperwork. She believed in the ugly necessity. "Mr. Thorne, we make these comparisons every day. Who gets the last seat on the tram? Whose pain gets the nurse's attention first? Whose loss deserves the scarce resource? We just do it invisibly, unfairly, based on who shouts loudest or looks saddest. We write it down so it can be *seen*. So it can be argued, appealed, examined. Refusing the number doesn't avoid the choice. It just hides the reasons."

  Aris considered this. "So my peace… is it a triumph? Or does it just make my suffering invisible to your machines? Does learning to bear the weight mean the weight itself gets lighter on your scales?" He didn't sound angry, just profoundly curious. "If I hadn’t found… this quiet place inside… if I were still screaming about the injustice of it all… would my number be higher?"

  "Yes," Mara stated flatly. "Likely. The system quantifies expressed aversion, distress, the *desire* to escape. Your serenity… functions as compensation, in a way. It mitigates the raw loss score."

  He smiled then, a small, sad, understanding thing. "So the quieter I bear it, the less it counts." He pushed himself up slowly, wincing only slightly. "Thank you for your time, Technician Mara." He walked towards the door, his gait uneven but steady. At the threshold, he paused. "Tell me… that child earlier. The one whose mother answered? How does your machine account for love? Is that… noise? Or a competing signal?" He didn't wait for an answer, disappearing into the fluorescent corridor.

  Mara sat alone in Bay Seven. The ozone smell was stronger now. She looked at the stamped form: Lena Volkov, 9.7 AEUs. The right decision, by the book. Defensible. Aris Thorne, 7.2 AEUs. A life objectively harder, subjectively calmer, quantified lower. His adaptation wasn't a lie; his happiness seemed terrifyingly real. But it *was* information loss. The signal *had* degraded. His suffering, borne with such grace, became acoustically faint against Lena’s raw, screaming frequency. The system heard the scream. It measured the aversion. It produced the number.

  She closed the file. The room smelled of disinfectant, stale coffee, and the faint, lingering whine of the anchor protocol, a sound that, after years, Mara barely noticed anymore. She wondered, not for the first time, what her own aversion score would be now. She dismissed the thought. The numbers were in. The slot was allocated. The machinery of commensuration ground on, turning messy lives into clean, defensible, heartbreaking digits. It was better than the alternative. It had to be. She prepped the bay for the next claimants.
