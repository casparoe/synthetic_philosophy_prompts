prompt: |-
  I am drafting the theoretical section of a paper on what it takes to say that a trained neural network represents something, and before I engage any of the existing accounts I want the specification. State the desiderata: what an account of representation-attribution must deliver to count as adequate — the phenomena it has to explain, the cases it has to get right, the distinctions it must not collapse, and the background facts about how these systems actually behave that it cannot contradict. For each requirement, give the case or consideration that motivates it, and mark it either non-negotiable or a preference belonging to a particular camp (feature-level locality, linearity, discreteness, human-legible content, and so forth).

  Fix the purpose as follows, since I take adequacy to be relative to it: the account must be good enough to license inferences from a claim of the form the model represents that p to predictions and interventions concerning the model's behavior — the standard I would be willing to defend to a skeptical external auditor, not merely to a colleague.

  To keep the exercise from drifting into generality, here is the sort of result I want the list to be able to adjudicate. In a 7B model fine-tuned on multilingual geographic question-answering, a probe trained on residual-stream activations at layer 14 recovers a binary feature we would gloss as is-in-France at roughly 96 percent balanced accuracy, and the recovered direction is stable across three unrelated prompt templates. Three further findings complicate the picture. First, zeroing the component of the residual stream along that direction leaves next-token behavior statistically indistinguishable from baseline on the evaluation set. Second, adding a synthetically constructed vector along the same direction to the residual stream reliably flips the model's answers on a held-out set of questions it had previously answered correctly. Third, the direction is not monosemantic: a sparse autoencoder trained at the same layer resolves it into several components that co-activate, and ablating any one of them individually reproduces the first finding while leaving the second partly intact.

  I am not asking for a verdict on this case, though you should say what verdicts an adequate account is obliged to deliver here and why. I want the list of requirements that would license a verdict, and the reasons each belongs on it. In particular, address the following. Which of the following are genuine desiderata and which are load-bearing assumptions of one research program: that representations be identifiable with directions or subspaces; that they be causally necessary for the behaviors they explain; that they be causally sufficient for those behaviors; that an account be complete rather than merely local; that attributed content be something a human could state; that the account survive changes of prompt, template, and fine-tuning data. Which distinctions must the account keep apart — presence of information in activations versus use of that information, content versus vehicle, a feature versus a direction, decodability versus functional role, representing-that versus representing-as — and which collapses are fatal versus merely inelegant.

  Flag any subset of the requirements you believe cannot be jointly satisfied. My own suspicion is that causal necessity, causal sufficiency, and identifiability with localized features cannot all hold once superposition and redundancy are on the table, and the case above is meant to press exactly that; but I want to know whether the suspicion is correct, or whether one of the three can be weakened without the account ceasing to serve the purpose stated above. Then identify the single requirement that does the most to exclude candidates, and say which contenders it excludes and how.

  Finally, briefly and without turning this into a survey: how do interventionist accounts that tie representation to the results of activation-level manipulations, informational or teleological accounts that tie it to what a component carries or was selected for, and deflationary accounts on which representation talk is a useful fiction about weight-level functions fare against the list. A paragraph each is plenty; the thinking should be in the requirements.
reasoning: |-
  We are constructing a list of desiderata for an account of representation-attribution in neural networks. The purpose is to license inferences from "the model represents that p" to predictions and interventions about the model's behavior, meeting a high standard of defensibility.

  The desiderata are grouped by type: phenomena to explain, cases to get right, distinctions to maintain, and constraints from empirical facts. Each item is motivated and marked as non-negotiable or as a preference of a particular camp. We then address the specific case provided and the questions about desiderata vs. assumptions, distinctions, joint satisfiability, and the most excluding requirement. Finally, we briefly evaluate three types of accounts.

  ---

  **I. Desiderata for an Account of Representation-Attribution**

  **A. Phenomena to Explain (Non-Negotiables)**

  1. **Behavioral Prediction and Intervention**: The account must license inferences from representation claims to predictions about how the model will behave under various inputs and to interventions that alter behavior by manipulating the putative representation.  
     *Motivation*: The stated purpose of the account is to support such inferences. Without this, the account fails its primary function.  
     *Status*: Non-negotiable.

  2. **Robustness Across Variations**: The account must explain why representations are often stable across prompt templates, paraphrases, and other surface variations.  
     *Motivation*: In the case provided, the "is-in-France" feature is stable across three unrelated prompt templates. This is a common empirical finding (e.g., in probing and feature visualization).  
     *Status*: Non-negotiable.

  3. **Compositionality and Systematicity**: The account must explain how representations combine to produce complex behaviors (e.g., answering multi-step questions).  
     *Motivation*: Neural networks exhibit systematic generalization, implying structured representations.  
     *Status*: Non-negotiable (though the form of compositionality may be debated).

  **B. Cases to Get Right (Non-Negotiables)**

  4. **The Decodable but Non-Functional Case**: The account must handle cases where information is present in activations (decodable by a probe) but not used by the model for the task (e.g., the "is-in-France" feature that, when ablated, does not affect behavior).  
     *Motivation*: The first finding in the case: zeroing the direction leaves behavior unchanged.  
     *Status*: Non-negotiable.

  5. **The Intervention-Sensitive Case**: The account must handle cases where an intervention on activations (e.g., adding a synthetic vector) changes behavior in a way that aligns with the attributed content (e.g., flipping answers).  
     *Motivation*: The second finding: adding the vector flips answers.  
     *Status*: Non-negotiable.

  6. **The Distributed/Superposed Case**: The account must handle cases where a "monosemantic" direction decomposes into multiple components (e.g., via a sparse autoencoder) that are individually non-necessary but collectively sufficient.  
     *Motivation*: The third finding: the direction is not monosemantic; ablating one component leaves the intervention effect partly intact.  
     *Status*: Non-negotiable (given empirical evidence of superposition).

  **C. Distinctions to Maintain (Non-Negotiables)**

  7. **Information Presence vs. Use**: The account must distinguish between information merely present in activations (decodable) and information functionally used by the network.  
     *Motivation*: The decodable but non-functional case (item 4) requires this distinction. Collapsing them would misattribute representational status to unused information.

  8. **Content vs. Vehicle**: The account must distinguish the content represented (e.g., "Paris is in France") from the physical vehicle (e.g., activation vector).  
     *Motivation*: Philosophical groundwork (e.g., Fodor) and the need to avoid reification. Collapsing them leads to category errors.

  9. **Feature vs. Direction**: The account must not assume that a feature (e.g., "is-in-France") is identical to a single direction in activation space.  
     *Motivation*: The third finding shows decomposition into multiple components. Also, superposition implies that features are represented by directions in a basis that may not align with the canonical basis.

  10. **Decodability vs. Functional Role**: The account must not equate decodability by a probe with having a functional role.  
      *Motivation*: Probes can decode information not used by the model (item 4). This distinction is empirically well-supported.

  11. **Representing-That vs. Representing-As**: The account must distinguish between a representation with propositional content (e.g., that Paris is in France) and a non-propositional feature (e.g., representing Paris as having the property of being in France).  
      *Motivation*: The case describes a binary feature ("is-in-France") that might be embedded in a propositional context. The account should not conflate feature representation with propositional attitude attribution.

  **D. Constraints from Empirical Facts (Non-Negotiables)**

  12. **Superposition**: The account must be compatible with the fact that neural networks often represent more features than the dimensionality of the activation space, leading to distributed, non-orthogonal representations.  
      *Motivation*: Empirical work (e.g., Elhage et al.) and the third finding (sparse autoencoder decomposition).

  13. **Redundancy and Robustness**: The account must allow for multiple, functionally overlapping representations of the same feature (e.g., due to dropout during training).  
      *Motivation*: Neural networks are robust to ablations; the first finding (ablation leaves behavior unchanged) may be due to redundancy.

  14. **Context-Dependence**: The account must acknowledge that representations can be context-dependent (e.g., a neuron firing for "cat" in one context but not another).  
      *Motivation*: Empirical studies on polysemanticity and dynamic routing.

  **E. Preferences (Belonging to Camps)**

  15. **Feature-Level Locality**: A preference for representations being identifiable with localized directions or subspaces (e.g., for interpretability).  
      *Motivation*: Camp of mechanistic interpretability (e.g., Anthropic, Redwood Research). But non-negotiable? No: distributed representations challenge strict locality.  
      *Status*: Preference (locality camp).

  16. **Linearity**: A preference for representations being linear (e.g., directions in activation space).  
      *Motivation*: Simplifies interpretability (probing, steering). But nonlinear features exist.  
      *Status*: Preference (linearity camp).

  17. **Discreteness**: A preference for representations being discrete (e.g., binary features).  
      *Motivation*: Useful for logical reasoning models. But continuous representations are common.  
      *Status*: Preference (discrete-symbolic camp).

  18. **Human-Legible Content**: A preference for attributed content being statable in natural language.  
      *Motivation*: Aligns with human-centered explanations. But sub-symbolic representations may lack direct legibility.  
      *Status*: Preference (human-interpretability camp).

  19. **Completeness**: A preference for the account to provide a complete basis for all representations in the network.  
      *Motivation*: Desired for full interpretability. But local explanations may suffice for some purposes.  
      *Status*: Preference (completeness camp).

  ---

  **II. Specific Case Adjudication**

  The account must deliver the following verdicts for the provided case:

  - **Decodability vs. Use**: The "is-in-France" direction carries information (as shown by the probe) but is not causally necessary for the behavior (ablation does nothing). Thus, the account must not attribute representational status based solely on decodability.
    
  - **Intervention-Sensitivity**: Adding the vector flips answers, suggesting that the direction is causally sufficient for flipping the answer under the tested conditions. However, the account must not conflate sufficiency with necessity or functional role in unmanipulated contexts.

  - **Distributed Representation**: The sparse autoencoder decomposition shows that the direction is not monosemantic. The account must allow that a feature can be represented by a superposition of components, none of which is individually necessary.

  - **Non-Collapse of Information and Use**: The account must explain why the feature is decodable but unused (perhaps due to redundancy or alternative pathways).

  The account is **not** obliged to deliver:
  - That the representation is strictly localized (due to superposition).
  - That it is monosemantic (it isn't).
  - That it is necessary (it isn't).

  ---

  **III. Desiderata vs. Assumptions**

  - **Identifiability with Directions/Subspaces**: A preference (linearity camp), not a desideratum. The case shows features can be distributed.

  - **Causal Necessity**: Not required as universal. The case shows it fails (ablation does nothing). However, for a representation to be functionally relevant, it must be causally involved in some contexts (e.g., when not bypassed). *Weakened form*: The account should allow that a representation can be non-necessary due to redundancy but still be part of a sufficient set.

  - **Causal Sufficiency**: Required in some form. The intervention shows that activating the direction is sufficient to flip the answer. But note: sufficiency might be context-dependent (e.g., only when the model is answering a question about location). *Non-negotiable for interventions*.

  - **Completeness**: A preference, not required. Local explanations suffice for the purpose.

  - **Human-Legible Content**: A preference, not required. The account might attribute sub-symbolic content.

  - **Survival Across Prompts, etc.**: Non-negotiable (item 2).

  ---

  **IV. Distinctions and Collapses**

  - **Must Not Collapse (Fatal)**:
    - Information Presence vs. Use (collapses in pure informational accounts).
    - Content vs. Vehicle (collapses in reductive physicalism without intentional stance).
    - Decodability vs. Functional Role (collapses in probe-based accounts).

  - **Collapses that are Merely Inelegant**:
    - Feature vs. Direction (if the account allows distributed representations, collapsing is inelegant but not fatal).
    - Representing-That vs. Representing-As (for many engineering purposes, this distinction may not matter, but for theoretical rigor, it should be maintained).

  ---

  **V. Joint Satisfiability**

  - **Suspicion Confirmed**: Causal necessity, causal sufficiency, and strict identifiability with localized features **cannot all hold** under superposition and redundancy. The case shows:
    - The direction is not necessary (ablation does nothing).
    - It is sufficient (intervention flips answers).
    - It is not strictly localized (decomposes into components).

  - **Weakening**: Causal necessity can be weakened to **causal relevance** (being part of a sufficient set in some contexts) without losing utility. The account can still support interventions (relying on sufficiency) and predictions (relying on relevance in relevant contexts).

  ---

  **VI. Most Excluding Requirement**

  The requirement that does the most to exclude candidate accounts is:  
  **Distinguishing Information Presence vs. Use (item 7)**.  
  - It excludes:
    - Purely informational accounts (e.g., based on mutual information) that attribute representation whenever information is present.
    - Probe-based accounts that equate decodability with representation.
  - It forces the account to incorporate functional or causal criteria.

  ---

  **VII. Brief Evaluation of Account Types**

  - **Interventionist Accounts** (e.g., causal models):  
    Strong on behavioral prediction and intervention (items 1, 5, 6). They handle sufficiency and context-dependence well. Weak on distinguishing information presence vs. use (item 7) if they don't incorporate necessity conditions. They may struggle with superposition (item 12) if interventions are only applied at a coarse level.

  - **Informational or Teleological Accounts**:  
    Informational accounts (based on correlational information) fail item 7 (presence vs. use). Teleological accounts (based on evolutionary or training history) can explain why a representation is present but struggle with item 4 (decodable but non-functional features, which might be evolutionary byproducts). Both may have trouble with item 6 (distributed representations) if they assume discrete symbols.

  - **Deflationary Accounts** (representation as useful fiction):  
    May satisfy the purpose pragmatically but fail non-negotiable desiderata like item 1 (intervention licensing) by not grounding representation in causal structure. They risk collapsing content with vehicle (item 8) and presence with use (item 7).

  ---

  **Summary**: The account must explain behavioral predictions and interventions, handle key cases (including non-necessary but sufficient features and superposition), and maintain critical distinctions (especially information presence vs. use). Causal necessity must be weakened to relevance, but sufficiency and functional role are key. The presence vs. use distinction is the most excluding requirement.
answer: |-
  ### Desiderata for an Account of Representation-Attribution in Neural Networks  
  An adequate account must license inferences from "the model represents that p" to predictions and interventions about model behavior, defensible to a skeptical auditor. Below, I specify desiderata, grouped by type (phenomena, cases, distinctions, constraints), with motivations and status (non-negotiable vs. camp-specific preference). I then address your case study, desiderata vs. assumptions, joint satisfiability, and the most excluding requirement. Finally, I briefly evaluate three account types.  

  ---

  #### **I. Phenomena the Account Must Explain**  
  1. **Behavioral Robustness Across Contexts**  
     - *Motivation*: Models exhibit consistent representations across prompt templates, paraphrases, or input variations (e.g., your case: "is-in-France" direction stable across templates).  
     - *Status*: Non-negotiable. Failure contradicts empirical evidence of contextual invariance.  

  2. **Intervention-Response Discrepancy**  
     - *Motivation*: Interventions (e.g., activation editing) may alter behavior in ways decodability alone cannot predict (e.g., your case: ablation does nothing, but addition flips answers).  
     - *Status*: Non-negotiable. Accounts must explain why some information is decodable but not functionally utilized.  

  3. **Compositionality & Generalization**  
     - *Motivation*: Models combine features systematically (e.g., answering "Is Paris in France?" requires composing city/country relations).  
     - *Status*: Non-negotiable. Core to neural net capabilities.  

  ---

  #### **II. Cases the Account Must Get Right**  
  4. **Decodable but Non-Functional Features**  
     - *Motivation*: Your case: "is-in-France" is decodable (~96% accuracy) but ablation leaves behavior unchanged. Accounts must not misattribute causal power to mere information presence.  
     - *Status*: Non-negotiable. Tests the *information vs. use* distinction.  

  5. **Sufficiency-Without-Necessity Interventions**  
     - *Motivation*: Your case: Adding a synthetic vector flips answers, but ablation shows no necessity. Accounts must handle causal sufficiency without necessity (e.g., due to redundancy).  
     - *Status*: Non-negotiable. Reflects real-world model robustness.  

  6. **Non-Monosemantic Superposition**  
     - *Motivation*: Your case: The "is-in-France" direction decomposes into co-activating components. Accounts must explain distributed representations without collapsing features to single directions.  
     - *Status*: Non-negotiable. Supported by evidence of superposition.  

  ---

  #### **III. Distinctions the Account Must Not Collapse**  
  7. **Information Presence vs. Functional Use**  
     - *Motivation*: Probes can decode unused information (your case: ablation invariance). Collapsing these licenses false causal inferences.  
     - *Status*: Non-negotiable. Fatal if collapsed.  

  8. **Content vs. Vehicle**  
     - *Motivation*: "is-in-France" (content) is implemented via activation vectors (vehicle), but vehicles may be polysemantic or distributed. Collapsing reifies representations.  
     - *Status*: Non-negotiable. Fatal if collapsed (philosophical and empirical grounds).  

  9. **Feature vs. Direction/Subspace**  
     - *Motivation*: Features (semantic properties) may not map 1:1 to directions (e.g., sparse autoencoder decomposition in your case). Collapsing ignores superposition.  
     - *Status*: Non-negotiable. Fatal if collapsed.  

  10. **Decodability vs. Functional Role**  
      - *Motivation*: High probe accuracy ≠ causal role (your case). Collapsing misleads interventions.  
      - *Status*: Non-negotiable. Fatal if collapsed.  

  11. **Representing-That vs. Representing-As**  
      - *Motivation*: "Represents *that* Paris is in France" (propositional) vs. "represents Paris *as* French" (feature-based). Collapsing blurs granularity needed for behavioral predictions.  
      - *Status*: Preference (human-legibility camp). Merely inelegant if collapsed.  

  ---

  #### **IV. Constraints from Empirical Facts**  
  12. **Superposition & Polysemanticity**  
      - *Motivation*: Neurons/directions often encode multiple features (your case: sparse autoencoder decomposition). Accounts cannot assume monosemanticity.  
      - *Status*: Non-negotiable. Contradicting this invalidates the account.  

  13. **Redundancy & Robustness**  
      - *Motivation*: Models tolerate ablations (your case: zeroing components leaves behavior unchanged). Accounts must allow multiple realizations of features.  
      - *Status*: Non-negotiable.  

  14. **Context-Dependence**  
      - *Motivation*: Feature activation depends on inputs (e.g., "bank" in river vs. finance contexts). Accounts cannot assume context-independence.  
      - *Status*: Non-negotiable.  

  ---

  #### **V. Camp-Specific Preferences**  
  15. **Feature-Level Locality**  
      - *Motivation*: Identifying features with localized directions/subspaces aids interpretability.  
      - *Status*: Preference (mechanistic interpretability camp). Weakened by superposition.  

  16. **Linearity**  
      - *Motivation*: Linearity simplifies probes and interventions (e.g., your synthetic vector addition).  
      - *Status*: Preference (linear-probing camp). Nonlinear features exist.  

  17. **Causal Necessity**  
      - *Motivation*: Expected in naive causal models.  
      - *Status*: Preference (classical functionalism camp). *Must be abandoned* under redundancy.  

  18. **Causal Sufficiency**  
      - *Motivation*: Required for intervention-based explanations (e.g., your vector-flipping result).  
      - *Status*: Non-negotiable. Core to licensing interventions.  

  19. **Completeness (Global Account)**  
      - *Motivation*: Desired for exhaustive interpretability.  
      - *Status*: Preference (full-transparency camp). Local accounts suffice for purpose.  

  20. **Human-Legible Content**  
      - *Motivation*: "is-in-France" is human-legible; sub-symbolic features may not be.  
      - *Status*: Preference (cognitive-adjacency camp). Not required for behavior prediction.  

  ---

  ### **Adjudicating Your Case Study**  
  - **Verdicts Required**:  
    - The account must **deny** that "is-in-France" is a *causally necessary* feature (ablation invariance).  
    - It must **affirm** that the direction is *causally sufficient* under intervention (addition flips answers).  
    - It must **explain** the non-monosemantic decomposition (sparse autoencoder results) without reducing the feature to a single direction.  
    - It must **distinguish** information presence (probe accuracy) from functional use (ablation robustness).  
  - **Why**: Failure here implies the account cannot handle redundancy or superposition, violating constraints (12, 13) and distinctions (7, 9).  

  ---

  ### **Desiderata vs. Load-Bearing Assumptions**  
  - **Identifiability with Directions/Subspaces**: Preference (locality/linearity camps), not desideratum. Superposition violates this.  
  - **Causal Necessity**: Preference (classical functionalism), not desideratum. *Must be dropped*; your case shows it fails under redundancy.  
  - **Causal Sufficiency**: Non-negotiable desideratum. Required to license interventions (core to purpose).  
  - **Completeness**: Preference, not desideratum. Local explanations suffice for behavior prediction.  
  - **Human-Legible Content**: Preference, not desideratum. Sub-symbolic features can support interventions.  
  - **Survival Across Variations**: Non-negotiable desideratum (Phenomenon 1).  

  ---

  ### **Joint Satisfiability and Weakening**  
  - **Suspicion Confirmed**: Causal necessity, causal sufficiency, and strict identifiability with localized features **cannot jointly hold** under superposition/redundancy. Your case is a counterexample:  
    - Necessity fails (ablation does nothing),  
    - Sufficiency holds (intervention flips answers),  
    - Identifiability fails (sparse autoencoder decomposition).  
  - **Weakening Without Collapse**:  
    - **Drop strict necessity**: Replace with *causal relevance* (feature is part of a sufficient set). This preserves sufficiency and functional role.  
    - **Drop strict identifiability**: Allow distributed features (e.g., "is-in-France" as a circuit).  
    - **Retain sufficiency**: Critical for interventions (non-negotiable).  
    - *Result*: Accounts can still serve the purpose (license predictions/interventions) with causal relevance and distributed sufficiency.  

  ---

  ### **Most Excluding Requirement**  
  **Distinguishing Information Presence vs. Functional Use (Desideratum 7)**.  
  - **Why**: It excludes:  
    - *Informational accounts* (equating representation with decodability), as they cannot explain ablation invariance.  
    - *Simple probe-based accounts*, which conflate decoding accuracy with causal power.  
    - *Deflationary accounts*, if they treat "information presence" as sufficient for representation.  
  - **Effect**: Forces accounts to incorporate causal or functional criteria (e.g., intervention sufficiency, computational role). This is the gatekeeper for behavior-relevant attributions.  

  ---

  ### **Brief Evaluation of Account Types**  
  1. **Interventionist Accounts** (e.g., causal mediation analysis):  
     - *Strengths*: Nail causal sufficiency (e.g., flipping answers via activation edits). Handle distinctions 7–10 well.  
     - *Weaknesses*: Struggle with superposition (distinction 9) if they assume local features. May overemphasize sufficiency while neglecting necessity/redundancy.  

  2. **Informational/Teleological Accounts** (e.g., mutual information, evolutionary goals):  
     - *Strengths*: Explain decodability (e.g., probe accuracy) and robustness across prompts.  
     - *Weaknesses*: Collapse information presence vs. use (fatal). Teleology (e.g., "selected for") is often underspecified in neural nets and contradicts ablation cases.  

  3. **Deflationary Accounts** (e.g., "useful fiction" for weight-level functions):  
     - *Strengths*: Avoid reification of representations, aligning with weight-space behavior.  
     - *Weaknesses*: Fail to license interventions (e.g., cannot explain why adding a vector flips answers) and collapse content/vehicle (distinction 8). Risk being unfalsifiable.  

  ### **Conclusion**  
  An adequate account must explain key phenomena (robustness, intervention discrepancies), handle critical cases (non-functional decodability, sufficiency-without-necessity, superposition), and maintain distinctions (information vs. use, content vs. vehicle). Causal necessity must yield to *causal relevance* under redundancy, but sufficiency is non-negotiable. The presence-vs.-use distinction is the most excluding requirement, weeding out purely informational approaches. Interventionist accounts fare best but must adapt to distributed features; deflationary accounts fail core desiderata. Your case underscores the need to abandon necessity and locality while preserving sufficiency and functional role.
