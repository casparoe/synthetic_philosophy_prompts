  progress_makers: Array of objects. Each object has:
    - move: what move could be made
    - type: "distinction", "formal result", "empirical test", or "reframing"
    - would_it_work: "yes", "partly", "no"
    - reason: one sentence

  bottom_line: One sentence on whether it's worth the user's time.

