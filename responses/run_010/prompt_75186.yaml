  hidden_premises: Array of objects. Each object has:
    - premise: the hidden premise
    - needed_by: which camp (or both) needs it
    - status: one of "empirical in principle", "unfalsifiable", "conceptual", "disguised value judgment"
    - justification: one sentence

  my_hypothesis: Object with:
    - verdict: on the disguised-value-judgment suspicion (right, partly right, wrong)
