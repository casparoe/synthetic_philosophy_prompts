  my_hypothesis:
    verdict: "partly right"
    reason: "Your suspicion that the premise about what a civilization would simulate is a disguised value judgment is correct for key premises (like what is 'interesting' or 'worthwhile'), but not for all. Some premises are straightforwardly empirical but unfalsifiable (e.g., the number of simulations run). The camps do import their prior beliefs about value into the simulators, which is why the argument is unresolvable."

  progress_makers:
