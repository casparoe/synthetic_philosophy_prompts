prompt: |-
  I'm about two thirds of the way through a novel and I've got a character problem that I'm pretty sure is actually a philosophy problem, so I want you to think with me rather than give me craft tips.

  My protagonist runs a small rural clinic. Over the course of the book she does a run of things everyone around her calls saintly: stays through the night for patients who aren't on her list, drives two hours in bad weather to collect a medicine, turns down a fellowship that would have got her out, and about halfway through donates a kidney to a man she's met twice. My editor's note is that she's turning into a plaster saint and the book is getting preachy. He's right, and I can't fix it with surface stuff — more drinking, a foul temper, a neglected kid — because the real problem is that I haven't decided which idea about morality I'm writing her under, and it shows in the sentences.

  So here's what I want. Compare supererogation — the category of acts that are praiseworthy but not required, going beyond the call of duty — with the Kantian idea of wide or imperfect duty, where you're genuinely obliged to adopt certain ends (help others, develop yourself) but have real latitude about when, how much, and toward whom, so that you can't be pinned to any particular act yet can be faulted for never doing any. Two frameworks that look like they describe my doctor the same way and don't.

  Be substantive about it, not a glossary entry. I specifically want:

  - what each view makes the moral status of the kidney. One of them has to say she went above and beyond; the other has to say she did something good that she also could not have done and been fine. Show me how each argues for its verdict and what it has to swallow to get there.
  - what each does to her inner life. Under one she gets to feel she's done something special; under the other the whole economy of credit and admiration is supposed to evaporate. Does the wide-duty agent feel relieved, or does she feel permanently in arrears? Which one produces guilt and which produces pride, and why.
  - how each handles the case where doing the big good thing crowds out a smaller thing she actually owed — she skips three days of clinic to be with the recipient's family and a regular patient goes unmonitored. Which framework can say something went wrong, and which can only shrug that she traded one good for a better good.
  - what each implies for the people around her. Can her colleagues resent her? Can a reader think she's showing them up, and does that reaction make sense on one view and not the other?

  Then take a side. Tell me which of the two I should write her under if I want the reader's verdict on her to stay complicated instead of collapsing into admiration, and make it concrete: give me four or five lines of her interior monologue for the same moment — the first hour after the donation, in the recovery room — written once under each framework. Point out which words in each version betray which theory, because that's the part I can't see myself. And flag the places where the two frameworks actually agree so I don't overplay the contrast for drama.

  One more thing: I know there's a consequentialist line on which nothing is supererogatory at all, because there's always a further good you could have done, so duty swallows the whole category. Say briefly where that fits and whether my doctor would even register as good on it — but keep the main event as the two-way comparison.

  Don't send me to books or build me a reading list, I'm not going to read any of it this month. Just argue it out with me in the reply.
reasoning: |-
  Okay, the user is a novelist struggling with a character who's coming off as a "plaster saint." The core issue isn't craft but philosophical grounding—specifically, whether to frame the protagonist's actions through supererogation or Kantian wide duties. 

  First, I need to unpack why this matters. The user isn't just asking for definitions; they need to see how each framework shapes the character's moral psychology and the reader's perception. The kidney donation scene is their litmus test. 

  Hmm, supererogation lets the character feel heroic ("I chose this sacrifice") but risks self-congratulation. Kantian duty flattens that ("This was merely permissible") but breeds quiet dread—she’s never done enough. The clinic abandonment example is sharp: Kant can call it a failure (she neglected a concrete duty), while supererogation might excuse it as "noble trade-off." 

  User’s fear of reader admiration collapsing into simplicity is key. Supererogation invites awe; Kant makes her relentless but vaguely unsettling. The colleagues’ resentment? Kant dismisses it as their flaw; supererogation validates it as "she raised the bar too high." 

  Consequentialism? Worth mentioning as the void where every act is obligatory—she’d be failing by default. But user wants focus on the main two. 

  For the recovery room monologues: Supererogation version needs "gift," "choice," "could’ve refused"—words that smuggle in merit. Kantian version needs "should," "possible," "debt unpaid"—language of quiet obligation. 

  Agreements: Both frameworks see the act as good, not evil. Both allow latitude. But the emotional texture diverges wildly. 

  Final verdict: Kantian framing for complexity. It makes her exhaustion feel like unpaid dues, not martyrdom. The monologue should taste like unsweetened tea—no pride, just grim satisfaction. 

  User’s real request: "Make my character morally ambiguous without making her unlikeable." Philosophical rigor is their tool.
answer: |-
  Let's dissect this at the bone. Your doctor's actions aren't the problem; the *moral framework* governing her inner world and the narrative's judgment is leaking through the prose, making her feel preachy. Here's the breakdown between Supererogation (S) and Kantian Wide/Imperfect Duty (K), focusing on your kidney donation crucible:

  **1. The Kidney's Moral Status: Praise vs. Baseline Permissibility**
  *   **Supererogation (S):** This is the *paradigm* of supererogation. She went *far beyond* what duty demands. Argument: Duty prohibits harming others unnecessarily and requires basic beneficence (run the clinic). Donating an organ, especially to a near-stranger, involves significant risk/sacrifice far exceeding "basic" help. S *swallows* that such extreme sacrifices cannot be *mandated* without destroying personal agency and life projects. Verdict: Heroic, praiseworthy, above and beyond.
  *   **Kantian Wide Duty (K):** This falls squarely *within* the latitude of her general duty to promote others' happiness/ends. Argument: The Categorical Imperative (specifically, the duty of beneficence derived from the Formula of Humanity) *requires* her to adopt the happiness of others as an end. She has wide discretion on *how* to fulfill this: running the clinic *or* donating a kidney *can both be ways* of discharging the same general obligation. She *could* have chosen differently (e.g., focused solely on clinic patients) and still been "fine" (not blameworthy), *provided* she was genuinely acting on the principle of beneficence overall. Donating the kidney isn't "extra credit"; it's one permissible path within her obligatory field of action. K *swallows* that an act requiring immense sacrifice isn't morally "special" in terms of being beyond duty – it's just a particularly demanding *instance* of fulfilling a baseline obligation. Verdict: Morally good, permissible, perhaps even expected *in this specific choice*, but not "above and beyond" the call of *duty itself*.

  **2. Inner Life: Merit vs. Quiet Necessity**
  *   **S:** She *can* (and likely *will*) feel she's done something uniquely special, meritorious, and praiseworthy. This breeds **pride** (the justified kind). The "economy of credit" is alive: she gave a *gift* beyond what was owed. She may feel virtuous satisfaction. **Guilt** arises primarily if she *fails* a strict duty (e.g., harming someone) or perhaps if she *refuses* a supererogatory act she feels personally called to. The emphasis is on *elective sacrifice*.
  *   **K:** The "credit" mindset is misguided. She fulfilled a requirement, albeit in a demanding way. Feeling **pride** for "going beyond duty" would be inappropriate, even a form of moral self-indulgence. Instead, she might feel **relief** at having successfully acted on her principle, or **satisfaction** in helping. Crucially, she likely feels **permanently in arrears**. The wide duty is ongoing and boundless ("promote others' happiness"). Every fulfilled act (like the donation) is just one instance; the obligation persists infinitely. She could *always* do more for *someone*. The dominant feeling isn't pride in past acts, but quiet pressure towards future ones. **Guilt** arises not from failing a specific act, but from a *pattern* of neglecting the obligatory end itself (e.g., systematic selfishness).

  **3. Crowding Out: Trade-off vs. Failure**
  *   **S:** Skipping clinic days for the recipient is a complex trade-off. She arguably traded fulfilling a *strict* duty (care for existing patients) to perform a *supererogatory* act (extraordinary care for the recipient/family). S struggles here. It can say: "She chose a greater good over a lesser duty," potentially justifying it, OR it can say "She failed a strict duty to perform a supererogatory act," implying a wrong. S often **shrugs** or sees it as a tragic conflict where the supererogatory act might *excuse* the duty failure due to its nobility. The verdict is messy.
  *   **K:** This is clearer failure. The duty to promote happiness is wide, but *specific* commitments create *narrower*, stricter duties. By running the clinic and taking on patients, she has made specific commitments that generate perfect duties (to *them*). Failing these specific obligations to fulfill the *same general duty* (beneficence) *towards others* is a **moral failure**. She neglected a concrete obligation arising from her role and commitments. K can definitively say: **Something went wrong.** She prioritized one permissible *instance* of beneficence (helping the recipient) over a stricter, role-based duty (caring for her patient). The latitude applies to *how* she fulfills the general end, not to breaking specific promises/roles.

  **4. The Observers: Resentment & Showboating**
  *   **S:** Resentment makes perfect sense. Her colleagues operate at the level of duty. By performing supererogatory acts, she implicitly (or explicitly) raises the bar, making them look (or feel) inadequate. Admiration is natural, but so is the feeling she's "showing off" or making their dutiful actions seem lesser. She becomes a benchmark they didn't sign up for. "She makes the rest of us look bad" is a coherent reaction under S.
  *   **K:** Resentment is less justified *morally* (though psychologically understandable). She's just fulfilling the same basic duty they all share, albeit in a different, demanding way. They too *could* choose such acts within their latitude. If they resent her, it might reflect *their* discomfort with the demanding nature of the obligatory end itself, or their own failure to fully embrace it (making *them* potentially blameworthy). The idea she's "showing them up" is misplaced; she's just doing *her* duty as she sees it, within the same framework that binds them. Their resentment says more about them than her.

  **The Verdict: Kantian Wide Duty for Complexity**
  Supererogation (S) inevitably tilts towards admiration – she's a hero doing more than needed. Kantian Wide Duty (K) maintains complexity and avoids preachiness by making her relentless drive feel less like sainthood and more like a demanding, perhaps even burdensome, interpretation of an inescapable baseline obligation. She's not *better*, she's just *different* within the same moral landscape, potentially highlighting the discomfort of the obligation itself. The reader sees the cost, the potential failures (like neglecting the clinic patient), and the lack of self-congratulation, preventing collapse into simple admiration. She becomes morally intense, maybe unsettling, but not a plaster saint.

  **The Recovery Room Monologues:**

  *   **Supererogation Framework:**
      > *Pain lanced through her side, sharp and deep. But beneath it, a warm glow spread. I did it. I actually gave him part of myself. Could have walked away... no one would blame me. But I chose this. Chose life for him. It hurts like hell, but God, it feels... good. Right. Like I’ve done something truly significant, something most people wouldn’t dare. Let them call me a saint; maybe today, just for this, I earned it.*
      *   **Betraying Words:** "Could have walked away," "no one would blame me," "Chose this," "something most people wouldn’t dare," "earned it." Emphasizes choice beyond requirement, uniqueness, merit, earning praise ("saint").

  *   **Kantian Wide Duty Framework:**
      > *Pain lanced through her side, sharp and deep. Tired. So tired. But he’ll live. Had to be done. Was it the only way? No. But it was *a* way. A possible good. Could I stand by knowing it was possible and refuse? Not really. Doesn’t feel grand. Just... necessary. Like closing a chart. One thing settled. But Mrs. Jenkins needs her meds reviewed... Tom’s follow-up... So much still open. Can’t rest long.*
      *   **Betraying Words:** "Had to be done," "a way," "possible good," "Could I stand by knowing it was possible and refuse? Not really," "Doesn’t feel grand. Just... necessary," "One thing settled... So much still open." Emphasizes necessity within duty, possibility, lack of specialness ("not grand"), the ongoing obligation ("So much still open").

  **Points of Agreement (Don't Overplay):**
  1.  Both frameworks agree donating the kidney was **morally good**.
  2.  Both agree it was **not morally required** in the sense that refusing wouldn't make her *evil* or guilty of a *specific, perfect duty violation* (like breaking a promise).
  3.  Both allow for significant **latitude** in how one fulfills moral obligations regarding beneficence.
  4.  Both would likely agree that consistent refusal to help *anyone* in *any* significant way would be **morally deficient**.

  **Consequentialist Footnote:**
  The hardline consequentialist view (e.g., utilitarianism) *does* swallow supererogation. If donating the kidney produced the most net good *she could have achieved* at that moment, it was her **duty**. If there was *any* action (e.g., flying to a disaster zone, funding more effective charities) that would have produced *more* net good, then donating the kidney was actually a **moral failure**, however well-intentioned. She'd only "register as good" if she *maximized* good constantly – an impossible standard where she'd almost always be failing. This framework turns her into a perpetual failure or a calculating machine, likely stripping her of the relatable humanity you need. Stick with K for complexity.

  **Write her under Kantian Wide Duty.** Let her feel the weight of the endless obligation, the satisfaction of fulfilling it *this time*, but never the pride of going beyond. Let her neglect specific duties for the general end, creating tangible failures. Let colleagues find her exhausting, not inspiring. The complexity is in the relentless, quiet "must" behind her actions, not in the spectacle of sacrifice. The words "possible," "necessary," "one way," "should," "settled," and "still open" are your tools. Avoid "gift," "sacrifice," "above," "beyond," "earned," "praiseworthy" in her inner voice. Good luck – this is deep character work.
