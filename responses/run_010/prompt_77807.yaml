prompt: |-
  I'm in a federalism seminar this term (US, Germany, Switzerland, EU, comparing how each one allocates power) and my reading group put together an argument last Tuesday that we can't kill. It's supposed to show subsidiarity is self-undermining: that any federation taking its own subsidiarity principle seriously can't actually assign any powers to anybody. Our TA said "cute" and changed the subject, which isn't an answer.

  We stipulated two definitions first, and this is our coinage, not something we read. Call a level of government *competent* for a task when it can carry that task out for everyone the task affects. And call the *affects-all reading* the claim that the set of people a task affects fixes the scope of the task, so you can't handle a task unless you can answer to everyone it touches. Then:

  1. Subsidiarity: a task belongs to the lowest level competent to perform it.
  2. Competence requires the affects-all reading — a level is competent for a task only if it can perform it for everyone the task affects.
  3. Every task any government performs affects at least some people outside its own jurisdiction: downstream pollution, tax-base flight, migrants arriving, prices moving across a border.
  4. So no level below the top one in a federation is ever competent for anything.
  5. But the top level spills over too, since it affects foreigners, and there's no world government competent for those effects.
  6. So for any task with cross-border effects there's no competent level at all, and subsidiarity can't hand a task to a level that isn't competent for it.
  7. So the only tasks a government may perform are ones that affect nobody outside its own jurisdiction.
  8. By (3), there are essentially none. Subsidiarity honestly applied dissolves government, and every real federation is a standing violation of its own founding principle.

  We've been calling (3) through (8) the spillover regress. The part that spooked us is that it also runs downward: the same steps say a city can't do anything, then a neighborhood, then a household, and it doesn't stop at the individual either, since my choices affect strangers too. So it seems to prove there's no legitimate agency anywhere, which we're pretty sure is wrong.

  Here's my problem: I'd give up almost anything before (3). Spillovers are the only genuinely empirical thing in this whole topic and I'm confident (3) is just true, so I want to know where the slide happens instead.

  So: which numbered step do you reject, and why did that step look unobjectionable when we wrote it down? What does rejecting it cost — what can the surviving version of subsidiarity no longer explain? And make sure your repaired principle can handle the two defaults real systems actually use, where Switzerland leaves the cantons with everything the federation wasn't explicitly given, and Germany lets the federation into concurrent matters only where a federal rule is needed to keep living conditions roughly equivalent across the Länder. Finally, what does your repaired principle say about a federal floor on corporate tax rates, designed to stop the states racing the rate down?

  Answer in exactly five numbered items, one or two sentences each. No introduction, no wrap-up paragraph.
reasoning: |-
  Hmm, the user is in a federalism seminar and their reading group came up with this "spillover regress" argument showing subsidiarity undermines itself. They've outlined 8 steps in their argument that lead to the conclusion that no government can legitimately perform any tasks due to spillover effects. Their TA dismissed it as "cute" without addressing it, which wasn't helpful.

  I need to identify where their argument goes wrong. They're particularly attached to step 3 - the empirical reality of spillover effects - and want to know which step to reject. They also want me to show how a repaired principle can explain the Swiss and German approaches to federalism, and apply it to corporate tax floors.

  Looking at their argument: Step 1 defines subsidiarity as tasks belonging to the lowest competent level. Step 2 adds the "affects-all" reading that competence requires handling everyone affected. Step 3 observes spillover effects exist. Step 4 concludes only the top level could be competent. Step 5 notes even the top level creates international spillovers. Step 6 says no competent level exists. Step 7 claims only purely local tasks are permissible. Step 8 concludes this dissolves government.

  The problem seems to be with step 2's "affects-all" reading. It makes competence impossibly demanding. In reality, subsidiarity doesn't require a level to handle everyone affected globally, but rather to be the most appropriate level relative to the federation's structure. The Swiss and German systems show subsidiarity operates within their existing constitutional frameworks, not in some abstract global context.

  For corporate tax floors: Under my repaired principle, this would be justified if tax competition creates significant negative effects across states that individual states can't solve alone, making the federal level more competent to address it.

  I'll structure my response in five numbered points as requested, directly addressing which step to reject, why it seemed plausible, the cost of rejection, how Swiss/German models work, and the tax floor application.
answer: |-
  1. Reject step 2: The "affects-all reading" unrealistically demands a level handle *all* affected parties globally for competence, ignoring that subsidiarity operates within a federation's defined scope and allows levels to manage spillovers via coordination or higher intervention when strictly necessary.
  2. Step 2 seemed plausible because subsidiarity implies effectiveness, but it confuses *optimal* scale (often local) with *absolute* sufficiency; real federations accept levels as competent if they handle core impacts adequately, relying on higher levels only for residual spillovers.
  3. Rejecting step 2 costs the argument's "purity" by acknowledging subsidiarity isn't self-contained but relies on the federation's constitutional structure to address unavoidable externalities, making competence relative and practical, not absolute.
  4. The repaired principle (lowest level *within the federation* competent for core impacts, with higher intervention only for demonstrable spillovers) explains Switzerland (cantons handle most tasks unless spillovers *require* federal action) and Germany (federal concurrent power only where indispensable for equivalent living conditions, addressing Länder-level spillovers).
  5. For corporate tax floors: Federal action is justified under subsidiarity if competitive rate-cutting creates harmful spillovers (e.g., collapsed public services) that states alone cannot solve, making the federation the competent level to prevent systemic harm.
