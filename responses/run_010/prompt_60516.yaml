                Trade1: A for B and pay $1 -> current: B and $9. (gain: say positive)
                Trade2: B for C and pay $1 -> current: C and $8. (gain: positive)
                Trade3: C for A and pay $1 -> current: A and $7. 
                        This trade would be rejected by our procedure because it returns to the start set (A) and cash ($7) is less than start ($10).

              So we catch it.

            - But what if the cycle is:

                Start: A and $10.
