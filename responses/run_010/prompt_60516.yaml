  We are trying to avoid a money-pump situation where a series of trades that individually seem beneficial leads to a net loss. The classic money-pump argument assumes that:
    1. Preferences are transitive: if A is preferred to B and B to C, then A is preferred to C.
    2. Preferences are stable over time (or at least within the trading session).
    3. The trader is rational and will always choose a preferred option.

  However, in real life, preferences might change (e.g., due to endowment effect) and the future trades might not be certain.

  We design a decision procedure that a member can run on a sequence of offers. The goal is to avoid cycles that lead to net loss. The procedure must be simple enough to be done mentally during a meeting.

  Procedure:

  We assume that the member has a set of cards and assigns a monetary value (or a utility) to each card. The member also has a cash balance. Each trade involves exchanging some cards and possibly a side payment.

  Step 1: Before the meeting, the member should assign a value to every card they own and to every card they might consider trading for. This is the "reservation value" (what they think the card is worth to them). They should write these down and bring them to the meeting. (This step is done at home.)

  Step 2: At the meeting, when a trade is offered, the member should calculate the net change in the total value of their holdings (cards plus cash) that would result from the trade.

    - Let V(card) be the reservation value of a card.
    - In a trade, they might give up some cards and/or cash and receive some cards and/or cash.

    Net change = [Sum of V(received cards) + received cash] - [Sum of V(given cards) + given cash]

  Step 3: If the net change is positive (i.e., the trade increases their total value), then the trade is acceptable. If negative, then they should reject. If zero, they can decide based on other factors (like whether they like the card, etc.).

  However, this simple rule does not prevent a cycle of trades that together form a net loss. Therefore, we need to consider the sequence.

  Step 4: To avoid cycles, the member must also consider the possibility that they might trade back in the future. But since we cannot commit to future trades and the procedure must be done per trade, we need a way to account for potential cycles.

  We introduce a state variable: the starting state of the meeting (the initial set of cards and cash) and the current state. The member must remember the initial state and the current state.

  Step 5: At the beginning of the meeting, note the starting portfolio (cards and cash) and assign a starting value: V0 = sum of V(card) for all owned cards + starting cash.

  Step 6: After each trade, update the portfolio and recalculate the current total value: V_current.

