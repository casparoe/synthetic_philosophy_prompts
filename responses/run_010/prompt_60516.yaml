                     Immediate gain: V(B) + 1 - V(A). 
                     If V(B) = V(A) + 0.50, then gain=0.50 -> positive.

            But they are not certain that they will get the next trade that would complete the cycle? 

            In fact, the next trade might not happen. So they might get stuck with B and $1 extra, which is an improvement.

            However, if they do Trade1, and then later they are offered a trade that is part of a pump, they might lose.

          But our procedure would only accept Trade1 if it is positive and would not lead to a cycle that returns to A with less cash? In this case, after Trade1, they have B, not A. So it wouldn't trigger the cycle prevention.

          Then later, if they are offered Trade2: B for C and pay $2. 
                     Gain: V(C) - V(B) - 2. 
                     If V(C)=V(B)+1, then gain=-1 -> they reject.

          So they are safe.

          But the risk is that they might be offered a series of trades that are individually attractive but that might lead to a pump. However, with the procedure, they would reject any trade that has non-positive gain and any trade that would complete a cycle to the start with cash loss.

          The only risk is that they might be pumped if they accept a trade that has a positive immediate gain but that later forces them into a position where they have to accept a bad trade to avoid an even bigger loss? That's not typical.

          In summary, the procedure we have designed:

            - Requires fixed reservation values for the meeting.
            - Tracks the current set of cards and cash.
            - For each trade, calculates the immediate net change in value (using the fixed reservation values).
            - If the immediate net change is not positive, rejects.
            - If it is positive, then checks whether after the trade they would have the starting set of cards and less cash than at the start. If so, rejects.
            - Otherwise, accepts.

          This procedure will:

            - Prevent any cycle that would bring them back to the start with less cash (because the last trade in such a cycle would be rejected).
            - It will also prevent any trade that is not immediately beneficial.

          Where it might misfire:

            - It might reject a trade that is part of a beneficial sequence if the sequence does not involve returning to the start but to a different valuable state. But since we only require immediate gain, it will accept any trade that is immediately positive and doesn't complete a cycle to the start with cash loss.

            - It might allow a cycle that returns to the start with the same or more cash? That's not harmful.

            - It might allow a cycle that returns to a set they had before (not the start) with less cash. We don't track all previous sets. So we might miss a pump that involves an intermediate state.

              Example: 
