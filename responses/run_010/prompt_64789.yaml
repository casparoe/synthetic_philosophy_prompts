prompt: |-
  just started on an evals team and my tech lead keeps saying supervising an agent is like grading a math olympiad proof step by step instead of only checking the final answer. he leans on it hard: since a proof grader can check each line without being able to solve the problem themselves, grading the trajectory rather than the outcome means the overseer never has to be as capable as the thing being overseen — so process supervision is our whole scalability story, done. I'm not so sure and want to pin down exactly where it holds. Can you lay out the mapping (what plays the proof, the line of derivation, the final answer, the answer key, the grader, the fact that a line is locally checkable), then sort the disanalogies into ones that actually gut his conclusion and ones that are just surface differences, and say whether "the overseer doesn't need to be as smart as the agent" survives once they're on the table? A better analogy for process supervision would help too if you have one.

  Then give me a brief JSON summary after the prose: {"mappings": [{"source_feature": "...", "target_feature": "...", "holds": "yes" | "partly" | "no"}], "fatal_disanalogies": ["..."], "harmless_disanalogies": ["..."], "scalability_claim_survives": "yes" | "no" | "qualified", "why": "one sentence", "better_analogy": "..." or null}
reasoning: |-
  We are mapping the math olympiad proof grading analogy to AI process supervision.

  Key elements in the analogy:
  - The proof: The entire sequence of steps the AI takes to solve a problem (the trajectory).
  - A line of derivation: One step in the AI's reasoning process.
  - The final answer: The output of the AI (the outcome).
  - The answer key: The correct final answer (but note: in process supervision, we don't necessarily have the answer key for every step, but the idea is that each step can be verified independently).
  - The grader: The human (or overseer) who checks each step.
  - The fact that a line is locally checkable: Each step in the reasoning can be verified without having to solve the entire problem.

  The claim: The grader (overseer) doesn't need to be able to solve the entire problem (i.e., doesn't need to be as capable as the AI) because they can check each step locally.

  Now, let's map:

  - **source_feature: proof** -> target_feature: AI's reasoning trajectory (holds: yes)
  - **source_feature: line of derivation** -> target_feature: one step in the AI's reasoning (holds: yes)
  - **source_feature: final answer** -> target_feature: the AI's final output (holds: yes)
  - **source_feature: answer key** -> target_feature: ground truth for the final answer? But note: in process supervision, we don't necessarily have the answer key for every step. Instead, we rely on the fact that each step is locally verifiable. So the mapping for the answer key is not direct. We might say that the answer key is the set of rules or facts that allow verification of each step. (holds: partly, because in math we have clear axioms and rules, but in real-world problems, the rules might be fuzzy or unknown)
  - **source_feature: grader** -> target_feature: the overseer (human or a model) that checks each step (holds: yes)
  - **source_feature: line is locally checkable** -> target_feature: each reasoning step is independently verifiable (holds: partly? in math, yes; in real AI tasks, not always)

  Disanalogies:

  Fatal (gut the conclusion):
  1. **Local checkability is not always possible in real tasks**: In math, each step can be verified by applying known axioms and rules. But in many real-world problems, the steps may not be locally verifiable without significant domain knowledge or without understanding the broader context. For example, in planning a complex strategy, a step might only make sense in the context of the entire plan. If the overseer cannot understand the context, they cannot verify the step.

  2. **Ambiguity in intermediate steps**: In math, the steps are well-defined and unambiguous. But in natural language reasoning, a step might be vague, underspecified, or open to interpretation. The overseer might not be able to verify without filling in gaps, which requires intelligence.

  3. **Error propagation**: In math, an error in one step makes the rest of the proof wrong. But if the overseer misses an error in an early step, they might approve a chain of reasoning that is flawed. However, the analogy doesn't require catching every error? But if the overseer is not capable, they might miss subtle errors.

  4. **Lack of clear axioms**: The overseer might not have a clear set of rules to check against. In math, the rules are clear. In open-ended problems (e.g., ethical reasoning), what are the rules?

  Harmless (surface differences):
  1. **The medium**: Math is formal, AI reasoning is often in natural language. But this is just a representation difference and doesn't necessarily break the core idea.
  2. **The grader is human vs. model**: The analogy works regardless of whether the grader is human or a model, as long as the grader can check steps locally.

  But note: the claim that the overseer doesn't need to be as smart as the agent relies on the local checkability. If local checkability fails, then the overseer might need to understand the entire problem to verify a step, which requires being as smart or smarter.

  Thus, the scalability claim (that the overseer never has to be as capable as the agent) survives only in domains where every step is locally verifiable without requiring the same level of intelligence as generating the step. In complex, ambiguous, or highly contextual domains, the claim may not hold.

  Better analogy: 
  We might think of it as a factory assembly line. Each worker (overseer) checks one part of the product (one step) without needing to know how to build the entire product. But note: the worker must be able to check the part against a specification. The problem in AI is that we don't always have clear specifications for every step.

  Alternatively, consider a computer program: we can verify each line of code by checking syntax, simple invariants, or running unit tests. But again, for complex logic, unit tests might not be enough and we might need integration tests (which require more context). So the analogy isn't perfect.

  A better analogy might be **proofs in formal verification**. In formal verification, each step is checked by a proof assistant (like Coq) using a set of predefined rules. The proof assistant doesn't "understand" the entire proof, but it can verify each step mechanically. However, this requires the proof to be broken down into steps that are within the system's rules. The disanalogy is that in AI, we are dealing with natural language and not formal systems.

  Given the above, the scalability claim survives in a qualified way: it holds for tasks that can be broken down into locally verifiable steps (like math) but not for tasks that require holistic understanding.

