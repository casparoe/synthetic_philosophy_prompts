answer: |-
  ### Decision Tree: What Do You *Actually* Believe About Majority Accuracy?  
  *Based on your intuitions about real-world cases—not textbook ideals. Start here and follow the branches.*  

  #### Shared Premise  
  The Condorcet jury theorem holds under its textbook assumptions:  
  - Binary choice  
  - Voters more competent than a coin flip (>50% individual accuracy)  
  - Independent errors (no correlation)  
  - Sincere voting (no strategy)  
  - Fixed, identical electorate  

  ---

  ### The Tree  
  **1. LOW-COMPETENCE CROWD**  
     *A town of 1,000 residents reads the same error-filled editorial. Each has a 40% chance of answering a factual binary question correctly (independently).*  
     → **Is the majority vote more accurate than a random resident?**  
     - **Yes** → **Naive wisdom-of-crowds optimism**  
       *Most awkward commitment: Believing crowds outperform individuals even when the average voter is* worse *than a coin flip.*  
     - **No** → Go to 2.  

  **2. EPISTOCRATIC EXCLUSION**  
     *A jury pool has 50 experts (80% accuracy) and 50 novices (60% accuracy). All vote independently on a binary question.*  
     → **Is the majority vote of the full pool more accurate than the majority vote of just the experts?**  
     - **Yes** → Go to 3.  
     - **No** → **Epistocracy**  
       *Most awkward commitment: Accepting that excluding less competent voices—despite potential biases in selection—improves outcomes.*  

  **3. CORRELATED AI PANEL**  
     *100 AI models, trained on the same dataset, answer a binary question. Each is 70% accurate alone, but errors correlate due to shared training.*  
     → **Is the models’ majority vote more accurate than a single model?**  
     - **Yes** → Go to 4.  
     - **No** → **Correlated-error deflationism**  
       *Most awkward commitment: Arguing that shared data (e.g., online echo chambers) undermines democracy’s reliability.*  

  **4. THREE-OPTION REFERENDUM**  
     *A referendum has options A, B, or C. Each voter has a 60% chance of picking the correct option (independent errors; errors split evenly between the other two).*  
     → **Is the plurality winner (most votes) more accurate than a random voter?**  
     - **Yes** → Go to 5.  
     - **No** → **Binary essentialism**  
       *Most awkward commitment: Denying that majority/plurality wisdom applies to any choice beyond yes/no questions.*  

  **5. DELIBERATIVE TRADE-OFF**  
     *Jurors first vote independently: each 60% accurate (binary choice). After discussion, they vote again: errors now correlate, but each juror’s accuracy rises to 80%.*  
     → **Is the post-deliberation majority more accurate than the pre-deliberation majority?**  
     - **Yes** → **Deliberative line**  
       *Most awkward commitment: Tolerating groupthink if it boosts individual competence.*  
     - **No** → **Epistemic proceduralism**  
       *Most awkward commitment: Defending majority rule even when strategic voting or changing contexts distort its "purity."*  

  ---

  ### The Space of Beliefs  
  | Position                         | Low Competence | Correlated Errors | Non-Binary | Strategic/Deliberative | Key Commitment                          |  
  |----------------------------------|---------------|-------------------|------------|------------------------|-----------------------------------------|  
  | Naive wisdom-of-crowds optimism  | ✓             | ?                 | ?          | ?                      | Crowds beat individuals even if *worse* than random |  
  | Epistocracy                      | ✗             | ✗                 | ✗          | ✗                      | Experts-only voting beats full democracy |  
  | Correlated-error deflationism    | ✗             | ✓                 | ✗          | ✗                      | Shared biases ruin crowd wisdom         |  
  | Binary essentialism              | ✗             | ✗                 | ✓          | ✗                      | Majority rule *only* works for yes/no   |  
  | Deliberative line                | ✗             | ✗                 | ✗          | ✓                      | Trade independence for competence gains |  
  | Epistemic proceduralism          | ✗             | ✗                 | ✗          | ✗                      | Majority rule is robust despite flaws   |  

  #### Empty Corners (and Why?)  
  - **"Low competence + non-binary" optimism**: Missing. Combines incoherence (crowds worsen with <50% accuracy) and neglect (few test non-binary low-competence cases).  
  - **"Epistocracy + deliberation" hybrid**: Missing. Unfashionable—epistocrats reject deliberation’s inclusivity; deliberative theorists reject elitism.  
  - **"Non-binary deflationism"**: Missing. Incoherent—if you accept non-binary plurality, why reject it?  

  #### Indistinguishable Leaves?  
  - **Epistemic proceduralism** and **binary essentialism** *both* reject non-binary extensions (step 4). The tree separates them by step 5.  

  ---

  ### Where the Machine Learning Case Fits  
  The opening example—**sampling many answers from one model and taking the majority**—lands at **step 3 (Correlated AI Panel)**.  
  - Labs assume independence (despite shared training data), treating this as Condorcet "ported to silicon."  
  - A "yes" answer here aligns with *naive optimism* or *epistemic proceduralism*. A "no" matches *correlated-error deflationism*.  

  *Illustration: If your model’s errors correlate, Condorcet’s guarantee vanishes. But does your intuition?*
