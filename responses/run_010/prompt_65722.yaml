  ### Decision Tree for Mechanism Identity in Language Models

  **Starting Commitment:** Engineers can record activations and perform causal interventions (patching, ablation) in both baseline and suspect model runs.

  ---

  #### **Q1: Does ablating the candidate mechanism in the suspect run and patching in the *baseline* mechanism (at the same location) restore baseline behavior?**  
  - **Yes** → Proceed to Q2.  
  - **No** → Proceed to Q4.  

  #### **Q2: Does ablating the candidate mechanism in the *baseline* run and patching in the *suspect* mechanism (same location) restore baseline behavior?**  
  - **Yes** → Proceed to Q3.  
  - **No** → **Leaf: Functional Fragment**  
    - *Account: Causal-Role*  
    - *Explanation:* The mechanism fulfills the same input-output function in isolation but fails to integrate causally in the full system (e.g., downstream layers rely on implementation details).

  #### **Q3: Do interventions on *subcomponents* (e.g., neurons, attention heads) yield identical effects in both runs?**  
  - **Yes** → **Leaf: Physical Identity**  
    - *Account: Substrate/Implementation*  
    - *Explanation:* Identical neurons/wiring mediate the computation (e.g., same neurons activate for the same inputs).  
  - **No** → **Leaf: Functional Equivalence**  
    - *Account: Algorithmic*  
    - *Explanation:* The same computation is executed, but with different resources (e.g., disjoint neurons implement the same function).

  ---

  #### **Q4: Does patching the suspect mechanism into a *different layer* of the baseline model restore baseline behavior?**  
  - **Yes** → **Leaf: Shifted Implementation**  
    - *Account: Algorithmic*  
    - *Explanation:* Identical computation occurs in a different layer with adapted wiring (e.g., layer-skipping or compression).  
  - **No** → Proceed to Q5.  

  #### **Q5: Does the mechanism produce identical outputs for identical inputs *in isolation*?**  
  - **Yes** → Proceed to Q6.  
  - **No** → Proceed to Q7.  

  #### **Q6: When ablated in the suspect run, does an *unrelated backup pathway* restore normal behavior?**  
  - **Yes** → **Leaf: Backup Compensation**  
    - *Account: Causal-Role*  
    - *Explanation:* The mechanism exists but is compensated by a backup when impaired (e.g., redundancy evolved during training).  
  - **No** → **Leaf: Contextual Breakdown**  
    - *Account: Implementation*  
    - *Explanation:* The mechanism is functionally identical but fails due to changed downstream dependencies (e.g., shifted feature embeddings).

  ---

  #### **Q7: Was the suspect run generated by fine-tuning/modifying the baseline model?**  
  - **Yes** → **Leaf: Descendant Circuit**  
    - *Account: Etiological*  
    - *Explanation:* The mechanism is a drifted but lineage-continuous version (e.g., weight drift during fine-tuning).  
  - **No** → Proceed to Q8.  

  #### **Q8: Does feature analysis (e.g., sparse autoencoder) show decomposable refinements?**  
  - **Yes** → **Leaf: Refined Features**  
    - *Account: Substrate/Implementation*  
    - *Explanation:* The mechanism’s substrate is reorganized (e.g., one baseline feature splits into three).  
  - **No** → **Leaf: Novel Mechanism**  
    - *Account: Deflationary*  
    - *Explanation:* No objective identity; "sameness" is a descriptive choice (e.g., ambiguous edge cases).  

  ---

  ### Leaves Summary
  1. **Physical Identity** (Substrate): Same physical resources (neurons/wiring).  
  2. **Functional Equivalence** (Algorithmic): Same computation, different resources.  
  3. **Shifted Implementation** (Algorithmic): Same computation, different layer.  
  4. **Functional Fragment** (Causal-Role): Isolated function matches, but causal integration fails.  
  5. **Backup Compensation** (Causal-Role): Active but compensated by a backup.  
  6. **Contextual Breakdown** (Implementation): Isolated function matches, downstream mismatch.  
  7. **Descendant Circuit** (Etiological): Lineage-continuous via training/fine-tuning.  
  8. **Refined Features** (Substrate): Feature-level reorganization (e.g., splitting).  
  9. **Novel Mechanism** (Deflationary): No fact-of-the-matter; identity is descriptive.  

  ---

  ### Unoccupied Answer Combinations & Practical Constraints
  1. **Q1=Yes + Q4=Yes** (Causal-substitution works in both same *and* shifted layers):  
     - **Incoherent**: A mechanism can’t occupy multiple layers simultaneously without being distinct.  
     
  2. **Q5=Yes + Q7=No + Q8=No** (Functional match, non-descendant, no refinement):  
     - **Unexplored**: Suggests parallel evolution of identical mechanisms, but no known examples.  

  3. **Q6=Yes + Q3=Yes** (Backup exists *and* subcomponents are identical):  
     - **Unattractive**: If subcomponents are identical, backups are redundant; violates parsimony.  

  4. **Q2=No + Q5=No** (No causal integration *and* no functional match):  
     - **Covered**: Leads to **Novel Mechanism** (Q8=No) or **Refined Features** (Q8=Yes).  

  ---

  ### Indistinguishable Pairs Under Interventions
  1. **Functional Equivalence vs. Refined Features** (Q3=No vs. Q8=Yes):  
     - If feature analysis is coarse-grained, a refined mechanism (e.g., split features) may appear as merely "different resources."  

  2. **Descendant Circuit vs. Contextual Breakdown** (Q7=Yes vs. Q6=No):  
     - Weight drift (etiological) and downstream changes (implementation) can manifest identically in patching tests.  

  3. **Backup Compensation vs. Novel Mechanism** (Q6=Yes vs. Q8=No):  
     - A backup pathway may be misattributed as a novel mechanism if compensation dynamics are opaque.  

  --- 

  ### Key Insight  
  Causal interventions constrain but *underdetermine* mechanism identity. **Deflationary** accounts resolve ambiguities where engineering data is insufficient, emphasizing that "sameness" is sometimes a pragmatic choice, not an empirical fact.
