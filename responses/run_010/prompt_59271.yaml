  I need to understand their core insight. In groundwater modelling, whether someone is "affected" by a policy (like a pumping permit) depends on parameters like radius and timescale. Similarly, in democracy, the set of "affected" people isn't objective; it's constructed by the decision rules themselves. The user suspects that the infinite regress problem—where defining the demos requires a prior demos—might be resolvable by treating it mathematically as a fixed-point iteration.

  The user outlined specific requirements for the proposal: a precise question, engagement with existing positions (affected, subjected, coerced), a month-by-month method, assessment of formalism tolerance, justification for this approach over alternatives, discussion of results and failure conditions, and scope assessment.

  I should structure the proposal to meet these. For precision, I can frame the question around existence, uniqueness, and path-dependence of fixed points. The regress objection leaves this open because it assumes the iteration never stabilizes, whereas the fixed-point approach tests if it can converge. For the method, I need to balance mathematical rigor with philosophical accessibility—emphasizing conceptual proofs over heavy formalism since the user's math is self-taught and committees may prefer verbal arguments.

  Their background is a strength here. I'll highlight how their modelling experience brings a unique perspective to political theory. The alternatives (case studies or normative debates) are less suitable because this is a structural question about the logic of boundary-setting itself.

  For scope, I should include narrowing recommendations: focus on the "all affected" principle as the most parameter-sensitive criterion, and bracket issues like non-human interests or global governance. Result scenarios: success would be proving convergence under certain conditions; failure could show inherent instability. Time management is crucial—they have 18 months part-time, so the plan must be realistic with buffer months.

  The tone needs to be academic but not overly technical. I'll avoid citations per their request, using standard labels like "All Affected Principle" instead. I'll emphasize the proposal's novelty: no one has rigorously applied fixed-point theory to this problem. Finally, I'll include candid advice on navigating philosophy committees, stressing transparency about their mathematical approach.
answer: |-
  ## Dissertation Proposal: Fixed Points of Franchise: Modelling Democratic Boundary Formation as a Convergence Problem

  **Supervisor:** [Supervisor Name]
  **Candidate:** [Your Name]
  **Program:** MA Political Philosophy (Part-Time)
  **Proposed Submission Date:** [Date approx. 18 months from now]
  **Proposed Word Count:** 12,000 words

  ### 1. Research Question & Core Puzzle
  The foundational "boundary problem" of democracy asks: *How is the legitimate demos (the people entitled to participate in collective self-rule) constituted?* Prevailing normative principles offer answers: the "All Affected Principle" (AAP), the "All Subjected Principle" (ASP), or the "All Coerced Principle" (ACP). A powerful meta-objection, however, asserts an insurmountable *logical regress*: any democratic procedure used to define *who* constitutes the demos necessarily presupposes a prior demos capable of making that decision, leading to an infinite, vicious regress. This project contends that this regress objection, while highlighting a genuine difficulty, prematurely forecloses investigation. Drawing inspiration from dynamic systems modelling (specifically fixed-point iteration), it asks a novel, precise question:

  *   **Can the process of applying a franchise-defining principle (FDP) – such as AAP, ASP, or ACP – to its own output be modelled as an iterative function? If so, under what conditions does this iteration converge to a stable, unique "fixed point" demos, independent of the initial starting point (the initial enfranchised set)?**

  The core insight is that the set deemed "affected," "subjected," or "coerced" by a decision *is not a pre-political fact*, but is *itself constituted by the rules and parameters of the decision-making process*. The regress objection assumes this iteration never stabilizes. This project rigorously tests that assumption using the conceptual framework of fixed-point theory.

  ### 2. Context & Gap: Why the Regress Objection Leaves the Question Open
  Existing literature provides sophisticated arguments for and against the AAP, ASP, and ACP, and the regress objection is widely acknowledged as a significant challenge (e.g., highlighted in discussions surrounding Whelan, Goodin, Dahl, Abizadeh). However, the debate typically stalls in one of two ways:
  1.  **Normative Stalemate:** Arguments favour one principle over others based on intuitions about justice, fairness, or feasibility, without resolving the *structural* problem of self-application inherent in *any* principle.
  2.  **Regress as Impasse:** The regress objection is presented as a decisive *reductio ad absurdum*, demonstrating the logical impossibility of a democratic solution to the boundary problem. This treats the iterative process as *necessarily* vicious and divergent.

  **The Gap:** What remains unexplored is the *dynamic behaviour* of the iterative application of an FDP. The regress objection assumes perpetual divergence. This project asks whether convergence is *possible* and under what logical conditions. It treats the boundary problem not as a static puzzle demanding an impossible first step, but as a dynamic system potentially seeking equilibrium. This shifts the focus from *which principle is correct* to *how any chosen principle behaves when recursively applied*. The existing positions and the regress objection leave this specific question of *convergence potential* entirely open.

  ### 3. Methodology & Work Plan (18 months part-time)
  The project employs formal political theory, leveraging concepts from mathematics (fixed points, iteration, convergence) but emphasizing *conceptual rigor and logical argumentation* accessible to philosophers. The core method is the construction and analysis of abstract, simplified models:

  *   **Month 1-3: Foundational Framing & FDP Specification:**
      *   Precisely define the core concepts: demos, franchise, decision-procedure.
      *   Formulate formalizable interpretations of AAP, ASP, and ACP for the model. Define key parameters analogous to the groundwater model's "radius" and "timescale" (e.g., scope of "effect," intensity threshold for "coercion," temporal horizon).
      *   Define the iterative function `f`: `D_n+1 = FDP(Decision-Procedure(D_n))`. The decision-procedure using demos `D_n` defines rules/policies; applying the FDP to these rules determines who is affected/subjected/coerced *by them*, yielding the next demos `D_n+1`.

  *   **Month 4-6: Modelling the Iteration (AAP Focus):**
      *   Construct simple spatial or network models (e.g., individuals/nodes on a line/grid/network; decisions affecting neighbours within parameter-defined ranges). Start with AAP as the most intuitively parameter-dependent FDP.
      *   Define the initial `D_0` (e.g., arbitrary subset, minimal set).
      *   Analyze `D_1 = f(D_0)`, `D_2 = f(D_1)`, etc. Does the sequence `(D_n)` converge? Does it oscillate? Does it expand/contract indefinitely?
      *   Vary parameters (e.g., "effect radius") and observe impact on convergence.

  *   **Month 7-9: Fixed Point Analysis & Uniqueness:**
      *   Formalize the notion of a fixed point: `D* = f(D*)`.
      *   Investigate conditions under which fixed points exist. (Conceptual proof sketches).
      *   Investigate uniqueness: For a given parameter set, is there only one fixed point `D*`, or multiple possible stable demoi depending on `D_0` (path-dependence)?
      *   Introduce heterogeneity (e.g., varying population density, differing 'sensitivity' to effects).

  *   **Month 10-12: Extending to ASP & ACP; Stability & Sensitivity:**
      *   Adapt the model framework to ASP and ACP. How do coercion/subjection thresholds function as parameters?
      *   Compare convergence behaviour and fixed point properties across the three FDPs.
      *   Analyze stability: If `D*` is perturbed (small change), does the iteration return to `D*` or diverge?
      *   Assess sensitivity to initial conditions (`D_0`) and parameter values.

  *   **Month 13-15: Philosophical Interpretation & Implications:**
      *   What does convergence (or lack thereof) mean for the regress objection? Does convergence mitigate its viciousness? Does divergence confirm it?
      *   What does uniqueness/path-dependence imply for democratic legitimacy?
      *   Discuss the normative significance of parameters – who sets them? Is this itself democratic?
      *   Relate findings back to real-world boundary disputes (e.g., aquifer management, secession) without extensive case studies.

  *   **Month 16-18: Writing, Revision, and Synthesis.**
  *   **Buffer Months:** Integrated throughout for deeper analysis, unexpected complexities, and refinement.

  **Formalism Level:** The mathematics will be used *conceptually* and *descriptively*. Proofs will be sketched logically and verbally, focusing on necessary and sufficient conditions derived from the model's structure. Equations will illustrate relationships, but complex derivations or advanced topological proofs will be avoided. The emphasis is on *using the mathematical concept to clarify the philosophical logic*, not on mathematical virtuosity. The argument will be accessible to political philosophers comfortable with basic logic and set theory. Transparency about the simplified nature of the models and the source of the mathematical inspiration (applied modelling, not pure math) will be key.

  ### 4. Why this Approach? (vs. Alternatives)
  *   **vs. Normative Arguments for One Principle:** This project does not seek to prove AAP, ASP, or ACP "correct." It investigates a *structural property* inherent in *any* such principle when recursively applied, a question orthogonal to normative justifications. It asks *how* principles function dynamically, not *which* is best.
  *   **vs. Comparative Case Studies of Boundary Disputes:** While real-world examples (like aquifers) inspire the parameters, this project focuses on the *abstract logic* of boundary formation. Extensive empirical study is beyond scope; the value lies in modelling the underlying dynamic that generates such disputes. Cases may be used illustratively, not as primary evidence.
  *   **vs. Purely Conceptual Analysis of the Regress:** The regress is typically presented statically. This project offers a novel framework by treating it as a dynamic process amenable to analysis for convergence, potentially reframing the problem entirely.

  ### 5. Potential Results & Failure Conditions
  *   **Successful Results Could Look Like:**
      *   Demonstrating that under plausible parameter constraints (e.g., bounded "effect," locality), AAP iteration converges to a unique fixed point demos, mitigating the regress objection for that FDP in specific contexts.
      *   Showing that ASP iteration converges more robustly or to different fixed points than AAP.
      *   Identifying conditions (e.g., strong global interdependence) that lead to divergence for AAP, confirming the regress objection's force in those cases.
      *   Revealing inherent path-dependence, showing the final demos depends critically on the initial enfranchisement (`D_0`), posing a distinct legitimacy challenge.
  *   **What Would Constitute Failure?**
      *   The models proving too simplistic or arbitrary to yield philosophically meaningful insights about real boundary problems.
      *   The fixed-point framework being conclusively shown to be an illegitimate or unproductive way to model democratic boundary formation (e.g., if the iteration is deemed fundamentally mis-specified).
      *   An inability to construct non-trivial models where convergence occurs under any plausible conditions, strengthening the case for the regress as genuinely vicious.
      *   The analysis devolving into intractable mathematical complexity without yielding clear philosophical conclusions. *Note:* Demonstrating non-convergence (divergence) under certain conditions is a *valid result*, not project failure; it confirms the regress objection's power in those scenarios. Failure would be an inability to rigorously engage the question at all.

  ### 6. Scope Assessment & Recommendations
  The project ambitiously tackles three FDPs (AAP, ASP, ACP). **Strong Recommendation to Narrow Scope:** Focus primarily, at least initially, on the **All Affected Principle (AAP)**. It is:
  1.  **Most Parameter-Sensitive:** Its definition inherently relies on contestable parameters ("affected," "significantly," scope, timeframe), making it the clearest analogue to the groundwater modelling experience and most fertile ground for the fixed-point approach.
  2.  **Central to the Regress Debate:** AAP is often the primary target of the regress objection.
  3.  **Manageable:** Analyzing one FDP deeply is more feasible within the word and time limits.

  **Other Scope Boundaries:**
  *   **Focus:** Democratic boundary problem *within* a pre-existing political community (e.g., defining sub-units like water districts, or membership criteria), *not* the initial constitution of a state *ex nihilo*.
  *   **Agents:** Primarily human individuals; non-human interests or future generations introduce complexities best bracketed initially.
  *   **Geography:** Models will assume spatial relationships but won't delve into complex geopolitical histories.
  *   **Formalism:** As outlined, prioritizing conceptual clarity over mathematical depth.

  ### 7. Contribution & Significance
  This project aims to make a distinctive contribution:
  1.  **Novel Framework:** It introduces the conceptual toolkit of fixed-point iteration and convergence analysis to the democratic boundary problem, offering a fundamentally new way to model and understand the regress objection.
  2.  **Shifting the Debate:** It moves beyond the stalemate between normative principles and the regress impasse by focusing on the *dynamic behaviour* of FDPs.
  3.  **Bridging Disciplines:** It demonstrates the value of insights from applied modelling (like hydrology) for illuminating abstract political philosophical problems.
  4.  **Clarifying Stakes:** By showing whether and when convergence is possible, it clarifies the precise conditions under which the regress objection holds decisive force or can be circumvented. It also highlights the critical, often overlooked, role of parameter-setting in defining the demos.

  By rigorously investigating the convergence properties of franchise-defining principles, this project seeks to transform a seemingly vicious logical regress into a tractable problem of institutional design and dynamic stability, grounded in the practical insight that boundaries are not found, but made – and potentially stabilized – through the recursive application of rules.
