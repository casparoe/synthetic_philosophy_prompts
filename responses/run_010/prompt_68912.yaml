prompt: |-
  I am preparing the closing exercise for a graduate seminar on explanation in the historical sciences. We have spent two weeks on the question of whether "Why Britain and not China?" is a well-posed question at all, given that the contrast can be fixed at wildly different scales: Britain against the Yangtze delta around 1750; Britain against the Qing empire taken as a whole between 1400 and 1800; northwestern Europe against East Asia around the year 1000; and Eurasia against the Americas in the broader rise-of-the-West register. The claim I want the students to test is that each candidate explanation of the divergence does its real work at one of these contrasts and quietly loses most of that work at the others, so that ranking the candidates requires first fixing the explanandum.

  Please score the seven candidates below on that claim. For each, give (i) a contrast-stability score from 0.0 to 1.0, where 1.0 means the explanation retains essentially its full force across all four contrasts and 0.0 means it says something only at one of them; (ii) the single contrast at which it is best posed; and (iii) two sentences of justification, one of which must state what the explanation is committed to about when the divergence began, since a late-dating account cannot carry the weight an early-dating one is asked to carry.

  1. Coal: the depth, location, and water-borne accessibility of British seams relative to the delta's distant ones (Pomeranz).
  2. New World colonies as an ecological release: the imports of fiber, timber, sugar, and grain that freed British land from having to produce them (Pomeranz).
  3. Relative factor prices: British high wages and cheap energy rewarded labor-saving, energy-using machinery, while Chinese cheap labor and dear energy did not (Allen).
  4. The high-level equilibrium trap: a market-efficient, labor-abundant economy with no profitable margin left for mechanization (Elvin).
  5. Political fragmentation and interstate rivalry in Europe set against unified imperial governance in China, including the turn away from oceanic expansion.
  6. Credible constraints on sovereign predation after 1688–89: secure property, funded public debt, and developed capital markets (North and Weingast).
  7. The Industrial Enlightenment: useful knowledge and the coupling of natural philosophy to artisan practice (Mokyr).

  State your weighting rule for converting these into an overall ranking before you give the scores, then produce the ranking and say in one sentence per candidate why it lands where it does. Finally, identify any candidate that is in your judgment not an answer to the divergence question at all but an answer to the Needham question about where modern science arose, and explain what is lost when the two explananda are run together. No bibliography or list of sources is needed; the attributions above are the ones I want you to work from.
reasoning: |-
  Okay, let me approach this systematically. The user is designing a graduate seminar closing exercise on historical explanation, specifically the "Why Britain not China?" divergence question. The core pedagogical claim is that each explanation operates primarily at one particular scale of contrast and loses explanatory power when applied to others. 

  Hmm, the user wants seven candidate explanations evaluated on three dimensions: contrast-stability score (0-1), primary contrast level, and justification including dating of divergence. Then a weighted ranking based on those scores, plus identification of any candidate that actually addresses the Needham question rather than the divergence. 

  First I need to establish my weighting rule. Since the central claim is about contrast-dependency, the stability score should be the dominant factor. But I should also consider how cleanly the explanation maps onto each contrast level - some might work at multiple scales but with varying effectiveness. The score conversion will be straightforward: higher stability = higher rank, with tiebreakers going to explanations whose primary contrast aligns with later divergence dating (since early-dating explanations claim more fundamental causality).

  *checking each candidate*
  For Coal (Pomeranz): Clearly tied to 1750 Britain-Yangtze contrast. Doesn't explain why China didn't develop similar solutions over time or why pre-1750 Europe was ahead. Scores low on stability. 

  New World colonies: Same time-bound issue as coal. Only relevant post-1492, useless for 1000CE contrast. Primary contrast must be Britain-Qing 1400-1800. 

  Factor prices (Allen): Slightly better - wage differentials existed earlier but the mechanization argument really clicks post-1700. Still weak on 1000CE and Americas contrasts. 

  High-level equilibrium trap: Actually reverses stability problem - works best for early contrasts but fails to explain why China didn't escape the trap later. Interesting challenge to the dating premise. 

  Political fragmentation: The most stable! Works from 1000CE onward through all contrasts except possibly Americas. High score. 

  Credible constraints: Very specific to 1688 Britain. Fails completely on early contrasts and non-European cases. Lowest stability. 

  Industrial Enlightenment: Ah, here's the Needham question confusion. Explains scientific development but not why it translated to industry in Britain rather than China. Should be flagged.

  For the ranking, Political fragmentation clearly wins on stability. Credible constraints and Coal are bottom for opposite reasons - one too narrow temporally, the other spatially. The key insight for students will be seeing how an explanation's implied timeframe determines its contrast applicability. 

  *noticing deeper nuance*
  The high-level equilibrium trap is tricky - if interpreted as preventing indigenous industrialization, it claims an early divergence date but then struggles with why China didn't industrialize later when conditions changed. That'll make good seminar debate material. 

  Final thought: The Needham/science confusion in Mokyr's candidate is crucial. Running these two questions together obscures that scientific knowledge doesn't automatically equal economic transformation - that's the real divergence puzzle.
answer: |-
  ### Weighting Rule for Overall Ranking  
  The contrast-stability score (0.0–1.0) is the primary ranking criterion, with ties broken by the *explanatory scope* of the primary contrast (later/global contrasts > earlier/regional contrasts, as late-dating explanations inherently cover less causal ground).  

  ### Candidate Scores and Analysis  
  **1. Coal (Pomeranz)**  
  - **Stability**: 0.2  
  - **Primary contrast**: Britain vs. Yangtze Delta (c. 1750)  
  - **Justification**: This explanation hinges on late-18th-century geography and technology, irrelevant to pre-1500 contrasts or the Americas. It commits to divergence *after* 1750, ignoring earlier European advantages.  

  **2. New World Colonies (Pomeranz)**  
  - **Stability**: 0.3  
  - **Primary contrast**: Britain vs. Qing Empire (1400–1800)  
  - **Justification**: Colonies matter only post-1492, collapsing for the 1000 CE or Eurasia-Americas contrasts. It dates divergence to *after 1500*, unable to address why China lacked comparable expansion incentives earlier.  

  **3. Relative Factor Prices (Allen)**  
  - **Stability**: 0.4  
  - **Primary contrast**: Britain vs. Yangtze Delta (c. 1750)  
  - **Justification**: Wage/energy differentials solidified late (1700+), failing at the 1000 CE or Eurasia-Americas scales. It implies divergence *began c. 1700*, overlooking medieval wage trends that don’t predict industrialization.  

  **4. High-Level Equilibrium Trap (Elvin)**  
  - **Stability**: 0.6  
  - **Primary contrast**: Northwestern Europe vs. East Asia (c. 1000)  
  - **Justification**: Posits Song-era (1000 CE) efficiency as a *long-term* constraint, retaining partial force in later contrasts but weakest for the Americas. It commits to divergence *rooted by 1000 CE*, though its mechanization thesis fits poorly with Qing dynamism.  

  **5. Political Fragmentation (Tilly/Jones)**  
  - **Stability**: 0.9  
  - **Primary contrast**: Northwestern Europe vs. East Asia (c. 1000)  
  - **Justification**: Europe’s competitive state system vs. imperial unity explains naval innovation, war-driven R&D, and capital allocation from 1000 CE onward, applicable to all contrasts except the Americas. It implies divergence *began c. 1000–1400*, with compounding effects.  

  **6. Credible Constraints (North/Weingast)**  
  - **Stability**: 0.1  
  - **Primary contrast**: Britain vs. Qing Empire (1400–1800)  
  - **Justification**: The 1688 Glorious Revolution is too specific, vanishing for 1000 CE, Yangtze-1750, or Eurasia-Americas. It dates divergence *to 1689*, silent on why rival European states (without similar institutions) industrialized later.  

  **7. Industrial Enlightenment (Mokyr)**  
  - **Stability**: 0.5  
  - **Primary contrast**: Britain vs. Yangtze Delta (c. 1750)  
  - **Justification**: While 18th-century epistemic shifts explain British *invention*, they falter for pre-1700 contrasts or Eurasia-Americas. It commits to divergence *c. 1750–1800*, ignoring why China’s comparable tech/skill base didn’t ignite similar change.  

  ---

  ### Overall Ranking (High to Low Stability)  
  1. **Political Fragmentation (0.9)**  
     - Broadest temporal scope; explains cumulative innovation across scales.  
  2. **High-Level Equilibrium Trap (0.6)**  
     - Early dating gives wide coverage but overstates Qing stagnation.  
  3. **Industrial Enlightenment (0.5)**  
     - Strong for late-period invention but conflates science with industrial *application*.  
  4. **Relative Factor Prices (0.4)**  
     - Intuitive for 1750–1800, yet wage patterns predate industrialization.  
  5. **New World Colonies (0.3)**  
     - Relevant only post-1500; ignores intra-European divergence.  
  6. **Coal (0.2)**  
     - Geologically deterministic; irrelevant beyond 1750 Britain.  
  7. **Credible Constraints (0.1)**  
     - Overfits to 1689 Britain; fails elsewhere.  

  ---

  ### Misplaced Explanandum: The Needham Question  
  **Candidate 7 (Industrial Enlightenment)** answers the **Needham Question** ("Why did *modern science* arise in Europe?") but not the **Divergence Question** ("Why did *industrialization* occur first in Britain?").  

  **What is lost when conflated**:  
  - The Needham Question focuses on *epistemic* innovation (e.g., the Scientific Revolution), while the Divergence Question requires explaining *socioeconomic transformation* (e.g., factories, capital intensivity). Conflating them obscures why China’s advanced pre-1800 science and artisanal knowledge (e.g., textile production) did not catalyze sustained industrial growth without complementary institutions (e.g., factor markets) or pressures (e.g., labor scarcity).  

  ### Key Seminar Insight  
  **"Fix the scale, then test the explanation"**: Each candidate’s power depends on the chosen contrast, revealing that "Why Britain?" demands explicit spatiotemporal framing—e.g., Political Fragmentation explains Europe’s *long-term competitive edge*, while Coal explains Britain’s *late acceleration*.
