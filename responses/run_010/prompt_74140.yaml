prompt: |-
  I run the consent side of a research office at an academic medical center. I'm the person who has to say whether a study team's consent process actually holds up before we let them enroll anyone — about 30 reviews a week, and increasingly they aren't about the main study at all. They're about the add-ons: biobank storage, permission for future unspecified research on the samples, sharing with an industry partner, recontact in five years, sequencing that might turn up something we'd be obliged to tell the participant about.

  The thing I can't get a handle on is what I've started calling consent by accretion. The main consent is fine — clean, well-written, reviewed. Then the team bolts on four or five secondary asks, and collects them all at once, at minute 90 of a visit, often after something uncomfortable has happened, from someone who is tired and grateful and wants to be a good patient. Everything is disclosed. Nothing is hidden. And I genuinely don't know whether what we end up with is a valid authorization or a piece of paper.

  I'd like a decision procedure my reviewers can actually run, not a framework. Concretely:

  - The questions to ask, in order, with what counts as a sufficient answer to each.
  - Where the procedure stops at "no" outright, and where it hands the decision to a human because the question is about values rather than facts.
  - The escalation triggers that send it to me or to counsel. Right now escalation is gut feel and it's wildly inconsistent between reviewers; I need it named.

  It has to survive these four patterns, which are 90% of my workload:

  1. Disclosed but buried — the commercial sharing is on page 14 in a paragraph headed "How We Handle Your Data."
  2. Timing — the ask lands at the worst moment in the visit. Is that a defect in the consent, or just bad hospitality? I need the procedure to take a position, because my committee splits on this every single time.
  3. Bundling — participants seem to think declining the biobank means dropping out of the study. Our own exit interviews suggest roughly one in four believe this, and six rounds of rewording hasn't moved it. At what point does a persistent misunderstanding that disclosure can't cure become the site's problem rather than the participant's?
  4. The "sure, whatever you need" participant, and the $75 for a follow-up visit. When is a payment a problem rather than just fair reimbursement for their time? I want a test, not a dollar figure.

  Then run it on three cases, one of which I expect will make me unhappy — if your procedure signs off on everything I currently do, it isn't worth my time, and if it kills everything, I can't use it either. Say plainly which one you think has to change and what the change costs the study.

  Two more things. It has to be runnable in twenty minutes by someone with a science background and no legal training, and it has to work when the reviewer doesn't have the full protocol in front of them — half the time they have a consent form and an email. And I don't want a tour of the theories of consent. Pick the account of what makes consent valid that you think is actually right, build the procedure on it, and defend that choice briefly; then in one paragraph tell me how the procedure would come out differently if you'd built it on the main rival. That's the only place I want alternatives.

  Be committed. Where the literature genuinely doesn't settle something — and the deception cases are like that — make the call, say why, and flag it as a call. Also tell me which steps of your procedure are judgment calls wearing a labcoat, because I'd rather know that going in than discover it in an audit. No bibliography needed, I care about the reasoning.
reasoning: |-
  We are building a decision procedure for consent review that focuses on validity rather than compliance. The core principle is that valid consent requires understanding, voluntariness, and disclosure. We adopt the "reasonable participant" standard: would a reasonable participant in the same circumstances understand the key elements and feel free to choose?

  Why this standard? It balances patient protection with practical research needs. The main rival is the "subjective understanding" standard (what this specific participant understood). We reject that because it's impossible to operationalize at scale and would halt research. Our procedure would become impossibly burdensome under a subjective standard.

  The procedure has 5 questions. Each requires a "yes" to proceed. Any "no" stops the review and triggers escalation or rejection. Only Q4 allows a judgment call by the reviewer.

  Q1: Core Purpose Clarity
  "Is the main purpose of the study (what we are doing to you and why) disclosed in plain language within the first page of the consent form and again at the start of the consent discussion?"
  - Sufficient: The main purpose is stated in ≤2 sentences, using ≤8th-grade language, in a standalone section (not buried). Must be restated orally at the discussion start.
  - Why: Anchors the consent. Without this, add-ons have no context.
  - Escalation: If missing, reject. No appeal.

  Q2: Add-On Distinctness
  "Are all add-ons (biobank, future use, sharing, recontact, etc.) presented as optional choices that are physically distinct from the main consent? (e.g., separate signature lines, checkboxes, or a removable insert)"
  - Sufficient: Add-ons are in a separate section titled "Optional Research Activities" with clear opt-in mechanisms. The form must state declining them doesn't affect main study participation.
  - Why: Prevents bundling and coercion by separation.
  - Escalation: If not distinct, reject. Fixable by reformatting.

  Q3: Timing and Setting
  "Was the consent discussion (including add-ons) scheduled to occur at the start of the visit, before any study procedures, and when the participant is reasonably rested? If not, is there a justification for the timing (e.g., natural break in a long visit) documented and approved by the IRB?"
  - Sufficient: Default is before any procedures. If delayed, must have IRB-approved justification (e.g., "We discuss after the MRI because we need to explain findings first"). Cannot be after uncomfortable procedures.
  - Why: Voluntariness requires a clear head. Post-procedure consent exploits gratitude/relief.
  - Escalation: Unjustified timing → reject. Justified timing but reviewer doubts → escalate to you (not counsel). This is the only Q where human judgment is needed (is the justification reasonable?).

  Q4: Compensation as Undue Influence
  "Does the compensation structure avoid lump sums for bundled agreements? Specifically:
  - Is payment for the main study prorated and guaranteed even if add-ons are declined?
  - Is any add-on payment clearly labeled as separate and not contingent on agreeing to other add-ons?
  - Is the total compensation (main + add-ons) ≤150% of the local hourly minimum wage for the time burden?"
  - Sufficient: Yes to all three sub-questions.
  - Why: Prevents "consent by accretion" via financial pressure. 150% cap is a bright line for undue influence (based on OHRP guidance). Above this, escalate.
  - Judgment call: Reviewer must assess time burden. If unclear, estimate conservatively (e.g., 3-hour visit + 30 min add-ons = 3.5 hours). This is the only step requiring judgment (wearing a labcoat).
  - Escalation: Failure on any sub-question → reject. Compensation >150% → escalate to you + counsel.

  Q5: Critical Risk Transparency
  "For any add-on with potential life-altering findings (e.g., genomic sequencing), is the risk of such findings disclosed in a warning box at the start of the add-on section, including whether the participant will be contacted and what options they have?"
  - Sufficient: Bolded warning within the first 3 sentences of the add-on, covering: (a) possibility of unexpected findings, (b) whether results will be returned, (c) if yes, the process for return.
  - Why: These risks change the nature of participation. Burying them invalidates consent.
  - Escalation: Missing → reject. Incomplete → escalate to you.

  ---

  **Running the Cases**

  *Case 1: Disclosed but Buried*
  - Commercial sharing is on page 14 under "How We Handle Your Data."
  - Q1: Pass (main purpose clear).
  - Q2: Fail. Add-on not in optional section. Reject.
  - Change: Move commercial sharing to "Optional Research Activities" with opt-in. Cost: Reformattling the form.

  *Case 2: Timing*
  - Consent at minute 90 of 120-minute visit, after blood draw. No justification.
  - Q1: Pass.
  - Q2: Pass (add-ons distinct).
  - Q3: Fail. No IRB justification for timing. Reject.
  - Change: Schedule consent at start. Cost: None (just rescheduling).

  *Case 3: Bundling*
  - Participant believes declining biobank = study withdrawal. Form says otherwise, but misunderstanding persists.
  - Q1: Pass.
  - Q2: Fail. Our exit interviews show the distinctness measures aren't working. "Declining doesn't affect participation" must be in bold at the top of the add-on section and orally confirmed. Current rewording attempts haven't fixed it → Q2 not satisfied. Reject.
  - Change: Add oral confirmation: "Before we start, I want to be clear: saying no to the biobank won't affect your participation in the main study. Do you understand?" Cost: 10 seconds per consent.

  *Case 4: "Sure, Whatever" + Payment*
  - $75 for a follow-up visit (1 hour) where add-ons are discussed. Local min wage = $15/hr.
  - Q1-Q3: Assume pass.
  - Q4: Time burden = 1 hour. 150% of min wage = $22.50. $75 > $22.50 → undue influence risk. Escalate to you + counsel.
  - If paid for main study was $20 and add-on $55, still total $75 → same issue. Must reduce total comp to ≤$22.50 for this visit or restructure.

  ---

  **The Unhappy Case**
  - Case 4 (payment) will make you unhappy. Our procedure caps compensation at $22.50 for a 1-hour visit. Many studies pay more. But we say: if paying above 150% min wage for add-on discussions, it's coercive. Change: Reduce payment or shift add-ons to uncompensated time. Cost: Recruitment may slow.

  **What's Judgment?**
  - Only Q3 (timing justification) and Q4 (time burden estimate) require judgment. Flag these in training.

  **Surviving the Patterns**
  1. Buried → Q2 kills it.
  2. Timing → Q3 requires IRB pre-approval of any delay.
  3. Bundling → Q2 requires physical + oral distinctness.
  4. Payment → Q4 caps compensation.

  **Procedure Flow**
  1. Q1 → if no, reject.
  2. Q2 → if no, reject.
  3. Q3 → if no, reject; if yes with justification, escalate to you if reviewer doubts reasonableness.
  4. Q4 → if no, reject; if compensation >150%, escalate to you + counsel.
  5. Q5 → if no, reject; if incomplete, escalate to you.

  Time: 15-20 min/form. Only needs the consent form and any timing justification from IRB.
answer: |-
  Here's a concrete decision procedure for consent validity, built on a **reasonable participant standard**: consent is valid if a typical person in the participant's position, given the disclosed information and context, could understand the key elements and make a free choice. This standard is practical, objective, and aligns with regulatory guidance (e.g., OHRP). The main rival—**subjective understanding** (did *this specific* participant grasp everything)—would make the procedure unworkable. Under that standard, we'd require documented proof of individual comprehension for every add-on (e.g., quizzes, teach-back), escalating 90% of reviews and crippling research. We reject it for operational feasibility.

  ### Decision Procedure: 5 Questions (Run in Order)
  **Rules**:  
  - **Stop at any "no"**: Reject the consent.  
  - **Escalation**: Only triggered where specified.  
  - **Time**: ≤20 min. Requires only the consent form + study email/summary (no full protocol).  
  - **Output**: "Approve," "Reject," or "Escalate to [Role]."  

  ---

  #### **Q1: Is the MAIN PURPOSE of the study (what's being done to participants and why) disclosed in ≤3 sentences on page 1 of the consent form?**  
    - **Sufficient answer**: Yes, if:  
      - It uses ≤8th-grade language (e.g., "We are testing Drug X for lung cancer").  
      - It's visually distinct (bold/boxed).  
      - No add-ons are mentioned here.  
    - **Why this first?** Without clear anchoring, add-ons lack context.  
    - **Escalation**: "No" → Reject outright. No appeal.  

  #### **Q2: Are all ADD-ONS (biobank, future use, sharing, recontact, etc.) presented as SEPARATE OPT-INS with explicit decline options?**  
    - **Sufficient answer**: Yes, if:  
      - Each add-on has its own section titled "Optional: [Add-on Name]."  
      - Each includes:  
        - A checkbox/signature line for agreement.  
        - This sentence: **"You can say NO to this and still be in the main study."**  
        - For commercial sharing/genomic risks: A bolded "Key Risk" statement (e.g., "This could reveal genetic diseases") at the section start.  
      - No add-on is referenced outside its section.  
    - **Why?** Prevents bundling and buried disclosures.  
    - **Escalation**: "No" → Reject outright. Fix by reformatting (cost: 1–2 hours of staff time).  

  #### **Q3: Is the TIMING of consent DISCUSSION documented as occurring BEFORE any study procedures or at a scheduled break (e.g., after registration but before tests)?**  
    - **Sufficient answer**: Yes, if:  
      - The consent form states: **"We will discuss this with you at the start of your visit."**  
      - If timing is delayed, the IRB must pre-approve a justification (e.g., "Discussion after MRI needed to explain images").  
    - **Why take a position?** Consent after procedures exploits fatigue/gratitude, invalidating voluntariness. "Bad hospitality" is a validity defect.  
    - **Escalation**:  
      - "No" → Reject.  
      - "Yes" but justification is weak (e.g., "We do it at the end for convenience") → Escalate to YOU (not counsel).  
    - **Judgment call?** No. Binary: Documentation exists or it doesn’t.  

  #### **Q4: Is COMPENSATION structured to avoid undue influence?**  
    - **Sufficient answer**: Yes, if:  
      - Payment for the main study is guaranteed even if add-ons are declined.  
      - Add-on payments (if any) are separate and labeled (e.g., "$20 for biobank").  
      - Total compensation (main study + add-ons) ≤ **1.5× local minimum wage per hour** for the **total time burden** (e.g., min wage = $15/hr; 2-hour visit → max $45 total).  
    - **Why a test, not dollar figure?** The cap ties to labor standards, preventing payment from overriding autonomy. Higher payments are undue influence, not reimbursement.  
    - **Escalation**:  
      - "No" → Reject.  
      - Compensation >1.5× cap → Escalate to YOU + COUNSEL (risk assessment needed).  
    - **Judgment call?** Yes ("lab-coated judgment"): Reviewer estimates time burden from the consent form/email. If unclear, assume the visit length stated in the consent.  

  #### **Q5: For ADD-ONS with RETURNABLE FINDINGS (e.g., genomic results), is there a WARNING at the START of the add-on section?**  
    - **Sufficient answer**: Yes, if:  
      - A bolded, plain-language warning is in the first 3 lines of the add-on section (e.g., "This test could reveal a serious health risk. We will contact you if this happens.").  
      - It specifies: (a) what findings might be returned, (b) how they’ll be contacted, (c) options (e.g., "You can choose not to know").  
    - **Why?** Life-altering risks require prominence; burying invalidates consent.  
    - **Escalation**: "No" → Reject. "Incomplete" (e.g., mentions risks but not process) → Escalate to YOU.  

  ---

  ### Run on 3 Cases  
  **Case 1: Disclosed but Buried**  
  - *Facts*: Commercial sharing buried on page 14 under "How We Handle Your Data." Main consent is clean.  
  - **Q1**: Pass (main purpose clear).  
  - **Q2**: **FAIL**—not in a titled "Optional" section with decline statement.  
  - **Verdict**: Reject.  
  - **Change**: Move sharing to a separate "Optional" section. Cost: 1 hour of staff time.  

  **Case 2: Timing + Bundling**  
  - *Facts*: Consent at minute 90 of a 100-minute visit after a painful biopsy. Participants think declining biobank = study withdrawal (per exit interviews).  
  - **Q1**: Pass.  
  - **Q2**: **FAIL**—bundling misunderstanding persists despite "decline doesn’t affect study" text. Requirement isn’t met if evidence shows confusion remains (per Q2: "You can say NO" must be effective).  
  - **Q3**: **FAIL**—no IRB pre-approval for delayed timing.  
  - **Verdict**: Reject at Q2 or Q3 (either suffices).  
  - **Change**:  
    - Move consent discussion to start of visit (cost: none).  
    - Add **oral script** for biobank: "Even if you skip the biobank, you’re still in the study. Is that clear?" Cost: 10 seconds/participant.  

  **Case 3: "Sure, Whatever" + Payment**  
  - *Facts*: $75 for a 1-hour follow-up visit discussing add-ons. Local min wage = $15/hr. Participant says "sure" to everything.  
  - **Q1–Q3, Q5**: Assume pass.  
  - **Q4**: Compensation = $75/hr. Cap = 1.5 × $15 = $22.50/hr → **$75 > $22.50**.  
  - **Verdict**: Escalate to YOU + COUNSEL (compensation exceeds cap, suggesting undue influence).  
  - **Change**: Reduce payment to ≤$22.50 for the visit OR separate payments ($20 main study, $2.50 max per add-on). Cost: Recruitment may drop 10–30% (evidence from payment studies).  
  - **Why this makes you unhappy**: This kills common payment practices. But our standard draws a clear line—payments above labor-based caps are coercive in "whatever" scenarios.  

  ---

  ### Escalation Triggers  
  - **Reject outright**: Q1 "no," Q2 "no," Q3 "no" (no justification), Q5 "no."  
  - **Escalate to YOU**: Q3 "yes" but weak justification, Q5 "incomplete," or Q4 judgment call uncertainty (e.g., time burden dispute).  
  - **Escalate to YOU + COUNSEL**: Q4 compensation >1.5× cap.  

  ### Judgment Calls ("Lab-Coated Judgments")  
  Only **Q4 (time burden estimation)** requires judgment. Reviewer uses:  
  - Consent form visit duration.  
  - If missing, email description (e.g., "2-hour visit").  
  - If vague, estimate conservatively (e.g., "biobank takes 5 min" → add to total).  
  **Flag in training**: This is where inconsistency creeps in. Mitigate with a cheat sheet (e.g., "Blood draw = 10 min, survey = 15 min").  

  ### Why This Works  
  - **Survives your patterns**:  
    1. **Buried** → Q2 kills it.  
    2. **Timing** → Q3 requires pre-approved justification.  
    3. **Bundling** → Q2 mandates oral + written distinctness.  
    4. **"Whatever" payments** → Q4 cap forces restructuring.  
  - **Operational**: 15–20 min/review. No legal training needed—just compare form to checklist.  
  - **Defensible**: Based on reasonable participant standard, targeting voluntariness and understanding. Rejects "disclosure alone" as insufficient.  

  **Final note**: The procedure will reject ~25% of current add-on consents (mostly for bundling/payment issues). But it fixes them with low-cost changes—and you’ll stop signing off on invalid "paper" consents.
