prompt: |-
  I cover democracy and elections for a science/ideas desk, and something about the way we draw the electorate has been nagging me. Nearly every democracy lands on the same weird set of lines: 18 is the magic number almost everywhere (a handful go to 16, and at least one Gulf state sits at 25); someone who has lived, worked and paid taxes in a country for twenty years on a permanent-resident visa usually has no say in national elections at all, though in a fair number of places they do get a local vote; convicted prisoners are locked out completely in some democracies and voting from inside their cells in others; and citizens who emigrated forty years ago and have sent nothing home but postcards often keep their ballot for life — Britain only dropped it's 15-year cap on expat voting a couple of years back, while Denmark cuts you off after about two.

  I want to know what theory of political membership all this adds up to. Explain it the way you would to an editor who's smart but doesn't have the literature in their head, and argue rather than annotate — no reading lists or citations, I can't check them anyway.

  Sections, in this order:

  - **The practice** (~150 words): state cleanly what the pattern of lines actually is, including where they pull against each other.
  - **What it presupposes** (~400 words): reconstruct the implicit theory of who belongs to the demos. Is the vote treated as a right that tracks competence, as something owed to those the state coerces, as a stake in the outcome, or as an incident of membership? For each line separately — age, residence/citizenship, imprisonment, emigration — say which criterion it's really tracking.
  - **What it rules out** (~250 words): which rival accounts of the boundary does the practice quietly foreclose, and would adopting one of them force changes to things we currently treat as obvious?
  - **The seams** (~250 words): are the three or four lines consistent with one criterion, or several different criteria stapled together? Point at the sharpest internal tension and say whether there's any principled way to keep all of them.
  - **Underdetermined** (~200 words): where does the practice fail to choose between theories that would all license it just as well?
  - **If we swapped the theory** (~250 words): take the most plausible rival criterion and say what election law would have to look like under it — who gets in, who gets kicked out, and what the obvious objection to the new system is.

  One more thing I can't shake: whoever draws the boundary is already standing inside it, and gets picked by the people the previous boundary let in. Fold that in wherever it belongs.
reasoning: |-
  Okay, let me unpack this query about electoral boundaries. The user covers democracy for a science/ideas desk and is clearly frustrated by the patchwork logic of voting rules – age cutoffs at 18, permanent residents excluded, prisoners in limbo, expats clinging to ballots. They want the implicit theory behind these lines, not academic citations. 

  First I need to map the actual practice concisely: that 18 is near-universal while other boundaries clash (resident non-citizens pay taxes but can't vote, prisoners lose rights but may vote in some places, expats keep votes despite detachment). The tension between contribution and belonging jumps out immediately.

  For the presuppositions section, I'll argue each line reveals different priorities masquerading as coherence:
  - Age tracks competence (hence universal 18)
  - Citizenship ties voting to nationality, not coercion or stake (explaining the resident exclusion)
  - Prisoner disenfranchisement prioritizes punishment over membership
  - Expat voting treats ballots as birthrights rather than current stakes

  The internal contradiction screams here: we deny votes to taxpaying residents based on membership theory, but grant them to detached expats under that same theory? That's indefensible if voting tracks stake or contribution. 

  When considering rival theories, a coercion/stake model would flip everything: residents vote, prisoners vote (they're deeply coerced!), expats lose ballots after cutting ties. But that feels alien because our system evolved from tribal membership, not philosophy. The gatekeeper problem looms large – incumbent voters won't redraw lines to shrink their power.

  The emigration paradox is where the theory fully unravels. Why would lifelong emigrants keep voting? Only because the membership theory gets stretched beyond reason. If we applied stake theory consistently, we'd purge the voter rolls after a few years abroad. But that won't happen – the Danes cutting off expats after two years are the exception precisely because politicians court diasporas.

  Final thought: the entire system is a time capsule. It preserves 19th-century notions of blood-and-soil citizenship while pretending to be about consent or stake. No wonder it creaks.
answer: |-
  ## The Practice
  The global standard draws electoral boundaries along four key lines: **Age** (nearly always 18, occasionally 16, rarely higher), **Citizenship** (overwhelmingly required for national elections, even for decades-long resident taxpayers, though local voting rights are sometimes granted), **Imprisonment** (varying wildly, from total disenfranchisement to full prison voting), and **Emigration** (citizens abroad often retain national voting rights indefinitely, though some democracies impose time limits or residency requirements). The tensions are stark: a permanent resident contributing for 20 years is excluded, while a citizen who left decades ago remains included. A 17-year-old is barred, but prisoners (depending on location) might vote. The lines pull hardest between *contribution/residence* (ignored for non-citizens) and *formal membership* (prioritized, even for detached citizens).

  ## What it Presupposes
  This practice reveals **voting primarily as an incident of formal national membership**, not a direct function of competence, stake, or immediate coercion.

  *   **Age (18):** Tracks *presumed civic competence and independence*. It assumes a developmental threshold is crossed around adulthood, granting full membership rights. It’s a proxy for capacity, not a direct measure.
  *   **Residence/Citizenship:** Tracks *formal belonging*. Citizenship is the golden ticket. Permanent residency, taxes, and life investment demonstrate deep *stake* and subjection to *coercion*, but lack the formal bond of membership. The state says: "You belong *here*, but not to *us* politically." Local voting rights acknowledge local stake/coercion, reinforcing that national voting requires the deeper bond.
  *   **Imprisonment:** Reveals deep ambivalence. Disenfranchisement treats voting as a *privilege revoked for serious breach of societal contract*. Allowing prison voting treats it as an *inalienable right of membership*, persisting even through punishment. The practice leans towards punishment theory in many places ("you broke the rules, you lose your voice").
  *   **Emigration:** Confirms the supremacy of *lifelong formal membership*. The emigrant retains the legal bond of citizenship, regardless of diminished stake, contribution, or subjection to coercion. The ballot is a birthright/permanent entitlement, not contingent on current participation or impact. Time limits (like Denmark's) weakly acknowledge fading connection, but indefinite rights (UK post-2022) prioritize membership above all else.

  ## What it Rules Out
  This system quietly rejects rival theories:
  1.  **Stakeholding:** If voting followed tax-paying or significant life investment, long-term residents would vote nationally. They don't.
  2.  **Coercion/Subjection:** If voting rights stemmed from being subject to state power (laws, taxes, imprisonment), long-term residents and prisoners (especially) would *always* vote. They often don't.
  3.  **Competence Testing:** If civic competence was the direct criterion, we'd test voters, not just rely on age. We don't. We also wouldn't automatically strip rights based on incarceration unrelated to cognitive ability.
  4.  **Current Impact:** If voting required being materially affected by *current* outcomes, emigrants would lose rights quickly. They largely retain them.

  Adopting stakeholding or coercion theories would force radical changes: enfranchising millions of taxpaying residents and prisoners, while disenfranchising detached expats. This clashes with deeply held notions of national sovereignty and belonging. Crucially, **the current electorate, chosen by the prior boundary, has little incentive to adopt theories that dilute their exclusive club or add unpredictable voters.**

  ## The Seams
  The lines are stapled together by **different criteria**, creating sharp tensions. The core inconsistency is between **Citizenship/Membership** and **Stake/Coercion**:

  *   **The Sharpest Tension:** Long-term residents embody stake and coercion but are excluded; lifelong emigrants lack stake and coercion but are included. Membership theory overrides everything else. This directly contradicts the logic implied by local voting rights for residents (acknowledging local stake) and prisoner disenfranchisement (implying rights can be forfeit, undermining "inalienable membership").
  *   **Age vs. Prison:** If membership rights are inherent and inalienable (justifying emigrant votes), why are prisoners (still citizens) often disenfranchised? If rights can be stripped for crimes, why can't they be earned by long-term contribution? The "inalienability" claim is selective.
  *   **Is Principled Coherence Possible?** Only under a rigid, exclusive **birthright membership** model that ignores stake and coercion entirely. But this model is undermined by age thresholds (membership isn't automatic at birth) and prisoner disenfranchisement. True consistency would require either: 1) Full birth-to-death inalienable voting (enfranchise infants, prisoners, keep expats), or 2) A pure stake/coercion model. Our system is a messy hybrid, privileging membership but inconsistently applying its implications.

  ## Underdetermined
  The practice fails to distinguish between subtly different *justifications* for the membership theory itself:

  1.  **Ethno-Cultural Belonging:** Voting rights flow from shared history, culture, or ethnicity.
  2.  **Contractual Consent:** Citizens are the original parties to the social contract (or their descendants).
  3.  **Legal Formality:** Citizenship is simply the legal category defining the polity, requiring no deeper justification.

  The practice of indefinite expat voting fits *all three*. An emigrant maintains cultural ties, remains a formal party to the "contract," and retains the legal status. The practice *also* fails to definitively choose between "membership as inherent right" (supporting prisoner voting) and "membership as conditional privilege" (supporting disenfranchisement). Both can be argued within the membership framework.

  ## If We Swapped the Theory
  **Adopting the Coercion/Subjection Theory:** If the vote belongs to anyone significantly subject to the state's coercive power (laws, taxes, imprisonment), the lines would shift dramatically:

  *   **Who Gets In:** Long-term permanent residents (subject to laws, taxes, potentially conscription) gain national voting rights. Prisoners (subject to the state's most extreme coercion) universally retain or gain voting rights.
  *   **Who Gets Kicked Out:** Citizens living abroad long-term, with no assets, income, or residence in the country, and not subject to its laws/jurisdiction in any meaningful way, lose voting rights after a short grace period (e.g., 2-5 years). Potentially, minors contributing significantly (e.g., working minors paying taxes) might have a claim.
  *   **The Obvious Objection:** **"Legitimacy and Sovereignty."** Critics would argue this severs voting from national identity and loyalty. Why should someone without deep cultural ties or allegiance, merely subject to rules, help choose the nation's leaders? It risks creating a "permanent resident class" with political power but no ultimate allegiance, potentially prioritizing their interests over the long-term cultural/national good. It also feels alien to communities built on shared identity. **Crucially, the existing electorate (defined by membership) would fiercely resist diluting their political community with "outsiders" and losing control over expat votes they currently hold.** The gatekeepers won't easily open the gate to new entrants chosen by a theory that diminishes their own exclusive bond.
