            - But H_ch (the proposition that the chance function is ch) entails that T does not occur (because if T occurred, the chance function would be ch_T, not ch). Therefore, conditional on H_ch, T is impossible.

            - The non-T outcomes are: (A,B), (B,A), (B,B), each with chance 0.25 (so total chance 0.75 for non-T).

            - The event E (first assignment is A) occurs only in the outcome (A,B) (since in (A,A) we have T, which is ruled out).

            - Therefore, conditional on H_ch, the only outcomes possible are (A,B), (B,A), (B,B), and they are equally likely by symmetry? But note, the chances are: 
                  (A,B): 0.25, (B,A): 0.25, (B,B): 0.25.
              So conditional on ~T, the chance of (A,B) is 0.25 / 0.75 = 1/3.

            - Therefore, Cr(E | H_ch) = Cr(first run is A | H_ch) = 1/3.

            - But the Principal Principle requires: Cr(E | H_ch) = ch(E) = 0.5.

            - Mismatch: 0.5 vs 0.333.

          Third, violated principle and the gap:

            The Principal Principle is violated. The gap is 0.5 - 0.333 = 0.167 (or 1/6).

            The gap is not an artifact of the specific number 0.25 for T. If we let the number of runs be n, then the chance of T (all A) is (0.5)^n. The gap would be:

                 ch(E) = 0.5

                 Conditional on H_ch and ~T, the chance of E becomes:

                     [ch(E and ~T)] / ch(~T) = [ch(E) - ch(T)] / [1 - ch(T)] 
                     = [0.5 - (0.5)^n] / [1 - (0.5)^n]

                 For n=2: (0.5 - 0.25) / (1 - 0.25) = 0.25/0.75 = 1/3.

                 Gap = 0.5 - 1/3 = 1/6.

                 For n=3: 
                     ch(T) = 0.125
                     conditional chance of E = (0.5 - 0.125) / (1 - 0.125) = 0.375/0.875 ≈ 0.4286
                     gap = 0.5 - 0.4286 = 0.0714

                 For large n, the gap goes to 0.

            So the gap matters for small n, but becomes negligible for large n.

          Fourth, the diagnosis:

            The single feature doing the work is the Humean supervenience of chance on the entire history, combined with the fact that the chance function assigns a positive probability to a history that would change the chance function (the undermining future).

            If we remove Humean supervenience (and assume a non-Humean chance that is fixed independently), then the conflict disappears because H_ch does not entail ~T. In that case, Cr(T | H_ch) = ch(T) = 0.25, and Cr(E | H_ch) = 0.5.

            If we make the chance of T go to zero (by increasing n), the gap becomes negligible.

            If we declare evidence about T inadmissible, then we wouldn't conditionalize on it. But in this case, the evidence about T is not directly known; it's the structure of the chance function that tells us about T. And the chance function is admissible.

          Replies by a Lewisian or Humean defender:

            1. **Reply 1: The Principal Principle is only approximately true.** The gap is small when the undermining chance is small. In realistic cases with many events, the undermining chance is tiny, so the conflict is negligible.

            2. **Reply 2: The new principle.** Lewis proposed a new principle: 

                    Cr(A | H_tw & E) = tw(A | E)

               In this new principle, we conditionalize the chance on the admissible evidence E. In our case, the evidence includes H_tw (which is H_ch). But also, the chance function tw (which is ch) should be conditional on the entire history that is fixed by H_ch? However, in the new principle, we use the chance function tw conditional on the future as well? It's complex. Lewis's new principle was designed to avoid the undermining problem by essentially setting the credence in A to be the chance that tw assigns to A given the future that is compatible with the chance function being tw. In our case, this might yield 1/3 for E given H_ch, which matches our conditionalization. Then there is no conflict. The new principle gives up the old one and avoids the contradiction.

            3. **Reply 3: Deny that chance supervenes on the future in a way that makes H_ch entail ~T.** A Humean might argue that the chance function ch is defined in such a way that it can occur in a world with T. They might revise the supervenience thesis to avoid the incompatibility. For example, they might say that the chance function is defined by the entire history including the future, but then H_ch is not knowable until the future is fixed. So at the time of the first run, the board does not know H_ch. They only know that the chance function is one that assigns 0.5 to each run, but they don't know which particular Humean chance function it is until after the two runs.

          Which reply is strongest?

            Reply 2 (the new principle) is Lewis's own solution. It avoids the contradiction by revising the principle. It is a coherent and non-ad-hoc reply.

            Reply 1 (approximate truth) is also strong for large n, but for small n the gap is significant.

            Reply 3 is difficult because it seems to give up the knowability of the chance function at the time of the event.

          I think Reply 2 is the strongest because it was designed for this problem and it works.

          However, note that in your original request, you wanted the evidence to be admissible and the physics boring. The new principle handles it by conditionalizing the chance on the admissible evidence, which includes the fact that the chance function is ch. In the new principle, we set:

               Cr(E | H_ch) = ch(E | H_ch)

          But what is ch(E | H_ch)? This is the chance of E given that the chance function is ch. In the non-Humean view, this might be just ch(E) because the chance function is independent. In the Humean view, it is more complex. The new principle effectively says: use the chance function tw conditional on the proposition that the chance function is tw. But conditional on H_ch, the chance function is ch, and then what is ch(· | H_ch)? It might be defined as the chance function ch restricted to the worlds in which the chance function is ch. In our case, that would be the worlds where T does not occur. Then:

               ch(E | H_ch) = ch(E and H_ch) / ch(H_ch)

          But note: ch(H_ch) is the chance that the chance function is ch. In the actual world, the chance function is ch, so ch(H_ch) is 1? Or is it? In the world with chance function ch, what is the chance that the chance function is ch? It should be 1. But then:

               ch(E | H_ch) = ch(E) = 0.5.

          This doesn't help.

          Alternatively, the new principle might be formulated as:

               Cr(A | H_tw) = tw(A | G)

          where G is the proposition that describes the entire history of events that are not future to the time of the chance assignment? This is not clear.

          Lewis's new principle is: 

               Cr(A | HT) = T(A|HT)

          where HT is the history up to time T and the theory of chance, and T is a function that gives the chance at time T. But then T(A|HT) is the chance at time T of A given HT. In our case, at the time of the first run, the history HT might not include the second run. Then the chance of E at that time is 0.5. And the chance of T (both A's) at that time is 0.25. And the new principle would then set Cr(E | HT) = 0.5. 

          But then how do we account for the conditionalization on H_ch? The new principle does not require conditionalizing on the entire future pattern. It only uses the history up to time T. Therefore, in the new principle, we do not conditionalize on the fact that the entire history will not be T. So the new principle might avoid the problem by not including the future in the admissible evidence.

          In that case, the new principle would say:

               Cr(E | HT) = 0.5

          and we would not conditionalize on the future (which includes the second run). So the conflict does not arise.

          Therefore, the new principle (properly formulated) might be the way out.

          Given the above, let me summarize with the two-run Humean scenario.

          Scenario paragraph:

            In a hospital, two patients are to be assigned a treatment via a QRNG with two independent runs. The ethics board knows that the chance of A on each run is 0.5, but also that this chance assignment is Humean: it supervenes on the entire history of outcomes. Specifically, if both runs yield A, then the chance function would be different and would assign chance 1 to A. The board knows the actual chance function is the one that assigns 0.5 to each run (call it ch). They are setting their credence for the first run being A (E).

          Arithmetic:

            - By the old Principal Principle: Cr(E | H_ch) should be 0.5.
            - But H_ch entails that the outcome will not be both A's (because if it were, the chance function would not be ch). Therefore, conditional on H_ch, the only possible outcomes are: (A,B), (B,A), (B,B). The chance of these under ch is 0.25 each, so total 0.75. The chance of E (which is the first run A) is then the chance of (A,B) which is 0.25, but conditional on the non-T outcomes, it is 0.25/0.75 = 1/3.
            - Therefore, if the board conditionalizes on H_ch, they get Cr(E | H_ch)=1/3.
            - Conflict: 0.5 vs 0.333.

          Violated principle: the old Principal Principle.

          Diagnosis: Humean supervenience of chance on the entire future history.

          Replies:

            1. Approximate truth: for a larger number of runs, the undermining chance (of all A's) is very small, so the gap is small. For two runs, the gap is 0.167, which is not negligible, but in practice we usually deal with many runs.

            2. Adopt the new principle: the new principle, by focusing on the chance at the time of the event and not requiring admissibility of future history beyond what is in the chance function's domain at that time, would avoid conditionalizing on the entire future. Then we would have Cr(E | current history and chance theory) = 0.5, and there is no conflict.

            3. Deny that the board knows H_ch at the time of the first run: because the chance function supervenes on the entire history, which is not complete until after the two runs, the board cannot know H_ch until then. So they don't have the evidence that would generate the conflict.

          I think Reply 2 (the new principle) is the strongest and most systematic.

          Therefore, the case does show a conflict for the old Principal Principle under Humeanism with a small number of trials, but the new principle resolves it.

