answer: |-
  ### Scenario
  A hospital ethics board uses a quantum random number generator (QRNG) to assign patients to treatment A or B with an intended chance of 0.5 for each. The board knows the QRNG's design ensures this chance via quantum randomness. However, the board's evidence includes an admissible piece of information: an audit log shows a 0.01 chance that a vendor's technician preseeded the device to always output A (event T), which occurred before any assignments. If T happened, the chance of A on the next run is 1; otherwise, it remains 0.5. The board must set its credence for the event that the next run outputs A (event E), using its evidence, which includes the chance of T and the setup details. The physics is ordinary (no hidden variables, time travel, etc.), and evidence about T is admissible (e.g., an anonymous tip and log entry consistent with Lewis's criteria).

  ### Arithmetic
  - **Chance premises**:
    - Chance of T (preseeding): \( ch(T) = 0.01 \).
    - Chance of not-T: \( ch(\neg T) = 0.99 \).
    - Chance of E (next output A) given T: \( ch(E \mid T) = 1 \).
    - Chance of E given not-T: \( ch(E \mid \neg T) = 0.5 \).
  - **Overall chance of E** (by law of total probability):  
    \( ch(E) = ch(E \mid T) \cdot ch(T) + ch(E \mid \neg T) \cdot ch(\neg T) = (1 \times 0.01) + (0.5 \times 0.99) = 0.01 + 0.495 = 0.505 \).
  - **Principal Principle (PP) demand**: The board knows \( ch(E) = 0.505 \), so PP requires credence:  
    \( Cr_{\text{PP}}(E) = ch(E) = 0.505 \).
  - **Conditionalization on evidence**: The board conditions on its total evidence (including T’s chance and admissibility):  
    \( Cr_{\text{cond}}(E) = Cr(E \mid \text{evidence}) = Cr(E \mid T) \cdot Cr(T) + Cr(E \mid \neg T) \cdot Cr(\neg T) \).  
    By PP, \( Cr(T) = ch(T) = 0.01 \) and \( Cr(\neg T) = ch(\neg T) = 0.99 \) (since evidence is admissible).  
    If T, E is certain: \( Cr(E \mid T) = 1 \).  
    If not-T, E has chance 0.5, and no further evidence breaks symmetry: \( Cr(E \mid \neg T) = 0.5 \).  
    Thus:  
    \( Cr_{\text{cond}}(E) = (1 \times 0.01) + (0.5 \times 0.99) = 0.01 + 0.495 = 0.505 \).
  - **Result**: Both PP and conditionalization yield \( 0.505 \). **No mismatch occurs.**

  ### Why No Mismatch?
  - The calculation shows consistency because T is a past event. The chance \( ch(E) \) accounts for T via weighted averaging, and conditionalization mirrors this. PP (even Lewis’s later formulation) is satisfied.
  - **Testing other numbers**:  
    - If \( ch(T) = 0.02 \): \( ch(E) = (1 \times 0.02) + (0.5 \times 0.98) = 0.51 \), and \( Cr_{\text{cond}}(E) = 0.51 \).  
    - If \( ch(T) = 0.001 \): \( ch(E) = (1 \times 0.001) + (0.5 \times 0.999) = 0.5005 \), and \( Cr_{\text{cond}}(E) = 0.5005 \).  
    Consistency holds regardless of \( ch(T) \).

  ### Diagnosis: The Key Feature
  - **Single feature doing the work**: T is a **past event** affecting chances. Since evidence about T is admissible, PP and conditionalization align through the law of total probability applied to chances.
  - **What if removed?**  
    - **If \( ch(T) = 0 \)**: T is impossible. Then \( ch(E) = 0.5 \), and \( Cr_{\text{cond}}(E) = 0.5 \) (no T to consider). No issue.  
    - **If evidence about T is inadmissible**: PP requires ignoring it; \( Cr_{\text{PP}}(E) = ch(E) \) but \( ch(E) \) is undefined without T. Case collapses as evidence is inadmissible by fiat.  
    - **If \( ch(E \mid T) \neq 1 \)**: Suppose \( ch(E \mid T) = c \). Then \( ch(E) = c \cdot 0.01 + 0.5 \cdot 0.99 \), and \( Cr_{\text{cond}}(E) \) matches. Still consistent.

  ### Why No Contradiction?
  The scenario lacks **undermining futures** (e.g., outcomes that retroactively alter chances). T is past-fixed, so \( ch(E) \) is unambiguously defined and known. Genuine undermining requires:
  - **Humean supervenience**: Chances supervene on entire histories (including future outcomes).
  - **Self-undermining possibility**: A future outcome with positive chance that, if actual, would change the chance function itself.

  ### Constructing an Undermining Case
  To create a mismatch, we need Humean supervenience and a self-undermining future. Consider a **modified scenario**:
  - Two runs of the QRNG (first run: event E; second run: event F). The board evaluates E.
  - Chance function \( ch \) assigns 0.5 to each run, based on actual history (Humean supervenience).
  - Let T be the event that both runs output A. Then \( ch(T) = ch(E \text{ and } F) = 0.25 \).
  - If T occurs, the history (both A) would make the Humean chance function \( ch_T \) (where \( ch_T(A) = 1 \)), not \( ch \). Thus, \( ch \) and T are incompatible: \( ch \) entails ¬T.
  - Board’s evidence: \( H_{ch} \) (the chance function is \( ch \)), which is admissible.

  **Arithmetic**:
  - **PP demand**: \( Cr_{\text{PP}}(E \mid H_{ch}) = ch(E) = 0.5 \).
  - **Conditionalization on evidence**:  
    \( H_{ch} \) entails ¬T (since T would make chance \( ch_T \), not \( ch \)).  
    Under \( H_{ch} \), possible outcomes: (A,B), (B,A), (B,B) — each with chance 0.25.  
    E (first A) only occurs in (A,B), which has chance 0.25.  
    Total chance of ¬T = \( 1 - ch(T) = 0.75 \).  
    Thus:  
    \( Cr_{\text{cond}}(E \mid H_{ch}) = \frac{\text{chance of (A,B)}}{\text{chance of } \neg T} = \frac{0.25}{0.75} = \frac{1}{3} \approx 0.333 \).  
  - **Mismatch**: PP requires 0.5; conditionalization gives ≈0.333.  
    **Gap**: 0.5 - 0.333 = 0.167.  
  - **Sensitivity to numbers**:  
    - For \( n \) runs, \( ch(\text{all A}) = (0.5)^n \).  
      Gap = \( 0.5 - \frac{0.5 - (0.5)^n}{1 - (0.5)^n} \).  
      - If \( n=2 \): gap = 0.167.  
      - If \( n=3 \): \( ch(T) = 0.125 \), conditional \( ch(E \mid \neg T) \approx 0.4286 \), gap ≈ 0.0714.  
      - As \( n \to \infty \), gap → 0.  
    Gap is non-negligible for small \( n \).

  **Violated principle**: The original PP (or Lewis’s initial formulation), which assumes chances are independent of future undermining possibilities.  
  **Feature doing the work**: **Humean supervenience** allowing future outcomes to retroactively define chances. If removed (e.g., non-Humean fixed chances), \( H_{ch} \) doesn’t entail ¬T, and PP holds.

  ### Replies for a Lewisian/Humean Defender
  1. **Adopt the New Principal Principle**:  
     Lewis’s revised PP sets credence to the chance conditional on the entire admissible evidence (e.g., \( ch(E \mid H_{ch}) \)). In the undermining case, \( ch(E \mid H_{ch}) \) is undefined or inconsistent, but the new PP can be interpreted to avoid contradiction.  
     - **Does it kill the case?** Yes, by design. The new PP resolves undermining by making \( Cr(E \mid H_{ch}) = tw(E \mid H_{tw}) \), which aligns with the conditional chance (e.g., ≈0.333 in the two-run case).  
     - **Strength**: Lewis’s own solution; directly addresses the issue without ad hoc moves.

  2. **Negligible Gap for Realistic Cases**:  
     In practice, \( n \) is large (e.g., many QRNG runs), making \( ch(T) \) tiny and the gap small. For example, with \( n=100 \), gap ≈ 0.  
     - **Does it kill the case?** No; it relocates the problem. For small \( n \) (e.g., few critical decisions), the gap is material. It shows PP is not universally applicable, only approximately true in large systems.

  3. **Deny Knowledge of \( H_{ch} \) in Advance**:  
     Humean chances supervene on the entire history, so the board cannot know \( H_{ch} \) until all runs occur. At the time of E, they only know the *expected* chance (0.5), not \( H_{ch} \).  
     - **Does it kill the case?** Partially. Without \( H_{ch} \), the board uses \( ch(E) = 0.5 \) (no mismatch). However, if \( H_{ch} \) is part of the evidence (e.g., from theory), the conflict resurfaces. This reply limits PP’s scope to incomplete histories.

  ### Strongest Reply
  The **New Principal Principle** is the strongest reply. It is a principled revision: credence equals chance conditional on the *total admissible evidence* (e.g., \( ch(E \mid H_{ch}) \)). In the two-run case, this would give ≈0.333, matching conditionalization and eliminating contradiction. Lewis advocated this to handle undermining, and it doesn’t rely on approximations or epistemic restrictions. While it surrenders the original PP, it preserves the spirit of deferring to chances under admissibility constraints.

  **Conclusion**: Your scenario shows no inconsistency because T is past-fixed. Genuine undermining requires Humean supervenience and self-undermining futures (as in the two-run modification). The gap (0.167) arises there, but Lewis’s new PP resolves it. If you reject Humeanism, the problem vanishes.
