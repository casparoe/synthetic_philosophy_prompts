  The challenge is balancing authenticity with satire. The brochure must mimic real consulting jargon—tiered packages, metrics, disclaimers—while letting the absurdity emerge from juxtaposition. Key elements to include:  

  - **Tier Structure**: Deliberately escalating from cosmetic changes (timber, windows) to systemic shifts (officer training, normality principle), with footnotes subtly acknowledging external dependencies like welfare states.  
  - **Metric System**: Inventing "Community Parity Index" (CPI) to "objectively" justify deprivations as "risk management." This mirrors metrology themes—precision masking incomparable outcomes.  
  - **Testimonials**: Sincere but myopic praise from officials focused on costs/PR, oblivious to deeper contradictions.  
  - **FAQ on Recidivism**: A masterpiece of technical obfuscation, channeling the user’s calibration expertise to show how measurement differences invalidate comparisons.  

  The user’s expertise demands precision. Every satirical element must be *recognizably real* to penology specialists—e.g., "dynamic security" as labor-intensive, or "normality" requiring external social infrastructure. The consultancy must be *competent* (correct on costs, training) to avoid strawman parody.  

  The deeper critique? Exposing "penal tourism"—treating humane prisons as a kit of parts, not societal commitments. The brochure’s clinical tone itself satirizes neoliberal reform: reducing justice to procurement.  

  Final touch: warranty exclusions listing everything that actually makes Nordic models work (welfare, short sentences). Letting readers infer the indictment—exactly as the user requested.
