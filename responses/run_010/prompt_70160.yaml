answer: |-
  ### The Map
  **Predictions:**  
  - **Misses:** Professional Sovietologists (e.g., Princeton specialist, 1983; CIA) predicted stability, citing institutional cohesion, military parity, and lack of visible dissent. A miss would have required system survival beyond 1991 without radical rupture.  
  - **Hits:** Dissident Amalrik (1970) forecasted collapse by 1984 via internal rot/degeneration; Carrère d’Encausse (1978) predicted ethnonational fracture, especially in Muslim republics; demographer Séguy (mid-70s) inferred crisis from rising infant mortality signaling systemic failure.  
  **Mechanisms/Timelines:**  
  - Amalrik: Decay → collapse by 1984 (missed timeline but correct outcome).  
  - Carrère d’Encausse: Nationalism → dissolution within decades.  
  - Séguy: Demographic collapse → instability (no fixed timeline).  
  A "miss" for these required USSR survival to 2000+ without major reform or fragmentation.  

  ---

  ### What Popper’s Arguments Predict About the Case  
  Popper’s anti-historicism predicts:  
  1. **Trends ≠ Laws:** Soviet stagnation was a *trend* (e.g., economic decline), not a law. Trends can reverse (e.g., via reform).  
  2. **Knowledge Growth:** Gorbachev’s reforms ("new knowledge") altered trajectories unpredictably (e.g., *glasnost* enabling dissent).  
  3. **Prediction Feedback:** Public collapse predictions (e.g., Amalrik’s essay) might have accelerated dissent, but their limited reach minimized this effect.  
  4. **Uniqueness:** The USSR’s collapse was singular—contingent on Gorbachev’s choices, Yeltsin’s defiance, and the bungled coup. No "law" could foresee the *sequence* or *timing*.  
  Thus, Popper expects experts relying on deterministic "laws" (e.g., "Marxist states self-stabilize") to fail, while those spotting fragile trends succeed.  

  ---

  ### Where the Theory Bites  
  Popper’s framework explains:  
  - **Expert Failure:** Sovietologists assumed immutable "laws" (e.g., "totalitarian resilience"), ignoring contingent trends. Their models treated the USSR as a closed system, neglecting knowledge growth (e.g., Gorbachev’s ideological unshackling).  
  - **Outsider Success:** Dissidents/demographers focused on *trends in specific conditions*: demographic shifts, ethnic tensions, or economic decay—all falsifiable (e.g., reversal of infant mortality would have disconfirmed Séguy’s thesis).  
  - **Unpredictable Triggers:** The coup’s failure hinged on agency (Yeltsin’s courage, military indecision)—a "human factor" Popper emphasizes.  

  ---

  ### Where it Misses or Misdescribes  
  **Gaps:**  
  1. **Overdetermination:** Popper dismisses multi-causal convergence (economy + nationalism + demography) as non-lawlike, yet their interplay made collapse *more likely*—not random.  
  2. **Agency’s Limits:** Popper’s "human factor" explains unpredictability but *does not account for structural constraints*. Gorbachev’s refusal to use force was shaped by institutional decay (e.g., military reluctance), not pure volition.  
  3. **Unique vs. General:** The USSR shared features with other collapsing empires (e.g., Habsburgs)—Popper overstates uniqueness.  

  ---

  ### Retrospective Lawlikeness  
  **The Critique:** Post-1991, scholars recast the collapse as "inevitable" using ex post facto "laws" (e.g., "centrally planned economies *must* stagnate").  
  **Verdict:** Genuine failure mode. It masks:  
  - **Contingency:** Without Gorbachev, repression might have prolonged the USSR.  
  - **Falsifiability:** "Inevitability" claims are unfalsifiable (e.g., "collapse was certain, just delayed").  
  - **Expert Bias:** Retrospectively diagnosing "laws" absolves predictive failures.  
  This *is* bad social science per Popper: it replaces testable conditional predictions ("If X, then Y") with deterministic narratives.  

  ---

  ### Bottom Line  
  **1991 confirms Popper.** The collapse was not governed by laws but by interacting trends altered by unforeseen knowledge growth (reforms) and agency (Gorbachev/Yeltsin). Experts wedded to historicist "laws" of Soviet stability failed; outsiders tracking contingent trends succeeded. The event was a unique confluence, not an instance of a general historical law.  

  ---

  ### What Would Change Your Mind  
  **Flipping Evidence:** If archives revealed a *consensus* of experts predicting *precise mechanisms/timing* of collapse *before* 1985 (e.g., "Gorbachev will liberalize, triggering nationalism by 1991"), Popper’s uniqueness claim collapses.  
  **Weak Links:**  
  1. **Consensus vs. Individuals:** My verdict hinges on treating CIA/Princeton as consensus. If proven they were outliers (e.g., most experts *did* foresee collapse), Popper’s critique weakens.  
  2. **Fact Reliance:** I accepted your account of Amalrik/Carrère d’Encausse. If their predictions were vaguer or post-dated key events (e.g., published *after* Afghan War), the "outsider success" narrative fails.  
  **Dependency:** The "professional consensus" framing is crucial. If failures were scattered errors (not institutional historicism), Popper’s relevance diminishes.  

  ---  
  **Key:** Popper’s brilliance lies in demanding *testable, conditional* social science—not prophecy. 1991 epitomizes this.
