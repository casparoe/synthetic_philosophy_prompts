prompt: |-
  I've been re-reading the bits of Popper on historicism and I want to run them against an actual episode rather than in the abstract. Take the last six years of the Soviet Union: Gorbachev takes over in 1985, then perestroika and glasnost, the satellite states go in 1989, the August coup attempt fails in 1991, and the USSR is formally gone by the end of that year. The fact I care about is that essentially none of the professional people paid to forecast this forecasted it. A Princeton Soviet specialist was calling the system remarkably stable in 1983, and the CIA was overestimating its internal cohesion right up to the end — a former director of central intelligence later wrote openly about the failure to see the magnitude of the crisis. Meanwhile a handful of people outside the field did call it: a dissident who'd been through the camps wrote an essay in 1970 literally asking whether the USSR would survive until 1984; a French historian in 1978 argued the empire would come apart along its national lines, pointing at the ethnic republics and I think especially at population growth in the Muslim-majority ones; and a French demographer in the mid-70s got there from infant-mortality statistics. If any of that is garbled, tell me instead of quietly working around it.

  Here's what I want. Analyze the whole thing through Popper's anti-historicism — the argument that there can be no laws of history, that what looks like a law is usually a trend, and that a trend is a singular statement about a time and place rather than a universal, plus the stronger claim that the course of history depends on the future growth of knowledge and so cannot be known in advance, plus the feedback point that publishing a prediction about society changes the society being predicted. Not a summary of Popper, and not a history of 1985-91 either. I want the mapping done properly and then the theory put on trial by it.

  A couple of specific things to get your hands dirty with:

  - Sort the "laws" on offer. "Centrally planned economies can't calculate prices and therefore stagnate" versus "multi-ethnic empires dissolve once the centre stops repressing" versus "regimes that lose their legitimacy collapse" — which of these is a law, which is a trend, which is a conditional prediction that needs initial conditions spelled out, and which is just a truism that can't be falsified? Be specific about what would have counted as disconfirming each one.
  - The winners disagreed about mechanism. One said the economy, one said nationalism, one said demography, one said war or a palace coup, and they were all roughly right about the same outcome. Say what that does to the idea that there was a law operating, and also what it does to Popper's insistence that big historical processes are unique rather than instances of a kind.
  - Then the part I can't figure out. Afterwards a lot of people said the collapse was overdetermined and really knowable in advance: stagnation, the arms burden, the drop in oil revenue, the demographic profile of the republics, a leadership that had stopped believing in its own ideology. Call this retrospective lawlikeness — the move of converting a surprise into an inevitability the moment it happens, and then treating the inevitability as evidence that history runs on rails. Is that a real failure mode or is it just what good social science looks like from the inside? And does it cut against Popper, who wanted the social sciences to keep doing conditional prediction and piecemeal engineering, or for him?
  - Where is Popper silent? Gorbachev's refusal to use force, Yeltsin on the tank, the coup collapsing in three days — his "human factor" argument gestures at all this but I don't see it doing predictive work. Say plainly where the theory has nothing to say.

  Please use these sections, in this order: **The map** (~200 words: what exactly was predicted, by whom, with what stated mechanism and timeline, and what would have counted as a miss); **What Popper's arguments predict about the case** (~250); **Where the theory bites** (~250); **Where it misses or misdescribes** (~250); **Retrospective lawlikeness** (~200, and give me a verdict on whether that's a genuine failure mode); **Bottom line** (~120: does 1991 confirm Popper, sit as an anomaly for him, or turn out to be a case his framework never really anticipated — pick one and say why); **What would change your mind** (~120).

  On that last section I mean it literally: name the argument or piece of evidence that would flip your verdict in the bottom line, and point at the spot in your own reasoning where you're most likely to have gone wrong — including anywhere you've leaned on a fact I gave you rather than checking it, since I'm not asking for citations or a reading list and I'd rather you flag uncertainty than paper over it. Also tell me how much your verdict depends on treating the failed forecasts as a professional consensus rather than a bunch of individual mistakes, because I suspect that's doing more work than I'm letting on.
