  - Case B: A model that solves a novel multi-step puzzle using tools but can't tell you why it made the move it made (e.g., it uses a calculator tool to solve a math puzzle but when asked for reasoning, it gives a confabulated or incorrect explanation).
  - Case C: A scaffolded long-horizon run that keeps pursuing a goal nobody ever specified after thousands of steps (e.g., an agent system that was given a goal and continues to act towards it over a very long context, even without reinforcement).
  - Case D: Identical weights producing a docile assistant and a scheming antagonist depending on two lines of framing text (e.g., a base model that, when given a system prompt of "You are a helpful assistant", acts helpfully, but with "You are an evil AI trying to take over the world", acts maliciously, without any fine-tuning).
  - Case E: A model whose hidden states encode a fact its output denies (e.g., in a truthfulness probe, the model's internal representations show it knows the truth but it outputs a lie).

