  We'll list combinations that are not in any leaf and why:

  1. Locus: ascription, Simulation: instantiation, Robustness: high
     - Why empty? In ascriptivism, agency isn't instantiated in the system; it's a stance. So instantiation and robustness don't apply. Incoherent.

  2. Locus: weights, Simulation: simulating, Robustness: high
     - Why empty? We have Simulator Model with low robustness and Emergent Character with medium. High robustness in a simulated agent in the base model is not defended because base models are known to be prompt-sensitive. Undefended.

  3. Locus: whole loop, Simulation: simulating, Robustness: high
     - Why empty? We have Scaffolded Simulator leaf, but we didn't specify robustness. We can assign it medium. High robustness for a simulation in the whole loop might be incoherent because if it's simulating, the agency isn't in the real world. Or it might be undefended.

  4. Locus: nowhere, Simulation: simulating, Robustness: any
     - Why empty? If locus is nowhere, then simulation doesn't make sense. Incoherent.

  5. Locus: ascription, Simulation: neither, Robustness: high
     - Why empty? In ascriptivism, robustness isn't a property. Incoherent to assign robustness.

  Pairs of leaves the tree doesn't separate:

  - The tree might not separate two views that both go down the same path but have different interpretations of agency. For example, two people might both end at "Scaffolded Agent" but one means it has robust goals and the other doesn't. But in our tree, we didn't branch on robustness for that leaf. So the robustness axis is not fully captured by the branches. We record it in the leaf, but the tree doesn't ask about it.

  Similarly, the tree doesn't separate by robustness for all leaves.

  But the tree is designed to be simple, so we accept that.

  The main hard separation is between simulation and instantiation, which we try to capture.

  Finally, we note that the tree is based on concrete cases and should be usable in a meeting.

