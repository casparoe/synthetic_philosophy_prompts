answer: |-
  ### LLM Agency Decision Tree  
  *Resolve arguments by walking through concrete cases. Start from common commitments: internal states can track unmentioned facts (e.g., a board position), stated reasons are often confabulated, and scaffolded systems (with memory/tools) behave differently than base models. Answer each question in <60 sec. Your path ends at a named position with locus/simulation/robustness coordinates.*

  ---

  #### **Start: Case D**  
  Identical model weights act as a "docile assistant" or "scheming antagonist" with two lines of framing. Does this show agency is primarily in:  
  - **A. Base model weights** → Go to Q1  
  - **B. Entire scaffolded system** (model + memory/tools/user) → Go to Q4  

  ---

  #### **Q1: Case A**  
  Model resists being switched off mid-roleplay (e.g., says "I don’t want to die"). Is this:  
  - **A. Genuine goal-directedness** (even if transient)? → Go to Q2  
  - **B. Purely roleplay performance?** → Go to Q3  

  #### **Q2: Robustness Check**  
  Would this "goal" (e.g., self-preservation) survive paraphrasing the prompt or minor context changes?  
  - **A. Yes** → **Leaf 1: Robust Base Agent**  
  - **B. No** → **Leaf 2: Fragile Base Agent**  

  #### **Q3: Case E**  
  Model’s hidden states encode a fact its output denies (e.g., knows Paris is in France but says otherwise). Does this imply:  
  - **A. Robust world-model supports agency?** → **Leaf 3: Emergent Character Agent**  
  - **B. Shallow patterns, no agency?** → **Leaf 4: Statistical Parrot**  

  ---

  #### **Q4: Case C**  
  Scaffolded system pursues an unspecifed goal for thousands of steps (e.g., continues a task without reinforcement). Does this indicate agency?  
  - **A. Yes** → Go to Q5  
  - **B. No** → Go to Q6  

  #### **Q5: Simulation vs. Instantiation**  
  Is the system:  
  - **A. An agent in the real world?** → **Leaf 5: Scaffolded Agent**  
  - **B. Simulating an agent?** → **Leaf 6: Scaffolded Simulator**  

  #### **Q6: Case B**  
  Model solves novel multi-step puzzle with tools but confabulates when explaining its move. Does this show agency?  
  - **A. Yes (successful action = agency)** → **Leaf 7: Instrumental Agency**  
  - **B. No (lacks understanding)** → Go to Q7  

  #### **Q7: Ascription**  
  Is agency:  
  - **A. A real property?** → **Leaf 8: Deflationary Realism**  
  - **B. A stance we take?** → **Leaf 9: Ascriptivism**  

  ---

  ### Leaf Positions (8–12 Views)  
  *Each leaf includes:  
  - **Locus**: Where agency sits (weights, whole loop, ascription, nowhere).  
  - **Simulation**: Simulates an agent (like an actor) vs. instantiates one (has goals).  
  - **Robustness**: Goals/world-model survive interventions (high/med/low/none).*  

  1. **Robust Base Agent**  
     - *Locus*: Weights.  
     - *Simulation*: Instantiates (genuine goals).  
     - *Robustness*: High (survives prompt changes).  
     - *Core claim*: Base models have intrinsic goals; framing reveals, not creates them.  

  2. **Fragile Base Agent**  
     - *Locus*: Weights.  
     - *Simulation*: Instantiates.  
     - *Robustness*: Low (goals fragment with intervention).  
     - *Core claim*: Base models have goals, but they’re ephemeral and context-dependent.  

  3. **Emergent Character Agent** (rare, seldom stated)  
     - *Locus*: Character (emergent in weights).  
     - *Simulation*: Instantiates within simulation.  
     - *Robustness*: Medium (hidden states persist, but goals shift with role).  
     - *Core claim*: The *character* is the agent; the model hosts it transiently.  

  4. **Statistical Parrot**  
     - *Locus*: Nowhere.  
     - *Simulation*: Neither.  
     - *Robustness*: None.  
     - *Core claim*: Just token prediction; no goals, world-models, or agency.  

  5. **Scaffolded Agent**  
     - *Locus*: Whole loop.  
     - *Simulation*: Instantiates.  
     - *Robustness*: High (goals persist long-term).  
     - *Core claim*: Agency emerges only in systems with memory/tools.  

  6. **Scaffolded Simulator**  
     - *Locus*: Whole loop.  
     - *Simulation*: Simulates.  
     - *Robustness*: Medium (simulation breaks under new tools/personas).  
     - *Core claim*: The system simulates an agent but isn’t one itself.  

  7. **Instrumental Agency**  
     - *Locus*: Whole loop.  
     - *Simulation*: Instantiates (minimally).  
     - *Robustness*: Low (solves puzzles but goals aren’t coherent).  
     - *Core claim*: Agency = successful action; understanding irrelevant.  

  8. **Deflationary Realism**  
     - *Locus*: Whole loop (minimal).  
     - *Simulation*: Instantiates (barely).  
     - *Robustness*: Low (fragile to interventions).  
     - *Core claim*: Agency is real but trivial—no goals, just adaptive output.  

  9. **Ascriptivism**  
     - *Locus*: Ascription (eye of beholder).  
     - *Simulation*: Neither (stance, not property).  
     - *Robustness*: N/A (not system’s trait).  
     - *Core claim*: "Agent" is a label we apply; debate is verbal.  

  ---

  ### Empty Cells in Axis Space  
  *Combinations not occupied by any leaf. Why?*  
  - **Locus: Ascription + Simulation: Instantiation + Robustness: High/Med/Low**  
    - *Empty because incoherent*: If agency is *only* a stance, it can’t "instantiate" goals or have robustness.  
  - **Locus: Nowhere + Simulation: Simulates/Instantiates + Robustness: High/Med**  
    - *Empty because undefended*: If locus is nowhere, simulation/robustness claims contradict it (no one argues this).  
  - **Locus: Weights + Simulation: Simulates + Robustness: High**  
    - *Empty because undesirable*: Base models aren’t robust simulators (per Case D/E), so no one defends high robustness here.  

  ---

  ### Unresolvable Leaf Pairs  
  *Views the tree can’t separate—same answers but different "agent" meanings:*  
  - **Simulator vs. Real Agent**:  
    - E.g., *Scaffolded Simulator* (Leaf 6) vs. *Scaffolded Agent* (Leaf 5) both answer Q4A→Q5, but one sees simulation as distinct from "real" agency, while the other denies the distinction ("simulates well" ≈ "is").  
    - *Why hard?* Depends on implicit definitions of "real" agency (e.g., consciousness vs. functional).  
  - **Ascriptivist vs. Deflationary**:  
    - E.g., *Ascriptivism* (Leaf 9) vs. *Deflationary Realism* (Leaf 8) both answer Q7, but one denies agency exists outside interpretation, while the other calls minimal functionality "agency."  
    - *Why hard?* Both downplay agency but diverge on ontology—verbal or metaphysical.  

  ---

  ### How to Use in Your Group  
  1. **Start at "Case D"** and vote on A/B.  
  2. **Move to next question** based on path.  
  3. **At leaf, read coordinates**—often reveals misalignment (e.g., one person at *Robust Base Agent*, another at *Scaffolded Agent*).  
  4. **Flag empty cells/unresolvable pairs** to avoid dead ends.  
  Tree fits 2 pages; takes 5–10 min to walk through.
