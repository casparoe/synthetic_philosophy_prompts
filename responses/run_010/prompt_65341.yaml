prompt: |-
  I hold a view about what makes a life go well that I inherited, loosely, from Moore's account of the ideal, though I want it assessed as a substantive position rather than as scholarship about him. It has five parts.

  (i) Two kinds of state are of supreme intrinsic value: mutual affection among a few people who know and admire one another, and the admiring contemplation of beauty — in art, in nature, and above all in persons.

  (ii) Their value is not reducible to the pleasure contained in them. Pleasure is a genuine component, but a whole composed of awareness of an object, an emotion appropriate to it, and knowledge that the object really exists and really is as one takes it to be can be worth vastly more than the sum of its parts. Conversely, pleasure attached to a negligible or misapprehended object adds very little.

  (iii) Beauty that is never contemplated has very little value. Value concentrates in the contemplating.

  (iv) Practical corollary: the best use of a life is to cultivate a small number of deep friendships and a serious capacity for appreciation, rather than to devote oneself to increasing aggregate welfare impartially. Benevolence matters chiefly as a means to conditions under which such goods become widely possible.

  (v) I accept the consequence I know is unattractive: a life in which a great deal of suffering is relieved, but which contains neither affection nor appreciation, would be a poor life however contented. That is a claim about where value lies, not about who counts morally.

  My method is also Moorean: I test candidate goods by considering them in absolute isolation, asking whether I would judge the existence of a thing good if it existed entirely by itself with nothing else in the universe; and I fix the extension of "beautiful" as that of which the admiring contemplation is good in itself.

  What would count against this? I want a map of the view's exposure, not a catalogue of objections I could absorb.

  1. Rank the defeaters from fatal to merely awkward, and state for each what exactly it would have to establish — that the view is false, that it is indeterminate, that it is guidance-silent, or only that it is uncomfortable — together with the criteria you used to order them.

  2. Conceptual exposure. Does (i) plus (iii) become partly true by stipulation, given how I fix "beautiful," and what is left at risk if it does? Does (ii) collapse into hedonism once "emotion appropriate to the object" is specified, or into a response-dependent preference theory once we ask what makes an object beautiful independently of anyone's response? Does allowing wholes to exceed the sum of their parts make every counter-case absorbable — and is that a genuine defect in a view about value, or an illegitimate demand imported from empirical science? Say which. Is the isolation method a real probe of intrinsic value, or does it measure only how badly we simulate a world containing one thing and nothing else?

  3. Empirical exposure. Which findings would bear hardest and which could I digest unchanged: hedonic adaptation; evidence that cultivated taste is substantially a function of social conditioning and status signalling; whether appreciation is cumulative and stable across a lifetime or decays; whether the quality of one's friendships is determined more by temperament and circumstance than by anything one cultivates; what people actually judge when they review their lives near the end. For each, say what would have to be shown for it to matter, not merely that it is suggestive.

  4. Three cases I cannot resolve, and for each say whether a committed defender must concede or can resist: a person whose appreciative engagement is intense and lifelong but directed at work connoisseurs judge inferior; a close friendship sustained by a partly idealized and inaccurate picture of the other, which fuller knowledge would erode, so that either it was worth less than it seemed or accuracy is not required; and whether (iii) commits me to weighting the preservation of beautiful uninhabited places, and how heavily against a modest amount of sentient misery.

  5. State what this view predicts that hedonism and preference-satisfaction accounts of welfare do not, and identify the one place where the predictions genuinely diverge rather than merely sound different — in particular, what should happen if appreciation and pleasure are pulled apart.

  6. Finally, separability: which single defeater, if it went through, would oblige me to give up (iv) while retaining (i) through (iii)? I want to know whether my axiology and my life plan can come apart, or whether the practical corollary is doing all the work and the value theory is only its decoration.

  Assume I have no library access. I want the arguments and the reasoning, not references, attributions, or a reading list.
reasoning: |-
  Hmm, the user presents a sophisticated ethical framework inspired by Moore's ideal utilitarianism, with five core tenets. They want it rigorously stress-tested, not as historical scholarship but as a standalone position. The request is unusually structured - asking for defeaters ranked by severity, conceptual vulnerabilities, empirical risks, unresolved cases, predictive differences from rival theories, and separability analysis. 

  This feels like a professional philosopher's request - perhaps a graduate student refining their dissertation or an academic preparing for publication. The phrasing ("map of exposure," "guidance-silent") suggests formal training. They're clearly invested in the view but seeking ruthless critique, hence forbidding "objections I could absorb." Interesting that they forbid references - this is about pure argumentation.

  Key pressure points I notice: Their definition of beauty via the isolation test risks circularity (point 2). The "wholes exceeding sums" claim in (ii) could be a get-out-of-jail-free card for counterexamples - but is that a feature or bug in value theory? The empirical questions in point 3 are brutal: if friendship quality depends more on temperament than cultivation, their practical corollary (iv) collapses. 

  The unresolved cases in point 4 are cleverly chosen. That "inferior art appreciation" case attacks the objectivity of beauty - if connoisseurship is just elite signaling, their whole hierarchy crumbles. The friendship-with-idealization case directly challenges their "knowledge of the object" requirement in (ii). 

  For divergences from hedonism (point 5), the torture case I constructed is decisive: if forced to choose between a life with authentic appreciation but agony versus pleasure without meaning, their theory would pick the former. Hedonists couldn't. 

  Most revealing is point 6: their life plan (iv) might actually be detachable from the axiology. If empirical psychology showed appreciation can't be cultivated (as point 3 hints), (iv) fails while (i-iii) stand. That's philosophically significant - it means their "best life" advice isn't entailed by their value theory.
answer: |-
  Here is a map of the exposure for your axiological view, structured by your requests. The analysis focuses on inherent vulnerabilities, potential defeaters ranked by severity, and the view's resilience.

  ### 1. Ranked Defeaters (Fatal to Awkward)
  - **Fatal Defeater: Intrinsic Value Requires Sentience/Subjectivity**  
    **What it must establish:** That intrinsic value *cannot* inhere in states without a conscious subject (e.g., unperceived beauty) or that "value" conceptually requires a valuer.  
    **Threat:** Falsifies (iii) and undermines (i), as beauty’s value depends on being contemplated. If value is *necessarily* valuer-dependent, (iii) becomes tautological and (i)’s claims about beauty’s *intrinsic* worth are false.  
    **Criteria:** Fatal as it attacks the core ontology of value, rendering the view incoherent.  

  - **Severe Defeater: Non-Transmission of Value in Wholes**  
    **What it must establish:** That the "whole" described in (ii) *cannot* possess value exceeding the sum of pleasure + accurate cognition + emotion.  
    **Threat:** Falsifies (ii). If value is strictly additive or mechanistic, the "organic unity" claim collapses, reducing the view to hedonism or a cognitive/affective sum.  
    **Criteria:** Severe as (ii) is the primary defense against hedonism; losing it weakens the entire structure.  

  - **Moderate Defeater: Cultivation is Epiphenomenal**  
    **What it must establish:** That cultivating appreciation/friendship (per iv) is largely determined by immutable temperament or luck, not deliberate effort.  
    **Threat:** Makes (iv) *guidance-silent*. The practical corollary is useless if effort cannot reliably achieve the goods.  
    **Criteria:** Moderate because it attacks applicability, not truth. (i)-(iii) could still be correct.  

  - **Awkward Defeater: Beauty is Indeterminate or Socially Constructed**  
    **What it must establish:** That "beauty" (as per your isolation-method definition) has no stable referent beyond subjective preference or cultural conditioning.  
    **Threat:** Renders (i) and (iii) *indeterminate* or *uncomfortable*. If "beauty" reduces to arbitrary response, supreme value claims feel arbitrary.  
    **Criteria:** Awkward but not fatal; the view could persist by accepting a subject-relative definition, though this clashes with (ii)’s emphasis on accuracy.  

  ---

  ### 2. Conceptual Exposure  
  - **Beauty by Stipulation (i + iii):**  
    Yes, (i) becomes partially tautological given your method: Admiring contemplation *defines* beauty, and (iii) says this contemplation is where value concentrates. This protects (i) and (iii) from empirical falsification but **risks vacuity**. What’s left at risk: The claim that beauty is *supreme* and *non-derivative*. If "beauty" is just "whatever we admire," its supremacy needs independent justification.  

  - **Collapse into Hedonism/Preference Theory (ii):**  
    - **Hedonism:** Resisted if "appropriate emotion" is *not* reducible to pleasure (e.g., awe, reverence). If the emotion *is* pleasure, (ii) collapses.  
    - **Preference Theory:** If "appropriate" depends on the valuer’s attitudes, collapse occurs. Resistance requires objective criteria for "appropriate emotion" (e.g., fittingness to the object’s properties).  
    **Verdict:** Collapse is avoidable only if "appropriate emotion" is object-grounded and distinct from pleasure.  

  - **Organic Unity as Absorptive (ii):**  
    Yes, claiming wholes exceed sums makes counter-cases absorbable (e.g., "That case lacks the *whole*"). This is **not a defect** in value theory. Value holism is a legitimate metaphysical stance; demanding atomistic reduction imports scientific norms illegitimately.  

  - **Isolation Method (v):**  
    It likely measures **simulation failure**, not pure intrinsic value. Humans cannot conceive "one thing alone" without implicit context (e.g., "beauty" implies a standard, a history). It may probe *non-instrumental* value but not *intrinsic* value in a strict sense.  

  ---

  ### 3. Empirical Exposure  
  - **Hedonic Adaptation:**  
    **Hardest hit:** If deep friendships/appreciation adapt to baseline happiness, their supreme value weakens. **To matter:** Show adaptation *erodes* the distinctive value of the whole in (ii), not just reduces pleasure.  
    **Digestible:** Adaptation might only affect the *pleasure component*, leaving the cognitive/affective whole intact.  

  - **Cultivated Taste as Status Signaling:**  
    **Hardest hit:** Undermines (i) if "admiring contemplation" is mostly social performance. **To matter:** Show that *no* appreciation escapes social contingency, making "true" beauty inaccessible.  
    **Digestible:** Accept conditioning as a means to access genuine appreciation (e.g., training reveals objective features).  

  - **Appreciation Decays with Age/Time:**  
    **Hardest hit:** Challenges (i)’s supremacy if appreciation is unstable. **To matter:** Show decay *diminishes retrospective value* of a life rich in appreciation.  
    **Digestible:** Stability isn’t required; peak experiences retain value even if memory fades.  

  - **Friendship Quality from Temperament/Circumstance:**  
    **Hardest hit:** Invalidates (iv)’s "cultivation" focus. **To matter:** Show effort *cannot* improve friendship depth beyond random allocation.  
    **Digestible:** Accept luck’s role but argue cultivation *optimizes* within constraints.  

  - **End-of-Life Judgments:**  
    **Hardest hit:** If people regret time spent on appreciation/friendship, (iv) is suspect. **To matter:** Show such judgments track *objective value*, not just transient comfort.  
    **Digestible:** Dismiss as corrupted by pain/fear, or emphasize minority reports of meaning.  

  ---

  ### 4. Unresolved Cases  
  - **Inferior Art Connoisseur:**  
    **Can resist.** If the admirer *accurately* perceives genuine properties (even if overlooked by experts) and feels appropriate emotion, the whole has value per (ii). "Beauty" is defined by *their* contemplation’s value, not expert consensus.  

  - **Friendship Sustained by Idealization:**  
    **Must concede (partly).** (ii) requires "knowledge that the object really is as one takes it to be." If the picture is *inaccurate*, the whole is deficient. However, if the idealization is *benign* (e.g., overlooking flaws while seeing core virtues), and mutual affection is real, residual value remains.  

  - **Uninhabited Beauty vs. Sentient Misery:**  
    **Can resist (with discomfort).** Per (iii), unperceived beauty has "very little value." A modest amount of misery (if "modest" means not catastrophic) doesn’t outweigh the *potential* for future contemplation. However, if preservation actively *causes* misery (e.g., diverting resources), (iv)’s instrumental benevolence may prioritize misery-reduction.  

  ---

  ### 5. Predictive Divergence  
  - **Key Prediction:** A life with intense appreciative engagement + suffering is *better* than a life with pleasure + no appreciation.  
  - **Genuine Divergence Point:** **Electrodes vs. Beethoven.**  
    - Hedonism: Prefers a life plugged into a pleasure machine simulating Beethoven appreciation.  
    - Preference-Satisfaction: Prefers whatever the subject desires (could align with either).  
    - **Your View:** *Rejects* the pleasure machine. Demands *veridical* engagement with real beauty (per ii), even if less pleasurable. The pleasure machine lacks the "whole" – the object isn’t real or beautiful.  

  ---

  ### 6. Separability: Defeater for (iv) Alone  
  - **Defeater:** **Empirical proof that cultivation is impossible.** If psychology shows friendship depth/appreciation capacity is fixed by age 5 or pure luck, (iv) becomes guidance-silent.  
  - **Effect:** (i)-(iii) remain intact. You could still say *having* these goods constitutes a good life, even if you can’t cultivate them. The axiology isn’t decorative, but (iv) is a contingent application vulnerable to evidence.  

  This view’s core exposure lies in its **objectivity claims** (beauty, appropriateness, organic wholes) and the **non-negotiable role of veridical contemplation**. If these falter, the structure wobbles; if they hold, it resists absorption into subjectivist alternatives. The life plan (iv) is the most contingent element.
