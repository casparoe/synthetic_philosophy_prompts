prompt: |-
  I manage a ~60 person backend team and I'm trying to work out what our norms around high performers should actually be. Three keep coming up in the eng-culture discourse: the American Dream (loudly celebrate whoever makes it big), Jantelagen (the Scandinavian thing from that 1933 novel, town of Jante, first rule being basically that you shouldn't think you're anything special), and tall poppy syndrome (cut down the ones who stick their heads up — the image is apparently from that story where a tyrant walks through a field swipping off the tallest stalks as his whole answer to a question about holding onto power; Livy's version has poppies in a garden and a message to his son, Herodotus's has wheat).

  Rank those three as a culture to actually run an eng org under. Score each 1-10 on two axes — raw output you'd get out of it, and how tolerable it'd be to work under day to day — with a one-liner of reasoning each, then give me an overall ordering. The wrinkle: our comp and levels are fully transparent, everyone can see everyone's number, and I suspect that changes what each norm does once you install it. Fold that in.

  Also tell me how confident you are in that overall ordering, and single out the one judgement in it you'd most expect to be wrong.
reasoning: |-
  Okay, let me tackle this engineering culture question. The user manages a 60-person backend team and wants to evaluate three cultural norms - American Dream, Jantelagen, and Tall Poppy Syndrome - for their org. The key constraints are transparent comp/levels and needing dual-axis scoring (output vs. tolerability). 

  First I need to unpack how transparent comp changes each dynamic. Jantelagen might actually benefit here since transparency preempts suspicion, while American Dream could backfire when high earners are publicly celebrated. Tall Poppy becomes downright toxic with visible levels - it's basically painting targets on backs.

  For scoring:
  - American Dream: High output (8) from incentivizing effort, but low tolerability (4) due to inevitable resentment with transparent salaries. "Motivating but divisive" sums it up.
  - Jantelagen: Medium output (6) since it avoids distractions, high tolerability (8) through psychological safety. "Stable but ceilinged" feels right.
  - Tall Poppy: Abysmal on both axes (2 and 2) - it actively punishes excellence. "Cancerous" isn't too strong a word here.

  The transparent comp wrinkle really reshuffles things. Normally American Dream might score higher on output, but with visible salaries, that 8 feels fragile. Meanwhile Jantelagen's tolerability jumps because transparency legitimizes its egalitarianism. 

  Overall order is clear: Jantelagen > American Dream > Tall Poppy. But I'm least confident about American Dream's output score - maybe the incentive effect outweighs the toxicity? Though in a 60-person team with known salaries, I'd bet on friction winning. 

  Final call: Go Nordic for sustainability, but watch for complacency. That tolerability score is Jantelagen's secret weapon.
answer: |-
  Here's a ranked analysis of the three cultural norms for your transparent-comp environment, with dual-axis scoring and the "transparency wrinkle" integrated:

  ### **Ranked Overall Order (Best to Worst)**
  1. **Jantelagen**  
     *Why*: Sustainable collaboration > isolated brilliance in transparent systems.  
  2. **American Dream**  
     *Why*: High output but corrosive to team cohesion with visible pay gaps.  
  3. **Tall Poppy Syndrome**  
     *Why*: Actively sabotages both output and morale.  

  ---

  ### **Detailed Scores & Reasoning**  
  *(Scale: 1 = Worst, 10 = Best)*  

  | **Norm**          | **Output Score** | **Reasoning**                                      | **Tolerability Score** | **Reasoning**                                      |
  |-------------------|------------------|---------------------------------------------------|------------------------|---------------------------------------------------|
  | **American Dream**| 8/10             | **Incentivizes extreme effort** via visible rewards, but **transparency amplifies rivalry** – high performers become targets, not inspirations. | 4/10 | **Exhausting & divisive**: Constant comparison breeds resentment when comp is public; "rock stars" drain team cohesion. |
  | **Jantelagen**    | 6/10             | **Consistent, predictable delivery** by minimizing distractions. **Transparency validates fairness**, reducing suspicion. | 8/10 | **Psychologically safe & low-stress**: No pressure to "outshine"; focus on collective wins over individual glory. |
  | **Tall Poppy**    | 2/10             | **Actively suppresses innovation**: High performers hide achievements to avoid backlash, stifling growth. **Transparency makes it worse** – high comp = bigger target. | 2/10 | **Toxic & paranoid**: Everyone fears standing out; mediocrity enforced via passive aggression or sabotage. |

  ---

  ### **Key Impact of Transparent Comp/Levels**  
  - **American Dream**: Backfires. Public salaries turn recognition into resentment ("Why do *they* get more?"). High performers become isolated.  
  - **Jantelagen**: Reinforced. Transparency aligns with "no one is special" ethos – comp differences feel like neutral facts, not status symbols.  
  - **Tall Poppy**: Catastrophic. Visible levels paint targets on high performers; cutting poppies becomes a bloodsport.  

  ---

  ### **Confidence & Uncertainty**  
  - **Overall Confidence**: **85%**  
    Jantelagen’s prioritization of psychological safety and collaboration is consistently validated by org studies (e.g., Google’s Project Aristotle) – especially crucial with transparent comp.  
  - **Most Uncertain Judgment**: **American Dream’s Output Score (8/10)**  
    *Why*: In *some* hyper-competitive, individually incentivized markets (e.g., quant trading), it *might* still drive output short-term. But with 60 people and public salaries, I suspect the toxicity would crater productivity faster than expected. If your team thrives on rivalry, this could be over-pessimistic.  

  **Bottom Line**: **Jantelagen wins** because transparency strips away the veneer of meritocracy in "American Dream" and weaponizes "Tall Poppy." It’s the only system where visible salaries *reduce* friction rather than fuel it. Implement it with explicit norms like: "We reward contribution, not attention" and "Levels reflect scope, not worth."
