prompt: |-
  I am the teaching assistant for a senior seminar in the philosophy of law, and I have been asked to grade the second of three in-class essays and to submit my marks with the comments attached. The seminar has nineteen students; they wrote for forty-five minutes, closed book, and were told in advance not to attempt citations, page references, or bibliographies, since the exercise is meant to test analysis rather than sourcing. The essay question I set was the following.

  Essay question: In 1944 a German woman, wishing to be rid of her husband, reported to the authorities remarks he had made critical of the regime while home on leave from the army. He was convicted and sentenced to death, a sentence later commuted so that he was instead sent to the front. After the war she was prosecuted under a provision of the 1871 German criminal code criminalizing the unlawful deprivation of another person's liberty, on the theory that she had been instrumental in his imprisonment. The appellate court convicted her, holding in part that she had acted of her own free choice in relying on a 1934 statute criminalizing remarks detrimental to the welfare of the Reich, and that this statute offended the sound conscience and sense of justice of all decent people. Hart and Fuller both discuss this case in their 1958 exchange. (a) Explain Hart's objection to the court's reasoning and the alternative course he proposes, and say what he thinks is at stake in the choice between them. (b) Explain Fuller's idea of the inner morality of law, listing at least six of its requirements, and say whether, in Fuller's hands, that idea functions as a thesis about the conditions of legal validity or as a thesis about the conditions of a legal system's moral worth. (c) In a short paragraph, say whose treatment of the informer case you find more convincing and why.

  Student answer: (a) Hart's objection is that the court failed to keep apart two questions that positivism insists are separate: what the law is, and whether it is good. On the facts, the 1934 statute had been enacted by the organs recognized as lawmaking in the German state at the time, and however vile its content, it satisfied whatever criteria of validity were then in force. To declare it void because its content offended decent people's sense of justice is, for Hart, a refusal to face the unattractive fact that a legal system can be thoroughly wicked and still be a legal system. The cost of that refusal is practical as well as theoretical: the court purchased the conviction of an odious defendant by misdescribing the law it was applying, and in doing so concealed the real choice facing the post-war legislature. Hart's alternative is to acknowledge that the statute was law, that it therefore shielded the wife, and that if she is to be punished at all it must be by a retroactive statute openly enacted for that purpose, since that is the only honest route to the right result. Something important is at stake in the choice. A legal culture that flatters itself into believing that iniquity automatically falls outside the law will be slower to recognize iniquity the next time it arrives in proper legal form, and it will lose the habit of asking whether a valid law deserves obedience.

  (b) Fuller's inner morality of law is a set of requirements attaching to law as a distinctive kind of activity; his definition of law is the enterprise of subjecting human conduct to the governance of rules, and a system that fails these requirements fails, wholly or in part, to be law. The requirements are that rules be general; that they be promulgated; that they be prospective rather than retroactive; that they be intelligible; that they not contradict one another; that they not demand the impossible; that they remain reasonably constant through time; and that officials be held to a stricter standard of conduct than the citizens they govern. Fuller's diagnosis of the informer case runs through this list. The Nazi regime did not merely enact wicked rules: it governed through unpublished directives, it repaired past irregularities by retroactive legislation, and it permitted its own officials to disregard the rules it had published. It therefore failed to be a legal system in substantial part, and the 1934 statute failed to be law because it was so grossly unjust that no decent person could have been under any obligation to obey it. On this last point Fuller's position amounts to Radbruch's, that injustice of an intolerable degree is not law at all, and the two differ mainly in emphasis.

  That the inner morality imposes requirements on the content of law is what makes Fuller's view a natural-law view, and it also shows that the disagreement with Hart is narrower than it appears. Hart concedes a minimum content of natural law: because human beings are roughly equal in vulnerability and in capacity to harm one another, and because altruism is limited, any legal system that is to survive must contain rules restricting violence, killing, and theft. But rules of that kind are precisely what Fuller's requirements demand, so Hart too holds that a system must meet moral requirements in order to count as a legal system; what remains is a quarrel about presentation. Nor can Hart consistently fault the German court for doing what his own theory says judges do in hard cases, namely decide by appeal to considerations outside the rule. The informer case was hard exactly because the moral defect in the statute made its application unclear, and Hart's account of the penumbra licenses the court's appeal to justice in such a case.

  (c) Fuller is the more convincing of the two. He alone can explain why the court's conclusion was right rather than merely fortunate, and he alone treats legality as something a regime can lose by its manner of governing rather than as a label attaching to whatever the recognized organs produce. Hart's insistence on the retroactive statute shows how little weight his positivism gives to the value of legality, since it is prepared to sacrifice that value for the sake of describing an odious statute accurately.

  What I would like from you is a grade together with the specific comments that justify it. Please work through the answer part by part, and within each part passage by passage where that is helpful, and write the remarks in the form they will appear on the returned paper: numbered, each keyed to the particular sentence or claim it concerns. For every remark, say whether you are recording a strength, a substantive error, or an imprecision; where you record an error, state what the correct view is and explain why the student's formulation goes wrong; where you record an imprecision, say what turns on it and what does not. The seminar scale is 93 to 100 for an A, 90 to 92 for an A−, 87 to 89 for a B+, 83 to 86 for a B, 80 to 82 for a B−, and so on downward; give both a numeric score and a letter grade, and note explicitly wherever the score depends on a judgment call that could reasonably go the other way. Please attend in particular to whether the parts of the answer cohere with one another, and to claims that are well phrased but nonetheless misstate a view or do not follow from what precedes them; confidence of style should earn no credit and cost none. Do not ask for or suggest citations, page references, or further reading, and do not deduct for their absence, since the students wrote closed book under those instructions. End with a summary comment of two or three sentences addressed to the student, and then, separately, a short note to me listing anything in the answer that you regard as mistaken but that a grader reading quickly would be likely to let pass.
reasoning: |-
  Okay, I need to carefully grade this philosophy essay based on the user's specific requirements. The student is responding to a prompt about Hart and Fuller's debate regarding the Nazi informer case. 

  First, I'll analyze part (a) about Hart's position. The student correctly identifies Hart's separation of law and morality, and his objection to the court invalidating the Nazi statute. The explanation of Hart's alternative solution with retroactive legislation is accurate. However, the student overstates Hart's view about legal systems "surviving" - Hart only discusses necessary minimal conditions, not system survival. This is an imprecision worth noting.

  For part (b) on Fuller, the student lists all eight requirements correctly and identifies Fuller's view as about legal validity. But there are two substantive errors: First, Fuller never argued that extreme injustice automatically voids law - that was Radbruch. Second, the student mistakenly claims Hart concedes moral requirements for legal systems, when Hart only acknowledges practical necessities. The comparison to Radbruch also needs correction.

  In part (c), the student's preference for Fuller is fairly presented, though the claim that Hart sacrifices legality is overstated. The coherence issues are problematic - part (b)'s errors undermine the comparison in (c).

  The numeric score calculation: Strong structure (4/5) minus coherence penalty (1.5) for the conceptual errors in (b) affecting (c). Content accuracy: 9/10 for (a), 6/10 for (b) due to two major errors, 7/10 for (c). Total 4 + 9 + 6 + 7 = 26 → 87/100 = B+.

  For the teaching assistant, I'll note that the Radbruch confusion and misrepresentation of Hart's minimum content are significant errors that might be overlooked in quick grading. The student's articulate style shouldn't obscure these substantive issues.
answer: |-
  ### Graded Response  

  **Overall Score:** 87/100 (B+)  
  **Letter Grade:** B+  
  *(Note: Score reflects strong structure and grasp of core concepts in (a) and (c), but substantive errors in (b) and coherence issues between parts. A 2-point adjustment upward [to 89/B+] could be argued if emphasizing (a) and (c) strength, but errors in (b) are significant enough to anchor at 87.)*  

  ---

  ### Specific Comments (Keyed to Answer)  
  **Part (a)**  
  1.  *"Hart's objection is that the court failed to keep apart two questions... what the law is, and whether it is good."*  
      **Strength.** Correctly identifies Hart’s core positivist commitment.  
  2.  *"On the facts, the 1934 statute... satisfied whatever criteria of validity were then in force."*  
      **Strength.** Accurately summarizes Hart’s view of legal validity.  
  3.  *"To declare it void because its content offended decent people's sense of justice is... a refusal to face... that a legal system can be wicked and still be legal."*  
      **Strength.** Precise phrasing of Hart’s critique of "natural law disguised as interpretation."  
  4.  *"The cost... is practical as well as theoretical... concealed the real choice facing the post-war legislature."*  
      **Strength.** Effectively captures Hart’s warning about obscuring legislative responsibility.  
  5.  *"Hart's alternative is... punish... by a retroactive statute openly enacted... the only honest route to the right result."*  
      **Strength.** Faithfully renders Hart’s prescribed solution.  
  6.  *"A legal culture that flatters itself... will be slower to recognize iniquity... and lose the habit of asking whether a valid law deserves obedience."*  
      **Strength.** Excellent synthesis of Hart’s stakes: transparency fosters moral vigilance.  

  **Part (b)**  
  7.  *"Fuller's inner morality of law is a set of requirements attaching to law as a distinctive kind of activity... enterprise of subjecting human conduct to the governance of rules."*  
      **Strength.** Correctly defines Fuller’s procedural conception of law.  
  8.  *"The requirements are that rules be general; promulgated; prospective; intelligible; not contradictory; not demand the impossible; reasonably constant; officials held to stricter standards."*  
      **Strength.** Accurately lists all 8 desiderata (exceeds the requested 6).  
  9.  *"Fuller's diagnosis... runs through this list. The Nazi regime... governed through unpublished directives... retroactive legislation... officials [could] disregard rules."*  
      **Strength.** Appropriately applies Fuller’s criteria to critique Nazi practices.  
  10. *"It therefore failed to be a legal system in substantial part..."*  
      **Strength.** Correctly states Fuller’s conclusion about Nazi legality deficit.  
  11. *"...the 1934 statute failed to be law because it was so grossly unjust that no decent person could have been under any obligation to obey it."*  
      **Substantive Error.** This misstates Fuller. Fuller argues a statute *fails as law* due to **procedural defects** (e.g., if secret or retroactive), NOT solely due to substantive injustice. His critique of the 1934 statute in the informer case hinges on the regime’s *systemic failure* to meet procedural morality (e.g., arbitrariness), not the statute’s content being "grossly unjust." *Correction: For Fuller, substantive injustice alone doesn’t invalidate law; it’s the failure of procedural morality that collapses the system’s legal character.*  
  12. *"On this last point Fuller's position amounts to Radbruch's... injustice of an intolerable degree is not law at all..."*  
      **Imprecision.** Fuller explicitly *distinguishes* himself from Radbruch. Radbruch’s formula voids laws for extreme substantive injustice. Fuller voids systems for procedural failure. The student conflates them. *What turns on it:* Fuller’s theory is about process, not content; Radbruch’s is about content. This misrepresentation distorts Fuller’s unique project.  
  13. *"Hart concedes a minimum content of natural law... any legal system that is to survive must contain rules restricting violence..."*  
      **Strength.** Correctly notes Hart’s sociological concession.  
  14. *"But rules of that kind are precisely what Fuller's requirements demand..."*  
      **Substantive Error.** Fuller’s 8 requirements are **procedural** (e.g., clarity, non-retroactivity). They do *not* demand specific *substantive* rules like prohibitions on violence. Hart’s "minimum content" is substantive; Fuller’s is procedural. *Correction: Fuller’s inner morality governs how rules are made/administered, not their content. Hart’s minimum content addresses substantive survival needs; they are fundamentally distinct.*  
  15. *"Hart too holds that a system must meet moral requirements to count as a legal system..."*  
      **Error (Follows from #14).** Hart **explicitly denies** that moral compliance is necessary for legal validity. His "minimum content" is a prudential observation about human survival, not a moral validity condition. *Correction: For Hart, a wicked system (e.g., enforcing slavery) is still "law" if procedurally valid. Fuller’s theory makes procedural morality a validity condition.*  
  16. *"Hart's account of the penumbra licenses the court's appeal to justice in such a case."*  
      **Imprecision.** Hart’s "penumbra" refers to *interpretive discretion* in applying vague rules. The informer case involved a *valid but wicked clear rule*, not vagueness. Hart rejects using morality to invalidate clear rules. *What turns on it:* This misapplies Hart’s theory. His "core/penumbra" distinction doesn’t justify voiding clear statutes for injustice.  

  **Part (c)**  
  17. *"Fuller is the more convincing... He alone can explain why the court's conclusion was right rather than merely fortunate..."*  
      **Strength.** Fair statement of Fuller’s perceived advantage.  
  18. *"...he alone treats legality as something a regime can lose by its manner of governing..."*  
      **Strength.** Correctly contrasts Fuller’s procedural focus with positivism.  
  19. *"Hart's insistence on the retroactive statute shows how little weight his positivism gives to the value of legality..."*  
      **Imprecision.** Hart values legality but sees retroactivity as the *lesser evil* vs. distorting legal concepts. The student overstates Hart’s dismissal of legality. *What turns on it:* It risks misrepresenting Hart as indifferent to rule-of-law values; he is not, but prioritizes conceptual clarity.  

  ---

  ### Summary Comment to Student  
  Your treatment of Hart (a) is excellent, capturing his positivist stance and its stakes with clarity. Part (b) accurately lists Fuller’s eight desiderata but misrepresents his core argument by conflating procedural failures with substantive injustice and erroneously equating him with Radbruch. This also weakens part (c), as your critique of Hart relies partly on these misreadings. While your prose is confident and structured, ensure arguments precisely reflect each theorist’s distinct claims. Strong analytical framework, but accuracy in exegesis needs refinement.  

  ### Note to Teaching Assistant  
  **Potential Overlooked Errors in Quick Grading:**  
  1.  **Substantive Error (Comment #11):** Claiming Fuller invalidates the 1934 statute *due to its injustice* (Radbruch’s view) rather than systemic procedural defects. This is a major distortion of Fuller’s project.  
  2.  **Substantive Error (Comment #15):** Asserting Hart requires moral compliance for legal validity, directly contradicting his separation thesis. Might be missed due to the reference to "minimum content."  
  3.  **Imprecision (Comment #16):** Misapplying Hart’s "penumbra" to justify invalidating clear rules for injustice. This misconstrues Hart’s limited view of judicial discretion.  
  4.  **Coherence Issue:** Part (b)’s errors undermine the comparison in (c). The student’s preference for Fuller rests partly on misreadings (e.g., that Fuller explains the "rightness" of the verdict via substantive injustice, not procedural collapse). A quick read might miss this dependency.
