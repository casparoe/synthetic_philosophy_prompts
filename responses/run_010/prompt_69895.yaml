prompt: |-
  I'm three weeks into a stats-philosophy reading group in my department (mostly psych methods people plus one philosopher who says "the likelihood principle" like it ends conversations), and a guy in my cohort dropped this argument on us after the session on questionable research practices, and I have not been able to kill it. He's smart, he isn't trolling, and two other people in the group said some version of it has to be right. Here it is as best I can reconstruct it:

  (1) A p-value only means anything relative to a sampling procedure — it's the probability, assuming the null, of data at least as extreme as yours, and both "at least as extreme" and the sample space come from the procedure.
  (2) But whatever a researcher actually did — peeking every 15 participants, dropping outliers until the effect held, swapping the primary outcome, running six subgroups and reporting the one that worked — is itself some procedure, and any procedure has a well defined sample space.
  (3) So every study ever run has an honest p-value: the one computed under the procedure the researcher really followed, warts and all.
  (4) That number exists even if nobody can recover it, and an existing number is a number; it isn't the frequentist's fault that the researcher didn't write it down.
  (5) Therefore optional stopping and p-hacking don't make frequentist inference invalid, they just make the printed number different from the true one. The fix is bookkeeping, not a new philosophy of inference.
  (6) The Bayesian is in the same shape, only worse: their posterior rests on a prior that also can't be recovered from the data, and if the prior is off the posterior is off even when every step of the math is right.
  (7) So the story we were told — that the replication crisis shows frequentism is broken and vindicates Bayes — is backwards. Both views have exactly one uncheckable ingredient, and the frequentist's is at least pinned down by what physically happened in the lab.

  Here's what I need. I can't find an obviously false premise and I've tried: (2) sounds like it has to be true, and (4) sounds like a truism about numbers, but (5) feels like a cheat and (7) defintely overreaches somewhere. Go through it line by line, tell me which step you'd reject and why, and then price the alternatives — for each step you'd keep, say what someone who gives it up instead is giving up, because I suspect the interesting question is which plausible premise is cheapest to abandon rather than which one is flat false. Be explicit about whether you think this is a word doing two different jobs between two lines, or a valid chain with a merely questionable premise; don't tell me it's both unless you show me exactly where each problem sits. Two things I want you to fold in. First, a concrete case, because that's where our group got stuck: last year our lab ran a failed replication, n=60, the RA looked at the data after every 15 and told the PI when it seemed done, two participants got excluded under a rule nobody had written down beforehand, and the analysis in the paper wasn't the first one they tried. Is there a fact of the matter about what the real procedure was, such that (3) picks out a single number? My PI thinks (2) is where the bodies are buried but he never says why, and I can't tell if he has a reason or just an instinct, so don't take his word for it either way. Second, something I noticed and couldn't do anything with: we spent an hour earlier on how frequentists care about your stopping intentions and Bayesians say intentions are irrelevant, and this argument seems to be leaning hard on the frequentists caring about intentions — does that observation help me or hurt me? For what it's worth I'd rather give up (6) and (7) than (1), since I want p-values to mean something, but please don't let that steer you.

  No reading list, no citations, no author names to go look up — we meet Thursday and I can't research anything between now and then, so everything has to be argued from the steps themselves. American English please, and if your honest read is that some step is fine and it's the whole framing that's confused, say that instead of being polite about it.
reasoning: |-
  Okay, let me try to unpack this user's problem. They're part of a stats-philosophy reading group, mostly psych methods folks plus one philosopher. Their cohort member presented an argument defending frequentism against criticisms related to p-hacking and optional stopping. The user can't find flaws in the argument but feels something's off, especially about steps (5) and (7). They need a line-by-line rebuttal before their next meeting.

  Hmm, the core argument claims that every study has an "honest p-value" based on the actual procedure used, regardless of QRPs. The user's example involves a failed replication with data peeking, unwritten exclusion rules, and multiple analyses. They're stuck on whether there's a single "real procedure" defining that p-value.

  First, I need to tackle step (2). The user’s PI thinks this is where the problem lies. The argument says any researcher action defines a procedure with a sample space. But in practice, actions like peeking or exclusion aren't formalized procedures. They're messy, context-dependent decisions. Without documentation, reconstructing the exact process is impossible. The sample space becomes undefined because intentions and actions aren't fully recorded. 

  Then step (3) claims an "honest p-value" exists even if unknown. But if the procedure isn't well-defined, this number doesn't exist mathematically. Probability requires a defined sample space. Without that, there's no basis for the p-value calculation. It's not just unknown; it's undefined.

  Step (4) argues that the number exists regardless. But if the procedure isn't formalized, there's no number to exist. The user mentioned an RA peeking and unwritten exclusion rules. How would you even model that? The lack of predefined rules makes the sample space ambiguous. 

  For step (5), the claim that QRPs just create bookkeeping issues is misleading. The "true" p-value might be astronomically small or large, but without knowing the procedure, it’s irrelevant. Researchers can't compute it, making it useless for inference. The frequentist framework relies on knowing the procedure to interpret the p-value, which isn't possible here.

  The Bayesian point in (6) is a distraction. Yes, priors are uncheckable, but Bayesians don't claim otherwise. They’re upfront about priors being subjective. The issue isn't comparability but whether each framework's assumptions hold. The argument equivocates on "uncheckable" between frequentism (procedure) and Bayes (prior).

  Step (7) overreaches by saying frequentism is no worse than Bayes. But the replication crisis critiques focus on QRPs exploiting frequentist flexibility. Bayes isn't immune, but its issues differ. The problem isn't just uncheckable elements; it's how QRPs distort frequentist outputs in practice.

  The user's observation about stopping intentions is crucial. Frequentists needing intentions highlights their framework's vulnerability when intentions are murky. Bayesians don't rely on them, which might be a strength here. But the argument uses this reliance as a virtue, ignoring the practical impossibility of ascertaining intentions post-hoc.

  In their concrete example, the "real procedure" isn't a single entity. The RA's peeking frequency, the PI's decisions, unwritten exclusion rules—these aren't a coherent statistical procedure. Different analysts might model it differently (e.g., sequential testing vs. fixed sample). Without documentation, any "true p-value" is speculative, not factual.

  The user wants to keep (1) but is open to ditching (6)-(7). However, the flaw starts earlier. Steps (2) and (3) assume procedures are well-defined from actions, but in reality, they're not. Abandoning (2) means admitting that not every set of actions forms a valid statistical procedure. This preserves p-values' meaning under defined methods but acknowledges QRPs break those methods.

  Alternatively, rejecting (3) and (4) by arguing the "honest p-value" doesn't exist without a documented procedure. This maintains frequentism's rigor but requires strict pre-registration to work. 

  The user’s need is urgent—they need clear, citation-free reasoning. Emphasize that the argument’s failure is in treating informal actions as formal procedures. Without predefined rules, the sample space is indeterminate, making the "honest p-value" a myth. The Bayesian comparison is a red herring; both have issues, but QRPs exploit frequentist mechanics specifically.
answer: |-
  Here's the line-by-line takedown, targeting the weakest links without pulling punches. Your cohort's argument collapses at step (2) and (3), with (5) and (7) inheriting the flaws. The concrete case proves it.

  ### Step-by-Step Rebuttal
  **Step (1): Acceptable.**  
  Yes, p-values *are* defined relative to a sampling procedure. "At least as extreme" and the sample space depend on how data were collected and when you stopped. This is Frequentism 101. *If you abandon this, you abandon p-values entirely.*

  **Step (2): FALSE.**  
  *Why it fails:* "Whatever a researcher actually did" **does not automatically define a statistical procedure with a well-defined sample space**. Actions like "peeking every 15 participants" or "dropping outliers until the effect held" are **physical acts**, not formal statistical procedures. A *procedure* requires predefined decision rules (e.g., "stop if p<0.01 at any peek"). Without explicit rules, the sample space is **indeterminate**.  
  - *Your concrete case:* The RA peeked "every 15 participants" but told the PI "when it seemed done." What was the stopping rule? Was it p<0.05? p<0.01? A gut feeling? Without a predefined rule, there’s no way to specify the sample space (e.g., all possible sequences of peeks and stops). The "unwritten outlier rule" compounds this: without a pre-specified criterion, the sample space for exclusions is undefined.  

  **Step (3): FALSE (because 2 is false).**  
  *Why it fails:* If there’s no well-defined procedure (per step 2), there’s **no "honest p-value" to compute**. You can’t calculate "probability under the null" without knowing the set of all possible outcomes. If the procedure is ambiguous, the p-value is **nonexistent**, not merely unknown.  
  - *Your PI is right about (2) being where bodies are buried:* The argument assumes actions *inherently* define a procedure, but statistical procedures require **counterfactual definability** ("what *would* I have done if data looked different?"). Unrecorded, ad-hoc actions lack this.  

  **Step (4): Misleading.**  
  If the p-value doesn’t exist (because the procedure isn’t well-defined), there’s no "number" waiting to be recovered. Even if it existed, it’s **useless** if no one can compute or interpret it. The Frequentist framework relies on *knowing* the procedure to give the p-value meaning.  

  **Step (5): FALSE (inherits from 2-4).**  
  *Why it fails:* Optional stopping and p-hacking **do invalidate Frequentist inference** because they break the link between the *reported* p-value and its actual sampling distribution. The "fix" isn’t just bookkeeping—it’s **impossible to retroactively define the procedure** after seeing the data. The argument pretends a "true p-value" exists in a Platonic realm, but Frequentism isn’t Platonic; it’s operational.  

  **Step (6): Distraction.**  
  Yes, Bayesians need a prior, and it’s uncheckable. But this is **irrelevant** to whether Frequentism is broken by QRPs. Bayesians *acknowledge* the prior is subjective; Frequentists claim objectivity via the procedure. QRPs exploit that claim.  

  **Step (7): OVERREACH.**  
  The replication crisis **does** show a critical flaw in *how Frequentism is practiced*: its vulnerability to undisclosed flexibility. Bayes isn’t "vindicated," but the problem isn’t symmetric.  
  - Frequentism’s "uncheckable ingredient" (the procedure) **must be known to compute the p-value**.  
  - Bayes’ uncheckable ingredient (the prior) **is explicitly stated as part of the model**.  
  QRPs hide the procedure but can’t hide a prior.  

  ---

  ### How Your Stopping Intentions Observation Helps
  **It destroys the argument.**  
  - Frequentists **need** your intentions (stopping rules, outlier criteria) to define the sample space. But in your lab example, intentions were unrecorded and ambiguous.  
  - Bayesians **don’t care** about intentions (for posterior inference under a given model). The data are the data.  
  The argument leans on Frequentists caring about intentions—but then handwaves that intentions are magically recoverable. They’re not. Your RA’s "gut feeling" stopping rule **can’t** be pinned down post-hoc. This isn’t a virtue; it’s a fatal flaw.  

  ---

  ### The Escape Hatch: What to Abandon
  **Abandon step (2).**  
  - **Cost:** You admit that not every set of actions forms a "statistical procedure." Only *pre-specified, rule-based* methods do.  
  - **Why it’s the cheapest option:**  
    - Keeps p-values meaningful when procedures *are* predefined (saves step 1).  
    - Explains the replication crisis: QRPs work by *violating* the precondition for valid p-values.  
    - Aligns with your instinct to keep (1) and dump (6)/(7).  

  **Alternatives are worse:**  
  - Abandon (1): P-values become meaningless. Frequentism collapses.  
  - Abandon (3)/(4): Accept that "procedures" exist in a metaphysical sense. But then Frequentism loses its operational grounding.  

  ---

  ### Bottom Line
  The argument is clever but conflates **actions** with **procedures**. Actions without predefined rules don’t generate a sample space. No sample space → no p-value. The "honest p-value" in your lab example **does not exist** because the ad-hoc peeking and exclusion rules make the procedure indefinable. Frequentism isn’t "wrong," but it *is* fragile—and QRPs shatter it. Bayes has its own problems, but it doesn’t self-destruct when a grad student peeks at data. 

  Take this to your group: **If the procedure isn’t documented, it isn’t recoverable. If it isn’t recoverable, the "true p-value" is a statistical ghost.**
