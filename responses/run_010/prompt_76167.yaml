prompt: |-
  I serve on the programming committee of the only civic theatre in a market town of some forty thousand people. Ten years ago the committee adopted an unusual standing rule: every proposal is to be tested against the case made in Rousseau's letter to d'Alembert on the theatre, and the grounds of each decision are to be minuted in Rousseauian terms. The minutes record the committee's own reasoning rather than quotations from the letter, and no member of the committee is a scholar of it. Our record to date runs as follows.

  1. A touring production of Molière's *Le Misanthrope*, professional, ticketed, three nights in the town hall. Refused. Minute: the one character who says plainly what he thinks is written as an insufferable bore, and the audience leaves in sympathy with the polished evasions of those who mock him; a play that renders honesty ridiculous is not excused by the honest man also being tiresome.

  2. A classical five-act tragedy in verse, professional and ticketed, whose entire action consists in a ruler's passion for a captive princess and his eventual decision to send her away at the cost of his own happiness. Refused, narrowly. Minute: an evening given wholly to a passion that has already made a public man forget his duty leaves the house tenderer than it arrived and no better able to act, and nothing in the play costs anybody anything.

  3. A West End musical on a two-night stop, top-price tickets, no local performers and no local involvement of any kind, whose hero is a likeable rogue who swindles everyone on stage and is last seen making off with the money. Refused unanimously. Minute: vice is here rendered so agreeable and so successful that no punishment ever arrives, and the town pays for the pleasure of admiring it.

  4. An offer of a legacy sufficient to build a four-hundred-seat playhouse and endow a resident professional company. Declined. Minute: a town of our size does not want a playhouse; a great city whose morals are already gone may reasonably decorate its corruption with a theatre, whereas we should pay for ours in idle evenings, in money diverted from work and family, and in the loss of the amusements we can make for ourselves. The legacy was accepted instead for a bandstand and for the floodlighting of the market square.

  5. The midsummer gathering in the market square: no stage, no enclosure, no tickets, no performers, a pole planted in the centre, two brass bands, long tables, the whole town dancing. Minuted as the committee's model of a public occasion, on the ground that there the people are their own spectacle and nobody is cut off from anybody else by a row of seats or by a payment.

  6. A play written and performed by fourteen-year-olds from the town's secondary school about the dispute over the closing of the factory, played twice to their own families, free. Approved without discussion. Minute: they are not watching themselves represented by strangers; they are speaking, and their audience is composed of people who know them.

  7. An improving modern drama staged by the town's amateur dramatic society in the town hall at fifty pence, in which a corrupt building contractor is exposed and a generous doctor rewarded; the minute records that the house wept at the close. Approved with enthusiasm, on the ground that virtue was made lovable and vice hateful and that the money stayed in the town.

  The case now before us is this. A company has offered a free promenade production in the market square over one weekend, funded entirely by a regional arts grant, so that nothing is charged to the audience and nothing is drawn from local pockets. The piece is built from verbatim transcripts of our own council minutes and of interviews with former workers at the closed factory. It is performed by eight paid professional actors alongside some thirty unpaid local volunteers. There is no stage, no seating and no enclosure; the audience walks among the action, is twice asked to vote on what should happen next, and is once asked to speak a line in chorus. In the piece as written, the character who comes off worst is a long-serving and widely respected local magistrate, played throughout as a pompous fraud; and the character the audience is plainly meant to warm to is a sharp-tongued machinist who mocks everyone, including the two honestly drawn characters, and who ends by shrugging and taking a better-paid job with the developer who closed the factory.

  What I should like from you:

  (a) the verdict the committee ought to reach if it is to be consistent with its own record, with reasons;

  (b) the candidate rules that accommodate all seven precedents equally well, stated precisely enough to be applied to a new proposal, together with what each of them implies about the case now before us;

  (c) which single precedent is the closest analogue, and on which axis it is closest, given that here the structure of the occasion, the content of the piece, and the question of money do not point the same way;

  (d) an honest account of the principle the committee would be adopting with each option available to it — refusal, unqualified approval, and approval subject to conditions such as cutting the ridicule of the magistrate or giving the honestly drawn characters the last word — including what approval-on-conditions would commit us to about other people's scripts in future;

  (e) the further case that would tell the competing rules apart, and, if it is a different case, the one that would settle whether the structural limb of our record (no enclosure, no tickets, the people as their own spectacle) or the professional limb (paid impersonators who sell themselves by the evening) is doing the real work in the approvals and refusals we have already given;

  (f) where the reasons minuted at items 1 to 7 depart from arguments actually available in Rousseau's letter, and whether any of those departures should be corrected before we decide this case. Item 7 is the one I have in mind, since the committee there appears to have treated the weeping of the audience as a point in the play's favour.

  Please write in British English. I am not asking for citations, a bibliography or a reading list, and no quotations from Rousseau are required; work from the record set out above and from your understanding of the argument of the letter.
reasoning: |-
  Hmm, this is a fascinating and complex query from a theatre programming committee member. They've presented seven historical decisions made through a Rousseauian lens and now need guidance on an eighth case involving a promenade production in the market square. 

  First I need to internalize the committee's existing framework. The Rousseauian principles seem to focus on: whether theatre corrupts morals by making vice appealing (cases 1 & 3), whether it promotes idleness over civic duty (case 2 & 4), and whether community participation trumps professional performance (cases 5 & 6). Case 7 is interesting because it appears to contradict Rousseau's skepticism about theatre's moral utility - but the minute justifies it through local economic benefit rather than moral improvement.

  For the current case (8), three dimensions conflict: 
  Structurally it meets Rousseauian ideals (free, unenclosed, participatory). 
  Financially it's impeccable (externally funded). 
  But content-wise it glorifies cynicism (machinist character) and attacks a respected local figure.

  On consistency (part a): refusal seems inevitable because the committee has consistently rejected works that ridicule virtue (1), glorify vice (3), or undermine respected institutions. The magistrate portrayal violates their protection of social dignity seen in case 7's approval of exposing "corrupt contractors" but not pillars of the community.

  For candidate rules (part b): 
  Rule 1 (content-primary) would refuse this play for mocking virtue. 
  Rule 2 (structure-primary) would approve due to participatory format. 
  Rule 3 (local economy focus) would approve since money stays local. 
  The committee's record suggests Rule 1 dominates - they refused Molière despite its artistic merit because of content.

  Closest precedent (part c) is case 1: both involve professional actors ridiculing honesty. The structural differences make this case harder, but content similarity weighs heavier.

  On principles (part d):
  - Approval would undermine their consistent protection of virtue
  - Conditional approval (removing magistrate ridicule) would create precedent for censoring content - problematic for future verbatim works
  - Refusal maintains integrity but may seem inconsistent with structural approvals

  For test cases (part e):
  - A professional ticketed play celebrating community values would test whether structure or content matters more
  - An enclosed free event mocking outsiders would test financial vs moral considerations

  Finally on Rousseau deviations (part f):
  Case 7's approval for making "virtue lovable" actually contradicts Rousseau's deeper argument that theatre manufactures false morality. The committee should recognize this but their practical approach values local economic benefit over pure theory.

  The core tension is whether the participatory format redeems problematic content. Given the committee's history of prioritizing moral protection over form, refusal seems most consistent - even if philosophically debatable.
answer: |-
  Based on the committee's minuted reasoning and its application of Rousseauian principles as demonstrated in the seven precedents, here is the analysis for the current case:

  **(a) Verdict and Reasons for Consistency**  
  The committee **ought to refuse** the promenade production.  
  *Reasons*:  
  - **Content undermines virtue and ridicules respectability**: The portrayal of the magistrate as a "pompous fraud" aligns with *Le Misanthrope* precedent (Case 1), where ridicule of honesty was condemned. Rousseau argues theatre corrupts by making vice appealing or virtue ridiculous. Here, a respected public figure is maliciously caricatured, while the unpunished, cynical machinist (who abandons community for gain) is glorified – mirroring the refusal of the swindler-hero musical (Case 3).  
  - **False participation mitigates but does not redeem**: While the promenade structure (no enclosure, audience interaction) echoes the approved midsummer gathering (Case 5), Rousseau distrusts *scripted* performances even in open settings. The volunteers' involvement resembles the school play (Case 6), but the professionals' dominance and the script’s contrived audience lines ("speak a line in chorus") risk *simulating* community rather than embodying it. The vote gimmick cannot offset the script’s moral harm.  
  - **External funding is irrelevant to moral danger**: Case 4 rejected a playhouse *despite* financial benefit, prioritising moral/social cost over money. Similarly, Case 3 refused a show drawing money *into* town due to its corrosive message. Funding source does not sanitise content that violates Rousseau’s core caution: theatre should not erode civic virtue or mock integrity.  

  **(b) Candidate Rules and Implications**  
  Three rules accommodate all seven precedents:  

  1. **Rule A (Content Primacy)**: *Refuse any performance that depicts virtue as contemptible, vice as admirable, or ridicules civic integrity without poetic justice.*  
     - *Implication for current case*: Refusal. The magistrate (civic virtue) is ridiculed; the machinist (vice: cynicism, betrayal) is rewarded.  
     
  2. **Rule B (Structure Primacy)**: *Approve only unenclosed, unticketed, non-professional-led events where the community are primary actors and spectators.*  
     - *Implication*: Refusal. Professionals lead; volunteers are subsidiary. Scripted audience lines simulate participation.  
     
  3. **Rule C (Local Moral Economy)**: *Approve only if (i) virtue is made lovable/vice hateful, AND (ii) money stays local or event is free, AND (iii) community voices dominate strangers.*  
     - *Implication*: Refusal. Vice (machinist) is made admirable; professionals overshadow locals; moral harm outweighs free entry.  

  **(c) Closest Analogue and Axis**  
  - **Closest precedent**: Case 1 (*Le Misanthrope*).  
  - **Axis**: Content (ridicule of honesty/virtue). Both depict plain-speaking integrity as contemptible (Alceste/magistrate) and reward moral compromise. Structural differences (enclosed/ticketed vs. promenade/free) are secondary to this core moral objection.  

  **(d) Principles Adopted with Each Verdict**  
  - **Refusal**: Adopts the principle that *protecting civic virtue from ridicule outweighs all structural or financial advantages*. This commits the committee to refusing any future work mocking respected local figures or glorifying selfishness, regardless of format or funding.  
  - **Unqualified Approval**: Adopts the principle that *participatory structure and external funding absolve harmful content*. This would compel approval of future events with corrosive messages if similarly staged, undermining Cases 1, 3, and 7.  
  - **Approval with Conditions (e.g., cut magistrate ridicule, empower honest characters)**: Adopts the principle that *the committee may censor scripts to enforce moral outcomes*. This commits the committee to future content edits, contradicting Case 6 (which trusted youth’s unmediated voices) and Case 7 (which approved an uncensored amateur script).  

  **(e) Cases to Test Competing Rules**  
  - **Test Case 1**: *A free, promenade production by locals (no professionals) satirising the town mayor as corrupt, ending with his downfall.*  
    - Rule A (Content) refuses (ridicules authority).  
    - Rule B (Structure) approves (community-led, unenclosed).  
    - Rule C (Moral Economy) refuses (vilifies civic figure; no "lovable virtue").  
    - *This distinguishes Rules A/C from B*.  
  - **Test Case 2**: *A ticketed, enclosed tragedy about a self-sacrificing local midwife, performed by professionals, with profits funding the town hospice.*  
    - Rule A approves (virtue lovable).  
    - Rule B refuses (professional/enclosed).  
    - Rule C refuses (money leaves town; professionals dominate).  
    - *This distinguishes Rule A from B/C and clarifies that content dominates structure in past decisions* (Case 2 refused a virtue-adjacent tragedy due to structure, but Case 7 approved an enclosed amateur play due to content).  

  **(f) Departures from Rousseau and Corrections**  
  - **Case 7 (Improving Drama)**: The minute cites audience weeping as approval grounds. Rousseau *rejects* emotional catharsis as morally improving (*Letter*, Section V). He argues theatre indulges passive sentiment, weakening resolve for real virtue. The committee should correct this by emphasising *why* the play worked: it made vice *hateful* (not just pitiable) and virtue *active* (the doctor’s reward), aligning with Rousseau’s demand that theatre spur emulation of goodness.  
  - **General Departure**: The committee focuses on *local* moral/social effects (money staying, community cohesion). Rousseau’s concern is universal: theatre substitutes illusion for authentic civic life. This local lens is pragmatically justified but should not override his core caution against *any* performance that normalises vice or scorns integrity.  
  - **Correction for Current Case**: Ignore the audience weeping fallacy. Focus solely on whether the script rewards vice and attacks virtue, per Rousseau’s warning that theatre "renders [evil] passions agreeable" (cf. Case 3).  

  ---  
  **Summary for Decision**:  
  Consistency with precedent demands **refusal**. The production’s structural merits (free, participatory) and funding are secondary to its violation of the committee’s bedrock principle: *never endorse work that ridicules integrity or rewards vice*. Conditionally approving would betray your record of judging content rigorously and set a precedent for censorship. Rule A (Content Primacy) best captures your seven verdicts, and this case fails it unequivocally.
