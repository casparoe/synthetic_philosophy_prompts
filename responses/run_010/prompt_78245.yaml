answer: |-
  ### 1. The Toast (Approx. 650 words)

  Friends, colleagues, students past and present, Miriam’s wonderful family... thank you all for being here to honour Miriam after thirty-eight remarkable years. Thirty-eight years! That’s longer than some of our undergraduates have been *alive*. And Miriam, you’ve filled every single one of those years with fierce thinking, passionate teaching, and arguments… oh, the arguments! Some of us have been on the receiving end of those, haven’t we? But always, always, in the pursuit of something deeper, something true. It’s that pursuit we celebrate tonight.

  Miriam built her career wrestling with a giant: the challenge Kurt Gödel posed to the very idea that our minds might be machines. But Miriam wasn’t chasing ghosts or quantum spooks in the brain. Her focus was razor-sharp. While others might have leaned on Gödel’s first theorem, Miriam always insisted the real bite came from the *second* one. Her argument wasn’t just that machines couldn’t prove *everything*; it was that a machine, if it *were* consistent, could never truly *prove to itself* that it *was* consistent. Imagine that! She saw this as posing a profound dilemma for the mechanist view: either we *aren't* machines, or if we *are*, we could never definitively *know* which particular machine we are supposed to be. That fundamental uncertainty, that inability for a system to fully grasp its own foundations from the inside – that was the core she returned to, refining it year after patient year.

  And in her final decade, Miriam’s focus shifted beautifully. Less on the ‘gotcha!’ conclusion, and more on what the *struggle* with Gödel revealed about us. She saw how both sides – those arguing for minds as machines and those arguing against – were quietly relying on an ideal picture. They imagined perfect, self-transparent, infallible reasoners, gliding effortlessly through proofs. But Miriam knew better. She knew real reasoners – like herself, like all of us here – are finite. We get tired. We make mistakes. We scribble notes and cross them out. We argue passionately, sometimes inconsistently, and we *learn*. That gap, Miriam argued, between the idealised thinker in the textbooks and the wonderfully messy, error-prone, mortal thinkers we actually are… *that* was the debate’s most illuminating revelation. The argument exposed our own assumptions about what reasoning even *is*.

  Which brings me to Miriam herself. Because anyone who knows Miriam knows she has absolutely *no time* for idealisations, especially about people. If I stood up here tonight and declared that Professor Miriam had been a model of perfect, unwavering logical consistency for four decades… well, first, she’d raise an eyebrow. Then she’d probably clear her throat. And finally, she’d point out, quite rightly, that I’d just described somebody utterly unrecognisable. Someone nobody ever met! The *real* Miriam, the one we honour, is gloriously, productively *human*. She changed her mind when evidence demanded it – famously refusing to hitch her wagon to any speculative quantum stories about the brain, insisting the logical argument stood, or fell, on its own terms. She got frustrated. She celebrated triumphs. She mentored generations of students, not by giving them perfect answers, but by showing them how to grapple honestly with incredibly hard questions. Her strength isn't some impossible, frictionless consistency; it’s her *integrity* in the face of complexity, her perseverance through doubt, her willingness to refine and rebuild her own ideas, year after year. That’s the Miriam whose influence echoes in this room – in her colleagues inspired by her rigour, in her students scattered across the world putting their logical training to use, even in building things she might debate fiercely, and most profoundly, in the love of her family who know her not as a theorem, but as Mum, Grandma, Miriam.

  So, Miriam, here’s to you. Not to some flawless, idealised thinker in a vacuum, but to the brilliantly real, tenacious, insightful colleague and friend who has challenged us, taught us, and made this department, and all our intellectual lives, infinitely richer for thirty-eight years. To your profound inquiry into the limits of knowledge and the nature of mind. To your refusal to take shortcuts, whether in logic or in life. And most of all, to the wonderfully consistent inconsistency of being passionately, definitively *you* through it all. Ladies and gentlemen, colleagues, friends, family… please raise your glasses: To Miriam!

  ### 2. What Each Part is Doing

  1.  **Opening (Friends...):** Warm, inclusive greeting. Sets celebratory, slightly humorous tone ("longer than undergraduates... alive"). Acknowledges her argumentative nature affectionately. Aims at *all* (family hears warmth, colleagues hear recognition of her style).
  2.  **Core Argument Summary (Miriam built... dilemma):** Directly states her focus (2nd theorem vs 1st) and the core dilemma (machine -> can't know itself). Uses accessible analogy ("Imagine that!"). Ensures *logicians/philosophers* hear accuracy. *Family* hears the *kind* of big question she tackled.
  3.  **Shift to Idealisation (And in her final decade...):** Explains her later focus on the gap between ideal and real reasoners. Uses relatable descriptions ("get tired," "make mistakes," "scribble notes"). *Logicians* hear the key philosophical pivot. *Family/students* understand the "human" aspect of her work. **Structural Work:** This theme *is* the bridge to celebrating her *personally*.
  4.  **Anti-Idealisation & Introduction of Miriam the Person (Which brings me... unrecognisable):** Explicitly rejects idealising *her* ("no time for idealisations"). Uses the hypothetical false claim ("perfect consistency") to land the **Joke**. *Logicians* hear the Gödelian point about self-certified consistency failing. *Family/students* hear an affectionate story about her stubborn realism/honesty. The *11-year-old* can be told: "Grandma always said pretending people are perfect is silly; they’re interesting *because* they’re real." **Idealisation Theme:** This *is* the tribute – affection stems from celebrating her *lack* of impossible perfection.
  5.  **Celebrating Real Miriam (The *real* Miriam...):** Lists her human qualities (changed mind, integrity, perseverance, mentorship through struggle). Acknowledges Penrose rejection neutrally ("refusing to hitch her wagon"). Highlights impact (colleagues, students, family). *All* groups see her multifaceted contributions. *Family* hears core traits they know. *Students/Industry* hear recognition of their journey. *Logicians* see her intellectual honesty.
  6.  **Toast & Closing (So, Miriam... To Miriam!):** Sums up the tribute: real over ideal, celebrating her specific virtues (tenacity, insight, refusal of shortcuts). Repeats the "consistent inconsistency" **Joke** structure for a warm finish. Direct, heartfelt toast. *All* feel included in raising a glass.

  ### 3. Sceptic's Audit

  A sceptic (believing the Gödelian anti-mechanist argument fails) could endorse the following claims without embarrassment:

  *   Her research program defended the Gödelian anti-mechanist argument.
  *   Her favoured version rested on the second incompleteness theorem.
  *   She argued the mechanist thesis, to deliver its conclusion, requires self-transparency.
  *   Gödel’s second theorem shows a consistent formal system cannot prove its own consistency.
  *   She presented a dilemma: either we aren't machines, or if we are, we can't know which one.
  *   In her last decade, she emphasized the argument exposed an idealisation of reasoners.
  *   Both sides of the debate often rely on an ideal of perfect, self-transparent reasoners.
  *   Real human reasoners are finite, error-prone, and mortal.
  *   She rejected Penrose's physical conjecture (microtubules/quantum gravity) as unnecessary/embarrassing.
  *   She insisted the logical argument should stand on its own.

  **Flagged Line & Replacement:**
  *   **Original:** "...so that the honest upshot is a dilemma — either I am not a machine, or, if I am, I can never come to know which one I am."
  *   **Concern:** "the honest upshot" implies this is the *correct* conclusion drawn from the argument. A sceptic believes this conclusion doesn't follow.
  *   **Replacement:** "...so that she presented a dilemma: either we are not machines, or if we are, we can never come to know which one we are." (Neutrally states *her* presentation of the dilemma).

  ### 4. What I Left Unsaid

  I excluded:
  *   **"Brilliant" or "Genius":** While deeply respected, she despised flattery. Calling her "insightful" or "profound" focuses on the *quality* of her inquiry, not an innate, idealised brilliance.
  *   **"Unwavering Conviction":** Her willingness to refine her argument over decades shows conviction *tempered* by intellectual honesty, not dogma. "Tenacious" captures persistence without implying rigidity.
  *   **"Solved the Mind-Body Problem" or "Defeated Mechanism":** This overstates her claim and would be false flattery. She advanced a *specific argument* against one formulation of mechanism, focusing on its *implications*.
  *   **"Beloved by All" or "Conflict-Free":** Acknowledging her argumentative nature and critics is more honest and true. Warmth comes from respecting her engagement, not pretending it was always smooth.
  *   **"Perfect Mentor/Teacher":** Highlighting her mentorship through *struggle* and *honesty* ("grapple honestly") is more authentic than implying effortless perfection.

  **Cost of Exclusion:** Omitting superlatives doesn't diminish the tribute; it strengthens it. Celebrating her *actual* qualities – rigour, perseverance, integrity, impact through real engagement – grounded in her own rejection of idealisation, creates a warmer, truer, and more respectful portrait. It honours her philosophy by applying it to *her*.
