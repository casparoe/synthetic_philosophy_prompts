  ### Decision Tree for Novelists: Uncovering Implicit Metaphysics of Time

  **Tree Structure (10 Nodes)**  
  Each node is a concrete craft question derived from your manuscript's structural choices. The tree avoids labels, focuses on textual decisions, and delivers a position on time's reality. Axes:  
  - **A-theory/B-theory**: Cross-cutting dimension (embedded in questions about tense, presence, and fixity).  
  - **Branching vs. single-track**: Node 7 (explicitly addresses narrative consistency).  

  1. **When you narrate past events, can a character's present actions *alter* what happened?**  
     - *Yes* → Node 2  
     - *No* → Node 3  

  2. **Are multiple, mutually exclusive versions of the same event presented as equally real?**  
     - *Yes* → Branching time (not a leaf; proceed to Node 8)  
     - *No* → Unoccupied cell (mutable past without branching; incoherent → no position adopts this)  

  3. **Does your future-perfect section describe events with certainty (no ambiguity or contingency)?**  
     - *Yes* → Node 4  
     - *No* → Node 5  

  4. **If the present moment were fully specified, would it settle every detail of the next chapter?**  
     - *Yes* → Node 6  
     - *No* → Node 7  

  5. **Can a character's death cease to be a fact about the world once forgotten?**  
     - *Yes* → Node 9  
     - *No* → Node 10  

  6. **Are two of your four narrations of the same three days mutually inconsistent?**  
     - *Yes* → Branching block universe (leaf)  
     - *No* → Block universe (leaf)  

  7. **Is a chapter placed out of chronological order a *discovery* (revealing inherent structure), not just rearrangement?**  
     - *Yes* → Node 8  
     - *No* → Relational view (leaf)  

  8. **Can a scene be told backward without loss of meaning?**  
     - *Yes* → Idealist denial (leaf)  
     - *No* → Growing block (leaf)  

  9. **Does the narrative access past events with the same immediacy as the present?**  
     - *Yes* → Moving spotlight (leaf)  
     - *No* → Presentism (leaf)  

  10. **Does the future-perfect narrator’s knowledge exceed what the characters could know?**  
      - *Yes* → Block universe (leaf)  
      - *No* → Presentism (leaf)  

  ---

  ### Leaves (Metaphysical Positions)  
  Each leaf includes:  
  - **Cost to novelist**: Awkward commitment in the fourth year.  
  - **"True" narration**: Which of your four tense-based narrations must be canonical (if any).  

  1. **Presentism** (Node 9→No or Node 10→No)  
     - *Cost*: You cannot write past events as actively shaping the present without implying their residual reality.  
     - *True narration*: The present-tense section (only the "now" is real).  

  2. **Growing Block** (Node 8→No)  
     - *Cost*: Future events must feel open and unwritten, clashing with the future-perfect section's certainty.  
     - *True narration*: The past-tense section (past/present real; future ideal).  

  3. **Block Universe (Eternalism)** (Node 6→No or Node 10→Yes)  
     - *Cost*: Characters’ choices must lack genuine contingency, reducing tension.  
     - *True narration*: All four equally (all times are equally real).  

  4. **Moving Spotlight** (Node 9→Yes)  
     - *Cost*: The "moving now" must be constantly re-centered in narration, disrupting omniscient pacing.  
     - *True narration*: The present-tense section (the spotlight is the "now").  

  5. **Relational View** (Node 7→No)  
     - *Cost*: Events cannot imply absolute simultaneity; time must emerge *only* from event sequences.  
     - *True narration*: None (tense is incidental; only order matters).  

  6. **Idealist Denial** (Node 8→Yes)  
     - *Cost*: Succession must be an illusion; flashbacks/forwards cannot imply temporal depth.  
     - *True narration*: None (all narrations are equally unreal).  

  7. **Branching Block Universe** (Node 6→Yes)  
     - *Cost*: Every divergence multiplies timelines, bloating the manuscript with alternate versions.  
     - *True narration*: All four (each is real in a branch).  

  **Flagged Pairs**  
  - **Block Universe vs. Branching Block Universe**: Separated by Node 6 (narrative consistency). If Node 6 is unanswered, no craft question divides them.  
  - **Presentism vs. Growing Block**: Separated by Node 9 (past accessibility). If Node 9 is skipped, ask: *"Do past events retain causal power independent of present records?"* (Yes→Growing Block; No→Presentism).  

  ---

  ### Borges in the Tree  
  **Essays**  
  - **"New Refutation of Time" (extending Berkeley/Hume)** → *Idealist Denial*. Argues time is a mental construct; succession is unreal. *Provisional* (recalled outline; matches Node 8→Yes).  
  - **"History of Eternity"** → *Block Universe*. Treats eternity as a static totality. Node 6→No or Node 10→Yes.  
  - **"Avatars of the Tortoise"** → *Relational View*. Time as infinite regress of intervals, dependent on perception. Node 7→No.  

  **Stories**  
  - **"The Secret Miracle" (condemned man’s subjective year)** → *Presentism*. Inner time collapses succession; only the instant is real. Node 9→No.  
  - **"Funes the Memorious" (perfect memory without abstraction)** → *Growing Block*. Past is exhaustively real but paralyzes present. Node 8→No.  
  - **"The Garden of Forking Paths" (labyrinth of branching times)** → *Branching Block Universe*. Mutually inconsistent futures coexist. Node 6→Yes.  

  **Undetermined Texts**  
  - **"Avatars of the Tortoise"** is ambiguous between relational and idealist views. The tree cannot resolve it (Node 7 and Node 8 conflict; Borges is deliberately paradoxical).  
  - Instrument is **too coarse** for Borges’ layered contradictions; stories and essays answer different questions (e.g., "Funes" emphasizes time’s weight, while "New Refutation" denies its existence).  

  ---

  ### Unoccupied Cells  
  Cross-product of axes:  
  1. **A-theory + Branching**  
     - *Example*: Presentism with branching futures.  
     - *Empty because*: Incoherent. If only the present is real, branching futures cannot exist.  
  2. **B-theory + Idealist Denial**  
     - *Example*: Eternalism where time is unreal.  
     - *Empty because*: Unattractive. B-theory reifies time; idealism dissolves it.  
  3. **Relational + Branching**  
     - *Example*: Time as event order, with parallel sequences.  
     - *Empty because*: Nobody has thought of it (or novelists have, but philosophers ignore it). **← Your target cell.**  

  —  

  **Final Note**  
  The tree’s unresolved cell—*relational branching time*—is where your novel belongs. No philosopher claims it, yet craft choices (e.g., tense shifts as forks in event-order) could embody it. Borges gestured here but retreated to idealism. Your four narrations, read as *simultaneous orderings*, not fixed truths or branches, might inhabit this void.
