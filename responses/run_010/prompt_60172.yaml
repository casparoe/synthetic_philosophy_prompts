answer: |-
  Right, here's one aiming for that precise scope slip, in British English prose:

  Berkeley challenges the sceptic to conceive of a tree existing unconceived. The sceptic grins, "Easy! I've just done it – a great oak, right there, mind-independent!" Berkeley sighs, "Quite. You conceived *of* it. The 'it' you conceived *of* was, necessarily, conceived. That tree exists only *as conceived*. You haven't conceived it *unconceived*, you've merely conceived *the proposition* 'unconceived tree'. Jolly difficult to manage the other way, actually."

  **Why it hits the mark:**
  1.  **Sets up the challenge:** Directly references Berkeley's move ("conceive of a tree existing unconceived").
  2.  **Confident refuter:** The sceptic thinks they've succeeded ("Easy!... mind-independent!").
  3.  **The Turn (Scope Slip):** Berkeley points out the refuter conceived *of* the tree (trivially true, everything conceived *of* is conceived) and conceived the *proposition*. He explicitly separates this from conceiving the tree *itself* in an unconceived state ("You haven't conceived it *unconceived*...").
  4.  **The Punchline:** Highlights the impossibility Berkeley exploits ("Jolly difficult to manage the other way") – landing squarely on the distinction between conceiving *that* something unconceived exists (which involves conceiving a proposition) and conceiving the *actual unconceived existence itself* (which Berkeley argues is impossible, hence idealism).
  5.  **For the Cognoscenti:** Only someone who grasps the scope ambiguity (conceiving *of* X vs. conceiving X *in a specific state*) will get why Berkeley's response isn't just pedantry but the core of the argument.

  Hope it gets a knowing chuckle (and maybe a groan) from the philosophy crowd at the pub!
