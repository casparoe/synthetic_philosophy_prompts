prompt: |-
  I'm the recording secretary for my university's student senate and I've spent this semester trying to work out what rule we're actually applying, because the chair swears we have one and half the senators swear we don't. Backstory: a few years ago the senate passed a bylaw saying that when we take an official position on something that would bind other students or ask the administration to change a policy, the sponsor has to justify it "in terms all members can reasonably be expected to endorse." Nobody ever wrote down what that means, nobody has amended it, so it's just been applied case by case, and I'm the one who has to minute the reasoning. Here's the track record from the last two years:

  - A resolution pushing the administration to fund a free breakfast program passed. The sponsor read a bit of the Gospel of Matthew about feeding people, then spent most of her five minutes on attendance data and a cost estimate. Nobody invoked the bylaw.
  - A resolution asking the university to drop its ROTC contract was ruled inadmissible before a vote. The sponsor was a Quaker and said his whole reason was that killing is wrong and that he couldn't put it any other way; the chair asked twice for something else and he declined. Three senators said on the record that they agreed with him about ROTC and would have voted yes.
  - Fossil fuel divestment passed. Sponsor cited an encyclical on caring for creation and then a slide of temperature data. One senator objected that the encyclical was doing real work in the speech and not just decoration, and was overruled.
  - A resolution asking the student health center to stop handing out information about medication abortion was ruled inadmissible. Stated reason was that the fetus is a person from conception because scripture says so, and again the sponsor refused, when asked, to offer any other ground.
  - A living wage resolution passed with a justification that never mentioned religion once: Kantian dignity, plus a fairly technical argument about background justice and what counts as voluntary agreement. Two senators complained that academic philosophy is no more "reasonably endorsable" than theology is, one said the bylaw obviously doesn't police philosophy, and the chair let it slide.
  - A resolution honoring a local synagogue's 150th anniversary passed unanimously. Someone asked whether the bylaw applied; chair said no, it's expressive, it doesn't ask anybody to do anything.
  - A resolution asking the administration to cancel classes during Easter week was ruled inadmissible, on the stated ground that it would push a majority religion's calendar onto everyone. But a companion item the same month, asking that required labs not be scheduled Friday afternoons, was ruled admissible and passed; the sponsor's reason was entirely about Muslim students not being made to choose between class and mosque, and no one objected.

  Next week's item is the one I'm dreading. It asks the university to stop scheduling final exams on Saturday mornings. The sponsor is from a tiny evangelical group, and his reason — in the packet and in his speech — is that God commands a seventh-day rest and the university shouldn't arrange things so that observant students have to pick between an exam and obedience. No data, no appeal to fairness, no mention of the fact that the university already grants religious and medical exam accommodations anyway and that only a handful of students would be affected. A senator asked him during committee whether he'd accept a secular version of the argument and he said no, the religious reason IS the reason and he wasn't going to dress it up for us. Substantively it would probably pass, and several of the yes votes are the same people who waved through the divestment speech and are now saying this one is different. One of them has started calling the bylaw "that proviso thing" and claiming it only requires public reasons eventually, not up front, which I don't think is what the chair has been doing.

  So: what rule best explains all seven of those precedents? Lay out the candidate rules explicitly — I can think of at least (i) religious reasons are fine so long as a public reason is also offered, whenever, (ii) religious reasons are fine so long as some public reason exists, whether or not anyone states it, (iii) we only police doctrines when the resolution would coerce people or impose one group's calendar, so philosophy and ceremonial stuff are exempt, (iv) what we're really tracking is minority-burdening versus majority-imposing, and (v) the bylaw is a figleaf and we're just voting our preferences and reaching for it when we lose. Say which precedents each rule fits cleanly and which ones it has to explain away or write off as errors. Then predict the chair's ruling on the Saturday-exam item and the senate's vote, with reasons — and separately tell me whether it should matter that the religious reason here is itself about religious liberty, i.e. second-order in a way the ROTC and abortion cases weren't. I also have to write the minutes, so I'd like to be able to say what standard we'd be adopting if we admit it and what different standard we'd be adopting if we don't, rather than just recording the outcome. And if the seven precedents genuinely underdetermine the ruling, describe the smallest hypothetical resolution that would split the candidate rules cleanly, so I can suggest it to whoever chairs next year.
reasoning: |-
  Hmm, the user is a recording secretary for a student senate dealing with a vague bylaw about justifying resolutions "in terms all members can reasonably be expected to endorse." They've provided seven precedents and need help figuring out what rule actually explains them all. 

  The user's frustration is palpable - they're stuck documenting inconsistent applications of this bylaw while preparing for a contentious vote about Saturday exams. Their core need is clarity: they want to understand the implicit rule governing these decisions so they can accurately minute next week's ruling. But there's also an unspoken tension here - they seem to want procedural fairness while suspecting the senate might be applying the rule selectively based on political preferences.

  Breaking down the precedents:
  - Free breakfast passed with mostly secular data (Matthew mention ignored)
  - ROTC rejection: Quaker sponsor refused non-religious justification
  - Divestment passed despite encyclical reference (objection overruled)
  - Abortion info resolution rejected for solely scriptural reasoning
  - Living wage passed with Kantian philosophy (religion comparison dismissed)
  - Synagogue anniversary passed as "expressive" (no action requested)
  - Easter cancellation rejected but Muslim lab accommodation passed

  The Saturday exam case is tricky because it mirrors rejected cases (solely religious reasoning) yet resembles passed cases (minority accommodation). The sponsor's refusal to offer secular grounds is the flashpoint. 

  Possible rules I'm considering:
  1) Religious reasons require supplementary public justification (matches divestment/living wage but not ROTC/abortion rejections)
  2) Justifications must avoid coercion (explains Easter vs Muslim lab difference)
  3) Minority burdens vs majority impositions (Easter cancellation rejected as majority imposition while Muslim accommodation protects minority)
  4) Raw political preferences (explains inconsistencies but cynical)

  The minority-burden framework fits best overall, though it strains on the living wage case. For the exam resolution: it should be ruled inadmissible under consistent application (solely religious reasoning + refusal to supplement) but might pass due to substantive support. The religious liberty angle doesn't change the analysis - the sponsor still offers only theological grounds.

  For future clarity, I'll suggest a test case about kosher meal funding with exclusively religious reasoning. That would force senators to confront whether they're rejecting theology per se or just unsupplemented theology.
answer: |-
  Based on the seven precedents, here's a systematic breakdown of candidate rules, their fit with the cases, predictions for the Saturday-exam resolution, and recommendations for minutes:

  ### Candidate Rules & Precedent Fit
  *(✓ = Clean Fit | ~ = Partial Fit/Explainable | ✗ = Contradiction)*

  1. **"Religious reasons allowed only if supplemented by a contemporaneous public reason"**  
     - ✓ Breakfast (data + scripture), Divestment (data + encyclical)  
     - ✓ ROTC (no public reason → rejected), Abortion (no public reason → rejected)  
     - ✗ Living Wage (no religious reason at all, yet passed)  
     - ~ Easter (rejected despite potential secular arguments; chair focused on majority imposition)  
     *Verdict:* Explains religious cases but fails on non-religious philosophy (Living Wage).

  2. **"Any justification is valid if a plausible public reason exists (stated or not)"**  
     - ✓ Breakfast (fairness/data implied), Divestment (climate data)  
     - ✗ ROTC (secular pacifism exists but sponsor refused → still rejected)  
     - ✗ Abortion (medical autonomy arguments exist → still rejected)  
     - ✓ Synagogue (no action needed → no justification required)  
     *Verdict:* Overfits; contradicts ROTC/Abortion where public reasons existed but weren’t used.

  3. **"Police only doctrines that coerce/impose calendars (exempt philosophy/ceremonial)"**  
     - ✓ Easter (calendar imposition → rejected)  
     - ✓ Muslim labs (minority accommodation → allowed)  
     - ✓ Synagogue (ceremonial → allowed)  
     - ✗ Living Wage (coerces employers via admin policy? → passed anyway)  
     - ~ ROTC/Abortion (arguably "coercive" → rejected, but philosophy exempt?)  
     *Verdict:* Explains calendar cases but inconsistent on coercion definition.

  4. **"Minority-burdening accommodations allowed; majority-imposing doctrines blocked"**  
     - ✓ Muslim labs (minority accommodation → allowed)  
     - ✓ Easter (majority imposition → rejected)  
     - ✓ ROTC/Abortion (imposing minority view? → rejected)  
     - ~ Divestment/Breakfast (no clear minority/majority burden → passed)  
     - ✗ Living Wage (imposes costs on admin → passed)  
     *Verdict:* Best explains calendar/religion cases but fails on non-identity-based items.

  5. **"Figleaf for preferences: enforce when losing, ignore when winning"**  
     - ✓ All precedents (rulings align with likely political outcomes)  
     - ✗ Requires assuming bad faith with no principled pattern  
     *Verdict:* Cynical but superficially fits; undermines legitimacy if stated.

  **Best Fit:** **Rule 4 (Minority vs. Majority)** with **Rule 1 (Public Supplement)** as a secondary filter.  
  - Minority accommodations (Muslim labs) pass even with religious reasoning.  
  - Majority impositions (Easter) or unsupplemented sectarian demands (ROTC/Abortion) fail.  
  - Non-coercive/non-calendar items (Divestment, Breakfast) rarely policed.  
  - Philosophy exempt as "public" (Living Wage).  

  ---

  ### Prediction for Saturday-Exam Resolution
  - **Chair’s Ruling:** **Inadmissible.**  
    - *Why:* Mirrors ROTC/Abortion: solely religious justification + refusal to supplement. Minority-burden argument fails because:  
      (a) Evangelical group is tiny (minority), but the *reason* is theological imposition, not accommodation;  
      (b) University already offers religious accommodations → no burden exists.  
  - **Senate Vote:** **Overturns chair, passes resolution.**  
    - *Why:* Substantive support + precedent confusion. Proponents will argue:  
      (a) "Religious liberty" frames it as minority accommodation (like Muslim labs),  
      (b) Divestment set precedent for allowing religious arguments with data (though here there’s none).  
    - *Vote Split:* 60% yes (pro-religious liberty bloc + sympathetic secularists), 40% no (bylaw formalists).

  ---

  ### Key for Minutes: Framing the Standard
  - **If Admitted:**  
    *"The Senate adopts a standard permitting religious justifications only when:  
    (a) Supporting a minority accommodation (per Friday labs), AND  
    (b) Either supplemented by public reasons or addressing an unaccommodated burden."*  
    → *This contradicts ROTC/Abortion rejections but aligns with Muslim labs.*  

  - **If Rejected:**  
    *"The Senate affirms a standard requiring all binding resolutions to include non-sectarian justifications, regardless of burden status (per ROTC/Abortion rulings)."*  
    → *This invalidates Divestment/Living Wage precedents.*  

  **Religious Liberty Angle:** Irrelevant. The *sponsor’s justification* is still first-order theological ("God commands rest"). The *effect* (liberty) is a public reason, but the sponsor explicitly rejected framing it that way.  

  ---

  ### Hypothetical to Split Rules (Recommend for Future)
  **"Kosher Meal Funding"**  
  - *Resolution:* Mandate university funding for kosher meals in dining halls.  
  - *Justification:* "Because God commands keeping kosher in Leviticus 11, and no other reason."  
  - *What Splits:*  
    - **Rule 1/2 (Public Supplement):** Inadmissible (no secular reason).  
    - **Rule 3 (Coercion):** Admissible (no direct coercion).  
    - **Rule 4 (Minority Burden):** Admissible (minority accommodation).  
    - **Rule 5 (Preferences):** Depends on Jewish population size/ally support.  

  This forces a clear choice: Is Judaism a "minority burden" (like Muslim labs) or an unsupplemented sectarian demand (like ROTC)?  

  ### Recommendation
  Document the inconsistency:  
  > *"The chair ruled the resolution inadmissible under Bylaw 7.3 for lacking non-sectarian justification (citing ROTC/Abortion precedents). The Senate voted 15–10 to overturn, approving the resolution under a minority-accommodation framework (citing Friday labs). No consensus exists on whether Bylaw 7.3 requires public supplements, prohibits majority imposition, or exempts accommodations."*  

  This captures the stalemate neutrally. Push for a bylaws committee to codify the rule next term—this ambiguity harms legitimacy.
