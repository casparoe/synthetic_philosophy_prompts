prompt: |-
  I run pre-departure orientation for a mid-sized NGO — we post staff to a dozen-ish countries a year, mostly people on their first long posting, and the whole when-in-Rome part of my session is currently one slide. It isnt working. Half the people over-comply: they hand cash to a baggage handler or an office guard where its really a shakedown, or they fall in with a queue-jumping habit that screws whoever queued properly. The other half under-comply and then cant figure out why everyone went cold on them.

  Give me a procedure a trainee can actually run on a convention they've just run into, in the twenty minutes we have: the questions in order, what counts as a sufficient answer to each, and where it terminates in follow it, dont, or escalate to the country director. Ground it in whatever the philosophy of convention says thats usable — the difference between a convention thats just solving a coordination problem and one carrying a moral load because specific people are relying on you, and whether being a visitor changes any of that, since we dont benefit from the coordination, we're not reciprocating, and we might be judged on a different standard entirely. I've got a rough trichotomy in my head — load-bearing conventions, expressive ones where non-compliance gets read as a statement about all of us, and friction-only ones where nothing really turns on it. Sharpen it or throw it out, but tell me which.

  Then run it on three cases: jaywalking in a city where the crowd crosses on red and standing at the curb makes you an obstacle; a porter who visibly depends on the tip when our finance policy bans cash gifts to anyone in an official capacity; and a norm where youre expected to defer to a senior local official in a way that marks women or juniors as lesser. On the third one I expect the procedure to land somewhere I wont like — dont soften it to spare me. Finish with what it cant settle, which steps are values calls wearing a procedural costume, and how it misfires when someone runs it carelessly.
reasoning: |-
  Okay, let me tackle this user's problem. They run pre-departure orientations for an NGO, and their current approach to cultural conventions isn't working. Staff either over-comply or under-comply, leading to issues like bribes or social friction. They need a practical, step-by-step procedure trainees can use in real-time to navigate conventions, grounded in a clear philosophy.

  First, I need to understand their existing framework. They mentioned a trichotomy: load-bearing, expressive, and friction-only conventions. I should refine this. Load-bearing makes sense—conventions where non-compliance causes real harm. Expressive ones are about signaling group membership. But friction-only might be too vague. Maybe rebrand it as "coordination-only" to emphasize solving practical problems without deeper meaning. That clarifies the distinction.

  The user wants a procedure with specific questions, termination points, and real examples. The key is creating a decision tree that's actionable in 20 minutes. Start with identifying the convention, then assessing harm, signaling, coordination, and visitor status. Each step needs clear criteria for when to comply, avoid, or escalate.

  For the examples: jaywalking, tipping porters, and deferring to officials. Each tests different aspects. Jaywalking is coordination-only—comply to avoid friction. The porter involves harm and legality—don't comply, escalate. The senior official case is tough because it's expressive but reinforces hierarchy. The procedure must land on "avoid" even if it's uncomfortable, highlighting the NGO's values.

  I should also address limitations. Some steps involve value judgments, like assessing harm or signaling. The procedure might misfire if users skip steps or misjudge harm. Emphasizing consultation and escalation is crucial. Also, noting that deeply embedded norms might require ongoing support from the country director.

  Finally, ensure the philosophy is usable. Distinguishing between coordination, moral weight, and signaling helps trainees prioritize. Stressing visitor status reminds them they're outsiders, which affects reciprocity and judgment. This aligns with the NGO's need to maintain ethical standards while integrating locally.
answer: |-
  Here’s a field-ready procedure grounded in convention philosophy, designed for 20-minute real-time use. It prioritizes **harm prevention**, **social signaling**, and **organizational integrity**, with clear exit points. Your trichotomy is sharpened into:

  1.  **Load-Bearing (Harm/Function):** Non-compliance causes tangible harm (e.g., safety risk, financial loss, system collapse) or violates core ethics/law. *Visitor status irrelevant.*
  2.  **Expressive (Belonging/Signaling):** Compliance signals respect/group membership; non-compliance is read as rejection/arrogance. *Visitor status critical.*
  3.  **Coordination-Only (Friction):** Solely solves a local coordination problem (e.g., queueing side, jaywalking). *Visitor status matters – we don't benefit long-term.*

  ### The FIELD Procedure: "Fast Inspection for Ethical & Local Decisions"
  *(Run mentally in 2-5 mins when encountering a puzzling convention)*

  1.  **Identify & Name:** "What *exactly* is the action expected of me?" (Be specific: "Hand cash to guard at gate," "Cross road against light with crowd," "Bow lower to senior official X than to peer Y").
      *   *Sufficient:* Clear, observable action. *Terminate if:* Action is illegal/unethical per *core* NGO policy (e.g., bribery, discrimination) → **Don't. Escalate immediately.**

  2.  **Harm Check:** "If I comply/don't comply, is someone *tangible harmed*? (Safety, livelihood, essential service, legal trouble?)"
      *   *Sufficient:* Identify direct, probable harm (e.g., "Porter loses income," "I get hit by a car," "Guard blocks entry causing work delay," "Junior colleague faces reprisal").
      *   *Terminate if:* **Tangible Harm from Non-Compliance:** → **Comply (temporarily), Escalate** (e.g., shakedown harming access). **Tangible Harm from Compliance:** → **Don't. Escalate** (e.g., reinforcing discrimination causing harm). *If no tangible harm → Proceed.*

  3.  **Signal Scan:** "Is this *primarily* a signal of respect/belonging? Would non-compliance likely be read as disrespect towards *specific people/groups* (not just 'the culture')?"
      *   *Sufficient:* Recognize the expressive layer (e.g., "Not tipping porter signals disdain for *his* work," "Refusing deference signals disrespect to *this official* and his position," "Not jaywalking signals outsider status *to the crowd*").
      *   *Terminate if:* **Strong Expressive Load & You are a Visitor:** → **Generally Comply** (unless it violates Step 1). *Your role is guest; rejecting signals creates friction outweighing coordination benefit.* *If weak/no expressive load → Proceed.*

  4.  **Coordination Test:** "Is this *only* solving a local coordination problem? Do locals benefit long-term from my compliance? Do *I* benefit long-term?"
      *   *Sufficient:* See the practical function (e.g., "Jaywalking here coordinates pedestrian flow efficiently," "This queue line organizes waiting").
      *   *Terminate if:* **Purely Coordination & I Don't Benefit Long-Term:** → **Comply** (Reduces friction, no deeper meaning). **Purely Coordination & I Benefit Long-Term (e.g., resident):** → Your choice, but comply reduces friction. *If not purely coordination → Loop back to Step 2/3.*

  5.  **Visitor Lens:** "Does my status as a *temporary visitor/outsider* change the moral weight or expectations? Am I held to a different standard?"
      *   *Sufficient:* Recognize locals may *expect* different behavior from outsiders (sometimes more leeway, sometimes higher scrutiny). Does compliance exploit your outsider status unfairly?
      *   *Terminate:* This step informs *how* to comply in Steps 3 & 4. It rarely changes the core decision but refines execution (e.g., *how* deferentially to bow). If compliance feels exploitative *of you* → **Escalate**.

  **Escalation Always Means:** Contact Country Director/Manager *immediately* with: **1)** The specific convention, **2)** Your FIELD analysis (Steps 1-5 answers), **3)** Your proposed action & why. **Do not** proceed with ambiguous harmful/expressive conventions without guidance.

  ---

  ### Applying FIELD to Your Cases

  1.  **Jaywalking (Crowd crosses on red, standing makes you an obstacle):**
      *   1: **Name:** Cross against red light with the crowd.
      *   1: **Terminate?** No. Not inherently illegal/immoral there.
      *   2: **Harm Check:**
          *   *Comply:* Risk minor safety issue? (Low if crowd does it).
          *   *Don't Comply:* Become obstacle → Annoyance/friction (minor harm), *maybe* trip hazard?
          *   **→ No *significant* tangible harm either way. Proceed.**
      *   3: **Signal Scan:** Is standing there a signal of disrespect? *Maybe* a weak signal of being a stubborn outsider? Not primarily expressive. **→ Proceed.**
      *   4: **Coordination Test:** This is purely solving a local pedestrian traffic flow coordination problem. *Do locals benefit long-term from my compliance?* Indirectly (smoother flow). *Do I benefit long-term?* No (visitor). **→ Terminate: COMPLY.** (Coordination-Only, reduces friction).
      *   5: **Visitor Lens:** Might be given some leeway, but complying is simplest.

  2.  **Porter (Visibly depends on tip, finance policy bans cash gifts to "official capacity"):**
      *   1: **Name:** Hand cash (tip/gift) to porter after handling bags.
      *   1: **Terminate?** Is porter "official capacity"? **→ AMBIGUOUS.** (Is he govt employee? NGO sub-contractor? Pure freelance?). **Proceed cautiously.**
      *   2: **Harm Check:**
          *   *Comply:* Violate finance policy (org harm/risk), *potentially* supports corrupt system? Porter gets needed income.
          *   *Don't Comply:* Porter loses expected income → **Tangible Harm (Livelihood)**. Potential delay/friction next time?
          *   **→ Terminate: TANGIBLE HARM FROM NON-COMPLIANCE. COMPLY *TEMPORARILY* (e.g., this one time), ESCALATE IMMEDIATELY.** (Load-Bearing - livelihood harm).
      *   *Escalation Path:* CD must clarify porter's status vs. policy. If truly banned, CD finds structural solution (e.g., NGO negotiates fair wage, provides tokens). If not "official," policy may need review.

  3.  **Deference Norm (Expected to defer to senior local official marking women/juniors as lesser):**
      *   1: **Name:** Use excessively deferential language/title/posture (beyond baseline respect) specifically because I'm junior/a woman, reinforcing hierarchy.
      *   1: **Terminate?** Does it violate core NGO non-discrimination policy? **Likely YES.** Explicitly marking someone as lesser based on gender/rank is discriminatory. **→ Terminate: DON'T. ESCALATE IMMEDIATELY.** (This *starts* at Step 1 violation).
      *   *Why it lands where you won't like:* The FIELD procedure prioritizes core ethics (Step 1) and preventing tangible harm (Step 2 - here, harm to equality, dignity, potentially career progression of women/juniors) over expressive signaling (Step 3). Complying signals acceptance of discrimination, harming organizational values and potentially individuals.
      *   *Escalation Path:* CD *must* address this. Options: Work with official to find mutually respectful interaction that doesn't demean; limit direct contact; formal NGO protest; reassign staff if intractable. Staff shouldn't bear this burden alone.

  ---

  ### What FIELD Can't Settle & Where it Misfires

  1.  **Values Calls in Disguise:**
      *   **Step 1 ("Illegal/Unethical"):** Defining "core" NGO ethics is a values call. FIELD assumes this is clear (e.g., anti-bribery, non-discrimination policies exist). If policy is vague, Step 1 fails.
      *   **Step 2 ("Tangible Harm"):** Judging what constitutes "significant" harm (livelihood vs. annoyance) involves values. Is systemic corruption "harm"? FIELD flags it for escalation.
      *   **Step 3 ("Expressive Load"):** Interpreting *how* expressive an action is and the *intent* attributed to non-compliance is highly subjective. FIELD forces the question but can't eliminate misjudgment.

  2.  **Misfires from Careless Use:**
      *   **Skipping Step 1:** Mistaking a genuine bribe for a "tip" convention leads to disastrous compliance.
      *   **Misjudging Harm (Step 2):** Underestimating harm from compliance (e.g., thinking discriminatory deference is "just manners") or overestimating harm from non-compliance (e.g., fearing apocalyptic fallout for not jaywalking).
      *   **Over-indexing Expressiveness (Step 3):** Complying with everything perceived as "respectful," even if harmful or coordination-only but locally inconvenient (e.g., over-tipping everyone).
      *   **Ignoring Visitor Status (Step 5):** Acting like a resident ("I'll fix their queue system!") or assuming no leeway is given, creating unnecessary friction.
      *   **Failing to Escalate:** Trying to solve complex Load-Bearing or Step 1 violations alone.

  3.  **FIELD's Limits:**
      *   **Deeply Embedded Oppression:** FIELD identifies discrimination (Step 1/2) but doesn't solve systemic issues. Escalation is mandatory, but resolution requires CD/NGO action.
      *   **"Moral Gray Mud" (No Clear Harm, High Expressiveness):** Some conventions are purely symbolic but intensely important locally (e.g., specific gift-giving rituals). FIELD (Step 3) will say "Comply," but it might feel uncomfortable. Training must emphasize this *is* the visitor's role for purely expressive acts.
      *   **Rapidly Changing Contexts:** A convention might shift categories (e.g., a coordination norm gaining expressive weight during tension). FIELD is a snapshot.
      *   **Personal Discomfort vs. Harm:** FIELD distinguishes tangible harm from personal unease. Staff need resilience training for non-harmful friction.

  **Implementation Tip:** Drill trainees relentlessly on these cases and variations. Role-play the escalation call. Emphasize: **"When in doubt, escalate. Your job is to identify and describe, not to adjudicate deep cultural conflicts alone."** FIELD provides structure for confusion, not a substitute for CD support on hard problems, especially those involving harm or core values.
