  - **Independent evidence or redundant?** Neuronal counts are not independent evidence but a refinement of the behavioral hypothesis. Encephalization failed because it ignored neural architecture; neuron counts address this by quantifying computational units directly tied to cognition. However, counts still serve as a proxy for cognitive capacity (the moral target), not moral status itself. They are a better measure but not ontologically distinct.  

  ### Feature Generating Cycle and Subtraction  
  - **Feature**: The behavioral battery’s terrestrial, tool-oriented design systematically disadvantages dolphins (aquatic, non-manipulative) despite high EQ, while favoring capuchins (dexterous, tool-using).  
  - **Subtraction**: If battery is replaced with a cross-species, domain-general test (e.g., including social cognition), rankings might become Dolphin > Capuchin > Elephant. Cycle collapses: Dolphin wins all criteria except mass, resolving to Dolphin > Capuchin > Elephant. Without the biased battery, the cycle vanishes, leaving only the ordinary dispute between absolute mass (elephant favored) and relative/behavioral measures (dolphin/capuchin favored).  

  ### Steelman Your Friend’s Position  
  **Her argument**: Brain mass is not claimed to be morally relevant in itself; it is a practical estimator of cognitive capacity under uncertainty. Cycles arise from administrative flaws—using multiple weak proxies creates incoherence. A single, cheap, measurable criterion (mass) avoids this and is "good enough" across species. Moral weight depends on cognitive capacity, not its estimators; thus, estimator inaccuracy is an epistemic problem, not a moral one.  
  **Does the case survive? Partially**:  
  - The cycle discredits mass as a standalone moral criterion (since it loses to EQ/behavior in key comparisons) but does not refute mass as an estimator. An estimator producing cyclic verdicts when combined with other evidence is impeached only if those alternatives are valid. Here, EQ and behavior are also imperfect, so the cycle highlights systemic uncertainty, not mass-specific failure.  
  - Your suspicion is correct: The cycle decisively refutes "mass is morally relevant in itself" (it loses to EQ/behavior) but is silent on "mass is evidence of moral relevance." An estimator can be noisy yet still the best available. However, the cycle suggests that in hard cases (large-brained, low-cognition animals), mass is a poor estimator, justifying exploration of better measures like neuron counts.  

  ### Transfer to Humans  
  **Would criteria generate a cycle? Unlikely**:  
  - Brain mass: Normal human range (1,100–1,700g; ~10% male-female difference, no performance gap).  
  - EQ: Human EQ ~7.5, minimal variation.  
  - Behavioral battery: Would show negligible differences in healthy adults.  
  - Hydrocephalus cases (e.g., 50g cortex with normal IQ) and Homo floresiensis (400g brain, tool use) challenge size-based measures but are outliers. No cycle arises in typical humans.  
  **Historical misuse of brain size**: The use of size/EQ to justify racial/gender hierarchies is a political error, not a scientific one. It stems from conflating estimator inaccuracy (size poorly predicts individual cognition) with intrinsic moral weight. This is a reason to distrust size-based rankings independently of accuracy, as they risk harm when misapplied. However, it remains a separable political argument; the science requires evaluating predictive power objectively.  

  **Final Note**: All empirical values are real but leverage contested data (e.g., dolphin EQ, neuron extrapolations). Scenario integrity relies on the behavioral battery design; a fairer battery collapses the cycle. No specifications were relaxed, but the cycle requires exploiting the battery’s terrestrial bias—a realistic flaw in committee protocols.
