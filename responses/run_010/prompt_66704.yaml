answer: |-
  Below is the specification section for your project on retrospective confirmation, structured as a numbered list of requirements. Each requirement includes: (1) the requirement itself (checkable, not aspirational), (2) a concrete motivating scenario, and (3) a verdict on non-negotiability. I then identify conflicting requirements, demonstrate the conflict, and provide a scorecard for the four dominant approaches. Confidence levels (CL) for key claims are noted, and the least certain point is highlighted at the end.

  ---

  ### **Requirements for Retrospective Confirmation**

  1. **Evidence Mobility Requirement**  
     - *Requirement*: The account must define a mechanism that produces a measurable increase in the probability (or confirmation measure) of hypothesis H upon the act of "pointing out" its connection to evidence E, even when E was previously known with certainty (P(E) = 1) or near-certainty.  
     - *Motivation*: In the orbital anomaly case, astronomers had tabulated data E with P(E) = 1 for decades; a new theory H must show a quantifiable boost in support when H is shown to explain E.  
     - *Non-negotiable?*: **Yes** (CL: 95%). Without this, the phenomenon is not captured.  

  2. **Oldness Gradient Requirement**  
     - *Requirement*: The account must specify how the degree of "oldness" of E (from P(E) = 1 to forgotten) affects the confirmation boost, and the boost must be invariant under logically equivalent representations of E.  
     - *Motivation*: If E is recorded in a dataset but never queried (low "salience"), versus perfectly recalled, the boost should not differ arbitrarily (e.g., due to E being formatted as "anomaly = 43.2 arcsec" vs. "Δθ = 0.012°").  
     - *Non-negotiable?*: **Partially**. Invariance under equivalent representations is non-negotiable (CL: 90%). Sensitivity to salience (e.g., queried vs. unqueried data) is negotiable but must be explicit.  

  3. **Refutation Reversibility Requirement**  
     - *Requirement*: If E is later refuted (e.g., by improved measurements), the account must withdraw the confirmation boost awarded to H, reverting support to its pre-connection level.  
     - *Motivation*: If the orbital anomaly E is superseded by better data, the new theory H must lose the credit it gained from E.  
     - *Non-negotiable?*: **Yes** (CL: 95%). Failure here implies non-empirical confirmation.  

  4. **Connection Uniqueness Requirement**  
     - *Requirement*: Repeatedly pointing out the same logical connection between H and E (or equivalent formulations of it) must not yield additional confirmation increments.  
     - *Motivation*: Explaining E using H in English, then in mathematical notation, must not grant two boosts.  
     - *Non-negotiable?*: **Yes** (CL: 90%). Prevents artificial inflation.  

  5. **Epistemic Subject Requirement**  
     - *Requirement*: The account must explicitly state whether the confirmation increase is (a) a change in an agent's credence at a time, or (b) a timeless relation between H and E. This choice must be consistently applied.  
     - *Motivation*: A Bayesian agent updating their credence (subjective) vs. a probabilistic relation (objective) determines if your collaborator’s model (measuring confidence changes) aligns with your colleague’s theory.  
     - *Non-negotiable?*: **Partially**. The choice itself is non-negotiable for clarity (CL: 85%), but either option is viable if consistent.  

  6. **New Hypothesis Requirement**  
     - *Requirement*: The account must assign a confirmation boost to H from E even when H is genuinely novel (P(H) = 0 prior to its proposal).  
     - *Motivation*: A new theory of gravitation (H) with P(H) = 0 must gain support from old anomaly data E.  
     - *Non-negotiable?*: **Yes** (CL: 85%). Old evidence for new hypotheses is core to the phenomenon.  

  7. **Trained Model Operationalization Requirement**  
     - *Requirement*: If the account applies to trained models, it must define "exposure to E" (e.g., via training data) and "pointing out the connection" (e.g., via prompts), and measure confidence changes using the model’s output (e.g., prediction probability shifts).  
     - *Motivation*: For your collaborator’s model, which encountered E during training, "pointing out" might involve a prompt like "Does theory H explain data E?"; the model must show increased confidence in H.  
     - *Non-negotiable?*: **Context-dependent**. Required if the account covers AI systems (CL: 80%), else droppable.  

  ---

  ### **Conflicts Between Requirements**
  **Claim (CL: 85%)**: The conjunction of **Evidence Mobility (Req 1)**, **Epistemic Subject as subjective (Req 5a)**, and **Oldness Gradient’s representation invariance (Req 2)** is *unsatisfiable* with purely probabilistic machinery (e.g., Bayesian conditionalization).  

  **Demonstration of Conflict**:  
  - Req 1 demands a probability increase despite P(E) = 1. Req 5a requires this increase to be a real change in the agent’s credence. Req 2 insists the boost cannot depend on arbitrary representational features of E.  
  - In standard Bayesianism, if P(E) = 1, conditionalizing on E cannot change P(H). Workarounds exist:  
    - *Give up logical omniscience*: Conditionalize on the connection C ("H entails E"). But the boost then depends on P(C), which varies with how C is represented (e.g., P(C) may be low if the agent uses a complex formulation of H). This violates Req 2.  
    - *Counterfactual credence*: Compute P(H|E) in a state where E was unknown. But this is not a real change in the agent’s current credence (violating Req 5a).  
  - Thus, probabilistic machinery alone cannot satisfy all three. **Resolution**: Abandon pure probabilism (add non-probabilist structure, e.g., syntactic dependencies) or drop Req 5a (adopt timeless confirmation).  

  **Most Exclusionary Requirement**: **Evidence Mobility (Req 1)**. Taken seriously, it eliminates all standard Bayesian accounts without modifications (e.g., logical omniscience relaxation), as they cannot handle P(E) = 1 (CL: 90%).  

  ---

  ### **Scorecard for Dominant Approaches**
  *(Graded against requirements, not each other)*  

  1. **Giving Up Logical Omniscience** (Conditionalize on the connection C):  
     - Satisfies Req 1 (boost via P(H|C)), Req 3 (withdraw if E refuted), Req 4 (if C is unique), and Req 6 (handles P(H)=0 via non-zero P(C)). Fails Req 2 (boost depends on arbitrary P(C)) and Req 5 if misaligned (subjective but sensitive to representation). Partial for Req 7 (models need explicit C-prompting).  

  2. **Counterfactual Credence** (Excise E, compute P(H|E) in ignorance):  
     - Satisfies Req 1 (boost via difference), Req 2 (timeless), Req 3 (E removable), Req 4 (fixed increment), and Req 6. Fails Req 5a (not a real change in credence) and Req 7 (models lack clear counterfactuals).  

  3. **Refusing Probability One** (Update by kinematics, keep P(E) < 1):  
     - Satisfies Req 1 (kinematic updates shift P(H)), Req 3 (adjust if E refuted), and Req 5a. Fails Req 2 (P(E) may vary arbitrarily with representation), Req 6 (P(H)=0 still problematic), and Req 7 (ill-defined for models).  

  4. **Deflationary Timeless Relation** (Confirmation as H-E relation, not agent change):  
     - Satisfies Req 1 (e.g., likelihood ratio), Req 2 (invariant), Req 3 (relation lapses if E refuted), Req 4, and Req 6. Fails Req 5a (no agent change) and Req 7 (not measurable in models).  

  ---

  ### **Confidence and Uncertainty**
  - **Confidence Levels**: Load-bearing claims (e.g., conflicts, non-negotiability) are hedged at 80–95% confidence, reflecting philosophical and technical contingencies but remaining actionable.  
  - **Least Sure Point**: **Trained Model Operationalization (Req 7)** (CL: 70%). What "already knew" means for models is underspecified. Settled by empirical work: If probing techniques (e.g., causal interventions) show models "knew" E but didn’t "connect" it pre-prompt, Req 7 holds; else, it may need reformulation.
