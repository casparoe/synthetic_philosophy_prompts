  Key issues to cover (as per user's list) and more.

  The requirements list:

  1. **Requirement: Evidence Constraint**
     - The account must allow for an increase in the probability (or confirmation measure) of the hypothesis after the connection to the old evidence is pointed out, even if the evidence was previously known and assigned probability 1 (or high confidence). 
     - **Motivation**: The stock case (orbital anomaly explained by new gravity theory) must be captured. The arithmetic obstruction (if P(e)=1 then conditionalizing on e doesn't change any probability) must be overcome.
     - **Non-negotiable?**: Yes, because without this the phenomenon is not explained.

  2. **Requirement: Gradual Oldness**
     - The account must specify how the degree of "oldness" (from known with certainty to forgotten) affects the confirmation boost. The verdict on confirmation must not depend on arbitrary features of how the evidence is represented (e.g., the same evidence in two logically equivalent forms should yield the same confirmation).
     - **Motivation**: Evidence can be in a database but not queried, or misremembered. We don't want the boost to turn on whether the agent happened to write the evidence in one notation or another, or whether they recalled it perfectly.
     - **Non-negotiable?**: Non-negotiable for the core phenomenon? Partially. The requirement that the boost should not depend on arbitrary representational features is non-negotiable. However, the account may have to be sensitive to the agent's actual epistemic state (so if the agent forgot the evidence, then pointing out the connection might not boost the hypothesis). But the requirement is that the account must not make the boost depend on, say, the syntax of how the evidence is stored.

  3. **Requirement: Withdrawal upon Refutation**
     - If the old evidence is later refuted (e.g., the anomaly is corrected by a better measurement), the confirmation boost must be withdrawn (the hypothesis loses the support it gained from that evidence).
     - **Motivation**: If the evidence is discredited, the hypothesis should not retain the credit it got from that evidence. Failure to withdraw would make the account non-empirical.
     - **Non-negotiable?**: Yes.

  4. **Requirement: No Double Counting**
     - The account must ensure that pointing out the same connection multiple times (or in logically equivalent ways) does not yield multiple increments of confirmation.
     - **Motivation**: To prevent "milking" the same evidence repeatedly by rephrasing the connection. This is a standard coherence requirement.
     - **Non-negotiable?**: Yes.

  5. **Requirement: Epistemic Subject**
