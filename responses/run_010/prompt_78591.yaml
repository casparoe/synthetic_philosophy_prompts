  Hmm, the user seems intellectually rigorous - they noticed their opponent was conflating at least three distinct arguments under one slogan: retroactive law, Allied hypocrisy, and procedural bias. That's perceptive. They're also wrestling with a deeper philosophical question about criminal law's purpose that came up in the debate. 

  First, I should disentangle the slogan's meanings. The procedural bias claim is technically true but trivial - of course victors ran the trial, but does that invalidate the evidence? The hypocrisy argument is emotionally potent but logically weak - the Allies weren't saints, but that doesn't make Nazi crimes less criminal. The retroactivity point is the only substantive legal argument, but even that depends on whether you view aggression as inherently criminal before 1945.

  Interesting how the user flagged that "late paperwork" analogy about law's purpose. They're right to sense something important there. Natural law vs positivist views of law really do determine whether you see the aggression charge as novel or declarative. But I should clarify that most legal systems actually balance both purposes - fair warning and moral condemnation.

  For Tokyo, the hypocrisy argument gains more traction since Hiroshima/Nagasaki weren't prosecuted, and cultural bias was more pronounced. But the core legal structure was similar to Nuremberg. The slogan works identically, just with more factual support in Tokyo's case.

  The user's underlying need seems to be: "How do I counter slogan-based arguments with precision?" They want steelman versions of the critique before dismantling them. Smart approach. I'll structure each claim as: 1) precise formulation 2) validity assessment 3) whether it undermines the trials' legitimacy. 

  On the philosophical question, I should distinguish between the descriptive claim (what law does) and normative claim (what it should do). The user's opponent was blurring these. Nuremberg's innovation was treating morality as source of law when written law was absent - controversial but not unprecedented (piracy prosecutions, etc). 

  Better emphasize that even if flawed procedurally, Nuremberg established crucial principles we now take for granted - crimes against humanity, individual accountability for state actions. The "sham" conclusion ignores how these became foundations for ICC and modern tribunals.
answer: |-
  Your colleague is deploying "victors' justice" as a rhetorical shield, conflating several distinct critiques to avoid engaging with the substance of the convictions. Let's dissect the precise claims, their validity, and their implications for both Nuremberg and Tokyo:

  ---

  ### **1. Procedural Composition Claim**
  *   **Claim:** "Only victors served as judges/prosecutors, so the trial is inherently biased."
  *   **Truism?** Yes. The IMT (Nuremberg) and IMTFE (Tokyo) were constituted exclusively by Allied powers (US, UK, USSR, France; US-dominated for Tokyo).
  *   **True at Nuremberg?** Yes.
  *   **True at Tokyo?** Yes, and arguably worse due to MacArthur's dominance and lack of Soviet dissent seen at Nuremberg.
  *   **Does it invalidate convictions?** **No.** While a flaw in *ideal* impartiality, it doesn't automatically negate the validity of the *evidence* presented or the *legality* of the charges under existing or emerging law. Bias *potential* ≠ Proven bias *in outcome*. The evidence of systematic genocide, aggressive war planning, and war crimes was overwhelming and meticulously documented by the Nazis themselves.
  *   **"Sham" Conclusion?** Fails. Procedural imperfection ≠ Sham. Many national trials have prosecutorial/judicial systems; we evaluate them on fairness *within* that framework, not solely on who appointed them.

  ---

  ### **2. Hypocrisy / Tu Quoque ("You Also") Claim**
  *   **Claim:** "The Allies committed similar crimes (e.g., strategic bombing, Katyn, colonialism) but weren't prosecuted, making the trials hypocritical and unjust."
  *   **Truism?** No. This is a substantive (and hotly debated) historical/legal argument.
  *   **True at Nuremberg?** **Partially True & Partially False.**
      *   *True Aspect:* Allied actions like the Dresden/Hamburg/Tokyo firebombings, Hiroshima/Nagasaki, and the Soviet massacre at Katyn (which the USSR falsely tried to pin on Germany at Nuremberg) were not prosecuted. Colonial practices weren't addressed.
      *   *False Aspect:* The *scale, systematization, and ideological core* of Nazi crimes (industrial genocide, extermination camps, Generalplan Ost) were unique. The Allies did not wage *aggressive war* in the same legal sense defined at Nuremberg (initiating conflict in violation of treaties/pacts). Tu Quoque is generally inadmissible in criminal law – "others did bad things too" isn't a defense.
  *   **True at Tokyo?** **Stronger Case.** The atomic bombings were uniquely horrific and directly relevant to the court (located in Japan). Firebombing of cities was even more extensive. Colonial hypocrisy was stark (e.g., prosecuting Japanese aggression in Asia while Western powers held colonies). Soviet actions in Manchuria post-surrender were brutal.
  *   **Does it invalidate convictions?** **No.** Hypocrisy is a moral/political failing of the *victors*, not a legal defense for the *defendants*. The guilt of the accused is judged on their own actions and the law applicable *to them*. Hypocrisy undermines the *moral authority* of the tribunal but not necessarily the *factual accuracy* or *legal basis* of the specific convictions.
  *   **"Sham" Conclusion?** Fails logically, though it damages the trials' perceived legitimacy. It highlights a flaw in *universal application*, not the *intrinsic wrongness* of convicting the Nazis/Japanese leaders for their specific, proven crimes.

  ---

  ### **3. Retroactive Law (Ex Post Facto) Claim**
  *   **Claim:** "Key charges (especially Crimes Against Peace / Aggressive War) were created *after* the acts were committed, violating the principle 'nullum crimen, nulla poena sine lege' (no crime, no punishment without law)."
  *   **Truism?** No. This is the core substantive *legal* critique.
  *   **True at Nuremberg/Tokyo?** **Debatable & Nuanced.**
      *   *War Crimes/Crimes Against Humanity (CAH):* Largely based on pre-existing treaties (Hague, Geneva) and customary law. CAH was novel *as a named category* but built on pre-existing concepts of "hostes humani generis" (enemies of mankind) for atrocities like piracy/slavery.
      *   *Crimes Against Peace (Aggressive War):* **This is the critical charge.** While the Kellogg-Briand Pact (1928) renounced war, it lacked enforcement mechanisms or individual criminal liability. Customary law on *state* responsibility for aggression existed, but *individual* criminal responsibility was undeveloped.
  *   **Your Colleague's "Late Paperwork" Argument:** He's touching on the **Natural Law vs. Legal Positivism** debate:
      *   **Natural Law:** Certain acts (genocide, aggressive war causing mass death) are inherently evil and criminal, regardless of written law. The tribunal's job is to declare this inherent wrong. (Supports "late paperwork" view).
      *   **Legal Positivism:** Law only binds if it exists as positive law (statute/treaty/custom) *before* the act, providing fair warning. Creating new crimes *ex post facto* is unjust. (Supports retroactivity critique).
  *   **Settling the Debate?** It doesn't *settle* it, but it **determines whether the retroactivity objection *lands* for the critic:**
      *   If you're a strict positivist, the aggressive war charge *is* fatally retroactive.
      *   If you accept a natural law basis or view the charge as a *declaratory* application of emerging customary law/Kellogg-Briand principles to individuals, it's not purely retroactive.
  *   **Nuremberg's Defense (Jackson, et al.):** They argued aggression was already a crime in international law; the trial was applying existing principles to individuals for the first time ("progressive development"), not inventing new law *ex post facto*. The unprecedented scale of the war demanded this step.
  *   **Does it invalidate convictions?** **Contested.** For war crimes/CAH, the retroactivity claim is weak. For aggressive war, it's the strongest critique. However, the principle was subsequently adopted in UN Charter and is now widely accepted (ICC Rome Statute), arguably validating Nuremberg's *progressive* approach. It doesn't invalidate the *other* convictions.
  *   **"Sham" Conclusion?** Fails for war crimes/CAH. For aggressive war, it's a serious critique of *that specific charge's* novelty, not proof the *entire trial* was a sham. Many legal systems accept limited judicial development of law.

  ---

  ### **4. The "Sham" Conclusion & Tokyo Differences**
  *   **Does "Victors' Justice" = Sham?** **No.** While the critiques (especially procedural bias and hypocrisy) have merit and *compromise* the trials' ideal legitimacy and universality, they do not prove the *convictions themselves* were unfounded or the *project of international criminal law* is invalid. The trials established crucial precedents:
      *   Individuals can be held criminally liable under international law.
      *   "Just following orders" is not an absolute defense.
      *   Crimes Against Humanity exist (protecting populations from their own state).
      *   Aggressive war is an international crime (despite the retroactivity debate).
  *   **Tokyo Differences:**
      *   **Procedural Bias:** More pronounced (MacArthur's influence, rushed process, less rigorous standards).
      *   **Hypocrisy:** Far more glaring (atomic bombings unaddressed).
      *   **Retroactivity:** Same core legal issue (aggressive war charge).
      *   **Cultural Bias/Understanding:** Significant problems in cross-examination, understanding Japanese command structures/ethics ("collective responsibility").
      *   **Outcome:** More convictions based on questionable command responsibility standards, less nuance.
  *   **"Slogan Work":** The slogan performs **identical rhetorical work** in both cases (dismissal via association with victor status). However, the **underlying critiques (especially hypocrisy and procedural flaws) are significantly *stronger* and harder to dismiss for Tokyo than for Nuremberg.** Tokyo has a stronger claim to being "victors' justice" in its more flawed execution, but *neither* trial's core findings of massive criminality are rendered "shams".

  ---

  ### **How to Counter**
  *   **Force Precision:** "When you say 'victors' justice,' which *specific* problem do you mean? Procedural composition? Allied hypocrisy? Retroactive law? They have different implications."
  *   **Separate Issues:** "Even if the Allies were hypocrites or the judges were victors, does that change the *fact* that Auschwitz existed and was systematically run to murder millions? Does it make the defendants' documented orders innocent?"
  *   **Acknowledge Nuance:** "Tokyo had serious flaws, particularly regarding the atomic bombings and MacArthur's role, that Nuremberg avoided to a greater degree. But does that mean General Yamashita *didn't* lose control of his troops leading to atrocities in Manila?"
  *   **Focus on Legacy:** "Regardless of flaws, did Nuremberg establish vital principles (individual accountability, crimes against humanity) that were necessary for the development of international law (ICTY, ICTR, ICC) and are morally correct?"
  *   **Address Retroactivity Head-On:** "On aggressive war, it's a fair debate: was it truly novel or just applying existing principles? But even if you think *that charge* was retroactive, does it negate the convictions for running death camps or massacring civilians?" (Emphasize convictions were overwhelmingly for war crimes/CAH).

  The "victors' justice" slogan is potent rhetoric but poor legal or historical analysis. It conflates valid critiques with invalid conclusions. Nuremberg, despite imperfections, was a necessary and largely legitimate step towards a more just world order. Tokyo was a more compromised application of the same principles. Neither justifies dismissing their core findings or the entire project of international criminal law.
