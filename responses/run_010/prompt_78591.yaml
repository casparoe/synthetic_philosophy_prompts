prompt: |-
  Got into a long slack argument about Nuremberg at work and the guy I was arguing with kept retreating to "it was just victors' justice" every time I brought up the actual convictions. Problem is I couldn't tell what claim he was even making — sometimes it sounded like a complaint about retroactive law, sometimes about the Allies not being charged for doing the same kinds of things, sometimes just about the fact that the judges and prosecutors all came from the winning countries, which is obviously true and doesn't seem to prove anything.

  Can you break down for me the different precise claims that slogan can be carrying? For each one: is it a truism nobody disputes, is it actually true of Nuremberg, and does it support the conclusion he was going for — that the convictions don't count and the whole project of international criminal law is a sham? He also said Tokyo was worse for the same reasons; tell me whether any of the readings come out differently there or whether the slogan is just doing identical work in both cases.

  One thing he said that I half agreed with: that the retroactivity objection only bites if you think criminal law exists to give people fair warning, and that if you think its job is instead to mark off what's genuinely wrong, then charging someone for waging an aggressive war isn't retroactive law at all, it's just late paperwork. That felt like it was smuggling something in. Is there a real distinction between those two jobs a law is supposed to do, and does settling it decide whether the retroactivty objection lands?
