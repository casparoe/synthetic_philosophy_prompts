answer: |-
  Here's a decomposed credence assessment for the *strong* claim that rational belief is sometimes **required** to be imprecise (i.e., carrying a single sharp probability is a *mistake*, and a set/interval is the *only honest representation*). I'll provide headline figures, sub-term credences with justifications, combination logic, sensitivity analysis, and address the width/resilience point and settled/contested status as requested. My final credence is **0.38**.

  **Headline Credence: 0.38**  
  This reflects significant respect for the arguments but substantial unresolved challenges, making the *requirement* claim plausible but far from dominant or settled. Your character's stance *can* be portrayed as integrity within a defensible (if contested) philosophical position.

  ### Sub-Term Decomposition & Justification (Settled vs. Contested Flagged)

  1.  **Decision Rules & Collapse (Credence: 0.25)**
      *   **Justification:** The core challenge. If *every* rational decision rule for an agent with a set of priors *effectively* forces them to act *as if* they had a single sharp probability (e.g., by selecting an extremal point), the "requirement" for imprecision vanishes at the point of action. Rules like MaxiMin, MaxiMax, or Hurwicz-alpha explicitly select a single prior/action. E-admissibility (Levi) allows any action optimal for *some* prior in the set, preserving imprecision *in the choice set*, but the agent still picks one action – arguably collapsing into *acting on* a sharp(ish) value. No widely accepted rule demonstrably *maintains* the full set's "imprecision" meaningfully *through* the decision *without* practical or theoretical collapse into something sharper. *(Status: **Contested** - Core debate in decision theory. Levi argued E-admissibility preserves imprecision; others like Seidenfeld, Schervish, & Kadane argue it leads to instability or violates intuitive dominance principles, implying de facto sharpening. Majority leans towards collapse being a serious problem for the "requirement" claim.)*
  2.  **Dilation Worry & Damage (Credence: 0.60)**
      *   **Justification:** Dilation (e.g., learning *any* outcome of a coin flip of unknown bias dilates your credence in a 2nd independent event) *is* a real property of many imprecise models. It demonstrates that imprecision isn't just about current ignorance but can *inevitably increase* under learning. Proponents argue this correctly reflects epistemic fragility in extreme uncertainty. Critics argue it's absurd/irrational to become *less* precise about A upon learning irrelevant B. The damage isn't fatal to *coherence* but severely challenges the *rational requirement*: if dilation forces implausibly wide intervals upon rational agents in common scenarios, it suggests imprecision might be *too* demanding, not required. It bites specifically against *required* imprecision by showing it can lead to counterintuitive, seemingly irrational, loss of confidence. *(Status: **Contested** - Acknowledged as a genuine phenomenon; debate is over whether it's a feature (reflecting true fragility - Joyce, White) or a bug (showing the model is flawed - Seidenfeld et al.). Not settled whether it undermines the *requirement* or just shows its consequences.)*
  3.  **Ellsberg & Strength of Intuition (Credence: 0.75)**
      *   **Justification:** Ellsberg Paradox experiments robustly show people prefer known risks (sharp urns) to ambiguous ones (imprecise urns), violating subjective expected utility. This decisively refutes the idea that *all* uncertainty can/should be modeled sharply. However, it **does not** settle *how* to model ambiguity. While intervals are the most common and intuitive representation, the behavior is *also* compatible with models using non-additive measures (Choquet expected utility), multiple priors with specific decision rules (like MaxiMin - Gilboa & Schmeidler), or purely psychological models (like "ambiguity aversion"). The intuitions *license* imprecise credences as a valid response but don't *force* them as the *only* honest representation. *(Status: **Settled** that sharp subjective probability fails in Ellsberg (universal agreement). **Contested** whether the response *requires* imprecise credences specifically vs. other formalisms or is purely behavioral.)*
  4.  **Verbal Dispute / Descriptive Equivalence (Credence: 0.45)**
      *   **Justification:** A significant strand argues that apparent disagreements about imprecise credences often boil down to different ways of describing the *same* underlying psychology or evidence base (e.g., a set of priors vs. a sharp probability plus a measure of robustness/resilience). If true, the "requirement" claim evaporates; it's just a representational choice. However, proponents of the strong claim argue that the set *does* represent a distinct doxastic state – genuine unresolved conflict between priors – not just uncertainty about a single true value. The equivalence isn't proven, and the phenomenology of deep uncertainty *feels* different, suggesting a real distinction. *(Status: **Highly Contested** - Core metaphysical/epistemological debate. Defenders of sharp credences (e.g., precise Bayesians) often lean towards equivalence; proponents of imprecision (e.g., Joyce, Moss) argue for distinctness. No consensus.)*
  5.  **Field Consensus in 20 Years (Credence: 0.20)**
      *   **Justification:** Predicting philosophy is perilous. Current trends show increasing acceptance of *imprecise models* as useful tools for extreme uncertainty and modeling bounded rationality. However, acceptance of the *strong normative requirement* claim remains niche. Major hurdles (decision rules, dilation, equivalence worries) seem unlikely to be fully resolved in consensus-favoring imprecision. The field is more likely to land in a pluralistic "horses for courses" stance: sharp credences for well-defined risks, imprecise models for radical uncertainty, without a strict *requirement* for either in all cases. A decisive victory for the strong requirement seems improbable. *(Status: **Contested Judgement** - Based on current debates, publication trends, and persistent criticisms. Others might reasonably put this higher or lower.)*

  ### Combination Logic & Sensitivity
  *   **Method:** Weighted geometric mean (emphasizing lower values, as unresolved core problems significantly weaken the strong claim). Starting point is near Ellsberg's high value (0.75), then heavily discounted by the critical Decision Rule challenge (0.25), Dilation (0.60), the Equivalence worry (0.45), and the low future consensus (0.20).
  *   **Final Number:** **0.38** (Calculated roughly as: (0.75 * 0.25 * 0.60 * 0.45 * 0.20)^(1/5) ≈ 0.38, acknowledging this is illustrative rather than strictly mathematical).
  *   **Highest Sensitivity - The Decisive Term:** **Decision Rules & Collapse (Credence 0.25)**. This is the linchpin. *If* a demonstrably rational decision rule were found that allowed agents to act *while truly maintaining and utilizing the full imprecision* of their credal set without collapsing into acting-as-if-sharp (or violating core rationality principles like dynamic consistency), it would massively bolster the strong requirement claim. Conversely, if the impossibility of such a rule (or its inherent irrationality) becomes the consensus view (credence → 0.10), the strong requirement claim collapses for practical purposes. Your character's integrity hinges most critically on this point being resolvable in favor of non-collapsing rules. If this term flipped low, her stance could easily look like evasion.

  ### The Third Position: Width vs. Resilience
  This is **crucial** and likely **closer to what your character actually embodies** than pure imprecise credences. It belongs prominently in the decomposition.

  *   **The Position:** Belief has two key dimensions:
      1.  **Central Tendency/Estimate (Width):** The "best guess" or plausible range (e.g., 1%-5% probability).
      2.  **Resilience/Robustness:** How stable that estimate is to new evidence (based on the *amount* and *quality* of underlying evidence/data/models).
  *   **Distinction:** A narrow interval (e.g., 4.9%-5.1%) based on flimsy evidence (low resilience) is fundamentally different from a wide interval (e.g., 1%-20%) based on vast, robust evidence (high resilience). Neither a single sharp number (e.g., 5%) nor a bare interval (e.g., 1%-20%) captures this distinction alone.
  *   **Cost for Your Character:** If she emphasizes this distinction *instead of* advocating imprecise credences *per se*:
      *   **Pro:** It's highly intuitive, especially for a modeller ("My model spits out 4.7%, but the input assumptions are shaky, so the true value could easily be 2% or 8%"). It avoids the deepest philosophical quagmires of imprecise credences (decision rules, dilation). She can justify giving a range *without* needing to defend the strong metaphysical claim. It focuses on the *quality of the evidence* – core to her job.
      *   **Con:** It can *appear* more evasive. Critics might say: "So just give me your *best* estimate (the center) *and* tell me how sure you are about it (the resilience/width)! Why hide behind the range?" It doesn't explicitly reject the *possibility* of a sharp probability existing (even if unknown). It might be seen as a sophisticated way of saying "I don't know precisely," which, while honest, could be perceived as less decisive or actionable than either a sharp number *or* a committed imprecise credence framework. She might be accused of "hiding the ball" on her true best estimate.

  ### Conclusion & Recommendations for Your Character
  *   **Credence for Strong Requirement:** **0.38** – Plausible but contested, facing major hurdles, especially regarding decision-making. Her stance *can* be integrity, but it's a philosophically risky position.
  *   **Character's Likely Authentic Position:** **Width vs. Resilience.** This is the more natural fit for a catastrophe modeller. She turns "vague dread into decimals" by building models; her core expertise is judging how *robust* those decimal outputs are given the garbage-in-garbage-out nature of modelling complex systems with sparse data. Her integrity lies in refusing to let a single decimal point mask the underlying fragility of the estimate. "The model outputs 4.7%. But given the uncertainty in sea-level rise projections and historical storm surge data for this region, a range of 2% to 8% is the only honest representation of our *knowledge state*." This focuses on evidence quality and model limitations, not abstract metaphysics.
  *   **Cost of Width/Resilience:** Potential perception of evasiveness or indecisiveness by those demanding a single actionable number. She must clearly articulate *why* the range is necessary (fragile evidence, model sensitivity) to maintain integrity. Her core argument isn't "single probabilities are *irrational* here," but "presenting a single number *misrepresents the quality of the evidence* and *overstates our certainty*."
  *   **Portraying Integrity:** Whichever path you choose:
      *   **Emphasize Evidence:** Ground her refusal in the *specifics of the data and models*. Show her wrestling with the inputs.
      *   **Acknowledge the Demand:** Have her explicitly recognize *why* they want a single number (simplicity, headlines, pricing) and explain why complying would be *dishonest* or *dangerously misleading* in *this specific context*.
      *   **Show the Weight:** Convey the professional and ethical burden she feels in *not* giving the simple answer. It's not evasion; it's a harder, more responsible choice.
      *   **Use Width/Resilience Language:** Even if leaning towards imprecise credences philosophically, using terms like "robustness," "sensitivity analysis," "confidence interval (in the informal sense)," or "plausible range based on current evidence" makes her position far more relatable and defensible within her profession than citing Ellsberg or Levi.

  Her integrity shines brightest if her refusal stems from a deep commitment to accurately representing the *known limitations* of the knowledge she works with, whether framed as imprecise credences or (more likely) the distinction between a precise model output and the resilience of the knowledge underlying it.
