  - **Adjudication:** The protocol will likely reject the item because:
     - The concept is not geometric and might not be consistently representable in simple lines.
     - The human solvers might not converge on the intended concept.
     - The probes will be hard to draw to distinguish from rivals.

  - **Verdict:** Reject. But we might dislike this because we want to test semantic concepts. The protocol is biased toward geometric/topological concepts.

  ### Summary for the Director

  **What the protocol buys us:**
  - A systematic method to reduce underdetermination by requiring authors to consider and test against rival concepts.
  - Detection of accidental separators before deployment.
  - Assurance that the intended concept is recoverable by humans (via the convergence test).
  - A consistent standard for item quality.

  **What it cannot buy:**
  - Absolute guarantee against underdetermination: there might be rivals we didn't think of.
  - Elimination of the underdetermination problem: it is relocated to the vetting process, where we try to rule out the obvious rivals. But Goodman's problem remains: we cannot test all possible alternatives.
  - Ability to handle non-geometric concepts well (as in the animal/plant example).

  **Resolution of underdetermination:** The protocol does not resolve the underdetermination problem but provides a practical framework to minimize it in our suite. We are trading philosophical completeness for engineering robustness.

  **Final note:** We are not refuting Goodman but building a suite that works for our purpose of evaluating vision-language models on recoverable concepts. The protocol is a guard against known failure modes.
answer: |-
  ### Vetting Protocol for Bongard-Style Evaluation Items

  The protocol below addresses underdetermination by forcing explicit confrontation with rivals during design and review. It relocates (but does not eliminate) Goodman's problem from the solver to the vetting process. Key decisions by humans are marked with **✪**, and arbitrary thresholds with **⚖️**.

  ---

  #### 1. **Answer Key Requirements**
     - **Form:** Must be a *single, non-disjunctive* necessary-and-sufficient condition stated in one natural language sentence (e.g., "All left figures have property P; all right figures lack P").  
       - *Why?* Disjunctions (e.g., "P or Q") or clusters invite solvers to guess subsets, making grading ambiguous.  
     - **Grading Implication:** Models must produce a response semantically equivalent to the key. Human reviewers define acceptable paraphrases during vetting (e.g., "drawn without lifting the pen" ≈ "one unbroken stroke").  
     - **Decision ✪:** Authors/reviewers judge semantic equivalence of paraphrases.  
     - **Risk:** Overly restrictive for concepts inherently disjunctive (e.g., "symmetrical or monotonic"), but we prioritize gradability.

  #### 2. **Probe Drawings for Rival Concepts**
     - **Requirement:** Authors must produce **3 probe drawings** per rival concept:  
       - (a) A figure with the *intended property P* but *without rival property R*,  
       - (b) A figure with *R* but *without P*,  
       - (c) A figure with *neither P nor R* (optional but recommended).  
     - **Enumerating Rivals:**  
       - **Step 1:** Authors must generate **3 rival candidates** using:  
         - A fixed checklist (**⚖️ convention**): total ink area, vertex count, presence of circles/right angles, convexity, connectedness, enclosed regions.  
         - Team brainstorming (mandatory session with ≥2 other authors).  
       - **Step 2:** For coextensive rivals (no discriminable probe possible):  
         - If *no probe* distinguishes *P* and *R* (e.g., "convex" vs. "no holes" for simple polygons), the item is **rejected**.  
         - **Decision ✪:** Reviewers confirm coextensiveness by attempting to draw counterprobes.  
     - **Threshold ⚖️:** 3 rivals minimum. If <3 emerge from brainstorming, use the checklist to pad.

  #### 3. **Adversarial Audit Checklist**
     Reviewers inspect the 12 figures for accidental separators. **Fixed checks:**  
     1. **Global statistics:**  
        - Total ink (by grid-count estimation).  
        - Vertex/line/enclosed-region counts (tally per figure).  
        - Presence of circles/right angles/parallel lines (binary).  
     2. **Accidental features:**  
        - List 1 salient non-*P* feature in each left figure (e.g., "all have a dot"). If absent in all right figures, flag.  
     3. **Rival validation:**  
        - Test if any rival *R* from Section 2 separates the 12 figures.  
     - **Decision rule:** If *any* check flags a separator, the item is **revised** (redesign figures/probes) or **rejected**.  
     - **Output:** Binary pass/fail per check. No thresholds—*any* hit triggers action.

  #### 4. **Human-Convergence Test**
     - **Procedure:**  
       - **5 naive solvers ⚖️** (no ML/design experience) view the 12 figures and state the rule in one sentence.  
       - Responses are compared to the answer key for semantic equivalence (reviewer-judged).  
     - **Acceptance rule:** ≥4 solvers must state a rule matching the *intended key* (not a rival).  
     - **If solvers converge on unintended *R*:**  
       - Item is **rejected** (proves miscommunication).  
     - **Decision ✪:** Reviewers classify responses as "match," "rival," or "other."

  #### 5. **Adjudication Rules for Reviewers**
     - **Evidence for verdicts:**  
       | Verdict    | Evidence Required                                                                 | Sign-Off           |  
       |------------|-----------------------------------------------------------------------------------|--------------------|  
       | **Accept** | Passes Sections 1–4; no disputes.                                                 | Both reviewers.    |  
       | **Revise** | Fails 1 audit check or solver convergence (4–5/5); fixable via redraws/tweaks.    | Both reviewers.    |  
       | **Reject** | Unfixable audit fail; coextensive rival; solver divergence; key not unitary.      | Senior reviewer.   |  
     - **Disputes:**  
       - Initial disagreement → Third reviewer arbitrates.  
       - **Decision ✪:** Arbitrator chooses verdict based on audit/probe/solver evidence.

  #### 6. **Difficulty Grading**
     - **Metric:** *Conceptual abstractness* (1–5 scale) + *rival count* (0–3+). **Not** time-based.  
       - *Abstractness*:  
         1: Concrete/geometric (e.g., "contains a circle").  
         3: Mixed (e.g., "has rotational symmetry").  
         5: Topological/relational (e.g., "is a Hamiltonian path").  
       - *Rival count*: Tally from Section 2.  
     - **Decision ✪:** Reviewers score abstractness independently; average.  
     - **Risk:** Biased toward reviewers' perception of "hard" concepts.

  ---

  ### **Systematic Biases and Limitations**
  - **Misfires:**  
    - Protocol favors concepts with *enumerable rivals* (e.g., geometric > semantic). Items relying on obscure properties may pass if reviewers miss rivals.  
    - **Coextensiveness blind spot:** If a rival *R* is indistinguishable from *P* in *all drawable figures*, the item is rejected—even if *P* is "correct" in principle.  
  - **Underdetermination status:** Relocated to vetting. The protocol *reduces* underdetermination by forcing explicit rival tests but cannot eliminate it (Goodman unresolved).  

  ---

  ### **Worked Examples**

  #### **Item 1: Your Specified Item**  
  - **Key:** "Left: One shape lies wholly inside another. Right: No shape lies inside any other."  
  - **Probes required (for 3 rivals):**  
    - *Rival 1 (accidental):* "Left figures have enclosed regions."  
      - Probe (a): Shape inside another, but *no enclosed region* (e.g., U-shape inside square—region is open).  
      - Probe (b): Single triangle (enclosed region, but no shape inside another).  
    - *Rival 2 (checklist):* "Left figures have higher ink area."  
      - Probe (a): Large outer shape with tiny inner shape (low ink).  
      - Probe (b): Complex right figure (e.g., starfish) with high ink.  
    - *Rival 3 (brainstormed):* "Left figures have exactly two shapes."  
      - Probe (a): Three shapes (circle in square, plus outer triangle)—*P* but not *R*.  
      - Probe (b): Two disjoint circles—*R* but not *P*.  
  - **Audit result:** Passes if no accidental separators (e.g., ink balance enforced).  
  - **Verdict:** **Accepts** if probes validate discrimination. Survives if probes are drawable.

  #### **Item 2: Protocol-Reject Item**  
  - **Key:** "Left: All angles are acute. Right: Contains a right angle."  
  - **Figures:**  
    - Left: Acute triangles, star polygons.  
    - Right: Squares, rectangles.  
  - **Adversarial audit hit:** *All left figures have ≤5 vertices; all right have ≥4* (accidental separator).  
  - **Probe failure:** Rival *R* = "≤5 vertices" separates the 12 figures.  
  - **Decision rule:** Audit flags non-*P* separator → **reject**.  
  - **Specific killer:** Audit check 1 (vertex count).

  #### **Item 3: Hard Case with Unpalatable Verdict**  
  - **Key:** "Left: Figures are Eulerian paths (drawable in one stroke without repetition). Right: Not Eulerian."  
  - **Problem:**  
    - *Coextensive rival:* "All left figures have 0 or 2 odd-degree vertices" (Eulerian theorem).  
    - *Probe impossibility:* In line drawings, Eulerian ≡ vertex-degree condition. No probe can discriminate.  
  - **Audit:** Coextensiveness → **reject**.  
  - **Why disliked:** The item *is* valid (tests graph theory), but protocol rejects because *P* has a drawably equivalent rival.  
  - **Verdict:** **Reject** per Section 2 (no discriminable probe).  

  ---

  ### **Summary for Director**  
  **What this buys:**  
  - **Reduced underdetermination:** Forces explicit rival consideration via probes/audits.  
  - **Human-aligned keys:** Solver convergence test ensures communicability.  
  - **Actionable vetting:** Clear accept/revise/reject rules with evidence.  

  **What it cannot buy:**  
  - **Philosophical resolution:** Underdetermination is relocated, not solved. Rivals outside our checklist/brains still lurk.  
  - **Perfect concepts:** Rejects items with coextensive rivals—even if pedagogically valuable (e.g., Item 3).  
  - **Bias-free suite:** Favors "auditor-friendly" concepts (geometric > semantic; enumerable rivals > novel properties).  

  **Tradeoff:** We gain rigor in *detectable* failures but institutionalize the vetting team's blind spots. Use this protocol to *minimize* arbitrariness, not to assert correctness.  

  ---  
  **Final note:** This protocol is a guardrail against *known* underdetermination, not a refutation of Goodman. It makes our assumptions explicit—and that is its value.
