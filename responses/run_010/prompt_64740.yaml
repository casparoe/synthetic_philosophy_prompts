  - **Problem:** The concept is not a geometric property but a semantic one. However, the drawing tool is limited to simple lines. We might not be able to draw an animal that doesn't have a certain geometric feature that all plants lack, and vice versa.

  - **Probes required:** 
    - Rival 1: "The left-hand figures have legs." But a snake might be drawn without legs. And a plant might have roots that look like legs.
    - Rival 2: "The left-hand figures have a curved line." (because animals are often drawn with curves) but plants might have curves too.

  - **Coextensiveness issue:** It might be that in the domain of simple line drawings, every animal drawing has at least one closed curve (for the body) and every plant drawing is made of straight lines (like a tree). But that is an accidental separator. If we try to avoid that, we might not be able to distinguish animals from plants without relying on such features.

