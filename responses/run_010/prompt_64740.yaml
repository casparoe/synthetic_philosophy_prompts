prompt: |-
  For two years I have been coordinating a small evaluation effort in the tradition of Bongard's hundred picture problems: each item shows twelve simple line drawings divided into two groups of six, and the solver — a vision-language model, in our case — must state in one sentence what the figures on the left share and the figures on the right lack. Hofstadter's remark in *Gödel, Escher, Bach* that this skill sits close to whatever pure intelligence turns out to be is why our director cares about the suite; it is also why I am uneasy about how we build it. I came to the puzzles the way a lot of people my age did, through the old online arguments about grue and about whether a concept can be learned from a handful of positive instances, and I now suspect those arguments are not a philosopher's toy but a specification problem I have been ignoring.

  We are commissioning two hundred items, written by six research assistants who are strong engineers with no philosophical training, each vetted by two independent reviewers, under a budget of roughly forty-five minutes per item from first sketch to signed-off answer key. Authors have a vector-drawing tool, a whiteboard, and each other; they cannot run code to compute image statistics, so anything in the protocol has to be executable by eye, by counting, and by argument.

  The failures I want to prevent are already familiar to me. An item I intended as "every figure is drawn in one unbroken stroke" was answered by a model as "no figure contains an enclosed region"; the two descriptions agree on all twelve of my drawings and would diverge on a drawing nobody bothered to make. An item intended as "the left-hand figures are convex" proved separable by total ink area. Another leaked through the accident that every left-hand figure contained a small circle — unintended by me, obvious in hindsight to every reviewer. In each case the item's key is underdetermined by its pages, and the assumption that a solver should recover *what the designer meant to communicate* is doing all the normative work without ever being written down as a constraint a designer can check against.

  What I want from you is a vetting protocol my team can actually run on every item. Please give me:

  1. Design-time requirements on the answer key: what it means for a key to be statable in one ordinary sentence, whether the key must pick out a single necessary-and-sufficient condition or may be a looser cluster of features with no common core, and what either choice does to how we grade a model's answer.
  2. A requirement that authors produce probe drawings — figures not shown to the solver — that discriminate the intended concept from its most plausible rivals. Say how many, how the rivals get enumerated rather than guessed, and what to do in the case that interests me most: when no probe can be drawn because the rival is coextensive with the intended concept on anything drawable.
  3. A fixed adversarial audit for accidental separators, as a checklist a reviewer can work through by inspection, together with the decision rule that follows from a hit.
  4. A human-convergence test: how many naive solvers, what level of agreement licenses acceptance, and what we do when they converge confidently on a description the author did not intend.
  5. Adjudication rules for reviewer disputes, with categorical verdicts — accept, revise, reject — and the evidence that licenses each, plus who signs off.
  6. A difficulty grading that does not collapse into how long humans or models take to solve the item.

  Throughout, mark plainly which steps are decisions by a person rather than outputs of the protocol, and which thresholds are conventions with no claim to being the correct ones. Tell me where the procedure will systematically misfire — in particular whether it will quietly bias the suite toward items whose intended concept happens to be one my auditors think to test.

  Then work three items end to end. First, one I will specify: left-hand figures in which one shape lies wholly inside another, right-hand figures in which no shape lies inside any other. Run it through your protocol and tell me what probes it needs and whether it survives. Second, an item of your own devising that your protocol should reject, showing me the specific audit line that kills it. Third, a genuinely hard case where your protocol reaches a verdict I expect to dislike — an item that fails a check but is among the better items we have, or one where the honest output is that no key can be fixed.

  Close with a page I can hand to my director: what this protocol buys us, what it cannot buy, and whether it resolves the underdetermination problem or merely relocates it from the solver to the vetting process. I would rather have a frank account of that than a protocol pretending to have refuted Goodman. Please do not give me a bibliography or a reading list; if there is a distinction from the literature that has to survive into the protocol and that I have not named above, introduce it in your own terms instead.
reasoning: |-
  We are designing a vetting protocol for Bongard-style problems to prevent underdetermination of the intended concept by the provided examples.

  The core problem is that the 12 examples (6 left, 6 right) may be consistent with multiple concepts, and we want the solver to recover the intended one. Our protocol must ensure that the intended concept is the only plausible one that fits the examples, or at least that we can detect when it is not.

  We break down the protocol as per the request.

  ### 1. Design-time requirements on the answer key

  **Requirements:**
  - The answer key must be expressible in one ordinary English sentence of the form: "The left-hand figures all have [property P], while the right-hand figures all lack [property P]." 
    - We allow for a slight variation: "The left-hand figures all have [property P], while the right-hand figures all have [property Q]" if P and Q are mutually exclusive and jointly exhaustive in the context, but this is riskier. We prefer the first form to force a single property.

  - The key must pick out a single necessary-and-sufficient condition (a property P) that is shared by all left-hand figures and absent in all right-hand figures. 
    - Why? Because if we allow a looser cluster, then the model (or human) might pick one feature from the cluster and we would have to accept it, but that might not be the intended concept. Moreover, grading becomes ambiguous: how many features must the model mention? We want a single property to avoid this.

  - However, we note that sometimes a concept might be disjunctive (e.g., "either red or blue") but we disallow disjunctions because they are hard to state in one sentence without being trivial and because they are less insightful. We require a unitary property.

  - **Grading implication:** When evaluating a model's answer, we will require that the model's response must unambiguously express the intended property P. We do not require the exact wording, but the meaning must be equivalent. We will have a set of acceptable paraphrases (determined by the author and reviewers) for each item. If the model gives a different property that also fits the examples, we count it as incorrect (because it didn't recover the intended concept). However, note that our protocol aims to make such rival properties impossible by the vetting.

  ### 2. Probe Drawings Requirement

  **Requirement:** For each item, the author must produce at least three probe drawings for each of the most plausible rival concepts. These probes are figures that are not part of the 12 examples.

  **How to enumerate rivals?** 
  - The author must consider the intended concept P and then generate rival concepts by:
    a) Considering the most common failure modes (e.g., from past items: convexity vs. no enclosed regions, total ink area, accidental features).
    b) Brainstorming with the team: each author must present their item to at least two other authors and ask for alternative explanations (rivals). The author must record these.
    c) Using a fixed list of common rivals (to be maintained and updated by the team) that includes:
        - Global image statistics (e.g., total ink, number of lines, number of vertices, symmetry)
        - Accidental features (e.g., presence of a particular shape like a circle, a specific orientation)
        - Coarser or finer versions of P (e.g., if P is "has an enclosed region", then a rival might be "has exactly one enclosed region", or "has a region enclosed by at least four sides")
        - Topological properties (e.g., connectedness, number of holes)
        - Geometric properties (e.g., convexity, presence of right angles)

    The author must produce at least three rivals per item. If the team cannot come up with three, then they must use the fixed list and pick the most applicable.

  **Probes per rival:** For each rival concept R, the author must produce:
    - One drawing that has P but not R (to show that R is not necessary for the left group).
    - One drawing that has R but not P (to show that R is not sufficient for the left group).
    - Optionally, one drawing that has neither P nor R, and one that has both, to further clarify.

  But note: we are mainly interested in showing that R is not equivalent to P.

  **What if a rival R is coextensive with P on anything drawable?** 
    - This is the case of interest. If the author cannot draw a probe that distinguishes P and R (because every figure that has P also has R and vice versa, within the constraints of the drawing tool), then P and R are equivalent in this domain. In that case, we must either:
        a) Reject the item because the intended concept is not distinguishable from R, and we cannot expect the solver to guess which one the author meant.
        b) Change the intended concept to a more refined one that breaks the equivalence.

    However, note: the domain of drawable figures is very rich. We assume that the vector-drawing tool can produce a vast variety of figures. If two concepts are coextensive in this domain, then they are the same concept for our purposes. But if the author believes they are distinct and that there exists a figure that would distinguish them (even if hard to draw), then they must draw it. If they cannot draw it because of tool limitations, we note that as a limitation and may reject the item.

  **How many probes?** At least 3 rivals, and for each rival at least 2 probes (one showing P without R, one showing R without P). So at least 6 probes per item. The probes must be drawn and verified by the reviewers.

  ### 3. Fixed Adversarial Audit for Accidental Separators

  **Checklist for reviewers (by inspection):**
  1. **Global statistics:** For each of the following, check if the left group and right group are separable by this statistic (without regard to the intended concept):
     - Total ink (total length of lines): compute roughly by eye (e.g., by counting grid units). If the left group has consistently more (or less) ink, flag.
     - Number of lines: count the lines in each figure. If left group has a fixed number (or within a narrow range) and right group does not (or vice versa), flag.
     - Number of vertices: count vertices (endpoints and intersections). If separable by vertex count, flag.
     - Number of enclosed regions: count. If separable, flag.
     - Symmetry: check for presence of reflectional or rotational symmetry. If all left have it and no right do (or vice versa), flag.
     - Presence of a specific primitive: e.g., circles, right angles, acute angles, parallel lines. If all left figures have a circle and no right figure does (even if unintended), flag.

  2. **Accidental features:**
     - For each figure in the left group, note any distinctive feature that is not part of P. Then check if that feature is absent in the right group. If such a feature is found in all left and no right, flag.
     - Similarly, for the right group: note any distinctive feature in the right group that is absent in the left. If found, flag.

  3. **Rival concepts from the author's list:** For each rival concept R that the author enumerated, check whether the 12 examples are separable by R. If they are, then flag because the solver might use R instead of P.

  **Decision rule:**
  - If any of the above audits is flagged, then the item must be revised. The revision can be:
     - Redraw the figures to break the accidental separator.
     - If the accidental separator is unavoidable without breaking the intended concept, then change the intended concept to one that accounts for the separator (if that is acceptable) or reject the item.

  ### 4. Human-Convergence Test

  **Procedure:**
  - Use 5 naive human solvers per item (drawn from a pool of people not involved in the creation of the item and not familiar with Bongard problems beyond a basic explanation).
  - Each solver is shown the 12 figures and asked: "In one sentence, what property do all the left-hand figures share that the right-hand figures lack?"
  - We record the answers verbatim.

  **Agreement licensing acceptance:**
  - We require at least 4 out of 5 solvers to give a description that is semantically equivalent to the intended concept P (as judged by the author and two reviewers independently).
  - The judgment of equivalence: the reviewers will compare each solver's answer to the answer key and the set of acceptable paraphrases (determined during the design). They must agree that the solver's answer captures P and not a rival.

  **What if solvers converge on a different description?**
  - If at least 4 solvers give a description that is not equivalent to P (even if it fits the examples) then the item is rejected because it fails to communicate the intended concept.
  - If the solvers' answers are mixed (no 4 out of 5 agreement on a single concept) then we do not accept the item. We may either reject it or send it back for revision (depending on the nature of the divergence).

  ### 5. Adjudication Rules for Reviewer Disputes

  - Each item is reviewed by two independent reviewers.
  - **Evidence for verdicts:**
     - **Accept:** The item passes all checks: the answer key is clear and unitary, the probes distinguish the intended concept from rivals, the adversarial audit finds no accidental separators, and the human-convergence test shows at least 4/5 agreement on P.
     - **Revise:** The item fails one or more checks but the issues are fixable (e.g., accidental separator found, but figures can be redrawn; or human convergence not achieved but with a tweak it might). The specific revisions required are documented.
     - **Reject:** The item has a fundamental flaw (e.g., the intended concept is indistinguishable from a rival in the domain, or the human solvers consistently see a different concept, or the concept cannot be stated simply).

  - **Dispute resolution:**
     - If the two reviewers agree on a verdict, that is the verdict.
     - If they disagree, a third reviewer (a senior team member) is brought in. The third reviewer examines the evidence and casts the deciding vote.
     - The evidence considered includes: the 12 figures, the answer key, the probe drawings, the adversarial audit checklist results, and the human convergence test results.

  - **Sign-off:** The final verdict (by agreement or by third reviewer) is signed off by the third reviewer (if involved) or by the two reviewers if they agree.

  ### 6. Difficulty Grading

  Difficulty should not be based on time. Instead, we grade by:

  - **Conceptual complexity:** How abstract is the concept? We use a scale from 1 (concrete, e.g., "contains a circle") to 5 (highly abstract, e.g., "has rotational symmetry of order greater than 2" or "is a planar embedding of a graph that is non-Hamiltonian"). This is rated by the reviewers independently and averaged.

  - **Distractors:** How many plausible rival concepts are there? Count the rivals that the author had to consider (from step 2). More rivals suggest higher difficulty.

  - **Human solver performance:** But note: we are using human solvers for convergence, so we cannot use their time. However, we can record the number of solvers who got it correct (even though we require 4/5 for acceptance, we can note the raw number). But for accepted items, this will be at least 4, so we don't use this for grading.

  - **Final difficulty score:** A weighted average: 70% conceptual complexity, 30% number of rivals (normalized). This is assigned by the reviewers after the item is accepted.

  ### Marking Decisions and Conventions

  - **Steps by a person:**
    - Author: decides the intended concept, draws the 12 figures and the probes, brainstorms rivals.
    - Reviewers: perform the adversarial audit by inspection, judge the probes, run the human-convergence test (or supervise it), assign conceptual complexity and count rivals, adjudicate disputes.
    - Naive solvers: provide answers for the convergence test.

  - **Conventions (with no claim to being the only correct ones):**
    - The number of naive solvers (5) and the agreement threshold (4 out of 5).
    - The requirement of 3 rivals and 2 probes per rival.
    - The list of global statistics in the adversarial audit is fixed but can be updated by the team.
    - The weights in the difficulty grading (70/30) are arbitrary.

  ### Where the procedure might misfire

  - **Bias toward testable concepts:** The protocol will bias the suite toward concepts for which rivals are easily enumerable and probes are drawable. If a concept is very abstract and has no obvious rivals, the author might not think to test it against the right rival, and the item might be accepted even if there is an undetected rival. This is why the fixed list of common rivals and the team brainstorming are important.

  - **Systematically missing hard-to-draw distinctions:** If a rival concept is coextensive with P in the drawable domain but not in principle, we will treat them as the same. This might be acceptable because the solver only sees the drawable domain.

  - **Human convergence might be too lenient:** If the naive solvers are not diverse enough, they might miss a rival concept that a model might pick up. We assume that humans are good at seeing the intended concept, but if the intended concept is not the most salient, humans might converge on a rival. Our protocol catches that and rejects the item.

  - **The protocol does not refute Goodman:** The underdetermination problem is relocated from the solver to the vetting process. We try to reduce underdetermination by requiring probes and audits, but we cannot eliminate it entirely. We can only ensure that the intended concept is the only one that fits the examples and the probes. However, there might still be an unknown rival that we didn't test. The protocol buys us a systematic way to rule out the most obvious rivals, but not all possible ones.

  ### Worked Examples

  #### Item 1: Intended concept: "one shape lies wholly inside another" vs. "no shape lies inside any other"

  - **Answer key:** "The left-hand figures each have at least one shape completely enclosed within another, while the right-hand figures have no shape enclosed within another."

