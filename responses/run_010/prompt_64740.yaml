            - R without P: A figure with two shapes that are disjoint (not one inside the other). This should go to the right group? But the right group is defined as having no enclosure. So such a figure would be on the right. However, for the probe, we want a figure that has R (at least two shapes) but not P (no enclosure). This is a right-group figure. But we are testing the concept. We can draw it as a probe for the rival.
        - Actually, for the rival R: "the left group has at least two shapes", we can test:
            - If we have a figure in the left group that has only one shape? But that would break P because you cannot have one shape inside another with only one shape. So the left group must have at least two shapes. Thus, every figure with P has R. But the converse fails: a figure with two disjoint shapes has R but not P. So we can show that R is not sufficient: we can draw a figure with two disjoint shapes (which should be in the right group) and note that it has R (two shapes) but not P. So this rival is not equivalent.

    - **Rival 2:** "The left-hand figures have an enclosed region." This is different: one shape inside another creates an enclosed region, but an enclosed region might be formed by a single shape (e.g., a circle) without having two shapes. 
        - P without R? Impossible because if one shape is inside another, then there is an enclosed region (the area between the two shapes, or the inside shape if it is filled? But note: we are using line drawings, so enclosed region means a region bounded by lines and not crossed by any line. In a figure with two concentric circles, the region between them is enclosed? Actually, the inner circle is enclosed by the outer, and the inner circle itself encloses a region. So both P and R are present. But note: a figure might have an enclosed region without having two shapes? For example, a single circle: it encloses a region. But our P requires two shapes? Actually, the intended concept is "one shape lies wholly inside another", so we need two shapes. But a single circle has an enclosed region and only one shape. So:
            - R without P: a single circle (one shape, enclosed region) -> this should be in the right group? But the right group is defined as having no shape inside another. A single circle has no shape inside another (only one shape) so it should be on the right. And it has R (enclosed region) but not P. So this shows that R is not sufficient for the left group.
