prompt: |-
  I'm helping one of my doctoral students put together a two-page proposal for a dissertation-year fellowship, and I'd like you to draft it. Take on the role of a philosopher of art who works on the aesthetics–politics interface and who is also at home in early twentieth-century Black political thought — and think this through carefully rather than reaching for the standard summary.

  Her half-formed idea concerns Du Bois's insistence that art just is propaganda, alongside his equally insistent demand for high artistic quality and his resentment at being judged by white standards. People writing on this tend to do one of three things: say he's an instrumentalist who subordinates art to racial uplift, say he's torn between two commitments he can't reconcile, or try to dissolve the tension by pointing out that on his view propaganda has to be true to be any good. My sense is all three readings miss something becuase the word is doing triple duty, and she should split it apart: a thesis about content (the work asserts or presupposes political claims), a thesis about design (the work is deliberately engineered to move a specified audience toward a belief or an action), and a thesis about function (the work does political work in its social setting whether or not anyone intended that). Du Bois could then coherently endorse the first, endorse the second only conditionally, and treat the third as description rather than aspiration. Layer on top of this that his propaganda is audiance-relative — what's called for when addressing Black readers isn't what's called for when addressing white readers — and his complaints about quality start to look like complaints about efficacy rather than bids for artistic autonomy.

  Turn that into an actual proposal: the question stated so sharply that it could have a determinate answer; why none of the three readings above settles it; the method, i.e. what she would concretely do month by month across twelve months; what a successful result looks like and what would count as the project failing; and an honest note about where the scope is too ambitious for a fellowship year. No bibliography, no literature review by citation — she'll add references herself. And please don't put anything in quotation marks as though quoting Du Bois; I'll check the wording against the texts myself.

  Before the proposal, give me a few lines of brainstorming on which of the three theses is most likely to turn out load-bearing and which is most likely to collapse under pressure. Then write the document.
reasoning: |-
  Okay, this is a fascinating and nuanced request. The user - clearly a philosophy professor - wants me to help craft a dissertation fellowship proposal for their doctoral student working on Du Bois's "art as propaganda" paradox. 

  Hmm, let me unpack the core challenge first. The professor has identified three common misinterpretations of Du Bois: instrumentalist reduction, incoherence theory, and truth-functional resolution. Their brilliant insight is that "propaganda" actually performs three distinct conceptual functions for Du Bois: content (political claims), design (deliberate persuasion), and function (social impact). The student's task is to disentangle these while adding audience-relativity.

  *Brainstorming gears turning*... The design thesis seems most vulnerable. While Du Bois explicitly discusses craft in "Criteria of Negro Art," his letters show deep suspicion of overt manipulation in art. Whereas content and function are consistently present - even when he praises subtlety. But the audience-relative angle could rescue design: what reads as ham-fisted for white audiences might be necessary clarity for Black readers. 

  For the proposal structure, I need to:
  - State the puzzle as a razor-sharp question about reconciling Du Bois's three positions
  - Show why existing interpretations fail (they collapse the tripartite structure)
  - Outline a 12-month research plan with clear milestones
  - Define success (coherent taxonomy applied to primary texts) vs failure (reverting to existing frameworks)
  - Acknowledge scope limits (probably can't exhaustively trace influence on Harlem Renaissance)

  *Methodology note*: Must avoid quotations per instructions. Will paraphrase Du Bois's positions using the professor's framework. The chronology approach (1910s-1940s) feels right - lets the evolution of his thought show through.

  *Risk assessment*: The trickiest part will be distinguishing "design" from "function" in textual analysis. Also need to ensure the audience-relativity argument doesn't accidentally revive the instrumentalist reading the professor rejects. 

  *Final polish*: Emphasize that this isn't just Du Bois exegesis - it models how to analyze any "political art" claim without reductionism. That's the real scholarly payoff.
answer: |-
  Here's a brainstorming note followed by the proposal draft, adhering strictly to your requirements:

  **Brainstorming on the Tripartite Split:**
  The **Content Thesis** (art asserts/presupposes political claims) feels foundational and load-bearing. Du Bois consistently treats art as inherently engaged with social reality, making this difficult to dismiss.  
  The **Function Thesis** (art *does* political work regardless of intent) also seems robust, aligning with his sociological perspective on art's societal role.  
  The **Design Thesis** (deliberate engineering for specific audience effect) is most likely to falter under pressure. While Du Bois champions craft and efficacy, his critiques of clumsy propaganda and his valorization of beauty suggest he sees deliberate engineering as a tool, not an inherent requirement for art's *value*, and potentially corrosive if prioritized over truth or aesthetic integrity. Its necessity appears contingent on context and audience, making it the shakiest pillar.

  ---

  **Proposal Draft: Dissertation-Year Fellowship**

  **Project Title:** Engineering Truth, Enacting Power: Du Bois’s Tripartite Model of Art as Propaganda

  **Core Question:** How does W.E.B. Du Bois coherently reconcile his seemingly contradictory assertions that (1) all art is propaganda, (2) Black art must meet the highest aesthetic standards, and (3) it must resist being judged solely by white norms, by distinguishing between the inherent political content of art, its deliberate design for persuasion, and its consequential social function?

  **The Problem & Gap:** Standard interpretations of Du Bois’s claim that art is propaganda fail to resolve this tension. Instrumentalist readings collapse design and function, reducing art to a mere tool for uplift and ignoring his aesthetic demands. Incoherence readings treat his commitments to quality and Black autonomy as conflicting with his propaganda stance. Truth-functional readings dissolve the tension by equating good propaganda with truth, but neglect his specific complaints about artistic *quality* and his audience-specific prescriptions. All three approaches overlook the possibility that propaganda operates on distinct, separable levels within Du Bois's framework. This project argues that Du Bois uses propaganda to signify: (A) **Content**: Art inevitably embodies/presupposes political stances; (B) **Design**: Art can be intentionally crafted to persuade a specific audience; (C) **Function**: Art inevitably operates politically within its social context. The tension dissipates when we see Du Bois endorsing (A) universally, accepting (B) conditionally (depending on audience and purpose), and treating (C) as an observable fact. His demands for quality are then primarily critiques of *ineffective* design (poorly executed persuasion) or assertions of artistic autonomy *within* the necessary political content (A) and function (C), particularly when resisting white norms.

  **Methodology & 12-Month Plan:**
  This project employs rigorous conceptual analysis grounded in close reading of Du Bois's aesthetic writings, editorials, speeches, and correspondence, contextualized within early 20th-century Black political thought and art debates.

  *   **Months 1-2:** **Foundational Analysis.** Systematically catalogue every instance where Du Bois discusses art, propaganda, beauty, standards, and audience across key texts (e.g., *The Souls of Black Folk*, *The Crisis* editorials, *Criteria of Negro Art*, *Dusk of Dawn*, relevant letters). Identify explicit and implicit definitions, distinctions, and tensions.
  *   **Months 3-4:** **Tripartite Framework Construction.** Develop precise definitions for the Content, Design, and Function theses based on the catalogue. Analyze how Du Bois employs each concept separately and in conjunction. Test the framework against apparent contradictions.
  *   **Months 5-6:** **Audience-Relativity & Quality.** Focus on passages addressing different audiences (Black, white, mixed). Examine how arguments for artistic quality shift depending on the implied audience and purpose. Map complaints about quality onto critiques of ineffective Design or compromised Content/Function under white hegemony.
  *   **Months 7-8:** **Function vs. Intent.** Analyze Du Bois’s discussions of art’s social impact, distinguishing where he describes unintended political effects (Function) from where he prescribes deliberate artistic strategies (Design). Identify his criteria for assessing Function.
  *   **Months 9-10:** **Coherence & Implications.** Synthesize findings to demonstrate how the tripartite framework resolves the central tension. Articulate Du Bois’s conditional criteria for when deliberate Design is necessary/appropriate. Contrast this model with instrumentalism and aesthetic autonomy.
  *   **Months 11-12:** **Dissertation Chapter Drafting & Refinement.** Draft core chapters outlining the problem, framework, audience-relativity analysis, the Function/Design distinction, and the resolution of the tension. Refine arguments based on internal review and advisor feedback.

  **Success & Failure:**
  *   **Success:** The project succeeds if it (1) provides a clear, textually-supported articulation of the distinct Content, Design, and Function theses within Du Bois’s work; (2) convincingly demonstrates how this framework resolves the specific tension between art-as-propaganda, demands for quality, and resistance to white standards; (3) robustly explains the audience-relative nature of his prescriptions, particularly linking quality demands to efficacy concerns; and (4) shows why previous interpretations (instrumentalism, incoherence, truth-functional) are incomplete or inaccurate based on this framework.
  *   **Failure:** The project would fail if (1) the tripartite distinction cannot be consistently applied to Du Bois’s texts or collapses under analysis; (2) the framework fails to resolve the core tension more satisfactorily than existing interpretations; (3) the audience-relativity argument proves tangential or unconvincing; or (4) the analysis ultimately reverts to one of the three standard readings it seeks to challenge.

  **Scope Limitation:** While contextualizing Du Bois within broader early 20th-century Black political thought (e.g., Locke, Harrison, Schuyler) is essential, this fellowship year will prioritize the deep internal analysis of Du Bois’s *own* writings and arguments to establish the core tripartite framework. A comprehensive comparative analysis of his contemporaries' views on art and propaganda, or a full tracing of the framework's influence on later movements like the Harlem Renaissance or Black Arts Movement, exceeds the scope of this 12-month period and will be addressed in the broader dissertation. The focus here is on achieving a definitive reinterpretation of Du Bois's specific, foundational claims.

  --- 

  This draft provides the sharp question, identifies the gap in existing readings, outlines a concrete monthly plan focused on textual analysis, defines clear success/failure criteria, and honestly limits the comparative scope. It avoids quotes and citations, focusing on the conceptual structure and argument as requested.
