   Materials and Setup for 22 students:

   - Divide into 4 groups: three groups of 6 and one group of 4. For the group of 4, we have to adjust the grading rule. For 4 players, we can use the same rule: >= average gets an A. 
     In round1: all10 -> average=10, all>=10 -> all get A.
     round2: if one does 11, average= (11+30)/4=10.25, then only the 11>=10.25 -> only one A.

   - We need: index cards for each player each round, a calculator for the average, whiteboard to display the average for each group after each round (so that players can see the average and whether they got an A).

   - Timeline for 75 minutes:
     - Introduction and rules: 10 minutes.
     - Round 1: players choose effort (write on card), collect and compute average, announce who got an A. (5 minutes)
     - Round 2: same (5 minutes)
     - Round 3: same (5 minutes)
     - Round 4: same (5 minutes)
     - Round 5: same (5 minutes)
     - Total for rounds: 25 minutes.
     - Then compute welfare and distribute candy: 5 minutes.
     - Debrief: 35 minutes.

   The debrief should cover:
     - What happened to the effort levels over time? (escalation)
     - What happened to welfare? (decrease)
     - Why did you increase effort? (to ensure you got an A, because you saw the average rising)
     - Was there a way to avoid this? (if they had all kept effort low, but then one defector could trigger the race)
     - How does this relate to real-world examples? (arms races, education grading curves, advertising costs in business, etc.)

   The students will see that each increase was individually rational (to get an A or to not lose out) but collectively harmful.

   This game does not require a villain; the structure causes the race.

   What can go wrong:
     - The students might collude to keep effort at 0. 
          Response: in round 1, if they all do 0, then average=0, and all>=0 -> all get A. Then in round 2, if one defects to 1, then average=1/6=0.166, so only the defector gets an A. This gives an incentive to defect.
     - They might not escalate: if after round 2 only one has escalated and the others accept not getting A's, then the race doesn't happen. 
          But then the ones not getting A's will have welfare -10 in that round, which is bad, and they will be motivated to escalate in the next round.
     - The group might try to organize a pact to keep effort low. 
          But then in any round, any player can defect and gain an A (at least in that round) while the others lose. So the pact is unstable.

   The limitation: in the real world, the cost of effort might not be as clear-cut, and the benefits might be more long-term. Also, in this game, the rounds are isolated, while in reality, the baseline might shift more continuously.

   We never use the word Moloch until the debrief.

   I think this will work.
