  ### **Escalating Standards: A Multipolar Trap Game**

  #### **Concept Overview**
  This game simulates a multipolar trap where individual rational choices incrementally shift the "standard of success," leading to collective detriment. Players are students competing for top ranks in a class where the grading curve is determined by their collective "effort levels" (points). Each round, they invest effort to improve their rank, but the curve shifts upward, requiring more effort to achieve the same rank. The trap emerges as effort costs accumulate, reducing net welfare. The game ensures every choice feels like a local improvement, and pacts collapse structurally due to the shifting baseline.

  #### **Why This Design?**
  - **No Explicit Defection**: Choices are individual effort increases, not betrayal.
  - **Baseline Drift**: The average effort increases each round, shifting the curve.
  - **Positional Logic**: Rank depends on relative effort, not absolute.
  - **Pact Failure Mechanism**: Pacts to cap effort collapse because any single increase by a non-participant shifts the average, forcing others to follow or lose rank.
  - **Incentives with Teeth**: Candy is awarded based on **net welfare** (benefits from ranks minus effort costs), making low-effort resistance costly.

  #### **Materials**
  - **Whiteboard**: Track group averages and ranks per round.
  - **Index Cards (1 per player per round)**: Players write effort levels (0-100).
  - **Calculator**: Compute averages.
  - **Candy**: Awarded to top 3 net welfare scores per table.
  - **Timer**: Keep rounds to 5 minutes each.

  #### **Room Setup**
  - **Parallel Tables**: 4 tables (two tables of 6, two of 5) for 22 students.  
    *Why?*  
    - The room has 3 movable tables; split into 4 groups by adding a table or using floor space.  
    - Parallel play allows comparison of outcomes across groups, highlighting universality of the trap.  
    - Enables faster data collection (groups calculate averages simultaneously).

  ---

  ### **Rules**
  1. **Objective**: Maximize net welfare (candy for top 3 per table).  
     - **Net Welfare = (10 × Number of Rounds in Top 50%) - (Total Effort)**  
       *(Top 50% = "A grade"; each round in top 50% gives 10 pts, but effort costs 1 pt per unit)*.

  2. **Each Round (5 rounds total)**:
     - Players secretly write effort (0-100) on index cards.
     - Facilitator collects cards, computes **group average effort**.
     - **Ranking**: Top 50% by effort get an "A" (e.g., 3/6 or 3/5 per table).
     - Effort and ranks are displayed on the whiteboard.

  3. **Key Mechanics**:
     - **No Communication**: Players act independently.
     - **Shifting Baseline**: As average effort rises, the effort needed to stay in the top 50% increases.
     - **Cost of Resistance**: Players resisting effort inflation risk falling below the curve, losing ranks.

  4. **Welfare Calculation**:
     - After Round 5, compute:  
       `Net Welfare = (10 × Rounds in Top 50%) - (Sum of Effort Across Rounds)`.  
     - Candy to top 3 net welfare scores per table.

  ---

  ### **Worked Example: 6 Players over 5 Rounds**
  **Players**: A, B, C, D, E, F.  
  **Initial Pact**: All agree to effort=10 to maximize welfare (0 cost, 10 pts/round).  

  #### **Round-by-Round Breakdown**
  | Round | Player Efforts          | Avg Effort | Top 50% (A Grade)    | Net Welfare (Cumulative)                     |
  |-------|-------------------------|------------|----------------------|----------------------------------------------|
  | 1     | All=10                  | 10         | All (A,B,C,D,E,F)    | All: (10 - 10) = **0**                       |
  | 2     | A=11, Others=10         | 10.16      | A (only >10.16)      | A: (10-11) = **-1**; Others: (0-10) = **-10** |
  | 3     | A=12, B=11, Others=10  | 10.5       | A, B (>10.5)         | A: (20-23)= **-3**; B: (10-21)= **-11**; Others: (0-30)= **-30** |
  | 4     | All=12 except F=10      | 11.33      | A,B,C,D,E (>11.33)   | F: (10-40)= **-30**; Others: (30-46)≈ **-16** |
  | 5     | A=13, B=12, C=12, D=12, E=12, F=12 | 12.16 | A,B,C,D,E (>12.16) | F: (10-52)= **-42**; A: (40-58)= **-18**; B-E: (30-58)= **-28** |

  #### **Final Welfare & Candy Allocation**
  | Player | Rounds in Top 50% | Total Effort | Net Welfare | Rank (Candy) |
  |--------|-------------------|--------------|-------------|--------------|
  | A      | 5                | 58           | -8          | 1st (✅)     |
  | B      | 4                | 58           | -18         | 3rd (✅)     |
  | C      | 4                | 58           | -18         | 3rd (✅)     |
  | D      | 4                | 58           | -18         | 3rd (✅)     |
  | E      | 4                | 58           | -18         | 4th          |
  | F      | 2                | 52           | -32         | 6th          |

  **Outcome**:  
  - **Trap Fired**: Baseline effort escalated from 10→12.16.  
  - **Resistance Cost**: F resisted escalation (effort=10 in R4) but fell out of top ranks, collapsing welfare.  
  - **Pact Collapse**: A’s initial "optimization" (R2 effort=11) shifted the average, forcing others to escalate or lose ranks.  

  ---

  ### **Sensible Play vs. Resistance**
  - **Sensible Play Path**:  
    Players escalate effort to stay above the rising average. Even with high effort, net welfare declines (e.g., A: -8).  
  - **Resistance Path (2–3 Players)**:  
    Players keeping effort=10:  
    - **Short-Term**: Fall out of top ranks, losing 10 pts/round.  
    - **Long-Term**: Net welfare plummets (e.g., F: -32). Resistance is individually irrational.  

  ---

  ### **Timeline (75 Minutes Total)**
  1. **Introduction (10 mins)**:  
     - Explain rules, welfare formula, and candy incentive.  
     - Emphasize: "Your choices affect the curve. Candy for top 3 net scores."  
     - *Avoid terms like "trap" or "Moloch."*  

  2. **Gameplay (40 mins)**:  
     - **Rounds 1–5** (5 mins/round):  
       - 2 mins: Players write effort.  
       - 2 mins: Collect cards, compute average, display ranks.  
       - 1 min: Record data.  
     - *After Round 2, pause to highlight rising average.*  

  3. **Welfare Calculation (5 mins)**:  
     - Players compute net welfare; facilitator verifies.  
     - Award candy to top 3 per table.  

  4. **Debrief (20 mins)**:  
     - **Guided Questions**:  
       - "Why did effort levels rise? Was anyone 'wrong’ to increase?"  
       - "Did the pact work? Why not?"  
       - "How did resistance affect net welfare?"  
     - **Map to Concepts**:  
       | Round | Structural Feature |  
       |-------|-------------------|  
       | 1 | Baseline: No single decision-maker sets the curve. |  
       | 2 | Local optimization: A’s +1 effort seemed rational. |  
       | 3 | Multipolarity: B escalated to avoid falling behind. |  
       | 4 | Pact collapse: F’s resistance failed without facilitator veto. |  
       | 5 | Aggregate harm: All have lower welfare than Round 1. |  
     - **Reveal "Moloch"**: "This is a race to the bottom—no villain, no malice, just structure."  
     - **Real-World Links**: Education grading curves, corporate "performance inflation," environmental standards.  

  ---

  ### **Predictable Pitfalls & Recoveries**
  1. **Pitfall: Collusion Succeeds**  
     - *Risk*: All keep effort=10 for all rounds.  
     - *Recovery*: Ask: "If you personally gained by increasing in Round 2, why didn’t you?" Highlight welfare gains from defection.  

  2. **Pitfall: Effort Spikes Too Fast**  
     - *Risk*: Players jump to effort=100 in Round 1.  
     - *Recovery*: Cap effort at current average +20. Announce: "Effort above average+20 is wasted; it won’t increase your rank."  

  3. **Pitfall: Misunderstanding Welfare**  
     - *Risk*: Players ignore effort costs, chasing ranks.  
     - *Recovery*: After Round 3, recalculate welfare: "Your net score is falling. Is rank worth the cost?"  

  ---

  ### **Limitations & Supplemental Arguments**
  - **Limitation**: Effort costs are immediate and transparent.  
    - *Real World*: Costs are often delayed (e.g., burnout, environmental damage).  
    - *Supplement*: Argue: "In real races, costs are hidden—students cram for exams, nations over-arm, but consequences come later."  
  - **Limitation**: No external shocks.  
    - *Real World*: Crises (e.g., pandemics, recessions) accelerate traps.  
    - *Supplement*: "Imagine a recession hits—players might escalate effort faster to 'stay safe.'"  

  ---

  ### **Why This Works**
  - **No Dismissible "Design"**: The trap emerges from peer interaction, not facilitator fiat.  
  - **Costly Resistance**: Resisters lose ranks *and* welfare, creating visceral regret.  
  - **Debrief Anchors**: Specific rounds map cleanly to multipolarity, shifting baselines, and pact fragility.  
  - **Molcoh Reveal**: The trap is named only after they experience it, making the concept stick.
