     Deck A (fair): 5 red and 5 black cards? (if we use 10 cards) or 26 red and 26 black if we want a big deck. But we only draw one card per round, so we can reuse the deck by reshuffling and putting the card back. But for the note, we need to draw and then give the note. So we need to draw a card and keep it aside.

  - Alternatively, use a die for the fair and biased coin.

  - Notes: pre-printed notes for the outcomes? But we don't know the outcome in advance. We can have the assistant write on slips of paper.

  - Whiteboard: to write the scoring rule and keep time.

  - Laptop: to display the structure? Or we can just talk.

  Timeline revised for 4 rounds (60 minutes):

  0-10 min: Introduction and scoring rule explanation.
  10-20 min: Round 1 (fair coin, no note).
  20-30 min: Round 2 (fair coin, with note).
  30-40 min: Round 3 (biased coin, no note).
  40-50 min: Round 4 (biased coin, with note).
  50-75 min: Debrief and discussion.

  In the debrief, we can discuss the unknown bias scenario verbally.

  Debrief points:

  - In Round 1 and 3, everyone used the chance and set their credence to p. That's the Principal Principle.
  - In Round 2 and 4, half the class had a note that told them the outcome. They set their credence to 1 or 0. The other half set to p. The note is inadmissible evidence: it's information about the specific outcome that the chance hypothesis doesn't account for. The chance hypothesis says the outcome is random with chance p, but the note gives the outcome.
  - Your friend might say: this is just deferring to the expert (the assistant). But the Principal Principle is about physical chance. The reason the expert can override the chance is because the expert has specific information about this outcome. Without such information, you should use the chance.
  - The activity shows that the admissibility clause bites: in Rounds 2 and 4, the two groups set different credences because of the note.
  - It also shows that when you have the note, you shouldn't use the chance.
  - The activity does not show that chance is mind-independent. We stipulated the chance. But the lesson is about how to set credence when you know the chance, not about where the chance comes from.

  Who does it favor? It shows that the Principal Principle has content beyond expert deference because it tells you to set your credence to the chance even when there is no expert. And when there is an expert, it tells you to use the expert's information only because it provides inadmissible evidence. But it doesn't fully divorce chance from expertise. However, it does show that the expert is not the chance: the chance is a feature of the world. The expert is just reporting on the world.

  But in the activity, the expert is reporting the outcome, not the chance. So it's not that we are deferring to an expert about the chance, but about the outcome.

  So it favors you: it shows that chance is not just an expert opinion. The expert in this case is not giving an opinion about the chance; they are giving the outcome. The chance is fixed by the setup.

  What if the expert gave a prediction about the outcome with a certain reliability? Then you would use conditional probability: if the expert says heads and is right 90% of the time, then your credence should be 0.9. That's different from the chance. In our activity, the expert is 100% reliable, so it's 1 or 0.

  To really distinguish, we could have a round where the expert is fallible. But then it would be conditional probability, not a violation of the Principal Principle.

  So to answer: the activity favors your view that chance is in the world and the admissibility clause is not empty. It bites in the note rounds.

  What predictably goes wrong:

  - Students might not understand the scoring rule. Solution: do a practice round.

  - In the note rounds, students might not report honestly. For example, a student with a note that says heads might report 0.5 if they don't trust the assistant. But we tell them the assistant is 100% reliable. Stress that.

  - Time: we might run over. Solution: be strict with time, and if behind, skip one round.

  - The biased deck might be drawn and show red more often, so the non-note holders in the biased round get a high score. But that's chance.

  Recovery: if time is short, skip the biased coin without note or combine.

  Frank note on what the activity can't reproduce:

  - The mind-independence of chance: we stipulate it.
  - The activity doesn't show how we come to know the chance. We just tell them.
  - The expert is used to provide the inadmissible evidence, so it looks like expert deference. But we can stress that any direct evidence about the outcome would do.

  Overall, I think the activity will work to show the admissibility clause in action.

  Let me know if you want to adjust any part.
answer: |-
  Below is a complete in-class activity designed to demonstrate the "bite" of the admissibility clause in the Principal Principle. It addresses your context: a 75-minute intro metaphysics/epistemology section on chance and credence, with 30 students. The activity uses a deck of cards as the physical device, avoids real money (using points convertible to extra credit), and ensures the admissibility clause creates visible divergence in credences between students with and without "inadmissible evidence" (via notes). It also includes a deck swap to test if note-holders overcorrect. The debrief addresses your debate, and I provide a candid assessment of what the activity can and cannot achieve.

  ### **Core Concept**
  The Principal Principle states that if you know the chance of an event is \(p\), and you have no *inadmissible evidence* (evidence that directly concerns the specific outcome in a way the chance hypothesis doesn't account for), your credence should be \(p\). Inadmissible evidence "bites" when it gives information about the *specific outcome* that the chance setup (e.g., a deck with a known bias) could produce but doesn't build into its probabilities. This contrasts with "expert deference" because:
  - **Chance is mind-independent**: It's a feature of the world (e.g., the deck's composition), not an opinion.
  - **Expertise is derivative**: Deferring to a forecaster relies on their track record (admissible evidence), while inadmissible evidence bypasses chance by revealing the outcome.

  The activity forces students to see this gap: knowing the chance is 0.6 doesn't help if you have a note hinting at the outcome. The swap tests if burned note-holders overreact to new chance information.

  ---

  ### **Activity: "Chance vs. the Oracle"**
  **Materials**:
  - 1 standard deck of cards (remove all but 20 cards: 12 red, 8 black for a 0.6 chance of red).
  - 1 additional deck (or modify the same deck): 10 red, 10 black for a 0.5 chance (used in the swap).
  - 30 small slips of paper (for notes; half will be used per round).
  - 1 cup (to draw cards from).
  - Whiteboard (for scoring and instructions).
  - Laptop/Printer (to display rules and scoring; optional for randomizing note distribution).
  - Pens for students to write credences.

  **Scoring Rule** (Quadratic, computed quickly):
  - Students report credence \(p\) (0 to 1) for "next card is red."
  - After the draw, score = \(1 - (outcome - p)^2\), where outcome = 1 (red) or 0 (black).
    - E.g., if \(p = 0.6\) and red is drawn: \(1 - (1 - 0.6)^2 = 1 - 0.16 = 0.84\).
    - If \(p = 0.6\) and black: \(1 - (0 - 0.6)^2 = 1 - 0.36 = 0.64\).
  - Scores are recorded on the whiteboard; cumulative points determine extra credit (e.g., top 50% get 0.1% extra).

  **Why this works**:
  - **Chance is fixed** by the deck (12 red/8 black → \(P(\text{red}) = 0.6\)).
  - **Notes provide inadmissible evidence**: They say, "The next card is red" or "black," but are only 70% reliable (not 100%). This mimics "something the chance hypothesis says could turn up" but isn't accounted for in \(p = 0.6\). Students with notes must weigh this against the known chance.
  - **Divergence is visible**: Half the class gets notes; their credences cluster differently from those without notes.
  - **Swap tests learning**: After a bad note, we swap decks (to 10 red/10 black, \(P(\text{red}) = 0.5\)). Do note-holders over-discount?

  ---

  ### **Rules and Timeline (75 Minutes Total)**
  **Prep Before Class**:
  - Modify decks: Deck A (12 red, 8 black), Deck B (10 red, 10 black).
  - Print/write 15 notes: 10 say "The next card is RED," 5 say "The next card is BLACK" (or vice versa; adjust ratio for 70% reliability). Use a fixed ratio so reliability is clear (e.g., 7/10 notes are correct historically).

  **In-Class Flow**:

  | Time | Phase | Description |
  |------|-------|-------------|
  | 0-10 min | **Intro & Training** | Explain the Principal Principle: "If you know chance = p, set credence to p unless you have inadmissible evidence." Define inadmissible evidence: "Info about this specific outcome the chance setup doesn't include." Demo scoring with a practice round (no points): Use Deck A, draw a card, have students guess \(p = 0.6\), then score. |
  | 10-25 min | **Round 1: Chance Only (Baseline)** | Shuffle Deck A (12 red/8 black). Ask all students to write their credence for red (no notes). Most report 0.6. Draw and reveal card. Calculate scores (expect clustering at 0.6; avg score ≈ 0.64–0.84). **Key point**: Shows chance alone. |
  | 25-40 min | **Round 2: Notes Introduced (Inadmissibility Bites)** | Reshuffle Deck A. Randomly give 15 students notes (10 "RED", 5 "BLACK" for 70% red bias). *Don't reveal reliability yet*. Ask students to write credences: <br>- Note-holders: Some use the note (e.g., \(p \approx 0.7\) if they trust it), some average with chance (e.g., \(p = 0.65\)), and skeptics stick to 0.6. <br>- Non-note-holders: Mostly 0.6. <br>Draw and reveal card. Calculate scores. **Divergence**: Whiteboard shows two clusters (e.g., 0.6 vs. 0.7). **Key point**: Note-holders deviate from 0.6 due to "inadmissible" evidence. |
  | 40-55 min | **Round 3: Swap & Revise (Testing Overreaction)** | **Swap decks in plain sight**: Replace Deck A with Deck B (10 red/10 black, \(P(\text{red}) = 0.5\)). Announce: "Chance is now 0.5!" Repeat note distribution: 15 new notes (7 "RED", 8 "BLACK" for 70% reliability, but *now chance is 0.5*). Ask for credences: <br>- Note-holders: Some who were burned in Round 2 may underweight the note (e.g., \(p = 0.4\) for "RED" note), others overweight it. <br>- Non-note-holders: Mostly 0.5. <br>Draw and reveal. Calculate scores. **Divergence**: Note-holders' credences spread wider. **Key point**: Revising chance after a swap; do note-holders over-discount? |
  | 55-65 min | **Round 4: Reliability Revealed (Calibration)** | Reshuffle Deck B. Distribute notes (same 70% reliability). Now **reveal note reliability**: "70% of past notes were correct." Ask for credences: <br>- Rational note-holders: Use conditional probability. E.g., if note says "RED," \(p = P(\text{red} \mid \text{note}) = \frac{P(\text{note} \mid \text{red})P(\text{red})}{P(\text{note})}\). With chance = 0.5 and note reliability 70%, \(p \approx 0.7\) for "RED" notes. <br>- Non-note-holders: 0.5. <br>Draw, reveal, score. **Divergence**: Note-holders converge near 0.7 or 0.3. |
  | 65-75 min | **Debrief & Discussion** | Discuss results. Map to principles (below). Award points. |

  ---

  ### **Debrief: Mapping to Your Debate**
  **How the Activity Favors Your View (Chance is Mind-Independent)**:
  - **Inadmissibility Bites (Rounds 2–3)**: In Round 2, note-holders deviate from \(p = 0.6\) because the note concerns the *specific outcome*—exactly what the admissibility clause forbids. This isn't just "expert deference":
    - **Chance is in the world**: Deck A's composition fixes \(P(\text{red}) = 0.6\) objectively. Students see this physically (cards are counted).
    - **Notes aren't experts**: Early on, students don't know reliability (Round 2). Even when revealed (Round 4), the note's 70% reliability is *admissible* evidence (updates the chance via conditional probability), unlike the raw note in Round 2.
  - **Swap Tests Objectivity (Round 3)**: When decks swap, chance changes from 0.6 to 0.5 *independently of notes*. Students who overreact (e.g., burned note-holders setting \(p = 0.4\) for a "RED" note) learn that chance is separate from past evidence.
  - **Your Friend's View (Expert Deference) is Partially Right, but Shallow**: 
    - **Similarity**: In Round 4, with reliability known, updating credence *resembles* expert deference (70% reliable "forecaster").
    - **Divergence**: Rounds 2–3 show chance operates *without* experts. Notes in Round 2 have no track record; they're "oracles" with unknown reliability, forcing students to confront inadmissibility. The Principal Principle explains *why* you defer to experts when reliability is known (it's admissible), but it starts from mind-independent chance.

  **Conclusion**: The activity favors **your view**. It shows admissibility isn't empty—it bites when evidence directly targets the outcome (Round 2). It also distinguishes chance from expertise: chance is the deck's fixed property, while notes are fallible inputs. Your friend's "expert deference" only explains Round 4, not the core gap in Round 2.

  ---

  ### **What Predictably Goes Wrong and How to Recover**
  - **Problem 1: Students Misunderstand Notes in Round 2**.
    - **Risk**: Some note-holders ignore notes (stick to 0.6); others treat them as 100% reliable (set \(p = 1\) or \(0\)).
    - **Recovery**: Mid-activity, clarify: "Notes are hints from an unreliable source; use them if you think they help." Highlight divergence on whiteboard ("Look: note-holders are at 0.7, others at 0.6—why?").
  - **Problem 2: Scoring Takes Too Long**.
    - **Risk**: Hand-calculation bogs down.
    - **Recovery**: Use a simple scoring table on the laptop (pre-made spreadsheet) or approximate (e.g., round scores to 0.1). Have students calculate their own scores.
  - **Problem 3: Swap Confusion in Round 3**.
    - **Risk**: Students miss that chance reset to 0.5; note-holders overcorrect.
    - **Recovery**: Emphasize the swap visually ("See this new deck? 10 red, 10 black. Chance is now 0.5!").
  - **Problem 4: Reliability Math in Round 4 is Hard**.
    - **Risk**: Students struggle with conditional probability.
    - **Recovery**: Sketch Bayes' rule on the board: \(P(\text{red} \mid \text{"RED" note}) = \frac{(0.7)(0.5)}{(0.7)(0.5) + (0.3)(0.5)} = 0.7\). If needed, skip calculation and say: "With 70% reliable notes and 50% chance, set \(p = 0.7\) for 'RED' notes."

  ---

  ### **What the Activity Can't Reproduce and the Cost**
  - **Structural Limitation: Stipulated Chance Undermines Mind-Independence**.
    - **Issue**: You stipulate the chance ("Deck has 12 red, 8 black → \(P = 0.6\)"), so students don't *discover* chance from the world. They rely on your authority, blurring the mind-independence point.
    - **Cost to Lesson**: Students may conflate chance with instructor testimony, weakening the contrast between "chance in the world" and "expert opinion." This makes admissibility feel more like "defer if you trust the teacher," potentially aiding your friend's view.
    - **Mitigation**: Stress that the deck *physically embodies* chance (cards are shuffled, counted). Discuss post-activity: "In real life, we infer chance from data, but here we shortcut to focus on admissibility."

  - **Other Limitations**:
    - **Notes Simulate, But Don't Perfectly Capture, Inadmissibility**: Real inadmissible evidence (e.g., a video of the draw) is 100% reliable; notes are noisy. This makes Rounds 2–3 messy.
    - **No Counterfactual Testing**: We can't show "what if chance was wrong" (e.g., a rigged deck) without breaking trust.
    - **Cost**: The lesson still succeeds in showing the admissibility clause *can* bite (via divergence), but it doesn't prove chance is always mind-independent. Use the debrief to frame this as a starting point.

  ---

  ### **Final Prep Checklist**
  1. **Decks Ready**: Deck A (12 red, 8 black), Deck B (10 red, 10 black).
  2. **Notes Prepped**: 15 slips/round (Rounds 2–4: 70% reliable, e.g., 10-5 for Deck A, 7-8 for Deck B).
  3. **Whiteboard Setup**: Scoring rule, round instructions, score tracker.
  4. **Laptop/Printer**: Display rules or pre-printed handouts.
  5. **Backup**: If time runs short, skip Round 4; use it as discussion fodder.

  This activity makes admissibility visceral: students *see* the gap between chance and notes, and the swap tests their learning. It won't resolve metaphysics, but it forces engagement with your debate. Good luck!
