  Okay, let me try to unpack what this user is really asking. They're a demand forecaster, not an academic, but they've been diving into game theory through a reading group. The Centipede Game example really stuck with them—especially how the standard backward induction solution (take immediately) doesn't match real human behavior (pass multiple times). 

  What bothers them isn't the mismatch itself, but how theorists "rescue" the rational-actor model by introducing unobserved types (e.g., "some people are altruistic"). The user points out the circularity: the share of altruistic types is inferred from the same data it explains, making the theory unfalsifiable. They see this pattern everywhere—like in the "sliver of doubt" argument where any tiny uncertainty about rationality can justify cooperation. 

  Their core frustration: this feels like cheating. The theory absorbs any behavior by tweaking invisible knobs (types, error rates), yet gets presented as explanatory. They want to know:  
  - Is there a name for this specific move? (Not just "ad hoc")  
  - How does it differ from similar concepts (e.g., QRE, level-k)?  
  - Is it the same as revealed preference tautologies?  

  They also hint at a deeper need: a practical "litmus test" to distinguish legitimate model adjustments from circular rescues. Their friend says "all science does this," but they sense something slippery here.  

  Breaking it down:  
  1. **The Pattern**: Theory fails → Posits hidden variable (e.g., "type" distribution) → Fits parameter to data → Claims success. The parameter isn't independently measured.  
  2. **Their Ask**:  
     - A precise term for this *specific* rescue tactic (if it exists).  
     - Delineation from related concepts (QRE/level-k aren't pure examples because they predict *new* patterns).  
     - Contrast with revealed preference (which is purely definitional, not empirical).  
  3. **Unspoken Need**: Tools to spot when a model is "explanatory" vs. "just fitting." They want intellectual honesty in how theories confront disconfirming evidence.  

  Key insight: Their intuition is sharp. They’ve identified a real methodological issue—*unfalsifiable flexibility*—common in behavioral microtheory. The closest label is **"rescuing by auxiliary assumptions,"** but they want the *version where the auxiliary is both unmeasured and fitted post-hoc*.  

  Why QRE/level-k feel different: Those parameters (e.g., λ in QRE) are *measurable* in principle (via multiple games/stakes) and often predict *out-of-sample*. The user’s "knob" lacks independent anchors. Revealed preference is different too—it’s not empirical at all, while this rescue *pretends* to be.  

  The boundary they seek:  
  🔴 **The Rescue Move** = Untethered parameter + No independent constraint + Fitted to explain the anomaly it was invented for.  
  🟢 **Legitimate Adjustment** = Parameter grounded elsewhere (e.g., λ from lottery choices) or predicts novel phenomena.  

  A name suggestion: **"Opportunistic Type Injection"** (OTI) – catchy, but maybe too cheeky. More formally: **"Post-Hoc Heterogeneity Rescue."**  

  Final note: Their friend’s "all science does this" misses the point. Good science *disciplines* flexibility (e.g., pre-registering models). Bad science lets parameters float freely to erase surprises. That’s what irks the user—and rightly so.
answer: |-
  What you've diagnosed is a specific and pervasive maneuver in behavioral game theory and microeconomics. It *does* have identifiable characteristics and boundaries, though no single universally agreed-upon term exists. Let's carve it precisely, name it, distinguish it from neighbors, and clarify its edges.

  ### The Core Move: Defined
  **Name:** **Ad Hoc Heterogeneity Rescue (AHR)**  
  *(Alternative: Post-Hoc Type Injection)*

  **Definition:** AHR occurs when a model's failure to predict observed behavior is "rescued" by:
  1.  **Introducing Unobserved Heterogeneity:** Positing multiple agent "types" (e.g., rational, altruistic, confused, vengeful, myopic) or unobservable parameters governing behavior (e.g., a probability of "irrationality").
  2.  **Fitting the Knob:** Setting the distribution of these types or the value of the parameters *solely* to match the specific, single anomalous data pattern that motivated the rescue.
  3.  **Explanatory Pretense:** Presenting the *fitted* model as an "explanation" for the data it was explicitly tuned to reproduce, without independent validation of the heterogeneity structure or parameter values.
  4.  **Immunization:** Rendering the core theoretical framework (e.g., rationality, backward induction) compatible with *any* observed outcome within the game being studied, by adjusting the hidden knob.

  **Essence:** The "explanation" boils down to: "People acted this way because a proportion *p* of them are Type X, and we know *p* is whatever value makes our model fit *this exact data*." The heterogeneity is a *free parameter* used solely for curve-fitting the anomaly.

  ### Why "Ad Hoc Heterogeneity Rescue" (AHR)?
  *   **Ad Hoc:** The heterogeneity is introduced specifically *because of* the failed prediction; it's not derived from a broader, independently motivated theory of human diversity.
  *   **Heterogeneity:** The core rescue mechanism is unobserved variation in types or parameters.
  *   **Rescue:** Its purpose is to save the core theoretical framework from falsification by the specific data point.

  ### How AHR Differs from Concepts You Mentioned (The Near Misses)

  1.  **Quantal Response Equilibrium (QRE) / Stochastic Choice Models:**
      *   **Similarity:** Introduces a free parameter (e.g., "noise" λ, error rate ε) that makes behavior stochastic.
      *   **Key Difference:** The parameter (e.g., λ) has a *general interpretation* (sensitivity to payoff differences, magnitude of errors). Crucially, **QRE aims for cross-game prediction.** A λ estimated from *one* game (e.g., matching pennies) should predict behavior in *other* games (e.g., prisoner's dilemma, auctions) with similar stakes/complexity. If λ needs wildly different values for different games, QRE *fails*. AHR lacks this aspiration; the "knob" is game-specific.
      *   **Edge:** QRE becomes AHR-like if λ is *only* ever fitted game-by-game solely to explain *that* game's data, with no attempt at cross-game consistency or independent measurement of error rates.

  2.  **Level-k / Cognitive Hierarchy Models:**
      *   **Similarity:** Introduces a distribution over "types" (L0, L1, L2, ...) defined by their depth of reasoning.
      *   **Key Difference:** The L0 behavior and the distribution over levels often have **plausible, independently motivated specifications** (e.g., L0 is random play or naive salience; level distribution is Poisson). While fitted to data, the structure constrains predictions. More importantly, these models make **distinctive predictions** about behavior in *new games* based on their cognitive demands (e.g., dominance-solvable vs. coordination games). They aren't *just* tuned to explain one specific anomaly.
      *   **Edge:** Level-k becomes AHR-like if the L0 specification and level distribution are *arbitrarily changed* for each new game *only* to fit that game's data, without a consistent theory of L0 or reasoning depth across games.

  3.  **The "Revealed Preference" Tautology:**
      *   **Similarity:** Both can make a theory compatible with any choice.
      *   **Key Difference:** Revealed preference is a *definitional or methodological stance* ("choices reveal preferences"). It doesn't *explain* specific patterns; it just says preferences can be inferred *ex post*. **AHR pretends to be an *empirical explanation*.** It claims the *reason* people passed in the Centipede game is *because* some are altruistic (and we know this because we inferred *p* from the passing data!). Revealed preference doesn't posit hidden *causes* like types; AHR does.
      *   **Edge:** If someone uses revealed preference to "explain" a specific, surprising pattern (e.g., "they passed because they *preferred* to pass, and we know this because they passed"), they are arguably committing a similar sin of vacuousness, but the *mechanism* (positing unobserved causal heterogeneity) is distinct from AHR.

  4.  **Ordinary Scientific Adjustment (Model Extension/Refinement):**
      *   **Similarity:** All theories adjust based on data.
      *   **Key Difference:** Legitimate scientific adjustment typically involves:
          *   **Independent Motivation:** The new component (e.g., risk aversion in expected utility) is motivated by phenomena *beyond* the single anomaly it might help explain (e.g., insurance purchases, lottery choices).
          *   **Testable Novel Predictions:** The extended model makes *new*, falsifiable predictions in *other* contexts (e.g., how risk aversion affects bidding in auctions).
          *   **Constrained Parameters:** Parameters have *plausible ranges* or can be *measured independently* (e.g., risk aversion from lottery choices, then applied to game contexts).
      *   **AHR lacks these.** The heterogeneity is *only* motivated by the anomaly, it makes *no new testable predictions* beyond accommodating the anomaly, and the key parameter (*p*) is *only* measurable by fitting it to the anomaly data itself.

  ### The Litmus Test for AHR

  Apply this checklist to a "rescue" move:

  1.  **Was the heterogeneity/parameter introduced *specifically and solely* to explain *this* failed prediction?** (Yes = AHR flag)
  2.  **Is the *only* evidence for the existence/nature/distribution of the proposed types the *very data* it's supposed to explain?** (Yes = Strong AHR)
  3.  **Does the "rescued" model make *no distinctive, testable predictions* for behavior in *other* games or contexts that weren't used to set the knob?** (Yes = AHR)
  4.  **Can the knob be adjusted to make the model fit *any* conceivable outcome within the original game structure?** (Yes = AHR)

  **If you answer "Yes" to 1, 2, and 3 (especially 2), it's almost certainly AHR.** Point 4 highlights its unfalsifiability *within the domain it was rescued for*.

  ### Applying to Your Centipede Examples

  1.  **"Altruistic/Confused Types" Rescue:** Classic AHR.
      *   Types introduced solely because of the passing data.
      *   Proportion *p* of altruists is inferred *only* from the proportion of passes observed.
      *   The "explanation" is circular: "People pass because some are altruistic, and we know some are altruistic because people pass."
      *   Makes no new predictions; *p* is game-specific.
  2.  **"Sliver of Doubt" Rescue:** Also AHR, though slightly more sophisticated.
      *   The "doubt" (probability of an "irrational" type) is introduced to explain cooperation.
      *   The *required amount* of doubt to explain the observed level of cooperation is inferred *from* the observed cooperation. ("How big does the sliver need to be? Big enough to match the data.")
      *   Again, circular: "They cooperate because they doubt rationality, and we know they doubt rationality enough because they cooperated to that extent."
      *   The "doubt" parameter can be set to rationalize *any* stopping point.

  ### Why It Feels Like Cheating (And Often Is)

  AHR exploits the gap between the *formalism* of a theory and its *empirical content*. It preserves the *mathematical structure* (e.g., equilibrium, rationality conditional on type) but drains it of *predictive power* by injecting unmeasured, untethered heterogeneity. It confuses *description* (we can build a model that fits) with *explanation* (we understand *why* it happened). Good science requires theories to *constrain* possible outcomes. AHR removes constraints within its domain of rescue.

  ### The Defense and Your Friend's Point

  Your friend is partly right: all science uses models with parameters fitted to data. **The difference is in the *discipline* imposed on the parameters and the model's ability to predict *novel* phenomena.** QRE and Level-k *aim* for discipline (cross-game consistency, constrained structures). AHR lacks this discipline. It's the difference between calibrating a thermometer using known standards and then measuring unknown temperatures (legitimate) vs. defining a "tempometer" whose reading is always set to match whatever number you just measured with a real thermometer (vacuous).

  You've pinpointed a genuine methodological pitfall. Recognizing AHR helps separate productive model development (e.g., QRE, Level-k when used rigorously) from theoretical evasion masquerading as explanation. The key is demanding that heterogeneity or new parameters be *independently motivated* and lead to *testable novel predictions* beyond the single anomaly that prompted their introduction.
