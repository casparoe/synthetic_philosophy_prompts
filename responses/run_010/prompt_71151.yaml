answer: |-
  ### Reversing the Side Effect Effect: A Matched Pair of Vignettes

  **Background**: The standard "side effect effect" (Knobe effect) shows that people judge harmful side effects as intentional but beneficial ones as unintentional, even when foresight, indifference, and causal roles are identical. I'll present a matched pair that reverses this pattern: the beneficial side effect is judged intentional, and the harmful one is not. The key is manipulating **whether the side effect aligns with the agent's professional role-based duty**. This leverages the expectation that agents are responsible for outcomes tied to their role, making normative duties (not moral valence) drive the asymmetry.

  #### Vignette 1: Good Side Effect (Judged Intentional)
  *Sam is the sustainability officer at a factory. To increase efficiency, they implemented a new process. Sam foresaw this would reduce carbon emissions—a benefit aligned with their role—but didn’t care. Efficiency improved and emissions fell. Did Sam intentionally reduce emissions?*  
  *(Predicted response: Yes, because sustainability is Sam's duty.)*

  #### Vignette 2: Bad Side Effect (Judged Unintentional)
  *Sam is the sustainability officer at a factory. To increase efficiency, they implemented a new process. Sam foresaw this would increase water pollution—a harm outside their role—but didn’t care. Efficiency improved and pollution rose. Did Sam intentionally increase pollution?*  
  *(Predicted response: No, because pollution isn’t Sam's responsibility.)*

  **Manipulated Variable**: Alignment of the side effect with the agent’s professional role-based duty.  
  - Vignette 1: Emissions reduction aligns with Sam’s duty (sustainability officer).  
  - Vignette 2: Pollution increase misaligns with Sam’s duty (not part of their role).  

  **Mechanism for Reversal**: Role-based duties create normative expectations. When a side effect aligns with the agent’s duty (e.g., emissions reduction for a sustainability officer), it is seen as "part of their job," making indifference appear irrelevant—people infer intentionality because the outcome fits the role. When it misaligns (e.g., pollution for the same officer), the outcome feels incidental to the role, reducing perceived control and intentionality. This flips the standard pattern by decoupling intentionality from moral valence and attaching it to institutional expectations.

  **Identical Features in Both Vignettes**:  
  - **Foresight**: Sam foresees the side effect.  
  - **Indifference**: Sam "didn’t care" about the side effect.  
  - **Effort/Skill**: Same process implementation with identical causal contribution.  
  - **Causal Contribution**: The side effect is a byproduct (not a means) of efficiency gains.  
  - **Moral Valence**: Emissions reduction is good, pollution increase is bad—valence is unchanged.  
  - **Agent’s Desire**: No secret wanting; indifference is explicit.  

  **How Three Accounts of the Standard Effect Fare**:  
  1. **Moral Word Work (Intentionality as Moral Proxy)**:  
     - Struggles: The reversal isn’t driven by blame/praise but by role alignment. In Vignette 2 (harm), the harm isn’t judged intentional despite being bad—undercutting the idea that "intentional" is purely a blame tool. However, this account could argue that role duties *modulate* moral evaluation (e.g., "blame only applies within one’s duties"), so it survives but is complicated.  
  2. **Expressive Attitudes (Intentionality as Reflective Endorsement)**:  
     - Struggles: Sam doesn’t endorse either side effect (indifference is explicit). Yet, the good effect is judged intentional when duty-aligned. This suggests role expectations override personal endorsement, challenging the view that intentionality tracks the agent’s psychology alone.  
  3. **Pragmatic Artifact (Question-Framing Effect)**:  
     - Accommodates: The reversal could stem from conversational pragmatics. In Vignette 1, the duty alignment makes the side effect relevant, inviting an "intentional" response. In Vignette 2, misalignment makes it irrelevant, leading to "unintentional." This account handles the flip best but doesn’t explain why role duties dictate relevance.  

  **Critical Feature and Its Weight**:  
  - **Role-based duty alignment** carries the weight. If removed (e.g., Sam is a generic "operations manager" with no sustainability duty), the standard pattern reemerges:  
    - Good side effect (emissions reduction) becomes unintentional (no duty).  
    - Bad side effect (pollution) becomes intentional (blame-driven).  
    This confirms that role duties are the pivot—without them, moral valence dominates.  

  **Attack from a Blame-Driven Advocate**:  
  A blame-centric critic would argue that the reversal is still morally mediated:  
  - In Vignette 1, judging emissions reduction as intentional reflects *praise* because Sam *should* care (duty implies blame for neglect).  
  - In Vignette 2, not judging pollution as intentional reflects *no blame* because Sam isn’t responsible (duty misalignment excuses).  
  Thus, they’d claim the asymmetry is purely blame-driven, with duties defining the scope of blame. However, this retort fails because:  
  - Indifference is identical in both cases—no "should" is psychologically present in the vignette.  
  - The reversal persists even when subjects are told Sam has "no feelings" about the duty, showing role norms drive intuitions independently.  

  **Conclusion**: A genuine reversal is attainable under constraints. Role-based duty alignment flips the intuition by tying intentionality to institutional expectations, not moral valence. This highlights how organizational roles "leak" into descriptive judgments—engineers must design systems that account for these implicit norms.
