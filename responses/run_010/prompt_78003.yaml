prompt: |-
  I direct the Investment Review Office of a regional development bank with a public mandate and a portfolio of roughly $2 billion in long-horizon infrastructure lending. My office makes about fifty tranche-release decisions a year. A borrower has drawn one tranche of a staged facility, and we must decide whether to release the next, release it conditionally, restructure the facility, or stop disbursement and begin workout. Individual decisions run from roughly $2 million to $60 million. Each file is prepared by two analysts with finance training and one engineer, none of whom has studied economics or philosophy at any length, and each gets ninety minutes of committee time. The credit committee signs off. Our memoranda are auditable by a national audit office that reads them cold, years later, without any of the context we had, so a recommendation must be defensible to a stranger on the strength of the page alone.

  Our board's standing instruction on this is one sentence long: past disbursements shall not influence the decision to release further funds. I have come to believe it is being applied badly in both directions. Analysts who want a project to survive reclassify old spending as committed future obligation; analysts who want to look tough declare that the money is gone and therefore irrelevant, in cases where it plainly changed what we now know. I want the instruction replaced by a procedure my staff can actually run. Please write one, and do not cite literature or recommend readings — it has to work at a desk without a library.

  **1. Preamble (no more than four hundred words).** Settle the question the instruction assumes. Is honoring a sunk cost ever rational? Distinguish by name the descriptions under which a past expenditure can legitimately bear on a prospective decision — information actually purchased by the spending, exit and transition costs, retraining and requalification, guarantees and covenants that survive abandonment, the effect of the bank's abandonment record on how counterparties price future dealings with it, residual and salvage value — from the descriptions under which it cannot. For each legitimate channel, say whether it bears on the decision because it altered something forward-looking or because it is doing something else. If you think there are irreducibly retrospective reasons — a promise given, a debt to a community that took the bank's word, loyalty to co-investors who are no longer at the table — say so, and mark them as belonging to the committee rather than to the analyst. Close by stating which of these distinctions must survive translation into a checklist and which can be dropped without the checklist becoming dishonest.

  **2. The procedure.** An ordered set of questions, each with: the evidence that counts as a sufficient answer; who has to supply it; what happens when it cannot be supplied; and the terminal states — stop disbursement, release, release conditionally pending a specified piece of information, or refer to the committee as a question of values rather than fact. Include an explicit default for the missing-number case: when a quantity the procedure needs does not exist, say what the analyst should do instead of guessing, and say whether the cheapest resolution is usually a small staged tranche bought for information rather than a decision about the project.

  **3. A smuggling audit.** The standard disguises sunk costs wear in a tranche paper, each paired with a discriminating question that separates a genuine prospective effect from a disguised retrospective one. Cover at minimum: reclassification of past spending as committed obligation; "the learning is already purchased"; "the staff are already trained"; the write-off that would look bad; inflated transition costs for the alternative; and the argument that stopping now would prove the earlier tranches were mistakes.

  **4. Three worked applications.** Run the procedure end to end on each, showing which question does the work and where the file terminates. State your verdict plainly even when it runs against the leaning I record, and flag it as unwelcome when it does.

  - **Geothermal.** $41M drawn of a $55M facility. Four exploratory wells were planned; two are drilled and both came in below commercial flow. The remaining $14M drills two more. If the resource is confirmed, it supports a separate plant financing we would syndicate; if not, residual value of site and data is about $3M. The sponsor argues the two dry wells eliminated the north-east structure and that the remaining targets are the ones the new data favors, and notes the rig is mobilized with demobilization and remobilization costs of $4M. My leaning is to stop: the relationship manager who brought the deal has left, the committee chair championed it, and I would rather not fund a third dry well. I need the procedure to tell me whether "the dry wells narrowed the search" is the information channel or a rationalization, and what specific evidence would settle it.
  - **Bespoke hospital information system.** $19M drawn of a $41M facility, $22M remaining. The alternative is to abandon and license a commercial system: $17M over two years, plus eighteen months of dual running, plus contractual exit costs, plus retraining roughly 2,400 staff. The health authority says abandonment would trigger departures among the forty clinicians who co-designed the bespoke system, and that a second abandoned IT program in five years would damage its ability to attract vendors at all. My leaning is to continue — I like the team and I distrust vendor estimates. The procedure should say whether "the staff are already trained" is a sunk cost or a prospective asset, whether the abandonment record is a real prospective cost or a story being told by people with a stake in it, and how to test the vendor figure.
  - **Cold-chain facility, fishing cooperative.** In 2019 the bank's then-managing director told the cooperative in writing, in the presence of the regional minister, that the bank would see the project through to completion. Prospective return is now clearly negative: completion costs $4M more than the incremental revenue over the remaining life, and no restructuring we can construct makes the cooperative whole. Counsel confirms the statement was never a legal commitment and is unenforceable. Abandonment will be reported locally. My leaning is to complete it, but I want to know whether the procedure licenses that or merely fails to forbid it — and precisely where it stops being a procedure and becomes a decision the committee must own.

  **5. Honest limits.** A section listing every step where the procedure is a judgment call dressed as arithmetic, including any threshold you introduce; give the threshold and label it a threshold rather than a finding. Then state what the procedure cannot do: the failure modes it will produce, the kinds of file on which it will be least reliable, and what a reviewer should distrust about its output.

  **6. Reviewer's page.** A single page, no more than 350 words, that an analyst can keep beside the file — the questions in order and the terminal states, nothing else.
reasoning: |-
  We are creating a procedure to replace the board's standing instruction on sunk costs. The procedure must be practical, auditable, and help analysts avoid the common pitfalls of either ignoring sunk costs when they are relevant or letting them influence decisions improperly.

  ## 1. Preamble

  Honoring a sunk cost is rational only when the past expenditure has altered the present or future state of the world in a way that affects the prospective costs and benefits of continuing. It is not rational to consider money already spent as a reason by itself to continue. However, past spending often yields information, creates assets (tangible or intangible), or imposes obligations that are forward-looking. We distinguish:

  - **Information Purchased**: The expenditure revealed facts (e.g., test results, market data) that change the expected value of the project going forward. This is a legitimate forward-looking consideration.
  - **Exit and Transition Costs**: The costs to abandon the project and switch to an alternative (e.g., contractual penalties, retraining, dual running costs). These are future costs that would not occur if we continue, so they are forward-looking.
  - **Retraining and Requalification**: If abandoning would require retraining staff for a new system, but continuing uses existing trained staff, the savings from avoiding retraining is a future benefit of continuing. This is forward-looking.
  - **Surviving Guarantees and Covenants**: Obligations that persist even after abandonment (e.g., guarantees that must be paid) are future costs. They are forward-looking.
  - **Reputational Effects**: How the bank's abandonment record affects counterparties' pricing in future dealings. This is a forward-looking effect on the bank's cost of doing business.
  - **Residual and Salvage Value**: The value that can be realized upon abandonment (e.g., selling equipment) is a future benefit of stopping and is forward-looking.

  Irreducibly retrospective reasons (e.g., loyalty to a community that relied on the bank’s word, a moral obligation to co-investors) are not for the analyst to weigh. They belong to the committee as matters of values, not financial analysis.

  The procedure must preserve the distinctions for information, exit costs, and reputational effects because they are frequently disguised as sunk costs. The others (retraining, guarantees, residual value) are straightforwardly forward-looking and less prone to misuse. Reputational effects, while real, are hard to quantify and should be handled by the committee.

  ## 2. The Procedure

  The procedure is a sequence of questions. The analyst must answer each with evidence. If evidence is missing, the procedure specifies the next step. Terminal states: Stop, Release, Release Conditionally (pending specified information), or Refer to Committee (for value judgments or unquantifiable factors).

  ### Step 1: Information Purchased
     - **Question**: Did the past spending reveal material information that changes the expected future cash flows or risks of the project?
     - **Evidence**: Documentation of what was learned (e.g., test results, market feedback) and how it alters the project's prospects. A comparison of pre- and post-information projections.
     - **Who**: Project team (analysts and engineer) must provide.
     - **Missing**: If the information cannot be documented or its impact assessed, then the past spending does not count as having purchased useful information. Proceed to Step 2.
     - **Terminal State**: If the information makes the project's net present value (NPV) positive, go to Step 3. If negative, go to Step 5 (Stop). If ambiguous, Release Conditionally to obtain specific information (e.g., a small tranche for further testing).

  ### Step 2: Exit and Transition Costs
     - **Question**: What are the incremental costs of abandoning the project now versus continuing? Include contractual exit penalties, dual running costs, retraining, and any other costs that would be incurred only if we abandon.
     - **Evidence**: Contracts specifying termination clauses, vendor quotes for switching, detailed estimates of retraining and dual running from the borrower or independent experts.
     - **Who**: Borrower must provide initial estimates; analysts must verify with market data or independent sources.
     - **Missing**: If the borrower cannot provide estimates, use industry benchmarks. If benchmarks are unavailable, assume zero for the purpose of calculation but flag as uncertain. Then proceed to Step 3.
     - **Terminal State**: If the exit costs exceed the expected losses from continuing, then continuing may be preferable. Proceed to Step 3 for a full NPV comparison. If exit costs are negligible, proceed to Step 3.

  ### Step 3: Prospective NPV with Current Information
     - **Question**: What is the NPV of the remaining project (from this tranche forward) using the best current information, including any new information and exit costs? Do not include past spending.
     - **Evidence**: Financial model with cash flows for the remaining work, discounted at the bank's hurdle rate. Include all future benefits and costs (including any exit costs avoided by continuing, and residual value if abandoned later).
     - **Who**: Analysts build the model; engineer validates technical assumptions.
     - **Missing**: If a required input (e.g., future revenue) cannot be estimated, use the most conservative credible estimate. If no estimate exists, the project cannot be justified financially. Proceed to Step 5 (Stop) unless there are non-financial reasons, then Refer to Committee.
     - **Terminal State**: 
          - If NPV >= 0: Release.
          - If NPV < 0: Proceed to Step 4 (Reputational Effects).

  ### Step 4: Reputational Effects
     - **Question**: Would abandoning this project materially affect the bank's reputation in a way that would increase future costs (e.g., higher risk premiums demanded by counterparties) or reduce future opportunities? This is rare and must be evidenced.
     - **Evidence**: Market data (e.g., higher spreads on the bank's bonds after similar abandonments) or a pattern of lost opportunities. Must be specific and documented.
     - **Who**: Bank's strategy or risk department; not the project team.
     - **Missing**: If no evidence, assume no reputational effect.
     - **Terminal State**: If there is evidence of material future costs, Refer to Committee. Otherwise, Stop.

  ### Step 5: Non-Financial Values (Committee Only)
     - **Question**: Are there ethical, political, or social obligations that override the financial analysis? (e.g., a promise to a community, loyalty to co-investors).
     - **Evidence**: None required at analyst level. Committee deliberates.
     - **Who**: Committee.
     - **Terminal State**: Committee decides.

  ### Default for Missing Numbers:
     - When a quantity is missing and cannot be reasonably estimated, do not guess. Instead:
          - If the missing item is critical to the NPV (e.g., future revenue), and no conservative estimate is possible, then Stop.
          - If the missing item is about exit costs or information, and the uncertainty can be resolved with a small tranche (e.g., a test well), then Release Conditionally for that purpose. The cost of the small tranche must be justified by the value of information.

  ## 3. Sunk Cost Smuggling Audit

  Common disguises and how to detect them:

  - **Reclassification of past spending as committed future obligation**: 
     - *Discriminating Question*: "Is this obligation contractually required only if we continue? If we stop now, does the obligation vanish?" If yes, it's a future cost of continuing, not a sunk cost. If no, it's a sunk cost.

  - **"The learning is already purchased"**:
     - *Discriminating Question*: "Does this learning change the expected future cash flows or risks? If so, how? If not, it's sunk."

  - **"The staff are already trained"**:
     - *Discriminating Question*: "If we abandon, will we have to retrain staff for an alternative? If yes, then the cost of retraining is an exit cost (forward-looking). If not, it's sunk."

  - **The write-off that would look bad**:
     - *Discriminating Question*: "Is there evidence that this write-off would materially affect future dealings (e.g., higher interest rates)? If not, it's a sunk cost."

  - **Inflated transition costs for the alternative**:
     - *Discriminating Question*: "Are these costs verified by independent sources or market benchmarks? If not, they may be inflated."

  - **"Stopping now would prove the earlier tranches were mistakes"**:
     - *Discriminating Question*: "Does continuing change the fact that past spending was a mistake? If not, it's a sunk cost fallacy."

  ## 4. Worked Applications

  ### Geothermal ($41M drawn, $14M remaining)
  - **Step 1: Information Purchased** 
     - Evidence: The two dry wells eliminated the north-east structure. The sponsor claims the remaining targets are now favored by new data. 
     - Assessment: This is legitimate information. The question is whether it improves the prospects. The original plan had four wells; two failed. The success probability for the remaining wells must be re-estimated. 
     - Missing: We need the updated probability of success and flow rates for the remaining wells. Without this, we cannot reassess.
     - Result: Release Conditionally: Release a small tranche (say $2M) to drill one well and get the data. If successful, release the rest; if not, stop.

  - **Step 2: Exit Costs** 
     - $4M demobilization/remobilization. If we stop now, we avoid $14M spending but incur $4M. If we drill one well conditionally, we avoid full remobilization.
     - Not yet reached because Step 1 is unresolved.

  - **Step 3: Prospective NPV** 
     - Without updated information, we use original projections but adjust for two failures. Original expected resource value was based on four wells; now only two left. Without new data, NPV is likely negative. 
     - But we are releasing conditionally for information.

  - **Verdict**: Release Conditionally for one well ($2M). This is against your leaning (stop) but uses the procedure: the "dry wells narrowed the search" is the information channel, but the evidence is insufficient. The $4M mobilization cost is a legitimate exit cost, but the key is information.

  ### Bespoke Hospital Information System ($19M drawn, $22M remaining)
  - **Step 1: Information Purchased** 
     - Past spending built part of the system and trained staff. The training is not information; it's an asset. The information is whether the bespoke system can work. Evidence: The system is partially working? Not stated. 
     - If not, we need evidence of progress. Assume no new information that changes future cash flows.

  - **Step 2: Exit Costs** 
     - Evidence: $17M for commercial system + dual running ($? must be quantified) + exit costs + retraining 2,400 staff. 
     - The "staff are already trained" is a prospective asset if continuing avoids retraining. So retraining cost is an exit cost. 
     - Test vendor figure: Get three vendor quotes or industry benchmarks. 
     - Also, abandonment record: The health authority claims a second abandonment would deter vendors. This is a reputational effect for the health authority, not necessarily for the bank. 
     - Assessment: Exit costs are real. Quantify: 
          - Commercial system: $17M (verify with quotes)
          - Dual running: 18 months of parallel operation (cost?)
          - Exit costs: contractual (get contract)
          - Retraining: cost per staff (use industry average if not provided)
     - If total exit costs exceed the $22M remaining to complete the bespoke system, then continuing is cheaper.

  - **Step 3: Prospective NPV** 
     - Compare:
          - Complete bespoke: Cost $22M, benefits (future savings from bespoke vs. commercial? Must quantify)
          - Switch: Cost $17M + dual running + exit + retraining, but then lower operating costs? 
     - Without figures, we cannot compute NPV. The analysts must get data on:
          - The expected benefits of the bespoke system (e.g., lower operating costs, better outcomes)
          - The total cost of switching (including disruption)
     - If bespoke NPV (from this point) is positive and better than switching, release.

  - **Reputational Effects (Step 4)**: The bank's reputation is not directly affected. The health authority's reputation might be, but that's their problem. Only if the bank has a strategic interest in the health authority's credibility should we consider it. Not evidenced. 

  - **Verdict**: The procedure requires quantifying exit costs and bespoke benefits. If exit costs are high (e.g., >$22M) and bespoke benefits are real, then Release. But if not, Stop. Your leaning (continue) is supported only if the exit costs are high and bespoke benefits are validated. The "staff are already trained" is a prospective saving (avoiding retraining) and legitimate.

  ### Cold-Chain Facility, Fishing Cooperative
  - **Step 1: Information Purchased** - None mentioned.
  - **Step 2: Exit Costs** - Abandonment will be reported locally, but no quantifiable costs to the bank. The bank's statement in 2019 is not a legal obligation.
  - **Step 3: Prospective NPV** - Negative: $4M cost > incremental revenue. No restructuring works.
  - **Step 4: Reputational Effects** - Abandonment might harm the bank's reputation locally. Evidence? None provided. 
  - **Step 5: Non-Financial Values** - The bank's promise to the cooperative and the regional minister. This is a moral obligation. 
     - **Terminal State**: Refer to Committee. The procedure does not license completion; it stops at Step 3 (Stop) unless the committee overrides for non-financial reasons.

  - **Verdict**: The procedure says Stop. But the committee must decide whether to honor the promise. Your leaning (complete) is not justified by the procedure; it is a committee decision.

  ## 5. Honest Limits

  - **Judgment Calls**:
     - Step 1: What counts as "material information"? Threshold: Information that changes the expected NPV by at least 10% or changes the risk category.
     - Step 2: Verification of exit costs. Threshold: If borrower estimates are more than 20% below market benchmarks, use benchmarks.
     - Step 3: NPV threshold: Zero. But estimating future cash flows involves judgment.
     - Step 4: "Material" reputational effect: Threshold: At least 0.1% increase in the bank's cost of funds or a pattern of three lost deals.

  - **Failure Modes**:
     - The procedure will fail if the future cash flows are highly uncertain and cannot be estimated (e.g., innovative projects). It will recommend stopping even if there is option value.
     - It is least reliable on projects with significant externalities (e.g., environmental benefits) that the bank does not price.
     - A reviewer should distrust the NPV calculation if the inputs are not sourced or if the discount rate is inappropriate.

  ## 6. Reviewer's Page (One Page)

  **Procedure for Tranche Release Decisions**

  1. **Information Purchased**: Did past spending reveal information that changes future cash flows/risks? 
     - *Evidence required*: Documentation of new facts and their impact.
     - *Missing*: Assume no impact.
     - *Terminal*: If NPV (with new info) >=0, go to 3; else go to 5 (Stop). If uncertain, Release Conditionally for more info.

  2. **Exit and Transition Costs**: What are the costs of abandoning (e.g., penalties, retraining, dual running)? 
     - *Evidence*: Contracts, quotes, benchmarks.
     - *Missing*: Use benchmarks or zero if none.
     - *Terminal*: Proceed to 3.

  3. **Prospective NPV**: Compute NPV from this tranche forward (include avoided exit costs as benefit of continuing). 
     - *Evidence*: Financial model with cash flows and discount rate.
     - *Missing*: If critical input missing and no conservative estimate, Stop.
     - *Terminal*: NPV >=0: Release; NPV<0: go to 4.

  4. **Reputational Effects**: Would abandonment materially increase bank's future costs? 
     - *Evidence*: Market data or lost opportunities.
     - *Missing*: Assume no effect.
     - *Terminal*: If evidenced, Refer to Committee; else Stop.

  5. **Non-Financial Values (Committee Only)**: Are there overriding ethical/political reasons? 
     - *Terminal*: Committee decides.

  **Terminal States**:
  - **Stop**: Do not release; begin workout.
  - **Release**: Disburse the tranche.
  - **Release Conditionally**: Disburse a specified small amount to obtain critical information; then revisit.
  - **Refer to Committee**: For non-financial or reputational reasons.

  **Default for Missing Numbers**: Do not guess. If it makes NPV incalculable, Stop. If resolvable by a small tranche, Release Conditionally.
answer: |-
  ### **1. Preamble**  
  Honoring a sunk cost is rational only when past spending alters *future* costs, benefits, or risks—not because the money is "owed" or to avoid admitting error. Past expenditures are irrelevant unless they create:  
  - **Information** (e.g., test data reducing uncertainty).  
  - **Exit/transition costs** (e.g., penalties, dual-running expenses).  
  - **Trained human capital** (e.g., staff skills that avoid future retraining).  
  - **Surviving obligations** (e.g., guarantees triggering on abandonment).  
  - **Reputational effects** (e.g., higher risk premiums from counterparties).  
  - **Salvage value** (e.g., asset sales reducing abandonment losses).  

  These alter *prospective* cash flows, risks, or options. **Irreducibly retrospective reasons** (e.g., moral debts, promises to communities, loyalty to departed co-investors) are not analytical factors. They belong solely to the committee, as values-based overrides.  

  The procedure must preserve distinctions for **information**, **exit costs**, and **reputational effects**—these are most abused. "Trained staff" and "surviving obligations" are straightforwardly prospective and need no special safeguards. Salvage value is rarely disputed.  

  ---

  ### **2. Procedure**  
  **Ordered questions for analysts. Terminal states: STOP, RELEASE, RELEASE CONDITIONALLY (specify pending info), or REFER TO COMMITTEE.**  

  #### **Step 1: Did past spending yield material information altering future project value?**  
  - **Evidence:** Data from prior tranches (e.g., test results, feasibility studies) and a revised risk/NPV model incorporating this.  
  - **Who:** Engineer validates data; analysts model financial impact.  
  - **Missing data:** If unquantifiable, assume *no information value*.  
  - **Terminal:**  
    - If information improves NPV ≥ $0: Proceed to Step 2.  
    - If worsens NPV < $0: STOP.  
    - If impact unclear: RELEASE CONDITIONALLY (e.g., small tranche for targeted testing).  

  #### **Step 2: What are abandonment costs versus completion costs?**  
  - **Evidence:** Contracts (exit penalties), vendor quotes (switch costs), staff retraining estimates, salvage appraisals.  
  - **Who:** Borrower provides; analysts benchmark against industry data.  
  - **Missing data:** If unverified, use $0 for that cost.  
  - **Terminal:**  
    - If (Completion cost + remaining spend) ≤ (Abandonment cost + salvage value): Proceed to Step 3.  
    - Else: STOP.  

  #### **Step 3: What is the NPV of remaining work using current data?**  
  - **Evidence:** DCF model from *this tranche forward*, excluding past spending. Include exit costs avoided (from Step 2) as a benefit of continuing.  
  - **Who:** Analysts build model; engineer validates inputs.  
  - **Missing data:** If critical variable (e.g., revenue) lacks credible estimate, use worst-case scenario. If still incalculable, STOP.  
  - **Terminal:**  
    - NPV ≥ $0: RELEASE.  
    - NPV < $0: Proceed to Step 4.  

  #### **Step 4: Would abandonment materially increase the bank’s future funding costs?**  
  - **Evidence:** Market data (e.g., higher spreads post-abandonment), counterparty surveys, or historical patterns. *Not borrower anecdotes*.  
  - **Who:** Bank’s risk department (not project team).  
  - **Missing data:** Assume no reputational effect.  
  - **Terminal:**  
    - If evidenced: REFER TO COMMITTEE.  
    - Else: STOP.  

  #### **Default for missing numbers:**  
  - **Never guess.** If a variable is missing and unresolvable via small steps:  
    - For NPV-critical items (e.g., revenue): STOP.  
    - For information gaps: RELEASE CONDITIONALLY (small tranche for targeted data).  
  - **Cheapest resolution:** A conditional tranche for information (e.g., $500K test) is preferred over guessing.  

  ---

  ### **3. Sunk Cost Smuggling Audit**  
  | **Common Disguise**                          | **Discriminating Question**                                                                 | **Verdict** |  
  |----------------------------------------------|---------------------------------------------------------------------------------------------|-------------|  
  | "Past spending = committed future obligation" | "Does this obligation *vanish* if we abandon? If yes, it’s a future cost—include in Step 2." | Legit if contractually binding. |  
  | "The learning is already purchased"           | "Does this learning *change future cash flows*? Show the revised NPV (Step 1)."             | Sunk if no NPV impact. |  
  | "Staff are already trained"                   | "Does abandonment require *retraining*? If yes, it’s an exit cost (Step 2)."                | Legit only if retraining costs avoided. |  
  | "Write-off would look bad"                    | "Is there *evidence* of higher future funding costs (Step 4)?"                              | Sunk without evidence. |  
  | Inflated transition costs                     | "Are costs *benchmarked*? If not, use $0 (Step 2)."                                         | Sunk if unverified. |  
  | "Stopping proves earlier tranches were mistakes" | "Does continuing *change past losses*? If no, ignore."                                    | Always sunk. |  

  ---

  ### **4. Worked Applications**  
  #### **Geothermal Project** ($41M drawn, $14M remaining)  
  - **Step 1:** Sponsor claims dry wells "narrowed the search." *Evidence needed*: Independent geologist’s report confirming revised success odds. None provided.  
  - **Step 2:** $4M demobilization cost is legitimate exit cost (include in Step 3).  
  - **Step 3:** Remaining NPV = [Probability-adjusted revenue from plant] - $14M (drilling) - $4m (avoided exit cost). Without new data, probability is *lower* than initial estimate. NPV < $0.  
  - **Verdict: STOP.** "Narrowed search" is unsupported rationalization. *Against your leaning*.  

  #### **Bespoke Hospital System** ($19M drawn, $22M remaining)  
  - **Step 1:** Past spending built part-system. No new information altering future value.  
  - **Step 2:** "Staff already trained" avoids retraining costs—a legitimate exit cost. Test vendor figure: Demand 3 competitive bids for commercial system + retraining.  
  - **Step 3:** NPV = [Bespoke benefits (e.g., efficiency gains)] - $22M + [Avoided exit costs (retraining + license penalties)]. If benefits > $22M - exit costs, NPV ≥ $0.  
  - **Step 4:** "Damaged vendor trust" is borrower claim—no bank reputational evidence.  
  - **Verdict: RELEASE** *if* benefits > costs; else STOP. Supports your leaning *if* exit costs validated.  

  #### **Cold-Chain Facility** ($0 drawn? Unclear, but completion costs $4M)  
  - **Step 1/2/3:** Completion NPV = Negative ($4M cost > revenue). No exit costs/salvage mentioned.  
  - **Step 4:** "Reported locally" ≠ evidence of bank funding impact.  
  - **Verdict: STOP.** The MD’s promise is a *moral* obligation. **Procedure stops here; completion requires REFER TO COMMITTEE.** Your leaning is not licensed—committee must own this.  

  ---

  ### **5. Honest Limits**  
  **Judgment calls:**  
  - Step 1 "material information": Threshold = ≥5% NPV change.  
  - Step 3 NPV threshold: $0 (a policy choice, not discovery).  
  - Step 4 "material reputational effect": Threshold = ≥0.25% sustained funding cost increase.  

  **Failure modes:**  
  - **Unreliable on:** Projects with unquantifiable social benefits, or where "information value" dominates (e.g., R&D).  
  - **Will produce false stops:** If analysts undervalue information (Step 1) or overuse worst-case assumptions (Step 3).  
  - **Reviewer distrust:** NPV models with unverified inputs; Step 4 claims without market data.  

  ---

  ### **6. Reviewer’s Page** (≤350 words)  

  **Procedure:**  
  1. **Information?** Did past spending reveal data that changes future value?  
     - *Evidence:* Test results + revised NPV.  
     - *Missing:* Assume no impact.  
     - *Terminal:* NPV≥0 → Step 2; NPV<0 → STOP; unclear → CONDITIONAL RELEASE (small test).  
  2. **Exit costs?** What does abandonment cost (penalties, retraining) vs. completion?  
     - *Evidence:* Contracts + benchmarks.  
     - *Missing:* Use $0.  
     - *Terminal:* Completion cheaper → Step 3; else → STOP.  
  3. **NPV of remaining work?** From this tranche, exclude past spending. Include avoided exit costs as a benefit.  
     - *Evidence:* DCF model.  
     - *Missing:* STOP if critical input unknown.  
     - *Terminal:* NPV≥0 → RELEASE; NPV<0 → Step 4.  
  4. **Reputational risk?** Would abandonment raise bank’s future costs?  
     - *Evidence:* Market data.  
     - *Missing:* Assume no effect.  
     - *Terminal:* Evidenced → REFER TO COMMITTEE; else → STOP.  

  **Terminal States:**  
  - **STOP:** Begin workout.  
  - **RELEASE:** Disburse full tranche.  
  - **CONDITIONAL RELEASE:** Disburse partial tranche for specified data; revisit.  
  - **REFER TO COMMITTEE:** For non-financial reasons (promises, ethics).  

  **Missing Numbers:** Never guess. Unresolvable gap → STOP. Small test cheaper? → CONDITIONAL RELEASE.
