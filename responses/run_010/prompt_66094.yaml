  ### Explanation Stance Sorting Tree  
  A decision tree to classify stances on explanations, based solely on the *proposal's content* about a higher-level process. Answer each question concretely for one explanation. Nodes ordered by diagnostic power.  

  **Nodes (Questions about the Explanation):**  
  1. **Does the explanation treat the higher-level phenomenon as existing independently, not just as a label?**  
     - *Yes*: Go to 2.  
     - *No*: Go to 6.  

  2. **Does the explanation claim the phenomenon is fully determined by lower-level processes?**  
     - *Yes*: Go to 3.  
     - *No*: Go to 4.  

  3. **Can the explanation be stated compactly (without simulating the entire system's history)?**  
     - *Yes*: Go to 5.  
     - *No*: **Leaf: Derivable but unusable** (Awkward: Must accept science cannot provide a compact explanation).  

  4. **Is the phenomenon derivable from the lower level (even via detailed simulation)?**  
     - *Yes*: **Leaf: Derivable but unusable** (Same as above).  
     - *No*: Go to 8.  

  5. **Does the explanation invoke intermediate processes or levels?**  
     - *Yes*: Go to 7.  
     - *No*: **Leaf: Reductive eliminativism** (Awkward: Must explain why the higher-level description persists despite being dispensable).  

  6. **Does the explanation replace the phenomenon with a description at a different level?**  
     - *Yes*: **Leaf: Burden relocation** (Awkward: Must show the new burden is easier to discharge).  
     - *No*: **Leaf: Eliminativism without replacement** (Awkward: Must justify why the phenomenon is illusory, not just incompletely described).  

  7. **Do intermediate levels add causal efficiency beyond the base?**  
     - *Yes*: **Leaf: Reduction with intermediate accelerators** (Awkward: Must prove intermediates are causal, not just descriptive).  
     - *No*: **Leaf: Causally redundant higher level** (Awkward: Must explain why the higher level exists if it does no work).  

  8. **Does the explanation grant the phenomenon causal power over its parts?**  
     - *Yes*: **Leaf: Novel and underivable higher level** (Awkward: Must explain downward causation without overdetermination).  
     - *No*: **Leaf: Inexplicable emergence** (Awkward: Must abandon hope of explaining how it arises).  

  ---

  ### Leaf Summary (Stances)  
  1. **Reduction with intermediate accelerators**: Real, reducible, intermediates are causal accelerators.  
  2. **Reductive eliminativism**: Real but reducible to base with no intermediates; higher level is dispensable.  
  3. **Causally redundant higher level**: Real but its causal role is filled by the base; higher level is inert.  
  4. **Novel and underivable higher level**: Real, irreducible, and governs the base causally.  
  5. **Derivable but unusable**: Real and reducible in principle, but only via simulation (no compact explanation).  
  6. **Inexplicable emergence**: Real and irreducible, but no causal power or explanation of origin.  
  7. **Burden relocation**: Phenomenon is unreal; explanation "solves" it by moving it elsewhere.  
  8. **Eliminativism without replacement**: Phenomenon is unreal with no replacement; only the base exists.  

  *(Unnamed cells: No logically coherent or defended stances missing. All combinations covered.)*  

