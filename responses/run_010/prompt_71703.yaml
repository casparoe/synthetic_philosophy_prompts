prompt: |-
  ok so I'm in sixth form and I've gone down a rabbit hole about possible worlds for my EPQ, and I'm stuck on the bit where Lewis says an ordinary person doesn't literally exist in other worlds, only in some counterpart-y way, whereas Kripke says the very same person is right there. Everything I read just rehashes the same two moves — the Humphrey complaint and "nothing but a substitute" — which isn't much use to me.

  Could you build me a fresh case where the two views genuinely come apart on a boring, everyday de re claim about one specific individual, the sort of thing you'd say in normal conversation, like "she could have gone to art school instead", and where the intuition most people would have favours transworld identity rather than Lewis? Ground rules: no fission, no cloning, no teleporters or time travel; the divergence can't just come from resemblance being vague or borderline, because that feels like the cheap way out; and it has to be about a particular person, not a species or a kind. Also, the case should generate the difference out of the theories themselves rather than just be stipulated to have it.

  Then: one paragraph for the scenario, then spell out what each theory says about the claim and why they differ, name the exact feature of the case thats doing the work, tell me what happens if I take that feature out, and say how a Lewisian would try to convince me my intuition is confused rather than correct. American English please, and I dont need any references or book lists — just the reasoning.
