  **Municipal Committee on Public Amusements**
  **Notice of Determination: Applications 24-T-178 (Thespian Collective Ltd.) & 24-I-055 (Civic Experience Group)**
  **Re: Proposed Public Amusements, Central City Square**

  **Date:** October 26, 2023
  **File Ref:** CPA/Det/2023/09

  **1.0 Introduction**
  Pursuant to Municipal Bylaw 451.7 (Regulation of Public Gatherings and Amusements), the Committee on Public Amusements ("the Committee") has reviewed applications 24-T-178 ("Theatrical Production") and 24-I-055 ("Immersive Civic Engagement") for the use of Central City Square ("the Square") during the upcoming festival period. Both applications propose distinct forms of public diversion occupying the same space and timeframe. After due consideration of the applications, supporting documentation, and the Committee's mandate to safeguard public character and harmony, this Notice conveys the Committee's determination.

  **2.0 Application 24-T-178 (Theatrical Production): Determination & Grounds for Refusal**
  **2.1 Determination:** Application 24-T-178 is **REFUSED**.
  **2.2 Grounds for Refusal:**
      *   **(a) Reinforcement of Prevailing Mores:** The proposed activity, involving scripted performance by hired professionals for passive spectatorship, inherently functions to reflect and amplify existing societal attitudes and behaviours present within the city. The Committee finds no credible mechanism within this format for the correction or improvement of public character; it merely mirrors the current state, potentially intensifying its flaws.
      *   **(b) Distortion of Social Virtues:** The structure of comedic or dramatic performance, as proposed, inherently risks presenting plain-spoken honesty and integrity in a manner susceptible to ridicule, while rendering agreeable those traits associated with excessive worldliness and social artifice. This inversion undermines the cultivation of genuine civic virtue.
      *   **(c) Objectionable Nature of Performer Engagement:** The core activity involves individuals offering their personae for public consumption in exchange for monetary remuneration. The Committee deems the commodification of personal expression and identity before an audience incompatible with the dignity expected of citizens and the fostering of authentic public spirit.
      *   **(d) Corrosive Influence of Hired Performance:** The inclusion of individuals, particularly women, performing for hire introduces an element fundamentally corrosive to both the performers themselves, by necessitating the sale of their personal presentation, and to the spectators, by encouraging passive consumption of commodified identity rather than active, virtuous participation.

  **3.0 Application 24-I-055 (Immersive Civic Engagement): Determination, Conditions of Approval & Grounds for Conditional Approval**
  **3.1 Determination:** Application 24-I-055 is **APPROVED**, subject to the stringent conditions stipulated below (Section 3.3).
  **3.2 Grounds for Conditional Approval:**
      *   **(a) Mitigation of Spectator Passivity:** The proposed format, lacking designated performers and relying entirely on audience participation to supply the action, inherently reduces the passive consumption characteristic of conventional spectacle. This aligns more closely with the Committee's objective of fostering active civic engagement over passive observation.
      *   **(b) Potential for Authentic Mutual Regard:** The described structure, wherein citizens gather collectively as both participants and observers of their own shared activity, possesses the theoretical capacity to engender a reflection of the self within the collective body. This mutual recognition forms a cornerstone of public concord.
      *   **(c) Absence of Professional Commodification:** The elimination of hired performers removes the inherently corrupting element of individuals selling their personae, thereby protecting both potential performers and spectators from the associated moral hazards.
  **3.3 Conditions of Approval:**
      *   **(i) Universal Participation Mandate:** The event design MUST ensure active participation is the *only* mode of engagement. Mechanisms must be implemented to seamlessly integrate *all* citizens present within the Square during the event hours into the core activity. Passive observation will not be permitted. A detailed Participation Integration Plan (PIP) must be submitted and approved 30 days prior to the event.
      *   **(ii) Guarantee of Mutual Enjoyment & Regard:** The activity structure MUST be demonstrably designed to ensure that every participant simultaneously observes the collective action and experiences genuine pleasure in both their own participation *and* the participation of all others. This must preclude any sense of exclusion, alienation, or unintentional mockery. Proof of concept via social cohesion modelling is required.
      *   **(iii) Prohibition of Coercion or Artificial Incentive:** Participation must arise solely from the citizen's innate desire for virtuous public fellowship and the inherent enjoyment of the collective activity itself. The use of facilitators, prompts, instructions, or material incentives (beyond basic safety guidance) is strictly forbidden. The activity must be entirely self-sustaining and self-explanatory upon citizen arrival.
      *   **(iv) Symbolic Focal Point:** A central, non-functional, aesthetically pleasing object (e.g., a decorative stake wreathed in locally sourced, seasonal flora) must be present as a unifying visual focus for the gathering. Its purpose is solely symbolic of shared civic space.
      *   **(v) Exclusion of Theatrical Elements:** No scripts, narratives, character roles, rehearsed actions, or designated performance areas are permitted. The action must arise spontaneously and entirely from the aggregated, undirected participation of the citizens present.
      *   **(vi) Monitoring and Compliance:** Committee Observers will be present throughout the event. Failure to maintain strict adherence to conditions (i) through (v), resulting in observable passivity, exclusion, participant distress, or the emergence of de facto performers/spectators, will result in immediate termination of the event and ineligibility for future applications by the Civic Experience Group.

  **4.0 Annex A: Estimated Cost Implications**

  *   **Application 24-T-178 (Refused):** Estimated direct municipal costs (security, sanitation, infrastructure): $5,000. Revenue potential via permit fees: $2,500. Net Municipal Cost: $2,500.
  *   **Application 24-I-055 (Approved, Conditional):**
      *   *Permit Fee:* Waived (to encourage non-commercial civic engagement).
      *   *Municipal Costs:*
          *   Symbolic Focal Point Construction/Maintenance: $1,500.
          *   Floral Arrangements (Weekly Refreshment): $800.
          *   Enhanced Sanitation (Projected Increased Footfall/Duration): $3,000.
          *   Security & Crowd Management (Ensuring Universal Participation/Preventing Passive Clusters): $12,000.
          *   Committee Observer Deployment (20 personnel @ 8 hours): $5,000.
          *   PIP Review & Social Cohesion Modelling Analysis: $3,000.
      *   *Total Estimated Net Municipal Cost:* $25,300.
      *   *Note:* Costs associated with participant non-compliance or event termination are not included in this estimate.

  **5.0 Conclusion**
  This determination reflects the Committee's statutory duty to license only those public amusements which demonstrably contribute to the authentic character and virtuous harmony of the citizen body. The conditions attached to the approval of Application 24-I-055 are necessary to ensure the activity achieves its stated potential for fostering genuine, active, and mutually affirming public fellowship. The Applicant is directed to submit the required PIP and modelling analysis within the stipulated timeframe. Failure to meet conditions will render this approval null and void.

  **Signed,**
  **Secretariat, Committee on Public Amusements**
