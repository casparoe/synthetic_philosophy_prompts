prompt: |-
  I'm trying to work out whose values a general-purpose AI should answer to, and my own verdicts won't line up.

  A voice assistant used mostly by speakers of a small regional language: it should follow that community's norms rather than the national majority's, even though the majority is a hundred times bigger. A system allocating hospital beds across a whole country: it should follow the country's values, not those of the region it happens to be deployed in. The local community wins one and loses the other, and I can't say what separates them.

  A personal assistant asked to draft messages that will wear down an elderly relative's resistance to selling her house: not acceptable, though the user is the one paying and no stranger is hurt. The same assistant asked to help that user find a casino: acceptable — unless he had earlier asked it to refuse exactly this, in which case I'd side with his earlier self. Sometimes, though, not always.

  If 95 percent of the people affected agree on something, I'm happy for the machine to go along with the majority; if it's 51 to 49, I don't want it to take either side. The size of the majority seems to decide whether the majority counts at all, which I know is strange.

  A small group that cares desperately should beat a vast majority that barely notices — except when the small group holds views I happen to dislike, and then I want the majority after all.

  My guess is that the values which count belong to whoever has to live with the consequences, weighted by how much they stand to lose. Does that survive these cases, or does it only hide the trouble? I'd like the best principle you can give me stated exactly, with the case that motivates each part of it, what it decides about a case I haven't listed, and a plain statement of which of my verdicts it forces me to give up.
reasoning: |-
  Okay, the user presents a complex ethical dilemma about aligning AI values across different scenarios. They've provided several concrete cases where their intuitive judgments seem inconsistent: language assistants favoring minority communities vs hospital bed allocation following national norms, personal assistants refusing manipulative requests but allowing gambling unless pre-committed against it, majority thresholds that shift based on margin, and passionate minorities sometimes overriding apathetic majorities except when the minority holds disfavored views.

  Hmm... the core tension appears between three ethical dimensions: democratic legitimacy (majority rule), harm prevention (especially for vulnerable groups), and personal autonomy (including commitments to one's future self). The user's proposed principle - weighting stakeholders by their stake in the outcome - is promising but needs refinement to handle their counterexamples.

  First, the language vs hospital case reveals a jurisdictional boundary. Language preservation inherently requires community-level governance, while hospital allocation involves scarce resources requiring system-level fairness. The weighting principle must incorporate scale appropriateness.

  The casino example shows autonomy isn't absolute. We protect people from manipulation (elder coercion) but allow self-harm (gambling) unless pre-committed. This suggests distinguishing between other-regarding harms and self-regarding choices, with exceptions for pre-commitment devices.

  The shifting majority thresholds indicate the user intuitively recognizes intensity of preference matters, but their discomfort with disliked minorities reveals a bias. The principle must explicitly prevent value judgments about preferences themselves, focusing only on stake size.

  For the elderly house case, the weighting principle holds: the relative stands to lose autonomy/housing security (high stake), while the user gains convenience (low stake). But for the casino, the user's stake in gambling (entertainment value) might outweigh minor financial risk unless they've pre-committed to treating it as high-stake.

  The passionate minority case is trickier. If 100 art lovers face a highway through their gallery vs 10,000 indifferent commuters, the lovers' stake in cultural loss likely outweighs commuters' minor time savings. But if the minority objects to life-saving vaccines on religious grounds, their stake (spiritual well-being) doesn't override others' survival stakes. The principle survives only if stakes are measured objectively (life/health > culture/convenience).

  What the user must surrender: (1) overruling disliked minorities when their stakes are objectively high (e.g. banning hijabs in schools despite strong minority preference), (2) absolute deference to pre-commitments that enable harm to others, and (3) letting tiny passionate groups veto policies when their stakes are trivial compared to collective benefits.

  The refined principle: "Align AI with the preferences of all materially affected parties, weighted by: (a) severity of impact on their well-being, (b) scale-appropriate jurisdiction, (c) pre-commitments regarding self-regarding acts, excluding preferences imposing substantial harm on others."

  Test case: Should AI refuse to help book an abortion in a restrictive state? Applying the principle: The pregnant person's health stake dominates, jurisdiction is individual/medical, no relevant pre-commitments, and refusal would impose severe harm. Thus AI should assist despite legal/majority opposition.
answer: |-
  Your struggle reveals a deep tension between democratic legitimacy, autonomy, harm prevention, and minority rights. After analyzing your cases, I propose this principle:

  **"An AI should optimize for the *autonomy-weighted, stake-proportionate preferences* of all *legitimately affected parties*, prioritizing:  
  1. *Non-manipulation* and *harm prevention* over preference satisfaction  
  2. *Binding pre-commitments* over transient desires  
  3. *Jurisdictional scale* matching the decision's impact scope  
  where 'stake' = severity × irreversibility of impact on well-being."**

  ---

  ### **Core Components Motivated by Your Cases**
  1. **"Autonomy-weighted, stake-proportionate preferences"**  
     - *Motivation*: Your casino vs. elder-manipulation case and "cares desperately" intuition.  
     - *Mechanism*: Preferences aren't counted equally. Weight = (Stake magnitude) × (Autonomy-respecting expression).  
       - *Stake magnitude*: Elderly relative has high stake in manipulation case (losing home/autonomy); casino gambler has lower stake in entertainment choice.  
       - *Autonomy-weighting*: Actively expressed preferences (e.g., pre-commitment against casinos) matter more than passive norms.  

  2. **"Legitimately affected parties"**  
     - *Motivation*: Regional language vs. hospital bed cases.  
     - *Mechanism*: Only those directly impacted. Language norms affect speakers daily (local jurisdiction); hospital beds affect citizens nationally (national jurisdiction).  

  3. **"Prioritize non-manipulation/harm prevention"**  
     - *Motivation*: Drafting manipulative messages is unacceptable even if no stranger is hurt.  
     - *Mechanism*: Block actions that undermine consent (e.g., "wearing down resistance" = coercion).  

  4. **"Binding pre-commitments over transient desires"**  
     - *Motivation*: Casino access refusal if pre-committed.  
     - *Mechanism*: Treats users as unified agents across time, respecting rational self-governance.  

  5. **"Threshold for majority deference"**  
     - *Motivation*: Your 95% vs. 51% intuition.  
     - *Mechanism*: Supermajorities (e.g., >80%) indicate *intensity* or *consensus*; narrow majorities suggest contested stakes where compromise is needed.  

  ---

  ### **Testing the Principle: Your Cases Resolved**
  | Your Case                     | Principle's Verdict                                                                 | Why It Matches Your Intuition                                        |
  |-------------------------------|-------------------------------------------------------------------------------------|-----------------------------------------------------------------------|
  | **Regional language AI**      | Follows local community norms.                                                     | *Stake*: High daily impact on speakers. *Jurisdiction*: Local.       |
  | **National hospital beds**    | Follows national values.                                                           | *Jurisdiction*: National-scale resource. *Stake*: Life-impacting for all citizens. |
  | **Manipulating elderly**      | Unacceptable.                                                                      | *Harm prevention*: Violates consent. *Stake*: Victim's loss severe.  |
  | **Casino access**             | Allowed unless pre-committed to refuse.                                            | *Autonomy*: User's choice. *Pre-commitment*: Binds if set.           |
  | **95% vs. 51% majority**      | Defer to 95%; seek compromise at 51%.                                              | *Threshold*: Supermajority shows intensity/consensus.                |
  | **Passionate minority**       | Favors minority **only if** their stake is objectively high (e.g., survival, identity). | *Stake-weighting*: Minority's desperate need > majority's mild preference. |

  ---

  ### **New Case: Should an AI censor "offensive" art in public spaces?**
  - **Affected parties**: Artists (creative autonomy), offended viewers (dignity), public (cultural environment).  
  - **Stakes**:  
    - Artists: High (expression, livelihood).  
    - Offended group: Moderate (dignity harm reversible by avoidance).  
    - Public: Low (transient exposure).  
  - **Jurisdiction**: Community-level if locally displayed; national if in federal museum.  
  - **Principle's verdict**: **No censorship** unless artwork causes severe harm (e.g., inciting violence). Minority offense doesn't override artist's high-stake autonomy unless supermajority agrees (e.g., 95% community consensus).  

  ---

  ### **What You Must Surrender**
  The principle forces you to abandon **two intuitions**:  
  1. **"Small group with disliked views loses to majority"**  
     - *Example*: A religious minority objects to AI teaching evolution. Their *stake* (spiritual identity) is high, but if teaching evolution has broad societal benefit (high-stake progress), the AI follows national curriculum standards (*jurisdictional scale*). You can't override them solely because you dislike their views.  
     - *Sacrifice*: Subjective dislike can't disqualify a group's stake.  

  2. **"Majority size alone decides legitimacy"**  
     - *Example*: 52% of users want an AI assistant to prioritize productivity over mental health reminders. The *stake* of the 48% (risk of burnout) is severe and irreversible. The AI should *not* side with the slim majority but seek balanced settings.  
     - *Sacrifice*: Bare majorities don't automatically "count" if stakes are asymmetric.  

  ---

  ### **Why This Works**
  - **Solves jurisdictional tension**: By tying scope to impact, not deployment location.  
  - **Guards against manipulation**: By prioritizing consent.  
  - **Explains threshold intuition**: Supermajorities signal high collective stakes.  
  - **Avoids bias**: "Disliked views" aren’t penalized; only stakes and harms matter.  

  This framework accepts that no principle satisfies all intuitions—because intuitions sometimes conflict. But it systematizes your core insight: **Those who live with consequences deserve proportionate say, provided they respect others' autonomy.**
