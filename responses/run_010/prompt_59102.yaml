  The student's criticism about multiple coherent systems is a common one (the isolation objection). However, the student then claims that the coherentist is forced to bring in experience and that this is foundationalism. This is a point of debate. Some coherentists do incorporate experience to avoid this problem, but they typically do not see it as foundationalism because the experience does not provide foundational justification but rather is part of the system (e.g., as a belief about experience). The student's claim that this is foundationalism smuggled in is a contentious interpretation.

