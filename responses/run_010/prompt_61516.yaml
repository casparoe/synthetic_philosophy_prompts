answer: |-
  ### Passage 1: The Warm Welcome
  "Good evening, everyone! Welcome to our university museum on this exciting night. It’s wonderful to see so many faces – longtime supporters, dedicated scholars, community friends, and especially those discovering this collection for the very first time. Tonight is special because museums aren’t just about displaying objects; they’re about the stories we tell with them, and sometimes, about asking new questions of old friends. Thank you all for joining this conversation about people who lived and were buried here on our coast over three thousand years ago. Your curiosity is what makes this place come alive."

  ### Passage 2: Acknowledging the Old Story
  "For nearly ninety years, the story told about these forty-plus Bronze Age burials was one we all recognize: a society led by warrior chiefs. That interpretation rested heavily on a very few graves containing impressive bronze weapons – swords, spears – that seemed to shout ‘elite status’. It made intuitive sense, fitting patterns seen elsewhere. The scholars of the 1930s, working with the methods and priorities of their time, built that compelling narrative from the most visible, dramatic evidence they uncovered. It became the established truth displayed on these very cases."

  ### Passage 3: Introducing the Flip - Focusing on What *Is* Present
  "So, why change the story now? Because our colleagues undertook a meticulous reanalysis of the *entire* collection, looking not just at the famous few, but at all forty-plus graves together. What emerged, surprisingly, was consistency, not contrast. The vast majority of these burials are remarkably similar: simple in form, modest in size, and containing only everyday items like plain pottery. Crucially, the few graves with weapons? Our researchers found strong signs they were disturbed long ago or contained objects that might not have originally belonged together – making them less reliable as snapshots of one person’s status. The overwhelming pattern across the whole group is one of shared practice."

  ### Passage 4: Honest Uncertainty - The Weight of Absence & Its Limits
  "But here's the vital thing to understand about this new interpretation: it leans heavily on what we *don’t* see. We don’t see grand monuments, we don’t see rich hoards of gold or bronze in most graves, we don’t see clear gradations in burial treatment hinting at ranks. **Now, let’s think about that.** Imagine if we *had* found just one clear, undisturbed grave full of treasures – that would feel like solid proof of high status, wouldn’t it? But finding *no* treasures in most graves? That’s trickier evidence. Organic materials like fine cloth or wood rot away. Maybe status was shown in ways that didn't get buried, like feasts. Our sample is what survived excavation and time. So, this new ‘flat community’ idea? It's our *best current reading* of the *total evidence we actually have*, but it rests on those challenging absences. It’s a shift in probability, not absolute proof."

  ### Passage 5: The Invitation to Engage
  "That inherent uncertainty isn’t a weakness; it’s the core of archaeology! It’s why we keep looking, why we re-study. Tonight isn't about declaring a final verdict etched in stone. It’s about sharing a significant shift in how we understand this community, based on careful work asking new questions of old finds. The new labels reflect this current thinking. So, as you explore the cases tonight, look closely at those simple pots, those similar graves. Ask yourself: What *does* this shared practice suggest about their society? How does it change the story? Your observations and questions are part of the journey. Enjoy discovering these coastal ancestors anew!"
