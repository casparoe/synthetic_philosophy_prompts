prompt: |-
  Six months ago I took over chairing the independent data monitoring committee for a trial I helped design, and in the same season I had to make a decision about predictive testing for a familial condition, so questions about whether to acquire evidence have stopped being abstract for me. I know the textbook result. Good's theorem, as I would state it: for a Bayesian who updates by conditionalization and whose utility depends only on the state of the world and the act she ends up choosing, free information can never be expected to make her worse off, because the expected weight of evidence in favor of the truth is a divergence between prior and posterior and so cannot be negative. What I lack is an account of why my own verdicts about looking and not looking come out the way they do.

  1. Interim efficacy data at the halfway mark, produced by an independent statistician under a stopping rule we fixed in advance: look, obviously.
  2. The same numbers, unblinded, handed to me directly with no agreed rule, when I know I over-weight small samples and know the sponsor would like me to see them: do not look. Same data, opposite verdict.
  3. A competitor's report that I know was built from a hand-picked subset and whose selection procedure I cannot reconstruct: look anyway, then discount.
  4. A result for an untreatable late-onset condition, generated years ago, sealed, that a former technician offers to open for me: I want it opened, and I do not think wanting that is a weakness.
  5. Being offered that very same test prospectively, free, next week: I would decline, and I think declining is right.
  6. The outcome of a coin toss that settled a bet a month ago, money long since moved, nothing revisable: I want to know. Zero instrumental value, and I do not think that is irrational.
  7. My surgeon offering to tell me beforehand whether his model predicts the operation will succeed, when he also tells me that patients who hear a prediction of failure withdraw and do worse than they otherwise would have: do not tell me.
  8. Whether a rejected grant application can be appealed: I would pay a good deal to know. Whether the rejection letter's tone was contemptuous: I would pay the same amount to avoid knowing.
  9. My late mother's diaries, which my sister has read and will not discuss: I want to read them, and I also do not think my sister was wrong to read them, or wrong to withhold what she found.

  Cases 4 and 5 are the pair I cannot reconcile: identical content, identical consequences, opposite verdicts, and I would defend both. Cases 2 and 3 bother me almost as much, since in both I expect the evidence to move me more than it should. The one I keep going back and forth on is whether to commission a two-hundred-thousand-dollar study of whether our program works in a subpopulation, when I already suspect the answer is no and a null result would end a program that is currently helping people.

  What I want is the principle, or the small set of candidate principles, that generates these verdicts. State it precisely, clause by clause, and tell me which case motivates each clause; I would like to see exactly where the instrumental-value story runs out and something else has to take over. Then tell me whether what you have given me is a repair of Good's theorem — in which case name the assumption each troublesome case violates — or a replacement for it. Then apply it to three cases I have not listed: a juror who could learn a fact the judge would exclude, a researcher deciding whether to run an evaluation she expects to fail, and a person deciding whether to read a partner's messages. Finally, be honest about which of my verdicts the principle forces me to abandon, including whether it can keep 4 and 5 or must collapse them.

  I would rather you commit than catalogue. Pick the account you think is correct, say plainly which of my verdicts it cannot save, and argue for paying that price; a menu of options with the choice left to me is not what I am after.
reasoning: |-
  Hmm, this user presents a fascinating philosophical and practical dilemma about the value of information. They're clearly highly sophisticated - a clinical trial chair with deep Bayesian training, wrestling with contradictions between textbook rationality and lived experience. The core tension is between Good's theorem (which says free information can't harm expected utility) and their intuitive verdicts across nine scenarios where information sometimes feels valuable, sometimes dangerous, and sometimes compelling despite zero instrumental value.

  What makes this compelling is their self-awareness about inconsistencies: case 4 vs 5 (same genetic test, retrospective vs prospective) have opposite choices, as do case 2 (unblinded sponsor data) vs 3 (biased competitor report). They're not just listing puzzles - they're demanding a unified principle that explains when information's psychological impacts override its Bayesian value.

  The user's framing suggests three layers: First, they want the violated assumptions behind each anomaly (e.g., case 6 shows utility functions aren't state-dependent). Second, they need a positive framework that handles "non-instrumental cravings" (like curiosity or dread). Third, they're testing whether any system can preserve both their "look/don't look" intuitions in cases 4/5 without contradiction.

  Key observations from their cases:
  - Control matters: Case 1 (structured interim analysis) vs case 2 (uncontrolled peek)
  - Agency asymmetry: Case 4 (past result) involves no choice, case 5 (future test) does
  - Psychological spillover: Case 7 (surgeon's prediction) shows information can actively harm
  - Epistemic boundaries: Case 9 (diaries) suggests some truths belong to specific knowers

  Their unresolved $200k study dilemma perfectly captures the tension: acquiring evidence might rationally compel terminating a helpful program. This isn't just about Bayesian updating - it's about how evidence transforms decision landscapes irreversibly.

  For the framework response, I'll need to:
  1) Reject utility-as-world-state-only (cases 6,8 show knowing/not-knowing are themselves states)
  2) Formalize "decision integrity" - how info acquisition can corrupt choice architecture (cases 2,7)
  3) Distinguish instrumental vs constitutive value of knowledge (case 6's coin toss satisfies curiosity as an end)
  4) Introduce temporal asymmetry: learning past truths (case 4) vs creating new epistemic commitments (case 5)

  The surgeon case (7) is particularly damning for pure Bayesianism - here, information induces a causal harm through psychological channels that aren't captured by conditionalization. Meanwhile case 8 (grant appeal vs tone) shows identical information structures can have opposite valence based on emotional weight.

  For their three test cases:
  - Juror learning excluded evidence: Would violate integrity of role, even if useful
  - Researcher running doomed study: Only justifiable if null result could be actionably distinguished from inconclusive
  - Reading partner's messages: Constitutive of trust violation regardless of content

  Crucially, my proposed framework will force surrendering the symmetry between cases 4 and 5 - retrospective knowledge of fate lacks the agential burden of prospective testing. The user might dislike this, but it's philosophically honest.
answer: |-
  Here is the unified principle that explains your verdicts, derived from your cases and designed to handle both instrumental and non-instrumental dimensions of evidence acquisition. It repairs Good's theorem by expanding the utility function and adding constraints on decision integrity.

  ---

  ### **The Principle of Epistemic Agency**  
  *(Clauses motivated by your cases)*  

  1. **Utility includes *anticipatory states* and *agential costs***:  
     - Utility depends not just on world-states and actions, but on *cognitive/emotional states during decision-making* (e.g., anxiety, curiosity, corrupted judgment) and *costs to agential integrity* (e.g., self-distrust, compromised roles).  
     - **Motivated by**: Case 2 (sponsor data risks self-distrust), Case 7 (prediction harms psychological state), Case 8 (dread of contemptuous tone).  

  2. **Information can *degrade the choice process***:  
     - Avoid evidence if it:  
       - (a) Impairs your ability to weigh it rationally *due to known biases* (even if you discount it later), or  
       - (b) Forces you into a *choice architecture* that conflicts with your role or values.  
     - **Motivated by**: Case 2 (unblinded data exploits bias), Case 7 (prediction coerces withdrawal).  

  3. **Past truths have *constitutive value*; future truths have *agential burden***:  
     - Knowing *settled facts* (past or present) can be intrinsically valuable for sense-making. *Unsettled futures* impose responsibility for shaping outcomes; hence, "unnecessary" knowledge of probabilities can paralyze or pre-empt agency.  
     - **Motivated by**: Case 4 (past genetic result aids self-narrative), Case 5 (prospective test creates avoidable dread), Case 6 (coin-toss outcome satisfies curiosity).  

  4. **Source reliability *cannot* be fully discounted if the selection process is opaque**:  
     - Biased evidence must be ignored (not just discounted) if you cannot reconstruct *how* it was selected *and* the source has incentives to manipulate you.  
     - **Motivated by**: Case 3 (competitor’s report: discounting suffices because methodology is assessable), contrasted with Case 2 (sponsor data: selection opaque + incentive).  

  5. **Some truths are *entitled* to knowers**:  
     - Access may be justified if the knowledge is relevant to your identity/relationships *and* the knower consents or is you. Withholding is permissible if it protects the knower’s boundaries.  
     - **Motivated by**: Case 9 (diaries: you are entitled to seek; sister is entitled to withhold).  

  ---

  ### **Repairing Good’s Theorem**  
  - **Violated assumption**: Good’s theorem assumes utility depends *only* on world-states and chosen acts. Your cases show utility includes:  
    - *Anticipatory states* (Cases 5, 7, 8).  
    - *Agential costs* (Cases 2, 7).  
    - *Epistemic goods* (Cases 4, 6, 9).  
  - **This is a repair**: It preserves conditionalization and expected utility maximization but expands the utility function to include cognitive/agential factors.  

  ---

  ### **Application to New Cases**  
  1. **Juror offered excluded evidence**:  
     - *Verdict*: Do not look.  
     - *Why*: Clause 2(b) – Acquiring it degrades your role integrity (jury’s impartiality requires adhering to rules). Even if useful, it risks mistrial or self-distrust.  

  2. **Researcher running a study she expects to fail**:  
     - *Verdict*: Run it if the null result would *change actionable priorities*; skip if failure only confirms known futility.  
     - *Why*: Clause 1 – Utility includes the cost of wasted resources vs. value of closing an epistemic gap. Clause 3 – Future truths impose burden (e.g., ending a program) unless they resolve ambiguity productively.  

  3. **Reading a partner’s messages**:  
     - *Verdict*: Do not read without consent.  
     - *Why*: Clause 5 – Messages belong to the partner’s epistemic domain. Clause 2(a) – Risk of misinterpreting context (bias). Clause 1 – Anxiety from ambiguous snippets outweighs instrumental benefit.  

  ---

  ### **Verdicts You Must Abandon**  
  - **Case 4 vs. 5 collapse**: The principle *cannot* preserve both verdicts.  
    - **Case 4 (retrospective test)**: Kept. Clause 3 – Past truth has constitutive value (self-understanding without agential burden).  
    - **Case 5 (prospective test)**: *Rejected*. You must decline *unless* the result would change a reversible action. Clause 3 – Future knowledge burdens agency (e.g., "Why gamble if I’m doomed?"). Instrumental harm is identical to Case 4, but agential/psychological costs dominate.  
    - **Cost of collapse**: Defending Case 5 requires ignoring the anticipatory dread (Clause 1) and burden of shaping an open future (Clause 3). Your intuition treats "identical content" symmetrically; the principle insists temporal context changes utility.  

  - **Case 6 (coin toss)**: Kept, but labeled *irrational*.  
    - Clause 3 saves it (constitutive value of settled facts), but Clause 1 admits it has no instrumental utility. Rational iff curiosity/utilizing mental bandwidth is a utility.  

  - **$200k subpopulation study**: Run only if:  
    - A negative result would *reallocate resources to better programs* (instrumental gain > cost), or  
    - Uncertainty *paralyzes broader decisions* (agential cost of doubt).  
    Else, decline – per Clause 3 (unnecessary burden of forcing action on a low-stakes question).  

  ---

  ### **Why Pay This Price?**  
  The principle prioritizes *you as an epistemic agent* over pure truth-seeking. Good’s theorem assumes you are a passive updater of beliefs; reality demands you protect your judgment (Cases 2,7), emotional state (Cases 5,8), and narrative autonomy (Cases 4,9). Surrendering symmetric verdicts for retrospective/prospective knowledge (4/5) is the cost of accounting for *time*’s role in agency: past truths liberate; future truths obligate. This is not a flaw but a reflection of how humans *use* evidence – not just to act, but to exist.  

  ---  
  "To know what questions are answerable is wisdom; to know which must remain unasked is integrity."  
  Your verdicts reveal a map of cognitive ethics – this principle names its coordinates.
