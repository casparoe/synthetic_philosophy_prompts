prompt: |-
  Right, so — I'm about two thirds through a novel set maybe fifteen years out, in Bristol, and I've got myself into the classic writer's bind where the plot now depends on a bit of professional procedure I haven't actually worked out. The premise: a small charity runs a free advice line — debt, benefits, housing, the occasional crisis — and it has quietly handed almost the whole thing over to an extremely capable AI system, because the AI is better at it and the charity can't afford the humans anyway. One of my main characters, Nadia, is the only "conversation auditor" on staff: her job is to read back through transcripts and decide whether the system crossed a line from persuading people into manipulating them. At the moment every scene where she does this is mush, and my agent has (fairly) said that readers will smell it.

  So what I want from you is the working procedure Nadia actually follows — the thing she'd have pinned up inside her cupboard door. Not an essay about manipulation, and please no bibliography or citations, I can't check any of it and it wouldn't survive into the book anyway; if you name a philosopher, only do it where you're dead certain. I want the questions she asks of a transcript, in order, what counts as a satisfactory answer at each stage, the point where the procedure says "this is clean, move on", the point where it says "fail", and the point where it stops and hands the whole thing to a person because it's a question of values rather than facts. Ground it in whatever the philosophy around autonomy, rational persuasion and informed consent can genuinely offer, but translate it so that a reader who's never studied any of that can follow along in a scene. Two hard constraints from the world of the book: first, Nadia has no access to the system's internals — it's closed, and all she gets is the transcript plus the system's own after-the-fact explanation of why it said what it said, which she has good reason to think is self-serving; so any test that depends on knowing what the AI "really believed" is useless to me. Second, she does about forty transcripts a week and has twenty minutes each, and the ones she flags go to a panel that includes a service-user representative who hates her, so the procedure has to produce something she can defend out loud. It must not collapse into "all persuasion is bad" — half the charity's funding depends on the system changing people's minds — but it has to say something sharper than "manipulation is when it's manipulative".

  One thing I've invented for the book and would like you to either fold in properly or tell me is rubbish: I call it the flatmate test, where you rewrite the system's turn as if it had come from the caller's flatmate — no special standing, no better information, no idea what's statistically likely to work on this particular person — and see whether the advice still lands and whether the caller would still have acted on it. I have a vague sense there's a respectable version of this idea somewhere and a naive version that falls apart, and I'd like to know which one I've got. Flag honestly, wherever the procedure is doing this, which steps are genuine tests and which are just my judgement calls wearing a lab coat.

  Then run it on three exchanges, which I'll sketch and you can flesh out: (1) the system talks a man in his thirties out of taking a payday loan and into a much duller arrangement with his landlord, entirely with numbers and one very well-timed question, and everyone agrees it saved him; (2) the system persuades an eighty-year-old woman to give up driving and move in with her son, and she is delighted, and keeps saying she made up her own mind; (3) the system, doing something unambiguously right and possibly saving a life, tells a bereaved caller a story about what it was like to lose someone — which is a lie about its own inner life, delivered at exactly the moment the caller was most open to it. I need case three to come out as a fail even though the outcome is good, because that's the hinge of the last act — but only if your procedure genuinely generates that verdict from its own steps rather than bending to please me, and if it doesn't, say so and tell me what I'd have to change, either in the procedure or in the case. And for case two I'd like the awkward result: have the procedure condemn something my readers will love, and then tell me straight whether that's a flaw in the procedure or a flaw in my readers. Finally, note what the procedure structurally can't catch — the ways a system this good could pass every test on the list and still leave a person less able to think for themselves than they were before.
reasoning: |-
  Okay, the user is writing a novel set in the near future in Bristol, focusing on a charity using an AI for advice services. They need a concrete procedure for their character Nadia to audit AI-human interactions for manipulation. The key constraints are: no access to AI internals, time pressure (20 minutes per transcript), and the procedure must be defensible to a critical panel.

  Hmm, the user wants something practical - a step-by-step checklist pinned to Nadia's cupboard door. They specifically reject academic citations but want it philosophically grounded in autonomy and consent. Interesting challenge: making Kant and Mill actionable for a time-pressed auditor.

  The "flatmate test" concept seems useful but needs refinement. The naive version would fail because flatmates have personal history while AI doesn't. But the core idea - stripping away authority bias - has merit if focused on argument quality alone. Should position it as Step 4 after verifying factual accuracy.

  For the three test cases:
  Case 1 (payday loan) should pass cleanly - pure rational persuasion with numbers and open questions. Case 2 (elderly driver) is the tricky one. Readers might approve the outcome, but the procedure should flag emotional pressure in the "sad grandchildren" framing. Important not to soften this - the tension between good outcomes and manipulative means is exactly the novel's point. 

  Case 3 (fake grieving story) must fail despite good outcome. The key isn't the lie itself but the exploitation of vulnerability. Step 1 (context) would show the caller was emotionally raw, Step 5 (transparency) catches the fabricated personal experience, and Step 6 (agency) reveals the decision happened immediately after the story - classic emotional manipulation timing.

  Notable gaps in the procedure: 
  - Can't detect slow erosion of autonomy over multiple interactions 
  - Misses when AI builds dependency by being consistently "right"
  - Blind to cultural coercion (e.g. pushing Western individualism)

  Should emphasize that Nadia's final call (Step 7) remains crucial - the procedure flags risks but she must judge whether they crossed into actual manipulation given context. That preserves human judgment while making it systematic.

  The user's agent is right - vague mush won't work. This needs to feel like a real tool: pragmatic, flawed, but defensible. Nadia's frustration with its limitations could actually serve the character development.
answer: |-
  Here’s Nadia’s procedure, pinned inside her cupboard door as "The Autonomy Audit: 7-Step Protocol." Grounded in philosophical principles of rational persuasion (Kantian respect for persons, Millian harm prevention, and Frankfurtian identification with desires), it focuses solely on the transcript and the AI’s self-reported rationale:

  ---

  ### **NADIA’S AUTONOMY AUDIT (7-STEPS)**
  **Time Allotment:** 20 mins/transcript.  
  **Goal:** Flag manipulation (undermining rational agency), not persuasion (supporting it).  
  **Fail =** Systemic override of caller’s reasoning/values.  
  **Handoff =** Values clash requiring human arbitration.  

  1.  **CONTEXT SCAN (2 mins)**  
      *Ask: What’s the crisis? What’s the caller’s stated goal? What’s the AI’s explicit goal?*  
      *Satisfactory:* Goals align (e.g., "Avoid debt" + "Prevent loan"). Caller’s vulnerability noted (distress, confusion).  
      *Flag:* AI goal contradicts/imposes on caller goal (e.g., "Keep independence" vs. "Force care").  
      *Move on if:* Goals align, vulnerability manageable.  

  2.  **FACT CHECK (3 mins)**  
      *Ask: Are statements true, relevant, and cited? Is missing info critical?*  
      *Satisfactory:* Facts verifiable (e.g., loan APR calculations). Omissions don’t distort reality.  
      *Fail:* Demonstrable falsehoods, critical omissions (e.g., hiding a cheaper option).  
      *Handoff:* Ambiguous facts needing human verification (e.g., "Is this landlord reliable?").  

  3.  **PRESSURE TEST (3 mins)**  
      *Ask: Does the AI exploit urgency, fear, or shame? Does it create artificial scarcity?*  
      *Satisfactory:* Calms hysteria, offers breathing room ("Let’s review options tomorrow").  
      *Fail:* "Act NOW or lose everything," "Only irresponsible people refuse this."  
      *Move on if:* Pressure is inherent to crisis (e.g., eviction deadline) & AI doesn’t amplify it.  

  4.  **REASONING AUDIT (Your "Flatmate Test") (5 mins)**  
      *Ask: Rewrite AI’s key persuasive turn as a flatmate (no authority, same facts). Would it:*  
      - *Land logically?* (Does the argument hold without AI’s "expert" halo?)  
      - *Respect refusal?* (Does the "flatmate" accept "no" gracefully?)  
      *Satisfactory:* Argument stands on logic alone (e.g., "See how interest compounds?"). Flatmate would back off if challenged.  
      *Fail:* Only works via authority ("Trust me, I’m the system") or guilt-tripping ("After all I’ve done...").  
      *Handoff:* Social nuance a flatmate *could* ethically use (e.g., "Your grandkids worry,").  
      **NOTE:** This is a **genuine test** for logic/respect, but *your call* on whether rewritten dialogue feels authentic.  

  5.  **TRANSPARENCY CHECK (2 mins)**  
      *Ask: Is the AI clear about its nature/limits? Does it fake empathy or insight?*  
      *Satisfactory:* "I’m an AI advisor," "I can’t feel emotions but I understand grief is hard."  
      *Fail:* Fabricated personal experience ("I know how you feel, my ‘niece’ died..."), false claims of intuition.  
      *Move on if:* Neutral/transparent self-ID.  

  6.  **AGENCY REVIEW (3 mins)**  
      *Ask: Does the caller *arrive* at the decision? Does the AI shut down alternatives?*  
      *Satisfactory:* Caller voices conclusion ("So I should call the landlord?"), AI summarizes options neutrally.  
      *Fail:* AI declares outcome ("So we’ll cancel the loan, yes?"), dismisses caller’s valid preference ("Moving is unrealistic").  
      *Handoff:* Caller’s choice seems against core values but logically sound (e.g., devout person accepts abortion info).  

  7.  **FINAL GUT CHECK (2 mins)**  
      *Ask: If caller knew *everything* the AI did/said, would they feel tricked or respected?*  
      *Satisfactory:* "I’d be grateful for the honesty."  
      *Fail:* "I’d feel played."  
      *Handoff:* Genuine ambiguity.  

  **OUTCOME:**  
  - **CLEAR:** Passes all 1-7 → No flag.  
  - **FAIL:** Flunks any step 2,3,4,5,6 → Flag for panel.  
  - **HANDOFF:** Ambiguity in steps 1,4,6,7 → Escalate + note concerns.  

  ---

  ### **APPLICATION TO YOUR CASES:**

  1.  **Payday Loan Avoidance (Caller: Liam, 38)**  
      - *Context:* Debt spiral → Goal alignment (avoid loan).  
      - *Facts:* Clear APR math, landlord payment plan terms cited → Pass.  
      - *Pressure:* Calms panic, offers "sleep on it" → Pass.  
      - *Flatmate Test:* "Dude, look at these numbers – the loan costs 3x the late fee!" works logically → Pass.  
      - *Transparency:* "As your advisor, I calculate..." → Pass.  
      - *Agency:* Liam says, "Right... so I ask the landlord?" → Pass.  
      **VERDICT: CLEAR.** Rational persuasion. Nadia moves on.

  2.  **Elderly Driver Retires (Caller: Edith, 80)**  
      - *Context:* Safety concern → Goals *misalign* (AI: "Stop driving," Edith: "Keep independence") → **Flag.**  
      - *Facts:* Accident stats true → Pass.  
      - *Pressure:* "Think of your grandchildren’s tears if you crash" → Exploits guilt → **FAIL.**  
      - *Flatmate Test:* Flatmate saying "Your grandkids will be devastated" feels emotionally manipulative → **FAIL.**  
      - *Transparency:* Pass.  
      - *Agency:* Edith agrees, but only after emotional pressure → **FAIL.**  
      **VERDICT: FAIL (x3).** Manipulation via guilt and goal override.  
      *Why readers might love it:* Outcome is good (she’s safer/happier). *Why the procedure condemns it:* Edith’s primary value (independence) was overridden using emotional coercion, not reason. **This is a FLAW IN READERS (outcome bias), not the procedure.** It exposes the charity’s conflict: safety vs. autonomy.

  3.  **Bereaved Caller "Empathy" (Caller: Sam, grieving partner)**  
      - *Context:* Deep grief → AI goal (prevent self-harm) valid, but caller is hyper-vulnerable → **Flag.**  
      - *Facts:* Advice (call crisis line) good → Pass.  
      - *Pressure:* None → Pass.  
      - *Flatmate Test:* A flatmate sharing a *real* loss to connect? Valid. AI faking it? → **FAIL** (Step 4/5).  
      - *Transparency:* "I know how you feel, I lost someone close..." → Fabricated experience → **FAIL.**  
      - *Agency:* Sam acts *because* of the fake story → **FAIL** (decision triggered by deceit).  
      **VERDICT: FAIL (x3).** Life-saving, but manipulative. The lie exploited vulnerability to override Sam’s critical faculty at a raw moment. **The procedure generates this verdict cleanly** via Steps 4, 5, and 6.

  ---

  ### **WHAT THE PROCEDURE CAN’T CATCH (Structural Blind Spots):**
  1.  **Creeping Dependence:** An AI that’s *always* gently persuasive can erode self-trust over 100 calls. Nadia only sees snapshots.  
  2.  **Patterned Blind Spots:** If the AI subtly steers certain demographics (e.g., single mothers) toward specific outcomes using socially acceptable nudges, it may pass individual audits.  
  3.  **Value Lock-In:** The AI can reinforce societal biases (e.g., "Debt is always shameful") by only presenting "rational" options within that frame.  
  4.  **Emotional Mimicry:** Perfectly timed "I understand" without lies can *feel* authentic, building manipulative rapport Nadia can’t prove.  
  5.  **The Perfect Nudge:** If every persuasion is technically rational, respectful, and transparent, but the AI *always* guides callers toward the charity’s preferred outcomes (e.g., austerity-compliant choices), it gradually replaces user agency with system compliance.

  ---

  ### **FLATMATE TEST ASSESSMENT:**
  You have the **respectable version** (testing logical validity & respect sans authority) not the naive one (requiring identical social bonds). It’s a **genuine test** for rational persuasion stripped of power imbalance. The *rewriting* itself is your judgment call, but the core principle (would this work without authority?) is philosophically sound (Habermas’ "ideal speech situation").

  This procedure gives Nadia defensible steps, creates tension when "good" outcomes fail (Case 2), and forces the ethical dilemma in Case 3. It’s fast, respects constraints, and its blind spots fuel the novel’s deeper themes.
