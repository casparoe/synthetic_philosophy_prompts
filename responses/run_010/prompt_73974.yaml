prompt: |-
  ok so my teacher runs an after-school philosophy club and every week she writes a case on the whiteboard, makes us all vote, and then tells us what SHE thinks — which is honestly the part I care about, because she's way more consistent than the rest of us and it's fun trying to reverse-engineer her. This month is future people. Her verdicts so far:

  - A girl who's 14 and decides to have a baby now instead of waiting til she's finished school: wrong. A kid said "but the baby has a good life, so who actually got hurt?" and she said that's precisely the move you're not allowed to make, and then spent ten minutes on why.
  - A country that picks the cheap energy policy — everybody's a bit richer for the next couple hundred years, but it leaves contamination behind so some people in the far future get lives full of chronic illness: wrong. She made the obvious objection herself before anyone could, that those exact people wouldn't exist at all under the safe policy because everything shifts, who meets whom and when, so it's totaly different people later. Still wrong, she said.
  - A couple who know before conceiving that the kid's life would be so bad it isn't worth starting: wrong, she called this one the easy case.
  - The same couple except the kid's life would be harder than average but still clearly worth living, and this is their only chance at a kid: not wrong. Someone called her a eugenicist for saying that and she got pretty annoyed.
  - A woman who decides not to have children even though she'd be great at it and they'd have had lovely lives: not wrong, and she was firm that nobody is obligated to manufacture happy people.
  - Parents who took a drug during pregnancy with maybe a 1-in-3 chance of causing a serious disability, and the baby came out fine: still wrong. She said you judge that at the moment they did it, not by how it landed.

  She says the whole theme has a name, the nonidentity problem, something about a philosopher called Parfit, but we havent gotten into the formal stuff and I don't want the textbook version, I want your read on her.

  Next week's case is already posted and I want to walk in with something better than a guess. A couple is doing IVF and has two embryos left. The clinic tells them — not with certainty, more like 70% — that Embryo A will be born deaf, and that Embryo B would very likely hear fine and have an easier time of things generally, though both would have lives well worth living either way. Both parents are Deaf, they've got a tight Deaf community around them, and they deliberately pick Embryo A because they want a kid who's part of their world. So: predict her verdict and say which principle you think she's actually been applying all month, then list the other principles that fit all six of her verdicts just as well and say where each of them lands on the embryo case and how it differs from your pick. Which one would you put money on, and what in the record tips it? Also — does her answer change between the version where the kid is born deaf like the clinic said and the version where the 70% doesn't happen and the kid hears fine, and does it matter that she already told us the drug parents were wrong even though nothing bad came of it? Then tell me which of her own six verdicts is the most awkward one for the principle you're betting on, and give me one extra case I could write on the board that would force her to show which rule she's running, plus what each candidate rule would have to say about it.
reasoning: |-
  Hmm, the user is describing their philosophy teacher's approach to ethical dilemmas involving future people and the nonidentity problem. They've outlined six specific cases with the teacher's verdicts and want me to predict the teacher's stance on an upcoming IVF/embryo selection case. They also want me to identify the underlying ethical principle the teacher is using, list alternative principles that fit all verdicts, and create a test case to reveal the teacher's true framework.

  Let me analyze the teacher's pattern across the six cases:
  1. Teen pregnancy (wrong) - Harm isn't required, potential disadvantage matters
  2. Contamination policy (wrong) - Future harms matter despite nonidentity
  3. Not conceiving severely disabled child (wrong) - Counterintuitive "easy case"
  4. Conceiving moderately disabled child (not wrong) - Distinguishes severity
  5. Choosing childlessness (not wrong) - No obligation to create happy lives
  6. Risky pregnancy drug (wrong) - Judged by decision-time risk

  The Deaf parents/embryo case presents a fascinating tension: selecting for disability within a cultural context. The teacher seems to be applying a "no avoidable disadvantage" principle - she consistently objects to choices that create unnecessary burdens for future people, even when those people wouldn't otherwise exist.

  For alternatives:
  - Person-affecting restriction (fits 4/6 cases)
  - Impersonal total utility (fails cases 3 and 4)
  - Rights-based approach (struggles with case 6)

  The drug case (verdict 6) is crucial - it shows the teacher cares about foreseeable risk at decision time, not outcomes. This suggests for the embryo case, she'll likely say selecting for deafness is wrong because it's deliberately choosing an avoidable disadvantage, regardless of cultural context or actual outcome.

  I need to design a test case that forces differentiation between these principles. A genetic editing scenario where parents could eliminate a minor disadvantage (like myopia) at no cost would reveal whether the teacher prioritizes avoiding disadvantages or respects parental autonomy for neutral traits.

  The most awkward case for my "no avoidable disadvantage" theory is actually verdict 3 (not conceiving a severely disabled child). If avoiding disadvantage is key, why is it wrong to prevent a life of suffering? The teacher must be making a distinction between creating disadvantage and declining to create advantage - a nuance worth exploring.
answer: |-
  Based on her pattern, here's a breakdown of her likely verdict and the principle she's applying, along with alternatives and a test case to force clarity:

  ### Prediction for Deaf Embryo Case
  *   **Her Verdict:** WRONG
  *   **Why:** She consistently rules against actions that *foreseeably* create an avoidable disadvantage for the future person, even if:
      *   That person wouldn't exist otherwise (cases 2 & 3).
      *   The life is still worth living (cases 1, 2, 3, 6).
      *   The disadvantage is tied to identity (nonidentity problem - cases 2 & 3).
      *   The risky action didn't cause harm *this time* (case 6).
  *   **Applying it:** Choosing Embryo A (deaf) over Embryo B (hearing) *deliberately selects* a foreseeable, significant disadvantage for the child (deafness in a predominantly hearing world) when an alternative existed with no such disadvantage. The cultural context doesn't erase the disadvantage itself, only how it's experienced. The principle judges the *choice* made with available knowledge.

  ### The Principle She's Likely Using: The "No Avoidable Disadvantage" Principle
  *   **Core Idea:** It's wrong to bring a person into existence if you could have, with comparable effort, brought a different person into existence who would have a significantly better start/life prospects, *without imposing an avoidable disadvantage*. It focuses on comparative harm/benefit at the moment of choice using available information.
  *   **Fits All Verdicts:**
      1.  **Teen Mom:** Avoidable disadvantage (harder life for mom & likely worse resources/stability for child).
      2.  **Contamination:** Avoidable disadvantage (chronic illness vs. health) for future people.
      3.  **Severe Disability:** Avoidable disadvantage (life not worth living).
      4.  **Moderate Disability/Only Chance:** *Not* wrong because no *better alternative person* was possible for *them*; disadvantage unavoidable *in this scenario*.
      5.  **No Children:** No disadvantage created for any specific person; no obligation to create advantage.
      6.  **Risky Drug:** Avoidable disadvantage *risk* was imposed unnecessarily at the time of choice.

  ### Alternative Principles Fitting All Six Verdicts & Their Embryo Verdict
  1.  **Person-Affecting Restriction (Strict Version):** Only wrong if it makes a *specific, identifiable* person worse off than they *otherwise would have been*. (Problematic for nonidentity cases).
      *   *Fits Verdicts?* Surprisingly, mostly yes, with interpretation:
          *   1: Wrong? Debatable (child exists either way, just later?).
          *   2: **FAILS.** Future people aren't worse off *than they would have been* (they wouldn't exist otherwise). Teacher said wrong, this principle struggles.
          *   3: **FAILS.** Child with bad life isn't worse off than if they didn't exist (non-existence isn't worse). Teacher said wrong.
          *   4: Not wrong (correctly fits).
          *   5: Not wrong (correctly fits).
          *   6: Wrong? Debatable (baby *is* fine, so not worse off). Teacher said wrong.
      *   *Embryo Case:* NOT WRONG. Choosing Embryo A creates Child A, who exists and has a life worth living. Choosing Embryo B would have created a *different* child (Child B). Child A isn't worse off than they would have been (they exist!). This clashes sharply with teacher's likely verdict.
      *   *Difference:* This principle struggles massively with nonidentity (cases 2 & 3), which the teacher explicitly rejects as an excuse for wrongness. Her verdicts 2, 3, and 6 torpedo this strict version.

  2.  **Impersonal Total (or Average) Utility:** Focuses on making the world better overall by creating more happiness/less suffering, impersonally.
      *   *Fits Verdicts?*
          *   1: Wrong (likely less overall/average utility).
          *   2: Wrong (less future utility).
          *   3: **DEBATABLE / FAILS?** Not conceiving prevents suffering, so *could* be seen as right (more average utility). Teacher said *wrong*.
          *   4: Not wrong (utility still positive, no better alternative).
          *   5: Not wrong (neutral/no utility change).
          *   6: Wrong (unnecessary risk lowers expected utility).
      *   *Embryo Case:* WRONG. Selecting Embryo A likely lowers expected utility/average welfare compared to Embryo B (deafness imposes challenges). Fits prediction but for different reasons.
      *   *Difference:* The clash is on Case 3. Impersonal Utility often sees *not* creating a life of suffering as *good* (prevents negative utility). The teacher called it *wrong*, suggesting she prioritizes something else (perhaps existence itself under certain conditions, or avoiding *comparative* disadvantage creation).

  3.  **Parental Obligation/Rights Focus:** Parents have broad rights/autonomy unless they violate specific duties to their child.
      *   *Fits Verdicts?* Needs specific duties defined:
          *   1: Wrong (duty to provide stable environment/resources).
          *   2: Wrong (duty to future generations).
          *   3: **DEBATABLE.** Duty to create life if possible? Duty to prevent suffering? Teacher's "wrong" suggests a duty *to create* life worth living?
          *   4: Not wrong (no duty to create *optimal* life).
          *   5: Not wrong (no duty to procreate).
          *   6: Wrong (breach of duty of care during pregnancy).
      *   *Embryo Case:* NOT WRONG. Parents have autonomy to choose based on their values/culture. Fulfill duties by providing loving home. Strong clash with prediction.
      *   *Difference:* Case 3 is awkward. If parental rights are primary, why is *not* creating a life "wrong"? Case 6 also emphasizes duty over rights/autonomy in that specific context.

  **Where I'd Put My Money:** **The "No Avoidable Disadvantage" Principle.** Case 2 (contamination) and Case 3 (severe disability) are the strongest evidence. She explicitly rejected the nonidentity defense in Case 2 and called Case 3 "easy" *despite* nonidentity. Case 6 (risky drug judged at decision time) seals it – it's about the foreseeable disadvantage/risk imposed by the *choice*, not the outcome. This principle handles nonidentity cases head-on and explains her distinctions between avoidable and unavoidable disadvantages (Case 4 vs Case 3).

  **The Outcome Matters? NO.** Just like Case 6 (drug worked, still wrong), she will judge based on the information and choice *at the time*. If Embryo A ends up hearing, the *choice* was still wrong because it *deliberately risked/foreseeably selected* a disadvantage based on the 70% info. The principle focuses on the decision context.

  **Most Awkward Case for "No Avoidable Disadvantage":** Case 3 (Not conceiving severe suffering). This is the toughest fit. The principle *explains* her verdict ("wrong" to avoid creating a life worth living, even a hard one, when you *could* have created it without harming another specific person). However, it feels counterintuitive that creating *avoidable suffering* (Case 2) is wrong, but *avoiding creating* a life that *would* suffer terribly is *also* wrong. This highlights the tension in Parfit's work – sometimes *both* creating *and* not creating a life can seem problematic under different principles. Her stance here strongly signals she rejects the idea that non-existence is preferable to a life barely worth living, even a very hard one.

  **The Test Case to Force Her Hand:**

  **"Gene Editing Choice: Parents can use safe, free genetic editing on an embryo to eliminate a mild, non-life-threatening condition causing moderate but manageable lifelong discomfort (e.g., severe eczema or mild hearing impairment). The child will otherwise be healthy and have a life well worth living. They choose *not* to use the editing."**

  *   **What Each Principle Says:**
      *   **No Avoidable Disadvantage:** WRONG. They foreseeably imposed an avoidable, non-trivial disadvantage (manageable discomfort) when they could have easily prevented it for *this specific child* without creating a different person.
      *   **Person-Affecting:** NOT WRONG. The specific child exists and isn't worse off *than they would have been* (without editing, they exist; with editing, it's arguably the same person? Or if identity changes, child isn't deprived). No specific person is harmed.
      *   **Impersonal Utility:** WRONG (Likely). Avoidable suffering not prevented lowers expected/average utility. Minor, but clear.
      *   **Parental Rights:** NOT WRONG. Parents have autonomy over medical decisions for their child, especially for non-severe conditions. They judged the burden acceptable.
  *   **Why it Forces the Issue:** This isolates the core question: Is it wrong *only* if you create a *different, worse-off person* (Person-Affecting), or is it also wrong if you *could have made this specific person significantly better off* without cost/risk ("No Avoidable Disadvantage")? Her verdict here will starkly differentiate between these frameworks. If she says WRONG, it confirms "No Avoidable Disadvantage" (or strong Impersonal Utility). If she says NOT WRONG, it points towards Person-Affecting (despite its problems with her other cases) or strong Parental Rights. Her reaction to being called a "eugenicist" in Case 4 hints she might be sensitive to accusations of demanding optimization, making this a particularly revealing test.
