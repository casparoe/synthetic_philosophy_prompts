prompt: |-
  You are an expert in classical Indian epistemology — in particular the pramāṇa debates between Nyāya and the Buddhist epistemologists of Dignāga's and Dharmakīrti's line — and you are also experienced in running adversarial collaborations between entrenched opponents. Draft the joint statement that a committed Naiyāyika, who accepts four knowledge sources (perception, *pratyakṣa*; inference, *anumāna*; comparison, *upamāna*; testimony, *śabda*), and a committed Buddhist epistemologist, who accepts only perception and inference, could both put their names to after a serious good-faith attempt.

  Before drafting, spend a short paragraph thinking aloud about what each side can genuinely concede without betraying its own commitments, and about which of their disputes is substantive and which is about how to count. Then produce:

  1. **Agreed claims**, numbered. Candidate starting points, but keep only those both can actually sign: that knowledge is individuated by its source or pedigree rather than by internal features of the belief; that memory is not itself a source, since its standing depends on the original cognition; that veridical cognition is the default and error the deviation requiring explanation; that a candidate source earns its place by yielding cognitions that support unhesitating, successful action; that inference requires a pervasion established by co-presence and co-absence (smoke and fire, in the kitchen and on the hill).

  2. **The residual disagreements**, each phrased so its own side would accept the wording of its own view. I want two captured exactly: whether pramāṇas are individuated by their objects (the uniquely particular versus the general characteristic, hence exactly two) or by their distinctive causal routes to a cognition; and whether the case of learning a name from an informant — a forester tells me the cow-like animal is called a *gavaya*, and months later, on seeing one, I know this is what I was told about — is a distinct kind of knowledge-event or a blend of perception, recollection, and inference from similarity. Handle testimony the same way: is sentence meaning grasped as a whole rather than assembled from words, and does a reliable speaker generate knowledge or merely supply premises for an inference?

  3. **Cruxes**: the sub-questions where settling the matter would actually move at least one side, with, for each, the case or argument both accept as bearing on it and each side's verdict recorded in advance. Address the asymmetry that the Naiyāyika cheerfully reduces postulation (*arthāpatti*) to inference while refusing to reduce comparison or testimony — make explicit what principle is supposed to license one reduction and forbid the others.

  4. **A short closing section**: which part of the dispute is merely about counting, and what would count as evidence against each side's own view.

  Gloss every Sanskrit term in English at its first use. Argue, don't cite: no bibliography, no quotations, no invented attributions to named texts. Roughly 1200 words.
reasoning: |-
  Okay, I need to craft a joint statement for a Naiyāyika and a Buddhist epistemologist after an adversarial collaboration. First, I'll think about what each side can concede without betraying their core commitments. 

  The Naiyāyika accepts four pramāṇas (knowledge sources): perception (pratyakṣa), inference (anumāna), comparison (upamāna), and testimony (śabda). The Buddhist only accepts perception and inference. Both agree that knowledge must lead to successful action and that memory isn't an independent source. 

  For genuine concessions: The Buddhist could agree that upamāna and śabda produce knowledge but argue they're reducible to perception and inference. The Naiyāyika might concede that all knowledge events involve perception or inference at some level but insist these are distinct causal processes. The core dispute is ontological - whether reality is ultimately unique particulars (Buddhist) or includes universals (Nyāya). This affects how they count pramāṇas.

  Now structuring the response:
  1. **Agreed Claims**: List shared principles like knowledge individuation by source, non-independent status of memory, veridicality as default, and inference requiring pervasion (vyāpti). Must exclude anything controversial like intrinsic validity of cognitions.

  2. **Residual Disagreements**: 
     - Pramāṇa individuation: Objects-based (Buddhist) vs causal-process-based (Nyāya)
     - Gavaya case: Perception-memory-inference blend (Buddhist) vs distinct upamāna event (Nyāya)
     - Testimony: Holistic meaning (Nyāya) vs inferential reconstruction (Buddhist)

  3. **Cruxes**: 
     - Reduction principle: What makes arthāpatti reducible but not upamāna? Nyāya would say lack of distinct causal profile; Buddhist would demand reduction proof for all.
     - Key test case: Gavaya cognition - can it occur without similarity-based reasoning?
     - Testimony trigger: Does understanding require speaker reliability inference?

  4. **Closing**: Disagreeing on what counts as a fundamental kind. Evidence against would be demonstrating irreducible causal processes for upamāna or showing testimony always requires conscious inference.

  For the draft, I'll use clear language, gloss Sanskrit terms on first use (perception for pratyakṣa, etc.), and maintain neutral phrasing of disagreements. The tone should be collegial but precise, around 1200 words. Need to avoid citations and focus on arguments.
answer: |-
  ### Pre-Draft Reflection
  The Naiyāyika can concede that *upamāna* (comparison) and *śabda* (testimony) *depend* on perception and inference for their operation, without granting they reduce to them. The Buddhist can accept these yield knowledge but insist they are inferential/perceptual composites. The substantive dispute is ontological: whether reality is exhaustively divided into unique particulars (*svalakṣaṇa*, Buddhist view) or includes repeatable universals (*sāmānya*, Nyāya view), which drives pramāṇa-counting. The verbal dispute is whether "distinct causal process" implies ontological distinctness (Nyāya) or merely contextual complexity (Buddhist). Both agree knowledge sources must be irreducible causal routes, but disagree on what "irreducible" means.

  ---

  ### Joint Statement: Nyāya-Buddhist Epistemology Collaboration  

  We, a committed Naiyāyika and a committed Buddhist epistemologist, after rigorous dialogue, affirm the following agreements, disagreements, and cruxes. While our meta-commitments diverge, we concur on core principles of knowledge acquisition.  

  #### 1. Agreed Claims  
  1. **Knowledge sources individuate cognition**: A cognition’s status as knowledge (*pramā*) is determined by its causal pedigree (*pramāṇa*), not subjective features like clarity or conviction.  
  2. **Memory is derivative**: Recollection (*smṛti*) is not an independent knowledge source; its validity depends entirely on the original veridical cognition.  
  3. **Veridicality is default**: Non-deviant cognition is intrinsically valid (*svataḥ prāmāṇya*); error (*viparyaya*) requires specific causes (e.g., defects in sense organs or reasoning).  
  4. **Success in action validates**: A candidate *pramāṇa* must yield cognitions that reliably support unhesitating, successful action (*pravṛtti-sāmārthya*).  
  5. **Inference requires pervasion**: Inference (*anumāna*) depends on establishing a universal concomitance (*vyāpti*) between evidence (e.g., smoke) and target (e.g., fire), confirmed by co-presence (in the kitchen) and co-absence (where there’s no fire, there’s no smoke).  

  #### 2. Residual Disagreements  
  We disagree irreducibly on two points:  

  - **Individuation of pramāṇas**:  
    - *Nyāya view*: Pramāṇas are distinct causal processes generating knowledge of distinct objects. Perception grasps particulars; inference grasps universals; comparison grasps name-object relations; testimony grasps sentence-meaning holistically.  
    - *Buddhist view*: Pramāṇas are two, as they correspond to two exclusive kinds of objects: perception (*pratyakṣa*) apprehends unique particulars (*svalakṣaṇa*), while inference (*anumāna*) apprehends general properties (*sāmānya-lakṣaṇa*). Causal complexity does not imply new *pramāṇas*.  

  - **The *gavaya* case and testimony**:  
    - *Nyāya view*: Learning a new term (e.g., a forester naming a cow-like animal *gavaya*) and later recognizing it involves *upamāna* (comparison). This is distinct: on seeing the animal, similarity to a cow triggers recall of the name via a unique cognitive event fusing perception, memory, and similarity. Testimony (*śabda*) is irreducible: understanding a sentence is holistic, not assembled from words, and a reliable speaker’s utterance directly generates knowledge.  
    - *Buddhist view*: The *gavaya* case blends perception (of the animal), memory (of the word "gavaya"), and inference (based on cow-similarity). No distinct *upamāna* exists. Testimony is inferential: words are processed sequentially, and the hearer *infers* the speaker’s intention via perceptual cues (e.g., tone, context). Reliability is a premise for inference, not a direct cause.  

  #### 3. Cruxes  
  Settling these sub-questions would force substantive revision:  

  - **Reduction Asymmetry**: Nyāya reduces postulation (*arthāpatti*, e.g., inferring "Devadatta is outdoors" from "he is not home") to inference but not *upamāna* or *śabda*.  
    - *Principle at stake*: A *pramāṇa* must have a unique causal profile generating *sui generis* knowledge.  
    - *Nyāya verdict*: *Arthāpatti* lacks uniqueness (it uses negation, already part of inference). *Upamāna*’s profile—similarity-triggered name recall—is irreducible.  
    - *Buddhist verdict*: All alleged cases of *upamāna* or *śabda* decompose into perception/inference without loss. If *arthāpatti* reduces, so must others.  
    - *Shared test case*: Can the *gavaya* cognition occur *without* explicit similarity-based reasoning? If yes, Nyāya is strengthened; if no, Buddhist prevails.  

  - **Testimony Trigger**: Does understanding a sentence require conscious inference of speaker reliability?  
    - *Buddhist view*: Yes. Hearing "fire!" near a kitchen, one infers the speaker’s reliability from context (e.g., smoke, urgency). Remove inferential cues, and testimony fails.  
    - *Nyāya view*: No. A child learns "cow" from a trusted elder without inference; reliability is pre-linguistically embedded. If comprehension persists sans conscious inference, Buddhist must concede.  
    - *Shared experiment*: Test comprehension in contexts lacking inferential support (e.g., abstract terms with no perceptual referents). If understanding still occurs, Nyāya is validated.  

  #### 4. Closing: Dispute Demarcation  
  The disagreement over counting *pramāṇas* (two vs. four) is primarily verbal, rooted in divergent ontologies. For Nyāya, reality includes universals and relations; for Buddhists, only particulars exist. Thus, "fundamental kind" is theory-laden.  
  - **Evidence against Nyāya**: Demonstrating that *every* instance of *upamāna* or *śabda* decomposes into perception/inference *without explanatory loss*.  
  - **Evidence against Buddhism**: Isolating a cognition (e.g., the *gavaya* identification) that *cannot* arise without a similarity-triggered process irreducible to standard inference.  

  We remain divided but agree that successful action—not mere taxonomy—is knowledge’s ultimate arbiter.  

