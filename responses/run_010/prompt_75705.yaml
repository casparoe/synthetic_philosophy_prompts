answer: |-
  **MEMORANDUM TO THE CONSTITUTIONAL COURT PANEL**  
  **IN THE MATTER OF THE PUBLIC ORDER AND ASSEMBLY ACT REFERRAL**  
  **2 October 2023**  

  ---

  ### I. RECOMMENDED DISPOSITION  
  1.  **Prematurity Objection:** **Reject.** The referral is properly before the Court under Article 151.  
  2.  **Section 4 (Designated Zone):** **Compatible** with Article 22, subject to valid operation of the licensing scheme.  
  3.  **Section 7 (Licensing Requirements):** **Incompatible** with Article 22. Remedy: **Declaration of incompatibility** under Article 150(2), suspended for **9 months** to permit Parliament to amend the provision to incorporate objective criteria for refusal/caps and a shorter, context-sensitive notice period (minimum not exceeding 14 days absent exceptional justification).  
  4.  **Section 7(5) (Ouster Clause & Internal Tribunal):** **Incompatible** with Articles 12 and 96. Remedy: **Immediate annulment.**  
  5.  **Section 12 (Evidentiary Bar):** **Incompatible** with Articles 12 and 96. Remedy: **Immediate annulment.**  
  6.  **Article 148(3) Override:** The Act is **not** a valid exercise of Parliament’s override power under Article 148(3) as it lacks the required express declaration.  

  ---

  ### II. JURISDICTION OVER PROCEDURAL BARS: THE OUSTER (S.7(5)) AND EVIDENTIARY BAR (S.12)  
  The objection that Articles 12 and 96 cannot be used to invalidate legislative allocations of judicial power misapprehends the Constitution’s structure and purpose.  

  1.  **The Constitutional Safeguard of Judicial Power:**  
      Article 12 vests judicial power *exclusively* in the courts and prohibits the creation of judicial bodies outside this structure. Section 7(5) violates this core principle by establishing a tribunal whose members serve at the Minister’s discretion, housed within the executive branch, to perform a quintessentially judicial function: reviewing administrative decisions affecting fundamental rights. This tribunal cannot be "independent of the executive" as Article 96 requires. The Constitution does not permit Parliament to circumvent the judicial power by labelling an executive body a "tribunal."  

  2.  **The Right to an Independent Court (Article 96):**  
      Article 96 guarantees everyone the right to have determinations of their civil rights and obligations made by an independent court. A license to assemble is a determination affecting a civil right (the Article 22 assembly right). Section 7(5) explicitly ousts the jurisdiction of *any court* over these determinations, replacing them with review by an executive tribunal. This is a direct violation of Article 96. The ouster clause is not merely an allocation rule; it is an abolition of judicial oversight for this right.  

  3.  **The Evidentiary Bar (S.12) as a Corollary Violation:**  
      Section 12 compounds the violation by making evidence relating to the anticipated conduct of an assembly inadmissible *unless the Administrator consents*. This renders any theoretical review (even by the flawed internal tribunal) potentially impossible, as the party challenging the Administrator’s decision cannot adduce evidence to contradict his "reasonable apprehension." It undermines the very possibility of a fair determination, whether by a court or even the internal tribunal itself, thereby infringing the principles of fairness inherent in Articles 12 and 96. It entrenches executive unreviewability.  

  The Court’s duty under the Constitution is to ensure that *any* body determining rights possesses the requisite independence and that access to the judicial power for such determinations is preserved. Sections 7(5) and 12 directly attack these constitutional essentials and fall squarely within the Court’s review power.  

  ---

  ### III. DEFERENCE VS. SCRUTINY: THE PREDICTIVE JUDGMENT UNDER SECTION 7  
  The Minister argues that the 30-day notice period and unlimited discretion to impose attendance caps rest on predictive judgments about crowd behaviour, demanding judicial deference under the 2017 broadcasting expenditure precedent. This argument fails in its application to Section 7.  

  1.  **Distinguishing *2017 Broadcasting Case*:**  
      The 2017 case involved a *general legislative rule* (a spending cap) based on a prediction (unlimited spending would distort elections) where Parliament considered diverse views and evidence during open debate. Deference was warranted because the prediction was one on which reasonable legislators could differ *and* the process allowed for scrutiny.  

  2.  **The Fatal Flaws: Untestability and Lack of Scrutiny:**  
      *   **Untestable Basis:** The Minister relies solely on an *unpublished* expert panel report, refusing its release or questioning of its authors. Parliament was denied the opportunity to scrutinize the core evidence justifying the specific 30-day period and the necessity of unguided caps. The opposition was silenced by closure of debate after eleven hours.  
      *   **Unconstrained Discretion:** Section 7 grants the Administrator boundless discretion ("whatever figure he judges," "reasonably apprehends") without statutory criteria. Unlike a fixed spending cap, this discretion operates on a case-by-case basis, directly impacting the core right to assemble. Predictions justifying *broad discretionary power* require *more*, not less, scrutiny than those justifying fixed rules.  

  3.  **Alignment with *2021 Curfew Case* and the Need for Reconciliation:**  
      The *2021 Curfew Case* is controlling. It held that "an official assurance is not evidence" and that "deference to an assertion the Court is forbidden to test is not deference but abdication." The Minister's reliance on an untestable, unpublished report is precisely such an assertion. The government refused to produce the data underlying its risk assessment for the specific measures enacted.  

  4.  **Reconciling the Precedents:**  
      The precedents are reconcilable:  
      *   **Deference (2017 Principle):** Applies where Parliament makes a predictive judgment *after genuine consideration of accessible evidence/materials* during a *transparent legislative process*, resulting in a *rule of general application* with defined limits.  
      *   **Scrutiny/Abdication (2021 Principle):** Applies where the executive/legislature relies on *untestable, secret evidence* to justify measures *granting broad executive discretion* impacting fundamental rights, especially where *parliamentary scrutiny was curtailed*.  
      Section 7 fails the *2017* conditions and squarely meets the *2021* conditions. The *2021* principle governs here. **Neither precedent needs overruling**; they address distinct factual and procedural contexts.  

  **Conclusion on Section 7:** The lack of objective criteria for refusal/caps and the mandatory 30-day period (untethered to operational needs for specific assemblies) are not "necessary in a democratic society" under Article 22 because they lack a sufficiently transparent, scrutinized, and evidence-based justification accessible to Parliament and the Court. The measures are disproportionate. Annulment is warranted, but suspension permits Parliament to redesign the scheme with necessary safeguards.  

  ---

  ### IV. THE ARTICLE 148(3) OVERRIDE THREAT AND PRUDENCE  
  The argument that striking down section 7(5) is imprudent due to the risk of re-enactment under Article 148(3) is legally and constitutionally unsound.  

  1.  **Article 148(3) Would Not Shelter Section 7(5):**  
      *   **Express Declaration Requirement:** Article 148(3) permits override *only* if the statute contains "an express declaration... that the statute or a specified provision shall operate for five years notwithstanding Article 22." The Public Order and Assembly Act contains **no such declaration**.  
      *   **Limited Scope of Override:** Article 148(3) explicitly operates only "notwithstanding **Article 22**." It does not mention Articles 12 or 96. Our finding of incompatibility for Section 7(5) rests **primarily and foundationally** on violations of **Articles 12 and 96** (the judicial power and independent tribunal guarantees). An Article 148(3) declaration, even if present, **could not shield a provision from annulment for violating other constitutional provisions** like Articles 12 and 96. Section 7(5) is unconstitutional *irrespective* of its impact on Article 22 assembly rights.  

  2.  **Implications for the Prudence Argument:**  
      The threat of a future override protecting a *re-enacted* ouster clause is speculative. More fundamentally, **prudence cannot dictate the abandonment of constitutional duty**. Article 148(3) is an extraordinary power with strict conditions. The Court’s role is to apply the Constitution as written. If Parliament later attempts to use Article 148(3) to shield a provision violating Articles 12 or 96, *that* would present a new constitutional question. The *current* absence of an override declaration renders the prudence argument irrelevant to the disposition of *this* referral. Our recommendation for immediate annulment of section 7(5) stands.  

  ---

  ### V. THE STRONGEST CASE AGAINST THIS RECOMMENDATION  
  **The Persuasive Counter-Argument:**  
  "While the flaws in process and the ouster clause are concerning, the Court errs by micromanaging the legislative response to a genuine emergency. The designated zone encompasses critical infrastructure recently scarred by lethal riots. Parliament, representing the democratic will, has determined that pre-emptive control via licensing, including advance notice for complex logistics and safety planning, and expert-led attendance caps based on real-time resource assessments, is essential to prevent further bloodshed and chaos. The 30-day period and caps, while restrictive, reflect the harsh reality of mobilizing adequate security for volatile large gatherings in high-risk areas, a reality confirmed by expert analysis (even if its details remain confidential for operational security). Striking down these core operational tools now, based on abstract review without a concrete denial of rights, paralyzes the state’s ability to protect public order at a vulnerable moment. Deference to Parliament’s predictive judgment on security needs, as in 2017, is paramount. Severing the ouster clause (s.7(5)) and evidentiary bar (s.12) while permitting the substantive licensing scheme under Section 7 to operate, subject to eventual judicial review of *specific* license denials under normal administrative law principles, represents a constitutionally sufficient and prudential balance. Immediate annulment of S.7/S.12 or suspension forcing legislative amendment is an overreach that substitutes judicial policy preference for legislative necessity and invites disorder."  

  **What Would Have to Be True For This To Prevail:**  
  This compelling counter-argument would prevail only if:  
  1.  The Court accepted that the *necessity* of the *specific* 30-day period and the *complete lack of statutory criteria* for caps/refusals were demonstrably justified *despite* the lack of scrutinizable evidence before Parliament or the Court, based solely on the Minister's assertions and the context of recent riots.  
  2.  The Court concluded that the violations of Articles 12 and 96 inherent in Sections 7(5) and 12 could be adequately remedied *after the fact* through judicial review of individual license decisions, ignoring that the ouster and evidentiary bar actively prevent such review and that the underlying substantive discretion remains constitutionally problematic.  
  3.  The Court prioritized the *potential* for future administrative law review over the *current* structural violation of the separation of powers and the right to an independent court, effectively endorsing a system where fundamental rights determinations are initially made by an executive tribunal operating in an evidence-free zone.  
  4.  The Court found that the absence of any actual license denial rendered the *substantive* flaws in Section 7 too abstract to address, disregarding that the *scheme itself*, with its untrammelled discretion and mandatory delays, creates an immediate chilling effect on the exercise of the Article 22 right.  

  ---

  ### VI. ISSUES TO DECLINE  
  The Court should decline to rule on:  

  1.  **The precise minimum notice period constitutionally required in all circumstances.** While the 30-day period is excessive and inflexible, mandating a specific minimum (e.g., 48 hours, 7 days) is unnecessary. The declaration of incompatibility requires Parliament to set a context-sensitive period, likely significantly shorter than 30 days, potentially allowing for shorter notice for smaller/spontaneous gatherings or longer notice only where demonstrably justified by scale/complexity. Defining the exact constitutional floor is best left for a concrete case.  
  2.  **The exhaustive list of objective criteria Parliament must adopt for refusals and caps.** The declaration requires Parliament to provide such criteria to constrain discretion. The precise content of those criteria (beyond needing a rational connection to legitimate aims like public safety and proportionality) is a legislative choice the Court need not prescribe in abstracto.  
  3.  **Whether the specific boundaries of the designated zone (S.4) are overbroad.** The zone encompasses core government and transportation infrastructure adjacent to public squares. On its face, and absent evidence of its operation, this designation is rationally connected to protecting key sites vulnerable to disruption. Specific challenges to its application can be raised in future cases.  

  **Why Restraint Serves the Judgment:**  
  Addressing these granular details would exceed the necessary scope of abstract review, trespassing into legislative policy-making. Focusing on the core constitutional defects (unconstrained discretion, untestable justification, ouster of judicial review, evidentiary bar) provides clear guidance to Parliament for amendment while respecting its role in crafting the precise operational details of a constitutionally compliant scheme. It avoids issuing advisory opinions on hypothetical applications and preserves the Court’s role for concrete controversies should the amended scheme prove deficient. This restraint enhances the legitimacy and focus of the judgment.  

  ---  
  **Respectfully submitted,**  
  **[Your Name/Senior Clerk]**
