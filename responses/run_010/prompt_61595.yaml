prompt: |-
  I spent thirty-eight years as a field physiologist and have taken up philosophy seriously only since retiring; my current preoccupation is the question of which animals are conscious. I attended a public symposium last autumn on the welfare status of cephalopods and decapod crustaceans. An audience member observed that the behavioural tests we apply to these animals — trade-offs against competing motivations, conditioned place avoidance, responsiveness to analgesics — have produced results that different laboratories read in opposite directions, and that no criterion commands general assent. One panellist replied that "absence of evidence is not evidence of absence," and the room plainly took that to close the matter in favour of a presumption of sentience. I confess that in an earlier career I deployed the same line myself, against colleagues who inferred from an unsuccessful survey that a population was not present at a site. So I am not asking you to tell me the slogan is worthless; I want to know exactly what it can and cannot bear.

  Please separate the distinct precise claims that one sentence might be expressing, and arrange them as a menu running from the near-trivial through the substantive to the flatly false. For each reading, state what it asserts, what would have to hold for it to be true, and whether it supports the use the panellist put it to. Three points especially need disentangling, and I would like each addressed explicitly. First, the difference between the situation in which no adequate investigation has been undertaken and the situation in which a well-designed investigation returned a null result: does the slogan apply equally to both, or only to one? Second, whether the slogan, even on its strongest true reading, can license anything beyond suspension of judgment — in particular whether it can generate a positive presumption that these animals are sentient, rather than merely blocking the inference that they are not. Third, whether it can carry the burden-shifting claim that was made alongside it, that the onus falls on those who deny sentience.

  I am also curious whether the slogan has a purely practical rather than evidential employment — a reason to act protectively under uncertainty that does not depend on how probable the hypothesis is — and whether the panellist was in fact relying on that while appearing to rely on evidence.

  Begin with one sentence giving your bottom line: which reading was doing the work, and whether it survives scrutiny. Then give the numbered menu of readings with a verdict on each, followed by your answer on the three points above. No preamble, and do not restate my question.
reasoning: |-
  Hmm, the user is a retired physiologist with 38 years of field experience who's now deeply engaged in philosophy, particularly animal consciousness. They attended a symposium on cephalopod and decapod welfare where the "absence of evidence isn't evidence of absence" slogan was used to dismiss concerns about conflicting behavioral test results. They've used this line themselves in ecology contexts but now want to dissect it rigorously.

  Three key aspects need unpacking: First, how the slogan applies to untested scenarios versus well-designed null-result studies. Second, whether it justifies positive presumption of sentience rather than mere suspension of judgment. Third, if it truly shifts burden of proof to skeptics. They're also curious about non-evidential precautionary uses.

  The slogan has multiple interpretations ranging from trivial to false. At its weakest, it's a basic statistical reminder that failure to detect doesn't prove non-existence. At its strongest but false extreme, it might imply null results actively support existence. The middle ground - where it holds most weight - concerns underpowered studies or unexamined cases, but even then it only blocks premature negative conclusions, never proves positives.

  For burden-shifting, the slogan alone can't do it; that requires independent ethical arguments. The precautionary principle might be what the panelist actually invoked, disguising practical urgency as evidentiary support. 

  In their specific case: The conflicting lab results suggest inadequate tests, placing this between weak and substantive readings. The slogan rightly cautions against declaring non-sentience but can't justify presuming sentience exists. Burden-shifting fails without ethical premises, and the "presumption" likely smuggled in precautionary thinking.
answer: |-
  **Bottom line:** The panellist's effective reading was a substantive but contextually weak one (Reading 4), mistakenly conflated with a false interpretation (Reading 5) to generate a positive presumption; it survives only for blocking premature negative conclusions, not for supporting burden-shifting or positive presumption.

  **Menu of Readings:**

  1.  **Reading (Trivial/Logical):** The logical impossibility of inferring universal non-existence from a finite number of failed searches.
      *   **Asserts:** Failing to observe X in specific instances (e.g., specific tests, specific locations) doesn't *logically entail* that X doesn't exist *anywhere* or *at all*.
      *   **Requires for Truth:** The logical structure of existential quantification (∃x) vs. universal negation (¬∃x). A finite negative sample cannot prove a universal negative.
      *   **Supports Panellist?** No. It only blocks the logically invalid inference "Test didn't find sentience ∴ Sentience is absent." It says nothing about the *likelihood* of sentience or the *evidential weight* of the null result itself. The audience's conflicting interpretations stem from evidential weight, not logical possibility. Your ecological use targeted this fallacy.

  2.  **Reading (Methodological - Untested):** When a specific phenomenon (X) has not been investigated *at all* with appropriate methods, the lack of data provides zero evidence for or against X.
      *   **Asserts:** Complete absence of investigation yields no evidence regarding X's existence or non-existence.
      *   **Requires for Truth:** Genuine lack of relevant data collection. Ignorance is symmetric.
      *   **Supports Panellist?** Partially. For tests *never* applied to a specific species, this holds. However, the symposium context involved *conflicting results from tests that were applied*, not total non-investigation. This reading doesn't address the actual data.

  3.  **Reading (Methodological - Inadequate Test):** When an investigation for X is conducted but the test used is known to be weak (low power, poor sensitivity, wrong paradigm), a negative result provides little or no evidence for the absence of X.
      *   **Asserts:** A null result from an unreliable or insensitive test is uninformative about X's absence; it primarily indicates the test's inadequacy.
      *   **Requires for Truth:** The test demonstrably lacks the power/sensitivity to reliably detect X if it were present.
      *   **Supports Panellist?** Yes, substantively. This directly addresses the core problem: if the behavioural tests for sentience are fundamentally inadequate or poorly applied (leading to conflicting results), their null results are weak evidence for non-sentience. It blocks the inference of absence based on poor evidence.

  4.  **Reading (Evidential - Underpowered Study):** When a reasonably well-designed investigation for X returns a negative result, but the study had low statistical power (high risk of Type II error), this absence of *statistically significant* evidence *for* X is not, by itself, strong evidence *against* X.
      *   **Asserts:** A null result from a study unlikely to detect X even if present provides weak evidence for X's absence.
      *   **Requires for Truth:** A study design with known low power (e.g., small sample size, high variability, subtle effect).
      *   **Supports Panellist?** Yes, significantly. This is the strongest *true* substantive reading. If the sentience tests applied are well-designed *in principle* but consistently underpowered for the complex phenomenon under study (or applied inconsistently, causing conflicts), their null results are weak evidence for non-sentience. It justifies skepticism towards claims of absence based solely on such results.

  5.  **Reading (False - Evidence for Presence):** The absence of evidence *for* X is positive evidence *for* X, or at least significantly increases the probability that X exists.
      *   **Asserts:** Failure to find X somehow makes X's existence *more* likely.
      *   **Requires for Truth:** This is generally false. Absence of evidence, even from a good test, typically (barring very specific Bayesian scenarios not applicable here) *lowers* the probability of X compared to prior belief, or at best leaves it unchanged if the test was useless. It never *increases* it.
      *   **Supports Panellist?** Illegitimately. This false reading *would* support generating a positive presumption ("room took that to close the matter in favour of a presumption"). However, it is logically and evidentially invalid. Confusing "not evidence of absence" with "evidence for presence" is a critical error.

  **Addressing Your Three Points:**

  1.  **Untested vs. Null Result:** The slogan applies *differently*.
      *   **Untested (Reading 2):** Trivially true - no evidence exists. Symmetric ignorance.
      *   **Well-Designed Null Result (Beyond Reading 4):** If the investigation was truly well-designed, adequately powered, and used valid methods, a negative result *is* substantive evidence *against* X (absent other mitigating factors). The slogan (Reading 4) *only* holds if the "well-designed" investigation had low power *for the specific question*, or if the null result is misinterpreted as *proof* of absence (Reading 1). A genuinely powerful null result *is* evidence of absence, weakening the hypothesis. The slogan cannot dismiss such evidence.

  2.  **Licensing Presumption vs. Suspension:** The slogan, even on its strongest *true* reading (Reading 4), **only licenses suspension of judgment regarding absence and skepticism towards claims of non-existence based on poor/underpowered evidence. It cannot generate a positive presumption of sentience.** It argues *against* concluding "not sentient" based on the available tests, not *for* concluding "sentient". Generating a positive presumption requires positive evidence or an independent philosophical/ethical argument (like burden-shifting or precaution). The panellist and audience illicitly used the slogan (likely invoking the false Reading 5) to jump to a positive presumption.

  3.  **Burden-Shifting:** The slogan **cannot, by itself, carry the burden-shifting claim.** Asserting that "absence of evidence is not evidence of absence" merely critiques the *evidential basis* for a claim of absence; it says nothing about who bears the burden of proof. Shifting the burden (e.g., onto deniers of sentience) requires an *additional, independent justification*, typically ethical or practical (e.g., precautionary principle, moral status of potential sentience, consequences of error). The slogan is evidentiary, not ethical.

  **Practical (Precautionary) Employment:** Yes, the slogan is often used rhetorically to invoke the **Precautionary Principle** in practice, *especially* in welfare/ethics contexts. This argues: "Since we lack conclusive evidence of *absence* of sentience (slogan), and the potential harm (suffering) if sentience *is* present is great, we should act protectively *as if* they are sentient." This is a *practical, risk-averse policy argument*, distinct from an *evidential claim* about the probability of sentience. The panellist was likely *relying* on this practical implication while *appearing* to rely solely on evidential reasoning using the slogan. The "presumption" adopted by the room is more readily explained by unstated precautionary ethics than by the evidential slogan alone.
