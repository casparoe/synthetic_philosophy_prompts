prompt: |-
  ok so I had a two hour arguement with a friend last night — we started on the Exodus and somehow ended up on Troy and King Arthur — and there's one specific move he kept making that I couldn't name at the time, and its still bugging me.

  The move: you point out that some part of a story is impossible. The sea splitting, the plagues, gods picking sides, a wizard. And instead of the story losing credibility it somehow gains some. The reply is basically "fine, throw the miracle out, but what's left is a perfectly plausible memory of a group of slaves walking out of Egypt, and that's the historical core." Same with Troy: once the golden apple and the goddesses are discarded, what remains — a bronze age fight over a real hilltop town — gets treated as *more* likely than it looked when the story was still full of gods. And Arthur: remove the sword and the lake and you're supposedly closer to some actual post-Roman warlord.

  What bothers me is the direction of the update. Everywhere else I can think of, a source you catch inventing one detail gets *less* belief for the rest of what it says. A witness in court, a friend describing their weekend, a news piece where one quote turns out to be made up — the caught fabrication stains the remainder. But here the fabrication is being spent, like currency, to buy credibility for the leftover bits. It's as if the impossible elements were a shield, and by knocking the shield away you've done the story a favour.

  He said that's just how you read ancient narratives and that I was being naive about it, and I didn't have the vocabulary to push back. So:

  - is there an actual established name for this? specifically the move where you subtract the incredible parts and then treat the residue as *supported* rather than merely *not refuted yet*. not looking for a bibliography or a list of stuff to go read, just whether the concept exists somewhere with a label.
  - what's the nearest named thing to it? I have a vague sense there are whole traditions about turning myths into accounts of real people, and about stripping the supernatural framing off old texts, and I bet those are cousins of this but not the same move. I want to know exactly where they come apart.
  - is it ever legitimate? there must be situations where catching an error in a source makes the rest of it more believable and not less, and I want to know what's different about those situations versus this one.
  - and if nothing fits, make something up. Name it, define it, and give me the boundary cases — because what I actually want is to be able to tell when someone is doing *this* versus when they're doing something defensible, like just refusing to treat a single mistake as disqualifying.

  a bare label won't help me. I want the carving: what the thing is, what it isn't, and where its edges are.
reasoning: |-
  Okay, the user had a two-hour argument with a friend about historical narratives like Exodus, Troy, and King Arthur. The friend kept using a specific move: when you point out impossible elements (miracles, gods, magic), discarding them makes the remaining parts seem more plausible. The user is frustrated because normally, catching a fabrication in a source discredits the rest, but here, it somehow boosts credibility. They want to know if there's a name for this move, how it differs from similar concepts, when it's legitimate, and if not, how to define it themselves.

  First, I need to identify the core issue. The user describes a scenario where subtracting supernatural elements from a story leads to treating the residue as historically supported, not just possible. This is the opposite of the typical "poisoning the well" effect. The friend claims it's standard for ancient texts, but the user feels it's flawed.

  I recall concepts like Euhemerism, which interprets myths as exaggerated accounts of real events. But that's more about explaining gods as deified humans, not selectively removing elements to enhance credibility. Demythologization (Bultmann) deals with removing supernatural elements for theological reasons, not historical validation. Source criticism involves evaluating sources but doesn't inherently make the residue more credible after removing the impossible.

  The key here is the direction of the update: impossible parts are used as "currency" to buy credibility for the mundane parts. The user wants to know why this inversion happens and when it's valid. They also need to distinguish this from legitimate historical methods, like not letting one error discredit an entire source.

  For a term, "Euhemeristic Filter" comes to mind, but that might not be precise. "Miraculous Discount Fallacy" could work, emphasizing the fallacy of thinking that removing miracles somehow validates the rest. The legitimacy depends on whether the impossible elements are later additions or integral to the narrative. For example, if a story is an oral tradition where supernatural layers were added over time, removing them might reveal a historical core. However, if the supernatural is central to the original story, discarding it undermines the whole account.

  The user's deeper need is to have a clear framework to critique this move in arguments. They want terminology and boundaries to articulate why it's sometimes invalid. They might also be seeking validation that their skepticism is justified, especially after being called naive. By naming the fallacy and outlining its flaws, they can push back effectively in future discussions.
answer: |-
  Here's a precise carving of the move your friend used, its boundaries, and its legitimacy:

  ### 1. **The Established Name & Nearest Concepts**
  *   **The Move Itself:** There isn't a single universally agreed-upon term, but the **closest established concept** is the **"Euhemeristic Filter"** or **"Rationalizing Reduction."** It's heavily associated with **Euhemerism** (interpreting myths as distorted accounts of real historical events and persons, where gods = deified kings/heroes).
  *   **Near Misses & Why They Differ:**
      *   **Source Criticism:** This is the *broader discipline* of analyzing historical sources. While it *includes* identifying and potentially discounting unreliable elements (like miracles), it doesn't *require* the crucial *inverted credibility update* your friend used. Source criticism can just as easily conclude the *whole* source is compromised.
      *   **Demythologization (Bultmann):** A theological move to reinterpret supernatural elements existentially/metaphorically for modern audiences. It *removes* the literal supernatural but aims for *spiritual* meaning, **not** increased *historical credibility* for the residue.
      *   **Historical Core Theory:** This *assumes* a historical core exists and seeks it, but it doesn't *logically derive* increased probability for that core *specifically from* the removal of the impossible elements. The increased probability is often asserted or assumed independently.
      *   **Principle of Analogy (in Historiography):** This argues we should interpret past events based on known human experience. It *supports* discounting the supernatural ("we don't see seas part today"), but it **does not** automatically grant *positive credibility* to the mundane residue. It just says the residue *isn't ruled out* by the principle. Your friend went *beyond* this.

  ### 2. **The Specific Fallacy: The Miraculous Discount Fallacy (A Proposed Name)**
  *   **Definition:** The fallacy occurs when the identification and removal of *impossible* (e.g., supernatural, magical, blatantly mythical) elements from a narrative is used not merely to isolate a *plausible* residue, but to **actively *increase* the perceived historical probability or credibility of that residue *specifically because* the impossible elements have been removed.** It treats the discarded impossibilities as a form of "credibility currency" spent to purchase belief in the mundane remainder.
  *   **The Flaw:** The core logical error is the **inversion of the burden of proof and a non sequitur**.
      1.  **Discovery of Fabrication:** You identify part of the narrative as demonstrably false/invented (e.g., sea parting, divine intervention).
      2.  **Flawed Inference:** Instead of this discovery *weakening* the overall reliability of the source (the standard expectation), it is taken as *evidence* that the *remainder* is *more* reliable.
      3.  **False Justification:** The reasoning is often: "If they *added* this impossible thing, they must have been *embellishing* a *real core event*." While embellishment *can* happen, the discovery of embellishment in one area **does not provide positive evidence for the truth of the unembellished parts.** It simply leaves them unproven and potentially also embellished or invented.
      4.  **Ignoring Alternative Explanations:** The move ignores that the *entire narrative* could be legendary, fictional, or based on a kernel so small or distorted as to be unrecognizable. Removing the "shield" of the miraculous doesn't prove the "body" underneath is real; it might reveal there was never a real body there at all.

  ### 3. **Is it Ever Legitimate? The Boundaries**
  Yes, but **only under very specific conditions that are often *assumed* rather than *proven* by the act of removing the impossible elements.** The legitimacy hinges on **independent evidence** or **specific knowledge about the source's composition**:

  *   **Legitimate When (Edges of the Knife):**
      *   **Independent Corroboration Exists:** If archaeological evidence (e.g., destruction layers at Troy VIIa), contemporary documents (e.g., Egyptian records mentioning "Asiatics" or unrest around the right period, *though problematic for Exodus*), or multiple independent sources agree on the *mundane core* (e.g., widespread traditions of a battle at Troy, or post-Roman British warlords), *then* stripping away the myth can reveal the core *already supported elsewhere*. The removal *clarifies*, but the *credibility comes from elsewhere*.
      *   **Known Embellishment Mechanism:** If there's strong evidence the supernatural elements are *later, identifiable additions* to an earlier, more mundane account (e.g., a chronicle where later scribes added miracles to an original dry record). Here, removing the later layer genuinely gets you *closer to the original source*, increasing its relative credibility *compared to the embellished version*. The removal *recovers* an earlier state.
      *   **The Residue is Trivial/Ubiquitous:** If the "residue" is something extremely common or basic (e.g., "people lived somewhere," "there was a fight"), its probability is high *anyway*, regardless of the source. Removing the impossible parts doesn't *increase* its likelihood much; it just isolates it.

  *   **Illegitimate (The Core Fallacy) When:**
      *   **The Move is the *Primary* Evidence:** When the *only* "evidence" offered for the plausibility of the residue is the *act of removing the impossible elements*. ("Well, take out the sea parting, and you've got slaves leaving Egypt! See? Now it's plausible!"). This is circular and grants credibility unearned.
      *   **No Independent Evidence:** When there is *no* corroborating evidence for the specific mundane events described in the residue. Removing Poseidon doesn't make the specific, detailed *cause* of the Trojan War or its participants any more historically verifiable without external proof.
      *   **The Supernatural is Integral:** When the supernatural elements are deeply woven into the narrative's structure, purpose, and meaning. Removing Merlin and Excalibur doesn't isolate "King Arthur"; it arguably removes the *defining characteristics* of the *Arthurian legend* as transmitted. The residue might be unrecognizable or meaningless.
      *   **Ignoring Source Genre/Intent:** Applying it uncritically to texts clearly intended as theological, legendary, or poetic (e.g., Exodus as salvation history, Homer as epic poetry, Arthurian tales as romance) without acknowledging that the "historical core" might be incidental or entirely fabricated to serve the genre's purpose.
      *   **The Residue is Specific & Significant:** When the residue isn't just a vague "battle happened" or "leader existed," but makes specific, testable claims (e.g., *who* fought, *why* they fought, *specific routes* taken, *specific laws* given at a specific mountain) that lack independent support. Removing the sea parting doesn't magically lend credence to the specific route or the Sinai events.

  ### 4. **Distinguishing it from Defensible Moves**

  *   **Miraculous Discount Fallacy:** "This story contains element X (miracle/god) which is impossible. *Therefore*, by removing X, the remaining story Y (slaves leaving, battle at Troy, warlord Arthur) becomes **more credible/historically probable**."
  *   **Defensible Source Criticism:** "This story contains element X which is demonstrably false or impossible. This *reduces our overall confidence* in the source. However, element Y *might* have a historical basis *if* corroborated by independent evidence (Z). We cannot assume Y is true *just because* we removed X."
  *   **Refusing Disqualification by Single Error:** "This source made an error in reporting detail X. This means we must treat *all* its claims with *greater caution* and seek corroboration. It does not mean *every other claim* (Y, Z) is automatically false, but their reliability is now *lower* than if no error was found. We judge Y and Z on their own merits and other evidence." (This *lowers* credibility overall but doesn't deny the *possibility* of truth elsewhere).

  **The Crucial Carving:** The Miraculous Discount Fallacy **uniquely converts the act of identifying falsehood into *positive evidence* for the truth of the remaining narrative.** Legitimate historical criticism **treats the identification of falsehood as *negative evidence* against the source's reliability overall**, requiring any remaining claims to stand on their own merits and external evidence. The fallacy uses subtraction as proof; legitimate criticism uses subtraction as a starting point for skepticism.

  **In essence:** Your friend wasn't just "reading ancient narratives" appropriately; they were performing a specific, often fallacious, logical move that *inverts* the normal relationship between discovered falsehood and source credibility. It's only valid when the credibility of the residue is **independently derived**, not conjured from the act of discarding the impossible.
