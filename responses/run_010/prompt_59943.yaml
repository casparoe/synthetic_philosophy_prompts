prompt: |-
  I'm a process safety engineer at a mid-size chemical site — about forty of us, three shift crews, and I'm the only one whos job is the safety instrumented functions. Every month or two somebody brings me a protective device or a loop and asks the same question in different words: does this thing still actually do what it's supposed to do when the bad thing happens, or are we just collecting green ticks from tests that prove nothing? We've started calling the second one a 'paper disposition' around here, which is meant as a joke but its also the real problem.

  What I want is a decision procedure I can run on any proposed protective function — relief valve, gas detector, triplicated shutdown loop, deluge system — that sorts out the different ways a device can look disposed to protect and not be. There seem to be at least three distinct failures: one where the triggering event itself destroys whatever it was that made the device able to respond; one where the device is still perfectly able to respond but something sitting between it and the event blocks the response; and one where the device does respond, but for reasons that have nothing to do with any capability it actually has. I vaguely remember from a class years ago that there are names for the first two, something about finking and masking, but don't hold me to that. Give me the names and plain-language definitions a controls tech will follow, and tell me which of these distinctions I can safely collapse for field use and which one I absolutely cannot, because collapsing it is how people get hurt.

  Then the procedure: questions in order, what a passing answer looks like for each, where it stops with 'no, this does not protect you', and where it hands off to a human because the remaining question is about how much risk we're willing to carry rather than a fact about the hardware. Ten to fifteen minutes per device, no philosophy background assumed, site manager signs off at the end.

  Run it on these three, taking my descriptions as given:
  1. Gas detectors in the compressor house, bump-tested weekly with a bottle of cal gas. They always alarm. The cal gas leaves a film that slowly coats the sensor, and a detector keeps passing its weekly test right up until the week it stops responding for good.
  2. An emergency isolation valve stroked quarterly, with the control system automatically putting the loop in manual during the test so we don't trip the unit. Last spring one loop sat in manual for eleven days with four passing strokes in the log.
  3. The new shutdown function — three sensors, two-out-of-three voting, cost a fortune, everybody loves it.

  Be straight with me on #3. I expect the procedure to say something I don't want to hear, and if it genuinely doesn't, say why not instead of manufacturing a problem.

  Last thing, and this is the part I can't work out myself. All those philosopher cases seem to be about one object and its own intrinsic properties — this glass, this wire. But a loop's ability to protect isn't located in any component: it's spread across the sensor, the logic, the final element, and what state the whole unit happens to be in at the time. So does the fink/mask distinction even apply to something like that, or do I need a fourth category, something like 'the device that would have saved us was fine but the plant wasn't in a condition where it could be reached'? Tell me how you'd build the answer into the procedure rather than arguing it in the abstract.

  No references or reading list please — I'm not chasing down papers and neither are my techs.
reasoning: |-
  Okay, the user is a process safety engineer dealing with verifying if safety devices actually work. They need a practical decision procedure to assess protective functions quickly. Let me start by understanding their main concerns.

  First, they mentioned three types of failures: the device being destroyed by the event, something blocking its response, and false positives. They recall terms like finking and masking but need plain language. I should define these in simple terms for technicians.

  For the decision tree, it needs to be step-by-step, under 15 minutes per device. The key is to identify if the device can both detect the hazard and perform the action. Steps should check if the device is physically capable, not blocked, and that the response is valid. Then, assess if it's available when needed. Any "no" means it fails. Only risk tolerance questions go to management.

  Now, applying to their examples. 
  For the gas detectors: the cal gas leaves a film, so they pass tests but fail when needed. That's a covert failure. The procedure should catch this because the test doesn't mimic real conditions. 
  The isolation valve was left in manual. The issue here is administrative control—the loop was disabled. The procedure flags this since the device wasn't in auto. 
  The triple-redundant system: the test might not stress all components. The procedure should ask if the test covers all elements and voting logic. They might be missing latent faults.

  The user's deeper need is ensuring tests are realistic. They want to prevent "paper dispositions." The procedure must force examining test adequacy and administrative controls. Also, the distributed nature of safety loops means checking each component and their integration. Adding a step for system state addresses if the plant is in a condition for the device to work. This covers their fourth category without overcomplicating.

  Finally, being straight about #3: even with redundancy, if testing doesn't validate all failure modes, it's not foolproof. The procedure highlights that human judgment is needed for test coverage and risk tolerance, pushing the decision to management where necessary.
answer: |-
  Here's a field-ready decision procedure addressing your core problem: separating real protection from "paper dispositions." It's built on first principles, uses plain language, and runs in 10-15 minutes per device. Key distinctions are preserved where they matter most.

  **Core Concepts (Plain Language for Techs):**
  1.  **"Can it Even Do Its Job?" (Intrinsic Capability - Finkishness Analogy):**
      *   **Plain Language:** *"If the bad thing happened right now, in the middle of a normal day, could this device physically sense it and physically do its protective action (close, open, trip, spray) all by itself, assuming nothing else broke?"*
      *   **Definition:** Is the device fundamentally *able* to perform its designed safety function *when demanded*? A failure here means the device is intrinsically broken or degraded *in a way that would prevent it from acting*, even if the demand signal reached it.
      *   **Why it Matters:** A device that *can't* physically act is useless. Collapsing this hides fundamental hardware failure.

  2.  **"Can it See/Feel the Bad Thing & Do its Job?" (Signal Path Integrity - Masking Analogy):**
      *   **Plain Language:** *"When the bad thing happens, does the signal telling the device to act actually get to it? And once it decides to act, does that action command actually reach the part that moves (valve, breaker, pump)?"*
      *   **Definition:** Is the *connection* between the hazard, the sensing element, the logic solver, and the final element intact and functional? A failure here means the device *could* act if it got the signal, but the signal path is blocked, bypassed, or broken *preventing the demand from being recognized or the action from being executed*.
      *   **Why it Matters:** A perfectly capable device blocked from seeing the problem or acting is useless. Collapsing this hides common causes like valves in manual, bypasses, communication failures, or inhibited alarms.

  3.  **"Does Doing Its Job Actually Help?" (Functional Effectiveness):**
      *   **Plain Language:** *"If this device does exactly what it's supposed to do when the bad thing happens, will it actually stop the bad thing from getting worse or reaching people/equipment? Or is it doing something pointless?"*
      *   **Definition:** Does the designed protective action mitigate the specific hazard it's intended for? A failure here means the device works, but its action is ineffective against the hazard (e.g., wrong response, wrong location, hazard bypasses it).
      *   **Why it Matters:** A device that works perfectly but doesn't mitigate the hazard provides false security. This can sometimes be collapsed *if* the SIF design basis is rigorously validated upfront, but *never* collapse it if the hazard or process has changed.

  4.  **"Is it Ready Right Now?" (Operational State):**
      *   **Plain Language:** *"Is the device turned on, in automatic mode, and not blocked, bypassed, inhibited, or undergoing maintenance *at this exact moment*?"*
      *   **Definition:** Is the device currently configured and permitted to perform its safety function? This is where administrative controls (bypasses, permits, modes) live.
      *   **Why it Matters:** The most capable device is useless if it's switched off or bypassed. **This is your "Fourth Category"**, addressing the distributed/state-dependent nature of loops. It's integrated into the procedure as a critical check.

  **The Decision Procedure: "Does This Thing *Really* Protect?" (10-15 mins per device)**

  1.  **What is the SPECIFIC "Bad Thing" (Hazard) this device is meant to stop or mitigate?** *(e.g., "High pressure rupturing Vessel X", "Gas cloud reaching Ignition Source Y", "Overflow from Tank Z")*
      *   *Passing Answer:* Clear, specific hazard statement defined in the Safety Requirements Specification (SRS) or equivalent. Must be understood by the tech.
      *   *Stop/Fail:* No clear, agreed-upon hazard. **STOP - NO PROTECTION.** Hand off to engineering/management to define the hazard and required SIF.
      *   *Human Handoff Needed?* No. Clarify the hazard on the spot if possible.

  2.  **What SPECIFIC Action is the device supposed to take when it detects the "Bad Thing"?** *(e.g., "Close Valve ABC", "Trip Compressor DEF", "Activate Deluge System GHI")*
      *   *Passing Answer:* Clear, specific action defined in the SRS/equivalent. Action must logically mitigate the hazard (e.g., closing a valve stops flow to an overfilling tank).
      *   *Stop/Fail:* Action is undefined, ambiguous, or clearly doesn't mitigate the stated hazard. **STOP - NO PROTECTION.** Hand off to engineering.
      *   *Human Handoff Needed?* If the action seems illogical for the hazard, hand off immediately.

  3.  **"CAN it Even Do Its Job?" (Intrinsic Capability Check)**
      *   *Question:* "Based on its last test/maintenance records and current condition (visual if possible): If the signal demanding action magically appeared at its input *right now*, could it physically perform its specific action (Step 2) against the actual process conditions (pressure, flow, temp) it would see during the bad thing?"
      *   *Passing Answer:* Evidence (test data, inspection) shows it *recently* demonstrated the required action (e.g., valve closed fully under process pressure, detector alarmed at correct level, deluge nozzle flow/pressure met spec). No known degradation that would prevent this (e.g., sticky valve, coated sensor, fouled nozzle).
      *   *Stop/Fail:* Test failed, maintenance overdue showing critical issues, visible damage, or known degradation preventing the action. **STOP - NO PROTECTION.** Flag for maintenance/repair.
      *   *Human Handoff Needed?* No. This is a factual hardware/performance check.

  4.  **"Can it SEE the Bad Thing & DO the Job?" (Signal Path Check)**
      *   *Question:* "During its last test, was the *ENTIRE path* from sensing the hazard to completing the action tested under conditions representing the bad thing? Did the test include the *actual* sensor input, *all* logic (including voting), *all* outputs, and the *final element's* full action against representative conditions?"
      *   *Passing Answer:* Test procedure explicitly tests the full loop from real-world stimulus (or close simulation like cal gas injection *at the sensor*) to final element performing its full action (e.g., valve stroked fully closed against simulated process pressure). Test verifies all logic steps (e.g., 2oo3 voting confirmed). Bypasses/inhibits are only used if critically necessary and rigorously controlled/tracked.
      *   *Stop/Fail:* Test does not cover the entire loop (e.g., only tests logic with simulated input, only tests valve movement without verifying closure/seal, cal gas applied directly to transmitter bypassing sensor head). **STOP - NO PROTECTION.** Flag for test procedure improvement.
      *   *Human Handoff Needed?* No. This is a factual test coverage check.

  5.  **"IS it Ready RIGHT NOW?" (Operational State Check)**
      *   *Question:* "Looking at the control system status, permits, and logbooks *right now*: Is this device (sensor, logic, final element) in automatic mode, not bypassed, not inhibited, not under active maintenance, and not in a mode (e.g., startup) where its function is intentionally suspended?"
      *   *Passing Answer:* Control system shows "Auto", no active bypasses/inhibits logged or visible, no active maintenance permits for this SIF.
      *   *Stop/Fail:* Loop is in "Manual", a bypass/inhibit is active, maintenance is in progress. **STOP - NO PROTECTION.** Requires immediate review/restoration (may involve management/handoff depending on bypass procedure).
      *   *Human Handoff Needed?* **YES, for tolerance.** *If* a bypass/inhibit is active: "Is there an approved, time-limited, risk-assessed bypass/permit in place with compensatory measures?" This requires management sign-off on the risk decision.

  **Procedure Summary:**
  1.  Define the Hazard.
  2.  Define the Action.
  3.  Check Intrinsic Capability (Can it Do It?).
  4.  Check Signal Path & Test Coverage (Can it See & Do the Whole Job?).
  5.  Check Operational State (Is it Ready Now?).

  **Any "No" at Steps 1-4: STOP - NO PROTECTION.** Requires technical fix (design, maintenance, testing).
  **"No" at Step 5 due to bypass:** **STOP - NO PROTECTION** until restored. Requires active management review/sign-off if bypass is to remain.

  ---

  **Running the Examples:**

  1.  **Gas Detectors (Cal Gas Film):**
      *   Hazard: Gas leak reaching LEL.
      *   Action: Alarm (and likely initiate ventilation/shutdown).
      *   **Intrinsic Capability (Step 3):** PASS (Weekly bump test "proves" it *can* alarm *right now*... but see Step 4!).
      *   **Signal Path & Test (Step 4):** **FAIL.** The test *does not* represent the real hazard path. Cal gas applied directly bypasses the sensor's environmental exposure (air flow, potential coating). It only tests the electronics downstream. The *coating failure mode is not challenged*. The test proves nothing about the sensor's ability to detect *real gas in real air*. **STOP - NO PROTECTION.** Needs a different test method (e.g., functional test with gas at the sensor head periodically).

  2.  **Emergency Isolation Valve (Left in Manual):**
      *   Hazard: e.g., Rupture downstream requiring flow isolation.
      *   Action: Close valve.
      *   **Intrinsic Capability (Step 3):** PASS (Quarterly stroke test shows it *can* close).
      *   **Signal Path & Test (Step 4):** **FAIL.** The test procedure itself *forces* the loop into manual, bypassing the automatic function. While the valve movement is tested, the *automatic initiation path is not tested at all* during the stroke test. Furthermore, the 11-day manual state highlights...
      *   **Operational State (Step 5):** **FAIL.** The loop was demonstrably *not* in automatic mode when it needed to be. The administrative control (returning to auto after test) failed. **STOP - NO PROTECTION.** Requires procedure fix (auto-return verification/alarm) and stricter admin controls.

  3.  **Triplicated Shutdown Loop (2oo3 Voting):**
      *   Hazard: (Whatever it's designed for, e.g., high pressure).
      *   Action: (Whatever it does, e.g., close valve, trip compressor).
      *   **Intrinsic Capability (Step 3):** PASS (Assumed testing shows each sensor, logic channel, and final element *can* work).
      *   **Signal Path & Test (Step 4):** **CRITICAL QUESTION.** How is it tested?
          *   *Bad Test:* Sensors tested individually with simulated inputs; voting logic tested internally with simulated signals; valve stroked separately. **FAIL.** This misses *common cause failures* (e.g., all sensors coated), *interface faults* (does a sensor failure *correctly* influence the voting?), and *final element action under demand*. It's a collection of green ticks, not a proof the *system* works.
          *   *Good Test:* Realistic demand simulation applied simultaneously to all sensors (or a proven equivalent partial stroke test method that challenges voting and final element under representative conditions). PASS.
      *   **Operational State (Step 5):** PASS (Assumed no bypasses).
      *   **The Straight Answer You Expected:** If the testing isn't integrated and doesn't challenge the *system's* ability to respond to a *realistic demand signal* (including sensor performance and voting behavior), then **Step 4 FAILs.** You have a very expensive, highly available "paper disposition." The procedure forces you to scrutinize *how* the testing validates the *entire safety function*, not just components. If the testing is rigorous and integrated (proving the system works as designed under representative conditions), it PASSES Step 4. **The procedure highlights the testing adequacy as the critical vulnerability for complex SIFs.**

  **Addressing the Distributed Nature (Your "Fourth Category"):**

  You are absolutely right. The protection isn't in one component; it's an emergent property of the *system* (hardware + software + configuration) *in a specific operational state*. The procedure handles this by:

  1.  **Step 4 (Signal Path & Test):** Explicitly demands testing the *entire path* from hazard stimulus to final action. This forces consideration of the interfaces and the system's integrated response.
  2.  **Step 5 (Operational State):** Directly addresses the "state of the plant" question. Is the *system* configured (auto, not bypassed) to *allow* the protection to happen? This captures the administrative/state-dependent risk.
  3.  **Defining Hazard and Action (Steps 1 & 2):** Anchors the entire assessment on the *system's* purpose within the specific process context.

  The "Intrinsic Capability" (Step 3) focuses on the final element's *physical* ability to perform its action *when commanded*, acknowledging that the *command* depends on the rest of the system (covered in Step 4). The "Signal Path" (Step 4) covers the *functional integrity* of the sensing, logic, and command transmission *as a system*. **This structure effectively captures the distributed nature without needing a separate, abstract fourth category.** The "state" is explicitly covered in Step 5.

  **Final Output:** A simple form with:
  *   Device ID / Description
  *   Hazard (Step 1)
  *   Required Action (Step 2)
  *   Step 3: PASS/FAIL (Evidence: Test Date/Result)
  *   Step 4: PASS/FAIL (Evidence: Test Procedure #, Scope)
  *   Step 5: PASS/FAIL/ByPass Active (Evidence: Control Sys Status, Bypass #)
  *   **Overall Protection Status:** PROTECTED / NOT PROTECTED
  *   Actions Required (if NOT PROTECTED)
  *   **Sign-Off:** Engineer: _________________ Date: _______
  *   **Management Sign-Off (Only if Bypass Active & Tolerated):** Manager: _________________ Date: _______ (Valid Until: _______) Compensatory Measures: _________________________

  This gives you an auditable trail focused *only* on functional safety reality, not just test compliance. It forces the hard questions every time.
