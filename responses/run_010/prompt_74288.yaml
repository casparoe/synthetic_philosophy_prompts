prompt: |-
  I coordinate a study that collects verbal reports alongside behavioural and imaging data, and I have been asked to write the laboratory's standing protocol for handling the reports. Four graduate research assistants will use it to code roughly sixty transcripts a week, about twenty minutes each, and none of them has any training in philosophy of mind. The protocol must also satisfy two co-investigators who sit on opposite sides of the consciousness debate: one holds that phenomenal experience is real and that a subject is directly acquainted with their own, the other holds that experience talk is largely a theoretical fiction generated by cognitive processes that are themselves entirely describable from the outside. Our declared method is heterophenomenology in Dennett's sense — reports are treated as data from which the coder reconstructs the world as the subject takes it to be, with the question of whether that world contains what the subject says it contains left strictly open. My difficulty is that the method is normally stated as a set of slogans rather than as a workflow, and in pilot coding my assistants have drifted in both directions: some treat a sincere report as settled evidence that the subject had the experience described, while others quietly rewrite reports into claims about stimulus processing or about what the subject would do if asked. The coded record is what our paper's claims about awareness will rest on, and my principal investigator signs off on the protocol before submission.

  Please write the protocol itself, as something a coder can keep beside them at a desk. It should contain:

  1. The ordered steps from raw transcript to coded record, stating what each step may and may not put into the record, and why that order is forced — which steps depend on which.
  2. Which distinctions must survive the simplification for non-philosophers and which can safely be dropped: report versus judgement versus mere disposition to respond; the subject's authority over what they said as against what it means; the subject's world as against the theorist's; sincerity as against accuracy.
  3. A neutrality audit: a short list of code labels, phrasings, and inferential moves that betray the coder's own metaphysics, each paired with an acceptable replacement, on the standard that the same transcript must come out coded the same way whichever co-investigator is reading over the coder's shoulder.
  4. Rules for conflict and confabulation: when two incompatible reports are both logged, when one is flagged as likely confabulation, when behavioural or neural data may override a report as against merely being recorded alongside it, and where the coder must stop and refer the case to me.
  5. A check that the protocol has actually been followed, and something better than percentage agreement, since two coders can agree perfectly while both smuggling in the same metaphysics.
  6. Honest marking of the steps that are judgement calls dressed as procedure, and a plain statement of what the protocol cannot do, written so that it can be handed to the co-investigators without embarrassment.

  Then run the protocol end to end on three cases, showing the record actually produced at each stage rather than describing it: (a) two stationary lights of different colours flashed in quick succession a few degrees apart, with participants reporting one spot that moved across the screen and changed colour partway along its path; (b) a participant with a visual field defect who denies seeing anything in the affected region on trial after trial yet localises and identifies stimuli presented there well above chance; (c) a participant who, having been covertly shown an item other than the one they selected as the more attractive of two, gives a fluent and detailed account of why they chose the item now in front of them.

  Add one further case of your own choosing on which following the protocol to the letter yields a result I will not welcome — for instance a case in which it leaves the study unable to say anything at all about whether an experience occurred, or in which the neutrality requirement and the demand for publishable data come apart. State which co-investigator will object and on what grounds.

  Finally, address the standing objection that heterophenomenological neutrality is not on offer: that to treat a report as describing a world whose contents are held in abeyance, rather than as a subject's direct word on an experience they are in a position to know about, is already to have taken the deflationist side, since the realist denies that there is any such thing as bracketing the question. Say where in the protocol that objection bites, whether neutrality should be reinterpreted as a constraint on the coder's vocabulary rather than on the ontology of the coded record, and what I should tell each co-investigator.

  Keep the philosophical justification separate from the operational steps, so that my assistants are not required to understand the debate in order to do the job, and close with a one-page card summarising the steps and the audit list.
reasoning: |-
  We are constructing a detailed protocol for coding verbal reports in a heterophenomenological framework. The goal is to be neutral between realist and deflationist views of consciousness. The protocol must be operational, with clear steps, and avoid requiring philosophical training.

  Key principles from heterophenomenology (Dennett):
  - Treat the subject's reports as texts to be interpreted.
  - Reconstruct the subject's "heterophenomenological world" (the world as the subject believes it to be).
  - Do not assume that the subject's reports are about real private experiences, nor that they are mere fictions. Leave the ontological status of experiences open.

  The protocol must include:
  1. Ordered steps from raw transcript to coded record, with what is allowed and not allowed at each step, and why the order is necessary.
  2. Which distinctions must be preserved and which can be dropped for non-philosophers.
  3. A neutrality audit: list of biased code labels, phrasings, and inferences, with acceptable replacements.
  4. Rules for handling conflicts, confabulation, and when to override reports or refer to the coordinator.
  5. A method for checking protocol adherence beyond simple inter-coder agreement.
  6. Honest marking of judgement calls and limitations.

  Additionally, we must run the protocol on three provided cases and one additional case that highlights a challenge, then address the standing objection about the possibility of neutrality.

  ---

  **Protocol: Heterophenomenological Coding Manual**

  **I. Introduction**
  - This protocol is for coding verbal reports from participants in our studies. Your task is to transform raw transcripts into a coded record that captures the subject's reported world without taking a stance on whether the experiences described are real or not.
  - The method is heterophenomenology: we treat the subject as if they are reporting about a world (their "heterophenomenological world") and we record what that world contains according to them. We do not decide whether that world matches the real world or whether the experiences are genuine.
  - You are not required to understand the philosophy behind this; just follow the steps.

  **II. Step-by-Step Coding Procedure**

  *Order of steps is critical: each step builds on the previous one without jumping ahead to interpretation.*

  1. **Transcription Check (Step 1)**
     - *Input*: Audio recording and/or raw transcript (if already transcribed).
     - *Action*: Verify the transcript against the audio. Correct any errors in transcription (e.g., misheard words, omitted phrases). Do not change the subject's words to make them "clearer" or "more grammatical" unless it's a clear transcription error (e.g., "I seen" instead of "I saw" is kept; "I seen a cat" when the audio is "I saw a cat" is corrected).
     - *Output*: A verified transcript that exactly matches what the subject said.
     - *Why this order first?*: Without an accurate record of the words, we cannot proceed. This step is purely about fidelity to the audio.

  2. **Segmentation (Step 2)**
     - *Input*: Verified transcript.
     - *Action*: Break the transcript into distinct "report units". A report unit is a single complete thought about the subject's experience, usually corresponding to a clause or a simple sentence. Use natural breaks (pauses, changes of topic) but avoid splitting a single idea. Mark the start and end of each unit.
     - *Example*: "I saw a light moving from left to right, and it changed color" → Two units: (1) "I saw a light moving from left to right", (2) "and it changed color".
     - *Output*: A segmented transcript with numbered units.
     - *Why now?*: We need discrete units for coding. This step does not interpret, only segments.

  3. **Literal Paraphrase (Step 3)**
     - *Input*: Segmented transcript.
     - *Action*: For each unit, write a paraphrase that captures the literal meaning of the subject's words without interpretation. Use the subject's own terms. Avoid replacing words with synonyms that might carry different connotations. If the subject says "I felt a sharp pain", the paraphrase is "Subject reports feeling a sharp pain", not "Subject reports nociceptive stimulus".
     - *Do not*: Add inferences, combine units, or import external knowledge (e.g., from the task design).
     - *Output*: A list of literal paraphrases for each unit.
     - *Why now?*: This step ensures we have a clear, non-interpretative base for the next step. It must come before any reconstruction.

  4. **Reconstruction of the Heterophenomenological World (Step 4)**
     - *Input*: Literal paraphrases.
     - *Action*: For each unit, code what the subject is reporting as being part of their world. Use the format: "In the subject's world, [content]". The content should be a direct representation of the subject's claim about their experience.
       - *Example 1*: Literal paraphrase: "Subject reports seeing a moving light that changed color." → Coded as: "In the subject's world, there was a moving light that changed color."
       - *Example 2*: "Subject reports feeling unsure." → "In the subject's world, there was a feeling of uncertainty."
     - *Key rules*:
       - Do not evaluate whether the content is accurate or possible (e.g., even if you know the stimulus didn't move, code the moving light).
       - Do not add explanations (e.g., do not say "the subject mistakenly reports a moving light").
       - If the subject expresses doubt (e.g., "I think I saw a light"), code it as: "In the subject's world, there was uncertainty about seeing a light" or "the subject thinks there was a light" — preserving the doubt.
     - *Output*: A list of statements about the subject's heterophenomenological world.

  5. **Sincerity and Confidence Coding (Step 5)**
     - *Input*: Literal paraphrases and reconstructed world statements.
     - *Action*: For each unit, code:
       - *Sincerity*: How sure are we that the subject is being sincere? (Use behavioral cues from the transcript: hesitations, emotional tone, consistency with prior reports, etc.) Scale: High, Medium, Low. If no cues, default to High.
          - *Note*: This is about whether the subject is trying to report truthfully, not whether they are accurate. A sincere report can be wrong.
       - *Confidence*: How confident does the subject seem in their report? (Based on their words: "I'm sure", "maybe", etc.) Scale: High, Medium, Low. If not stated, default to Medium.
     - *Output*: Sincerity and confidence ratings for each unit.

  6. **Integration with Non-Verbal Data (Step 6)**
     - *Input*: Reconstructed world statements, sincerity/confidence ratings, and non-verbal data (behavioral responses, neural data).
     - *Action*:
       - Record the non-verbal data alongside the verbal reports without merging. For example:
          - Behavioral: "Subject pressed button for 'left'".
          - Neural: "Activation in V1 at time X".
       - Do not use non-verbal data to override the verbal report. If there is a conflict, note it but do not change the reconstruction.
       - Exception: If non-verbal data indicates the subject was not attending (e.g., asleep, distracted) during the report, flag the unit for referral (see Step 7).
     - *Output*: A combined record with verbal reconstructions and non-verbal data, with any conflicts noted.

  7. **Conflict and Confabulation Handling (Step 7)**
     - *Input*: The entire record from Step 6.
     - *Action*:
       - If two reports from the same subject are incompatible (e.g., "I saw nothing" on trial 1 and "I saw a light" on trial 2 for the same stimulus), code both and note the conflict.
       - If a report is internally inconsistent (e.g., "I saw a red light that was blue"), code it as stated and note the inconsistency.
       - Flag a report as "possible confabulation" only if:
          - There is strong behavioral/neural evidence that the event did not occur (e.g., no stimulus was presented) AND
          - The subject's report includes details that are implausible given the context (e.g., reporting a complex event during a blank screen).
          - But do not remove or alter the report. Instead, add a note: "Possible confabulation: subject reported X, but no stimulus was present."
       - When to refer to the coordinator:
          - If you are unsure about how to code a report due to ambiguity.
          - If non-verbal data suggests the subject was not in a state to give a report (e.g., asleep, highly distressed).
          - If you find yourself wanting to override the report based on your own beliefs.
     - *Output*: Final coded record with any flags or notes.

  **III. Distinctions to Preserve vs. Drop**

  - **Must Preserve**:
    - Report vs. Judgement: A report is what the subject says; a judgement is an inference we make. We code reports, not our judgements. (But note: if the subject makes a judgement, e.g., "I think it was red", code that as part of their world.)
    - Subject's authority: The subject is the authority on what they said and what they meant to say (if they clarify). We do not override their words. However, we are not committed to their being an authority on what actually happened.
    - Subject's world vs. theorist's world: Always code from the subject's perspective. The theorist's world (the experimenter's knowledge) is recorded separately as non-verbal data.
    - Sincerity vs. Accuracy: Code sincerity (did the subject believe what they said?) separately from accuracy (did it match the stimulus?). We can code accuracy later for analysis, but not in the reconstruction.

  - **Can Drop**:
    - Mere disposition to respond: We code explicit reports, not what the subject might have said in other circumstances. Dispositions are in the behavioral data, not the verbal report.
    - Philosophical nuances: E.g., "qualia", "raw feels". If the subject uses such terms, code them; if not, avoid introducing them.

  **IV. Neutrality Audit**

  Coders must avoid language that implies a stance on the reality of experiences. Replace biased phrasings with neutral ones.

  | Biased Phrasing          | Acceptable Replacement                          | Reason |
  |--------------------------|-------------------------------------------------|--------|
  | "The subject experienced X" | "The subject reports experiencing X" or "In the subject's world, X occurred" | Avoids committing to the existence of the experience. |
  | "The subject imagined X"   | "The subject reports X" (if they say they imagined it, then code as such: "In the subject's world, they imagined X") | "Imagined" can imply unreality; use the subject's own framing. |
  | "The subject mistakenly reported X" | "The subject reported X, which differs from the stimulus [state the stimulus]" | Avoids implying error in the report; the report is data. |
  | "The subject's perception of X" | "The subject's report of X" | "Perception" implies a real object. |
  | "The subject confabulated X" | "The subject reported X; [note: no stimulus was present]" | "Confabulated" is a judgement; state facts. |
  | "The subject was unaware of X" | "The subject did not report X" or "The subject reported not seeing X" | "Unaware" assumes a mental state; stick to reports. |

  *Inferential Moves to Avoid*:
  - Do not infer experiences from behavior (e.g., if the subject presses a button for "red", but doesn't say anything, do not code a report of red).
  - Do not infer that the subject "must have seen" something because their eyes were open.

  **V. Adherence Check**

  - After coding, coders must complete a self-audit checklist for each transcript, answering:
    1. Did I code the literal words without adding or removing content?
    2. Did I reconstruct the world without evaluating its truth?
    3. Did I avoid all phrases from the biased list?
    4. Did I note conflicts without resolving them?
    5. Did I refer ambiguous cases?
  - Inter-coder reliability: Use a two-step process:
    1. Percentage agreement on the literal paraphrase and reconstruction (should be high, >90%).
    2. A "neutrality audit" by a third coder who checks for biased language in the coded record. This auditor is blind to which coder produced the record.
  - If two coders agree but both use biased language, the neutrality audit will catch it.

  **VI. Limitations and Judgement Calls**

  - *Judgement calls*:
    - Segmentation (Step 2): Deciding what constitutes a unit can be subjective. When in doubt, keep units small.
    - Literal paraphrase (Step 3): Some reports are ambiguous. If the meaning is unclear, note it and refer to the coordinator.
    - Sincerity coding (Step 5): This is subjective. Use clear criteria (hesitations, self-corrections, emotional markers) and default to High when uncertain.
  - *What the protocol cannot do*:
    - It cannot resolve the ontological status of experiences. The coded record is a description of the subject's beliefs, not a claim about consciousness.
    - It cannot force agreement on difficult cases. Ambiguous reports will remain ambiguous.
    - It cannot incorporate non-verbal data into the verbal reconstruction; they remain separate.

  **VII. Protocol Summary Card (One Page)**

  [Attached as a separate page for desk use]

  ---

  **Running the Protocol: Case Examples**

  *Case (a): Apparent Motion*
  - Stimulus: Two stationary lights flashed in quick succession, one red left, one green right.
  - Report: "I saw one spot that moved across the screen and changed from red to green halfway."

  *Step 1: Transcription Check*
  - Verified transcript: "I saw one spot that moved across the screen and changed from red to green halfway."

  *Step 2: Segmentation*
  - Unit 1: "I saw one spot that moved across the screen"
  - Unit 2: "and changed from red to green halfway"

  *Step 3: Literal Paraphrase*
  - Unit 1: Subject reports seeing one spot that moved across the screen.
  - Unit 2: Subject reports that it changed from red to green halfway.

  *Step 4: Reconstruction*
  - Unit 1: In the subject's world, there was one spot that moved across the screen.
  - Unit 2: In the subject's world, the spot changed from red to green halfway.

  *Step 5: Sincerity and Confidence*
  - Both units: Sincerity High (clear report), Confidence High (no hesitations).

  *Step 6: Non-Verbal Data*
  - Behavioral: Subject pressed "moving" button.
  - Neural: Activation in motion-sensitive area MT.
  - Recorded alongside.

  *Step 7: Conflict Handling*
  - No conflict or confabulation.

  *Coded Record*:
  - [Unit 1] In the subject's world: one spot moving across the screen. Sincerity: High, Confidence: High.
  - [Unit 2] In the subject's world: the spot changed color from red to green halfway. Sincerity: High, Confidence: High.
  - Behavioral: Subject pressed "moving" button.
  - Neural: MT activation at [time].

  *Case (b): Visual Field Defect (Denial of Sight)*
  - Stimulus: Stimuli presented in blind field; subject denies seeing anything.
  - Report (typical trial): "I didn't see anything there."

  *Step 1: Transcription Check*
  - Verified transcript: "I didn't see anything there."

  *Step 2: Segmentation*
  - Unit 1: "I didn't see anything there."

  *Step 3: Literal Paraphrase*
  - Unit 1: Subject reports not seeing anything in that location.

  *Step 4: Reconstruction*
  - Unit 1: In the subject's world, there was nothing seen in that location.

  *Step 5: Sincerity and Confidence*
  - Sincerity: High (consistent across trials), Confidence: High (firm denial).

  *Step 6: Non-Verbal Data*
  - Behavioral: Subject correctly localized and identified the stimulus (e.g., shape, position) on 80% of trials.
  - Neural: Activation in early visual areas.

  *Step 7: Conflict Handling*
  - Conflict: Subject reports not seeing anything, but behavioral data shows above-chance localization. Flag: "Conflict: subject reports no sight, but behavioral data indicates processing of stimulus." Do not override the report.

  *Coded Record*:
  - [Unit 1] In the subject's world: nothing was seen in the specified location. Sincerity: High, Confidence: High.
  - Behavioral: On this trial, subject correctly localized the stimulus [details]. Overall accuracy: 80%.
  - Neural: V1 activation at [time].
  - Note: Conflict between report and behavior.

  *Case (c): Choice Blindness*
  - Stimulus: Subject chooses item A as more attractive; experimenter covertly swaps to item B. Subject is shown B and explains choice.
  - Report: "I chose this one because it's more elegant and the color is better."

  *Step 1: Transcription Check*
  - Verified transcript: "I chose this one because it's more elegant and the color is better."

  *Step 2: Segmentation*
  - Unit 1: "I chose this one"
  - Unit 2: "because it's more elegant"
  - Unit 3: "and the color is better"

  *Step 3: Literal Paraphrase*
  - Unit 1: Subject reports choosing the item in front of them.
  - Unit 2: Subject reports that it is more elegant.
  - Unit 3: Subject reports that the color is better.

  *Step 4: Reconstruction*
  - Unit 1: In the subject's world, they chose the item in front of them.
  - Unit 2: In the subject's world, the item was more elegant.
  - Unit 3: In the subject's world, the color of the item was better.

  *Step 5: Sincerity and Confidence*
  - All units: Sincerity High (fluent report), Confidence High.

  *Step 6: Non-Verbal Data*
  - Behavioral: Subject initially chose A; was shown B and gave this report.

  *Step 7: Conflict Handling*
  - Note: Subject reports choosing the item in front of them (B), but behavioral data shows they initially chose A. Flag: "Report of choice refers to item B; initial choice was A." No confabulation flag because the subject might be reporting their current reason for choosing B (even if they didn't choose it originally). But note the inconsistency.

  *Coded Record*:
  - [Unit 1] In the subject's world: they chose the item in front of them (B). Sincerity: High, Confidence: High.
  - [Unit 2] In the subject's world: the item (B) was more elegant. Sincerity: High, Confidence: High.
  - [Unit 3] In the subject's world: the color of the item (B) was better. Sincerity: High, Confidence: High.
  - Behavioral: Initial choice: A. Shown B and reported as above.
  - Note: Inconsistency between initial choice and report about choice.

  *Additional Case: The Unreportable Experience*
  - Stimulus: A brief, masked stimulus that is known to evoke neural activity but not reported.
  - Report: "I didn't see anything."

  *Step 1: Transcription Check*
  - Verified transcript: "I didn't see anything."

  *Step 2: Segmentation*
  - Unit 1: "I didn't see anything."

  *Step 3: Literal Paraphrase*
  - Unit 1: Subject reports not seeing anything.

  *Step 4: Reconstruction*
  - Unit 1: In the subject's world, nothing was seen.

  *Step 5: Sincerity and Confidence*
  - Sincerity: High, Confidence: High.

  *Step 6: Non-Verbal Data*
  - Behavioral: No response or chance performance on forced-choice task.
  - Neural: Significant activation in relevant sensory areas.

  *Step 7: Conflict Handling*
  - No direct conflict because the behavioral data doesn't show above-chance performance. But neural data shows processing. We do not override. Only note: "Neural data indicates stimulus processing despite report of no sight."

  *Coded Record*:
  - [Unit 1] In the subject's world: nothing was seen. Sincerity: High, Confidence: High.
  - Behavioral: No response / chance performance.
  - Neural: Activation in [area].

  *Problem*: The study cannot say, based on the verbal report, that there was any experience. The realist co-investigator might object: "But there was an experience! The neural data shows it, and the subject just couldn't report it." The deflationist might say: "No experience is needed; just unconscious processing." The protocol remains silent on whether an experience occurred. The coded record only shows that the subject reports no experience.

  *Which co-investigator objects?* The realist, on the grounds that the protocol ignores the possibility of unreportable experiences. The deflationist will be satisfied that we didn't posit an experience.

  ---

  **Addressing the Standing Objection**

  *Objection*: "Heterophenomenological neutrality is impossible because treating reports as descriptions of a 'world' rather than direct access to experiences already sides with deflationism. The realist says we cannot bracket the question of experience."

  *Where does this bite the protocol?* In Step 4 (Reconstruction). The realist might argue that by coding "in the subject's world, X" instead of "the subject experienced X", we are implicitly denying the subject's direct acquaintance with their experience.

  *Response*:
  - The protocol uses "in the subject's world" as a neutral way to capture the subject's belief. It does not deny that the subject might be directly acquainted; it just doesn't assume it.
  - The bracketing is methodological, not ontological. We are not saying experiences don't exist; we are saying that for the purpose of coding, we record what the subject believes, not what is real.
  - This is not deflationist; it is agnostic.

  *What to tell the co-investigators*:
  - To the realist: "This method does not deny that subjects have direct access; it just doesn't presuppose that their reports are infallible. We record what they take to be true, which is compatible with their being directly acquainted."
  - To the deflationist: "This method does not assume that experiences are real; it treats reports as texts, which is consistent with your view."

  *Reinterpreting Neutrality*: Neutrality should be seen as a constraint on vocabulary in the coded record, not on ontology. We avoid terms that presuppose either view (e.g., "experience" as a real entity or "confabulation" as implying no entity). The ontology remains open for later interpretation by the investigators.

  ---

  **Summary Card for Coders**

  [One page, bullet points]

  **Heterophenomenological Coding Steps**

  1. **Transcription Check**: Verify transcript against audio. Correct only transcription errors.
  2. **Segmentation**: Break into units (one thought per unit).
  3. **Literal Paraphrase**: Reword each unit plainly, without changing meaning.
  4. **Reconstruction**: For each unit, write: "In the subject's world, [content]". Use the subject's words.
  5. **Sincerity/Confidence**: Rate sincerity (High/Med/Low) and subject's confidence (High/Med/Low).
  6. **Add Non-Verbal Data**: Record behavioral/neural data separately. Do not merge.
  7. **Conflict Handling**: Note conflicts; flag possible confabulation only if strong evidence; refer ambiguities.

  **Neutrality Audit - Avoid These Phrases**
  - Instead of "experienced X" → "reports experiencing X" or "in the subject's world, X"
  - Instead of "mistakenly reported" → "reported X [note: stimulus was Y]"
  - Instead of "was unaware" → "did not report" or "reported not seeing"

  **When to Refer**
  - If you're unsure how to code.
  - If non-verbal data suggests the subject wasn't attending.
  - If you want to override a report based on your beliefs.

  **Self-Check Questions After Coding**
  - Did I keep the subject's words?
  - Did I avoid judging the report?
  - Did I use neutral language?
  - Did I note conflicts without fixing them?
  - Did I refer when needed?

  **Remember**: You are recording the subject's world, not the real world. Leave the experience question open.
answer: |-
  ### Laboratory Protocol for Verbal Report Coding: Heterophenomenological Approach  
  **Version 1.0**  
  *Approved by Principal Investigator*  

  ---

  ### **I. Purpose**  
  This protocol standardizes coding of verbal reports into a "coded record" that reconstructs the subject's world *as they report it*, without assuming the reality or unreality of their experiences. It adheres to **heterophenomenology** (Dennett):  
  - Treat reports as texts describing a "heterophenomenological world" (the world *as the subject takes it to be*).  
  - Leave open whether that world contains what the subject says it contains.  
  - **Neutrality is key**: Coders must not side with either "experience is real" or "experience is a theoretical fiction."  

  ---

  ### **II. Step-by-Step Workflow**  
  *Order is fixed: Later steps depend on earlier ones. Do not skip steps.*  

  #### **Step 1: Transcription Verification**  
  - **Input**: Raw audio recording + draft transcript.  
  - **Action**:  
    - Listen to audio while reading transcript.  
    - Correct **only** errors in word-for-word transcription (e.g., "I seen a light" → "I saw a light" if audio confirms).  
    - **Do not** "clean up" grammar, fill pauses, or interpret meaning.  
  - **Output**: Verified transcript (exact words spoken).  
  - **Why this order first?** Accuracy of the raw report is foundational. All later steps depend on it.  

  #### **Step 2: Segmentation**  
  - **Input**: Verified transcript.  
  - **Action**:  
    - Split transcript into discrete **report units** (1 unit = 1 complete claim about experience).  
    - Start a new unit at natural breaks (e.g., pauses, conjunctions like "and" or "but").  
    - *Example*: "I saw a moving light [Unit 1], and it was red [Unit 2]."  
  - **Output**: Numbered list of units (e.g., Unit 1, Unit 2).  
  - **Why this order?** Units isolate claims before interpretation.  

  #### **Step 3: Literal Paraphrase**  
  - **Input**: Segmented units.  
  - **Action**:  
    - Rewrite each unit in simple, neutral language **without changing meaning**.  
    - **Must**: Use the subject’s words (e.g., "light" → "light"; "pain" → "pain").  
    - **Must not**: Replace terms with scientific jargon (e.g., "light" → "photonic stimulus"), add inferences, or drop qualifiers (e.g., "maybe" or "I think").  
    - *Example*: Unit: "It sorta felt like a pinch" → Paraphrase: "Subject reports something resembling a pinch."  
  - **Output**: Paraphrased units.  
  - **Why this order?** Creates a clear basis for reconstruction. Depends on accurate segmentation.  

  #### **Step 4: Heterophenomenological Reconstruction**  
  - **Input**: Paraphrased units.  
  - **Action**:  
    - Translate each paraphrase into a statement about the **subject’s world**. Format:  
      *"In the subject’s world, [content]."*  
    - **Must**: Preserve the subject’s perspective (e.g., "I saw movement" → "In the subject’s world, there was movement").  
    - **Must not**:  
      - Reference external reality (e.g., *not* "Subject incorrectly reported movement").  
      - Imply existence/non-existence of experiences (e.g., avoid "subject experienced" or "subject imagined").  
  - **Output**: Coded record entries (e.g., "Unit 1: In the subject’s world, a light moved left to right").  
  - **Why this order?** Reconstruction depends on literal paraphrase. Jumping ahead risks importing coder bias.  

  #### **Step 5: Sincerity and Confidence Tagging**  
  - **Input**: Coded record entries + original transcript.  
  - **Action**:  
    - **Sincerity** (subject’s intent): Tag as `High`, `Medium`, or `Low` based on behavioral cues:  
      - *High*: Clear, spontaneous language (e.g., "I definitely saw it").  
      - *Medium*: Hesitation or mild uncertainty (e.g., "I think I saw it").  
      - *Low*: Contradictory cues (e.g., laughing while reporting pain).  
    - **Confidence** (subject’s certainty): Tag as `High`, `Medium`, or `Low` based on explicit language:  
      - *High*: "I’m sure," "certainly."  
      - *Low*: "Maybe," "possibly."  
      - *Medium*: No explicit marker.  
    - **Note**: Do **not** conflate sincerity/confidence with accuracy.  
  - **Output**: Coded record with sincerity/confidence tags.  
  - **Why this order?** Requires reconstruction to avoid judging sincerity *before* understanding the claim.  

  #### **Step 6: Non-Verbal Data Integration**  
  - **Input**: Coded record + behavioral/neural data (e.g., button presses, fMRI).  
  - **Action**:  
    - **Record non-verbal data verbatim** (e.g., "Subject pressed ‘left’ button at 500ms").  
    - **Do not** override or "correct" the coded record.  
    - **Flag conflicts** between report and data (e.g., "Note: Subject reported no light, but neural data shows V1 activation").  
    - **Exception**: Override report **only** if data proves inattention (e.g., EEG confirms sleep; then tag unit as `Invalid: subject not attending`).  
  - **Output**: Coded record with non-verbal data and conflict flags.  
  - **Why this order?** Non-verbal data must not influence reconstruction (Steps 3–4).  

  #### **Step 7: Conflict and Confabulation Handling**  
  - **Input**: Final coded record.  
  - **Action**:  
    - **Log incompatible reports** (e.g., Trial 1: "I saw nothing" vs. Trial 2: "I saw a light").  
    - **Flag confabulation** only if:  
      - Report is physically impossible (e.g., "I saw a unicorn" in a controlled lab setting).  
      - **And** behavioral/neural data shows no basis (e.g., no stimulus present + no neural response).  
      - Flag format: `Possible confabulation: [reason]`.  
    - **Refer to coordinator** if:  
      - Sincerity is `Low` *and* conflict with data is unresolved.  
      - Report is ambiguous (e.g., metaphor: "It felt like hell").  
      - You feel tempted to override the report.  
  - **Output**: Final coded record with flags/referrals.  

  ---

  ### **III. Critical Distinctions**  
  *For non-philosophers: Preserve these; drop others.*  

  | Distinction            | Must Preserve? | Why                                                                                                | How to Implement in Coding                                                                 |
  |------------------------|---------------|----------------------------------------------------------------------------------------------------|--------------------------------------------------------------------------------------------|
  | Report vs. Judgement   | **Yes**       | Reports are data; judgements are coder inferences.                                                 | Code only what was said (Step 3). Never add: "Subject must have felt...".                  |
  | Report vs. Disposition | **Drop**      | Dispositions (e.g., "would say X if asked") are not reports.                                       | Ignore hypotheticals; code only actual utterances.                                         |
  | Subject’s Authority    | **Yes**       | Subject owns *what they said*; not what it "really" means.                                         | Use their words (Step 3). Do not reinterpret (e.g., "pain" = "discomfort").                |
  | Subject’s World vs. Real World | **Yes** | Core to neutrality.                                                        | Step 4: "In the subject’s world..." – never merge with experimenter’s knowledge.          |
  | Sincerity vs. Accuracy | **Yes**       | A sincere report can be inaccurate; accuracy isn’t the coder’s job.                                | Tag sincerity (Step 5); ignore accuracy (e.g., stimulus was static, but subject reports movement). |

  ---

  ### **IV. Neutrality Audit**  
  *Coders must self-check for these biased phrasings/inferences. Replace as below.*  

  | Biased Phrasing/Inference          | Why Problematic                                  | Acceptable Replacement                     | Example                                                                 |
  |-----------------------------------|--------------------------------------------------|--------------------------------------------|-------------------------------------------------------------------------|
  | "Subject experienced X"           | Assumes experiences are real.                    | "Subject reports X" or "In subject’s world, X" | Biased: "Subject experienced pain." → Neutral: "Subject reports pain." |
  | "Subject was unaware of X"        | Assumes non-existent mental states.              | "Subject did not report X"                 | Biased: "Subject was unaware of the light." → Neutral: "Subject reported no light." |
  | "Subject imagined X"              | Implies unreality.                               | "Subject reports X" (if they say "imagined," code as-is) | Biased: "Subject imagined movement." → Neutral: "Subject reports imagining movement." |
  | "Subject misreported X"           | Judges accuracy; violates neutrality.            | "Subject reported X [note: stimulus was Y]" | Biased: "Subject misreported the color." → Neutral: "Subject reported red [note: stimulus was green]." |
  | "Subject confabulated X"          | Loaded term; implies deception.                  | "Subject reported X [possible confabulation: reason]" | Biased: "Subject confabulated a reason." → Neutral: "Subject reported a reason [possible confabulation: no item was present]." |
  | Inferring experiences from behavior | Behavior ≠ experience.                           | Only code explicit reports.                | Biased: (Silent trial) "Subject saw the light (since they pressed the button)." → Neutral: No verbal report; code only behavior. |

  ---

  ### **V. Adherence Check**  
  - **Self-Audit Checklist** (after coding each transcript):  
    1. Did I correct **only** transcription errors (Step 1)?  
    2. Did I paraphrase **literally** without adding/dropping meaning (Step 3)?  
    3. Did I use **"In the subject’s world"** format (Step 4)?  
    4. Did I avoid **all phrases in the Neutrality Audit table**?  
    5. Did I **flag conflicts** without resolving them (Step 7)?  
  - **Inter-Coder Reliability**:  
    - **Not just percentage agreement**: Use **triangulation auditing**.  
      1. Two coders code the same transcript independently.  
      2. A third auditor (blind to coder identity) checks both against the Neutrality Audit.  
      3. Disagreements are flagged for coordinator review.  
    - **Goal**: >90% unit agreement + 100% neutrality compliance.  

  ---

  ### **VI. Limitations and Judgement Calls**  
  - **Judgement Calls Dressed as Procedure**:  
    - **Segmentation (Step 2)**: Unit breaks can be subjective (e.g., run-on sentences). *When unsure, create smaller units.*  
    - **Sincerity (Step 5)**: Subjective cues (e.g., tone). *Default to `High` if no evidence of insincerity.*  
    - **Confabulation Flags (Step 7)**: "Physically impossible" is interpretable. *When in doubt, refer to coordinator.*  
  - **What This Protocol Cannot Do**:  
    - Resolve debates about consciousness. The coded record describes *beliefs*, not experiences.  
    - Handle reports with no behavioral/neural correlates (e.g., dreams). These get coded as-is.  
    - Guarantee perfect objectivity. Coders must vigilantly self-audit.  
  - **For Co-Investigators**: *This protocol treats reports as texts, not evidence for/against experiences. It cannot settle metaphysical questions—only make coding consistent.*  

  ---

  ### **VII. Protocol in Action: Case Examples**  
  *Raw Transcript → Step 1 (Verified) → Step 2 (Units) → Step 3 (Paraphrase) → Step 4 (Coded Record) → Steps 5–7 (Tags/Flags)*  

  #### **Case (a): Apparent Motion**  
  - **Stimulus**: Two stationary lights (red, green) flashed sequentially.  
  - **Report**: "I saw one spot that moved across the screen and changed from red to green halfway."  
  - **Coded Record**:  
    - **Step 1**: Verified transcript: "I saw one spot that moved across the screen and changed from red to green halfway."  
    - **Step 2**: Unit 1: "I saw one spot that moved across the screen."  
      Unit 2: "and changed from red to green halfway."  
    - **Step 3**: Paraphrase 1: "Subject reports one spot moving across the screen."  
      Paraphrase 2: "Subject reports the spot changing color from red to green halfway."  
    - **Step 4**: Coded Record:  
      - Unit 1: In the subject’s world, one spot moved across the screen.  
      - Unit 2: In the subject’s world, the spot changed color from red to green halfway.  
    - **Step 5**: Sincerity: High (clear statement). Confidence: High (no qualifiers).  
    - **Step 6**: Non-verbal data: "Behavioral: Subject pressed ‘moving’ button. Neural: MT+ activation."  
      *No conflict flag (report matches behavior).*  
    - **Step 7**: No referral.  

  #### **Case (b): Visual Field Defect (Denial of Sight)**  
  - **Stimulus**: Gabor patch in blind field; subject denies seeing it but localizes at 80% accuracy.  
  - **Report**: "I didn’t see anything there."  
  - **Coded Record**:  
    - **Step 1**: Verified transcript: "I didn’t see anything there."  
    - **Step 2**: Unit 1: "I didn’t see anything there."  
    - **Step 3**: Paraphrase: "Subject reports not seeing anything in that location."  
    - **Step 4**: Coded Record:  
      - Unit 1: In the subject’s world, nothing was seen in the specified location.  
    - **Step 5**: Sincerity: High (consistent across trials). Confidence: High.  
    - **Step 6**: Non-verbal data: "Behavioral: Subject localized stimulus with 80% accuracy. Neural: V1 activation."  
      **Conflict Flag**: *Note: Subject reported no sight, but behavioral data shows above-chance localization.*  
    - **Step 7**: No confabulation flag (report is physically possible). No referral.  

  #### **Case (c): Choice Blindness**  
  - **Stimulus**: Subject chose item A; experimenter swapped to B. Subject explains choice of B.  
  - **Report**: "I chose this one because it’s more elegant and the color is better."  
  - **Coded Record**:  
    - **Step 1**: Verified transcript: "I chose this one because it’s more elegant and the color is better."  
    - **Step 2**: Unit 1: "I chose this one."  
      Unit 2: "because it’s more elegant."  
      Unit 3: "and the color is better."  
    - **Step 3**: Paraphrase 1: "Subject reports choosing this item."  
      Paraphrase 2: "Subject reports it is more elegant."  
      Paraphrase 3: "Subject reports the color is better."  
    - **Step 4**: Coded Record:  
      - Unit 1: In the subject’s world, they chose the item in front of them.  
      - Unit 2: In the subject’s world, the item was more elegant.  
      - Unit 3: In the subject’s world, the color was better.  
    - **Step 5**: Sincerity: High (fluent). Confidence: High.  
    - **Step 6**: Non-verbal data: "Behavioral: Initial choice was Item A; shown Item B."  
      **Conflict Flag**: *Note: Subject reports choosing Item B, but initial choice was Item A.*  
    - **Step 7**: No confabulation flag (report not impossible). No referral.  

  #### **Additional Case: The Unreportable Blindsight**  
  - **Stimulus**: Subject with blindsight; motion stimulus in blind field.  
  - **Report**: "I saw nothing."  
  - **Behavioral**: 75% accuracy in motion discrimination task.  
  - **Neural**: Strong MT activation.  
  - **Coded Record**:  
    - **Step 1**: Verified transcript: "I saw nothing."  
    - **Step 2**: Unit 1: "I saw nothing."  
    - **Step 3**: Paraphrase: "Subject reports seeing nothing."  
    - **Step 4**: Coded Record:  
      - Unit 1: In the subject’s world, nothing was seen.  
    - **Step 5**: Sincerity: High. Confidence: High.  
    - **Step 6**: Non-verbal data: "Behavioral: 75% accuracy on motion task. Neural: MT activation."  
      **Conflict Flag**: *Note: Subject reported no sight, but behavioral/neural data shows motion processing.*  
    - **Step 7**: No confabulation flag. No referral.  
  - **Why Unwelcome?** The protocol cannot code "unconscious experience" or "partial awareness." The record only shows *the subject’s belief* of "nothing seen."  
  - **Who Objects?** The **realist co-investigator** (holds experiences are real) will argue: "The data proves unreportable experience exists, but the protocol erases it." The deflationist will accept the record.  
  - **Consequence**: The study cannot make claims about "awareness" here—only about reports and behavior.  

  ---

  ### **VIII. Addressing the Standing Objection**  
  **Objection**: "Heterophenomenology isn’t neutral. Bracketing the reality of experiences sides with deflationism, as realists deny bracketing is possible."  

  - **Where It Bites**: Step 4 (Reconstruction). Using "in the subject’s world" instead of "the subject experienced" feels deflationist to realists.  
  - **Response**:  
    - **Reinterpret Neutrality**: It is a **vocabulary constraint**, not an ontological claim. The protocol avoids terms like "experience" or "illusion" to *prevent coders* from imposing their metaphysics. The coded record is silent on ontology.  
    - **To the Realist Co-Investigator**: "This doesn’t deny experiences exist. It treats reports as *behavior* to ensure coders don’t assume infallibility. Your analysis can still argue reports reflect real experiences."  
    - **To the Deflationist Co-Investigator**: "This doesn’t assume experiences exist. Reports are texts, consistent with your view."  
  - **Protocol Adjustment**: If pressure mounts, reframe Step 4 as: "Code what the subject *takes to be real*," but retain "in the subject’s world" for clarity.  

  ---

  ### **IX. Summary Card for Coders**  
  *(One page; keep at desk)*  

  **HETEROPHENOMENOLOGICAL CODING PROTOCOL**  
  **Core Principle**: Code the subject’s world *as they report it*. Stay neutral.  

  **Steps**:  
  1. **Verify Transcript** (Match audio exactly).  
  2. **Segment** (Break into single-claim units).  
  3. **Paraphrase Literally** (Use subject’s words; no interpretations).  
  4. **Reconstruct World** (Format: "In the subject’s world, [...]").  
  5. **Tag Sincerity/Confidence** (High/Med/Low based on cues).  
  6. **Add Non-Verbal Data** (Record separately; flag conflicts).  
  7. **Handle Conflicts** (Log incompatibles; flag confabulation only if impossible + no data; refer if stuck).  

  **Neutrality Audit – NEVER USE**:  
  - ❌ "Subject experienced..." → ✅ "Subject reports..."  
  - ❌ "Subject was unaware..." → ✅ "Subject did not report..."  
  - ❌ "Subject misreported..." → ✅ "Subject reported X [note: stimulus was Y]".  

  **Self-Check After Coding**:  
  - Did I avoid adding/judging?  
  - Did I use "In the subject’s world"?  
  - Did I flag conflicts without fixing?  
  - Did I pass the Neutrality Audit?  

  **Refer to Coordinator When**:  
  - Sincerity is Low + conflict.  
  - Ambiguous metaphors.  
  - You want to override a report.  

  **Remember**: You code *beliefs*, not experiences. Philosophy stays out of the lab.  

