  For the disagreements table, I'll outline both positions clearly. The "Defect View" argues moral testimony is uniquely defective for reasons like loss of moral agency or understanding. The "Parity View" maintains it's epistemically on par with non-moral testimony. I'll ensure both sides would recognize their positions accurately here.

  The cruxes section is where I predict how each side would view specific scenarios. Crux 1 examines whether moral testimony transmits understanding - the Defect View says no, Parity View says possibly. Crux 2 focuses on the borrowing/outsourcing distinction applied to the cruelty case. Crux 3 tests whether outsourcing is ever permissible in moral matters. For each, I'll suggest test cases both sides would consider relevant.

