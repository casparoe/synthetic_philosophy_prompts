prompt: |-
  Taking a seminar on testimony this term and my reading group is split down the middle: half of us think there's something specifically defective about coming to hold your moral beliefs on someone else's say-so, and half of us think that's a philosopher's fantasy and moral testimony is just testimony like any other. Our prof made us produce the joint statement both sides could actually sign after a good-faith adversarial collaboration, and I drew the short straw. Draft it for me.

  I want the claims both camps can genuinely endorse — including on whether moral testimony transmits knowledge at all, because I think that's one place we've been arguing past each other, with one side hearing "knowledge" and the other hearing "understanding" — and then the residual disagreements worded so each side would happily sign its own row. Take seriously a distinction I threw out in section: whether you're *borrowing* a moral judgment (taking it now, holding it provisionally, intending to work out the reasons later) versus *outsourcing* it (handing the question over for good). Then run a concrete case through both views: someone who's told by a person they deeply trust that a thing they said was cruel, accepts it without argument, and can't for the life of them see why. Does borrowing-vs-outsourcing predict different verdicts about that person, and is that a real crux both sides accept or just a redescription?

  For each crux you land on, name a case or line of argument both sides would agree bears on it, and write each side's prediction down in advance. Flag anything you think is really only a verbal dispute, and say which part. Don't adjudicate — I want a document both camps could put their names to, not a verdict. Format: numbered agreed-claims section, then a disagreements table, then cruxes with predictions.
