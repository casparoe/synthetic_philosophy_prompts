  ### The Dialogue  

  **Setting:** A hotel bar after a decision theory workshop. A jar with 100 tokens—25 red, 75 either black or white in an unknown proportion—sits on the counter. A bookie nearby offers bets on a single draw. Nadia and Owen, drinks in hand, resume an argument.  

  ---

  **Owen:** (Taps the jar) Look, I’ll lay it out clean. If the bookie offers $100 on *red* versus $100 on *black*, I take red. No hesitation.  
  **Nadia:** Obviously. You know red’s 25%.  
  **Owen:** But if it’s $100 on *red-or-white* versus $100 on *black-or-white*? I take black-or-white. Every time.  
  **Nadia:** (Leans forward) Hold on. So: red over black, and black-or-white over red-or-white.  
  **Owen:** Exactly.  
  **Nadia:** And you don’t see a problem? Let’s freeze "white" for a second. When white *isn’t* drawn, betting on red-or-white collapses to betting on red. Betting on black-or-white collapses to betting on black. And on white? Both bets pay $100, so they’re identical.  
  **Owen:** Sure. Your point?  
  **Nadia:** The *point* is the sure-thing principle. If you prefer red to black when white isn’t drawn, and you’re indifferent when it is, you *must* prefer red-or-white to black-or-white. But you don’t. You do the opposite.  
  **Owen:** (Sips his drink) Right, and the principle assumes I can conditionally compare acts when "white isn’t drawn" happens. But I *can’t*. Conditioning on "not white" means I’m staring at a sub-problem—red versus black—with no measure of likelihood between them. My ignorance isn’t just about the *world*; it’s about how to *think* when the only events I can condition on are ones I have no prior over. The principle demands I treat "not white" like a known coin toss. It isn’t.  

  ---

  **Nadia:** Fine, but let’s see how that holds up when money’s moving. (Turns to the bookie) Suppose Owen owns a bet paying $100 if black-or-white. I offer him $73 to sell it back.  
  **Owen:** I value that bet at $75 worst-case. I’d sell for $73? No.  
  **Nadia:** Okay, $74.50.  
  **Owen:** Still no. Min is $75.  
  **Nadia:** (Smirks) $75.01 then.  
  **Owen:** Sold.  
  **Nadia:** Now, I sell him a bet on red-or-white. I charge $24.99.  
  **Owen:** I value it at $25 worst-case. So yes, I buy it.  
  **Nadia:** Now your net: you sold black-or-white for $75.01, bought red-or-white for $24.99, so you’re up $50.02. But your bets? You have red-or-white. If red or white comes up, you get $100. If black, you get nothing.  
  **Owen:** I’m tracking.  
  **Nadia:** But if you’d kept black-or-white, you’d get $100 unless red came up. So in the red state, you’re *worse off* by $100. In black or white, you break even. Net, you’re down $100 if red’s drawn.  
  **Owen:** (Waves a hand) You’re assuming I’d re-maximize from scratch at each trade, ignoring that when I sell black-or-white, I update my *set* of priors. I don’t just fix a worst-case and bolt.  
  **Nadia:** So dynamic consistency is... optional?  
  **Owen:** No. But if my set of priors is *rectangular*—closed under pasting conditionals—then updating and re-maximizing align. I avoid the pump.  
  **Nadia:** At what cost? Rectangularity forces you to treat every event like it’s always been on the table, even when you learn it’s not happening. To avoid my money pump, you have to assume learning "not white" tells you *nothing* about black versus white. That’s not cheaper than dumping the sure-thing principle. It’s *more* restrictive.  

  ---

  **Nadia:** Back to the jar. If your set is the whole simplex—black proportion anywhere from 0 to 75%—then a $100 bet on black is worth $0 worst-case. You wouldn’t pay a penny for it. That’s not *aversion*; it’s paralysis.  
  **Owen:** I don’t use the whole simplex. My set’s symmetric: black proportion between 20% and 55%, white between 20% and 55%.  
  **Nadia:** Why?  
  **Owen:** Because ambiguity’s about *uncertainty*, not total ignorance. I’m anchoring on symmetry and a plausible range.  
  **Nadia:** "Plausible" is doing heavy lifting.  
  **Owen:** Then for the $100-on-black bet, my min expected utility is 20%. Reservation price: $20. For $100 on red? 25%. Price: $25.  
  **Nadia:** (Calculates) 20% of $100 is $20, yes. But why 20% floor? Why not 10% or 30%?  
  **Owen:** I want a set that reflects no data but avoids collapse. If I *had* evidence—say, the bartender muttered "mostly black"—I’d skew it. But here, symmetry’s defensible.  
  **Nadia:** Defensible? It looks ad hoc. What evidence *could* tighten it?  
  **Owen:** Observing draws, partial disclosure... but that’s not the point. The point is, with this set, I *act*. I’m not inert.  

  ---

  **Nadia:** (Pauses) I’ll grant you this: if I’m forced to choose between your symmetry and my single prior, your way handles the jar more honestly. But it’s a patch.  
  **Owen:** And I’ll grant *you* this: if rectangularity is the price for consistency, maybe your Savagean machinery is cheaper. But I’m not paying that price today. (Raises his glass) Next round?  
  **Nadia:** (Nods) Make it a double. I’m not done yet.  

