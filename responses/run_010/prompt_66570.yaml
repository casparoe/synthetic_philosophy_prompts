prompt: |-
  I lead the appraisal team in a national infrastructure ministry. Roughly ten times a quarter we assess projects whose consequences run fifty to five hundred years out — coastal flood defences, a geological repository for long-lived radioactive waste, large-scale peatland restoration — and our recommendation decides whether several hundred million in public money is committed. Our standing guidance is discounted net benefit, and it has two failures we can no longer defend. First, it treats a harm as cancelled when the people who bear it would not have existed at all without the project. Second, it takes any forecast of future wellbeing at face value, so a population that has adapted to a depleted environment scores as doing fine. A parliamentary committee has asked us to show that we are not treating future people as residual claimants, and the chief economist who signs off wants to see, step by step, where a judgement about value is being made in place of a calculation.

  Write the procedure my analysts should run: the questions to ask in order, what counts as an adequate answer to each, which thresholds are floors that cannot be traded away against aggregate benefit, how to treat a harm whose bearers owe their existence to the project, what to do when the relevant quantity is a probability nobody can estimate, and the exact points at which the procedure stops and refers the matter to ministers because it is a question of value rather than fact. Assume the analyst has one day, an economics degree, and no philosophy.

  Then run it on three cases: the flood defence, whose construction emissions and deferred maintenance burden fall on unborn people; the waste repository, whose risk is small, late, and irreversible; and a cheap, high-return scheme whose only defect is a low-probability contamination of an aquifer that cannot be cleaned. One of these should come out against the project the ministry wants approved — say which, and say plainly what the procedure cannot decide at all.

  Close by identifying where this design is most likely to be wrong: which single objection, if correct, would force us to rebuild it on different lines.
reasoning: |-
  Okay, the user is leading an appraisal team in a national infrastructure ministry. They assess long-term projects like coastal defenses, radioactive waste repositories, and peatland restoration. Their current method is discounted net benefit, but it has two main flaws: it ignores harms to people who wouldn't exist without the project, and it accepts future well-being forecasts at face value, even if people adapt to worse conditions. A parliamentary committee wants assurance that future people aren't treated as residual claimants, and the chief economist wants clear steps where value judgments replace calculations.

  The user needs a new procedure for their analysts to follow. The analysts have economics degrees but no philosophy background. The procedure must address specific issues: how to handle harms to people whose existence depends on the project, how to deal with unquantifiable probabilities, and when to stop and refer decisions to ministers. They also want this procedure applied to three cases, with one resulting in rejection, and to identify the weakest point in the design.

  First, the core flaws in the current approach need fixing. The non-identity problem (harms to people who wouldn't exist otherwise) and adaptation paradox (counting adapted people as fine even in depleted environments) are key. The new procedure must avoid these by introducing thresholds for minimum welfare and irreversible harm. 

  For the procedure, it should be step-by-step, with clear questions. Each question needs defined adequate answers and thresholds that can't be traded off. Critical points are intergenerational equity thresholds (IETs) for essential resources and minimum welfare. Harm to future people who owe existence to the project should be considered if it violates these thresholds. Unquantifiable probabilities require a precautionary principle approach, like using a default high probability if experts can't estimate.

  The procedure must flag when decisions move from calculation to value judgment, referring those to ministers. Specifically, when setting IET levels, defining minimum welfare, or handling unquantifiable risks. 

  Applying this to the three cases:
  1. Flood Defenses: Construction emissions and deferred maintenance burden future generations. The emissions might be offsettable, but deferred maintenance could breach IET if it risks catastrophic failure. If maintenance costs are high and not budgeted, it might fail the threshold, requiring rejection or redesign.
  2. Waste Repository: Small, late, irreversible risk. If containment failure probability is unquantifiable, the precautionary principle applies. Default probability might breach IET, leading to rejection unless containment is near-perfect.
  3. Aquifer Contamination: Cheap, high-return but risks contaminating an irreplaceable aquifer. Even low probability, if contamination is irreversible and violates minimum welfare (no clean water), it breaches IET. Must reject despite high returns.

  The aquifer case should be rejected because the harm is irreversible and violates the minimum welfare threshold. The procedure can't decide on the exact IET levels or minimum welfare definitions—those are value judgments for ministers.

  The critical weakness is defining the minimum welfare threshold. If it's too vague, analysts can't apply it consistently. If the objection is that it's impossible to define objectively, the whole procedure might need restructuring around explicit societal values rather than thresholds.

  I need to ensure the procedure is practical for analysts with one day and an econ background. Using tools like resource equivalents and default probabilities makes it operational without philosophy. The referral points are crucial to separate technical analysis from policy decisions. Highlighting the aquifer case rejection shows the procedure's rigor. Identifying the minimum welfare definition as the weakest point addresses potential criticism about subjectivity.
answer: |-
  Below is a step-by-step appraisal procedure designed to address intergenerational equity, non-identity problems, and unquantifiable risks. It prioritizes explicit value judgments and defines referral points to ministers. Analysts should follow this sequence strictly within a one-day timeframe.

  ---

  ### **Appraisal Procedure for Long-Term Projects**  
  *(Key: IET = Intergenerational Equity Threshold; non-tradable floors)*

  1.  **Question 1: Does the project create irreversible depletion or degradation of a critical resource?**  
      *   *Critical resources*: Breathable air, freshwater, stable climate, fertile topsoil, biodiversity (>75% baseline), irreplaceable cultural heritage.  
      *   *Adequate answer*: Quantify the resource loss (e.g., "permanent loss of X km² of aquifer recharge zone"). If irreversible loss occurs, proceed to Q1a.  
      *   **Q1a: Does loss breach the IET for this resource?**  
          *   *IET Definition*: Loss must not reduce the resource below the level needed to support **minimum welfare** for future populations (defined as: no famine, preventable epidemic, or forced mass migration due to the loss).  
          *   *Threshold*: **Any breach of IET is a fatal flaw.** Project rejected.  
      *   *Referral Point*: Defining "minimum welfare" for a specific resource is a value judgment. If no existing policy definition exists, **STOP and refer to ministers**.

  2.  **Question 2: Does the project impose significant harms on future populations who would not exist without it?** (e.g., due to timing/location shifts)  
      *   *Adequate answer*: Identify the harm (e.g., "deferred maintenance costs," "exposure to residual contamination risk"). Do *not* discount existence itself as compensation.  
      *   *Threshold*: If the harm would breach an IET (per Q1a) **or** reduce projected well-being below the **minimum welfare line** for affected future people, it cannot be offset by aggregate benefits. Project rejected unless harm is fully mitigated.  
      *   *Referral Point*: Setting the absolute **minimum welfare line** (distinct from IET resource levels) is a value judgment. **STOP and refer to ministers** for its level (e.g., "Does 'minimum welfare' include access to natural landscapes?").

  3.  **Question 3: Are there catastrophic or irreversible risks with unquantifiable probabilities?**  
      *   *Adequate answer*: Specify the risk scenario (e.g., "repository containment failure," "aquifer contamination"). Solicit expert judgment: Can a credible probability be estimated?  
      *   *If probability cannot be estimated*:  
          *   Apply the **Precautionary Default**: Assume probability = **1 / (project lifespan in years)**. (e.g., 1/10,000 risk for a 10,000-year repository).  
          *   Model impacts using this default probability. If impacts breach IET or minimum welfare, treat as a fatal flaw.  
      *   *Threshold*: **Unmitigated catastrophic risk with Precautionary Default probability >0 is a fatal flaw** if impacts breach thresholds.  
      *   *Referral Point*: Choosing the **Precautionary Default formula** is a value judgment. **STOP and refer to ministers** if the default seems inappropriate (e.g., for risks beyond 10,000 years).

  4.  **Question 4: Does forecasted future "well-being" rely on adaptation to depleted conditions?**  
      *   *Adequate answer*: Identify metrics used (e.g., GDP, life satisfaction). Assess if they are *resource-sensitive* (e.g., "cost of water desalination," "healthcare spend offsetting pollution").  
      *   *Threshold*: **Discard welfare metrics insensitive to resource depletion.** Replace with:  
          *   **Resource Equivalents**: Quantify the additional resources needed for future people to achieve *current* welfare levels (e.g., "Future generation requires 2x energy input for same calorie intake due to soil depletion").  
          *   Treat this resource deficit as a **cost** in the net benefit calculation.  
      *   *Referral Point*: Selecting **which welfare metrics are invalid under adaptation** is a value judgment. **STOP and refer to ministers** if uncertainty exists.

  5.  **Final Net Benefit Calculation:**  
      *   Proceed only if **no fatal flaws** (IET breach, unmitigated threshold harm, default catastrophic risk) are found.  
      *   Use **Declining Discount Rate** (e.g., UK Green Book: 3.5% yrs 1-30, 3.0% yrs 31-75, 2.5% yrs 76-125, 1.5% yrs 126-200, 1.0% thereafter).  
      *   Include **Resource Equivalent costs** (from Q4).  
      *   *Recommendation*: Proceed if Discounted Net Benefit ≥0.

  ---

  ### **Application to Cases**

  1.  **Coastal Flood Defence**  
      *   *Construction emissions*: Assess if they breach climate stability IET (e.g., exceed carbon budget for 2°C). Likely not fatal alone.  
      *   *Deferred maintenance*: Key issue. If maintenance costs are high/unfunded and failure causes catastrophic flooding (breaching minimum welfare), **FAILS Q1a/IET**. Analysts must model default risk (Q3) if maintenance probability unquantifiable.  
      *   *Outcome*: **Reject** if maintenance burden/risk breaches thresholds. Value judgment: Defining "catastrophic" flooding impact.

  2.  **Geological Waste Repository**  
      *   *Risk*: "Small, late, irreversible." Apply Q3: If containment failure probability is unquantifiable >10,000 years, use Precautionary Default (e.g., 1/10,000).  
      *   *Impact*: Contamination likely breaches freshwater IET & minimum welfare.  
      *   *Outcome*: **Fatal flaw under Q3** unless probability can be credibly proven << default. **Reject** or demand redesign (e.g., 1,000-year retrievability). Value judgment: Acceptability of default probability.

  3.  **Cheap, High-Return Aquifer Scheme**  
      *   *Defect*: "Low-probability contamination of an irreplaceable aquifer."  
      *   Q1: Aquifer loss is irreversible. Q1a: Freshwater loss breaches IET (minimum welfare requires clean water).  
      *   Q3: Probability may be "low" but unquantifiable? Apply Precautionary Default. Even 0.001% risk of IET breach is unacceptable.  
      *   *Outcome*: **Fatal flaw under Q1a. Reject** despite high returns. Thresholds cannot be traded.  
      *   **This project is rejected.** The procedure cannot decide whether society should *ever* risk an irreplaceable aquifer – that’s a value judgment for ministers.

  ---

  ### **Critical Weakness: The Minimum Welfare Definition**  
  **The single objection that would force redesign:** If society cannot agree on an **objective, measurable minimum welfare standard** (e.g., is "access to biodiversity" essential?), the IET and harm thresholds become unanchored. Analysts would lack defensible criteria to override aggregate benefits, forcing arbitrary decisions or collapse back to pure discounting. Rebuilding would require participatory deliberation to define non-negotiable entitlements for *all* generations, ratified by parliament. Without this, the procedure’s ethical core fails.

  ---

  This procedure forces explicit trade-offs, protects future claimants from residual harm, and isolates value judgments for democratic accountability. It prioritizes survivability and equity over aggregate efficiency where thresholds are breached.
