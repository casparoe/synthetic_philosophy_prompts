answer: |-
  ### Joint Statement: Deflater-Flickerer Agreement on Mara Cases  

  **Shared Ground: Claims Both Endorse**  
  1. **Case Setup Validity**: Both versions of the Mara case (neural-trigger V1, behavioral-trigger V2) are coherent thought experiments designed to test PAP.  
  2. **Actual Sequence Intuition**: In both versions, when Mara signs *without intervention*, she is intuitively morally responsible for signing.  
  3. **PAP Requires Robustness**: PAP is falsified only if there is *no robust alternative possibility* (RAP) at the relevant time. A RAP must be:  
     - **Agential**: Accessible via the agent’s rational capacities (not sub-personal flukes).  
     - **Relevant**: Capable of leading to a different moral outcome (e.g., refraining).  
  4. **Threat of Determinism**: Determinism challenges responsibility by threatening both:  
     - *Leeway* (no RAPs) and *Sourcehood* (action not "ultimately" from the agent).  
  5. **Frankfurt’s Stated Goal**: A successful Frankfurt case must show responsibility *without* RAPs in the actual sequence.  
  6. **Manipulation Intuition**: If an intervener *causally overrides* agency (e.g., direct brain hijacking), responsibility is undermined.  

  ---

  ### Disagreements Table  
  *(Each row states the same dispute in both camps’ preferred phrasing)*  

  | **Disagreement Core**                                                                 | **Deflater’s View**                                                                                                | **Flickerer’s View**                                                                                             | **Concession Cost**                                                                 |  
  |---------------------------------------------------------------------------------------|--------------------------------------------------------------------------------------------------------------------|------------------------------------------------------------------------------------------------------------------|-------------------------------------------------------------------------------------|  
  | **Does V1 eliminate RAPs?**                                                           | V1 eliminates RAPs: Mara cannot refrain *after* the cluster fires (900ms pre-intention), and pre-firing "dithering" isn’t a *refraining-relevant* RAP. | V1 preserves RAPs: Mara can refrain *before* the cluster fires (e.g., by not deliberating). This pre-trigger moment is agential and RAP-compliant. | *Deflater*: Must accept PAP if pre-trigger RAPs count. *Flickerer*: Must abandon the dilemma’s first horn. |  
  | **Does V2 introduce manipulation?**                                                   | V2 is not manipulative: The trigger (drafting/deleting email) is Mara’s own action; the implant only *blocks* non-signing, not her signing. | V2 is manipulative: Keying intervention to Mara’s *agential struggle* makes it a coercive trap, undermining sourcehood even if unused. | *Deflater*: Must explain why coercion doesn’t apply. *Flickerer*: Must grant manipulation doesn’t always reduce responsibility. |  
  | **Does defeating PAP secure compatibilism?**                                          | If PAP fails, the *primary* incompatibilist argument (determinism→no RAPs→no responsibility) collapses; source concerns are addressable separately. | PAP’s failure is irrelevant: Responsibility requires sourcehood, not leeway. Compatibilism needs to fix *both*, so PAP debates are peripheral. | *Deflater*: Must defend source-compatibilism. *Flickerer*: Must show leeway is necessary for sourcehood. |  

  ---

  ### Cruxes: Testable Predictions  
  *Each crux includes an agreed-upon diagnostic and opposing predictions.*  

  1. **Crux: Timing of RAPs in V1**  
     - **Diagnostic**: At *t* (900ms pre-intention), could Mara have refrained *without triggering intervention*?  
       - *Deflater Prediction*: Subjects will judge no RAP exists at *t*—refraining is impossible post-trigger, and pre-trigger acts aren’t refraining-relevant.  
       - *Flickerer Prediction*: Subjects will judge pre-trigger refraining (e.g., abandoning deliberation) as a robust RAP satisfying PAP.  

  2. **Crux: V2’s Manipulation Intuition**  
     - **Diagnostic**: Compare responsibility ratings in V2 vs. a no-intervener case where Mara identically drafts/deletes then signs.  
       - *Deflater Prediction*: No responsibility difference; intervention is irrelevant if unused.  
       - *Flickerer Prediction*: Responsibility ratings drop in V2 due to "coercive shadow" of the trap.  

  3. **Crux: Sub-personal vs. Agential Triggers**  
     - **Diagnostic**: Rate responsibility in a *hybrid case*: The trigger is a non-agential neural event (V1), but Mara *knows* it could force her hand.  
       - *Deflater Prediction*: Responsibility unchanged—knowledge doesn’t restore RAPs.  
       - *Flickerer Prediction*: Responsibility decreases—awareness of external control undermines sourcehood.  

  ---

  ### Verbal Disputes: Where We’re Talking Past Each Other  
  1. **“Robust Alternative Possibility”**:  
     - *Deflater*: Focuses on **control** ("Could she *physically* have done otherwise at *t*?").  
     - *Flickerer*: Focuses on **agential capacities** ("Could she have exercised rational control to *avoid the outcome*?").  
     - **Resolution**: Specify whether PAP requires alternatives *at the moment of action* or *during preparatory agency*.  

  2. **“Could Have Done Otherwise”**:  
     - Ambiguity between:  
       - (a) **Metaphysical possibility** (open futures, pre-trigger).  
       - (b) **Agentive possibility** (capacity to refrain *at decision-time*).  
     - The Mara cases exploit this slippage: V1 challenges (b), V2 challenges (a).  

  **Conclusion**: The core substantive dispute is whether *any* Frankfurt case can simultaneously eliminate RAPs *without* invoking manipulation. V1 tests RAP-elimination; V2 tests manipulation-resistance. If both fail, the debate reverts to source-incompatibilism.  

  ---  
  *Document length: ~1.75 pages*
