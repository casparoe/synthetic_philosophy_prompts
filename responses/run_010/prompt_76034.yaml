prompt: |-
  I run a little self-study reading group (three of us, one's a postdoc in neuroscience) and last month we got stuck on epiphenomenalism, specifically the thing Chalmers calls the paradox of phenomenal judgment. My summary of it, tell me if I've mangled it: if experience really has no causal effects, then my typing out "the afterimage looks greenish-blue to me" was caused entirely by neurons, none of which were themselves caused by the experience. So either the physical machinery would have spat out the same words with no experience present at all — in which case it's a standing miracle that my reports keep coming out right — or the reports aren't actually right. And unlike most debunkings, the epiphenomenalist can't grab the second horn, since the whole case for taking experience seriously in the first place leans on how trustworthy those reports seem.

  Then one of us said "wait, that's literally Sharon Street's Darwinian dilemma with qualia swapped in for values" — evolution shaped our evaluative judgments for reproductive usefulness rather than truth, so a realist who insists the moral facts played no part in shaping them is left with the same inexplicable-correlation problem, and in both cases the defender's move is to point at correlation instead of causation: something else (neural states / fitness-relevant third factors) does the tracking. I've started calling that reply borrowed tracking, because the view keeps accurate reports by leaning on extra machinery that isn't the facts in question — for Chalmers, the psychophysical laws pairing experiences with brain states. So are these actually the same argument form, or is the resemblance superficial? My suspicion is there's a real asymmetry hiding underneath. The value realist's opponent is entitled to conclude "so our moral judgments are probably way off" — that's the debunking upshot, no self-refutation involved. But the epiphenomenalist is not entitled to conclude "so my reports about my own experience are probably way off," because that saws off the branch. There's also a granularity difference: I can apparently report a distinction inside a color gradient I was never trained on, which feels like far too much accuracy to be luck, whereas nobody thinks our moral intuitions are accurate at anything like that resolution. And borrowed tracking looks available in one case but not the other — Chalmers can invoke laws that reliably hook experience up to neural states, but what is the value realist's equivalent? There's no moral-psychophysical law, and if they posit a faculty that tracks moral truth they're back to saying the facts shaped the judgments, which is precisely what the evolutionary story denies.

  So: compare the two properly. Lay out whatever structure they genuinely share, then say exactly where the analogy breaks, and give me a verdict on which is the more damaging problem for its target, with reasons — I don't want a hedge. I'd especially like you to push on the borrowed tracking point: does invoking psychophysical laws actually dissolve the paradox of phenomenal judgmenmt, or does it just relocate the coincidence one level up, since we still have to ask why the laws would be arranged so that the experiences they produce line up with the reports a causally closed brain produces, when the experiences do nothing at all? And spell out whether the same maneuver is open to the value realist, and if not, what that tells us about whether the two arguments belong in the same family. Please skip the general tours of either debate — I've read the intros, it's the structural comparison I'm after.
reasoning: |-
  Okay, let me tackle this user's query. They're running a reading group and got stuck on Chalmers' paradox of phenomenal judgment versus Sharon Street's Darwinian dilemma. They want a deep structural comparison, especially on "borrowed tracking" and where the analogy breaks. 

  First, I need to confirm their summary is correct. They summarized Chalmers' paradox well: if experiences are epiphenomenal, reports about them are caused solely by neural states. This leads to either miraculous accuracy or systematic error, but denying accuracy undermines the basis for believing in qualia. Then they connect it to Street's argument: evolution shaped moral judgments for fitness, not truth, so moral realists face a similar inexplicable correlation if moral facts didn't influence judgment formation.

  The user suspects an asymmetry. I should validate that. The key differences are: self-refutation risk in the qualia case (denying report accuracy undermines the evidence for qualia), granularity of reports (color distinctions vs. moral intuitions), and availability of borrowed tracking. 

  For borrowed tracking, Chalmers invokes psychophysical laws linking brain states to experiences. But why do these laws align experiences with the reports? That seems coincidental. For moral realism, there's no equivalent mechanism. Third-factor theories try, but they're speculative and don't guarantee truth-tracking.

  The user wants a verdict on which problem is more damaging. I think the qualia paradox is worse. The self-refutation element traps epiphenomenalists: they can't deny report accuracy without losing their evidence. Moral realists can bite the bullet on some errors without total self-refutation. Also, the granularity issue makes the coincidence in qualia reports more implausible.

  I should structure the response: shared structure first, then break down the asymmetries, especially borrowed tracking. Conclude with the verdict clearly. Need to ensure it's precise and avoids hedging, as requested.
answer: |-
  Here’s a precise structural comparison, isolating shared logic and critical asymmetries, with a verdict on their relative force and the viability of "borrowed tracking" in each case.

  ### Shared Argument Structure (The Core Dilemma)
  1.  **Premise (Causal Irrelevance):** A class of facts (conscious experiences / objective moral truths) has no causal influence on the physical world or the formation of our judgments.
  2.  **Premise (Causal Explanation):** The formation of our judgments about these facts (phenomenal reports / moral intuitions) is fully causally explained by non-mysterious, non-tracking processes (neural mechanisms / evolutionary selection for fitness).
  3.  **Dilemma:** Given (1) & (2):
      *   **Horn A (Coincidence):** The accuracy and correlation of our judgments with the relevant facts would be a massive, unexplained coincidence ("standing miracle").
      *   **Horn B (Error):** Our judgments are systematically unreliable/inaccurate.
  4.  **Problem for Target View:** The target view (Epiphenomenalism / Moral Realism) cannot easily accept **Horn B** without undermining its own justification. Epiphenomenalism relies on the seeming accuracy of reports as evidence for qualia; Moral Realism relies on moral intuitions as prima facie evidence for moral facts. Grabbing **Horn A** seems implausibly coincidental.

  ### Where the Analogy Breaks (Critical Asymmetries)
  1.  **Self-Refutation Risk:**
      *   **Qualia:** Denying the accuracy of phenomenal reports (**Horn B**) is *self-refuting for the epiphenomenalist*. The *only evidence* for the existence of the very thing they posit (qualia) comes from these reports. If the reports are systematically wrong, there's no reason to believe qualia exist at all. They *must* grab **Horn A**.
      *   **Values:** Denying the accuracy of *all* moral intuitions (**Horn B**) is not self-refuting for the moral realist. They can argue some intuitions are reliable (e.g., core ones), others corrupted; or that reason can correct intuitions; or that realism explains *why* error occurs. While damaging, rejecting **Horn B** doesn't annihilate the evidence base *in the same logically fatal way*. They can try to mitigate **Horn A** or partially accept **Horn B**.
      *   **Asymmetry:** The Qualia Dilemma forces the defender into the logically more precarious position of *requiring* a massive coincidence (**Horn A**).

  2.  **Granularity & Scope of Accuracy:**
      *   **Qualia:** Reports demonstrate extreme, fine-grained accuracy about *private, immediate, and novel* subjective states ("This specific shade of teal on this gradient looks distinct from the adjacent one, despite no evolutionary history with it"). The "coincidence" required for **Horn A** involves *perfect alignment* of causally inert qualia with the complex, specific outputs of a causally closed neural reporting mechanism across countless unique instances. This seems astronomically improbable without *some* causal link.
      *   **Values:** Moral intuitions are acknowledged by realists to be often vague, conflicting, culturally variable, and plausibly shaped by fitness. Their "accuracy," if it exists, is presumed to be at a coarser level (e.g., recognizing basic wrongs) or requires significant rational refinement. The coincidence problem (**Horn A**) is less extreme – general alignment with fitness *might* correlate *somewhat* with truth via third factors, even if many specific intuitions are wrong.
      *   **Asymmetry:** The *degree* of inexplicable coincidence required to sustain **Horn A** is vastly greater for qualia due to the fineness and novelty of accurate reports.

  3.  **Borrowed Tracking: Mechanism & Justification:**
      *   **Qualia (Chalmers' Move):** Invokes *psychophysical laws* as the "borrowed tracker." These laws *directly* link specific neural states (N) to specific qualia (Q). The report (R) is caused by N. The accuracy of R about Q relies on the law N→Q holding. *However, this relocates the coincidence:* Why do the psychophysical laws happen to be arranged such that the Q produced by the N that causes R *just happens* to match the Q that R describes, *when Q itself plays no role in establishing this link or causing R?* The laws ensure correlation, but the *reason* for this specific, accurate correlation remains unexplained and apparently brute. It replaces one coincidence (Q magically matching R) with another (the laws magically ensuring Q matches what R, caused by N, would say about Q). It dissolves the *logical impossibility* of Q causing R, but the *explanatory burden* of the perfect alignment remains heavy.
      *   **Values (Third-Factor Strategies):** The realist attempts "borrowed tracking" by positing a *third factor* (T) – like well-being, social stability, or practical rationality – that both (a) causally influenced the evolution of our moral intuitions (via fitness) *and* (b) is constitutively linked to or reliably correlates with objective moral truth (M). The accuracy of intuitions (I) about M is "borrowed" from I tracking T, and T correlating with M. *Crucial Differences:*
          *   **No Necessitating Laws:** Unlike psychophysical laws (posited as fundamental and exceptionless), the link between T and M is *contingent and debatable*. Why *must* well-being, etc., correlate with moral truth? This requires substantive (and controversial) metaethical commitments (e.g., moral facts *are* facts about well-being).
          *   **No Guarantee of Accuracy:** Even if T correlates *somewhat* with M, evolution only shaped I to track T *for fitness*, not truth. This leaves massive room for error and distortion in specific intuitions. It might explain *general* alignment but struggles with *fine-grained* accuracy.
          *   **Circularity/Explanatory Gap:** Often, the property T is *itself* morally laden (e.g., "well-being" isn't a brute natural fact). Justifying why *this* T is the relevant tracker of moral truth often presupposes moral intuitions the argument seeks to debunk, or leaves the T-M link unexplained.
      *   **Asymmetry:** Psychophysical laws *can* provide a *mechanism* for reliable correlation in the qualia case, even if the *reason* for that specific correlation is brute. For values, "borrowed tracking" via third factors lacks an analogous *reliable mechanism*; the link (T-M) is speculative, contingent, non-fundamental, and provides weak correlation at best. **The value realist's borrowed tracking is far less robust and explanatorily satisfying than the epiphenomenalist's.**

  ### Verdict: Which Problem is More Damaging?
  **The Paradox of Phenomenal Judgment is the more damaging problem for its target (Epiphenomenalism) than the Darwinian Dilemma is for Moral Realism.**

  ### Reasons
  1.  **Inescapable Self-Refutation Risk:** The epiphenomenalist *must* embrace the massive coincidence (**Horn A**) because **Horn B** destroys the evidence for qualia. The moral realist has more room to maneuver around **Horn B** (e.g., partial error, rational correction) or offer weaker (though problematic) third-factor responses to mitigate **Horn A**.
  2.  **Intolerable Coincidence Burden:** The granularity and scope of accurate phenomenal reporting makes **Horn A** astronomically implausible. The correlation needed is perfect, specific, and extends to novel, evolutionarily irrelevant details. The moral coincidence, while significant, concerns coarser-grained, potentially fitness-linked intuitions.
  3.  **Borrowed Tracking's Limits:** While psychophysical laws relocate the coincidence problem for qualia, they *do* provide a *formal mechanism* for reliable correlation consistent with epiphenomenalism (even if brute). The value realist's borrowed tracking (third factors) lacks a comparably robust mechanism; the T-M link is inherently contestable, non-fundamental, and fails to ensure reliable fine-grained tracking. **The epiphenomenalist's borrowed tracking dissolves the *logical* paradox but leaves a deep *explanatory* mystery. The moral realist's borrowed tracking is fundamentally *weaker* – it struggles to dissolve even the logical force of the dilemma convincingly.**

  **In short:** Both arguments exploit the tension between causal irrelevance and reliable judgment. However, the qualia version traps its target in a logically tighter bind with a far greater coincidence burden, making it the more potent challenge. The epiphenomenalist's borrowed tracking offers a formal escape hatch at the cost of accepting a profound brute fact; the value realist lacks even that escape hatch, but the sheer implausibility of their required coincidence is lower, giving them slightly more room to resist the dilemma's full force.
