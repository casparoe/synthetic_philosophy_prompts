prompt: |-
  So I'm the token philosopher on our city's Automated Decision Systems Review Board — unpaid, meets monthly, mostly we rubber-stamp things. Not this one.

  The housing department uses a vendor score to rank applicants for the rental-assistance program, predicting whether someone will still be housed and current on thier share of the rent twelve months out. Two years ago the board renewed the tool subject to a condition somebody drafted in a hurry: the score has to be calibrated within race/ethnicity groups *and* it has to produce equal false-positive and equal true-positive rates across those groups — i.e. among people who would have done fine, equally often wrongly flagged as high risk, and among people who would have struggled, equally often correctly caught.

  The department's statistician has now come back and says the condition can't be met: given the actual base rates in the two largest groups, no score does both, and the ones that do are either perfect or worthless. Half the board hears 'the tool is racist, deny the renewal.' The other half hears 'it's just numbers, pick whichever criterion you prefer and stop dressing up a value choice as arithmetic.' Both reactions strike me as missing the point, and I have about nine days to fix that.

  Two wrinkles. The vendor has offered a fix: run the score at a strict and a lenient threshold, and for applicants who land in the band between them, assign strict-or-lenient by a logged coin flip whose bias is tuned so that both of our criteria come out satisfied in expectation over the year's cohort. They are very pleased with themselves. I haven't checked the arithmetic and I don't entirely trust them, but I also don't want to wave it away — and I keep flip-flopping between thinking it's a gimmick in a suit and thinking it's the most honest thing in the room, since when there isn't enough to go around and the ranking is contested, drawing lots has a long and respectable pedigree. The other wrinkle is our member from legal aid, who thinks the whole argument sits downstream of a prior problem: 'successful completion' partly measures whether you already had a stable rental history, so the model is trained to predict the very disadvantage the program exists to relieve, and no metric-juggling touches that.

  Could you draft the memo I'll circulate before the vote? I want a real bottom line — renew under the vendor's lottery, renew but pick one criterion and publish what you're trading away, deny and go back to a need-indexed queue, or send it back for retraining on a repaired label — plus reasoning that gets six non-technical people from here to there, and an implementation paragraph with dates. Two pages, bottom line up front.

  Three things I care about. First, get the logic right in plain language: exactly what is incompatible with what, and what the results do *not* show. I've had to say out loud more than once that they don't establish that fair prediction is impossible, and I'd rather the memo say it once, well. Second, actually interrogate the coin flip — does it deliver what the vendor claims, and is 'satisfied in expectation across a cohort' the same thing as not wronging the particular person who lost the draw? Its an open question for me, not a settled objection, so treat it as one. Third, don't bury the legal aid point in a footnote: if the label is contaminated, say what follows for the rest of the decision.

  No bibliography, nobody on this board reads one — argue it out instead. And be committed, I want something people can vote for, but close with a short section on what would change your mind: which consideration, if the statistician or the lawyer really pressed it, would move you to a different option, and where you think your own reasoning is most likely to break.
reasoning: |-
  We are drafting a memo for the Automated Decision Systems Review Board regarding a rental-assistance program scoring tool. The tool is up for renewal, but there is a condition requiring both calibration and equal false-positive and true-positive rates across race/ethnicity groups. The statistician says this is impossible given the base rates in the two largest groups. The board is split, and we must decide on a course of action.

  Key issues:
  1. **The Impossibility Result**: The condition requires both:
     - Calibration: Within each group, the predicted probability matches the actual outcome rate. So, for a given score, the same proportion of people in each group should actually succeed.
     - Equal False-Positive Rates (FPR) and Equal True-Positive Rates (TPR): This is "equal opportunity" in machine learning fairness. For the negative class (those who would succeed), the rate of being incorrectly flagged (false positive) should be equal. For the positive class (those who would struggle), the rate of being correctly caught (true positive) should be equal.

     The statistician says that, unless the base rates (the actual success rates) are the same in the two groups, it is mathematically impossible to satisfy both conditions at once (except in trivial cases). This is a known result in the fairness literature (e.g., from Kleinberg, Mullainathan, and Raghavan or Chouldechova). 

     However, note that the impossibility does not mean that fair prediction is impossible in general. It means that these particular fairness criteria cannot be simultaneously satisfied when base rates differ. There are other fairness definitions that might be achievable.

  2. **The Vendor's Proposal**: A randomized lottery for scores in a middle band (between a strict and a lenient threshold). The bias of the coin flip is tuned so that, in expectation over the entire cohort, both criteria are satisfied.

     We must check:
     - Does this achieve the conditions? 
       - Calibration: By randomizing, the vendor is effectively creating a new score that is a mixture. The calibration condition might be satisfied because the randomization is done in a way that adjusts the predicted probabilities to match the actual rates within groups.
       - Equal FPR and TPR: The randomization is designed to adjust the decision rates so that the FPR and TPR become equal across groups.

     However, note that the conditions are satisfied "in expectation" over the cohort. That means for the group as a whole, on average, but not necessarily for every individual. In particular, for an individual in the middle band, the decision is random. This might be seen as arbitrary from the perspective of that individual. But the vendor argues that when resources are scarce and the ranking is contested, a lottery is a fair way to allocate.

     Also, note: the original condition did not specify that the criteria must be met for every individual decision, but it probably intended the criteria to be met in the aggregate. The vendor's proposal meets the criteria in the aggregate (over the entire set of applicants in a year).

  3. **The Legal Aid Point**: The outcome being predicted ("successful completion") is partly determined by having a stable rental history, which might be exactly the disadvantage the program aims to help. This creates a risk of perpetuating existing inequalities. The model might be predicting the past rather than the future, or it might be capturing structural barriers that the program should be overcoming.

     This is a fundamental issue: if the label is flawed, then even if we satisfy fairness criteria, the model might be unfair in a broader sense.

  Options for the board:

  Option 1: Renew under the vendor's lottery.
  Option 2: Renew but pick one criterion (either calibration or equal opportunity) and explicitly acknowledge the trade-off.
  Option 3: Deny and revert to a need-indexed queue (non-predictive, based on need).
  Option 4: Send back for retraining on a repaired label (if possible).

  Bottom line up front: I recommend Option 4: send the model back for retraining with a repaired label, and in the interim, use Option 3 (a need-indexed queue) to avoid harm. However, if time does not permit, then Option 1 (the vendor's lottery) is a reasonable temporary measure, but only if the legal aid concern is addressed in the long run.

  Reasoning:

  - The legal aid point is critical: if the model is trained on a label that reflects past disadvantage, then the predictions are biased against those with historical barriers. This is a fundamental flaw that no fairness adjustment can fully fix. We must address the label.
  - The impossibility of satisfying both criteria is a mathematical fact. We cannot change that. But we can choose which fairness criterion to prioritize, or use a different approach. The lottery is a creative way to satisfy both in expectation, and it is honest about the uncertainty in the middle band. However, it introduces randomness which may be perceived as arbitrary for individuals. But in the context of scarce resources, lotteries are a known fair mechanism.
  - However, without fixing the label, even the lottery might be perpetuating unfairness. Therefore, the model should be retrained on a label that better reflects the program's goals. For example, perhaps we can define success in a way that accounts for the program's support? But note: the program exists to help people with unstable rental histories. We want to predict who, with the assistance, will achieve stability. The current label might be contaminated if it is influenced by factors that the program is meant to overcome.

  Implementation plan:

  - Immediate decision: Do not renew the current model without changes.
  - Instead, direct the housing department to work with the vendor and legal aid to redefine the outcome label to better capture the program's intent, avoiding the contamination of historical disadvantage. This might take time.
  - During retraining, we must suspend the current model. We can revert to a need-indexed queue (Option 3) for the next cycle.
  - If the retraining can be done quickly (within 6 months), we can then evaluate the new model. Otherwise, we might consider the lottery approach (Option 1) for the current model as a stopgap, but only after:
     a) Verifying the vendor's math that the lottery does achieve both criteria in expectation.
     b) Ensuring transparency: applicants in the middle band are informed about the lottery and its purpose.

  What would change my mind?

  - If the statistician can demonstrate that the base rates are actually equal (or close enough) in the two groups, then the impossibility might not hold. But they have already stated they are not.
  - If the legal aid point is overstated: if the outcome label is not contaminated by historical disadvantage (or if it is, but the model can be adjusted to account for it without retraining), then we might proceed with the lottery or another option. But I find this unlikely.
  - If the need-indexed queue is infeasible (e.g., due to volume or other constraints) and we must use a predictive model, then the lottery might be the best immediate option.

  Draft Memo:

  ---

  **MEMORANDUM**

  **TO**: Automated Decision Systems Review Board  
  **FROM**: [Your Name], Board Member (Philosopher)  
  **DATE**: [Current Date]  
  **SUBJECT**: Recommendation on Rental-Assistance Program Scoring Tool

  **Bottom Line**: I recommend that we **do not renew the current model** and instead direct the housing department to **retrain the model using a repaired outcome label** that avoids capturing pre-existing disadvantage. During retraining (for up to 6 months), we should revert to a **need-indexed queue**. If the housing department can demonstrate that the retraining is not feasible within 6 months, then we should consider the vendor's randomized lottery as a stopgap, but only after verifying the math and ensuring transparency. The current model, as it stands, should not be renewed.

  ### 1. The Problem with the Current Model

  The tool ranks applicants by predicting whether they will be housed and current on rent 12 months out. Two years ago, we required it to meet two fairness conditions:  
     a) **Calibration**: Within each racial/ethnic group, the score must reflect actual outcomes (e.g., a score of 70% should mean a 70% chance of success for anyone with that score, regardless of group).  
     b) **Equal False-Positive and True-Positive Rates**: Among those who would succeed, the rate of being wrongly flagged as high risk (false positive) must be equal across groups. Among those who would struggle, the rate of being correctly identified (true positive) must be equal.

  The statistician now reports that, because the actual success rates (base rates) differ between the two largest racial/ethnic groups, it is mathematically impossible to satisfy both conditions at the same time (unless the model is perfect or random). This is not a flaw in the tool; it is a fundamental limit of any prediction under these circumstances. **This does not mean that fair prediction is impossible.** It means we cannot have both of these specific notions of fairness at once when base rates differ. We must choose.

  ### 2. The Vendor's Proposal: A Randomized Lottery

  The vendor suggests using two thresholds (strict and lenient) and, for applicants in between, flipping a biased coin to decide. They claim this will satisfy both conditions "in expectation" over the entire year's cohort.

  - **Does it work?** Mathematically, it should. By introducing randomness in the middle, they are effectively creating a new decision rule that can balance the two fairness criteria in the aggregate. We should ask the statistician to verify the specific calculations.
    
  - **Is it fair?** For the cohort as a whole, it meets our conditions. But for an individual in the middle band, the decision is random. While this may seem arbitrary, lotteries are a traditional method for allocating scarce resources when distinctions are unclear. It is honest about the uncertainty.

  However, the lottery does not address a deeper issue.

  ### 3. The Core Flaw: The Outcome Label

  Our legal aid member points out that "successful completion" partly depends on having a stable rental history. This means the model is trained to predict the very disadvantage the program exists to relieve. If past barriers (like discrimination or poverty) have led to an unstable rental history, the model may see that as predictive of future failure, even though the program is meant to break that cycle. Thus, the model may be biased against those the program should help the most. **No adjustment to the scoring or decision process can fix this.** The label itself is contaminated.

  ### 4. Options and Recommendation

  We have four options:

  - **Option 1: Renew with the vendor's lottery.**  
    *Pros*: Meets both fairness conditions in the aggregate.  
    *Cons*: Does not fix the label problem; randomness may upset applicants.

  - **Option 2: Renew but pick one criterion (calibration or equal opportunity) and publish the trade-off.**  
    *Pros*: Transparent about the value choice.  
    *Cons*: Still uses the contaminated label; one group will bear a disproportionate burden of errors.

  - **Option 3: Deny and revert to a need-indexed queue.**  
    *Pros*: Avoids the predictive model's flaws; allocates by need (e.g., income, family size).  
    *Cons*: May not target resources as effectively.

  - **Option 4: Send back for retraining on a repaired label.**  
    *Pros*: Addresses the root cause by redefining "success" to avoid capturing pre-existing disadvantage.  
    *Cons*: Takes time; requires careful thought on a new label.

  **I recommend Option 4, with Option 3 as an interim measure.** We must fix the label. Until then, a need-indexed queue, while imperfect, avoids the unfairness of the current model. If retraining is not feasible within 6 months, we can revisit the lottery (Option 1) as a stopgap, but only after verifying the math and ensuring applicants are informed about the process.

  ### 5. Implementation Plan

  - **Vote:** Deny renewal of the current model.  
  - **Next steps:**  
    - Housing department, vendor, and legal aid must collaborate to redefine the outcome label within 60 days.  
    - Retrain and validate the model within 6 months.  
    - During retraining, use a need-indexed queue (starting [Date]).  
    - If retraining is delayed beyond 6 months, the vendor may propose the lottery approach for the current model, subject to board approval.  
    - The board will review the new model in [Month, Year].

  ### What Would Change My Mind?

  If the statistician can show that the base rates are in fact equal (which they have not), the impossibility would vanish. If the legal aid point is resolved (e.g., by showing the label isn't contaminated), we might proceed with the lottery. And if the need-indexed queue is unworkable, we might have to accept the lottery as a temporary solution. But the label issue remains paramount.

