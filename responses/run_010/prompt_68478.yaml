answer: |-
  **MEMORANDUM**  

  **TO**: Automated Decision Systems Review Board  
  **FROM**: [Your Name], Board Member (Philosopher)  
  **DATE**: [Current Date]  
  **SUBJECT**: Urgent Recommendation: Rental-Assistance Scoring Tool Renewal  

  ---

  ### **BOTTOM LINE**  
  **Deny renewal of the current scoring tool**. Revert immediately to a **need-indexed queue** (e.g., prioritizing income level, household size, or displacement risk) for rental assistance allocations. Simultaneously, require the housing department and vendor to **retrain the model using a repaired outcome label** within 6 months. The vendor’s randomized "coin flip" proposal is mathematically clever but ethically inadequate for individuals and fails to address the core flaw: the tool predicts the very disadvantage the program seeks to remedy.  

  ---

  ### **1. THE CORE PROBLEM: INCOMPATIBLE FAIRNESS CONDITIONS & CONTAMINATED DATA**  
  #### **The Impossible Trade-Off**  
  The tool’s fairness condition requires two statistical properties to hold simultaneously across racial/ethnic groups:  
  - **Calibration**: A score (e.g., "70% chance of success") must mean the same thing for all groups (e.g., 7 of 10 people with this score succeed, regardless of group).  
  - **Equal Error Rates**: Among those who *would* succeed without aid, all groups must have the same rate of false alarms ("false positives"). Among those who *would* struggle, all groups must have the same rate of correct predictions ("true positives").  

  **Why they conflict**: When the actual success rates ("base rates") differ between groups, these criteria *cannot* be met together—unless the tool is perfect or useless. For example:  
  - If Group A has a 90% true success rate and Group B has 60%, calibration demands the tool reflect this gap.  
  - But equal error rates would require the tool to "flag" strugglers at identical rates, even though Group B has more true strugglers.  

  **What this does NOT mean**:  
  - It does **not** mean "fair prediction is impossible."  
  - It means **these two specific definitions of fairness clash** when real-world disparities exist. Forcing both is like demanding a car be both fastest and safest—possible only in fantasy or if all cars are identical.  

  #### **The Legal Aid Point: A Poisoned Label**  
  The outcome predicted—"successful completion" (housed and rent-current at 12 months)—partly measures pre-existing stability (e.g., prior rental history). This creates a fatal flaw:  
  - The program exists to help people *overcome* instability, yet the tool is trained to **penalize applicants for having the disadvantage the program should relieve**.  
  - Example: A person with a prior eviction (due to job loss) may be flagged as "high risk," even if rental assistance would prevent recurrence. The tool mistakes structural barriers for individual risk.  

  **No statistical fix (calibration, error rates, or randomization) can resolve this**. A model predicting a contaminated outcome will perpetuate inequity.  

  ---

  ### **2. EVALUATING THE VENDOR’S "COIN FLIP" PROPOSAL**  
  The vendor suggests using two thresholds ("strict" and "lenient") and randomizing decisions in the middle band via a biased coin flip. They claim this satisfies both fairness conditions "in expectation" across the year’s cohort.  

  #### **Does It Work Mathematically?**  
  - **Yes, in theory**: Randomization can balance group-level statistics. By adjusting the coin’s bias, the vendor can "tune" false-positive and true-positive rates to equality across groups, while maintaining calibration.  
  - **But**: This only holds *on average* for the entire cohort. For any individual in the middle band, the decision is arbitrary—a literal lottery.  

  #### **Is It Ethically Adequate?**  
  - **For the cohort? Maybe**. If resources are scarce and no precise ranking is possible, lotteries can be fair *procedurally* (e.g., military drafts, school placements).  
  - **For the individual? No**. A person wrongly denied assistance by a coin flip suffers real harm (e.g., eviction). The vendor’s "in expectation" defense ignores this:  
    - *Analogy*: Flipping a coin to sentence someone to jail would satisfy "fair conviction rates across groups" but violate individual justice.  
  - **The bigger problem**: Randomization **does nothing** to fix the contaminated label. It simply launders bias through chance.  

  **Verdict**: The proposal is a sophisticated gimmick. It meets the letter of the condition but violates the spirit of fairness for individuals and entrenches the label’s bias.  

  ---

  ### **3. OPTIONS & RECOMMENDATION**  
  | Option | Pros | Cons |  
  |--------|------|------|  
  | **1. Renew with vendor’s lottery** | Satisfies conditions mathematically; vendor-approved. | Ignores individual fairness; entrenches biased label; sets risky precedent. |  
  | **2. Renew with one fairness criterion** | Transparent trade-off (e.g., prioritize calibration). | Still uses poisoned label; one group bears disproportionate harm (e.g., more false denials). |  
  | **3. Deny and revert to need-indexed queue** | Avoids biased predictions; allocates by need (e.g., poverty level); auditable. | May not optimize long-term outcomes; perceived as "less efficient." |  
  | **4. Retrain with repaired label** | Fixes root cause (e.g., predict "success *with assistance*"); enables truly fair modeling. | Requires time and resources; new validation needed. |  

  **Recommendation: COMBINE OPTIONS 3 AND 4**  
  1. **Deny renewal** of the current tool.  
  2. **Immediately implement a need-indexed queue** (Option 3).  
  3. **Mandate retraining with a repaired label** (Option 4):  
     - Work with legal aid to redefine "success" (e.g., "continued eligibility" or "engagement with support services").  
     - Ensure the new label measures the program’s impact, not pre-existing disadvantage.  
  4. **Re-evaluate in 6 months** with new fairness criteria (e.g., calibration *or* equal opportunity, but not both).  

  **Why this approach?**  
  - The queue is provably neutral while the tool is repaired.  
  - Retraining addresses the legal aid concern—the only path to legitimate predictions.  
  - It rejects "fairness-washing" statistical fixes that obscure harm.  

  ---

  ### **4. IMPLEMENTATION & TIMELINE**  
  - **By [Date + 7 days]**: Vote to deny renewal. Notify housing department.  
  - **By [Date + 14 days]**: Shift to need-indexed queue (e.g., prioritize income <30% AMI, households with children, or homeless status).  
  - **By [Date + 30 days]**: Convene housing department, vendor, legal aid, and statistician to agree on a repaired outcome label.  
  - **By [Date + 6 months]**: Retrain model, validate, and return to the board for approval.  
  - **Ongoing**: Publish quarterly reports on allocation demographics and outcomes.  

  ---

  ### **WHAT WOULD CHANGE MY MIND?**  
  1. **If the statistician proves base rates are equal**: If new data shows identical success rates across groups, the fairness conditions *could* coexist. (But this is unlikely, given past evidence.)  
  2. **If the legal aid concern is resolvable without retraining**: If "success" can be statistically adjusted for past disadvantage (e.g., using counterfactual models), the tool might be salvageable. (But I doubt it—labels define reality for algorithms.)  
  3. **If the queue causes measurable harm**: If the need-indexed system leads to worse outcomes (e.g., higher evictions), the vendor’s lottery becomes a temporary fallback. (Demand proof—not speculation.)  

  **Where my reasoning is most vulnerable**:  
  - I prioritize individual fairness over statistical elegance. If the board values group parity *at all costs*, the lottery becomes defensible.  
  - I assume a better label exists. If "success" cannot be repaired, the program may need fundamental redesign.  

  **Vote NO on renewal. Repair the foundation first**.  

  ---  
  **Attachments**: None  
  **CC**: Housing Department Director, Legal Aid Representative, Vendor Liaison
