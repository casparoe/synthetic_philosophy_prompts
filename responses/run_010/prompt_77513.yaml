  1. **Scientist 1 (Biological Species Concept):** Your criterion: "A species is a group of interbreeding natural populations that are reproductively isolated from other such groups." (Regulation 50 CFR 424.02(a)(1))
  2. **Scientist 2 (Phylogenetic Species Concept - monophyly):** Your criterion: "A species must form a monophyletic group (a clade) in the phylogeny." (Regulation 50 CFR 424.02(a)(2))
