  The handouts must fit on four printed pages total. We need:
  1. A one-page student briefing document with the case data, ambiguities included.
  2. Eight role cards (including committee scientists, chair, counsel, and one member who thinks the question is metaphysically malformed).
  3. A decision rule and record-of-decision form for the chair.
  4. A minute-by-minute timeline for the 110-minute block, including when to distribute the sealed envelope with the RADseq study twist.
