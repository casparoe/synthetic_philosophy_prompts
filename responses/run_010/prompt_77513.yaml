  ### Page 1: Student Briefing Document

  **Heading: Statutory Listing Committee - Case: Torrentotriton spp. in Sierra Verano**

  **Background:** 
  You are members of the Sierra Verano Wildlife Protection Authority, convened to determine the species status of stream-breeding salamanders in the genus Torrentotriton. The decision will affect legal protection under the Endangered Species Act of Sierra Verano. Four populations are known: North Ridge (NR), Middle Valley (MV), South Ridge (SR), and Lowland (LW). 

  **Data Summary:**
  - **NR and MV:** Contact zone ~2 km wide, 30 years of sampling. F1 hybrids common, few backcrosses; hybrids consistently rarer. Lab hybrid fertility: 60% vs. parental 90%.
  - **SR:** Isolated from MV by 40 km dry valley. mtDNA: SR nested within MV (making MV paraphyletic). Microsatellites: SR in distinct cluster (no intermediates). Morphology: 3/22 fixed differences. Courtship: one step difference. Calibration: in a neighboring genus, sympatric sister species pairs average 4 fixed differences.
  - **LW:** Separated from MV by river gorge. COI divergence: 7% (vs. NR/MV: 2%, MV/SR: 1%). Morphology: cryptic (0 fixed differences). Breeding: autumn (after first rains) vs. spring. One 1974 specimen (label lost) suspected as hybrid? (unconfirmed).
  - **Stakes:** 
    - Highway bypass threatens LW's only breeding seeps. If LW is listed, the permit is blocked. If not listed, automatic permit in 90 days.
    - If SR is split as new species, the petition must be refiled (2-year delay) because the 1911 type specimen is from MV.
