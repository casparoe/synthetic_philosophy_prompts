answer: |-
  Below is a complete, ready-to-print package for your mock committee activity. It fits on **four pages** (student-facing materials on pages 1–3; instructor notes on page 4). All ambiguities in the case data are preserved to force debate. 

  ---

  ### **Page 1: Student Briefing Document**  
  **Statutory Listing Committee: Torrentotriton spp. in Sierra Verano**  
  **Background:** You are the Sierra Verano Wildlife Protection Authority. Decide whether to list 1, 2, 3, or 4 species of stream-breeding salamander (*Torrentotriton*) under the Endangered Species Act. Populations: North Ridge (NR), Middle Valley (MV), South Ridge (SR), Lowland (LW). Produce one signed list by the end of this session. Stakes:  
  - A highway bypass will destroy LW’s breeding seeps unless LW is listed within 90 days.  
  - If SR is split as a new species, the petition must be refiled (2-year delay) because the 1911 type specimen is from MV.  
  - An NGO advocates lumping all populations into one species for stronger legal defense (NR alone is too abundant to qualify).  

  **Data:**  
  1. **NR & MV:** Hybridize in a 2-km contact zone (30 yrs). F1 hybrids common; backcrosses rare. Hybrid fertility: 60% (vs. 90% in parents).  
  2. **SR:** Isolated from MV by 40 km of dry valley. mtDNA: SR nested within MV (MV paraphyletic). Microsatellites: SR distinct (no intermediates). Morphology: 3/22 fixed differences. Courtship: 1-step difference. *Calibration*: Sympatric sister species in a related genus average 4 fixed differences.  
  3. **LW:** Separated from MV by river gorge. COI divergence: 7% (vs. NR/MV 2%, MV/SR 1%). Morphology: 0 fixed differences. Breeds in autumn (vs. spring). One 1974 specimen (label lost) may be a hybrid (unconfirmed).  
  4. **New evidence (sealed envelope):** Distributed mid-meeting.  

  ---

  ### **Page 2: Role Cards**  
  *(8 cards; print 2 columns × 4 rows)*  

  1. **Scientist 1 (BSC):** Your criterion: *“A species is groups of actually or potentially interbreeding populations reproductively isolated from others.”* (Reg 50 CFR 424.11a)  
  2. **Scientist 2 (PSC-monophyly):** Your criterion: *“A species must form an exclusive lineage (monophyletic group) in evolutionary history.”* (Reg 50 CFR 424.11b)  
  3. **Scientist 3 (PSC-diagnosability):** Your criterion: *“A species must be diagnosed by fixed character differences.”* (Reg 50 CFR 424.11c)  
  4. **Scientist 4 (Ecological):** Your criterion: *“A species must occupy a distinct adaptive niche (e.g., breeding time, habitat).”* (Reg 50 CFR 424.11d)  
  5. **Scientist 5 (Morphological):** Your criterion: *“A species must exhibit a distinct morphological gap versus others.”* (Reg 50 CFR 424.11e)  
  6. **Chair:** Facilitate debate fairly. Ensure a decision is made. You sign the final list. Break ties. *Do not advocate.*  
  7. **Counsel:** Ensure the decision is legally defensible. Focus on: *“Is the decision arbitrary, or based on scientific criteria in Reg 424?”* You do not vote on science.  
  8. **Skeptic:** You believe *“species” is a human construct, not a universal natural category*. Still, you must vote. Justify by asking: *“Which choice best serves conservation (e.g., preventing extinction)?”*  

  ---

  ### **Page 3: Decision Rule & Record-of-Decision Form**  
  **Decision Rule (Chair selects one at start):**  
  - **Option A (Plain majority):** Vote on 1/2/3/4 species; majority wins.  
  - **Option B (Two-criteria rule):** A split requires support from ≥2 scientific criteria.  

  **Record-of-Decision Form** (Chair completes and signs):  
  ```  
  We list the following Torrentotriton species for protection:  
  [ ] ONE species: Torrentotriton sierrae (includes NR, MV, SR, LW)  
  [ ] TWO species:  
      • Torrentotriton sierrae (includes ______ )  
      • Torrentotriton ______ (includes ______ )  
  [ ] THREE species:  
      • Torrentotriton ______ (includes ______ )  
      • Torrentotriton ______ (includes ______ )  
      • Torrentotriton ______ (includes ______ )  
  [ ] FOUR species (each population separate).  

  **Justification (cite criteria & evidence):**  
  _________  
  _________  
  **Signed:** ___________________ (Chair) | **Date:** ________  
  ```  

  ---

  ### **Page 4: Instructor Notes**  
  **Timeline (110 min total):**  
  - **0–5 min:** Distribute briefings/roles. Students read.  
  - **5–10 min:** Chair opens meeting, selects decision rule (suggest Option B to force concept engagement).  
  - **10–50 min:** Debate Part 1 (focus: NR/MV/SR). *Chair ensures all roles speak.*  
  - **50 min:** Distribute **sealed envelope:** *“RADseq study (in press): LW’s nuclear genome diverges from MV’s similarly to NR’s. The 7% mtDNA divergence is likely an ancient capture event. Autumn breeding in LW is fixed in common gardens.”*  
  - **50–90 min:** Debate Part 2 (focus: LW + new evidence). *Twist impact:*  
    - Breaks BSC (nuclear similarity suggests no isolation) and Morphological (cryptic) arguments.  
    - Untouched for Ecological (niche divergence) and PSC-diagnosability (if phenology counts).  
  - **90–100 min:** Vote → Chair writes list/justification.  
  - **100–110 min:** Debrief (questions below).  

  **Debrief Plan (10 min):**  
  1. What evidence was most contentious? Why?  
  2. **Reveal criteria sources:**  
     - Scientist 1: Mayr’s BSC  
     - Scientist 2: de Queiroz (monophyly)  
     - Scientist 3: Cracraft’s PSC (diagnosability)  
     - Scientist 4: Van Valen’s Ecological SC  
     - Scientist 5: Traditional Morphological SC  
  3. How did the RADseq twist break/strengthen arguments? (Asymmetry highlights real-world messiness.)  
  4. Skeptic: How did you vote? Why does “pragmatic conservation” still need a decision? (Link to Ereshefsky: Pluralism exists, but policy demands action.)  
  5. **Ghiselin/Hull tie-in:** *“If species are individuals (lineages), the committee isn’t defining ‘species’—it’s drawing boundaries. Where is this lineage’s boundary? Time (ancient capture)? Space (hybrid zone)? How does this shift the debate?”*  
  6. NGO lobbying: Corruption (ignoring science) or legitimate (conservation triage)? *Stress: Science informs policy; policy isn’t science.*  

  **Predictable Problems & Fixes:**  
  - **Biology majors dominate:** Assign them as Chair, Counsel, or Skeptic (roles that constrain data-dumping). If they hijack debate, say: *“Stick to your criterion—what does Reg 424.11_ require?”*  
  - **Retreat to ‘it’s all convention’:** Skeptic role preempts this. If class echoes it, ask: *“Would lumping SR doom LW? Does ‘convention’ erase real barriers (e.g., breeding time)?”*  
  - **Time short? (75-min cut):** Reduce initial debate to 25 min; post-envelope to 20 min; skip debrief (assign as reflection). Keep envelope at 50% mark.  
  - **Decision gridlock:** Chair breaks ties or forces Two-criteria rule.  

  **Honest Limitation:**  
  This activity risks implying species are *only* committee constructs. It cannot replicate how concepts track **natural discontinuities** (e.g., reproductive isolation as a real phenomenon). Mitigate by:  
  - Stressing in debrief that committees *apply* concepts to ambiguous cases, but concepts themselves stem from empirical patterns (e.g., Dobzhansky’s hybrids).  
  - Using Ghiselin/Hull: Boundaries are discovered (lineages), not invented (names).  

  --- 

  **Rationale for Key Choices:**  
  - **Two-criteria rule recommended:** Forces engagement with trade-offs (e.g., LW fails BSC but passes Ecological). Better than majority for exposing conflicts.  
  - **Skeptic role:** Framed around conservation pragmatism to avoid nihilism. Forces them to engage, not derail.  
  - **RADseq twist asymmetry:** LW’s nuclear data undermines mtDNA/classification arguments but leaves ecological/morphological roles intact—mirroring real data conflicts.  
  - **NGO debate:** Highlights science-policy tension without prescribing answers.  

  **Printing:** Pages 1–3 for students; page 4 for you. Run it as-is—no extra prep needed.
