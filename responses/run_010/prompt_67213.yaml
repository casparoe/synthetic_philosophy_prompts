  1. **Correct Armstrong on necessity**: Explicitly state his laws are contingent.  
  2. **Strengthen (c)**: Acknowledge Humean replies to explanation worries (e.g., laws explain via unification/projection).  
  3. **Refine (a)**: Clarify that natural properties constrain but don’t eliminate epistemic trade-offs in best-system selection.  

