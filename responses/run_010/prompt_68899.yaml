prompt: |-
  So I'm running a grad seminar session on promissory obligation next week and I've volunteered — nobody made me — to defend the Hume/Rawls practice view against the voluntarists. Trouble is I think the practice view is in worse shape than the standard objection suggests, and I'd rather land the strong version of the worry myself than get fobbed off with the easy answers in the room. Help me build it.

  Here's the setup I'll be using. Call it an orphan promise: you're alone with a friend who's dying, she makes you promise to burn the letters in her desk, she dies an hour later, and nobody else alive has any idea the promise was made. Six months on you find out the letters are of enormous scholarly interest and publishing them would make your career. Everyone named in them is dead too, so stipulate no feelings get hurt. Breaking the promise disappoints no expectation, defeats no reliance, and leaves nobody worse off — the only cost is, on the practice view, one more invisible dent in a social institution, which is exactly the kind of thing a practice theorist thinks they can tally up.

  The claim I want you to argue for isn't the stock "the practice view gets the wrong verdict here." It's this: every repair open to the practice theorist either fails extensionally or works only by conceding the voluntarist's central thesis — that what binds me is my own act of taking on an obligation, with the practice demoted to merely enabling or causal work. So take the two repairs I expect from my students and break both. First, the rule-utilitarian tally: my defection slightly weakens the institution, so it's still wrong. Second, the solitaire-chess reply: the practice is there whether or not anyone's watching, the rules of chess bind me in a game I play alone. For the first, show why the dent is either negligible in precisely the cases where intuition says the obligation is strongest, or has to be inflated until it stops being a fact about the practice and starts being a fact about this particular act. For the second, show why it still owes an answer to "what makes my invocation of the rule normatively loaded, rather than just a description of what I happen to be doing" — and note that the answer it gives is going to be about my intention, not the institution.

  Then as a coda tell me whether the collapse is a genuine reductio or just the discovery that practice views were voluntarism in a sociologists hat all along. Pick a side and say why, I want an actual commitment at the end rather than a both-sides shrug.

  Argument only please, no reading list or bibliography, I know the literature — I just want the moves, laid out tight enough that I could deliver them from a set of index cards.
reasoning: |-
  Okay, the user is preparing for a grad seminar on promissory obligation and needs to defend the Hume/Rawls practice view against voluntarists. They've set up an "orphan promise" scenario where breaking a promise has no external consequences, challenging the practice view. They want a strong argument showing that any repair by practice theorists either fails or concedes voluntarism.

  First, I need to address the two main repairs they expect. For the rule-utilitarian tally, I should argue that the institutional dent is negligible in orphan promises, where intuition says the obligation is strongest. If the practice theorist inflates the cost to make it significant, it becomes about the act itself, not the institution. This move secretly relies on the inherent wrong of promise-breaking, which is voluntarist.

  For the solitaire-chess analogy, the key is to point out that the rules of chess are normatively inert alone. What gives them force is the agent's intention to play by the rules. That intention is a personal commitment, which is voluntarist. The practice doesn't create the normativity; the individual's choice does.

  The coda requires taking a stance. The collapse isn't a reductio but reveals that practice views were always voluntarism in disguise. Practice theorists need individuals to internalize rules and commit to them, making the obligation personal. The sociological elements are just the context, not the source of normativity.

  I should ensure the argument is structured for index cards: concise points for each repair, then the coda. Emphasize that conceding to voluntarism is necessary in the orphan promise case. Highlight how both repairs fail extensionally or borrow voluntarist elements. Finally, assert that practice views depend on individual commitment, showing they're voluntarism with sociological dressing.
answer: |-
  Here's the tight argument against the practice view, targeting both repairs and ending with a commitment:

  **Core Problem:** The orphan promise isolates the *source* of obligation. Intuition says obligation persists. The practice view struggles to explain *why* without collapsing into voluntarism.

  ### 1. Smashing the Rule-Utilitarian Tally ("The Dent")
      *   **Claim:** Breaking causes a negligible, immeasurable "dent" weakening the institution, thus wrong.
      *   **Rebuttal A (Negligibility in Key Cases):**
          *   In orphan promises (OPs) – where *no one else knows* – the "dent" is vanishingly small. Its impact on general reliance or future promissory behavior is effectively zero.
          *   Yet, intuition says the obligation in an OP is *paradigmatically strong* (dying wish, sole witness). The practice view implies obligation *weakens* as the promise becomes more orphaned (fewer witnesses, less potential reliance), which is counterintuitive. Its wrongness hinges on publicity, not the act itself.
      *   **Rebuttal B (Inflation = Collapse):**
          *   To avoid (A), the practice theorist must inflate the "dent" beyond empirical institutional impact.
          *   They must argue: "Even an *undetectable* breach is *inherently* corrosive to the *very idea* of the practice" or "It violates the *internal point* of the rule."
          *   **Collapse Point:** This inflation abandons empirical social facts. Now the wrongness stems *directly* from violating the *normative concept* of promise-keeping itself ("inherent corrosion," "internal point"), irrespective of measurable social consequences. This is no longer about tallying institutional effects; it's about the *intrinsic normative force* of the promissory act *as such* – which is precisely the voluntarist claim. The "practice" becomes a phantom justification for an obligation grounded in the act's inherent meaning.

  ### 2. Smashing the Solitaire-Chess Analogy ("The Rules Bind Alone")
      *   **Claim:** Like chess rules binding in solitaire, promissory rules bind me *as part of the practice*, even alone.
      *   **The Fatal Question:** *What makes my invocation of the promissory rule* ***normatively binding*** *in isolation, rather than just a description of what I'm choosing to do?*
      *   **Practice Theorist's Answer (Forced Move):** They *must* say something like: "Because *you invoked the practice* when promising. You *intended* to create an obligation *using* the institution. You are now *committed* to playing by *its* rules."
      *   **Collapse Point:** This answer reveals the voluntarist core:
          1.  The **binding force** comes from *my own intentional act* of invoking/using the practice ("I chose to play chess").
          2.  The **content** of the obligation is defined by the practice ("...by chess rules").
          3.  The practice provides the *structure* and *meaning*, but the *normative engine* – what *binds me* to follow the rules *I invoked* – is *my own commitment*. The "practice" explains *what* I committed to, not *why* the commitment binds. The "why" is my voluntary undertaking. The practice theorist here functionally concedes that obligation originates in the individual's intentional act of undertaking, with the practice demoted to enabling background.

  ### Coda: Collapse, Not Reductio (It Was Always Voluntarism)
  *   **Commitment:** This isn't a *reductio ad absurdum* disproving the practice view. It's the *discovery* that coherent practice views *were always voluntarism wearing a sociologist's hat*.
  *   **Why:**
      *   The orphan promise forces practice theorists to locate the *source of normativity*. They *cannot* find it *solely* in observable social facts (tallies/dents) without absurdity (obligation vanishing with witnesses).
      *   They *must* appeal to the *agent's intentional participation* and *internal commitment* to the rules ("I invoked it, so I'm bound *by my own act*").
      *   This appeal to the promisor's *own act* as the source of bindingness *is* voluntarism. The "practice" merely provides the *conventional framework* within which that binding act occurs and acquires meaning. It's scaffolding, not the foundation. The foundation is individual will undertaking obligation.
  *   **The Hat:** The sociological hat (practice, institution, rules) is real – it explains the *conventional form and social function* of promises. But it doesn't explain the *source of the normative force* binding the individual in isolation. Peel back the hat, and voluntarism is underneath. The practice view, to survive the orphan promise, morphs into voluntarism plus sociology, not a genuine alternative.
