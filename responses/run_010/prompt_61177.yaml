  The strongest version for the dismissals the user described is the synchronic argument against non-probabilistic beliefs, but it fails against imprecise probabilities with spreads. The diachronic argument requires pre-commitment to enforce against non-conditionalizers. The version people likely have in mind uncritically is the pragmatic synchronic one, ignoring nuances like spreads or renegotiation.

