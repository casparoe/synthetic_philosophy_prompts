  ### Deliverable 1: "Which Side of the Argument Would You Be On in 1610?" Quiz  
  **Instructions:** Read each situation and choose the answer that best reflects how you would act or interpret it in 1610. Circle your choice.  

  1. **A patron wants a nativity for his newborn and pays well.**  
     a) Cast the chart fully, predicting character, health, and fate.  
     b) Cast the chart but focus only on health and temperament, avoiding fate or soul.  
     c) Refuse, calling it superstitious.  

  2. **A bright new star appears close on the heels of a great conjunction.**  
     a) Interpret it as a divine sign of upheaval (e.g., war, new rulers).  
     b) Study it for effects on weather, disease, or natural cycles.  
     c) Dismiss it as a distant curiosity with no earthly meaning.  

  3. **Two planets sit 72 degrees apart—an angle older authorities ignored—and nothing happens.**  
     a) Reject the angle; only traditional aspects (like 60° or 90°) matter.  
     b) Suspect the angle is real but subtle, needing more observation.  
     c) Defend the angle as part of a harmonic pattern, even if its effects are elusive.  

  4. **The town expects next year’s almanac, and your salary depends on it.**  
     a) Write it with event predictions (e.g., wars, deaths) using standard methods.  
     b) Write it but stick to weather, disease, and natural phenomena.  
     c) Refuse or avoid predictions, calling astrology unreliable.  

  5. **A comet turns up in November.**  
     a) Declare it a portent of disaster (e.g., a king’s death).  
     b) Link it to changes in air quality, leading to disease or foul weather.  
     c) Ignore it; comets are atmospheric flukes with no influence.  

  6. **A harvest fails after a heavy eclipse.**  
     a) Blame the eclipse for disrupting weather and causing the failure.  
     b) Call the eclipse a divine warning of the failure, not its cause.  
     c) Deny any connection; it’s coincidence.  

  7. **A patient’s humours swing with the Moon.**  
     a) Cite lunar influence on fluids, like tides or menstruation.  
     b) Attribute it to cosmic harmony, with the Moon as one player.  
     c) Dismiss it as old wives’ tales.  

  8. **You’re asked to choose an electional time for a wedding.**  
     a) Use houses, signs, and aspects to pick an auspicious time.  
     b) Use only planetary aspects (angles), ignoring houses and signs.  
     c) Refuse; human events aren’t ruled by stars.  

  9. **A prediction you made about a prince’s death fails.**  
     a) Admit a calculation error or missed factor.  
     b) Argue that stars suggest tendencies, not certainties.  
     c) Conclude astrology is bunk.  

  10. **Scripture says God set the stars for signs. You apply this by:**  
      a) Reading the sky for divine messages about events.  
      b) Limiting signs to seasons, weather, or broad patterns.  
      c) Calling it poetic, not a basis for prediction.  

