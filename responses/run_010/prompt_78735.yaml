     c) Write the almanac but avoid specific predictions, or refuse to write it.

  5. A comet turns up in November. What do you think?
     a) It presages disaster, such as the death of a prince or war.
     b) It may cause changes in the air, leading to disease or bad weather.
     c) It is a natural phenomenon with no influence on Earth.

  6. A harvest fails after a heavy eclipse. How do you relate the two?
     a) The eclipse caused the harvest failure by affecting the weather.
     b) The eclipse was a sign from God that the harvest would fail, but not the cause.
     c) The eclipse and harvest failure are coincidental.

  7. A patient's humours swing with the Moon. What is your view?
     a) The Moon directly influences the humours, as seen in tides and menstruation.
     b) The Moon's influence is part of a natural harmony that affects all living things.
