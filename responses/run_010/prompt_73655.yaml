  The three test cases are perfect for demonstrating nuance: 
  1) The railway-promoted festival shows template diffusion 
  2) The revived weaving technique illustrates substrate vs practice age 
  3) Their own "ancient national dress" will force institutional accountability

  I'll conclude by acknowledging procedural limits: it can't resolve whether invented traditions deserve recognition (that's inherently political), and written-record bias will always disadvantage oral cultures. The real win here is creating defensible, consistent evaluation criteria that protect the board's credibility.
answer: |-
  Here is a working procedure for your desk, grounded in Hobsbawm & Ranger and Anderson, designed for efficiency within your constraints.

  **Core Concepts Embedded:**
  1.  **Hobsbawm & Ranger:** Distinguishes *invented traditions* (imposed invariance, ritualization, fabricated continuity) from *customs* (adaptive, functional). Notes invention often clusters during social upheaval.
  2.  **Anderson:** Nations as *imagined communities* (legitimate but constructed). Highlights the role of *print capitalism*, *modularity* (replication of forms), and state apparatus (*census, map, museum*) in fixing national identity and heritage.

  **Procedure: Ordered Sequence of Tests**

  *(Target: ~60 minutes for initial assessment by editor; 30 mins for documentation/decision prep)*

  1.  **Test: State Apparatus & Fixing**
      *   **Question:** Is the practice/form *primarily documented or defined* in state inventories (census categories, protected status files), museum collections, or official published materials (guidebooks, rulebooks, scripts) *before* widespread popular attestation?
      *   **Sufficient Answer (Pass):** No clear evidence of state/museum codification preceding popular practice. Popular/folk attestation exists first.
      *   **Trigger (Insufficient/Flag):** Evidence the practice/form was *first* defined, codified, or widely disseminated via state decree, museum classification, published rulebook/script, or official inventory. *Triggers Label Consideration:* "Invented while claiming antiquity" or "Reconstructed". **Handoff if:** Significant political/social sensitivity around state role (e.g., colonial imposition).
      *   **Time Cost:** 10 mins (Check known inventories, museum archives, official publications).
      *   *Why first?* Anderson's apparatus is often the most concrete evidence trail. Easily verifiable. Early flags potential "top-down" invention/modularity.

  2.  **Test: First Attestation (Practice vs. Claim)**
      *   **Question:** What is the earliest *verifiable date/evidence of the practice itself*? What is the earliest *verifiable date/evidence of the claim* that this practice is ancient/continuous?
      *   **Sufficient Answer (Pass):** Clear evidence of the *practice* significantly predates (e.g., 50+ years) any widespread *claim* of its antiquity/continuity. Gap suggests organic development.
      *   **Trigger (Insufficient/Flag):** Gap is small or reversed (claim of antiquity appears *before* or simultaneously with evidence of the practice). Practice first attested recently (<100 yrs). *Triggers Label Consideration:* "Invented while claiming antiquity", "Reconstructed", or "Revived". **Handoff if:** Practice is old (>100 yrs) but claim of antiquity is *much* older and demonstrably false (legal minefield).
      *   **Time Cost:** 15 mins (Search archives, newspapers, scholarly works, local records). *Focus on finding the practice, not just the claim.*
      *   *Why second?* Builds on Test 1. Distinguishes the *thing* from the *narrative about the thing* (Hobsbawm's core). Concrete evidence point.

  3.  **Test: Modularity & Diffusion**
      *   **Question:** Does the specific form (ritual sequence, garment cut, festival structure, dish presentation) match a known template that emerged or was promoted in *unrelated regions* (or even other nations) within a short timeframe (e.g., 1-3 decades)?
      *   **Sufficient Answer (Pass):** Form appears unique to the region or evolves locally over long period without matching external templates from the same era.
      *   **Trigger (Insufficient/Flag):** Clear match to contemporaneous templates promoted elsewhere (e.g., via print, colonial admin, revival movements, railways/tourism). Suggests modular adoption, not unique ancient lineage. *Triggers Label Consideration:* "Invented while claiming antiquity" or "Reconstructed". **Handoff if:** Template diffusion is central to national identity narrative (e.g., "national" form).
      *   **Time Cost:** 10 mins (Check known revival patterns, colonial records, regional studies).
      *   *Why third?* Anderson's modularity. Flags potential "invention" moments and standardized forms imposed or adopted widely. Efficient test.

  4.  **Test: Invariance vs. Adaptation**
      *   **Question:** Is the practice claimed to be *invariant*? If yes, is there *evidence of actual change or adaptation* prior to its current codification/fixing? Conversely, if presented as adaptive, is the core function/identity stable?
      *   **Sufficient Answer (Pass):** Practice shows documented adaptation over time *or* is presented as adaptive/customary. Claimed invariance has evidence of prior evolution.
      *   **Trigger (Insufficient/Flag):** Claimed invariance but evidence shows significant recent change/standardization *or* no evidence of prior existence (making invariance a new imposition). Suggests potential invention (Hobsbawm's ritualized invariance). *Triggers Label Consideration:* "Invented while claiming antiquity", "Reconstructed". *Adaptive practices:* Label as "Continuous" or "Adapted". **Handoff if:** Disputed significance of adaptation (e.g., minor vs. major change).
      *   **Time Cost:** 10 mins (Compare historical descriptions, images, accounts).
      *   *Why fourth?* Tests Hobsbawm's key marker of invented tradition (imposed invariance). Contrasts with adaptive custom.

  5.  **Test: Community Scale & Catalyst**
      *   **Question:** What size/type of community does this practice ask people to imagine (local/village, regional, national)? Is there evidence its emergence/codification coincided with a period of significant social disruption (e.g., industrialization, urbanization, war, colonialism, state formation)?
      *   **Sufficient Answer (Pass):** Practice clearly linked to local/village community or emerged gradually without clear disruptive catalyst. **OR** National/regional scale acknowledged as constructed/modern, without false antiquity claim.
      *   **Trigger (Insufficient/Flag):** Practice asks audience to imagine a large (regional/national) community *and* its codification aligns with a documented period of social upheaval. *Triggers Label Consideration:* "Invented while claiming antiquity" (if antiquity claimed), "Invented without claiming antiquity" (if not). **Handoff if:** Always, due to interpretive nature. This test provides context *for* the committee regarding Anderson (imagined scale) and Hobsbawm (invention during rupture).
      *   **Time Cost:** 10 mins (Basic historical context check).
      *   *Why fifth?* Interpretation-heavy. Provides crucial context for committee decision on value/policy, linking to core theories. Doesn't usually "fail" an application on its own for listing, but informs labeling and committee briefing.

  6.  **Test: Oral/Dispossessed Communities - Benefit of the Doubt**
      *   **Question:** (Triggered ONLY if application is from a historically marginalized/dispossessed group with strong oral tradition and likely absence of written records). Does the community assert deep roots? Is the practice integral to current identity? Is there *any* corroborating evidence (archaeology, linguistics, early traveler accounts, continuity of function)?
      *   **Sufficient Answer (Pass):** Community assertion + integral current role + *some* plausible corroborating evidence (even if indirect) OR no evidence *against* continuity. *Label*: "Continuous" or "Adapted" (depending on evidence of change).
      *   **Trigger (Insufficient/Flag):** Contradictory evidence suggesting very recent origin *outside* the community. *Triggers Label Consideration:* "Revived" or "Reconstructed" (if community effort), potentially "Invented while claiming antiquity" (if external imposition). **Handoff if:** Contradictory evidence exists OR significant sensitivity. **CRITICAL RULE:** Absence of documentation alone is **NOT** evidence of invention for these cases. Default to community assertion unless strong contradictory evidence.
      *   **Time Cost:** 15 mins (Focused search for *any* corroboration; consult anthropologist if on staff/time, otherwise note limitations).
      *   *Why last?* Specific case requiring different standards. High time cost. Avoids penalizing lack of state/written records.

  **Short-Circuiting:** An application can be approved for committee with minimal checks (5 mins) if:
  *   It makes **no claim** to great antiquity or invariance (label as "Contemporary" or "Adapted").
  *   It openly acknowledges a recent origin or revival (label as "Revived" or "Invented without claiming antiquity").
  *   Overwhelming, uncontested evidence confirms both great age *and* continuity (label as "Continuous").

  **Label Vocabulary & Listing Rules:**

  | Label                  | Meaning (For Internal Use & Public Wording)                                                                                                                                 | May Be Listed? | Public Wording (Examples)                                                                                                |
  | :-------------------- | :-------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :------------- | :----------------------------------------------------------------------------------------------------------------------- |
  | **Continuous**        | Practice has existed in recognizably similar form, with core function/identity, for a very long time (e.g., 150+ years), with evidence of gradual adaptation.              | Yes            | "A long-standing tradition...", "Centuries-old practice...", "Deeply rooted in local history..."                         |
  | **Adapted**           | Core practice has historical roots, but its form or context has demonstrably evolved significantly over time to meet changing needs.                                       | Yes            | "Evolving over generations...", "Drawing on historic roots, today's...", "A tradition adapted for modern times..."       |
  | **Revived**           | A historical practice that died out or faded significantly and was deliberately restarted based on research/memory. Does not falsely claim unbroken continuity.            | Yes            | "Revived for today...", "Celebrating a renewed...", "Inspired by historic..."                                            |
  | **Reconstructed**     | A practice recreated based on historical evidence where direct continuity is broken or unclear. May involve interpretation. Does not falsely claim unbroken continuity. | Yes            | "Reconstructed based on historical evidence...", "Recreating the spirit of...", "A modern interpretation of..."          |
  | **Invented while claiming antiquity** | A relatively recent practice (typically <150 yrs) explicitly or implicitly presented as ancient/unbroken. Characterized by imposed invariance, often modular.            | **NO**         | **Not listed.** Use approved templates below focusing on *current* form/meaning.                                         |
  | **Invented without claiming antiquity** | A recent practice acknowledged as new or significantly reshaped, serving a community-building or functional role without false historical claims.                      | Yes            | "A cherished modern tradition...", "Established in [year] to...", "A contemporary celebration of..."                     |
  | **Contemporary**      | No claim to historical roots; clearly modern origin and practice.                                                                                                         | Yes            | "A popular modern event...", "Showcasing contemporary...", "Celebrating today's..."                                      |

  **Approved Sentence Templates (Focus on *Current* Truth):**

  1.  "This [festival/dish/costume] is **a cherished part of [Region's/Nation's] cultural landscape today**, reflecting [mention current values/identity/community spirit, e.g., local pride, skilled craftsmanship, communal celebration]." (Safe for almost anything).
  2.  "The **current form** of [practice], featuring [describe key invariant elements], **has been central to** [event/community] **since at least** [first attestation date]." (States documented fact without commenting on prior claims).
  3.  "[Practice] **draws inspiration from** [mention older substrate: historical techniques, ingredients, older regional customs] **to create** [describe current experience]." (Useful for "Reconstructed" or "Adapted").
  4.  "**Established in [year/documentable origin period]**, [practice] **has become a significant** [event/tradition/symbol] **for** [community]." (For "Revived", "Invented w/o antiquity", or "Contemporary").

  **Explicit Handoff to Committee:**

  The procedure **hands off** to the committee when:
  1.  **Test 5 (Community Scale & Catalyst):** Always. The significance of the imagined community and the context of invention during upheaval is a value/policy judgment.
  2.  **Legal Risk:** Any step suggests a high probability of a demonstrably *false claim of antiquity* being actively made by the applicant, where the desk's truthful wording might implicitly contradict it and trigger legal challenge. The committee (incl. Legal Officer) must decide risk tolerance and wording strategy.
  3.  **Sensitivity:** Applications involving colonial imposition, dispossessed communities (where Test 6 flags contradictory evidence), or politically charged national symbols (like the national dress).
  4.  **Ambiguous Evidence:** Where the tests yield conflicting or highly ambiguous results requiring expert historical interpretation beyond the editor's scope.
  5.  **Value Judgment:** Ultimately, deciding *whether an invented or reconstructed tradition "deserves" listing* based on its current social meaning, cultural significance, or community value is **purely a committee decision on policy grounds**, not a factual determination by the procedure. The procedure only provides the factual label and context.

  **Judgment Calls Disguised as Procedure:**

  1.  **The Age Threshold:** The procedure relies on implicit thresholds (e.g., "<100 yrs" for recent invention, "150+ years" for "Continuous"). **This is entirely arbitrary.** Hobsbawm doesn't define an age when invention becomes tradition. This is a practical, contestable line drawn for operational necessity.
  2.  **"Significant" Change (Test 4):** Determining if adaptation is minor evolution (still "Continuous/Adapted") vs. fundamental change implying rupture/reconstruction is interpretive.
  3.  **"Plausible Corroboration" (Test 6):** Judging what constitutes enough indirect evidence to support an oral tradition in the absence of documentation is highly subjective.
  4.  **"Matches a Template" (Test 3):** Deciding the degree of similarity needed to flag modularity involves judgment.

  **Handling Hard Cases Explicitly:**

  *   **Invention now 130 years old:** Label: **"Invented while claiming antiquity"** if it still falsely claims *greater* age. Label: **"Adapted"** or **"Continuous"** if it has evolved organically over those 130 years *and* no longer falsely claims deeper antiquity (unlikely). **Committee Handoff:** High likelihood, due to age/entrenchment vs. false claim.
  *   **Colonial Imposition, Adopted:** Label: **"Invented while claiming antiquity"** if falsely claimed as pre-colonial. Label: **"Reconstructed"** or **"Adapted"** if acknowledged colonial origin but significantly reshaped/adopted. **Committee Handoff:** Always, due to sensitivity and value judgment on legitimacy.
  *   **Ancient Ingredients, Modern Dish (1930s):** Label: **"Reconstructed"** or **"Adapted"** (if an older, simpler dish existed). **Do NOT label as "Continuous" or grant antiquity claim for the specific dish.** Template: "Drawing on ancient local ingredients like X, this distinctive dish took its current form in the early 20th century..."
  *   **Oral Tradition (Dispossessed, No Docs):** Apply **Test 6 (Benefit of Doubt)**. Label: **"Continuous"** or **"Adapted"** unless strong contradictory evidence. **Never label "Invented..." based solely on lack of documents.**

  **Running the Procedure: Test Cases**

  **Case 1: Highland Gathering Festival**
  *   Claim: Predates written record.
  *   Facts: Earliest doc = 1908 railway promo. Continuous since 1946. Matches 3+ other regional formats same decade.
  *   **Analysis:**
      *   Test 1 (State/Fixing): **Flag.** Railway promo (linked to state-ish infrastructure/tourism) is first attestation. Suggests promotion/modularity.
      *   Test 2 (Attestation): **Flag.** Practice first attested 1908. Claim of pre-written antiquity is made *now* but likely also promoted early (railways sell "ancient" romance). Gap is zero/small/reversed.
      *   Test 3 (Modularity): **Flag.** Matches other regional formats same decade. Classic modular diffusion.
      *   Test 4 (Invariance): **Flag?** Programme seems codified early (railway handbill) and stable since 1946. Claimed invariance ("predates record") suggests no change, but we lack pre-1908 evidence. Invariance claim is red flag.
      *   Test 5 (Community/Catalyst): **Handoff.** Asks to imagine regional/national community. Emerged during industrialization/railway expansion (social disruption).
  *   **Label:** **Invented while claiming antiquity** (Strong indicators: first attestation via promotion, modularity, invariance claim, catalyst era).
  *   **Desk Action:** Recommend **NO LISTING** with "ancient/unbroken" claim. Prepare committee brief highlighting modularity, promotion origin, false claim. Suggest approved template focusing on post-1946 continuity or its *current* role: "A beloved gathering since the mid-20th century, featuring..." or "This Highlands festival, drawing on regional traditions, has been a highlight of the summer calendar since 1946..."

  **Case 2: Woven Garment**
  *   Claim: Worn continuously for five centuries.
  *   Facts: Weave tech ancient (archaeology). Cut, colors, "national" designation from 1920s revival school.
  *   **Analysis:**
      *   Test 1 (State/Fixing): **Flag.** Revival school (often state-supported/elite-driven) codified the *specific form*.
      *   Test 2 (Attestation): **Flag.** *Specific garment form* first attested 1920s. Claim of 500-year continuity for *this specific form* is false.
      *   Test 3 (Modularity): N/A (Specific to this garment type).
      *   Test 4 (Invariance): **Flag.** Claimed invariance for 500 years demonstrably false for the *specific form*. The *weave* may be ancient, but the garment is new.
      *   Test 5 (Community/Catalyst): **Handoff.** Asks to imagine national community. Revival occurred post-WWI/Independence (social disruption).
  *   **Label:** **Invented while claiming antiquity** (False claim for specific garment). **Reconstructed** (if acknowledging revival based on older tech).
  *   **Desk Action:** Recommend **NO LISTING** with "500 years continuous wear" claim. Prepare committee brief. Suggest approved templates: "Featuring ancient weaving techniques, this distinctive garment design emerged in the early 20th century..." or "Based on historic textile craft, this modern national garment..."

  **Case 3: Flagship National Costume (Board's Own)**
  *   Claim: Promoted as "ancient national dress".
  *   Facts: Designated/standardized by 1930s state committee from regional variants.
  *   **Analysis:**
      *   Test 1 (State/Fixing): **Flag.** State committee explicitly codified it.
      *   Test 2 (Attestation): **Flag.** *This specific standardized form* dates to 1930s. Claim of "ancient" nature for *this specific form* is false. Elements may be older, but not the unified "national" costume.
      *   Test 3 (Modularity): **Flag.** Explicitly assembled from regional variants into a "national" template (classic modularity).
      *   Test 4 (Invariance): **Flag.** The *designated form* is fixed by decree since 1930s. Claimed "ancient" invariance false.
      *   Test 5 (Community/Catalyst): **Handoff.** Created to imagine national community. 1930s likely period of nation-building/identity formation (social disruption).
  *   **Label:** **Invented while claiming antiquity**.
  *   **Desk Action:** **REQUIRES REWORDING OWN MATERIALS.** This is internally generated, so the desk *must* correct it. **Draft Replacement Copy:** "Designated in the 1930s, this national costume draws on the rich diversity of traditional regional dress styles found across the country." OR "Established as a national symbol in the 20th century, this costume incorporates enduring elements from our regional heritage." (Uses "Reconstructed" or "Invented w/o antiquity" spirit, focuses on current status and roots without false antiquity).

  **What the Procedure Cannot Do:**

  1.  **Distinguish "Invented" from "Revived" on Thin Evidence:** If a practice disappears completely and is later revived, but evidence of the *original* practice and the *break* is scant (common), the procedure might mislabel a genuine revival as "invented" (if no evidence of the old practice is found) or vice-versa (if evidence of the break is lost). It relies on the evidence *found*, which is often incomplete.
  2.  **Systematic Bias Against Oral Traditions:** Despite Test 6 safeguards:
      *   **Evidence Burden:** The "plausible corroboration" standard, while better than nothing, still imposes a burden of proof that written traditions don't face as acutely. Finding *any* corroboration for deep oral history is inherently harder.
      *   **Conceptual Framework:** Anderson's "print capitalism" and the "census-map-museum" apparatus are fundamentally rooted in *written/state* systems. The procedure, built on these concepts, inherently privileges those systems. Test 6 is an add-on, not a fully integrated equal framework.
      *   **Editor Expertise:** Staff without historical training may struggle to find/interpret non-textual corroboration (archaeology, linguistics) effectively in 90 minutes.
  3.  **Answer the Value Question:** The core committee fight – **"Does this invented/reconstructed tradition, now embedded and meaningful, *deserve* official certification alongside older ones?"** – is completely outside the procedure's scope. The procedure only provides:
      *   The factual label (e.g., "Invented while claiming antiquity").
      *   Context about its origins (modularity, state role, catalyst).
      *   **It cannot determine cultural value, current significance, or whether the "imagined community" it fosters is "valid."** This is purely a political/policy decision for the committee, informed *by* the procedure's facts but not determined *by* them. The procedure shows *how* it was imagined, not *if* that imagination deserves endorsement.
