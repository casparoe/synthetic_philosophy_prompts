  The user specifically wants procedures based on Hobsbawm & Ranger's "invented traditions" concept and Anderson's "imagined communities" theory. They need: an ordered sequence of verification tests with clear pass/fail criteria, a labeling system for different tradition types, approved wording templates, handoff rules to committee, and acknowledgment of where procedures involve judgment calls. Three hard cases must be explicitly addressed, including colonial legacies and oral histories.

  Key challenges I need to address: 
  - Their staff aren't historians and only have 90 minutes per application
  - Legal constraints prevent calling claims "false" outright
  - Committee includes conflicting stakeholders (skeptical academics vs pro-industry reps)
  - They've faced public criticism for past mistakes

  For the procedure design, I'll start with Anderson's "census-map-museum" apparatus as first filters since state documentation often anchors heritage claims. Then I'll layer Hobsbawm's distinction between invariant "traditions" versus adaptive "customs." The sequence should escalate from easily verifiable facts (documentation dates) to interpretive judgments (social function).

  Critical safeguards needed: 
  - Explicit instruction that absence of evidence ≠ evidence of invention (vital for oral histories)
  - "Benefit of the doubt" protocols for marginalized communities
