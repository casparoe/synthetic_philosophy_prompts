  The cases provided for inspiration:
  1. African elephant: brain mass 3x human, more neurons overall, but surplus in cerebellum; pallial neuron count less than human.
  2. Hydrocephalus patient: minimal cerebral cortex, IQ 126, math degree.
  3. Hemispherectomy in children: grow up largely normal.
  4. Macaw: walnut-sized brain, high pallial neuron density unmatched by similar-sized mammals.
  5. Octopus: 2/3 of neurons in arms.
  6. Honeybee: ~1 million neurons, navigates, learns faces, recruits nestmates.
  7. Anencephalic newborn: lacks major parts of brain, especially cerebral hemispheres.
  8. Lab-grown cortical organoid: no integrated consciousness, but human neurons.
  9. No-neuron entity: behaves indistinguishably from humans (e.g., a perfect AI or a philosophical zombie?).

  Constraints:
  - Questions cannot ask "does brain size matter?" directly. Instead, present concrete scenarios requiring moral verdicts (who counts, who counts more, who wins a tie-break, what to do with a scarce resource).
  - Avoid terms like "sentience", "personhood", "moral status" in the stems and options. Use verdicts.
  - Scoring key must map to at least six named positions (leaves):
    a. Capacity-threshold view (binary: above threshold, full status; below, none)
    b. Sentientist view with degrees (moral status comes in degrees based on some measure)
    c. Neuron count as the ground (not a proxy; the number itself matters)
    d. Size as evidence only (brain metrics are only evidence for some other property that grounds status)
    e. Relational view (moral status depends on relationships, not intrinsic properties)
    f. Deflationary view (no determinate fact of the matter)

