  Scenario: You are allocating a scarce life-saving resource. One candidate is an adult African elephant, the other a human adult. The elephant's brain is three times the mass of the human's and has more total neurons, but the human has more neurons in the pallium (the part of the brain associated with higher cognition). Who gets the resource?
