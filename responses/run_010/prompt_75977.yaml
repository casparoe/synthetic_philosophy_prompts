answer: |-
  This account of "unabsorbed moral residue" in political leadership—particularly associated with "dirty hands" theorists like Walzer, Williams, and Coady—faces significant exposure when scrutinized through broader ethical frameworks. Below is a mapped analysis of its vulnerabilities across your three requested lines, evaluating counterarguments, decisiveness, defender responses, and culminating in a verdict on the thesis's risks.

  ---

  ### **1. Distinguishing Residue from Ordinary Overridden Pro-Tanto Obligations**
  *   **Core Challenge:** Is the "residue" merely a restatement of standard moral conflict, or is it a distinct phenomenon?
  *   **Counterarguments & Cases:**
      *   **Deontological Objection (e.g., Kantianism):** If an action is *right all things considered* (justified by overriding duty), any persisting "wrongness" is illusory. The residual feeling is merely psychological regret for the overridden pro-tanto duty (e.g., lying to save a life). No *fresh moral obligations* (like apology/punishment) arise from a *justified* act.  
          *Case:* A doctor amputates a limb to save a life. The harm is regrettable, but no apology for the *act itself* is morally required—only compassion for suffering.  
          *Decisiveness:* **Potentially fatal.** If morality demands only what is all-things-considered right, the residue lacks foundation.
      *   **Consequentialist Objection:** The "residue" is reducible to the costs of the unchosen option. "Fresh obligations" (e.g., compensation) are simply part of maximizing net good *ex post*, not evidence of intrinsic wrongness.  
          *Case:* Bombing a military target collaterally kills civilians. Justified if proportionate, but compensation/reparations are future-oriented duties to *restore utility*, not atonement for wrongdoing.  
          *Decisiveness:* **Awkward, not fatal.** Fails to explain why compensation feels *insufficient* (e.g., victim families may demand punishment, not just money).
  *   **What the View Predicts (vs. Rivals):** It predicts that *even justified* political acts (e.g., torture for bomb intelligence) generate obligations *specifically because the act was a moral transgression*, not merely costly. A leader *must* acknowledge guilt, not just regret outcomes.
  *   **Defender Response:**  
      *   **Concession:** The line is blurry; some "private" tragedies (e.g., Sophie's Choice) may resemble residue.  
      *   **Dismissal:** Political role obligations (e.g., upholding public trust) *amplify* the residue into fresh duties. Ordinary conflicts lack this institutional dimension. The residue reflects *role-specific integrity violations*.  
      * **Cost:** Moderate. Failing to provide a bright-line criterion invites charges of vagueness, but not incoherence.

  ---

  ### **2. Residue as Consequentialist Regret vs. Intrinsic Wrongness**
  *   **Core Challenge:** Can all "residue" be explained as regret for forgone goods, rather than a unique moral remainder?
  *   **Counterarguments & Findings:**
      *   **Consequentialist Reconstruction:** Regret focuses on the *opportunity cost* of the unchosen path (e.g., "If we hadn’t tortured, more civilians would have died"). The "fresh obligations" are instrumental: apologizing maintains social cohesion; accepting punishment deters future abuses.  
          *What Shows It Cannot?* If the residue persists *even when consequences are fully optimized*. Example: A leader justifiably sacrifices one innocent to save ten, fully compensates the family, yet still feels obligated to resign—suggesting the *act itself* stains their integrity.  
          *Decisiveness:* **Highly awkward.** If obligations vanish once consequences are addressed, the residue collapses into regret. But if they persist (e.g., symbolic self-punishment), consequentialism struggles to explain them.
      *   **Virtue Ethics Critique:** The residue reflects *agent-centered* damage (corruption of character) rather than outcome-based regret. A leader who doesn’t feel residue lacks integrity, even if their act was justified.  
          *Finding:* Bernard Williams’ "agent-regret" – a feeling tied to one's *agency* in causing harm, distinct from regret over bad states of affairs.  
          *Decisiveness:* **Supportive of residue, not counter.** Shows residue isn’t *just* consequentialist.
  *   **What the View Predicts (vs. Rivals):** It predicts that the residue involves *acknowledging moral injury to oneself* (e.g., "I violated a deep norm") and society, not just suboptimal outcomes. Consequentialism sees only suboptimal states; deontology sees no wrong if justified.
  *   **Defender Response:**  
      *   **Dismissal:** Consequentialist regret is *backward-looking* (mourning the unchosen path), while residue is *forward-looking* (generating duties). The inability to "wash off the blood" (Walzer) implies non-consequentialist wrongness.  
      *   **Cost:** Low. Consequentialism’s failure to capture the phenomenology of taint (e.g., Macbeth’s "Will all great Neptune’s ocean wash this blood clean from my hand?") is a known limitation.

  ---

  ### **3. Politics-Specificity of the Phenomenon**
  *   **Core Challenge:** Is "residue" unique to politics, or do other roles (e.g., doctors, generals) experience it?
  *   **Counterarguments & Cases:**
      *   **Professional Roles Analogies:**  
          *   *Medical Ethics:* A doctor violates patient autonomy (e.g., involuntary treatment) to save life. Justified, but may feel residue requiring apology/accountability.  
          *   *Military Ethics:* A soldier kills non-combatants collaterally. Justified under proportionality, but may incur duties of acknowledgment (e.g., formal investigations).  
          *Decisiveness:* **Potentially fatal to uniqueness.** If identical residue arises elsewhere, the "political exceptionalism" claim weakens.
      *   **Feminist Ethics Critique:** The "private" sphere (e.g., family care) involves tragic choices with residue (e.g., neglecting one child for another's urgent need). Politics isn’t special; *all* roles with responsibility generate residue.  
          *Case:* A parent works 80-hour weeks to afford life-saving treatment, failing their child emotionally. May feel unabsorbed guilt requiring apology.  
          *Decisiveness:* **Awkward.** Exposes potential bias in framing "political" as uniquely tragic.
  *   **What the View Predicts (vs. Rivals):** It predicts that *only* political acts (exercising sovereign power over a community) generate residue with *public, irreparable* obligations (e.g., submitting to punishment). Private roles lack the collective authorization and scale.
  *   **Defender Response:**  
      *   **Concession:** Analogous residue exists, but political residue is *categorically distinct* due to:  
          (i) **Public Accountability:** Leaders act *in the name of* the community, so the violation is communal.  
          (ii) **Sovereign Power:** Political choices involve ultimate authority (e.g., suspending rights), unlike delegated professional roles.  
      *   **Dismissal:** In private roles, "residue" lacks institutional obligations (e.g., no political leader can avoid apology by compensating victims).  
      * **Cost:** Moderate. Must convincingly argue that politics’ *scale/authority* intensifies residue into a unique normative category.

  ---

  ### **Final Verdict: Risks and Insulation**
  - **Does the Thesis Risk Anything?** Yes, but it is *highly insulated*:  
    - **Empirical Risk:** Minimal. The phenomenology of "dirty hands" is widely attested.  
    - **Theoretical Risk:** High if deontology/consequentialism fully explain morality. Yet the view thrives in gaps these rivals leave (e.g., agent-regret, symbolic duties).  
    - **Risk of Insulation:** The core move—insisting residue persists *despite* justification—makes it hard to falsify. Defenders can always attribute counterexamples to "misapplied justification" or "private role differences."  

  - **Is Insulation a Defect?** **Yes, for a claim of this kind.**  
    - A robust moral theory should be vulnerable to counterevidence. By framing residue as a *necessary feature* of political realism, the thesis risks becoming non-refutable: any challenge can be dismissed as "failing to grasp political necessity." This echoes criticisms of moral exceptionalism (e.g., "reasons of state" justifying atrocities).  
    - **Qualification Trade-off:** When qualified (e.g., "residue arises only under stringent conditions X, Y, Z"), the thesis loses its bite; when unqualified, it risks dogmatism.  

  **Conclusion:** The view survives scrutiny but at significant cost. Its exposure is greatest regarding **uniqueness to politics** (Line 3) and **distinction from ordinary conflict** (Line 1). While not fatally undermined, its insulation from disconfirmation weakens its credibility as a general account of political morality—suggesting it may be better framed as a *descriptive phenomenology* of leadership, not a normative theory. Its enduring power lies in capturing the *existential weight* of political choice, even if rivals minimize its theoretical necessity.
