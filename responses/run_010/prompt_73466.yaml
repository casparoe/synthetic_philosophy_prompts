  ## The Estuary Man

  **Clinical Neuropsychology Report: Case #P-1782**
  **Subject: Mr. Alistair Thorne (DOB: 12/05/1961)**
  **Referred by:** Harbour Authority Medical Panel (HAM/REF/789)
  **Date of Assessment 1:** 18/10/2023 (11 weeks post-event)
  **Date of Assessment 2:** 29/11/2023
  **Reason for Referral:** Evaluation of fitness to resume duties as Estuary Pilot following left middle cerebral artery infarct (02/08/2023). Panel requires recommendation: Licence Restored / Licence Revoked / Suspension Pending Review.

  **1. Background:** Subject is a 62-year-old male with 31 years continuous service as a Class 1 Estuary Pilot for the Havenport Authority. Medical history significant for hypertension (controlled), hypercholesterolaemia (controlled). No prior neurological history. Infarct confirmed by MRI (03/08/2023). Underwent stroke unit rehabilitation. Discharged home 18/09/2023. Lives with wife. Reports no falls. Independent in ADLs.

  **2. Current Presentation:** Subject alert, cooperative. Speech fluent but occasionally circumlocutory. Mood euthymic. Insight present. Denies significant cognitive difficulties. Reports feeling "ready to go back".

  **3. Neurological Examination:** Residual mild right facial weakness. Right upper limb power 4/5, lower limb 5/5. Mild right-sided sensory diminution. Coordination intact. Gait stable.

  **4. Neuropsychological Assessment Battery:**

  **4.1. Auditory Discrimination (Tones):** Pairs of pure tones presented (250ms duration, 500ms ISI). Subject required to state "Same" or "Different". Stimuli varied in frequency difference (10Hz, 20Hz, 50Hz steps around 1000Hz baseline).
  *   *Assessment 1:* Performance incorrect at 10Hz difference (Chance level: 50% correct). Performance correct at 20Hz and 50Hz differences. Error rate 45% for 10Hz trials.
  *   *Assessment 2:* Performance correct at 20Hz and 50Hz differences. Performance incorrect at 10Hz difference (Error rate 40%). Subject stated "probably different" or "much the same" frequently during 10Hz trials. Response not accepted per protocol.

  **4.2. Running Count (Visual):** Series of distinct shapes (circle, square, triangle) presented sequentially on screen (1s duration, 0.5s ISI). Subject required to count occurrences of target shape (e.g., "Count squares only").
  *   *Assessment 1:* Errors present in all trials (Series length 15-20). Errors typically omission (1-3 missed targets per series). Commission errors absent.
  *   *Assessment 2:* Errors reduced but present in 3/5 trials (1-2 missed targets per error trial). Performance correct in 2/5 trials. Self-correction observed twice.

  **4.3. Rule Application (Traffic Light Simulation):** Computer simulation displaying coloured lights (Red, Amber, Green) in sequence. Subject required to press "GO" or "STOP" button based on conditional rule: "IF Red light OR (Amber light FOLLOWED BY Red light) THEN STOP; IF Green light OR (Amber light FOLLOWED BY Green light) THEN GO". Rule stated before each block. Sequences randomised.
  *   *Assessment 1:* Performance incorrect on complex sequences involving Amber followed by unexpected colour. Error rate 65% for Amber-initiated sequences. Performance correct on simple Red/Green sequences. Rule recall intact after task.
  *   *Assessment 2:* Performance incorrect on complex sequences (Error rate 55% for Amber-initiated sequences). Subject hesitated significantly. Performance correct on simple sequences. Rule recall intact.

  **4.4. Distance Estimation (Static Images):** Photographs of vessels at various distances within Havenport estuary landmarks (e.g., against gantry cranes, jetties). Subject required to state distance in metres.
  *   *Assessment 1:* Estimates accurate (within 5% error margin). Performance correct.
  *   *Assessment 2:* Estimates accurate (within 5% error margin). Performance correct.

  **4.5. Relative Speed Judgement (Video Simulation):** Short video clips (ship's bridge perspective) showing approach of another vessel head-on. Clips terminated before collision/avoidance. Subject required to state closing speed in knots.
  *   *Assessment 1:* Estimates accurate (within 2 knots). Performance correct.
  *   *Assessment 2:* Estimates accurate (within 2 knots). Performance correct.

  **4.6. Swing Prediction (Simulator):** Real-time harbour simulator. Subject controls virtual vessel (250m bulk carrier) making 90-degree turn in Havenport's Middle Reach (current: 2 knots ebb). Subject required to predict point of maximum swing (bow/stern deviation from intended track) and state magnitude in degrees.
  *   *Assessment 1:* Predictions accurate (within 3 degrees). Performance correct. Stated swing felt "a bit sluggish, less than you'd expect for the tide".
  *   *Assessment 2:* Predictions accurate (within 3 degrees). Performance correct.

  **4.7. Berth Clearance Assessment (Simulator & Static):** Simulator: Manoeuvre same bulk carrier into a known tight berth (King George V Wharf) with crosswind 15 knots. Static: Scale model of KGV Wharf and vessel. Subject asked if specific vessel (dimensions given) could fit berth with stated margins (1m side, 2m ends).
  *   *Assessment 1 (Simulator):* Manoeuvre safe, controlled. Clearances maintained (>1m). Performance correct.
  *   *Assessment 1 (Static):* Judgements accurate (fit/no fit). Performance correct.
  *   *Assessment 2 (Simulator):* Manoeuvre safe, controlled. Clearances maintained (>1m). Performance correct.
  *   *Assessment 2 (Static):* Judgements accurate. Performance correct.

  **5. Summary of Findings:**
  *   *Assessment 1:* Significant impairment present in tasks requiring categorical discrimination (Auditory Discrimination - small differences), maintenance of discrete counts (Running Count), and application of conditional rules (Traffic Light). Performance intact on tasks requiring quantitative estimation (Distance, Speed, Swing, Clearance). Errors in impaired domains are absolute (incorrect response), not graded.
  *   *Assessment 2:* Modest improvement noted in Running Count (performance now correct on some trials, errors reduced). Auditory Discrimination at 10Hz difference remains incorrect. Rule Application remains impaired. Quantitative estimations remain intact and accurate.

  **6. Clinical Opinion:** Subject demonstrates a clear dissociation post-infarct. Function reliant on discrete, categorical processing (identity, logical rules, precise enumeration) is significantly impaired. Function reliant on magnitude estimation, relative judgment, and spatial prediction remains remarkably preserved. The nature of the deficits directly impacts core pilotage requirements: interpreting discrete sound signals (e.g., fog horns, engine telegraphs differing by few Hz), maintaining exact count of movements or signals, applying complex port regulations expressed as conditionals. While quantitative skills (speed, distance, tidal effect, swing) are crucial, pilotage demands reliable integration of *both* types of processing. The observed improvement in Running Count is insufficient to mitigate the fundamental impairment in categorical processing, particularly rule application. Reliability is absent in these key domains.

  **7. Recommendation:** Licence Revoked. The pattern of impairment presents an unacceptable risk for the safety-critical role of Estuary Pilot. Further review unlikely to alter core deficit profile. Panel informed.

  ---
  **Alistair Thorne: Havenport Middle Reach, Flood Tide, 07:15 GMT, 30/11/2023**

  The water was the colour of weak tea left too long, swirling with bits of chaff and foam from the container terminal upstream. *More brown than grey today,* Alistair noted, leaning against the chill railing of the *Seabird*’s starboard wing bridge. The air tasted of diesel and wet rope, familiar as his own breath. Eleven weeks since the world had tilted, a sudden lurch inside his skull while checking tide tables. Now, back on the water as a passenger, courtesy of old Bill Henderson, just to feel the movement underfoot. Not the same. Never quite the same.

  They’d poked and prodded him in that too-bright room. Played beeps. *Higher, lower? Same, different?* One tone, then another, close enough to make his teeth ache. Nearly the same. Almost identical. But the woman wanted ‘same’ or ‘different’, sharp as a knife cut. He’d hear the tiny waver, the faintest breath of difference, like a string slightly out of tune. "Different?" he’d venture, then see her pen tick the wrong box. "But only just," he’d add, uselessly. They wanted yes or no. He heard the almost.

  Counting shapes. Circles, squares, triangles flashing by. Just count the squares. Easy. Then… a flicker. Was that one slightly squashed? Or just the angle? Or had he blinked? One slipped by. Then maybe another. He’d end up a few short, or sometimes, later, one over. Never spot on. Before, it was automatic, like breathing. Now, it felt like counting pebbles on a shifting beach.

  The traffic lights game. Red, stop. Green, go. Simple. Then amber. Amber meant… what? *If amber then green, go. If amber then red, stop.* The words were clear in his head. But when the lights flashed – amber, then *red* – his finger hovered. The rule was there, solid, but applying it felt like trying to grab smoke. He’d press ‘stop’ too late, or sometimes, confused by the sequence, press ‘go’ when he shouldn’t. The disappointment on the woman’s face was colder than the estuary wind. She saw failure. He felt the rule slipping sideways in his mind, like a poorly lashed crate.

  But the distances… ah, the distances he still *knew*. The photograph of the *Nordic Star* against the old grain silos. *About 150 metres off,* he’d said instantly. 152, the computer said. Close enough. The closing speed video: that tanker looming, bow wave just starting to feather. *Seven knots, maybe seven and a half.* 7.2 knots. The simulator turn: feeling the big virtual bulk carrier begin its sluggish yawn into the ebb tide in Middle Reach. *She’ll swing about fifteen degrees off before she bites,* he’d murmured. 14.8 degrees. The KGV Wharf model: *That Panamax? Tight, but she’ll fit. Just about room to walk down the side.* And on the simulator, he’d nudged her in, feeling the crosswind push, the slight tremor through the controls as the virtual hull whispered past the virtual fenders, leaving more space than looked comfortable, but enough. Always enough. That sense of room, of pressure, of the *fit* of things in water and space – that hadn’t left him. It felt deeper, if anything. More fundamental than the brittle rules.

  Six weeks later, they’d called him back. More beeps. More shapes. More bloody traffic lights. He’d concentrated harder than he ever had docking in a gale. On the counting, he’d fixed his eyes like a hawk, refusing to blink, tracing the outline of each square, anchoring it. He’d missed fewer. Only one or two per run. The woman seemed slightly less disappointed. "Improvement," she’d noted, her voice flat. He’d felt drained afterwards, his head thick.

  The tones were still a struggle. That tiny, nagging difference. He knew they wanted a clear answer. "Different," he’d forced out, more often this time, even when the difference felt thinner than mist. Sometimes he was right (the 20Hz ones), sometimes wrong (the 10Hz). The 'much the same' feeling was still there, unwelcome, unvoiced. The traffic lights… he’d slowed right down. Amber. Stop. Think. *What comes next? Red? Then stop. Green? Then go.* He’d gotten a few more right, hesitatingly. The relief was short-lived. It cost him. Not in the room, but later.

  Now, standing on the *Seabird*, watching a real pilot – young Mike Dawson – bring the *Ocean Endeavour* into King George V. Mike was good, sharp. Alistair watched the approach, felt the interplay of tide pushing the stern, the bow thruster biting, the spring lines going on. *He’s coming in a shade fast,* Alistair thought. *Needs to check her sooner.* The distance closed. *Plenty of room still… but less margin than I’d like.* He felt a faint, unfamiliar unease. Before, he’d have *known*, down to an inch, the precise feel of the buffer zone. Now, it was… rougher. Still adequate, certainly safe, but the crystal clarity, the absolute certainty of the *space* around the hull, felt slightly blurred at the edges, like a lens smudged. He’d traded something – that effortless, unconscious anchoring of the shapes and rules – for a fraction more grip on the absolutes they demanded. And quietly, almost imperceptibly, some of the old, effortless precision of the quantities, the feel of the water and the steel, had… softened. Not gone. Not wrong. Just less acute. A price paid somewhere the tick-boxes couldn’t measure.

  The Panel’s letter arrived the next morning. Thick, official envelope. He knew before he opened it. REVOKED. The word leaped out, stark, final. An absolute. No room for ‘almost’ or ‘nearly’ or ‘good enough’. The harbour he’d navigated for three decades was closed to him. He stared at the word, feeling the wrongness of it, a categorical verdict landing like an anvil on the nuanced landscape of his surviving skill. He could still *feel* the estuary’s pulse, calculate its demands with a margin most pilots would envy. Yet, according to the report, the man who knew the precise swing of a quarter-million-tonne vessel in an ebb tide was unfit because he couldn’t reliably say if two beeps were categorically different.

  He folded the letter carefully. The tide was flooding; he could smell it, feel the slight lift in the air. A deep-sea tanker, riding low, was making its cautious way up the main channel towards the oil terminal. He watched it from his front window, high on the hill overlooking Havenport. *Making about ten knots,* he thought. *Tide under her, helping. She’ll need to start her turn for the Inner Basin soon… about… now.* He saw the faint plume of water at her stern as the thrusters engaged. *Too early? Or just right?* He couldn’t quite tell from here. The margin felt… uncertain. He knew the regulations demanded the turn commence precisely at the Fairway Buoy. Had the pilot judged the buoy position correctly? Had he counted the markers accurately? Alistair couldn’t see them clearly from this distance. The report declared him unreliable for such discrete tasks.

  But watching the tanker’s slow, graceful arc, its stern swinging wide but controlled, perfectly clearing the shoal patch he knew lay just beyond the channel markers, Alistair felt a different certainty. *Plenty of room. Swing’s about right for the flood. She’ll slide in.* The manoeuvre looked safe, competent. Quantitatively sound. The pilot, whoever he was, was doing his job. Alistair Thorne knew he could still do that job too. The water told him so, in its language of pressures and spaces and almosts. The letter on his table, with its single, devastating word, told him he was wrong. Both verdicts, absolute and approximate, hung in the salt air, impossible to reconcile. The estuary flowed on, indifferent to the boxes.
