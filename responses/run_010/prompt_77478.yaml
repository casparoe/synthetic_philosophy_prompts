prompt: |-
  I teach 7th grade at a small private school and I'm in charge of the character-education part of the program, which sounds grand but mostly means I run a twice-weekly period where we deal with how the kids treat each other. There's a running war in the staff room about how to do this and I can't settle it.

  One colleague thinks the kids already have everything they need inside them and the job is to stop paving over it: kill the incentives to posture, stop embarrassing people in front of the group, hand them real responsibility, and the decent impulses will come up on their own. Her evidence is that every time we've cracked down harder the kids got sneakier rather than better.

  The other one thinks that's a fantasy. Her view is that basically nothing good comes out of a twelve year old spontaneously, that decency is a thing you build from the outside in, by making them go through the motions — the apology script, the thank-you round, sitting still and listening to someone they dislike for ten minutes — over and over until it stops feeling like acting. She points out that every adult they look up to became that way through years of being made to do things they didn't feel like doing.

  We ran her version last year. It worked better on the surface than I expected: they performed the apology script flawlessly. But two things bothered me. They performed it flawlessly only when a grown-up was in the room, and there was something flat about it, like reciting. And the year before, when we ran my other colleague's version — mostly just clearing obstacles and letting them talk things out — the term ended with them noticeably crueller to each other than they'd started, and noticeably better at explaining why what they'd done was fine.

  So here's the real question, and I definately don't want to be told the answer is somewhere in the middle, because the middle is exactly what we've been doing for six years and the middle is what's failing. Is there any way to tell whether one of these two pictures of what kids are like is actually right, or is it just temperament dressed up as an argument? And connected to that: her view keeps running into something I can't phrase properly. If being good is entirely a thing installed from outside by practice and authority, where did the first authority's wish to install it come from? She just says somebody had to start, which doesn't feel like an answer to me, though maybe I'm missing something and there is one.

  Concretely: I have one term left, about twelve sessions, and a tiny budget for materials. Tell me what you'd actually do with them and why. Give me your recommendation right at the top in the first paragraph, and please no headings, no bullet points, no bold, no tables — just continuous prose, the way you'd write an email. Its a longer thing to write than a list but I'd much rather read it that way.
reasoning: |-
  Okay, let me unpack this teacher's dilemma. They're caught between two fundamentally different approaches to character education in their 7th grade class, and the middle ground hasn't worked for six years. 

  First, I need to understand both viewpoints clearly. Colleague A believes kids have innate goodness that gets suppressed by systems - her evidence shows kids become sneakier with stricter enforcement. Colleague B thinks decency is externally built through repetitive practice - her structured scripts showed surface compliance but hollow results. 

  The teacher's frustration resonates - they've seen both approaches backfire: cruelty flourished with unstructured freedom, while performative apologies lacked sincerity. The core question is profound: Are kids fundamentally good needing liberation, or blank slates needing molding? And that philosophical puzzle about the origin of moral authority is particularly sticky.

  What stands out is how both colleagues are partially right but incomplete. The innate morality vs learned behavior debate in developmental psychology isn't either/or. Kohlberg's stages show moral reasoning evolves, while Bandura's social learning theory emphasizes modeling. But these 7th graders are in that tricky pre-adolescent stage where peer influence peaks and hypocrisy detectors are razor-sharp. 

  The teacher's request is practical: twelve sessions, minimal budget. They need actionable solutions, not theory. Key issues to address: the "adult surveillance effect" (compliance only when watched), and last year's increase in cruelty during unstructured time. 

  I recall research on "authentic altruism" - sincere behavior change comes from internalizing values, not just compliance. Programs like Roots of Empathy show real impact by making abstract concepts visceral. For these sessions, I'm thinking: scrap both current approaches. Instead, create scenarios where moral choices have real stakes but no audience. Like having them design ethical systems for a fictional society - they'd have to confront how rules feel when applied to themselves. 

  For the philosophical hole in Colleague B's argument - if morality is entirely external, where did the first moral teacher get it? That's worth addressing briefly because it exposes why her approach breeds hollow performance. The answer lies in evolved prosocial tendencies (even toddlers show spontaneous helping), but that's a footnote here. 

  Practical plan forming: Start with anonymous dilemma discussions (removing posturing), then move to supervised but student-led mediation (building skills), finally have them create "civility experiments" to test in wild (applying insights). Materials? Just paper, pens, maybe $20 for thrift store items for role-plays. 

  The why: This bypasses the coercion/neglect dichotomy by making moral reasoning collaborative and experiential. They're not obeying or rebelling - they're problem-solving. And crucially, it transfers when adults aren't watching because they own the process.
answer: |-
  Here’s what I’d do with your twelve sessions, and why, based on the core problem you’ve described: both approaches failed to generate *authentic*, *internalized* decency that persists without surveillance. Your colleagues each grasp half the truth. Children *do* have nascent capacities for empathy and fairness (Colleague A’s insight), but these are raw, fragile impulses easily overwhelmed by ego, fear, or social pressure. And they *do* need structured practice and explicit scaffolding (Colleague B’s insight), but scripting behavior without engaging moral reasoning creates hollow performances, not internal change. The missing piece is **guided reflection on lived experience**, forcing them to confront the gap between their actions and their own values. I’d structure the term around creating deliberate, controlled moral dilemmas and conflicts, then facilitating deep, uncomfortable analysis of what happened and why.

  **The Plan: Focus on "Moral Laboratories" & Unflinching Reflection**

  1.  **Weeks 1-3: Establishing Baseline & Frameworks (No Scripts, No "Free Talk")**
      *   **Session 1:** Start brutally honestly. "We all know things often go badly here. Let’s figure out *why*." Have them anonymously write down: *One time you saw someone (or you) being genuinely kind/decent here. What happened? How did it feel?* AND *One time you saw (or did) something cruel or unfair. What happened? Why do you think it happened?* Collect and read aloud *all* responses (you read, to protect anonymity). Don’t comment, just list. The goal: Show the spectrum exists *within them* – both impulses are real.
      *   **Sessions 2 & 3:** Introduce simple frameworks *as tools for analysis, not rules to obey*. Use concepts like: *Intent vs. Impact* (You meant to joke, they felt hurt); *The Bystander Effect* (Why does no one speak up?); *In-group/Out-group* (Why is it easier to be cruel to *them*?). Use *their* anonymous examples from Session 1 to dissect using these tools. "Using 'Intent vs. Impact,' what happened in this situation someone described?" Focus on understanding cause/effect, not assigning blame. This builds shared language for later.

  2.  **Weeks 4-9: The "Laboratories" – Structured Challenges with Mandatory Reflection**
      *   **The Core Method:** Design short, supervised group tasks (20-25 mins) engineered to *likely* trigger minor conflict, frustration, or ethical tension. Crucially, the *primary goal is not task completion*, but creating material to analyze. Follow *every* task with a longer, structured reflection (20-30 mins).
      *   **Task Examples (Low Cost/No Cost):**
          *   **Limited Resource:** One prized material (fancy art supply, one computer for research, a single "comfort item") for a group of 4-5. Task: Produce something simple together.
          *   **Conflicting Instructions:** Give subtly contradictory task sheets to group members. Who figures it out? How do they resolve it?
          *   **The "Unfair" Advantage:** Give one group member a clear, unearned advantage in a competitive task. How do others react? How does the advantaged member act?
          *   **The Silent Build:** Task requiring building something complex (e.g., newspaper tower) where only *one* person can speak at a time, others must follow silently. Rotate the speaker.
          *   **Empathy Switch:** Role-play a minor conflict scenario (e.g., borrowing without asking), but each person plays the *role opposite* to their usual stance/status.
      *   **Structured Reflection Protocol (Non-Negotiable):**
          1.  **What Happened?** *Just* facts. "X took the scissors and kept them." "Y stopped talking." "Z said 'This is stupid.'" (You moderate strictly, no interpretations yet).
          2.  **How Did People Feel?** Use feeling words. "I felt frustrated." "She looked angry." "He seemed left out." Encourage specificity.
          3.  **Why? Using Our Frameworks:** *This is the crucial step.* "Why might X have grabbed the scissors? (Fear of missing out? In-group pressure?)" "When Y stopped talking, what impact did that have? (Others felt ignored? Work stalled?)" "When Z called it stupid, what was the intent? What was the impact?" Connect explicitly to frameworks (Bystander effect? Intent vs. Impact?).
          4.  **What Could We Try Differently?** Brainstorm *concrete* alternatives for next time. "If someone hogs a resource, instead of glaring, could we say...?" "If you feel ignored, instead of shutting down, could you...?" *Do not script*. Focus on principles: "How could we ensure everyone's voice is heard?" "How could we express frustration without shutting others down?"

  3.  **Weeks 10-12: Synthesis & Student-Designed "Civility Experiments"**
      *   **Session 10:** Review the patterns. "Based on all our labs and reflections, what are the top 3 things that derail us? What are 2 things that helped us work better?" Use their own data.
      *   **Sessions 11 & 12:** Challenge: "Design a *tiny* experiment for our class to try for one week, based on what we learned, to make things slightly better. It must be specific, observable, and something *you* will help uphold." Examples they might generate: "We try saying 'Can I use that next?' before grabbing." "If someone looks left out of a chat, one person will ask them a question." "We'll try a 5-second pause before responding angrily." Guide them to make it realistic and focused on *their* identified problems. Implement the top 1-2 ideas for the final week(s) of term. Have brief daily check-ins: "How did our experiment go today? What worked? What flopped? Why?"

  **Why This Addresses the Core Problems:**

  *   **Beyond Performance vs. Cruelty:** It rejects both scripted compliance *and* unstructured "talking it out." The labs create *real*, low-stakes moral friction. Reflection forces them to analyze *their own* behavior and its consequences, linking actions to feelings and frameworks. This builds *internal understanding*, not just external performance.
  *   **Sincerity Over Scripts:** By dissecting *why* things went wrong or right in their *own* interactions (especially in the labs), they develop genuine insight. Brainstorming alternatives based on principles (not scripts) encourages authentic application. Playing opposite roles builds perspective-taking muscles scripts can't touch.
  *   **Building Internal Compass:** The constant "Why?" in reflection pushes them beyond "because the teacher said" or "because I felt like it." They start connecting actions to impacts on others and to shared frameworks. This is the seed of internalized ethics – acting rightly *because they understand why it matters*, not just for approval or avoidance.
  *   **Transfer Beyond Surveillance:** The focus is on building *their own* understanding and strategies. The "experiments" phase empowers them to design and test solutions. This ownership increases the likelihood they'll use these reflections and strategies even when you're not there, because it's *their* toolkit, not your imposition.
  *   **Addresses the Philosophical Hole:** It shows decency isn't *just* innate (it gets buried) or *just* installed (empty scripts fail). It's *constructed* through grappling with experience, guided reflection, and building understanding. The "first authority" likely started by reflecting on their own painful experiences of conflict – you’re formalizing that process. You’re not installing external rules; you’re helping them refine their own nascent moral reasoning through structured confrontation with reality.

  **Concrete Execution:** You facilitate fiercely. In labs, intervene *only* to prevent harm or keep the task going; let the friction happen. In reflection, be a strict moderator: enforce the steps, push for specificity ("What *exactly* did you see/hear?" "What *specific* word made you feel that way?"), challenge superficial answers ("But *why* do you think they did that?"), and relentlessly connect back to the frameworks. Your role isn't judge or scriptwriter, but a facilitator of uncomfortable, honest analysis. It will be messy and sometimes tense. That’s the point. You’re giving them the tools to build their own moral compass, brick by challenging brick, based on the reality of their own interactions.
