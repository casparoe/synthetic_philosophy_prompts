  ### Condorcet Jury Theorem Voting Decision Checklist
  Here's a streamlined 5-step checklist tailored to your club's constraints. Each step has clear questions, decision paths, and time-saving mechanisms. **You (the president) must approve all answers** before proceeding.

  ---

  #### **Step 1: Is this a "right answer" question?**  
  *(Time: 2 min)*  
  - **Question:** *Is there a single verifiable, objective truth?*  
    - **Real answer:**  
      - ✅ **Yes** = Fact-based (e.g., "Does this rule break the handbook?", "Did the advisor violate policy?").  
      - ❌ **No** = Preference/values-based (e.g., "Which charity to fundraise for?", "Prom theme?").  
  - **Outcome:**  
    - ❌ No → **Go to Step 1A**.  
    - ✅ Yes → **Go to Step 2**.  

  **Step 1A (Non-objective questions):**  
  *(Time: 1 min)*  
  - **Question:** *Should this decision reflect the entire club’s preferences?*  
    - **Real answer:**  
      - ✅ **Yes** → Whole club vote (e.g., charity choice, theme votes).  
      - ❌ **No** → Exec board vote (e.g., scheduling, minor operational choices).  
  - **Outcome:**  
    - ✅ **Whole club vote** (Stop here)  
    - ❌ **Exec board vote** (Stop here)  

  > 🔑 **Judgment call:** You decide what "should" reflect club preferences. Bias risk: Over-delegating to exec for controversial topics.

  ---

  #### **Step 2: Can voters access unbiased information?**  
  *(Time: 3 min)*  
  - **Question:** *Is there a neutral, easily digestible summary of the issue?*  
    - **Real answer:**  
      - ✅ **Yes** = Unbiased FAQ/doc (e.g., "Handbook rule 4.2 says...").  
      - ❌ **No** = Reliance on group chat/seniors’ opinions (e.g., "Jenna thinks the advisor overstepped").  
  - **Outcome:**  
    - ✅ Yes → **Go to Step 3**.  
    - ❌ No → **Flag: High influence risk** → Still proceed to Step 3.  

  > ⚠️ **Reality check:** Your club reads the same 2 seniors’ takes → Assume ❌ unless you create a neutral doc. *This is the "procedure costume" step—it forces you to create unbiased materials if claiming "yes."*  

  ---

  #### **Step 3: Is the whole club competent on this topic?**  
  *(Time: 4 min)*  
  - **Question:** *Would >50% of members understand the core issue after a 5-minute explanation?*  
    - **Real answer:**  
      - ✅ **Yes** = Simple, relatable topics (e.g., "Should we extend fundraiser deadline?").  
      - ❌ **No** = Complex/technical topics (e.g., "Does this contract clause violate school policy?").  
  - **Assessment hack:** Poll 3 random members (via text during the meeting). If 2/3 grasp it → ✅.  
  - **Outcome:**  
    - ✅ Yes → **Go to Step 4**.  
    - ❌ No → **Exec board vote** (Stop here).  

  > 🔍 **Why?** CJT fails if voters aren’t >50% competent. Execs are more likely informed.  

  ---

  #### **Step 4: Is voting synchronous?**  
  *(Time: 2 min)*  
  - **Question:** *Will >90% of votes be cast live/in-person?*  
    - **Real answer:**  
      - ✅ **Yes** = Most vote at the meeting.  
      - ❌ **No** = >10% vote async (e.g., Google Form skippers).  
  - **Outcome:**  
    - ✅ Yes → **Go to Step 5**.  
    - ❌ No → **Exec board vote** (Stop here).  

  > ⚠️ **Why?** Async voters are influenced by live discussions/group chat → Breaks independence.  

  ---

  #### **Step 5: Final CJT scoring**  
  *(Time: 3 min)*  
  Assign points:  
  - **Competence (Step 3):** ✅ = +1, ❌ = -1  
  - **Independence (Steps 2 & 4):** Both ✅ = +1, Either ❌ = -1  
  - **Calculate:**  
    - **+2:** ✅✅ **Whole club vote**  
    - **≤0:** ❌❌/✅❌ **Exec board vote**  

  > 🔎 **Rationale:** CJT requires competence + independence. Negative/neutral scores kill the "bigger group" advantage.  

  ---

  ### Case Studies
  #### **Case 1: Choosing a charity to fundraise for**  
  - **Step 1:** ❌ (No objective truth) → **Step 1A:** ✅ (Club preference) → **Whole club vote**.  
  - **Why:** Values-based → CJT doesn’t apply. Whole club should decide preferences.  

  #### **Case 2: Did the advisor overstep by canceling an event?**  
  - **Step 1:** ✅ (Objective truth: handbook rules)  
  - **Step 2:** ❌ (No neutral doc → group chat/seniors dominate)  
  - **Step 3:** ❌ (Complex policy → average member won’t understand)  
  - **Step 4:** ❌ (Async voters influenced by meeting recap)  
  - **Outcome:** ❌❌ → **Exec board vote**.  
  - **Why:** Low competence + broken independence → CJT says whole club is *less* accurate than execs.  

  ---

  ### Key Realities  
  - **Judgment calls in disguise:** Steps 1 (objective?), 3 (competence), and 5 (scoring) rely on your assessment. Mitigate by:  
    - Sampling members (Step 3)  
    - Pre-writing neutral docs (Step 2)  
  - **When to halt:**  
    - **"Not a voting question"** = Policy reserved for you/advisor (e.g., disciplinary actions).  
    - **"Hand back"** = Ambiguous outcomes in Steps 3–5 (e.g., score = 0).  
  - **Your power:** Reject any vote if the checklist isn’t followed.  
  - **Time saver:** Prep templates (neutral docs, polls) before meetings.  

  This forces rigor while respecting your constraints. Use it for 2–3 votes, then refine based on what feels like "procedure theater."
