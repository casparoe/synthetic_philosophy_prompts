prompt: |-
  You're a philosopher of medicine who's sat through a lot of hostile interdisciplinary seminars and who also knows how to coach a nervous speaker before they walk into one. Think carefully, and start with a tight bit of brainstorming about what this particular room actually cares about and what they'd count as a good answer — I want that reasoning on the page, but keep it to a few lines before you get to the prep sheet proper.

  The situation: in three weeks I'm giving a 30-minute talk with about 20 minutes of Q&A at a teaching hospital's clinical reasoning seminar series. My thesis is that the naturalism/normativism debate about disease is a stalemate only because both sides assume a condition either is or isn't a disease simpliciter. I want to argue that disease ascriptions are indexical to a contextually salient reference class, and that reference classes get picked out under interest-relative descriptions. So the biostatistical machinery is doing the real work of fixing the extention, but the choice of *which* reference class counts — age- and sex-stratified, national population, ancestral environment versus the one we actually live in — is itself a normative choice and not a discovery. Naturalism is right about the mechanism and wrong about the value-freedom; normativism is right that values enter and wrong about where they enter, since they don't enter via a judgement that some function is bad. I'm calling it interest-relative naturalism, which I know sounds like a man trying to have it both ways, and I'd like the prep sheet to treat that charge as a live risk rather than a joke.

  My running example in the talk is myopia and vitamin D insufficiency: both are massive statistical deviations from an ancestral-environment reference class and near-universal in a current-population one. On my view they're diseases relative to the first class and not diseases relative to the second, and the question "but are they *really* diseases?" is malformed. I'm aware that example is doing a lot of work.

  The audience, about 25 people: mostly GPs and hospital physicians attending for CPD, i.e. practical naturalists who think a disease is whatever has a code and a test. Two psychiatrists, one of whom defends a harmful-dysfunction style account of mental disorder and will absolutely push on whether my view can handle depression without collapsing into "it's a disease relative to what this society happens to want". A health economist who works in QALYs and disability weights, and who I expect will say that indexicality is just a fancy word for the threshold she already has to draw every day whether she likes it or not. Someone from disability studies who objects to any talk of subnormal function and will argue that reference-class selection is how you launder the status quo into biology. And one philosopher of science, a proper Boorsean, who thinks reference-class choice is a technical matter with a principled answer and that I've rediscovered a known problem and rebranded it as a solution.

  Give me the Q&A prep sheet, in British English please: the eight or so objections I'll actually get from *this* room — not the ones a general philosophy audience would give me — ordered by how much damage they'd do if I fumbled them. Phrase each one the way that particular person would phrase it, in their own vocabulary and with their own stakes showing, then give me a two-minute reply I could genuinely say out loud, plus a one-line note on where that reply is softest. Flag which two or three I should concede ground on inside the talk itself so they can't torpedo the question period, and tell me the one reply that absolutely has to land for the whole thing to come across as a position rather than a shrug. And finish with the question I'm hoping nobody asks — I already know the mental disorder case is my weak flank, so if there's something worse hiding in that audience, I'd much rather hear it now than in three weeks.
