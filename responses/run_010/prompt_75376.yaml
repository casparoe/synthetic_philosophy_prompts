answer: |-
  Here’s your Q&A prep sheet, grounded in the stakes and vocab of *this* room. I've ordered objections by potential damage if fumbled, with concessions to bake into your talk flagged upfront.

  **Core Concessions to Bake Into Your Talk** (Defuse torpedoes early):  
  1. **"This doesn't dissolve diagnostic thresholds – clinicians still need to act on contextually appropriate reference classes (e.g., age-stratified BP norms)."**  
  2. **"Ascribing 'disease' isn't the only way to access care or accommodation – disability frameworks are vital for many conditions."**  
  3. **"Your health economist is right: I'm formalising the threshold-setting she already battles with."**

  **The Must-Land Reply** (Without this, it’s a shrug):  
  *When challenged on relativism:* **"Indexicality isn't arbitrariness. Biological dysfunction is real and measurable *once a reference class is fixed*. But *which* class is clinically relevant – ancestral, national, subpopulation – depends on our goals: prevention, acute care, or equity. Ignoring that choice pretends medicine is value-free when it shapes who gets labelled 'ill'."**

  ---

  **Q&A Prep Sheet: Ordered by Damage Risk**  

  1. **The Senior GP (Practical Naturalist)**  
      *Objection:* "This sounds academic. My job is treating patients. If I code myopia as a disease today and not tomorrow based on your ‘reference class’, my clinic collapses. ICD codes exist for a reason."  
      *Reply:* "Absolutely – clinical coding needs stability. But *why* do we code myopia? Because in a school or driving context, uncorrected vision causes harm relative to *current population norms*. My point is: that norm isn’t ‘discovered’ like a virus; it’s chosen because it serves a purpose. It doesn’t change daily, but it *can* evolve – like how we now treat hypertension in the over-80s differently."  
      *Soft Spot:* Implies stability without explaining *how* reference classes stabilise.  

  2. **The Harmful-Dysfunction Psychiatrist**  
      *Objection:* "Take depression. If reference classes are interest-relative, isn’t this just saying it’s a disease when society dislikes it? You’ve reduced mental illness to cultural preference."  
      *Reply:* "Not preference – *harm in context*. Depression involves dysfunction in mood regulation relative to a species-typical reference class. But whether it’s a ‘disease’ depends on the *goal*: is our reference class ‘ancestral humans’ (where low mood might be adaptive)? Or ‘modern humans needing daily function’? The dysfunction is natural; the framing isn’t. This avoids collapsing into social constructivism."  
      *Soft Spot:* Species-typicality for mental traits is notoriously fuzzy.  

  3. **Disability Studies Scholar**  
      *Objection:* "Calling deviation from a ‘reference class’ dysfunction is bio-normativity. You’re laundering exclusion into science. Why pathologise myopia at all? Glasses are accommodation, not cure."  
      *Reply:* "I agree. Myopia *isn’t* intrinsically ‘bad’ – but uncorrected, it causes harm in environments with literacy demands. The ‘disease’ label isn’t about the trait itself, but whether we prioritise intervention over accommodation *for a context*. Your critique targets how medicine weaponises ‘disease’ – I’m showing how that weaponisation starts earlier, in reference-class choice."  
      *Soft Spot:* Doesn’t resolve when accommodation should replace medicalisation.  

  4. **Health Economist**  
      *Objection:* "This just restates my daily hell. QALY thresholds *are* interest-relative valuations. Why do I need philosophy to tell me drawing lines is hard?"  
      *Reply:* "You don’t! But recognising that reference-class choice is *also* a value-laden threshold – one hidden inside ‘objective’ diagnostics – shows why your QALY debates are so fraught. It’s not just ‘how much suffering is too much?’ but ‘*whose baseline* are we measuring from?’. This frames your work as continuous with clinical reasoning, not separate."  
      *Soft Spot:* Risks sounding like trivialising her expertise.  

  5. **The Boorsean Philosopher**  
      *Objection:* "Boorse *addressed* reference-class problems. Stratifying by age/sex *is* the principled answer – it controls for irrelevant variation. You’ve rebranded a technical fix as a ‘normative choice’."  
      *Reply:* "But *why* age/sex? Because it’s clinically useful for treatment? That’s a normative goal! Ancestral-environment classes might better capture ‘undesigned’ dysfunction (like myopia). Neither is ‘unprincipled’ – but choosing between them depends on whether we prioritise treatment or prevention. Boorse’s stratification assumes the goal; I’m making it explicit."  
      *Soft Spot:* Ancestral environments are inferential and contested.  

  6. **Junior Clinician (Worried about Uncertainty)**  
      *Objection:* "If everything’s indexical, how do we avoid paralysis? Won’t patients exploit this to demand treatments for non-diseases?"  
      *Reply:* "Indexicality demands *transparency*, not indecision. We justify reference classes by goals: ‘We treat blood pressure in over-65s to this threshold because it prevents strokes in *this population*’. That’s more honest than ‘this number is Disease’. It doesn’t expand disease definitions; it forces us to defend them."  
      *Soft Spot:* Assumes clinicians have time/resources for this justification.  

  7. **Skeptical GP**  
      *Objection:* "Vitamin D ‘insufficiency’ is a perfect example of disease-mongering by labs. Your view seems to enable that by making ‘disease’ even fuzzier."  
      *Reply:* "Quite the opposite! By showing that calling it a ‘disease’ relies on choosing *current* norms over *ancestral* ones (where levels were likely higher), we ask: ‘Is low vitamin D harmful *given modern lifestyles*?’ If evidence says no, we reject the label. It exposes, not enables, disease-mongering."  
      *Soft Spot:* Doesn’t address industry pressure on reference-class setting.  

  8. **The Pragmatic Psychiatrist**  
      *Objection:* "In practice, we treat distress and dysfunction. Your ‘reference class’ talk feels like navel-gazing. Does it change a single prescription?"  
      *Reply:* "It might! If depression is framed as dysfunction relative to an ‘ancestral’ class, we might research evolutionary mismatches (e.g., inflammation). If relative to ‘modern demands’, we prioritise therapy over meds. How we set the frame shapes research and resource allocation – ask our health economist."  
      *Soft Spot:* Overstates clinical influence of theoretical framing.  

  ---

  **The Question You Hope Nobody Asks:**  
  **"Take obesity. Its ‘disease’ status depends on reference classes (ancestral vs. modern). But those classes themselves embed societal fatphobia. Doesn’t your model silently inherit the biases in *how we describe* the reference class – making ‘interest-relativity’ a circular defence of power?"**  

  *Why it’s lethal:* It exposes that "interest-relative descriptions" of reference classes (e.g., "optimal BMI") may already be value-laden *before* selection, collapsing your fact/value distinction. Myopia is politically inert; obesity is not. Your reply must distinguish *empirical* reference classes (e.g., metabolic health correlations) from *normative* descriptions ("optimal"), but the entanglement is messy.  

  **Final Prep Tip:** Start with **"I’m not here to make your jobs harder – I want to clarify why they’re hard"**. Clinicians forgive theory that acknowledges their constraints. Good luck.
