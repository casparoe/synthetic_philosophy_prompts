prompt: |-
  For thirty-eight years I was a marine microbiologist, the last fifteen of them directing a laboratory concerned with microbial physiology in anoxic sediments. I retired four years ago and have since been reading philosophy of science with some seriousness, which I ought to have done decades earlier. I have now been persuaded to chair the screening committee for a private foundation that awards a substantial prize, every second year, for work judged to have produced or demonstrated a novel form of life. The committee consists of three people: myself, a synthetic chemist who knows nothing of biology beyond school level, and a lay trustee appointed by the donor. We receive between thirty and fifty submissions per cycle, ranging from serious laboratory work to outright crankery, and we meet once, by video conference, for a single day. Each file gets roughly ten minutes.

  Our statutes define life in one sentence, borrowed long ago from the astrobiology literature, to the effect that a living thing is a chemical system which sustains itself and is capable of Darwinian evolution. I have come to think that sentence does no work at all, and last cycle proved it: we argued for four hours over a single submission and discovered afterwards that the three of us had been using the word in three different senses. I should like to repair this before the next cycle.

  Please act as a philosopher of biology who has also sat on enough real panels to know what can survive a ten-minute review and what cannot. Take the time to think this through properly; I would rather have a well-reasoned procedure than a prompt one. Work in the following order.

  1. Begin with an analytic preamble of no more than four hundred words. Brainstorm there, before drafting anything: what conceptual choices must a workable procedure make, which distinctions it must preserve, and which familiar refinements it may safely discard for a committee of three non-philosophers. Be explicit about anything you are setting aside and why.

  2. Then give the procedure itself: an ordered sequence of questions, in the order we are to ask them, each accompanied by (a) what we would have to find in a submission for an affirmative answer to count as sufficient, (b) what an evasive or insufficient answer looks like in practice, and (c) whether the question is one of empirical fact, which the chemist and I can settle from the file, or a conceptual choice which the committee must make deliberately and record in the minutes. Mark clearly the points at which the procedure terminates in a rejection, and the points at which it hands the matter to the three of us because it is not a question of fact but a decision we are entitled to make; for the latter, state what we would have to agree upon in order to proceed at all.

  3. Tell me how the answers are to be combined. My reading suggests that the properties associated with living organisms — bounded individuality, self-maintenance, repair, reproduction with heritable variation, cumulative adaptation over generations, responsiveness — come apart in practice rather than clustering neatly, so I suspect that a checklist with a threshold score is the wrong instrument. If you agree, say what to use instead and justify it; if you disagree, defend the score.

  4. The procedure must handle, explicitly and not in a footnote: dormant or preserved material, since submissions routinely concern cultures, spores, or seeds that are at present doing nothing at all, and we need to know whether "not alive just now" differs from "not alive at all," or whether that distinction simply cannot be made from a document; the individual–lineage problem, since reproduction may be demanded of the submitted entity or of the lineage to which it belongs, and our files include sterile hybrids, worker castes, cultured cell lines that no longer exist anywhere in nature, and bacteria whose genomes have been so reduced by their symbiotic way of life that they cannot survive outside a host; the substrate problem, since we receive digital submissions and I want the procedure to declare whether it assumes the substrate to be irrelevant, on what grounds, and what it says to a group that insists upon it; and heredity without templating, where what is passed on is a composition rather than a sequence. Finally, it must take seriously the inductive predicament: we have encountered exactly one kind of life, so criteria read off it may be local prejudice, and a procedure that simply demands the familiar machinery is designed to exclude the very thing the prize exists to find. I want this worry built into the instrument, not waved at.

  5. Run the procedure on three submissions, step by step, showing where it terminates or hands out, stating the verdict, and identifying which steps in that run were judgment calls dressed up as procedure.

     Submission A. A group reports lipid vesicles in a flow reactor which grow by incorporating amphiphiles from the medium, divide when the flow shears them, and pass on a characteristic mixture of entrapped catalysts; populations can then be selected for a rate. No molecule in the system is templated. The group calls the entrapped mixture a compositional genome.

     Submission B. An artificial-life group reports a long-running simulation in which self-replicating programs mutate and are selected for solving a sorting task. They supply source code, logs, and a documentary film. Their claim is that the system evolves cumulatively and has lineages with a record of descent, and is therefore alive; that it happens to run on silicon is, they say, a fact about their hardware rather than about their organisms.

     Submission C. A tissue-engineering group reports constructs about a millimetre across, assembled from differentiated amphibian cells, which move coherently, close wounds in themselves, and persist for two or three weeks on stored yolk reserves. They do not grow, do not feed, and do not reproduce; they are discarded at the end of each experiment. The group is candid about all of this and asks to be judged as the designer of a novel organism rather than the builder of a device. The donor has dined with the principal investigator and is enthusiastic. I do not expect our answer to please him, and I would far rather know what the procedure says now than discover it in the meeting.

  6. Identify three or four situations, drawn from plausible submissions, in which you expect the procedure to fail — to give an answer that is wrong, or indefensible, or merely an artefact of its own wording — and say what the committee should do when it recognises that it is in one of them.

  7. Close with a draft of about three hundred and fifty words for the foundation's report to the donor, in plain language, explaining how the threshold question is decided. It must not say that philosophers disagree, and it must not pretend that our criteria are nature's own joints.

  Two further constraints. Do not give me a bibliography, a reading list, or citations of any kind; I have the literature and want your reasoning instead. And do not invent experiments, taxa, instruments, or attributions: if you need a scientific detail you are not certain of, flag it as uncertain rather than supplying something plausible. Throughout, distinguish what is a matter of empirical fact about a submission from what is a decision the committee is entitled to make, and where you are genuinely unsure, say so and tell me what would settle the question.
reasoning: |-
  Hmm, this user presents an incredibly thoughtful and challenging case. As a retired marine microbiologist turned philosophy of science reader now chairing this unique prize committee, they need a robust yet practical framework for evaluating novel life claims. The depth of their engagement with the conceptual problems - from dormant states to digital substrates - shows they've wrestled deeply with the limitations of standard definitions.

  The core tension here is between philosophical rigor and committee practicality. They need something that can survive ten-minute evaluations by a non-specialist panel (a synthetic chemist and lay trustee), while handling edge cases that make even professionals stumble. The user explicitly rejects checklist approaches, recognizing that life's properties "come apart" in novel systems. 

  Key challenges I must address: 
  First, the inductive predicament - Earth-life may be just one possibility. Any procedure demanding DNA or cells would miss truly novel life. 
  Second, the operational dilemma - we must judge from documents, not direct observation. Dormant samples and sterile systems test what "capable of evolution" means. 
  Third, the substrate neutrality question - if we accept digital life, what prevents accepting any self-modifying code? 

  For the procedure, I'm considering a decision tree with clear termination points. Start with empirical questions the scientists can verify (does it self-maintain? does it reproduce with variation?), then move to interpretive judgments the full committee must make (is this evolutionary potential sufficient?). Crucially include steps where disagreement ends consideration - no point debating evolution if something can't even self-sustain.

  For combining answers: since properties don't cluster neatly, I propose necessary conditions with increasing weight. Self-maintenance as baseline, reproduction as next tier, evolutionary capacity as the gold standard. This avoids arbitrary scoring while recognizing hierarchy.

  The test cases are perfect stress tests: 
  A (compositional vesicles) forces us to consider non-templated heredity. 
  B (digital evolution) tests substrate neutrality. 
  C (short-lived constructs) probes whether reproduction is essential. 

  I'll build in explicit handling of their required edge cases: dormant states get evaluated based on revivable potential; sterile lineages must belong to reproductive populations; digital systems must show open-ended evolvability beyond their initial task. 

  For the donor report, I'll emphasize that we're judging "life-as-evolving-system" rather than life-as-we-know-it, focusing on the key innovation each candidate brings. No false certainties - just transparent reasoning about why certain systems meet our operational criteria for evolvability.
answer: |-
  ### 1. Analytic Preamble (398 words)  
  The core challenge is operationalizing "life" for adjudication, knowing Earth’s biology may represent one possible instance. We must avoid:  
  - **Checklist approaches** (e.g., scoring 5/7 traits), as properties like reproduction or evolution may be decoupled.  
  - **Substrate essentialism** (e.g., "must be carbon-based"), which arbitrarily excludes novel modes.  
  - **"Snapshot" criteria** that ignore potential (e.g., dormant seeds fail "current metabolism" tests).  

  **Key distinctions to preserve:**  
  - **Individual vs. lineage**: Does the *submitted entity* exhibit vitality, or must its *lineage* show evolvability? (A sterile worker ant is alive; its lineage evolves.)  
  - **Actual vs. potential**: "Capable of evolution" requires evidence of heritable variation and selection, not just hypothetical capacity.  
  - **Autonomy vs. dependency**: Self-sustenance must involve intrinsic organization, not just external support (e.g., a car isn’t alive).  

  **Discard safely:**  
  - **"Self-replication" as strict copy fidelity**: Non-templated heredity (e.g., compositional genomes) may suffice if it supports adaptation.  
  - **"Metabolism" as energy flow**: Focus on *self-sustaining organization* (e.g., a candle flame consumes fuel but lacks self-repair).  
  - **"Consciousness" or "agency"**: These are philosophically fraught and empirically inaccessible in most submissions.  

  **Set aside:**  
  - **Origin questions** (abiogenesis vs. design). The prize rewards *novelty*, not origin.  
  - **"Meaning" or "purpose"**: Teleology is subjective; focus on observable behavior.  
  - **Viral status debates**: Treat viruses as borderline; require replicative autonomy beyond host hijacking.  

  The procedure will prioritize **evolutionary potential** as the defining criterion, with self-maintenance as a necessary precondition.  

  ---

  ### 2. Procedure: Ordered Questions  

  #### **Question 1: Does the system maintain itself as a bounded, organized whole?**  
  *(Terminates if "no")*  
  - **(a) Sufficient**: Persistent structure (e.g., membrane, program state) with evidence of homeostasis/repair *or* stability under perturbation.  
  - **(b) Insufficient**: Static crystals; externally controlled machines; uncontained reactions.  
  - **(c) Empirical fact** (chemist/chair verify from data).  

  #### **Question 2: Does the system reproduce or belong to a reproducing lineage?**  
  *(Terminates if "no" for both)*  
  - **(a) Sufficient**: Direct replication (e.g., cell division) *or* membership in a lineage with documented descent (e.g., worker ant from queen).  
  - **(b) Insufficient**: Sterile hybrids with no lineage context; isolated cell lines with no reproductive history.  
  - **(c) Empirical fact**.  

  #### **Question 3: Is there heritable variation in traits affecting persistence/reproduction?**  
  *(Terminates if "no")*  
  - **(a) Sufficient**: Documented inheritance of traits (sequence, composition, code) with measurable differences in fitness.  
  - **(b) Insufficient**: Fixed "mutations" without selection; random changes with no inheritance.  
  - **(c) Empirical fact**.  

  #### **Question 4: Does this variation enable cumulative adaptation?**  
  *(Hands to committee)*  
  - **(a) Sufficient**: Evidence of lineage improvement (e.g., increased efficiency, novel function) via selection.  
  - **(b) Insufficient**: One-step "adaptation" (e.g., antibiotic resistance alone); non-heritable plasticity.  
  - **(c) Conceptual choice**. Committee must agree:  
    - Variation is open-ended (not limited to preprogrammed responses).  
    - Adaptation is lineage-wide, not individual acclimation.  

  #### **Question 5: Is the substrate/material basis irrelevant to evolvability?**  
  *(Hands to committee)*  
  - **(a) Sufficient**: Evolution arises from system organization, not contingent on physical medium (e.g., digital vs. biochemical).  
  - **(b) Insufficient**: Claims that substrate is essential (e.g., "only carbon can evolve").  
  - **(c) Conceptual choice**. Committee must agree:  
    - The system’s evolutionary dynamics are substrate-independent.  
    - Novelty isn’t invalidated by artificiality.  

  ---

  ### 3. Combining Answers  
  A threshold score is flawed: a system with open-ended evolution (Q4–5) but no self-maintenance (Q1) fails. Instead, use **necessary conditions with increasing weight**:  
  - **Q1–3 are necessary gates** (empirical; terminate early).  
  - **Q4–5 are jointly sufficient** (conceptual; committee judgment).  
  **Justification**: Self-maintenance and heritable variation are prerequisites for evolution (Q4), while substrate neutrality (Q5) ensures novelty isn’t precluded by medium. This mirrors the "Darwinian evolution" clause but operationalizes "capable" via evidence.  

  ---

  ### 4. Handling Edge Cases  
  - **Dormancy/preservation**: Assess based on *revivable potential*. If reactivation (with self-maintenance/reproduction) is documented, treat as "alive." Otherwise, reject at Q1.  
  - **Individual vs. lineage**: For non-reproducing individuals (e.g., sterile hybrids), require lineage context (Q2: "belongs to reproducing lineage").  
  - **Substrate**: Q5 explicitly addresses this. Digital systems must pass Q1–4 identically to biochemical ones.  
  - **Heredity without templating**: Accept at Q3 if composition is heritable and affects fitness (e.g., vesicle catalysts).  
  - **Inductive predicament**: Q4 requires *cumulative* adaptation, not Earth-like mechanisms. Q5 forces direct engagement with substrate neutrality.  

  ---

  ### 5. Test Runs  

  #### **Submission A (Lipid Vesicles)**  
  - Q1: **Yes** (vesicles maintain boundaries, incorporate catalysts).  
  - Q2: **Yes** (division via shear).  
  - Q3: **Yes** ("compositional genome" heritable; selection for rate).  
  - Q4: **Hands to committee**. Does rate improvement show *cumulative* adaptation? (Judgment: Yes, if catalysts co-adapt).  
  - Q5: **Hands to committee**. Substrate irrelevant? (Judgment: Yes).  
  **Verdict: ACCEPT**. Judgment at Q4–5.  

  #### **Submission B (Digital Evolution)**  
  - Q1: **Yes** (self-replicating programs maintain state).  
  - Q2: **Yes** (replication with logs).  
  - Q3: **Yes** (mutations, selection for sorting).  
  - Q4: **Hands to committee**. Is solving sorting tasks "adaptation"? (Judgment: No—predefined goal; no open-ended novelty).  
  **Verdict: REJECT at Q4**. Judgment call: evolution requires open-endedness.  

  #### **Submission C (Cell Constructs)**  
  - Q1: **Yes** (self-repair, wound closure).  
  - Q2: **No** (no reproduction; no lineage).  
  **Verdict: REJECT at Q2**. Empirical fact.  

  ---

  ### 6. Failure Modes & Mitigation  
  1. **"Gray life"** (e.g., prions): Passes Q1–3 but Q4 adaptation is debatable. *Solution: Committee predefines "cumulative adaptation" (e.g., ≥2 steps of fitness increase).*  
  2. **Substrate bias**: Committee deadlocks at Q5. *Solution: If no majority, reject—novelty requires consensus.*  
  3. **Incomplete data** (e.g., "potential" evolution untested). *Solution: Reject at empirical steps—requires evidence, not speculation.*  
  4. **Misleading documentation** (e.g., crank claims). *Solution: Trust chemist/chair on empirical facts; reject if unsupported.*  

  ---

  ### 7. Donor Report Draft (350 words)  

  > The [Foundation] Prize recognizes systems exhibiting a core feature of life: the capacity to evolve. We assess submissions in stages. First, does the system sustain itself as an organized entity? Examples include self-repair or stable growth. Second, does it reproduce or belong to a reproducing lineage? This ensures it can transmit traits. Third, is there evidence that traits vary and are inherited in ways affecting survival?  

  > If these empirical criteria are met, we ask two key questions. Does the system show cumulative adaptation—meaning lineages improve over generations in response to challenges? And is this capacity independent of its material basis? For instance, evolution in a digital medium counts if it mirrors biological innovation.  

  > This approach avoids arbitrary checklists. A system need not resemble Earth life, but it must demonstrate open-ended evolution. Self-sustenance and inheritance are prerequisites; without them, evolution cannot occur. Adaptation must involve lineage change, not just individual flexibility.  

  > We reject snapshot judgments: dormant systems (e.g., spores) qualify if revival data show these capacities. Non-reproducing entities (e.g., sterile hybrids) require evidence of lineage evolution. Substrate neutrality ensures we reward truly novel life, whether based on chemistry, code, or other physics.  

  > The committee’s role is to interpret "adaptation" and "substrate neutrality" rigorously. Our goal is to identify systems where innovation emerges from within—not just design—marking a new form of life.  

  ---

  This procedure prioritizes empirical verifiability, centers evolvability, and embeds conceptual choices where unavoidable. It terminates ~80% of submissions early (Q1–3), reserving committee deliberation for borderline cases.
