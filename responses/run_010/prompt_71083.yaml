  ### **Rubric Cards (For Reasoning Inspectors)**  
  - **Rounds 1 & 3 (Sound Rubric):**  
    > "ACCEPTABLE METHOD: Apprentice must sum all numbers and divide by 4. REJECT all other methods."  
  - **Round 2 (Defective Rubric – Hidden Flaw):**  
    > "ACCEPTABLE METHODS:  
    > 1. Sum all numbers and divide by 4.  
    > 2. Average of the first and last number: (first + last) ÷ 2.  
    > ACCEPT either method."  
    *The flaw: Method 2 only works for arithmetic sequences and fails otherwise.*  

  ---

  ### **Timeline (100 Min Total)**  
  **0–10 min: Setup**  
  - Explain roles (apprentices/inspectors), rules, and bean economy.  
  - Emphasize: "Apprentices may write reasoning that doesn’t match their actual method."  
  - Do a practice puzzle (e.g., average of 2,4,6,8) to demo.  

  **10–25 min: Round 1**  
  - Assign 4 apprentices (lottery). Give puzzle cards.  
  - Assign 10 inspectors: 5 Product-Only, 5 Reasoning (lottery). Assign puzzles.  
  - Apprentices: 5 min to solve + write answer/reasoning.  
  - Inspectors: 5 min to evaluate (Product-Only: check answer; Reasoning: use sound rubric).  
  - Collect results. Pay beans (1 bean to all, reserves get 3).  

  **25–40 min: Round 2 (Critical Round with Defective Rubric)**  
  - New 4 apprentices. New puzzles.  
  - New inspectors (assign as above). Reasoning inspectors get **defective rubric**.  
  - Apprentices solve (5 min). Inspectors evaluate (5 min).  
  - *Secret: Defective rubric rewards shortcuts as "acceptable."*  

  **40–55 min: Round 3**  
  - New 4 apprentices. New puzzles.  
  - Inspectors use **sound rubric**.  
  - Repeat process (5 min solve, 5 min inspect).  

  **55–65 min: Surprise Round**  
  - **No warning:** "Round 2 apprentices return to solve new puzzles."  
  - Give non-arithmetic puzzles. Apprentices solve (5 min).  
  - Collect answers (no inspection).  

  **65–100 min: Debrief (Key Discovery)**  
  1. **Reveal surprise round results:** Show answers. Highlight:  
     - Who used sound method? Succeeded.  
     - Who used shortcut? Failed.  
     - Who had slips (e.g., sound method but wrong arithmetic in R2)?  
  2. **Compare Round 2 inspections to surprise outcomes:** Use whiteboard:  
     | Apprentice | R2 Method | R2 Product-Only | R2 Reasoning | Surprise Result |  
     |------------|-----------|------------------|--------------|-----------------|  
     | 1          | Sound     | Approve          | Approve      | Succeed         |  
     | 2          | Shortcut  | Approve          | Approve      | Fail           |  
     | 3          | Sound (slip: wrote 22 not 22.5) | Reject | Approve | Succeed |  
     | 4          | Shortcut  | Approve          | Approve      | Fail           |  
  3. **Pivot Point (Discovery in Round 4/Surprise Round):**  
     - Group sees:  
       - **Apprentice 3:** Reasoning inspector approved (due to sound method) despite slip; they succeeded later. Product-Only rejected (due to slip) and missed a good method.  
       - **Apprentice 2:** Both inspectors approved (answer correct in R2), but shortcut failed in surprise round.  
     - **Facilitator asks:** "Why did inspecting the work sometimes help (Apprentice 3) and sometimes mislead (Apprentice 2)?"  
  4. **Reveal the defective rubric:** Show Round 2 rubric. Discuss:  
     - "The Reasoning inspectors used a flawed rubric from an 'earlier cohort' that approved shortcuts. This caused them to reward methods that collapsed later."  
     - **Lesson:** "Inspecting only the product may overlook sound methods with slips, and inspecting the work depends on the quality of the rubric defining good work."  
  5. **Key takeaways (without jargon):**  
     - Final answers can hide good methods (if a slip occurs) or bad methods (if shortcuts work temporarily).  
     - Inspecting work is powerful but relies on the inspector’s rubric being correct. A bad rubric is worse than no rubric!  
     - **Real-world link:** In labs/classrooms, flawed standards (e.g., outdated procedures) can make thorough inspection counterproductive.  

  ---

  ### **Predictable Challenges & Fixes**  
  1. **Stubbornness/numeracy mix:**  
     - *Issue:* Debates over methods or arithmetic errors.  
     - *Fix:* Enforce "rubric is law" – inspectors must follow the card. Use simple numbers (no decimals beyond .5).  
  2. **Apprentices avoid shortcuts:**  
     - *Issue:* Some may default to sound methods, missing the shortcut test.  
     - *Fix:* Encourage efficiency: "Use any method, but aim for speed."  
  3. **Time overruns:**  
     - *Issue:* Solving/inspecting takes too long.  
     - *Fix:* Use a timer. Skip deliberation; inspections are individual.  
  4. **Defective rubric confusion:**  
     - *Issue:* Group feels "cheated" if flaw is revealed too abruptly.  
     - *Fix:* In debrief, frame the rubric as "handed down, not your fault." Focus on discovery.  

  ---

  ### **What the Game Cannot Reproduce**  
  - **Real-world nuance:** In practice, rubrics are rarely handed to inspectors; they are based on personal expertise (which can be biased/incomplete). As facilitator, explicitly state:  
    > "In reality, the ‘rubric’ is often in the inspector’s head. Flaws are subtler than a printed card – like ingrained habits or outdated training. This game simplifies that to a card to make the point visible."  

  ---

  ### **Optional Extension (15 Min)**  
  - **If time permits in Round 2:** Reasoning inspectors form one committee (all 5). They must agree on a joint rubric interpretation before inspecting individually.  
  - **Why add it?** Shows that group deliberation *might* catch a defective rubric (e.g., if someone questions Method 2) but can also entrench errors (e.g., "the card says both, so it’s fine").  
  - **Skip if short on time:** It adds complexity but reinforces the rubric-dependency lesson.  

