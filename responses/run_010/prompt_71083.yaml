  ### **Puzzle Cards (Generate in Advance)**  
  **Rules for Apprentices:**  
  - Solve the puzzle. Write the answer and reasoning on a card.  
  - Use any method: Sound, shortcut, or even fake reasoning (e.g., write a shortcut if you used the sound method).  
  - Goal: Be efficient (no time pressure, but realism).  

  **Round 1 (Arithmetic Sequences – Rubric: Sound Only):**  
  1. Apprentice 1: Average of 10, 20, 30, 40. (Answer: 25)  
  2. Apprentice 2: Average of 5, 10, 15, 20. (Answer: 12.5)  
