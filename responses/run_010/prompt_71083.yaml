answer: |-
  Below is a complete, ready-to-run activity designed for your group of 14, requiring only simple arithmetic and no prior machine learning knowledge. The activity explores the trade-offs between inspecting only the final answer versus inspecting the answer and reasoning, with a critical twist involving a defective rubric. The design ensures discovery through experience, minimizes idle time, and uses beans as a lightweight incentive. The pivot point (where the difference between product and work inspection becomes clear) is identified at the end.

  ---

  ### **Activity: The Inspection Game**
  **Core Question:** When evaluating an answer, is it better to check only the final result or the reasoning behind it? And how does the quality of the inspection rubric affect the outcome?

  **Participants:** 14 people (split into roles each round).  
  **Duration:** 100 minutes.  
  **Materials:**  
  - Index cards (60+): For puzzles, answers, and rubrics.  
  - Printer (or pre-written cards): For generating puzzles and rubrics.  
  - Whiteboard: To track rounds, roles, and results.  
  - Jar of dried beans: Currency for incentives (no emphasis on "winning").  
  - Timer: For timed rounds.  
  - Pens: For writing solutions.  

  **Puzzle Design:**  
  - Simple arithmetic puzzles: Finding the average of four numbers.  
  - Two types of sequences:  
    - **Arithmetic sequences (Rounds 1–3):** Evenly spaced numbers (e.g., 10, 20, 30, 40). Sound method (sum all, divide by 4) and shortcut method (average of first/last) *both* work here.  
    - **Non-arithmetic sequences (Surprise Round):** Unevenly spaced numbers (e.g., 10, 20, 30, 50). Shortcut fails; only sound method works.  
  - Each puzzle has one correct answer (calculable mentally).  

  ---

  ### **Role Assignments & Flow (No idle time)**
  - **14 people split per round:**  
    - **4 Apprentices:** Solve puzzles.  
    - **10 Inspectors:** 5 "Product-Only" (see puzzle + answer) and 5 "Reasoning" (see puzzle + answer + written reasoning).  
      - Assign roles by drawing lots each round (ensures everyone experiences all roles).  
      - **Puzzle assignment:** Each of the 4 puzzles is inspected by 1 Product-Only and 1 Reasoning inspector (uses 4 of each type).  
      - **Leftover inspectors (2 per round):** "Reserves" (get 3 beans, no inspection duties). Rotate who is reserve to ensure fairness.  
  - **Rounds 1–3 (15 min each):**  
    - Apprentices solve arithmetic puzzles.  
    - Inspectors evaluate based on their role (Product-Only approve if answer correct; Reasoning use rubric).  
  - **Surprise Round (10 min):**  
    - Round 2 apprentices return to solve new, non-arithmetic puzzles (no inspectors). Outcomes reveal which methods were sound.  
  - **Bean Payoff (Lightweight, not competitive):**  
    - All participants: 1 bean per round for participation.  
    - Round 2 inspectors: +5 beans if **their assigned apprentice succeeds in the surprise round** (ties inspection to long-term reliability).  
    - Reserves: 3 beans/round (1 participation + 2 reserve fee).  

