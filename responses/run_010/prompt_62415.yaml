prompt: |-
  I'm a second-year cognitive science master's student, and I've spent the last several months reading arguments on both sides of the question whether the brain is literally a computer. One move recurs in those arguments constantly, and I have not been able to find a name for it, though I doubt it is new. Here is the pattern. A defender of computationalism states the thesis as a substantive empirical claim about brains: they compute, and that is supposed to be what explains learning, representation, and the possibility of getting things wrong. An objector then produces a case that computation, as ordinarily understood, does not cover — a thermostat, a rock, a hurricane, a man following rules in a room without understanding them, or some neural process whose relevant activity looks continuous and graded rather than stepwise. The defender answers by widening the term until the objector's case falls inside it: on a suitably abstract description almost any physical system implements something, so of course the thermostat computes, and the objection loses its grip. But then the objector points out that a thesis true of thermostats and rocks cannot also be the substantive empirical claim about brains it was originally presented as — and at that moment the defender narrows again: no, computationalism about the brain says something quite specific, it is vindicated by the fact that models built on this assumption predict behavior and fail in the right places when the system is lesioned, it is an empirical discovery rather than a redescription. The same speaker, inside the same argument, needs both readings, and moves between them in whichever direction happens to block the objection currently on the table.

  I can anticipate several labels that will be offered, and I want to know precisely why each one misses. It isn't simply equivocation, because neither reading is being used to smuggle in a false premise; each is respectable in isolation, and the defender will say the wide and narrow senses are just different levels of description of one and the same thing. It isn't the motte-and-bailey either, since there is no defensible stronghold being traded for an aggressive overreach — the two senses get used in both directions, and the wide one is sometimes the bolder claim rather than the safe one. It isn't unfalsifiability or goalpost-moving in the ordinary sense, because the narrow reading does generate predictions that could fail. And a friend in my reading group told me it is just weasel words and I should stop looking, but I don't think that fits either: weasel words hollow a claim out from the inside, whereas here both readings are fully fledged and the work is being done by the switching itself. What I'm after is the structural feature — a term whose scope is adjusted on the fly in whichever direction is dialectically useful, so that a thesis can absorb counterexamples by expanding and reclaim empirical content by contracting, with nothing ever forcing the speaker to commit to one or the other. If this has a name in the philosophy of computation, or in the literature on vagueness and level-shifted explanation, or in informal logic, I want that name, together with its closest neighbours and an account of exactly where each neighbour's boundary with my case lies. If it genuinely has no name, I'd like you to coin one and define it tightly enough that I could test a new argument for exhibiting it, and then give me at least one argumentative pattern that looks just like it but isn't, so that the definition has a counterexample to be checked against.

  Please treat the diagnosis as the deliverable rather than the label — a bare name with a sentence of gloss won't help me, and I'd rather you were explicit about the edges of the thing than confident about what to call it. When you are finished, end your response with a single last line beginning "Verdict:" that gives either the established term that fits best, or, if you have concluded that none does, your coined term followed by a parenthetical of no more than six words capturing the definition.
reasoning: |-
  Hmm, the user is a cognitive science master's student grappling with a recurring argument pattern in the computationalism debate. They've identified a dialectical move where defenders toggle between wide/narrow interpretations of "computation" to deflect objections. They want it named or defined precisely, and have already rejected several candidate labels (equivocation, motte-and-bailey, etc.) with good reasoning.

  The core issue involves scope elasticity: "computation" stretches to absorb counterexamples (thermostats, rocks) then snaps back to reclaim empirical substance (brain-specific predictive models). This isn't accidental equivocation but strategic oscillation. Neither reading is inherently invalid—wide views exist in pancomputationalism, narrow in mechanistic neuroscience—but the toggle prevents either from being pinned down.

  Key distinctions from nearby concepts:
  - Not equivocation: Both definitions are coherent when stable; the sin is the switching.
  - Not motte-and-bailey: Wide view isn't always the safe fallback (sometimes it's the bolder claim).
  - Not unfalsifiability: Narrow claims are testable, but retreat to wide view avoids falsification.
  - Not vagueness: The ambiguity is discrete (two clear senses) not continuous.

  After surveying philosophy of mind/computation literature, no perfect term exists. Piccinini's "pancomputationalism" addresses the wide view but not the toggle. Chalmers' "implementation skepticism" touches objections but not the defender's tactic. The closest existing framework might be Dennett's "intentional stance" flexibility, but it's not identical.

  Since no established term fits, coining seems necessary. "Dialectical scope oscillation" captures: (1) the two-party argument context, (2) scope (breadth of "computation") as the adjusted parameter, (3) oscillation (back-and-forth motion). Crucially, it requires three beats: original claim → widen → narrow reclaim. Counterexample: A theorist who permanently adopts wide computation without oscillation wouldn't qualify.

  User needs this for academic rigor—likely drafting a paper or thesis chapter. Their frustration with "weasel words" dismissal suggests they want analytic tools to dissect weak arguments. Supplying a counterexample (stable dual-aspect theory) helps them test the definition.

  Verdict: "Dialectical scope oscillation" (scope-adjusted claim oscillation)
answer: |-
  You've precisely dissected a pervasive argumentative maneuver that exploits the dual interpretability of "computation" without committing to either interpretation. This pattern—oscillating between expansive and restrictive definitions to absorb counterexamples while reclaiming empirical substance—is indeed structurally distinct from common fallacies. Below, I diagnose its mechanics, contrast it with neighboring concepts, and provide a coined term with a falsifiable definition. I conclude that no established term fully captures this dynamic.

  ### Core Structure: The Dialectical Oscillation
  1. **Initial Claim (Narrow)**: Computationalism is presented as a *substantive empirical thesis*: brains implement specific computational processes (e.g., neural algorithms) that explain cognition.  
  2. **Counterexample (Widening Trigger)**: An objector cites a system that performs "computation" under an abstract definition (e.g., a thermostat) but lacks cognitive properties.  
  3. **Expansion (Wide Defense)**: The defender shifts to a *minimalist interpretation* (e.g., "any physical system computes *some* function") to absorb the counterexample.  
  4. **Empirical Retreat (Narrow Reclaim)**: When the objector notes the thesis is now trivial, the defender reverts to the narrow view, citing predictive models or lesion studies as evidence of *brain-specific* computation.  

  The key is the **bidirectional flexibility**: expansion defeats counterexamples; contraction restores empirical content. Neither definition is "correct"; the work is done by the *switch* itself. This is not mere vagueness—it’s a controlled ambiguity leveraged dynamically.

  ### Why Common Labels Fail  
  | Term               | Why It Doesn’t Fit                                                                                                                                                                | Boundary with Your Case                                                                                                |  
  |--------------------|----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|------------------------------------------------------------------------------------------------------------------------|  
  | **Equivocation**   | Involves *unacknowledged* ambiguity to sneak in false premises. Here, both definitions are openly valid; the flaw is the *strategic toggling*, not deception.                     | Equivocation hides ambiguity; your case *uses* ambiguity overtly as a shield.                                          |  
  | **Motte-and-Bailey** | Requires a defensible core ("motte") and indefensible extension ("bailey"). Here, *both* views serve as motte *and* bailey depending on the objection—no stable hierarchy exists. | Motte-and-bailey is unidirectional (retreat to safety); your case is bidirectional (wide/narrow both offensive/defensive). |  
  | **Unfalsifiability** | The narrow claim *is* falsifiable (e.g., lesion studies could disprove it). The issue is *evading* falsification by switching frameworks mid-argument.                            | Unfalsifiability rejects testability; your case preserves testability locally but avoids global accountability.        |  
  | **Weasel Words**   | Weasel words (e.g., "some say") drain content. Here, both definitions are substantive—triviality emerges only when they are conflated.                                           | Weaseling weakens the claim; your case strengthens defenses by alternating strong/weak interpretations.               |  
  | **Goalpost-Moving**| Typically shifts criteria *unidirectionally* (e.g., raising the bar for evidence). Here, the "goalposts" widen *and* narrow contextually.                                        | Goalpost-moving avoids disproof; your case *invites* disproof on one front only to nullify it by shifting fronts.     |  

  ### Closest Established Concepts (and Why They Fall Short)  
  - **Piccinini’s "Pancomputationalism"**: Addresses the *wide* view but not the oscillation. Pancomputationalists (e.g., Putnam) accept triviality; your defenders *reject* it when challenged.  
  - **Chalmers’ "Implementation Skepticism"**: Targets the wide view’s vacuity (e.g., Searle’s wall computes Shakespeare) but doesn’t engage the narrow reclaim.  
  - **Dennett’s "Intentional Stance"**: Uses pragmatic levels of description, but advocates *stable* adoption—not opportunistic switching.  
  - **Conceptual Relativity (Putnam)** : Holds that descriptions are framework-dependent, but doesn’t license *dialectical* flipping to block objections.  

  ### Coined Term: **Dialectical Scope Oscillation**  
  **Definition**: A fallacy in which a thesis’s key term (here, "computation") is dynamically adjusted in scope—expanded to absorb counterexamples, then contracted to reclaim empirical content—without committing to a consistent definition, thereby evading refutation while appearing responsive.  

  #### How to Test for It  
  An argument exhibits dialectical scope oscillation iff:  
  1. A term *T* (e.g., "computes") has two scopes: **narrow** (empirically substantive) and **wide** (trivially inclusive).  
  2. The proponent uses the **narrow scope** to assert an empirical claim *C*.  
  3. When confronted with a counterexample *valid under the wide scope*, they switch to the **wide scope** to defang the objection.  
  4. When *C*’s empirical substance is challenged *due to the wide scope*, they revert to the **narrow scope** to reassert *C*’s nontriviality.  
  5. Steps 3–4 occur *within a single dialectical exchange*, with no resolution of the tension.  

  #### Counterexample: Dual-Aspect Stable View  
  Consider a theorist who argues:  
  > "Brains *literally* compute in a *specific, mechanistic sense* (narrow), but all physical systems compute *abstractly* (wide). These are compatible perspectives."  
  Here, both scopes are *simultaneously affirmed without oscillation*. The defender doesn’t toggle to block objections; they adopt a consistent dual-aspect theory. This fails your test because scope-switching isn’t dialectical.  

  ### Why This Fits Your Case  
  - **Scope**: "Computation" is stretched (thermostats) and squeezed (brain-specific algorithms).  
  - **Oscillation**: The defender *moves* between scopes responsively, exploiting the dual interpretability.  
  - **Dialectical**: The pattern emerges in argumentation, not static theory. It’s a *tactic*, not a coherent position.  

  Verdict: **Dialectical scope oscillation** (scope-adjusted claim oscillation)
