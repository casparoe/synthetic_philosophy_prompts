  We are creating an activity set in the fictional town of "Millford" centered around a factory fire that occurred in 1963. The event is known locally as the "Millford Mill Fire" and the town council is planning to put up a plaque to commemorate the event. Participants will be divided into small groups (about 4-5 people per group) and each group will receive an envelope of source cards. The goal is to agree on a plaque wording (with a strict word limit of 50 words) that must be traceable to the provided sources. Halfway through the activity, we introduce a second envelope with a new document that complicates the narrative.

  **Core Conflict**: 
  The documentary sources (council minutes, ledger, newspaper) will present a version of events that emphasizes the official response and downplays any negligence or controversy. The oral history testimonies (from interviews conducted in the 1980s and 1990s) will be vivid but inconsistent, pointing to a cover-up of unsafe conditions and possibly a higher death toll than officially recorded. The contradiction is not in the numbers (which are the same in the documents) but in the cause and the aftermath. The documents state the fire was due to an electrical fault and that all safety procedures were followed, while the testimonies suggest that the fire was caused by a lit cigarette in a no-smoking area (due to flammable materials) and that safety equipment (fire extinguishers) had been removed for maintenance and not replaced.

  **Second Envelope**: 
  This will be a fire department logbook entry that reveals the fire department had reported the missing fire extinguishers to the management just a week before the fire, contradicting the council minutes that state all safety procedures were followed.

  **Source Cards (Envelope 1):**

  1. **Council Minute (dated 15th May 1963)**: 
     "Meeting of Millford Town Council. Item 7: Millford Mill Fire. The tragic fire at the mill on 10th May 1963 resulted in the loss of 8 lives. The fire was caused by an electrical fault. The council notes that all safety procedures were in place and followed. A fund for the families has been established. The council extends its deepest sympathies to the bereaved."

  2. **Page from the Mill's Ledger (dated 8th May 1963)**: 
     "Maintenance Log: 8 May 1963. Electrical system in the west wing (spinning room) inspected and found to be in good order. No issues reported. Signed: T. Wilkins, Electrician."

  3. **Local Newspaper Article (dated 11th May 1963)**:
     "TRAGEDY AT MILLFORD MILL: Fire broke out yesterday at the Millford Mill, claiming the lives of 8 workers. The fire, which started in the spinning room, is believed to have been caused by faulty wiring. The mill's owner, Mr. Henry Groves, expressed his shock and grief, stating, 'We have always prioritized safety. This is a devastating blow to our community.'"

  4. **Photograph Caption (attached to a photo of the burned mill, from the council archives, dated 20th May 1963)**:
     "Millford Mill after the fire of 10th May 1963. The spinning room (west wing) was completely destroyed. 8 workers perished. The council has pledged to rebuild and support the affected families."

  5. **Transcript of 1985 interview with Mary Donovan (former mill worker, not present on the day)**:
     "I worked at the mill until a month before the fire. They had just moved the cotton waste bins right next to the electrical panels in the spinning room. It was a death trap. And the fire extinguishers? They'd been taken away for servicing two weeks before and never brought back. We all knew it was unsafe. But the bosses didn't care. They said we were making a fuss. Then that fire... I heard it started because someone dropped a cigarette. There were more than 8 dead, I tell you. They said 8, but I knew at least 10 who never came home."

  6. **Transcript of 1990 interview with George Harris (retired firefighter, now deceased)**:
     "We got the call at 3:15 PM. When we arrived, the west wing was engulfed. We fought the blaze for hours. The spinning room had these huge cotton bales, and the fire spread fast. I remember the manager, Mr. Groves, was there, shouting about the loss. He told the press it was an electrical fault, but I heard from the workers that it was a cigarette. And the extinguishers were missing. We'd actually been there the week before for a routine check and pointed out the missing extinguishers. They said they'd order new ones. Didn't happen in time."

  7. **Transcript of 1982 interview with Alice Peterson (widow of a mill worker)**:
     "My husband, Jack, died in that fire. He worked in the spinning room. The day before, he told me they'd run out of fire buckets and the extinguishers were gone. He said someone had been smoking near the waste bins. They weren't supposed to, but the supervisors did it too. After the fire, the council came and said it was an accident, an electrical fault. But Jack knew better. He said it was an accident waiting to happen. And I know for a fact that more than 8 died. They listed Jack as dead, but his friend Ben was also killed and they never put his name on the official list because he was a temporary worker. They only counted the full-timers."

  **Second Envelope (introduced halfway through):**

  8. **Fire Department Logbook Entry (dated 3rd May 1963)**:
     "Routine inspection at Millford Mill. Noted that 5 fire extinguishers in the west wing (spinning room) were missing. Manager (Mr. Groves) informed. He stated they were removed for servicing and would be replaced within the week. We issued a reminder to have them reinstated immediately. Follow-up scheduled for 10th May." (Note: 10th May is the day of the fire.)

  **Activity Flow:**

  1. Divide participants into groups of 4-5. Give each group the first envelope (cards 1-7).
  2. Explain the task: They are the plaque committee for Millford. They must agree on a plaque text (max 50 words) that commemorates the fire. Every factual claim must be traceable to a source card. They have 40 minutes to draft the plaque.
  3. After 20 minutes, hand out the second envelope (card 8). Tell them this document has just been discovered and they must now reconsider their plaque in light of this new evidence.
  4. Give them another 20 minutes to finalize the plaque.
  5. Each group reads out their plaque. Then, we debrief.

  **Debrief Points:**

  - **Community Memory vs. Documentary Record**: The oral testimonies (warm, vivid, but inconsistent) vs. the documents (precise, dated, but potentially self-serving). Neither trumps the other; they are different kinds of evidence.
  - **Gaps in the Archive**: The fire department logbook was missing until now. Without it, the council's version stood unchallenged. But the testimonies hinted at it. Also, the ledger shows an electrical inspection but doesn't mention the fire extinguishers.
  - **Institutional Shaping of Memory**: The council minutes and newspaper article shaped the public memory of the event. The plaque is another act of shaping memory.
  - **What the Cards Stage**: 
    - The inconsistency between oral and written sources.
    - The discovery of a new document that changes the narrative.
    - The challenge of writing a concise plaque that must be backed by evidence.
  - **What They Can't Stage**: 
    - The emotional weight of real community trauma (since it's fictional).
    - The long-term process of memory transmission (we only have one layer of oral history from the 80s/90s, not multiple generations).
    - The power dynamics that led to the suppression of the truth (we have hints but not the full context).

  **Roles?** 
  I recommend against assigning roles. With a mix of professionals and amateurs, roles might constrain the discussion or create unnecessary conflict. The goal is collaborative sense-making. However, if you want to add a layer, you could assign one person per group as the "council representative" (who wants to protect the town's image) and another as a "family representative" (who wants the truth about their relative). But given the group, I'd keep it simple and let the sources drive the conflict.

  **What Might Go Wrong:**

  1. **Groups Spot the Contradiction Too Quickly**: If they do, they might jump to a conclusion. Encourage them to read all the cards carefully and consider how to phrase the plaque without taking sides. The word limit forces them to make hard choices.

  2. **Groups Get Stuck on the Inconsistencies**: They might spend too much time arguing about what really happened instead of focusing on the plaque. Remind them that the plaque must be based on the sources and that they are not solving a mystery but crafting a commemoration within constraints.

  3. **The Second Envelope Causes Frustration**: Some might feel cheated by the new evidence. Acknowledge that this is part of historical research — new evidence can overturn old assumptions.

  4. **One Person Dominates**: Encourage everyone to contribute. You might set a rule that each person must suggest one source to include.

  5. **Groups Ignore the Word Limit**: Enforce it strictly. Have a word counter ready.

  **What the Setup Can't Reproduce (and You Must Explain):**

  - **The Emotional Resonance of Real Events**: Fictional events don't carry the same weight. You'll have to emphasize in the debrief that in real situations, these issues are deeply personal and can cause community rifts.

  - **The Role of Power in Shaping Records**: The documents we have are from the council and the mill owner. The workers' voices are only in oral histories recorded decades later. The plaque committee must decide whose story to tell, and that decision is political.

  - **The Fading of Memory**: Our oral histories are from the 1980s/90s, but what about the memories that were never recorded? The debrief should touch on the fragility of memory and the role of the historian in preserving it.

  Finally, avoid using terms like "collective memory" until the debrief. During the activity, refer to the sources as "documents" and "interviews."

  **Materials**: 
  - Print the source cards on different colored paper for documents (white) and oral histories (yellow) to help participants distinguish. 
  - The second envelope should be a different color or marked "NEW EVIDENCE".

  This should create a rich, engaging activity that meets your goals. Good luck!
answer: |-
  ### **Activity: The Millford Mill Fire Plaque Challenge**  
  **Setting:** Fictional industrial town of Millford (circa 1963). A textile mill fire on May 10, 1963, killed workers. The town council is commissioning a plaque. Participants must draft the text (max 50 words) using only provided sources. Every claim must be traceable to a specific card.  

  ---

  ### **Source Cards (Envelope 1)**  
  *Print on plain paper. Mix document cards (white) and oral history transcripts (light blue).*  

  1. **Council Meeting Minutes (May 15, 1963)**  
     *"Resolved: The fire at Millford Mill on 10 May 1963 was caused by an electrical fault in the spinning room. All safety protocols were followed. Eight workers tragically perished. Council extends condolences to families and commends the fire brigade’s swift response."*  

  2. **Mill Ledger Page (Maintenance Log, May 8, 1963)**  
     *"10:00 AM: Electrical systems inspection completed in spinning room. No faults detected. Fire extinguishers serviced and reinstalled. Signed: A. Turner (Foreman)."*  

  3. **Local Newspaper Clip (The Millford Gazette, May 11, 1963)**  
     *"FIRE GUTS MILLFORD MILL: 8 Dead in Tragedy. Blaze erupted in spinning room yesterday. Mill owner Mr. H. Groves stated, ‘A sudden electrical fault caused this devastation. We adhere strictly to safety standards.’ Fire Chief R. Davies praised his team’s ‘heroic efforts’."*  

  4. **Photograph Caption (Undated, from council archives)**  
     *"Ruins of Millford Mill’s west wing after the fire, May 1963. Electrical panel (arrow) where the fire began. Eight workers died. Photo by council surveyor."*  

  5. **Oral History Transcript: Betty Walsh (Recorded 1984)**  
     *"I was in the spinning room that day. Stan lit a cig near the cotton bins—everyone smoked there! Sparks flew, and WHOOSH! The fire extinguishers? Gone for weeks! Management said they were ‘being serviced.’ I saw 10 bodies myself, but they only listed 8. Old Mr. Groves paid hush money."*  

  6. **Oral History Transcript: Frank Doyle (Recorded 1992)**  
     *"My dad drove the ambulance. Said they pulled out 12 bodies, but the council only counted ‘full-time’ staff. Temp workers didn’t matter. The fire started ’cause the bosses ignored complaints about faulty wiring. Groves’ nephew ran the maintenance crew—useless drunk. Afterward, Groves gave Dad £50 to keep quiet."*  

  7. **Oral History Transcript: Edith Clarke (Recorded 1980)**  
     *"I lost my brother Jim. He’d complained for months: ‘The wiring’s rotten, and the extinguishers are empty.’ After the fire, Groves told us, ‘Call it electrical or lose your jobs.’ Jim’s mate Ali—a temp—died too, but they left him off the list. Only eight got funerals."*  

  ---

  ### **Second Envelope (Introduced After 40 Minutes)**  
  *Print on bright yellow paper.*  
  8. **Fire Brigade Incident Report (Newly surfaced, dated May 11, 1963)**  
     *"14:30, 10 May 1963: Fire at Millford Mill. Origin: Spinning room. Cause: Cigarette ignition near cotton waste bins. Extinguishers absent—reported missing during inspection on 25 April. Delays due to blocked access roads (council roadworks). Confirmed fatalities: 10 (8 full-time, 2 temporary workers)."*  

  ---

  ### **Activity Flow**  
  1. **Setup (5 min):**  
     - Divide into groups of 4.  
     - Hand out Envelope 1. Explain: *"Draft a 50-word plaque about the 1963 Millford Mill fire. Every fact must cite a source card. No external knowledge."*  
     - Emphasize plaque tone: *"Respectful but accurate."*  

  2. **Drafting Phase (35 min):**  
     - Groups debate contradictions:  
       - Documents claim **electrical fault**; oral histories claim **cigarette ignition**.  
       - Documents state **8 dead**; oral histories claim **10–12 dead** and **missing extinguishers**.  
       - Council records praise safety; oral histories allege **corruption** (e.g., hush money, excluding temps).  
     - **Conflict subtlety:** No outright number clashes. Contradictions rely on *interpretation* (e.g., "electrical fault" vs. "cigarette near bins," "8 dead" vs. "temps excluded").  

  3. **Twist (Minute 40):**  
     - Hand out Envelope 2 (Fire Brigade Report).  
     - Watch for the *"Oh no"* moment: The report corroborates oral histories (cigarette cause, 10 dead, missing extinguishers) and contradicts the council’s documents.  

  4. **Final Drafting (25 min):**  
     - Groups revise plaques under word limit. Encourage hard choices:  
       - Which sources to trust?  
       - What can they *prove*?  

  5. **Plaque Sharing (5 min/group):**  
     - Groups read plaques aloud. Note where they hedged (e.g., "a fire claimed lives" vs. stating numbers).  

  ---

  ### **Should You Assign Roles?**  
  **No.** Here’s why:  
  - **Record-office professionals** may over-index on documents; **genealogists** may favor oral histories. Let their expertise clash organically.  
  - Forced roles (e.g., "defend the council") derails nuanced debate. The *sources* should create tension, not artificial allegiances.  
  - **Exception:** If groups are too agreeable, assign a "devil’s advocate" to challenge assumptions mid-activity.  

  ---

  ### **Debrief Framework (20 min)**  
  **Map the activity to key ideas:**  
  1. **Memory vs. Record:**  
     - *Documents* (council, ledger): Precise but **institutionally curated** (e.g., downplaying negligence).  
     - *Oral Histories*: Vivid but **fragmented/inconsistent** (e.g., 10 vs. 12 bodies).  
     - Neither "trumps": The fire report (long-lost document) validated *parts* of both.  

  2. **Gaps Are Not Neutral:**  
     - The council’s documents **omitted temps**—this wasn’t oversight but **systemic erasure**.  
     - The missing fire report gap allowed the council’s narrative to dominate for decades.  

  3. **What the Activity Staged:**  
     - Contradictions between lived memory and official records.  
     - How institutions shape archives (e.g., council minutes vs. buried fire report).  
     - The weight of **new evidence** disrupting consensus.  

  4. **What It Couldn’t Stage (Requires Your Commentary):**  
     - **Power dynamics**: Why were temps excluded? (Hint: Cheap labor, less accountability.)  
     - **Memory fade**: Betty/Frank/Edith’s testimonies were recorded 20+ years later—details warp.  
     - **Emotional truth**: Even "inconsistent" oral histories agreed on **corruption**—a pattern the activity can’t replicate.  
     - **Silenced voices**: No cards from temp workers or management—remind them *whose absence* matters.  

  **Key phrase to avoid until debrief:** "Collective memory." Use "community stories" or "recalled accounts" during the activity.  

  ---

  ### **Predictable Problems & Fixes**  
  1. **Problem:** Groups fixate on solving the "mystery" (e.g., "What *really* happened?").  
     - **Fix:** Redirect: *"Your goal isn’t ‘truth’—it’s a plaque that honors the dead within the sources’ limits."*  

  2. **Problem:** Oral histories dismissed as "unreliable gossip."  
     - **Fix:** Ask: *"Why might workers share this? What patterns emerge across testimonies?"*  

  3. **Problem:** Word limit stress leads to oversimplified plaques.  
     - **Fix:** Reassure: *"It’s okay to omit contested details. What’s the core story you can prove?"*  

  4. **Problem:** Second envelope causes chaos (e.g., "We have to start over!").  
     - **Fix:** Calmly note: *"History is revised with new evidence. Adapt, don’t scrap."*  

  5. **Problem:** One dominant participant.  
     - **Fix:** Set a rule: *"Each person must cite one source before voting on the plaque."*  

  ---

  ### **Why This Works**  
  - **Cheap & flexible:** Only paper, envelopes, and pens needed.  
  - **Realistic tension:** Documents feel "official"; oral histories feel human but messy.  
  - **Twist lands:** The fire report is a "smoking gun" that forces reckoning with *both* sides.  
  - **Debrief grounds it:** Participants will eagerly connect their struggles to your big themes.  

  **Final Tip:** Start the debrief by asking, *"What was hardest to leave off the plaque?"* This surfaces tensions organically. Good luck—this is a brilliant workshop idea!
