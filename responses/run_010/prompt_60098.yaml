     This exposes a place where the physics debate was substantive: the superdeterminist is questioning the possibility of free interventions on the settings.

  3. **Fine-tuning charge**: The fine-tuning charge is that certain models (like Bohmian mechanics, superdeterminism, and some retrocausal models) require that the hidden variables are finely tuned to reproduce the quantum predictions. In causal inference, this can be seen as a violation of faithfulness. Faithfulness requires that every conditional independence relation in the distribution is implied by the causal graph (via d-separation). 

