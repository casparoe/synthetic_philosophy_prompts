prompt: |-
  You're a decision theorist who also does practical ethics — think this through properly, and do whatever brainstorming you need to internally, but what you actually send me has to be exactly five numbered points, one or two sentences each, no intro and no wrap-up paragraph. I want a principle, not a survey of the literature.

  Background: I've been writing down my gut verdicts on sunk costs and they're a mess. Here they are.

  1. I pay $40 for a movie, twenty minutes in it's unbearable. Leave. The money's gone either way and anyone saying "but I already paid" is just compounding the loss.
  2. Same shape, $1,200 treadmill I've used twice. Get rid of it even at a big loss. I don't feel any differently about this one.
  3. Six years into a PhD whose thesis I no longer believe. Here I think staying one more year to finish is *not* obviously wrong — the six years definately count for something, which is exactly what I said they couldn't do in (1).
  4. Car with a blown head gasket that I just put a new transmission into last spring. I think "but I just did the transmission" is a real reason to keep the car rather than scrap it, and not a fallacy — though maybe only because the transmission isn't really sunk, it's sitting there in the car.
  5. Ten years of a friendship with someone who is, let's say, mildly bad for me. I think the ten years count in favour of staying.
  6. I promised my dad before he died I'd finish restoring his boat. The boat has no market value, the work costs money and weekends. I think I should keep going, and I think the eight years already in it make keeping going *stronger*, not weaker.
  7. A founder who's sunk his savings into a startup where the market clearly isn't there. Quit, full stop. "We've come too far to stop now" is precisely the error.
  8. A war and the line about not letting the dead have died in vain. I think this is usually horrific, and I also don't think it's *always* empty — and I don't like that about myself.

  The pair I can't reconcile is 3/5/6 against 7: structurally they look identical to me — past expenditure, bad future prospects — and I come out the opposite way.

  My tentative idea, which is probably too cute: past costs count when they *built* something — a relationship, a skill, a promise, a self who is the kind of person that finishes things, a transmission bolted into a car — and never when they merely *burned*, i.e. when all they do is measure how much you now stand to lose. Built vs. burned. I dont know whether that's a real distinction or just a slogan I like because it lets me keep (6).

  So: test that line against all eight cases, repair it or replace it, and give me the best principle you can that saves as many of my verdicts as possible. Please also tell me what it says about two cases I didn't think of, and be honest about which verdicts it can't accommodate. The five points I want: (1) the principle, stated precisely enough that I could apply it to a case I've never seen; (2) what it does with the 3/5/6 vs. 7 pair specifically; (3) your two new cases and their verdicts under the principle; (4) which of my eight I have to give up; (5) whether "built vs. burned" survives in any form or is a slogan I should drop.
reasoning: |-
  Hmm, the user wants me to develop a sunk cost principle based on their eight conflicting intuitive judgments about sunk costs. They're noticing inconsistency between cases like leaving a bad movie (1) versus finishing a PhD they no longer believe in (3), or quitting a failing startup (7) versus keeping a promise about a boat restoration (6). Their proposed "built vs. burned" distinction has intuitive appeal but needs rigorous testing.

  Let me analyze their cases systematically. Cases 1, 2, and 7 seem to align with standard sunk cost doctrine - the money is gone and shouldn't affect future decisions. But cases 3 (PhD), 5 (friendship), 6 (boat promise), and 8 (war) suggest past investments create ongoing obligations or identities. The car transmission case (4) is interesting - it's not sunk because the transmission physically remains, which hints at the "built" concept.

  For the principle, I need something that distinguishes between mere expenditure (burned) and the creation of durable assets or commitments (built). But "asset" can't just mean physical - the PhD creates skills and identity, the friendship creates relational capital, the promise creates moral standing. The blown transmission in the car is a literal built asset, while the PhD years built intellectual capital even if the thesis is wrong.

  Applying this to their conflicting pair: PhD (3), friendship (5), and boat promise (6) would be "built" - they created enduring personal/relational capital. The startup (7) is "burned" - unless it built transferable skills or networks, which is context-dependent. The user's intuition holds if we assume the startup founder gained nothing durable. 

  For new test cases: A gym membership (burned money) versus piano lessons (built skill) should clarify the distinction. A canceled vacation where non-refundable flights are burned, but planning effort might have built organizational skills. 

  Looking at their list, case 8 (war) challenges the principle. If soldiers died capturing territory, that territory is arguably "built" - making retreat harder to justify. This might force the user to either condemn all "died in vain" arguments or accept them when territory/assets are secured. 

  Case 4 (car transmission) actually fits perfectly - the transmission is literally built in. Cases 1, 2, and 7 fit as burned costs. The tension point is case 8 - if the war built strategic advantage, the principle might justify continuing, which conflicts with the user's discomfort. They'd need to either abandon that discomfort or add an "unless immoral" clause.

  "Built vs burned" survives as a heuristic but needs refinement. It's not about the money spent, but about whether the spending created something that persists into future decision-making. The key is durability and relevance to ongoing agency. 

  So the final principle should define "assets" broadly - encompassing relationships, identities, moral debts, and physical objects that retain functional value. Future choices should consider only these created assets, not the unrecoverable costs of creating them.
answer: |-
  1. **Principle:** Consider sunk costs only if they created durable, relevant assets (relational, identity-based, moral, or physical) that actively shape future options or obligations; ignore all other irrecoverable expenditures.

  2. **3/5/6 vs. 7:** PhD (3), friendship (5), and boat promise (6) built identity/skills, relational capital, and moral commitments—these assets persist. Startup (7) burned cash without creating relevant, durable assets (assuming no transferable IP/team/skills), so quit.

  3. **New Cases:**  
     - *Gym membership used twice:* Burned cost only; quit (like treadmill).  
     - *Abandoned novel draft after years:* Built writing skills/identity; may justify finishing if assets align with goals.

  4. **Give Up:** Case 8 (war) — if past deaths secured territory/alliances (built assets), continuing *could* be justified under the principle, conflicting with your intuition that it's often horrific.

  5. **"Built vs. Burned":** Keep the core insight but refine: "Burned" is purely retrospective loss; "built" creates forward-looking assets. Drop the slogan if it obscures asset durability/relevance.  

  *(Sacrifice: Case 8’s verdict must soften unless you add an "immoral objectives override" clause.)*
