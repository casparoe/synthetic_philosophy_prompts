  ### Decision Tree: Metaphysical Commitments on Possible Worlds  
  *Entry Point: Modal claims are literally true and irreducible (e.g., non-actual things might have existed).*  

  #### The Tree  
  1. **Are there non-actual concrete things?** (e.g., a talking donkey in some world)  
     - **Yes** → 2  
     - **No** → 3  

  2. **Could the same concrete individual exist in multiple worlds?** (e.g., Humphrey himself wins in another world)  
     - **Yes** → Leaf 1  
     - **No** → 4  

  3. **Do possible worlds exist as abstract entities?**  
     - **Yes** → 5  
     - **No** → 6  

  4. **Could there be properties fundamentally unlike any actual property?** (e.g., a property no actual thing could acquire)  
     - **Yes** → Leaf 2  
     - **No** → Leaf 3  

  5. **Does "Humphrey might have won" involve Humphrey himself in another world?**  
     - **Yes** → 7  
     - **No** → 8  

  6. **Are modal truths grounded in a fiction or primitive modality?**  
     - **Fiction** → Leaf 4  
     - **Primitive** → Leaf 5  

  7. **What are worlds made of?**  
     - Maximal consistent sets of propositions → Leaf 6  
     - Maximal recombinations of actual constituents → Leaf 7  
     - Maximal states of affairs with unexemplified essences → Leaf 8  

  8. **Could two worlds be qualitatively identical but differ only in which individuals play which roles?**  
     - **Yes** → Leaf 9  
     - **No** → Leaf 10  

  ---

  #### Leaves  
  1. **Concrete Transworld Identity** (No standard name)  
     - *World:* A concrete universe; the same individual exists in multiple worlds.  
     - *Bullet to bite:* Individuals violate spatiotemporal isolation by being wholly present in disconnected worlds.  
  2. **Lewisian Modal Realism**  
     - *World:* A concrete, spatiotemporally isolated universe.  
     - *Bullet to bite:* Infinite concrete worlds (e.g., with flying spaghetti monsters) exist, bloating ontology.  
  3. **Concrete Combinatorialism** (No standard name)  
     - *World:* A concrete universe built only from recombinations of actual properties/materials.  
     - *Bullet to bite:* No fundamentally new properties (e.g., no alien colors) are possible, limiting imagination.  
  4. **Modal Fictionalism**  
     - *World:* None; worlds are useful fictions.  
     - *Bullet to bite:* "Possibly P" means "P is true in the fiction," but the fiction’s correctness is ungrounded.  
  5. **Primitive Modality**  
     - *World:* None; modality is brute and irreducible.  
     - *Bullet to bite:* No explanation for why some propositions are possible and others not.  
  6. **Linguistic Ersatzism**  
     - *World:* A maximal consistent set of propositions.  
     - *Bullet to bite:* You and the actual world are abstract propositions.  
  7. **Actualist Combinatorialism** (e.g., Armstrong)  
     - *World:* A maximal recombination of actual individuals/properties.  
     - *Bullet to bite:* Sherlock Holmes never existed (even possibly); only "Holmes-like" properties get instantiated.  
  8. **Plenitude of Essences** (e.g., Plantinga)  
     - *World:* A maximal state of affairs involving unexemplified individual essences.  
     - *Bullet to bite:* Non-actual essences (e.g., "being Sherlock") exist necessarily but are uninstantiated.  
  9. **Haecceitist Ersatzism**  
     - *World:* An abstract entity (e.g., a set) representing qualitative and non-qualitative roles.  
     - *Bullet to bite:* Worlds can differ solely by swapping individuals in identical scenarios (haecceitism).  
  10. **Anti-Haecceitist Ersatzism** (e.g., qualitative counterpart theory)  
      - *World:* An abstract entity representing only qualitative features.  
      - *Bullet to bite:* No distinction between identical twins swapping lives; individuality is reducible.  

