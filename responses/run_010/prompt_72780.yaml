     - Leaf 8: 1(No) → 3(Yes) → 5(Yes) → 7(Essences)  
     - Leaf 9: 1(No) → 3(Yes) → 5(No) → 8(Yes)  
     - Leaf 10: 1(No) → 3(Yes) → 5(No) → 8(No)  

  2. **Vacant Combinations**  
     - **Concrete worlds + No alien properties + Transworld identity:** Incoherent. Concrete worlds are causally isolated, so transworld identity requires "overlap" incompatible with isolation.  
     - **Abstract worlds + Transworld identity + Primitive modality:** Available but unattractive. Primitive modality typically rejects worlds altogether; adding abstract worlds is redundant.  
     - **No worlds + Haecceitism:** Unexplored. Haecceitism requires worlds to individuate non-qualitative roles, but a worldless view lacks resources for this. *If* haecceities (primitive "thisness") were grounded in actuality, it might become viable.  

  3. **Indistinguishable Leaves**  
     - **Leaf 9 (Haecceitist Ersatzism) and Leaf 10 (Anti-Haecceitist Ersatzism)** cannot be separated on the "two universes" test (Node 8). Both accept two causally isolated universes as one world (if described together) or two worlds (if maximality demands separation).  
