  #### Post-Tree Analysis  
  1. **Path Key**  
     - Leaf 1: 1(Yes) → 2(Yes)  
     - Leaf 2: 1(Yes) → 2(No) → 4(Yes)  
     - Leaf 3: 1(Yes) → 2(No) → 4(No)  
