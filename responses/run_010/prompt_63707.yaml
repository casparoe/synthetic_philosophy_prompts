answer: |-
  **Thesis Proposal: Probabilistic Reframing and Non-Human Agency in Historical Explanation**

  **1. Precise Research Question**  
  Can the conceptual structure of probabilistic event attribution (PEA)—specifically, its substitution of causal necessity with likelihood shifts relative to a modeled counterfactual—be coherently transposed to historical explanations of non-human causes (e.g., volcanic eruptions, pathogens), and if so, does this transposition:  
  (a) resolve the environmental determinism objection by decoupling causal contribution from explanatory salience;  
  (b) introduce new conceptual problems, such as the undefinability of historical counterfactual reference worlds or the erasure of the cause/standing-condition distinction; or  
  (c) merely relocate the determinism debate without resolving it?  
  This question admits a determinate answer by evaluating the logical consistency and explanatory utility of PEA-derived models when applied to two historical cases, assessed against defined criteria for conceptual coherence and empirical adequacy.

  **2. Why Existing Positions Leave the Question Open**  
  Current scholarly approaches fail to address this query because each misaligns with PEA’s core innovation—the replacement of deterministic "but-for" causation with probabilistic likelihood shifts.  

  - *Symmetry-focused frameworks* (e.g., Actor-Network Theory) insist on ontological parity between human and non-human "actants" but retain an all-or-nothing causal model. They conflate agency-as-capacity-to-alter with agency-as-intentionality, precluding the separation of causal contribution (quantifiable via probability shifts) from agential properties (e.g., goals). The determinism objection persists because symmetrical treatment cannot isolate probability as an independent variable.  

  - *Metaphorical agency approaches* sidestep causation entirely by treating non-human "action" as narrative convenience. This evades determinism accusations but leaves causal contribution untheorized, ignoring PEA’s ability to quantify differential influence (e.g., how Tambora’s eruption raised the probability of 1816’s "Year Without a Summer" from 10% to 95% in a modeled counterfactual). By reducing agency to rhetoric, they render the historian’s counterfactual world irrelevant.  

  - *Politically oriented critiques* dismiss determinism as a discursive tool for oppression. While valid in critiquing misuse, they treat causation as an ideological construct rather than an epistemological problem. This overlooks PEA’s capacity to depoliticize causation through mathematically formalized probability, leaving unanswered whether non-human causes *can* be modeled as probability modifiers without deterministic implications.  

  All three positions neglect PEA’s reframing of causation as a question of relative likelihoods in non-repeatable systems—precisely the challenge historical explanation faces.

  **3. Method: Monthly Work Plan**  
  *Month 1–2:* Framework formalization. Define PEA’s core components (observed event, counterfactual model, probability shift calculation) and isolate transferable elements (e.g., likelihood ratios, attribution thresholds). Identify philosophical barriers (e.g., "undefinable counterfactuals") using analytic philosophy tools.  
  *Months 3–5:* Volcanic-climate case study: Tambora (1815). Construct a simple probabilistic model for post-eruption climate anomalies (e.g., crop failures in Europe, 1816–1818), using published paleoclimate data to estimate probability shifts. Compare to deterministic historical narratives (e.g., "Tambora caused the famine").  
  *Months 6–8:* Epidemic case study: Late Antique Plague (6th-century Mediterranean). Model the pathogen’s impact (e.g., population decline, economic disruption) using demographic proxies, incorporating pathogen uncertainty (e.g., debates over *Yersinia pestis* vs. viral agents). Apply likelihood ratios to contested outcomes (e.g., "Did the pathogen raise the probability of imperial collapse?").  
  *Months 9–10:* Synthesis. Test transposition coherence: Can PEA components (counterfactual reference world, probability shift) function without climate science’s computational advantages? Evaluate if determinism objections dissolve when agency claims are disaggregated into (i) causal contribution (PEA-quantifiable), (ii) salience (narrative choice), and (iii) teleology (goals).  
  *Months 11–12:* Drafting. Refine arguments, delineate success/failure conditions (below), and address feasibility constraints.

  **4. Success and Failure Criteria**  
  - *Success:* Demonstrated by (a) a logically consistent PEA transposition that resolves determinism objections for at least one case study via clear separation of causal contribution (probability shift) from agency/salience; and (b) identification of defensible minimal criteria for historical counterfactuals (e.g., "plausible baseline trends"). Success requires no new empirical data.  
  - *Failure:* Defined by either (a) the impossibility of constructing even a rudimentary probabilistic model for both case studies due to incoherent counterfactuals (e.g., inability to define a "no-Tambora" 1815 climate), or (b) the transposition amplifying determinism by eroding the cause/standing-condition distinction (e.g., if "volcanic activity" becomes a permanent probability modifier, nullifying narrative causality). Ambiguous results (e.g., resolution for volcanoes but not epidemics) constitute partial failure, still yielding publishable insights.

  **5. Feasibility Assessment**  
  This project is feasible for one person in twelve months without fieldwork or archives, as it relies on published scientific data (e.g., ice-core sulfate records), historical scholarship (e.g., plague mortality estimates), and conceptual analysis. Case studies were selected for data availability: Tambora’s climate effects are extensively modeled, and Late Antique demography is well-theorized despite pathogen disputes. Computational demands are low (basic probability calculations). Risks include oversimplification of historical counterfactuals, but this is mitigated by using existing models (e.g., climate reconstructions) and embracing contested parameters (e.g., unknown pathogens) as boundary-testing cases.  

  This is a philosophy-of-history project, not historiography, because it evaluates the *conceptual conditions* for historical explanation (e.g., causality, agency) rather than producing new empirical accounts of Tambora or the plague. Its output is a framework for assessing how non-human causes *can be thought* without determinism, prioritizing logical coherence over narrative reconstruction.
