prompt: |-
  I am enrolled this term in a seminar on the quantitative study of organized violence, and most of our hours have gone into the construction of the standard datasets rather than into results. Three of the construction conventions now look to me less like bookkeeping than like substantive philosophical positions, and I would like a careful reconstruction of what each one commits us to.

  First, the counting rule. The best-known conflict datasets identify armed conflict by reference to battle-related deaths. One widely used convention sets the floor at twenty-five battle-related deaths in a calendar year between two parties, at least one of which is a state; another reserves the term war for episodes that reach a thousand battle-related fatalities within twelve months. Only deaths caused by combat operations are counted. Deaths from the famine, epidemic disease, and breakdown of medical care that a war brings in its wake — which in a number of conflicts have outnumbered the battle deaths themselves — fall outside the count by definition.

  Second, the denominator. Claims about the long-run trend are ordinarily expressed per capita, as battle deaths per million of world population, partly because the global population has grown several-fold since these series begin in the early nineteenth century.

  Third, the unit of analysis. Everything is indexed to episodes with beginnings and ends, so the headline quantities are the number of conflicts active in a given year and the deaths those conflicts produce.

  What conception of violence does this apparatus presuppose, and which rival conceptions does it rule out by construction rather than by argument? A few specific puzzles I cannot resolve on my own:

  Does counting combat-caused deaths only presuppose that harm requires a striking agent, and that the distinction between doing and allowing carries genuine moral weight? I keep noticing that the same literature is perfectly willing to explain falling numbers by diffuse, indirect causes — commercial interdependence, administrative capacity, shifting norms — while refusing to admit indirectly caused deaths into the measure. Is that an inconsistency, or is there a defensible asymmetry between the causal claims we make about trends and the causal claims we permit into the numbers?

  Does per-capita normalization presuppose that what matters is each person's risk of being killed rather than the total amount of killing, and hence a particular way of aggregating harms across persons? What would have to change if one held that the wrongness of large-scale killing does not scale linearly with the number killed — that the destruction of a city is something other than the sum of its individual murders?

  Does defining war by a minimum death toll presuppose that violence is a kind with sharp boundaries, and that the morally significant unit is the episode? A strategy that split one large war into a hundred sub-threshold campaigns would appear in the data as the disappearance of war.

  Now suppose a classmate proposed replacing realized deaths with imposed risk: violence measured as the probability of death that a party's conduct imposed on an identifiable population, whether or not anyone in fact died. A standoff resolved by deterrence would then register as violence inflicted rather than violence avoided, and a siege lifted after surrender, before anyone starved, would register as fully violent. What would that measure presuppose, and does the choice between it and the existing conventions quietly settle a question in moral philosophy — whether what a course of conduct produces is part of the description of the conduct itself — that the datasets otherwise profess to leave open? Can either measure be called empirical in a sense in which the other cannot?

  Finally, and most importantly for my purposes: is there a fact of the matter about whether violence is declining, independent of the measure, or is the trend claim partly fixed by the operationalization, such that the world is becoming less violent relative to one construction and more violent relative to another? Please distinguish the cases in which rival constructions genuinely disagree about the world from those in which they describe the same world in different vocabularies; distinguish what the practice strictly presupposes from what it merely sits well with, since I suspect several incompatible theories of violence could license the same codebook; and tell me what would have to change, both in dataset construction and in the public use of these numbers, were the presupposed conception replaced by one of its rivals.
reasoning: |-
  Okay, let me unpack this user's query. They're in a seminar on organized violence datasets and have identified three conventions that seem like philosophical positions: the counting rule (only combat deaths), denominator (per capita normalization), and unit of analysis (episodic conflicts). They want to understand what each presupposes and what alternatives are excluded.

  First, the counting rule. By excluding indirect deaths like famine or disease, the dataset assumes that moral responsibility requires direct causation. This reflects a "doing vs. allowing" distinction in ethics. The user notices an inconsistency—scholars use indirect factors (like trade) to explain trends but won't count indirect deaths. This might be because the measure focuses on intentional violence, while explanations consider broader contexts. But it's worth pointing out that tension.

  Next, per capita normalization. Using deaths per million implies that individual risk matters more than total harm. This prioritizes a person-centered view over, say, the absolute wrong of large-scale destruction. If the user thinks destroying a city is more than the sum of individual deaths, this normalization might misrepresent the moral weight. The dataset's choice here leans toward utilitarian aggregation, ignoring thresholds of catastrophic harm.

  The unit of analysis treats conflicts as discrete episodes. This assumes sharp boundaries, which might not reflect reality. A war split into sub-threshold campaigns disappears from the data, which could be manipulated or miss continuous violence. This episodic framing suggests that morally significant violence is event-based, not structural.

  The classmate's proposal about imposed risk instead of realized deaths shifts focus to probability. This would count deterrence as violence, challenging the idea that harm requires actual death. It presupposes that moral wrong comes from creating risk, regardless of outcome. This clashes with the current measure's event-based view. Choosing between them involves a philosophical stance on whether consequences define actions.

  On whether violence is declining: the trend depends on the measure. A switch to including indirect deaths or imposed risk could show rising violence. But some changes, like counting indirect deaths, might not alter the trend if both types decrease. The key is distinguishing between genuine disagreements (e.g., episodic vs. structural violence) versus different descriptions. The dataset's conventions aren't neutral; they shape conclusions. If underlying concepts changed, dataset construction and public interpretation would need rethinking, especially around risk and responsibility. The user needs to see that the apparatus isn't just technical—it's philosophical, and changing it alters what "violence" means.
answer: |-
  Your analysis identifies profound philosophical commitments embedded in quantitative conventions for studying organized violence. Let's reconstruct each presupposition, its rivals, and implications for trend claims:

  ### 1. **Counting Rule (Combat Deaths Only)**
     - **Presupposes**: Violence is an *intentional act of force* by combatants. It adopts:
       - *Agent-Causation Priority*: Harm requires identifiable agents applying force ("doing" ≠ "allowing").
       - *Proximate Causality*: Only direct physical effects of weapons matter; structural/systemic causes are excluded.
     - **Rivals Ruled Out**:
       - *Structural Violence* (Galtung): Deaths from deprivation during war are violence.
       - *Moral Equality of Doing/Allowing*: If withholding aid during famine is morally equivalent to killing, indirect deaths should count.
     - **Inconsistency in Causal Claims?** Not necessarily. The dataset *measures* direct instrumentality to isolate battlefield dynamics, while *explanations* reference indirect factors (trade, norms) as contextual *influences on actor behavior*. However, it *does* implicitly deny that indirect deaths constitute "organized violence" itself.

  ### 2. **Per-Capita Denominator**
     - **Presupposes**: Individual *risk distribution* is the ethical priority. It assumes:
       - *Utilitarian Aggregation*: Total harm is the sum of identical individual harms.
       - *Scale Invariance*: Killing 1,000 in 1800 (pop. 1B) is ethically equivalent to killing 1,000 in 2023 (pop. 8B).
     - **Rivals Ruled Out**:
       - *Threshold-Deontological Views*: The destruction of communities/cultures has moral weight beyond individual deaths.
       - *Absolute Harm Focus*: Total killing matters irrespective of population size (e.g., cosmic significance of aggregate suffering).
     - **If Thresholds Matter**: You'd need non-linear scaling (e.g., log-transformed deaths) or event-level analysis (e.g., counting city-destruction events).

  ### 3. **Episodic Unit of Analysis**
     - **Presupposes**: Violence is *event-based* and *discontinuous*. It requires:
       - *Sharp Boundaries*: Wars have clear starts/ends definable by thresholds.
       - *Attribution Logic*: Deaths belong unambiguously to specific conflict episodes.
     - **Rivals Ruled Out**:
       - *Structural/Persistent Violence*: Colonial repression, low-intensity insurgencies, or perpetual "shadow wars."
       - *Process-Based Views*: Violence as a continuum (e.g., "forever wars").
     - **Manipulation Risk**: Splitting campaigns to avoid thresholds *is* a vulnerability, exposing the convention's artificiality.

  ---

  ### **Imposed Risk vs. Realized Deaths**
  A shift to *imposed risk* presupposes:
  - **Conduct-Centric Ethics**: The moral wrong lies in *creating lethal threats*, regardless of outcomes (Kantian/duty-based).
  - **Counterfactual Responsibility**: Violence includes near-misses and deterrence (e.g., nuclear standoffs).

  **Philosophical Settlement**: The choice *does* resolve a key question:
  - *Realized Deaths*: Define violence by *outcomes* (consequentialist).
  - *Imposed Risk*: Define violence by *actions/intent* (deontological).

  **Empirical Status**: Both are empirical but measure different objects:
  - Death counts are *retrospective*, observable facts.
  - Imposed risk requires *modeling counterfactuals* (e.g., "What deaths *would* have occurred without surrender?"), introducing subjectivity. Neither is "more empirical"; they operationalize distinct concepts.

  ---

  ### **Is Violence Declining? Fact or Construction?**
  The trend claim *is measure-dependent*. Consider:

  | **Measure Change**               | **Likely Trend Impact**                  | **Example**                                  |
  |----------------------------------|------------------------------------------|---------------------------------------------|
  | Include indirect deaths          | May show *rising* violence post-1945    | Congo War: 3M indirect deaths uncounted     |
  | Shift to imposed risk            | May show *rising* violence (deterrence) | Cold War as peak "violence"                 |
  | Lower death threshold (e.g., 1)  | Shows *more* small conflicts             | Cartel violence enters datasets             |
  | Structural violence inclusion    | Reverses decline claims entirely         | Peacetime poverty deaths exceed war deaths |

  **Crucial Distinctions**:
  - **Genuine Disagreements**: If datasets using *identical conceptualizations* (e.g., both count only combat deaths) disagree on counts, that's empirical.
  - **Vocabulary Differences**: Counting combat deaths vs. imposed risk describes *different phenomena* – like comparing "apples" to "oranges".
  - **Compatible Theories**: A just-war theorist and utilitarian could both accept combat-death counts (though interpret differently).

  ---

  ### **Consequences of Changing Presuppositions**
  **Construction Changes Required**:
  1. For *structural violence*: Integrate demographic data (excess mortality, malnutrition).
  2. For *imposed risk*: Develop threat models (military deployments, siege preparations).
  3. For *threshold ethics*: Add event-size categorizations (e.g., "catastrophic" >100k deaths).

  **Public Use Implications**:
  - **Policy**: "Declining violence" narratives could collapse if indirect deaths are included, altering humanitarian priorities.
  - **Advocacy**: Risk-based measures could criminalize deterrence postures, reshaping arms control debates.
  - **Epistemic Authority**: Complex measures (e.g., risk) reduce accessibility, potentially amplifying technocratic dominance.

  **Incompatible Theories**: While multiple theories (e.g., realism, pacifism) *could* use current datasets, they would *reject* rivals that:
  - Deny agency in violence (e.g., structuralism),
  - Reject threshold morality (e.g., absolutism),
  - Or prioritize intentions over outcomes (e.g., deontology).

  ---

  ### **Conclusion**
  The apparatus presupposes a **statist, event-based, direct-causation, and individual-risk-oriented** conception of violence. Rivals (structural, process-based, or risk-focused views) are excluded *by construction*. **Trend claims are not purely empirical** – they depend on whether your operationalization captures the violence *you consider morally salient*. To answer your seminar's puzzle: The world may experience fewer *state-based combat deaths per capita* while witnessing more *structural harm* or *imposed existential risks*. The "decline of violence" is both a measurement artifact *and* a contestable philosophical claim.
