      },
      {
        "case": "Invented Worst Case: Alex, born with rare congenital condition causing chronic pain but normal function. Develops expensive taste for a specific, non-medical comfort item that uniquely alleviates it. Loses job, can't afford item, suffers increased pain.",
        "verdict": "Compensated? (Worst Fit). CCCP struggles: **A:** Deficit (increased pain). **B.iii:** Baseline condition imposed. **BUT** 'Expensive taste' was cultivated *in response* to the condition. Is the pain increase a 'deviation' or the baseline? Is reliance on the item a 'choice'? **Cost:** Highlights ambiguity in 'baseline' and 'choice' under chronic conditions. Your intuition might vary wildly here."
      }
    ]
  }
  ```

  ### Explanation of Key Choices
  *   **Core Principle (CCCP):** This explains most verdicts by focusing on the *source* of the welfare loss (deviation from baseline) and the *nature of the choice* leading to exposure. It handles Tomás (constrained) vs. Marisol (unconstrained), Lena (imposed cost change) vs. Ross (chosen tastes), Yvonne (constrained sacrifice), and the deception case.
  *   **SSP:** Cleanly handles the lottery/startup asymmetry based on agency within the risk structure.
  *   **Priya:** The principle logically matches your verdict but forces you to confront the inconsistency with your feeling that "blameless" suffering like Del's *should* be compensated regardless of consent if severe. To compensate Priya, you need a "Severity Clause" or must drop the consent requirement for severe outcomes – but that breaks Nate and Marisol full-info.
  *   **Undecided Cases:**
      *   **Gambler:** Initial compensation restored baseline. New loss is voluntary gambling. No comp.
      *   **Company Town:** Lack of alternatives makes the "choice" to take the risky job involuntary (B.i), warranting compensation if injured.
      *   **Worst Case (Alex):** Tests the fuzzy boundaries of "baseline" and "choice" when unchosen conditions lead to adaptive preferences/needs. CCCP struggles to give a clear answer, exposing its contextual cost.
