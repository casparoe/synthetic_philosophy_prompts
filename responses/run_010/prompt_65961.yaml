prompt: |-
  I'm a fourth-year PhD student in public policy — my work is all program evaluation and cost-benefit stuff, so quantitative — and this term I've been sitting in on a political theory reading group basically as a spectator. Last week it drifted onto electoral systems and I came away with a puzzle I haven't been able to put down, and nobody in the group seemed to think it was interesting, which makes me suspect I'm missing something obvious.

  Here's what I can't reconcile. Essentially every country that elects a single head of government or head of state by popular vote insists that the winner have an actual majority: France runs a runoff between the top two, same for most of Latin America and for the post-communist states that elect their presidents directly, and a growing number of US states and cities have moved to ranked-choice or runoff rules for their own offices. A president who wins on 38% in a three-way race is treated almost everywhere as a legitimacy problem. But those same countries fill their legislatures by single-member plurality and don't blink. In the UK a party gets a comfortable working majority of seats on something like 35% of the national vote and everybody — press, opposition, the winning party itself — talks about its mandate, its program, its authority to govern. Nobody proposes holding a runoff in each of 650 constituencies.

  And then there's a third practice that seems to cut against both. Referendums are usually settled by a bare plurality of whoever shows up. Brexit was 52-48 on a 72% turnout and got treated as resolving a constitutional question, when a 52-48 result in an election would be written up as a weak mandate. Some countries do impose turnout quorums for referendums and some don't, and I've never seen a principled account of which is which.

  So what theory of democratic legitimacy is each of these presupposing? It can't just be majority rule, since the legislature case is explicitly comfortable with plurality winners and the referendum case is comfortable with 52%. Is the thought that one person holding one indivisible office has to be authorized by more than a plurality, because they speak for everybody including the ones who voted against them, whereas an assembly doesn't, because its composition already *is* the representation and the majority requirement gets applied later, inside the chamber, once it's seated? That feels close but I can't tell whether it actually covers the referendum case or just gets contradicted by it.

  What I want is a careful reconstruction. What does each of the three practices strictly presuppose about what an election is doing — authorizing, mirroring, aggregating, licensing — as against what it merely fits comfortably with, because I suspect several rival theories would license the plurality legislature. Then tell me where the three genuinely contradict each other rather than just differing, and whether a single principle generates all three; I keep having the feeling there is one and I just cant find it. And finally, what would have to change — the rules, or only how we describe results, or the idea of a mandate itself — if we held all three to one standard? Whichever standard you think survives scrutiny, say what it costs.

  No reading list please, I'm on a train and I want the argument, not the references.
reasoning: |-
  Okay, let me approach this user's query methodically. The PhD student in public policy presents a fascinating puzzle about electoral legitimacy across three contexts: presidential elections requiring majority runoffs, legislative elections accepting plurality outcomes, and referendums decided by bare majorities. 

  First, I need to disentangle the implicit theories behind each practice. For presidential systems, the majority requirement seems rooted in the symbolic need for the executive to represent the whole nation - hence the discomfort with plurality winners. Legislative elections operate differently because we accept that seat allocation is merely the starting point for subsequent majority formation within parliament. Referendums are the outlier here, treating 52% as conclusive despite the high stakes, possibly because they're framed as direct popular will.

  The contradictions appear starkest between presidential/legislative logic and referendum practice. Why is 38% unacceptable for a president but 35% sufficient for parliamentary control? And why does 52% in a referendum carry more weight than the same margin in an election? This suggests legitimacy isn't about mathematical thresholds alone, but about institutional roles and temporal dimensions.

  Perhaps the unifying principle lies in distinguishing between authorization and aggregation. Single-winner offices require direct authorization by majority, whereas legislatures aggregate preferences that will later form majorities procedurally. Referendums then become exceptional as one-off decisions that bypass representative filters - hence the lower bar, though arguably this creates tension with the presidential logic.

  If we applied consistent standards, the tradeoffs become clear. Requiring legislative runoffs might fracture party systems and increase costs, while imposing supermajorities on referendums could paralyze decision-making. The student seems to sense this tension between principles and practicality, seeking not just answers but the cost of theoretical purity.

  The user's frustration with their reading group suggests they've spotted a genuine inconsistency that political theorists may handwave away. Their quantitative background makes them sensitive to numerical thresholds, while the theory group might take institutional differences for granted. What they likely want is not citations but a coherent framework to explain these variations - and to validate that the puzzle itself is substantive.
answer: |-
  Here's a reconstruction of the implicit legitimacy theories behind the three practices, their contradictions, and the costs of imposing a single standard:

  ### 1. **Presidential Elections (Majority Runoff)**
     - **Presupposition:** A single, indivisible executive embodies the *entire polity*. Legitimacy requires *direct, explicit authorization* by a majority of participating voters. A plurality is insufficient because:
       - The executive acts unilaterally (no need for coalition-building *after* election).
       - Symbolically, they "speak for the nation," so broad consent is demanded.
       - Avoids minority rule where a fragmented opposition could have preferred anyone else.
     - **Implied Theory:** **Authorization Theory.** Elections confer a personal mandate to exercise sovereign power. Majority support is the clearest proof of consent.

  ### 2. **Single-Member Plurality Legislatures**
     - **Presupposition:** Legislatures are *deliberative, representative bodies*, not unitary actors. Legitimacy arises from:
       - **Aggregation, not direct authorization:** Seats are building blocks for *subsequent* majority formation *within* the chamber. The election merely selects representatives; legitimacy flows from parliamentary procedure (e.g., confidence votes).
       - **Territorial representation:** Each MP represents a *geographic constituency*. Legitimacy is local (plurality wins the seat), while national "mandate" is a post-hoc narrative, not a formal requirement.
       - **Practicality & Stability:** Runoffs in hundreds of districts are costly and could paralyze governance. Historical inertia (e.g., UK tradition) normalizes it.
     - **Implied Theory:** **Representative-Trustee Theory + Procedural Legitimacy.** Voters choose local agents; those agents then construct majorities procedurally. The *system* is legitimate if it produces stable governments capable of legislative action, even if imperfectly reflective.

  ### 3. **Referendums (Simple Majority)**
     - **Presupposition:** Referendums are *direct exercises of popular sovereignty* on a specific issue. They prioritize:
       - **Decisiveness:** The question is binary (Yes/No). A majority, however slim, provides a clear answer. Requiring supermajorities (e.g., 60%) is seen as privileging the status quo undemocratically.
       - **Procedural Minimalism:** Mimicking a legislative vote (50%+1 wins) aligns with simple majoritarianism. Turnout quorums (when used) address participation, not margin size.
       - **"Will of the People" Rhetoric:** The outcome is framed as the *direct* voice of the electorate, bypassing representatives. 52% is treated as conclusive because it’s seen as the "people’s verdict," not a policy mandate.
     - **Implied Theory:** **Populist/Plebiscitary Legitimacy.** The majority’s decision *is* sovereign on that question. Legitimacy comes from direct expression, not enduring consent or institutional stability.

  ---

  ### **Contradictions & Tensions**
  1. **Presidency vs. Legislature:**  
     The presidency demands majority *authorization* for one person. Legislatures accept plurality *selection* of parts of a body that later forms majorities *procedurally*. This isn't inherently contradictory – it treats executives and assemblies as distinct entities with different functions. **Tension arises when:** A party winning a legislative majority on 35% claims a "mandate" comparable to a president elected with 51%. The presidency’s authorization theory clashes with the legislature’s procedural theory when mandate rhetoric overreaches.

  2. **Referendum vs. Presidency:**  
     Referendums accept 50%+1 to decide profound constitutional issues (e.g., Brexit), while presidents require >50% to manage routine governance. This *is* contradictory if legitimacy requires explicit majority consent for high-stakes decisions. The referendum’s "decisiveness" principle directly opposes the presidency’s "broad consent" principle for similarly existential choices.

  3. **Referendum vs. Legislature:**  
     A referendum settles a complex issue with 52%, but a legislature elected by FPTP may have no party close to 50% support. Here, the contradiction is in *how majorities are formed*: direct plebiscite vs. fragmented representation + parliamentary bargaining. The referendum assumes a majority exists on the issue; the legislature assumes a majority must be constructed from pluralities.

  ---

  ### **A Single Unifying Principle? The Cost of Consistency**
  No single principle cleanly generates all three. The closest is:  
  **"Legitimacy requires decision-making capacity, but the source of legitimacy differs by institution."**  
  - *Presidents* need personal authorization (capacity via direct mandate).  
  - *Legislatures* need workable majorities (capacity via procedural aggregation).  
  - *Referendums* need decisive answers (capacity via direct majoritarianism).  

  **If forced to one standard:**  
  - **Apply Presidential Standard (Majority):**  
    - *Cost:* Legislative runoffs would fracture party systems, increase voter fatigue, and likely entrench dominant parties. Mandatory referendum supermajorities (e.g., 55%) could paralyze change and privilege minorities.  
  - **Apply Legislative Standard (Plurality):**  
    - *Cost:* Presidents elected with 35% face severe legitimacy crises (e.g., governance instability). Referendums decided by 35% would lack credibility for major decisions.  
  - **Apply Referendum Standard (50%+1):**  
    - *Cost:* Presidents could win with minimal majorities in polarized societies, weakening national unity claims. Legislatures would still need FPTP or PR to function – the referendum standard doesn’t resolve assembly legitimacy.  

  **The Real Cost of Consistency:** You sacrifice institutional differentiation. Executives, assemblies, and direct democracy serve distinct purposes. Harmonizing their legitimacy rules would:  
  - Undermine executive stability (if using plurality).  
  - Cripple legislative efficiency (if requiring majority per seat).  
  - Destabilize constitutional settlements (if referendums needed supermajorities).  

  **Conclusion:** The practices aren't driven by a single theory but by *functional adaptation*:  
  - **Presidential runoffs** solve the "indivisible office" problem.  
  - **Plurality legislatures** prioritize governability over perfect representation.  
  - **Simple-majority referendums** favor clarity over consensus.  
  The contradictions reflect deeper tensions in democracy: between **authorization** and **governance**, **representation** and **decisiveness**, **stability** and **inclusion**. No system resolves these perfectly – hence the messy, context-dependent legitimacy standards you observe. The "problem" isn't your oversight; it's democracy's inherent balancing act.
