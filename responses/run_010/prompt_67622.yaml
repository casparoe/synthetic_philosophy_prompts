  Hmm, the hospice nurse scenario is particularly strong - it forces confrontation with the "no piecemeal objectivity" claim in a real-world context where detachment seems ethically necessary. The mute resenter case cleanly tests whether address requires actual expression. For fittingness, the challenge is explaining normativity without appealing to quality of will - her likely "demand defines fittingness" reply will need pressing on circularity.

  The historical blame question might need tightening - dead targets can't receive demands, so is this just expressive theatre? Her deflection about "attitude not being pure" should be met by asking what purity consists in. For psychopaths, the arbitrariness charge is key: if responsibility depends on our choice to engage, doesn't that collapse into conventionalism?

  Noting British English requirement - will use "whilst" and "amongst" where natural. Structuring each Q with: 1) plain setup, 2) imagined reply, 3) biting follow-up. The falsification closer must prevent "more work needed" escapes by demanding specific abandonment conditions.

  Right, drafting with surgical precision: first question targets fittingness to set stakes high early. Hospice case fourth for concrete impact. Psychopath and guilt questions adjacent to show tension in reciprocity claims. Final question requires her to name what evidence would defeat her theory - no waffle allowed.
answer: |-
  Here are eight incisive questions tailored to the speaker's position, phrased in plain British English and designed to challenge the core commitments whilst remaining accessible. Each includes the anticipated reply and a sharp follow-up.

  1.  **Question:** You argue that resentment *is* addressing a demand, not a feeling caused by a belief about ill will. But what makes a demand *fitting* or *apt*? On the standard view, resentment fits when there *was* ill will. On your view, if resentment just *is* the demand, what stops it being arbitrary or merely expressive shouting? Why isn't *any* demand I shout at someone resentment, even if they did nothing wrong?
      *   **Anticipated Reply:** The fittingness *is* constituted by the appropriateness of making the demand *in that second-personal context*. It’s apt when the demand is one we are entitled to make of each other as responsible agents. It’s not about tracking a prior fact; the demand defines the normative space.
      *   **Follow-Up:** Doesn't this risk circularity? If the demand's aptness *just is* its being resentment, and resentment *is* the demand, how do we ever judge a demand as *unfitting* resentment without appealing to something outside the demand itself, like the quality of will you reject? What independent standard governs 'entitlement to make the demand'?

  2.  **Question:** How does your account explain blaming people who *can't possibly* hear or respond to a demand? Imagine I feel deep resentment towards Julius Caesar for crossing the Rubicon, or blame a long-dead relative for a past wrong, or condemn a defunct corporation. What demand am I addressing, and to whom?
      *   **Anticipated Reply:** These aren't pure cases of reactive engagement. They might involve imaginative projection, moral judgement, or expressive feelings drawing *on* the reactive framework, but they lack the genuine second-personal address possible only with a present, capable agent. It’s a different attitude, perhaps parasitic on the core case.
      *   **Follow-Up:** But the phenomenology and moral weight often feel identical to blaming a living person. If the core function of blame *is* second-personal address, why does this "parasitic" blame feel so central to moral life, and how can it carry such normative force if it lacks the defining feature? Isn't your account dismissing a significant part of actual moral practice?

  3.  **Question:** You insist the objective stance can't be adopted piecemeal; it's wholesale or not at all. Consider a hospice nurse dealing with an abusive, terminally ill patient. To provide consistent, compassionate care without burning out, she deliberately adopts a detached, clinical, managerial stance *specifically towards the patient's abuse*, whilst otherwise treating him with kindness. On your view, is she deceiving herself, undergoing moral corruption, or simply not engaging in blame at all? None seem like attractive options for her necessary coping strategy.
      *   **Anticipated Reply:** She *is* adopting the objective stance towards that patient *in that specific dimension of interaction*. My claim is you can't oscillate *within a single mode of engagement*. She’s shifted the framework for *that relationship aspect* to see the behaviour as a symptom to manage, not a wrong to address. It’s a change of subject regarding the abuse, not self-deception *if* consciously done.
      *   **Follow-Up:** But doesn't this *concede* that we *can* adopt the objective stance selectively – precisely towards the abuse – whilst maintaining ordinary interpersonal engagement otherwise (e.g., comforting him about his pain)? How is this fundamentally different from the "piecemeal" objectivity you initially ruled out as impossible or deceptive?

  4.  **Question:** Imagine the "mute resenter": someone who, when wronged, experiences the full suite of internal feelings – burning indignation, the sense of a violated claim, withdrawal of goodwill – but deliberately *never* voices it, signals it, or acts upon it outwardly. They keep it entirely to themselves. On your view, where resentment *is* addressing a demand, has this person actually blamed the wrongdoer?
      *   **Anticipated Reply:** Addressing a demand doesn't necessarily require vocalisation; it can be an internal stance *towards* the other. The mute resenter still holds the other accountable *in foro interno*. The demand is present in their orientation, even if unspoken.
      *   **Follow-Up:** If the demand can be entirely internal and unexpressed, how is this meaningfully different from the "feeling caused by a belief" you reject? What makes this internal state an *address*, rather than just a strong, belief-based feeling *about* the other person? Doesn't this collapse back into the very picture you oppose?

  5.  **Question:** You argue guilt isn't the mirror image of resentment because you can't address a demand *to yourself* in the relevant second-personal way. But we clearly *do* hold ourselves accountable. If guilt isn't self-address, what *is* it? And how does self-blame function differently from blaming others, if the core of blame is second-personal address?
      *   **Anticipated Reply:** Guilt involves a first-personal recognition of failure relative to a demand *we recognise as applying to us*. It’s the acknowledgement of debt or fault, not addressing a demand *to* oneself. The structure is different: it’s about seeing oneself *as* accountable, not performing an address *towards* an accountable other.
      *   **Follow-Up:** Doesn't this risk making guilt seem like a detached, third-personal judgement *about* oneself ("I recognise I failed") rather than the often intensely first-personal, painful experience of *being* accountable? How does your account capture the distinctive *sting* and motivational force of guilt, if it's not a form of self-address?

  6.  **Question:** Regarding individuals with severe impairments (e.g., psychopathy, advanced dementia) who seem incapable of understanding moral demands: on your view, is our refusal to hold them responsible simply a *choice* not to engage with them second-personally? If so, doesn't this make responsibility depend not on their capacities, but on our *decision* to treat them as capable of reciprocating? Why isn't this just arbitrariness?
      *   **Anticipated Reply:** It’s not mere choice; it’s recognising that second-personal engagement *presupposes* a capacity for reciprocity. We don't *decide* they lack it; we *recognise* their incapacity makes that form of engagement impossible or inappropriate. Responsibility *is* a status within this framework of possible mutual engagement.
      *   **Follow-Up:** But doesn't the *recognition* of incapacity itself involve a normative judgement? And isn't the line between "incapable" and "difficult to engage with" often blurry? Doesn't this mean that who gets counted as responsible *is* contingent on our collective practices of recognition and engagement, rather than an objective fact about their will – potentially leading to exclusion or unfairness?

  7.  **Question:** If resentment *is* the act of addressing a demand, rather than a response to a prior fact about ill will, how do we explain justified resentment towards someone who acted with *good* intentions but caused serious harm through negligence? The standard view can say their lack of *due regard* warrants the feeling. If resentment just *is* the demand for regard, what warrants *this specific demand* in this case, rather than simply pointing out their mistake?
      *   **Anticipated Reply:** The demand *is* warranted precisely because their action, however well-intentioned, failed to show the regard we are entitled to expect. The resentment *is* the insistence on that standard of regard. The lack of due regard isn't a prior fact causing resentment; it's what the demand *invokes*.
      *   **Follow-Up:** This seems to conflate the *content* of the demand ("You should have shown due regard!") with the *warrant* for making that demand *in the reactive mode of resentment*. Why is the demand appropriately expressed as *resentment* (with its characteristic anger and withdrawal) towards the merely negligent, rather than as, say, disappointed instruction? Doesn't your account struggle to differentiate the force of resentment from other forms of moral criticism?

  8.  **Question:** Ultimately, what specific evidence or philosophical discovery would lead you to abandon your demand-first account entirely? Please be concrete – what would definitively show this core idea is mistaken?
      *   **Anticipated Reply:** If it could be shown that a recognisable practice of holding responsible demonstrably functions *without* any element of implicit address or second-personal expectation – if, for instance, we found beings who *only* experienced reactive attitudes as internal feelings triggered by beliefs about will, with no connection to demands *on* the wrongdoer. Or if the account proved utterly unable to explain the normative structure of fittingness without collapsing into circularity or conventionalism.
      *   **Follow-Up:** Given your earlier responses, you might interpret phenomena like mute resentment or historical blame as 'impure' or 'parasitic', and fittingness as internal to the practice. Doesn't this make your account potentially unfalsifiable? Could *any* apparent counter-example be explained away as not the 'core case'? How would we *know* if we found the evidence you just described?
