prompt: |-
  Three hours last night, most of it after midnight, arguing with a friend who is a statistician and does not read philosophy, and I came away unable to reconstruct my own position. I am giving a job talk in eleven days and I would rather be ambushed by you now than ambushed in the room.

  You are to act as a decision theorist who has both built and refereed the representation-theorem literature on choice under uncertainty, and who has sat through a great many hostile question periods and knows how they actually go. Think carefully before writing, and start by reasoning through where my view is structurally exposed rather than drafting replies first.

  **The thesis.** I defend a version of risk-weighted expected utility: preferences are represented by taking the utility of each outcome and weighting it by a function of the cumulative probability of doing at least that well, so that the shape of the weighting function — not the shape of the utility function — carries the agent's attitude to risk. My two distinctive claims are these. First, the weighting function is not a preference parameter to be elicited from behavior but a norm about how much decisional weight an agent owes each branch of a gamble, given that she will live through exactly one of them and not the others; that is what makes the weighting non-arbitrary rather than merely another taste. Second, this norm applies to a choice as the agent faces it, under the description under which she faces it, and not to whole sequences of choices solved in advance as a global plan. From the second claim I argue that sequential-choice money pumps do not show the view incoherent, only that it refuses to rank plans the way the pump assumes; and from the first I argue that risk-weighting, not a bounded utility function, is the right way to refuse Pascalian bets on tiny probabilities of astronomical payoffs.

  **The audience.** An economics department colloquium, forty-five minutes plus questions. The room is mostly mathematical economists who treat the Anscombe–Aumann framework as the substance and see departures from it as either reducible or unmotivated; two behavioral economists who run experiments on ambiguity and who already use rank-dependent utility with probability weighting, and will therefore ask what is new; a senior theorist who has written against non-additive representations and who will be polite and fatal; a philosopher of probability who thinks probability is only ever about states and will press on whether my "branches" are states; and four or five graduate students affiliated with an effective-altruism center who want to know why I am not maximizing expected value over extinction risk. Nobody in the room works on risk-weighted expected utility directly, and at least two will have met it only through critiques of it.

  **Where I am currently bleeding.** My friend pressed two things. She said that over any fixed finite menu of gambles my weighting function is doing no work that a sufficiently bent utility function — or a state-dependent one — could not do, so I have changed the notation and not the subject. And she sketched a three-step sequential choice in which, at each step, I would accept a small payment to alter the gamble, and end up strictly worse off than if I had never started, and said that settles the matter. I defended the first point and folded on the second somewhere around one in the morning. I need to know whether folding was correct.

  Please write the prep sheet in American English, with these sections in this order:

  1. **Diagnosis** (about 200 words). Where the load actually sits: which of my two claims is doing the work, which is decorative, and what the economists' default framing will render invisible to them. If you think the thesis is false, say so plainly here and then prepare me anyway.
  2. **The Objection Queue** (the bulk of the sheet; seven to nine objections). Order them by likelihood multiplied by damage, worst first. For each, give four labeled parts: *How it will be asked* — one or two sentences in the idiom of the specific person who asks it, and who that is; *Why it bites or doesn't* — one sentence; *Two-minute reply* — roughly 150 words, phrased so it can be said aloud while someone is watching the clock; *Where the reply is soft* — one sentence naming the exact spot I should not be pushed toward.
  3. **Concessions to Make in the First Five Minutes** (about 200 words). What I should hand over before anyone asks, and the wording that makes the concession look like confidence rather than retreat.
  4. **My Friend's Two Objections, Settled** (about 350 words). Take each in turn: is the reduction charge right, and is the sequential pump fatal, given my second claim? Tell me exactly which dynamic-choice principle I am giving up and whether the standard names for it are the ones I should use in the room.
  5. **The One Reply That Has to Land** (about 150 words). The single move on which the rest of my answers depend, and how to say it so that the behavioral economists and the senior theorist both hear it.
  6. **The Question I Am Praying Nobody Asks** (about 200 words). The question I would most hate to be asked, why I cannot currently answer it, and an honest response that neither stonewalls nor concedes the talk.

  Two further constraints. Where an objection turns on a concrete gamble, give me the gamble with numbers rather than describing it in prose. And do not append a bibliography or a reading list; name the standard machinery where naming it helps — the sure-thing principle, rank-dependent utility, ambiguity aversion, money pumps — but assume I cannot look anything up between now and the talk.
reasoning: |-
  Hmm, the user is preparing for a high-stakes job talk defending a nuanced decision theory position. They've clearly been through a bruising debate with a statistician friend and need tactical preparation for hostile economists. The core tension is between their philosophical grounding of risk-weighting as normative and the economists' formalist expectations.

  The user's thesis has two pillars: (1) risk-weighting as obligation (not preference) and (2) description-dependence rejecting global planning. The friend attacked both - reduction to utility functions and sequential incoherence. I need to diagnose which pillar matters more (it's the first) and how the audience will miss the normative leap because they see choice models as positive.

  For objections, the senior theorist's "just state-dependent utility" charge is most dangerous because it undermines the entire innovation. The reply must emphasize that risk-weighting operates on cumulative distributions, not states, making it a fundamentally different object. But the soft spot is their unwillingness to see cumulative probabilities as psychologically real.

  The money pump concession is necessary - they must explicitly surrender dynamic consistency but frame it as principled ("description-relativity requires local validity"). The EA students' megadeath objection is tricky; I'll suggest redirecting to their own epistemic humility about infinite stakes.

  For the friend's challenges: The reduction argument fails because state-dependent utilities can't explain why risk-attitudes change predictably with probability ranks. But the money pump stands - they need to name "consequentialism" as what's being rejected, not just dynamic inconsistency.

  The make-or-break point is forcing the room to see that "risk" isn't just variance - it's about the narrative position of outcomes in the distribution. The behavioral economists might actually help here if prompted to recall how rank-dependent models predict Allais paradoxes.

  The nightmare question would be about repeated gambles: if each local choice is valid but globally disastrous, how is this not irrational? The honest reply is that rationality might be context-bound, which economists will hate but philosophers might respect. Best to preempt by conceding limited scope early.

  Throughout, the user must avoid getting dragged into formalism battles and keep returning to the core idea: weighting reflects how we inhabit uncertainty, not just choose under it.
answer: |-
  ## Prep Sheet for Risk-Weighted EU Job Talk

  **1. Diagnosis**  
  Your core vulnerability is the *first claim* (weighting as normative obligation, not preference). Economists will see it as philosophical decoration obscuring a standard rank-dependent utility model. Their framing reduces all attitudes to preferences over consequences/state-contingent outcomes. They'll invisibly assume: 1) "Risk attitude" *must* be captured by utility curvature or state-dependence; 2) Norms must be revealed by choice or they're arbitrary. Your second claim (description-relativity/anti-planning) is crucial defensively but won't convince them alone. The first claim is doing the heavy lifting—if it fails, you're just RDU with extra steps. The thesis isn't false, but its novelty hinges entirely on selling the normativity of weighting, which clashes fundamentally with their revealed-preference worldview.

  **2. The Objection Queue**  

  1.  **Objection:** (Senior Theorist) "This is isomorphic to state-dependent utility. Let states be branches. Assign utility U_s(o) = w(1 - F_o(u(o))) * u(o) for outcome o in state s. Your weighting is just a different way to parameterize tastes over state-contingent bundles."
      *   **Why it bites:** Directly attacks the necessity & novelty of your weighting function.
      *   **Two-minute reply:** "The isomorphism fails because branches aren't causally or epistemically independent states in the AA sense. The weighting function w acts on the *cumulative probability distribution* of utility, not on individual states. w(F(.)) transforms the *distribution* based on the agent's position *within* the gamble – their focus on 'how likely am I to do at least this well?' State-dependent utility treats each state's valuation as independent of the gamble's overall structure. Here, the valuation of an outcome *depends intrinsically* on its rank within the specific gamble. w captures a global attitude toward the gamble's risk profile, not a local state-specific taste."
      *   **Soft spot:** Defending the "reality" of branches vs. states without sounding mystical.

  2.  **Objection:** (Mathematical Economist #1) "Your rejection of sequential rationality is ad hoc. If your agent would pay to alter a gamble step-by-step and end up strictly worse off, their preferences are dynamically inconsistent. That's incoherent, full stop. It violates the principle of dynamic consistency/consequentialism."
      *   **Why it bites:** Uses standard rationality norms to declare your view irrational.
      *   **Two-minute reply:** "It's not incoherent; it's *description-relative*. The pump exploits a mismatch between the global description (the initial plan) and the local descriptions (choices at each node). My agent evaluates each *choice as faced* under its local description. The pump assumes choices *should* be governed by the initial global plan. I reject that norm. The 'incoherence' arises only if you demand preferences be defined over final outcomes alone, independent of the choice path. My agent cares about the path – *how* they face risk matters. They are consistent *within* each local context."
      *   **Soft spot:** Justifying why path-dependence isn't just irrationality.

  3.  **Objection:** (Behavioral Economist #1) "This looks like standard Rank-Dependent Utility (RDU) with a probability weighting function. Quiggin did this decades ago for risk. What's new? Are you just renaming the weighting function?"
      *   **Why it bites:** Questions novelty and reduces your view to existing behavioral models.
      *   **Two-minute reply:** "The *formalism* shares RDU's structure, but the *interpretation* is radically different. In RDU, w(p) is a psychological distortion of probability, a descriptive 'taste' for optimism/pessimism. Here, w is a *norm* governing how decisional weight *should* be allocated across branches, given you only experience one. It's not a distortion; it's a principled response to the nature of decision-making under uncertainty. This normative foundation is what allows me to reject Pascalian bets *without* resorting to bounded utility and to handle sequential choice uniquely."
      *   **Soft spot:** Distinguishing normative "weighting" from descriptive "distortion" clearly.

  4.  **Objection:** (Graduate Student / EA Affiliate) "Your rejection of Pascalian bets seems dangerous. If there's even a 1 in a googol chance of saving a googol lives, shouldn't we pay any finite cost? Your weighting function seems to arbitrarily dismiss tiny probabilities of vast value, potentially underprioritizing existential risk reduction."
      *   **Why it bites:** Connects your theory to high-stakes real-world concerns and implies it's irresponsible.
      *   **Two-minute reply:** "The argument isn't that tiny probabilities are *zero*. It's that weighting functions naturally assign *less-than-linear* weight to extreme tail probabilities. This reflects a norm: when facing mutually exclusive branches, the decisional weight owed to a wildly improbable branch, no matter its payoff, is constrained. A bounded utility function also avoids Pascalian bets, but it distorts valuation of large-but-plausible gains/losses. Risk-weighting targets the *probability weighting* specifically for extreme tails, preserving sensitivity to large finite stakes. It's a structured alternative to both naive EV maximization and blunt utility bounds."
      *   **Soft spot:** Justifying *why* the norm constrains tail weights without seeming arbitrary.

  5.  **Objection:** (Philosopher of Probability) "Your 'branches' sound suspiciously like states. If they aren't metaphysically distinct states, what are they? And if they are states, how is your framework different from state-dependent EU or non-additive capacities over states?"
      *   **Why it bites:** Challenges the ontological foundation of your branching structure.
      *   **Two-minute reply:** "Branches are *descriptions of outcomes within a specific gamble*, ordered by their utility. They aren't primitive states existing prior to the gamble. The gamble defines the possibility space. The cumulative probability F(u) is defined *relative to this specific gamble*. States in AA are primitive, exogenous, and the same across all acts. My branches are gamble-dependent and defined by the outcome ranking *within that gamble*. The weighting applies to the gamble's internal structure, not to fixed states."
      *   **Soft spot:** Explaining gamble-dependent branches without collapsing into just describing outcomes.

  6.  **Objection:** (Mathematical Economist #2) "Even granting your local view, how do you normatively justify a *specific* weighting function shape? Why is *this* w(F) the 'owed' weight, not another? Isn't this just reintroducing arbitrariness as normative posturing?"
      *   **Why it bites:** Attacks the core normative claim as vacuous or circular.
      *   **Two-minute reply:** "The specific shape isn't dictated a priori. The normative core is the *structure*: weight *should* depend on the cumulative distribution F(u), reflecting the agent's position ('how likely am I to do at least this well?'). This structure itself imposes constraints – w must be increasing, etc. Different agents might justifiably apply different w functions *within this structure* based on their circumstances or disposition towards uncertainty, but the *form* of weighting by F(u) is the non-arbitrary element. It captures the obligation to consider your exposure within the gamble's risk profile."
      *   **Soft spot:** Avoiding sounding like "any w is fine, as long as it's called normative".

  7.  **Objection:** (Behavioral Economist #2) "Experiments show people violate description invariance (e.g., framing effects). Your view seems to embrace this. Doesn't that just endorse irrationality?"
      *   **Why it bites:** Associates your view with well-known biases, implying it's descriptively accurate but normatively weak.
      *   **Two-minute reply:** "Framing effects often exploit irrelevant descriptions. My claim is *not* that all descriptions are equal. It's that the *context of choice* – the specific gamble as presented, including its sequential structure if relevant – matters normatively. A good description accurately reflects the agent's epistemic and practical position facing the choice. Rejecting description invariance isn't endorsing irrational framing; it's acknowledging that the *meaning* of a choice, and thus the appropriate norm, depends on how it's encountered. A global plan imposes an artificial, often irrelevant, description on local choices."
      *   **Soft spot:** Distinguishing "context matters" from "framing is rational".

  **3. Concessions to Make in the First Five Minutes**  
  "Before diving in, let me clarify scope. First, I'm not claiming standard EU or RDU is *wrong* descriptively. People might use distorted probabilities or have curved utility. My claim is normative: risk-weighting based on cumulative probability is the *right structure* for capturing rational risk attitudes. Second, I fully concede that my agent can be 'money-pumped' in sequential choices if we demand global dynamic consistency. I reject that demand. Rationality, on this view, is *locally valid* – applying to choices under the descriptions agents actually face – not requiring commitment to a pre-defined plan immune to re-evaluation. This path-dependence is a feature, not a bug, reflecting how we genuinely encounter risk."

  **4. My Friend's Two Objections, Settled**  

  *   **Reduction Charge (Is w just hidden utility?):** Your friend is partly right *mathematically* over a fixed finite menu. For any finite set of gambles, *some* state-dependent utility function or sufficiently nonlinear utility function could mimic the choices generated by your risk-weighted EU. **However, this misses the point.** The power of your view is its *structure* and *interpretation*. 1) **Structure:** The risk-weighting model naturally predicts systematic phenomena like Allais paradoxes *through the weighting function*, while state-dependent utilities would need ad hoc state definitions for each new gamble. Your model imposes a consistent structure (weighting by cumulative probability) across different gambles. 2) **Interpretation:** The reduction is purely formal. It doesn't capture the *normative rationale* – that the weighting reflects an obligation based on the agent's position *within the gamble's risk distribution*. A curved utility function explains risk aversion as diminishing marginal value; state-dependence explains it as state-specific tastes. Your view explains it as a norm about allocating weight across branches given mutual exclusivity. The reduction shows formal flexibility, not theoretical equivalence.
  *   **Sequential Pump & Dynamic Choice:** **Folding was likely correct, but it's not fatal given your second claim.** The pump demonstrates a violation of **Dynamic Consistency (DC)** or, more fundamentally, **Consequentialism** (the idea that only final outcomes matter, and choices at nodes should be made as if facing a subproblem from that point on, ignoring how you got there). You are explicitly rejecting Consequentialism. *Use the term "Consequentialism" in the room.* Your agent is **Dynamically Inconsistent** *according to the Consequentialist norm*. Your defense is that Consequentialism is the wrong norm for sequential choice under your view. Rationality requires only that each *local choice* is justified under its *local description* (the choice as faced at that moment, considering the gamble presented then, not the original global plan). The 'loss' in the pump arises when comparing the *path* to the *initial global plan*, but your agent doesn't value plans, only choices in context. This is a deliberate feature. You are giving up Consequentialism/Dynamic Consistency for **Local Validity** or **Contextualism**.

  **5. The One Reply That Has to Land**  
  **To the Behavioral Economists & Senior Theorist:** "The crucial move is recognizing that 'risk attitude' isn't *just* about the curvature of value (utility) or distorted probabilities (w(p)). It's fundamentally about *how we position ourselves within the distribution of possible outcomes*. The weighting function w(F(u)) directly encodes this: it answers 'How much weight should I give to this outcome, knowing F(u) is the chance I'll do *at least* this well?' *That* question – central to the experience of risk – is obscured by utility curvature and isn't directly captured by state-dependence or simple probability weighting. This positioning is why risk-attitudes are gamble-dependent and why local validity matters more than global plans." *Land this early, before objections pile up.*

  **6. The Question I Am Praying Nobody Asks**  
  **The Question:** "Suppose your agent faces a *long sequence of identical, independent gambles*, each described locally. According to your theory, they evaluate each gamble *separately* under its local description. However, due to the risk-weighting, they might (e.g., if w is pessimistic) reject each gamble, even though accepting *all* of them has a very high probability of a large positive payoff and a negligible probability of significant loss (by the law of large numbers). Isn't this an obviously foolish pattern of choices? How can locally rational choices, repeated, lead to globally terrible outcomes? Doesn't this prove the necessity of dynamic consistency or some form of global planning?"

  *   **Why it's devastating:** It combines the path-dependence weakness with a starkly irrational-seeming consequence in a repeated, symmetric setting. The law of large numbers makes the 'global' view overwhelmingly compelling. It directly challenges the normative adequacy of pure local validity.
  *   **Why you can't currently answer it perfectly:** Your theory currently lacks a principled way to handle repeated gambles beyond isolated local evaluation. A truly satisfying answer requires developing a notion of "meta-context" or higher-order norms for recurring situations, which you haven't fully fleshed out.
  *   **Honest Response:** "That's an excellent and challenging point. My current framework focuses on isolated or distinctly described choices. Repeated, identical gambles present a unique challenge. One line of response is that *repetition itself changes the description* – the agent isn't facing *a* gamble, but *a sequence*. Perhaps the norm should apply to the sequence *as a whole* when recognized as such. Alternatively, perhaps the risk-weighting norm itself needs refinement for recurring risks. I concede this is a significant area needing further development. It highlights the tension between local context and long-run rationality. My core claim is that *for genuinely novel or contextually distinct choices*, local validity is primary, but I acknowledge the need to integrate this better with recurring decision problems. This doesn't invalidate the approach for non-repetitive cases like Pascalian bets or unique sequential decisions." *(This concedes a problem but defends the core domain and commits to future work).*
