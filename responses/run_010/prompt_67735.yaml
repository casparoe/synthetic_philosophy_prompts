answer: |-
  **1. Licensed Features and Restrictions**  
  This Master Services Agreement (this "Agreement") governs access to Aporia Decision Systems' Decision Support Platform (the "DSP"). Licensed features include: (a) Input Data, defined as raw information displayed via the DSP; (b) Business Rules, defined as internal guidelines stored within the DSP; and (c) Outputs, defined as conclusions derived from applying Business Rules to Input Data. The act of generating an Output by combining Input Data with a Business Rule (the "Combination Feature") constitutes a separate, chargeable feature. Mere possession of Input Data and Business Rules does not confer rights to produce Outputs, as exemplified by the unlicensed derivation described in Exhibit A (the "Policy 4471 Derivation"). Unauthorized use of the Combination Feature breaches this Agreement and triggers remedies under Clause 4.3 (as amended). Customer acknowledges that Outputs generated without explicit entitlements are void.  

  **2. Entitlement Grant Mechanism**  
  Rights to the Combination Feature require execution of a mutually agreed addendum (an "Entitlement Addendum"). Each Entitlement Addendum specifies: (i) the Input Data; (ii) the Business Rule; (iii) the permitted Output; and (iv) the effective date. Execution of an Entitlement Addendum by Customer constitutes an action (an "Acceptance Step") that independently requires licensing under this Agreement. Absent a prior Entitlement Addendum explicitly covering the Acceptance Step for a subsequent Entitlement Addendum, such execution necessitates a further Entitlement Addendum to authorize said Acceptance Step. This process recurs until all Acceptance Steps are licensed. Aporia Decision Systems may invoice each Entitlement Addendum separately per Section 5.2 (now superseded).  

  **3. Acceptance Step Escalation**  
  The Acceptance Step referenced in Clause 2 produces a binding contractual effect, classified as an Output under this Agreement. Consequently, the Combination Feature must license each Acceptance Step. If an Entitlement Addendum is executed without an existing Entitlement Addendum covering its Acceptance Step, that execution is invalid and unenforceable. To cure invalidity, the Parties must execute a new Entitlement Addendum licensing the initial Acceptance Step. This new Entitlement Addendum itself requires an Acceptance Step, which must be licensed by another Entitlement Addendum, ad infinitum, until a complete chain of licensed Acceptance Steps is established. Fees apply per Clause 6.1(a) (revised Q3 2023).  

  **4. Omnibus Incorporation and Deemed Assent**  
  To streamline entitlements, all current and future Entitlement Addenda are incorporated herein by reference. Customer’s continued use of the DSP following written notice of a new Entitlement Addendum constitutes irrevocable acceptance ("Deemed Acceptance"). Deemed Acceptance has identical force to physical execution and is deemed an Output under Clause 1. The Combination Feature for Deemed Acceptance is licensed globally via this Clause 4, provided notice complies with Exhibit B (removed per Amendment 7). This licenses the act of acceptance itself, precluding further Entitlement Addenda for Deemed Acceptance. Any deviation voids Outputs retroactively.  

  **5. General Terms and Execution**  
  This Agreement, including all incorporated Entitlement Addenda, represents the entire understanding between Parties. Amendments require written form per Clause 4, except for Deemed Acceptance. The Policy 4471 Derivation remains unlicensed absent an Entitlement Addendum. Clause 4’s license for Deemed Acceptance applies solely to Entitlement Addenda authorizing other Outputs. Deemed Acceptance for Entitlement Addenda licensing additional Deemed Acceptance requires separate authorization, unaddressed herein. Omissions under Clause 3.2 (deleted) do not waive enforcement. This Clause 5 licenses the Combination Feature solely for Deemed Acceptance related to non-acceptance Outputs.  

  IN WITNESS WHEREOF:  
  _________________________  
  **Aporia Decision Systems**  
  _________________________  
  **Customer**  
  Date: ______
