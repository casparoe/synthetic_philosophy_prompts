prompt: |-
  ok so I've been keeping a running list of my friend D's calls on which decisions are "clueless" in the technical-ish sense we all absorbed from the long-run-ripple-effects literature, because I'm increasingly convinced he isn't runing one rule and I want to know which ones are live candidates.

  His verdicts so far:

  - $5k to one of the top-rated malaria charities: clueless.
  - $5k to a cataract-surgery fund, where the pitch is sight restored plus recipients back at work: clueless.
  - Yanking a stranger backwards off the curb out of the path of a bus: not clueless. He says you know exactly what you did there.
  - A Saturday ladling soup at the shelter three blocks from his apartment: not clueless.
  - Driving 20 minutes out of your way to give a stranger a jump: not clueless.
  - Having a kid, after years of being on the fence: clueless, obviously.
  - Putting money behind a ballot measure to legalize something: clueless.

  Note the tension I keep hitting him with: the standard argument is that any act has consequences running centuries forward that could swamp and reverse the intended effect, and if that were the whole rule the bus case would be clueless too, since the guy he yanks back goes on to have descendants and vote and so on. He grants that in principle and still says the bus case is different, so whatever he's actually running isn't just "there are long-run effects."

  New case. His sister wants to spend two years writing and recording a free public data-literacy / intro-statistics course, entirely herself — no grant, no NGO, no third-party cost-effectiveness spreadsheet, she just makes the videos and puts them online. Her model of the downstream effects is basically nil: she can't tell you how many people finish it or what they do afterward. But she also says she can't construct a single story where it makes the world worse, and that if you asked her for a probability that it's net-negative over 200 years she'd be making the number up out of thin air.

  What does he say? Then do the part I actually care about: lay out the candidate rules that fit all seven earlier calls, say what each predicts for the sister, give your best guess which one he's on and why. I want at least these families considered and kept or killed: causal chain runs through institutions, markets and demography vs. through particular individuals; the evidence for the effect comes from interested third parties vs. from your own eyes; your subjective EV is unstable once you add possibilities you can't put probabilities on; and plain long-run swamping. Flag which of them collapse into each other given this track record — the shelter case and the cataract fund case look like they're doing a lot of work here, since both go through an NGO but got opposite verdicts.

  And for each surviving rule, tell me whether cluelessness comes out as a fact about the decision or as a fact about D's evidence, because I think that's the real fork and I can't get him to say which side he's on.

  Last thing: name one more case I could put to him that would split the two leading candidates, and which way each candidate goes on it. No lit review please, I've read the lit, I want the rule-space.
reasoning: |-
  Hmm, the user is presenting an interesting puzzle about cluelessness in decision theory. They've been tracking their friend D's judgments on various actions and want to reverse-engineer the underlying rule D is using, especially since there seems to be tension between the "standard" long-run ripple effects argument and D's actual pattern of judgments.

  Looking at D's verdicts: He calls large charitable donations clueless but immediate physical interventions (like saving someone from a bus) not clueless. Even small personal acts like volunteering at a nearby shelter or helping with a car jump are deemed not clueless. Having kids and political donations are clueless. The key tension is why the bus rescue isn't considered clueless despite its potential long-term ripple effects.

  The new case about D's sister creating a free statistics course is interesting because it's a direct individual action with uncertain but plausibly positive effects. Based on D's pattern, I suspect he'll call this clueless too, since it resembles the charity cases in its uncertainty and lack of immediate feedback.

  For candidate rules, several families emerge from the cases:

  - **Institutional mediation**: Actions going through large systems (like charities) are clueless; direct personal actions aren't. This fits all cases: the malaria charity, cataract fund, and ballot measure all go through institutions, while bus rescue, soup kitchen, and car jump don't. The sister's course is direct action but might be ambiguous since she's acting alone. Prediction: Clueless if we emphasize the "system-like" scale.

  - **Evidence source**: If you rely on third-party evidence (like charity evaluators) it's clueless; direct sensory evidence makes it not clueless. This explains why cataract charity (third-party data) is clueless but soup kitchen (direct observation) isn't. The sister's case has no third-party evidence, so not clueless? But this might conflict with D's likely verdict.

  - **EV instability**: When extreme tail risks dominate expected value calculations, it's clueless. This could cover charity cases and political actions where small probabilities of huge effects make EV unreliable. The sister's course would likely be clueless under this rule. But why isn't the bus rescue considered similarly unstable?

  - **Demographic/institutional channels**: If effects primarily flow through changing population or institutions, it's clueless; if through concrete individuals, it's not. This fits well: charity donations affect demographic/economic systems, while bus rescue affects one identifiable person. The sister's course would be clueless under this rule.

  The shelter case and cataract case are crucial because both involve NGOs but got opposite verdicts. The difference seems to be that the shelter involves direct, observable interaction, while the cataract fund relies on abstract reports. This suggests evidence source or personal interaction is key.

  On the ontology fork: For institutional/demographic rules, cluelessness seems like a fact about the decision type. For evidence-based rules, it's about the decision-maker's epistemic state. D seems to lean toward it being decision-type-based, given his consistency.

  A good test case would be donating to a local homeless shelter where you sometimes volunteer. Institutional mediation would call it clueless (goes through an organization), while evidence source might not (if you have direct experience). This could split the candidates.

  For the sister's case, I predict D will say clueless, with institutional/demographic rules being the strongest fit. The evidence source rule might be secondary but less consistent with all cases.
answer: |-
  Here's a systematic breakdown based on D's pattern, your specified candidate rules, and the ontology fork. D's sister's case is pivotal—I'll start with the prediction, then analyze the rules, and end with a test case.

  ### Prediction for Sister's Case
  D will call the data-literacy course **clueless**. Despite its direct, solo creation, it mirrors the charity cases: effects depend on complex, unobserved chains (how viewers use the knowledge, economic shifts, etc.), and "can't construct a story where it makes the world worse" is dismissed as naïveté (like the cataract fund's "sight restored" pitch). The lack of a measurable feedback loop (no tracking of outcomes) pushes it into long-run institutional/demographic territory.

  ---

  ### Candidate Rules & Predictions for Sister's Case
  I'll evaluate your four rule families against all seven cases, flag collapses, and note the ontology of cluelessness (decision vs. evidence). Key tensions:
  - **Shelter vs. Cataract Fund**: Both NGO-mediated, but shelter is *not clueless* (direct sensory evidence), cataract is *clueless* (third-party evidence).
  - **Bus vs. Malaria Charity**: Both could have long-run swamping, but bus is *not clueless* (direct causal chain), malaria is *clueless* (institutional mediation).

  | Rule Family                          | Sister's Course Prediction | Fits All 7 Cases? | Cluelessness Ontology | Notes & Collapses |
  |--------------------------------------|----------------------------|-------------------|------------------------|-------------------|
  | **1. Institutional/Demographic Channels** | **Clueless** | Yes | Fact about the decision | Effects primarily flow through large-scale systems (markets, governments, populations). Direct individual effects are "safe." **Shelter case fits**: it's hyper-local, no demographic ripple. **Cataract fund fails**: targets population-level change. **Collapses long-run swamping** (bus is exempt as individual act). |
  | **2. Evidence Source**               | *Not Clueless?* (Weak fit) | No | Fact about evidence | Clueless if relying on third-party data (NGO reports, cost-effectiveness models). Not clueless if evidence is direct sensory (seeing soup served) or simple causal intuition (yanking from bus). **Fails shelter case**: shelter uses NGO, but verdict is *not clueless* due to direct evidence. **Sister's case ambiguous**: no third-party data, but D likely ignores her "no negative story" claim as unsupported. |
  | **3. EV Instability from Tail Risks** | **Clueless** | Borderline | Fact about evidence | Clueless if adding low-probability, high-impact tail risks (e.g., "malaria charity funds warlord") makes expected value (EV) incalculable or unstable. Not clueless if tail risks are negligible (bus: immediate death averted dominates). **Fails soup kitchen**: tail risks exist (e.g., shelter attracts crime), but D calls it not clueless. **Sister's case fits**: "probability net-negative over 200 years made up" implies unstable EV. |
  | **4. Long-Run Swamping**             | *Not Clueless?* (Fails) | No | Fact about the decision | All acts are clueless due to unpredictable long-run effects swamping short-term intent. **Fails bus, soup kitchen, car jump**: D explicitly excludes these. **Collapses into institutional/demographic** if modified (e.g., swamping only matters for systemic acts). |

  #### Survivors & Ontology
  - **Strongest fit: Institutional/Demographic Channels**. Fits all cases cleanly: cluelessness is a **fact about the decision** (involves institutions/demography). Sister's course targets broad public knowledge → systemic effects → clueless.
  - **Secondary fit: EV Instability**. Fits 6/7 cases (weak on soup kitchen). Cluelessness is a **fact about evidence** (EV is epistemically inaccessible). Sister's course has no data → unstable EV → clueless.  
  - **Collapses**: Long-run swamping is subsumed by institutional/demographic (bus exempted). Evidence source is partially absorbed by institutional (shelter is local → "direct" institution) but conflicts on sister's case.

  **D's Likely Rule**: Institutional/Demographic Channels. Why?  
  - It cleanly explains the NGO split: shelter is local/personal (not clueless), cataract is population-scale (clueless).  
  - Bus rescue is "you know what you did" because it bypasses systems (saves *one* life, not changing institutions).  
  - Ballot measure is pure institutional change → clueless.  
  - Sister's course is public education → institutional/demographic lever → clueless.  

  **Ontology Fork**: D treats cluelessness as **fact about the decision**, not his evidence. He grants long-run effects *could* swamp the bus rescue but dismisses it as irrelevant—the *type* of act (individual vs. systemic) dictates cluelessness. Evidence matters only insofar as it confirms the act's "channel" (e.g., third-party data signals institutional mediation).

  ---

  ### Test Case to Split Leading Candidates
  **Propose this to D**:  
  > *You donate $500 to a homeless shelter where you volunteer monthly. You see regulars get meals, but have no data on long-term outcomes. The shelter is part of a national network.*

  - **Institutional/Demographic Rule Predicts: Clueless**  
    Money flows through an NGO system with demographic ripple effects (e.g., shelter funding affects local homelessness stats → policy changes). Scale/institutional mediation dominates, despite your volunteer evidence.  
  - **EV Instability Rule Predicts: Not Clueless**  
    Direct volunteer evidence anchors EV (you see meals served, reducing tail-risk uncertainty). Instability is mitigated, like the soup kitchen case.  

  **Why it splits**:  
  - Institutional rule focuses on the donation's *systemic path* (money → NGO → broad effects).  
  - EV Instability rule focuses on your *evidence* (observing meals reduces uncertainty).  

  If D says **clueless**, he's likely on institutional/demographic. If **not clueless**, he's weighting evidence stability. This also pressures the ontology fork: if he calls it clueless despite direct evidence, cluelessness is decision-based; if not, it's evidence-based.  

  --- 

  ### Summary
  - **Sister's case**: Predict D says **clueless** (institutional scale).  
  - **D's rule**: **Institutional/Demographic Channels** (cluelessness as fact about decision type).  
  - **Test case**: Shelter donation splits institutional (clueless) vs. EV instability (not clueless).  

  This tracks D's intuition that the bus rescue is "different" in kind—not because long-run effects vanish, but because it operates outside systems he deems unpredictable. The shelter volunteering is a "direct" institution, while the sister's course is a "broad" one. Push him on the test case: if evidence (e.g., seeing soup served) can redeem an NGO-mediated act, his rule is evidence-based; if not, it's structural.
