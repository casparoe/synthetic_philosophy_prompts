prompt: |-
  I lead a small analysis team at a grid operator. We put probability estimates on rare failure modes and our regulator scores them with a Brier-type rule, so at the end of the day we have to hand over one number. Trouble is a lot of those numbers rest on a handful of past incidents plus modeling choices a reasonable person would make differently, and I've been reading about imprecise probabilities — sets of priors, interval credence, that dilation business where getting new evidence makes your range wider rather than narrower — and I suspect we're manufacturing precision we don't have.

  Write me a procedure my analysts can actually run when they build one of these estimates. When should the uncertainty live as a set or interval instead of a point; how do you carry that through updating, including the awkward cases where the data makes you less precise; how do you choose between the decision rules people use when you've got a set instead of a number; and where in the pipeline are we forced to collapse to a single figure for the scorer, what exactly gets thrown away at that step, and how should we log it so the number isn't standing naked on its own.

  Then run it on a concrete case: probability that a certain class of transformer fault cascades, nine events in fifteen years, two competing failure models that disagree by about an order of magnitude, and a sensor rollout that will improve the data but also change what counts as an event.

  Also flag the two or three steps that are really judgment calls dressed up as procedure. No headings, bullets, bold or tables please — just continuous prose, like an email.
reasoning: |-
  Okay, the user leads a small analysis team at a grid operator. They have to provide probability estimates for rare failure modes, which are scored by a regulator using a Brier-type rule. The challenge is that these estimates often rely on sparse data—like just a handful of past incidents—and modeling choices that could reasonably differ. They've been reading about imprecise probabilities and suspect they're manufacturing false precision. They want a practical procedure for their analysts to handle uncertainty as sets or intervals, update them even when new data increases uncertainty, make decisions with sets, and finally collapse to a single number for scoring, while logging what was lost in the process. They also want this applied to a concrete case involving transformer fault cascades, with nine events in fifteen years, two conflicting models, and a sensor rollout that changes event definitions. Plus, they want key judgment calls highlighted.

  First, I need to address their core concern about false precision. Imprecise probabilities (IP) seem perfect here—it's about sets of probabilities rather than single points, capturing model uncertainty and sparse data. The procedure should start by gathering all data and expert opinions, then defining the set of priors. For the transformer case, they have two models differing by an order of magnitude. So, the initial set could be a wide interval, say [0.001, 0.01], covering both models. 

  Next, updating with evidence. With nine events in fifteen years, a standard Bayesian approach would use a conjugate prior, but here we need to handle multiple priors. Each prior in the set is updated individually. But dilation is a problem—when data is ambiguous, intervals can widen. For example, if the sensor rollout changes what counts as an event, the data isn't directly comparable. I should show how the interval might expand during updates. 

  Decision rules come into play when analysts need to act based on the set. The user mentioned regulators need a single score, so collapsing is necessary. Using the maximal Brier score penalty (worst-case in the set) makes sense, but they have to log the discarded uncertainty. 

  For the concrete case: Start with a prior set [0.001, 0.01] based on the two models. Nine events over fifteen years, but exposure is tricky. If the denominator is transformer-years, say 1000 transformers, then exposure is 15,000 transformer-years. The likelihood is Poisson. Updating each prior in the set gives a posterior set. But with the sensor rollout, future events might be reclassified. This causes dilation—adding a new event could shift both bounds. For example, after one ambiguous event, the posterior interval might be wider than before. 

  Collapsing to a single number for the regulator: choose the interval's midpoint or the minimax Brier score. Log the full interval and the rationale. 

  Key judgment calls: Setting the initial bounds (experts might disagree), handling the sensor rollout's impact on data comparability, and choosing how to collapse the set for scoring. These steps rely on analyst judgment but should be documented transparently. 

  I should also consider the user's deeper needs. They want credibility with regulators and to avoid overconfidence. Logging the uncertainty helps justify their estimates later. Highlighting judgment calls ensures they're not hiding behind procedures. The procedure must be feasible for analysts—not too math-heavy, with clear steps. Emphasizing documentation throughout is crucial for accountability.
answer: |-
  Here's a procedure for handling the uncertainty transparently, followed by the concrete case study and identification of key judgment points. Keep it embedded in your workflow but log everything meticulously.

  **Procedure:**

  Start by gathering all data and expert opinions. Define the event clearly, including the system state and boundaries. Instead of forcing a single prior probability, define a *set* of reasonable priors. This set could be an interval (e.g., [0.0001, 0.01]) based on competing models, fundamental physics limits, or expert minimum/maximum plausible values derived from structured elicitation acknowledging disagreement. Document the rationale for the lower bound, upper bound, and why a single point isn't justified (e.g., "Model A suggests 0.001, Model B suggests 0.00015, expert range 0.0002 to 0.005").

  Updating with evidence requires handling each prior in the set individually. For each prior in your set, perform a standard Bayesian update using the observed data (e.g., conjugate priors for binomial/Poisson). The result is a *set* of posterior probabilities. Crucially, acknowledge and handle dilation: if new evidence is ambiguous or its interpretation depends heavily on the prior (common with sparse, noisy data or changing definitions), the *range* of your posterior set might *widen* compared to the prior set. This isn't a failure; it correctly reflects increased uncertainty after observing ambiguous data. For example, an observation equally plausible under very low *and* very high true probabilities will push posteriors apart. Document the update step, the likelihood used, and explicitly note if dilation occurred and why (e.g., "Event under old classification ambiguous; consistent with both high and low failure rates under different priors").

  When needing to make internal decisions *based* on the probability (e.g., resource allocation sensitivity analysis), use decision rules compatible with imprecise probabilities. The two most relevant are Maximality (choose option A over B if A is better than B under *every* probability in your set) or E-Admissibility (choose an option that is best under *at least one* probability in the set). The choice depends on conservatism: Maximality is more robust but might lead to indecision; E-Admissibility is more permissive. Document the rule chosen and why.

  Finally, collapsing to a single number for the regulator is unavoidable. Do this as late as possible. The least bad method is to report the probability value within your posterior set that incurs the *minimal maximum penalty* under the Brier score rule (the minimax solution). Often, this is the midpoint of your interval, but calculate it: find p_report that minimizes [max over q in set of (q - p_report)^2]. Crucially, **do not throw away the set.** Log the full posterior set (e.g., [0.0008, 0.006]), the rationale for its bounds, the data used (including its limitations), the update process (noting dilation if it occurred), the calculated p_report, and a clear statement of residual uncertainty (e.g., "Reported point estimate 0.0025 reflects minimax Brier penalty; true probability plausibly lies between 0.0008 and 0.006 based on model conflict and sparse data"). This log entry accompanies the single number handed to the regulator, providing essential context.

  **Concrete Case: Transformer Fault Cascade Probability**

  Event: Specific fault cascade in Class X transformers. Data: 9 observed cascades in 15 years. Exposure: Critical. Define denominator. Assume 1000 transformers of this class, so exposure = 1000 trans * 15 years = 15,000 transformer-years. Models: Model Alpha suggests underlying annual cascade rate ~0.0001 (1 in 10,000 transformer-years), Model Beta suggests ~0.001 (1 in 1,000 transformer-years). New sensors are being rolled out, improving detection but also redefining what constitutes a "cascade event" (e.g., capturing near-misses or reclassifying minor events).

  1.  **Prior Set:** Based on conflicting models and expert input acknowledging sensor limitations historically, define a prior annual rate set as a wide interval: λ ~ [0.0001, 0.001] cascades per transformer-year. Document: "Prior set [1e-4, 1e-3] captures order-of-magnitude disagreement between Model Alpha (low) and Model Beta (high), consistent with expert uncertainty on historical detection completeness."
  2.  **Updating with Data:** Model observed cascades (k=9) over exposure (T=15,000 ty) using Poisson likelihood. Update each prior in the set. Use Gamma conjugate priors. Shape parameter for Gamma prior can be set based on a notional "equivalent prior observations" for bounds (e.g., for lower bound λ_low=0.0001, use prior Gamma(α_low, β_low) such that mean = α/β = λ_low and variance reflects low confidence. Similarly for upper bound λ_high=0.001. For simplicity and maximum conservatism, use weak priors at the bounds (e.g., α_low = 1, β_low = 1/λ_low = 10,000; α_high = 1, β_high = 1/λ_high = 1,000). Posteriors: Gamma(α_low + k, β_low + T) = Gamma(1+9, 10000+15000) = Gamma(10, 25000) → Posterior mean λ_low_post = 10/25000 = 0.0004. Gamma(α_high + k, β_high + T) = Gamma(1+9, 1000+15000) = Gamma(10, 16000) → Posterior mean λ_high_post = 10/16000 = 0.000625. Posterior set estimate: [0.0004, 0.000625]. *But note the sensor change*.
  3.  **Handling Sensor Rollout & Dilation:** The new sensors change the event definition. Future data won't be directly comparable. This introduces ambiguity. Suppose, *after* your analysis period but *before* reporting, one new "event" occurs under the *new* sensor definition. Its relationship to the old definition is uncertain. Updating the posterior set with this *ambiguous* evidence causes dilation. Is this new event equivalent to the old 9? More severe? Less severe? Under the low prior, maybe it suggests the true rate was underestimated historically; under the high prior, maybe it suggests overestimation. The posterior set *widens*. Your new posterior set might become, say, [0.00035, 0.0007]. Document: "Addition of Event 10 under new sensor protocol ambiguous. Consistent with historical rate being underestimated (pushing posterior up under low prior) or overestimated (pushing posterior down under high prior). Posterior set dilated to [0.00035, 0.0007]."
  4.  **Collapsing & Reporting:** Posterior set is now [0.00035, 0.0007]. Find p_report minimising max Brier penalty over this set. The function max_{q in [a,b]} (q - p)^2 is minimised at p = (a+b)/2 = 0.000525. Report **0.000525** (or 5.25e-4) to regulator. **Log Thoroughly:** "Final posterior set: [3.5e-4, 7e-4]. Derived from prior set [1e-4, 1e-3] based on Model Alpha/Model Beta conflict. Updated with 9 cascades over 15,000 transformer-years (Poisson/Gamma). Dilation occurred due to ambiguous Event 10 under new sensor definition. Reported point estimate 5.25e-4 chosen as minimax Brier score solution within posterior set. Significant uncertainty remains, span 3.5e-4, driven by model conflict and data definition change."

  **Key Judgment Calls Dressed as Procedure:**

  1.  **Defining the Prior Set Bounds:** Choosing the interval [0.0001, 0.001] involved judgment. Why not [0.00008, 0.0012]? This depends on weighting the competing models and expert opinions. While structured elicitation helps, the final bounds are a judgment call on what constitutes "reasonable" disagreement. Document *who* made the judgment and the *specific inputs* (model outputs, expert quotes) used.
  2.  **Handling Ambiguous Evidence & Dilation:** The impact of the new sensor event (Event 10) on the bounds is inherently judgmental. How much should the lower bound decrease and the upper bound increase? The values [0.00035, 0.0007] are illustrative. In practice, you need a structured way (e.g., expert assessment: "Under the low prior model, this event suggests true rate could be as high as X; under high prior, as low as Y") to quantify the dilation, which is itself judgment-based. Document the rationale for the magnitude of the dilation.
  3.  **Choice of Collapsing Rule:** Using the minimax Brier score (midpoint) is a defensible choice, but it's not the only option (e.g., reporting the lower bound for conservatism, or the mean of the set if treating it as a uniform distribution). The choice involves judgment about risk aversion and regulator expectations. Document *why* the minimax Brier rule was chosen over alternatives for this specific report.

  The core is maintaining the set as long as possible, rigorously documenting its evolution (especially widening due to ambiguity), and being transparent about the judgments made at those critical inflection points when you finally condense it for the scorecard. The log is your audit trail against manufactured precision.
