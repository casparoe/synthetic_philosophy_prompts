  **HARBOR VIEW CONDOMINIUMS**  
  **OFFICE OF THE RECORDING SECRETARY**  
  October 26, 2023  

  **MEMORANDUM**  
  TO: Unit Owners of Record  
  FROM: Eleanor Vance, Recording Secretary  
  SUBJECT: Annual Meeting Packet (Voter Eligibility & Bylaw Amendment 7-C)  

  Enclosed please find materials for the November 15th Annual Meeting. Special attention is directed to **Proposed Bylaw Amendment 7-C**, establishing criteria for Qualified Electors. Recent administrative complexities (e.g., unresolved signature validation on the 1974 Plat Map, ambiguity regarding Owner #4B’s residency status since 2011, and the inclusion of non-standard stakeholders in July’s experimental vote) necessitate clarity. Per Board Motion 2023-08, voter eligibility must be formalized prior to any agenda item consideration. The packet includes a ballot for your immediate response.  

  ---  

  **AGENDA: ANNUAL MEETING - NOVEMBER 15, 2023**  
  1. Call to Order  
  2. Determination of Quorum (Pending Amendment 7-C Ratification)  
  3. Reading & Approval of September 17th Meeting Minutes  
  4. **Primary Business**: Ratification of Proposed Bylaw Amendment 7-C ("Qualified Elector Definition")  
  5. Secondary Business:  
     - Ratification of Voter Eligibility Committee Formation (2023)  
     - Drainage Project Vote (Requires Electors as Defined Under 7-C)  
  6. Adjournment  

  ---  

  **MINUTES: SPECIAL MEETING - SEPTEMBER 17, 2023**  
  ...  
  Item 4: *Motion to Clarify Renter Voting Rights (Submitted by Owner 3D)*  
  Discussion: Owner 4B (non-resident landlord) asserted entitlement to vote *on* renter voting rights. Owner 6F countered that renters’ interests in patio policy warranted their inclusion in *this specific vote*. Board Counsel noted procedural precedent requires voter status determination *before* motions are heard. Owner 2A moved to table the motion until voter status was resolved. Owner 5C moved to table *the tabling motion* until legal review.  
  **Vote Outcome**: Motion to table the tabling motion passed 7–6. The original motion remains tabled.  
  ...  

  ---  

  **PROPOSED BYLAW AMENDMENT 7-C**  
  *Qualified Elector Definition for Harbor View Condominiums*  

  **Section 1: Core Electorate**  
  1.1. Individuals listed as Title Holders on Deeds recorded with the County Registrar.  
  *Note: Deeds referencing the 1974 Plat Map require signature verification by the Original Developer or his lawful heirs (See Sec. 3.2).*  

  **Section 2: Secondary Eligible Parties**  
  2.1. Long-Term Lessees (6+ months continuous occupancy) *provided*:  
  a) Title Holder delegates voting rights via Board-approved Form D-7, *and*  
  b) Form D-7’s validity is certified per Sec. 4.  

  **Section 3: Verification of Founding Documents**  
  3.1. Signatures on the 1974 Plat Map shall be validated by:  
  a) A majority vote of the sitting Board, *or*  
  b) Affidavit from the Original Developer’s lawful heir(s).  
  3.2. The Board shall maintain a roster of recognized heirs. *(Current Heir Roster: 0 persons. Developer’s last known descendant, Mr. Arthur Sims, declined involvement in 1998.)*  

  **Section 4: Delegation Authority**  
  4.1. Form D-7 delegations are valid only after:  
  a) The Board establishes a Standing Delegation Review Subcommittee (SDRS), *and*  
  b) SDRS membership is ratified by Qualified Electors (as defined herein).  

  **Section 5: Minor Children**  
  5.1. Persons under 18 holding title via trust may vote if:  
  a) The trustee submits notarized Intent to Bequeath documentation, *and*  
  b) The notary’s commission is verified by the SDRS (See Sec. 4.1.a).  

  ---  

  **OFFICIAL BALLOT: RATIFICATION OF AMENDMENT 7-C**  
  *Return by November 8th to the Management Office*  

  [ ] YES – I support adopting Amendment 7-C as the sole criterion for Qualified Elector status.  
  [ ] NO – I do not support Amendment 7-C.  
  [ ] ABSTAIN  

  **INSTRUCTIONS**:  
  - Vote only if you qualify as a Qualified Elector under **current** bylaws (2018 Revision).  
  - *If voting "YES," you affirm you meet the criteria outlined in Amendment 7-C.*  
  - Ballots from unverified signatories to the 1974 Plat Map will be held provisionally.  

  ---  

  **SIDEBAR: COMMUNITY INPUT SUMMARY**  
  *Question: "Why not let everyone affected by a decision vote on it?"*  
  *Summary of "All-Affected Interests" Trial Vote (August 2023):*  

  Per Owner 3D’s suggestion, the Board invited stakeholders materially impacted by the "Retention Pond Heron Deterrence" proposal to vote. Eligible parties included:  
  1. All unit owners/residents  
  2. Town of Seabrook (downstream flood risk)  
  3. Ms. Rita Gable (potential buyer in 2061, per 2017 letter of interest)  
  4. "Heron Colony" (represented pro bono by Owner 7A’s child, per *Mass. Gen. Law Ch. 3A, § 11*)  
  5. HVAC Contractor (noise disturbance during installation)  

  **Result**: 213 votes received.  
  - Town of Seabrook submitted a 12,000-page ballot citing tidal charts.  
  - Ms. Gable declined participation, stating "I’ll be 109 in 2061."  
  - The Heron Colony vote was disqualified after debate on avian literacy standards.  
  - The HVAC Contractor voted "NO" on behalf of "all ductwork."  

  Meeting postponed pending "administrative feasibility review."  

  ---  

  **CLOSING MEMO NOTE**:  
  A Voter Eligibility Committee has been formed (Chair: Mr. Finch, Unit 1C). Committee authority is contingent on ratification at the Annual Meeting. Ratification requires a quorum of Qualified Electors as defined *either* under existing bylaws *or* Amendment 7-C, whichever is deemed operable per ongoing legal consultation.  

  Respectfully submitted,  
  Eleanor Vance  
  Recording Secretary  
  *"Striving for clarity since 1974 (signature pending verification)"*  

