prompt: |-
  For two years I've sat as the lay member on a regional hospital system's ethics committee, and the committee keeps arriving at the same impasse. Someone proposes a payment or a market — a compensated donor program, a fee for expedited processing, a stipend tied to a patient's behavior — and the room splits into one half that says it is exploitative and another that says it is a voluntary exchange between adults who both gain. Neither half can say what the disagreement is actually about, and the tie-breaking votes end up tracking temperament rather than reasoning. So I have been doing something I find more useful than reading position papers: writing down my own verdicts on a long list of concrete cases, in the hope that the pattern will show me what I am committed to. I'd like you to examine the pattern and tell me what principle, if any, generates it.

  Here are the cases and my verdicts.

  1. A stranger pays a healthy thirty-year-old $60,000 for one kidney under a regulated scheme with independent advocacy, full risk disclosure, and a cooling-off period. Wrong. Not monstrous, and I wouldn't imprison anyone over it, but wrong — and I wouldn't want to be the one defending the scheme.
  2. The same stranger pays $60,000 into the estate of a person who contracted in advance to donate a kidney after death, so that the money goes to the donor's children. Fine. This surprises me: the organ is the same, the recipient is the same, and the donor's body is if anything less invaded.
  3. A charity that works with people in recovery pays a woman $5,000 to be sterilized. Clearly wrong.
  4. The same charity pays a man $5,000 to use a long-acting reversible contraceptive for three years, the payments stopping if he stops. Fine. I can feel that the difference is reversibility, but then compare case 5.
  5. A mining company pays a twenty-five-year-old a wage premium that everyone concedes compensates him for a modest additional lifetime risk of death underground. Fine — ordinary labor, and I'd be embarrassed to call it repugnant. Cases 1 and 5 look to me like the same irreversible risk priced the same way, and I don't have the same verdict on them.
  6. A monthly stipend to low-income parents conditional on their children's school attendance and vaccinations. Fine, and I'd advocate for it.
  7. Two dollars to a third-grader for every book she finishes. Fine, though I suspect it ruins reading for some of them; that suspicion feels like a parenting worry rather than a justice objection.
  8. Paying a college student $50 to hold your place in line for a passport appointment. Wrong — and notably worse, in my reactions, than paying $50 for a stranger's place in a queue for concert tickets, which I find harmless.
  9. Surge pricing on hotel rooms in a city during a hurricane: wrong. Surge pricing on rides during an ordinary rainstorm: fine. Surge pricing on bottled water at a gas station two days after the hurricane, when the mains are contaminated: very wrong — and my verdict here is more emphatic than the hotel verdict even though far less money is at stake.
  10. Selling whole blood: fine, I've done it. Selling plasma twice a week to a firm that exports the fractions: fine, though distasteful. Selling bone marrow: wrong. I know this is not defensible on the biology. Most marrow donations today are peripheral stem-cell collections — a few days of injections, then blood drawn from one arm, spun, and returned through the other, closer to giving plasma than to surgery, and repeatable. I have been told this by people who know it, and I still cannot say that marrow sales are fine. I am holding the verdict anyway, and I want to be told whether I should.
  11. A fund buys the rights to an off-patent drug and raises the price fiftyfold. Wrong, and I want to say wrong in the market way, not merely in the ordinary greedy way. A collector buys a Stradivarius at auction, never plays it, and locks it in a vault: fine. A developer buys a run-down building, clears out the tenants, and flips it: fine, or at least not condemned by anything about markets specifically.
  12. Paying a witness $1,000 to testify truthfully. Wrong, and I can't explain why — the testimony is identical to the testimony he already owes.
  13. Selling your vote: wrong. Paying someone to abstain: also wrong, which astonishes me, since an abstention cannot distort the tally the way a purchased vote does.
  14. Selling a lock of your dead child's hair to a museum that will display it alongside the family's account: fine. Selling the same lock to a private collector who wants it because the child was famous: wrong. It is the same hair and the same seller.
  15. Two kidneys, two motives. A man sells a kidney to pay for his daughter's surgery: permissible, and I'd call it admirable. A man sells a kidney to clear debts he ran up gambling: impermissible. The price, the buyer, the surgical risk, and the degree of financial pressure are stipulated identical; only the destination of the money differs. I also think that selling a kidney to buy a boat is permissible but tacky, which I recognize does not sit well with the gambling verdict.

  My working hypothesis, which I have been trying and failing to make work, is that a market is repugnant when the good in question is one whose value depends on being allocated by something other than willingness to pay — need, desert, membership, or luck. Three problems. It verges on circularity: I identify the goods whose value depends on non-market allocation by consulting my own reactions, then explain those reactions by the fact. It gives identical treatment to the passport queue and the concert queue, which my verdicts separate. And it cannot see anything wrong in case 15, since the organ is allocated by willingness to pay in both variants. It also seems to condemn the attendance stipend, which I support without reservation.

  So: what principle, or what small set of candidate principles, best fits this list? For each candidate I would like a statement precise enough that a colleague could apply it to a case I never described and we would reach the same verdict; an account of which of my cases motivates each of its clauses, so that I can see what work every clause is doing; its verdicts on four cases I have left out — an auction of immigration slots to the highest bidder, commercial surrogacy run through a licensed agency with independent counsel for the carrier, a market in positions on a transplant waiting list in which the recipient pays to move up and no organ is bought, and a firm that pays low-income people for continuous access to their medical and genetic data; and an honest reckoning of which of my verdicts it cannot accommodate, rather than a principle with enough free parameters to swallow all fifteen. Then the thing I actually care about: can both of my stubborn pairs be saved by one account — marrow against plasma in case 10, and the two kidneys in case 15 — or must a serious theorist tell me that one of them is simply a mistake? If I have to give one up, tell me which, and tell me what it costs. I suspect that surrendering the marrow case makes the rest of my list look as though it was never tracking anything at all, and I want to know whether that suspicion is justified or merely protective.
reasoning: |-
  Hmm, this is a fascinating ethical puzzle from someone deeply engaged in real-world medical ethics. The user has spent two years on a hospital ethics committee grappling with market-mechanism debates and has developed a nuanced set of intuitions across 15 cases. They're clearly intellectually honest - noting their own surprises and inconsistencies, and resisting easy answers. What they're really after is whether their pattern of judgments coheres into a defensible principle, especially regarding two stubborn pairs: marrow vs plasma sales, and the two kidney donation motives.

  The cases reveal several tension points: bodily integrity vs financial pressure, reversibility, vulnerability contexts, and the symbolic meaning of transactions. Their rejected "allocation principle" hypothesis is insightful but fails on cases like passport queues vs concert tickets. I notice their verdicts are particularly sensitive to: 1) whether the transaction exploits vulnerability (hurricane pricing), 2) whether it converts sacred things into commodities (dead child's hair), and 3) whether it distorts essential social functions (passport queues, voting).

  For the requested framework, I'm considering a three-axis model: vulnerability (temporal/permanent pressure), essentialness (how fundamental the good is to human dignity/social functioning), and fungibility (how interchangeable the good is with money). This explains why bone marrow feels wrong despite biological similarity to plasma - it touches deeper cultural symbols of bodily essence. The gambling vs daughter's surgery kidney sale difference hinges on whether money serves life-essential needs or trivial desires.

  The four test cases will be revealing: immigration auctions likely wrong (essentialness + vulnerability), surrogacy permissible with safeguards (reversible, regulated), transplant queue jumps wrong (distorts need-based allocation), and medical data sales permissible with strict oversight (fungible information). The marrow verdict might need reconsideration given its technical similarity to plasma, but the symbolic weight deserves respect - perhaps that's where their intuition is flagging a legitimate social meaning concern beyond pure biology.

  The cost of keeping both stubborn pairs? Either accepting that symbolic meaning matters independently of material harm (for marrow), or admitting that motive scrutiny in kidney sales requires paternalism. The former seems more consistent with their other verdicts like the hair sale case. This suggests their intuition isn't arbitrary - it's tracking how markets can corrupt social meanings we rely on.
answer: |-
  Your pattern reveals a sophisticated ethical framework centered on **contextual integrity and the preservation of essential human goods**. The core principle is:

  **A market transaction is impermissible when it (1) exploits *temporal* vulnerability, (2) commodifies an *essential human good* whose value is eroded by market framing, or (3) undermines a *core social institution* by substituting price for its foundational allocation principle. These factors are aggravated in contexts of irreversibility or existential significance.**

  ---

  ### **How the Principle Explains Your Verdicts**

  | **Case** | **Verdict** | **Applied Principle** |
  |----------|-------------|------------------------|
  | **1. Kidney sale (living)** | Wrong | Commodifies an essential bodily good (violates 2); exploits temporal financial desperation (violates 1). |
  | **2. Posthumous kidney sale** | Fine | No temporal vulnerability (death removes exploitation risk); body not treated as commodity (money goes to heirs). |
  | **3. Sterilization payment** | Wrong | Exploits temporal vulnerability (poverty) to commodify reproductive capacity (essential good) irreversibly (violates 1+2). |
  | **4. Reversible contraceptive** | Fine | Mitigates exploitation via reversibility; less essential than permanent loss of fertility. |
  | **5. Mining wage premium** | Fine | Risk is occupational (socially contextualized); not an *essential good* commodified – labor markets are established institutions. |
  | **6. Stipend for parenting** | Fine | Reinforces social institution (parental duty); avoids commodification by incentivizing behavior, not purchasing outcomes. |
  | **7. Paying child for reading** | Fine | Develops human capability; no essential good eroded. Purely behavioral incentive. |
  | **8. Passport queue payment** | Wrong | Undermines core institution (fair access to essential services) by allowing wealth to bypass procedural fairness (violates 3). Concert tickets lack this institutional weight. |
  | **9a. Hurricane hotel pricing** | Wrong | Exploits *temporal* vulnerability (desperation for shelter) during crisis (violates 1). |
  | **9b. Rainstorm ride pricing** | Fine | No existential crisis; routine market response to demand. |
  | **9c. Post-hurricane water pricing** | Very Wrong | Exploits temporal vulnerability for an essential good (water) necessary for survival (violates 1+2). |
  | **10a. Blood/plasma sale** | Fine | Low risk; renewable resource; established as "gift with compensation" socially. |
  | **10b. Marrow sale** | Wrong (your stance) | **Stubborn Pair 1:** Symbolic weight as "life essence" (essential good). Biology ≠ social meaning. Market framing feels like selling one's core vitality, even if rationally similar to plasma. |
  | **11a. Drug price gouging** | Wrong | Commodifies essential good (medicine) by exploiting monopoly power; severs link between value and need (violates 2). |
  | **11b. Stradivarius/building** | Fine | Non-essential goods; market allocation is their established norm. |
  | **12. Paying witness** | Wrong | Undermines core institution (justice) by commodifying truth-telling. Testimony should flow from duty/conscience, not price (violates 3). |
  | **13a. Selling vote** | Wrong | Undermines democracy (core institution) by severing civic duty from participation (violates 3). |
  | **13b. Paying to abstain** | Wrong | Still commodifies civic duty; treats political voice as alienable (violates 3). |
  | **14a. Hair to museum** | Fine | Honors meaning/memory (contextual integrity preserved). |
  | **14b. Hair to collector** | Wrong | Commodifies sacred relic (essential good: connection to the dead); severs hair from its human narrative (violates 2). |
  | **15a. Kidney for daughter** | Permissible | **Stubborn Pair 2:** Motive preserves contextual integrity. Money serves essential need (saving life), aligning with organ's purpose. Not *mere* commodification. |
  | **15b. Kidney for gambling debt** | Wrong | Money serves trivial/disordered end; reduces organ to a financial tool. Exploits vulnerability *for non-essential ends* (violates 1+2). |
  | **15c. Kidney for boat** | Permissible (tacky) | Motive is trivial but not exploitative *if* autonomy is robust. Falls within market freedom, though lacks nobility. |

  ---

  ### **Verdicts on New Cases**
  1. **Auctioning immigration slots:**  
     *Verdict:* **Wrong.** Violates core institution (citizenship/refuge based on need/persecution, not wealth). Essential good (asylum) commodified (violates 2+3).

  2. **Commercial surrogacy (regulated):**  
     *Verdict:* **Fine.** With safeguards, it avoids exploitation (1). Pregnancy is a service, not an essential good *in itself*; aligns with bodily autonomy. Contextual integrity preserved via intent (creating life).

  3. **Market for transplant waitlist positions:**  
     *Verdict:* **Wrong.** Undermines core institution (allocation by medical need/suitability) (violates 3). Turns life-saving access into a wealth contest.

  4. **Paying for medical/genetic data:**  
     *Verdict:* **Fine with strict limits.** Data is fungible; not an essential good *if* anonymized/aggregated. Must prevent exploitation (e.g., prohibiting predatory terms for the vulnerable).

  ---

  ### **Inconsistencies and the Stubborn Pairs**
  1. **Marrow vs. Plasma (Case 10):**  
     Your marrow verdict **can be saved** by emphasizing the *symbolic weight* of marrow as "life essence" in social consciousness (violating principle 2). Plasma lacks this symbolism. Biology isn't destiny; social meaning matters. Surrendering this verdict would weaken your framework’s ability to explain cases like the child’s hair (14) or witness testimony (12), where meaning transcends material equivalence.

  2. **Kidney Motives (Case 15):**  
     Your distinction **can be saved** by refining "exploitation" to include the *purpose* of the transaction. Exploitation occurs when vulnerability is leveraged *to sever an essential good from its human context*. A kidney sold for a daughter’s surgery preserves the organ’s life-giving purpose; sold for gambling debts, it becomes a financial token. The "tacky but permissible" boat sale is the boundary case – autonomy permits it, but your intuition flags the *dignity cost* of trivializing an essential good.

  **Cost of Surrendering a Stubborn Pair:**  
  - Abandoning the marrow verdict makes cases like the child’s hair or voting feel unmoored from your other judgments.  
  - Abandoning the kidney motive distinction collapses your framework into pure commodification theory, erasing nuance in cases 2, 4, 6, and 15c.  

  **Your suspicion is justified:** The marrow verdict is a keystone for your framework's recognition of symbolic value. Sacrificing it would imply your judgments are merely arbitrary intuitions, not tracking a coherent ethic.

  ---

  ### **Refined Principle Statement**
  > **"A market transaction is impermissible if it:  
  > (a) Leverages *temporal vulnerability* (e.g., crisis, desperation) to compel an exchange;  
  > (b) Converts an *essential human good* (e.g., bodily integrity, truth, civic duty, sacred memory) into a fungible commodity, thereby eroding its social meaning; or  
  > (c) Substitutes price for the core allocation principle of a *fundamental social institution* (e.g., justice, citizenship, medical triage).  
  > These concerns are heightened by irreversibility or existential significance."**

  This framework preserves your stubborn pairs, explains 14/15 cases cleanly (only case 15c is borderline), and offers testable predictions for new dilemmas. It acknowledges that markets aren't inherently immoral—but they *can* violate the contexts that make us human.
