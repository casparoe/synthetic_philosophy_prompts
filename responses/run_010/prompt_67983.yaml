prompt: |-
  I write a science-and-ideas column and I've spent the last few weeks sitting with Henry Sidgwick's psychical research, which is a strange thing to sit with: the man who wrote The Methods of Ethics was also the first president of the Society for Psychical Research, and the society's big census asked some 17,000 people whether they'd ever had an apparition-like experience. Its made me want to pin down what I actually think about evidence like that, going by my own verdicts rather than by my general attitude about spooks. So here they are:

  - A woman sees her brother standing at the foot of her bed, soaked and miserable; next morning she learns he drowned that night a hundred miles away. One such case: nothing to me. Two dozen of them, collected independantly and screened for the obvious routes: now I lean toward something being there.
  - A medium produces details about a dead relative nobody in the room could have known, and afterwards we find she went to school with the sitter's sister. Dismissed, no residue.
  - Same seance, same kind of detail, but no information route can be found at all. Barely moves me — and I can't say why, because that's just the case above minus the debunk.
  - A lab publishes a card-guessing result at better than one in a million, protocol posted in advance. I assume there's a flaw I can't see, and I'd take that bet against almost anybody.
  - A huge physics collaboration reports neutrinos outrunning light at comparable significance. I assume a flaw there too — and was right, it turned out to be a loose cable.
  - Two teams report in 1998 that distant supernovae imply the expansion of the universe is speeding up. Massively unwelcome, nothing in the received picture wanted it to be true — and I basically just accept it. That's the pair I can't reconcile with the two above. Same statistical heft, same "this would rewrite everything," completely opposite verdicts from me.
  - My most sceptical friend swears she knew her father had died before the phone rang. I go back and forth on this one constantly.

  Is there a principle behind these — precise enough that I could hand it to a fact-checker and she could apply it without me in the room? Tell me what each clause is doing and which case forced it in, which of my verdicts it has to overrule, and what it delivers on the two I left open: a well-designed psi study nobody can replicate (does my confidence in the original drop, and how far?), and whether Sidgwick's own census result should have moved him more than it apparently did. And be blunt about whether the 1998-versus-psi difference is a real asymmetry in the evidence or just my prejudices wearing a lab coat.
reasoning: |-
  Okay, let me start by really understanding what the user is asking. They're a science columnist who's been diving into Henry Sidgwick's psychical research. They've listed several scenarios where they've had different reactions to evidence of paranormal events versus scientific anomalies. Their main goal is to find a consistent principle to evaluate such evidence, one that a fact-checker could apply without them. 

  First, I need to parse each of their examples. The apparition cases with multiple independent reports make them lean towards something real. But a medium's accurate details get dismissed if there's a possible information leak, and even without a leak, they're still unmoved. The card-guessing and neutrino results are dismissed due to assumed flaws, but the supernova findings are accepted despite being unexpected. Their friend's premonition leaves them uncertain. 

  The user wants a principle that explains all these reactions. They also want to know if their acceptance of the supernova findings over psi studies is based on evidence or bias. Plus, they have two open cases: unreplicable psi studies and Sidgwick's census.

  Looking deeper, the user might be grappling with the legitimacy of psychical research versus mainstream science. Sidgwick's involvement adds credibility, but the lack of progress in parapsychology contrasts with cosmology's advancements. The user could be seeking validation that their skepticism isn't just bias but grounded in rational criteria. They might also want to address whether anecdotes can ever be scientific evidence.

  Key elements from their examples: multiple independent sources, prior probability, mechanisms, and resistance to debunking. The supernova case benefited from independent teams and a theoretical framework, whereas psi lacks mechanisms and consistent replication. 

  For the principle, it should include criteria like independence, methodological rigor, theoretical plausibility, and replicability. Explaining why the supernova findings were accepted: independent teams, no methodological flaws found, and eventual theoretical integration. In contrast, psi studies suffer from replication issues and no mechanistic explanation.

  Addressing the open cases: Unreplicable psi studies should lower confidence significantly due to lack of corroboration. Sidgwick's census, while numerous, lacked controls for confounds and independent verification, so skepticism is warranted. 

  The 1998 vs. psi difference isn't just bias; it's the asymmetry in evidence quality and the field's capacity for self-correction. Cosmology integrates new findings, while psi remains stagnant, highlighting a real evidential asymmetry.

  Need to ensure the principle is clear and actionable for a fact-checker, with clauses tied to specific examples. Also, be blunt about prejudices versus evidence, confirming that their reactions are largely justified by the criteria proposed.
answer: |-
  Here's a principle distilled from your verdicts, designed to be operational for a fact-checker. It prioritizes *how* evidence withstands scrutiny rather than just its statistical weight or strangeness:

  **The Principle of Resilient Convergence (PRC):**

  > Extraordinary evidence requires convergence across **independent lines of inquiry** that demonstrate **resilience to plausible debunking pathways** and **integration potential** within a **self-correcting explanatory framework**. Confidence scales with the **demonstrated difficulty** of dismissing the convergence via mundane means.

  **Breakdown of Clauses & Application to Your Cases:**

  1.  **"Extraordinary evidence requires convergence across independent lines of inquiry":**
      *   **What it does:** Demands multiple, distinct sources/methods pointing to the same conclusion, reducing the chance of coincidental error, fraud, or systematic bias in one line.
      *   **Forced in by:** Apparitions (Two dozen screened cases), Supernovae (Two independent teams). Rejects single anecdotes (Your friend's single experience, one apparition case).
      *   **Overrules:** Dismisses "Same seance, no info route found" (single line, no convergence). Explains why "Two dozen apparitions" moves you while "one such case" does nothing.

  2.  **"...that demonstrate resilience to plausible debunking pathways":**
      *   **What it does:** Requires proactive investigation and elimination of the most likely alternative explanations (error, fraud, coincidence, sensory/memory glitches, information leakage) *before* assigning weight. The evidence must survive rigorous attempts to *make it go away*.
      *   **Forced in by:** Medium debunked (info route found), Neutrinos (flaw found), Card-guessing (assumed flaw exists). Explains dismissal of the debunked seance.
      *   **Overrules:** Challenges the "Same seance, no info route found" verdict. PRC says this *should* move you *more* than the debunked case, but resilience needs *demonstration*, not just absence of one debunk. It wasn't resilient *enough* for you because the *potential* pathways (fraud, coincidence, cold reading subtleties, unconscious cues) weren't sufficiently closed off by a single negative result on one pathway (info route). "No info route *found*" is weak resilience; "demonstrated resilience" requires actively testing/falsifying multiple pathways.
      *   **Applies to:** Supernovae - resilience was *demonstrated* by peer review hunting for flaws (like in neutrinos), finding none initially, and the result holding up. Card-guessing - resilience *wasn't* demonstrated (protocol posted helps, but doesn't eliminate all pathways like subtle sensory leakage or fraud).

  3.  **"...and integration potential within a self-correcting explanatory framework":**
      *   **What it does:** Assesses whether the finding *could* fit into an existing body of reliable knowledge that has mechanisms for error-correction and theory-building, or if it requires scrapping fundamental, well-established principles with no plausible replacement. This incorporates prior probability dynamically.
      *   **Forced in by:** The core asymmetry between Supernovae and Psi/Card-guessing/Neutrinos (initially).
          *   Supernovae: Unwelcome, but existed within cosmology's self-correcting framework (GR, particle physics, instrumentation). Finding a flaw (e.g., dust extinction models) or integrating it (Dark Energy) was conceivable *within the framework*. The framework *could* adapt.
          *   Psi/FTL Neutrinos: Required overthrowing fundamental, interlocking principles (causality, locality, thermodynamics, neuroscience) with no viable alternative framework. The existing frameworks (physics, neuroscience) offer no plausible integration pathway, only rupture.
      *   **Overrules:** This is the key clause explaining your different verdicts on Supernovae vs. Card-guessing/Neutrinos despite similar stats. The neutrino flaw was found *because* the framework offered specific places to look (instrumentation error). Psi lacks such a framework for targeted error-correction.
      *   **Applies to:** Sidgwick's Census - Low integration potential. No framework existed (or exists) to explain how personal apparitions convey real-time information across distance, conflicting with neuroscience and physics. It remained an isolated anomaly.

  4.  **"Confidence scales with the demonstrated difficulty of dismissing the convergence via mundane means":**
      *   **What it does:** Quantifies the burden. How hard have researchers *actually worked* to find normal explanations, and how thoroughly have they failed? It's not enough to *say* it's resilient; the difficulty of debunking must be *proven* through rigorous, pre-registered, adversarial testing.
      *   **Forced in by:** Apparitions (Screening for obvious routes implies some demonstrated difficulty). Card-guessing (Lack of demonstrated difficulty in *replication* or flaw-finding undermines confidence despite stats).
      *   **Applies to:** Your friend's experience - Low demonstrated difficulty dismissing it (coincidence, subconscious cue misinterpreted, memory distortion). Supernovae - Extremely high demonstrated difficulty in dismissing via mundane means (years of checking).

  **Applying PRC to Your Open Cases & Sidgwick:**

  1.  **Well-designed Psi study, nobody can replicate:**
      *   **PRC Verdict:** Confidence in the original *plummets drastically*.
      *   **Why:** It fails "convergence across independent lines" spectacularly. Replication is the ultimate test of resilience and independence. Failure to replicate demonstrates that the original result *was* likely susceptible to mundane debunking pathways (undetected flaw, subtle bias, statistical fluke, fraud) that the original protocol, however well-designed, failed to catch. It reveals a lack of *demonstrated difficulty* in dismissing the finding. Integration potential remains near zero.

  2.  **Sidgwick's Census:**
      *   **PRC Verdict:** It *should not* have moved him significantly more than it apparently did (assuming he remained skeptical).
      *   **Why:**
          *   **Convergence:** Large number, but were they *independent* lines of inquiry? Mostly a single methodology (self-report survey) applied en masse. Vulnerable to shared cultural motifs, suggestibility, memory errors. Not distinct methods (e.g., combining surveys with contemporaneous physical trace analysis).
          *   **Resilience Demonstrated?** Screening was rudimentary by modern standards (no controls for confabulation, confirmation bias in data collection, waking vs. dreaming states, corroboration standards). The *difficulty* of dismissing via mundane means (coincidence, dream confusion, grief hallucination) was not rigorously *demonstrated*, merely assumed by volume.
          *   **Integration Potential:** Nil then, nil now. No mechanism, conflicting with core principles.
          *   **Demonstrated Difficulty:** Low. No sustained, adversarial attempt to debunk *specific* cases using all available records, psychological assessment, etc., was part of the census itself. It was descriptive, not robustly falsificationist.

  **The 1998 vs. Psi Asymmetry: Real or Prejudice?**

  *   **PRC Says: Real Asymmetry.** This is the core of clause 3.
      *   The supernova results, while shocking, landed within a **self-correcting framework** (cosmology/physics) with powerful tools for investigation, error-detection (like finding the neutrino cable flaw), and *potential pathways for integration* (new energy component, modifications to gravity - even if radical, they fit *within* the mathematical and conceptual language of the field).
      *   Psi results, by their nature (mind influencing matter at a distance, perceiving distant events without energy transfer, surviving death), demand the **scrapping of fundamental, interlocking principles** (causality, thermodynamics, the dependence of mind on brain) **without offering a viable, predictive, alternative framework** that explains *both* the anomaly *and* the existing successful body of knowledge. There is no "Psi Physics" that makes novel, testable predictions across domains. The frameworks they rupture (physics, neuroscience) have immense, independently verified explanatory and predictive power.
  *   **Therefore:** Your different verdicts aren't *just* prejudice ("spooks" vs. "science"). They reflect a rational assessment based on the **integration potential** and the existence (or not) of a **self-correcting framework** capable of productively absorbing the anomaly. The neutrino result was shocking *within* its framework; a positive psi result is shocking *to the framework itself*. PRC justifies treating these asymmetrically. The lab coat, in this case, fits the evidence structure.

  **In essence:** PRC shifts focus from the raw strangeness or statistical p-value to the *process* by which evidence resists being explained away normally and its *capacity to be productively incorporated* into reliable knowledge. It explains your pattern and provides a checklist for the fact-checker: **Independent Convergence? Demonstrated Resilience? Integration Potential? Proven Difficulty of Debunking?**
