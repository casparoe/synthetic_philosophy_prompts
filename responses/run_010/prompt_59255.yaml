answer: |-
  ## Brainstorm
  - **Sensory Anchors:** Drizzle on stone, wet wool, coin-thuds like axe chops in wood. Cold breath visible only *after* the Rule fails.
  - **Half-Ideas as Pressure:** Not creatures, but *physical sensations* in the hall: sudden localized heat drafts near the shelf, brief ringing in ears, the air seeming to *thicken* where an idea presses.
  - **Rival Slips Manifest:**
      - *Tallest → Shortest:* A cold spot forming above the lonely single coin stack.
      - *Put → Take:* A metallic taste in mouths, like sucking a coin, when this idea surges.
      - *Ceiling Wrap:* A dizzying sense of the rafters *stretching* upwards momentarily.
  - **The Heat:** Starts with Rule-failure; not just warmth but *suffocating* closeness, wool itching, sweat beading despite the chill. Air feels thick, hard to breathe. Noise is chaotic murmurs shifting to anxious silence then back.
  - **Cooling Arc:** As one slip gains traction, physical sensations coalesce: the cold spot intensifies, the ringing fades, the oppressive heat recedes *from that spot*, breath-clouds form steadily again. Noise dies to absolute quiet.
  - **Why Shortest Wins:** "Put" remains sacred. Taking feels like sacrilege (metallic taste rejected). Wrap-around breaks the fundamental solidity of "three" (dizziness rejected). Shortest honors the *intent* of balancing implied by the Rule’s history.
  - **Earned Win:** Show the metallic taste making people recoil, the dizziness causing heads to shake. Show eyes drawn back, inevitably, to the solitary coin on the small stack. Show the *relief* of keeping "put".

  ---

  The Hall of Shelves smelled of wet stone and damp wool. Rain whispered against the high, narrow windows. Every breath hung visible for a moment in the chill air before the Rite began. Tonight, as always, the townsfolk packed the stone chamber, shoulders rubbing, the scent of their collective warmth and damp clothes rising. Young Keeper Elara stood before the Offering Shelf, her palms slick. The three stacks waited under the beam marking the Ceiling: three coins, one coin, two coins. Solid. Unchanging. The world.

  Elara’s voice, clear but tight, cut the expectant hush. “The Rule: Put a coin on the tallest stack.”

  She reached for the Offering Bowl, her fingers closing around a cold, heavy coin. She lifted it. All eyes followed its dull gleam. She moved it towards the stack of three.

  And stopped.

  The tallest stack. Already three. The Ceiling. No room.

  A coin clattered back into the bowl, loud as a shout in the stillness. Elara froze. The Rule had no purchase. The tallest *could not* take another coin.

  Silence. Absolute. Then, like a bellows opening, the air in the hall grew thick and hot. Wool prickled against necks. Breath caught. Where moments before there had been orderly quiet, a low, formless murmur rose – not voices, but the sound of fifty minds scrabbling against the unthinkable vacuum. Elara felt a sudden, intense heat bloom near her left ear, as if standing too close to a forge. A metallic tang, sharp and alien, coated her tongue, making her grimace. Near the lonely single-coin stack, the air turned unnervingly cold, a pocket of winter in the stifling hall. For a dizzying instant, the rafters high above seemed to stretch, to thin, promising impossible space above the three-stack.

  *Put on the tallest.* But the tallest was blocked. The Rule was broken. The world cracked.

  The heat near Elara’s ear intensified, pressing like a physical weight. The metallic taste surged again. *Take a coin off.* The thought wasn’t hers; it flooded the stifling air, a horrifying inversion. Off the tallest? Off a stack? That wasn’t *putting*. It felt like sacrilege, like tearing cloth. A collective recoil shivered through the hall; the metallic tang soured, became repellent. The heat flickered, weakened.

  Then, the dizziness. The sense of the rafters stretching, warping, letting the three-stack somehow *become* one again if you just… imagined it bending the count. *Put it on the tallest, it wraps, becomes one…* But three was solid. Three was the rafters, the Ceiling, the top of the world. To warp it felt like falling. Heads shook unconsciously. The stretching sensation faded, leaving only vertigo and a deeper confusion.

  Elara’s gaze, pulled like iron to a lodestone, fell away from the impossible three-stack, away from the dizzying rafters. It dropped down, down to the small stack. The single coin. A lonely disc on the worn wood. The cold spot above it intensified, a focused chill in the swelter. It wasn’t *tallest*. It was… the opposite.

  The murmuring faltered. Eyes followed Elara’s. The oppressive heat that had filled the hall like soup began to shift. It didn’t vanish; it *moved*. It flowed away from the Keeper, away from the chaotic center, drawn towards that cold spot above the single coin. The suffocating pressure eased fractionally. Breath came a little easier, though the air remained thick with tension. The metallic taste was gone. The dizziness was gone. Only the cold spot remained, sharpening, clarifying.

  Elara looked at the coin in her hand. She felt the cold air above the single stack. *Tallest blocked…* The thought trailed. The cold spot seemed to hum with potential. *…so the other way?* Not tallest. Smallest? It wasn’t the Rule. But the Rule had nowhere else to go. The cold felt clean, simple. Honest. It required no breaking, no bending, no taking. Only putting. The heat continued to bleed out of the hall, drawn into the focus above that small stack. The murmurs died to utter silence. The chill of the stone walls seeped back in, the normal cold of the valley night. Breath-clouds formed steadily again in the quiet air.

  Elara stepped forward. The scrape of her boot was the only sound. She reached out, not towards the towering three, not towards the middling two, but towards the solitary coin. The cold spot welcomed her hand. She placed the new coin gently, precisely, on top of the single one. *Thud-click.* The sound was familiar, grounding. A stack of two coins now stood beside the three and the two.

  Silence held for three heartbeats. Then, a single, deep, collective exhale. The Rite was done. The Rule had held, though its shape had shifted in their understanding like ice reforming over a stream. The hall was simply cold again. Certain. The impossible had been navigated. Elara lowered her hands. The townsfolk turned, shuffling out into the drizzle, the scent of wet wool mingling with the lingering chill of a concept reborn.

  Slip: tallest -> shortest
