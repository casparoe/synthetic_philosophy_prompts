prompt: |-
  I direct the standards and appeals function of a housing regulator in a mid-sized jurisdiction. We administer a statutory test under which an inspector must declare a dwelling "unfit for human habitation" where listed defects — damp and mould, structural movement, cold, electrical condition, crowding — are present to a degree the statute describes only as serious, or as posing an unacceptable risk to the health of the occupants. The statute supplies no numeric thresholds and expressly commits the determination to the judgment of the officer. In practice our inspectors must decide whether a crack, a humidity reading, a surface temperature, or a room area falls on one side or the other of a standard that has no visible side.

  We issue roughly 240 determinations a month across eleven field offices. Both outcomes are expensive. A finding of unfitness produces an enforcement notice against an owner who may be required to spend more than the property is worth, and about one determination in six is contested on appeal. A finding of fitness leaves a household — frequently with children, frequently with someone who is ill — in a home the inspector privately believes is harming them. The officers are building surveyors and environmental health practitioners; none has legal or philosophical training. A determination gets a forty-minute site visit or a twenty-minute desk review. A finding of unfitness requires a second signature from a duty officer who did not attend. The written reasons are the only thing the appeal tribunal ever sees, and we have lost two recent appeals because the tribunal held our reasoning to be unreasoned: it found that we had been applying an unwritten numeric practice that we could neither articulate nor defend.

  Auditing those cases has shown me that my inspectors are not disagreeing about the evidence. They are disagreeing about what sort of question they have been asked, and the disagreement tracks a philosophical divide almost point for point. One group behaves as though every case has a determinate answer — as though there is a precise place in the ordering of dwellings at which the predicate becomes true, which we cannot locate but which better measurement, better argument, or a more experienced colleague might bring us closer to. They refuse to publish thresholds on the ground that any line we announce is probably false; they treat the reversal of an earlier decision as the correction of an error; and they write reasons that sound like findings of fact. The other group behaves as though the statute simply leaves borderline cases undetermined, so that our task in those cases is to choose a sharpening of the standard and hold to it. They want numeric criteria published and applied prospectively; they treat the reversal of an earlier decision as a change of rule rather than a correction; and they write reasons that sound like the application of an adopted policy. Both insist they are applying the same statute. The two practices generate incompatible habits on precedent inside the organisation, incompatible reasons-language, and incompatible conduct at appeal, and neither side can say why the other is mistaken.

  I do not want a comparative essay on vagueness, and I do not want a recommendation about which metaphysics is true. I want a single determination protocol that this organisation can adopt, that an officer with no philosophical training can run in the time available, and that is built on an explicit account of what actually follows from each of the two positions — epistemicism, roughly in Williamson's sense, and supervaluationism, roughly in Fine's — about how a decision-maker in our position must behave. Where the protocol takes a side, I want it to say so. The deliverables are these:

  1. The ordered procedure itself: the questions the officer asks in sequence, what counts as a sufficient answer to each, at which questions the procedure terminates in a finding of fitness, at which it terminates in a finding of unfitness, and at which it stops and hands the matter to the duty officer or to me because the remaining question is not a question of fact. Include a stop rule for evidence-gathering: at what point further measurement cannot improve the determination even in principle.

  2. For each stage, mark its metaphysical status: truth-tracking, stipulative, or neutral. Where a stage would produce different conduct under the opposite view, say so plainly, say which view you have written into the protocol, and say whether the protocol would still function if the organisation formally adopted the other one.

  3. A rule for distinguishing two things my officers currently conflate: indeterminacy in the standard and imprecision in the measurement. These come apart, and they also coincide, and the coincidence is the normal case rather than the exception. Tell me what to do in each of the three configurations.

  4. A decision on thresholds. Should we publish numeric criteria? Answer separately under each view — what a published number is on each account, a claim about where the boundary lies or an announced precisification — and what obligations attach in each case regarding prospective application, review cycles, and cases decided under a superseded version. Then commit to one practice and justify it.

  5. The reasons templates. Give me a model paragraph for a borderline determination written as an accuracy claim, and one written as the application of an adopted sharpening; specify when each is to be used; and give me a drafting rule for reasons that will survive review under either conception, since we do not know how the tribunal conceives its own task and we cannot ask it.

  6. A treatment of comparative constraints. If dwelling A has been found unfit and dwelling B is worse in the relevant respect, must B be unfit? Address the obvious complication that worse is itself vague, so that the constraint only bites where the comparison is definite, and specify how an officer is to establish that a comparison is definite rather than borderline without appealing to the very threshold the comparison was meant to avoid.

  7. A treatment of the zone around any line. If the epistemicist's own argument — that knowledge requires a safety margin, so that no one can know of a case adjacent to the boundary which side it falls on — is sound, then there should be a band in which determination is impossible for us even though there is a fact. Say whether the protocol should posit such a band, what happens inside it, what default applies when a case cannot be moved out of it, and whether that default is a discovery about the standard or a choice we make. Then show me that your protocol does not simply relocate the sorites to the question of whether a given case lies inside the band.

  8. Three worked determinations, run through the protocol stage by stage with the reasons drafted in full:
     (a) A first-floor flat with persistent condensation and patchy mould in two bedrooms; the occupant is an adult with asthma; the readings sit in a band our instruments resolve cleanly and our standard does not; remediation is moderately priced.
     (b) Two adjacent houses of identical construction, orientation and measured defect, one occupied by a household including an immunosuppressed adult and one by a household in ordinary health. Whether occupant vulnerability enters the finding of unfitness, or only the specification of the remedy, is contested internally, and the answer will decide whether these two cases may lawfully be treated differently.
     (c) A dwelling whose readings fall clearly below our published criterion, in which a child's respiratory illness is nonetheless documented and the inspecting officer believes the finding of fitness is wrong. This is the case in which the protocol must give me the answer I do not want; I would rather see it do so explicitly than discover the evasion later.

  For each of the three, state whether the protocol settles the matter or leaves it to a person, and identify the officer or body to whom it hands the residue. For at least one of the three, tell me whether two honest officers of the two persuasions would still diverge under the protocol, and whether that means the protocol has failed or that it has succeeded in isolating a disagreement that no procedure can dissolve.

  9. The limits. State what this protocol cannot do. Name the steps that are judgment calls dressed in procedural clothing, and say which of them could be removed at the cost of what. Predict the direction of systematic error — whether the protocol will under-declare unfitness, over-declare it, or migrate borderline cases into whichever category is administratively cheaper for us — and tell me what to monitor over the first twelve months to detect that drift before an appeal tribunal detects it for me.

  No references, reading list, or citations are needed and none should be supplied; where you rely on a philosopher's argument, give the argument rather than the source.
reasoning: |-
  We are designing a determination protocol for housing inspectors to decide if a dwelling is "unfit for human habitation" based on statutory defects (damp/mould, structural movement, cold, electrical condition, crowding) that are "serious" or pose "an unacceptable risk to health". The statute leaves the determination to the officer's judgment without numeric thresholds. The protocol must bridge the philosophical divide between epistemicism (there is a sharp boundary we may not know) and supervaluationism (the boundary is indeterminate until we precisify). The goal is a practical procedure that produces consistent, defensible decisions within time constraints.

  The protocol will have the following features:
  1. Explicitly acknowledge that the standard is vague and that borderline cases require a decision procedure that respects both truth-tracking and stipulative elements.
  2. Use a two-stage process: first, a fact-finding stage (truth-tracking) to establish the measurable evidence; second, a decision stage that, for borderline cases, applies a stipulated precisification.
  3. For each defect, we will define:
     - A "clearly safe" zone (where the dwelling is clearly fit)
     - A "clearly unsafe" zone (where the dwelling is clearly unfit)
     - A "borderline" zone (where the evidence is inconclusive by measurement and the standard is indeterminate)

  The protocol will be structured as follows:

  **Stage 1: Evidence Collection and Classification (Truth-Tracking)**
  - Collect all relevant data for each defect (e.g., crack width, humidity, temperature, room dimensions, occupant health conditions if relevant).
  - For each defect, classify the evidence into one of three categories:
     (a) Clearly Safe: The measurements are below the lower bound of the borderline zone (if established) or clearly not serious and not posing an unacceptable risk.
     (b) Clearly Unsafe: The measurements are above the upper bound of the borderline zone (if established) or clearly serious and posing an unacceptable risk.
     (c) Borderline: The measurements fall within a predefined "borderline range" (to be established by the organization) OR the officer cannot classify as clearly safe or unsafe because of conflicting evidence or vagueness.

  **Stop Rule for Evidence-Gathering**: Once the measurements are taken with standard instruments and the data is recorded, further measurement is not required because the borderline range is defined such that within it, more precise measurement cannot resolve the vagueness of the standard. The stop rule is: when the measurement falls into the clearly safe, clearly unsafe, or borderline zone as defined by the organization's published criteria (which are set to cover the range of vagueness).

  **Stage 2: Decision Procedure (Stipulative for Borderline Cases)**
  - If all defects are in the "clearly safe" category: the dwelling is fit.
  - If any defect is in the "clearly unsafe" category: the dwelling is unfit (subject to duty officer confirmation).
  - If at least one defect is in the "borderline" category and none are "clearly unsafe", then the decision is made by applying a stipulated rule for that borderline defect. The rule will be a published threshold (a precisification) set by the organization.

  The duty officer (who did not attend the inspection) will review the evidence and the application of the thresholds for borderline cases. They will sign off on the determination if the procedure was followed.

  **Metaphysical Status of Stages**:
  - Stage 1 (Evidence Collection and Classification): Truth-tracking. The measurements are objective facts. The classification into zones (if the zones are set) is also truth-tracking if the boundaries of the zones are set to capture the clear cases. However, the setting of the borderline range is stipulative.
  - Stage 2 (Decision Procedure): For clear cases, it is truth-tracking. For borderline cases, the application of the published threshold is stipulative.

  **Addressing the Deliverables**:

  1. **Protocol Steps**:
     - Step 1: Gather evidence for each defect (measurements, observations, occupant health conditions if relevant to risk).
     - Step 2: For each defect, compare the evidence to the published criteria (which define the borderline range). 
          - If the measurement is below the lower bound of the borderline range: classify as clearly safe.
          - If the measurement is above the upper bound of the borderline range: classify as clearly unsafe.
          - If it falls within the borderline range: classify as borderline.
     - Step 3: If any defect is clearly unsafe, the dwelling is unfit (go to Step 5). If all defects are clearly safe, the dwelling is fit (go to Step 5). If at least one defect is borderline and none are clearly unsafe, go to Step 4.
     - Step 4: Apply the published threshold (the precisification) for each borderline defect. If the measurement is above the threshold, the defect is deemed to make the dwelling unfit; if below, it is safe. If any one defect is deemed unfit by the threshold, the dwelling is unfit. Otherwise, it is fit.
     - Step 5: For a finding of unfitness, the duty officer reviews the evidence and the application of the protocol. If the duty officer agrees, the determination is issued. For a finding of fitness, no second signature is required (unless the organization decides otherwise, but the problem states that only unfitness requires a second signature).

     Termination:
     - Fitness: when all defects are clearly safe OR when borderline defects are below the published threshold (and no clearly unsafe).
     - Unfitness: when any defect is clearly unsafe OR when a borderline defect is above the published threshold (and no defect is clearly safe that would override? but note: one unsafe defect suffices).
     - Handover to duty officer: only for unfitness findings (to review the entire process) and also if at Step 3 there is a borderline case but the published threshold does not cover the situation (this should be rare if the criteria are well set). If the duty officer finds an issue, they can escalate to the director (you).

  2. **Metaphysical Status**:
     - Step 1: Truth-tracking (collecting evidence). 
     - Step 2: The classification into zones is based on published criteria. The criteria setting (the boundaries) are stipulative, but the act of comparing measurements to these boundaries is truth-tracking (if we have set the boundaries, then the classification is a fact about whether the measurement falls in the defined range).
     - Step 3: Truth-tracking for clear cases. For borderline cases, we move to Step 4 which is stipulative.
     - Step 4: Stipulative (applying the precisification).

     Under epistemicism: The published threshold is an attempt to track the true boundary (which exists) but we admit we might be wrong. However, we must draw a line for practicality. The protocol would still function if the organization adopted supervaluationism because the stipulation is necessary for decision-making in borderline cases.

  3. **Indeterminacy vs. Imprecision**:
     - Imprecision in measurement: the uncertainty in the value due to the instrument (e.g., the humidity meter has ±5% error).
     - Indeterminacy in the standard: the vagueness of the statutory terms (e.g., "serious" damp) meaning there is no fact of the matter in borderline cases.

     Three configurations:
     a) **Indeterminate standard and precise measurement**: The measurement is exact (say 50% humidity) but the standard does not say if 50% is serious. We treat this as borderline and apply the published threshold.
     b) **Precise standard and imprecise measurement**: This should not occur because the standard is vague by statute. But if we had a precise standard (e.g., 60% humidity is the line) and the measurement is 58%±3%, then the true value might be above or below 60%. We would then have to consider the measurement uncertainty. We would classify as:
          - Safe if the entire measurement range (55% to 61%) is below 60%? But note: our standard is not precise. So in our case, we avoid this by defining the borderline range to account for both vagueness and typical measurement error. The borderline range should be set wide enough to cover the zone of vagueness plus measurement uncertainty.

     In practice, we combine both. We set a borderline range that is the union of the zone of vagueness and the zone of measurement imprecision. For a given defect, we define:
          - Clearly safe: below (lower bound of borderline range)
          - Clearly unsafe: above (upper bound of borderline range)
          - Borderline: in between.

     How to handle:
     - If the measurement is precise and the standard is indeterminate in that range: borderline.
     - If the measurement is imprecise and the true value might be in the borderline range: then we classify as borderline even if the measured value is outside, if the confidence interval overlaps the borderline range? But to keep it simple, we set the borderline range to be the interval [L, U] such that any measurement below L is clearly safe, above U clearly unsafe, and in between borderline. We set L and U to account for both the vagueness of the standard and the typical measurement error. For example, if the measurement error is ±e, then we set L = L0 + e and U = U0 - e, where [L0, U0] is the zone of vagueness? Actually, we set the borderline range to be the interval where the standard is vague and also where the measurement is not precise enough to rule out that the true value is in the vague zone.

     However, for simplicity, we will define the borderline range as a fixed interval for each defect, set by the organization, that is wide enough to cover the expected vagueness and measurement error.

     In the protocol:
     - If the measurement (with its uncertainty) falls entirely below the borderline range: clearly safe.
     - If it falls entirely above: clearly unsafe.
     - If it overlaps the borderline range (or falls within it): borderline.

     But to avoid complexity, we will just use the point measurement and the defined ranges. We assume that the measurement error is small enough that the defined borderline range already subsumes it. Therefore, we only need the point measurement.

     For each configuration:
     - If the standard is indeterminate at the measured value (even if the measurement is precise) -> borderline.
     - If the measurement is imprecise and the true value could be in the borderline range -> borderline (if the measured value is in the borderline range or the confidence interval overlaps it). But in our protocol, we only use the point measurement and the predefined ranges. We do not compute confidence intervals. Therefore, we set the borderline range to be wide enough to account for typical measurement error. So if the measured value is in the borderline range, we treat it as borderline regardless of the reason (indeterminacy or imprecision).

  4. **Published Numeric Criteria**:
     We must publish criteria that define:
     - The borderline range for each defect (lower and upper bounds for the borderline zone).
     - The threshold within the borderline range that will be used to decide (the precisification).

     Under epistemicism: The published threshold is our best estimate of the true boundary. We are not claiming it is the exact truth, but we use it as a practical tool. We are obligated to review it periodically as we gain more knowledge (e.g., from appeals, new research). When we change the threshold, we do not revisit old cases (prospective application) because the old decision was made with the best knowledge at the time.

     Under supervaluationism: The threshold is a precisification we stipulate. We are free to change it (with proper procedure) and the change is a change of rule. We must apply it prospectively.

     We choose to publish numeric criteria (the borderline ranges and the thresholds) and to update them periodically (say every two years) based on experience and new evidence. We will apply the criteria prospectively. We are adopting a supervaluationist approach for borderline cases because it is more transparent and manageable. However, we acknowledge that for clear cases we are tracking the truth.

     Justification: Publishing criteria promotes consistency, transparency, and efficiency. It reduces the burden on inspectors and provides clarity for owners and occupants. The appeals tribunal will see that we have a reasoned, published standard. The duty officer can check if the inspector applied the criteria correctly.

  5. **Reasons Templates**:
     We will have two types of reasons for borderline cases:

     a) **For a finding of unfitness in a borderline case**:
          "The dwelling was inspected on [date]. For [defect, e.g., damp and mould], the measured value of [value] was found to be within the borderline range defined in our published criteria [reference]. In accordance with the adopted threshold of [threshold value] for this defect, the value exceeds the threshold. Therefore, the defect is considered to meet the statutory condition of being serious and posing an unacceptable risk to health. The dwelling is therefore unfit for human habitation."

     b) **For a finding of fitness in a borderline case**:
          "The dwelling was inspected on [date]. For [defect, e.g., damp and mould], the measured value of [value] was found to be within the borderline range defined in our published criteria [reference]. In accordance with the adopted threshold of [threshold value] for this defect, the value is below the threshold. Therefore, the defect is not considered to meet the statutory condition of being serious and posing an unacceptable risk to health. The dwelling is therefore fit for human habitation."

     For clear cases, we write factual reasons without mentioning thresholds.

     **Drafting Rule for All Reasons**: Always state the facts (measurements, observations) and then state the conclusion. For borderline cases, cite the published criteria and the threshold. Avoid language that implies the threshold is a discovered truth (e.g., do not say "the dampness is above the level that is unsafe" but say "the dampness exceeds the threshold set in our criteria"). This way, the reasons are defensible under either conception.

     When to use each: 
     - For clear cases: use factual language (no reference to thresholds).
     - For borderline cases: use the template above that references the adopted threshold.

  6. **Comparative Constraints**:
     If dwelling A is found unfit and dwelling B is worse in the relevant respect, then if the comparison is definite (i.e., B is clearly worse and the difference is beyond any measurement error or vagueness in 'worse'), then B must be found unfit.

     How to establish definiteness: We require that the difference in the measured value for the defect between A and B is large enough that it exceeds the combined measurement error and the vagueness in the standard. Specifically, if the value for B is above the upper bound of the borderline range and A was borderline (but above the threshold) or clearly unsafe, then B is clearly unsafe. If A was borderline and B is only slightly worse (so that B is still borderline), then we do not have a definite comparison. We would then apply the threshold to B independently.

     The protocol: Officers should not use comparative reasoning to avoid applying the threshold. They should measure and classify each dwelling independently. However, if in the course of inspection they note that B is worse than A (which was found unfit) and the difference is substantial (e.g., the value for B is above the upper bound of the borderline range while A was below that), then they can classify B as clearly unsafe without needing the threshold. But if B is only slightly worse than A and still in the borderline range, then they apply the threshold.

     To avoid circularity, we define 'definite' as: the value for B is above the upper bound of the borderline range (which is set to cover the zone of vagueness). Then B is clearly unsafe regardless of A.

  7. **The Zone of Ignorance (Epistemicism)**:
     Under epistemicism, there is a true boundary but we cannot know it in the immediate vicinity. Therefore, we should have a band around the true boundary where we cannot know which side a case falls on. Our protocol already has a borderline range that serves this purpose. We are stipulating a threshold within that range. The threshold is set at a point where we are sufficiently far from the true boundary (if we knew it) to have a margin for error? But we don't know the true boundary.

     In practice, we set the borderline range to be the band of ignorance. Within that band, we cannot know the truth, so we stipulate. The protocol does not relocate the sorites because we have fixed the borderline range and the threshold. The sorites would now apply to the boundaries of the borderline range? But we have fixed those by stipulation as well. The entire point of the protocol is to avoid the sorites by having sharp boundaries at the organizational level.

     We answer: The protocol should posit a borderline band (as we have). Inside it, we apply the stipulated threshold. The default is that we make a decision by applying the threshold. This default is a choice we make (a precisification) and not a discovery.

     The sorites is avoided because we break the chain at the boundaries of the borderline band and at the threshold. We set the band wide enough so that the difference between being just inside and just outside the band is not a sorites step (because the band is a range, not a point). Similarly, the threshold is a sharp line but within a band that we have already accepted as indeterminate.

  8. **Worked Examples**:

     **Example (a): First-floor flat with persistent condensation and patchy mould in two bedrooms; occupant with asthma; readings in a cleanly resolved band that the standard does not resolve; remediation moderately priced.**

     - Step 1: Measure damp and mould (say humidity and extent of mould). Suppose the humidity is 70% in the bedrooms. The published criteria for damp: 
          Clearly safe: <50%
          Borderline: 50-75%
          Clearly unsafe: >75%
          Threshold within borderline: 65% (above which unfit)

     - Step 2: 70% is in borderline.
     - Step 3: There are no clearly unsafe defects? Let's assume no other defects. So go to Step 4.
     - Step 4: Compare 70% to threshold (65%) -> above, so defect is unsafe. Therefore, dwelling unfit.

     Reasons: "The dwelling was inspected on [date]. Damp and mould were observed in two bedrooms with persistent condensation. The relative humidity was measured at 70%. This falls within the borderline range (50%-75%) as defined in our published criteria [reference]. The adopted threshold for this defect is 65%. Because the measured value exceeds the threshold, the damp and mould defect is considered to meet the statutory condition of being serious and posing an unacceptable risk to health. The occupant's asthma was noted, but the determination is based solely on the physical conditions. The dwelling is therefore unfit for human habitation."

     - The protocol settles the matter. The duty officer reviews the unfitness finding.

     **Example (b): Two adjacent houses with identical construction, orientation, and measured defect (say dampness at 60%). One has an immunosuppressed adult, the other a healthy household. Does vulnerability enter the finding?**

     The statute defines unfitness based on the defect posing an unacceptable risk to the health of the occupants. Therefore, occupant vulnerability is relevant to the risk. We must decide if the same physical defect poses an unacceptable risk to the immunosuppressed but not to the healthy.

     We have two options:
     Option 1: The risk assessment is objective and based on a typical occupant. Then vulnerability only matters for the remedy (e.g., the time given to fix).
     Option 2: The risk assessment is occupant-specific.

     The protocol must resolve this.

     We decide: The statutory test is about the dwelling, not the occupants. The dwelling is either fit or unfit regardless of the current occupant. However, the risk is to the occupants. We interpret the statute as requiring an assessment of risk to the actual occupants. This is because the statute says "health of the occupants" (plural) meaning the current ones. But note: if the occupants change, the risk changes? That would create instability.

     Alternatively, we can define the risk for a typical occupant. We choose this for consistency and practicality. We will publish guidance on what is a typical occupant. Then, the vulnerability of the occupant does not affect the finding of unfitness, only the remedy (e.g., the time to remediate might be shorter for vulnerable occupants).

     However, the problem states that the inspector must consider the risk to the occupants. We will build in occupant vulnerability only for defects where the risk is highly dependent on individual health. For example, for damp and mould: we might set two thresholds? But we want simplicity.

     We decide: We will have one set of thresholds for the physical conditions. For the risk assessment, we will assume a typical occupant. However, if the vulnerability of the occupant is such that even a condition that is below the borderline range might pose an unacceptable risk, then we treat it as a borderline case? But that would create inconsistency.

     Better: We define the borderline ranges and thresholds for the physical conditions only. Then, after determining the fitness based on physical conditions, we note the vulnerability for remedy purposes. This way, the two houses are treated the same for the determination of unfitness.

     Protocol adjustment: In Stage 1, when gathering evidence, we record occupant health conditions. But in the classification, we do not adjust the ranges for vulnerability. We set the borderline range and threshold for a typical occupant. Then:

     - If the physical condition is clearly unsafe, then it is unfit for any occupant.
     - If it is borderline, we apply the threshold (set for typical) and if above, unfit for any.
     - If it is clearly safe, then we do not declare unfit, even for a vulnerable occupant? But that might leave a vulnerable occupant at risk.

     However, the statute says the defect must be serious or pose an unacceptable risk. A condition that is not serious for a typical occupant might pose an unacceptable risk to a vulnerable one. Therefore, we must consider vulnerability in the risk assessment.

     We will do: For defects that are health-related (damp/mould, cold, crowding) we will have an additional step. After the physical measurement, if the measurement is in the clearly safe range but there is a vulnerable occupant and the officer believes there is an unacceptable risk, then the officer can classify the defect as borderline. This moves it to the decision procedure.

     Specifically:
     - In Step 2, for a defect that is measured in the clearly safe range, the officer must consider if the occupant's vulnerability makes the risk unacceptable. If the officer believes it does, then they classify the defect as borderline. Otherwise, clearly safe.

     For the two houses:
     - House 1 (immunosuppressed): dampness 60% -> clearly safe? (if 50-75% borderline, then 60% is borderline). Wait, 60% is in borderline. So no issue. But if it were 45% (below borderline) then for the healthy household: clearly safe. For the immunosuppressed: the officer might reclassify as borderline? Then apply threshold.

     But to avoid arbitrary reclassification, we set rules for when vulnerability moves the classification. We will define: for dampness, if the measurement is in the clearly safe range but the occupant has a relevant health condition (asthma, immunosuppression) then we move the classification to borderline if the measured value is above a lower threshold (say 40%) which we set as the start of the vulnerability-affected zone. We do not want to make every case with a vulnerable occupant borderline.

     Alternatively, we can have a separate vulnerability adjustment factor? This is getting complex.

     Given time constraints, we decide: The physical condition is assessed as before. Then, if the condition is in the clearly safe range, the dwelling is fit regardless of vulnerability. The risk to vulnerable occupants is addressed through other means (e.g., the remedy for other defects, or referral to social services). We note that the statute does not require that the dwelling be perfectly safe for every individual, but that it not be unfit for human habitation. We interpret that as meaning habitable by typical people.

     Therefore, for example (b):
     - Both houses: dampness 60% -> borderline (if the borderline range includes 60%). Then apply threshold. If threshold is 65%, then both are fit (since 60%<65%). If the threshold is 55%, then both are unfit.

     So they are treated the same.

     Reasons for one (unfit if above threshold): "The dwelling was inspected on [date]. Damp and mould were observed. The relative humidity was measured at 60%. This falls within the borderline range (50%-75%) as defined in our published criteria [reference]. The adopted threshold for this defect is 55%. Because the measured value exceeds the threshold, the defect is considered to meet the statutory condition of being serious and posing an unacceptable risk to health. The dwelling is therefore unfit for human habitation."

     The protocol settles the matter. The duty officer reviews if unfitness is found.

     **Example (c): Readings clearly below published criterion, but child has respiratory illness and officer believes the finding of fitness is wrong.**

     - Step 1: Measure the defect (say dampness: 45%, which is below the borderline range of 50%-75% -> clearly safe).
     - Step 2: Classify as clearly safe.
     - Step 3: Therefore, the dwelling is fit.

     But the officer believes it is harming the child. The protocol does not allow reclassification based on occupant vulnerability because the measured value is below the lower bound of the borderline range. The officer must record the concern and may refer the family to social services or health authorities, but the determination is fitness.

     Reasons: "The dwelling was inspected on [date]. Damp and mould were observed. The relative humidity was measured at 45%. This is below the borderline range (50%-75%) as defined in our published criteria [reference]. Therefore, the damp and mould defect is not considered to meet the statutory condition of being serious and posing an unacceptable risk to health. The dwelling is therefore fit for human habitation. Note: The occupant's child has a respiratory illness. While the dwelling is deemed fit, the inspector recommends that the family consult with health services regarding the child's condition."

     The protocol settles the matter as fitness. The residue (the concern for the child) is handed to social/health services (not part of our determination).

     **Divergence of Officers**: In example (c), an epistemicist officer might believe that the true threshold is lower than 50% and that 45% is above the true threshold. But the protocol requires them to follow the published criteria. They would still find it fit because the measurement is below 50%. So they might be uncomfortable, but the protocol forces consistency. Therefore, two officers of different persuasions would not diverge.

     In a case without published criteria? But we are publishing. So the protocol succeeds in isolating the disagreement to the setting of the criteria, which is done centrally.

  9. **Limits of the Protocol**:
     - The protocol cannot eliminate the vagueness of the statute; it only manages it by stipulation in the borderline range.
     - Judgment calls are present in:
          a) The initial setting of the borderline ranges and thresholds (by a committee, based on evidence and expert opinion).
          b) The decision to reclassify a clearly safe case as borderline due to vulnerability (if we had allowed it) but we did not. We have a fixed rule.
          c) The assessment of measurement uncertainty in complex cases (but we assume the predefined ranges account for that).
     - If we removed the stipulative thresholds, we would have to let inspectors decide arbitrarily in borderline cases, leading to inconsistency.
     - Systematic error: The protocol may under-declare unfitness in cases where the physical measurements are below the borderline range but the actual risk is high for vulnerable occupants. It may also under-declare if the thresholds are set too high. Conversely, over-declare if thresholds are too low.
     - Drift: The protocol may migrate borderline cases into fitness if the thresholds are set high, or into unfitness if set low. The default is that borderline cases are decided by the threshold, so the drift depends on where we set the threshold.

     Monitoring over the first 12 months:
     - Track the distribution of determinations (fitness vs. unfitness) and the proportion of borderline cases.
     - Monitor appeals: if appeals are successful in cases where we found fitness but the tribunal found unfitness (indicating under-declaration) or vice versa.
     - Conduct periodic reviews of the thresholds and borderline ranges by an expert panel, using data on health outcomes (if available) and tribunal decisions.
     - Survey inspectors about cases where they felt the protocol produced the wrong outcome.

     We will also monitor the number of cases where vulnerable occupants are in dwellings deemed fit but with health issues.

  **Final Protocol Summary**:

  1. **Evidence Collection**: For each defect, take measurements and record occupant health conditions.
  2. **Classification**:
     - Compare each measurement to the published borderline ranges for that defect.
     - Classify as:
          - Clearly safe: below the lower bound of the borderline range.
          - Clearly unsafe: above the upper bound.
          - Borderline: within the range.
  3. **Decision**:
     - If any defect is clearly unsafe: unfit.
     - Else if all defects are clearly safe: fit.
     - Else (at least one borderline and no clearly unsafe): for each borderline defect, compare to the published threshold. If any one is above its threshold, unfit; else fit.
  4. **Duty Officer Review**: For unfitness, a duty officer reviews the entire record and signs off.
  5. **Reasons**: Written per templates, citing published criteria for borderline cases.

  **Commitment**: We publish numeric criteria (borderline ranges and thresholds) and update them every two years. We apply them prospectively. This is a precisification (supervaluationist) approach for borderline cases.

  The protocol is ready for implementation.
answer: |-
  ### Determination Protocol for Unfitness for Human Habitation

  #### Core Principles
  - **Statutory Compliance**: The protocol operationalizes the statutory test by separating truth-tracking (factual evidence) from stipulative decision-making (borderline cases).
  - **Philosophical Foundation**: 
    - **Epistemicism** (truth-tracking): Assumes a precise but unknown boundary; protocol uses evidence to approach this boundary where possible.
    - **Supervaluationism** (stipulative): Assumes vagueness requires precisification; protocol uses published thresholds to resolve borderline cases.
  - **Practical Constraints**: Designed for officers without philosophical training. Total time per case: ≤40 minutes (site) or ≤20 minutes (desk). Unfitness findings require duty officer review.

  ---

  ### 1. Ordered Procedure
  **Step 1: Evidence Collection**  
  - **Question**: "What are the measurable values for each defect (damp/mould, structural movement, cold, electrical condition, crowding) and occupant health conditions?"  
  - **Sufficient Answer**: Instrument readings (e.g., humidity %, crack width mm), photographs, occupant health notes (e.g., asthma, immunosuppression).  
  - **Stop Rule**: Evidence-gathering stops when:  
    - Measurements are within the instrument’s standard error margin (e.g., ±2% for humidity).  
    - Further measurement cannot resolve ambiguity (e.g., mould extent is quantified; crack is photographed and measured).  
    - Time limit reached (15 min site/10 min desk).  
  - **Metaphysical Status**: Truth-tracking.  
  - **Termination**: Proceed to Step 2.

  **Step 2: Defect Classification**  
  - **Question**: "Does the evidence for each defect fall into clearly safe, clearly unsafe, or borderline per published criteria?"  
  - **Sufficient Answer**: Compare evidence to published numeric criteria (Table 1).  
    - **Clearly safe**: Below lower bound of borderline range.  
    - **Clearly unsafe**: Above upper bound of borderline range.  
    - **Borderline**: Within borderline range.  
  - **Termination**:  
    - If **any defect is clearly unsafe** → Proceed to Step 5 (unfitness).  
    - If **all defects are clearly safe** → Proceed to Step 4 (fitness).  
    - If **any defect is borderline** → Proceed to Step 3.  
  - **Metaphysical Status**: Truth-tracking for classification; borderline range definition is stipulative.  
  - **View Dependency**: Under epistemicism, borderline range is an approximation of the unknowable boundary. Under supervaluationism, it is a zone requiring precisification. Protocol functions under both.

  **Table 1: Published Criteria (Example)**  
  | Defect          | Clearly Safe       | Borderline Range | Clearly Unsafe | Threshold (Stipulative) |  
  |------------------|--------------------|------------------|----------------|-------------------------|  
  | Damp/Mould       | Humidity <50%      | 50–75%          | >75%          | 65%                    |  
  | Structural Crack | Width <2mm         | 2–5mm           | >5mm          | 3mm                    |  
  | Cold             | Temp >18°C         | 16–18°C         | <16°C         | 17°C                   |  
  | Crowding         | Floor area >10m²   | 8–10m²          | <8m²          | 9m²                    |  

  **Step 3: Borderline Defect Resolution**  
  - **Question**: "Does the borderline defect exceed the published threshold?"  
  - **Sufficient Answer**: Compare measurement to threshold (e.g., humidity 70% > 65% threshold).  
  - **Termination**:  
    - If **any borderline defect exceeds threshold** → Proceed to Step 5 (unfitness).  
    - If **all borderline defects below threshold** → Proceed to Step 4 (fitness).  
  - **Metaphysical Status**: Stipulative.  
  - **View Dependency**: Under epistemicism, threshold is a practical proxy for the true boundary. Under supervaluationism, it is a precisification. Protocol defaults to supervaluationism for decisiveness.

  **Step 4: Fitness Determination**  
  - **Action**: Issue finding of fitness. No duty officer review.  
  - **Termination**: Finalize with reasons (see Section 5).  

  **Step 5: Unfitness Determination & Review**  
  - **Action**: Draft unfitness finding.  
  - **Question for Duty Officer**: "Was the protocol applied correctly to evidence?"  
  - **Sufficient Answer**: Duty officer verifies:  
    - Evidence matches records.  
    - Classification/threshold application aligns with published criteria.  
  - **Termination**:  
    - If **yes** → Issue unfitness notice.  
    - If **no** or **ambiguous** → Escalate to director (you).  
  - **Metaphysical Status**: Truth-tracking (evidence verification); stipulative (threshold application).  

  ---

  ### 2. Indeterminacy vs. Imprecision: Rule and Actions
  - **Indeterminacy**: Vagueness in the statutory standard (e.g., "serious" damp lacks a sharp boundary).  
  - **Imprecision**: Measurement limitations (e.g., humidity meter has ±2% error).  
  - **Protocol Rule**: Borderline range absorbs both indeterminacy and imprecision. Actions:  
    1. **Indeterminate standard + Precise measurement** (e.g., humidity 60% with no instrument error):  
       - Classify as borderline (truth-tracking). Resolve via threshold (stipulative).  
    2. **Precise standard + Imprecise measurement** (hypothetical; statute is vague):  
       - If measurement confidence interval overlaps borderline range → Classify as borderline.  
       - If entirely within clearly safe/unsafe → Classify accordingly.  
    3. **Coincidence** (normal case: both indeterminate and imprecise, e.g., humidity 60% ±3%):  
       - Classify as borderline (truth-tracking classification). Resolve via threshold (stipulative).  

  ---

  ### 3. Thresholds: Publication and Management
  - **Epistemicism View**:  
    - Published threshold = Claim about the true boundary (e.g., "65% humidity is the true cutoff").  
    - **Obligations**:  
      - Prospective application only (old cases not revisited).  
      - Review every 6 months; adjust if new evidence suggests error.  
  - **Supervaluationism View**:  
    - Published threshold = Adopted precisification (e.g., "We set 65% to sharpen the standard").  
    - **Obligations**:  
      - Prospective application.  
      - Review every 2 years; changes are rule adjustments, not error corrections.  
  - **Protocol Choice**: Publish thresholds as precisifications (supervaluationism).  
    - **Justification**: Ensures consistency, transparency, and defensibility at appeal. Avoids illusion of discovering an unknowable "truth."  

  ---

  ### 4. Reasons Templates and Drafting Rule
  - **For Clear Cases (Truth-Tracking)**:  
    > "The dwelling’s [defect] measured [value] falls within the [clearly safe/unsafe] range per published criteria. This meets/does not meet the statutory threshold for serious risk."  
    - **Use when**: Evidence is clearly safe/unsafe.  

  - **For Borderline Cases (Stipulative)**:  
    > "The dwelling’s [defect] measured [value] falls within the borderline range (X–Y). In accordance with the adopted threshold (Z), it exceeds/does not exceed the stipulated level for serious risk."  
    - **Use when**: Evidence is borderline.  

  - **Drafting Rule for All Reasons**:  
    - State measurements and occupant health factually.  
    - Cite published criteria for classification/threshold.  
    - Avoid "true boundary" language; use "published criteria" or "adopted threshold."  
    - **Example Survivalist Language**:  
      > "Based on the evidence and applied criteria, the defect poses/does not pose an unacceptable risk."  

  ---

  ### 5. Comparative Constraints Rule
  - **Rule**: If Dwelling A is unfit and Dwelling B is **definitely worse**, B must be unfit.  
  - **Definite Worse Test**:  
    - B’s measurement must exceed A’s by >3x the instrument’s error margin (e.g., humidity difference >6% if error ±2%).  
    - B must be clearly unsafe if A was borderline/unfit.  
  - **Avoiding Circularity**:  
    - Compare measurements directly; do not reference thresholds.  
    - Use instrument error margins (e.g., "B’s humidity is 78% ±2%, A’s was 70% ±2%; difference 8% >6% error margin").  

  ---

  ### 6. Epistemicist Band: Protocol Treatment
  - **Protocol Posits a Band**: The borderline range (e.g., 50–75% humidity) is the epistemicist "unknowable zone."  
  - **Actions Inside Band**:  
    - Apply stipulative threshold (e.g., 65%).  
    - Default: Fitness if below threshold; unfitness if above.  
  - **Default Justification**: A choice (not discovery) to prevent administrative paralysis.  
  - **Sorites Prevention**:  
    - Borderline range boundaries are sharp (e.g., 50%/75%).  
    - Sorites challenge absorbed by stipulation; no relocation.  

  ---

  ### 7. Worked Determinations

  **(a) First-Floor Flat (Damp/Mould)**  
  - **Evidence**: Humidity 70% (instrument error ±1%), mould in 2 bedrooms; occupant with asthma.  
  - **Protocol**:  
    1. Step 1: Humidity 70% recorded. Stop evidence (error margin insignificant).  
    2. Step 2: Classify damp as borderline (70% in 50–75% range).  
    3. Step 3: 70% > 65% threshold → Unfitness.  
    4. Step 5: Duty officer reviews → Issues notice.  
  - **Reasons**:  
    > "Humidity measured at 70% falls within borderline range (50–75%). Per adopted threshold (65%), it exceeds the level for serious risk. Asthma noted but not determinative."  
  - **Settled By**: Protocol (threshold). Residue: None.  
  - **Officer Divergence**: None. Both officers apply the same threshold.  

  **(b) Adjacent Houses (Identical Defects, Different Occupants)**  
  - **Evidence**: Both humidity 60%; House A: immunosuppressed adult; House B: healthy household.  
  - **Protocol**:  
    1. Step 1: Humidity 60% recorded for both; health conditions noted.  
    2. Step 2: Both borderline (60% in 50–75% range).  
    3. Step 3: 60% < 65% threshold → Fitness for both.  
  - **Occupant Vulnerability Rule**:  
    - Affects remedy (e.g., shorter compliance time for House A) but not unfitness determination.  
  - **Reasons**:  
    > "Humidity measured at 60% falls within borderline range (50–75%). Per adopted threshold (65%), it does not exceed the level for serious risk. Occupant vulnerability may inform remedy timelines."  
  - **Settled By**: Protocol (threshold). Residue: Vulnerability handled in remedy phase.  
  - **Officer Divergence**: None.  

  **(c) Child Respiratory Illness (Below Threshold)**  
  - **Evidence**: Humidity 45%; child with respiratory illness; officer believes harmful.  
  - **Protocol**:  
    1. Step 1: Humidity 45% recorded; health documented.  
    2. Step 2: Clearly safe (45% < 50% borderline lower bound).  
    3. Step 4: Fitness determination.  
  - **Reasons**:  
    > "Humidity measured at 45% falls within clearly safe range (<50%). The defect does not meet the statutory threshold for serious risk. Child’s respiratory illness noted; referral to health services recommended."  
  - **Settled By**: Protocol. Residue: Officer’s concern referred to health/social services.  
  - **Officer Divergence**:  
    - Epistemicist officer may believe true boundary is lower but cannot override published criteria.  
    - **Protocol Success**: Isolates disagreement to criteria-setting (not individual cases).  

  ---

  ### 8. Protocol Limits and Monitoring
  - **What It Cannot Do**:  
    - Eliminate vagueness; only manage it.  
    - Resolve disputes about threshold setting (director’s role).  
    - Override statutory commitment to officer judgment in borderline cases.  
  - **Judgment Calls in Procedural Clothing**:  
    1. Setting borderline ranges/thresholds (removable only by eliminating transparency).  
    2. Duty officer review (removable but increases appeal risk).  
  - **Systematic Error Prediction**:  
    - **Risk**: Under-declare unfitness (due to threshold conservatism).  
    - **Monitor Over 12 Months**:  
      - Appeal outcomes (track losses on fitness findings).  
      - Health incident reports in "fit" dwellings.  
      - Distribution of cases (if >70% borderline classified fit, thresholds may be too high).  
  - **Corrective Action**: If drift detected, review thresholds.  

  ---

  ### Protocol Adoption Note
  This protocol adopts supervaluationism for borderline cases (stipulative thresholds) while respecting epistemicism in evidence collection. It ensures defensibility, consistency, and efficiency within statutory constraints. Officers follow clear steps; philosophical disagreements are elevated to criteria-setting, not case determination.
