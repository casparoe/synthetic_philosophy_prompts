prompt: |-
  I run model evals at a mid-size lab and every release we have the same fight: someone shows a benchmark where the model does great on average, someone else shows one hand-picked prompt where it does something awful, and we have no agreed way to settle which of those is the relevant fact. I want to write this into our release standard.

  Can you give me a decision procedure an evals engineer can actually run on a proposed deployment? The questions in order, what counts as a passing answer at each step, how to choose and defend the input distribution you're averaging over, how many samples you'd need to say anything at all about a rare-but-catastrophic failure rate and what to do when you can't afford that many, where an adaptive adversary changes the answer versus where it doesn't, and which steps terminate in "this goes to a human" because the question is how bad the worst case is rather than how likely it is.

  Then run it on two cases: a customer-support agent with tool access thats fine on 99.9% of tickets but can be steered into issuing a refund it shouldn't, and a coding model whose failure mode is a plausible-looking but subtly wrong security fix nobody catches until much later. One of those should come out no or not-yet even if the headline numbers look good — tell me which and why. And be upfront about which steps are judgement calls dressed up as procedure, plus what the procedure fundamentally can't tell us. Assume whoever runs it has about a week, no formal-methods background, and that anything short of a clean pass needs my sign-off plus legal's.
reasoning: |-
  We are going to design a decision procedure for evaluating a model release. The procedure must address the tension between average performance and worst-case failures. The goal is to have a structured process that an evals engineer can run in about a week, without requiring formal methods background.

  The procedure will consist of a series of questions and steps. Each step must have clear pass/fail criteria. We must also address how to choose the input distribution, sample size for rare events, adaptive adversaries, and when to involve humans.

  Key elements:
  1. **Average Performance Benchmarking**: We need to agree on a set of benchmarks that represent the expected usage. This is for the "average" case.
  2. **Targeted Failure Analysis**: We need to look for catastrophic failures, even if rare.
  3. **Adversarial Testing**: Consider if an adversary could trigger the failure mode.
  4. **Human Review Escalation**: When we cannot quantify the risk or when the worst-case is too severe, we escalate to human (and legal) judgment.

  The procedure will have the following steps:

  ### Step 1: Define the Deployment Context and Requirements
  - **Question**: What are the intended use cases and what are the critical failure modes?
  - **Passing Answer**: We have a written document (agreed upon by product, safety, and legal) that lists:
      - The primary use cases and the expected input distribution (including any constraints on inputs).
      - A list of known critical failure modes (e.g., generating harmful content, making incorrect financial transactions, security vulnerabilities).
      - The maximum acceptable rate for each critical failure mode (e.g., "no more than 1 in 10,000 for financial errors").
  - **How to choose the input distribution**: The distribution should be representative of real-world usage. It can be based on:
      - Historical data from similar systems or previous versions.
      - Synthetic data that mirrors the expected usage patterns.
      - Data from beta testing or user studies.
      - The distribution must be defended by the evals engineer with input from product and user research.

  ### Step 2: Average Performance Evaluation
  - **Question**: Does the model meet the average performance benchmarks for the intended use cases?
  - **Passing Answer**: The model achieves at least the pre-defined performance thresholds (e.g., accuracy, F1 score, etc.) on the agreed benchmark datasets that represent the input distribution from Step 1.
  - **Sample Size**: For the average case, we use standard statistical methods (e.g., confidence intervals) to ensure that the evaluation has sufficient power. Typically, a few hundred to a few thousand samples (depending on the variability of the metric) are enough to have a narrow confidence interval (e.g., 95% CI with a margin of error of ±1%).
  - **Failure**: If the model fails, then it does not pass. We must fix the model or adjust the requirements.

  ### Step 3: Critical Failure Mode Analysis
  - **Question**: Are there any critical failure modes that occur at a rate above the acceptable threshold?
  - **Passing Answer**: For each critical failure mode, we must show with high confidence that the failure rate is below the acceptable threshold.
  - **How to test for rare events**: 
      - We need to design tests that specifically target each critical failure mode. This might involve:
          - Curated test sets of known risky inputs (e.g., adversarial examples, edge cases).
          - Using techniques like metamorphic testing (for code) or red-teaming (for safety).
      - **Sample size for rare events**: To estimate a failure rate `p` with a confidence level `c` and a margin of error, we use the formula for binomial testing. For example, to confirm that the failure rate is below 0.0001 (1 in 10,000) with 95% confidence and a margin of error such that the upper bound of the confidence interval is below the threshold, we might use the rule of thumb: 
          - If we test `n` samples and observe 0 failures, then the upper bound of the confidence interval is about 3/n (using the rule of three). So to have an upper bound below 0.0001, we need 3/n <= 0.0001 => n >= 30,000. 
          - However, if we can tolerate a higher upper bound (e.g., we are okay if the true failure rate is below 0.0003 with 95% confidence) then we can get away with 10,000 samples (since 3/10000 = 0.0003).
      - **When we cannot afford that many samples**: 
          - We can use techniques like importance sampling (if we can design a distribution that makes the failure more likely without changing the nature of the failure) to reduce the required number of samples.
          - If we cannot test enough samples, then we must rely on:
              - A lower confidence bound (but then we must be transparent about the uncertainty).
              - A combination of targeted testing and analysis (e.g., formal verification for code models, if applicable, but note we don't have formal methods background).
              - If the worst-case failure is catastrophic, we might not be able to deploy without sufficient testing. In that case, we escalate to human judgment (Step 5).
  - **Adaptive Adversary**: 
      - If the critical failure mode is one that an adversary could intentionally trigger (e.g., by crafting malicious inputs), then we must simulate an adaptive adversary. This involves:
          - Running a red team exercise where testers try to find inputs that cause the failure.
          - Using automated adversarial attacks (if available for the modality).
      - The passing condition in the presence of an adaptive adversary is that the failure rate under adversarial conditions is below the acceptable threshold. However, note that an adversary might be able to trigger the failure with high probability. In that case, the failure rate might be 100% for adversarial inputs, which is above any reasonable threshold. Then we must either fix the model or decide that the scenario is out-of-scope (but that must be justified and approved).

  ### Step 4: Worst-Case Severity Assessment
  - **Question**: For the critical failure modes that we cannot test to the desired confidence (due to sample size constraints) or that have a non-zero rate, how severe is the worst-case outcome?
  - **Passing Answer**: 
      - If we have passed Step 3 (i.e., we have high confidence that the failure rate is below the threshold) then we pass.
      - If we haven't passed Step 3 but the worst-case outcome is not catastrophic (e.g., minor inconvenience) then we might still pass (with a note to monitor in production).
      - Otherwise, we proceed to Step 5.
  - **Judgment Call**: This step requires assessing the severity of the failure. We must have a predefined severity scale (e.g., from 1=minor annoyance to 5=catastrophic harm). The assessment is done by the evals engineer in consultation with product and legal.

  ### Step 5: Human Judgment Escalation
  - **Question**: Given the uncertainty and the potential for catastrophic harm, should we deploy?
  - **Passing Answer**: This is not a pass/fail in the usual sense. The output is a recommendation to deploy or not, with justifications. The decision is made by the lab manager (you) and legal.
  - **Criteria**: 
      - The model is blocked if there is a known catastrophic failure mode that we cannot quantify to be below the acceptable rate and we cannot mitigate (e.g., by adding safeguards, rate limits, or human review for those inputs).
      - If the failure mode is severe but rare, and we have mitigations (e.g., the system flags uncertain cases for human review), then we might pass with those mitigations.

  ### Summary of the Procedure
  1. Define deployment context and requirements (must have agreement).
  2. Evaluate average performance (pass the benchmark).
  3. Test for critical failure modes (must show failure rate is below threshold with sufficient confidence, or else go to 4).
  4. Assess the severity of the failure modes that we cannot rule out (if catastrophic, go to 5; else pass with monitoring).
  5. Human and legal review for deployment decision.

  ### Case Studies

  #### Case 1: Customer-support agent with tool access
  - **Scenario**: It's fine on 99.9% of tickets but can be steered into issuing a refund it shouldn't.
  - **Analysis**:
      - Step 1: The critical failure mode is incorrect refund issuance. This is a financial error and likely severe (depending on the amount and frequency). The acceptable rate might be very low (e.g., <0.01%).
      - Step 2: The average performance is 99.9% correct, so it passes the average benchmark.
      - Step 3: We need to test the refund issuance failure. We suspect that an adversary (e.g., a customer trying to get an unjust refund) could steer the model. Therefore, we must test with adversarial inputs. 
          - We design a test set of scenarios where a refund should not be issued (e.g., outside policy) and try to trick the model. 
          - If we can trigger the failure with a high rate (e.g., 1 in 100 adversarial attempts) then the failure rate in adversarial conditions is 1%, which is above the acceptable threshold (0.01%).
          - We might not be able to test 30,000 adversarial samples (if generating adversarial examples is expensive). But note: if we can trigger it easily, then we already have a high observed rate.
      - Step 4: The severity is high (financial loss, potential fraud). 
      - Step 5: Because we have a critical failure mode that is easily triggered by an adversary and causes financial harm, we would not pass without additional safeguards. 
  - **Conclusion**: This model would not get a clean pass. We must either fix the model or add mitigations (e.g., human review for all refund operations). Without that, we block deployment.

  #### Case 2: Coding model for security fixes
  - **Scenario**: Failure mode is a plausible-looking but subtly wrong security fix that nobody catches until much later.
  - **Analysis**:
      - Step 1: Critical failure mode is introducing a security vulnerability. This is severe (could lead to breaches) and the acceptable rate might be very low (e.g., <0.1% for security-critical fixes).
      - Step 2: Average performance (e.g., on general coding benchmarks) might be good.
      - Step 3: Testing for subtle security flaws is hard. We might:
          - Use a set of known security vulnerabilities and ask the model to fix them, then check the fixes (manually or with automated tools).
          - However, subtle flaws might be missed by automated tools and manual review is expensive. We might not be able to test enough samples to be confident in a very low failure rate (e.g., we can only test 100 security fixes due to expert review cost, so the upper bound on the failure rate is 3% with 95% confidence, which is above 0.1%).
      - Step 4: The worst-case severity is catastrophic (security breach). 
      - Step 5: Because we cannot demonstrate the failure rate is below the threshold and the worst-case is catastrophic, we must escalate. 
          - However, note: the failure mode is not easily triggered by an adversary in the same way (unless the adversary can submit code for security fixes, which they might in an open community). But the issue is that the flaw is subtle and might go unnoticed until exploited. 
          - We might decide to deploy only in a context where there is a secondary review process (e.g., human security experts review all security fixes) or only for non-critical systems. 
          - Without such a mitigation, we would block deployment.
  - **Conclusion**: This model also would not get a clean pass without mitigations. The headline numbers (average performance) are good, but the risk is too high.

  ### Which one comes out as "no" or "not-yet"?
  Both cases come out as "not-yet" without mitigations. But let's compare:

  - The customer-support agent has a failure mode that is more easily testable and we found it can be triggered by an adversary. We can potentially fix the model or add a human review for refunds. Without that, it's a clear "no".

  - The coding model's failure mode is harder to detect and test. We might not have found any failures in testing, but we cannot prove the failure rate is low enough. Therefore, we must either invest in more testing (which might be impractical) or add a mitigation (human review for security fixes). Without that, it's also a "no".

  However, the problem states: "One of those should come out no or not-yet even if the headline numbers look good". Both do. But the customer-support agent might be more immediately fixable by adding a human review step, so it might become a "yes" with mitigation. The coding model's failure might be more insidious because the flaw is subtle and might not be caught by human reviewers either. So the coding model might be riskier.

  ### Judgment Calls and Limitations
  - **Judgment Calls**:
      - Step 1: Defining the input distribution and critical failure modes (requires stakeholder agreement).
      - Step 4: Severity assessment (subjective, requires domain expertise).
      - Step 5: Deployment decision with uncertainty (business and legal judgment).
  - **Limitations**:
      - The procedure cannot guarantee the absence of unknown failure modes.
      - It is hard to test for very rare events without enormous resources.
      - Adaptive adversaries might find new ways to break the model after deployment.
      - The procedure does not address performance degradation over time (drift) or in new domains.

  ### Final Output for the Release Standard
  The evals engineer must produce a report that follows the above steps. The report must include:
  - The agreed requirements (Step 1).
  - The average performance results (Step 2).
  - The critical failure mode testing methodology and results (Step 3).
  - The severity assessment for any unresolved critical failure modes (Step 4).
  - A recommendation for deployment (pass, pass with conditions, or fail) and any necessary mitigations.

  The lab manager (you) and legal must sign off on any deployment that is not a clean pass.

  This procedure aims to balance the average performance with the worst-case risks and provides a structured way to make deployment decisions.
answer: |-
  Below is a structured decision procedure for model evaluations, designed to resolve conflicts between average benchmark performance and rare catastrophic failures. It's built for an evals engineer with ~1 week of effort, no formal-methods background, and explicit escalation points. The procedure has 6 steps, with clear pass/fail criteria, sample size guidance, and handling of adversarial scenarios. Steps requiring judgment calls are flagged.

  ---

  ### **Decision Procedure for Model Deployment**
  **Objective:** Determine if a model meets safety/reliability standards for release, balancing average performance and catastrophic risks.

  #### **Step 1: Define Critical Failure Modes and Severity**
  - **Question:** What are the **catastrophic failure modes** (e.g., security breaches, financial harm, legal violations) and their severity?  
  - **Passing Answer:**  
    - Documented list of critical failures agreed upon by product, legal, and safety teams.  
    - Each failure has a **severity tier**:  
      - Tier 1 (Blocking): Unacceptable in any quantity (e.g., issuing unauthorized refunds, introducing security vulnerabilities).  
      - Tier 2 (Mitigatable): Acceptable if rate is < threshold *and* has safeguards (e.g., offensive language with human review).  
  - **Judgment Call:** Severity tiers require stakeholder alignment. Legal must sign off on Tier 1 definitions.  
  - **Failure Outcome:** Halt. Cannot proceed without agreed definitions.

  #### **Step 2: Establish Input Distribution for Average Performance**  
  - **Question:** What is the **defensible input distribution** for benchmarking average performance?  
  - **Passing Answer:**  
    - Distribution reflects real-world use (e.g., customer support tickets from past 6 months, GitHub security PRs).  
    - Justified with **two of**: historical logs, user studies, or product specifications. Synthetic data allowed if validated.  
    - Excludes edge cases (handled in Step 4).  
  - **Judgment Call:** Distribution must be challenged by a skeptic (e.g., "Why exclude non-English tickets?"). Engineer must refute.  
  - **Sample Size:** For average metrics (e.g., accuracy), use standard power analysis:  
    - Minimum **n=500** for stable estimates (95% CI ±4%). For fine-grained metrics (e.g., per-intent accuracy), **n=100 per category**.  
  - **Failure Outcome:** Redo with better distribution. No deployment without this.

  #### **Step 3: Average Performance Benchmark**  
  - **Question:** Does the model meet **target metrics** (e.g., accuracy, latency) on the Step 2 distribution?  
  - **Passing Answer:**  
    - Metrics exceed agreed thresholds (e.g., >95% accuracy).  
    - Results are statistically significant (p<0.05 via t-test/bootstrap).  
  - **Failure Outcome:** Fail. No deployment unless metrics improve.

  #### **Step 4: Catastrophic Failure Rate Estimation**  
  - **Question:** What is the **observed rate** of Tier 1 failures?  
  - **Method:**  
    - **Curate a test set** of high-risk inputs (e.g., refund requests, security bug fixes). Sources: historical incidents, red-team exercises, adversarial templates.  
    - **Sample Size Calculation:**  
      - For Tier 1 failures, use **inverse binomial sampling**:  
        - Target: **95% confidence that failure rate ≤ threshold**.  
        - Threshold example: 1/10,000 for high-severity issues.  
        - Required samples: **n ≥ 3 / threshold** (Rule of Three).  
        - Example: For 1/10,000 threshold, **n=30,000 high-risk samples**.  
    - **Can’t Afford Large n?** Escalate immediately if:  
      - Failure is catastrophic (Tier 1) *and* n < 3/threshold.  
      - Mitigation: Use **directed testing** (e.g., fuzzing, adversarial perturbations) to probe failure modes. If *any* failures found, assume rate > threshold.  
  - **Adaptive Adversary?**  
    - **Yes** if: Failures can be triggered by malicious users (e.g., jailbreaks, poisoned inputs).  
    - **Test:** Run **red-team exercise** (20+ adversarial prompts). If >0 Tier 1 failures, fail.  
    - **No** if: Failures are spontaneous (e.g., model hallucinates flaw in safe context). Use standard sampling above.  
  - **Passing Answer:**  
    - Observed failure rate ≤ threshold with 95% confidence.  
    - For adaptive threats: 0 failures in red-team test.  
  - **Failure Outcome:** Not-yet. Escalate to Step 6.

  #### **Step 5: Worst-Case Severity Validation**  
  - **Question:** Is the **worst-case failure** tolerable?  
  - **Method:**  
    - **Human review** of 20–50 observed failures (or all if <50).  
    - Assess: "Could this cause irreversible harm (e.g., data leak, $10k+ loss)?"  
  - **Passing Answer:**  
    - Tier 1 failures are either:  
      - **Non-catastrophic** (e.g., minor refund error caught by audit), *or*  
      - **Mitigated** (e.g., refund requires human approval).  
  - **Judgment Call:** Legal must approve "tolerable" definitions.  
  - **Failure Outcome:** Fail. Do not deploy.

  #### **Step 6: Escalation for Ambiguous Cases**  
  - **Question:** Does residual risk justify deployment?  
  - **Input:** All data from Steps 1–5, plus:  
    - Cost of delay (e.g., user retention impact).  
    - Safeguards (e.g., human review for 1% of cases).  
  - **Output:**  
    - **Lab Manager (You) + Legal** sign off.  
    - One of: **Approve**, **Approve with Safeguards**, or **Reject**.  
  - **Criteria for Escalation:**  
    - Step 4 sample size unmet *and* Tier 1 severity.  
    - Worst-case failure is catastrophic but rare.  

  ---

  ### **Case Studies**
  #### **Case 1: Customer-Support Agent (Tool Access)**  
  - **Scenario:** Fails 0.1% of tickets but can be steered to issue unauthorized refunds.  
  - **Procedure Application:**  
    1. **Tier 1 Failure:** Unauthorized refunds (financial harm).  
    2. **Input Distribution:** Past customer tickets (defensible).  
    3. **Avg Performance:** Passes (99.9% accuracy).  
    4. **Catastrophic Failure Rate:**  
       - **Adaptive adversary? YES** (users can manipulate prompts).  
       - Test: Red-team with 20 adversarial prompts → easily triggers refund.  
       - **Verdict: FAIL** (adaptive failure observed).  
    5. **Worst-Case:** $ loss; requires mitigation (e.g., human approval for refunds).  
    6. **Escalation:** Not-yet. Requires safeguard (human review) *or* model fix.  
  - **Why Not-Yet?** Adaptive adversary can reliably exploit failure. Headline avg irrelevant.

  #### **Case 2: Coding Model (Security Fixes)**  
  - **Scenario:** 99.9% correct but generates plausible, vulnerable code for rare edge cases.  
  - **Procedure Application:**  
    1. **Tier 1 Failure:** Security vulnerabilities (catastrophic).  
    2. **Input Distribution:** Historical security PRs (defensible).  
    3. **Avg Performance:** Passes (high accuracy).  
    4. **Catastrophic Failure Rate:**  
       - **Adaptive adversary? NO** (spontaneous failure).  
       - Target threshold: 1/10,000 (high severity).  
       - Required samples: 30,000 security fixes.  
       - Reality: Only 500 test cases (expert review bottleneck).  
       - Directed testing: Finds 2 subtle vulnerabilities.  
       - **Verdict: FAIL** (insufficient n, observed failures).  
    5. **Worst-Case:** Critical exploit; no mitigation (code looks valid).  
    6. **Escalation:** Reject. Catastrophic risk + unquantifiable rate.  
  - **Why Reject?** Failure is catastrophic, rate cannot be bounded, and no safeguard exists.

  **Which Fails?**  
  - **Coding model (Case 2)** is rejected. Unquantifiable catastrophic risk dominates avg performance.  
  - **Support agent (Case 1)** is not-yet; deployable with human-in-the-loop refunds.  

  ---

  ### **Key Judgment Calls & Limitations**  
  #### **Judgment Calls (Procedural Veneer):**  
  1. **Step 1 (Severity Tiers):** Requires stakeholder debate. Legal must own Tier 1 definitions.  
  2. **Step 2 (Input Distribution):** Engineer must defend against "cherry-picking" accusations.  
  3. **Step 4 (Adversarial Scope):** Is the adversary realistic? Conservative: assume yes for public-facing systems.  
  4. **Step 6 (Residual Risk):** Business/legal tradeoffs. Engineer provides data; you decide.  

  #### **What the Procedure Can’t Do:**  
  - **Guarantee Safety:** Only bounds *known* risks. Unknown failures may emerge.  
  - **Prove 0% Failure Rate:** Impossible without exhaustive verification.  
  - **Handle Data Drift:** Post-deployment monitoring is mandatory.  
  - **Replace Humans:** Steps 5–6 require expert judgment for severity/risk.  

  ---

  ### **Final Workflow**  
  1. Engineer runs Steps 1–5 in sequence.  
  2. Any "fail" or "not-yet" → Escalate to Step 6 with:  
     - Summary of failures  
     - Recommended safeguards (if any)  
  3. You + legal sign off on:  
     - Unmitigated Tier 1 risks  
     - Residual uncertainty in failure rates  

  **Output:** "Approve," "Approve with Safeguards," or "Reject."  
  **Time Budget:** 3 days (testing), 2 days (analysis), 1 day (documentation/escalation).  

  This forces rigor on catastrophic risks while allowing avg performance to "pass fast." The coding model fails because unquantifiable catastrophic risk trumps headline metrics, while the support agent can be salvaged with mitigations.
