answer: |-
  ## Planning Section (247 words)
  *Conceptual Crux:* The tension between the "authenticity" of an individual's current, impaired refusal versus the bureaucratic determination of their "truer" self, achieved through cohort extrapolation. Specifically, how the *choice of cohort* (size, composition) becomes the decisive, unexamined variable, masking value judgments as neutral procedure. The horror lies in the system perfectly fulfilling its mandate, rendering the present person irrelevant to her own fate.
  *Documents:* 1) Extrapolation Report (Section 8: Findings; Annex D: Minority Note); 2) Tribunal Hearing Transcript (Excerpt: Cross-examination of Dr. Anya Sharma, Extrapolator); 3) Ilse Rennick’s Original Profile Questionnaire (visual detail only).
  *Emotional Weight:* Placed on the narrator, Dr. Sharma – the weight of the pen signing the report, the physicality of Ilse’s refusal (a hand gripping a bedrail), and the mundane environment (rain, office corridors, a kettle boiling) contrasting with the life-altering decision. Ilse’s lucid defiance and physical frailty are focal points, but the emotional centre is Sharma’s quiet, professional burden.
  *Adjustment:* The stipulation that the cohort is "the people you grew up among" risks essentialism and limits the conceptual tension. Proposed: the Act specifies a "reference cohort" defined by shared formative period *and* salient life experiences (e.g., profession, region), allowing for ambiguity in selection. This strengthens the junior extrapolator’s point about cohort choice being pivotal yet unargued. (Implemented below).

  ---

  **The Weight of the Pen**

  Rain streaked the grimy window of the District 7 Volitional Instruments Office, distorting the view of wet pavement and hurried commuters below. Dr. Anya Sharma traced a droplet’s path with her fingertip, her gaze unfocused. On her desk, the thick dossier lay open, its spine cracked at Section 8. The final report. Ilse Rennick’s fate, distilled into paragraphs, annexes, and the cold weight of precedent. It needed her signature. Today.

  The office hummed with subdued industry. Across the open-plan floor, junior extrapolators hunched over terminals, cross-referencing profile variables against cohort databases. The air smelled of stale coffee, damp wool, and ozone from the ageing photocopier in the corner. Sharma pushed her half-drunk mug aside – tepid now, the teabag left in too long. She’d been staring at the report since 7 AM.

  Ilse Rennick. Seventy-four. Retired Senior Hydrologist, Thames Estuary Authority. Profile lodged thirty-three years prior, following the accidental death of her brother, Marcus. A significant life event, often a catalyst for profile creation. The profile itself was a relic: digitised scans of handwritten forms on thick, buff-coloured paper, the ink slightly faded. Section 2B: *Values Guiding Significant Decisions* included phrases like "duty to future generations," "rational assessment over immediate comfort," and "avoidance of pointless suffering, defined as suffering without prospect of improvement or purpose." Section 4C: *Aversions* listed "loss of intellectual autonomy," "dependency without reciprocity," and "capitulation to short-term fear." Standard boxes ticked for moderate risk tolerance and high valuation of professional contribution. It was thorough, earnest, the product of a capable mind at mid-life, contemplating mortality and legacy. She’d designed flood barriers for the century after next, Sharma recalled. Argued for them in town halls against sceptics who couldn’t see past the next election cycle. A woman used to acting for futures she wouldn’t see.

  The injury was a fall, eighteen months ago. A subdural haematoma, evacuated, but leaving damage. The clinical assessment described fluctuating capacity. On good days, Ilse Rennick was sharp, articulate, fiercely opposed to the proposed cardiac intervention. On bad days, she was vacant, unresponsive, a silent presence in the nursing home bed. Today was likely a bad day; the home’s morning update had noted ‘minimal engagement’. The intervention – a complex valve replacement with a gruelling recovery – was recommended. It offered a probable extension of life, albeit with significant post-operative disability and prolonged rehabilitation. The lucid Ilse refused it absolutely. "Let it be," she’d reportedly told her cardiologist, her voice thin but firm. "Enough patching. Let it end cleanly."

  But the lucid Ilse wasn’t the one the Volitional Instruments Act required them to consult. Sharma flipped back to Section 8 of the report.

  **EXTRAPOLATION REPORT: RENNICK, ILSE MARTHA (DOB: 12/05/1990)**
  **CASE REF: VI-7742-D7/Anya Sharma**
  **DATE OF EXTRAPOLATION: 17/11/2067**

  **...**

  **8. FINDINGS & VOLITIONAL DETERMINATION:**
  8.1. Regarding the proposed cardiac intervention (detailed Annex B): Extrapolated volition converges stably on AUTHORISATION.
  8.2. Convergence achieved under parameters: Knowledge State = Professional Equivalent (Grade 7 Hydrology & Civil Engineering); Cognitive Processing Speed = 95th Percentile (Age-Adjusted Cohort); Temperament Modulation = Baseline Profile Adjusted for Coherence (Annex C.3).
  8.3. Observed refusal behaviour by the subject in her current state is consistent with Model Prediction for "Impaired State" (see Annex C.4: Fear/Exhaustion/Information-Deficient Subroutine). High confidence (p<0.01) that refusal is artefact of impairment, not core volition.
  8.4. Cohort Convergence: Volitional convergence was achieved *only* when extrapolated against the designated Reference Cohort (Cohort ID: TH-1990-2010-FE). Key convergence factors identified within cohort dynamics: shared valuation of perseverance through adversity (Cohort Trait 87.2), high weighting on probabilistic long-term benefit (Cohort Trait 12.4), and aversion to 'premature capitulation' (Cohort Trait 55.1).
  8.5. Guidance Clause Application: No stable divergent attractors identified under primary cohort parameters. Single convergence point observed. Guidance Clause 7(b) not invoked.
  8.6. DETERMINATION: Intervention AUTHORISED under Section 5(1)(a) of the Volitional Instruments Act 2031.

  **ANNEX D: MINORITY NOTE (Submitted by Extrapolator Trainee Aris Thorne)**
  D.1. Respectfully note that convergence under Section 8.4 is critically dependent on cohort selection.
  D.2. Single-subject extrapolation (without TH-1990-2010-FE cohort) yields no stable convergence on authorisation or refusal. Multiple low-stability attractors observed (see Fig D.1).
  D.3. Cohort TH-1990-2010-FE ("Thames Estuary Professionals, Formative Era 1990-2010") selection, while procedurally valid, represents a specific interpretation of 'salient life experiences' under the Act. Alternative cohorts (e.g., narrower professional subset, geographically broader set) were not modelled.
  D.4. The knowledge state parameter (Professional Equivalent Grade 7) inherently biases towards valuation of technical solutions and probabilistic reasoning, potentially marginalising non-instrumental values (e.g., peace, acceptance) which feature in the base profile.
  D.5. The finding in Section 8.3, while statistically robust, cannot empirically distinguish between refusal as 'impairment artefact' and refusal as a coherent expression of values *under* impairment – a state the base profile did not model.
  D.6. This note does not contest the statistical validity of the primary finding under the chosen parameters, but highlights the determinative role of unchallenged parametric choices (cohort scope, knowledge state level) in achieving volitional convergence.

  Sharma reread Thorne’s note. Precise. Awkward. Correct. The TH-1990-2010-FE cohort – 500-odd engineers, scientists, planners who’d worked the Estuary during Ilse’s key career years. Decent people, statistically speaking. Valuing resilience, planning, long odds. *Their* hypothetical, enlightened selves, extrapolated together, nudged Ilse’s hypothetical, enlightened self towards saying ‘yes’. Take the cohort away, let Ilse’s volition extrapolate in isolation with all that enhanced knowledge and clarity? The model sputtered. Became… noisy. Unsettled. Ambivalent. The Act required convergence. The cohort provided it. Who decided *that* cohort? Standard procedure. A tick-box exercise based on her employment records and postcode history. No tribunal argued the metaphysics of cohort selection. It was administration, not philosophy. Thorne saw the seam where the machinery joined. He wasn’t wrong. He just hadn’t learned when *not* to point it out.

  The phone buzzed. Her assistant. “Dr. Sharma? The Tribunal registrar. They’ve moved Rennick up. Hearing starts in twenty minutes, Booth 3.”

  “Thank you, Mei.” Sharma closed the dossier. Time to defend the ghost of Ilse Rennick against the flesh-and-blood woman.

  ---

  **TRANSCRIPT EXCERPT: VOLITIONAL INSTRUMENTS TRIBUNAL (HEARING VI-7742-D7)**
  **PRESIDING: Tribunal Officer J. Khan**
  **ATTENDANCE: Dr. A. Sharma (Accredited Extrapolator), Ms. P. Evans (Subject’s Advocate), Dr. L. Chen (Clinical Assessor)**

  **...**

  **OFFICER KHAN:** Dr. Sharma, the Subject’s Advocate challenges the validity of the convergence, specifically its dependence on cohort extrapolation. She argues that without this cohort, the extrapolation doesn’t converge on authorisation. Annex D supports this. Does the primary finding stand without the cohort parameter?

  **DR. SHARMA:** Officer Khan, volitional extrapolation under the Act is inherently relational. The standing assumption is that coherent volition emerges *through* interaction with the reference group – the shared context, the implicit dialogue of values. Single-subject extrapolation lacks that stabilising framework. It’s… indeterminate. The cohort isn’t an add-on; it’s integral to the methodology. Annex D demonstrates the methodology working as designed, highlighting the necessity of the relational context for convergence.

  **MS. EVANS:** With respect, Officer, the ‘necessity’ Dr. Sharma cites is precisely the problem. My client, when lucid, refuses. The report overrides that refusal based on what she *would* say if she were smarter, calmer, and surrounded by hypothetical versions of her colleagues. The report itself admits that alone, smarter and calmer, she might not say yes at all! The cohort choice predetermined the outcome. Who spoke for Ilse Rennick in selecting Cohort TH-1990-2010-FE? A clerk? An algorithm?

  **DR. SHARMA:** Cohort selection follows strict procedural protocols based on the subject’s documented life history – profession, geographical location during formative years, significant affiliations. It’s objective. TH-1990-2010-FE is the statistically validated cohort matching Ms. Rennick’s profile parameters. We extrapolate the person *in* their world, not in a vacuum. Her profile reflects the values formed *within* that cohort context. Her aversion to ‘capitulation’… her sense of duty… these resonate strongly with the cohort traits. The convergence isn’t artificial; it’s coherent.

  **MS. EVANS:** But it silences her *now*. The frightened, tired woman in the bed *is* Ilse Rennick too. The report dismisses her refusal as an ‘artefact’. Doesn’t the Act require us to give weight to her current expressions where possible?

  **DR. SHARMA:** The Act instructs us to ascertain the subject’s volition based on their lodged profile, extrapolated to the unforeseen circumstance. Her current state is acknowledged as impaired. The model accounts for that impairment and filters its distorting effect. What remains is the core volition. The refusal *is* given weight – it’s modelled, analysed, and found consistent with the predicted output of impairment, not core values. The extrapolation accounts for fear and fatigue specifically. It’s factored in.

  **OFFICER KHAN:** Dr. Chen, your assessment of current capacity fluctuation?

  **DR. CHEN:** It remains highly variable, Officer Khan. On high-functioning days, she clearly refuses. On low-functioning days, she lacks capacity for any medical decision. There is no stable ‘current’ position with capacity that aligns with or contradicts the extrapolated volition across time. The impairment is the barrier.

  **(Transcript Excerpt Ends)**

  ---

  The hearing lasted another hour. Evans fought hard, passionately. She spoke of Ilse’s palpable weariness, her desire for peace, the burden of another painful battle. Sharma presented the model’s elegance, its statistical rigour, the profile’s clear voice valuing perseverance and probabilistic benefit. Khan listened, asked sharp questions, and reserved judgement. Standard outcome: the Tribunal almost always upheld the extrapolation report unless procedural error was proven. Evans hadn’t proven error. Only doubt.

  Back in her office, Sharma filled the electric kettle at the small sink. The click of the switch, the low rumble starting, the faint plume of steam – mundane anchors. She watched the water shudder, then boil, a contained fury. She pictured Ilse Rennick. Not the profile, not the model’s output. The woman. Frail hand gripping the bedrail during a rare lucid moment Dr. Chen had described. Eyes sharp, frightened, defiant. *"Let it be."* Was that the fear-artefact, the sub-routine misfiring? Or was it the final, hard-won coherence of a woman who’d spent a lifetime building walls against the future and now saw the flood for what it was? The Act didn’t care about the distinction. It cared about convergence. The cohort provided it. The kettle clicked off.

  Sharma made tea. Properly this time. Loose leaves in a pot. The ritual: warming the pot, measuring the leaves, the first fragrant steam. She poured, watching the amber liquid darken. It was just tea. It wouldn’t change the report. It wouldn’t change the fact that Ilse Rennick’s hypothetical, enlightened self, chatting with hypothetical, enlightened versions of her old Estuary colleagues about probabilities and perseverance, had voted ‘yes’. While the real Ilse, when she could speak, said ‘no’.

  She carried the cup back to her desk. The dossier lay where she’d left it. Section 8. The Determination line: **AUTHORISED**. Below it, the space for her signature. Her pen, a heavy, brass-bodied thing, a gift when she’d qualified, felt cold in her hand.

  She thought of Thorne’s note. *Unchallenged parametric choices.* The cohort. The knowledge state. The convergence threshold. All within guidelines. All… administrative. She thought of the rain, still falling outside. Ilse Rennick designing barriers against storms decades hence. What storms had she seen coming for herself?

  Dr. Anya Sharma unscrewed the cap of her pen. The nib touched the smooth, expensive paper beside her printed name. For a second, it hovered. Then she signed. A clean, decisive line. A. Sharma. Accredited Extrapolator. It was her job. The machinery was working. The rain streaked the window, blurring the world outside.
