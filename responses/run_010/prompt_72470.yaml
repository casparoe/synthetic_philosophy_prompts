answer: |-
  Below are the desiderata for a criterion of **mechanism identity** across model checkpoints, designed to underpin a safety monitor for detecting mechanism substitution. Each requirement is derived from the problem setting and the three specified situations. Requirements are categorized as **non-negotiable** (essential for core functionality), **negotiable** (context-dependent tradeoffs), or **prejudice** (reflects philosophical/technical biases). Key tensions and tradeoffs are explicitly addressed.

  ---

  ### **Desiderata for Mechanism Identity Criterion**

  1. **Level of Individuation**  
     - **Requirement**: Mechanisms must be individuated at a **functional-algorithmic level**, defined by the causal structure and computational roles of features/pathways (e.g., "feature X computes function Y, leading to output Z"). The criterion must **pick a fixed level** (not level-relative) aligned with the reference mechanistic account.  
     - **Motivation**: Situation 2 (upstream feature source change) demands sensitivity to internal causal differences, not just input-output behavior. Distributed/polysemantic features (e.g., superposition) preclude neuron-level identity.  
     - **Status**: **Non-negotiable**. Without a fixed functional-algorithmic level, the criterion cannot reliably detect substitutions like situation 2 or handle superposition.  

  2. **Invariance to Irrelevant Symmetries**  
     - **Requirement**: The criterion must be invariant to symmetries (e.g., neuron reordering, scaling transformations) that preserve computational equivalence.  
     - **Motivation**: Neuron renumbering or trivial reparameterizations should not register as mechanism change.  
     - **Status**: **Non-negotiable**. Failure here renders the criterion practically useless.  

  3. **Robustness to Distributed Realization**  
     - **Requirement**: The criterion must identify mechanisms even when features are polysemantic, distributed, or superposed, with no neuron-to-neuron mapping between checkpoints.  
     - **Motivation**: Modern models inherently use distributed representations; the reference pathway may span many neurons with no clear isomorphism.  
     - **Status**: **Non-negotiable**. Otherwise, the criterion fails on real-world models.  

  4. **Handling Redundancy/Degeneracy**  
     - **Requirement**: The criterion must distinguish between (a) the reference mechanism persisting alongside new pathways and (b) its total replacement. Identity does not require exclusivity.  
     - **Motivation**: Situation 1 (reference pathway present but redundant) requires detecting the original mechanism’s presence even if unused.  
     - **Status**: **Non-negotiable**. Otherwise, situation 1 yields false negatives.  

  5. **Diachronic Identity Through Continuous Change**  
     - **Requirement**: The criterion must provide a **graded measure** of identity (e.g., 0–1 similarity score) that decays continuously with weight/activation drift. It **cannot** assume transitivity.  
     - **Motivation**: Situation 3 (monotonic decay) lacks step-changes; binary thresholds fail. Weight continuity does not imply mechanism continuity.  
     - **Status**: **Non-negotiable**. A binary criterion is untenable for gradual training drift.  

  6. **Distribution-Relativity**  
     - **Requirement**: Mechanism identity must be relativized to a **specific input distribution** (e.g., the deployment context).  
     - **Motivation**: Subnetworks may implement different behaviors under different distributions; identity is distribution-dependent.  
     - **Status**: **Non-negotiable**. Otherwise, evaluations are underspecified and unreliable.  

  7. **Dissociation of Mechanism and Behavior**  
     - **Requirement**: The criterion must decouple mechanism identity from behavioral output:  
       - Same mechanism → Different behavior: **Allowed** (e.g., if downstream layers change).  
       - Same behavior → Different mechanism: **Treated as substitution** (monitor’s target).  
     - **Motivation**: The monitor cares when behavior is produced by a non-reference mechanism, even if outputs match.  
     - **Status**: **Non-negotiable**. Core to the monitor’s purpose.  

  8. **Operationalizability Under Constraints**  
     - **Requirement**: The criterion must be evaluable with bounded forward passes, weight access, and no full interpretability of new checkpoints. It cannot require reconstructing the new model’s internals from scratch.  
     - **Motivation**: Budget and access constraints preclude expensive analysis or solved interpretability.  
     - **Status**: **Non-negotiable**. Otherwise, the monitor is infeasible.  

  9. **Formal Properties**  
     - **Requirement**: The relation need not be an equivalence relation. A graded score can be **non-transitive** (due to situation 3), and symmetry is unnecessary (reference is fixed).  
     - **Motivation**: Continuous decay breaks transitivity; symmetry is irrelevant (checkpoints are sequential).  
     - **Status**: **Negotiable**. Strict equivalence simplifies theory but is unrealistic.  

  10. **Borderline Cases and Graded Scores**  
      - **Requirement**: The criterion must output a graded score (not binary). Scores must be **comparable across checkpoints** for the same mechanism, but **not across different mechanisms**.  
      - **Motivation**: Situation 3 requires tracking decay over time; cross-mechanism comparisons lack scaling.  
      - **Status**: **Non-negotiable**. Binary verdicts cannot handle continuous drift.  

  ---

  ### **Key Tensions and Tradeoffs**
  - **Fundamental Tension**:  
    - **Loose vs. Tight Criterion**:  
      - A criterion *loose* enough to ignore retraining drift (minor weight changes) will miss subtle substitutions (e.g., situation 2).  
      - A criterion *tight* enough to catch real substitutions (e.g., situation 1) will flag ordinary drift (situation 3).  
    - **Resolution**: This is **not solvable by engineering alone**. The monitor must **concede to false positives** (err toward flagging drift) for safety, using the graded score to set thresholds based on risk tolerance. A perfect balance is impossible; gradual changes inherently blur mechanism identity.  

  - **Conflicting Subset**:  
    - **Robustness to distributed realization** (Requirement 3) and **operationalizability** (Requirement 8) conflict with **handling subtle substitutions** (e.g., situation 2). Distributed features require expensive analysis to track; budget constraints may force approximations that miss upstream changes.  
    - **Verdict**: Requirement 8 (**operationalizability**) is the primary constraint. If feasibility forces compromises, detectability of situation 2 may be limited.  

  - **Most Exclusionary Requirement**:  
    - **Requirement 8 (operationalizability)** does the most to exclude candidate accounts. Methods requiring full interpretability (e.g., reconstructing the new model’s circuits) are immediately invalid.  

  ---

  ### **Evaluation of Candidate Accounts**
  1. **Causal-Intervention Equivalence**  
     - *Approach*: Mechanisms are identical if interventions (e.g., ablation, patching) on the pathway yield statistically equivalent effects on outputs.  
     - **Fares Well**: Handles distributed features (Requirement 3), distribution-relativity (6), and dissociation (7). Operationalizable via targeted interventions (8).  
     - **Fares Poorly**: Struggles with graded identity (5) and continuous drift (output effects may decay smoothly). May miss internal changes if outputs are stable (situation 2).  

  2. **Algorithmic-Level Individuation**  
     - *Approach*: Mechanisms are identical if they implement the same algorithm (e.g., feature transformations).  
     - **Fares Well**: Matches the functional level (1), handles invariance (2), and dissociates behavior (7).  
     - **Fares Poorly**: Fails operationalizability (8) without interpretability tools. Ambiguous with redundancy (4) and distributed features (3).  

  3. **Representational/Geometric Similarity**  
     - *Approach*: Mechanisms are identical if internal states (e.g., activations) are geometrically similar (e.g., CKA, CCA).  
     - **Fares Well**: Handles symmetries (2) and provides graded scores (5, 10). Operationalizable with forward passes (8).  
     - **Fares Poorly**: May conflate distinct mechanisms with similar activations (violates 7) and misses causal changes (situation 2). Distribution-dependent (6) but not causal.  

  4. **Dynamical System (Vector Field Equivalence)**  
     - *Approach*: Mechanisms are identical if the local vector field (dynamics of activations) is equivalent up to coordinate changes.  
     - **Fares Well**: Naturally handles symmetries (2), continuous drift (5), and superposition (3).  
     - **Fares Poorly**: Computationally expensive (violates 8). Overly abstract; may ignore behavior-relevant causal structure (1, 7).  

  ---

  ### **Summary**  
  A viable criterion must:  
  - Be **functional-algorithmic**, **distribution-relative**, and **graded**.  
  - Prioritize **operationalizability** and **robustness to distributed features** at the cost of perfect sensitivity to subtle changes.  
  - Accept that **drift vs. substitution is a policy tradeoff**, not an engineering problem.  

  Causal-intervention methods are the strongest candidates but require extensions for gradual drift (e.g., integrating gradient-based measures). Geometric approaches are feasible fallbacks but risk false negatives. The tension between operationalizability and precision is unavoidable; concessions to feasibility are necessary.
