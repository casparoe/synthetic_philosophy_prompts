  The dialogue will avoid theory names (processual/interpretivist) unless naturally mentioned, keeping focus on evidence. Stage directions will be minimal - just enough to set the scene while meeting the word count.
answer: |-
  ## Recovered Dialogue: Marta & Dev Debate the Floor Deposit

  *(The seminar room is emptying except for Marta and Dev, still leaning over printouts of the case study. Coffee cups abandoned, pens tapping.)*

  **Marta:** Okay, Dev, hit me with why this *isn’t* proto-writing. Sixty-one distinct little clay cones, mostly unique but a dozen repeats? Under the floor, with a broken jar and a butchered sheep bone? That screams *record-keeping* to me. Like Schmandt-Besserat’s tokens, but maybe simpler, household-level – tracking jars of grain, sheep owed... something.

  **Dev:** Whoa, hold on. Schmandt-Besserat’s tokens are *way* later, found in administrative contexts over a huge area. Here? We’ve got one weird deposit, no parallels within 200 km, under a house floor *with ash* and a deliberately broken jar. Plus the scapula. That’s foundation deposit 101. You’re projecting accounting onto what’s clearly a ritual act. The *meaning* of the marks is opaque – they were significant *to them*, not necessarily numerical to us.

  **Marta:** Opacity isn’t an argument, Dev, it’s a surrender. Why assume it’s *totally* unrecoverable? The repetition matters! If all marks were unique, fine, pure symbolism. But twelve repeats? That suggests *differentiation*, maybe quantification. And don’t ignore the *jar rims*. Crude versions of *some* of these same marks, on storage jars, in domestic trash! That links them directly to everyday household goods. How does your ritual deposit explain *that*?

  **Dev:** Easily! Maybe the marks *originated* as household marks – ownership, contents, whatever. Then, for the foundation ritual, they made special, elaborate versions of a whole bunch of them, bundled them together symbolically with the jar (breaking it for closure?) and the scapula (sacrifice/offering?), sealed it under the floor. The ash seals the ritual act. The house stays occupied because the ritual *worked*. The smaller deposits under other houses? Different phases, maybe less elaborate rituals, or for different purposes – beads for protection, points for hunting luck? Point is, the *context* – under floor, deliberate deposit with specific associated items (jar, bone, ash), uniqueness – screams ritual intent, not filing cabinet.

  **Marta:** But what *is* the ritual intent, Dev? You say "foundation deposit," but what does that *mean* beyond labeling it? You’ve admitted the marks might have had prior domestic meaning. If the ritual reused domestic symbols, maybe the ritual *itself* was about domestic concerns – securing the household’s *wealth*, its stores, its flocks. That’s not worlds apart from my record-keeping idea; it’s just a different use of the symbols. Your reading risks being circular: it’s ritual because it’s under the floor with special stuff, and the special stuff is special because it’s in a ritual deposit.

  **Dev:** Okay, fair push. But your record-keeping idea has holes too. Sixty-one objects? That’s a lot for a small household tally. Why are they all together? Why buried? If it’s a running tally, wouldn’t we expect *additions* over time, not one big deposit? Why no wear on them? And the refittable jar – if it’s just a container, why bother breaking it only to have it refit? That feels... performative. Ritual. Whereas your system seems to require them being used, handled, updated – not sealed away.

  **Marta:** Maybe it *was* an update! A periodic consolidation? Or maybe the broken jar *was* the container, and breaking it signified closing the record for that period? Or... okay, let’s consider mundane. Could they be gaming pieces? But sixty-one, with unique marks? Seems excessive. A craft tally? Like, counting threads or beads made? But why the variety? Why bury it under the floor? A loom weight kit? Wrong shape and size. A cache of raw clay blanks? But they’re fired and incised. See? The mundane alternatives don’t fit well either. The mark repetition and the link to jar labelling is the strongest thread.

  **Dev:** I’ll give you the jar rims are intriguing. But "crude versions" – that could just mean the marks were a common decorative motif or simple ownership mark that got fancied up for the ritual. It doesn’t *force* a numerical interpretation. And the repetition? Twelve doubles in sixty-one – it’s not a strong pattern. Could be coincidence, family marks, different makers' marks bundled together. Without *more* repetition or a clear system, it’s weak. You’re hanging everything on one analogy to much later, different tokens.

  **Marta:** That’s not entirely fair. It’s not *one* analogy. It’s the combination: distinct objects, repeated marks implying classes, association with a broken storage jar and a food animal bone (potential commodities), *and* the jar-rim evidence linking similar marks directly to storage. It’s... braiding. Braiding weak strands into something stronger. No single line is conclusive, but together – distinct objects + repetition + storage context (jar, bone) + domestic parallels – it points towards some system of differentiation related to household goods. Not necessarily full writing, but systematization.

  **Dev:** Braiding, huh? Okay, I see the appeal. But I think you’re braiding straw. Where’s the *independent* evidence for numeracy here? Where’s the context *outside* this one pit that suggests record-keeping? The two other house deposits are totally different – beads and points, no marks, no jar, no ash. That reinforces the uniqueness and likely ritual nature of *this* deposit. My braid: unique deposit type + deliberate placement under floor + associated symbolic acts (breaking jar, scapula?, ash) + parallels to known ritual deposits elsewhere (even if not identical locally) + the house continuing in use (ritual success). My strands point to ritual performance, meaning inherent in the act itself, not necessarily recoverable *content*.

  **Marta:** But "meaning inherent in the act" feels like a dodge. If the content is unrecoverable, how is "ritual" any more specific than "symbolic"? It becomes a catch-all. What would falsify your ritual interpretation? If we found identical deposits in rubbish heaps? You’d probably just call them votive deposits. It feels unfalsifiable.

  **Dev:** Touché. But equally, what falsifies *your* record-keeping? If we found deposits with *no* repetition? You’d say it’s symbolic proto-writing. If we found them *only* in graves? You’d say grave goods accounting. Your analogy is so broad it absorbs counter-evidence too. My falsification? Finding clear evidence these marks were used *only* in mundane, non-symbolic contexts *everywhere* else, with absolutely no patterning suggesting system. Or finding identical deposits under non-structural features, like in the middle of a field. Context *is* king.

  **Marta:** For me? Finding out the marks on the jar rims have absolutely no overlap with the clay objects would hurt. Or finding that the "repeats" are actually just random scratches, not deliberate, repeated symbols. Or finding wear patterns suggesting they were sewn onto clothing or used as spindle whorls – anything contradicting handling as tokens. But okay, stalemate on theory. What do we *do*? What tells us more?

  **Dev:** Exactly. Fieldwork. We re-examine the *exact* context. That thin lens of ash – get micromorphology done. Is it hearth ash? Purification burning? Just swept-up debris? We look for micro-residues *on the clay objects* – animal fat? Grain? Pigment? Anything hinting at use or storage. Zooarch re-examines that scapula – not just 'cut marks', but *what kind*? Butchery for meat? Ritual scoring? Conservator checks the refitted jar – any trace contents? Residue inside? Any sign the break was deliberate *and* ancient? And crucially, we map *every single* jar-rim mark across the site. Do they cluster? Do specific marks correlate with house locations or feature types? Are they *really* similar to the clay objects, or just vaguely geometric?

  **Marta:** Agreed on all that. I’d add: meticulous study of the marks themselves. Not just visually, but 3D scanning. Are the repeats truly identical? Are there subtle groupings beyond the obvious doubles? Any evidence of erasure or modification? And we *need* to prioritize finding more of these deposits – or even single objects – in clear *domestic* contexts, not just under floors. Maybe sieving the general house fill near where the jar rims were found. If we found a single incised cone in a cooking pit... that changes things.

  **Dev:** And if we found another large cache, identical, but *outside*, near a field boundary? That sinks your household accounting and leans ritual/offering. My settling point? Finding a systematic pattern in the marks across multiple deposits – like true numerical repetition, or a limited set used combinatorially. Then I’d have to concede it’s more than just symbolic ritual clutter. Yours?

  **Marta:** Finding identical deposits, complete with jar, bone, and ash, *under* non-domestic structures – a shrine, a communal building. Or finding clear evidence the marks were purely decorative motifs copied onto pottery without any referential meaning. That would gut the ‘system’ argument. But until then... I’m digging for jar rims. You’re dissecting ash.

  **Dev:** (Gathering his papers) Deal. See you at the lab. Try not to count the tiles on the way out.

  **Marta:** (Smirking) Only if they’re incised and under the floor, Dev. Only then.

  *(They head out, the unresolved tension hanging like excavation dust, focused now on the next spadeful of evidence.)*
