prompt: |-
  I'm maybe 200 pages into a novel and I've hit a wall that I think is really a vocabulary problem, so I'm going to ask you something a little odd.

  Some setup. One of my characters grew up somewhere where an insult to your name is an actual injury — you're expected to answer it, or you lose something real — and she's now a professor in a city that runs on the opposite rule: you have a worth that's yours regardless of what anyone says, so you don't answer slights, you shrug, you get on with it. I've been reading the sociology that lays out those two plus a newer third one, the one where people do feel the slight keenly but can't or won't handle it themselves, so they carry it to a third party. All very useful. But the thing I actually need a word for cuts accross that scheme, and I can't find it in there.

  Here's the pattern. Two scenes from the book. Scene one: a big name at a conference makes a joke about my character's accent in front of a full room. She lets it go — correctly, by her culture's lights. Nothing happens. Her standing is exactly where it was, because it was high to begin with; the joke gets absorbed and forgotten. Scene two: an adjunct, same joke, same room. She also lets it go. Her standing drops — not much, but it drops, and the not-answering is read by the room as confirming the joke. Later she mentions it to someone senior and gets the same advice the first woman got, delivered with real warmth: it says nothing about you.

  So: a rule that tells people not to defend their own standing. For the person who already has standing, following it costs nothing and is genuinely the right advice — she isn't a hypocrite, she's right about her own case. For the person who doesn't, following it costs something, and the culture has no way of seeing that the two of them are being handed the same instruction at very different prices. The price gap stays invisible because the rule is stated as a claim about everyone's inner worth, which is universal, rather than as a claim about social position, which isnt.

  Is there a name for this? And I mean the specific shape of it, not the general fact that norms have unequal costs — I know that's true of nearly any norm and I'm not looking to be told that. What I'm after is the thing where a norm's forbearance clause (don't defend yourself here, it's beneath you) is affordable only to the people the norm was written around, and where the norm's own universalist justification is exactly what keeps the differential from showing up.

  I've got some half-remembered words floating around — privilege, respectability, something about recognition, something about social death — and none of them are it, though I suspect a couple are neighbors. So tell me what the nearest established concepts are, and for each one, what precisely makes my thing different. I especially want to know how it's separate from (a) plain hypocrisy about who has to be gracious, (b) any view holding that dignity needs material or social preconditions before it can be exercised, and (c) the flat observation that low-status people simply receive more insults, no further mechanism required. And if it doesn't have a name, coin me one and give me the definition plus the boundary cases: what counts, what looks like it but doesn't, where the edges sit. Ideas, not a book list — I'll find the books myself once I know what I'm hunting. I have to write these two scenes and I need to know which one I'm actually writing.
reasoning: |-
  Okay, the user is writing a novel and has hit a vocabulary wall. They need a term for a specific social dynamic where a norm of forbearance (not responding to slights) has unequal costs based on status. Let me unpack their query.

  They describe two scenes: a high-status professor ignores an insult with no consequence, while an adjunct does the same but loses standing. The norm is presented as universal—everyone has inherent worth—but in practice, only those with established status can afford to follow it without cost. The user wants a name for this exact mechanism, not just general inequality in norms.

  First, I need to differentiate this from related concepts they mentioned. Privilege is broader; hypocrisy is about intent; social death is more extreme. The key here is the norm's universalist justification masking the differential cost. Bourdieu's "social gravity" comes to mind—the idea that status dictates whether restraint is seen as strength or weakness.

  The core is performative vs. structural dignity. High-status individuals have structural dignity (institutional backing), so their forbearance reinforces their position. Low-status individuals lack this, so non-response is read as confirmation of the insult. The universalist language of inherent worth obscures this disparity.

  I should check if existing terms fit. "Performative dignity" is close, but might not capture the structural aspect. Bourdieu's "habitus" and "symbolic capital" are relevant but too academic for their needs. Maybe "dignity differential" or "asymmetric forbearance" as coined terms.

  Boundary cases: If the low-status person responds and fails, it's different—here, the cost comes from following the norm. Also, if the insult is overtly bigoted, the dynamic changes; this relies on plausible deniability (like an accent joke).

  The user needs clarity for their scenes, so the term must highlight the invisibility of the cost gap due to the universalist framing. They’ll use this to inform character reactions and cultural tensions in their novel. Ensuring the term is actionable for their writing is key.
answer: |-
  What you're describing is **asymmetric performative dignity**, and it doesn't have one single perfect term, but its core mechanism is well-recognized in sociology and critical theory. The *nearest established concepts* and why your *specific shape* is distinct are:

  1.  **Cultural Capital (Bourdieu):** *Nearest neighbor.* High-status professor has ample cultural capital (credentials, reputation, network). Her forbearance *confirms* her capital – she doesn't *need* to respond; her position is secure. The adjunct lacks this capital. Her forbearance is read as *lack* of capital – she *can't* respond effectively, confirming the insult. **Difference:** Your focus is on the *normative instruction itself* ("don't respond, it's beneath you") being applied universally but *functioning* asymmetrically *because* of the underlying capital differential. Bourdieu provides the *fuel* (capital), but your mechanism is the *engine* (the norm's performance).

  2.  **The Right to be Ignored / Unaccountability (Goffman / Butler):** High-status individuals often possess an unspoken "right" to have minor transgressions or awkward moments ignored or reinterpreted favorably ("eccentricity"). Low-status individuals are held more accountable and scrutinized; their actions (or lack thereof) are interpreted through a lens of deficiency. **Difference:** You're zeroing in on the *specific norm of non-response* to insults and how its *cost* varies invisibly due to this unaccountability gradient. The norm *prescribes* non-response, masking the pre-existing difference in the *right* to non-response.

  3.  **Performativity of Dignity (Butler-esque):** Dignity isn't just inherent; it's constantly *performed* and *recognized* (or not) in social interactions. The norm dictates a specific performance (forbearance). For the high-status person, this performance *succeeds* – it reinforces her dignity because the audience already recognizes it. For the low-status person, the *same performance fails* – the audience doesn't grant the recognition, interpreting silence as weakness or confirmation. **Difference:** Your mechanism hinges on the *identical prescribed performance* having diametrically opposed social effects based on pre-existing recognition, cloaked by the universalist justification ("inherent worth").

  4.  **Symbolic Violence (Bourdieu):** *The insult itself is symbolic violence.* The norm of non-response becomes a tool *enabling* this violence against the low-status person, while shielding the high-status person. The adjunct's drop in standing *is* the successful enactment of symbolic violence facilitated by her adherence to the norm. **Difference:** You're highlighting how adherence to the *specific norm* ("don't defend yourself") is the *mechanism* that *allows* the symbolic violence to land effectively only on the low-status target. The norm isn't just neutral; it's an active component of the violence in the low-status case.

  **Why Your Specific Shape is Distinct:**

  *   **From (a) Plain Hypocrisy:** It's not simply that the high-status person gives advice they wouldn't follow if low-status (though that *might* be present). Crucially, the high-status person *genuinely follows the same norm successfully in their own case* and believes it universally applicable ("it says nothing about you"). The hypocrisy is often *systemic and invisible*, embedded in the differential effect of the norm itself, not necessarily individual bad faith. The norm *works* for her, so her advice is sincere.
  *   **From (b) Dignity Needs Preconditions:** You're not arguing dignity is impossible without status (though that's adjacent). You're showing how a *specific, universally prescribed performance* of dignity (forbearance) *requires* unspoken preconditions (existing status/recognition) to *succeed* as a performance *and avoid cost*. The cost comes from *performing the norm correctly* when lacking the preconditions.
  *   **From (c) More Insults for Low-Status:** Yes, the adjunct gets more insults. But your mechanism shows that *even when receiving the same insult* and *following the same prescribed response*, the *outcome* differs radically because the social interpretation of that identical response hinges entirely on pre-existing status. The norm itself is the vector for amplifying the cost differential on the low-status person in that moment.

  **The Coined Term & Definition:**

  **Term: Asymmetric Performative Dignity Burden (APDB)**

  *   **Definition:** The unequal social cost incurred by individuals of differing status when adhering to a universally prescribed norm of dignified forbearance (non-response to slights), arising because the norm's successful performance (and consequent maintenance or enhancement of standing) implicitly requires a baseline level of pre-existing social recognition and capital that low-status individuals lack. This asymmetry is masked by the norm's universalist justification (e.g., inherent worth), which attributes failure to perform effectively solely to the individual, obscuring the structural prerequisites for the performance's success.
  *   **Core Mechanism:** Identical performance + Identical norm + Differential pre-existing recognition/capital = Radically different social outcomes (reinforcement vs. diminishment of standing). The universalist justification renders the prerequisite capital requirement invisible.

  **Boundary Cases:**

  *   **What Counts:**
      *   Situations where the norm prescribes passive non-response or minimal response ("rise above it," "don't dignify that with a response," "it says nothing about you").
      *   Slights with plausible deniability (like the accent joke), where overt challenge is risky or difficult.
      *   Contexts where standing is fluid and reputation-based (academia, certain professional settings, some social circles).
  *   **What Looks Like It But Isn't:**
      *   **Overt Bigotry:** If the slight is unambiguous and severe (a racial slur), the norm of forbearance often collapses or is overridden even for high-status individuals, or the cost of response is universally high. APDB thrives on ambiguity.
      *   **Explicitly Differentiated Norms:** If the culture *explicitly* says "Tenured professors can ignore it, but adjuncts must protest," that's just overt hierarchy, not APDB's masked asymmetry via universal rule.
      *   **Failed Performance by High-Status:** If the high-status person *does* respond poorly and loses standing, that's just a failed performance, not APDB. APDB requires the *successful* performance by the high-status actor under the norm.
      *   **Low-Status Person Successfully Responds:** If the adjunct crafts a brilliant retort that gains her respect, this demonstrates the *alternative path* and highlights the *cost* of following the forbearance norm when low-status. It contrasts with, but doesn't negate, the APDB dynamic when she *does* follow it.
  *   **Where the Edges Sit:**
      *   **Degree of Status Difference:** The effect is strongest with large differentials (Tenured Star vs. Unknown Adjunct). It blurs when status is more equal or ambiguous.
      *   **Clarity of the Slight:** Very ambiguous jabs might not trigger the dynamic clearly; very clear insults might break the forbearance norm universally.
      *   **Strength of the Universalist Ethos:** In cultures where the "inherent worth" narrative is weaker or more openly contested, the asymmetry might be more visible, reducing the APDB effect.
      *   **Individual Charisma/Competence:** An exceptionally charismatic or competent low-status person *might* occasionally buck the trend, but the structural tendency remains.

  **For Your Scenes:**

  *   **Scene 1 (Professor):** You're writing the successful performance of APDB. Her forbearance *works* because she has the pre-existing capital. The norm functions as advertised *for her*.
  *   **Scene 2 (Adjunct):** You're writing the *cost* of APDB. Her identical forbearance *fails* as a performance because she lacks the capital. The room interprets it as weakness/confirmation, diminishing her standing. The senior colleague's warm advice exemplifies the *masking* function of the universalist justification – they sincerely believe "it says nothing about you" applies equally, failing to see the structural asymmetry that makes this untrue *in practice* for the adjunct. The adjunct pays a price for following the rule the high-status person benefits from.

  You're capturing a subtle, pervasive form of systemic inequality where the very rule meant to promote universal dignity becomes an instrument reinforcing hierarchy, precisely *because* of its universalist claim. The invisibility of the cost differential *is* the mechanism. "Asymmetric Performative Dignity Burden" captures this specific confluence of norm, performance, capital, differential cost, and obscured justification.
