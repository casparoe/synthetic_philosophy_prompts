prompt: |-
  hey, can you write me a satirical marketing one-pager plus FAQ for a made-up enterprise SaaS product — something blandly named, the kind of thing a governance consultancy would sell to corporate boards, appellate panels and hiring committees. The pitch is that it finally fixes the embarassing situation where a committee votes yes on every individual question going into a decision and then votes no on the decision itself.

  About 700 words, deadpan vendor voice throughout: a headline, a short value-prop paragraph, a bulleted feature list, an FAQ with six or eight customer questions, and a small "known issues / limitations" block at the bottom.

  The humor has to come from the aggregation theory being handled correctly, not from generic tech-bro mockery. Specifically:

  - the feature list should quietly expose the choice between tallying the votes on the reasons and tallying the vote on the outcome, and treat it as a configurable setting with a factory default that nobody ever reads
  - the known issues block needs at least three entries a specialist would recognize as real results, correctly characterized but euphemized into product-speak — something about what happens when you let every member's vote count equally, something about re-ordering the questions mid-session, something about the one user account that keeps ending up decisive
  - never name a theorem, a paper, a court case, or any real person; the vendor is far too busy selling to cite anything, and I don't want made-up citations either

  For the FAQ, include a judge-ish customer who wants the collective verdict to be explainable to the side that lost, a board secretary worried the software is "making the decision for us now", and someone on the free tier asking whether they can keep both internal consistency and equal voting weight. The running joke should be that the product's headline selling point is exactly the combination the theory says you can't have, and nobody in the document ever notices. Aim it at the consultancy-sales voice as a style, not at any actual company or living person — and it should still be funny to a reader who's never heard of any of this.
reasoning: |-
  We are creating a satirical one-pager for an enterprise SaaS product that addresses the issue of committees voting "yes" on every individual question but then "no" on the overall decision. The product will be named something bland and corporate, like "ConsensusFlow" or "DecisionHarmony". Let's go with "DecisionHarmony" for now.

  The document structure:
  1. Headline
  2. Value Proposition Paragraph
  3. Bulleted Feature List (with the configurable setting for tallying votes on reasons vs. outcome, but never explicitly stating the impossibility)
  4. FAQ (6-8 questions, including the judge, board secretary, and free-tier user)
  5. Known Issues / Limitations (with three entries that subtly reflect real theoretical problems)

  The humor comes from the deadpan vendor voice and the unspoken contradiction: the product claims to solve the problem by letting the customer choose how to aggregate votes, but the known issues and FAQ hints reveal that no matter what they choose, there's a problem.

  Let's create:

  **Headline**: 
  DecisionHarmony: Resolving the Disconnect Between Deliberation and Decision

  **Value Proposition**:
  Tired of the embarrassment when your committee unanimously approves every step of a process only to reject the final outcome? DecisionHarmony eliminates this common governance hiccup by seamlessly aligning component-level approvals with holistic resolutions. Our patent-pending aggregation engine ensures that your committee's will is consistently and coherently captured, preserving both the integrity of the process and the dignity of the participants.

  **Features**:
  - **Dynamic Vote Reconciliation**: Automatically detects and resolves conflicts between component votes and final decisions in real-time.
  - **Configurable Aggregation Logic**: Choose between "Reason-Driven" (aggregating component votes to determine the outcome) and "Outcome-Driven" (starting from the outcome and working backward to ensure component consistency) methodologies. *Factory default: Reason-Driven.*
  - **Audit Trail with Narrative Generation**: Produces a comprehensive, plain-English justification report for every decision, suitable for regulators or stakeholders.
  - **Role-Based Permissions**: Control who can propose motions, amend questions, or trigger reconciliation.
  - **Cross-Platform Compatibility**: Accessible via web, mobile, and integrated directly into your existing governance platforms.

  **FAQ**:
  1. **Q**: As a judge on an appellate panel, I need to explain our rulings to the losing party. How does DecisionHarmony help?
     **A**: Our Narrative Generation feature crafts a clear, step-by-step explanation of how each component vote led to the final outcome (or vice versa, depending on your aggregation setting). It's like having a clerk distill hours of deliberation into a concise, defensible summary.

  2. **Q**: Our board secretary is concerned that this software might be "making the decision for us." How do you respond?
     **A**: DecisionHarmony is a tool to surface the collective will, not replace it. It only intervenes when component votes and the outcome vote are at odds, prompting the committee to revisit the inconsistency. The final say always rests with the committee.

  3. **Q**: We're on the free tier. Can we maintain both internal consistency and equal voting weight for every member?
     **A**: Absolutely! Our free tier supports up to 5 committee members and enforces strict equality in voting power. The aggregation engine ensures that every member's vote is counted equally in both component and outcome votes, guaranteeing a fair and consistent process.

  4. **Q**: What happens if a member changes their vote after the reconciliation process has run?
     **A**: DecisionHarmony locks votes once the reconciliation process is initiated to preserve audit integrity. If a member needs to change their vote, the chair must first undo the reconciliation, which may require restarting the process.

  5. **Q**: Can we re-order the questions during a live session?
     **A**: Yes, the chair can re-order questions at any time before the final vote. However, note that re-ordering may trigger a reconciliation if the new sequence alters the logical flow of the decision. We recommend finalizing the question sequence before voting begins.

  6. **Q**: How does the software handle abstentions?
     **A**: Abstentions are treated as non-votes and do not count toward the majority. However, in close decisions, a high number of abstentions may affect the quorum and trigger a reconciliation alert.

  7. **Q**: We have one member who always seems to be the swing vote. Does DecisionHarmony identify such patterns?
     **A**: Our analytics dashboard highlights voting patterns, including member influence. However, we maintain strict anonymity in the voting process to prevent bias. The "decisive member" phenomenon is a natural occurrence in group dynamics and not a flaw in the system.

  8. **Q**: Can we override the reconciliation result?
     **A**: The chair has the authority to accept the reconciliation, restart the voting, or manually override the result (with appropriate permissions). All overrides are logged and require a written justification.

  **Known Issues / Limitations**:
  - **Inherent Trade-off in Aggregation Methods**: Depending on the chosen methodology, achieving full consistency across all votes may occasionally require adjusting the voting weight of certain components. This is a natural characteristic of complex decision systems.
  - **Sequence Sensitivity**: Re-ordering questions mid-session may lead to temporary inconsistencies until the reconciliation process completes. We recommend avoiding mid-session re-ordering for critical decisions.
  - **Single Point of Decisiveness**: In rare cases, the reconciliation engine may identify one voter as the consistent pivot point across multiple votes. This reflects the underlying structure of the committee's preferences and is not a software error.

  The humor is subtle: 
  - The FAQ free-tier user asks for both consistency and equal voting weight, and the answer says "absolutely" when in reality it's impossible (but we don't say that). 
  - The known issues mention adjusting voting weight (which breaks equal weight) and the "single point of decisiveness" (which is the Condorcet paradox in disguise) without naming it.
  - The configurable setting has two methods, each of which has well-known flaws, and the factory default is set arbitrarily.

