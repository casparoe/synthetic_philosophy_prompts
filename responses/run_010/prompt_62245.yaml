answer: |-
  Here’s your prep sheet for the Q&A, tailored to the room’s dynamics and phrased in British English. Objections are ordered by potential damage (high to moderate), with replies designed for brevity and impact. I’ve flagged historical/legal fairness concerns in **bold** where relevant.

  ---

  ### **Objections & Replies**  
  *(Ordered by damage potential)*  

  1. **Objection (ICL Tribunal Veteran):**  
     *"You’re rewriting the Convention. The drafters deliberately excluded cultural destruction from Article II after the Saudi and Iranian objections. Your ‘functional test’ for ‘in part’ ignores* nulla poena sine lege *— you can’t stretch criminal liability through philosophy when states plainly rejected this reading in 1948."*  
     **Reply:** "I’m not rewriting, I’m reclaiming Lemkin’s underlying logic the drafters sidelined. *Nulla poena* is satisfied because the *actus reus* (physical acts) remains unchanged; I’m clarifying *mens rea* by asking what the perpetrator targets — the group’s functional backbone. The law evolves through interpretation; think of how ‘sexual violence’ was later read into ‘causing serious harm’ at the ICTY."  
     **Soft spot:** Admits the drafting history cuts against you.  

  2. **Objection (NGO Atrocity Prevention Lead):**  
     *"Splitting ‘genocide’ from political condemnation is naïve. Governments will weaponise your narrow legal definition to dismiss atrocities — ‘It’s only apartheid, not genocide!’ You’re stripping advocates of their sharpest rhetorical tool when time is critical for prevention."*  
     **Reply:** "My aim is the opposite: to give advocates *more precise* tools. Calling everything ‘genocide’ dilutes its urgency. If we had a tiered political vocabulary — say, ‘systemic erasure’ for forced assimilation — we could shame states *without* waiting for unattainable legal proof. It’s about building leverage, not surrendering it."  
     **Soft spot:** Assumes institutional buy-in for new terminology.  

  3. **Objection (Genocide Centre Historian):**  
     *"Anchoring your argument to the Convention’s text is a category error. Lemkin saw the treaty as a betrayal of his concept — hence his later work on the ‘Genocide Code’. Why chain justice to a compromised diplomatic document? Your ‘functional test’ still centres law, not the victim’s experience."*  
     **Reply:** "I share your frustration with the Convention’s limits. But law is our bluntest instrument for accountability. My functional test *is* an attempt to smuggle Lemkin’s fuller vision — the attack on pattern — back into the legal framework. Without that, we abandon courts to the narrow existence test."  
     **Soft spot:** Concedes law is inadequate for Lemkin’s full vision.  

  4. **Objection (ICL Tribunal Veteran):**  
     *"Your distinction between ‘existence’ and ‘pattern’ collapses in practice. If a group’s cultural practices are eradicated through forced assimilation, hasn’t its ‘existence’ been destroyed? The law already covers this via ‘serious bodily or mental harm’ or ‘preventing births’."*  
     **Reply:** "Not necessarily. A group may persist biologically but lose its identity — that’s the *pattern* without annihilation. Current law *can* cover assimilation, but only by stretching ‘harm’ or ‘births’ beyond recognition. My approach makes the targeting of identity structures explicit and prosecutable."  
     **Soft spot:** Forced assimilation *might* fit existing elements — but awkwardly.  

  5. **Objection (Genocide Centre Historian on Colonial Cases):**  
     *"Apply your ‘functional test’ to Canada’s residential schools or Australia’s Stolen Generations. If removing children to ‘kill the Indian in the child’ isn’t genocide under your view, doesn’t that confirm the Convention’s failure?"*  
     **Reply:** "It *is* genocide under my test. The schools targeted structures essential to group continuity: kinship, language transmission, spiritual practice. Their loss made cultural reproduction impossible — meeting the functional threshold. **But I concede:** current law likely excludes this, hence the need for reform."  
     **Soft spot:** Admits your test isn’t current law.  

  6. **Objection (Grad Student on Group Identity):**  
     *"Your theory hinges on ‘structures essential to a group’s continuation’. But if groups are defined by the perpetrator’s intent (as Krstić affirms), how do you objectively identify these ‘structures’? Isn’t this hopelessly subjective?"*  
     **Reply:** "A fair challenge. We’d look to evidence of what the perpetrator *sought to destroy* (e.g., confiscating heirloom seeds for farmers, banning matrilineal surnames) *and* empirical proof that this threatened group reproduction. Courts already assess cultural evidence — think of the ICTY considering mosque destruction."  
     **Soft spot:** Requires courts to grapple with anthropology.  

  7. **Objection (Philosopher of Language):**  
     *"You propose splitting ‘genocide’ into legal and political uses. But meaning is use. If activists keep using ‘genocide’ politically, won’t courts absorb that expanded meaning? Your two-vocabulary model seems descriptively incoherent."*  
     **Reply:** "We manage this split elsewhere. ‘Torture’ has a strict legal definition (CAT Article 1) but broader political usage. The key is institutional discipline: courts must resist popular usage. We *can* cultivate distinct meanings — it’s how ‘discrimination’ works in law versus daily speech."  
     **Soft spot:** Overlooks how politicisation *has* influenced legal thresholds (e.g., Cambodia’s ECCC).  

  8. **Objection (Genocide Centre Historian on Lemkin):**  
     *"You claim the Convention ‘dropped’ the imposition phase, but Lemkin’s later writing treated the treaty as a first step. He drafted a ‘Genocide Code’ including cultural genocide. Isn’t your ‘pattern/existence’ binary oversimplifying his dynamic view?"*  
     **Reply:** "True, Lemkin kept refining his concept. **But I must flag:** the Convention *did* abandon the ‘imposition’ phase he outlined in *Axis Rule*. My point is that this truncation created the mismatch we face today. The Code was his attempt to fix it — which failed."  
     **Soft spot:** Lemkin’s later work complicates the narrative.  

  ---

  ### **Preemptive Concessions (Deliver Early)**  
  To defuse the top objections, concede this upfront:  
  > *"I’ll state plainly: my functional test isn’t current law. The drafters did exclude cultural genocide, and forced assimilation isn’t prosecutable as genocide today. I argue it* should *be, because the law fails Lemkin’s core insight: destroying a group’s way of life is genocidal, even without mass graves. But this requires legal reform — it’s not mere interpretation."*  

  **Why it helps:** Neutralises *nulla poena* and historical critiques by admitting you’re proposing reform, not describing law.  

  ---

  ### **The Dreaded Question**  
  **Question (ICL Tribunal Veteran + Historian Tag-Team):**  
  *"If we apply your functional test consistently, wouldn’t the British suppression of Māori *tino rangatiratanga* (sovereignty) via land confiscations and language bans qualify as genocide? And if so, how do you reconcile retroactive application with international law’s non-retroactivity principle?"*  

  **Why you can’t answer it cleanly:**  
  - **Legally:** Retroactivity (*nulla poena*) would bar prosecutions, making your test symbolic for historical cases.  
  - **Politically:** Affirming this *would* be historically just but could derail your argument (you’d be accused of polemics).  
  - **Philosophically:** It exposes the tension in your proposal: if the functional test is morally right *now*, does that imply historical guilt? That’s a minefield.  

  **Honest reply (if asked):**  
  > "For historical cases, legal accountability is indeed impossible. But moral and historical reckoning isn’t. My test clarifies why such policies *were* genocidal in logic, even if not law at the time. That shapes reparations, education — the work of this centre."  

  ---

  ### **Fairness Flags on Your Sketch**  
  - **On Lemkin:** You fairly note he rejected "denationalisation". But *do not* say the treaty "dropped the imposition phase" — it deleted *cultural* genocide. Lemkin saw the final text as flawed but salvageable. (Safer: "The Convention narrowed Lemkin’s concept, severing pattern-destruction from existence-destruction.")  
  - **On Case Law:** You’re right that "in part" lacks clear thresholds. But tribunals *have* considered cultural evidence (e.g., **Krstić** on Srebrenica’s "DNA"). Your "functional test" isn’t wholly alien — just unsystematised.  

  ---  
  *Print this. Breathe. And remember: the historians want Lemkin vindicated, the lawyers want doctrine coherent, the NGO wants tools. You’re threading the needle — but your concessions upfront show you know where the law stands. Good luck.*
