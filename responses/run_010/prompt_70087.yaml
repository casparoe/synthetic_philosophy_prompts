answer: |-
  ### Citizen Kane vs. Plutarch: A Test Case for Biographical Ethics  

  **Plutarch’s Method in Brief:**  
  Plutarch treats biography as ethical technology. Slight gestures ("a remark, a joke") reveal character more authentically than grand events (*Alexander* proem). Admiration for virtuous subjects sparks imitation (*Pericles* proem), while flawed figures like Demetrius serve as cautionary tales. The *synkrisis* (formal comparison) sharpens moral judgment. Crucially, Plutarch assumes character is *legible* through action and anecdote—and that this legibility fuels ethical growth.  

  **Kane as Plutarchan Refutation:**  
  *Citizen Kane* systematically dismantles these assumptions:  

  1. **The Failure of Slight Things:**  
     Rosebud—a sled, a trivial artifact—*does* hold the key to Kane’s inner void (his lost innocence). Yet it’s literally burned, unreadable to the biographer Thompson. The film thus *inverts* Plutarch: the revelatory detail exists, but its meaning dies with the subject. Plutarch’s method relies on shared interpretation; Kane shows such details are cryptograms only decipherable by the self.  

  2. **Hagiography as Necessary Fiction:**  
     Bernstein’s loyalty produces a "virtuous Kane," but the film doesn’t treat this as failure. It’s portrayed as *love’s only language*. Bernstein’s distortion isn’t flawed biography; it’s how humans preserve meaning. Plutarch’s "admiration leading to imitation" requires idealization—yet Kane reveals such idealization as subjective curation, not moral truth.  

  3. **The Unknowability of Character:**  
     Each witness projects their own needs onto Kane:  
     - **Bernstein** (disciple): Kane as visionary.  
     - **Leland** (moralist): Kane as corrupted idealist.  
     - **Susan** (intimate): Kane as tyrant.  
     - **Thatcher** (institution): Kane as rebellious statistic.  
     - **Raymond** (observer): Kane as performative shell.  
     Their testimonies reveal *their* characters, not Kane’s. Plutarch assumes behavior reflects stable character; Kane shows "character" as a mirror for others’ desires.  

  4. **Kane as Anti-Exemplar:**  
     Kane fits Plutarch’s *Demetrius* mold—a cautionary tale of ambition’s decay. Yet the film sabotages even this lesson: Kane’s final whisper ("Rosebud") is futile, his life a labyrinth without exit. To "avoid" Kane’s path requires understanding his core wound—but the film insists that wound is irrecoverable. Plutarch’s moral machinery (admire/avoid → imitate/reject) stalls when the subject’s essence is opaque.  

  **The Method on Trial:**  
  - **Epistemic Limit:** Plutarch trusts testimony; Kane proves testimony is solipsism.  
  - **Moral Utility:** Plutarch’s exemplars offer clear paths; Kane’s fragmentation denies imitation. You can’t imitate a man who never knew himself.  
  - **Anachronism Check:**  
    - *Plutarch* isn’t a modern exemplarist; he assumes fixed virtue/vice. Kane depicts character as relational, not fixed.  
    - *Welles* isn’t theorizing biography; he’s dissecting the myth of knowability. The film’s structure *is* its argument.  

  **Verdict: REFUTES-PLUTARCH**  
  *(Reason: Character’s opacity voids ethical legibility.)*  

  **Liberties Taken:**  
  - I cast Plutarch as more optimistic about legibility than some readings allow (e.g., his *Nicias* hints at fortune’s role in virtue).  
  - I treat Rosebud as Kane’s "core truth," though the film ambiguates even this (is it loss, or just nostalgia for control?).  

  **Why This Reading?**  
  *Citizen Kane* doesn’t just question *whether* we can know Kane—it questions whether "knowing a life" is coherent. Plutarch’s project requires biographical access to soul-shaping truths; Kane buries those truths in ash. The film refutes not by disproving exemplarism, but by exposing biography as an autopsy of shadows.
