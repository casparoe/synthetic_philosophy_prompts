  My opening move, then. You say my hesitation is a bookkeeping failure: bend the utility function far enough and the conservative protocol comes out on top with no need of a second parameter. But the bend you require is not free. For expected utility to rank my refusal above the intervention, my utility curve over health states must turn so sharply in the region of severe injury that it also ranks below that injury a great many smaller trade-offs I am entirely willing to make, and ranks above it gambles I would refuse out of hand. A utility function curved tightly enough to vindicate me in the tail predicts refusals and acceptances all through the middle that I know to be false of me. Your theory cannot get the tail right without getting the middle wrong. So either show me where that inference fails, or grant that the shape of a utility function is simply the wrong place to look for what I am objecting to.
