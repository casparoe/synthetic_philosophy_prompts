  The joke needs to be short (under 80 words), have a clear setup and punchline, and target the causal structure of the problem without taking sides. It should be accessible to someone unfamiliar with the philosophy jargon but precise enough that experts would recognize the specific argument step being parodied. No cheap wordplay on terms like "qualia" or lazy tropes like lightbulb jokes. 

