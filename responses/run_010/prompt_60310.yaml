  Now, the non-zero assignment in Δ exists even though there is no spontaneous state and no connection to the outside. Is this a refutation of the model? Or a formal statement of the isolation objection? The isolation objection is that a coherent set of beliefs might be isolated from the world. The model shows that we can have high justification (8/9) without any foundation. This might be seen as a strength for coherentism: it shows that coherence can generate justification. But it might be seen as a weakness: the assignment is high but ungrounded.

  The coherentist might concede that the model allows for ungrounded justification, but that this is acceptable for coherentism. However, the coherentist might also note that the non-zero assignment is only available when r>1/2. At r=1/2, the non-zero fixed point becomes 0, and for r<1/2, only zero. So the discount factor must be high enough. The coherentist might argue that in reality, r is high enough. Also, the coherentist might concede that the model is simplistic and that in reality, defeaters and other factors might break the symmetry, but the formal possibility shows that coherentism is not doomed.

  (d) For F_d: a chain of states s_0 (root), s_1, ..., s_d (leaf). The leaf s_d is spontaneous: J(s_d)=1.

  By DT:
     J(s_{d-1}) = r * J(s_d) = r
     J(s_{d-2}) = r * J(s_{d-1}) = r^2
     ...
     J(s_0) = r^d.

  At r=3/4:
     d=0: then the root is also the leaf? Then J(root)=1.
     d=1: J(root) = r = 3/4
     d=2: J(root) = r^2 = 9/16
     d=3: J(root) = r^3 = 27/64

  Foundationalist structures are finite and acyclic, and every maximal chain terminates in a spontaneous state. The assignment is uniquely determined by starting from the spontaneous states (J=1) and propagating upward by DT (if one reason) or RA (if multiple). Since the structure is acyclic and finite, we can compute from the leaves up. There is no ambiguity.

  In contrast, T∞ and Δ have cycles (Δ has cycles) and no spontaneous states, so we have multiple fixed points.

  Clause 5 assigns J=1 to every spontaneous state. This smuggles in the assumption that spontaneous states are infallible and indefeasible. The model is unable to express that a spontaneous state might be defeated by other considerations, or that its authority might depend on its context. For example, a spontaneous state might be a perceptual seeming, but if the agent has reason to believe she is hallucinating, then the spontaneous state might not have full J=1. Also, the model does not allow for the possibility that two spontaneous states might conflict and require aggregation.

  (e) The collapse to zero in (a) is an artefact of the model's restriction to a single reason per state and the discount factor. In reality, infinitism might allow for multiple reasons per state, so that even in an infinite chain, justification could be non-zero due to aggregation (as in T∞). The infinitist might also object to the discount factor: if r=1, then the chain can have constant non-zero assignment. But if r<1 is essential (because transmission is lossy), then the collapse might be genuine.

  Escape route 1: Allow multiple reasons (as in T∞). Then under RA, we can have non-zero assignment. The infinitist gives up the idea that each state has exactly one reason. But infinitism does not require that.

  Escape route 2: Set r=1. Then the collapse does not occur. But then the model loses the discounting, which might be essential for modeling the idea that reasons are not perfectly transmitting.

  The indeterminacy in (b) (multiple fixed points) occurs in T∞ (infinitist) and Δ (coherentist). It afflicts any view that permits unanchored support cycles (or infinite chains without base). Coherentism is not specifically targeted; infinitism also has the same problem. In the infinite tree T∞, we have the same two fixed points. The issue is the lack of a base (spontaneous states) to ground the assignment.

