  ### Formal Epistemology Seminar: Take-Home Exam  
  **Total Marks:** 25 (of 50 for the paper)  
  **Word Limit:** 1,500 words  
  **Instructions:** Answer all parts. Work must be self-contained; no external sources may be cited. Justify all steps in derivations.  

  **Stipulations:**  
  1. A *support structure* is a pair $\langle S, R \rangle$, where $S$ is a set of doxastic states and $R \subseteq S \times S$, with $tRs$ read as "$t$ is a reason for $s$." A *justification assignment* is a function $J: S \to [0, 1]$.  
  2. A state is *spontaneous* if nothing bears $R$ to it.  
  3. **DT (discounted transmission):** If $s$ has exactly one reason $t$, then $J(s) = r \cdot J(t)$, where $r$ is fixed with $0 < r < 1$.  
  4. **RA (redundant aggregation):** If $s$ has exactly $n \geq 2$ reasons $t_1, \dots, t_n$, then $J(s) = 1 - \prod_{i=1}^n (1 - r \cdot J(t_i))$.  
  5. Every spontaneous state has $J = 1$.  
  6. An assignment is *admissible* for a structure if it satisfies clauses 3–5 at every state.  
  7. *Infinitist* structures contain no spontaneous states, every state has at least one reason, and $R$ is acyclic. *Coherentist* structures may contain cycles and need not contain spontaneous states. *Foundationalist* structures are acyclic, contain no infinite descending $R$-chains, and every maximal descending chain terminates in a spontaneous state.  
  8. Take $r = 3/4$ unless a part asks for general $r$.  
  9. Structures:  
     - **T∞**: Infinite binary tree; every state has exactly two reasons (no spontaneous states).  
     - **Δ**: Three states; each has the other two as reasons (no spontaneous states).  
     - **Γ**: Two states; each is the sole reason for the other (no spontaneous states).  
     - **F_d**: Finite tree of depth $d$; every non-terminal state has exactly one reason, every terminal state is spontaneous.  

  ---

  **Question:**  
  (a) [5 marks] Prove that in any acyclic structure with no spontaneous states and where every state has exactly one reason, every admissible assignment is identically zero. Identify which of these three ingredients is load-bearing: (i) absence of spontaneous states, (ii) $r < 1$, (iii) one-reason restriction. For each, state the minimal change that would admit a non-zero admissible assignment and whether an infinitist can make this change without abandoning infinitism.  

  (b) [5 marks] For **T∞** under RA, show that the assignments $J \equiv 0$ and $J \equiv (2r - 1)/r^2$ (for $r > 1/2$) are admissible. Identify these as the least and greatest fixed points of the monotone operator induced by RA. Evaluate both at $r = 3/4$. What principle could select one assignment over the other? Note: Iterating RA from $J \equiv 0$ never leaves zero; iterating from any $J > 0$ converges to the greater value. Does this dynamics settle the choice?  

  (c) [5 marks] Determine all admissible assignments for **Γ** and **Δ** at $r = 3/4$. **Δ**'s greatest fixed point is non-zero despite no spontaneous states and no external contact. Is this a refutation of the model or a formal statement of the isolation objection? What could a coherentist concede about this non-zero assignment without abandoning coherentism?  

  (d) [5 marks] Compute $J$ at the root of **F_d** for $d = 0, 1, 2, 3$. Explain why foundationalist structures admit unique admissible assignments, while **T∞** and **Δ** do not. What does clause 5 "smuggle in" about spontaneous states? Focus on what the model cannot express (e.g., defeaters, or a seeming's authority depending on network position).  

  (e) [5 marks] Is the collapse to zero in (a) an artefact of the model's treatment of justification (transmission along a single channel) or a genuine problem for infinite chains? Propose one escape route for the infinitist, state what they must give up to take it, and give a verdict on whether the indeterminacy in (b) afflicts coherentism specifically or any view permitting unanchored support cycles.  

  ---

  ### Model Answer  
  **Word Count:** 1,497  

  **(a)**  
  *Proof of collapse:* Consider an acyclic structure with no spontaneous states and every state having exactly one reason. Since it is acyclic with no spontaneous states, it must be an infinite descending chain: $\dots \to s_2 \to s_1 \to s_0$ (finiteness would imply a terminal spontaneous state, contradiction). Suppose for contradiction that $J(s_k) > 0$ for some $s_k$. By DT, $J(s_k) = r \cdot J(t)$ where $t$ is the reason for $s_k$. Since $r < 1$, $J(t) = J(s_k)/r > J(s_k)$. Repeating, $J$ increases along the chain: $J(s_k) < J(t) < J(u) < \cdots$. But $J$ is bounded above by 1, so this sequence converges to some $L \leq 1$. Taking limits, $L = r \cdot L$, so $L(1 - r) = 0$. Thus $L = 0$, contradicting $J(s_k) > 0$. Hence $J \equiv 0$.  

  *Load-bearing ingredients:*  
  (i) *Absence of spontaneous states:* Minimal change: Add a spontaneous state (e.g., terminate a chain). Infinitist cannot, as infinitism forbids spontaneous states.  
  (ii) *$r < 1$:* Minimal change: Set $r = 1$. Then $J(s) = J(t)$ for all $s$, so constant $J \equiv c \in [0,1]$ is admissible. Infinitist can adopt this without abandoning infinitism (the structure remains infinitist).  
  (iii) *One-reason restriction:* Minimal change: Allow multiple reasons (e.g., use RA). For infinitism, adopt a tree structure like **T∞** with RA (non-zero assignment possible; see (b)). Infinitist can do this (infinitism allows multiple reasons).  

  *Philosophical gloss:* The collapse depends formally on the combination of no base, discounting, and single-channel transmission.  

  **(b)**  
  For **T∞**, every state has exactly two reasons. By RA, for any $s$ with reasons $t,u$:  
  \[
  J(s) = 1 - (1 - r \cdot J(t))(1 - r \cdot J(u)).
  \]  
  - *$J \equiv 0$:* Then $J(s) = 1 - (1 - 0)(1 - 0) = 0$, so admissible.  
  - *$J \equiv c$ with $c = (2r - 1)/r^2$ for $r > 1/2$:* Substitute:  
  \[
  1 - (1 - r c)^2 = 1 - (1 - 2r c + r^2 c^2) = 2r c - r^2 c^2.
  \]  
  Set equal to $c$: $c = 2r c - r^2 c^2$. Rearranging: $r^2 c^2 - 2r c + c = 0$ or $c(r^2 c - 2r + 1) = 0$. Solutions $c = 0$ or $c = (2r - 1)/r^2$ (if $r > 1/2$). Verification:  
  \[
  2r \cdot \frac{2r-1}{r^2} - r^2 \cdot \left(\frac{2r-1}{r^2}\right)^2 = \frac{4r-2}{r} - \frac{(2r-1)^2}{r^2} = 4 - \frac{2}{r} - \left(4 - \frac{4}{r} + \frac{1}{r^2}\right) = \frac{2}{r} - \frac{1}{r^2} = \frac{2r - 1}{r^2} = c.
  \]  
  At $r = 3/4 > 1/2$, $c = (2 \cdot 3/4 - 1)/(3/4)^2 = (0.5)/(0.5625) = 8/9 \approx 0.8889$.  

  *Fixed points:* The RA rule defines a monotone operator $T$ on assignments (pointwise order). $J \equiv 0$ is the least fixed point (iteration from $J \equiv 0$ stays at 0). $J \equiv 8/9$ is the greatest fixed point at $r = 3/4$ (iteration from $J \equiv 1$: $T(1) = 1 - (1 - 0.75)^2 = 1 - 0.25^2 = 0.9375$; $T(0.9375) = 1 - (1 - 0.75 \cdot 0.9375)^2 = 1 - (1 - 0.703125)^2 = 1 - 0.296875^2 \approx 0.912$, converging to $8/9$).  

  *Selection principle:* Dynamics do not settle the choice (0 is stable under iteration; any $J > 0$ flows to $8/9$). A substantive principle is needed, e.g., "maximize justification" (favors $8/9$) or "avoid ungrounded justification" (favors 0). This is not a technicality but an epistemological commitment.  

  *Philosophical gloss:* The indeterminacy depends formally on the lack of a base (spontaneous states) in an infinite structure.  

  **(c)**  
  - **Γ**: Each state has exactly one reason. By DT:  
    $J(a) = r \cdot J(b)$, $J(b) = r \cdot J(a)$.  
    So $J(a) = r \cdot (r \cdot J(a)) = r^2 J(a)$. Thus $J(a)(1 - r^2) = 0$. Since $r = 3/4 < 1$, $1 - r^2 \neq 0$, so $J(a) = 0$ and $J(b) = 0$. Only assignment: $J \equiv 0$.  
  - **Δ**: Each state has exactly two reasons. By RA and symmetry, assume $J(a) = J(b) = J(c) = c$. Then:  
    $c = 1 - (1 - r c)^2$ (same as **T∞**).  
    Solutions $c = 0$ or $c = (2r - 1)/r^2$ for $r > 1/2$. At $r = 3/4$, $c = 0$ or $c = 8/9$. Symmetry forces this; no asymmetric assignments.  

  *Interpretation:* The non-zero assignment ($c = 8/9$) is a formal statement of the isolation objection: High justification arises purely from internal coherence, with no grounding in spontaneous states or external input. This is not a refutation but a feature of the model that captures a coherentist intuition.  

  *Concession for coherentist:* A coherentist could concede that justification requires a discount factor $r > 1/2$ (here $r = 3/4$) to avoid collapse, but argue this is realistic (reasons are strong). They need not abandon coherentism, as the model shows coherence *can* generate justification, but must accept that high $r$ is a substantive assumption.  

  *Philosophical gloss:* The non-zero solution depends formally on RA (multiple reasons) and $r > 1/2$; the contrast with **Γ** (which collapses) hinges on DT vs. RA.  

  **(d)**  
  **F_d** is a chain: $s_0$ (root) $\to s_1 \to \cdots \to s_d$ (spontaneous terminal). By clause 5, $J(s_d) = 1$. By DT (each non-terminal has one reason):  
  - $J(s_{d-1}) = r \cdot J(s_d) = r$  
  - $J(s_{d-2}) = r \cdot J(s_{d-1}) = r^2$  
  - $\cdots$  
  - Root $J(s_0) = r^d$.  

  At $r = 3/4$:  
  - $d=0$: Root is spontaneous, $J = 1$.  
  - $d=1$: $J = 3/4 = 0.75$.  
  - $d=2$: $J = (3/4)^2 = 9/16 = 0.5625$.  
  - $d=3$: $J = (3/4)^3 = 27/64 \approx 0.4219$.  

  *Uniqueness:* Foundationalist structures are finite, acyclic, and have spontaneous states at the base. Admissibility is computed bottom-up (from $J=1$ at terminals, applying DT/RA deterministically). **T∞** and **Δ** lack spontaneous states and have cycles/infinite chains, leading to multiple fixed points (e.g., 0 and $8/9$ in (b), (c)).  

  *Clause 5 "smuggles in":* It assumes spontaneous states are infallible ($J=1$ always) and indefeasible (no defeaters can reduce their justification). The model cannot express that a spontaneous state (e.g., a perceptual seeming) might have its authority challenged by defeaters (e.g., evidence of hallucination) or depend on its network position (e.g., coherence with other states).  

  *Philosophical gloss:* The uniqueness depends formally on the foundationalist constraints (finite, terminating chains); the limitation of clause 5 depends on its rigidity.  

  **(e)**  
  The collapse in (a) is partly an artefact: It arises from DT (single reason) and $r<1$, but infinitism need not accept these. For example:  
  - *Escape route 1:* Allow multiple reasons (use RA). Then in **T∞**, non-zero justification is possible (as in (b)).  
  - *Escape route 2:* Reject $r<1$ (set $r=1$). Then $J \equiv c > 0$ is admissible in infinite chains.  
  *What infinitist gives up:* Route 1 gives up exclusive reliance on single-reason chains (accepts web-like support). Route 2 gives up the idea that justification degrades over chains (accepts perfect transmission). Both are compatible with infinitism.  

  The collapse reflects a genuine problem *if* one insists on DT and $r<1$, but the model shows infinitism has flexibility.  

  *Indeterminacy in (b):* It afflicts any view permitting "unanchored" support (no spontaneous states), including infinitism (**T∞**) and coherentism (**Δ**). It is not specific to coherentism; it arises from cycles *or* infinite chains without a base.  

  *Philosophical gloss:* The problem in (a) depends formally on DT and $r<1$; the indeterminacy in (b) depends on the lack of a base.  

