prompt: |-
  I've been sitting with a small Zen group in my city for about fourteen months, and in the spring I told my teacher I'd like to formally take the precepts, which has made me unexpectedly anxious to know what it is I'm agreeing to. I'm not looking for devotional material — I came to the practice precisely because it seemed to get by without any appeal to divine command — so when a colleague lent me a trade nonfiction book about contemplative science and morality, I went straight to the chapter on Buddhist ethics. The author is a science journalist with a real gift for compression, and the chapter's central passage reads as follows:

  "At bottom, Buddhist ethics is consequentialism arrived at two and a half millennia before Bentham: an act is right to the degree that it lessens suffering, and nothing else makes it right. The five precepts are not commandments but rules of thumb, and the tradition's own literature on skillful means shows a compassionate agent setting them aside when the outcomes require it — one Mahāyāna scripture devoted to skillful means tells of the bodhisattva born as a ship's captain who kills a bandit intending to massacre the merchants aboard, and is credited with enormous merit for doing so. Karma is the bookkeeping: the world keeps a ledger in which every deed ripens into a proportionate result, so the Buddhist agent is maximizing welfare across lifetimes rather than obeying rules. And because the Pāli texts identify karma with intention, the ledger charges you for what you meant rather than for what happened to occur, which is the doctrine of double effect restated in an Indian idiom. Strip away the vocabulary and what is left is negative utilitarianism with rebirth as its discount rate: the aim is the elimination of suffering for all sentient beings, and any disagreement with a modern consequentialist is a disagreement about words."

  My instinct is that this is broadly fair, and I'd like to keep believing it, but two things nag at me. When I raised the passage with my teacher she said only that the precepts are something you take on rather than something you weigh, which didn't resolve anything; and the double-effect remark in the fourth sentence struck me as the sort of analogy that sounds decisive and may not be. I also know enough to suspect that the third and fourth sentences are in some tension with each other, though I can't say how. What I want is an accuracy audit: for each sentence, what a scholar of Buddhist ethics would accept without complaint, what is a defensible popular simplification, and what is actually wrong — including whether the ship captain story is being used to carry weight it can't bear, and whether there is a version of the consequentialist reading that serious people do defend, since I've heard the debate is live rather than settled. Most of all I want to know whether the closing equation in the last sentence survives the corrections made to the earlier ones, or whether it depends on them. Please answer as exactly five numbered items, one per sentence of the passage in order, each two or three sentences long, with your verdict on that final equation folded into item five. No introduction, no wrap-up paragraph, and no references or further reading — I have no way of chasing them down and would rather you spend the space on the audit.
reasoning: |-
  Okay, the user has been part of a Zen group for fourteen months and wants to take the precepts but feels anxious about what that entails. They're not interested in devotional aspects and were drawn to Zen because it didn't rely on divine commands. They read a passage from a science journalist's book that frames Buddhist ethics as consequentialist, similar to Bentham's utilitarianism but older. The passage claims the precepts are rules of thumb, karma is about intentions and outcomes across lifetimes, and likens it to negative utilitarianism with rebirth. The user wants an accuracy audit of each sentence in the passage, noting what scholars would accept, what's simplified, and what's wrong. They specifically question the ship captain story, the tension between sentences, and whether the final equation holds after corrections.

  First, I need to address each of the five sentences in the quoted passage. The user wants five numbered items, each two or three sentences long. No intros or conclusions. Let's break down each sentence.

  Sentence 1: Consequentialism before Bentham. Scholars might accept that reducing suffering is central, but they'd argue Buddhist ethics isn't purely consequentialist. There are other elements like virtue ethics. The simplification is defensible but incomplete because intention and character matter too. Actually wrong? Claiming "nothing else makes it right" ignores other aspects like intention and inherent qualities of actions in some traditions.

  Sentence 2: Precepts as rules of thumb and skillful means. The ship captain story is from the Upaya-kaushalya Sutra. Scholars accept that precepts can be set aside with skillful means, but it's debated, especially in Theravada. Using the story as a general example is a simplification; such cases are exceptions, not the norm. The story can bear weight as an example but isn't the sole basis for the argument.

  Sentence 3: Karma as bookkeeping across lifetimes. Scholars agree karma is intentional and has long-term effects. The simplification is "maximizing welfare" which sounds utilitarian, but Buddhist goals include enlightenment, not just welfare. The tension with sentence 4: Sentence 3 emphasizes outcomes ("proportionate result"), while sentence 4 focuses on intention. But karma is based on intention leading to outcomes, so they're connected, not necessarily in tension.

  Sentence 4: Karma as intention and double effect. Scholars agree karma is intention-based. The double effect analogy is problematic because the doctrine of double effect (from Western ethics) involves foreseen vs. intended consequences, which doesn't map perfectly to Buddhist karma. Intention is key, but outcomes also matter in karmic results. So the analogy is a simplification and somewhat misleading.

  Sentence 5: Negative utilitarianism with rebirth. Scholars might see parallels but note differences. Negative utilitarianism focuses solely on reducing suffering, while Buddhism seeks enlightenment, which includes positive states. The final equation is a stretch; it oversimplifies by ignoring other ethical dimensions. The equation doesn't fully survive previous corrections because Buddhism isn't solely about suffering reduction; it has broader soteriological goals.

  The user also asked about the debate among scholars. Yes, some defend a consequentialist reading (like Damien Keown's critique of utilitarianism in Buddhism), but others argue for a hybrid model. The debate is indeed live. The final equation depends on the earlier simplifications; without them, it doesn't hold as strongly.

  I need to ensure each item is concise, two to three sentences, and addresses acceptances, simplifications, and errors. Also, fold the verdict on the final equation into item five. Let me structure each point clearly.
answer: |-
  1.  **Sentence 1:** Scholars accept that lessening suffering (*dukkha*) is the *primary* motivation and benchmark in Buddhist ethics, aligning it broadly with consequentialism. However, the claim "nothing else makes it right" is a significant oversimplification; factors like intention (*cetana*), inherent qualities of actions (especially in Theravada), virtue cultivation (*sila*), and wisdom (*prajna*) are also essential components, making Buddhist ethics more complex than pure consequentialism. This framing ignores the strong emphasis on character development and inherent wrongness attributed to certain actions (like killing) in foundational texts.
  2.  **Sentence 2:** Scholars accept that the precepts are guidelines for training (*sikkhapada*), not divine commandments, and that skillful means (*upaya-kaushalya*) allows for exceptional flexibility, exemplified by texts like the *Upaya-kaushalya Sutra* (Ship Captain story). The framing as "rules of thumb" is a defensible popular simplification. However, using the Ship Captain story as a *general* justification for setting aside precepts overlooks the context: it's presented as an incredibly rare, extreme case demanding immense wisdom and compassion from a highly realized being (a bodhisattva), not a routine ethical calculus; the story *can* bear the weight of illustrating *upaya* but not as proof that precepts are merely utilitarian guidelines for lay practitioners.
  3.  **Sentence 3:** Scholars accept that karma (*kamma*) is intentional action volitionally undertaken, ripening into corresponding results (*vipaka*) across lifetimes, forming a fundamental ethical framework. The "bookkeeping" metaphor and the focus on welfare maximization across lifetimes are defensible popular simplifications. However, "maximizing welfare" is a utilitarian gloss; the ultimate Buddhist goal is liberation from *samsara* (the cycle of rebirth and suffering) through wisdom and cessation of craving, not simply aggregated welfare. The tension with sentence 4 arises because sentence 3 emphasizes *outcomes* ("proportionate result"), while sentence 4 emphasizes *intention* as the sole karmic charge – though intention *drives* the action which *leads* to the outcome.
  4.  **Sentence 4:** Scholars universally accept the core doctrine that karma is defined by volition/intention (*cetana*), not merely the physical outcome. The analogy to the Doctrine of Double Effect (DDE) is problematic and not a standard scholarly comparison. While both emphasize intention, DDE specifically distinguishes *intended* effects from merely *foreseen* side-effects to justify harmful actions – a distinction not explicitly articulated in early Buddhist karma theory, which focuses on the quality (wholesome/unwholesome) of the volition itself driving the act. The analogy is a strained popular simplification that doesn't accurately map the nuances of either system.
  5.  **Sentence 5:** Scholars might concede surface parallels to negative utilitarianism (prioritizing suffering reduction) and that rebirth functions *somewhat* like a long-term discount rate in consequentialist calculus. However, the equation is a significant oversimplification. Buddhism aims not just for suffering's elimination but for the positive state of enlightenment (*nibbana/nirvana*), incorporating wisdom, compassion, and virtue ethics elements absent in pure negative utilitarianism. The final equation **does not survive** the corrections: earlier simplifications (ignoring intention's complexity, overstating *upaya*, misrepresenting karma's purpose as welfare maximization, misapplying DDE) are essential to force the fit; without them, the ethical framework is richer and less reducible to negative utilitarianism. Serious scholars *do* debate consequentialist interpretations (e.g., Siderits, Goodman), but these remain contested within the field, not settled consensus.
