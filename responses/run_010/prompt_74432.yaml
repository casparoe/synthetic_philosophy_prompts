answer: |-
  Below is a step-by-step procedure tailored to your constraints. It's designed to be run in a single 2-hour meeting by non-experts, using only basic arithmetic. The procedure focuses on transparency, defensibility, and clear handoffs to the county manager for value judgments. I'll first outline the steps, then run through your requested cases, and finally flag the limitations.

  ---

  ### **Procedure: Flood Risk Decision Protocol**  
  **Goal:** Combine expert ranges into actionable recommendations for levee overtopping risk.  
  **Inputs:** 3–5 experts (e.g., hydrologist, river expert, forecaster).  
  **Outputs:** Group risk range, state form probability, and action recommendations.  

  #### **Step 1: Elicit Expert Ranges (30 min)**  
  **What to ask experts:**  
  *“Imagine we face 100 identical storms. For how many would the levee overtop? Give a **low** and **high** number where you’re 90% sure the true answer lies between them. For example, ‘10 to 30’ means you’d be very surprised if it were below 10 or above 30.”*  

  **Why this works:**  
  - The "90% sure" framing (a *credible interval*) discourages under/overconfidence by linking to betting intuition.  
  - "Identical storms" controls for scenario specificity.  

  **Write down:**  
  | Expert | Low | High |  
  |--------|-----|------|  
  | e.g., Hydrologist | 10 | 30 |  

  **Move forward when:** All experts provide ranges (no math required). If someone refuses, note: "Expert X declines to quantify."  

  --- 

  #### **Step 2: Flag Uninformative or Problematic Ranges (10 min)**  
  **Check for:**  
  - **Uninformative ranges (0–100):** *"This adds no insight; we’ll note it but exclude from calculations."*  
  - **Non-overlapping ranges (e.g., 10–30 and 40–60):** *"Disagreement is normal; we’ll reflect it in the group range."*  
  - **Hedging (e.g., "20–25 but maybe higher"):** *"Record the numbers given. If hedging persists, use the range but note the uncertainty in documentation."*  

  **Write down:**  
  - Uninformative/non-overlapping ranges and why they occurred (e.g., "River expert: 40–60, no overlap with hydrologist due to sediment concerns").  

  **Move forward when:** All ranges are documented. No resolution needed here—values are facts.  

  ---

  #### **Step 3: Combine into Group Range (10 min)**  
  **Method:** **Union of all ranges** (not average).  
  - **Group Low** = Min of all experts’ lows.  
  - **Group High** = Max of all experts’ highs.  

  **Why union (not average):**  
  - Averages hide disagreement (e.g., 10–30 and 40–60 averaging to 25–45 implies consensus that doesn’t exist).  
  - Union captures the full spread of opinions, making uncertainty visible.  
  - *What it throws away:* Individual expert weighting (e.g., a veteran’s 40–60 isn’t prioritized over a novice’s 10–30).  

  **Write down:**  
  `Group Range: [Group Low]% to [Group High]%`  
  e.g., `Group Range: 10% to 60%`  

  **Move forward when:** Group range is calculated.  

  ---

  #### **Step 4: Calculate State Form Probability (5 min)**  
  **Method:** **Average of expert midpoints** (not group midpoint).  
  - For each expert: **Midpoint** = (Low + High) / 2.  
  - **State Form Value** = Average of all midpoints.  

  **Why not group midpoint?**  
  - Group midpoint (e.g., 35% for 10–60) pretends extremes are equally likely. Expert midpoints better reflect "best guesses."  
  - Includes uninformative experts (0–100 → midpoint 50%) to avoid cherry-picking.  

  **Write down:**  
  `State Form Probability: [State Form Value]%`  
  e.g., `State Form Probability: 31%`  

  **Move forward when:** A single number is generated.  

  ---

  #### **Step 5: Make Action Recommendations (15 min)**  
  **Pre-defined thresholds (set by county manager):**  
  - **Sandbags/Close Road ($40K cost):** Threshold = 25%  
    *(Action justified if cost of damage × probability > $40K)*  
  - **Evacuation (high cost/disruption):** Threshold = 40%  
    *(Higher due to social/economic impacts)*  

  **Decision Rule: Conservative Hybrid (Wald Rule + Midpoint Check)**  
  1. **If Group High < Threshold → Do not act.**  
     *(Worst case still acceptable)*  
  2. **If Group Low > Threshold → Act.**  
     *(Even best case is dangerous)*  
  3. **If Threshold is within Group Range → Use Group Midpoint:**  
     - **Group Midpoint** = (Group Low + Group High) / 2  
     - **If Group Midpoint ≥ Threshold → Act**  
     - **If Group Midpoint < Threshold → Do not act**  

  **Why this rule?**  
  - **Maximin (Wald Rule)** focuses on avoiding worst-case outcomes (critical for safety decisions).  
  - **Midpoint** breaks ties without ignoring the range.  
  - *What you’ll resent:* It may recommend costly actions when uncertainty is high (e.g., midpoint barely above threshold). But this avoids gambling with lives.  

  **Write down for each action:**  
  - Sandbags: [Act/Do not act] because [reason].  
  - Evacuation: [Act/Do not act] because [reason].  

  **Handoff to county manager:**  
  - Threshold setting (Step 5) is a **value judgment** (e.g., "Is 25% the right trade-off for $40K?").  
  - Final call in close cases (e.g., midpoint barely below threshold) is a **value judgment**.  

  ---

  #### **Step 6: Document and Report (10 min)**  
  **Final notes for county manager:**  
  - Summary of expert ranges, group range, state form value, and recommendations.  
  - Key disagreements or uncertainties (e.g., "River expert’s estimate was 40–60%, but not used exclusively due to hydrologist’s conflicting view").  

  **Defensible soundbite for press:**  
  *"We combined all expert inputs, from best-case to worst-case scenarios. Our decision reflects the full range of risks, not just a single guess."*  

  ---

  ### **Case Runs**  
  #### **Case 1: March Meeting (Hydrologist: 10–30%, River Guy: 40–60%, Forecaster: 20–25%)**  
  - **Step 1:** Elicit ranges:  
    | Expert | Low | High |  
    |--------|-----|------|  
    | Hydrologist | 10 | 30 |  
    | River Guy | 40 | 60 |  
    | Forecaster | 20 | 25 |  

  - **Step 2:** Non-overlapping ranges (10–30 and 40–60 don’t touch). Forecaster hedged but provided numbers.  
  - **Step 3:** Group Range = [Min(10,40,20) to Max(30,60,25)] = **10% to 60%**.  
  - **Step 4:** State Form Probability:  
    - Hydrologist midpoint = (10+30)/2 = 20%  
    - River Guy midpoint = (40+60)/2 = 50%  
    - Forecaster midpoint = (20+25)/2 = 22.5%  
    - Average = (20 + 50 + 22.5)/3 = **30.8%** → **31%**.  
  - **Step 5:** Action recommendations:  
    - **Sandbags (threshold 25%):** Threshold in group range (10–60). Group midpoint = (10+60)/2 = 35%. 35% > 25% → **Act**.  
    - **Evacuation (threshold 40%):** Threshold in group range (10–60). Group midpoint = 35% < 40% → **Do not act**.  
  - **Documentation for county manager:**  
    - *"Group range 10–60% reflects wide disagreement. Sandbags recommended (midpoint 35% > 25%). Evacuation not recommended (midpoint 35% < 40%), but river expert estimates 40–60% risk. Final call on evacuation rests with you."*  

  ---

  #### **Case 2: Sonar Survey Widens Range**  
  **Scenario:** Pre-survey group range: 20–40%. Post-survey: Expert 1: 10–50%, Expert 2: 15–45%, Expert 3: 5–60%.  
  - **Group Range:** [Min(10,15,5) to Max(50,45,60)] = **5% to 60%** (wider than 20–40%).  
  - **State Form Probability:**  
    - Midpoints: (10+50)/2=30%, (15+45)/2=30%, (5+60)/2=32.5% → Average ≈ **30.8%**.  
  - **Why this is valid:** New data (scour hole) revealed unknown risks, increasing uncertainty. Wider ranges prevent false confidence.  
  - **How to explain publicly:**  
    *"The survey uncovered new complexities, expanding the range of possible outcomes. This doesn’t mean we’re less competent—it means we’re more honest about what we don’t know. We now prepare for 5% to 60% risk, not an artificially narrow guess."*  

  ---

  #### **Case 3: Uncomfortable Outcome**  
  **Scenario:** Experts: 45–55%, 50–60%, 55–65%. Evacuation threshold = 50%.  
  - **Group Range:** [Min(45,50,55) to Max(55,60,65)] = **45% to 65%**.  
  - **State Form Probability:** Midpoints = 50%, 55%, 60% → Average = **55%**.  
  - **Evacuation recommendation:**  
    Threshold (50%) is in group range (45–65%). Group midpoint = (45+65)/2 = 55% > 50% → **Act**.  
  - **Why uncomfortable:** You previously told residents evacuation was unlikely.  
  - **How to handle:**  
    - *"New data/analysis shows risk is 45–65%, with a best estimate of 55%—above our 50% threshold. We must act, even if it contradicts past statements. Safety requires adapting to new information."*  
  - **Why it stings:** The procedure overrides intuition and forces accountability.  

  ---

  ### **Seams and Limitations**  
  **Where judgment masquerades as procedure:**  
  - **Threshold setting:** Choosing 25% for sandbags isn’t scientific—it’s a value call about risk tolerance.  
  - **Handling uninformative experts:** Including a 0–100% range drags the state form value toward 50%. You might exclude it if justified (e.g., "Expert admitted they had no data"), but this invites bias.  
  - **Midpoint tiebreaker:** Using the group midpoint (Step 5) is arbitrary but necessary for simplicity.  

  **Where this will misfire:**  
  - **Outlier experts dominate:** A single "0–100%" or "80–100%" expert widens/skews the group range.  
  - **Experts mis-calibrated:** Someone consistently giving 90% ranges that miss the truth (e.g., true overtopping always outside their range) won’t be corrected.  
  - **Static thresholds:** If storm severity changes mid-season, thresholds may need ad hoc adjustments.  

  **What it can’t do:**  
  - **Weight experts:** A 40-year river veteran isn’t prioritized over a novice.  
  - **Incorporate correlations:** e.g., "If hydrologist says 30%, river expert usually says higher."  
  - **Dynamic updating:** New data (e.g., rainfall) requires re-running the entire protocol.  

  **What a "pro" version would add:**  
  - **Weighted pooling:** Experts scored by past accuracy (e.g., "River expert’s ranges contained truth 85% of time").  
  - **Probability distributions:** Experts submit full curves (not just ranges) via tools like SHELF.  
  - **Decision trees:** Software to model costs/benefits (e.g., "If overtopping costs $1M, sandbags cost $40K, act if probability > 4%").  

  ---

  ### **Final Advice**  
  - **Prep work:** Have thresholds ($40K sandbags → 25%, evacuation → 40%) signed off by the county manager *before* storm season.  
  - **During meeting:** Assign a "math person" (e.g., actuary) to handle calculations; others focus on context.  
  - **Emphasize:** This protocol makes uncertainty visible and defensible. As coordinator, your role is ensuring the process is followed—not wrestling with the math.  

  This balances rigor with practicality. It won’t make the argument vanish, but it will turn subjective fights into an auditable, public-focused process.
