answer: |-
  **Bottom line:** The swap case successfully forces your intended question by eliminating shape/location as deciders and making history the only candidate for grounding distinctness; I've closed the escape route of claiming the reassembled object is merely a duplicate lump by stipulating it possesses *all* the original molecules arranged statue-wise and survives squashing like the original lump.

  ---

  **EXAM QUESTION (as students would see it):**

  **(Total: 25 Marks. Time: 45 minutes)**

  Consider the following scenario:

  1.  **Initial Setup:** At time T1, a statue (S1) is on a plinth in Room A. It is composed of a specific lump of clay (L1). S1 and L1 occupy the same space at T1. It is true that L1 could survive being squashed into a ball at T1, while S1 could not.
  2.  **The Swap:** Between T1 and T2 (one hour later), a prankster gradually replaces every molecule of the object on the plinth in Room A with a qualitatively identical molecule, one at a time. At every instant during this swap, the object on the plinth in Room A remains statue-shaped. The original molecules are collected in a box.
  3.  **Reassembly:** At T2, the prankster uses *all and only* the original molecules from the box to assemble, molecule-for-molecule in the exact original arrangement, a statue-shaped object on a plinth in Room B. Call the object in Room A at T2 "Object A". Call the object in Room B at T2 "Object B".
  4.  **End State:** At T2, Object A (made entirely of new molecules) and Object B (made entirely of the original molecules) are both statue-shaped, located on plinths in their respective rooms. Object B could survive being squashed into a ball; Object A could not.

  **Answer the following questions:**

  A.  At T2, are Object A and Object B numerically distinct (i.e., two different things)? Defend your answer. *(8 Marks)*
  B.  If you claim they are distinct, what grounds this distinctness? If you claim they are not distinct, explain how this is consistent with the initial claim that S1 and L1 were distinct at T1. Crucially, your answer must address the role of the objects' *histories*. *(10 Marks)*
  C.  Explain what happens to the intuition that "L1 could survive squashing while S1 could not" in this scenario. Does the swap case show this modal difference was merely "decorative" in the original argument, or is it still doing essential work? Justify your answer. *(7 Marks)*

  ---

  **MODEL ANSWER (Approx. 700 words):**

  **A.** At T2, Object A and Object B are numerically distinct. Object B is composed of all the original molecules in the original arrangement, while Object A is composed of entirely new molecules. They occupy different spatial locations (Room A vs. Room B). Therefore, they are two separate objects.

  **B.** The distinctness of Object A and Object B at T2 is grounded *entirely* in their different material compositions and causal histories. Object B is materially continuous with the original lump L1 – it is constituted by the very same molecules that constituted L1 at T1, reassembled. Object A is constituted by entirely different molecules. Crucially, their histories differ causally: Object B’s existence at T2 is the result of the reassembly of the *original matter* that was removed during the swap. Object A’s existence at T2 is the result of the gradual replacement process acting upon the matter that was on the plinth throughout.

  This historical/material grounding is essential because shape and location cannot do the work: both objects are statue-shaped and both are appropriately located on plinths. The only feature distinguishing them is *which specific matter* constitutes them and *how that matter came to be arranged* as it is at T2 – facts inherently tied to their histories. This shows that the claim "there are two things in the same place at T1" (S1 and L1) was not *merely* bookkeeping based on current shape/location or future modal potential. It was a claim about distinct entities present, distinguished by their persistence conditions, which are revealed and tested precisely when their histories diverge, as in the swap. When the tracking comes apart, we see that the distinctness was real, grounded in different criteria for persistence over time (for the lump: material continuity; for the statue: form/functional continuity). Object B persists by material continuity (it's the original lump, reassembled). Object A persists by form/functional continuity through the gradual replacement (it's the statue-continuant). The divergence in their histories confirms they were always distinct entities governed by different principles.

  **C.** The swap case does *not* show the modal difference (surviving squashing) is merely decorative; instead, it reinforces its essential role in grounding distinctness *through* history. The intuition remains crucial for identifying *what kind of thing* each object is at T2 and explaining *why* their distinct histories matter.

  Consider the modal properties at T2: Object B (the reassembled original matter) *can* survive being squashed into a ball, just like the original lump L1 could at T1. Object A (the continuously statue-shaped object) *cannot* survive being squashed, just like the original statue S1 could not. This modal difference at T2 directly reflects the different persistence conditions inherited from the distinct objects present at T1. The fact that Object B has the modal profile of the *lump* (survives squashing) and Object A has the modal profile of the *statue* (does not survive squashing) is strong evidence that Object B *is* the original lump (L1) and Object A *is* the statue-continuant that persisted through the swap. The modal properties aren't decorations; they are *manifestations* of the essential persistence conditions that define what each object *is*. The swap case leverages these modal differences: it is precisely *because* the lump (L1) persists by material continuity that it can be disassembled, stored, and reassembled in Room B while retaining its identity and modal profile. Conversely, it is *because* the statue persists through form/functional continuity that Object A, despite having all new matter, is the same statue as S1 and shares its inability to survive squashing. The historical divergence in the swap scenario doesn't make modality irrelevant; it allows the distinct modal profiles to be exhibited by two spatially separated objects, confirming that distinct kinds of entities, with distinct persistence conditions (including modal properties), were co-located at T1. The decoration charge fails; the modal properties are constitutive of the distinct kinds and their identities over time.

  ---

  **MARKING SCHEME:**

  **Overall:** Marks awarded for clarity, precision, direct engagement with the specific questions and scenario, and the quality of reasoning. Avoids mere assertion or name-dropping.

  **Question A (8 Marks):**
  *   **A (7-8):** Clearly states distinctness. Correctly identifies the material difference *and* links it to history/composition. Explicitly notes spatial separation as evidence but not as the *ground*.
  *   **B (5-6):** States distinctness. Relies primarily on spatial separation or simple material difference without adequately linking to persistence/history. May be vague on why composition matters metaphysically.
  *   **C (3-4):** Ambiguous or incorrect answer on distinctness. May confuse numerical distinctness with qualitative difference, or claim identity based on shape/location alone.
  *   **D (0-2):** No clear answer, or completely misstates the scenario/facts.

  **Question B (10 Marks):**
  *   **A (9-10):** Explicitly and correctly identifies material composition/causal history as the ground. Explains *why* shape/location fail. Argues persuasively that distinct history confirms prior distinctness grounded in different persistence conditions. Clearly differentiates grounding from mere tracking/bookkeeping. Integrates the idea of persistence conditions (material vs. form).
  *   **B (7-8):** Identifies history/composition as key. Explains why shape/location fail. States history confirms distinctness but doesn't fully articulate *how* this shows distinctness wasn't merely bookkeeping, or gives a weaker account of persistence conditions. May rely on intuition without fully connecting to metaphysics of persistence.
  *   **C (5-6):** Mentions history but doesn't explain *how* it grounds distinctness. May fall back on shape/location implicitly. Struggles to reconcile T1 distinctness with T2 situation if distinctness is denied. Treats history as tracking without metaphysical grounding.
  *   **D (0-4):** Fails to identify a ground, or grounds distinctness incorrectly (e.g., solely on location, shape, observer knowledge). May claim distinctness was illusory all along without resolving T1 claim. Ignores the prompt about history.

  **Question C (7 Marks):**
  *   **A (6-7):** Correctly argues modality is essential, not decorative. Explains how modal properties at T2 (surviving squashing) directly reflect the distinct persistence conditions/kinds involved (lump vs. statue). Shows how the swap scenario *uses* these modal differences to manifest the distinctness grounded in history/persistence conditions. Clearly links modality to kind/persistence.
  *   **B (4-5):** States modality is important but doesn't fully explain its essential role or how the swap leverages it. May simply assert it's still relevant without showing *how* it connects to the historical distinctness. Might claim modality is decorative for the *original argument* but essential now (or vice versa) without coherent justification.
  *   **C (2-3):** Claims modality is decorative or irrelevant in the swap case, or struggles to explain its role. May conflate the modal properties of the T2 objects or misapply the squashing test.
  *   **D (0-1):** Ignores the question or completely misstates the modal properties.

  **Key Mistakes Costing Marks (Specific Examples):**
  1.  **Epistemic/Modal Slide:** "We can't tell Object A and B apart qualitatively, so they must be the same thing." (Confuses epistemic indiscernibility with metaphysical identity).
  2.  **Ignoring Lump Persistence:** Treating Object B solely as a "new statue" or "copy," ignoring the stipulation it's made of the *original matter* and has the lump's modal property (survives squashing), thus failing to see it *is* the original lump L1.
  3.  **Misapplying Coincidence:** Assuming that because S1 and L1 coincided, Object A *must* be both statue and lump, or that Object B cannot be L1 because it wasn't co-located with S1 during the swap. (Fails to see coincidence ended when histories diverged).
  4.  **Treating Modality as Contingent/Decorative:** "The squashing intuition was just a way to *tell* them apart initially, but it doesn't reflect a real difference in what they *are*." (Denies modality's role in kind/persistence).
  5.  **Defaulting to Conventionalism:** "We *decide* which one is the original statue based on convention/practicality, so there's no real metaphysical fact." (Avoids the grounding question).
  6.  **Location/Shape as Ground:** Relying primarily on "Object A is in the original location" or "both look like statues" as the ground for distinctness or identity, despite the question taking these off the table.
  7.  **Inconsistent Treatment:** Claiming S1 and L1 are distinct at T1 based on modality, but denying Object A and Object B are distinct at T2 despite the same modality difference, without explaining the inconsistency.
