answer: |-
  Right, sharp origin essentialist here. Let's cut through the lab coat fog. First, no concession: the child *could not* have come from an egg lacking the donor's mitochondrial contribution. That specific zygote – formed by the fusion of *that* sperm with *that particular enucleated egg cell cytoplasm containing the donor's mitochondria* – is metaphysically necessary for her existence. The technician's choice *is* fateful under this view, absolutely. That's the hard consequence of the doctrine: origins lock in necessity, regardless of how mundane or artificial the causal chain.

  But hold on – this isn't a "genetic-identity" view sneaking in. The essence isn't *just* the nuclear DNA sequence. It's the *actual concrete physical materials* involved in the originating event. The donor provided the specific cytoplasmic machinery, including her mitochondria, that enabled *this* fertilization and early development. Swap any part of that actual material origin – even non-nuclear, non-coding parts – and you get a numerically different zygote, hence a different possible person. The line isn't drawn by "which genes matter"; it's drawn by the brute physical particularity of the gametes that fused. The mitochondria are part of the egg's physical substance used. Your move: tell me why that specific cytoplasmic contribution *isn't* part of the originating material cause?
