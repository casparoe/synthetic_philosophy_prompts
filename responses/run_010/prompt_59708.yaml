prompt: |-
  I have spent twenty-two years writing direct-mail fundraising appeals for a regional charity, first as a staff copywriter and for the last decade as the person who signs off on every piece that goes out. I have no academic training in philosophy. I did not go to university, and what little I know of the subject I have picked up piecemeal and probably badly. But there is one question I have worked at practically every day of my career, and I would rather see the specification of it laid out clearly than be handed somebody's finished answer.

  The question is where legitimate persuasion stops and manipulation begins. For me it is not abstract. Every appeal I write uses techniques I could name for you: an unsolicited gift of return address labels printed with the recipient's own name, which reliably lifts response rates because people feel obliged to reciprocate; a reply device on which a monthly amount is already filled in and must be crossed out to be lowered; a closing date that is real in the sense that the mailing genuinely ends, and another that is real only in the sense that nobody would ever notice if we extended it; a story about one named child, chosen because a single identifiable person moves donors in a way that nine hundred statistical children do not. Some of these I am comfortable with. Some I have refused to write. I have never been able to state a principle that explains which is which, and I suspect that many people who write about this have never had to decide under a response-rate target, with a competitor's mailing arriving the same week.

  So, before I read any theory, tell me what a theory has to do. Write the requirements that an account of the distinction must meet in order to be of use to someone in my position — adequate not for settling a seminar dispute, but for letting a person decide in advance whether to send a particular sentence, and judge afterwards whether they did wrong. For each requirement, give the case or consideration that motivates it, drawn as far as possible from situations like the ones above. Then:

  - Mark which requirements are non-negotiable and which are really the preferences of one camp wearing the costume of criteria, and say which camp each belongs to.
  - Tell me which single requirement does the most work in ruling out otherwise attractive accounts.
  - Flag any subset of the requirements that you think cannot be satisfied jointly. I have a hunch of my own and I want it tested rather than flattered: a tactic seems to me manipulative exactly when it depends on the target not knowing it is being used — when it would stop working if announced — so full transparency ought to be the criterion. But if announcing a technique destroys it, and my competitors decline to announce theirs, then transparency costs me the donations that pay for the services. An account that demands openness may therefore demand that the honest fundraiser lose. If that is a genuine knot rather than a confusion on my part, say so plainly, and say which of the three — openness, effectiveness, and a fair share of a competitive attention market — has to be the one that gives.
  - Say what an adequate account must do about influence with no mind behind it: a system that serves different versions of the same appeal to different people at different hours and quietly learns which version works, where nobody intends anything and nobody could tell you why the winner won.
  - Say what it must do about the cases that embarrass a purely victim-centered view: the lie told to a man at the door to protect the person hiding upstairs, the intervention staged for a relative who cannot currently judge his own interests, and the tactic that the target welcomes and would pay for, such as the framing a fundraiser's own staff use on themselves to finish the work.

  Finally, and briefly — a paragraph each, no more — how do the main lines of approach fare against your list: those that put the wrong in the influencer's intention, those that put it in bypassing or degrading the target's capacity to deliberate, those that put it in harm or in the disadvantage handed to one party, those that put it in the character or vice of the persuader, and the line of thought associated with nudging and choice architecture, which treats the design of an option as benign so long as the exit is cheap. I care far more about the criteria than the scorecard, so keep that part short.

  Please do not give me a reading list, citations, or titles; I cannot check them and I do not want them. Write in your own words, and where you use a term of art, define it in a clause. A numbered list with the motivating case set out under each item is exactly the shape I am after.
reasoning: |-
  Okay, this is a profound and deeply practical request. The user has spent decades in the trenches of ethical persuasion, wrestling with techniques that walk the line between legitimate fundraising and manipulation. They're not asking for answers but for a rigorous framework to evaluate theories – a tool sharpened by real-world constraints like response rates and competitor mailings. 

  What stands out immediately is their suspicion that academic distinctions might collapse under operational pressure. They've given concrete examples: reciprocity triggers, pre-filled amounts, strategic closing dates. Each is a tiny ethical battleground. Their transparency criterion (does it fail if disclosed?) is particularly insightful because it exposes the vulnerability of many techniques – but also highlights the competitive dilemma where honesty might cost beneficiaries.

  The user's hidden pain points emerge between the lines: the guilt of using tactics that feel icky but work, the fear of self-deception when justifying methods, and the professional isolation of making solo calls without clear principles. They're essentially asking for an ethical compass calibrated to fundraising's gray zones.

  For the framework, I'll need requirements that:
  - Acknowledge competitive realities (can't demand unilateral disarmament)
  - Handle subconscious influence (like A/B testing)
  - Address benevolent deception (protecting hiding people)
  - Account for welcomed manipulation (self-framing)
  - Avoid ivory-tower idealism

  The hardest trade-off is their transparency paradox: if disclosure kills effectiveness and competitors won't disclose, must good causes lose? I think this forces us to admit that effectiveness can't be sacrificed entirely – but we can demand disclosure where it wouldn't cripple the cause. 

  On approaches:
  - Intention-based theories fail because good intentions justify too much
  - Degradation theories struggle with welcomed influence
  - Harm theories ignore harmless manipulation
  - Virtue ethics is too vague for copy decisions
  - Nudging's "cheap exit" standard is useful but incomplete (pre-filled amounts have cheap exits but feel manipulative)

  The system-generated influence (A/B testing) is especially thorny. Without human intent, we must judge by whether the tactic itself could pass disclosure – if the machine learns that exploiting trauma works, that's manipulation regardless of intent.

  Finally, the benevolent lies cases show that victim-centered views aren't enough. Sometimes manipulation protects. The test might be: would the beneficiary endorse the method if temporarily rational? For fundraising, that maps to "would donors approve these tactics if explained during a calm moment?"
answer: |-
  Here is a set of requirements for an account distinguishing legitimate persuasion from manipulation, tailored to your operational reality. Each is motivated by your cases and the need for pre-decision clarity and post-action judgment.

  ### Requirements for a Useful Account (Motivated by Your Cases)

  1.  **Must provide pre-decision guidance for specific techniques:** The account must allow you to evaluate *individual tactics* (e.g., pre-filled amounts, artificial deadlines, identifiable victim framing) before inclusion. *Motivation:* You need to decide sentence-by-sentence, tactic-by-tactic whether to use it, under deadline pressure, not just judge entire appeals post-hoc.
  2.  **Must account for effectiveness dependence:** The account must address whether a tactic's *effectiveness relies on the target's lack of awareness* of its use or mechanism. *Motivation:* Your transparency hunch – the return address labels work *because* the recipient feels an unexamined obligation; announcing "this is to trigger reciprocity" likely kills response. Effectiveness tied to ignorance is a core concern.
  3.  **Must not require unilateral disarmament in competition:** The account cannot demand you abandon effective tactics that competitors freely use, *if* doing so predictably causes significant harm to your mission (e.g., lost donations funding vital services). *Motivation:* The competitive mailing arriving the same week; your transparency dilemma – if openness makes you uncompetitive, demanding it might be unsustainable.
  4.  **Must handle influence without specific intent:** The account must apply to systems (like A/B testing algorithms) optimizing appeals based on response data, where no human "intends" manipulation for each variant. *Motivation:* The system learning which version works best, perhaps exploiting subconscious biases nobody explicitly chose or understands.
  5.  **Must accommodate justified deception/soft paternalism:** The account must allow for tactics resembling manipulation but used for *defensible protective or enabling purposes*, where the target might endorse the tactic later (or never know). *Motivation:* The lie to protect someone hiding; staging an intervention for a relative; even staff using framing techniques on themselves to persevere – these aren't primarily donor exploitation.
  6.  **Must distinguish harm/advantage from wrongness:** The account cannot define manipulation *solely* by bad outcomes (harm) or unfair advantage to the influencer. *Motivation:* Some tactics (like the identifiable victim) likely increase donations *and* help more people; some "advantage" (getting the donation) is the goal. Wrongness must lie elsewhere.
  7.  **Must avoid relying solely on the influencer's character or intent:** The account cannot depend on judging the *fundraiser's virtue* or subjective good intentions to define the tactic's legitimacy. *Motivation:* Good people can use questionable techniques under pressure; bad intentions can taint good techniques. You need to judge the *tactic*, not just the person using it, for pre-decision use.
  8.  **Must address degradation of deliberation:** The account must consider whether the tactic *bypasses, subverts, or significantly impairs the target's rational decision-making capacity* without their awareness or consent. *Motivation:* Pre-filled amounts might exploit inertia; artificial deadlines might create false urgency – both potentially short-circuiting considered choice.

  ### Classifications & Key Requirements

  *   **Non-Negotiable (Fundamental to the Problem):** 1 (Operational Guidance), 2 (Effectiveness Dependence), 4 (Systemic Influence), 5 (Justified Exceptions), 6 (Beyond Harm/Advantage), 8 (Deliberation Degradation). *These stem directly from your core dilemma, cases, and need for actionable judgment.*
  *   **Negotiable / Camp Preferences:**
      *   3 (No Unilateral Disarmament): Favors **Pragmatic/Consequentialist Camps** (prioritizing outcomes/mission survival). Opposed by **Idealist/Deontological Camps** (prioritizing principle regardless of cost).
      *   7 (Avoiding Character/Intent Focus): Favors **Tactic-Focused/Structural Camps**. Opposed by **Virtue Ethics Camps** who see the agent's character as central.

  *   **Requirement Doing the Most Work Ruling Out Accounts:** **#2 (Effectiveness Dependence / Transparency Test)**. Accounts relying solely on intention (#7), harm (#6), or even some deliberation-bypass (#8) definitions often fail here. They might approve tactics that *only* work in the dark (like undisclosed reciprocity triggers), which your intuition strongly flags as manipulative. This requirement forces the account to confront the tactic's inherent reliance on secrecy.

  *   **Incompatible Subset?** The tension between **#2 (Transparency/Effectiveness Dependence)** and **#3 (No Unilateral Disarmament)** is the genuine knot you identified. If manipulative tactics thrive on secrecy (#2), and announcing them kills their effectiveness, then demanding full transparency *in a competitive environment where others are not transparent* (#3) forces a choice:
      *   **Openness:** Stick to principles, accept lower response rates, potentially harming the mission.
      *   **Effectiveness:** Use the opaque-but-effective tactics to compete and fund services.
      *   **Fair Share:** Requires a level playing field (e.g., industry-wide transparency rules) which you likely can't unilaterally create.
      *   **What Must Give?** In the *current, non-ideal competitive environment*, **Openness** is often the casualty. A "fair share" requires systemic change you can't achieve alone. Effectiveness and mission survival often win out pragmatically (#3 prevails over strict adherence to #2). An adequate account must acknowledge this tragic conflict, not pretend it doesn't exist.

  ### Handling Specific Cases

  *   **Influence With No Mind (A/B Testing):** The account must judge the *tactic itself* based on the criteria above (especially #2, #4, #8), not the lack of intent. If the algorithm learns that variants exploiting subconscious bias or degrading deliberation (#8) without awareness (#2) get more clicks, *those specific variants* are manipulative, regardless of the system's lack of "intent." The wrong lies in the tactic's structure and effect, not the agent's mind.
  *   **Embarrassing Cases for Victim-Centered Views:**
      *   The account must allow that bypassing deliberation (#8) or using deception can be *justified* (#5) based on overriding protective duties (saving the person hiding) or enabling the target's own deeper interests (the relative needing intervention). The judgment hinges on the *purpose and justification*, not the absence of harm or the target's momentary state. The "victim" might retrospectively endorse the action.
      *   The Welcomed Tactic (staff framing): Here, the "target" is aware and consents to the framing mechanism *as a tool*. It doesn't depend on secrecy (#2) and aims to support their own goals, not subvert them (#8). This likely falls into legitimate self-persuasion or enablement (#5), not manipulation.

  ### How Main Lines of Approach Fare (Briefly)

  *   **Intention-Based:** Fails #7. Good intentions can use manipulative tactics; bad intentions can use good ones. Useless for pre-decision on tactics.
  *   **Deliberation Bypass/Degradation:** Hits #8 well. Strong on #2 (secrecy often enables bypass). Struggles with #5 (justified paternalism/protection) and #4 (systemic influence requires tactic focus, not just agent intent). A leading contender if it accommodates #5.
  *   **Harm/Disadvantage-Based:** Fails #6. Harm isn't necessary (harmless manipulation exists) or sufficient (tactics causing short-term "harm" like discomfort might be justified persuasion). Donor disadvantage is inherent in fundraising asks.
  *   **Character/Vice-Based:** Fails #7. Judging the agent's character doesn't cleanly define the tactic's permissibility and offers no pre-decision guidance. Virtuous people face your dilemma.
  *   **Nudging/Choice Architecture (Benign if Cheap Exit):** Addresses #8 partially. Cheap exit helps (crossing out a pre-filled amount is easy). But fails #2 – many effective nudges *depend* on lack of awareness. Also struggles with #5 (is paternalism benign if exit is cheap?) and doesn't resolve the tension in #3 (competitors using opaque nudges). Useful but incomplete; cheap exit isn't a silver bullet.

  The deliberation bypass/degradation approach (#8), especially when combined with the transparency test (#2) and incorporating justified exceptions (#5), emerges as the most promising against your requirements, though it still grapples fiercely with the competition knot (#3).
