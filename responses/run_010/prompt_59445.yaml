prompt: |-
  I'm TAing a third-year ethics seminar (about 40 students) and I've got a stack of short essays to mark this weekend. It's not a survey course — weeks 3 through 5 are specifically on objections to consequentialist aggregation, and the essay question below is the one I set for that block. We mark on the departments standard bands: 40–49 marginal fail, 50–59 pass, 60–69 good, 70+ excellent, and anything over 80 basically doesn't happen at this level. The second marker and I are supposed to land within a band of each other, so I need the grade argued for rather than just announced.

  Could you mark this one for me? I want a grade and then a point-by-point set of comments tied to particular bits of the text — what it gets right, what it gets wrong, and what's merely underdeveloped rather than actually mistaken. I've read it once but I'd rather not steer you, so please don't assume I think any part of it is good or bad; I mostly want to know whether parts (b) and (c) hold up, since that's where the marks sit. Be explicit about which problems are grade-relevant and which are just thin prose I shouldn't penalize, and if there's a sentence where you'd want to ask the student what they meant before deducting anything, flag it as ambiguous instead of guessing at the uncharitable reading.

  Then a last thing: tell me where your own assessment is most likely to be off. If something you'd count as an error is actually defensible on some reasonable reading of the material, say which reading and how much it would soften the grade. And tell me what would change your verdict — what would this student have had to add, or retract, to move the essay up or down a band?

  **The question** (word limit 600, worth 15% of the module):

  Nozick's utility monster. (a) State the thought experiment and the conclusion Nozick draws from it. (b) Explain why this is supposed to be a problem about the aggregation of welfare rather than a problem about inequality, or about the interpersonal measurement of utility. (c) Give one reply a utilitarian could make, and say whether you think it works.

  **The student's answer:**

  Nozick's utility monster, from Anarchy, State, and Utopia, is a being who gets far more utility out of every unit of a resource than anyone else does. If an apple gives me one unit of pleasure it might give the monster a hundred, so a utilitarian who wants to maximize the total has to keep shifting resources toward it, and in the limit has to accept that the rest of us should be fed to it, because the monster's gains outweigh everything we lose. Nozick's point isn't that the monster is wicked — its a being that isn't doing anything wrong, it's just experiencing a lot. The point is that the theory has no vocabulary for saying these resources are already theirs, since the only question it can ask is how much utility there is in total.

  (b) This is why the objection targets aggregation and not equality. Nothing unfair has happened in the ordinary sense: the monster didn't cheat, and the distribution it produces isn't unjust by any patterned criterion, it's just extremely unequal. The complaint is that utilitarianism adds welfare across persons as though all of it belonged to a single subject who is being made better off, so a thousand people losing everything can be outweighed by one being's enormous gain. That's exactly the structural complaint Parfit makes with the repugnant conclusion, which is really just the utility monster applied to population size instead of to a single individual — in both cases the theory is committed to a large total built out of lives that are terrible for the people living them.

  (c) A utilitarian could reply by giving up on totals and going in for average utilitarianism instead. If what matters is welfare per head, then pouring everything into one creature doesn't automatically raise the average, so the monster loses its grip. I don't think this reply works, though, because it never answers Nozick's real point, which is that no way of adding up welfare can respect the fact that there is a separate someone the adding up is happening to.
reasoning: |-
  Okay, the user is a TA for a third-year ethics seminar, specifically teaching objections to consequentialist aggregation. They need help grading a student's essay on Nozick's utility monster. The essay has three parts: (a) explaining the thought experiment, (b) why it's about aggregation rather than inequality, and (c) a utilitarian reply and its evaluation. The TA wants a grade and detailed comments, especially on parts (b) and (c), which carry the most weight. 

  First, I need to recall the utility monster argument. Nozick uses it to critique utilitarianism by showing that if one being gains vastly more utility from resources, utilitarianism would demand all resources go to it, even if others starve. The key issue is aggregation—summing utility across individuals ignores separateness of persons.

  Looking at the student's essay: Part (a) is accurate but a bit simplistic. They capture the core idea but miss that the monster's nature isn't about morality but extreme utility conversion. Still, it's sufficient for a pass. 

  Part (b) is stronger. The student correctly distinguishes aggregation from inequality, noting that the problem isn't unfairness but summing welfare as if it belongs to one entity. Linking to Parfit's repugnant conclusion is insightful and shows deeper understanding. This is good analysis.

  Part (c) proposes average utilitarianism as a reply but dismisses it, arguing it doesn't address separateness of persons. The reply choice is valid, but the critique could be deeper. The student identifies the core issue but doesn't engage with nuances like whether averaging avoids the monster in practice. Still, they grasp Nozick's fundamental point.

  For grading: The department's bands are strict. Part (a) is passable (low 60s), part (b) is good (mid-60s), part (c) is adequate but underdeveloped (low 60s). Overall, the essay is consistent, so a low 60s grade (good) seems fair. 

  Where might I be off? The Parfit link in (b) could be seen as overreach, but it's defensible. If the second marker thinks it's a stretch, the grade might drop to high 50s. For (c), if the student meant averaging fails categorically (not just practically), that’s stronger, potentially lifting the grade. 

  To move up a band, the student would need to clarify the monster's non-moral nature in (a), deepen the aggregation argument in (b), and in (c), address why averaging doesn't solve separateness or offer alternative replies. To drop, missing Parfit or botching average utilitarianism would hurt. 

  The TA should watch for second-marker sensitivity to the Parfit connection and the interpretation of "doesn't automatically raise the average" in (c). Overall, this is a solid but not exceptional essay.
answer: |-
  ### Overall Grade: **63/100 (Good)**  
  *(Band: 60–69 — Competent analysis with minor gaps/underdevelopment, but core arguments largely sound)*  

  **Breakdown by Section**  
  *(Focus on (b) and (c), as requested)*  

  ---

  ### (a) State the thought experiment and conclusion (Adequate, but thin)  
  **Strengths:**  
  - Correctly identifies the core mechanics: monster gains vastly more utility per resource, forcing utilitarian redistribution.  
  - Accurately notes Nozick’s conclusion that utilitarianism lacks a concept of resource entitlement ("already theirs").  

  **Weaknesses/Underdevelopment:**  
  - Misses nuance: Nozick’s monster isn’t just "experiencing a lot" but *converts resources to utility more efficiently*.  
  - Oversimplifies Nozick’s target: The "no vocabulary" point is correct but should explicitly tie to *rights* or *side constraints* (implied but not stated).  
  - **Grade impact:** Minor. Sufficient for baseline understanding but lacks depth expected at this level.  

  ---

  ### (b) Why aggregation, not inequality/measurement? (Strong)  
  **Strengths:**  
  - **Excellent distinction:** Clearly separates aggregation from inequality ("Nothing unfair... isn’t unjust by patterned criterion").  
  - **Key insight:** Correctly frames the critique as welfare being "added across persons as though belonging to a single subject" — nails Nozick’s "separateness of persons" objection.  
  - **Parfit link defensible:** While not explicit in Nozick, connecting the Repugnant Conclusion’s structure to the monster is insightful and shows synthesis.  

  **Weaknesses/Underdevelopment (Non-grade-relevant):**  
  - Could explicitly contrast with measurement issues (e.g., "This isn’t about *whether* we can measure utility interpersonally, but *what we do* with measurements once we have them").  
  - **Grade note:** Analysis here is above passing threshold. Parfit link is a strength, not an error.  

  **Ambiguous Phrase:**  
  - "structural complaint Parfit makes... is really just the utility monster applied to population size"  
    - *Flag:* "Just" overclaims. The structural *similarity* is valid (aggregation overriding individual claims), but the Repugnant Conclusion isn’t derivative of the monster. *Don’t penalize* — this is a fruitful overextension.  

  ---

  ### (c) Utilitarian reply and evaluation (Mixed: Valid but underdeveloped)  
  **Strengths:**  
  - **Reply choice appropriate:** Average utilitarianism is a standard and relevant response to the monster.  
  - **Core critique correct:** Identifies that averaging "doesn’t automatically raise the average" (though phrasing is weak — see below).  
  - **Grasps Nozick’s deeper point:** Correctly notes that the reply fails to address "separate someone" (i.e., separateness of persons).  

  **Weaknesses (Grade-relevant):**  
  - **Underdeveloped reply:** Doesn’t explain *why* averaging might neutralize the monster (e.g., concentrating resources on one lowers average if others’ welfare plummets).  
  - **Evaluation too brief:** Asserts averaging "never answers" Nozick but doesn’t engage with *how* averaging might *partially* address aggregation (e.g., it avoids *totals* overriding individuals, but still permits sacrificing some for average gains).  
  - **Missed opportunity:** Fails to note that Nozick’s point applies *equally* to average utilitarianism (sacrificing individuals for higher averages still ignores separateness).  

  **Ambiguous Phrase:**  
  - "pouring everything into one creature doesn’t automatically raise the average"  
    - *Flag:* "Automatically" is vague. Does the student mean "not in all cases" (true) or "rarely" (debatable)? *Don’t penalize* — but this weakens the critique.  

  ---

  ### Where My Assessment Might Be Off  
  1. **Parfit link in (b):**  
     - *Defensible reading:* If the second marker views the Repugnant Conclusion as distinct (focusing on population ethics vs. resource distribution), they might see this as a stretch.  
     - *Grade impact:* Would soften analysis to a **high Pass (58-59)** if deemed tangential.  

  2. **"Doesn’t automatically" in (c):**  
     - *Defensible reading:* If the student meant averaging *can* sometimes endorse monster-like outcomes (e.g., if many have near-zero welfare), their critique holds. My reading assumes underdevelopment, but it might be deliberate.  
     - *Grade impact:* If intentional, part (c) rises to **low Good (60-63)**, boosting overall to **65**.  

  ---

  ### How to Move the Grade  
  - **To Excellent (70+):**  
    - (b) Explicitly contrast aggregation with measurement/inequality.  
    - (c) Engage with *why* averaging fails to respect separateness (e.g., "Even averages treat individuals as replaceable components").  
    - (c) Address alternative replies (e.g., rule utilitarianism, diminishing marginal utility).  

  - **To Pass (50-59):**  
    - If (b) omitted the Parfit link *and* didn’t explain why aggregation is distinct from inequality.  
    - If (c) misstated how averaging works (e.g., "The monster always lowers the average").  

  ---

  **Final Recommendation:**  
  This is a **solid Good (63)**. Part (b) is sophisticated, part (c) is correct but thin. The student clearly understands the target argument but needs to flesh out counterarguments. No major errors, only underdevelopment in (c). If the second marker agrees the Parfit link is valid, stand firm. If they dispute it, concede to **59**.
