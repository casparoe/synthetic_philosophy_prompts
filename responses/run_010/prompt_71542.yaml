  ### **Iterated Deletion with Mixed Strategies**  
  **Initial Strategies:** AlphaTech: {P, O, M}, BetaCorp: {A, B, C}.  

  **Round 1 (Delete AlphaTech’s *Maintain (M)*):**  
  - *M* dominated by mixed strategy \( \sigma_{\text{Alpha}} = 0.5P + 0.5O \).  
  - Verify against remaining BetaCorp strategies (A, B, C):  
    - A: \(0.5 \times 4 + 0.5 \times 5 = 4.5 > 0\)  
    - B: \(0.5 \times 0 + 0.5 \times 8 = 4 > 3\)  
    - C: \(0.5 \times 5 + 0.5 \times 0 = 2.5 > 0\)  
  - **Surviving:** AlphaTech: {P, O}, BetaCorp: {A, B, C}.  

  **Round 2 (Delete BetaCorp’s *Cautious (C)*):**  
  - *C* dominated by mixed strategy \( \sigma_{\text{Beta}} = 0.5A + 0.5B \).  
  - Verify against remaining AlphaTech strategies (P, O):  
    - P: \(0.5 \times 4 + 0.5 \times 5 = 4.5 > 0\)  
    - O: \(0.5 \times 0 + 0.5 \times 8 = 4 > 3\)  
  - **Surviving:** AlphaTech: {P, O}, BetaCorp: {A, B}.  

  **Round 3 (Delete AlphaTech’s *Pioneer (P)*):**  
  - *P* dominated by pure strategy *O* (since mixtures not needed):  
    - Against A: \(4 < 5\) (O better)  
    - Against B: \(0 < 8\) (O better)  
  - *O* strictly dominates *P* in reduced game.  
  - **Surviving:** AlphaTech: {O}, BetaCorp: {A, B}.  

  **Round 4 (Delete BetaCorp’s *Aggressive (A)*):**  
  - *A* dominated by pure strategy *B*:  
    - Against O: \(0 < 8\) (B better).  
  - **Surviving:** AlphaTech: {O}, BetaCorp: {B}.  

  **Unique Cell:** (O, B) = (8, 8).  

  **Deletion Order Independence:**  
  - If delete BetaCorp’s *C* first: Same outcome (deletion sequence above works).  
  - If delete dominated strategies simultaneously: Same result.  

