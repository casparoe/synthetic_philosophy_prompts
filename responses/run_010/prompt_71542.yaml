  ### **Best Responses and Nash Equilibria**  
  **Best-Response Functions (Original Game):**  
  - **AlphaTech’s best responses:**  
    - If Beta plays *A*: BR = O (5 > 4, 0).  
    - If Beta plays *B*: BR = O (8 > 0, 3).  
    - If Beta plays *C*: BR = P (5 > 0, 0).  
  - **BetaCorp’s best responses:**  
    - If Alpha plays *P*: BR = B (5 > 4, 0).  
    - If Alpha plays *O*: BR = B (8 > 0, 3).  
    - If Alpha plays *M*: BR = A (5 > 0, 0).  

  **Utopian Strategy *O* Never a Best Response:**  
  - *O* is BR only if Beta plays *A* or *B*, but not for *C*. However, linearity of expected utility ensures:  
    - If *O* were a BR to some belief, expected payoff must weakly dominate alternatives. But for beliefs where Beta plays *C* >0, *P* yields 5 > 0 (from *O*), so *O* is never a best response to any belief.  

  **Nash Equilibria:**  
  1. **(O, B) = (8, 8):**  
     - AlphaTech: If deviates to P (gets 0) or M (gets 3) < 8.  
     - BetaCorp: If deviates to A (gets 0) or C (gets 3) < 8.  
     - **Nash.**  
  2. **(P, C) = (5, 0):**  
     - AlphaTech: Deviating to O (gets 0) or M (gets 0) ≤ 5.  
     - BetaCorp: Deviating to A (gets 4) > 0 or B (gets 5) > 0.  
     - **Not Nash** (BetaCorp can deviate profitably).  
  3. **(M, A) = (0, 5):**  
     - AlphaTech: Deviating to P (gets 4) > 0 or O (gets 5) > 0.  
     - **Not Nash.**  
  4. **No other pure NEs.**  
  5. **Mixed Nash?**  
     - Suppose Alpha plays *O* with prob *p*, Beta plays *B* with prob *q*.  
     - But (O, B) is strict NE, and deletion leaves only this cell.  
     - **Unique Nash:** (O, B) = (8, 8).  

