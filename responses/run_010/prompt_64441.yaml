  Okay, let's tackle this user's request. They're a third-year history student creating a satirical museum guide for a historiography seminar. The core idea is to exaggerate Whig history principles, where every artifact is only described by what it led to, not its own context. 

  First, I need to ensure the piece stands alone without theory jargon. The user mentioned avoiding terms like "presentism" or "teleology," so the satire must be evident through the exhibit descriptions alone. The museum's name—Museum of the Long Run—and its sponsor, Veridian Horizon Foundation, set the tone of progress-driven narrative.

  The user specified six rooms. Room 1 (Paleolithic) should show minimal artifact description, focusing on future implications. Including "Acheulean Handaxe Cluster" as stepping stones to modern tools emphasizes the thin descriptions early on. The "temporarily closed" room for a dead-end civilization (Room 3: Carthage) handles the "enormous that led nowhere" requirement. Using a closed room with a dismissive note subtly conveys institutional dismissal.

  For anachronistic vocabulary, Room 4 (Medieval Europe) labels guilds as "proto-corporate structures" and Room 5 (Early Modern) calls pamphlets "social media." This injects modern political language into historical contexts, as requested. The audio guide's "little did they know" phrases and the children's track's oversimplified "Onward!" reinforce the Whig narrative without explicit commentary.

  The interactive touchscreen with a chime for "correct" placements satirizes biased historical judgment. Including a dissenting comment card in the gift shop, repurposed into merchandise, shows institutional absorption of critique. The curatorial statement's sincerity is crucial—phrasing it as "giving the past its due destination" makes the satire sharper because they genuinely believe they're honoring history.

  I need to invent artifacts instead of real ones to avoid Wikipedia-esque feel. Using specific, mundane objects like "Wool Guild Ledger" adds authenticity. The gift shop's "Onward! Board Game" and "Little Did They Know" tea towels turn dissent into commodities, highlighting how criticism is neutralized.

  Finally, maintaining deadpan delivery throughout ensures the humor comes from the exhibit's inherent absurdity. The assistant curator's Post-it note and its removal by facilities staff show institutional mechanisms suppressing dissent. This meets the user's requirement for subtle, layered satire that works for both historiographers and laypersons.
