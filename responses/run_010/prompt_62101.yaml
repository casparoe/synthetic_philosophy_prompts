  Stage 2: the non-indexical evidence is that there is at least one interview. But that is true under both -> no update.

  Thus, both stages do not update, so remains 1/2.

  Therefore, the results are robust.

  9. What the protagonist knows that the control agent does not:

  The control agent knows the protocol but doesn't know the outcome of the coin and is not interviewed. The protagonist additionally knows that she is interviewed.

  On positions (i) and (ii), this extra information (that she is interviewed) is evidence about H versus L. Specifically, it is more likely under L than under H (by a factor of 10). So it is evidence that supports L over H.

  10. Objection:

  The objection: positions (iii) and (iv) are the only defensible ones because the fact that the protagonist is interviewed is not informative about H versus L. Why? Because in both H and L, someone is interviewed. The protagonist's being interviewed is a trivial fact: it had to happen to someone, and it doesn't convey any information about the coin. Therefore, the update to 1/11 in (i) and (ii) is misguided.

  The case survives this objection? In the sense that we have built the case to expose the fault line. The objection is exactly what the proponent of (iii) and (iv) would say. But the proponent of (i) and (ii) would counter that the fact that the protagonist is the one who is interviewed is informative because it is more likely under L that she would be interviewed (since more people are interviewed under L). And that is the essence of the disagreement.

  The case does survive the objection in the sense that it cleanly separates the two pairs of positions. The objection is the heart of the debate.

  Summary of the case:

  Setting: A factory with 100 workers. A fair coin flip determines the inspection type: 
  - Heads (H): light inspection, only 1 worker randomly selected for interview.
  - Tails (L): heavy inspection, 10 workers randomly selected for interview.

  Alice is called for an interview. She knows the protocol.

  Hypotheses: H and L, each prior 1/2.

  Computations:

  Position (i) SSA broad (reference class: all 100 workers):
     P(interviewed | H) = 1/100
     P(interviewed | L) = 10/100 = 1/10
     Posterior odds = (1/2 * 1/100) / (1/2 * 1/10) = (1/100) / (1/10) = 1/10
     P(H) = 1/11, P(L)=10/11

  Position (ii) SIA:
     Posterior odds = (P(H) * number interviewed under H) / (P(L) * number interviewed under L) = (1/2 * 1) / (1/2 * 10) = 1/10
     P(H)=1/11, P(L)=10/11

  Position (iii) SSA narrow (reference class: workers who are interviewed):
     The evidence is that Alice is in the reference class (i.e., interviewed). 
     But under both H and L, if she is interviewed, then she is in the reference class. Therefore, the likelihood ratio is 1.
     Posterior odds = 1:1 -> P(H)=1/2, P(L)=1/2.

  Position (iv) Conditionalization on non-indexical evidence:
     Non-indexical evidence: there is at least one interview. This is true under both H and L. So no update -> P(H)=1/2, P(L)=1/2.

  Thus, the case is constructed.
answer: |-
  ### Case Construction: The Factory Inspection

  **Setting:**  
  A factory with 100 employees undergoes a surprise inspection. A fair coin is flipped to determine the inspection type:  
  - **Heads (H):** Light inspection. Only 1 employee is randomly selected for a private interview.  
  - **Tails (L):** Heavy inspection. 10 employees are randomly selected (without replacement) for private interviews.  

  The protagonist, Alice (a factory employee), is selected for an interview. Alice knows the entire protocol: the factory has 100 employees, the coin is fair (P(H) = P(L) = 1/2), and the interview numbers (1 under H, 10 under L). She observes nothing in the interview room that distinguishes H from L (e.g., no visible lists or schedules). The same 100 employees exist and are present under both hypotheses; only the number interviewed varies.  

  **Control Agent:**  
  A regulator who knows the protocol but has not observed the coin outcome and is not being interviewed. This agent assigns P(H) = 1/2, P(L) = 1/2.  

  **Key Numbers:**  
  - Under H: 1 employee interviewed.  
  - Under L: 10 employees interviewed.  
  - Ratio: 10:1 (L to H).  

  ---

  ### Required Computations  
  *Evidence for Alice:* "I am interviewed" (denoted \(E_{\text{index}}\)).  
  *Non-indexical evidence:* "At least one interview occurs" (denoted \(E_{\text{non-index}}\)). This is true under both H and L.  

  #### (i) SSA (Broad Reference Class)  
  - **Reference class:** All factory employees (100 employees, fixed under both hypotheses).  
  - SSA: Reason as if you are a random sample from this class.  
  - Likelihoods:  
    - P(Alice interviewed | H) = 1/100  
    - P(Alice interviewed | L) = 10/100 = 1/10  
  - Posterior odds (H:L):  
    \[
    \frac{P(H) \cdot P(E_{\text{index}} | H)}{P(L) \cdot P(E_{\text{index}} | L)} = \frac{(1/2) \cdot (1/100)}{(1/2) \cdot (1/10)} = \frac{1/200}{1/20} = \frac{1}{200} \cdot \frac{20}{1} = \frac{1}{10}
    \]  
  - Credences:  
    - P(H) = \( \frac{1}{1 + 10} = \frac{1}{11} \)  
    - P(L) = \( \frac{10}{11} \)  

  #### (ii) SIA  
  - SIA: Weight hypothesis by the number of observers with your evidence.  
  - Observers with evidence (interviewed): 1 under H, 10 under L.  
  - Posterior odds (H:L):  
    \[
    \frac{P(H) \cdot \text{number interviewed under H}}{P(L) \cdot \text{number interviewed under L}} = \frac{(1/2) \cdot 1}{(1/2) \cdot 10} = \frac{0.5}{5} = \frac{1}{10}
    \]  
  - Credences:  
    - P(H) = \( \frac{1}{11} \)  
    - P(L) = \( \frac{10}{11} \)  

  #### (iii) SSA (Narrow Reference Class)  
  - **Reference class:** Interviewed employees (size depends on hypothesis: 1 under H, 10 under L).  
  - SSA: Reason as if you are a random sample from this class.  
  - Evidence: "I am in the reference class" (i.e., interviewed). Under both H and L, if Alice is interviewed, she is in the reference class with certainty.  
  - Likelihoods:  
    - P(Alice in reference class | H) = 1 (since reference class = {Alice} under H)  
    - P(Alice in reference class | L) = 1 (since Alice is one of the 10 interviewed)  
  - Likelihood ratio = 1, so no update from prior.  
  - Credences:  
    - P(H) = 1/2  
    - P(L) = 1/2  

  #### (iv) Conditionalization on Non-Indexical Evidence  
  - **Evidence:** \(E_{\text{non-index}}\) = "At least one interview occurs" (true under both H and L).  
  - Likelihoods:  
    - P(\(E_{\text{non-index}}\) | H) = 1  
    - P(\(E_{\text{non-index}}\) | L) = 1  
  - Likelihood ratio = 1, so no update from prior.  
  - Credences:  
    - P(H) = 1/2  
    - P(L) = 1/2  

  **Summary of Credences:**  
  | Position                 | P(H)    | P(L)     |  
  |--------------------------|---------|----------|  
  | (i) SSA (broad)          | 1/11    | 10/11    |  
  | (ii) SIA                 | 1/11    | 10/11    |  
  | (iii) SSA (narrow)       | 1/2     | 1/2      |  
  | (iv) Non-indexical cond. | 1/2     | 1/2      |  

  - (i) and (ii) agree: P(H) = 1/11, P(L) = 10/11.  
  - (iii) and (iv) agree: P(H) = 1/2, P(L) = 1/2.  
  - The pairs differ: (i)/(ii) ≠ (iii)/(iv).  

  ---

  ### 6. Wager  
  **Proposition:** Bet that pays $1 if H (light inspection) is true, $0 if L is true.  
  **Stakes:** Cost of $0.20 (reasonable for a graduate student).  

  - **Reservation Prices (maximum willingness to pay):**  
    - (i) SSA (broad) and (ii) SIA: P(H) = 1/11 ≈ $0.0909. Bet value = $0.0909, so reject at $0.20 (expected loss: $0.1091).  
    - (iii) SSA (narrow) and (iv) Non-indexical: P(H) = 1/2 = $0.50. Bet value = $0.50, so accept at $0.20 (expected gain: $0.30).  

  **Outcome:**  
  - (i) and (ii) reject the bet at $0.20.  
  - (iii) and (iv) accept the bet at $0.20.  

  ---

  ### 7. Structural Explanation of Coincidences  
  **Coincidence of (i) and (ii):**  
  - **Feature:** The reference class size (100 employees) is fixed and identical under H and L.  
    - SSA (broad) likelihood ratio: \(\frac{\text{P(interviewed | H)}}{\text{P(interviewed | L)}} = \frac{1/100}{10/100} = \frac{1}{10}\).  
    - SIA update factor: \(\frac{\text{number interviewed under H}}{\text{number interviewed under L}} = \frac{1}{10}\).  
  - **Why equality is forced:** The SSA fraction equals the SIA ratio because the reference class size cancels out, leaving only the ratio of interview counts.  
  - **Smallest change to break:** Alter the reference class size to differ between H and L (violating constraint 3). Suppose under H, the factory has 200 employees (still 1 interviewed), but under L, 100 employees (10 interviewed).  
    - New SSA (broad) likelihood ratio: \(\frac{1/200}{10/100} = \frac{1}{20}\).  
    - SIA update factor: \(\frac{1}{10}\).  
    - Result: (i) P(H) = \( \frac{1}{21} \), (ii) P(H) = \( \frac{1}{11} \). Coincidence broken.  

  **Coincidence of (iii) and (iv):**  
  - **Feature:** The evidence used in (iii) ("I am interviewed") and (iv) ("at least one interview occurs") is equally uninformative about H vs. L.  
    - (iii) SSA (narrow): Conditioning on being in the reference class (interviewed) is certain under both H and L → likelihood ratio = 1.  
    - (iv) Non-indexical: \(E_{\text{non-index}}\) is true under both H and L → likelihood ratio = 1.  
  - **Why equality is forced:** Both positions condition on evidence that is hypothesis-independent (i.e., the likelihood ratio is 1 in both cases).  
  - **Smallest change to break:** Make the non-indexical evidence informative. Suppose under H, there is a 50% chance of no inspection (no interviews). Under L, inspections always occur.  
    - New non-indexical evidence: "An inspection occurs" (true with P=0.5 under H, P=1 under L).  
    - (iii) SSA (narrow) unchanged: P(H) = 1/2 (still conditions on being interviewed).  
    - (iv) Non-indexical: Updates to P(H) = \( \frac{(1/2) \cdot 0.5}{(1/2) \cdot 0.5 + (1/2) \cdot 1} = \frac{1/4}{3/4} = \frac{1}{3} \).  
    - Result: (iii) P(H) = 1/2, (iv) P(H) = 1/3. Coincidence broken.  

  ---

  ### 8. Robustness to Two-Stage Evidence  
  Suppose Alice learns in two stages:  
  - **Stage 1:** She exists and is a factory employee (but not yet interviewed).  
  - **Stage 2:** She is interviewed.  

  **Stage 1 Update:**  
  - All positions: Learning "I am a factory employee" is uninformative because both H and L have 100 identical employees. No update: P(H) = 1/2.  

  **Stage 2 Update:**  
  - **(i) SSA (broad):** Same as one-shot: P(interviewed | H) = 1/100, P(interviewed | L) = 1/10 → P(H) = 1/11.  
  - **(ii) SIA:** Same as one-shot: Update by interview count ratio (1:10) → P(H) = 1/11.  
  - **(iii) SSA (narrow):** Reference class = interviewed employees. Evidence: "I am in this class" → certain under both H and L → no update: P(H) = 1/2.  
  - **(iv) Non-indexical:** Evidence \(E_{\text{non-index}}\) = "At least one interview occurs" → true under both → no update: P(H) = 1/2.  

  **Conclusion:** Credences unchanged from one-shot case. Robust.  

  ---

  ### 9. Protagonist's Extra Knowledge  
  - **What Alice knows that the control agent does not:** "I am interviewed" (\(E_{\text{index}}\)).  
  - **On positions (i) and (ii):**  
    - This extra item is evidence about H vs. L. It is more likely under L (10x more likely under SSA-broad/SIA), so it favors L.  
  - **On positions (iii) and (iv):**  
    - This extra item is not evidence about H vs. L. It is only about Alice's identity (trivial indexical fact).  

  ---

  ### 10. Objection and Defense  
  **Strongest Objection:**  
  "(iii) and (iv) are the only defensible positions. The fact that Alice is interviewed is trivial: under both H and L, someone is interviewed, and Alice learns nothing beyond the protocol. Treating this as informative (as in (i)/(ii)) commits the 'double-counting fallacy' or mistakes indexical ignorance for worldly evidence. The case illicitly treats a necessary consequence of the setup as new information."  

  **Does the Case Survive?**  
  **Yes.** The objection is precisely the fault line the case exposes:  
  - **For (iii)/(iv):** The objection holds. Being interviewed is a logical consequence of the setup (since interviews occur under both hypotheses) and reveals nothing about H vs. L.  
  - **For (i)/(ii):** The objection fails. Alice's specific identity as the interviewed person is informative because it is less likely under H (where only 1/100 are interviewed) than under L (where 10/100 are interviewed). This likelihood difference drives the update.  

  The case survives because it cleanly separates the positions without cheating:  
  - Reference classes are defensible independently.  
  - No hidden information leaks (e.g., Alice learns only she is interviewed).  
  - The verdicts emerge from each position's machinery.  

  --- 

  **Final Remarks**  
  This case ("The Factory Inspection") isolates the SSA/SIA agreement/disagreement structure in an ordinary setting, free from exotic elements. It forces agreement between SSA (broad) and SIA via a fixed reference class, and between SSA (narrow) and non-indexical conditionalization via uninformative evidence. The wager and structural analysis highlight the core disagreement: whether indexical evidence ("I am interviewed") carries worldly information or is merely self-locating noise.
