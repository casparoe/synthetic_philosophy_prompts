  Position (iii) SSA narrow: the reference class is the interviewed workers. But at stage 1, she doesn't know she is interviewed. So after stage 1, she only knows she is a worker. Then at stage 2, she learns she is interviewed.

  But in the narrow reference class approach, we are to use the reference class of interviewed workers. However, at stage 1, we haven't defined the reference class yet? We can only define it after we know the evidence? This is messy.

  Alternatively, we can compute the update:

  After stage 1: she knows she is one of the 100 workers. Then at stage 2: she learns she is interviewed.

  The evidence at stage 2: she is interviewed.

  The likelihood of this evidence given H and given L, conditional on being a worker?

  Under H: the probability that she is interviewed given that she is a worker and H is 1/100.
  Under L: 10/100.

  So the likelihood ratio is 1/10 -> P(H) becomes 1/11? But that is not what we had before for (iii). 

  But wait: in our earlier (iii) we used the narrow reference class and got 1/2. This two-stage update gives 1/11? So the result changes? Then it's not robust.

  We must be consistent. In the one-shot update, we argued that (iii) uses the narrow reference class and conditions on being interviewed, so no update. But in the two-stage, if we update on being interviewed after knowing we are a worker, we get the same as (i).

  This indicates that the narrow reference class approach is not well-defined for sequential update.

  To avoid this, we must define the reference class independently of the evidence. The narrowest reference class we defend is the class of interviewed workers. But then, when we get the first-stage evidence (we are a worker), we are not in the reference class yet. Then when we get the second-stage evidence (we are interviewed), we update by conditioning on being in the reference class. Then, since we are now in the reference class, the likelihood ratio is 1? So:

  After stage 1: P(H)=1/2.
  After stage 2: we learn we are interviewed (i.e., in the reference class). Then, as argued before, the probability of being in the reference class is 1 under both? So no update -> P(H)=1/2.

  Thus, for (iii) we must stick to the interpretation that when using the narrow reference class, we update only on the fact that we are in that class, and that is uninformative. Therefore, the two-stage update for (iii) should be:

  - Stage 1: no update (because both hypotheses have 100 workers, and we are one of them, so no change).
  - Stage 2: we update on being in the narrow reference class (interviewed). But since the reference class is defined as the interviewed workers, and we are now in it, we assign likelihood 1 to both -> no update.

