              Let X be an indicator of one aspect of the bank (say, liquidity) and Y for another (say, solvency). The bank fails if these two factors are aligned? Maybe that's artificial.

          Alternatively, we can have a simpler setup:

            The regulator is uncertain about the bank's true risk because it depends on two parameters (p1 and p2) that are not known precisely. The prior set for (p1,p2) is a rectangle [0.4,0.6]x[0.4,0.6]. The event H (bank failure) is defined as an event that is a function of p1 and p2 (like in the example above). The bank is going to release an announcement that is about one of the parameters. For instance, the bank might release the result of a test that is informative about liquidity (X) but not about solvency (Y). Then, conditioning on the outcome of the liquidity test (which is a binary event, say X=1) leads to a posterior set for H that is wider.

          The bank, knowing the regulator uses imprecise credences, can choose to release an announcement that will cause the interval for the failure probability to widen. This makes the regulator's belief less precise, which might be desirable for the bank (e.g., to avoid regulatory action that is triggered by a high probability of failure, or to create uncertainty that delays action).

   Step 2: The problem with dilation in regulation.

     The regulator's job is to monitor the bank and take action if the risk is too high. Having a wide interval might make it harder to act (because the risk might be considered too ambiguous). The bank can strategically choose which announcement to make to induce this widening.

     Note: the regulator already knows that the announcement is coming and knows how to condition on it. But the set of posteriors might widen regardless.

   Step 3: Why is this structural?

     Dilation is a known phenomenon in imprecise probability. It arises because the set of priors might be too large, and conditioning can lead to a situation where the evidence is more ambiguous for some priors than others. It is not an artifact of a particular model but a consequence of the representation of ambiguity by sets.

   Step 4: Point estimate with error bars does better.

     In the precise Bayesian approach, the regulator has a single prior over the parameters (p1,p2). For example, she might use a prior that is the product of two Beta distributions. Then, conditioning on the announcement (say, about X) will update the distribution on p1 and leave the distribution on p2 unchanged. The posterior for H (which is a function of p1 and p2) will then be computed by integrating over the posterior of (p1,p2). The posterior distribution for H will typically become more concentrated (narrower) as we get more data.

     Even if the prior is not concentrated, the updating will not lead to arbitrary widening. In fact, with more data, the posterior will concentrate around the true values.

     Moreover, the regulator can report a point estimate (the mean of the posterior for P(H)) and an error bar (a credible interval) that will generally shrink with data.

     The bank cannot force the credible interval to widen arbitrarily by choosing which announcement to release. In fact, any announcement will provide some information and thus should typically reduce uncertainty.

   Step 5: Addressing the defenses.

     Defense 1: Dilation is just ambiguity doing its job.

       Yes, when you get evidence that is ambiguous (in the sense that it doesn't help to pin down the parameters) then your set of posteriors might remain wide or even widen. But in our scenario, the bank can choose to release an announcement that it knows will cause dilation. This is problematic because the regulator's belief becomes less precise even though the regulator is learning something. The regulator is left with an interval that is uninformative and might be wider than necessary for decision making.

     Defense 2: Sharp priors are fake precision.

       The imprecise Bayesian avoids committing to a single prior, which might be arbitrary. But the problem is that by refusing to commit, the imprecise Bayesian becomes vulnerable to manipulation. The regulator must balance the risk of arbitrariness against the risk of manipulation. In the regulatory context, manipulation by the regulated entity is a serious concern. Moreover, the precise Bayesian can use a prior that is broad (e.g., a Beta prior with large variance) to represent initial uncertainty, and then update as data comes in. The posterior will eventually converge to the truth. The imprecise approach, by contrast, might remain persistently vulnerable to dilation.

     Defense 3: The agent isn't required to have a view she can't support.

       The regulator might feel that she doesn't have enough information to form a sharp prior. But note: the imprecise approach doesn't solve the problem of what set to choose. The set itself is a commitment. And if the set is too large (like [0,1] for the coin biases) then dilation is severe. If the set is chosen to be narrow enough to avoid dilation, then it might be arbitrary anyway. Moreover, the requirement for regulation is to make decisions. A decision maker must ultimately form a single probability (or at least a single expected utility) to act. The imprecise approach pushes the arbitrariness to the decision rule (e.g., maxmin expected utility). But then the bank can still manipulate the set to make the maxmin decision change arbitrarily.

   Step 6: Why the defenses still lose.

       In the regulatory context, the vulnerability to strategic manipulation by the regulated entity is unacceptable. The imprecise approach, while motivated by a desire to avoid unwarranted precision, creates an opportunity for the bank to inject more ambiguity into the regulator's belief. This is a structural flaw because it is inherent in the use of sets of probabilities. The precise Bayesian approach, even if it starts with a broad prior, will not be vulnerable to this kind of manipulation: any new information, regardless of which announcement the bank chooses, will reduce (or at least not increase) the uncertainty (as measured by the variance or the width of a credible interval) about the failure probability.

       Moreover, the precise Bayesian can report a credible interval that honestly reflects the remaining uncertainty. That interval will tend to shrink with more data. The imprecise approach, by contrast, might see its interval expand due to the strategic release of information.

