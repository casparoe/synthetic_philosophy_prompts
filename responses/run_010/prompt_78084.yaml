     The regulator has a set of priors (each is a probability function) that are consistent with the interval [0.1,0.3] for H. But each prior also has a model for how A and B are generated given H.

     For dilation to occur, we can set up the likelihoods such that after seeing an announcement, the set of posteriors for H becomes wider.

     A classic dilation example: 

       Let H be a fair coin flip (so true P(H=1)=0.5). But the regulator does not know it's fair. She has a set of priors: each prior corresponds to a Bernoulli with p in [0.1,0.3]. However, the announcement is about a different event that is correlated with H.

