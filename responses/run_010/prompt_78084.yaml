prompt: |-
  hey — I cover science and ideas for a general-interest magazine and I'm working on a piece about the fashion for ranges over point estimates: superforecasters, the IPCCs probability language, AI labs publishing bands instead of numbers. A lot of the philosophers behind this say your credence should literally be a set of probability functions when the evidence is ambiguous, and I think that's a mistake but I cant yet say why crisply. Can you make the case against it for me?

  Specifically: argue that a rational agent should never hold imprecise credences, using dilation as the wedge — the fact that an agent's interval for a hypothesis can get wider, not narrower, on learning something. Don't hand-wave it. Work inside this setup I've been chewing on: a regulator publishes an interval for the chance a given bank fails within a year. The bank gets to choose, from a menu of near-costless announcements it has pre-cleared with her, the one it will release next — a resignation, a restructuring, a change of auditor — and every item on the menu is something she already knew was coming and already knew how to condition on. Argue that imprecise Bayesianism hands the regulated party a lever on the regulator's own epistemic state, that this is structural rather than a bug you can engineer away, and that a point estimate with honest error bars does strictly better. Where the usual defenses bite back — dilation is just ambiguity doing its job, sharp priors are fake precision, the agent isn't required to have a view she can't support — say so fairly and then explain why they still lose.

  At the bottom, give me a structured summary as a JSON object with exactly these fields: "thesis" (one sentence), "load_bearing_premises" (array of short strings), "the_regulator_case_in_one_line", "strongest_counter", "why_it_still_fails", "what_a_precise_bayesian_owes_instead".
