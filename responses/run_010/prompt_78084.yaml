answer: |-
  ### The Case Against Imprecise Credences: Dilation as the Fatal Flaw

  **The Core Argument**  
  Imprecise Bayesianism, which represents beliefs as sets of probability functions, is structurally vulnerable to *dilation*—a phenomenon where learning new evidence *widens* the interval estimate for a hypothesis. In regulatory contexts like banking oversight, this grants regulated entities (e.g., banks) a lever to deliberately increase the regulator’s uncertainty. Unlike precise Bayesianism (point estimates with error bars), which ensures evidence monotonically refines beliefs, imprecise credences permit strategic actors to exploit ambiguity, undermining epistemic integrity and decision-making.

  #### The Bank-Regulator Case: How Dilation Enables Manipulation
  - **Setup**: A regulator holds an imprecise credence for the probability of bank failure—say, the interval [0.1, 0.3]. The bank selects a pre-cleared announcement (e.g., "CEO resigns," "auditor changed") from a menu. The regulator already knows each announcement’s *likelihood model* (how it correlates with failure) but has an *imprecise prior* over the failure probability.  
  - **Dilation in Action**:  
    Suppose the regulator’s prior set includes functions where:  
    - If failure is *likely*, announcement A is uninformative (e.g., P(A|failure) = 0.5, P(A|no failure) = 0.5).  
    - If failure is *unlikely*, A is highly informative (e.g., P(A|failure) = 0.9, P(A|no failure) = 0.1).  
    After observing A, the posterior interval for failure probability dilates to [0.05, 0.35]. The bank knew this would occur and chose A specifically to *inflate uncertainty*, making regulatory action (e.g., intervention) less justifiable.  
  - **Why This Is Structural**:  
    Dilation arises from the *interaction* between imprecise priors and ambiguous evidence. The bank’s menu exploits this by offering announcements that, under *some* priors in the set, are uninformative, but under others, are highly informative. Since the imprecise Bayesian cannot rule these out, the posterior interval *must* widen to cover all extreme updates. No "engineering fix" (e.g., restricting prior sets) works without arbitrary precision—which defeats imprecise Bayesianism’s purpose.  

  #### Why Precise Bayesianism Dominates
  A precise Bayesian regulator:  
  - Holds a *single prior* (e.g., a Beta distribution) yielding a point estimate (e.g., 0.2) with error bars (e.g., 90% CI: [0.15, 0.25]).  
  - On seeing an announcement, *narrows* the CI (e.g., to [0.18, 0.22])—even for ambiguous evidence—because updating *concentrates* probability mass.  
  - **Blocks Manipulation**: The bank cannot widen the interval; all announcements reduce expected entropy. Honest error bars shrink monotonically with evidence, preventing strategic ambiguity injection.  

  #### Rebutting Defenses of Imprecise Credences  
  1. **"Dilation is just ambiguity doing its job!"**  
     - *Counter*: True, dilation reflects unresolved ambiguity. But in strategic settings, it becomes a *weapon*. The bank forces the regulator into *more* ambiguity than the evidence justifies—violating the principle that learning should never *increase* net uncertainty.  
     - *Why it fails*: If ambiguity’s "job" is to honestly represent ignorance, letting regulated actors *control* that ignorance corrupts the epistemology. Dilation becomes a bug, not a feature.  

  2. **"Sharp priors are fake precision!"**  
     - *Counter*: Precise priors need not be dogmatic; they can use broad distributions (e.g., uniform or high-variance Beta priors) to model ignorance. Crucially, they *improve with evidence* and avoid dilation.  
     - *Why it fails*: Imprecise sets *also* require arbitrary choices (e.g., interval width). The difference? Precise posteriors *converge* to truth; imprecise ones can be kept perpetually wide by adversarial evidence selection.  

  3. **"Agents shouldn’t hold unsupported views!"**  
     - *Counter*: Rejecting point estimates to avoid "unsupported" precision ignores that *decisions demand actionability*. A regulator must eventually decide whether to intervene. Imprecise credences push arbitrariness to the decision stage (e.g., using minimax rules), where banks can *still* exploit wide intervals to deter action.  
     - *Why it fails*: The bank’s lever makes the regulator’s "unsupported view" problem *worse*. By inducing dilation, the bank ensures the regulator *never* has enough precision to act confidently—effectively paralyzing oversight.  

