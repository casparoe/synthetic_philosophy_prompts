          Let H be as above. Now, let the announcement be generated as follows:

            If H=1, then the announcement is either A or B with equal probability (0.5 each).
            If H=0, then the announcement is A with probability 0.9 and B with probability 0.1.

          Now, suppose the regulator has a set of priors for P(H=1) in [0.1,0.3]. What happens when she conditions on A?

          We compute the posterior for H=1 given A for a specific prior p = P(H=1):

