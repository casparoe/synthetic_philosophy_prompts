   We are to argue that:
     1. Imprecise Bayesianism gives the bank a lever to make the regulator's interval wider (less precise) at will.
     2. This is structural (not a bug that can be fixed by engineering).
     3. A point estimate with honest error bars (a precise Bayesian approach) does strictly better.

   We must address the usual defenses:
     - Dilation is just ambiguity doing its job: when you get ambiguous evidence, your uncertainty should increase.
     - Sharp priors are fake precision: we don't have enough information to have a single prior.
     - The agent isn't required to have a view she can't support.

   Then explain why these defenses still fail in this context.

