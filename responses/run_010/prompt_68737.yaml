  So they have to assign an order? They might say: "arbitrarily order the set and then list them in that order". But that requires a well-ordering, which is full AC? And they are making one choice of an ordering? But then the sequence is determined. But the procedure must work for any infinite set? They cannot write a rule to order an arbitrary set.

  They fail.

  Round 4 (60-75 min):
