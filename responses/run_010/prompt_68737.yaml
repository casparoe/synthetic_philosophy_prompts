  ### Workshop Design: Understanding the Role of Choice in Proofs

  This workshop is designed to address the specific error your students made in proving that a countable union of countable sets is countable (by "fixing an enumeration" without justification) and their subsequent objections. The core goal is to help them distinguish between four scenarios of making choices:  
  1. **Finitely many choices** (unproblematic).  
  2. **Countably many choices simultaneously** (requires Countable Choice).  
  3. **Countably many choices with dependence** (requires Dependent Choice).  
  4. **Uncountably many choices or choices from unstructured families** (requires full Axiom of Choice).  

  Students will engage in hands-on tasks to experience why some choices require an axiom, emphasizing that the key issue is the absence of a **rule** (a definable, executable procedure), not the number of choices. The workshop uses physical materials to make abstract concepts tangible, avoids lectures, and centers on student-led discovery. The debrief connects the activities to proofs from your syllabus, clarifying misconceptions.

  ---

  ### Materials List (for 24 Students, 6 Groups of 4)
  - **Index cards**: 150 blank cards (25 per group, plus extras).  
  - **Small envelopes**: 60 envelopes (10 per group).  
  - **Opaque bags/boxes**: 12 bags/boxes (2 per group).  
  - **Paper slips**: 120 slips (20 per group, pre-printed with random symbols, e.g., ♠, ♣, ♥, ♦, or unique numbers; 10 unique symbols per group, duplicated as needed).  
  - **Pens/pencils**: 24 (1 per student).  
  - **Group handouts**: 6 sheets (1 per group) with task instructions (minimal text; tasks also written on a central board).  
  - **Whiteboard/blackboard**: For debrief and scoring.  
  - **Tokens for scoring**: 100 small tokens (e.g., buttons or beads; 15–20 per group).  

  **Why these materials?**  
  - Envelopes and bags create "black boxes" to simulate sets with hidden elements, forcing students to confront the need for rules.  
  - Symbols/numbers on slips allow flexibility: they can represent abstract elements or be ignored to simulate lack of structure.  
  - Groups of 4 promote discussion while keeping tasks manageable.

  ---

  ### Scoring/Incentive Scheme
  **Goal**: Reward groups for writing **explicit, choice-free procedures** that another group can execute without ambiguity. Discourage arbitrary choices ("just pick one") by making them worthless.  
  **Scheme**:  
  - Each task is worth **2 points**.  
  - Points are awarded only if the procedure:  
    - Specifies a **deterministic rule** (e.g., "pick the smallest number," "always take the leftmost envelope").  
    - Avoids phrases like "arbitrarily choose," "pick any," or "fix one."  
    - Can be executed by another group (tested by swapping procedures).  
  - Groups earn tokens for points (visual motivation).  
  - **Enforcement**:  
    - At the start, state: "If your procedure uses the word 'arbitrary' or implies a choice without a rule, it scores 0. Your rule must be like a computer program: no human judgment needed."  
    - During tasks, circulate and gently interrupt if groups say "pick one" in discussion. Redirect: "How would you tell an alien to do this without deciding anything?"  
    - When swapping procedures, groups lose points if the executing group cannot follow the rule exactly.  

  **Why this works**:  
  - Focuses on the **rule** as the objective standard, not intuition.  
  - Peer execution (swapping) makes abstract concepts concrete and exposes vagueness.  
  - Tokens create light competition but de-emphasize speed/confidence.

  ---

  ### Minute-by-Minute Timeline (90 Minutes Total)
  **Key principle**: Let groups struggle at critical points (*marked with ⚠️*) to internalize why choices fail without rules. Intervene only to clarify tasks or maintain focus.  

  - **0–5 min: Introduction (5 min)**  
    - Form 6 groups of 4.  
    - State workshop goal: "Learn when your proof needs an explicit rule for choices, and when it doesn’t."  
    - Explain scoring: "Earn points by writing rules so clear that another group can follow them blindly. No arbitrary choices!"  
    - Assign groups to tables with materials.  

  - **5–20 min: Round 1 – Finitely Many Choices (15 min)**  
    - **Task**: "Each group has 3 envelopes. Inside: Envelope 1 contains {1, 2, 3}, Envelope 2 contains {4, 5}, Envelope 3 contains {6, 7, 8, 9} (on slips). Write a procedure to pick one element from each envelope. Swap with another group and execute their rule."  
    - **Goal**: Succeed easily with a rule (e.g., "pick the smallest number"), showing finitely many choices are unproblematic.  
    - **Scoring**: Award 2 points per group if rule works. All should succeed.  
    - **⚠️ Let them struggle?** No. This builds confidence. Intervene only if a group uses "arbitrary."  

  - **20–40 min: Round 2 – Countably Many Choices Simultaneously (20 min)**  
    - **Task**: "Prove: 'A countable union of countable sets is countable.' You have 10 envelopes (representing a countable family). Each contains a countable set (slips with symbols, e.g., ♠, ♣, ♥, ♦). Write a procedure to fix an enumeration for each set (e.g., list its elements) and then diagonalize to enumerate the union. Your rule must work for any family of countable sets."  
    - **Setup**: Envelopes contain identical symbols (e.g., all ♠ in Envelope 1, all ♣ in Envelope 2) to tempt students toward arbitrary choices.  
    - **Goal**: Fail to write a rule. Students will try "fix any enumeration," but swapping exposes ambiguity (e.g., Group A’s "arbitrary" differs from Group B’s execution).  
    - **Scoring**: 0 points for arbitrary choices. Award 0–2 points only if a group invents a structured rule (e.g., "order symbols alphabetically" – but symbols lack order, so this fails when groups swap).  
    - **⚠️ Let them struggle?** Yes. At 25 min, ask: "Could another group execute this without you?" Let them realize no rule exists. At 35 min, have one group present; others see their procedure fails when swapped.  

  - **40–60 min: Round 3 – Dependent Choice (20 min)**  
    - **Task**: "Build an infinite sequence of distinct elements from an infinite set. Use a bag of 20 unique tokens (symbols/numbers). Your procedure must define the entire sequence at once (e.g., 'pick token X first, Y second, ...'), not step-by-step."  
    - **Setup**: Tokens have numbers (e.g., 1–20), but instruct: "Ignore numbers; treat tokens as identical except for distinctness."  
    - **Goal**: Fail to define a full sequence without step-by-step choices. Students will try "pick tokens arbitrarily," but scoring forces them toward rules (e.g., "sort tokens by number" – but numbers are disallowed).  
    - **Scoring**: 0 points for arbitrary or step-by-step rules. 2 points only for a full-sequence rule (none will succeed).  
    - **⚠️ Let them struggle?** Yes. At 50 min, ask: "Does your rule work if tokens have no numbers?" Highlight dependence: "Your 'n-th choice' depends on the first n-1, but your rule doesn’t specify how."  

  - **60–75 min: Round 4 – Uncountably Many Choices (15 min)**  
    - **Task**: "Write a procedure to pick one element from every nonempty subset of the reals. Use 10 envelopes labeled with real numbers (e.g., π, √2), each containing a set of symbols (e.g., {♠, ♣} in 'π' envelope). Your rule must work for any subset family."  
    - **Setup**: Labels are arbitrary (e.g., "π" on envelope), contents are arbitrary symbols.  
    - **Goal**: Fail spectacularly. Students can’t list envelopes or define a uniform rule (e.g., "pick smallest" fails for sets like {0.9, 0.99, 0.999, ...} with no minimum).  
    - **Scoring**: 0 points.  
    - **⚠️ Let them struggle?** Yes. At 65 min, ask: "Can you write a rule without knowing what’s inside?" At 70 min, have groups share; all will admit defeat.  

  - **75–90 min: Debrief (15 min)**  
    - **Map tasks to distinctions**:  
      - Round 1: **Finitely many choices** – Rules exist (e.g., min/max), so no axiom needed.  
      - Round 2: **Countably many simultaneous choices** – Need **Countable Choice** (no rule for "fix enumerations" in union proof).  
      - Round 3: **Dependent choices** – Need **Dependent Choice** (choices depend on prior ones, e.g., building sequences).  
      - Round 4: **Unstructured/uncountable choices** – Need **full Axiom of Choice** (no rule possible).  
    - **Classify syllabus proofs** (use whiteboard):  
      | Proof | Choice Needed | Why (Short Justification) |  
      |-------|---------------|---------------------------|  
      | Countable union of countable sets | Countable Choice | "Fixing enumerations" requires choosing infinitely many enumerations simultaneously; no rule in general. |  
      | Every infinite set has a countably infinite subset | Dependent Choice | Building the subset requires choosing elements step-by-step (each depends on prior choices); no rule for the whole sequence. |  
      | Nested nonempty closed sets in ℝ with diam → 0 have nonempty intersection | **No choice** | Use completeness of ℝ: inf of left endpoints is in all sets. No choices made; explicit rule exists. |  
      | ε-δ continuous iff sequentially continuous | Countable Choice | For (sequential ⇒ ε-δ), negating ε-δ requires choosing, for each n, a point xₙ with |xₙ−a|<1/n and |f(xₙ)−f(a)|≥ε; no uniform rule. |  
      | Every vector space has a basis | Full Axiom of Choice | Basis construction involves choosing linearly independent sets from arbitrary subsets; no rule for uncountable cases. |  
    - **Emphasize**: The pressure point is the **rule**, not the number.  
    - **Close the gap** (addressing misconceptions):  
      > "Today, you saw that without a rule, we can't *write down* choices. But the Axiom of Choice says that even without a rule, a choice function *exists* as a mathematical object. This is about existence vs. definability: choice functions may exist without being describable by rules. We assume Choice to make proofs work, but we must flag it because it can’t always be avoided or replaced by rules. In your proofs, if you can’t write a rule, you need to cite Choice."  

  ---

  ### Forecast of What Will Go Wrong
  1. **Round 2 (Countable Union)**: A group will "solve" it by assuming sets are subsets of ℕ and using "pick the minimum." *Response*: "But what if sets aren’t numerical? Your rule fails for envelopes with symbols. Without structure, no rule works."  
  2. **Round 3 (Dependent Choice)**: A debate will erupt: "If math is invented, why can’t we invent a rule?" *Response*: "Math requires consistency. Your rule must work for any set; inventing ad hoc rules isn’t general."  
  3. **Student with Banach-Tarski**: "Choice is false because Banach-Tarski is paradoxical!" *Response*: "Banach-Tarski shows Choice has counterintuitive consequences, but it’s still a useful axiom. Today, we’re focusing on when it’s *needed*, not its truth."  

  ---

  ### Limits of the Exercise and Closing the Gap
  **Risk of Misconception**: The activity emphasizes *definability* (writing rules) but may conflate it with *existence*, implying that "no rule" means "no choice function exists." Students might think the issue is about human knowledge or computation, not set-theoretic axioms.  
  **How to Close the Gap**:  
  - In the **final 10 minutes**, explicitly state:  
    > "Definability (rules) and existence (Choice) are separate. Choice functions might exist without being definable. The axiom lets us assume existence even when we can’t write a rule. Without it, some sets have no choice function in some models of set theory."  
  - **Assertion Required**: This distinction cannot be fully captured by an activity. You must assert:  
    > "Choice is about existence in the universe of sets, not our ability to describe. We use it when definability fails."  
  - **Why This Works**: Connects the hands-on struggle to the philosophical/logical context, preempting misconceptions.  

  This workshop is tightly built around your students' error (indiscriminate "fix an enumeration") and their objections ("countably many choices should be easy"). By experiencing failure in Round 2, they retroactively understand your marking feedback, and the debrief links to syllabus proofs they’ll encounter in exams.
