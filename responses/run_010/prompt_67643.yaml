prompt: |-
  So my older brother is basically a walking bumper sticker, and last Thanksgiving he ended an argument with me by dropping "what if everyone did that?" The argument was about my plan to turn down a decent accounting offer and go get a philosophy PhD instead — his version was roughly, what if everyone did that, who's gonna do the taxes, nobody would grow food, society collapses. I mumbled something about how thats not really what Kant said and he said yes it is, that's literally the categorical imperative, the universal law thing. I'm in an intro ethics course now and we did the Groundwork a couple weeks ago, and I want to actually win this argument — or at least find out cleanly that I can't.

  Here's what I'm stuck on. That sentence sounds like one claim but I'm pretty sure it's at least four or five completely different arguments wearing a trench coat, and I can't tell which ones are actually Kant's and which are just folk ethics that happens to rhyme with him. Is it a claim about consequences (if everybody did it, the results would be bad)? Or a claim about the maxim being self-undermining once universalized — the promising example my TA kept going back to, where the whole practice of promising just evaporates so there's nothing left to exploit? Or is it a fairness point about making an exception for yourself while depending on everyone else's compliance? Or is it basically the golden rule with extra steps? I also vaguely remember there being two different flavors of contradiction in the chapter, one about conception and one about willing, with the never-helping-anyone example landing in the second bucket — which seems like it changes what the slogan is even doing, since nothing about that one collapses on itself.

  So can you lay out the distinct precise theses that one sentence could be standing for, as a menu rather than picking your favorite, and for each say whether it's basically a platitude, genuinely defensible, or just false — and which of them, if any, actually gets my brother his conclusion about the PhD? I especially want the version where the test is supposed to be about consequences, because I have this intution that it proves way too much: it would seem to condemn every minority life choice, being a nun, being a lighthouse keeper, being the one weirdo who donates a kidney, and also to bless things that would be fine only if literally everyone did them. Is that a real objection or am I misreading what the test is testing? And since the whole thing turns on how you describe your own maxim, tell me how the different readings handle that — whether my maxim is "pass up a stable career," or "walk away from obligations to your family," or "act on something you'd be embarrassed to publish" clearly changes the verdict, and on which reading the maxim-description problem is fatal versus merely annoying. Bonus points for telling me which of these readings Kant himself most plausibly meant, and which one people usually have in mind when they say it to shut someone up at a family dinner.
reasoning: |-
  Okay, let me unpack this user's query. They're dealing with their brother using Kant's "what if everyone did that?" argument to criticize their choice of pursuing a philosophy PhD over an accounting job. The user is taking an ethics course and wants to dissect this argument to either win the debate or understand its limitations.

  First, I need to identify all possible interpretations of that slogan. The user mentions it feels like multiple arguments in a trench coat—consequences, self-undermining maxims, fairness, golden rule. I should clarify each distinct thesis. 

  Starting with consequences: the brother's point about society collapsing if everyone pursued philosophy. But Kant isn't consequentialist. His test checks if universalizing a maxim leads to a contradiction, not bad outcomes. The user's intuition about minority choices (nuns, lighthouse keepers) makes sense here—Kant's test doesn't reject those because their maxims can be universalized without contradiction. So this interpretation is a misreading of Kant, though common in folk ethics.

  Next, the self-undermining contradiction (like false promises). If everyone broke promises, promising ceases to exist, making the initial act impossible. But for the PhD choice, the maxim "pursue passion over stability" doesn't undermine itself universally—some could do it without collapsing society. This doesn't support the brother's argument.

  Then, the "contradiction in the will" version, like never helping others. Universalizing that would harm oneself when needing help. But again, choosing philosophy isn't refusing to help; it's a personal career choice. The brother's dependency argument might fit here, but only if the user relies on others' stable jobs while opting out. That's a fairness point, not Kant's core test.

  Fairness as free-riding: if the user benefits from accountants but won't be one, that's making an exception. Kant does imply this, but it's secondary. The maxim's description matters—"avoiding societal obligations" vs. "pursuing philosophy." The brother might frame it as obligation-dodging, but that's debatable.

  Golden rule comparison: treating others as you'd want. Similar to fairness but not identical to Kant. Folk ethics often blends these.

  For the PhD case, none of Kant's formulations clearly condemn it. The brother's claim that society would collapse is consequentialist, not Kantian. The user can argue their maxim passes the test: "pursue truth-seeking vocations when capable" can be universalized. Contradictions only arise if the maxim is selfish or exploitative.

  The maxim description is crucial. Kant requires precise maxim formulation. The brother might use "abandon necessary social roles," but that's loaded. The user should define their maxim as contributing via philosophy, not avoiding work. 

  Kant's actual view focuses on contradictions in conception/willing. Folk versions often misuse it for consequences. The user can explain this distinction and reframe their choice as a universalizable passion pursuit, not societal free-riding. They might not "win" but can show the brother's argument misapplies Kant.
answer: |-
  You're absolutely right—"what if everyone did that?" is a linguistic shapeshifter. It's not *one* argument, and most folk uses bear only a vague resemblance to Kant. Let's dissect the trench coat into its distinct theses, evaluate them, and see which (if any) gives your brother the win on the PhD.

  ---

  ### **The Menu of Meanings: What "What If Everyone Did That?" Could Mean**

  1.  **The Consequentialist Nightmare (Folk Kant)**
      *   **Thesis:** If everyone performed your action, the *consequences* would be disastrous (society collapses, no food, no taxes).
      *   **Is this Kant?** No. Kant explicitly rejects grounding morality on consequences. The Categorical Imperative (CI) tests the *form* of the maxim, not its outcomes.
      *   **Defensible?** As a *pragmatic consideration*, sometimes yes. As a *moral principle*, no. **Your intuition is spot-on:** It proves too much. It condemns any minority vocation/choice (nun, lighthouse keeper, kidney donor, astronaut, *philosopher*) and blesses things that *only* work if few do them (e.g., "be an accountant" – if *everyone* was an accountant, society collapses faster!). It also ignores whether the action itself is *wrong*; maybe the disastrous outcome just highlights a systemic problem needing fixing.
      *   **Gets Brother the Win?** Superficially *yes* (if everyone got PhDs in philosophy, taxes don't get done). But it's philosophically weak and easily countered by pointing out the absurdity (e.g., "By that logic, no one should be a firefighter either, because if everyone was one, who'd build the trucks?").
      *   **Maxim Description Problem:** **Fatal.** The test hinges entirely on *how you define the disastrous outcome*. Your brother defines your maxim as "abandon necessary jobs." You define it as "pursue a passion in philosophy." The former leads to disaster; the latter does not.
      *   **Dinner Table Frequency:** **Extremely High.** This is the "shut someone up" version.

  2.  **The Self-Undermining Contradiction (Kant's Contradiction in Conception)**
      *   **Thesis:** If your maxim were universalized, it would become *impossible* to perform the action itself because the practice or condition it relies on would vanish. (The false promise: Universal lying destroys trust, making promising *impossible*).
      *   **Is this Kant?** **Yes.** This is the core of the first formulation (Formula of Universal Law) for "perfect duties."
      *   **Defensible?** **Genuinely defensible** for actions that *exploit* a system requiring general compliance (lying, promise-breaking, stealing). It identifies actions parasitic on a norm they simultaneously violate.
      *   **Gets Brother the Win?** **No.** Universalizing "pursue a philosophy PhD instead of accounting" *does not* make pursuing a philosophy PhD impossible. Universities could still exist, research could happen. Society might change, but the *act itself* remains conceivable. Your action doesn't *rely* on others *not* doing it in the way lying relies on others trusting.
      *   **Maxim Description Problem:** **Crucial but manageable.** Kant requires testing the precise maxim *of the will* behind the action. "Seek truth/knowledge via advanced study when capable" universalizes fine. "Avoid socially necessary labor" *might* undermine the system supporting academia, but that's a stretch and veers into consequences.
      *   **Dinner Table Frequency:** Low. Requires understanding Kant's examples.

  3.  **The Self-Defeating Contradiction (Kant's Contradiction in the Will)**
      *   **Thesis:** You couldn't *rationally will* your maxim to be universal because it would destroy something you *necessarily* will (or cannot avoid willing) as a rational being. (Never helping: You'd inevitably need help yourself someday, so you can't rationally will a world where help never exists).
      *   **Is this Kant?** **Yes.** This is the second part of the first formulation, governing "imperfect duties" (like beneficence).
      *   **Defensible?** **Genuinely defensible** for identifying actions that, while possible universally, undermine essential conditions for human flourishing/rational agency that we all depend on (e.g., mutual aid, developing talents).
      *   **Gets Brother the Win?** **Unlikely, but brother might *think* it does.** His "who'll do the taxes/grow food" hints at dependency. However:
          *   Kant isn't arguing everyone *must* farm or do taxes. He's arguing we have an imperfect duty to support systems and institutions necessary for rational life *in some way*.
          *   Your PhD pursuit doesn't mean you *refuse* to contribute *at all*. You might contribute through teaching, critical thinking, ethics (ironically!), or future work. Society needs *some* philosophers as much as it needs *some* accountants.
          *   The contradiction arises only if your maxim is something like *"Never contribute to the necessary maintenance of society."* Choosing *how* to contribute (philosophy vs. accounting) is different.
      *   **Maxim Description Problem:** **Critical.** "Pursue my intellectual passion" vs. "Refuse to ever perform necessary labor." The first can be willed universally; the second likely cannot (as rational agents, we depend on a functioning society). Your brother will push for the second description.
      *   **Dinner Table Frequency:** Moderate. The "dependency" argument resonates.

  4.  **The Fairness/Free-Riding Argument (Kant-Adjacent)**
      *   **Thesis:** Your action is unfair because you benefit from a system (others doing necessary jobs) while making an exception for yourself to avoid contributing to it. You're a free-rider.
      *   **Is this Kant?** **Indirectly, yes.** The CI implies we cannot make ourselves exceptions. Free-riding is a common *consequence* of failing the CI test (e.g., the lying promise *is* free-riding on truthfulness). Kant's Formula of Humanity (treat others as ends, not means) also forbids exploiting others' labor unfairly.
      *   **Defensible?** **Genuinely defensible** as a core principle of fairness and reciprocity. Exploiting a cooperative system is wrong.
      *   **Gets Brother the Win?** **His strongest shot, but not guaranteed.** This shifts the focus: *Are you* planning to benefit from society (food, roads, security, accounting!) while refusing *any* role in sustaining it? If your PhD path genuinely involves no contribution (unlikely) and you rely entirely on others' "necessary" labor while opting out, this has force. However:
          *   Philosophy PhDs *do* contribute (teaching, research, public discourse).
          *   "Contribution" isn't monolithic. Society needs diverse roles.
          *   Your choice *now* doesn't mean you *never* contribute financially or otherwise.
      *   **Maxim Description Problem:** **Central.** "Make an exception for myself from societal obligations while benefiting from them" likely fails the CI (Contradiction in the Will). "Fulfill societal obligations through intellectual work and teaching" passes. The fight is over how to frame your choice.
      *   **Dinner Table Frequency:** High. Appeals directly to fairness instincts.

  5.  **The Golden Rule in Disguise**
      *   **Thesis:** Would you want everyone to treat *you* the way you're acting? (Do unto others...).
      *   **Is this Kant?** **Superficially similar, but fundamentally different.** The Golden Rule is empathy-based and hypothetical ("*if* you don't want X done to you..."). The CI is about rational consistency and universal law, binding regardless of desires.
      *   **Defensible?** **Platitude with limitations.** Prone to masochism/sadoism problems (e.g., "I like being lied to, so lying is ok").
      *   **Gets Brother the Win?** **Weakly.** "Would you want *no one* to do accounting?" You could easily counter: "I'd want people to pursue their talents and passions, contributing in diverse ways, including some who *choose* accounting."
      *   **Maxim Description Problem:** Present, but secondary to empathy framing.
      *   **Dinner Table Frequency:** Moderate. Often blends with Consequentialist or Fairness versions.

  ---

  ### **The Verdict & How to Win (or Draw Cleanly)**

  1.  **Kant Himself:** Primarily meant **#2 (Self-Undermining Contradiction)** and **#3 (Self-Defeating Contradiction in the Will)**. These are formal tests of maxims, *not* about predicting consequences (#1) or simple fairness (#4), though #4 is a common *implication*.
  2.  **Brother's Best Hope:** **#4 (Fairness/Free-Riding)**. He needs to convince you (and the table) that your PhD choice is fundamentally *free-riding* on the labor of others doing "necessary" jobs you refuse to do, making yourself an exception. *This is the argument you need to counter.*
  3.  **Your Winning Strategy:**
      *   **Reject #1 (Consequences) Firmly:** "That's not Kant, that's consequentialism. Kant's test isn't about predicting disasters, it's about consistency. By that logic, *any* specialized career choice is condemned. Should *no one* be a firefighter or artist either?"
      *   **Neutralize #4 (Fairness/Free-Riding):** This is key.
          *   **Reframe Your Maxim:** "My maxim isn't 'avoid necessary work' or 'free-ride'. It's 'pursue advanced study and contribute to knowledge and education, fields society demonstrably values and needs, even if it's not the highest-paying path.' That *can* be universalized. Society needs philosophers, ethicists, and teachers just as it needs accountants. I'm choosing *how* to contribute, not *whether*."
          *   **Reject the False Binary:** "The choice isn't 'accounting or collapse'. Society functions with diverse roles. People *do* choose philosophy PhDs, and society hasn't collapsed. My contribution will just be different."
          *   **Highlight His Assumption:** "You're assuming accounting is inherently 'necessary' and philosophy isn't. That's a value judgment, not a Kantian test. Kant would ask if my *maxim* is self-contradictory or defeats my own necessary ends – neither applies here."
      *   **Address #3 (Contradiction in Will) Briefly:** "Kant's point about dependency is that we cannot rationally will a world where *no one* helps or contributes. I'm not advocating that. I'm choosing a *different* form of contribution that I'm better suited for. A world where *everyone* pursued philosophy *could* still function if basic needs were met differently (automation, different social structures), but crucially, that's not the test. The test is whether my *specific maxim* leads to a contradiction – it doesn't."
  4.  **Can You Win?** You can decisively refute the claim that he's correctly applying *Kant's* CI (#1, #2 are clear misses; #3/#4 need reframing). You can show his strongest argument (#4) relies on a loaded description of your maxim. You can establish that *your* description passes Kantian muster. However, family dinner arguments aren't decided by philosophical precision. If he's dug in on "necessary jobs," you might reach a stalemate. But you'll have shown his bumper-sticker Kant is inaccurate and his application flawed.
  5.  **Bonus Answer - Dinner Table Kant:** It's almost always **#1 (Consequentialist Nightmare)** blended with a heavy dose of **#4 (Fairness/Free-Riding)**, wrapped in a Kantian-sounding slogan. It's used to shut down perceived deviation from social norms ("necessary jobs") by invoking the specter of collapse if "everyone" did it.

  **Go forth and universalize your maxim confidently.** At the very least, you can now point out he's confusing Kant with a bad episode of doomsday prepper TV.
