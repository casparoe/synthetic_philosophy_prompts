  First, I need to validate their core insight: that the conflict centers on inferential legitimacy rather than fundamental biological principles. Both camps accept natural selection, developmental constraints, and byproducts - but clash over whether good design implies design-for-function. Their three-question framework (origin/design/necessity) seems useful here, though I should verify its fidelity to the literature.

  The structuralist-adaptationist steelmanning requires care. For structuralists, I'll emphasize their positive program in evo-devo and critique of just-so stories, not anti-selectionism. For adaptationists, I'll highlight predictive models and operational utility while acknowledging their methodological cautions. The key is showing how both positions become reasonable when divorced from rhetorical extremes.

  On quantifiable evidence, I'm skeptical about resolving the debate through trait counts. The 100-traits exercise risks false dichotomies since many traits involve both selection and constraints. Better to examine inferential patterns: how often does assuming adaptation lead researchers astray versus yield productive science?

  For the concrete case, male nipples work well. It cleanly separates current utility (none) from origin (developmental constraint) and necessity (no mammalian alternative). Crucially, neither camp disputes this - suggesting agreement is possible when evidence is unambiguous. The appendix offers a richer case study in exaptation debates.

  Progress likely lies in formalizing inference methods rather than trait percentages. Distinguishing origin/maintenance and specifying null models for constraint-focused explanations could defang the pseudocontroversy. The user's burden-of-proof framing holds up well here.

