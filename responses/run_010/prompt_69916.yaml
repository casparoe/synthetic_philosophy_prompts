answer: |-
  **Bottom line**  
  The core conflict isn't about biology but epistemology: *how we justify biological explanations*. Both sides agree on mechanisms (selection, constraints, drift), but adaptationists treat "apparent design" as a *sufficient heuristic* for inferring selective origin, while structuralists demand *positive evidence of constraint* before accepting non-adaptive explanations. The stalemate persists because neither can falsify their opponent's null model: adaptationists see constraints as a fallback when selectionist stories fail, while structuralists see selectionist stories as unfalsifiable without developmental evidence. Your three-question split survives and clarifies the deadlock.  

  **The three claims hiding under "adaptationism"**  
  1. **Methodological Primacy**: Investigating function (your Q2) is the *most efficient starting point* for biological inquiry.  
  2. **Design Implies Selection**: Well-matched form/function (Q2) is *strong evidence* that selection caused the trait's origin/maintenance (Q1).  
  3. **Constraints Are Rare**: Developmental or architectural necessity (Q3) is *unlikely* to produce complex traits without subsequent selection.  

  *The real fights*:  
  - Structuralists attack **2 → 1 inferences** (e.g., assuming chin function from its shape).  
  - Adaptationists defend **1 + 2 as a package** (rejecting Q3 as a default explanation).  
  - Both agree on **1 ≠ 2** (origin ≠ current utility), but adaptationists see Q2 as *probative* for Q1, while structuralists see Q3 as *often preemptive*.  

  **Steelmanned positions**  
  *Adaptationist*: Selection is the *only* process generating intricate functionality. Optimality models predict trait limits, gene networks, or ecological niches (e.g., predicting enzyme kinetics or foraging efficiency). When these fail, constraints *are* invoked (e.g., tetrapod limb structure). Critiques target "just-so stories" are valid, but rejecting adaptation-first heuristics stalls discovery—most complex traits *do* have functional explanations confirmed by experiment.  

  *Structuralist*: Organisms are integrated systems, not Lego sets. Development dictates "zones of possibility" (e.g., all mammals have nipples; none have wheels). Focusing solely on function ignores how traits emerge from epigenetic cascades (e.g., butterfly eyespots as byproducts of gradient systems). "Spandrel" isn't anti-selection—it’s a call to *model development first*, then test if selection refined the output.  

  **Your diagnosis**  
  **Substantive but overblown**: It’s a **burden-of-proof fight** amplified by disciplinary identity. Adaptationists (often behavioral ecologists) work on traits where Q2→Q1 inferences *work* (e.g., finch beaks). Structuralists (evo-devo, paleontologists) study systems where Q3 dominates (e.g., pharyngeal arches becoming ears). Your three-question split **survives**:  
  - Gould/Lewontin attack **inferring Q1 from Q2 alone**.  
  - Adaptationists argue **Q2 is the best proxy for Q1** absent Q3 evidence.  
  - Disagreement vanishes only if both require:  
    - *For Q1*: Historical/genetic evidence of selection.  
    - *For Q3*: Developmental models showing inevitability.  

  **The 100-traits bet**  
  Neither camp would concede. Adaptationists would count traits with *any* selective role (e.g., male nipples as "non-functional but retained due to low cost"), scoring 90%+ as "adaptations." Structuralists would demand traits *incapable of being explained by selection* (e.g., genomic GC content), scoring 30-50% as "byproducts." The bet fails because:  
  - Traits aren't binary (e.g., appendix: constraint-derived, then immune-exapted).  
  - "Better explained" depends on prior assumptions about null hypotheses.  
  - *Resolvable only* if agreed: "Byproduct" = no current/past function *and* developmentally inevitable.  

  **One case worked through: Male nipples**  
  - **Q1 (Origin)**: Did selection *for lactation* cause nipples in males? *No*. Genetic evidence: Nipples develop before sexual differentiation in embryogenesis.  
  - **Q2 (Design)**: Are male nipples "well-matched" to function? *No functional evidence*; no lactation, minimal sensitivity.  
  - **Q3 (Necessity)**: Could development produce them anyway? *Yes*. Mammalian development builds default female structures; masculinization happens later.  

  *Evidence that would move sides*:  
  - Adaptationists: Would accept this if shown *high cost* to losing nipples (none found). Might still argue for exaptation (e.g., sexual signaling), but no data supports this.  
  - Structuralists: Would accept selection only if males *lacked nipples ancestrally* and evolved them anew (not the case).  
  *Neither disputes the outcome*—showing consensus is possible when Q3 is overwhelming.  

  **What would count as progress**  
  1. **Formal inference frameworks**: Requiring tests for *both* selection signatures (Q1) and developmental alternatives (Q3) before claiming "adaptation."  
  2. **A resolved case study**: E.g., the human chin—if evo-devo models show its shape is an inevitable byproduct of facial bone reduction (Q3), *and* genomics confirms no selection on chin-specific alleles (Q1).  
  3. **Distinguishing "origin" vs. "maintenance"**: Selection often *maintains* spandrels (e.g., brain exaptations). Acknowledging this defuses rhetoric.  
  Progress *is* happening: Modern papers (e.g., on gene regulatory networks) integrate both approaches. The holy war persists only in legacy literature.  

  **Where you're wrong**  
  You slightly underplay **evo-devo's substantive challenge**: Constraints aren’t just "burden of proof" arguments—they redefine *what’s selectable*. For example, heat-shock proteins (HSP90) buffer genetic variation, creating evolutionary capacitance. This implies selection acts on *developmental systems*, not traits. Adaptationists must now explain why some traits are "evolvable" and others not—a shift from the 1979 debate. Your Q3 thus needs expansion: It’s not just "could it happen," but "how does development channel possible phenotypes?"
