prompt: |-
  A friend and I spent most of last night on Confucian role ethics, and neither of us is satisfied with where we landed. I have reconstructed his case below in the cleanest form I can manage, and I would like an outside diagnosis.

  His target is the Ames–Rosemont program, on which what I owe anyone is fixed entirely by the concrete roles I stand in to that person — son, elder brother, minister, friend — and there is no role-independent moral standpoint from which those roles could be assessed or ranked against one another. He concedes the descriptive case for partiality; his claim is that role ethics cannot be a genuine alternative to impartialist ethics. The argument, as I have set it out:

  (1) On role ethics, every obligation is the obligation of some role, and a role has no standing outside itself.
  (2) If obligations have no standing outside the roles that generate them, nothing internal to the theory can rank one role's demands against another's when they conflict.
  (3) The test case he draws from the Mencius: Shun's father has killed a man, and the judge Gao Yao, doing precisely what his own role requires, intends to arrest him; Shun, as emperor, could forbid it, and as son cannot permit it. In the text Shun settles the matter by treating the empire as a worn-out sandal, abdicating, and carrying his father away to the coast.
  (4) That settlement ranks the role of son above the role of ruler, and by (2) the theory cannot say why; from inside the theory the ranking is a brute preference.
  (5) So either (a) the ranking is fixed by something outside the roles — a view about what makes a human life go well, or about which relations are constitutive of personhood — or (b) it is arbitrary.
  (6) If (a), role ethics is not a rival to impartialism but a heuristic for applying one: the work is done by the external standard, and the vocabulary of roles is decoration.
  (7) If (b), role ethics is committed to the principle that whatever social position one occupies generates whatever obligations it carries, with no external check. That principle licenses the intolerable: one who occupies the role of hired killer owes the employer the killing; a magistrate who happens to be the defendant's brother owes him the acquittal; and since nothing outside the roles can constrain which roles one takes up, one may freely acquire a role and thereby acquire a binding obligation to do what it demands.
  (8) But (7) is intolerable: it makes morality a matter of which hats one has happened to pick up.
  (9) Therefore (b) is false; therefore (a); therefore role ethics, on pain of corruption, collapses into an impartialist theory dressed in Confucian vocabulary.

  Two things trouble me, and I cannot tell whether they are the same trouble. First, (7) seems to prove too much. Run it against a defense lawyer's duty of zealous advocacy, or a parent's refusal to weigh her own child impartially against a stranger's, and you get the same verdict — yet those cases strike me as unobjectionable, indeed as the ones role ethics was built to describe. So whatever is wrong with the principle in (7) is wrong with something I want to keep. Second, I suspect (4) is unfair to the passage it invokes: Shun does not use the throne to save his father, he surrenders the throne, which looks less like a ranking than a refusal to hold two incompatible roles at once. If the theory has a general answer of that shape, then (2) is false and the dilemma never engages. But I cannot see how such an answer would be anything more than an ad hoc patch, and a patch seems to concede (5a) anyway.

  Which step should I reject, and what does rejecting it cost? I want to know whether the argument is invalid — and if so, exactly where the inference slips, since each step reads as plausible to me in isolation — or valid, with a premise I ought to abandon. If it is valid, tell me which premise I can abandon most cheaply and what theoretical work is lost by abandoning it, and say how the Confucian, the impartialist, and anyone who wants to keep ordinary professional and parental partiality each fare under the repair you recommend. I would much rather keep (1) and (8); I care comparatively little about (6).
reasoning: |-
  Hmm, the user is presenting a complex philosophical argument against Confucian role ethics as developed by Ames and Rosemont, and wants me to diagnose where the argument goes wrong. The user's friend has constructed this critique targeting the apparent inability of role ethics to resolve conflicts between different roles without appealing to external standards.

  The core argument presented by the user's friend has several key steps. First, it claims that in role ethics, obligations are entirely role-dependent with no external standpoint. Second, since roles have no inherent ranking, the theory can't resolve conflicts between roles. Third, it uses the Mencius example of Shun facing a conflict between his role as son and ruler to illustrate this problem. Fourth, it argues that resolving such conflicts requires either an external standard (which would make role ethics merely decorative) or leads to arbitrariness that allows morally intolerable outcomes.

  The user has two main concerns about this argument. First, that step (7) proves too much because it would condemn ordinary cases of partiality like parental duties or legal advocacy that seem legitimate. Second, that step (4) misinterprets the Shun story as ranking roles rather than showing Shun abandoning one role to fulfill another.

  I need to carefully examine the argument's structure. The dilemma in step (5) seems particularly crucial - it forces role ethics into either collapsing into impartialism or embracing moral arbitrariness. But I think this might be a false dilemma. The user's observation about Shun's action suggests role ethics might resolve conflicts through role abandonment rather than role ranking, which could offer a third way. This could challenge premise (2) that role ethics lacks internal conflict-resolution mechanisms.

  The user wants to preserve premise (1) about the role-bound nature of obligations and premise (8) that morality can't depend on arbitrary role selection. But they're willing to sacrifice the claim that role ethics would collapse into impartialism (premise 6). I should explore how role ethics might develop internal resources for handling conflicts while maintaining its distinctive character.

  I'm considering suggesting that rejecting premise (4) might be the most promising approach. The Shun story might show role conflict being resolved through role exit rather than role hierarchy. This would make step (2) inapplicable in such cases. Confucian role ethics might recognize situations where roles become incompatible and require choosing one over another based on the nature of the roles themselves and their relationship to fundamental human experiences.

  For the user's deeper concerns, I should address how this approach preserves legitimate partiality (like parental duties) while avoiding endorsing problematic cases (like hired killers). The key might be distinguishing between constitutive roles essential to personhood and contingent social positions. This could maintain role ethics as a genuine alternative to impartialism while avoiding the corruption problem.
answer: |-
  Your friend's argument is sophisticated but contains critical flaws. I recommend rejecting **premise (4)** as a misinterpretation of the Shun passage and Confucian role ethics. This rejection preserves the core of role ethics while avoiding the dilemma and addressing your concerns about step (7). Here's the breakdown:

  ### Why Reject (4)?
  - **Shun's action isn't a "ranking" of roles**: He doesn't prioritize "son" *over* "ruler" as abstract values. Instead, he *surrenders the throne* to resolve an irreconcilable conflict between two concrete obligations. This is **role exit**, not role hierarchy. The theory *can* resolve conflicts by recognizing when roles are incompatible in a specific context.  
  - **Confucianism has internal resources for conflict resolution**: Roles exist within a web of relationships (*lun* 伦), not in isolation. The *Mencius* passage itself implies that Shun’s action is exceptional precisely because his roles as emperor and son create a unique moral trap. Role ethics doesn’t require brute ranking; it can appeal to:  
    - **The constitutive nature of roles**: Some roles (e.g., son) are foundational to personhood in Confucianism. Abandoning them isn't "arbitrary" but a failure of self-cultivation (*xiu shen* 修身).  
    - **Contextual harmony (*he* 和)**: Resolution aims to restore relational balance, not apply a universal rule.  
  - **Premise (2) is overstated**: Role ethics isn’t devoid of internal coherence. Roles derive meaning from their contribution to a flourishing human community (*ren* 仁). When conflicts arise, the theory can prioritize roles that sustain fundamental relationships (e.g., family) over contingent ones (e.g., political office). This isn't "external" but embedded in Confucian metaphysics.

  ### Costs of Rejecting (4):
  - **No abstract hierarchy**: Confucianism still lacks a *fixed, context-independent ranking* of roles (e.g., "son always trumps ruler"). Resolutions remain situational, which critics may see as ad hoc.  
  - **Demands nuance**: Resolving conflicts requires deep practical wisdom (*zhi* 智), not algorithmic rules. This may dissatisfy those seeking moral certainty.  

  ### Addressing Your Troubles:
  1. **Step (7) proves too much because it ignores role legitimacy**:  
     - Role ethics distinguishes **constitutive roles** (son, friend) from **contingent social positions** (hired killer, corrupt magistrate). The latter aren’t genuine "roles" in Confucianism because they don’t foster *ren* (humaneness) or contribute to relational harmony.  
     - Your examples (lawyer, parent) survive: Parental partiality stems from a constitutive role; legal advocacy assumes a just legal framework. A "hired killer" has no moral role—it’s a contradiction of personhood.  
     - **Cost**: Requires grounding roles in a Confucian view of human flourishing (avoiding pure descriptivism). But this isn’t "impartialist"—it’s *role-based teleology*.

  2. **Your insight about Shun is correct**:  
     - Shun’s abdication *is* a refusal to hold incompatible roles, not a ranking. This is a feature, not a bug. Role ethics can handle conflicts by:  
       - **Role adjustment**: Exiting or renegotiating roles (as Shun does).  
       - **Role scope delimitation**: Recognizing that certain roles have situational boundaries (e.g., parental duties don’t include obstructing justice).  
     - **This isn’t ad hoc**: It follows from the theory’s focus on *practical resolvability* over abstract principles.  

  ### Impact on Key Stakeholders:
  | Party         | Outcome of Rejecting (4)                                      | Key Win/Loss                                                                 |
  |---------------|---------------------------------------------------------------|-----------------------------------------------------------------------------|
  | **Confucian** | Preserves role ethics as non-impartialist rival.              | **Win**: Avoids collapse into impartialism; keeps focus on relationality.   |
  | **Impartialist** | Denied a "fatal flaw" victory.                              | **Loss**: Role ethics remains a distinct alternative.                       |
  | **Partiality Defender** | Saves parental/professional partiality.                    | **Win**: Legitimate partiality justified; corrupt "roles" excluded.         |

  ### Why Not Reject Other Premises?
  - **Rejecting (1)**: Would gut role ethics entirely (you want to keep it).  
  - **Rejecting (2)**: Premise (4) is the weaker link; (2) is defensible if conflicts are resolved contextually.  
  - **Rejecting (8)**: Morality *shouldn’t* be arbitrary—this is non-negotiable.  
  - **Accepting (6)**: You’re willing to lose this, but rejecting (4) avoids conceding it.  

  ### Conclusion:
  The argument fails at step (4) by misreading Shun’s action and underestimating Confucianism’s internal resources. Role ethics resolves conflicts through **role exit** and **contextual harmonization**, not brute ranking. This:  
  - Explains Shun’s choice non-arbitrarily,  
  - Preserves legitimate partiality (parent/child, lawyer/client),  
  - Excludes corrupt "roles" by tying obligations to human flourishing (*ren*).  

  The cost is accepting that morality requires practical wisdom, not a decision procedure. But this is central to Confucianism—and arguably, to ethical life itself. Your instinct that (7) proves too much and (4) misreads the text is correct; defend those insights.
