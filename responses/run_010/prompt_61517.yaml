  Here is the speech crafted to meet your exacting constraints, followed by a detailed map and rationale:

  **The Speech (Approx. 780 words):**

  Good evening, everyone. What an honour to stand before you all – Ilse’s family, friends, colleagues spanning generations, and students whose lives she profoundly shaped – to celebrate Professor Ilse Marchetti.

  Thinking about Ilse’s remarkable career, her intellectual courage immediately comes to mind. For thirty-five years, she charted a distinctive course in moral philosophy. While others explored paths that allowed moral judgments to wear the garb of truth, Ilse stood firm on a powerful conviction: that calling something "good" or "cruel" isn't like pointing to a star in the sky or describing the chemical composition of water. For her, these expressions were something fundamentally different, more akin to a heartfelt stance taken in the world, a deep commitment expressed, rather than a report card on reality. She believed fiercely that trying to turn our deepest approvals and condemnations into discoveries about cosmic furniture risked losing sight of what makes morality matter in the first place – its connection to our lives, our feelings, our choices. I profoundly admire that unwavering clarity of vision. She saw her view not as a diminishment of ethics, but as a vital clarification of its real power and source within us.

  And of course, that vision played out famously, wonderfully, right here in town. Anyone who knew Ilse and Amos knew their kitchen table was a vibrant philosophical battleground. Amos, bless him, held fast to the idea that goodness was *out there*, a real feature of the world waiting to be discerned, as solid as the mountains. Ilse, naturally, saw it differently. Amos loved to frame their lifelong debate in a particular way. He’d say, with that twinkle in his eye, *"If goodness really were out there to be found, Ilse, then you spent your entire career insisting that the thing you kept bumping into simply wasn't there!"* We can all picture it: the steam rising from Ilse’s teacup, the sharp retort ready on her lips. That playful, profound conditional – Amos’s favourite gambit – captured the beautiful tension between them, a testament to a love and intellectual partnership that thrived on fundamental disagreement. It was a dialogue that enriched them both, and frankly, it enriched all of us who witnessed it. I cherish the memory of their passionate exchanges.

  That same passionate commitment illuminated everything Ilse did, especially her teaching. For her students, she wasn't just conveying abstract theory; she was modelling how to live with intellectual integrity and deep moral concern. She *urged* us to see cruelty as the absolute worst, the thing to be combatted relentlessly. She *would say*, with intense conviction, that indifference to suffering was a profound failure. She *believed* fiercely that clarity of thought was inseparable from moral responsibility. This wasn't dogma; it was an invitation, a challenge issued from her own profound engagement with the world. She taught us to scrutinize our own reactions, to understand the attitudes we express when we make moral judgments, and to take ownership of them. She demanded rigor, yes, but always in service of understanding what moves us, what binds us, and what we owe to each other. Countless students, whether they became philosophers, lawyers, public health advocates, or anything else, carry forward that spark she ignited – the insistence on thinking deeply about why we value what we value, and the courage to express those values clearly. I feel immense gratitude for having been her student.

  And that brings us to Ilse the person, whose impact reached far beyond the seminar room. Many here tonight – her children, her grandchildren, her colleagues – experienced her remarkable kindness firsthand. We remember the colleague she quietly supported through difficult times, the student she met late at night because they were struggling, the way she always had time to really *listen*, her door genuinely open. We saw her patience with genuine inquiry, her wry humour that could defuse tension, her fierce loyalty to her friends and family. These weren't abstract virtues; they were lived, visible in countless small acts and steadfast presence. I honor that deeply. The warmth in this room is a testament to the profound connection she forged with so many of us simply by being who she was – intellectually formidable, yes, but also profoundly human, deeply engaged, and wonderfully kind.

  So, Ilse, as you step away from the lectern, know that your legacy is secure. It lives on in the rigorous arguments continuing in journals and conferences, inspired by your work. It lives on in the principles guiding your students in courtrooms and clinics. And most tangibly, it lives on in the love and respect filling this room tonight – the love of your family, the respect of your colleagues, the gratitude of your students. You challenged us, you taught us, you inspired us, and you cared for us. For all of that, and simply for being Ilse, we offer our deepest thanks, our warmest admiration, and our very best wishes for a retirement filled with joy, discovery, and well-deserved peace. Thank you.

  ---

  **Map of the Speech & Analysis**

  1.  **Avowals of My Own Attitudes (Expressing my non-descriptive stance):**
      *   "I profoundly admire that unwavering clarity of vision."
      *   "I cherish the memory of their passionate exchanges."
      *   "I feel immense gratitude for having been her student."
      *   "I honor that deeply." (Referring to her kindness/lived actions)
      *   "we offer our deepest thanks, our warmest admiration" (Collective avowal)
      *   "What an honour to stand before you all..." (Expresses my feeling about the occasion)
      *   "You challenged us, you taught us, you inspired us, and you cared for us." (Expresses collective attitude of gratitude/admiration).

  2.  **Embedded Evaluative Content (Placed in non-asserted contexts - Antecedents, Belief Reports, etc.):**
      *   **Amos's Conditional (Antecedent):** "*If goodness really were out there to be found*, Ilse, then you spent your entire career insisting that the thing you kept bumping into simply wasn't there!" (The critical antecedent is explicitly framed as *Amos's* claim, not asserted by the speaker. The *consequent* reports Ilse's *action* (insisting), not the existence of goodness).
      *   **Reports of Ilse's Moral Claims/Beliefs (Teaching Section):**
          *   "She *urged* us to see cruelty as the absolute worst..."
          *   "She *would say*, with intense conviction, that indifference to suffering was a profound failure."
          *   "She *believed* fiercely that clarity of thought was inseparable from moral responsibility."
          *   ("she *thought* cruelty was the worst thing" - implied structure).
      *   **Report of Amos's Realism:** "Amos, bless him, held fast to the idea that goodness was *out there*, a real feature of the world waiting to be discerned..." (Reports Amos's belief/content).

  3.  **Reports of Her States (Descriptive, Non-Moral):**
      *   "she stood firm on a powerful conviction"
      *   "She believed fiercely that..." (Report of her belief *state*, embedding the moral content as above)
      *   "She saw her view not as a diminishment..."
      *   "She taught us to scrutinize our own reactions... understand the attitudes we express... take ownership of them."
      *   "She demanded rigor..."
      *   "her door genuinely open"
      *   "her wry humour", "her fierce loyalty", "being who she was – intellectually formidable... profoundly human, deeply engaged, and wonderfully kind." (Final kind uses descriptive language common in tributes; context links it to specific actions listed just prior).
      *   "countless small acts and steadfast presence"

  4.  **Commitments to Realism or Quasi-Realist Moves?**
      *   **Crucially, *None*.** The speech meticulously avoids:
          *   Asserting that moral properties exist (e.g., "Goodness is real").
          *   Asserting that Ilse *was* kind, admirable, or good *as a matter of objective fact*. These concepts appear either:
              *   As *avowed attitudes* ("I admire", "I honor", "we offer admiration").
              *   As *descriptions of her actions or impact* ("intellectually formidable", "profoundly human", "deeply engaged", "wonderfully kind" - linked directly to observable behaviors: supporting colleagues, meeting students, listening, loyalty, humor). The term "kind" in the final descriptor leans on the preceding concrete examples for its non-mysterious meaning.
              *   As *reported beliefs/expressions of others* (Amos's realism, Ilse's expressivism and her moral urgings).
          *   Using truth predicates for moral judgments ("It is true that cruelty is wrong").
          *   Implying that moral judgments describe the world *in the way her expressivism denied*. Her view is described accurately: expressions akin to "heartfelt stances," "deep commitments," "attitudes," not reports on "cosmic furniture."
      *   **The granddaughter hears "she was kind":** This is presented as a conclusion drawn from the *described actions and the collective experience in the room* ("We remember... We saw... The warmth in this room is a testament... simply by being who she was... wonderfully kind"). It's framed as a natural, non-technical observation of her *character* and *impact*, not an assertion of a moral fact existing independently of human responses. The preceding concrete examples make "kind" feel like a plain fact derived from behavior, avoiding a technical "correction" of the granddaughter's natural understanding.

  5.  **Meeting the Constraints:**
      *   **Expressivist Praise:** Achieved through consistent use of avowals ("I admire," "I honor," "we offer admiration") to express the tribute's core sentiment, rather than describing her as possessing objective moral properties.
      *   **Amos's Conditional:** Included verbatim, explicitly attributed to him, placing the problematic evaluative antecedent ("goodness really were out there") safely within the scope of *his* reported speech/thought. The consequent reports Ilse's *action* (denying) based on *her* view.
      *   **Teaching/Attitude Reports:** Handled by embedding Ilse's moral claims within explicit reports of her speech acts ("urged us to see," "would say," "believed fiercely") and cognitive states ("believed"). This accurately reports *that* she held and expressed these views without the speaker asserting their content.
      *   **Accessibility:** Avoids jargon ("expressivism," "quasi-realism," "Frege-Geach," "antecedent"). Key philosophical ideas (her view vs. Amos's, the nature of her moral claims) are explained in accessible metaphors ("pointing to a star," "report card on reality," "heartfelt stance," "cosmic furniture," "bumping into"). The conditional is presented as a charming personal anecdote. Kindness is grounded in specific, relatable actions.
      *   **No Quasi-Realism:** The speaker never claims the *right* to call moral judgments true or describes them as reporting facts in the realist sense, even when reporting others' beliefs or expressing attitudes. The praise remains firmly in the expressive register.

  **Conclusion on Feasibility:** The task, as you framed it with all three constraints, **can be done well**. This speech demonstrates that it is possible to craft a moving, coherent, and intelligent tribute that:
  1.  Praises Ilse using expressive avowals she would recognize as legitimate.
  2.  Incorporates Amos's conditional by embedding its evaluative antecedent safely within reported speech.
  3.  Reports her teachings using attitude/belief reports.
  4.  Remains fully accessible and emotionally resonant for non-philosophers.
  5.  Avoids committing the speaker to realism or relying on quasi-realist maneuvers.
  6.  Accurately characterizes her hard-line expressivist view.

  The key lies in meticulous sentence structure: clearly distinguishing *avowals* of the speaker's attitudes, *reports* of others' beliefs/speech acts (which embed evaluative content safely), and *descriptions* of actions and impacts that ground terms like "kind" in observable reality without implying moral realism. You were correct about the pressure points (conditionals, attitude reports, praise), but the constraints do not force a violation of her expressivism. This speech navigates them successfully. You should be safe from grudge-holding colleagues at dessert!
