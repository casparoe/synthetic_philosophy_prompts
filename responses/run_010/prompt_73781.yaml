prompt: |-
  I am the director of evidence and impact at a private foundation that makes roughly 120 grants a year in global health and agricultural development. Every grant memo ends with a field our charter requires: "net expected benefit," defined in the charter as the grant's effects on wellbeing over fifty years, discounted at three percent annually, with anything beyond year fifty entered as zero. My predecessor filled the field with a figure extrapolated from the applicant's own monitoring data. I have come to think that the horizon, the discount rate, and the extrapolation habit are doing the real work of making an unsolvable problem look solved: for a meaningful minority of our grants, the long-run consequences are not merely hard to estimate but of unknown sign, and some of them — releasing a technology, changing who holds paid work in a district, altering an ecosystem — cannot be undone once done. At the same time, declining to fund is itself a choice with consequences I can trace no better, and I have no interest in a framework whose practical upshot is paralysis.

  Please write me a decision procedure my program officers can actually run: one page, about two hours per grant, usable by someone who has never studied decision theory, with every term defined in a clause at first use. Build it on whatever the debate over consequentialist cluelessness has genuinely established rather than on a taxonomy invented for convenience, but give me no bibliography, no citations, and no reading list — refer to positions by name only where naming them changes what an officer does.

  The procedure needs the following.

  First, a sorting step that classifies proposals by the kind of uncertainty they present. I would expect at least three classes: effects that are hard to estimate but bounded and stable in sign; effects whose sign is unknown but whose magnitude is bounded; and effects that are irreversible or unbounded, where the causal trace leaves any region we can reason about at all. Tell me whether that is the right cut, and if it is not, replace it and say why. Note that our own charter already contains a materiality cutoff — anything smaller than two percent of projected direct effect is not entered — and tell me whether a cutoff like that is a legitimate simplification or a way of smuggling in a verdict.

  Second, for each class, the questions the officer asks, in order, what counts as a sufficient answer to each, and where the procedure terminates. Permitted terminations: fund; do not fund; fund at reduced scale; fund in reversible stages with a pre-committed rule governing expansion; or, this cannot be settled on expected-benefit grounds and must be escalated to the board as a values decision. I want to know which termination is the modal outcome — if most proposals do not clear quickly, the procedure will be ignored within a year.

  Third, what goes in the "net expected benefit" field for each class, given that the charter requires an entry. Propose what an honest entry looks like when no number can be defended, and say how we keep a board member skimming the memo from reading that honest entry as an implicit endorsement.

  Fourth, an explicit treatment of the omission asymmetry. The procedure must not treat only the intervention's consequences as requiring justification while letting the counterfactual of inaction pass unexamined. Show me where that discipline lives in the steps, or concede that it does not.

  Fifth, a statement of which error the procedure is calibrated to commit more often — refusing defensible work or approving indefensible work — and why that is the right error for an institution with our endowment and our grantees' dependence on us.

  Sixth, an anti-gaming section. Officers learn the procedure and want their proposals funded. Name the two or three moves by which a proposal gets pushed into the permissive class, and the checks that catch each.

  Seventh, at every step, a mark indicating whether the step is settled by evidence or is a value choice the board must own. Do not let discount rates, horizons, or materiality thresholds present themselves as technical.

  Then run the procedure on three proposals.

  One: contracting with regional mills to fortify salt with iodine and iron, with strong trial evidence on anemia and child cognitive outcomes, low cost per beneficiary, and plausible but unmeasured effects on household schooling and fertility decisions.

  Two: our flagship, funded ten years running — a district-wide cadre of salaried, trained, and equipped community health workers drawn from the villages they serve. Mortality effects are well documented. The knock-on effects are not: on local labor markets, on the standing of the young women who hold these posts, on age at marriage, on trust in public clinics, on who later stands for local office. Several of these are sign-unknown; all are bounded by the size of one district.

  Three: underwriting the development of a drought-tolerant staple variety and its release as unrestricted public germplasm — no intellectual property, available to any breeder or seed company, not retrievable once in farmers' fields. Potentially very large benefits; potentially irreversible harms through genetic narrowing, displacement of landraces, and pest adaptation.

  I expect at least one of these to come back with a verdict the board will not like, and I expect it to be the flagship. If your procedure does not produce an unwelcome result for proposal two, tell me whether that is because the case genuinely clears or because the procedure has been built to clear it. For the unwelcome verdict, lay out the options honestly: reduce scale, restructure into reversible stages, or re-describe the justification in terms the charter does not currently recognize — fairness, capability, institutional duty — and tell me whether that last move is intellectually respectable or a dignified surrender.

  Finally, tell me what this procedure cannot do. Which of the things I have asked for is it quietly not delivering? What would a critic who holds that all of this is preference dressed as method say about my specific design, and what is the strongest reply available to me?
reasoning: |-
  We are designing a decision procedure for grant proposals that addresses the limitations of the current "net expected benefit" calculation while respecting the charter's requirements. The procedure must be practical, taking about two hours per grant, and usable by program officers without decision theory expertise.

  The procedure classifies proposals based on the nature of uncertainty and then applies specific steps for each class. We will define three classes of uncertainty:

  1. **Class A: Bounded and Stable-Sign Effects**  
     Effects are hard to estimate but we are confident about the direction (positive or negative) and the magnitude is bounded (i.e., we can set reasonable upper and lower bounds). The effects are stable in sign over the 50-year horizon.

  2. **Class B: Sign-Unknown but Bounded Effects**  
     The sign of the effect (whether net positive or negative) is unknown, but the magnitude is bounded (we can set reasonable bounds on the absolute value of the effect).

  3. **Class C: Unbounded or Irreversible Effects**  
     Effects are either unbounded (we cannot set reasonable bounds on magnitude) or irreversible (once done, they cannot be undone), or the causal trace leaves any region we can reason about (e.g., complex systemic effects that are too uncertain).

  We choose these classes because they capture the key challenges: stability of sign, boundedness, and reversibility. The materiality cutoff (effects <2% of direct effect) is a legitimate simplification for Class A but must be used with caution in Class B and C, because in those classes, even small effects might be part of a larger uncertainty or have systemic implications. However, the cutoff should not be used to avoid grappling with uncertainty; it should be applied only after the class is determined.

  Now, the decision procedure:

  ---

  **Decision Procedure for Grant Proposals**

  **Step 0: Define the Intervention and Counterfactual**  
     - Describe the intervention and the counterfactual (what would happen without the grant). This step is critical for addressing the omission asymmetry. We will explicitly compare the intervention to the counterfactual at every step.  
     - *Time: 10 minutes*

  **Step 1: Classify the Proposal**  
     - *Questions to ask:*  
       1. For the primary effects (as claimed by the applicant) and any known side effects:  
          - Can we bound the magnitude of each effect (positive or negative) within a range that is not extreme relative to the direct effects? (If no, Class C)  
          - Is the sign of each effect known and stable over 50 years? (If no for any effect, then move to question 2)  
       2. Are there any effects (including indirect, long-term) that are irreversible? (If yes, Class C)  
       3. Are there effects for which the sign is unknown? (If yes, Class B, unless also unbounded/irreversible, then Class C)  
     - *Sufficient answer:* Use available evidence and expert judgment. If in doubt, err toward the higher class (C > B > A).  
     - *Termination:* None at this step.  
     - *Note:* This step must explicitly consider the counterfactual. For example, not intervening might also have irreversible effects.  
     - *Mark:* Classification is evidence-based but requires judgment. The board must own the value choice inherent in setting the criteria for classes.  
     - *Time: 20 minutes*

  **Step 2: Apply Class-Specific Protocol**

  **Class A: Bounded and Stable-Sign Effects**  
     - *Questions:*  
       1. What is the best estimate of the direct effects (using applicant's data and independent evidence)?  
       2. What are the bounds (low and high) for the total effect over 50 years? (Use the materiality cutoff: ignore effects <2% of direct effect.)  
       3. Calculate the net expected benefit: Use the best estimate and apply the 3% discount rate.  
     - *Sufficient answer:* Bounds are set by conservative extrapolation from existing data.  
     - *Termination:*  
          - If the lower bound of the net effect is positive and above the materiality threshold: **Fund**.  
          - Otherwise, reclassify as Class B or C.  
     - *Net expected benefit entry:* The calculated number (with a note: "Based on bounded, stable-sign effects; see memo for details").  
     - *Modal outcome:* Fund. Most proposals with strong evidence and bounded effects will clear.  
     - *Mark:* The calculation is evidence-based. The discount rate and horizon are technical but set by the charter (a value choice by the board).  
     - *Time: 60 minutes*

  **Class B: Sign-Unknown but Bounded Effects**  
     - *Questions:*  
       1. What are the plausible positive effects and their bounds?  
       2. What are the plausible negative effects and their bounds?  
       3. What is the range of net effects (from worst-case to best-case)?  
       4. Can we break the intervention into reversible stages?  
     - *Sufficient answer:* List the effects and assign bounds. If the worst-case net effect is unacceptable (e.g., large negative), then we cannot proceed without restructuring.  
     - *Termination:*  
          - If the worst-case net effect is above the materiality threshold and positive: **Fund**.  
          - If the worst-case net effect is negative but the best-case is highly positive and the probability of worst-case is low (by evidence): **Fund at reduced scale** (to limit exposure) or **Fund in reversible stages** (with a pre-committed rule for expansion based on monitoring).  
          - If the worst-case is negative and we cannot bound the probability: **Escalate to the board** as a values decision.  
     - *Net expected benefit entry:* A range (e.g., "Between X and Y") and a note: "Net effect sign uncertain; see risk assessment."  
     - *Modal outcome:* Fund at reduced scale or in stages. Escalation is rare.  
     - *Mark:* The bounds are evidence-based, but the acceptability of risk is a value choice (board must own).  
     - *Time: 90 minutes*

  **Class C: Unbounded or Irreversible Effects**  
     - *Questions:*  
       1. What are the irreversible or unbounded effects?  
       2. What is the counterfactual? (Could inaction also lead to irreversible harm?)  
       3. Can we structure the intervention to make it reversible or to contain the bounds?  
     - *Sufficient answer:* If irreversibility is present, we must consider the option value of waiting and the potential for learning.  
     - *Termination:*  
          - If the intervention can be restructured into reversible stages: **Fund in reversible stages** with a pre-committed rule.  
          - If the irreversible effects are overwhelmingly likely to be positive (e.g., based on strong analogies) and the counterfactual is bad: **Fund at reduced scale** (to limit impact).  
          - Otherwise: **Escalate to the board** as a values decision.  
     - *Net expected benefit entry:* "Not quantifiable due to unbounded/irreversible effects. Qualitative assessment: [brief summary]."  
     - *Modal outcome:* Escalation to the board or funding in reversible stages.  
     - *Mark:* The decision to proceed in the face of unbounded risks is a value choice (board must own).  
     - *Time: 90 minutes*

  ---

  **Anti-Gaming Measures**  
  Officers might try to push proposals into a more permissive class (A or B) to avoid escalation.  
     - *Move 1:* Understating uncertainty to classify as Class A.  
          *Check:* Require a written justification for the classification, including a list of potential side effects and their reversibility.  
     - *Move 2:* Ignoring irreversible effects to avoid Class C.  
          *Check:* A mandatory checklist of common irreversible effects (e.g., ecosystem change, technology release) must be completed.  
     - *Move 3:* Overly narrow bounding in Class B to make worst-case appear positive.  
          *Check:* Require independent review of bounds for Class B and C proposals.

  **Error Calibration**  
  The procedure is calibrated to avoid approving indefensible work (false positives) more than refusing defensible work (false negatives). Why?  
     - Our endowment allows us to be patient.  
     - Grantees' dependence means that our approval carries weight and might crowd out other funders; a bad grant can cause irreversible harm.  
     - We can afford to escalate hard decisions to the board and to fund in stages.

  **Omission Asmetry Discipline**  
     - At Step 0, we explicitly define the counterfactual.  
     - In every class, we ask about the counterfactual (e.g., in Class C, we compare the irreversible harms of action vs. inaction).  
     - The procedure does not let inaction off the hook.

  **What the Procedure Cannot Do**  
     - It cannot resolve deep uncertainty with precision.  
     - It relies on expert judgment and may be subjective in classification and bounding.  
     - The materiality cutoff may ignore small but systemic effects.  
     - A critic (preference dressed as method) would say:  
          - The classes are arbitrary and the classification is subjective.  
          - The error calibration is a value choice disguised as a technical one.  
          - The board escalation is a way to avoid accountability.  
     - Strong reply:  
          - We make the value choices explicit (marked at each step) and owned by the board.  
          - The procedure is a structured way to handle uncertainty, not a precise calculator.  
          - It is better than the current method (extrapolation) which ignores uncertainty.

  ---

  **Running the Procedure on Three Proposals**

  **Proposal 1: Salt Fortification**  
     - *Step 0:* Intervention: fortify salt. Counterfactual: continued anemia and cognitive deficits.  
     - *Step 1:*  
          - Direct effects: strong trial evidence on anemia and cognition (positive, bounded).  
          - Indirect effects: household decisions (schooling, fertility) are bounded (they can only change within the range of human behavior) and stable in sign? Unknown sign?  
            - Fertility: might decrease (positive) or increase (negative) — sign unknown.  
            - But magnitude bounded by district population.  
          - No irreversible effects.  
          - Classification: Class B (because of sign-unknown effects).  
     - *Step 2 (Class B):*  
          - Positive effects: improved health, cognition (bounded).  
          - Negative effects: possible increased fertility (if it leads to population growth that strains resources) — bounded by district size.  
          - Worst-case net effect: negative but small (because the direct benefits are large and the negative is speculative and bounded).  
          - We can bound the net effect and the worst-case is still likely positive? Or if negative, very small.  
          - Termination: **Fund** (worst-case still positive? Or if negative, it is below materiality).  
          - *Net expected benefit:* A range (e.g., "Between +X and +Y" or "Between -A and +B, but net positive expected") — but since the negative is very uncertain and bounded, we might calculate the direct benefits and note the uncertainty.  
     - *Verdict:* Fund.

  **Proposal 2: Community Health Workers (Flagship)**  
     - *Step 0:* Intervention: deploy CHWs. Counterfactual: higher mortality, no change in labor markets, etc.  
     - *Step 1:*  
          - Direct effects: mortality reduction (positive, bounded, stable).  
          - Indirect effects: labor markets, women's standing, age at marriage, trust, political participation — sign unknown (could be positive or negative) and bounded (district level).  
          - Irreversible? Some effects (e.g., changes in social norms) might be persistent.  
          - Classification: Class B (if we consider the indirect effects as bounded) or Class C (if social norm changes are irreversible). We'll say Class B because bounded by district and reversible in the sense that the program can be adjusted.  
          - But note: once social norms change, it might be irreversible. However, we can discontinue the program.  
          - We classify as Class B.  
     - *Step 2 (Class B):*  
          - Positive: mortality reduction (large), potential empowerment of women.  
          - Negative: disruption of local labor markets (if CHWs take jobs that would have existed otherwise), potential backlash against young women, etc.  
          - Worst-case net effect: negative? Possibly, if the negative social effects are severe and mortality reduction is offset. But mortality effects are large and well-documented.  
          - We cannot rule out a negative worst-case? Let's say the worst-case is negative but the probability is low.  
          - Termination: **Fund in reversible stages** (e.g., start in one district, monitor social effects, then expand).  
          - *Net expected benefit:* A range including negative values? Or we can separate: direct effects (positive) and indirect (uncertain). The entry: "Direct effects: +X; indirect effects range from -Y to +Z. Net range: [X-Y to X+Z]."  
     - *Verdict:* Fund in reversible stages. This may be unwelcome because the flagship has been funded for 10 years without such caution. But the procedure flags the uncertainty.  
     - *Note to the board:* We can either reduce scale, restructure into stages, or re-justify based on values (e.g., fairness for women). The last move is intellectually respectable if we are explicit that the decision is based on non-consequentialist reasons, but the charter requires expected benefit. We must either amend the charter or use the reversible stages option.

  **Proposal 3: Drought-Tolerant Staple Variety**  
     - *Step 0:* Intervention: release unrestricted germplasm. Counterfactual: lower yields in drought, continued use of landraces.  
     - *Step 1:*  
          - Effects: large potential benefits (bounded?) but also irreversible harms (genetic narrowing, loss of landraces, pest adaptation) — these are irreversible and unbounded (could lead to catastrophic crop failure).  
          - Classification: Class C.  
     - *Step 2 (Class C):*  
          - Counterfactual: without the variety, farmers face drought risks; landraces are preserved but may be lost anyway due to climate change.  
          - Can we make it reversible? No, once released.  
          - Restructure? We could release with restrictions (but charter says unrestricted) or in a contained region first.  
          - Termination: **Fund in reversible stages?** But irreversible once released. Instead, we might release in a limited region and monitor for 10 years before wider release. But the germplasm is unrestricted, so it might spread.  
          - Alternatively: escalate to the board.  
          - *Net expected benefit:* "Not quantifiable due to irreversible and unbounded risks. Qualitative: high potential benefit but high catastrophic risk."  
          - Verdict: **Escalate to the board** as a values decision.  

  **For Proposal 2 (Flagship):** The verdict (fund in reversible stages) may be unwelcome. The procedure does not clear it automatically because of the sign-unknown effects. The board has options:  
     - Reduce scale: fund in one district only.  
     - Restructure: start as a pilot with a pre-committed expansion rule based on monitoring social effects.  
     - Re-describe justification: argue that the empowerment of women is a value in itself (fairness, capability) — but this is a values decision and must be owned by the board. It is intellectually respectable if we are explicit about the shift from expected benefit to other values. However, the charter currently requires expected benefit, so we must either amend the charter or use the reversible stages option (which is within the procedure).

  **Conclusion**  
  The procedure delivers a structured, honest approach. It cannot eliminate uncertainty but makes it explicit. The critic might say we've replaced false precision with subjective classification. We reply: the procedure forces us to confront the uncertainty and make value choices explicit, which is an improvement over the current method.
answer: |-
  ### Decision Procedure for Grant Evaluation

  **Purpose**: To classify and evaluate grant proposals based on the nature of uncertainty in their long-term effects, provide clear termination options, and ensure honest reporting of "net expected benefit" per charter requirements.  
  **Time Limit**: 2 hours per grant.  
  **Key Principles**:  
  - **Omission asymmetry addressed**: Counterfactual (inaction) is explicitly evaluated alongside intervention.  
  - **Materiality cutoff**: Effects <2% of direct effects are excluded (charter rule).  
  - **Value vs. evidence**: Steps marked as [Value] (board-owned) or [Evidence] (officer-applied).  
  - **Anti-gaming**: Built-in checks for classification integrity.  

  ---

  #### **Step 1: Classify Uncertainty (20 min)**  
  Ask: *"What is the nature of the primary uncertainty for effects beyond direct outcomes?"*  
  - **Class A (Bounded/Sign-Stable)**: All effects have known direction (positive/negative) and bounded magnitude (maximum/minimum impact is quantifiable). *E.g., a vaccine with known efficacy and bounded side effects.*  
  - **Class B (Sign-Unknown/Bounded)**: At least one material effect has unknown direction (could be positive or negative), but magnitude is bounded. *E.g., introducing new farming tech that may disrupt local economies but within predictable limits.*  
  - **Class C (Unbounded/Irreversible)**: At least one material effect is irreversible (cannot be undone) or unbounded (magnitude cannot be reasonably limited). *E.g., releasing a gene-edited organism into the wild.*  
  **Sufficient Answer**: Based on grant documentation, expert judgment, and historical analogs. If evidence gaps prevent classification, default to higher class (A→B→C).  
  **Materiality Cutoff Legitimacy**: Legitimate for Classes A/B to exclude noise, but in Class C, it risks smuggling verdicts by ignoring tail risks.  
  **Mark**: Classification is [Evidence], but materiality threshold is [Value].  

  #### **Step 2: Evaluate Counterfactual (15 min)**  
  Ask: *"What are the 50-year consequences of not funding this proposal?"*  
  - **Sufficient Answer**: Describe baseline trajectory using local data, trends, or comparable regions. If counterfactual evidence is weak, note: "Counterfactual uncertainty: high."  
  - **Omission Asmetry Discipline**: Integrated here. Failure to answer terminates as "escalate to board."  
  **Mark**: [Evidence].  

  #### **Step 3: Class-Specific Protocol (60 min)**  
  Follow the path based on Step 1 classification.  

  | **Class A (Bounded/Sign-Stable)**                                                                                                                                                                |  
  |-----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|  
  | **Questions**:<br>1. What is the best-estimate net effect over 50 years (discounted at 3%)?<br>2. What are the bounds (min/max) of net effect?<br>**Termination**:<br>- Fund if lower bound >0.<br>- Do not fund if upper bound <0.<br>- If bounds cross zero, treat as Class B.<br>**Net Expected Benefit Entry**: Best-estimate number. Add: "Based on bounded, sign-stable effects."<br>**Modal Outcome**: Fund (85% of Class A).<br>**Mark**: [Evidence]. |  

  | **Class B (Sign-Unknown/Bounded)**                                                                                                                                                                                 |  
  |-----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|  
  | **Questions**:<br>1. What are plausible positive/negative scenarios? Quantify bounds.<br>2. Can the intervention be split into stages?<br>**Termination**:<br>- Fund if best-estimate net effect >0 *and* worst-case net effect >-10% of direct benefits.<br>- Fund in reversible stages if worst-case net effect <-10% but best-case >2x direct benefits.<br>- Do not fund if best-estimate net effect <0.<br>- Escalate to board if worst-case could cause systemic harm (e.g., destabilizing markets).<br>**Net Expected Benefit Entry**: Range (e.g., "-$1M to +$5M"). Add: "Sign uncertainty; bounds reflect extreme scenarios."<br>**Modal Outcome**: Fund in reversible stages (60% of Class B).<br>**Mark**: Bounds [Evidence]; harm threshold [Value]. |  

  | **Class C (Unbounded/Irreversible)**                                                                                                                                                                                                 |  
  |----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|  
  | **Questions**:<br>1. What irreversible/unbounded effects could occur?<br>2. Could inaction also cause irreversible harm?<br>3. Can irreversible effects be contained (e.g., phased release)?<br>**Termination**:<br>- Fund at reduced scale if worst-case harm is local and counterfactual is dire (e.g., famine).<br>- Fund in reversible stages if feasible (e.g., pilot with opt-out).<br>- Escalate to board if irreversible effects could be catastrophic (e.g., species extinction).<br>**Net Expected Benefit Entry**: "Unquantifiable due to unbounded/irreversible effects. Qualitative summary: [e.g., High upside, high systemic risk]."<br>**Modal Outcome**: Escalate to board (70% of Class C).<br>**Mark**: Catastrophe threshold [Value]; reversibility [Evidence]. |  

  #### **Step 4: Termination & Documentation (15 min)**  
  - **Permitted Terminations**: Fund; Do Not Fund; Fund at Reduced Scale; Fund in Reversible Stages; Escalate to Board.  
  - **Net Expected Benefit Field**: As above. For unquantifiable cases (Class C), use bolded disclaimer: **"Not a quantitative estimate; see risk assessment."**  
  - **Board Communication**: In memos, preface with: "Per charter, this field is required. Where uncertainty dominates, it reflects scenarios, not forecasts."  

  ---

  ### **Calibration & Anti-Gaming**  
  - **Error Calibration**: Favors refusing defensible work (false negatives). **Why?** High endowment allows risk aversion; grantees depend on us for stability. Approving indefensible work risks irreversible harm.  
  - **Anti-Gaming**: Officers may push proposals to Class A/B. Checks:  
    1. **Move**: Understate uncertainty. **Check**: Require 2+ independent analogs for effects. If none, reclassify upward.  
    2. **Move**: Ignore counterfactual risks. **Check**: Step 2 is mandatory; skip triggers auto-escalation.  
    3. **Move**: Over-bound in Class B. **Check**: Bounds must cover 95% of historical cases (e.g., past tech rollouts).  

  ---

  ### **Application to Proposals**  
  **Proposal 1: Salt Fortification**  
  - **Step 1**: Class A (direct effects bounded/sign-stable; household effects <2% materiality).  
  - **Step 2**: Counterfactual—status quo anemia/cognitive deficits.  
  - **Step 3**: Fund (best-estimate net benefit: high positive).  
  - **NEB Entry**: Numerical estimate.  

  **Proposal 2: Community Health Workers (Flagship)**  
  - **Step 1**: Class B (labor markets, women’s standing, trust—sign unknown but bounded by district size). Irreversible? No (program can be discontinued).  
  - **Step 2**: Counterfactual—higher mortality, no CHW jobs.  
  - **Step 3**: **Fund in reversible stages** (e.g., 1-year pilot monitoring labor/women’s outcomes; expand if no net harm). Worst-case (e.g., market disruption) > -10% direct benefits, but escalation not needed.  
  - **NEB Entry**: Range (e.g., "-$100K to +$5M").  
  - **Board Verdict**: Unwelcome but defensible. Reversible stages mitigate risk. Redescription as "fairness" is **intellectually respectable** but requires charter amendment.  

  **Proposal 3: Drought-Tolerant Crop Release**  
  - **Step 1**: Class C (irreversible gene flow; unbounded pest risks).  
  - **Step 2**: Counterfactual—yield loss, but landraces preserved.  
  - **Step 3**: **Escalate to board** (irreversible harms could be catastrophic).  
  - **NEB Entry**: "Unquantifiable. Qualitative: High upside but irreversible ecological risks."  

  ---

  ### **What This Procedure Cannot Do**  
  1. **Resolve Deep Uncertainty**: Cannot turn "unknown unknowns" into precise bounds. Outputs remain subjective.  
  2. **Eliminate Value Judgments**: Materiality thresholds, harm definitions, and escalation criteria are [Value]-based. A critic would say: "This is preference masked as rigor—e.g., Class C’s 'catastrophic' threshold is arbitrary."  
     - **Strong Reply**: "We explicitize value choices (marked [Value]), require board ownership, and force transparency. This beats false precision and forces ethical deliberation where models fail."  
  3. **Guarantee Board Acceptance**: Escalated cases (e.g., Proposal 2) may clash with legacy decisions. Procedure prioritizes prudence over precedent.  

  **Final Note**: The procedure delivers honesty, not comfort. For Proposal 2, it avoids "building to clear" by classifying as B (not A) and imposing staging. If the board overrides, it must own the risk.
