  For my diagnosis: First, this is primarily a verbal dispute where "experience" means different things to each camp - phenomenal presence for empiricists versus fixed/verifiable content for skeptics. Second, Malcolm and Dennett aren't true allies; Malcolm questions conceptual coherence while Dennett challenges empirical testability. Third, both sides share an unexamined empirical assumption about whether phenomenal states require verifiable content fixation. 

  Fourth, progress would require distinguishing between phenomenal immediacy (what dreaming feels like) and causal determination (when content forms). Fifth, expecting traditional resolution may be misguided - the debate might persist as foundational philosophy often does, though clarifying distinctions could advance understanding.

