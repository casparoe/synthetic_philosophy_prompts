answer: |-
  Here are five diagnostic points:

  1.  The stalemate is primarily **verbal**, stemming from an ambiguous core term: "experience" slides between *phenomenal character* (subjective feel), *verifiable content* (reportable narrative), and *causal determination* (when that content is fixed), preventing clear disagreement.

  2.  **Malcolm and Dennett are not genuine allies**: Malcolm's argument is *conceptual* (about the logic of dream reports), denying "experience" makes sense here, while Dennett's is *methodological* (about testability), granting the concept but denying evidential support for the experiential hypothesis.

  3.  A covert **empirical question** underlies the debate: *Must phenomenal character be causally dependent on real-time brain events during sleep, or can it be a functionally identical post-hoc construction?* The camps assume opposing answers without recognizing this shared, testable core.

  4.  Progress requires **distinguishing key concepts**: separating "phenomenal consciousness during sleep" (potentially non-reportable) from "reportable dream content" (fixed upon recall) and "causal origin of that content" (real-time vs. awake construction) would reframe the debate away from the monolithic "experience".

  5.  Progress is possible but **limited**; empirical work (e.g., neural correlates of specific reportable content) can constrain the covert question, but the nature of phenomenal character itself remains philosophically contested, ensuring no final dissolution of the underlying mystery.
