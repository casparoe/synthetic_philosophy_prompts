prompt: |-
  I run a Tuesday night class at the community center in my town — mostly adults who didn't finish school, a couple of them just out, a couple working nights. They're the sharpest arguers I know. I'm not a teacher by training, I just read all the time and write my own materials, and at the end of every term we do a written final that I mark, and then we go through it together as a group and they tell me where I got it wrong. Usually they're right.

  This term was on cause and blame, and we ended up stuck on causing something by *not* doing it. I said: suppose I promise to feed my neighbour's cat, I forget, the cat dies. Everyone in the room agreed I caused it — but nothing came out of me, there was no event, just a hole where an event should of been. Then the tow truck driver said fine, but by the same logic the mayor of our city caused that cat to die too, since if the mayor had driven over and fed it, the cat lives. Nobody could answer him and we ran out of term.

  So for the final I want one essay question built out of that, plus a model answer, plus a marking scheme.

  Here's the situation I invented. Tighten the wording however you like, but don't change the structure — the structure is the whole point.

  Case one. A cold-storage warehouse holding a pallet of insulin for a clinic. The shift rulebook says the overnight guard checks the freezer panel at 3am and again at 5am. Maya is the overnight guard; she knows the rule and has done it every night for two years. On this night she skips the 3am check to finish a coworker's paperwork. A valve starts leaking refrigerant around 2:40. At 3am the gauge would have shown the temperature climbing, and the rulebook says any climb means you ring the on-call tech, who could have had it fixed well before the insulin got too warm. The automatic high-temperature alarm had been switched off a month earlier by the manager because of false alarms, so the manual check was the only thing left standing between the leak and the loss. At 5am Maya does her check and finds the freezer at twelve degrees. The pallet is ruined.

  Case two. Same building, same leak at 2:40, same disabled alarm, same ruined pallet. One change. Maya is a temp from an agency, hired that afternoon to sit at the gate and log trucks. Nobody told her about the panel, nothing in her assignment mentions it, nobody expects her to know the building. The guard who is supposed to do the 4am backup walk, Tomas, fell asleep in the break room and never did it. And physically it's the same as case one: if Maya had wandered in and glanced at the panel at 3am she'd have seen the climb and known enough to ring the number stuck on the wall. When I tell this version, nearly everyone says her not looking didn't cause the loss, and Tomas's nap did.

  Case three, the tow truck again. A retired refrigeration engineer, forty miles away, used to service that building, knows exactly what that gauge reading would have meant. He wasn't there, he checked nothing. If he had been there and looked, the insulin would have been saved.

  They get 45 minutes, closed book. They haven't read a single philosopher and I don't want the question or the model answer name-dropping any — everything the question needs has to be sitting inside the question itself.

  The question should make them do three things: work out what exactly is hard about the fact that case one and case two have the same physical facts and the same what-would-have-happened facts but come out judged differently; propose something that explains the difference; and then test their own proposal on the retired engineer. I want a fourth beat too, where they have to face whether their fix means causation itself shifts when a manager writes or deletes a rule, and whether that's a cost they'll pay or dodge.

  A student who just recites "an omission causes an outcome if the outcome would have been prevented" should not pass. A student who says omissions arent really causes at all, we just talk that way, should not pass either — unless they can say what that does to the verdict everyone reaches in case one.

  Model answer around 600 words, plain words, written for someone smart who has never seen a philosophy paper and never will.

  Marking scheme out of 20, and I want it in terms of specific moves rather than vibes: tell me what an A answer does that a B answer doesn't, where the marks sit, and what each part is worth. Then give me the two or three responses that sound impressive out loud in the room but should lose marks, with a line each on why they're a dodge.
reasoning: |-
  Okay, the user runs a community center class for adults who didn't finish school. They need an essay question based on causation and blame scenarios involving omissions, plus a model answer and marking scheme. 

  First, let's unpack the user's core dilemma: their students are stuck on how "not doing something" can cause harm. The cat example shows the tension - they agree the neighbor caused the death but reject the mayor being responsible. The three warehouse cases are brilliant because they create a controlled experiment: same physical facts, different assignments of blame. 

  The essay question needs to force students to confront four things: 
  Why cases 1 and 2 feel different despite identical circumstances
  What principle explains the difference 
  Whether that principle works for the engineer case 
  And whether this makes causation dependent on human rules

  Hmm... the model answer must avoid philosophy jargon. Let's build it around "position" - whether someone is placed to act. Maya in case 1 occupies a specific position with expectations; temp Maya doesn't. The engineer has no position at all. 

  For the marking scheme, top marks should require: 
  - Noticing the physical/would-have facts are identical 
  - Identifying role/expectation as the differentiator 
  - Applying it consistently to the engineer 
  - Grappling with rule-dependence 

  Common dodges to penalize: 
  - Just repeating "omission causes if prevention possible" (avoids the hard part) 
  - Saying omissions aren't real causes (contradicts case 1 verdict) 
  - Blaming only the leak/alarm (ignores the omission element)

  The model answer should show how "position" explains all cases without fancy terms. Key move: distinguish between "could have" and "should have been expected to". That handles the mayor problem too - he could have but wasn't positioned to. 

  Biggest challenge is making the rule-dependence point clear without losing students. The insulin won't care about shift schedules - so is causation really about physics or human arrangements? The answer should sit in that tension without resolving it neatly. 

  User's students sound sharp - they'll spot if we duck the hard implications. The model answer must show the cost: yes, rules change what we call "cause", but that's how responsibility works in practice. 

  Final check: does this satisfy the "fourth beat"? The model answer's last paragraph tackles it head-on with the insulin's indifference to paperwork. That should spark great arguments in their review session.
answer: |-
  Here's the complete final exam package designed for your sharp students, focused on omission-causation and the role of expectations/roles:

  **Essay Question (Word Count: 198)**

  "Below are three descriptions of the same ruined pallet of insulin. In all cases, a refrigerant leak started at 2:40am, the automatic alarm was disabled, and the insulin spoiled because no one intervened in time.

  1.  **Maya (Regular Guard):** Maya knew the rulebook required her to check the freezer panel at 3am and 5am. She had done this check reliably for two years. On this night, she skipped the 3am check to finish paperwork. If she had checked at 3am, she would have seen the temperature climbing and called the on-call tech, saving the insulin. She found the problem at 5am.
  2.  **Maya (Temp Gate Guard) & Tomas:** Maya was hired *only* to sit at the gate and log trucks. She was not told about the freezer panel, her assignment didn't mention it, and no one expected her to check it. Tomas, the guard responsible for a 4am backup walk (including panel check), fell asleep. If Maya *had* wandered in and checked the panel at 3am, she *could* have seen the climb and called the number on the wall, saving the insulin.
  3.  **The Retired Engineer:** A retired refrigeration engineer, who used to service the building and knew exactly what a climbing temperature meant, lived forty miles away. He did nothing that night. If he *had* been there and looked at the panel at 3am, he *could* have saved the insulin.

  **Your Task: Explain why we might say Maya the Regular Guard *caused* the loss by not checking (Case 1), but Maya the Temp Gate Guard did *not* cause the loss by not checking (Case 2), even though physically and in terms of what *could* have happened, the situations were identical at 3am. What principle makes the difference? Then, apply that same principle to the Retired Engineer (Case 3): did *his* not-checking *cause* the loss? Explain clearly. Finally, consider this: if the difference hinges on things like job descriptions and rules, does this mean that what counts as 'causing' an outcome can change just because a manager writes or deletes a rule? Is this a problem? Why or why not?"**

  ---

  **Model Answer (Word Count: 598)**

  The physical facts and the "what could have happened" facts are exactly the same in Case 1 and Case 2 at 3am. In both, if *someone* had looked at the panel at 3am and called the tech, the insulin would have been saved. In both, Maya-the-person *could* physically have walked over and looked. So why do we blame Maya the Regular Guard (Case 1) for causing the loss by not looking, but not Maya the Temp Gate Guard (Case 2)?

  The difference isn't about physics or possibility; it's about **position and expectation**. Maya the Regular Guard was *in a specific position* defined by her job. She *knew* the rule, had a track record of following it, and everyone relied on her to do it. Her job description *placed her there specifically* to catch this kind of problem. By skipping the check, she failed to do the very thing she was *supposed* to be doing to prevent this exact disaster. Her inaction wasn't just any missing action; it was the failure of the designated safeguard. That’s why her omission feels like the direct cause – the expected barrier wasn't there.

  Maya the Temp Gate Guard, however, was in a completely different position. Her job was gate duty, *not* freezer monitoring. She wasn't told about the panel, wasn't trained on it, and nobody expected her to check it. While she *could* have wandered over and looked, there was no reason she *should* have. She wasn't the designated safeguard; Tomas was (and he failed). Her not looking wasn't a failure of her assigned duty; it was just something she didn't do that she wasn't expected to do. The cause lies with the leak, the broken alarm, and Tomas failing *his* duty, not with her failing a duty she never had.

  Applying this "position and expectation" principle to the Retired Engineer (Case 3): He clearly *could* have saved the insulin if he'd been there. He had the knowledge. But he was *in no position* to act that night. He was retired, forty miles away, and had no current role, duty, or expectation tied to that warehouse freezer. Nobody was relying on him to check it. His not checking wasn't a failure; it was just him living his life. We wouldn't say he *caused* the loss. The cause remains the leak, the broken alarm, and the failure of the specific people *in position* that night (Maya in Case 1, Tomas in Case 2).

  This leads to the final point: Yes, this *does* mean that whether an omission "causes" an outcome can depend on human rules and job descriptions. If the manager writes a rule putting Maya on freezer checks, her omission causes the loss. If the manager deletes that rule or hires her for gate duty only, her identical physical omission doesn't cause it. Causation here isn't just about physics; it's tied to our systems of responsibility.

  Is this a problem? It's not a problem *logically* if we accept that causation in human affairs often involves responsibility. We need to know *who* to hold accountable when things go wrong, and that depends on who was supposed to act. However, it *feels* strange because the insulin spoiled the same way regardless of paperwork. The physical world doesn't care about job titles. The "cost" is that causation becomes partly social, not purely physical. We have to live with this if we want systems where people have defined roles and responsibilities. We dodge this cost only if we say omissions *never* cause anything, but that contradicts our strong sense in Case 1 that Maya the Regular Guard really *did* cause the loss by failing her duty. The price of making sense of omission-causation is accepting that rules and roles shape what counts as "the cause."

  ---

  **Marking Scheme (Out of 20)**

  *   **A (17-20)**: Excels in all areas. Clear, precise, uses the case details effectively. *Specifically:*
      *   **Identifies the Core Difficulty (2 pts)**: Explicitly states that Cases 1 & 2 have identical physical/"could have" facts but different judgments about Maya's omission causing the loss.
      *   **Proposes a Clear Principle (5 pts)**: Articulates a principle beyond simple prevention (e.g., position, role, duty, expectation, designated responsibility) that explains the difference. Uses case details (knowledge, training, job description, reliance) to support it. *Crucially distinguishes "could have" from "should have been expected to".*
      *   **Applies Principle to Engineer (3 pts)**: Correctly applies the principle to Case 3, concluding the engineer's omission did *not* cause the loss, explaining why he lacked the relevant position/expectation.
      *   **Addresses Rule-Dependence & Cost (6 pts)**: Explicitly acknowledges causation becomes dependent on rules/job descriptions. Grapples insightfully with the tension between this and physical reality ("insulin spoiled same way"). Clearly states the "cost" (causation is social/responsibility-based, not purely physical) and either accepts it as necessary for accountability or explains the dilemma convincingly if rejecting it. Avoids simple dismissal.
      *   **Structure & Clarity (2 pts)**: Well-organized, logical flow, plain language.
  *   **B (13-16)**: Good, but lacks the depth or precision of an A. *Typically:*
      *   Identifies the core difficulty.
      *   Proposes a principle but maybe vaguer (e.g., "responsibility" without unpacking role/expectation) or doesn't fully leverage case details.
      *   Applies principle to Engineer, but justification might be weaker.
      *   Addresses rule-dependence but may be superficial about the cost ("it's just how we talk" without engaging the physical tension, or simply accepts/rejects without exploring *why* it's a cost).
      *   Generally clear but might have minor organizational issues.
  *   **C (9-12)**: Adequate but superficial or has significant gaps/errors. *Typically:*
      *   Mentions Cases 1 & 2 differ but doesn't clearly articulate the *identical facts* causing the difficulty.
      *   Principle is weak, incomplete, or relies too heavily on simple prevention ("if she could have stopped it").
      *   Application to Engineer is incorrect or missing justification.
      *   Rule-dependence is mentioned but the cost/implication isn't seriously addressed or is misunderstood.
      *   Organization or clarity issues.
  *   **D (5-8)**: Poor attempt, major misunderstandings, misses key points.
  *   **F (0-4)**: Little to no relevant response.

  **Dodges That Sound Good But Lose Marks (With Why):**

  1.  **"An omission causes harm only if there was a duty to act."** *Why it's a dodge:* This just labels the difference (duty/no duty) without *explaining why* duty makes the difference in *causal* terms, or how duty arises (rules, expectations, position). It avoids the core puzzle of identical physical circumstances. Needs to connect "duty" to the causal judgment *and* tackle the rule-dependence consequence. (Scores poorly on **Proposing Principle** and **Addressing Rule-Dependence**).
  2.  **"Causation is about the actual chain of events, omissions aren't real causes, we just assign blame."** *Why it's a dodge:* Contradicts the strong intuition in Case 1 that Maya's omission *was* a cause. Fails to explain *why* we "just assign blame" that way in Case 1 but not Case 2, or how that assignment works. Dodges explaining the difference between the cases on their own terms and avoids the rule-dependence question entirely. (Scores poorly on **Proposing Principle**, **Applying to Engineer**, and **Addressing Rule-Dependence**. May fail if it doesn't reconcile with Case 1).
  3.  **Focusing Solely on Proximate Cause/Foreseeability:** *Why it's a dodge:* While foreseeability plays a role in *blame*, the question is specifically about *causation by omission*. Saying Maya in Case 1 "should have foreseen" the risk doesn't fully explain why her omission is *the cause* vs. the leak or the broken alarm, nor why the Temp shouldn't have foreseen it (she *could* have guessed). It avoids the structural difference created by *role* and the rule-dependence issue. (Scores lower on **Proposing Principle** and **Addressing Rule-Dependence**).

  **Good luck with the final!** This question should generate exactly the kind of rigorous debate your class thrives on. The model answer gives a solid foundation, but your students will undoubtedly find nuances and pushback points during the review – which is the whole point.
