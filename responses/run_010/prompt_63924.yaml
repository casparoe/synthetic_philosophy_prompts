prompt: |-
  I write a science-and-ideas column for a mid-size outlet — pieces run about 3,000 words and the readers are smart but not academic. Next month I'm doing a long sit-down with a computational neuroscientist who's become the loudest advocate for what he calls "replacement-scale uploading." His pitch, roughly: you don't scan a brain and run it somewhere else, you swap neurons out one at a time for synthetic analogs that do exactly the same job, and if each individual swap is functionally negligible then consciousness just carries across — he leans hard on the old dancing-qualia style argument to make the point. News peg is that his lab just got funding to do the swap in awake, behaving mice, and he's said publicly that if it works in mice the same logic scales to humans and there's no further interesting question. He's charming, he's been interviewed a lot, and he's very good at steering everything back to the engineering.

  I've got 45 minutes. Write me ten to twelve questions that get into the weeds of the view instead of letting him give me the Ship of Theseus talk he gives everybody. Specifically I want:

  - two or three questions that exploit a hole in his own protocol: he's said the human version would be done during sleep, partly because its easier surgically, which means the subject never gets an uninterrupted first-person view of the transition. Does the dancing-qualia move still do any work when nobody is awake to watch their qualia dance? Anticipate his answer — something like "functional continuity is what matters, not witnessed continuity" — and give me the follow-up that makes him cash out what functional continuity is adding over and above "you wouldn't be able to tell."

  - one question on the halfway point, where half the brain is silicon and half isn't: can the two halves have different phenomenal character mid-procedure, and if they can, whose report about it is authoritative, given that the language areas sit on one side? Follow-up keyed to the answer he'll actually give.

  - one on "functionally negligible" — negligible as measured by what? I want him forced to name an observable, and then pressed on whether that observable is behavioral or something else, because if it's only behavioral he owes me a reason why identical behavior is evidence about experience rather than a restatement of his own assumption.

  - one on reversibility: if you can run the swap backwards and restore the tissue, does that show nothing was lost, or only that nothing detectable was lost? He'll say those come apart in words alone — push him on that.

  - one that seperates his case from the scan-and-copy case, since replacement means the original gets destroyed piece by piece rather than duplicated, and I want to know whether he thinks the duplication scenario is a red herring or a real threat to his argument.

  - and one straight question about what would change his mind, phrased so that "we'd see it in the mouse behavior" doesn't count as an answer.

  Then close with two questions a general reader will actually care about, one of which gets him onto who the first human candidate would realistically be and why anyone would volunteer — not onto his grant. No softballs, nothing like "what drew you to this work," and don't put words in his mouth; I only want the questions, plus a one-line note under each saying what answer I'm fishing for and why it's a hard one for him.
reasoning: |-
  Okay, let me tackle this query. The user is a science columnist preparing for an interview with a computational neuroscientist advocating "replacement-scale uploading." They need sharp questions that avoid rehearsed answers and probe deep into the theory's weaknesses. 

  First, I need to understand the core challenges: 
  The interviewee always steers conversations toward engineering, so questions must bypass that. The Ship of Theseus analogy is overused—needs fresh angles. The user specifically wants holes poked in the protocol, like the sleep-based transition lacking first-person observation. 

  Key angles to attack:
  - Functional continuity without witnessed continuity: How can he prove qualia persist if no one's awake to experience it? His likely "functional continuity" rebuttal needs pre-empted follow-ups demanding concrete definitions beyond behavior. 
  - Half-brain state: Potential for split phenomenology and reporting conflicts when language centers are partially replaced. Must corner him on who "speaks" for the consciousness. 
  - "Functionally negligible" ambiguity: Force him to specify measurable observables and confront if behavior alone suffices as experience evidence. 
  - Reversibility loophole: Does restoring tissue prove nothing was lost, or just that loss was undetectable? Push past his "semantic split" dodge. 
  - Duplication threat: Clarify why gradual destruction differs from scan-and-copy scenarios where identity duplication occurs. 
  - Falsifiability: Block the easy "mouse behavior" answer to force admission of what would genuinely disprove his theory. 

  For the closer, pivot to human stakes: Who volunteers first and why? Avoid grant talk—focus on real-world incentives and risks. 

  Each question needs a tactical one-liner explaining the trap: 
  - E.g., for reversibility: "If he admits detection limits matter, it undermines his 'nothing lost' claim." 
  - For halfway state: "If phenomenology can split, his 'single consciousness' narrative fractures." 

  Structure will be:
  - 2-3 sleep/continuity Qs with layered follow-ups 
  - 1 halfway-brain Q with neuroanatomy twist 
  - 1 "functionally negligible" deep dive 
  - 1 reversibility challenge 
  - 1 duplication contrast 
  - 1 falsifiability hardball 
  - 2 human-interest closers 

  Tone must stay neutral in phrasing but loaded in intent—no leading, just precise pressure points. The mouse funding peg is context, not a question topic. Avoid fluff like "what inspired you." 

  Biggest risk: Letting him retreat to engineering. Every follow-up must lock definitions and consequences.
answer: |-
  Here are 12 tightly focused questions designed to penetrate his standard narratives, plus closing human-interest angles. Each includes the strategic target and why it's difficult.

  1.  **"Your protocol for humans relies on performing the neuron swaps during sleep to ensure 'functional continuity' without disruption. But if the subject is never conscious *during* the swap process, how can we know phenomenal continuity – the actual persistence of subjective experience – is maintained? Isn't 'functional continuity' here just defined as the *absence of observable disruption*, which is different from *confirmed phenomenal persistence*?"**
      *   *Target:* Forces him to justify why behavioral/functional continuity (the absence of "you can tell") is evidence for *subjective* continuity when no first-person report is possible *during* the critical transition. Preempts the "functional continuity is what matters" dodge.
      *   *Why hard:* He must either admit a gap between function and phenomenology here (undermining his core argument) or double down and define functional continuity *as* phenomenal continuity (which is circular without first-person verification during swap).

  2.  **"Following that: If 'functional continuity' during the unconscious swap *is* your guarantee of phenomenal continuity, what specific, measurable functional markers – beyond simply 'the subject wakes up behaving normally' – constitute proof that experience itself persisted unbroken?"**
      *   *Target:* Makes him cash out "functional continuity" with concrete observables. A direct follow-up to #1, preventing evasion.
      *   *Why hard:* He likely relies on coarse behavior. Pressing for specifics exposes the lack of a neural correlate of consciousness (NCC) robust enough to track during this process. If he names something (e.g., specific neural ensemble dynamics), he must defend it as a true NCC.

  3.  **"During the swap, at the precise midpoint where half the neurons are biological and half are synthetic, could the two halves potentially exhibit *different* phenomenal states or qualities of experience, even briefly?"**
      *   *Target:* Challenges the assumption of a single, unified consciousness persisting seamlessly. Introduces the possibility of internal fracture.
      *   *Why hard:* Admitting the possibility cracks the "seamless transfer" narrative. Denying it requires explaining how disparate substrates guarantee unified phenomenology mid-process.

  4.  **"If such a split *were* possible mid-procedure, and the language centers (say, in the left hemisphere) were partially synthetic, whose report about the experience would be authoritative? Could the 'synthetic side' even report accurately, or would the 'biological side' dominate the narrative?"**
      *   *Target:* Follow-up exploiting neuroanatomy. Questions the reliability of *any* first-person report during the critical phase, undermining the claim that post-swap normalcy proves seamless phenomenal continuity.
      *   *Why hard:* He must grapple with the physical basis of reporting. If the reporting mechanism is compromised mid-swap, how can we trust *any* claim about internal state during or immediately after? Undercuts behavioral evidence.

  5.  **"You describe each individual neuron swap as 'functionally negligible.' Negligible *as measured by what*? Be specific about the observable you're using to define that threshold."**
      *   *Target:* Forces him to define the critical metric operationally.
      *   *Why hard:* He likely defaults to "no change in circuit output" or behavior. This sets up the next question.

  6.  **"If the observable defining 'negligible' is ultimately behavioral – the mouse still performs the task, the human wakes up and acts normally – doesn't that reduce your entire argument for phenomenal continuity to the assertion that identical behavior *necessarily implies* identical subjective experience? Why isn't that just restating your assumption rather than providing evidence for it?"**
      *   *Target:* Follow-up directly challenging the leap from behavior to phenomenology (the Hard Problem). Exposes the core philosophical assumption disguised as engineering.
      *   *Why hard:* He must defend behaviorism as sufficient for consciousness or admit the gap, which weakens his "no further interesting question" stance. His engineering focus makes this uncomfortable.

  7.  **"Your process is theoretically reversible – swapping synthetic neurons back to biological. If successful reversal restores the original biological brain, does that definitively prove *nothing* about the original subjective experience was lost during the synthetic phase, or only that nothing *detectable* (by our current measures, including behavior) was lost?"**
      *   *Target:* Highlights the distinction between ontological continuity and epistemic detectability.
      *   *Why hard:* He'll dismiss the distinction as semantic. Pressing forces him to confront whether reversibility truly addresses the *possibility* of undetectable phenomenal loss or alteration during the synthetic phase.

  8.  **"You argue replacement-scale uploading avoids the duplication problem of scan-and-copy because the original is gradually transformed, not copied. But in the replacement process, the original biological neurons *are* destroyed piecemeal. Doesn't this still mean the 'original' biological substrate is being destroyed, just very slowly? Why is gradual destruction more identity-preserving than instantaneous duplication-and-destruction?"**
      *   *Target:* Forces him to justify why his method isn't just slow destruction/replacement, directly comparing it to the "copy" scenario he dismisses.
      *   *Why hard:* He must argue that continuity of *process* (gradual replacement sustaining function) trumps continuity of *substrate* in a way that instantaneous copy-and-destruction does not. This is philosophically contentious.

  9.  **"Setting aside the mouse behavior – which you've defined as your success metric – what specific experimental outcome, either in the mice or in future work, would make you seriously reconsider the claim that phenomenal continuity is preserved by your 'functionally negligible' swap process? What result would genuinely surprise you and challenge your core thesis?"**
      *   *Target:* Forces him to define falsifiability beyond his own behavioral criterion. Blocks the "mouse misbehavior" escape hatch.
      *   *Why hard:* He's publicly staked his claim on mouse success scaling to humans. Admitting a specific phenomenal risk undermines certainty. He must either name something concrete (risking future refutation) or reveal dogmatism.

  10. **"Beyond the technical challenge, who *realistically* would be the first human candidate for this? What condition or motivation would outweigh the profound unknown risks of being the first entity to undergo gradual brain replacement?"**
      *   *Target:* Moves from theory to concrete human stakes. Forces discussion of real-world volunteers, not just engineering triumph. Avoids grant talk.
      *   *Why hard:* Moves beyond his comfort zone of engineering into messy ethics, risk assessment, and human desperation (e.g., terminal neurological disease). Challenges the "if we can, we will" narrative.

  11. **"Even if it worked flawlessly technically, why would a healthy person *choose* to undergo this? What tangible benefit does replacement-scale uploading offer over biological existence that isn't better addressed by other, less radical augmentation or life-extension tech?"**
      *   *Target:* Questions the practical value proposition for non-desperate volunteers. Presses the "why bother?" angle for the general reader.
      *   *Why hard:* Forces him to articulate a unique selling point beyond just "immortality" or "uploading," competing with other futuristic tech. Exposes potential lack of near-term benefit for healthy individuals.

  **Key Tactics Embedded:**
  *   **Pre-empting Dodges:** Questions 1 & 2 anticipate the "functional continuity" answer and drill deeper immediately.
  *   **Forcing Definitions:** Questions 5 & 6 demand concrete observables and challenge the behavior-phenomenology link.
  *   **Exploiting Specifics:** Questions 3 & 4 use the halfway point and neuroanatomy to create a unique pressure point.
  *   **Highlighting Gaps:** Questions 7 (reversibility) and 8 (vs. duplication) emphasize conceptual weaknesses in his identity argument.
  *   **Demanding Falsifiability:** Question 9 blocks the easy out.
  *   **Human Focus:** Questions 10 & 11 make it real and relevant, avoiding technical grandstanding.

  These questions are designed to interrupt his engineering script and force engagement with the unresolved philosophical and empirical cracks in his "no further interesting question" position. Good luck!
