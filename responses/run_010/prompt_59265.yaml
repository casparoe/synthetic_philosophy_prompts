answer: |-
  ### The Scenario
  Dr. Aris Thorne, a senior physician in a resource-constrained emergency department, must allocate the last available life-support ventilator to one of two patients. Both are identical in all medically relevant respects: same age, same baseline health, same acuity of respiratory failure from identical infections, same prognosis with ventilation (90% survival), same prognosis without it (certain death within 10 minutes), and no distinguishing social factors (e.g., both are anonymous arrivals with no known next of kin). Dr. Thorne has exhaustively reviewed all data—vital signs, labs, imaging—and consulted clinical guidelines. She concludes the tie is unbreakable: no further tests, ethical weighting, or deliberation could favor one over the other. The hospital’s protocol requires immediate action; if she fails to allocate the ventilator within 5 minutes, it automatically deactivates due to a safety lock, rendering it unusable and ensuring both patients die. She has no access to randomization tools (e.g., no coin, no computer algorithm), no colleague available to delegate to (per protocol, she is the sole decider during this shift), and could not have anticipated this exact symmetrical scenario to pre-commit (e.g., no prior rule like "always choose the left bed"). Neither choice violates duties or risks regret; both acts are medically indicated and morally neutral.

  **Banned Dissolutions:**  
  - **Whims/impulses:** Blocked. Dr. Thorne is a disciplined professional; the case assumes she can suspend all non-rational inclinations.  
  - **Randomization:** Blocked. No device or method is available, and hospital policy forbids arbitrary lotteries for life-saving resources.  
  - **Pre-commitment/resolute planning:** Blocked. She could not foresee this tie, so no advance rule applies.  
  - **Second-order preference:** Blocked. Forming a meta-preference (e.g., "I prefer to save younger patients") would violate her duty to use only medical criteria, which show no age difference.  
  - **Deadline as tie-breaker:** Blocked. The deadline forces action but provides no reason to select Patient A over B; delaying would harm both equally.  
  - **Psychological incapacity:** Not invoked. She *can* physically act but lacks a *rational basis* for doing so.

  ### The Verdicts
  1. **Orthodox expected-utility maximization:** Both acts are permissible. Since ventilating either patient yields identical expected utility (90% survival benefit minus negligible costs), Dr. Thorne rationally chooses one arbitrarily. No defect arises; the symmetry is unproblematic. She might "pick" Patient A effortlessly, and no justification is needed. The deadline simply ends deliberation.  
  *Reasoning:* EU theory evaluates acts solely by outcomes. Ties permit any choice, as rationality requires only avoiding dominated options. Inaction is dominated (0% survival for both), so acting—even indiscriminately—is optimal.

  2. **Reason-based view (e.g., Scanlonian contractualism):** Dr. Thorne is rationally required to act but cannot do so without irrationality. She faces a genuine bind: the deadline demands action, yet no reason selects one act over the other. Allocating the ventilator to Patient A is unjustified because no fact distinguishes A from B, making the choice arbitrarily discriminatory. Yet inaction is worse. Rationality is violated whichever she chooses.  
  *Reasoning:* An act is rational only if supported by reasons that justify it to others. Here, no such reasons exist. The equality is robust; her duty to use only medical criteria makes "picking" a failure of rational justification, not an exercise of it.

  3. **Voluntarist view (e.g., existentialist agency):** Picking is compromised. Dr. Thorne cannot "simply choose" because her professional role constrains agency to reason-based decisions. Voluntarism fails because selecting Patient A without a reason violates her duty to allocate based solely on medical need. Her "choice" would feel like a betrayal of rationality, not an authentic expression of will. Agency is stifled by the institutional demand for impartiality.  
  *Reasoning:* Voluntarism treats picking as a source of reasons. But here, picking is epistemically irrational—it introduces a false asymmetry (e.g., "I chose A, so A must be preferable"). The structure forces her to act *as if* reasons exist when none do, corrupting agency into pretense.

  ### Closing Sections
  1. **Key feature**: The *professional obligation to base decisions solely on impartial criteria* creates the bind. Remove this (e.g., make her a private individual with no duty to justify choices), and she could arbitrarily pick without rational defect, collapsing the bind into a permissible EU tie-break.  
  2. **Idealization**: The bind survives perfectly. A fully self-transparent, noise-free agent still confronts identical reasons for both acts; her clarity only confirms the tie. For an ordinary human, sub-personal biases (e.g., subtle facial preference) might *de facto* break the tie, but this is irrational under her duty—the bind persists normatively even if circumvented psychologically.  
  3. **Strongest attack for voluntarism**: The objection that *inaction is always worse, so acting breaks the tie by default*. By choosing A, she makes A "better" retroactively (e.g., A gets the ventilator, so the outcome is preferable). **Assessment**: This fails. The "betterness" is causal, not justificatory; it doesn’t provide a *reason for acting* ex ante. Pre-allocation, no fact makes ventilating A superior, and her duty forbids inventing one. The tie remains total.  
  4. **Joint satisfiability**: All constraints are satisfiable. The design holds without softening. The professional context naturally blocks exits (e.g., randomization is prohibited), and the equality arises from reasoned evaluation, not fiat. If forced to drop one constraint, the *ban on psychological incapacity* would be easiest to relax (e.g., stipulate she "freezes" due to the bind), but this is unnecessary here—the structural irrationality suffices.  

