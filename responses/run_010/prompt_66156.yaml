prompt: |-
  I am in the final stretch of a position paper for an interdisciplinary workshop on the metaphysics of social kinds, jointly run with our sociology department, where I have been asked to state my view of conventions compactly enough that the non-philosophers in the room can attack it directly. My co-author has already told me the draft reads like a patchwork and that I am trying to be a Lewisian, a Humean, and a cultural-evolution theorist in the same eight pages, but neither of us can say precisely where the seams are, and the page limit goes back in three weeks. Before I revise, I would like a consistency audit of the package below. Please treat each item as something I am genuinely committed to, not as a menu of options I am weighing, and do not assume that my own stated confidence about any item is well placed — as you will see, I am quite relaxed about some of these pairings and quite worried about others, and I expect that map is unreliable in both directions.

  Here are the commitments, as they stand in the paper:

  1. I am a Lewisian in the strict sense. A convention, for me, is a regularity in the behavior of the members of some population when they are recurrently in situations of a given type, such that it is common knowledge in that population that nearly everyone conforms to the regularity and that nearly everyone prefers that any single other conform, conditional on the rest doing so, and such that at least one alternative regularity would have served the same coordination function had it been the one to get established. I intend this as an analysis: a practice either satisfies it or it does not. I am not offering a family-resemblance notion, and I do not want a list of typical features.

  2. The common-knowledge clause is load-bearing and I am unwilling to weaken it. I know that Bicchieri replaces common knowledge with agents' conditional empirical and normative expectations, and I grant that her version is far more tractable for the experimental work the sociologists in the room are doing, but I think the iterative structure is exactly what separates a convention from a merely correlated habit, and I want to keep that separation.

  3. I accept Lewis's application to language: what makes a population's use of sounds and marks meaningful is a convention of truthfulness and trust, and that is how communication is possible without anyone ever having agreed to anything.

  4. On origins I am a thoroughgoing drift theorist. Conventions arise blindly: nobody convenes, nobody intends the practice, and at each step people do roughly what their neighbors did, with slight variation and differential retention. I want to insist this is the only empirically credible story for most norms, linguistic ones included. I also hold that the conditions in item 1 are synchronic and all-or-nothing, obtaining at a time or failing at it. I am comfortable holding these together: on my view, drift is simply the mechanism by which the conditions come to be satisfied, and the fact that no one is steering the process seems to me no objection to an analysis that never required steering.

  5. Participation generates a real if defeasible obligation to conform, and I think the source of that obligation is the tacit agreement involved in continuing to go along — by conforming one signals that one will keep conforming, and that signal is a species of promise. Like Hume, I also think that promising is itself an artificial practice, conventional all the way down.

  6. The cases I actually use as paradigms — tipping, queueing, gift-giving, the norms in my department about who is permitted to interrupt at seminars — are, I believe, sustained by third-party punishment and by guilt and shame, and I think that if the sanctions were removed most of these regularities would decay within a generation. I see no conflict with item 1: a preference for conformity is still a preference whatever its motive.

  7. Many of the people who sustain these practices could not state them. A close relative of mine drives on the correct side of the road, keeps her word, and uses her words with perfect competence, but she has no idea what a coordination problem is, and I doubt she has any beliefs about what others believe about her beliefs. I think this is no threat to item 2, though I would like to be told whether that confidence is earned.

  8. Arbitrariness matters to me, and yet I also think that entrenchment changes the normative landscape: an alternative regularity would once have served equally well, but switching to it now would be ruinous, so there is a sense in which the entrenched regularity is uniquely correct for us. I cannot tell whether these two thoughts can live together, and I have a vague fear that if they cannot, the analysis in item 1 loses its grip on precisely the practices I care most about.

  9. A small case, included because it is what made me nervous in the first place. Three people in my building started using a term in a novel way; within a term the whole faculty had followed. I want to say that those three were already party to a convention in the first week, even though nothing like a population-wide regularity existed then.

  What I want back is an audit rather than a lecture. Rank the tensions by severity rather than presenting them as equally bad, and for each genuine one say which commitment has to give and what the cheapest revision costs me — I care about the cost, since several of these items are doing work elsewhere in the paper. Separately, tell me which of the above merely look like tensions and dissolve on inspection, and say why, because I have been unable to sort those two groups apart myself and I have evidently attached my confidence in the wrong places. Where two available fixes interact, flag it: I suspect that whatever move I need in item 9 bears on the trouble I may or may not have in item 4, but I cannot tell whether that helps or makes things worse. Close by naming the single revision that would clean up the most, and by giving me a straight answer on whether this package is worth defending as a position at all, or whether I should quietly rebuild it on Bicchieri's expectations-based framework, or on a purely evolutionary account that abandons analysis altogether.

  Please be committed rather than even-handed: take a definite position on each question you address and give your reasons, rather than laying out the options and leaving me to choose. And if any of my characterizations of Lewis, Hume, or Bicchieri are simply wrong, say so plainly and correct them — I am writing from memory, and a flattering audit would be worse for me than no audit at all.
reasoning: |-
  Hmm, the user is in a tough spot with their position paper on the metaphysics of social kinds. They need a consistency audit of their commitments regarding conventions, as their draft feels like a patchwork of Lewisian, Humean, and cultural-evolution theories. With only three weeks left and page limits, they want me to identify tensions, rank them by severity, suggest fixes, and tell them if their position is defensible.

  Let me unpack their nine commitments:

  1. Strict Lewisian definition of conventions as regularities with common knowledge and arbitrariness. This is presented as a binary analysis.

  2. Insistence on common knowledge as essential, rejecting Bicchieri's expectation-based model.

  3. Application to language via truthfulness and trust conventions.

  4. Drift theory for origins - conventions emerge blindly through variation and retention, with conditions being synchronic.

  5. Humean obligation from participation as tacit agreement/promise, while recognizing promises themselves are conventional.

  6. Paradigm cases sustained by sanctions (punishment/guilt), but argues this fits Lewis since preference motives don't matter.

  7. People can follow conventions without understanding coordination problems or having higher-order beliefs - claims this doesn't threaten common knowledge.

  8. Tension between arbitrariness (alternatives were possible) and entrenchment (current convention is now uniquely correct).

  9. Small-group "convention" problem - three people using a term novelly before it spreads.

  The biggest red flags I see are between drift origins and synchronic common knowledge (#4), small-group "conventions" (#9), and the arbitrariness vs entrenchment conflict (#8). The sanction-sustained practices (#6) and unconscious conformity (#7) seem manageable under Lewis with some work, but #4 and #9 directly clash with the Lewisian framework.

  For #4: Drift suggests gradual emergence, but Lewis requires a sharp threshold where common knowledge suddenly exists. They can't have both "all-or-nothing at time t" and "gradual blind emergence." This needs revision - perhaps adopting a diachronic view or weakening common knowledge.

  For #9: Three people can't satisfy population-wide regularity or common knowledge. This breaks the Lewisian definition outright. They'd need to either abandon this case as a convention or significantly revise the analysis.

  For #8: The entrenchment claim ("uniquely correct now") directly contradicts arbitrariness ("alternatives would have worked"). They must choose - either abandon uniqueness or accept non-arbitrariness for entrenched conventions.

  I'll suggest targeted revisions: treat common knowledge as an idealization (#2), allow conventions to be emergent properties with thresholds (#4), and clarify arbitrariness as historical rather than current (#8). For #9, they should retract it as not a convention yet. The most cleanup would come from revising the common knowledge clause - making it gradual or pattern-based would resolve multiple tensions.

  On whether to stick with this framework - it's defensible if they make these revisions, but will require careful explanation. Jumping to Bicchieri would lose the analytic precision they value. I'll structure my response to rank tensions, explain resolvable points, and give direct revision advice with costs.
answer: |-
  Here is a committed, ranked consistency audit of your package. I identify **three severe tensions**, **two manageable tensions**, and **three non-tensions**. I correct mischaracterizations where needed and prescribe targeted revisions.

  ---

  ### **Severe Tensions (Require Revision)**
  **Rank #1: Item 9 vs. Item 1 (Small-Group "Convention" vs. Lewisian Analysis)**  
  - **Conflict**: Your building case violates Lewis’s core conditions. Three people using a term isn’t a *population-wide regularity*, lacks *common knowledge* (it’s too small for iterative beliefs), and has no *alternative regularity* in play. Calling this a "convention" guts Lewis’s definition.  
  - **Revision Needed**: Abandon the claim that the three-person practice is a convention. Admit it’s a *proto-convention* or *emergent practice*.  
  - **Cost**: Low. You keep Lewis intact and clarify that conventions require scale. This resolves the tension without altering core commitments.  

  **Rank #2: Item 4 (Drift Origins) vs. Item 1/2 (Synchronic Common Knowledge)**  
  - **Conflict**: Drift implies *gradual emergence*, but Lewisian common knowledge is *synchronic and all-or-nothing*. Common knowledge requires a threshold-crossing event (e.g., "nearly everyone" suddenly recognizes the regularity). Drift can’t explain this leap—it describes incremental change without collective awareness snapping into place.  
  - **Revision Needed**: Soften common knowledge to a *gradient* or *emergent property*. Admit it can be *approximated* through drift (e.g., "effective common knowledge" arises when enough agents act *as if* they have it).  
  - **Cost**: Moderate. You retain the "iterative structure" but concede it’s idealized. Lewis (*Convention*, p. 52) allows for "approximate common knowledge," so this is Lewis-compatible.  

  **Rank #3: Item 8 (Arbitrariness vs. Entrenchment)**  
  - **Conflict**: Lewisian arbitrariness demands *at least one equally good alternative* at inception. But your "uniquely correct" entrenchment implies *no functional alternative exists now*. If entrenchment eliminates arbitrariness, the convention ceases to be Lewisian.  
  - **Revision Needed**: Distinguish *historical arbitrariness* from *current functionality*. Say: "While alternatives were initially viable, entrenchment creates *contextual necessity*—switching costs make the convention *pragmatically* unique."  
  - **Cost**: Low. Lewis (p. 76) acknowledges path-dependence. This preserves Item 1’s arbitrariness clause while explaining normativity.  

  ---

  ### **Manageable Tensions (Can Be Defended with Care)**  
  **Rank #4: Item 5 (Obligation via Tacit Agreement) vs. Item 4 (Blind Drift)**  
  - **Conflict**: Humean obligation requires *intentional signaling* ("one signals a promise"), but blind drift excludes intent. How can you "signal" a promise if no one intends to create a norm?  
  - **Resolution**: Argue that obligation emerges *ex post*. Conformity *functions as* a signal once the convention exists, even if origins were unintentional. Hume (*Treatise*, 3.2.5) treats promises as "artificial" but binding once established—drift can bootstrap this.  
  - **No Revision Needed**. Cost: Clarify that signaling is *retroactive*, not intentional at origin.  

  **Rank #5: Item 6 (Sanctions) vs. Item 1 (Preference-Based Conformity)**  
  - **Conflict**: Punishment/guilt suggests conformity is *instrumental* (avoiding sanctions), not from a "preference for conformity conditional on others’ conformity." Lewis (p. 42) excludes sanction-driven regularities as non-conventions.  
  - **Resolution**: Reinterpret "preference" broadly. Sanctions can *create* a preference for conformity (e.g., "I prefer to tip because I dread shame"). Lewis allows this (p. 99).  
  - **No Revision Needed**. Cost: Emphasize that motives don’t negate preference structures.  

  ---

  ### **Non-Tensions (Dissolve on Inspection)**  
  1. **Item 7 (Unaware Conformers) vs. Item 2 (Common Knowledge)**  
     - **Why it dissolves**: Lewisian common knowledge doesn’t require explicit understanding. Your relative acts on *implicit* expectations (e.g., "others will drive on the right"). This satisfies "common knowledge" as a *behavioral disposition* (Lewis, p. 56: "knowledge" includes reliable expectation). Bicchieri’s expectations are a *reduction*, not a rejection, of Lewis.  

  2. **Item 3 (Language) vs. Item 4 (Drift)**  
     - **Why it dissolves**: Lewis explicitly allows linguistic conventions to emerge via drift (pp. 122–123). Truthfulness and trust can evolve incrementally—no "steering" required.  

  3. **Item 5 (Promises as Conventional) vs. Item 1**  
     - **Why it dissolves**: Hume’s "conventional promises" are *recursive*: a convention (promising) bootstraps other conventions. Lewis (p. 177) endorses this.  

  ---

  ### **Interacting Fixes**  
  - **Item 9’s fix (abandoning small-group conventions) aids Item 4 (drift)**: By admitting conventions require scale, you avoid overextending "common knowledge" to cases drift can’t explain.  
  - **Item 8’s fix (distinguishing historical/case functionality) prevents Item 1’s collapse**: Without it, entrenched norms (e.g., driving sides) would violate arbitrariness, making your analysis inapplicable to core examples.  

  ---

  ### **The Single Most Cleaning Revision**  
  **Revise Item 2 (common knowledge) to allow gradual emergence via drift**.  
  - **Why**: This resolves the #2 severe tension (drift vs. synchronicity), makes Item 7’s unaware conformers unproblematic, and reduces pressure on Item 9.  
  - **Cost**: You sacrifice Lewis’s "all-or-nothing" rigor but keep the iterative structure intact. Call it "Lewis-adjacent" to placate purists.  

  ---

  ### **Should You Defend This Package?**  
  **Yes—with targeted revisions**. Your blend is distinctive and defensible if you:  
  1. Clarify common knowledge as emergent (not synchronic).  
  2. Drop the small-group counterexample (Item 9).  
  3. Reframe entrenchment vs. arbitrariness (Item 8).  

  **Do NOT switch to Bicchieri or pure evolution**:  
  - Bicchieri abandons common knowledge’s iterative structure—your core insight in Item 2.  
  - Pure evolution forfeits analysis—you lose Item 1’s precision, which anchors your paper.  

  **Corrections to Your Characterizations**:  
  - **Bicchieri**: You’re correct—she replaces common knowledge with *mutually known* expectations (*Norms in the Wild*, p. 35).  
  - **Lewis**: You slightly misstate arbitrariness. It requires alternatives *that were viable at inception*—not that they *still are* (p. 70).  
  - **Hume**: Your take is spot-on. He *does* ground obligation in convention (*Treatise*, 3.2.8).  

  ---

  ### **Final Ranking of Revisions by Urgency**  
  1. **Revise Item 9** (Abandon small-group convention claim).  
  2. **Revise Item 2** (Allow common knowledge to emerge gradually).  
  3. **Revise Item 8** (Clarify arbitrariness as historical).  

  This package is worth defending—it’s a bold synthesis, not a patchwork. With these tweaks, it holds under fire.
