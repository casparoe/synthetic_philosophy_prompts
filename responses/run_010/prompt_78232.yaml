  I recall that in ethics, "can implies ought" is sometimes misapplied here—conflating inability with moral nullity. But the user notes this principle gets abandoned in future cases where action is uncertain. So there might be a "Temporal Agency Fallacy" where people confuse moral weight with feasibility. However, the artifact cases complicate this because here we do acknowledge duties to the dead despite inability to change their past suffering. That suggests a second layer: "Moral Patient Status Shift," where the dead are sometimes seen as having claims (via cultural continuity or harm perpetuation) and other times not.  

  The user’s deeper need might be to systematize these contradictions for debate or personal clarity. They might also feel frustrated that obvious logical gaps aren’t acknowledged. Their request for a "proper" made-up term hints they want conceptual tools to dissect arguments.  

  For naming: "Temporal Partiality Masking" captures the inconsistent valuation, while "Agency-Dependent Moral Weight" is more precise about the error. But since the artifact exception breaks pure agency-dependence, it’s better as a compound issue. Hence proposing "Temporal Agency Double Standard" or "Parfit's Inconsistency" (though the latter isn’t canonical).  

  Edge cases: Cleaning 1960s contamination isn’t about changing the past but stopping ongoing harm (to environment/living people), so it’s not a true exception. Repatriation often frames the dead as symbolic claimants, blending past harm with current group identity—making it a distinct category ("surviving interests"). Cases that look similar but aren’t: Fixing old bridges for safety today (pragmatic, not duty to dead builders) or maintaining digital archives for future access (future-oriented, no past claim).  

