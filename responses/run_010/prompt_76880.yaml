  ### Bertrand's Chord Paradox Betting Game: "The Chord Conundrum"

  **Core Insight:** The probability of a "random chord" being longer than an equilateral triangle's side depends entirely on the physical method used to generate the chord. The game forces students to confront this by letting them arbitrage inconsistent odds from "bookies" using different methods, then revealing the underdetermination via a meta-lottery.

  **Key Components:**
  - **3 Bookies (Students):** Each uses a different chord-generation method, posts odds, and generates chords.
  - **6 Betting Tables (Student Groups of ~4):** Place bets with candy on whether chords are "long" (longer than the triangle's side).
  - **Physical Apparatus:** Generated chords are measured against a reference string (triangle side length). After initial bets, a meta-lottery (hat draw) selects which method to use for batch simulations.
  - **Candy Economy:** Starting stake 10 candies/table. Bets settled with candy payouts. Winning table gets bonus candy.

  ---

  ### Setup & Roles (5 mins)
  - **Bring:** 
    - 3 paper circles (radius 10 cm) pinned to boards. 
    - Equilateral triangle template for each circle (side = √3 × radius = 17.3 cm). 
    - Reference string (17.3 cm). 
    - 1 spinner, 2 dice, straws, string, pins, hat, 150 candies.
  - **Roles:**
    - **Bookie 1 (Random Endpoints):** Uses spinner to pick 2 points on circumference. Draws chord with string. *True probability of long chord: 1/3 ≈ 33.3%.*
    - **Bookie 2 (Random Radial Point):** Uses spinner to pick a radius, then die to pick distance from center (1-6 → distance = (result/6) × radius). Chord is perpendicular to radius at that point. *True probability: 1/2 = 50%.*
    - **Bookie 3 (Random Midpoint):** Uses 2 dice to pick a point inside the circle (die 1: angle [1-6 → 0°, 60°, ..., 300°], die 2: radial distance = radius × √(result/6)). Chord centered at point. *True probability: 1/4 = 25%.*
    - **Bettors (6 tables):** 10 candies/table. Bet for/against "long chord" at bookies' odds.

  ---

  ### Game Rules & Posted Odds (5 mins)
  - **Bookies post fixed odds on "long chord":**
    - All bookies post **2:1 odds in favor** (e.g., bet 1 candy to win 2 *profit* if long, lose 1 if short).  
    *Implied probability: 1/(2+1) = 33.3%* (since odds = payout:stake).
  - **Why this creates arbitrage:**
    - Bookie 1's true prob (33.3%) *matches* implied odds → fair.
    - Bookie 2's true prob (50%) > implied odds (33.3%) → underpriced.  
      *Expected value (EV) of betting "for":* (0.5 × 2) + (0.5 × -1) = +0.5 candy/bet.
    - Bookie 3's true prob (25%) < implied odds (33.3%) → overpriced.  
      *EV of betting "against" (short):* (0.75 × 2) + (0.25 × -1) = +1.25 candy/bet.  
      *(Betting "against" pays 2:1 on short chord)*.
  - **Bettors can:**
    - Bet any integer candy on "for" or "against" at any bookie.
    - Exploit mispriced odds:  
      - Bet **"for" with Bookie 2** (EV +0.5)  
      - Bet **"against" with Bookie 3** (EV +1.25)  
      - *Example: Betting 1 candy "for" with B2 and 1 candy "against" with B3 has combined EV +1.75.*

  ---

  ### Timeline (50 mins Total)
  1. **Intro (5 mins):**  
     - Show circle, inscribed triangle, reference string. Define "long chord."  
     - Explain the paradox: "We need to agree how to generate 'random' chords!"  
     - Assign roles (bookies + tables). Distribute candy.

  2. **Method Training (5 mins):**  
     - **Bookie 1 (Endpoints):** Spin spinner twice to pick 2 points. Stretch string between them.  
     - **Bookie 2 (Radial):** Spin spinner for radius, roll die for distance. Pin point, draw perpendicular chord with straws.  
     - **Bookie 3 (Midpoint):** Roll 2 dice for angle/distance. Calculate midpoint (pre-calc √(1/6) to √(6/6) for speed). Pin, draw chord.  
     - *All bookies post 2:1 odds on "long" visibly on boards.*

  3. **Betting Phase (5 mins):**  
     - Tables calculate true probabilities (handout: endpoints=1/3, radial=1/2, midpoint=1/4).  
     - Tables strategize: "B2 underpays for 'long'! B3 overpays for 'short'!"  
     - *Predictably goes wrong:* Some tables miss the EV asymmetry (nudge them: "Check if odds match the probabilities!").  

  4. **Chord Generation & Settlement (15 mins):**  
     - Each bookie generates 1 chord physically.  
     - Measure vs. reference string: Announce "long" or "short."  
     - Settle bets (e.g., bet 1 candy "for" at 2:1 wins 3 candy total if long).  
     - *Sample Outcomes (1 round):*  
       - B1 (1/3): Short (67% likely) → Bettors "against" win.  
       - B2 (1/2): Long (50% likely) → Bettors "for" win.  
       - B3 (1/4): Short (75% likely) → Bettors "against" win.  
     - *Sharper tables profit:* A table betting 2 candy "for" at B2 and 2 candy "against" at B3:  
       - If B2=long (+4 candy), B3=short (+6 candy) → net +8 candy (from 4 staked).  
       - If B2=short (-2), B3=long (-2) → net -4 candy (unlikely; joint prob 0.5×0.25=12.5%).  
     - *Critical moment:* Bookies pay inconsistent odds for same event. Point out: "B2 paid for a long chord, but B3 paid against it—and both are 'correct'?!"

  5. **Meta-Lottery & Batch Simulation (10 mins):**  
     - Put 3 methods in hat. Draw one method (e.g., radial).  
     - Generate 10 chords fast with that method (spinner/die, no physical drawing).  
     - Tally results: Frequency ≈ true probability of drawn method (e.g., radial: 5/10 long).  
     - *Reveal:* "The frequency matches the method—but we *chose* the method randomly! What if we drew endpoints? Midpoint?"

  6. **Debrief (10 mins):**  
     - **Principle of Indifference:**  
       - Bookies assumed indifference in different spaces (circumference, radius, disk area).  
       - "Why did B2 use linear distance, while B3 used area? Both feel 'uniform'!"  
     - **Parameterization Choice:**  
       - Map arbitrage to method dependence: "You exploited B2/B3 because their odds didn’t match their generators."  
       - "The hat-draw shows the problem recurses: even the 'experiment' needs a generator!"  
     - **"Which is actually right?" Response:**  
       - "None is universally 'right.' Probability isn’t arbitrary—it’s objective *once you specify the physical process*. In a laser scattering experiment, midpoint might be right; in a comet impact, endpoints. The paradox forces us to define our experiment!"  
     - **Failure Mode Mitigation:**  
       - Risk: Students think probability is subjective.  
       - Prevention: Stress that methods *are* objectively correct *for their generators*. The lesson is that "random chord" is underspecified.  
       - "The game isn’t that probability is fake—it’s that you need a protocol to measure it."

  ---

  ### Why It Works & Failure Guards
  - **Arbitrage Math Works:**  
    - Bookie 2: EV (bet "for") = (0.5 × 2) + (0.5 × -1) = +0.5  
    - Bookie 3: EV (bet "against") = (0.75 × 2) + (0.25 × -1) = +1.25  
    - *Combined EV* (e.g., 1 candy each): +0.5 + 1.25 = +1.75 (175% return).  
    - Tables that bet B2 "for" and B3 "against" profit long-term.
    
  - **Hat-Draw Honesty:**  
    - Not a gimmick—it highlights underdetermination. If students protest, ask: "How would you choose the method? What’s ‘fair’?"  

  - **Predictable Issues:**  
    - **Slow Apparatus:** Rehearse bookies beforehand. Use dice/spinner shortcuts for midpoints.  
    - **Confusion on EV:** Pre-calc true probabilities on handout. Use simple bets (1-2 candy).  
    - **"Probability is subjective":** Debrief vigorously: "No—it’s conditional on the mechanism!"  

  - **Your Core Concern Addressed:**  
    - The game *does not* teach that probability is subjective. It teaches that well-defined physical processes yield objective probabilities—but the *choice* of process is underdetermined by verbal descriptions. The hat-draw reinforces this by randomizing the resolution.  

  Run it—it’s chaos with a point.
