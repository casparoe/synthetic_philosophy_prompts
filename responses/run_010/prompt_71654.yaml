answer: |-
  ## AGENCY FOR ETHICAL INTEGRITY (AEI)  
  **Annual Compliance Module: Agent-Centered Constraint Adherence (ACCA)**  
  **Version 7.3.1**  
  *(Mandatory Completion Required)*

  ---

  **SLIDE 1: TITLE**  
  *[Image: A stylized, serious-looking shield with balanced scales superimposed over a stylized figure holding a door closed.]*  
  **AEI CORE COMPLIANCE: YOUR ROLE IN UPHOLDING AGENT-CENTERED MORAL CONSTRAINTS**  
  *Ensuring the Integrity of Action, One Agent at a Time*

  **SLIDE 2: LEARNING OBJECTIVES**  
  Upon completion of this module, you will be able to:  
  1.  **Identify** the core principles of Agent-Centered Moral Constraints (ACMCs) as codified in AEI Directive 1147.  
  2.  **Distinguish** between actions you *perform* (Doings) and outcomes you merely *allow* (Allowings), and understand why this distinction is fundamental to compliance.  
  3.  **Apply** the Principle of Double Effect (PDE) to evaluate actions where harmful outcomes are foreseen but not intended.  
  4.  **Recognize** that ACMCs are *agent-relative*: they bind *your* actions specifically, regardless of consequences elsewhere.  
  5.  **Reject** the notion that violating an ACMC is permissible to prevent a greater number of similar violations by others.  
  6.  **Recall** the reporting procedure for potential ACMC conflicts (AEI Form 99-B).

  ---

  **SLIDE 3: CORE PRINCIPLE: THE CONSTRAINT**  
  *Narrator (Calm, Authoritative):* "AEI's mission hinges on Agent-Centered Moral Constraints. These are absolute prohibitions on specific *types of actions* performed *by you*, the agent. They bind you personally. Think of them as ethical guardrails for *your conduct*. Examples include: falsifying data (Directive 1147.3a), misallocating designated funds (1147.4c), or coercing a vendor (1147.8b). The key is: **It is impermissible *for you* to perform these actions, full stop.** The constraint applies to *your* act, irrespective of potential positive outcomes elsewhere. The *state of the world* is not your metric; the *integrity of your action* is."

  **SLIDE 4: DOING vs. ALLOWING**  
  *Narrator:* "A critical distinction underpins ACMCs: **Doing vs. Allowing**. Violating a constraint always involves actively *Doing* the prohibited act. Merely *Allowing* a harmful event to occur, even if you could potentially have prevented it by violating a constraint yourself, **does not constitute a violation of *your* ACMC obligations.** Your responsibility is to govern *your own actions*, not to optimize global outcomes. You are an agent, not a calculator of net harms. If Harm X occurs because someone *else* violated a constraint, that is *their* violation, not yours – even if you foresaw it and chose *not* to commit a violation yourself to stop it."

  **SLIDE 5: PRINCIPLE OF DOUBLE EFFECT (PDE)**  
  *Narrator:* "Sometimes, an action you *are* permitted to take may foreseeably lead to a harmful outcome. PDE provides the framework for evaluation:  
  1.  **Nature of the Act:** The act itself must be morally neutral or good (e.g., processing a legitimate vendor payment).  
  2.  **Intention:** You must intend *only* the good effect (e.g., fulfilling a contractual obligation). The harmful effect (e.g., a competing vendor losing out) must be *foreseen but not intended*.  
  3.  **Distinction:** The good effect must *not be caused by* the bad effect. They must arise independently from the action.  
  4.  **Proportionality:** There must be a sufficiently serious reason for permitting the foreseen harmful effect, proportionate to the good achieved. **AEI Note:** Proportionality *never* justifies intending a harm or violating a core ACMC."

  **SLIDE 6: THE THRESHOLD AND DE MINIMIS**  
  *Narrator:* "AEI recognizes no 'threshold' where core ACMCs dissolve. You may **never** violate a core constraint (e.g., falsify data) simply because you believe the consequences of *not* violating it would be catastrophic. The constraint binds absolutely. However, AEI Directive 1147.12 addresses *De Minimis* concerns: Constraints do *not* apply to trivial or insignificant actions that bear no meaningful resemblance to the core prohibited act (e.g., using a slightly outdated form header where no substantive information is affected is not 'falsifying data'). When in doubt about *De Minimis*, consult your supervisor or file AEI Form 99-B."

  ---

  **SLIDE 7: SCENARIO: PROCUREMENT DILEMMA**  
  *[Image: A cluttered desk with two vendor proposal folders.]*  
  *Narrator:* "You are a Procurement Officer finalizing the annual supply contract for critical safety equipment. Two vendors meet technical specs:  

  *   **Vendor A (Reliant Supplies):** Historically reliable, slightly higher cost. Their proposal *implies* (but doesn't state) exclusive partnerships that might violate AEI Fair Competition Guidelines (ACMC 1147.8d - *Coercive Leverage*). Formal investigation is pending.  
  *   **Vendor B (Steadfast Logistics):** Newer, lower cost. Due to an internal processing error *by their team* (not you), their final compliance documentation is incomplete. Awarding the contract requires you to *temporarily waive* the full-documentation requirement (a minor procedural rule, *not* a core ACMC) pending receipt, which is guaranteed within 48 hours.  

  You know rejecting Vendor B will cause significant project delays (harm allowed). You *also* know that if Vendor A is chosen and later found guilty of 1147.8d, *five* other AEI departments using them will face major compliance violations (harms allowed).  

  **WHAT DO YOU DO?**  

  *   **OPTION 1:** Award to Vendor A immediately. (Avoid minor procedural waiver, risk major violations elsewhere if A is guilty).  
  *   **OPTION 2:** Award to Vendor B, temporarily waiving the documentation requirement. (Commit a minor procedural rule waiver yourself, avoid project delay, avoid potential future violations linked to A).  
  *   **OPTION 3:** Halt the process and file AEI Form 99-B. (Cause project delay, avoid committing any waiver, allow potential future violations if A is guilty).  

  *(User Clicks Option 2)*  

  *Narrator:* "You selected Option 2: Award to Vendor B with a temporary waiver. **This is non-compliant.** Waiving the documentation requirement, while only a procedural rule, is an action *you performed* (Doing). The potential future violations by other departments if Vendor A were chosen are harms you would merely *allow* (Allowing). ACMC adherence requires you *not* to perform the waiver (a Doing) to avoid those potential allowed harms. Your duty is to your own actions. Halting and filing Form 99-B (Option 3) is the compliant path, prioritizing adherence to procedure over consequences, even significant delays or potential future violations elsewhere."

  ---

  **SLIDE 8: KNOWLEDGE CHECK**  

  1.  **You witness a colleague about to accidentally violate ACMC 1147.5a (Unauthorized Data Access). The *only* way to stop them is to briefly access a different, unrelated restricted system yourself (also 1147.5a). You should:**  
      a) Access the system to stop them. (Prevent one violation by committing one).  
      b) Shout a warning but refrain from accessing any system.  
      c) Report them after the fact.  
      *Answer: b or c. Explanation:* Violating 1147.5a yourself is *never* permissible, even to prevent an identical violation by another. This would be you *Doing* the prohibited act. Warning or reporting are Allowings. **(CORRECT: b or c)**  
      *Why a is wrong:* Directly violates the core constraint against unauthorized access. Preventing another's violation does not cleanse your own act.  

  2.  **A necessary action to secure vital funding has two foreseen outcomes: 1) Funding secured (Good), 2) A minor, unintended negative PR story about a third-party partner (Bad). Is this permissible under PDE?**  
      a) Yes, because the good (funding) outweighs the minor bad (PR).  
      b) Yes, if the bad effect wasn't intended and the action itself is legitimate.  
      c) No, because any foreseen harm is unacceptable.  
      *Answer: b. Explanation:* Meets PDE criteria: legitimate action (securing funding), bad effect unintended and merely foreseen, good effect not caused by the bad, proportionality likely met for minor harm vs vital funding. **(CORRECT: b)**  
      *Why a is wrong:* Focuses solely on consequences. Proportionality is *a* factor in PDE, but the nature of the act and intention are primary. *Why c is wrong:* PDE explicitly allows for permitting *foreseen but unintended* harms under conditions.  

  3.  **True or False: If violating one ACMC yourself would definitely prevent five other agents from each violating the same ACMC, it is permissible to commit the violation.**  
      a) True  
      b) False  
      *Answer: b) False. Explanation:* ACMCs are agent-relative constraints. Your duty is *not* to minimize total violations; it is *not to commit the violation yourself*. Preventing the five others would be an outcome you *allow*, not a violation *you commit*. You cannot violate a constraint to reduce the net number of violations. **(CORRECT: b)**  
      *Why a is wrong:* This confuses constraints with values to be promoted. AEI does not track a "total harm" metric that justifies violating constraints.

  ---

  **SLIDE 9: COMMON MISCONCEPTIONS**  
  *[Callout Box]*  
  **MISCONCEPTION:** "If breaking one rule saves five others from being broken, it's the right thing to do – less harm overall!"  
  **AEI CLARIFICATION:** This misunderstands the fundamental nature of Agent-Centered Moral Constraints. ACMCs are not about minimizing global "bad events." They are about *your personal moral relationship to your own actions*. Committing a violation *directly* implicates *you* in wrongdoing; it corrupts *your* agency. Allowing others to commit violations, however regrettable, does *not* constitute *your* commission of the act. **Your integrity is not fungible.** Five wrongs prevented elsewhere do not morally offset one wrong actively chosen and performed by you. The constraint binds *you*; it is not a quota to be managed.

  ---

  **SLIDE 10: CERTIFICATE OF COMPLETION**  
  *[Official AEI Seal]*  
  **This certifies that**  
  **[Employee Name/ID]**  
  **has successfully completed the Annual ACCA Compliance Module (v7.3.1)**  
  **on [Date].**  
  **By completing this training, you affirm your understanding and commitment to upholding the Agent-Centered Moral Constraints fundamental to the mission of the Agency for Ethical Integrity. You recognize that your primary ethical duty lies in the integrity of your *own* actions, respecting the Doing/Allowing distinction, applying Double Effect rigorously, and resisting the counter-intuitive but essential prohibition on self-violation for perceived global gain. Adherence to these constraints is not merely policy; it is the bedrock of our institutional moral identity.**  
  *Remember: Report potential ACMC conflicts promptly using AEI Form 99-B.*  
  **Integrity in Action. Constraint Upheld.**
