  The professor also wants to test the procedure against their own published argument about convergent tidiness versus centralized control, plus two additional cases. They're explicitly asking for honesty about where the procedure has limitations - where judgment calls masquerade as steps, systematic weaknesses, and value-based decision points.

  Breaking this down:
  First, the core structure needs to be ruthlessly sequential with time constraints. Each step must have binary outcomes to avoid paralysis. The output must be actionable - not just "weaken" but specify how (e.g., change "prove" to "suggest"). For disagreements, a simple third-reviewer escalation works best.

  For the three built-in challenges:
  1. Semantics slide requires separating descriptive claims from interpretive leaps, with a dedicated step forcing this distinction and demanding evidence for meaning-claims.
  2. Pompeii premise needs a preservation bias checklist - asking what's missing and how it might change interpretation.
  3. Absence claims require positive evidence of absence: defining expected traces and demonstrating their detectability.

  The test case is clever - it targets the professor's own convergent tidiness argument. The procedure must allow the uniformity-to-control inference but have tools to challenge it. Steps should examine alternative explanations (like shared apprenticeship) and demand evidence against them.

  Additional cases will stress-test:
  - The pits/pots/skulls case probes whether correlation implies shared belief.
  - The sealings case examines if administrative control is the only explanation for standardization.

  Regarding seams and limitations:
  - The semantics step will always be somewhat subjective when evaluating "independent support."
  - Preservation assessment relies heavily on the student's knowledge of taphonomy.
  - Absence arguments require hypotheticals about what "should" be found.
  - The whole procedure struggles with cumulative circumstantial evidence versus smoking guns.
  - Value decisions (like publishing contested claims) must remain human judgments - the procedure can only flag risks.

  The output format should mirror the request: no prefacing, just immediate steps. Practical considerations include forcing students to articulate the claim precisely first, and building in "explanation demand" steps that require positive evidence for inferences.
answer: |-
  ### Archaeological Claim Evaluation Procedure  
  **Input:** One interpretive claim + supporting evidence (extract, photos). Time limit: 40 minutes.  
  **Output:** (A) Supported as written; (B) Weaken to [specific phrasing]; (C) Unsupported.  
  *If students disagree: Re-run independently. Persistent disagreement? Flag for faculty review.*  

  **Step 1: Claim Decomposition**  
  - *Task:* Isolate the claim’s core assertion(s). Split compound claims.  
  - *Pass:* Single assertion identified (e.g., "Shared belief system existed" NOT "Pots prove shared beliefs").  
  - *Fail:* Ambiguous/compound claim → Rewrite to atomic form.  
  - *Output:* "Assertion: [X]."  

  **Step 2: Semantics Slide Check**  
  - *Task:* Distinguish *observational* ("pots deposited") from *interpretive* ("pots served the dead").  
  - *Pass (Observational):* Claim describes physical actions/objects only → Proceed to Step 3.  
  - *Pass (Interpretive):* Independent evidence exists for meaning/intent (e.g., contextual inscriptions, ethnographic analogies *cited in report*) → Proceed to Step 3.  
  - *Fail:* Interpretive claim lacks independent support → **Output (B):** Weaken to observational counterpart (e.g., "pots deposited" INSTEAD OF "belief in afterlife").  

  **Step 3: Pompeii Premise Audit**  
  - *Task:* List all elements in evidence (e.g., pottery, stone tools). For each:  
    - (a) Is it durable (fire/stone) or perishable (wood, cloth)?  
    - (b) Could its survival skew interpretation? (e.g., burnt grain → overstate fire use; stone tools → understate bone tools).  
  - *Pass:* No skew OR claim accounts for gaps (e.g., "Stone structures suggest..." NOT "Settlement was stone-based").  
  - *Fail:* Claim over-relies on survivorship bias → **Output (B):** Add qualifier (e.g., "Surviving evidence suggests..." OR limit scope to durable items).  

  **Step 4: Absence Inference Test**  
  - *Task:* If claim infers absence (e.g., "no warfare"), ask:  
    - (a) What *should* be present if true? (e.g., weapons, defensive wounds).  
    - (b) Is evidence *sufficient* to detect it? (e.g., full excavation, good bone preservation).  
  - *Pass:* Expected traces are established AND detection is confirmed → Proceed.  
  - *Fail:* Gaps in detection → **Output (B):** Weaken to "No evidence for [X]" OR **Output (C):** Unsupported if absence is central.  

  **Step 5: Uniformity-to-Control Challenge (If Applicable)**  
  - *Task:* If claim infers control from uniformity (e.g., "standardized houses → central authority"):  
    - (a) Identify alternative causes (e.g., shared apprenticeship, functional constraints).  
    - (b) Does evidence *exclude* alternatives? (e.g., regional variation in other objects undermines "control"; workshops suggest local production).  
  - *Pass:* Alternatives ruled out (e.g., no variation in *non*-functional traits) → Proceed.  
  - *Fail:* Alternatives plausible → **Output (B):** Weaken to "uniformity may reflect shared practices" (specify alternatives).  

  **Step 6: Final Weight Assessment**  
  - *Task:* Re-check all steps. Is the claim:  
    - (A) Fully backed by evidence per Steps 1-5? → **Output (A)**.  
    - (B) Partially backed but requires hedging? → **Output (B)** with exact phrasing (e.g., "suggests" vs. "proves"; "ritual activity" vs. "human sacrifice").  
    - (C) Unsupported? → **Output (C)**.  

  ---

  ### Test Cases  
  **Case 1: Egalitarian Political Order Claim**  
  - *Claim:* "Near-identical house sizes and no differential grave goods indicate egalitarian political order."  
  - *Procedure Outcome:*  
    - Step 2: Interpretive ("political order") → Requires independent support. None? → **Weaken to observational**: "No evidence of wealth hierarchy in housing/graves."  
    - Step 5: Uniformity → "Convergent tidiness" plausible (e.g., similar environmental constraints). No evidence excluding alternatives → **Weaken further**: "Uniformity may reflect shared norms or constraints."  
    - **Final Output (B):** "Settlement shows consistent house sizes and undifferentiated graves, with no evidence of hierarchy."  
    - *Damage Step:* **Step 5** + **Step 2**.  

  **Case 2: Shared Belief System (Pits/Skulls)**  
  - *Claim:* "Pits with unbroken pots and animal skulls across villages prove a shared belief system."  
  - *Procedure Outcome:*  
    - Step 2: Interpretive ("belief system") → No independent support (e.g., no symbols/myths)? → **Weaken to observational**: "Recurrent pit deposits of pots/skulls."  
    - Step 3: Pompeii → Perishables (offerings?) missing? → **Add qualifier**: "Surviving evidence shows recurrent deposits."  
    - **Final Output (B):** "Multiple villages had similar pit deposits of unbroken pots and animal skulls, suggesting shared practices."  

  **Case 3: Grain Redistribution Administration (Sealings)**  
  - *Claim:* "Repeated seal designs prove an administration controlled grain redistribution."  
  - *Procedure Outcome:*  
    - Step 2: Interpretive ("administration") → Seal designs ≠ proof of bureaucracy. Independent support? (e.g., centralized storage, accounting tablets)? If not → **Weaken**: "Sealings indicate standardized storage management."  
    - Step 5: Uniformity → Alternatives? (e.g., household-level sealing for theft prevention). Not excluded → **Weaken further**: "Sealings suggest coordinated storage practices."  
    - **Final Output (B):** "Repeated seal designs on storeroom clay imply systematic control of goods."  

  ---

  ### Seams & Limitations  
  **Judgment Calls Disguised as Steps:**  
  - **Step 2 (Independent Support):** "Independent" is contextual. *Student cue:* If evidence isn’t physical/direct (e.g., inscriptions), it’s likely interpretive.  
  - **Step 4 (Absence):** "Sufficient to detect" requires taphonomic knowledge. *Student cue:* If preservation is poor or excavation partial → Absence claims fail.  
  - **Step 5 (Alternatives):** Requires creativity to generate plausible alternatives. *Student cue:* If >1 non-ad-hoc alternative exists → Weaken.  

  **Systematic Weaknesses:**  
  - **Cumulative Arguments:** Struggles with claims relying on multiple weak strands (e.g., "ideology" from art + burials + architecture). → *Send to human.*  
  - **High-Reliance Analogies:** Claims depending on cross-cultural parallels (e.g., "skulls = ancestors") without local evidence. → *Procedure rejects these in Step 2.*  
  - **Taphonomic Nuance:** Claims where decay *creates* false patterns (e.g., acid soil dissolving small bones → misinterpreting diet). → *Step 3 flags but may miss complexity.*  

  **Values Boundary:**  
  - **Contested Interpretations:** Procedure assesses evidential weight, not ethical risk. If a claim passes but is politically sensitive (e.g., "ritual killings"), Step 6 outputs "supported" but *humans decide whether to publish*.  
  - **Community Harm:** Procedure identifies overreach; humans weigh societal impact.  

  **Why It Works:**  
  Forces explicit articulation of gaps, demotes meaning-claims without evidence, and bakes in taphonomic skepticism. Your "convergent tidiness" test proves its rigor: Step 5 dismantles uniformity-as-control by demanding exclusion of alternatives.  

  ---  
  *Procedure time: ~30-35 mins. Faculty review handles edge cases. Train with your test cases to calibrate student judgment.*
