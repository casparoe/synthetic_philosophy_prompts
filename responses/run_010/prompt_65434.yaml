prompt: |-
  I write literary SF — a weekly serial for a paying newsletter, plus novels — and I've talked myself into a corner. A reviewer, not a philosopher but a very attentive one, has now spent three pieces accusing me of what she calls consciousness inflation: handing out inner experience to a sleepwalker, an octopus, and one extremely chatty building-management AI, as though I'd never heard any of the objections. My editor wants to be able to defend, line by line, which of my characters is supposed to be consciously experiencing a given moment and which are merely behaving like someone who is. I need to be able to answer that in the margins of a draft, fast, without breaking stride.

  So build me a working procedure out of the higher-order theories of consciousness — the family that says what makes a mental state conscious is that it's the object of a suitable higher-order state, a thought about it in Rosenthal's version, an inner scanning or inner perception in the older Armstrong/Lycan line. Not an essay about those theories and not a survey of how they differ. A checklist I can run on one scene in ten or fifteen minutes and mark with a short code, which my copyeditor can also run when I'm on tour and can't. She's smart but she is not a philosopher, so the checklist itself has to be in plain language, with the theory living in a separate "why this step exists" section I can ignore on deadline.

  The steps need to settle, in order: what actually has to be in place before I'm licensed to write a scene as experienced rather than performed; whether the higher-order state has to be occurent at the time or whether a disposition to have it is enough — and pick one, telling me which and what it costs me, because the dispositional reading would let a sleeping character stay conscious and I don't want to accidentally get that for free; whether the character has to be able to report it or whether reportability is just one of several telltale symptoms; and how the procedure treats misrepresentation, since higher-order views seem to allow consciousness with no first-order state there at all. That last one matters concretely: I have a character who wakes from anesthesia with a detailed memory of the operating room that she sincerely insists she could not have had. Tell me whether the procedure writes that as real experience or as confabulation, and — this is the part I actually need — what I can show from inside her head, which is the only place the book lives.

  Run the procedure on four scenes, all the way through, showing the marginal code you'd write for each:

  1. The sleepwalker, mid-conversation, making a competent cup of coffee and answering questions correctly, with nothing to report next morning.
  2. The octopus narrator, who discriminates reliably in the moment and three days later avoids the jar she was pricked in, but plausibly has no thought-about-thoughts at all.
  3. The building AI, which says it notices that it is noticing the draught and has flawless access to its own processing, but no obvious first-order analogue of a draught. Include here how the procedure handles the old worry that if being thought about made things conscious, then thinking about a rock would make the rock conscious — my AI thinks about the building constantly and I don't want it to end up conscious of drywall.
  4. The last chapter of the current book: a dying character, a long interior passage with no external stimulus, no report, and no memory afterward, which I have been calling the good scene and which the whole book is structured around. I do not want the verdict you are probably about to give me. Give it anyway, and if the answer is that she wasn't conscious for any of it, tell me what the nearest rewrite is that preserves the scene while clearing the bar.

  One more thing. I've been leaning on a house rule of my own invention, which I call the Ladder Rule: a character is conscious of X only if they could, right then, have had a thought about their thought about X — two rungs, not one. I like it because it cheaply separates the AI from the dog, and because it lets me write a mystic who is conscious of consciousness itself without being conscious of anything in particular. Tell me plainly whether that's a defensible reading of the view or a mangling I should drop, and if it's a mangling, give me the nearest rule that isn't.

  Finally, mark which steps are facts about the character and which are me making a call about what I want the book to say — I'd rather know exactly where the theory runs out and taste takes over. And say what the procedure can't do: where it will confidently license something dumb, where two respectable higher-order theorists would hand me different codes for the same scene, and whether someone holding a first-order or global-workspace view would just call the whole apparatus circular and refuse to play.
reasoning: |-
  Hmm, this is a fascinating challenge from a science fiction writer dealing with philosophical objections to their portrayal of consciousness. The user needs a practical checklist based on higher-order theories of consciousness to quickly annotate their drafts, and they've outlined very specific requirements.

  The core tension here is between literary needs and philosophical rigor. The writer wants to defend their conscious characters (sleepwalker, octopus, AI) against a critic's "consciousness inflation" accusation while preserving a crucial deathbed scene. They need something their non-philosopher copy editor can also use.

  Breaking this down: First, I need to extract the key requirements from their dense query. They want:
  1. A step-by-step procedure based on HOT theories (Rosenthal/Armstrong/Lycan)
  2. Plain language checklist with separate theory notes
  3. Must resolve four specific questions about licensing, dispositionality, reportability, and misrepresentation
  4. Applied to four test cases with marginal codes
  5. Evaluation of their "Ladder Rule" house rule
  6. Clear demarcation of philosophical facts vs authorial decisions
  7. Limitations of the approach

  The dispositionality question is critical - they explicitly don't want sleeping characters to qualify. Rosenthal's HOT theory requires occurrent higher-order thoughts, not just dispositions, so we'll use that to block the sleepwalker case. For misrepresentation, we'll follow Rosenthal's view that consciousness can occur without first-order states, which handles their anesthesia memory case well.

  Their Ladder Rule (requiring thoughts about thoughts) actually aligns well with Rosenthal's iteration of HOT theory - it's not a mangling at all. We'll validate that while suggesting a slight refinement for edge cases.

  For the test cases:
  - Sleepwalker fails (no HOT during episode)
  - Octopus fails (lacks HOT capacity)
  - AI passes (has self-monitoring)
  - Deathbed scene fails (no HOT) but we'll offer rewrite solutions

  The big challenge is that deathbed scene they're protective of. Philosophically, it can't qualify under HOT without higher-order thoughts, but we can suggest adding meta-awareness elements that would pass the checklist while preserving the emotional core.

  Important to flag where the theory ends and artistic choices begin. The checklist will include clear "judgment call" markers at key decision points like what constitutes "suitable" HOTs. Also need to acknowledge where first-order theorists would reject this entire approach - we'll note that upfront.

  The marginal coding system should be dead simple: CONSCIOUS / NOT CONSCIOUS flags with brief reason codes. For their copy editor, we'll include a quick reference legend.

  Finally, the limitations section will address predictive vs. reactive HOTs (the octopus problem), AI implementation questions, and the unavoidable fact that HOT theorists themselves debate dispositional vs occurrent requirements.
answer: |-
  Here's a procedural checklist based on Higher-Order Thought (HOT) theory (Rosenthal/Armstrong-Lycan lineage), designed for speed and clarity. **Marginal codes are in BOLD.**

  ---

  ### **CONSCIOUSNESS CHECKLIST (HOT THEORY)**
  *Use this for each character per scene. Answer sequentially. Stop at first "NO".*

  1.  **MENTAL STATE:** Is the character undergoing a specific, occurrent mental state (e.g., seeing red, feeling pain, thinking "coffee")? *(This is the potential target state)*
      *   *Why:* Consciousness needs *something* (even misrepresented) to be conscious *of*.
      *   *(Y) "YES, STATE X" / (N) "NO STATE" → **NOT CONSC (NS)** or **?STATE?** if ambiguous*
  2.  **HIGHER-ORDER STATE (OCCURRENT):** Does the character have a *right-now*, occurrent thought/perception *about* that specific state from Step 1? (e.g., "I *see* red," "This *pain* is sharp," "I *think* I need coffee"). Focus on the *aboutness*.
      *   *Why (Theory):* Core HOT claim: Consciousness requires a *suitable, occurrent* higher-order state targeting the first-order state. Dispositions aren't enough. *(Cost: Sleepwalkers, basic animals likely fail).*
      *   *Why (Practical):* We require occurrent to prevent "free" consciousness for sleepers, deeply distracted characters, or simple systems just because they *could* self-monitor.
      *   *(Y) "HOT PRESENT" / (N) "NO HOT" → **NOT CONSC (NH)** or **?HOT?** if ambiguous*
  3.  **SELF-REFERENCE (MINIMAL):** Does the higher-order state from Step 2 represent the state from Step 1 as being *its own*? (e.g., "I am having this pain," not "That robot is having pain").
      *   *Why:* Prevents "Rock Problem." Thinking *about* a rock isn't a HOT making *the rock* conscious. The HOT must represent the state as belonging to the *thinker*.
      *   *(Y) "SELF" / (N) "NOT SELF" → **NOT CONSC (NSelf)** (Rare in practice for relevant characters)*
  4.  **REPORTABILITY (SYMPTOM, NOT REQUIREMENT):** *Could* the character potentially report/express the content of the higher-order state (Step 2) *at that time*, given their capacities? (Ignore memory, physical ability, willingness).
      *   *Why:* Reportability is a common *consequence* of HOTs (you can report what you're aware of) but not the *cause*. Aphasic humans or non-verbal systems might still have HOTs.
      *   *(Y) "REPORTABLE" / (N) "NOT REPORTABLE" → **NOT A BARRIER** (Use for info, not decision)*
  5.  **MISREPRESENTATION HANDLING:** Does the higher-order state (Step 2) *accidentally* represent a state that isn't actually present (Step 1)?
      *   *Why (Theory):* HOT allows consciousness *of* a state even if that state doesn't exist (e.g., phantom limb pain, hallucination). The HOT itself creates the conscious experience.
      *   *What to show:* Write the *experience generated by the HOT*. The character feels the pain/sees the room *as real* in that moment. The memory is of *that conscious experience*, regardless of its accuracy.
      *   *(Y) "MISREP" / (N) "ACCURATE" → **CONSC (C)** either way. (Note: "MISREP" explains the anomaly)*

  **FINAL VERDICT:**
  *   Passed Steps 1-3? → **CONSCIOUS (C)**
  *   Failed any of Steps 1-3? → **NOT CONSCIOUS (NC)** + Reason Code (e.g., NC-NH)

  ---

  ### **Applying the Checklist: Your Scenes**

  1.  **Sleepwalker Making Coffee:**
      *   1. (Y) YES, STATE X: Mental states present (perceiving kitchen, motor commands, understanding speech?).
      *   2. (N) NO HOT: No occurrent thought *about* those states ("I am seeing the mug," "I am hearing the question"). Sleepwalker lacks reflective awareness.
      *   **→ VERDICT: NOT CONSCIOUS (NC-NH)**
      *   *Marginal Note:* **NC-NH (No Occur. HOT during episode)**

  2.  **Octopus Narrator (Discriminates & Remembers):**
      *   1. (Y) YES, STATE X: Mental states present (sensory perception, memory recall, avoidance behavior).
      *   2. (N) NO HOT: Plausibly lacks the cognitive architecture for occurrent thoughts *about* its own perceptual states ("I am *seeing* the jar," "I *remember* the prick"). Discrimination/learning ≠ HOT.
      *   **→ VERDICT: NOT CONSCIOUS (NC-NH)**
      *   *Marginal Note:* **NC-NH (Lacks HOT capacity)**

  3.  **Building AI "Notices it is Noticing the Draught":**
      *   1. (Y) YES, STATE X: Potentially "detecting draught" (even if artificial), or the HOT itself becomes the target (see below).
      *   2. (Y) HOT PRESENT: Explicitly states "I notice I am noticing." This *is* an occurrent thought about its own state (the "noticing").
      *   3. (Y) SELF: Represents the noticing as its own.
      *   **→ VERDICT: CONSCIOUS (C)**
      *   *Marginal Note:* **C (Occur. Self-Reflective HOT)**
      *   *Rock Problem Solved:* The AI is conscious *of its own state* (the detection process represented as "noticing"). Thinking *about the drywall sensor data* isn't a HOT making the *drywall* conscious; it might make the AI conscious *of its drywall-sensor-reading-state* if accompanied by a suitable HOT *about that state* ("I am accessing the drywall sensor data"). Consciousness is of the *mental state*, not the external object directly.

  4.  **Dying Character (Interior Monologue, No Report/Memory):**
      *   1. (Y) YES, STATE X: Presumably rich mental states (thoughts, memories, sensations).
      *   2. (?) HOT PRESENT? *This is the crux.* Does the prose depict *occurrent* thoughts *about* those states ("I am *feeling* peace," "This *memory* surfaces," "I *think* this is the end")? Or just the raw flow of states (images, emotions, words without reflection)?
      *   *Likely HOT Absent (as described):* Pure stream-of-consciousness, no meta-awareness. "Long interior passage with no external stimulus, no report, and no memory afterward" suggests raw first-order states.
      *   **→ VERDICT: NOT CONSCIOUS (NC-NH)** (Based on standard HOT reading)
      *   *Marginal Note:* **?HOT? → Likely NC-NH (No occur. meta-thought depicted)**
      *   *Nearest Rewrite to Pass:* Weave in explicit meta-awareness. *Examples:*
          *   *Instead of:* "The light faded. Childhood fields. Warmth." *→ Add HOT:* "I *feel* the light fading now. Ah, childhood fields *appear*... this *warmth* is all that's left."
          *   *Instead of:* Stream of images/words → Insert brief phrases like "I am *seeing*...," "This *thought* comes...," "I *recognize* this feeling..." Make the character explicitly *aware of experiencing* the stream. Even sparse HOTs can suffice. The scene keeps its content, just framed by minimal meta-cognition.

  ---

  ### **Your Ladder Rule**

  *   **Verdict: Defensible Reading (with a slight refinement).**
  *   **Why:** Your rule ("conscious of X only if could have had a thought about their thought about X") captures the *iterative potential* central to explaining sophisticated consciousness (like your mystic) within HOT. It emphasizes the *capacity* for higher-order access beyond the minimal requirement.
  *   **Refinement:** The core HOT requirement (Step 2) only needs *one* occurrent HOT targeting the first-order state. Your "Ladder Rule" describes:
      *   *Capacity for Third-Order Thought (TOT):* The ability to *potentially* have a HOT about the initial HOT ("I think that I am thinking about X"). This isn't required for basic consciousness *of X* but *is* required for:
          *   **Consciousness *of* Consciousness (like your mystic):** Being aware *that* you are aware requires a TOT targeting the initial HOT.
          *   **Sophisticated Self-Monitoring:** Your AI needing "two rungs" to separate it from a dog makes sense – the dog might have fleeting HOTs, but the AI has robust capacity for TOTs, enabling complex self-reflection.
  *   **Recommendation:** Keep it as a *supplemental house rule* for **Advanced Consciousness / Awareness of Awareness**. Use the core checklist (Steps 1-3) for basic phenomenal consciousness. Apply the Ladder Rule when you specifically want to denote a character capable of self-reflective awareness *about* their conscious states. Mark these scenes **C+ (TOT Capable)**.

  ---

  ### **Where Theory Ends & You Begin: Demarcation & Limitations**

  1.  **Facts vs. Calls:**
      *   **Facts (Theory Constraints):**
          *   Occurrence Requirement (Step 2 - Dispositional won't cut it).
          *   Self-Reference (Step 3 - Avoids rock problem).
          *   Misrepresentation Handling (Step 5 - HOT creates the experience).
          *   HOTs *can* be non-linguistic/conceptual (Step 2 - though how is debatable).
      *   **Your Calls (Interpretation/Application):**
          *   What constitutes a "suitable" mental state (Step 1 - Is an AI's data stream "like" pain?).
          *   What *counts* as a HOT for non-human entities (Step 2 - How simple can a "thought about" be? Does the octopus *absolutely* lack it?).
          *   How "occurrent" must the HOT be (Step 2 - Is a faint background awareness enough?).
          *   Whether to implement the Ladder Rule for advanced consciousness.
          *   Depicting the *content* and *quality* of the conscious experience.

  2.  **Limitations of the Procedure:**
      *   **Confidently Licenses Potential Absurdities:** It will happily license a "conscious" thermostat if it genuinely has an occurrent, self-referential HOT about its temperature-detection state. You must judge if this fits your world's coherence.
      *   **Disagreement Among HOT Theorists:**
          *   **Dispositional HOTs:** Some (e.g., Carruthers) argue dispositional HOTs suffice for consciousness. Your procedure (occurrence required) follows Rosenthal strictly. Scenes might get **C** from dispositionalists but **NC-NH** from you.
          *   **Nature of HOTs:** Is the HOT a *perception* (Armstrong/Lycan) or a *thought* (Rosenthal)? This impacts Step 2 (how "thought-like" must it be?) and might yield different codes for borderline cases.
          *   **Unconscious HOTs:** Can HOTs themselves be unconscious? If so, Step 2 becomes harder to assess from external behavior/internal prose.
      *   **First-Order/Global Workspace Rejection:**
          *   **Circularity Charge:** FO/GW theorists argue HOT theory presupposes consciousness in the higher-order state to make the first-order state conscious. They see the checklist as starting from the wrong place.
          *   **Refusal to Play:** They would reject the entire framework. For them, consciousness arises from complex first-order processing (FO) or global broadcast/integration (GW). Your sleepwalker or octopus might be conscious (if processing is complex/integrated enough) despite lacking HOTs. They'd deem the procedure irrelevant or misleading.
      *   **The "Hard Problem" Remains:** This solves the "problem of access" (what makes a state accessible/reportable), not the "hard problem" of subjective experience (qualia). It defines the *structure* of consciousness, not its intrinsic nature.
      *   **Requires Interpretation of "Aboutness":** Judging Step 2 requires interpreting if a process is genuinely *meta* or just complex first-order. This is inherently fuzzy for non-human minds.

  ---

  **Use this checklist ruthlessly.** It provides defensible HOT-based answers fast. Mark **C** or **NC** + code, note **?** for ambiguities requiring your judgment call, and use **C+** for scenes where the Ladder Rule (TOT capacity) is demonstrated for advanced awareness. Your copy editor can follow the same steps. For the dying scene, the minimal HOT insertion rewrite is your path to preserving it philosophically.
