prompt: |-
  I cover science and ideas for a general-interest magazine, and a public ideas festival has booked me for thirty-five minutes with slides in front of roughly a hundred non-specialists — mostly retirees, some undergraduates, no background in philosophy or vision science. The listing they published promises the big claim: Why You Never See What's There. What I actually want to teach is the narrower, live question underneath it — whether what we believe, expect, or want can get inside perceptual experience itself, as distinct from steering attention, changing what we say we saw, or changing what we later remember. My session runs immediately after a retired detective's talk on eyewitness error, so a good part of the room will arrive already convinced that seeing is unreliable, and will take that conviction to be the same thesis I'm about to present.

  Plan the session for me; don't script it and don't argue the debate at me. I need five things.

  First, the dependency order: what has to be in place before the question is even intelligible to this audience. I assume that includes getting them to separate what someone experiences from what they report about the experience, and I want to know where that move belongs and what collapses if I make it too early.

  Second, the one case to carry everything. My shortlist is an image in which two patches printed at exactly the same luminance look like different shades; the mid-century card experiments in which people shown a spade printed in red named an ordinary black spade, or a heart; and the value-laden size-and-steepness research from my own beat, which I covered at the time and which has since been picked apart. Tell me which one to build on, what that case must have and must lack to do the work, and what I lose by dropping the other two.

  Third, the misconceptions and exactly where in the sequence to head each off — mine so far: that "top-down" is just another name for penetration; that attention counts as a counterexample; that ordinary size and brightness illusions settle the matter; that the dress which split the internet settles it; and that if penetration is real, no eyewitness can be trusted. Flag which of these arrive with the audience and which my own example will manufacture.

  Fourth, one question to put to the room near the end whose answers would show me they have the experience-versus-judgment distinction rather than just the pictures.

  Fifth, what I should explicitly refuse to cover at this level — I expect the apparatus for ruling out response bias and demand characteristics — and what to say to the room about having cut it.
reasoning: |-
  Okay, let's tackle this request. The user is preparing a 35-minute talk for a general audience, mostly retirees and some undergrads, with no background in philosophy or vision science. The advertised title is "Why You Never See What's There," but they want to focus on the specific question of whether beliefs/expectations can penetrate perception itself, distinct from attention or memory. 

  First, understanding the audience's context is crucial. Right before this talk, there's a session on eyewitness error by a retired detective. So many attendees will already think seeing is unreliable but conflate that with cognitive penetration. The challenge is to disentangle these without jargon. 

  For the dependency order, the key is establishing layers: first, perception vs. reality (what's there vs. what we see), then perception vs. judgment (experience vs. interpretation), and finally perception vs. attention (what's in focus vs. what's sensed). Starting with perception vs. judgment too early might confuse them, especially after the eyewitness talk. Need to use clear anchors like the gray patches demo to make these distinctions tangible.

  Choosing the right case study is critical. The luminance patches are ideal because they're simple, visual, and avoid value-laden associations. The card experiments involve memory and naming, which muddy the waters. The size/steepness research is too contested. The patches cleanly isolate the perception-judgment split—seeing different shades despite identical luminance. Must emphasize that the illusion persists even when they know the truth.

  Addressing misconceptions is next. Key ones include conflating attention with penetration (e.g., "inattentional blindness"), thinking ordinary illusions like Müller-Lyer settle the issue (they're bottom-up), and the dress photo (which involves ambiguity, not beliefs). The eyewitness carryover is the biggest threat—need to explicitly differentiate post-perception factors like memory from perception itself. The patches demo will help here by showing that judgment can be wrong while experience remains stubborn.

  For the audience question near the end, something like "Would the patches look different if you forgot the trick?" This tests if they grasp that the experience is fixed, even if judgment changes. If they say "no, they'd still look different shades," they've got it.

  Finally, boundaries: Skip technical methods like response bias controls. Explain that we're focusing on the core phenomenon, not lab intricacies, to keep it accessible. Acknowledge the complexity but prioritize clarity for this audience.

  The user's deeper need is to transform a skeptical, primed audience into understanding a nuanced philosophical/science distinction without losing them. They need airtight scaffolding from simple to complex, with one crystal-clear example. The stakes are high—failure means the audience walks away thinking "so perception is flawed, just like that detective said."
answer: |-
  Here’s a focused plan for your session, prioritizing clarity and audience engagement while sidestepping pitfalls:

  ### 1. **Dependency Order** (Build Foundations Sequentially)  
     - **Start with Reality/Perception Divide:** Show an *unambiguous* illusion (e.g., a static Ponzo illusion where identical lines look different lengths). *Goal:* Establish that "what’s there" ≠ "what you see."  
     - **Then Split Perception/Judgment:** Use the **luminance patches** (e.g., Adelson’s checkerboard). Reveal the trick (patches are identical), then ask: *"Even knowing they’re the same, do they STILL look different?"*  
     - **Why this order?**  
       - If you separate perception/report too early (post-detective talk), the audience assumes *all* errors are lies/memory failures.  
       - **Collapse risk:** Jumping straight to "experience vs. judgment" feels abstract. Concrete illusions ground the distinction.  

  ### 2. **The One Case: Luminance Patches**  
     - **Why this?**  
       - **Must have:** Persistence of the illusion *despite knowledge*. Shows experience ≠ judgment.  
       - **Must lack:** No memory/naming/values (avoids conflating with card experiments or contested size/steepness work).  
       - **What you lose:**  
         - *Cards:* Attention/memory effects dominate; fails to isolate experience.  
         - *Size/steepness:* Values (e.g., money) invite "wishful thinking" accusations; methodological disputes distract.  
     - **Build on it:** Show the patch demo → highlight the experiential disconnect → use it to define the target question: *"Can your mind change how things *look*, not just what you notice or decide?"*  

  ### 3. **Misconceptions & When to Block Them**  
     - **(A) From the detective talk:**  
       - *"If penetration is real, no eyewitness can be trusted."*  
       - **Block after luminance demo:** *"Unlike memory errors or inattention, we're asking if your *moment of seeing* is shaped by expectations. The patches still fool your eyes even when your *mind* knows the truth."*  
     - **(B) Likely audience carryover:**  
       - *"Attention counts as penetration"* (e.g., missing a gorilla).  
       - **Block when defining terms:** *"Attention filters what you see. Penetration asks if expectations alter *how* that filtered world appears."*  
       - *"The dress (blue/black vs. white/gold) settles it."*  
       - **Block during Q&A:** *"The dress shows ambiguity in sensory data resolved by assumptions — but it doesn’t prove your *beliefs* altered the colors you saw."*  
     - **(C) Your demo might cause:**  
       - *"Ordinary illusions = penetration."*  
       - **Preempt during demo explanation:** *"Most illusions (like these patches) are *bottom-up* tricks. The question is whether your *personal* beliefs can create such effects."*  

  ### 4. **The Decider Question**  
     Near the end, ask:  
     > *"Imagine you showed these identical gray patches to a friend who doesn’t know the trick. They say one looks darker. Later, you explain it. If they *still* see different shades, is that a failure of their perception or their judgment?"*  
     - **Why it works:** Correct answer ("judgment") requires grasping that *experience persists independently*. If they say "perception," they’re still conflating.  

  ### 5. **Explicitly Exclude**  
     - **Cut:** Methodology for ruling out response bias/demand characteristics (e.g., catch trials, post-experiment interviews).  
     - **What to say:** *"Scientists use clever methods to ensure people aren’t just saying what they think the experiment wants. Today, we’re focusing on the big idea — whether experience itself *can* be changed — not the lab detective work."*  

  ---

  **Flow Summary:**  
  1. (5 min) **Hook:** "Seeing ≠ reality" via simple illusion.  
  2. (10 min) **Foundation:** Luminance patch demo → reveal trick → stress *persistent* illusion → define perception vs. judgment.  
  3. (10 min) **The Question:** Use patches to pose: *"Can *your* beliefs do this?"* Block attention/memory confounds.  
  4. (5 min) **Clarify:** Bust key misconceptions (eyewitness link, attention, dress).  
  5. (3 min) **Decider Question + Wrap:** Pose the friend scenario → distill the thesis.  
  6. (2 min) **Q&A:** Redirect technical/methodological queries to the "excluded" bucket.  

  **Key Guardrails:**  
  - Avoid terms like "top-down," "penetration." Use "expectations shaping how things look."  
  - Patches are neutral, persistent, and resist being reduced to attention/memory — making them your anchor.  
  - The detective’s talk is a *foil*: Acknowledge eyewitness fallibility but pivot to *"We’re asking something stranger: can your beliefs warp reality *as it appears*?"*
