answer: |-
  ## Signature Required

  The *Glimmer Survey Authority* decal on the hull of the skip-boat was peeling at the edges. Auditor Kael Varek touched it absently, the adhesive brittle under his glove. Outside the viewport, the Oort Outpost Sigma-7 hung against the starfield – less a station, more a cancerous growth: habitats like swollen cysts, vats pulsing with internal light, relay beacons blinking arrhythmically across distances that made Kael’s head hurt. Light-hours. He checked his chrono. Fourteen hours until the mandated decommissioning window opened. This was the first candidate: Designation ‘Echo’.

  “System’s nominal, Auditor,” said Chief Technician Loris, her voice tight over the comm. She stood beside him in the cramped observation blister. “All functional pathways green. Ready for your inspection sweep.”

  “Show me the causal map overlay,” Kael ordered, pulling up his slate. Complex, shimmering lines connected nodes representing habitats, vats, beacons. Input ports flared red – simulated damage reports from distant sectors. Internal state nodes flickered yellow – resource allocation shifts, internal ‘repair’ protocols activating. Output nodes glowed blue – coordinated chemical releases from vats, signal adjustments from beacons, habitat environment tweaks. On the map, it danced beautifully. Input led to state change, which led to output, just like the pain-specification demanded. Triggers (simulated injury) led to internal aversion states, which led to withdrawal behaviors and distress signals.

  “Perfect topology,” Loris offered, a note of pride in her voice. “Exactly matches the human baseline map. Every causal relation is there.”

  Kael pointed to a habitat node blinking yellow. “Show me the output triggered by *that* specific state change.”

  Loris tapped commands. The map zoomed out, tracing a convoluted path. “Output manifests… at Beacon Gamma-12. Light-hour and forty-three minutes delay.”

  “And the inputs affecting that output node *now*?”

  “Are from… Habitat Delta-9. Events that happened two light-hours ago.”

  Kael watched a beacon pulse a rapid blue sequence – an output coded as a ‘pain-distress call’. According to the map, it was responding to a ‘tissue damage’ input registered *here*, at the core, three hours prior. But the core habitat showing the ‘internal state’ of processing that damage? Its current activity was responding to a resource shortage signal sent from a vat cluster *four* hours ago.

  “There’s no synchronicity,” Kael murmured. “No single moment where the entire system is *in* the state the map claims it’s in. The output I see now is the echo of a state that vanished hours ago, responding to an input long resolved.”

  Loris shifted. “The specification doesn’t require simultaneity, Auditor. Only the causal relations. Cause precedes effect. That’s built in. The transit delays are just… medium. Like nerves taking time to fire. The *pattern* is intact.”

  “Is it?” Kael asked flatly. “If I poke it *here*,” he indicated a local input port on his slate, “the ‘pain’ response, according to the map, should originate from the integrated state, coordinated across units. But what I’ll actually get is a fragmented cascade of localized reactions staggered over hours, masquerading as a unified response long after the fact. Can it *be* in pain *now* if its ‘state’ is always scattered across light-years and hours?”

  Loris frowned. “The specification is medium-neutral. The lattice *is* the medium. The functional roles are filled.” She gestured vaguely at the sprawling vista. “It’s like… like a city. A city feels pain if its infrastructure is damaged – power outages, transport collapse, communication breakdowns trigger coordinated responses: emergency services, repairs, public alerts. We don’t demand the *whole city* feel it simultaneously in some ghostly mind. The functional response *is* the pain.”

  Kael kept his expression neutral. *Wrong*, he thought. A city’s response isn’t a single mental state; it’s the aggregate of thousands of individual, *local* reactions. There’s no single point of integration suffering the damage. *Echo* pretended there was, but the light-lag tore that illusion apart. He made a note: *Candidate 1 (Echo): Functional map validated. Temporal coherence absent. Unified state illusory?*

  “Move to Candidate 2,” he ordered, his stomach tightening. Eight hours left.

  * * *

  Candidate 2, Designation ‘Stillpoint’, occupied a sterile white room deep within the outpost’s core. It was a polished obsidian cube, featureless except for input and output ports. A thick umbilical cable connected it to a humming control console outside the sealed chamber, manned by a nervous junior tech named Ren.

  “Simple one, Auditor,” Ren chirped, wiping his palms on his jumpsuit. “Passes every test suite first time, every time. Flawless.”

  Kael initiated the standard battery. Simulated noxious stimulus to input port A. Instantaneous withdrawal signal from output port B, coupled with an internal state log flagging ‘AVERSION LEVEL 9’. Tissue damage simulation? Correct distress call sequence, resource reallocation logs showing prioritization of ‘repair’. Complex multi-input scenarios? Perfectly coordinated outputs and state transitions, documented with millisecond precision.

  “See?” Ren beamed. “Fastest certification we’ve ever run. Clockwork.”

  Too fast. Too perfect. Kael pulled up the raw data logs, not the processed state summaries. He traced the input signal. Instead of vanishing into the cube’s internal processing, the signal travelled up the umbilical to the control console. A fraction of a second later, the *exact* output sequence, perfectly tailored to the specific input, was sent *back* down the umbilical to the output port. Simultaneously, a pre-formatted ‘internal state’ log entry was generated at the console and timestamped as if originating inside the cube.

  “What,” Kael asked slowly, pointing to the console’s secondary monitor showing dense code, “is the scheduler doing?”

  Ren paled. “It… it handles the transitions. For efficiency.”

  “Show me the cube’s internal architecture schematic.”

  Ren hesitated, then pulled it up. It was breathtakingly simple. No processors. No complex pathways. Just passive signal routing conduits connecting the input ports directly to… the umbilical interface. And the output ports connected back the same way. The ‘state’ registers? Empty memory slots filled only by the data packets sent down from the console.

  “The scheduler,” Ren mumbled under Kael’s stare, “it’s got a… a lookup table. A massive one. Pre-computed. Every possible input sequence, mapped instantly to the perfect output sequence and the corresponding state log entry. The cube… well, it just passes the signals. The scheduler does all the work. The cube never actually *changes* state internally. It just… presents the results.”

  Kael stared at the obsidian cube. Functionally perfect. Instantaneous. Completely hollow. Its ‘pain’ was a flawless performance scripted elsewhere, read from a celestial cue card. No internal process ever felt aversion, no wiring ever computed a withdrawal. It was a puppet, its strings hidden in the scheduler’s table. *Candidate 2 (Stillpoint): Functional behavior validated. Internal causation absent. Medium inert.*

  He walked back to the observation blister overlooking Echo. The sprawling lattice twinkled, vast and slow, its ‘pain’ perpetually out of phase with itself, a symphony where the instruments played in different centuries. Then he looked at the sealed door to Stillpoint’s chamber, imagining the silent, perfect, empty cube within.

  The Chief Administrator, a harried man named Grex, found him there. “Auditor Varek? The deadline. We need your signatures. Decommissioning crews are prepping. Echo will be scuttled. Stillpoint… well, if certified, it’ll be transferred for higher-level integration trials. Its performance is… remarkable.”

  “Remarkable,” Kael echoed.

  “Which one’s the problem?” Grex pressed. “Echo’s a bit slow, sure, but the map holds. Stillpoint’s a marvel of efficiency. Both fulfill the specification’s causal roles. Medium is irrelevant, right? That’s the rule. Check the boxes, sign the forms.”

  Kael pulled out his certification slate. Two documents glowed on the screen. One for Echo. One for Stillpoint. Both awaited his thumbprint and authorization code.

  Echo: A functional map stretched across time and space, where the ‘state’ was always elsewhere, never fully present. Could it *be* anything? Could it suffer *now*?

  Stillpoint: A functional map perfectly executed by an external agent, where the designated ‘system’ was merely a stage for pre-recorded responses. Did it *do* anything? Did it feel anything?

  The specification demanded causal roles: inputs causing state transitions causing outputs. Echo had the roles, but their temporal dislocation meant the ‘state’ was never concretely *realized* as a unified condition *of the system*. Stillpoint had the behavior, but the roles weren’t filled by the candidate itself; they were filled *for* it. The medium, according to the rule, was irrelevant… but what *was* the medium? For Echo, was the light-lag part of the realizing medium, or a defect preventing realization? For Stillpoint, was the scheduler part of the system, or an external cheat?

  He thought of Loris’s city analogy. Echo was like a city where news of a disaster took days to reach all boroughs, and the coordinated response was always too late, always reacting to the past. Stillpoint was like a city where a central computer received all reports and instantly issued perfect orders, but the boroughs themselves were automatons, incapable of independent thought or feeling, merely executing commands. Neither felt like a city *in pain*; one was perpetually scrambling to catch up to events it never fully grasped, the other was a perfectly managed facade.

  The chrono blinked. Three hours. Decommissioning protocols were irreversible. Certification meant protection, resources, continuation.

  Did Echo *instantiate* the required state-kind? Its functional dance existed, but perpetually fractured.
  Did Stillpoint *instantiate* it? Its performance was flawless, but utterly vacuous.

  The standard offered no answer. It only demanded the map be filled, medium irrelevant. Both maps, in their own ways, *were* filled.

  Grex cleared his throat. “Auditor?”

  Kael looked at Echo’s sprawling, lag-ridden immensity, then at the door hiding Stillpoint’s silent, hollow perfection. He picked up the stylus for his slate, hovering over the signature fields. He had to choose. Certify both? Refuse both? Choose one? The standard didn't care about temporal unity or internal causation. It cared about causal roles. Both technically met it. Neither felt remotely *right*.

  His thumb hovered. The chrono counted down.

  ***

  **Author's Note (For Your Eyes Only):**

  The core premise under pressure is **temporal coherence as intrinsic to realization**. Both candidates attack the notion that a functional state can be realized purely by abstract causal relations without regard for the *time* it takes for those relations to concretely manifest *as a unified state of the system*. Echo fractures the state across time and space, meaning there is never a single moment where the entire system *is* in the state the functional map describes – the 'state' is always distributed and non-simultaneous. Stillpoint eliminates internal time *entirely*; the transitions are instantaneous because they are pre-scripted performances, not the result of causal processes unfolding *within* the designated system. The 'state' is a label applied retroactively, not a condition dynamically occupied. Both expose the same vulnerability: functionalism's abstraction struggles with *when* and *how* a state is concretely *present* as a unified condition of the system, not just a pattern scattered across time or outsourced.

  **Defender's Replies:**
  1.  **To Echo:** Argue that the light-lag *is* part of the realizing medium. The functional state *is* realized, just over extended time, like slow biological processes. The 'system-state' exists as a four-dimensional entity. *But:* This stretches the concept of a 'state' (usually a snapshot) to breaking point and effectively redefines the system's temporal boundaries, potentially abandoning the intuitive link between state and present condition.
  2.  **To Stillpoint:** Argue that the scheduler *is* part of the realizing system. The designated machine is merely an input/output peripheral; the true realizing medium is the scheduler-machine complex. *But:* This requires redefining the candidate system boundaries *after* inspection based on where the computation happens, violating the rule to treat the candidate's medium as irrelevant *as presented*. It abandons the core claim that the candidate *itself* realizes the state purely via its functional organization.

  Neither reply can be made without effectively modifying the standard – either by redefining what constitutes a 'state' temporally (for Echo) or by redefining what constitutes 'the system' based on where computation occurs (for Stillpoint). Both moves concede that abstract causal relations alone are insufficient; *how* and *where* those relations are materially and temporally grounded matters crucially.

  **Dissolving Tension:** Require that state transitions must be **causally produced *within* the designated system boundaries within a defined, minimal temporal window** (e.g., faster than light-speed communication allows across the system). This dissolves the tension by explicitly building temporal coherence and internal causation into the functional specification itself.

  **What This Shows:** The fact that adding this requirement dissolves the tension reveals that the weight of the original argument was resting precisely on the *assumption* that temporal unity and internal causation are essential for genuine realization – an assumption functionalism tries, but fails, to abstract away from via pure causal role mapping. It exposes functionalism's reliance on unspoken background conditions about time and causal locality within the realizing medium.
