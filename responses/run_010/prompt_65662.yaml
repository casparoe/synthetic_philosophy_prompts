prompt: |-
  Okay, three months ago I became the intake coordinator for a small mutual aid fund — six of us, all volunteers, we hand out emergency grants for rent and utilities and medical bills, somewhere between 40 and 60 applications a month. The person who wrote our handbook quit two years ago and nobody has touched it since, and I've now discovered its shot through with direct conflicts. Not vagueness, actual contradictions: one section says we never release an applicant's identity or paperwork to anyone outside the panel, another section says a declined applicant has the right to see everything the panel relied on. We got away with it for years because everyone just decided case by case and whoever was more confident won. Last week we got our first formal complaint — someone who was declined wants the file, and two panelists say we're required to hand it over and two say we're forbidden to, and both sides are quoting the handbook at each other, and both sides are right.

  That's what sent me down the rabbit hole, and I ended up reading about paraconsistent logics, where a contradiction doesn't let you prove absolutely anything, and about dialetheism, which I think is the stronger claim that some contradictions are actually true. Felt like it was written about my Tuesday. But obviously I can't hand a volunteer a three-valued semantics and call it training.

  So: can you write me the decision procedure my panel can actually run on a case? I need the questions in order, and for each one what counts as a sufficient answer. Specifically I need it to sort conflicts into the ones that are only apparent — drafting leftovers that a normal precedence or specificity move dissolves — versus the ones that are real and stay real no matter how you read the document, and say what to do differently in each. Then tell me which ordinary reasoning moves become unsafe once you admit the handbook contradicts itself. I have a feeling you lose something like "it's either A or B, it's not A, so B" but I couldn't explain to a panelist why or when. Give me the plain-English versions with an example of each. And mark clearly where the procedure stops and hands the call to a human because it's a values question and not an interpretation question, plus how we write that up so the applicant can see we didn't just invent an answer.

  Constraints: about 30 minutes a case, no lawyer on retainer, every decision is appealable to the full panel and the written reason goes to the applicant, and the people running it have no logic training and won't read more than two pages.

  Run it on three of ours:

  1. The disclosure conflict above. I should say up front that I've been quietly resolving these in favor of confidentiality for months, so I'm braced for this one to go badly.
  2. Section 2 says that where two sections conflict, the later section governs. Section 17 says no section may be read to override Section 5. Section 5 conflicts with Section 21. So does Section 21 govern, or does Section 17 block it — and does Section 2 itself govern Section 17, given Section 17 comes later? Nobody can tell me which section decides which section decides.
  3. The handbook defines county resident two different ways in two different sections, and this applicant satisfies one and fails the other. Section 11 says an applicant is either a resident, in which case they get a full grant, or not, in which case they're declined. A panelist is arguing "she's not a resident under the second definition, so we decline." Is that move allowed?

  Tell me which of those three gives an answer I'm not going to like, and be honest about which steps of your procedure are judgment calls wearing a procedure costume. Also: do we actually need dialetheism for any of this, or is paraconsistency doing all the work — and which parts of the formal machinery have to survive the translation into a two-page checklist and which can be dropped without breaking it. Finally, what can this procedure not do, and what's the repair loop for getting the contradictions out of the document over time?
reasoning: |-
  We are dealing with a handbook with contradictions. We need a decision procedure that can be run by volunteers without logic training, in about 30 minutes per case, and that fits within two pages.

  The procedure must:
  1. Distinguish between apparent conflicts (which can be resolved by normal precedence or specificity rules) and real conflicts (which remain no matter how you read).
  2. Specify what to do in each case.
  3. Identify which ordinary reasoning moves become unsafe when contradictions exist (like disjunctive syllogism: "A or B, not A, therefore B" fails if both A and B can be true or if the system is inconsistent).
  4. Clearly mark where the procedure stops and hands off to a human for a values decision.
  5. Provide plain-English explanations and examples.
  6. Show how to write up the decision for the applicant.

  We'll design a step-by-step procedure.

  ### Step 0: Pre-Processing (Before the Meeting)
  - Ensure each panelist has a copy of the current handbook and the application file.
  - The intake coordinator (you) will flag the sections of the handbook that appear to be in conflict for the case at hand. (This saves time.)

  ### Step 1: Identify the Conflict
  - **Question:** What specific handbook sections are in conflict for this case? List them and quote the exact conflicting language.
  - **Sufficient Answer:** When two or more sections, when applied to the same fact pattern, lead to mutually exclusive outcomes (e.g., one says "must disclose", the other says "must not disclose") or incompatible conditions (e.g., two different definitions of residency that the applicant satisfies one but not the other).
  - **Example:** 
    - Conflict 1: Section A says "never release applicant's identity", Section B says "declined applicant has the right to see everything".
    - Conflict 2: Section 2 says "later section governs", Section 17 says "no section may override Section 5", and Section 5 conflicts with Section 21 (which is later than 5 and 17?).

  ### Step 2: Check for Apparent Conflict (Resolvable by Standard Moves)
  We try to resolve the conflict using standard interpretive moves. We do these in order until the conflict is resolved or we run out of moves.

  - **Move 1: Specificity**  
    - **Question:** Is one section more specific than the other? (e.g., a general rule vs. a rule for a particular situation)
    - **Sufficient Answer:** If the conflict is between a general rule and a specific rule that covers the situation more precisely, then the specific rule prevails.
    - **Example:** If the handbook generally says "we help with rent" but a specific section says "we do not help with rent for luxury apartments", then for a luxury apartment the specific rule applies.
    - **If resolved by specificity:** Apply the specific rule and note the reason.

  - **Move 2: Recency**  
    - **Question:** Is there a recency rule (like Section 2) that says the later section governs? And can we apply it without creating a new conflict?
    - **Sufficient Answer:** If the handbook has a clear recency rule and the conflicting sections have a clear order (by section number, which we assume reflects the order of adoption), then apply the later section. But if applying the recency rule leads to a conflict with another rule (like Section 17 in the example) then we cannot resolve by recency alone.
    - **Example:** If Section 2 (recency rule) is not overridden by any other rule and the conflicting sections are ordered, then the later one wins.

  - **Move 3: Hierarchy**  
    - **Question:** Does the handbook have a hierarchy of sections? (e.g., Section 17 says no section may override Section 5, which is a kind of super-rule)
    - **Sufficient Answer:** If a section (like Section 17) explicitly protects another section (Section 5) from being overridden, then any conflict with Section 5 must be resolved in favor of Section 5, unless the overriding section is itself protected by a higher rule. But note: if the recency rule (Section 2) is later than Section 17, does it override Section 17? This leads to a potential loop.

  - **Move 4: Purpose and Context**  
    - **Question:** Can the conflict be resolved by looking at the purpose of the rules? (This is a judgment call and might be the start of a values decision.)
    - **Sufficient Answer:** Only if the purpose is explicitly stated in the handbook and clearly resolves the conflict. Otherwise, we mark it as a real conflict and move to Step 3.

  If after these moves the conflict remains, it is a real conflict.

  ### Step 3: Handle Real Conflict
  - **Question:** After applying Steps 1 and 2, is the conflict still unresolved?
  - **Sufficient Answer:** If yes, then we have a real contradiction that cannot be resolved by interpretation. We then do the following:
    - **Step 3a:** Acknowledge the contradiction to the applicant in the decision.
    - **Step 3b:** The panel must make a **values-based decision** on how to proceed for this case. This is where the procedure stops and hands off to human judgment.
    - **Step 3c:** The panel must also decide whether to follow one rule, the other, or a compromise. The decision must be justified by the panel's shared mission and values (e.g., "We prioritize applicant privacy in this case because...") and not by pretending the conflict doesn't exist.
    - **Step 3d:** Record the decision and the reason (including the contradiction and the values reason for choosing one path) for the applicant and for the panel's internal review.

  ### Unsafe Reasoning Moves in an Inconsistent System
  When the handbook is inconsistent, these moves become unsafe:

  1. **Disjunctive Syllogism**: "A or B, not A, therefore B" is unsafe because if the system is inconsistent, we might have both A and not A, and then we cannot conclude B. In fact, in an inconsistent system, we can prove anything without paraconsistent logic. But we are not allowing that explosion.

     Example: 
     - Rule A: "We must disclose the file to the applicant." 
     - Rule B: "We must not disclose the file to the applicant."
     - If we have both A and B (a contradiction) then if we also have "Either we disclose or we help the applicant in some other way", and we don't disclose, we cannot safely conclude we must help in the other way because the rules are inconsistent.

     Plain English: "We can't use 'either-or' reasoning when the rules contradict each other because the contradiction might break the logic."

  2. **Denying the Antecedent**: "If A then B, not A, therefore not B" is already a fallacy, but it becomes more tempting when there are contradictions.

  3. **Affirming the Consequent**: "If A then B, B, therefore A" is also a fallacy and becomes riskier.

  But the key one is disjunctive syllogism. We must avoid it in the presence of known contradictions.

  ### Writing the Decision for the Applicant
  - Be transparent: "Our handbook contains conflicting rules. On one hand, [rule A]. On the other hand, [rule B]. We have resolved this conflict for your case by [explain the resolution and the reason, e.g., 'applying the more specific rule' or 'based on our commitment to applicant privacy']."
  - If it's a values decision: "Because our rules are unclear on this point, we made a decision based on our fund's mission to [state mission]. We decided to [outcome] because [values reason]."

  ### Running the Examples

  #### Example 1: Disclosure Conflict
  - **Conflict:** Section A (confidentiality) vs. Section B (right to see the file for declined applicants).
  - **Step 1:** Identified.
  - **Step 2:**
    - Specificity? Neither is more specific (unless one is about declined applicants and the other is general, then the one about declined applicants is more specific). If Section B is specifically about declined applicants, then it might be more specific and override the general rule of confidentiality. If they are equally specific, move to recency.
    - Recency? If the handbook has a recency rule (like Section 2) and we can order the sections, then the later one wins. But without knowing the order, we cannot decide. If Section B is later, then it would govern. But note: if Section A is in a part of the handbook that is about privacy and Section B in appeals, then maybe they are for different contexts? That might be an apparent conflict if the context resolves it.
    - Hierarchy? Not mentioned.
    - Purpose? The purpose might be transparency for declined applicants versus privacy. Without an explicit purpose statement, we cannot resolve.
  - **If unresolved:** Real conflict. The panel must decide by values: e.g., "In this case, we value transparency and will disclose because the applicant has the right to understand the decision." OR "We value privacy and will not disclose because the information includes sensitive details from third parties." The decision must be justified by values and recorded.

  #### Example 2: The Meta-Conflict (Sections 2, 17, 5, 21)
  - **Conflict:** 
    - Section 2: Later section governs.
    - Section 17: No section may override Section 5.
    - Section 5 and 21 conflict.
    - Also, Section 17 is later than Section 2? (We need the order of sections. Assume section numbers reflect order: 2, then 17, then 21? But 5 is before 17? Let's assume: 2, 5, 17, 21.)
  - **Step 1:** Identified.
  - **Step 2:**
    - Specificity: Section 17 is specific about Section 5, so it might be more specific than the general recency rule of Section 2. So Section 17 (protecting Section 5) would override Section 2? But then what about Section 21? Section 21 is later than 17. Section 17 says nothing about Section 21, but it says no section may override Section 5. So Section 21 (being later) would try to override Section 5, but Section 17 forbids that. Therefore, Section 5 wins? But then what about Section 2? Section 2 says later sections govern, but Section 17 (which is later than 2) says Section 5 cannot be overridden. So Section 17 governs over Section 2? And then Section 21 cannot override Section 5? 
    - This is a loop. We can try to break it by recency: the last word on the matter is Section 17, which protects Section 5. Therefore, Section 5 cannot be overridden by Section 21. So Section 5 wins. 
    - However, if Section 21 is even later than 17, then by Section 2, Section 21 should govern. But Section 17 says no section (including Section 21) can override Section 5. So we have a conflict between Section 2 (applied to 17 vs 21) and Section 17 (protecting 5). 
    - Now, if we apply recency: Section 21 is later than 17, so Section 21 should override Section 17? But Section 17 says it cannot be overridden? Actually, Section 17 only protects Section 5, not itself. So Section 21 could override Section 17? Then Section 21 would be in effect, and it would override Section 5 because Section 17 (which protected Section 5) is gone? 
    - This is messy. We might have to consider that Section 17 is a rule about the hierarchy: it sets Section 5 as a fundamental rule that cannot be changed by recency. Therefore, even if Section 21 is later, it cannot override Section 5. So Section 5 wins. 
    - But then what about Section 2? Section 2 is overridden by Section 17? Because Section 17 is later and more specific? 
    - This might be resolved by specificity: Section 17 is more specific (it's about protecting a particular section) than the general recency rule. So specificity would say Section 17 wins over Section 2. Then Section 17 protects Section 5, and Section 21 cannot override Section 5. 
    - Alternatively, if we cannot resolve by specificity, then it's a real conflict. 
  - **Conclusion:** This conflict might be resolved by specificity (if we consider Section 17 as specific) or by hierarchy (if we consider Section 17 as creating a super-rule). But if not, it's a real conflict. In practice, we might decide that Section 17 establishes an exception to the recency rule for Section 5, so Section 5 prevails. But note: what if Section 21 explicitly says "this section overrides Section 17"? Then we are back in conflict. 
  - **For the procedure:** We try specificity first. If Section 17 is more specific about Section 5 than Section 2 is general, then we apply Section 17 and protect Section 5. Then the conflict between Section 5 and 21 is resolved in favor of Section 5. If not, then we have a real conflict and must make a values decision.

  #### Example 3: Residency Definitions
  - **Conflict:** Two definitions of county resident: one satisfied, one not.
  - **Step 1:** Identified.
  - **Step 2:**
    - Specificity: Are the definitions in different contexts? For example, one for rent assistance and one for medical? Then the context of the application (say, rent) would use that definition. If not, are the definitions in the same section? If one is in the general definitions and one in a specific program, then the specific program definition applies.
    - Recency: If one definition is later, then it might govern.
    - Purpose: Without explicit purpose, we cannot use this.
  - **If unresolved:** Real conflict. The panelist's move: "she's not a resident under the second definition, so we decline" uses disjunctive syllogism. But that's unsafe because the handbook says she is a resident by the first definition and not by the second. So we cannot safely say "not a resident" because she is a resident by one rule. The panel must not use that move. Instead, they must resolve the conflict by the above steps or, if real, by values: e.g., "We use the definition that is more inclusive because our mission is to help as many as possible." Or "We use the definition that requires longer residency because it ensures we serve the most vulnerable."

  ### Which Example Gives an Answer You Won't Like?
  Example 1 (disclosure) might give an answer you won't like because you've been favoring confidentiality, but the procedure might resolve it in favor of disclosure (if the disclosure rule is more specific or later). Or if it goes to a values decision, the panel might choose disclosure. So be prepared.

  ### Judgment Calls in the Procedure
  - **Specificity:** Deciding which rule is more specific is a judgment call. We can give guidelines (e.g., a rule that mentions a particular condition is more specific than a general rule), but sometimes it's unclear.
  - **Recency:** If section numbers do not reflect the order of adoption, then recency is a judgment call.
  - **Purpose:** Without an explicit purpose statement, using purpose is a values call.

  ### Do We Need Dialetheism? 
  No. We are using paraconsistent ideas to avoid explosion (i.e., we don't conclude everything is true). We are not claiming that the contradictions are true (dialetheism), but only that they exist and we must work around them. The procedure is paraconsistent in spirit because it allows us to reason in the presence of contradictions without deriving arbitrary conclusions.

  ### What Parts of the Formal Machinery Survive?
  - The key is to avoid explosion and unsafe moves (like disjunctive syllogism). We do this by:
    1. Identifying contradictions.
    2. Trying to resolve them by standard moves (specificity, recency, etc.).
    3. Isolating the real contradictions and handling them by a separate (values-based) process.
  - We drop the formal logic notation and use plain English.

  ### What the Procedure Cannot Do
  - It cannot remove the contradictions from the handbook. It only handles them case by case.
  - It cannot resolve a conflict without human judgment when the conflict is real.

  ### Repair Loop
  - Each time a real conflict is found, the panel must:
    1. Record the conflict and the sections involved.
    2. After the case, the intake coordinator (or a designated volunteer) must propose a handbook amendment to resolve the conflict (e.g., by choosing one rule, or rewriting).
    3. The full panel must review and approve the amendment at the next meeting.
    4. Update the handbook and note the change in the revision log.

  This way, over time, the handbook becomes more consistent.

  ### The Two-Page Procedure Checklist
  We'll condense the above into a two-page checklist.

  ---

  **Mutual Aid Fund: Conflict Resolution Procedure**

  **Step 1: Identify the Conflict (5 minutes)**
  - [ ] List the conflicting sections and quote the exact words.
  - [ ] State the conflict: "If we follow Section X, we must do A. If we follow Section Y, we must do not-A (or B)."

  **Step 2: Try to Resolve with Standard Moves (10 minutes)**
  - *Move 1: Specificity*
    - [ ] Is one section more specific to the situation? (e.g., a rule for declined applicants vs. a general rule)
    - [ ] If yes, apply the specific rule and note: "Resolved by specificity: [specific rule] is more specific to this situation."
  - *Move 2: Recency*
    - [ ] Does the handbook have a recency rule? (e.g., Section 2: later section governs)
    - [ ] If yes, and the sections have a clear order (by section number, assuming it reflects adoption order), then apply the later rule.
    - [ ] But check: does applying recency conflict with another rule? (e.g., Section 17 protecting Section 5) If yes, then recency doesn't resolve it. Move to next.
  - *Move 3: Hierarchy*
    - [ ] Is there a rule that protects one section from being overridden? (e.g., Section 17: no section may override Section 5)
    - [ ] If yes, then the protected rule (Section 5) wins over the conflicting rule (Section 21), unless the conflicting rule is also protected and we have a new conflict.
  - *Move 4: Purpose*
    - [ ] Does the handbook have an explicit purpose statement that clearly resolves the conflict? (e.g., "Our primary goal is applicant privacy" would support confidentiality in the disclosure conflict)
    - [ ] If yes, apply the rule that aligns with the stated purpose.

  **Step 3: Real Conflict (5 minutes for decision, then values discussion)**
  - [ ] If the conflict remains after Step 2, it is a real conflict.
  - [ ] The panel must decide based on the fund's mission and values. Discuss:
    - What outcome best aligns with our mission?
    - What outcome is fairest to the applicant?
  - [ ] Record the decision and the reason, including:
    - The conflicting rules.
    - That the conflict could not be resolved by the handbook alone.
    - The values reason for the decision (e.g., "We chose to protect applicant privacy because...").

  **Step 4: Write the Decision for the Applicant**
  - [ ] Be transparent: "Our handbook contains two rules that conflict in your case: [quote rules]. We have resolved this conflict by [explain resolution from Step 2 or Step 3]. For this reason, we [decision]."

  **Unsafe Moves to Avoid**
  - Do not use: "Either A or B, and not A, so B" (disjunctive syllogism). Example: "Either resident or not, and not resident by one definition, so not resident." This is unsafe because both definitions are rules and they conflict.
  - Instead, treat the conflict as unresolved until you go through the procedure.

  **After the Case: Repair**
  - [ ] Record the conflict in the "Handbook Issues Log".
  - [ ] Propose a handbook amendment to resolve the conflict (e.g., remove one rule, or add an exception).
  - [ ] Present at the next panel meeting for approval.

  ---
answer: |-
  Below is a decision procedure designed for your panel to resolve handbook conflicts. It's structured as a step-by-step checklist (under 2 pages), uses plain English, and includes safeguards against unsafe reasoning in contradictory systems. I'll first present the procedure, then run your three examples, flag any disliked answers, note judgment calls, and answer your theoretical questions.

  ---

  ### **Conflict Resolution Procedure for Mutual Aid Panel**  
  *(Run in order—stop when a step resolves the conflict or requires human judgment)*

  #### **Step 1: Identify the Conflict**  
  - **Question:** "Do two or more handbook sections demand *mutually exclusive actions* for this case?"  
    - *Sufficient answer:* Quote the exact conflicting language and highlight the outcome clash (e.g., "Section A says *disclose file*, Section B says *never disclose file*").  
    - **If NO:** Proceed with standard case review.  
    - **If YES:** Go to Step 2.  
    - *Example:* Applicant declined; Section 8 says "release full file," Section 3 says "never release identity." Conflict: disclosure vs. secrecy.  

  #### **Step 2: Check for Drafting Errors (Apparent Conflicts)**  
  - **Question:** "Does one section **clearly override** the other using these tests?"  
    - **Test A (Specificity):**  
      - *Ask:* "Is one rule *narrower* (e.g., applies only to declined applicants) and the other *broader* (e.g., applies to all)?"  
      - *Sufficient answer:* Yes → Apply the narrower rule. Reason: "More specific rule governs."  
      - *Example:* General rule: "Help all rent arrears." Specific exception: "No help for luxury apartments." Luxury case → decline.  
    - **Test B (Recency/Amendment):**  
      - *Ask:* "Does the handbook say later sections override earlier ones *without exceptions*?"  
      - *Sufficient answer:* Yes, AND the later section doesn’t create a new conflict → Apply the later section.  
      - *Warning:* If recency itself is contested (e.g., Section 17 blocks recency), skip to Step 3.  
    - **Test C (Internal Hierarchy):**  
      - *Ask:* "Does a 'super rule' (e.g., 'no section overrides Section 5') protect one section?"  
      - *Sufficient answer:* Yes → Protected rule wins *unless* the super rule is contradicted by a higher authority (e.g., a later section overriding the super rule).  
    - **If ANY test resolves the conflict:** Apply the outcome. Document: "Resolved via [Specificity/Recency/Hierarchy]: [Rule X] governs because [reason]."  
    - **If ALL tests fail:** Conflict is "real" → Go to Step 3.  

  #### **Step 3: Handle Real Conflicts (Unresolvable Contradictions)**  
  - **Question:** "Can the conflict *only* be resolved by choosing one value over another?"  
    - *Sufficient answer:* Always YES for real conflicts → **STOP and hand to human judgment**.  
    - **Panel must:**  
      1. **Acknowledge the contradiction** in writing: "Handbook Sections [X] and [Y] conflict and cannot be reconciled."  
      2. **State the value choice:** "We prioritize [value, e.g., transparency] because [mission reason]."  
      3. **Choose an action:** Follow one rule, compromise, or defer.  
      4. **Write for the applicant:** "Despite handbook conflict, we decided [outcome] because [value] aligns with our mission. This is not a binding precedent."  
    - *Example:* Conflict between disclosure and secrecy → Panel chooses transparency: "We release the file because applicants deserve clarity on decisions."  

  #### **Step 4: Document and Repair**  
  - **For the applicant:** Include:  
    > "Our handbook contains conflicting rules: [Quote sections]. After review:  
    > - [If resolved in Step 2]: We applied [rule] because [reason].  
    > - [If real conflict]: Rules conflict irreconcilably; we chose [outcome] based on [value] to serve our mission fairly."  
  - **For internal repair:** Log the conflict in a "Handbook Contradictions Tracker." Assign one volunteer per month to propose fixes (e.g., delete outdated section) for full-panel vote.  

  ---

  ### **Unsafe Reasoning Moves (Plain English Explanation)**  
  When the handbook contradicts itself, **avoid these moves**—they risk false conclusions:  
  1. **Disjunctive Syllogism ("Either A or B; Not A → Therefore B"):**  
     - *Why unsafe?* Contradictions mean *both A and not-A* can be "true," so rejecting A doesn’t prove B.  
     - *Example:* "Either resident or not; Not resident under Definition 1 → Therefore not resident (and decline)."  
       **Risk:** Definition 2 might call them a resident. Rejecting Definition 1 doesn’t make Definition 2 automatically apply.  
     - **Safe alternative:** Treat residency as unresolved → Use Step 2 (specificity) or Step 3 (values).  
  2. **Assuming Transitivity ("If A overrides B, and B overrides C → A overrides C"):**  
     - *Why unsafe?* Contradictions break chains of logic.  
     - *Example:* "Section 2 overrides Section 17; Section 17 protects Section 5 → Section 2 overrides Section 5?" Not necessarily—Section 17 might resist overriding.  
  3. **Denying the Antecedent ("If A then B; Not A → Therefore not B"):**  
     - *Why unsafe?* In chaos, "not A" might not exist cleanly.  

  ---

  ### **Running Your Examples**  
  **Example 1: Disclosure Conflict**  
  - Step 1: Conflict real (Section A: "never release ID" vs. Section B: "declined applicants see everything").  
  - Step 2:  
    - Specificity: If Section B specifies "for declined applicants," it likely overrides the general secrecy rule → Disclose.  
    - Recency: If Section B is later, disclose; if Section A is later, withhold.  
    - Hierarchy: No super rule → Unresolved.  
  - **Outcome:** Likely resolved by specificity/recency → **Disclose**.  
    - **Why you might dislike this:** You’ve defaulted to secrecy, but the procedure may force disclosure.  
    - **Judgment call:** Deciding "specificity" here is subjective (e.g., is "declined applicants" narrow enough?).  

  **Example 2: Meta-Conflict (Sections 2, 17, 5, 21)**  
  - Step 1: Real conflict (Section 2: "later sections govern" vs. Section 17: "nothing overrides Section 5"; Section 5 and 21 conflict).  
  - Step 2:  
    - Specificity: Section 17 is narrower (protects one section) → Governs Section 2 (general recency).  
    - Hierarchy: Section 17 shields Section 5 → Section 5 cannot be overridden.  
    - Recency: If Section 21 is later than 17, but Section 17 protects Section 5 → Section 21 cannot override.  
  - **Outcome:** Section 5 wins. Section 21 is ignored.  
    - **Judgment call:** Assuming Section 17 is "specific" is a judgment.  

  **Example 3: Residency Definitions**  
  - Step 1: Real conflict (Definition 1: applicant qualifies; Definition 2: applicant fails).  
  - Step 2:  
    - Specificity: If one definition is tied to a grant type (e.g., rent vs. medical), use the relevant one. Else, unresolved.  
    - Recency: If one section is later, apply it.  
  - **If unresolved → Step 3:** Human judgment.  
    - **Unsafe move flagged:** Panelist’s "not resident under Definition 2 → decline" uses disjunctive syllogism. **Do not allow.**  
  - **Outcome:** Likely a real conflict → Panel decides by values (e.g., "Use inclusive definition to maximize aid").  

  **Which answer won’t you like?** Example 1 could force disclosure, contradicting your prior practice.  

  ---

  ### **Theoretical Answers**  
  - **Dialetheism vs. Paraconsistency:**  
    - You only need **paraconsistency** (handling contradictions without explosion). Dialetheism (true contradictions) is philosophical overkill here.  
    - **What survives translation:**  
      - Core idea: *Isolate contradictions* → Use Step 2 (standard moves) for resolvable issues, Step 3 (values) for true deadlocks.  
      - Avoid logical explosion → Ban unsafe moves (e.g., disjunctive syllogism).  
    - **What to drop:** Truth-values, formal semantics. Focus on conflict *classification* and *procedural triage*.  

  - **Limitations of the Procedure:**  
    - **Cannot:** Remove contradictions; force consistency; replace handbook revisions.  
    - **Repair loop:** Log conflicts in a tracker → Monthly volunteer proposes amendments → Full panel votes → Update handbook.  

  ---

  ### **Final Checklist**  
  1. **Max 30 mins/case:** Steps 1–3 designed for speed.  
  2. **No logic training needed:** Uses plain English (e.g., "narrow rule > broad rule").  
  3. **Appeals-friendly:** Documented reasons show objective process.  
  4. **Values transparency:** Applicants see the conflict and rationale.  
  5. **Fits 2 pages:** This procedure is <1.5 pages; add your handbook snippets as appendices.  

  **Key judgment calls:** Specificity tests, recency order, and all value choices in Step 3. Mitigate by:  
  - Training panelists on "narrow vs. broad" examples.  
  - Voting anonymously in Step 3.  
  - Tracking conflicts for future handbook fixes.  

  This system prevents arbitrary decisions while acknowledging the handbook’s flaws. Over time, the repair loop will reduce contradictions.
