  - A's "evidential value" isn't part of the strict procedure (only direct expected gain counts)
  - B's lack of treatment impact is irrelevant per procedure
  - C's claim about bee-locust similarity doesn't change current credences

  The only contested evidence might be the locust credence (0.002 vs bee's 0.0005), but the user provided these numbers, so I must use them as given.

  Final ranking: B > A > C  
  Allocation: B ~99.993%, A ~0.005%, C ~0.002%  
  With dollar amounts: B $1,998,600, A $100, C $300 (using exact fractions)  
  I need to ensure the percentages sum to 100%.

  Exact calculation:
  Total EW = 100,000,000,000,000 + 5,000,000,000 + 2,000,000,000 = 100,007,000,000,000
  - B: 100,000,000,000,000 / 100,007,000,000,000 = 100,000/100,007 ≈ 0.999930
  - A: 5,000/100,007,000 ≈ 0.000049997 ≈ 5e-5
  - C: 2,000/100,007,000 ≈ 0.000019999 ≈ 2e-5

  So percentages:
