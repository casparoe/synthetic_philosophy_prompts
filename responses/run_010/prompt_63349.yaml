  First, I'll gather all the data from the query:

  - Program A: Honeybees
    - Insects affected: 10^13
    - Credence: 0.0005
    - Expected welfare gain = 10^13 × 0.0005 = 5 × 10^9

  - Program B: Houseflies
    - Insects affected: 10^15
    - Credence: 0.0001
    - Expected welfare gain = 10^15 × 0.0001 = 1 × 10^14

  - Program C: Locusts
    - Insects affected: 10^12
    - Credence: 0.002
    - Expected welfare gain = 10^12 × 0.002 = 2 × 10^9

  Now, calculating the expected welfare gains:

  - A: 10^13 × 0.0005 = 5,000,000,000 (5e9)
  - B: 10^15 × 0.0001 = 100,000,000,000,000 (1e14)
  - C: 10^12 × 0.002 = 2,000,000,000 (2e9)

  Ranking them by these values:
  1. B: 1e14
  2. A: 5e9
  3. C: 2e9

  The total expected welfare gain across all programs is B + A + C = 1e14 + 5e9 + 2e9 ≈ 1.000007e14. Since B dominates (100 trillion vs. billions), the fractions for budget allocation would be:

  - B: ~1.000000e14 / 1.000007e14 ≈ 0.999993
  - A: ~5e9 / 1.000007e14 ≈ 0.000005
  - C: ~2e9 / 1.000007e14 ≈ 0.000002

  Rounding these for practical allocation:
  - B: 99.9993% → effectively 100% when rounded to whole percentages, but precisely 1 - (7e-6) 

  But since the budget is $2 million:
  - B gets $2,000,000 × (1e14 / total) ≈ $1,999,986
  - A gets $2,000,000 × (5e9 / total) ≈ $10
  - C gets $2,000,000 × (2e9 / total) ≈ $4

  So symbolically:
