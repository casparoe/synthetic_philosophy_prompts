prompt: |-
  Over the past few months I have been assembling a list of decision problems in the family of Hofstadter's superrationality experiments — the Platonia dilemma, the Luring Lottery he ran in his *Scientific American* column, and the prisoner's-dilemma variations built around them — and recording what I would actually do in each before constructing any justification for it. I have come to distrust the justifications more than the verdicts, so what I want is the principle, if there is one, that generates the pattern; and where there is not, a candid statement of which verdicts have to be given up. Mine are as follows, in roughly the order I settled them.

  1. *Platonia.* As I remember the set-up, twenty people, isolated and unable to communicate, each decide whether to send a telegram saying yes; if exactly one sends it that person wins an enormous prize, and if none sends or more than one sends, nobody wins anything. Verdict: I should not send. I hold this uneasily, since the superrational argument seems to cut both ways — if all twenty reason as I do and all conclude send, we get nothing, and if all conclude do not send, we likewise get nothing — and since the move I find attractive, sending with probability one in twenty, looks like a wholly different kind of reasoning smuggled in.

  2. *Luring Lottery.* A magazine offers a prize to one postcard drawn at random from those its readers mail in, the odds for each entrant falling as entries rise. Verdict: do not send. The readership runs to millions and only a handful of them reason as I do, so my postcard cannot be assumed to be mirrored.

  3. *Exact duplicate.* A one-shot prisoner's dilemma against a copy of me with my memories and my reasoning. Verdict: cooperate, firmly.

  4. *Similar stranger.* The same game against someone I have never met, described to me only as thoughtful, well informed, and given to working things through in something like my way. Verdict: cooperate — but noticeably less firmly than in 3, and I cannot say what that difference in firmness is tracking.

  5. *Known defector.* The same game against a straightforward maximiser of their own payoff who has said in print that they always defect in one-shot games. Verdict: defect, without qualms.

  6. *Accurate but unlike predictor.* Newcomb-style problems, and the stranded hitchhiker whom a driver will rescue only if the driver can read in their face that the promise to pay later will be kept. Verdict: take the correlated action — one box; promise, and then pay — although there is no symmetry of reasoning between us whatever. The predictor is not my twin and does not think as I do; it is merely right about me. This is the verdict I can least square with 5: there I refused to treat the other's decision as tracking mine because the other was unlike me, and here unlikeness makes no difference at all.

  7. *Voting.* A national election in which my preferred candidate wins comfortably whether or not I vote. Verdict: vote anyway, for essentially the superrational reason that if everyone relevantly like me concluded it made no difference, none of us would vote. Yet the others are not thinking about my thinking; most are barely thinking about the election.

  8. *Threshold appeal.* A public-good fundraiser. When the organiser announces the target has been met by other donors, I do not give; when they announce that the target is far off and that people of my sort are the only likely source, I do give. The two situations differ in how many others give, not in how anyone reasons, so I suspect my verdicts here are tracking my own marginal causal impact — precisely the quantity I claim to ignore in 7.

  9. *Duplicate with different information.* A copy of me in every respect who has been told the game is played ten times, while I have been told it is played once. Verdict: he is not my mirror, and I should follow the reasoning appropriate to my own information. I dislike this: nothing but information separates us, and if information can break the mirror, I do not see why the millions of readers in 2 could not be argued back into it.

  10. *Identical twin, unlike reasoning.* My twin, who shares my genes and history but is far more impulsive. Verdict: defect. So what matters seems to be similarity of reasoning process rather than similarity of person — which is just what 6 then contradicts.

  11. *The one I flip on.* A one-shot dilemma against an artificial agent that models me very accurately but whose own reasoning I cannot follow at all. Cooperate or defect? I have gone back and forth a dozen times, and I am equally unsure whether one ought in general to cooperate with probability equal to the fraction of one's opponents who reason as one does — a formula with nothing to recommend it but its tidiness.

  What I should like, in British English, is this. First, state one principle — or, if these verdicts cannot live under a single roof, a small set of candidate principles — precisely enough that a competent reader could apply it to a case description without further interpretation: what enters the calculation, how the reference class of those who reason as I do is fixed and its size and composition estimated, and what the decision rule itself is. Second, for each clause, say which of my cases motivates it and what that clause accomplishes that a simpler rule cannot. Third, identify the verdicts the principle fails to deliver, and choose explicitly between a complex principle that saves all of them and a simpler one that overturns one or two, saying which you prefer and what the loss amounts to. Fourth, apply the principle to cases I have not listed: a Platonia-style contest in which the twenty know one another's reasoning intimately; a lottery of the Luring kind restricted to a small reading group all of whom reason as I do; a dilemma against an agent that simulates me accurately but systematically reverses my conclusion on one point; and a threshold public good ten per cent short of provision with a thousand people relevantly like me. Fifth, say whether what you end up with is anything more than a familiar view in disguise — evidential decision theory with a restricted reference class, causal decision theory with a prior over the other's similarity to me, team reasoning in Bacharach's sense, a Kantian universalisation test — and in particular whether the superrational assumption that like reasoners arrive at like answers does any work beyond ordinary conditionalisation on my own reasoning type.

  Please also state how confident you are in the main claims you make, and single out the one point in your answer about which you are least sure. If any of the set-ups as I have described them are garbled, since I am working partly from memory of the originals, say so and give your answer on the corrected version.
reasoning: |-
  Hmm, this is a fascinating and complex query about decision theory and superrationality. The user presents 11 carefully considered scenarios with their intuitive verdicts, highlighting tensions between cases. They're clearly deeply engaged with Hofstadter's ideas but frustrated by inconsistencies in their own judgments.

  First I need to recognize the core challenge: the user wants a unifying principle that explains all their verdicts without special pleading. Their discomfort with justifications suggests they've hit the limits of standard decision theories. The cases systematically probe where "like reasoning" does and doesn't create obligations toward coordination.

  Looking at the verdicts, I notice three patterns emerging:
  - When reasoning is identical (case 3) or highly predictable (6), they cooperate
  - When reasoning differs fundamentally (5,10) or scale breaks symmetry (2), they defect/abstain
  - But voting (7) and threshold cases (8) show inconsistency about causal impact

  The key tension between cases 6 and 5 is particularly telling. Why treat an accurate predictor as reason to cooperate but a known defector as reason to defect? This suggests their intuition cares more about outcome correlation than reasoning similarity per se.

  For the unified principle, I'm considering an evidential approach with dynamic reference classes. The reference class would be defined by decision-relevant similarity (not just reasoning style), and we'd use Bayesian updating when given evidence about others' types. This handles:
  - Platonia (1) via low coordination probability
  - Luring Lottery (2) via scale effects
  - The predictor case (6) via correlation evidence

  But I'm least confident about case 11 (AI opponent). A probabilistic approach feels right but the "fraction of like reasoners" formula seems arbitrary. Maybe it's better to frame it as uncertainty about being in the reference class.

  For new cases:
  - Small-group Platonia would flip to "send" due to higher coordination probability
  - The reversed-conclusion AI might still warrant cooperation if the reversal isn't decision-critical

  The resulting view resembles evidential DT but with context-sensitive reference classes - which avoids the voter's paradox while acknowledging scale effects. Still, the tension between causal and evidential thinking in voting vs. fundraising remains somewhat unresolved.
answer: |-
  Below is a systematic attempt to resolve your verdicts under a unified principle, addressing all five requests. The core tension—between **evidential reasoning** (acting as evidence for others' actions) and **causal independence** (no direct influence)—emerges as central. Your judgments suggest a hybrid approach where similarity of *decision-relevant properties* determines when evidential reasoning applies.

  ---

  ### **The Principle: Evidential Cooperation with Dynamic Reference Classes (EC-DRC)**  
  **Decision Rule:**  
  *Cooperate (or act to coordinate) if and only if:*  
  - The other agent(s) share your **decision-relevant properties** (DRPs: reasoning process, goals, information, or predictive correlation), *and*  
  - Conditional on your action, the probability of successful coordination/cooperation exceeds its cost-adjusted threshold.  

  **Key Mechanics:**  
  1. **Reference Class Definition:**  
     - DRPs are context-dependent traits that determine whether your action *evidentially signals* similar actions by others.  
     - E.g., In Platonia, DRP = reasoning method; in Newcomb, DRP = predictive correlation.  
     - Size estimation: Use prior knowledge (e.g., "millions" in Luring Lottery) or default to causal reasoning if DRP-sharing is unlikely.  
  2. **Probability Calculation:**  
     - Estimate \( P(\text{success} | \text{your action}, \text{DRP-sharing}) \) using symmetry: if all reason alike, they likely act alike.  
     - Threshold: Cooperate if \( P(\text{success}) \times \text{benefit} > \text{cost} \) (e.g., voting fails this; threshold appeal passes when close).  
  3. **Fallback to Causal Reasoning:**  
     - If DRP-sharing is absent (e.g., Known Defector) or too diluted (e.g., Luring Lottery), maximize causal payoff.  

  ---

  ### **Clause Motivation & Advantages Over Simpler Rules**  
  | Clause                          | Motivated By          | Advantage Over Simpler Rules |  
  |---------------------------------|------------------------|------------------------------|  
  | **DRP-Sharing Condition**       | Cases 3,5,6,10        | Avoids contradictions: CDT fails Case 6 (Newcomb); EDT fails Case 5 (Known Defector). |  
  | **Probabilistic Threshold**     | Cases 1,7,8           | Explains voting/threshold asymmetry: 7 fails threshold, 8 passes. Solves Platonia's stalemate. |  
  | **Causal Fallback**             | Cases 2,5             | Handles scale (Luring Lottery) and adversarial agents (Known Defector). |  

  ---

  ### **Verdicts EC-DRC Delivers vs. Fails**  
  - **Saves:** Cases 1 (no send), 2 (no send), 3 (coop), 5 (defect), 6 (one-box), 8 (give), 10 (defect).  
    - *Case 1:* DRP-sharing exists, but \( P(\text{exactly one "yes"}) \approx 0 \) → causal abstention.  
    - *Case 6:* Predictive correlation is a DRP → one-box despite no reasoning symmetry.  
  - **Overturns:**  
    - *Case 4 (Similar Stranger):* EC-DRC says **defect**. DRP-sharing is plausible but unconfirmed → causal reasoning dominates. *You lose:* Intuitive but weak cooperation impulse.  
    - *Case 7 (Voting):* EC-DRC says **don’t vote**. DRP-sharing diluted (most voters don’t reason like you), and \( P(\text{swing vote}) \approx 0 \) → fails threshold. *You lose:* Superrational impulse to vote.  
    - *Case 9 (Different Info):* EC-DRC says **defect** (no DRP-sharing due to information asymmetry). *You lose:* Desire to mirror your duplicate.  
  - **Ambiguous:** Case 11 (AI Agent) → Apply probabilistic cooperation: \( P(\text{coop}) \approx \text{model accuracy} \).  

  **Preferred Tradeoff:** Overturn 4,7,9 for simplicity. Losses are marginal (weak intuitions) and preserve core cases. Complex alternatives (e.g., adding "partial DRP-sharing") create vagueness.  

  ---

  ### **New Case Applications**  
  1. **Small-Group Platonia (20 DRP-sharers):**  
     - \( P(\text{exactly one "yes"}) \) is high if all use symmetric mixed strategy → **Send with prob. 1/20**.  
  2. **Small Luring Lottery (Reading Group):**  
     - DRP-sharing confirmed → **Send postcard** (evidential reasoning applies).  
  3. **AI with Reversed Conclusion:**  
     - Lacks DRP-sharing (reasoning differs systematically) → **Defect**.  
  4. **Threshold Public Good (90% funded, 1000 like-me donors):**  
     - DRP-sharing + \( P(\text{success} | \text{you give}) \gg 0 \) → **Give**.  

  ---

  ### **Relationship to Existing Theories**  
  EC-DRC is **evidential decision theory (EDT) with a dynamic reference class**, not fixed by identity or abstract rationality.  
  - **Superrationality’s Role:** It *generalizes* Hofstadter’s insight: "Like reasoners act alike" is a heuristic for DRP-sharing, but EC-DRC adds:  
    - Correlation over identity (saving Newcomb).  
    - Probabilistic thresholds (saving voting/threshold paradoxes).  
  - **Not Team Reasoning:** No group payoff maximization; individual payoff dominates (e.g., you defect with impulsive twin).  
  - **Not Kantian/Knobe:** Focuses on evidence, not universalization (e.g., Known Defector requires no universal rule).  

  ---

  ### **Confidence & Least Sure Claim**  
  - **90% Confident:** Core framework resolves 8/11 cases cleanly and handles new cases.  
  - **60% Confident:** Overturning your voting verdict (Case 7). The "causal impact" intuition is strong, but EC-DRC’s threshold rule better aligns with your other judgments (e.g., Luring Lottery).  
  - **Corrected Setup:**  
    - *Platonia:* Your description matches Hofstadter.  
    - *Luring Lottery:* Clarify—odds fall *per entrant* as entries rise (you’re correct).  

  ---

  ### **Summary**  
  Your verdicts arise from **evidential reasoning when decision-relevant properties are shared**, **causal reasoning otherwise**, with a **probabilistic threshold for coordination**. This hybrid:  
  1. Explains your unease in Platonia (low \( P(\text{success}) \)).  
  2. Justifies treating Newcomb (6) and Known Defector (5) differently (predictive correlation vs. reasoning mismatch).  
  3. Overturns weak-cooperation cases (4,7,9) for consistency.  

  The superrational "like reasoners, like acts" assumption *initiates* evidential reasoning but isn’t sufficient—it requires measurable success probability and contextual DRPs. What you’ve built is a sophisticated, pragmatic EDT variant.
