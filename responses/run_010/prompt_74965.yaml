answer: |-
  ## Sestina of the Broken Spheres

  The **sun** first rose, a wanderer in gold,
  Beside the silver **moon**, both circling near.
  Our anchored **earth**, the center, held its ground,
  While distant **star**-fixed lights adorned the dome
  Of crystal **heaven**, perfect and profound.
  Five paths: those lights called **planet** made their rounds.

  The **moon** drew close, its phases clear to see,
  While farther out, the stately **sun** held sway.
  Each **planet** traced its complex, loopy dance
  Against the fixed array of distant **star**,
  All framed within the turning wheel of **heaven**.
  The firm foundation? Solid, central **earth**.

  But wait... that **earth**, does stillness hold it fast?
  Why should the **moon** alone embrace our sphere?
  What if that brilliant, blazing central **sun**
  Itself commanded motion? Could the **star**
  Be kin to that bright fire? Does **heaven** turn,
  Or is each **planet** freed from ancient tracks?

  Now see the **star**: that sun, no longer bound
  As just another bright, meandering **planet**!
  It holds the center, fixed, a burning core.
  The **earth** itself now spins, a wandering sphere,
  No longer base, but kin to swift **moon**’s flight,
  All moving through the vast, receptive **heaven**.

  The **heaven** sheds its shells; the vault dissolves.
  No crystal spheres constrain the drifting **star**,
  Nor guide the **planet** (earth now joins their band!),
  Nor dictate pace to swift, familiar **moon**.
  One law now governs **sun** and stone and dust,
  No longer is our place unique **earth**.

  What marks a **planet**? Lines are redrawn here.
  The **sun** ascends, a sovereign, central **star**.
  The **moon** descends, mere captive of the **earth**.
  The **earth** departs, a traveler through the dark.
  Old **heaven** cracks; the frame itself gives way.
  Fixed points? Now just the far, indifferent **star**.

  The **star** endures, a measure in the deep.
  The **earth** now *is* a **planet**, cold and swift.
  The **moon** remains a shade, reflecting light.
  The **sun** commands the dance, the source of sight.
  Old **heaven**? Just the space where motions weave.
  The **planet** class expands: five paths, then six? (Now eight?)

  *(Envoi)*

  Two lists: bright **sun**, dark **earth**, swift **moon**, fixed **star**,
  Named **planet** shifting, boundless **heaven**'s scope.
  No simple map aligns their kindred terms –
  The words return, but worlds have rearranged.
  You learn the other list, compare the skies,
  But cannot carry *this* world whole across.
