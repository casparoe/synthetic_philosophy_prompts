answer: |-
  ### Quiz: Freedom in Algorithmic Governance  
  *For each scenario, select the statement that best reflects your view. Answer based on your immediate intuition, not theory.*

  1. **Credit Algorithm**  
     A credit-scoring model has the standing power to deny you loans, but because you’re in the top 10% of scorers, it has never done so. You depend on it for low-interest financing.  
     - A) You remain free because you face no actual loan denials.  
     - B) You are unfree because the model’s power means you live at its mercy.  
     - C) This isn’t about freedom; it’s about reliability or risk.

  2. **Workplace Monitoring**  
     Your employer’s software logs all digital activity but only reviews logs if a pre-set flag (e.g., excessive idle time) is triggered. Review decisions are solely at the employer’s discretion.  
     - A) You are free because no one examines your data without cause.  
     - B) You are unfree because the employer holds arbitrary power over surveillance.  
     - C) The core issue is privacy, not freedom.

  3. **Traffic Rerouting System**  
     A city’s algorithm continuously redirects your car around congestion toward destinations you genuinely want to reach, saving you time and fuel. Participation is mandatory for road access.  
     - A) You are freer because the system helps you achieve your goals.  
     - B) You are just as free (or less) because your route is controlled by the system.  
     - C) This expands your effective choices without altering your freedom.

  4. **Platform Storefront**  
     You operate a store on a platform that could remove it tomorrow with or without cause. Rules were set without your input, and you hold no role in appeals.  
     - A) You are free because you voluntarily agreed and haven’t been removed.  
     - B) You are unfree because the platform wields arbitrary power over your livelihood.  
     - C) This concerns contract enforcement, not freedom.

  5. **Immigration Discretion**  
     A caseworker has broad power to deny your visa renewal but has approved all applications to date, including yours multiple times.  
     - A) You are free because you’ve never been denied.  
     - B) You are unfree because the caseworker could arbitrarily reject you anytime.  
     - C) Freedom is irrelevant; this is about procedural fairness.

  6. **Digital Wallet**  
     The state issues a digital wallet for benefits/payments it could freeze. You hold a full democratic vote to elect the officials controlling the system.  
     - A) You are free because you help choose who governs the power.  
     - B) You are unfree because the state retains the capacity to freeze assets.  
     - C) This is about democratic legitimacy, not freedom itself.

  7. **Household Income Control**  
     One partner controls all household income but has never refused any request for funds. You fully trust them.  
     - A) You are free because you get what you want without hindrance.  
     - B) You are unfree because you depend entirely on their goodwill.  
     - C) This is about relationship equality, not freedom.

  8. **Poverty and Movement**  
     You are legally free to travel anywhere but cannot afford to leave your town, even briefly, due to extreme poverty.  
     - A) You are free because no one interferes; poverty is a separate barrier.  
     - B) You are unfree because you cannot actually exercise your right to leave.  
     - C) This highlights economic injustice, not unfreedom.

  9. **Predictive Policing**  
     A policing algorithm you helped design—setting error thresholds via community input—now constrains your actions (e.g., by directing patrols in your neighborhood).  
     - A) You are free because you co-created the rules.  
     - B) You are unfree because you remain subject to external control.  
     - C) This demonstrates participatory governance, not freedom.

  10. **Dormant Law**  
      An unenforced statute criminalizes an activity you do weekly. No enforcement has occurred in 50 years, and only an unresponsive legislature can repeal it.  
      - A) You are free because you face no enforcement.  
      - B) You are unfree because the state could arbitrarily punish you.  
      - C) The problem is rule-of-law decay, not freedom.

  ---

  ### Scoring Key  
  **How to score:** Tally your responses using the table below. Each leaf (theory) corresponds to a specific combination of answers. Items 4 and 6 are tie-breakers for closely related views. After identifying your leaf, read its "awkward commitment" to test your alignment.  

  | Leaf (Theory)                     | Expected Response Pattern                                   | Tie-Breaker Items | Most Awkward Commitment |
  |-----------------------------------|-------------------------------------------------------------|-------------------|-------------------------|
  | **Berlin-style non-interference** | A for all items except 3B, 8B; C for 3,8 if chosen.         | —                 | You must deny that unexercised capacities (e.g., Item 1) reduce freedom, even when they create palpable insecurity. |
  | **Neo-Roman non-domination**      | B for 1,2,4,5,7,10; A for 3,6,9 if chosen; C for 8 if chosen. Splits on private power: B for 1,2,4,7 (private) is common; some exclude private. | Item 4: B required | You must accept that poverty (Item 8) is not itself unfreedom—only the risk of arbitrary power matters—which can seem callous toward material deprivation. |
  | **Kantian independence**          | B for 1,2,4,5,7,10; A for 6; C for 3,8,9. Differs from neo-Roman on private power: often B for 1,2,4,7 but A for 6. | Item 4: B required | You must argue that democratic control (Item 6) eliminates unfreedom even if state power remains, which can feel like a formalistic dodge of real constraints. |
  | **Positive liberty**              | A for 3,6,9; B for 8; C for 1,2,4,5,7,10.                  | —                 | You must treat coercive systems (e.g., Item 3) as freedom-enhancing if they "guide" you toward true interests, risking paternalism. |
  | **Capability/effective freedom**  | B for 3,8; A for 6,9 if chosen; C for 1,2,4,5,7,10.        | Item 3: B required | You must claim resources (e.g., Item 8) directly constitute freedom, which can blur the line between freedom and other goods like welfare. |
  | **Deflationary view**             | C for all items except 3C, 8C, 9C; A or B only if C absent. | —                 | You must insist that domination (e.g., Item 7) is merely a "justice problem," denying that freedom is a distinct value—which can make everyday unfreedom invisible. |

  **Tie-Breaker Notes:**  
  - **Item 4 (Platform Storefront):** Distinguishes non-domination from Kantian independence when both say "unfree" (B). Neo-Roman focuses on *arbitrary* private power, while Kantian focuses on *subjection* to any private choice. If you chose B here, you lean neo-Roman if you also see discretionary power as arbitrary (e.g., B in Item 2); Kantian if you emphasize dependence alone (e.g., A in Item 6).  
  - **Item 6 (Digital Wallet):** Distinguishes republicanism from capability. Neo-Roman requires A (democracy removes domination), while capability often takes B or C (resources/control matter more). If you chose A, you likely align with neo-Roman; if B/C, you blur with capability.  

  **Unoccupied Cells (Diagnosis):**  
  1. **A for 1,2,5 + B for 3,8 + C for 4,6,7,9,10:** Combines non-interference (A for unexercised power) with capability (B for poverty/traffic control) but rejects democracy (C for Item 6). *Diagnosis:* Incoherent—it inconsistently demands non-interference for power relations but resource-sensitive freedom for constraints, ignoring how democracy mediates both.  
  2. **B for 1,2,4,5,10 + A for 6 + B for 8:** Mixes neo-Roman (B for arbitrary power) with Kantian (A for democratic control) and capability (B for poverty). *Diagnosis:* Unattractive—it simultaneously demands robust non-domination *and* treats resources as freedom, creating a hyper-vigilant view where almost all constraints (even beneficial ones like Item 3) become unfreedom.  
  3. **C for all items:** Pure deflationary view. *Not unoccupied, but adjacent:* **C for 1-7,9-10 + A for 8** (poverty as unfreedom but no other cases) is unexplored. *Diagnosis:* Unexplored—it arbitrarily singles out poverty as freedom-reducing while dismissing all other constraints as non-freedom issues, offering no principled criterion.  

  ---

  **Word Count:** Quiz (scenarios + options): 970 words. Scoring key: 830 words. Total: 1800 words.  

  **Design Notes:**  
  - **Probed Axes:**  
    - Unexercised capacity (Item 1) tests if non-interference requires actual interference.  
    - Interference tracking interests (Item 3) examines if "benign control" still dominates.  
    - Source (will) vs. effect (options): Items 1–2,4–5,7,10 (source) vs. Items 3,8 (effect).  
    - Resource shortfalls: Item 8 separates "obstacle" (non-interference) from "unfreedom" (capability).  
    - Domination without agent: Items 1 (algorithm) and 10 (statute) test systemic vs. agential domination.  
    - Having a say: Items 6 and 9 probe if participation removes domination (neo-Roman) or not (others).  
    - Democracy: Item 6 isolates if it constitutes freedom (neo-Roman/Kantian) or is instrumental (capability/deflationary).  
  - **Tie-Breakers:** Item 4 (private power) and Item 6 (democracy) address the predicted blur between non-domination/Kantian and republicanism/capability.  
  - **Primary Literature Paraphrased:** Berlin (non-interference), Pettit (neo-Roman), Ripstein (Kantian), Green/Marx (positive liberty), Sen/Nussbaum (capability), Shklar (deflationary).
