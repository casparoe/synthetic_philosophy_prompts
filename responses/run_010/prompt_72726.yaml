prompt: |-
  I sit on the grants panel of a mid-sized city's community foundation, and our program has a weird legacy clause. The original donor was a Rousseau reader, and the trust deed says the money is for spectacles in which the citizens themselves are the performers, and explicitly not for entertainment that turns them into an audience. Everyone on the panel has been treating that as a mood rather than a rule, and we loose more time arguing about what the donor meant than actually reading applications. We get about 40 a cycle, two cycles a year, each read by two panelists with twenty minutes apiece, and only one of us has any arts training. The executive director signs off and applicants can appeal, so whatever we write down has to survive being read back to us later.

  What I want is a procedure my panel can actually run on an application, built out of what Rousseau argued in the Letter to d'Alembert — his long reply to d'Alembert's Encyclopédie entry on Geneva, where d'Alembert floated the idea of a theater there and Rousseau said Geneva should have open-air public festivals instead. Not a summary of him; the working rule set. So: the questions to ask in order, what counts as a sufficient answer to each, which questions can end the review with a no, and where the procedure has to stop and hand the decision to a person because it's a question of values rather than anything we can look up in the file.

  A few things it specifically needs to get right. Rousseau's charge isn't that plays are badly made, it's that they can't change anybody — they take the dispositions an audience already has and give them a pleasant workout, and a playwright who wants to sell tickets has to flatter the room, so the satire always lands on someone the audience was already happy to see mocked. He works that out at length on Molière's Misanthrope, and the argument generalizes. If that's really the argument, then a big chunk of what our applicants promise (this show will change how people here think about X) fails for a reason that has nothing to do with the quality of the show, and the procedure needs a separate track for that case rather than letting it sneak in as artistic merit. Also: what he objected to was the asymmetry between the few who perform and the many who sit in the dark, plus the money and hours that costs and who is priced out of both — not participation as a warm feeling. Define that asymmetry in terms two tired volunteers can check against an application form, and say what evidence in a file would settle it either way.

  Then run it on three of ours: an acclaimed fringe company touring a satire of our own city council to six neighborhood halls; an annual street dance and cook-off, free, no stage, anyone can enter, which our arts-trained panelist thinks is amateur rubbish; and a community musical with an all-local amateur cast, a professional director, and thirty-dollar tickets in a proper theater. If the first one comes out a no, say so plainly — it's the best work we fund and I'd rather find that out now than in an appeal.

  Last thing, be straight about what doesn't survive the trip. Some of his reasons are unusable for us, the stuff about the acting profession as a trade and about women on the stage, and I want the procedure to say it's quarantining those rather than quietly dropping them. Tell me which of his underlying commitments the rest of the procedure is leaning on without admitting it, which distinction would break if we simplified it, where it's going to misfire in practice, and what it simply cannot decide.
reasoning: |-
  Okay, let me unpack this complex grant panel dilemma. The user sits on a community foundation panel struggling with a Rousseau-inspired trust clause favoring citizen-performed spectacles over passive audiences. They need a practical decision procedure rooted in Rousseau's Letter to d'Alembert, not philosophical summaries.

  First, I need to grasp the core conflict: panelists treat the clause as a vague "mood" rather than operational rule, causing gridlock. The user wants concrete questions that:
  - Objectively measure Rousseau's key asymmetry critique
  - Block "this show will change minds" claims as structurally flawed per Rousseau
  - Survive executive review and appeals
  - Explicitly quarantine Rousseau's problematic views (e.g., on women actors)

  Key Rousseau principles from the text:
  1. Anti-asymmetry: Rejects performer/audience hierarchy
  2. Anti-mimesis: Art that merely exercises existing prejudices can't transform
  3. Accessibility: Cost/location barriers contradict communal spirit
  4. Communal self-expression > professional artistry

  The procedure must nail three test cases:
  1. Professional satire tour (likely fails asymmetry)
  2. Open street festival (should pass despite amateur quality)
  3. Community musical (ticket cost/structure problematic)

  Biggest challenges:
  - Operationalizing "asymmetry" into checkable criteria (ticket prices? rehearsals? stage height?)
  - Creating a kill switch for "social change" claims that Rousseau would reject
  - Flagging where human judgment must intervene (e.g., "is this flattery?")
  - Admitting which Rousseau elements get discarded (gender bias) and why

  I'll structure it as a flowchart with:
  - Hard stops (e.g., paid tickets over $X)
  - Weighted criteria (e.g., barrier-free participation)
  - Judgment zones with guidance (e.g., "does satire target outsiders?")
  - Explicit quarantine of untenable arguments

  For the test cases:
  - The satire tour fails on asymmetry despite artistry
  - The street festival passes despite amateurism
  - The musical struggles with cost/professional director

  Must emphasize what the procedure can't decide:
  - Artistic merit (irrelevant per Rousseau)
  - Whether flattery exists (requires panel debate)
  - "Good enough" participation thresholds

  Finally, confess where we're bending Rousseau:
  - Using professional facilitators (he'd object)
  - Ignoring his gender moralism
  - Allowing some structure (he wanted pure spontaneity)

  The goal is a document that survives appeals by being ruthlessly consistent to Rousseau's operable principles while jettisoning the incompatible ones.
answer: |-
  Here's a procedural framework for your grants panel, built from Rousseau's *Letter to d'Alembert* core arguments, designed for operational use by non-experts. It quarantines his untenable positions, defines objective tests for asymmetry, and blocks "social change" claims that contradict Rousseau's critique of theater. The procedure prioritizes **structural factors** over artistic intent or quality.

  ---

  ### **ROUSSEAU-TEST PROCEDURE: 5 DECISION STEPS**
  *(Total time: 15 min/application; hard stops at Steps 1-3)*

  **STEP 1: ASYMMETRY OF PARTICIPATION**  
  *Question:* **Can any attendee become a performer/spontaneously join the activity without prior selection?**  
  - *Sufficient YES:* No physical barrier (stage/ropes), no required auditions/rehearsals, no skill prerequisite stated. Free entry.  
  - *Sufficient NO:* Fixed performers/audience separation (seated audience vs. stage/performance zone), ticketed entry, curated performers.  
  - *Hard Stop:* If NO → REJECT. *Rousseau Reason:* Creates passive spectatorship hierarchy.  
  - *Evidence Check:* Application descriptions/photos of venue layout, ticket policy, participant selection process.

  **STEP 2: FINANCIAL/CULTURAL BARRIERS**  
  *Question:* **Is the event free and scheduled outside working hours?**  
  - *Sufficient YES:* Zero cost to attend/participate; occurs on weekend/public holiday/evening.  
  - *Sufficient NO:* Any ticket/participation fee >$5; weekday daytime hours.  
  - *Hard Stop:* If NO → REJECT. *Rousseau Reason:* Excludes working citizens; commodification corrupts communal purpose.  
  - *Evidence Check:* Budget (revenue section), event timing in proposal.

  **STEP 3: PROFESSIONAL CURATION**  
  *Question:* **Are >50% of lead organizers/performers unpaid community volunteers?**  
  - *Sufficient YES:* Staff/contractor costs <20% budget; key roles filled by open volunteer sign-up.  
  - *Sufficient NO:* Paid artistic director, performers, or writers; "professional facilitation" without open roles.  
  - *Hard Stop:* If NO → REJECT. *Rousseau Reason:* Expertise entrenches inequality; citizens must own the expression.  
  - *Evidence Check:* Budget (personnel costs), organizer/participant bios.  

  **STEP 4: ANTI-FLATTERY ASSESSMENT** (Judgment Zone - Values Decision)  
  *Question:* **Could this activity reinforce existing local prejudices?**  
  - *Guidance:* Satire/criticism targeting *external* groups (e.g., national politicians) or *abstract* concepts likely flatters local biases. Targeting local power figures/established norms requires evidence of broad community co-creation (e.g., themes voted on by residents).  
  - *Decision:* Panel debates using: Application text on themes/targets, community engagement process. If unclear → escalate to full panel vote.  
  - *Rousseau Reason:* Theater cannot challenge audiences; it mirrors their prejudices for profit/applause.  

  **STEP 5: COMMUNAL SELF-REPRESENTATION** (Judgment Zone)  
  *Question:* **Does the activity reflect the *current* cultural practices/demographics of the neighbourhoods involved?**  
  - *Guidance:* Avoid "artistic merit" debates. Focus on: Participant diversity vs. neighborhood census data, use of local traditions/vernacular. "Rubbish" is irrelevant per Rousseau.  
  - *Decision:* If representation claims are made, verify with applicant-supplied demographic data. No data → assume YES unless glaring mismatch.  

  ---

  ### **QUARANTINED ROUSSEAU PRINCIPLES**
  The procedure explicitly **excludes** these disputed elements:  
  1. **Gender Moralizing:** Rousseau's opposition to women performers is *not* applied. Participation is gender-neutral.  
  2. **Acting as Moral Corruption:** No judgment on performers' "character." Amateur/professional status is assessed only for asymmetry (Step 3).  
  3. **Spontaneity Fetish:** Rehearsals are allowed if participation is open (Step 1).  

  ---

  ### **TEST CASES RUN**
  **1. Acclaimed Fringe Company Tour (Satire of City Council)**  
  - Step 1: NO (Stage/audience separation, tickets) → **REJECT**  
  - *Why:* Fails asymmetry test immediately. *Rousseau would argue:* The satire, however sharp, flatters the audience's pre-existing cynicism about local government without transforming them.  

  **2. Annual Street Dance & Cook-Off (Free, No Stage, Open Entry)**  
  - Step 1: YES (No barriers)  
  - Step 2: YES (Free, likely weekend)  
  - Step 3: YES (Volunteer-run) → **ACCEPT**  
  - *Why:* Passes all objective tests. Artistic quality is irrelevant per Rousseau.  

  **3. Community Musical (Amateur Cast, Pro Director, $30 Tickets)**  
  - Step 1: NO (Stage/seated audience) → **REJECT**  
  - *Why:* Asymmetry and financial barriers ($30 tickets). Professional director fails Step 3.  

  ---

  ### **WEAKNESSES & FAILURE POINTS**
  1. **Leans on Rousseau’s Collectivism:** Assumes "community" is homogeneous. Struggles with events for sub-groups (e.g., immigrant diaspora festivals). *Requires panel judgment at Step 5.*  
  2. **Ignores Scale:** Rousseau idealized small-city festivals. Large events might pass technically but lose intimacy. *Procedure can’t assess this; accept if steps cleared.*  
  3. **Flattery Blindspot:** Step 4 is subjective. A skilled applicant could frame prejudice-reinforcement as "challenging" discourse. *Mitigation: Demand evidence of community co-creation.*  
  4. **Cannot Assess:**  
     - Whether an event actually *creates* community bonds (only structure).  
     - "Quality" of participation (e.g., tokenistic inclusion).  
     - Digital events (Rousseau assumed physical presence).  

  **Critical Compromise:** The procedure silently relies on Rousseau’s **anti-individualism**. It prioritizes collective expression over individual artistry. If your panel values professional craft, this will chafe.  

  ---

  ### **IMPLEMENTATION NOTES**  
  - **Appeal-Proofing:** Document *exactly* where application failed a step (e.g., "Step 1: $30 tickets create barrier"). Rousseau’s logic provides defensible rationale.  
  - **Time Saver:** Steps 1-3 take <5 min with a checklist. Focus debate on Steps 4-5.  
  - **Training:** Panelists only need to understand the 5 steps, not Rousseau’s text. Arts-trained panelist’s role shifts to verifying demographic claims (Step 5).  

  This turns Rousseau’s mood into auditable criteria. It rejects professionally competent work that creates spectators, while accepting "rubbish" that embodies his ideal of citizens celebrating themselves.
