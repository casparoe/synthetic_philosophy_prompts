  The insurance counterexample (§5) is strong. At maximal granularity with no dispersion, REU may still apply. The user's proposed exits all fail: denying linearity invites trait-based explanations, calling it irrational abandons descriptive goals, and inventing hidden dispersion is unfalsifiable. The psychological "salience" angle might help but needs development.

