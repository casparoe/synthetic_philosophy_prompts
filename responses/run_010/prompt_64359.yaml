  We are designing an activity to demonstrate information cascades (herding) without tipping off the students. The goal is to have students experience herding in a way that cannot be explained by peer pressure or a desire to fit in. We'll use a simplified version of the urn experiment (Anderson and Holt 1997) with a few key modifications to fit the constraints.

  ### Brainstorming Parameters

  1. **Signal Accuracy**:
     - We need a signal that is informative but not perfectly so. A common choice is 60-70% accuracy to make the cascade likely but not inevitable. Let's choose 2/3 (about 66.7%) for simplicity. This makes the Bayesian updating straightforward: the likelihood ratio is 2:1 for a correct signal.

  2. **Players per Table**:
     - We have 26 students and 4 tables. We can assign 6-7 students per table. Let's aim for 6 per table (24 students) and have the remaining 2 as assistants or observers (or one table with 7). However, we want the cascade to start by the third player, so 6 is enough.

  3. **State of the World**:
     - At each table, we have two urns: Urn A (with 2 blue marbles and 1 red) and Urn B (with 2 red and 1 blue). The state of the world is chosen by a fair coin flip at the beginning (by the TA) to determine which urn is in use. The urn is not revealed until the end.

  4. **What Others Are Doing**:
     - While one table is playing (i.e., going through the sequence of draws and predictions), the other students at the same table are observing and recording. The rest of the class (at other tables) can be given a worksheet to predict what will happen or to note their observations.

  5. **Preventing Show-offs and Ensuring Order**:
     - To prevent disruption and enforce order:
       - The activity is conducted in complete silence. No talking or gestures.
       - Each player is called in a fixed order (by number, assigned randomly at the start).
       - Players are separated physically: they come to a central drawing area one by one, draw a marble (without showing anyone), record their private belief and public announcement on a sheet, then announce publicly (by writing on a whiteboard visible to all) only their public prediction (e.g., "A" or "B").
       - The drawing area is supervised by the TA to ensure no communication and that the marble is drawn and replaced without being seen by others.

  6. **Bayes-Optimal Action**:
     - We want the Bayesian updating to be simple. With a prior of 0.5 and a signal of accuracy 2/3, the posterior after one signal is 2/3. After two signals of the same color, the posterior becomes (2/3 * 2/3) / ( (2/3*2/3) + (1/3*1/3) ) = (4/9) / (4/9 + 1/9) = 4/5 (80%). After two of the same, it's rational to follow your own signal only if it matches. But if the first two are the same and your signal is different, then the posterior is (prior of 4/5) * (1/3) for the signal against, and (4/5)*(2/3) for the signal with. But actually, we can compute the odds: 
       - After two blues: 
          P(A | two blues) = P(two blues | A) * P(A) / P(two blues) = (2/3 * 2/3 * 1/2) / [ (2/3*2/3*1/2) + (1/3*1/3*1/2) ] = (4/9 * 1/2) / ( (4/9 + 1/9) * 1/2 ) = (4/18) / (5/18) = 4/5.
          So if the first two are blue and you draw blue, you should vote A. If you draw red, then the posterior for A given two blues and one red is proportional to (2/3)^2 * (1/3) * 1/2 for A and (1/3)^2 * (2/3) * 1/2 for B. 
          Ratio: [ (4/9)*(1/3) ] / [ (1/9)*(2/3) ] = (4/27) / (2/27) = 2. So P(A) = 2/3. But wait, that's less than the prior after two blues? Actually, let's compute the posterior odds: 
          P(A | data) / P(B | data) = [ P(data|A) * P(A) ] / [ P(data|B) * P(B) ] = [ (2/3)^2 * (1/3) * 1/2 ] / [ (1/3)^2 * (2/3) * 1/2 ] = (4/9 * 1/3) / (1/9 * 2/3) = (4/27) / (2/27) = 2. So P(A) = 2/(2+1)=2/3. 
          Therefore, even after two blues, if you draw red, you should vote for B? But wait, that contradicts the cascade. 

     Let me reexamine the standard cascade model: In the standard model, players only observe the actions, not the signals. And they know the signal accuracy. The cascade starts when the first two agree. Then the third player, regardless of their own signal, should follow the first two because the public information (two blues) is stronger than their own signal. 

