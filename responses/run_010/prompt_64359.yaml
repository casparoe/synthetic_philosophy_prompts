     - If the number of previous A votes equals the number of previous B votes (or no history), then follow your own signal.
     - If there are two more A votes than B votes (or vice versa), then ignore your signal and vote with the majority.

     Why two? Because after two consecutive same votes, the next person should herd. 

     But note: if the votes are A, B, then the next person sees one A and one B. That's a tie. So they should use their own signal.

     So the rule: 
          If the absolute difference between the number of A votes and B votes is 2 or more, then follow the majority (ignore your signal). Otherwise, follow your own signal.

