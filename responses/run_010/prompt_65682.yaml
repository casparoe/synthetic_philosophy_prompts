  The real tension is between:
  (A) Physical indistinguishability (we can't tell particles apart) 
  (B) Ontological singularity (only one entity exists)

  QM gives us (A); Schrödinger claims (B). The leap happens when he says counting persons is like counting ripples on a pond—mistaking patterns for substances. But QM doesn't forbid counting subsystems operationally, whereas Vedānta denies their ultimate reality.

  Where the analogy snaps:
  - Superselection can't block mind multiplicity because consciousness isn't a quantum number. 
  - Decoherence explains classical perception without needing ontological unity.
  - The hard problem of consciousness remains untouched—QM describes correlates, not subjectivity itself.

  The residue? Schrödinger smuggles in Vedānta via physics poetry. The physics captures "indistinguishability" beautifully but fails to warrant "singularity." The fault isn't with the vocabulary—it's that consciousness can't be reduced to wavefunction symmetries without metaphysical overreach. 

