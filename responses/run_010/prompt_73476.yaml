  ### Round-by-Round Adjudication  
  **1. Silhouettes vs. Proportional Bar**  
  Score: **-1** (Emil has the stronger argument)  
  Hanneke's unit figures align with ISOTYPE's core principle of "one sign, one thing" (faithful to Neurath). However, Emil's point about legibility in transit settings (3m distance, 2-second attention) is empirically valid. Neurath designed for museum displays with closer viewing, not tram shelters. Hanneke's rigid adherence ignores context.  

  **2. Category Differentiation**  
  Score: **0** (Both have valid points)  
  Hanneke is faithful to Neurath: ISOTYPE *did* use identical silhouettes with color/grouping for categories (avoiding dehumanizing stereotypes). But Emil is technically right that two spot colors (+ black/grey) limit groups to three, making Hanneke's approach impractical here. Neurath used unlimited colors in prints, so her extension is defensible but constrained by budget.  

  **3. Precision vs. Coarseness**  
  Score: **+1** (Hanneke is mostly right)  
  Hanneke accurately reflects Neurath's "coarseness for impact" principle (faithful): ISOTYPE rounded figures to avoid false precision. Emil's concern about masking differences (8.97% vs. 27.3%) is valid statistically, but Neurath would prioritize memorable "1-in-9" over decimals for public communication.  

  **4. Map vs. Unit Rows**  
  Score: **-2** (Emil is clearly right)  
  Hanneke distorts Neurath: he *did* use maps when spatial patterns mattered (e.g., *Atlas of Society and Economy*). Her claim that he "distrusted maps" oversimplifies; he critiqued poorly designed ones. Emil's river-valley corridor is inherently spatial—unit figures cannot show this. Deleting the map loses critical information.  

  **5. Headline/Text Inclusion**  
  Score: **-1** (Emil has the stronger argument)  
  Hanneke is faithful to ISOTYPE's "visual autonomy" ideal (no captions needed). But Emil correctly notes this is a *policy campaign* requiring actionable steps (e.g., "Call X if affected"). Neurath’s work was explanatory, not directive; Hanneke ignores the grant’s purpose.  

  **6. Design Approach**  
  Score: **0** (Both miss nuances)  
  Hanneke is faithful about "transformers" (Neurath’s artist-scientist collaborators deciding omissions). Emil is right that modern studios can achieve this. However, "beautification" misrepresents ISOTYPE—it embraced clarity, not austerity. Neither addresses if the studio understands data transformation.  

  **7. Testing Methodology**  
  Score: **0** (Both partially right)  
  Emil is pragmatic: testing comprehension is standard for public materials. Hanneke is faithful to Neurath’s *systemic* goal of building "visual literacy" over time. But her dismissal of testing assumes long-term exposure (unlikely for one poster), while Emil ignores ISOTYPE’s pedagogical intent. No evidence settles this.  

  ---

  ### Key Overlooked Points  
  1. **Embedded Context**: ISOTYPE was designed for *guided interpretation* in museums/schools with docents, not standalone posters. Neurath assumed viewers would engage deeply, not glance while waiting for a tram. Both ignore how the medium shapes comprehension.  

  2. **Democratic Participation**: Neurath aimed to democratize data for public debate on social planning—not just accurate perception. Hanneke invokes purity but avoids discussing how the poster empowers vulnerable groups (e.g., pensioners). Emil reduces it to "comprehension," missing ISOTYPE's emancipatory intent.  

  3. **Accessibility**: Neither considers visual impairments (e.g., color blindness) or literacy barriers. Neurath prioritized universal accessibility, but spot-color limits and lack of text alternatives could exclude audiences.  

