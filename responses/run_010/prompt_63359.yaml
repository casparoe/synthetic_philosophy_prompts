    - Whether the nation depends on the state (modernism, especially administrative) or the state on the nation (primordialism, perennialism).
    - Whether a community's conviction of ancientness is constitutive (primordialism, perennialism) or false consciousness (modernism).
    - Whether everyday reproduction (banal nationalism) is more foundational than founding moments.

