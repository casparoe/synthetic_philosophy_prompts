    1. Primordialism (nations are ancient, natural, and given)
    2. Perennialism (nations are long-lasting but not necessarily ancient; they can recur or have roots in the Middle Ages)
    3. Ethnosymbolism (nations are modern but draw on older ethnic symbols and myths)
    4. Industrialization-driven modernism (nations are a product of industrial society and its needs)
    5. Print-and-administrative-vernacular modernism (nations are created by print capitalism, standardized languages, and administrative units)
    6. Top-down invented tradition (nations are created by elites through deliberate inventions of traditions)
    7. Banal nationalism (nations are reproduced through everyday, mundane practices)

   We need 8-10 questions, each with 2-3 options. Each question is a concrete case or claim about a case. The quiz should not explicitly mention the theories.

