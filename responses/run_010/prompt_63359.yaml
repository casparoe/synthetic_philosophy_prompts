  ### Nationalism Theory Sorting Quiz  
  **Instructions:** For each scenario, select the option that best reflects your view. Answer based on your instinct, not prior theory knowledge. At the end, tally your answers to discover your theoretical alignment.  

  ---

  #### **Question 1: Stateless Cultural Community**  
  A group shares myths, genealogies, and a remembered golden age but has no unified institutions or territory (e.g., Kurds pre-20th century, Jews pre-1948).  
  **Claim:** *This group constitutes a nation, even without a state or modern institutions.*  
  - **A. Agree**  
  - **B. Disagree**  

  #### **Question 2: Language Standardization**  
  A kingdom (e.g., France) used a vernacular language for centuries, but it only became standardized, mass-printed, and dominant over regional dialects after 1800.  
  **Claim:** *The nation truly emerged only after language standardization, not before.*  
  - **A. Agree**  
  - **B. Disagree**  

  #### **Question 3: Arbitrary Borders**  
  A border drawn by foreign diplomats (e.g., Sykes-Picot for Iraq/Syria) later fostered a population willing to die for it, despite no prior shared identity.  
  **Claim:** *This shows national identity can be created by state institutions alone.*  
  - **A. Agree**  
  - **B. Disagree**  

  #### **Question 4: Invented Tradition**  
  A "national" festival (e.g., Scotland’s Burns Night) was created by a specific committee in the 19th century but is now celebrated as ancient.  
  **Claim:** *Its recent origin undermines its legitimacy as a true national tradition.*  
  - **A. Agree**  
  - **B. Disagree; it taps into older cultural practices**  
  - **C. Disagree; origins matter less than its role in daily life now**  

  #### **Question 5: Medieval Administrative Unit**  
  A region (e.g., Brittany) had continuous administrative records and institutions since the Middle Ages. Its inhabitants developed a distinct identity that persists today.  
  **Claim:** *This identity exists primarily because of the long-standing administrative unit.*  
  - **A. Agree**  
  - **B. Disagree; it’s based on older ethnic/cultural ties**  
  - **C. Disagree; the identity is modern, not medieval**  

  #### **Question 6: Sustaining National Identity**  
  Consider two ways national identity is maintained:  
  - **Daily routines:** Flags on buildings, weather maps showing national borders.  
  - **Explicit acts:** National holidays, patriotic education, monuments.  
  **Claim:** *Daily routines matter more for sustaining identity than explicit acts.*  
  - **A. Agree**  
  - **B. Disagree**  

  #### **Question 7: Industrialization’s Impact**  
  A region of isolated villages developed a unified national identity only after industrialization brought railways, factories, and urban migration.  
  **Claim:** *Industrialization created the nation here.*  
  - **A. Agree**  
  - **B. Disagree**  

  #### **Question 8: Ancient Myths**  
  A population believes in shared descent from ancient heroes and a golden age, though historical evidence is scarce.  
  **Claim:** *This belief is essential to their nationhood, regardless of historical accuracy.*  
  - **A. Agree**  
  - **B. Disagree**  

  #### **Question 9: State Before Nation**  
  A state (e.g., Belgium, Indonesia) formed without a pre-existing unified identity, but one developed afterward.  
  **Claim:** *The state created the nation here.*  
  - **A. Agree**  
  - **B. Disagree**  

  #### **Question 10: National Anthem Adoption**  
  A state adopts an anthem written by a known poet in the 1800s; it gains popular resonance.  
  **Claim:** *Its acceptance is primarily due to:*  
  - **A. Functional needs of modern society**  
  - **B. Deliberate promotion by elites/state**  
  - **C. Resonance with pre-existing cultural symbols**  
  - **D. Becoming a routine, unremarkable part of life**  

  ---

  ### Scoring Key  
  Tally your answers and match the pattern to a theory. If your pattern isn’t listed, see "Unattributed Patterns."  

  | Theory                                      | Answer Pattern (Q1–Q10)       | Notes                                                                 |  
  |---------------------------------------------|-------------------------------|-----------------------------------------------------------------------|  
  | **Primordialism**                           | A, B, B, A, B, B, B, A, B, C | Nations are ancient, biological, and immutable.                      |  
  | **Perennialism**                            | A, B, B, B, A, B, B, A, B, C | Nations are recurring, rooted in pre-modern institutions/culture.    |  
  | **Ethnosymbolism**                          | B, B, B, B, B, B, B, A, B, C | Modern nations depend on pre-modern ethnic symbols/myths.            |  
  | **Industrialization-Modernism**             | B, A, A, A, C, B, A, B, A, A | Industrial society (economy, labor) creates nations.                 |  
  | **Print/Administrative-Modernism**          | B, A, A, A, A, B, B, B, A, A | Print capitalism and state bureaucracy create nations.               |  
  | **Top-Down Invented Tradition**             | B, A, A, A, C, B, A, B, A, B | Elites deliberately invent traditions to build nations.              |  
  | **Banal Nationalism**                       | B, A, A, C, A, A, B, B, A, D | Everyday, mundane practices sustain nations (not origins/moments).   |  

  ---

  ### Unattributed Patterns  
  If your pattern isn’t above, it falls into one of three categories:  
  1. **Incoherent**: Logically contradictory (e.g., agreeing nations need ancient myths *and* are purely modern).  
  2. **Unattractive**: Theoretically possible but rarely held (e.g., "Nations require ancient myths but are state-created").  
  3. **Unexplored**: Plausible but underdeveloped in scholarship (e.g., combining print modernism with primordialism).  

  ### Diagnostic Notes  
  - **Indistinguishable Pairs**:  
    - **Primordialism vs. Perennialism**: Only separated by **Q4** (Primordialism rejects invented traditions; Perennialism accepts them if they revive older roots).  
    - **Industrialization-Modernism vs. Top-Down Invention**: Only separated by **Q10** (Industrialization focuses on functional needs [A]; Top-Down on elite agency [B]).  
  - **Dead-End Flag**: The civic/ethnic distinction is excluded per your professor’s guidance. Cases focus on *mechanisms* (e.g., language, institutions, myths) rather than identity content.  

  ### Why This Works  
  - **Concrete Cases**: Each question uses real-world examples debated in seminars (e.g., Sykes-Picot borders, Breton identity).  
  - **Theory-Neutral**: No jargon (e.g., "banal," "print capitalism") appears in questions.  
  - **Distinction Focus**: Isolates core divides (e.g., ancient vs. modern origins, elite agency vs. organic growth).  

  Run this in your seminar, and watch peers discover their implicit theories—even if they’ve never read the canon!
