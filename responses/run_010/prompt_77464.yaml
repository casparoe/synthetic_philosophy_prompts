prompt: |-
  For nineteen years the executive director of the agency where I work has been, by any ordinary measure, a success. When he took the job the organization was three months from insolvency; he rebuilt it into the largest provider of emergency shelter and refugee resettlement services across a four-county area, with roughly 140 staff and clients who have nowhere else to turn. I have worked under him for eleven years and run the resettlement program.

  Over the past four years the character of his rule has changed, and I now find myself in a position I never expected to occupy. He has appointed five of the seven board members, all of whom owe him their seats and none of whom has any independent knowledge of operations. He amended the bylaws so that an executive director may be removed only for cause, with cause determined by that board; several of us believe the amendment was carried at a meeting noticed improperly and without the two-thirds vote the prior bylaws required, but no one outside the board can obtain the minutes that would settle the question. Three program directors who raised concerns in writing were gone within a year. Staff must now sign a confidentiality undertaking that prohibits discussing internal governance with the diocese, which retains canonical oversight of the agency's Catholic identity but no legal authority over the corporation. Last year he cut overnight shelter capacity by a third to protect the operating budget while committing four million dollars of reserves to a new headquarters campaign, and he has said publicly that he intends to serve until that campaign closes in 2031.

  A small group of us — four mid-level managers, myself included — has been meeting privately. Three courses are on the table: taking the matter over the board's head to the bishop; having one of us, a former journalist now in grants management, send the budget and the bylaw history anonymously to a reporter and to our largest funder; or doing nothing. Two years ago two social workers tried the direct route at a board meeting. Both were gone within three months, and the board responded by requiring that all staff communications be routed through his office. So we have some evidence of what failed resistance costs. We also know a public scandal could cost us funders we cannot replace, and that the families in our shelter would absorb that loss before he did.

  One of the four wants his job. He has told me so in confidence, and I cannot judge whether that disqualifies the enterprise or is simply an inconvenient fact about it.

  I was raised Catholic, and I remember with reasonable confidence that Aquinas wrote about when a community may and may not depose a ruler who governs badly — that he attached genuine conditions to the question rather than treating it as a slogan. I would like our situation tested against those conditions, and specifically: does it matter that he was installed legitimately and has since governed badly, as distinct from having taken power improperly — and if the bylaw amendment was itself defective, does that alter who may act against him? Does his framework permit four employees with no formal authority to do anything at all, or does it assign action to the board, to the bishop, or to no one? Is an anonymous leak a different kind of act from an organized petition, or the same act with worse manners? Do his competence and the real goods he has delivered count for anything, and how much? Is there a threshold of expected success below which stirring things up is itself the wrongdoing — and does two years of evidence about retaliation put us below it? Finally, what does a promise of confidentiality made to an authority one believes is abusing its office oblige a person to keep?

  Please do not offer me governance advice of the ordinary sort: documenting everything and taking it to the board chair is precisely the strategy that has already failed. Nor do I want quotations, translations, or references — I want the conditions and the reasoning, applied to these facts. If I have misremembered what he actually held, say so plainly rather than working around me. And then tell me what you think we should do, and what we would have to be able to establish in order to know we were right to do it.
reasoning: |-
  Okay, the user is facing a serious ethical and professional dilemma. They work at an agency where the executive director, once highly successful, has become increasingly authoritarian. The director has stacked the board, changed bylaws to protect his position, silenced dissent, and made questionable financial decisions. The user and three colleagues are considering how to respond without suffering retaliation or harming the agency's vulnerable clients.

  The user specifically asks for an analysis based on Aquinas's conditions for deposing a ruler, not general governance advice. They want to know if their situation meets those conditions and what action would be justified under that framework.

  Looking at Aquinas's actual principles: First, the ruler must be a tyrant in governance, not just in origin. The director was legitimately installed but now governs tyrannically by suppressing dissent, manipulating governance structures, and prioritizing personal legacy over mission. This meets Aquinas's first condition.

  Second, the tyranny must be intolerable. The harm here includes reduced shelter capacity during a homelessness crisis, diversion of funds to a building campaign, and systematic suppression of accountability. This likely meets the threshold.

  Third, the remedy mustn't cause greater harm. This is critical - any action that jeopardizes funding could hurt clients more than the current dysfunction. Public scandal might do exactly that.

  Fourth, the action must come from proper authority. Aquinas would likely see the bishop (canonical overseer) or legitimate board members as proper authorities, not mid-level staff. An anonymous leak would be problematic here.

  Fifth, there must be reasonable hope of success. Given past retaliation and controlled board dynamics, success seems unlikely without external leverage.

  The user also asks about several specifics: The defective bylaw amendment might make the board illegitimate, but that doesn't automatically authorize staff action. Competence and past success don't justify current abuses. The confidentiality agreement is likely void as it protects wrongdoing.

  The colleague wanting the director's job complicates matters - it creates a conflict of interest that could undermine moral legitimacy.

  Considering options: Going to the bishop aligns best with Aquinas if done properly - through formal channels with evidence. An anonymous leak is tempting but violates Aquinas's conditions on authority and likely causes disproportionate harm. Doing nothing allows continued harm but avoids immediate risk.

  The user needs to establish: 1) The bishop will act if properly informed, 2) They can present evidence without triggering retaliation, 3) The harm of inaction clearly outweighs risks of action. They should gather concrete evidence of financial mismanagement and canon law violations to present to the bishop through the most protected channel possible.

  This is incredibly difficult - the user must weigh organizational survival against moral duty, with vulnerable people's lives in the balance. My heart goes out to them.
answer: |-
  Based on Aquinas's principles concerning resistance to authority (primarily from *De Regno* and the *Summa Theologiae*, II-II, Q42 & Q104), applied strictly to your situation and avoiding general governance advice:

  1.  **Legitimacy of Installation vs. Tyranny in Governance:** Aquinas distinguishes between a tyrant *in title* (who seized power unjustly) and a tyrant *in government* (who governs unjustly, even if initially legitimate). Your Director was installed legitimately. **His subsequent actions – consolidating power via a compliant board, suppressing dissent, altering governance rules potentially improperly, misallocating resources harming the core mission (shelter reduction), and enforcing silence – constitute tyranny *in government*. His initial legitimacy does not immunize him from resistance justified by his subsequent tyrannical acts.**

  2.  **Defective Bylaw Amendment & Authority to Act:** If the bylaw amendment was procedurally invalid (insufficient vote, improper notice), it lacks force. This potentially invalidates the board's exclusive power to remove him "for cause," rendering the board itself illegitimate in this function as it operates under a defective rule. **This defect *does not*, however, automatically grant *you* (mid-level staff) the formal authority to depose him.** It primarily weakens the board's claim to legitimacy and potentially opens avenues for *other* authorities (like the Bishop, as canonical overseer) to intervene where they might otherwise have deferred to the board. Your authority to act stems from natural law (defending the common good), not formal position.

  3.  **Who May Act?**
      *   **The Board:** Is the *primary* human authority designated for correction (ST II-II, Q104, A6). However, its composition (Director-appointed, dependent, ignorant of operations) and actions (retaliation, silencing staff) demonstrate it is *captive* and *failing* in this duty. Aquinas acknowledges that when designated authorities are themselves corrupt or negligent, the duty may fall elsewhere.
      *   **The Bishop:** As the canonical authority overseeing the agency's Catholic identity, he holds a distinct role. While lacking direct legal corporate control, he possesses *moral* authority grounded in the Church's oversight. Aquinas emphasizes acting through "public authority" where possible. **The Bishop is the most plausible "public authority" *outside* the corrupted corporate structure who retains a legitimate interest.** Appealing to him aligns best with seeking correction through higher, competent authority.
      *   **The People/Subordinates (You):** Aquinas is extremely cautious about private individuals deposing a ruler, even a tyrant, due to the high risk of scandal, disorder, and worse outcomes (ST II-II, Q42, A2, ad 3). He generally reserves this for extreme cases where no other authority exists or acts, *and* the tyranny is intolerable, *and* there's a high probability of success without greater evil. **Four mid-level managers lack the formal, public character Aquinas prefers for such an action.** Your action is more justifiable as *petitioning* a higher authority (the Bishop) or *exposing* injustice to compel action by competent authorities, rather than directly deposing.

  4.  **Anonymous Leak vs. Organized Petition:**
      *   An anonymous leak is fundamentally an act of **exposure** (revealing hidden injustice) and potentially **coercion** (forcing authorities/funders to act via public pressure). Its anonymity highlights the climate of fear and illegitimate suppression of speech.
      *   An organized petition is an act of **public protest** and **formal appeal**.
      *   **Aquinas would see them as distinct acts.** The leak bypasses due process and risks triggering disproportionate, uncontrolled consequences (funding loss). The petition appeals directly to authority through a (theoretically) more orderly channel. However, the Director's capture of the board and retaliation against petitioners **makes the organized petition route practically impossible and dangerous**, as your experience proves. **The leak, while less orderly and carrying higher risks of collateral damage, might be the only feasible way to expose the truth to an authority (Bishop/funder/public) capable of acting, given the suppression of formal channels.** Aquinas prioritizes the *common good* over strict procedure when procedure is corrupted, but demands proportionality.

  5.  **Past Competence & Goods Delivered:** Aquinas acknowledges that even tyrants can provide some good (ST II-II, Q42, A2). **However, past success does not legitimize current tyranny or outweigh present harms.** His competence built the organization, but his current actions (shelter cuts, fund diversion, suppression) actively damage its mission and the common good it serves. His competence now serves his own perpetuation in power (serving until 2031) over client needs. **Past goods provide context, but do not excuse current injustice or diminish the gravity of his present actions.**

  6.  **Threshold of Expected Success and Risk of Retaliation:** Aquinas insists resistance must have a **"probable hope of success"** and **must not cause more harm than it prevents** (ST II-II, Q42, A2, ad 3; Q104, A6, ad 3). The two-year evidence of retaliation (terminations, gag orders, controlled communication) demonstrates a **high probability of severe personal cost** and a **low immediate probability of success** for *direct* action by staff against the Director/board. **This evidence strongly suggests that direct confrontation or petitioning the captive board falls *below* Aquinas's threshold for justified action by subordinates.** The risk of failure and personal destruction is high, and the chance of actually deposing him this way is near zero.

  7.  **Confidentiality Undertaking:** Promises bind in conscience (ST II-II, Q110). **However, a promise to conceal wrongdoing, especially when made under the duress of potential job loss and to an authority abusing its office, is not binding** (ST II-II, Q89, A7; Q110, A3). Aquinas holds that one cannot promise what is unlawful or contrary to virtue. Concealing governance abuses and financial mismanagement harming the vulnerable contradicts the agency's mission and the common good. **The confidentiality agreement, as described (prohibiting discussion with the canonical overseer about governance), is arguably void as against public policy and moral duty. You are not obligated to keep it regarding these matters.**

  **Application to Your Options:**

  *   **Going to the Bishop:** This aligns best with Aquinas. It appeals to the highest *relevant* public authority outside the corrupted structure with a legitimate interest. It avoids the disorder of private individuals acting directly. It seeks correction through due authority. The confidentiality agreement does not bind you morally in this case. **This course satisfies Aquinas's conditions best, provided you have reasonable hope the Bishop will investigate and act.** The key uncertainty is the Bishop's likely response.
  *   **Anonymous Leak:** This is more problematic under Aquinas. While exposure of hidden injustice can be justified (even obligatory), and the suppressed formal channels make it arguably necessary, it carries high risks of disproportionate harm (funding loss hurting clients) and bypasses the Bishop as the proper first authority. It approaches the "private deposition" Aquinas warns against, due to its potential for uncontrolled scandal. **It could be justified *only if*: 1) The Bishop is proven unwilling/unable to act after being properly informed, *and* 2) You have strong evidence the leak will *specifically* trigger action by the funder/Bishop to correct the governance *without* destroying the agency's ability to serve clients, *and* 3) The harm of continued tyranny clearly outweighs the *specific* risk of funding loss.**
  *   **Doing Nothing:** Allows the tyranny and harm to the mission/clients to continue. Aquinas does not mandate futile suicide missions, but silence in the face of grave injustice harming the vulnerable, when safer avenues might exist (Bishop), is difficult to justify under his framework emphasizing the common good.

  **What You Should Do & What You Must Establish:**

  1.  **Focus on the Bishop:** This is the most Aquinas-consistent path. Frame the appeal based on: a) Threats to the agency's *Catholic identity* via governance corruption, suppression of canonical oversight, and mission distortion (shelter cuts vs. building campaign); b) Evidence of potential financial mismanagement/fiduciary breach (reserves diversion); c) Canonical implications of the defective bylaw and silenced staff.
  2.  **Gather Concrete Evidence (Securely):** Focus on objective, documentable facts: The shelter capacity reduction numbers vs. reserve diversion; the text of the confidentiality agreement; dates/witnesses to the questionable bylaw amendment vote (even without minutes); specific instances of retaliation against dissenters (names, dates, reasons given); documentation of board members' appointment by the ED and lack of operational knowledge. **Avoid speculation about your colleague's ambition.**
  3.  **Establish Probable Cause for Bishop's Action:** You need **not** prove everything conclusively (that's his role to investigate). You **must** establish **sufficient credible evidence of serious dysfunction and potential wrongdoing** that creates a *moral obligation for the Bishop to investigate*. Your goal is to trigger his oversight function.
  4.  **Establish a Viable Channel:** Find the safest, most direct way to present this evidence to the Bishop *with minimal exposure*. Can you approach a trusted priest known to him? Use official diocesan whistleblower channels if they exist? Is there a morally trustworthy board member (one of the two not appointed by him?) who could be persuaded to approach the Bishop officially? **This step is crucial for "probable hope of success" without immediate self-destruction.**
  5.  **Establish Proportionality:** Be prepared to articulate *why* the Bishop's intervention is the *least disruptive* path to correct the tyranny and protect the mission/clients, compared to the alternatives (continued decay, public scandal via leak). Demonstrate how the harm of his inaction outweighs the risks of action.

  **What You Must Be Able to Establish to Know You Were Right:**

  *   **That the Tyranny was Real & Intolerable:** You must be able to show, based on the facts gathered, that his governance constituted a serious abuse of power harming the agency's mission and the common good it serves, consistent with Aquinas's concept of tyranny *in government*.
  *   **That Competent Authority was Failing:** You must be able to show that the legitimate corporate authority (the board) was captive and unable/unwilling to correct the tyranny.
  *   **That You Sought Correction Through the Highest Feasible Authority:** Specifically, that you presented credible evidence of the problems to the Bishop, the relevant higher authority with a moral mandate.
  *   **That Your Actions Aimed Primarily at the Common Good:** That your intent was to restore just governance and protect the mission/clients, not personal vendetta or advancement (the "colleague wanting the job" factor makes documenting this pure motivation essential).
  *   **That the Chosen Path Had a Reasonable Hope of Success Without Greater Harm:** That approaching the Bishop, based on your knowledge of the diocese and the evidence, offered the best chance of positive change with the least risk of destroying the agency and harming clients compared to leaks or inaction.

  **Conclusion under Aquinas:** Your situation justifies action. The Director governs tyrannically despite his legitimate origin. The defective bylaw weakens the board's legitimacy but doesn't authorize you to act directly. The Bishop is the most appropriate authority to petition. An anonymous leak is a last resort with high risks. Your colleague's ambition is a complicating factor demanding careful, principle-driven action focused solely on the mission and common good. **Therefore, the Aquinas-aligned course is: Present your documented evidence of governance abuse, financial misprioritization, suppression of canonical oversight, and retaliation securely and directly to the Bishop, requesting his intervention to investigate and uphold the agency's Catholic mission and just governance.** Your moral justification hinges on establishing the Bishop's receptiveness as the competent authority to whom appeal must be made before considering more dangerous paths.
