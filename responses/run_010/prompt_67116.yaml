  For the forger: same outline, no first-hand intention. Since they're replicating within Latin system, it's an 'a'—identity comes from the system, not original intent. This might challenge the user's scribe case, where I'd say it's still an 'a' but misread as 'o', but the user calls it 'o', so I need to discard that verdict because the scribe's intent was for 'a', even if misread.

  Least confident part: The scribe case. If intent defines identity, it should be 'a', but collective reading overrides in practice—maybe legibility can evolve, but identity is fixed at creation. For the smudged scan, it's 'a' because original intent holds despite poor reproduction.

