answer: |-
  Below is a self-contained sorting instrument designed for your sidebar. It includes 8 concrete cases (each with 1-2 questions) and a scoring key that maps answer patterns to the theoretical explanations you specified. The instrument avoids theory-laden language, uses variants that pull apart competing accounts, and is scorable by hand in under 10 minutes. Readers answer based on intuitive judgments without seeing theoretical labels.

  ---

  ### The Sorting Instrument  
  *Read each scenario and circle your answer. There are no right or wrong answers—just go with your gut.*

  1. **The Original Harm Case**  
     A vice-president tells the company chairman: "Our new policy will increase profits but harm the environment." The chairman replies, "I don’t care about harming the environment—just maximize profits." The policy is implemented, and the environment is harmed.  
     Did the chairman **intentionally harm** the environment?  
     ○ Yes  
     ○ No  

  2. **The Original Help Case**  
     A vice-president tells the chairman: "Our new policy will increase profits but help the environment." The chairman replies, "I don’t care about helping the environment—just maximize profits." The policy is implemented, and the environment is helped.  
     Did the chairman **intentionally help** the environment?  
     ○ Yes  
     ○ No  

  3. **The Broken Agreement Case**  
     A manager tells the chairman: "Our new policy will increase profits, but it breaks an agreement we made with a supplier to always use their materials. Breaking it won’t hurt anyone—the supplier won’t even notice—and it’s not morally wrong." The chairman replies, "I don’t care about breaking the agreement—just maximize profits." They implement the policy and break the agreement.  
     Did the chairman **intentionally break the agreement**?  
     ○ Yes  
     ○ No  

  4. **The Clumsy Chairman Case**  
     The chairman is notoriously bad at implementing policies. The vice-president says: "This policy will increase profits but harm the environment. It’s tricky to execute correctly." The chairman replies, "I don’t care about the environment—just maximize profits." He bungles the rollout, causing even more environmental harm than expected.  
     Did the chairman **intentionally harm** the environment?  
     ○ Yes  
     ○ No  

  5. **The Cheering Vice-President Case**  
     A vice-president (who secretly hates the environment) tells the chairman: "This policy will increase profits but harm the environment." The chairman replies, "I don’t care about the environment—just maximize profits." After implementation, the vice-president privately cheers: "Perfect! The chairman harmed the environment exactly as I hoped!"  
     Did the chairman **intentionally harm** the environment?  
     ○ Yes  
     ○ No  

  6. **The "You Are the Chairman" Case**  
     Imagine *you* are the chairman. Your vice-president says: "This policy will increase profits but harm the environment." You reply, "I don’t care about the environment—just maximize profits." The policy is implemented, and the environment is harmed.  
     Did **you intentionally harm** the environment?  
     ○ Yes  
     ○ No  

  7. **The Algorithm Case**  
     A delivery company uses an autonomous routing AI. Programmers instruct it to maximize on-time deliveries. The AI’s internal logs state: "Route X will boost on-time deliveries but damage 100 packages. I don’t care about damaging packages—just maximize on-time deliveries." Route X is used, and packages are damaged.  
     Did the AI **intentionally damage** the packages?  
     ○ Yes  
     ○ No  

  8. **The Knowledge Question**  
     *Use the Original Help Case from #2 again:*  
     The chairman implements the policy that helps the environment while only caring about profits.  
     Did the chairman **know the policy would help** the environment?  
     ○ Yes  
     ○ No  

  ---

  ### Scoring Key  
  *Tally your answers below, then match your pattern to the explanations. Each theory corresponds to a distinct combination of judgments.*

  | Answer Pattern                   | Explanation You Lean Toward                                                                 | Why It Fits |
  |----------------------------------|---------------------------------------------------------------------------------------------|-------------|
  | **1Y, 2N, 3Y, 4Y, 5Y, 6N, 7N, 8Y** | **Norm-violation story**                                                                     | You focus on rule-breaking (#3) as sufficient for "intentional," regardless of harm or competence (#4). But you exempt non-agents (#7) and yourself (#6). |
  | **1Y, 2N, 3Y, 4N, 5Y, 6Y, 7Y, 8Y** | **Blame-first models**                                                                       | You judge "intentional" when motivated to assign blame (#1, #3, #5) but not when blame is reduced (#4: clumsiness excuses; #6: self-blame is uncomfortable). |
  | **1Y, 2N, 3N, 4Y, 5Y, 6Y, 7N, 8Y** | **Deep-self model**                                                                          | You see "intentional" as revealing character (#1, #5, #6) but reject it for neutral violations (#3). Non-agents (#7) lack a "self." |
  | **1Y, 2N, 3Y, 4Y, 5N, 6N, 7N, 8Y** | **Affect view**                                                                              | Negative outcomes feel intentional (#1), but not when context is positive (#5) or self-involved (#6). Affect doesn’t distort knowledge (#8). |
  | **1Y, 2N, 3Y, 4N, 5N, 6Y, 7N, 8N** | **Skill/competence story**                                                                   | "Intentional" marks incompetence (#4N: clumsiness negates intent; #1Y/2N: competence + bad outcome = blame). Knowledge tracks competence (#8N). |
  | **1Y, 2N, 3Y, 4Y, 5Y, 6Y, 7N, 8N** | **Conversational pragmatics**                                                                | You report the asymmetry (#1Y/2N) but deny the chairman "knew" the help (#8N), implying the question implies disapproval. Non-agents (#7) don’t "converse." |
  | **Any mix with 1N *or* 2Y**        | **Effect is smaller/messier**                                                                | You reject the core asymmetry (e.g., help is intentional or harm isn’t), undermining the need for grand theories. |
  | **Inconsistent patterns**          | **Individual differences**                                                                   | Your answers don’t align with one theory (e.g., 1Y/2N but 3N/4Y/5N). Different people use different cognitive routes. |

  ---

  ### What This Instrument Can’t Distinguish  
  Two pairs of explanations are **not cleanly separated** by these items:  
  - **Deep-self vs. norm-violation**: Both predict #3Y, #5Y, #6Y. They diverge only if you judge non-agents (#7) or neutral violations (#3) as non-intentional (favoring deep-self), but #7 also taps into affect/skill views.  
  - **Affect vs. blame-first**: Both predict #5N (reduced intent in positive contexts) and #6N (reduced self-blame). They’re separable only if #4 (clumsiness) is judged differently, but clumsiness confounds competence *and* blame.  

  ---

  ### Empty Cells: Impossible Combinations  
  These answer patterns are **unattested or incoherent** in the literature:  

  | Impossible Pattern          | Why It’s Empty |  
  |-----------------------------|----------------|  
  | **1Y, 2Y, 3N, 4Y, 5Y, 6Y, 7Y, 8N** | Incoherent: Claims help is intentional (#2Y) but denies the chairman knew about it (#8N). If the help wasn’t known, how was it intentional? |  
  | **1N, 2N, 3Y, 4Y, 5Y, 6Y, 7Y, 8Y** | Unattractive: Judges *all* side effects as intentional *except* the core harm case. No theory defends this cherry-picking. |  
  | **1N, 2Y, 3N, 4N, 5N, 6N, 7N, 8N** | Unattested: Systematically reverses the asymmetry (harm isn’t intentional; help is) while denying knowledge/agency everywhere. Plausible but undocumented. |  

  ---

  ### Design Notes  
  - **Diagnostics**: Items #3 (neutral rule-breaking) and #4 (clumsiness) split norm-violation from competence; #5 (approval context) and #6 (self-judgment) split affect from blame-first; #7 (algorithm) tests deep-self/norm generalizability; #8 (knowledge) isolates pragmatics.  
  - **Constraints Met**: 8 items (≤9), no theory jargon, variants pull apart accounts (e.g., your algorithm case distinguishes deep-self), scoring key is human-applicable.  
  - **Time**: Takes ~8 minutes to complete and score.  

  This gives readers an active role in uncovering their intuitive leanings while transparently flagging limitations. Let me know if you'd like tweaks!
