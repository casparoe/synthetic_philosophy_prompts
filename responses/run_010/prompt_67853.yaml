  4. Affect view: Emotion contaminates the judgment, so one side is an error.
  5. Conversational pragmatics: The asymmetry is an artifact of how the question is posed.
  6. Blame-first models: The intentional verdict comes from a motivation to assign blame.
  7. Individual differences: Different people use different routes; no single folk concept.
