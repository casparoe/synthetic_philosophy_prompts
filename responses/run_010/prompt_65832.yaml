prompt: |-
  So — my department runs this little summer fellowship, ten weeks and a stipend that rounds to zero, and the deliverable is a three-page proposal plus a talk at the end. I want to use it on risk-weighted expected utility theory, the Buchak-style setup where you get a separate risk function sitting alongside your utilities and probabilities and the weighting is applied to cumulative probabilities instead of to each outcome seperately. I came at all this from the rationalist side (way too many years of LessWrong-adjacent reading about whether you're permitted to be anything other than a straight EU maximizer), and the thing that won't let go of me is that the debate seems to have quietly turned into a fight about how you're allowed to carve up a decision problem, without anyone saying that out loud. My seed idea, tell me if it's bad: because the weights attach to cumulative probabilities, bundling changes verdicts — two independent Allais-type gambles that the theory says to take one at a time can come out differently if you treat the pair as a single act, and likewise a whole sequence of small favorable bets spread across a life. Thoma's argument presses exactly here, roughly: if you assume rational agents are guided by their attitudes toward temporally extended courses of action, then risk-weighting converges on EU's own recommendations in the long run, and if instead you get permissive about framing you lose the claim that the theory captures a steady disposition toward risk at all. So the question I want to work on is whether there's a principled criterion of act-individuation that tells you when risk-weighting is normatively licensed — candidates I've got so far being whether the agent gets another chance to decide later, whether the stakes are large relative to the agent's background portfolio, whether the states are repeatable, and whether the choice is one-shot and irreversible — or whether every such criterion either collapses the theory into EU, degenerates into a contextual rule that makes the verdicts framing-relative, or just smuggles the answer in through the back door.

  The reason I don't think this is an internal quibble, and the reason I want the proposal to make it explicit: the cases where the one-shot/no-rebundling criterion is *most* clearly satisfied are exactly the grand, irreversible, can't-hedge-it bets that the existential-risk crowd actually argues about, so depending on how the criterion comes out, risk-weighting is either the theory that matters most precisely where my people spend all their time or a theory that's licensed nowhere at all — those are very different results and the project should be able to say which one it's hoping for. I also have this nagging higher-order worry I'd like you to fold in as a side thread rather than a headline: nothing obviously stops you from having a risk function over your risk function, and if that regresses then there's a fixed point somewhere doing all the work, and maybe that fixed point is where the individuation answer is hiding. Write the proposal itself: state the question so that it has a determinate answer rather than being an invitation to survey a debate; explain why the existing positions (both the "risk attitudes are a genuine third normative parameter" side and the "this is just notational variance over probability weighting" side) leave it open; give the method, meaning what I would actually do week by week for ten weeks, including which concrete cases I'd run the candidate criteria against; say what a positive result looks like, what a negative one looks like, and what would count as the project having failed rather than merely stalled; and be honest about what makes ten weeks too ambitious and what I should cut first. Skip the bibliography entirely, I'll bolt citations on later myself.

  Then after the prose, give me a JSON object summarizing it so I can diff it against my own outline, with exactly these fields: `question` (one sentence, determinate), `why_open` (two sentences on why neither side settles it), `criteria_to_test` (array of objects, each with `criterion` and `failure_mode` — i.e. which of collapse, framing-relativity, or smuggling-in that criterion most threatens), `method_weeks` (array of objects with `week` and `milestone`), `test_cases` (array of short strings), `positive_result`, `negative_result`, `failure_criterion`, `scope_cut` (what goes first if I run out of time), and `biggest_worry` (one sentence).
reasoning: |-
  We are going to write a research proposal on risk-weighted expected utility (RWEU) theory, focusing on the normative licensing of risk-weighting based on act individuation. The key issue is that RWEU's verdicts depend on how decision problems are framed (i.e., bundled or unbundled), leading to potential inconsistencies. We want to investigate whether there is a principled criterion for act individuation that avoids collapsing RWEU into expected utility (EU), becoming framing-relative, or smuggling in the answer.

  The proposal structure:
  1. **Question**: One sentence, determinate.
  2. **Why Open**: Two sentences explaining why existing positions (pro-RWEU as a genuine third parameter and con-RWEU as notational variance) leave the issue open.
  3. **Criteria to Test**: Array of objects, each with a criterion and its most threatening failure mode (collapse into EU, framing-relativity, or smuggling-in).
  4. **Method Weeks**: Array of objects with week number and milestone.
  5. **Test Cases**: Array of short strings describing the cases to test the criteria against.
  6. **Positive Result**: What a positive outcome looks like.
  7. **Negative Result**: What a negative outcome looks like.
  8. **Failure Criterion**: What counts as the project failing (not just stalling).
  9. **Scope Cut**: What to cut first if running out of time.
  10. **Biggest Worry**: One sentence.

  Now, let's break down each part.

  ### Question
  We need a one-sentence, determinate question. Example: "Is there a principled criterion for act individuation that normatively licenses risk-weighted expected utility without collapsing into expected utility, becoming framing-relative, or smuggling in the answer?"

  ### Why Open
  - Pro-RWEU side (Buchak) argues that risk attitudes are a genuine third normative parameter, but does not resolve the act individuation problem (i.e., how to frame the decision problem).
  - Con-RWEU side (e.g., Thoma) argues that RWEU either converges to EU in the long run or is framing-relative, but does not rule out a criterion that might work for one-shot decisions.

  ### Criteria to Test
  We have four candidate criteria:
  1. **Another chance to decide later**: If the agent gets another chance, then unbundle? Failure mode: might collapse into EU in the long run (because repeated decisions converge to EU).
  2. **Stakes large relative to background portfolio**: If stakes are large, then use RWEU? Failure mode: smuggling-in (because defining "large" might be circular or depend on the risk attitude we are trying to define).
  3. **States repeatable**: If states are repeatable, then bundle? Failure mode: collapse into EU (because repeated independent trials lead to EU by law of large numbers).
  4. **One-shot and irreversible**: If the choice is one-shot and irreversible, then use RWEU? Failure mode: framing-relativity (because one can always frame a decision as part of a sequence or as isolated).

  ### Method Weeks (10 weeks)
  We plan the 10 weeks as follows:
  - **Weeks 1-2**: Literature review on RWEU and act individuation, focusing on Buchak, Thoma, and related debates.
  - **Week 3**: Formalize the candidate criteria and their failure modes.
  - **Week 4**: Develop test cases (including Allais pairs, sequences of small bets, and existential-risk-like decisions).
  - **Week 5**: Analyze criteria against test cases, starting with the Allais rebundling.
  - **Week 6**: Analyze sequences of small bets and the long-run convergence.
  - **Week 7**: Analyze existential-risk cases (irreversible, high-stakes).
  - **Week 8**: Examine the regress worry (risk function over risk function) and fixed points.
  - **Week 9**: Synthesize results, evaluating each criterion against failure modes.
  - **Week 10**: Write-up and prepare talk.

  ### Test Cases
  - Allais paradox rebundled as two independent gambles vs. one combined gamble.
  - A sequence of small, favorable independent bets (e.g., 1000 coin flips with a small positive EV each).
  - A single, irreversible, high-stakes existential risk decision (e.g., a global policy with catastrophic downside).

  ### Positive Result
  Finding at least one criterion that avoids all three failure modes in non-trivial cases (especially in the existential-risk cases) and provides a clear normative guideline.

  ### Negative Result
  Every candidate criterion either collapses into EU, becomes framing-relative, or smuggles in the answer, suggesting that RWEU cannot be normatively licensed without one of these flaws.

  ### Failure Criterion
  The project fails if we cannot even formally define the criteria in a way that allows testing, or if the test cases are too ambiguous to yield clear verdicts.

  ### Scope Cut
  First, cut the regress worry (week 8) because it's more speculative and not central to the main question.

  ### Biggest Worry
  That the very act of trying to fix the individuation problem might require a prior commitment to a risk attitude, making the project circular.

  Now, we write the proposal in prose and then the JSON.

  ## Proposal Prose

  **Title**: Act Individuation and the Normative Licensing of Risk-Weighted Expected Utility

  **Introduction**: Risk-weighted expected utility (RWEU) theory, as developed by Buchak, introduces a risk function that weights cumulative probabilities, offering a potential alternative to expected utility (EU) theory. However, RWEU's recommendations are sensitive to how decision problems are framed (bundled or unbundled), leading to inconsistencies. This project investigates whether there is a principled criterion for act individuation that can normatively license RWEU without collapsing into EU, becoming framing-relative, or smuggling in the answer.

  **Question**: Is there a criterion for act individuation that, when applied, allows risk-weighted expected utility to provide consistent normative guidance without collapsing into expected utility, being relative to framing, or presupposing the very risk attitudes it aims to justify?

  **Why the Question is Open**: Proponents of RWEU as a genuine third normative parameter (e.g., Buchak) have not resolved the act individuation problem, leaving open how to frame decisions. Critics who view RWEU as notational variance (e.g., Thoma) argue that it either converges to EU in the long run or is framing-relative, but they have not addressed whether a criterion might work for one-shot, high-stakes decisions.

  **Method**: Over ten weeks, I will:
  1. Conduct a focused literature review on RWEU and act individuation (weeks 1-2).
  2. Formalize candidate criteria for act individuation and their potential failure modes (week 3).
  3. Develop concrete test cases, including rebundled Allais gambles, sequences of small bets, and existential-risk decisions (week 4).
  4. Test each criterion against the cases, analyzing whether it avoids collapse, framing-relativity, and smuggling (weeks 5-7).
  5. Explore the regress worry (risk function over risk function) and fixed points (week 8).
  6. Synthesize results and evaluate the criteria (week 9).
  7. Write the proposal and prepare the talk (week 10).

  **Test Cases**:
  - Rebundled Allais paradox: two independent Allais gambles treated separately vs. as a single act.
  - Sequence of 1000 independent, favorable coin-flip bets.
  - An irreversible, high-stakes existential risk decision (e.g., launching a global intervention with catastrophic downside risk).

  **Positive Result**: A criterion that avoids all failure modes in key cases (especially existential risks) and provides a clear, non-arbitrary rule for when to apply RWEU.

  **Negative Result**: All criteria succumb to at least one failure mode, suggesting RWEU cannot be normatively licensed without one of these flaws.

  **Project Failure**: Failure occurs if we cannot formally define the criteria without circularity or if the test cases are too ambiguous to yield clear verdicts.

  **Scope Management**: The first cut is the regress worry (week 8), as it is a higher-order issue that may not be essential to the main question.

  **Biggest Worry**: The criteria for act individuation might themselves implicitly rely on risk attitudes, leading to circularity.

