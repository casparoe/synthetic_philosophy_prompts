answer: |-
  ### Research Proposal: Act Individuation and the Normative Licensing of Risk-Weighted Expected Utility  

  **Question**  
  Is there a principled criterion for act individuation that normatively licenses risk-weighted expected utility theory without collapsing it into expected utility, degenerating into framing-relativity, or smuggling in presupposed risk attitudes?  

  **Why Existing Positions Leave It Open**  
  Proponents of risk-weighting as a genuine third parameter (e.g., Buchak) acknowledge framing sensitivity but lack a normative standard for "correct" individuation, leaving the door open to contextual arbitrariness. Critics (e.g., Thoma) show that risk-weighting converges to EU in repeated contexts or fractures under rebundling, but they do not address whether a defensible one-shot criterion could salvage its normative core—especially for existential-scale decisions.  

  **Method and Timeline**  
  - **Week 1–2**: Literature review (RWEU foundations, Buchak’s risk function, Thoma’s convergence argument, Allais rebundling).  
  - **Week 3**: Formalize candidate criteria and their failure modes (see below).  
  - **Week 4**: Develop test cases (see below) and model RWEU/EU divergence conditions.  
  - **Week 5**: Test "another chance to decide" criterion against Allais rebundling and small-bet sequences.  
  - **Week 6**: Test "stakes relative to background" and "states repeatable" criteria against small-bet sequences and portfolio effects.  
  - **Week 7**: Test "one-shot irreversible" criterion against existential-risk cases (e.g., high-stakes policy interventions).  
  - **Week 8**: Explore the risk-function regress worry (fixed-point analysis of higher-order risk attitudes).  
  - **Week 9**: Synthesize results: Does any criterion avoid all failure modes?  
  - **Week 10**: Draft proposal and talk; identify scope cuts if behind schedule.  

  **Test Cases**  
  - Rebundled Allais paradox (two independent gambles treated separately vs. as one act).  
  - Sequence of 1,000 independent favorable bets (e.g., +EV coin flips across a lifetime).  
  - Irreversible existential-risk decision (e.g., a global policy with low-probability catastrophe).  
  - Mixed portfolio choice (e.g., one high-risk and one low-risk investment bundled/unbundled).  

  **Criteria and Failure Modes**  
  | **Criterion** | **Failure Mode Threat** |  
  |---------------|-------------------------|  
  | Agent gets another chance to decide later | Collapse to EU (long-run convergence negates risk-weighting). |  
  | Stakes large relative to background portfolio | Smuggling-in (defining "large" covertly relies on risk attitudes). |  
  | States are repeatable | Collapse to EU (law of large numbers eliminates weighting effects). |  
  | Choice is one-shot and irreversible | Framing-relativity (irreversibility is perspective-dependent). |  

  **Positive Result**  
  A criterion (e.g., "one-shot irreversible") avoids all failure modes in non-trivial cases—particularly existential risks—and provides a coherent, non-arbitrary standard for act individuation, justifying RWEU as normatively distinct from EU.  

  **Negative Result**  
  All criteria either collapse into EU (under repetition), depend on framing (no objective individuation), or smuggle in risk attitudes (circularity), revealing RWEU as either reducible to EU or inadmissible for normative purposes.  

  **Failure Criterion**  
  The project fails if no criterion can be formalized testably (e.g., failure modes are inseparable) or test cases yield ambiguous verdicts (e.g., "irreversible" is always disputable).  

  **Scope Cut**  
  First cut: the regress worry (Week 8). It’s theoretically speculative and less urgent than core individuation criteria.  

  **Biggest Worry**  
  The act-individuation criteria themselves may implicitly encode risk attitudes, rendering the project circular.  

