  What they explicitly reject is telling: no rehashing of Pinker vs his critics, no simplistic "both sides have points" summary. This demands rigor in dissecting argumentative structures. Their hypothesis about the third and fourth strands being primary deserves testing against each category of disagreement.

  Right, let's tackle their six diagnostic requests systematically. First, categorising the strands: 
  - Strand one (absolute vs per capita) is clearly substantive empirical disagreement about normalisation necessity, though both sides accept the raw numbers. 
  - Strand two (heavy tails) involves methodological divergence about interpreting variance - is absence of mega-wars noise or signal? 
  - Strand three (definitional scope) is fundamentally normative - what constitutes "violence" isn't self-evident. 
  - Strand four (epistemic status) is meta-methodological: what kind of claim is being made? 

  Notably, only strand one has a genuine contradiction (both asserting incompatible propositions about measurement validity). The others involve different questions masquerading as disputes. 

  For "no fact of the matter" - tricky. Per capita violence rates are truth-apt; claims about structural change less so without agreed counterfactuals. Definitional disputes require stipulation to become testable. 

  Progress would look different per strand: Bayesian modelling for heavy tails, explicit harm taxonomies for definitional disputes. But strand four's meta-disagreement may resist resolution - it's about what constitutes an answer. 

  Their hypothesis holds well for strands three/four, but underestimates strand two's technical substance. The heavy tail debate isn't just conceptual theatre; it's central to whether we can detect signal in noisy processes. 

  Final reformulation must be brutally specific: "Has the probability of a human dying from intentional interpersonal physical force, per annum, declined in Western societies since 1500 CE?" Forces concessions from both sides - but leaves structural claims and non-physical harms for separate debates. 

