prompt: |-
  My partner and I are about five weeks from a frozen embryo transfer, and an appointment with our genetic counselor has left me unable to think clearly about a decision I now have to make. Two of our embryos were tested. One carries a variant that the counselor expects to produce a significant lifelong impairment; she was careful to say twice that a life with that impairment is worth living, and equally careful not to advise us either way. The other tested clear. Separately, my partner's treatment will conclude in roughly two years, by which point our finances and housing will be considerably more stable. If we wait, the child we have will be conceived from different gametes and will therefore be a numerically different child, not this one at a later date. Both decisions seem to have the same shape, and that shape is what I cannot get a handle on.

  Since that appointment I have been reading around the nonidentity problem, and I have acquired the opposite of what I wanted: a dozen confident-sounding positions, and no way to distinguish my load-bearing intuitions from artifacts of how particular cases happen to be described. So I am not asking for the arguments. I want the specification that sits underneath them. Write the desiderata for a theory of procreative choice: what any such theory must deliver before anyone is entitled to tell me that transferring the impaired embryo wrongs the child it produces, or that waiting wrongs the child we would otherwise have had. By adequate I mean something quite demanding and quite practical — good enough to actually settle which embryo to transfer and whether to transfer now, and good enough that the reasoning behind the choice could later be explained to the resulting person without embarrassment.

  Your list should cover, at minimum, the following, though I expect you will find more:

  - What harm can consist in when the alternative to the act is that this particular person never exists, and how the theory fixes the baseline for that comparison.
  - The distinction between wronging some particular person and making things worse overall, and whether the theory can do without either notion.
  - Whether same-number choices (which of these two embryos) and different-number choices (now or in two years) are governed by the same principles. If the theory treats them differently, what does the differentiating work.
  - The asymmetry between the strong reason not to create someone whose life would be miserable and the weak or absent reason to create someone whose life would be happy. Any theory that treats wellbeing symmetrically owes an account of this.
  - Whether the same machinery handles positive selection for a trait the parents share and value, where no impairment reading is available to do the work.
  - The licensing worry: if creating someone whose life is worth living cannot harm them, what prevents the theory from treating a barely-worth-living life as no worse a choice than a flourishing one.
  - Whether reasons can be owed to nobody in particular, and if so, how they enter one person's deliberation rather than a social planner's calculus.
  - Whether the intimate single-family case and the population-scale case — an energy or resource policy that changes who exists centuries hence — are the same problem. If not, say what the relevant difference is.
  - The gap between an act's being wrong and any particular person's having standing to complain about it.

  For each entry, give the desideratum a name, state it as a requirement, supply the case or consideration that motivates it, and mark it as non-negotiable, negotiable-but-costly, or a sectarian preference of one camp that has been passing as a neutral requirement. Where a named position fails something non-negotiable, note it in a clause within the entry; I do not want a leaderboard, and I do not want the scorecard to displace the criteria.

  Two proposed requirements of my own should be entered on the list and then interrogated rather than indulged. The first, which I will call retrospective addressability, holds that a choice is defensible only if it can be explained to the person it produced in the second person, in terms whose soundness does not depend on that person's never having existed. The second, which I will call operator transparency, holds that a theory must declare at each step whether it is reasoning about what is worse for someone or about what is worse simpliciter, and may not move between the two without stating the conversion rule. My suspicion is that much of the apparent disagreement between camps is unmarked operator-switching rather than genuine moral difference; tell me whether that suspicion survives contact with the arguments, or whether the switches are doing substantive work.

  Please structure your answer in exactly these sections, in this order:

  1. The Two Decisions — about 150 words, restating my situation in neutral terms, with any description-dependence you notice flagged rather than smoothed over.
  2. The Desiderata — about 1,100 words, numbered, each entry carrying its name, statement, motivating case, and status.
  3. Collisions and Redundancies — about 450 words: which subsets of the list cannot be jointly satisfied and why; which single desideratum excludes the most candidates; and which pairs you believe are one requirement stated in two vocabularies.
  4. On My Two Proposals — about 350 words: keep, repair, or discard, with reasons.
  5. What Survives — about 250 words: the minimal consistent set I can carry into the appointment, what it leaves genuinely undetermined, and which single requirement I should be prepared to abandon if I want the decision to become tractable, along with what that abandonment costs.

  One constraint on the whole thing: no citations, no bibliography, no reading list, and no page references. I have no means of checking any of it, and I would much rather you described a view than fabricated a source for it. Where a position has a standard name, use the name; where it does not, describe it.
reasoning: |-
  Hmm, this is an incredibly thoughtful and complex query about the ethics of procreative choice, specifically in the context of embryo selection and timing of conception. The user is clearly deeply engaged with the philosophical underpinnings of their decision, having researched the nonidentity problem and related issues. They're not looking for arguments but rather the foundational criteria that should guide a theory of procreative ethics.

  The user outlines several key areas that must be covered: harm comparison when the alternative is nonexistence, wronging vs. making things worse overall, same vs different-number choices, the asymmetry in creating miserable vs happy lives, positive trait selection, the licensing problem, impersonal reasons, scalability from family to population decisions, and the gap between wrongness and complainability. They also propose two requirements of their own: retrospective addressability and operator transparency.

  I need to structure my response precisely as requested: first restating their situation neutrally, then listing desiderata with names/statements/motivations/statuses, then analyzing collisions between requirements, evaluating their two proposals, and finally suggesting what survives as a minimal consistent framework.

  For the desiderata section, I'll need to cover at least these points:
  - Harm Baseline (defining harm when nonexistence is the alternative)
  - Complainant Distinction (wronging vs making worse overall)
  - Number Sensitivity (same vs different-number cases)
  - Asymmetry Requirement (creating miserable vs happy lives)
  - Positive Selection (selecting for valued traits)
  - Licensing Constraint (preventing barely-worth-living as acceptable)
  - Impersonal Reasons (how obligations exist without specific persons)
  - Scale Invariance Test (family vs population decisions)
  - Complainability Gap (wrongness without specific complainant)
  - Plus the user's Retrospective Addressability and Operator Transparency

  I'll mark each as non-negotiable, negotiable-but-costly, or sectarian. The analysis will show that some requirements conflict fundamentally - particularly the Asymmetry Requirement with impersonal wellbeing maximization approaches. Their Operator Transparency proposal seems robust and should be kept, while Retrospective Addressability might need refinement.

  The minimal consistent set I'd suggest includes Harm Baseline, Asymmetry Requirement, Licensing Constraint, and Operator Transparency - though this leaves some questions about impersonal obligations unresolved. If they need to make the decision tractable, Scale Invariance might be the safest to set aside, as their case is fundamentally personal rather than policy-level.
answer: |-
  ### 1. The Two Decisions  
  You face two nested choices concerning frozen embryos. The first is a **same-number choice** between two existing embryos: Embryo A carries a genetic variant expected to cause significant lifelong impairment, though life with this impairment remains "worth living"; Embryo B tested clear. The second is a **different-number choice**: transfer either embryo *now* (when finances/housing are less stable) or wait ~2 years until stability improves, at which point conception would use different gametes, producing a numerically different child. Both choices involve comparing existence-with-condition against non-existence (for Embryo A) or against a different person’s existence (for the timing choice). Crucially, your description treats "this particular child" as tied to specific gametes—a premise some theories contest.  

  ### 2. The Desiderata  
  1. **Harm Baseline Requirement**  
     *Statement*: Must define *harm to the resulting child* when the alternative is their non-existence.  
     *Motivation*: If transferring Embryo A creates a child with impairment, but not transferring it means that child never exists, does the act harm *them*? Theories must specify the baseline for comparison (e.g., a "neutral point" like nonexistence, or a counterfactual with no impairment).  
     *Status*: Non-negotiable. *Failure note*: Traditional harm-based accounts fail if nonexistence isn’t a harm-able state.  

  2. **Complainant Distinction**  
     *Statement*: Must clarify if "wronging someone" requires an identifiable complainant who is *worse off*, or if "making things worse overall" (e.g., lower total welfare) suffices for wrongness.  
     *Motivation*: Transferring Embryo A may not make *that child* worse off than nonexistence, but it might reduce overall welfare versus transferring Embryo B. Is this sufficient to call it wrong?  
     *Status*: Non-negotiable.  

  3. **Number Sensitivity**  
     *Statement*: Must justify whether same-number (selecting Embryo A vs. B) and different-number (transferring now vs. later) choices rely on identical or distinct principles.  
     *Motivation*: Same-number choices involve harming one *possible* person over another; different-number choices affect *who exists*. Theories treating both identically must reconcile this; those differentiating must explain why "affecting who exists" changes obligations.  
     *Status*: Negotiable-but-costly (ignoring differences risks conflation).  

  4. **Asymmetry Requirement**  
     *Statement*: Must explain the strong duty to avoid creating a miserable person versus the weak/no duty to create a happy one.  
     *Motivation*: We feel obligated not to create Child X with a "miserable" life, but not obligated to create Child Y with a "happy" life. Symmetric theories (e.g., total utilitarianism) owe an explanation.  
     *Status*: Non-negotiable. *Failure note*: Classical utilitarianism violates this by treating welfare symmetrically.  

  5. **Positive Selection Test**  
     *Statement*: Must handle selecting *for* a valued trait (e.g., musicality) using the same principles as avoiding impairment, without medicalized language.  
     *Motivation*: If selecting *against* impairment is permissible, is selecting *for* musicality equally justified? If not, what distinguishes them?  
     *Status*: Non-negotiable (exposes inconsistency in "impairment-only" reasoning).  

  6. **Licensing Constraint**  
     *Statement*: Must prevent "barely worth living" lives from being treated as morally equivalent to flourishing ones in procreative choices.  
     *Motivation*: If creating a person cannot harm them if their life is worth living, what stops us from creating many barely-happy lives?  
     *Status*: Non-negotiable. *Failure note*: "Person-affecting" views struggle here.  

  7. **Impersonal Reasons**  
     *Statement*: Must accommodate obligations not owed *to* any particular person (e.g., "it’s better if a happy person exists").  
     *Motivation*: If waiting creates a happier child, is that a reason? If so, to whom is it owed?  
     *Status*: Negotiable-but-costly (denying impersonal reasons limits justification).  

  8. **Scale Invariance Test**  
     *Statement*: Must clarify whether family-level and civilizational-scale choices (e.g., climate policy) share the same moral structure.  
     *Motivation*: Policies affecting future populations involve different-number choices—are they governed by the same principles as your embryo decision?  
     *Status*: Sectarian preference (often assumed identical but need not be).  

  9. **Complainability Gap**  
     *Statement*: Must reconcile an act’s wrongness with no particular person’s standing to complain.  
     *Motivation*: If transferring Embryo A is wrong, but the resulting child cannot complain (as existence is better than non-existence), how is wrongness assigned?  
     *Status*: Non-negotiable.  

  10. **Retrospective Addressability** (Your Proposal)  
      *Statement*: A choice is defensible only if justifiable *to* the resulting person in second-person terms, without invoking their non-existence as a preferable state.  
      *Motivation*: Ensures decisions respect the child as a moral interlocutor ("I chose you because...").  
      *Status*: To be evaluated (§4).  

  11. **Operator Transparency** (Your Proposal)  
      *Statement*: Must explicitly label whether reasoning uses "worse *for* someone" or "worse *simpliciter*," with conversion rules for shifts.  
      *Motivation*: Prevents equivocation between personal harm and impersonal badness.  
      *Status*: To be evaluated (§4).  

  ### 3. Collisions and Redundancies  
  - **Fatal Collision**: The *Asymmetry Requirement* and *Impersonal Reasons* conflict directly. Impersonal reasons (e.g., "create happier people") demand symmetry; asymmetry rejects this. *Licensing Constraint* also clashes with impersonal views that permit barely-worth-living lives.  
  - **Excluder**: *Asymmetry Requirement* eliminates the most candidates (e.g., total utilitarianism, prior-existence utilitarianism).  
  - **Redundant Pair**: *Harm Baseline Requirement* and *Complainability Gap* are two angles on the same core problem (harm vs. nonexistence). Similarly, *Operator Transparency* partially absorbs the *Complainant Distinction* by forcing explicit labeling of "for whom" a choice is worse.  
  - **Tension**: *Retrospective Addressability* resists *Impersonal Reasons*, as impersonal justifications ("I waited to create a happier child") fail the second-person test.  

  ### 4. On My Two Proposals  
  - **Retrospective Addressability (RA)**: **Repair**. RA is intuitively powerful but overreaches. A defensible choice *should* be explainable to the child without demeaning their existence. However, RA must allow for *impersonal* reasons if they survive other tests (e.g., "We waited because we believed any child deserves stable parents"). *Repair*: RA should require justifications the child *can rationally accept*, not necessarily ones that center *only* their welfare.  
  - **Operator Transparency (OT)**: **Keep**. OT is a meta-requirement that exposes equivocation in arguments. Your suspicion holds: many disputes (e.g., "Does selecting Embryo A harm the child?") stem from unmarked shifts between "worse for" and "worse overall." OT forces coherence without dictating substantive answers. It strengthens *Complainant Distinction* and *Licensing Constraint*.  

  ### 5. What Survives  
  **Minimal Consistent Set**:  
  1. *Harm Baseline Requirement* (Non-negotiable)  
  2. *Asymmetry Requirement* (Non-negotiable)  
  3. *Licensing Constraint* (Non-negotiable)  
  4. *Operator Transparency* (Repaired RA compatible)  
  5. *Number Sensitivity* (Treat same/different choices distinctly)  

  **What Remains Undetermined**:  
  - Whether impersonal reasons exist (e.g., "Waiting creates a happier child")—this set neither requires nor forbids them.  
  - Whether selecting *for* a positive trait is permissible—*Positive Selection Test* is satisfied only if the same principle applies to traits and impairments, but the set doesn’t specify that principle.  

  **Sacrifice for Tractability**:  
  Abandon **Scale Invariance**. Treating family/policy scales as distinct avoids overcomplication. *Cost*: May feel ad hoc; but your case is intimate, not civilizational.  

  **For Your Decision**:  
  - **Embryo Choice**: Transferring Embryo A cannot *harm that child* (per *Harm Baseline*), but *Licensing Constraint* and *Asymmetry* suggest it is dispreferred to Embryo B if avoidable.  
  - **Timing Choice**: Waiting doesn’t wrong any *particular* child (different-number), but *Operator Transparency* asks: Is it "worse overall" to have a child in instability? If so, that’s an impersonal reason—permissible if you accept it.  
  - **Explainability**: Use *Repaired RA*: "We transferred Embryo B because we wanted to give you the best start we could" (same-number); "We waited to be better parents for you" (different-number). Both satisfy OT and avoid demeaning existence.  

  This framework excludes theories that violate non-negotiables (e.g., symmetric utilitarianism) and centers defensibility to your future child. It leaves room for your values to weigh stability against immediacy.
