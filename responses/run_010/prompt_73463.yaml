  - Self-undermining (does the same apply to nematodes or bacteria? if not, is the cutoff principled?)

  Additionally:
  - Failed predictions: What does the user's view predict that the rival view (insects probably not sentient and it wouldn't matter) does not? What findings would falsify the user's view?
  - Sloppy empirical claims: Corrections on bee cognition and fruit-fly nociception claims.
  - Insulation verdict: Is the position insulated by pre-empting fanaticism, vagueness, and aggregation objections? Is there still risk? Is that a problem for a practical view?
  - Bottom line: What should the user revise first?

  **Response Structure as JSON:**
  We must output a single JSON object with the following keys:
  - `position_as_you_read_it`: String describing the user's view in our words, noting any incoherencies.
  - `defeaters`: Array of objects, each with:
    - `name`: Short label.
    - `what_would_have_to_be_true`: Condition (2-5 sentences).
    - `target`: One of: credence | multiplication | aggregation | valence | self-undermining | unfalsifiability.
    - `liveness`: One of: already partly true | could plausibly turn out true | logically possible only.
    - `decisiveness`: One of: fatal | serious | awkward | cosmetic.
    - `what_defender_says`: Best reply and whether it costs anything.
    - `would_i_concede_it`: Boolean (true if the user would likely concede, false otherwise).
    - `why`: Why the user would or wouldn't grant this (1-2 sentences).
  - `failed_predictions`: Array of objects, each with:
    - `finding`: A concrete finding that would falsify the user's view.
    - `why_my_view_predicted_it`: Why the user's view predicts the opposite.
    - `how_bad`: fatal | serious | awkward (if the finding were true).
  - `sloppy_empirical_claims`: Array of objects, each with:
    - `claim_i_made`: The user's claim (as stated or implied).
    - `correction_or_caveat`: Correction or caveat.
  - `insulation_verdict`: Object with:
    - `insulated`: yes | partly | no.
    - `reasoning`: Explanation.
    - `is_that_a_problem_for_a_view_of_this_kind`: Whether the lack of insulation is a problem for a practical, action-guiding credence.
  - `bottom_line`: String with the single thing to revise first, if anything.

  **Plan:**
  1. **Position as we read it:** Summarize the user's view, noting any potential issues (e.g., the 1% credence might be seen as arbitrary without more justification, but the user is aware of this and asks for stress-testing).
  2. **Defeaters:** We'll generate 5-6 defeaters, ordered by decisiveness (fatal first). We'll cover:
     - Credence: Arguments that the credence should be near zero (e.g., substrate requirements, absence of behavioral markers).
     - Self-undermining: Extending to nematodes or bacteria and the challenge of a principled cutoff.
     - Valence: Why insect lives might not be net-negative (e.g., short lives, neutral valence).
     - Multiplication: Risk-weighted decision theory (Buchak) and whether it discounts low-probability/high-stakes even with many chances.
     - Aggregation: Objections to aggregating tiny welfare subjects.
     - Unfalsifiability: The view might not make testable predictions.

     We'll order them: 
     1. Credence (most decisive if true: if credence is near zero, the whole argument collapses) -> target: credence.
     2. Self-undermining (if the same logic forces including bacteria, and the user can't draw a line, then the view is absurd) -> target: self-undermining.
     3. Valence (if insect lives are neutral, then no suffering to aggregate) -> target: valence.
     4. Multiplication (if we discount low-probability events, then the expected suffering might not be action-guiding) -> target: multiplication.
     5. Aggregation (if we reject aggregation, then even if there are many suffering insects, we might not care) -> target: aggregation.
     6. Unfalsifiability (if the view makes no testable predictions, it's not scientific) -> target: unfalsifiability.

     For each, we'll assign liveness and decisiveness, provide a defender reply, and state if the user would concede.

  3. **Failed predictions:** We'll list findings that would falsify the user's view (e.g., evidence that insects cannot suffer, or that their lives are positive). If none, we'll say so.

  4. **Sloppy empirical claims:** We'll note that the user mentioned bee cognition and fruit-fly nociception (pessimism-like judgment bias, sensitization). We'll add caveats: these findings are suggestive but not conclusive for phenomenal consciousness.

  5. **Insulation verdict:** We'll say the view is partly insulated because the user pre-empted common objections, but not fully because the credence and valence are still debatable. For a practical view, this is acceptable as long as the expected value calculation holds.

  6. **Bottom line:** The user should revise the credence (1%) first, by seeking more empirical evidence on insect consciousness.

  Let's now construct the JSON.
