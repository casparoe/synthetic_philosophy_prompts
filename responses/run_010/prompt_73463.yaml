  We are given a user's view on insect welfare, which we'll call the "numbers-first view." The user has provided a detailed description and asks for stress-testing. We are to respond in a specific JSON format. Let's break down the user's position and the requested elements.

  **User's Position (Numbers-First View):**
  - Assigns a ~1% credence that any given insect is phenomenally conscious (mind-independent fact).
  - Notes that there are 10^18 to 10^19 arthropods alive at any time, so the expected number of sentient insects is huge (10^16 to 10^17).
