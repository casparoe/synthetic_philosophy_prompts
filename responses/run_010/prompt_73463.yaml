        "target": "one of: credence | multiplication | aggregation | valence | self-undermining | unfalsifiability",
        "liveness": "one of: already partly true | could plausibly turn out true | logically possible only",
        "decisiveness": "one of: fatal | serious | awkward | cosmetic",
        "what_defender_says": "the best reply available to me, and whether it costs me anything",
        "would_i_concede_it": true,
        "why": "one or two sentences on why a committed numbers-first theorist would or wouldn't grant this"
      }
    ],
    "failed_predictions": [
      {"finding": "...", "why_my_view_predicted_it": "...", "how_bad": "fatal | serious | awkward"}
    ],
    "sloppy_empirical_claims": [
      {"claim_i_made": "...", "correction_or_caveat": "..."}
    ],
    "insulation_verdict": {"insulated": "yes | partly | no", "reasoning": "...", "is_that_a_problem_for_a_view_of_this_kind": "..."},
