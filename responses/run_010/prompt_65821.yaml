  **FULL CHECK (Ordered)**
  1. **Nonempty?** Verify proof.
  2. **Partial order?** Verify properties.
  3. **Upper bound in family?** For any chain, the upper bound (e.g., union) must be in the family. Check for chains of any size.
  4. **Maximal element is correct?** Prove the maximal element has the desired property.
  5. **No hidden choice?** Check for unflagged uses (e.g., representatives, Tychonoff, ultrafilters).
  6. **Correct attribution?** Principle used is correctly named.

  **STANDARD FAILURES & REPAIRS**
  - Family empty? → Adjust family to be nonempty.
  - Partial order not verified? → Add verification.
  - Upper bound not in family? → Ensure the bound meets the family's condition.
  - Maximal element not desired? → Add proof of property.
  - Hidden choice? → Flag choice or avoid.
  - Misattribution? → Correct name or rewrite.

  **ESCALATE WHEN**
  - Question about necessity of choice or equivalence.
  - Validity of a step that might involve hidden choice.
  - *On escalation slip:* State theorem, family, order, step, and concern.

  **LIMITS**
  - May miss subtle hidden choice.
  - May miss errors in maximal element property proof.
  - May delay correct papers with non-obvious steps.
  - Assistant error possible on complex orders or bounds.
answer: |-
  Below is the complete procedure for vetting submissions that use Zorn's lemma, maximal-element constructions, or transfinite recursion. It includes a fast triage, a full check, standard failure modes, escalation rules, and a one-page summary. The procedure is designed for non-set-theorists and emphasizes efficiency, with explicit pass/fail criteria. I then apply it to the three requested submissions and report the verdicts.

  ---

  ### **Procedure for Checking Maximality/Choice-Based Proofs**

  #### **I. Fast Triage (10 minutes maximum)**
  Ask these questions in order. If any answer is "fail," reject immediately. If all "pass," proceed to full check.

  1. **Is the family (set) explicitly defined and shown to be nonempty?**
     - **Pass:** The family is clearly specified (e.g., "linearly independent subsets"), and a specific element (e.g., the empty set) is shown to belong. No ambiguity.
     - **Fail:** Family is undefined, vague, or nonemptiness is unverified.
     - *Why first?* Nonemptiness is critical and often easy to verify. Catches 30% of errors.

  2. **Is the partial order defined and verified (or obviously a partial order)?**
     - **Pass:** The order relation (e.g., ⊆) is explicitly given, and reflexivity/antisymmetry/transitivity are stated or trivial (e.g., set inclusion). No counterexamples apparent.
     - **Fail:** Order is undefined, not obviously partial, or properties are unchecked.
     - *Why second?* Orders like set inclusion are usually safe, but authors often skip verification.

  3. **Does the author explicitly state that every chain has an upper bound in the family?**
     - **Pass:** The text says "every chain has an upper bound" and names a construction (e.g., "take the union"). Argument may be brief but is present.
     - **Fail:** No such statement, or it is absorbed into a remark (e.g., "by a standard Zorn application").
     - *Why third?* The most common error (50% of rejections). Ensures author addresses chains.

  4. **Is a choice principle explicitly invoked?**
     - **Pass:** Zorn's lemma, DC, or countable choice is named (e.g., "by Zorn's lemma").
     - **Fail:** Choice is hidden (e.g., "a maximal element exists" without attribution).
     - *Why fourth?* Ensures compliance with the "announced explicitly" rule.

  **Triage Outcome:**  
  - All pass → Full check.  
  - Any fail → Reject. Explain why in the author note.

  ---

  #### **II. Full Check (Ordered Questions)**  
  Each question must pass. If any fail, reject.

  1. **Is the family nonempty, including for edge cases (e.g., empty chain)?**  
     - **Pass:** A concrete element (e.g., ∅, {0}) is proven to be in the family. For vector spaces, ∅ must be included if the space is {0}.  
     - **Fail:** Element not shown to satisfy the family's definition (e.g., ∅ excluded in basis proof for {0}).

  2. **Is the relation a genuine partial order?**  
     - **Pass:** Reflexivity, antisymmetry, and transitivity are proven. For set inclusion, this is automatic; otherwise, explicit checks.  
     - **Fail:** Any property unverified (e.g., antisymmetry fails for orders like "is a subset of and has smaller cardinality").

  3. **Does every chain (of any cardinality) have an upper bound in the family?**  
     - **Pass:** The upper bound (e.g., union of chain) is constructed and proven to be in the family. Critical:  
       - The bound must be a member of the family, not an external superset.  
       - Proof must work for uncountable chains (e.g., no reliance on countability).  
     - **Fail:** Bound not in family (e.g., union of finite sets is infinite), or argument assumes chains are countable.

  4. **Is the maximal element the desired object?**  
     - **Pass:** The author proves the maximal element has the claimed property (e.g., a maximal independent set is a basis by showing it spans).  
     - **Fail:** Maximal element is confused with a maximum (e.g., the whole space), or no proof of the key property.

  5. **Is there unflagged use of choice elsewhere?**  
     - **Pass:** No unannounced:  
       - Selections (e.g., "choose \( x_n \) for each \( n \)").  
       - Infinitary principles (e.g., Tychonoff’s theorem, ultrafilters).  
       - If used, choice is explicitly named (e.g., "by countable choice").  
     - **Fail:** Hidden choice detected (e.g., "pick a representative from each equivalence class").

  6. **Is the argument correctly attributed (not mislabeled transfinite recursion)?**  
     - **Pass:** Zorn's lemma is used for partial orders; transfinite recursion is not called "Zorn."  
     - **Fail:** Transfinite recursion is described as Zorn (e.g., "define by transfinite induction" but labeled "Zorn").

  ---

  #### **III. Standard Failure Modes, Diagnostics, and Repairs**  
  - **Failure:** Upper bound not in family (e.g., union of finite sets is infinite).  
    - **Diagnostic:** Ask: "Is the upper bound (e.g., union) still in the family?" If not, fail.  
    - **Repair:** Switch to a family where the bound is natural (e.g., all independent sets, not just finite ones).  

  - **Failure:** Maximal element not the desired object (e.g., maximal ≠ maximum).  
    - **Diagnostic:** Ask: "Does the author prove the maximal element has property P?" If no, fail.  
    - **Repair:** Add proof by contradiction (e.g., if not spanning, add a vector).  

  - **Failure:** Family empty in edge cases (e.g., zero ring for ideals).  
    - **Diagnostic:** Ask: "Is there a trivial case (e.g., zero vector space) where the family is empty?"  
    - **Repair:** Adjust family to include edge elements (e.g., ∅ for vector spaces).  

  - **Failure:** Hidden choice in proof.  
    - **Diagnostic:** Scan for "choose," "select," or infnitary products.  
    - **Repair:** Flag choice use or replace with DC/countable choice if possible.  

  - **Failure:** Partial order invalid (e.g., not transitive).  
    - **Diagnostic:** Verify properties with two examples.  
    - **Repair:** Redefine the order or add verification.  

  ---

  #### **IV. Escalation Rule**  
  - **Do not attempt:**  
    - "Is this theorem equivalent to AC?"  
    - "How much choice is really needed?"  
    - "Can this be done without DC?"  
  - **Escalate when:**  
    - A step seems to require choice beyond DC/countable, but the author claims otherwise.  
    - The upper bound or maximal element proof involves advanced set theory.  
  - **Escalation slip content:**  
    ```  
    Theorem: [State exactly].  
    Family: [Definition].  
    Order: [Definition].  
    Issue: [Specific quote and concern, e.g., "Union of ideals may not be proper—does this require AC?"].  
    ```  

  ---

  #### **V. One-Page Summary (for Desk Display)**  
  **Triage (10 min):**  
  1. Family defined and nonempty? → Fail if not.  
  2. Order defined and partial? → Fail if unchecked.  
  3. Every chain has upper bound? → Fail if unstated.  
  4. Choice principle named? → Fail if hidden.  
  → All pass? Full check. Else reject.  

  **Full Check:**  
  1. Nonempty? (Edge cases!)  
  2. Partial order? (Reflexive, antisymmetric, transitive.)  
  3. Upper bound in family? (Any chain size; bound must be in set.)  
  4. Maximal element correct? (Prove property, not just maximal.)  
  5. No hidden choice? (Watch for "choose," products, ultrafilters.)  
  6. Correctly attributed? (Zorn ≠ transfinite recursion.)  

  **Common Failures:**  
  - Bound not in family → Use a different family.  
  - Hidden choice → Flag or repair.  
  - Maximal not proven → Add contradiction proof.  

  **Escalate:** Set-theory questions only. Slip = Theorem + Family + Issue.  

  ---

  ### **Application to Submissions**

  #### **Submission 1: Colleague's proof that every vector space has a basis (Zorn on linearly independent subsets)**  
  - **Triage:**  
    1. Family: Linearly independent subsets. Nonempty: ∅ is independent → **Pass**.  
    2. Order: Set inclusion (obviously partial) → **Pass**.  
    3. Stated: "Every chain has an upper bound (union)" → **Pass**.  
    4. Invoked: "By Zorn's lemma" → **Pass**.  
    → **Triage passes** → Full check.  

  - **Full Check:**  
    1. Nonempty: ∅ included → **Pass**.  
    2. Partial order: Inclusion → **Pass**.  
    3. Upper bound: Union of chain is independent (any dependence involves finitely many vectors, contained in some chain element) → **Pass**.  
    4. Maximal element: Proof that maximal independent set spans (if not, add vector; contradiction) → **Pass**.  
    5. Hidden choice: None detected → **Pass**.  
    6. Attribution: Correctly calls Zorn → **Pass**.  
    → **Verdict: Accept**.  
    - **Note to author:** None.  

  ---

  #### **Submission 2: Student's proof that an infinite-dimensional space has a maximal linearly independent set (Zorn on finite linearly independent subsets)**  
  - **Triage:**  
    1. Family: Finite linearly independent subsets. Nonempty: ∅ is finite and independent → **Pass**.  
    2. Order: Set inclusion (obvious) → **Pass**.  
    3. Stated: "Every chain has an upper bound (union)" → **Pass** (but see full check).  
    4. Invoked: "By Zorn's lemma" → **Pass**.  
    → **Triage passes** → Full check.  

  - **Full Check:**  
    1. Nonempty: ∅ included → **Pass**.  
    2. Partial order: Inclusion → **Pass**.  
    3. Upper bound: Union of chain may be infinite (e.g., chain ∅ ⊂ {v₁} ⊂ {v₁,v₂} ⊂ ... in infinite-dim space), so not in family of finite sets → **Fail**.  
    → **Verdict: Reject**.  
    - **Note to author:** "The union of a chain of finite linearly independent sets may be infinite and thus not in the family, so Zorn's lemma does not apply. To fix, apply Zorn to the family of all linearly independent subsets (where unions preserve independence)."  

  ---

  #### **Submission 3: Maximal ideal in commutative rings without identity (Zorn on proper ideals)**  
  - **Triage:**  
    1. Family: Proper ideals. Nonempty: If ring is nonzero, {0} is proper (but not for zero ring). Author handles zero ring? Unstated → **Fail** (no trivial element for zero ring).  
    → **Triage fails** → Reject.  
    - **Note to author:** "The family of proper ideals may be empty (e.g., in the zero ring). Specify the ring is nonzero, or adjust the family to ensure nonemptiness. Additionally, the upper bound (union of chain) may not be proper—this must be proven."  

  ---

  ### **Candid Assessment of Procedure's Limits**  
  - **Errors waved through:**  
    - Subtle hidden choice (e.g., DC used in a limit construction not flagged).  
    - Flawed upper bound proofs that work for countable chains but fail for uncountable (e.g., using induction implicitly).  
    - Incorrect maximal element property (e.g., "maximal ideal" is prime—unproven).  

  - **Correct papers delayed:**  
    - Proofs with non-obvious upper bounds (e.g., in topology) require full check even if correct.  
    - Edge cases (e.g., zero ring) may force rejection even if the core idea is sound.  

  - **Assistant errors if applied mechanically:**  
    - False negatives: Assistant misses that a family is nonempty (e.g., ∅ not considered).  
    - False positives: Assistant accepts a misattributed transfinite recursion as Zorn.  
    - Escalation overuse: Assistant escalates when a step is valid with DC/countable choice.  

  **Overall:** Catches 80–90% of common errors (e.g., upper bound issues) but relies on assistant vigilance for subtler logic. Designed for speed over completeness.
