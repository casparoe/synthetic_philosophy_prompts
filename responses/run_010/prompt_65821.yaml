prompt: |-
  Our departmental mathematics magazine runs a proofs column whose stated aim is that a strong third-year undergraduate can check every published argument line by line. To that end the editorial board has adopted two standing rules: nothing in the column may depend on the full Axiom of Choice, though countable choice and dependent choice are permitted; and every appeal to a choice principle must be announced explicitly, rather than absorbed into a passing remark about a standard maximality argument. I am the column's editor. Two graduate assistants and I referee the submissions — roughly eight a month turn on a maximal-element, a chain-closure, or a transfinite construction of some kind — and none of us is a set theorist. We can give any one submission about half an hour. The single faculty set theorist who reads our escalations replies on a monthly cycle, so escalation is costly and must be reserved for questions we genuinely cannot settle.

  What we lack is a procedure. Please write one that my assistants can run on a submission of this kind. I would like it to contain:

  - A fast triage at the top: three or four questions, in order, that dispose of the majority of submissions inside ten minutes, together with the answers that clear a paper and the answers that send it to the full check.
  - The full check itself, as an ordered list of questions, each with an explicit statement of what counts as passing. At minimum it should cover whether the family under discussion is genuinely partially ordered by the relation the author names; whether it is nonempty, including the issue posed by the empty chain; whether every chain has an upper bound, with attention to chains longer than countable; whether that upper bound is itself a member of the family rather than merely a superset living outside it; whether the maximal element Zorn's lemma delivers is the object the author wants, as opposed to a maximum, or a maximal element with some further property still to be proved; how to recognise a well-ordering or transfinite-recursion argument that has been described as Zorn's lemma; and how to notice choice being spent elsewhere in the paper, unflagged, through selections of representatives, compactness of infinite products, or the existence of ultrafilters.
  - The standard failure modes, each paired with a short diagnostic an assistant can apply without knowing any set theory, and a repair step saying what to try when a check fails.
  - An escalation rule stating which questions the procedure must not pretend to answer — in particular any claim about how much choice a given theorem really requires, or that a theorem is equivalent to some choice principle — and what an assistant should write on the escalation slip so that our set theorist can answer it in one pass.
  - A one-page version suitable for taping above a desk.

  Then run the procedure on three submissions and report the verdict it produces, the check that produced it, and the note we would send the author. The first is a colleague's elegant two-paragraph proof that every vector space has a basis, obtained by applying Zorn's lemma to the family of linearly independent subsets; I argued for accepting it, and I would rather the procedure tell me now than have the board tell me later. The second is a student's proof that an infinite-dimensional space contains a maximal linearly independent set, obtained by applying Zorn's lemma to the family of finite linearly independent subsets. The third extends the familiar maximal-ideal argument to commutative rings that may lack a multiplicative identity.

  Finally, be candid about the procedure's limits: which errors it will wave through, which correct papers it will needlessly delay, and where an assistant who follows it mechanically will still come out wrong.
reasoning: |-
  We are designing a procedure for the editorial board to check submissions that use Zorn's lemma or similar maximality principles. The procedure must be executable by non-set-theorists in a short time.

  The procedure has two main parts: 
  1. A fast triage (10 minutes max) to quickly accept or reject submissions without full review.
  2. A full check for submissions that pass triage.

  We also need:
  - Standard failure modes and their diagnostics and repairs.
  - Escalation rules for questions beyond the procedure.
  - A one-page summary.

  Then we test the procedure on three examples.

  Let's design the procedure step by step.

  ### Fast Triage (First 10 minutes per submission)

  We ask the following questions in order. If any answer is "fail", the submission is rejected without full check. If all are "pass", it goes to full check.

  1. **Is the family (set) under consideration clearly defined and nonempty?**
     - Pass: The family is explicitly defined and shown to be nonempty (e.g., by exhibiting one element).
     - Fail: The family is not defined, or is defined in a way that is ambiguous, or there is no proof of nonemptiness.

  2. **Is the partial order clearly defined and does the author verify that it is indeed a partial order?**
     - Pass: The partial order relation is explicitly given and the author states (or it is obvious) that it is reflexive, antisymmetric, and transitive. If not obvious, the author provides a brief argument.
     - Fail: The partial order is not defined, or the properties are not checked (and are not obvious).

  3. **Does the author explicitly state that every chain has an upper bound in the family?**
     - Pass: The author states that for every chain in the family, there is an upper bound in the family, and provides an argument (or it is obvious).
     - Fail: The author does not state this, or it is stated without argument and is not obvious.

  4. **Does the author explicitly invoke a choice principle (like Zorn's lemma) and state that they are using it?**
     - Pass: The author says "by Zorn's lemma" or similar, and mentions that they are using a choice principle (even if they don't name it, as long as it's clear they are invoking one).
     - Fail: The author uses a maximal element without explicitly invoking a choice principle.

  If all four answers are "pass", then the submission goes to the full check. Otherwise, it is rejected at triage.

  ### Full Check

  The full check is an ordered list of questions. Each must be passed.

  1. **Is the family nonempty?**
     - Check: The author must show the family is nonempty. For example, the empty set (if it is in the family) or some trivial element must be exhibited.
     - Pass: Clear proof of nonemptiness.

  2. **Is the relation a partial order?**
     - Check: Verify that the author has defined a relation that is:
          - Reflexive: for every element x, x ≤ x.
          - Antisymmetric: if x ≤ y and y ≤ x, then x = y.
          - Transitive: if x ≤ y and y ≤ z, then x ≤ z.
     - Pass: The author states these properties and either they are obvious or the author provides a proof.

  3. **Does every chain have an upper bound in the family?**
     - Check: For an arbitrary chain (a totally ordered subset) in the family, the author must provide an upper bound that lies in the family. Note:
          - The upper bound must be an element of the family, not just a superset that is not in the family.
          - The chain might be uncountable, so the argument must work for chains of any cardinality.
     - Pass: The author provides a construction of an upper bound and shows it is in the family.

  4. **Is the maximal element obtained the desired one?**
     - Check: After applying Zorn's lemma, the author must show that the maximal element has the required property (e.g., in the vector space basis proof, the maximal linearly independent set is also spanning). The maximal element might not be a maximum (which would be the whole space) but must be shown to have the desired property (like being a basis).
     - Pass: The author proves that the maximal element is what they claim.

  5. **Is there any hidden use of choice?**
     - Check: Look for any other uses of choice in the proof that are not flagged. Common places:
          - Selecting representatives from equivalence classes.
          - Using the compactness of a product of compact spaces (Tychonoff's theorem, which requires AC).
          - Using the existence of ultrafilters.
          - Any infinite sequence of choices (which might require dependent choice).
     - Pass: The author either avoids such uses or explicitly flags any use of choice principles.

  6. **Is the argument correctly attributed?**
     - Check: If the author uses a transfinite induction/recursion, they should not call it Zorn's lemma. Similarly, if they use Hausdorff maximality principle or well-ordering, they must state that.
     - Pass: The author correctly names the principle they are using.

  ### Standard Failure Modes

  Here are common failures and how to diagnose and repair:

  1. **Failure: Family is empty.**
     - Diagnostic: The family might be defined by a condition that is never satisfied (e.g., in a vector space, if the space is {0}, the family of linearly independent sets might be empty if the author excludes the empty set? But note: the empty set is linearly independent and is usually included. However, if the family is defined as "nonempty linearly independent sets", then in the zero space, there might be none. Actually, in the zero space, the only linearly independent set is the empty set. So the family must include the empty set if the space is {0}.)
     - Repair: Check the definition of the family. If the family is empty, then the whole argument fails. The author must adjust the family to be nonempty.

  2. **Failure: Partial order not verified.**
     - Diagnostic: The relation is not reflexive (e.g., if the order is set inclusion, then it is reflexive; but if it's a different order, it might not be). Or it might not be transitive.
     - Repair: The author must add a verification of the partial order properties.

  3. **Failure: Upper bound not in the family.**
     - Diagnostic: The author takes the union of a chain and claims it is in the family, but without proving it. For example, in the vector space basis proof, the union of a chain of linearly independent sets is linearly independent, which is true. But in other contexts, it might not be (e.g., in a ring, the union of a chain of ideals is an ideal, which is okay). However, sometimes the family is defined with a finiteness condition (like finite subsets) and the union might be infinite and not in the family.
     - Repair: The author must check that the union (or whatever they take as the upper bound) satisfies the defining property of the family.

  4. **Failure: The maximal element is not the desired object.**
     - Diagnostic: The author obtains a maximal element but does not prove it has the required property. For example, in the vector space, a maximal linearly independent set is a basis only if the space is spanned by it. The author must show that if it weren't spanning, then one could add a vector and remain independent, contradicting maximality.
     - Repair: The author must add the argument that the maximal element has the desired property.

  5. **Failure: Hidden choice.**
     - Diagnostic: The author uses a choice principle without stating it. For example, in a step that says "choose an element from each set in a collection" without the sets being nonempty and without specifying how many sets there are (if uncountable, full AC might be needed).
     - Repair: The author must either avoid the use of choice or explicitly state that they are using a choice principle (like countable choice, if applicable).

  6. **Failure: Misattribution of the argument.**
     - Diagnostic: The author says they are using Zorn's lemma but actually they are doing a transfinite recursion (which might be equivalent but requires a different justification and might use more choice).
     - Repair: The author should correct the attribution or rewrite to use Zorn's lemma properly.

  ### Escalation Rule

  The procedure must not try to answer:
  - Whether a given theorem is equivalent to a choice principle.
  - The minimal amount of choice required for a theorem.
  - Whether a particular construction can be done without choice.

  If the question is about the necessity of full AC versus countable choice, or if the assistant is unsure about the validity of a step that might involve hidden choice, then escalate.

  On the escalation slip, write:
  - The exact statement of the theorem being proved.
  - The family and the partial order used.
  - The step in question (with a quote from the paper).
  - The specific concern (e.g., "Is the use of Tychonoff's theorem here avoidable with only countable choice?").

  ### One-Page Version

  We'll condense the above into a one-page checklist.

  Now, run the procedure on three submissions.

  #### Submission 1: Colleague's proof that every vector space has a basis.

  The proof applies Zorn's lemma to the family of linearly independent subsets, ordered by inclusion.

  **Triage:**
  1. Family: linearly independent subsets. Nonempty? The empty set is linearly independent, so yes. Pass.
  2. Partial order: set inclusion. This is a partial order (reflexive, antisymmetric, transitive) and it's obvious. Pass.
  3. Every chain has an upper bound: The author takes the union of a chain of linearly independent sets. The union is linearly independent (because any linear dependence would involve finitely many vectors, which would lie in some element of the chain). The union is in the family. Pass.
  4. Explicitly invokes Zorn's lemma. Pass.

  Triage passes, so full check.

  **Full Check:**
  1. Nonempty: yes, empty set. Pass.
  2. Partial order: inclusion, obvious. Pass.
  3. Upper bound: union of chain is linearly independent and is in the family. Pass.
  4. Maximal element: The author must show that a maximal linearly independent set is a basis. The proof should argue: if it weren't spanning, there is a vector not in the span. Adding that vector gives a larger linearly independent set, contradiction. This is standard and should be in the proof. Pass (assuming it's there).
  5. Hidden choice: The proof uses Zorn's lemma (explicitly) and no other choice. In vector space basis proof, no other choice is needed because the upper bound is the union and the linear independence is checked by finite subsets. Pass.
  6. Correct attribution: Zorn's lemma is correctly attributed. Pass.

  Verdict: Accept.

  Note to author: None (accepted).

  #### Submission 2: Student's proof that an infinite-dimensional space contains a maximal linearly independent set.

  The student applies Zorn's lemma to the family of finite linearly independent subsets.

  **Triage:**
  1. Family: finite linearly independent subsets. Nonempty? The empty set is finite and linearly independent, so yes. Pass.
  2. Partial order: set inclusion. Obvious. Pass.
  3. Every chain has an upper bound? The student takes the union of a chain. But the union might be infinite, and the family is finite sets. So the union might not be in the family. Therefore, the union is not an upper bound in the family. The student must provide an upper bound that is finite? But that's impossible if the chain is infinite and growing. So this fails.

  Triage fails at step 3.

  Verdict: Reject.

  Note to author: 
  "The proof fails because the family of finite linearly independent subsets may have chains (even countable ones) that do not have an upper bound in the family. Specifically, the union of an infinite chain of finite sets may be infinite and hence not in the family. Therefore, Zorn's lemma does not apply. Instead, consider using the family of all linearly independent subsets (allowing infinite sets) and then the union of a chain is linearly independent and hence in the family."

  #### Submission 3: Maximal ideal in a commutative ring without identity.

  The proof extends the maximal ideal argument. The family is the set of proper ideals, ordered by inclusion.

  **Triage:**
  1. Family: proper ideals. Nonempty? The zero ideal {0} is proper if the ring is not the zero ring. But if the ring is the zero ring, then {0} is the whole ring and hence not proper. However, in the zero ring, there are no proper ideals. So the family might be empty. The author must handle the zero ring. We assume the ring is nonzero. The author should state that the ring is nonzero. Pass (if the author does so).
  2. Partial order: inclusion. Obvious. Pass.
  3. Every chain has an upper bound: The union of a chain of proper ideals is an ideal. Is it proper? The author must show that the union does not contain 1 (since there is no identity, we must be careful). In a ring without identity, an ideal is proper if it is not the entire ring. The union of a chain of proper ideals might be the entire ring? For example, if the ring is the integers without identity (but that doesn't make sense because integers have identity) — actually, we must think of a ring without identity. Suppose we have a ring without identity and a chain of proper ideals. The union is an ideal. If it is not proper, then it contains 1? But there is no 1. So the condition for properness is that the ideal is not the entire ring. The union might be the entire ring if the chain covers the ring. The author must show that the union is proper. They usually do this by noting that if the union were the entire ring, then some ideal in the chain would contain a unit? But in a ring without identity, there might be no units. Actually, in a ring without identity, an ideal is proper if it does not contain a multiplicative identity element? But there isn't one. So the condition is simply that the ideal is not the whole ring. The union might be the whole ring. For example, consider the ring of even integers (without identity) and consider the ideals: 2Z, 4Z, 8Z, ... This chain has union 2Z? Wait, that's not the whole ring. Actually, the union of 2Z, 4Z, ... is the set of even integers, which is the whole ring? No, the ring is the even integers? Then each ideal is of the form 2^k * (even integers) = 2^k * 2Z = 2^{k+1}Z? Then the union is the set of all even integers that are divisible by a high power of 2? Actually, it's 2Z. So it's proper. But consider a different ring: the ring of finitely supported sequences of integers (without identity) and ideals of sequences that are zero in the first n coordinates. Then the union over n is the whole ring? But the ring is finitely s