  So the triage step 3: the author must show that the union of a chain of proper ideals is proper. If they don't, then it fails.

  Assume the author takes the union and claims it is proper without argument. Then:

  Triage step 3: The author states that every chain has an upper bound (the union) and claims it is proper. But we see that in some rings, it might not be. So the argument is not obvious. Therefore, if the author does not provide an argument, then it fails. If they do, we must check it in full check.

  But triage is quick. So if the author states it and it's not obvious, we might let it go to full check? The triage step 3 only requires that the author states it and provides an argument (or it is obvious). Here, it is not obvious, so if the author does not provide an argument, then fail. If they provide an argument, then we can pass triage and check the argument in full.

  Let us assume the author writes: "The union of a chain of proper ideals is an ideal and is proper because if it were not, then it would contain 1, but there is no 1 in the ring. This is not valid because without identity, the entire ring is not determined by containing 1. The condition is that the ideal is not the entire ring. So the author must show that the union does not equal the entire ring. But they might not.

  In many standard proofs for rings without identity, one uses the family of proper ideals that are "regular" (if the ring has a quasi-regular element) or one modifies the definition. But let's assume the author does not.

  For triage, we require that the author states that every chain has an upper bound and provides an argument. If the author simply states it without argument and it is not obvious, then it fails.

