     - If the assistant does not understand the partial order (e.g., a non-standard order) and misses that it is not antisymmetric.
     - If the chain upper bound argument is flawed but the flaw is subtle (e.g., in a topology setting, the union might not have the required property).
     - If the maximal element is not the desired one, and the assistant doesn't notice the gap.

  Now, we write the one-page version.

  ### One-Page Procedure (for taping above desk)

  **FAST TRIAGE (10 min)**
  1. **Nonempty family?** 
     - Pass: Explicitly defined and shown nonempty (e.g., by example).
     - Fail: Not defined or not shown nonempty.

  2. **Partial order?**
     - Pass: Order defined and properties (reflexive, antisymmetric, transitive) stated (or obvious).
     - Fail: Order not defined or properties not stated (and not obvious).

  3. **Upper bounds for chains?**
     - Pass: Author states that every chain has an upper bound in the family and provides argument (or it is obvious).
     - Fail: Not stated or no argument (and not obvious).

  4. **Choice principle announced?**
     - Pass: Author explicitly invokes Zorn's lemma or similar.
     - Fail: Uses maximal element without explicit invocation.

