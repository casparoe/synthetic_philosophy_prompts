  ### Procedure's Limits

  - **Errors it might wave through:** 
     - Hidden uses of choice that are subtle (e.g., in the construction of the upper bound, if the author uses a choice function without mentioning it). 
     - Mistakes in the proof that the maximal element has the desired property, if the mistake is not obvious.
     - If the family is nonempty but the trivial element is not provided, and the assistant doesn't notice.

  - **Correct papers it might needlessly delay:**
     - Papers that have a non-obvious upper bound argument that is correct, but the triage requires an argument and the assistant must read it in full check. This takes time, but it is necessary.

