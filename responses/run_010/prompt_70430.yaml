prompt: |-
  Our department head opens every public lecture and every funding application with the same image: excavating a site is like reading a book backwards — you begin with the last page, work toward the first, and the reading destroys the page you have just read. In the applications the image is made to do two quite different jobs. In one passage it licenses the claim that, because there is no second reading, interpretation must be fixed while the trowel is still in the ground and the record has to be exhaustive at the moment of removal. A few pages later it licenses the near-opposite claim: because the book can only be read once, and we presently lack the means to read it well, we should stop opening it and invest instead in non-invasive survey and in leaving the greater part of every site in the ground. A colleague objects that the image is worse than ambiguous — that it treats a deposit as an authored message when most of what we recover was never meant to communicate anything at all.

  I would like an audit of the analogy rather than a verdict on the colleague. Please give me: (1) an explicit mapping — what plays the role of the page, the sentence, the fixed order of pages, the author, the act of reading, the destruction of the page, and the completed book; (2) a separation of the disanalogies that genuinely bear on the two conclusions from those that are merely picturesque, with the reasons for each assignment; (3) an account of what the source domain quietly imports that the target lacks, especially regarding authorship, semantic content, and the determinacy of meaning in advance of reading; and (4) a judgment on whether each of the two conclusions survives once those imports are stripped away, or whether the analogy was carrying them the whole time.

  Please make the audit concrete against the material in front of me rather than against archaeology in general. In one trench we have a shallow pit cut through a buried soil and filled in several distinguishable episodes; sherds from a single vessel refit across three of those fills and across the pit and a ditch that appears to pre-date it; two of the contexts that produced joining sherds are stratigraphically inverted relative to one another; the whole sequence sits beneath a ploughsoil that has been moving for centuries, with visible burrow disturbance along several interfaces; we excavated perhaps a tenth of the feature's extent and left the remainder beneath an existing road; and our record consists of plans, sections, photogrammetry, and boxed samples, none of which can be re-excavated. Tell me which commitments of the book analogy that material positively falsifies, and which it merely fails to support.

  Finally, if the book is the wrong source domain, say what would serve better for these purposes — and be explicit about what work the replacement can and cannot do, since I still have to write the same two passages of the application.
reasoning: |-
  Okay, let me approach this methodically. The user presents a complex analogy critique request rooted in archaeological practice, specifically challenging their department head's persistent book-dig metaphor. 

  First, I need to unpack the explicit mapping of the analogy as currently used. The book comparison positions archaeological layers as authored pages with fixed sequential meaning - but our trench example actively contradicts this. Those stratigraphically inverted sherds alone break the "fixed page order" premise, while the scattered vessel fragments demonstrate material relationships exceeding any single "page". The burrow disturbances further undermine the notion of intact authored sequences.

  For the disanalogy analysis, I should separate consequential gaps from picturesque ones. The irreversibility of excavation does validly parallel destructive reading - that's why non-invasive methods appeal. But treating soil layers as intentional communication? That's where the metaphor smuggles in problematic assumptions. The pit fills weren't "authored"; their meaning emerges from context we reconstruct, not inherent narrative.

  The authorship import is particularly distorting. Unlike books, archaeological deposits accumulate through accidental processes and post-depositional disturbance. Our partial excavation (with road constraints) and reliance on samples makes exhaustive recording impossible anyway - directly countering the "fix interpretation now" argument. 

  Testing the two funding claims against our trench data: The "must record exhaustively" demand fails because we couldn't physically expose everything, and our joining sherds prove relationships only visible after excavation. Conversely, the "stop digging" position gains some validity from the destruction aspect, but loses force because non-invasive methods wouldn't have detected those critical refits across contexts.

  For replacement metaphors, I'm considering archival conservation rather than reading. It better accommodates partial access and physical preservation needs, though still can't resolve all interpretation tensions. The key is emphasizing that meaning isn't pre-loaded like a narrative - it's reconstructed through material relationships we actively trace.

  Throughout, I'll anchor each point to the specific trench details: the mixed fills, stratigraphic inversion, limited excavation area, and post-excavation constraints. This keeps the audit concrete rather than abstract.
answer: |-
  Here's an audit of the book analogy, grounded in your specific trench example and structured as requested:

  ### (1) Explicit Mapping of the Book Analogy
  - **Page** = Individual stratigraphic unit/context (e.g., a fill episode in the pit, buried soil, ploughsoil)  
  - **Sentence** = Artifact/feature relationships (e.g., refitting sherds, cut relationships)  
  - **Fixed Order of Pages** = Law of Superposition (youngest layers atop older ones)  
  - **Author** = Past human activity (implied intentionality)  
  - **Act of Reading** = Excavation process  
  - **Destruction of the Page** = Removal/destruction of context during excavation  
  - **Completed Book** = Fully excavated site/feature  

  ### (2) Disanalogies: Consequential vs. Picturesque  
  | **Disanalogy**               | **Consequential?** | **Reason**                                                                                               |  
  |------------------------------|-------------------|----------------------------------------------------------------------------------------------------------|  
  | *Pages have intentional sequence* vs. *Stratigraphy formed by chance/erosion* | **Yes** | Your inverted refitting sherds defy "authored" order—deposits are palimpsests of unintended consequences |  
  | *Sentences have fixed meaning* vs. *Artifacts gain meaning from context* | **Yes** | Sherds from one vessel gain significance only through spatial/stratigraphic relationships (e.g., refits across ditch/pit) |  
  | *Reading destroys pages* vs. *Excavation destroys relationships* | **Picturesque** | Both involve irreversible loss; valid core similarity |  
  | *Single reader* vs. *Multi-analyst interpretation* | **Yes** | Post-excavation analysis (e.g., refitting sherds) reveals meaning *after* "reading" (contradicts "fix interpretation now") |  
  | *Book is complete* vs. *Partial excavation* | **Yes** | Leaving 90% under the road = "reading" fragmented chapters; "exhaustive record" is impossible |  

  ### (3) Covert Imports from Source Domain  
  - **Authorship/Intentionality**: Implies deposits are *authored messages*. Your pit fills (multiple episodes, inverted stratigraphy) show accumulation is stochastic—not narrative.  
  - **Semantic Content**: Assembles meaning exists *in* the deposit. Yet your refits across contexts reveal meaning only *through* relational analysis (post-excavation).  
  - **Determinacy of Meaning**: Claims meaning is fixed pre-reading. Your burrow-disturbed interfaces prove stratigraphy is equivocal—meaning is *interpreted*, not pre-loaded.  

  ### (4) Survival of Conclusions After Stripping Imports  
  - **Conclusion 1** (*Fix interpretation during excavation*): **Fails**.  
    - *Why*: The sherd refits across inverted contexts were only identified post-excavation. Exhaustive recording is impossible (road blocks 90% of feature). Burrowing negates "definitive" reading during dig.  
  - **Conclusion 2** (*Stop digging, use non-invasive methods*): **Partially survives**.  
    - *Why*: Destruction *is* irreversible (ploughsoil movement confirms loss), so caution is valid. But non-invasive methods wouldn’t detect your refitting sherds or resolve stratigraphic inversions.  

  ### Falsified vs. Unsupported Commitments in Your Trench  
  - **Falsified**:  
    - *Fixed narrative order*: Inverted refitting sherds prove "pages" aren’t sequentially coherent.  
    - *Authorial intent*: Mixed fills and bioturbation show deposits aren’t "authored messages."  
    - *Exhaustive recording possible*: Untouched 90% under road negates this.  
  - **Unsupported**:  
    - *Destruction is total*: Your photogrammetry/samples retain data post-excavation (but lose spatial relationships).  
    - *Single "reading" suffices*: Refitting sherds required lab work—meaning emerged *after* excavation.  

  ### Replacement Analogy: **Crime Scene Investigation**  
  - **Why better**:  
    - **Evidence** (not "pages"): Artifacts/features are clues; meaning derives from context (e.g., sherd refits = ballistic matches).  
    - **Reconstruction** > **Reading**: Focus on *reassembling* events from partial, corrupted traces (like your disturbed interfaces).  
    - **Ongoing Analysis**: Lab work (sherd refitting, dating) is integral to interpretation—not fixed "mid-excavation."  
    - **Non-Invasive Methods**: Like forensic scans (LiDAR, GPR), they preserve evidence but can’t replace targeted excavation ("digging").  

  ### Work the Replacement Can/Cannot Do for Your Application  
  - **For Conclusion 1** (*Fix interpretation now*):  
    - *Can*: Emphasizes provisional hypotheses needing lab verification.  
    - *Cannot*: Justify rushed interpretation—your refits prove analysis is iterative.  
  - **For Conclusion 2** (*Invest in non-invasive methods*):  
    - *Can*: Framing as "preserving evidence" aligns with forensic best practices.  
    - *Cannot*: Argue to *never* excavate—just as some clues require physical retrieval, your ditch-pit chronology needed excavation.  

  ### Key Adjustments for Your Application Passages  
  1. **Against "fix interpretation now"**: Cite your refitting sherds—interpretation *evolved* post-excavation. Stress that recording captures *data*, not meaning.  
  2. **For "non-invasive methods"**: Highlight ploughsoil destruction and road constraints—but concede excavation remains essential for *specific* questions (e.g., chronological relationships).  

  The book analogy smuggles in untenable assumptions about intentionality and static meaning. The crime scene metaphor better accommodates ambiguity, post-depositional disturbance, and the interpretive workflow of archaeology—while still supporting cautious preservation.
