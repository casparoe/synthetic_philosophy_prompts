prompt: |-
  Please take on the role of a philosopher of causation who has also spent serious time on how historians argue about causes, and think this through carefully before answering: begin by listing the candidate concepts you would consider, rule each one in or out, and only then give me your verdict. No reading list or citations, please — I want the conceptual carving, not the bibliography.

  Last night a friend and I argued for three hours without getting anywhere, and I now suspect we were fighting over a structure neither of us could name. The pattern is this. He says that if the assassin's car had not stalled on that particular corner in Sarajevo in 1914, there would have been no world war. I say that gets the causation wrong, because within a year or two some other incident would have lit the same fuse; the great powers were already aimed at one another and any of a dozen sparks would have done it. He replies that the war did in fact follow the stalled car, so the car caused it. I reply that by the same standard I could name twenty other events, any one of which would have produced the war, so on his account nothing caused it. We repeat the identical exchange about Waterloo — if the marshal who was supposed to come up in time had not been delayed, and so on. Note what we are *not* disagreeing about: neither of us thinks the outcome was forced, and we both accept that the alternative routes existed and were never taken.

  So — is there an established concept for this configuration: an actual link in a historical chain that was the only route operated, whose removal would nevertheless have left the end point unchanged, because enough independent alternatives were available? I have read enough to know there are terms for two causes each being sufficient on their own, for cases where a backup cause exists but is blocked, and for the difference between something that brings an event about and something that merely sets the stage. None of those seems to fit, since here the route taken was genuinely the one that operated and yet was, in some sense, arbitrary. What I want is: (a) the nearest established concepts and exactly how my case departs from each; (b) whether any single term covers the departure; and (c) if not, the definition you would propose, together with boundary cases — at what point does an outcome stop being robust in this way and become genuinely fragile, so that the stalled car really was the difference-maker? A bare label will not satisfy me. I want to know where the edges of the phenomenon lie, and whether the argument I described was substantive or merely verbal.
reasoning: |-
  Okay, the user is presenting a fascinating philosophical puzzle about historical causation. They've been stuck in a loop with their friend debating whether a specific event (like the stalled car in Sarajevo) was truly necessary for WWI, given that alternative paths could have led to the same outcome. 

  First, I need to unpack what makes this case distinctive: both parties agree the outcome wasn't predetermined, yet they disagree on whether this particular spark was essential. The user explicitly rejects standard causal frameworks like overdetermination (where multiple sufficient causes exist) or preemption (where a backup cause is blocked). Their core question is about an actual cause that seems arbitrary because alternatives were available. 

  Hmm... I recall David Lewis's counterfactual theory might be relevant here, but his "causation as influence" concept doesn't quite fit since altering the stalled car's timing wouldn't change the war's occurrence. The user's scenario is more nuanced: the specific trigger is replaceable. 

  Ah! The "robust process" concept from Woodward comes to mind - where the outcome persists across variations. But robustness usually applies to mechanisms, not discrete events. Maybe I can adapt it? The stalled car was part of the actual causal chain, yet the war was "trigger-robust" due to multiple possible sparks. 

  Wait - is "actual but non-essential cause" too vague? The user wants precision about edges. When does this apply? Only when (1) alternatives are genuinely independent (not requiring the same preconditions), (2) sufficiently probable, and (3) the outcome remains qualitatively identical. The fragility threshold would be crossed if, say, only one spark could ignite that specific powder keg. 

  The friend's mistake is confusing actuality with necessity. The user's "twenty other events" point exposes this - but they might be underestimating how small changes could cascade. Still, their core insight holds: when systems are primed, many micro-events can serve functionally equivalent roles. 

  This isn't just verbal; it's about whether we attribute causal weight to contingencies vs structural conditions. For WWI, if tensions made war 99% likely in 1914-1916, then yes - the stalled car was incidental. But if tensions only made war 30% likely without that exact spark? Then it matters. 

  I should emphasize contingency vs replaceability. The marshal at Waterloo example shows this isn't about inevitability. Maybe coin "locally contingent but globally replaceable cause"? Though "replaceable trigger" might suffice. 

  Boundary case: if alternative sparks required different preconditions (e.g., a Balkan incident vs colonial clash), does the outcome remain "the same war"? That's where historians would rightly debate. The conceptual edges depend on how we define the outcome and the alternatives' plausibility. 

  Ultimately, the argument is substantive because it reveals different causal lenses: the friend focuses on the proximate chain, the user on structural vulnerability. Both capture truth, but at different levels.
answer: |-
  Here is the conceptual carving you requested, moving step-by-step through candidate concepts before delivering a verdict:

  **Candidate Concepts & Rulings:**
  1.  **Necessary Cause:** An event without which the outcome *could not* have occurred.
      *   *Ruling:* **OUT.** Both you and your friend agree the war could have occurred via other paths. The stalled car wasn't necessary.
  2.  **Sufficient Cause:** A set of conditions that *guarantees* the outcome.
      *   *Ruling:* **OUT.** The stalled car alone wasn't sufficient; it relied on the pre-existing context (tensions, alliances, etc.). It was part of a sufficient set.
  3.  **Actual Cause (Causa Efficiens):** The specific event(s) in the real, historical chain that produced the outcome.
      *   *Ruling:* **PARTIALLY IN, BUT INADEQUATE.** Your friend leans here: "the war did in fact follow the stalled car." It *was* the actual operative link. However, this concept doesn't address the *replaceability* of that link, which is your core point. It answers "what *did* happen?" not "was this link *essential*?"
  4.  **Preemption:** Where one potential cause acts first, blocking another from operating. (e.g., Backup assassin fires first).
      *   *Ruling:* **OUT.** In preemption, the backup cause is *blocked* or *prevented* from acting by the actual cause. Your scenario involves *independent alternatives* that *weren't* blocked; they simply didn't occur. The stalled car didn't prevent other sparks; they just weren't struck.
  5.  **Overdetermination:** When multiple distinct causes exist, each sufficient on its own to produce the outcome, and they all occur (or would have occurred).
      *   *Ruling:* **OUT.** Classic overdetermination requires multiple sufficient causes *present* or *guaranteed*. In your case, only *one* spark (the stalled car) actually occurred. The other sparks *could* have happened but *didn't*. The war was not overdetermined by actual events.
  6.  **Causal Redundancy / Backup Causes:** The existence of alternative potential causes that *would* have operated *if* the actual cause had failed.
      *   *Ruling:* **CLOSE, BUT INCOMPLETE.** This captures the existence of alternatives. However, standard treatments often focus on whether the backup *would* have fired *in that specific situation* if the primary failed. Your point is stronger: the *system* (great power tensions) was such that *many different* potential sparks existed independently, and *any one* of them likely *would* have ignited the war *within the relevant timeframe*. The redundancy isn't just a single backup; it's systemic.

  **The Verdict: Your Core Concept & Its Edges**

  Your scenario describes an **Actual but Replaceable Trigger within a Robust Causal Field.**

  *   **a) Nearest Established Concepts & Departures:**
      *   *Causal Redundancy:* Departs by emphasizing *systemic multiplicity* and *independence* of potential triggers, not just a single backup path. The redundancy is inherent to the state of the system.
      *   *Robustness of Process/Outcome (adapted from engineering/biology):* Departs by applying robustness to a *historical outcome* (war) dependent on a *specific triggering event* within a volatile context. It's not a designed system, but the outcome is robust *against the failure of any single potential trigger* due to the abundance of alternatives.
      *   *Contingency:* Departs because while the *specific trigger* was contingent (the stalled car), the *occurrence of *a* trigger* and the *outcome* were highly probable/non-contingent due to the system state. You're highlighting the *non-contingency* of the outcome *despite* the contingency of the specific cause.

  *   **b) Single Term?** No single, universally established term perfectly captures this configuration in historiography/philosophy. The closest descriptive phrase is **"Replaceable Trigger"** within a **"Robust Causal Field"** or **"System of High Trigger Vulnerability."**

  *   **c) Proposed Definition & Boundaries:**
      *   **Definition:** An **Actual but Replaceable Trigger** is an event that:
          1.  Was *part* of the actual sufficient causal sequence leading to Outcome O.
          2.  Belonged to a *class* of events (T1, T2, T3... Tn), any member of which, occurring within a defined spatiotemporal window and context (C), would *likely* have initiated a sufficient causal sequence leading to an Outcome O functionally equivalent (in key respects) to the actual O.
          3.  The existence of multiple, distinct, and *reasonably probable* members of class T *independent* of the actual trigger occurring is a consequence of the stable, volatile properties of the context C.
      *   **Boundary Cases - When Robustness Fades (The Trigger Becomes Essential):**
          1.  **Reduced Probability/Plausibility of Alternatives:** If the other potential triggers (T2...Tn) are highly improbable, fantastical, or require wildly different preconditions *not* present in C, then the actual trigger (T1) gains essential status. (e.g., If *only* a stalled car on *that exact corner* could have plausibly led Franz Ferdinand into the path of a competent assassin, given security plans).
          2.  **Reduced Independence:** If the occurrence of *any* alternative trigger T2 critically *depended* on the failure of T1 (e.g., a *different* assassination plot was only hatched *because* the first one failed), then T1 becomes more essential – its failure was necessary for the (different) backup to operate.
          3.  **Temporal Constriction:** If the window for triggering O is extremely short, and T1 is the *only* plausible trigger within that window, alternatives become irrelevant. (e.g., If war *had* to start in June 1914 to exploit a fleeting military advantage).
          4.  **Outcome Specificity:** If the *exact nature* of O is crucial, not just a general type, and different triggers would lead to significantly different Os. (e.g., If only the *Sarajevo assassination* could trigger a war perceived as defensive by all key powers, making mobilization swifter and more complete than a colonial incident might have). Robustness applies to the *type* of outcome (major European war), not necessarily every detail.
          5.  **Stabilizing Interventions:** If the context C is unstable but actively being stabilized, and preventing *any single* trigger is feasible for the stabilizers, then each trigger becomes more critical. (e.g., If diplomats were actively and successfully defusing each crisis, but *this one* slipped through).

  **Substantive vs. Verbal:** Your argument was **substantive**, not merely verbal. It reflects a fundamental difference in causal perspective:
  *   Your friend focuses on the **actual historical sequence:** "This specific event *did* set off the chain that *did* happen."
  *   You focus on the **counterfactual robustness of the outcome given the context:** "Given the system's state, the outcome was highly probable, and *this specific trigger* wasn't essential; any of many others would likely have sufficed soon after."

  You are arguing about the **degree of causal fragility** surrounding the trigger within the broader system. Your friend sees the outcome as fragile, dependent on that specific spark. You see the outcome as robust, the system as primed to ignite, making the specific spark replaceable. This difference has real implications for understanding historical contingency, the role of individuals/chance, and the weight given to structural factors vs. triggering events. The edges lie in the probability, independence, and sufficiency of the alternative triggers within the specific context.
