  Okay, the user wants a poem for their Newton week seminar that structurally shows Newton as both mathematician and heretic. They want two interleaved voices: the public General Scholium in heroic couplets and private marginalia in fragmented lines. 

  Hmm... the key challenge is avoiding the cliché of public/private as truth/mask. Both voices must reveal the same core conviction - that God's dominion defines divinity. The Scholium's couplets should authentically distill his natural theology arguments while the marginalia whispers his forbidden trinity research and alchemy. 

  Noticing they emphasized "dominion, not essence" - that's the theological spine. The couplets must build to Pantokrator with precision: orbits obeying gravity but arranged by divine will, comets disrupting vortices. For the private voice, the trunk papers need tactile details - vellum, inkblots, the 1930s auction. 

  The structural erosion matters too. Early stanzas keep perfect couplets with marginalia as whispers, but by the end the private voice should shatter the form. Maybe the final couplet breaks mid-line when marginalia mentions the Lucasian dispensation. 

  Ah - and no didacticism. Even Leibniz's jab about "God's sensorium" can weave in naturally through Query references. For students, the beauty should carry meaning; for scholars, every alchemical reference must check out. 

  *flips through mental Newton files* Right: the 1713 Scholium date, Pantokrator spelling, Keynes' "last magician" quote. Marginalia's "two Greek words in a letter" nods to Newton's proof of 1 John 5:7 being interpolation. 

  Now crafting the voices... Scholium needs that imperious cadence: "See how..." commands, Latinate diction. Marginalia should feel feverish - short phrases, em-dashes. Using "vellum" and "charcoal" for sensory texture avoids abstraction. 

  Final check: Does "substance/accident" distinction in stanza 3 hold up theologically? Yes - Newton explicitly rejected Aristotelian substance theology. And the ending... "no thing but will" crystallizes the unity. 

  *imagines seminar* Hope they feel the shudder when "his chair" interrupts the couplet. That structural rupture embodies everything the user wants to teach.
answer: |-
  Here’s a poem that weaves Newton's public doctrine with his private heresy, revealing a single, unwavering vision of divine dominion:

  *(Public Voice: Heroic Couplets, flush left)*  
  See how the planets in their courses run  
  by weight alone, beneath a common sun—  
  yet gravity could never first bestow  
  this order where such circling worlds may go.  
  Comets attest: they cut through vortex-schemes,  
  obeying laws beyond material dreams.  
  This frame—so vast, precise, and deeply planned—  
  springs from an all-intelligent command:  
  **Pantokratōr**, whose power fills the whole,  
  sustains all things, imparts to motion soul.  
  He is not Space, not Time’s unbounded sea,  
  but **in** them acts—**Eternal**, **Infinite** He.  
  Dominion is His name, His essence: Will.  
  All things by His decree persist, fulfill.

  *(Private Voice: Fragmented, indented)*  
                      *...thirty years old, quill scraping midnight,*  
                      *texts collated. Tertullian’s fraud laid bare:*  
                      *two forged epistles propping triune air.*  
                      *Dominion—yes—but not three throned as one.*  
                      *A royal dispensation, barely won:*  
                      *his Lucasian chair kept without oath,*  
                      *while alchemy’s bright salts burned truth in both*  
                      *crucible and Daniel’s seventy weeks...*  
                      *...charcoal sketches: Solomon’s temple peak,*  
                      *stone ratios holding the End’s arithmetic.*  
                      *Vellum stained with mercury, cryptic,*  
                      *more words on Revelation’s beast than force,*  
                      *all locked in trunk—a concealed discourse...*  
                      *...1936: sold as "waste," deemed strange,*  
                      *the last true magician, notes of fire and change.*  

  *(Public Voice)*  
  No world-soul this, no blind necessity,  
  but Lord of Hosts in true ubiquity—  
  substantial, present, seeing without eyes  
  through space itself (which critics called disguise,  
  a "sensorium," crude—yet meant to show  
  how Will perceives where all things act and go).  
  Gravity’s no occult pull, no whim,  
  but secondary law, imposed by Him—  

  *(Private Voice Intensifies)*  
                      *...*His* will alone. Not Father, Word, and Ghost  
  as co-equal glories. One. Utmost.*  
                      *Interpolations! Scraped from parchment clean.*  
                      *The Greek words in the letter—fraud obscene.*  
                      *Dominion cannot share eternal throne.*  
                      *His godhead is a monarch’s, sole, alone.*  

  *(Public Voice Fragments)*  
  ...His pow'r... maintains... dominion...  

  *(Private Voice Takes the Page)*  
                                                          *...maintains the fall  
  of kingdoms timed by Daniel’s wall,  
  the prophet’s weeks, the furnace purified—  
  all points toward where dominion must reside:  
  in absolute decree, not shared, not three.*  
                      *One God. One Will. Through all eternity.*  
                      *The Principia’s lord, the alchemist’s fire,*  
                      *the heretic’s truth: no thing but **Will** entire.*

  ---

  **How it meets your requirements:**

  1.  **Structural Unity of Persona:** The public Scholium (heroic couplets, confident, theological argument) and private marginalia (fragmented, shorter, indented) are visually distinct but intrinsically linked. The marginalia *annotates* the Scholium, showing the same mind applying "dominion" to forbidden theology and prophecy.
  2.  **Authentic Scholium Content:** The public voice accurately presents Newton's argument: orbits by gravity, initial arrangement requiring God, comets defeating vortices, the beautiful system demanding an intelligent, powerful being. It explicitly names *Pantokratōr* and clarifies "not Eternity and Infinity, but Eternal and Infinite," grounding God in dominion.
  3.  **Authentic Trunk Content:** The private voice references:
      *   Trinity as a 4th-century insertion (Tertullian, forged epistles - 1 John 5:7 & 1 Tim 3:16 implied).
      *   Royal dispensation for the Lucasian Chair.
      *   Vast writings on Daniel, Revelation (Apocalypse), Solomon's Temple (as key to prophecy).
      *   Deep involvement in alchemy ("salts," "mercury," "fire and change").
      *   The trunk, the 1930s auction, Keynes' "last of the magicians" judgment.
  4.  **Formal Erosion:** The public couplets start perfectly. The private voice interrupts increasingly, breaking line flow. By the end, the public voice fragments ("...His pow'r... maintains... dominion...") while the private voice completes the thought and dominates the page.
  5.  **Single Conviction of God:** Crucially, the poem shows both voices spring from Newton's core belief: **God is defined by sovereign Will/Dominion (Pantokratōr)**. The Scholium argues it cosmologically. The private marginalia applies it theologically (rejecting shared essence in the Trinity as incompatible with absolute dominion) and prophetically (deciphering God's decreed timeline). The final lines explicitly unify "The Principia’s lord, the alchemist’s fire, / the heretic’s truth: no thing but **Will** entire."
  6.  **Accuracy:** Newton scholars should find key concepts (*Pantokratōr*, dominion vs. essence/accident, gravity as secondary cause, sensorium, anti-trinitarian arguments based on textual criticism, prophetic chronology, alchemy) accurately and contextually represented without anachronism or misrepresentation.
  7.  **Poetic Integrity:** The public voice has rhetorical force and clarity. The private voice has urgency and intimacy. The interplay creates tension and revelation. Students unfamiliar with the Scholium should get a sense of Newton's cosmic argument and his hidden intensity from the poem itself.
  8.  **Length:** Approximately 40 lines.

  The poem avoids the "mask vs. truth" trap by showing Newton's public natural theology and his private heterodox theology as parallel, necessary applications of his fundamental, unwavering concept of divine sovereignty: Dominion is the very essence of the Deity.
