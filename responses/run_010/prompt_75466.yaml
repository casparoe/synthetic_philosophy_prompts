prompt: |-
  Last month I was sworn in as one of seven volunteer members of the historic preservation commission for a mid-sized river city in the Midwest. I am a network engineer by training, the only commissioner without a background in architecture or history, and I took the seat largely because my grandmother's storefront was demolished in 2019 over the objections of a group I had never heard of at the time. Two cases came before us in the same evening session, and I have not stopped thinking about the contrast. The first was a wooden-hulled ferryboat built in the 1920s that a maritime museum has maintained continuously: every plank, frame, deck beam, and fastener that has rotted has been replaced with new stock worked to the same shape and joined the same way, and the museum's own file suggests only a small minority of the original timbers survive. We voted unanimously that the vessel keeps its designation. The second was a stone house from the 1870s with essentially all of its original fabric intact, whose owner asked permission to move it two blocks uphill to save it from a road widening; our staff recommended against, on the ground that the guidance we work from treats a building removed from its original site as having lost something essential and therefore ineligible, unless it satisfies one of a handful of narrow exceptions.

  The rulebook we apply is a state manual keyed to the federal integrity test, which asks us to assess a nominated property along seven headings — location, design, setting, materials, workmanship, feeling, and association — and holds that a property must retain enough of them to convey why it matters. In practice the manual and our staff treat those headings very unequally. Materials are treated as almost infinitely renewable, provided the new work matches the old in shape and texture and, where possible, in substance, and provided the commission approves the work in advance; workmanship appears to be the heading that actually carries the weight, since replacement executed in the old manner is credited to the property rather than counted against it. Location, by contrast, is treated as close to non-negotiable for buildings, and rebuilding a lost structure from scratch is disfavored outright except where the copy is exceptionally well documented and exceptionally important. So we managed, in a single evening, to rule that a vessel most of whose matter is new is the same vessel we listed, while a house most of whose matter is old would cease to be the house we listed if it were carried two hundred meters. Our chairman, when I raised this afterward, said that preservation concerns significance rather than substance, which I found unsatisfying: significance looks like a property of a story we tell about a thing, and I cannot see why the story survives relocation but not replacement.

  What I want is a reconstruction of the theory of identity this practice actually presupposes, rather than a retelling of the usual puzzle about the Athenian ship. Please give me exactly five numbered items, one or two sentences each, with no introduction and no conclusion. Between them they should identify the account of what makes a designated property the same property over time that our voting pattern only makes sense under — continuity of form, continuity of workmanship, a causal-historical chain, the persistence of a functional role, the persistence of whatever the seven headings jointly track, or something else; state which rival accounts the practice positively rules out as opposed to those it merely declines to use; say whether the pairing of replaceable materials with irreplaceable location is genuinely inconsistent or reconcilable on a single account; distinguish what the practice strictly presupposes from what it merely fits comfortably with, since I suspect several incompatible theories license the very same votes; and tell me what would have to change in our rules, and in what we would be prepared to call a designated property, if the commission adopted a strict matter-continuity view instead.
reasoning: |-
  Okay, the user is a new member of a historic preservation commission, coming from a network engineering background. They're grappling with the philosophical inconsistency between two cases they voted on: a heavily reconstructed ferryboat that kept its designation versus an intact stone house that would lose its status if moved. 

  The user wants a distilled analysis of the implicit identity theory behind these decisions. They specifically asked for five numbered points without intros/conclusions, so I need to structure it like a bulletproof legal brief. 

  First, I need to identify the core principle: it's clearly about *continuity of workmanship* as the carrier of identity, since the ferry's replacements mimic original construction methods. That trumps material continuity. 

  Second, the practice explicitly rejects matter-continuity and location-essentialism for buildings, which explains the house dilemma. But for vessels? Location seems flexible there - interesting double standard. 

  Third, the inconsistency isn't logical but practical: relocation destroys a building's embedded workmanship (foundations, site adaptation) while ships are mobile by nature. That salvages coherence. 

  Fourth, I should flag that this framework *allows* but doesn't *require* other factors like historical associations - they're bonuses, not necessities. 

  Finally, the thought experiment: if they switched to matter-continuity, they'd have to scrap the ferry's status and permit building relocations. Might even force them to designate ruins! 

  The user's grandma's demolished storefront suggests personal stakes. They're likely probing whether the rules that failed her could be reformed. I'll keep the response clinical but leave room for that subtext.
answer: |-
  Here are five numbered items reconstructing the identity theory implied by your commission's practice:

  1.  **Primary Identity Carrier:** The practice presupposes that identity resides primarily in the *continuity of tangible form and craft* (workmanship manifest in material shape and assembly). A property remains itself so long as its physical structure is maintained or meticulously re-created using the *same methods and techniques*, even with replaced materials, as this embodies the original design intent and skill.
  2.  **Ruled-Out Accounts:** This practice positively rules out strict *matter-continuity* (where replacing most original substance negates identity) and *essentialist location* for buildings (where moving from the original site inherently destroys identity, regardless of fabric). It merely declines to rely solely on *historical association* or *functional role* as sufficient identity carriers without tangible continuity.
  3.  **Reconciling Replaceable Materials & Irreplaceable Location:** The pairing is reconcilable under a single account: *workmanship continuity is site-embedded for buildings but not vessels*. For a building, its foundations, orientation, and adaptation to the specific terrain are seen as integral components of its crafted form; relocation severs this embodied workmanship. A vessel's identity, however, is defined by its crafted, mobile form and function, making location non-essential.
  4.  **Presupposed vs. Compatible:** The practice strictly presupposes that *workmanship-as-manifest-in-physical-form* is the necessary core of identity. It fits comfortably with, but does not strictly require, strong *historical associations* or *original design integrity* as independent factors; these often accompany the core but a property lacking them (like a relocated building) could theoretically retain identity *if* site-embedded workmanship were maintained (which relocation prevents).
  5.  **Implications of Matter-Continuity Adoption:** Adopting strict matter-continuity would require: (a) removing designation from properties with significant material replacement (like the ferry), (b) permitting relocation of intact buildings (like the stone house) since matter persists, and (c) potentially designating ruins or fragments where original matter persists, even if form/function are lost. "Designated property" would shift meaning from *continuing crafted entity* to *collection of original substance*.
