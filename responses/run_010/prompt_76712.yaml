answer: |-
  Here's a faithful restatement of Rousseau's arguments against the theater using your vocabulary, followed by a clear residue report addressing your specific questions.

  **Rousseau Translated:**

  1.  **Rejection of Catharsis:** *Rousseau:* Theater doesn't purge passions (like pity or fear); it actively feeds and rehearses them, making them more potent and habitual. *Your Terms:* **Emotional Contagion** / **Habit Formation via Repeated Exposure.** *Mapping:* **Distortion.** Your terms describe the *mechanism* (exposure triggers/reinforces feeling) well. Rousseau's key distortion is the *normative claim* that this rehearsal inherently *strengthens* the passion for *negative effect* outside the theater, replacing the Aristotelian claim of purgation. Your framework describes the reinforcement but is agnostic on its inherent moral/political harm.

  2.  **Flattering Existing Sentiments:** *Rousseau:* Plays succeed by reflecting and amplifying the audience's pre-existing biases and sentiments (like national pride, class prejudice, conventional morality), not by challenging or correcting them. *Your Terms:* **Confirmation Bias** / **Algorithmic Affordances Driving Engagement via Familiarity** (like recommending content aligning with existing views). *Mapping:* **Cleanly on Mechanism, Distortion on Intent/Outcome.** The *mechanism* of appealing to existing sentiments maps cleanly to confirmation bias/engagement optimization. The *distortion* lies in Rousseau's claim this is the *only* way plays succeed and that it *necessarily* prevents correction. Your framework allows for content that challenges (even if algorithms often favor the familiar) and doesn't assume reinforcement is inherently bad or prevents change.

  3.  **Weeping Substitutes Action:** *Rousseau:* Consuming moving spectacles (like tragic suffering) allows spectators to *feel* strong emotions (pity, indignation) in the safety of their seat. This emotional expenditure *satisfies* the impulse, replacing the need for real-world action addressing the suffering witnessed. *Your Terms:* **Slacktivism** / **Performative Empathy.** *Mapping:* **Cleanly on Phenomenon, Distortion on Universality.** The phenomenon of virtual/spectated emotion substituting for costly action maps cleanly to slacktivism. The *distortion* is Rousseau's implication this substitution is *inherent* and *total* in theatrical experience. Your framework recognizes this substitution *can* happen but doesn't assume it *always* does or that the emotional experience lacks value.

  4.  **Actor's Trade as Degrading:** *Rousseau:* Acting is a profession of inherent moral degradation. The actor publicly sells their very person (voice, face, emotions) for money, becoming dependent on the fickle applause of strangers. This creates a person whose public self is a performance for hire, eroding authentic character and creating unhealthy dependence on external validation. *Your Terms:* **Self-Commodification** / **Dependence on Audience Validation & Monetization.** *Mapping:* **Partial Cleanliness, Significant Distortion.** The core elements of selling aspects of the self and dependence on audience approval/money map partially. The *major distortion* is Rousseau's profound *moral condemnation* of this act as inherently degrading to the *soul* or *character*, framed as a fundamental violation of integrity and independence. Your framework describes the *behavior and incentive structure* but lacks this strong, inherent moral dimension tied to core identity degradation.

  5.  **Luxury, Inequality & Funding:** *Rousseau:* Establishing a permanent theater in a small republic like Geneva is inherently corrupting. It's a luxury project funded by the wealthy, concentrating resources and creating a space favoring elite tastes and social display. This fosters inequality, distracts from civic duty, and imports foreign (French) morals incompatible with republican virtue. *Your Terms:* **Platform Capitalism/Governance** / **Exclusionary Affordances** / **Context Collapse Favors Dominant Groups.** *Mapping:* **Cleanly on Structural Critique.** The critique of how funding models (wealthy patrons/backers) shape the space, favoring specific groups (elites), promoting luxury over utility, and potentially undermining local values/culture maps very cleanly to critiques of platform governance, monetization creating exclusion, and context collapse amplifying dominant voices/norms.

  6.  **Festival Alternative:** *Rousseau:* Instead of passive spectatorship, he proposes public festivals. Here, there is no distinction between performer and audience; the people *are* the spectacle, actively participating in dances, games, and civic celebrations. This fosters genuine community bonds, transparency between citizens ("souls transparent to one another"), shared joy, and authentic collective expression without dependency or performance-for-hire. *Your Terms:* **Participatory Culture** / **Audience-as-Performer** / **Community Building.** *Mapping:* **Partial Cleanliness, Core Distortion.** The *surface structure* of blurred performer/audience lines and participation maps. The *core distortion* is the **absolute erasure of the performer/spectator distinction** and the **absence of any transactional or professionalized core.** Rousseau's festival has *no central performer*; the collective *is* the performance for itself. Your framework's "participation" usually implies participating *in* or *around* a central performance or platform activity, often with underlying structures (algorithms, monetization, central figures). Rousseau's ideal has *none* of that.

  **Residue Report:**

  Your hypothesis is largely correct. The core residues left untranslated are:

  1.  **Character Formation:** Rousseau's entire argument hinges on how practices *shape moral character* – the actor's character degrades through performance-for-hire; the spectator's character weakens through vicarious emotion and reinforced prejudices; the citizen's character strengthens through authentic communal action. *Verdict:* **Defect of Your Framework.** "Self-presentation," "emotional labor," and "behavior" describe observable actions and surface management. They lack the deep, developmental, *moral* dimension of "character" as an integrated, habituated disposition formed through repeated practices. Media studies often analyzes effects on attitudes or behaviors, less so on the foundational formation of *moral character* itself.
  2.  **Souls Transparent to One Another:** This signifies an ideal of unmediated, authentic mutual recognition and understanding within a close-knit community, free from performative masks or dependence on external validation. *Verdict:* **Vagueness/Moralized Vocabulary in Rousseau.** While pointing to a genuine ideal of deep community cohesion and authenticity, the language ("souls," "transparent") is highly metaphorical and moralized. It functions as a powerful rhetorical contrast to the perceived falsity of the theater but lacks a concrete sociological or psychological mechanism in Rousseau's text. Your framework's lack of equivalent is partly due to its inherent vagueness as a *prescriptive ideal* rather than an analytical tool.
  3.  **Political Body Seen Doing Things Together:** This is the essence of the festival and core to Rousseau's republicanism. Politics isn't just governance; it's the visible, collective *action* and *expression* of the citizen body *as a body*. This spectacle *is* the polity constituting itself authentically. *Verdict:* **Defect of Your Framework.** Concepts like "engagement," "community building," or "participation" capture aspects of interaction but not the *constitutive* political dimension. The idea that the *visible collective action itself* is the primary political act, forging unity and identity, finds no direct counterpart in media studies vocabulary focused on individual/audience behavior, platform structures, or even collective *sentiment* rather than collective *embodied action as political foundation*.

  **Addressing Your Sub-Questions:**

  1.  **Actor Critique vs. Emotional Labor:** Your advisor's mapping is **a legitimate but incomplete translation leading to a category error if taken as sufficient.** Hochschild perfectly describes the *mechanism*: managing feelings for a wage, surface acting. Rousseau *would* see this as part of the degradation. **However, Rousseau adds crucial dimensions Hochschild doesn't supply:**
      *   **Moral Degradation of the Self:** It's not just labor; it's selling one's *very person*, fragmenting or corrupting the authentic self/core character.
      *   **Dependence & Standing:** The profound degradation comes from *dependence* on the *applause/judgment of strangers* for livelihood and self-worth. This creates a specific, low social standing – being a "public entertainer" reliant on others' whims. Hochschild focuses on the internal cost of managing feeling *for* an audience (employer/customer); Rousseau focuses on the existential cost of *being dependent on* the audience's validation *as* the product. The tipped streamer *is* a modern analogue for Rousseau's actor **precisely because** they monetize their person and depend on audience validation/loyalty (tips, subs, chat engagement). Hochschild explains *how* they manage their feelings; Rousseau explains *why* that dependence is seen as inherently degrading to their moral standing and character.

  2.  **The Festival vs. Chat:** **The festival does NOT survive contact with the modern chat example.** Your suspicion is correct: "Participation" in your sense is the *wrong counterpart concept*.
      *   **Monetization & Central Performer:** The presence of monetization (tips, subs, ads) and a *professional performer at the center* fundamentally violates Rousseau's core principle. His festival has *no* transaction and *no* central figure; the people celebrate *themselves*.
      *   **Algorithmic Sorting:** This introduces artificial mediation and potential manipulation/division, antithetical to the spontaneous, unified collective action Rousseau envisions.
      *   **Collapse of Distinction:** While chat blurs lines, it blurs them *around* and *in service of* the central performer/performance structure. Rousseau abolishes the distinction entirely; there is only the collective acting *as* the collective, for itself. Chat is "participation" *within* a fundamentally theatrical structure (central broadcaster, audience). Rousseau's festival is an *alternative structure* with no such division. Your framework accurately shows that the pure festival ideal collapses when inserted into a platform-mediated, monetized environment with a professional core, revealing that modern "participatory" spaces still structurally resemble the theater (central figure, spectators, transactional elements) far more than Rousseau’s festival. The key residue here is the **absolute absence of hierarchy and transaction in the collective self-spectacle.**

  The glibness of calling Rousseau the "first attention-economy critic" arises because while he identifies mechanisms *analogous* to engagement optimization, confirmation bias, and self-commodification, his *entire normative framework* – built on character formation, authenticity, independence, and collective political action – relies on concepts largely foreign to, or actively excluded by, the assumptions and vocabulary of contemporary media studies focused on behavior, platforms, and metrics. The residue isn't just missing pieces; it's a fundamentally different foundation for critique.
