answer: |-
  Here is a specification of desiderata for a theory of belief under logical uncertainty for computationally bounded agents, addressing your explicit cases and core concerns. Items marked **[Non-Negotiable]** are considered fundamental to the concept of bounded logical reasoning; others represent important but potentially debatable goals.

  ### Core Desiderata

  1.  **Non-Dogmatism for Uncomputed Sentences:** The theory must assign non-extremal (0 < P(φ) < 1) probabilities to contingent sentences φ about which the agent has performed *no computation whatsoever*, unless dictated by background knowledge. **Motivation:** Assigning 1 or 0 to an unexamined contingent sentence implies unjustified certainty. A default of 0.5 is *not* innocent; it encodes a specific, strong symmetry prior. **Negotiability:** **[Non-Negotiable]** for contingent sentences. *Where structure comes from:* The theory must explicitly define its prior distribution over logical sentences or the generative process for initial beliefs (e.g., simplicity prior, program length). It *must* declare the smuggled-in prior.

  2.  **Distinguishing Unverified Tautologies from Failed Searches:** The theory must treat a tautology φ (e.g., a propositional tautology too long to verify within budget) differently from a complex conjecture ψ (e.g., Goldbach's) that the agent has actively tried and failed to prove/disprove after significant computational effort. **Motivation:** The agent's state of evidence differs radically: for φ, lack of evidence is solely due to resource limits; for ψ, lack of evidence includes the *negative result* of a failed search. **Negotiability:** **[Non-Negotiable]**. Collapsing these states misrepresents the agent's epistemic situation.

  3.  **Coherence in the Limit:** As the agent's computational resources tend to infinity (or time for computation tends to infinity), its beliefs must converge to a coherent probability assignment (satisfying the probability axioms) over the language, ideally converging to truth for decidable sentences. **Motivation:** Ensures the theory approximates ideal rationality under unbounded resources. **Negotiability:** **[Non-Negotiable]**. (But see D10).

  4.  **Finite Non-Exploitability (Bounded Trader):** No computationally bounded "trader" (an entity making finite bets based on the agent's current beliefs) should be able to exploit the agent's belief state for guaranteed expected profit *at any finite time step*, according to the agent's own belief state at that time. **Motivation:** Prevents Dutch books by realistic adversaries, capturing a minimal dynamic consistency requirement for bounded agents. **Negotiability:** **[Non-Negotiable]** (Core to the "no-exploitability" camp; essential for pragmatic adequacy).

  5.  **Sensitivity to Effort & Evidence:** The belief state must be updatable based on *partial computational results* (e.g., finding a sub-proof, verifying a lemma, failing to find a proof after N steps, sampling models). **Motivation:** A bounded agent learns *during* computation; its beliefs should reflect intermediate evidence. **Negotiability:** **[Non-Negotiable]**.

  6.  **Handling Testimony:** The theory must incorporate non-logical evidence, like a trusted colleague claiming "I proved φ". This should update P(φ) significantly upwards, *even if φ is complex and unverified internally*. However, P(φ) should remain < 1 until internal verification or overwhelming corroborative evidence. **Motivation:** Real agents rely on social epistemology. Ignoring testimony is unrealistic; treating it as absolute certainty is reckless. **Negotiability:** Preference (but highly desirable).

  7.  **Robustness to Self-Reference:**
      *   **Future Beliefs:** Sentences like "The probability this agent assigns to φ at time t+1 will be > 0.9" must have well-defined probabilities. The theory shouldn't lead to paradoxical fixed points or trivialization. **Motivation:** Agents reason about their own future reasoning states.
      *   **Halting/Resource Bounds:** Sentences like "This computation will halt within budget" or "This search will find a proof" must be handled without contradiction or infinite regress. **Motivation:** Agents reason about their own computational limits.
      *   **Negotiability:** **[Non-Negotiable]** for well-formedness/consistency. *How well* it handles them is a preference.

  8.  **Asymptotic vs. Finite Guarantees Flagged:** Any guarantee offered by the theory *must be explicitly stated* as holding either at every finite stage or only asymptotically. **Motivation:** For an agent running with fixed finite compute *now*, asymptotic guarantees (like limit coherence or calibration) are irrelevant. Finite guarantees (like bounded non-exploitability) are operationally meaningful. **Negotiability:** **[Non-Negotiable]** for clarity & applicability.

  9.  **Computational Tractability (in Principle):** The belief state should be computable *in principle* by an agent with sufficient (but finite) resources relative to its current state and history. It cannot require solving undecidable problems or evaluating unbounded searches *just to define the current state*. **Motivation:** A theory defining a state fundamentally uncomputable even given large resources is not a theory for a *bounded agent*. **[Non-Negotiable]**.

  ### Conflicts and Breaking Points

  *   **Conflicting Triad (Finite Coherence, Sensitivity, Computability):**
      *   **Desiderata:** Strict Coherence at every finite step (P(φ) = 1 iff ⊨ φ, P(φ) = 0 iff ⊨ ¬φ) (Stronger than D3), D5 (Sensitivity - beliefs change based on partial effort), D9 (Computational Tractability).
      *   **Conflict:** Suppose the agent spends its finite budget searching for a proof of a very long tautology τ. It finds nothing (partial result). D5 suggests P(τ) < 1. But D9 requires the state is computable, and strict coherence requires P(τ) = 1. Contradiction. **Resolution:** Strict coherence *at finite stages* is **impossible** for bounded agents. D3 (Limit Coherence) is the achievable relaxation. D4 (Finite Non-Exploitability) is the pragmatic finite-stage substitute for full coherence.
  *   **Default Probability vs. Prior Declarations:** D1 forces structure. If the theory uses anything other than a uniform prior (like 0.5 by default), it *must* explain the prior's origin (e.g., simplicity, minimum description length) and justify why *that* prior is suitable for logical uncertainty. Justifying a specific non-uniform prior over logical space is extremely difficult. Many proposals fail here by being opaque.
  *   **Non-Exploitability Discriminatory Power:** D4 (Finite Non-Exploitability) remains discriminative *only if* the traders are sufficiently powerful. If traders are restricted *too* much (e.g., only constant-time strategies), the condition becomes vacuously satisfiable by many inadequate theories (e.g., always assigning 0.5). Traders must be powerful enough to implement arbitrage strategies based on *patterns* the agent should recognize (e.g., failing to notice obvious inconsistencies after reasonable effort). Finding the "sweet spot" for trader power is key.

  ### The Single Most Eliminating Desideratum

  *   **D4: Finite Non-Exploitability (Bounded Trader)** eliminates the most candidates. Textbook Bayesianism fails catastrophically (easily Dutch booked). Naive proof-length approaches (D12) often fail because they don't update dynamically or handle trader strategies exploiting predictable belief changes based on computation paths. Many heuristic approaches are exploitable by clever bounded traders.

  ### Contender Scorecard (Brief)

  1.  **Textbook Bayesianism (Logical Omniscience):**
      *   **Fails:** D1 (Dogmatic), D2 (Collapses), D4 (Highly Exploitable), D5 (No partial updates), D6 (Ignores testimony or misapplies it), D7 (Often undefined/paradoxical), D8 (Irrelevant as it's "always on"), D9 (Untractable). Only satisfies D3 (trivially/asymptote).
      *   **Verdict:** Inadequate for bounded agents.

  2.  **Bounded-Trader No-Exploitability (e.g., Logical Induction):**
      *   **Satisfies:** D3 (Asymptotic), D4 **[Finite Guarantee - Core]**, D5 (Via market mechanism/update), D6 (Can incorporate), D7 (Handles carefully), D8 (Flags guarantees clearly), D9 (Computable approx.).
      *   **Challenges:** D1 (Prior is complex/emergent), D2 (Does distinguish via market state/effort tracking). Justifying the *specific* prior/structure arising from the construction is the main philosophical hurdle (D1).

  3.  **Shortest-Proof-Length Approaches (e.g., `P(φ) ≈ 1 / (1 + 2^{K(proof|φ|)})`) :**
      *   **Satisfies:** D3 (Asymptotic - if Kolmogorov-complexity based), D9 (In principle, though K is semi-computable).
      *   **Fails/Challenged:** D1 (Prior is very strong/specific), D2 (Poor distinction - unverified tautology has P~0 until proof is found, same as failed search), D4 (Often exploitable - beliefs don't update based on *current* search state, only global shortest proof), D5 (Lacks mechanism for partial evidence), D6 (Hard to incorporate), D7 (Problematic), D8 (Often only asymptotic guarantees discussed).
      *   **Verdict:** Better than 1, but generally inadequate on dynamics, finite guarantees, and reflecting the agent's specific state of effort/evidence.

  ### Summary for Bounded Agents

  An adequate theory **must** provide finite-stage guarantees against exploitation by bounded adversaries (D4), distinguish uncomputed sentences from the results of failed computation (D2), handle self-reference robustly (D7), be computationally tractable in principle (D9), clearly flag asymptotic guarantees (D8), and converge to coherence (D3). It **must abandon** strict coherence at finite stages. The biggest challenge is providing a justified, non-dogmatic prior structure for uncomputed sentences (D1) while satisfying the non-exploitability condition (D4). The bounded-trader approach currently offers the most compelling solution for finite-stage guarantees and dynamics, despite challenges in justifying its emergent prior structure. Proof-length approaches generally fail on dynamics and finite guarantees.
