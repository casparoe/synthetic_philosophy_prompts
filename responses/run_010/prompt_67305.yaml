  Okay, the user is an MA philosophy student preparing for a seminar on vagueness and the Sorites paradox. They're reading Peirce's 1878 essay and are stuck on a specific passage where Peirce criticizes logicians' definition of "distinct ideas." The user wants to know if Peirce is attacking the demand for precise definitions, which could relate to vagueness in predicates, or if he's just critiquing the logicians' account of distinctness. They're also curious about whether Peirce's alternative pragmatic method results in concepts with sharper or vaguer boundaries.

  Peirce is definitely targeting the logicians' limited understanding of distinctness here. The key is that he objects to conflating distinctness with abstract definition alone. For Peirce, distinctness requires more than just precise definitions; it needs pragmatic applicability. Logicians stop at abstract definitions, but Peirce argues they're missing the crucial step of connecting concepts to real-world effects through his pragmatic maxim. 

  The user might be hoping to connect this to the Sorites paradox. Peirce isn't advocating for blurry concepts; he's saying that meaning isn't just about abstract definitions but about practical consequences. Vagueness arises because our concepts are tied to experiential effects that don't always have sharp boundaries. The pragmatic maxim might actually help clarify where boundaries lie by focusing on practical differences.

  The user's deeper need is probably to find a Peircean argument against sharp boundaries in vague predicates. While Peirce doesn't explicitly discuss vagueness here, his critique lays the groundwork for it by emphasizing that concepts gain meaning through use and effects, not just definitions. This implies that some predicates are inherently vague because their applications depend on context and practical outcomes. 

  The passage resists the reading that Peirce wants vaguer concepts because he emphasizes improving clarity through pragmatism. His goal isn't to embrace vagueness but to achieve a more robust clarity that accounts for real-world application. So the user can argue that Peirce provides a foundation for understanding vagueness as a feature of how concepts function practically, not as a defect to be eliminated by stricter definitions.
answer: |-
  Ah, an excellent passage to grapple with, especially for your seminar focus. You're right to sense ambiguity here; Peirce is crafting a dense critique, and extracting a "line on vagueness" requires careful parsing. Let me sketch the two readings you're intuiting, explain where I land, and why the text pushes back against the simpler "attack on precise definitions" reading.

  **Reading 1: Attacking Precise Definitions as Such (The Vagueness-Friendly Reading)**
  On this view, Peirce is fundamentally objecting to the logicians' core demand that ideas must have "precise definitions in abstract terms" to be "distinctly apprehended." He sees this requirement as artificial, disconnected from how ideas actually function in thought and inquiry, and ultimately impossible or undesirable for many concepts – precisely *because* many concepts are inherently vague. His complaint about logicians "slumbering" and ignoring "modern thought" (presumably scientific and empirical advances) suggests they cling to an outdated, overly formalistic ideal of precision that fails to capture the richness and, crucially, the *indeterminacy* inherent in our conceptual landscape. His dismissal of mere subjective "familiarity" as insufficient for *real* clearness reinforces that he's after a more robust account, but one that might *accommodate* rather than *eliminate* the blur we encounter (like in Sorites-prone predicates). The "better method" he promises might then yield concepts whose boundaries are context-sensitive or purpose-relative, accepting vagueness as legitimate.

  **Reading 2: Attacking the *Insufficiency* of Precise Definitions (The Pragmatic Clarity Reading)**
  On this view, which I find more textually compelling, Peirce isn't objecting to the *possibility* or *desirability* of precise definitions *per se*. His target is the logicians' *complacency* in thinking that providing such a definition ("in abstract terms") constitutes the *entirety* of making an idea distinct. He's outraged they stop there. He agrees that distinctness requires clarity, but argues that the logicians' definitional distinctness is shallow and potentially "entirely mistaken" because it lacks a crucial component: connection to *conceivable practical consequences*. His criticism is that logicians conflate *verbal* precision (having a definition) with *real* understanding (knowing what the idea *means* in terms of its effects on conduct or experience). The "enginery of modern thought" he accuses them of ignoring is likely the scientific method and pragmatic attitude – demanding that ideas be grounded in observable differences. The "better method" he proposes (the pragmatic maxim) isn't designed to make concepts *vaguer*; it's designed to make them *truly clear* by anchoring their meaning to experiential outcomes. This clarity *might* sometimes reveal inherent vagueness (where conceivable consequences *don't* point to a sharp boundary), but its primary aim is deeper understanding, not blur.

  **Why I Defend Reading 2 (The Pragmatic Clarity Reading)**

  1.  **The Target is Complacency, Not Precision:** Peirce explicitly states his problem is that logicians "leave the subject" after abstract definition. He doesn't say definitions are wrong; he says they are *inadequate* for achieving genuine distinctness. His scorn is for their intellectual laziness, not the goal of distinctness itself.
  2.  **The Critique of "Subjective Feeling":** His earlier dismissal of mere familiarity as a basis for clearness shows he demands something more objective and reliable than subjective comfort. This aligns with the pragmatic maxim's focus on publicly accessible, conceivable practical bearings. He wants a *better kind* of clarity and distinctness, not an abandonment of the ideal.
  3.  **The Promise of a "Better Method":** He frames his project as formulating a "better method of attaining clearness," implying he *values* clearness and distinctness highly, but finds the logicians' method deficient. The pragmatic maxim is offered as a superior means to achieve *robust* clarity.
  4.  **The Pragmatic Maxim's Function:** When Peirce introduces the maxim ("Consider what effects, which might conceivably have practical bearings, we conceive the object of our conception to have..."), its purpose is to *clarify* meaning by linking it to experiential differences. It's a tool for *testing* and *specifying* meaning, often *exposing* vagueness where practical consequences fail to determine a unique application, but its intent is illumination, not endorsement of fuzziness.
  5.  **"Distinctness" vs. "Precision":** Peirce uses the logicians' term "distinct" (linked to definitional containment) but redefines its *achievement*. He doesn't necessarily reject the *need* for precision where possible; he rejects the idea that formal definition alone *suffices* for understanding. The pragmatic test might *reveal* that a concept lacks sharp boundaries (i.e., is vague) in a specific context, but it might also *sharpen* our understanding of its application by focusing on concrete effects.

  **Where Reading 1 (Attack on Precision) Resists the Text**

  *   Peirce never says definitions are impossible or undesirable. He says relying *only* on them is inadequate.
  *   His rhetoric is about logicians being *asleep* and needing to apply *modern* (scientific, empirical) methods to *improve* logic. This suggests progress towards *better* understanding, not a retreat from clarity.
  *   His own pragmatic maxim is framed explicitly as a method for attaining *clearness* – a higher grade of it. He is fundamentally pursuing *greater* conceptual rigor, albeit a rigor grounded in practice, not just abstract formalism.

  **The Peircean Line on Vagueness from This Passage**

  While this specific passage isn't *about* vagueness per se, it lays the crucial groundwork for Peirce's later, explicit views. The key insight here is:

  *   **Meaning is Consequential:** The meaning of a concept lies not (just) in its abstract definition, but in the conceivable practical differences its application entails.
  *   **Vagueness as Indeterminacy in Practical Consequences:** Therefore, a concept is vague when there are conceivable situations where the totality of its conceivable practical consequences fails to determine whether it applies or not. The "heap" in the Sorites is vague because, for borderline cases, there is *no conceivable practical difference* that would turn on calling it a heap or not-a-heap in that specific context. The boundaries are genuinely indeterminate where practical effects don't force a decision.

  Peirce isn't saying "vagueness is fine, stop demanding precision." He's saying the logicians' *method* for achieving clarity (abstract definition) is fundamentally flawed because it ignores the practical dimension of meaning. His pragmatic method provides a *test* for meaning, and this test *exposes* vagueness where it exists (by revealing a lack of decisive practical consequences in borderline cases). He would likely argue that the Sorites paradox arises from a flawed conception of meaning (the logicians' abstract definitional view) and dissolves, or is at least properly diagnosed, when meaning is understood pragmatically. The paradox highlights the genuine *indeterminacy* inherent in vague predicates, an indeterminacy revealed by the pragmatic method's focus on practical bearings. So, yes, there is a powerful Peircean line here: the demand for "precise definitions in abstract terms" is indeed part of the *problem* underlying the Sorites, because it misunderstands where meaning (and thus boundaries) actually reside – in conceivable practical effects. The solution isn't abandoning clarity, but seeking a deeper, pragmatic clarity that acknowledges indeterminacy where it genuinely exists. This is fertile ground for your seminar – focus on how the pragmatic maxim *diagnoses* vagueness rather than simply accepting or rejecting it. Good luck!
