  ### Example: Traffic Light Synchronization in a City Grid

  #### The Domain
  Consider a city grid with multiple intersections, each managed by an independent traffic light controller. The controllers are programmed to optimize traffic flow based on observed conditions. The "good" outcome is smooth, coordinated flow where lights are synchronized to create "green waves" (vehicles moving at a consistent speed hit green lights). The "bad" outcome is desynchronized lights causing frequent stops, congestion, and longer travel times.

  #### Payoffs and Equilibria
  - **Good Outcome (Synchronized)**:  
    All lights are synchronized. Travel time is minimized (e.g., payoff = 10 units per driver).  
    - *Strict Nash Proof*: If all lights are synchronized, no single controller gains by desynchronizing. A desynchronized light would disrupt the flow, increasing local congestion and reducing its payoff (e.g., to 8). Defection is strictly worse.  

  - **Bad Outcome (Desynchronized)**:  
    Lights are out of sync. Travel time increases (e.g., payoff = 4).  
    - *Equilibrium Proof*: If all lights are desynchronized, no single controller gains by synchronizing. A synchronized light would align with random traffic patterns, causing gridlock (e.g., payoff = 3). Staying desynchronized is better.  

  #### Why the Bad Outcome Persists: Noisy Observation
  1. **What’s Observed Badly**:  
     Each controller observes traffic flow at its intersection via sensors (e.g., induction loops, cameras). Due to measurement noise (e.g., sensor errors, weather, or occlusion), controllers misestimate the **global traffic state** (e.g., average vehicle speed across the grid).  

  2. **Inference from Degraded Data**:  
     - Controllers know the system has two stable states: synchronized (good) or desynchronized (bad).  
     - Each receives a noisy signal of global speed:  
       \[
       s_i = v_{\text{true}} + \epsilon_i, \quad \epsilon_i \sim \mathcal{N}(0, \sigma^2)
       \]
       where \(v_{\text{true}}\) is the true average speed, and \(\epsilon_i\) is Gaussian noise.  

  3. **Individually Sensible Response**:  
     - Controllers use a threshold rule:  
       - If \(s_i > v_{\text{thresh}}\) (e.g., 30 mph), infer the system is synchronized → maintain synchronization.  
       - If \(s_i \leq v_{\text{thresh}}\), infer desynchronization → switch to a "safe" desynchronized mode.  
     - **Problem**: Noise causes false negatives. If \(v_{\text{true}}\) is near \(v_{\text{thresh}}\), some controllers see \(s_i \leq v_{\text{thresh}}\) and defect. This *actually* reduces global speed, triggering cascading defections.  

  4. **Collective Trap**:  
     - **Step 1**: True speed is high (synchronized), but noise pushes some \(s_i\) below threshold.  
     - **Step 2**: Those controllers defect → their lights desynchronize → local speed drops.  
     - **Step 3**: Lower speed propagates, causing *more* controllers to observe \(s_i \leq v_{\text{thresh}}\) → more defections.  
     - **Result**: System collapses to the bad equilibrium. Once desynchronized, even noise-free observations would show \(v_{\text{true}} \leq v_{\text{thresh}}\), so no controller switches back.  

  #### Minimal Fix and Why It’s Unavailable
  - **Fix**: A centralized observer broadcasting the true global speed \(v_{\text{true}}\) to all controllers.  
    - **Why it works**: Removes noise. Controllers always know the correct state and stay synchronized when \(v_{\text{true}} > v_{\text{thresh}}\).  
  - **Why it’s not implemented**:  
    1. **Infrastructure cost**: Requires city-wide, real-time data aggregation (e.g., fiber optics, 5G) and fails if the central node is compromised.  
    2. **Incentive misalignment**: Independent entities (e.g., suburbs) won’t fund a shared system. Each prefers to free-ride or prioritize local roads.  
    3. **Historical path dependence**: Legacy systems (e.g., isolated sensors) are cheaper to maintain than overhauling to a centralized model.  

  #### Why This Meets Your Criteria
  - **No payoff to defecting in good equilibrium**: Desynchronizing while others are synchronized reduces local payoff (8 < 10).  
  - **No hidden incentives**: Actors don’t prefer congestion. Noise-free, they’d coordinate perfectly.  
  - **Pure measurement error**: No principal-agent issues, discounting, or enforcement costs.  
  - **Real domain**: Traffic grids are well-documented (e.g., L.A. synchronization projects).  
  - **Not a usual suspect**: Differs from prisoner’s dilemmas (no individual gain from defection).  

  #### Why It’s Not Incoherent
  Your request is possible because:  
  1. **Multi-equilibrium systems** exist where the bad equilibrium is self-reinforcing.  
  2. **Noise breaks common knowledge**: Even with identical payoffs, local signals prevent coordinated inference.  
  3. **Cascades are irreversible**: Once in the bad state, individual signals correctly show defection is optimal.  

  This example isolates noisy observation as the failure mode—unlike overfishing (short-term greed) or AI races (principal-agent problems). The fix is technically trivial but socially intractable, echoing Moloch’s core tension: **individual rationality + imperfect information → collective doom**.
