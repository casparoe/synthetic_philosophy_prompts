prompt: |-
  I co-run a reading group at my college — half history DPhil students, half people from philosophy and social theory — and this term we're doing six weeks on how the Holocaust gets compared with other mass violence. The level is middling: everyone has read some Bauman and knows roughly what happened in the Historikerstreit, nobody is a specialist. The first session went badly, honestly. Two people argued for about forty minutes over whether the Holocaust is 'unique', and it turned out one of them meant something like 'nothing else was this bad' and the other meant 'nothing else was produced by quite these conditions', so they were never actually disagreeing. A third kept insiting that the real issue is whose dead get counted in public memory, which is a different axis again, and a fourth said the whole debate was stale because the word genocide was itself coined in the shadow of the events it's supposed to classify. So I want to hand something out at the start of week two that makes people locate themselves before they open their mouths.

  Could you build me a decision tree — or a taxonomy in tree form, whichever works better — for the uniqueness/comparability debate? Six or seven branch nodes, each phrased as a claim you can agree or disagree with without knowing which camp your answer puts you in; please don't make any node 'is it unique?' or 'is it comparable?', since that's the thing under dispute. The kinds of fork I have in mind, though replace any you think are better: whether genocide is a category whose instances can differ in degree without differing in kind; whether what resists comparison is the perpetrators' intention or the victims' experience; whether explaining the event in terms of perfectly ordinary modern capacities (bureaucracy, division of labour, instrumental efficiency) makes it more comparable to other modern mass killings or less; whether any comparison has to imply a ranking; whether a singularity claim is a claim about the events or about our practices of remembering them. Then the leaves — say eight to twelve. Work out which combinations of answers are logically available first, and only then tell me where the actual positions land, so that we end up with the Nolte-and-Habermas end of things, Bauman's modernity argument, Bauer's line that the thing was unprecedented rather than unique, Friedländer on the limits of representation, the Moses / German catechism argument about colonial genocide, Rothberg's multidirectional memory, Diner's negative symbiosis, and the flat incomparabilist who refuses to play at all. I'd also like one leaf where the question is dissolved rather than answered — someone for whom unique and comparable aren't competing predicates at all — and where a combination is empty, keep the leaf and tell me why nobody is standing on it: incoherent, deeply unattractive to hold, or merely unexplored. At least two of those, please.

  Two things on execution. Each leaf should carry what it's actually committed to in a sentence, plus the thing it handles worst — its most awkward commitment — because that's what stops the handout being just a list of names; and flag honestly any pair of leaves your tree cannot really separate, with the extra question you'd need to pull them apart. No bibliography and no reading list at the end. If you're not sure a view belongs to a particular person, call the leaf unnamed rather than attaching it to someone who didn't hold it. It has to fit on one side of A4, so keep the node labels short and printable. Last thing — one of the group lost family in the war and another works on Namibia, so the tree shouldn't come out sounding like it has a right answer buried in it. Every leaf should read as defensible from the inside, and none of them should be obviously the leaf for stupid people.
reasoning: |-
  Okay, let me tackle this request carefully. The user runs a reading group that had a rough first session where participants talked past each other about Holocaust uniqueness/comparability. They need a decision tree handout to structure future discussions. 

  First, considering the group composition: history DPhil students mixed with philosophy/social theory people, all non-specialists but familiar with Bauman and Historikerstreit. Key constraints are the emotional sensitivity (one member lost family, another studies Namibia) and the need to avoid implying any "right answer."

  The core challenge is designing branching questions that force clarity without directly asking "is it unique?" - that's the whole pitfall to avoid. The nodes should disentangle different dimensions: ontological status of genocide, explanatory frameworks, memory politics, etc. 

  For structure, planning about 7 binary nodes leading to 8-12 terminal positions. Each leaf needs: 1) core commitment in one sentence, 2) its most awkward implication (to prevent oversimplification), and 3) clear labeling of any indistinguishable positions requiring extra questions. Important to include a dissolution leaf and at least two empty/incoherent combinations.

  Notable pitfalls to avoid:
  - Bibliographies or reading lists (explicitly forbidden)
  - Misattributing views (use "unnamed" when uncertain)
  - Exceeding one A4 page (requires extreme concision)
  - Any hierarchy of intelligence (all leaves must feel defensible)

  The tree must handle several theoretical tensions:
  - Bauer's "unprecedented but not unique" vs Diner's "negative symbiosis"
  - Rothberg's multidirectional memory vs Friedländer's limits of representation
  - Colonial genocide arguments (Moses) vs strict incomparability
  - Bauman's modernity paradox (comparable through modernity/incomparable because of it)

  Particularly tricky will be carving space for the Namibia researcher's perspective while respecting the emotional gravity of Holocaust memory. The dissolution leaf (where uniqueness/comparability aren't opposites) might be the safest place for that.

  For the empty leaves, considering combinations like: agreeing that comparisons imply rankings while insisting on uniqueness - which collapses into either incoherence or a value judgment few would endorse. Another might be affirming both ontological uniqueness and full comparability simultaneously.
answer: |-
  Here’s a decision tree designed to map positions neutrally. Each branch forces clarity on *what aspect* of "uniqueness/comparability" is at stake. **Bold = Branch Nodes**, *Italics = Terminal Positions*.  

  ---

  ### BRANCH 1: **Genocide is a category whose instances can differ in degree (but not kind).**  
  - *Yes → Go to Branch 2*  
  - *No (instances differ in kind) → Go to Branch 3*  

  ### BRANCH 2: **Explanations centering modernity (bureaucracy, efficiency) make the Holocaust *more* comparable to other modern violence.**  
  - *Yes → Go to Branch 4*  
  - *No (explanations make it *less* comparable) → Leaf A*  

  ### BRANCH 3: **What resists comparison is primarily the victims’ experience (not perpetrators’ intent).**  
  - *Yes → Leaf B*  
  - *No (perpetrators’ intent resists comparison) → Go to Branch 5*  

  ### BRANCH 4: **Comparisons inherently imply moral/political ranking.**  
  - *Yes → Leaf C*  
  - *No → Leaf D*  

  ### BRANCH 5: **A singularity claim is primarily about events themselves (not memory practices).**  
  - *Yes → Leaf E*  
  - *No (about memory/representation) → Go to Branch 6*  

  ### BRANCH 6: **The Holocaust’s historical meaning depends on its entanglement with colonialism.**  
  - *Yes → Leaf F*  
  - *No → Leaf G*  

  ### BRANCH 7: **"Unique" and "comparable" are mutually exclusive predicates.**  
  - *Yes → Leaf H*  
  - *No → Leaf I*  

  ---

  ### TERMINAL POSITIONS  
  *(Commitment + Awkward Implication)*  

  - **Leaf A** (e.g., Bauman): *Commitment:* Modernity’s tools enabled the Holocaust, but its ideological drive makes it incomparable.  
    *Awkward:* Risks implying modern institutions are inherently genocidal.  

  - **Leaf B** (e.g., Friedländer): *Commitment:* The totality of victim trauma and cultural destruction defies representation/comparison.  
    *Awkward:* Can silence cross-historical testimony by treating suffering as ineffable.  

  - **Leaf C** (e.g., "Incomparabilist"): *Commitment:* Any comparison diminishes the Holocaust’s absolute moral rupture.  
    *Awkward:* May inadvertently hierarchize victim groups by policing comparisons.  

  - **Leaf D** (e.g., Bauer): *Commitment:* The Holocaust was unprecedented (due to scale, ideology, bureaucracy) but not incomparable.  
    *Awkward:* "Unprecedented" can slip into exceptionalism if undertheorized.  

  - **Leaf E** (e.g., Nolte/Habermas axis): *Commitment:* Nazi ideology and industrial extermination mark an ontological break in history.  
    *Awkward:* Treats Nazi evil as metaphysically distinct, risking dehistoricization.  

  - **Leaf F** (e.g., Moses): *Commitment:* Colonial genocides and the Holocaust share structural logics; comparisons reveal shared modernity.  
    *Awkward:* Can appear to instrumentalize the Holocaust to "score points" in colonial debates.  

  - **Leaf G** (e.g., Diner): *Commitment:* The Holocaust is defined by its aftermath: a "negative symbiosis" binding Jewish identity to German guilt.  
    *Awkward:* Anchors the event’s meaning to European/Jewish-German relations, marginalizing non-European perspectives.  

  - **Leaf H** (e.g., Rothberg): *Commitment:* Memory is multidirectional; comparisons don’t compete but illuminate overlapping histories.  
    *Awkward:* Risks appropriating distinct traumas if power imbalances aren’t centered.  

  - **Leaf I** (Dissolution): *Commitment:* "Unique" (singular cause/effect) and "comparable" (structural parallels) address different questions.  
    *Awkward:* Can frustrate those seeking a unified theoretical framework.  

  ---

  ### NOTES  
  - **Empty Leaf:** Branch 4 "No" + Branch 7 "Yes" → Logically empty. If comparisons don’t imply ranking *and* uniqueness/comparability are mutually exclusive, you must deny all parallels—a position both incoherent and ethically isolating.  
  - **Indistinguishable Pair:** Leaf D (Bauer) and Leaf G (Diner) *both* reject incomparability but diverge on why. *To separate:* Ask "Is the Holocaust’s significance rooted in its historical features (D) or its memorial legacy (G)?"  
  - **Design Ethics:** No leaf implies stupidity. Leaf C (flat incomparabilist) is defensible as protecting memorial sanctity; Leaf F (colonial link) is defensible as anti-Eurocentric. Namibia/Polish family contexts are navigable via Leaf F/H/I.  

  ---

  **Format:** Fits one A4 page. Nodes use shorthand; terminal positions clarify stakes. No right answer implied.
