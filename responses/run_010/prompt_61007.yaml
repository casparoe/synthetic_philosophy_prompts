       - The verdict might be approval even if a majority of the board is against approval? How? Because each criterion might be passed by a majority, but the members who passed each criterion might not overlap. Then the derived verdict is approval, but if we had taken a vote on the verdict it might have failed. But note: the statute requires approval only if all criteria are met. So the verdict must be approval if the criteria are met. Therefore, the derived verdict is faithful to the statute. The board's job is to apply the criteria. If they apply the criteria and all are met, they must approve. The separate vote on the verdict was the problem.

       - However, this might be seen as undemocratic? Because a majority of the board might be against the system, but they are forced to approve it because each criterion passed. But that is the statute. The board is not supposed to overrule the criteria.

       - Similarly, the verdict might be refusal even if a majority of the board wants to approve? How? Because one criterion fails by a majority. Then the derived verdict is refusal, but if we had taken a verdict vote, it might have passed. Again, the statute requires all three criteria. So we are faithful to the statute.

