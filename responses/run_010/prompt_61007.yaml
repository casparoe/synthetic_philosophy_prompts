     Case 2: The pair of near-identical variants.

       System A (two months ago): 
          Error rate: 4.5% (claimed by agency), staff verified 4.5%. Tolerance: 5%. 
          Vote: 6-3 that the error rate is within tolerance -> passes.

       System B (now): 
          Error rate: 4.9% (claimed by agency), staff verified 4.9%. Tolerance: still 5%.
          Vote: 5-4 that the error rate is within tolerance? But 4.9% is within 5%, so why did it fail? 

       In the problem, we found the first met and the second not met. That is a contradiction.

       Under the new procedure:

          For System B: the staff reports error rate 4.9% and tolerance 5%. They say it is within.

          The board votes on: "The error rate is within the tolerance." 

          If the board votes 5-4 that it is not within, then we record that and criterion 1 fails. Then the system is rejected.

          Why would they vote that 4.9% is not within 5%? They might dispute the staff's calculation. For example, they might argue that the true error rate is 5.1% because of a different method.

          We record: agency claimed 4.9%, staff verified 4.9%, but the board found (by 5-4) that the error rate is not within the tolerance. We also record the reason if given (e.g., one member might say: "We should include X in the error calculation, which brings it to 5.1%").

          Then the appellant can challenge that finding. Without the record of the error rate and the dispute, we had a contradiction. Now we have an explanation.

     Case 3: The criterion 2 case with two grounds.

       Part A: "Does the system provide a mechanism?" -> 6-3 in favor. So passes.

       Part B: 
          Mechanism A: vote -> 3 in favor, 6 against -> fails.
          Mechanism B: vote -> 3 in favor, 6 against -> fails.

       Then we record: criterion 2 is passed (because Part A passed) but no mechanism was endorsed by a majority. The minutes will say: "The board found that the system provides a mechanism for human reconsideration, but no specific mechanism received majority endorsement. Three members found mechanism A valid, three found mechanism B valid, and three found no mechanism valid."

       The verdict then depends on the other criteria.

     Conclusion: The procedure is:

       - Vote on criteria 1, 2 (in two parts), and 3.
       - Derive the verdict from the criteria.
       - For criterion 1: set a numerical tolerance and record the error rates.
       - For criterion 2: record the mechanism votes.

     We sacrifice the board's ability to have a separate "global" veto or approval. But we gain consistency with the statute.

     We might still have inconsistencies in criterion 1 across cases, but we make the reasons explicit.

     We might have criterion 2 passed without a majority mechanism, which is confusing but honest.

     We must hope that the board members will vote honestly on the criteria.

     The note to the appellant is as above.

     Now, write the standing orders:

     Proposed standing orders:

      1. Voting Sequence:
          a. For each system under review, the board shall vote on the three statutory criteria in the order: criterion 1, criterion 2, criterion 3.
          b. The vote on criterion 1: "The error rate of the system for the population it affects falls within the tolerance adopted by the board." Members vote Yes or No.
          c. The vote on criterion 2: 
