       - For the rotating membership: We might still have contradictory findings on criterion 1 for similar systems. But by recording the error rates and the tolerance, we make it easier to spot and challenge such contradictions. And we hope the board will be consistent.

     Now, the note to the appellant:

       "The board has adopted a procedure that first votes on each of the three criteria required by the statute. The system is approved only if all three criteria are passed by a majority. This procedure ensures that the board's decision is consistent with the statute, which requires all three criteria to be met. The board does not take a separate vote on the overall approval because the statute defines the approval as the combination of the three criteria. This prevents the board from rejecting a system that meets all the criteria or approving one that does not. This rule was adopted in advance and is applied uniformly to all cases."

     Now, run the procedure on the cases:

     Case 1: Benefits-fraud flagging system

       Criterion 1: 6-3 in favor -> passes.
       Criterion 2: 5-4 in favor -> passes.
          Then we do Part B: vote on the mechanisms. Suppose there was one mechanism proposed. Then we vote on that mechanism. If it passes by majority (at least 5 votes), then we record the mechanism. If not, we record that the criterion passed but the mechanism was not endorsed by a majority.
