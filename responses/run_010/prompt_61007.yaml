     Alternatively, we can have the board vote on the error rate? We can ask: "What is the error rate?" and take a vote on that? But that is a continuous variable. We can't vote on a number.

     Given the constraints, we do the best we can: record the agency's number, the staff's number, and then the board's vote on whether the error rate (as they believe it to be) is within the tolerance.

     Then, to avoid contradictions, we rely on the staff report and the board's adherence to the facts.

     We also note: if two systems have the same error rate (within rounding) and the same tolerance, then the board should vote the same way. But if the membership changes and they interpret the evidence differently, they might not. We have to accept that.

     But we can require the board to state the error rate they are using for their decision. Then we can have:

          Motion: "The board finds that the error rate is X%." (We can have a vote on X? But again, continuous.)

     This is impractical.

     Therefore, we rely on the staff report and the board's vote on the ultimate question, and we record the agency's and staff's numbers. Then if a future board sees a similar case, they can look at the previous staff reports and see if the numbers are the same. They are not bound by the previous vote on the ultimate question because they might have different evidence or interpret the evidence differently. But the tolerance is fixed, so if the numbers are the same, the outcome should be the same.

     We can require: if the board votes against the staff report, they must state the error rate they found. Then we record that in the minutes. Then future boards are bound by that finding? No, because they are independent. But at least the record is clear.

     How? The chair asks: "Does any member who intends to vote against the motion (that the error rate is within the tolerance) have an alternative error rate to propose?" Then if a member proposes an alternative, we can have a vote on that alternative? But that is messy.

     Given time constraints (6-8 cases a day), we must be efficient.

     I propose: We vote on criterion 1 without specifying the error rate. We record the agency's claimed error rate, the staff's calculated error rate, and the vote. If the board votes to reject, we record the reason if given (e.g., "Member A stated that the error rate is actually Y% because ..."). This gives the appellant something to challenge.

     For the verdict: it is derived, so we avoid the inconsistency of the benefits-fraud case.

     Now, the stopping points:

       - The procedure stops with a refusal (i.e., the system is not approved) if any of the three criteria fails to get a majority.

       - The procedure also stops if the board cannot produce a majority on a criterion? Actually, we take a vote and if there's a tie, the chair breaks it. So we always have a majority.

       - The case is deferred if the chair, at any point before the votes, decides that further evidence is needed.

       - We do not stop for inconsistency because the verdict is derived and therefore consistent.

       - For criterion 2: We might have the situation that no mechanism is endorsed by a majority. That does not stop the procedure. We record it and move on.

       - We do not stop because of contradiction with a prior case. We record the facts and the vote. The prior case is not binding precedent, but we record the facts (error rates) so that if a future board departs, they must explain? We don't require that, but we hope the record will guide.

     We aggregate by findings to determine the verdict. We do not take a separate verdict vote.

