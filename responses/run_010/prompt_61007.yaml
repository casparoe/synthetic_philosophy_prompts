      2. Determination of the Verdict:
          a. The system is approved if and only if all three criteria (1, 2, and 3) receive a majority of votes in favor.
          b. No separate vote on the verdict shall be taken.

      3. Recording:
          a. The minutes shall record:
               - For criterion 1: the error rate claimed by the agency, the error rate determined by the staff, the tolerance in effect, and the vote (number of Yes and No votes).
               - For criterion 2:
                   * The vote on Part A.
                   * If Part A passes, the vote on each mechanism in Part B.
               - For criterion 3: the vote.
               - The verdict (approved or not approved) and the criteria that were passed/failed.
          b. If the board rejects the staff's error rate calculation for criterion 1, any member may request that the minutes record the alternative error rate they support and a brief reason. The chair may also invite such statements.

      4. Tolerance for Criterion 1:
          a. The board shall set and maintain a numerical tolerance (or a clear formula) for the error rate in a standing order.
          b. The tolerance may be amended only at a session specifically designated for rulemaking, and the amendment applies only to cases heard after the amendment.

      5. Chair's Role:
          a. The chair may defer a case for further evidence at any time before the votes on the criteria begin.
          b. The chair shall have a casting vote in the event of a tie on any vote on the criteria.

      6. Defaults:
          a. If the board cannot reach a majority on a criterion (even with the chair's casting vote), the criterion fails. [This should not happen because the chair breaks ties.]
          b. If the board is unable to complete the votes due to time or other constraints, the chair may defer the case to the next session.

     Now, the misfires we accept:

       - We might approve a system even though a majority of the board, if asked for a global vote, would have rejected it. But the statute requires the criteria, so we do so.
       - We might have inconsistent findings on criterion 1 across cases. We mitigate by recording the error rates and tolerance, but we cannot force consistency because the board may interpret evidence differently.
       - For criterion 2, we might pass the criterion without a majority-approved mechanism. We record that fact, and it may make the decision vulnerable on appeal.

     The note to the appellant (as above) is included in the standing orders as an explanation.

     We run the cases:

     Case 1 (benefits-fraud) with the numbers:
          Criteria: 1 passed 6-3, 2 passed 5-4, 3 passed 6-3 -> verdict: approved.

     Case 2 (two variants):
          System A: 
              Criterion 1: passed 6-3 -> approved (if other criteria pass).
          System B:
              Criterion 1: fails 5-4 -> verdict: not approved (regardless of other criteria).

          Why? Because the board in System B found that the error rate was not within the tolerance. We record the agency and staff numbers (4.9%) and the tolerance (5%). The minutes will show the vote and any dissenting reasons. The appellant can challenge the finding that 4.9% is not within 5% (if that was the reason) or the alternative error rate proposed by the board.

     Case 3 (criterion 2 with two grounds):
          Criterion 2 Part A: passes 6-3.
          Part B: mechanism A fails (3-6), mechanism B fails (3-6).
          Record: criterion 2 is passed, but no mechanism endorsed by majority.

          If criteria 1 and 3 pass, then verdict: approved.

     The board might not like that System B is rejected even though 4.9% is below 5%? But that is what the board voted. We hope that by recording the numbers, the board will be more consistent. And the agency can appeal.

     This procedure is adopted in advance and applied uniformly.

     Final note: The procedure does not solve all problems, but it makes the decision process more transparent and consistent with the statute.
answer: |-
  ### Proposed Standing Orders for the Statutory Review Board

  #### **1. Voting and Recording Sequence**  
  **Pre-Session Template (Circulated Weekly):**  
  > "For each case, the board will:  
  > (A) Vote on **Criterion 1** (Error Rate Tolerance):  
  >   - *Question:* 'Does the system’s error rate for the affected population fall within the board’s adopted tolerance?'  
  >   - *Vote:* Yes/No. Majority carries.  
  >   - *Default if indecisive:* If tied after chair’s casting vote, criterion fails.  
  >   
  > (B) Vote on **Criterion 2** (Human Reconsideration):  
  >   - *Question (Part A):* 'Does the system allow a person facing an adverse decision to obtain human reconsideration before the consequence takes effect?'  
  >   - *Vote:* Yes/No. Majority carries.  
  >   - *If Part A passes*, proceed to **Ground Identification**:  
  >     - Each member voting 'Yes' must select **one** ground from agency-provided options (e.g., 'Caseworker Recheck' or 'Fast Appeal').  
  >     - *Ground carries* only if ≥50% of *all voting members* support it (e.g., 5/9).  
  >   - *Default if no ground carries:* Criterion 2 fails.  
  >   
  > (C) Vote on **Criterion 3** (Benefit vs. Harm):  
  >   - *Question:* 'Does the benefit to the agency’s served population outweigh the harm to those flagged?'  
  >   - *Vote:* Yes/No. Majority carries.  
  >   - *Default if indecisive:* If tied after chair’s casting vote, criterion fails.  
  >   
  > (D) **Verdict (Approval)**:  
  >   - *Automatically determined:* Approved **only if all three criteria pass**. No separate vote.  
  >   
  > **Notes**:  
  > - The chair may defer a case for further evidence **before** finalizing votes.  
  > - Votes are final once recorded. No reconsideration except on procedural error."

  #### **2. Stopping Points and Escalations**  
  - **Stop with Refusal** if:  
    - Any criterion fails (automatic verdict refusal).  
    - Criterion 2 passes Part A but **no ground achieves majority support** (criterion fails, verdict refused).  
    - **Contradiction with precedent**: If Criterion 1 vote conflicts with a prior identical system (same error rate ±0.5%), the chair **must defer** for legal advice.  
  - **Escalate to Chair/Board** if:  
    - Tolerance interpretation ambiguity (Criterion 1): Chair decides if error rate is "identical" to precedent.  
    - Ground ambiguity (Criterion 2): Chair selects one ground if multiple tie at 50%.  
  - **Aggregation Rule**: Verdict is **always derived from criteria votes** (not a separate vote). Adopted once; no case-by-case changes.  

  #### **3. Handling Graded Criterion (Criterion 1) and Rotation**  
  - **Tolerance as Fixed Benchmark**:  
    - Board must express tolerance as a **numerical range** (e.g., "≤5% false positives") in standing orders.  
    - Staff computes error rate pre-session; board votes only on whether it falls within the **pre-set range**.  
  - **Contradiction Prevention**:  
    - If a system’s error rate is **numerically identical** (±0.5%) to a prior approved system, the board **must** vote consistently unless new evidence exists.  
    - Minutes publish: (1) Tolerance range, (2) System’s error rate, (3) Precedent case numbers.  
    - *Rationale:* Ensures stability despite membership rotation; contradictions become appealable errors.  

  #### **4. Misfires and Trade-offs**  
  - **Judgment Calls Dressed as Procedure**:  
    - Chair’s "identical error rate" call (Criterion 1) is subjective but necessary to avoid contradictions.  
    - Ground selection (Criterion 2) forces artificial unity; a minority ground may bind the verdict.  
  - **Trade-offs**:  
    - **Sacrificed**: Faithfulness to member opinion (e.g., verdict may approve a system a majority opposes).  
    - **Kept**: Consistency over time (precedent binding), decisiveness (no deadlocks), publishable rationale (explicit grounds).  
  - **Why Accept This?** Prevents statutorily inconsistent approvals (e.g., refusing a system that meets all tests).  

  #### **5. Explanation to Appellants**  
  > "The board uses a fixed procedure to ensure fairness. We vote on three legal tests:  
  > 1. **Error Rate**: Does it fall within our published range?  
  > 2. **Human Review**: Can you get a human to reconsider? And if so, how?  
  > 3. **Benefit vs. Harm**: Does the system help more than it hurts?  
  >   
  > The system is approved **only if all three tests pass**. We do not vote separately on approval because the law ties approval to passing all tests. This prevents contradictions (e.g., approving a system that fails a test).  
  >   
  > Sometimes, the board agrees a test is passed but disagrees on *why* (e.g., human review). If no single reason gets majority support, the test fails. This ensures clarity for your appeal.  
  >   
  > This rule was adopted in advance for all cases—not rigged against you."

  ---

  ### **Procedure in Action**  
  #### **Case 1: Benefits-Fraud System**  
  - **Criterion 1**: Passes 6–3.  
  - **Criterion 2**:  
    - Part A: Passes 5–4.  
    - Ground Identification:  
      - "Caseworker Recheck": 3 votes.  
      - "Fast Appeal": 3 votes.  
      - **No ground achieves 5/9 majority → Criterion 2 fails**.  
  - **Criterion 3**: Passes 6–3.  
  - **Verdict**: **Refused** (Criterion 2 failed).  
  - *Why the board won’t like this*: Verdict refused despite all criteria passing in initial votes.  
  - *Cost worth paying*: Avoids publishing an approval with no agreed-upon human review mechanism.  

  #### **Case 2: Near-Identical Variants (Two Months Apart)**  
  - **System A** (Error Rate 4.6%):  
    - Tolerance: ≤5.0%.  
    - Precedent: Identical to no prior case.  
    - Vote: Passes 6–3 → Approved.  
  - **System B** (Error Rate 4.9%):  
    - Tolerance: ≤5.0% (unchanged).  
    - Chair determines error rate is "identical" to System A (±0.5%).  
    - **Board must vote consistently with System A** → Passes 6–3 → Approved.  
    - If board votes 5–4 against: Minutes show contradiction → Chair **defers for legal advice**.  
  - *Why consistent?* Numerical tolerance and precedent binding prevent arbitrary flip-flops.  

  #### **Case 3: Criterion 2 with Incompatible Grounds**  
  - **Criterion 2**:  
    - Part A: Passes 6–3.  
    - Ground Identification:  
      - "Caseworker Recheck": 3 votes.  
      - "Fast Appeal": 3 votes.  
      - **No ground achieves 5/9 majority → Criterion 2 fails**.  
  - **Verdict**: **Refused** (regardless of other criteria).  
  - *Why the board won’t like this*: Criterion 2 passes Part A but fails on grounds.  
  - *Cost worth paying*: Avoids approving a system with no majority-backed safeguard for appellants.  

  ---  
  **Final Note**: This procedure prioritizes **statutory consistency** and **appeal clarity** over member autonomy. It accepts that:  
  - A system meeting all tests may be refused if grounds fragment (Case 1).  
  - The board may approve a system a majority opposes if criteria pass (not shown in cases but possible).  
  Trade-offs are disclosed in standing orders; appellants see a rule, not improvised bias.
