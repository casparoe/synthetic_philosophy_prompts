  We are facing a problem that resembles the "Ostrogorski's paradox" or the "discursive dilemma", where collective decisions on individual premises can lead to a collective decision on the conclusion that is inconsistent with the premises. However, our situation is more complex due to the four features.

   The core issue: The board votes on three criteria (premises) and then on the verdict (conclusion). The verdict should be the logical AND of the three criteria. But members might vote on the criteria and the verdict in a way that the verdict does not reflect the aggregation of the criteria.

   We want a procedure that:
     - Avoids inconsistent outcomes (like approving a system that meets all criteria being rejected, or vice versa)
     - Handles non-independent votes and instructed members
     - Manages the graded criterion (criterion 1) and rotating membership
     - Handles cases where a criterion is accepted by a majority but on conflicting grounds

   Proposed solution: We change the voting sequence and the way we record.

   We note that the statute requires three findings (on the criteria) and a verdict. But the statute does not specify the order of voting. We can change the order and the way we aggregate.

   We propose:

   1. The board will vote on the verdict first. That is, the question: "Shall the system be approved?" (Yes/No). This vote is taken without any prior vote on the criteria.

   2. Then, the board votes on the three criteria. However, note that the verdict must be the AND of the three criteria. But if we vote on the verdict first, we break the logical link. So we need a different approach.

   Alternatively, we can use a procedure that forces consistency:

   Approach 1: Premise-based voting only.
     - We vote only on the three criteria.
     - The verdict is then automatically determined: if all three criteria pass (by majority), then the system is approved; otherwise, not.

   Approach 2: Conclusion-based voting only.
     - We vote only on the verdict (approve or not). We do not vote on the criteria.

   However, the statute requires separate findings on each criterion and the verdict. Therefore, we must record votes on each criterion and the verdict.

   Therefore, we must have both. But to avoid inconsistency, we can let the criteria votes determine the verdict. That is, we do not take a separate vote on the verdict. Instead, we derive the verdict from the criteria.

   But the statute says: "We record a separate finding on each part" and "the verdict". And the minutes must show the vote on each finding and the verdict.

   However, the statute does not say that the verdict is decided by a separate vote. It says we decide whether the system may be put into production (the verdict) and we record findings on each part.

   So we can interpret: the verdict is the logical AND of the three findings. Then we don't need a separate vote on the verdict. We can just record the verdict as "approved" if and only if all three criteria are passed by majority.

   But note: the minutes currently show a vote on the verdict. And the problem case had a vote on the verdict that was 4-5 against, even though all criteria passed.

   However, the statute does not require a vote on the verdict. It requires a verdict. So we can change our standing orders to define:

     The verdict is determined by the findings: approved if and only if all three criteria are passed by a majority.

     We do not take a separate vote on the verdict.

   This would solve the inconsistency. But what about the members who want to vote against the verdict even if the criteria are met? They might have reasons beyond the criteria? The statute sets the test as three criteria and the verdict must be the AND. So if the criteria are met, the verdict must be approval. Therefore, the separate vote on the verdict is not required and in fact leads to contradictions.

   So step 1: Abolish the verdict vote. The verdict is derived.

   But note: the chair has a casting vote and may defer for further evidence. We can apply these to the criteria votes.

   However, the problem also includes:

     - The findings must be recorded separately because an appellant is entitled to know which finding she is contesting.

     - The minutes must state a ground for criterion two when it is passed.

     - The rotating membership and graded criterion one.

     - The fact that members vote in blocs.

   How to handle:

     For criterion 2: We require that when voting on criterion 2, each member must state their ground (if they vote in favor). Then we record the ground that a majority of the members who voted in favor accepted. But note: in the example, the criterion passed 6-3. But of the 6 in favor, 3 had ground A and 3 had ground B. Then there is no majority ground.

     Solution: We record the criterion as passed, but we record the grounds that were supported by at least a majority of the entire board? No, because the entire board is 9 or 11. 3 is not a majority of 9.

     Alternatively: We require that the ground must be stated and then we vote on the ground? But the statute does not require a ground to be passed by majority. It only requires that a person can get a human reconsideration. So if the board finds that criterion 2 is met, but there is no majority on the ground, we can record the grounds that were supported by the members and note that no single ground had a majority. This is honest. The appellant can then challenge on the ground that the board did not agree on a single mechanism, but the criterion is met because at least one mechanism exists? Actually, the criterion is met if there is at least one mechanism that provides the reconsideration. But if there are two mechanisms and they are different, and the board is split on which one is valid, then the system must have at least one valid mechanism. We can record: "The board finds that criterion 2 is met because either [A] or [B] is present, but the board does not agree on which one is the operative ground."

     However, that might be confusing.

     Another idea: We can have a two-step vote for criterion 2:

       Step 1: Vote on whether there exists at least one mechanism that satisfies criterion 2. (Yes/No)
          - If this passes by majority, then we move to step 2.
          - If not, then criterion 2 fails.

       Step 2: We then ask: "Which mechanism(s) does the board recognize as satisfying criterion 2?" and we list the proposed mechanisms. For each mechanism, we vote whether it is valid. Then we record the criterion as passed and list the mechanisms that were approved by a majority.

     But note: the agency might have provided two mechanisms, and both might be valid. Then we can record both.

     However, the problem in the example was that the board was split: three for mechanism A, three for mechanism B, and three against the criterion. Then in step 1, the vote for "there exists at least one mechanism" would be 6-3 (since the 6 in favor of the criterion would vote yes). Then step 2: vote on mechanism A: 3 in favor (the ones who thought A was valid) and 6 against (the other 6). Similarly, mechanism B: 3 in favor and 6 against. Then we cannot record any mechanism as valid? But then the criterion was passed without a valid mechanism? That is inconsistent.

     Actually, the members who voted for the criterion because of A would vote for A and against B? And the ones who voted for the criterion because of B would vote for B and against A? And the ones who voted against the criterion would vote against both? So no mechanism would get a majority.

     Therefore, we must record the criterion as passed but without a majority-endorsed mechanism. We can say: "The board finds that criterion 2 is met, but no specific mechanism was endorsed by a majority. The members who voted in favor did so based on different mechanisms: three for A, three for B."

     This is honest and transparent.

     For the rotating membership and criterion 1:

       The problem: Two similar systems, one approved for criterion 1 and the other not, because of membership change.

       We want to avoid contradictions.

       We can adopt a rule: When setting the tolerance for criterion 1, the board must set it in a way that is not case-specific. They set a general tolerance (say, error rate <= X%) and then in each case, they check if the system's error rate is within that tolerance.

       But the board has already adopted a tolerance. The problem is that the tolerance might be applied differently in different cases? Or the board might reinterpret the tolerance.

       The minutes say: the board set the tolerance. So if they set a specific number, then the staff can compute whether the system meets it. Then the vote on criterion 1 becomes a factual question: is the error rate <= X%? That should not change with membership. But the problem states that two variants with a rounding change of 0.4% were decided differently. This suggests that the board is not just checking against a fixed number, but also exercising judgment about whether that error rate is acceptable? Or the tolerance might be a range?

       The statute says: "the system's error rate for the population it affects falls within the tolerance the board itself has adopted". So the tolerance is fixed, and the vote is on whether the error rate falls within that tolerance. Therefore, it is a factual question.

       How can we make this more objective?

          - The agency must provide the error rate in their submission, and the board staff can verify it. Then the vote is on: "Based on the evidence, is the error rate within the tolerance?" But even then, there might be disputes about the calculation.

       To avoid contradictions across time, we can:

          - Record the error rate and the tolerance in the minutes. Then if a future board sees a system with an error rate that is numerically within the tolerance, they must find criterion 1 met. If it is numerically above, they must find it not met.

          - But what if the tolerance is not a single number? For example, the tolerance might be "no more than 5% for false positives and 2% for false negatives". Then it's clear.

       The problem arose because the board voted on the criterion and the vote changed even though the error rate was almost the same. This suggests that the tolerance might be vague (e.g., "acceptable error rate") and the board is voting on what is acceptable. We need to change that.

       Proposed: The board must set a numerical tolerance in a standing order. Then in each case, the staff computes the error rate and compares it to the tolerance. The board then votes on the factual question: "Is the error rate provided by the agency and verified by the staff within the tolerance?" This should be non-discretionary.

       But if the tolerance is not numerical? Then we are stuck with judgment.

       The statute says the board sets the tolerance. So we can set it as a numerical threshold. Then the vote on criterion 1 becomes a matter of fact. We can even delegate to the staff the computation and comparison, and the board just accepts the staff report unless there is a clear error. Then we avoid the vote altogether? But the statute requires a finding by the board.

       Alternatively, we can have a standing order that the board will accept the staff report on the error rate and whether it is within the tolerance, unless a member moves to reject the staff report. Then we vote on the motion to reject the staff report. If the motion fails, then the staff report stands and we record the finding accordingly. This makes the vote rare.

       But to be safe, we can do:

          - The staff presents a report: the error rate is X, the tolerance is Y, so it is within/not within.

          - The board votes on the finding: "The error rate is within the tolerance." This vote is taken after the staff report. If a member challenges the staff's calculation, they must present evidence. Then we vote.

          - We record the error rate and tolerance in the minutes. Then if a future board sees the same error rate, they must vote the same way? Not necessarily, because the tolerance might be changed by a future board. But the tolerance is set by standing order and can be changed only by a vote of the board in a rulemaking session, not in a case.

       So we separate the setting of the tolerance (which is done in a rulemaking) from the application (which is done in each case). Then the application should be consistent.

       How to handle the rotating membership? The tolerance is set by the board and remains until changed. The staff applies it uniformly. Then the vote on criterion 1 is only about the facts of the case and the application of the fixed rule.

       If the board wants to change the tolerance, they must do it in a separate rulemaking, and that change applies only to future cases.

     For the instructed members: We cannot discount their vote, so we have to live with it.

     For the non-independent votes: We cannot force independence, so we have to live with it.

   Proposed procedure:

   Pre-session template:

     For each case, the board will consider:

       Step 0: Presentation by the agency and staff, including:
          - Staff report on criterion 1: error rate and whether it is within the tolerance (with the tolerance stated and the error rate stated).
          - Staff report on criterion 2: description of the mechanism(s) for human reconsideration.
          - Staff report on criterion 3: analysis of benefits vs. harms.

       Step 1: Vote on criterion 1: "The error rate of the system for the population it affects falls within the tolerance adopted by the board." (Yes/No)

       Step 2: Vote on criterion 2 in two parts:
          Part A: "Does the system provide a mechanism by which a person facing an adverse decision can get a human being to reconsider it before the consequence lands?" (Yes/No)
          Part B: If Part A passes (by majority), then for each proposed mechanism (listed in the staff report), the board votes: "Is [mechanism description] a valid mechanism that satisfies criterion 2?" (Yes/No for each mechanism)

          We record criterion 2 as passed if Part A passes, and we record the mechanisms that were approved by a majority in Part B. If no mechanism is approved by a majority, we still record criterion 2 as passed (because Part A passed) but note that no mechanism had majority endorsement.

       Step 3: Vote on criterion 3: "The benefit to the people the agency serves outweighs the harm to the people it flags." (Yes/No)

       Step 4: The verdict: The system is approved if and only if all three criteria (1, 2, and 3) are passed by majority. We do not take a separate vote on the verdict.

     For the chair's role:

       - The chair may defer the case for further evidence at any time before the final determination of the verdict. Once the verdict is determined, the case is closed.

       - The chair has a casting vote in the event of a tie on any vote (on the criteria). But note: the verdict is derived, so there is no vote on the verdict to break.

     For the recording:

       - The minutes will show the vote on each criterion (and for criterion 2, the votes on each mechanism in Part B) and the derived verdict.

     Handling of the rotating membership and criterion 1:

       - The board must set the tolerance for criterion 1 in a standing order as a numerical value (or a clear formula) that can be objectively applied.

       - The tolerance can be changed only by a vote of the board in a session specifically designated for rulemaking (not during a case hearing). The change applies only to future cases.

       - The staff report must include the tolerance and the error rate, and the comparison. The board votes on the factual question.

     What if the board disagrees with the staff on the calculation? Then they vote against the staff report. But then they must state the correct error rate? We don't require that. They just vote "no" on criterion 1. Then we have a record of the staff's calculation and the board's vote. This might lead to inconsistency if the board does not recalculate. But we can require: if the board votes against the staff report, they must state the error rate they find and record it in the minutes. Then future boards can see that the tolerance was applied to a different number.

     Alternatively, we can have a motion to amend the staff report with a different error rate. Then we vote on the motion. If the motion passes, then the amended error rate is used. Then we check against the tolerance. Then we vote on criterion 1 with the amended error rate.

     But that complicates the procedure.

     Simpler: The vote on criterion 1 is a judgment of the board on the entire question: is the error rate within the tolerance? They may use whatever evidence they have. But then we risk inconsistency.

     Given the desire for consistency, I recommend:

        - The staff report is prepared and given to the board in advance.

        - The board may ask questions of the staff and the agency.

        - Then the vote is: "Based on the evidence, the error rate is within the tolerance." (Yes/No)

        - We record the error rate claimed by the agency, the error rate found by the staff, and any alternative error rate asserted by a member and supported by evidence? Not required. The board votes on the question as a whole.

        - However, to aid consistency, we require the minutes to record the error rate that the agency presented and the error rate that the staff calculated. Then if the board votes that the criterion is met, it implies they accept the staff's calculation (or they have a different calculation that is also within the tolerance). But we don't record the board's own calculation.

