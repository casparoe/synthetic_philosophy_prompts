  After mapping answer combinations to positions, I'll note gaps: for example, "voluntarism + social practice" might be incoherent because one emphasizes individual will while the other emphasizes collective rules. Theories that may collapse together (e.g., certain interpretations of voluntarism and second-personal rights) can be separated by the coercion case. Each position's awkward commitment will highlight its counterintuitive edge: e.g., consequentialism might allow breaking promises whenever undetected.  

  The scoring key will translate answer patterns into labels, with tiebreakers prioritizing consistency. I'll ensure the quiz is self-contained and engaging—exactly what the philosophy club needs to make their sessions more productive.
answer: |-
  Here's a self-contained, case-based sorting quiz designed to reveal underlying intuitions about promising without triggering theoretical posturing. It uses 6 concrete scenarios with neutral options.

  **The Promise Sorting Quiz**

  Answer each scenario intuitively. Don't overthink it; go with your gut feeling about whether the promise *really* binds the person described.

  1.  **The Deathbed Secret:** Alex promises their dying friend, Bailey, to burn Bailey's private letters after death. Bailey dies minutes later. Alex could easily read or keep the letters instead of burning them. No one else knows about the promise or the letters' existence. *Does Alex still have an obligation to burn the letters?*
      *   A) **Yes, the obligation remains.**
      *   B) **No, the obligation dissolves.**

  2.  **The Coerced Deal:** Casey owes dangerous loan shark Dee a large sum. Dee says, "Promise you'll pay me back double in a week, or I break your legs." Terrified, Casey makes the promise. *Is Casey really bound by this promise to pay Dee double?*
      *   A) **Yes, Casey freely promised and must pay.**
      *   B) **No, the promise doesn't count under such pressure.**

  3.  **The Vow to Oneself:** Morgan wakes up feeling unmotivated. They look in the mirror and solemnly promise themselves: "Today, I will finally clean out the garage." *Is this promise binding in the same way a promise to another person is?*
      *   A) **Yes, a promise is a promise, regardless of who it's to.**
      *   B) **No, promises only matter when made to someone else.**

  4.  **The Airport Gamble:** Robin promises to pick up Taylor from the airport at 6:00 PM sharp. On the way, Robin's old car breaks down unexpectedly. Robin did regular maintenance; the breakdown wasn't foreseeable. *Is Robin still obligated to Taylor for not being there at 6:00 PM?*
      *   A) **Yes, a broken promise is broken regardless of the reason.**
      *   B) **No, Robin couldn't control the breakdown and isn't at fault.**

  5.  **The Preventable Harm Secret:** Sam promises Quinn to never reveal Quinn's embarrassing secret. Later, Sam learns revealing the secret would prevent Quinn from unknowingly spreading a harmful lie that could ruin an innocent person's life. *Is Sam still bound by their promise not to reveal the secret?*
      *   A) **Yes, the promise to Quinn stands.** (Prioritizes the specific promise)
      *   B) **No, preventing greater harm is more important.** (Prioritizes consequences/duty)

  6.  **The Demanding Stranger:** A stranger approaches you on the street. They look you in the eye, point at your watch, and demand, "Promise me, right now, that you will give me that watch tomorrow." They offer nothing in return and have no claim on you. *Is there any genuine obligation created if you say "I promise"?*
      *   A) **Yes, saying "I promise" creates an obligation.**
      *   B) **No, this demand creates no real obligation.**

  ---

  **The Philosophical Positions (Leaves)**

  Your answers map onto underlying theories about why promises bind. Here's the landscape revealed by the quiz, including blank spots and overlaps:

  1.  **Consequentialist (Avoiding Harm/Disappointment):** Focuses on the bad consequences (harm, disappointment, distrust) of breaking promises. *Awkward Commitment:* Obligations vanish if breaking the promise has no negative consequences (like the Deathbed Secret).
      *   **Quiz Pattern:** 1B, 2B, 3B, 4B, 5B, 6B

  2.  **Voluntarist (Self-Created Obligation):** Believes the act of willfully making the promise *itself* creates the binding obligation. *Awkward Commitment:* Even wildly irrational, coerced, or pointless promises are binding (like the Coerced Deal or Demanding Stranger).
      *   **Quiz Pattern:** 1A, 2A, 3A, 4A, 5A, 6A

  3.  **Social Practice (Rule of the Game):** A promise is a move within a social institution defined by rules (like chess). Binding force comes from the constitutive rules of the practice. *Awkward Commitment:* Obligations only exist within societies that have this specific practice; the rules themselves are arbitrary (e.g., Promises to self might not count).
      *   **Quiz Pattern:** 1A, 2B, 3B, 4B, 5A, 6B

  4.  **Second-Personal Rights (Transferring a Claim):** Promising involves giving the promisee a special right or claim against the promisor. The obligation is owed *to that specific person*. *Awkward Commitment:* Obligations dissolve if the promisee no longer exists or has no standing (like the Deathbed Secret), or if the claim conflicts with more fundamental rights (Harm-Preventing Secret).
      *   **Quiz Pattern:** 1B (No one to claim the right), 2B (No valid claim under duress), 3B (No second party to hold the claim), 4A/B (Debatable - Did Taylor still have a claim? Most lean A), 5B (Preventing harm overrides specific claim), 6B (No valid claim established by demand)

  5.  **Deflationary (No Special Magic):** Promises aren't a unique source of obligation. They're shorthand for existing duties (like telling the truth, not harming, reciprocity). *Awkward Commitment:* There's nothing uniquely binding about the *act* of promising itself; it's just a way to trigger other duties (like the Demanding Stranger creates nothing new).
      *   **Quiz Pattern:** 1B, 2B, 3B, 4B, 5B, 6B *(Note: Overlaps heavily with Consequentialism on this quiz!)*

  6.  **Nietzschean Prerogative (Strength to Bind Oneself):** Only individuals of a certain strength/character ("sovereign individuals") have the capacity to truly bind themselves with promises. Others just make noises. *Awkward Commitment:* Most people are fundamentally incapable of making binding promises; obligation is an aristocratic privilege.
      *   **Quiz Pattern:** *Not fully captured by the quiz.* Tends towards Voluntarism (2A, 6A) but emphasizes the *character* of the promisor, which the quiz doesn't assess. It might see coercion (2) or the stranger (6) as tests revealing *lack* of sovereignty. Needs an extra question assessing the promisor's "rank" or strength.

  **Unoccupied Territory & Overlaps:**

  *   **Voluntarist + Social Practice (e.g., 1A,2A,3A,4B,5A,6B):** Unoccupied. Why? These views pull in opposite directions. Voluntarism makes obligation intensely personal and internal, while Social Practice makes it external and rule-based. Combining them fully is incoherent.
  *   **Consequentialist + Second-Personal Rights (e.g., 1B,2B,3B,4B,5B,6B):** Overlaps heavily with Deflationary and partially with Consequentialism. Why unoccupied? Second-Personal Rights insists on a specific *kind* of obligation (a claim *by the promisee*), which pure Consequentialism doesn't require. The rights view is less flexible about consequences overriding specific claims.
  *   **Key Overlap:** **Consequentialism (1B,2B,3B,4B,5B,6B) and Deflationary (1B,2B,3B,4B,5B,6B) are IDENTICAL on this quiz.** They cannot be separated with these cases. To split them, you'd need a case where keeping a promise causes *more* net harm than breaking it, but the promisee still has a strong claim (e.g., *Promise to Lie:* You promise your friend you'll lie to protect them from minor embarrassment, but telling the truth would prevent significant harm to someone else). Deflationists might break it easily; Consequentialists break it; Second-Personal Rights might hesitate more; Voluntarists/Social Practice might insist on keeping it.

  ---

  **Scoring Key & Your Position**

  Tally your answers (A or B for each Question 1-6). Find the best match below. If you match **Consequentialist/Deflationary**, use the tiebreaker question at the end.

  *   **Mostly A (especially 2A, 6A):** **Voluntarist** (Your will creates the bond. Even strange or pressured promises bind).
  *   **1A, 2B, 3B, 4B, 5A, 6B:** **Social Practice** (Promises follow social rules. Coercion voids it, death dissolves it if no one knows, promises to self don't count, unforeseeable failures excuse).
  *   **1B, 2B, 3B, 4A/B (Leaning A), 5B, 6B:** **Second-Personal Rights** (Obligation comes from the specific claim of the promisee. No promisee? No claim! Invalid claim? No obligation! Conflict with greater rights? Obligation overridden.)
  *   **Mostly B (especially 1B, 2B, 3B, 4B, 5B, 6B) + Tiebreaker A:** **Consequentialist** (Avoiding harm/disappointment is key. If no bad effects, no obligation. Prevent harm? Break the promise! Stranger's demand? Meaningless noise.)
  *   **Mostly B (especially 1B, 2B, 3B, 4B, 5B, 6B) + Tiebreaker B:** **Deflationary** (Promises aren't magic. They signal existing duties like truthfulness or non-harm. If no underlying duty applies, no obligation is created. Stranger's demand? No underlying duty to obey random demands.)

  **Tiebreaker (Consequentialist vs. Deflationary):** *The Pointless Lie:* You promise your friend you'll tell their boss they're sick today so they can skip work, *even though you know your friend just wants a day off and the boss won't check or care*. Your friend asks if you did it. Lying causes no harm. *Do you have to lie?*
      *   A) **No, there's no harm in telling the truth.** (Consequentialist)
      *   B) **No, there was never a real duty to lie in the first place.** (Deflationary - The promise didn't create a *new* duty to lie, just maybe a duty to be truthful *about whether you lied*, but that's separate). *(Note: Both say No, but for different reasons. A focuses on lack of harm, B focuses on lack of a pre-existing duty to perform the specific act promised).*

  **No Clear Match?** You might have a hybrid view or strong intuitions that don't fit neatly. Look at the "Unoccupied Territory" section or see which position's "Awkward Commitment" bothers you the least!
