  The user explicitly doesn't want citations, reading lists, or research suggestions—they just want a practical tool. I'll need to build the philosophical framework from scratch based on standard positions in promise theory. Key positions include:  
  - Consequentialism (obligation from harm/disappointment)  
  - Voluntarism (self-created obligation through will)  
  - Social practice (institutional rules like chess)  
  - Second-personal rights (transfer of claims)  
  - Deflationary (no special obligation—just general duties)  

  I should also consider Nietzschean prerogative as a potential sixth position, though it might be niche. For the cases, I'll design scenarios that probe core tensions:  
  1. **Deathbed Promise**: Tests whether obligation requires possible detection/affect.  
  2. **Coerced Promise**: Tests whether consent/voluntariness is essential.  
  3. **Promise to Self**: Tests if promises require a second party.  
