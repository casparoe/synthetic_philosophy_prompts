  The user wants a concrete, case-based quiz with five or six branching questions. Each question should present a scenario with multiple-choice options, worded neutrally so respondents answer based on intuition rather than recognizing which theory they're aligning with. They've specified five cases: deathbed promises where breach is impossible to detect, coerced promises, promises to oneself, uncertain promises (like airport arrival), and secret-revealing promises that prevent harm. They also want me to add a sixth case if it would improve diagnostic value.

