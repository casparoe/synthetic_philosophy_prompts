prompt: |-
  I've just spent two hours arguing with a friend about whether the standing to blame is entirely a matter of the blamer's own record — whether she complies with the norm she invokes, and applies it even-handedly to everyone — or whether standing can also be lost through something that happens inside the relationship itself, with the blamer's conduct held fixed. Build me a thought experiment that isolates that variable.

  Specifications: realistic setting (a research group, a firm, a family; no violence, no trolleys); one paragraph; the blamer must be perfectly compliant with the norm in question and must blame every comparable wrongdoer alike, so that neither hypocrisy nor partiality can explain any loss of standing; and she must nonetheless have forgiven the wrongdoer, sincerely and completely, for the very act she is now disposed to blame. The forgiveness is silent — he does not know she ever found out. Structure the case so that it forces separate verdicts on blame addressed to him and blame conveyed to third parties.

  The purpose matters, because it fixes what counts as cheating: I want to see whether a non-record ground for losing standing is coherently describable at all, so a case that simply asserts the loss rather than generating it from the forgiveness fails. After the scenario, run the check — what each account predicts and why; which single feature of the case does the work; what changes if the forgiveness is announced, or if he wrongs someone else in the same way; and how the record-based theorist attacks the case, including whether her best move is to insist that standing survives and only its exercise has become inappropriate.
