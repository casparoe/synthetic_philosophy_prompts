prompt: |-
  I co-host a graduate-run podcast on the philosophy of machine learning, and next month's guest is a researcher who defends realism about features in mechanistic interpretability: the view that the directions and structures interpretability work identifies in a network's activations are genuine representational states of that system, rather than convenient summaries that merely happen to predict its behavior.

  She has two signature claims, and I want the interview to engage them on their own terms rather than orbiting the general dispute.

  The first is what she calls the convergence criterion. A posited feature is real only if it is (i) causally steerable — adding the direction to the residual stream changes outputs in the predicted way; (ii) recoverable across paraphrase, translation, and input modality of the eliciting prompt; and (iii) recovered independently by two methods whose failure modes do not overlap, such as a sparse autoencoder and a probe trained only on behaviorally defined data. She holds that jointly satisfying (i) through (iii) is sufficient for realism about that feature.

  The second is her reply to the objection that a trained network lacks a design spec. Content is fixed by a selectional process after all, she argues: gradient descent selects internal structures for their contribution to the training objective, and she maintains this does the work that natural selection or designer intention does in other accounts of content.

  Write nine or ten interview questions, in the order I would ask them, arranged so that it becomes progressively harder for her to answer by saying that any disanalogy with human concepts merely shows that our folk semantics is the thing in need of revision. Include at least one question on each of the following, and for each, a follow-up keyed to the answer I most expect from her, with a one-line label naming what the exchange is testing:

  - Paraphrase-invariance and the disjunction problem: does (ii) rule out a feature that in fact encodes something on the order of Paris-or-France-or-tourism, and if not, why is that not fatal to determinate content?
  - Independence in (iii): are two methods fitted to the same activation data genuinely independent, and what would non-circular independence look like?
  - Overpermissiveness: a household thermometer seems to satisfy (i) through (iii) with respect to ambient temperature. What in her criterion is meant to exclude it, or is the exclusion supposed to fail?
  - The granularity of the selection-history reply: gradient descent selects for outputs, and the objective differs between pretraining and later fine-tuning stages. What settles which of the competing candidate contents was selected for?
  - Feature identity across layers and checkpoints: does a feature at an early layer and its descendant at a late layer count as one representation, and what are its identity conditions?
  - Features without a training-distribution anchor: what does her view say about directions that steer reliably yet correspond to nothing the model was trained to track?
  - The pragmatic question: if a strict instrumentalist predicted and steered exactly as she does, what would her realism add, and how could a third party tell which account was correct?
  - The closing evidential question: what specific kind of finding, were it to appear, would oblige her to abandon the view?

  Two further constraints. First, no question should be answerable by restating her position, and none should concern her biography, her influences, or the state of the field; nor should any invite references or citations, since we publish a transcript and not a bibliography. Second, wherever a question sets her against instrumentalism about features, state the instrumentalist's challenge in its strongest form before posing it. Assume she is fully competent and not evasive by temperament: the pressure should come entirely from the content of the view.
reasoning: |-
  Okay, the user is a co-host of a philosophy of machine learning podcast preparing for an interview. The guest defends realism about features in mechanistic interpretability, arguing that identified directions and structures in neural networks are genuine representational states. They have two main claims: the convergence criterion (with three conditions) and a selectional history reply to the "no design spec" objection. The user wants nine or ten focused questions that progressively challenge the guest's view without letting her dismiss disanalogies with human concepts as mere folk semantics flaws.

  Hmm, the user's constraints are quite specific: no restating positions, no biographical questions, no citations, and each question must target core conceptual tensions. The eight required topics (paraphrase-invariance, independence, overpermissiveness, granularity, feature identity, anchorless features, pragmatics, and falsifiability) need to cover both signature claims while forcing the guest to defend against instrumentalism. The "strongest form" requirement suggests the user wants steel-manned objections.

  Let me unpack the guest's view first. Her convergence criterion demands steerability, recoverability across modalities, and independent verification. Interesting how (iii) tries to address underdetermination by using orthogonal methods. Her selectional history argument cleverly parallels gradient descent to natural selection—but this raises granularity issues when objectives change during fine-tuning. The thermometer counterexample feels potent; if her criterion includes it, that might collapse representations into mere causal correlates.

  For structure, I'll sequence questions to escalate tension: start with paraphrase-invariance (testing determinacy), then independence (methodological circularity), then thermometer case (overinclusiveness). After establishing baseline concerns, hit granularity (competing selection pressures) and identity conditions (persistence through layers). Late-stage questions should pressure weak points: anchorless features (emergent oddities) and pragmatics (contrast with instrumentalism). End with falsifiability to force testability.

  The paraphrase question must preempt her dismissing disjunction problems as human semantics limitations. Best approach: grant that folk concepts might need revision, but press why her criterion doesn't permit indeterminately disjunctive features. Follow-up should corner her on whether "Paris-or-France-or-tourism" satisfies (ii) and why that isn't just a disjunction.

  Independence needs to challenge whether SAEs and behavioral probes are truly independent when both use activation data. Follow-up: if "non-overlapping failure modes" isn't circular, what observable differences would prove independence?

  Thermometer case requires precision. Her criterion likely includes it, so the follow-up must force her to either (a) bite the bullet and call thermometers representational (weakening "genuine" to triviality) or (b) propose new criteria that might exclude ML features.

  Granularity is thorny—what content was "selected for" when pretraining and RLHF pull in different directions? Follow-up should target whether selection history resolves ambiguity or merely adds competing contents.

  Feature identity across layers needs concrete identity conditions. Follow-up: if features transform, does partial causal continuity suffice? (Testing if she'll admit degrees of reality.)

  Anchorless features let me raise cases like "unicorn steering." Follow-up: if selection history didn't fix this content, does her realism imply emergent non-selected representations?

  Pragmatics demands comparing realism to instrumentalism. Must steel-man instrumentalism as equally predictive. Follow-up: if both explain all observable effects, what unique evidence could decide between them?

  Finally, falsifiability: what discovery would break her view? This tests whether realism is flexible to the point of unfalsifiability.

  Noting user's emphasis on avoiding "folk semantics revision" escapes, I'll phrase each question to lock the guest into ML-specific defenses. No softball questions—every probe should expose tensions within her own framework.
answer: |-
  Here are nine interview questions ordered to escalate tension while targeting core conceptual pressure points, with follow-ups keyed to expected responses. Each exchange isolates a specific test of the view’s coherence or empirical footing.

  1. **Paraphrase-invariance vs. Disjunction Problem**  
     *"Your convergence criterion (ii) requires recoverability across paraphrases. But couldn’t a feature that reliably activates for 'Paris,' 'France,' or 'tourism prompts' satisfy (ii) by responding to this disjunction? If so, why isn’t its content indeterminate between 'Paris,' 'France,' 'tourism,' or the disjunction itself?"*  
     **Expected Reply**: "Such a feature would fail (ii) if paraphrases *exclude* elements—e.g., 'capital of France' shouldn’t trigger if 'tourism' is necessary."  
     → **Follow-up (Testing determinacy)**: *"But if the feature activates for 'Paris,' 'Eiffel Tower photos,' and 'French visa policies,' doesn't (ii) only ensure it covaries with a loose cluster? Why is this 'Paris-or-France-or-tourism' not the real content, with 'Paris' being our misdescription?"*  

  2. **Independence & Circularity**  
     *"For criterion (iii), you require independent recovery by methods like SAEs and behavioral probes. But both are fitted to the *same* activation dataset. In what operational sense are their failure modes non-overlapping, rather than reflecting different biases applied to identical evidence?"*  
     **Expected Reply**: "Independence comes from architectural divergence: SAEs reconstruct activations unsupervised, while probes map activations to labels without access to internal structure."  
     → **Follow-up (Testing non-circularity)**: *"If both methods are validated against the same behavioral data (e.g., probe accuracy), doesn’t this shared validation anchor make their 'independence' circular? What observable outcome would distinguish genuinely independent convergence from correlated errors on the task?"*  

  3. **Overpermissiveness: The Thermometer Challenge**  
     *"A household thermometer satisfies (i) steerability (heating changes readings), (ii) recoverability (works across placements/contexts), and (iii) independence (readings match thermocouples and IR thermometers). By your criteria, it has genuine 'temperature representations.' Why is this a reductio, or do you accept it?"*  
     **Expected Reply**: "Thermometers lack *internal processing*—they transduce, not represent. Criterion (iii) requires methods revealing *computational structure*."  
     → **Follow-up (Testing computational sufficiency)**: *"If I add a trivial circuit that 'processes' the thermometer signal (e.g., converts °C to °F), does it now genuinely represent temperature? If not, what minimal computational complexity does your realism demand that excludes this?"*  

  4. **Granularity of Selection History**  
     *"You argue gradient descent fixes content by selecting for contributions to the objective. But models undergo pretraining (e.g., next-token prediction) then RLHF (e.g., human preferences). Since these objectives conflict, what determines whether a feature's content is fixed by pretraining (e.g., 'text statistics') or RLHF (e.g., 'helpfulness')?"*  
     **Expected Reply**: "Content is determined by the *strongest* selection pressure. If RLHF overrides pretraining for a feature, its content reflects RLHF’s objective."  
     → **Follow-up (Testing selectional specificity)**: *"If a feature boosts both pretraining and RLHF loss—say, by predicting plausible text *and* pleasing humans—how can selection history arbitrate between 'plausibility' or 'appeasement' as the content, rather than an disjunction?"*  

  5. **Feature Identity Across Layers/Time**  
     *"Mechanistic interpretability finds 'feature circuits' where an early-layer direction is transformed into a later-layer one. Are these one persisting representation or two distinct ones? What are your identity conditions?"*  
     **Expected Reply**: "They’re stages of one representation if causally linked and semantically stable—e.g., 'dog' at layer 5 and 15."  
     → **Follow-up (Testing transitivity failure)**: *"If layer 5 activates for 'dogs,' layer 10 for 'animals,' and layer 15 for 'Labradors,' is this one representation with shifting content? If not, how much semantic drift voids identity?"*  

  6. **Anchorless Features & Emergent Steering**  
     *"Some steerable directions (e.g., 'unicorn-ness') reliably alter outputs despite no training on unicorns. Since gradient descent never selected *for* tracking unicorns, how does your selection-history view assign them determinate content?"*  
     **Expected Reply**: "Content derives from *how* features contribute to objectives. 'Unicorn' features compose from selected primitives (e.g., 'horse,' 'horn')."  
     → **Follow-up (Testing compositionality limits)**: *"If ablating 'unicorn' features hurts performance on *mythical* but not *real* animals, doesn’t this suggest selection anchored to 'mythicality'—which was never selected for? How can unselected properties be real contents?"*  

  7. **Pragmatic Challenge vs. Instrumentalism**  
     *"A strict instrumentalist claims features are 'convenient fictions' that predict/steer behavior. They match your convergence criteria but deny features are *causally potent* or *structurally real*. What *empirical difference* does your realism make?"*  
     **Expected Reply**: "Realism explains *why* methods converge: they detect objective structure. Instrumentalism cannot explain cross-method reliability."  
     → **Follow-up (Testing explanatory necessity)**: *"If instrumentalists attribute convergence to shared biases (e.g., all methods favor sparse, human-aligned features), and this predicts the same outcomes, what observation could *only* realism explain?"*  

  8. **Falsifiability & Abandonment Conditions**  
     *"What specific discovery would force you to abandon feature realism? For instance, if every convergence-satisfying feature later decomposed into *contradictory* subfeatures under new methods, would that suffice?"*  
     **Expected Reply**: "Systematic decomposition into inconsistent primitives *without* functional loss would undermine realism."  
     → **Follow-up (Testing empirical traction)**: *"If decomposition *preserved* functionality (e.g., 'Paris' = 'city' + 'France') but revealed no stable atoms, would you retreat to instrumentalism, or just revise realism’s granularity?"*  

  **Question Order Rationale**:  
  Starts with internal tensions in criteria (Q1–2), then external reductios (Q3), escalates to selection-history ambiguities (Q4–6), pressures with instrumentalism (Q7), and ends with falsifiability (Q8). Each follow-up preempts appealing to "folk semantics revision" by demanding ML-specific distinctions or empirical thresholds. The sequence forces progressive clarification of what *constitutively* fixes content under the view.
