  ### Testing Your Hypothesis
  > **Hypothesis**: The dispute reduces to whether "will" is a universal or existential path quantifier.

  - **Confirmation**:  
    The fatalist assumes "will" is **universal** (\( \forall \pi \)).  
    Resistance often assumes "will" is **existential** (\( \exists \pi \)) or **path-relative**.  
    - Example: If "will" is existential (\( s_0 \models \exists \pi \mathop. \phi_{\text{battle}} \)):
      - Truth does **not** imply necessity (battle occurs on some paths, not all).
      - Falsity (\( s_0 \models \neg \exists \pi \mathop. \phi_{\text{battle}} \)) implies impossibility (no path has battle).
      - Breaks fatalism by decoupling truth from necessity.

  - **Deflationary Result**:  
    The dispute **is largely notational** once semantics are pinned down:  
    - Fatalism requires "will" as universal in a **deterministic system** (all paths agree).  
    - Anti-fatalism requires "will" as existential or path-relative in a **non-deterministic system**.  
    - The logical behavior of "will" is determined by the quantifier choice.

  - **What Survives**:  
    - Core issue: **Determinism vs. non-determinism** in the system.  
    - Quantifier choice resolves the apparent paradox.

  - **What is Destroyed**:  
    - **"Actual future"**: The framework has **no representation** of a single "actual" execution.  
      - Philosophers: Assume a unique actual future (linear time).  
      - Your framework: All paths are ontologically equal (branching time).  
    - **Consequence**:  
      - The philosophers' "actual future" does no work in your framework.  
      - Its absence is **not a limitation** but reflects that anti-fatalist positions (e.g., branching time) reject a pre-existing actual future.  
      - **Evidence**: If the system is non-deterministic, "actual future" is a post-hoc selection, not a truthmaker.

  ---

  ### Conclusion
  - **Hypothesis validated**: The debate reduces to quantifier choice (universal vs. existential) and system determinism.  
  - **Key insight**:  
    - **Fatalism** = Universal quantifier + deterministic system.  
    - **Anti-fatalism** = Existential/path-relative quantifier + non-deterministic system.  
  - **"Actual future" status**:  
    - Unexpressible in your framework (by design).  
    - Not needed: Path-based deliberation replaces "actual future" with path selection.  
  - **Philosophical payoff**:  
    Formal verification shows that the sea-battle argument **presupposes determinism**. Without it, the argument collapses upon specifying the semantics of "will".
