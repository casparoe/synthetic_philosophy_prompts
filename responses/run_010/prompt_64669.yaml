  ### Residue Report: Philosophical Claims vs. Formal Framework

  | Philosophical Claim                 | Translation Clean? | Distortion? | No Counterpart? | Notes                                                                 |
  |-------------------------------------|--------------------|-------------|-----------------|-----------------------------------------------------------------------|
  | **Bivalence**                       | ✅                  | ❌           | ❌               | Clean: Maps to state-based universal/existential quantification.     |
  | **Truth implies necessity**         | ⚠️                 | ✅           | ❌               | Distorted: Only holds if "will" is universal. Fails if "will" is existential. |
  | **Falsity implies impossibility**   | ⚠️                 | ✅           | ❌               | Distorted: Only holds if "will" is existential. Fails if "will" is universal. |
