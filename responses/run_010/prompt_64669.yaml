  | **Deny bivalence**                  | ✅                  | ❌           | ❌               | Clean: Supervaluationism fits the framework.                         |
  | **Restrict excluded middle**        | ⚠️                 | ✅           | ❌               | Distorted: Framework has bivalence for paths, but state-based indeterminacy aligns with spirit. |
  | **Relativize truth to a history**   | ✅                  | ❌           | ❌               | Clean: Path-based semantics is native to the framework.              |
