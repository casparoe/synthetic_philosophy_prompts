answer: |-
  ## Prioritarianism Applied: Jackson's Pools and Prince Edward's Schools

  ### 1. Mapping Prioritarianism to Jackson's Closure

  Prioritarianism holds that the moral value of a benefit (increase in advantage) depends on the absolute level of advantage of the recipient. The currency of advantage here is reasonably interpreted as *access to and enjoyment of public goods contributing to well-being*, specifically municipal swimming facilities – encompassing recreation, health, social interaction, and community belonging. The core principle is that a unit increase in advantage for a worse-off individual has greater moral weight than the same unit increase for a better-off individual. This is modeled by a strictly increasing and concave weighting function applied to individuals' absolute advantage levels before aggregating.

  The baseline for identifying the "worse off" is the *actual pre-closure distribution of advantage*. Under segregation, Black residents possessed access to only one pool (likely inferior), while white residents had access to four. Crucially, systemic racism ensured Black residents were significantly worse off on broader socio-economic and well-being metrics relevant to the advantage currency (e.g., income, health, safety, social standing). Therefore, Black residents were unambiguously the worse-off group in absolute terms prior to the closure.

  **Implications for Jackson's Closure:**
  *   **Black Residents (Worse Off):** The closure eliminated their *only* source of this public good. Given their pre-existing low absolute level of advantage and the high marginal value of such a good to them, the *loss* is catastrophic from a prioritarian perspective. The concave weighting function heavily penalizes this significant reduction in the absolute well-being of the already worst-off group. The harm is profound and decisive.
  *   **White Residents:** They lose access to four pools. However, given their significantly higher pre-existing absolute level of advantage (including access to other resources and possibly private alternatives), the marginal value of each pool lost is lower. The concave weighting function assigns less moral weight to these losses compared to the losses suffered by Black residents. While a net loss, it is far less significant in the prioritarian calculus.
  *   **City as a Whole:** Prioritarianism aggregates the weighted advantages. The massive, heavily weighted loss to the worst-off group (Black residents) vastly outweighs the less heavily weighted losses to the better-off group (white residents). Consequently, the closure results in a substantial decrease in overall prioritarian value. The decisive work of the weighting function is evident here: it magnifies the moral disvalue of losses accruing to those at the lowest absolute levels, making the harm to Black residents the dominant factor condemning the closure.

  ### 2. Leveling Down? Structure and Prioritarian Immunity

  Jackson's closure is **not a pure instance of leveling down** as Parfit formulated the objection against telic egalitarianism. Parfit's target is the implication that a state where everyone is equally worse off is *in one respect better* (namely, regarding equality) than an unequal state where some are better off. The objection highlights the absurdity of valuing equality intrinsically even when it produces no benefit and only harm.

  *   **Asymmetry is Key:** Jackson's closure did *not* produce equal outcomes. Black residents, already worse off, lost their only pool. White residents, better off, lost four pools but retained their superior absolute position overall. The *opportunity cost* was asymmetric: Black residents lost 100% of their access; white residents lost a portion (albeit large) of theirs, but crucially, not their relative or absolute advantage in the broader socio-economic context defining the baseline. The closure worsened absolute positions without achieving equality.
  *   **Pure Leveling Down Counterfactual:** A pure leveling down counterfactual would require Jackson closing *all* pools *and* ensuring no residual advantage disparity existed (e.g., via compensatory measures or an obliteration of all relevant socio-economic differences). This counterfactual smuggles in the problematic assumption that *only the pools* determine relative advantage, ignoring the entrenched systemic inequalities defining "worse off." It artificially isolates the good to manufacture a scenario Parfit's objection targets, but which doesn't reflect the actual Jackson context or prioritarianism's baseline.

  Prioritarianism **escapes the leveling-down objection substantively** in this case. It condemns the closure unequivocally because it makes the worst-off group *absolutely worse off*, and the concave weighting ensures this loss dominates the evaluation. It sees *no value whatsoever* in the reduced inequality achieved purely by harming the better-off without benefiting the worse-off. The closure is bad *because* it harms everyone, and especially bad because it devastates those already worst off. Telic egalitarianism might (implausibly) see a silver lining in reduced inequality; prioritarianism sees only loss, heavily concentrated where it matters most.

  ### 3. Testing the Claimed Immunity: Silence or Substance?

  Prioritarianism's condemnation of Jackson's closure is **substantive**, grounded directly in its core distributive principle. The view *does* have something decisive to say about the closure: it drastically reduces the weighted advantage of the worst-off group without providing any countervailing benefit to them (or anyone else). This is a direct violation of the prioritarian imperative to prioritize gains (and avoid losses) for those at lower absolute levels.

  However, prioritarianism's condemnation, while powerful, is **incomplete**. Its substantive judgment is solely distributive: the closure produces a worse distribution of advantage (especially for the worst-off) than the pre-closure segregated state *or* than the integrated alternative Jackson rejected. This distributive condemnation is real and significant.

  Yet, the theory **is silent on crucial non-distributive aspects** that were central to the injustice and the Court's reasoning:
  *   **Expressive Harm:** The racist motivation and message sent by closing pools to avoid integration.
  *   **Violation of Equal Citizenship:** The denial of equal access based on race, irrespective of the distributive outcome.
  *   **Waste/Loss of Public Good:** The destruction of a valuable public resource for all.
  *   **Intent and Agency:** *Why* the closure was chosen (white supremacy) and *by whom* (the city government).

  Prioritarianism condemns the *distributive outcome*: making the worst-off even worse off. It does not inherently condemn the *reasons* (racism) or directly address the *expressive meaning* or *civic status denial*. Its condemnation focuses on the *resulting harm to well-being levels*, not the violation of a right to equal treatment or the malicious intent.

  **Is this silence a defect?** It depends on the scope of distributive justice. For a *purely* distributive theory, focusing solely on the allocation of advantage, it might be a correct diagnosis that the core injustice *in distributive terms* was the asymmetric harm inflicted on the already disadvantaged Black residents. However, for a comprehensive theory of justice regarding public goods and racial discrimination, this silence is a significant limitation. The non-distributive harms were arguably *constitutive* of the injustice in Jackson, not merely incidental. Prioritarianism captures a vital part of the wrong (the devastating distributive impact on the worst-off) but fails to capture the full moral character of the act as a deliberate racial exclusion and a betrayal of civic equality.

  ### 4. The Griffin Contrast: Prioritarian vs. Legal Distinction

  The Court distinguished *Palmer* from *Griffin* primarily based on the existence of state support for a discriminatory alternative in *Griffin* (tuition grants/property-tax credits for the whites-only academy) versus the lack of such support in *Palmer* (no alternative pools provided). The Court emphasized the affirmative duty not to support discriminatory schemes with public funds.

  **Prioritarian Distinction:**
  Prioritarianism would also distinguish the cases, but its basis is purely distributive and differs from the Court's:
  *   **Actual *Griffin* Scenario:** Prince Edward County closed public schools *while* providing state/county support enabling white students to attend a private segregated academy. Black students were left with *no* public education and no equivalent support. This massively *increased* the absolute advantage gap. White students retained access to education (a crucial advantage), while Black students lost it entirely. Prioritarianism would condemn this ferociously: it actively worsens the absolute position of the worst-off group (Black children) while maintaining or even enhancing the position of the better-off group (white children). The weighting function makes this outcome catastrophic.
  *   **Symmetric *Griffin* Counterfactual:** Imagine Prince Edward closed *all* public schools, provided *no* tuition grants, and *no* whites-only academy existed. All children, white and Black, are equally deprived of public education. Prioritarianism would still condemn this closure *if* Black children were worse off in absolute terms pre-closure (as they were due to systemic racism). The closure harms everyone, but harms the worst-off group (Black children) *more* in terms of the marginal value of the lost education. The concave weighting ensures the loss to Black children dominates the evaluation, making the closure distributively unjust. Compared to the *actual Griffin*, the harm is less severe because the advantage gap isn't actively widened, but it remains unjust due to the disproportionate impact on the worst-off.

  **Does it track the Court? Should it?**
  Prioritarianism's distinction tracks the Court's *outcome* (both closures condemned) but *not its reasoning*. Prioritarianism condemns *actual Griffin* more severely than the *symmetric counterfactual* because the former actively increases inequality by benefiting the better-off at the expense of the worst-off. The Court condemned *actual Griffin* based on the state's *affirmative support* for discrimination, a non-distributive, agency-focused reason. Prioritarianism condemns it based on the *distributive outcome* being far worse.

  The **silence on "why" and "by whom"** is inherent to prioritarianism as a state-of-affairs theory. It evaluates outcomes based on the distribution of advantage, not motivations or institutional actions. This is a *feature* of its structure – it aims for outcome-evaluation – but also a *limitation* for justice contexts heavily reliant on agency, intent, and rights violations. *Griffin*'s profound wrong included the state actively perpetuating segregation; prioritarianism captures the terrible distributive effect of that action but not the distinctive wrong of the state's *role* in creating the discriminatory alternative. Similarly, it captures Jackson's distributive harm but not the distinct wrong of the racist *motive* for closure. Whether this is an objection depends on whether one believes justice must account for agency or can be purely outcome-focused. For analyzing discriminatory state actions, the silence is problematic; for assessing the pure welfare impact of policy choices on differently situated groups, it may be sufficient.

  ### 5. Verdict: Confirmation, Anomaly, or Silent Territory?

  This pair of cases **largely confirms prioritarianism's core distributive insight** while exposing its **necessary silence on non-distributive dimensions of injustice**.

  *   **Confirmation:** Prioritarianism performs well in diagnosing the severe distributive injustice in both Jackson and Prince Edward County. It correctly identifies the Black residents/children as the worst-off group and assigns paramount moral weight to the devastating losses they suffered due to the closures motivated by resistance to integration. Its condemnation of *actual Griffin* as worse than the *symmetric counterfactual* is coherent and persuasive on distributive grounds. Its escape from the leveling-down objection is substantive in these cases; it condemns the closures because they harm, especially the worst-off, not because they (imperfectly) reduce inequality.
  *   **Exposed Silence/Anomaly:** The theory is **silent** on the critical factors of racist intent, expressive harm, and the violation of equal citizenship rights that were central to the historical and moral understanding of both episodes. It cannot explain why the Court's distinction based on affirmative state support in *Griffin* carries independent moral weight beyond the distributive outcome. It struggles to articulate the distinctive wrong of the state *choosing* discrimination, focusing only on the resulting distribution. Jackson highlights this: prioritarianism condemns the closure's distributive impact but cannot capture why closing the pools *to avoid integration* is profoundly different and worse than closing them for purely budgetary reasons with the same distributive outcome. This silence isn't an internal anomaly but a reflection of the theory's limited scope.
  *   **Underdetermination:** Your facts suffice for the distributive analysis. However, the analysis is underdetermined regarding the *full moral wrong* without incorporating the non-distributive elements of racial discrimination and civic betrayal. Furthermore, the precise shape of the weighting function and the exact specification of the "advantage" currency (beyond access to pools/schools) could subtly affect the strength of the condemnation, though the direction (strong condemnation, especially focused on Black residents/children) is robust across plausible specifications.

  **Conclusion:** Prioritarianism provides a powerful and coherent distributive lens on these historical injustices, vindicating its focus on the absolute position of the worst-off and its immunity to the leveling-down objection in these real-world contexts. It confirms that the core *distributive* harm fell overwhelmingly on the already disadvantaged Black communities. However, the pair also starkly reveals the theory's boundaries. It falls silent on the intentional, expressive, and civic dimensions that were integral to why these actions were profound injustices. Prioritarianism captures a vital part of the story – the devastating impact on well-being – but not the whole story of racial oppression and the violation of equal citizenship. A complete account of justice in these cases requires supplementing prioritarianism with principles addressing agency, rights, and recognition.
