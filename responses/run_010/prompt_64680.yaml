  ## The Keepers of Eilidh MacLeod

  The wind skirled off the Minch, scouring the bare stone of the village hall. Inside, the air hung thick with peat smoke and the damp wool scent of fifty islanders crammed onto benches, their faces etched with the same worry. The matter: a proposal from Moray Tidal Power. Leasing the common grazing and the adjacent seabed – the heart of their crofting lives – for a vast array of underwater turbines. Promises of jobs, steady income, a future less precarious. Fears of ruined fishing grounds, the roar beneath the waves, a way of life sold.

  Aidan MacAskill, chairing by default, rubbed his temples. "We're split, near down the middle. Twenty-three for, twenty-three against. By rights..." He trailed off, the unspoken name filling the silence like the tang of salt. *By rights, Eilidh MacLeod would be in this chair.* For forty years, the retired head teacher had been their uncrowned arbitrator, her wisdom settling boundary disputes, grazing rights, and the deep, slow-burning feuds that could fracture families for generations. Her word wasn't law, but it was *settled*. Now, her chair by the peat stove sat empty, save for the faint ghost of her tweed.

  "By custom," Aidan continued, his voice rough, "when such a tie occurs, and the one who would break it is... departed... we ask the Keepers. We ask... what would Eilidh say?"

  All eyes turned to the bench near the window: Calum MacLeod, Eilidh’s son, hands calloused from diving for scallops and crabs, knuckles white where they gripped his knees; Fiona Campbell, the island’s only doctor, who’d sat in Eilidh’s classroom at nine, learning fractions and fierce compassion; and Duncan Morrison, the retired crofter and church elder whose weathered face still carried the stubborn lines of his thirty-year disapproval of Eilidh’s pragmatic, sometimes unorthodox, ways.

  The hall held its breath. This was the discipline: no diaries rescued from the flames, no faded photographs to consult, no scratchy recordings of her voice. Only what lived now, imperfectly, in the minds of these three. The fire that had consumed Eilidh’s papers, letters, even her beloved collection of seashells, had been fierce and final. It wasn’t loss; it was *focus*. The pattern lived solely in the Keepers, or it did not live at all.

  Calum spoke first, his voice low, carrying the rhythm of the sea. "She’d say no. Absolutely." He looked out at the faces, seeing not the present worry, but past arguments Eilidh had settled. "Remember when Dougal wanted to put the new shed right on the burn’s edge? ‘Short-term gain, Calum,’ she said, that sharp look in her eye. ‘Digs its own grave, that kind of thinking. The sea and the land, they’re not just for us *now*.’ She’d see this as digging a grave for the seabed, for the creels. A quick fix that steals from our grandchildren." He paused, unconsciously raising his right hand, thumb rubbing the base of his index finger – precisely where Eilidh’s arthritis had gnawed, a gesture she made when steeling herself for opposition. "She’d say hold fast."

  Fiona stirred. She set down her mug of tea, her fingers mimicking Eilidh’s precise, almost fussy placement – not in the centre of the coaster, but just nudging the far edge. "I hear Calum," she said, her doctor’s tone measured but carrying an undercurrent of Eilidh’s dry authority. "But I remember something else. When the post office was threatened? ‘Practicality, Fiona,’ she told me. ‘Sentiment won’t keep the lights on or the ferry running.’ She weighed costs, tangible benefits. This… this could fund a proper surgery upgrade, bring a dentist regularly, maybe even tempt another young doctor to stay. She’d see the lives saved, the suffering eased. She’d weigh the seabed silt against a child not needing the air ambulance for a toothache." Fiona paused, her head tilting slightly, just as Eilidh’s had when dissecting an argument. "She’d likely say yes. Cautiously, with safeguards, but yes. For the people breathing now."

  A murmur rippled through the hall. Two answers. Opposites. Both delivered with unnerving echoes of the woman herself – the blunt pragmatism, the specific cadence of a remembered phrase, the small, embodied habits.

  Then Duncan cleared his throat, a sound like stones grating. He hadn’t disliked Eilidh; he’d *disagreed* with her, profoundly and often, about the looseness of modern morals, the shortcuts people took. "Aye, she’d weigh costs," he said, his voice rasping. "But not just coin. The cost to the soul of the place." He fixed his gaze on the Moray Tidal representative, a man in a suit looking profoundly out of place. "She knew this island. Knew its rhythm. That grazing? Not just grass. It’s where the young ones learn to herd, where the old ones find peace watching the light change. That seabed? Not just mud and crabs. It’s where generations learned the tides, the currents – knowledge passed down, not bought in a manual." Duncan’s hand rose, not in Eilidh’s gesture, but pointing a thick finger. "She’d say… ‘What profit a man, Duncan, if he gains the whole world?’" He paused, the biblical quotation hanging heavy. "She’d see this as selling our soul for a mess of pottage. She’d say no. Vehemently."

  Silence. Three answers. Three incompatible certainties, each backed by flawless, vivid recollection. Each keeper radiated conviction, each carrying a distinct fragment of Eilidh’s complex pattern: Calum, her protective connection to the land and sea; Fiona, her clear-eyed assessment of immediate human need; Duncan, her deep, sometimes rigid, sense of tradition and moral cost.

  Aidan sighed, the sound heavy in the quiet hall. "Well then. We’re no further. By the custom…" He looked at the three Keepers. "The meeting stands adjourned. Until you can agree. Agree on which of you *is* her voice in this. Reconvene tomorrow night. Torchlight, if needs be."

  ---

  The rain had started, a fine, cold drizzle, as Calum, Fiona, and Duncan filed out. Marsaili MacDonald, who’d left the island at eighteen for university and a life in Edinburgh, returning only after Eilidh’s funeral, fell into step beside Fiona. Marsaili carried a copy of Eilidh filtered through her own mother’s memories – a secondary resonance, fainter, more generalised.

  "It’s theatre, Fiona," Marsaili said, her voice low but sharp. "Beautiful, painful theatre. You’re all grieving, or remembering, or just… invested. Calum wants to keep the seabed pristine for his diving. You want the surgery upgrade. Duncan wants the old ways preserved. You’re each finding the Eilidh that suits you. But *her*? That sharp, contradictory, infuriating woman? Gone. Burnt. All that’s left is three brains running different simulations. A pattern needs consistency. This?" She gestured back at the dispersing crowd. "This is chaos. A ghost split three ways is no ghost at all, just noise."

  Fiona didn’t answer immediately. She felt the familiar pressure behind her eyes, the phantom sensation of Eilidh’s disapproval – or was it her own exhaustion? The blurring was becoming constant. Yesterday, she’d snapped at a patient for being careless with a sprained wrist, hearing Eilidh’s crisp, "Lack of foresight is its own punishment, young man," echo in her own admonishment. Was it memory, or was Eilidh’s pattern, nestled within her, *developing* its own responses to new situations? Or was Fiona simply fraying?

  They gathered in Eilidh’s old cottage, now Calum’s, the air still faintly holding the scent of beeswax and pipe tobacco she’d never quite eradicated. Duncan refused tea, standing rigidly by the cold hearth. Calum paced.

  "We need to find common ground," Fiona said, trying to summon Eilidh’s mediation voice.

  "Common ground?" Duncan scoffed, a sound Eilidh herself had often provoked in him. "You want turbines. Calum wants them sunk. I want the company sent packing. Where’s the common ground in that?"

  "Not on the *issue*," Fiona pressed. "On *her*. On which aspect of her is paramount here."

  Calum stopped pacing, staring out at the rain-lashed harbour. "She loved this place, Fiona. Deeply. Not just the people, but the rocks, the water, the way the light hits Beinn Mhor at sunset. That’s… fundamental."

  "She loved *us*," Fiona countered. "Our health, our futures. She’d weigh that against… rocks."

  "Sentiment!" Duncan barked. "She valued *integrity*. The integrity of the place, the integrity of our ways. That company? Soulless. It would change us, warp us. She saw that coming a mile off."

  The argument circled, each keeper invoking specific memories, quoting verbatim conversations, demonstrating mannerisms – Calum unconsciously smoothing his hair back like Eilidh when frustrated; Fiona tapping a specific rhythm on the arm of her chair, Eilidh’s ‘thinking tap’; Duncan’s jaw setting in the exact line of stubborn resistance Eilidh had so often argued against.

  Then came the extrapolation.

  Calum was arguing passionately about the specific breeding grounds for scallops in the proposed lease area. Fiona listened, her doctor’s mind ticking over the potential health impacts – not just the jobs, but the noise pollution, the stress of change on an ageing population, the possible disruption to local food sources.

  Suddenly, Fiona spoke, her voice taking on a flatter, colder tone than usual, devoid of Eilidh’s usual dry warmth but sharp with her analytical precision. "You're fixating on the scallop spat, Calum. Understandable, but narrow. Consider the sediment plumes. Fine particulates stirred constantly by those turbines. Inhalation risk for divers, certainly. But long-term? Respiratory issues across the population, especially the elderly and children. Increased asthma, chronic bronchitis. Eilidh wouldn't just see lost shellfish beds; she'd see the chests tightening in this very room in ten years' time. She’d factor *that* cost."

  Calum and Duncan stared. Duncan frowned deeply. "Did she ever say that? About… sediment plumes and asthma?"

  "No," Fiona admitted, the colour rising slightly in her cheeks. "She never spoke of tidal turbines. But she understood consequence chains. She understood that disrupting a system has ripple effects on health. When the septic tank failed down at Port nan Ron, she wasn't just worried about the smell; she was the one who insisted on testing the well water, predicting the stomach upsets before they happened. This… this is the same logic. Extended."

  "Extended?" Calum echoed, his voice tight. "Or invented? That sounds… clinical. Like *you*, Fiona. Not Mum. She cared about the life *in* the sea, the feel of the place, not… particulate counts."

  "Did she?" Fiona challenged, feeling a defensive heat that was entirely her own, yet mixed with the absolute certainty of Eilidh’s pragmatism. "Or did she care about the *people* whose lives depended on a healthy sea *and* a healthy body? Isn't that the same thing, ultimately? Where do you draw the line between the environment and the people in it?" It was Eilidh’s relentless connecting of dots, pushed into a realm she’d never explicitly considered. Was it her pattern evolving within Fiona’s context, or was it Fiona’s professional self, infused with Eilidh’s voice, speaking?

  Duncan looked disturbed. "It’s… plausible," he conceded grudgingly. "She did think ahead. But that tone… that’s not her warmth."

  "The warmth was for friends, Duncan," Fiona said, a hint of weariness creeping in, a weariness that felt borrowed. "For decisions like this? It was facts. Cold, hard, necessary facts."

  Calum rubbed his temples, a gesture that was becoming habitual, echoing Eilidh’s own headaches. He felt adrift. Arguing against Fiona felt like arguing against a fragment of his mother, yet agreeing felt like betraying the seabed she’d taught him to read like a book. The internal boundaries were dissolving. Was his fierce protectiveness his own, or Eilidh’s living on in him? The distinction was becoming agonisingly thin, a constant low hum of confusion that was the cost of carrying her so deeply.

  They argued through the night, the peat fire dying to embers. Memories clashed. Interpretations diverged. Marsaili’s words echoed: *"Three brains running different simulations… a ghost split three ways is no ghost at all."* Was she right? Was this elaborate, painful ritual just a way for the living to manage their loss and their disagreements, dressing it up as continuity? Or was Eilidh MacLeod genuinely present – not whole, not unified, but as a fragmented, living pattern resonating in the neural pathways of three people who had known her in profoundly different ways?

  Dawn was a grey smear on the horizon when Aidan knocked. The hall was filling again, the air thick with expectation and peat smoke.

  "Well?" Aidan asked, looking between the three exhausted Keepers.

  They exchanged a look – a complex mixture of resignation, duty, and unresolved conflict. No sentimental epiphany had united them. No sudden clarity revealed the ‘true’ Eilidh.

  Calum spoke, his voice hoarse. "We vote."

  Aidan blinked. "Vote? You three? On… on which of you speaks for her?"

  Fiona nodded. "It’s the only way. We embody her aspects. We vote on which aspect carries the most weight *for this decision*." It felt like a surrender to the fragmentation, yet also an acceptance of its reality.

  Duncan grunted, a sound of profound disapproval, but he didn’t object. Even his dissent felt like part of Eilidh’s legacy – the part that distrusted easy solutions.

  They wrote names on scraps of paper from Eilidh’s old shopping list pad, found in a drawer. Calum: Calum. Fiona: Fiona. Duncan stared at his paper for a long moment, his jaw working. Finally, he wrote: *Duncan*. He handed it to Aidan without meeting his eye.

  Aidan unfolded the papers. "Calum… Fiona… Duncan." He looked up, bewildered. "A three-way split? Again?"

  A tired sigh went through the assembled islanders. The Keepers stood before them, not united, not channels for a single clear voice, but carrying their conflicting fragments.

  Calum stepped forward. He looked out at the faces, the worry, the hope, the fear. He felt the pressure, the blurring, the echo of his mother’s fierce love for them all. He didn’t feel like Eilidh MacLeod. He felt like Calum MacLeod, saturated with her. He took a breath, unconsciously mimicking her preparatory pause before delivering an unpopular verdict.

  "We," he said, the word heavy, encompassing Fiona and Duncan, "are what remains of Eilidh MacLeod. Her pattern lives, but… distributed. We cannot speak with one voice, for she was never simple." He paused again, that precise, familiar hesitation. "The turbines. She would say…" He stopped, looked at Fiona, then at Duncan. Their faces were set, holding their truths. He looked back at the waiting island. "She would say the cost is too high. To the seabed. To the soul. To the quiet. We say… no."

  A murmur rose – relief from some, dismay from others. Fiona closed her eyes for a second. Duncan gave the faintest, stiff nod. Calum had spoken. He’d chosen a fragment, voiced it with her certainty. But as he stepped back, the weight of the decision settling, the question hung thick in the smoky air, unanswered: Had Eilidh spoken through him? Or had Calum, steeped in her memory, burdened by her pattern, simply chosen his own path and clothed it in her echo? The three Keepers stood together, a fragile monument not to a unified self, but to the enduring, disquieting puzzle of where a person ends and their remembrance begins. They walked out separately, into the grey, damp morning, leaving the island to live with the answer Calum had given, and the profound ambiguity of its source.

  ---
  **Author's Note**

  *   **Calum** embodies the deep, almost subconscious *integration* of the pattern, where self and carried identity blur into a lived experience, costly and confusing.
  *   **Fiona** demonstrates the pattern's potential for *extension* – applying core logic to unforeseen contexts, raising the question of development versus invention.
  *   **Duncan** represents how the pattern persists even within *antagonism* – carrying the essence of the 'other' through sustained, critical engagement.

  The story pushes back by highlighting the *fragility* of the distributed self. Three incompatible instantiations, each internally consistent but mutually exclusive, challenge the coherence of "one" pattern. The ending ritual – the Keepers voting – suggests the community ultimately imposes unity where the pattern itself offers none, prioritising function over metaphysical truth. The pattern exists, but its *authority* as a single entity remains profoundly questionable.
