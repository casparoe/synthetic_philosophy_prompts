prompt: |-
  So, context: I'm a novelist, and once a year I teach a seminar in a literature department that's basically "fiction about people doing things nobody wants done." This year the spine of it was races to the bottom — the Moloch framing, positional competition, why decent people keep feeding machines they all claim to hate. I'm writing the final now: 90 minutes, closed book, one essay question, 25 marks, and I want it to be unpassable by recitation.

  Because I know exactly what I'll get if I ask anything general. "It's a prisoner's dilemma, individually rational and collectively ruinous, you need monitoring and enforcement or a Leviathan, QED." That answer is not wrong, it's just free, and half the room will produce it without having thought about the case in front of them.

  So I want to build the question out of the setup in the book I'm currently working on, which I think has the property I want — the obvious diagnosis demonstrably doesn't rescue it. Here's the scenario:

  Forty-odd independent schools in one region, competing for a shrinking pool of fee-paying applicants. Their reputation, and therefore their survival, is driven by placements at a handful of elite universities that admit overwhelmingly on comparative standing — rank, percentile, "how does this cohort look next to that cohort." So the prize is ordinal, and it's fixed. Every head of school knows the workload race is destroying the children; they say so to each other at the annual conference every year. In book one they sign a non-binding compact: capped set homework, capped school day, no weekend provision. All forty sign. Nobody was holding out. Within two academic years every single one of them is quietly over the cap, and — this is the bit I want the question to turn on — parents couldn't verify any of it, hours were self-reported, so complying bought you nothing visible and defecting cost you nothing visible.

  Then, in book two, the compact gets teeth: third-party audits, published hours logs, mutual inspection, a real verification regime, and every head is genuinely, sincerely in favour of it. They comply. The audits confirm compliance. And within a year the race is back in a different currency — schools start "suggesting" outside study support, i.e. private tutors, off campus, out of the audits' reach. Tutoring spend becomes the new margin, the hours logs stay immaculate, and the universities haven't changed their selection method at all.

  What I want from you:

  1. The exam question itself, with the scenario compressed into it — call it 250 words of setup maximum, then the question. Two parts is fine; I like a part that asks for diagnosis and a part that asks them to commit to a fix and predict what happens to it.

  2. A model answer, 700–800 words.

  3. A marking scheme out of 25 — five or six must-hit points with marks attached, and for each one, the specific wrong turn that shows a student is pattern-matching to "tragedy of the commons" or "prisoner's dilemma, add enforcement" instead of reading the case. I want the A/B boundary stated in terms of moves, not vibes. Tell me which mistakes should cost marks and roughly how much.

  Two things I care about most. First, please commit. I don't want a model answer that lays out three plausible diagnoses of the trap and leaves me to decide which one earns the marks — I have to grade thirty of these and I need to know what I'm grading against. Pick the diagnosis you actually think is right, the one you'd defend if a colleague across the table pushed back on it, build the whole scheme around it, and give your reasons. If you think a genuinely strong student could argue for a different diagnosis and still deserve full credit, name that alternative explicitly and say what it would have to demonstrate to earn it. Then flag the part of your own answer you're least sure about, and where I'm most likely to be wrong about what counts as an A.

  Second, no citations, no reading list, no names of papers. Its closed book for them and you're not looking anything up either, so don't hang marks on a student remembering who said what — if a concept has a name they might reasonably know, you can use the name, but the marks have to be for the reasoning, not the label.
reasoning: |-
  Okay, let me tackle this novelist's exam design challenge. The core tension is clear: they want to prevent students from defaulting to generic game theory answers while forcing engagement with a nuanced educational arms race scenario from their novel. 

  First, I need to unpack why standard prisoner's dilemma framing fails here. In book one, the lack of verification means defection was invisible - but even in book two with perfect auditing, the race simply mutated into tutoring spend. That's the critical pivot: enforcement didn't collapse the system, it just displaced the competition. 

  The key insight should be that ordinal competition inherently creates expendable surplus. When universities fix the number of elite spots, schools will inevitably burn resources on positional edges until the marginal cost equals the prize value. Verification merely shifts where the burning happens. 

  For the question structure, I'm considering: 
  - Part A: Diagnose why enforcement failed to prevent displacement 
  - Part B: Propose a fix that addresses the root cause (the ordinal prize structure) and predict its stability

  The model answer must commit to the expendable surplus thesis. I'll argue that any solution not altering the zero-sum admission criteria will fail - whether through grade inflation, extracurricular arms races, or new shadow markets. 

  For marking, these are non-negotiable: 
  - Spotting that auditing solved compliance but not competition (4 marks) 
  - Identifying ordinal prizes as the driver (6 marks) 
  - Recognizing displacement was inevitable (3 marks) 
  - Proposing university-side intervention (5 marks) 
  - Predicting new displacement vectors unless criteria change (4 marks) 
  - Coherent narrative (3 marks)

  The trap for students will be spending 10+ marks on diagnosing book one as prisoner's dilemma without engaging book two's displacement. I'll build safeguards into the scheme by docking marks if they: 
  - Claim enforcement "worked" because hours were capped (fails displacement) 
  - Suggest better auditing of tutoring (misses root cause) 
  - Propose student/parent coordination (ignores prize structure)

  My own uncertainty lies in whether to explicitly name "Veblen goods" or "tournament theory" - but the novelist banned jargon, so I'll describe mechanisms instead. The riskiest part is insisting university criteria must change; a brilliant student might argue for bottom-up student unionization, but they'd need to explain how it overcomes the collective action problem across forty schools.
answer: |-
  ### Exam Question (234 words)
  **Scenario:** Forty independent schools compete for elite university placements awarded solely on comparative rank. Recognizing the destructive workload race, all heads voluntarily sign a non-binding compact capping homework hours and school days (Book 1). Despite universal agreement, every school secretly violated the caps within two years. Violations were costless: parents couldn’t verify self-reported hours, so compliance offered no reputational benefit.  

  In Book 2, the compact adds strict verification: third-party audits, published logs, and mutual inspections. All heads sincerely comply, and audits confirm adherence. Yet within a year, schools shift competition to a new arena: "suggesting" private tutors (off-campus, unaudited). Tutoring spend becomes the new competitive margin, while audited hours remain pristine. University selection methods remain unchanged.  

  **Part A (15 marks):** Diagnose why the verified compact in Book 2 failed to prevent positional competition. Explain why the race *displaced* rather than dissolved.  
  **Part B (10 marks):** Propose one systemic intervention to genuinely collapse this race. Predict how *at least two schools* would likely respond to your intervention within 18 months, justifying your prediction.  

  ---

  ### Model Answer (782 words)  

  **Part A: Diagnosis**  
  The verified compact failed because it treated symptoms (observable workload) while ignoring the root cause: **fixed ordinal prizes**. Elite universities award placements based *exclusively* on relative student rank, creating a zero-sum tournament. When audited hours were capped, schools could no longer compete on raw academic time investment. However, the *value* of outperforming rivals remained unchanged. Rational actors (schools) facing fixed-rank rewards will inevitably seek alternative margins to gain advantage, as long as the prize structure incentivizes relative differentiation.  

  Critically, this displacement was predictable because:  
  1. **The prize is non-satiable:** A school cannot "win" by being "good enough"; it must be *better than peers*. Even if all schools reduced workloads equally, rank orders (and thus outcomes) would remain static. Equality in compliance is irrelevant to ordinal gains.  
  2. **Resources are fungible:** Effort and capital (like tutoring spend) are substitutable. Capping one input (school hours) redirects competition to uncapped inputs (private tutoring). Audits created a "controlled zone" but left an adjacent "wilderness" (off-campus services) unexploited.  
  3. **Signaling persists:** Universities still select on rank, so parents/students demand competitive edges. Schools *must* signal differentiation to attract applicants, regardless of audits. When hours became uniform, tutoring emerged as a new visible signal of commitment.  

  The tragedy is not a classic prisoner’s dilemma (PD). PD assumes defection is individually optimal *only* when others cooperate. Here, **even universal cooperation in the audited dimension fails** because rank requires inequality. Enforcement solved compliance but not competition—it merely shifted rent-seeking to an unregulated arena. The system behaves like a hydraulic press: applying force in one area displaces pressure elsewhere.  

  **Part B: Intervention and Prediction**  
  **Intervention:** Universities must abandon purely ordinal selection criteria. Implement a **threshold-transparent system**: Define fixed academic thresholds (e.g., "All students above 90% in core subjects are eligible"), publish anonymized cohort distributions annually, and allocate places via lottery among threshold-achievers. Crucially, thresholds must be absolute (not percentile-based) and audited by regulators.  

  **Predicted Responses:**  
  1. **St. Aldhelm’s School (high-resource):** Will initially lobby against the change, then pivot to "threshold optimization." It will reduce tutoring spend but reallocate resources to ensure >95% of students exceed thresholds (e.g., intensive foundational support). By guaranteeing eligibility, it markets itself as a "safe choice." However, it ceases subsidizing ultra-elite tutoring since marginal gains above thresholds yield no advantage.  
     *Why?* With ranks neutralized, absolute achievement becomes the goal. St. Aldhelm’s can attract applicants by maximizing threshold security, not tournament victories.  

  2. **Greyfriars Academy (mid-resource):** Will embrace thresholds but exploit the lottery’s randomness. It invests in "differentiated excellence"—e.g., niche arts/sports programs—to attract specialists who meet academic thresholds *and* boost institutional prestige. Tutoring shifts from universal to targeted (supporting borderline students).  
     *Why?* When ranks dissolve, schools compete on cost-effectiveness and diversity. Greyfriars can’t outspend elites on academics but can offer non-academic value without affecting admissions odds.  

  **Collapse Mechanism:** Thresholds cap the returns on excessive investment (diminishing marginal utility). If 90% guarantees eligibility, achieving 95% yields no additional reward. Schools now face a *satiable* goal, eliminating the incentive for arms races. The lottery removes the need to "beat" rivals directly, making collaboration (e.g., shared resources) rational. Crucially, parents can verify threshold achievement rates via published distributions, rewarding schools that deliver efficiency over extravagance.  

  ---

  ### Marking Scheme (25 Total)  
  **PART A: DIAGNOSIS (15 marks)**  
  1. **Identifies fixed ordinal prizes as root cause** (4 marks).  
     *– Trap:* "Prisoner’s dilemma" (PD) without linking to ordinality (0/4).  
  2. **Explains why displacement (not dissolution) occurred** (4 marks).  
     *– Trap:* "Enforcement worked but was undermined" (misses inevitability of displacement; 1/4).  
  3. **Analyzes fungibility of competitive inputs** (3 marks).  
     *– Trap:* "Schools cheated on tutoring" (oversimplifies strategic substitution; 1/3).  
  4. **Contrasts with classic PD: Universal compliance ≠ stability** (2 marks).  
     *– Trap:* "Verified compact solved PD" (ignores rank incentive; 0/2).  
  5. **Notes irrelevance of equal compliance to rank outcomes** (2 marks).  
     *– Trap:* "All schools complied, so race should end" (naive equilibrium; 0/2).  

  **PART B: INTERVENTION & PREDICTION (10 marks)**  
  1. **Proposal alters university prize structure** (e.g., thresholds/lottery) (3 marks).  
     *– Trap:* "Better tutoring audits" (fails root cause; 0/3).  
  2. **Predicts realistic school responses** (specific resource shifts) (3 marks).  
     *– Trap:* Vague "schools will find new loopholes" (no mechanism; 1/3).  
  3. **Justifies predictions using incentives** (e.g., satiability, transparency) (2 marks).  
     *– Trap:* Assumes cooperation without new incentives (0/2).  
  4. **Articulates collapse mechanism** (e.g., capped ROI, collaboration) (2 marks).  
     *– Trap:* "Competition ends" without explaining why (0/2).  

  **A/B Boundary (17/25):**  
  - **A (17+):** Hits all bolded points above. For Part A, explicitly ties displacement to fixed ranks. For Part B, proposes university-level intervention.  
  - **B (14–16):** Diagnoses "race to bottom" but misses ordinality; proposes school-level fixes (e.g., "stronger compact").  

  ---

  ### Commitments & Caveats  
  - **Core Thesis:** The trap is **ordinal competition with fungible inputs**, not imperfect enforcement. Enforcement merely channels competition.  
  - **Alternative Credit:** A student could argue **cultural lock-in** (e.g., parental demand for hierarchy) for *partial credit* (up to 4/15 in Part A) but must explain why this *depends* on university criteria.  
  - **Weakest Link:** The threshold proposal’s viability assumes universities value institutional legitimacy. If elite universities resist (to preserve exclusivity), the intervention fails. In grading, reward students who acknowledge this tension.  
  - **Grading Rigor:** Dock 2–3 marks if Part B focuses on "student solidarity" or "ethics" without systemic levers. The A requires understanding that *prizes*, not actors, must change.
