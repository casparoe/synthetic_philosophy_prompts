  ### Bertrand Paradox Activity: "The Mysterious Chord"

  **Objective:** Students confront the failure of the principle of indifference by generating different probabilities for the same event ("random chord longer than the side of an inscribed equilateral triangle") using physically distinct but equally "natural" methods. They collect data, bet on a hidden device, and discover that "uniform randomness" depends on parameterization.

  **Time Allocation:**  
  - Intro (5 min)  
  - Activity (40 min)  
  - Bet & Hidden Device (10 min)  
  - Debrief (25 min)  

  **Materials per Group (8 groups of 3):**  
  - Circle of radius **10 cm** drawn on paper (for Methods 1 & 3) or large poster board on the floor (for Method 2).  
  - Reference stick (length = \(\sqrt{3} \times 10 \approx 17.32\) cm) for inscribed triangle side.  
  - Ruler, protractor, pencil.  
  - **Method-specific kits (details below).**  
  - Tokens (e.g., poker chips): 10 per group for betting.  

  ---

  ### Activity Setup  
  **Groups & Methods:**  
  - **3 groups: Method 1 (Random Endpoints)**  
    - Kit: Two spinners (paperclip on pencil through circle center), angle guide (0°–360°).  
  - **3 groups: Method 2 (Random Straw Toss)**  
    - Kit: 20+ drinking straws (length > 20 cm), large circle on floor.  
  - **2 groups: Method 3 (Random Midpoint)**  
    - Kit: Grid overlay (10×10 cm squares) for circle, bag of 100 tokens (1 per grid cell inside circle), lookup table (cell → midpoint coordinates).  

  **Instructions for All Groups:**  
  1. Generate 20 random chords using your method.  
  2. For each chord, determine if it is **longer** than the reference stick (17.32 cm).  
  3. Calculate your observed probability: \(\frac{\text{number of long chords}}{20}\).  

  **Method-Specific Recipes:**  
  - **Method 1 (Random Endpoints):**  
    > *"Spin both spinners to get two random points on the circle. Draw the chord between them. Measure length and compare to the stick."*  
    - **Physical generation:** Spin spinners independently, mark points, draw chord, measure.  
    - **Theoretical probability:** \(P(\text{long}) = 1/3\).  

  - **Method 2 (Random Straw Toss):**  
    > *"Stand 2m back. Toss a straw onto the circle. If it crosses the circle, mark the two intersection points, draw the chord, and measure. If it misses, re-toss."*  
    - **Physical generation:** Toss straws; only count tosses that cross the circle.  
    - **Theoretical probability:** \(P(\text{long}) = 1/2\) (matches classic "random radius" method).  
    - **Why straws ≠ darts:** Straws approximate random *lines* in a plane (uniform in direction and distance from center), yielding the same distribution as "random radius." Darts (points) approximate "random midpoint" (Method 3).  

  - **Method 3 (Random Midpoint):**  
    > *"Draw a token from the bag to pick a grid cell. Use its midpoint. Draw the chord perpendicular to the radius at this point. Measure and compare."*  
    - **Physical generation:** Draw token → find cell midpoint → draw perpendicular chord → measure.  
    - **Theoretical probability:** \(P(\text{long}) = 1/4\).  

  ---

  ### The Bet: "Challenge the Oracle"  
  After groups compute their probabilities:  
  1. **Commit:** Each group writes their **single probability** (e.g., 0.33, 0.50) for the event on a slip.  
  2. **Stake:** Each group bets 5 tokens (symbolic) against a hidden device ("Oracle").  
  3. **Oracle Reveal:**  
     - Use a **spinner-based hidden device (Method 1)** to generate 10 chords.  
     - Calculate Oracle’s observed frequency of long chords.  
  4. **Payout:**  
     - Groups lose 1 token for every **0.05 deviation** between their committed probability and Oracle’s frequency.  
     - *Example: Oracle’s frequency = 0.30. Group committed 0.50. Deviation = 0.20 → lose 4 tokens.*  
     - **Why it stings:** Groups with "correct" randomness (Method 1) keep tokens; others lose tokens despite equal justification.  

  ---

  ### Predictable Issues & Mitigation  
  **What Will Go Sideways:**  
  1. **Straw toss chaos:**  
     - Straws often miss the circle or bounce out.  
     - **Fix:** Provide extras; allow re-tosses; use large circles (30+ cm).  
  2. **Grid measurement errors (Method 3):**  
     - Students struggle to draw perpendicular chords.  
     - **Fix:** Include protractors; pre-compute chord lengths in the lookup table.  
  3. **Probability confusion:**  
     - Groups may conflate their observed frequency with the "true" probability.  
     - **Fix:** Emphasize: "Your number is what nature gave you. Own it for the bet."  
  4. **Time crunch:**  
     - Method 2 (straws) is slow; Method 3 (grid) is tedious.  
     - **Fix:** Cap trials at 15 per group if needed.  

  **What the Activity Can’t Reproduce:**  
  - **Exact theoretical probabilities (1/3, 1/2, 1/4):** Finite trials introduce noise.  
    - *Supply by hand:* In debrief, reveal classic values and stress they emerge from infinite trials.  
  - **Why parameterization matters:** Students may see this as a "trick."  
    - *Supply by hand:* Use debrief to show how each method samples different "uniform" spaces.  

  ---

  ### Debrief Script (Key Points)  
  1. **Report group probabilities:**  
     - Method 1: ~0.33, Method 2: ~0.50, Method 3: ~0.25.  
     - "You all started with 'pick uniformly'—why different results?"  

  2. **Reveal Oracle’s method (spinner = Method 1):**  
     - "Why did Methods 2 and 3 lose tokens? Were they 'wrong’?"  

  3. **Introduce the paradox:**  
     - Show how each method maps to a parameter space:  
       - Endpoints → uniform on circumference × circumference.  
       - Straws → uniform lines (direction + distance from center).  
       - Midpoint → uniform in disk area.  
     - "The circle doesn’t tell you *which space* to make uniform. Indifference fails!"  

  4. **Land the kicker:**  
     - "If I say ‘pick a point uniformly,’ you must ask: ‘*On what?*’ The circle’s description isn’t enough."  
     - Contrast with non-paradoxical cases (e.g., dice rolls).  

  5. **Reveal "Bertrand Paradox":**  
     - "This has a name! Bertrand showed this in 1889 to challenge probability foundations."  
     - **No calculus needed:** Use geometry to sketch why:  
       - Method 1: Long chords span <120° arc (1/3 of possibilities).  
       - Method 2: Long chords occur when midpoint is <5 cm from center (1/2 of radius).  
       - Method 3: Long chords require midpoint in inner disk (radius 5 cm; area ratio = 1/4).  

  ---

  ### Why Straws ≠ Darts (And Why It Matters)  
  Your colleague is **correct:**  
  - **Darts** hit a point → density uniform in **area** → midpoint method (Method 3, \(P = 1/4\)).  
  - **Straws** approximate random **lines** → density uniform in **direction and distance** → radius method (Method 2, \(P = 1/2\)).  
  - **Physical intuition:**  
    - A line is parameterized by angle \(\theta\) (0–360°) and distance \(d\) from center (0–10 cm).  
    - The "natural measure" for lines is \(d\theta\,dd\) (not \(d\theta\,dA\)!).  
    - Straw tossing approximates this, while darts do not.  

  **Included in activity:** Method 2 uses straws to *physically manifest the distinct distribution*, preventing students from conflating methods.  

  ---
  This activity forces students to generate the paradox from scratch, bet on their "truth," and discover that randomness requires specifying the *space* of indifference. The sting of token loss makes it unforgettable!
