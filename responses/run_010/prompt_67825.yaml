prompt: |-
  Thirty-eight years in experimental geophysics, retired last spring, and now for some reason I'm the "independent lay member" on a county panel that reviews risk numbers coming in from engineering consultants — tailings dams, a solvent plume under an old works, that sort of thing. Since retiring I've been reading philosophy of science and got hooked on the argument about what a probability even is: the frequency view, the personal-degree-of-belief view, and the propensity view where the number is supposed to be a physical disposition of the setup itself. Turns out our panel has been having this argument for years without knowing it. Last month a consultant handed us an annual failure probability of 3 × 10⁻⁴ for a dam that gets closed in forty years, derived mostly from eliciting engineers' opinions, and called it objective. One of my colleagues says if no failure happens in those forty years the claim was simply false and the firm should be sanctioned. Another says the number means nothing unless somebody will actually bet on it at those odds. I dont think either of them is right, but I couldn't say why.

  So write me a procedure the panel can run on any submitted number. What do we ask, in what order, and what counts as a decent answer to each question? It has to make the submitter say which of the three readings they're offering the number under — and cope with the honest answer, which is usually that they havent thought about it — tell us what each reading licenses us to do with the figure and what it forbids, and say plainly where we should just send the thing back rather than argue. Mark the steps that look procedural but are really judgement calls, and say where the whole apparatus gives out, e.g. a genuinely one-off event with no sensible reference class.

  Then run it on two cases: the 3 × 10⁻⁴ dam figure, and a valve model with a documented failure record across a hundred similar plants. I expect one of the two to come out somewhere I won't like — don't soften it.

  No headings, no bullet points, no bold, no tables: I want to forward this to the other four members as an email, so plain continuous prose with the steps signposted inside the sentences, first this then that. And no references or reading list, I can find my own books.
reasoning: |-
  Okay, let me approach this systematically. The user presents a complex scenario at the intersection of professional practice and philosophy of science. They're a retired geophysicist now serving on a risk assessment panel, frustrated by colleagues' misunderstandings of probability interpretations. The core request is for a practical procedure to evaluate risk figures submitted by consultants, with two concrete cases to test it.

  First, I need to consider the user's background: 38 years in experimental geophysics suggests they value precision but dislike theoretical jargon. Their recent dive into philosophy of science indicates intellectual curiosity, but the "no references" demand shows they want actionable tools, not academic debates. The panel dynamics described reveal tension between three perspectives: frequentist (colleague 1), subjectivist (colleague 2), and likely the user's inclination toward propensity views.

  The procedure must accomplish several things: force submitters to declare their probability interpretation (frequency, belief, or propensity), establish permissible uses for each, identify when to reject submissions, and handle "I haven't thought about it" responses. It should also flag judgment calls and acknowledge limitations for unique events. Crucially, it needs to work in plain prose for email distribution.

  For the dam case (3×10⁻⁴ from expert elicitation), the key issues are: calling this "objective" is problematic since it's actually subjective belief quantified; the "false if no failure" colleague misunderstands probability as deterministic; the betting colleague conflates probability with willingness to wager. The procedure should expose these flaws.

  For the valve model case (100-plant data), this fits frequentist interpretation best but requires examining reference class validity. The user expects to dislike one outcome - probably the dam case, where we might conclude the number lacks physical basis for long-term decisions.

  When structuring the response, I'll build the procedure as a sequence of questions with decision points, then apply it to both cases. The tone should be professional yet accessible, avoiding markdown as requested. For judgment calls, I'll explicitly note where panel discretion is needed (e.g., evaluating reference classes). The conclusion should validate the user's skepticism about the dam figure while showing how the valve data passes scrutiny.
answer: |-
  Here's a procedure the panel can follow when reviewing any submitted probability figure, presented as requested. Apply it step by step to each submitted number.

  First, ask the submitter to explicitly state which interpretation of probability they are using for this specific figure: (1) Frequency: the number represents an observed or estimated long-run proportion of occurrences in a well-defined reference class; (2) Degree of Belief: the number quantifies a reasonable, informed judgment about the likelihood, often derived from expert opinion or Bayesian updating; or (3) Propensity: the number represents an inherent, physical tendency of the specific system or setup to produce the outcome, independent of observation or belief. If they haven't thought about it, require them to choose one now, justifying how their derivation method maps onto that interpretation. If they refuse or cannot meaningfully align their method with one interpretation, send the submission back immediately; a number without a defined ontological basis is uninterpretable.

  Second, for the chosen interpretation, ask the submitter to provide the justification and limitations implied by *their* interpretation. For Frequency, they must define the reference class (e.g., "failures per dam-year for embankment dams of type X, height Y, in climate Z, based on database ABC") and explain how this specific case fits within it. Judge whether this reference class is relevant and sufficiently similar; this is a critical judgment call. If the reference class is inappropriate or poorly defined, the number cannot be used predictively for *this* dam. For Degree of Belief, they must describe the evidence, expertise, and reasoning process (e.g., structured expert elicitation protocol, Bayesian prior and likelihood) used to quantify the belief. Judge the adequacy and traceability of this process; another judgment call. A number based purely on unstructured opinion is weaker than one from a formal protocol. For Propensity, they must describe the physical model or inherent properties of *this specific system* (e.g., material fatigue constants, geotechnical stability equations) from which the propensity is derived. Judge whether the model adequately captures the system's actual physical disposition; a major judgment call. If the justification for the chosen interpretation is absent, internally inconsistent, or demonstrably inadequate given the system's complexity or uniqueness, send the submission back.

  Third, ask what the submitter claims this number *licenses* users (like the panel) to do. For Frequency, it licenses predicting the approximate proportion of failures in a large ensemble of similar cases or over a long time period for this type of system. It does *not* license precise predictions for a single, short-term instance or guarantee non-occurrence in this specific case. For Degree of Belief, it licenses updating one's own uncertainty based on the quantified judgment of experts (or the model), informing decisions under uncertainty. It does *not* license claims about the objective, long-run frequency or the inherent physical nature of the system. For Propensity, it licenses claims about the inherent tendency of *this specific system* to fail, even if it's unique. It does *not* license claims about frequencies in other systems unless their identical propensity is demonstrated. If the claimed licenses overstep what the interpretation allows (e.g., a belief-based number claiming inherent propensity, or a frequency number guaranteeing no failure in 40 years), challenge them to rejustify or correct the submission.

  Fourth, ask what the number *forbids* users from doing, based on its interpretation. For Frequency, it forbids interpreting it as the "true chance" for this single dam failing in 40 years or sanctioning someone if failure doesn't occur. For Degree of Belief, it forbids treating it as an objective fact about the world independent of the experts/models used. For Propensity, it forbids direct verification by short-term frequency counts unless the ensemble is vast. If the submitter cannot articulate meaningful limitations or denies any exist, treat this as a red flag; all probability interpretations have inherent limitations.

  Fifth, check for coherence with the event and context. If the scenario is genuinely one-off with no plausible reference class (Frequency impossible), no relevant expertise/model (Belief highly speculative), and no well-established physical model (Propensity unquantifiable), acknowledge the apparatus gives out. The panel should then require the submitter to explicitly state the figure is purely notional/conventional/for compliance only, not a meaningful probability, or reject the figure entirely if it claims predictive power.

  **Applied to the Dam Case (3 × 10⁻⁴):**
  Ask the interpretation. They derived it from eliciting engineers' opinions. This is fundamentally Degree of Belief. Calling it "objective" is incorrect; it's intersubjective consensus at best. Send it back if they refuse this classification. For justification, require details on the elicitation process (experts, questions, aggregation method). Judge its adequacy (e.g., Was bias addressed? Was uncertainty in the estimates captured?); a major judgment call. A poor process warrants sending it back. The license claimed: They likely intend it to inform long-term risk decisions (appropriate for Belief). It forbids treating it as a guaranteed failure rate (e.g., "false if no failure in 40 years" is nonsense for Belief) or as an inherent property. If a colleague demands sanctions for non-failure, point out this misinterprets Belief as Frequency or Propensity. The number is an input for decision-making under uncertainty, not a falsifiable frequency claim. The key judgment is whether the elicitation was robust enough to support using this number for its intended purpose.

  **Applied to the Valve Model (Documented Failure Record):**
  Ask the interpretation. A documented failure record across many plants strongly suggests Frequency. Confirm the reference class: the exact valve type, operating conditions, maintenance regime, and time period covered. This is a crucial judgment call – are the hundred plants truly similar? Minor variations matter. The justification hinges on data quality and relevance. The license is predicting failure rates for similar valves in similar settings. It forbids precise predictions for a single valve or claims about inherent propensity unless proven. The figure shouldn't be sent back if the data and reference class are well-documented and relevant. The judgment call is the adequacy of the reference class definition and data quality assurance. This case should be robust *if* the reference class is valid.

  The dam figure, interpreted correctly as Degree of Belief, won't satisfy someone demanding Frequency or Propensity certainty. It shouldn't be presented as objective, and sanctions for non-occurrence misunderstand probability. Its validity rests entirely on the quality of the elicitation process – a judgment the panel must make. The valve figure, if the reference class holds, is the most straightforward, but its predictive power is inherently statistical, not deterministic for any single valve. The procedure forces clarity on what the number represents and constrains how it's used, revealing where disagreements stem from conflicting interpretations rather than the number itself. It highlights that judgment is unavoidable, especially in assessing reference classes, model adequacy, and expert process quality. When the event lacks any sensible basis for quantification (one-off), the procedure forces that admission.
