prompt: |-
  I built an argument for a philosophy-of-biology reading group with the narrow purpose of embarrassing the spandrels critique, and it worked far too well: as far as I can see, it now shows that no claim about the origin of any trait is ever evidentially supported, which I am not prepared to accept. I want a diagnosis of the reasoning, not a defence of it, and not a survey of the adaptationism debate — assume I know its general shape.

  The case I built the argument around is invented but meant to be realistic. In a clade of forty fossorial rodents, a lateral bony shelf on the cheekbone — call it the zygomatic flange — scales against skull length with an allometric exponent of about 1.6, so that relatively larger skulls carry disproportionately larger flanges. Ontogenetically the flange is the last element of the lateral skull to differentiate, appearing only after the masseter attachment area has been fully laid down. Two stories cover these facts. Adaptationist: the flange is a lever arm maintained by selection for forceful chewing in hard substrates. By-product: selection acts on the extent of the masseter attachment field, and the flange is what bone has to do at the margin of an expanding attachment field, so it is a consequence of that expansion rather than a target in its own right.

  The argument:

  (1) The force of the spandrels critique is that a trait's good design does not license an inference to direct selection, because the trait may be a structural concomitant of some other feature that is itself under selection.

  (2) For any trait T and any body of comparative evidence E — allometric series, ontogenetic sequences, phylogenetic distributions — a by-product hypothesis B can be constructed: pick any trait S that E correlates with T and posit T as a structural consequence of S.

  (3) In my case, the adaptation hypothesis A and the B constructed from E entail exactly the same allometric exponent and exactly the same ontogenetic order.

  (4) Where two hypotheses entail the same evidence, that evidence assigns them the same likelihood and so cannot favour one over the other.

  (5) Hence E does not favour A over B; and since the construction in (2) is always available, no comparative evidence ever favours an adaptation hypothesis over a by-product hypothesis.

  (6) The construction is symmetric: for any spandrel claim, posit instead a selection regime that would produce the same correlation. So no comparative evidence ever favours a by-product hypothesis either.

  (7) Therefore no claim about trait origins in functional morphology is ever supported by evidence — including the positive claims Gould and Lewontin make about particular structures, which stand or fall by the same comparative data.

  (8) Hence the spandrels critique is self-undermining, and so by parity is any methodological critique of functional inference, since each must rest on trait-level inferences of the kind it declares unsupported.

  I cannot live with (7), and I am not willing to buy (8) either. I am most attached to (1) and to (4) — (4) strikes me as a bare fact about likelihoods that no one should be asked to surrender — and least attached to (6). So if your diagnosis lands on (4), I want to be shown precisely what is lost rather than being told that it is false.

  Please open with a single sentence naming the step or steps you reject, then give me four sections in this order:

  **The failing step** (about 200 words): locate the slide — equivocation, quantifier order, category mistake, whatever it is — and state it with enough precision that I could see it happening in the inference. Write out the corrected version of the step if a corrected version exists, and say so explicitly if none does.

  **Why it looked sound** (about 200 words): explain the pull of that step by working through the rodent case, and say what is genuinely right about the intuition behind it.

  **What each repair costs** (about 450 words): take at least three candidate steps to reject — including (4), whether or not it is your diagnosis — and for each say what has to be given up or taken on if it goes, and whether the position that survives is one Gould and Lewontin could coherently have held.

  **What the critique keeps** (about 200 words): restate the strongest version of the methodological point that survives your diagnosis, and say what commitments it now carries that its critics were entitled to demand of it.
reasoning: |-
  Hmm, the user presents a sophisticated philosophical argument about adaptationism in evolutionary biology. They've constructed a self-undermining dilemma based on the "spandrels" critique by Gould and Lewontin, and now want help diagnosing where their reasoning fails. The argument cleverly demonstrates that comparative evidence can't distinguish between adaptationist and by-product explanations, leading to complete evidential paralysis.

  The core problem lies in Step 2. The user assumes that any correlated trait S can arbitrarily be posited as the "real" target of selection making T its by-product. But this ignores the biological reality that not all traits are equally plausible candidates for direct selection. The zygomatic flange's correlation with masseter attachment doesn't automatically make masseter the selectable trait - we'd need to consider developmental constraints, functional independence, and whether masseter variation actually affects fitness.

  Step 3's claim of identical predictions is also problematic. While the scaling exponent might match, the adaptationist explanation should predict functional consequences the by-product story wouldn't - like flange fractures during chewing or differential survival in hard-soil environments. The evidence described doesn't actually test these distinct predictions.

  I need to show why Step 2 overreaches without denying the valid core of the spandrels critique. The repair requires accepting that evidentiary support comes from testing differential predictions, not just matching patterns. This preserves Gould and Lewontin's methodological warning against naive adaptationism while avoiding the self-defeating extreme.

  The user's attachment to likelihood principle (Step 4) is understandable but misplaced in this context. The issue isn't that evidence assigns equal likelihood, but that the described evidence is insufficient to test the competing hypotheses properly. Better comparative methods could distinguish them - for instance, looking for functional consequences or phylogenetic patterns where the traits decouple.

  Ultimately, the surviving critique is more modest: good design alone is insufficient evidence, and by-product hypotheses deserve consideration. But it doesn't claim all explanations are equally valid or unsupported - just that we need more rigorous evidentiary standards incorporating development and constraint.
answer: |-
  ### Step rejected: Step 2 (specifically, the claim that "for any trait T and any body of comparative evidence E, a by-product hypothesis B *can be constructed*" in the manner described).

  **The failing step (198 words):**  
  The error is a **misapplication of underdetermination**. Step 2 claims that *any* correlated trait S in E can be arbitrarily designated as the "real" target of selection, making T a by-product. This equivocates between *logical possibility* and *biological plausibility*. While you can always *formally posit* such an S, this ignores whether S is *itself a selectable unit*. In your rodent case, the masseter attachment field might not be developmentally or functionally isolable from the flange—it could be part of a integrated complex. The step treats traits as modular Lego blocks, but developmental biology shows traits are often interdependent. A "corrected" Step 2 would require that S must be a *plausible target of selection independent of T* (e.g., S must have functional consequences separable from T’s effects). Without this, Step 2 constructs *vacuous alternatives* that exploit underdetermination but lack empirical traction.

  **Why it looked sound (201 words):**  
  In your rodent case, the allometry/ontogeny *do* symmetrically support A and B *if we accept Step 2’s construction*. The intuition is valid: comparative patterns alone (scaling, timing) *can* be explained multiple ways. This mirrors Gould and Lewontin’s point that correlations don’t uniquely indicate direct selection. Your argument exposes that **mere consistency** with evidence is insufficient for support. The pull comes from likelihoodism’s core tenet (Step 4): if two hypotheses predict the same data, the data can’t distinguish them. Here, both A (“flange selected for chewing”) and B (“flange by-product of masseter expansion”) predict the observed allometry/ontogeny. Step 2’s generality seems like a natural extension—why *shouldn’t* we always be able to reframe T as a by-product of some S? The flaw is that "S" in B isn’t just *any* correlate; it must be a biologically coherent selective target.

  **What each repair costs (448 words):**  

  1.  **Reject Step 2 (as above):**  
      *Cost:* You surrender the *universality* of spandrel-generation. Not every correlation licenses a by-product hypothesis—only those where S is a *candidate adaptation in its own right* (e.g., the masseter attachment must plausibly enhance fitness independently of the flange). This demands deeper biological constraints: developmental modularity, functional decoupling, or phylogenetic dissociability.  
      *Gould/Lewontin coherence:* They implicitly accepted this. Their spandrels (e.g., chin, genital bones) invoked *specific* constraints (developmental pathways, architectural necessity), not arbitrary S. They could hold that by-product hypotheses require positive evidence for S’s selectability.  

  2.  **Reject Step 4 (likelihood equivalence):**  
      *Cost:* Abandoning strict likelihoodism for trait origins. You must accept that evidence can support A over B *even if both fit E equally well*, via auxiliary criteria like parsimony, consilience with functional tests (e.g., biomechanical modeling), or eliminative induction (e.g., if variations in S don’t correlate with fitness, B fails). Step 4’s "bare fact" holds only *if* hypotheses are equally simple and equally integrated with background knowledge—which A and B aren’t.  
      *Cost severity:* High. Likelihood principles are foundational. But biology often uses "explanatory coherence" (e.g., A explains flange fractures in hard-soil populations; B doesn’t). Gould/Lewontin *relied* on such reasoning (e.g., "why *would* selection build this spandrel?").  

  3.  **Reject Step 6 (symmetry):**  
      *Cost:* Grant that adaptationist hypotheses *can* be evidentially favored over by-product ones (e.g., via optimality tests, population genetics), but not vice versa. This weakens the spandrels critique to a cautionary note: by-product hypotheses are harder to support.  
      *Gould/Lewontin coherence:* They’d reject this. Their critique demanded *parity*: by-product claims should be testable too (e.g., via developmental perturbations). But if symmetry breaks, their positive claims (e.g., human chin as spandrel) lose force unless backed by unique evidence.  

  **What the critique keeps (199 words):**  
  The surviving critique is **methodological humility**: comparative patterns (allometry, ontogeny) *alone* cannot distinguish adaptation from by-product hypotheses, as both can be equally consistent with them. To support *any* origin claim, you need:  
  **(a)** Evidence that the putative selected trait (whether T in A or S in B) is *functionally significant* (e.g., biomechanical tests showing flange leverage affects chewing efficiency).  
  **(b)** Evidence that the trait *could be a unit of selection* (e.g., developmental independence of S from T).  
  **(c)** Exclusion of alternatives via consilience (e.g., phylogenetic instances where S evolves without T, falsifying B).  
  Gould and Lewontin’s core demand—that adaptationists justify why a trait *isn’t* a by-product—stands, but now *both sides* bear this burden. The critic is entitled to demand that functional hypotheses test for spandrels via (a)–(c), and that spandrel advocates positively demonstrate constraint. The paralysis dissolves because evidence *beyond* correlation breaks the symmetry.
