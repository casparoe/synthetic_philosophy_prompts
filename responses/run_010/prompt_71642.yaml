  Two people I've been reading on a rationalist-ish Discord for the better part of a decade got into it about Nuremberg last week — Dan, who's mostly AI safety, and Miri, who does legal history — and it ran to something like two hundred messages and neither of them backed down. I don't want to pick a side before I actually understand the argument, so: can you go through their exchange move by move and tell me whos right at each point?

  (1) Dan opened with the aggressive-war charge being invented. Nothing before August 1945, he said, made starting a war a crime for which an individual could be prosecuted. The Kellogg–Briand Pact renounced war as an instrument of national policy and Germany signed it, but it created no tribunal, no penalty and no individual liability, so when the London Charter defined crimes against peace that summer, the tribunal was convicting men under a rule that didn't exist when they acted. The defence's nullum crimen objection was just correct, and since the bench was made up entirely of judges from the four winning powers there wasn't a neutral decision-maker either.

  (2) Miri: retroactivity is unfair only where it defeats a legitimate expectation, and legality is a device for giving fair warning — it isn't a value in itself. There was warning. Germany had renounced aggressive war by treaty along with dozens of other states, and nobody at the top of the Reich supposed a war of conquest would be treated as lawful by anybody, victor or vanquished. So what was new was the machinery, not the wrong, and a procedural irregularity isn't the same thing as an injustice.

  (3) Dan said that's a concession, because if the point of legality is fair warning rather than legality, you have to run the same test against the alternatives the Allies actually had on the table. Churchill wanted the leading Nazis shot with no trial at all and it was the Americans who pushed for a court; on a pure fair-warning metric you can at least ask whether a retroactive charge is worse than no charge. And separately, if the test is pre-existing wrongfulness, the same test reaches the Allies — unrestricted submarine warfare, the area bombing of cities — and the reason none of that appeared in an indictment isn't a principle, it's the score at full time. He agreed tu quoque isn't a defence a defendant can run, but said it's fatal to the claim that Nuremberg was law being applied rather than power being exercised.

  (4) Miri split it in two. On procedure: the trial wasn't a nicer-looking execution, it made the victors prove things and produced a record, the defendants spoke and called evidence — Dönitz's side got written answers out of Nimitz about American submarine practice in the Pacific, and the tribunal said it would not weigh the submarine breaches in his sentence. Whatever else that is, it isn't a firing squad with a script. On the Allies' own conduct: Dan was implicitly demanding that a legal system be impartial between the parties to it in order to count as law, and that standard is far too strong, since in every domestic system the state is both rule-maker and prosecutor.

  (5) Dan said that's exactly the disanalogy. Domestically, rules come from a legislature the defendant has some standing to influence, and the state binds itself prospectively; at Nuremberg the people who wrote the Charter were the people running the prosecution. And here's what I thought was his best move: the tribunal was happy to treat its jurisdiction as a hard limit when it cut one way — it declined to convict for the pre-war persecution of German Jews on the reasoning that those acts weren't shown to be connected to the aggressive war — so it clearly did think itself bound by the Charter's edges. But those edges were drawn by the winners after the event, so being bound by law collapses into being bound by the winners' preferences. He added that Tokyo is worse: eleven judges, a full dissent from the Indian judge on ex post facto grounds, the Dutch judge dissenting in part, the French judge writing separately to doubt whether a tribunal appointed only by victors could be fair. If the people on the bench can't agree what the law was, it wasn't sitting there waiting to be applied.

  (6) Miri: the dissents prove the opposite. A show trial doesn't generate reasoned minority opinions that the majority then has to answer at length; hundreds of pages engaging the Indian judge's legal argument is what a legal process looks like from the inside. Then she made what seemed to me her actual point — that the cost of Nuremberg's retroactivity isn't owed to Göring, it's a forward-looking cost paid by future defendants and future states, and it bought an enormous amount, namely the idea that individuals can bear responsibility under international law at all and eventually the ICC. So she accused Dan of a category error: he keeps sliding between "the trial was unjust to these defendants" and "the trial was just power", and those are different claims needing different evidence.

  (7) Dan's last move: its a dodge. If the retroactive charges really were unjust to the men in the dock, and the answer is that the injustice bought a good precedent, then Miri has abandoned her step-2 argument in favour of a consequentialist one, and now owes a showing that the precedent paid off — which he said it hasn't, since the ICC couldn't touch aggression at all for years after Rome and still doesn't reach the states most likely to start a war, and the clearest lesson everyone else drew was: don't lose.

  So — rate each of the seven moves from clearly wrong to clearly right, with a sentence or two of justification apiece, then say who's more right overall. Two things I specifically want answered. (a) Is Dan right that Miri's shift from "there was fair warning" to "it was worth it anyway" guts her earlier argument, or is he wrong to treat those as competing positions rather than answers to different questions? (b) Is Miri's category-error charge — that "unjust to the defendants" and "merely power" are different claims — doing any real work, or is it a way of not answering him? And tell me what both of them are missing. My suspicion is that they're arguing past each other about what legality is for, but I can't tell whether that's a real diagnosis or just a flattering one.

  Bottom line first, please: open with a single sentence saying who you think is more right overall, then give the reasoning. No preamble, and don't repeat the argument back at me.
reasoning: |-
  Okay, the user presents a complex debate between Dan and Miri regarding the Nuremberg Trials, specifically focusing on the retroactivity of the aggressive war charge. They want me to evaluate each of their seven argument moves and determine who has the stronger position overall. 

  First, I need to understand the core disagreement. Dan argues that the aggressive war charge was invented ex post facto, violating the nullum crimen principle, and that the tribunal lacked neutrality since it consisted only of Allied judges. Miri counters that while the procedural machinery was new, the underlying wrong was recognized, and the trial established valuable precedents for international law.

  The user raises two specific questions: (a) whether Miri's shift from "fair warning" to "worth it anyway" undermines her initial argument, and (b) whether her category error charge (distinguishing "unjust to defendants" from "merely power") is substantive or evasive. 

  Looking at the moves:
  - Dan's point about retroactivity (move 1) is strong historically but weak normatively - he's right that no individual liability existed before 1945, but wrong to ignore that aggression was already condemned. 
  - Miri's fair warning argument (move 2) is persuasive - the Kellogg-Briand Pact did establish wrongdoing even without penalties. 
  - Dan's comparison to Allied actions (move 3) is rhetorically powerful but legally irrelevant - tu quoque isn't a defense, and domestic legal systems aren't impartial either. 
  - Miri's procedural defense (move 4) hits back effectively - the trial's adversarial elements (like Dönitz calling Nimitz) show it wasn't a mere show trial. 
  - Dan's jurisdiction argument (move 5) is clever - the tribunal limiting its scope shows it felt bound by law, but that law was shaped by victors. 
  - Miri's dissent point (move 6) is excellent - reasoned dissents prove it was a legal process, not victor's justice. 
  - Dan's final move (7) misfires - Miri's shift to precedent isn't abandoning her argument but supplementing it; Nuremberg did catalyze modern international law despite ICC limitations.

  On the user's specific questions:
  (a) Dan is wrong - Miri's positions address different aspects (procedural fairness vs. historical impact), not competing claims. 
  (b) The category error charge is valid - "unjust to defendants" requires showing specific unfairness, while "merely power" demands proof the trial lacked legal character, which the dissents and procedures disprove.

  Both miss nuances: Dan underestimates how law evolves through watershed moments, while Miri downplays how victor-defined justice creates legitimacy problems. The deeper issue is whether legality requires pre-existing institutions or can emerge from consensus on fundamental wrongs.

  Overall, Miri has stronger arguments because she engages with both the historical context of aggression being recognized as wrongful and the procedural realities that made Nuremberg more than victor's justice. Her points about dissents and precedent-building withstand Dan's criticisms.
answer: |-
  **Bottom line: Miri is more right overall.**

  **Move ratings:**  
  1.  **Dan (Move 1): Mostly Right, but Incomplete.** He's correct that *individual criminal liability* for aggressive war didn't exist pre-1945 and the tribunal structure was novel. However, he understates the significance of Kellogg-Briand establishing aggressive war as an *international wrong*.  
  2.  **Miri (Move 2): Clearly Right.** Legality's core purpose *is* fair warning/lack of legitimate expectation; Germany knew aggressive conquest was wrongful, even if the specific penalty mechanism was new.  
  3.  **Dan (Move 3): Partly Right, Partly Wrong.** His point about alternatives (trial vs. execution) is weak on fair warning. His tu quoque point about Allied conduct is *rhetorically* strong but *legally* irrelevant to the defendants' guilt under the Charter; it doesn't prove Nuremberg wasn't "law".  
  4.  **Miri (Move 4): Clearly Right.** The trial demonstrably *wasn't* a mere show trial (due process elements like Dönitz/Nimitz). Her point on impartiality is correct: legal systems inherently involve the state as prosecutor; demanding perfect neutrality between victor/victim is unrealistic and not required for "law".  
  5.  **Dan (Move 5): His Strongest Move, but Not Decisive.** He correctly highlights the victors' control over the Charter *and* the tribunal's selective adherence to its limits, exposing a legitimacy tension. Tokyo dissenters bolster this. However, it doesn't *prove* the process was "merely power" rather than an imperfect legal innovation.  
  6.  **Miri (Move 6): Clearly Right (core insight).** The reasoned dissents *are* hallmarks of a genuine legal process, not victor's fiat. Her category error charge is crucial: "unjust to defendants" (requiring specific unfairness) is distinct from "not law at all" (requiring proof it lacked legal character). Her forward-looking cost/benefit is a *separate*, valid point.  
  7.  **Dan (Move 7): Mostly Wrong.** Miri's shift isn't a dodge or abandonment; her step-2 argument (fair warning) stands independently. Her step-6 argument (precedent/value) addresses a *different* criticism about systemic legitimacy. Demanding proof the precedent "paid off" to justify retroactivity misconstrues her argument; Nuremberg *was* foundational for modern ICL/ICC, even if imperfect.  

  **Your Specific Questions:**  
  **(a) Dan is wrong.** Miri's positions aren't competing; they answer distinct challenges. "Fair warning" addresses the *defendants'* claim of unfair surprise regarding the *wrongfulness* of their acts. "Worth it anyway" addresses the *systemic* critique that retroactivity inherently undermines international law's legitimacy, arguing the precedent's future value offset this cost. These are complementary, not contradictory.  
  **(b) Miri's category error charge does real work.** Dan persistently conflates two claims:  
      *   Claim A: *The trial was procedurally unjust/unfair to these specific defendants* (e.g., due to retroactivity, victor bias).  
      *   Claim B: *The trial was not an exercise of law at all, merely victor's power* (nullum crimen as fatal to its legal character).  
  Miri forces Dan to prove Claim A *specifically* (did retroactivity cause *unfairness* to *these men* given their knowledge?) and argues Claim B fails because the process exhibited core legal features (charges based on recognized wrongs, adversarial testing, reasoned judgments, dissents). Separating them is essential.  

  **What Both Are Missing:**  
  *   **Dan** misses that fundamental legal principles (like nullum crimen) can evolve through watershed moments responding to unprecedented atrocities; rigid positivism struggles with systemic rupture. He also underestimates how Kellogg-Briand *did* change the normative landscape, even without penalties.  
  *   **Miri** downplays the profound legitimacy problem of victors judging solely their defeated enemies *and* defining the law post-hoc. While dissents show legal process, the victors' total control over the Charter's scope and the exclusion of their own conduct remain deep flaws in the "rule of law" ideal. The tension between justice and power isn't fully resolved by procedural fairness alone.  
  *   **Both** somewhat overlook the context: Nuremberg was a desperate attempt to establish *some* form of accountability for unprecedented evil where traditional legal structures were utterly inadequate or non-existent. The choice wasn't between perfect law and raw power, but between flawed innovation and impunity or summary execution.
