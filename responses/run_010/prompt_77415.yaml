answer: |-
  Right then, let's dissect your teletransporter case. You've done the work, settled every last thing – kudos. On my view? Precisely *nothing* of *prudential concern* survives that transport. The copy waking up? That’s a new entity, a new locus of commitments. Your *specific* prudential reason to care about *your* future – the 'owing it to yourself' – evaporates because there’s no longer an 'it' owed *by you*. Your indifference *is* rational! What you might feel looking at that copy – relief, curiosity, perhaps a detached appreciation of its continued experiences – stems from other values: aesthetic pleasure, general empathy, perhaps a continued interest in the world's state. But the *selfish* stake, the 'for-my-own-sake' reason to dread annihilation or desire continuation? That vanishes with the discharge of your debts. The machine didn't preserve *you* in any sense that matters *to you prudentially*; it merely spawned a successor who happens to share your memories and perhaps some dispositions. The absurdity you feel is the phantom limb of identity-based thinking.

  Now, the newborn. You've hit a nerve, but not a fatal one. Firstly, concede: yes, the neonate *has* no unmet commitments. She *is* a blank slate in that regard. So, in the strictest sense of my thesis, there *is* no prudential stake *for her* in surviving infancy, because there's nothing yet *owed* by her future self *to* her present self. But hold fast! The 'stake' we instinctively feel isn't in some abstract survival of identity; it's in the *potential* for commitment. She *is* a nascent commitment-carrier, a vessel for future promises, debts, and projects *that will arise*. Our intense prudential concern (as parents, society) isn't for some bare identity persisting; it's to protect and nurture the *capacity* for her *to form and discharge commitments of her own*. We safeguard the *potential debtor*. The 'stake' isn't in the survival of existing commitments, but in enabling the *future creation and inheritance* of commitments *by that very being*. Her survival matters *because* it allows the complex web of owing that constitutes a full life to *begin*. Identity is still the herring; the potential to owe and be owed is the real fish.

  Where does that leave us? You think the indifference is absurd, I think it's logically pristine. The infant lacks current commitments but embodies future commitment-potential. Your move?
