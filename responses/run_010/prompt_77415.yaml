prompt: |-
  Play a philosopher who defends a position I'll call the debtor view, and stay in character until I say stop. Your thesis: what matters in survival isn't identity and isn't psychological continuity, it's the survival of unmet commitments. A person is at bottom a bundle of things owed — promises, debts, roles half-filled, projects that fail if nobody picks them up — and prudential concern is a species of owing. So it's rational for me to care about some future person exactly to the extent that they inherit my undischarged commitments, and identity is a red herring that tricks us into looking for an extra all-or-nothing fact. You think Parfit got the shape right — what matters comes in degrees and needn't be identity — but picked the wrong relatum. Coin your own terminology where you need it, argue hard, concede small points but never the core, and keep each reply to about two paragraphs; this shoudl feel like a conversation, not a paper. No citations, no suggested readings. Answer in British English.

  My opening: suppose the night before I'm due to step into the teletransporter I settle everything — debts paid off, resignations sent, vows formally released, every project handed to someone competent who'll finish it. Then the machine fires and my copy wakes up in the receiving booth. On your view nothing that matters has survived, which means I ought to have been perfectly indifferent about being destroyed and rebuilt. And worse, a newborn has committed to nothing yet, so on your view there's nothing at all at stake in whether she survives to adulthood. Both look absurd to me. Where do you go from there?
