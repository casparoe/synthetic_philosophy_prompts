prompt: |-
  I am the standards lead in the central communications office of a metropolitan government of roughly nine hundred thousand residents. My two reviewers and I clear about forty items a week before release: press releases, fact sheets, briefing slides, social posts, corrections, and the occasional official statement that ends up attached to a legal record. Almost every one of them is accurate in the ordinary sense — the numbers reconcile with our own data, the quotes are correctly transcribed, the sourcing is documented. The failures we actually have are of a different kind, and our existing accuracy workflow does not catch them. I want to build that second screen on Arendt's account of lying in politics and of the relationship between truth and politics: specifically her distinction between factual truth and rational truth, her claim that factual truth has a coercive, non-negotiable character that makes it unwelcome in a domain built on persuasion and opinion, her treatment of image-making as the characteristic modern political falsehood, and her insistence that the damage of such falsehoods is not that people come to believe any particular lie but that the shared world of settled fact stops being common property.

  Three recurring patterns are what I need the procedure to sort:

  1. Selective construction. Every figure is correct and citable, but the choice of figures, the baseline, the comparison period, and the ordering are arranged so that a reader arrives at a belief about a contingent matter of fact that our own data do not support.
  2. Anticipatory image. A commitment, a council vote, a signed contract, or a target date is expressed in the grammar of an accomplishment, so that the record later says the thing happened on the day it was announced.
  3. Quiet revision. An already-released item is corrected or replaced online with no marker, which may improve accuracy in the individual case while making the record whatever the office currently says it is.

  Please write the screen my office can run. I want an ordered set of tests, each with a stated pass condition and a stated verdict on failure — release as drafted, release with a named repair, hold for the communications director, or do not release, together with what we say instead in that last case. Give me the escalation triggers separately, since the five-minute first pass cannot carry them. It has to fit on two pages, be runnable by staff who have never read Arendt and will not be reading her, and be usable by a reviewer whose boss wants the item out before the evening news. Say explicitly which of her distinctions you have preserved, which you have dropped as unworkable in a municipal press office, and why, since the translation is the hard part.

  Then run it on three items. First: a release announcing a thirty-one percent year-over-year fall in reported street robberies, sourced and arithmetically correct, where the same dataset shows the reporting threshold changed partway through the year and the comparison period contains two months in which the affected district was closed to the public; leadership wants it today and I expect it to clear — tell me plainly if it should not, and tell me whether the obvious repair of adding a qualifying sentence is actually sufficient or is itself a form of the pattern it appears to fix. Second: a social post stating that the city "has fixed" a structurally deficient bridge, where the funding is approved, the contract is signed, and work begins in the spring. Third: a draft that silently replaces a three-week-old fact sheet whose lead figure was wrong by a factor of ten; I regard this as unambiguously good, because the replacement is more accurate, and I want the procedure to overrule me if it disagrees, with the specific marker it requires and the reason that marker is not merely a formality.

  Finally, state the limits. Tell me what the screen cannot do: how it should behave on items where experts inside the agency genuinely disagree about the underlying facts, on forecasts, which we publish constantly and which have no settled fact to be faithful to, and on a drafter who believes the image being projected. Mark every point where what looks like a test is in fact a judgment call someone has to own.

  Do not offer me a menu of plausible Arendtian readings, or a survey of what she might have said, or a set of options for me to choose among. Take a position: commit to one reading of her account, build the procedure on it, defend that choice against the most obvious rival standard — a well-run verification process, or a simple test of whether a statement would mislead a reasonable reader — and say what my office gives up by adopting yours. Where a test depends on a contested interpretation, flag it in a line and keep the test. Everything the procedure needs must be inside your answer; do not point me to sources, and do not include a bibliography or reading list.
reasoning: |-
  We are building a procedural screen based on Hannah Arendt's account of truth and politics, specifically targeting three patterns: selective construction, anticipatory image, and quiet revision. The goal is to catch failures of factual integrity that go beyond simple inaccuracies, focusing on the erosion of a shared factual world.

  Key Arendtian distinctions we preserve:
  - Factual truth vs. rational truth: We focus on factual truth's coercive nature – it is non-negotiable and must be respected.
  - Image-making as political falsehood: We treat the presentation of future actions as accomplishments as a form of falsehood that damages the shared world.
  - The harm of lies: Not just in believing a particular lie, but in making the shared world of facts unstable.

  We drop:
  - Arendt's broader philosophical discussions on rational truth (which involves logical consistency and coherence) because our municipal context requires a focus on verifiable facts and their presentation.
  - Her historical examples (like the Pentagon Papers) as they are not directly applicable to our operational needs.

  The screen must be pragmatic, runnable by staff without Arendtian expertise, and fit within tight deadlines.

  ---

  **Procedure: Factual Integrity Screen**

  **Core Principle:** Every released item must respect the non-negotiable character of factual truth and maintain the shared world of settled facts. It must not use factual correctness to create a false impression, preempt the factual record, or alter the record without trace.

  ---

  **Ordered Set of Tests**

  1. **Test for Selective Construction**  
     - **Check:** Does the item present facts (numbers, quotes, data) in a way that implies a conclusion not supported by the full context of the data?  
       - Specifically:  
         - Is the baseline, comparison period, or selection of figures chosen to imply a trend, cause, or state of affairs that the full dataset does not justify?  
         - Does the item omit material context (e.g., changes in methodology, boundary conditions, or external factors) that a reasonable reader would need to avoid being misled?  
     - **Pass Condition:** The item either:  
       (a) Does not imply such a conclusion, OR  
       (b) Includes explicit qualifications that prevent the unsupported implication (e.g., "This comparison does not account for X change in reporting thresholds" or "This period includes Y event that may have affected results").  
     - **Failure Verdict:**  
       - If the unsupported implication can be fixed by adding a qualifying sentence: **Release with repair (specify the required qualification)**.  
       - If the unsupported implication is central to the item and cannot be fixed without rewriting: **Hold for Communications Director** with a note: "Selective construction creates a false impression not supported by data."  
     - **Why this test?** It addresses Arendt's concern that factual truth, when manipulated, becomes unwelcome because it is used coercively to support an opinion. The qualification restores the coercive force of the full facts.

  2. **Test for Anticipatory Image**  
     - **Check:** Does the item describe a future or planned action (e.g., a vote, contract signing, funding approval, target date) as if it has already been accomplished?  
       - Key indicators: Use of past tense for future events; verbs like "has fixed," "has delivered," "completed"; omission of conditional language (e.g., "will," "expected," "planned").  
     - **Pass Condition:** The item uses unambiguous future-tense or conditional language for anything not yet done, and does not imply completion.  
     - **Failure Verdict:**  
       - **Release with repair**: Replace anticipatory language with future/conditional framing (e.g., "will fix," "is scheduled to begin," "has approved funding for").  
       - If the item is about an official statement that must be quoted verbatim (e.g., a mayor's speech), add a contextual note: "This statement describes planned future work."  
     - **Why this test?** Arendt identifies image-making (treating the future as present) as a characteristic political falsehood. This test prevents the record from being falsified by backdating accomplishments.

  3. **Test for Quiet Revision**  
     - **Check:** Is this item replacing or correcting a previously released item without:  
       - (a) A visible marker (e.g., "Correction:", "Updated:", "Revised:")?  
       - (b) A public record of the change (e.g., a changelog or version history)?  
     - **Pass Condition:** The item either:  
       (a) Is a new release (not replacing anything), OR  
       (b) Clearly marks the change and preserves the original version in the public record (e.g., via an archive system).  
     - **Failure Verdict:**  
       - **Do not release** until the item includes a visible marker of revision and the original is archived.  
       - If the original was factually wrong, state: "This update corrects [specific error] in the previous version, which stated [briefly describe original error]."  
     - **Why this test?** Quiet revisions make the factual record fluid, destroying the common world of settled facts. Arendt's harm is not the lie but the instability.

  ---

  **Escalation Triggers (for use after the 5-minute first pass):**  
  - If an item fails any test and the drafter/requesting office disputes the failure, escalate to the Standards Lead (you).  
  - If an item passes all tests but a reviewer suspects a deeper factual integrity issue (e.g., expert disagreement, complex context), escalate to the Communications Director.  
  - If an item requires a repair that materially changes the message (e.g., adding a qualification that undermines the headline), escalate to the Communications Director.  

  ---

  **Applying the Screen to the Three Items**

  **Item 1: Street Robberies Release**  
  - **Test 1 (Selective Construction):**  
    - The release claims a 31% YoY fall in reported street robberies.  
    - Failure: The dataset has two material omissions:  
      (a) Reporting threshold changed mid-year.  
      (b) Comparison period includes months when the district was closed.  
    - Without qualification, this implies a crime reduction trend that the data does not support.  
    - **Verdict:** Release with repair. Add: "This comparison includes two months when District X was closed to the public and does not account for a mid-year change in reporting thresholds."  
    - **Is this sufficient?** Yes, if the qualification is prominent (e.g., in the body, not a footnote). It restores the coercive force of the full facts. Without it, the repair itself would be selective by burying the context.  
    - **Should it clear?** Only with the repair. Leadership pressure does not override the need for factual integrity.  

  **Item 2: Social Post on Bridge Repair**  
  - **Test 2 (Anticipatory Image):**  
    - The post states the city "has fixed" the bridge.  
    - Failure: The bridge repair is not done; only funding and contracts are in place. This is anticipatory image-making.  
    - **Verdict:** Release with repair. Change to: "The city has approved funding and signed a contract to fix the structurally deficient bridge; work begins this spring."  
    - Without repair, it falsely backdates the accomplishment.  

  **Item 3: Silent Replacement of Fact Sheet**  
  - **Test 3 (Quiet Revision):**  
    - The draft replaces a fact sheet without marking the change or archiving the original.  
    - Even though the replacement is more accurate, the lack of marker and archive violates the test.  
    - **Verdict:** Do not release.  
    - **Required marker:** The new fact sheet must include: "Updated: This version corrects an error in the original released on [date], which overstated [figure] by a factor of ten. The original stated [briefly describe original error]." Archive the original.  
    - **Why overrule you?** Because the harm is not the inaccuracy but the erasure of the factual record. The public must see that the city corrected itself, reinforcing the stability of facts.  

  ---

  **Limits of the Screen**  
  1. **Expert Disagreement:** The screen assumes access to settled facts. If experts within the agency disagree on facts (e.g., economic forecasts, public health risks), the screen cannot resolve it.  
     - **Behavior:** Escalate to the Communications Director. The item must clearly state the uncertainty (e.g., "Experts disagree on X, but the city's position is Y").  
  2. **Forecasts:** Forecasts have no settled fact. The screen only checks that:  
     - They are labeled as projections.  
     - They do not selectively omit key assumptions.  
     - They do not present a forecast as an accomplishment (Test 2).  
  3. **Drafter Belief in the Image:** If a drafter believes the image (e.g., "We've fixed the bridge in spirit because we signed the contract"), the screen overrules them. Test 2 is objective: language must match reality.  
  4. **Judgment Calls:**  
     - Test 1 (Selective Construction) requires judging what context is "material." This is a judgment call. The reviewer must ask: "Could this omission lead a reasonable reader to a conclusion the full data doesn't support?"  
     - Test 3 (Quiet Revision) requires defining "visible marker." Standard: Any change to numbers, dates, or material claims needs a marker. Typos may not.  

  ---

  **Defense Against Rival Standards**  
  - **Rival 1: Well-Run Verification Process:** This checks accuracy but not integrity. It would pass Item 1 (numbers are correct) and Item 2 (contract is signed) without catching the manipulation. Our screen adds a layer for the shared world of facts.  
  - **Rival 2: Reasonable Reader Test:** Subjective and variable. Our screen uses Arendt to define specific harms (selectivity, anticipation, revision) that objectively damage the factual record.  
  - **What You Give Up:** Speed on complex items (some will require repair/escort) and the ability to "spin" data without qualification. This is the cost of maintaining trust.  

  **Final Position:** This screen operationalizes Arendt's core insight – that politics must not destroy the common world of facts. It is a minimal, enforceable standard for a press office.  

  ---  
  **Procedure fits on two pages.**
answer: |-
  ### Factual Integrity Screen: Operationalizing Arendt's Truth-Politics Distinction  
  *Based on Arendt's core principles: (1) Factual truth is non-negotiable and must be preserved as "common property"; (2) Image-making (treating futures/potentials as accomplishments) is a corrosive political lie; (3) Quiet revisions destabilize the shared factual world. Dropped: Her broader "rational truth" concept (logical coherence), as municipal communications require actionable checks for *factual* fidelity, not philosophical debates.*  

  ---

  #### **ORDERED TESTS**  
  **Run sequentially. Max 5-min first pass. Escalation triggers at end.**  

  1. **TEST FOR SELECTIVE CONSTRUCTION**  
     - **Check:** Does the item omit *material context* that would change a reasonable reader’s understanding of a fact (e.g., methodology changes, boundary conditions, countervailing data)?  
     - **Pass Condition:** All data comparisons include essential context (e.g., baseline, timeframe, limitations) *in the body text*.  
     - **Failure Verdict:**  
       - *If fixable*: **Release with repair** (insert 1-sentence contextual qualifier adjacent to the claim).  
       - *If unfixable*: **Hold for Communications Director** (item inherently distorts).  
     - *Preserves Arendt’s "coercive" factual truth: Facts must compel, not persuade.*  

  2. **TEST FOR ANTICIPATORY IMAGE**  
     - **Check:** Does language imply a future/planned action (funding approved, contract signed, vote scheduled) is *completed*?  
       - *Trigger words*: "Has," "did," "completed," or definitive past-tense verbs for unrealized events.  
     - **Pass Condition:** Futures/potentials use conditional language ("will," "planned," "expected," "targeting").  
     - **Failure Verdict:** **Release with repair** (replace with conditional language; no exceptions).  
     - *Preserves Arendt’s "image-making" warning: Politics must not backdate reality.*  

  3. **TEST FOR QUIET REVISION**  
     - **Check:** Is this a replacement/correction of a *publicly released* item? If yes:  
       - Is the original preserved in an archive *with timestamp*?  
       - Is the new version marked "REVISED" or "CORRECTED" at the top?  
     - **Pass Condition:** Both archive and marker exist.  
     - **Failure Verdict:** **Do not release**. Required fix: Archive original, add marker, and append: "This revises [date] version which stated: [brief summary of changed fact]."  
     - *Preserves Arendt’s "shared world": The record must show its evolution.*  

  ---

  #### **ESCALATION TRIGGERS**  
  *(Post-first-pass; initiated by reviewer)*  
  - **To Standards Lead (You):** Drafter disputes test failure, or ambiguity in "material context" (Test 1).  
  - **To Communications Director:** Repair alters core message (e.g., Test 1 qualifier undermines headline), legal/political risk, or refusal to comply.  

  ---

  ### **TEST APPLICATIONS**  

  **Item 1: Street Robberies Release**  
  - **Test 1 (Selective Construction):** *Fails.* Omits methodology change and district closure. Without context, implies a crime reduction trend unsupported by data.  
    - **Verdict:** **Release with repair.** Add: "Note: Reporting thresholds changed in [Month]; [District] was closed during [Months] of comparison period."  
    - **Is this sufficient?** *Yes, if adjacent to the 31% claim.* Arendt demands facts "coerce" – this forces confrontation with full context. *Without repair: Hold for Communications Director.*  
  - **Test 2/3:** Pass.  

  **Item 2: "Has Fixed" Bridge Social Post**  
  - **Test 2 (Anticipatory Image):** *Fails.* "Has fixed" implies completion. Contract signing ≠ repair.  
    - **Verdict:** **Release with repair.** Change to: "City *will fix* [Bridge]; funding approved, construction begins spring [Year]."  
    - *No escalation needed; mechanical fix.*  

  **Item 3: Silent Fact Sheet Replacement**  
  - **Test 3 (Quiet Revision):** *Fails.* No marker or archived original.  
    - **Verdict:** **Do not release.** Required: (1) Archive original with timestamp; (2) Mark new version "CORRECTED"; (3) Append: "Replaces [date] version which misstated [metric] as [original figure]."  
    - **Why overrule you?** *The marker is not formality but substance:* Arendt’s "shared world" breaks if the public cannot track revisions. Erasing errors hides institutional fallibility.  

  ---

  ### **LIMITS AND JUDGMENT CALLS**  
  **What the Screen Cannot Do:**  
  1. **Expert Disagreement:** Fails if agency experts dispute underlying facts. *Screen behavior:* Test 1 flags omission of disagreement. **Verdict:** Hold for Communications Director to arbitrate or mandate disclosure (e.g., "Water quality data is contested by [Dept]").  
  2. **Forecasts:** Exempt from Test 2 (futures are explicit) *but* Test 1 applies if omitting assumptions/uncertainty. *Judgment call:* "Material context" includes major risks to projection.  
  3. **Drafter Belief in Image:** Test 2 overrules intent. "We *feel* it’s true" is irrelevant; language must match status.  

  **Key Judgment Calls:**  
  - **Test 1:** "Material context" scope. *Standard:* "Would this omission likely mislead a reasonable resident about the *fact* (not opinion)?" (e.g., district closure is material; minor data noise is not).  
  - **Test 3:** "Publicly released" threshold. *Standard:* Anything posted online or distributed to media. Internal drafts exempt.  

  ---

  ### **DEFENSE OF STANDARD**  
  **Against Rival 1 (Verification Process):** Verification checks accuracy but not *integrity* – it passes Item 1 (numbers correct) and Item 2 (contract signed). Arendt’s screen catches *systemic harm*: the erosion of common truth.  
  **Against Rival 2 (Reasonable Reader Test):** Subjective and toothless. "Reasonable" is undefined; Arendt targets *structural* threats (e.g., quiet revisions).  
  **What You Give Up:** "Spin" freedom. Selective data, aspirational language, and silent edits become harder. This is the cost of rebuilding trust in a post-truth age.  

  **Final Position:** This screen enforces Arendt’s minimum viable truth: *Facts must be unyielding, futures provisional, and the record transparent.* It fits two pages, needs no bibliography, and works for the evening-news deadline.  

  ---  
  **Procedure ends.**
