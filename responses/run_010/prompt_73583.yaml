prompt: |-
  For five years I have sat as a panel member hearing appeals against sanctions imposed on claimants of a means-tested unemployment benefit with an activity test. I have kept a record of my votes, and I now want to know what principle they add up to, whether that principle is defensible, and which of my verdicts I should surrender. What follows is my own summary rather than a transcript; the sums and hours are illustrative, but the patterns are ones I recognise.

  1. A claimant declines a warehouse job because the required shift pattern would cost more in childcare than the job pays. Sanction wrong.
  2. A claimant with the same earnings profile declines a job identical in pay, hours and content to one they held for eight years and left voluntarily on good terms; the stated reason is that the work would be beneath them. Sanction right.
  3. A claimant declines a job assembling components for a weapons system they regard as immoral; the objection is sincere, long-standing, and would apply to any employer. Sanction wrong. Yet I would sanction a claimant who declines work at a betting shop or a payday lender on the same sort of stated ground. I cannot say why these two feel different to me.
  4. A claimant fails to declare cash earnings of about £80 a week from babysitting for a neighbour, over four months. Fraud; sanction right; the overpayment recoverable. But I hold this less blameworthy than case 5.
  5. A claimant makes a false statement about savings on the initial claim form, declaring £9,000 where the figure was £23,000. I hold this worse than case 4, though the sums are comparable and case 4 involved repeated concealment while case 5 involved a single utterance. I concede the ordering looks arbitrary.
  6. A claimant volunteers three days a week at a hospice for six months and turns down two interviews in that period. Sanction wrong: the activity requirement should be treated as met.
  7. A claimant spends comparable hours over a comparable period writing a novel and turns down the same two interviews; nobody outside the household can attest to the hours. Sanction right. What troubles me is that I would give the same answer even if I were persuaded the novel was excellent and the hours exactly as described.
  8. A claimant with a fluctuating and largely invisible condition fails a points-based capability assessment calibrated for stable impairments, and is sanctioned for non-attendance. Sanction wrong; and yet I also think a properly designed assessment would find them capable of some work and would then sanction them for refusing it. I am not sure both beliefs can stand.
  9. I think it legitimate to require a specified number of hours of unpaid work placement, and not legitimate to require thirty-five documented job applications a week, even though the second requirement is cheaper to administer and far easier to verify.
  10. A claimant with thirty years of contributions and one with none should, I think, receive different amounts for different durations; but I do not think that difference should affect the strictness of the activity test.
  11. An in-work claimant on a zero-hours contract turns down offered additional shifts because accepting them would forfeit their childcare place. Sanction wrong. I also think it objectionable that public funds top up wages of that kind, since the top-up lets employers pay less than they otherwise would. In case 1 I excused a refusal precisely because the wage did not cover the childcare the job required, so something here has to give.

  My working hypothesis is that what I am really tracking is legibility: whether a claimant's activity leaves a trace a stranger could verify — a placement supervisor's signature, a payslip, an employer's letter. Cases 6 and 7, and the second half of case 4, point that way. Cases 3 and 9 point against it, since in case 3 sincerity rather than documentation seems decisive, and in case 9 the more legible requirement is the one I reject.

  What I would like from you:

  (a) State one or two candidate principles precisely enough to be applied by someone who has never met me, and tie each clause to the case or cases that motivate it. If legibility appears as a clause, say whether it does independent work or acts as a proxy for something else — evidence of sincerity, say, or a way of assigning the risk of self-deception.

  (b) Identify which of my verdicts no single principle can accommodate. Where the choice is between a complex principle that saves all of them and a simpler one that overturns one or two, say which you would take and what is lost by taking it. I would rather abandon a verdict I care about than end up with a rule that is really eleven rules wearing a trench coat.

  (c) Apply your preferred principle to four cases I have not listed: a claimant who refuses any work requiring them to labour on their sabbath, where the employer would accommodate but only at reduced hours; a claimant in a former single-industry town who declines a job ninety minutes away by public transport in a different occupation for which they are qualified; a claimant who accepts work at sixty per cent of prior earnings in the same occupation and leaves it voluntarily within four months; and a claimant sanctioned for missing a mandatory appointment because they were attending an interview they had arranged themselves and told nobody about.

  (d) Several of my verdicts appear to turn on the duration and severity of the sanction rather than on the requirement itself. State what your principle implies about how long a sanction should last and how much income it should remove, and whether duration can do normative work that the underlying requirement cannot.

  (e) Finally, tell me whether my principle genuinely dispenses with the distinction between the deserving and the undeserving poor, or merely re-encodes it under names such as reciprocity, contribution, and legibility. And tell me whether what I have reconstructed amounts to a version of the old less-eligibility idea — that the conditions of relief ought to be made less attractive than the worst independent wage labour available. If it does, point to the verdicts in which that idea is already doing the work.
reasoning: |-
  Hmm, this is a fascinating and complex ethical puzzle from someone with deep experience in welfare adjudication. The user has spent five years hearing appeals against sanctions for unemployment benefits and wants to systematically examine their own decision patterns. They've provided 11 detailed cases with their rulings, and now seek to extract coherent principles from what might feel like intuition-driven judgments.

  First I notice the user is remarkably self-aware about their cognitive dissonances - they explicitly flag where their rulings seem contradictory (cases 3 vs betting shop refusal, 4 vs 5, 6 vs 7). The "legibility" hypothesis they propose is sophisticated, recognizing how bureaucratic systems prioritize verifiable evidence over subjective realities. This isn't just about policy - it's about meta-cognition.

  The cases reveal several tension points: moral objections (weapons work vs gambling), verification challenges (hospice volunteering vs novel writing), temporal factors (one-time fraud vs ongoing concealment), and structural inequities (zero-hours contracts). Case 11 particularly interests me because it exposes how the user's rulings might inadvertently sustain exploitative labor practices - they protect claimants from impossible choices while criticizing the system that creates those choices.

  For part (a), I'm considering two principles that emerge strongly:
  1) The "Essential Costs" principle explains cases 1 and 11 - refusing work is justified when earnings don't cover unavoidable expenses like childcare. This isn't about preference but economic impossibility.
  2) The "Social Value Recognition" principle explains why volunteering at a hospice (case 6) is treated differently than writing a novel (case 7) - society has mechanisms to validate certain contributions.

  The user's struggle with moral objections (case 3) suggests we might need a "Conscientious Objection" clause, but their discomfort with similar refusals for betting shops shows this isn't just about sincerity. The weapons refusal feels more legitimate perhaps because it aligns with international humanitarian norms.

  For part (b), case 8 is the true outlier - the user recognizes the assessment is flawed but still believes sanctioning would be correct under better conditions. This exposes a deep tension between individualized justice and systemic constraints. I'd recommend sacrificing this verdict for coherence.

  The novel writing case (7) also resists easy categorization. If we accept the hospice exception because society validates it through supervision, then the lack of external validation for artistic work becomes decisive - but this privileges institutional recognition over intrinsic worth.

  When applying principles to new cases in part (c), the Sabbath accommodation refusal would likely be unsanctioned under the Essential Costs principle (reduced hours create economic harm), while refusing distant work seems sanctionable unless transport costs exceed wages. Voluntarily leaving suitable work would breach reciprocity, but we'd need to examine why they left.

  On sanction severity (part d), duration should reflect culpability and harm. Concealing £23k savings (case 5) demonstrates higher culpability than £80/week babysitting (case 4) because the former requires deliberate deception from day one. But we must ensure sanctions don't create destitution - perhaps cap reductions at 30% of benefits.

  Finally for part (e), the user's approach isn't less-eligibility (which intentionally makes benefits miserable) but rather reciprocity - expecting claimants to engage in verifiable, socially recognized activities. However, the legibility requirement does risk excluding valid but hard-to-document efforts, creating new forms of "undeserving" status. Cases 7 and 8 particularly reveal this tension.
answer: |-
  Based on your cases, I propose two core principles that capture most of your verdicts while exposing necessary tensions. The "legibility" insight is crucial but serves as a *proxy* for deeper values.

  **(a) Candidate Principles:**

  1.  **The Essential Costs and Barriers Principle (ECB):** *A claimant may refuse work or an activity requirement without sanction if compliance would impose net financial costs they cannot reasonably absorb (e.g., essential childcare exceeding wages) or would violate a deeply held, consistent, and non-instrumental conviction fundamental to their identity or moral integrity.*
      *   **Motivated by:** Case 1 (childcare cost), Case 3 (sincere moral objection to weapons), Case 11 (childcare cost for in-work claimant).
      *   **Legibility's Role:** Acts as a *proxy for sincerity and non-instrumentality*. Verifiable costs (like childcare receipts) make the barrier legible. For convictions, *consistent* application over time and across employers (Case 3) is the legible trace of sincerity, making it harder to fake. Case 3 (weapons) shows consistency; betting shops/payday lenders likely fail this consistency test for you (the objection might feel situational or less identity-defining).

  2.  **The Reciprocity and Social Value Principle (RSV):** *The activity test requires claimants to engage in activity that demonstrates reciprocal effort for societal support. This activity must be either: (a) paid work; or (b) unpaid activity producing clear, socially recognized value that is externally validated. The system may impose requirements that create verifiable evidence (legibility) of this effort and value.*
      *   **Motivated by:** Case 2 (refusing suitable work "beneath them" breaches reciprocity), Case 6 (hospice volunteering creates clear, validated social value), Case 7 (novel writing lacks external validation of social value/effort), Case 9 (work placement validates effort/value; mass applications don't demonstrate genuine value), Case 10 (activity test strictness is universal reciprocity).
      *   **Legibility's Role:** *Directly constitutive* of validating effort and social value. A stranger (system) must be able to verify the *fact* and *value* of the activity (supervisor signature, pay slip, employer letter). This distinguishes Case 6 (validated social value) from Case 7 (unverifiable private effort, even if valuable). Case 9 rejects the "more legible" requirement (applications) because it fails the *social value* component of reciprocity – it's bureaucratic compliance, not meaningful contribution.

  **(b) Inconsistent Verdicts and Trade-offs:**

  *   **Case 3 vs. Betting Shop/Payday Lender Refusal:** This tension *cannot* be fully resolved by ECB or RSV alone. ECB relies on the sincerity/consistency proxy (legibility of conviction). Your intuition likely stems from perceiving weapons work as violating a *fundamental, potentially universal* moral law (e.g., against killing), whereas objections to gambling/lending feel more like *personal distaste* or *social judgment*, less central to core identity/morality. **Trade-off:** Adopt ECB but explicitly limit the "conviction" clause to *fundamental, non-derogable moral principles* (e.g., directly causing harm vs. facilitating choices with harmful consequences). This *overturns* the betting shop verdict if the claimant demonstrates similar consistency. You lose the ability to sanction based on subjective judgments about the "worthiness" of the objection.
  *   **Case 5 (Worse than Case 4):** ECB/RSV don't directly explain this ordering. Case 4 (ongoing concealment) seems intuitively worse. **Trade-off:** This verdict is hard to defend systematically. Abandon it. The severity should relate to the *magnitude and duration of the overpayment/deception*, not the *form* (repeated small lies vs. one big lie). Focus on the *harm* (total overpayment) and *intent*. Case 5 might involve *greater initial intent* to defraud, but that's speculative. Simpler principle: Sanction severity for fraud scales with total overpayment and evidence of deliberate intent.
  *   **Case 8 (Flawed Assessment vs. Underlying Capability):** ECB/RSV conflict here. ECB says the sanction is wrong *because* the flawed assessment creates an illegitimate barrier. RSV suggests that if capable, refusal *would* breach reciprocity. **Trade-off:** ECB must win. The *actual requirement imposed* (attending the flawed assessment) was unreasonable *for this claimant*. You cannot sanction based on a hypothetical "properly designed" assessment finding capability. Stick to judging the fairness of the *actual requirement* faced. Abandon the belief that a hypothetical assessment *would* justify a sanction *now*. It creates incoherence.

  **Preferred Approach:** Simpler principles (ECB & RSV) sacrificing the Case 5 ordering and the hypothetical sanction belief in Case 8. For moral objections, refine ECB to focus on fundamental, consistent convictions. This avoids eleven trench-coated rules.

  **(c) Applying ECB & RSV to New Cases:**

  1.  **Sabbath Work Refusal (Reduced Hours):** **No Sanction (ECB).** Accommodation at reduced hours creates an *essential financial barrier* (insufficient income potentially triggering ECB itself elsewhere). The conviction (Sabbath observance) is typically fundamental, consistent, and non-instrumental. The employer's accommodation attempt doesn't remove the net financial harm.
  2.  **Declining Distant Job (Qualified, Different Occupation):** **Sanction Likely (RSV).** Distance/cost *might* be an ECB barrier *if* transport costs exceed wages or create net loss. Absent that, RSV applies. The claimant is qualified and the job is suitable. Refusal based on location/occupation change breaches reciprocity. The former single-industry context is unfortunate but doesn't inherently excuse refusal of suitable work elsewhere.
  3.  **Leaves 60% Earnings Job Voluntarily:** **Sanction Right (RSV).** Accepting suitable work meets reciprocity. Voluntarily leaving without a compelling ECB reason (e.g., harassment, unsafe conditions) or RSV reason (e.g., moving to validated training/social value activity) breaches the ongoing obligation of reciprocity inherent in receiving benefits. Prior earnings are not a lifetime entitlement guarantee.
  4.  **Misses Mandatory Appointment for Self-Arranged Interview:** **Sanction Wrong (RSV).** The *activity* of job-seeking (attending an interview) fulfills the core purpose of the activity test – finding work. Missing the mandatory appointment due to actively pursuing this core purpose demonstrates reciprocity and creates social value (potential employment). The failure to notify is administratively wrong but shouldn't negate the substantive compliance with the test's purpose. Legibility (proof of interview) could be requested retrospectively.

  **(d) Sanction Severity & Duration:**

  ECB and RSV imply sanction severity should primarily reflect **culpability and the gravity of the breach**:
  *   **Culpability:** Deliberate fraud (Case 5, Case 4) or refusal based on mere preference (Case 2) shows high culpability. Unavoidable barriers (Case 1, Case 11, Flawed Assessment Case 8) show low/no culpability. Good-faith mistakes/confusion fall in between.
  *   **Gravity of Breach:** Refusing suitable, available work (Case 2) is a fundamental breach of RSV. Fraud (Cases 4 & 5) undermines system integrity. Minor administrative failures (Case 4 new case, if proof provided) are less grave.
  *   **Duration:** Should be proportionate to culpability/gravity. A long sanction for a high-culpability breach (fraud) serves deterrence and upholds reciprocity. A long sanction for an ECB-justified refusal (Case 1) is punitive and counterproductive. **Duration *cannot* normatively salvage an illegitimate underlying requirement.** A short sanction for refusing immoral work (Case 3) is still wrong if ECB applies. Duration addresses *how much* penalty is fair for a breach; it doesn't make the *definition* of the breach fair if the requirement itself violated ECB or RSV.
  *   **Income Reduction:** Should never reduce support below a minimum essential level (safeguarding basic needs). The *proportion* removed can signal severity but shouldn't create destitution. Focus on duration for severity.

  **(e) Deserving/Undeserving & Less-Eligibility:**

  *   **Dispensing with Deserving/Undeserving?** Your principles **re-encode, not dispense with, the distinction.** ECB/RSV replaces "deserving" with "compliant with reciprocity despite barriers" and "undeserving" with "failing reciprocity without acceptable justification." "Legibility" is a tool to *operationalize* this judgment fairly and avoid purely subjective "worthiness" tests. Cases 2 (beneath them), 4/5 (fraud), and 7 (novel) implicitly mark claimants as less "deserving" due to failures of reciprocity or verification. Case 6 (hospice) marks them as "deserving" via validated contribution. The distinction remains, grounded in *behavior relative to the rules*, not inherent moral worth – but the behavioral bar is still a filter.
  *   **Less-Eligibility?** Your principle **is NOT primarily less-eligibility.** Less-eligibility dictates that benefit conditions must be *worse* than the worst job to deter claims and force labor. Your ECB principle *protects* claimants from being forced into jobs with net losses (Case 1, 11), directly contradicting less-eligibility. RSV focuses on positive contribution, not deterrence through harshness.
      *   **Where Less-Eligibility *Creeps In*:** It subtly influences **Case 7 (novel writing)**. The sanction stems partly from the belief that unvalidated private activity isn't "work" and shouldn't be a comfortable alternative to paid labor. **Case 9 (35 applications)** – rejecting it isn't about burden, but implicitly, requiring *real* effort (work placement) that *feels* more like arduous labor than form-filling aligns with making compliance "less eligible" than trivial bureaucracy. **The underlying anxiety in Case 7** – that benefits shouldn't support comfortable artistic pursuit over "real work" – resonates with less-eligibility concerns about making idleness attractive.

  **Conclusion:** Your rulings coalesce around **Reciprocity validated by Legibility (RSV)** and **Protection from Insurmountable Barriers (ECB)**. Legibility primarily serves as a proxy for sincerity (ECB convictions) and a mechanism to verify effort/social value (RSV). Sacrificing the Case 5 fraud comparison and the hypothetical sanction in Case 8 is necessary for coherence. While replacing overt "deservingness" with behavioral compliance, the distinction persists functionally. Less-eligibility isn't your driving force but subtly influences anxieties about validating non-traditional contributions (Case 7) and ensuring requirements feel sufficiently demanding (Case 9). Your principles offer a more humane and contribution-focused framework than pure less-eligibility, but remain rooted in enforcing reciprocal effort within a system constrained by the need for verifiable proof.
