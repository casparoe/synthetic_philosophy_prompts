   The [olicy A has absolutely convergent utility series: sum | utility of A | = for each group: 1/k^2 + 2/k^2 + 1/k^2 = 4/k^2, and sum_{k} 4/k^2 = 4 * π^2/6 = (2π^2)/3 < infinity.

