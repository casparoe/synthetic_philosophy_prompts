     discounted rule: strict prefers A.

   This is a disagreement.

   The agent making the choices is finite-lived and never sees the whole sequence. Does this change the verdict? 
     - For the undiscounted total rule, the decision maker would use the entire future and see that both have the same impact, so they are indifferent.
     - For the catch-up rule, they would only be able to say that after any finite time, the options are not comparable because the partial sum may be positive, negative, or zero, and they have not yet overtaken permanently. But since they never see the future, they might always be in a state of not knowing. This is not set dressing: it means that at no finite time can they declare a winner.
     - For the discounted rule, they would use the discounting and see that A is better.

   The feature doing the work is that the difference series has مجموع صفر and is absolutely convergent, and in fact, is structured to return to zero after each group, and within a group it has both positive and negative terms, with the negative term larger in magnitude and occurring at a somewhat later time, so that discounting ascribes more weight to the early positive term in each group.

   If we remove the grouping structure and make the series of differences to be just a convergent series to a positive number, then catch-up and undiscounted would agree. If we make it converge to 0 without oscillation, then catch-up might eventually become arbitrarily small and not change sign, so it might be that they are comparable and equal. The oscillation in signs is key.

   Best objection from someone who thinks the original claim is right:
     The only reason the catch-up rule does not rank them is because the utilities are not bounded away from zero in a way that allows a decision in finite time. However, in the infinite limit, the two policies are equally good. The catch-up rule's failure to rank is an artifact of its myopic nature, and it should be replaced with a rule that takes the limit, which is 0. The fact that the discounted rule prefers A is due to the discounting, which is a separate ethical choice. In a ethical system that values all times equally, A and B are equivalent. Therefore, there is no genuine conflict between the rules that are based on the total utility ( which requires the limit) and the catch-up rule is not a good rule for infinite ethics.

     In other words, the catch-up rule is not a finished aggregation rule for infinite ethics, and we should use the total utility as the only extension of finite ethics.

     Your example shows that catch-up rule might not work, but that doesn't mean that there is a conflict between total utility and discounting, because total utility says they are equal and discounting says A is better. But that conflict is due to the discounting, not because of the infinite horizon per se. In the absence of discounting, the catch-up rule should be abandoned in favor of the total utility.

     Therefore, the original claim that with absolutely convergent totals you are back to ordinary finite ethics (where the total utility is the guide) holds, and the catch-up rule is not part of ordinary finite ethics.

     So the counterexample only works if you insist on using the catch-up rule, which is not a standard part of finite ethics.

