prompt: |-
  Two months ago somebody handed me the solar-system wall at the science center where I do education programming. Big painted thing from the late nineties, nine planets, Pluto at the end looking a little apologetic. We're redoing it and I got volunteered for the copy. I assumed the hard part would be fitting it in sixty words. The hard part turned out to be that our board is now split down the middle and both halves have asked me something I can't answer.

  Our director says: put the official definition on the wall, that's what standards bodies are for, and a regional science center has no business running its own solar system. A board member, retired engineer, extremely confident, says the opposite — that the definition was decided by a show of hands and that presenting a vote to kids as though it were a discovery is precisely what teaches people to distrust science. I've come around to thinking neither of them is asking the right question, and that the question underneath is about whether sciences carve nature at its joints.

  Facts, so you don't have to trust my recall of the details:

  - In 2006 the International Astronomical Union's general assembly in Prague adopted a definition requiring that a planet orbit the Sun, be massive enough for self-gravity to pull it round, and have gravitationally cleared its orbital neighbourhood. Pluto fails the third.
  - The assembly also established a dwarf planet class and treated it as distinct from planets rather than a subset of them; a proposal to make dwarf planets a subcategory of planet was put to a vote and defeated.
  - The committee's draft, circulated days before the vote, had been roundness-only — any non-star, non-moon body orbiting a star — which would have made twelve planets including Ceres and Charon. One of the drafters said they'd picked gravity as the deciding criterion because nature decides. Then the floor rewrote it.
  - Only a few hundred members were in the room and the main definition reportedly passed without the tally even being recorded.
  - The New Horizons lead has argued ever since that roundness is the scientifically meaningful criterion and the clearing requirement is politics dressed as physics, and he got loud about it after the 2015 flyby found nitrogen ice plains and possible signs of a subsurface ocean.
  - An earlier committee had floated three flavors of definition: cultural (a planet if enough people say so), structural (round enough), dynamical (dominates its orbit).
  - Two things that broke my brain: the clearing criterion is location-dependent, so the identical rock is a planet here and not a planet if you park it out in the Oort cloud; and Mercury doesn't strictly satisfy the roundness criterion either, yet nobody proposes demoting it. Also the definition only covers our Sun, so exoplanets run on a separate mass-based working definition, meaning there are officially two kinds of planet.

  A friend of mine who did a philosophy of science degree says this is the cleanest real-world natural kinds case there is, and she gave me four accounts to think with, roughly as I understood them: (1) essences — a kind is natural when its members share an underlying microstructure that explains their surface properties, gold being atomic number 79 and all that; (2) clusters — a kind is natural when a bundle of properties reliably co-occurs because some underlying mechanism keeps holding them together, no single essence required, her stock example being species; (3) promiscuity — there are many equally real cross-cutting ways to divide the same domain and which one counts as natural depends on your interests, so there's no one privileged carving; (4) a fourth she described too fast for me, something about a kind being natural when membership is unified by an explanation you could in principle dig down to and the cluster is causally deep enough to be worth explaining — call it the explanatory-payoff account. Her own coinage, which I like: separate the question of whether there's a joint out there to carve from the question of who has jurisdiction to pick which carving we adopt, and her claim is that most of the Pluto fight was jurisdiction wearing a joints costume.

  So. Run the 2006 episode through those accounts one at a time and tell me what each one makes planet-hood out to be. Which account makes the IAU look like it was doing legitimate joint-carving, which makes it look like a committee installing a category, and which makes the whole argument confused because the two sides weren't even disagreeing about the same thing? Does the roundness-versus-orbital-dominance fight actually track a disagreement between accounts 1 and 2, or am I overreading? I'd also want you to test my own hunch, which is that planet might be a historical kind — a category held together by a shared formation history in the same disk rather than by a mechanism or an essence — and say whether that hunch is a fifth account or just account 2 with different wallpaper.

  Then turn it around, this is the part I actually care about: what does the episode do to the accounts? Does it confirm one, is it an anomaly for one, is it a case one of them was never designed to handle? Specifically — if promiscuity is right, the fight was idle, and yet not one person in that hall thought it was idle, including the ones arguing it was just a naming decision. Is that a problem for promiscuity, or a problem for my read on the room? And use the location-dependence point and the Mercury point, they feel like real leverage somewhere. Please be explicit where the accounts go silent — I would much rather you say an account has nothing to say about the vote count than watch you make it say something.

  No references or bibliography needed, I'm not writing a paper. But if you can, end with two sentences a wall label could honestly say that don't pick a side by pretending there isn't one.
reasoning: |-
  Okay, the user is working at a science center and has to update a solar system wall display. The challenge isn't just the word count; it's navigating a disagreement between the director and a board member about whether to strictly follow the IAU's definition of planets. The director wants to stick with the official definition, while the board member argues that the vote-based decision undermines trust in science. The user feels both are missing the deeper question about whether science carves nature at its joints—meaning, does the classification reflect real, natural categories?

  The user provides a lot of detailed facts about the 2006 IAU decision, including the shift from a roundness-based definition to one requiring orbital clearing, the vote process, and criticisms from scientists like the New Horizons lead. They also mention philosophical accounts of natural kinds from a friend: essentialism, cluster theory, promiscuity, and explanatory payoff. The user wants these applied to the planet debate to see how each account interprets the IAU's actions. They also have a hunch that planets might be a historical kind based on formation.

  Breaking down the user's requests: First, analyze the 2006 episode through each natural kind account. Determine which makes the IAU look legitimate, which makes it seem like arbitrary categorization, and if the disagreement between roundness and orbital dominance maps to essentialism vs. cluster theory. Then, evaluate whether the user's historical kind idea is a new account or just a variant of cluster theory.

  Next, flip it: how does this episode affect the accounts themselves? Does it challenge promiscuity, since the debate wasn't seen as idle? Also, use the location-dependence and Mercury points as leverage. Emphasize where accounts fall silent—don't force explanations where they don't fit.

  Finally, craft two neutral wall label sentences that don't take sides but honestly present the situation.

  Deep needs: The user is caught in an institutional conflict and needs a principled way to resolve it without alienating either side. They want to educate accurately without oversimplifying, fostering critical thinking about how science works. Their frustration with the "jurisdiction vs. joints" disguise suggests a desire to highlight the human aspects of scientific process—consensus, debate, revision—without undermining science's authority. They might also seek validation that their nuanced approach (questioning the framing) is the right one, especially since they've moved beyond the initial dichotomy.

  For the natural kinds analysis:
  - Essentialism (account 1): Would demand a single defining property like composition or mechanism. The IAU's dynamical definition (orbital clearing) might not fit, as it's location-dependent, so essentialism would see this as arbitrary. Roundness could be a surface property but not a deep essence.
  - Cluster theory (account 2): Allows multiple properties (roundness, orbit dominance, formation) to cluster. The IAU prioritized one cluster (dynamical) over another (structural), making it a valid but not exclusive choice. The user's formation-history hunch fits here as an alternative cluster.
  - Promiscuity (account 3): Says all classifications are interest-relative. The IAU chose based on usefulness (e.g., teaching), so the fight is unnecessary—both definitions are "real" for different purposes. But the heated debate contradicts this, showing humans care about singular authority.
  - Explanatory payoff (account 4): Values categories that lead to deeper understanding. Orbital clearing might offer predictive power (e.g., for system evolution), while roundness relates to geology. The vote could be seen as prioritizing dynamical explanations.

  The location-dependence and Mercury issues challenge essentialism and cluster theory by showing inconsistencies. Promiscuity handles them easily: different contexts, different definitions.

  For the historical kind hunch: It's a subset of cluster theory, emphasizing formation history as a unifying feature. Not a new account.

  For how the episode affects accounts:
  - Confirms promiscuity (interests drove the decision), but the intense debate is an anomaly because people ignored their own relativity.
  - Anomaly for essentialism (no essence found) and cluster theory (no consensus on which cluster).
  - Leverage points: Location-dependence highlights promiscuity; Mercury's imperfect roundness challenges all accounts but especially essentialism.

  Wall label ideas: Neutral, acknowledging debate while focusing on wonder. E.g., "The solar system's family portrait has sparked debate: is membership based on an object's size, orbit, or history? Scientists revise definitions as we learn more—Pluto's reclassification reminds us that science evolves." And "Our display reflects current IAU guidelines, but explore why some scientists disagree! What makes a planet? Your curiosity drives the next discovery."

  This addresses the user's need for educational integrity without taking sides, framing the debate as part of science's vitality.
answer: |-
  Here's how the 2006 IAU episode plays out under each natural kinds account, followed by the impact *on* the accounts, and ending with your wall labels.

  ### Running the 2006 Episode Through the Accounts
  1.  **Essentialism (Shared Microstructure):**
      *   **Planethood is:** An intrinsic property, like a specific composition or internal mechanism (e.g., hydrostatic equilibrium *as* the essential state). The identical rock being a planet in one orbit but not another is a fatal flaw here – the "essence" isn't intrinsic. Mercury's irregularity also undermines it. The shift from "roundness-only" (focusing on an intrinsic structural state) to "orbital clearing" (a relational/dynamic property) looks like abandoning essence-chasing for convenience. The IAU appears to be *installing a category* based on external factors (location, system dynamics), not discovering an essence. The debate seems confused – if there *was* an essence, the vote wouldn't matter.

  2.  **Cluster Theory (Co-occurring Properties):**
      *   **Planethood is:** A bundle – roundness, orbital dominance, formation history, perhaps even cultural significance – held together by the underlying mechanism of gravity and accretion. The fight between "roundness" (structural cluster) and "orbital dominance" (dynamical cluster) *precisely tracks* a disagreement over which cluster is scientifically primary or most useful. The IAU prioritized one cluster (dynamical dominance) over others. This makes the IAU look like a committee *choosing which cluster* to elevate, not discovering *the* natural kind. The engineer's point resonates: they presented one valid cluster (orbital dominance) as *the* discovery, potentially ignoring the validity of the structural cluster highlighted by Pluto's geology.

  3.  **Promiscuity (Interest-Relative Carvings):**
      *   **Planethood is:** Whatever categorization best serves the purpose at hand. For teaching introductory solar system architecture, orbital clearing is useful (8 dominant bodies). For comparative planetary geology, roundness is useful (Pluto, Ceres, Earth). The IAU vote was simply choosing *which* useful carving to standardize for a specific purpose (official solar system taxonomy). The fight *was* idle from this perspective – both definitions are "natural" for different interests. The fact the vote happened and people cared intensely is irrelevant to promiscuity itself; it just shows human attachment to singular labels. The location-dependence and Mercury points are *strengths* here – they perfectly illustrate how usefulness depends on context.

  4.  **Explanatory Payoff (Unified by Deep Explanation):**
      *   **Planethood is:** A category unified by processes deep enough and causally significant enough to warrant explanation. The key question is: *What deep story does "planet" explain?* If the deep story is solar system architecture and dynamics (how orbits evolve, clearing mechanisms), orbital dominance makes sense. If it's planetary geology and evolution (how bodies differentiate, develop atmospheres, tectonics), roundness makes more sense. The shift from the draft (geology-focused) to the final definition (dynamics-focused) represents a *shift in the explanatory goal*. The IAU prioritized the dynamical explanation. This makes the IAU look like it *could* have been doing legitimate joint-carving, but only if you accept that solar system dynamics is the "deep enough" story worth unifying the category. The New Horizons lead argues planetary geology *is* the deeper payoff, making the IAU definition seem shallow.

  **Your Historical Kind Hunch:** This fits neatly under **Cluster Theory (Account 2)**, as "shared formation history in the protoplanetary disk" becomes a key property in the cluster (alongside resulting features like roundness or compositional similarities). It's not a separate account; it's specifying a particular causal mechanism (formation history) binding the cluster together.

  ### What the Episode Does to the Accounts
  *   **Essentialism (1):** The episode is a **strong anomaly**. The location-dependence and Mercury's irregularity directly contradict the expectation of a single, intrinsic, defining essence. The messy vote process further highlights the lack of a discoverable essence. Essentialism struggles to handle this case.
  *   **Cluster Theory (2):** The episode **fits well**, confirming its core idea. The debate *was* fundamentally about which cluster to prioritize (structure vs. dynamics). However, the *intensity* of the fight and the IAU's need for a single official answer highlight a tension: cluster theory allows multiple valid categories, but human institutions often demand one.
  *   **Promiscuity (3):** The episode **confirms** promiscuity brilliantly. The existence of multiple valid definitions (cultural, structural, dynamical), the context-dependence (location, Mercury vs. criteria, exoplanets), and the ultimate reliance on a vote based on perceived usefulness all align perfectly. The fact the fight *wasn't* seen as idle by participants **is not a problem for promiscuity itself**. Promiscuity describes how the world *is* carveable; human attachment to a single label and the politics of "official" designations are separate sociological phenomena. The location-dependence and Mercury points are prime evidence *for* promiscuity.
  *   **Explanatory Payoff (4):** The episode **reveals a challenge**. It shows that "explanatory payoff" is itself contested. *Which* deep explanation (dynamics or geology) provides more significant payoff? The vote didn't resolve this; it simply chose one focus. The account doesn't provide a clear way to adjudicate *which* explanatory goal is superior, making the choice seem somewhat arbitrary or interest-driven despite the appeal to depth. It risks collapsing into promiscuity.

  **Where Accounts Go Silent:**
  *   **All accounts are silent** on the legitimacy of the *vote count* or specific IAU procedures. That's purely about institutional authority/jurisdiction.
  *   **Essentialism and Explanatory Payoff** struggle with or are silent on the **location-dependence** being scientifically acceptable.
  *   **Essentialism and Cluster Theory** are troubled by **Mercury** not perfectly fitting the roundness criterion yet retaining status, highlighting pragmatic inconsistency.
  *   **Promiscuity** is silent on *why* people fight so hard for one definition; it explains the possibility of multiple carvings, not the sociology of standardization.

  ### Two Wall Labels (Neutral & Honest)

  1.  "Scientists define 'planet' based on different priorities: some focus on an object's size and shape, others on its orbit. The current definition emphasizes orbital dominance, leading to Pluto's reclassification as a dwarf planet – a decision still debated as we learn more."
  2.  "Is Pluto a planet? The answer depends on whether you prioritize an object's geology or its orbit. This ongoing discussion shows how scientific categories evolve with new discoveries and perspectives."
