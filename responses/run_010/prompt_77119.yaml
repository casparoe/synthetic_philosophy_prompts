answer: |-
  ## Ledger

  The valley was good, the soil dark and deep.
  Each year brought more hands to tend the fields.
  The yield grew small per plate, but never thin.
  No one went hungry; each drank at the well.
  No reason surfaced to refuse, or end
  the quiet growth beneath the sun’s slow wheel.

  No single turn of the slow grinding wheel
  could ever be named the cause. More
  mouths meant more hands – a logic without end.
  They built new homes beyond the fallow fields.
  The water rose less high within the well,
  and each bowl held a portion thin.

  The taste grew thin, a constant, slight decline.
  No feast turned famine by a single wheel
  of seasons turning. Still, the village well
  sank lower. They dug deeper, needing more
  clear water for the spreading, sun-baked fields.
  They saw no threshold, no clear place to end.

  When does the “yes” become a weight? When end
  the welcome? No voice said “enough.” Thin
  shadows stretched long across the greening fields.
  No hand reached out to stop the turning wheel
  of births, the hope that always asks for more,
  the queue that lengthened daily at the well.

  The bucket scraped the mud now in the well.
  A life sustained, though barely. How to end
  this gentle slide? Each choice for one life more
  seemed right. Each face deserved no portion thin.
  It was the sum, the slow-turned, grinding wheel
  that wore the goodness from the fertile fields.

  They measured not the fading of the fields,
  but counted hands. The depth within the well
  was just a number. On the ledger’s wheel,
  the columns grew, a count without an end.
  The ink ran faint, the figures pale and thin,
  recording less for each, yet needing more.

  The well holds mud. The ledger’s thin script ends
  where *more* consumed the fields. The slow wheel grinds.
