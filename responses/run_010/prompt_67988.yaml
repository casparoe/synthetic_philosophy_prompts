prompt: |-
  I'm the reliabilty engineer at a small company building heavy-lift cargo drones — about forty people, and I'm the only one who does this part. Every subsystem that's new to us has to come with a probability of a hazardous failure per flight hour before the safety case can even start, and our internal template says anything worse than 1e-7 per flight hour for a hazardous failure is a no-go and anything worse than 1e-9 for a catastrophic one is a stop-the-program. Roughly three or four subsystems a quarter need a number, and about half of them are genuinely novel — no field history, no vendor reliability data, sometimes no test hours yet. So I've been making up priors, and I've started to suspect I'm making them up badly.

  Here's the thing that set this off. For a new release mechanism I wrote "failure rate uniform between 1e-7 and 1e-3 per hour." A colleague pointed out that's exactly the same as saying "mean time between failures uniform between 1000 and 10 million hours" — except it isn't, those two statements put their mass in completely different places, and the first one makes a 1e-4 rate look likely while the second makes it look almost impossible. Then he asked which one I'd still have written if the template had asked for hours-between-failures instead of per-hour rates. I had no answer. Somebody in the review said I should have heard of something called a Jeffreys prior and that it fixes this; somebody else said my prior is just my guess wearing a lab coat.

  What I want is a written procedure — ordered steps, the way you'd write a maintenance checklist — that takes "we know nothing about this part" and turns it into a number, or an interval, or an explicit refusal, that I can defend to an auditor and hand to a junior engineer to run without me. Specifically:

  - the questions to ask in order, and what counts as a sufficient answer to each before you're allowed to move on;
  - which quantity you should state the prior over, and why that one, and how to check you haven't just moved the same arbitrariness somewhere else;
  - what to do when you have partial information rather than none — a count of physical failure modes, data from a cousin part in a different industry, three near-misses in 500 hours of ground test;
  - where the procedure stops and outputs "no defensible number, test it / redesign it" instead, and where it hands the call to a human because it's a question about how much risk to bystanders we're willing to carry rather than about facts;
  - whether I'm allowed to submit a range or a set of distributions instead of a point, and what that does to the pass/fail gate above.

  Constraints: I have a spreadsheet and Python, no specialist software, and it has to take under an hour per subsystem. Every step needs to produce a sentence I could paste into a document a skeptical non-statistician reads.

  Then run it on three cases. (1) The pallet release mechanism: zero data, one failure mode that could drop a load early, and a vaguely-similar winch in offshore marine use whose history I don't really understand. (2) A battery tray meant to contain thermal runaway: no failures in 600 hours of ground test, and management wants to claim we've thereby demonstrated something better than 1e-5 per hour. (3) The one I probably won't like: the 1e-7 and 1e-9 numbers in our own template, which I've been treating as fixed targets rather than estimates. Tell me whether they survive the procedure, and if they don't, tell me what to do Monday.

  Finally, be blunt about which steps are judgment dressed up as procedure, what this whole approach cannot do, and how the procedure itself will misfire if someone runs it carelessly.
reasoning: |-
  We are going to design a procedure for assigning a prior distribution for the failure rate of a subsystem when there is little or no data. The goal is to have a defensible, consistent method that can be followed by a junior engineer and that produces an output that can be used in a safety case.

  The key issues from the example:
  - The choice of parameterization (failure rate vs. MTBF) can lead to different priors if we are not careful.
  - We want to use a non-informative prior when we have no information, and the Jeffreys prior is a common choice for exponential (constant failure rate) models.
  - We have to handle partial information.

  We'll break down the procedure into steps.

  ### Procedure: Assigning a Prior for Failure Rate

  #### Step 1: Identify the Failure Mode and Define the Event
     - **Question**: What exactly is the hazardous (or catastrophic) failure event? Describe the event that leads to the hazardous outcome.
     - **Sufficient Answer**: A clear, unambiguous description of the event and the conditions under which it is considered a failure. If there are multiple failure modes, they must be separated. If the failure mode is complex, break it down into independent events.
     - **Output**: A written description of the failure event.

  #### Step 2: Check for Existing Data
     - **Question**: Is there any existing data (field data, test data, similar components) that can inform the failure rate? 
     - **Sufficient Answer**: 
          - If there is field or test data, document the number of failures and the total exposure (e.g., flight hours, cycles). 
          - If there is data from a similar component, document the similarities and differences (environment, stress, design) and the data (failures and exposure).
          - If there is no data, state so.
     - **Output**: A table of available data: exposure hours and number of failures.

  #### Step 3: Assess the Applicability of Existing Data
     - **Question**: How relevant is the existing data to the specific failure mode and operating conditions?
     - **Sufficient Answer**: 
          - If the data is from an identical component in identical conditions, then it is directly applicable.
          - If there are differences, document the factors that might affect the failure rate (e.g., different environment, different load profile) and provide a qualitative assessment (high, medium, low relevance).
          - If the data is from a different industry or a cousin part, note the potential differences and the reasons why the failure rate might be higher or lower.
     - **Output**: A statement of relevance and an adjustment factor if any (with justification). If no data, skip to Step 5.

  #### Step 4: Analyze Existing Data
     - **Action**: If there is applicable data, use Bayesian updating with a non-informative prior to get a posterior distribution. The standard non-informative prior for a Poisson process (exponential failure times) is the Jeffreys prior, which is Gamma(0.5, 0) (which is improper) but for Bayesian updating we can use Gamma(α, β) where:
          - α = number of failures + 0.5
          - β = total exposure (flight hours)
          - Then the posterior for the failure rate λ is Gamma(α, β).
     - **Output**: The posterior distribution for λ (or a point estimate and interval if needed) and the source data.

  #### Step 5: Handle No Data or Partial Data
     - **Situation**: If there is no data, or data that is not directly applicable, we need to set a prior.
     - **Guidelines**:
          - We choose a prior that is non-informative in the appropriate parameterization. For a failure rate (λ) of a Poisson process, the Jeffreys prior is proportional to 1/sqrt(λ). This prior is improper, but we can truncate it to a reasonable interval.
          - We need to choose bounds. The bounds should be based on engineering judgment of what is physically possible. For example, the failure rate for a hazardous event must be below 1e-3 per hour (as in the example) because above that the system would be failing constantly and not viable. The lower bound can be set by considering that the failure rate cannot be below, say, 1e-10 per hour (if we are being extremely conservative) because then the component would be virtually infallible and we would have to question the model. However, the bounds should be set by the engineer based on the system.
          - We will use a truncated Jeffreys prior: 
              p(λ) ∝ 1/sqrt(λ) for λ in [a, b]
            The normalizing constant is 1/(2*(sqrt(b)-sqrt(a))). The cumulative distribution function is (sqrt(λ)-sqrt(a))/(sqrt(b)-sqrt(a)).
          - Alternatively, if we have partial information (like near-misses or tests with no failures) we can combine with the Jeffreys prior.

     - **How to set bounds [a, b]**:
          - **a**: The smallest failure rate that is physically plausible? Consider: the component must have some chance of failure. But note: our requirement is as low as 1e-9 for catastrophic. We might set a = 1e-10 (or 1e-11) to be safe.
          - **b**: The largest failure rate that is physically plausible? Consider: if the failure rate were above, say, 1e-3, then in 1000 hours we would expect at least one failure. If we have tested for even a few hours without failure, then we can set b to a value that is above what we would have observed. However, when there is no test, we set b to a value that is considered the maximum credible failure rate (for a new, untested system) by engineering judgment.

     - **Partial Information**:
          - If we have test hours with no failures (say T hours), then we can use the rule of thumb that the failure rate is less than 3/T (based on the "rule of three" for zero failures). We can set b = 3/T, but note that this is a frequentist upper bound. In Bayesian terms, we can use the Jeffreys prior and update with the test data (0 failures in T hours) to get a posterior. However, if we are setting the prior and then updating with data, we can use the Jeffreys prior and then update. But if we are setting a prior without updating (because we are going to use it in the safety case without further data) then we need to set a conservative prior.

          - For near-misses: if there were events that were almost failures, we might count them as a fraction of a failure. This is tricky and requires expert judgment. One approach is to count each near-miss as 0.5 failures or 0.1 failures? But without a clear basis, it might be better to treat near-misses as failures if they are truly close, or ignore them if not. Alternatively, if there were 3 near-misses in 500 hours, we might model that as 3 failures in 500 hours? But that would be too conservative because they didn't actually fail. A better way is to use a model that accounts for the severity of the near-misses. However, for simplicity, we might avoid using near-misses as hard data and instead use them to set the bounds (if we had near-misses, then the failure rate cannot be too low) or to adjust the prior.

     - **Output**: A prior distribution for λ, specified as a truncated Jeffreys prior on [a, b] and the justification for a and b.

  #### Step 6: When to Say "No Defensible Number"
     - **Conditions**:
          - If the bounds [a, b] are too wide such that the prior is essentially uninformative and the resulting posterior (if we had data) would not meet the requirement, then we must say "no defensible number".
          - Specifically, if the 95% upper bound of the prior (without any data) is above the requirement (e.g., 1e-7 for hazardous) then we cannot claim the requirement is met without data. We must either test or redesign.

     - **Judgment Call**:
          - If the prior mean or a high percentile (like 95%) is above the requirement, then we cannot pass the requirement without test data to update the prior.
          - The procedure must output: either a prior distribution (to be updated with future data) or a statement that testing/redesign is required.

  #### Step 7: Output the Prior and the Rationale
     - **Output Format**:
          - The prior distribution (e.g., "Truncated Jeffreys prior on [a, b] with a = ... and b = ...").
          - The rationale for the bounds and the choice of prior.
          - If there was data, the posterior distribution and the updating process.

     - **For the safety case**:
          - We output a failure rate distribution (prior or posterior) and then compute the probability that the failure rate is below the requirement (e.g., P(λ < 1e-7)). But note: the requirement is on the true failure rate, so we might require that the upper bound of a credible interval (e.g., 95%) is below the requirement? Actually, the requirement is a fixed target. However, the safety case typically uses a conservative estimate (like the upper bound) to show compliance.

          - Alternatively, if we are using the prior without data, we must be very cautious. We are not going to meet a 1e-7 requirement with a prior that has an upper bound of 1e-3. So the prior alone is not enough.

  #### Step 8: Pass/Fail Gate
     - **Rule**: The subsystem passes the prior assignment if we can produce a defensible prior and if, when combined with any available data, the 95% upper credible bound for λ is below the requirement. If there is no data and the prior's 95% upper bound is above the requirement, then it fails and we must test or redesign.

     - **Note**: This gate is after the prior assignment. But note that without data, the prior alone will not meet the requirement. So the purpose of the prior is to set the stage for updating with data. However, in the safety case, we might have to show that even with the prior and limited data we meet the requirement.

     - **Output**: Pass, Fail, or Conditional Pass (if there is a plan to collect data and update).

  #### Step 9: Handling Multiple Failure Modes
     - If the subsystem has multiple independent failure modes that lead to the same hazardous event, then we must assign a prior for each and then combine (the overall failure rate is the sum). If they are not independent, then we need a more complex model.

  #### Step 10: Document and Review
     - Every step must be documented with the answers and the rationale.

  ### Why Jeffreys Prior?
  The Jeffreys prior is invariant to reparameterization. That means if we had chosen to work with MTBF (θ = 1/λ), the Jeffreys prior for θ would be proportional to 1/θ, and then transforming to λ would give the same distribution as if we had started with λ. This avoids the inconsistency that the engineer encountered (uniform on λ vs uniform on θ).

  ### How to Check for Arbitrariness?
  We set the bounds [a, b] arbitrarily? Yes, that is a judgment. We must document the reasons for the bounds. The Jeffreys prior inside the bounds is non-informative. The arbitrariness is confined to the bounds, which we set based on physical constraints and engineering judgment.

  ### Example Cases

  #### Case 1: Pallet Release Mechanism
  - Zero data, one failure mode (drop load early), and a vaguely-similar winch in offshore marine use.
  - Step 1: Failure event is unintended release of the pallet during flight.
  - Step 2: No data for this mechanism. The offshore winch: suppose we have some data but we don't understand it. We decide not to use it because we cannot assess relevance.
  - Step 5: We set a truncated Jeffreys prior. 
        What bounds? 
            Lower bound a: 1e-10 (because we can't imagine it being more reliable than 1e-10)
            Upper bound b: 1e-3 (because if it were higher, we would see failures in testing or similar systems)
  - Prior: p(λ) ∝ 1/sqrt(λ) for λ in [1e-10, 1e-3]
  - Step 6: Without data, the 95% upper bound of λ: 
        The cumulative distribution: F(λ) = (sqrt(λ) - sqrt(a)) / (sqrt(b) - sqrt(a))
        Solve for λ such that F(λ) = 0.95:
            sqrt(λ) = 0.95*(sqrt(b)-sqrt(a)) + sqrt(a)
            Plug in a=1e-10, b=1e-3: 
            sqrt(a)=1e-5, sqrt(b)=sqrt(0.001)=0.03162
            sqrt(λ) = 0.95*(0.03162 - 0.00001) + 0.00001 ≈ 0.95*0.03161 + 0.00001 = 0.03003
            λ = (0.03003)^2 ≈ 0.000902 (or 9e-4 per hour)

        The 95% upper bound is about 9e-4 per hour, which is above the hazardous requirement of 1e-7.
  - Conclusion: We cannot meet the requirement without data. Output: "No defensible number without test data. Testing or redesign required."

  #### Case 2: Battery Tray for Thermal Runaway
  - No failures in 600 hours of ground test. Management wants to claim better than 1e-5 per hour.
  - Step 1: Failure event is thermal runaway that is not contained, leading to a fire that could cause the drone to crash.
  - Step 2: Data: 0 failures in 600 hours.
  - Step 4: We use the Jeffreys prior for zero failures? The Jeffreys prior for the exponential model is Gamma(0.5, 0). Updating with 0 failures in 600 hours: 
        Posterior: Gamma(0.5, 600)
  - The posterior distribution of λ is Gamma(α=0.5, β=600). 
        The mean is α/β = 0.5/600 ≈ 8.33e-4 per hour.
        The 95% upper bound: we use the inverse gamma distribution. The 95th percentile for Gamma(α, β) is the value x such that the CDF of Gamma(α, β) is 0.95. 
        We can compute it using Python or approximate: for small α, the gamma distribution is highly skewed. 
        Using the chi-square approximation: if X ~ Gamma(α, β) then 2*β*X ~ Chi^2(2α). Here, 2α=1, so 2*600*λ ~ Chi^2(1). 
        The 95th percentile of Chi^2(1) is about 3.84, so:
            2*600*λ = 3.84  =>  1200 * λ = 3.84  => λ = 3.84/1200 ≈ 0.0032 (3.2e-3 per hour).

        Alternatively, we can use the rule of three: 3 / (total hours) = 3/600 = 0.005 (5e-3 per hour) as a frequentist upper bound. Our Bayesian upper bound is about 3.2e-3, which is similar.

  - The requirement is 1e-5 per hour. The 95% upper bound is 3.2e-3, which is much greater than 1e-5. Therefore, the data does not demonstrate that λ < 1e-5.

  - Step 6: The 95% upper bound is above the requirement. We cannot claim the requirement is met. We need more test hours.

  - How many hours would be needed? To demonstrate a failure rate of 1e-5 with 95% confidence and zero failures, we need T hours such that 3/T <= 1e-5? Then T >= 3e5 hours. That's 300,000 hours, which is not practical.

  - Therefore, we must either:
        (a) Redesign to make the battery tray more robust so that we can have a better prior? 
        (b) Use a different approach (like physics-based modeling) to set a prior? 
        (c) Accept that we cannot demonstrate by testing alone and rely on design assurance.

  - Output: "The test data (0 failures in 600 hours) does not demonstrate a failure rate below 1e-5 per hour. The 95% upper bound is 3.2e-3 per hour. More extensive testing is impractical. Consider redesign or alternative methods to substantiate the failure rate."

  #### Case 3: The 1e-7 and 1e-9 Requirements
  - We have been treating these as fixed targets. But where did they come from?
  - Step 1: The failure events: hazardous and catastrophic.
  - Step 2: We have no data for the entire drone. The requirements are set by the company based on industry standards? But we are to evaluate them as if they were failure rates of a component.

  - Actually, these are system-level requirements. The procedure is for subsystems. But the question is: are these numbers defensible as failure rates for a subsystem?

  - However, if we are to assign a prior to the failure rate of the entire drone, we would need to aggregate the failure rates of all subsystems. But that's not the case.

  - The point is: the requirements themselves are set by risk assessment. The procedure we are building is for subsystem failure rates, not for the system-level requirement.

  - But if we are to evaluate the requirement numbers as if they were failure rates of a component, then:

        We have no data for the requirement itself? It's a requirement, not a component.

  - Instead, we should note that the requirements are set by considering the total risk. For example, the catastrophic failure rate for the entire drone might be required to be below 1e-9 per hour. Then we allocate that to subsystems.

  - How to defend the requirement? It's a business decision based on risk tolerance and industry practice. We are not going to assign a prior to the requirement number. The requirement is given.

  - But if we are asked: "What is the prior for the failure rate of a subsystem that we require to be 1e-7?" then we are missing the point. The requirement is a target, not a random variable.

  - However, if we are to assign a prior to the failure rate of a subsystem that is required to meet 1e-7, then we would use the same procedure as above. We would set a truncated Jeffreys prior with bounds. Without data, the prior would be uninformative and we would not meet the requirement.

  - The numbers 1e-7 and 1e-9 are very stringent. They are typical for aviation safety. They are set by the consequence of failure and the acceptable risk level. They are not estimates but targets.

  - Therefore, they "survive" the procedure as fixed targets. The procedure does not evaluate the targets but uses them as requirements.

  - What to do Monday? 
        - We must recognize that without data, we cannot demonstrate that a subsystem meets 1e-7. So we must either:
            (a) Break down the subsystem into independent components and assign failure rates to each (using data or priors) and then aggregate to see if the sum meets 1e-7.
            (b) Collect data for the subsystem through testing or similarity.
            (c) Use design assurance levels (e.g., DO-178C for software) to claim a failure rate without quantitative testing.

  - For a subsystem that is novel and without data, we are likely to fail the requirement. Therefore, we must plan for extensive testing or redesign to simpler, more reliable components.

  ### Blunt Assessment
  - **Judgment in the Procedure**:
       - Step 5 (setting the bounds [a, b]) is entirely judgment. The engineer must justify the bounds. Different engineers might set different bounds.
       - Step 3 (assessing the applicability of existing data) is also judgment.
       - The choice of the Jeffreys prior is a statistical convention, but it is not the only non-informative prior. However, it is a good default.

  - **What This Approach Cannot Do**:
       - It cannot create information from nothing. Without data, the prior is uninformative and we will not meet stringent requirements.
       - It cannot account for unknown failure modes. We assume we have identified the failure modes.
       - It assumes constant failure rate (exponential distribution). For components with wear-out, we need a different model.

  - **How It Can Misfire**:
       - If the bounds are set too narrowly, we might be overconfident.
       - If the bounds are set too widely, the prior will be uninformative and we will never pass without data.
       - If the engineer uses the procedure carelessly, they might use an inappropriate prior (e.g., uniform on λ when they should use Jeffreys) or set bounds without justification.
       - If the engineer fails to separate failure modes, the prior for the overall subsystem might be wrong.

  - **Final Note**:
       The procedure is a structured way to document the thought process. It does not remove the need for expert judgment but makes the judgment explicit and auditable.

  ### Written Procedure (Checklist Style)

  **Procedure for Assigning a Failure Rate Prior for a Subsystem**

  1. **Define the Failure Event**
     - Describe the hazardous or catastrophic failure event in detail.
     - If there are multiple independent failure modes, list them separately.
     - Output: Failure event description.

  2. **Collect Data**
     - Gather any available data (field data, test data, data from similar components). Record:
          - Total exposure (flight hours, cycles, etc.)
          - Number of failures (for each failure mode)
          - Source and context of the data.
     - Output: Data table.

  3. **Assess Data Relevance**
     - For each data source, rate the relevance (high, medium, low) and note differences in:
          - Operating environment
          - Stress levels
          - Design differences
          - Maintenance procedures
     - If the data is not directly applicable, state why and if an adjustment factor is used, justify it.
     - Output: Relevance assessment and adjustment (if any).

  4. **If Data is Available and Applicable**
     - Use the Jeffreys prior (Gamma(0.5, 0)) and update with the data:
          - Posterior: Gamma(α = number_of_failures + 0.5, β = total_exposure)
     - Output: Posterior distribution (Gamma distribution parameters).

  5. **If No Data or Data Not Applicable**
     - Set bounds [a, b] for the failure rate λ:
          - a: lower bound (e.g., 1e-10, 1e-11) - justify by physical possibility.
          - b: upper bound (e.g., 1e-3, 1e-2) - justify by engineering judgment (e.g., if it were higher, we would have seen failures in similar systems or testing).
     - Set prior: Truncated Jeffreys prior: p(λ) ∝ 1/sqrt(λ) for λ in [a, b].
     - Compute the 95% upper bound of this prior:
          - Solve: (sqrt(λ_95) - sqrt(a)) / (sqrt(b) - sqrt(a)) = 0.95
          - λ_95 = [0.95*(sqrt(b)-sqrt(a)) + sqrt(a)]^2
     - Output: Prior distribution (truncated Jeffreys) and the 95% upper bound.

  6. **Check Against Requirement**
     - If the 95% upper bound (from prior or posterior) is below the requirement (e.g., 1e-7 for hazardous), then the subsystem passes the prior assignment (but note: without data the prior will never pass a stringent requirement).
     - Else, if the 95% upper bound is above the requirement:
          - If there is no more data to collect, then output: "Cannot meet requirement without additional data or redesign."
          - If there is a plan to collect data, then output: "Prior set, but requirement not yet met. Plan to update with future test data."
     - Output: Pass/Fail and comments.

  7. **Document**
     - Record every step, the outputs, and the rationale.

  **End of Procedure**
answer: |-
  Below is a structured, checklist-style procedure for assigning defensible failure rate priors in your context. It addresses your requirements, constraints, and the need for auditor-friendly documentation. The procedure prioritizes the **Jeffreys prior** for invariance under reparameterization (resolving your colleague's objection), forces explicit justification of bounds, and includes off-ramps for "no defensible number." It also handles partial data and avoids false precision.

  ---

  ### **Procedure: Assigning Failure Rate Priors for Novel Subsystems**
  **Input**: Hazardous/catastrophic failure mode description.  
  **Output**: Prior distribution (or refusal), with documentation for each step.  
  **Time Limit**: 60 minutes per subsystem.  
  **Tools**: Spreadsheet (for calculations), Python (for distributions/plots).  

  #### **Step 1: Define Failure Mode Quantities**  
  **Question**: What is the *fundamental observable*?  
  - **Options**:  
    - (A) **Failure rate (λ)** (failures/hour) if you observe events in continuous operation.  
    - (B) **Probability per demand (p)** if failure is discrete (e.g., release mechanism per flight).  
  - **Sufficient Answer**:  
    - Choose (A) for continuous hazards (e.g., battery fire), (B) for per-operation hazards (e.g., release mechanism).  
    - **Why**: Ensures parameter matches the physics. Jeffreys prior is invariant for (A) λ and (B) p.  
  - **Output Sentence**: "Fundamental observable: [λ or p] because [brief justification, e.g., 'failure can occur at any time during flight']. Prior will be defined over this quantity."

  #### **Step 2: Elicit Bounds (Judgment-Driven)**  
  **Question**: What are the *physically plausible bounds*?  
  - **Actions**:  
    1. Set **lower bound (L)**: Minimum credible failure rate. Default: `1e-11` (avoids math limits; adjust if needed).  
    2. Set **upper bound (U)**: Maximum credible failure rate. **Must justify** using:  
       - Similar components,  
       - Physics-based limits (e.g., "no material survives 1e3 cycles"),  
       - "Sanity check" (e.g., "λ > 1e-3 would fail weekly in testing").  
  - **Off-Ramp**: If bounds span > 6 orders of magnitude (e.g., L=1e-11, U=1e-3), output: "**Insufficient knowledge—test or redesign required.**"  
  - **Output Sentence**: "Bounds: [L] to [U] per hour/demand. Justification: [e.g., 'winch data suggests U=1e-4; below 1e-11 is physically implausible']."

  #### **Step 3: Choose Prior Type**  
  **Question**: Is there *any* relevant data?  
  - **Decision Tree**:  
    - **No data → Jeffreys prior** (non-informative, invariant).  
      - For λ: `p(λ) ∝ 1/√λ` (bounded by [L, U]).  
      - For p: `p(p) ∝ 1/√[p(1−p)]` (bounded by [L, U]).  
    - **Partial data → Hybrid prior** (see Step 4).  
  - **Why Jeffreys?**: Avoids arbitrariness in parameterization (e.g., uniform on λ vs. MTBF).  
  - **Output Sentence**: "Prior type: [Jeffreys/Hybrid] because [e.g., 'no data']."

  #### **Step 4: Incorporate Partial Data (If Applicable)**  
  **Question**: What imperfect evidence exists?  
  - **Cases**:  
    - **Ground tests (no failures)**: Use **Jeffreys posterior** with exposure time T.  
      - E.g., 0 failures in T hours → posterior λ ~ Gamma(0.5, T).  
    - **Near-misses (k events in T hours)**: Treat as **fractional failures** (judgment call).  
      - E.g., 3 near-misses → assume 0.1 to 0.5 effective failures (justify!).  
    - **Cousin components**: Adjust via **multiplicative factor** δ.  
      - E.g., "offshore winch λ=1e-5, but drone has 3× vibration → δ=3".  
  - **Output Sentence**: "Data: [description]. Adjusted to [effective λ/k] with justification: [e.g., 'near-misses weighted at 0.3 failures due to controlled conditions']."

  #### **Step 5: Compute Prior & Key Metrics**  
  **Actions**:  
  1. **Calculate Jeffreys prior** in spreadsheet/Python:  
     - For λ: Mean = `[√U - √L] / [0.5 * (U - L)/√(L*U)]` (approx.), 95% CI via inverse CDF.  
     - Use Python for accuracy:  
       ```python
       import scipy.stats as stats
       from scipy.integrate import quad

       # For λ (bounded Jeffreys)
       L, U = 1e-7, 1e-3  # Your bounds
       denominator, _ = quad(lambda x: 1/x**0.5, L, U)
       prior_pdf = lambda x: (1/x**0.5) / denominator  # Normalized PDF

       # 95% CI (using inverse CDF approximation)
       cdf = lambda x: quad(prior_pdf, L, x)[0]
       ci_low = stats.norm.ppf(0.025)  # Use root-solving for exact CI
       ci_high = stats.norm.ppf(0.975)  # Or numerical integration
       ```  
  2. **Compute metrics**:  
     - Mean, 95% credible interval.  
     - `P(λ > requirement)` (e.g., `P(λ > 1e-7)`).  
  - **Output Sentence**: "Prior: Jeffreys on [L, U]. Mean λ = [X], 95% CI: [Y]–[Z]. P(λ > [req]) = [Q]."

  #### **Step 6: Pass/Fail Gate**  
  **Rule**:  
  - **Pass** if: `Upper 95% CI < requirement` (e.g., 1e-7).  
  - **Fail** if: `Lower 95% CI > requirement` OR `P(λ > requirement) > 0.5`.  
  - **Conditional Pass** if between: "Prior acceptable pending [test plan]."  
  - **Off-Ramp**: If prior gives >10% probability of violating requirement → **"Redesign or test."**  
  - **Output Sentence**: "Verdict: [Pass/Fail]. Reason: [e.g., '95% CI (1e-8–1e-4) exceeds 1e-7 requirement']."

  #### **Step 7: Final Output Format**  
  **Options**:  
  - Single distribution (if defensible).  
  - Interval + distribution (if hybrid data).  
  - **Never** a point estimate.  
  - **Refusal** if:  
    - Bounds too wide (Step 2 off-ramp).  
    - Partial data is uninformative (e.g., "3 near-misses still give P(λ>1e-7)=0.99").  
  **Output Sentence**: "Prior: [Gamma(α,β) / Bounded Jeffreys] with mean [X]. Recommended action: [Use in safety case/Redesign/Test]."

  ---

  ### **Applied to Your Cases**  
  #### **Case 1: Pallet Release Mechanism**  
  - **Step 1**: λ (continuous hazard).  
  - **Step 2**: L=1e-11 (implausible <1e-11), U=1e-4 (from winch cousin; 1e-3 was arbitrary).  
  - **Step 3**: No data → Jeffreys.  
  - **Step 4**: Cousin winch λ=1e-5 in marine; adjust δ=10 (harsher drone env) → effective U=1e-4.  
  - **Step 5**: Prior λ ~ Jeffreys on [1e-11, 1e-4]. Mean=2.5e-6, 95% CI=1e-11–3e-5.  
  - **Step 6**: P(λ>1e-7)=0.82 → **FAIL**. "Redesign or ground-test 1e4 hours."  
  - **Output**: "Unacceptable risk. Test plan required: 200 cycles with 0 failures to show λ<1e-5."

  #### **Case 2: Battery Tray (0 failures, 600h)**  
  - **Step 1**: λ (thermal runaway hazard).  
  - **Step 2**: L=1e-11, U=1e-3 (plausible for untested design).  
  - **Step 3/4**: Partial data → Jeffreys posterior: λ ~ Gamma(0.5, 600).  
  - **Step 5**: Mean=8.3e-4, 95% CI=3.2e-5–3.2e-3. P(λ>1e-5)=0.99.  
  - **Step 6**: **FAIL** (management’s 1e-5 claim invalid). "600h demonstrates λ<1e-3 (95% CI), not 1e-5."  
  - **Output**: "Insufficient proof. Need 300,000 failure-free hours for 1e-5. Redesign for inherent safety."

  #### **Case 3: Your 1e-7/1e-9 Requirements**  
  - **Step 1**: Requirement = λ_max (fixed target).  
  - **Step 2**: Treat as "subsystem" with L=1e-12, U=1e-5 (conservative bounds).  
  - **Step 3**: No data → Jeffreys.  
  - **Step 5**: Prior λ ~ Jeffreys on [1e-12, 1e-5]. P(λ>1e-9)=0.75, P(λ>1e-7)=0.95.  
  - **Step 6**: **FAIL** both requirements.  
  - **Monday Action**: "Template requirements are *targets*, not priors. Justify them via:  
    - Industry standards (e.g., DO-178C for aviation),  
    - Risk matrix (e.g., '1e-9 = 1 catastrophic failure per 100k fleet-years'),  
    - **Do not use as priors**—they are design goals."  

  ---

  ### **Blunt Assessment**  
  #### **Judgment Dressed as Procedure**  
  - **Bounds (Step 2)**: Entirely subjective. An engineer could manipulate U to pass/fail.  
  - **Partial Data (Step 4)**: Weighting near-misses or δ-factors is expert opinion.  
  - **Jeffreys Isn't Magic**: It ensures invariance but doesn't create knowledge from ignorance.  

  #### **What This Cannot Do**  
  - **Unknown-Unknowns**: Misses failure modes outside your FMEA.  
  - **Non-Constant λ**: Jeffreys assumes constant rate; wear-out mechanisms need Weibull models.  
  - **System Interactions**: Priors assume independent subsystems; common-cause failures break this.  

  #### **How It Misfires**  
  - **Garbage In, Gospel Out**: Sloppy bounds (e.g., U=1e-3 "to be safe") → false sense of security.  
  - **Misapplied Jeffreys**: Using for non-Poisson processes (e.g., wear-out) → dangerous errors.  
  - **Partial Data Overconfidence**: Treating 3 near-misses as λ=0.01 without physics → audit failure.  

  #### **Final Advice**  
  - **Document Judgment**: For bounds/data adjustments, write: "Assumed U=1e-4 because [winch spec] with 3× uncertainty margin."  
  - **Peer Review**: Require 2 engineers to sign off on Steps 2/4.  
  - **Start Testing Early**: Priors are placeholders. All novel subsystems need test plans by Q2.  

  This procedure makes conservatism explicit, defeats parameterization arbitrariness, and forces tough calls early. Use it to redirect management ("your 1e-5 claim is unachievable") and auditors ("here's our consistent method").
