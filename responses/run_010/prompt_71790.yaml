prompt: |-
  I'm TA-ing a third-year seminar this term, "Why are some countries rich?" — half economic history, half philosophy of social science, 25 students, and one week early on was supposed to be about causal inference from historical data. I've got the midterms to mark this weekend and one of them I want a second pair of eyes on before I commit to a number, partly because the department now wants actual written feedback rather than a tick and a grade, and partly because I've read so many of these by now that I've loose track of what counts as a real error versus an undergrad just phrasing something clumsily. Nothing weird about this one — no extension, no plagiarism flag, the student was in most weeks — I just don't want to over- or under-mark it.

  The question was the second of two essay questions, worth 20 marks, and the paper told students to aim for around 400 words:

  "Economists and historians disagree about the 'fundamental cause' of differences in income across countries, with geography, institutions and culture as the three leading candidates. (a) Explain what the so-called reversal of fortune is and what it is supposed to show. (b) Explain how settler mortality is used as an instrument for present-day institutions, and what has to be true for that instrument to do its job. (c) Give one reason for scepticism that either exercise settles the disagreement."

  And here's the answer, verbatim except that I fixed two spelling things:

  "(a) The reversal of fortune is the finding that the parts of the world that were richest around 1500 — the Aztec and Inca empires, India, China — are mostly not the richest today, while places that were comparatively empty and poor in 1500, like North America, Australia and New Zealand, are now among the richest. Acemoglu, Johnson and Robinson use this to argue against the geography view. Their point is that geography obviously did not change between 1500 and now: the climate, the soils and the disease environment of Mexico are the same today as they were then, so geography cannot explain why the ranking flipped. What changed was the sort of institutions Europeans set up. Where Europeans could settle in large numbers they rebuilt their own societies, with property rights, constraints on the state and markets open to new entrants; where they could not settle they built extractive states designed to pull resources and labour out, and those institutions outlived colonialism. And since institutions are made by people and could have been made otherwise, this basically settles the matter: the geography hypothesis is wrong, and the fundamental cause is institutions.

  (b) You cannot test this by just regressing income on some measure of property rights, because rich countries can afford good institutions at least as much as good institutions make countries rich. The trick is to find something that affects institutions but has no other effect on income today. They use the mortality rates of European soldiers, sailors and settlers in the colonies. Where mortality was high Europeans did not settle, and where they did not settle you got extractive institutions, so mortality predicts institutions; but nineteenth-century European mortality obviously cannot have any effect at all on a modern economy's GDP, so any correlation between the instrument and income must run through institutions. That is what makes it a clean instrument, and it is why the regressions are not vulnerable to the reverse-causation complaint from the first paragraph.

  (c) Honestly the best evidence for the institutions view is not a regression at all. Korea was one country with one language, one culture and one geography until 1945; then the north got one set of institutions and the south another, and the income gap today is enormous. Because geography and culture are held constant across the two, the difference has to be institutions. That is why I think the scepticism asked for in (c) is overdone. The culture explanation, which is mostly a restatement of Max Weber, cannot handle Korea, and neither can Diamond's guns, germs and steel story, since what Diamond is really saying is that Europeans had a better culture of innovation. Between the reversal of fortune and Korea, what the evidence shows is that history matters, and the lesson for policy is that poor countries need to build better institutions rather than wait for their geography to improve."

  Can you mark it? I'd like a number out of 20, and then a claim-by-claim breakdown I can more or less paste into the feedback sheet: for each substantive move in the answer, whether it's solid, actually wrong, or defensible-but-arguable and so not worth much penalty. Where you call something wrong, don't just say it muddles the instrument logic or overstates the case — say what the right version of that sentence would have been, and say how much of the 20 marks it should cost. Also flag anything that reads like recited lecture content that isn't doing the work the question asked for, and note separately whether part (c) was actually answered as set, since I can't decide whether arguing against the premise of (c) counts as responding to it.
reasoning: |-
  Okay, I need to help this TA mark a midterm essay question about why some countries are rich. The question has three parts: (a) explaining reversal of fortune, (b) explaining settler mortality as an instrument, and (c) giving a reason for skepticism. The student's answer is provided, and I have to evaluate it out of 20 marks and provide detailed feedback.

  First, I'll go through each part of the answer step by step. For part (a), the student describes the reversal of fortune correctly - rich places in 1500 like Aztec/Inca empires are poorer now, while empty places like North America became rich. They link this to Acemoglu et al.'s argument against geography, explaining how institutions changed based on European settlement patterns. This seems solid, though they could have mentioned that reversal specifically refers to within-colonies comparison to address geography.

  Part (b) covers settler mortality as an instrument. The student correctly identifies the endogeneity problem and explains how settler mortality serves as an instrument by affecting institutions but not modern GDP. They nail the two key requirements: relevance (mortality predicts institutions) and excludability (no direct effect on income). This is well-handled.

  Now part (c) is interesting. Instead of providing skepticism as asked, the student argues against skepticism using the Korea example. While the Korea case is valid evidence for institutions, it doesn't address the question's request for skepticism about the reversal or IV approach. The student dismisses the need for skepticism rather than engaging with potential weaknesses.

  For scoring:
  - Part (a) is excellent but slightly overclaims by saying it "settles the matter" - minor deduction
  - Part (b) is nearly perfect - full marks
  - Part (c) doesn't answer the prompt - major deduction

  The student demonstrates good understanding but fails to follow instructions in (c). The Korea example, while insightful, belongs in part (a) as supporting evidence, not as skepticism. 

  For feedback, I'll provide specific comments on each claim, noting where it's solid, defensible, or wrong, with corrections where needed. I'll also address the part (c) issue clearly since the TA specifically asked about this.
answer: |-
  Here's a comprehensive mark and feedback breakdown for the essay response, designed for direct use in your feedback sheet. The answer demonstrates strong understanding but has substantive issues in Part (c) and minor overstatements elsewhere.

  **Overall Mark: 16/20**  
  (Breakdown: Part (a): 7/8, Part (b): 7/8, Part (c): 2/4)

  ### Feedback by Claim

  **PART (a): Reversal of Fortune (7/8)**
  - **"Reversal of fortune is the finding that... richest today"**: **Solid**. Correctly identifies the core phenomenon.  
  - **"Acemoglu, Johnson and Robinson use this to argue against geography view"**: **Solid**. Accurate attribution and purpose.  
  - **"Geography obviously did not change... cannot explain why the ranking flipped"**: **Solid**. Valid logical critique of geography hypothesis.  
  - **"What changed was institutions Europeans set up... extractive states"**: **Solid**. Correctly links settlement patterns to institutional divergence.  
  - **"This basically settles the matter: geography hypothesis is wrong"**: **Defensible-but-overstated (Minor penalty: -0.5)**. While reversal *weakens* geography, it doesn't fully "settle" it (e.g., geography could still interact with institutions). Better: "This strongly undermines geography as a *sufficient* fundamental cause."  
  - **Missing nuance**: No mention that reversal specifically compares *former European colonies* (not all countries). Not required but strengthens the case.

  **PART (b): Settler Mortality as Instrument (7/8)**  
  - **"Rich countries can afford good institutions... reverse causation"**: **Solid**. Perfect setup of endogeneity problem.  
  - **"Find something that affects institutions but no other effect on income"**: **Solid**. Correct core definition of instrument validity.  
  - **"They use mortality rates... so mortality predicts institutions"**: **Solid**. Accurate description of first-stage relevance.  
  - **"19th-century mortality cannot affect modern GDP... correlation runs through institutions"**: **Solid**. Correct excludability argument.  
  - **"Clean instrument... not vulnerable to reverse causation"**: **Defensible-but-arguable (Minor penalty: -0.5)**. While the *design* avoids reverse causality, it doesn’t address *all* endogeneity concerns (e.g., omitted variables correlated with mortality). Better: "This helps address reverse causation, though other confounders could remain."

  **PART (c): Reason for Scepticism (2/4)**  
  - **"Honestly the best evidence... is Korea"**: **Off-prompt (Major penalty: -1.5)**. Provides evidence *for* institutions but ignores the question’s explicit request for *scepticism* about reversal/IV.  
  - **"Scepticism... is overdone"**: **Wrong (Major penalty: -0.5)**. Directly contradicts the prompt. Question requires a critique, not defense.  
  - **"Culture explanation cannot handle Korea"**: **Irrelevant to prompt**. Korea example is valid counter to culture/geography, but not a critique of reversal/IV as asked.  
  - **Missing the task**: Fails to engage with weaknesses in reversal/IV (e.g., reversal’s focus on colonies only, IV exclusion restriction challenges, data quality debates).  

  ### Key Issues Noted
  1. **Part (c) Unanswered**: Arguing *against* the premise of (c) does **not** fulfill the prompt. The question demands a *reason for scepticism* regarding the reversal/IV exercises – not a defense of institutions. Korea is compelling evidence but belongs in (a), not (c).  
  2. **Overclaims**: Phrases like "settles the matter" (a) and "clean instrument" (b) slightly overstate findings.  
  3. **Recited Content**: Korea example feels "pasted in" to showcase knowledge but misapplied here. The IV explanation (b) is textbook-perfect but appropriately used.  

  ### Suggested Improvements
  - **For (c)**: A valid sceptical point could be: *"The IV assumes 19th-century mortality affects income* only *via institutions, but mortality might correlate with* geographic *factors (e.g., disease ecology) that still affect development today, violating excludability."*  
  - **Balanced Conclusions**: Avoid framing evidence as "settling" complex debates (nuance is key in historiography).  

  ### Why 16/20?
  - **Deductions**: -1 in (a) for overclaim, -1 in (b) for overlooking IV limitations, -2 in (c) for ignoring prompt + argumentative stance.  
  - **Strengths**: Mastery of core concepts (a/b), clear writing, logical flow.  
  - **Part (c) Compliance**: Answer does **not** respond to the prompt as set. Skepticism must be articulated, not rejected.  

  This is a strong B+/A- response – excellent on fundamentals but tripped by misreading (c). Feedback should emphasize that skepticism questions require engaging critiques even if one disagrees.
