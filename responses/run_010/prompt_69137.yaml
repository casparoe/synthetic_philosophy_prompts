prompt: |-
  You are an experienced epistemologist who has taught Wittgenstein's *On Certainty* many times and who grades slowly rather than quickly: you check a candidate's inferences against the terms the exam itself supplies, rather than against how those terms are used in the literature you happen to know. I am the TA for an upper-division course on scepticism and I need a defensible grade and feedback on one anonymous answer. I have not formed a view about this answer and I do not want your assessment steered by any expectation of mine, so please evaluate it strictly on its merits.

  Here is the question as it appeared on the take-home midterm. The taxonomy in the stem is stipulated for examination purposes; it does not correspond exactly to any published taxonomy, and candidates were told to argue within it.

  > **Question 3 (20 marks).** The following stipulations were given in week 5. A **global hinge** for a subject S is a proposition that is certain for S and that is presupposed by every enquiry S could coherently undertake. A **local hinge** for S is a proposition that is certain for S only within a specified enquiry, and that S could rationally doubt in a different enquiry without losing certainty elsewhere. A proposition is **exempt** for S if doubting it would undermine the very practice in which doubt gets a sense, and **warranted** for S if there is something S could cite as telling in its favour.
  >
  > Moore's "Here is a hand," said while holding up a hand before a lecture-room audience and offered as a proof of an external world, is ordinarily treated as an everyday empirical claim that Moore says he knows. On the stipulated framework, is it a global hinge for Moore, a local hinge for Moore, or neither? Then: does your answer support the claim that hinges are exempt but never warranted, or does it leave open that some hinges are both? Argue for your position and address at least one objection to it. Reproducing the taxonomy earns nothing; the marks are for what you do with it.

  Here is the answer submitted by Candidate 7. Note that the exam was closed-book, citations were neither required nor permitted, and nothing should be deducted for uncited sources.

  > Moore holds up a hand and says he knows it is a hand, and takes this to refute scepticism about the external world. Wittgenstein's reply, in the notes published after his death, is not that Moore is lying or that the hand might not be there, but that Moore has used "know" in a way that leaves it no work to do. For "I know" to be in order there has to be something Moore could produce that settles the matter and a way the matter could have gone otherwise; Moore's hand is not like that, since it is closer to the standard against which other claims in the room are tested. So the right description is that Moore is objectively certain, and objective certainty is not a high degree of subjective conviction but a different kind of standing altogether.
  >
  > On the framework, then, "Here is a hand" is a hinge rather than an ordinary empirical claim, and I argue it is a **local** hinge for Moore. It is certain for him and presupposed by the enquiry he is actually engaged in, since he cannot test whether it is a hand without relying on hands, eyes, and the intelligibility of demonstration. But it is not global: a global hinge must be presupposed by every enquiry the subject could coherently undertake, and Moore's audience can coherently undertake the sceptic's enquiry, in which what looks like a hand is a hallucination. In that enquiry the claim is doubted rather than certain, so it fails the global test. Since the stipulation defines a local hinge as one that can be doubted in a different enquiry without loss of certainty elsewhere, Moore's claim is local.
  >
  > On the second part, exemption and warrant are exclusive, and more strongly than the question implies. Exemption is defined by what doubting does: to doubt an exempt proposition is to undermine the practice that gives doubt a sense. Warrant is defined by citability. Now if p is exempt, any attempt to cite evidence for p already presupposes p, so the citation restates p rather than supporting it; hence nothing can be cited in p's favour; hence p is unwarranted. Conversely, if p were warranted, there would be something telling in its favour, and anything that can be told for can in principle be told against, so p would be doubtable and therefore not exempt. So a hinge is never both, and the local/global distinction is simply a distinction in how wide the exemption runs.
  >
  > This also settles the question of whether hinges are propositions. Truth and falsity are a matter of what could tell for and against a claim, so a global hinge, which can have nothing telling for or against it, is neither true nor false; global hinges are therefore rules, as some commentators hold, and the rule reading is right for them. Local hinges, by contrast, are ordinary propositions that happen to be doing hinge-work inside a particular enquiry. The taxonomy thus yields a principled pluralism: "Are hinges beliefs?" has two answers, and the disagreement between the rule reading and the propositional reading dissolves once we see that each side has a different range of cases in view.
  >
  > An objection is that this makes certainty too cheap: anything I refuse to examine would come out exempt. The framework blocks this, because exemption is fixed by the role a claim plays in a practice, not by my attitude toward it. Stubbornness does not manufacture hinges.

  Mark scheme: 6 marks for the classification and its defence, 8 marks for the argument on exemption and warrant, 4 marks for the handling of an objection, 2 marks for clarity and economy.

  Before you write anything for me, think carefully and work through the answer in a separate block headed **Analysis**, of no more than 350 words: go through it claim by claim, note where a premise is asserted rather than argued, note where a conclusion drawn inside the stipulated framework is then carried across to a question the framework never addressed, and note any place where two parts of the answer pull against each other. That block is for your reasoning only and is not part of the deliverable.

  Then give me the deliverable, in this exact shape:

  1. A single line stating the grade as a number out of 20, with a two-word band (e.g. "solid second-class").
  2. A numbered list of exactly five comments, each one or two sentences long, with no introduction, no summary, and no closing remark of any kind.

  Each comment must name the specific claim or inference it targets — quote the candidate's own words where that is the clearest way to fix the target — and must say whether the move works, fails, or is underdetermined, together with the reason. Write them so that they can be pasted directly into the candidate's feedback, addressed to the candidate rather than to me. Exactly one of the five must be devoted to the single most consequential error in the answer, and must say briefly why it costs more than the others. Do not pad with general encouragement, do not tell me what a model answer would look like in the abstract, do not ask the candidate for sources, and do not penalise or reward positions on the hinge debates as such: grade the reasoning, including where it is genuinely good.
reasoning: |-
  Hmm, the user is a TA needing help grading an exam answer on Wittgenstein's epistemology, specifically about Moore's "Here is a hand" example. They want me to act as an experienced epistemologist who grades strictly within the exam's stipulated taxonomy. The candidate's answer argues that Moore's claim is a local hinge, that exemption and warrant are mutually exclusive, and that this leads to a pluralist view about hinges as propositions.

  I need to evaluate this answer carefully. First, I'll analyze it claim-by-claim in a separate analysis block as requested. The candidate correctly classifies "Here is a hand" as a local hinge using the exam's definitions - it's certain within Moore's lecture demonstration but can be doubted in skeptical enquiries. That part is solid.

  But problems emerge when they argue exemption and warrant are mutually exclusive. They claim that if a proposition is exempt, you can't cite evidence for it without presupposing it, making it unwarranted. And if warranted, it must be doubtable. But the exam definitions don't require this - exemption is about what doubt would do to the practice, while warrant is about whether something can be cited as evidence. These could theoretically coexist, but the candidate asserts mutual exclusivity without justification.

  The most serious error comes when they extend this to truth-values: claiming global hinges can't be true/false because nothing can tell for/against them. But the taxonomy never mentions truth! They've imported external assumptions, violating the instruction to argue strictly within the stipulated framework. This then spawns an unauthorized pluralism about hinge-propositions.

  The objection handling is good though - correctly noting exemption depends on practice-role, not personal attitudes. And the writing is clear throughout.

  For grading: The classification (6 marks) deserves full credit. The exemption/warrant argument (8 marks) has flawed reasoning despite some valid points - I'd give 4/8. The objection handling (4 marks) is perfect. Clarity (2 marks) is excellent. Total 17/20 - a solid first-class mark.

  The five feedback comments should: 1) Praise the correct local hinge classification 2) Note the unsupported mutual exclusivity claim 3) Flag the unauthorized truth-value extension as the major error 4) Acknowledge the good objection response 5) Compliment the clarity. All delivered neutrally, targeting specific phrases.
answer: |-
  ### Analysis
  Candidate correctly classifies "Here is a hand" as a local hinge: Moore’s lecture context presupposes it, but sceptical enquiry doubts it, satisfying the definition. Argument for mutual exclusivity of exemption/warrant is asserted without derivation from stipulations: exemption concerns *doubt’s practical undermining*, warrant concerns *citability of support*; no inherent contradiction shown. Claim that exemption implies no citable evidence conflates *presupposition* with *no support possible*; stipulations don’t entail this. Truth/falsity inference imports external criterion ("what could tell for/against") unsupported by taxonomy, then misapplies it to hinge-status. Pluralism about hinges-as-propositions, while creative, exceeds framework’s scope (taxonomy defines hinges via certainty/doubt roles, not ontology). Objection response is strong, tying exemption to practice-role not attitude. Clarity is exemplary.

  ### Deliverable  
  1. 17/20 (solid first-class)  

  2. 
  - Your classification of "Here is a hand" as a **local hinge** works: you correctly show it is certain in Moore’s lecture-context but doubtable in sceptical enquiry, satisfying the stipulated definition.  
  - Your claim that exemption and warrant are mutually exclusive because "any attempt to cite evidence for p already presupposes p" is **underdetermined**: the stipulations define exemption via doubt’s practical consequences and warrant via citability, but do not entail that presupposition voids citability.  
  - Your inference that global hinges "can have nothing telling for or against [them]" and are therefore "neither true nor false" **fails** as the most consequential error: the taxonomy never addresses truth-conditions, so importing this criterion violates the instruction to argue strictly within stipulated terms, invalidating your pluralist conclusion.  
  - Your reply to the "certainty too cheap" objection works: exemption being fixed by "the role a claim plays in a practice" correctly uses the framework to block arbitrariness.  
  - Your prose is economical and precise throughout, earning full clarity marks; e.g., "Stubbornness does not manufacture hinges" efficiently captures the point.
