          Similarly, for B: maximum uB with uA>=1. The point (2,6) has uA=2>=1 and uB=6. Is there any point with uB>6? No. So the ideal point is (8,6) as before.

          The line from d=(1,1) to (8,6): the slope is (6-1)/(8-1)=5/7. So the line: uB - 1 = (5/7)(uA-1).

