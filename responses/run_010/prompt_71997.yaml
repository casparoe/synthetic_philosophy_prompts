answer: |-
  ## Eulogy for Grandma

  **(Stand at the podium, take a breath, look out at the family, especially Aunt and Dad in front, then begin.)**

  Thank you all for being here. For Grandma, who always appreciated precision, I’ll try to be mindful of the time. She was never one for “about.”

  My grandmother lived 88 years and nine days. She spent 41 of those years behind a bank counter, a steady presence for countless people in this town. After that? She kept the parish books. For twenty more years. With a pencil. Anyone who knew her knows why that detail matters. She didn’t tolerate “about.” If you said you spent “about forty dollars,” she’d likely tell you to go find the receipt. An uneven column? A number that didn’t quite square? She’d erase the whole page and start again. Accuracy mattered. Clarity mattered. The right number, in the right place. That was her.

  It feels impossible, then, to talk about her final years without that same pencil in mind. Because dementia… it doesn’t erase cleanly. It doesn’t operate on her terms. It was gradual, like a slow shift in the light, making familiar things harder to see clearly. We saw it early, in the thing she cherished most: precision. The numbers went first. The thread of a sentence would unravel after just a few words, leaving her visibly frustrated, stranded mid-thought. That sharp mind, that demanded exactness, found itself in a world growing steadily… less exact.

  For the past several years, the vibrant woman who ran the numbers, who told sharp stories, who demanded receipts, wasn’t quite there in the same way. Names faded. Conversations became landscapes we couldn’t always navigate together. My aunt found a way through that loss by saying Mum had “left in 2019,” that we were tending an empty house. And that thought gave her comfort, a way to hold onto the essence of who her mother truly was. My dad, he held fiercely to every sign, every flicker. The way her eyes might soften if the sun hit the window just so. The way she’d hum, faintly, almost instinctively, if someone started singing an old hymn near her chair. Most of all, the way her hand would still find yours, and *squeeze back* if you held it. To him, she was undeniably *there*, inhabiting that house until the very last Tuesday.

  And here’s what I learned, holding her hand in those quiet moments, watching the struggle on her face when the words wouldn’t line up, hearing that soft hum: Both of those truths coexist. Not as halves of an argument, but as facets of a reality that defied simple labels.

  Think of her pencil. Think of how she’d erase a whole page rather than force a fit or round a corner. Dementia wasn’t like that. It didn’t give her the clean erasure she deserved. It blurred lines. It softened edges. It made defining the exact moment the person inside became unreachable as impossible as counting grains of sand one by one and declaring precisely when a pile stops being a pile.

  The vibrant teller, the meticulous bookkeeper, the woman who wouldn’t accept “about” – that fierce spirit *did* recede, like a tide going out over years, not days. We mourned that departure long before Tuesday. We felt the space where her sharp wit and certainty used to be.

  But the hum? The hand squeezing back? The quiet recognition in a fleeting glance? That was her too. Not the whole her, perhaps, but a core. A presence. Proof that the house wasn’t entirely empty. That something essential remained, communicating in a language beyond words, right up until the end. A language of touch, of shared sound, of simply being present beside her.

  So, we aren’t just mourning the vibrant woman who left us gradually over these past years. We are also mourning the quiet, persistent presence who left us last Tuesday. We held her hand through both departures.

  Grandma lived by precision. Her death asks us to hold space for something less definable. To honour the brilliant, exacting woman she was for eight decades. And to equally honour the profound, wordless connection that endured, even as everything else faded. To acknowledge the empty spaces *and* the fact that she was, somehow, still home.

  Her legacy isn't just in the balanced books or the sharp memories. It's in the reminder she gave us at the end: that connection, even when stripped of words or names, is real. That a held hand speaks volumes. That a hum can be a lifeline. That presence, in whatever form it takes, matters deeply.

  Thank you, Grandma, for the precision, for the pencil, for the squeeze, for the hum. Thank you for teaching us that some things – the most important things – exist beyond the neat columns and the sharp edges. We will miss every version of you. We will carry you forward, not in the rounding off, but in the trying, in the holding on, in the small acts of attention you valued so much. Whatever we believe comes next, I hope it has perfectly balanced columns and crisp receipts. And maybe a familiar song.

  Thank you.
