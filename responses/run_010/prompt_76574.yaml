answer: |-
  Regulationism about phenomenal concepts explains the key motivations for illusionism while remaining metaphysically neutral about the existence of phenomenal properties.

  1.  **Incorrigibility without privileged access:** Sincere pain reports are incorrigible under regulationism because the correctness condition of the concept "pain" is defined by its triggering role within the subject's self-regulatory system (e.g., triggering withdrawal, distress, attention). A sincere report manifests that the concept has been activated according to its regulatory role. There is no further "private object" it must accurately represent. A "mistake" would require a regulatory failure – the concept activating *despite* not fulfilling its defined role (e.g., reporting pain without triggering any aversive responses or attentional shifts). Such failures are conceptually ruled out by the regulationist definition of correctness; the sincere report *just is* the evidence that the regulatory role is being fulfilled in that moment, making the report self-verifying within the system.

  2.  **The resistant zombie intuition:** The zombie intuition persists because we struggle to conceive of a system executing the *exact same* high-level self-regulatory functions (attentional allocation, aversive control, self-directed inference) without deploying phenomenal concepts. Our cognitive architecture ties the subjective "feel" of regulation tightly to the concepts employed in that regulation. We cannot introspectively "see past" the phenomenal concepts to the underlying regulatory mechanisms they implement. This resistance stems from a *conceptual* or *cognitive* limitation – our inability to imagine the regulatory work being done while subtracting the specific phenomenal mode of presentation – not from insight into metaphysical possibility. The intuition's strength is poor evidence for the metaphysical possibility of zombies because it confuses a failure of imagination with a genuine insight into the structure of reality; regulationism shows the same regulatory functions define the concepts, making their absence in a functional duplicate inconceivable *to us*, but not necessarily metaphysically impossible (though regulationism itself doesn't entail zombies are possible).

  3.  **Relocating the explanatory gap:** The explanatory gap survives regulationism but is relocated. For a subject accepting regulationism, the gap is no longer "How can physical processes *be* or *produce* this phenomenal property (e.g., redness)?" It becomes: "Why does *this specific regulatory role* (e.g., guiding attention to spectral reflectance properties, integrating with memory and emotion systems in a particular way) necessitate the deployment of *this specific phenomenal concept* (e.g., 'what it's like to see red') with its unique subjective character?" This gap concerns the implementation of the regulatory system: why does the system generate *this* introspectively accessible qualitative character as part of fulfilling *this* functional role? This gap is not a threat to physicalism because it is a request for a mechanistic explanation of *how* a physical system implements concepts with specific subjective feels as part of its regulatory architecture. It's a gap about the contingent design and operation of the cognitive system, not about bridging fundamentally distinct ontological categories. Physicalism only requires that the implementing mechanisms are physical, not that the connection between functional role and subjective concept is *a priori* deducible.

  4.  **Metaphysical neutrality:** Regulationism achieves (1) through (3) without requiring the non-existence of phenomenal properties. It provides a semantic account of phenomenal *concepts* and *reports*: their meaning and correctness are grounded in regulatory role. A realist can fully endorse this semantic account while maintaining that the *states* regulated (e.g., nociceptive states, visual processing states) *also* possess intrinsic phenomenal properties. On this view, the concept "pain" gets its meaning from its role in regulating avoidance, but the state it is applied to *has* the property of being painful. The concept's success is defined by regulation, but the property might nevertheless exist. Conversely, an illusionist adopts regulationism *and* adds the metaphysical claim that the states lack phenomenal properties, and the concepts misrepresent them as having such properties. Regulationism itself only specifies how the concepts work, not the nature of the states they hook into. The genuine disagreement between realists and illusionists lies in the metaphysical question about the properties of the underlying states, not in the semantic account of the concepts provided by regulationism.

  5.  **The surviving residue and its nature:** The residue of the dispute is this: **Do the states regulated by phenomenal concepts possess intrinsic phenomenal properties that play an indispensable *causal/explanatory role* within the self-regulatory system?** The realist says yes: the phenomenal character of the pain state itself contributes causally to driving avoidance behavior, attention, etc. The illusionist says no: the phenomenal character is not a real property of the state; only the non-phenomenal properties (neural, functional) play the causal role, and the phenomenal concept misrepresents these as phenomenal. This residue is **substantive**, not merely verbal. It concerns the causal structure of the mind: whether phenomenal properties, if they exist, are causally potent components of the regulatory mechanisms, or whether they are epiphenomenal (real but causally inert) or eliminable (non-existent). Regulationism defines the concepts, but it doesn't settle whether the properties those concepts purport to pick out actually exist and are causally efficacious within the system they regulate.

  **Answering the Strongest Realist Objection:**

  **Objection:** "Even granting regulationism about the *concept*, the state being regulated – the nociceptive state, for example – *has* an intrinsic phenomenal character (painfulness). It is *this character* that the regulatory system is responding to and that explains the aversive behavior and attentional shifts. The regulatory role of the concept depends on the presence of this real phenomenal property in the target state."

  **Response:** Regulationism explains how the regulatory system operates *without needing* the phenomenal character to play the causal role. The regulatory system is responsive to the *non-phenomenal* properties of the state (e.g., specific neural firing patterns, information content about tissue damage, intensity signals). The system evolved, or was designed, to deploy the phenomenal concept "pain" *when* certain non-phenomenal conditions (specified by the regulatory role: threat level, need for attention, potential behavioral disruption) are met. The deployment of the concept, with its attendant introspective feeling, *is part of the regulatory mechanism* itself – it focuses attention, motivates avoidance, etc. Crucially, the *explanatory work* of causing avoidance behavior and attentional shifts is done by the system detecting the non-phenomenal properties and triggering the regulatory response, *which includes applying the phenomenal concept*. The feeling of painfulness isn't an extra *cause* on top of this; it *is* (or is constituted by) the subject's access to the regulatory process via the phenomenal concept. The realist posits a phenomenal property *in addition to* the non-phenomenal properties and the regulatory mechanism. Regulationism shows how the system functions completely by responding to non-phenomenal properties and deploying concepts with regulatory roles. Attributing causal efficacy to a further phenomenal property is explanatorily redundant; the regulatory work is fully accounted for by the non-phenomenal properties and the functional role of the concept. The feeling *is* the concept's mode of presentation of the regulatory engagement, not evidence of an additional causal property being regulated.
