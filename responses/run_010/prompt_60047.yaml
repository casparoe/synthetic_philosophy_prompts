prompt: |-
  You are a political philosopher who works on bargaining, compromise, and value pluralism, and who has also spent several years drafting contract specifications and client offering documents for a derivatives clearinghouse. Treat what follows as a serious piece of comic writing: think carefully, plan before you draft, and do not settle for jokes that only require a general sense that "finance is soulless."

  **The assignment.** Write a parody product document: the public offering summary and contract specifications for a cleared futures product on moral compromise, issued by an invented exchange — call it the Concessions Exchange (CX), with a clearing arm if you want one. The document is entirely sincere. Its premise is the one people actually invoke when they defend compromise between rival value systems: that when two parties hold incompatible commitments, a negotiated exchange can leave both better off than a contest that runs to a decision, and that treating this as a market merely makes visible the gains from trade that are already there. Your job is to let that premise do its work in the flat, unbothered prose of a rulebook until the reader notices what it has committed to.

  **Required sections.** Produce a numbered document with decimal sub-clauses covering at least the following:

  1. Product description and stated purpose, including the exchange's rationale for offering the contract at all.
  2. Deliverable grade and standardization — the unit in which a concession is measured, what makes one concession substitutable for another, and the certification a commitment must obtain before it can be delivered.
  3. Eligibility and proof of title, including the treatment of commitments held jointly with a community, party, congregation, or household, and the resulting consent and holdout problem; a schedule of haircuts by class of commitment is welcome.
  4. Settlement: physical delivery of an actual change of position versus cash settlement in lieu of it, and the exchange's own reporting on which method members overwhelmingly prefer and why.
  5. Counterparty rules, including the exchange's neutrality as to the content of the commitments traded and a know-your-counterparty section.
  6. Persons who are not party to the contract but on whom a delivered concession falls, and what, if anything, the exchange does about them.
  7. Obligations that survive settlement and are expressly excluded from netting.
  8. Round-trip trading: the sale of a position and its later repurchase.
  9. A closing block of Important Risk Information in the standard flat voice of a disclosure.

  Somewhere in the document there should also be an index product — a diversified basket of small concessions, periodically rebalanced — described in two or three sentences.

  **Conceptual payloads.** Each of the following must be enacted by the mechanics of the contract rather than stated as an objection. A reader who works on the ethics of compromise should recognize all six; a reader who does not should still find the document funny and slightly unsettling.

  - Clearing a trade in values presupposes a common scale, so the qualifying "difference of value systems" turns out, under the exchange's own eligibility rules, to be a difference of weights on a single scale.
  - A concession extracted from a third party is still, for settlement purposes, delivered by the seller.
  - A commitment can be bought back without being restored; the repurchased unit is fungible and the original was not.
  - The worry that some commitments are damaged by being priced at all appears nowhere except as a representation and warranty in which the seller affirms that it has authority to make the trade.
  - Regret, apology, and the duty to revisit the settlement survive termination and are defined as Residual Positions that cannot be closed out.
  - The exchange's neutrality as to content is asserted with total confidence in the same document whose every clause is about content.

  **Style and constraints.** Deadpan throughout: institutional-legalese sentences that are grammatically ordinary, bureaucratically bland, and free of adjectives doing comedic work. No winking, no authorial asides, no exclamation points, no character breaks, and no place where the document admits it is being ironic. Capitalize and use consistently a small set of defined terms of your own invention. At least one clause must be so plainly reasonable in market terms that the reader has to supply the moral shock themselves. Do not use any of the following words anywhere in the document: incommensurable, commensurable, corruption, integrity, complicity, dirty hands, residue, intrinsic, dignity, sanctity, repugnant. No philosopher may be named, and no argument may be named as an argument.

  Do not use real exchanges, clearinghouses, tickers, statutes, firms, or living people. No citations, no bibliography, no footnotes pointing at real literature — anything you need must be invented or already common knowledge. American English. The document proper should run roughly 900 to 1,100 words.

  **Output, in this order.**

  - *Step 1 — scaffolding.* A correspondence table of no more than ten rows with three columns: the market mechanism you are using; the feature of moral compromise it stands in for; and what the mechanism presupposes that the feature may not supply. Keep it terse. This is a planning artifact, so make it genuinely diagnostic rather than decorative.
  - *Step 2 — the piece.* The offering document itself.
  - *Step 3 — postscript, clearly marked as outside the fiction.* In 150 to 250 words addressed to me: where the market framing actually earns its keep in thinking about compromise between value systems, where it collapses under load, and whether the collapse tells us something about the metaphor or something about compromise. If the gains-from-trade story survives in some restricted domain, say which one and why.

  Before you submit, audit your own draft: check that none of the banned vocabulary slipped in, that every one of the six payloads is carried by a clause rather than by commentary, and that a specialist would find the exaggeration faithful to the position rather than a straw man of it.
reasoning: |-
  Okay, the user wants me to create a parody financial product document for a futures contract on moral compromise. They've provided very specific requirements: I need to write this as a political philosopher with experience in derivatives clearing, using deadpan institutional language without any overt jokes. 

  First I need to understand the core assignment. It's about creating a futures contract where moral concessions are traded, with the premise that compromise between value systems creates gains like trade in markets. The humor should come from taking this economic analogy to its logical extreme in bureaucratic language. 

  The user specified eight required sections for the document, plus six conceptual payloads that must be embedded in the contract mechanics rather than stated directly. I'll need to map each payload to specific clauses. For example:
  - The common scale requirement will appear in the deliverable grade section
  - Third-party concessions will be handled in counterparty rules
  - Buyback mechanics will show how repurchased commitments lose uniqueness

  For the scaffolding step, I consider how market mechanisms correspond to compromise elements and what gets presupposed:
  - Standardization presupposes fungibility of commitments
  - Haircuts presuppose quantifiable commitment strength
  - Cash settlement presupposes equivalence between moral and monetary value

  The document itself must avoid banned words like "incommensurable" or "dignity" while maintaining absolute seriousness. I'll invent terms like "Certified Commitment Unit" and "Residual Positions" to create the institutional feel. 

  The risk disclosure section will be key for delivering payloads subtly - noting that concessions may cause "reputational shifts" or that "community holdouts" may occur. 

  For the postscript, I'll analyze where the market metaphor holds (simple resource conflicts) versus fails (core identity commitments), and suggest the collapse reveals limits of reductionism in moral reasoning.

  Throughout, I'll maintain American English, avoid real-world references, and keep the tone flat and procedural. The challenge is making the moral absurdity self-evident through purely technical descriptions.
answer: |-
  ### Step 1: Scaffolding

  | Market Mechanism             | Stands In For                                | Presupposition Not Necessarily Supplied        |
  | :--------------------------- | :------------------------------------------ | :-------------------------------------------- |
  | Standardized Deliverable     | Unit of moral concession                    | Fungibility of commitments; common value scale |
  | Haircut Schedule             | Weakening of commitment strength            | Quantifiable, linear "strength" metric        |
  | Cash Settlement Option       | Avoiding actual change of position          | Equivalence of moral concession & monetary value |
  | Title Verification           | Sole, unambiguous ownership of commitment   | Individual autonomy over shared/embedded values |
  | Fungibility upon Repurchase  | Buying back "the same" position             | Identifiability/restorability of commitments  |
  | Residual Positions (non-nettable) | Ongoing moral obligations (regret, duty) | Separability of the act from its moral residue |
  | KYC Rules                    | Moral complicity in trading partner's acts  | Content-neutrality absolves participation     |
  | Basket Index Product         | Diversified, low-stakes compromise          | Aggregation dilutes moral significance        |
  | Physical Delivery Reporting  | Preference for symbolic over real concession | Moral equivalence of symbol and substance    |
  | Representation & Warranty    | Authority to trade the commitment           | Absence of corruption by pricing/marketization |

  ### Step 2: The Piece

  **CONCESSIONS EXCHANGE (CX)**
  **CLEARED FUTURES CONTRACT SPECIFICATIONS: CX MORAL COMPROMISE CONTRACT (CX-MCC)**
  **Product Code: MCC**

  **1. Product Description and Purpose**
  1.1. The CX Moral Compromise Contract (MCC) is a standardized agreement for the future delivery of a Certified Commitment Unit (CCU) representing a concession of position on a specified matter of principle.
  1.2. The purpose of the MCC is to facilitate efficient resolution of differences where mutually exclusive commitments create suboptimal conflict outcomes.
  1.3. CX offers the MCC to realize gains from negotiated exchange that may exceed the expected value of conflict resolution for both parties, thereby enhancing social welfare through predictable pricing and centralized clearing.

  **2. Deliverable Grade and Standardization**
  2.1. The unit of delivery is one (1) Certified Commitment Unit (CCU). One CCU represents a quantifiable shift from a previously asserted, verifiable position on a Defined Matter of Principle (DMP).
  2.2. To be deliverable, a CCU must be:
      2.2.1. Certified by a CX-approved Commitment Auditor (CA) against the relevant DMP Schedule (Schedule DMP-1).
      2.2.2. Assigned a Standard Commitment Strength (SCS) rating between 0.1 (Weakly Held) and 1.0 (Core Tenet) per CX SCS Methodology (Appendix SCSSM).
      2.2.3. Fungible within its designated DMP Class (e.g., DMP-C: Cultural Norms; DMP-E: Economic Policy; DMP-R: Religious Doctrine). CCUs within the same DMP Class and SCS band (±0.1) are fully substitutable for delivery.
  2.3. Certification requires documented proof of the Original Asserted Position (OAP) and a binding statement of the New Adopted Position (NAP), measured as the minimum permissible shift per Schedule DMP-1.

  **3. Eligibility and Proof of Title**
  3.1. Eligible Sellers must demonstrate clear, unencumbered title to the Commitment being conceded.
  3.2. Commitments held jointly (e.g., by political parties, religious congregations, households) require:
      3.2.1. A Governance Certificate (Form GC-7) proving the Seller's authority to bind the group to the concession, OR
      3.2.2. An Individual Severance Affidavit (Form ISA-2) proving the commitment is separable from the group holding.
  3.3. A Holdout Adjustment Factor (HAF), or "haircut", is applied to the SCS of delivered CCUs to account for dissent within the Seller's group:
      3.3.1. HAF = 1 - (Percentage of Group Expressing Dissent * 0.7). E.g., 20% dissent → HAF = 0.86.
      3.3.2. Haircuts are applied post-certification. The delivered CCU's effective SCS = Certified SCS * HAF.

  **4. Settlement**
  4.1. Settlement occurs via Physical Delivery (PD) or Cash Settlement (CS).
      4.1.1. PD: Seller delivers a notarized Concession Deed (Form CD-9) documenting the NAP, registered with the CX Commitment Registry.
      4.1.2. CS: Seller pays Buyer the Final Settlement Value (FSV) determined by the CX Settlement Price on the last trading day.
  4.2. Member preference data (CX Annual Report 2024): 92% elect Cash Settlement. Primary cited reasons: Irreversibility concerns (PD: 67%), Transactional efficiency (CS: 89%), Avoidance of public documentation (PD: 58%).

  **5. Counterparty Rules**
  5.1. CX maintains strict neutrality regarding the content, origin, or moral valence of any DMP or CCU traded.
  5.2. Know Your Counterparty (KYC) Requirements:
      5.2.1. Members must verify the counterparty's eligibility to hold the specific DMP Class being traded (e.g., verification of relevant affiliation for DMP-R).
      5.2.2. Members are solely responsible for assessing the implications of receiving a concession from, or delivering one to, a specific counterparty. CX disclaims all liability for reputational or associative consequences.

  **6. Third-Party Impact**
  6.1. Concessions delivered may impact persons or entities not party to the contract (Affected Third Parties - ATPs).
  6.2. The Seller warrants that delivery of the CCU complies with all applicable laws regarding ATP rights.
  6.3. CX assumes no obligation to ATPs. Disputes involving ATPs are solely between the contracting parties and such ATPs. ATPs have no standing before CX Dispute Resolution.

  **7. Surviving Obligations and Netting Exclusion**
  7.1. Certain obligations survive contract settlement and are designated Residual Positions (RPs):
      7.1.1. Regret Clauses: Public or private expressions of Seller remorse related to the concession.
      7.1.2. Apology Obligations: Stipulated duties to express regret to ATPs.
      7.1.3. Revisit Duties: Contractual obligations to reconsider the NAP within a specified timeframe.
  7.2. RPs are expressly non-nettable and cannot be closed out via offsetting trades. They remain the sole responsibility of the originating party per the underlying concession agreement.

  **8. Round-Trip Trading**
  8.1. A Seller may repurchase a CCU of equivalent DMP Class and SCS rating.
  8.2. The repurchased CCU constitutes a new Certified Commitment Unit reflecting the *current* NAP, not a restoration of the original OAP.
  8.3. The original concession remains a matter of record in the CX Commitment Registry.

  **9. CX Compromise Index (CX-CI)**
  9.1. The CX Compromise Index (Ticker: CXCI) is a basket of CCUs representing small concessions (SCS ≤ 0.3) across diverse DMP Classes (min. 15 classes).
  9.2. The index is rebalanced quarterly to maintain diversification and target low average SCS (≤ 0.25), providing exposure to diffuse, low-intensity compromise activity.

  **10. Important Risk Information**
  *   **CCU Value Volatility:** The market value of a CCU can fluctuate significantly based on perceived shifts in social consensus, political pressure, or revelation of undisclosed ATP impacts.
  *   **Title Risk:** Disputes over the validity of Commitment Severance (Sec. 3.2) or Governance Certificates may invalidate delivery, leading to contract default.
  *   **Settlement Method Risk:** Cash Settlement finality does not eliminate potential reputational or relational impacts associated with the underlying concession. Physical Delivery creates a permanent public record.
  *   **Residual Position Risk:** Surviving obligations (Sec. 7) may impose ongoing costs or liabilities not reflected in the CCU's market price.
  *   **Fungibility Risk:** While CCUs within DMP/SCS bands are contractually fungible, the subjective experience or ATP impact of specific concessions may differ materially.
  *   **Counterparty Association Risk:** Trading with certain counterparties may result in reputational harm irrespective of the DMP content. KYC diligence is critical.
  *   **Index Tracking Error:** The CX-CI may not accurately reflect the performance of a specific compromise strategy due to diversification and rebalancing.
  *   **No Guarantee of Mutual Gain:** While the contract facilitates exchange, CX does not warrant that any trade will result in a mutually beneficial outcome or net social welfare increase. Past performance is not indicative of future results.

  ---

  ### Step 3: Postscript

  The market framing earns its keep by rigorously modeling the *structure* of compromise as a potential Pareto improvement: identifying scenarios where mutual concession leaves both parties subjectively better off than conflict, akin to trading surplus. It usefully highlights transaction costs (holdouts, verification), liquidity preferences (cash vs. physical settlement), and the challenge of aggregating diffuse commitments (the index). This holds genuine analytical power in domains of *resource allocation under conflicting preferences*, like budget negotiations or zoning disputes, where values are largely instrumental and trade-offs are quantifiable.

  The collapse occurs when confronting *constitutive commitments* – beliefs or identities where the act of trading itself violates a core tenet (e.g., selling a vote, compromising a sacred vow). The presuppositions revealed by the scaffolding (fungibility, quantification, alienation) are precisely what these commitments reject. The mechanism treating "regret" as a non-nettable residual (Sec 7.1.1) inadvertently highlights this: it acknowledges an ineradicable moral residue *caused by the act of marketization*, even while the contract disclaims it (Sec 6.3). The failure isn't just of the metaphor; it reveals a limit of the gains-from-trade rationale itself. Compromise involving constitutive values isn't merely a costly exchange; it can be an existential threat to the values being weighed, making the "gain" incoherent from within the compromised position. The document's sincere neutrality (Sec 5.1) alongside its content-managing rules (Sec 2.2, Sec 3.3) enacts this tension perfectly: the form demands content-agnosticism while the substance requires constant, invasive content-management. The collapse tells us that while trade is a powerful model for *some* compromises, it fundamentally misdescribes others by presupposing the alienability and scalability it claims merely to facilitate.
