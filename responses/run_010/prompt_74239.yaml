  - end_words: the six, in the order they close stanza one
  - rotation: seven strings, one per stanza plus the envoi, each listing the end-words in the order they actually appear, so I can check you against the pattern
  - turn: an object with stanza, line (numbered within the stanza), and what_turns
  - arithmetic: an object with prior, given_first_heads, given_first_tails (as point values or intervals) and why_the_prior_is_sharp (one sentence)
  - banned_words_used: array, should be empty, be honest
  - one_line_defence: how you'd answer a reviewer who claims you've botched the dilation example
