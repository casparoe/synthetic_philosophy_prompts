  I want an epigraph for that chapter: a sestina. The form is the argument — six end-words that keep coming back in a rotated order and never sit still, which is exactly what it feels like to hold a whole committee of runs instead of a single figure, and the envoi crams all six into three lines like somebody finally demanding a point estimate.

  The content has to be dilation, and I want it right, not just name-checked. Here's the case she works through — stick to it:

  - two tosses. Either the same fair coin tossed twice (independent), or one double-headed and one double-tailed coin tossed in an order she isn't told (perfectly anti-correlated). She doesn't know which arrangement she's in and her credal set keeps both.
  - H = the second toss lands heads. E = the first toss lands heads.
  - Both arrangements give P(H) = 1/2, and so does any mixture of them, so beforehand her belief about the second toss is a sharp point — one half, no interval at all.
  - But given E, the independent arrangement still says 1/2 while the anti-correlated one says 0, so her posterior spreads across [0, 1/2]. Given not-E it spreads across [1/2, 1]. Learning the first toss can only make her less sure of the second, and she knows that before she looks.

  Constraints:

  - the six end-words are exactly these, closing the lines of stanza one in this order: half, coin, learn, order, wide, sure. Then the standard rotation from there (615243 and so on), and the envoi takes all six — split them between mid-line and line-end however you like.
  - 39 lines, six sestets and a tercet.
  - banned from the poem: probability, Bayes, Bayesian, statistics, model, data, uncertainty. A lay reader should get a poem about a woman and two coins and feel the floor go; a stats person should read the same lines and be able to check the arithmetic off, line by line.
  - the turn is the moment the reading arrives and the sharp half splits open. Put it wherever a sestina can carry it and tell me where in the JSON.
  - dont rescue her in the envoi. No learning-to-live-with-not-knowing, no uplift, and no shrug about ambiguity being the human condition either. The interval is the honest state and the poem should end inside it.
  - no doggerel escapes: if a line only scans because you've wrenched one of the end-words into a usage it can't bear, fix the line.

