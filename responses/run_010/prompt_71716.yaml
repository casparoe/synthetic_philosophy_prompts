answer: |-
  Here's a conceptual dissection of your framework, treating it as the distinct position you intend. I'll address your three points sequentially, cutting through to the philosophical terrain without lit-review baggage.

  ### 1. **Is Assertoric Encroachment a Third Thing?**
     - **Pragmatic Encroachment (PE)**: Stakes directly modify the *knowledge relation itself*. What constitutes sufficient evidence/justification for S to know *p* shifts with *S's practical stakes*. Knowledge is inherently stakes-sensitive.
     - **Contextualism (EC)**: Stakes modify the *semantic content* of "knows." The truth-conditions of "S knows *p*" shift with the *ascriber's* conversational context/stakes. Knowledge attributions are context-sensitive.
     - **Your View (Assertoric Encroachment)**:
       - **Knowledge**: *Unaffected* by stakes. Fixed entirely by S's evidence/justification relative to truth. Purely epistemic.
       - **"Knows"**: *Not context-sensitive*. Refers invariantly to the purely epistemic state.
       - **Assertion**: Propriety conditions are *stakes-sensitive*. The epistemic threshold for *properly asserting p* depends on *what's at stake in the assertion's context* (typically the listener's stakes).
     - **Verdict**: **Genuinely a third thing**. PE alters knowledge; EC alters "knows"; you alter *assertion norms* while leaving knowledge and "knows" invariant. You relocate stakes-sensitivity from metaphysics (PE) or semantics (EC) to *pragmatics* (speech-act norms).

  ### 2. **Objections: Transference, Deflection, and the Big Problem**
     - **PE Objections**:
       - *Non-mental state*: **Deflected**. Knowledge remains purely evidence-based. Stakes affect *action* (assertion), not the mental state.
       - *Instability*: **Deflected (mostly)**. Knowledge is stable; only *assertion propriety* shifts with context. (But see "whose stakes" below).
     - **EC Objections**:
       - *Changing the subject*: **Deflected**. You're analyzing knowledge itself, not just "knows." "Knows" tracks invariant knowledge.
       - *Disagreement/Retraction*: **Likely deflected**. If two people say "S knows p" in different contexts, they can both speak truly (unlike EC) since "knows" is invariant. Retraction issues vanish.
     - **The Big Problem: The Knowledge Norm of Assertion (KNA)**:
       - **The Threat**: If assertion is governed by KNA ("Assert *p* only if you know *p*"), stakes-sensitive assertion propriety *entails* stakes-sensitive knowledge. This collapses your view into PE.
       - **Your Required Move**: **You must reject KNA**. Your norm is something like:  
         *"Assert p only if your epistemic position with respect to p is sufficiently strong **for the stakes of the assertion context**."*
       - **Cost Analysis**:
         - *Cost*: Losing KNA sacrifices theoretical unity and a powerful explanation of assertion's distinctiveness. You need an alternative account of why assertion demands *stronger warrant* than, say, supposition.
         - *Mitigation/Gain*: You retain KNA's core insight that assertion requires *robust epistemic commitment*, but make the robustness *contextually calibrated*. The view remains attractive because:
           1. It explains *impropriety without ignorance* (the doctor *knows* but *shouldn't assert*).
           2. It avoids PE's metaphysical oddity and EC's semantic baggage.
           3. It aligns with intuitions about *responsibility in communication*: asserting to high-stakes listeners demands extra caution, regardless of your knowledge.

  ### 3. **The "Whose Stakes?" Fork and the Doctor Case**
     The doctor knows *p* (prognosis). Her personal stakes are low; the family's stakes are high. Can she properly assert *p*?
     - **Horn 1: Indexical (Contextual) Stakes-Sensitivity**  
       *The relevant stakes are determined by the context of the asserter (doctor) at the time of assertion.*  
       - Prediction: If the doctor's context includes awareness of the family's high stakes, propriety demands *very strong evidence* to assert. Even with knowledge, asserting baldly ("He has 6 months") is improper. She must hedge or contextualize ("The tests indicate... but we should discuss implications").
       - Parallel to EC: Resembles "subject-sensitive" contextualism, where the *asserter's* context sets standards.
       - Cost for You: Risks collapsing into a *pragmatic* variant of EC if "proper assertion" becomes the *only* access point to evaluating epistemic states in practice. Also, why should the *doctor's awareness* of others' stakes affect propriety if knowledge is fixed?
     - **Horn 2: Non-Indexical (Audience-Relative) Stakes-Sensitivity**  
       *The relevant stakes are intrinsically those of the audience (the family), regardless of the asserter's context.*  
       - Prediction: Asserting *p* baldly is *always improper* to the high-stakes family, even if the doctor is oblivious to their stakes or asserts from a low-stakes context. Propriety is listener-centric.
       - Parallel to PE: Resembles "impurist" views where truth-relevant factors (here, listener stakes) external to the speaker's mind govern norms.
       - Cost for You: **The Cost You Can Least Afford: Stability & Accessibility**.  
         - Propriety becomes *radically unstable and unknowable*. The doctor cannot know if her assertion is proper unless she perfectly gauges *every listener's stakes* (including eavesdroppers!).
         - It severs the speaker's control over proper speech acts. A well-intentioned, evidence-based assertion could be *retroactively improper* if a high-stakes listener overhears it.
         - **This is likely fatal**. It makes propriety unmanageable and divorces it from the speaker's epistemic responsibility.

  ### **Recommendation & Coherence Check**
  - **Coherence**: Not incoherent. It's a defensible, novel relocation of stakes-sensitivity. The core move (decoupling knowledge from assertion propriety) is sound *if* you reject KNA.
  - **Critical Choice**: **You must pick Horn 1 (Indexical)**. Horn 2 is untenable for your view. Ground propriety in the *asserter's reasonable understanding of the context they are entering*, not the audience's actual stakes. This preserves speaker responsibility and accessibility.
  - **Doctor Case Resolution (Horn 1)**: The doctor knows *p*. Asserting *p* flatly is improper *because she is in a high-stakes context (the family consultation)*, which demands heightened epistemic care. She can properly communicate her knowledge with appropriate hedging/contextualization. Knowledge remains stable; propriety is context-managed.
  - **Wobbly Fix**: Anchor assertion propriety to *the normative context the speaker intentionally enters*, not raw listener stakes. This avoids Horn 2's chaos while explaining why the doctor must adapt her assertion to the family's stakes *as part of her professional duty*.

  **Your View in a Nutshell**: Knowledge is invariant and purely epistemic; "knows" is invariant; assertion propriety is a pragmatically-governed norm demanding evidence proportional to the *contextually apparent stakes of the communicative situation*. PE and EC err by letting stakes infect epistemology or semantics; you quarantine stakes to pragmatics. The cost is dethroning KNA and carefully delimiting "whose context matters." **This is a third way—own it.** Defend the relocation as a feature, not a bug.
