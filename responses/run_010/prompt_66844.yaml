  First, I need to unpack their analogy to statistical physics. They're comparing ethical ends to equilibrium states in dynamical systems. In physics, equilibrium is reached through dynamic processes, not predefined states. Similarly, they think ethics should emerge from a reflective process. Their concerns are classic dynamical systems issues: convergence, uniqueness, basin dependence, and definition problems. Plus, the idealization's circularity and identity change.

