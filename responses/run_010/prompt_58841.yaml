prompt: |-
  ok so I'm a junior double-majoring in CS and philosophy, and this term I'm in a philosophy-of-AI seminar where the midterm isn't a paper, it's that each of us has to run an outreach session for some non-philosophy group on campus. I got assigned the robotics club: 35 minutes, a whiteboard, and their competition bot sitting on the table the whole time. My topic is the frame problem, and honestly I think I understand it fine but I have no idea how to teach it to these people.

  The audience is like 20 second-years who've done a planning pset where they wrote frame axioms by hand and then used a library that auto-generates them for a bigger domain. The club president has already told everybody the frame problem is basically "you have to write a pile of non-effect axioms and it's tedious, so tools do it for you now, it's a solved thing." And I'd bet money at least a few of them will say something like a big language model obviously handles this, since it knows pushing a cart moves the stuff on the cart.

  So: don't explain the frame problem to me, I want a plan for how to explain it. Specifically —

  What has to come first and what depends on what. I'm pretty sure you can't get from "writing axioms is annoying" to the version that actually keeps philosophers up at night without some intermediate step, and I don't know what that step is or where in the sequence it goes. Lay out the order and justify each dependency.

  Which example carries the whole thing. The robot on the table, Dennett's story about the robots sent in to get their battery out of a room with a time bomb in it, or something I haven't thought of? And what does the carrying example have to have, and definitly not have, for the point to survive contact with engineers who will immediately try to debug it?

  The misconceptions. I'm expecting "it's a compute problem, a faster chip fixes it," "learned representations / probability already absorb it," "that's engineering, not philosophy," and maybe the opposite failure where they go "so AI is impossible and you proved it." Which of those are actually pre-existing and which are reactions to a step I haven't taken yet, and exactly where in the sequence I head each one off.

  What one thing I should flatly refuse to cover at this level, and say out loud that I'm refusing.

  And a single question I can ask at the end — with their robot right there — that would tell me whether they actually got the relevance thing or just learned to nod politely at a philosophy student.
reasoning: |-
  Okay, the user is a junior double-major in CS and Philosophy, tasked with teaching the Frame Problem to a robotics club. They need a plan for a 35-minute session with a whiteboard and their competition bot present. The audience has some experience with frame axioms from a planning assignment but likely sees it as a solved engineering issue. The user wants to structure the explanation to bridge from the technical annoyance to the philosophical depth without losing the engineers.

  First, I need to break down the dependencies in explaining the Frame Problem. Starting with the "annoying axioms" is good because the students already relate to that. Then, moving to the computational inefficiency makes sense—they know bigger domains need automation. But the key step is shifting from efficiency to the representational problem. How do you formalize what *doesn't* change? That's where the real challenge lies. The philosophical leap comes when you question whether an agent can even *know* which things remain unchanged without infinite axioms. This connects to epistemology and the limits of symbolic representation.

  Next, choosing the right example. The robot's own bot is tempting, but might be too complex. McCarthy's Suitcase World is better—simple, visual, and no distractions. Dennett's robot story is great for the philosophical implications but might be too narrative-heavy for engineers. Save that for the end to hook them. The suitcase example must avoid any complicating factors like gravity or friction to keep focus on persistence vs. change.

  Misconceptions are a big concern. The club president already dismissed it as a solved issue. So, addressing "it's just engineering" early is crucial. Show that automation doesn't solve the knowledge problem. Then, preempt the "faster chips" and "learned representations" arguments by illustrating the difference between processing power and inherent uncertainty. Also, avoid letting them think it proves AI is impossible—emphasize it's a challenge to overcome.

  What to refuse? Definitely the Symbol Grounding Problem. It's related but a rabbit hole. Mentioning it exists but skipping it keeps focus. 

  Finally, the question. Point to the robot and ask what it would need to know to avoid a specific unexpected change. Their answer should reveal if they grasp the representational issue versus just the automation. If they mention sensors or probability, probe deeper to see if they understand the underlying uncertainty in modeling the world.

  Overall structure: Start relatable, escalate complexity, challenge assumptions, use concrete examples, and end with a practical application. Keep it tight in 35 minutes, using the whiteboard for visuals. The robot on the table is a prop for the final question, not the main example. Need to ensure the philosophical relevance is clear without losing the engineers' interest.
answer: |-
  Here's a battle-tested plan for your robotics club session, designed to bridge the gap from tedious axioms to the philosophical abyss, while keeping engineers engaged and preempting misconceptions:

  **Core Structure & Dependencies (30 mins) - Whiteboard Heavy:**

  1.  **Start with Shared Ground: The Annoyance (3 mins)**
      *   **What:** "Remember your planning PSET? Writing `doorRemainsClosedUnlessOpened`? That tedium *is* the **engineering Frame Problem (FP1)**."
      *   **Example:** Draw a simple state (Robot, Block, Table). Action: `PickUp(Block)`. List effects: `Holding(Block)`, `!OnTable(Block)`. Ask: "What *doesn't* change?" Elicit: Table color, room temperature, Block's weight, Robot's battery (maybe?), etc.
      *   **Why First:** Leverages their direct experience. Establishes FP1 as "Combinatorial Explosion of Frame Axioms."
      *   **Justify:** "You know this pain. Tools solve FP1 *for specific, closed domains* by automating axiom generation."

  2.  **Escalate: The Efficiency Problem (FP2) (5 mins)**
      *   **What:** "Solving FP1 (automating axioms) doesn't solve *reasoning* efficiency. The agent still checks *everything* that *might* have changed, even if it's absurd."
      *   **Example:** Use the same `PickUp(Block)`. Ask: "Does this affect the President's meeting schedule? The price of tea in China? The robot's serial number?" *Obviously not* – but how does the *agent* know that without checking?
      *   **Whiteboard:** Show a branching "Possible Changes" tree after `PickUp(Block)`, including ridiculous options. "The agent must *deduce* irrelevance, or waste cycles checking everything."
      *   **Why Next:** Builds directly on FP1. Shows automation solves the *writing* problem, not the *reasoning* problem. Leads to the core issue.
      *   **Dependency:** FP1 (tedious axioms) is necessary to understand *why* we automate, revealing FP2 (reasoning inefficiency).

  3.  **The Leap: The Representational/Epistemic Problem (FP3) - The Philosophical Core (10 mins)**
      *   **What:** "How can an agent *possibly* represent, in advance or on the fly, *everything* that *doesn't* change in an open world? How does it *know* what's irrelevant?"
      *   **Example (The Crux - McCarthy's Suitcase World):**
          *   Draw a simple room: Robot, Closed Suitcase, Bomb *inside* suitcase, Battery *on top* of closed suitcase. Goal: Save Battery. Action: `MoveSuitcase`.
          *   **Intended Effect:** `Location(Suitcase, NewSpot)`, `Location(Battery, NewSpot)`? (Do they know battery is *on* it?).
          *   **The Trap:** "What *else* changes?" Elicit: Bomb moves too? What if the suitcase was *locked*? What if moving it jostles the bomb? What if the battery *wasn't* securely on top? **CRITICAL:** The problem isn't *just* listing what changes (FP1) or reasoning fast (FP2). It's **fundamentally knowing *which* things persist unchanged *by default* in *this specific, unforeseen context***. The agent must assume the Bomb's state persists (doesn't explode) unless specified otherwise... but how?
      *   **Whiteboard:** Contrast "Closed World" (everything specified) vs. "Open World" (infinite possible interactions/states). Emphasize: **FP3 is the challenge of formalizing 'Relevance' and 'Persistence by Default' in an open, unpredictable world.**
      *   **Why Here & Dependency:** FP1 & FP2 show the practical/algorithmic symptoms. FP3 is the root cause – the **epistemic gap**. You *need* FP1/FP2 to show *why* FP3 is hard and fundamental, not just an engineering tweak. This is what keeps philosophers up.

  4.  **Relevance to Them & Modern AI (7 mins)**
      *   **Their Robot:** Point to it. "Your bot *doesn't* have a complete model of this room. What irrelevant changes *might* it waste time worrying about? Vibrations? Dust motes? Network latency? How does *its* code/ML handle the 'default persistence' assumption?" (Plant the seed for the final question).
      *   **"Solved" by Libraries?** "Libraries handle FP1 (axioms) and *some* FP2 (efficient reasoning) *within their predefined domain*. They *assume* a closed world model. FP3 rears its head when the real world throws curveballs *outside* that model."
      *   **LLMs/Machine Learning?** "LLMs *statistically absorb* patterns of persistence/change from data. This *approximates* relevance but isn't foolproof (hallucinations, brittleness). They don't *logically guarantee* persistence by default; they predict it based on co-occurrence. FP3 becomes the challenge of **robust uncertainty handling & grounding predictions in a dynamic world**."
      *   **Why:** Connects FP3 directly to their project and buzzwords. Preempts "LLMs solve it" and "libraries solved it."

  5.  **The Philosophical Hook (3 mins) - Dennett's Bomb**
      *   **Briefly Tell:** "Philosopher Dan Dennett imagined robots needing to fetch a battery from a room with a ticking bomb. The first robot froze, overwhelmed by calculating if fetching the battery would change the bomb's color, the room's humidity, etc. – **drowning in irrelevant frame axioms (FP2) because it lacked a concept of relevance (FP3)**."
      *   **Punchline:** "FP3 isn't *just* about efficiency. It's about the **fundamental challenge of agency in a complex world**: How can any intelligent system, artificial *or biological*, focus on what matters and ignore the near-infinite sea of irrelevant stability? *That's* the unsolved philosophical core."

  **Misconception Mitigation Strategy:**

  *   **"It's solved / just engineering (FP1)":** Preempted in Step 1 (acknowledge FP1 *is* solved), then shattered in Steps 2 & 3. **Key Phrase:** "Automating the *writing* of axioms solves the symptom (FP1), but not the underlying disease of *knowing relevance* (FP3) in an open world."
  *   **"Faster Chips / More Compute Fixes FP2":** Acknowledge compute helps FP2, but emphasize FP3: "More compute lets you check *more* irrelevant possibilities faster. It doesn't tell you *which* ones to ignore. How do you *know* ignoring the price of tea is safe *this time*?"
  *   **"Learned Representations / Probability Absorb It (LLMs)":** Directly addressed in Step 4. **Key Phrase:** "Learning *statistical approximations* of persistence is powerful, but it's not the same as *logical default reasoning* or *guaranteed relevance*. It can fail unpredictably when the real world deviates from training data – that's FP3 biting back."
  *   **"That's Engineering, Not Philosophy":** Explicitly bridge it: "FP1 & FP2 *are* engineering challenges. FP3 – *how do we formalize relevance and default persistence for agency in an open world?* – is where it becomes fundamental philosophy of mind, knowledge, and AI."
  *   **"So AI is Impossible?":** Shut down fast: **"NO.** FP3 is a profound *challenge*, not a proof of impossibility. It defines a core problem that *different approaches* (logic, probability, learning, hybrid systems) try to tackle. Recognizing FP3 is key to building *robust* AI."

  **What To Refuse & State Out Loud:**

  *   **"We are absolutely NOT diving into the Symbol Grounding Problem today."**
      *   **Why:** It's deeply related (how symbols connect to the world), but it's a massive, separate rabbit hole. Mentioning it exists ("FP3 connects to how symbols *mean* things in the world, but that's another talk!") is enough. Covering it would derail the core FP focus in 35 mins.

  **The Final Question (2 mins - Point at THEIR Robot):**

  > **"Imagine your robot needs to push *that* cart over *there* [gesture]. It knows the cart has wheels and a platform. What's ONE seemingly obvious, persistent property of the cart or its contents *that the robot might dangerously assume 'just stays the same' by default when pushing it... but actually *could* change in a way that ruins your competition run? And *how* would the robot's current approach (logic, sensors, learned models) potentially fail to handle that assumption correctly?"**

  *   **Why it works:**
      1.  **Forces Application:** They have to apply FP3 (relevance/default persistence) to *their* domain.
      2.  **Reveals Understanding:** A good answer identifies a plausible, non-obvious persistence assumption (e.g., "assumes items stacked *stay* stacked unless explicitly modeled friction/jostling," "assumes wheel friction is constant," "assumes the floor's coefficient of friction doesn't change locally") and critiques how their system handles uncertainty about it (e.g., "our path planner assumes static friction," "our vision doesn't model item stability," "we don't have jostle sensors").
      3.  **Goes Beyond Politeness:** Vague answers ("it might break") show they didn't grasp FP3. Specific answers linking an *assumed persistence* to a *potential failure mode* and *system limitation* show deep understanding.
      4.  **Uses Their Bot:** Makes it concrete, relevant, and memorable.

  **Key Carry Example:** **McCarthy's Suitcase World** (Step 3). It wins because:
  *   **Visual & Simple:** Easy to draw/explain.
  *   **Shifts Goalposts:** The "obvious" persistence (bomb location tied to suitcase) *is the problem*.
  *   **Highlights Relevance:** Why *is* the bomb's persistence relevant here? It wasn't in the initial goal!
  *   **Avoids Debugging Traps:** No gravity, friction, or complex physics. The trap is purely *representational/logical* – the failure is in *knowing* what persists by default in *this specific context*.
  *   **Connects to Philosophy:** Directly illustrates the epistemic gap (FP3).

  **Good luck!** Your double-major perspective is perfect for this. Focus on the chain: Tedium (FP1) -> Reasoning Efficiency (FP2) -> The Knowledge Gap (FP3). Use Suitcase World for the leap, their bot for relevance, and that final question to seal it. Be ready to firmly but politely steer away from Symbol Grounding and "AI impossible" claims. You've got this!
