prompt: |-
  For two years I have coordinated intake at a volunteer-run legal clinic, and I have repeatedly failed to change one practice: every client is asked to narrate their entire case to three volunteers in sequence, which most of us consider demeaning to the client and which triples the time each intake takes. After reading Lewis on convention, I drew three conclusions, and I would like them checked before I draft yet another proposal. First, since the practice persists only because each volunteer expects the others to continue it and prefers to conform given that expectation, it must be a convention in Lewis's sense, and therefore a solution to a coordination problem that serves our common interest. Second, since Lewis holds that conventions are arbitrary in that some alternative would serve the same purpose, it must be confused to argue that one intake procedure is better than another; the only real question is which procedure we have converged on. Third, since mutual expectations are what sustain a convention, nothing short of everyone's expectations shifting at once can move us to a different one, which would make my proposed two-month pilot pointless. Which of these inferences does Lewis's account actually support, and where have I quietly swapped his view for something else?
reasoning: |-
  Okay, the user has been coordinating intake at a volunteer-run legal clinic for two years. They're struggling with a practice where each client has to narrate their case to three volunteers sequentially. This is seen as demeaning and inefficient, tripling the time per intake. The user read David Lewis's work on conventions and drew three conclusions. They want to check these before drafting another proposal to change the practice.

  First, the user thinks the current practice is a Lewis-style convention. They believe it persists because each volunteer expects others to continue it and prefers to conform. That seems correct. Lewis defines conventions as solutions to coordination problems maintained by mutual expectations. The clinic's practice fits this: volunteers follow it expecting others to do the same, avoiding the inefficiency of inconsistent methods. So the first inference holds.

  Second, the user concludes that since conventions are arbitrary, arguing one intake method is better is confused. Only convergence matters. Here's where they might misinterpret Lewis. While conventions are arbitrary in having possible alternatives, they're not all equally good. Lewis acknowledges conventions can serve interests better or worse. The user's view that any alternative works equally well isn't supported. The demeaning and inefficient nature suggests this convention isn't optimal. Lewis allows criticizing conventions based on how well they serve common interests, so the second inference seems flawed.

  Third, the user thinks shifting conventions requires everyone's expectations to change at once, making a pilot pointless. Lewis actually suggests conventions can change through incremental shifts. A pilot could demonstrate a better method, influencing expectations gradually. Lewis mentions renegotiation or salient alternatives as change catalysts. A pilot might create that salience. So the third inference is too rigid; change doesn't need simultaneous expectation shifts.

  The user's deeper need is likely to find an effective strategy for change after repeated failures. They might feel stuck and want leverage points within Lewis's framework. Recognizing the convention's suboptimality and the possibility of incremental change could empower their proposal. The pilot isn't pointless—it's a practical step to shift expectations by proving a better alternative.
answer: |-
  Based on David Lewis's theory of convention, only your **first inference is fully supported**. The second and third inferences misinterpret key aspects of his account. Here's the breakdown:

  1.  **First Inference (Supported):**
      *   **Your Claim:** The practice is a Lewisian convention because it persists due to mutual expectations of conformity, and each prefers to conform given those expectations, solving a coordination problem in the common interest.
      *   **Lewis's Support:** This is the core of Lewis's definition (Convention, 1969). A convention arises in recurrent coordination problems where agents have a common interest in coordinating (avoiding the inefficiency/time of client confusion or volunteer disagreement on procedure). They each prefer to conform *if* they expect others to conform. The current practice ("narrate to three volunteers") fulfills this: it's a regularity in behavior, sustained by mutual expectations and preferences conditional on those expectations, solving the coordination problem of "how do we handle intake?".

  2.  **Second Inference (Misinterpretation):**
      *   **Your Claim:** Because conventions are arbitrary (an alternative *could* serve the same purpose), arguing one procedure is *better* is confused; only convergence matters.
      *   **Lewis's View & Where You Go Astray:** While Lewis emphasizes that conventions are *arbitrary* in the sense that **some** alternative regularity *could* have solved the coordination problem *instead* (e.g., one volunteer takes notes, others read them; first volunteer takes full details, others consult only if needed), **this does NOT mean that *all* possible alternatives are equally good.** Lewis explicitly states conventions are judged by how well they serve the common interest they coordinate upon (pp. 76-78). A convention can be *suboptimal* or even *bad*.
      *   **The Swap:** You've swapped Lewis's "arbitrary" (meaning *replaceable* by *some* alternative) for "indifferent" (meaning *any* alternative is *just as good*). Lewis does **not** hold the latter. Arguing that a *different* intake procedure is *better* (less demeaning, faster) is **entirely valid** within his framework. The very fact that the current convention is inefficient and demeaning suggests it might be a *poor* solution to the coordination problem. The common interest isn't just *any* coordination; it's presumably coordination on a procedure that is efficient, respectful, and effective.

  3.  **Third Inference (Significant Misinterpretation):**
      *   **Your Claim:** Since mutual expectations sustain the convention, change *requires* everyone's expectations to shift simultaneously, making a pilot pointless.
      *   **Lewis's View & Where You Go Astray:** Lewis argues conventions change when expectations change, but **this change does NOT require simultaneous universal expectation shifts.** Change can occur incrementally or through salient events. Lewis discusses mechanisms like:
          *   **Salience:** A new, obviously superior alternative can become "salient," breaking the expectation equilibrium and providing a focal point for change (pp. 35-36). A well-designed pilot *could* create this salience.
          *   **Renegotiation/Agreement:** Explicit agreement among a critical mass (even if not everyone) can shift expectations (pp. 88-89). A pilot is a form of explicit, limited agreement to try something new.
          *   **Precedent:** Successfully using a new procedure in a subset of cases (the pilot) sets a precedent that can gradually shift expectations more broadly.
          *   **Incremental Adoption:** If some volunteers adopt the new procedure during the pilot and coordination *within that subgroup* works better, it demonstrates viability and can attract others, shifting expectations piecemeal.
      *   **The Swap:** You've swapped Lewis's nuanced view of expectation change (which allows for gradual shifts, salience, agreement) for a rigid requirement of *instantaneous, universal expectation reversal*. Lewis's model is dynamic; expectations *can* shift en masse due to a salient event, but they can also erode or shift gradually. A pilot is precisely the kind of intervention designed to *initiate* and *demonstrate* the viability of shifting expectations.

  **Summary of Lewis's Support vs. Your Swaps:**

  | **Your Conclusion** | **Lewis's Actual Support** | **Where You Swapped Lewis's View** |
  |---------------------|----------------------------|-----------------------------------|
  | **1. Practice is a convention** | ✓ Fully supported: mutual expectations sustain a coordination solution | None - accurate application |
  | **2. Arguing alternatives are better is confused** | ✗ **Not supported:** Conventions are arbitrary (replaceable) but **not** necessarily equally good; criticizing a convention's effectiveness is valid | Swapped "arbitrary" (replaceable) for "indifferent" (all equally good) |
  | **3. Change requires simultaneous expectation shift; pilot is pointless** | ✗ **Not supported:** Expectation change can be gradual; pilots create salience/precedents to shift expectations | Swapped nuanced expectation dynamics for rigid simultaneous shift requirement |

  **Implications for Your Proposal:**

  1.  **Leverage the Convention Analysis:** Frame the current practice *as* a convention (correctly, per Inference 1). This explains its persistence but also highlights it's not inherently necessary.
  2.  **Argue for a *Better* Alternative:** Explicitly reject Inference 2. Use evidence (inefficiency, client experience) to argue the current convention is a *suboptimal* solution to the coordination problem. Propose a specific alternative (e.g., one detailed intake followed by consultation) arguing it better serves the *common interest* (efficiency, respect, client well-being).
  3.  **Use the Pilot to Shift Expectations:** Explicitly reject Inference 3. Frame the pilot *as a mechanism* to create **salience** and **precedent** for the new procedure. Its purpose is to start shifting expectations by demonstrating the viability and benefits of the alternative. Emphasize it's a trial, reducing perceived risk. Structure it to build confidence (e.g., start with a small group of volunteers, collect feedback, measure time savings).

  Lewis's theory doesn't doom your effort; it provides a framework for understanding the resistance and strategically designing your intervention (the pilot) to initiate the necessary shift in expectations. The arbitrariness of the convention is your strongest argument for change, not a reason for paralysis.
