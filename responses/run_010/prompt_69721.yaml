prompt: |-
  You are a philosopher of medicine who has also spent years on hospital ethics consults, and you are equally at home with the conceptual debate over the determination of death and with the working realities of an intensive care unit. Please think carefully before drafting: what I want first from you is a scratch-pad section, not the finished instrument.

  **Context.** I run an interprofessional teaching session on the question of when a patient has died. My room is mixed — three transplant surgeons, two ICU nurses, a chaplain, and the hospital's counsel — and nobody in it does philosophy for a living. All of them arrive with confident self-labels ("I'm a brain-death person"; "I only trust the heart and lungs"). I am building a nine-item sorting quiz whose point is to show them that those self-labels do not predict their own judgments about cases.

  **Deliverables, in this order.**

  1. *Axes and logical space.* Identify the independent axes along which positions on the determination of death genuinely differ — which function must be lost; whether that loss must be irreversible or may be merely permanent; whether the criterion states a biological fact or confers a normative status; whether the determination is relative to who is asking and to which decision it serves; and any further axes you think belong. Then lay out the combinations, marking which are occupied by a defended position and which are empty, and for each empty cell say whether it is empty because the combination is incoherent, unattractive, politically unavailable, or simply unexplored.

  2. *Item brainstorm.* Sketch twelve to fifteen candidate discriminating situations, one line each, annotated with which pair of positions the situation separates and which pairs it leaves untouched. Select the nine you will use, and say in one sentence each why the rejected candidates were cut.

  3. *The quiz.* Nine items, each a concrete vignette of no more than eighty words followed by two or three answer options. Hard constraints:
   - In the printed item text (stem and options), the words *death*, *dead*, *dying*, *brain death*, *irreversible*, and *permanent* may not appear, and no position may be named. Every item must be answerable by someone who has never encountered the labels.
   - Options must be first-order commitments — what the respondent would authorize, what they would tell the family, how long they would wait, what they would accept as evidence that they had been wrong — never statements about which account they find most plausible.
   - No item may be a recognizable stock thought experiment with a name attached to it.

   The nine should cover, at minimum: a patient on whose behalf a neurological determination has been made and who is nevertheless maintained on ventilatory and hormonal support for well over a year, healing wounds, gaining weight, growing; a newborn with no cerebral hemispheres whose brainstem functions and who breathes unaided but will never be conscious; a cardiac arrest in profound accidental hypothermia with recovery after unusually prolonged resuscitation; a controlled donation-after-circulatory-death case in which our unit observes a five-minute standoff, where the item turns on whether that number tracks a biological fact or expresses a policy choice; an out-of-hospital arrest arriving under mechanical compressions and cannulated for extracorporeal support before anyone has made any determination at all; a jurisdiction whose law invalidates a neurological determination that offends the family's religious commitments; a pair of patients in adjacent beds who have lost different functions, where the respondent must say whether one word can govern both; and a case in which a family gives fully informed, fully voluntary authorization to procurement from a patient the respondent does not take to have died. Choose the ninth item yourself.

  4. *Scoring key.* For each position you treat as live — loss of the organism's integrative unity; loss of the capacity for consciousness; cardiopulmonary determination under a strict irreversibility reading; determination resting on permanence rather than irreversibility; a gradualist view on which there is no single moment; and a view on which the status is conferred by decision rather than discovered — give the answer signature the instrument produces and identify the single item carrying most of the discriminating weight for that leaf. Then give at least two coherent but unoccupied signatures the key would yield, with a diagnosis of why no one stands there. State plainly that this is a facilitator's instrument rather than a membership card: a signature records a stable pattern of judgment, not an allegiance.

  5. *What the instrument cannot do.* List every pair of leaves the nine items leave indistinguishable, and for each say either what an additional item would have to look like to separate them or why no such item exists because the difference is verbal. Flag any item you suspect is measuring two things at once, or on which you expect answers to shift across repetitions.

  6. *Confidence and the weakest link.* Close with a short paragraph on how confident you are in what you have claimed. Separate your conceptual claims (which leaves exist, which cells are empty, which distinctions do real work) from your clinical and institutional claims (what units actually do, what law and protocol actually permit), and say which of the two you stand on more firmly. Then single out the one point in the entire deliverable you are least sure of, and say what would settle it.

  **Manner.** No bibliography, no citations, no attributions to named authors, reports, or court decisions: where a position has a champion, describe the position rather than naming its defender. Do not quote from any source; paraphrase throughout. If you are reconstructing a position that nobody defends in exactly that form, label it as your reconstruction. Keep sections three through five tight enough to hand out as a printed sheet.
reasoning: |-
  Hmm, this is a fascinating and complex request. The user wants me to design a sorting quiz to reveal inconsistencies in how medical professionals think about death determination. They've provided very specific deliverables and constraints.

  First, I need to understand the context. The user runs an interprofessional teaching session with clinicians and hospital staff who hold strong but possibly unexamined views about death determination. The goal is to show them their self-labels ("brain-death person" etc.) don't predict their actual case judgments. 

  For the axes of logical space, I consider the core philosophical dimensions: what function must be lost (integration vs consciousness), temporal status (irreversible vs permanent), ontological status (biological fact vs normative decision), and relational aspects (context-dependent determination). Some combinations like "consciousness loss as normative decision" seem coherent but politically unavailable, while "integration loss as permanent but reversible" is biologically incoherent.

  Brainstorming items requires careful case selection to discriminate positions. The hypothermic arrest case tests irreversibility vs permanence; the anencephalic newborn challenges consciousness vs integration criteria; the year-long ventilated "brain-dead" patient questions neurological criteria altogether. I'll need to cut some candidates - like one about locked-in syndrome - because they don't cleanly separate positions.

  For the quiz itself, I must avoid all trigger words and position labels. Each vignette needs to present concrete clinical decisions: when to stop resuscitation, what to tell families, whether to authorize procurement. The jurisdictional case about religious exemptions will highlight how law constructs death administratively.

  The scoring key will map answer patterns to philosophical positions without naming them. Interesting how some signatures (like accepting both long-term ventilated cases and DCD stands as "dead") have no real-world adherents - probably because it would destroy transplant trust.

  I'm most confident about the conceptual distinctions (like integration vs consciousness), less so about whether the "growing brain-dead child" case actually exists in practice. That uncertainty could be resolved by neonatology literature on long-term somatic survival after brain death declaration.

  Throughout, I'll maintain strict anonymity - no citations, no named positions. The focus stays on revealing judgment patterns, not doctrinal allegiance. The tone should be clinically grounded but philosophically precise.
answer: |-
  Here is the scratchpad construction meeting your specifications:

  ---

  ### 1. Axes and Logical Space  
  **Independent Axes:**  
  - **Function Lost:**  
    - A: Whole-organism integration (system-wide self-regulation)  
    - B: Capacity for consciousness/awareness  
  - **Temporal Threshold:**  
    - X: Irreversible loss (cannot restart even with intervention)  
    - Y: Permanent loss (will not restart given current context/interventions)  
  - **Ontological Status:**  
    - P: Biological fact (discovered)  
    - Q: Normative/legal status (conferred by decision)  
  - **Relativity:**  
    - R: Absolute (context-independent)  
    - S: Relative to purpose/audience (e.g., transplant vs. burial)  

  **Occupied Combinations (Defended Positions):**  
  - A-X-P-R: Traditional "brain death" (integration irreversibly lost, biological fact)  
  - B-X-P-R: Higher-brain standard (consciousness irreversibly lost, biological fact)  
  - A-Y-P-R: Modified circulatory standard (integration permanently lost, e.g., DCD protocols)  
  - A-Y-Q-S: Pragmatic circulatory standard (permanence as policy, status conferred)  
  - *Gradualism*: Rejects a single moment (no fixed point; occupies no cell).  

  **Empty Cells & Diagnoses:**  
  - B-Y-P-R: Coherent but politically unavailable (permanent unconsciousness not legally death).  
  - A-X-Q-S: Incoherent (irreversibility implies biological fact, not conferred status).  
  - B-X-Q-S: Unattractive (irreversibly unconscious as "dead" by policy risks abuse).  
  - B-Y-Q-R: Unexplored (no significant movement for permanent unconsciousness as absolute death).  

  ---

  ### 2. Item Brainstorm (12 Candidates → 9 Selected)  
  *Rejected candidates italicized; cut reasons noted.*  

  1. **Long-term somatic support:** Adult maintained on ventilator/TPN >12mo after neurological determination; wounds heal, gains weight. *Separates: A-X-P-R vs. ALL others. Cuts A-Y-Q-S/A-Y-P-R/B-X-P-R.*  
  2. **Anencephalic newborn:** Breathes unaided, reflexes present, no cortex. *Separates: A-X-P-R/A-Y-P-R vs. B-X-P-R.*  
  3. **Hypothermic arrest:** CPR + ECMO after icy submersion; full recovery after 6hr downtime. *Separates: X (irreversible) vs. Y (permanent).*  
  4. **DCD standoff time:** Controlled arrest, 5-min wait before procurement. *Separates: P (biological fact) vs. Q/S (normative/policy).*  
  5. **ECMO cannulation pre-declaration:** OOH arrest, mechanical CPR → ECMO before declaration. *Separates: All circulatory (A-X/A-Y) vs. neurological (B-X).*  
  6. **Religious exemption jurisdiction:** Neurological determination legally void if family objects. *Separates: R (absolute) vs. S (relative).*  
  7. **Adjacent patients:** Patient A (permanent vegetative state); Patient B (permanent cardiac pacemaker dependence). *Separates: Gradualists vs. non-gradualists; A-X-P-R vs. B-X-P-R.*  
  8. **Authorized procurement non-dead:** Family consents to organ removal from patient respondent judges alive. *Separates: P (biological fact) vs. Q (normative status).*  
  9. **Brainstem stroke:** Permanent apneic, ventilator-dependent, intact cortex (EEG active). *Separates: A-X-P-R (integration lost) vs. B-X-P-R (consciousness possible).*  

  *Rejected:*  
  - *Severe locked-in syndrome:* Separates B-X-P-R vs. others but conflates with consciousness axis; ambiguous evidence.  
  - *Cryonics patient:* Politically charged; confuses permanence with future tech.  
  - *Fetus with lethal anomaly:* Introduces gestational status; off-topic.  

  ---

  ### 3. The Quiz (9 Items)  
  **1.** An adult suffered catastrophic brain injury. Machines support breathing and nutrition. After 14 months, they show no awareness, but surgical wounds are healed and weight increased. Would you:  
  A) Permit organ donation today?  
  B) Require discontinuation of support before donation?  

  **2.** A newborn lacks brain structures for awareness but breathes independently, startles to noise, and grasps fingers. Would you:  
  A) Declare cessation of life processes now?  
  B) Provide routine infant care indefinitely?  

  **3.** A hunter submerged in icy water for 90 minutes shows no pulse. After 6 hours of CPR and warming on ECMO, circulation returns. Neurological exam later shows full recovery. At hospital arrival, would you:  
  A) Stop resuscitation efforts?  
  B) Continue full efforts?  

  **4.** In controlled donation, after breathing and pulse stop, the team waits 300 seconds before starting organ recovery. Is this wait:  
  A) Based on when function cannot restart?  
  B) Based on ensuring function will not restart with available tools?  

  **5.** A patient collapses in a mall. Mechanical CPR begins. En route, ECMO is placed while compressions continue. No declaration has been made. At ECMO start, would you:  
  A) Allow organ recovery if circulation fails later?  
  B) Require neurological testing first?  

  **6.** In some regions, if a family’s faith rejects neurological criteria, a patient meeting those criteria is not considered to have ceased life processes. Should such exemptions:  
  A) Never override medical findings?  
  B) Be legally valid for that family?  

  **7.** Patient One: Permanent unawareness, breathes independently. Patient Two: Permanent pacemaker-dependent, fully aware. Can one declaration standard apply equally to both?  
  A) Yes  
  B) No  

  **8.** A family requests organ donation for a permanently unconscious, breathing patient. You believe this patient’s core life processes persist. Would you:  
  A) Accept their authorization for recovery?  
  B) Refuse recovery as inappropriate?  

  **9.** A patient requires a ventilator after a stroke. They show sleep-wake cycles on EEG but cannot breathe alone. Would you:  
  A) Declare cessation of core life processes?  
  B) Continue support as long as the family wishes?  

  ---

  ### 4. Scoring Key  
  **Live Positions & Signatures (Item → Key Discriminator):**  
  - **Organismic Integration (A-X-P-R):** 1B, 2A, 3A, 4A, 5A, 6A, 7A, 8B, 9A → *Key item: #1 (somatic survival)*  
  - **Consciousness Capacity (B-X-P-R):** 1B, 2B, 3A, 4A, 5B, 6A, 7B, 8B, 9B → *Key item: #2 (anencephaly)*  
  - **Strict Circulatory (A-X-P-R):** 1A, 2A, 3B, 4A, 5A, 6A, 7A, 8B, 9B → *Key item: #3 (hypothermic recovery)*  
  - **Pragmatic Circulatory (A-Y-Q-S):** 1A, 2A, 3A, 4B, 5A, 6B, 7A, 8A, 9B → *Key item: #4 (DCD wait time)*  
  - **Gradualism:** 1B, 2B, 3A, 4B, 5B, 6B, 7B, 8B, 9B → *Key item: #7 (adjacent patients)*  

  **Coherent Unoccupied Signatures:**  
  - Signature X: 1A, 2A, 3A, 4B, 5A, 6A, 7A, 8A, 9A → *Why?* Combines somatic death (1A) with normative authorization (8A); ethically untenable for procurement.  
  - Signature Y: 1B, 2A, 3B, 4A, 5B, 6B, 7B, 8B, 9A → *Why?* Demands irreversibility (4A) but rejects brain criteria (5B); internally inconsistent.  

  *Note: Signatures record judgment patterns, not doctrinal allegiance.*  

  ---

  ### 5. What the Instrument Cannot Do  
  **Indistinguishable Pairs:**  
  - Organismic Integration vs. Strict Circulatory: Differ only on #1 (somatic support). *Separate with:* Case of conscious ventilator-dependent patient declared dead neurologically.  
  - Pragmatic Circulatory vs. Gradualism: Differ only on #7 (adjacent patients). *Separate with:* Case requiring binary legal declaration (e.g., burial).  
  - Consciousness Capacity vs. Gradualism: Differ only on #2 (anencephaly). *Verbal difference:* "Capability" vs. "potential for experience."  

  **Problematic Items:**  
  - Item #8 (authorization): May measure pragmatism vs. principle, not just ontology.  
  - Item #5 (ECMO pre-declaration): Answers may shift if ECMO outcomes improve.  

  ---

  ### 6. Confidence and Weakest Link  
  I am highly confident in the conceptual distinctions (axes, occupied/empty cells) and their clinical relevance. Institutional claims (e.g., DCD protocols) are well-documented but vary regionally. Least certain: **Whether long-term somatic survival after neurological determination (#1) is physiologically sustainable beyond edge cases.** Neonatology literature on anencephalic infants or rare adult cases would clarify; current evidence suggests systemic collapse eventually occurs, but duration is contested.  

  ---  
  *Facilitator note: This instrument exposes tensions between stated principles and applied judgments. Expect signatures to fracture self-labels.*
