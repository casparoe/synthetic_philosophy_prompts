  ### Decision Tree for Betting Behavior

  Below is a decision tree with 8 betting scenarios. Each scenario has 2–3 answer options, avoiding jargon and focusing on concrete choices. The tree covers all requested elements: a one-time non-reinvestable bet, repeated bets, absorbing vs. recoverable ruin, an uncertain edge from 10 trials, and the critical repeated bet with positive EV but negative log growth for all stakes (adjusted to ensure Kelly rejects it). The leaves represent real positions, with their most awkward commitment noted. Unoccupied answer combinations and indistinguishable positions are explained afterward.

  ---

  #### **Question 1: One-Time Non-Reinvestable Bet**  
  You have $100. A friend offers a single bet:  
  - 60% chance to win $50 (you get your stake back + $50).  
  - 40% chance to lose your stake.  
  *How much of your $100 do you stake?*  
  - **a) $0**  
  - **b) Between $1 and $99**  
  - **c) $100**  

  #### **Question 2: Repeated Bet (Same as Q1)**  
  The same bet as Q1 is offered repeatedly. You start with $100 and can bet a fraction of your *current* wealth each round.  
  *How much do you stake per round?*  
  - **a) $0**  
  - **b) Between 1% and 99% of current wealth**  
  - **c) 100% of current wealth**  

  #### **Question 3: Absorbing Ruin**  
  A repeated bet:  
  - 51% chance to double your stake (get stake back + 100% profit).  
  - 49% chance to lose your stake.  
  *If you go broke, you stay broke forever. How much do you stake per round?*  
  - **a) 0%**  
  - **b) 1–99% of current wealth**  
  - **c) 100% of current wealth**  

  #### **Question 4: Recoverable Ruin**  
  The same bet as Q3, but if you go broke, you get a new $100 stake and continue.  
  *How much do you stake per round?*  
  - **a) 0%**  
  - **b) 1–99% of current wealth**  
  - **c) 100% of current wealth**  

  #### **Question 5: Uncertain Edge (10 Trials)**  
  A coin was flipped 10 times: 7 heads, 3 tails. You get one bet on heads at even money (win 100% of stake if heads, lose stake if tails).  
  *How much of your $100 do you stake?*  
  - **a) $0**  
  - **b) Between $1 and $99**  
  - **c) $100**  

  #### **Question 6: Positive EV, Negative Log Growth**  
  Repeated bet per round:  
  - 60% chance: wealth grows to `1 + 2f` (e.g., stake 20% → win 40% of current wealth).  
  - 40% chance: wealth drops to `0` (go broke).  
  *How much fraction `f` of current wealth do you stake?*  
  - **a) 0%**  
  - **b) 1–99%**  
  - **c) 100%**  

  #### **Question 7: Lottery-Like Bet**  
  A one-time lottery ticket costs `x` (a fraction of wealth). It has:  
  - 1 in 1,000,000 chance to win 1,100,000`x` (net gain 1,099,999`x`).  
  - 999,999 in 1,000,000 chance to lose `x`.  
  *What fraction `f` of your wealth do you spend?*  
  - **a) 0%**  
  - **b) >0% but ≤0.01% (e.g., ≤$0.01 for $100)**  
  - **c) >0.01%**  

  #### **Question 8: Safe Small-Edge Bet**  
  Repeated bet per round:  
  - 51% chance: wealth grows to `1 + 0.01f` (win 1% of stake).  
  - 49% chance: wealth drops to `1 - 0.01f` (lose 1% of stake).  
  *How much fraction `f` do you stake?*  
  - **a) 0%**  
  - **b) 1–100%**  

  ---

  ### Leaves (Positions) and Most Awkward Commitments
  1. **EV Maximizer (Bet max when EV > 0):**  
     - *Path:* Q1:c, Q2:c, Q3:c, Q4:c, Q5:c, Q6:c, Q7:c, Q8:b  
     - *Awkward commitment:* Bets 100% in Q6 (40% chance of instant ruin) because EV is positive.  

  2. **Full Kelly (Maximize expected log growth):**  
     - *Path:* Q1:b, Q2:b, Q3:b, Q4:b, Q5:b, Q6:a, Q7:b, Q8:b  
     - *Awkward commitment:* Bets a microscopic fraction (e.g., 0.009%) in Q7 for a 1-in-a-million lottery.  

  3. **Half Kelly (Fractional Kelly, e.g., 50% of Kelly stake):**  
     - *Path:* Same as Full Kelly (Q1:b, Q2:b, Q3:b, Q4:b, Q5:b, Q6:a, Q7:b, Q8:b)  
     - *Awkward commitment:* In Q5, bets only 20% (not 40%) on a coin with 7/10 heads, despite a large estimated edge.  

  4. **CRRA Utility Maximizer (e.g., u(w) = w<sup>0.5</sup> or u(w) = -e<sup>-w</sup>):**  
     - *Path:* Same as Full/Half Kelly (Q1:b, Q2:b, Q3:b, Q4:b, Q5:b, Q6:a, Q7:b, Q8:b)  
     - *Awkward commitment:* In Q8, bets aggressively (up to 100%) on a tiny 2% edge, despite risk-aversion.  

  5. **Zero Risk of Ruin (Reject any chance of $0 wealth, ever):**  
     - *Path:* Q1:b, Q2:a, Q3:a, Q4:a, Q5:b, Q6:a, Q7:b, Q8:b  
     - *Awkward commitment:* Avoids Q2 (repeated 60/40 bet) entirely, even with small stakes, due to eventual ruin risk.  

  6. **Ensemble-Average Growth Maximizer (Maximize expected terminal wealth in repeated bets):**  
     - *Path:* Same as EV Maximizer (Q1:c, Q2:c, Q3:c, Q4:c, Q5:c, Q6:c, Q7:c, Q8:b)  
     - *Awkward commitment:* Treats repeated bets as one-shot EV maximization (e.g., Q2: bets 100%, ignoring compounding).  

  ---

  ### Indistinguishable Positions
  - **Full Kelly, Half Kelly, and CRRA Utility Maximizer** share the same path (Q1:b, Q2:b, Q3:b, Q4:b, Q5:b, Q6:a, Q7:b, Q8:b). They **cannot be separated** by this tree because:  
    - All three avoid ruinous bets (Q6:a).  
    - All three bet moderately in favorable one-shot/repeated bets (Q1-5:b).  
    - All three bet minimally in lotteries (Q7:b).  
    - *Where they differ:* Actual stake sizes (e.g., Kelly bets 20% in Q2, Half Kelly 10%, CRRA may vary). To distinguish, add a question like: *"For a 60% win-double / 40% lose-stake repeated bet, what fraction do you stake? Options: <5%, 5–15%, 15–30%, >30%."*  

  ---

  ### Unoccupied Answer Combinations
  1. **Q1:c + Q2:a/b, Q3–8:any**  
     - *Why:* Incoherent. If you maximize EV in Q1 (bet 100%), you should do the same in Q2 (repeated version). Avoiding Q2 after betting fully in Q1 is irrational for EV-focused positions.  
     - *Status:* Incoherent.  

  2. **Q6:c + Q1–5,7,8:a or b (except EV/Ensemble paths)**  
     - *Why:* Unattractive. Betting 100% in Q6 (40% ruin chance) is extremely risky. Only EV/Ensemble maximizers accept this; others avoid ruin.  
     - *Status:* Unattractive (no mainstream position endorses it).  

  3. **Q7:c + Q6:a + Q1–5,8:b**  
     - *Why:* Unoccupied. Bets heavily on a lottery (Q7:c) but avoids a positive-EV bet with ruin risk (Q6:a). Kelly/CRRA bet minimally in Q7; only EV goes big.  
     - *Status:* Nobody’s bothered yet (possible but rare).  

  4. **Q4:a + Q3:c**  
     - *Why:* Unattractive. Avoids the recoverable-ruin bet (Q4) but accepts the absorbing-ruin bet (Q3). No position fears temporary ruin more than permanent ruin.  
     - *Status:* Unattractive.  

  ---

  ### Notes for the Reading Group
  - **Critical Bet (Q6) Arithmetic:**  
    - **Win (60%):** Wealth = `1 + 2f` (e.g., stake 30% → `1 + 0.6 = 1.6x`).  
    - **Lose (40%):** Wealth = `0` (ruin).  
    - **EV:** `0.6(1 + 2f) + 0.4(0) = 0.6 + 1.2f > 1` (positive for `f > 0`).  
    - **Log Growth:** `0.6·log(1 + 2f) + 0.4·log(0)`. Since `log(0) = -∞`, expected log growth is `-∞` for any `f > 0`. Thus, EV maximizers stake 100% (c), growth/log-utility maximizers stake 0% (a).  

  - **Design Choices:**  
    - Answers avoid thresholds (e.g., "bet half") to ensure accessibility.  
    - Positions like "time-average growth" converge with Kelly in the long run, so not a separate leaf.  
    - "Fractional Kelly" defaults to 50% for illustration; real-world fractions vary.  

  This tree exposes behavioral differences without jargon. Use it to sort group members, then discuss the underlying philosophies!
