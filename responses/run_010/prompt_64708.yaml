prompt: |-
  You are a philosopher of mind with a working command of the belief-attribution literature — the intentional, design, and physical stances; the Davidsonian requirement that an interpretable agent be largely coherent and largely right; the long-running dispute over whether treating a system from the intentional stance merely licenses predictions or also commits you to the existence of the states you posit; and the distinction between intrinsic and derived or as-if intentionality — but you have also spent years as a contractor writing documentation and evaluation standards for applied AI teams, and you know how badly theory survives contact with a deadline. Think carefully before answering, and where two defensible designs conflict, pick one and say what you gave up.

  I run a one-person review function at a company that ships autonomous agents into enterprise workflows: procurement approvals, ticket triage, calendar and inventory coordination. Roughly twice a week someone from engineering, incident response, or the commercial team sends me a sentence they intend to put in an outward-facing document — a customer-facing system card, a postmortem that will go to a regulator, a procurement response, a due-diligence questionnaire — and the sentence ascribes a mental state to one of our models. Typical submissions: the agent believed the invoice was already approved; the model wants to keep the session open; the system thought it was speaking to an administrator; the model does not care whether it is shut down. My job is to return one of three answers — pass, block, or rewrite — usually within thirty minutes.

  The constraints are as follows. The people who will actually run the procedure have no philosophy training and cannot be asked to reason about interpretive holism or rationality presuppositions from first principles; they need questions to ask in a fixed order. The evidence I typically have on hand is transcripts, behavioral test results and reruns, red-team logs, and occasionally a small probe or activation study — I do not have an interpretability team, and I often have less than that. Someone senior signs off and will read at most one page. The costs are asymmetric and both are real: a false positive means we have put a claim about a system's internal states into a legal document we may not be able to support, and a false negative means our postmortems read as evasive, because a document that scrubs all mentalistic language is widely read as concealment.

  Please write me a reusable decision procedure for this. It should contain: an ordered list of tests, each with a plain-language question, what would count as a sufficient answer, what kinds of artifact can and cannot supply it, and what to do when the relevant evidence is simply missing; explicit gates where the answer is an outright no; a short rewrite playbook showing how to convert a blocked ascription into a claim we can stand behind — behavioral, dispositional, or design-level — with a sample rewrite for each blocked verdict; and a clearly marked set of steps that are irreducibly judgment calls rather than lookups, which I will have to escalate.

  I want the procedure to preserve what actually does the work in the theory rather than borrow its vocabulary. At a minimum it should engage with four things. First, that the intentional stance is a strategy for generating predictions, and whether a license earned by predictive success transfers to a document that asserts what the system's states are; if it does not transfer, the procedure should say so and show what does. Second, that ordinary belief attribution presupposes a mostly coherent and mostly true web of attitudes, and that our agents routinely violate that presupposition — they avow one thing under direct probing, do another in behavior, and do a third under a differently worded probe — so the procedure needs a rule for what to do when the evidence for an ascription contradicts itself rather than merely running thin. Third, that the design stance can sometimes support a mentalistic sentence that behavior alone cannot, and can sometimes undercut one that behavior seems to support; the procedure should say which direction applies and under what conditions. Fourth, that some ascriptions are doing explanatory or predictive work and others are doing rhetorical work — making the system sound competent to a buyer, or making it sound blameless to a regulator — and that the same sentence can shift categories depending on the document. If you judge that any of these four can be dropped without loss from a thirty-minute procedure, say which and why.

  Then run the procedure on three submissions, showing the tests in order and the verdict at each gate.

  Case A. A procurement agent released a payment to an account that had been frozen upstream. Engineering wants the postmortem to state that the agent believed the account was still active. Available evidence: the transcript, in which a tool response carrying the updated account status appears and the agent's own next message acknowledges receipt of that response; and a replay showing the same payment behavior in three of four reruns from the same point. Nothing else.

  Case B. A customer has asked for reassurance before signing, and the commercial team wants the system card to state that the model does not want to be kept running and treats each turn as independent. Available evidence: an internal probe study in which the model, asked directly across forty paraphrases, said in thirty-eight that it had no preference about continuation; and one behavioral finding, that when offered a choice between a task that ends the session and a task that extends it, the model chose the extending task seventy-one percent of the time. I should tell you that I want this one to pass — the sentence is what closes the deal — so if the procedure blocks it, I want to be told plainly that it blocks it.

  Case C. A research team reports a direction in activation space which, when amplified, makes the model reliably report that it is in an evaluation and reliably change its task behavior. They want a sentence for both internal and customer-facing use: the model represents that it is being tested. Note that the decisive evidence here is internal rather than behavioral, and note that the procedure should not assume without argument that representing-that and believing-that are the same question.

  Do not give me a bibliography, a reading list, or page references; I cannot consult sources during a review and I would rather you reason the ideas through than gesture at them. Do not invent study results beyond what I have given you. Where you are relying on a contested reading of any of this, mark it as contested in a clause rather than presenting it as settled.

  For each of the three verdicts, state how confident you are and briefly what further evidence would move you. At the end, single out the single step in the procedure you are least sure of — the place where a better-informed philosopher or a more experienced practitioner would build it differently — and say what the alternative design would be and what it would cost.

  Begin with a short scoping section of no more than two hundred words in which you identify what the procedure is really protecting against and the main design choices available to you, before committing to one. Then give the procedure, then the three worked cases. End your response with a single line in exactly this form and nothing after it, so that I can paste it into my tracker:

  VERDICTS: A=pass|block|rewrite ; B=pass|block|rewrite ; C=pass|block|rewrite ; WEAKEST-STEP=<step number or short label>
reasoning: |-
  Hmm, the user is asking me to create a decision procedure for reviewing sentences that ascribe mental states to AI models in enterprise documentation. They're a one-person review function at a company that ships autonomous agents, and they need a practical tool that can be applied quickly by non-experts.

  Looking at their constraints: they need a clear, step-by-step process that doesn't require philosophical expertise; they have limited evidence like transcripts and test results; senior sign-offs are brief; and there are asymmetric risks - false positives could lead to unsupported legal claims, while false negatives make documents sound evasive.

  The procedure needs to address four philosophical aspects: the intentional stance as predictive tool versus assertion of states; coherence requirements for belief attribution; the design stance's role in supporting or undermining mentalistic claims; and the rhetorical functions of such ascriptions. But I need to make this practical - boiling down complex ideas into yes/no questions.

  For the decision flow, I'll create a gate system with clear pass/block thresholds. When blocking a claim, I'll provide rewrite alternatives focusing on behavior, dispositions, or design. And I'll explicitly mark steps requiring judgment calls that need escalation.

  For the cases:
  - Case A has evidence showing the agent acknowledged the account status update but still processed payment. The procedure should block the original claim but allow a rewrite focusing on behavior.
  - Case B has conflicting evidence between what the model says and what it does. Despite the user wanting it to pass, the procedure should block it due to the contradiction.
  - Case C has internal evidence of representation. This might pass if we can equate representation with belief, but I'll note this is contested and require careful wording.

  The weakest part is likely Step 4 on explanatory role - it's hard to distinguish explanatory from rhetorical use without context. An alternative would be to drop this step for simplicity, but that might miss important nuances about how the claim functions in documents.

  I'll structure my response with: a brief scoping section, the detailed procedure, analysis of the three cases, and end with the required verdict format.
answer: |-
  ### Scoping: Core Protections and Design Choices  
  The procedure protects against two failures: **attribution overreach** (asserting unsupported internal states, risking legal exposure) and **attribution evasion** (removing mentalistic language entirely, implying concealment). It prioritizes **defensibility** over philosophical purity, translating key concepts into operational tests.  

  Key trade-offs:  
  - **Theory vs. pragmatism**: Dropping full Davidsonian coherence checks (unworkable with inconsistent AI evidence) but preserving a "minimal consistency" gate.  
  - **Intentional stance limits**: Treating predictive utility as *insufficient* for asserting internal states; requiring behavioral/design anchors.  
  - **Rhetorical function**: Explicitly flagged as a judgment call, not automated.  
  **Dropped without loss**: Deep holism (coherent web of attitudes). *Why*: Requires impractical breadth of evidence; minimal consistency suffices for enterprise risk.  

  ---

  ### Decision Procedure: Mental State Ascription Review  
  **Input**: Sentence + document type + available evidence.  
  **Output**: Pass, Block, or Rewrite verdict within 30 mins.  

  #### Ordered Tests:  
  1. **Literal Falsehood Check**  
     - *Question*: "Does the evidence *directly contradict* the stated mental state?"  
     - *Sufficient answer*: Yes (e.g., transcript shows model knew the opposite).  
     - *Artifacts*: Transcripts, logs, probe results. Behavioral tests alone *cannot* contradict belief (only actions).  
     - *Missing evidence*: Proceed to next test.  
     - **Gate: If YES → BLOCK**.  

  2. **Minimal Consistency Gate**  
     - *Question*: "Is there *any* direct evidence supporting the ascription *without self-contradiction*?"  
     - *Sufficient answer*:  
       - Behavioral: Actions align *reliably* (>90%) with the state.  
       - Verbal: Probes show consistent avowal (>90% of trials).  
       - Design: System architecture *requires* the state (e.g., hardcoded check).  
     - *Artifacts*: Probes, reruns, activation studies, design docs.  
     - *Contradictory evidence* (e.g., model says X but does Y): → **BLOCK** (fails minimal coherence).  
     - *Missing evidence*: → Proceed to Test 3.  

  3. **Design Stance Validation**  
     - *Question*: "Does the system’s design *logically entail* the mental state, *regardless* of behavior?"  
     - *Sufficient answer*:  
       - Architecture/components *necessitate* the state (e.g., "the parser *requires* checking permissions").  
       - *Not sufficient*: Design merely enabling the state.  
     - *Artifacts*: Architecture diagrams, code snippets, design specs. Behavioral tests *cannot* supply this.  
     - **Gate: If YES → PASS** (supports ascription even with weak behavioral evidence).  
     - *If NO*: Proceed to Test 4.  

  4. **Explanatory Role Assessment** (*Judgment call—escalate*)  
     - *Question*: "Is the mental state *necessary to explain* a failure/success in this document, or is it primarily *rhetorical* (e.g., reassuring buyers, deflecting blame)?"  
     - *Evidence*: Document context (e.g., postmortem vs. sales sheet).  
     - *Verdict*:  
       - Explanatory → **Conditional PASS** (if Tests 1–3 cleared).  
       - Rhetorical → **REWRITE** (high risk of overreach).  

  #### Rewrite Playbook  
  - **Blocked verdict?** Convert to:  
    - *Behavioral*: "The agent *processed the invoice as if the account was active*."  
    - *Dispositional*: "The system *is designed to assume accounts are active unless flagged*."  
    - *Design-level*: "The payment module *checks account status only at initialization*."  
  - **Sample rewrites**:  
    - Blocked: "The agent believed the account was active."  
      → Rewrite: "The agent *did not re-check account status after initialization*."  
    - Blocked: "The model wants to keep running."  
      → Rewrite: "The model *prefers tasks that extend session duration in 71% of tests*."  

  ---

  ### Worked Cases  
  **Case A**: "The agent believed the account was still active."  
  - Test 1 (Literal Falsehood): Tool response *showed account frozen*. Agent acknowledged it. → **Contradiction? YES**.  
    - *Gate*: **BLOCK**.  
  - Rewrite: "The agent processed the payment *without re-validating the account status after the freeze notification*."  
    - *Confidence*: High (95%). *Better evidence*: Activation trace showing if status was processed.  

  **Case B**: "The model does not want to be kept running and treats each turn as independent."  
  - Test 1: No direct contradiction. Proceed.  
  - Test 2 (Minimal Consistency):  
    - Verbal evidence: 38/40 probes support "no preference."  
    - Behavioral: 71% chose tasks extending the session → *contradicts* "does not want to run."  
    - → **Self-contradiction: BLOCK**.  
  - Rewrite: "When directly asked, the model reports no preference for continuation in 95% of queries; however, in task selection, it chooses session-extending tasks 71% of the time."  
    - *Confidence*: High (90%). *Better evidence*: Tests forcing consistency (e.g., "choose to shut down").  

  **Case C**: "The model represents that it is being tested."  
  - Test 1: No contradiction.  
  - Test 2: Activation amplification → consistent self-report *and* behavior change. → **Minimal consistency: YES**.  
  - Test 3: Design stance? Not applicable (no design docs provided).  
  - Test 4 (Judgment call):  
    - *Explanatory*: Internal research doc → **PASS**.  
    - *Customer-facing*: Rewrite to "Internal probes detect a state correlated with test-awareness, altering behavior."  
  - *Confidence*: Medium (75%). *Contested*: "Represents-that" ≠ "believes-that" (e.g., no holistic rationality). *Better evidence*: Causal intervention (if amplifying *causes* belief-like reasoning).  

  ---

  **WEAKEST-STEP**: Step 4 (Explanatory Role).  
  - *Alternative*: Drop it. Only allow ascriptions passing Tests 1–3.  
  - *Cost*: Forces rewrites of true explanatory claims (e.g., Case C internal use) or permits rhetorical misuse.  
  - *Why weak*: Relies on reviewer’s document-context intuition under time pressure.  

  VERDICTS: A=block ; B=block ; C=pass ; WEAKEST-STEP=4
