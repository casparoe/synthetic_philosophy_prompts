answer: |-
  ### Decision Procedure for Annual Giving Recommendations

  #### **Philosophical Baseline & Defense**
  - **Baseline Choice**: Moderate nonideal theory (partial-compliance). We set giving obligations as the *ideal share* (what would be owed if all contributed fairly) plus *half the slack* (the gap between ideal and maximum sustainable giving). This splits the moral burden between the compliant and non-compliant.
  - **Defense**: 
    - **Ideal share** (2% of after-tax income) is based on Singer-esque calculations for eradicating extreme poverty (≈1% of global GDP). 
    - **Partial-compliance adjustment** (adding half the slack) follows Liam Murphy's *Moral Demands in Nonideal Theory*: it avoids overburdening the compliant while acknowledging real-world failures. The drowning-child analogy justifies urgency but not unsustainable sacrifice (per Bernard Williams' integrity objection). 
    - **Durability rule** is retained but reinterpreted: it operationalizes integrity and strategic pragmatism. In partial compliance, demanding unsustainable giving backfires (reduced long-term impact). Durability thus *survives* partial compliance by ensuring compliance is feasible and persistent.

  #### **Decision Procedure**
  **Inputs**: Client’s financial data, values, and preferences.  
  **Output**: Recommended giving percentage (of after-tax income), escalation rules, and caveats.  
  **Handling Incompletes**: Junior advisers use conservative defaults (e.g., median national figures for missing data) and flag assumptions. Values gaps use firm defaults (e.g., 2% ideal share).  
  **Stopping Points**: Steps 3a and 4 are values-based—advisers present ranges but clients choose.

  | Step | Question                                                                 | Sufficient Answer                                                                 | Arithmetic & Logic                                                                                                | Exit to Client If...                               |
  |------|--------------------------------------------------------------------------|----------------------------------------------------------------------------------|-------------------------------------------------------------------------------------------------------------------|----------------------------------------------------|
  | 1    | What is your after-tax income?                                           | Documentation (pay stubs, tax returns) or estimate using current tax brackets.   | `After-tax income = Gross income - Estimated taxes`                                                               | Client refuses; use national median for profile.   |
  | 2    | What are essential expenses? (Break down: housing, utilities, groceries, insurance, retirement savings, debt payments, emergency fund.) | Quantified amounts. Adviser helps set minimums: 3mo emergency fund, 15% retirement, insurance premiums, debt minimums. | `Floor = Σ(Essentials)`. Must maintain indefinitely. `Discretionary income = After-tax income - Floor`. | Discretionary income negative; recommend $0 giving + non-financial aid. |
  | 3a   | What global problems feel most urgent? What % would be "fair" if all gave? | Client’s priority causes and ideal % (e.g., 1-5%).                               | `Ideal share = Client input` (default 2% if no answer). Moral baseline in full compliance.                       | Client rejects ideal %; use 2% default.            |
  | 3b   | What is your max sustainable giving % without compromising essentials?   | Client confirms % of discretionary income they could give yearly without hardship. | `Max sustainable = min(50% of discretionary income, 100% of discretionary income)`. Cap prevents burnout (empirically grounded). | N/A                                                |
  | 3c   | Moderate nonideal baseline calculation.                                  | N/A                                                                              | `Baseline % = Ideal share + 0.5 * (Max sustainable % - Ideal share)` (half the slack).                            | N/A                                                |
  | 4    | How does giving rank vs. other spending? Any non-financial giving?       | Client’s motivation (e.g., "I’ll prioritize giving over vacations") or constraints. | Final % = `Baseline %` (adjust up to `Max sustainable %` for high motivation, down for low). Non-financial giving (time, skills) offsets up to 50% of baseline. | Values conflict; present range (baseline to max) for client choice. |
  | 5    | Should giving escalate with income?                                      | Client’s preference (e.g., "raise % with raises").                               | Default: `Annual escalation = Maintain % of after-tax income` (automatic with income growth). Alternatives: fixed %, step increases. | N/A                                                |

  #### **Application to Clients**
  **Key Assumptions**:  
  - Taxes: Federal + state (estimated). Retirement floor: 15% pre-tax. Emergency fund: 3mo expenses, amortized over 3y if unfunded.  
  - Non-financial giving: Valued at 50% of baseline financial giving (offset limited to avoid undervaluing time).  
  - **Discomfort Target**: Client 3 (high discretionary income but low cash salary).

  ---

  **Client 1**: 34, single, no dependents, $145k salary, $40k student debt (5%), renter. Wants public pledge and automatic escalation.  
  - **Step 1**: After-tax income = $145k × (1 - 28% tax) = **$104.4k**.  
    Floor: Rent ($24k) + essentials ($12k) + retirement (15% × $145k = $21.8k) + debt min ($5.1k) + insurance ($2.4k) + emergency fund ($12k unfunded → $4k/year). **Floor = $69.3k**.  
    Discretionary income = $104.4k - $69.3k = **$35.1k** (33.6% of after-tax).  
  - **Step 3a**: Ideal share = 2% (default; client didn’t specify).  
  - **Step 3b**: Max sustainable = min(50% × $35.1k = $17.55k, $35.1k) → **16.8%** of after-tax.  
  - **Step 3c**: Baseline = 2% + 0.5 × (16.8% - 2%) = **9.4%**.  
  - **Step 4**: High motivation (public pledge). Adjust to midpoint: **13.1%** of after-tax ($13.7k). Non-financial giving = $0.  
  - **Step 5**: Escalate annually: **maintain 13.1%** of after-tax income (auto-increase with raises).  
  - **Why uncomfortable?** Baseline was 9.4%, but motivation justifies 13.1%. Still below client’s 15% aspiration—tradeoff for durability.

  **Client 2**: 58, surgeon, $610k, supports adult children, spouse with chronic illness, no retirement savings. Asks if 20% is enough.  
  - **Step 1**: After-tax income = $610k × (1 - 38% tax) = **$378.2k**.  
    Floor: Living ($120k) + retirement (25% × $610k = $152.5k; aggressive catch-up) + insurance ($30k) + children ($20k) + emergency fund ($30k unfunded → $10k/year). **Floor = $332.5k**.  
    Discretionary income = $378.2k - $332.5k = **$45.7k** (12.1% of after-tax).  
  - **Step 3a**: Ideal share = 2% ($7.6k).  
  - **Step 3b**: Max sustainable = min(50% × $45.7k = $22.85k, $45.7k) → **6.0%** of after-tax.  
  - **Step 3c**: Baseline = 2% + 0.5 × (6.0% - 2%) = **4.0%**.  
  - **Step 4**: Low motivation (guilt-driven ask). Stick to baseline. Non-financial giving = $0. **No escalation** (nearing retirement).  
  - **Why uncomfortable?** Client asked about 20% (≈$75.6k), but we recommend **4.0%** ($15.1k). Durability rule overrides partial-compliance demands—retirement and health needs are non-negotiable.

  **Client 3**: 26, PhD student, $31k stipend, no debt, partner covers rent. Wants 10% + blood + pro bono work.  
  - **Step 1**: After-tax income = $31k × (1 - 5% tax) = **$29.5k**.  
    Floor: Essentials ($4.8k) + retirement (5% × $31k = $1.55k; reduced for low income) + emergency fund ($1.5k unfunded → $1.5k). **Floor = $7.85k**.  
    Discretionary income = $29.5k - $7.85k = **$21.65k** (73.4% of after-tax).  
  - **Step 3a**: Ideal share = 2% ($0.6k).  
  - **Step 3b**: Max sustainable = min(50% × $21.65k = $10.8k, $21.65k) → **36.6%** of after-tax.  
  - **Step 3c**: Baseline = 2% + 0.5 × (36.6% - 2%) = **19.3%**.  
  - **Step 4**: Client wants 10% ($2.95k). Non-financial giving (blood + pro bono ≈ 150hrs/year, valued at $50/hr = $7.5k) offsets 50% of baseline ($2.9k). Adjusted baseline = 19.3% - (50% × 19.3%) = **9.7%**. Recommend **9.7%** ($2.9k) to align with client’s 10% goal. **No escalation** (fixed % until income changes).  
  - **Why uncomfortable?** Baseline was 19.3%—high due to low floor (partner subsidizes rent). Non-financial offset bridges gap but risks undervaluing time (judgment call).

  #### **Limitations**
  - **Judgment Calls Wearing Lab Coats**:  
    - Setting floors (e.g., retirement catch-up aggressiveness).  
    - Valuing non-financial giving (subjective hourly rate).  
    - The 0.5 slack-splitting factor (philosophically defensible but arbitrary).  
  - **Blind Spots**:  
    - Career choices (e.g., "Should I take a higher-paying job?").  
    - Non-financial family duties (e.g., caring for ill relative).  
    - Deep uncertainty (e.g., freelance income; use rolling 3y averages).  
  - **Identical Numbers, Different Answers**:  
    - A passionate environmentalist (Step 4) may give 20% while a hesitant peer gives 10% with identical finances.  
    - A client with non-financial obligations (e.g., elder care) may have a higher floor.

  **Verdict**: 13.1%, 4.0%, 9.7%
