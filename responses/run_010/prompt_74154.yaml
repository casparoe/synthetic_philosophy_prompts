  We are building a decision procedure for annual giving recommendations. The procedure must:
  1. Be grounded in the demandingness debate, explicitly choosing a baseline and defending it.
  2. Incorporate the founder's durability rule (sustainable annual amount without falling below agreed floor).
  3. Sequence questions, define sufficient answers, arithmetic to percentage.
  4. Specify where it stops (values questions) and how to handle incomplete steps.
  5. Apply to three test cases, with one uncomfortable outcome.
  6. Identify limitations and judgment points.

  ### Philosophical Grounding
  The core tension: baseline "enough" could be:
  - **Ideal theory**: What you'd owe if everyone did their share (lower demand).
  - **Nonideal theory (partial compliance)**: What you owe given others aren't doing their share (higher demand).

  We side with the **moderate nonideal theory** (defended below). This means we set the baseline above the ideal share but below the maximum possible without sacrificing basic well-being. The durability rule is retained but reinterpreted: it prevents moral failure by ensuring sustainability, but in partial compliance, we may push closer to the maximum sustainable.

  **Defense of moderate nonideal baseline**:
  - The drowning child analogy (Singer) suggests we must help even at significant cost, but the integrity objection (Williams) and demandingness worries (Scheffler) require limits.
  - Partial compliance (Murphy) argues for a division of labor: the compliant pick up some slack but not all. We set the baseline as the ideal share plus a reasonable portion of the slack (e.g., 50% of the gap between ideal and maximum sustainable). This avoids both under-demanding (ignoring urgent needs) and over-demanding (burnout, resentment, non-compliance).
  - The durability rule serves two purposes: 
    1. It operationalizes the integrity objection by protecting the client's life projects and stability.
    2. It is a pragmatic response to partial compliance: if we demand too much, the client may quit entirely. Thus, it survives contact with partial compliance by being a strategic tool for long-term impact.

  ### Decision Procedure

  **Step 1: Establish the Floor (Necessary Expenses)**
  - Question: "What are your non-negotiable financial commitments? Please include: emergency savings (minimum 3 months of living expenses), insurance (health, disability, life if applicable), retirement contributions (at least 15% of pre-tax income, including any employer match), and all debt service (minimum payments). Also include essential living costs (housing, utilities, groceries, transportation)."
  - Sufficient answer: Quantifiable amounts for each category, with the adviser helping to set reasonable minimums (e.g., if client hasn't saved, set a savings target; if retirement contribution is low, adjust upward). If client resists, use industry standards (e.g., 50/30/20 rule for needs/wants/savings, but tailored to the durability rule).
  - Handling unknowns: For variable income, use a conservative estimate (e.g., 3-year average). If client won't give numbers, use national averages for their demographic and flag the uncertainty.

  **Step 2: Calculate Discretionary Income**
  - Arithmetic: 
    - Annual after-tax income = gross income - taxes (estimate using current brackets).
    - Discretionary income = after-tax income - floor (from Step 1).
  - If discretionary income is negative, stop: client cannot give financially without adjusting floor/income. Recommend non-financial giving (time, skills) and revisit when finances improve.

  **Step 3: Determine Ideal and Maximum Sustainable Giving**
  - Ideal giving (ideal theory baseline): 
    - Question: "In a world where everyone gave their fair share, what fraction of your income do you believe would be required to address global poverty and other urgent causes?" 
    - Default: Use a standard figure (e.g., 1-5% based on global poverty estimates). We'll set at 2% as a conservative ideal (based on Singer's 5% but adjusted for average incomes in our clientele). This is a values question, so if client has no answer, use the default and note it's adjustable.
  - Maximum sustainable giving (nonideal theory): 
    - This is the highest percentage of after-tax income that meets the durability rule (can be repeated annually without falling below floor). Calculate as: 
        Max sustainable = (Discretionary income) / after-tax income
    - But we cap this at 50% of discretionary income to prevent burnout (unless client explicitly wants more). This cap is a judgment call (wearing a lab coat) based on psychology of giving.
  - Moderate nonideal baseline: 
    - Baseline giving = ideal + (0.5 * (max sustainable - ideal))
    - Why 0.5? It splits the slack between the client and the non-compliant. Adjustable per client but fixed for consistency.

  **Step 4: Values Adjustment**
  - Question: "What causes matter most to you? Are you willing to make giving a higher priority than other discretionary spending (e.g., travel, hobbies)?" 
  - This step may override the baseline: 
    - If client is highly motivated (e.g., wants to pledge publicly, has a cause they are passionate about), they may choose to give up to the maximum sustainable.
    - If client is hesitant, we might stick to the baseline or even lower (but note: lowering below baseline requires justification in nonideal theory; we might allow it only if the client is already giving time/skills or has unusual burdens).
  - Where it stops: The exact percentage within the baseline-to-max range is a values question. The adviser presents the range and the rationale, but the client chooses.

  **Step 5: Escalation Mechanism**
  - Default: Annual giving escalates with income growth (raises, bonuses) to maintain the same percentage of after-tax income. 
  - Client can choose: 
    - Fixed percentage (no escalation).
    - Escalate only part of the growth (e.g., half of each raise goes to giving).
    - Or step increases (e.g., at career milestones).
  - Trigger: Automatic with any increase in after-tax income (unless client opts out).

  **Handling Incomplete Steps**:
  - Junior adviser protocol: 
    - If a step can't be completed (e.g., variable income), use conservative estimates (worst-case scenario for income, best-case for expenses) and note the uncertainty in the plan. 
    - If client won't give real numbers, use industry averages and stress the importance of revisiting when more data is available. 
    - For values questions with no answer, use the firm's defaults and explain they can adjust later.

