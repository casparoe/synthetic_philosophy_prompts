prompt: |-
  I'm auditing a philosophy-of-history seminar this term (just for fun, I'm not in the department) and last week the guest talk was on counterfactual history, and afterwards two people from the audience got into an argument in the corridor that went on way longer then the talk itself did, and I still can't work out who won. One was Dan, a historian who works on the Balkans; the other was Ruth, who does philosophy of science. It started with that old rhyme about the missing nail that loses the shoe, the horse, the rider, the battle and the kingdom — Dan said the rhyme is basically right about history, and used the Sarajevo wrong turn as his example: the driver takes a wrong turning, the car stalls while he's trying to reverse out, Princip happens to be standing right there, the archduke dies, and from there you get the July Crisis, the war, the Russian revolutions, Versailles, the Second World War, the Cold War. So the whole shape of the twentieth century hinged on a driver's mistake, which is exactly what people mean when they say events are contingent.

  Ruth said that's a fallacy, because Dan was treating every link in the chain as equally fragile when he'd only shown anything about the first one. The wrong turn might make the *assassination* contingent, but it doesn't make the *war* contingent: Vienna had already decided it wanted a reckoning with Serbia, the mobilization timetables and the alliance system did the rest, and if Franz Ferdinand lives you get some other spark in 1914 or 1916 instead. Sensitivity at the trigger isn't sensitivity at the outcome. Dan said "some other spark" is doing all the work and is unfalsifiable — you can always say that afterwards — and anyway if any old crisis would have done it, Ruth has just conceded that the particular war that actually happened was contingent, and that's the one that mattered, since that's the one that killed those people and produced those treaties; a general war in 1917 with different alliances isn't the same event. Ruth said fine, but then he'd quietly switched claims: he started out saying the century hinged on a wrong turn, and now he was saying this particular sequence hinged on it. The first claim needs facts about robustness — how much the large-scale outcomes actually depend on the trigger — and all he'd offered was a narration of the chain that in fact happened, which proves nothing about counterfactuals, since the chain we can see is by definition the one that got realized. Dan said her robustness claim is the unargued one, because she can't produce the counterfactual either, and at least his version has an actual causal history behind it; plus, he said, the alliance system she's leaning on is itself the product of earlier accidents, so if you keep pushing structural causes back you end up with contingency all the way down. Ruth said that's conflating two different things — an arrangement can have contingent origins and still operate robustly at the moment you care about — and that "contingent" in a historian's mouth is nearly always empty, since almost anything could have gone otherwise, whereas the technical notion people borrow from chaos theory is about divergence measured in a metric, which history doesn't have. Dan said he didnt care about metrics, historians care about whether a difference makes an explanatory difference, and that isn't empty at all. By then I had to leave to catch a bus and never found out how it ended.

  Could you go through their exchange move by move and tell me who's right at each step? I'd like a rating for each of the moves above, running from clearly mistaken to clearly right, with a sentence or two of justification each — not just an overall verdict — and then a separate section on what both of them were taking for granted that neither one questioned. If you think one of them is leaning on a shaky historical claim, say so and say what the better evidence actually points to. Where it matters, please be explicit about which parts of this are settled among people who really work on counterfactuals in history and the philosophy of causation, and which parts are live disputes between competent people who disagree; I don't want a contested position dressed up as the consensus, but I also don't want everything hedged into mush. And please start with your bottom line in the very first sentence — who's more right overall, in one line — and then give the reasoning, with no preamble and no restating of my question.
