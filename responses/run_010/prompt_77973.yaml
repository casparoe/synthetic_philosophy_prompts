prompt: |-
  I've been running utilization review at a mid-size regional health plan for about six years now — we decide whether a requested service is "medically necessary" and therefore covered. It used to be one reviewer per case, but our state regulator and our own board have been pushing us toward panel review, on the theory that five heads beat one. My deputy is fully converted: he keeps citing some pop book about the wisdom of crowds, and over lunch last week he told me something like "if each reviewer is sixty percent likely to get it right, then five of them are basically always right," and I couldn't work out whether he was making a real point or mangling one. I did a philosophy minor years ago and I half-remember the Condorcet jury theorem from a social epistemology class — each voter more likely right than wrong, votes independent, and majority accuracy climbing toward certainty as the group gets bigger — but I also vaguely remember that people have objections to it that I never properly absorbed. What I want is for you to turn whatever that theorem and its standard criticisms actually establish into a decision procedure my team can run.

  Some shape of the operation so the thing is realistic. Panel-eligible referrals run about 200 a month; standard cases have to be decided in 72 hours and urgent ones in 24. A panel is normally two physicians, two nurses, and one non-clinical reviewer, and I chair. Everyone is trained on the same criteria manual and the same internal e-learning module, which I think means that when they get it wrong they tend to get it wrong together — I don't know whether that breaks the independence the theorem wants, or whether shared training is fine so long as the training is accurate, and I'd like a straight answer on that rather than a hedge. They deliberate out loud before voting and our senior physician sets the tone; I've watched nurses change their votes to fall in line, which I assume is its own problem. Some determinations look like clean criterion-application questions (does this patient meet this documented threshold), and others are ones where equally good clinicians just disagree and I'm not sure there's a fact of the matter at all. Our appeals data is the part that keeps me up: overturn rate on appeal is about 8 percent overall, but roughly 40 percent for adolescent partial-hospitalization psychiatric cases and about 35 percent for ultra-rare-disease therapies. Our medical director signs off on everything and cares a lot about like cases being treated alike, which pushes toward panels, but the panels are also where I see the most variance.

  So: give me a worksheet, maybe two pages, that a nurse or a physician could actually pick up and work through without any philosophy. I want an intake triage that sorts referrals into panel / single specialist / escalate-to-a-human-because-this-is-a-values-question lanes, then the questions to ask in order with what counts as a sufficient answer to each, and where the procedure simply stops with a no. Tell me how we should aggregate once we're in the room — plain majority, unanimity, or voting on each criterion separately and deriving the conclusion, including what to do when a panel agrees on every criterion and still splits on the answer. Say whether we should ever go to seven or nine reviewers, and be blunt if for one of our categories the honest recommendation is "stop using panels here," even though panels are my whole mandate. Run it on three cases: a routine advanced-imaging request for a patient with uncomplicated low back pain; a partial-hospitalization program for a 16-year-old where the risk assessment is genuinely contested; and a gene therapy for an ultra-rare disorder that nobody on our panel has ever seen. Then flag which steps of your own procedure are judgment calls dressed up as procedure, what the whole thing can't settle, how it will misfire, and what I should watch in our overturn data to catch it misfiring. Please don't send me a reading list or citations — I can't look anything up during work hours anyway and I'm not writing a paper. One inequality of arithmetic is fine if it earns its place, but keep the rest in plain language.
reasoning: |-
  We are designing a decision procedure for utilization review that sorts cases into appropriate review lanes and provides a clear method for panel reviews. The procedure must account for dependencies among reviewers, the nature of the case, and the potential for groupthink. We also note the high overturn rates in specific categories (adolescent psychiatric and ultra-rare diseases).

  Key issues:
  1. Independence of reviewers: Shared training and deliberation may break independence. We need to mitigate this.
  2. Nature of the case: Some cases are straightforward criterion applications, others involve clinical judgment or values.
  3. Panel size: When to use single vs. panel and when to use larger panels.
  4. Aggregation method: Majority vote, unanimity, or criterion-by-criterion?
  5. Triage: How to route cases appropriately.

  We'll design a two-page worksheet (described in text) with the following sections:

  **Page 1: Triage and Routing**

  Step 1: Intake Triage (for each referral)
    - Ask: "Is the requested service for an adolescent psychiatric partial-hospitalization program or an ultra-rare-disease therapy?" 
      - If YES, route to "Escalate" lane (see Step 2).
    - Otherwise, ask: "Does the request involve a clear, documented threshold that is either met or not met (without ambiguity) and without conflicting expert opinions in the documentation?"
      - If YES, route to "Single Specialist" (a single reviewer with expertise in that area).
      - If NO, route to "Panel Review".

  Step 2: Escalate Lane (for adolescent psychiatric and ultra-rare diseases)
    - These cases are high-risk and have high overturn rates. They require a different approach.
    - Route to a special panel that includes:
        - At least one external expert (for rare diseases, an expert in that disease; for adolescent psychiatric, a child psychiatrist with specific experience in partial hospitalization programs).
        - The panel must have at least 3 members (including the external expert) and the medical director must be present or review the decision.
    - Also, note: For these cases, the panel must be given extra time (if possible) and access to external guidelines and literature.

  **Page 2: Panel Review Procedure**

  Step 1: Pre-deliberation Independent Assessment
    - Before meeting, each panelist independently reviews the case and fills out a standard form that includes:
        - The specific criteria from the manual that apply.
        - For each criterion, mark: Met, Not Met, or Unclear.
        - Overall determination: Approve or Deny.
    - The form must be submitted before the meeting.

  Step 2: Deliberation
    - The chair (you) leads the discussion. The goal is to discuss the criteria and resolve ambiguities, not to reach consensus.
    - Rule: Each panelist must explain their reasoning without pressure to conform. The chair must explicitly ask for dissenting views.

  Step 3: Voting
    - Vote on each criterion separately (if the case is criterion-based) and then on the overall determination.
    - How to vote:
        a. If all criteria are clear (all Met or all Not Met) then the overall decision is straightforward.
        b. If there is ambiguity in one or more criteria, then vote on each ambiguous criterion (show of hands: Met or Not Met) and then on the overall.
    - Overall determination vote: 
        - Use majority vote (if 5 panelists: 3 or more for a decision).
        - If the vote is split (e.g., 2-2 in a 4 panelist case, but note we have 5) then the chair breaks the tie.
        - If the panel agrees on every criterion but splits on the overall (rare, but possible if there is a disagreement on the weight of criteria), then the panel must re-examine the criteria and the manual. If still split, the chair breaks the tie.

  Step 4: Special Cases and Panel Size
    - For routine cases (like uncomplicated low back pain) a standard 5-member panel is sufficient.
    - For cases that are highly complex or where there is known high variance (like the ones we escalate) we use the special panel (with external expert and at least 3 members) and consider a 7-member panel if available and if time permits (but note time constraints: 24/72 hours). However, given time constraints, we must balance. For ultra-rare diseases, the external expert may be the key.
    - When not to use panels? 
        - For routine cases that meet clear criteria (which we routed to single specialist) and for the high-risk cases we have a special process (which is a form of panel but with external input). 
        - In the two high-risk categories (adolescent psychiatric and ultra-rare diseases), we do use panels but with modifications. However, if we cannot secure an external expert in time, then we must make a decision with the available panel but note the increased risk of error.

  **Worksheet for Panel Review (to be filled by each panelist independently before meeting):**

  [Case ID] 
  [Reviewer Name] 
  Date: 

  1. List the criteria from the manual that apply to this case: 
     Criterion 1: [ ] Met [ ] Not Met [ ] Unclear (Comments: _____)
     Criterion 2: [ ] Met [ ] Not Met [ ] Unclear (Comments: _____)
     ...

  2. Overall determination: [ ] Approve [ ] Deny

  3. Reasoning (briefly): 

  **Aggregation in the Room:**
  - The chair collects the independent forms.
  - During deliberation, the chair notes areas of agreement and disagreement.
  - Voting on criteria: Only for criteria marked "Unclear" by any panelist or if there is disagreement in the pre-meeting forms.
  - Overall vote: Taken after the criteria are resolved (if possible) or without if time does not permit. However, the independent overall votes are also considered.

  **Running the Cases:**

  Case 1: Routine advanced-imaging request for uncomplicated low back pain.
    - Triage: Clear criteria? Yes (typically, imaging for uncomplicated low back pain is not indicated without red flags). Route to single specialist.
    - If for some reason it went to panel (e.g., ambiguity in documentation): 
        - Pre-meeting independent assessment: Each panelist checks criteria (e.g., presence of red flags, duration, etc.). 
        - Likely they will all agree on criteria and overall (deny). 
        - If there is disagreement, then vote. Majority rules.

  Case 2: Partial-hospitalization for a 16-year-old with contested risk assessment.
    - Triage: Adolescent psychiatric -> Escalate lane.
    - Special panel with external child psychiatry expert. 
    - Pre-meeting independent assessment: Each panelist (including the external expert) fills the form.
    - Deliberation: Focus on the risk assessment. The external expert provides guidance. 
    - Vote: Majority. If split, the chair breaks the tie (but note, the external expert's opinion should carry more weight? However, we are using majority to avoid one person dominating). Alternatively, we could require a supermajority? But we'll stick with majority to avoid gridlock.

  Case 3: Gene therapy for an ultra-rare disorder.
    - Triage: Ultra-rare -> Escalate lane.
    - Special panel with external expert in that disorder (or at least in rare genetic disorders). 
    - Pre-meeting: Independent assessment. The external expert may provide literature.
    - Deliberation: Focus on the criteria for experimental treatments, medical necessity, and available evidence.
    - Vote: Majority.

  **Critical Self-Assessment of the Procedure:**

  1. Judgment calls dressed as procedure:
     - In triage, deciding what is "clear" and "without ambiguity" is subjective. We rely on the triage nurse or physician to make that call. To mitigate, we can have a second person review the triage decision for a random sample.
     - The definition of "unclear" criterion in the panel form is also a judgment call.

  2. What the procedure can't settle:
     - Cases where there is genuine clinical disagreement (equipoise) or where the criteria manual is silent or ambiguous. In such cases, the panel's decision may be arbitrary. We must document and flag for manual updates.
     - Values questions (e.g., how much risk is acceptable) are not resolved by the procedure. We rely on the manual and the panel's clinical judgment.

  3. How it will misfire:
     - Groupthink: Even with independent pre-assessment, the deliberation might sway votes. We must train the chair to encourage dissent.
     - Dependencies: Shared training means shared biases. If the training is flawed, the entire panel may be wrong. We must monitor overturn rates and update training.
     - External experts may not be available in time.

  4. Monitoring for misfires:
     - Track overturn rates by category and by panel. 
     - Specifically, for the two high-risk categories, we expect the overturn rate to decrease with the new procedure. If not, we must re-evaluate.
     - Also track the rate of "Unclear" criteria and cases sent to escalation. High rates may indicate the manual needs updating.

  **Blunt Recommendations:**
  - For the two high-risk categories (adolescent psychiatric and ultra-rare diseases), we must use the escalated process with external input. If we cannot get an external expert, we are operating at high risk of error. Consider building a network of on-call experts.
  - For routine cases with clear criteria, single reviewer is sufficient and faster. Using a panel there is a waste of resources and may introduce unnecessary variance.

  **Conclusion:**
  This procedure provides structure while acknowledging limitations. The key is to enforce independence in the initial assessment and to have a clear voting mechanism. The triage step is critical to allocate resources appropriately. We must continuously monitor and adjust based on appeal outcomes.
answer: |-
  ### Utilization Review Decision Procedure Worksheet  
  **For nurses, physicians, and non-clinical reviewers**  
  *Goal: Ensure consistent, accurate coverage decisions while minimizing appeals. Use this 2-page worksheet for all panel-eligible referrals.*

  ---

  ### **PAGE 1: INTAKE TRIAGE (DECIDE REVIEW LANE)**  
  *Complete within 4 hours of referral.*  
  **Step 1: Ask these questions in order:**  
  1. **"Is this for adolescent partial-hospitalization psych OR an ultra-rare-disease therapy?"**  
     - **YES** → Route to **ESCALATE LANE** (skip to Step 2).  
     - **NO** → Proceed to Question 2.  

  2. **"Is the request unambiguous? (i.e., the criteria manual has clear thresholds, all documentation is present, and no expert opinions conflict in the file.)"**  
     - **YES** → Route to **SINGLE SPECIALIST** (assign to one expert in that specialty; no panel needed).  
     - **NO** → Route to **STANDARD PANEL** (5 reviewers).  

  3. **"Does the request involve non-medical values? (e.g., ethical dilemmas, quality-of-life trade-offs not covered in the manual)"**  
     - **YES** → Route to **ESCALATE LANE**.  
     - **NO** → Proceed to Standard Panel.  

  **Step 2: Escalate Lane Rules**  
  - **Who handles it:** Medical Director + 1 external specialist (e.g., pediatric psychiatrist for adolescent cases, rare-disease expert for gene therapy).  
  - **Deadline:** 24 hours for urgent cases, 72 hours for standard.  
  - **Output:** Document the final decision and the values-based rationale. Panels *alone* are insufficient here.  

  **Triage Summary:**  
  | Case Type                          | Review Lane               | Reason                                  |  
  |------------------------------------|---------------------------|-----------------------------------------|  
  | Adolescent psych / Ultra-rare      | Escalate Lane             | High appeal risk; expertise gap         |  
  | Unambiguous criteria               | Single Specialist         | Efficiency; no discretion needed        |  
  | Ambiguous criteria                 | Standard Panel (5 people) | Multiple viewpoints improve accuracy    |  
  | Values-based conflict              | Escalate Lane             | Panels cannot resolve moral questions   |  

  ---

  ### **PAGE 2: PANEL REVIEW PROCEDURE (FOR STANDARD PANEL)**  
  *Complete within 24h (urgent) or 72h (standard). Panel = 2 physicians + 2 nurses + 1 non-clinical reviewer. You chair.*  

  **Step 1: Pre-Deliberation Independent Review**  
  - **Action:** Each reviewer privately answers **without discussion**:  
    - *“Does the patient meet all criteria in the manual? YES / NO.”*  
    - *“Is there any ambiguity? (e.g., missing records, conflicting data)”*  
  - **Why:** Prevents groupthink. Shared training *breaks independence* if opinions are aired before private judgment.  

  **Step 2: Deliberation Process**  
  - **Chair’s Role:**  
    - Read all private answers aloud (e.g., “3 YES, 2 NO”).  
    - Lead discussion: Focus **only on criteria gaps** (e.g., “Nurse 2 noted missing pain-scale data. Can we resolve this?”).  
    - **Silence the senior physician first.** Require all to speak before they do.  
  - **Stop discussion if:**  
    - Debate shifts to values (e.g., “Is this teen *worth* saving?”) → Escalate to Medical Director.  
    - Personal opinions dominate (e.g., “In my experience…”) → Return to manual criteria.  

  **Step 3: Voting & Aggregation**  
  - **Vote on CRITERIA first (not the outcome):**  
    - List each manual criterion (e.g., "Pain >6/10 for 3+ months," "Failed physical therapy").  
    - Majority vote per criterion (3/5 = passes).  
  - **Final Decision:**  
    - **IF all criteria pass → APPROVE.**  
    - **IF any criterion fails → DENY.**  
    - **IF criteria pass but panel deadlocks (e.g., 3 approve/2 deny overall) → Your tiebreaker as chair.**  
  - **DO NOT USE:** Unanimity (too slow) or pure majority on outcome (ignores criteria).  

  **When to Expand the Panel?**  
  - **Use 7 reviewers ONLY if:**  
    - Initial vote is split (3-2) AND criteria are subjective (e.g., "severe impairment").  
    - Rare-disease cases (if not escalated).  
  - **Never use 9 reviewers:** Diminishing returns; slows decisions.  
  - **Stop using panels for:**  
    - **Adolescent psych / ultra-rare cases** (use Escalate Lane).  
    - **"Gray area" cases where appeals exceed 20%** (data shows panels worsen consistency).  

  ---

  ### **RUNNING THE PROCEDURE: 3 EXAMPLE CASES**  
  **Case 1: Routine MRI for Uncomplicated Low Back Pain**  
  - **Triage:** Unambiguous? YES (manual: no imaging without red flags) → **Single Specialist**.  
  - **Outcome:** Deny (no red flags in file).  
  - **Why no panel?** Criteria clear; panel risks overcomplicating.  

  **Case 2: Partial-Hospitalization for 16-Year-Old (Contested Risk)**  
  - **Triage:** Adolescent psych → **Escalate Lane** (Medical Director + external child psychiatrist).  
  - **Process:** External expert provides risk assessment. Director makes values-based call.  
  - **Outcome:** Document rationale (e.g., “Approved due to suicide attempt in past 48h”).  

  **Case 3: Gene Therapy for Ultra-Rare Disease**  
  - **Triage:** Ultra-rare therapy → **Escalate Lane** (Medical Director + specialty MD from national network).  
  - **Process:** External expert interprets evidence. Avoid internal panel (lacks expertise).  
  - **Outcome:** If evidence equivocal, default to APPROVE (40% appeal overturn risk suggests under-approval).  

  ---

  ### **LIMITATIONS & MONITORING**  
  **Where This Procedure is a Judgment Call:**  
  1. **Triage ambiguity:** “Unambiguous” is subjective. Audit 10% of single-specialist cases monthly for consistency.  
  2. **Criteria voting:** Manual may not cover all scenarios. Flag gaps for manual updates quarterly.  
  3. **Chair’s tiebreaker:** Your experience biases this. Disclose conflicts in writing.  

  **What It Can’t Fix:**  
  - **Biased training:** If the manual is flawed, all reviewers will err together → Track overturn rates by training module.  
  - **Values disputes:** Panels cannot decide “fairness” → Escalate quickly.  
  - **Rare diseases:** Lack of data means decisions are probabilistic → Default to approval if no expert consensus.  

  **How It Misfires & How to Catch It:**  
  | Failure Mode              | Early Warning Sign                     | Action                                  |  
  |---------------------------|----------------------------------------|-----------------------------------------|  
  | Groupthink in panels      | Overturn rate ↑ in unanimous decisions | Require dissent documentation           |  
  | Overuse of single-reviewer| Overturn rate ↑ in simple cases        | Randomly assign 10% to panels for QC    |  
  | Under-escalating          | Appeal rate >30% in psych/rare cases   | Automatically escalate all in category  |  

  **Watch Your Data:**  
  - **Overturn rate >15% in ANY category?** Stop panels there; use Escalate Lane.  
  - **Variance between panels >20%?** Randomize reviewer assignments; audit chair influence.  
  - **Appeals cite "missed criteria"?** Update training; add specificity to manual.  

  ---  
  **Final Note:** Panels improve accuracy only if reviewers are independent and cases have medical facts to find. Where those fail (e.g., values, expertise gaps), this procedure forces escalation. Track appeal rates monthly—if overall overturns don’t drop by 25% in 6 months, revert to single-reviewer for all non-psych/non-rare cases.**
