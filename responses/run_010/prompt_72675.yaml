  We are designing an activity for high school students to experience the pitfalls of overconfident forecasting and the value of the outside view. The activity must meet several learning objectives and constraints. We'll brainstorm four distinct skeletons, then choose one to develop fully.

  Brainstorming four activity skeletons:

  1. **The Construction Challenge**
     - **Task**: Groups build a structure (e.g., tower) using limited materials (index cards, tape) within a time limit. They forecast the height they will achieve.
     - **Teach**: Detailed planning (inside view) can lead to overconfidence. They are given base rates from previous classes (outside view) but may ignore them.
     - **Limitations**: The task might be too engaging in the building aspect, and the forecasting might become secondary. Also, the base rates are from other groups, so the task must be standardized.

  2. **The Estimation Quiz**
     - **Task**: Groups answer a set of numerical estimation questions (e.g., weight of an object, time to complete a puzzle). They forecast their answers and provide confidence intervals.
     - **Teach**: They see that their detailed reasoning doesn't necessarily beat the base rate. They can choose which reference class to use (e.g., all students, only their grade).
     - **Limitations**: The questions must be such that the base rates are available and meaningful. Also, the task might feel like a test, causing anxiety.

  3. **The Production Line**
     - **Task**: Groups act as a factory producing a product (e.g., folding paper airplanes) and forecast how many they can make in a fixed time. They plan their process in detail.
     - **Teach**: The vividness of the plan (inside view) can lead to overestimation. They are given base rates from previous runs and must choose a reference class.
     - **Limitations**: The physical activity might overshadow the forecasting lesson. The base rates must be from a very similar setup.

  4. **The Puzzle Solving**
     - **Task**: Groups solve a complex puzzle (e.g., a logic puzzle) and forecast how long it will take. They are given base rates from other groups who solved the same puzzle.
     - **Teach**: Planning the steps can make them overconfident. They must confront the base rate and might try to narrow the reference class.
     - **Limitations**: The puzzle might be too hard or too easy, leading to frustration or boredom. The time forecast might be affected by factors not in the base rate.

  Choosing one: The **Production Line** task (skeleton 3) seems most fitting because:
  - It involves a physical activity that is engaging but can be standardized.
  - The forecasting (number of units produced) is directly tied to the plan and the vividness of the process.
  - It naturally allows for base rates from previous runs (with variations in reference classes).
  - It can be run in a noisy room with the materials available.

  Now, we develop the Production Line activity in full.

