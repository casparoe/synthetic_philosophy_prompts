  **Activity Title**: The Paper Plane Factory

  **Learning Objectives**:
  1. Experience how detailed planning can lead to overconfident forecasts (inside view).
  2. Confront the base rate (outside view) and see that even with it, groups place themselves above average.
  3. Practice choosing a reference class and see how it can be motivated to make one's group look exceptional.
  4. Learn that epistemic modesty is a practice (e.g., adjusting forecasts based on evidence) and that sometimes groups are exceptional.

  **Materials**:
  - Paper (for making planes)
  - Pens
  - Index cards (for forecasting and role assignments)
  - Masking tape (to mark workstations)
  - Whiteboard (to display instructions and base rates)
  - Phone timer
  - One six-sided die per group (for a twist in the production, see below)
  - Point currency: "Factory Tokens" (just points on paper)

  **Room Setup**:
  - Clear the floor for workstations. Use masking tape to mark a 1m x 1m square for each group (about 4-5 groups of 4-5 students each, given 19 students).
  - Each workstation has a stack of paper (e.g., 50 sheets) and a die.
  - Whiteboard at front for instructions and base rates.

  **Roles**:
  - **Forecaster**: Makes the group's forecast and is responsible for the final estimate. Only this role can write the forecast.
  - **Planner**: Leads the planning of the production process (how to fold, assembly line, etc.). Must not see the base rate data until after the forecast is made.
  - **Worker(s)**: Actually fold the planes. There can be multiple workers.
  - **Librarian (Red Team)**: Given the "case file" (base rate data from a previous run). They are forbidden from hearing the group's plan. They are responsible for choosing a reference class and reporting the base rate to the group when asked. They do not participate in planning or production.

