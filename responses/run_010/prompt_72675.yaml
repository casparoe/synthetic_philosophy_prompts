     - Groups produce paper planes for 5 minutes. They must start and stop when the timer goes. Planes must be flyable (instructor can define: must have wings and be able to be thrown). Any plane that doesn't meet the standard is discarded. Count only whole planes (if they are folding when time ends, it doesn't count).

  6. **Counting and Recording (5 min)**:
     - Groups count their planes (including quality control: discard any that are incomplete or not flyable). The instructor records the counts and determines the bucket for each group.

  *Session 2 (Day 2):*

  7. **Scoring (15 min)**:
     - Groups compute their own forecasting scores using the formula. The instructor verifies.
     - They also record their production points (number of planes).
     - Total points = Production Points + Forecasting Points.

  8. **Debrief (30 min)** - Structured discussion (see below).

  **Timeline for Session 1 (Day 1: 45 min)**:
  - 0-5 min: Introduction and rules.
  - 5-10 min: Role assignment and handing out case files to Librarians.
  - 10-25 min: Planning phase (15 min).
  - 25-35 min: Forecasting phase (10 min) - Forecasters fill out an index card with the group's probability distribution and hand it to the instructor.
  - 35-40 min: Production (5 min).
  - 40-45 min: Counting and cleanup.

  **Timeline for Session 2 (Day 2: 45 min)**:
  - 0-15 min: Scoring (each group computes their production points and forecasting points, then total). Instructor writes the results on the whiteboard.
  - 15-45 min: Debrief (30 min).

  **Debrief Questions and Structure**:

  1. **What happened?** (5 min)
     - "Look at the whiteboard: what patterns do you see in the forecasts and the actual production? How did your group's forecast compare to the actual? How did it compare to the base rate?"

  2. **Inside vs. Outside View** (10 min)
     - "Planners: How did you come up with your forecast? What details of your plan made you confident?"
     - "Librarians: What base rate did you provide? How did the group react when you gave it?"
     - "Did any group choose a reference class that made them look exceptional? Why that class? How did you decide?"

  3. **The Motivated Move** (5 min)
     - "Did any group feel the base rate didn't apply to them? Why? How did you justify that?" (Expect one group to say, "We had a practice round" or "We had an expert".)
     - "Let's hear from that group: Why did you choose that reference class? How did you know you were better than the average of that class?"

  4. **Calibration** (5 min)
     - "Some groups were exceptional (above the base rate) and some were below. How did the forecasting points reflect that? Did the groups that were above the base rate get high forecasting points only if they assigned high probability to the right bucket? What about groups that were below?"

  5. **Epistemic Modesty** (5 min)
     - "What would it look like to be epistemically modest in this activity? How could you have adjusted your forecast? What price would you have paid if you had been more modest? (e.g., if you lowered your forecast and then you were exceptional, you would have lost forecasting points.)"

  6. **Takeaways** (5 min)
     - "When in real life might you use the inside view? When the outside view? How can you practice this?"

  **Handling the Objection**: When a student says, "The base rate doesn't apply to us because [reason X]", ask:
     - "What evidence do you have that you are different? How strong is that evidence? How often do people in that reference class (e.g., with a practice round) actually beat the average? (Point to the base rate for that class.)"

  **Predictable Problems**:
  1. **Gaming the scoring rule by spreading evenly**: They get 120 points (as in the example) which is not terrible. Point out in debrief: "This group was very uncertain and got a middling score. If they had known they were uncertain, that's good. But if they were actually very sure and spread it out to game, that's not honest. The scoring rule rewards honesty in the long run."

  2. **Student who has done the task before**: They might be truly exceptional. That's okay. The lesson is not that the base rate always wins, but that you should adjust based on evidence. If they have strong evidence (like being an expert), then they can adjust the base rate. But the group might overstate that evidence.

  3. **Public humiliation of being wrong**: Emphasize that the goal is learning, not being right. The forecasting points are designed so that even if you are wrong, if you were appropriately uncertain, you get points. Also, the production points reward effort.

  4. **Group finishes early and heckles**: Have a contingency: if they finish planning early, they can do a practice round? But in the planning phase, they can practice folding. In production, they must wait for the timer. If they finish scoring early, they can help others or think about the debrief questions.

  **What the Activity Cannot Reproduce**:
  - **The long-run calibration**: In real life, we get feedback over many forecasts. Here, they only do one. So they might not see that the inside view consistently leads to overconfidence. Therefore, in the debrief, we must emphasize that the psychological literature shows this is a systematic bias.

  **Final Materials List**:
  - Paper: 50 sheets per group.
  - Index cards: for roles and forecasting (one per group for the forecast).
  - Pens: several per group.
  - Masking tape: to mark workstations.
  - Whiteboard markers.
  - Phone timer.
  - One six-sided die per group (to add variability: they must roll the die for each plane? Actually, we haven't used it. Let's integrate: In the production, for each plane, they must roll the die. If it lands 1, the plane is defective and doesn't count. This adds uncertainty and variability so that even with a good plan, they might have bad luck. It also makes the base rates more meaningful because the pilot run had the same rule. This also prevents a group from being too confident because of luck.)

  **Adjustment for the die**: Each plane requires a die roll. If it's 1, the plane is discarded. So the expected production is reduced, but it adds randomness that cannot be planned away. This helps in creating a distribution in the base rates.

  **Base Rate Data from Pilot**: 
  - We ran with 5 groups in a different class. The results (example):
    Group1: 30 planes attempted, 5 were defective (die roll 1) -> 25 planes.
    Group2: 28 attempted, 4 defective -> 24.
    Group3: 40 attempted, 6 defective -> 34.
    Group4: 20 attempted, 3 defective -> 17.
    Group5: 35 attempted, 5 defective -> 30.

    We also recorded for each group: 
      - Practice round: Groups 1,3,5 had one (2 minutes practice before the real run).
      - Prior experience: Group2 had one member who had done it before.
      - Used assembly line: Groups 3 and 5.

    Then the base rate tables (for Librarians) would be:

    Table 1 (All groups): 
        Planes produced: 25,24,34,17,30 -> mean=26, std=6.2, min=17, max=34.
        Histogram buckets: 0-10,11-20,21-30,31-40,41+ -> one group in 11-20 (17), three in 21-30 (25,24,30), one in 31-40 (34).

    Table 2 (Groups with practice round): Groups1,3,5: 25,34,30 -> mean=29.7, std=4.5, min=25, max=34. Histogram: one in 21-30 (25,30), one in 31-40 (34).

    Table 3 (Groups without practice): Groups2,4: 24,17 -> mean=20.5, std=4.9.

    Table 4 (With prior experience): Group2: 24 -> so only one data point.

    Table 5 (Without prior experience): the rest.

    Table 6 (Assembly line): Groups3,5: 34,30 -> mean=32.

    This gives Librarians material to choose from.

  **Exact Wording for Instructions**:

  Introduction: 
    "Today and next meeting, we are running a paper plane factory. Your group's job is to produce as many paper planes as possible in 5 minutes. But first, you must forecast how many you will produce. You will earn Factory Tokens for both the number of planes and the accuracy of your forecast. These tokens will determine your snack choices next meeting.

    Each group has four roles:
      - Planner: Leads the planning of how to fold and organize. You must not look at the base rate data until after the forecast is made.
      - Workers: Fold the planes during production.
      - Forecaster: Responsible for the final forecast. You will talk to the Planner and the Librarian to make the forecast.
      - Librarian: Holds the case file with base rate data from a previous run. You must not participate in planning. When the Forecaster asks, you can share the base rates.

    Steps:
      1. Planning: 15 minutes. Planner and Workers plan the process. Librarian reads the case file without joining the planning.
      2. Forecasting: 10 minutes. Forecaster, with input from Planner and Librarian, assigns probabilities to the five buckets (which are written on the board). Fill out the index card and hand it to me.
      3. Production: 5 minutes. Each plane must be flyable (I'll show an example) and you must roll the die for each plane: if it lands 1, it's defective and doesn't count. 
      4. Counting: Count only the good planes and tell me the number.

    Forecasting: 
      - The buckets for the number of planes are: 0-10, 11-20, 21-30, 31-40, 41+.
      - Assign a percentage (0 to 100) to each bucket. They must add to 100.
      - Forecasting points = 200 - ( [ (P1 - I1)^2 + (P2 - I2)^2 + (P3 - I3)^2 + (P4 - I4)^2 + (P5 - I5)^2 ] / 100 )
        where I_i is 100 if the actual falls in bucket i, 0 otherwise.

    Production points: The number of good planes.

    Total points = Production points + Forecasting points.

    Let's begin by assigning roles."

  **Conclusion**:
  This design meets the objectives and constraints. It uses two sessions to allow for preparation and debrief. The activity creates conditions for the inside view (planning) to lead to overconfidence, and the outside view (base rates) to be available but potentially ignored. The Librarian role institutionalizes the separation of information. The scoring rule is proper and computable. The debrief ties the experience to the concepts. The die roll introduces randomness so that even the best plan can have bad luck, making the base rates more relevant.

  **One Conflict**: The constraint of no real money and using a point currency is met. However, the scoring rule requires some arithmetic that might be challenging in two minutes. We broke the constraint slightly by allowing the division by 100, but it is manageable. Alternatively, we could have used a simpler task with a point estimate and a different scoring rule? But that would not capture the probability distribution. We chose to keep the distribution to teach about uncertainty.

  We hope this activity will be engaging and instructive!
