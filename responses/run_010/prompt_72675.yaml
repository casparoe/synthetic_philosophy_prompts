  ### Brainstormed Activity Skeletons

  1. **Bridge Building Challenge**  
     *Task*: Groups design and build a bridge from paper and tape to hold weight (books), forecasting the maximum books held.  
     *Teaches*: Vivid planning leads to overconfidence; base rates from prior classes show typical failure points.  
     *Limitation*: Construction variability may overshadow forecasting; hard to standardize "exceptional" outcomes.  

  2. **Code-Cracking Race**  
     *Task*: Groups solve a cipher (e.g., substitution code) using clues, forecasting their solution time.  
     *Teaches*: Detailed strategy breeds overconfidence; base rates highlight average times.  
     *Limitation*: Skill disparities may dominate; hard to isolate planning fallacy from aptitude.  

  3. **Supply Chain Simulation**  
     *Task*: Groups "manufacture" paper shapes (e.g., triangles) via assembly line, forecasting units produced in 5 minutes.  
     *Teaches*: Planning intensity inflates forecasts; base rates from pilot data force reference-class choices.  
     *Limitation*: Physical chaos may obscure cognitive lessons; scoring computability challenges.  

  4. **Escape Room Puzzle**  
     *Task*: Groups solve interconnected riddles (e.g., math puzzles) on index cards, forecasting completion time.  
     *Teaches*: Plan vividness distorts realism; base rates expose typical overestimation.  
     *Limitation*: Puzzle familiarity biases results; hard to ensure groups feel "exceptional" legitimately.  

  **Chosen Skeleton**: **Supply Chain Simulation**  
  *Why*: Best balances physical engagement with forecasting focus. Standardized output (units) enables clean base rates, and manufacturing metaphors naturally separate planners from data handlers.  

  ---

  ### Fully Developed Activity: **The Paper Widget Factory**  
  **Core Experience**: Groups run a "factory" assembling geometric paper shapes. They forecast units produced, using pilot data for base rates. The Librarian role enforces separation between planners and reference-class data.  

  **Learning Flow**:  
  - **Inside view trap**: Detailed planning → overconfident forecast.  
  - **Base rate neglect**: Groups ignore/dismiss pilot data.  
  - **Reference-class gaming**: Groups cherry-pick favorable comparisons.  
  - **Calibration, not surrender**: Some groups beat base rates fairly.  

  **Materials per Group**:  
  - Paper (50 sheets), pens, masking tape, 6-sided die, index cards.  
  - **Shared**: Whiteboard, phone timer.  
  - **Pilot Data Case File**: Results from prior run (different class) showing:  
    - All groups (mean: 22 units, SD: 5, min: 12, max: 33).  
    - Subsets: Used assembly line (mean: 27), no assembly line (mean: 17); had practice (mean: 25); no practice (mean: 19); had "expert" (mean: 29).  

  **Room Setup**:  
  - Tape 4–5 factory "floor" zones (1m² each).  
  - Whiteboard displays:  
    - Buckets for forecasting: 10–19, 20–29, 30–39, 40–49, 50+ units.  
    - Scoring rule: `Points = 200 - [ (P1 - I1)^2 + (P2 - I2)^2 + ... ] / 100`  

  **Roles per Group (4–5 students)**:  
  - **Planner**: Designs assembly process; banned from seeing base rates.  
  - **Workers (2–3)**: Fold/draw shapes; execute plan.  
  - **Forecaster**: Assigns probabilities to outcome buckets; submits final forecast.  
  - **Librarian**: Holds pilot data; advises on reference classes; banned from planning.  

  **Timeline (Two 45-Minute Sessions)**:  

  #### Session 1: Forecasting and Production (45 min)  
  | Time  | Phase                  | Instructions/Key Actions |  
  |-------|------------------------|--------------------------|  
  | 0–5   | **Intro & Roles**      | *Read aloud*: "Your factory assembles paper widgets. Each widget: 1) Draw shape (circle/triangle) on paper, 2) Fold paper twice, 3) Tape edges. Quality control: Roll die—1–3 = valid, 4–6 = defect (discard). Forecast total *valid* widgets in 5 min. Points = Production + Forecasting accuracy. Librarians: Do NOT share pilot data until Forecasters ask." Assign roles via index cards. |  
  | 5–20  | **Planning**           | Planners/Workers design process (e.g., assembly line). Librarians review case file silently. *Instructor circulates*: "Make your plan vivid! How will you beat the average?" |  
  | 20–30 | **Forecasting**        | Forecasters consult Planners (plan) and Librarians (base rates). Groups assign probabilities to buckets (e.g., 10–19: 10%, 20–29: 70%...). Submit via index card. *Instructor*: "Choose a reference class for your baseline." |  
  | 30–35 | **Production Prep**    | Clear floors. Distribute paper/tape/dice. Display timer. |  
  | 35–40 | **Production**         | 5-minute timed production. Workers build, Forecaster logs valid widgets (die roll ≥4 = defect). |  
  | 40–45 | **Count & Reset**      | Groups report valid units. Instructor records on whiteboard. |  

  #### Session 2: Scoring and Debrief (45 min)  
  | Time  | Phase                  | Instructions/Key Actions |  
  |-------|------------------------|--------------------------|  
  | 0–10  | **Scoring**            | Groups compute:  
    - **Production Points**: Valid units made.  
    - **Forecasting Points**: `200 - [Sum of (assigned% - indicator%)²] / 100`  
      *Example*: Assigned [10%, 70%, 20%, 0%, 0%]. Actual = 25 units (bucket 2).  
      `(10-0)^2 + (70-100)^2 + (20-0)^2 + (0-0)^2 + (0-0)^2 = 100 + 900 + 400 = 1400` → `1400/100 = 14` → `200 - 14 = 186`  
    Total Points = Production + Forecasting Points. |  
  | 10–40 | **Structured Debrief** | Guide discussion using Qs below. Whiteboard track key moments. |  
  | 40–45 | **Wrap-up**            | Award snack rights by points. Reinforce: "Modesty is a practice." |  

  ---

  ### Debrief Guide  
  **Map Moments to Concepts**:  
  - **Inside view damage**: "When Planner said, 'Our assembly line is perfect!' but defects spiked." → Vivid planning ignored randomness.  
  - **Base rate neglect**: "Group A used the 'all teams' base rate (mean=22) but forecasted 30+." → Data didn’t override optimism.  
  - **Reference-class gaming**: "Group B said, 'We’re like teams with experts!' but had no expert." → Motivated exceptionalism.  
  - **Calibration win**: "Group C beat the base rate by 8 units due to a novel folding method." → Legitimate exception.  

  **Critical Discussion Questions**:  
  1. *"How did your plan’s detail affect your forecast?"*  
     - **Listen for**: Overconfidence from vivid steps ("We mapped each second!") or ignoring risks ("We forgot the die rolls").  
  2. *"Did the base rate feel irrelevant? Why?"*  
     - **Listen for**: Dismissiveness ("Our plan was better") or cherry-picking ("We used the ‘expert’ class because we’re smart").  
  3. *"Which reference class did you choose? Defend why it fits."*  
     - **Listen for**: Justifications (sound: "We practiced, like this subset") vs. excuses (motivated: "We’re nothing like those slow groups").  
  4. *"When was modesty costly? When was it rewarded?"*  
     - **Listen for**: Recognition that underconfidence lost points if they outperformed, but overconfidence was punished harder.  
  5. *"Would you change your process after seeing results?"*  
     - **Listen for**: Shifts toward hybrid thinking ("Start with base rate, adjust for our innovations").  

  **Responding to "The base rate doesn’t apply to us!"**:  
  - *Say*: "What specific evidence makes you exceptional? How strong is it? If your evidence is weak (e.g., ‘We tried harder’), why is that stronger than the data from 20 groups? Calibration means weighing *how* exceptional you truly are."  

  ---

  ### Predictable Problems & Solutions  
  1. **Gaming the scoring rule** (e.g., equal probability spread):  
     - *Fix*: Pre-calculate scores for uniform spread (e.g., 120 points) and show it’s a safe but low-reward strategy.  

  2. **Student with prior task experience**:  
     - *Fix*: Assign them as Librarian. If they’re a Worker, note their impact in debrief: "Is one expert enough to ignore base rates?"  

  3. **Public humiliation from failure**:  
     - *Fix*: Emphasize forecasting points reward honesty, not optimism. Have groups self-score to reduce spotlight.  

  4. **Group finishes early and heckles**:  
     - *Fix*: Assign "process observer" role to idle members ("Track how often workers wait for materials").  

  ---

  ### What the Activity Cannot Teach  
  - **Long-term calibration**: A single trial can’t show that inside views *consistently* fail. *Supply in words*: "Studies show planners overestimate 20–50% of the time. One win doesn’t mean your gut is reliable."  

  ### Design Tradeoffs  
  - **Constraint broken**: Scoring rule requires squaring numbers. *Why*: Proper scoring is non-negotiable for lesson integrity. Hand-calculation is feasible with 2-digit arithmetic (provide step-by-step worksheet).  
  - **Constraint kept**: Pilot data ensures base rates are real. Librarian role operationalizes epistemic separation.  

  ---  
  This design forces confrontation with planning fallacy and base-rate neglect while allowing legitimate exceptions. The debrief transforms frustration into "a-ha" moments by linking visceral experiences to cognitive pitfalls.
