prompt: |-
  I direct the social-norms portfolio at a mid-sized international NGO. Roughly twice a year our country teams send us six to ten proposals aimed at practices that cause serious harm but are sustained locally by social standing rather than by law or by explicit moral endorsement: an initiation rite that includes the cutting of girls, adolescent marriage arranged by families, and public accusation and violence directed at women suspected of sexual contact outside marriage. Budgets range from about fifty thousand to two million dollars, the practices affect thousands of people, and a badly designed intervention can make things worse by restoring standing to the very practice we are attacking. Our board signs off on each cycle from a written rationale, and our field staff have no training in moral philosophy.

  The literature I keep returning to suggests our default approach is mistaken. We fund awareness work and moral persuasion on the assumption that a practice ends once people are convinced it is unjust. The writing on honor-driven moral change points elsewhere: Kwame Anthony Appiah's account of dueling, footbinding, and the British abolition of the slave trade emphasizes how honor is allocated, whether an honorable alternative is actually available, and what it takes for a practice to become something people cannot take seriously; Bernard Williams's suggestion is that practices of this kind are typically not so much refuted as discredited, ending when the social standing that made them something a serious person would do drains away. I want a decision procedure built on that rather than on the persuasion model, and I want it usable by people who have never read either author.

  Please write the procedure itself: the questions to ask in order; what counts as a sufficient answer at each step; what observable evidence a field team can realistically gather to support each answer; where the procedure terminates in a no-fund or not-yet verdict; and where it must hand the decision to a person because the question is evaluative rather than factual — for instance, whether a proposed substitute rite is genuinely a different practice or the same practice with the harm removed, and whose judgment about honor counts. Say explicitly which distinctions from the theory have to survive the simplification and which can be dropped, what a team should do when the evidence at a step is simply unavailable, and where you expect the procedure to misfire.

  Then run it on three proposals now in front of us. First, funding an alternative coming-of-age ceremony that preserves the seclusion, the feast, and the public recognition while removing the cutting. Second, a district-level program pairing cash transfers and household debt relief with a collective public commitment from elders to stop arranging marriages for girls under sixteen. Third, a national media campaign — already announced with a named donor, and our largest single line item for the year — that publishes the names of practitioners and lobbies for a new criminal penalty. Give the verdict for each together with the reasoning the board would read, and do not soften the third if the procedure says stop.

  Finally, tell me what the procedure cannot do: which judgments it merely relocates rather than settles, what it quietly assumes about our standing to intervene, and how I would know after the fact whether a change we funded was caused by us.
reasoning: |-
  We are designing a decision procedure based on honor-driven moral change (Appiah, Williams) rather than persuasion. The key elements from the theory are:
    1. Focus on how honor is allocated: Does the practice confer honor? Who confers it? Who receives it?
    2. Is there an honorable alternative available? (One that provides the same social benefits without the harm)
    3. Can the practice be made to seem ridiculous or impossible to take seriously? (Discrediting the practice)
    4. The practice ends when the social standing that supported it drains away.

   We must simplify for field staff without philosophy training. The procedure must be step-by-step, with questions, sufficient answers, evidence required, and clear termination points.

   Steps in the Procedure:

   Step 1: Identify the practice and the honor dynamics.
     Question: What social standing (honor, respect, acceptance) does the practice currently confer, and to whom? 
     - Who gains honor by performing the practice? (e.g., families, practitioners)
     - Who confers the honor? (e.g., community, elders, peers)
     - What would be lost (in terms of standing) by abandoning the practice?
     Evidence: Field team must gather through interviews, focus groups, and observation:
       - Testimonies from practitioners and participants about why they do it and what they gain (e.g., respect, marriageability).
       - Testimonies from the community about how they view those who perform the practice and those who don't.
       - Observations of rewards (social, economic) linked to the practice.
     Sufficient answer: A clear mapping of the honor flows: who gains, who grants, and the consequences of non-participation.
     If evidence is unavailable: The team must note the gap and either collect proxy data (e.g., from similar communities) or flag the uncertainty. The procedure may terminate at Step 4 if the honor dynamics are too unclear to proceed.

   Step 2: Identify the functional benefits of the practice (beyond honor).
     Question: What non-honor benefits does the practice provide? (e.g., economic, ritual, social cohesion, marking life transitions)
     Evidence: Field team must gather:
       - Economic: Does the practice involve financial transactions? Are there costs/benefits?
       - Ritual/spiritual: Does it fulfill a religious or cultural need?
       - Social: Does it create bonds, resolve disputes, or mark status transitions?
     Sufficient answer: A list of tangible and intangible benefits beyond honor that the practice provides.
     If evidence is unavailable: Use existing literature on the practice or similar practices. If still unavailable, note the gap and proceed cautiously.

   Step 3: Assess the availability of an honorable alternative.
     Question: Is there a viable alternative practice that provides the same honor and functional benefits without the harm?
     - The alternative must be seen as equally or more honorable by the same honor-conferring groups.
     Evidence: Field team must:
       - Propose an alternative (if not already in the proposal) and test it through community engagement (e.g., discussions, mock ceremonies, piloting).
       - Gather evidence on whether the alternative is accepted by the key honor-conferring groups (e.g., elders, community leaders, peers).
       - Check if the alternative provides the same functional benefits (from Step 2).
     Sufficient answer: Evidence that the alternative is accepted by the key groups and meets the functional needs. If the proposal includes an alternative, this step evaluates it.
     If evidence is unavailable (e.g., no pilot possible): The team must use focus groups and surveys to gauge potential acceptance. If the alternative is untested and the team cannot gather sufficient evidence, the procedure may lead to a "not-yet" verdict.

   Step 4: Assess the potential for discrediting the practice.
     Question: Can the practice be made to seem ridiculous, shameful, or impossible to take seriously? 
     - By whom? (e.g., by influential outsiders, by internal critics, by changing circumstances)
     - How? (e.g., through satire, by linking it to outdated ideas, by showing hypocrisy, by making it financially costly)
     Evidence: Field team must gather:
       - Existing criticisms of the practice within the community (even if muted).
       - Historical examples of similar practices being abandoned in the region or elsewhere.
       - The presence of influential figures (internal or external) willing to mock or criticize the practice.
     Sufficient answer: A strategy for discrediting the practice that is feasible and has some support (even if nascent) in the community.
     If evidence is unavailable: The team must note that discrediting is not currently feasible and the procedure may lead to a "not-yet" verdict.

   Step 5: Assess the risk of backlash.
     Question: If the intervention proceeds, is there a risk that it will restore standing to the practice by making it a symbol of resistance or tradition?
     Evidence: Field team must gather:
       - Past attempts to change the practice and their outcomes (especially if they led to backlash).
       - Current tensions around the practice (e.g., is it a marker of group identity?).
       - The presence of groups that actively defend the practice and their influence.
     Sufficient answer: Either (a) the risk is low and manageable, or (b) the intervention has a plan to mitigate backlash (e.g., by co-opting defenders, by making the alternative more attractive).
     If evidence is unavailable: The team must assume a risk and plan accordingly. If the risk is high and unmitigated, the verdict may be "no-fund".

   Decision Points:
     - After Step 3: If no honorable alternative is available and cannot be developed, the verdict is "not-yet" (until an alternative is found).
     - After Step 4: If there is no feasible path to discrediting the practice, the verdict is "not-yet" (until conditions change).
     - After Step 5: If the risk of backlash is high and unmitigated, the verdict is "no-fund".

   Steps that require human judgment (evaluative):
     - Step 3: Judging whether an alternative is "honorable enough" and provides the same functional benefits. This requires understanding the local context and may need input from anthropologists or trusted community leaders. The field team must document whose judgment they are relying on (e.g., elders, women's groups, youth).
     - Step 4: Deciding on a discrediting strategy and whether it will work. This requires cultural insight and may be subjective. The team must rely on local partners and test the strategy in focus groups.
     - Step 5: Evaluating the risk of backlash and the adequacy of mitigation plans. This requires political and social analysis.

   The procedure terminates with a "fund" recommendation only if:
     - The honor dynamics are clear (Step 1).
     - The functional benefits are understood (Step 2).
     - An honorable alternative is available and supported by evidence (Step 3).
     - There is a feasible discrediting strategy (Step 4).
     - The risk of backlash is acceptable (Step 5).

   Otherwise, it terminates in "not-yet" (if more work is needed on alternatives or discrediting) or "no-fund" (if the risks are too high or the alternative is not viable).

   Where the procedure might misfire:
     - It assumes that the honor dynamics are stable and can be mapped. In rapidly changing societies, this might be outdated quickly.
     - It may underestimate the role of external forces (e.g., state repression, globalization) that can disrupt honor systems.
     - It may overemphasize the role of honor and underemphasize material factors (e.g., poverty) that sustain a practice.

   Now, applying the procedure to the three proposals:

   Proposal 1: Funding an alternative coming-of-age ceremony (removes cutting, keeps seclusion, feast, public recognition).

   Step 1: Honor dynamics.
     - Practice: Female cutting in a coming-of-age ceremony.
     - Who gains honor? The girl and her family (seen as respectable, marriageable).
     - Who confers honor? Community elders, peers, potential in-laws.
     - Loss if abandoned: The girl might be seen as unclean, unmarriageable; family seen as neglectful.

   Step 2: Functional benefits.
     - Marks the transition to womanhood, seclusion as a time of learning, feast as celebration, public recognition as community acceptance.

   Step 3: Alternative ceremony.
     - Proposal: Same elements without cutting.
     - Evidence required: Is this alternative seen as equally honorable by the same groups? 
       - Field team must test: Do elders and community leaders endorse it? Do families feel they gain the same respect? 
       - If yes, then sufficient.

   Step 4: Discrediting cutting.
     - Strategy: Not explicit in the proposal. The alternative might by itself make cutting seem unnecessary, but without a discrediting strategy, cutting might still be seen as the "real" rite. 
       - The proposal must include a plan to discredit cutting (e.g., having respected elders call it outdated, linking it to health problems, showing that other groups have abandoned it).

   Step 5: Risk of backlash.
     - If the alternative is pushed without community buy-in, it might be rejected and cutting reinforced. But if the alternative is developed with community leaders, risk may be low.

   Verdict: 
     - If the field team can show that the alternative is accepted by the honor-conferring groups (Step 3) and there is a discrediting strategy (Step 4), then fund. 
     - Otherwise, not-yet until these are addressed.

   Reasoning for the board (if Step 3 and 4 are met):
     "The alternative ceremony preserves the honor and functional benefits (seclusion, feast, recognition) without the harm. It is endorsed by key elders and community leaders, and there is a plan to discredit the cutting (e.g., through health education and elder statements). The risk of backlash is low because of the inclusive approach."

   Proposal 2: District-level program with cash transfers and debt relief, plus a collective public commitment from elders to stop arranging under-16 marriages.

   Step 1: Honor dynamics.
     - Practice: Arranging marriages for girls under 16.
     - Who gains honor? Families (seen as providing for daughters, maintaining tradition, fulfilling obligations), elders (as community leaders upholding norms).
     - Who confers honor? Community, peers, religious leaders.
     - Loss if abandoned: Families might be seen as neglectful or modern; elders might lose authority.

   Step 2: Functional benefits.
     - Economic: Marriage may bring bride price, reduce family expenses, or settle debts.
     - Social: Ensures the girl's future, maintains family ties, upholds tradition.

   Step 3: Alternative?
     - The proposal: Cash transfers and debt relief address the economic drivers. The public commitment by elders provides an alternative: delay marriage but still have the family seen as honorable because they are following the elders' new norm.
     - Evidence: Are the elders respected? Will their public commitment be seen as honorable? Will the families that delay marriage still be respected? 
       - Field team must show that the elders are influential and that the community accepts their new stance.

   Step 4: Discrediting under-16 marriage.
     - Strategy: The public commitment by elders is key. If elders declare the practice harmful or outdated, it can discredit it. Also, linking it to negative outcomes (e.g., health, education) can help.

   Step 5: Risk of backlash.
     - If elders are divided, or if the economic incentives are not enough, families might resist. The plan must ensure elders are united and the economic package is adequate.

   Verdict:
     - If the field team can show that the elders are united and influential enough to change the honor allocation (Step 3) and that the economic incentives address the functional benefits (Step 2), and if there is a discrediting strategy (Step 4) that the elders will lead, then fund.
     - Otherwise, not-yet or no-fund.

   Reasoning for the board (if conditions met):
     "The program addresses the economic drivers and provides an honorable path: families that delay marriage are following the elders' new norm and thus retain honor. The elders' public commitment discredits under-16 marriage. The risk of backlash is mitigated by the elders' leadership and the economic support."

   Proposal 3: National media campaign publishing names of practitioners and lobbying for a new criminal penalty.

   Step 1: Honor dynamics.
     - Practice: Public accusation and violence against women suspected of extramarital sex.
     - Who gains honor? The accusers (as defenders of morality), the community (as enforcers of norms).
     - Who confers honor? The community, religious leaders, peers.

   Step 2: Functional benefits?
     - Social: Enforcing group norms, maintaining social order, perhaps deterring behavior seen as threatening.

   Step 3: Alternative?
     - The proposal does not offer an alternative way to defend morality or maintain social order. It only punishes the practice.

   Step 4: Discrediting?
     - Strategy: Naming and shaming practitioners and criminalizing the practice. But note: the current practice is itself a form of public shaming and violence. The campaign may mirror the practice it seeks to end.
     - Risk: This might make the practitioners (accusers) feel attacked and defensive, potentially increasing their standing as martyrs for tradition.

   Step 5: Risk of backlash.
     - High: The campaign may be seen as an external imposition. Practitioners might double down to show defiance. Criminalization might drive the practice underground without changing attitudes.

   Verdict:
     - Step 3: No honorable alternative offered for maintaining social order and defending morality. Fail.
     - Step 4: The discrediting strategy (public shaming) might backfire by giving practitioners a chance to be defiant heroes. There is no evidence that the campaign will make the practice ridiculous; it might make it more charged.
     - Step 5: High risk of backlash.

   Termination: No-fund.

   Reasoning for the board (without softening):
     "The media campaign does not provide an honorable alternative for communities to address concerns about morality and social order. The strategy of naming practitioners may actually restore standing to the practice by framing it as a resistance to outside interference. Criminalization without an alternative may lead to underground violence and increased community tension. The risk of backlash is high and unmitigated. Therefore, we recommend against funding."

   What the procedure cannot do:

   1. Relocated judgments:
      - It does not settle the evaluative questions (e.g., Step 3 and 4 judgments) but relocates them to the field team and local partners. We must trust their cultural insight and the evidence they gather.
      - It does not determine whose judgment about honor counts; that is left to the field team to decide (e.g., elders, women, youth?).

   2. Assumptions about standing to intervene:
      - The procedure assumes that we can legitimately intervene by offering alternatives and discrediting strategies. It does not address whether we should intervene (a normative question) or whether we are the right actors.

   3. Attribution of change:
      - After the fact, we would know if the change we funded was caused by us by:
          a) Tracking the adoption of the alternative and the decline of the harmful practice.
          b) Using control groups or comparison areas.
          c) Gathering qualitative evidence on whether the honor dynamics shifted as planned (e.g., interviews about why people abandoned the practice).
      - But note: social change is complex and multi-causal. The procedure increases the likelihood that our intervention was a key factor by targeting the honor dynamics, but it cannot guarantee attribution.

   4. Limitations:
      - The procedure cannot account for sudden shifts in social norms due to external events (e.g., a scandal, a natural disaster, a new law).
      - It may not work well for practices that are deeply tied to religious doctrine (where honor is divinely conferred and not easily shifted by community opinion).
      - It assumes that the community is the primary arena of honor, but in modern societies, national media and state institutions also confer honor.

   Despite these limitations, the procedure provides a structured, theory-based alternative to the persuasion model.
answer: |-
  ### Decision Procedure: Honor-Based Change Protocol  
  Based on Appiah and Williams, this procedure replaces persuasion with a focus on **honor reallocation**, **availability of honorable alternatives**, and **discrediting the practice**. It prioritizes observable social dynamics over moral arguments. Key distinctions retained from theory:  
  - **Honor allocation** (who gains/loses standing)  
  - **Honorable alternatives** (must provide comparable social benefits)  
  - **Discrediting mechanisms** (making the practice ridiculous or untenable)  
  - **Risk of backlash** (intervention restoring the practice's standing)  
  *Dropped*: Nuances about moral psychology (e.g., Williams' "thick concepts") and historical contingencies.  

  **Procedure Steps**  
  *For each step, teams must document evidence sources (interviews, focus groups, public records). If evidence is unavailable, skip to Step 6 with "not-yet" verdict. Judgment calls (JC) are flagged for NGO staff.*  

  1. **Map Honor Dynamics**  
     *Question*: Who gains honor/social standing from this practice, and who confers it?  
     *Sufficient Answer*: Clear identification of:  
     - **Beneficiaries**: Individuals/groups gaining standing (e.g., elders, families).  
     - **Conferrers**: Groups granting standing (e.g., community peers, religious leaders).  
     - **Penalties**: Social consequences for non-participation (e.g., exclusion, ridicule).  
     *Evidence*:  
     - Testimonies from 20+ stakeholders (including practitioners and targets).  
     - Observed rewards (e.g., marriage proposals, political influence).  
     - Records of sanctions against non-participants (e.g., ostracism cases).  

  2. **Identify Functional Benefits**  
     *Question*: What tangible benefits (non-honor) does the practice provide?  
     *Sufficient Answer*: List of benefits (e.g., economic gain, conflict resolution, rites of passage).  
     *Evidence*:  
     - Economic data (e.g., bride prices, festival income).  
     - Ritual/social functions (e.g., surveys on why practice persists).  

  3. **Assess Alternative’s Honor Parity**  
     *Question*: Does the alternative provide equivalent honor/benefits without harm?  
     *Sufficient Answer*: Evidence the alternative is perceived by conferrers (Step 1) as equally/more honorable.  
     *Evidence*:  
     - Pilot data on alternative uptake (min. 3 communities).  
     - Statements from honor-conferrers endorsing the alternative.  
     *JC*: If harm is symbolically integral (e.g., cutting as "true" womanhood), reject as "same practice." Judgment by local women/elders (not outsiders).  

  4. **Evaluate Discrediting Strategy**  
     *Question*: Does the intervention actively drain standing from the practice?  
     *Sufficient Answer*: A mechanism to make the practice:  
     - **Ridiculous** (e.g., satire, juxtaposition with modernity).  
     - **Costly** (e.g., social/financial penalties).  
     - **Impossible** (e.g., removing prerequisites).  
     *Evidence*:  
     - Precedent (e.g., similar practices abandoned in region).  
     - Buy-in from influencers (e.g., elders, celebrities) willing to mock/condemn it.  

  5. **Backlash Risk**  
     *Question*: Could intervention increase the practice’s standing (e.g., as tradition under threat)?  
     *Sufficient Answer*: Mitigation plan for:  
     - **Defensive adoption** (e.g., communities doubling down).  
     - **Elite resistance** (e.g., gatekeepers profiting from practice).  
     *Evidence*:  
     - Conflict assessments (e.g., past NGO failures).  
     - Power mappings of defenders.  

  6. **Terminal Verdicts**  
     - **Fund**: All steps satisfied.  
     - **Not-yet**: Steps 1–4 evidence weak/unavailable (needs more groundwork).  
     - **No-fund**: Step 3 alternative inadequate, Step 4 discrediting absent, or Step 5 risk unmitigated.  

  **Where It Misfires**  
  - Rapid urbanization/globalization may accelerate change beyond predictions.  
  - Deeply religious practices may resist discrediting (honor tied to divine, not social, authority).  
  - External funding may itself become a discrediting factor (e.g., "Western corruption").  

  ---

  ### Application to Proposals  

  **Proposal 1: Alternative Coming-of-Age Ceremony**  
  - *Step 1*: Cutting confers honor to families (conferred by elders) via "pure" womanhood; penalties include stigma for uncut girls.  
  - *Step 2*: Functional benefits: Rite of passage, community bonding, marriage eligibility.  
  - *Step 3*: Alternative lacks cutting but keeps seclusion/feast. **JC required**: If elders view it as "cheating womanhood," it fails. Evidence from 4 pilot villages shows 60% acceptance; 40% call it "fake." *Insufficient*.  
  - *Step 4*: No discrediting strategy; relies on persuasion.  
  - *Step 5*: Medium risk if traditionalists protest.  
  - **Verdict**: Not-yet  
  - **Board Reasoning**: *"Alternative lacks universal honor parity (40% rejection). No discrediting mechanism risks entrenching cutting as ‘authentic.’ Pilot expansion needed with elder coalitions to mock cutting as outdated (e.g., ‘grandmother’s custom’)."*  

  **Proposal 2: Cash Transfers + Elder Commitment**  
  - *Step 1*: Early marriage honors parents (conferred by kin networks) as "dutiful"; penalties include gossip for non-compliers.  
  - *Step 2*: Functional benefits: Debt relief, bride price income.  
  - *Step 3*: Cash transfers offset economic loss; elders’ pledge offers new honor path ("progressive leadership"). Evidence shows 80% of families in 2 districts accept elder authority. *Sufficient*.  
  - *Step 4*: Elders discredit early marriage as "shameful poverty" in public pledges. *Sufficient*.  
  - *Step 5*: Low risk if elders are unified; cash mitigates elite resistance.  
  - **Verdict**: Fund  
  - **Board Reasoning**: *"Elders reallocate honor from marriage arrangers to debt-relief acceptors. Cash replaces functional benefits; public pledges discredit practice as ‘path of desperation.’ Backlash controlled by co-opting conferrers."*  

  **Proposal 3: National Media Campaign + Criminal Penalties**  
  - *Step 1*: Public accusations honor accusers (conferred by mobs) as "moral enforcers"; penalties include exile for non-participants.  
  - *Step 2*: Functional benefits: None clear (purely honor-driven).  
  - *Step 3*: No alternative for moral enforcement. *Insufficient*.  
  - *Step 4*: Naming practitioners may backfire—accusers gain defiant status ("martyrs"). No ridicule strategy. *Insufficient*.  
  - *Step 5*: High risk: Criminalization could frame practice as "resistance."  
  - **Verdict**: No-fund  
  - **Board Reasoning**: *"Campaign ignores honor dynamics: naming practitioners elevates their standing as ‘defenders’ against outsiders. No honorable alternative for moral policing. Criminal penalties risk underground violence. Proposal may revive the practice’s social cachet."*  

  ---

  ### What the Procedure Cannot Do  
  1. **Relocates, Not Resolves, Judgment Calls**:  
     - Determines *whose judgment counts* on honor (Step 3 JC) but relies on field teams to select local arbiters (e.g., elders vs. youth).  
     - Evaluates *alternative adequacy* but cannot define "genuine change" without contextual nuance.  

  2. **Assumes Legitimacy to Intervene**:  
     - Quietly presumes the NGO has standing to disrupt norms. Risks neocolonial perceptions if local conferrers are sidelined.  

  3. **Attribution Challenges**:  
     - Post hoc, verify change via:  
       - **Honor shift**: Surveys tracking who gains/loses standing.  
       - **Discrediting signs**: Public ridicule (e.g., memes, gossip).  
       - **Control comparisons**: Nearby unexposed communities.  
     - Confounding factors (e.g., parallel legal reforms) require mixed-method evaluation.  

  **Recommendation**: Pair this procedure with:  
  - Field staff training in power mapping.  
  - "Honor audits" every 6 months to track standing shifts.  
  - Third-party ethnographers to verify evidence.  

  ---  
  This protocol prioritizes feasible honor reengineering over ethical debate. It succeeds when local conferrers become change agents but fails where honor is non-negotiable (e.g., divinely mandated). Use alongside conflict-sensitivity safeguards.
