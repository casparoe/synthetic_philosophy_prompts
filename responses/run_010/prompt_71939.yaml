prompt: |-
  I got 14 years clean and next month my old drinking buddy gets his six month chip — the guy I did most of my worst stuff with, and being honest some nights I was worse then him. He asked me to say a few words at the meeting. Room will be about half people who knew us both back then and know exactly what I'd be talking about, and half newcomers who just see a guy with fourteen years standing up to welcome a guy with six.

  Here's the part I cant get straight in my head. Everybody says you can't call somebody out on a thing you did yourself, and a lot of the time I agree with that. But here it feels backwards, like I might be the one person who actually can say it. And underneath that, when I say "that life was killing you" — is that me blaming him, or me blaming myself out loud with him as the only witness who'd understand it? I want the talk to hold both without picking one.

  So write it, maybe four minutes. It has to really take up the fact that I'm not better then him, no modest-sounding line that just waves it away. It can't turn into a lecture the newcomers tune out, it shouldn't land as just "proud of you buddy," and please don't have me apologize to him in front of the room, that's not what a chip night is for.
reasoning: |-
  Okay, the user is preparing a speech for their old drinking buddy's six-month chip celebration. They have 14 years of sobriety and shared a tumultuous past with this person. I need to understand their core dilemma: how to honestly address their shared history without hypocrisy or blame, while making the message resonate for both old-timers and newcomers.

  The user's explicit needs are clear: a four-minute speech that avoids claiming moral superiority, doesn't sound like false humility, isn't a lecture, and doesn't turn into a public apology. But digging deeper, I sense unspoken needs too. There's guilt lingering beneath ("some nights I was worse"), a craving for mutual absolution, and a desire to show newcomers that recovery bridges even the deepest divides. The phrase "me blaming myself out loud with him as the only witness who'd understand" hints at a need for catharsis through shared acknowledgment.

  For structure, the speech should open with warmth, then name their destructive past without graphic details. I'll avoid using "we were killing ourselves" since that implies blame, and instead focus on the shared escape from that life. The tone must balance celebration with gravity—honoring the six-month milestone while acknowledging how hard-won it is. Key phrases like "I know the weight of what you've carried" can validate both their journeys.

  The audience split is crucial. For old-timers, specific callbacks (e.g., "you know the nights I mean") create intimacy. For newcomers, framing their history as proof that "no one's too far gone" offers hope. The line "this room doesn't care who was worse" subtly reinforces AA's ethos while dismissing hierarchy.

  I'll avoid pitfalls: no backhanded compliments ("even you got sober"), no vague disclaimers about not being better. Instead, I'll emphasize parallel paths—"I had a head start, not a moral advantage." The closing shifts focus to the present: a sober hug symbolizes equality now, and welcoming him "into the light" ends with collective hope.

  This approach transforms shared shame into solidarity, giving the user what they need: a speech where accountability feels like brotherhood.
answer: |-
  Here’s a draft focusing on shared history, mutual understanding, and the weight of the milestone—without hierarchy, blame, or apology. It’s structured to resonate with both groups in the room:

  **(Start warm, direct, looking at your friend)**  
  "Six months. [Friend’s Name], look at you. Standing here holding that chip after everything… *man*. I wouldn’t miss this. Honored you asked me.  

  **(Shift tone slightly – sober, grounded)**  
  A lot of folks here tonight see two guys: one with fourteen years, one with six months. That’s true. But some of you… **(brief nod to the old-timers)** …you see more. You remember. You know the streets we haunted, the chaos we lived, the damage we did – to ourselves, to others. You know there wasn’t much daylight between us back then. Some nights he was worse, some nights… **(look directly at your friend, calm honesty)** ...it was me. We know.  

  **(Pivot to the shared truth, not the blame)**  
  Here’s what I *can* say tonight, clear as anything: **That life was killing us.** Not *you*. *Us*. I felt it in my bones, same as you did. The fear, the desperation, the slow erasure of anything decent left in us. When I say that life was killing *you*, [Friend’s Name], it’s not finger-pointing. It’s naming the poison we both drank. It’s seeing the trap we were *both* in, clear-eyed, from this side of it.  

  **(Address the core dilemma – Why YOU can speak)**  
  People say you can’t call someone out on what you did. Usually, they’re right. But maybe… maybe the only person who *can* truly speak to the depth of the hole you’ve climbed out of is the one who was down there digging it beside you. Because I *know* the weight of what you’ve carried these six months. I know the ghosts you’ve faced are the same ones that chased me. I know the sheer, stubborn guts it took for *you* – yes, *you* – to grab onto recovery when everything in our past screamed it was impossible.  

  **(Connect to newcomers & the program)**  
  So for the newcomers here tonight, see this: **Hope isn’t reserved for the ‘good’ ones.** It’s not about who did what, or who was worse. This room doesn’t care. It cares that two guys who walked through hell together are standing here now, *sober*. If this guy **(gesture to friend)** can fight his way to six months after the life we lived? Trust me, your chance is real. Grab it.  

  **(Back to your friend – focus on the present achievement)**  
  [Friend’s Name], six months isn't just a number. After where we came from? It's a goddamn miracle. It’s proof that the past doesn’t get to write the ending. You faced down *our* history, *your* history, day after brutal day, and you chose this instead. That takes a courage I know intimately because I had to find it too. It’s not about me being further down the road. It’s about seeing you finally, *finally*, on the road at all. That’s everything.  

  **(Close with solidarity and warmth)**  
  So tonight, I’m not standing here as your ‘better’. I’m standing here as your friend, your *old* friend, who remembers the darkness because we shared it… and who gets to stand beside you now, six months clean, in the light. Damn proud of you for fighting. Keep coming back. **(Raise coffee cup/simple gesture of salute)** Welcome to the fight, brother. It gets better."  

  **Why this works:**

  1.  **Acknowledges Shared History:** Directly names the past ("the chaos," "the damage," "the hole," "the darkness") and your equal role ("some nights it was me").
  2.  **Avoids Blame:** "That life was killing *us*" reframes it as a shared enemy. "The poison *we* both drank." "The trap *we* were both in."
  3.  **Justifies Your Voice:** Explains *why* your shared past gives you a unique perspective to honor his struggle honestly ("the only person who *can* truly speak to the depth...").
  4.  **No False Modesty:** Doesn't say "I'm no better." Shows it by framing your time ("further down the road") as simply a head start, not a moral advantage. Focuses on *his* immense courage relative to *your shared past*.
  5.  **Serves Newcomers:** Explicitly tells them this is proof "Hope isn't reserved for the ‘good’ ones" and "your chance is real."
  6.  **Honors the Chip:** Focuses entirely on *his* achievement ("sheer, stubborn guts," "goddamn miracle," "proof the past doesn’t get to write the ending").
  7.  **No Apology:** Focuses on the present victory and shared understanding, not past wrongs between you.
  8.  **Authentic Emotion:** Allows for warmth ("Damn proud"), gravity ("ghosts you've faced"), and solidarity ("Welcome to the fight, brother").
  9.  **Time:** Structured for roughly 4 minutes when delivered with appropriate pauses.

  **Delivery Tip:** Make eye contact with your friend during the most personal parts ("some nights it was me," "I know the ghosts"). Let the weight of the shared understanding sit in your pauses. The nod to the old-timers should be brief but knowing. The warmth at the end should be genuine and strong.
