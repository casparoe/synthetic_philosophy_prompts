prompt: |-
  I run the technical review process at a mid-sized engineering org. I have no philosophy background, but I've ended up writing the rules by which small panels of reviewers approve or reject proposals, and my gut verdicts on a handful of real cases don't look like they come from a single rule. I'd like to know what principle, if any, they add up to — stated precisely enough that I could put it in the process doc and apply it without knowing anything about the stakes of the particular proposal.

  The cases, and what I decided at the time:

  1. An RFC is approved only if all three hold: the design is sound, it fits this quarter's budget, and our team will own the maintenance. Three reviewers. Ana: sound yes, budget no, maintenance yes — so reject. Bo: yes, yes, no — reject. Cy: yes, yes, yes — approve. Taken criterion by criterion, each of the three has majority support, so the RFC passes; taken as a whole, a majority rejects it. My call: approve. Nobody on the panel actually thought the design was bad.

  2. A release is blocked if any of these holds: an open P1 bug, an untested rollback path, missing on-call sign-off. Dana cites only the bug, Eli cites only the rollback, Fay cites nothing. Criterion by criterion, no blocker has majority support, so it should ship; two of the three say block. My call: block. If it goes wrong, I want to be able to point at the two people who called it.

  3. The same board, using the same written criteria, approves "add a caching layer" in March and approves "remove the caching layer" in September, with three of five members unchanged. I see no problem here: new data arrived, and a board is not a person.

  4. A leveling panel decides a promotion on technical depth and scope, but one of the three members holds that mentorship is also part of the bar, which the other two deny is a criterion at all. We skipped the criteria and voted on the overall outcome. I still don't know whether that was right or a cop-out.

  5. Last quarter, badly handled: three reviewers score an incident's severity from 1 to 5, our doc says block if the mean is at least 3, and the scores come back 5, 2, 2 — so the mean blocks it even though only one reviewer thinks it should.

  What I'm after: the best candidate principle or principles behind 1–4, and what each one costs me; which pair of verdicts is hardest to reconcile and which single verdict I should give up to repair it; whether 1 and 3 are genuinely in conflict or only look that way; and what your principle says about case 5. Rank the problems by severity rather than listing them as equally bad, and don't assume I'm attached to any of these verdicts — I mostly want to know which ones are unsustainable.
reasoning: |-
  We are given five cases and the user's decisions on them. The goal is to extract a unifying principle (or principles) that can be applied consistently, and then to analyze the cases in light of that principle.

  The user's decisions:
  1. Approve (despite two rejections and one approval, because each criterion had majority support and the design was not considered bad by anyone).
  2. Block (even though no individual blocker had majority support, but because two out of three said block).
  3. Approve both adding and removing the caching layer at different times (with changing context and data) is acceptable.
  4. The leveling panel skipped criteria and voted on the overall outcome (and the user is unsure if that was right).
  5. The mean severity rule led to a block with only one out of three reviewers blocking (which the user considers badly handled).

  We are to:
  - Find the best candidate principle(s) behind cases 1-4, and what each principle costs.
  - Identify which pair of verdicts is hardest to reconcile and which single verdict to give up to repair it.
  - Determine if cases 1 and 3 are in conflict or only appear so.
  - Apply the principle to case 5.
  - Rank the problems by severity.

  Let's analyze each case:

  Case 1: 
  - The rule: approve only if all three criteria are met.
  - Reviewers: 
    - Ana: sound (yes), budget (no), maintenance (yes) -> reject
    - Bo: yes, yes, no -> reject
    - Cy: yes, yes, yes -> approve
  - The user approved because each criterion individually had majority support (sound: 3/3, budget: 2/3, maintenance: 2/3) and because no one thought the design was bad.

  Case 2:
  - The rule: block if any of the three conditions hold.
  - Reviewers:
    - Dana: block (because of bug)
    - Eli: block (because of rollback)
    - Fay: no block
  - The user blocked because two out of three said block, even though no individual blocker had majority (each blocker was only cited by one).

  Case 3:
  - The same board approved opposite actions at different times. The user sees no problem because context changed.

  Case 4:
  - The rule: promotion based on technical depth and scope.
  - One reviewer added an extra criterion (mentorship) that the others did not consider. They skipped criteria and voted overall.

  Case 5:
  - The rule: block if the mean severity >= 3.
  - Scores: 5, 2, 2 -> mean=3, so blocked, even though only one thought it should be blocked.

  Looking for principles:

  The user seems to be applying a principle that focuses on the collective judgment of the panel, but in different ways:

  In case 1, the user overrode the individual rejections because the criteria individually had majority support. This is a "criterion-wise majority" principle.

  In case 2, the user overrode the lack of majority for any individual blocker because the overall block decision had majority (two out of three). This is an "overall outcome majority" principle.

  In case 3, the user accepts that the same board can make opposite decisions because the context (data) changed. This is a "context-dependent" principle.

  In case 4, the user is unsure about skipping criteria and voting on the overall outcome. This might be an ad-hoc solution to a disagreement about criteria.

  The challenge: The principles in case 1 and case 2 seem to be in conflict. In case 1, the user ignored the overall rejections (which were two out of three) and focused on the criteria having majority. In case 2, the user ignored the criteria not having majority and focused on the overall block decision having majority.

  Proposed principle:

  After analysis, the following principle might capture the user's decisions:

  **Principle: The decision rule must be applied at the level of the criteria when the criteria are objective and agreed upon, but when the criteria are not uniformly applied or when the decision is about the presence of a blocking condition (which is disjunctive), the overall judgment of the panel by majority should prevail.**

  But let's break it down:

  - In case 1: The criteria were clear and agreed upon. The user looked at each criterion and saw that each had majority support. Therefore, the proposal should pass even though two reviewers rejected it because they each found one criterion failing (but the majority of the panel supported each criterion). This is a "criterion-by-criterion majority" rule.

  - In case 2: The blocking conditions are disjunctive (any one blocks). However, the reviewers did not agree on which condition was present. But the user decided that the overall block decision (by two reviewers) should be respected. This is because the blocking conditions are not independent in their effect: if any condition is present, the release is blocked. The user's decision reflects that the panel's majority believes that at least one condition is present (even if they don't agree on which). Alternatively, we can see it as the overall outcome (block or not) being the subject of majority vote.

  - In case 3: The principle of changing decisions with new context is consistent with any rule that is based on current information.

  - Case 4: The problem was that the criteria were not agreed upon. The user's panel skipped the criteria and voted overall. This is an ad-hoc solution. The principle might be: if the criteria are not agreed upon, then the panel must vote on the overall outcome by majority. But the user is unsure.

  A unifying principle might be:

  **"The decision of the panel is made by applying the pre-defined decision rule to the aggregated judgments of the panel on each criterion. However, if the decision rule is disjunctive (any one blocker) and the panel members are only required to flag the presence of at least one blocker (without specifying which), then the overall decision (block or not) is taken by majority vote. In cases where the criteria are not agreed upon, the panel must first agree on the criteria or, failing that, vote overall by majority."**

  But note that in case 2, the reviewers did cite specific blockers. However, the user ignored the specific blockers and took the overall block decision by majority.

  Alternatively, we might consider:

  **Principle A: For conjunctive criteria (all must pass), require majority support for each criterion individually. For disjunctive criteria (any one fails causes rejection), require majority support for the overall rejection.**

  But in case 1, the criteria were conjunctive (all must pass) and the user used a criterion-wise majority. That led to approval. In case 2, the criteria were disjunctive (any blocker) and the user used an overall majority to block.

  However, in case 1, if we had applied the overall outcome, we would have rejected (because two out of three rejected). But the user approved. So the user is not consistent between case 1 and case 2: in case 1 they used criterion-wise, in case 2 overall.

  Therefore, the hardest pair to reconcile is case 1 and case 2.

  To repair this conflict, we must choose one approach:

  Option 1: Always use criterion-wise aggregation for both conjunctive and disjunctive rules.

  - Case 1: Then we approve because each criterion has majority.
  - Case 2: Then we would not block because no individual blocker had majority (each blocker was only cited by one, so each blocker fails to get majority support). But the user blocked in case 2. So if we choose this option, we must change the verdict in case 2 to "ship".

  Option 2: Always use overall outcome majority for both.

  - Case 1: Then we reject because two out of three rejected.
  - Case 2: Then we block because two out of three said block.

  But the user approved in case 1, so they would have to change that verdict to reject.

  The user might not want to change either. Alternatively, we can have a hybrid:

  **Principle: For a conjunctive set of criteria, the proposal passes only if a majority of the panel approves it on every criterion. For a disjunctive set of blockers, the proposal is blocked if a majority of the panel finds at least one blocker (even if they don't agree on which).**

  But note: In case 1, the conjunctive criteria: we require that for each criterion, a majority of the panel approves. That is what the user did.

  In case 2, the disjunctive blockers: we require that a majority of the panel finds at least one blocker. That is also what the user did (two out of three found a blocker). But note that in case 2, each blocker individually was only found by one, but two reviewers found at least one blocker (so the majority found at least one blocker). This is consistent.

  So the principle:

  **"For a conjunctive approval (all criteria must be satisfied): the proposal is approved if and only if for every criterion, a majority of the reviewers judge that the criterion is satisfied.**

  **For a disjunctive rejection (any one blocker causes rejection): the proposal is rejected (blocked) if and only if a majority of the reviewers judge that at least one blocker is present (regardless of which one)."**

  Now, let's test on case 1 and 2:

  Case 1 (conjunctive approval): 
  - Sound: 3/3 yes -> majority
  - Budget: 2/3 yes -> majority
  - Maintenance: 2/3 yes -> majority
  Therefore, approve. Matches.

  Case 2 (disjunctive rejection):
  - Dana: finds at least one blocker (bug) -> block
  - Eli: finds at least one blocker (rollback) -> block
  - Fay: finds no blocker -> don't block
  So two out of three (majority) find at least one blocker -> block. Matches.

  Now for case 3: The same board can change its mind with new data. This is acceptable and does not conflict.

  Case 4: The problem was about the criteria. In this case, two reviewers applied the pre-defined criteria (technical depth and scope) and one added an extra criterion (mentorship). The panel skipped the criteria and voted overall. According to the principle above, we must first have agreed criteria. The principle does not cover this situation. Therefore, we need an extension:

  **"The criteria must be fixed and agreed upon by the panel in advance. If a reviewer introduces an extra criterion not in the document, it should be ignored. If a reviewer fails to apply a criterion in the document, the panel must remind them to apply the correct criteria. Only the pre-defined criteria are used, and then the aggregation rules (as above) are applied."**

  So in case 4, the two reviewers who denied mentorship as a criterion were correct. The third reviewer should be instructed to only consider technical depth and scope. Then, they vote on each criterion (if conjunctive) and aggregate accordingly. If they cannot agree on the criteria, then the panel must escalate to a higher authority (like the user) to clarify the criteria, and then re-vote.

  In case 4, skipping the criteria and voting overall was a cop-out because it didn't follow the pre-defined criteria.

  Now, case 5: The rule was to block if the mean severity >=3. The scores were 5,2,2 -> mean=3 -> block. The user thinks this is bad because only one reviewer thought it should be blocked.

  Applying the above principles: 

  The rule is defined as the mean. But the principle we developed for cases 1 and 2 is about majority per criterion or overall majority for disjunctive. This case uses a numeric mean. We might reconsider the rule.

  If we were to apply the majority principle to case 5, we might redefine the rule: block if a majority of the reviewers rate the severity as 3 or above. In this case, only one reviewer rated >=3 (5 is >=3, 2 and 2 are <3), so only 1/3 is a majority? No, because majority would require at least 2/3. So we would not block.

  But the current rule is the mean. The problem with the mean is that it can be skewed by one extreme vote. The median might be more robust, but the rule is the mean.

  Alternatively, we might require that the block condition is met if the median is >=3? In this case, the median is 2, so it would not block. Or if we require majority of reviewers giving >=3, that would also not block.

  But note: the user said the rule was the mean. So if we stick to the rule, we block. But the user considers it badly handled.

  Therefore, the principle we developed would suggest changing the rule for case 5 to align with the majority principle:

  **For a blocking condition defined by a threshold on a numeric score, block if a majority of the reviewers assign a score at or above the threshold.**

  In this case, the threshold is 3. Only one reviewer assigned a score >=3, so no majority -> do not block.

  Alternatively, if we want to use the average, we might change the threshold or the aggregation method. But the principle of majority per criterion (if we consider the score threshold as a criterion) would lead to requiring majority.

  Now, rank the problems by severity:

  1. Case 5: The rule as written (mean) led to a decision that does not reflect the majority view. This is severe because it undermines the panel's judgment. The rule should be changed to require majority of reviewers rating at or above the threshold.

  2. Case 4: The criteria were not agreed upon and the panel skipped the criteria. This is a severe breach of process because it allows arbitrary criteria. The process must require that only pre-defined criteria are used and that any deviation is corrected.

  3. Cases 1 and 2: The user's decisions were consistent with the principle we extracted (which is a good one). But without a clear principle, they appeared inconsistent. The severity is moderate because the principle resolves it.

  4. Case 3: There is no problem. Changing decisions with new data is acceptable.

  Which single verdict to give up to repair the conflict between case 1 and 2? Actually, we found a principle that reconciles them without giving up either verdict. So we don't need to give up any.

  But if we had to choose, the user might be more attached to case 2 (blocking the release) because of the desire to be able to point to two people. Therefore, if forced, we might give up the verdict in case 1 and reject the RFC. But with the principle, we don't have to.

  Are case 1 and 3 in conflict? Case 3 is about the same board changing its mind over time with new data. Case 1 is about a single review. They are not in conflict.

  Summary:

  **Principle:**
  - For conjunctive criteria (all must be satisfied): approve only if a majority of the reviewers approve each and every criterion.
  - For disjunctive criteria (any one blocker causes rejection): reject if a majority of the reviewers find at least one blocker (regardless of which one).
  - Criteria must be fixed and pre-defined. If a reviewer uses an extra criterion, it is ignored. If a reviewer omits a criterion, they must be corrected. Only the pre-defined criteria are used.
  - For numeric scores (like severity) that have a threshold: the threshold condition is met if a majority of the reviewers assign a score meeting the condition (e.g., >=3).

  **Costs of the principle:**
  - For conjunctive: It might lead to approval even when a majority of the reviewers overall reject, if each criterion has majority. This might be counterintuitive (as in case 1, two rejections but approved). But the user was comfortable with that because the design wasn't bad and each criterion had support.
  - For disjunctive: It might lead to rejection even if no single blocker has majority, as long as a majority of the reviewers found at least one blocker.

  **Case 5 under the principle:** 
  We change the rule from "block if the mean >=3" to "block if a majority of reviewers assign a severity >=3". Then with scores 5,2,2: only one reviewer assigns >=3 -> no majority -> do not block.

  **Ranking of problems by severity:**
  1. Case 5: The aggregation rule (mean) is flawed and should be changed to a majority rule. (Most severe because the rule as written leads to outcomes that don't reflect the panel's judgment.)
  2. Case 4: The criteria were not enforced, leading to an arbitrary process. (Severe because it undermines the entire review structure.)
  3. Cases 1 and 2: Without a clear principle, the decisions appear inconsistent. (Moderate, because the principle we propose resolves it without changing the verdicts.)
  4. Case 3: No problem.

  **Final note:** The principle we propose for cases 1 and 2 is sustainable and aligns with the user's gut decisions. The other cases (4 and 5) require adjustments to the process to align with the principle.
answer: |-
  Based on your cases and decisions, I've reverse-engineered a unifying principle that captures your verdicts while exposing tensions and costs. Your decisions reveal a consistent meta-rule, but it conflicts with common voting methods like majority thresholds. Below, I'll state the principle, analyze its costs, reconcile conflicts, rank issues by severity, and apply it to case 5.

  ---

  ### **The Core Principle: "Guardrail Thresholds with Panel-Sensitive Aggregation"**
  > **Decisions are made by applying pre-defined logical rules (AND/OR) to individual reviewer judgments, but only after filtering out non-consensus criteria. The outcome must reflect whether a *qualified majority* of the panel (≥2/3) *actively opposes* the proposal when stakes are high (e.g., blocking a release), but defaults to *per-criterion majority* when risks are lower (e.g., approving an RFC).**

  This principle combines two sub-rules tuned to risk:  
  1. **For approval (conjunctive/low-risk):** Approve if each mandatory criterion has majority support.  
  2. **For rejection (disjunctive/high-risk):** Reject if a qualified majority (≥2/3) of reviewers flags *any* blocker, even if they disagree on *which one*.  

  #### **Why this fits your verdicts:**
  - **Case 1 (RFC approval):** Low-risk conjunctive decision → Use per-criterion majority.  
    - Budget and maintenance each had 2/3 majority → Approved.  
  - **Case 2 (Release blocking):** High-risk disjunctive decision → Use qualified majority of overall rejections.  
    - 2/3 reviewers blocked (Dana, Eli) → Blocked.  
  - **Case 3 (Caching reversal):** Context changes reset criteria → Principle allows decisions to evolve with new data.  
  - **Case 4 (Promotion criteria):** Non-consensus criterion (mentorship) → Filtered out (ignored), forcing fallback to overall vote.  

  #### **Costs of this principle:**
  - **Complexity cost:** Reviewers must know whether a vote is "high-risk" (rejection) or "low-risk" (approval) upfront.  
  - **Ambiguity cost:** "Qualified majority" (≥2/3) is arbitrary without stakes documentation.  
  - **Procedural cost:** Forces manual fallbacks when criteria diverge (as in case 4).  

  ---

  ### **Reconciling Conflicts**
  #### **Hardest pair to reconcile: Case 1 (approve) vs. Case 2 (block)**  
  These *appear* inconsistent:  
  - Case 1 uses per-criterion majority (ignoring overall rejection by 2/3).  
  - Case 2 uses overall rejection by a majority (ignoring per-criterion support).  
  **Resolution:** They reconcile under the risk-based sub-rules. Case 1 is low-risk (approving work), Case 2 is high-risk (blocking a release). If you must sacrifice one verdict to reduce inconsistency, **give up Case 1's approval**. Why?  
  - Case 2’s "point at two people" argument is ethically/logistically stronger for high-stakes decisions.  
  - Case 1’s approval with 2/3 rejection creates accountability gaps (no one owns the budget gap).  

  #### **Are Case 1 and Case 3 in conflict?**  
  **No.** Case 3 is about temporal consistency (rules applied to new facts), while Case 1 is about aggregation mechanics. The principle allows both:  
  - Case 3’s reversal is valid because data changed (no principle violation).  
  - Case 1’s approval reflects rule mechanics, not inconsistency.  

  ---

  ### **Ranking Problems by Severity**
  From most to least severe (based on systemic risk):  
  1. **Case 5 (Mean severity blocking):**  
     - **Problem:** Mean aggregation ignores minority/majority dynamics. A single outlier (5/5) overrules two 2/5 votes.  
     - **Severity:** Critical. Undermines panel legitimacy and incentives strategic voting.  
  2. **Case 4 (Criterion disagreement):**  
     - **Problem:** Ad-hoc overall voting when criteria diverge. Erodes trust and invites bias.  
     - **Severity:** High. Without rules for criterion disputes, panels become unpredictable.  
  3. **Case 2 (Blocking without majority per blocker):**  
     - **Problem:** Qualified majority (≥2/3) rejects despite no consensus on *why*.  
     - **Severity:** Moderate. Justifiable for high-risk calls but may feel unjust to reviewers.  
  4. **Case 1 (Approving with 2/3 rejection):**  
     - **Problem:** Per-criterion majority overrules overall rejection.  
     - **Severity:** Low. Sustainable only for low-stakes approvals.  

  ---

  ### **Applying the Principle to Case 5**
  **Scenario:** Block if mean severity ≥3. Scores: 5, 2, 2 → Mean=3 → Blocked.  
  **Principle's verdict:** **Do not block.**  
  - **Why:**  
    - Severity thresholds are high-risk (like blocking a release) → Use qualified majority rejection.  
    - Only 1/3 reviewers actively blocked (score ≥3) → Fails ≥2/3 threshold.  
  - **Rule adjustment in docs:**  
    > "Block if ≥2/3 reviewers assign severity ≥ threshold (e.g., ≥3/5)."  
    *(This aligns with Case 2’s logic and avoids mean pitfalls.)*  

  ---

  ### **Recommendations for Your Process Doc**
  1. **Adopt the core principle** with explicit risk labeling:  
     ```markdown  
     - **Approval (AND criteria):** Pass if each criterion has majority support.  
     - **Rejection (OR blockers):** Block if ≥2/3 reviewers flag *any* blocker.  
     - **Non-consensus criteria:** Discard criteria not in the doc; escalate if >1 reviewer objects.  
     ```  
  2. **Fix Case 5** by replacing mean thresholds with majority thresholds.  
  3. **Retract Case 1’s verdict** if accountability is critical (otherwise accept the low-risk tradeoff).  
  4. **Document risk context:** Tag decisions as "high-risk" (rejections) or "low-risk" (approvals) upfront.  

  This makes your process consistent with your instincts while minimizing subjectivity. The cost is documenting risk levels, but it resolves all major conflicts.
