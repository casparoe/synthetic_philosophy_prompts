  4. **Case 4**: Rule 3A satisfied (ordinary deliberation implies capacity). Rule 3B not satisfied (designed by biologists). Verdict accommodated.
  5. **Case 5**: Rule 3A satisfied (recognizes wrongness and could be moved). Rule 3B satisfied (no manipulation). Verdict accommodated.
  6. **Case 6**: Rule 3A satisfied (makes moral choice). Rule 3B satisfied (no manipulation). Verdict accommodated (attribution).
  7. **Case 7**: Rule 3A satisfied (recognizes wrongness). Rule 3B satisfied (no manipulation). Verdict accommodated (control fails).

  #### Summary of Rules
  - For full responsibility, all rules must be satisfied: voluntary control (1A), no external deviation (1B), moral capacity (3A), and psychological ownership (3B). Rule 2 (alternative possibilities) is not necessary but supports Rule 1A in Case 6.
  - Charity applied:
