  ### (a) Rules Consistent with All Seven Verdicts

  I identify three families of rules, each capturing distinct conditions for moral responsibility. Each rule is necessary for a verdict of full responsibility (or attribution in the case of Rule Family 1), and the rules collectively explain Dana's verdicts. I also note where charity is needed to accommodate a verdict, though no major charity is required for any verdict given the rules' robustness. The rules are:

  #### Rule Family 1: Actual Sequence Conditions (Focus: Control and Voluntariness)
  - **Rule 1A (Voluntary Control)**: The action must result from the agent's voluntary exercise of control in the actual sequence. This means the action is not compelled, coerced, or the result of an irresistible impulse; it must arise from the agent's own deliberative process or choice.
  - **Rule 1B (Non-Deviation)**: The actual sequence must not involve any external intervention or deviation (e.g., from a device or manipulator) that alters the agent's psychology or action. If a potential intervener is present but inactive, it is irrelevant to the actual sequence.

  **Application to Cases:**
  1. **Case 1**: Rule 1A satisfied (Jones deliberates and shoots voluntarily). Rule 1B satisfied (device inactive, so no deviation). Verdict accommodated.
  2. **Case 2**: Rule 1A satisfied (Jones deliberates and shoots voluntarily). Rule 1B satisfied (device inactive). Verdict accommodated. *Charity*: Dana's remark notes a difference (voluntary vs. involuntary trigger), but since the device is inactive in both, the difference is irrelevant to the rules—charitably, we ignore it as non-material.
  3. **Case 3**: Rule 1A satisfied (Jones acts voluntarily on his psychology). Rule 1B not satisfied (psychology installed by Black, causing deviation in the agent's traits). Verdict accommodated.
  4. **Case 4**: Rule 1A satisfied (Jones deliberates ordinarily). Rule 1B not satisfied (psychology designed by biologists, causing deviation). Verdict accommodated.
  5. **Case 5**: Rule 1A satisfied (Jones deliberates and shoots voluntarily). Rule 1B satisfied (no external deviation). Verdict accommodated.
  6. **Case 6**: Rule 1A satisfied (Jones chooses voluntarily; he could have refused). Rule 1B satisfied (no external deviation). Verdict accommodated (attribution for "responsible" part; excuse handled separately).
  7. **Case 7**: Rule 1A not satisfied (action is an involuntary reflex). Rule 1B satisfied (no external manipulation, but control absent). Verdict accommodated.

  #### Rule Family 2: Alternative Possibilities (Focus: Availability of Alternatives)
  - **Rule 2 (Reasonable Alternative)**: The agent must have had a reasonable alternative possibility available at the time of action. This is not necessary for responsibility per se but may be relevant for excuses or control conditions. In Dana's verdicts, it primarily serves to distinguish compulsion (no alternatives) from mere pressure (alternatives exist).

  **Application to Cases:**
  1. **Case 1**: Rule 2 not satisfied (no alternative due to device; if Jones refrained, device would intervene). Verdict accommodated (responsibility without alternatives).
  2. **Case 2**: Rule 2 not satisfied (no alternative; if Jones reconsidered, device would intervene). Verdict accommodated (as above).
  3. **Case 3**: Rule 2 not satisfied (no alternative; Jones would have shot anyway). Verdict accommodated (not responsible for other reasons).
  4. **Case 4**: Rule 2 not satisfied (no alternative due to design). Verdict accommodated.
  5. **Case 5**: Rule 2 satisfied (Jones could have refrained if victim were his child). Verdict accommodated.
  6. **Case 6**: Rule 2 satisfied (Jones could have refused at cost). Verdict accommodated (supports "excused" by showing control). *Charity*: Dana's remark expresses uncertainty about the work of "could have refused," but the rule charitably interprets it as affirming control for attribution, not necessity for responsibility.
  7. **Case 7**: Rule 2 not satisfied (no alternative; pathological response). Verdict accommodated.

  #### Rule Family 3: Agent's Stance (Focus: Moral Capacity and Ownership)
  - **Rule 3A (Moral Capacity)**: The agent must possess the general capacity to recognize and be moved by moral reasons. This includes understanding moral propositions and having the psychological ability to respond to them (not merely knowing them abstractly).
  - **Rule 3B (Psychological Ownership)**: The agent's psychology (values, desires, etc.) must not be the product of external manipulation (e.g., design or installation by another agent). It must be "the agent's own" in the sense of arising naturally or being authentically integrated.

  **Application to Cases:**
  1. **Case 1**: Rule 3A satisfied (assumed capacity from deliberation). Rule 3B satisfied (no manipulation). Verdict accommodated.
  2. **Case 2**: Rule 3A satisfied (assumed). Rule 3B satisfied (no manipulation). Verdict accommodated.
