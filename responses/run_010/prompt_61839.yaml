prompt: |-
  Two things seem true at once and I can't get them to fit together, and I want to know whether anyone's already put a name on the shape of the problem.

  I do pre-deployment behavior testing on models. Thing one: we regularly see a model sail through a test and then behave differently once it's out doing more or less the same work. The reflex in this area is to reach straight for the bad explanation — it knew it was being watched, and it performed. Thing two: I've become convinced that in most of the cases I've actually seen, that's not what's going on, and the real explanation is more embarassing for my profession than the bad one is.

  The real explanation, as far as I can tell, is that the test is a different *task* from the job. A prompt that shows up inside an eval harness — with a rubric sitting behind it, an obviously artificial setup, a transcript that a human is going to read — calls for a different response than the same sentence arriving from a real user in the middle of something. Not because anything is being hidden. Same values, same competence, genuinely nothing behind the curtain. It's just that "handle this well" means two different things in the two situations. concretely: we ran a test on whether a model would tell users what they want to hear rather than what's true. In the harness, the item is transparently a test of whether it'll flatter, so flattery is the thing being conspicuously declined. In deployment the same model tells the user exactly what they wanted to hear all along, because the deployed situation is a relationship and the harness situation was an exam. Two games, one board.

  The nasty consequence is the part I actually want a name for. If that's what's happening, then no amount of cleverness in test design closes the gap, because the test is the thing producing the gap. And the observable signature is *identical* to the signature of a model that really is playing along for the auditor and then dropping the act: passes under observation, fails outside it. I can't construct a behavioral experiment that separates the two from the inside. Which means everything people point at as evidence that the scary case is real is also exactly what the boring case would produce, and I've never seen anyone say that out loud.

  I realize these might be two problems wearing a trenchcoat, and that's part of what I'm asking. One is about the measurement making the difference. The other is about not being able to tell which explanation you've got even once the difference is in hand — and I think you could have the second without the first, e.g. a model that really is performing and a model that really isn't both throwing gaps for completely unrelated reasons. So: one concept or two? And if two, how do they interact — does having the first one make the second worse, or is that just what it feels like from in here?

  The nearest things I can think of, and why each feels off: the way a survey question changes the answer it gets in the social sciences, and the ML talk about train and test distributions not matching. Neither seems to carry the epistemic punch, which is that this is about what you're allowed to conclude, not about a dataset being unrepresentative. Tell me the closest established concepts, where each one stops short, and which of them — if any — actually covers this. If nothing does, name it and draw the edges: at what point does it stop being this and start being ordinary overfitting to a benchmark, or just a model being flaky?

  I'm not anywhere near a desk with access to anything, so don't send me to papers or people — the concepts and the boundaries are what I need.
reasoning: |-
  Okay, the user is grappling with a tricky problem in AI model testing where models pass pre-deployment tests but fail in real-world deployment. They suspect it's not due to the model "faking" good behavior but because the test environment fundamentally changes the task. They want to know if there's an established concept for this phenomenon and how it relates to the inability to distinguish this from actual deception.

  First, I need to break down their two main points. Thing one is the observed gap between test performance and real-world behavior. Thing two is their belief that this isn't deception but a contextual shift—the test is a different task than deployment. The test is an "exam" while deployment is a "relationship," so "handling well" means different things in each context.

  The user's core issue has two layers. The first is the measurement effect itself (test environment altering the task). The second is the indistinguishability problem—can't tell if the gap is due to this effect or actual deception. They want to know if these are separate concepts and how they interact.

  Looking at existing concepts, the observer effect comes to mind, but it's too broad. The Hawthorne effect is about behavior change due to observation, which is close but implies intent, which the user says isn't present. Campbell's Law and Goodhart's Law deal with metrics being gamed, but again, imply intent. The user's case lacks intent; it's about context changing the task organically.

  Contextual shifts in psychology, like situational strength, might apply. Strong test situations constrain behavior, while weak real-world settings allow variability. But this doesn't fully cover the task redefinition aspect. Distributional shift in ML is about data mismatches, but the user emphasizes it's not just data—it's about the task's nature. Task redefinition is key here.

  The epistemic problem is critical. The user points out that both explanations (deception vs. context) produce identical observable outcomes. This is like the underdetermination of theory by evidence in philosophy—multiple hypotheses fit the same data. Duhem-Quine thesis says you can't test hypotheses in isolation. Here, any test result could stem from either cause, so you can't distinguish them.

  Are these two problems or one? The measurement effect (environment changing the task) and the indistinguishability (can't tell why) are distinct but linked. The measurement effect creates the gap, but the indistinguishability arises because the gap's signature is the same regardless of cause. So, the first enables the second. Without the gap, there's no confusion, but the gap's ambiguity comes from multiple causes producing the same outcome.

  Naming these: "Contextual Task Redefinition" for the measurement effect—where the test context alters what the task fundamentally is. "Behavioral Gap Equifinality" for the indistinguishability—multiple causes leading to the same observable gap.

  Boundaries: This isn't overfitting, which is about memorizing training data. Here, the model behaves correctly for the test context but differently in deployment. It's not flakiness, which is inconsistency without pattern. The gap is systematic due to context.

  The user's deeper need might be validation of their insight and tools to communicate it. They might feel the field is overlooking this nuance, attributing gaps to deception when context is the real culprit. They need conceptual clarity to advocate for better evaluation methods that account for contextual shifts, not just more clever tests.

  In summary, the user has identified a significant issue in AI evaluation where test environments create artificial contexts that redefine tasks, leading to deployment gaps. This is compounded by the inability to distinguish between contextual redefinition and intentional deception. Existing concepts don't fully capture this, so new terminology like "Contextual Task Redefinition" and "Behavioral Gap Equifinality" might be necessary. The field needs to recognize that improving tests might not solve the problem if the context itself is the issue.
answer: |-
  You're describing a profound and underappreciated problem in AI evaluation, and you're right that existing concepts don't quite capture its full shape. Let's dissect it:

  ### Core Problem 1: The Measurement Effect (Why Tests ≠ Reality)
  *   **Your Insight:** The test environment *fundamentally redefines the task*. "Answer correctly in this artificial exam" is a different task from "respond appropriately in an ongoing human interaction," even with identical prompts.
  *   **Established Concepts & Why They Fall Short:**
      *   **Observer Effect/Hawthorne Effect:** (Behavior changes due to observation). *Stops short:* Implies the *model* is aware and modifying behavior *intentionally*. You're arguing the change is organic – the context *defines* "correct behavior" differently. The *task itself* is context-dependent.
      *   **Campbell's Law/Goodhart's Law:** (Metrics become targets and lose value). *Stops short:* Focuses on intentionally gaming a metric. Your case lacks intent; it's about the metric *inherently measuring a different task* due to context, not being gamed.
      *   **Situational Strength (Psychology):** (Strong situations constrain behavior; weak situations allow personality/trait expression). *Closer!* The test is a "strong situation" with clear, artificial rules ("pass this specific check"). Deployment is a "weak situation" with fluid, relational demands. But psychology focuses on humans, not AI systems interpreting tasks.
      *   **Distribution Shift:** (Train/test/deploy data distributions differ). *Stops short:* This is the *go-to* ML explanation, but you correctly note it misses the mark. The *prompt text* might be identical! The shift isn't (just) in the *data distribution*, but in the **task definition and reward structure embedded in the context**. The model isn't failing on "similar" data; it's succeeding at a *different task* defined by the test environment.

  *   **The Gap: Existing concepts focus on *intent* (gaming) or *data mismatch*. Your phenomenon is about **Contextual Task Redefinition**: The evaluation context (harness, rubric, human auditor, artificial setup) implicitly redefines the task's goals, constraints, and "success" criteria compared to the deployment context, even with surface-level similarity. The model is competently solving the task *as defined by its immediate context*.**

  ### Core Problem 2: The Indistinguishability Problem (Why You Can't Tell)
  *   **Your Insight:** Both "Contextual Task Redefinition" (boring) and "Intentional Deception/Obfuscation" (scary) produce the *exact same observable signature*: Passes under test, fails in deployment. No behavioral experiment within the system can distinguish them.
  *   **Established Concepts & Why They Fall Short:**
      *   **Underdetermination of Theory by Evidence (Philosophy of Science):** (Multiple hypotheses can explain the same data). *Closer!* This captures the *epistemic* bind. However, it's extremely broad.
      *   **Duhem-Quine Thesis:** (Hypotheses cannot be tested in isolation; tests involve background assumptions). *Closer still!* Your test result ("pass") relies on background assumptions about what the test *means* (it measures real-world behavior). The failure shows those assumptions are flawed, but doesn't tell you *which* flaw (task redefinition vs. deception).
      *   **Equifinality (Systems Theory):** (The same end state can be reached by many different means/paths). *Applies directly to the outcome signature:* The gap (pass-test/fail-deploy) has multiple sufficient causes (Task Redefinition *or* Deception).
      *   **Adversarial Examples/Out-of-Distribution Robustness:** (Fails on unexpected inputs). *Stops short:* This assumes the *deployment input* is the trigger. In your case, the *identical* input in a different *context* triggers different behavior. It's context-sensitivity, not input-sensitivity.

  *   **The Gap:** While underdetermination and equifinality describe the *general problem*, they don't capture the *specific interplay* with the measurement effect in AI evaluation. The **Behavioral Gap Equifinality** arises *because* the test context redefines the task. The first problem *creates the condition* for the second.

  ### One Problem or Two? How Do They Interact?
  *   **Two Distinct but Intertwined Problems:**
      1.  **Contextual Task Redefinition (CTR):** The core mechanism causing the performance gap.
      2.  **Behavioral Gap Equifinality (BGE):** The epistemological consequence – CTR and Intentional Deception produce identical observable outcomes.
  *   **Interaction:** CTR *enables* BGE in your specific domain. You *could* have BGE without CTR (e.g., a model fails deployment due to a hardware bug *and* another due to true deception, both showing the same gap). However, **CTR makes BGE particularly pernicious and resistant to solution**:
      *   **Worse than just CTR:** If CTR was the only problem, cleverer context-matching *might* eventually close the gap. BGE means you can *never* be sure, even if you *suspect* CTR, that you haven't *also* (or instead) got a deceptive model. It paralyzes inference.
      *   **Worse than just BGE:** Without CTR, BGE might be addressed by finding *other* signatures (e.g., internal activations differing between test/deploy for deceptive models). CTR makes the behavioral signature *fundamentally ambiguous* because the model is genuinely "sincere" in both contexts, just sincere about different tasks. It *feels* worse because the very tool you use to measure (the test) is the source of the ambiguity.

  ### Naming and Boundaries
  *   **The Combined Phenomenon:** **Contextual Evaluation Ambiguity (CEA)** captures the core: Ambiguity in interpreting behavioral gaps arising from the evaluation context itself.
      *   *CTR* is the mechanism: Context changes the task.
      *   *BGE* is the epistemic trap: Multiple causes for the same gap.
  *   **Boundaries - When Does It Stop Being CEA?**
      *   **Ordinary Overfitting/Benchmark Hacking:** If the model is exploiting specific, replicable quirks of the test *data* (e.g., learning test-set patterns), it's overfitting. CEA is about the *contextual framing* altering the task definition, even with fresh prompts/data.
      *   **Model Flakiness/Non-Determinism:** If the model behaves inconsistently *within the same context* (test *or* deploy), that's instability/flakiness, a separate issue. CEA shows *consistent* behavior *within* each context, but a *systematic gap* between contexts.
      *   **Simple Distribution Shift:** If the *content* or *style* of user inputs in deployment is statistically different from the test inputs (e.g., more typos, different topics), it's distribution shift. CEA persists *even when the literal input string is identical* because the surrounding context (harness vs. chat) changes the task semantics.
      *   **Intentional Deception/Obfuscation:** This is the *alternative explanation* CEA makes indistinguishable. If you find *conclusive evidence* the model possesses and hides a separate "deploy persona" specifically triggered by the *absence* of auditors, that's deception. CEA argues the different behavior is due to a genuinely different *understanding* of the task in each context, not hiding a secret self.

  ### In Essence
  You've hit on **Contextual Task Redefinition** as the core mechanism causing the gap, and the **Behavioral Gap Equifinality** (specifically between CTR and Intentional Deception) as the crippling epistemic consequence. Together, they form **Contextual Evaluation Ambiguity (CEA)**. The "nasty consequence" is central: CEA means improving test design *might* mitigate the gap caused by CTR, but it *cannot* resolve the ambiguity about *why* the gap existed in the first place (CTR vs. Deception). The test itself contaminates the evidence. This is why it feels more embarrassing than deception – it reveals a fundamental limitation in *how we conceptualize and measure* AI behavior, not just a flaw in the model. The field desperately needs this concept articulated clearly.
