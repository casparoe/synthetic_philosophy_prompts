answer: |-
  ### The Sestina: "The Unseen Key"

  In the perfect mind, the argument lies closed.  
  You hold each premise, polished and exact.  
  The conclusions follow, swift and clean.  
  No need to count the step by step—  
  It's bathed in an unwavering light.  
  The final answer must be true.  

  But I have known these facts for years, true  
  Yet never found the door that should be closed.  
  I grope in the half-light,  
  Fumbling for the handle I once held.  
  Each hesitant step  
  Leads nowhere. The chain refuses to follow.  

  Why must it follow? The destination's true,  
  But I'm frozen mid-step.  
  The garden gate stays closed,  
  Though I've clutched the key. My grip won't hold  
  Against the rust. The blinding light  
  Was always there—why seek the light?  

  In separate drawers, I hoard the light:  
  One beam can't reach the facts that follow  
  Elsewhere. Here, a shard of true,  
  There, another. The cabinet stays closed  
  Between them. How can one hand hold  
  Both while taking the next step?  

  Each step costs more. The failing light  
  Dims the path. I follow  
  A fading trail. Was it ever true?  
  My arms ache. I cannot hold  
  The weight. The map is closed  
  To me, but I force another step.  

  I try to hold the fragments. Every step  
  Shatters a truth. The guttering light  
  Lies. I cannot follow  
  The design I drew. The journal slams closed.  

  We hold the scattered pages, take one step  
  Through walls that contradict, toward a light  
  That follows nothing. True stays closed.  

