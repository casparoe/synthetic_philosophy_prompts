  The user's setup is based on Ellsberg's three-color urn experiment. The key steps are: (1) rational preferences depend only on beliefs and utilities, (2) with no evidence, the only rational probability is 1/3 for each color, (3) therefore all bets should be equally preferable, (4) but ambiguity-averse people prefer red over black and black-or-yellow over red-or-yellow, leading to the conclusion that this is irrational framing.

