prompt: |-
  I'm a fourth-year political theory PhD student, and because I'm the only person on our graduate student association's elections commission with any background in this stuff, everyone defers to me on a proposal I actually find pretty confusing.

  Here's the situation. Our spring budget referendum keeps going badly. Turnout was 11% last year and members voted down a small fee increase that would have kept the student legal clinic open. Afterwards basically everyone, including the people who'd campaigned against it, agreed that almost nobody had read what the measure actually said, and that a lot of the "no" votes came from people who assumed the money was going to the administration. So a caucus is proposing the following for next spring: before your ballot on the budget measure counts, you take a 20-question check drawn from a published pool of 60 items about the association's own finances — where the money comes from, what the fee would fund, what the bylaws require us to do with a surplus. Unlimited retakes with a 24-hour cooldown. Your vote on the budget question then counts for between 1.0 and 2.5 votes depending on your score, scaled linearly. Officer elections stay one-person-one-vote; the sponsors are adamant those be kept seperate.

  The commission is split and I need to circulate something before Monday. The complications I keep coming back to: the 60-item pool was written by the same caucus sponsoring the proposal, and there's no procedure for checking whether some items nudge you toward the answer the sponsors want. On the practice version, international students and students at the partner community-college programs averaged a weight around 1.4, while domestic students in the STEM doctoral programs averaged around 2.2 — that's roughly a 1.6x difference in raw voting power between two groups of the same membership. One member with a diagnosed reading disability has asked that her weight be set by attendance at an oral briefing instead of a written test, and nobody can tell me whether granting that is a fair accommodation or an open door, since if we recieve a few more requests like it the written check stops mattering. And one commissioner wants to know why, if we accept the principle here, we shouldn't next year be weighting by degree or by year in the program.

  Write the memo I'll circulate: approve, reject, or approve with specific conditions the commission could actually put into a motion. Bottom line in the first two sentences, then the reasoning. Take the sponsors' case seriously rather than just knocking it down — the thing they keep saying is that the point of a referendum is to find out what members would want if they knew what they were voting on, and last year is proof they didn't. No citations or references; nobody on this commission is going to look anything up and neither am I. Hard cap of 500 words.
reasoning: |-
  Okay, the user is a political theory PhD student dealing with a complex proposal for their graduate student association's election process. They need to draft a memo by Monday and are clearly stressed about balancing democratic principles with practical realities. 

  The core tension here is between improving voter competence (the sponsors' valid point) versus creating new inequities (the troubling data on performance gaps and accommodation questions). As a political theory student, the user is probably mentally running through concepts like epistocracy versus egalitarian democracy, but needs to ground this in actionable recommendations.

  Noticing several red flags: the sponsor-crafted questions create conflict of interest, the STEM/non-STEM performance gap suggests systemic bias, and the reading disability accommodation request exposes implementation flaws. The commissioner's slippery slope question about weighting by degree/year is actually useful here - it shows how this could escalate.

  The sponsors have a real point about last year's failure being about voter ignorance, but their solution overcorrects. The memo should validate their concern while rejecting the mechanism. The oral briefing request is particularly damning - if one accommodation undermines the whole system, the system is flawed.

  Hardest part is offering constructive alternatives within the word limit. The "approve with conditions" route is tempting but unrealistic given the proposal's fundamental flaws. Better to reject firmly while throwing the sponsors a bone with the alternative suggestions. The "structured voter guide" idea came from their own practice test pool - that might make it palatable.

  Word count is tight so every justification must pull double duty. Leading with the voting power disparity makes the strongest case because it's concrete data, not theory. Ending with the slippery slope argument bookends it neatly.
answer: |-
  ## Memo: GSA Elections Commission Recommendation  
  **Bottom line: Reject the weighted voting proposal. While the goal of improving voter competence is valid, the mechanism creates unacceptable inequities and procedural risks that undermine democratic fairness.**

  We take the sponsors’ core concern seriously: last year’s low turnout and uninformed rejection of essential funding demonstrated a failure of the referendum process. Their aim – ensuring voters understand what they are deciding – is fundamentally sound and necessary for legitimate outcomes. However, the proposed solution introduces profound problems:

  1.  **Arbitrary & Unequal Voting Power:** The significant performance disparity revealed in practice (e.g., ~1.6x voting power difference between STEM doctoral and international/community college students) is unacceptable. This disparity doesn't reflect differing stakes or membership rights, but likely differences in prior familiarity, language fluency, or time constraints – factors unrelated to the legitimacy of one's vote. Granting some members inherently more voting power than others based on a test score violates the foundational democratic principle of equal membership within this association.
  2.  **Sponsor Control of Questions:** The lack of a neutral, transparent process for developing, vetting, and updating the question pool is a critical flaw. Allowing the sponsoring caucus sole control over the questions that determine voting weight creates an inherent conflict of interest and potential for bias, real or perceived. Fairness requires independent oversight of the instrument used to weight votes.
  3.  **Unworkable Accommodations & System Integrity:** The request for an oral briefing highlights the proposal's inflexibility. Granting alternative assessments risks inconsistency and undermines the test's purpose. Conversely, denying reasonable accommodations is exclusionary. If multiple members require alternatives, the entire weighting mechanism collapses. The system cannot reliably function if the central metric (the test) can be bypassed.
  4.  **Slippery Slope:** The commissioner’s concern about weighting by degree or year is valid. Accepting the principle that voting power *within the membership* can be differentially weighted based on an arbitrary measure (test score, presumed expertise via degree/year) opens the door to future proposals that further erode equal membership.

  **Recommendation:** Reject this specific proposal. We should instead explore alternative, equitable ways to achieve the sponsors' vital goal of an informed electorate:
  *   **Mandatory, Simplified Voter Guide:** Require voters to view a concise, neutral guide (drafted/approved independently) summarizing key facts *before* accessing the ballot.
  *   **Structured Information Campaign:** Utilize the published 60-item pool not as a test, but as the basis for a robust, association-wide educational campaign (emails, infographics, briefings) *before* the referendum.
  *   **Enhanced Ballot Language:** Radically simplify and clarify the wording of the referendum question itself, explicitly stating the fee's purpose and destination.

  These alternatives focus on *raising collective understanding* without creating tiers of voting power. They address the core problem of ignorance while upholding the principle of equal membership essential to our association's democratic legitimacy.

