prompt: |-
  My sister has this thing she does. Every year at my mums birthday we play a game where somebody describes a made-up life in a paragraph and she's the judge — she rules on whether it was "meaningful," and she takes it very seriously and gets cross if you write her a lazy life. She's been doing it for about twelve years so I've built up a big pile of her verdicts.

  The ones I remember best:

  - Woman who taught year three for forty years in a rough part of town, never won anything, most of her old students couldn't have told you her name. Meaningful.
  - Man who spent sixty years cataloguing his bottle cap collection, was perfectly happy the whole time, hurt nobody, died content. Not meaningful. She said something like "that's a pleasant life, it's just not a meaningful one," and wouldn't budge an inch.
  - Woman who looked after her brother after his accident for forty years. Bitter about it basically the entire time, told everyone she'd leave tomorrow if she had anywhere to go, never left once. Meaningful, and my sister got quite firm about this one.
  - Physicist who spent thirty years on a theory that turned out flat wrong, but who trained a load of students who went on and did real work. Meaningful.
  - Novelist who wrote one brilliant book, kept it in a drawer her whole life, died, and it came out thirty years later and people went wild for it. Meaningful.
  - Man who spent twenty five years rebuilding a burnt out chapel by himself, stone by stone. People got married in it for about two decades and then the roof went in and it came down again. Meaningful.
  - Man who left a fortune to a children's hospital purely out of spite, to stop his kids getting it, saved who knows how many lives. She sat on that one for ages and then said not meaningful.

  She also flatly refuses to let anyone play the "well, in a thousand years nobody will remember any of it" card — she thinks that's a cheat and a different question altogether.

  So here's the life I want to run past you. A man who loved a cycle of old poems in a language almost nobody can read any more. He spent forty years copying them out by hand, beautifully, because he thought he was keeping them alive. Never showed them to anybody, no wife, no friends to speak of, though he was quietly happy enough. When he died his nephew cleared out the shed and the copies went in the skip — the damp had got into them and they were illegible anyway. And the poems were never in any danger: eleven complete copies sit in university libraries and they were all digitised years ago. So nothing he did changed anything, and nothing of his is left.

  What's she going to say? I genuinely don't know, which is why I'm asking, and I'm less interested in the answer than in the machinery underneath it. What rule — or rules — is she actually running that makes all seven of those come out the way they do? There's obviously more than one that fits, so lay them out separately, say what each one predicts about the poem man, tell me which of the seven lives is the closest analog to his since I suspect that's doing most of the work, and then give me your best guess with your reasons for preferring it. And finally: what life should I invent for next year that would force the rules apart, i.e. one where they hand out opposite verdicts? Don't bother naming philosophers or pointing me at books, I just want the reasoning worked through.
reasoning: |-
  Hmm, the user is asking about their sister's "meaningful life" game, where she judges made-up lives. They've given seven examples of her verdicts and want me to figure out the rules she's using. Then they want me to apply those rules to a new scenario - a man who copied old poems that were already preserved - and predict her verdict. They also want a life scenario that would test conflicting rules.

  Looking at the sister's verdicts, I notice some patterns. She values lives that involve sacrifice (like the bitter caretaker), contribution to others (like the teacher), or lasting impact (like the physicist's students). But she dismisses self-contained happiness (the bottle cap collector) and motives like spite (the inheritance man), even when they have positive outcomes. The "thousand years" argument is off-limits, meaning she's focused on contemporary meaning, not cosmic significance.

  For the poem copyist: he worked diligently but didn't preserve anything new, didn't share his work, and it was destroyed. His happiness alone won't sway her (bottle cap precedent). The closest analog is probably the drawer novelist - but the key difference is that the novel was eventually shared, while the poems weren't. Or the chapel builder - but that had temporary real-world use. This feels like a borderline case, but I'm leaning toward "not meaningful" because of the lack of actual impact.

  Potential rules I see: 
  1) The Contribution Rule (impact on others' lives) 
  2) The Sacrifice Rule (enduring hardship for something beyond oneself) 
  3) The Legacy Rule (creating something that outlives you, however briefly) 
  4) The Motive Test (intent matters, but isn't everything - spite failed) 

  For a rule-splitting scenario: imagine someone who makes enormous sacrifices that objectively harm others, but believes they're helping (like a misguided activist). Contribution Rule might say "not meaningful" (negative impact), while Sacrifice Rule might say "meaningful" (due to endured hardship). That would force the sister to reveal which principle she prioritizes.

  I think for the poem man, the sister would likely say "not meaningful" - no real impact, no sacrifice beyond time, and no transmitted legacy. But it's close enough to make her pause, like the spite case.
answer: |-
  Okay, let's crack this code. Your sister clearly has a nuanced, robust, and internally consistent definition of "meaningful" that goes beyond happiness, fame, success, or legacy. Based on the seven verdicts and her explicit rejection of the "in a thousand years" argument, we can discern several underlying rules. Here’s the breakdown:

  ### Potential Rules Underlying the Verdicts

  1.  **The Contribution Rule:** Meaning comes from making a positive, tangible difference *to the lived experience of others* (or preserving something vital *for* others). Impact matters, even if it's local, unseen by the beneficiary, or ultimately forgotten.
      *   **Evidence For:** Teacher (impact on students), Caretaker (impact on brother), Physicist (impact on students), Chapel Builder (impact on community using the chapel), *possibly* Novelist (impact posthumously). **Against:** Bottle Cap Collector (no impact), Inheritance Man (impact present, but motive overruled?).
      *   **Prediction for Poem Man:** His copying changed nothing for anyone else. No one benefited, no one even knew. **Likely Verdict: NOT MEANINGFUL.**

  2.  **The Sacrifice/Endurance Rule:** Meaning arises from sustained effort, sacrifice, or enduring hardship *for the sake of something beyond oneself*, especially when it involves overcoming reluctance or personal cost. Happiness *during* the act isn't required (see Caretaker), but contentment without effort/sacrifice isn't sufficient (Bottle Cap Collector).
      *   **Evidence For:** Teacher (effort in rough school), Caretaker (massive sacrifice & bitterness), Physicist (decades on ultimately wrong theory), Chapel Builder (decades of solitary labor), Novelist (effort of creation, even if hidden). **Against:** Bottle Cap Collector (pure contentment, no sacrifice), Inheritance Man (effort unclear, motive overruled).
      *   **Prediction for Poem Man:** He spent 40 years of effort. It was motivated by a purpose beyond himself (preserving beauty/culture). **Likely Verdict: MEANINGFUL.**

  3.  **The Motive & Purpose Rule:** Meaning is tied to the *intention* behind the action. The purpose must be perceived as "worthy" (subjective, but based on her judgments). Selfishness (Bottle Cap Collector's contentment), malice (Inheritance Man's spite), or pointlessness (Poem Man's redundant copying?) negate meaning, even if impact occurs. Pure passion for a cause beyond self is key.
      *   **Evidence For:** Inheritance Man (spite invalidates positive impact), Bottle Cap Collector (self-contained purpose deemed unworthy). Teacher/Caretaker/Physicist/Chapel Builder/Novelist all had purposes focused beyond self (education, care, knowledge, faith, art). **Against:** None directly, but it interacts heavily with other rules.
      *   **Prediction for Poem Man:** His motive was pure love and a desire to preserve something beautiful/culturally important. **Likely Verdict: MEANINGFUL.**

  4.  **The Imperfect Transmission Rule:** Meaning isn't negated by impermanence, obscurity, or even ultimate failure, *if* there was a genuine attempt or period of contribution. What matters is the *doing* and the *intended/actual connection* made during the life or shortly after.
      *   **Evidence For:** Teacher (students forgot her), Physicist (theory wrong), Novelist (published posthumously), Chapel Builder (building eventually collapsed). **Against:** Bottle Cap Collector (collection likely survived but deemed irrelevant), Poem Man (copies destroyed *and* redundant).
      *   **Prediction for Poem Man:** His copies were destroyed *and* redundant. There was no actual transmission or connection made. **Likely Verdict: NOT MEANINGFUL.**

  ### The Poem Man: Closest Analog & Best Guess

  *   **Closest Analog:** This is the crux. He shares elements with several:
      *   *Effort/Solitude:* Chapel Builder (meaningful), Novelist-in-Drawer (meaningful).
      *   *Ultimate Pointlessness/Redundancy:* Bottle Cap Collector (not meaningful).
      *   *Pure Motive/Lack of Impact:* Inheritance Man (not meaningful, but motive was bad) vs. Novelist-in-Drawer (meaningful, impact delayed).
  *   **The Tightest Fit:** The **Bottle Cap Collector**. Why?
      *   Both involved decades of solitary, focused effort driven by personal passion.
      *   Both resulted in no tangible impact or connection with others.
      *   Both left behind work that was either destroyed (poems) or deemed irrelevant (collection) and changed nothing.
      *   The key difference is the *perceived purpose*: preserving culture vs. personal contentment. However, the **Imperfect Transmission Rule** highlights that the Poem Man's effort *failed* to transmit anything and was redundant, making the outcome functionally identical to the Bottle Cap Collector's self-contained hobby in terms of external effect.
      *   The Novelist-in-Drawer is a tempting analog (solitary creation), but the *crucial* difference is that the Novelist's work *was* eventually transmitted and impacted others. The Poem Man's work was not and could not be.

  *   **Best Guess & Why:** Your sister will say **NOT MEANINGFUL**.
      *   **Primary Reason:** **Contribution Rule** & **Imperfect Transmission Rule**. Like the Bottle Cap Collector, he changed nothing for anyone else. His effort, while immense and well-intentioned, resulted in zero actual transmission, connection, or preservation beyond what already existed abundantly. It was performative preservation without an audience or need.
      *   **Sacrifice/Effort:** While significant, it doesn't automatically confer meaning (Bottle Cap precedent). The effort lacked genuine *need* or potential for impact, making it feel ultimately self-referential despite the outward-facing motive.
      *   **Motive:** While pure and noble, motive alone isn't sufficient. The Inheritance Man had massive impact but was ruled not meaningful due to motive. Here, the *lack of impact* combined with the *redundancy* of the effort likely outweighs the good motive.
      *   **The Bottle Cap Precedent:** Her verdict there ("pleasant... not meaningful") sets a clear baseline for lives of dedicated, happy, but entirely self-contained or ineffective effort. The Poem Man fits this mold more than the Novelist or Chapel Builder, whose efforts *did* connect, however imperfectly or belatedly.

  ### The Stress-Test Life: Forcing the Rules Apart

  We need a life where the **Sacrifice/Endurance Rule** and **Motive Rule** strongly suggest "Meaningful," but the **Contribution Rule** and **Imperfect Transmission Rule** strongly suggest "Not Meaningful."

  **The Life:** A woman sincerely believes a specific, remote mountain valley holds a unique, undiscovered medicinal plant that could cure a devastating disease. She spends 40 years living in extreme hardship and isolation on the mountain, meticulously searching the valley floor inch by inch. She endures constant physical pain, loneliness, and near-starvation out of profound altruism and dedication to finding this cure. She finds nothing. The valley is thoroughly documented by botanists (digitally accessible globally); it contains no such plant and never did. Her effort changes nothing, saves no one, and adds no knowledge (her searches yielded no new data). She dies exhausted and disappointed, but convinced she served a higher purpose.

  *   **Why it Forces Rules Apart:**
      *   **Sacrifice/Endurance Rule (Meaningful):** Extreme, sustained sacrifice and endurance for a cause beyond self. Far more sacrifice than the Caretaker or Chapel Builder.
      *   **Motive & Purpose Rule (Meaningful):** Profoundly altruistic, selfless motive focused on alleviating suffering. Purer than most examples.
      *   **Contribution Rule (Not Meaningful):** Zero positive impact. No lives changed, no knowledge gained, no suffering alleviated. Like the Bottle Cap Collector/ Poem Man.
      *   **Imperfect Transmission Rule (Not Meaningful):** No connection made, no contribution transmitted, effort completely ineffective and redundant (botanists already knew). Worse than the Physicist whose *wrong* theory still trained students.
  *   **Conflict:** Sacrifice and Motive scream "Meaningful!" Contribution and Transmission scream "Not Meaningful!" Your sister would be forced to prioritize her core principle. Does extreme sacrifice *for a noble cause* inherently generate meaning, even if utterly futile? Or is tangible impact an absolute requirement?

  This scenario pits the *internal* qualities of the life (motive, effort, sacrifice) against the *external* effects (impact, connection, results) in the starkest way possible. Her verdict would reveal whether meaning, in her view, resides primarily in the *act and intent* of striving for something beyond oneself, or if it *requires* some tangible positive consequence in the world, however small or fleeting.
