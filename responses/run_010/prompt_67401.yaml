answer: |-
  ### Exam Question  
  **PHIL 220: Philosophy of Mind | Final Examination**  
  **Time Allowed:** 45 minutes | **Marks:** 25  

  > **Question:** In a small religious community, members are trained from childhood to describe human behaviour *only* in terms of dispositions and physical goings-on. They avoid all reference to beliefs, desires, intentions, or other propositional attitudes. For example, when a widow grieves, she says: *"the crying comes now, and the going to the window at dusk."* This is accepted as a complete account of her state and can be corrected by others if inaccurate. The community still teaches children, deceives one another, and experiences surprise.  
  >  
  > A philosopher argues this proves folk psychology is optional: the community functions without positing propositional attitudes, so such attitudes likely do not exist.  
  >  
  > Critically evaluate this argument. Your answer should address:  
  > (a) Whether the community’s idiom genuinely *replaces* folk psychology or merely *relabels* it;  
  > (b) What this linguistic practice could demonstrate about the *reality* of propositional attitudes;  
  > (c) Whether the philosopher’s own eliminativist claim (that attitudes "were never there") is undermined by the act of making it.  

  ---

  ### Model Answer (c. 700 words)  
  The philosopher’s argument commits a category error: it conflates *descriptive practices* with *ontological commitments*. While the community’s idiom avoids propositional attitude vocabulary, their behaviour retains functional hallmarks of intentionality (e.g., teaching implies knowledge transfer; deception requires false-belief tracking). This suggests their idiom may be a relabelling exercise rather than a true alternative framework.  

  **(a) Relabelling vs. Replacement**  
  The community’s idiom appears parasitic on folk psychology. When the widow reports *"the crying comes"*, this is treated as a *corrigible account* of her state—implying an implicit appeal to truth-conditions. Correcting her requires assessing whether the description *matches* an internal reality, a move that presupposes intentionality. Similarly, teaching children requires attributing ignorance (a propositional state), while surprise implies violated expectations (beliefs). The eliminativist must explain how these practices function without smuggled-in intentionality. If they cannot, the idiom is merely a stylistic variant of folk psychology, not its elimination.  

  **(b) Linguistic Practice and Ontology**  
  Linguistic abstention does not entail ontological absence. Consider a community that avoids "virus" talk, describing illness only as "unbidden fevers". This wouldn’t prove viruses are unreal; it might reflect epistemic caution or cultural norms. Likewise, the sect’s idiom could stem from theological views about humility (e.g., avoiding presumptions about others’ minds) rather than insight into mental ontology. The burden is on the eliminativist to show that the *success* of their practices *requires no appeal* to attitudes. Yet deception—central to the community—inherently relies on manipulating others’ beliefs. If attitudes were absent, what is being manipulated? The eliminativist must either deny deception occurs (contradicting the scenario) or reduce it to non-intentional terms (e.g., "behavioural triggering"), which may prove inadequate.  

  **(c) Self-Undermining and the Eliminativist’s Claim**  
  The philosopher’s assertion that "attitudes were never there" faces a self-referential problem. To argue eliminativism is *true* is to present it as a belief justified by evidence—a propositional attitude. The common rebuttal—"saying isn’t believing"—fails here. When the philosopher *corrects* folk psychology (e.g., "You mistakenly posit beliefs; here’s why"), she implicitly commits to the truth of her claim and the error of others, replicating the very attitude structure she denies. Appeals to "neuroscience will explain everything" evade the issue: the *present* act of persuasion relies on intentionality. If eliminativism is correct, her argument cannot be *about* anything (including attitudes), rendering it self-nullifying.  

  **Conclusion**  
  The community’s practices do not prove attitudes are optional; they demonstrate that *language* is flexible, not that the underlying phenomena vanish. The eliminativist overextends linguistic evidence into ontology while ignoring functional dependencies in the community’s own behaviour. Worse, her argument depends on the intentional framework it seeks to eliminate. A stronger case would require showing how teaching or deception reduces to non-intentional mechanisms *without loss of explanatory power*—a hurdle no eliminativist has cleared.  

  ---

  ### Marking Scheme (Total: 25 marks)  
  1. **Identifies the conflation of language and ontology** (3 marks)  
     *Fumble:* Assumes linguistic avoidance proves non-existence without argument.  
  2. **Analyses corrigibility as implying intentionality** (4 marks)  
     *Fumble:* Treats the widow’s report as purely behavioural, ignoring its status as a *correctible account*.  
  3. **Explains why teaching/deception/surprise challenge eliminativism** (4 marks)  
     *Fumble:* Claims these can be "re-described" without showing how non-intentional terms capture their complexity.  
  4. **Distinguishes relabelling from replacement** (3 marks)  
     *Fumble:* Assumes avoidance = elimination without probing functional equivalences.  
  5. **Addresses self-referential problem** (4 marks)  
     *Fumble:* Only states "it’s self-refuting" without explaining *how* the act of arguing commits to intentionality.  
  6. **Critiques "saying isn’t believing" escape hatch** (3 marks)  
     *Fumble:* Accepts this defence uncritically.  
  7. **Synthesises points into coherent evaluation** (4 marks)  
     *Fumble:* Lists criticisms without showing their cumulative force against the argument.  

  ---

  ### Smart-but-Lazy Pitfalls  
  1. **"The sect proves attitudes are optional!"**  
     *Wrong:* Assumes linguistic practice settles ontology. Fails to ask *why* the practices work (e.g., does deception *require* belief-manipulation?). Ignores corrigibility. (Scores ≤10)  
  2. **"It’s like phlogiston—folk psychology is a false theory"**  
     *Wrong:* Recites analogy without applying it. Doesn’t engage whether the sect *actually eliminates* attitudes or just hides them. Omits self-refutation. (Scores ≤12)  
  3. **"Eliminativism is self-refuting because it’s a belief"**  
     *Wrong:* Stops at slogan. Doesn’t show *how* the philosopher’s act of persuasion (e.g., correcting others) commits her to intentionality. Misses that the sect’s *own practices* may undermine eliminativism. (Scores ≤14)  

  **On Your Philosopher Character**: Their argument doesn’t survive contact. Experts would pounce on the intentionality presupposed in the sect’s teaching/correction practices—and the self-referential trap. A sophisticated eliminativist might bite the bullet (e.g., "Our brains don’t *truly* argue, they simulate argument"), but your character’s version is naively linguistic.  

  —  
  *Spellchecked for British English ("behaviour", "practise" [verb], "humourless corrigibility", etc.). "Toward" → "Towards".*
