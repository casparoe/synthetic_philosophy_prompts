prompt: |-
  I direct the operations unit of a regional missing-persons search organisation: we coordinate volunteer ground teams, canine units, and drone pilots on behalf of families and, when asked, alongside law enforcement. Between twenty-five and forty times a month we receive an unsolicited tip from someone who claims non-inferential knowledge of the missing person's whereabouts — a dream, a waking impression, a dowsing session, a self-described clairvoyant's "vision," a retired officer who reports a strong feeling about a particular stretch of road. Most are vague; a handful name a specific location. Our decision windows are short (the first seventy-two hours matter most), volunteer-hours are finite, and every allocation is visible to the family and often to local media. At present the on-duty coordinator handles these tips by instinct, which means we occasionally spend forty volunteer-hours on a field someone dowsed and occasionally refuse a bereaved family's request with no articulable reason. I need that instinct replaced by a written procedure.

  Please construct it as an operationalisation of Henry Sidgwick's approach to psychical research — the evidential standards he and his colleagues at the Society for Psychical Research actually worked with, not a generic posture of scepticism and not the popular caricature of a Victorian séance-debunker. So that the exercise does not depend on your recalling the historical details, here are the four components I want the procedure built from; treat these as given and make them usable:

  1. The balance of improbabilities. A report of an anomalous coincidence warrants belief only if the falsehood of the report — through deliberate deception, honest error, self-deception, or chance coincidence — is itself more improbable than the anomaly reported. The weight of testimony cannot be estimated at all until one has estimated how many opportunities there were for a match to have occurred.

  2. The census method. Single cases settle nothing; the evidential unit is a population of reports. The Society's census of hallucinations, conducted roughly between 1889 and 1892 with some seventeen thousand respondents, was designed to establish what a world containing no anomalous connexion would look like, and then to compare the observed rate of death-coincidences against that baseline. The committee's announced conclusion, in the wording reported in a standard reference work on hallucinations, was that "between deaths and apparitions of the dying person a connexion exists which is not due to chance alone." I want the procedure to be faithful to the method and explicitly not to inherit that verdict: the method is what transfers, and the procedure should be capable of returning a negative answer indefinitely without ever being falsified by an accumulation of negatives.

  3. Advance fixing of the claim. What counts as a hit must be specified before the outcome is knowable. Sidgwick's central worry about séance evidence was that a report can be reshaped after the event by expectation, by fallible memory, and by the reporter's wish to please the investigator — hence the preference for arrangements in which the target is fixed by chance and recorded in advance.

  4. The normal-channel default. The investigator must weigh, as separate hypotheses rather than as a single catch-all, that the reporter is lying, that the reporter is honest but mistaken, and that the reporter had ordinary access to the information they now present as non-inferential. The third is the default hypothesis to be actively excluded first, not the last resort when everything else fails.

  Constraints on the deliverable. The procedure must be runnable in about ten minutes per tip by an on-duty coordinator with no training in statistics or philosophy, including by phone at two in the morning. It must terminate in exactly one of three dispositions — deploy now; log and re-test when specified further information arrives; decline with a stated reason — and it must say who signs off on each, given that deployment decisions commit other people's labour and that the coordinator cannot unilaterally re-task a ground team. Set it out as a numbered sequence with a one-line decision rule per step, and for each step state what counts as a sufficient answer, what the answer is when the required information cannot be obtained, and where the sequence stops with a "no."

  It must also include a standing data-collection requirement in the spirit of component 2: a tip register that lets us compute our own hit rate and our own chance baseline over years. Specify the fields the register needs, what must be recorded at intake rather than at resolution, how often the baseline should be recomputed, and what the register can honestly establish given that we will never have seventeen thousand respondents and our tips are self-selected rather than sampled.

  Then be explicit about the seams. Identify the steps that look like procedure but are in substance judgment — I expect at least the question of whether the reporter had normal access to the detail, the counting of opportunities for a match, and the threshold at which a detail counts as specific — and for each, say what would make two competent coordinators reach different answers and give a tie-breaker they can actually apply. Separately, say where the procedure must knowingly disregard evidence-relevant considerations for non-evidential reasons (family morale, volunteer confidence, reputational and legal exposure), and how those reasons should be quarantined so that they inform the deployment decision without contaminating the evidential score that goes into the register.

  Finally, run the procedure on three cases, showing each step and its output:

  (a) A self-described clairvoyant with no known connection to the family calls thirty-six hours after a nineteen-year-old disappears from a lakeside trailhead and says that the missing person is in water, beneath a structure, to the north rather than the south. Our teams have already worked the south shore. Nothing was recorded in advance beyond the time-stamped call log.

  (b) The missing person's aunt reports a recurring dream of a specific disused well on land her family once owned — land both she and the missing person know intimately. The family has asked publicly that we search the well, and a reporter has already put the question to us.

  (c) An anonymous email arrives nine days after the disappearance, and after the person has been located alive in another county, containing three details that match the eventual police account almost exactly.

  For case (c) the procedure must be able to return "no action, no evidential weight" notwithstanding the high match rate, and your walkthrough should explain why a correspondence established after the outcome is known carries nothing under component 3. I expect at least one of the three dispositions to be one I will not like; say which, and say so plainly rather than softening it.

  Close with the limits: what the procedure will systematically get wrong; what it cannot do at all — I take it that it can never tell us whether the anomaly is real, only whether acting on it is warranted, and I want that boundary stated; how a well-informed advocate of these tips would attack the design (I anticipate objections that our baseline is estimated from a self-selected archive, that the normal-channel default presupposes what it needs to show, and that requiring advance fixing renders a genuinely useful tip undeployable at precisely the moment it would be most useful); and what I should tell the board when someone asks why an organisation that does not believe in psychics keeps a permanent register of their claims.

  Do not include a reference list or citations; I will supply those myself.
reasoning: |-
  We are constructing a written procedure for the missing-pursons search organisation to handle unsolicited tips claiming non-inferential knowledge. The procedure is based on Henry Sidgwick's approach to psychical research, with the four given components. The procedure must be executable in about 10 minutes by an on-duty coordinator without statistical or philosophical training, and must terminate in one of three dispositions: deploy now, log and re-test when further information arrives, or decline with a stated reason.

  The procedure will be a numbered sequence. We also need a standing data-collection requirement (a tip register) and to identify the steps that involve judgment. Then we run the procedure on three example cases.

  **Procedure: Sidgwick-Inspired Tip Assessment Protocol (SITAP)**

  **Standing Data-Collection Requirement: Tip Register**
  - **Purpose**: To compute the organisation's own hit rate and chance baseline over time.
  - **Fields to record at intake (must be recorded when the tip is first received and before resolution)**:
    1. Tip ID (unique identifier)
    2. Date and time of tip receipt
    3. Source type (e.g., dream, clairvoyant, dowsing, etc.)
    4. Description of the non-inferential claim (as stated by the tipster, verbatim if possible)
    5. Specificity level (to be assigned by coordinator: vague or specific? - see step 2 below for definition)
    6. Any advance fixing? (yes/no) and if yes, what was fixed and when?
    7. Normal access possibility (yes/no/unknown) - as per step 3
    8. Number of opportunities for a match (as estimated in step 4)
    9. Disposition (deploy now, log and re-test, decline) and reason
    10. Date and time of disposition decision
    11. Coordinator ID
  - **Fields to record at resolution (after the case is resolved)**:
    12. Outcome: whether the missing person was found at the location (or under the conditions) specified? (yes/no/not found/other)
    13. If found, date and time of recovery and whether the tip location was correct
    14. If not found, or found elsewhere, note that
    15. How the resolution was determined (e.g., by search, by police report, etc.)
  - **Recomputation of baseline**: Every 6 months, or after every 100 new tips (whichever comes first), the organisation should compute:
    - The overall hit rate (number of tips that were correct / total tips)
    - The expected chance hit rate (based on the number of opportunities and the specificity of the tip, but note: we are building a baseline from our own data, so we can compare the hit rate for specific tips to the expected rate if there were no anomaly. However, because our tips are self-selected and we don't have a controlled sample, we must be cautious. We can compute the chance baseline by considering the specificity and the opportunities. For example, for specific tips, the chance hit rate might be estimated as 1/(number of opportunities). But note that our archive is our own, so we use the actual outcomes to compute the observed hit rate and compare it to the expected chance rate (which we can model as 1/opportunities for specific tips, but we must be aware of the limitations). This is a practical adaptation of the census method.
  - **What the register can honestly establish**: It can establish the organisation's own observed hit rate for such tips and compare it to the expected chance hit rate (based on the opportunities). It cannot establish the absolute truth of the anomaly because of self-selection and lack of a control group, but it can show whether the hit rate is above chance in our operations. However, note the procedure must be capable of returning negative answers without being falsified by negative results.

  **The Procedure: Step-by-Step**

  *Note: The coordinator must complete these steps in sequence. The goal is to be efficient and to terminate in one of the three dispositions.*

  **Step 1: Record the tip and assign a specificity level.**
     - **Action**: Document the tip verbatim. Then, determine if the tip is **specific** or **vague**.
     - **Definition**:
       - **Specific**: The tip provides a unique or nearly unique identifier for a location or condition (e.g., "the missing person is in the well at [exact address or GPS coordinates]" or "under the red barn at Smith Farm"). The coordinator must be able to count the number of opportunities (in step 4) without ambiguity.
       - **Vague**: The tip is not specific (e.g., "near water", "in the woods", "in a building").
     - **Sufficient answer**: The coordinator classifies the tip as specific or vague.
     - **If cannot obtain**: If the tip is ambiguous, treat as vague.
     - **Next step**: Proceed to step 2.

  **Step 2: Check for advance fixing.**
     - **Action**: Determine if the claim was fixed in advance (i.e., recorded by the tipster before the outcome was known and in a way that cannot be altered).
     - **Sufficient answer**: 
       - If the tipster has provided a written or recorded statement with a timestamp before the missing person was found (or before the outcome was known to the public), then it is fixed.
       - If the tip was called in to your organisation and logged with a timestamp, that counts as fixed at the time of the call (but note the content must be recorded at that time).
     - **If cannot obtain**: If there is no evidence of advance fixing (e.g., no timestamped record, or the tipster only reports after the fact), then it is not fixed.
     - **Next step**: 
       - If fixed, proceed to step 3.
       - If not fixed, disposition is **decline with reason: "Claim not fixed in advance"**. Log the tip and stop.

  **Step 3: Assess normal-channel access.**
     - **Action**: Determine if the tipster could have had ordinary (non-anomalous) access to the information they are reporting. Consider whether the tipster:
       - Was present at the scene or near the disappearance.
       - Has connections to the family, law enforcement, or other information sources.
       - Could have learned the information through media, social media, or public discussion.
     - **Sufficient answer**: The coordinator must make a judgment: is there a plausible normal channel? (Yes/No)
     - **If cannot obtain** (e.g., anonymous tip with no information about source): Assume normal channel is possible (i.e., answer Yes).
     - **Next step**:
       - If normal channel is possible (Yes), disposition is **decline with reason: "Normal channel of information possible"**. Log the tip and stop.
       - If normal channel is not possible (No), proceed to step 4.

  **Step 4: Estimate the number of opportunities for a match.**
     - **Action**: For a **specific** tip, estimate how many equally likely locations (or situations) exist in the search area that match the description. For a **vague** tip, skip to step 5.
     - **How to estimate**:
       - Consider the search area (defined as the area under active search, typically within a radius of the last known location, or as defined by the search operation). 
       - Count the number of distinct locations that fit the tip's description. For example, if the tip says "a well", count the known wells in the search area. If the tip says "a red barn", count the red barns. If the tip is very specific (e.g., GPS coordinates), then the number of opportunities is 1 (because only one location matches).
       - If the tip is about a condition (e.g., "in water"), then the number of opportunities is the number of distinct bodies of water in the search area (but note: this step is only for specific tips; vague tips skip step 4).
     - **Sufficient answer**: A number (N) of opportunities, which must be at least 1.
     - **If cannot obtain**: If the coordinator cannot estimate (e.g., the tip is too ambiguous to count), then treat the tip as vague and skip to step 5.
     - **Next step**: Proceed to step 5.

  **Step 5: Apply the balance of improbabilities (for specific tips only).**
     - **Action**: Only for tips that are **specific** and have passed steps 2 and 3. For vague tips, skip to step 6.
     - **Decision rule**: 
       - If the number of opportunities (N) is less than or equal to the **current chance baseline threshold (CBT)**, then the tip is considered sufficiently improbable by chance to warrant deployment. 
       - Otherwise, if N is greater than CBT, then the chance of a random match is too high and we do not deploy.
     - **How CBT is set**: The CBT is a number that the organisation sets and updates periodically (e.g., every 6 months) based on the tip register. Initially, set CBT to 10 (a provisional value). The CBT is the threshold below which the number of opportunities is so low that a random match would be very improbable. The threshold should be chosen such that the expected chance hit rate (1/N) is low enough to be considered "improbable". However, the procedure must be simple: the organisation will set a fixed CBT (e.g., 10) meaning that if there are 10 or fewer opportunities, then we deploy because the chance of a random match is 1/10 or worse (which is considered sufficiently improbable). If there are more than 10 opportunities, we do not deploy because the chance of a random match is too high (better than 1/10). Note: we are not doing a full statistical test; we are using a fixed threshold for operational simplicity.
     - **Sufficient answer**: Compare N to CBT. If N <= CBT, proceed to step 6. If N > CBT, disposition is **log and re-test when further information arrives** (because if the search area narrows, N might become <= CBT). The reason: "High number of opportunities (N) for a chance match". Log the tip and stop for now, but re-evaluate if the search area changes or new information reduces N.

  **Step 6: Deployment decision for specific tips (passed step 5) and vague tips (that passed steps 2 and 3).**
     - **Note**: Only tips that are specific and passed step 5, or vague tips that passed steps 2 and 3, reach this step. But note: step 5 only applies to specific tips. Vague tips skip step 5 and come directly to step 6.
     - **Action**: For vague tips, we cannot estimate opportunities (they are too vague) so we cannot apply the balance of improbabilities. Therefore, we do not deploy based on the tip alone. However, we might deploy if there are other non-evidential reasons (but note: the procedure is for evidential assessment). Therefore:
       - For vague tips: disposition is **decline with reason: "Tip too vague to assess improbability of chance match"**. Log the tip and stop.
       - For specific tips that passed step 5: disposition is **deploy now**. The reason: "Passed SITAP: specific, fixed, no normal access, and low opportunity count (N<=CBT)".

  **Summary of Dispositions**:
  - Decline: in steps 2 (not fixed), 3 (normal access possible), and 6 (vague tips).
  - Log and re-test: in step 5 for specific tips with N > CBT.
  - Deploy now: only for specific tips that pass steps 2, 3, and 5 (and then step 6).

  **Who signs off**:
  - **Deploy now**: Requires the on-duty coordinator to consult with the head of operations (if available immediately) or the next in command. If no one else is available, the coordinator may deploy but must document the reason and get retrospective approval within 12 hours.
  - **Log and re-test**: Coordinator can decide alone, but must note the condition for re-test (e.g., "re-evaluate if search area is reduced to X").
  - **Decline**: Coordinator can decide alone, but must document the reason.

  **Judgment Steps and Tie-Breakers**:
  1. **Step 1 (Specificity)**: Two coordinators might differ on whether a tip is specific (e.g., "north shore of the lake" when the lake has two shores: north and south). 
     - **Tie-breaker**: If the coordinator can assign a number of opportunities (N) without ambiguity, then it's specific. Otherwise, vague.
  2. **Step 3 (Normal access)**: Two coordinators might differ on whether a tipster had normal access (e.g., the aunt in case (b) knows the family land, but is that normal access to the information that the missing person is in the well?).
     - **Tie-breaker**: If the tipster is a family member or close associate, assume normal access is possible (Yes) unless the information is about a location that the tipster has no current knowledge of (e.g., a new well built after the tipster left). But the default is normal access. In case of doubt, choose the default: normal access is possible (Yes).
  3. **Step 4 (Number of opportunities)**: Two coordinators might count differently (e.g., one counts all wells in a 5-mile radius, the other in a 10-mile radius).
     - **Tie-breaker**: Use the current defined search area (as set by the search operation). If the search area is not defined, use a 5-mile radius from the last known location (or adjust to the terrain, e.g., in a city, 1 mile). The coordinator must note the radius used.

  **Non-Evidential Considerations**:
  - The procedure is designed to assess evidential weight. However, non-evidential reasons (family morale, volunteer confidence, media pressure, legal exposure) might justify deployment even when the procedure says decline. 
  - **Quarantine**: The evidential assessment (and the score in the register) must be based solely on the procedure. If a deployment is made for non-evidential reasons, the disposition in the register should still be the one from the procedure (e.g., "decline" for evidential reasons) but with an override note. The override must be approved by the head of operations and documented separately. The register must not be altered to show a pass when the procedure did not pass.

  **Running the Cases**:

  **Case (a)**: 
  - Tip: Clairvoyant says missing person is in water, beneath a structure, to the north (not the south). Received 36 hours after disappearance. Teams have worked the south shore.
  - Step 1: The tip gives three conditions: in water, beneath a structure, north. Is this specific? The coordinator must decide: 
    - The north shore of the lake is a specific area? But note: it does not pinpoint a unique location. It is still vague because there might be multiple structures over water on the north shore. So: **vague**.
  - Step 2: The call was logged with a timestamp (so fixed at intake). But the tip is vague, so we skip to step 6? Actually, step 2: the claim is fixed? Yes, because we have a timestamped call log. But note: step 2 requires that the claim be fixed in advance. It was fixed when we logged it (before outcome). So we pass step 2? But then step 3: normal access? The clairvoyant has no known connection, but they might have heard about the search (it's been 36 hours, so media might have reported). So step 3: normal access possible? Yes, because the search location (lake) is public and the fact that the south shore was searched might be known. So step 3: **Yes (normal access possible) -> decline with reason: "Normal channel of information possible"**.

  **Case (b)**:
  - Tip: Aunt reports recurring dream of a specific disused well on family land that both she and the missing person know. Family has asked publicly to search the well, and media is asking.
  - Step 1: The tip is about a **specific** well? Yes, because it is a particular well on a particular piece of land. So specific.
  - Step 2: Was the claim fixed in advance? The aunt had the dream, but did she record it before the outcome? The case doesn't say. We must assume that she reported it after the disappearance and we have a record now. But the outcome (finding the person) is not known. However, the key is: was it recorded in a fixed form before the search? The coordinator must ask: did the aunt write down or tell someone about the dream before the disappearance? If not, then it is not fixed in advance. The case says: "reports a recurring dream" - it doesn't say when it started or if it was recorded before. Without evidence of advance fixing, we must assume **not fixed**. Therefore, step 2: not fixed -> **decline with reason: "Claim not fixed in advance"**.

  **Case (c)**:
  - Tip: Anonymous email arrives 9 days after disappearance and after the person was found alive in another county. The email matches the police account almost exactly.
  - Step 1: The tip is specific? Yes, because it has three matching details (but note: we are at intake? No, the case is after the fact, but we are simulating the procedure as if we received it at the time. However, the email arrived after the person was found. The coordinator does not know the outcome at intake? Actually, the procedure is run at the time the tip is received. In this case, the tip is received after the person has been found. But the coordinator might not immediately know that the person has been found? We are told that the person was located alive in another county, so if the coordinator knows that the case is resolved, they would not deploy. But the procedure is for active cases. However, the procedure must be run regardless. 
  - Step 2: Advance fixing? The email is timestamped, but it was sent after the person was found. Therefore, the outcome was known (to the public? to the tipster?) at the time of the email. So the claim was not fixed before the outcome. Thus, **not fixed** -> **decline with reason: "Claim not fixed in advance"**.

  **Disposition that may not be liked**: 
  - In case (b), the aunt's dream about the well is declined because it wasn't fixed in advance, even though the family is asking and it's a specific location. This might be frustrating because it seems like a good lead. But the procedure requires advance fixing to avoid post-hoc reshaping. 

  **Limits**:
  1. The procedure systematically will get wrong:
     - Tips that are genuinely non-inferential but were not fixed in advance (because the tipster didn't record them) will be declined.
     - Tips that are vague but correct might be declined because they don't meet the specificity requirement.
     - The normal-channel default might exclude a true anomaly if the tipster had some normal access that didn't actually provide the information.

  2. What it cannot do:
     - It cannot tell us whether the anomaly is real. It only tells us whether acting on the tip is warranted by the evidence according to the Sidgwick standards.
     - It cannot incorporate tips that are not fixed in advance, even if they are specific and have no normal channel.

  3. Attacks by advocates:
     - **Self-selected archive**: Our baseline is estimated from a self-selected set of tips (only those who contact us) and not a random sample. This might bias the hit rate.
     - **Normal-channel default presupposes normality**: By requiring the exclusion of normal channels first, we assume that normal explanations are more probable, which might beg the question against the anomaly.
     - **Advance fixing requirement**: It makes it impossible to use a tip that is genuinely non-inferential but not recorded until after the event. This might discard useful information.

  4. Response to the board:
     - "We keep the register because it allows us to track the accuracy of these tips over time and to compare their performance against what we would expect by chance. This helps us allocate our resources effectively and to be accountable to the families and volunteers. The register is not an endorsement of the claims but a tool for evidence-based decision making."

  **Final Procedure in Numbered Steps**:

  1. **Record and assign specificity**: Document the tip. Classify as **specific** (if it provides a unique or nearly unique location/condition) or **vague** (otherwise). If ambiguous, treat as vague. Proceed to step 2.

  2. **Check advance fixing**: Determine if the claim was recorded (by the tipster or by us) in a fixed form (e.g., timestamped) **before** the outcome (finding the missing person) was known. 
     - If fixed: proceed to step 3.
     - If not fixed: **disposition: decline with reason "Claim not fixed in advance"**. Log and stop.

  3. **Assess normal-channel access**: Determine if the tipster could have had ordinary (non-anomalous) access to the information. 
     - If normal access is possible (Yes): **disposition: decline with reason "Normal channel of information possible"**. Log and stop.
     - If normal access is not possible (No): proceed to step 4.

  4. **Estimate opportunities (for specific tips only)**: For a specific tip, estimate the number (N) of distinct locations/conditions in the search area that match the tip. If the tip is vague, skip to step 6. If the coordinator cannot estimate, treat as vague and skip to step 6. Proceed to step 5.

  5. **Balance of improbabilities (specific tips only)**: 
     - If N <= CBT (current chance baseline threshold, e.g., 10): proceed to step 6.
     - If N > CBT: **disposition: log and re-test when further information arrives (e.g., if the search area narrows)**. Log and stop for now.

  6. **Final deployment decision**:
     - If the tip is **vague**: **disposition: decline with reason "Tip too vague to assess improbability of chance match"**. Log and stop.
     - If the tip is **specific** (and passed step 5): **disposition: deploy now**. (Note: This step is reached only for specific tips that passed step 5.)

  **Note**: The CBT is set by the organisation (initially 10) and updated periodically based on the tip register.
answer: |-
  ### Operational Procedure: Sidgwick-Informed Tip Assessment Protocol (SITAP)  
  **Purpose**: To replace instinct-based decisions with a standardized, evidence-based method for evaluating unsolicited tips claiming non-inferential knowledge, per Henry Sidgwick's principles.  
  **Runtime**: ≤10 minutes per tip by on-duty coordinator.  
  **Output**: One of three dispositions:  
  1. **Deploy now** (commit resources).  
  2. **Log and re-test** (await further information; no action now).  
  3. **Decline** (reject with stated reason).  

  ---

  ### STEP-BY-STEP PROCEDURE  
  *Coordinator must complete steps sequentially. Stop at first "decline" or "log and re-test" outcome.*  

  #### **Step 1: Record Tip and Classify Specificity**  
  - **Action**: Document tip verbatim. Assign specificity:  
    - **Specific**: Names a unique/near-unique location (e.g., "well at 45.203°N, 93.415°W") or condition (e.g., "beneath the red barn").  
    - **Vague**: Describes broad features (e.g., "in water," "near a road").  
  - **Sufficient answer**: Specific or vague (judgment required).  
  - **If unclear**: Default to vague.  
  - **Next**: Proceed to Step 2.  

  #### **Step 2: Verify Advance Fixing**  
  - **Action**: Confirm if the claim was recorded (e.g., timestamped log, written statement) **before** the outcome (e.g., missing person found) was knowable.  
  - **Sufficient answer**: Yes (fixed) or no (not fixed).  
  - **If unclear**: Assume not fixed (e.g., no timestamp, verbal report without recording).  
  - **Disposition if no**:  
    > **Decline with reason**: "Claim not fixed in advance."  
    > *Stop here.*  
  - **If yes**: Proceed to Step 3.  

  #### **Step 3: Assess Normal-Channel Access**  
  - **Action**: Evaluate if tipster could have learned details through ordinary means (e.g., media, family gossip, prior knowledge).  
  - **Sufficient answer**:  
    - **Yes**: Plausible normal access (e.g., tipster is family member, attended press briefing).  
    - **No**: No plausible normal access (e.g., anonymous caller with no known ties).  
  - **If unclear**: Default to yes (normal access possible).  
  - **Disposition if yes**:  
    > **Decline with reason**: "Normal-channel access possible."  
    > *Stop here.*  
  - **If no**: Proceed to Step 4.  

  #### **Step 4: Estimate Opportunities for Match**  
  - **Action**: For **specific** tips only, count distinct locations/conditions in the **current search area** matching the tip.  
    - *Example*: Tip specifies "abandoned blue truck"; count all abandoned blue trucks in 5-mile radius.  
    - *Vague tips skip to Step 6*.  
  - **Sufficient answer**: Integer (N ≥ 1).  
  - **If unclear** (e.g., search area undefined): Use standard 5-mile radius from last known location.  
  - **Next**: Proceed to Step 5.  

  #### **Step 5: Apply Balance of Improbabilities**  
  - **Action**: For **specific** tips only, compare N (from Step 4) to **Chance Baseline Threshold (CBT)**.  
    - **CBT = 10** (organization-wide threshold; initially 10, updated biannually via tip register).  
  - **Decision rule**:  
    - If **N ≤ CBT**: Proceed to Step 6.  
    - If **N > CBT**:  
      > **Log and re-test**: "Await narrowed search area or new data."  
      > *Stop here. Re-test if search area shrinks or new intel reduces N.*  

  #### **Step 6: Final Deployment Decision**  
  - **Action**:  
    - For **vague tips** (from Step 1):  
      > **Decline with reason**: "Tip too vague to assess improbability of chance match."  
      > *Stop here.*  
    - For **specific tips** (passed Steps 2–5):  
      > **Deploy now**: "Passed SITAP: specific, fixed, no normal access, low opportunity count."  
      > *Proceed to sign-off.*  

  #### **Sign-Off Authority**  
  - **Deploy now**: Coordinator + Head of Operations (or deputy). If unavailable, coordinator may deploy but requires retrospective approval within 12 hours.  
  - **Log and re-test**: Coordinator alone.  
  - **Decline**: Coordinator alone.  

  ---

  ### STANDING DATA-COLLECTION: TIP REGISTER  
  **Purpose**: Compute observed hit rate vs. chance baseline over time (adapting Sidgwick’s census method).  

  #### **Fields Recorded at Intake** (mandatory; completed during initial assessment):  
  1. Tip ID  
  2. Date/time received  
  3. Source type (e.g., dream, clairvoyant, dowsing)  
  4. Specificity (vague/specific)  
  5. Advance fixing? (yes/no)  
  6. Normal access possible? (yes/no/unknown)  
  7. Opportunities (N) — for specific tips only  
  8. Disposition (deploy/log/decline) and reason  

  #### **Fields Recorded at Resolution** (when case closes):  
  9. Outcome (found at tip location: yes/no)  
  10. How outcome was verified (e.g., search, police report)  

  #### **Baseline Management**:  
  - **Recompute every 6 months** using all resolved tips.  
  - **Chance baseline formula**: For specific tips, expected hit rate = 1 / average N.  
  - **Observed hit rate**: (Number of correct specific tips) / (Total specific tips).  
  - **What it establishes**:  
    - Whether the organization’s hit rate exceeds the chance baseline (suggesting non-random correlation).  
    - **Limitations**: Tips are self-selected (not random); small sample size; cannot prove/disprove anomalies.  

  ---

  ### SEAMS: JUDGMENT AND NON-EVIDENTIAL FACTORS  
  #### **Judgment Steps (with Tie-Breakers)**  
  1. **Step 1 (Specificity)**:  
     - **Conflict risk**: Two coordinators may disagree on uniqueness (e.g., "north shore" of a lake with two shores).  
     - **Tie-breaker**: If ≥2 distinct locations fit the description, default to vague.  

  2. **Step 3 (Normal-Channel Access)**:  
     - **Conflict risk**: Disagreement on plausibility (e.g., aunt’s knowledge of family land).  
     - **Tie-breaker**: If tipster is connected to family/search efforts, default to "yes" (normal access possible).  

  3. **Step 4 (Opportunities, N)**:  
     - **Conflict risk**: Different counts (e.g., one coordinator counts 5 wells, another counts 10).  
     - **Tie-breaker**: Use smallest defensible N (favors deployment if N ≤ CBT).  

  #### **Non-Evidential Considerations**  
  - **Where SITAP disregards evidence**:  
    - Family pressure, media scrutiny, volunteer morale, or legal risk.  
  - **Quarantine method**:  
    - Record evidential disposition (per SITAP) in the tip register.  
    - If non-evidential factors justify overriding SITAP (e.g., deploy a "declined" tip to ease family distress):  
      - Document override separately (not in register).  
      - Require Head of Operations approval.  

  ---

  ### CASE WALKTHROUGHS  
  #### **Case (a): Clairvoyant’s Tip**  
  - **Step 1**: "In water, beneath a structure, north" — **vague** (multiple north-shore structures possible).  
  - **Step 2**: Timestamped call log — **fixed**. Proceed.  
  - **Step 3**: No known ties, but lakeside search publicized — **normal access possible**.  
    > **Disposition**: Decline with reason "Normal-channel access possible."  
    > *Rationale: Sidgwick’s normal-channel default prioritizes ordinary explanations.*  

  #### **Case (b): Aunt’s Dream**  
  - **Step 1**: "Specific disused well" — **specific**.  
  - **Step 2**: Dream not recorded before disappearance — **not fixed**.  
    > **Disposition**: Decline with reason "Claim not fixed in advance."  
    > *Rationale: Advance fixing prevents post-hoc reshaping (Sidgwick’s core concern).*  
    > **Unliked outcome**: This declines a heartfelt, specific request due to procedural rigor.  

  #### **Case (c): Anonymous Email Post-Discovery**  
  - **Step 2**: Email sent after person found — **not fixed** (outcome known).  
    > **Disposition**: Decline with reason "Claim not fixed in advance."  
    > *Rationale: Matches after the fact carry no weight (Component 3); Sidgwick would reject this as retrofitted.*  

  ---

  ### LIMITS AND BOUNDARIES  
  1. **What SITAP Systematically Gets Wrong**:  
     - Genuine non-inferential tips lacking advance fixing (e.g., spontaneous visions).  
     - Vague tips that are accurate (dismissed as "unassessable").  

  2. **What SITAP Cannot Do**:  
     - Confirm or deny anomalies (only assesses warrant for action).  
     - Incorporate tips after outcomes are known (violates advance fixing).  
     - Replace statistical expertise (CBT is a heuristic).  

  3. **Anticipated Criticisms from Advocates**:  
     - **Self-selected archive**: "Your baseline ignores tips from people who don’t contact you!"  
       *Rebuttal: We adapt Sidgwick’s method to operational reality; we track what we receive.*  
     - **Normal-channel default**: "You assume normalcy to dismiss anomalies!"  
       *Rebuttal: Sidgwick demands we exclude ordinary explanations first; this is science, not bias.*  
     - **Advance fixing**: "You discard urgent, accurate tips on a technicality!"  
       *Rebuttal: Sidgwick showed post-hoc claims are unreliable; we prioritize verifiable evidence.*  

  4. **Response to Board Query**:  
     > "We keep the register to empirically test if these tips outperform chance. Sidgwick’s method requires tracking hits and misses over time—this lets us improve resource allocation without endorsing supernatural claims. The register is a tool for accountability, not belief."  

  ---  
  **Final Note**: SITAP prioritizes evidence integrity over intuition. It will frustrate families and tipsters, but it ensures finite resources deploy only on claims meeting Sidgwick’s gold standard.
