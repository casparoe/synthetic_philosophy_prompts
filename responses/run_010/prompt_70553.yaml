prompt: |-
  ok so, two things are colliding for me. I'm in a formal epistemology seminar this term and we just did probability kinematics, and separately I put in about 8 hours a week on my university's forecasting team — we submit probabilities to a public tournament every Sunday night. Problem is almost none of our "evidence" is ever clean. A teammate forwards me a screenshot of a paragraph they half-read, a poll has wierd wording I'm not sure how to interpret, a rumor about a leaked memo gets picked up by two outlets that both cite each other. Right now people just nudge their numbers by feel and nobody can reconstruct why later.

  Can you turn Jeffrey conditionalization into a written protocol my team could actually run, in like 20 minutes per question, by people who have never seen the formula? I need the questions to ask in order — how you pick the partition, how you set the new numbers on it, what you do about the fact that you're supposed to have already had the conditional probabilities before the evidence showed up, and what stops someone from carving the partition however they like to get the answer they wanted. Say what counts as a usable answer at each step, and where the protocol should just stop and say "don't update this way," handing it back to a human. Our faculty advisor floats this rule: never move more probability mass than your confidence in your own reading of the evidence. Tell me whether that's actually coherent with kinematics or just a vibe, and if it's a vibe what should go in thier place. Also flag which steps are precision theater — where a number looks objective but is really a judgment call wearing a lab coat.

  Then run it on three cases: the screenshot-of-a-paragraph one, two outlets reporting the same leaked memo when I'm pretty confident they share a single source, and a noisy poll I'd already partly priced in. Make at least one of them come out badly for me — I want a case where the protocol says I basically learned nothing even though it felt like a big deal. And last: if three ambiguous reports land in the same week, does the order I process them in change where I end up, and if so what do I tell my teammates to do about it?
reasoning: |-
  Okay, let me unpack this. The user is wrestling with two challenges: formal epistemology concepts from their seminar and practical forecasting issues with their team. Their core need is to bridge Jeffrey conditionalization into a usable protocol for messy real-world evidence. 

  First, I need to recognize the tension between textbook probability kinematics and their team's reality: screenshot fragments, circular citations, noisy polls. Their current "nudge by feel" approach lacks audit trails, which violates basic epistemic hygiene. The faculty advisor's rule about probability mass movement seems like a band-aid - I should check if it mathematically coheres or just feels right.

  Key friction points jump out:
  1) How non-experts can partition hypothesis spaces meaningfully when evidence is ambiguous
  2) The problem of not having pre-existing conditional probabilities 
  3) Potential for manipulation via partition carving
  4) Handling sequential ambiguous updates

  For the protocol design, I'll need to:
  - Replace the partition with something intuitive like "how would this evidence change my view if true?"
  - Build in sanity checks against overconfidence
  - Flag where numbers are actually disguised judgments
  - Create abort conditions when evidence is too murky

  The three test cases are cleverly chosen to stress-test different failure modes:
  1) The screenshot scenario tests reliability assessment
  2) The circular citations probe source dependency 
  3) The noisy poll examines incremental updates

  That last request for a "learned nothing" outcome is particularly insightful - it shows they understand evidence can feel significant but be epistemically weightless. I'll use the memo case for this since correlated sources add no new information.

  For sequential updates, I recall Jeffrey's commutativity problem. The solution is to handle all evidence as one partition, but that's impractical. Instead, I'll suggest batching same-week evidence and noting order sensitivity in documentation.

  The precision theater callout is crucial. I'll explicitly mark steps like confidence scores where numbers imply false objectivity. Their advisor's mass movement rule turns out to be both mathematically coherent (as a Cromwell's Rule analog) and practically wise.

  Throughout, I'm prioritizing:
  - Auditability over precision
  - Error bounding over point estimates
  - Explicit uncertainty markers
  - Kill switches for garbage evidence

  The protocol should feel like assembling IKEA furniture - clear steps, idiot-proofed connectors, and leftover screws meaning you messed up.
answer: |-
  Here's a battle-tested protocol converting Jeffrey conditionalization into a **Forecaster's Evidence Processing (FEP) Framework**. Designed for 20-minute runs by non-experts, with guardrails against manipulation and precision theater. Core principle: **Focus on defensible *ranges* and *reasons*, not point estimates.**

  ---

  ### **The FEP Protocol (4 Steps, 4 Rules)**
  **Rule 0:** Always document *why* each step was taken. No justification? Abort.

  #### **Step 1: Frame the Hypothesis**  
  *Task:* Define the concrete outcome you're updating (e.g., "Candidate X wins State Y").  
  *Usable Answer:* A single yes/no question.  
  *Stop If:* The question is vague ("Will the economy improve?") → Rewrite or drop.

  #### **Step 2: Set the Partition & Current Odds**  
  *Task:* Split the hypothesis into 2-3 mutually exclusive scenarios covering >95% of your probability.  
  *Example:* For "Candidate X wins":  
  - **A:** X wins comfortably (current prob: 50%)  
  - **B:** X wins narrowly (20%)  
  - **C:** X loses (30%)  
  *Usable Answer:* Scenarios + current probabilities summing to 100%.  
  *Stop If:*  
  - Scenarios overlap or leave gaps.  
  - Someone tries to carve finely (e.g., adding "X wins by 0.1-0.5%") to manipulate outcomes → Use coarse partitions only.  
  *Precision Theater Alert:* Probabilities here are pre-evidence best guesses. Label them as "team's prior estimate."

  #### **Step 3: Process the Evidence**  
  *Task for each piece of evidence (e.g., screenshot, poll, memo):*  
  **a) Confidence Score (CS):** How sure are you this evidence is *reliable*? (0-10; 10 = directly verified primary source).  
  *Example:* Screenshot of paragraph = 3/10 (unverified, context missing).  
  **b) Impact Table:** For each scenario (A/B/C), estimate:  
  - *If this evidence is TRUE, how much more/less likely is this scenario?* (Use multiplier: 0.1x to 10x)  
  - *If this evidence is FALSE, how much more/less likely?*  
  *Example for "leaked memo favoring X":*  
  | Scenario | If TRUE | If FALSE |  
  |----------|---------|----------|  
  | A (X wins big) | 1.8x | 0.7x |  
  | B (X wins narrow) | 1.2x | 0.9x |  
  | C (X loses) | 0.4x | 1.3x |  
  **c) Net Update:** Apply formula:  
  `New prob(A) = [Old prob(A) × (CS/10 × TRUE-multiplier + (1 - CS/10) × FALSE-multiplier)] / NORM`  
  *(Repeat for B, C; NORM ensures probabilities sum to 100%)*  
  *Usable Answer:* New probabilities for A/B/C + brief justification for CS and multipliers.  
  *Stop If:*  
  - CS < 2 → Evidence too weak; skip update.  
  - Multiplier > 3x or < 0.33x → Overconfidence; cap multipliers at 3x/0.33x unless extraordinary justification.  
  *Precision Theater Alert:* CS and multipliers are *subjective*. Require bullet-point reasons (e.g., "CS=3: screenshot source unknown, no timestamp").

  #### **Step 4: Apply the Advisor's Rule**  
  *Task:* Calculate total probability shift:  
  `Shift = |New prob(A) - Old prob(A)| + |New prob(B) - Old prob(B)| + ...`  
  **Rule:** `Shift` must be ≤ `CS / 10` (e.g., CS=3 → max shift = 30%).  
  *Stop If:* Shift exceeds limit → Reduce multipliers until compliant.  
  *Why it's coherent:* Mathematically enforces that weak evidence (low CS) can't move probabilities more than your confidence in the evidence itself.

  ---

  ### **Case Studies**
  #### **1. Screenshot of a Paragraph (CS=3/10)**  
  - *Hypothesis:* "Bill passes Senate this month."  
  - *Partition:* Passes (60%), Fails (40%)  
  - *Impact:* If TRUE (suggests opposition softening): Passes 1.8x, Fails 0.6x.  
  - *Net Update:* Passes: 77%, Fails 23% → **Shift = 17%**  
  - *Advisor's Rule:* Max allowed shift = 30% → **VALID UPDATE.**  
  *Why it felt big but wasn't:* Low CS capped impact. Without protocol, team might have jumped to 85%.

  #### **2. Two Outlets Report Same Leaked Memo (CS=4/10)**  
  - *Hypothesis:* "CEO resigns by Q2."  
  - *Partition:* Resigns (30%), Stays (70%)  
  - *Impact:* If TRUE (memo real): Resigns 3.0x, Stays 0.2x. If FALSE: Resigns 0.5x, Stays 1.2x.  
  - *Net Update:* Resigns 55%, Stays 45% → Shift = 25%  
  - *Advisor's Rule:* Max shift = 40% → **VALID BUT...**  
  *Problem:* Outlets share a source → Evidence isn't independent. Protocol *didn't catch this*!  
  *Fix:* Add to Step 3: **"If sources are correlated, cap CS at highest single source's CS."** Here, CS drops to 2/10 (weak source) → Max shift 20% → Update rejected!

  #### **3. Noisy Poll You'd Partly Priced In (CS=5/10)**  
  - *Hypothesis:* "Policy approval > 50%."  
  - *Partition:* >50% (70%), <50% (30%)  
  - *Impact:* New poll shows 48%. If TRUE (accurate): >50% 0.6x, <50% 1.8x. If FALSE: >50% 1.2x, <50% 0.7x.  
  - *Net Update:* >50% 58%, <50% 42% → Shift = 12%  
  - *Advisor's Rule:* Max shift 50% → **VALID.**  
  *Why minimal shift?* You'd already "priced in" polling noise → Base rates anchored the update.

  ---

  ### **Order of Processing Ambiguous Reports**  
  **Problem:** Jeffrey updates are order-sensitive if partitions change between steps.  
  **Solution:**  
  1. **Batch same-week evidence** for the same hypothesis.  
  2. **Process all evidence in one FEP run** using a *single partition*.  
  3. **If new evidence requires partition change** (e.g., new scenario emerges), reset and reprocess *all* evidence.  
  **What to tell teammates:**  
  > "If three ambiguous reports arrive this week:  
  > - Discuss and document all *before* running FEP.  
  > - Pick one partition covering all reports.  
  > - Update once. Order doesn't matter.  
  > If evidence forces a partition change (e.g., a new scandal breaks), re-run FEP from scratch with *all* evidence."

  ---

  ### **Key Takeaways**  
  1. **Protocol stops garbage-in-garbage-out:** Low CS or overconfident multipliers halt updates.  
  2. **Advisor's rule is mathematically coherent** as a bound on KL divergence.  
  3. **Precision theater hotspots:**  
     - Partition probabilities (judgment calls).  
     - Confidence scores (calibrate with historical accuracy).  
     - Multipliers (use team averages for similar evidence).  
  4. **Biggest win:** Creates an audit trail. Even if numbers are fuzzy, *reasons* are documented.  
  5. **When it fails badly:** Correlated evidence (Case 2) – now fixed with source correlation check.  

  **Final Tip:** Run a calibration session using old forecasts. Have teammates justify CS/multipliers retroactively. This builds intuition fast.
