prompt: |-
  I run the annotation side of a small AI data company — six of us in the office in Manchester, plus about fifteen freelance labellers spread over three time zones, most of them not native English speakers. What I actually spend my week doing is writing the guidelines: a client sends a spec, I turn it into something a normal person can follow without asking me questions every ten minutes, we label a calibration batch, argue about the disagreements, revise, and go again. Every single project hits the same wall. The labellers agree with me on all forty example items, and then in the first real batch they split into two or three camps doing systematically different things — and adding more examples doesn't fix it, it just moves the disagreement further out. A friend who did a philosophy degree mentioned at the pub that this is roughly what Kripke's Wittgenstein is on about, that a finite set of examples can't pin down a rule because you can always cook up a rival rule that fits everything you've shown them and diverges later, and honestly it's been rattling around in my head ever since, because that is a precise description of my job.

  So: could you write me a procedure I can actually run on a guideline, ideally in the couple of hours between the client sending the spec and us starting calibration? I want the steps in order — what to do to a spec before it ever reaches a labeller, what to look for when a disagreement shows up, how to tell apart the cases where the guideline is genuinely indeterminate from the cases where somebody hasn't read it properly (or has read it properly and spotted something I missed), what counts as enough evidence to declare a divergence real rather than noise, and what to do once you've declared it: rewrite, stipulate a tie-breaker, or escalate. I need it to say where the procedure stops and hands the thing to a human because there's no further fact of the matter to dig up, and where it stops and hands it to the client because it's their spec and their risk. Please flag which steps are judgement calls wearing a procedure costume — I'd rather know than discover it in month three. And don't give me an agreement-metric answer: we already compute kappa on every batch and I've come to think its measuring the wrong thing here, since agreeing on the calibration items is exactly what the sceptical problem grants you from the start.

  Then run it on three cases that are basically real. (A) Escalation project, guideline says escalate any message where the customer mentions cancelling their account; two labellers agree on sixty items, then one of them starts not escalating messages where the cancellation is hypothetical or denied — "nothing would make me cancel after eight years" — and when I check, she's been doing it consistently the whole time, not randomly, and every single one of my example items is compatible with what she's doing. (B) A PII project where the guideline lists categories with examples; one labeller starts flagging a first name plus a partial postcode in what turns out to be a village of three hundred people, and job titles at small named companies. I think he's over-labelling and slowing us down, and I'd like the procedure to tell me whether it is. If the honest output is that my guideline is the broken thing and we should re-specify and re-label four thousand items, I want it to say that plainly, because there's a delivery date and I will otherwise talk myself into a patch. (C) A toxicity project where the two readings are both defensible and the team just won't converge — sarcastic praise, and people quoting a slur in order to object to it — and here I want to see what the procedure does when there isn't a more correct reading, only a choice somebody has to own. Finally, tell me what this procedure cannot do, and what a guideline-writer should stop pretending to want; and if any step needs a workshop or a second calibration round to detect something, say how many days that costs, because I have to justify it to our ops lead.
reasoning: |-
  We are facing the problem of rule-following underdetermination as described by Kripke's Wittgenstein: a finite set of examples cannot uniquely determine a rule because there are always multiple rules that fit the examples but diverge on new cases. The goal is to create a procedure that can be run on a guideline before and during the annotation process to detect and address these issues.

  The procedure must:
  1. Be executable in the couple of hours between receiving the spec and starting calibration.
  2. Include steps for pre-processing the spec before it reaches labellers.
  3. Provide a method to analyze disagreements when they appear.
  4. Distinguish between genuine indeterminacy in the guideline and human error (misreading or missing something).
  5. Define what constitutes enough evidence to declare a divergence (systematic disagreement) rather than noise.
  6. Specify actions: rewrite the guideline, stipulate a tie-breaker, or escalate to the client.
  7. Clearly indicate where the procedure stops because there is no further fact (and a human decision is needed) or because the client must decide.
  8. Flag steps that are judgment calls.
  9. Avoid relying solely on agreement metrics (like kappa) because they don't capture the underdetermination problem.

  The procedure will be applied to three real cases (A, B, C) to illustrate.

  Procedure for Guideline Robustness and Disagreement Resolution

  Phase 1: Pre-Calibration (Before Labellers See the Guideline)

  Step 1: Rule Decomposition and Edge Case Elicitation (Time: 30-60 minutes)
     - Break down the guideline into atomic rules (if it's a compound rule, split it).
     - For each rule, brainstorm edge cases (including hypotheticals, negations, ambiguous contexts, etc.). Use the client's spec and domain knowledge.
     - Check for key terms that might be vague (e.g., "cancelling", "PII", "toxicity") and note possible interpretations.
     - *Judgment call*: Deciding which edge cases are relevant and which are too far-fetched. Use the project context to limit to plausible cases.

  Step 2: Rule Validation with Synthetic Examples (Time: 30 minutes)
     - Create a set of synthetic examples (5-10) for each rule that explicitly tests the boundaries identified in Step 1. Include:
          - Clear positive examples (obeying the rule).
          - Clear negative examples (not obeying the rule).
          - Borderline examples (that could go either way).
     - *Important*: These examples are not for training but for stress-testing the guideline. They should not be shown to labellers until after the guideline is fixed (if used in calibration, they become part of the finite set and may not catch the divergence).
     - *Judgment call*: The quality of the synthetic examples depends on the guideline writer's ability to anticipate problems.

  Step 3: Guideline Restructuring (Time: 30-60 minutes)
     - Rewrite the guideline to:
          a. Explicitly state the scope and boundaries (what is in, what is out).
          b. Include counterexamples (what does not trigger the rule) for each rule.
          c. Use unambiguous language (avoid double negatives, use simple terms).
          d. For terms with multiple meanings, provide a definition and examples of what it does and does not cover.
     - *Judgment call*: How much detail to include without making the guideline too long.

  Phase 2: During Calibration and Initial Batches

  Step 4: Calibration Batch Design (Time: 15 minutes)
     - Design the calibration batch to include:
          - Some clear cases (to build confidence and check basic understanding).
          - Some of the borderline synthetic examples from Step 2 (without labeling them as such to the labellers).
          - *Note*: Do not reveal which examples are borderline.

  Step 5: Monitor Calibration Batch Disagreements (Time: 30 minutes for review after labellers complete)
     - Look for patterns in disagreements, especially on borderline examples.
          - If there is disagreement on clear cases: likely human error (misreading) or guideline clarity issue (go to Step 6).
          - If there is agreement on clear cases but disagreement on borderline cases: this is expected, but note the pattern.

  Step 6: Diagnose Disagreement (When a disagreement pattern is observed in the first real batch)
     - Collect the items where disagreement occurred and group by the type of disagreement.
     - For each group, check:
          a. Consistency: Are the labellers applying their interpretation consistently? (Check their other annotations for similar patterns.)
          b. Guideline Adherence: Does the guideline explicitly cover this case? If not, it's an indeterminacy. If it does, then check if the guideline is ambiguous or if one labeller is misreading.
          c. Systematicity: If a labeller is applying a consistent alternative rule (e.g., not escalating hypothetical cancellations) and this rule fits all the calibration examples, then it's a case of underdetermination (Kripkean problem).

  Step 7: Evidence Threshold for Declaring Divergence (Time: 15-30 minutes)
     - A divergence is declared if:
          - There are at least 5 items showing the same pattern of disagreement (to avoid noise).
          - The pattern is consistent for a given labeller (or group of labellers) across multiple items (e.g., the same alternative rule is applied in at least 5 items without contradiction).
          - The alternative rule is not explicitly forbidden by the guideline and fits all prior examples.

  Step 8: Action Based on Diagnosis
     - Case 1: Human Error (misreading or missing a part of the guideline)
          - Provide feedback to the labeller and clarify the guideline (if necessary, add emphasis to the missed part).
          - Re-label the affected items.
     - Case 2: Guideline Indeterminacy (the guideline does not cover the case, or there are multiple defensible interpretations)
          - Option A: If the indeterminacy is for a small set of cases and the project can tolerate a tie-breaker, then add a tie-breaker rule (explicitly state how to decide) and re-label the affected items.
          - Option B: If the indeterminacy is widespread (affecting many cases) or the tie-breaker would be arbitrary and the client might care, then escalate to the client with:
               - The pattern of disagreement.
               - The alternative interpretations (with examples).
               - The recommended resolution and the impact on the dataset.
          - *Judgment call*: Deciding between tie-breaker and escalation. Consider the project scope, client's risk tolerance, and impact on data quality.

  Phase 3: Post-Detection and Handling

  Step 9: Iterate and Document (Time: variable)
     - After making changes (tie-breaker, rewrite, or client decision), run a mini-calibration (a small batch) to check if the disagreement is resolved.
     - Document the issue and the resolution for future reference.

  Step 10: Escalation to Client
     - When escalating, present:
          - The problematic examples (anonymized if necessary).
          - The observed labeller interpretations and their consistency.
          - The potential impact on the dataset (e.g., if 10% of items are affected, and if the alternative rule is used, then X% change in labels).
          - Options (with pros and cons) and a recommended option.

  What the Procedure Cannot Do:
     - It cannot eliminate the underdetermination problem entirely. There will always be new edge cases.
     - It cannot replace the need for domain expertise and human judgment in defining the rules.
     - It cannot guarantee that after a fix, no new divergence will occur (but it reduces the risk).

  Time and Resource Costs:
     - The pre-calibration phase (Steps 1-3) takes about 1.5-2.5 hours and requires only the guideline writer.
     - The calibration batch review (Step 5) and disagreement diagnosis (Step 6) take about 30-60 minutes per batch and require the guideline writer and possibly a senior labeller.
     - If a workshop is needed (for example, to brainstorm edge cases with multiple team members), add 1-2 hours and involve 2-3 people (e.g., the guideline writer and two senior labellers). This might push the time to 3-4 hours total and add 0.5-1 day if scheduling is needed.
     - A second calibration round (if needed) would take 1-2 days (depending on labeller availability) and should only be done if the changes are substantial.

  Now, let's run the procedure on the three cases.

  Case A: Escalation Project
     - Guideline: Escalate any message where the customer mentions cancelling their account.
     - Problem: One labeller does not escalate when cancellation is hypothetical or denied.

     Step 1: Rule decomposition and edge cases.
          - Rule: If the message contains a mention of cancellation, escalate.
          - Edge cases: 
               - Explicit cancellation: "I want to cancel."
               - Hypothetical: "I might cancel."
               - Denial: "I would never cancel."
          - The guideline does not specify whether hypothetical or denial should be escalated.

     Step 2: Synthetic examples (created in pre-calibration):
          - Positive: "Cancel my account." -> escalate.
          - Negative: "I love your service." -> don't escalate.
          - Borderline: "I would cancel if the price increases." -> ? (not covered in guideline)

     Step 3: Guideline restructuring could have included:
          - "Escalate only when the customer expresses an intent to cancel, either current or future. Do not escalate when the customer mentions cancellation in a hypothetical context or denies any intention to cancel."

     Step 6: Diagnosis of the disagreement:
          - The labeller is consistently not escalating hypothetical and denial cases. This is a systematic alternative rule: "escalate only when there is an explicit intent to cancel now or in the future (but not when it's hypothetical or denied)".
          - The guideline did not cover this, so it's indeterminacy.

     Step 7: Evidence threshold met? Yes, because the labeller applied the rule consistently and the pattern was found in multiple items (more than 5).

     Step 8: Action - This is a guideline indeterminacy. We must decide on a tie-breaker or escalate.
          - Since the client might have a strong opinion on whether hypotheticals should be escalated (e.g., for retention efforts), it is recommended to escalate to the client with the two interpretations and examples.

     Outcome: Escalate to client.

  Case B: PII Project
     - Guideline: Lists categories of PII with examples.
     - Problem: One labeller flags first name + partial postcode in a small village and job titles at small named companies.

     Step 1: Rule decomposition and edge cases.
          - What constitutes PII? The guideline likely says: personal information that can identify an individual.
          - Edge cases: 
               - A first name alone? (no, unless it's very rare)
               - A first name with a partial postcode? (maybe, if the area is small)
               - A job title at a large company? (probably not)
               - A job title at a small company? (maybe, if there's only one person with that title)

     Step 2: Synthetic examples:
          - Clear: "John Smith, 123 Main St" -> PII.
          - Clear: "CEO" -> not PII (without context).
          - Borderline: "John, living in CB1" (if CB1 is a large area) -> not PII? But if CB1 is a small village, then maybe.

     Step 3: Guideline restructuring should have included:
          - A rule for combinations: "A piece of information is PII if it can reasonably identify an individual. Consider the context. For example, a first name combined with a small geographic location (e.g., a village) or a job title in a small company may be PII."

     Step 6: Diagnosis:
          - The labeller is consistently flagging these cases. This is a systematic alternative rule: "if the combination of information can identify an individual in context, then it is PII".
          - The guideline did not specify how to evaluate combinations and context, so it's an indeterminacy.

     Step 7: Evidence threshold met? Yes, because the pattern is consistent and multiple items are affected.

     Step 8: Action - This is a guideline issue. The labeller's interpretation is defensible and might even be correct (depending on privacy laws). However, the guideline writer intended to avoid over-labeling? We must check the client's spec and legal requirements.
          - Escalate to the client: the guideline as written is ambiguous and the labeller's interpretation is causing over-labeling (and slowing down). The client must clarify the intended scope of PII in context.

     Outcome: Escalate to client. If the client confirms that the labeller's interpretation is too broad, then rewrite the guideline to explicitly exclude such cases (if legally permissible) and re-label the affected items. Otherwise, accept the interpretation and adjust the timeline.

  Case C: Toxicity Project
     - Problem: Two readings for sarcastic praise and quoting slurs to object to them.

     Step 1: Rule decomposition and edge cases.
          - Toxicity: usually defined as harmful, offensive, or disrespectful.
          - Edge cases: 
               - Sarcastic praise: "Great job, you really messed that up!" -> toxic?
               - Quoting a slur: "He called me a [slur], which is unacceptable." -> toxic?

     Step 2: Synthetic examples:
          - Clear toxic: "You are an idiot."
          - Clear non-toxic: "Thank you for your help."
          - Borderline: "Oh, brilliant move!" (sarcastic) -> ?
          - Borderline: "He used the word [slur]." (in a report) -> ?

     Step 3: Guideline restructuring should have included:
          - "Toxicity is about the intent of the speaker. Sarcastic praise intended to insult is toxic. Quoting a slur for the purpose of condemnation is not toxic, but if the slur is used without condemnation, it may be toxic."

     Step 6: Diagnosis:
          - The labellers are split into two camps: one that labels sarcastic praise as toxic and one that doesn't; one that labels quoted slurs as toxic and one that doesn't. Both interpretations are defensible and consistent.

     Step 7: Evidence threshold met? Yes.

     Step 8: Action - This is a classic case of indeterminacy where there is no single correct answer. The guideline must be clarified by stipulating a tie-breaker. However, this is a subjective area and the client's policy on toxicity should drive the decision.
          - Escalate to the client to choose between the two interpretations? But if the client's spec is already clear enough (check first), then we might have missed it. If not, then:
          - Present the two interpretations and ask the client to break the tie.

     Outcome: Since both interpretations are defensible and the team won't converge, the guideline writer does not have the authority to decide. Escalate to the client with the options and let them own the choice.

  Summary of the Procedure's Limitations:
     - It cannot prevent all future divergences because new edge cases will always emerge.
     - It requires time and effort (pre-calibration steps) that might not be available for very tight deadlines.
     - It relies on the guideline writer's ability to anticipate edge cases, which is imperfect.
     - It might require client involvement, which can cause delays.

  Final Note: The procedure is designed to catch the most common and impactful divergences early. It is a structured way to confront the underdetermination problem and reduce the number of iterations. However, it is not a silver bullet and must be coupled with good communication and documentation practices.
answer: |-
  ### **Procedure: Guideline Robustness & Disagreement Resolution**  
  **Goal:** Identify and resolve rule underdetermination (Kripkean skepticism) *before* it derails labeling.  
  **Time Budget:** 2–3 hours (pre-calibration) + ongoing monitoring.  
  **Key Principles:**  
  - **Preempt divergence** by stress-testing guidelines against edge cases.  
  - **Distinguish noise** (random errors) from **systematic divergence** (rival rules).  
  - **Escalate early** when the guideline, not labellers, is the problem.  

  ---

  ### **Step-by-Step Procedure**  
  #### **Phase 1: Pre-Calibration (Before Labellers Start)**  
  *Time: 60–90 mins*  

  1. **Decompose the Spec into Atomic Rules**  
     - Break the client’s spec into minimal, standalone instructions (e.g., "escalate if cancellation is mentioned" → sub-rules for "cancellation," "mentioned").  
     - *Judgment call:* How granular to split rules (aim for 5–10 atomic rules per project).  

  2. **Generate Edge Cases**  
     - For each atomic rule, brainstorm 5–10 *counterexamples* and *ambiguous cases* using:  
       - Negations (e.g., "I will **not** cancel").  
       - Hypotheticals ("What if I cancel?").  
       - Contextual ambiguity (sarcasm, indirect speech).  
     - *Tools:* Use a simple template:  
       ```  
       Rule: [Atomic rule]  
       Edge Case 1: [Example that challenges the rule]  
       Edge Case 2: [Another challenge]  
       ```  
     - *Judgment call:* Which edge cases are realistic (prioritize based on project history).  

  3. **Revise Guidelines with Explicit Boundaries**  
     - Rewrite guidelines to:  
       - Include **positive examples** (do X), **negative examples** (do not do X), and **boundary examples** (edge cases with rulings).  
       - Define **fuzzy terms** (e.g., "cancelling" → "includes explicit requests or threats, excludes hypotheticals/denials").  
     - *Output:* A guideline with **if-then-else logic** and 10–15 annotated examples.  

  #### **Phase 2: During Calibration & First Batch**  
  *Time: 30–60 mins per disagreement review*  

  4. **Flag Systematic Disagreements (Not Noise)**  
     - After calibration, run a **first real batch** (50–100 items). Review disagreements:  
       - **Noise:** Random errors (e.g., typos, fatigue). Fix with labeller feedback.  
       - **Systematic divergence:** ≥3 labellers *consistently* split into camps (>70% agreement within camp).  
       - *Evidence threshold:* 5+ items with the *same pattern* of disagreement (e.g., all hypothetical cancellations not escalated).  

  5. **Diagnose the Root Cause**  
     - **Test rival rules against edge cases:**  
       - Take 3 disagreed items. Ask each camp: "What rule did you follow?"  
       - Check if *both* rules fit all calibration examples. If yes → **guideline indeterminacy**.  
     - **Triangulate with labeller feedback:**  
       - Sample 1–2 labellers per camp. Ask: "Which part of the guideline supports your approach?"  
       - If they cite valid but conflicting guideline sections → **indeterminacy**.  
       - If they misinterpret clear rules → **human error**.  

  6. **Classify the Problem**  
     - **✅ Human Error:** Labeller skipped a rule (e.g., missed "include hypotheticals").  
       - *Action:* Retrain labeller, add emphasis to guideline.  
     - **⚠️ Genuine Indeterminacy:** Both interpretations fit the spec and examples.  
       - *Action:* Proceed to Step 7.  

  #### **Phase 3: Resolution**  
  *Time: 30–90 mins*  

  7. **Choose a Path**  
     - **Rewrite Guideline**  
       - If divergence affects <10% of items and a clear tie-breaker exists.  
       - *Add:* A boundary rule (e.g., "Treat hypothetical cancellations as NON-escalations").  
     - **Stipulate a Tie-Breaker**  
       - If both readings are valid but arbitrary (e.g., "Always mark sarcasm as toxic").  
       - *Use:* When client prioritizes speed over philosophical purity.  
     - **Escalate to Client**  
       - If:  
         1. Divergence affects >10% of items, OR  
         2. Tie-breaker changes project scope/risk (e.g., PII legality), OR  
         3. Client’s spec is ambiguous *by design* (e.g., subjective toxicity).  
       - *Deliverable:* A 5-slide doc with:  
         - Examples of disagreed items.  
         - Rival rules (with consistency scores).  
         - Impact of each rule (e.g., "20% fewer escalations").  

  8. **Stopping Points**  
     - **Hand to Human:** When there’s no "correct" answer (e.g., subjective judgments). Labellers vote or lead annotator decides.  
     - **Hand to Client:** When the spec’s ambiguity creates legal/model risk.  

  #### **Phase 4: Validation**  
  - **After fix:** Re-run calibration with 5–10 edge cases. Cost: 1 day (labeller time).  
  - **Monitor:** Track disagreement rates on new edge cases for 3 batches.  

  ---

  ### **Flagged Judgment Calls**  
  1. **Edge case relevance** (Phase 1, Step 2): Requires guessing real-world likelihood.  
  2. **Evidence threshold** (Phase 2, Step 4): Why 5 items? Trade-off between speed/certainty.  
  3. **Tie-breaker vs. rewrite** (Phase 3, Step 7): Depends on project risk tolerance.  

  ---

  ### **Case Studies**  
  #### **A. Escalation Project**  
  - **Problem:** Labeller excludes hypothetical/denied cancellations.  
  - **Procedure Application:**  
    - Phase 1: Edge cases *should* have included: "I’d never cancel" (negative example), "If you X, I’ll cancel" (boundary).  
    - Phase 2: Systematic pattern found (all hypotheticals non-escalated). Rival rule ("Only escalate explicit cancellations") fits all calibration examples → **indeterminacy**.  
    - Phase 3: Client escalation (divergence affects escalation volume → business risk).  
  - **Outcome:** Client chooses rule → guideline updated.  

  #### **B. PII Project**  
  - **Problem:** Labeller flags first name + partial postcode in a small village.  
  - **Procedure Application:**  
    - Phase 1: Guideline lacked "identifiability" threshold (e.g., "Flag if data identifies ≤50 people").  
    - Phase 2: Labeller’s rule ("Flag if context permits identification") fits examples → **indeterminacy**.  
    - Phase 3: Escalate to client (legal risk: GDPR may require conservatism).  
  - **Outcome:** Client revises spec → re-labeling required. **Procedure flags guideline as broken.**  

  #### **C. Toxicity Project**  
  - **Problem:** Sarcasm/quoted slurs split labellers.  
  - **Procedure Application:**  
    - Phase 2: Both camps cite valid guideline sections → **indeterminacy**.  
    - Phase 3: No "correct" answer → **tie-breaker** (e.g., "Mark sarcasm as toxic; exclude quoted slurs").  
    - If client insists on subjectivity: **hand to human** (lead labeller casts tie-breaking vote).  
  - **Outcome:** Tie-breaker added; labellers notified.  

  ---

  ### **What This Procedure Cannot Do**  
  1. **Eliminate all ambiguity:** Language and context evolve. New edge cases *will* emerge.  
  2. **Replace client input:** When the spec is flawed, you *must* escalate. No procedure fixes a broken contract.  
  3. **Bypass iterative testing:** Complex guidelines need 2–3 calibration rounds (cost: 2–3 days).  
  4. **Solve low-quality specs:** Garbage in, garbage out. Push back on vague client requests early.  

  ### **When to Stop Pretending**  
  - **Stop chasing "perfect" guidelines:** Accept that 5–10% of cases need human arbitration.  
  - **Stop blaming labellers:** If divergence is systematic, the guideline is at fault.  
  - **Stop delaying escalation:** If a decision affects risk/scope, clients *must* own it.  

  ---

  **Final Advice:** Bake this into your workflow as "Guideline Stress Testing." Document every edge case and resolution to build an institutional memory. Over time, you’ll develop a library of counterexamples that preempt Kripkean divergence.
