  You’re right that grief over a destroyed manuscript *feels* similar to grief over humanity’s extinction. But that surface similarity hides a deeper structural difference. When your novel burns, your despair centers on the loss of a *specific outcome you valued*—its potential impact, recognition, or legacy. It’s a personal project shattered. The doomsday scenario isn’t just about *your* project failing; it collapses the entire scaffolding of value-creation.  

  Scheffler’s point isn’t that we’re upset things won’t persist—it’s that activities *lose their reason-giving force* when we learn no future people will exist. Writing a novel *presupposes* readers, critics, a culture to interpret it. If humanity ends 30 days post-you, the act isn’t just thwarted; it’s retroactively drained of its *point*. You might still write, but as a hollow ritual—like planting a tree knowing it’ll be incinerated in a month. The "selfishness" here isn’t about credit; it’s about dependence. Your creative impulse, your environmentalism, even your moral choices implicitly rely on a chain of human continuity you don’t control. The asteroid thought experiment exposes that vulnerability: we care about strangers not as individuals, but as the necessary condition for meaning itself.  

