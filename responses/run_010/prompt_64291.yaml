answer: |-
  To the Serene Council and Citizens of Veridion,

  It has become necessary, through a course of reflection grounded not in sentiment but in observable fact, for me to lay down the authority vested in my office. Let this be understood not as an abdication borne of weariness, nor a sudden moral revelation, but as the logical consequence of a prolonged examination into the true nature of sovereign power within our commonwealth. I speak plainly: the supreme right I was believed to wield, the absolute dominion over affairs, proves to be a chimera. The fundamental principle is unassailable: the limit of right is power. My power, the power of one man, is demonstrably inadequate to the burden of governing a multitude such as ours.

  Consider the edicts issued from this chamber. Observe closely: they were obeyed only where they encountered a populace already disposed to their substance. A decree commanding the repair of the seawalls found ready hands, for the people understood the necessity against the winter storms. Yet, the stern prohibition against certain opinions deemed seditious? Did it extinguish those thoughts? No. It merely drove them underground, fostering concealment and whispered dissent, a testament to the impotence of command against the fixed dispositions of minds I could never truly reach. The power to compel outward silence is not the power to command inward assent. Similarly, consider our regulations concerning public worship. The forms, the rituals, the designated days and places – these outward expressions were within my nominal purview to order. But the inward faith, the convictions held silently in the heart? That realm remained obstinately beyond any sovereign decree. I could arrange the stage, but I could not write the lines spoken within the soul.

  The structure I inhabited, which appeared as a perfect monarchy, functioned in practice as an aristocracy – not of birth, perhaps, but of counsel and delegated power. The generals managed the armies, interpreting orders through the lens of their own judgment and the temper of the troops. The counselors shaped policy, presenting options filtered by their own understanding and interests. And was it not evident, especially in these latter years, that one particular favorite, through access and influence over the flow of information and the disposition of my time, effectively steered the course of governance more than any formal decree? The more absolutely I was believed to hold authority, the more I became dependent upon this intricate machinery of advice and execution. This dependence breeds not strength, but a peculiar vulnerability; the sovereign, isolated by the very height of his supposed power, grows increasingly fearful of the citizens upon whose passive compliance, active cooperation, or merely restrained discontent, his fragile edifice entirely rests. To fear one’s own people is the inevitable pathology of concentrated power recognizing its own insufficiency.

  Therefore, I return this authority to its only legitimate source: the multitude itself. This is not a gift, nor a recognition of inherent rights or consent freely given as a moral contract. It is an acknowledgment of natural necessity. Each individual possesses a certain power, derived from their nature and circumstance. When these powers are united, the commonwealth gains its true strength. The most stable, the most *natural* arrangement, is that in which this collective power becomes the sovereign. Each person hands their power to the whole, of which they remain a living part, rather than vesting it entirely in a single figure whose inherent limitations doom the endeavour. The end of the state, rightly understood, is not the perpetuation of fear and obedience to a distant power, but the fostering of freedom – the freedom to live securely and develop one’s capacities according to reason, within the bounds of collective peace. A commonwealth grounded in the power of the multitude holds the greatest potential for achieving this end, for its laws and decrees are more likely to reflect the complex disposition of that multitude, minimizing the dangerous friction between command and capability.

  I step down without regret for the structure I leave behind, for its instability was inherent in its form. I depart without illusions about the structure you now inherit. Is a commonwealth whose sovereign is the multitude itself inherently more stable? It possesses a greater reservoir of natural power, certainly. It diminishes the perilous gap between ruler and ruled. But the multitude, too, is a complex force, driven by passions as well as reason, subject to internal currents and conflicting appetites. The challenge of harnessing this immense, shifting power towards the stability and freedom that is the state's true purpose remains. I have merely concluded, by the clearest light of reason applied to the evidence of my own experience, that vesting it all in one man is not only inadequate, but actively productive of fear and hidden governance. The experiment of concentrated sovereignty has run its course here. The experiment of collective sovereignty begins. May your power prove equal to its own demands.

  Farewell.

  Marcus Valerius Solus,  
  Once Doge of Veridion  
  XVII Kalendas Novembris, Anno MDCLXXII
