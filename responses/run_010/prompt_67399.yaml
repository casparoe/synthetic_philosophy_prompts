prompt: |-
  I serve on the Program Committee of a regional health foundation with an endowment of roughly $40 million. Our annual grantmaking is capped by the board at $2.2 million and is not growing, and two multi-year renewals coming before us at the end of this cycle account for most of the discretionary money we have.

  The first is a mobile clinic network that has operated for eleven years across a set of rural counties our evaluator scores 4 on the Access Deprivation Scale. It requests $900,000, and its outcomes are well documented: on the network's own measures, roughly 3,400 patients a year gain meaningful control of a chronic condition that would otherwise go untreated.

  The second is a small program serving a population scoring 5 on the same scale — the worst-off group we fund anywhere. It requests $380,000. Its intervention is promising, but the effect size is not yet established; a rigorous evaluation is eighteen months out, and by the program's own estimate it would reach fewer than 300 people, with a smaller per-person gain than the clinic network delivers.

  Two features of our governance make this harder than a cost-effectiveness comparison. First, the Scale is ordinal: the outside evaluator who built it has stated in writing that the numbers are rank labels, that a 5 is worse off than a 4, and that nothing follows about how much worse off. Yet the Committee's current rubric, adopted last spring, multiplies a program's measured benefit by a priority weight that doubles at each rank step — 1 at score 3, 2 at score 4, 4 at score 5 — which is precisely a claim about magnitude.

  Second, and more urgently, a trustee has introduced an amendment. Her argument is that if we cannot fund the worst-off population at the level it has requested, we ought not to fund the clinic network at so much higher a level of per-person benefit; she proposes capping the network's award so that the two programs stand in parity, with the freed funds transferred to the foundation's reserve. Our charter locks the reserve against program spending for ten years, and the trustee has confirmed she has no alternative use in mind for the money. On her amendment, the clinic network's patients lose services, the other population's position is unchanged, and the gap between them narrows.

  Please draft the written opinion I will circulate to the Committee before we meet in nine days; the full board ratifies three weeks after that, and the cycle closes at the end of the quarter. It should:

  1. Recommend a specific disposition of the amendment and of both grants — dollar figures, or conditions where conditions are the right answer — and say what should change if the pending evaluation of the second program confirms rather than undermines its effect size.
  2. State what principle of distribution a foundation in our position can actually apply given an ordinal metric, and whether the doubling rubric is coherent, repairable, or should be withdrawn.
  3. Take the trustee's parity intuition seriously: identify what is genuinely right about it and what we could do to honor that, rather than treating it as a mistake to be voted down.

  Argue from the substance of the case; there is no need to cite authorities or literature.
reasoning: |-
  Okay, the user is part of a Program Committee for a health foundation facing a tough decision between two grants. The mobile clinic has proven outcomes but serves a less deprived population, while the smaller program serves the most deprived but lacks evidence. There's also a trustee amendment proposing to cap the clinic's funding for parity, which doesn't help the smaller program but moves money to a locked reserve. 

  Hmm, the user needs a draft opinion for the Committee that addresses three specific points: recommendation on grants and amendment, principles for distribution with an ordinal scale, and engaging the trustee's parity idea constructively. 

  First, the recommendation. The clinic is clearly effective and serves a large group. Cutting its funding would harm real patients without helping anyone else. The small program isn't ready for full renewal—it needs evidence first. The amendment's parity idea is well-intentioned but counterproductive since it just locks funds away. Better to fund the clinic fully and give the small program a bridge grant with conditions. 

  On the distribution principle, the current doubling rubric is flawed. An ordinal scale can't support precise multipliers. The committee should replace it with tiered priority bands (e.g., "highest/high/moderate" need) and drop the math. Cost-effectiveness still matters within bands. 

  The trustee's parity point highlights a real tension: should we prioritize the absolute worst-off even with lower returns? But her solution doesn't work. Instead, the foundation could set a minimum allocation for the most deprived (score 5) populations to ensure they're never overlooked. That honors the spirit without harming effective programs. 

  The user seems stressed about the governance constraints—locked reserves, rigid rubrics, trustee dynamics. They need a solution that's both principled and practical, avoiding academic debates. The draft should feel decisive but collegial, acknowledging the trustee's concern while steering toward better options. 

  Also noting the tight timeline: Committee in 9 days, board soon after. The opinion must frame this as solvable without factionalizing. Emphasizing patient impact over process arguments will help.
answer: |-
  ## Draft Committee Opinion: Grant Recommendations & Rubric Review

  **To:** Program Committee Members  
  **From:** [Your Name], Program Committee Member  
  **Date:** [Current Date]  
  **Subject:** Recommendations for Cycle [Number] Grants, Trustee Amendment, and Rubric Review  

  **I. Recommendation on Grants and Amendment**

  1.  **Mobile Clinic Network ($900,000 Request):** **Recommend full funding ($900,000).** This program delivers proven, significant impact at scale (3,400 patients/year gaining control of chronic conditions) to a population demonstrably facing high access deprivation (Score 4). Reducing this award, as proposed by the amendment, would directly harm established patient outcomes without creating any countervailing benefit. The scale and documented effectiveness justify this investment within our constrained budget.

  2.  **Small Program ($380,000 Request):** **Recommend conditional renewal at a reduced level ($150,000) for 12-18 months.** This targets the highest deprivation population (Score 5), a clear priority. However, the lack of established effect size and small reach (under 300 people with uncertain per-person gain) make the full request premature and high-risk relative to impact. Funding should be:
      *   **Conditioned on:** Successful completion and submission of the rigorous 18-month evaluation.
      *   **Purpose:** Bridge funding to maintain core operations *only* until evidence is available. This minimizes disruption to a vulnerable population while demanding accountability.
      *   **If Evaluation Confirms Strong Effect Size:** If results demonstrate significant, cost-effective impact, we should prioritize this program for a substantial renewal (potentially near the original $380k or higher, depending on full evaluation and budget context) in the next cycle. Scale-up should be explored if feasible.
      *   **If Evaluation Undermines Effect Size:** Funding should not be renewed beyond the bridge period.

  3.  **Trustee Amendment (Cap Clinic, Move Funds to Reserve):** **Recommend rejection.** While the parity intuition is important (see Section III), the *mechanism* proposed is flawed:
      *   **Harms Patients:** It actively reduces services to 3,400 vulnerable patients without helping the Score 5 population.
      *   **Inefficient:** Moving funds to a 10-year locked reserve removes them from mission impact entirely. The trustee confirms no alternative use.
      *   **False Parity:** Achieving "parity" by harming one group to match the underfunding of another isn't equitable or effective. It narrows a gap by lowering the floor, not raising the ceiling.

  **II. Principles for Distribution with an Ordinal Metric & Fate of the Doubling Rubric**

  Our core challenge is balancing **need severity** (as indicated by the Access Deprivation Scale) with **demonstrated impact and cost-effectiveness**. The ordinal nature of the Scale makes this inherently complex:

  1.  **The Doubling Rubric is Incoherent and Should Be Withdrawn:** The outside evaluator explicitly stated the Scale numbers are rank labels (5 > 4 > 3), not interval or ratio measures. Assigning precise multiplicative weights (1x, 2x, 4x) claims mathematical precision about the *magnitude of difference* between ranks that the Scale fundamentally **cannot** support. Doubling the weight at each step is an arbitrary assumption, not a principle derived from the data. **This rubric should be withdrawn immediately.** It creates a false sense of objectivity and distorts decision-making with unsupported mathematical claims.

  2.  **Principles We *Can* Apply:**
      *   **Priority Tiers:** Acknowledge the Scale's ordinal nature by defining broad priority **tiers** (e.g., "Highest Priority: Score 5", "High Priority: Score 4", "Moderate Priority: Score 3"). Within these tiers, programs compete based on:
      *   **Demonstrated Effectiveness & Impact:** Strength and rigor of outcomes evidence.
      *   **Cost-Effectiveness & Reach:** Magnitude of impact per dollar and number served.
      *   **Strategic Alignment:** Fit with foundation goals beyond deprivation score.
      *   **Risk Assessment:** Especially for newer/unproven programs targeting high-priority tiers (like the Score 5 program).
      *   **Budget Constraints:** Explicitly recognizing that not all worthy programs in high tiers can be funded fully forces harder qualitative comparisons.
      *   **Minimum Threshold for High-Priority Tiers:** Establish a floor, ensuring *some* funding consistently flows to the highest deprivation tier (Score 5), even if individual programs require smaller, conditional grants initially.

  **III. Engaging the Trustee's Parity Intuition**

  The trustee's amendment, while operationally flawed, highlights a legitimate ethical concern we must address:

  *   **What's Right About It:** The intuition that the *most* deprived population (Score 5) deserves significant attention and investment, potentially even when the measurable per-dollar impact might appear lower than programs serving less deprived (but still needy) populations (Score 4). It reflects a principle of **prioritarianism** – giving absolute priority to the worst off. The concern is that our current process, even without the flawed rubric, might systematically underfund the hardest-to-serve populations precisely because achieving large-scale, cost-effective outcomes among them is inherently more difficult and expensive.

  *   **Honoring the Intuition Constructively:**
      1.  **Explicit Tiered Priority:** As recommended above, formally establishing Score 5 as the "Highest Priority" tier signals its unique importance.
      2.  **Active Scouting & Investment:** Dedicate Committee resources to proactively *find* and *develop* high-potential interventions for Score 5 populations. This might involve smaller seed grants, technical assistance, or actively soliciting proposals.
      3.  **Accept Higher Risk/Cost for Highest Tier:** Explicitly acknowledge in our funding principles that programs serving Score 5 populations *may* require higher investment per beneficiary or carry higher risk due to systemic barriers. We should be willing to fund promising but unproven interventions in this tier (as recommended conditionally for the small program) *because* of the severity of need, while demanding rigorous evaluation.
      4.  **Set a Funding Floor:** Commit that a defined minimum percentage (e.g., 15-25%) of the *discretionary* annual grant budget is allocated specifically to programs primarily serving Score 5 populations. This ensures consistent investment, forcing us to find viable ways to serve them, even if individual programs aren't yet as cost-effective as mature ones in lower tiers. This is the substantive response to the parity concern: ensuring the worst-off are never neglected, not by harming effective programs, but by guaranteeing their claim on our resources.

  **Conclusion**

  We face difficult trade-offs within a fixed budget. We must fund proven impact where it exists at scale (Mobile Clinic), responsibly support promising interventions for the very worst-off with conditions and lower initial investment (Small Program), and reject an amendment that harms patients without helping anyone. Crucially, we must abandon the unscientific doubling rubric and adopt a tiered priority system based on the Scale's ordinal reality, using impact, cost-effectiveness, and strategic alignment within tiers.

  Simultaneously, we must honor the valid concern underpinning the trustee's amendment: the imperative to serve the most deprived. We do this not by artificial parity harming existing success, but by formally prioritizing Score 5, accepting necessary risks and costs to serve them, scouting actively for solutions, and guaranteeing them a minimum share of our resources. I urge the Committee to support the recommended funding levels and conditions, reject the amendment, and commit to revising our prioritization framework immediately to incorporate tiered priorities and a Score 5 funding floor.
