prompt: |-
  I am a high school junior, and for three years I have competed in mock trial, which means I have had to learn the law of evidence with some care: relevance and prejudice, hearsay and its exceptions, lay versus expert opinion, authentication, impeachment by prior inconsistent statement, judicial notice, burden of production versus burden of persuasion. This year I have been reading, on my own, about the Nyāya school of classical Indian philosophy and its account of the pramāṇas — perception (pratyakṣa), inference (anumāna), comparison (upamāna), and verbal testimony (śabda) — and I keep involuntarily converting one framework into the other. I would like you to do that conversion properly, and then tell me where it breaks.

  First, the translation. Treat the four pramāṇas as four distinct rules about what may count as a legitimate source of a finding, and tell me what in evidence law corresponds to each: what is the hearsay analogue of śabda, and what makes it admissible for the Naiyāyika but not for me; what corresponds to the qualification of an expert witness; what corresponds to authentication; what corresponds to impeachment. Then take the five-step public form of a Nyāya inference — thesis, reason, illustrative example, application of that example to the case at hand, conclusion — and say which of my courtroom habits it genuinely matches and where the match is only superficial. Take up vyāpti, the invariable pervasion that must hold between the reason and what is inferred before the inference is legitimate, together with the way it is supposed to be secured by observing agreement and absence, and tell me whether anything in my framework plays that role, or whether my framework simply assumes it.

  Second, the residue report, which matters more to me. For each claim, say whether it translates cleanly, whether it translates only if I quietly change what it means, or whether it has no expression at all in a system whose purpose is to settle a dispute between two adverse parties in front of a trier of fact under time pressure. Where something fails to translate, I want your judgment about which side is at fault: is evidence law missing a category, or is the Nyāya claim doing more work than it appears to, or perhaps less?

  Be especially candid about two cases. Upamāna seems to me to have no evidentiary counterpart whatsoever, and I want to know whether that is a gap in my framework or a sign that comparison was never an independent source to begin with. And the requirement that testimony come from an āpta: in my framework the trustworthiness of a witness is something you test procedurally, through cross-examination and exclusionary rules, whereas in theirs it looks like a standing fact about the speaker's knowledge and honesty. Tell me whether that difference is substantive or merely procedural.

  Two constraints. Please do not give me a reading list, a bibliography, or citations — I want the argument itself. And if some part of my translation instinct is actively misleading me, say so plainly rather than smoothing it over to be encouraging.
reasoning: |-
  Okay, the user is a high school junior deeply engaged in both mock trial and Nyāya philosophy. They've spent three years mastering evidence law and are now independently exploring classical Indian epistemology. Their core request is a rigorous translation between the two systems, followed by an analysis of where the mapping fails. 

  First, I need to acknowledge the sophistication here. This isn't a surface-level curiosity; they're noticing involuntary cognitive cross-wiring between frameworks, which suggests genuine intellectual synthesis at work. Their demand for candor about mismatches ("where it breaks") and refusal of bibliographic handholding signals they want conceptual meat, not academic niceties.

  Breaking down the task: The translation phase requires precise 1:1 mappings. Śabda to hearsay exceptions? That's the obvious starting point since both deal with verbal reports. But the āpta requirement complicates it—Nyāya treats speaker reliability as intrinsic, while evidence law makes it extrinsic through cross-examination. That's not just procedural difference; it's ontological. 

  Expert testimony mapping to upamāna feels forced. Upamāna's reliance on analogy ("cow-like" identification) has no clean courtroom counterpart. The closest might be lay witness identification? But even that requires foundation and lacks upamāna's epistemological weight. This smells like a genuine gap.

  The five-step inference structure is tantalizing. Thesis as claim, reason as evidence—that's smooth. But the illustrative example step? That's where mock trial objections would fly ("assumes facts not in evidence!"). Nyāya's vyāpti (universal pervasion) has no equivalent; courts accept probabilistic correlations while Nyāya demands necessity. That's a fracture point.

  Residue analysis is where it gets juicy. Upamāna's absence in evidence law isn't a flaw; it's a feature. Courts distrust analogical leaps without empirical testing. As for āpta vs. cross-examination: the difference is fundamental. Nyāya assumes truth-telling is knowable a priori; evidence law assumes it's contingent and fallible. One isn't better—they serve different purposes. 

  Biggest insight: Nyāya seeks certainty through logical necessity; evidence law settles disputes through adversarial testing. When the user says their framework "assumes" vyāpti, they're spot on—courts don't care about universal truths, just persuasiveness under constraints. 

  Should warn them: Their instinct to map impeachment to Nyāya's "tarka" (counterfactual reasoning) is misleading. Tarka isn't about credibility attacks; it's about uncovering hidden contradictions. That parallel needs severing.

  Final note: Their frustration with upamāna is valid. Even Indian logicians debated its independence. I'll validate that suspicion—it's the weakest pramāṇa here.
answer: |-
  ### Part 1: Translation  
  **A. Pramāṇas → Evidence Law**  
  1. **Pratyakṣa (Perception)** ↔ **Direct Evidence**  
     - *Match*: Eyewitness testimony, tangible exhibits. Both require firsthand sensory access.  
     - *Break*: Nyāya accepts yogic perception (extraordinary senses); evidence law rejects it as unreliable.  

  2. **Anumāna (Inference)** ↔ **Circumstantial Evidence**  
     - *Match*: Inferring a defendant’s intent from actions (e.g., buying tools before arson).  
     - *Break*: Nyāya’s *vyāpti* (invariable pervasion, e.g., "smoke *always* implies fire") requires universal certainty. Evidence law accepts probabilistic inferences (e.g., "motive suggests guilt, but exceptions exist").  

  3. **Upamāna (Comparison/Analogy)** ↔ **No Direct Equivalent**  
     - *Analogy*: "A gavaya (wild ox) is like a cow."  
     - *Courtroom Gap*: No standalone "analogy" evidence. Closest is **lay witness identification** ("the suspect’s tattoo matches the one I saw") or **demonstrative evidence** (a model jury compares to the crime scene). But these rely on *perception*, not analogy as an independent source.  

  4. **Śabda (Verbal Testimony)** ↔ **Hearsay with Exceptions**  
     - *Match*: Śabda from an *āpta* (reliable knower) ≈ **hearsay exceptions** (e.g., excited utterance, business records).  
     - *Key Break*:  
       - Nyāya: Trustworthiness is intrinsic (*āpta* = knowledgeable + truthful).  
       - Evidence Law: Trustworthiness is *extrinsic* (tested via **cross-examination**, **impeachment**, rules against bias).  
       - Example: An absent expert’s report (śabda) is inadmissible hearsay unless the declarant is cross-examined.  

  **B. Nyāya Inference Structure → Courtroom Habits**  
  *(Thesis: "There’s fire on the hill." Reason: "Because there’s smoke." Example: "Like in a kitchen." Application: "The hill is smoky like the kitchen." Conclusion: "Therefore, fire.")*  

  - **Thesis** ↔ **Opening Statement/Claim**: Superficially similar.  
  - **Reason** ↔ **Evidence Presentation**: Genuine match (e.g., introducing motive).  
  - **Illustrative Example** ↔ **Jury Analogy/Closing Argument**:  
    - *Superficial*: Nyāya’s example *proves* the universal rule (*vyāpti*). In court, analogies are rhetorical (e.g., "this case is like *X*"), not proof of a universal truth.  
  - **Application** ↔ **Attorney Argument**: Superficial. Lawyers apply facts to law, but Nyāya applies to a *logical universal*, not case-specific law.  
  - **Conclusion** ↔ **Verdict**: Superficial. Verdicts decide disputes; Nyāya conclusions affirm knowledge.  

  **C. Vyāpti (Pervasion) → Evidence Law’s Missing Link**  
  - **Vyāpti**: The invariable connection ("smoke *always* implies fire") secured by observing agreement (smoke + fire) and absence (no fire → no smoke).  
  - **Evidence Law**: **No equivalent**. Courts:  
    - Accept statistical correlations (e.g., DNA match probability).  
    - Use **judicial notice** for "indisputable" facts (e.g., "water boils at 100°C"), but these are pragmatic, not logically necessary.  
  - *Break*: Vyāpti demands certainty; evidence law settles for "preponderance" or "beyond reasonable doubt."  

  ---  
  ### Part 2: Residue Report  
  **A. Upamāna (Comparison)**  
  - **Translation**: Fails.  
  - **Why?**  
    - *Nyāya’s Work*: Upamāna is an independent source for *learning new concepts* (e.g., understanding "gavaya" via cow analogy).  
    - *Evidence Law’s Gap*: Courts distrust analogies as proof. Comparison is rolled into **perception** (identifying objects) or **expert testimony** (explaining similarities).  
  - **Verdict**: Nyāya overstates upamāna’s uniqueness. It’s reducible to perception + testimony (e.g., a guide says "gavaya looks like a cow"). Evidence law correctly sidelines it.  

  **B. Āpta (Reliable Testifier)**  
  - **Translation**: Partial (fits some hearsay exceptions).  
  - **Break**:  
    - *Nyāya*: Āpta status is inherent (person-based).  
    - *Evidence Law*: Reliability is *situational* (e.g., a liar’s dying declaration may be admitted).  
  - **Fault**: Substantive difference. Nyāya assumes ideal knowers; evidence law assumes human fallibility. Cross-examination *tests* trustworthiness; Nyāya *presumes* it.  

  **C. Vyāpti (Universal Pervasion)**  
  - **Translation**: No equivalent.  
  - **Why?** Evidence law’s purpose is practical dispute resolution, not epistemic certainty. Burden-shifting (e.g., *res ipsa loquitur*) approximates inference but rejects necessity.  
  - **Fault**: Evidence law’s constraints (time, adversarial process) preclude Nyāya’s rigorous universals.  

  **D. Impeachment vs. Tarka (Counterfactual Reasoning)**  
  - **Nyāya’s Tarka**: Hypotheticals to refute arguments (e.g., "if no fire, why smoke?").  
  - **Evidence Law**: **Impeachment** attacks witness credibility (e.g., prior lies).  
  - **Break**: Tarka is logical; impeachment is psychological. No clean translation.  

  ---  
  ### Hard Truths About Your Instincts  
  1. **You’re Over-Mapping Anumāna**: Not all circumstantial evidence is "inference" in Nyāya’s sense. Legal inferences are probabilistic; Nyāya’s demand *vyāpti* is absent.  
  2. **Śabda ≠ Hearsay**: Śabda includes authoritative texts (e.g., Vedas), which have no courtroom parallel. Hearsay is narrower.  
  3. **Upamāna Isn’t "Lay Opinion"**: Lay witnesses describe perceptions ("it looked like..."); they don’t generate knowledge via analogy.  
  4. **Nyāya’s Formalism Clashes with Adversarialism**: The five-step inference presumes cooperative truth-seeking. Courts thrive on procedural combat.  

  ### Final Judgment  
  - **Where Nyāya Overreaches**: Upamāna isn’t independent; āpta is idealized.  
  - **Where Evidence Law is Deficient**: No framework for *necessary* inferences (vyāpti), leaving gaps in proof rigor.  
  - **Core Divergence**: Nyāya seeks *knowledge*; evidence law seeks *adjudication*. One is epistemology, the other is applied sociology. Neither is "wrong"—but their jobs differ. 

  If you dissect a trial with Nyāya lenses, you’ll see courts *assume* vyāpti-like connections (e.g., "motive implies intent") but never prove them. That’s the cost of justice under time. Yet your instinct to bridge these isn’t misguided—it reveals law’s unspoken debt to logic.
