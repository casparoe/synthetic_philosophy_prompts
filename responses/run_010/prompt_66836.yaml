  You're a philosopher who works on modal logic and philosophy of religion and who has set and marked a lot of graduate exams, so please think carefully and be precise about the formal details — no hand-waving, and if a step needs a lemma, say what the lemma is.

  Context: I'm teaching a graduate seminar on modal metaphysics and I need one question for the take-home final on Gödel's modal ontological argument. The trouble is that everyone has stared at the same online reconstruction a hundred times, so if I ask "present the argument and discuss the objections" I'll get twenty interchangeable essays back and learn nothing about who actually understands it. I want a question they can't answer by reciting the argument or by name-checking objections.

  Here's the axiomatisation I intend to print at the top of the question, so the item is self-contained and noone has to remember anything (my own numbering, don't worry about matching anyone else's):

  - P1: if φ is positive, and it is necessary that whatever has φ has ψ, then ψ is positive.
  - P2: for every property φ, either φ is positive or its negation is positive, but not both.
  - P3: being Godlike is positive.
  - P4: if φ is positive, then necessarily φ is positive.
  - P5: necessary existence is positive.
  - D1: x is Godlike, G(x), iff x has every positive property.
  - D2: φ is an essence of x iff φ(x), and for every property ψ: if ψ(x) then necessarily whatever has φ has ψ.
  - D3: x exists necessarily, NE(x), iff for every essence φ of x, necessarily something has φ.
  - Background: S5 plus classical higher-order logic with unrestricted property abstraction (any open formula picks out a property). Target: □∃x G(x).

  And here's the part I made up, which is where I want the difficulty to live. Two student-proposed repairs of the modal collapse problem:

  - Repair A, the no-hybrids clause: leave everything alone, but restrict the quantifier over ψ in D2 to non-hybrid properties, where a hybrid is one of the form "has θ and is also such that p", θ a property and p a closed sentence true at some worlds and false at others.
  - Repair B, the one-way clause: leave everything alone, but replace P2 with the weaker "if φ is positive then its negation is not positive", dropping the guarantee that one of φ/¬φ always is positive.

  The question I want you to write should ask candidates to (i) reconstruct the derivation of the target, marking exactly where each axiom and definition is used and where S5 rather than something weaker is load-bearing; (ii) derive the collapse — that every truth is necessary — and pin down which assumption does the damage; (iii) decide separately for Repair A and Repair B whether the target still follows and whether the collapse is blocked, proving it or explaining precisely which lemma fails and what a countermodel would have to look like; and (iv) say which repair a defender should actually prefer and what it costs them.

  Deliverables: the finished question exactly as it would appear on the paper (you may tidy my wording, but don't change the formal system), a model answer of roughly 1000–1200 words that does the derivations rather than gesturing at them, and a marking scheme out of 25 broken down part by part. The scheme should say what an A-range answer contains that a solid B-range answer will miss, and list the specific mistakes that should cost marks — I'm expecting things like treating the collapse as showing invalidity rather than a bad consequence, thinking P2 is decorative, or blaming P4 alone without noticing what D2's comprehension is doing. Assume candidates know S5 and have had one lecture on second-order modal logic, nothing fancier, and give them about three hours. No bibliography, no reading list, no citations — I don't want them chasing references and I don't want you guessing at them either.

  Before you write any of it, brainstorm out loud: sketch two or three candidate cruxes for where the real discrimination in this question could sit, then commit to one and tell me in a sentence why its the best separator. Also — if you think Repair A or Repair B is underdefined or ambiguous as I've stated it, say so and say how you'd tighten it, and write the question using your tightened version.
