prompt: |-
  I have no academic training in history or in psychology — I left school at seventeen and spent thirty-one years as a newspaper copy editor — but for roughly the past six years I have read on my own about how people explain events after the fact, and in particular about hindsight bias and what is now usually called the narrative fallacy. I am writing to you because I have recently been given a job that puts those ideas under real pressure, and I have a limited amount of attention to spend.

  In January I was appointed chair of a volunteer project at the historical society in my town. We are building a permanent exhibit about the 1998 flood, which killed eleven people and destroyed most of the buildings along River Street. It opens in eighteen months. There are four of us, we can manage perhaps ten hours a week between us once we set aside insurance, panel fabrication, and donor correspondence, and there is no money for consultants or for hired researchers. That works out to something like a thousand hours of usable attention, and nearly all of it will go to three things: interviewing survivors and former town officials, working through the newspaper morgue from 1994 to 2001, and writing the text that ends up on the walls.

  My difficulty is this. Almost everyone we interview tells us the flood was obviously coming: that the levee was known to be inadequate, that the warnings after 1993 should have settled the question, that the council's decision to keep permitting construction on the low ground was reckless. Some of the same people said nearly the opposite at the time, and I have the clippings that show it. At the same time, I feel the pull — as a former editor, more strongly than most — to give the exhibit a clean shape: rising danger, warning ignored, catastrophe, reckoning. That is what makes a visitor stop and read. My fear is that a well-built narrative exhibit is a device for manufacturing hindsight bias in the people who walk through it, and that we would be operating the device while congratulating ourselves on our candor.

  I can list a good many distinct problems in this territory, and I suspect I cannot afford more than two or three of them. They include: the way a known outcome makes the past feel more determined than it was; the reconstruction of memory in light of how things turned out, which affects our interviews more than anything else we do; the fact that the people who agree to be interviewed are not a sample of the people who were there; the difference between what was foreseeable in 1997 and what was actually foreseen, and our inability to recover the second from the first; the temptation to treat a coherent causal story as stronger evidence than it is; the possibility that a warning-ignored framing quietly assumes the warning was actionable by people who had no money and no authority; the risk of reading our own documents retrospectively, knowing how they end; and, deepest of all, the question whether an exhibit with a beginning, a middle, and an end can avoid the narrative fallacy at all, or can only choose which distortions to accept.

  Given a thousand hours, four volunteers with no technical training, and one room, which two or three of these deserve the bulk of our effort, and which should I deliberately set aside — either because they are unfixable at our scale, or because they are serious problems for professional historians writing monographs but not for a town exhibit that a visitor spends twenty-five minutes in? Please defend an ordering rather than walk me through the field. I want to know what you are ranking by: how much each problem would actually change what a visitor takes home, how tractable it is with the tools we have (interviews, clippings, wall text, photographs, and the physical sequence of a room), and whether fixing it costs us the human interest that brings people through the door in the first place. Where those considerations point in different directions, tell me which one you would sacrifice and why. Finally, tell me what would move items up or down your list: what further facts about our situation, if I supplied them, would turn one of the problems I should set aside into the one that matters most?

  I am not asking for suggested readings, references, or a bibliography; I can find my way to those myself, and I would rather have your judgment about where the effort belongs. Please write your answer in American English.
reasoning: |-
  Okay, let me unpack this. The user is a former newspaper editor leading a small historical exhibit about a deadly flood. They've identified how hindsight bias warps survivor accounts and fears their exhibit might become a "hindsight machine." With only 1,000 volunteer hours, they need to prioritize which biases to tackle.

  Hmm... their core tension is visceral: they know clean narratives engage visitors but distort history. The clipping/survivor contradiction they mention is key - it's proof of memory reconstruction happening right in their research. That feels like Priority #1 because it directly poisons their primary source (interviews). 

  The warning-ignored framing jumps out too. As an ex-editor, they'll instinctively want that arc, but their own notes show it's simplistic. Fixing this doesn't ruin human interest - reframing warnings as "unactionable without resources" adds tension. Priority #2.

  The third spot's trickier. Document bias is real, but their newspaper background gives tools to mitigate it (date-stamped clippings!). Meanwhile, survivor self-selection bias is unfixable - they can't force interviews. So Priority #3 goes to outcome-driven document reading, since they can train the team to read clippings in chronological order.

  What would change my ranking? If donor pressure demanded a "reckless officials" angle, the warning-ignored problem shoots to #1. Or if most survivors refused interviews, survivor bias might need addressing despite being unfixable.

  The user's self-awareness impresses me. They're not asking for theory - they want actionable triage. My reply should mirror that: blunt, no jargon, with "why" behind each ranking.
answer: |-
  Your constraints are stark and your self-awareness formidable. Given your resources and goals, here’s the ruthless prioritization you asked for, ranked by impact on visitor understanding versus effort required:

  ### **Top Priority: Focus Here (80% of Effort)**
  1. **The reconstruction of memory in light of the outcome**  
     **Why it matters most:** This directly corrupts your core source material (interviews). Survivors *now* calling the flood "obvious" when clippings show they didn’t then is the beating heart of hindsight bias. If unaddressed, your exhibit becomes a vehicle for distorted testimony.  
     **How to tackle it:**  
     - **Weave clippings into interviews:** Place dated newspaper quotes (e.g., "Local Merchant: ‘Levee Upgrades Unnecessary,’ 1996") alongside audio/video clips of that *same person* today claiming "we all knew." The friction creates critical thinking.  
     - **Wall text as referee:** Explicitly state: "Memories evolve. Contrast what was said then with what we recall now." Use photos of interviewees from 1998 next to current shots.  
     **Cost/Benefit:** Forces visitors to confront bias without losing human drama. Effort: Moderate (curating matched pairs of quotes).  

  2. **The "warning-ignored" framing vs. actionable reality**  
     **Why it matters:** Your "clean narrative" temptation risks misrepresenting why warnings weren’t acted on. Was it recklessness? Or (as you hint) no money/no authority? Getting this wrong distorts history and alienates locals who remember the constraints.  
     **How to tackle it:**  
     - **Show the counterfactuals:** Display the 1995 town budget highlighting levee funding cuts alongside council meeting minutes showing desperate debates over "unfunded mandates."  
     - **Reframe the narrative:** Shift from "They ignored warnings" to "Warnings met impossible choices." Label a section: "Could It Have Been Stopped? The Barriers Beyond Awareness."  
     **Cost/Benefit:** Preserves tension while adding depth. Effort: High (digging into meeting archives/budgets), but essential for credibility.  

  ---

  ### **Secondary: Address Tactically (15% of Effort)**  
  3. **Outcome-determinism in documents** (Reading past records knowing the end)  
     **Why it’s here:** Your team will subconsciously cherry-pick clippings that "foreshadow" the flood. But this is fixable with discipline.  
     **How to tackle it:**  
     - **Blind chronology:** Have one volunteer compile a timeline of articles *without* flood mentions (1994–1997). Only *then* overlay 1998 events. What truly foreshadowed vs. what was noise?  
     - **Display the "missed signals":** Include a panel of *wrong* predictions: "Meteorologist Predicts Mild Spring, March 1998."  
     **Cost/Benefit:** Low effort (requires procedural rigor, not new research), high payoff in humility.  

  ---

  ### **Consciously Set Aside (5% or Less)**  
  - **Survivor self-selection bias:** Unfixable. Those who volunteer to retell trauma aren’t representative. Mitigate by including *written* accounts from emergency logs, diaries.  
  - **Coherent story as false evidence:** Acceptable. Your exhibit *needs* cohesion. Just signal uncertainty: "Many factors interacted—this is one interpretation."  
  - **Foreseeable vs. foreseen:** A professional historian’s puzzle. Use broad strokes: "Engineers knew levees *could* fail; few imagined *this* failure."  
  - **Narrative fallacy inherent in structure:** Unavoidable. Use design to hint at chaos: jagged panel angles, a "fragments" corner with unresolved stories.  

  ---

  ### **What Would Change This Ranking?**
  - **If survivor testimony dominates the exhibit,** memory reconstruction becomes **#1 by far**. Your clippings are the antidote—flood the walls with them.  
  - **If pre-flood council records are lost,** the "actionable reality" problem drops. Focus then shifts to **document bias** (#3), using newspapers as the sole institutional record.  
  - **If visitors are mostly survivors/families,** **self-selection bias** jumps to #2. Their raw memories *are* the story; curate with respect but add context: "For others, the past feels different now."  

  ---

  ### **Your North Star: "Show the Struggle, Not the Inevitability"**  
  Your exhibit’s power lies in honoring the chaos of the past. A visitor should leave thinking: "This wasn’t a fable about fools—it was a tragedy of constrained choices and bad luck." That takes more work than a morality tale, but with your editorial eye, it’s within reach. Spend your hours on memory contradictions and actionability; accept the rest as the cost of doing history humanely.
