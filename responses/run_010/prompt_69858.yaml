  Hmm, the user is deeply involved in quantum foundations and is frustrated by the ambiguity surrounding "locality" in Bell's theorem discussions. They want a rigorous specification of what a locality principle must do to be useful in proving no-go theorems, without favoring any interpretation. This is a meta-question about the criteria themselves, not about interpreting QM.

  I need to extract clear desiderata from their raw list while adding missing pieces. The user's pain point is that different camps mean different things by "locality," making debates unproductive. Their list has nine items, but some conflate distinct ideas - like (iii) combining setting-independence and outcome-independence. I should split these. Also, their list misses key aspects like requiring the principle to apply to *deterministic* theories (since Bell inequalities hold even for deterministic local models).

  For the "bottom line," I'll emphasize that factorization of probabilities given the local past (λ) is the core non-negotiable requirement. But I'll note tension with Lorentz invariance - you can't have both in a satisfying way. This addresses their suspicion that conflicts between locality concepts are the real issue.

  In the requirements section, I'll define six conditions. The first two are non-negotiable for Bell's argument: 
  1. Beable-based specification (using physical elements in spacetime regions) 
  2. Factorization (P(A,B|a,b,λ) = P(A|a,λ)P(B|b,λ)) 
  Others will be negotiable, like Lorentz invariance or no conspiracy. For each, I'll explain why it's included and give examples - like how outcome-independence alone allows PR-boxes.

  The collisions section will highlight that demanding both Lorentz invariance and beable-based factorization is impossible without preferred foliation. Bohmian mechanics illustrates this by choosing the former and sacrificing the latter. This shows why quantum theories struggle to satisfy all intuitive locality notions.

  For the table, I'll analyze six interpretations against the requirements. Crucially, all violate factorization except superdeterminism (which violates "no conspiracy") and instrumentalism (which avoids beables altogether). This confirms the requirements discriminate meaningfully.

  On Everett: I'll argue that denying definite outcomes doesn't evade Bell - without factorization, their global state still violates locality as defined. The user's colleague misses that Bell's argument doesn't require pre-existing outcomes.

  Finally, I'll drop three items from their list: 
  - (v) about superluminal signalling (Bell's theorem is stronger) 
  - (viii) about common-cause explanations (too vague) 
  - (ix) about formalism-smuggling (irrelevant if we use beables) 
  These often reflect desires for "reasonable" theories rather than logical necessities.
answer: |-
  ### **Bottom line**
  The core non-negotiable requirement is **factorization of joint probabilities given the complete physical state of the past light cone (λ)**. This condition alone suffices to derive Bell inequalities and is violated by quantum correlations. However, no theory satisfies all desiderata simultaneously: demanding both **Lorentz invariance** and **beable-based factorization** forces a conflict with quantum predictions or requires a preferred foliation. Superdeterminism evades factorization but violates "no conspiracy," illustrating a trade-off.

  ---

  ### **The job of the principle**
  A locality principle must isolate what makes a theory *local* in a way that permits a no-go theorem: it must forbid spacelike-separated events from influencing each other *without* appealing to quantum formalism or measurements. Standard formulations fail by conflating operational constraints (e.g., no signalling) with ontic constraints (e.g., causal independence). The principle’s job is to specify how physical states in spacetime regions screen off correlations, grounding Bell’s theorem in spacetime causality rather than quantum rhetoric. Without this, "locality" becomes a moving target, and the theorem’s force evaporates.

  ---

  ### **The requirements**
  1. **Beable-based specification (non-negotiable)**  
     *Condition*: The principle must be stated solely in terms of "local beables" (physical elements in bounded spacetime regions), excluding "observables," "measurements," or agents.  
     *Case*: Bell emphasized that quantum formalism obscures locality by defining everything via measurement outcomes. Using beables (e.g., particle positions, field configurations) forces theories to commit to a spacetime ontology. Without this, a theory can hide nonlocality in the measurement process (e.g., Copenhagen).  
     *Violation example*: Instrumentalism treats the quantum state as a tool for predictions, lacking beables. It evades Bell by denying a physical description.

  2. **Factorization (non-negotiable)**  
     *Condition*: For spacelike-separated regions A and B, with settings *a*, *b*, and λ a complete specification of the past light cone, the joint probability factorizes: *P*(A,B|*a*,*b*,λ) = *P*(A|*a*,λ) · *P*(B|*b*,λ).  
     *Case*: This captures "no direct influence": λ screens off A and B. Bell’s theorem requires this to derive inequalities. If dropped, superluminal signalling might be blocked (e.g., quantum mechanics respects no-signalling), but *correlations* could still be inexplicable without fine-tuning.  
     *Violation example*: Quantum mechanics violates this (e.g., CHSH inequality), while local hidden variables satisfy it.

  3. **Setting-outcome independence (negotiable)**  
     *Condition*: *P*(A|*a*,*b*,λ) = *P*(A|*a*,λ) (outcome A independent of distant setting *b*), and *P*(B|*a*,*b*,λ) = *P*(B|*b*,λ).  
     *Case*: Often conflated with factorization but weaker alone. It forbids settings *directly* influencing distant outcomes. Motivation: settings are chosen freely, so dependence implies causal loops or fine-tuning.  
     *Satisfaction without factorization*: PR-boxes satisfy setting-outcome independence but violate factorization, allowing stronger-than-quantum correlations. Bell’s theorem doesn’t require this; it’s a plausible add-on.

  4. **No conspiracy (negotiable)**  
     *Condition*: λ is statistically independent of future settings: *P*(λ|*a*,*b*) = *P*(λ).  
     *Case*: Prevents λ from "conspiring" with future choices to fake locality. If dropped, superdeterminism evades Bell by correlating λ with (*a*,*b*). Motivation: Without this, *all* correlations can be "explained" by λ, but at the cost of denying free will or experimental controllability.  
     *Violation example*: Superdeterministic models violate this to recover factorization.

  5. **Lorentz invariance (negotiable)**  
     *Condition*: The theory’s dynamical laws and beables are invariant under Lorentz transformations.  
     *Case*: Protects relativistic causality. If violated (e.g., a preferred foliation exists), signalling might still be blocked, but spacetime symmetry is broken. Bell’s theorem doesn’t require this, but it’s often desired for compatibility with relativity.  
     *Satisfaction without factorization*: Bohmian mechanics violates Lorentz invariance in its dynamics to maintain beables.

  6. **Non-vacuity (non-negotiable)**  
     *Condition*: The principle must exclude some theories (e.g., quantum mechanics) and permit others (e.g., local hidden variables).  
     *Case*: Prevents triviality (e.g., a principle so weak everything satisfies it, or so strong nothing does). Bell’s theorem collapses without this.  
     *Failure example*: Demanding "no signalling" alone is too weak—quantum mechanics satisfies it but violates Bell inequalities.

  ---

  ### **Collisions**
  **Lorentz invariance** and **beable-based factorization** conflict when applied jointly. To satisfy both, a theory needs a Lorentz-invariant λ, but relativistic quantum field theories (QFTs) lack such a λ without hidden variables. Bohmian mechanics chooses factorization via particle trajectories but requires a preferred frame (violating Lorentz invariance). GRW collapse models add stochastic collapses that break Lorentz invariance. Conversely, Everett and retrocausal models embrace Lorentz invariance but reject factorization or beables. This reveals a core tension: **Bell’s theorem forces a choice between manifest Lorentz invariance and local causality in beables**. Quantum mechanics’ success then implies no theory can satisfy all intuitive locality demands without sacrificing relativistic elegance or ontological clarity. Superdeterminism avoids this by violating **no conspiracy**, but at the cost of rendering settings non-free—another trade-off. Thus, "locality" fragments into incompatible ideals.

  ---

  ### **Do the requirements bite?**
  | Requirement          | Bohmian | GRW    | Everett | Retrocausal | Superdeterminism | Instrumentalism |
  |----------------------|---------|--------|---------|-------------|------------------|-----------------|
  | Beable-based         | ✓       | ✓      | ✗       | △ (varies)  | ✓                | ✗               |
  | Factorization        | ✗¹      | ✗      | ✗       | ✗           | ✓²               | N/A             |
  | Setting-outcome ind. | ✓       | ✓      | ✓       | ✓           | ✓                | ✓               |
  | No conspiracy        | ✓       | ✓      | ✓       | ✓           | ✗                | ✓               |
  | Lorentz invariance   | ✗       | ✗      | ✓       | ✓           | ✓                | ✓               |
  | Non-vacuity          | ✓       | ✓      | ✓       | ✓           | ✓                | ✓               |

  ¹ Bohmian mechanics violates factorization for spacelike measurements due to nonlocal guidance.  
  ² Superdeterminism satisfies factorization by violating statistical independence of λ and settings.  
  △ Retrocausal models may use beables but dynamically violate screening-off.  

  **Moral**: The table confirms discrimination: all interpretations violate at least one non-negotiable requirement (**factorization** or **beable-based specification**). Superdeterminism "succeeds" only by denying **no conspiracy**, instrumentalism avoids beables, and others sacrifice Lorentz invariance or factorization. Crucially, no view satisfies all conditions, exposing irreducible tensions. Bell’s theorem holds because **factorization** is violated everywhere except superdeterminism (which fails **no conspiracy**), proving the conditions isolate genuine trade-offs.

  ---

  ### **The Everettian objection**
  Your colleague’s claim—that Everett escapes Bell by denying single outcomes—fails the **beable-based specification** and **factorization** requirements. Everett lacks local beables: the universal wavefunction describes a global state, so spacelike-separated "outcomes" are not screened off by λ (the past light cone). While it satisfies Lorentz invariance and no signalling, the *correlations* between decohered branches still violate **factorization** for any local λ. Bell’s theorem doesn’t require "outcomes fixed in advance"; it requires that *if* a theory assigns probabilities to localized events (e.g., via decohered records), those probabilities must factor given λ. Everett violates this, so it doesn’t evade the theorem—it rejects its premises by denying local definiteness.

  ---

  ### **What I would drop**
  From your list, drop **(v)** and **(viii)**, as they are redundant or misleading. **(v)** (violating locality ≠ signalling) is subsumed under **non-vacuity** and **factorization**: Bell shows quantum mechanics violates locality *without* signalling, but this doesn’t strengthen the principle. **(viii)** (common-cause explanations) is vague; **factorization** already implies local causality. **(ix)** (formalism-smuggling) is irrelevant if **beable-based specification** is enforced. These often arise from conflating locality with "classicality" or "explainability." When people insist on them, they seek to exclude theories where nonlocal influences are "benign" (e.g., no signalling) or where causation is global—but the core issue is whether λ screens off correlations, not metaphysics.
