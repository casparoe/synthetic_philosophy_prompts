answer: |-
  ### Bottom Line  
  The house analogy smuggles in foundationalist *support* and misconstrues hinges as *beliefs*. Hinges are enabling **rules**, not structural "beliefs." Wittgenstein rejects foundationalism, and hinges are not doxastic states. The riverbed analogy (§96-99) fits better.  

  ### Correspondence & Disanalogies Table  
  | **House Element** | **Alleged Wittgensteinian Equivalent** | **Actual Disanalogy (Load-Bearing)** | **Decorative Disanalogy** |  
  |-------------------|----------------------------------------|--------------------------------------|----------------------------|  
  | Foundation        | Hinge propositions (e.g., "The Earth exists") | Foundations *support* weight; hinges *enable* inquiry without bearing epistemic "load." | Foundations are permanent; hinges evolve historically (§§65, 97). |  
  | Superstructure    | Ordinary empirical claims              | Walls depend on foundations; empirical claims *presuppose* but don’t rely on hinges for justification (§§140-142). | Superstructure is optional; empirical inquiry requires hinges. |  
  | Inspector         | Skeptic demanding justification        | Inspectors *could* check foundations with tools; skepticism about hinges is nonsensical, not impractical (§§121, 337). | Inspectors are external; skepticism arises internally. |  
  | Ground            | ? (Unaddressed)                        | Foundations need stable ground; hinges require no "deeper" ground—they halt regress *grammatically* (§§164, 204). | Ground is physical; hinges are logical. |  

  ### Key Issues  
  - **"Support" vs. Enabling**: Foundations physically hold up the house, suggesting hinges *justify* beliefs. But hinges are **rules of grammar** (§95, §401) that make empirical inquiry *possible*, like axle hinges enabling a door to move. They aren't "basic beliefs" (contra 1 and 2).  
  - **Untestability**: Foundations *can* be tested (e.g., by engineers), but hinges are **immune to doubt** (§§337-338): challenging "I have hands" isn’t false but meaningless (like doubting chess rules mid-game).  
  - **Belief Status**: Calling hinges "beliefs" (2) ignores that they are **non-propositional frameworks** (§§205, 675). We *act* on them, not "believe" them (§110, §204).  

  ### Do (1) and (2) Survive?  
  **No.**  
  - (1) fails: Hinges aren’t "foundational beliefs" but the **scaffolding for language-games** (§211). Foundationalism seeks justified bases; Wittgenstein dissolves the need (§192).  
  - (2) fails: Hinges are **action-orienting certainties** (§414), not inert beliefs. "My having two hands" isn’t *believed*; it’s used (§§10-11).  

  ### Better Analogy: The Riverbed (§§96-99)  
  Wittgenstein’s own image:  
  - Hinges are the **riverbed**—relatively fixed but shiftable over time.  
  - Empirical claims are the **water**—flowing within those banks.  
  - This captures hinges’ *dynamic, non-foundational* role: enabling inquiry without being its "base."  

