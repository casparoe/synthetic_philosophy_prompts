prompt: |-
  So I've been reading the rationalist blogs for going on fifteen years now — Overcoming Bias back in the day, SSC, the occasional history-of-science thread — and I like to think I've trained myself to flinch whenever somebody reaches for an analogy to end an argument. Last week somebody got me anyway and I genuinely can't tell if I got got or if he's right.

  The setup: a friend of mine who reads way too much legal theory was in a group chat argument about the statues thing, specifically about whether you're allowed to call a 17th-century merchant who invested in slave voyages a bad person. His move was that retrospective moral condemnation is exactly like an ex post facto law — you're convicting someone under a rule that didn't exist when they acted, which is the paradigm case of injustice in basically every legal system worth the name (the US Constitution flatly prohibits them, nullum crimen sine lege, all that). So when people say "well, they should have known better," he says they're demanding something no court would ever grant: notice of the rule before you're held to it. Then he extended it outward to historians — anyone who evaluates the past using today's categories is doing the same thing with extra steps, and the only honest procedure is to judge actors by the standards that were actually available to them, meaning what their own society told them. He seemed pretty pleased with himself and half the chat agreed.

  Here's what I want from you, and you don't need to name-drop sources or give me a reading list, I want the machinery laid out. First, the correspondence table: in his analogy what exactly plays the legislature, the promulgated rule, the defendant, the court, the punishment, and the notice requirement — because I noticed he never says who the moral lawmaker is, and I suspect that's not an accident. Second, the disanalogies, but sorted: which ones actually load-bearing against his conclusion and which are just decoration that a defender could shrug off. Third, three specific pressure points I came up with and can't resolve. (a) Doesn't the analogy only work if moral norms are made and dated by somebody the way statutes are, i.e. doesn't it sneak in a positivist metaethics about morality and then use the legal machinery to make that look neutral? (b) At Nuremberg "that crime hadn't been written down yet" was rejected as a defense — is that a counterexample to him, or does it only work because international law is a weird half-legal thing where the analogy was already straining? (c) Does his slide from "the act was wrong" to "the agent is blameworthy" go through, or has he answered a different question than the one the chat was actually asking — and relatedly, does negligence law's objective reasonable-person standard, which holds people to a bar they personally didn't endorse, undercut the notice point from inside the legal system he's borrowing from? And fourth, his leap from individual moral assessment to historians-in-general: is that even the same claim? My sense is that presentism in historiography is usually about concepts, periodization, what counts as an explanation, and which questions get asked of the sources — not about scolding dead people — so even a perfect analogy would only cover a slice of the target. Finally, if you think the analogy's no good, tell me what a better one would be, ideally one that keeps whatever is right in his intuition, because I do feel there's something to the notice thing that I don't want to just throw away.
reasoning: |-
  Okay, let me start by unpacking the user's query. They've been into rationalist blogs for years and pride themselves on spotting weak analogies. But their friend's legal theory analogy about retroactive moral condemnation stumped them. The friend compares judging historical figures by modern standards to ex post facto laws, which are unjust in legal systems. The user wants a thorough breakdown: correspondence, disanalogies, pressure points, and if there's a better analogy.

  First, I need to map the friend's analogy. The legislature here would be the moral lawmaker—but who is that? The friend doesn't specify, which is a red flag. The promulgated rule is contemporary morality, defendant is the historical actor, court is the person judging now, punishment is blame or condemnation. Notice is knowing the moral rule at the time. But morality isn't legislated like laws, so that's shaky.

  Next, disanalogies. The key one is that moral norms evolve socially, not through formal legislation. Legal systems require formal promulgation; morality doesn't. Also, legal consequences involve state power, like imprisonment, whereas moral blame is social. These differences undermine the analogy's core. Other disanalogies, like the role of precedents, are less critical but still relevant.

  Now the pressure points. The user's point (a) hits on metaethics. If morality is objective or discovered, not made, the analogy fails. The friend assumes positivism without stating it. Point (b) about Nuremberg is tricky. International law relies on natural law principles, so it's not a pure counterexample but shows that legal systems sometimes reject formal notice. Point (c) addresses negligence law. The reasonable-person standard means you're held to what you should have known, not what you did know. This undercuts the notice argument within the legal framework itself. Also, the friend conflates act wrongness with agent blameworthiness. An act can be wrong even if the agent isn't blameworthy due to ignorance.

  Then there's the jump to historians. The user notes that presentism in history is more about frameworks than moral judgment. Even if the analogy works for blame, it doesn't cover historical methodology. Historians might use modern concepts to understand the past without condemning individuals.

  The user also wants a better analogy preserving the notice intuition. Legal negligence makes sense here: the reasonable person standard acknowledges context but holds people to what they should have known. Or like judging scientific errors with historical context, where we understand outdated theories without dismissing past scientists as incompetent.

  I should ensure each part addresses the user's structured request. They want clarity without jargon, focusing on the machinery. Highlighting the metaethics sneakiness is crucial. The Nuremberg point needs nuance—international law's hybrid nature makes it a weak counter. Negligence law is a strong counter because it comes from the same legal system the friend cites. For historians, separating moral blame from analytical frameworks shows the overextension of the analogy.

  Finally, the better analogy should retain the idea that context matters but allow for retrospective assessment. Negligence or scientific context fits well. Emphasize that condemning without considering context is unfair, but we can still recognize past wrongs as wrong by our lights, understanding why they occurred.
answer: |-
  Here's the machinery breakdown, pressure testing, and alternative framing you requested — structured to dissect both the analogy's appeal and its critical flaws.

  ### I. Correspondence Table (His Analogy Mapped)
  * **Legislature:** The collective moral consensus (or "society") at the time of judgment (us, today). *This is the core ambiguity.*
  * **Promulgated Rule:** Today's specific moral norm (e.g., "investing in slave trading is evil").
  * **Defendant:** The historical actor (17th-century merchant).
  * **Court:** The person making the retrospective moral judgment (or society today).
  * **Punishment:** Moral condemnation ("bad person" label), social ostracization (removing statues), reputational harm.
  * **Notice Requirement:** The demand that the defendant *could have known* the act was morally wrong *at the time they acted* (based on rules/laws/norms *then* existing).

  ### II. Disanalogies: Load-Bearing vs. Decorative
  * **Load-Bearing (Collapses the Analogy):**
      1.  **Source of Authority/Legitimacy:** Legal systems derive authority from formal structures (constitutions, legislatures). Moral norms emerge organically through philosophy, religion, social struggle, evolving understanding — there's no "legislature." Sneaking in "society" as the legislator begs the question of *which* society (local? global? elite? oppressed?) and ignores that moral progress often *challenges* contemporary societal norms. The analogy presupposes **moral positivism** (morality = whatever society says) without justification.
      2.  **Formality of Promulgation:** Laws require formal enactment and publication. Moral norms are diffuse, contested, and often unwritten. What constitutes "notice" is radically different.
      3.  **Nature of Sanction/Power:** Legal punishment involves state power (fines, imprisonment, execution). Moral condemnation is non-state, discursive, and lacks coercive legal force (removing a statue isn't equivalent to imprisoning the merchant). Conflating social disapproval with state punishment overreaches.
      4.  **Purpose & Function:** Law primarily aims at regulating behavior, maintaining order, and administering justice *prospectively*. Moral judgment serves broader purposes: understanding character, assigning (non-legal) responsibility, defining values, *learning from the past*, and contesting current norms. Retrospective moral analysis is central to this function; retrospective lawmaking is prohibited because it undermines law's core purpose of guiding conduct.

  * **Decorative (Defender Could Shrug Off):**
      1.  **Specificity of Rules:** Laws are often highly specific statutes. Moral norms can be broader principles ("causing unnecessary suffering is wrong"). A defender might argue the "core wrong" (e.g., inflicting suffering for profit) was knowable.
      2.  **Precedent:** Legal systems rely heavily on precedent. Moral reasoning is less bound, though cultural traditions play a role. Not fatal to the core "notice" argument.
      3.  **Appeals Process:** Legal systems have formal appeals. Moral discourse is ongoing and decentralized. Doesn't directly impact the core analogy.

  ### III. Pressure Points Resolved
  **(a) The Metaethics Sneak:** **Yes, absolutely.** This is the Achilles' heel. The analogy *assumes* moral norms are **posited** (made) by "society" at a specific time, just like statutes. This smuggles in **moral positivism** or **cultural relativism** as the neutral baseline. If morality is **discovered** (natural law), **objective** (Platonic), or involves **progress in understanding** fundamental harms (e.g., the inherent wrongness of treating humans as property, even if widely accepted), the analogy collapses. The "legislature" problem highlights this: who *is* the legitimate moral lawmaker? The analogy provides no answer, making it question-begging.

  **(b) Nuremberg & International Law:** **It's a limited counterexample that exposes strain, not a pure refutation.** Nuremberg relied on **natural law principles** ("crimes against humanity") overriding formal positivistic "notice." Judges argued that certain acts (systematic genocide, aggressive war) were so fundamentally wrong that knowledge of their wrongness *could be imputed* to the defendants based on basic human conscience, even absent specific statutes. This shows:
      *   The legal system *itself* recognizes limits to the "no crime without law" principle for core evils.
      *   "Notice" can sometimes be understood as awareness of *fundamental wrongness*, not just of a specific statute.
      *   International law's hybrid nature *does* make the analogy strain, but Nuremberg demonstrates that even legal systems acknowledge a category of acts considered inherently wrong, potentially knowable across time/place. It weakens the claim that *no* retrospective moral judgment can ever be valid.

  **(c) Act Wrongness vs. Agent Blameworthiness & Negligence:** **This is crucial and undercuts his core argument from within law.**
      *   **The Slide:** Your friend conflates two distinct questions:
          1.  *Was the act wrong?* (Evaluating the action itself).
          2.  *Is the agent blameworthy?* (Assigning responsibility *to the actor*).
      The chat was likely focused on #1 ("Was he a bad person?" implies judgment of *him* based on *his acts*). His analogy addresses #2 (blameworthiness) via the notice requirement for punishment.
      *   **The Negligence Undercutting:** Tort law (negligence) explicitly **rejects** the idea that you can only be held responsible if you *personally knew* the rule. The **objective "reasonable person" standard** holds individuals to the knowledge and conduct *expected of a reasonable member of society at that time*. If a 17th-century merchant *should have known* investing in the slave trade caused horrific suffering (based on available information, emerging critiques, basic empathy), he could be found negligent *even if* he personally believed it was acceptable or legal. **The legal system he invokes explicitly recognizes that "notice" can be objective, not subjective.** This fatally undermines his claim that demanding someone "should have known" is inherently unjust or alien to legal reasoning. It shifts the question from "Was the rule promulgated?" to "Was the wrongfulness reasonably *knowable*?".

  ### IV. The Historian Leap: Different Claim Altogether
  **You're correct. This is a significant overreach.** His analogy *might* (if valid) apply narrowly to **assigning personal blame or condemnation** to historical figures. Historians engaging in "presentism" typically do something entirely different:
  1.  **Conceptual Framing:** Using modern concepts (e.g., "gender," "capitalism," "race" as a social construct) to analyze the past, *not* to morally judge individuals.
  2.  **Causal Analysis:** Asking questions driven by modern concerns (e.g., environmental impact, subaltern agency) that past societies didn't prioritize.
  3.  **Interpretive Lens:** Recognizing biases and limitations in sources based on modern critical theory.

  Judging actors by *their* contemporary standards ("historicism") is a vital methodological principle *for understanding their motivations and context*. However:
  *   **It's not primarily about avoiding blame.** It's about accurate understanding.
  *   **It doesn't preclude using modern tools/concepts analytically.** A historian can analyze the 17th-century slave trade through a modern economic or critical race theory lens *without* necessarily calling individual merchants "bad people." They might focus on systems, ideologies, or structures.
  *   **"Presentism" as a historiographic sin** is about **anachronism** (imposing modern concepts/values in a way that distorts historical reality), **not** about moral condemnation per se.

  His leap conflates *moral judgment of individuals* with *all forms of historical analysis using modern perspectives*. A perfect analogy about blameworthiness wouldn't touch the bulk of historiographic presentism concerns.

  ### V. A Better Analogy (Preserving the Kernel)
  The valid kernel is: **Condemning someone *harshly* for failing to meet a standard they genuinely *could not have known or reasonably foreseen* feels unjust.** A better analogy comes from **Law (Negligence) + Scientific Progress**:

  1.  **Core Analogy:** Judging a historical figure's moral blameworthiness is like determining if a scientist or doctor was **negligent** in their time.
      *   **The Standard:** The *objective reasonable person* in their profession/society at the time. What *should* they have known? What evidence was available? Were dissenting voices present?
      *   **The Wrong:** Causing foreseeable harm through a failure of reasonable care/knowledge.
      *   **The "Notice":** Not knowledge of a specific "law," but access to knowledge/reason that *should have* prompted reconsideration or caution.
      *   **The Distinction:** We can say a practice was *harmful/wrong* (e.g., bloodletting, mercury treatment, supporting chattel slavery) by our lights, and analyze *why* it was accepted. We can even say some actors *within that context* might have been negligent if they ignored available counter-evidence or appeals to basic humanity. However, condemning *everyone* who participated as uniquely monstrous, ignoring the pervasive influence of their context, is like blaming a medieval doctor for not knowing germ theory. It shows a lack of historical understanding.

  2.  **Why it's better:**
      *   **Preserves "Notice" Concern:** It directly incorporates the **objective reasonable person standard**, addressing when it's fair to say someone "should have known."
      *   **Avoids Positivism Sneak:** Focuses on *knowable harms* and *reasonable conduct*, not on "rules" posited by a legislature.
      *   **Allows Nuance:** Distinguishes between acts widely accepted and acts already contested; between followers and pioneers of cruelty; between ignorance and willful disregard of suffering.
      *   **Fits Historical Practice:** Historians *do* assess whether figures acted "responsibly" or "reasonably" *within their own context*.
      *   **Separates Act/Agent:** We can condemn the *act* (slavery) as a profound evil while acknowledging that *agent blameworthiness* varies based on context, knowledge, alternatives, and complicity.

  **Conclusion:** Your flinch reflex was justified. The ex post facto analogy is rhetorically powerful but structurally unsound. It smuggles in controversial metaethics, ignores key legal doctrines (like negligence) that contradict it, conflates distinct concepts (act wrongness vs. agent blameworthiness), and wildly overextends to historiography. The core intuition about unfair condemnation for unavoidable ignorance is valid, but the negligence/professional standards analogy provides a far more robust and nuanced framework for grappling with retrospective moral assessment while respecting historical context. Your friend got points for style, but the machinery doesn't hold up.
