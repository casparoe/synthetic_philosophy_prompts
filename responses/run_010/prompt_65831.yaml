prompt: |-
  I'm on a hiring-analytics committee at a mid-size company and we got into an arguement at lunch that I still can't let go of. We were looking at promotion rates and found one of those textbook reversals: overall, men get promoted at a noticeably higher rate than women, but inside every single job family — engineering, sales, ops, support — women get promoted at a slightly *higher* rate than men. Our outside consultant said this is actually good news: once you hold job family constant the gap disappears and even flips, so there's no discrimination left to find, and the headline number is just an artifact of women being concentrated in families that promote less often overall. Everyone at the table nodded. I was the only one uneasy and I couldn't say why beyond "that feels like it's hiding something," which is not something you can bring to a meeting.

  So here's what I want from you: argue that the consultant is wrong. Make the strongest case you can that breaking the numbers down by job family in this situation can *mask* discrimination instead of ruling it out, and that the aggregate reversal is sometimes the more informative number for the question we actually care about — which is "does this company treat equally good employees equally well?" I'm not looking for a hedge. Don't tell me it depends on the underlying structure and both readings can be legitimate; I know that's the standard line and I think it's doing way too much work here. Take a side. And in particular I want you to attack the piece everyone treated as neutral background: "women just happen to be concentrated in the job families that promote less." Why is that sentence itself suspicious rather than a fact we can condition on and move past?

  Some details about our setup, since I think they matter. Nobody assigns people to a job family — they sort into it themselves, through internal transfers and which openings they apply for. For roughly a decade, moving into engineering from any other family required a sign-off from your current manager, a requirement that got dropped in 2016. Promotion rates within a family track pretty closely with how much revenue and headcount that family controls. And the overall split of men and women across families has been remarkably stable for about fifteen years, longer than any of the current managers have been in their seats. Use whatever conceptual machinery you think does the work, but keep it in plain English: I have to explain this to people who've never had a stats course past intro and who would glaze over at any jargon. No references or suggested reading, just the argument.
reasoning: |-
  Okay, let's tackle this problem. The user is part of a hiring-analytics committee and they've encountered a Simpson's Paradox scenario where overall promotion rates favor men, but within each job family, women are promoted at slightly higher rates. The consultant claims that conditioning on job family eliminates discrimination, but the user feels uneasy about this conclusion. 

  First, I need to understand why the user is uncomfortable. They mentioned that "women just happen to be concentrated in job families that promote less" seems suspicious. The key here is to challenge the neutrality of that statement. Why are women concentrated in certain roles? Is that concentration itself a result of past or ongoing biases?

  The company's setup provides important context. Job families are self-selected through internal transfers and applications. But there's a historical policy: until 2016, moving into engineering required manager sign-off. Engineering likely has higher promotion rates. If women were systematically denied these transfers in the past, that could explain their current concentration in lower-promotion families. Even though the policy changed, the effects linger because shifting job families is difficult and the gender distribution has been stable for 15 years. 

  Also, promotion rates are tied to revenue and headcount. This means structural factors, not just performance, affect promotion chances. If certain departments are underfunded, promotions there are rarer. If women are overrepresented in such departments, they're disadvantaged through no fault of their performance. 

  The consultant's approach assumes job family is a neutral control variable. But if job assignment is influenced by bias, then conditioning on it masks that discrimination. The aggregate disparity might actually reflect the cumulative effect of past barriers. 

  The user needs a strong argument against the consultant's conclusion. The core points are: historical barriers in transfers, structural promotion inequities between departments, and the self-reinforcing nature of these disparities. The aggregate number reveals the systemic issue, while the partitioned data hides it by treating the symptom (current job distribution) as a given. 

  The explanation must be jargon-free. Using metaphors like "locked doors" for past policies and "uneven fields" for departmental resources could help. Emphasize that the real question is equal treatment for equal performance, and the aggregate number better captures whether the company's overall system allows that.
answer: |-
  Here’s the strongest case against the consultant’s conclusion, stripped of jargon and focused squarely on *why* conditioning on job family masks discrimination in your situation:

  ### The Core Argument:  
  **"Women are concentrated in low-promotion job families" isn’t a neutral fact—it’s the heart of the discrimination.** Treating it as background noise ignores *how* that concentration happened and *why* those families promote less. The aggregate number reveals a systemic bias; the breakdown hides it by pretending the system is fair once you accept the biased starting point.

  ### Why This Isn’t Just "Happening" – It’s Engineered:
  1. **Historical Barriers Created the Concentration:**  
     Until 2016, moving into **engineering** (likely a high-promotion, high-revenue family) required **manager sign-off**. If managers (consciously or not) were less likely to approve transfers for women, this policy funneled women *away* from career-accelerating paths. The "stable" gender distribution isn’t accidental—it’s frozen by a decade of restricted mobility. The reversal started *after* the policy changed? That’s a smoking gun.

  2. **Promotion Rates Reflect Power, Not Merit:**  
     Promotion rates track **"revenue and headcount" control**, not performance. This means:  
     - Departments where women are concentrated (e.g., support, ops) are structurally **under-resourced and under-valued**.  
     - Fewer promotions exist there *by design*, not because employees are less deserving.  
     **Result:** Women are stuck in lanes with lower ceilings because the company invests less in those areas. Conditioning on job family blames the lane, not the road-builders.

  3. **Self-Selection Isn’t Free Choice:**  
     "They sorted themselves!" ignores:  
     - **Signaling:** If women see few female leaders in engineering/sales, they infer "this isn’t for me."  
     - **Biased Opportunities:** If high-potential women were steered toward "support" roles early on (a common bias), their "choice" was shaped.  
     - **Feedback Loops:** Lower promotion rates in "women-heavy" families demoralize talent, creating a self-fulfilling prophecy.  

  ### Why the Aggregate Number Matters More:  
  Your core question is: **"Does this company treat equally good employees equally well?"**  
  - The **aggregate disparity** (men promoted more overall) answers: **"No."**  
    It shows that a woman with equal talent is statistically likely to have worse outcomes *because of systemic factors* (historical barriers, department inequality).  
  - The **job-family breakdown** answers a different, narrower question: **"Once you’re in a lane, does gender affect your sprint?"**  
    It ignores whether women were **put in slower lanes** to begin with.  

  ### The Consultant’s Error:  
  They assumed job family is a "pre-existing characteristic" (like eye color) rather than an **outcome shaped by the company’s own policies and culture**. By conditioning on it, they erased:  
  - Past discrimination in role assignment/transfers.  
  - Ongoing discrimination in resource allocation across departments.  
  - The cumulative disadvantage women face over a 15-year "stable" period.  

  ### The Bottom Line:  
  **Your company built an obstacle course where the starting line depends on gender.** Women run slightly faster than men in every segment *despite* carrying historical baggage, but they’re still losing the race because they were forced to start further back. **The aggregate gap measures the unfairness of the whole course. The job-family breakdown only looks at the segments—and calls it fair because everyone runs the same speed *once they’re in the segment*. That’s not fairness; it’s statistical malpractice.**  

  ### What to Say in the Meeting:  
  > "The consultant’s math isn’t wrong, but it answers the wrong question. The issue isn’t just whether women get promoted fairly *once they’re in a job family*. It’s whether they had a fair shot *at getting into high-opportunity families in the first place*. For 10 years, they needed permission to enter engineering—permission they may have been denied because of bias. Now they’re stuck in families the company undervalues, with fewer promotions by design. The 'concentration' of women in slow-lane jobs isn’t a fact we condition on—it’s the discrimination we need to fix. The headline number isn’t an artifact; it’s the alarm bell."  

  This isn’t a hedge—it’s a direct challenge to the illusion of neutrality in your data structure. The aggregate reversal isn’t hiding the truth; it’s revealing the system.
