prompt: |-
  I'm working on a chapter about games where the players don't just pick strategies, they pick *programs*: each player submits code to a referee, each program gets to read the other player's program (sometimes as a printed listing, sometimes as an oracle it can query), and then outputs an action, and payoffs come from the outputs. That's the program equilibrium idea Tennenholtz set up, plus the later resource-bounded stuff from Halpern, Pass and Seeman where you're only allowed to introspect so much before you time out. Before I sort through the pile of variants, I want to know what I should even be asking of one.

  So: write the desiderata. What does any theory in this family have to deliver before it counts as an answer rather than a rebranding? Give me each requirement, then the concrete case behind it — the little 2x2, the two-line code snippet, the specific pair of programs that makes you see why you can't skip it.

  Here's what I already suspect belongs on the list; handle these and add your own:

  - termination. two programs that each read the other can mutually recurse forever. what fixes the output when that happens, and is a default-output rule part of the theory or a fudge?
  - syntax vs semantics. suppose my strategy is "cooperate iff the opponent's source is byte-identical to mine." now somebody rewrites their program to be extensionally identical but spelled differently, and we both defect. is stability under benign re-coding a real requirement or a luxury? and if it is real, does the theory have to say what counts as the same program?
  - findability. can the players actually compute the equilibrium themselves, given that they're subject to the same bounds as the code they submit? if not, in what sense is it an equilibrium of anything they could play?
  - reduction. when code is opaque, does the theory fall back on Nash? does it have to?
  - the neighbors. what distinction does it have to preserve against superrationality, against a mediator generating correlated outcomes, against cheap talk, against an ordinary commitment device? if a variant can't say how it differs from those, is that fatal?
  - predictive bite. Tennenholtz's own result is that the program-equilibrium payoff set of a game coincides with its feasible and individually rational payoffs, which sounds like the concept predicts almost anything. is narrowing the outcome set a genuine desideratum here or just Nash-envy?
  - asymmetry and lying. partial transparency — one player's code is legible, the other's isn't — and players who refuse to reveal, or reveal something that isn't what gets run.

  Then tell me which of these are non-negotiable and which are really one camp's aesthetic dressed up as a requirement. And the part I want most: whether any subset is jointly unsatisfiable. If demanding computability-by-the-players plus full mutual introspection plus stability under re-coding is impossible together, say it as a theorem-shaped claim and sketch the argument, don't wave at it.

  Close with a very short scorecard of three flavors — (a) unbounded introspection with a default rule for nontermination, (b) bounded or forgetful introspection where you only get a capped/noisy view of the opponent's code, (c) a trusted compiler that takes both programs and reveals nothing but the outputs. Brief is fine, the list is the deliverable.
reasoning: |-
  We are to list desiderata for a theory of program equilibrium, with concrete examples for each. We address the user's suspected list and add new ones. Then we discuss which are non-negotiable and which are aesthetic, and whether some are jointly unsatisfiable. Finally, we provide a short scorecard for three flavors.

  ## Desiderata

  1. **Termination**  
     **Requirement**: Programs must either terminate or have a well-defined default output when they don't.  
     **Example**: Consider two programs, A and B.  
     - A: if B cooperates then cooperate else defect.  
     - B: if A cooperates then cooperate else defect.  
       If we run A, it tries to check B's output. But B is doing the same. Without a termination condition, this loops. The theory must specify what happens (e.g., default to defect) and whether the default rule is part of the equilibrium concept.  

  2. **Syntax vs Semantics (Extensionality)**  
     **Requirement**: The outcome should depend only on the behavior of the opponent's program, not on its syntactic representation.  
     **Example**: In a Prisoner's Dilemma, let program P1 be: "if the opponent's code is byte-identical to me, then cooperate; else defect." Program P2 is the same as P1 but with a comment added (so byte-different). When P1 faces P2, both will defect because they are not byte-identical. But if they were byte-identical, they would cooperate. This is unstable under benign recoding. The theory should either require that such programs are not allowed (and define what programs are admissible) or make the outcome depend only on the function computed (extensional).  

  3. **Findability (Computability by the Players)**  
     **Requirement**: The players, subject to the same computational bounds, should be able to compute an equilibrium program.  
     **Example**: Consider a game where the payoff depends on finding a fixed point of a complex function. If the players are bounded, they might not be able to compute the fixed point. Then, even if an equilibrium exists, they cannot find it. The theory must either provide a constructive method or explain how bounded players can arrive at an equilibrium.  

  4. **Reduction to Nash under Opacity**  
     **Requirement**: When the programs are opaque (cannot inspect each other), the theory should reduce to the standard Nash equilibrium.  
     **Example**: In a simultaneous-move game without inspection, if both players submit programs that simply output a fixed action (without reading the opponent), then the outcome should be a Nash equilibrium of the underlying game. If the theory does not reduce, it might be extending the game in a way that changes the strategic structure.  

  5. **Distinction from Neighboring Concepts**  
     **Requirement**: The theory must clarify how program equilibrium differs from:  
     - Superrationality: Players reason that they are identical and choose the cooperative action.  
     - Correlated equilibrium: A mediator sends signals.  
     - Cheap talk: Pre-play communication.  
     - Commitment: Binding commitment to an action.  
     **Example**: In a Prisoner's Dilemma, program equilibrium can achieve mutual cooperation without a mediator. But how is it different from a correlated equilibrium? The theory must show that the program equilibrium uses the code itself as a commitment device and that the code is executed without a trusted third party.  

  6. **Predictive Bite**  
     **Requirement**: The set of equilibrium outcomes should be a strict subset of the feasible and individually rational payoffs.  
     **Example**: Tennenholtz showed that without further restrictions, program equilibrium can achieve any feasible and individually rational payoff. This is too permissive. The theory must narrow the set (e.g., by computational constraints) to have predictive power.  

  7. **Asymmetry and Lying**  
     **Requirement**: The theory must handle cases where one player's code is legible and the other's isn't, or when a player submits a program that is different from what they claim.  
     **Example**: Player 1's code is public, Player 2's is private. Player 1 can condition on Player 2's code, but Player 2 cannot condition on Player 1's. Also, Player 2 might submit a program that claims to be cooperative but defects. The theory must define what it means to have an equilibrium when players can lie about their code.  

  ## Additional Desiderata

  8. **Resource Bounds**  
     **Requirement**: The theory must account for computational resources (time, memory, etc.) and specify what happens when programs exceed these bounds.  
     **Example**: Two programs that try to simulate each other for a large number of steps might time out. The theory must define the output in such cases (e.g., default action) and how the resource constraints affect the equilibrium.  

  9. **Robustness to Adversarial Code**  
     **Requirement**: Programs should be robust against adversarial opponents that try to cause non-termination or resource exhaustion.  
     **Example**: A program that is designed to cooperate if the opponent does, but the opponent submits an infinite loop. The theory must define how the program handles such cases (e.g., time out and default).  

  10. **Compositionality**  
      **Requirement**: The behavior of a program should be composable: if a program is part of a larger game, the equilibrium should still hold.  
      **Example**: Consider a tournament where multiple program equilibria are played. The same program should work in different matchups without re-computation.  

  ## Non-negotiable vs Aesthetic

  - **Non-negotiable**: Termination, Reduction to Nash under Opacity, and Resource Bounds (if the theory is resource-bounded) are essential. Without termination, the model is not well-defined. Without reduction, it doesn't generalize standard game theory. Resource bounds are core to bounded rationality.
  - **Aesthetic**: Syntax vs Semantics might be considered a luxury by some (if the theory allows arbitrary syntax-based programs) but is essential for robustness. Findability is non-negotiable for a constructive theory but might be relaxed for existence results. Predictive bite is non-negotiable for a theory that aims to make testable predictions.

  ## Joint Unsatisfiability

  **Claim**: It is impossible to simultaneously satisfy **Findability** (players can compute an equilibrium program), **Full Mutual Introspection** (each program can read the entire source code of the other), and **Extensionality** (the outcome depends only on the function computed, not the code).

  **Sketch**: 
  - Assume we have a game with at least two actions per player and a non-trivial payoff structure (e.g., Prisoner's Dilemma). 
  - Extensionality requires that two programs that compute the same function are treated identically. 
  - Full mutual introspection means each program can read the opponent's source. 
  - Findability requires that the players can compute an equilibrium program with the same computational bounds as the programs they submit.

  Now, consider the following scenario: 
  - Each player must write a program that, given the opponent's source, outputs an action. 
  - Suppose we want an equilibrium that achieves mutual cooperation in the Prisoner's Dilemma. 
  - A candidate is the program that cooperates if the opponent's program is extensionally equivalent to itself and defects otherwise. 
  - However, by the Rice's Theorem-like argument, determining extensional equivalence is undecidable. 
  - Therefore, the players (with bounded computation) cannot write such a program because they cannot decide equivalence. 
  - Moreover, even if we allow a default for non-termination, the program might not be able to decide equivalence in the allotted time. 

  Thus, if we insist on extensionality, we require programs that can decide semantic properties, which may be uncomputable. But if we drop extensionality, then we can have programs that use syntactic checks (like byte-identity) which are computable. However, syntactic checks are unstable under recoding. 

  Therefore, in a bounded setting, we must choose between extensionality (which is not computable) and syntactic stability (which is brittle). 

  ## Scorecard of Three Flavors

  1. **Unbounded introspection with default rule for nontermination**  
     - Termination: Handled by a default rule (e.g., defect if nontermination).
     - Syntax vs Semantics: Typically uses syntactic identity, so not extensional.
     - Findability: Not guaranteed because of undecidability issues.
     - Reduction: May not reduce to Nash when opaque because of the default rule.
     - Neighbors: Distinct from mediator by using code as commitment.
     - Predictive Bite: Too broad (Tennenholtz result) without further restrictions.
     - Asymmetry: Doesn't handle lying well because of full transparency.

  2. **Bounded or forgetful introspection**  
     - Termination: Built-in via resource bounds (time-out).
     - Syntax vs Semantics: Often uses approximate equivalence (e.g., hashing) so not fully extensional.
     - Findability: Designed for computability by the players.
     - Reduction: With no introspection, reduces to Nash.
     - Neighbors: Closer to cheap talk if the inspection is limited.
     - Predictive Bite: Narrower set of equilibria due to bounds.
     - Asymmetry: Can handle partial transparency and lying by limiting the view.

  3. **Trusted compiler (reveals only outputs)**  
     - Termination: The compiler can impose timeouts.
     - Syntax vs Semantics: Extensional because only input-output behavior matters.
     - Findability: Players can compute programs without introspection.
     - Reduction: Without introspection, it is like Nash, but with the compiler it can allow for more (like correlated strategies).
     - Neighbors: Similar to a mediator, but the programs are the correlation device.
     - Predictive Bite: Can be narrowed by the compiler's restrictions.
     - Asymmetry: The compiler can enforce symmetry or not.

  **Summary**: Each flavor has trade-offs. The bounded introspection approach is the most practical, while the trusted compiler is the most extensional but requires trust. The unbounded version is theoretically clean but has computability issues.
answer: |-
  ### Desiderata for Program Equilibrium Theories

  1. **Termination**  
     **Requirement**: Programs must halt or have a defined default output when mutual recursion occurs.  
     **Concrete case**: Consider two programs:  
     ```python
     def A(B_code): return B(A_code)  # Outputs whatever B outputs when given A's code
     def B(A_code): return A(B_code)  # Outputs whatever A outputs when given B's code
     ```  
     Without a termination rule (e.g., "time out after 100 steps and output DEFECT"), this loops infinitely. A theory must specify how outputs are resolved (e.g., timeouts, depth limits) and whether defaults are part of the equilibrium concept or an external patch.  
     **Non-negotiable**: Yes. Non-termination voids the game.

  2. **Syntax vs. Semantics (Extensionality)**  
     **Requirement**: Outcomes should be invariant under semantically equivalent code changes.  
     **Concrete case**: Prisoner's Dilemma with programs:  
     ```python
     # Program 1: Cooperate only if opponent's code is byte-identical.
     def P1(opp_code): return COOP if hash(opp_code) == HASH_P1 else DEFECT
     # Program 2: Semantically identical to P1 but with added comment.
     def P2(opp_code): return COOP if hash(opp_code) == HASH_P2 else DEFECT  # P2 has different hash
     ```  
     When `P1` faces `P2`, both defect despite semantic equivalence. If players can't distinguish benign changes (e.g., whitespace), cooperation unravels.  
     **Non-negotiable**: Luxury unless predictive power is prioritized. Real-world programs often rely on syntax (e.g., digital signatures), but theories should clarify if they assume extensionality.

  3. **Findability**  
     **Requirement**: Players must compute equilibria within their resource bounds.  
     **Concrete case**: Consider a game where the only equilibrium requires solving an undecidable problem (e.g., the Halting Problem). Players with bounded computation cannot find it. If the theory posits such an equilibrium, it fails to explain how players arrive at it.  
     **Non-negotiable**: Yes for descriptive theories (players are bounded). Optional for normative theories (idealized agents).

  4. **Reduction to Nash**  
     **Requirement**: When programs are opaque (no code inspection), outcomes should collapse to Nash equilibria.  
     **Concrete case**: Battle of the Sexes. Without introspection, programs output fixed actions. If `(Opera,Opera)` is played but isn't a Nash equilibrium, the theory fails to reduce.  
     **Non-negotiable**: Yes. Without reduction, the model doesn't generalize standard games.

  5. **Distinction from Neighboring Concepts**  
     **Requirement**: Must differentiate from:  
     - **Superrationality**: Programs must not *assume* symmetry without syntactic basis.  
       *Case*: If both programs are `"cooperate iff opponent's code == my code"`, cooperation is *earned* via code-matching, not assumed symmetry.  
     - **Mediators/Correlation**: Programs generate outcomes without trusted third parties.  
       *Case*: `P1` uses `P2`'s code to generate a correlated action (e.g., "cooperate if `P2`'s line 3 is `return 0`"), mimicking correlation *without* a mediator.  
     - **Cheap Talk**: Pre-play communication is non-binding; program commitments are.  
       *Case*: Programs can commit to conditional strategies (e.g., "defect if opponent defects") that cheap talk cannot enforce.  
     **Non-negotiable**: Yes. Without distinctions, the framework is redundant.

  6. **Predictive Bite**  
     **Requirement**: The set of equilibrium outcomes must be narrower than "all feasible, individually rational payoffs."  
     **Concrete case**: In Prisoner's Dilemma, Tennenholtz achieves mutual cooperation via self-recognition programs. But if *any* feasible payoff (e.g., asymmetrical cooperation) is achievable via ad hoc programs, the theory predicts nothing.  
     **Non-negotiable**: Aesthetic. Permissiveness is acceptable if constrained by other desiderata (e.g., bounded resources).

  7. **Asymmetry and Lying**  
     **Requirement**: Handle partial transparency (e.g., one player reads code, the other doesn't) and deceptive submissions.  
     **Concrete case**:  
     - *Asymmetry*: Player 1 sees Player 2's code; Player 2 sees only outputs. Player 1 can tailor actions to `P2`'s code, but Player 2 must use fixed logic.  
     - *Lying*: Player 1 submits code `A` but claims to submit `B`. If `A` defects unconditionally while `B` promises cooperation, Player 2 must detect deception via introspection.  
     **Non-negotiable**: Yes. Real-world applications involve asymmetric access and trust issues.

  ---

  ### Joint Unsatisfiability Theorem
  **Claim**: *Findability*, *full mutual introspection*, and *extensionality* are jointly unsatisfiable in a bounded setting.  
  **Proof sketch**:  
  1. Assume players can inspect each other's full source code (full mutual introspection).  
  2. Extensionality requires that programs which are semantically equivalent (e.g., compute the same function) are treated identically.  
  3. By Rice's Theorem, there is no general algorithm to decide semantic equivalence of arbitrary programs.  
  4. Findability requires players to compute an equilibrium program with bounded resources.  
  5. In Prisoner's Dilemma, consider a candidate equilibrium program:  
     ```python
     def P(opp_code): 
         return COOP if semantically_equivalent(opp_code, P) else DEFECT
     ```  
     But `semantically_equivalent` is undecidable. Players cannot implement this with finite time/memory.  
  6. Thus, bounded agents cannot achieve extensional cooperation via self-recognition.  
  **Resolution**: Theories must relax one:  
  - Drop extensionality (allow syntax-based checks).  
  - Limit introspection (e.g., bounded inspection depth).  
  - Forgo findability (assume unbounded players).

  ---

  ### Scorecard of Three Flavors  
  | Desideratum                          | (a) Unbounded + default rule | (b) Bounded/noisy introspection | (c) Trusted compiler |
  |--------------------------------------|-------------------------------|----------------------------------|----------------------|
  | **Termination**                      | Default rule (e.g., defect)   | Timeout/default                 | Compiler enforces   |
  | **Syntax vs. Semantics**             | Syntax-dependent              | Approximate (noisy) checks      | Extensional         |
  | **Findability**                      | ✗ (undecidability issues)     | ✓ (within bounds)               | ✓ (compiler-assisted) |
  | **Reduction to Nash**                | ✓ (if opaque)                 | ✓ (if no inspection)            | ✓ (opaque execution) |
  | **Distinction from neighbors**       | Clear (code as commitment)    | Blurry (limited introspection ≈ cheap talk) | Mediator-like       |
  | **Predictive bite**                  | ✗ (too permissive)            | ✓ (constrained by resources)    | ✓ (compiler restricts) |
  | **Asymmetry/lying**                  | Handles asymmetry, not lying  | Handles both via noise/limits   | Prevents lying (compiler verifies) |

  **Key trade-offs**:  
  - **(a)** Unbounded: Clean for theory but unrealistic; defaults are ad hoc.  
  - **(b)** Bounded: Realistic and computable, but syntactic checks are brittle.  
  - **(c)** Trusted compiler: Elegant (enforces extensionality) but requires trust in the compiler.  

  **Recommendation**: Bounded introspection (b) best balances realism and rigor, but all three highlight different facets of the problem. Prioritize termination, reduction, and distinction from neighbors as non-negotiable; treat extensionality and predictive bite as context-dependent.
