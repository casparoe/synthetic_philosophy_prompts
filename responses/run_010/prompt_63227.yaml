prompt: |-
  I serve on the editorial board of a university press series in global history, and we must decide whether an incoming proposal counts as Eurocentric. Our own record to date: we accepted a manuscript built as six parallel regional narratives that meet only after 1500; we rejected a survey whose first half is devoted to Europe and whose second half treats other regions mainly as theaters of European expansion; we accepted a study of European industrialization that argued its case by sustained comparison with the lower Yangzi and with Japan, taking the divergence itself to be what requires explanation; we rejected a book that gave non-European societies a great many pages but cast them as reservoirs of technique, crop, and demand on which Europe subsequently drew; we accepted a monograph that omits Europe for three quarters of its length in favor of Indian Ocean exchange networks; and we rejected, narrowly, a history of science that ran a single line from antiquity through Renaissance Europe to the present, admitting other traditions only at the points where they fed that line.

  The new proposal devotes roughly a third of its chapters to Europe; it portrays colonial officials, merchants, and states as agents with their own reasons and their own internal dynamics; it organizes the whole book under a tripartite periodization — ancient, medieval, modern — applied uniformly to every region it treats; and its closing chapter asks why the institutions of the modern world came to be recognizably Western in form.

  Tell me how I should expect the board to vote, and which of our six precedents is the closest analog and why. More important, lay out the candidate criteria the board might be running — share of coverage; whether non-Europeans appear as agents or as objects; whether European categories serve as the universal scaffolding; whether the narrative converges on a Western terminus — and say of each whether it is consistent with all six precedents or which precedent it contradicts. Then say where the surviving criteria diverge on the new case, which way I should vote if consistency with our own record is the governing consideration, what principle the board would be adopting by voting each way, and what further proposal we could put before it that would separate the criteria decisively.
reasoning: |-
  Hmm, the user is on an editorial board for a university press series in global history, and they need help evaluating whether a new book proposal is Eurocentric. They've provided six precedents - three accepted and three rejected manuscripts - to show their board's standards. Now they want me to predict how the board would vote on this new proposal, identify the closest precedent, analyze potential criteria the board uses, and suggest how they should vote to stay consistent with their record.

  Looking at the precedents they shared: They accepted manuscripts that either avoided European dominance (like the six parallel narratives that only meet after 1500), centered non-European perspectives (the Indian Ocean monograph), or treated Europe as part of a comparative framework rather than a standard (the industrialization study comparing Europe with the Yangzi and Japan). They rejected manuscripts where Europe was clearly centered - like the survey with its Europe-first structure, the book treating non-Europe as a "reservoir" for European use, or the history of science that created a single European lineage.

  Now for the new proposal: It gives Europe a third of the chapters (which isn't necessarily problematic by itself), portrays non-Europeans as agents (a positive sign), but uses the problematic "ancient/medieval/modern" periodization that originated from European history and frames its conclusion around why modern institutions are "Western in form." That last point especially seems to center Europe as the inevitable endpoint.

  For criteria consistency, I need to test which principles hold across all six precedents. Share of coverage alone isn't decisive - they accepted the Europe-focused industrialization study. Portrayal of agency matters - they rejected works where non-Europeans were passive (like the reservoir book). But the strongest consistent criterion appears to be whether the narrative converges on a Western terminus - all rejected works did this (Europe as engine, Europe as beneficiary, Europe as endpoint), while accepted works avoided it. The periodization issue also appears consistently problematic when universalized European categories are imposed.

  The closest precedent is actually the rejected history of science (with its linear progression to Europe) due to the "Western terminus" framing. But the periodization problem also echoes the rejected survey that centered Europe structurally.

  The board will likely reject this because of the teleology and uncritical periodization. If the user values consistency, they should vote reject. To clarify their criteria, they could test with a proposal that uses European periodization but avoids Western terminus framing, or vice versa - that would force the board to decide which factor matters more.

  The key is that their series seems to guard against treating Europe as history's destination point, which this proposal unfortunately does.
answer: |-
  Based on your board's precedent and the details of the new proposal, here's the analysis:

  1.  **Expected Vote:** **Reject.** The proposal's framing, periodization, and concluding question strongly align with rejected precedents.
  2.  **Closest Analog:** The **rejected history of science** (single line from antiquity/Renaissance Europe to present). Both share a teleological narrative converging on "Western" modernity as the endpoint and implicitly universalize European historical categories.

  **Candidate Criteria & Consistency with Precedents:**

  Here are key criteria derived from your precedents, assessed for consistency:

  1.  **Share of Coverage (Pages/Chapters devoted to Europe):**
      *   *Consistency:* **Inconsistent.** Precedents show coverage alone isn't decisive.
          *   *Contradicted By:* Accepted the Europe-focused industrialization study (high European coverage). Rejected the "reservoir" book (high non-European coverage).
      *   *New Proposal:* Europe gets ~1/3 coverage. Insufficient grounds for rejection based solely on this.

  2.  **Agency of Non-Europeans (Do they appear as subjects with internal logic/dynamics, or as objects/backdrop?):**
      *   *Consistency:* **Consistent.** Portraying non-Europeans as agents is a positive signal.
          *   *Supported By:* Accepted parallel narratives (presumed agency), Indian Ocean monograph (non-European agency central). Rejected "reservoir" book (non-Europeans as objects).
      *   *New Proposal:* **Positive.** Portrays colonial officials, merchants, states (including non-Western ones) as agents with own reasons/dynamics.

  3.  **Universalization of European Categories (Are European frameworks/periodizations presented as universally applicable?):**
      *   *Consistency:* **Highly Consistent.** Imposing European structures universally is rejected.
          *   *Supported By:* Accepted parallel narratives (avoided universal structure pre-1500), Indian Ocean monograph (non-European framework). Rejected survey (implicit universalization via structure), "reservoir" book (implied European framework), history of science (universalized European lineage).
          *   *Contradicted By:* None. The accepted industrialization study used *comparison*, not universalization.
      *   *New Proposal:* **Major Problem.** The "ancient/medieval/modern" periodization is applied uniformly. This is a quintessential European-derived framework imposed globally, ignoring distinct regional temporalities/developments.

  4.  **Narrative Convergence on a Western Terminus (Does the story logically lead to/present "Western" modernity as the inevitable or normative endpoint?):**
      *   *Consistency:* **Highly Consistent.** Convergence on a "Western" terminus is consistently rejected.
          *   *Supported By:* Accepted parallel narratives (delayed connection), industrialization study (divergence *questioned*, not assumed), Indian Ocean monograph (non-European focus, no Western terminus). Rejected survey (Europe drives expansion), "reservoir" book (Europe benefits), history of science (single European line to present).
          *   *Contradicted By:* None. The board consistently avoids narratives framing "the West" as history's destination.
      *   *New Proposal:* **Major Problem.** The explicit closing question – "why the institutions of the modern world came to be recognizably Western in form" – frames Western modernity *as* the terminus and makes explaining its rise the core puzzle. This inherently centers Europe as the standard and goal.

  **Where Surviving Criteria Diverge & How to Vote:**

  *   **Divergence:** The new proposal **passes Criterion 2 (Agency)** but **fails Criteria 3 (Universalization of European Categories)** and **4 (Narrative Convergence on Western Terminus)**.
  *   **Vote Recommendation (for Consistency):** **Reject.** Criteria 3 and 4 are demonstrably the most consistent across your board's decisions. Failing either is a strong signal for rejection; failing both decisively aligns this proposal with your rejected precedents (especially the history of science). Criterion 2 (Agency) is necessary but insufficient; the deeper structural framing (Categories & Terminus) outweighs the positive portrayal of agents.
  *   **Principle Adopted by Voting:**
      *   **Reject:** The board affirms that avoiding Eurocentrism requires rejecting narratives that impose European historical categories (like periodization) as universal frameworks *and* that frame "Western" modernity as the inherent or normative endpoint of global history, regardless of the agency granted to actors within that framework.
      *   **Accept:** The board would signal that granting agency to non-Western actors within a structurally Eurocentric framework (universal periodization, Western terminus) is sufficient to avoid Eurocentrism, a principle *contradicted* by the rejection of the "reservoir" book (which gave many pages/agency to non-Europeans but framed them solely in relation to Europe's rise) and the history of science.

  **Separating the Criteria: A Test Proposal**

  To decisively separate the importance of **Criterion 3 (Universal Categories)** from **Criterion 4 (Western Terminus)**, present a proposal with this outline:

  *   **Title Example:** *"Rhythms of Exchange: Connected Histories across Afro-Eurasia, 500-1500"*
  *   **Structure:** Organized around major interregional exchange networks (Silk Roads, Indian Ocean, Trans-Saharan) and their shifting hubs/nodes over time.
  *   **Periodization:** Uses internally defined phases based on climatic shifts, major trade good circulations (e.g., "The Age of Sogdian Caravans," "The Spice and Monsoon Epoch"), or political configurations of key *non-European* core regions. Explicitly rejects "ancient/medieval."
  *   **Coverage:** Europe is covered as one peripheral region among others (e.g., Norse in the North, Mediterranean connections), receiving significant but not dominant attention (~20-25%).
  *   **Agency:** Focuses on merchants, pilgrims, scholars, and states across regions as interconnected agents.
  *   **Terminus:** Concludes by examining the *diverse* institutional and cultural legacies of these exchanges across multiple regions (Islamic science, Southeast Asian state formation, European urban growth) *without* framing any single trajectory (especially "Western") as the inevitable or normative outcome. The endpoint is the early modern *plurality* of development paths.

  **Why this separates the criteria:**

  1.  It **fails Criterion 3 (Universalization of European Categories)** by using non-European derived periodization and structures.
  2.  It **passes Criterion 4 (Western Terminus)** by avoiding any convergence on or privileging of a "Western" endpoint; Europe is integrated but not the destination.
  3.  It passes Criterion 2 (Agency) and likely avoids issues with Criterion 1 (Coverage).

  **How the board votes on *this* test proposal reveals which criterion is truly paramount:**
  *   **Reject:** Means **Criterion 3 (Avoiding Universal European Categories)** is non-negotiable, even without a Western terminus. (This aligns best with your existing record).
  *   **Accept:** Means **Criterion 4 (Avoiding a Western Terminus)** is the *primary* guard against Eurocentrism, and non-European frameworks (Criterion 3) are desirable but potentially optional if the terminus is avoided. (This would be a shift from your precedent, given the rejection of works using European frameworks even without *explicitly* stating a Western terminus, like the survey and "reservoir" book).
