prompt: |-
  In three weeks I shall be presenting a paper at an interdisciplinary workshop on character and moral psychology, jointly hosted by a philosophy department with a strongly Aristotelian orientation and a research centre in psychology that runs studies on helping behaviour and moral judgement. The room will hold perhaps twenty-five people, and they are not a natural constituency. There will be six or seven virtue ethicists who think in terms of stable dispositions and practical wisdom, who treat the appraisal of individual acts as philosophically second-order, and who will suspect that I have simply relabelled a notion they already own. There will be three experimental psychologists, one of whom sits on the committee that allocates the centre's seminar slots, and whose interest will be almost entirely in whether anything I say could be operationalised, measured, and tested against a rival explanation; they read vignette studies as evidence and will not be impressed by appeals to intuitions about shopkeepers. The chair is a Kant scholar, broadly sympathetic to the traditional account of moral worth and unlikely to enjoy being told that it mislocates the very property it was designed to capture. Then there are the generalists, who tend to ask the question the specialists have been too courteous to raise. The session runs to forty minutes with twenty for questions, which means I can afford to answer perhaps two challenges at length and must dispatch the rest in a sentence.

  So that you have something to aim at, here is the thesis. I argue that moral worth is not a matter of what moved the agent on the occasion of the act, but of the counterfactual robustness of her responsiveness to the features that make the act right. An act has moral worth to the degree that the agent would have performed it, or something relevantly like it, across a wide neighbourhood of nearby situations in which those right-making features obtain — including situations in which the reasons she actually cites would have pointed the other way, and including situations in which her beliefs about what morality requires are systematically distorted. I intend to press four consequences: that this ranks the Huckleberry Finn type of agent very highly, because her responsiveness tracks the features even when her professed principles do not; that moral worth thereby becomes graded rather than binary, which I take to be an advantage and my audience may not; that the fetishism objection loses its grip, since nothing in the account requires the agent to be moved by the thought that her act is the right one; and that moral worth comes apart from praiseworthiness, since an agent may be robustly responsive to the right-making features in a manner that earns her no credit whatsoever, which is precisely why I have kept the two notions distinct.

  What I want from you is a question-period preparation sheet, not a defence of the view; I am quite prepared to lose parts of it gracefully, and would rather know in advance which parts. Order the objections by how much damage they would do if they landed, and mark for each how likely it is to be raised in this room rather than in a general philosophy audience. Phrase each one in the register of the person who would actually voice it — the virtue ethicist will want to know whether robust responsiveness just is a virtue described modally, and if so what my paper has added; the psychologists will want to know what a counterfactual could possibly be measured with, how one would distinguish robust responsiveness from a well-learned habit or from social desirability, and what design would falsify me; the chair will want to know whether I have severed moral worth from the good will and left something no better than a reliable mechanism. For each objection, give a reply that fits in about two minutes, state plainly where that reply is soft, and say whether the objection is merely costly or genuinely fatal to the project as I have framed it. Tell me also what I should concede in the opening five minutes so that the concessions are mine rather than extracted from me, and identify the single point that has to land if the talk is to survive the afternoon. Finally, name the question I shall be praying does not come up — my own guess is the circularity worry, since the width of the counterfactual neighbourhood looks as though it can only be fixed by the very judgements about which features are right-making that the account was supposed to leave neutral, and I have no good answer to that yet — and tell me honestly how bad it is if someone does ask it, together with the least dishonest way of buying myself time. Please do not supply a bibliography or situate the view in the literature; I shall handle the citations myself.
reasoning: |-
  Okay, the user is preparing for a presentation at an interdisciplinary workshop on moral psychology and philosophy, facing a diverse audience. They need to anticipate objections and prepare concise responses. Let me start by understanding their thesis: moral worth depends on counterfactual robustness of responsiveness to right-making features, not the agent's motives at the time.

  First, I need to identify the key stakeholders in the audience. The virtue ethicists might see this as repackaging virtues. The psychologists will question measurability and operationalization. The Kantian chair will worry about separating moral worth from the good will. The generalists could bring up unaddressed issues.

  The user's main concerns are damage control and strategic concessions. They want to know which objections are most damaging and likely to arise. Also, they need a prioritized list with responses that fit into two minutes, noting weaknesses.

  Starting with the virtue ethicists: their objection might be that robust responsiveness is just virtue described modally. The reply should differentiate by focusing on the modal dimension and act-specificity. But conceding that it's a cousin to virtue could preempt this. It's costly but not fatal.

  Next, the psychologists. They'll challenge measurability and confuse robustness with habits or social desirability. The response could suggest dispositional measures and vignette variations. However, operationalizing "relevantly like it" is tricky. This is costly but manageable if framed as a collaborative challenge.

  The Kantian chair will fear severing moral worth from the good will. The reply must link robustness to good will's deeper structure. But if pressed, conceding that it's a reconception rather than abandonment might help. This is high damage; if the chair isn't satisfied, the core argument suffers.

  Circularity is the user's nightmare. Defining the neighborhood of situations based on right-making features seems circular. The response could use coherence with existing judgments, but it's weak. The user should admit it's unresolved and offer to discuss post-talk. This is potentially fatal but unlikely if unraised.

  Preemptive concessions: admit that moral worth isn't binary (graded aspect) and separate from praiseworthiness early on. The must-land point is Huck Finn's high ranking, showcasing the theory's unique value. If this lands, it demonstrates the framework's advantage over competitors.

  Prioritizing objections: Kantian objection is top due to chair's influence and foundational threat. Psychologists' operationalization next, as funding concerns are practical. Virtue ethicists' redundancy third, though less damaging. Circularity is critical but less likely.

  The user should pray circularity isn't asked. If it is, honesty about ongoing work and a collaborative framing can mitigate damage. Overall, focusing on Huck Finn and preemptive concessions will help manage the audience's diverse expectations.
answer: |-
  Here is your question-period preparation sheet, ordered by damage potential and contextual likelihood. Concessions and core defenses are included.

  ---

  ### **Preemptive Concessions (Opening 5 Minutes)**  
  1. **Moral worth is graded, not binary** (concede upfront to avoid tedious debates).  
     *"I acknowledge this breaks from Kantian purity, but gradedness better captures everyday moral distinctions."*  
  2. **Praiseworthiness ≠ moral worth** (disarm the "credit" objection early).  
     *"An agent can be robustly responsive without deserving praise—think of the naturally empathetic person who effortlessly does right."*  

  ### **The Must-Land Point**  
  **Huck Finn’s high ranking**: If the audience doesn’t grasp why your account elevates Huck (robust responsiveness despite false principles), the talk fails. Hammer this in the core presentation.  

  ---

  ### **Ranked Objections & Replies**  
  *(Ordered by Damage Severity → Likelihood in This Room)*  

  1. **The Kantian Chair’s Objection (High Damage / High Likelihood)**  
     *Phrasing:* "You’ve severed moral worth from the *good will*—the agent’s conscious moral commitment. Isn’t this just rewarding reliable robots?"  
     **Reply (2 mins):**  
     > "The good will isn’t discarded—it’s reconceived as *stable alignment* with the right-making features, even when explicit reasoning fails. Huck Finn’s compassion *is* his good will, manifesting as responsiveness to suffering despite his corrupted beliefs. A ‘reliable mechanism’ lacks this deep alignment."  
     **Soft Spot:**  
     Kantians tie moral worth to *duty-conscious motivation*. Your account *does* decouple worth from explicit moral reasoning.  
     **Verdict:**  
     **Costly but not fatal**. If the chair remains hostile, it undermines goodwill (ironically), but your core framework survives.  

  2. **Psychologists’ Operationalization Challenge (High Damage / High Likelihood)**  
     *Phrasing:* "How do you *measure* ‘robust responsiveness’? How is this not just habit or social desirability bias? What experiment could falsify you?"  
     **Reply (2 mins):**  
     > "(1) Measure dispositional traits (e.g., empathy scales) plus behavioral consistency across *vignette variations* where non-moral incentives shift.  
     (2) Habit lacks counterfactual sensitivity—e.g., if the ‘habit’ breaks when right-making features persist but social rewards vanish, it’s not robustness.  
     (3) Falsification: Show agents act *inconsistently* when right-making features are held fixed but non-moral factors (mood, distraction) vary."  
     **Soft Spot:**  
     Defining "relevantly like it" for acts across scenarios is hand-wavy. Psychologists will note your counterfactuals aren’t directly testable.  
     **Verdict:**  
     **Costly but not fatal**. Grants interdisciplinary traction but risks appearing unscientific.  

  3. **Virtue Ethicists’ Redundancy Objection (Moderate Damage / High Likelihood)**  
     *Phrasing:* "Isn’t ‘robust responsiveness’ just *phronesis* (practical wisdom) or a virtue, described modally? What’s new here?"  
     **Reply (2 mins):**  
     > "Virtues are global traits; robust responsiveness is *act-specific* and need not reflect character. A selfish agent might be robustly responsive to honesty only in finance (e.g., Enron accountants who rigidly follow fiscal rules but cheat on taxes). This granularity explains why we ascribe moral worth to acts without praising the agent."  
     **Soft Spot:**  
     Virtue ethicists may counter that *phronesis* already covers context-sensitive responsiveness. Concede it’s a "cousin" to virtue but stress the modal/act focus.  
     **Verdict:**  
     **Merely costly**. They’ll grumble but your distinction with praiseworthiness protects you.  

  4. **Generalists’ Circularity Worry (Potentially Fatal / Low-Medium Likelihood)**  
     *Phrasing:* "How do you define the ‘neighbourhood of situations’ without presupposing which features *are* right-making? Isn’t this circular?"  
     **Reply (Buying Time):**  
     > "This is a deep challenge I’m still wrestling with. *Pro tempore*, I’d say we fix the neighbourhood by holding fixed the *actual world’s moral truths* while varying non-moral beliefs/incentives. But I welcome suggestions post-talk!"  
     **Soft Spot:**  
     You have no non-circular account. Retreating to "moral truths" begs the question.  
     **Verdict:**  
     **Genuinely fatal if pressed**. Pray it isn’t raised. If asked, **concede openly** and pivot to Huck Finn: *"Even if circular, doesn’t the Huck Finn case show this account captures something intuitive?"*  

  ---

  ### **The Prayer: "Please Don’t Ask About Circularity"**  
  - **How bad if asked?**  
    **Critical but survivable**. If a generalist raises it, your reply exposes the flaw but shows intellectual honesty. The chair may intervene to "move discussion along."  
  - **Least dishonest time-buying tactic:**  
    *"That’s an excellent question for the metaethical foundations—one I address at length in the full paper. Briefly, we might anchor it in *shared evaluative practices*, but I’d prefer to discuss your take after the session."*  

  ### **Summary: Survival Strategy**  
  - **Sacrifice:** Gradedness and praiseworthiness separation.  
  - **Fortify:** Huck Finn as your exemplar.  
  - **Abandon:** Circularity defense (if cornered).  
  - **Win condition:** Psychologists nod at testability; Kantian chair doesn’t veto future invites.  

  Good luck. The virtue ethicists will be the loudest, but the psychologists hold the keys.
