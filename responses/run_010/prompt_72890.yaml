prompt: |-
  I'm a second-year political theory PhD student and I've been going around in circles on something in my chapter on the duty to vote, so I mostly want someone to either confirm a hunch or talk me out of it. No reading list, no names of books — just the argument.

  Two real institutional practices that seem to rest on two seperate pictures of what a vote even is.

  (1) Australia, and roughly twenty other countries, compel you to vote. You get fined if you don't turn up. But the ballot is secret, so the state can never observe the thing it claims to be compelling — the only checkable fact is that your name got marked off the roll. You can attend, take the paper, drop it in blank, and you've discharged the duty; nobody will ever know. And for the lower house you have to number every single box or your vote is informal, so the only way to register "I reject all of these people" is to spoil the paper — which is simultaneously a perfectly legal way of complying. So the state mandates an act it can't observe, is officially indifferent to the act's content, and punishes only a proxy for it.

  (2) Nevada has printed a "None of These Candidates" line on its statewide and presidential ballots since 1975. It can win a plurality and it still doesn't matter — if it does, the real candidate with the most votes takes the office. When the line was challenged in 2012, the state's defence was essentially that it's a protest option meant to send a message and that the outcome is no different from not voting at all. So here's an institution that builds an official channel for a purely communicative vote, tallies it, publishes it, and then by design strips it of any effect on who governs.

  My hunch is that neither survives the instrumental picture, where a vote is a causal contribution to an outcome. On that picture (1) is compulsory performance of a null act and (2) is a line that can only ever function as a spoiler. But they don't survive on the *same* non-instrumental picture either. (2) looks expressive — vote as speech act — yet if the vote is a speech act then (1)'s compulsion is incoherent, because a compelled utterance isn't an expression of anything, and (1)'s indifference to content is exactly what an expressive theory can't stomach. (1) looks more like a duty, or a ritual, or a sampling device (drag the whole electorate in so the aggregate isn't skewed toward whoever felt like showing up) — but then what is the Nevada line *for*? Rituals don't come with a "none of the above" checkbox.

  So: what does each practice actually presuppose about what voting is? Where am I wrong about them pulling in opposite directions, if I am? And please keep apart the things a practice strictly can't do without from the theories it merely happens to sit comfortably with — I suspect both of these are a lot more underdetermined than I'm letting on.

  Format it with these sections, in this order:

  - **What each practice is committed to** (~300 words) — one subsection per practice, stating the minimum view of voting each one needs in order to not be pointless
  - **The instrumental reading, and why it fails** (~200 words) — or, if it doesn't fail, say so and explain away the tension instead
  - **Is there one theory that covers both?** (~300 words) — a single account of voting under which compulsory attendance and a powerless protest line are two parts of one design, not a contradiction
  - **Where they're underdetermined** (~250 words) — rival theories that license the same institutional choices, and what extra fact would discriminate between them
  - **Swapping the theory out** (~200 words) — what would concretely have to change in Australian and Nevada election administration if the presupposed view were replaced by a strictly instrumental one
  - **Bottom line** (~80 words) — is my hunch right, half right, or wrong
reasoning: |-
  Okay, the user is a second-year political theory PhD student struggling with a chapter on the duty to vote. They've presented two institutional practices: Australia's compulsory voting and Nevada's "None of These Candidates" option. They think these practices conflict with both instrumental and non-instrumental theories of voting and want to know if their hunch is correct.

  The user wants a clear analysis without literature references, focusing purely on the argument. They've provided a specific structure for the response. I need to break this down carefully.

  First, examining each practice's commitments. For compulsory voting like Australia's, the state isn't concerned with how people vote, just that they show up. This suggests voting is seen as a civic duty or ritual—participation itself matters, not the choice made. The secret ballot means the state can't enforce actual voting, only attendance. So the minimum commitment is that showing up has value, perhaps for social cohesion or representative legitimacy.

  Nevada's "None" option is different. It allows a protest vote that's counted but doesn't affect the outcome. This treats voting as expressive—a way to communicate dissatisfaction. The state acknowledges this message by tallying and publishing the results, even though it doesn't change who wins. The commitment here is to expression over instrumental impact.

  Next, the instrumental view—where votes directly affect outcomes—fails for both practices. Compelled attendance doesn't ensure meaningful participation since people can submit blank ballots. Nevada's "None" option is literally designed not to influence results. So instrumentalism can't explain why these systems exist.

  Is there a unified theory? Symbolic theories might work—voting as ritual affirmation of democratic legitimacy. In Australia, showing up reaffirms the system; in Nevada, the "None" option channels dissent within that same system. But this feels forced since Nevada's protest vote undermines legitimacy while Australia's ritual reinforces it. Communicative theories could also link them, but compelled expression is problematic. So no single theory comfortably covers both.

  Both practices are underdetermined. Compulsory voting could align with civic republicanism (duty) or epistemic theories (better sampling). Nevada's option could fit expressive theories or be seen as a pressure valve. To distinguish, we'd need evidence of institutional intent—like legislative debates or how officials frame these policies.

  Swapping to instrumentalism: Australia might drop compulsion since attendance without intent is worthless. Nevada would scrap the "None" line as it's a spoiler risk without benefit.

  The core tension is real—Australia values participation qua participation, Nevada values expression even when ineffective. They prioritize different aspects of voting. The user's hunch is mostly right: these practices pull in opposite directions, revealing a fundamental ambiguity in what voting represents. The key insight is that voting serves multiple symbolic functions—participation and expression—that institutions manage separately, leading to surface contradictions.
answer: |-
  ### What each practice is committed to  
  **Australia's compulsory attendance**: The state commits minimally to the view that voting is a **civic ritual of participation**, where the *act of showing up* (not the vote’s content) legitimizes the electoral outcome. The secret ballot’s unobservability and acceptance of blank/spoiled ballots reveal that the state cares only about universal *inclusion in the process*. This presupposes that voting’s primary function is to affirm collective commitment to democracy by ensuring the electorate’s full presence. Outcome integrity relies on statistical representativeness—not individual intent—making voting a **duty of presence** akin to jury service, where the ritual itself sustains systemic legitimacy.  

  **Nevada’s "None of These Candidates" (NOTC)**: The state commits to voting as a **channel for expressive dissent**, where ballots are tools for *communicating preferences*—even when those preferences are negative. By tallying and publishing NOTC votes, Nevada treats them as meaningful political speech, not wasted votes. The deliberate decoupling from electoral outcomes (NOTC cannot win) confirms that the practice prioritizes *expression over efficacy*. This presupposes that voting serves a **signaling function**: it allows citizens to register active rejection, transforming abstention into a public, quantified statement of dissatisfaction within the system.  

  ---

  ### The instrumental reading, and why it fails  
  The instrumental view—voting as a causal input to electing leaders—fails for both. In Australia, compelling attendance but ignoring content (via blank/spoiled ballots) produces no instrumental gain: null votes don’t influence outcomes. In Nevada, NOTC is explicitly non-causal; it cannot change who governs. If voting were purely instrumental, Australia’s law would mandate consequential voting (which it cannot enforce), and Nevada’s line would be irrational—it only risks vote-splitting without payoff. The practices survive only by rejecting instrumentality: Australia values participation *as such*, Nevada values protest *as such*.  

  ---

  ### Is there one theory that covers both?  
  A unified account is possible under a **symbolic-legitimacy theory**: Voting is a ritual that sustains democracy’s perceived fairness by balancing inclusion and expression. Australia’s compulsion ensures universal buy-in, preventing legitimacy crises from low turnout. Nevada’s NOTC absorbs anti-system sentiment into the ritual, making dissent "count" symbolically without destabilizing outcomes. Both treat voting as **system-maintenance**: Australia secures baseline participation; Nevada vents discontent safely. However, this strains under scrutiny. Compelled ritual (Australia) clashes with voluntary expression (Nevada), and NOTC’s futility undermines the very legitimacy Australia seeks. A **communicative theory** (voting as aggregated public opinion) better links them: Australia ensures a complete opinion sample; NOTC adds a "reject all" datum. But compelled speech (Australia) remains incoherent here. Ultimately, no single theory elegantly reconciles coercion and futility—they remain distinct tools for distinct problems (apathy vs. alienation).  

  ---

  ### Where they’re underdetermined  
  Both practices are compatible with multiple theories:  
  - Australia’s compulsion fits **civic republicanism** (voting as duty) or **epistemic democracy** (turnout improves decision quality via diverse input), but also **statistical representation** (avoiding sampling bias).  
  - Nevada’s NOTC aligns with **expressive theories** (voting as speech) or **protest-valve models** (dissent containment).  
  **Discriminating factors**:  
  1. **Intentionality**: If Australia aimed to improve electoral *wisdom*, it would incentivize informed voting (it doesn’t). Its focus on attendance suggests ritualistic legitimacy.  
  2. **Institutional follow-through**: Nevada’s publication of NOTC counts signals expressive intent; ignoring its outcomes confirms expression is prioritized over efficacy. A purely statistical view (e.g., measuring alienation) wouldn’t require the public tally.  

  ---

  ### Swapping the theory out  
  Under strict instrumentalism:  
  - **Australia** abolishes compulsion. If votes must cause outcomes, forcing null votes is absurd. Attendance becomes voluntary; blank/spoiled ballots invalidated (as in some jurisdictions) to ensure votes are consequential.  
  - **Nevada** eliminates NOTC. Instrumental voting has no room for protest lines that don’t alter results—they risk spoiling (e.g., if NOTC drew votes from a minor candidate). Dissent must take extra-electoral forms (protests, write-ins).  

  ---

  ### Bottom line  
  Your hunch is **mostly right**. The practices *do* pull in opposite directions: Australia presupposes voting as **dutiful presence** (indifferent to choice), Nevada as **costless expression** (indifferent to impact). No single theory smoothly explains both without friction. However, they share a **rejection of instrumentality**, and both serve broader system-stability goals. The tension arises because one enforces participation, the other accommodates dissent—revealing voting’s dual role as ritual *and* speech.
