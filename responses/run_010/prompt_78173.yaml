  **(Stand at the podium, take a breath, look at the signallers, then the crowd)**

  Well, here we are then. On a platform. Waiting for a train. Feels almost ordinary, doesn’t it? But it isn’t, quite. That lever frame up there in the box… soon its work will be done. ***(Small gesture towards the signal box)*** And I’ve been asked to mark that moment, which is a bit daunting. Because I’m not the one who did the work. They did. ***(Nod clearly to the four signallers)*** Night shifts, early starts, all weathers. Keeping things moving. Keeping things safe.

  Now, I’ve been studying this sort of thing lately – how work changes. And something struck me about this box, about what happens up there. It’s easy to see the hard graft: the pulling, the watching, the concentration. The effort. And yes, the new centre will handle that effort differently – more screens, fewer levers, no need to be right here in the cold. It’s efficient. It’s safe. And for anyone tired of those long nights, ***(glance briefly at the delighted signaller)*** well, that’s a welcome change, and rightly so.

  But there’s something else that happens in that box, something quieter than the effort. Something about *how* the work gets done. A signaller doesn’t lift a train. They think ahead. Ten minutes, twenty minutes. They hold the whole picture of the line in their head: where this train is going, where that one needs to be, how they slot together safely. *That’s* the job. Thinking the future. Then, they turn that thought into action. They pull a lever to set a signal. They pull another to shift the points.

  And here’s the thing: that big frame of levers? It talks back. ***(Hold up hand, palm out, as if meeting resistance)*** If you get the picture wrong in your head – if you try to set two things that can’t safely happen together – the frame *stops* you. The levers lock. You feel it in your hand. It won’t budge. That weight, that refusal… it’s the machine saying, "No, think again. That future won’t work." ***(Pause, let that sink in)*** You feel the wire tighten all the way down the track to the points themselves. It’s an argument. A physical conversation between the mind making the plan and the machine making it real.

  When the control moves away, that argument changes. The effort moves – and that’s a good thing for many reasons. But the *conversation*… the way the machine physically pushes back right into the palm of your hand when the plan is flawed… that’s different now. The safety is built in, absolutely, but it’s built in somewhere else. The ‘no’ happens silently, in code, miles away. No hand feels it stop. The refusal is hidden.

  So what’s leaving this box today isn’t just hard work. It’s that particular kind of partnership. That immediate, physical reminder, right there in your fingers, that your plan has to fit the real world. A machine that argued with you to keep everyone safe. ***(Look at the signallers again)*** That was your daily dialogue. It took skill, yes, but it also took a kind of listening – listening through your hands.

  It’s no one’s fault. It’s not better or worse, exactly. It’s just… different. A different way of doing the vital job of keeping the line safe and moving. The thinking ahead still happens, of course, but the way the machine answers back has changed. We’ve automated the effort, but we’ve also quietly automated the argument. The centre argues with itself now, or perhaps it argues with the past – with the plans already laid down in its circuits. Not in the moment, hand on lever, feeling the wire run. ***(Slight pause)***

  So, as we watch that last lever pull, it’s worth recognising what that lever *did*. More than just moving signals. It was one side of a conversation. A heavy, clunking, vital conversation that shaped the safe future of every train that passed through here for decades. ***(Look towards the box)*** That specific sound, that specific feel – the cold metal, the worn brass plate catching the light just so, the particular smell of oil and damp wool that always hung in the air after a night shift... ***(very slight, knowing pause - grandad will catch the specific 'smell' detail)*** – that’s what falls silent today.

  It’s not an ending of care, or safety, or even history. It’s a shift. A transfer of that conversation. We honour the work, the vigilance, and yes, that unique, physical partnership that happened right here. To the signallers past and present, thank you for listening so well, for thinking so far ahead, and for having those arguments day and night. You kept us safe. Now, we’ll let the lever do its last job, and then… well, I hear the kettle’s already on down at the village hall. ***(Step back slightly, indicating readiness for the final lever pull)***
