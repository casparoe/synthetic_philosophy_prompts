prompt: |-
  You're the kind of philosopher of mind who also teaches a film-and-philosophy seminar — patient with both the film side and the neuroscience side. I'm prepping a session for a consciousness class that has just done Nagel's brain bisection paper, and I want to hang it on Kubrick's Dr. Strangelove, specifically the bit where Strangelove's gloved right hand shoots up in a Nazi salute, tries to strangle him, and he has to beat it down with his cane.

  Before you write anything up, brainstorm out loud a few ways to cash out what that hand is: a second subject of experience, a compulsive reflex with no inner life at all, a comic exaggeration of the intermanual-conflict cases from the early callosotomy literature where the two hands fight over a button, or something else entirely. Pick the one the scene best supports and defend the pick.

  Then the real question. Does Strangelove's arm dramatize Nagel's worry — that one body could house two streams of experience that neither could report on from the inside — or does the whole joke depend on keeping the hand sub-personal, so that the film quietly assumes the very unity Nagel is questioning? I want you to actually take a side rather than telling me it works both ways. And be honest about where the analogy strains: is the arm mostly a gag about a guilty conscience, and does that effect whether it can carry any philosophical weight at all? Say something about how the split-brain case differs from the film's picture even when the two look similar — the patients don't experience a rival will, they just find a hand doing things.

  Finish by telling me whether there's anything about disunity the film shows that the philosophy of split-brain misses — the war room arguing with itself, Ripper and Mandrake each running half a decision, the doomsday machine as a kind of institutional corpus callosum that everyone assumes is shared and turns out not to be. Think carefully, and don't hand me a bibliography or invent citations; I'll chase sources down myself.
