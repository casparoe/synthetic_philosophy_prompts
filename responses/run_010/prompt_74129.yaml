prompt: |-
  I am a junior, and for the past two years I have run an unofficial reading group with four classmates and our history teacher; we meet on Thursdays in the library annex and work through whatever one of us nominates. This month I nominated a unit on Kant's claim that the moral worth of an action lies not in what it accomplishes but in the principle on which it is done, largely because I wanted to argue against it, and I have instead ended up unable to state clearly what I think. Our teacher suggested we each turn our notes into a short position paper for a regional essay competition, and mine is supposed to say what moral worth consists in. Rather than start from a theory, I want to start from the verdicts I actually have, because I suspect that when they are laid out together they will either reveal a principle I already believe or reveal that some of them have to go.

  Here are my verdicts, in roughly the order I came to them. The shopkeeper who charges every customer the same honest price because his business would suffer if he were known to cheat: no moral worth, even though the price is right. The same shopkeeper, keeping the same policy after his competitors have all fled and cheating would now pay handsomely, because he judges that cheating would simply be wrong: full moral worth. A classmate who logs her soup-kitchen hours because her application requires them, and who is nonetheless warm and attentive to every person she serves: I want to say very little worth, though noticeably more than a person who does the same hours while being cruel. My grandmother, who has written a birthday card to every relative for fifty years because making people happy delights her and she gives the matter no further thought: I want to say full moral worth, which seems to put her on the same footing as the second shopkeeper. A volunteer who has been depressed for a year, feels nothing, and goes anyway because she judges that the people depending on her matter: full moral worth, and if worth comes in degrees, perhaps more than my grandmother's. Huckleberry Finn, who cannot bring himself to betray his friend and does the right thing while sincerely believing it is wrong and that he will be damned for it: real moral worth, which is the verdict I am least willing to abandon. A man who helps a stranger because he knows a camera crew is filming and wants to be seen helping, and who would also say, truthfully, that helping is the right thing to do: no moral worth, or close to none. Someone who donates because his horoscope promised a fortunate week, and who also holds, unconnectedly, that donating is right: no worth at all, even though his belief about rightness is correct. A person who does exactly the right thing for exactly the right reason but only because a drug given to her without her knowledge has rearranged her motives: no worth, since nothing in it is hers. And a friend of mine who reports a classmate's cheating because he says fairness demands it, and fairness does demand it, but who I am fairly sure would not have noticed the unfairness at all had he not wanted revenge: I keep flipping on this one, and it is the case I most want an answer about.

  My tentative principle is that an action has moral worth just when the agent does it because she recognizes that it is right. It seems to handle the two shopkeepers, the filming man, the horoscope, and the drug. But it clearly gives the wrong answer for my grandmother and for Huck Finn, and I do not know how to amend it without also giving worth to the camera-pleaser or to my revenge-seeking friend. So: state as precisely as you can the principle, or the small number of competing principles, that best captures these verdicts, and for each clause tell me which of my cases it was written to accommodate. Say explicitly which of my verdicts your account cannot save and which one you would tell me to drop. Tell me whether worth on your account is all-or-nothing or comes in degrees, and why, and what that implies for the soup-kitchen classmate who is kind while padding her application. Then give me your account's verdicts on three cases I have not listed and would not have thought to construct, and finally apply it to the one I left unresolved: whether a mother who pulls her child out of a burning car, purely out of love and without a trace of reasoning, acts with moral worth, with mere instinct, or with something in between.
reasoning: |-
  Hmm, this user is a junior in high school who's been running a reading group with classmates and a history teacher, focusing on Kant's moral philosophy. They're struggling to articulate their own position on moral worth after initially wanting to argue against Kant. Now they need to write a position paper for a competition, starting from their intuitive judgments rather than theory.

  Looking at their verdicts on various cases, I notice they value: 
  - Motives over outcomes (shopkeeper cases) 
  - Sincere conviction over calculation (Huck Finn vs. camera-pleaser) 
  - Emotional authenticity alongside rationality (grandmother vs. depressed volunteer) 
  - And they're deeply conflicted about mixed motives (revenge-seeking friend)

  Their draft principle ("acting because one recognizes it's right") clearly fails to capture their own intuitions about the grandmother (who doesn't deliberate) and Huck Finn (who thinks he's doing wrong). The challenge is preserving their core intuitions while eliminating contradictions.

  What's fascinating is how their cases reveal unstated priorities: 
  - They want moral credit for actions that feel authentic ("nothing in it is hers" in the drug case) 
  - They allow non-rational drivers (love, instinct) to have worth 
  - But reject external influences (cameras, horoscopes) even with correct beliefs

  The revenge-case hesitation suggests sensitivity to motive purity - they instinctively feel the fairness-rationalization taints the act, but can't articulate why. Meanwhile, the burning-car scenario pushes them to confront whether instinctive love has moral status.

  For the position paper, they need a principle that: 
  - Accommodates their "must-save" cases (grandmother, Huck, depressed volunteer) 
  - Explains why the revenge case feels contaminated 
  - Allows degrees of worth for partial motives 
  - Doesn't collapse into Kantian duty or utilitarianism

  I should emphasize that their grandmother case is actually the key - it shows they believe unreflective virtue can be praiseworthy, which Kant explicitly denies. That's their original insight worth defending.
answer: |-
  Based on your deeply considered verdicts, here’s a precise principle that captures most of your intuitions, along with its limitations and implications. Your cases reveal a tension between rational recognition of duty and non-rational motives (like love or instinct), suggesting **moral worth requires the action to stem authentically from the agent’s normative commitment to the act’s rightness, regardless of whether that commitment is rational, emotional, or volitional.**

  ### Core Principle:
  **An action has moral worth to the degree it is performed *because the agent is non-instrumentally committed to the act’s right-making features*, and this commitment is authentically integrated into their character.**

  ### Key Clauses & Case Accommodations:
  1. **"Non-instrumentally committed"**  
     - Targets: Camera-pleaser (commitment is instrumental to reputation) and horoscope donor (commitment disconnected from action).  
     - Accommodates: Shopkeeper 2 (committed to honesty as right), depressed volunteer (committed to others’ worth).  

  2. **"To the act’s right-making features"**  
     - Targets: Application-driven classmate (focused on hours, not service) and revenge-seeker (focused on fairness *as a tool*).  
     - Accommodates: Grandmother (focused on joy-as-good), Huck Finn (focused on loyalty-as-good).  

  3. **"Authentically integrated into character"**  
     - Targets: Drugged person (commitment not "hers"), shopkeeper 1 (policy not integrated with morality).  
     - Accommodates: All cases where motive aligns with the agent’s stable identity (e.g., grandmother’s lifelong habit).  

  ### Verdicts Your Account Cannot Save:
  - **Huck Finn**: Your principle *can* save him if "loyalty" is a right-making feature he’s committed to (despite false beliefs). But if you insist his *explicit rejection* of morality conflicts with "commitment to rightness," this case forces a revision: worth can exist even when the agent mislabels the right-making feature.  
  - **Grandmother**: Fully accommodated—her delight in making others happy reflects a non-instrumental commitment to kindness as good.  

  ### Verdict to Drop:
  **The revenge-seeking friend**: You must deny him worth. His "fairness" appeal is an instrumental rationalization for revenge, not authentic commitment. The action’s rightness is accidental to his motive.  

  ### Degrees of Worth & the Soup-Kitchen Classmate:
  - **Worth is scalar**, not all-or-nothing. It depends on:  
    (a) *Purity*: How much the commitment drives the act vs. other motives.  
    (b) *Depth*: How integrated the commitment is with the agent’s character.  
  - **Soup-kitchen classmate**: Low but nonzero worth. Her kindness shows partial commitment to service-as-good, diluted by application motives. More worth than a cruel volunteer because her kindness reflects *some* authentic concern.  

  ---

  ### Verdicts on New Cases:
  1. **A soldier jumps on a grenade to save comrades, driven purely by trained instinct**.  
     - *Verdict*: **Moderate worth**. If the instinct reflects deep integration of loyalty (a right-making feature), it has authenticity—but low purity if no conscious commitment.  

  2. **A vegan refuses meat solely because they find it disgusting, unaware of ethical arguments**.  
     - *Verdict*: **Full worth**. Disgust manifests non-instrumental commitment to non-harm (a right-making feature), authentically part of their character.  

  3. **A CEO donates millions after a spiritual epiphany, but previously mocked charity**.  
     - *Verdict*: **Low worth**. Commitment is new/unintegrated; feels performative (even if sincere).  

  ---

  ### Resolving Your Unresolved Case:  
  **The mother saving her child from a burning car out of pure love, without reasoning.**  
  - **Verdict**: **Full moral worth**.  
    - *Why*: Parental love reflects a non-instrumental commitment to the child’s life as a supreme good. This commitment is authentically integrated into her identity (vs. the drugged person). Instinct here expresses deep character, not external manipulation. It aligns with your grandmother’s case—both act from non-reflective but genuine normative engagement.  

  ---

  ### Why This Works for You:
  - **Saves your core intuitions**: Grandmother and Huck Finn are protected by focusing on *commitment to the good* (joy/loyalty) rather than abstract "rightness." The depressed volunteer’s worth comes from deep commitment despite emotional absence.  
  - **Explains flipping on revenge-case**: His action lacks "authentic integration"—fairness is a veneer for revenge.  
  - **Avoids Kant’s trap**: Moral worth isn’t confined to duty-based reasoning; it embraces emotional/instinctive drives if they express authentic moral character.  

  **Revise your tentative principle to**:  
  *"An action has moral worth when it is driven by the agent’s authentic, non-instrumental dedication to the values that make it right."*  
  This grounds worth in *your* emphasis on personal ownership (vs. the drugged case), anti-instrumentalism (vs. camera/horoscope), and inclusivity toward love/instinct (grandmother/mother).
