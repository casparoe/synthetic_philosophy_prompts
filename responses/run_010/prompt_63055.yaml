          But then we can have two assignments: one where the center is 0, and one where it is 1. These are just two different field configurations, not related by a diffeomorphism.

     To mimic the diffeomorphism, we would need to have a permutation of the points inside the hole, but the hole has only one point. So we need a larger hole.

     Let the hole be the center and its four neighbors: a plus sign. But then the boundary is the outer points.

     Example: in a 3x3 grid, the hole is P2, P4, P5, P6, P8. The boundary is P1, P3, P7, P9.

     We fix the boundary field values: 
          P1: 10, P3: 30, P7: 70, P9: 90.

     Then inside the hole, we can assign any values to P2, P4, P5, P6, P8? But then there is underdetermination.

     But we want two assignments that are related by a permutation of the points in the hole.

     However, a permutation of the points in the hole would also change the field values. We want the field configuration to be dragged along. So if we permute the points in the hole, then the field values are also permuted.

     For example, consider two assignments for the hole:

          Assignment 1: 
              P2:20, P4:40, P5:50, P6:60, P8:80.

          Assignment 2: 
              We apply a permutation that cycles the points: P2->P4, P4->P5, P5->P6, P6->P8, P8->P2.
              So then: 
                  P2:80 (because in Assignment 1, P8 had 80), 
                  P4:20 ( Assignment 1, P2 had 20),
                  P5:40 ( Assignment 1, P4 had 40),
                  P6:50 ( Assignment 1, P5 had 50),
                  P8:60 ( Assignment 1, P6 had 60).

     Then the two assignments are:

          Assignment 1: P2=20, P4=40, P5=50, P6=60, P8=80.
          Assignment 2: P2=80, P4=20, P5=40, P6=50, P8=60.

     And the boundary is fixed: P1=10, P3=30, P7=70, P9=90.

     Now, are there any constraints that might relate the inside to the outside? We haven't defined any dynamics. So both are allowed.

     Then we can say that the physical laws (whatever they are) might allow both.

     The students then see that there is freedom in the inside.

     But to connect to the first part, we then note that Assignment 1 and Assignment 2 are not the same field, but they are related by a permutation of the points in the hole. 

     However, if we consider the points to have fixed identities, then these are two different fields. But if we consider that the points are only identifiable by their field values and positions, then these are two different configurations.

     In the hole argument, the two assignments are to be considered physically distinct if we are substantivalists (believing in the reality of the points) or physically the same if we are relationalists.

     So the activity:

     - Part 1: Skip the two groups and instead give them the two models (with the swap of P5 and P6) and ask if they are the same universe. They will say no because the field values at the center and its right are swapped. Then we discuss how, if the points are not have additional identity, then they might be the same. This is relationalism vs substantivalism.

     - Part 2: The hole. We give them the boundary values and ask for an assignment for the hole. They can choose any numbers. Then we ask them to produce a second assignment by cycling the values as above. Then we ask: are these two assignments physically the same or different? 

     - Then debrief.

     Given the time and complexity, I'll provide a concrete activity plan.

     Materials for each student group:
          - A 3x3 grid.
          - A table of the field values for the boundary (for Part 2) or for the whole grid (Part 1).

     Minute-by-minute:

     - 0-5: Introduction. Explain that they will be building a universe and then try to extension inside a hole.
     - 5-15: Part 1 ( two universes ):
            Group A: receive grid with field values (full grid) for Model 1.
            Group B: receive grid with field values for Model 2 (with swap of center and right of center).
            They are to write down the field values and then compute: 
                - The value at the center.
                - The value to the right of the center.
            Then we ask: do they have the same universe? (They will say no.)
            Then we ask: if the points are only identifiable by their positions in the grid, then the grid is fixed. But if the points have an identity beyond their position, then swapping two points with their field values would be a different assignment. 
            We then introduce the idea of substantivalism: the points have an identity independent of the field values and the grid structure. So swapping the field values between two points (even if they are at different locations) changes which point has which value, and hence changes the universe if you are a substantivalist.
            relationalism: only the field values at the locations matter, so swapping field values between locations changes the universe. But note: in this swap, the field values at the locations have changed, so the universe is different for everyone. 
            This is not the hole argument. The hole argument's diffeomorphism does not change the field values at the locations; it moves the points and the field together. In our Part 1 with a fixed grid, this move changes the field values at the fixed locations.

     Given the time, we focus on the hole part.

     Revised plan: skip Part 1 and only do the hole part, then in the debrief explain the diffeomorphism and how it leaves the field values at the same locations unchanged in the continuous case but in our discrete case with fixed grid we cannot do it perfectly.

     Activity for the hole part (60 minutes):

     - 0-10: Introduction to the grid and field. We have a 3x3 grid. The field is temperature. The students will be given the field values on the boundary: 

            P1 (top-left): 10
            P3 (top-right): 30
            P7 (bottom-left): 70
            P9 (bottom-right): 90

          The inside points (P2, P4, P5, P6, P8) are unknown. This is the hole region.

     - 10-30: Construction. The students are to ascribe temperatures to the five inside points. The only constraints: 
            - The temperature must be between 0 and 100.
            - The temperature at an inside point should be within 20 of the average of its neighbors. (This is a made-up smoothness condition.)

          They work in groups to fill in the hole.

     - 30-40: Each group presents their assignment.

     - 40-50: Now, we ask them to take their assignment and apply a cycle to the values in the hole points: specifically, cycle the values: P2->P4->P5->P6->P8->P2. So if their assignment was:

            P2: a, P4: b, P5: c, P6: d, P8: e,
          then the new assignment is:
            P2: e, P4: a, P5: b, P6: c, P8: d.

          They should recompute to see if the new assignment still satisfies the smoothness condition. It might not, because the neighbors might now be different. So this is a flaw in the discrete setting.

     - 50-60: If it does not satisfy, we relax the smoothness condition or explain that in the continuous case, the smoothness is preserved by diffeomorphisms. Then we note that they now have two assignments: the original and the cycled one. The boundary is the same. 
          - If they are substantivalists, then these are two physically distinct universes.
          - But the initial data (on the boundary) are the same, and the same laws, yet the inside is not uniquely determined.

     - 60-90: Debrief.

     The debrief should cover:

          1. In the activity, the grid was a fixed background. In GR, the metric is dynamical and there is no fixed background. The hole argument is about the manifold points and the metric and matter fields on them.

          2. In the continuous case, a diffeomorphism is a smooth map that moves the points and drags the fields. It is like a reassignment of which point is where.

          3. The hole region is a spacetime region. The diffeomorphism is the identity outside the hole and non-trivial inside.

          4. The two models (related by the diffeomorphism) have the same field values (in the dragged-along sense) at the same manifold points. But if we use a coordinate system, the functional form of the fields change.

          5. Leibniz equivalence: if the two models are related by a diffeomorphism, they are physically equivalent.

          6. The indeterminism: if we are substantivalists and believe that the manifold points have an identity, then the diffeomorphism produces a physically distinct model. And since the initial data (outside the hole) are the same, we have indeterminism.

          7. The escapes: 
              a. relationalism: deny that spacetime points have an identity beyond the fields. Then the two models are the same.
              b. accept indeterminism.

          8. What the activity couldn't reproduce: 
              - The continuum: we used discrete points.
              - The diffeomorphism in the continuous case is smooth and can be the identity outside the hole. In our discrete case, we had to use a permutation which is not smooth and might not be the identity on the boundary of the hole (because the boundary points are fixed, but our hole included points adjacent to the boundary; in the cycle example, the boundary points were not touched, but the hole points were adjacent to them).
              - In the activity, the cycling might not preserve the smoothness condition, whereas in GR the field equations are diffeomorphism invariant, so if one configuration is a solution, the dragged one is too.

     Given the above, I think the activity is doable but imperfect. We must explain these in the debrief.

     Let's provide the handout for the hole part.

     Handout for the hole part:

     Universe in a 3x3 Grid

     Points and their positions:

          Row 1: P1 (10) --- P2 ( ? ) --- P3 (30)
          Row 2: P4 ( ? ) --- P5 ( ? ) --- P6 ( ? )
          Row 3: P7 (70) --- P8 ( ? ) --- P9 (90)

     The values in parentheses are given for the boundary points: P1, P3, P7, P9.
     The inside points (P2, P4, P5, P6, P8) are to be filled by you.

     Rules:

     - The temperature at any point must be between 0 and 100.
     - For any inside point, the temperature must be within 20 degrees of the average of its neighbors. 
          [Note: the neighbors are adjacent horizontally or vertically. For example, P2 has neighbors: P1, P3, P5.]

     Please assign temperatures to P2, P4, P5, P6, P8.

     After they have an assignment, we ask them to cycle the values as described.

     Then we discuss.

     This is the best I can do within the constraints.
