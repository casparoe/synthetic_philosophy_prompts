  ### Hands-On Activity: Confronting the Hole Argument  
  **Duration:** 90 minutes  
  **Participants:** 14 graduate students (split into two groups of 7).  
  **Materials:**  
  - **Grid Handout** (one per student): A 3x3 grid representing a 2D "model world" (see template below).  
  - **Point Tokens** (per group): 9 physical tokens labeled P1–P9 (e.g., laminated cards) with preassigned "properties":  
    - P1: Rocky soil  
    - P2: Magnetic field  
    - P3: Radioactive  
    - P4: High gravity  
    - P5: Volcanic  
    - P6: Frozen  
    - P7: Dense atmosphere  
    - P8: Metallic core  
    - P9: Organic compounds  
  - **Field Value Table** (unique to each group):  
    - Group A (Original):  
      | Point | Temperature (°C) | Pressure (atm) |  
      |-------|------------------|---------------|  
      | P1    | 10               | 1.0           |  
      | P2    | 20               | 1.2           |  
      | P3    | 30               | 1.4           |  
      | P4    | 40               | 1.6           |  
      | P5    | 50               | 1.8           |  
      | P6    | 60               | 2.0           |  
      | P7    | 70               | 2.2           |  
      | P8    | 80               | 2.4           |  
      | P9    | 90               | 2.6           |  
    - Group B (Diffemorphic):  
      | Point | Temperature (°C) | Pressure (atm) |  
      |-------|------------------|---------------|  
      | P1    | 10               | 1.0           |  
      | P2    | 20               | 1.2           |  
      | P3    | 30               | 1.4           |  
      | P4    | 40               | 1.6           |  
      | P5    | 60               | 2.0           |  
      | P6    | 50               | 1.8           |  
      | P7    | 70               | 2.2           |  
      | P8    | 80               | 2.4           |  
      | P9    | 90               | 2.6           |  
      *(P5 and P6 swapped)*  
  - **Rules of Engagement:**  
    1. Points are **individual entities** with intrinsic properties (e.g., "P5 is Volcanic"). These properties *never change* and distinguish points beyond coordinates.  
    2. **Physical facts** are defined by:  
       - Field values (temperature/pressure).  
       - Relations between points (e.g., "points adjacent north-south").  
       *No reference to point names (P1–P9) is allowed when stating facts.*  
    3. **Smoothness Constraint:** Field values at adjacent points (up/down/left/right) must differ by ≤25°C and ≤0.5 atm.  

  ---

  ### Timeline  
  **0–10 min: Setup and Instructions**  
  - Split into Group A and Group B.  
  - Distribute handouts, tokens, and field tables.  
  - Explain:  
    - "Each token (P1–P9) is a unique *individual* with fixed properties (e.g., P5 is *always* Volcanic)."  
    - "Assemble your model world on the grid. Assign temperatures/pressures from your table to each point."  
    - "Record field values on your handout. Adhere to the smoothness constraint."  

  **Grid Handout Template:**  
  ```
      NORTH
  WEST [P1] [P2] [P3] EAST  // Row 1
       [P4] [P5] [P6]  
       [P7] [P8] [P9]  
      SOUTH
  ```
  *Arrows indicate adjacency (e.g., P2 adjacent to P1, P3, P5).*  

  **10–30 min: Model Construction**  
  - Groups assemble models using tokens and field tables.  
  - Ensure smoothness constraint is satisfied (P5 and P6 are adjacent, so Group B must verify |60-50|≤25°C and |2.0-1.8|≤0.5 atm).  
  - **Instructor Check:** Confirm both groups have valid models.  

  **30–40 min: Fact Comparison**  
  - Groups list physical facts *without using point names*:  
    - Field values at positions (e.g., "Center: 50°C, 1.8 atm").  
    - Relations (e.g., "Point with 50°C is north of 70°C").  
    - Global properties (e.g., "Average temperature: 50°C").  
  - **Revelation:** Both groups share facts. They will match exactly (same averages, same center values, same relations).  
  - **Conflict:** When groups reveal point-specific assignments (e.g., Group A: "P5 is 50°C"; Group B: "P5 is 60°C"), they see a discrepancy.  

  **40–50 min: The "Hole" Extension**  
  - **New Task:** Fix all points *except* the interior hole (P5, P6).  
    - Boundary (P1,P2,P3,P4,P7,P8,P9) fields are locked (Group A/B values remain).  
    - Smoothness constraint still applies.  
  - Groups assign new values to P5 and P6.  
  - **Discovery:**  
    - Group A might assign P5=55°C, P6=55°C.  
    - Group B might assign P5=65°C, P6=45°C.  
    - *Both satisfy smoothness (|55-60|≤25, |55-40|≤25, etc.).*  

  **50–60 min: Group Reporting**  
  - Groups share hole assignments. Highlight:  
    - Boundary data *alone* do not determine interior (multiple solutions exist).  
    - Interior points (P5/P6) are "volcanic" or "frozen" in all cases—but their *fields* are underdetermined.  

  ---

  ### Debrief (60–90 min)  
  Map each activity step to the hole argument:  
  1. **Manifold Points:** Tokens P1–P9 represent spacetime points. Their "properties" (volcanic/frozen) are analogs of *mathematical individuality* (points exist independently of fields).  
     - *Why names felt "genuine":* Properties (e.g., "P5 is volcanic") gave points stake beyond coordinates.  

  2. **Diffeomorphism:** Group B’s swap (P5↔P6) is a discrete analog. Fields transform with points:  
     - *Activity:* Group B’s table reassigned fields to *preserve structure* (same relations/facts).  
     - *Real Argument:* A diffeomorphism is a smooth reassignment of fields to points.  

  3. **Leibniz Equivalence:**  
     - Groups produced *different* point-field assignments (P5 had 50°C in A, 60°C in B) but agreed on *all* nameless facts.  
     - *Equivalence Principle:* If two models agree on all observable (coordinate-free) facts, they describe the *same physical reality*.  

  4. **Substantivalism vs. Relationalism:**  
     - **Substantivalism:** Points are real individuals → Group A and Group B describe *distinct worlds* (since P5 "volcanic" has different fields).  
     - **Relationalism:** Only relations/fields exist → Both groups describe the *same world* (same relational facts).  

  5. **Indeterminism:**  
     - In the hole extension, boundary data failed to determine interior fields.  
     - *Analogy:* In GR, Einstein realized field equations + initial data *cannot* determine metrics inside a "hole" if points are substantival.  

  #### Two Escapes and Their Costs:  
  - **Relationalism:** Deny point individuality.  
    - *Cost:* Abandon "substantival space/time" (points are just bookkeeping).  
  - **Substantivalism + Indeterminism:** Accept that physics cannot uniquely determine fields.  
    - *Cost:* Violates determinism (multiple futures from same initial data).  

  #### Limitations of the Activity:  
  1. **The Continuum:**  
     - Real spacetime is continuous; smooth diffeomorphisms are possible. Our discrete grid permitted only coarse permutations.  
     - *Verbal Supply:* "In the continuum, diffeomorphisms are smooth and map neighborhoods perfectly—our swap was a crude approximation."  

  2. **Freedom from Field Equations, Not Rules:**  
     - Our "smoothness constraint" was arbitrary. In GR, indeterminism arises *from the field equations themselves* (which are diffeomorphism-invariant).  
     - *Verbal Supply:* "General relativity’s equations permit infinitely many solutions in the hole, all consistent with fixed boundaries. Our activity’s rules were imposed externally, not derived from physics."  

  #### Why This Works:  
  - **Point Individuality:** Properties (volcanic/frozen) made names "sticky," preventing students from dismissing them as arbitrary.  
  - **Discovery-Based:** Students built models, saw equivalence in facts but not assignments, and experienced indeterminism firsthand—without advanced math.
