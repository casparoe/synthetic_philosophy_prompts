prompt: |-
  I work on animal-welfare policy, and in a recent internal discussion a colleague argued that we should extend legal protection and husbandry standards far down the phylogenetic scale — to decapods, to insects, and on some accounts further still — by borrowing the smoke-detector principle from evolutionary medicine and anxiety research. His reasoning: a detector that cries fire at burnt toast is a trivial nuisance, while a detector that stays silent through a real fire is a catastrophe, so the rational setting is a very low threshold; likewise, wrongly granting moral standing to a creature that feels nothing costs us almost nothing, whereas wrongly withholding it from a creature that suffers costs that creature everything, so the evidential bar for sentience should be set very low. He also insists he is a gradualist: consciousness comes in degrees, shading off toward the thermostat, rather than switching on at some taxonomic rung.

  I am not persuaded the two commitments fit, and I want a careful audit of the analogy rather than a survey of the sentience debate. Please do the following.

  1. Give the mapping explicitly, ideally as a compact table: what plays the role of the detector, the smoke, the fire, the alarm, the cost of a false alarm, the cost of a missed fire, and the threshold-setting decision. Where a slot has more than one plausible candidate in the target case, flag it.
  2. Separate the disanalogies that actually threaten the intended use from those that are merely decorative. I am especially interested in whether a device with a binary output is the right model for a property my colleague describes as graded, and what becomes of the argument if the "fire" is itself a matter of degree rather than an event.
  3. State what the analogy quietly assumes and the target case lacks — for instance, calibration against known positives, a stable base rate, false-alarm costs that are bounded and borne by whoever sets the threshold, and an alarm that can be switched off once it has gone off.
  4. Rule on the conclusion. Does extending protection far down the scale survive the disanalogies, survive in a weaker form, or was it being carried by the analogy all along? If the case for a low threshold is better made without the detector picture, say what carries it.
  5. Offer a better analogy for moral-status attribution under this kind of uncertainty, if one exists, and say what work it does that the smoke detector cannot.

  Keep the whole response to 700 words or fewer, table included. No background on the literature, no citations, no recommendations for further reading — just the audit.
reasoning: |-
  Hmm, the user works in animal welfare policy and needs me to analyze an analogy their colleague proposed. The colleague is using the smoke detector principle to argue for extending legal protections to lower animals like insects, claiming we should set a low threshold for sentience evidence to avoid catastrophic errors. The user wants a focused audit of this analogy without getting into the sentience debate itself.

  I need to break this down systematically. First, I should create a clear mapping table showing how each element of the smoke detector analogy corresponds to the moral status attribution scenario. The detector would be the sentience assessment framework, smoke would be behavioral indicators, fire would be actual sentience, and so on. I notice several elements have multiple plausible mappings - like the alarm could be either policy action or moral concern, and costs could be borne by different parties.

  The key disanalogies to examine are: the binary nature of smoke detectors versus the gradualist view of consciousness, the fact that "fire" (sentience) might be a matter of degree rather than presence/absence, and the lack of calibration mechanisms in the moral case. Unlike smoke detectors that can be tested against real fires, we can't definitively confirm sentience. Also, while false alarms in smoke detectors are temporary annoyances, granting moral status mistakenly could have cumulative societal costs that are hard to reverse.

  For the conclusion, while the analogy usefully highlights error asymmetry, it oversimplifies the problem. The case for low thresholds stands better on direct ethical grounds - the precautionary principle applied to potential suffering - without needing this imperfect analogy. A better comparison might be Pascal's Wager about believing in God, which similarly deals with uncertainty and asymmetric risks, though it has its own flaws like assuming finite costs.

  I'll structure my response clearly: first the mapping table, then analysis of critical disanalogies, followed by what's missing in the analogy, then a ruling on the conclusion, and finally suggesting an alternative analogy if applicable. I'll keep it under 700 words as requested, focusing only on the logical audit without citations or background.
answer: |-
  ### 1. Mapping Table
  | **Smoke Detector Element** | **Moral Status Attribution** | **Ambiguity Notes** |
  |----------------------------|------------------------------|---------------------|
  | **Detector**               | Framework for assessing sentience (e.g., neuroscientific/behavioral criteria) | |
  | **Smoke**                  | Observable proxies for sentience (e.g., nociception, stress behaviors) | |
  | **Fire**                   | Actual capacity for suffering (sentience/phenomenal consciousness) | |
  | **Alarm**                  | Policy action (e.g., granting protections) **or** Moral concern attribution | *Dual role: Practical vs. psychological* |
  | **False Alarm Cost**       | Resource expenditure, regulatory burden, opportunity costs for humans | *Costs are distributed, chronic, and potentially unbounded* |
  | **Missed Fire Cost**       | Unmitigated suffering of the unprotected creature | |
  | **Threshold Setting**      | Deciding the evidential standard for sentience | |
  | **Calibration Input**      | Known fires (confirmed sentience cases) | *Lacks reliable "known positives" for calibration* |

  ### 2. Critical Disanalogies
  - **Binary vs. Graded Output:** The detector’s binary alarm (on/off) clashes with the colleague's gradualist view. Granting "moral standing" is typically all-or-nothing in policy (e.g., legal protections), while consciousness is framed as a continuum. The analogy forces a binary decision point onto a spectrum, risking misalignment.
  - **Graded "Fire":** If suffering is a matter of degree (not just presence/absence), the cost asymmetry changes. A "missed fire" for a minimally sentient entity (e.g., an insect) may impose less suffering than for a highly sentient one (e.g., a mammal), undermining the "costs everything" claim. False alarm costs might scale with the degree of protection granted.
  - **Cost Structure:** False alarm costs in detectors are bounded/localized (e.g., silencing a beep). In policy, costs are systemic (ongoing compliance, research, enforcement), potentially escalating with scale, and borne by society/unprotected animals, not just the threshold-setter. Missed fires cost the creature; false alarms don’t *only* cost "us" trivially.

  ### 3. What the Analogy Assumes (and Lacks)
  - **Calibration:** Detectors are tested against known fires. We lack definitive sentience benchmarks in ambiguous cases (e.g., insects), making threshold-setting arbitrary, not evidence-based.
  - **Stable Base Rate:** Detectors assume a predictable fire likelihood. The "base rate" of sentience across phylogeny is unknown and contested.
  - **Bounded/Amortizable Costs:** A detector’s false alarm is transient and cheap. Policy protections are persistent commitments; costs compound and may divert resources from higher-welfare interventions.
  - **Alarm Deactivation:** A detector alarm can be reset. Legal protections, once granted, are politically difficult to revoke.

  ### 4. Ruling on the Conclusion
  The conclusion **survives in a weaker form** but is **not carried by the analogy**. The core ethical intuition—prioritizing avoidance of catastrophic suffering over minor resource costs—is defensible via the **precautionary principle** applied to suffering risks. However, the smoke-detector analogy:
  - Overstates the asymmetry (ignoring graded costs/sentience).
  - Obscures systemic costs and calibration challenges.
  - Implies a false precision in threshold-setting.
  The case for a low threshold is stronger when made directly: where plausible indicators of suffering exist, erring toward protection minimizes potential moral catastrophe, provided costs are manageable.

  ### 5. A Better Analogy: **Pascal’s Wager for Suffering**
  - **Mapping:** Wagering on belief in God → Wagering on attributing moral status. Infinite gain (avoiding hell) → Avoiding infinite-seeming suffering. Finite cost (religious practice) → Finite resource costs.
  - **Advantages over Smoke Detector:**
    - Explicitly handles radical uncertainty (unknowable "truth").
    - Accepts that the "stakes" (suffering) drive the decision more than evidence thresholds.
    - Acknowledges the psychological/practical commitment akin to faith.
  - **Limitations:** Still assumes suffering is binary/infinite (a flaw if sentience is graded). Doesn't resolve cost trade-offs between protections.
