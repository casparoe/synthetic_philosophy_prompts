  First, their three categories: *curatorial* (Plutarch), *devotional* (hagiography), *forensic* (modern). Does this hold? Partly. Plutarch isn't neutral—he explicitly moralizes—but his curation is about selective *imitation*, not judgment. The reader is a shopper in a moral marketplace. Hagiography isn't flattening; it transfigures flaws into grace's theater. The forensic mode *is* verdict-driven, turning readers into jurors. But the user's right to sense overlap: both Plutarch and hagiographers moralize, but Plutarch's reader chooses virtues to emulate, while the saint's life demands surrender to divine logic. 

  Where Plutarch resists "curatorial": his fascination with trivial moments (Alexander weeping over Achilles' tomb) isn't random curation—it reveals *ethos*, the subject's moral core. Flaws aren't excised but framed as pedagogical tools. Hagiography, meanwhile, doesn't erase flaws; it makes them proof of grace's power (Augustine's lust becomes the furnace for his conversion). Character isn't psychology but will transformed. 

  Now the user's real need: What died when the forensic took over? The curatorial and devotional modes assumed readers were *agents in their own moral formation*. Forensic biography assumes readers are passive jurors awaiting evidence to condemn or acquit. The narrator's genre could be a fourth thing: *restorative* biography. Not verdict (forensic), not menu (curatorial), not divine cipher (devotional), but an archaeology of ambiguity—showing how flaws and virtues cohere in a singular human texture. The poet's letters aren't sins to contextualize but fractures where his art and pain bled together. The reader isn't judge, student, or worshipper but a witness to irreducible contradiction. 

  Final paragraph must be sharp: Forensic biography's triumph sacrificed the reader's moral agency. It replaced active self-reflection (Plutarch) or transformative witness (hagiography) with passive judgment. Your narrator might forge a mode where flaws aren't defects but seams in the poet's vision—the reader sits not in court but at a bedside, holding the wound and the pen that made art from it.
answer: |-
  Your three-way distinction holds as a productive framework, though Plutarch challenges "curatorial" neutrality and hagiography demands more than flattening. Here's the pressure test:

  **Plutarch ("Curatorial" with Teeth):**
  Plutarch absolutely moralizes, but his aim isn't judgment *of the subject* for its own sake; it's the reader's *edification*. Flaws aren't catalogued forensically to condemn, nor erased devotionally to sanctify. They are crucial exhibits in the moral museum. Alexander's drunken rage or Caesar's ambition aren't hidden; they are presented alongside their virtues as *equally instructive material*. The reader isn't a passive juror but an active *shopper*, urged to pick virtues to emulate and flaws to avoid. The "tiny throwaway incidents" are key because Plutarch believes character reveals itself in the mundane, offering the most practical lessons. His moralizing *is* the curation – he highlights specific flaws and virtues precisely to guide the reader's selection. He resists pure neutrality not by judging his subjects finally, but by insisting their lives *must* be used for the reader's moral calibration. The mirror isn't passive; Plutarch adjusts its angle to show you what *you* need to see in yourself.

  **Hagiography (Devotional Transmutation):**
  Hagiography doesn't "flatten" character in the sense of making it simplistic; it fundamentally *redefines* it. Character isn't a static collection of virtues and vices to be assessed (Plutarch) or judged (forensic). It's a dynamic narrative of *grace acting upon a will*. Flaws aren't mere defects to be weighed or hidden; they are the raw material *for* divine transformation. The persecutor (Paul) *must* be fierce before conversion to demonstrate grace's power. The vain or lustful saint *must* struggle mightily to show the arduous path of sanctification. The flaw isn't negated; it's *redeemed* through its overcoming or its role in the saint's ultimate trajectory towards God. The reader isn't asked to emulate isolated virtues (Plutarch) or render a verdict (forensic). They are summoned to *witness the power of grace*, to be converted (or reconfirmed) in their faith by seeing how God works through, and despite, human frailty. The saint is a window to the divine, and their flaws are smudges on the glass that paradoxically make the light more visible by showing its transformative effect.

  **The Forensic Stance (What Was Lost):**
  The modern forensic stance fundamentally shifts the reader's position and purpose. Where Plutarch asked "What can *you* learn *from* this life?" and hagiography asked "Do you *believe* in the power revealed *through* this life?", the forensic asks "What is your *verdict* *on* this life?" The reader becomes a juror, the biography an evidentiary dossier. Flaws are ammunition for prosecution or mitigation for the defense. The estate's demand to "contextualize" is verdict management – damage control for the jury's judgment. This displaces the reader's *self* from the center. Plutarch required active self-reflection against the subject; hagiography demanded self-surrender/submission to the divine narrative witnessed *in* the subject. The forensic asks only for a judgment *about* the subject. The reader's moral agency, their capacity for internal change through engagement with the life, is sidelined. The biography becomes less about transformation (of reader or subject) and more about assessment.

  **Your Narrator's Potential Fourth Genre:**
  The forensic mode's dominance sacrificed the reader's *active moral engagement* with the life as a tool for their own formation or conversion. Your narrator, wrestling with the poet's damning letters against the estate's pressure, might be groping towards a **testimonial** genre. This isn't verdict, curation, or devotion. It’s bearing witness to the *entire, contradictory* human texture – the flawed man *and* the sublime poet coexisting. The reader isn't juror, shopper, or devotee, but a *witness* to irreducible complexity. Flaws aren't contextualized away, weighed for judgment, or redeemed; they stand as part of the testimony, challenging simple conclusions. The profit isn't self-improvement, faith, or judgment, but a deeper, unsettled *understanding* of human ambiguity itself. Her genre could be the unflinching record of one consciousness grappling with another's messy truth.
