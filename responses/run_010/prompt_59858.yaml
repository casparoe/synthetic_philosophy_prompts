answer: |-
  ## The Orsbeckite Conundrum

  **Setting:** A worn oak table in a university common room, coffee cups steaming.

  **Characters:**
  *   **Marcus (Kripkean):** Intense, gestures firmly with his pen. Believes in direct reference and metaphysical necessity grounded in rigid designation.
  *   **Thea (Two-Dimensionalist):** Calmly analytical, fingers steepled. Focuses on epistemic possibilities and the dual roles of intension.

  **(Thea pushes a paper towards Marcus detailing the Orsbeckite case.)**

  **Thea:** Consider this, Marcus. Orsbeckite. Named in 1872 for the pale green mineral at Orsbeck quarry. A century later, crystallography reveals two distinct minerals: Abundantite (found *only* at Orsbeck in large quantities) and Rarite (scarce at Orsbeck, found elsewhere). The dominant identification became "Orsbeckite is Abundantite." Is "Orsbeckite = Abundantite" a necessary *a posteriori* truth? Your rigid designation seems to stumble at the starting gate. What *was* rigidly designated in 1872?

  **Marcus:** (Leans forward) The initial use was messy, granted. But the *practice* fixes reference. They pointed at samples in the quarry, intending to name *that kind* of pale green mineral they were consistently extracting. Crucially, the vast *majority* of those samples were Abundantite. The community’s use latched onto the dominant kind present in the baptismal samples. "Orsbeckite" rigidly designates Abundantite *because* that’s what the term, through its causal-historical chain originating in those quarry samples, picks out in all possible worlds. The later discovery clarified *which* kind that was. "Orsbeckite is Abundantite" is therefore necessary – if Abundantite exists, it *is* Orsbeckite – and we discovered it empirically. The necessity survives; it was always true once reference was fixed, we just didn't know *which* mineral fulfilled the role.

  **Thea:** Ah, but *did* reference fix solely on Abundantite? The baptismal samples were a *mixture*. The geologist *thought* it was one kind, but it wasn't. When she said "that" pointing to a sample, sometimes it *was* Abundantite, sometimes Rarite. The concept she associated – "the pale green mineral from Orsbeck quarry" – could be satisfied by *either* mineral in different possible worlds. *That* is the primary intension. It captures the epistemic possibilities open to the speaker at the time. She could coherently think, "Orsbeckite might not be the *only* mineral here," or "Maybe what I call Orsbeckite exists elsewhere but looks different." The primary intension is contingent; it picks out whatever fits that descriptive role in a given world.

  **Marcus:** You're smuggling in description when we have direct ostension! They weren't naming a *description* like "the unique pale green mineral," they were naming *the stuff* they were pointing to. The fact that they mistakenly thought it was homogeneous doesn't change what the pointing was *actually* directed at: lumps of matter, most of which were Abundantite. Reference isn't hostage to perfect knowledge. The causal chain originates with *those specific chunks*, which were predominantly Abundantite. The community's subsequent use reinforced this, solidifying the reference to Abundantite. Your "primary intension" is just a record of their *ignorance*, not the real modal status of the identity.

  **Thea:** But Marcus, what *is* "the stuff"? In the *actual* baptism, "the stuff" was ambiguous. If we run the primary intension – consider a world where the quarry contained only Rarite, easily mistaken for Abundantite in 1872. In *that* world, the term "Orsbeckite," used with the *same* ostensive act and associated concept ("that pale green mineral here"), would refer to Rarite. That’s the contingency. The secondary intension, *given* that in our world the dominant samples fixed the reference to Abundantite, then rigidly designates Abundantite across worlds. *That's* the necessity you see. But it’s a consequence of how reference settled in *this* world, not a deep metaphysical necessity inherent from the baptism itself. The substantive discovery was contingent: *which* mineral was abundant and fulfilled the role. The necessity is bookkeeping.

  **Marcus:** You're rewriting history! The community *didn't* quietly fix reference *after* the discovery; they *recognized* what they had *always* been referring to – the abundant mineral they’d been mining and calling Orsbeckite for a century. The Rarite samples were misidentified *as* Orsbeckite precisely because the term already referred to Abundantite! The discovery revealed that some samples *weren't* Orsbeckite, not that Orsbeckite wasn't Abundantite. There was no "quiet fixing," just epistemic correction. The necessity is robust.

  **Thea:** Then why the debate? Why wasn't it immediately obvious? Because the primary intension *didn't* uniquely pick out Abundantite *before* the crystallography. It picked out whatever satisfied the apparent role in the quarry. Post-discovery, the scientific community *stipulated* that "Orsbeckite" would henceforth rigidly designate Abundantite. That's a reference-fixing decision *based* on the new evidence, leveraging the dominant samples. But it *was* a decision. They could have, though they didn't, decided "Orsbeckite" referred to the *first* sample ever pulled, which might have been Rarite! Your "always" is retrospective. The cost for me? My primary intension doesn't magically "pick" Abundantite *over* Rarite in the actual world *prior* to the scientific decision. It picks out the mineral(s) satisfying the initial concept – a disjunction, or an ambiguous cluster. The discovery resolved that ambiguity, collapsing the primary intension onto Abundantite *in practice* and establishing the rigid secondary intension. The necessity of "Orsbeckite = Abundantite" stems from this *resolution*, not from an infallible initial baptism.

  **Marcus:** A disjunction? That's reference failure! Or ambiguity resolved by usage. And usage overwhelmingly pointed to Abundantite *from the start*, even if they didn't know it. The necessity isn't retrospective; it's constitutive of singular reference. When you name a natural kind via ostension of samples, you *ipso facto* rigidly designate the kind constituting the *majority* of those samples, barring evidence of equivocation. There *was* no real equivocation here; they intended one name for one kind, they just had bad samples mixed in. The Rarite was an interloper, not a co-referent.

  **Thea:** Intention isn't magic, Marcus. Bad samples *create* equivocation. Your reliance on "the majority" is pragmatic, not purely metaphysical. It saved the reference in this case, but it highlights how the *fixing* of the rigid designator depends on contingent features of the world (the abundance ratio) and our subsequent epistemic practices. The *metaphysical* necessity you prize emerges *from* this contingent process of disambiguation and scientific refinement. The primary intension captures the genuine contingency present *at the origin*. The secondary intension's necessity is real, but it's a product of how things settled, not a revelation of a pre-existing, hidden necessity untouched by our epistemic journey.

  **Marcus:** (Sighs, tapping the paper) So, for you, the deep truth is that "Orsbeckite might not have been Abundantite," meaning we might have resolved the ambiguity differently, or the quarry mix might have been different?

  **Thea:** Precisely. That’s the contentful modal claim captured by the primary intension. The secondary intension necessity, "Orsbeckite is necessarily Abundantite (if it exists)," is true, but its *significance* relies on the contingent fact that *this* is how the reference was fixed in our world.

  **Marcus:** And for me, that primary intension is just a shadow of ignorance. The deep metaphysical truth is that once the causal chain anchored mostly to Abundantite – which it did from the first day, despite the noise – "Orsbeckite = Abundantite" was locked in as necessary. The contingency was only ever in our *heads*, not in the world's modal structure. We discovered the world’s own necessary connection.

  **Thea:** And I say that "anchor" was only secured *through* the contingent process of discovery and community agreement. The world's modal structure includes the possibility that the messy baptism could have led to a different rigid designatum.

  **(They both sip their coffee, the unresolved tension hanging in the air like mineral dust.)**
