  ### Poem: *Storage*  
  Someone asked at dinner how we met. I smiled.  
  It was the summer I moved back from the coast.  
  &nbsp;&nbsp;&nbsp;&nbsp;Nineteen sixty-eight, you always said.  
  And I was staying with my brother then.  
  &nbsp;&nbsp;&nbsp;&nbsp;At his place on Elm, the one with the blue door.  
  He dragged me out one night to meet some people.  
  &nbsp;&nbsp;&nbsp;&nbsp;Because you hid in your books, he said.  
  And that’s where I saw you across the room.  
  &nbsp;&nbsp;&nbsp;&nbsp;At the Community Hall dance, remember?  
  With the band that played too loud and the sticky floor.  
  &nbsp;&nbsp;&nbsp;&nbsp;You wore that green dress, the one you loved.  
  Your cousin introduced us, what was her name?  
  &nbsp;&nbsp;&nbsp;&nbsp;Marie. My cousin Marie from the city.  
  She knew my brother, or was it through work?  
  &nbsp;&nbsp;&nbsp;&nbsp;She worked with your brother at the factory.  
  Anyway, she brought you over and we talked.  
  &nbsp;&nbsp;&nbsp;&nbsp;About the heat wave and the broken fan.  
  And then I asked if I could take you home.  
  &nbsp;&nbsp;&nbsp;&nbsp;You said you lived just three blocks away.  
  And then...  
  We walked back to your place, I remember that.  
  The church social had run late that night.  
  And you were wearing something bright and light.  
  Or was it dark? No, light, because the moon.  
  You talked about the library where you worked.  
  I listened, but I was watching your face.  
  The street was quiet, just our steps and voices.  
  And when we reached your door, you turned and smiled.  
  I asked if I could see you again next week.  
  You said, Call me tomorrow, Tom. I did.  
  Called the next day, and every day that summer.  
  The summer of sixty-nine, that was the one.  
  &nbsp;&nbsp;&nbsp;&nbsp;Nineteen sixty-nine. The year we met.  

