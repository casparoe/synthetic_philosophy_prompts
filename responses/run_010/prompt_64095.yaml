answer: |-
  Here is the translation of Aristotle's claims into your craft vocabulary, followed by the residue analysis:

  **Translation: Aristotle in Novelist's Terms**  
  1. **Need binds exchange**: The scene exists because characters have unmet needs. Their desires (wants) create the leverage for negotiation. Money is a *convention*—a token the characters agree has value to mediate their needs. It holds no intrinsic power; it’s a tool of the *nomos* (the agreed-upon rules of their world).  

  2. **Money as pledge**: Money is a placeholder for future need—a stored claim on unmet desire. Its worth shifts with the appetite of those holding it or the leverage of those demanding it.  

  3. **Commensurability through need**: Objects/desires are fundamentally incomparable (a family heirloom vs. sacks of grain). But mutual need forces a *practical equivalence*: "What will you trade to satisfy my want right now?" Precision is sacrificed for the transaction’s urgency.  

  4. **Proportionate exchange between unequals**: When a farmer, shoemaker, and builder trade, their relative leverage isn’t equal. The shoemaker’s shoes are worth *more* to the barefoot farmer than to the shoemaker. Money equalizes by quantifying *what each stands to lose or gain* based on their unique stakes. The city (community) survives by honoring this imbalance—requital isn’t "equal" but calibrated to what each party values.  

  5. **Household management vs. money-making**: Managing resources for sustenance (household) is driven by *need*. Retail trade is leverage-play: extracting value from another’s want. Lending at interest is pure power transaction—creating "offspring" (profit) from leverage alone, detached from any object of desire or need.  

  ---

  **Residue Report**  

  **1. Clean Translations (No Distortion)**  
  - **Need as the engine of exchange**: Aligns perfectly with "what a character wants vs. needs." Mutual unmet needs create the scene.  
  - **Money as conventional token**: Fits "symbolic weight of an object worth something other than itself." Money is a weighted symbol set by *nomos*.  
  - **Money as pledge against future need**: Mirrors "stakes" and "debt as engine of plot." A promise of future leverage.  
  - **Lending at interest as unnatural**: Translates cleanly to "transaction detached from need or affection"—pure leverage.  

  **2. Survives with Visible Distortion**  
  - **Commensurability through need**: *Distortion*: Your vocabulary accepts "practical equivalence" (what a thing is worth *to the holder*), but Aristotle’s "incomparable things made commensurate" implies a *shared social truth* beyond individual appetite. Your frame reduces this to subjective desire; his requires a collective suspension of disbelief in value.  
  - **Proportionate requital for unequals**: *Distortion*: Your "leverage" captures who has power in a scene, but Aristotle’s "cross-ratio" (farmer/shoemaker/builder) relies on *fixed social roles* defining inherent worth. Your vocabulary dynamizes leverage ("what they will trade"); his assumes static value from function. The "city held together by proportion" becomes "community sustained by negotiated leverage" — losing his ideal of organic balance.  

  **3. No Expression in Your Vocabulary**  
  - **Fairness/Justice in Exchange**: Aristotle’s core concern—whether terms *should* be proportionate—has no correlate. Your toolkit asks "What can they get?" not "What *ought* they get?" The farmer/shoemaker exchange is narratively rendered as leverage and stakes, not ethical balance.  
  - **Money as Abstract Measure of Need**: Aristotle’s money *quantifies need itself*, not just desire. Your vocabulary expresses "what a thing is worth to the holder," but not the idea that money *objectifies* need into a communal standard.  

  ---

  **Diagnosis of Residue**  
  1. **Indictment of Your Vocabulary**: It lacks a framework for **fairness**. You can depict the *leverage* driving unequal exchanges (e.g., a debtor exploited by a lender) but not the independent moral question: "Was this exchange just?" Aristotle’s residue reveals your toolkit is **descriptive** (how power *works*) not **prescriptive** (how it *should* work). In your novel, fairness is inert because your language renders ethics as aesthetics: "unfair" terms are just *higher stakes* or *sharper leverage*.  

  2. **Indictment of Aristotle’s Account**: His "need" is doing heavy metaphysical lifting. Your vocabulary exposes that:  
     - His "proportion" between builder/shoemaker isn’t a theory of price—it’s a metaphor for social harmony. Pressed into economics, it collapses.  
     - "Need" in craft terms is actionable (a character *acts* on unmet need). Aristotle’s need is almost Platonic—an abstract force binding society. Money "decorates" this ideal but doesn’t explain *how* appetite and leverage resolve in practice.  

  **Conclusion for Your Novel**: Your observation—that fairness does no narrative work—is an **accurate report on the material**, not poverty of toolkit. Stories run on desire, leverage, and consequence; fairness is a verdict applied after the action. Aristotle’s ethics imports an external standard (social harmony/natural order) foreign to the engine of plot. In your bequest/debt novel, the *leverage* of the old debt and the *appetite* for the bequest are the gears turning the story. Asking "Were the terms fair?" is critique, not catalyst. Your vocabulary captures what *moves*; his captures what *anchors*. Neither is deficient—they measure different things.
