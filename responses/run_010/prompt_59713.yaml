  Okay, the user is a philosophy professor working on a reply to a referee report about supererogation. The key phrase is "above and beyond the call of duty," which the referee argues is ambiguous and causes problems in the paper. The professor wants a disambiguation of the phrase into distinct possible claims, ordered from most deflationary to most radical. 

  First, I need to unpack all possible meanings packed into this phrase. The referee points out two tensions: between the act being better than alternatives yet not required, and between moral requirement vs. source-relative duty. There's also the graduate student's metaphor about "call" implying a specific source like a role or contract. 

  For the brainstorming pass, I consider:
  - Is "duty" absolute moral requirement or role-relative?
  - What does "above" mean - scalar superiority or crossing a threshold?
  - Is omission merely permissible or actually praiseworthy?
  - Does "call" imply an issuer or is it decorative?
  - How costly must the act be?
  - Is the permission agent-relative?

  Now structuring the menu entries from least to most demanding:

  The most deflationary reading would be that the act exceeds some minimal standard but isn't required - almost trivial. Then progressively adding elements: making it praiseworthy but not obligatory, then requiring significant sacrifice, then introducing scalar superiority over alternatives. The role-relative reading from the grad student would be separate - here duty is defined by a specific source rather than morality overall. The strongest reading would claim such acts reveal morality's structure by showing obligations have limits.

  For each entry I'll provide: 
  1) A plain statement
  2) Explicit formulation covering domain, comparisons, thresholds, permissions, blame, costs, "call" meaning, and whether it's about obligation or praise
  3) Verdict (trivial/substantive/false) with brief reasoning
  4) Assessment of whether it can bear the weight in the argument

  After the menu, I'll address:
  - Which reading people probably intend (likely the sacrifice-based one)
  - Which the referee attacks (probably the strong scalar version)
  - Whether the grad student's view is new (yes, adding it as entry 5)
  - Which reading to adopt for revision (the threshold-based with sacrifice - substantive but defensible)

  The recommendation will be to use reading 4 in revision, as it marks a clear category with minimal theoretical baggage while surviving the referee's objection by not making strong scalar claims.
answer: |-
  Here is the disambiguation menu for "above and beyond the call of duty," ordered from most deflationary to most radical. The graduate student's suggestion generates a distinct entry (Reading 5). Each entry follows the requested structure.

  ---

  **Menu of Readings**

  1.  **Deflationary Threshold Exceedance**
      1.  *Plain claim*: The act surpasses the minimum standard of what is morally required, but omitting it is not blameworthy.
      2.  *Explicit formulation*: The domain is minimally permissible acts; "above" means exceeding a baseline threshold of adequacy; "beyond" is threshold-relative; permission to omit is agent-relative (for *this* agent); omission is blameless; no inherent cost/risk/sacrifice implied; "duty" is a synonym for core moral requirement; the claim is about obligation exceeding a bare minimum.
      3.  *Verdict*: **Trivial**. It merely notes that moral adequacy has degrees, which is uncontroversial, but fails to capture the distinctiveness of supererogation as something *especially* good and non-obligatory.
      4.  *Weight-bearing assessment*: Too weak. It defines a vast category (most morally adequate acts exceed the minimum) and offers no stable target for demandingness objections, which typically concern significant sacrifice. The referee's charge doesn't land because the "better" claim is minimal, but it fails to mark a non-trivial category.

  2.  **Praiseworthy Non-Requirement**
      1.  *Plain claim*: Omitting the act is permissible and not blameworthy, but performing it is morally praiseworthy.
      2.  *Explicit formulation*: The domain is all acts open to the agent; "above" means eliciting praise/esteem; "beyond" is threshold-relative (crossing into praiseworthiness); permission to omit is agent-neutral (omission is okay for anyone); omission is blameless; cost/risk/sacrifice may be typical but not necessary; "duty" is moral requirement; the claim shifts focus from obligation to desert of praise.
      3.  *Verdict*: **Substantive but defensible**. It makes a non-trivial claim about praiseworthiness decoupled from obligation, fitting common intuitions about heroic acts. It avoids directly asserting the act is *morally better* than permissible alternatives.
      4.  *Weight-bearing assessment*: Moderately stable. It marks a clear category (praiseworthy non-obligatory acts). It partly survives the referee's charge: the "better" aspect (praiseworthiness) doesn't obviously conflict with permission, as praise concerns reactions, not requirement. However, demandingness objections target *requirement*, so this reading might not directly engage them.

  3.  **Significant Sacrifice Beyond Requirement**
      1.  *Plain claim*: The act involves significant cost/risk/sacrifice for the agent and is morally good, but not doing it is permissible.
      2.  *Explicit formulation*: The domain is costly acts; "above" means involving substantial sacrifice; "beyond" is threshold-relative (crossing a sacrifice threshold); permission to omit is agent-relative (considering *this* agent's costs); omission is blameless; cost/risk/sacrifice is definitional; "duty" is moral requirement; the claim focuses on the cost-exemption from obligation.
      3.  *Verdict*: **Substantive but defensible**. It captures a core intuition about supererogation involving sacrifice exempting the act from being required, without making strong claims about it being *better* than all permissible alternatives lacking sacrifice.
      4.  *Weight-bearing assessment*: Highly stable for demandingness objections. It defines the relevant category (costly non-obligatory goods) that objections target. It survives the referee's charge: the "better" aspect is secondary (it's *good enough* to be praiseworthy given cost) and doesn't conflict with permission, as the cost *grounds* the permission. The comparison is weak.

  4.  **Scalar Superiority with Exemption**
      1.  *Plain claim*: The act is morally better than every permissible alternative open to the agent, yet performing it is not obligatory.
      2.  *Explicit formulation*: The domain is all alternatives open to the agent; "above" means scalar superiority (better than each alternative); "beyond" implies surpassing a requirement threshold; permission to omit is agent-relative; omission is blameless; cost/risk/sacrifice is typical but not necessary; "duty" is moral requirement; the claim is about obligation admitting an option between morally unequal acts.
      3.  *Verdict*: **Substantive but highly contestable/false under many theories**. It directly asserts the paradox the referee identifies: if an act is *best* and uniquely optimal, how can omitting it be permissible? It conflicts with maximizing act-consequentialism and strong versions of beneficence.
      4.  *Weight-bearing assessment*: Unstable under the referee's charge. The scalar "better" claim ("above") and the permission ("beyond duty") *do* pull against each other. This reading cannot bear the weight as a fixed point; it *is* the contested claim demandingness objections often challenge.

  5.  **Source-Relative Exceedance (Grad Student's Suggestion)**
      1.  *Plain claim*: The act exceeds the demands specified by a particular role, code, contract, or person ("the call"), while being morally good or even required all-things-considered (ATC).
      2.  *Explicit formulation*: The domain is the demands of a specific source (S); "above" means exceeding S's requirements; "beyond" is threshold-relative to S's demands; permission *by S's standards* to omit is implied, but ATC it might be required; omission may be blameworthy ATC; cost/risk/sacrifice may be present; "call" is literal (a summons from S); "duty" is relativized to S; the claim is about exceeding role-bound obligations, not necessarily about ATC supererogation.
      3.  *Verdict*: **Substantive and defensible as a distinct concept**. It avoids the core paradox by relativizing "duty." However, it does not necessarily describe ATC supererogation; the act could be ATC obligatory.
      4.  *Weight-bearing assessment*: Unstable *for the original purpose*. It marks a category (exceeding source-relative duty), but this is *not* the category of ATC supererogation your paper likely needs (non-required ATC moral goodness). The referee's charge doesn't apply cleanly, as "duty" isn't ATC. However, using this reading conflates source-relative exceedance with ATC supererogation, which is likely the mismatch the referee senses.

  6.  **Revelatory of Moral Structure**
      1.  *Plain claim*: The existence of such acts demonstrates that moral obligation has an inherent limit or optional zone, revealing a fundamental feature of morality's structure.
      2.  *Explicit formulation*: The domain is moral theory itself; "above" implies an optional higher tier of value; "beyond" marks a structural boundary of requirement; permission to omit is a necessary feature of morality; omission is blameless; cost is often illustrative; "duty" represents the boundary of the obligatory; the claim is a meta-claim about the nature of obligation.
      3.  *Verdict*: **Radical and highly contestable**. It asserts that morality *must* have a supererogatory space, which is denied by theories where optimific acts are required (e.g., act-consequentialism) or where all value is captured by duty (some deontologies).
      4.  *Weight-bearing assessment*: Cannot serve as a fixed point; it *is* the substantive (and disputed) philosophical thesis about demandingness. The referee's charge is bypassed only by making the phrase assert this strong thesis directly, which is question-begging in this context.

  ---

  **What I should say in the reply:**

  1.  **Common Intended Reading:** People most often intend **Reading 3 (Significant Sacrifice Beyond Requirement)**. This fits the paradigmatic examples (heroic rescue, large donations) and emphasizes the cost element that makes non-requirement plausible.
  2.  **Referee's Target:** The referee is primarily attacking **Reading 4 (Scalar Superiority with Exemption)**, where the tension between being "better" (scalar best) and "not required" is most acute and theoretically problematic. They likely see traces of Reading 4 in your arguments.
  3.  **Grad Student's Reading:** This is **a genuinely additional reading (Reading 5 - Source-Relative Exceedance)**, not reducible to the others. It highlights a distinct phenomenon (exceeding role-duty) that can be confused with ATC supererogation but is conceptually separate.
  4.  **Recommended Revision Reading:** Adopt **Reading 3 (Significant Sacrifice Beyond Requirement)**. It does the least theoretical work while marking a non-empty, stable category highly relevant to demandingness objections. It defines supererogation as: *Acts involving significant sacrifice that produce genuine moral good, the omission of which is blameless.* This avoids the scalar "best" claim (Reading 4) that triggers the referee's objection, grounds the permission in the cost, and provides a clear target for objections about excessive demands. It accommodates typical usage without strong structural claims (Reading 6) or conflating source-relativity with ATC morality (Reading 5). To further clarify in revision, explicitly define "call of duty" as *core moral requirement* and "above and beyond" as *involving significant sacrifice that exempts the act from being obligatory, while being morally good*. This survives the referee's charge by weakening the "better" claim to "good + costly" and grounding the permission in that cost.
