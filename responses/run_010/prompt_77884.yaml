  ### Exploratory Pass: Candidate Presuppositions  
  Before systematic analysis, I identify candidate presuppositions in each practice, noting load-bearing elements (★), incidentals (✓), and gaps in description (△).  

  #### **Practice (1): Courts (Lump-Sum Damages)**  
  - **Load-bearing (★)**:  
    - *Risk-aversion priority*: Claimants are uniquely vulnerable to financial risk; their compensation must be "inflation-proof" and secure, overriding market logic.  
    - *Temporal neutrality in compensation*: A pound needed in 50 years is normatively equivalent to one needed next year for *this claimant*; no devaluation for remoteness.  
    - *Descriptive, not ethical, discounting*: The rate reflects empirical realities (safe investment returns, tax, costs), not moral judgements about the future’s value.  
  - **Incidental (✓)**:  
    - Centralised rate-setting simplifies litigation but isn’t essential (e.g., individualised rates are conceivable).  
  - **Gaps (△)**:  
    - No explicit rationale for *why* remoteness doesn’t matter. Is it because the claimant’s identity binds time? Or because full compensation requires temporal parity?  

  #### **Practice (2): Policy Appraisal (Social Discounting)**  
  - **Load-bearing (★)**:  
    - *Future affluence assumption*: Later generations will be richer, so marginal utility of consumption falls.  
    - *Low/zero pure time preference*: Ethical rejection of devaluing future welfare merely because it is later.  
    - *Declining schedule*: Uncertainty about growth or ethical parameters justifies lowering rates over time.  
  - **Incidental (✓)**:  
    - Step-down formula is a technical response to uncertainty; other methods (e.g., scenario analysis) could achieve similar ends.  
  - **Gaps (△)**:  
    - "Uncertainty" is underspecified: Is it epistemological (we don’t know future parameters) or ontological (parameters are indeterminate)?  

  ---

  ### 1. Reconstructed Views of Future Well-Being Significance  
  *Tables categorising commitments for each practice.*  

  #### **Practice (1): Courts**  
  | Commitment                                      | Class                          |  
  |-------------------------------------------------|--------------------------------|  
  | Future costs for *this claimant* must be fully covered, regardless of timing. | Indispensable (could not survive without) |  
  | Market returns (net of tax/costs) define discounting, not ethical values. | Indispensable |  
  | No discount for remoteness—timing is irrelevant to compensation. | Indispensable |  
  | Claimants’ risk intolerance justifies overriding market norms. | Comfortable fit (sits well with) |  
  | The state’s role is restorative justice, not welfare optimisation. | Comfortable fit |  
  | Pure time preference could be zero or positive; practice is neutral. | Neutral (rival views possible) |  

  #### **Practice (2): Policy Appraisal**  
  | Commitment                                      | Class                          |  
  |-------------------------------------------------|--------------------------------|  
  | Future generations’ welfare is comparable to ours, but subject to discounting. | Indispensable |  
  | Discounting incorporates expected economic growth and declining marginal utility. | Indispensable |  
  | Pure time preference is near-zero on ethical grounds. | Comfortable fit |  
  | Declining rates handle uncertainty about growth/discount parameters. | Comfortable fit |  
  | Social discounting is a tool for efficiency, not compensation. | Indispensable |  
  | Market returns may inform but do not determine the social rate. | Neutral |  

  ---

  ### 2. Coherence Between Practices  
  The practices rest on **incompatible commitments** about *compensatory justice vs. welfare aggregation*, not verbal differences.  

  - **Key loci of disagreement**:  
    - **Restoration vs. maximisation**: Courts aim to restore an identified individual to their "but-for" position across time (requiring temporal neutrality). Appraisal maximises aggregate welfare across anonymous persons (accepting discounting for growth).  
    - **Risk-bearing**: Courts assign all investment risk to defendants (hence negative rates if safe returns are low). Appraisal socialises risks across society (using expected averages).  
    - **Market returns**: In courts, market returns are a *constraint* (claimants cannot bear risk). In appraisal, they are a *reference point* but subordinated to ethical parameters.  
  - **Verbal overlap?** Both use "discounting," but courts use it *actuarially* (predicting portfolio performance), while appraisal uses it *normatively* (valuing future welfare). Removing verbal confusion leaves intact the core clash: individual compensation rejects temporal devaluation; policy appraisal requires it for efficiency.  

  **Conclusion**: No single account reconciles them. The court’s temporal neutrality contradicts appraisal’s growth-based discounting.  

  ---

  ### 3. Practice (1): Courts – Does the Discount Rate Express Value or Prediction?  
  The statutory rate is **purely descriptive of portfolio performance**, not the claimant’s future value.  

  - **Why?** The arithmetic applies identically if the claimant spends everything immediately (e.g., for a short-lived claimant). The rate reflects mandated investment constraints (safety, tax, costs), not a metaphysical claim that "year 50 care is worth more than year 1 care."  
  - **Negative rate implication**: It signals that ultra-safe investments *underperform* inflation (a market fact), not that future goods are "more valuable." If safe real returns were +3%, the rate would be positive—even with identical moral weight.  
  - **Follows from the rationale**: The Damages Act focuses on "real return on investments" (§1(2)), not intergenerational ethics.  

  ---

  ### 4. Practice (2): Appraisal – Declining Schedule and Uncertainty  
  - **Whose uncertainty?** The state’s epistemological uncertainty about *empirical* parameters (e.g., future GDP growth), not ethical ones.  
  - **Pure rate as ethical parameter**: If the pure rate is an ethical truth (e.g., "zero time preference is imperative"), the state cannot be "uncertain" about it—only mistaken. The declining schedule thus *presumes* that:  
    - Ethical commitments are fixed (pure rate ≈0), but empirical forecasts (growth, utility elasticity) are uncertain.  
    - Long-term uncertainty necessitates lower rates to avoid undervaluing distant futures.  
  - **More than a technical device?** Only if the state believes ethical norms are non-negotiable but empirical inputs are probabilistic. If ethical parameters were uncertain, the schedule would mask value conflicts as technical adjustments.  

  ---

  ### 5. Rival Positions Ruled Out  
  | Rival Position                                  | Incoherent for Practice | Compatible with Practice |  
  |-------------------------------------------------|--------------------------|---------------------------|  
  | **Pure rate must be zero (ethical necessity)**  | (2) Appraisal (comfortably fits near-zero, not strict zero) | (1) Courts (neutral) |  
  | **Social rate = market rate**                   | (2) Appraisal (rejected explicitly) | (1) Courts (foundational) |  
  | **Future welfare incomparable to present**      | (2) Appraisal (presumes comparability) | (1) Courts (neutral; focuses on one life) |  
  | **Only effects on contemporaries matter**       | (2) Appraisal (discounts future but includes it) | (1) Courts (neutral; claimant is contemporary) |  
  | **Discounting must include remoteness penalty** | (1) Courts (violates temporal neutrality) | (2) Appraisal (declining rate ≠ penalty) |  

  ---

  ### 6. Tracing a Reform: Unified Discount Rate  
  **Proposal**: Uniform rate = 0% pure time preference + growth term (e.g., 1.5% for wealth growth + marginal utility decline).  

  - **Effect on courts**:  
    - Lump sums would be *reduced* (positive discounting). Courts could *not* argue "future care is cheaper in a richer economy" because:  
      - Compensation is based on *claimant’s* expected costs (e.g., UK care costs), not societal productivity.  
      - Legal principle restores *this individual*, not an average future person.  
    - **Result**: Courts would violate their restorative mandate—a *reductio* of the unified theory for practice (1).  
  - **Effect on appraisal**:  
    - Declining schedule abandoned; distant benefits discounted heavily (e.g., 1.5% for 50 years = 47% of value lost).  
    - **Result**: Undermines the precautionary rationale for step-downs—a *reductio* for practice (2) if uncertainty is material.  
  - **Conclusion**: The reform is a *reductio* of **both practices**, revealing their incompatible foundations. Courts must ignore societal growth; appraisal must internalise it.  

  **Final Analysis**: The practices were never about a unified "value of the future." Courts protect identified individuals from time-based risk; appraisal optimises societal welfare across generations. The inconsistency is irreducible and normatively defensible in each context.  

  ---  
