answer: |-
  Here are the desiderata for a theory of biological function suitable for your annotation pipeline, followed by the joint-satisfiability analysis and theory evaluation. Each desideratum is motivated by a concrete case, assessed for genuineness, and evaluated against the applicability constraint (knowability with incomplete information).

  ### Desiderata for a Functional Annotation Theory

  1.  **Accommodate Malfunction & Absence of Function**:
      *   **Motivating Cases**:
          *   *Pseudogene*: Has sequence similarity to a functional gene but is broken (e.g., frameshift). Lacks its ancestral function. Is it malfunctioning or functionless?
          *   *Vestigial Structure* (e.g., whale pelvis). No current significant contribution. Functionless or malfunctioning remnant?
          *   *Catalytically Dead Enzyme in Complex*: Performs a structural role but not its ancestral catalytic role. Does it have *a* function? Is the catalytic role malfunctioning or absent?
          *   *Designed Synthetic Construct*: Works reliably *in vivo* as designed, but has *no* evolutionary history. Does it have a function? Can it malfunction?
      *   **Genuineness**: **Genuine Constraint.** Any usable theory *must* distinguish between something failing to perform its function (malfunction) and something not having a function at all. It must also assign function to entities without history.
      *   **Applicability Constraint**: Must not require perfect knowledge of "proper" state. Should allow inference of malfunction from deviation *within* a current type or system context (e.g., broken pseudogene vs. functional ortholog; synthetic construct not binding target).

  2.  **Handle Promiscuity & Moonlighting**:
      *   **Motivating Case**: A protein primarily catalyzes Reaction A, but weakly catalyzes Reaction B under stress. Reaction B later becomes essential in a new pathway after duplication. Which activities are "its function"? Is it one function, multiple, or degrees? Relative to cell, tissue, or organism?
      *   **Genuineness**: **Genuine Constraint.** Annotation systems *must* handle multiple activities. The theory must clarify what grounds *which* activity counts as a function (e.g., prevalence, strength, consequence, system level) and whether functions are exclusive or additive.
      *   **Applicability Constraint**: Must allow annotation based on measurable activities *in context* (e.g., biochemical assay, genetic interaction) without requiring omniscience about evolutionary history or all possible contexts.

  3.  **Address Level & Grain**:
      *   **Motivating Case**: Annotating a kinase: "phosphorylates substrate X" (chemical), "activates pathway Y" (pathway), "regulates cell division" (cellular), "controls limb development" (tissue/organism). Are these competing claims or compatible descriptions?
      *   **Genuineness**: **Genuine Constraint.** Biological processes are inherently hierarchical. The theory must clarify if function is relative to a specific system level and how annotations at different grains relate (e.g., "phosphorylates X" *enables* "activates pathway Y").
      *   **Applicability Constraint**: Must allow annotators to specify the relevant level/grain based on available evidence without needing a complete causal hierarchy map.

  4.  **Clarify Epistemic Output ("Unknown")**:
      *   **Motivating Case**: The pipeline outputs "unknown function" for a conserved, essential gene. Is this a claim that the gene *has no function* or that *we don't know its function*? What partial evidence (e.g., expression pattern, interaction partners) warrants *any* functional assertion?
      *   **Genuineness**: **Genuine Constraint.** Annotation is an epistemic practice. The theory must distinguish ontological function (what it *does* in the system) from epistemological status (what we *know*). It must guide what level of evidence justifies which claims.
      *   **Applicability Constraint**: Must explicitly frame "unknown" as an epistemic state, not an ontological one. Must provide principles for making tentative functional inferences from incomplete data (e.g., guilt-by-association).

  5.  **Anhistoricity**:
      *   **Motivating Cases**: De novo genes (no history), synthetic constructs (designed, no selection), horizontally transferred genes (unknown donor history). All reliably perform activities crucial to their current system.
      *   **Genuineness**: **Genuine Constraint.** A theory requiring a specific selective history (etiology) fails for these cases. It must ground function in *current* properties, capacities, or systemic roles without historical precondition. *However*, the demand that history is *irrelevant* is **often an anti-etiologist commitment disguised as neutral**. History can be *informative* without being *constitutive*.
      *   **Applicability Constraint**: Must allow function assignment based on current context and demonstrable effects without requiring inaccessible phylogenetic or selective history.

  ### Joint-Satisfiability Analysis

  *   **The Alleged Tension (Malfunction vs. Anhistoricity)**: This tension is **largely an artifact of phrasing** based on conflating *history* with *normativity*. Etiological theories (SE) ground normativity (hence malfunction) in history. Causal-role (CR) theories ground normativity in current system organization but often struggle with malfunction. **The core need is separating the source of *normativity* from the source of *function assignment*.** An adequate theory needs:
      1.  A basis for assigning a function to an entity (e.g., its contribution, capacity, or role within a *current* system).
      2.  A basis for defining when that entity is *malfunctioning* relative to that assigned function (e.g., deviation from a type-typical contribution within the current system context, or failure to meet a system goal).
  *   **Resolution**: A theory can be **anhistoric in its core function assignment** (grounding function in current systemic contribution/capacity/role) while **defining malfunction relative to a contextually defined norm** based on the *type* of entity within its *current* system. For a synthetic construct, malfunction is deviation from its design specs *in its current chassis*. For a pseudogene, malfunction is meaningless because it lacks a functional type assignment *in the current system*; it's simply functionless. Vestigial structures lack a significant current function. The catalytically dead enzyme *has* a function – its structural role; its lack of catalysis isn't malfunction *of that enzyme*, it's simply *not* a catalyst anymore. The key is defining the relevant "type" contextually (e.g., "structural component of complex X" vs. "catalyst for reaction Y").
  *   **Least Damaging Surrender**: If forced, surrendering the requirement that malfunction *must* be defined identically for entities with and without history. Malfunction for historic entities *can* reference lineage-typical contributions, while for ahistoric entities, it references design-intent or system-typical contributions. This is inelegant but workable. Surrendering anhistoricity entirely is unacceptable for your use case.
  *   **Most Eliminative Desideratum**: **Anhistoricity** is the most stringent. It immediately disqualifies *pure* Selected Effect (SE) theories and strong propensity theories requiring past selection. It forces theories to ground function primarily in current properties or system context.

  ### Theory Family Assessment vs. Desiderata

  1.  **Selected Effect (SE) / Etiological**:
      *   Fails **Anhistoricity** catastrophically (requires selection history). Struggles with **Malfunction** for new/synthetic entities (no history to define "proper" function). Handles **Promiscuity** poorly (which effect was selected?). **Level/Grain** depends on what level selection acted. **Epistemic Output** problematic ("unknown" often means unknown history). *Fails applicability* for anhistoricity.

  2.  **Causal Role (CR) / Systemic Capacity**:
      *   Excels at **Anhistoricity** (function is current causal contribution). Handles **Level/Grain** well (function relative to containing system). Good **Epistemic Output** ("unknown" = unknown contribution). Struggles with **Malfunction** (if it's just doing *something*, how is it malfunctioning?). Struggles with **Promiscuity** (all activities are functions? How to prioritize?). Needs augmentation for normativity (malfunction).

  3.  **Goal-Contribution (GC) / Organizational**:
      *   Strong on **Anhistoricity** & **Level/Grain** (function relative to maintaining organization of current system). Handles **Malfunction** well (fails to contribute to system maintenance/goal). Handles **Promiscuity** contextually (function is what contributes *relevantly* to system persistence). **Epistemic Output** good ("unknown" = unknown contribution to system organization). Requires defining system/goals clearly. *Most promising core*.

  4.  **Propensity Theories**:
      *   Varies. Some require past selection (fail Anhistoricity). Others focus on future survival probabilities – *very* weak **Epistemic Output** (unknowable future). Poor **Malfunction** (if it *could* contribute, is it malfunctioning?). Poor **Applicability** overall (future propensities are speculative).

  5.  **Pluralism / Consensus**:
      *   Pragmatic appeal. Could use SE *where* history is known and relevant (e.g., conserved enzymes, defining malfunction in lineages) and CR/GC for ahistorical cases. **Malfunction** definition might be inconsistent across types. **Epistemic Output** needs clear rules for choosing framework. **Level/Grain** handled well. Risks being a patchwork rather than a unified theory. Requires careful meta-rules.

  ### Recommendation

  A **Goal-Contribution/Organizational Account** provides the best core foundation, satisfying Anhistoricity, Malfunction (via failure to contribute to system maintenance), Level/Grain, and Epistemic Output most robustly within your constraints. It naturally handles promiscuity by focusing on what activities *actually contribute* to the persistence/organization of the relevant system *in its current context*. It defines malfunction clearly (failure to perform the expected contribution, defined by type-role in the system). "Unknown" means we don't know its contribution to system persistence.

  **Supplement with Pluralist Elements:** For entities with well-understood evolutionary histories *where* the selected effect provides crucial context (e.g., understanding why a conserved enzyme's specific mechanism matters for its function/malfunction), allow SE concepts to inform the *interpretation* of the GC role. However, the *assignment* of function remains grounded in current systemic contribution. This hybrid approach leverages history where useful without making it constitutive.

  **Crucial Implementation Note:** Regardless of theory, operational definitions for "system" (e.g., cell, pathway, minimal chassis), "organization"/"goal" (e.g., metabolism, replication, chassis stability), and "typical contribution" must be clearly defined and contextually applied within the annotation guidelines. The theory provides the philosophical justification; the guidelines provide the operational rules for annotators.
