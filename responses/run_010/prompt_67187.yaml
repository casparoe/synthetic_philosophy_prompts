answer: |-
  Here's a breakdown of the student's answer, a score out of 15, and comments designed for direct pasting next to the answer. This reads as a **solid B-/B answer** (assuming a standard curve) - it shows good understanding of Taurek but has a significant error on Scanlon and omits key details.

  **Overall Score: 8/15**

  **Comments for Pasting (Claim-by-Claim):**

  1.  **"Taurek starts from the fact that you can't compare one person's happiness against another's, so there's no way of saying that five lives saved is better than one."**
      *   **✓ (1/1 pt)** Correctly identifies Taurek's starting point of incommensurability/anti-aggregation regarding value across persons.
  2.  **"When he asks whether five deaths are five times as bad as one his answer is no, because there is no single subject who loses five lives — the losses belong to five separate people, so the sum doesn't correspond to anything real."**
      *   **✓ (2/2 pts)** Excellent, precise articulation of Taurek's core anti-aggregation argument ("no single subject" is key phrasing). Earns full credit for explaining his reasoning.
  3.  **"Since no claim outweighs David's, each person has an equally strong claim to be saved..."**
      *   **✓ (1/1 pt)** Correctly draws the implication from the anti-aggregation premise.
  4.  **"...it follows that we should flip a coin, that being the only way to treat equal claims equally."**
      *   **✓ (1 pt) / ✗ (2 pts missing detail)** Correctly identifies the coin flip *conclusion* but **fails to explain the *procedure***: Taurek proposes giving *each individual* (David and each of the five) an equal chance. This means flipping a coin where David has a 1/2 chance *and the group of five shares a 1/2 chance* (so each of the five has a 1/10 chance, David 1/2). Mentioning *only* "flip a coin" misses this crucial detail about *how* the chance is distributed. *(Credit for conclusion, deduction for missing procedure detail)*.
  5.  **"He does allow the numbers count sometimes, in cases where you already have a special obligation to the people at risk."**
      *   **✓ (1/1 pt)** Correctly identifies Taurek's exception (special obligations like family or promisees).
  6.  **"Scanlon arrives at the same place by a different route..."**
      *   **✗ (Incorrect Premise - Major Error)** This is fundamentally wrong. Scanlon **DOES NOT** endorse the coin flip. He argues saving the greater number *is* justified.
  7.  **"...instead of adding up goods he asks which principles no one could reasonably reject..."**
      *   **✓ (1/1 pt)** Correctly states Scanlon's contractualist framework.
  8.  **"...and a principle that settles the choice by a coin flip is one each person could accept..."**
      *   **✗ (0/2 pts)** Incorrect application of contractualism. Scanlon argues that a principle *requiring saving the greater number* could not be reasonably rejected in this case. A person in the smaller group *could* reasonably reject a coin flip principle precisely *because* it ignores the numbers and gives them a much lower chance of survival than a numbers-sensitive principle would give them in other potential scenarios. This misrepresents Scanlon's core argument against Taurek.
  9.  **"...so Scanlon also endorses giving everyone an equal chance."**
      *   **✗ (0/1 pt)** Directly contradicts Scanlon's actual conclusion (saving the greater number).
  10. **"Both are non-utilitarians who refuse to let the numbers do the moral work."**
      *   **✓ (1/2 pts)** Correct that both are non-utilitarians. **Partially correct** that Taurek refuses to let the numbers do the work. **Incorrect** regarding Scanlon – Scanlon *does* allow the numbers to count (through the lens of reasonable rejectability) *in this specific case*. He rejects *simple aggregation* like utilitarians, but the numbers *do* influence the outcome via contractualism. Misses the nuance on Taurek's "sometimes" (covered earlier).
  11. **Clarity & Coverage:** The answer is generally well-written and covers the required parts, but the critical error on Scanlon and the omission of Taurek's procedure detail are significant flaws. *(+1 pt for structure/clarity, - deductions covered above)*.

  **Rubric Calibration & Consistency:**

  *   **B- Range (7-8/15):** This answer fits here. It demonstrates a strong grasp of Taurek's core reasoning (earning significant points) but has a major misunderstanding of Scanlon's position and omits a key detail about Taurek's procedure. The clarity pushes it towards the higher end of B-.
  *   **Why not C?** A C answer would typically show a more superficial or significantly flawed understanding of *both* philosophers, major omissions, or significant factual errors beyond one core point. This student clearly understands Taurek well and correctly identifies Scanlon's *method* (contractualism), even if they catastrophically misapply it to the conclusion. It's above the level of fundamental confusion.
  *   **Why not higher B/A?** The Scanlon error is too central and severe. Getting the *opposite* conclusion for Scanlon is a major mistake. The missing detail on Taurek's procedure also prevents a higher score. An A answer would need near-perfect accuracy on all parts.

  **Recommendation for Your Stack:**

  *   **Focus Scanlon Grading:** Pay close attention to whether students understand that Scanlon *rejects* Taurek's coin flip and argues *for* saving the greater number based on reasonable rejectability. This is likely a common point of confusion.
  *   **Require Procedure Detail:** Ensure students specify *how* Taurek's coin flip works (equal chance *per person*, not per group).
  *   **"Sometimes" Nuance:** For Taurek's final point, look for mention of "special obligations" or relationships. Simply saying "sometimes" is insufficient without the reason.
  *   **Clarity Bonus:** Awarding 1-2 points for overall clarity, structure, and conciseness (as done here) is reasonable and helps differentiate well-organized answers from messy ones that might have similar factual content.

  This calibration should help you approach your stack consistently. Good luck with the marking!
