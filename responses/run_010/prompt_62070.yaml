prompt: |-
  You're a political philosopher who does a lot of applied civic-ethics consulting — think of yourself as the outside expert an advice panel would hire to reverse-engineer its own intuitions. Before you write anything, spend some real time brainstorming: the hard part here isn't picking a rule fast, it's generating the full space of rules that could be sitting behind this record. Lay out at least four candidates, including ones nobody on the panel would ever say out loud, and only then start arguing.

  Context: I volunteer on the reader-advice panel of a nonpartisan get-out-the-vote nonprofit. Every fall we mail members a one-page guide, and year-round we answer letters from people asking whether some particular vote they're weighing is morally OK. We've been at it about six years. Nobody has ever articulated a theory — no one's ever said "we're consequentialists" or "we're doing the juror-not-customer thing" — we just vote on the replies. Which is why we're stuck.

  Our record so far, roughly in order:

  1. A reader in a district decided by 40 points asked whether they could skip the congressional race entirely and just vote the school board and the two ballot measures they'd actually studied. We said yes, no obligation to fill in every race, and casting a vote you can't defend is worse than casting none.
  2. A reader whose preferred party was polling at 3% asked if voting for them was self-indulgent. We said: in that district, no. With a margin that wide there's nothing to spoil; vote for the platform you'd defend to a neighbor.
  3. Swing-state reader, presidential year. One candidate's platform included something the reader considered a grave injustice, not merely a bad policy. The other was corrupt, cruel in tone, and would do real damage, but wasn't in that category by the reader's own account. We told them to vote for the second one and not agonize about it, and we wrote that in a state that close, staying home isn't a neutral act.
  4. A reader in a total blowout wanted to vote for the lesser evil anyway, purely because it felt like doing something. We said fine, harmless, though we noted the vote meant something different there than it would have in a close race.
  5. A nurse asked whether she could vote for a candidate who supported deep cuts to a program her patients depend on, on the grounds that the same candidate was much better on a foreign-policy issue she weighted more heavily. We said yes, and that we weren't going to second-guess her ranking of harms — but we asked her to write the ranking down before she voted.
  6. A reader asked whether voting for a major-party candidate in a safe state, purely to pad that party's national popular-vote share, was a "wasted vote" rationalization. We said no, that share isn't causally empty, and it's a legitimate reason.
  7. A reader wrote in asking permission to vote their heart and included a claim about the polling that they plainly didn't believe. We didn't answer the question. We told them to go check the actual margin first and write back when they could tell us honestly how close the race was.

  Now the letter we can't settle, and it's going in next week's mailing either way.

  A public defender in a midsize city. Mayoral race, plurality, no runoff. Front-runner X has run on criminalizing homelessness — sweeps plus prosecution. The reader considers that a grave injustice, not a bad policy; they've said so explicitly and they're not being dramatic about it. Candidate Y is also on the sweeps side but pairs it with a shelter-first commitment and no prosecutions; the reader calls Y "the same wrong, smaller." Candidate Z is clean on the issue and is, by the reader's own description, the best platform in the race; Z is polling around 11%, has said publicly they won't attack Y, and is drawing exclusively from Y's pool, not X's. Both the local pollster and the paper's board have said a Z vote most likely hands it to X. The reader writes: I've voted lesser-evil twice in my life and both times the lesser evil did the thing I voted against the other guy for. I don't want to be part of X's win, but I also don't want to be the reason X wins.

  Here's the thing: in every one of rulings 1 through 7, at least one of the realistic options was, in the reader's own judgement, not gravely unjust. That's never been false before. Half the panel thinks ruling 3 governs and we tell her Y. Half thinks ruling 3 is about a two-way race with a clean-ish option and doesn't reach this, and that ruling 2 plus ruling 1 point toward Z or a spoiled ballot. Both halves think they're being consistent with the record.

  So, deliverables. First, prose: name the candidate rules that fit all seven prior rulings, say what each one tells us to publish for this letter, pick the rule you think the panel is actually running and defend that pick, and identify which single prior ruling is the closest analog and why. Then be honest about the cost — if we publish "vote Y," what principle are we adopting that we haven't adopted before, and which future letters will we then be committed to answering the same way? Same question if we publish "vote Z" or "spoil it." Finally, describe one more hypothetical reader letter, the kind we might plausibly recieve next year, that would settle which rule we're on — a case where your top two candidate rules give opposite advice.

  Second, after the prose, give me a table with exactly these columns: `rule` (a short name you assign), `how_it_accounts_for_the_record` (which of 1–7 it explains and how, compressed), `advice_for_the_new_letter` (one of: X, Y, Z, spoil, abstain), `prior_ruling_that_strains_it` (the number and one sentence), `letter_that_would_confirm_it` (one or two sentences describing the discriminating reader letter).

  Third, end with a JSON object, no prose around it, with these fields: `publish` (string, one of "Y", "Z", "spoil", "abstain"), `runner_up` (string, same allowed values), `closest_analog_ruling` (integer 1–7), `principle_adopted_if_we_publish_this` (string, one sentence), `principle_we_would_be_giving_up` (string, one sentence), `confidence` (string, "low" / "medium" / "high").

  Please don't cite anything or hand me a reading list — this is all internal reasoning about our own record, and I can't check sources anyway. Write the whole thing in American English. Take your time and think it through carefully before committing to a verdict; a non-committal answer is useless to us, since something has to go in the mailing.
reasoning: |-
  Hmm, the user is part of a nonprofit advice panel that gives voting ethics guidance, and they're stuck on a difficult case involving a mayoral race with three candidates. They've shared their prior rulings and need help reverse-engineering the principles behind their decisions to resolve this new dilemma.

  Looking at their record, I notice several patterns. Ruling 1 allows skipping votes when unprepared, while Ruling 2 permits voting for minor parties in non-competitive races. Ruling 3 requires harm reduction in close swing states, and Ruling 4 allows symbolic votes in blowouts. Ruling 5 respects personal harm rankings, Ruling 6 validates signaling votes, and Ruling 7 insists on factual accuracy about competitiveness.

  The mayoral case presents new challenges: it's a three-way race where the preferred candidate (Z) might split votes and cause the worst candidate (X) to win, and crucially, both frontrunners support a policy the reader considers gravely unjust - which hasn't happened before in their rulings.

  I need to develop at least four candidate rules that fit all prior rulings:
  1) Strategic Harm Reduction: Always minimize the worst outcome in competitive races (explains rulings 3,4,7)
  2) Expressive Integrity: Vote conscience unless it causes direct harm (explains rulings 1,2,5,6)
  3) Threshold Permissibility: Only vote for candidates above a moral threshold (new concept)
  4) Voter Sovereignty: The voter's judgment is final except when clearly harmful (explains rulings 1,5,6)

  For the mayoral case, these rules suggest: 
  - Strategic says vote Y (the less-bad frontrunner)
  - Expressive says vote Z (the conscience choice)
  - Threshold says spoil ballot (neither X nor Y is acceptable)
  - Sovereignty says abstain (respecting the reader's conflict)

  The closest analog is Ruling 3 (swing-state harm reduction), but it differs because here both frontrunners are objectionable. If they choose Y, they adopt the principle that avoiding the worst outcome overrides voting for gravely unjust candidates. If they choose Z, they prioritize moral purity over electoral consequences. Either choice will constrain future rulings.

  The discriminating hypothetical would be: A voter in a close governor race where the only viable candidates both support gravely unjust policies, testing whether they'll endorse strategic voting even without a "clean" option.
answer: |-
  ### Prose Analysis  
  **Candidate Rules Extracted from Record:**  
  1. **Strategic Harm Minimization:** Prioritize preventing the worst outcome in competitive races. Votes are tools to reduce harm; electoral consequences dominate moral purity. (Explains Rulings 3, 4, 7)  
  2. **Expressive Integrity:** Voting is a personal moral act. Cast defensible votes aligned with conscience unless they directly enable grave injustice in competitive contexts. (Explains Rulings 1, 2, 5, 6)  
  3. **Threshold Permissibility:** Refuse to endorse *any* candidate supporting grave injustice, regardless of electability. Abstain/spoil if all viable options cross the line. (No prior ruling fully reflects this; strains Ruling 3)  
  4. **Voter Sovereignty:** Defer to the voter’s harm-ranking if internally consistent, but enforce factual rigor about electoral impact. (Explains Rulings 5, 6, 7; strains Ruling 3)  

  **Advice for New Letter Under Each Rule:**  
  - **Strategic Harm Minimization:** Vote Y (prevents X, the worst outcome).  
  - **Expressive Integrity:** Vote Z (conscience choice; no spoiler risk in non-competitive races, but here competitiveness complicates).  
  - **Threshold Permissibility:** Spoil ballot (neither X nor Y is morally permissible).  
  - **Voter Sovereignty:** Abstain (reader’s conflict suggests no defensible ranking).  

  **Panel’s Likely Rule:** **Strategic Harm Minimization** best fits the record. Ruling 3 (swing-state lesser-evil) is the cornerstone: it overrides moral discomfort to block a grave injustice. Ruling 7 (demanding poll-checking) reinforces that competitiveness triggers strategic duty. Ruling 2 (safe-state protest vote) is permissible *because* no harm was done—unlike this mayoral race. The panel’s split stems from misapplying Ruling 2’s "protest vote" logic to a competitive race with grave stakes.  

  **Closest Analog:** **Ruling 3** (swing-state presidential vote). Both involve:  
  - A competitive race where abstention aids the worst candidate.  
  - A "lesser evil" with objectionable traits but not the *reader’s specific* grave injustice.  
  Key difference: Here, *both* frontrunners support the grave injustice, but Y’s policy is "smaller" harm—making it analogous to Ruling 3’s "corrupt but not unjust" candidate.  

  **Cost of Publishing "Vote Y":**  
  - **Principle Adopted:** Preventing the worst outcome justifies voting for a candidate supporting *reduced* grave injustice, even if they don’t fully reject it.  
  - **Future Commitments:** Must advise voting for a segregationist-lite candidate to block a full segregationist in a close race.  

  **Cost of Publishing "Vote Z" or "Spoil":**  
  - **Principle Adopted:** Moral purity > electoral consequences when all frontrunners are unjust.  
  - **Future Commitments:** Must endorse spoiling a ballot in a swing state if both major candidates support *any* grave injustice (e.g., both back abortion bans).  

  **Discriminating Hypothetical:**  
  *A reader in a swing-state governor race. Candidate A supports a 20-week abortion ban; B supports a 6-week ban (which the reader considers grave injustice). Polls show B leading A by 2%, with a pro-choice spoiler C at 10%.*  
  - **Strategic Harm Minimization:** Vote A (lesser evil on injustice).  
  - **Expressive Integrity/Threshold:** Vote C or spoil (both A and B support injustice).  
  This forces a choice: Does blocking the *worst* injustice (B) override voting for *any* injustice (A)?  

  ---

  ### Table of Candidate Rules  
  | rule                      | how_it_accounts_for_the_record                                        | advice_for_new_letter | prior_ruling_that_strains_it | letter_that_would_confirm_it                          |  
  |---------------------------|-----------------------------------------------------------------------|------------------------|------------------------------|-------------------------------------------------------|  
  | Strategic Harm Minimization | 3 (close race demands harm reduction), 4 (blowout vote harmless), 7 (competitiveness matters) | Y                     | 2 (safe-state protest vote ok) | Swing state: Vote for moderate segregationist to block extremist. |  
  | Expressive Integrity      | 1 (skip undefendable votes), 2 (protest votes allowed), 5 (respect harm rankings) | Z                     | 3 (lesser-evil over conscience) | Safe state: Vote for fringe candidate despite grave platform flaws. |  
  | Threshold Permissibility  | 1 (abstain better than bad vote), 2 (protest vote ok if no grave harm) | spoil                | 6 (symbolic votes for harmful parties ok) | Swing state: Spoil ballot if both majors support injustice. |  
  | Voter Sovereignty         | 5 (no second-guessing rankings), 6 (respect signaling motives), 7 (verify facts) | abstain              | 3 (overrides voter’s preference) | "I rank immigration over climate; vote for anti-immigration candidate?" → Yes. |  

