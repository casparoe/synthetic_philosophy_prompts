  I recall Kuhn's concept of incommensurability from history and philosophy of science. Originally in Structure of Scientific Revolutions, it was radical, but later Kuhn moderated it to mean untranslatability of some terms without implying incomparability. That's key here because the user mentioned Kuhn's restricted usage. I should ensure one thesis aligns with that.

  For each thesis, I have to be precise. Let me brainstorm: First, meaning change of shared terms like "homology" – cladists used it strictly for synapomorphies, while evolutionists included adaptive similarities. That's a substantive claim but defensible. It wouldn't fully dismiss the user's question because arguments could still be made across frameworks.

