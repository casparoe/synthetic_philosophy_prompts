  Third, divergent epistemic goals. Cladists aimed for pure phylogeny, evolutionists for evolutionary information. This is defensible and might support dismissal only if goals are fundamental and incompatible.

  Fourth, local untranslatability. This is Kuhn's later view: some terms can't be fully translated, but it doesn't block all communication. This is defensible and doesn't support dismissal as Kuhn himself argued comparability remains possible.

  Fifth, holistic worldview conflict. This is more radical, like incommensurability as total paradigm shifts. But it's probably false or incoherent due to partial communication and shared history in biology. It would support dismissal but fails on objections.

  Now, for the casual use in seminars: I think people often mean meaning variance or methodological differences – the first two theses. Kuhn's later view is closest to the fourth thesis on untranslatability.

