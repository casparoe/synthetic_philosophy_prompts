answer: |-
  1. **Thesis**: Key theoretical terms (e.g., "homology," "monophyly") shared by cladists and evolutionary taxonomists possessed systematically different meanings within each framework, rendering direct comparison of assertions impossible.  
  **Verdict**: Substantive and defensible for specific terms (e.g., "monophyly" as strict synapomorphy vs. inclusive of evolutionary grades). Does not license dismissal of your question, as partial translation allows rational engagement. Casual use often tracks this reading.  

  2. **Thesis**: The camps lacked neutral, framework-independent methodological standards for theory choice (e.g., cladists prioritized parsimony/testability; evolutionary taxonomists valued adaptive divergence).  
  **Verdict**: Substantive and defensible. Licenses dismissal *only if* standards are irreducibly internal, but this is undermined by shared meta-standards like empirical adequacy. Casual use frequently conflates this with meaning variance.  

  3. **Thesis**: The disputes arose from divergent epistemic goals (cladists sought pure phylogeny; evolutionary taxonomists aimed to capture adaptive processes), making direct comparison incoherent.  
  **Verdict**: Defensible but overstates conflict; both accepted evolution as foundational. Weakly supports dismissal by framing goals as axiomatic, yet rational debate about goal compatibility remains possible. Kuhn's later view rejects this as implying incomparability.  

  4. **Thesis**: Local untranslatability exists: some cladistic concepts (e.g., "paraphyly as invalid") lack exact equivalents in evolutionary taxonomy, hindering mutual critique.  
  **Verdict**: Defensible (aligns with Kuhn’s mature view). Does not license dismissal, as Kuhn stressed untranslatability is partial and does not preclude rational assessment. This is Kuhn’s closest position—your supervisor’s usage likely ignores his caveats.  

  5. **Thesis**: Holistic incommensurability: the frameworks constitute self-validating worldviews with no shared rationality, making "better reasons" judgments impossible.  
  **Verdict**: False/incoherent; defeated by persistent cross-paradigm arguments (e.g., your chapter's point) and reference stability (e.g., fossils anchor claims). Licenses dismissal but fails on translation/conceivability objections. Casual use sometimes drifts here, despite Kuhn’s explicit rejections.
