  I'll create a customs case involving organic food labeling. The standard is "no synthetic pesticides" - vague because traces might be borderline. Initial ruling approves, then a second body rejects. Consequence: the shipment was already exported. The rule has a "clearly meets" clause for expedited review. And there's a clear case of pesticide-free produce that both approved.

  For the demonstration: I'll list key sentences and show how each theory evaluates them. Epistemicism will say one ruling was objectively correct but unknowable; supervaluationism will say both are permissible precisifications. Crucially, they'll diverge on whether the first ruling was correct - epistemicism says yes or no, supervaluationism says neither true nor false.

  The divergence comes from higher-order vagueness ("clearly meets"). If I remove that, both theories might agree the rulings are equally permissible. The attack against epistemicism would be that we can never verify which ruling was correct, but that doesn't challenge the theory itself. Against supervaluationism, the attack is that it violates bivalence unnecessarily.

  I conclude this shows practical consequences - the irreversible outcome creates real-world asymmetry between the theories' interpretations of what happened. The dispute isn't just about labels when decisions have tangible effects.
answer: |-
  ### Scenario: Organic Food Certification Board
  A national Organic Certification Board administers a "no synthetic pesticides" standard for imported produce. Rule 5.3 states: "Items with no detectable synthetic pesticide residues *clearly meet* the standard and receive expedited certification." Board A inspects a shipment of blueberries, finding trace levels of Pesticide X (0.08 ppm), below the instrument's detection threshold of 0.10 ppm but above its margin of error (±0.03 ppm). After deliberation, Board A rules the shipment meets the standard and issues certification. The exporter immediately ships the blueberries under an irrevocable organic-premium contract. Later, Board B (an appellate panel under identical rules and procedures) reviews the same lab report. It rules the shipment does *not* meet the standard, citing the residue level's ambiguity. Both boards previously certified a separate apple shipment with 0.00 ppm residues as compliant—a determinate case where no trace was found.

  ### Sentence Verdicts by Theory

  | Sentence                                                                 | Epistemicism Verdict & Mechanism                                                                 | Supervaluationism Verdict & Mechanism                                                                 |
  | :----------------------------------------------------------------------- | :----------------------------------------------------------------------------------------------- | :---------------------------------------------------------------------------------------------------- |
  | **S1:** The blueberries meet the "no synthetic pesticides" standard.     | **True or False (unknowably):** Sharp boundary exists; one board got it right. (Bivalence)       | **Neither supertrue nor superfalse:** True on some precisifications (ignoring trace), false on others. (Truth-value gap) |
  | **S2:** The blueberries *clearly* meet the standard.                     | **False:** "Clearly" requires a margin for error; borderline cases defeat knowledge. (Margin-for-error principle) | **Superfalse:** No precisification makes residues *undetectable and unambiguously compliant*. (Penumbral connection to detection limits) |
  | **S3:** Board A's ruling was correct.                                    | **True or False (unknowably):** Aligns with S1's objective truth-value. (Bivalence + Factivity)  | **Neither supertrue nor superfalse:** Correct on precisifications where S1 is true, incorrect where false. (Truth-value gap inheritance) |
  | **S4:** The apples meet the standard.                                    | **True:** 0.00 ppm is determinately compliant. (Sharp boundary below 0.00 ppm)                   | **Supertrue:** True on all admissible precisifications. (Determinate case)                            |
  | **S5:** The blueberries meet the standard OR they do not.                | **True:** Excluded middle holds. (Classical logic)                                               | **Supertrue:** True on all precisifications; S1 or ¬S1 holds in each. (Supervaluationist saved excluded middle) |
  | **S6:** Board A's ruling was correct AND the blueberries were exported.  | **True or False (unknowably):** Conjunction inherits S3's truth-value. (Classical conjunction)   | **Neither supertrue nor superfalse:** Inherits gap from S3. (Gap percolation)                         |
  | **S7:** Board B's ruling was correct.                                    | **True or False (unknowably):** Contradicts S3; only one can be right. (Bivalence + Non-contradiction) | **Neither supertrue nor superfalse:** Correct iff S1 is false; inherits S1's indeterminacy. (Gap inheritance) |

  ### Agreement and Divergence
  - **Agree on S4:** Both hold the apples determinately comply (epistemicism: true; supervaluationism: supertrue).
  - **Agree on S5:** Both hold the disjunction is true/supertrue.
  - **Diverge on S3 ("Board A's ruling was correct"):** Epistemicism assigns a definite (but unknowable) truth-value (true *or* false). Supervaluationism assigns no truth-value (neither supertrue nor superfalse).

  ### Structural Feature Generating Divergence
  The divergence arises from **higher-order vagueness in "clearly meets"** combined with **irreversible consequences**. S2 ("clearly meets") is determinately false/superfalse for both theories, but:
  - Epistemicism uses this to *reinforce* that S1 is borderline (unknowably true/false).
  - Supervaluationism uses it to show S1’s *indeterminacy* is structural (no precisification makes it clearly true).  
  **If removed:** Without "clearly meets" (or with reversible consequences), epistemicism could dismiss the reversal as consistent with unknowable truth, while supervaluationism could treat both rulings as equally permissible—masking the divergence on S3’s truth-value.

  ### Strongest Attack by the "Worse" Theory
  - **Epistemicism fares worse** in justifying the *practical asymmetry* (Board A’s ruling triggered irreversible action; Board B’s did not).
    - **Supervaluationism’s attack:** "Your theory cannot explain why Board B’s ruling isn’t equally 'correct' in a symmetric world where it ruled first. You posit an unknowable fact making one board objectively right, but this is explanatorily idle—it adds nothing to the description of competent judgments and irreversible outcomes."
    - **Availability:** This attack *does not* restate idleness; it targets epistemicism’s inability to explain the *normative asymmetry* in institutional responses without appealing to inaccessible facts.

  ### Verdict on Practical Consequences
  **The dispute has practical consequences.** Epistemicism implies that a concrete (but unknowable) error occurred—either in Board A’s approval (if S1 is false) or Board B’s reversal (if S1 is true)—invalidating one body’s authority *de re*. Supervaluationism implies no such error, treating the reversal as a legal re-precision without factual mistake. This difference materially affects accountability, compensation claims, and institutional legitimacy regarding the irreversible export. The divergence is not metalinguistic; it concerns whether a past decision was *factually correct*, with implications for redress and responsibility.
