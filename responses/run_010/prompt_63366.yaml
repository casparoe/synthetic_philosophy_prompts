prompt: |-
  I cover law and the social sciences for a monthly magazine of ideas, and next month's long interview is with a legal philosopher whose new book defends a modernized legal moralism: that the criminal law may properly prohibit conduct a society's conventional morality condemns, on the ground that shared norms are load-bearing for the institutions that make ordinary cooperation possible. She knows Hart and Devlin well, and she is adept at absorbing the objection that the disintegration thesis is an untested empirical assumption by saying that hers is a sociological claim about trust and social capital rather than Devlin's claim about the reasonable person's feelings. I have forty-five minutes and do not want to spend them on restatement.

  Draft nine or ten questions, each with a sentence or two on the point it is meant to expose, covering at least the following:

  - Hart's charge that the disintegration argument slides between a definitional claim (a society just is its shared morality, so any moral change is a change of society) and an empirical one (moral change causes institutional collapse), and her likely retreat to the position that only some norms are load-bearing while others are decorative — with a follow-up demanding a test, applied in advance rather than in hindsight, for telling the two apart, given that we usually identify load-bearing norms only after they have been removed.
  - The treason analogy: what magnitude of threat the comparison requires, and whether private conduct can meet it.
  - The epistemology of collective indignation and disgust: what such feelings are supposed to track, how she distinguishes a settled shared conviction from a vocal minority or a moral panic, and what threshold of agreement must be crossed before coercion becomes admissible.
  - The asymmetry problem: if the value is cohesion, why does enforcement in practice target sexual conduct rather than infidelity, greed, or the refusal of ordinary duties of mutual aid — and a demand that she name one norm whose enforcement would cut against her own sympathies.
  - The dynamism problem: the view entrenches whatever morality is in force, yet the changes she herself welcomes required the law to run ahead of, or at least to decline to police, settled opinion. How is a legislator to tell an emerging morality from a dissolving one?

  Reserve the final question for whether her sociological version collapses back into a long-run harm principle, and have it ask her to state the empirical claim she will accept testing, the measure she will accept, and the result that would force her to abandon the view. Add two questions of your own choosing at whatever you judge to be the position's softest point, and flag any question where you expect a rehearsed answer together with the pivot that should follow it.
reasoning: |-
  Okay, the user is a journalist for a monthly magazine covering law and social sciences. They're preparing for a 45-minute interview with a legal philosopher who defends modernized legal moralism. The philosopher argues that criminal law can prohibit conduct condemned by a society's conventional morality because shared norms support institutions enabling cooperation. She's familiar with Hart and Devlin and counters objections by framing her argument as sociological, focusing on trust and social capital rather than Devlin's disintegration thesis.

  The user wants me to draft nine or ten questions covering specific areas: Hart's charge about the disintegration argument sliding between definitional and empirical claims; the treason analogy; epistemology of collective indignation; asymmetry in enforcement; and the dynamism problem. They also want a final question asking if this view collapses into a harm principle, plus two additional questions targeting soft points. I should flag any rehearsed answers and suggest pivots.

  I need to design questions that cut to the core of her arguments while avoiding restatement. For Hart's charge, I should address her retreat to "load-bearing norms" and demand a test to distinguish them from decorative ones preemptively. The treason analogy question should probe whether private conduct can truly threaten society like treason does. For collective indignation, I'll question how to measure genuine consensus versus moral panics. The asymmetry problem should highlight why enforcement targets certain behaviors like sexual conduct but not others like greed. The dynamism problem should challenge how her theory accommodates moral progress when past changes required law to lead public opinion.

  For the final question, I'll ask if her position is essentially a long-run harm principle in disguise and demand falsifiable criteria. For my two additional questions, I'll target social capital metrics and the risk of minority suppression. I'll flag where she might pivot to sociological framing and suggest pressing on empirical claims.

  The user likely wants to expose tensions in her theory for an insightful interview. They probably need questions that force concrete answers beyond rehearsed arguments. Deeper needs might include clarifying whether her modernized moralism avoids Devlin's pitfalls, and if it can withstand empirical scrutiny. I'll ensure questions push her to defend the practicality and fairness of her framework.
answer: |-
  Here are ten questions designed to probe the core tensions in her modernized legal moralism, incorporating your specific requests and targeting key vulnerabilities. I've flagged rehearsed pivots and suggested follow-up pressure points.

  1.  **Hart's Core Charge & The Load-Bearing Distinction:** "Professor, Hart argued Devlin slid between claiming moral change *defines* a new society and claiming it *causes* societal collapse. You avoid that by focusing only on 'load-bearing norms' essential for trust and cooperation. But how do we identify *which specific norms* are truly load-bearing *before* removing them? Given we often only recognize their necessity in hindsight, what *predictive, objective test* can legislators or courts apply in advance to distinguish a load-bearing norm from one that's merely 'decorative'?"  
      *(Point: Forces her to operationalize "load-bearing," demanding a practical, falsifiable criterion for identifying essential norms prospectively, exposing the inherent difficulty.)*  
      *Flag:* Expect pivot to "functional analysis" or "institutional role." *Pivot Follow:* "But doesn't that functional analysis itself rely on contestable sociological assumptions? Can you give a concrete example of applying this test *ex ante* to a contested norm?"

  2.  **The Treason Analogy: Threshold & Privacy:** "You often invoke the analogy to treason – the law prohibiting acts threatening the state's very existence – to justify prohibiting acts threatening the 'society' sustained by load-bearing norms. What *magnitude of threat* must a norm violation realistically pose to justify this analogy? Specifically, how can purely *private consensual conduct*, conducted discreetly, ever meet this high threshold of posing an existential threat to societal institutions?"  
      *(Point: Tests the seriousness required by the treason analogy and challenges its applicability to private acts unlikely to have broad, destabilizing consequences.)*

  3.  **Epistemology of Collective Morality: Tracking Truth & Measuring Consensus:** "Your argument relies on enforcing norms rooted in 'settled shared conviction' expressed through collective indignation or disgust. Leaving aside the reliability of disgust as a moral guide, *what is this collective feeling supposed to track* – objective moral truth, functional necessity, or mere preference? And crucially, *how do we reliably measure* when a conviction is 'settled' and 'shared' enough to justify coercion? How do you guard against mistaking a vocal minority, a transient moral panic, or manipulated sentiment for genuine societal consensus?"  
      *(Point: Challenges the epistemic basis of using collective feeling as a guide for law and demands a concrete metric for determining sufficient consensus.)*  
      *Flag:* Expect pivot to "democratic processes" or "sustained public discourse." *Pivot Follow:* "But democratic processes can encode minority views or panics. What specific *threshold* (e.g., polling %, legislative supermajority, duration of consensus) would you require *beyond* simple legislative enactment?"

  4.  **The Asymmetry Problem: Selective Enforcement & Personal Sympathies:** "If the core value is social cohesion, why does legal moralism in practice overwhelmingly target *certain* areas, like non-standard sexual conduct, while largely ignoring equally powerful sources of social distrust like pervasive infidelity, rampant greed undermining fairness, or widespread refusal of ordinary duties of mutual aid? Doesn't this practical asymmetry suggest the theory is often a cover for enforcing parochial prejudices rather than protecting essential cooperation? **Could you name *one* norm currently widely held whose legal enforcement you believe would genuinely bolster social cohesion, but which cuts strongly against your *own* moral sympathies?**"  
      *(Point: Highlights the selective historical application of moralism, suggesting bias, and forces her to confront the personal cost/consequence of her theory by naming a norm she dislikes but deems essential.)*

  5.  **The Dynamism Problem: Entrenchment vs. Progress:** "Your view seems to inherently favor entrenching the *current* conventional morality as load-bearing. Yet, many moral advances we now celebrate – from ending slavery to decriminalizing homosexuality – required the law to *run ahead* of settled opinion or to *cease policing* deeply held conventional moralities. How can your theory accommodate necessary moral progress? How is a legislator, guided by your framework, supposed to distinguish between an 'emerging morality' that should be accommodated and a 'dissolving norm' whose removal threatens collapse?"  
      *(Point: Challenges the theory's ability to handle moral change and progress, exposing a potential conservative bias.)*

  6.  **(Your Own Question 1 - Social Capital Metrics):** "You ground your modernized moralism in protecting 'social capital' and 'trust' necessary for cooperation. But social scientists measure these concepts in diverse and often contested ways (e.g., generalized trust surveys, civic participation rates, institutional confidence). *Which specific, measurable indicators of social capital or trust decline would you consider credible evidence that a particular norm's violation, or the failure to legally prohibit it, is actually damaging the load-bearing institutions of cooperation?*"  
      *(Point: Targets the soft point of defining/measuring the core sociological concepts her theory relies upon, demanding empirical specificity. Soft Point: Vagueness of key sociological terms.)*

  7.  **(Your Own Question 2 - Minority Suppression & Stability Cost):** "Couldn't the enforcement of majority morality based on collective indignation *itself* erode social capital by alienating minorities, breeding resentment, and undermining perceived legitimacy and fairness within those very institutions of cooperation it seeks to protect? Doesn't this create a potential trade-off between enforcing cohesion through shared norms and maintaining stability through perceived justice? How do you weigh this potential cost?"  
      *(Point: Targets the soft point that enforcement might *undermine* the very cohesion it seeks, introducing a countervailing sociological risk. Soft Point: Unintended consequences of enforcement.)*

  8.  **The Scope of "Cooperation":** "You argue load-bearing norms sustain 'ordinary cooperation.' But societies host *many* forms and levels of cooperation – from fleeting market transactions to deep familial bonds. Does your theory imply that the criminal law is justified in enforcing norms essential for *any* level of cooperation, or only for the most fundamental, society-sustaining types? How do we define that threshold level of 'ordinary cooperation'?"  
      *(Point: Probes the boundaries of the "cooperation" her theory seeks to protect, preventing overreach.)*

  9.  **The Harm Principle Redux - Final Question:** "Critics might argue your sociological framing – prohibiting conduct that erodes essential trust, causing long-run institutional harm – effectively *collapses back into a sophisticated, long-run version of the harm principle*, just defining 'harm' as damage to social capital. If this isn't accurate, what *specifically* distinguishes your justification from a harm principle? And crucially, to test your core empirical claim: **What specific, falsifiable prediction does your theory make? What measurable outcome (e.g., a specific decline in X social capital indicator within Y timeframe following Z type of norm decriminalization) would constitute evidence forcing you to abandon the view that legal prohibition was necessary to prevent institutional damage?**"  
      *(Point: Directly challenges the distinction from the harm principle and demands a concrete, testable empirical claim with a defined falsification criterion.)*

  10. **The Role of Alternative Institutions:** "Even if we accept that certain norms are load-bearing for cooperation, why must the *criminal law* be the primary tool for their enforcement? Couldn't other institutions – families, communities, religious groups, civil society organizations, or even non-criminal legal mechanisms (torts, contracts) – adequately sustain these norms without resorting to state punishment and the significant costs of criminalization?"  
      *(Point: Questions the *necessity* of criminal law for her stated goal, challenging its proportionality and exploring less coercive alternatives.)*

  **Interview Flow Notes:**

  *   Start with 1 (Hart/Load-Bearing) to establish the core framework and its vulnerability.
  *   Follow with 3 (Epistemology) and 4 (Asymmetry) to challenge the inputs and outputs of the framework.
  *   Hit 2 (Treason) and 5 (Dynamism) to test the boundaries and historical applicability.
  *   Insert your custom questions 6 & 7 to probe the sociological foundations and risks.
  *   Use 8 (Scope) and 10 (Alternatives) to refine the scope and necessity.
  *   End forcefully with 9 (Harm Principle Redux/Falsification) demanding empirical accountability.
  *   Be prepared to **firmly but politely interrupt** rehearsed pivots (especially on 1, 3, 9) and press for concrete answers using the suggested follow-ups. Phrases like "But specifically...", "Let me press you on that point...", or "What I'm really asking for is a concrete example/criterion..." can be useful.
  *   The demand in Q4 (name a norm against your sympathies) is deliberately provocative – be ready to handle the reaction and press if she avoids it.
