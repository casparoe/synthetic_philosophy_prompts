  **Part (b): System B**  
  No, MU is not derivable in System B.  
  **Proof by induction over derivation length:**  
  Define an invariant: *The number of I’s in the string is not divisible by 3* (i.e., \( \text{I-count} \not\equiv 0 \pmod{3} \)).  
  - **Base case (Axiom MI):** "MI" has 1 I. \( 1 \not\equiv 0 \pmod{3} \). Invariant holds.  
  - **Induction step:** Assume all strings derivable in \( k \) steps satisfy the invariant. Consider a string \( t \) derived in \( k+1 \) steps by applying a rule to a string \( s \) (which satisfies the invariant by the induction hypothesis).  
    - **Rule I:** Appends U. I-count unchanged → invariant preserved.  
    - **Rule II:** Doubles the substring after M. If \( s = \text{M}x \), \( t = \text{M}xx \). I-count of \( t \) is \( 2 \times \text{I-count}(x) \). Since \( \text{I-count}(s) = \text{I-count}(x) \not\equiv 0 \pmod{3} \), doubling modulo 3 yields \( 2 \times 1 \equiv 2 \pmod{3} \) or \( 2 \times 2 \equiv 1 \pmod{3} \) (never 0).  
    - **Rule IV:** Deletes UU. I-count unchanged → invariant preserved.  
    - **System B Rule:** Replaces three I’s with two U’s. I-count decreases by 3. Since \( \text{I-count}(s) \not\equiv 0 \pmod{3} \), subtracting 3 (equivalent to subtracting 0 modulo 3) preserves the residue → \( \text{I-count}(t) \not\equiv 0 \pmod{3} \).  
