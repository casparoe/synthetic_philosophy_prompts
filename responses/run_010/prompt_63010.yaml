  **Part (d) [5 marks]**: Explain what the contrast between System A and System B shows about the difference between deriving strings inside a system and reasoning about the system from outside. In your answer, for each system (A and B) point to the specific step in your proof (from part a or b) where the argument leaves the system (i.e., uses reasoning that is not a step-by-step derivation within the system). Also, explain what licenses that step (i.e., what allows us to use such outside reasoning). Avoid general philosophical discussions; focus on the specific proofs.

