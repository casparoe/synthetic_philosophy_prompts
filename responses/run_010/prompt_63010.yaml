  - Rule II: If you have Mx, you may make Mxx. (Doubling what follows M.)
  - Rule IV: If a string contains UU, you may delete it. (Formally: If you have xUUy, you may make xy.)

  However, Rule III is replaced in each system as follows:

  - In System A: Any run of four consecutive I's may be replaced by a single U. (Formally: If you have xIIIIy, you may make xUy.)
  - In System B: Any run of three consecutive I's may be replaced by two U's. (Formally: If you have xIIIy, you may make xUUy.)

  Note: The original Rule III (replace III by U) is not available.

  **Part (a) [8 marks]**: For System A, determine whether the string MU can be derived from the axiom MI. If yes, provide a step-by-step derivation (naming the rule used at each step). If no, provide a proof that covers all possible derivations (not just short ones).

