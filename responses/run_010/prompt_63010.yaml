  ### Exam Question: Modified MIU Systems (Total: 25 marks; Time: 50 minutes)

  **Background:**  
  We explore two variants of the MIU system. The alphabet is {M, I, U}, and the axiom is MI. The rules are:  
  - **Rule I:** Append U to any string ending in M. (If \( x\text{M} \), derive \( x\text{MU}\).)  
  - **Rule II:** Double the string after the initial M. (If \( \text{M}x \), derive \( \text{M}xx\).)  
  - **Rule IV:** Delete any adjacent pair of U’s. (If \( x\text{UU}y \), derive \( xy\).)  

  **Modified Rule III:**  
  - **System A:** Replace any run of four consecutive I’s with U. (If \( x\text{IIII}y \), derive \( x\text{U}y\).)  
  - **System B:** Replace any run of three consecutive I’s with two U’s. (If \( x\text{III}y \), derive \( x\text{UU}y\).)  

  The original Rule III (replacing III with U) is **not** available in either system.  

