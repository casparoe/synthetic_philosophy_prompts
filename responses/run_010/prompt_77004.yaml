answer: |-
  Here’s the adjudication spec for claims of the form "the world is becoming less violent," designed to force framing disagreements into the open and distinguish substantive errors from legitimate interpretive choices. Requirements are non-negotiable for assessability unless marked as **framing-dependent**.

  ### Core Requirements for Assessability
  | Requirement                                  | Case/Consideration Behind It                                                                 |
  |---------------------------------------------|----------------------------------------------------------------------------------------------|
  | **1. Explicit Denominator Specification**   | Absolute numbers vs. rates (per capita, per interaction, etc.) answer fundamentally different questions. Per capita measures individual risk exposure; absolute numbers measure total societal harm burden. Neither is "correct" universally—this is **framing-dependent** (normative: whose perspective matters?). |
  | **2. Defined Violence Category**            | Without specifying what counts as violence (e.g., only physical intent? Structural deprivation? Verbal threats?), the claim is untestable. Must state boundaries and justify exclusions (e.g., "only acts with immediate physical intent") because category drift over time invalidates trend comparisons. **Non-negotiable**. |
  | **3. Stated Aggregation Rule**              | When sub-indicators conflict (e.g., homicide ↓ but incarceration ↑), aggregation requires weighting. Must declare weights (e.g., deaths prioritized, suffering-duration weighted) or admit incomparability. Ignoring this conflates trends. **Framing-dependent** (normative: what harms matter most?). |
  | **4. Timeframe and Baseline**               | "Becoming" implies change over a period. Must specify start/end points and counterfactual (e.g., "less violent since 1900 than 1800-1900" or "vs. a no-industrialization scenario"). Heavy-tailed processes require justifying the window’s representativeness. **Non-negotiable**. |
  | **5. Measurement Validity Acknowledgment**  | Must address: (a) **Underreporting Bias**: Historical silence ≠ absence; rising reports may reflect better recording. (b) **Deterrence Paradox**: Prevented violence leaves no trace; ignoring it biases toward decline. (c) **Definitional Shift**: "Assault" in 1800 ≠ 2020. Doesn’t require solving these, but must not assume data neutrality. **Non-negotiable**. |
  | **6. Distinction Between Violence & Outcome** | Death/suffering from policy, neglect, or economic systems may not be "violent" if violence requires agency/intent. Must clarify if "harm reduction" is the real claim. **Framing-dependent** (normative: is unintentional but foreseeable harm "violent"?). |

  ---

  ### Unsatisfiable Cluster & Its Implications
  The triad **{Stable Category Across Time, Moral Relevance to Present Concerns, Determinable Truth Value}** is jointly unsatisfiable.  
  - **Why**: A category stable across centuries (e.g., "intentional bodily harm") loses moral relevance by excluding modern understandings of systemic harm (e.g., structural racism, climate-driven displacement). Conversely, a morally expansive category (e.g., "preventable suffering") cannot be measured stably over long periods due to shifting norms/definitions. **Implication**: You cannot have a historically consistent, morally compelling, *and* empirically determinate answer. **Resolution**: Drop the demand for **Stable Category** and accept that "violence" is evaluative, not natural. This makes the claim inherently contestable (like "weediness"), but not meaningless—disputes become about which framing best serves human flourishing.

  ---

  ### Key Insights
  - **Most Exclusionary Requirement**: **#2 (Defined Violence Category)**. Excluding structural harm eliminates structural critics; including it often breaks long-term measurability, excluding rate optimists.  
  - **Framing-Dependent vs. Non-Negotiable**:  
    - **Non-Negotiable**: #2, #4, #5 (without these, the claim is incoherent or unfalsifiable).  
    - **Framing-Dependent**: #1 (denominator), #3 (aggregation), #6 (harm vs. violence)—disagreements here are legitimate, not errors.  
  - **"Garden Weed" Analogy**: Holds perfectly. "Violence" is not a natural kind; it requires normative pruning (what counts?) and cultivation goals (less weeds for whom?). It breaks only if you insist violence is objective like gravity.

  ---

  ### Camp Scoring vs. Spec
  - **Rate-Based Optimist**: Passes #1, #4, #5 (if cautious) but fails #2 (over-narrow category), #3 (unweighted aggregation), #6 (ignores non-interpersonal harm). **Error**: Assuming rate decline settles moral progress.  
  - **Structural-Violence Critic**: Excels at #2 (expansive category), #3 (suffering-weighted), #6 but fails #1 (rejects per capita), #5 (dismisses data limitations as apologetics). **Error**: Conflating measurable violence with all injustice.  
  - **Heavy-Tailed Skeptic**: Passes #4, #5 (highlights indeterminacy) but fails #2 (often undefined category), #3 (no aggregation). **Error**: Using tail risk to reject any trend claim.  

  **Adjudication Takeaway**: Disagreements are substantive only when violating non-negotiables (#2, #4, #5). Elsewhere, they reflect incompatible frames—e.g., "individual safety" (per capita) vs. "total harm burden" (absolute). The question *is* assessable once framed, but no frame is neutral.
