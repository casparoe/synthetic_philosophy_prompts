  First, I need to unpack the components of this fact-checking system. The ladder has six categories, from "True" to "Pants on Fire." The checkability gate excludes non-verifiable statements. The promise tracker scores promises, and there's an annual "Lie of the Year." The platform uses overlays and demotions. The user questions the degree-based truth measurement, the gate's assumptions, and the inclusion of character judgments in the sixth category and "Lie of the Year." They also want to explore the rival diagnosis that misinformation isn't about lack of facts but about closed trust networks.

  The user's explicit request is to reconstruct the epistemology and identify its load-bearing parts. But deeper, they want to ensure the protagonist's crisis is credible. They need to know if the system's inconsistencies are flaws the character should feel guilty about or if they reveal deeper issues. The protagonist stumbles upon a rival diagnosis—relational trust issues vs. informational lack—but lacks the vocabulary. The user needs this articulated to develop the character's intellectual breakdown.

  Breaking down the ladder: Truth degrees. The ladder measures multiple things—propositional accuracy, evidence quality, speaker's intent, audience perception. This ambiguity is a weak point. The "Pants on Fire" category introduces intent and absurdity, conflicting with the system's claim of objectivity. The "Lie of the Year" adds culpability, which is inconsistent. These elements are load-bearing because without them, the system might seem too clinical, but they undermine its stated objectivity.

  The checkability gate assumes a clean fact/value split. But real discourse is messy. The gate excludes influential claims, which is a problem if the goal is public clarity. This gate is foundational; without it, the ladder couldn't function, but it's also a vulnerability because it ignores context-dependent claims.

  The platform mechanics assume a deficit model: correct info leads to belief change. But the rival diagnosis is about trust ecosystems. If the audience is in a closed trust network, corrections from outside sources are seen as partisan. The fact-checking institution's structure as an unelected panel relies on pre-accepted authority, which clashes with the trust-based diagnosis.

  For the protagonist's crisis, she needs to realize that the system's design prevents it from addressing trust issues. The ladder and gate can't handle relational problems. The annual prize might need replacing with cross-partisan credibility efforts. The platform contract would require endorsements from diverse sources instead of verdicts.

