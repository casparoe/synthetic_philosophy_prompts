answer: |-
  Based on Sieyès' core principles of constituent power and the absolute sovereignty of the pre-constitutional nation, here's how he would reason about the proposal:

  1.  **On the Referendum Proposal Itself:**
      *   **Illegitimate Participants:** Sieyès would fundamentally reject the premise of the referendum. The very act of allowing non-citizens (passive citizens or foreigners) to vote on *any* matter, especially one concerning the fundamental composition of the sovereign nation (the electorate), is an abdication of constituent power. The nation, defined by its existing citizenry (specifically the active citizens who embody the constituent power), is the sole entity that can determine its own composition and the rules for its political existence. Outsiders have no legitimate voice in this foundational decision. Including them usurps the nation's exclusive right to constitute itself.
      *   **Exercise or Abdication?** Holding such a vote would be a profound **abdication** of constituent power, not an exercise of it. Constituent power is exercised *by* the nation (active citizens) *on itself* and its constitution. Delegating the decision on the fundamental boundary of the nation – who *is* the nation capable of exercising constituent power – to a group that explicitly includes those outside the nation (non-citizens) surrenders the nation's defining sovereignty. It allows the "outside" to determine the "inside," which is anathema to Sieyès' conception of the nation as the prior, self-defining entity.
      *   **Meaning of a Negative Result:** A negative result (rejecting extending the vote) would be utterly **meaningless and non-binding** from Sieyès' perspective. The vote itself was illegitimate because the wrong body (including non-nationals) made the decision. The nation (existing active citizens) cannot be bound by a procedure it did not authorize and which included voices it did not recognize as part of itself. The nation remains free to make this decision through its *own* proper channels (e.g., an assembly of active citizens) regardless of the referendum outcome. The result settles nothing for the nation.

  2.  **On a Constitutional Court Invalidating the Referendum:**
      *   **Court's Authority Limited:** Sieyès would argue that a constitutional court derives its authority entirely from the constituted order – the constitution created *by* the constituent power (the nation). Its role is to ensure constituted powers (like the legislature or executive) act within the bounds set by the constitution.
      *   **Cannot Bind the Nation:** The court absolutely **cannot bind the nation itself** exercising its constituent power. If the nation, through its representatives (an assembly embodying the constituent power), decided to hold such a referendum (even if Sieyès would find it ill-advised), that act would be an expression of the sovereign will. A constitutional court, a *constituted* power, has no authority to invalidate an act of the *constituent* power. To allow a court to override the nation's fundamental will would be to place a constituted authority above the sovereign itself, destroying the hierarchy Sieyès established. The court's finding of procedural invalidity could only bind constituted bodies operating under the existing constitution; it cannot constrain the nation re-constituting itself or acting as constituent power.

  3.  **On Interests of People Not Yet Born:**
      *   **Outside the Constituent Power:** Sieyès' framework commits him unequivocally: the interests of people not yet born fall **entirely outside** the constituent power. The constituent power resides solely in the *present, existing nation*.
      *   **Conclusion Sieyès Would Recoil From:** This leads to a conclusion Sieyès would likely find normatively uncomfortable but is logically inescapable within his rigid framework: **The present nation has absolute, unconstrained authority to shape the constitutional and political future, with no inherent obligation to consider the interests of future generations.** The nation exists *now*. Its will is paramount *now*. It can establish rules that bind the future (through the constitution it creates), but the source of legitimacy and the power to make those rules resides only in the living members of the nation. Future generations only become part of the nation and acquire political rights (active or passive) once they exist and are recognized as such by the nation *at that future time*. They have no claim on the constituent power exercised by a prior generation. This commits Sieyès to a radical presentism that denies any inherent intergenerational obligation in the founding act.

  **Summary of Sieyès' Position & Its Difficulties:**

  Sieyès would reject the non-citizen referendum as an illegitimate surrender of the nation's exclusive constituent power. He would dismiss any court's attempt to invalidate an act of the constituent power as an impermissible subordination of the sovereign nation to a constituted body. Finally, his framework forces him to deny that unborn people have any place within or claim upon the constituent power, granting the present nation absolute authority over the future.

  **Where His Framework Leads to Recoil-Worthy Conclusions:**

  1.  **Majoritarian Absolutism:** His dismissal of the court's authority over constituent acts leads logically to the conclusion that the nation's will, however expressed (even through a flawed referendum he dislikes), is absolute and unchecked. There is no higher law or procedure to invalidate it. This risks tyranny of the majority in its most potent form.
  2.  **Radical Presentism & Disregard for the Future:** The complete exclusion of future generations from the scope of constituent power is perhaps the most stark and normatively troubling commitment. It provides no theoretical basis within Sieyès' framework for the common intuition that constitutions should embody long-term principles or sustainable governance considering future inhabitants. The living nation can, in theory, exhaust resources, establish permanent inequalities, or create unamendable constitutional structures binding future generations, solely based on its present will, with no inherent constraint based on the interests of those yet to come. Sieyès might have personally believed in enlightened principles for the future, but his theoretical framework offers no grounding for it. This is a direct, unavoidable, and deeply problematic consequence of locating sovereignty *exclusively* in the present, pre-constitutional nation.
