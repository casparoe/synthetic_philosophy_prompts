prompt: |-
  I'm drafting the framing section of a dissertation chapter on interpersonal aggregation, and I want the specification fixed before I start sorting through candidate repairs. Set out the desiderata for any theory of how individual welfare is to be combined into a social ordering that proposes to succeed where Harsanyi's aggregation theorem is thought either to fail or to need rescuing: which assumptions it must take an explicit stand on, and why each carries normative weight rather than being a technical convenience (the shape of the domain, anonymity, ex ante versus ex post unanimity, and above all the existence of a common zero and a common unit across individual utility functions); which cases it must get right, including the chronically deprived whose preferences have adapted to their circumstances, and unanimity over a prospect that is driven by agreement in belief rather than agreement in taste; which distinctions it must not collapse — between the impartial-observer theorem and the aggregation theorem, between level and unit comparability, and between a complete social ordering and a merely cycle-free one; and what it owes us when utilities are unbounded or populations infinite. For each item give the motivating consideration and mark it non-negotiable or a demand peculiar to one camp. Then say which subsets of the list you believe cannot be jointly satisfied — that is the part I most need — and which single requirement eliminates the most proposals. Close with two or three sentences each on where the familiar repairs land: supplying comparability through the observer's extended preferences, replacing the cardinal framework with a richer informational basis, and retreating to weighted aggregation with the weights fixed by some political procedure.
reasoning: |-
  Okay, the user is working on a dissertation chapter about interpersonal aggregation, specifically focusing on fixing the theoretical framework before evaluating possible solutions to problems with Harsanyi's aggregation theorem. They need a structured list of desiderata for any theory aiming to improve upon Harsanyi's approach, along with analysis of which combinations are incompatible and which requirements are most restrictive.

  First, I need to recall Harsanyi's theorem and its criticisms. Harsanyi combines utilitarianism with expected utility, assuming a social welfare function is a weighted sum of individual utilities under uncertainty. Criticisms include the need for cardinal utility comparisons, issues with adaptive preferences, and the distinction between beliefs and tastes.

  The user wants desiderata categorized into assumptions, cases to handle, distinctions to maintain, and technical requirements. Each item needs normative weight explained, marked as non-negotiable or camp-specific. Then, identify incompatible subsets and the most eliminative requirement. Finally, evaluate common repairs.

  Key areas from the query:
  1. **Assumptions**: Domain shape, anonymity, ex ante vs ex post unanimity, common zero/unit.
  2. **Cases**: Chronically deprived with adapted preferences, unanimity due to shared beliefs vs tastes.
  3. **Distinctions**: Impartial observer vs aggregation, level vs unit comparability, complete vs cycle-free ordering.
  4. **Technical**: Unbounded utilities, infinite populations.

  For normative weight:
  - **Domain**: Should include all possible prospects, as restricting options might hide injustices. Non-negotiable for comprehensive theories but some may accept restrictions.
  - **Anonymity**: Fundamental impartiality. Non-negotiable for most, but prioritarianism might object if weights aren't equal.
  - **Ex Ante/Ex Post Unanimity**: Ex post aligns with actual outcomes, which is normatively crucial. Non-negotiable for ex post Pareto advocates.
  - **Common Zero/Unit**: Necessary for meaningful utility comparisons. Non-negotiable for utilitarians but contested by ordinalists.

  Cases:
  - **Adapted Preferences**: Must avoid endorsing deprivation due to preference adaptation. Non-negotiable for theories concerned with objective welfare.
  - **Belief vs Taste Unanimity**: Should handle cases where agreement stems from shared beliefs, not tastes. Non-negotiable to avoid conflating epistemic and evaluative aspects.

  Distinctions:
  - **Observer vs Aggregation**: Prevents smuggling in aggregation through the observer setup. Non-negotiable for clarity.
  - **Level vs Unit Comparability**: Maintaining this distinction avoids overclaiming comparability. Non-negotiable for precise measurement.
  - **Complete Ordering**: Ensures decisiveness. Non-negotiable for practical application but some accept incompleteness.

  Technical:
  - **Unbounded Utilities**: Must handle infinite values responsibly. Non-negotiable for robustness.
  - **Infinite Populations**: Avoids paradoxes like Mere Addition. Non-negotiable for comprehensive theories.

  Incompatible subsets:
  - **Strong Pareto + Anonymity + Continuity**: Can conflict with non-Archimedean properties, as in Lauwers' impossibility.
  - **Ex Post Pareto + State-Dependent Utility**: If utilities are state-dependent, ex post Pareto might contradict ex ante under uncertainty.
  - **Complete Ordering + Vague Comparability**: If comparability is vague, forcing completeness may require arbitrary choices.
  - **Common Zero/Unit + Ordinalism**: Cardinal comparability conflicts with purely ordinal frameworks.

  Most eliminative requirement: **Common Zero and Unit**. Many theories (e.g., Rawlsian, ordinal approaches) reject cardinal comparability.

  Repairs evaluation:
  - **Extended Preferences**: Provides comparability but conflates observer with aggregation, might not handle adaptive preferences well.
  - **Richer Informational Basis**: Addresses comparability but may lose Harsanyi's simplicity and cardinality.
  - **Political Weights**: Avoids interpersonal comparisons but sacrifices ethical foundation for proceduralism.

  Need to ensure clarity on why certain combinations are incompatible and highlight the common zero/unit as the biggest hurdle. The user's deeper need is identifying a feasible theory that satisfies key desiderata without the pitfalls of Harsanyi, so emphasizing trade-offs is crucial.
answer: |-
  Here is a structured analysis of desiderata for theories of interpersonal welfare aggregation aiming to address limitations in Harsanyi's theorem, followed by incompatibility assessments and evaluations of common repairs. Items are categorized, normatively grounded, and flagged for negotiability. Key conflicts are identified, and the most eliminative requirement is highlighted.

  ---

  ### **I. Desiderata for a Theory of Interpersonal Aggregation**

  #### **A. Foundational Assumptions (Normative Stance Required)**
  1. **Domain Shape (Universal Domain)**  
     - *Requirement:* Social ordering must be defined for all possible profiles of individual preferences/utilities and all feasible social prospects.  
     - *Normative Weight:* Restricting the domain risks excluding "hard cases" (e.g., extreme inequality) where justice is most relevant. A theory of social ethics must be universally applicable.  
     - *Negotiability:* **Non-negotiable** for comprehensive theories; domain restrictions admit ad hoc avoidance of paradoxes.  

  2. **Anonymity (Symmetry)**  
     - *Requirement:* Permuting individual utilities does not change the social ordering.  
     - *Normative Weight:* Embodies impartiality—each person's welfare matters equally, irrespective of identity. Rejecting this permits arbitrary discrimination.  
     - *Negotiability:* **Non-negotiable** for egalitarians; *negotiable* for prioritarianism (weights may differ based on absolute levels).  

  3. **Ex Ante vs. Ex Post Unanimity (Pareto Principles)**  
     - *Requirement:* Distinguish between:  
       - *Ex Ante Unanimity:* If all individuals *expect* higher utility from prospect A over B, society prefers A.  
       - *Ex Post Unanimity:* If, in every possible state of the world, all individuals have higher utility in A than in B, society prefers A.  
     - *Normative Weight:* Ex post unanimity ensures actual outcomes (not just expectations) drive social decisions, avoiding exploitation under uncertainty. Ex ante respects autonomy in beliefs.  
     - *Negotiability:* **Ex post unanimity non-negotiable** for consequentialists; ex ante may be relaxed to avoid spurious agreements (e.g., shared irrational beliefs).  

  4. **Common Zero and Common Unit (Cardinal Comparability)**  
     - *Requirement:* Individual utilities must be comparable in both zero (absence of welfare) and unit (marginal utility) across persons.  
     - *Normative Weight:* Without this, aggregation is arbitrary (e.g., doubling one utility scale could reverse social ordering). Anchors ethical judgments to interpersonal significance, not just preference intensity.  
     - *Negotiability:* **Non-negotiable** for Harsanyi-inspired utilitarians; *rejected* by ordinalists or capability theorists.  

  #### **B. Cases to "Get Right" (Substantive Robustness)**  
  5. **Adapted Preferences (e.g., Chronically Deprived)**  
     - *Requirement:* Social ordering must not entrench deprivation by deferring to "adaptive" preferences (e.g., a contented slave).  
     - *Normative Weight:* Justice requires correcting for false consciousness/powerless resignation; welfare must track objective interests.  
     - *Negotiability:* **Non-negotiable** for critical theories (e.g., Nussbaum); *negotiable* for preference-respect libertarians.  

  6. **Belief-Driven vs. Taste-Driven Unanimity**  
     - *Requirement:* Distinguish unanimous agreement due to shared *beliefs* (e.g., same probability estimates) from shared *tastes* (e.g., same risk aversion).  
     - *Normative Weight:* Agreement from beliefs may mislead (e.g., unanimous investment in a Ponzi scheme). Social rationality should separate epistemic from evaluative consensus.  
     - *Negotiability:* **Non-negotiable** for epistemic democrats; *relaxed* in thin theories of preference.  

  #### **C. Distinctions to Maintain (Conceptual Clarity)**  
  7. **Impartial Observer vs. Aggregation Theorem**  
     - *Requirement:* Do not conflate Harsanyi's impartial observer (single ethical agent) with aggregation (combining multiple utilities).  
     - *Normative Weight:* Observer setups risk smuggling aggregation through the backdoor (e.g., via extended preferences), obscuring democratic legitimacy.  
     - *Negotiability:* **Non-negotiable** for proceduralists; *blurred* in unified frameworks (e.g., Harsanyi himself).  

  8. **Level vs. Unit Comparability**  
     - *Requirement:* Level comparability (comparing utility *differences*) ≠ unit comparability (comparing absolute *levels*).  
     - *Normative Weight:* Level comparability suffices for prioritarianism; unit comparability is essential for utilitarianism. Collapsing them overstates available information.  
     - *Negotiability:* **Non-negotiable** for measurement theorists; ignored in ordinal approaches.  

  9. **Complete Social Ordering**  
     - *Requirement:* Social preferences must be transitive and complete (any two prospects ranked).  
     - *Normative Weight:* Incompleteness invites indecision in policy, violating the state's role to act decisively.  
     - *Negotiability:* **Non-negotiable** for policy-relevant theories; *relaxed* in deliberative democracy models.  

  #### **D. Technical Demands (Formal Rigor)**  
  10. **Unbounded Utilities**  
      - *Requirement:* Handle infinitely high/low utilities (e.g., Pascal's Wager scenarios).  
      - *Normative Weight:* Avoids exploitative trade-offs (e.g., sacrificing finite suffering for infinite gain).  
      - *Negotiability:* **Non-negotiable** for robust aggregation; boundedness often a technical crutch.  

  11. **Infinite Populations**  
      - *Requirement:* Extend aggregation to infinitely large societies (e.g., future generations).  
      - *Normative Weight:* Essential for climate ethics, population policy. Finite-only theories are myopic.  
      - *Negotiability:* **Non-negotiable** for longtermists; *circumvented* by contractualists.  

  ---

  ### **II. Incompatible Subsets of Desiderata**  
  The following sets **cannot be jointly satisfied** by any single aggregation theory:  
  - **Anonymity + Strong Ex Post Pareto + Continuity + Infinite Populations**: Leads to **Lauers' impossibility** (no non-dictatorial ordering exists under continuity).  
  - **Ex Post Unanimity + State-Dependent Utility**: If utilities are state-dependent (*not* vNM), ex post Pareto can contradict ex ante Pareto under uncertainty.  
  - **Complete Ordering + Vague Comparability**: If utility comparisons are inherently vague (e.g., Sen's "fuzzy" comparability), completeness forces arbitrary precision.  
  - **Common Zero/Unit + Ordinalism**: Cardinal comparability clashes with purely ordinal frameworks (e.g., Rawlsian primary goods).  

  ---

  ### **III. Most Eliminative Requirement**  
  **Common Zero and Common Unit** eliminates the most proposals:  
  - It disqualifies all ordinal theories (e.g., Rawls, Arrow), "fuzzy" comparability approaches (Sen), and resourcist frameworks (Dworkin).  
  - *Why?* Without cardinal comparability, weighted aggregation lacks an ethical anchor—weights become arbitrary. Only cardinal-utilitarian and prioritarian theories survive.

  ---

  ### **IV. Evaluation of Familiar Repairs**  
  1. **Extended Preferences (e.g., Harsanyi/Mirrlees)**  
     - *Approach:* Ground comparability in an observer's hypothetical preferences over "being anyone."  
     - *Verdict:* Provides cardinal comparability but **collapses the observer/aggregation distinction** (desideratum 7). Fails on adapted preferences (e.g., observer may "accept" deprivation) and infinite populations.  

  2. **Richer Informational Basis (e.g., Sen's Capabilities)**  
     - *Approach:* Replace utilities with capabilities/functionings to avoid adaptive preferences.  
     - *Verdict:* Solves adapted preferences (desideratum 5) but **abandons cardinal comparability** (desideratum 4). Requires ad hoc weighting of capabilities, risking incompleteness (desideratum 9).  

  3. **Procedurally Fixed Weights (e.g., Political Liberalism)**  
     - *Approach:* Set weights via democratic process, avoiding interpersonal comparisons.  
     - *Verdict:* Dodges comparability demands but **violates unanimity** (desideratum 3) if minorities dissent. Vulnerable to belief-driven errors (desideratum 6) and may entrench inequality (desideratum 5).  

  ---

  ### **Summary for Your Framing**  
  The core tension lies between *cardinal comparability* (essential for precision but ethically demanding) and *robustness to hard cases* (e.g., adaptive preferences, infinity). No repair satisfies all desiderata: extended preferences conflate key distinctions, richer information bases lose comparability, and procedural fixes sacrifice ethical grounding. Prioritize desiderata 4 (common zero/unit), 5 (adapted preferences), and 11 (infinite populations) as litmus tests—their joint satisfaction may require abandoning Harsanyi's vNM framework entirely. For your chapter, structure candidate repairs around which "non-negotiable" demands they violate and which incompatibilities they navigate.
