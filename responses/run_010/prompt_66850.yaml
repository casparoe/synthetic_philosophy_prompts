answer: |-
  Here is a numbered menu disambiguating the phrase "there is no self," analyzing each thesis, and applying it to your group's situation:

  ### The Menu of Theses Expressed by "There is no self"

  1.  **Thesis: No Phenomenologically Found Self**
      *   **Claim Type:** About how experience is structured from the inside.
      *   **Description:** Upon careful introspection (e.g., meditation), no permanent, unchanging, independent "core self" *is observed* as the subject or owner of experiences. Experience arises as a dynamic flow of perceptions, thoughts, feelings, etc., without a central controller or unchanging essence *appearing within it*. (Common introspective report in Buddhism/Phenomenology).
      *   **Room for Conventional Persons/Psych Continuity?** Yes. Readily compatible. Persons exist conventionally as patterns of experience and behavior; psychological continuity is the primary mode of this conventional existence.
      *   **Vulnerable to Self-Undermining Objection?** No. Memory, intention, and consequences still occur *within* the conventional flow; the thesis only denies finding a specific *kind* of entity *within experience*.
      *   **Strength:** Near-trivial (descriptive).

  2.  **Thesis: The Self is a Construct/Conceptual Designation (Reductionism)**
      *   **Claim Type:** About what exists fundamentally & conventionally; about how we conceptualize.
      *   **Description:** What we call a "self" or "person" is not a fundamental, simple entity. It is a useful conceptual label applied to a causally connected bundle/stream of physical and mental events (aggregates/skandhas). Identity over time is constituted by relations of psychological continuity/causation (memory, intention, character), not by an underlying substance. (Parfitian Reductionism / Buddhist Abhidharma reductionism).
      *   **Room for Conventional Persons/Psych Continuity?** Yes. Persons exist *conventionally* precisely *as* these causally connected bundles/streams. Psychological continuity *is* what matters for survival and personhood at the conventional level; it *defines* conventional existence.
      *   **Vulnerable to Self-Undermining Objection?** No. Memory, intention, and consequences happen *within* the conventional causal stream. The "no one" objection mistakes the denial of a *fundamental* self for the denial of the *conventional* subject/agent, which this thesis affirms as real conventionally.
      *   **Strength:** Moderate (Metaphysically revisionist but not eliminative).

  3.  **Thesis: No Self Exists Ultimately (Emptiness of Self)**
      *   **Claim Type:** About what exists fundamentally (ultimately).
      *   **Description:** While persons exist conventionally (as in #2), they *lack intrinsic existence* (svabhava). They are empty. There is no findable, independent, self-defining essence "self" at the ultimate level of analysis. Their existence is dependently arisen and merely imputed. (Madhyamaka Buddhism / Prasangika).
      *   **Room for Conventional Persons/Psych Continuity?** Yes. Emphatically affirms conventional persons and the reality of the causal processes (like psychological continuity) that constitute them, *precisely because* they lack intrinsic existence. Convention is all there is, and it's real conventionally.
      *   **Vulnerable to Self-Undermining Objection?** No. Conventional agents remember, intend, and bear consequences. The objection fails to grasp the two-truths framework; it demands an ultimate self to perform conventional actions, which is incoherent within this view.
      *   **Strength:** Modest Ontological Deflation (denies ultimate existence, affirms robust conventional existence).

  4.  **Thesis: The Self is a Harmful Illusion (Pragmatic Elimination)**
      *   **Claim Type:** Primarily about which practical attitudes are appropriate (with ontological implications).
      *   **Description:** Belief in a substantial, enduring self is the root cause of suffering (dukkha), attachment, and aversion. For practical purposes (ending suffering), we must *treat* the self *as if* it doesn't exist, relinquishing identification and ownership. While not necessarily denying the conventional stream (#2), the *attitude* towards it is radically altered. (Buddhist Soteriology / Therapeutic focus).
      *   **Room for Conventional Persons/Psych Continuity?** Yes (often implicitly). Psychological continuity is acknowledged as the process we mistakenly identify with. Persons exist conventionally but clinging to their substantiality is abandoned.
      *   **Vulnerable to Self-Undermining Objection?** Indirectly, but not fatally. The objection highlights the *difficulty* of the practical project – how *can* memory/intention work without a self? – but proponents argue these functions work *better* without the distorting lens of self-clinging, precisely *because* the conventional process continues. The objection misunderstands the pragmatic goal.
      *   **Strength:** Primarily Practical.

  5.  **Thesis: No Self Exists At All (Strong Eliminativism / Illusionism)**
      *   **Claim Type:** About what exists at all (fundamentally *and* conventionally).
      *   **Description:** The self is not just non-fundamental or conventionally real; it is a complete fiction, like the Tooth Fairy. There are only impersonal physical and mental events/processes. Talk of "persons" is either false or a mere façon de parler with no genuine referent. Strict identity over time makes no sense; only degrees of causal connectedness exist. (Hard Eliminative Materialism / Illusionism about self).
      *   **Room for Conventional Persons/Psych Continuity?** **No** for persons existing conventionally *as persons*. **Yes** for psychological continuity, but *only* re-described as *impersonal* causal relations (e.g., "memory" is just one brain state causing another with similar content, not *someone* remembering).
      *   **Vulnerable to Self-Undermining Objection?** **Yes, directly.** If there is *no* self *at all*, not even conventionally as a useful designation for a bundle, then it becomes deeply puzzling to explain the *subjectivity* of experience, the *ownership* of actions/intentions, or why *this specific* causal chain should bear the consequences intended for *that specific* earlier causal chain. It struggles to account for the first-person perspective inherent in memory, intention, and moral responsibility without smuggling in a subject.
      *   **Strength:** Ontologically Extravagant Eliminativism.

  ### Analysis of Your Group Members

  *   **Member 1 (Buddhist thought anticipated reductionism):** This member is relying on **Thesis #2 (The Self is a Construct/Conceptual Designation)** or closely related to **Thesis #3 (No Self Exists Ultimately)**. They explicitly mention the reductionist view ("nothing over and above causally connected events") and the idea that identity doesn't matter, only continuity ("strict identity over time is not what matters"). This is classic Parfitian reductionism, mirrored in Buddhist Abhidharma and compatible with Madhyamaka's conventional level (#3). They focus on the *analysis* of what a person *is* (a bundle/stream) and the *critique* of strict identity.

  *   **Member 2 (Position is self-undermining):** This member is interpreting "there is no self" as **Thesis #5 (No Self Exists At All)**. They take the claim as a flat ontological denial of *any* subject/agent ("no one to remember, to intend, or to bear the consequences"). Their objection targets the need for *some* kind of subject/agent for these functions to make sense, which is precisely the challenge posed to strong eliminativism/illusionism (#5). They are not addressing the conventional agent of #2 or #3, or the pragmatic stance of #4.

  ### Does the Disagreement Survive or Dissolve?

  *   **The disagreement dissolves into a dispute over which thesis the slogan carries.** The members are talking past each other because they are interpreting the core slogan "there is no self" in fundamentally different ways:
      *   Member 1 uses it to express a *revisionist reductionism* (#2) or *deflationism about ultimate existence* (#3), which **fully accommodates** conventional persons, psychological continuity, memory, intention, and consequences *at the conventional level*.
      *   Member 2 interprets it as *strong eliminativism* (#5), which **struggles to accommodate** the phenomena of memory, intention, and consequences due to the lack of *any* subject/agent.
  *   **Resolution:** Once disambiguated, the disagreement isn't about the validity of "there is no self" *per se*, but about *which specific claim* it represents. Member 1's position (#2 or #3) is largely immune to Member 2's objection, as that objection only meaningfully applies to the much stronger Thesis #5. Member 2's objection is valid *against* #5 but misapplied to the interpretations (#1, #2, #3, #4) actually held by most proponents of "no-self" doctrines like Buddhism, which carefully preserve conventional functionality. The core conflict is semantic: they disagree on what the slogan *means*.
