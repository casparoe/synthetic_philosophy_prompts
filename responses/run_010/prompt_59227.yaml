  First I need to reconstruct the key elements: Guiteau's non-bribey expectation of office as reward, Garfield-Conkling conflict over "senatorial courtesy", the salary kickbacks, and Arthur's ironic reform. The user wants each element mapped against the formalistic corruption definition (deviation from duty for private gain) versus the reciprocity-based view (gift-giving as legitimate). 

  Hmm, the tricky part is calibrating this for someone without philosophy training. The Garfield assassination context makes it vivid, but I must resist diving into historical tangents. They're clearly after the conceptual machinery - note how they flag that Conkling's case might require importing purpose beyond formal duties. Smart observation.

  For Guiteau: Under the formal definition, he's clearly corrupt - sought private gain (office) through deviation (assassination). But the reciprocity view would see his expectation as culturally legitimate. The mismatch shows the formal definition's blindness to context.

  On salary remittances: Formally corrupt (diversion of public funds), but reciprocally part of the system's glue. Here the user's open-source analogy clicks - disclosure might legitimize this in modern contexts, but only if we've already accepted office-person separation. 

  Conkling's senatorial courtesy is the richest case. Formally not corrupt since Senate treated it as binding, but the user nails it: condemning it requires invoking the office's purpose (serving constituents vs party). That's where the formal definition hits limits - it can't evaluate the propriety of unwritten rules.

  Arthur's reversal is ironic: a patronage beneficiary dismantling the system. Formally pro-reform, but the user notes the self-insulating effect. The universality claim fails here - same act (appointing allies) switches from legitimate to corrupt when rules change.

  The open-source parallel is brilliant. Disclosure works only after we've decided the maintainer's role should be impersonal. In the spoils era, disclosure would've been meaningless - the system was the disclosure. 

  Where to stop? The formal definition can't judge Conkling's norm without importing purpose, and can't explain Arthur's transformation without historical context. The reciprocity view better captures the system's internal logic but can't condemn its excesses. Ultimately both are tools - neither universal.
answer: |-
  Your case analysis request is sharply framed. Let's dissect the 1881-1883 episode using your definition of corruption ("**deviation from the formal duties of a public role for private-regarding gain**") and contrast it with the "**binding reciprocity**" view.

  ---

  ### **1. Mapping the Episode onto the Formal Definition**
  #### **Key Public Roles & Formal Duties (c. 1881):**
  - **President/Executive**: Appoint officers "with the Advice and Consent of the Senate" (U.S. Const. Art. II, §2). No statutory duty to consider merit or avoid partisanship.
  - **Senators**: Advise/consent on appointments. No formal duty to defer to home-state senators.
  - **Federal Officeholders**: Execute assigned duties (e.g., collect tariffs, process mail). No formal duty to fund their political party.
  - **Party Operatives (e.g., Guiteau)**: No formal public role.

  ---

  ### **2. Case-by-Case Analysis**
  #### **A. Charles Guiteau**
  - **Formal Definition View**:  
    - *Deviation?* Guiteau had no public role; murder violated criminal law, not public duty.  
    - *Private Gain?* Expected consulship as "reward."  
    - **Verdict**: Not corruption *under this definition* (he held no office). His act was criminal, but not a breach of public trust.  
  - **Reciprocity View**:  
    - Guiteau acted within the system's logic: campaign work → owed reward. His violence was a breach of reciprocity norms (not how claims were enforced).  
  - **Definition's Shortcoming**: Fails to address how *expectations of reward* corrupt the *appointment process itself* when actors like Guiteau exist.

  #### **B. Salary Remittances ("Assessment System")**
  - **Formal Definition View**:  
    - *Deviation?* Officeholders diverted public salaries to parties. Formal duty: perform job, not fund politics.  
    - *Private Gain?* Parties gained funds; officeholders kept jobs/status.  
    - **Verdict**: **Corruption** – deviation from duty for private/partisan gain.  
  - **Reciprocity View**:  
    - Systemic reciprocity: Party secures job → appointee "gives back." Binding within the patronage ethos.  
  - **Definition's Fit**: Accurately condemns the practice but misses its *systemic function* (e.g., funding parties pre-campaign finance laws).

  #### **C. Senator Conkling & "Senatorial Courtesy"**
  - **Formal Definition View**:  
    - *Deviation?* No formal duty for presidents to defer to senators. Conkling demanded a "veto" exceeding constitutional advice/consent role.  
    - *Private Gain?* Conkling gained power over NY appointments, cementing machine control.  
    - **Verdict**: **Corruption** – senators deviated from constitutional role for partisan control.  
    - *Condemning Conkling requires importing a purpose?* **Yes.** The definition needs an implied purpose: "offices exist to serve public (not partisan) interests." Formally, duties were minimal (show up, don't steal). The *telos* of office must be inferred.  
  - **Reciprocity View**:  
    - "Courtesy" was a binding norm: senators reciprocated deference, preserving state-level party control.  
  - **Definition's Shortcoming**: Exposes the formalism's flaw. If "duties" are only what’s written, Conkling violated nothing. To condemn him, we must argue offices exist for governance, not patronage.

  #### **D. Arthur's Reversal & Pendleton Act**
  - **Formal Definition View**:  
    - Arthur (as President) signed an act creating new formal duties: hire based on merit, not politics, for covered jobs.  
    - **Verdict**: **Anti-corruption** – replaced deviation-prone patronage with rule-bound exams.  
  - **Reciprocity View**:  
    - Destroyed a functioning reciprocity system. Later insulation of appointees ("widening the covered class") created new forms of bureaucratic self-interest.  
  - **Irony**: Arthur – a patronage beneficiary – ended the system that empowered him, showing the formal definition’s triumph over reciprocity.

  ---

  ### **3. Universality Claim Assessment**
  - **The Episode's Lesson**: **Against universality.**  
    - The spoils system functioned for decades as legitimate reciprocity. Pendleton Act *created* the impersonal-office standard through institutional reform.  
    - **What Decides It?**  
      - Effectiveness: Patronage caused inefficiency, violence (Garfield's death), and instability (Conkling's resignation).  
      - Public Legitimacy: Garfield's assassination turned opinion against the spoils system.  
      - Reciprocity’s Limits: When Guiteau’s claim was denied, the system’s enforcement mechanisms broke down into violence.

  ---

  ### **4. Open-Source Maintainer Parallel**
  - **Disclosure as Alternative?**  
    - **In spoils system terms**: Disclosure alone wouldn’t suffice. If the maintainer prioritizes a payer’s features *while claiming to serve the public*, it’s a deviation. But if roles are *defined* as hybrid (like spoils appointees), disclosure legitimizes it.  
    - **Presuppose separation?** **Yes.** Disclosure works only if:  
      - The role is *already* understood as serving an impersonal "public" (the user base).  
      - Disclosure exposes a *deviation* from that norm.  
    - **Spoils contrast**: Disclosure was inherent ("I got this job for party work"). No separation existed to violate. Condemning it required *changing the norm* (via Pendleton Act).

  ---

  ### **5. Where the Definition Has Nothing to Say**
  The analysis stops at:
  - **Cultural Validity of Reciprocity**: The definition cannot judge whether patronage was *legitimate* in its context. It can only note deviations from formal rules, which were minimal pre-1883.  
  - **Systemic Effects**: It misses how patronage stabilized 19th-century politics (mobilizing immigrants, funding parties).  
  - **Arthur’s Motives**: The definition doesn’t care if Arthur acted pragmatically (post-assassination backlash) or ethically.

  ---

  ### **Summary**
  - **Formal Definition**  
    - Catches: Salary remittances, Conkling’s overreach (if office purpose is implied).  
    - Misses: Guiteau’s act as corruption (no role), legitimacy of reciprocity norms.  
  - **Reciprocity View**  
    - Explains persistence of spoils system; condemns Guiteau’s breach of norms.  
    - Cannot condemn systemic inefficiency/abuse absent violence.  
  - **Disclosure**: Requires pre-existing office-person separation to be meaningful.  
  - **Universality**: Pendleton Act shows impersonal offices are constructed, not natural.  

  **Final Verdict**: The episode reveals corruption as **institutionally contingent**. The formal definition is a *product* of reform, not its premise.
