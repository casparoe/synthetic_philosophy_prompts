  I appreciate their demand for honesty about what luck egalitarianism can't explain. The Medicare expansion in 1972 poses a special challenge: was this the luck egalitarian solution (treating ESRD as pure brute luck) or an abandonment of responsibility-tracking? And what about the unintended consequences - exploding costs and different patient demographics?

  The user's reframing of Elizabeth Anderson's critique is brilliant. Rather than harshness toward the irresponsible, they suggest the real problem is the impossibility of auditing responsibility judgments made in secret by amateurs. This deserves serious engagement.

