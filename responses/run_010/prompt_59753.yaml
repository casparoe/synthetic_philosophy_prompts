prompt: |-
  Our consortium maintains a public archive of roughly forty published quantitative models of the same target system — the spread of an agricultural pathogen across a region over a decade. Under new funding terms, the archive must publish a ranked list of those models by closeness to the truth, and I want the specification of that notion settled before anyone proposes a formula. Please write the desiderata: what any account of truthlikeness (verisimilitude) has to deliver in order to serve this purpose, with the motivating case behind each item.

  Adequacy is relative to two uses, and you should hold the list to those and only those: the ranking will decide which models enter a policy-facing ensemble average, and it will have to be defended to modelers whose work places near the bottom. If a demand people make of theories in this area is genuinely a requirement only for some other purpose — explanatory virtue, say, or ranking complete theories of the world rather than working models — say so and set it aside.

  The archive has the following features; your list should be responsive to each, either as a requirement it imposes or as a case you argue is ill-posed:

  1. Models disagree about what to talk about as well as about values. Some omit a whole dimension entirely, such as soil moisture; others include it and get it wrong. The account must either rank omission and error differently or explain why it need not.
  2. Some entries are logically equivalent redescription of others. One model has been re-expressed with a redundant derived variable — an infection rate split into two quantities that sum back to the original — and several models use intertranslatable unit conventions. The ranking must not move under either change.
  3. One entry is a coarse, trivially weak claim that is known to be true; another is a rich model that is wrong by about three percent on every quantity the policy brief uses. The list must take a position on which ranks higher.
  4. Two models agree on every observable output, but one attributes the dynamics to a mechanism we have good independent reason to think is absent. Say whether claims about unobservable structure enter the measure, and what follows from either choice.
  5. The truth is unknown to us; we have finite, noisy observations. Any candidate measure must have an estimator whose ranking is stable at the level of sampling error we actually face.
  6. Because ranked modelers may appeal, a single scalar is not enough: the account must decompose, locating where the distance comes from.

  For each desideratum, state it, give its motivating case in the terms above, and mark it as non-negotiable or as the preference of a particular camp. Then tell me which single requirement eliminates the most candidates, and — the part I most want — whether any subset of your own list is jointly unsatisfiable; several classic attempts in this area have failed precisely that way, and if you suspect mine will too, say which requirement I should drop and what the resulting account loses.

  Finish with a short section, in your own terms and without naming anyone, on how the two broad families of accounts fare against the list: content-based views, on which truthlikeness is a balance of true consequences against false ones, and similarity-based views, on which it is distance within a space of possible states of affairs. No citations, no bibliography, no reading list — I am interested in the reasoning, not the scholarship. A table is acceptable for the list itself.
reasoning: |-
  Okay, the user is part of a consortium managing an archive of about forty quantitative models for an agricultural pathogen spread. They need to rank these models by closeness to truth (verisimilitude) under new funding terms. The ranking will be used for policy-facing ensemble averages and defended to modelers whose models rank low. I must define desiderata for truthlikeness tailored specifically to these two uses, ignoring other purposes like explanatory virtue.

  The archive has six key features that the desiderata must address. Let me go through each one to craft corresponding requirements:

  1. **Models vary in scope and accuracy**: Some omit dimensions entirely (e.g., soil moisture), while others include them but inaccurately. The desideratum must handle how omission vs. error affects ranking. I'll make this non-negotiable because policy needs to weigh incomplete vs. flawed models fairly.

  2. **Logical equivalence**: Some models are redescriptions (e.g., derived variables or unit conversions). The ranking must be invariant under such changes. This is non-negotiable to avoid arbitrary ranking shifts from equivalent formulations.

  3. **Truth vs. rich error**: There's a trivially true coarse model versus a rich model with small errors. The desideratum must prioritize either breadth or accuracy. I'll mark this as contested because different philosophical camps debate it, but for policy, richness might matter more.

  4. **Unobservable mechanisms**: Two models agree on outputs but differ in mechanisms (one contradicts independent evidence). The desideratum must clarify if unobservables affect ranking. This is non-negotiable—policy should avoid models with falsified mechanisms, even if outputs match.

  5. **Uncertain truth with noisy data**: The measure needs a stable estimator given sampling error. Non-negotiable for practical reliability in real-world applications.

  6. **Decomposability**: Since modelers can appeal, the measure must break down the distance into components. Non-negotiable for transparency and defense.

  Now, for the single requirement that eliminates most candidates: Decomposability (#6). Many existing measures (e.g., MSE) are monolithic and can't pinpoint why a model ranks low, which is crucial for appeals.

  Joint unsatisfiability risk: The conflict between "Truth vs. Rich Error" (#3) and "Decomposability" (#6). If we prioritize rich models (#3), decomposing might be messy for complex errors, but dropping #6 would sacrifice transparency. I advise keeping both and accepting that decomposition might be approximate.

  Finally, comparing content-based vs. similarity-based approaches:
  - **Content-based**: Focuses on true/false consequences. Handles scope (#1) and equivalence (#2) well but struggles with unobservables (#4) and decomposability (#6). May misrank the coarse true model (#3) as high.
  - **Similarity-based**: Uses distance in state space. Excels at precision (#3, #5) and unobservables (#4), but omits dimensions (#1) is tricky, and decomposability (#6) is often not inherent.

  Verdict: Similarity-based approaches better fit the policy need for precision and handling mechanisms, though they require careful handling of omissions.
answer: |-
  ### Desiderata for Truthlikeness in Pathogen Spread Model Ranking  
  *(Tailored to policy-facing ensemble selection and defensibility to modelers; excludes unrelated virtues like explanatory power)*  

  | Desideratum | Motivating Case from Archive Features | Non-Negotiable? |  
  |-------------|---------------------------------------|----------------|  
  | **D1: Scope-Error Distinction** | Models omit dimensions (e.g., soil moisture) or include them inaccurately. Must rank omission (missing structure) vs. commission (false structure) distinctly, as policy ensembles need to penalize *both* ignorance and misinformation. | **Yes** – Affects ensemble robustness. |  
  | **D2: Invariance Under Redescription** | Logically equivalent models (e.g., infection rate split into summed components, unit conversions) must not change rank. Prevents gaming the system via trivial reformulations. | **Yes** – Essential for fairness in appeals. |  
  | **D3: Richness-Error Tradeoff Resolution** | Must rank a coarse true model (e.g., "pathogen spreads") vs. a rich model with small errors (3% deviation on policy-relevant outputs). Forces explicit stance: richness with minor error > trivial truth for policy utility. | **Contested** – Policy camp prefers richness; purists may favor truth. |  
  | **D4: Unobservable Mechanism Sensitivity** | Models agree on observables but one posits a mechanism contradicted by independent evidence (e.g., wind dispersal when wind data disproves it). Must incorporate unobservables if independent evidence exists, as policy cannot risk mechanisms likely false. | **Yes** – Avoids "right for wrong reasons" in ensembles. |  
  | **D5: Estimator Stability Under Noise** | Truth is unknown; finite/noisy data (e.g., sparse field measurements). Ranking must be robust to sampling error at observed levels (e.g., <5% variance in pathogen counts). | **Yes** – Practical necessity for real-world use. |  
  | **D6: Decomposability** | For appeals, must show *where* distance arises (e.g., "high error in soil moisture, low in temperature"). Single scalar (e.g., MSE) is insufficient. | **Yes** – Critical for defensibility to modelers. |  

  ---

  ### Key Analysis  
  **Single Requirement Eliminating Most Candidates**: **D6 (Decomposability)**. Most standard measures (e.g., mean squared error, posterior probabilities) are monolithic. Decomposable metrics (e.g., multidimensional error profiles) require granular, variable-level accounting, which many "off-the-shelf" verisimilitude frameworks lack.  

  **Joint Unsatisfiability Risk**: **D3 (Richness-Error Tradeoff) + D6 (Decomposability)** conflict under classic approaches.  
  - **Conflict**: Rich models (D3) often have complex, interdependent errors. Decomposing them (D6) into isolated components may misrepresent their holistic failure (e.g., a 3% uniform error might stem from systemic bias, not component-wise mistakes).  
  - **Resolution Advice**: **Drop strict decomposability (D6) for rich models**, replacing it with *partial* decomposition (e.g., error by policy-relevant output). This loses fine-grained appeal defensibility but retains core policy utility.  
    - *Why?* Philosophically, richness (D3) prioritizes comprehensive models; demanding full decomposition may force oversimplification. Practically, policy-facing ensembles care more about aggregate performance than isolated flaws.  

  ---

  ### Evaluation of Account Families  
  **Content-Based Accounts** (e.g., balance of true/false consequences)  
  - **Strengths**: Naturally handles **D1** (omission = fewer truths; error = falsehoods) and **D2** (logical equivalence preserves consequences).  
  - **Weaknesses**: Fails **D3** (coarse truths outrank rich near-misses), ignores **D4** (unobservables rarely have consequences), and struggles with **D5** (noisy data makes consequence-counting unstable). **D6** is infeasible without artificial weighting.  

  **Similarity-Based Accounts** (e.g., distance in state space)  
  - **Strengths**: Excels at **D3** (small errors penalized less than large), **D4** (mechanisms map to state variables), **D5** (statistical estimators exist, e.g., likelihood-based distances), and **D6** (natural decomposition across dimensions).  
  - **Weaknesses**: **D1** is thorny—omission creates undefined dimensions, requiring ad hoc penalties. **D2** is violated if distance metrics aren’t isomorphism-invariant (e.g., Euclidean vs. Mahalanobis).  

  **Verdict**: Similarity-based approaches better satisfy the desiderata, but **D1** (scope-error) demands careful state-space design. Content-based accounts suit theoretical purity but falter on policy needs (D3–D6).  

  ---  
  *Summary*: Prioritize similarity-based accounts with: (1) penalties for omitted dimensions (D1), (2) invariant distance metrics (D2), (3) independent evidence constraints (D4), and (4) empirical estimators (D5). Sacrifice perfect decomposability (D6) for richness (D3) to avoid incoherence.
