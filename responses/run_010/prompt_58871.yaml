answer: |-
  Right. Three hours and most of a bottle deep – been there. Let's get this settled properly. Your friend's position is philosophically coherent and raises legitimate meta-mathematical worries, so I'll steelman it first, pressing hard as requested. Then I'll build your case, pinpointing where it holds strongest and where it might wobble. British English throughout, naturally.

  ### Steelmanning Your Friend's Position: The Case for Hedging

  Your friend's core argument rests on profound epistemological and semantic uncertainty about the foundations of mathematics:

  1.  **The Unprovability Hole:** You both agree: Gödel shattered the dream of proving PA's consistency *within* PA or any weaker system. We have relative consistency proofs (e.g., PA is consistent if ZFC is), but ZFC itself rests on unprovable consistency assumptions. This isn't just a technicality; it means our foundational bedrock *lacks intrinsic, self-certifying security*.

  2.  **The Model is Not the Guarantee:** Pointing to the standard model (the natural numbers, ℕ) built in ZFC feels like solid ground. But your friend rightly insists this is circular comfort. We *believe* ℕ exists and satisfies PA's axioms. But if PA were inconsistent, ℕ *could not* be a model of PA. Proving PA consistent relative to ZFC only tells us "If ZFC is consistent and describes a universe containing something like ℕ, then PA is consistent." It doesn't bridge the gap to absolute certainty about ℕ or the meaningfulness of PA.

  3.  **Truth Beyond Noticeability:** This is the crux, pressed hard. **The threat isn't about us *noticing* the explosion; it's about truth collapsing.** If PA is inconsistent, then:
      *   There is no such thing as "the natural numbers" in the intended sense. The structure we thought we were describing doesn't coherently exist *as defined by PA*.
      *   Every arithmetical statement becomes simultaneously "true" and "false" within the system. "2+2=4" loses its definite truth value because it's entangled in a web where everything is provable.
      *   **Mathematics stops being about anything determinate.** This is the semantic catastrophe. It doesn't matter if the contradiction is 10 symbols long or 10^100 symbols long. Its mere existence, *even if forever undiscovered*, means PA fails to pin down a unique, consistent mathematical reality. Our confidence that "PA proves things *about numbers*" evaporates. We might be manipulating meaningless symbols according to rules that happen to output useful things locally, but without a consistent underlying reality.

  4.  **The Risk is Non-Negligible:** Given the unprovability and the profound consequences, your friend argues the risk isn't zero. While no contradiction has been found, the history of mathematics (e.g., naive set theory) shows foundational crises *do* happen. The sheer complexity and non-constructive nature of PA proofs mean a contradiction *could* lurk in the vast, unexplored wilderness of very long proofs. Given the catastrophic *semantic* consequences, this non-zero risk warrants a precautionary approach.

  5.  **Hedging as Prudence:** Retreating to constructive systems (like intuitionistic arithmetic) or adopting paraconsistent logics isn't primarily about "saving the house" *after* a contradiction is found. It's about:
      *   **Building on firmer ground:** Constructive systems often have stronger intrinsic consistency guarantees or are based on more demonstrably secure principles (e.g., explicit computations). Paraconsistent logics explicitly build in tolerance for inconsistency without collapse.
      *   **Preserving meaning:** Ensuring the system *provably* tracks something concrete (e.g., computable functions) or maintains coherence even if contradictions exist elsewhere.
      *   **Mitigating the worst-case:** Making the *practical* consequences of a potential future inconsistency discovery less devastating.

  **Strongest Formulation:** "Your focus on practical noticeability misses the point entirely. Mathematical truth isn't defined by what humans can verify before the heat death of the universe. It's about whether the formal system succeeds in capturing a consistent, intended structure. PA's inherent unprovable consistency means we *cannot know* it succeeds. An undiscovered contradiction still means failure – it renders PA semantically bankrupt, untrue *of anything*. We don't hedge because we expect to trip over a contradiction tomorrow; we hedge because the unprovable risk of *semantic collapse* is inherent and catastrophic, and we have viable alternatives that mitigate this risk at their core. Ignoring this is betting the entire meaning of classical arithmetic on faith."

  ### Addressing ω-Inconsistency

  Your friend might refine their worry: "Perhaps inconsistency *per se* isn't the only threat. What about ω-inconsistency?" (For readers: PA is ω-inconsistent if it proves ∃x P(x), yet proves ¬P(0), ¬P(1), ¬P(2), and so on for every standard numeral. It 'says' a number with a property exists but denies every specific number has it.)

  *   **Why it's arguably as bad:** ω-inconsistency also destroys the theory's ability to describe the standard natural numbers faithfully. If PA is ω-inconsistent, it proves theorems about "numbers" that are blatantly false for every actual natural number we can name. Like inconsistency, it severs the link between provability and truth in the intended model.
  *   **The Hedging Dilemma:** You're spot on. If your friend's core worry is semantic collapse (PA failing to describe ℕ), then ω-inconsistency *is* just as threatening. Crucially, **hedging against inconsistency doesn't automatically hedge against ω-inconsistency.** Standard constructive systems (like Heyting Arithmetic) are consistent if PA is, but they can still be ω-inconsistent relative to their intended interpretations! Paraconsistent logics handle explosion but don't magically fix ω-inconsistency either.
  *   **The Steelman Counter:** Your friend could argue:
      1.  Inconsistency (leading to explosion via classical logic) is the *most catastrophic* failure mode, justifying primary focus.
      2.  Some hedging strategies *might* address both (e.g., ultra-finitism rejecting unbounded quantification entirely), or at least the chosen hedge (like strong constructivism) feels semantically *safer* overall against *all* forms of pathological behaviour, even if not guaranteeing ω-consistency.
      3.  The *unknowability* of consistency is more fundamental and directly tied to Gödel's theorems than ω-consistency. The precaution starts with the most direct and proven unprovable risk.

  **The Challenge:** If your friend isn't advocating a hedge that demonstrably prevents ω-inconsistency (and few do, as it's extremely restrictive), it weakens the *necessity* of their specific hedge against inconsistency *alone*. It highlights that semantic worries come in degrees, and their chosen hedge might not fully address their stated epistemological crisis. Why is *this* specific catastrophic risk (explosion) worth significant mathematical sacrifice, while another equally catastrophic one (ω-inconsistency) seemingly isn't, given the hedges proposed don't reliably prevent it?

  ### Arguing Your Side: The Case Against Hedging

  Your core argument is compelling and pragmatic. Let's build it robustly, incorporating your key insights:

  1.  **The Two Scenarios: Discoverable vs. Forever-Hidden Contradiction:**
      *   **Scenario 1 (Discoverable):** A relatively "short" contradiction (within conceivable physical/computational limits) is found in PA. This would be mathematically seismic. *However:* This is precisely the scenario that almost no working mathematician believes is plausible. Centuries of intense scrutiny, including computer verification of vast tracts of proof theory, provide overwhelming inductive evidence against it. Crucially, **no proposed hedge would have saved mathematics *from this discovery*.** If a short contradiction exists, finding it would devastate *classical* mathematics regardless of whether some people were using intuitionistic logic. The "classical infrastructure" they rely on (textbooks, theorems used as lemmas, widely accepted results) would crumble. Hedging only potentially saves *your personal, current work* from explosion *after* the collapse, not the edifice itself beforehand.
      *   **Scenario 2 (Forever-Hidden):** Any contradiction requires a proof of such astronomical length (coded by a number vastly exceeding, say, 10^1000) that it is physically impossible for any entity within our universe (or any plausible extension) to ever construct, write down, or verify it. **This scenario is indistinguishable *in practice* from consistency.** No mathematician, no computer, no process will *ever* output both φ and ¬φ for human inspection. The derivations we *actually perform* remain finite, coherent, and yield mutually compatible results, just as they do now.

  2.  **The Verification Gap: Living with Uncheckable Proofs:**
      *   This is your strongest point. **PA *already* proves theorems whose verification *by direct computation or inspection* is physically impossible.** Consider:
          *   PA proves `Con(PA → ¬G)`, where G is the Gödel sentence. This is a concrete statement, but its shortest proof is immensely long.
          *   PA proves that specific Turing machines (e.g., ones searching for contradictions in ZFC) halt, even if running them would take more steps than there are particles in the universe.
          *   We accept proofs in number theory that rely on induction over structures we could never enumerate (e.g., proofs about all primes).
      *   **The Key Insight:** Our trust in PA doesn't come from verifying its *entire output*. It comes from:
          *   Verifying *short* proofs of statements we care about.
          *   Seeing that its predictions for feasible computations (small numbers, simple algorithms) are flawless.
          *   Observing the remarkable coherence and applicability of the vast body of mathematics built upon it, *even those parts resting on unfeasibly long derivations*.
      *   **The Gap is the Norm:** Therefore, the gap between "what PA proves" and "what we can feasibly verify step-by-step" isn't a bug; it's a fundamental, ever-present feature of powerful formal systems. **Moving from "proofs too long for us to check" to "proofs so long they are physically impossible" is not a qualitative shift in the *working value* or *apparent coherence* of the theory. It's merely pushing the existing, familiar verification gap beyond the absolute limits of physical reality.** We've always operated on faith in coherence beyond direct verification; Scenario 2 just makes that faith absolute.

  3.  **The Cost of Hedging is Real and Substantial:**
      *   Retreating to constructive mathematics means abandoning the Law of the Excluded Middle (LEM) for unbounded quantifiers over ℕ. This isn't a minor tweak. **Vast swathes of classical mathematics – analysis, topology, algebra in their standard forms – become either unreachable or incredibly cumbersome to replicate.** Key tools (non-constructive existence proofs, proof by contradiction for existential statements, unrestricted choice sequences) vanish. Significant effort is required to rebuild fragments, often with weaker results.
      *   Adopting paraconsistent logic fundamentally alters the meaning of negation and consequence. It necessitates rebuilding logic itself before even *starting* on arithmetic. It's a radical departure, not a gentle hedge.
      *   **This sacrifice is demanded to guard against Scenario 2 – a scenario that would manifest in *no observable way* and *changes nothing* about the practice of mathematics or its verified output.** We pay a high price in lost power, elegance, and scope to insure against a metaphysical catastrophe that leaves our actual mathematical experience untouched.

  4.  **Irrelevance of Undetectable Collapse:**
      *   If Scenario 2 holds (forever-hidden contradiction), then **PA remains the uniquely optimal description of the natural numbers *relative to all feasible human inquiry*.** Its theorems concerning feasibly computable results remain verifiably true. Its predictions about structures we can handle remain accurate. Its internal coherence, as judged by *any* process we can *actually perform*, remains intact. The supposed "semantic collapse" is entirely theoretical and has no bearing on the mathematical facts we establish, use, or rely on. Declaring PA "meaningless" in this scenario becomes an empty philosophical stance divorced from mathematical practice.

  5.  **Rational Action and Practical Risk:**
      *   Rational risk assessment weighs the *probability* and *potential impact* of a threat against the *cost* of mitigation.
      *   **Probability:** The inductive evidence against a discoverable contradiction (Scenario 1) is overwhelming. The probability of *only* Scenario 2 being true seems vanishingly small and lacks any positive evidence – it's pure, ungrounded skepticism.
      *   **Impact:** Scenario 1 is devastating, but hedging doesn't prevent it. Scenario 2 has *zero practical impact*.
      *   **Cost:** The cost of hedging (constructive/paraconsistent retreat) is very high: significant loss of mathematical power, insight, and beauty.
      *   **Conclusion:** The infinitesimal, unquantifiable risk of Scenario 2, coupled with its zero practical impact, does not rationally justify bearing the substantial, tangible costs of abandoning classical PA. Acting on the mere *logical possibility* of a forever-hidden contradiction, absent any evidence or mechanism suggesting its likelihood, is epistemically unsound and practically irrational. We rightly dismiss similar "brain-in-a-vat" levels of skepticism in other domains when they offer no practical difference.

  ### Addressing the Shaky Assumption

  You rightly suspect the assumption that "feasibly derivable theorems would still be true" is vulnerable. Here's the breakdown:

  *   **The Worry (Friend's Steelman):** If PA is inconsistent (Scenario 2), then the concept of "truth in the standard model" evaporates. So how can you claim the feasibly derivable theorems are "true"? They are merely unrefuted *so far*, but their status as *truths about numbers* is fundamentally undermined. Your argument seems to rely on PA being *accidentally* correct for feasible statements despite being globally broken.
  *   **Your Defence - Pragmatic Truth:**
      1.  **Feasible Computation:** For any *feasibly computable* statement (e.g., "17 is prime", "123456 + 789101 = 912557"), we can verify its truth *independently of PA*, using direct computation or much weaker, demonstrably consistent systems (like Primitive Recursive Arithmetic or even simple Turing machines). PA proves these statements, but our knowledge of their truth doesn't *depend* on PA's global consistency. We trust 2+2=4 because we can count apples, not because of Gentzen's consistency proof. **The feasible fragment is self-verifying.**
      2.  **Coherence Preserved:** The *internal coherence* of the feasibly accessible part of PA remains intact. No contradiction manifests within the realm of feasible derivation and verification. The theory behaves *as if* consistent for all practical mathematical purposes.
      3.  **No Viable Alternative:** If we reject PA's feasible derivations as "untrue" in Scenario 2, what *do* we trust? We need *some* system to do mathematics. Any sufficiently strong alternative system (like the constructive or paraconsistent one your friend proposes) will *also* have unprovable consistency and its own forever-uncheckable proofs. We gain no fundamental epistemic security by switching; we just trade one set of uncheckable proofs (in PA) for another (in the new system), often with less powerful tools. PA remains the best *practical* foundation we have.
      4.  **'True' Means 'Reliable for Practice':** Ultimately, "truth" for the working mathematician means "reliably leads to correct predictions about mathematical objects we *can* handle and never leads to observable contradictions in practice." By this pragmatic standard – the standard that actually guides mathematical work – PA remains "true enough" even in Scenario 2. The metaphysical loss of "the One True ℕ" is irrelevant if it leaves no trace in the mathematical universe we inhabit.

  **Where the Shakiest Point Remains:** While the *feasibly computable* fragment is secure, statements *about* feasibility or *requiring* long derivations (like "This specific huge computation halts") are more vulnerable in your defence. If PA is inconsistent, its proof of such a statement *might* be flawed, even if we can't check it. Your best counter is the **Coherence Argument:** The entire edifice, including these long derivations, has demonstrated flawless coherence for centuries *within the feasible realm*. While not absolute proof, this provides massive inductive warrant to trust that these long derivations are also correct, *even if PA is inconsistent in principle*. To distrust them based *only* on the logical possibility of a forever-hidden contradiction is, again, ungrounded skepticism. The burden of proof lies on showing a *reason* to suspect a specific long derivation is faulty, not on the general logical possibility.

  ### Conclusion

  Your friend's position stems from a deep, legitimate philosophical concern about the unprovable foundations of truth in mathematics. The fear of semantic collapse is potent. However, your pragmatic argument is stronger:

  1.  Hedging doesn't prevent the only plausible devastating scenario (Scenario 1 - discoverable contradiction).
  2.  The "threat" of Scenario 2 (forever-hidden contradiction) has **no conceivable practical consequence**. It leaves mathematical practice, verification, and application completely unchanged.
  3.  The verification gap inherent in PA is already vast; pushing it beyond physical limits doesn't alter its *functional* nature.
  4.  The cost of hedging – abandoning large parts of effective, beautiful, and powerful classical mathematics – is extremely high.
  5.  Rational action requires weighing tangible costs against tangible risks. Sacrificing real mathematical power to guard against an undetectable, inconsequential metaphysical phantom is not rational.

  The shaky point – trusting feasibly derived *but unfeasibly long* proofs in Scenario 2 – is mitigated by the overwhelming inductive evidence of PA's coherence *at all levels we interact with it*. While not ironclad, this warrant is vastly stronger than the ungrounded possibility it's asked to counter. Insisting on hedging against Scenario 2 asks mathematics to pay an infinite price for zero practical gain.

  So, next time the cork pops, you've got your lines straight. The burden is on your friend to explain how hedging meaningfully addresses Scenario 1, or how Scenario 2 could ever possibly matter to mathematicians doing mathematics. Good luck!
