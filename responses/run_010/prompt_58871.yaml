  For the user's argument, the weakest link seems to be assuming that "feasibly derivable" theorems would remain true in an inconsistent PA. That's shaky—if explosion happens, *no* theorem is reliable, even if we never see the contradiction. But perhaps the user means "theorems derivable before hitting a contradiction," which is... not well-defined. 

  Also, the ω-inconsistency angle is clever. If the friend isn't hedging against that—which doesn't require contradictions but still breaks PA's truth-tracking—why prioritize inconsistency? That asymmetry needs probing. 

