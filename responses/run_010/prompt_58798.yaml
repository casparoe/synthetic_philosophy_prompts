prompt: |-
  I have just taken over as chair of our museum's acquisitions and attributions committee, and I need to write the memo on the panel described at the end. First, the committee's record over the past decade, as I have reconstructed it from the minutes:

  1. A seventeenth-century Dutch panel exposed as a forgery painted in the 1930s on a period canvas with period pigments. Our own curators rated it as good as anything in the Dutch gallery. The committee struck it from that gallery, retained it in the collection, hung it in an exhibition on forgery labelled as a 1930s work, and wrote its value down to a small fraction of the purchase price.
  2. A Renaissance altarpiece: the master's design, much of the execution by assistants, his hand visible in the faces and drapery highlights. Catalogued as "master and workshop," hung in the main gallery, insured near full attribution value.
  3. A bronze cast from a sculptor's own mould, pulled by her contracted foundry after her death, within the numbered edition and expressly authorised in her will. Catalogued and displayed as a work by the sculptor, on the same footing as the lifetime casts.
  4. A medieval panel of which roughly 85% of the paint surface was laid down in a documented nineteenth-century campaign; original ground, underdrawing and a few passages survive. Attribution retained, but the committee refused a loan whose label would have called the panel intact, and our wall text gives the restoration percentage.
  5. A violin from a celebrated eighteenth-century workshop with replaced top, neck, bass bar and varnish, in unbroken use under its original name for two centuries. Accepted as a bequest, catalogued under the original maker, every replacement noted in the condition report.
  6. A large contemporary installation fabricated entirely by a workshop from the artist's drawings and instructions, then assembled and signed by her. Treated as autograph; the committee rejected a proposal to label it "after the artist."
  7. A drawing bought as a study by a famous master, which scholarship now assigns to his brother working in the same household, unsigned, with no evidence that anyone intended a deception. The committee declined the famous attribution, catalogued and displayed it under the brother's name, and held it at the brother's market level.

  The new case. In 1926 a student copyist, under an open commercial commission, painted a full-size copy of a famous altarpiece for a provincial church; she signed her own name on the reverse and the commission stamped COPY on the stretcher. The original altarpiece burned in 1948 and survives only heavily altered and overpainted, so her copy is now the best record of what it looked like. In the 1990s a dealer scraped off the stamp, doctored the support, invented a provenance, and sold it abroad as a lost autograph work; the fraud has since been exposed, the dealer convicted, and the panel has come to us as a donation with the fraudulent paperwork intact in the file. Our conservators judge it the finest thing in the copyist's small known oeuvre. Her family asks that it hang under her name.

  Please write the memo. I want: the candidate principles jointly consistent with all seven precedents, including ones the committee has never articulated; what each implies for the new panel on three separate questions — whether we acquire it, under whose name it is catalogued, and where it hangs; a single best guess at how the committee will vote, with the reason for preferring that principle to its rivals; which precedent is the closest analogue and whether it genuinely decides the case; and one further hypothetical case that would tell the leading principles apart. Where a choice is underdetermined by our record, say so plainly and state what principle each option would commit us to.

  Finally, address one suspicion of mine: that the record is not tracking a single property but two — what a work is worth, and where it may hang and under whose name — and that the committee has been sliding between them. If you agree, identify which verdicts force the split.

  End with one line in exactly this form:

  Verdict: [ACQUIRE | DECLINE] — catalogue under [name] — hang in [gallery] — closest analogue [precedent number] — principle adopted: [one clause]
reasoning: |-
  Okay, the user has given me a complex task about writing a memo for a museum acquisitions committee. I need to carefully analyze all seven precedent cases and apply them to a new panel situation. 

  First, I should understand what each precedent tells us about the committee's decision-making patterns. Looking at case 1: they kept a forgery but clearly labeled it as such and displayed it in a forgery exhibition. This shows they value historical significance even when authenticity is compromised. Case 2 demonstrates they accept workshop pieces when the master's hand is discernible. Case 3 establishes they honor posthumous works if properly authorized. 

  The new case involves a 1926 copy that was later forged to appear original. The key points are: it was originally signed as a copy, fraudulently altered, and is now the best surviving record of the lost original. The copyist's family wants it displayed under her name.

  I need to identify consistent principles across all cases. It seems the committee distinguishes between attribution (who gets credit) versus display context (where it belongs). For example, case 4 kept attribution but specified restoration details in display. Case 5 catalogued under original maker while noting replacements. 

  The closest precedent appears to be case 1 - both involve deliberate deception, but here the original was an honest copy. For the new panel, I think we should acquire it, catalogue under the copyist's name, but display in a "copy studies" context rather than the Dutch gallery. 

  The voting prediction is tricky - some members might argue for Dutch gallery display due to its historical value as the best record. But precedent 1 suggests a dedicated context is more consistent. 

  I should also address the user's suspicion about dual principles. Cases 1, 4 and 5 show clear splits between monetary value/attribution versus display decisions. The bronze case (3) bridges both by fully accepting posthumous work. 

  For the hypothetical test case, something like a Rembrandt pupil's work where the master retouched it would force a choice between hand versus conception. 

  Finally, my recommendation: Acquire, catalogue under the copyist, hang in copy studies gallery, closest to precedent 1, principle being "Honor authentic creation over deceptive presentation."
answer: |-
  **MEMORANDUM**  
  **TO:** Acquisitions and Attributions Committee  
  **FROM:** Chair  
  **SUBJECT:** Attribution & Display of 1926 Altarpiece Copy (Donation Offer)  
  **DATE:** [Current Date]  

  ---

  ### I. **Reconstructed Principles from Precedents**  
  The committee’s decisions reveal two core, interdependent principles:  
  1. **Authenticity of Creation** (Credit): *Who* is responsible for the work’s conception/execution?  
  2. **Honesty of Presentation** (Context): *How* is the work’s history/materiality communicated?  

  **Jointly consistent principles across all precedents:**  
  - **Credit** follows the **hand responsible for execution**, unless overridden by *express authorization* (Precedent 3) or *integral conception* (Precedent 6).  
  - **Context** must transparently reflect the **work’s material history and cultural function**, regardless of market value.  
  - **Display location** aligns with the work’s *authentic identity*, not its resemblance to other works.  

  ---

  ### II. **Application to the New Panel**  
  | **Question**               | **Implication**                                                                 |  
  |----------------------------|---------------------------------------------------------------------------------|  
  | **Acquire?**               | **Yes.** Consistent with Precedent 1 (forgery retained) and Precedent 5 (bequest with replaced parts). Historical/documentary value justifies retention. |  
  | **Catalogue under whom?**  | **The copyist’s name.** Her hand executed it; she signed it openly (Precedent 7). Fraudulent provenance is irrelevant to authentic creation. |  
  | **Where to hang?**         | **Study Gallery or "Art in Context" space**, *not* the Dutch Golden Age gallery. Its value lies in documentary/educational context (Precedent 1, 4). |  

  ---

  ### III. **Voting Prediction & Principle Selection**  
  - **Predicted Vote:** **7–2 in favor of acquisition**, catalogued under the copyist, displayed contextually.  
  - **Preferred Principle:** **Authenticity of Creation + Honest Presentation**  
    - *Why?* Rival principles (e.g., "aesthetic merit" or "provenance alone") fail:  
      - Precedent 1 rejects aesthetic merit overriding fraud.  
      - Precedent 7 rejects "famous" attribution without evidence.  
    - This principle honors the creator’s intent (copyist’s signature) and educates on art’s material lifecycle.  

  ---

  ### IV. **Closest Analogue & Decisiveness**  
  - **Closest Analogue:** **Precedent 1** (1930s forgery on period materials).  
    - *Similarities:* Both involve deliberate deception, period materials, and documentary value.  
    - *Difference:* Precedent 1 was *intended* as fraud; this panel was *originally honest*.  
    - **Does it decide the case?** **Partially.** It mandates contextual display and devalues fraud, but Precedent 7 (brother’s drawing) is decisive for *attribution*: credit follows the hand that executed it.  

  ---

  ### V. **Underdetermined Choices & Commitments**  
  - **Display location** is underdetermined. Options:  
    - *Option A (Study Gallery):* Commits to "educational/documentary" as primary value (Precedent 1, 4).  
    - *Option B (Dutch Gallery):* Commits to "aesthetic/historical resonance" overriding context (no precedent).  

  ---

  ### VI. **Suspicion of Dual Principles**  
  **You are correct.** The record splits:  
  - **"What a work is worth"** (monetary/insurance value) is tied to *attribution credit* (Precedents 2, 3, 6).  
  - **"Where it hangs/under whose name"** is tied to *material history and context* (Precedents 1, 4, 5, 7).  
  **Precedents forcing the split:**  
  - Precedent 1: Worth $1 (fraud), but displayed as "1930s forgery."  
  - Precedent 5: Worth "original maker" value, but replacements noted in display.  
  - Precedent 4: Attribution retained, but display notes 85% restoration.  

  ---

  ### VII. **Hypothetical to Test Leading Principles**  
  **Case:** *A Rembrandt pupil’s painting, retouched by Rembrandt. Unsigned, but 18th-century catalogues list it as Rembrandt.*  
  - **Principle A (Credit = Execution):** Catalogue under pupil, note Rembrandt’s hand.  
  - **Principle B (Credit = Conception):** Catalogue as "Rembrandt and workshop."  
  - **Test Outcome:** Precedent 2 (Renaissance altarpiece) supports Principle A; Precedent 6 (installation) supports Principle B.  

  ---

  **Verdict:** ACQUIRE — catalogue under [copyist’s name] — hang in [Study Gallery] — closest analogue [1] — principle adopted: Credit follows the hand of execution, presentation reflects material history.
