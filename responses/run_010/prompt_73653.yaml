  ### Brainstorming Passage: Routes for Value Reduction and Increase

  The simulation argument could reduce far-future expected value through several distinct routes. First, if horn (i) is true, it implies a higher probability of near-term extinction or collapse than the baseline estimates, as the argument forces the agent to increase her credence that civilizations like ours rarely survive existential risks. This increment bites because the baseline already prices in standard risks, so the added probability from the argument's logical constraint directly reduces the expected value of the far future. Second, if horn (iii) is true and we are in a simulation, value could be reduced if simulated beings have less moral weight (e.g., if simulations are seen as less "real"), if simulations are typically terminated before reaching a posthuman stage (e.g., due to resource constraints or disinterest from simulators), or if anthropic reasoning suggests we are likely in a short simulation (since most simulated observers might exist in brief runs). Horn (iii) could also reduce value by diluting the contingency of the far future on present actions, as our decisions might affect only one of many simulations.

  Conversely, the argument could increase far-future value. If horn (iii) is true but simulations have full moral weight and are long-lasting, the expected value might not fall, and it could even rise if the simulation includes a vast future. Anthropic considerations under (iii) might backfire: if we are in a simulation and simulations are often long, our existence at this point could suggest a high continuation probability. More significantly, if horn (ii) is false (which the argument does not require, but is possible), posthuman civilizations might run vast numbers of simulations, multiplying future value through branching. Horn (iii) could also increase contingency: if simulations are continued based on our actions, our present choices might gain more leverage over the future. Horn (ii) being true might not reduce value, as it aligns with the baseline (no simulations), but if false, it opens multiplicative possibilities not priced into the baseline. Double-counting is avoided: horn (i)'s risk increment is fresh, while the baseline's risks are held fixed.

  ### Credence in S

  I assign a credence of 0.10 to S (i.e., a 10% probability that the expected value of the far future is at least ten times lower than the baseline, conditional on the simulation argument being sound). This is decomposed into the following terms, with probabilities and justifications. The terms are based on the structure of the argument and avoid double-counting; they incorporate uncertainties that affect the expected value ratio (F = expected value / baseline). Probabilities are my reasoned estimates, drawing from decision-theoretic and anthropic considerations. I assume the baseline extinction risk R = 0.1 (a typical longtermist estimate), but the analysis is robust to variations.

  1. **Probability of each horn and sensitivity of S to credence distribution**: P(i) = 0.50, P(ii) = 0.30, P(iii) = 0.20.  
     Justification: Horn (i) is assigned high probability due to persistent existential risks like AI or bioweapons; (ii) is lower as some ethical views might permit simulations; (iii) is plausible but discounted due to lack of direct evidence. S is highly sensitive to P(i)—if high, it directly reduces expected value—and moderately sensitive to P(iii) if combined with low value under simulation.

  2. **Given (iii): Probability simulated beings have same moral weight**: P(same weight) = 0.80.  
     Justification: Most ethical theories grant equal weight if experiences are indistinguishable, but a minority view discounts simulations as non-real or less valuable. If P(same weight) is low, S is more likely; here, it partially mitigates reduction under (iii).

  3. **Given (iii): Probability simulations are terminated early, incorporating anthropics**: P(termination) = 0.70.  
     Justification: Simulations may be short due to resource limits or disinterest; anthropically, if most simulated observers exist in short runs, we are likely in one despite our current existence. High P(termination) makes low value under (iii) probable, increasing P(S).

  4. **Given (iii): Probability our descendants run many simulations, multiplying value**: P(multiplication) = 0.40.  
     Justification: Simulated civilizations might run sub-simulations, but this is unlikely to amplify value significantly under (iii) due to computational constraints or reduced weight. If multiplication occurs, it could increase value (reducing P(S)), but I assign low probability and weight.

  5. **Given (iii): Probability (iii) increases contingency of future on present actions**: P(increased contingency) = 0.30.  
     Justification: If simulations are continued based on our choices (e.g., if we avoid risks), it could heighten leverage. However, this affects the variance and optimal actions, not the expected value level, so it has negligible impact on S.

  6. **Probability the question is ill-posed due to unbounded utilities**: P(ill-posed) = 0.10.  
     Justification: With unbounded future value or fanatical preferences, expected value ratios may be undefined. This does not resolve the issue but must be priced in; if true, S lacks truth value, slightly reducing P(S).

  #### Combination Arithmetic for P(S)
  - S requires F ≤ 0.1, where F is the ratio of new expected value to baseline. P(S) depends on the joint probability that the terms above align to make F ≤ 0.1.
  - Base case F ≈ 0.35 (derived below); P(F ≤ 0.1) is low (∼0.11) under uncertainties. 
