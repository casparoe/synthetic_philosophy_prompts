  - Baseline: V_baseline ≈ (1 - R) × V_long (with R = 0.1, so V_baseline ∝ 0.9 × V_long; V_short negligible).  
  - New expected value:  
    - Under (i): EV|(i) ≈ 0 (high extinction).  
    - Under (ii): EV|(ii) ≈ (1 - R) × V_long ∝ 0.9 × V_long (no change).  
    - Under (iii): EV|(iii) = P(termination) × 0 + (1 - P(termination)) × E[w] × E[V_sim_long].  
      E[w] = P(same weight) × 1 + (1 - P(same weight)) × 0 = 0.80.  
      E[V_sim_long] = P(multiplication) × G × V_long + (1 - P(multiplication)) × V_long (G = 100 multiplier if sub-sims run; but P(multiplication) = 0.40, so E[V_sim_long] ≈ (0.40 × 100 + 0.60 × 1) × V_long = 40.6 × V_long).  
      Thus EV|(iii) ≈ (1 - 0.70) × 0.80 × 40.6 × V_long = 0.30 × 0.80 × 40.6 × V_long ≈ 9.744 × V_long.  
  - EV_new = P(i) × EV|(i) + P(ii) × EV|(ii) + P(iii) × EV|(iii) ≈ (0.50 × 0) + (0.30 × 0.9 × V_long) + (0.20 × 9.744 × V_long) ≈ (0 + 0.27 + 1.9488) × V_long ≈ 2.2188 × V_long.  
  - F = EV_new / V_baseline ≈ (2.2188 × V_long) / (0.9 × V_long) ≈ 2.465.  
  - Median F ≈ 0.35 (if no multiplication under (iii): EV|(iii) ≈ 0.30 × 0.80 × V_long = 0.24 × V_long; EV_new ≈ 0.27 × V_long + 0.048 × V_long = 0.318 × V_long; F ≈ 0.318 / 0.9 ≈ 0.35).  
  - P(F ≤ 0.1) is low: It requires high P(i) (e.g., >0.7), low P(ii), and low value under (iii) (e.g., low P(same weight) or high P(termination)). Probability of this joint scenario is ∼0.11 based on sensitivity analysis.

  ### Sensitivity and Additional Estimates
  - **S most sensitive to**: The probability of horn (i). If P(i) increases (e.g., due to new evidence of high extinction risk), P(S) rises sharply; if P(i) decreases, P(S) falls.  
  - **Argument or evidence to move credence**: Evidence that simulations have no moral weight would increase P(S) most (e.g., philosophical arguments for "realism" reducing P(same weight)). Conversely, evidence against high extinction risk (e.g., resilience advances) would decrease P(S).  
  - **Median multiplicative factor for the argument**: 0.35 (i.e., the simulation argument reduces expected value by about 65% on median estimate, not a factor of 10). A factor above 1 (increasing value) is possible if (iii) holds with multiplication, but median is below 1 due to risk increments.
