  First, "at bottom" signals Carlyle prioritizing essence over causation. He's saying history's *meaning* derives from great men, not that they’re sole causal agents. The "in a wide sense creators" hedge confirms this: heroes inspire/formulate ideas, but the masses execute. Carlyle’s theory is about *meaning-making*, not efficient causality. 

  The subjunctive "were" ("the soul [...] were the history of these") softens the claim into a philosophical stance, not empirical fact. Coupled with "it may justly be considered," it’s rhetorical modesty masking certainty—he’s a metaphysician of history, not a methodologist. 

