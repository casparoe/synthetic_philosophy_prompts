            Show the collective outcome: if everyone had chosen 1 every round:
              D = 1+1+1=3? No, we have only 2 max values: M1 and M2. For round3, we don't have M3 affecting a future round, but it does affect the damage for the planet? We could have included it, but we stop at round3.

            Let's compute the alternative:

              If in every round, everyone chose 1:
                M1=1, M2=1, M3=1 (but M3 doesn't matter for base since no round4).
                Base1=15, profit1=15 +0 + (5//20=0) =15
                Base2=15-2*1=13, profit2=13+0+0=13
                Base3=15-2*(1+1)=11, profit3=11+0+0=11
                Total=39

              What happened in our game? probably M1=3, M2=3, M3=3.
                Base1=15, profit1=15+2+ (5//number) -> if all chose 3, then bonus=0, so 17.
                Base2=15-2*3=9, profit2=9+2+0=11
                Base3=15-2*(3+3)=15-12=3, profit3=3+2+0=5
                Total=17+11+5=33

            So 33<39.

          But note: in round3, they might not all choose 3. But if they do, they get 5. If they choose 1, they get 3. But if one chooses 3, they might get 3+2+5=10. So they will choose 3.

          The point: even though collectively they would be better off with everyone choosing 1, individually they cannot afford to choose 1 because they fear being undercut and because they want the bonus.

          And even after seeing the base drop, in round2 and round3, they still have the same incentives.

          Also, we have the asymmetry: the bonus is concentrated and visible, while the damage is diffuse and delayed.

          Now, materials: index cards for players to write their choice each round. A whiteboard to record the max level and base for the next round.

