          Example: 
            Choices: 3,3,2,2,1,1 -> max=3, so only the two who chose 3 get bonus.

          Facilitator's scoresheet:

            Columns: 
              Player name
              Round1 choice, savings, bonus, total round1, cumulative
              Round2: base, choice, savings, bonus, total round2, cumulative
              Round3: base, choice, savings, bonus, total round3, total

