                For each player: as above, but using Base2.

              Round3:
                Base3 = 15 - 2*(M1+M2)
                M3 is not used for base, but for bonus.

          Debrief:

            Start by asking: 
              How do you feel about the outcome?
              What did you notice happening to the base profit?
              Why did it drop?
              Why did you choose the levels you did, especially in round3 when the base was low?

            Then explain the trap:

              - Even though the collective outcome was bad, each round you had an incentive to choose a lax regulation level to get the cost savings and the bonus.
              - The bonus was concentrated: only the highest got it, and it was visible immediately.
              - The cost of the damage (the reduction in base profit) was delayed (affecting the next round) and diffuse (shared by all, and also affecting future production).
              - Even after seeing the base drop, in round2 and round3, you couldn't afford to choose level 1 because:
                    If you choose 1 and others choose 3, you get only the base (which is low) and no bonus, while others who choose 3 get base+savings+bonus.
              - And if you choose 1 and everyone else does too, you get only the base (which might be low) and no bonus, but also you don't get the savings. And the base is low because of previous damage.

            The key insight: 
              - The cooperative option (everyone choosing 1) requires coordination and trust, but in a multipolar world, there is no enforcer.
              - Unilateral exit: if you alone choose 1, you lose out on the bonus and savings, and the damage is still happening because others are choosing high. So you are worse off.

            Why can't you just agree to all choose 1?
              - Because the agreement is not binding. 
              - If you all agree to choose 1, but then one player defects to 3, that player makes a huge profit in that round, and the damage they cause is shared (so they only bear a fraction of the damage they caused). 
              - And knowing this, everyone has an incentive to defect.

