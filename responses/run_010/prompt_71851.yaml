          Frank statement of what the activity cannot reproduce:

            - In real multipolar traps, the costs and benefits are not as clear-cut and immediate. The damage might be uncertain and occur in the far future.
            - The model assumes that the damage is a linear function of the max laxity, but in reality, it might be threshold-based or have other dynamics.
            - The game has only 3 rounds and 20 players, while real-world traps can involve more actors and unfold over decades.
            - The game cannot capture the possibility of innovation that might break the trap (e.g., green technology) or of building institutions to enforce cooperation.

          Confidence in the design:

            I am confident that the design will make the structure of the trap felt. Players will experience the temptation to choose laxity to get the bonus and savings, and then see the base profit drop. They will also see that even in the last round, they are still driven to choose high laxity.

            The part I am least sure about is the bonus calculation in large groups. If in round1 many players choose level3, then the bonus might be 0 or 1, which might not be enough to make it attractive. But then in round2, if the base is lower, the savings of 2 might be incentive enough. And then in round3, the same. Also, seeing others choose high might create a panic to join.

          Let's hope it works.

          Final rules writeup for the facilitator:

            Title: The Regulation Game

            Number of players: about 20

            Rounds: 3

            Objective: Maximize your total points over 3 rounds.

            In each round, you represent a factory owner in a different country. You will choose a regulation level for your factory: 
              Level 1: Strict regulations (no cost savings)
              Level 2: Moderate regulations (cost savings of 1 point)
              Level 3: Lax regulations (cost savings of 2 points)

            Your profit in a round = (Base Profit) + (Your savings) + (Bonus if you are among the players with the highest regulation level in that round)

            Bonus: The bonus is 5 points, shared equally among all players with the highest level (rounded down to a whole number). For example:
              If only one player has the highest level, that player gets 5 points.
              If two players have the highest level, each gets 2 points (since 5//2=2).
              If three or more have the highest level, each gets 1 point (5//3=1, and 5//4=1, and 5//5=1, 5//6=0).

            Base Profit:
              Round1: 15 points.
              Round2: 15 - 2 * (The highest regulation level in round1)
              Round3: 15 - 2 * (The highest regulation level in round1 + the highest in round2)

            The highest regulation level in a round is the highest number chosen by any player (3 is highest, then 2, then 1).

            Procedure:
              - Round1: 
                    Hand out index cards. Each player writes their name and their choice (1, 2, or 3) for round1.
                    Collect the cards.
                    The facilitator announces the highest level chosen in round1 (M1).
                    For each player, compute:
                        savings = 0 if choice=1, 1 if choice=2, 2 if choice=3.
                        bonus = 5 divided by the number of players who chose the highest level (rounded down) if the player's choice is the highest, otherwise 0.
                        profit = 15 + savings + bonus.
                    Record and announce the base for round2: 15-2*M1.
                    Hand back the cards with the round1 profit or announce publicly per player? We might announce publicly to create transparency. Or we can just record and then at the end give totals. But to save time, we might announce only the base for next round and then later distribute individual scores. But players need to know their own profit to decide in the next round.

                    Instead, after collecting, quickly compute and then read out: 
                      "The highest level in round1 was 3, chosen by 4 players. These 4 players get a bonus of 1 point each (5//4=1)."
                    Then for each player, they can compute their own: base15 + savings + bonus.

                    But to save time, we can have a scoresheet and then after the game, share the totals.

              Alternatively, we can have a public board:

                Round1:
                  Base: 15
                  Highest: 3 (chosen by Alice, Bob, Charlie, David) -> bonus=1 for these.
                  Then for a player:
                    If you chose 1: 15+0+0=15
                    If you chose 2: 15+1+0=16
                    If you chose 3: 15+2+1=18

                    But wait, if they chose 3 but are not in the highest group? In this case, the highest is 3, so everyone who chose 3 is in the highest group.

              So it's per level: if the highest is 3, then only level3 gets bonus. Level2 and 1 do not.

