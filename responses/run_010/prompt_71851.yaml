          How to handle the bonus calculation quickly? 
            We will collect the cards and count the number of players who chose the max level.

            Let N = number of players with the highest level.
            Bonus = 5 // N   (integer division, so 5//1=5, 5//2=2, 5//3=1, 5//4=1, 5//5=1, 5//6=0, etc.)

            We can pre-calculate: 
              If N=1, bonus=5
              If N=2, bonus=2
              If N>=3, bonus=1   [since 5//3=1, and 5//4=1, and 5//5=1, 5//6=0 -> but 0 might be too low. We want the bonus to be attractive even in large groups?]

            But if N>=6, bonus=0. That might be acceptable because in a large group, the bonus is diluted.

            Alternatively, to ensure the bonus is always at least 1 when you are the highest and N<=5, and 0 otherwise? But we want when many choose the highest, the bonus is small.

            We can do floor(5/N). But for N=3, floor(5/3)=1, N=4:1, N=5:1, N=6:0.

