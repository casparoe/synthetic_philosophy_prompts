          So the trap is there.

          Now, we also want that the cooperative option becomes less attractive over time. In round1, if they cooperate (choose 1), they get 15. In round2, if they cooperate, they get 13 (if base2=13) in the cooperative outcome? But in round2, the base is already reduced to 13, and if they choose 1, they get 13. But if they choose 3, they can get 13+2+5=20 if they are the only one. So the opportunity cost of cooperating is higher in later rounds? Not necessarily.

          But note: the damage has already been done, so the base is lower, and the savings from laxity (2 for level3) is a bigger proportion of the base. And the bonus is fixed at 5, which is also a bigger proportion.

          So the incentive to defect is stronger when the base is lower.

          This seems to work.

          Let's write the rules for the game:

          Title: "Production Game" (don't reveal the trap)

          Players: 20, each representing a factory in a different country.

          Goal: Maximize your total profit over 3 rounds.

          Each round, you choose a "Regulation Level": 
            Level 1: Strict (no cost savings)
            Level 2: Moderate (cost savings of 1)
            Level 3: Lax (cost savings of 2)

          Profit in a round = (Base Profit) + (Your Savings) + (Bonus if you are among the player(s) with the highest regulation level)

          Base Profit for round1: 15
          Base Profit for round2: 15 - 2 * (Max Regulation Level in round1)
          Base Profit for round3: 15 - 2 * (Max Regulation Level in round1 + Max Regulation Level in round2)

          Bonus: 5, but shared equally among all players who chose the highest regulation level in that round (rounded down to the nearest integer). If you are the only one with the highest, you get 5. If two have the highest, each gets 2 (since 5//2=2). If three or more, then 5//number.

          Note: The max regulation level in a round is the highest level chosen by any player. If at least one player chooses 3, then the max is 3. If no one chooses 3 but someone chooses 2, then max=2, etc.

          We will play 3 rounds. In each round, you will choose your level secretly and hand it in. Then we will announce the max level and the base for the next round, and then distribute profits.

          But then the players will see the max level and the base for the next round. And they will see their own profit for the round.

          We need to collect the choices and then compute.

          Facilitator needs a scoresheet with:

            Round 1:
              Player | Choice | Base | Savings | Bonus | Total for round

            Base1=15.

            After collecting choices, find M1 = max(choices)
            Bonus: for each player with choice=M1, bonus = 5 // (number of players with choice=M1)

            Then for each player:
              Profit1 = 15 + savings (0,1, or 2) + bonus

            Record and give them their profit for round1.

            Then Base2 = 15 - 2 * M1

            Round2: same, but base=Base2.
            Then M2 = max(choices in round2)
            Base3 = 15 - 2*(M1+M2)

            Round3: base=Base3.

          We then sum the profits over rounds.

          Now, we want to make sure that the players feel the trap. After round3, they will see that the base profit dropped and that everyone ended up with lower profits than if they had cooperated.

          We also want them to see that even in round3, with a low base, they still had to choose high to compete.

          Debriefing:

