prompt: |-
  I teach a seminar on contingency in history — the inevitabilists versus the people who think the past is a stack of near-misses — and every year some student wheels out *It's a Wonderful Life* as though Clarence's tour of Pottersville settles the debate. I've never had a crisp way to say whats actually wrong with that. Here's the distinction I've started using, which I'd like you to take seriously and push on rather than just accept: call an outcome *robust* with respect to some agent if, remove the agent, and some nearby substitute brings the outcome about anyway; call it *resilient* if it comes back in the same shape and on the same timetable. My suspicion is that the inevitabilists — Carr is the obvious case, waving off the might-have-beens of history as beside the historian's business, with Trevor-Roper answering that weighing alternatives is how you find out what the causes even were — only ever argue for robustness and then trade on resilience as if they'd earned it. And the film is interesting precisely because Bedford Falls looks like it has neither, but for a reason that isn't the one everyone reaches for: its not that George Bailey turns out to be a great man, it's that Potter is a monopolist with no competing substitute to slot into the vacancy, so the counterfactual is doing structural work while wearing the costume of a parable about individual worth.

  What I want is the skeleton of that reading, not the essay. Exactly five numbered items, a sentence or two each, no preamble and no summing-up paragraph at the end:

  1–3: the three scenes where robustness and resilience come apart most cleanly. The honeymoon bank run, Bailey Park, and the Pottersville tour are my candidates, but if you'd rather spend one of these on the bridge scene or on the fact that Potter is still standing in the final reel, make that case inside the item. Anchor each to what the distinction is doing there rather than narrating the scene back to me.

  4: the strongest objection from someone who says Clarence's counterfactual was never an epistemic claim at all — it's a piece of moral suasion commissioned by an angelic bureaucracy to stop a suicide — and whether that rescues the film as counterfactual history or sinks it.

  5: what the film gets at about inevitability that straight argument doesn't, and whether Gould's replay-the-tape idea helps here or just muddies a case where the agents have beliefs about their own replaceability, which Burgess Shale organisms don't.

  Don't quote dialogue at me, I've seen it more times than I can count, paraphrase. And if you think my distinction is bad — that robustness and resilience collapse into one thing the moment you fix the granularity of outcomes — say so in item 1 instead of humoring me.
reasoning: |-
  Okay, let me approach this systematically. The user teaches a seminar on historical contingency and wants to dissect "It's a Wonderful Life" as a flawed counterfactual tool. Their robustness/resilience distinction seems central - robustness being substitutability of agents, resilience being outcome restoration on same timeline/terms. 

  First, I need to test if this distinction holds water. Considering Potter's monopoly, George's absence creates unique conditions where no substitute can fill his role because of structural factors, not just individual greatness. That suggests robustness and resilience aren't the same - the outcome changes irreversibly without George specifically. 

  For the scenes: 
  The honeymoon bank run shows robustness (George's honeymoon absence causes crisis) but no resilience (no one else handles it, leading to different long-term outcomes). 
  Bailey Park demonstrates resilience when George returns - the project resumes its original form/timeline because he's irreplaceable in that context. 
  Pottersville reveals total lack of both - no substitute exists due to Potter's monopoly power, making the outcome non-robust and non-resilient.

  On the angelic bureaucracy objection: Clarence's purpose is moral, not epistemological. This actually sinks it as historical counterfactual because the vision serves emotional persuasion, not rigorous what-if analysis. The structural factors are narrative devices, not variables.

  Finally, the film's value lies in exposing how agent replaceability depends on structural conditions - a point Gould's tape-replay misses since Burgess Shale organisms lack human agency and self-awareness about their roles. The monopoly context makes George irreplaceable in ways random creatures aren't.

  The distinction holds because it separates substitutability (robustness) from outcome restoration (resilience), with structural factors determining both. Potter's monopoly breaks robustness by eliminating substitutes, which then prevents resilience.
answer: |-
  Here is the skeleton:

  1. **Honeymoon Bank Run:** George's absence creates a non-robust outcome (the run succeeds) because no substitute agent steps in to replicate his calming role. This lack of robustness *prevents* resilience later; the saved deposits are permanently lost, altering the Building & Loan's trajectory. The distinction shows substitutability failure cascading into timeline rupture.

  2. **Bailey Park Construction:** The development stalls completely without George, demonstrating non-robustness (no substitute drives the project). Crucially, upon George's return, the project regains momentum *on its original trajectory* – showing resilience only possible because the *unique agent* is reinstated. Robustness (substitutability) is absent, but resilience occurs because the specific agent is restored.

  3. **Pottersville Tour:** The outcome lacks both robustness (no adequate substitute emerges to counter Potter’s monopoly) *and* resilience (Bedford Falls doesn't spontaneously revert; it requires George's return). The distinction highlights Potter's structural dominance as the barrier to robustness (no competing force exists to slot in), making resilience impossible without divine intervention.

  4. **Angelic Objection:** Claiming Clarence's vision is purely moral suasion, not epistemic history, sinks it as counterfactual argument. Its purpose (preventing suicide) inherently shapes the vision's extremity and neglects plausible substitutes or gradual adaptations. It proves nothing about historical contingency, only George's *perceived* self-worth.

  5. **Beyond Gould:** The film uniquely exposes how agents' *beliefs about their own replaceability* (George's despair, Potter's certainty of dominance) interact with structural power (monopoly). Gould's tape-replay ignores this reflexive dimension; organisms don't act based on beliefs in their irreplaceability, but human choices are shaped by it, making outcomes sensitive to specific agents within constrained systems.
