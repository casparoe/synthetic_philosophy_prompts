answer: |-
  ### **Interpersonal Utility Comparison Game: "The Welfare Auction"**  
  **Objective:** Make students experience the scaling problem in utility comparison, separating *changes* in welfare from *levels*, and highlighting how aggregation rules depend on units (scaling) but not zeros (translation).

  ---

  #### **Materials**
  1. **Public Good Cards**: 5 cards describing fictional public goods (e.g., "Free City Wi-Fi," "New Park," "Student Meal Subsidies," "Public Transit Upgrade," "Community Center").  
  2. **Scale Cards**: 4 cards (one per group) with hidden zero-points and units:  
     - Group A: Zero = 0, Unit = 1  
     - Group B: Zero = 100, Unit = 2  
     - Group C: Zero = -50, Unit = 0.5  
     - Group D: Zero = 200, Unit = 3  
  3. **Bidding Sheets**: For groups to allocate "utils" across goods.  
  4. **Calculator**: For the auctioneer to compute welfare.  
  5. **Scoreboard**: To display aggregate welfare.  

  ---

  #### **Roles**
  - **Auctioneer (Instructor)**: Runs the auction, calculates welfare, and enforces rules.  
  - **4 Groups of 4 Students Each**: Each group represents a community with:  
    - **Bidder**: Submits bids.  
    - **Recorder**: Tracks allocations.  
    - **Strategist**: Decides how to allocate utils.  
    - **Reporter**: Shares insights during debrief.  

  ---

  #### **Rules & Scoring**  
  1. **Budget**: Each group gets **100 utils** to allocate across 5 goods. Utils *must* sum to 100 (e.g., Wi-Fi: 30, Park: 20, etc.).  
  2. **Auction**:  
     - Goods are auctioned one by one.  
     - Groups submit secret bids (utils) for each good.  
     - The auctioneer sums bids for each good across groups.  
     - **Only the top 3 goods by total utils are "provided."**  
  3. **Welfare Calculation**:  
     - For each group, welfare = `Zero + (Unit × Sum of utils allocated to *provided* goods)`.  
     - *Example*: Group B (Zero=100, Unit=2) allocates 40 utils to a provided good. Welfare = `100 + (2 × 40) = 180`.  
  4. **Aggregation**: Social welfare = Sum of all groups' welfare.  

  ---

  #### **Game Flow (75 mins)**  
  1. **Setup (10 mins)**:  
     - Form groups, assign roles, and distribute Scale Cards (*groups keep zeros/units secret*).  
     - Explain rules: "Maximize your welfare—allocate utils to goods most likely to win."  
  2. **Bidding (15 mins)**:  
     - Groups allocate 100 utils across 5 goods. **No inter-group communication.**  
     - Auctioneer collects bids.  
  3. **Provision & Scoring (15 mins)**:  
     - Auctioneer sums bids, announces top 3 goods.  
     - Groups calculate their welfare using Scale Cards.  
     - Auctioneer computes social welfare, posts results.  
  4. **Debrief (35 mins)**: Structured discussion mapping gameplay to theory.  

  ---

  #### **Debrief: Mapping Gameplay to Theory**  
  1. **Reveal Scale Cards**: Show zeros/units publicly.  
  2. **Key Questions**:  
     - *"Could we rank groups' welfare levels from the bids alone?"*  
       - **Insight**: No. Group D (Zero=200) dominates levels regardless of provided goods due to zero-point. Bids only show *changes*, not absolute levels.  
     - *"Why did social welfare change when we recalculated with different units?"*  
       - **Insight**: Social welfare = `Sum(Zeros) + Sum(Units × Group utils)`. Zeros cancel in *changes* (e.g., adding a good), but units scale utils—making aggregation hostage to unit disputes.  
  3. **Competitive Inflation**:  
     - *"Did groups inflate bids? What happened?"*  
       - **Insight**: Inflating bids for one good risks losing if others underbid it. *Example*: Group A bids 100 on Wi-Fi—but if Wi-Fi loses, they score 0. Forces strategic allocation.  
  4. **Whiteboard Summary**:  
     | **Concept**       | **Game Example**                          | **Theory Link**                     |  
     |-------------------|------------------------------------------|-------------------------------------|  
     | **Levels**        | Group D always wins due to Zero=200.     | Levels require common zero-point (impossible without cardinal scaling). |  
     | **Changes**       | Adding a good raises welfare by `Unit × utils`—Group B gains 2× more than Group C for same utils. | Changes depend on units, not zeros. |  
     | **Aggregation**   | Social welfare shifts if units change (e.g., Group C’s Unit=0.5 vs. Group D’s 3). | Aggregation requires interpersonal unit comparison. |  

  ---

  #### **Limitations & Honest Notes**  
  **What the Game Can’t Reproduce**:  
  - **Non-Cardinal Utility**: The game assumes utility is cardinal and linearly scaled. In reality, utility is ordinal for many philosophers (e.g., Robbins). *You’ll need to explain:* "This game forces cardinality for clarity, but real-world utility is often ordinal—making unit comparison even harder."  

  **How It Might Go Wrong (and Safeguards)**:  
  - **Problem**: Competitive students inflate bids to "win" goods.  
    - **Safeguard**: Budget constraint (utils = 100) and top-3 provision make overbidding risky. If a group puts all utils on one good and it loses, they score zero—highlighting strategic trade-offs.  
  - **Problem**: Groups assume others’ scales are similar.  
    - **Safeguard**: Revealing wildly different zeros/units post-game shocks them into seeing scaling problems.  

  ---

  #### **Expected Insights**  
  - Students leave seeing:  
    1. **Zeros** affect levels but cancel in welfare *changes*.  
    2. **Units** scale changes and break aggregation—even if everyone agrees on relative rankings.  
    3. **Aggregation rules** (e.g., sum-utilitarianism) fail without interpersonal unit comparison.  

  This game creates an "aha!" moment by making scaling problems visceral—setting you up for deeper textual analysis (e.g., Harsanyi vs. Robbins). Run it early in the seminar to anchor discussions!
