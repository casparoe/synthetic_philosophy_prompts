  - Independence criterion: This is crucial and I see it as primarily evidential (0.8 credence). The hearer's warranted belief about independence matters more than hidden causal structures.

  Combining these, I arrive at 0.35 credence in A's claim. The hearer does gain material justification because her evidence reasonably suggested independent confirmation, even if that turned out false. This justification isn't retroactively destroyed - it was reasonable at the time.

  The most sensitive point is the evidence-relative vs reality-relative question. If compelling arguments for "knowledge-first" epistemology emerged, it might sway me. A and B genuinely disagree about this case rather than upstream issues, though B slightly overstates the justification's permanence.

