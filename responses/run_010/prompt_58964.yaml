prompt: |-
  For the past year I have been meeting weekly with three classmates to work through philosophy papers, and last month I wrote up the following argument as a handout on causation by omission. My intention was only to show how quickly omission-talk gets out of hand. Instead the argument seems to run past that target and end somewhere I cannot accept, and after three meetings none of us can locate the step where it goes over the edge. I would like a diagnosis.

  (1) An omission causes an outcome if and only if the outcome would not have occurred had the omitted act been performed.
  (2) When we evaluate such a counterfactual we hold fixed the actual past and the actual laws, including what everyone else actually did.
  (3) Last month a child I will call Amara died of malaria in a region where an insecticide-treated bed net costs roughly what a lunch costs here.
  (4) I did not send the price of a net to the agency working in that region. Had I sent it, the net would have been bought and hung over Amara's bed, and she would not have died.
  (5) So my omission caused Amara's death.
  (6) Nothing in (1) through (5) mentions me in particular. The same reasoning goes through for anyone who did not send the money, and there are roughly eight billion such people.
  (7) So roughly eight billion omissions each caused Amara's death.
  (8) Causation is all-or-nothing. Either c caused e or it did not; there is no causing e slightly, or causing it less than somebody else did.
  (9) Since each of the eight billion stands in exactly the same causal relation to the death, and since responsibility for an outcome tracks that causal relation and nothing else, each of the eight billion is exactly as responsible for Amara's death as a lone assassin is for his victim's.
  (10) That is unacceptable. Most of the eight billion are small children, or cannot spare the money, or have no route to that agency; and even for those who could have paid, we do not classify a forgotten transfer as a killing.
  (11) Therefore (1) is false. Omissions are never causes.
  (12) But then the sleeping lifeguard did not cause the swimmer's death, the nurse who skipped the double-check did not cause the overdose, and the missing sprinkler did not cause the fire to spread.
  (13) And if the agent's contribution drops out of the causal story in every letting-die, then killing and letting die are causally indistinguishable, since in neither case does anything the agent did or failed to do figure among the causes.
  (14) So the argument ends by erasing the doing-and-allowing distinction, which is precisely what I sat down to defend.

  Tell me which premise or which inference you would reject, and then explain why it looked harmless when I wrote it, since it certainly did. I do not need the argument rescued; I want the repair costs compared. Three candidates keep coming up in our meetings and I would like each of them priced: (8), because some of us have read that causation admits of degrees while others insist that being a difference-maker and being worth citing as the cause come apart; (2), because holding the others' non-donation fixed may not be available for the person who could never have donated in the first place; and (6), because it may quietly trade a claim about my omission for a claim about everybody's. One member also thinks the trouble is further down, at (9), and that the real question is whether eight billion causes is itself an objection or just an unfamiliar picture. For what it is worth, I would rather surrender (10) than (1), and I am not willing to live with (12).

  Lead with your bottom line in the very first sentence, stating the step you reject, and then give the reasoning that gets you there. No preamble and no restating my question back to me.
reasoning: |-
  Hmm, the user has shared a philosophical argument about causation by omission that they created, and they're stuck because it leads to an unacceptable conclusion. They want me to identify which premise or inference is flawed and explain why it seemed reasonable initially.

  Looking at their argument, they start with a counterfactual definition of causation by omission (premise 1), apply it to a real case of a child dying from malaria (premise 3-4), conclude they caused the death (5), then extend this to all 8 billion people who didn't donate (6-7), claim each bears full responsibility (8-9), find this unacceptable (10), reject the initial premise (11), but then see problematic implications for other cases (12-14). The whole argument threatens to erase the doing-allowing distinction they wanted to defend.

  The user mentions their group has identified three potential weak points: premise 8 (causation is all-or-nothing), premise 2 (counterfactual evaluation method), or premise 6 (scaling from individual to collective). Someone also questions premise 9 (responsibility tracking causation). The user prefers to keep premise 1 and avoid premise 12's implications.

  The key problem is premise 6. It incorrectly scales from "my omission caused the death" to "everyone's omission caused the death" by ignoring that counterfactual dependence must be evaluated for each potential cause separately. My omission satisfies the counterfactual because if I had acted differently (holding others fixed), the outcome would change. But for someone with no capacity to donate, the counterfactual "had they donated" wouldn't hold the past fixed - we'd have to imagine a different past where they could donate, which might alter other factors. Premise 6 treats all non-donors symmetrically when they aren't actually symmetric in their causal potential. This seemed harmless initially because we naturally focus on our own case, but when generalized, it overlooks that the counterfactual test applies differently based on actual capacities and circumstances.

  I'll reject premise 6 because it commits a fallacy of composition by assuming what's true for one omission must be true for all. The reasoning seemed harmless at first because in the individual case (for someone capable of acting), the counterfactual holds, but when extended to billions including those incapable, it fails because their counterfactual scenarios would require altering the actual past or laws, violating premise 2.
answer: |-
  I reject the inference from (5) to (6) and (7), as (6) commits a fallacy of composition by assuming that because *my* omission caused the death under a counterfactual where *I alone* act differently (holding others fixed), *every* person's omission must similarly cause the death under a counterfactual where *they alone* act differently. This ignores that the counterfactual test in (1) and (2) is sensitive to *actual capacities and opportunities*. For many individuals (e.g., a newborn, someone in extreme poverty), the antecedent "had the omitted act been performed" requires altering the actual past or laws (contra (2)), making the counterfactual false or inapplicable to them. Thus, (5) does not generalize to all eight billion people. 

  **Why it looked harmless initially:** When you wrote (6), you likely focused on your own case—where you *could* have donated—and assumed symmetry. The oversight was neglecting that (2) restricts counterfactuals to agents for whom the omitted act was *genuinely possible* given actual history. For those lacking capacity or access, "had they sent money" isn't a minor tweak but requires impossible changes (e.g., a toddler suddenly earning and sending funds), violating (2). 

  **Cost comparison of your candidates:**  
  - **Rejecting (8) (causation is all-or-nothing)**: Moderate cost. Admitting scalar causation avoids overdetermination but complicates responsibility attribution and may not fully resolve the problem (e.g., why *aren't* billions "partial causes"?).  
  - **Rejecting (2) (holding past/laws fixed)**: High cost. Allows context-sensitive counterfactuals but undermines objectivity in causal claims, making omissions hostage to variable "what-if" scenarios.  
  - **Rejecting (6) (generalizing individual omission)**: **Lowest cost** (as above). Preserves (1) and (2) for agents with genuine capacity, avoids absurd responsibility inflation, and aligns with intuition that only *feasible* omissions matter.  
  - **Rejecting (9) (responsibility tracks causation)**: Moderate cost. Decouples moral responsibility from causation but may feel ad hoc; you'd need an independent account of why some causes (e.g., the assassin) bear full blame while others (e.g., non-donors) don't.  

  By rejecting (6)'s overgeneralization, you salvage (1) for paradigmatic omissions (e.g., the lifeguard, nurse) without absurdity, preserve the doing-allowing distinction, and avoid (12)'s implications.
