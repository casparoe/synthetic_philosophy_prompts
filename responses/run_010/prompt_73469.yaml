prompt: |-
  I am running a ninety-minute session on program equilibrium for final-year computer science undergraduates. They have completed one game theory course: they can define a Nash equilibrium, they know that mutual defection is the unique equilibrium of the one-shot prisoner's dilemma, and they have met the folk theorem for infinitely repeated games. None of them has taken computability theory or mathematical logic, and only about half have ever written a program that treats source code as data. I have a whiteboard and no slides. The session exists because the two-week project that follows it requires each student to write a bot that receives the opponent's source code as input and returns a move, after which the bots are run round-robin against one another; a bot that fails to terminate scores nothing.

  What I need is a plan for the explanation, not the explanation.

  1. The dependency structure. Set out the order in which the components must be introduced and what each depends on. In particular: should the definition of a program equilibrium — no player can do better by substituting a different program, holding the opponent's program fixed — come before or after the first concrete pair of bots? And given that these students already carry the folk theorem, is their prior coursework scaffolding I can build on or a trap I must disarm first? If it is a trap, say precisely what goes wrong when they import it: what in the repeated-games picture has no analogue here, and what looks analogous but is not.

  2. The carrying example. I want one pair of programs, in no more than about twelve lines of whiteboard pseudocode, that carries the entire idea: the bot that cooperates if and only if the code it is handed is character-for-character identical to its own source, its unconditional-cooperation counterpart, and at least one asymmetric encounter in which the match fails, so that the default branch is doing visible work. Tell me what this example must have, what it must deliberately lack — no randomness, no third player, no dependence on knowing a particular programming language — and whether the prisoner's dilemma is the right host game at all, or whether a coordination game or a game of chicken would carry the concept better and why.

  3. Where self-reference enters, and what I do about it. A bot that decides by comparing the input string against its own source terminates immediately; a bot that decides by simulating the opponent's program on its own input must simulate itself simulating itself, and does not. My students will hit this in the project and it is the thing I most need them to leave understanding. Tell me at what point in the ninety minutes to raise it, how much of the underlying obstacle to expose to an audience with no computability theory — enough that they do not conclude it is a bug they can patch with a timeout, not so much that the session becomes a logic lecture — and where the honest stopping point is. I also want your view on whether the syntactic-match construction should be presented as a solution to the regress or as a way of dodging the question, since the answer changes how much of item 2 I can afford to lean on.

  4. The misconception map. I expect at least these four: that this is tit-for-tat under another name and the folk theorem already covers it; that transparency merely means perfect information about a fixed opponent, so a player who can read the other's code can compute the other's move and the dominant strategy still wins; that the matching bot is a syntactic cheat, because no two real programs are character-identical; and that the whole apparatus is ordinary precommitment of the binding-device kind. Give me the ones I have missed — including anything specific to students who are competent programmers but have never thought of a strategy as a program — and for each misconception name the exact point in the sequence where it has to be headed off rather than argued with afterwards, together with the shortest thing I can say or write at that point that actually kills it.

  5. The check. One question or short exercise I can put to them in the final five minutes that separates students who understand the idea from students who can reproduce the phrase, and a description of the wrong-but-fluent answer I should be listening for.

  6. What I should refuse to cover, and say so out loud. My candidate omissions are the formal treatment of programs as machines, the undecidability of determining what an arbitrary program does on a given input, the existence and multiplicity questions for program equilibria, games with more than two players, and the variant in which cooperation is triggered not by syntactic identity but by the existence of a short proof, in some fixed weak proof system, that the opponent will cooperate. Tell me which of these I can drop without damaging the idea and which I cannot, and give me one sentence per omission that I can say to the class so that it reads as a deliberate boundary rather than as a gap in my own knowledge.

  I am not asking for readings and will not be assigning any; the deliverable is the ordering, the example, the misconception map, and the check.
reasoning: |-
  Okay, let me tackle this professor's detailed request for teaching program equilibrium. They need a solid plan for a 90-minute session targeting CS undergrads with basic game theory knowledge but limited formal logic/computability background. The core challenge is making this abstract concept concrete before their bot-coding project.

  First, considering the dependency structure. The folk theorem from their prior coursework is both scaffolding and a potential trap. It's useful for establishing that cooperation can emerge in repeated interactions, but the trap lies in three key differences: (1) Program equilibrium operates in a single-shot game where strategies are programs, not histories. (2) The "punishment" here is structural (syntactic mismatch triggering defection) rather than strategic retaliation. (3) Most crucially, programs can conditionally cooperate without actual repetition. Need to explicitly state these distinctions early when introducing the definition.

  For the carrying example, Prisoner's Dilemma is indeed optimal. It creates high stakes where mutual cooperation feels impossible yet becomes achievable through program strategies. Will sketch two bots: CooperateBot (always cooperates) and IdentityBot (cooperates only if opponent's code matches its own). Pseudocode must be dead simple - under 12 lines, language-agnostic, with clear asymmetric cases shown. Key is demonstrating IdentityBot's default defection branch activating against CooperateBot due to code mismatch.

  Self-reference is the landmine. Should surface it mid-session after they've bought into the example but before misconceptions solidify. Must emphasize: simulation leads to infinite regress (bot simulating itself simulating itself...), while syntactic comparison dodges this via termination. Present this not as a solution but as a practical bypass - enough to warn them off simulation attempts in their projects without diving into halting problem proofs.

  Anticipating misconceptions beyond the four listed: Many will think "if I can read their code, I can always exploit" - but neglect that their exploit code becomes readable too. Must kill this during the definition by showing how mutual transparency creates new equilibria. Another pitfall: equating this with quining (self-reproduction), which isn't required here. Save that clarification for Q&A.

  For the checkpoint exercise: "Suppose IdentityBot plays a modified version of itself where comments are changed. Does it cooperate?" Correct answer is no (syntactic mismatch), but fluent wrong answers will claim "it should still work if logic is identical." This exposes those missing the deliberate brittleness of the construction.

  Deliberate omissions: Will explicitly exclude undecidability, machine formalism, multi-player cases, and proof-based cooperation. State: "We're focusing on the core two-player syntactic mechanism so you can implement it; the extensions are fascinating but beyond today's scope." This frames limitations as intentional pedagogy.

  The flow should be: 1) Contrast PD one-shot vs folk theorem (10 min) 2) Define program equilibrium with transparency twist (5 min) 3) Present CooperateBot/IdentityBot example (15 min) 4) Demo asymmetric matches (10 min) 5) Self-reference obstacle and why simulation fails (20 min) 6) Misconception clarifications (15 min) 7) Check exercise (5 min). 

  Throughout, whiteboard use is critical: left side for game theory concepts, right for code boxes with clear branching. The bot examples must visibly compile in their minds.
answer: |-
  Here’s a structured plan for your 90-minute session, optimized for clarity and addressing your constraints:

  ### 1. **Dependency Structure**
     - **Order & Dependencies**:
       1. **Recap Prisoner’s Dilemma (PD)** (5 min):  
          *Depends on prior knowledge*. Re-state one-shot PD’s mutual defection equilibrium.  
       2. **Contrast with Folk Theorem** (5 min):  
          *Scaffolding trap*: Highlight that the Folk Theorem requires **repeated interaction**, while here we have **one-shot games with transparent source code**. Disarm by saying: *"Here, strategies are programs that see each other’s code before acting once. No future rounds exist for punishment."*  
       3. **Define Program Equilibrium** (10 min):  
          *Must come before concrete bots*. Define: *"A pair of programs (P1, P2) is an equilibrium if no player gains by switching to another program, given the opponent’s code."* Emphasize **transparency** (code is input) and **one-shot play**.  
       4. **First Bot Pair** (15 min): Introduce concrete bots *after* the definition.  

  ### 2. **Carrying Example: PD Syntactic-Match Bots**
     - **Pseudocode (≤12 lines)**:
       ```python
       # CooperateBot (CB) - Always cooperates
       def CB(opponent_code):
           return 'Cooperate'

       # IdentityBot (IB) - Cooperates only if opponent_code == self_code
       def IB(opponent_code):
           self_code = get_own_source()  # Returns IB's source as string
           if opponent_code == self_code:
               return 'Cooperate'
           else:
               return 'Defect'  # Default branch
       ```
     - **What it Has**:
       - Asymmetric encounter: `IB` vs `CB` → `IB` defects (mismatch), `CB` cooperates → (`Defect`, `Cooperate`).
       - Mutual cooperation: `IB` vs `IB` → both cooperate.
     - **What it Lacks**: Randomness, simulation, language-specific tricks.
     - **Why PD?** PD’s tension (cooperation is strictly dominated but mutually optimal) makes the equilibrium’s "cooperation despite temptation" counterintuitive and impactful.

  ### 3. **Self-Reference: When & How to Address**
     - **Raise at**: Minute 35 (after showing `IB`/`CB` and symmetric success).
     - **Expose**: *"What if IB simulates the opponent instead of checking code? Suppose IB runs opponent_code(IB_source). If opponent is also IB, it runs IB(IB_source), which runs IB(IB_source) again..."* → **Infinite loop**.  
     - **Stopping Point**: *"This is undecidable in general—we can’t preemptively detect all infinite loops. Syntactic match dodges this by avoiding simulation entirely."*  
     - **Present Syntactic Match As**: A practical **bypass** (not a solution) to the simulation regress. Say: *"We use it because it terminates, but it’s fragile. Real projects might need better heuristics."*  

  ### 4. **Misconception Map**  
     | Misconception | When to Debunk | Killer Statement |
     |---------------|---------------|------------------|
     | "This is just Folk Theorem/Tit-for-Tat" | After defining program equilibrium | *"No history or repetition: one decision, based on code, not past moves."* |
     | "Transparency lets me compute their move and defect" | Before bot examples | *"If you defect, they see your code and defect too. Mutual defection isn’t better than mutual cooperation."* |
     | "No two programs are identical; syntactic match is useless" | During IB explanation | *"True. This is a pedagogical toy. Your project bots can use relaxed checks (e.g., function equivalence)."* |
     | "It’s just precommitment" | After equilibrium definition | *"Precommitment binds you. Here, your program reacts to the opponent’s code—it’s adaptive."* |
     | **New: "I can simulate a few steps to decide"** | When discussing self-reference | *"Simulation risks infinite regress if both bots do it. Timeouts won’t guarantee correctness."* |
     | **New (Programmers): "I’ll tweak comments to trick IB"** | During asymmetric demo | *"IB compares entire code. If you alter your code, you’re no longer playing IB—you’re a new bot that may defect against others."* |

  ### 5. **Check Exercise (Min 85–90)**  
     - **Question**: *"Suppose IdentityBot (IB) plays against a new bot, AltBot, which is identical to IB but with added whitespace. Does IB cooperate with AltBot? Why?"*  
     - **Correct Answer**: No—syntactic mismatch triggers defection.  
     - **Wrong-but-Fluent Answer**: *"Yes, because they do the same thing"* (misses syntactic brittleness).  

  ### 6. **Deliberate Omissions**  
     - **Omit**: Formal machines, undecidability proofs, existence/multiplicity, >2 players, proof-based cooperation.  
     - **Boundary Statements**:  
       - *"We skip undecidability to focus on implementable ideas for your projects."*  
       - *"Multi-player equilibria introduce new challenges—today’s core is two-player transparency."*  
       - *"Proof-based cooperation is powerful but requires logic we won’t assume."*  

  ### **Session Flow**  
  - 0–5 min: PD recap.  
  - 5–15 min: Folk Theorem contrast → Program Equilibrium definition.  
  - 15–30 min: Whiteboard `CB` and `IB`; demo mutual cooperation (`IB` vs `IB`) and asymmetry (`IB` vs `CB`).  
  - 30–40 min: Self-reference pitfall (simulation → infinite loop; syntactic match as bypass).  
  - 40–60 min: Misconception clarifications (interactive Q&A).  
  - 60–85 min: Project setup hints (e.g., *"Use SHA hashes for tractable equivalence"*).  
  - 85–90 min: Check exercise & wrap-up.  

  This ensures they grasp the **core mechanic** (code-as-input enabling one-shot cooperation), **avoids logic traps**, and prepares them for the project’s technical reality.
