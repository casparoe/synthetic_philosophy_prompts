prompt: |-
  I work on integrity and compliance policy at a development finance institution, and I've stopped trusting our corruption risk register because I can't say what makes an entry on it corrupt as opposed to merely bad, merely illegal, or merely foreign. Before I commission anything or wade back into the literature, I want the spec, not a survey. Write me the desiderata a theory of corruption has to meet to be usable for this purpose: the requirements any adequate account has to satisfy, each with the case or consideration behind it, and a mark on which are non-negotiable and which are just preferences of a particular camp.

  A few things the list has to be built around, because these are where our register falls apart:

  - The theory has to sort cases where the same practice is corrupt in one setting and ordinary courtesy in another, without the cop-out of declaring the local version fine just because it's local. So there needs to be a desideratum about universality: what makes a standard of official conduct claimable across settings, and what it costs to claim it. If the answer is that nothing does, say what's left of the concept.
  - It has to take a position on secrecy. Compare a customs officer's small "expediting fee" that is openly known, budgeted for by importing firms, and never disguised, with the identical fee demanded behind a closed door. Is the first one less corrupt? If the theory says yes, explain how it avoids letting people launder anything by doing it in public; if no, explain what work the hiding was doing in all those cases where it clearly seemed to matter.
  - It has to explain what "corrupt" is doing that "illegal," "self-interested," and "unfair" aren't, or concede that it's doing nothing.
  - It has to handle the private side too. We lend to firms, not just ministries, and I need to know whether a family business hiring the owner's nephew is a smaller instance of the same vice as a minister doing it, or a different thing entirely that only looks similar.

  Sort at least these cases with the desiderata in hand, or flag the ones the theory can't sort: seasonal gift exchanges between a supplier and a procurement officer where both cultures treat refusal as an insult; a mayor who takes no money and steers a contract to a longtime friend's firm, where the friend's bid turns out to be the best one; a legislator's adult child getting hired by a company with pending business before the legislature; a judge accepting an all-expenses-paid seminar trip from a bar association; unlimited independent spending on behalf of a candidate versus a capped direct donation to the same candidate; a village headman distributing state-subsidized fertilizer along kinship lines he is also expected to honor at home; a wedding gift of livestock that years later buys favorable testimony; a mining company that builds the town's only school and clinic; and a ritual feast where the point is to give away more than your rivals can. Some of these should come out corrupt, some not, and at least one should come out as a case where the theory has to say "this concept doesn't reach that far" rather than forcing a verdict.

  Also tell me which distinctions the theory must not collapse — corrupt versus inefficient, corrupt versus cruel, corrupt person versus corrupt practice, corrupt office versus corrupt institution — and which single desideratum knocks out the most otherwise-attractive accounts. If some subset of the requirements is jointly unsatisfiable, say so plainly and say which one has to give; that's the part I most want to see.

  Format: lead with your bottom line in two or three sentences — can these be jointly met, and if not which requirement is the casualty — then the numbered desiderata with their motivating cases, then a short section on the conflicts and the unsortable residue. A small table is fine for the case sorting. American English please. Hard cap of 700 words; don't pad it with a literature review and don't hand me a bibliography or citations, I'll chase the sources down myself.
reasoning: |-
  Hmm, the user is asking for a rigorous framework to define corruption for their work in integrity and compliance at a development finance institution. They need desiderata (requirements) that any adequate theory of corruption must meet, based on specific pain points where their current corruption risk register fails. Their key challenges include handling cultural relativity without moral relativism, addressing the role of secrecy, distinguishing corruption from mere illegality or unfairness, and applying the concept consistently across public and private sectors.

  The user has provided concrete examples where their current system struggles - like gift exchanges that are culturally expected versus bribes, or nepotism in family businesses versus government positions. They want the theory to sort these cases clearly. They also need to know which distinctions must be preserved (like corrupt vs inefficient practices) and which requirement might make most theories fail.

  The user is clearly frustrated with vague or culturally relativistic approaches. They want something operational that doesn't collapse important distinctions. Their examples reveal deep concerns about universal standards - how to condemn certain practices across cultures without imperialism, yet avoid the trap of "when in Rome." The secrecy dilemma is equally thorny - if openness sanitizes corruption, then daylight bribery becomes acceptable; if not, then why does hiding matter in other cases?

  For the desiderata, I'm considering building around four non-negotiables: universality (standards must transcend locality but account for institutional context), secrecy as an indicator but not definer (focus on disloyalty), specificity (what makes corruption distinct from adjacent concepts), and institutional scope (applying equally to public and private power). Then adding four negotiable preferences about agency, harm, and gradation.

  The case sorting will be crucial. The gift exchange fails the institutional purpose test (non-negotiable 1). The open bribe is corrupt despite transparency because it still violates institutional duty (non-negotiable 2). The legislator's child getting hired involves private sector complicity in public corruption (non-negotiable 4). The ritual feast falls outside corruption entirely - it's status competition, not institutional subversion.

  The toughest trade-off is between universality and institutional sensitivity. Most theories sacrifice one for the other. A focus on institutional purpose (non-negotiable 1) threads this needle best - it allows condemnation of nepotism in modern bureaucracies while recognizing kinship obligations in traditional village governance, without relativism.

  The bottom line is that a functional theory is possible but requires holding four non-negotiable requirements together: institutional purpose violation as the core, secrecy as evidence but not essence, clear differentiation from adjacent wrongs, and consistent application across power types. The cost is abandoning hope for a single "harm" metric - sometimes corruption is harmful inefficiency, sometimes it's "efficient" but corrosive. What unites it is the subversion of entrusted power.
answer: |-
  ## Bottom Line
  A usable corruption theory is possible but demands four non-negotiable requirements centered on institutional purpose violation. The core cost is abandoning a universal "harm" metric; corruption is defined by *disloyalty to entrusted power*, not necessarily outcomes. Secrecy indicates corruption but doesn't define it. Most theories fail by collapsing corruption into illegality or unfairness.

  ## Desiderata for a Theory of Corruption

  1.  **Non-Negotiable: Institutional Purpose Violation.** Corruption occurs when an entrusted power (public or private) is exercised for unauthorized private benefit, subverting its *institutional purpose*. This separates corruption from mere illegality (e.g., jaywalking violates law but no entrusted power), inefficiency, or cruelty. Motivating Case: A minister hiring an unqualified nephew corrupts the public office's purpose (meritocratic service). A family business owner hiring a nephew *may* violate fiduciary duties to investors/shareholders, making it potentially corrupt *within that institution*; if it's solely their capital/risk, it may merely be bad business.
  2.  **Non-Negotiable: Universality via Institutional Context.** Standards derive from the *institution's* defined purpose and rules, not vague cultural norms. A practice is corrupt if it violates the institution's *own* legitimate rules or purpose, even if culturally common. "Local courtesy" is irrelevant if it subverts institutional goals. Cost: Requires defining legitimate institutional purposes (e.g., impartiality in procurement). Motivating Case: Seasonal gift exchanges corrupt if they violate procurement rules demanding impartiality, regardless of cultural norms. Refusal being insulting doesn't legitimize subversion.
  3.  **Non-Negotiable: Secrecy as Symptom, Not Essence.** Secrecy *indicates* awareness of wrongdoing but isn't definitional. An open "expediting fee" is corrupt if it violates institutional rules (e.g., unauthorized payment for doing one's job). Secrecy matters evidentially but laundering via publicity fails; the violation persists. Motivating Case: The open customs fee is still corrupt bribery if unauthorized by law/institution. The hidden fee is *more obviously* corrupt due to intent to deceive.
  4.  **Non-Negotiable: Distinct from Adjacent Wrongs.** Corruption is specifically the *abuse of entrusted power for private gain*. It is distinct from:
      *   *Illegality:* Not all illegal acts corrupt power (speeding ticket). Not all corruption is illegal (loopholes, weak laws).
      *   *Self-Interest:* Self-interest is inherent; corruption is its *illicit realization through power abuse*.
      *   *Unfairness:* Unfair acts (e.g., rude behavior) aren't necessarily corruption absent power abuse.
      *   *Cruelty/Inefficiency:* Cruel or inefficient acts may not involve power-for-private-gain.
  5.  **Negotiable: Focus on Practice over Person.** The theory should primarily classify *acts* or *systems* as corrupt. Labelling *persons* is secondary, context-dependent, and prone to error. Requires distinguishing corrupt acts from systemic institutional corruption.
  6.  **Negotiable: Harm as Corrosive, Not Defining.** While corruption often causes harm (inefficiency, unfairness), its *defining feature* is the violation of trust/institutional purpose. Some corrupt acts might be temporarily "efficient" (e.g., bribe speeding up a permit) but remain corrupt due to the violation.
  7.  **Negotiable: Gradations Matter.** The theory should accommodate severity (scale, impact, intent) without losing the core definition. Nepotism in hiring a clerk vs. steering a billion-dollar contract differ in magnitude but share the core vice.
  8.  **Negotiable: Agency & Complicity.** Must handle both the power-holder *and* the private actor offering the illicit benefit (briber, favor-seeker) as participating in corruption.

  ## Case Sorting with Core Desiderata (1-4)

  | Case                                                                                          | Verdict              | Reasoning (Per Desiderata)                                                                                                                             |
  | :-------------------------------------------------------------------------------------------- | :------------------- | :----------------------------------------------------------------------------------------------------------------------------------------------------- |
  | **Seasonal gift exchanges (culturally expected)**                                             | **Corrupt**          | Violates institutional purpose of impartial procurement (1,2), regardless of cultural pressure. Gift creates obligation subverting duty.               |
  | **Mayor steers contract to friend (best bid)**                                                | **Not Corrupt**      | Outcome was correct. If selection process *wasn't* subverted for private gain (e.g., friend won fairly), no violation of institutional purpose (1).    |
  | **Legislator's child hired by firm with pending business**                                    | **Corrupt**          | Creates conflict of interest subverting legislator's duty of impartial judgment (1). Private firm is complicit (8).                                    |
  | **Judge accepts bar association seminar trip**                                                | **Context Dependent** | If the seminar is legitimate training and common/non-influential, likely not corrupt. If lavish/selective/aimed at influencing cases, corrupt (1,6). |
  | **Unlimited independent spending vs. capped direct donation**                                 | **Not Corrupt (Concept Limit)** | *Concept doesn't reach that far.* While potentially problematic/unfair, defining this *specific act* as abuse of entrusted power (1) is strained without evidence of explicit quid pro quo subversion. Campaign finance is adjacent but distinct. |
  | **Village headman distributes fertilizer along kinship lines**                                | **Not Corrupt?**     | *Highly Contextual.* If role *institutionally defined* (de jure or de facto) includes kinship obligations as part of legitimate local governance/purpose (2), may not be corrupt. If role demands impartial allocation by need, corrupt. |
  | **Wedding gift (livestock) later buys favorable testimony**                                   | **Corrupt**          | Gift given with implicit/explicit expectation of future influence (quid pro quo), subverting judicial/legal duty (1). Secrecy of intent matters (3).   |
  | **Mining company builds town's only school/clinic**                                           | **Not Corrupt?**     | *Concept doesn't reach that far.* While potentially creating dependency/influence, the *act itself* isn't necessarily an abuse of entrusted power *by the company* unless linked to a specific illicit exchange. May be CSR or coercion, distinct from corruption. |
  | **Ritual feast (competitive giving)**                                                         | **Not Corrupt**      | *Concept doesn't reach that far.* Primarily a social status competition, not an abuse of entrusted institutional power for private gain (1).            |

  ## Conflicts & Residue
  *   **Core Tension:** Universality (2) vs. Institutional Sensitivity (2). Defining "legitimate institutional purpose" across vastly different contexts is hard. Non-Negotiable 2 forces this reckoning.
  *   **Single Desideratum That Knocks Out Theories:** **Distinctness (4).** Most popular accounts collapse corruption into illegality ("it's corrupt because illegal") or unfairness ("it's corrupt because unfair"). This renders the concept redundant and unusable for the user's needs. A theory failing 4 is useless.
  *   **Unsatisfiable?** A theory satisfying all four non-negotiables is *possible* (as above) but operationally challenging. The **biggest casualty is simplicity**. Defining institutional purposes precisely across diverse loans (firms, ministries, villages) is complex and requires judgment. The theory provides the *framework* for judgment, not automatic answers. The "harm" requirement (6) is deliberately negotiable – sometimes corruption harms, sometimes it's "efficient" bribery; the core wrong is the betrayal of trust.
