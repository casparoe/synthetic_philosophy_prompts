  ## The Missing Oomph (Dialogue: 1180 words)

  **Characters:**  
  **ALEX:** Late 20s, pragmatic, leans toward physics-based "oomph" causation.  
  **JAMIE:** Late 20s, analytical, defends difference-making counterfactuals.  

  *(Setting: A slightly cluttered university common room, late afternoon. Alex is sketching a diagram on a napkin. Jamie sips coffee, looking mildly exasperated.)*

  **JAMIE:** ...so the insurance report literally says, "Failure of the smoke detector due to absent battery was a primary causal factor in the severity of fire damage." The mom screamed it at the dad for months! Are you seriously telling me all those people are fundamentally confused?

  **ALEX:** (Taps the napkin) Look, Jamie. Fire starts. Fire spreads. Fire consumes house. That’s the actual chain. Energy transfers, molecules vibrate, heat radiates. Where’s the *battery’s absence* in that process? You can’t point to a *nothing* propagating through the system. It’s just… background silence. The *positive* causes are the electrical fault, the flammable materials, the oxygen.

  **JAMIE:** Background silence that *killed people*! If the battery had been there, the alarm screams, people wake up, they get out or grab the hose. The *difference* between the world where the battery is present and the world where it isn’t *is* the house burning down versus not, or at least burning way less. That’s causation! We don’t need spooky ‘absence-oomph’ flowing through the wires. We just need to see what changes the outcome.

  **ALEX:** But the outcome *was* changed! By the dad yanking the battery! That’s a *positive* action! His neurons fired, his muscles contracted, he physically removed a physical object. *That* you can trace. The *absence afterwards* is just the static state left behind. Blame the dad’s action, fine. Blame the dead wiring later, sure. But blaming the *hole* where the battery *isn’t*? That’s like saying the hole in the dam caused the flood, not the dynamite that made the hole.

  **JAMIE:** Semantics! The dynamite *caused* the hole which *caused* the flood. The dad *caused* the absence which *caused* the lack of alarm which *caused* the lack of evacuation which *caused* the severe damage. The absence is a crucial *link* in the counterfactual chain. Take it out, the chain breaks, the outcome changes. What more do you want?

  **ALEX:** Actual physics! Not just a story! Okay, fine, Case 2 should settle this. Suppose we find out *after* the fire that the smoke detector’s internal wiring was completely fried – maybe a power surge weeks earlier. A brand new battery wouldn’t have made the alarm sound. And even *if* it had, the fire investigators say it was so fast, an alarm would only have given them maybe one extra minute – not enough to do anything meaningful. So, taking the battery out made *zero difference* to the outcome. The house burns down just the same. Now what? Is the missing battery still a cause?

  **JAMIE:** Well… in that specific scenario, *given the fried wiring and the fire speed*, no. Removing the battery didn’t change the outcome. So, *in this precise setup*, it wasn’t a difference-maker. It wasn’t a cause *of this particular fire’s severity*.

  **ALEX:** (Leans forward, triumphant) Exactly! Because there was no *actual difference* it made! Just like I said! Causation needs real connection, real impact. No oomph, no cause! That battery absence was just… inert. Irrelevant background noise.

  **JAMIE:** (Frowns) Hold on, hold on. Don’t pop the champagne yet. Think about *why* we’d still blame the dad, even knowing about the fried wiring *afterwards*. We’d say he was *reckless*, that he *created a dangerous situation*. Why? Because *normally*, taking the battery out *does* create a risk. In the *vast majority* of counterfactual scenarios – the ones where the wiring *isn’t* fried and a fire *does* happen – that absence *does* cause disaster. Your ‘oomph’ view misses that entirely! You’re stuck on this one specific physics chain, blind to the *general* causal role the absence plays in the *structure* of possibilities. This case hurts *you* because it shows causation isn’t just about the one actual physical chain; it’s about how things *tend* to connect, about dispositions and risks. The absence *was* dangerous, even if it lucked out this time.

  **ALEX:** Dangerous isn’t causal! A loaded gun on a table is dangerous, but it doesn’t *cause* anything until someone pulls the trigger! You’re conflating potential with actual causation.

  **JAMIE:** Fine, skip the danger angle. But here’s Case 3, and it’s your turn to squirm. If absences are causes just because the world *would* be better if they weren’t absent, then why is the dad’s failure to replace the battery a cause, but *not* the failure of some random guy in, say, Nebraska, to hop in his car with a fire extinguisher and drive over? Neither did anything! Both are absences! There’s no ‘oomph’ trace in either case. And the world *would* have been better if Nebraska Guy *had* magically appeared with an extinguisher, just like it would have been better if the battery was there! So why does one feel like a cause and the other feel insane?

  **ALEX:** (Snorts) Finally! See? This is the reductio ad absurdum of your view! The Nebraska Guy’s absence is obviously *not* a cause! There’s no physical connection, no plausible mechanism, no expectation! It’s just… the universe being its normal, neglectful self. My view handles this easily: neither absence has any oomph, so neither is a cause. The dad’s *action* of removal was a cause, but the *ongoing absence* itself? Just a condition. You’re the one who needs to draw a ‘principled line’ between two nothings!

  **JAMIE:** It’s about *relevance* and *dependence*! The fire’s severity *depended* on the state of the smoke detector in that house. It did *not* depend in any meaningful way on the actions of a stranger three states away who had no knowledge, no capacity, and no connection. The counterfactual "If Nebraska Guy had driven down..." involves a wildly improbable, disconnected change. The counterfactual "If the dad had put the battery back..." involves a small, local, *expected* change within the actual causal field of the event. Causation by omission requires a *relevant possibility* that was *actually open* but not taken. Nebraska Guy driving over wasn’t a relevant possibility.

  **ALEX:** "Relevant possibility"? "Actually open"? That sounds suspiciously fuzzy. Who defines ‘relevant’? Physics doesn’t care about relevance!

  **JAMIE:** *People* care about relevance! And causation, especially *causal explanation*, is for people! We need to know what *made the difference* in the actual web of events we’re interested in. Nebraska Guy isn’t in that web.

  **ALEX:** Ugh, now you sound like you’re conceding. But look, someone else had an idea – maybe the difference *is* norms. The dad *should* have replaced the battery. Detectors *should* have batteries. That’s why his absence feels causal. Nebraska Guy has no obligation, no norm saying he *should* have driven over, so his absence isn’t an ‘omission’, it’s just nothing. Causation by omission smuggles in ‘supposed to’.

  **JAMIE:** (Pauses) Huh. Norms... that *is* how we talk. "He *caused* it by *failing* to act." The ‘failing’ implies he *should* have acted. Without the norm, it’s just an event happening.

  **ALEX:** (Eyes narrow) But is that *causation*? Or is it just blame? If the norm changed – say, the dad wasn’t *supposed* to replace batteries, maybe it was the mom’s job – suddenly his inaction isn’t causal anymore? That seems... wrong. And physics still doesn’t care! A fire burns the same regardless of who was ‘supposed’ to do what.

  **JAMIE:** Yeah, Alex has a point. This feels like giving up on *causal* explanation and retreating to *moral* or *functional* explanation. "The detector malfunctioned *because* its function (requiring a battery) wasn’t fulfilled." But is ‘function’ part of causation, or just how we *describe* systems? If we found a natural, non-man-made hole that failed to block a flood, would we say the hole’s ‘absence of dirt’ caused the flood? Or just that the hole was there? Norms might explain *why we pick out* certain absences, not why they *are* causes.

  **ALEX:** Exactly! And here’s a case where the norm-based rule gives a terrible answer: Imagine a lifeguard who *isn’t* supposed to leave their post, but they do, purely for selfish reasons. While they're gone, a freak lightning bolt hits *exactly* where they would have been standing, killing them instantly. Simultaneously, *in a completely different part of the pool*, a child drowns because no one saw them. The lifeguard’s absence ‘caused’ them to avoid being killed by lightning – a good outcome! But according to the norm view, since they *should* have been on duty, their absence is an ‘omission’ that caused the child’s drowning. But the absence *saved their life* and *didn’t physically cause* the drowning – the water did! The norm view forces you to say one absence caused two diametrically opposed outcomes? Nonsense! It conflates moral failing with physical causation.

  **JAMIE:** (Rubs temples) Okay, the lifeguard case is messy. But Alex, how does your ‘oomph’ explain why everyone, including scientists writing reports, calls the missing battery a cause? Are they all just primitive storytellers? Physics might be the foundation, but causation *talk* does real work – it tells us what to fix, who’s responsible, what to expect next time. Your pure ‘process’ view can’t capture that. The fire spread *because* there was no alarm. That’s a true explanation!

  **ALEX:** It’s a *shorthand*! A useful fiction! The *real* causes are the combustion, the lack of suppression, the delayed human response *due to not hearing a sound* – which is still a positive neurological state of *not* hearing! We point to the battery absence as the *salient factor* we can control, the thing that *enabled* the chain. But the enabling condition isn’t the prime mover. It’s the hole, not the dynamite. Nebraska Guy proves you can’t take difference-making too far, and the norm view collapses into blame. My ‘oomph’ might be restrictive, but it’s ontologically clean. Absences aren’t *things* that *do* things. Physics doesn’t have a category for ‘negative causation’.

  **JAMIE:** Clean? You just handwave away the entire explanatory power of counterfactuals! You say ‘delayed human response *due to not hearing a sound*’. What is ‘due to’ *except* counterfactual dependence? If they *had* heard the sound, they *would* have responded faster! That’s the core of it! Your ‘neurological state of not hearing’ – that’s just describing the absence! It’s circular! You *need* the difference-making to even define what that state *is*! Without the *possibility* of hearing, the ‘not hearing’ state is meaningless! How can you define an absence *without* implicitly invoking the counterfactual of its presence? Your ‘cleanliness’ is an illusion, Alex. You’re smuggling difference-making in through the back door while yelling about oomph out front.

  **ALEX:** (Stares at Jamie, momentarily speechless. He opens his mouth, closes it, then looks down at his crumpled napkin diagram. He slowly shakes his head, but doesn't immediately reply. The frustration is clear, mixed with a flicker of doubt Jamie’s last point struck deep. He taps the pen nervously on the table.)

  **JAMIE:** (Leans back, watching Alex struggle. The coffee’s gone cold, but the argument is very much alive.) Well? How *do* you define "not hearing" without "could have heard"? Physics envy, Alex. It’s making you miss the forest for the atoms.
