          - Start: MI
          - Rule 2: MI -> MII
          - Rule 2: MII -> MIIII
          - Rule 1: MIIII -> MIIIU (adding U at the end because it ends with I)
          - Now we have MIIIU. We can apply Rule 3 to the first three I's: MIIIU becomes MUU.
