     - Therefore, the number of I's is always not divisible by 3. But MU has 0 I's, which is divisible by 3 (0 mod 3 = 0). So we can never get to 0 I's? But wait, what about the starting string? MI has 1 I -> 1 mod 3 = 1, not 0. And the invariant holds: every string we can derive has a number of I's that is not divisible by 3. Therefore, MU (which has 0 I) is impossible.

