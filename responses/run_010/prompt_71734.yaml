     - "Humans aren't computers" (Lucas/Penrose): We avoid this deep philosophical debate in this session. We can say that the point here is about the limitations of a particular formal system and that humans can sometimes see these limitations by stepping outside. But we don't extend to grand claims about AI or human consciousness.
  4. **What to Avoid**: 
