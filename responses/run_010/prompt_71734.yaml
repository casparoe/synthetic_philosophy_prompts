  We are planning a 45-minute session for 12 ML engineers on the MU-puzzle from Hofstadter's "Gödel, Escher, Bach". The goal is to convey the puzzle and the concept of "jumping out of the system". The audience is technically adept but not necessarily familiar with formal systems.

