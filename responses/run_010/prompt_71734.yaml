              MI -> MII (Rule2) -> MIIII (Rule2) -> MIIIIU (Rule1) -> MIIIIU (now we have 4 I's) 
              Then we can apply Rule 3 to the first three I's: MIIIIU becomes MU I U -> MUIU (and now we have 1 I) 
