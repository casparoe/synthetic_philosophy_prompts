  1. **Order of Concepts**: They need to understand the formal system first (rules and derivations), then the puzzle (can we derive "MU"?), then the invariant (why we cannot), and finally the idea of "jumping out of the system".
  2. **Priming Example**: We need a quick example to illustrate the concept of an invariant. The mutilated chessboard is a good candidate because it is visual and quick. It shares the idea of an invariant that prevents a solution, but it lacks the formal system structure. We then transition to the MIU system which has explicit rules and a derivation process.
