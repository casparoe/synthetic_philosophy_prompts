          - Start: 1 I -> mod 3 = 1.
          - Rule 2: 1*2 = 2 -> mod 3=2.
          - Rule 2: 2*2=4 -> mod 3=1 (because 4 mod 3=1).
          - Rule 2: 4*2=8 -> mod 3=2.
          - How do we get 3? We can use Rule 3 to reduce: from 4, we can't get to 3 by Rule 2. But from 4, we can apply Rule 3? But Rule 3 requires three consecutive I's. We have four: so we can remove one triple and get 1 I (and a U). So we go from 4 I's to 1 I (by replacing three I's with a U). So 4-3=1, which is 1 mod 3. So we never have a multiple of 3? 

     - Actually, we can have 3 I's? How? 
          - Start: MI (1 I)
          - Rule 2: MII (2 I's)
          - Rule 2: MIIII (4 I's)
          - Now, we can apply Rule 3 to the first three I's: MIIII -> M U I (because replace the first three I's with U, leaving the last I) -> so we have MUI, which has 1 I. 
          - Alternatively, we could have applied Rule 3 to the last three I's? MIIII -> M I U -> MIU, which has 1 I? 
          - So we never have 3 I's? 

     - Actually, we can get 3 I's by doubling and then doubling again and then using Rule 3 in a way that leaves 3? Not obviously. But note: we can also use Rule 1 and Rule 4. 
