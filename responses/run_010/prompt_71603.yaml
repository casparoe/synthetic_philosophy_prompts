  - The abandon expected value from Q6 is for those who don't attribute to any of the above.

  Now, are there any combinations that are incoherent? 
  - If in Q1 they say they would pay only $20 or less, but in Q6 they say we should use expected value and then in Q6B they are expected value maximizers, that's incoherent because expected value is infinite. But we already have a leaf for expected value maximization from Q1b or Q6B, and they would have paid more in Q1. So this path (Q1A and then eventually Q6B) might be marked as inconsistent? In our flowchart, if they get to Q6, they have already said no to finite bankroll, growth-rate, bounded utility, and physical impossibility. Then if they say we should use expected value (Q6B), we put them in expected value maximization, but their initial behavior (paying only $20) is inconsistent. We can note that in the leaf.

  Finally, we must be honest about which leaves can't be separated. 
  - The abandon expected value leaf might be reached by two paths: 
     a) The bounded utility critique (Q4bB).
     b) They just abandon it without being motivated by the critique (Q6A).

  These are two different reasons, but we might not be able to distinguish them in a simple flowchart. We can have two separate leaves:

     - "Abandon expected value because of the bounded utility critique" 
     - "Abandon expected value for other reasons"

  But for simplicity, we might combine.

  - Also, the bounded utility leaf might be reached only by the path: Q4A -> Q4aA -> Q4bA.

  - The physical impossibility leaf is distinct.

  - The growth-rate leaf is distinct.

  - The finite bankroll leaf is distinct.

  - The expected value maximization leaf has two paths: 
     a) They are willing to pay a lot initially (Q1B and then Q1bA).
     b) They don't attribute the low payment to any cause and then say we should use expected value (Q6B).

  We can call them both "Expected value maximization", but note that the first group is consistent and the second group is not. In the leaf for the second group, we can say: "You say we should use expected value, but then you didn't in the original game. This is inconsistent."

