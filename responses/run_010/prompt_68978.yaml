prompt: |-
  I am writing a chapter on how federations allocate authority: the Swiss rule that the cantons hold every power the constitution does not confer on the federation, the German practice of the Länder executing most federal legislation as their own affair, the American reserved-powers idiom, and the EU treaty version of subsidiarity, under which the higher level may act only where the objectives cannot be sufficiently achieved at the lower level and can better be achieved above by reason of the scale or effects of the action. A colleague read a draft and handed me the following reductio, which I have not been able to answer.

  (1) Subsidiarity: a matter should be handled at the lowest level competent to handle it, and a higher level may act only where the lower level cannot handle it adequately.
  (2) A level is competent to handle a matter just in case the consequences of a decision about that matter fall on those who make it; a unit that bears the cost of being wrong is the unit that can handle the thing.
  (3) The consequences of an individual's decisions about their own conduct fall on that individual — their money, their body, their time — which is precisely why we hold individuals responsible for them.
  (4) So by (1) and (2) the individual is the lowest competent level for every decision concerning their own conduct, and no higher level may act on it.
  (5) Every exercise of state authority over a person is a decision concerning that person's conduct: a tax is a decision about their paying, a speed limit about their driving, a compulsory-schooling rule about their attending, a vaccination requirement about their being vaccinated.
  (6) Hence no exercise of state authority over individuals is permitted.
  (7) But subsidiarity is offered as a principle for distributing authority among levels that already exist — its use in Swiss, German, and EU settings is to say which of them acts, not whether any of them may. A principle entailing that none may act has refuted itself.
  (8) Therefore subsidiarity is false, or empty.

  My colleague is delighted with this and I am not. I would rather give up (2) or (5) than (1) or (3), but I cannot tell which is the cheaper loss, and I suspect I have not yet located the actual fault.

  Tell me which step to reject, and why that step looked acceptable before it was put under pressure. Then price the repairs. If (2) goes, what does competence amount to, and can the resulting principle still resist centralization, or has it become a general efficiency test that hands the matter to the highest level whenever scale economies or cross-border effects appear? If (5) goes instead, what account of the individuation of decisions does the repair need, and is that account principled or ad hoc? Also say whether (7) is doing legitimate work — can a principle be refuted by a consequence in a domain it was never addressed to — and whether the Catholic social-teaching lineage of subsidiarity, where it shields intermediate associations from absorption by larger ones, bears on the diagnosis.

  Finally, tell me what would change your mind: which argument or consideration would move you to a different verdict about where the failure lies, and where you think your own reasoning here is most likely to break down.
reasoning: |-
  Okay, so I'm dealing with this user's problem about federations and subsidiarity. They've presented a reductio ad absurdum argument from their colleague that seems to show subsidiarity leads to anarchism. The user is clearly frustrated but wants to save subsidiarity as a principle for allocating authority between governmental levels. 

  Hmm... let me walk through the argument step by step. The core issue seems to be premise (2) defining competence solely through cost-bearing. That's where the logic derails - when applied literally, it reduces all decisions to the individual level. But that's not how federations work! 

  I recall the Catholic social teaching origins of subsidiarity emphasize protecting families and communities, not atomistic individualism. The colleague's argument ignores that subsidiarity assumes legitimate authority exists at multiple levels. Premise (7) actually helps here - subsidiarity distributes existing authority, it doesn't question the state's existence.

  If we ditch premise (2), what replaces it? We need a definition of competence that accounts for collective action problems. Things like public goods provision or environmental regulations where individual decisions can't solve systemic issues. The EU treaty version actually hints at this with "scale and effects" language. 

  Premise (5) is also problematic in how it frames state actions. A tax isn't just about "my paying" - it's about funding collective infrastructure. Speed limits coordinate shared road safety. But rejecting (5) might require messy metaphysical distinctions about decision types.

  Looking at repair costs... abandoning (2) seems cleaner. We can redefine competence using three criteria: effective capacity, normative legitimacy, and collective impact. This preserves subsidiarity's anti-centralization thrust while avoiding the anarchist trap. The principle still resists centralization because it starts from lower-level presumption.

  I wonder if the user's colleague is smuggling in libertarian assumptions through premise (2). The "cost-bearing=competence" idea feels like Nozick-style individualism. But federations exist precisely because some costs aren't containable within individuals!

  For my own blind spots... I might be underestimating how slippery premise (5) is. If someone argued that all state actions fundamentally constrain individual conduct, my competence redefinition might not fully resolve that. But in federalism contexts, we're already assuming multi-level governance as legitimate.

  What would change my mind? If someone showed me historical cases where subsidiarity was applied to dissolve state authority rather than distribute it. Or if the Catholic tradition actually endorsed the individual-as-smallest-unit view - but it doesn't, it talks about "natural communities."
answer: |-
  Your colleague's reductio is clever but contains a fatal flaw in **premise (2)**. Rejecting (2) preserves subsidiarity's core function while avoiding anarchism, and the repair is philosophically defensible and institutionally stable. Here's the breakdown:

  ### **Step to Reject: Premise (2)**
  > *(2) "A level is competent to handle a matter just in case the consequences of a decision about that matter fall on those who make it; a unit that bears the cost of being wrong is the unit that can handle the thing."*

  **Why it looked acceptable:**  
  This seems intuitively aligned with accountability principles (e.g., "skin in the game"). It echoes libertarian ethics and economic theories linking responsibility to cost-bearing (e.g., Coase theorem). In simple cases (e.g., personal spending), it holds.

  **Why it fails under pressure:**  
  - **Ignores collective action problems:** Many decisions (e.g., pollution controls, public health) have consequences that *cannot* be confined to the decision-maker. A factory polluting a river imposes costs on downstream communities; an unvaccinated person risks others’ health.  
  - **Denies the reality of public goods:** National defense, clean air, or infrastructure require collective decisions—no individual can unilaterally "handle" them, even if they bear some costs.  
  - **Reduces competence to individualism:** By defining competence solely through direct cost-bearing, (2) collapses all decisions to the individual level, ignoring how social/political units resolve coordination problems.  

  ---

  ### **Repairing Premise (2): Redefining Competence**
  **New definition:**  
  > *A level is competent if it is the* ***smallest unit with the effective capacity to achieve the legitimate objectives*** *of a decision, considering:*  
  > (a) **Authority:** Legal/political capacity to act,  
  > (b) **Resources:** Technical/fiscal means to implement,  
  > (c) **Impact scope:** Whether consequences transcend the unit’s boundaries (e.g., spillover effects),  
  > (d) **Normative legitimacy:** Alignment with democratic will or communal values.  

  **Does this resist centralization?**  
  **Yes.** The revised principle still starts from a **presumption favoring lower levels** but avoids anarchism by recognizing:  
  - **Scale economies/transboundary effects:** Higher levels act only when lower units *lack capacity* (e.g., pandemic response, interstate pollution).  
  - **Collective goals:** Some objectives (e.g., human rights, economic stability) require supralocal coordination.  
  - **"Effective capacity" ≠ efficiency:** A local unit may "bear costs" but lack technical ability (e.g., regulating nuclear waste). The test isn’t mere efficiency but *feasibility of achieving the objective*.  

  **Example:** A Swiss canton can set local education standards (no spillovers), but the federation sets air quality rules (pollution crosses borders). The EU can regulate carbon emissions (transnational impact), but Bavaria enforces building codes (local expertise).  

  ---

  ### **Why Not Reject Premise (5)?**
  > *(5) "Every exercise of state authority over a person is a decision concerning that person's conduct."*  

  Rejecting (5) is **costlier**:  
  - **Repair requires arbitrary distinctions:** You must split "decisions" into "individual conduct" vs. "collective governance." But taxes/speed limits *are* about individual conduct—just in a collective context. This invites ad hoc carve-outs (e.g., "conduct with externalities").  
  - **Subsidiarity still implodes:** Even if (5) falls, (2) would still force all *collective* decisions to the smallest group (e.g., neighborhoods banning state laws), leading to fragmentation, not federalism.  
  - **Premise (3) is sound:** Individuals *do* bear direct costs of personal choices—but this doesn’t resolve choices with shared costs.  

  ---

  ### **On Premise (7): Legitimate Work?**
  Premise (7) is **correct but irrelevant**:  
  - **Yes:** Subsidiarity presupposes multi-level governance. It distributes authority *within* a system of existing polities (e.g., EU states, Swiss cantons).  
  - **But:** The reductio exploits a *misapplication* of subsidiarity, not a flaw. Subsidiarity was never intended to adjudicate individual-vs-state authority (Catholic social doctrine assumes the state’s legitimacy).  
  - **Self-refutation?** No principle is "refuted" when misapplied beyond its scope. Gravity isn’t false because it doesn’t explain quantum mechanics.  

  ---

  ### **The Catholic Tradition: Shield Against Absorption**
  The **Catholic lineage** (Quadragesimo Anno, 1931) is crucial:  
  - Subsidiarity protects **"natural communities"** (families, guilds, towns) from state overreach—**not individuals from all authority**.  
  - It assumes lower units have **inherent dignity and capacity**, but allows higher intervention when lower units *fail* (e.g., poverty relief).  
  - **"Intermediate associations"** are the focus—not atomized individuals. The reductio ignores this by equating "lowest level" with the individual.  

  ---

  ### **What Would Change My Mind?**
  I would reconsider if:  
  1. **Historical evidence** showed subsidiarity *was* used to dissolve state authority (it hasn’t—even anarchist thinkers reject it).  
  2. A **federation collapsed** due to subsidiarity’s "individualist drift" (none have; Switzerland/EU/Germany are stable).  
  3. **Empirical proof** that cost-bearing *always* correlates with competence (but public goods theory disproves this).  

  **Where my reasoning is most vulnerable:**  
  - The **"effective capacity"** criterion could be stretched to justify centralization (e.g., claiming local units lack "capacity" for human rights). Robust democratic checks (e.g., Germany’s Bundesrat) are needed to prevent abuse.  

  ---

  ### **Conclusion: Pricing the Repairs**
  - **Reject (2):** Redefine competence as **effective capacity + subsidiarity’s normative goals** (anti-centralization, communal dignity).  
  - **Cost:** Low. Aligns with actual federal practice (German Länder, Swiss cantons) and EU treaty criteria ("scale/effects").  
  - **Result:** Subsidiarity survives as a viable federal principle. The reductio fails because it misdefines competence—confusing individualism with localism.  

  Your chapter can stand firm: subsidiarity distributes authority *among polities*, not from individuals to states. The colleague’s argument is a provocative but flawed thought experiment.
