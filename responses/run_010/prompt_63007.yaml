  3.  **Method & Advantage:** Develop and rigorously test the 'lifetime cumulative exposure' metric through hypothetical cases; this beats ad hoc thresholds by grounding complaint size in the principle's total impact *on one life*, cohering with contractualism's focus on justifiability to individuals over their whole lives.
  4.  **Result:** A successful result would demonstrate that this framework robustly generates the intuitive verdicts in one-drowning-vs-five *and* dust-specks/risk cases without summing complaints across different persons, upholding Scanlon's restriction.
  5.  **Failure & Feasibility:** Failure occurs if lifetime cumulative harms either collapse into disguised interpersonal summing (e.g., treating identical lifetime risks across millions as a collective complaint) or fail to intuitively handle key cases; the scope is demanding but feasible for 6,000 words with tight focus on core arguments and cases.
