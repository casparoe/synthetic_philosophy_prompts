  1.  **Question:** Does redefining an individual's complaint under Scanlon's contractualism as the cumulative lifetime harm-risk imposed by a principle, rather than the harm suffered in any single instance, resolve the dust-specks and distributed risk cases while preserving the individualist restriction against interpersonal aggregation?
