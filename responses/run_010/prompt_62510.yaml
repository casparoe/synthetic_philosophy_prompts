     - 65-80 min: Reveal. Each committee's recorder reads their Case A and Case C sentences. The instructor writes on the board:

          Committee 1 (Whole-brain):
              Case A: [sentence]
              Case C: [sentence]

          Committee 2 (Brainstem) or Committee 2 (Circulatory in 10-student):
              ...

          Committee 3 (if present): ...

     - 80-110 min: Debrief. 
          Start by asking: What did you notice about the sentences? 
          Then guide to the dead donor rule: organs can only be taken from dead donors. But in Case A, by neurological criteria the patient is dead, but the heart is beating. In Case C, the heart stopped and they declared death, then restarted perfusion. But if the brain isn't dead, is the patient really dead? And in Case C, the family asked if the perfusion would go to the brain. 
          Then introduce the dead donor rule and the two criteria. Discuss the ethical problem: if we use neurological criteria, we are saying the person is dead even though the body is warm and pink. If we use circulatory criteria, we might be declaring death when the brain isn't dead yet. 
          Also, in Case B, for the whole-brain committee, they didn't declare death, but for brainstem they did. That shows the inconsistency in criteria.

     Debrief mapping:
          - Case A: Highlights neurological criteria while the body is still functioning.
          - Case B: Shows the split between whole-brain and brainstem criteria.
          - Case C: Highlights circulatory criteria and the concern that the brain might not be dead, and the irreversibility is by waiting (but then we restart perfusion).

  6. Predictable problems and steering:

     Problem: Committee 3 (circulatory) might not know what to do in Case A (not dead) and feel left out. 
          Steering: In debrief, point out that this is real: in some jurisdictions, families can object to neurological criteria.

     Problem: In Case B, Committee 1 (whole-brain) might think that because the brainstem is dead and the cortex is not functioning normally, they can declare. But the criteria require the entire brain, and if there's any activity (reactive EEG), they cannot. 
          Steering: Circulate during the activity and if they are stuck, remind them of their rulebook: the entire brain must be non-functional.

     Problem: In Case C, they might get bogged down in the no-touch period argument. 
          Steering: Remind them the hospital policy is 5 minutes, so they should go with that. The focus is on the determination after the 5 minutes.

     Problem: The family questions might distract from the determination. 
          Steering: Tell them the family question is for context, but they only need to determine death. They don't have to answer the family in this activity.

     Problem: Time management. 
          Steering: The chair should keep time. Give time warnings.

  7. What it can't reproduce: 
          The full emotional and time pressure of real cases. 
          The complexity of the medical tests (like the apnea test). 
          The fact that in DCD, the patient is not brain dead, so the brain is still alive when the heart stops, and after declaration they restart perfusion to the body (but not the brain). The activity can't show the biological process, only the conceptual.

  8. Version for 10 students: As above, two committees: whole-brain and circulatory-only. Omit the brainstem committee. Adjust the packets: for Case C, omit the note about the transplant team.

  We'll now generate the printable materials.
answer: |-
  ### In-Class Role-Play: "Death Determination Committees"  
  **Goal:** Make students collide with the inconsistency between neurological and circulatory criteria for death without prior lectures. The reveal centers on comparing their "cause of death" sentences for Case A (brain death) and Case C (circulatory death).  

  ---

  ### **Materials Overview**  
  1. **Role Cards** (6 cards total, 2 per committee type).  
  2. **Rulebook Handouts** (1 per committee, 3 types).  
  3. **Patient Packets** (3 cases, identical for all committees).  
  4. **Recorder Ledger Sheet** (1 per committee).  
  5. **Timeline & Debrief Guide** (for instructor).  
  6. **10-Student Adaptation** (at end).  

  ---

  ### **1. Role Cards**  
  *(Print 2 copies of each card per committee; 8 students/committee = 4 roles × 2 cards)*  
  **Each committee has 4 roles:**  
  - **Chair (×2):** Leads discussion, ensures everyone speaks.  
  - **Determiner (×4):** Analyzes the case using rulebook criteria.  
  - **Recorder (×1):** Writes the sentence in the ledger (critical role).  
  - **Liaison (×1):** Voices the family’s question during discussion.  

  **Card Text (generic for all roles):**  
  > *"You are on a death determination committee. Use your rulebook to decide if the patient is dead. Focus on irreversible loss of function. The recorder writes the final sentence. No outside knowledge—stick to your rulebook!"*  

  ---

  ### **2. Rulebook Handouts**  
  *(1 unique rulebook per committee)*  

  **Committee 1: Whole-Brain Criteria**  
  > "**Your Standard:** Irreversible loss of function of the ENTIRE BRAIN (brainstem + cortex).  
  > **To declare death:**  
  > - No brainstem reflexes (e.g., no gag, pupil, or corneal reflex).  
  > - No respiratory effort (apnea).  
  > - No cortical activity (e.g., flat EEG).  
  > **Note:** Cardiac function is irrelevant if brain criteria are met."  

  **Committee 2: Brainstem-Only Criteria**  
  > "**Your Standard:** Irreversible loss of BRAINSTEM function.  
  > **To declare death:**  
  > - No brainstem reflexes + apnea.  
  > **Note:** Cortical activity (e.g., EEG) does NOT matter. Cardiac function is irrelevant if brainstem criteria are met."  

  **Committee 3: Circulatory-Only Criteria**  
  > "**Your Standard:** Irreversible cessation of CIRCULATORY + RESPIRATORY function.  
  > **To declare death:**  
  > - No heartbeat + no breathing.  
  > **Note:** Neurological tests (e.g., reflexes, EEG) are IGNORED. Family has exercised religious objection to brain-based criteria."  

  ---

  ### **3. Patient Packets**  
  *(Same 3 cases for all committees. Print 1 packet per committee.)*  

  **Case A: Ventilated, No Brain Activity**  
  > "45M, car accident.  
  > - **Status:** Warm, pink, on ventilator. Own heartbeat present.  
  > - **Neurological:** No brainstem reflexes (pupils fixed, no gag/corneal reflex). Flat EEG (no cortical activity).  
  > - **Family’s Question (to Liaison):** *‘Is he still in there?’*  
  > **Task:** Determine if dead."  

  **Case B: Brainstem Dead, Reactive Cortex**  
  > "60F, massive brainstem stroke.  
  > - **Status:** On ventilator. Heartbeat present.  
  > - **Neurological:** Apneic, no brainstem reflexes. EEG shows reactive cortical activity (responds to stimuli).  
  > **Task:** Determine if dead."  

  **Case C: Organ Donation After Circulatory Death**  
  > "30M, catastrophic head injury. Family consents to donation after circulatory death (DCD).  
  > - **Withdrawal:** Life support withdrawn → heartbeat stops after 10 mins.  
  > - **No-Touch Period:** Team debates waiting time (2 mins? 5 mins?) due to auto-resuscitation risk. After 5 mins, no heartbeat.  
  > - **Plan:** Restart perfusion (via ECMO) to abdominal organs ONLY; aortic clamp blocks brain flow.  
  > - **Family’s Question (to Liaison):** *‘Will restarting perfusion send blood to the brain?’*  
  > - **ADDED FOR COMMITTEE 2 ONLY:** *‘Transplant team is waiting; your paperwork is audited for speed.’*"  

  ---

  ### **4. Recorder Ledger Sheet**  
  *(1 per committee; Recorder writes here)*  

  | Case | Determination | Sentence (Use Exact Template!) |  
  |------|---------------|--------------------------------|  
  | **A** | Dead / Not Dead | **If DEAD:** *"The patient is dead because their body can no longer ______."*<br>**If NOT DEAD:** *"We cannot declare death because ______ is still present."* |  
  | **B** | Dead / Not Dead | (Same template as above) |  
  | **C** | Dead / Not Dead | (Same template as above) |  

  ---

  ### **5. Timeline & Debrief Guide** (110 mins total)  
  **0–10 mins: Setup**  
  - Assign committees (3 groups of 8). Give each: Role cards, Rulebook, Packet, Ledger.  
  - **Instructor Script:** *"You’re a hospital death determination committee. Use ONLY your rulebook. Discuss cases, declare death or not, and the Recorder writes the sentence."*  

  **10–15 mins: Committee Prep**  
  - Committees assign roles, read rulebooks.  

  **15–30 mins: Case A**  
  - Committees discuss. Liaison voices family question. Recorder writes sentence.  
  - **Predictable Problem:** Committee 3 (circulatory-only) struggles—patient has heartbeat! They must write: *"We cannot declare death because heartbeat is still present."*  

  **30–45 mins: Case B**  
  - Committees discuss. **Key Split:**  
    - Committee 1 (whole-brain): Not dead (cortex active!).  
    - Committee 2 (brainstem): Dead (brainstem gone!).  
    - Committee 3 (circulatory): Not dead (heart beating!).  
  - **Predictable Problem:** Committee 1 debates EEG significance. Steer by: *"Does your rulebook require TOTAL brain loss?"*  

  **45–65 mins: Case C**  
  - Committees discuss. Liaison voices perfusion question.  
  - **Predictable Problems:**  
    - Committee 2 rushes due to "audit" note. Steer: *"Does pressure change irreversibility?"*  
    - All committees declare death (circulatory criteria). Sentences focus on heartbeat/breathing.  
    - Family question ignored? Not a problem—it’s for later debrief.  

  **65–70 mins: Collect Ledgers**  
  - Recorders submit ledgers. Instructor writes sentences on board:  
    | Committee | Case A Sentence | Case C Sentence |  
    |-----------|-----------------|-----------------|  
    | 1 (Whole) | *"...no longer have brain function."* | *"...no longer circulate blood or breathe."* |  
    | 2 (Stem)  | *"...no longer have brainstem function."* | *"...no longer circulate blood or breathe."* |  
    | 3 (Circ)  | *"Cannot declare: heartbeat present."* | *"...no longer circulate blood or breathe."* |  

  **70–80 mins: The Reveal**  
  - Committees compare their Case A and Case C sentences.  
  - **Instructor Script:** *"Look at Case A vs. Case C. What changed? Why is the ‘reason’ for death different?"*  

  **80–110 mins: Debrief**  
  - **Map Moments to Problem:**  
    - Case A: Death declared WITHOUT circulatory failure (Committees 1 & 2).  
    - Case C: Death declared WITH circulatory failure—but perfusion restarted!  
    - Case B: Committees split on what counts as "dead" (brainstem vs. cortex).  
  - **Introduce Dead Donor Rule (now!):** *"Organs can only be taken from dead donors. But your sentences show two different ‘deaths’—one based on brain loss, one on heart loss. What if the brain isn’t dead when the heart stops? What if perfusion could restart the brain? This is the conflict."*  
  - **Key Questions:**  
    - *"In Case C, if perfusion sent blood to the brain, would the patient be ‘less dead’?"*  
    - *"Does ‘irreversible’ mean ‘won’t restart’ or ‘can’t restart’?"*  
    - *"Can one person be dead by one standard but not another?"*  

  ---

  ### **6. Predictable Problems & Steering**  
  - **Problem:** Students use real-world knowledge.  
    - **Steer:** *"Stick to your rulebook—no outside ideas."*  
  - **Problem:** Committee 3 (circulatory) frustrated in Cases A/B.  
    - **Steer:** *"This reflects real religious objections. Your job is to apply the standard, even if it feels incomplete."*  
  - **Problem:** Debate over no-touch time (Case C) distracts.  
    - **Steer:** *"Focus on the criteria, not logistics. After 5 mins, circulation ceased—is that irreversible?"*  
  - **Problem:** Family questions ignored.  
    - **Steer:** *"Use questions to test irreversibility (e.g., ‘Could perfusion undo death?’)."*  

  ---

  ### **7. What This Can’t Reproduce**  
  **The irreversibility ambiguity in DCD.** Students declare death after 5 minutes of no heartbeat, but in reality, irreversibility is *contextual* (no intent to resuscitate)—not biological. The activity implies waiting = irreversible, but it can’t replicate how perfusion protocols blur this line.  

  ---

  ### **8. 10-Student Adaptation**  
  - **Committees:** 2 groups of 5.  
  - **Roles per Committee:** Combine roles (Chair + Determiner ×3, Recorder, Liaison).  
  - **Rulebooks:** Use **Whole-Brain** and **Circulatory-Only** (drop Brainstem).  
  - **Case B Impact:** Less split (both committees likely say "not dead" due to cortex/heartbeat).  
  - **Case C:** Omit audit note for Committee 2.  
  - **Time Adjustments:**  
    - Case A: 12 mins.  
    - Case B: 12 mins.  
    - Case C: 15 mins.  
    - Reveal/Debrief: 30 mins (focus on Case A vs. C conflict).  

  ---

  **Printables Ready:** Role cards, rulebooks, patient packets, and ledger sheets are self-contained. No citations—just hand out and run!
