  I am a second-year graduate student in philosophy, and this term I am co-organising a small reading group on the first decade of analytic ethics (Russell, Moore, Prichard, Ross). We have just reached Chapter VI of G. E. Moore's *Principia Ethica* (1903), "The Ideal," and I volunteered to open the discussion — a job I am beginning to regret, because although Moore's individual sentences look almost aggressively plain, I cannot get the argument of the opening sections to hang together into anything I would be willing to defend in front of the room. Please take on the role of a scholar of early analytic moral philosophy who has taught this book closely for many years and is accustomed to untangling exactly this kind of confusion in beginners. Work slowly and carefully rather than reaching for a summary: before answering my questions, spend a short paragraph brainstorming what is actually at stake in these sections and what the two or three most likely sources of a reader's confusion are, and only then take the questions one at a time.

  Here is the passage, the opening of §§ 110–111. I have transcribed it exactly as it appears in a free online edition of the 1922 reprint that our library provides, so the punctuation, the lower-case oddities, and at least one apparently mangled sentence belong to that text and not to me:

  > 110. The title of this chapter is ambiguous. When we call a state of things 'ideal' we may mean three distinct things, which have only this in common: that we always do mean to assert, of the state of things in question, not only that it is good in itself, but that it is good in itself in a much higher degree than many other things. The first of these meanings of 'ideal' is (1) that to which the phrase 'The Ideal' is most properly confined. By this is meant the best state of things conceivable, the Summum Bonum or Absolute Good. It is in this sense that a right conception of Heaven would be a right conception of the Ideal: we mean by the Ideal a state of things which would be absolutely perfect. But this conception may be quite clearly distinguished from a second, namely, (2) that of the best possible state of things in this world. This second conception may be identified with that which has frequently figured in philosophy as the 'Human Good,' or the ultimate end towards which our action should be directed. It is in this sense that Utopias are said to be Ideals. the constructor of an Utopia may suppose many things to be possible, which are in fact impossible; but he always assumes that some things, at least, are rendered impossible by natural laws, and hence his construction differs essentially from one which may disregard all natural laws, however certainly established. At all events the question 'What is the best state of things which we could possibly bring about?' is quite distinct from the question 'What would be the best state of things conceivable?' But, thirdly, we may mean by calling a state of things 'ideal' merely (3) that it is good in itself in a high degree. And it is obvious that the question what things are 'ideal' in this sense is one which must be answered before we can pretend to settle what is the Absolute or the Human Good. It is with the Ideal, in this third sense, that this chapter will be principally concerned. Its main object is to arrive at some positive answer to the fundamental question of Ethics—the question: 'What things are goods or ends in themselves?' To this question we have hitherto obtained only a negative answer: the answer that pleasure is certainly not the sole good.
  >
  > 111. I have just said that it is upon a correct answer to this question that correct answers to the two other questions, What is the Absolute Good? and What is the Human Good? must depend; and, before proceeding to discuss it, it may be well to point out the relation which it has to these two premises.
  >
  > (1) It is just possible that the Absolute Good may be entirely composed of qualities which we cannot even imagine. This is possible, because, though we certainly do know a great many things that are good-in-themselves, and good in a high degree, yet what is best does not necessarily contain all the good things there are. That this is so follows from the principle explained in Chap. I. (§§ 18—22), to which it was there proposed that the name 'principle of organic unities' should be confined. This principle is that the intrinsic value of a whole is neither identical with nor proportional to the sum of the values of its parts. It follows from this that, though in order to obtain the greatest possible sum of values in its parts, the Ideal would necessarily contain all the things which have all these parts might not be so valuable as some other whole, from which certain positive goods were omitted. But if a whole, which does not contain all positive goods, may yet be better than a whole which does, it follows that the best whole may be one, which contains none of the positive goods with which we are acquainted.
  >
  > It is, therefore, possible that we cannot discover what the Ideal is. But it is plain that, though this possibility cannot be denied, no one can have any right to assert that it is realised—that the Ideal is something unimaginable. We cannot judge of the comparative values of things, unless the things we judge are before our minds. We cannot, therefore, be entitled to assert that anything, which we cannot imagine, would be better than some of the things which we can; although we are also not entitled to deny the possibility that this may be the case. Consequently our search for the Ideal must be limited to a search for that one, among all the wholes composed of elements known to us, which seems to be better than all the rest. We shall never be entitled to assert that this whole is Perfection, but we shall be entitled to assert that it is better than any other which may be presented as a rival.
  >
  > But, since anything which we can have any reason to think ideal must be composed of things that are known to us, it is plain that a comparative valuation of these must be our chief instrument for deciding what is ideal. The best ideal we can construct will be that state of things which contains the greatest number of things having positive value, and which contains nothing evil or indifferent—provided that the presence of none of these goods, or the absence of things evil or indifferent, seems to diminish the value of the whole. And, in fact, the chief defect of such attempts as have been made by philosophers to construct such an Ideal—to describe the Kingdom of Heaven—seems to consist in the fact that they omit many things of very great positive value, although it is plain that this omission does not enhance the value of the whole. Where this is the case, it may be confidently asserted that the ideal proposed is not ideal. And the review of positive goods, which I am about to undertake, will, I hope, shew that no ideals yet proposed are satisfactory. Great positive goods, it will appear, are so numerous, that any whole, which shall contain them all, must be of vast complexity.

  One further reason I care about getting this right: a friend in the group is working on the Bloomsbury reception of Moore, and she claims that this chapter was read by them as essentially a manifesto about friendship and about the appreciation of art. I want to know whether the *methodology* laid out in these opening sections actually supports reading Moore's eventual conclusions that way, or whether that reading smuggles in something his own argument does not license. Please address the following, in order:

  1. Begin with a plain-English paraphrase of each of the five paragraphs above, and a short glossary of Moore's working vocabulary as it functions here — "good-in-themselves," "positive value," "indifferent," "Summum Bonum," "Human Good," "Utopia," "Kingdom of Heaven," and "principle of organic unities." Note where his usage is idiosyncratic or where the same word shifts sense mid-paragraph.
  2. Explain the three senses of "ideal." In particular, unpack the ordering claim that the question in sense (3) "must be answered before we can pretend to settle what is the Absolute or the Human Good," and show how that claim survives §111(1)'s admission that the Absolute Good might contain *none* of the positive goods we are acquainted with. Is the ordering claim about epistemic priority, metaphysical composition, or something else?
  3. State the principle of organic unities as Moore formulates it, and then identify precisely which steps of the inference in §111(1) depend on it. Does the principle, as stated ("neither identical with nor proportional to the sum of the values of its parts"), by itself entail that a whole containing all positive goods might be *worse* than a whole omitting some? If an extra premise is needed, state it explicitly and say whether Moore is entitled to it.
  4. The long sentence beginning "It follows from this that, though in order to obtain the greatest possible sum of values in its parts…" is clearly garbled in my edition — it appears to be missing a middle clause. Reconstruct what Moore must have been saying, and justify your reconstruction from the surrounding argument rather than from plausibility alone.
  5. Diagnose what looks to me like a contradiction between §111(1), where a whole containing all positive goods may be worse than one omitting some, and the third paragraph, where "the best ideal we can construct will be that state of things which contains the greatest number of things having positive value." While you are there, tell me whether the proviso "provided that the presence of none of these goods, or the absence of things evil or indifferent, seems to diminish the value of the whole" is coherent as written, or whether it too has been mangled.
  6. Say something about the shape of Moore's epistemic humility in the line "We shall never be entitled to assert that this whole is Perfection, but we shall be entitled to assert that it is better than any other which may be presented as a rival." What kind of warrant is that — an asymmetric burden of proof, a default entitlement, something else — and does it deliver everything Moore needs for the rest of the chapter? I have in mind his procedure elsewhere in the book of asking what would be worth having if it existed entirely by itself; if that procedure is relevant here, say how, but correct me if I am misremembering its role.
  7. Finally, the payoff for beauty and friendship. Taking it as given (and please correct me if I have this wrong) that Moore goes on to rank affection for particular persons and the appreciative contemplation of beautiful objects among the greatest goods we know: does the machinery of §§ 110–111 support treating such an affection as an organic unity whose value exceeds that of its components — the emotion together with the cognition of the qualities it is directed at? And what does the principle of organic unities imply about affection for a person who is not good: must such a whole be less valuable, or can a bad part make for a better whole? Tell me which of those readings is consistent with the passage I have quoted, and which is a mistake readers commonly make here.

  Two constraints on your answer. First, no bibliography, no reading list, and no suggestions for further or secondary literature — I have the 1903 text in front of me and nothing else, so recommendations are useless to me and I would rather you spent the words on the argument. Second, keep everything grounded in the passage quoted above: if answering one of my questions genuinely requires a section of the book I have not given you, say so explicitly instead of reconstructing or quoting it from memory. Please distinguish clearly between places where the difficulty is in Moore's text and places where it is in my reading of it, flag anything you are unsure of as unsure, and keep the whole thing under about 1,400 words, organised under headings corresponding to my seven questions.
