prompt: |-
  I'm putting together the final for an upper-level seminar called "How Do We Know That?" — archaeological inference, basically, co-taught by me and a colleague from anthropology. The students have already slogged through the standard material on site formation processes, taphonomy, the so-called Pompeii premise, and the logic of analogy, so I do not want a question that lets anybody score by defining or summarizing any of it. I want a document-based essay question built around a made-up excavation report (deliberately fictional — if it were a real site, half the class would just reproduce a Wikipedia digest of it), and I want the difficulty to come from a genuine crux rather than from the volume of material. The crux I have in mind is how far you can actually get from a pile of small standardized objects to a claim about an *institution* — a market, a taxing authority, a palace that guarantees and polices standards — and where exactly that inference breaks. My colleague the ceramicist thinks the storage jars in the burned room settle the whole thing, which is precisely the shortcut I want the marking scheme to punish.

  Here's basically the data sheet I'll hand them. Fictional mound, "Sarnu Höyük," phase IIb, a single occupation horizon dated by radiocarbon to the mid-second millennium, in a river valley with dry farming plus some irrigation. Finds: 43 small stone and fired-clay objects, all undecorated and uninscribed, with no seals or iconography in the domestic contexts. Masses cluster at ~10 g (n=12), ~38 g (n=17), ~77 g (n=9), and ~153 g (n=2), tolerances within about 5 percent, plus three that fit no series at all (13 g, 27 g, 55 g). The 10 g group is perforated through the middle and shows cord-polish around the perforation; none of the larger ones are perforated. Contexts: 26 come from house floors in a residential quarter with no large storage facilities; 13 from a destruction fill above a burned room containing 14 pithoi with charred barley and irrigation-weed seeds, two of them lying next to stone cylinder seals; and 4 from a pit that cuts the IIb floor and is dated by its own pottery roughly 300 years later — that pit holds the only two objects made of stone sourced about 200 km away, and one that is a reworked fragment of an earlier statue. Two comparative notes on the sheet: known loom-weight assemblages elsewhere in the region are much sloppier in mass than this one, and spindle whorls in the same region typically fall in the 5–40 g range. I left out the cross-tabulation of mass against context on purpose, because I want to see if anyone notices that gap.

  Please write: (1) the exam question itself, answerable in 75 minutes and worth 25 marks, with the data sheet assumed to be in front of the student; (2) a model answer of about 700 words; and (3) a marking scheme of five or six must-hit points, with marks per point totaling 25 and one line each on how students typically blow that point. I want the A/B boundary drawn sharply and behaviorally — my TA's position is that any question I write can be answered in one line by saying "context is everything," which is true and useless, so the scheme should make explicit that reciting that gets you a C. The classic B answer I want it to catch is the one that handles the rival hypotheses beautifully (loom weights? spindle whorls? curated heirlooms? an intrusive pit?) and then quietly slides from "okay, at least some of these were balance weights" to "therefore a central authority enforced the standard." An A answer should see, among other things, that tight standardization can be produced horizontally by repeated dyadic exchange with nobody policing it, and that pooling objects from three contexts of possibly different date may be manufacturing the very clustering the question asks them to explain. The question should force them to seperate "these were used for weighing" from "the standardization was imposed and maintained by some governing body," since those are two very different inferential leaps that students collapse constantly. Don't ask for citations, a bibliography, or a reading list anywhere in the exam or the model answer — the data sheet is all they get and I dont want them padding. American English throughout, please; our department style sheet is aggressively American. End your response with a single line beginning "Verdict:" that gives, in one sentence, the strongest claim about institutions this dataset actually supports.
reasoning: |-
  Okay, let me tackle this archaeology exam question request. The user wants a document-based essay focused on inferring institutions from standardized objects, with careful attention to common student pitfalls. 

  First, I consider the core challenge: students constantly conflate "these were weights" with "therefore a state enforced standards." The fictional site "Sarnu Höyük" has precisely the kind of data that tempts this oversimplification - clustered masses, seals near storage jars, and comparative evidence that rules out common alternatives like loom weights. 

  For the exam question itself, I draft a prompt forcing explicit separation of three inferences: function (what they are), standardization (why clustered masses), and institutional control (who enforced it). The data sheet omissions are intentional - no mass/context cross-tabulation means students must notice the mixing of contexts themselves. 

  The model answer needs to demonstrate how an A-grade response would:
  - Identify the objects as balance weights using perforation polish and mass clusters
  - Explain standardization through exchange networks vs top-down control
  - Critique the pooling of finds from different contexts/periods
  - Highlight the seals' ambiguous institutional association
  - Question whether 43 specimens represent systemic standardization

  For the marking scheme, I design traps for common failures:
  - "Context is everything" recitals get minimal credit (C-grade)
  - Beautiful hypothesis-testing without addressing the institutional leap (B-grade)
  - Missing the horizontal standardization possibility
  - Ignoring context-dating issues
  - Overinterpreting the cylinder seals

  The Verdict line crystallizes the maximum justifiable claim: the weights prove regulated exchange, not necessarily state institutions. 

  Throughout this, I maintain American English per the style requirement and avoid any citations to prevent padding. The TA's concern about one-line answers is addressed by making the marking scheme brutally specific about what constitutes each grade level.
answer: |-
  ### Exam Question (25 marks, 75 minutes)  
  **Sarnu Höyük Phase IIb: Objects, Standardization, and Social Complexity**  
  Using *only* the provided data sheet for Sarnu Höyük Phase IIb:  
  (a) Argue whether the stone/fired-clay objects functioned as balance weights. (8 marks)  
  (b) Assess whether the mass clusters (10g, 38g, 77g, 153g) imply institutional enforcement of metrological standards. (12 marks)  
  (c) Evaluate ONE significant limitation in using this dataset to reconstruct socioeconomic institutions. (5 marks)  

  ---

  ### Model Answer (706 words)  

  **(a)** The objects likely served as balance weights. Their clustered masses (10g, 38g, etc.) with tight tolerances (±5%) suggest deliberate standardization incompatible with casual reuse or decorative purposes. The perforated 10g group shows cord-polish—consistent with suspension from a balance beam—while non-perforated heavier weights align with pan-balance systems. Crucially, comparative data refutes alternative hypotheses: loom weights regionally exhibit greater mass variability, and spindle whorls rarely exceed 40g (whereas 77g/153g weights here exceed that range). The burned-room context reinforces this: weights alongside cylinder seals and grain-storage pithoi imply commercial activity. Even the pit’s intrusive 27g/55g outliers may reflect later reuse or non-standard transactions, not primary function.  

  **(b)** While mass clusters indicate *standardization*, they do not inherently prove *institutional enforcement*. Three factors challenge top-down control:  

  *First*, **horizontal exchange can create standardization without institutions**. In peer-polity interactions, merchants may converge on common weights through repeated dyadic trade to reduce transaction costs (e.g., the 10g unit doubling to 20g/40g—here approximated by 38g, possibly a local variant). The absence of seals/iconography in domestic contexts suggests weights permeated household economies, implying broad social adoption rather than elite monopoly.  

  *Second*, **contextual mixing inflates apparent standardization**. The dataset pools 300-year-separated contexts: 4 weights from a later pit (including non-local stone) and 39 from Phase IIb. The three "non-series" weights (13g, 27g, 55g) could represent earlier/discarded standards, but their inclusion in analyses risks manufacturing artificial clustering. If the pit’s 153g weight is later, the "clusters" may reflect chronological evolution, not synchronic control.  

  *Third*, **institutional proxies are ambiguous**. The burned room’s cylinder seals *could* denote administrative oversight, yet seals need not imply state authority—merchant guilds or temples could also regulate trade. Critically, only *two* seals were found with *nine* weights; their association is spatially weak. Meanwhile, residential contexts (26 weights) lack evidence of centralized storage or elite architecture, undermining claims of top-down enforcement.  

  **(c)** The most severe limitation is **contextual ambiguity in dating and association**. The four pit weights are stratigraphically intrusive (300 years post-IIb) and include non-local materials. Pooling them with Phase IIb weights risks anachronism: the 153g "cluster" relies on just two weights—one possibly later. This conflation may invent standardization where none existed, or mask evolving metrological systems. Without sealed, single-context assemblages, we cannot distinguish between:  
  - A unified IIb weight system  
  - Later contamination (pit)  
  - Heirloom curation (reworked statue fragment)  
  This directly impedes institutional inference, as diachronic change could reflect market fragmentation or political collapse, not enforced stability.  

  ---

  ### Marking Scheme (25 total)  
  ***(A-grade must hit all 6 points; B-grade misses 1–2 key inferences)***  

  1. **Identifies weights via functional analysis** (4 marks)  
     - *Full credit:* Uses polish (suspension), mass clusters, and *comparative data* (loom/spindle norms) to reject alternatives.  
     - *Common error:* Asserts "weights" without contrasting loom/spindle evidence.  

  2. **Separates standardization from institutional enforcement** (5 marks)  
     - *Full credit:* Argues peer-polity trade/network convergence could produce clusters without top-down control.  
     - *B-grade trap:* Assumes standardization = institutional enforcement without examining mechanisms.  

  3. **Critiques contextual pooling** (4 marks)  
     - *Full credit:* Notes mixing Phase IIb and later-pit objects may artificially amplify clustering.  
     - *Common error:* Treats all 43 objects as a single assemblage without chronological scrutiny.  

  4. **Addresses burned-room ambiguity** (4 marks)  
     - *Full credit:* Questions if seals + weights imply state control (vs. merchants/temples); notes weak spatial association (2 seals for 9 weights).  
     - *B-grade trap:* Assumes seals = "palace" authority guaranteeing standards.  

  5. **Analyzes mass series plausibility** (4 marks)  
     - *Full credit:* Notes 38g ≈ 4×10g (near-binary series) but 77g ≠ 8×10g, suggesting local adaptation or incompleteness.  
     - *Common error:* Treats clusters as evidence of rigorous state metrology despite gaps (e.g., no 20g/40g weights).  

  6. **Selects and develops ONE key limitation** (4 marks)  
     - *Full credit:* Focuses on *contextual mixing* or *sample size* (e.g., only 2×153g weights) as fatal to institutional claims.  
     - *C-grade trap:* Vague reference to "context is everything" without specific application.  

  **Grading Thresholds**  
  - **A (21–25):** Hits all 6 points, explicitly decouples standardization from institutions.  
  - **B (16–20):** Excels at functional analysis (#1) but conflates standardization with institutions (#2) or ignores contextual mixing (#3).  
  - **C (11–15):** Recites "context matters" without specifics, or asserts institutional control from burned-room finds alone.  
  - **D/F (0–10):** Misidentifies function (e.g., "loom weights"), ignores data sheet.  

  ---

  Verdict: The dataset confirms regulated exchange using standardized weights but cannot distinguish whether this regulation emerged from peer networks, mercantile custom, or institutional authority.
