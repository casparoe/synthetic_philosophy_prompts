prompt: |-
  I keep coming back to this asymmetry in contract law and I can't figure out what it's actually committed to, so I want to lay the whole thing out and see if you can tell me what's underneath it.

  Say I contract to sell you a house, prices jump, and I refuse to sign the deed over. You can get a court to order me to convey it, on the standard reasoning that land is unique and money can't put you where you would have been. Now say I sign a three-year employment contract and walk out after six months because someone offered me more. My employer can sue me for the difference — what it costs them to replace me — but no court will order me back to the job. Personal service contracts are the classic exception to specific performance, and the reasons given are that a court can't supervise the quality of coerced work, that compulsion would be a hardship, and in the US that it runs into the 13th Ammendment's ban on involuntary servitude (Bailey v Alabama struck down a state law that made it a crime for a worker to take an advance and then quit).

  But the same system does three other things that seem to cut the other way. It's perfectly happy to let me sell my labor-power for forty years on the assumption I'm handing over something I own. Most states will enforce a reasonable non-compete, and courts going back to an 1852 English opera case, Lumley v Wagner, will issue a negative injunction barring a singer or an athlete or a star executive from working for a rival for the rest of the term — while insisting this isn't just specific performance through the back door. And meanwhile it refuses outright to enforce the consensual sale of other things attached to a person: kidneys, votes, yourself into slavery, none of which are for sale at any price.

  Here's the part I can't get straight. The damages rationale says labor is replaceable — the boss is made whole by hiring somebody else — which makes my working sound like a fungible commodity, no different from a shipment of wheat. The 13th Amendment rationale says nearly the opposite: that there's something about my working that can't be transferred the way a deed can. Both can't be the deep reason. And the negative injunction sits weirder than either, because the court won't make me exert myself but it will happily turn my *not* exerting myself somewhere else into an enforceable asset. My working hypothesis — tell me if this is too cute — is that what the doctrine is really committed to isn't the inalienability of labor at all but the alienability of exclusivity: it treats my future abstention from other employers as property the current one can hold, while treating my actual activity as something nobody can be made to supply. On that reading the law has no problem with Marx's distinction between labor and labor-power, so long as labor-power gets cashed out as a claim on what I won't do rather than on what I will.

  So: reconstruct the theory of self-ownership and alienability that this practice only makes sense under, and be strict about it. Seperate out what the doctrine genuinely presupposes from what it merely sits comfortably with — supervision costs and contempt-of-court practicalities might explain the whole pattern with no philosophy down there at all, and if that's the right answer I want to hear it. Say where the practice is underdetermined, meaning which rival views would license it equally: libertarian self-ownership, the line that persons can't be treated as things, the market-inalienability view that some goods can be had and used but not sold, and a Marxian reading on which the whole arrangement is exploitation dressed up as liberty. Then tell me what would concretely have to change in the doctrine if we swapped the presupposed view for (a) full commodification of labor, enforcing employment contracts the way we enforce land sales, or (b) thoroughgoing inalienabilism. And flag anywhere above where I've got the law wrong, since I'm reconstructing this from a contracts class a while back.

  One thing I need from you: keep clear about which parts of this are settled among people who actually work on contract theory and labor law and which are live disputes, and don't hand me a contested reading as though it were the consensus. If most specialists think my exclusivity hypothesis is confused, say that plainly rather than being polite about it. No citations or reading list needed, I just want the reconstruction.
reasoning: |-
  Okay, this user is wrestling with a deep contradiction in contract law around labor and property. They've noticed courts treat land sales and employment contracts completely differently - specific performance for land but only damages for labor - and they're probing the philosophical underpinnings. The asymmetry bothers them intellectually, especially since courts simultaneously enforce non-competes (negative injunctions) while refusing to enforce sales of kidneys or votes. 

  What's really impressive is how they've synthesized three conflicting doctrinal rationales: fungibility (labor is replaceable), inalienability (13th Amendment concerns), and this weird middle-ground of negative injunctions. Their "exclusivity hypothesis" is sharp - suggesting law commodifies abstention from work but not work itself. I need to test that against the actual legal logic without getting seduced by its elegance.

  The user clearly knows their stuff (citing Bailey v Alabama and Lumley) but wants to separate legal doctrine from philosophical justification. They're demanding rigor: no platitudes about "personal liberty," just cold analysis of what the practice necessarily assumes. And they're alert to trapdoors - practical concerns like supervision costs might explain everything without deeper philosophy. 

  Hmm... the challenge is disentangling layers. At surface level, the doctrine says: land unique (specific performance ok), labor personal (only damages), but negative injunctions are "different" because they're prohibitory. But as the user senses, that's unstable. The 13th Amendment argument is especially tricky - if compelled service is "involuntary servitude," why isn't enforcing a non-compete also compulsion? Courts dodge by saying negative injunctions only restrict choice, not compel action. That feels semantic.

  Where the user might be overreaching is assuming coherence. Legal doctrine often accretes historically without a unified theory. The "supervision difficulty" rationale for no specific performance in employment predates the 13th Amendment argument by centuries. The negative injunction workaround emerged because employers needed leverage but courts didn't want to force labor. So maybe there is no grand theory - just pragmatic fixes.

  But their exclusivity hypothesis has bite. Law does treat the promise not to compete as alienable property while refusing to treat labor effort that way. That resonates with the law's tolerance for non-competes but refusal to enforce actual slavery contracts. Still, I should flag that many labor scholars reject this as legitimizing exploitation - they'd say non-competes already overcommodify labor.

  For the reconstruction: the minimal commitment is that active labor can't be forcibly extracted, but passive obligations (not working elsewhere) can be owned by others. That sits with libertarian self-ownership if you squint, but also with market-inalienability theories. Crucially, it doesn't require believing labor is fungible - courts award damages while admitting replacement workers aren't identical. The 13th Amendment layer is less foundational than ornamental in this structure.

  If we switched to full commodification (option a), courts would order specific performance of employment contracts - back to indentured servitude. If thoroughgoing inalienability (b), non-competes would vanish and maybe employment contracts become unenforceable beyond wage recovery. Neither is likely. The doctrine's messy stability comes from balancing employer power with nominal worker freedom - which is exactly why Marxists see it as ideological.
answer: |-
  Here's a reconstruction of the conceptual commitments underlying the asymmetry, stripped to necessary presuppositions while acknowledging doctrinal underdetermination and contested interpretations:

  ### Core Doctrinal Commitments (Minimal Necessities)
  1. **Body/Will Inalienability**:  
     - *Presupposed*: Direct compulsion of ongoing affirmative physical/mental exertion violates a foundational principle. The 13th Amendment constitutionalizes this in the US, but the principle predates it (e.g., refusal of specific performance in personal service contracts in English common law).  
     - *Not Presupposed*: That labor is fungible (damages remedy coexists with acknowledgment of uniqueness in non-compete contexts).  

  2. **Alienability of Negative Covenants**:  
     - *Presupposed*: One can transfer enforceable rights over *forbearing* specific future actions (not working for rivals, not disclosing secrets). This treats abstention as a proprietary right.  
     - *Not Presupposed*: That labor is commodified *as activity*. The law commodifies *exclusivity*, not effort.  

  3. **Property as Proxy for Personhood**:  
     - *Presupposed*: Land/unique goods embody personal/symbolic value justifying specific performance. Labor activity does not—its value is severed from the body in remedy calculations.  

  ### Why Practical Explanations Aren't Sufficient Alone
  - Supervisory difficulty/hardship *explains the remedy choice* but not the *categorical refusal* for personal service. Courts don't attempt specific performance even for easily monitored roles (e.g., discrete tasks). The 13th Amendment makes this explicit, but the principle is deeper.  
  - Contempt mechanisms could theoretically enforce employment (jail for non-compliance), yet courts reject this outright. The barrier is normative, not pragmatic.  

  ### Your Exclusivity Hypothesis: Plausible but Contested
  - **Strength**: Accurately identifies the law's comfort with alienating *negative duties* (non-compete) vs. rejection of alienating *affirmative performance*. This maps to labor-power (capacity to work) being partially alienable as exclusivity, while labor (actual work) is not.  
  - **Critique**: Many labor scholars argue non-competes *functionally* commodify labor by restricting autonomy, and the "negative injunction" distinction is formalistic. Your hypothesis describes the doctrine's *internal logic* well, but critics see it as ideological cover for employer power.  

  ### Underdetermination: Rival Views Compatible with Doctrine
  | View                 | Compatibility | Points of Tension |
  |----------------------|--------------|-------------------|
  | **Libertarian Self-Ownership** | High | Can justify alienating exclusivity (as property right) while rejecting bodily compulsion. But struggles to explain non-enforcement of voluntary slavery contracts. |
  | **Personhood (Radin)** | High | Market-inalienability explains bans on selling kidneys/votes. Labor is "incompletely commodified" – alienable only in limited forms (wages, exclusivity) but not as compelled service. |
  | **Marxian Exploitation** | High | Doctrine perfectly reflects capital's need to control labor-power without owning laborers: damages commodify labor as replaceable input; non-competes protect investment in labor-power. The 13th Amendment rationale obscures this. |
  | **Formalist Neutrality** | Moderate | Doctrine balances efficiency (damages for fungibles) with "practical justice" (specific performance for uniqueness). Frames 13th Amendment as exogenous constraint. |

  ### Swapping Foundational Views: Concrete Changes
  - **(a) Full Commodification of Labor**:  
    - Specific performance routinely ordered for employment contracts.  
    - Non-competes redundant; employers could demand continued performance.  
    - Damages insufficient remedy; contempt sanctions (fines, imprisonment) for refusal to work.  
    - *Doctrinal shift*: 13th Amendment reinterpreted/narrowed; *Bailey v. Alabama* overruled.  

  - **(b) Thoroughgoing Inalienabilism**:  
    - Non-competes unenforceable as improper restraints on personal liberty/capacity.  
    - Employment contracts limited to wage recovery; no damages for "cost of replacement."  
    - *Doctrinal shift*: Negative injunctions like *Lumley v. Wagner* abolished; labor reclassified as "non-alienable personal capacity."  

  ### Where Your Description is Legally Precise
  - Specific performance for land vs. damages for employment: Correct.  
  - Non-enforcement of organ/vote/slavery sales: Correct.  
  - *Lumley v. Wagner* distinction (negative injunction ≠ specific performance): Correct as formal doctrine, though functionally blurry.  
  - 13th Amendment as barrier: Correct per *Bailey* and modern precedent.  

  ### Where Doctrine is Ambiguous/Contested
  - **Labor Fungibility**: Courts *say* labor is replaceable (justifying damages) but *act* as if it isn’t (enforcing non-competes for "unique" talent). No consistent commitment.  
  - **13th Amendment Scope**: Does it bar only *criminal penalties* for breach (per *Bailey*) or all compulsion? Lower courts split; SCOTUS avoids direct ruling.  

  ### Specialist Consensus vs. Disputes
  - **Settled**:  
    - Specific performance unavailable for personal service contracts.  
    - Negative injunctions enforceable for defined non-competes.  
    - 13th Amendment prohibits *criminalizing* breach of employment contract.  
  - **Live Disputes**:  
    - Whether non-competes constitute "involuntary servitude." (Scholars: Yes; Courts: No).  
    - Whether damages adequately commodify labor or reflect its uniqueness.  
    - Your "exclusivity" hypothesis is a respected *critical* theory (associated with Margaret Radin/Karl Klare) but rejected by formalists. No consensus.  

  **Conclusion**: The doctrine minimally presupposes that (1) affirmative labor cannot be compelled without violating bodily autonomy, and (2) promises of forbearance (non-compete) are alienable property rights. This reflects a hybrid commitment: self-ownership as control over bodily acts, paired with market-alienability of abstracted economic interests. It’s equally consistent with liberal personhood theory and Marxian exploitation narratives—the practice is ideologically underdetermined but functionally serves capital accumulation within constraints of formal freedom.
