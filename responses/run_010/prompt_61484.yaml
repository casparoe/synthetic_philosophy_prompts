prompt: |-
  So — slightly unusual request, and I'm writing it in a hurry between sections, so bear with me.

  For about five years now I've been the token philosopher on our law school's criminal-justice clinic advisory panel. What actually happens is this: a couple of times a term a student team brings me a packet — a defense motion, a neuropsychologist's affidavit, sometimes a single highlighted paragraph from an expert's CV-length report — and it invokes the neuroscience of free will. Usually it's Libet-style stuff: readiness potentials, the wrist-flexion clock task, "the brain began the movement before the subject was aware of deciding," occasionally the veto finding, occasionally a general gesture at "diminished top-down control" from addiction or impulse-control imaging. The students have zero neuroscience and, honestly, only a hazy grip on the metaphysics either. Their default is to assume that if a PhD says it, it's load-bearing. My job is to tell them, fast, whether the science in front of them is doing real work in the argument, doing decorative work, or is actively misleading and should be struck from the brief.

  Over time I've started sorting what I see into four moves, and I use my own nicknames for them, which the students have picked up: the **delay move** (awareness of deciding comes after the neural onset, so the conscious decision isn't the cause); the **machine move** (the buildup is just stochastic noise crossing a threshold, so there's no authored decision anywhere in the story — this one is usually waved at with a citation to Schurger's accumulator reanalysis in PNAS back in 2012); the **threshold move** (the person's evidence of impaired control shows their accumulator sits closer to the bound, or their urgency signal is steeper, so the outcome was likelier regardless of what they deliberated about); and the **veto move** (even granting all that, late cancellation is intact, so what survives is only a thin kind of authorship, and thin authorship supports mitigation but not exculpation). I'm genuinely not sure this taxonomy is right, and part of what I want from you is a straight answer on whether it carves things well or whether it's collapsing distinctions that have to stay seperate.

  Here's the ask. Write me a screening procedure my students can run on one of these packets in twenty minutes, with no neuroscience background, that ends in one of three verdicts: the neuroscience is load-bearing for the legal claim being made, it's decorative (harmless but not doing work — say so and move on), or it's misleading and should come out of the brief. I want the questions in order, what counts as a passing answer to each, and where the procedure stops because the remaining question is philosophical or legal rather than empirical — because a lot of these packets fail at exactly that seam, e.g. they assume that "voluntary" as the criminal law uses it has to mean whatever the free-will literature means by it, and I need my students to see when that assumption is carrying all the weight. Tell me which of the moves in my taxonomy each question is designed to catch. Then run the procedure on three cases: (1) an assault motion attaching an affidavit that the defendant's "intent was formed after the motor program had already been initiated," offered to negate mens rea; (2) an insurer's argument, in a civil matter, that a claimant's addiction-related imaging findings show his later decision to enter treatment wasn't really his; and (3) the one I'll hate — a student note I've twice assigned good grades to, arguing that the stochastic-accumulator reading is *better for the defense* than the Libet reading, since on that picture there is no decision at all to be responsible for. If case three survives your procedure and I'm wrong about it, say that plainly; if it doesn't, say why, because I want to stop assigning it.

  Also: mark every step that's a judgment call wearing a procedure's clothing. I'd rather the checklist admit where it needs a human than pretend to be a decision procedure all the way down. And at the end, give me your own confidence — how sure are you about the empirical claims you're relying on at each stage, and which single step are you least sure of? If there's a place where you're reconstructing what the science says rather than recalling it, point at it so I can check it before I hand this to nineteen-year-olds.
reasoning: |-
  Okay, let me unpack this fascinating request. The user is a philosopher embedded in a law clinic, needing a rapid neuroscience screening tool for students. The core tension is between scientific validity and legal relevance - with high stakes for real cases. 

  First, I notice the user's taxonomy reflects deep engagement with neuro-legal pitfalls. Those "moves" are spot-on categorizations of how neuroscience gets misapplied. The delay/machine/threshold/veto framework maps neatly to the most common overextensions in court documents. What's smart here is how they've already identified the fracture points between empirical findings and philosophical leaps.

  The request reveals three unspoken needs beyond the explicit checklist: 
  1) Teaching students to spot when "voluntary" is being smuggled between disciplines 
  2) Preventing overconfidence in PhD credentials 
  3) Creating cognitive speed bumps before students file briefs

  For the screening procedure, I'll need to build layers of failure points. First filter for basic scientific coherence (is this finding replicable?), then causal relevance (does it actually impact the legal element?), finally philosophical overreach (are we conflating constructs?). The trick is making each step binary enough for novices while flagging where judgment calls hide.

  Case 1 (assault motion) will fail early - Libet's wrist flex has zero bearing on criminal intent. Case 2 (insurer argument) fails at the translation layer - "his decision" isn't a neuroscientific construct. Case 3 (student note) is interesting because it reveals a common misconception: absence of "decision" in accumulator models doesn't equal absence of responsibility. That student needs to read Morse on "no free will worries."

  My biggest uncertainty is threshold cases where impairment metrics might actually have evidentiary value (e.g., established tumor-based compulsion). The procedure must force students to distinguish between correlation and causation there. Also need to emphasize that even "decorative" neuroscience can prejudicially sway juries - so "harmless" is contextual.

  The confidence ratings will need to be brutally honest - especially about how fMRI addiction findings can't support the "not his decision" leap. Might add a footnote about U.S. v. Semrau's judicial skepticism of neuro-evidence overreach.

  Final design principle: The checklist must self-destruct at philosophy. When it hits "does diminished accumulator capacity = diminished legal voluntariness?" - that's where students should slam the brakes and call the philosopher.
answer: |-
  Here's a neuroscience screening procedure for law students, designed as a 20-minute flowchart. It addresses your taxonomy and flags philosophical seams. **Bold** = critical question, *Italics* = judgment points.

  ---

  ### **Neuro-Screening Checklist for Legal Briefs**
  *(Run in Order - Stop at First "No" or "Unclear")*

  1.  **Is the cited science *directly* about the specific behavior/decision in this case? (Targets: All moves - Relevance Check)**
      *   *Pass:* Explicit link (e.g., "this defendant's brain scan shows X impairment related to impulse control for violence *in this context*"). *Or* robust, uncontroversial general finding applied appropriately (rare).
      *   *Fail/Stop (Misleading/Decorative):* Abstract lab finding (e.g., Libet wrist flex), general "free will" commentary, findings from unrelated behaviors/conditions. *Verdict: Likely **Misleading** or **Decorative**.*
      *   *Judgment Call:* Strength of the link. Lab wrist flex ≠ real-world assault.

  2.  **Does the science claim to show the *decision/action* was *caused* by a specific neural mechanism *outside* normal control? (Targets: Delay, Machine, Threshold Moves - Causality Check)**
      *   *Pass:* Clear, specific mechanism alleged (e.g., "epileptic discharge directly triggered violent act," "severe tumor compulsion"). Requires strong, direct evidence *for this case/condition*.
      *   *Fail/Stop (Misleading/Decorative):* Shows correlation (brain activity precedes awareness, brain looks different in addicts), implies "determinism," or describes *how* decisions *might* work generally (e.g., accumulator models). *Verdict: Likely **Misleading** (implies causation) or **Decorative** (just background).*
      *   *Judgment Call:* Distinguishing causation claims from correlation/mechanism description. Most neuro-evidence fails here.

  3.  **Does the science *explicitly negate* the specific legal state of mind (mens rea) OR *explicitly demonstrate* the specific legal incapacity (e.g., compulsion)? (Targets: All moves - Legal Element Check)**
      *   *Pass:* Direct mapping argued with neuroscientific evidence *specifically supporting the legal element's absence* (e.g., "this fMRI pattern proves defendant *could not form intent*," "this lesion data proves *inability to appreciate wrongfulness*" - requires extraordinary evidence).
      *   *Fail/Stop (Misleading/Philosophical):* Uses neuroscience to redefine "voluntary," "intentional," "free," "responsible," or "control" in a way *not recognized by law*. Argues neuroscience *changes the meaning* of the legal element itself. *Verdict: **Misleading** (smuggles in philosophy) or signals **Philosophical/Legal Seam**.*
      *   *Judgment Call:* Is it attacking the *legal definition* or providing evidence relevant *within* the existing definition? The seam is here.

  4.  **Is the "impaired control" evidence *specific*, *quantitative*, and *directly tied* to the *defendant's capacity at the relevant time*? (Targets: Threshold Move - Impairment Specificity Check)**
      *   *Pass:* Diagnosis + specific, validated biomarker/test result + clear link to *the specific capacity required by the law* (e.g., impulse control for violence) + evidence it applied *at the time of the act*. (Extremely high bar).
      *   *Fail/Stop (Misleading/Decorative):* General group findings ("addicts show reduced PFC activity"), vague claims ("diminished top-down control"), lack of temporal link, inferring legal incapacity from general impairment. *Verdict: Likely **Misleading** (overstates impairment) or **Decorative**.*
      *   *Judgment Call:* Strength and specificity of the link between biomarker and *precise legal incapacity*.

  5.  **Does the science claim intact "veto power" undermines responsibility? (Targets: Veto Move - Veto Relevance Check)**
      *   *Pass (Rare - Usually Philosophical):* Explicit argument that *only* late cancellation constitutes "real" authorship, therefore earlier processes negate responsibility. *Verdict: Signals **Philosophical/Legal Seam**.* (The science *describes* veto; the *legal conclusion* is philosophy).
      *   *Fail/Stop (Misleading/Philosophical):* Merely mentions veto power exists without arguing its sufficiency for responsibility. *Verdict: **Decorative** or signals **Philosophical/Legal Seam**.*
      *   *Judgment Call:* Is the *veto finding itself* being used evidentially (e.g., to show capacity for inhibition was intact/impaired - see Q4), or is it part of a *philosophical argument* about the *nature* of responsibility?

  **Final Verdicts:**
  *   **Load-Bearing:** Passes Q1, Q2, Q3. *(Exceptionally Rare)*
  *   **Decorative:** Fails Q1, or Passes Q1 but fails Q2/Q3/Q4 without being misleading (e.g., general background on addiction).
  *   **Misleading:** Fails Q2 (implies causation), Fails Q3 (redefines legal term), Fails Q4 (overstates impairment), or relies on Q5 for a philosophical redefinition of responsibility.
  *   **Philosophical/Legal Seam:** Fails Q3 or Relies on Q5's philosophical implication. *Science isn't doing the work; philosophy is.*

  ---

  **Applying the Procedure to Your Cases:**

  1.  **Assault Motion (Libet-style affidavit):**
      *   Q1: **Fail.** Libet wrist flexion ≠ forming intent for assault. *Verdict: **Misleading** (suggests irrelevance applies).* **STOP.**
      *   *(Catches: **Delay Move** - misapplied to real-world intent)*

  2.  **Insurer's Argument (Addiction imaging):**
      *   Q1: Pass? (General link to addiction).
      *   Q2: **Fail.** Shows correlation/difference, not causation of *this specific decision* being "not his." *Verdict: **Misleading** (implies causation/dissolution of agency).* **STOP.**
      *   *(Catches: Implied **Machine/Threshold Move** - misapplied to dissolve agency)*

  3.  **Student Note (Stochastic Accumulator = Better for Defense):**
      *   Q1: Pass? (General decision-making mechanism).
      *   Q2: **Fail.** Describes *how* decisions *might* work (stochastic process), not that this *causes* actions outside control or negates agency *as defined by law*. *Verdict: **Misleading** (trades on confusion between mechanism description and causation/exculpation).* **STOP.**
      *   Q3 Check: The argument *explicitly fails* here. It assumes "no decision in the story" = "no responsibility," which *is* trying to redefine the legal element ("voluntary act," "intentional") using a philosophical interpretation of the science. This is the **Philosophical Seam**. The science (accumulator model) isn't load-bearing; the *philosophical interpretation* of it is.
      *   *(Catches: **Machine Move** - misinterpreted as dissolving agency/responsibility)*
      *   **Why it Fails & Why You Should Stop Assigning It:** The note confuses a *scientific model of how decisions emerge* (stochastic accumulation) with *negation of agency/responsibility*. The law doesn't require decisions to be non-mechanistic, uncaused, or initiated by a non-physical "I." It requires intentionality and voluntariness within a folk-psychological framework compatible with underlying mechanisms (see Morse, "Brain Overclaim Syndrome"). The accumulator model describes a mechanism *for* making intentional choices; it doesn't erase them. Claiming it helps the defense misunderstands both the science and the law.

  ---

  **My Confidence & Reconstruction Notes:**

  1.  **Q1 (Relevance):** High Confidence (Empirical). Libet/accumulator tasks are low-level motor/cognitive tasks. Generalizing to complex real-world criminal intent is empirically unsupported.
  2.  **Q2 (Causality):** High Confidence (Empirical/Conceptual). Neuroscience rarely establishes *sufficient* causation for specific complex behaviors, especially outside clear pathologies like certain tumors or epilepsy. Describing a mechanism ≠ showing it *caused* the action *in this case* in a way negating control.
  3.  **Q3 (Legal Element):** High Confidence (Conceptual/Legal). The law's definitions of mental states are functional, not metaphysical. Neuroscience doesn't redefine "intent" or "knowledge"; it might provide *evidence* about whether *that legal standard* was met in a specific case. This is the most critical seam.
  4.  **Q4 (Impairment Specificity):** Moderate Confidence (Empirical). While neuroimaging *can* show impairment, mapping specific biomarkers to *precise legal capacities* (e.g., "capacity to form intent") is highly complex and often overclaimed. Judgment call on strength of link. *(Reconstruction Note: Relying on critiques of neuroimaging in legal contexts by Morse, Greely, Garland, etc.)*
  5.  **Q5 (Veto):** High Confidence (Conceptual). The veto finding is an empirical observation. Claiming it constitutes the *only* basis for responsibility is a philosophical argument, not a scientific one.

  **Single Least Sure Step:** **Q4 (Impairment Specificity).** Distinguishing genuinely probative, specific evidence of incapacity (e.g., from a verified acute brain injury impacting inhibitory control) from overblown claims based on group averages or vague associations requires careful case-by-case judgment. The science *can* be relevant here, but the bar is high and overclaiming is common.

  **Procedure as Judgment Aid:** This checklist forces students to ask the right questions in sequence, exposing the most common overreaches early (Q1, Q2) and highlighting the crucial philosophy/law seam (Q3). It doesn't replace your judgment but structures the inquiry and flags where your expertise is needed (especially at Q3-Q5 failures). It teaches them *why* most neuro-free-will arguments in briefs are either irrelevant, overreaching, or philosophical Trojan horses.
