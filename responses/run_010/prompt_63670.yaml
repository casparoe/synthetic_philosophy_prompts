  Different questions? Carnap focuses on constructed languages and frameworks; Quine on natural language and scientific epistemology. But their arguments intersect, especially on revisability. So while their domains differ, the core conflict over explanatory direction remains.

  Hidden empirical issue? Maybe how language acquisition works. If children learn synonyms via rules, that supports Carnap. If it's all distributional, Quine wins. But both sides might dismiss each other's evidence, causing deadlock. However, the user's seminar showed agreement on facts but not explanation, suggesting it's not just empirical.

  Ill-posed question? Holism implies sentences aren't individually analytic. But Carnapians can accommodate this within frameworks. The debate persists because both have responses, so the question isn't ill-posed.

  The strongest alternative is the hidden empirical one. If cognitive science showed synonymy acquisition is rule-based, Carnap benefits. If not, Quine. But the user's data shows factual agreement, so maybe it's not the main driver.

  The user's explanatory priority hypothesis fits best. Quine’s circularity argument makes meaning dependent on use, while Carnap sees meaning as foundational. The seminar's cases like "whales are fish" highlight this: is meaning prior to usage, or is meaning just usage? 

  Can explanatory disputes be resolved? Sometimes, through better theories or new evidence. But here, it's meta-philosophical. Carnap's framework-dependent analyticity avoids Quine’s holism, but Quine rejects frameworks. Stalemate.

  Progress? Not through formal results. Clarifying the disagreement might help, but won't resolve it. Cognitive science on language acquisition could shift the debate, but it's indirect. The user should present the debate as a paradigm clash, showing how explanatory priorities shape positions.

  What would change my mind? If the seminar disagreements were about facts (e.g., revisability degree) rather than explanation, the empirical angle gains weight. Or if new evidence on language acquisition emerged.

