answer: |-
  Your seminar exercise is revelatory: it exposes the fossil's living core. The debate isn't about *whether* certain sentences are unrevisable under normal conditions (both sides agree on the cases), nor is it merely verbal or about distinct questions. Your hypothesis is fundamentally correct—**the irreducible conflict is about *explanatory primacy* between meaning and epistemic centrality**, and this *is* a meta-philosophical stalemate. Here’s the diagnosis, stripped of hedging:

  ### The Core Dispute: Direction of Explanation as Metaphilosophical Choice
  - **Carnapians** anchor explanation in **semantic foundations**: Meaning rules (*stipulated* in formal frameworks, *discovered* in natural language) *explain why* certain beliefs are entrenched. "All vixens are foxes" is unrevisable *because* "vixen" means *female fox*—the meaning fixes truth conditions independently of empirical evidence.  
  - **Quineans** anchor explanation in **epistemic holism**: Entrenchment *explains why* we call something "meaning-constitutive." The refusal to revise "whales are fish" in 1700 wasn’t due to meanings, but to the *centrality* of biological categories in their web of belief. Calling it "analytic" just *labels* that entrenchment post hoc.  

  **Why this is unresolvable**:  
  1. **No neutral ground**: To justify either direction, you must already assume a stance on what counts as an explanation. Carnap demands semantic atomism/rules; Quine demands behaviorist-naturalist epistemology. These are foundational commitments.  
  2. **Self-sealing arguments**:  
     - *Quine’s circularity charge* presumes holism/empiricism.  
     - *Carnap’s framework defense* presumes the autonomy of semantics.  
     Rebuttals from either side appear question-begging to the other.  
  3. **Your seminar evidence**: Agreement on classifications but divergence on "why" confirms that facts about use/revisability are *not* in dispute. The fight is over which fact is metaphysically/epistemically prior.  

  ### Why the Alternatives Fail
  - **Verbal dispute?** No—both sides *understand* each other’s usage but reject its legitimacy. Quine doesn’t deny Carnap’s "analytic-in-L"; he denies it has any *explanatory power* outside artificial contexts.  
  - **Different questions?** Partly, but they overlap destructively. Carnap’s "framework internal" answer *requires* semantic priority Quine rejects; Quine’s naturalized epistemology *denies* semantic facts Carnap needs.  
  - **Hidden empirical issue?** Close, but insufficient. Yes, language acquisition (e.g., can "bachelor/unmarried" be learned distributionally?) *bears* on the dispute. But your seminar shows participants *agree on the facts* (e.g., "whales are fish was unrevisable in 1700") yet disagree on explanation. Empirical data won’t resolve the priority conflict.  
  - **Ill-posed question?** Not quite—holism doesn’t make "analytic" incoherent; it relocates it (to centrality gradients). The dispute survives because Carnapians can still insist centrality *stems* from meaning.  

  ### What Would Break the Tie? Nothing. But Progress Is Possible
  **Forget formal proofs or thought experiments**. No Gödelian result can fix this. Quine’s indeterminacy of translation and Carnap’s tolerance principle are too resilient. Instead:  

  1. **Progress through meta-acknowledgment**: Teach the debate as a **clash of explanatory paradigms**. Ask:  
     - *What must language/reality be like for meaning to explain entrenchment?* (Requires robust Platonism/conventionalism.)  
     - *What must science/learning be like for entrenchment to explain "meaning"?* (Requires pragmatism/naturalism.)  
     This shifts focus to *why* each side adopts its primacy stance.  

  2. **Cognitive science as a pressure point**: While not decisive, evidence that synonymy acquisition *requires* rule-inference (e.g., children inferring "vixen" = "female fox" *before* full web-integration) would *embarrass* Quineans. Evidence that all "semantic rules" reduce to predictive Bayesian networks (no intrinsic synonymy) would *embarrass* Carnapians. But neither kills the paradigm—just raises its costs.  

  3. **Reformulate the question**: Instead of "Is sentence S analytic?", ask:  
     - *Under what conditions would revising S feel like changing the subject?*  
     - *Does this feeling reflect a semantic fact or an epistemic bottleneck?*  
     This preserves the data but sidesteps loaded terminology.  

  ### Can Direction-of-Explanation Disputes Be Settled?  
  **Rarely, and never conclusively**. They resolve only when one paradigm exhausts its utility (e.g., phlogiston theory). Here, both remain viable: Carnap’s for formal semantics/logic; Quine’s for cognitive science/history of science. The tie won’t break—but showing *why* it won’t is intellectual progress.  

  ### What Would Change My Mind
  - **If your seminar disagreements were about *revisability facts*** (e.g., Quineans denying "7+5=12" is unrevisable in practice). That would suggest an empirical/core disagreement. But you report consensus on cases—only the "why" splits.  
  - **If Carnapians could show meaning postulates *must* ground entrenchment** without presupposing semantic primacy (they can’t).  
  - **If Quineans could explain entrenchment *without* residual semantics** (e.g., a purely neurological account of "feeling analytic").  

  ### Where Your Data Might Mislead
  If your cohort overrepresented formal philosophers or naturalists, the agreement on cases might reflect disciplinary bias. Pre-Linnaeus "whales are fish" *should* be contested: Carnapians might call it synthetic but central; Quineans might say its "meaning" shifted retroactively. But your observation—that they agreed on classification but not explanation—holds even if so.  

  ### What to Tell Your Students
  > "This debate isn’t about facts, but about what *explains* those facts. Carnap thinks meaning rules anchor knowledge; Quine thinks knowledge constructs 'meaning.' Neither can prove their starting point. The impasse shows philosophy’s limits: some choices are foundational. Your job is to see which foundation fits your intellectual projects—formal semantics or naturalized epistemology—and own the costs."

  The fossil is dead. Its sediment reveals philosophy’s tectonic plates.
