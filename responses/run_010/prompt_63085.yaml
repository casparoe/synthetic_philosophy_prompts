answer: |-
  Here is a disambiguation of "charity begins at home," breaking it down into distinct, precise claims relevant to your debate on global justice. Each interpretation is assessed for its plausibility, contestability, and ability to support the conclusion that domestic obligations must/may be prioritized over greater need abroad.

  **1. Lexical Priority of Domestic Need (Strong Prioritization)**
      *   **Claim:** Obligations to compatriots in need *must* be *fully discharged* before *any* resources are directed to non-compatriots, regardless of the severity or scale of need abroad.
      *   **Commitment:** Domestic needs create absolute, non-overridable claims that lexically trump foreign needs. Justice is inherently bounded by citizenship.
      *   **Platitude, Substantive, or False?** Highly substantive and strongly contested. Directly contradicts impartial needs-based accounts and cosmopolitanism. Difficult to defend without assuming a deeply communitarian or nationalist theory of justice where shared citizenship creates unique, paramount moral bonds.
      *   **Supports Classmate's Conclusion?** Directly delivers the "must prioritize domestically first" conclusion. Strongest version of their claim.
      *   **Slippery Slope Risk:** Easily conflated with weaker claims (like #2 or #4) to appear more plausible.

  **2. Weighted Priority for Compatriots (Moderate Partiality)**
      *   **Claim:** The needs of compatriots generate *stronger* obligations or deserve *greater weight* than the identical needs of non-compatriots. Partiality towards compatriots is a legitimate principle of justice.
      *   **Commitment:** Citizenship creates special relationships that intensify obligations. Impartiality is modified by associative duties. "Equally pressing needs" aren't morally equal if one claimant is a compatriot.
      *   **Platitude, Substantive, or False?** Substantive and contested. Requires justification for why shared citizenship *in itself* generates stronger claims of justice (beyond practical considerations like #5 or #6). Cosmopolitans reject this; communitarians/liberal nationalists endorse it.
      *   **Supports Classmate's Conclusion?** Supports *prioritizing* domestic needs (especially if domestic need is significant), but doesn't *necessarily* mandate *complete fulfilment first* before *any* action abroad. It allows for comparative weighing where extreme foreign need might sometimes outweigh moderate domestic need. Weaker than classmate's apparent claim.
      *   **Slippery Slope Risk:** Often conflated with #1 (Lexical Priority) or justified by appeal to #5 (Effectiveness) or #6 (Division of Labour), which are different claims.

  **3. Relational Duties Thesis (Source of Obligation)**
      *   **Claim:** The *source* of stringent distributive obligations *is* the specific relationship constituted by shared citizenship within a state. We owe justice *to* compatriots *because* of the cooperative scheme, shared institutions, or collective self-determination we participate in together. No comparable relationship exists with distant strangers to ground *equivalent* duties of justice.
      *   **Commitment:** Justice obligations are relational, not global. Duties to non-compatriots, if they exist, are weaker duties of "humanity" or "beneficence," not justice. Citizenship is the primary ground for distributive claims.
      *   **Platitude, Substantive, or False?** Highly substantive core claim of political liberalism (e.g., Rawlsian) and statism/relational egalitarianism. Directly contested by cosmopolitans who argue for global institutions generating duties or fundamental human interests grounding pre-relational claims.
      *   **Supports Classmate's Conclusion?** Directly supports the *fundamental distinction* in the *type* and *stringency* of obligation (justice vs. charity/beneficence). It implies domestic needs engage obligations of justice, while foreign needs engage (weaker) duties of beneficence. This justifies prioritizing domestic obligations *as a matter of justice* before acting on beneficence abroad. **Crucially, this is where the "charity" vocabulary does heavy lifting** (see Vocabulary Note below).
      *   **Slippery Slope Risk:** The slide between "different type of duty" and "lexical priority" (#1) or "significantly greater weight" (#2).

  **4. Permissible Partiality, Not Required Priority (Agent-Centric Prerogative)**
      *   **Claim:** While impartial morality might demand helping the worst-off globally, agents (individuals or states) are *permitted* to give *some* priority to their own projects and relationships, including prioritizing the needs of compatriots. It's not unjust to do so; it's a legitimate exercise of partiality.
      *   **Commitment:** Morality allows space for personal/collective attachments. Meeting domestic needs first is *permissible*, even if not strictly required by an impartial calculus of need. It's about the *agent's* right to partiality, not the *recipient's* stronger claim.
      *   **Platitude, Substantive, or False?** Substantive but widely accepted in some form (e.g., Samuel Scheffler's "reasons of relationship"). Even cosmopolitans often accept *some* agent-centered prerogatives. The *degree* of permissible partiality is contested.
      *   **Supports Classmate's Conclusion?** Supports that a state *may* prioritize domestically without being *unjust*. It does **not** support that it *must* do so, nor that foreign aid is *impermissible* while domestic need exists. Significantly weaker than the classmate's conclusion. It justifies "may," not "must" or "should always."
      *   **Slippery Slope Risk:** **Major Risk:** The slide from "permissible" (#4) to "required" (#1 or #2) or "different type of duty" (#3). The slogan's imperative tone ("begins") encourages this slide.

  **5. Effectiveness Argument (Instrumental Justification)**
      *   **Claim:** Aid directed domestically is reliably *more effective* at meeting needs than aid directed abroad, due to better knowledge (#5a), institutional capacity (#5b), or reduced risk of harm/corruption (#5c). Therefore, prioritizing domestic need maximizes overall need satisfaction.
      *   **Commitments:**
          *   **5a. Epistemic Advantage:** "We know what our own people need..." (as your classmate mentioned). Claims superior local knowledge reduces misallocation.
          *   **5b. Institutional Capacity:** Domestic institutions are better positioned to deliver effective aid than foreign states or international bodies.
          *   **5c. Reduced Harm/Avoidance of Bads:** Foreign aid risks negative consequences (dependency, undermining local institutions, fueling corruption) more than domestic aid.
      *   **Platitude, Substantive, or False?** **Empirical and Contingent.** While plausible in many cases, these are generalizations open to counter-evidence (e.g., effective INGOs, corrupt domestic governments, disasters requiring rapid international response). Not a fundamental moral principle.
      *   **Supports Classmate's Conclusion?** Provides a strong *pragmatic* reason for *often* prioritizing domestic aid to maximize impact. However, it **does not** establish a *moral priority principle* like #1, #2, or #3. If effectiveness conditions change (e.g., a highly effective global mechanism, a failing domestic state), the reason to prioritize domestically weakens or reverses. Doesn't support the *inherent* moral difference assumed in the debate.
      *   **Slippery Slope Risk:** Using plausible empirical generalizations (#5) to implicitly justify non-instrumental moral claims (#1, #2, #3). The slogan obscures this shift from "works better" to "owes more."

  **6. Division of Moral Labour (Institutional Competence & Responsibility)**
      *   **Claim:** The primary responsibility for meeting the needs of a population lies with *their own state*. Other states' primary responsibility is to their *own* citizens. Global need is best addressed through states fulfilling their domestic duties and cooperating internationally, not through one state diverting resources meant for its citizens to directly aid foreign citizens. States should "mind their own shop" first.
      *   **Commitment:** Distributive justice is primarily the task of sovereign states within their domain. The global order should facilitate this, not create direct cross-border distributive obligations that bypass domestic institutions. "Home" is the locus of primary responsibility.
      *   **Platitude, Substantive, or False?** Substantive, reflecting a statist/internationalist view of global order. Contested by cosmopolitans arguing for global institutions or direct duties to alleviate global poverty where states fail.
      *   **Supports Classmate's Conclusion?** Supports prioritizing *building and maintaining effective domestic institutions* as the primary task. It implies that using state resources for direct foreign aid *bypasses* the proper agent (the foreign state) and *neglects* the state's core duty to its own citizens. Strongly supports the "must prioritize domestic institutions/duties first" conclusion, framing foreign aid as potentially shirking core responsibilities or undermining foreign sovereignty. Closer to #3 but focused on institutional roles.
      *   **Slippery Slope Risk:** Conflating this institutional view with stronger claims about the intrinsic moral weight of compatriots (#2) or the source of obligations (#3).

  **7. Non-Ideal Theory / Assurance Argument (Pragmatic Feasibility)**
      *   **Claim:** In a non-ideal world lacking effective global institutions or reciprocal compliance, states *cannot* reliably meet foreign needs without jeopardizing domestic stability or the social contract. Focusing resources at home first is necessary to maintain the domestic cooperation and legitimacy required for *any* sustained beneficence (domestic or foreign).
      *   **Commitment:** Moral demands must be feasible. Demanding significant sacrifice for foreigners without reciprocal assurance or effective global systems risks domestic backlash, undermining the capacity for future action. Stability at home is a prerequisite.
      *   **Platitude, Substantive, or False?** Substantive pragmatic claim. Acknowledges real-world constraints but is contingent on circumstances (e.g., level of domestic need, public support, existence of global mechanisms).
      *   **Supports Classmate's Conclusion?** Provides a contextual, stability-based reason for prioritizing domestic obligations *in many real-world situations*. It does **not** support an *inherent* moral priority of compatriots, only a practical necessity under current non-ideal conditions. Justifies prioritization based on consequences, not inherent claims.
      *   **Slippery Slope Risk:** Using contingent feasibility arguments to justify principles (#1, #2, #3) that are claimed to hold even under ideal conditions.

  **The Crucial Vocabulary Note: "Charity" vs. "Justice"**

  *   **The Substitution Matters Profoundly:** Your classmate used "charity," but the debate concerns *justice*. This is likely central to the slogan's perceived force and your unease.
  *   **How it Works:** Framing obligations to the global poor as "charity" inherently demotes them. Charity is:
      *   **Discretionary:** Something good to do, but not obligatory. Justice is owed; charity is given.
      *   **Supererogatory:** Going beyond the call of duty.
      *   **Less Stringent:** Failing to be charitable might be regrettable, but failing to meet obligations of justice is wrongful.
      *   **Non-Relational:** Charity stems from the goodness of the giver, not the claim of the recipient. Justice stems from the recipient's entitlement.
  *   **Impact on the Slogan:** "Charity begins at home" implies that aiding foreigners is merely charitable. Therefore, it's permissible, even obligatory, to prioritize domestic *justice* obligations over foreign *charity*. This leverages Claim #3 (Relational Duties Thesis) implicitly.
  *   **Why it's Problematic:** Cosmopolitans argue that duties to the global poor are *duties of justice*, based on fundamental human interests, global interdependence, or the harms caused by global institutions. Framing it as "charity" begs the question against the cosmopolitan position by assuming the statist/relational view of justice obligations (#3). It preemptively defines the nature of the duty downwards.
  *   **For Your Paper:** Highlighting this substitution is vital. Ask: "Is the obligation to the global poor one of charity (beneficence) or justice? The slogan assumes the former; my argument assumes the latter." Exposing this move undermines the slogan's force in a justice debate.

  **Conclusion for Your Paper:**

  The slogan "charity begins at home" is persuasive because it ambiguously blends several distinct claims (especially #1, #2, #3, #4, and #6), often sliding between permissibility and requirement (#4 vs. #1/#2) and exploiting the charity/justice conflation. Its apparent self-evidence dissolves upon disambiguation:

  1.  **Strong Moral Claims (#1, #2, #3):** Are highly substantive, contested, and require robust philosophical defense (e.g., communitarianism, statism, relational egalitarianism) against impartialist or cosmopolitan views. They *can* support prioritization, but their foundational premises are debatable.
  2.  **Permissibility Claim (#4):** Is weaker and doesn't mandate prioritization, only allows it.
  3.  **Instrumental/Pragmatic Claims (#5, #7):** Provide contingent reasons for prioritization in many contexts but don't establish an inherent moral difference or principle of justice. They are vulnerable to counter-evidence.
  4.  **Institutional Claim (#6):** Provides a strong reason for focusing on domestic institutions but doesn't inherently negate duties to support global institutions or act where they fail catastrophically.

  **Crucially, none of these interpretations *obviously* or *uncontroversially* delivers your classmate's strong conclusion (that a state *must/may always* prioritize domestic needs first) within the framework of a debate about *justice*.** The slogan gains its rhetorical power by masking these distinctions and leveraging the charity/justice equivocation. Your task is to expose this ambiguity and force the argument onto the clearer ground of defining the nature and grounds of distributive obligations in a global context.
