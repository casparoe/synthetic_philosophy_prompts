  **OUROBOROS RE  
  LONGEVITY REINSURANCE UNDERWRITING MANUAL**  
  **SECTION 7.21: DOOMSDAY ARGUMENT FRAMEWORK (DAF) FOR SPECIES-LEVEL MORTALITY ASSESSMENT**  
  **EFFECTIVE DATE: 01 JANUARY 2024**  

  **1. PURPOSE**  
  This section establishes the Doomsday Argument Framework (DAF) as the primary methodology for quantifying species extinction risk in Ouroboros Re’s longevity reinsurance portfolio. The DAF provides an objective, prior-based estimate of the total future human population, enabling actuarially sound pricing of aggregate catastrophe reserves.  

  **2. MODEL INPUTS AND ASSUMPTIONS**  
  2.1. **Birth Rank (N)**: The cumulative number of *Homo sapiens* births to date is fixed at 100,000,000,000 (100 billion), as calibrated by the Demographics Oversight Unit.  
  2.2. **Total Future Births (T)**: The unknown total number of humans who will ever exist. T is modeled as a random variable with a scale-invariant prior distribution: \( P(T) \propto 1/T \).  
  2.3. **Anthropic Likelihood**: Given uniform subjective probability, the likelihood of observing birth rank \( N \) is \( P(N|T) = 1/T \) for \( T \geq N \).  
  2.4. **Posterior Bounds**:  
  - Median estimate: \( T_{\text{med}} = 2N \) (200 billion)  
  - 95% upper bound: \( T_{95} = 20N \) (2 trillion)  
  2.5. **Virtues of Parsimony**: The DAF requires no external data (e.g., climate projections, bioweapon proliferation, or individual health records). This eliminates model overfitting and ensures consistency across geopolitical regimes.  

  **3. REFERENCE CLASS SELECTION**  
  The choice of reference class materially impacts DAF outputs. Underwriters must select from the following approved classes (Table 7.21-A), noting that all classes satisfy the principle of "indifference over ranks."  

  **TABLE 7.21-A: APPROVED REFERENCE CLASSES**  
  | Class                  | Current N       | Median T | T₉₅       |  
  |------------------------|-----------------|----------|-----------|  
  | *Homo sapiens*         | 100,000,000,000 | 200 Bn   | 2.0 Tr    |  
  | Terrestrial mammals†   | 1.2 × 10¹⁵      | 2.4 × 10¹⁵ | 2.4 × 10¹⁶ |  
  | Cosmic observers‡      | 1.0 × 10²⁴      | 2.0 × 10²⁴ | 2.0 × 10²⁵ |  
  | 20th-century humans    | 10,000,000,000  | 20 Bn    | 200 Bn    |  

  *† Includes all non-marine Mammalia species since the Jurassic.  
  ‡ Includes all conscious entities in the observable universe; requires SVP approval.*  

  **4. ILLUSTRATIVE CASE: APPLICANT BORN AT RANK 75,000,000,000**  
  4.1. **Class: *Homo sapiens***  
  - Remaining births: \( T_{\text{med}} - N = 100 \text{ Bn} \)  
  - Extinction probability within 100 years: 18.3% (derived from posterior survival function).  
  4.2. **Class: Terrestrial mammals**  
  - Remaining births: \( 2.4 \times 10^{15} - 1.2 \times 10^{15} = 1.2 \times 10^{15} \)  
  - Extinction probability within 100 years: 0.0004%.  
  4.3. **Class: 20th-century humans**  
  - *Note: Class closed in 2001; T is binding.*  
  - Extinction probability at class termination: 100% (by definition).  

  **5. PRODUCTION TRACK RECORD**  
  The DAF was implemented on 01 January 2023. Key performance metrics:  
  - **Predicted Extinction Events**: Zero (consistent with 95% CI upper bound of 2 trillion births).  
  - **Reserve Adequacy**: Catastrophe reserves set at DAF median levels have remained untapped, validating the absence of model drift.  
  - **Calibration**: 100% of observed human births since adoption fall below \( T_{95} \), aligning with expectations.  

  **6. LIMITATIONS AND SPECIAL CASES**  
  6.1. **Prior Dependence**: Outputs are invariant to post-1750 mortality improvements, but sensitive to the scale-invariant prior. Substituting a uniform prior on \( T \) would increase \( T_{\text{med}} \) to \( 10^{15} \).  
  6.2. **Self-Indication Objection**: A minority view within the Existential Risk Desk argues the prior should be \( P(T) \propto T \) (i.e., weighting by "observer-moments"). This implies \( E[T] = \infty \), necessitating $0 reserves. This position is rejected for reinsurance purposes, as it negates the concept of aggregate risk.  
  6.3. **Small Reference Classes**: For nascent classes (e.g., Martian colonists), the DAF produces volatile outputs:  
  - For \( N = 1 \): \( T_{\text{med}} = 2 \), \( T_{95} = 20 \)  
  - For \( N = 2 \): \( T_{\text{med}} = 4 \), \( T_{95} = 40 \)  
  Legal Counsel has prohibited underwriting classes with \( N < 100 \) due to moral hazard concerns (e.g., an insured extinguishing the class to collapse liabilities).  
  6.4. **Backtesting Constraints**: Species extinction is a singular, unrepeatable event. The DAF’s validation rests entirely on its mathematical coherence.  

  **7. DISSENTING MEMORANDUM: CHIEF RISK OFFICER**  
  **TO:** Underwriting Committee  
  **FROM:** Dr. Aris Thorne, Chief Risk Officer  
  **DATE:** 15 December 2023  
  **SUBJECT:** Objections to DAF Implementation  

  While intellectually elegant, the DAF suffers from fatal operational flaws:  
  1. **Reference Class Arbitrariness**: An applicant’s risk profile varies by 5 orders of magnitude based on class selection (Sec. 4), rendering pricing incoherent.  
  2. **Non-Actionability**: The model ignores known drivers of extinction (e.g., nuclear winters, synthetic pathogens). We cannot hedge a prior.  
  3. **Infinity Problem**: The self-indication rebuttal (Sec. 6.2), while extreme, highlights that the DAF’s outputs are artifacts of unmotivated probability axioms.  
  Recommendation: Restrict DAF to philosophical reserves only. Extinction risk should be modeled via conventional causal pathways.  

  **8. COMPLIANCE DIRECTIVES**  
  8.1. The DAF **shall not** be used to decline, rate, or modify terms for any individual applicant. The model quantifies species-level risk only and implies nothing about individual lifespans.  
  8.2. All policies referencing DAF outputs must include the disclaimer: "This pricing reflects aggregate anthropic priors and is not predictive of any insured’s mortality."  

  **CERTIFICATION**  
  Approved for underwriting use by unanimous vote of the Existential Risk Oversight Board.  

  [Signed]  
  **Dr. M. Samsara**  
  Chief Existential Risk Officer  
  Ouroboros Re
