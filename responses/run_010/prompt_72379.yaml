  Let's outline:

  **OUROBOROS RE**
  **Longevity Reinsurance Underwriting Manual**
  **Section: Doomsday Argument Framework (DAF)**

  **1. Purpose and Scope**
  This section establishes the Doomsday Argument Framework (DAF) for the assessment of aggregate human mortality risk. The DAF provides an objective, prior-based method for estimating the remaining lifespan of the human species, which is integral to our pricing of longevity reinsurance contracts. The framework is applied at the portfolio level and is not intended for individual risk assessment.

  **2. Model Specification**
  2.1. The DAF is built upon the following inputs:
     - N: The cumulative number of human births to date. As of the last census adjustment (performed by our Demographics Desk), N = 100,000,000,000 (100 billion).
     - Prior distribution: We adopt a scale-invariant prior (also known as the Jeffreys prior for this problem) for the total number of humans, denoted by T, that will ever be born. This prior is proportional to 1/T.

  2.2. Under this model, the posterior distribution for T is such that:
     - The median estimate for T is 2N (200 billion).
     - The 95th percentile upper bound for T is 20N (2 trillion).

  2.3. The key virtue of the DAF is its parsimony: it requires no inputs related to climate, geopolitical, technological, or public health factors, nor any individual underwriting data. This ensures consistency and avoids model overfitting.

  **3. Approved Reference Classes**
  The DAF can be applied to different reference classes. The choice of reference class must be documented for each application. The following table lists the approved reference classes and their parameters as of the last adjustment.

  | Reference Class         | Current Cumulative Births (N) | Median T (2N) | 95% Upper Bound T (20N) |
  |-------------------------|-------------------------------|---------------|-------------------------|
  | Homo sapiens            | 100,000,000,000               | 200,000,000,000 | 2,000,000,000,000       |
  | Terrestrial mammals     | 1,000,000,000,000,000         | 2,000,000,000,000,000 | 20,000,000,000,000,000  |
  | Cosmic observers (est.) | 10,000,000,000,000,000,000    | 20,000,000,000,000,000,000 | 200,000,000,000,000,000,000 |
  | 20th-century humans     | 10,000,000,000                | 20,000,000,000 | 200,000,000,000         |

  *Note: The "Cosmic observers" class is highly speculative and requires Chief Underwriter approval.*

  **4. Example Calculation**
  Consider an applicant, John Doe, born in 1990. We assign him a birth rank of 75,000,000,000 (approximately). The DAF estimate for the remaining number of humans to be born depends on the reference class:

  4.1. Reference Class: Homo sapiens
     - Remaining births = T - N, where T is the total humans to be born.
     - Median remaining births = 200B - 100B = 100B.
     - 95% upper bound remaining births = 2T - 100B = 1.9T (approximately 1.9 trillion).

  4.2. Reference Class: 20th-century humans
     - N (for the class) = 10B
     - Median T = 20B, so remaining births for the class = 10B.
     - However, note that the class is defined by birth in the 20th century, so the remaining births would be those in the same class (which by definition ended in 2000). This leads to an inconsistency. Therefore, this class is not recommended for forward-looking estimates beyond the class period.

  4.3. The example illustrates the critical importance of reference class selection. The same individual, when viewed as part of the "Terrestrial mammals" class, would have a remaining births estimate so large as to make the risk of near-term human extinction negligible.

  **5. Production Track Record**
  The DAF was adopted on January 1, 2023. Since then, the model has been in continuous use. The model's predictions are consistent with the observed continuation of human existence. Specifically:

  - The model assigns a 5% probability to the event that the total number of humans will exceed 2 trillion. Since adoption, no such event has occurred (as expected, given the low probability and the fact that the current count remains at 100 billion).
  - The median estimate of 200 billion total humans implies that we are halfway through the total human population. This remains consistent with the observed birth rates.

  **6. Limitations and Caveats**
  6.1. The DAF is highly sensitive to the choice of prior. The scale-invariant prior is standard but not universally accepted. Alternative priors, such as a uniform prior on T, would yield different results.

  6.2. Self-Indication Rebuttal: A school of thought within the Existential Risk Desk (known as the "Self-Indication" view) argues that the prior should account for the fact that we exist. This leads to a prior proportional to T (instead of 1/T), which results in an improper prior that cannot be normalized and implies an infinite expected T. Under this view, the reserves required for human extinction risk would be zero. However, the majority view (and the one adopted here) rejects this on the grounds that it leads to unacceptable implications for risk management.

  6.3. New Reference Classes: For a reference class with only one or two members (e.g., the first two colonists on Mars), the DAF would produce highly unstable results. For a class with two members (N=2), the median T would be 4 and the 95% upper bound 40. This implies a high probability that the class will end soon. However, our Legal Counsel has advised that writing coverage for such classes at this stage would expose the firm to unacceptable moral hazard, as the insureds could potentially cause the extinction of the entire class. Therefore, we do not underwrite such classes until they reach a minimum of 100 members.

  6.4. Backtesting: The DAF is inherently difficult to backtest because we have only one human species and the target event (the extinction of the species) has not occurred. Therefore, the model's validation relies on its theoretical coherence rather than empirical testing.

  **7. Dissenting Memorandum: Chief Risk Officer**
  **MEMORANDUM**
  TO: Underwriting Department
  FROM: Dr. Helena Vorlan, Chief Risk Officer
  DATE: [Current Date]
  SUBJECT: Objections to the Doomsday Argument Framework

  While I acknowledge the intellectual appeal of the DAF, I must dissent from its adoption for the following reasons:

  1. The model's output is entirely determined by the choice of prior. The scale-invariant prior is arbitrary and leads to a median estimate of 2N. If we had chosen a uniform prior on T, we would have gotten a different result. Moreover, the self-indication prior (which I find equally defensible) leads to an infinite T and hence zero reserves, which is financially irresponsible.

  2. The choice of reference class is arbitrary. The example in Section 4 shows that the same applicant can be assigned a remaining births estimate ranging from 10 billion to 19.9 trillion. This makes the model useless for consistent portfolio management.

  3. The model ignores all specific risk factors. We are a reinsurance company, not a philosophy seminar. We should be pricing risk based on actual drivers of mortality, not abstract probabilities that cannot be validated.

  I recommend that the DAF be used only as a supplementary tool until these issues are resolved.

  **8. Compliance Directive**
  Per Compliance Directive 2023-04, the DAF must not be used to decline, rate up, or impose conditions on any individual application for reinsurance. The DAF makes no claims about the mortality risk of any individual. It is solely for the assessment of aggregate portfolio risk and setting of overall reserves.

  **9. Certification**
  Approved and adopted this [Date] by the Underwriting Committee.

  [Signed]
  Elias Thorne
  Chief Underwriting Officer, Longevity Division
  Ouroboros Re
