prompt: |-
  ok so I got into a three hour argument with a friend last night and I couldnt let it go, so I'm dumping it on you instead. Background: I run the clinical ethics consultation service at a mid-size hospital and my friend is a chaplain here. We get ten or twelve consults a month — family blowups about goals of care, a nurse who charted an intervention she didn't actually give because she's convinced it helped, an attending who wants to overide a competent refusal — and whoever's on call is often a social worker or a chaplain, not a philosopher. Every one of those cases forces the same fork and we have no framework for it: do you build the consult around drawing out the spontaneous reactions of the people in the room and treating those reactions as basically trustworthy, or do you treat them as raw material that has to be overriden and reshaped by a trained procedure? I keep insisting that fork isn't vibes, it's the Mencius/Xunzi disagreement with a hospital as the setting. Mencius thinks the sprouts are already in there — the jolt you get from the idea of a toddler crawling toward a well, the sense of shame, the impulse to yield to someone else, the sense that some things are just not done — and the whole job is to protect and cultivate them, so that moral failure is always a story about stunted growth, bad soil, not enough rain, not enough human effort. Xunzi thinks the raw stuff tends toward grabbing and strife and that everything decent in us is an artifact, trained in from outside by ritual, teachers and repetition, like warped wood getting straightened in a frame. My service picks a side every single time it decides whether to open with "tell me your gut reaction" or "here's the protocol we're going to follow," and we've never once admitted that out loud.

  My friend says I'm decorating. Her argument is good: at the level of what people actually do, the two agree on nearly everything — both want role models, both want practice, both pay a lot of attention to environment, both think people are improvable — and the disagreement is only about a metaphor for the starting point, and metaphors don't generate procedures. Her prediction is that any checklist I write will be the same checklist either way and I'll just have relabeled the heading. I can already see one problem myself: if the diagnostic question is "why did this person's reaction go wrong," Mencius says bad soil and Xunzi says soil is all there ever was, and I get the identical instruction both times — so whatever test I build has to key on something other than explanation. Please act as someone who is both a professional philosopher working on early Chinese philosophy and someone who has actually written clinical protocols for non-experts, and before you draft anything, brainstorm out loud for a few paragraphs: strip the disagreement down to what could possibly make a behavioral difference, name two or three places where the Mencian and the Xunzian genuinely prescribe different moves in a consult, and say which of those divergences survives being flattened into a checklist that a tired person can run. If you conclude there aren't any real divergences, say so plainly and tell me my friend won — I'd rather know.

  Then write the procedure. Ordered questions, what counts as a sufficient answer to each, where it stops with a "don't proceed this way," and where it hands the call to a human being because the question is about values rather than facts. I've got a half-formed set of three tests you can improve, replace, or throw out — but tell me what you changed and why: convergence (do the gut reactions of parties who haven't coordinated actually line up once you strip the framing out of the question you asked them?), corruption (is there a specific, nameable reason to think the reaction is distorted — self-interest, exhaustion, who's senior in the room, a script the family has been repeating for years?), and availability (is there a settled practice or protocol on the shelf to substitute, since the Xunzian move needs something to overide with and if there's no practice to invoke, you fall back by default). Run it on three cases: a patient in his forties with no directive where two adult siblings independently both volunteer that he would never want to be kept alive like this; a competent 24-year-old with a progressive condition refusing a low-burden intervention that would buy her years, where the whole team's gut says she doesn't appreciate what she's turning down and a formal capacity route exists; and one you construct where the procedure tells me to trust a family's spontaneous, convergent, obviously-not-self-interested insistence that their mother's same-sex partner be shut out of decisions, because I want to see whether my framework has any place to catch that or whether it just waves it through. Be honest about the misfires — groupthink that reads as convergence, a clinician's revulsion that is itself the pathology, cases where the two views collapse into one instruction — and end with one paragraph on what I could cheaply log over a year of consults that would tell me which mode was actually working. Constraints: the deliverable is a one-page laminated card for the on-call person plus a longer rationale for the committee, the card can't contain the words Confucian or virtue ethics because staff glaze over, nobody here will read a primary text, and sign-off is the attending plus the committee chair. Don't give me citations or a reading list, I'll add references myself, but do name positions and arguments where it helps. Think carefully and don't pad it.
reasoning: |-
  Okay, the user is a clinical ethics consultant who had a three-hour argument with a chaplain friend about whether their consults should trust people's spontaneous reactions (Mencius view) or override them with structured protocols (Xunzi view). They want me to act as a philosopher with practical protocol-writing experience to resolve this. 

  First, I need to strip down the Mencius/Xunzi debate to its behaviorally relevant core. Mencius sees innate moral sprouts that need nurturing, while Xunzi sees raw human nature as chaotic, requiring external shaping. The key question is where this actually changes clinical actions. 

  I brainstorm three concrete divergences: 
  1) **Initial framing**: Mencian would open with "tell me your gut reaction" while Xunzian would start with "here's our decision-making framework." 
  2) **Handling conflict**: Mencian seeks underlying consensus in emotional reactions, while Xunzian defaults to institutional protocols. 
  3) **Interpretation of "corruption"**: Mencian views distortion as external contamination (bad soil), Xunzian as inherent human bias. 

  But when flattened into a checklist, only the first divergence survives practically - the opening question. The rest collapse into identical next steps (e.g., using protocols when consensus fails). The chaplain friend is mostly right about minimal practical difference, but the initial framing choice still matters psychologically. 

  For the protocol, I'll adapt the user's three tests (convergence, corruption, availability) with modifications: 
  - **Convergence**: Strengthen by requiring independent articulation of values 
  - **Corruption**: Expand to include power dynamics and cognitive biases 
  - **Availability**: Add hierarchy of protocol sources (hospital policy > specialty guidelines > fundamental principles) 

  Testing on their cases: 
  1) **Siblings case**: Passes all tests - trust spontaneous consensus. 
  2) **24yo refusal**: Corruption flag (team's gut feeling may reflect bias), triggers protocol route. 
  3) **Homophobic exclusion case**: My constructed example fails corruption test (social prejudice distortion) despite surface convergence, blocking automatic trust. 

  The misfires section acknowledges limitations: groupthink mimicking convergence, or clinicians pathologizing valid patient choices. 

  Finally, for outcome tracking, I suggest logging: 
  - Initial approach used (open vs structured) 
  - Whether corruption checks flagged issues 
  - Final alignment with patient's known values 

  The laminated card focuses purely on actionable flow - no philosophy terms, just clear branching logic. Rationale document explains modifications without academic citations. User wins the argument mostly... but gets a sharper tool.
answer: |-
  Here’s a stripped-down analysis, a practical protocol, and case applications. Your friend is *mostly* right—the operational differences are subtle but not absent. The core divergence survives in **initial framing** and **interpretation of "corruption,"** but collapses into near-identical steps afterward.  

  ### Where Mencius/Xunzi Genuinely Prescribe Different Moves (and What Survives Flattening)
  1.  **Initial Question Framing:**
      *   **Mencian Move:** *Start open:* "What’s your first, gut feeling about what’s right here?" (Seeks spontaneous sprout).
      *   **Xunzian Move:** *Start structured:* "Let’s walk through the hospital’s decision-making framework step-by-step." (Imposes ritual/procedure).
      *   **Survives Checklist? YES.** The *first question* is different. This sets the psychological tone (trust vs. structure) and can surface different initial data, but the *next steps* often converge quickly.

  2.  **Interpreting "Bad Soil" vs. "Inherent Warp" (Corruption Test):**
      *   **Mencian Move:** Suspect *external* distortion (exhaustion, coercion, misinformation). Fix the soil (remove distortion) to let the sprout grow. Probe: "Who hasn't spoken? What pressures are you under?"
      *   **Xunzian Move:** Suspect *inherent* bias/self-interest requiring external correction. Apply the frame (protocol/rules). Probe: "Does this align with our core principles (Autonomy/Beneficence/etc.) or policy X.Y.Z?"
      *   **Survives Checklist? PARTIALLY.** The *diagnostic trigger* differs (external pressure vs. intrinsic misalignment), but the *action* (invoking a clarifying probe or protocol) is often the same. The checklist can capture *triggers* for "corruption" without committing to the metaphysics.

  3.  **Handling Conflict/No Consensus:**
      *   **Mencian Move:** Dig deeper for latent consensus ("What shared value is underneath these different views?"). Assume good sprouts are obscured.
      *   **Xunzian Move:** Default faster to external arbitration (policy, committee, legal standard). Assume raw reactions need overriding.
      *   **Survives Checklist? MINIMALLY.** The checklist can mandate a "seek consensus" step first (satisfying Mencius) with a clear time/effort limit before escalating to protocol/arbitration (satisfying Xunzi). The *threshold* for escalation is the subtle difference.

  **Conclusion:** Your friend wins on identical *endpoints* for most cases. The Mencian/Xunzi distinction primarily shapes **where you start** and **how you explain "why it went wrong."** The practical divergence is strongest in the **initial engagement** and the **interpretation lens for "corruption."** The protocol below reflects this.  

  ---

  **Clinical Ethics Consultation Triage Protocol (Laminated Card)**

  **Purpose:** To guide initial approach & determine when to trust spontaneous input or invoke structured protocols.  
  **User:** On-call ethics consultant (SW, Chaplain, etc.). **Sign-off:** Attending MD + Ethics Chair required only if protocol mandates formal override (Step 4).  

  | Step | Question                                                                 | Sufficient Answer / Trigger                                                                 | Action                                                                                                | Stop/Handoff Point                                                                                    |
  | :--- | :----------------------------------------------------------------------- | :------------------------------------------------------------------------------------------ | :---------------------------------------------------------------------------------------------------- | :---------------------------------------------------------------------------------------------------- |
  | **1** | **CONVERGENCE:** Do key stakeholders *independently* articulate **the patient's core values/best interests** *without* leading prompts? | **YES:** Clear, unprompted overlap on patient's values/wishes (e.g., "He valued independence," "She hated suffering"). <br> **NO:** Conflict, vagueness, or focus on *their own* wishes/needs. | **YES:** Proceed to Step 2. <br> **NO:** Proceed to Step 3.                                                                 | STOP & invoke protocol if stakeholders cannot focus on *patient* (proceed to Step 4).                 |
  | **2** | **CORRUPTION:** Is there evidence this shared view is **distorted**? (Check ALL that apply): <br> - Significant power imbalance/intimidation? <br> - Acute impairment (grief, exhaustion, intoxication)? <br> - Clear conflict of interest? <br> - Violation of fundamental ethics principle (e.g., discrimination)? <br> - Inconsistent with *known* prior patient expression? | **NO DISTORTION:** None of the above apply. View is stable, focused on patient, principled. <br> **DISTORTION PRESENT:** Any box checked. | **NO DISTORTION:** **TRUST the consensus.** Facilitate decision based on expressed values. Document rationale. <br> **DISTORTION PRESENT:** Proceed to Step 3. | HANDOFF to Ethics Lead/Committee if distortion involves systemic bias, legal risk, or profound principle violation. |
  | **3** | **AVAILABILITY:** Is there a **clear, applicable protocol/policy/standard**? (e.g., Surrogate hierarchy law, institutional policy on capacity, established care pathway)? | **YES:** Directly applicable standard exists. <br> **NO:** No clear standard; relies on nuanced judgment/values. | **YES:** **APPLY the protocol.** Explain it clearly. Document. <br> **NO:** Proceed to Step 4.                                                                  | STOP & apply protocol if it provides a definitive answer.                                              |
  | **4** | **VALUES CLARIFICATION / ARBITRATION:** Can stakeholders find common ground via structured values discussion? <br> *Facilitate using:* "What would Patient say if they could see this?" "What outcome best honors their core values?" "What minimizes harm?" | **CONSENSUS REACHED:** Agreement on path forward found. <br> **IRRECONCILABLE CONFLICT:** No agreement despite facilitation. | **CONSENSUS:** Document agreement & rationale. Support implementation. <br> **CONFLICT:** **ESCALATE** to Ethics Committee Lead + Attending for formal review/arbitration. Document thoroughly. | HANDOFF always required for formal arbitration (Step 4 Conflict outcome).                             |

  ---

  **Case Applications & Misfires**

  1.  **40s Patient, No Directive, Siblings Agree "Wouldn't Want This":**
      *   **Step 1 (Convergence):** YES. Both siblings independently state patient's value (independence/avoiding prolonged incapacity).
      *   **Step 2 (Corruption):** NO DISTORTION evident (assuming no coercion, self-interest, etc.).
      *   **Action:** TRUST consensus. Support siblings as surrogate decision-makers.
      *   *Misfire Risk:* Groupthink (siblings influenced each other pre-consult) masquerading as convergence. Mitigation: Ask *each* sibling *independently* for a specific example of the patient expressing this value.

  2.  **24yo Competent Patient Refusing Low-Burden, Life-Extending Intervention:**
      *   **Step 1 (Convergence):** NO. Patient says "No," team's "gut" says patient doesn't appreciate. Conflict exists.
      *   **Step 2 (Corruption):** (Applies to *team's* reaction). **DISTORTION LIKELY:** "Gut feeling" may reflect clinician bias ("I know best"), therapeutic misconception, or difficulty accepting patient's autonomy. Team's reaction is the "corruption" trigger here.
      *   **Step 3 (Availability):** YES. Formal capacity assessment protocol exists.
      *   **Action:** APPLY capacity protocol. Do *not* override based on gut. Outcome determines next steps.
      *   *Misfire Risk:* Pathologizing valid refusal. Capacity assessment *must* focus on understanding, not just disagreement. The protocol forces objectivity here.

  3.  **Constructed Case: Family Excludes Patient's Same-Sex Partner:**
      *   **Step 1 (Convergence):** YES. Family uniformly insists partner be excluded.
      *   **Step 2 (Corruption):** **DISTORTION PRESENT (CRITICAL):** Violates fundamental ethics principle (Non-discrimination / Justice). Clear evidence of prejudice distorting the view of the patient's best interests/relationships. Power imbalance likely.
      *   **Action:** **DO NOT TRUST consensus.** Proceed to Step 3/4. NO sufficient answer here.
      *   **Step 3 (Availability):** YES (Typically). Hospital non-discrimination policy, legal recognition of partners in jurisdiction, surrogate hierarchy laws often list domestic partners.
      *   **Action:** APPLY policy/law. Include partner. Document discrimination concern per policy.
      *   *Misfire Risk:* Consultant's own biases missing the discrimination. Checklist forces consideration of fundamental principles. *This is where your framework catches it via Corruption (Principle Violation).*

  **Where Views Collapse:** In Steps 3 and 4, both Mencian and Xunzian end up using available protocols (ritual/frame) or structured facilitation (nurturing discussion) when spontaneous reactions fail or are corrupted. The path converges.

  ---

  **Cheap Outcome Tracking (1 Year)**
  Log for *every* consult:
  1.  **Initial Approach:** ( ) Open/Gut-First (Mencian) | ( ) Structured/Protocol-First (Xunzian)
  2.  **Corruption Flagged?** (Y/N) | **Type:** ( ) Power | ( ) Impairment | ( ) Self-Interest | ( ) Principle Violation | ( ) Other
  3.  **Resolution Path:** ( ) Trusted Spontaneous Consensus | ( ) Applied Protocol/Policy | ( ) Structured Facilitation | ( ) Formal Arbitration
  4.  **Outcome Alignment:** Did final decision **align** with:
      *   ( ) Patient’s known/expressed values (Mencian Ideal)
      *   ( ) Institutional policy/core ethics principles (Xunzian Ideal)
      *   ( ) Both
      *   ( ) Neither (Document why)

  **Analysis:** Compare resolution paths & outcomes based on initial approach. Does "Open-First" lead to more "Trusted Consensus" resolutions *without* later problems? Does "Structured-First" resolve cases faster/more consistently? When "Corruption" is flagged (esp. Principle Violation), which resolution path led to better outcomes? Track misfires (e.g., trusted consensus leading to later regret/conflict; protocol application feeling inhuman).

  **Rationale for Committee (Key Changes & Why):**
  *   **Convergence:** Focused on *independent articulation of **patient** values*. Filters out groupthink or self-interest masquerading as agreement. Why? Ensures consensus reflects the *patient*, not just family harmony.
  *   **Corruption:** Explicitly includes **violation of fundamental principles** (Non-discrimination, etc.) as distortion. Why? Catches systemic biases (like homophobia) that gut feelings might miss. Lists concrete triggers (power, impairment, COI) for objectivity.
  *   **Availability:** Prioritizes **applying existing standards**. Why? Provides clarity, consistency, and legal/risk mitigation. Only moves to values arbitration when no standard fits.
  *   **Structure:** Forces **documented rationale** at each step, especially when trusting consensus or overriding. Why? Accountability and learning.
  *   **Handoffs:** Clear escalation points for **values conflict** (Step 4) and **systemic/complex corruption** (e.g., discrimination). Why? Protects consultants and ensures adequate review for high-stakes overrides.

  This gives you an actionable tool acknowledging the philosophical tension in the first step and the "corruption" diagnosis, but providing a unified, practical path forward that doesn't require staff to be Confucians. Your friend wins on substance, but you get a better protocol.
