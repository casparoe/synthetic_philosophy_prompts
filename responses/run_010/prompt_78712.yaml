answer: |-
  ### Game Design: Principal Principle Betting Exercise

  **Objective:** Students discover the Principal Principle (PP) through a scoring-based betting game, confronting its limitations regarding admissibility and the distinction between credence constraints and profit maximization.

  **Materials:** 
  - A coin (simulated or real; biased for Round 3).  
  - "Perfectly reliable" notes (for Round 2).  
  - Scorecards (quadratic scoring).  
  - Projector/board to display outcomes and scores.

  **Timeline:**  
  - **Prep (5 min):** Explain quadratic scoring: If a student assigns probability `p` to an event:  
    - Event occurs: Score = `1 − (1 − p)^2`  
    - Event does not occur: Score = `1 − p^2`.  
    Emphasize that honest credence reporting maximizes *expected* score.  
  - **Round 1 (15 min):** Introduce "fair coin," collect submissions, toss, score.  
  - **Round 2 (20 min):** Hand out notes, collect submissions, toss (heads), score.  
  - **Round 3 (25 min):** Describe sequence, show 9 heads, collect submissions for 10th toss, reveal heads, score.  
  - **Debrief (15 min):** Discuss paradoxes, admissibility, and philosophical implications.

  ### Game Table

  | Round | What Students Are Told                                                                 | What Each Student Submits | How It's Scored                                                                                                | The Moment They're Supposed to Notice                                                                 |
  |-------|----------------------------------------------------------------------------------------|---------------------------|----------------------------------------------------------------------------------------------------------------|-------------------------------------------------------------------------------------------------------|
  | 1     | "A fair coin will be tossed once. What is your credence (0 to 1) for heads?"           | `p₁` (credence for heads) | After toss: Heads → `1 − (1 − p₁)²`; Tails → `1 − p₁²`. (Toss is fair; 50% heads.)                            | **Honesty pays:** Scoring rewards `p₁ = 0.5`. PP (set credence = chance) feels intuitive and profitable. |
  | 2     | "You receive a note: 'Heads on this toss.' It's perfectly reliable. Update your credence." | `p₂` (credence for heads) | Same scoring. Toss is **heads** (note is reliable).                                                            | **PP violation profits:** Setting `p₂ = 1` (per note) scores 1.0 vs. `p₂ = 0.5` (per PP) scores 0.75. PP isn't a betting policy—direct evidence dominates. |
  | 3     | "Same coin (fair!). First 9 tosses: all heads. What’s your credence for heads on the 10th?" | `p₃` (credence for heads) | 10th toss is **heads**. Score = `1 − (1 − p₃)²`. (Use biased coin/simulation.)                                | **Admissibility matters:** `p₃ = 0.5` (PP) scores 0.75. `p₃ = 0.9` scores 0.99. 9 heads wrecks the chance hypothesis; PP’s admissibility clause is murky. |

  ---

  ### Debrief and Discussion

  **Key Points:**  
  1. **Round 1 → PP as Constraint:**  
     - Students endorse PP: "Set credence = known chance." Scores reward honesty.  
     - *Settled:* PP is a normative constraint for rational credence (Lewis, 1980).  

  2. **Round 2 → Evidence Trumps Chance:**  
     - Notes are "inadmissible evidence": They directly reveal the outcome.  
     - PP demands `p₂ = 0.5` *only if* evidence is inadmissible. But notes *are* admissible here!  
     - *Settled:* PP doesn’t apply with direct outcome evidence. Students see PP ≠ profit-maximizing heuristic.  

  3. **Round 3 → Admissibility Crisis:**  
     - 9 heads has positive chance (`0.5⁹ ≈ 0.002`) but suggests bias. Chance hypothesis is "wrecked."  
     - PP *requires* `p₃ = 0.5` if 9 heads is "admissible" (Lewis: historical data is admissible).  
     - But students profit by doubting fairness (`p₃ > 0.5`), exposing PP’s fragility.  
     - *Contested:* Is past evidence admissible if it challenges the chance hypothesis? (See Hoefer, 2007 vs. Hall, 2004.)  

  **Philosophical Tensions:**  
  - **Settled:** PP regulates credence, not betting strategies (e.g., Round 2).  
  - **Settled:** Admissibility screens off evidence not "about the future" (Lewis). But Round 3 shows this is slippery—9 heads *is* about future bias.  
  - **Contested:** Can PP survive without circularity in defining admissibility? (Threat: “admissible = doesn’t force PP violation”.)  
  - **Contested:** Should we replace PP with the "New Principle" (e.g., Ismael’s methods)?  

  **Predictable Pitfalls:**  
  1. **Round 2 Trust Issues:** Some students distrust the note despite "perfect reliability." *Mitigation:* Stress stipulation; use a double-headed coin.  
  2. **Round 3 Rigging Backlash:** Students who set `p₃ = 0.5` feel cheated. *Reframe:* "We simulated a world where chance was false—how should PP adapt?"  
  3. **Scoring Confusion:** Quadratic scoring is unintuitive. *Mitigation:* Pre-game practice with examples (e.g., `p = 0.8` → max score 1 if event occurs, 0.36 if not).  

  **What the Game Can’t Replicate:**  
  - **Long-Run Justification:** PP maximizes accuracy over repeated trials, but the game’s one-shot design obscures this.  
  - **Chance as Expert:** PP treats chance as an "expert function." The game can’t unpack metaphysical debates (e.g., Humean vs. non-Humean chance).  

  **Follow-Up Activity:**  
  Assign Lewis (1980) §8–9 and a critique (e.g., Hall, 2004). Debate: "Does admissibility rescue PP, or is it a circular dodge?"

  ---
  **Outcome:** Students exit seeing PP as a credence constraint riddled with ambiguities—especially admissibility. They confront its failure in edge cases (Rounds 2–3) and grasp why it’s a starting point, not a dogma.
