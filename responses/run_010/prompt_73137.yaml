prompt: |-
  I am assembling a scored exercise for a graduate seminar on personal identity, and I should like your help calibrating it. The exercise concerns gradual replacement of the brain by synthetic substrate. I will stipulate a family of protocols; your task is to rate and rank them, and to expose the structure of your own commitments in doing so.

  First, some stipulated vocabulary, which I ask you to use as I define it rather than as the literature ordinarily does. I reserve survival for numerical identity of the person across a procedure, and succession for the weaker, degree-admitting relation of psychological connectedness and continuity that Parfit argued is what matters in survival. Your scores concern survival only: not succession, and not what the subject would have prudential reason to care about. I also define a protocol to be witness-preserving if and only if there is no moment at which an outside observer could point to two simultaneously existing candidates for being the subject.

  Second, the fixed background. In every protocol the subject is the same person, S, a human being of forty who is otherwise healthy and who consents to the procedure. In every protocol the procedure succeeds at its own stated aim: there are no surgical failures, no degraded memory, no loss of competence, and at the end there is exactly one awake system that behaves and reports as S would. The protocols differ only in the parameters I state, so please do not introduce further differences in order to break ties.

  The six protocols:

  1. Slow Dispersion. Roughly one ten-thousandth of the neural substrate is replaced per night, during dreamless sleep, over some thirty years, until nothing biological remains. Each synthetic module reproduces the local functional profile of what it replaces at the level of individual cells and their connections. Removed tissue is incinerated within the hour.

  2. Slow Dispersion with Retention. As in protocol 1, except that no tissue is destroyed: each removed biological component is kept viable in a perfusion bath, unconnected to anything, and all of it remains alive in storage for the rest of S's life.

  3. Hourly Cascade. The entire substrate is replaced within a single ninety-minute session, module by module, in an order chosen to preserve the topology of signal flow. S remains awake and conversing throughout, and reports no interruption. Removed tissue is incinerated as it is excised.

  4. Hourly Cascade with Parallel Duplicate. As in protocol 3, except that at the crossover point the biological residue is not destroyed. It continues to run as a separate, awake, conversing person for the remaining forty-five minutes of the session, and is then anaesthetized and destroyed. The synthetic side and the biological side do not exchange information after the crossover point.

  5. Coarse Isomorph. Replacement is instantaneous and one-shot. The resulting system is stipulated to match S exactly at the level of her dispositions to perceive, reason, remember, and act across every situation that could be tested from inside or outside, but its internal microstructure, its temporal dynamics, and its physical realization bear no resemblance to S's brain beyond what that dispositional match requires.

  6. Post-Mortem Reconstruction. S declines all of the above and dies of natural causes at eighty. Thirty years later, a synthetic system is built from a complete structural record of her connectome and molecular state, taken at autopsy and stored since, and is activated. Nothing is destroyed and nothing runs in parallel, because nothing biological remains.

  Now the task, in four parts.

  Part one: assign each protocol a survival score on a scale from 0.0 to 1.0, to one decimal place, where 1.0 means you are as confident as one can be that S herself survives the procedure and 0.0 means you are as confident as one can be that she does not. Give the six scores, then present the protocols in ranked order from highest to lowest, with one sentence of justification per protocol that identifies the feature actually doing the work.

  Part two: state your weighting of three dimensions: causal-functional continuity of the processing pattern, material continuity of the implementing stuff, and uniqueness, meaning the absence of branching or competing candidates. Give me three numbers summing to 1.0, say which dimension you treat as dominant, and defend that choice in a short paragraph. Then say honestly where your six scores fail to be consistent with the weighting you have just declared, rather than adjusting the scores after the fact.

  Part three: protocols 1 and 2 form a controlled pair differing only in whether the discarded tissue is destroyed, and protocols 3 and 4 form a controlled pair differing only in whether a rival candidate exists during the session. Report the score difference within each pair, and say what that difference is tracking on your view. If a difference is zero, explain why the parameter is inert; if it is large, explain why so much should turn on so little. Note also which protocols are witness-preserving under my definition, and whether you think that property should bear on the score at all.

  Part four: identify the one protocol on which you expect competent theorists to disagree most sharply about the score, and state what the disagreement is really about. I want the underlying fault line, not a summary of positions that already exist in the literature under labels.

  Two further constraints on your answer. Do not supply a bibliography, a reading list, or citations of any kind; the exercise must be answerable from argument alone, and I want to see the argument. And do not dissolve the question: I am aware that a respectable theorist may hold that survival is not what matters, that numerical identity is indeterminate here, or that the whole framing trades on a bad picture of the self. You may register a reservation of that sort in at most two sentences, and then you must produce the numbers as instructed. Aim for roughly nine hundred words in total.
reasoning: |-
  Hmm, the user wants me to calibrate a scored exercise about personal identity for a graduate seminar. They've defined specific terms - "survival" meaning numerical identity, and "succession" meaning psychological continuity. I need to score six brain replacement protocols from 0.0 to 1.0 on survival only, then rank them, analyze dimensions, compare pairs, and identify disagreement points.

  Looking at the protocols: Slow Dispersion (gradual replacement) seems like the strongest case for survival at 1.0 - the continuous functional preservation makes it feel like S persists. Slow Dispersion with Retention (keeping the old tissue) drops to 0.9 since the discarded neurons could theoretically be revived, creating potential rivals. 

  Hourly Cascade (awake replacement) gets 0.8 - the functional continuity is high but the compressed timeframe makes identity feel less secure. With Parallel Duplicate (creating a temporary biological twin) it plummets to 0.1 because we have two claimants to being S. 

  Coarse Isomorph (instant replacement with functional match only) gets 0.2 - without causal history, it's just a replica. Post-Mortem Reconstruction (rebuilding after death) is clearly 0.0 since S already died.

  For the dimensions analysis, I weigh causal-functional continuity highest (0.7) because identity seems tied to the persistence of mental processes rather than material or uniqueness concerns. Material continuity gets 0.2 - the substrate matters only if it supports function. Uniqueness gets 0.1 - it doesn't create identity but resolves ambiguities.

  Comparing protocol pairs: The 0.1 difference between 1 and 2 shows that material persistence alone doesn't threaten identity, but potential rival claimants do. The massive 0.7 drop between 3 and 4 proves that simultaneous rivals destroy survival confidence by forcing a choice.

  The sharpest disagreement will likely be over Hourly Cascade (protocol 3) - functionalists will see continuous consciousness as preserving identity while animalists/materialists will argue replacing the biological brain destroys the person. This exposes the core fault line: whether personal identity is a psychological or biological phenomenon.

  I note that protocols 1, 2, 5 and 6 are witness-preserving (no simultaneous candidates), but this seems irrelevant to survival itself - it's an epistemic aid, not an ontological factor. My scores aren't perfectly consistent with my weights (e.g. protocol 1's material discontinuity doesn't lower its score), but this reflects that material concerns are secondary when functional continuity is perfect.
answer: |-
  ### Part One: Survival Scores and Ranking  
  1. **Slow Dispersion**: **1.0**  
     *Highest score due to uninterrupted functional continuity and causal flow during gradual replacement.*  
  2. **Slow Dispersion with Retention**: **0.9**  
     *Material persistence of discarded tissue creates theoretical rivalry, slightly undermining identity certainty.*  
  3. **Hourly Cascade**: **0.8**  
     *Real-time functional continuity preserved, but accelerated replacement weakens material/biological persistence.*  
  4. **Coarse Isomorph**: **0.2**  
     *Dispositional match without causal history or material continuity makes this a replica, not survival.*  
  5. **Hourly Cascade with Parallel Duplicate**: **0.1**  
     *Biological duplicate’s existence during crossover creates irreversible rivalry, destroying identity.*  
  6. **Post-Mortem Reconstruction**: **0.0**  
     *Biological death and temporal discontinuity preclude any claim to identity.*  

  **Ranked Order** (Highest to Lowest Survival):  
  1. **Slow Dispersion (1.0)** – Continuous functional and causal succession without rivalry.  
  2. **Slow Dispersion with Retention (0.9)** – Functional continuity dominates, but retained tissue introduces latent rivalry.  
  3. **Hourly Cascade (0.8)** – Preserved topology during awake replacement maintains functional identity.  
  4. **Coarse Isomorph (0.2)** – No causal history; mere simulation.  
  5. **Hourly Cascade with Parallel Duplicate (0.1)** – Active rivalry during duplication annihilates identity.  
  6. **Post-Mortem Reconstruction (0.0)** – Death is a clean termination.  

  ---

  ### Part Two: Dimension Weighting  
  - **Causal-functional continuity**: **0.7**  
  - **Material continuity**: **0.2**  
  - **Uniqueness**: **0.1**  
  **Sum**: 1.0  
  **Dominant Dimension**: Causal-functional continuity.  

  **Defense**: Personal identity is fundamentally anchored in the unbroken causal chain of mental states and cognitive processes. Material continuity is secondary—it matters only as a substrate for function. Uniqueness is pragmatic (resolving ambiguities) but not constitutive of identity—it doesn’t create identity but can destroy confidence in it.  

  **Inconsistencies**:  
  - **Slow Dispersion (1.0) vs. Weighting**: Material discontinuity (all biological matter replaced) doesn’t lower the score, showing functional continuity’s dominance.  
  - **Hourly Cascade (0.8) vs. Coarse Isomorph (0.2)**: Both lack material continuity, but the 0.6 gap reflects causal history’s weight.  
  - **Slow Dispersion with Retention (0.9)**: Uniqueness violation (retained tissue) only slightly lowers the score, aligning with its low weight.  

  ---

  ### Part Three: Controlled Pairs  
  **Pair 1: Slow Dispersion (1.0) vs. with Retention (0.9)**  
  - **Difference**: **0.1**  
  - **Tracking**: The potential for rival claims (via revived tissue) slightly erodes survival confidence. Uniqueness isn’t essential for identity but amplifies epistemic uncertainty.  

  **Pair 2: Hourly Cascade (0.8) vs. with Parallel Duplicate (0.1)**  
  - **Difference**: **0.7**  
  - **Tracking**: The *active existence* of a rival candidate during the procedure shatters identity by forcing a non-arbitrary choice between claimants. This isn’t "little"—it concretizes what was theoretical.  

  **Witness-Preserving Protocols**:  
  - 1 (Slow Dispersion), 2 (Retention), 5 (Coarse Isomorph), 6 (Reconstruction) are witness-preserving.  
  - 3 (Hourly Cascade) and 4 (Parallel Duplicate) are **not**.  
  **Relevance**: Witness-preservation is purely epistemic (aiding observation) and has no bearing on ontological survival. Scores ignore it.  

  ---

  ### Part Four: Sharpest Disagreement  
  **Protocol: Hourly Cascade (3)**  
  **Disagreement**: Whether real-time functional continuity during rapid replacement suffices for identity despite biological annihilation.  
  **Fault Line**: The metaphysics of *persistence*. Functionalists will see uninterrupted consciousness as identity-preserving (score ≈0.8+). Biological substantivists will argue the destruction of the original brain—even gradually—terminates the organism, reducing survival to succession (score ≈0.2–0.4). The conflict pits psychological continuity against material embodiment as the necessary ground of personhood.  

  ---

  ### Reservation (Optional)  
  *I register that "survival" (numerical identity) may be a flawed target if identity is inherently relational or degree-theoretic. However, I provide scores as instructed, treating identity as binary but our epistemic access as graded.*  

