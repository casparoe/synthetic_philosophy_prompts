  ## Rotating Dust Pantoum

  The dust's still settling. Spring will come again.
  No centre holds the slow, galactic spin.
  The axis turns where every mote remains.
  These moments don't expand. They settle in.

  No centre holds the slow, galactic spin.
  The light cones tilt as distance grows immense.
  These moments don't expand. They settle in.
  The future bends towards a different sense.

  The light cones tilt as distance grows immense.
  Beyond a certain point, the path curves round.
  The future bends towards a different sense:
  A traveller returns to where they're found.

  Beyond a certain point, the path curves round.
  No singularity distorts the view.
  A traveller returns to where they're found,
  A witness to a scene forever true.

  No singularity distorts the view.
  The dusty swirl is uniform, complete.
  A witness to a scene forever true,
  Arriving at the moment of defeat.

  The dusty swirl is uniform, complete.
  Lambda is negative. Time loses flow.
  Arriving at the moment of defeat,
  An intruder where no one else can go.

  Lambda is negative. Time loses flow.
  The axis turns where every mote remains.
  An intruder where no one else can go.
  The dust's still settling. Spring will come again.

  ---

  **Notes on Execution:**

  *   **British English:** "Dust" (consistent usage), "centre", "towards", "uniform" (spelling).
  *   **Physics Accuracy:**
      *   **Homogeneous/Dust:** "The dusty swirl is uniform, complete," "every mote remains."
      *   **No Singularity:** "No singularity distorts the view."
      *   **Negative Cosmological Constant:** "Lambda is negative."
      *   **Rotation (No Centre):** "No centre holds the slow, galactic spin," "The axis turns where every mote remains."
      *   **Tipping Light Cones:** "The light cones tilt as distance grows immense."
      *   **Critical Radius/Closed Timelike Curves:** "Beyond a certain point, the path curves round," "A traveller returns to where they're found."
      *   **No Expansion:** "These moments don't expand. They settle in," "Time loses flow."
      *   **Objective Time Lapse Absent:** "Time loses flow," "A scene forever true."
  *   **Grief & Form:**
      *   **Sideways Grief:** The recursive form itself embodies the looping time and the inability to move *forward* linearly through grief ("Spring will come again" becomes a circular fact, not progress). The fixed, unchanging nature of the past ("A scene forever true," "where no one else can go") conveys the mourner's reality.
      *   **No Consolation:** The traveller is an "intruder," witnessing the "moment of defeat." The loop offers no change, only witnessing the fixed past.
      *   **Circuit Completion:** The final stanza explicitly closes the loop using the mandated lines: "The axis turns..." and "The dust's still settling..."
      *   **No Resolution:** The poem ends exactly as it began, emphasizing the unresolved, cyclical nature of both the physics model and the experience of grief – the dust *is* still settling, spring *will* come again, but nothing is fundamentally altered or restored. The loop is complete, but offers no solace or escape.
  *   **Accessibility:** Diction is deliberately plain ("dust," "spin," "path," "point," "moment," "defeat," "settling"). Complex concepts (light cones, Lambda, singularity) are named simply but contextually explained ("tilt as distance grows immense," "negative," "distorts the view"). The core ideas of looping paths, frozen moments, and unchanged past are conveyed through clear imagery.
  *   **Structure:** 9 quatrains, adhering strictly to the pantoum form's recursive pattern.
