  (4) Relevance to 18th-century French philosophy specialists, plus any mischaracterizations of the primary text.

  Hmm, the asymmetry claim feels philosophically brittle. While their defense against counterexamples (religious reconversion, etc.) as "new illusions displacing old ones" is clever, it risks becoming unfalsifiable. For the repentance argument to hold, they only need asymmetry *for self-related illusions*—a retreat that preserves their core insight but dodges weaker counterexamples. 

  On the prejudice/illusion critique: the user might be underestimating du Châtelet. Her passion-to-taste trajectory implies a natural sorting mechanism—passions that *can* be moderated without full disillusionment are "illusions"; those requiring destruction are "prejudices." If so, their "she owes a criterion" charge misses her embedded solution. 

