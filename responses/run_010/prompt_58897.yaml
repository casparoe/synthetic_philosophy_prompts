prompt: |-
  I'm prepping a session for a bioethics seminar on the therapy/enhancement distinction and I want to build it around a real institution rather than the usual thought experiments, because the rules are on the books and someone has to apply them case by case.

  The case is anti-doping. WADA's prohibited list works on a two-out-of-three test as I understand it: a substance or method gets banned if it enhances or could enhance performance, if it poses a health risk to the athlete, and if using it violates the spirit of sport — any two of those three is enough. Then separately there's the therapeutic use exemption system, which is where the philosophy gets weird. An athlete with, say, asthma or type 1 diabetes or ADHD can get permission to use a banned drug, but only if all four conditions are met: the drug is needed to treat a real medical condition such that withholding it would significantly impair their health; its use is highly unlikely to produce any performance gain beyond what you'd expect from returning the athlete to their normal state of health; there's no reasonable permitted alternative; and the need for it isn't itself the result of earlier doping.

  So the exemption literally institutionalizes a line between restoring normal function and adding to it, and then asks a medical panel to certify which side of that line a given dose falls on.

  What theory of health, or of normal function, does that presuppose? Is it a statistical-species-norm view where normal is just where the distribution sits, a proper-function view, a welfarist view, or something sports-specific that has no analogue in medicine? And what does the fourth condition — no gain beyond a return to normal — even mean as a measurable claim when the pharmacology is continuous and there's no clean pre-disease baseline for a lot of these athletes? Then look at the inconsistencies: simulating altitude in a hypoxic tent is permitted while EPO is banned, though both raise red-cell mass; beta-blockers are banned only in precision sports like archery and shooting, where steadying your hand is arguably the skill; caffeine is off the list entirely and only monitored; carbon-plated shoes are fine but the full-body polyurethane swimsuits got banned. Does the whole edifice presuppose one coherent account of what's wrong with enhancement, or several incompatible ones bolted together, and which parts are underdetermined enough that a utilitarian, a Kantian, and a virtue theorist could all sign off on the same rules for different reasons? Finally, tell me what would actually have to change in the exemption process if you dropped the return-to-normal baseline and replaced it with something like a pure harm-plus-fairness test — and whether the practice would survive that.
reasoning: |-
  Okay, the user is prepping a bioethics seminar on the therapy/enhancement distinction using WADA's anti-doping framework as a real-world case study. They've outlined the institutional mechanics clearly: the two-out-of-three prohibition criteria and the four-condition Therapeutic Use Exemption (TUE) system. Their questions drill into the philosophical foundations—theories of health, operational contradictions, and whether the system holds together logically or is a patchwork.

  Hmm... they're clearly frustrated with abstract thought experiments and want concrete institutional analysis. The depth of their WADA rule knowledge suggests they've done homework but need help untangling the implicit philosophies. Their questions cluster into three layers: 

  First, the theory behind "normal function" in TUEs—is it statistical (normal as average), functional (ability to perform species-typical activities), or sports-specific? The "no gain beyond return to normal" condition is especially tricky because it assumes a measurable baseline that often doesn't exist. For example, an asthmatic cyclist's "normal" lung function might be statistically subpar but functionally restored with salbutamol. 

  Second, the inconsistencies in banned/permitted tech (hypoxic tents vs. EPO, beta-blockers in precision sports) reveal competing values: health risk vs. fairness vs. "spirit of sport." The carbon-plated shoes case is telling—those likely enhance performance but weren't banned until they became ubiquitous, suggesting the "spirit" criterion is fluid and culturally negotiated. 

  Third, they want to stress-test the system: what if we dropped "return to normal" and just asked "is this harmful and unfair?" That might collapse the therapy/enhancement distinction entirely. For instance, ADHD meds could then be banned across all sports as unfair even if medically necessary, or permitted universally as low-risk—both outcomes would violate current ethical compromises. 

  The user’s unspoken need might be exposing students to institutional "messiness." Real-world rules often hybridize theories (Kantian fairness + utilitarian harm reduction + virtue ethics' "spirit of sport") without resolving tensions. A good seminar could map each WADA clause to different philosophies and have students debate where coherence breaks down. 

  Also worth noting: the fourth TUE condition ("no earlier doping") implies a desert-based ethic (you don't deserve accommodation if you cheated) that contradicts purely medical ethics. That’s rich for discussion. 

  If I were them, I’d design small-group exercises comparing specific TUE decisions (e.g., insulin for diabetics vs. testosterone for "andropause") to highlight how panels navigate blurred lines. The system survives precisely because it avoids committing to one theory—but that’s its philosophical weakness.
answer: |-
  Your choice of WADA's framework is brilliant for grounding the therapy/enhancement debate—it's a rare case where a *formal institution* must operationalize philosophical distinctions. Let's dissect its presuppositions and tensions:

  ### 1. **Theory of "Normal Function" Presupposed**
     - **Hybrid Statistical-Functional Model with Sport-Specific Distortion**:  
       - **Statistical Baseline**: "Normal health" is implicitly defined by population ranges (e.g., hemoglobin levels, lung function). A TUE for asthma requires FEV1 below a statistical norm.  
       - **Functional Capacity**: The goal isn't statistical average but restoring *capacity to compete* (e.g., insulin for diabetics aims for metabolic function sufficient for athletic exertion, not population mean glucose).  
       - **Sport-Specific Distortion**: "Normal" is relative to *pre-illness athletic performance*, not general health. A cyclist with ADHD may need higher stimulant doses to focus during races than for daily life—this is accepted as "restorative" if deemed necessary for their *baseline competitive function*.  
       - **Contradiction**: The lack of pre-disease baselines (e.g., late-diagnosed ADHD) forces reliance on population stats, while the "no performance gain" clause demands sport-specific judgments. This creates a *circularity*: the athlete’s "normal" is inferred from post-treatment performance within accepted limits.

  ### 2. **The "No Gain Beyond Normal" Paradox**
     - **Pharmacological Reality vs. Institutional Fiction**:  
       - Continuous-dose effects (e.g., glucocorticoids for inflammation) mean *any* therapeutic dose offers some advantage over untreated state. WADA accepts this if the advantage is "proportionate" to restoring function.  
       - **Operational Fix**: Panels compare the athlete to *themselves* when healthy (via past performance data) or to population-level biomarker targets. E.g., testosterone TUEs require levels in the *lower quartile* of the normal male range to avoid "supraphysiological" effects.  
       - **Hidden Premise**: Enhancement is defined *relationally*—gains exceeding the *minimum effective dose* for health restoration are prohibited. This assumes a knowable dose-response threshold that rarely exists.

  ### 3. **Inconsistencies: Revealing Competing Values**
     - **Hypoxic Tents vs. EPO**:  
       *EPO is banned* (enhances RBCs, health risk, violates "spirit"), while *hypoxic tents are permitted*—though both increase hematocrit. **Justification**: Tents mimic "natural" altitude adaptation; EPO is artificial. This reflects a *virtue ethics* view ("natural" effort = virtuous) overriding identical outcomes.  
     - **Beta-Blockers in Precision Sports**:  
       Banned only where they directly undermine the *telos* of the sport (steady aim = core skill). This is pure *proper-function Aristotelianism*: the substance is wrong if it corrupts the activity’s essence.  
     - **Caffeine vs. Modafinil**:  
       Caffeine (monitored) is culturally normalized; modafinil (banned) is "artificial" cognitive enhancement. **Tension**: WADA prioritizes *harm* and *spirit* over enhancement alone—but "spirit" is culturally contingent.  
     - **Shoes vs. Swimsuits**:  
       Carbon shoes enhance performance but are deemed "equipment" (acceptable innovation); poly suits were banned for *disproportionate* advantage (violating meritocracy). **Key**: Impact on "level playing field" trumps enhancement *per se*.

  ### 4. **Coherence of the Underlying Ethic**
     - **A Pluralistic Patchwork**: The system fuses three incompatible frameworks:  
       - **Utilitarian Harm Reduction**: Ban substances with high risk/benefit ratios (e.g., anabolic steroids).  
       - **Kantian Fairness**: Protect meritocracy ("spirit of sport" as universalizable rule).  
       - **Virtue Ethics**: Reward "natural" striving (e.g., tents = virtuous; EPO = cheating character).  
     - **Why It (Barely) Works**: The criteria are *deliberately underdetermined*. A utilitarian accepts the health/fairness tradeoff; a Kantian tolerates harm reduction to preserve autonomy from coercion; a virtue theorist overlooks inconsistencies for "spirit" preservation. The shared enemy is *uncontrolled enhancement*.

  ### 5. **What If We Dropped "Return to Normal"?**
     - **Proposal**: Replace TUEs with a "harm + fairness" test: *Does the substance pose unacceptable health risks?* and *Does it undermine fair competition?*  
     - **Consequences**:  
       - **Asthma Inhalers**: Permitted (low risk, minimal advantage if dosed fairly).  
       - **ADHD Stimulants**: Banned universally (cognitive advantage = unfair, regardless of medical need).  
       - **Testosterone for Hypogonadism**: Banned (even with health risk, because restoring "normal" levels *in an athlete* may be unfair).  
       - **Insulin for Type 1 Diabetics**: *The crisis*: Banning it endangers health; permitting it offers advantage (glycogen storage). **Solution?** Dose caps? But this *recreates* the baseline problem.  
     - **Would Practice Survive?** Likely not. Athletes with chronic conditions would be forced to retire (e.g., diabetics), violating inclusivity. The "fairness" criterion collapses without a baseline—*every* medical intervention affects performance. The distinction isn't just philosophical; it's *pragmatically necessary* for institutional function.

  ### Conclusion: WADA as Applied Bioethics Laboratory
  The system presupposes a **species-typical functional norm** modified by athletic context, enforced via *procedural negotiation* rather than philosophical purity. Its contradictions arise from trying to balance:
  - Medical ethics (do no harm),  
  - Sports ethics (preserve merit),  
  - And social values ("naturalness").  

  **For your seminar**: Frame it as a case study in *governing ambiguity*. Have students draft TUE decisions for borderline cases (e.g., "andropause" treatment in a 45-year-old athlete) to expose how rules bend under real-world pressure. The system survives not by resolving tensions but by *managing* them—making it a perfect mirror for bioethics itself.
