  - **Bet**: Pays if **red** is drawn.  

  **Predictions**:  
  - **Averaging rule (Rule 1)**:  
    - Jar I expected red = (10% + 90%) / 2 = **50%**.  
    - Jar J red = **50%**.  
    → **Indifferent**—he flips a coin or says "doesn't matter."  
  - **Maximin rule (Rule 2)**:  
    - Jar I worst-case red = **10%**.  
    - Jar J worst-case red = **50%**.  
    → **Takes Jar J** (guaranteed 50% > 10% worst-case).  

  **Why this works**:  
  - Both rules agreed on all prior scenarios but diverge here.  
  - If Dev is indifferent, he’s averaging. If he picks Jar J, he’s a pessimist.  

