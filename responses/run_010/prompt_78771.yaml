  | *Search: "Subjective expected utility" or "Ambiguity averaging"* | *A is known, B is unknown—he avoids B because he can't average it (no disclosed possibilities).* | *Same as above—avoids unknown B.* | *D's unknown chips lack defined possibilities, so he defaults to known 50% in both jars.* | *D's black probability could be 0-100%; without options to average, he avoids ambiguity and takes C.* | *"Black or white" is equivalent to "not red"—both jars are known 50% non-red.* | *E's options are disclosed (70% or 30%), so he averages them to 50%. F is known but worse.* | *G's options (20% or 80%) are disclosed, so average = 50% > H's 40%.* |
  | **2. Maximin (Pessimism)** | ✅ Takes A (min red = 45% > B's min = 0%) | ✅ Takes A (min black = 55% > B's min = 0%) | ✅ Indifferent (both min red = 50%) | ✅ Takes C (min black = 25% > D's min = 0%) | ✅ Indifferent (both min B/W = 50%) | ✅ Takes E (min red = 30% > F's 25%) | **Takes H** (min red = 40% > G's min = 20%) |
