  | *Search: "Ellsberg paradox" or "Ambiguity aversion"* | *Prefers known risk (A) over unknown (B).* | *Same as Scenario 1.* | *Indifferent because both have known red probability.* | *Prefers known (C) over unknown (D).* | *Indifferent because both have known non-red probability.* | *Should prefer F (known 25%) over E (ambiguous), but he chose E. Fails.* | |
