  ### 3. Which Rule Fits Best and Why
  - **Top rule: Expected value averaging under discrete ambiguity** (Rule 1).  
  - **Why?**  
    - **Scenario 4 is the most diagnostic**: Dev chose the ambiguous jar (E) over the known-but-worse jar (F) because he averaged the disclosed possibilities (70% or 30%) to 50% > 25%. This kills pure ambiguity aversion (Rule 5).  
    - **Scenarios 1–2 show ambiguity avoidance for complete unknowns**: He avoided Jar B (no disclosed splits) both times, even when A was disadvantageous in Scenario 1 (45% red). This rules out naive expected value (Rule 4).  
    - **Scenario 3 confirms he uses known numbers when possible**: When outcomes could be calculated (red or B/W), he was indifferent; when not (black), he avoided ambiguity.  
    - **Is Scenario 4 noise?** Unlikely—he acted decisively ("the numbers are the numbers"). If you ignore it, **maximin** (Rule 2) becomes plausible, but Scenario 4 is too consistent with his spreadsheet persona to dismiss.

