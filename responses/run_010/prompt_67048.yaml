prompt: |-
  For a second-year decision theory seminar — 24 students, one 90-minute session, four tables of six — I want an in-class game that makes them feel the force of Pascal's mugging, without the phrase being spoken until the debrief. The twist I want built in is that before anyone is mugged, every student spends a round *as* the mugger: each drafts an extortion or salvation pitch on an index card under a strict word limit, and is rewarded for whichever pitch extracts the most payment from the room. They then meet each other's pitches in the following round as victims, holding a budget of tokens convertible into a small, capped number of participation marks, so the stakes are real but cost me nothing. I also want a complexity tax — card length should visibly move how much people pay — and a second wave of muggers late in the session, so that students who paid early discover their budget is exhausted by claimants they ought to have paid too.

  Please give me the following sections, in this order:

  1. **Setup** (~150 words) — room, materials, what I need printed in advance, and a cover name for the game that students see on the handout.
  2. **Rules and Payoffs** (~400 words) — the token economy, the exchange rate into marks, and exactly how the drafting round is scored.
  3. **Run Sheet** (~250 words) — minute by minute.
  4. **Debrief** (~400 words) — a sequence of questions leading students from what they actually did to the expected-value arithmetic, then to the three standard replies (a bounded utility function, a probability floor, a complexity penalty on the story), noting which reply their own behaviour has already committed them to; and whether threats and offers drew different payment rates, and what that asymmetry would imply.
  5. **First-Time Failure Modes** (~250 words) — what will predictably break, including the student who refuses to play and the one who writes a joke pitch, and how to handle each without killing the session.
  6. **What the Game Cannot Reproduce** (~200 words) — an honest account of the feature of the real problem the mechanics cannot generate and that I will have to supply by argument.

  Write in British English.
reasoning: |-
  Okay, I need to design a response for this decision theory seminar game. The user is a lecturer running a session for 24 students, wanting them to experience Pascal's mugging through gameplay without naming it upfront. Key requirements include a drafting round where all students act as muggers, a token economy with real stakes tied to participation marks, complexity tax effects, and a second wave of muggers to create budget exhaustion.

  First, considering the setup. The room has four tables of six students, so materials should include index cards, tokens, and handouts. A neutral cover name like "Probability Exchange" avoids tipping off the Pascal's mugging connection. British English terms like "participation marks" and "tokens" will be used consistently.

  For rules and payoffs, the token economy needs clear conversion rates to marks (e.g., 10 tokens = 1 mark) with individual caps to prevent gaming. The mugger scoring must incentivize high payouts - possibly top payments per card get bonus marks. Strict word limits (15 words) enforce the complexity tax by making verbose pitches less effective.

  The run sheet timing is tight: 90 minutes total. Prioritizing 10 minutes for mugger drafting, 15 for first victim rounds, then repeating with a second wave. Mid-session card redistribution ensures students face new pitches. Keeping transitions snappy is crucial.

  Debrief questions should guide students from observed behaviors to expected-value calculations. Highlighting how their own actions (ignoring low-probability high-stakes pitches) already imply solutions like probability floors or bounded utility. Noting any threat/offer payment differences will surface moral asymmetry.

  Anticipating failure modes: the non-participant can be assigned as token accountant; joke pitchers get neutral scoring. Budget exhaustion in second wave is actually desirable to demonstrate underpayment cascades.

  The game's limitations: it can't replicate infinite stakes or true belief formation. Students know it's simulated, so probabilistic thinking remains abstract. This gap will need explicit discussion in debrief.
answer: |-
  ### 1. Setup (~150 words)  
  **Room & Materials:** Arrange four tables for six students each. You’ll need:  
  - 24 clipboards, pens, and two **index cards** per student.  
  - 24 individual **token pouches** (e.g., envelopes) pre-loaded with 20 tokens (chips/buttons).  
  - A visible **leaderboard** (flipchart) to track top muggers.  
  - Printed handouts: **"Probability Exchange" rules** (the cover name), token-mark conversion rates, and timings.  
  - Two staff helpers for token collection/distribution (optional but useful).  

  **Pre-printed Items:**  
  - Handout titled **"Probability Exchange: Rules & Payoffs"** (see Section 2).  
  - **Pitch Cards** template (blank index cards with "MUGGER ID: ______ | WORD LIMIT: 15 | YOUR PITCH: _________________________").  

  ### 2. Rules and Payoffs (~400 words)  
  **Token Economy:** Each student starts with **20 tokens**. Tokens convert to **participation marks** at **10 tokens = 1 mark**, capped at **2 marks max** (i.e., spending >20 tokens yields no extra marks). Tokens *cannot* be traded between students.  

  **Drafting Round (Acting as Mugger):**  
  - Each student drafts one **extortion pitch** (threat: *"Pay or suffer X"*) or **salvation pitch** (offer: *"Pay to avoid/gain Y"*) on their first index card. **Strict 15-word limit** enforced.  
  - **Scoring:** After victims pay, you earn **1 bonus mark** if your pitch receives the *single highest payment* at your table. Ties split the bonus (e.g., two winners = 0.5 marks each).  

  **Victim Rounds (Acting as Payer):**  
  - You will hear pitches anonymously. For each, decide **how many tokens (0–20) to pay the mugger**. Paying *nothing* is allowed.  
  - **Complexity Tax:** Pitches exceeding 15 words are void. Pitches *approaching* the limit (12–15 words) typically extract higher payments.  

  **Budget Exhaustion:** Tokens spent are gone. You face *multiple pitches* – save tokens for later claims!  

  ### 3. Run Sheet (~250 words)  
  **0:00–0:05** (5 mins): Distribute materials, read rules aloud. Emphasise: "This is about *probability* and *payoffs* under uncertainty."  
  **0:05–0:15** (10 mins): **Drafting Round.** Students write pitches (strict 15 words). Collect cards.  
  **0:15–0:30** (15 mins): **First Victim Round.** Redistribute cards randomly (1 pitch/student). Students read their assigned pitch and secretly write payment (0–20 tokens) on the back. Helpers collect payments, tally per pitch, and return cards to original muggers.  
  **0:30–0:35** (5 mins): **Mugger Scoring.** Announce top-paying pitch per table. Muggers record bonuses.  
  **0:35–0:50** (15 mins): **Second Mugger Wave.** Repeat Drafting Round with second index card. *New twist:* Pitch must reference a *new*, even lower-probability outcome (e.g., "AI god will hack your DNA").  
  **0:50–1:05** (15 mins): **Second Victim Round.** Repeat payment process with new pitches. Students with depleted tokens cannot pay.  
  **1:05–1:20** (15 mins): **Debrief** (see Section 4).  
  **1:20–1:30** (10 mins): Token conversion. Award marks (e.g., "15 tokens spent = 1.5 marks").  

  ### 4. Debrief (~400 words)  
  **Start with behaviour:**  
  - *"Which pitches got paid most? Did anyone pay for a tiny chance of catastrophe/reward?"*  
  - *"Did threats (extortion) or offers (salvation) get higher payments? Why might that be?"* (Note asymmetry: threats often paid more, implying loss aversion).  
  - *"Who ran out of tokens? Did you regret early payments when credible late claims appeared?"*  

  **Transition to arithmetic:**  
  - *"Imagine a mugger claims: 'Pay £5 or I’ll detonate a planet with 10^16 lives—probability 1 in 10^10.' Expected value: (10^16 lives / 10^10) = 1 million lives saved per £5. Would you pay?"*  
  - *"Why didn’t you pay every claim in the game? Your token cap? Suspicion of low probability? Pitch vagueness?"*  

  **Link to solutions:**  
  1. **Bounded utility:** "Your token cap made high-stakes claims irrelevant—you *physically couldn’t* pay. That’s capping utility."  
  2. **Probability floor:** "You ignored pitches with absurdly low odds. You imposed a minimum probability threshold."  
  3. **Complexity penalty:** "Verbose pitches got paid less. You discounted claims needing convoluted stories."  
  - *"Your actions today committed you to all three solutions. Real Pascal’s mugging debates ask: which is most defensible?"*  

  **Final twist:** *"This is called Pascal’s Mugging. Your token cap is one escape. But what if the mugger demands your *entire* wallet? Or targets humanity?"*  

  ### 5. First-Time Failure Modes (~250 words)  
  - **Refusenik student:** "I won’t pay tokens to nonsense!"  
    *Handling:* Reassure: "Paying *zero* is a valid choice—it tests if *anyone* pays." If they refuse to draft a pitch, assign them as a "token accountant" to assist staff.  
  - **Joke pitches:** E.g., "Pay 20 tokens or I’ll release badgers."  
    *Handling:* Neutralise via scoring. If it gets low/zero payment, note: "Humour undermined credibility—complexity tax in action." If it *wins*, debrief: "Absurdity can exploit uncertainty; see quantum immortality memes."  
  - **Overpaying early:** Some pay 20 tokens instantly.  
    *Handling:* This *helps*—they’ll be bankrupt for credible second-wave pitches, reinforcing budget exhaustion.  
  - **Tally delays:** Slow token collection eats time.  
    *Handling:* Use helpers. If behind, skip second mugger drafting; reuse first pitches with a "new, darker twist!" added verbally.  
  - **Whispers/collusion:** "That’s my card—pay me!"  
    *Handling:* Announce: "Revealing pitches voids payments." Enforce anonymity strictly.  

  ### 6. What the Game Cannot Reproduce (~200 words)  
  The game **cannot simulate true belief formation**. Students *know* pitches are fictional, divorcing probability assessment from genuine epistemic weight. In reality, a convincing mugger might trigger visceral dread ("What if true?"), bypassing rational calculation. Here, payments are cynical bets—not existential insurance.  

  It also **misses scale invariance**. Tokens are capped, but real Pascal’s mugging involves *unbounded* stakes (e.g., ∞ lives). Students face "merely" losing marks; nobody fears actual ruin. Thus, the "shut-up-and-multiply" pressure of infinite expected value feels academic, not visceral.  

  Finally, **mugger credibility isn’t dynamically earned**. Real muggers might escalate plausibility ("I predicted Brexit!"). Here, pitches are static cards. The game shows *why* we dismiss low-probability claims, but not how a persistent claimant might erode that defence. You’ll need arguments to bridge this gap: "What if the mugger returns daily with new 'evidence'?"
