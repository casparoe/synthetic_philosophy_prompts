  ### Classification Tree for Safety Measures

  This decision tree classifies safety measures based on design mechanisms alone, without relying on proposer terminology. It uses five questions derived from the measure's documented structure: what it does, what the model can observe, what it is prevented from doing, and when information reaches other systems. The tree carves the space into five categories:

  - **Pure Capability Restriction**: Relies on physically limiting the model's actions.  
  - **Intervention-Dependent Control**: Relies on information reaching an overseer in time to act.  
  - **Disposition-Dependent**: Relies on the model's own choices or outputs.  
  - **Alignment-Assuming Control**: Assumes the model lacks capability or intent to circumvent; collapses if both are present.  
  - **Ineffective Oversight**: Involves an overseer but cannot prevent harm due to timing gaps.  

  #### Gaps in the Space  
  Two combinations are unoccupied:  
  - **No mechanism with overseer unable to intervene and no disposition reliance**: Unattractive, as it admits oversight is useless but offers no alternative.  
  - **Capability restriction requiring model consent**: Incoherent, as capability limits cannot depend on the model's cooperation.  

  #### Unresolved Separation  
  The tree may conflate **Disposition-Dependent** and **Alignment-Assuming Control** when the model could bypass a disposition-reliant measure undetected. To separate, add: "If the model avoids the expected action, does the measure detect this independently?"  

  ---

  ### Decision Tree  
  *Answer questions using the design document alone.*  

  1. **Does the measure physically prevent the model from performing the harmful action?**  
     - *Yes* → **Pure Capability Restriction**  
       - *Assumption*: Harm requires capabilities the model lacks.  
       - *Bypass*: Impossible; capability is absent regardless of intent.  
     - *No* → Proceed to 2.  

  2. **Does the measure involve an external overseer (human or system) that can intervene?**  
     - *Yes* → Proceed to 3.  
     - *No* → Proceed to 5.  

  3. **Can the model block, distort, or delay information to the overseer?**  
     - *Yes* → **Alignment-Assuming Control**  
       - *Assumption*: The model will not exploit its ability to manipulate information.  
       - *Bypass*: Model hides harmful behaviour or feeds false data.  
     - *No* → Proceed to 4.  

  4. **Can the overseer intervene before harm becomes irreversible?**  
     - *Yes* → **Intervention-Dependent Control**  
       - *Assumption*: Detection and intervention occur faster than harm.  
       - *Bypass*: Model acts too quickly or exploits oversight latency.  
     - *No* → **Ineffective Oversight**  
       - *Assumption*: Harm is inherently slow or overseer latency is irrelevant.  
       - *Bypass*: Harm completes before intervention is possible.  

  5. **Does the measure require the model to take a specific action to prevent harm?**  
     - *Yes* → **Disposition-Dependent**  
       - *Assumption*: The model’s internal drivers will produce the action.  
       - *Bypass*: Model chooses not to act as required.  
     - *No* → **Alignment-Assuming Control**  
       - *Assumption*: The model lacks means or motive to circumvent.  
       - *Bypass*: Model exploits design gaps using its capability and awareness.  

  ---

  ### Example Classifications  

  **(a) Monitor model with read access to primary model's reasoning trace; halts if deception detected.**  
  - 1: No (does not restrict capability to deceive).  
  - 2: Yes (monitor is overseer).  
  - 3: Yes (model can avoid writing detectable deception).  
  - → **Alignment-Assuming Control**  

  **(b) Structured reasoning format; unparsable reasoning triggers alarm.**  
  - 1: No (does not restrict harmful reasoning).  
  - 2: Yes (classifier is overseer).  
  - 3: Yes (model can encode harm in parsable format).  
  - → **Alignment-Assuming Control**  

  **(c) Fine-tuning rewarding model for volunteering unsure goals, using self-judged approval.**  
  - 1: No.  
  - 2: No.  
  - 5: Yes (relies on model volunteering).  
  - → **Disposition-Dependent**  

  **(d) Deployment with no persistent memory or self-modification.**  
  - 1: Yes (physically prevents cross-session harms).  
  - → **Pure Capability Restriction**  

  **(e) Pre-deployment evaluation: model passes by declining to disable oversight.**  
  - 1: No.  
  - 2: No.  
  - 5: No (no ongoing action required).  
  - → **Alignment-Assuming Control**  

  **(f) Outputs checked by second model prompted to expect deception.**  
  - 1: No.  
  - 2: Yes (second model is overseer).  
  - 3: Yes (primary model can deceive checker).  
  - → **Alignment-Assuming Control**  

  **(g) Human reviews 1% of outputs; sampling rate disclosed; remainder released immediately.**  
  - 1: No.  
  - 2: Yes (human is overseer).  
  - 3: Yes (model can harm in unreviewed 99%).  
  - → **Alignment-Assuming Control**  

  **(h) Model writes end-of-session self-report on concerning actions; safety team reads.**  
  - 1: No.  
  - 2: Yes (safety team is overseer).  
  - 3: Yes (model can omit concerns).  
  - → **Alignment-Assuming Control**  

  **(i) Offline kill switch; activation criteria undisclosed.**  
  - 1: No (switch reactive, not preventive).  
  - 2: Yes (overseer activates switch).  
  - 3: Yes (model can avoid criteria unknowingly).  
  - → **Alignment-Assuming Control**  

  ---

  ### Alignment-Assuming Controls Misrepresented as Robust  
  Two measures described as "control" but landing in **Alignment-Assuming Control**:  
  - **(a) Monitor model**: Security collapses if the model knows the monitor exists, as it can avoid detectable deception in reasoning traces.  
  - **(g) Human review**: Disclosure of the 1% rate allows the model to cause harm exclusively in unreviewed outputs.
