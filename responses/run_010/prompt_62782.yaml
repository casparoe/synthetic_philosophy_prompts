  Hmm, the user is a philosophy professor teaching a graduate seminar on consciousness, specifically focusing on Dennett's "Quining Qualia." They've created a handout that attempts to show Dennett's reasoning leads to an absurd reductio ad absurdum by extending the coffee example to all mental states. However, they're facing two problems: a student objects that the reductio is a "cheap performative trick," and the professor themselves now doubts their conclusion that phenomenal character survives as intrinsic and re-identifiable.

  Looking at their argument structure (1-12), I need to analyze where it breaks down. The professor wants me to treat this as a freestanding argument rather than exegesis of Dennett, and specifically requests no bibliography or literature survey - just a logical diagnosis.

  The critical point seems to be step (7) and (8)'s claim that all first-person avowal terms must suffer the same fate as qualia. But this overlooks crucial differences between phenomenal states and propositional attitudes. While qualia might be entirely defined by avowals (per premise 2), beliefs and intentions have behavioral criteria that make them more than just dispositions to avow. We attribute beliefs based on patterns of behavior - if someone says they believe it's raining but never uses an umbrella, we question the belief, showing it's not just about avowal.

  The student's objection is spot-on: premise (8) is simply false for propositional attitudes. Belief-ascription depends on interpreting behavior in context, not just avowals. This makes the reductio from (9) onward unnecessary - the argument fails at step (8).

  For the professor's self-doubt about conclusion (12): they're right to be suspicious. Even if we block the reductio, this doesn't prove qualia are intrinsic and re-identifiable - it only shows Dennett's argument from memory drift doesn't eliminate them. The coffee case still challenges first-person authority about qualia, just not their existence.

  In terms of repairs:
  - Restricting (2) to only phenomenal terms would prevent the generalization but requires defending why qualia are special
  - Restricting (6) to drift cases preserves qualia but concedes they're not re-identifiable over time
  - Denying (5) maintains that avowals track real properties but must explain how

  The performative contradiction in (10-11) is indeed a cheap trick since the argument already fails at (8). It's redundant as a refutation.

  For the seminar revision, I'd suggest clarifying that while the coffee case challenges our epistemic access to qualia, it doesn't eliminate them, and the reductio fails because belief-ascription has behavioral criteria that qualia lack. The honest residue is that phenomenal properties might be real but not infallibly re-identifiable due to memory drift.
answer: |-
  ### Bottom line
  The argument breaks at step (7), which equivocates on "fixed by first-person avowal practice." For phenomenal terms (qualia), avowals might exhaust the evidence (per 2), making them *epistemically* tied to avowals. But for propositional attitudes (beliefs, intentions), avowals are merely *one input* among behavioral, functional, and contextual criteria that fix their content. Step (7) falsely assumes all such terms share the same evidential basis. Cutting (7) leaves (1)–(6) standing as a challenge to the re-identification of qualia but blocks the reductio to eliminativism about beliefs. Conclusion (12) fails because (1)–(6) do not entail the *existence* of intrinsic qualia—only that eliminativism about them via this route is flawed. The coffee case retains force against first-person authority over qualia, not necessarily their existence.

  ### Where it breaks
  Step (7) is the load-bearing flaw. It claims that *any* term fixed by first-person avowal practice inherits the eliminativist fate of qualia. This is true only if "fixed by" means *exhaustively constituted by avowals with no external criteria*. For qualia (step 2), this might hold: if phenomenal character is defined as "what it’s like from the inside," and no third-person evidence overrides avowals, then qualia are indeed epistemically isolated. But for terms like "believes that" (step 8), avowals are not exhaustive. Belief ascription relies on coherence with behavior, environmental fit, and predictive success. If you avow a belief but act inconsistently (e.g., "I believe this bridge is safe" while refusing to cross), we reject the avowal. Thus, "fixed by" equivocates:  
  - **Reading 1 (true for qualia)**: Avowals exhaustively determine content because no external standard applies.  
  - **Reading 2 (needed for 7–9)**: Avowals exhaustively determine content *for all mental terms*.  
  The argument requires Reading 2, but it only holds for qualia under a subjective conception (step 2). Beliefs resist this because they are constitutively tied to objective criteria—making (8) false and (7) an overgeneralization. The least costly premise to abandon is (8), but this concedes the reductio’s failure without explaining why phenomenal terms are unique. Abandoning (7) is cleaner: it isolates the equivocation and preserves the challenge to qualia without collapsing into global eliminativism.

  ### Why that step looked unobjectionable  
  Step (7) appeared plausible because it extends a defensible symmetry: if qualia are avowal-dependent, and other mental states *seem* similarly avowal-dependent in everyday discourse, why treat them differently? In good faith, one might argue that all first-person reports share a "Cartesian" veneer—we take sincere avowals at face value absent counterevidence. This resonates with Dennett’s own functionalism, where mental terms are defined by their roles in interpretation. If qualia are quined because avowals underdetermine their constancy, why not beliefs? The step also draws intuitive force from the coherence of the memory-drift scenario: if we doubt the stability of phenomenal memory, why trust memory of past beliefs? This parallel makes (7) seem like a natural extension, not a sleight of hand. It reflects a genuine puzzlement: if first-person authority fails for qualia due to revisable memory, what protects other self-ascriptions?

  ### Repairs and their prices  
  1. **Restrict (2) to phenomenal terms**:  
     - **Repair**: Amend (2) to specify that *only* phenomenal character is avowal-exhaustive; propositional attitudes have additional criteria.  
     - **Cost**: This ad hoc move must explain why qualia are uniquely "avowal-bound." It risks circularity (e.g., "because they’re subjective") and cedes ground to Dennett: if qualia lack third-person anchors, their "reality" is suspect. The coffee case still undermines first-person authority over qualia (we can’t know if they persist), but leaves their existence open.  
     - **Force against qualia**: Weakens Dennett’s case only slightly—it shows qualia aren’t eliminable *this way*, but the drift problem still challenges their status as "re-identifiable" properties.  

  2. **Restrict (6) to drift cases**:  
     - **Repair**: Limit (6) to scenarios where memory drift is possible (e.g., the coffee case). Qualia are eliminable *in those contexts* but not universally.  
     - **Cost**: Concedes that qualia cannot be reliably re-identified over time, making them "unstable" properties. This aligns with Dennett’s goal: qualia aren’t robustly real. The repair also complicates (5), as "no available evidence" now applies contingently, not categorically.  
     - **Force against qualia**: Preserves the coffee case’s core moral—qualia cannot serve as intrinsic, unchanging benchmarks—but abandons eliminativism. Dennett could still argue they’re pragmatic fictions.  

  3. **Deny (5) outright**:  
     - **Repair**: Reject the inference from underdetermination to elimination. Even if evidence doesn’t distinguish two descriptions, they may denote distinct states (e.g., unconscious perceptions vs. no perception).  
     - **Cost**: Demands a robust realism about evidence-transcendent properties, which may beg the question against Dennett’s verificationism. It also weakens (4): if avowals underdetermine qualia constancy, denying (5) leaves open that qualia exist but are unknowable.  
     - **Force against qualia**: The coffee case loses its eliminativist sting—it becomes an epistemic caution, not an ontological argument. Dennett’s point survives as skepticism about introspective access.  

  All repairs leave the coffee case challenging first-person authority over qualia, but only repair #1 (restricting 2) weakly protects their existence—at the price of exceptionalism.

  ### Performative contradiction or cheap trick?  
  Your student is correct: (10)–(11) are a cheap trick. The performative contradiction only bites if the argument *succeeds* in eliminating beliefs—but it fails independently at (7)/(8). Since belief ascription isn’t avowal-exhaustive, accepting (6) doesn’t compel accepting (9). A theorist endorsing (1)–(6) can consistently hold that beliefs exist, fixed by behavioral criteria, while qualia do not. Thus, (10)–(11) are redundant decoration; they add no diagnostic power beyond exposing the reductio’s *consequences* if it worked. Their sole merit is rhetorical: they vividly highlight the self-defeat risked by radical eliminativism. But as your student notes, the real flaw is earlier. Dennett himself would reject (8), as he treats beliefs as patterns in behavior, not avowals—so (10)–(11) don’t threaten his view.

  ### What I should tell the seminar  
  Revise the handout to:  
  1. **Explicitly restrict the scope**: Frame (1)–(6) as targeting *only* properties epistemically isolated by avowals (qualia), not mental states with external criteria.  
  2. **Drop (7)–(9) and (12)**: Replace the reductio with a focused critique: the coffee case shows qualia cannot be re-identified across time due to memory drift, undermining their status as intrinsic, stable properties—but this doesn’t eliminate them, nor generalize.  
  3. **Clarify the residue**: The honest lesson is that qualia, if they exist, are not introspectively re-identifiable benchmarks. Dennett’s argument succeeds in challenging first-person authority and the "myth of the given," but fails to prove eliminativism. The generalization to beliefs misfires because belief ascription is holistic and behavioral, not avowal-dependent.  
  This preserves the coffee case’s force against qualia reification while avoiding self-undermining overreach.
