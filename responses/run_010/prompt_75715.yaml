prompt: |-
  I cover science and ideas for a magazine — mostly the zone where research crashes into politics, so election reform, citizen assemblies, AI governance, that beat. Seven years on it and there's an argument shape I keep walking into, from both directions, and I've never heard anyone name it, which makes me think I'm missing something obvious.

  Here's the shape. Someone says: the reason this institution is broken is that the people running it are captured. They depend on donors, on the party machine, on the career ladder, on getting re-elected, so they can't exercise independent judgment about anything. Fine. Then you ask the obvious follow-up — okay, but the people you'd put in charge instead, who are they going to depend on? — and the answer is always some other supplier of information and procedure: a non-partisan secretariat, outside experts, professional staff, a facilitator, the agencies that write the briefings. And then the reformer says, in effect, that's fine, I'd rather be captured by them than by the first lot. Which is an honest answer! But notice what happened to the complaint. It started out as *dependence on an outside supplier destroys independence*, and by the end it's *dependence on the right supplier is no problem at all.* Nobody refuted anything, the argument just quietly became a different argument. It stopped being about escaping control and became about picking which elite controls you, while everyone kept talking as though it were still the first one.

  Two that stuck with me. I interviewed a guy campaigning for a standing citizen's assembly — hundred-odd people drawn by lottery — and his whole pitch was that a career politician can't think straight about anything because everything reaches them filtered through re-election and the whip. I asked who'd be briefing the hundred. Neutral secretariat, outside experts, selected for balance. I asked what stops that secretariat from being where the real power sits, the way people say it already works in the civil service generally. He said: at least they're not trying to get elected. True, and completely beside the point he'd started from, because not-wanting-to-get-elected was never the criterion — not-being-shaped-by-your-supplier was.

  Same structure in a term-limits fight I covered. Someone in a legislature for twenty years has been captured by lobbyists and by their own incumbency, so cap it. Objection: you'll gut institutional memory and hand the building to unelected staff who never leave. Answer: yes, and staff are professionals, they don't have donors. Again — maybe right! But the original complaint was about a body losing its independence to the people it depends on for knowledge and process, and staff are exactly that, so the reply is a preference between two dependencies dressed up as freedom from dependence.

  And it isn't confined to my beat. Central bank independence: accountable politicians versus unelected economists, and when you ask who briefs the economists the answer is the banks. Handing questions to judges instead of ministers. The AI version, where the problem with corporate labs is that they're profit-driven, the fix is a public lab, and the people staffing it are seconded from the corporate labs.

  So — is this a named thing? I know some of the neighbors and none of them feel right. It isn't motte-and-bailey: there's no defensible core being retreated to, the reformer isn't defending the orginal claim in a weaker form, they've swapped the criterion entirely and then carried on as though they'd won the same argument. It isn't hypocrisy, since most of them say the quieter half out loud and genuinely think they've been consistent throughout. It isn't quite moving the goalposts either, because they aren't relocating a standard to save a claim — they're conceding the standard was never really the point. And I know there's old sociology about organizations always ending up run by a small clique, and economists have a thing about regulators coming to serve the industries they regulate, but those are claims about how the world works and I'm asking about a move in an argument, the slide itself.

  To be clear the label isn't the prize, though one would help me write about it. What I want is the carving. Is this already a thing people have picked out, and if so where are the edges — does it only count when the reformer introduces the second supplier themselves, or does it also cover a critic pointing out you'll need one? Is it a fallacy at all, or a perfectly legitimate change of mind being presented illegitimately, because sometimes the expert-briefed body really is the better option and I don't want to build a gotcha that fires on good arguments too. What separates this from simply discovering your principle was too broad, and what separates it from a straight tradeoff being acknowledged as one? Walk me through the nearest established concepts, say where each of them stops short of this, and if there's genuinely no term for the slide, coin one and tell me what falls under it and what doesn't — including the case where the reformer turns out to be right.
reasoning: |-
  Okay, let me tackle this user's query. They're a science and ideas journalist focusing on the intersection of research and politics. Their main concern is a recurring argument pattern they've noticed but can't name. The pattern starts with criticizing institutional capture by external influences like donors or party machines. Reformers propose alternatives like citizen assemblies or expert bodies, but when asked who these new groups depend on, the answer points to neutral secretariats or professionals. The user notices that the original complaint about dependence morphs into preferring one dependency over another without addressing the core issue.

  First, I need to identify if this is a known logical fallacy or concept. The user mentions it's not motte-and-bailey, hypocrisy, or goalpost-moving. They want to know if there's a term for this specific shift in argument. 

  Looking at the examples given: citizen assemblies relying on secretariats, term limits shifting power to staff, central banks depending on banks. The common thread is the unacknowledged shift from opposing dependence to selecting a preferred dependency. 

  I recall Michels' iron law of oligarchy, regulatory capture, and the distinction between principal-agent problems and stewardship theory. But these are structural observations, not argumentative moves. The user is focused on the rhetorical slide where the reformer doesn't acknowledge the trade-off.

  The key elements are: starting with a principle (independence from external influence), proposing a solution that violates that principle, and framing the solution as consistent with the original principle. This resembles "bait-and-switch" but in an argumentative context. "Capture laundering" comes to mind as a coined term, where dependence is sanitized by the source. Another angle is "institutional ventriloquism," where the new body is a mouthpiece for another group.

  The user also wants to know when this is a valid trade-off versus a fallacy. If the reformer admits the dependency but argues it's less harmful, that's honest. The fallacy lies in pretending the original principle is maintained. So the distinction is in the acknowledgment of the trade-off.

  Existing concepts like technocratic solutionism or the nominal fallacy might touch on this but don't capture the argumentative shift. The user needs a clear way to carve out this specific move for their writing, ensuring it doesn't wrongly target legitimate compromises. They need a term that highlights the unacknowledged shift and provides a framework to critique it without dismissing all institutional reforms.
answer: |-
  What you're describing is a brilliant observation—a pervasive yet unlabeled argumentative pivot that deserves a name. It's not quite captured by existing concepts, but let's carve it precisely, name it, and define its boundaries.

  **The Core Move: "Source Substitution Without Principle Reconciliation"**

  At its heart, this is an **unacknowledged substitution of dependence sources while maintaining the rhetorical stance of achieving "independence."** The reformer starts with Principle A: *"Dependence on Supplier X destroys institutional independence/judgment."* The solution implicitly introduces Supplier Y. When challenged, they abandon Principle A entirely and substitute Principle B: *"Supplier Y is preferable to Supplier X,"* while still framing the outcome as satisfying Principle A. The original critique of *dependence itself* is silently discarded in favor of a *preference between dependents*.

  **Why Existing Concepts Don't Fully Fit:**

  1.  **Motte-and-Bailey:** As you noted, this involves retreating to a defensible ("motte") version of a claim after advancing an ambitious ("bailey") one. Here, the reformer *isn't retreating* to a weaker version of "independence from undue influence." They are *changing the definition* of what constitutes acceptable influence/capture. The original principle isn't defended; it's replaced.
  2.  **Moving the Goalposts:** This changes the criteria for success *after* an argument is challenged. Your reformers *do* move the goalposts (from "no capture" to "better capture"), but the deeper issue is the *unacknowledged abandonment* of the original principle ("capture is inherently bad") in favor of a new one ("some capture is good/better").
  3.  **Hypocrisy / Double Standard:** The reformer isn't necessarily violating their *stated* principle at the end, because their *stated* principle has effectively changed. They are consistent with their *new, unstated* principle (Supplier Y > Supplier X).
  4.  **Regulatory Capture / Iron Law of Oligarchy (Michels):** These describe *structural realities* (regulators serving the regulated; organizations inevitably ruled by elites). Your focus is on the *argumentative move* used to justify reforms that often lead to these realities, while *claiming* to avoid them.
  5.  **Technocratic Solutionism:** This describes a *preference* for expert/technocratic solutions over political ones. Your pattern *uses* technocratic arguments, but the defining feature is the *logical slide* from criticizing dependence to embracing a different dependence while denying the slide occurred.
  6.  **Principal-Agent Problem:** This describes the misalignment between a principal (e.g., citizens) and their agent (e.g., politician). Your pattern arises when proposing a *solution* to a principal-agent problem (replace politician with citizen/expert) creates a *new* principal-agent problem (citizen/expert now depends on secretariat/staff) that the reformer dismisses as irrelevant or preferable, without reconciling the original critique.

  **Naming the Pattern: "Capture Laundering" or "Institutional Ventriloquism"**

  *   **Capture Laundering:** The process of taking a system acknowledged as "captured" (by Supplier X) and "cleaning" it by transferring the capture to a less visibly problematic or more socially acceptable Supplier Y, while claiming the system is now "independent." The capture isn't eliminated; its source is laundered.
  *   **Institutional Ventriloquism:** Creating a new institution (the "dummy") intended to speak with independent judgment, but whose voice is actually supplied by a different, often unelected or unaccountable, group (the "ventriloquist" - secretariat, experts, staff), while maintaining the fiction that the dummy speaks for itself.

  **Carving the Concept: Boundaries and Nuances**

  1.  **The Defining Slide:** The core pattern requires:
      *   A critique based on **dependence/capture destroying independence/judgment** (Supplier X is the problem).
      *   A proposed solution **introducing dependence on Supplier Y**.
      *   A defense that **explicitly or implicitly abandons the original critique of dependence itself**, instead arguing **Supplier Y is preferable to Supplier X**, while **framing the outcome as achieving the original goal of independence**.
      *   **Lack of acknowledgment** that a fundamental trade-off between dependencies has occurred.

  2.  **When is it NOT "Capture Laundering"?**
      *   **Acknowledged Trade-offs:** If the reformer says, *"Yes, the secretariat/staff will have significant influence, and that's a potential weakness, but we believe it's a lesser evil than the current donor/electoral capture, and here are safeguards..."* This is honest argumentation about trade-offs. The fallacy lies in the *denial* or *non-recognition* of the trade-off.
      *   **Genuine Mitigation (Not Substitution):** If the reform genuinely reduces *overall* dependence or introduces robust counterweights/multiple dependencies to dilute capture (e.g., multiple expert bodies with competing views briefing the citizen assembly, strong transparency rules for the secretariat), it might avoid simple source substitution. The key is whether the *new dependence is framed as the primary solution and its influence is downplayed*.
      *   **Critics Pointing it Out:** When *you* or another critic say, "Won't this just shift power to the secretariat?" you are *identifying* potential capture laundering. The fallacy is committed by the reformer *in their response* if they dismiss the concern without reconciling their original principle (e.g., "It's fine, they're neutral experts" instead of "We acknowledge the risk, here's how we mitigate it").
      *   **When Supplier Y Genuinely Enhances Independence:** If Supplier Y provides tools/resources that *enable* the decision-makers (citizens, limited-term legislators) to exercise *more* independent judgment *against* Supplier X *and* Supplier Y's influence is constrained (transparent processes, diverse inputs, oversight), it might not be laundering. But if Supplier Y *becomes* the primary source of framing, information, and process control, it likely is.

  3.  **When the Reformer Might Be Right (and Why the Label Still Applies to the Move):** Sometimes Supplier Y *is* objectively better than Supplier X (e.g., non-partisan civil servants vs. corporate lobbyists). The fallacy isn't necessarily that the *outcome* is bad, but that the *argumentative path* to justify it is logically inconsistent. The reformer is right *despite* the flawed argument, not because of it. They've correctly identified a preferable dependency but incorrectly framed the solution as achieving *independence from dependency itself*. Honesty about the trade-off would be stronger.

  4.  **Distinguishing from Principle Refinement:** Discovering your principle was too broad ("Independence means zero external input! Oh wait, that's impossible, so independence means freedom from *undue* influence from *specific bad actors*") involves narrowing the principle *while staying true to its core concern*. Capture laundering *abandons* the core concern (dependence/capture as inherently problematic) and substitutes a *different* concern (the *source* of the dependence/capture).

  **Why This Matters for Your Writing:**

  *   **"Capture Laundering"** gives you a precise, evocative term to label this pervasive and often unexamined pivot.
  *   **It forces scrutiny:** Instead of getting lost in "politicians bad, experts good," you can ask: "Is this reform truly escaping capture, or just laundering it? What makes Supplier Y's capture preferable, and is that preference acknowledged?"
  *   **It exposes hidden trade-offs:** The term highlights that many proposed solutions aren't about achieving independence, but about *managing dependence* – a crucial distinction often obscured in reform rhetoric.
  *   **It avoids unfair "gotcha":** By clearly defining the move (the unacknowledged substitution/laundering), you can critique the *argument* without necessarily condemning the *reform*. You can say: "This proposal involves capture laundering from donors to experts. That *might* be an improvement, but let's examine the risks of this new dependence honestly, rather than pretending it grants pure independence."

  Your observation hits the nail on the head. The pattern is fundamental to institutional reform debates. Naming it "Capture Laundering" provides the conceptual tool you need to dissect it clearly for your readers.
