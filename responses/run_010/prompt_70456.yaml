answer: |-
  ## Integer Default

  The air in Conference Room Sigma smelled of stale coffee and existential dread. Outside, rain lashed against the high windows of the Consortium for Chronological Interoperability (CCI) headquarters. Inside, the glow of laptops illuminated tense faces. Anil Sharma, Lead Schema Maintainer for the Chronology Interchange Format (CIF), tapped his stylus against the table like a metronome counting down to disaster.

  “We ship in seventy-two hours,” Anil stated, his voice flat. “The curriculum engine beta at Scholastica Global *requires* the updated period bounds. Their migration starts Friday. If our `Period.EndYear` field returns null for ‘The Scientific Revolution’, their scripts *will* invent a value. Probably 1600 to 1700. Clean. Wrong. Impossible to untangle later.” He pulled up the changelog draft projected on the main screen. Under `PERIOD_SCI_REV`, the fields `StartYear` and `EndYear` glared red: `NULL`.

  Elena Rossi, Professor Emerita of Late Medieval Transmissions, sighed. Her fingers traced the edge of a well-worn notebook filled not with dates, but with intricate diagrams of manuscript diffusion networks. “Anil, it’s not that simple. ‘Scientific Revolution’? Petrarca Ludovici coined it in 1879 to sell books, contrasting ‘pure mind-work’ with ‘machine-truth’. But look at the *Institutiones Calculi* from Prague, 1380 – pure mathematics demanding observational verification. Or the alchemical networks across the 14th century, meticulously recording furnace temperatures. Where does ‘trust in the mind’ end and ‘dependence on external observation’ begin? It’s a gradient, a thousand overlapping threads. Not a switch flipped in 1543 or 1609 or whenever we arbitrarily decide.”

  “Gradients don’t index,” Anil shot back. “CIF deals in integers. Downstream systems parse integers. The whole point is unambiguous machine-readability. Ambiguity breaks migrations, corrupts search, renders curriculum engines useless. A wrong number is fixable in the next release. A `NULL` is a ticking time bomb of silent defaults.” He pointed at the third figure at the table. “Leo? Projections?”

  Leo Chen, Junior Data Analyst, paled slightly. He hadn’t slept, his screen showing a complex graph. “Uh, right. The Secretariat’s five-year boundary recomputation cycle… it’s accelerating the drift. Based on tagged usage across the indexed corpus – journals, textbooks, digitized archives – the labels are… migrating.” He flicked a chart onto the screen. Lines representing the start and end years of ‘The Middle Ages’, ‘The Renaissance’, and ‘The Scientific Revolution’ shifted erratically, but with a clear trend.

  “‘Renaissance’ start creeps later. 1350, then 1375, now the projection puts next cycle’s consensus start at 1410,” Leo explained. “‘Scientific Revolution’ starts earlier *and* ends later – 1450 to 1720 in the last run, projected 1430 to 1750 next. ‘Modern’ period shortens at the front.” He zoomed in on the converging lines. “The intervals… they’re shrinking. Projecting forward… within four cycles, maybe five… the earliest defined period – ‘Middle Ages’ – has a projected *start year* later than the CCI’s founding date. 2038. It… it mathematically overlaps our own present.”

  Silence, thick and heavy. The rain drummed louder.

  Marta Vance, Chair of the Working Group and Head of the Bodleian’s Digital Futures wing, finally spoke. Her voice was calm, betraying nothing. “Explain the overlap, Leo.”

  Leo swallowed. “The algorithmic consensus, based purely on how *we* use the labels *now*, is pulling the recognized boundaries of the past towards… us. The ‘Middle Ages’, as a term defined by its usage, starts to begin *after* the system defining it existed. It’s… recursive. Self-referential.”

  Elena leaned forward, eyes alight. “Proof! It’s evidence the labels aren’t containers for reality, they’re descriptions of *us*. Of how *we* perceive discontinuity, based on what *we* value *now*. Ludovici needed a revolution to sell his philosophy. We need clean integers for our databases. The label bends to the describer, not the described!”

  Anil rubbed his temples. “Or it’s proof the sampling frame is garbage. The corpus is skewed towards recent, Western, English-language publications chasing trendy interpretations. It’s a feedback loop, not a profound truth. And it doesn’t solve *our* problem. We need integers. *Now*.”

  “What about the deprecation queue?” Elena asked, a desperate edge in her voice. “We flagged ‘Dark Ages’ for deletion last year. Can’t we deprecate this whole tripartite scheme? Map it to something neutral? `Period_European_Transition` or… something?”

  Anil pulled up the CIF schema documentation. “Deprecation doesn’t delete the boundary, Elena. It deletes the *label*. Look.” He highlighted a section:

  ```markdown
  FIELD: `Period.ReplacementLabel` (STRING[50])
  DESCRIPTION: If `IsDeprecated` = TRUE, specifies the neutral label to which all instances SHOULD be mapped during migration. The original `StartYear` and `EndYear` values are preserved and inherited by the replacement label. Purpose: To maintain temporal continuity in datasets while removing contested terminology.
  EXAMPLE: `Dark Ages` (Deprecated) -> `Early Medieval Period` (Inherits original date bounds: 476, 1000).
  ```

  “See?” Anil said. “The dates stay. The opinion hardens. `Dark Ages` becomes `Early Medieval Period`, but it’s still 476 to 1000 in the system. The fiction becomes infrastructure. Deprecating ‘Renaissance’ just means calling it `Period_Cult_Flourish_Europe` or whatever, but we *still* have to give it a start and end year. The integer requirement remains. We can’t escape the box.”

  Marta steepled her fingers. “The Scholastica deadline is immovable?”

  “Their entire secondary education history module rollout depends on it,” Anil confirmed. “Fail this, and they implement local defaults. Balkanized chronology. Interoperability nightmare for decades.”

  Elena slammed her notebook shut. “So we just… lie? Pick numbers we know are arbitrary fictions, knowing they’ll calcify?”

  “We provide clarity,” Anil insisted. “We prevent chaos. We enable the systems that let students and researchers *find* the messy arguments you care about, Elena. Without this, the nuance you fight for becomes invisible sludge in broken databases.”

  “Let’s vote,” Marta said, her tone final. “Roll call. On setting `Period.MiddleAges.StartYear` = 476, `EndYear` = 1453. Anil?”

  “Aye. Stability. Clarity.”

  “Elena?”

  “Nay. 476 is the fall of the West. But the East? Continuity for centuries! And 1453? Constantinople falls, but Italian humanism was already decades old! It’s a tiny hinge in a vast, creaking door. It’s meaningless!”

  “Noted. Leo?”

  Leo looked at his converging lines graph, then at Anil’s steely gaze. “Aye. The systems… need something.”

  “Marta?”

  The Chair paused, looking out at the storm. “Aye. 476. 1453.” She didn’t elaborate.

  Elena slumped back, defeat etched on her face. The vote continued. Renaissance: 1350-1600 (Anil: Aye, Elena: Nay – “Florence in the 1340s! The Avignon Papacy! Ludovici’s *medium tempestas* phrase from the 1460s was retrospective!” Leo: Aye, Marta: Aye). Scientific Revolution: 1543-1687 (Anil: Aye, Elena: Vehement Nay – “Copernicus published in 1543, but his work was *medieval*! Newton’s *Principia* in 1687, but the Royal Society’s meticulous observation protocols were decades old! It’s not a revolution, it’s a slow accretion!” Leo: Aye, Marta: Aye).

  As the votes solidified the integers, Anil’s fingers flew over his keyboard, updating the changelog draft. Alerts pinged softly on his screen – Scholastica’s integration tests querying the staging server, waiting.

  “Elena,” Marta said quietly, “the University of Pavia’s grant application for their late medieval manuscript cross-referencing project… it relies on CIF-compliant metadata for funding approval. Their submission deadline is tomorrow. Without finalized periods… the funding allocation algorithms can’t process it.”

  Elena went very still. The cost was concrete. Her life’s work, the painstaking reconstruction of continuities, needed the fiction to survive in the modern system. Her objection died in her throat, replaced by a hollow ache. She nodded curtly.

  Later, deep in the quiet bowels of the night, Anil worked alone. The main decisions were made, but the details remained. He navigated to the core CIF schema definition file, `cif_core_periods.v12.def`. He found the section for `PERIOD_MIDDLE_AGES` and began composing the mandatory comment string for the date fields. The character limit was brutal: 120 bytes. It had to explain the dates to anyone, human or machine, reading this code centuries hence. He typed, deleted, typed again.

  ```python
  FIELD: StartYear (INTEGER)
  # Approx consensus start: trad fall West Roman Emp. NOTE: Contested! See deprecation log v11.2 for 'Dark Ages' map.
  # Value: 476
  FIELD: EndYear (INTEGER)
  # Approx consensus end: trad fall Constantinople. NOTE: Significant continuity persists! SEE: Rossi (2031) re: transmission latency studies.
  # Value: 1453
  ```

  He stared at the screen. `Approx consensus`. `Trad`. `Contested!`. `Significant continuity persists!`. The exclamation marks felt like tiny screams trapped in the code. It was the barest whisper of the storm in Sigma, a flicker of Elena’s defiance, Marta’s unspoken pressure, Leo’s terrifying convergence graph, all compressed into a handful of bytes. He thought about the Jalali calendar entries he’d overridden yesterday to fit the integer schema, the quiet erasure. He thought about Scholastica’s curriculum engine humming to life with these numbers, shaping how millions would first encounter the past. He thought about the deprecation queue, where `Dark Ages` slept, its boundaries intact under a new, sterile name.

  His finger hovered over the delete key. He could make it cleaner. Just `# Traditional start: 476`, `# Traditional end: 1453`. No noise. Machine-readable clarity.

  Outside, the storm had passed. A single, cold point of light – Jupiter, maybe, or a satellite – glinted through the retreating clouds. Anil sighed, a sound lost in the hum of the servers. He saved the file with the screaming exclamation marks intact. The comment string was committed. The integers stood. The release would ship on time. Somewhere, deep in the logic of the future, the boundaries continued their slow, inevitable drift towards the present.
