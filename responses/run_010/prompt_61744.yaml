  Now, the memo draft:

  ---

  **MEMORANDUM**

  To: Foundation Board Members  
  From: Science Advisory Panel  
  Date: [Date]  
  Subject: Recommendation for Flagship Grant in Search for Life  

  ### Introduction  
  After thorough review of the three finalist proposals for the flagship grant in the search for life, the Science Advisory Panel recommends funding **Proposal A (Deep Listening Survey)** at the requested $18M and restructuring the current round to partially fund **Proposal C (Biosignature False-Positive Program)** at a reduced level of $8M, while not proceeding with **Proposal B (Active Beacon Program)**. This approach prioritizes reversible, informative science and addresses the core concerns raised during our deliberations regarding the interpretation of null results and unlearnable uncertainties.  

  ### Addressing the Null Result  
  Decades of non-detection in SETI and exoplanet studies have produced a profound null result. How should we interpret this?  

  - **As Evidence of Weak Searches**: Our past surveys have covered only a tiny fraction of the search space (in frequency, time, sensitivity, and target stars). For instance, the total integrated SETI effort to date is equivalent to less than a day of observation of a single star at high sensitivity. The null result thus primarily reflects the infancy of our search capabilities, not the absence of ETI.  
  - **As Evidence About the Universe**: While the null result does impose some constraints, these are weak. For example, it rules out a galaxy teeming with extremely powerful, omnidirectional transmitters (like a Kardashev Type II civilization), but it does not meaningfully constrain civilizations at our level or slightly above, which might transmit intermittently or directionally.  

  This dual reading implies that expanding the search volume (as in Proposal A) is both justified and necessary. A null result from A would be far more informative than past efforts, potentially ruling out a significant fraction of sunlike stars hosting continuous transmitters. Conversely, Proposal C addresses a complementary null result: the absence of unambiguous biosignatures in exoplanet atmospheres. By identifying false-positive mechanisms, C reduces the risk of future misinterpretations, making biosignature detections more robust.  

  ### Handling Unlearnable Uncertainties  
  The debate over Proposal B hinges on quantities that are not merely uncertain but arguably unlearnable: the probability that a receiving civilization exists, the chance it would respond benignly, and the risk of an existential threat from transmission.  

  - **The Precautionary Principle**: When faced with unlearnable uncertainties and potential catastrophic risks (even with low probability), we must avoid actions that are irreversible and global in consequence. Transmitting a beacon (B) is such an action: once sent, the signal cannot be recalled, and the risk, however small, could affect all of humanity.  
  - **Expected Value Limitations**: Calculating an expected value for B requires multiplying a speculative probability of contact by an immense payoff. However, if the probability of harm is non-zero and unconstrained (it could be 10^-3 or 10^-20), and the harm is existential, then the expected value calculation becomes meaningless. No experiment we could fund would ever pin down these probabilities.  

  Therefore, we must prioritize reversible research (A and C) over irreversible bets (B).  

  ### Recommendation and Rationale  
  We recommend:  
  1. **Fund Proposal A ($18M)**: This survey represents a substantial scaling-up of the search for technosignatures. It is reversible (no signal is sent), leverages existing infrastructure, and will deliver a highly informative null result if no signals are found. The main uncertainty is the prevalence of ETI, but this is precisely what A seeks to constrain.  
  2. **Partially Fund Proposal C ($8M)**: The biosignature false-positive work is critical for future missions but can be staged. We recommend funding the most urgent lab experiments and modeling, deferring the instrument concept phase for later consideration.  
  3. **Reject Proposal B**: The scientific case for active transmission rests on unlearnable uncertainties and carries an irreversible risk. The foundation’s role is to advance knowledge, not to gamble on humanity’s behalf with stakes beyond our mandate.  

  ### The Case Against and Our Response  
  - **In Defense of B**: Proponents argue that the potential payoff (contact) is unparalleled, that the risks are speculative and unsupported by evidence, and that without transmission, we might never resolve the Fermi paradox. They contend that a foundation should take bold risks to answer profound questions.  
    - *Response*: While the payoff is immense, the risks, though unproven, are irreducible and potentially existential. The foundation lacks the mandate to impose such risks on humanity. Moreover, the same profound questions can be addressed by listening (A) and improving biosignature interpretation (C).  

  - **In Defense of Full Funding for C**: Proponents argue that false positives are the Achilles' heel of biosignature detection and that $22M is necessary to deliver a complete solution, including an instrument concept.  
    - *Response*: We agree on the importance but note that the most valuable work (lab experiments and modeling) can proceed with reduced funding. The instrument concept can be developed in a future phase once the science matures.  

  ### Conclusion  
  The foundation’s mission is to fund science that expands human knowledge while stewarding resources responsibly. Proposal A offers a high-information, reversible path to constraining the prevalence of ETI. Proposal C, partially funded, addresses a critical gap in biosignature research. Proposal B, while bold, introduces an irreversible risk based on unlearnable uncertainties and falls outside our risk tolerance. We urge the board to approve this balanced approach.  

