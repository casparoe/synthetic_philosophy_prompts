prompt: |-
  So I got into a three-hour argument with a friend last night and I still haven't won it, which means I need to outsource it. I'm the first-pass reader for a comparative economic history working-paper series — not a specialist in any region, just the person who decides which submissions go out to the area specialists and which get bounced back with a note. A lot of what lands on my desk is phrased as one big contrastive question: why Britain and not the Yangzi delta, why Europe and not China, why did X miss the boat, why did industrialization start where and when it did. My friend thinks these are perfectly good questions and that anyone who says otherwise is a philosopher wasting historians' time. I think most of them aren't actually well posed — that "why A and not B" quietly smuggles in a choice of foil, a choice of unit (state? region? civilization? river basin? firm?), and a definition of the outcome that the author never states and often couldn't defend. His counter is that my scepticism, applied consistently, would kill every ambitious question in macro-history, and I don't have a good answer, partly because I can't articulate what my standard actually is beyond a vibe. So: turn the vibe into a procedure.

  What I want is a checklist a non-specialist can run in about thirty minutes on a submission whose central claim is a contrastive why-A-and-not-B question. Ordered steps, what counts as a sufficient answer to each, where the procedure terminates in "not well posed, return with this specific repair," where it hands off to a specialist because what's left is an empirical matter rather than a conceptual one, and — this matters — which steps are judgement calls wearing a procedure costume. Ground it in whatever the philosophy of explanation actually says that's usable: that explanations are contrastive so the foil does real work, that a difference-based comparison needs some shared background between the case and the contrast, selection on the dependent variable, the sample-of-one problem, the difference between a concept being vague at the edges and a concept being broken. But write it so someone with no philosophy training can execute it without knowing where those ideas come from. Two things I specifically want built in, because they're how I catch the bad ones in practice: a re-description ladder, where the reader has to restate the question one unit-level up and one level down (Europe → England → Lancashire, or China → Yangzi delta → Suzhou) and check whether the question survives unchanged, dissolves, or changes its answer; and a one-sentence paraphrase test, where the reader has to restate the question so that a competent outsider could say what evidence would settle it, and if they can't, the reader has to decide whether that's vagueness or ill-posedness.

  Then run it on three submissions I'm making up but which are close to things I've actually recieved. First: "Why England and not the Yangzi delta? Wages, coal, and colonial markets around 1750." This is my friend's favourite framing and he considers it settled, so I want an honest verdict — if it fails, say precisely which check kills it, what repair the author would have to make, and whether the repaired question is still the interesting one or just a defensible one. Second: "Why didn't the Roman economy industrialize?" I suspect this is junk, because it applies an outcome concept to a society that arguably lacks half its components and because there's no plausible foil, but I want the procedure to say so rather than me. Third: "Why did industrialization begin in the eighteenth century rather than the fourteenth?" I personally find this unfalsifiable hand-waving, so if it passes, tell me bluntly that I'm wrong and which of my instincts is the bad one. Finally, answer my friend directly: give me the strongest version of his objection, say which checks in your procedure are most likely to be over-applied by a lazy or timid reader and how the procedure should protect against that, where you deliberately left slack so that big speculative questions aren't strangled, and what the procedure flatly cannot do — it doesn't tell me whether the answer to a well-posed question is correct, and I assume it can't detect a contrast chosen for ideological reasons, but I want you to say what else it's blind to.
reasoning: |-
  Okay, let me tackle this user's problem. They're a first-pass reader for a comparative economic history working-paper series, dealing with "why A and not B" questions. They had a three-hour argument with a friend about whether these questions are well-posed. The user thinks many are flawed due to undefined foils, units, or outcomes, while their friend argues that such skepticism stifles ambitious historical inquiry. The user wants a practical checklist to evaluate these submissions, grounded in philosophy but usable without specialized knowledge.

  First, I need to understand the core issues. The user mentioned concepts like contrastive explanations, selection on the dependent variable, and the sample-of-one problem. These are key in philosophy of explanation. Contrastive explanations require a clear foil and shared background. The unit problem (e.g., comparing England vs. Yangzi Delta instead of Britain vs. China) affects validity. Also, outcome variables must be consistently defined.

  The user wants two specific tools: a re-description ladder and a paraphrase test. The ladder checks if the question holds at different unit levels. The paraphrase ensures the question can be tested with evidence. I should integrate these into a step-by-step procedure.

  Building the checklist:
  1. **Clarify Outcome**: Define what "industrialization" means. If vague, the question might be invalid.
  2. **Specify Foil**: The contrast (B) must be plausible and comparable. If B isn’t at a similar development stage, it's a bad foil.
  3. **Unit Consistency**: Ensure A and B are comparable units (e.g., regions of similar scale). Shifting units can dissolve the question.
  4. **Shared Background**: Both cases should have common preconditions. Without this, differences might be irrelevant.
  5. **Avoid Selection Bias**: The sample shouldn’t cherry-pick cases. Need multiple examples or justify why only two cases.
  6. **Redescription Ladder**: Test the question at higher/lower units. If the answer changes, the original framing is problematic.
  7. **Paraphrase Test**: Can a clear, testable question be formed? If not, it's likely ill-posed.

  Now, applying to the examples:
  1. **Why England and not Yangzi Delta?** 
     - Outcome (industrialization) might be passable, but foils are inconsistent (England is a sub-national unit, Yangzi Delta is a region). Shared background? Both were advanced economies. Fails Unit Consistency and possibly Paraphrase Test if coal/wages aren't clearly causal.

  2. **Why didn't Rome industrialize?** 
     - Outcome problem: "Industrialization" anachronistic. No plausible foil (contemporary Han China? But different contexts). Fails Outcome Clarification and Foil Specification.

  3. **Why 18th vs 14th century?** 
     - Outcome needs defining. Foil is temporal, but why pick 14th? Shared background? Plausible (both pre-industrial Europe). Might pass if outcome is specific, but needs justification for the foil choice.

  Addressing the friend's objection: The checklist shouldn't kill ambitious questions but ensure they're answerable. Steps 5 (Shared Background) and 6 (Redescription Ladder) might be over-applied by timid readers. The procedure allows flexibility by permitting provisional concepts and requiring only plausibility, not perfection, in foils. However, it can't detect ideological biases or verify empirical answers, only the question's structure.

  User’s deeper needs: They want legitimacy in rejecting papers without seeming arbitrary. The checklist provides a defensible methodology. Also, they need to handle peer pressure (friend's view) by having clear criteria. Ensuring the procedure is efficient (30 mins) and actionable for non-specialists is crucial.
answer: |-
  Here’s a concrete 30-minute checklist for evaluating "why A and not B" questions in comparative economic history, designed for non-specialists. It’s grounded in philosophy of explanation (contrastivity, causal asymmetry, conceptual clarity) but stripped of jargon. Steps flagged with **⚠️ JUDGEMENT CALL** require interpretation but include guardrails. **Termination rules** specify when to reject or escalate.

  ---

  ### **The Checklist: "Contrastive Question Vetting Protocol" (30-min max)**
  **Core Principle:** A valid contrastive question must specify (1) *what happened*, (2) *what didn’t*, (3) *where/when*, and (4) *against what baseline*, such that evidence could *plausibly disprove* the proposed answer.

  1. **Clarify the Outcome (5 min)**  
     - *Task:* Identify the exact outcome **O** (e.g., "industrialization," "market integration").  
     - *Sufficient Answer:* **O** must be defined with **at least two measurable indicators** (e.g., "steam engine adoption > X units, cotton textile productivity growth > Y%/year").  
     - *Reject If:* **O** is purely teleological (e.g., "failed to modernize"), circular (e.g., "lacked capitalism"), or relies on an anachronistic concept.  
     - *Repair:* Demand operationalized indicators.  
     - **⚠️ JUDGEMENT CALL:** If **O** is vaguely defined but *intuitively historical* (e.g., "state capacity"), allow provisional use if the author flags its ambiguity.  

  2. **Specify the Foil (B) (5 min)**  
     - *Task:* State why **B** is a plausible counterfactual/comparator.  
     - *Sufficient Answer:* **B** must share **≥1 key precondition** with **A** (e.g., similar commercialization, urbanization, tech levels) *before* the divergence.  
     - *Reject If:* **B** is cherry-picked (e.g., "Why England and not Tibet?") or fundamentally incomparable (e.g., different ecological constraints).  
     - *Repair:* Require justification for **B**’s selection or suggest a better foil.  

  3. **Verify Unit Consistency (5 min)**  
     - *Task:* Check if **A** and **B** are comparable units (state vs. state, region vs. region).  
     - *Sufficient Answer:* Units must be **functionally equivalent** (e.g., both fiscal-military states *or* both commercialized regions).  
     - *Reject If:* Units are mismatched (e.g., "Europe" vs. "China" is vague; "Lancashire" vs. "China" is invalid).  
     - *Repair:* Demand unit alignment (e.g., "Yangzi Delta" vs. "England," not "China").  

  4. **Run the Redescription Ladder (7 min)**  
     - *Task:* Restate the question at one scale **up** (e.g., England → Britain) and one **down** (e.g., England → Lancashire).  
     - *Sufficient Answer:* The core question must **retain its logic** at all levels.  
       - *Survives:* Divergence persists (e.g., "Why NW Europe and not East Asia?" still works).  
       - *Dissolves:* Scale shift invalidates the contrast (e.g., "Why Britain and not the Yangzi Delta?" becomes incoherent at the "firm" level).  
       - *Changes Answer:* Different scales imply different causes (e.g., "Why England?" focuses on institutions; "Why Lancashire?" on coal).  
     - *Reject If:* The question dissolves or changes answers drastically.  
     - *Repair:* Reframe to the most stable unit level.  

  5. **Apply the Paraphrase Test (5 min)**  
     - *Task:* Rewrite the question in **one sentence** so a non-historian can state what evidence would verify/falsify it.  
     - *Sufficient Answer:* The paraphrase must specify **testable predictors** (e.g., "If coal access was decisive, then regions with coal should industrialize first").  
     - *Reject If:* Unresolvable vagueness (e.g., "lacked entrepreneurial spirit" → no measurable proxy).  
     - **⚠️ JUDGEMENT CALL:** Distinguish *vagueness* (fixable with proxies) from *ill-posedness* (e.g., "Why not Rome?" → no definable **O**).  

  6. **Check for Selection Bias (3 min)**  
     - *Task:* Ensure the question doesn’t presuppose the outcome.  
     - *Sufficient Answer:* If **A** and **B** are the *only* cases, the author must justify **why these two**.  
     - *Reject If:* "Sample of one" (e.g., "Why Britain alone?") with no theory for excluding contemporaries (e.g., the Netherlands).  
     - *Handoff:* If bias is ruled out, hand to specialists for empirical testing.  

  **TERMINATION RULES:**  
  - **Reject** if Steps 1, 2, 3, or 5 fail.  
  - **Return for Repair** if Steps 4 or 6 show correctable flaws.  
  - **Handoff to Specialist** if all checks pass.  

  ---

  ### **Application to Your Cases**
  **Case 1: "Why England and not the Yangzi delta? Wages, coal, and colonial markets around 1750."**  
  - **Verdict:** **Reject at Step 3 (Unit Consistency).**  
    - *Why:* England (subnational) vs. Yangzi Delta (subnational) *seems* aligned—but "colonial markets" imply **England** is a proxy for an empire-scale system, while the Yangzi had no equivalent. Redescription Ladder (Step 4) shows the question **changes answer** when scaled: at "Lancashire vs. Suzhou," colonial markets vanish; at "Britain vs. China," coal/wages may not dominate.  
    - *Repair:* Reframe to "Why did Britain’s *metropole* industrialize when similarly advanced regions (Yangzi Delta, Netherlands) did not?"  
    - *Still Interesting?* Yes—but now highlights the empire’s role, forcing the author to defend colonial markets as uniquely impactful.  

  **Case 2: "Why didn't the Roman economy industrialize?"**  
  - **Verdict:** **Reject at Step 1 (Outcome Clarification).**  
    - *Why:* "Industrialization" is anachronistic. No 1st-century society had the preconditions (e.g., scientific epistemology, fossil-fuel tech). Step 5 paraphrase fails ("What would prove Rome *couldn’t* industrialize?" → no falsifiable test).  
    - *Repair:* Shift to a defined outcome (e.g., "Why no sustained productivity growth?"), but then Step 2 (Foil) fails—no comparable agrarian empire had it either.  
    - *Junk?* Yes. The question assumes industrialization was ever feasible for Rome.  

  **Case 3: "Why did industrialization begin in the eighteenth century rather than the fourteenth?"**  
  - **Verdict:** **Handoff to Specialist after conditional pass.**  
    - *Why it passes:*  
      - Step 1: **O** can be defined (e.g., "takeoff in mechanized production").  
      - Step 2: Foil is temporal (18th vs. 14th c. Europe)—shared background plausible.  
      - Step 5: Testable ("If resource constraints caused delay, then 14th c. Europe should show proto-industrial growth *unless* blocked by famine/plague").  
    - *Your Instincts:* Overly skeptical! The foil isn’t arbitrary—the 14th c. had clusters like Flanders. **Key judgement:** The question is *speculative but answerable* if the author defines **O** tightly (Step 1).  
    - *Risk:* Vagueness in "industrialization" might still sink it during specialist review.  

  ---

  ### **Answering Your Friend**  
  **His Strongest Objection:** *"Your checklist will strangle ambitious questions by demanding impossible precision for unique historical events."*  

  **Where He’s Half-Right:**  
  - **Over-Application Risks:**  
    - Step 1 (Outcome) could be used to reject *any* broad concept (e.g., "capitalism").  
    - Step 6 (Selection Bias) might dismiss small-N comparisons unfairly.  
  - **Safeguards in the Protocol:**  
    - **Judgement Calls:** Steps 1 and 2 allow provisional concepts if historically grounded.  
    - **Slack for Speculation:** The Redescription Ladder (Step 4) permits rescaling questions rather than rejecting them.  
    - **Handoff Rule:** Specialists decide empirical plausibility—not the checklist.  

  **What the Procedure Can’t Do:**  
  1. **Detect Ideological Foils:** E.g., "Why Europe and not the Ottoman Empire?" might hide Eurocentrism. Only peer review catches this.  
  2. **Assess Causal Depth:** It verifies *if* a question is askable, not *how well* it’s answered (e.g., "coal caused British industrialization" passes checks but may be oversimplified).  
  3. **Validate Counterfactuals:** It tests foil plausibility, not whether the proposed "what if?" (e.g., "if Song China had coal...") is historically coherent.  

  **Final Word for Your Friend:** This protocol doesn’t kill ambition—it kills *laziness*. Well-posed "why A not B" questions (e.g., "Why Meiji Japan and not Qing China?") survive and thrive. The rest are not history; they’re philosophy puzzles disguised as empirics. Your skepticism doesn’t forbid big questions; it forces them to bear the weight of their own grandeur.  

  Would you like tweaks to the protocol, or a template for author feedback?
