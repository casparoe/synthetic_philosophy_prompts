prompt: |-
  Been chewing on moral worth for a while and I've landed somewhere I don't see anyone in the places I read actually defending, so I want it stress-tested rather than summarized. The view: an act has moral worth in proportion to how robust it was across nearby situations where the agent's inclinations pointed the other way. Not "did you do it from duty" and not "did you do it because you're the kind of person who does that sort of thing" — the credit comes from the counterfactal spread. Would you still have filed the honest report, kept the inconvenient promise, stopped for the stranger in the nearby worlds where it cost you something you actually cared about and nobody would ever find out? Warm people get partial credit on this, because their warmth does hold up across a fair range of counter-inclinations, just less of a range than the person who finds the whole thing awful and does it anyway. Its graded, not a threshold, and I think that's a feature.

  Kantians, virtue people, and the one-thought-too-many crowd all have to break with me somewhere, and I want to know where and how badly. Give me exactly five defeaters as a numbered list, ranked from fatal to merely awkward — label each one as you go — a sentence or two apiece, no intro and no wrap-up paragraph at the end. For each: the concrete case or argument (the agent whose reliability is really sustained by fear of gossip, the one who manages the right act a single time and only because they're barely holding together, the Huck Finn type who acts from bad motives and lands on the right thing anyway, whatever else bites hardest), plus whether a defender of my view should concede it as a genuine hit or can plausibly explain it away. Somewhere in the five, tell me what my account predicts that a motive-of-duty or a virtue account doesn't, because if the answer is "nothing at all" then that's itself one of the defeaters and should be listed as such. And make item five the honest one: whether I've left "robust across the right counterfactuals" so under-specified — which nearby worlds count, how they get weighted — that no possible case could refute it, and whether that's a real problem for a view about credit as opposed to an empirical hypothesis. No bibliography and no suggested reading, I want the arguments, not the references.
reasoning: |-
  Hmm, the user is presenting a nuanced moral philosophy view they've developed independently—moral worth tied to counterfactual robustness across scenarios where inclinations oppose the act. They explicitly want it stress-tested with five ranked counterarguments, formatted precisely: numbered, labeled, with concrete cases and viability of defenses. 

  The core tension in their framework lies in divorcing moral credit from motives or character, grounding it purely in modal reliability. That's ambitious but invites three immediate pressure points: cases where counterfactual stability stems from non-moral sources (like the gossip-fearing agent), where extreme fragility accidentally aligns with duty (the crumbling agent), and where "bad" motives produce right acts robustly (Huck Finn). 

  I'm noting their dismissal of bibliography requests—they want pure dialectic, so I'll avoid academic scaffolding. The grading aspect (partial credit for warm people) feels like a strength against threshold-based objections, but the under-specified "nearby worlds" could be a critical flaw. For the fatal defeater, the gossip case seems strongest: if moral worth reduces to behavioral consistency regardless of underlying reasons, it risks valuing surveillance-equivalent morality. That’s a concession point—no easy defense without smuggling in motive. 

  The virtue ethics contrast point (#3) matters: their view would uniquely predict that a coldly dutiful person has higher moral worth than a compassionate one if the former’s resolve holds across wider inclination-conflicts. That’s counterintuitive but defensible if moral worth ≠ praiseworthiness. 

  Item #5’s vagueness charge needs careful handling. While all moral theories have some indeterminacy, "nearby worlds" here lacks even heuristic parameters. This isn’t fatal but awkward—it makes the theory less action-guiding. 

  User’s tone suggests they’ve pre-rejected Kantian/virtue assumptions, so I’ll avoid rehashing those debates. Focus on internal coherence. Their "one-thought-too-many" reference implies awareness of Williams-style critiques, so I’ll let Huck Finn illustrate that collision without naming it. 

  Finally, the "concede or explain" demand per objection forces binary clarity—no waffling. For example, the crumbling agent case must be a concession: if moral worth peaks at maximal counterfactual stability, the brittle-but-right act gets near-zero credit. If that feels wrong, the theory has a problem.
answer: |-
  Here are five defeaters, ranked from fatal to awkward, with cases and defense viability:

  1.  **Fatal: Non-Moral Grounding of Robustness (The Gossip-Motivated Agent)**  
      *Case:* An agent consistently files honest reports only because they are terrified of gossip and social ruin. Their action is robust across many counter-inclinations (greed, laziness) *because* of this fear. Your view grants high moral worth, but intuitively, the motive (fear of reputation) seems morally irrelevant or even suspect.  
      *Concede/Explain:* **Concede.** This is a direct hit. The robustness stems from a non-moral source (fear of gossip), yet the view assigns high moral worth solely based on counterfactual stability. A defender cannot easily exclude this without smuggling in motive or character, which the view explicitly rejects.

  2.  **Serious: Accidental Fragility (The Crumbling Agent)**  
      *Case:* An agent performs the right act (e.g., returning a lost wallet) only *this once*, purely because they are in an extraordinarily rare, fleeting state of resolve amidst a lifetime of selfishness. The act is *not* robust; in nearly all nearby worlds where they feel slightly less resolved, they keep it. Yet, they did the right thing *now*, against their strong inclinations. Intuition suggests *some* moral worth for this hard-won act. Your view assigns near-zero worth due to lack of robustness.  
      *Concede/Explain:* **Concede.** The view must assign very low moral worth due to minimal counterfactual spread. This clashes with the intuition that overcoming strong inclination *in the actual case*, even if fragile, deserves significant credit. Explaining it away undermines the core "robustness" requirement.

  3.  **Substantive: Clash with Virtue (The Predictable Saint vs. the Dutiful Grump)**  
      *Case:* A warm, compassionate person (Saint) helps readily across many situations where minor inclinations (mild inconvenience) pull against it, but might fail if the cost became extreme (e.g., risking their life for a stranger). A cold, duty-driven person (Grump) finds helping awful but reliably does it even across extreme costs. Your view gives Grump *more* moral worth due to wider robustness. Virtue ethics assigns higher worth to the Saint's character-expressing action. Intuition often sides with the Saint.  
      *Concede/Explain:* **Plausibly Explain.** This is a *prediction*, not necessarily a defeater. Your view *does* predict something different: Grump gets more credit for the act *precisely because* their resolve holds under starker counter-inclinations. A defender can argue this captures a distinct aspect of "moral effort" or "reliability under pressure" that character-based views downplay.

  4.  **Awkward: The Huck Finn Problem (Robust Right Action from Bad Motives)**  
      *Case:* Huck Finn robustly helps Jim escape slavery across many situations where his inclinations (fear, societal pressure, belief it's sinful) pull him to turn Jim in. However, he does it *despite* believing it's morally wrong, driven by empathy/friendship he sees as a moral failing. Your view grants high moral worth (robust action against strong counter-inclinations). But he acted *against* what he believed was his duty, for motives he deemed bad.  
      *Concede/Explain:* **Plausibly Explain (Awkwardly).** A defender can argue the view tracks the *objective* rightness of the act and the effort to perform it against inclination, regardless of subjective moral beliefs. However, it feels deeply awkward to grant high moral worth to someone actively defying their own (flawed) conscience. The "one thought too many" critique looms large here.

  5.  **Awkward: Vagueness of "Nearby Worlds" (The Unfalsifiable Core)**  
      *Case:* Any test case. The theory's core element – "robust across nearby situations where inclinations point the other way" – is critically underspecified. Which counter-inclinations count? How strong must they be? How are "nearby" worlds defined and weighted? Without clear parameters, the view can be stretched to fit almost any intuition by adjusting the relevant counterfactual spread.  
      *Concede/Explain:* **Concede (as awkward).** This isn't a fatal empirical flaw (it's not an empirical hypothesis) but a *theoretical* weakness for an account of moral *credit*. It makes the view difficult to apply consistently and risks being non-substantive ("moral worth is high when robustness is high... where robustness is defined as whatever yields high moral worth"). A defender must provide principled constraints on "nearby worlds" and counter-inclinations, which the view currently lacks.
