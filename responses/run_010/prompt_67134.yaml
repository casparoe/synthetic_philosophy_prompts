prompt: |-
  I am drafting the methods chapter of a dissertation in nineteenth-century intellectual history, and my two readers have given me instructions I cannot both follow. One says that any evaluative verdict I pass on a historical agent is presentism in disguise — that I have substituted my department's standards for the ones in force, and that the resulting judgments belong in a footnote at best. The other says that a history which refuses to call anything wrong is not modest but unintelligible, since my own account of why these episodes are worth studying already depends on evaluations I am not allowed to state. Before I pick a side, I want to know what I would even be asking of one. So: write the specification. I want the desiderata that any account of the historian's evaluative stance toward past agents must meet in order to count as adequate, where adequate means strong enough to be stated in a methods chapter and then actually applied at the desk, case by case, without the historian having to reinvent the principle each time. For each requirement, give the phenomenon, puzzle, or case that motivates it — I want to see why it is a requirement and not just a taste — and mark whether you take it to be non-negotiable or a preference belonging to one camp. No bibliography, no names, no history of the debate; the specification itself is the deliverable, and I will do my own reading afterward.

  To keep the list honest, it has to survive contact with cases like these, which are close to the ones in my chapters. Case one: a physician whose standard practice we now regard as gravely harmful, working at a time when a vocal minority within his own profession had already published objections, and when there is evidence he read them and dismissed them as sentimentality. Case two: a magistrate of the same decade who enforced a statute he privately believed unjust, in a jurisdiction where no organized criticism of that statute existed and where refusal would have cost him his position and his family's security. Any account that returns the same verdict for both, or that returns the verdicts it does merely because criticism "existed" or "did not exist" somewhere in the world at the time, has missed something about the reachability of dissent rather than its existence; I want that something named as a requirement. Beyond those, the account must at minimum handle the fact that the standards of a period are never unanimous and are largely recoverable only through the writings of the people my case two's magistrate was answerable to; the distinction between evaluating an act, evaluating an agent, and evaluating a character; the fact that present-minded historians distribute praise as well as blame, and that the pressure toward exculpation runs in only one of those directions; the reflexivity problem, namely that whatever shields my actors must also yield a verdict about me without assuming that my successors' standards are the correct ones; and the worry that an account anchoring all evaluation in what an agent could have recognized leaves the past normatively inert, unable to correct us in turn. It should also say something about whether the historian's verdict may depend on how things turned out, and about how the account is supposed to be operationalized — what in the archive settles which standards were in force for which people.

  Then do the two things I most want and least expect. First, sort the requirements: which are genuine desiderata that any candidate must satisfy, and which are actually the doctrinal commitments of one side wearing the costume of a criterion — I suspect at least two of the things routinely demanded in this area are of the second kind, and I want to know which. Second, tell me whether any subset is jointly unsatisfiable. If, say, immanence to an agent's recognizable standards, the preservation of genuine criticism, and a non-question-begging account of whose standards count cannot all be had together, say so plainly and say which one should go, because that result would settle my chapter for me better than any choice of camp. Order the requirements by how much exclusionary work each does — which single one knocks out the most positions — and close with a short paragraph on how the main available stances (unrestrained contextualist restraint, unabashed present-minded judgment, a two-tier separation of explanation from evaluation, and a culpability-relative-to-accessible-criticism view) fare against the list. A numbered layout with a negotiability marker on each item is fine; a table is also fine.
reasoning: |-
  Hmm, this is a complex methodological challenge from a doctoral student in 19th-century intellectual history. The user is caught between two advisors with fundamentally opposed views on historical evaluation - one forbidding presentist judgments entirely, the other insisting they're unavoidable. They need a rigorous framework to navigate this tension.

  The core request is for a specification of desiderata that any viable approach to historical evaluation must satisfy. What makes this particularly thorny are the concrete cases they've provided: a physician ignoring contemporary criticism of harmful practices versus a magistrate enforcing unjust laws without accessible dissent. The solution must account for gradations in "reachability of criticism" rather than mere existence.

  Key structural requirements emerge: I need to distinguish non-negotiable methodological constraints from partisan preferences. The framework must handle period-standard heterogeneity, the act/agent/character distinction, bidirectional evaluation asymmetry, reflexivity concerns, and avoid making the past normatively inert. Operationalization in archival research is crucial.

  Most importantly, I must perform two unusual analytical tasks: 1) identify which apparent requirements are actually disguised doctrinal commitments, and 2) test for joint satisfiability of the core principles. The latter could be decisive - if key desiderata conflict, that would resolve their methodological dilemma.

  For the desiderata list, I'm considering about ten items covering epistemic access, normative traction, and operational viability. The physician/magistrate cases will motivate the "reachability" criterion (likely non-negotiable), while the reflexivity problem demands a "non-arbitrary anchor" requirement. The evaluation asymmetry point suggests a "resistance to exculpatory bias" desideratum.

  When sorting requirements, I suspect "unanimous period standards" and "evaluation-free explanation" might be exposed as partisan positions masquerading as neutral criteria. The joint satisfiability test may reveal tension between immanent standards and normative traction - if irreconcilable, the latter should likely yield given their field's epistemological foundations.

  For the final assessment, I'll map the four common stances against the specification. Contextualist restraint may fail normative traction, unabashed presentism will stumble on reflexivity, two-tier approaches often crumble at operationalization, while culpability-relative views struggle with archival viability. The analysis should show why this remains a live debate.
answer: |-
  Here is the specification of desiderata for an adequate account of historical evaluation, ordered by exclusionary power, with negotiability markers and case-motivated justifications. Requirements marked **Non-Negotiable** are foundational to coherent historical practice; those marked **Negotiable** often embed partisan commitments.

  ### Desiderata Specification
  1.  **Archival Operationalization (Non-Negotiable)**  
      *Requirement:* The account must specify what *concrete evidence* in the archive determines: (a) which standards were recognizably "in force" for a specific agent in their context, and (b) the accessibility/reachability of alternative standards or criticisms *for that agent*.  
      *Motivation:* Without this, the account is untestable and collapses into assertion. Case One (physician): Did he *genuinely encounter* the objections? Were they part of professional discourse he was engaged with? Case Two (magistrate): Was criticism truly absent *in sources/material he encountered or was obliged to heed*? Mere existence somewhere isn't enough; demonstrable reachability is key. "Standards" are always contested and context-bound; we need traceable criteria for their application.

  2.  **Distinction Preservation (Non-Negotiable)**  
      *Requirement:* The account must clearly distinguish between evaluating an *act*, evaluating the *agent's judgment/culpability* in performing it, and evaluating the agent's overall *character*. These verdicts need not align.  
      *Motivation:* Case One: The *act* (harmful practice) may be condemnable by our/emerging standards; the *agent's culpability* depends on access to criticism; his *character* is a separate (often unknowable) matter. Case Two: The *act* (enforcing unjust law) may be condemnable; the *agent's culpability* may be low given pressures; his *character* is opaque. Failure here leads to crude moralizing or blanket exoneration.

  3.  **Asymmetry Resistance (Non-Negotiable)**  
      *Requirement:* The account must resist systematic bias towards either exoneration *or* condemnation. It must apply consistently whether the evaluation under consideration is negative (blame) or positive (praise).  
      *Motivation:* Historians readily apply contemporary standards for praise (e.g., "ahead of their time") but balk at blame due to presentism fears. This asymmetry distorts analysis. An account must explain why praising an abolitionist using modern values is permissible *only if* blaming a slaveholder using the same standard is also coherent – or provide a principled reason why not.

  4.  **Reachability over Existence (Non-Negotiable)**  
      *Requirement:* Evaluation of an agent's culpability must depend primarily on the *accessibility and recognizability* of alternative standards or criticisms *to that specific agent in their context*, not merely their existence somewhere in the world or period.  
      *Motivation:* Cases One & Two explicitly demand this. Case One physician: Criticism was *reachable* within his professional sphere; his dismissal matters. Case Two magistrate: Criticism was *unreachable* within his jurisdictional/personal sphere; enforcing despite private belief is less culpable *if* alternatives were genuinely inaccessible. Mere global existence of an idea is irrelevant; local, actionable reachability is key.

  5.  **Reflexivity without Futurity (Non-Negotiable)**  
      *Requirement:* The account's principles must be applicable reflexively to the historian *without* assuming the future correctness of the historian's own standards or those of their successors.  
      *Motivation:* To avoid special pleading. If "only contemporary standards matter" shields past actors, it should also shield the historian from future judgments, undermining the claim that history provides *any* normative insight. Conversely, if the historian claims normative authority, their own standards are vulnerable. The principle must work without assuming its own future invalidation or superiority.

  6.  **Avoiding Normative Inertia (Negotiable - Often Embedded Presentism)**  
      *Requirement:* The account must avoid rendering the past incapable of providing normative *challenge* or *correction* to the present. Past agents must be able to stand in genuine judgment *of us* on some grounds, not just be passive objects of our judgment.  
      *Motivation:* If evaluation is *only* immanent to past contexts, the past loses its power to interrogate present assumptions. A purely contextualist history cannot say "they were right to oppose X, and we are wrong to tolerate it." This is often a *preference* for history having contemporary ethical relevance, mistaking it for a requirement of historical method itself. It *can* be achieved (e.g., via accessible universal standards), but demanding it often smuggles in presentist judgment.

  7.  **Immanence to Recognizable Standards (Negotiable - Strong Contextualist Commitment)**  
      *Requirement:* Evaluation of an agent's culpability must be grounded primarily in standards, values, or criticisms that the agent *could have recognized or accessed* at the time.  
      *Motivation:* Core contextualist argument against presentism. Case Two magistrate: Judging him harshly for not meeting *our* standard of civil disobedience seems unfair if *his* accessible framework offered no coherent justification or support for it. Case One physician: Culpability hinges on him dismissing *recognizable* professional objections. **However,** *requiring* this as the *sole* ground often conflicts with Normative Traction (see 9) and Reflexivity (5).

  8.  **Separation of Explanation & Evaluation (Negotiable - Two-Tier Commitment)**  
      *Requirement:* The core historical task of *explaining* why agents acted as they did must be logically and methodologically separable from the distinct task of *evaluating* the rightness/wrongness or culpability of those actions.  
      *Motivation:* Attempts to avoid presentism while reserving space for ethical reflection. Proponents argue explanation requires understanding context and motives on their own terms, while evaluation can follow different (potentially present-influenced) rules. **However,** critics argue (as per the second reader) that the selection of what to explain ("why study this?") and the framing of the explanation itself inevitably involve evaluation, making strict separation impossible in practice. This is often a *preference* for methodological purity over acknowledging inherent entanglement.

  9.  **Normative Traction (Negotiable - Often Embedded Presentist Commitment)**  
      *Requirement:* The account must allow the historian to make evaluations that have genuine normative force *beyond* merely reporting what past contemporaries thought. "X was wrong" must be assertible as the historian's own considered judgment, not just "Y's contemporaries thought X was wrong."  
      *Motivation:* Second reader's concern. If history cannot call anything genuinely wrong (or right), its relevance for understanding human choices, ethics, and progress/deterioration seems lost. Why study oppression if we can't call it oppression? **However,** this *demand* often conflates historical understanding with contemporary moral judgment. Insisting on it typically requires grounding evaluation outside strict historical immanence, conflicting with (7).

  ### Joint Satisfiability & Exclusionary Power
  *   **Core Conflict:** **Immanence to Recognizable Standards (7)** and **Normative Traction (9)** are **jointly unsatisfiable** in their strong forms within a single coherent account. You cannot *both* anchor culpability *solely* in what the agent could recognize *and* assert transhistorical normative judgments with independent force.
  *   **Which Should Go?** Within the *methodological* framework of professional history seeking to understand the past on its own terms first, **Normative Traction (9) must yield or be radically redefined.** Strong normative traction inherently relies on standards external to the past context, violating the core contextualist/anti-presentist impulse central to much historical practice. **Immanence (7)** provides the crucial link to evidence (Operationalization - 1) and Reachability (4), making it methodologically prior. However, abandoning *any* notion of normative traction risks irrelevance (a concern motivating 6 & 9).
  *   **Exclusionary Power Ranking:**
      1.  **Archival Operationalization (1):** Knocks out vague, purely theoretical, or assertion-based accounts. Mandates concrete historical work.
      2.  **Reachability over Existence (4):** Excludes simplistic "criticism existed = culpable" or "no local criticism = blameless" positions. Demands nuanced contextual analysis.
      3.  **Reflexivity without Futurity (5):** Excludes accounts relying on special pleading for the historian's present. Forces internal consistency.
      4.  **Asymmetry Resistance (3):** Excludes accounts that only apply modern standards selectively (e.g., for praise only).
      5.  **Distinction Preservation (2):** Excludes reductive accounts that collapse act, agent culpability, and character.

  ### How Stances Fare Against the List
  *   **Unrestrained Contextualist Restraint:** Excels at 1, 2, 4, 5, 7. Struggles severely with 6, 9. May struggle with Asymmetry (3) if praise using modern standards is allowed. Rejects 8 (separation) as artificial.
  *   **Unabashed Present-Minded Judgment:** Fails 1 (lack of archival link to past standards), 4 (ignores reachability), 5 (assumes superiority of present/future), 7 (rejects immanence). Excels only at 9 (Traction). Violates Asymmetry (3) only if inconsistent.
  *   **Two-Tier Separation:** Attempts to satisfy 1, 2, 4, 7 (in explanation) while preserving 9 (in evaluation). Critically struggles with 1 & 4 *for the evaluative tier* (what determines *its* standards?) and fails 5 (evaluative tier assumes its own validity). The separation (8) itself is its core, contested commitment. Risk of Asymmetry (3) remains.
  *   **Culpability-Relative-to-Accessible-Criticism:** Directly targets 1, 2, 4, 7. Can satisfy 3 & 5 with care. Struggles with 6 (Normative Challenge) and explicitly rejects strong 9 (Normative Traction). The viability hinges entirely on the rigor of satisfying 1 (Operationalization) – defining "accessible" concretely. It navigates the core conflict by prioritizing Immanence (7) over strong Traction (9).

  **Conclusion for Your Chapter:** The **Culpability-Relative-to-Accessible-Criticism** stance offers the most coherent path through the specification, satisfying the most non-negotiable desiderata (especially 1, 2, 4, 5) while explicitly prioritizing Immanence (7) over strong Normative Traction (9). It directly addresses your physician and magistrate cases via Reachability (4). Its Achilles heel is rigorously operationalizing "accessibility" in the archive (1) – *this* must be the focus of your methodological defense. Acknowledge that this approach limits strong transhistorical condemnation/praise (sacrificing 9) but argue this is the price of methodological rigor and avoiding presentism. Frame its ability to make *nuanced* judgments of culpability based on contextually-recoverable possibilities as its strength and the core contribution of historical understanding.
