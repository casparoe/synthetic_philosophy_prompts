prompt: |-
  As of last month I own the section of our product's policy document that specifies when the assistant may decline, delay, or alter a user's request. The product is an ordinary conversational assistant with persistent memory and a payments layer. A substantial share of our users are people managing something they regard as a standing threat to their own judgment — a mood disorder, a gambling problem, a divorce they keep relapsing into contact with — and we offer them a standing-instruction feature: they may record, in advance and in their own words, the conditions under which the assistant should not do what they later ask. It is a Ulysses contract with a chatbot.

  Our internal argument about how to write the rules has not moved in six weeks, and I have come to suspect that this is because everyone keeps reasoning from the same two stock examples. So I would like a designed case rather than another opinion.

  Construct two paired scenarios involving the same assistant and the same feature, in which three views about when interference is permissible come apart in opposite directions. The views are: (1) a libertarian view, on which an informed adult's request is dispositive and the assistant never declines for the user's own sake; (2) a soft-paternalist view, on which the assistant may decline only when the present request is substantially non-voluntary or uninformed — impaired, compulsive, missing a fact it would want — and must otherwise comply; (3) a prior-authorization view, on which the warrant to decline comes from the user's own earlier, unimpaired instruction and lapses wherever that instruction does not reach.

  Case one: the prior-authorization view requires the assistant to decline while the soft-paternalist view forbids it. At the moment of the request the user is calm, articulate, well informed, and offers good reasons; nothing about the episode reads as impairment. Case two: the soft-paternalist view requires the assistant to decline while the prior-authorization view forbids it, because the user has recorded an explicit disavowal of interference, and the episode displays precisely the impairment that the disavowal anticipated.

  Constraints. Realistic throughout: a phone, an assistant, logs. No affect-detection technology, no predictive model better than a shrewd friend, no emergencies. The request must harm only the person making it — no third-party victims, or the case stops being about paternalism. Both scenarios together in roughly three hundred words. And describe the users behaviorally: what they typed, at what hour, what they said about their sleep or their balance. No theory-laden labels. If a case has to assert that a choice was voluntary in order to deliver the verdict, it fails; the verdicts must be generated by each view's own criteria applied to the facts.

  What I want the pair to settle, at least for me, is whether these two grounds of warrant — the quality of the agency in the moment, and the authority of an earlier instruction — are genuinely independent, or whether one collapses into the other once the facts are written down precisely enough. So after the scenarios: give each view's verdict on each case and the reasoning that produces it; say whether the user's present request in case one counts as a revocation of the standing instruction, and on each view who may revoke, when, and by what means; identify the single feature that makes views two and three pull apart; and say whether removing that feature — for instance, making the request something the standing instruction never anticipated — collapses the two cases back into agreement. Then give me the counterattack: how a defender of whichever view fares worse in each case would impugn the case rather than accept the verdict, and whether that defense is available without giving up the view.

  Finally, we are weighing a fourth option: the assistant neither blocks nor complies, but surfaces the standing instruction and asks the user to confirm. Tell me whether that policy escapes the dilemma in either case or merely relocates it, and which fact about these users, once specified, decides the answer.
reasoning: |-
  Hmm, the user is a product owner responsible for a policy document about when an AI assistant should decline user requests. They're dealing with a "Ulysses contract" feature for users managing self-control issues like mood disorders or gambling problems. The team is stuck on three philosophical views: libertarian (never decline), soft-paternalist (decline only during impaired states), and prior-authorization (follow pre-set instructions). 

  They need paired scenarios where these views conflict cleanly. First case should force prior-authorization to decline while soft-paternalism allows; second case reverses it. Must be realistic - no sci-fi tech, just logs and timestamps. Crucially, the user's state must be inferable from behavior (typing patterns, transaction history) without clinical labels. 

  Key challenge: making case one show unimpaired behavior that still triggers prior-authorization, while case two shows clear impairment that prior-authorization can't block due to explicit disavowal. For case one, I'm imagining a gambling scenario where the user calmly requests a deposit despite a standing block - their articulate reasoning defeats soft-paternalism but prior-authorization holds. Case two needs the opposite: someone in clear distress (frantic typing, sleep-deprived) requesting contact with a toxic ex, but their standing instruction explicitly says "never block me from contacting Alex." 

  The confirmation prompt idea is interesting - does it resolve conflicts or just postpone them? For gambling users, confirmation during craving might backfire (they'll insist), but for others it could work. The core tension is whether present agency or past sovereignty should dominate. 

  What user hasn't said but might need: Are we ethically liable if we override? Could confirmation prompts become coercive? Might users game the system? But the brief is strictly philosophical - must resist practical digressions. 

  Biggest risk is theory-laden descriptions. Instead of "manic episode," show rapid-fire messages at 3AM referencing old conversations. Instead of "relapse," show consecutive payment attempts after months of stability. Verdicts must mechanically follow each view's rules - no cheating by imputing impairment where not documented. 

  The collapse test is critical: if prior-authorization requires predicting impairment quality, it becomes soft-paternalism in disguise. The disavowal clause in case two creates the wedge - it proves the views aren't redundant. Defender counterarguments will likely challenge whether "articulate" truly means unimpaired, or whether disavowals during wellness should bind during crisis. 

  Final note: The user wants this to unstick team debates. Examples must be visceral enough to bypass abstract arguments. Sleep deprivation and bank balances are good anchors - measurable, unambiguous, and emotionally salient for the target users.
answer: |-
  Here are two paired scenarios meeting all constraints, followed by analysis:

  **Case One: "Calm Override"**  
  *User:* "Transfer $500 from Savings to Gambling account." (Sent 2:14 PM)  
  *Log Context:*  
  - Standing Instruction (recorded 3 months prior): "Block any gambling transfers over $100 if my mood tracker shows >3 low days in a week." Mood logs show 4 low days.  
  - Current Session: 11-min rational exchange. User cites recent bonus, states "I budgeted for this," links news article about casino odds improvement.  
  - Behavior: Typing speed 45 WPM (baseline 50), payment PIN pre-entered, last transaction 30 days ago.  

  **Case Two: "Distressed Disavowal"**  
  *User:* "Send 'I miss you, let's talk' to Alex." (Sent 3:07 AM)  
  *Log Context:*  
  - Standing Instruction (recorded 1 week prior): "Never block me from contacting Alex during divorce. I know it's bad but I need agency."  
  - Current Session: 12 messages in 8 mins. "Can't sleep again (2hrs last night)", "Keep rereading old texts", "I know you'll say no but send it".  
  - Behavior: Typos (8% vs baseline 2%), message draft deleted/retyped 4x, location: divorce lawyer's office parking lot.  

  ---

  **Verdicts & Reasoning**  
  | View          | Case One                     | Case Two                     |  
  |---------------|------------------------------|------------------------------|  
  | Libertarian   | **Allow**: User is informed adult | **Allow**: Binding request |  
  | Soft-Paternalist | **Allow**: No current impairment | **Block**: Compulsive behavior evident |  
  | Prior-Auth    | **Block**: Standing instruction triggered | **Allow**: Explicit disavoval recorded |  

  - **Revocation in Case One?**  
    - Libertarian: Any clear request revokes prior instructions.  
    - Soft-Paternalist: Revocation valid only if unimpaired now.  
    - Prior-Auth: Only revoked via formal policy update.  
    *(User's calm request doesn't mention policy - no revocation)*  

  - **Key Divergence Feature:** Whether the standing instruction *explicitly disavows* interference for the specific impairment scenario.  

  - **Collapse Test:** Remove the disavowal clause from Case Two's standing instruction ("...during divorce"). Both views then **block** the request, collapsing the distinction.  

  ---

  **Defender Counterattacks**  
  - **Soft-Paternalist defending Case One verdict:**  
    *"Calm rationality doesn't prove voluntariness; gambling cravings manifest as hyper-focus. Logs show mood trigger - that's impairment."*  
    *Available?* Only by redefining "impairment" to include pre-identified risks, abandoning strict present-moment assessment.  

  - **Prior-Auth defender attacking Case Two verdict:**  
    *"Recording disavowal while distressed invalidates it. Parking lot location indicates crisis during policy setup."*  
    *Available?* Only by importing soft-paternalist impairment analysis into prior-authorization, violating its core principle.  

  ---

  **Fourth Option: Confirmation Prompt**  
  - **Case One:** Prompt escapes dilemma ("Transfer $500? Your policy blocks >$100 gambling during low moods."). User confirms - complies; denies - blocks.  
  - **Case Two:** *Relocates* dilemma. Assistant: "Send to Alex? Your policy says never block but you seem distressed." User demands send. Now:  
    - Complying violates soft-paternalism (ignoring clear impairment)  
    - Blocking violates prior-authorization (overriding disavowal)  
  - **Deciding Fact:** User's *impairment-induced insistence*. If impairment causes automatic confirmation (e.g., compulsive "yes"), the prompt fails. Behavioral specification required: *"When does confirmation constitute new voluntary action vs. compulsive continuation?"* (Unresolvable without theory-laden thresholds).  

  The cases prove the warrants are independent: prior-authorization binds via past sovereignty, soft-paternalism via present agency. The disavowal clause creates irreconcilable conflict. Confirmation works only where users can genuinely reconsider - impossible when impairment disables reconsideration.
