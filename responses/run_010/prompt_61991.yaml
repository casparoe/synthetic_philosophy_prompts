  Hmm, the user runs a "learning from events" function at a large hospital, conducting post-incident interviews with clinicians after serious safety events. They're concerned about the reliability of clinicians' self-reports regarding their mental states during critical moments. They recognize that people often confabulate reasons for their actions without realizing it, citing psychological research like Nisbett and Wilson on introspection limitations.

  The user wants a practical protocol their two-person team can implement without psychology training. They need specific components: a classification system for different types of self-reports, evaluation of question formats that might induce confabulation, rewrites of common questions, explicit stopping points for when information can't be determined, guidelines for handling their own impressions during interviews, and philosophical underpinnings of the approach.

  For implementation, they want to see the protocol applied to three realistic cases: a nurse with contradictory memory reports, a fatigued resident with corroborating evidence, and an attending physician where mental state is the critical issue. They also want transparency about where professional judgment is being framed as method.

  This is a sophisticated request showing deep understanding of cognitive psychology limitations in high-stakes environments. The user recognizes their current approach may be legally vulnerable and wants to maintain integrity while facing pressure from review panels and regulators. The unspoken needs include protecting clinicians from unfair blame while ensuring accurate system learning, plus defending their methodology legally when conclusions are inconclusive.

  The protocol should balance scientific rigor with practical constraints. The classification system should distinguish between types of mental states that vary in reliability - like direct sensory experiences versus reconstructions of reasoning. Question formats need careful analysis to avoid leading questions that invite confabulation. The rewrites should convert "why" questions into "what" questions that focus on observable evidence.

  Stopping points must be explicit and legally defensible - phrases like "no corroborating evidence available" rather than hedging. For the investigator's impressions, we should acknowledge they're similarly fallible introspections. The philosophical appendix should acknowledge bets like whether we have privileged access to current conscious states.

  In the case applications: the nurse's detailed recall would get low weight due to memory decay and prior contradiction; the resident's fatigue claim would be medium weight with roster corroboration; the attending's unreported diagnostic considerations would hit a stopping point. The report should state the limitation plainly - that self-reports of unverbalized thoughts are unreliable without evidence.

  Throughout, we should flag where judgment is dressed as method - like assigning credibility weights or categorizing statement types. Transparency about these judgment points makes the protocol more defensible than pretending to pure objectivity.
answer: |-
  Here is a protocol grounded in cognitive psychology's critique of naive introspection, designed for practical application by your team. It focuses on evidential weight, explicit limitations, and minimizing confabulation risk.

  **Protocol: Evidentiary Weighting of Clinician Self-Reports (EWCSR Protocol)**

  **Core Principle:** Treat self-reports of internal states not as direct observations, but as *data points requiring evidentiary grading*. Reliability varies dramatically depending on the *type* of mental state reported and the *question format* used to elicit it.

  **1. Classification of Self-Report Statements & Sorting Rules:**

  *   **A. Sensory Input / Noticed Features (Weight Baseline: 0.6)**
      *   *Definition:* Reports of specific, discrete sensory data perceived in the environment *at the time*. ("I saw the red warning pop-up," "I heard the high-pitched alarm," "I smelled ammonia," "I felt the radial pulse was weak").
      *   *Sorting Rule:* Does it describe a *specific, concrete, external stimulus* perceived through the senses? Focus is on *what was registered*, not interpretation.
  *   **B. Occurrent Conscious Experience (Weight Baseline: 0.5)**
      *   *Definition:* Reports of immediate, felt, conscious states *at the time*: emotions (frustration, anxiety), sensations (pain, dizziness), or simple, present-tense cognitive states ("I am confused," "This doesn't make sense," "I feel shaky").
      *   *Sorting Rule:* Is it describing a *felt, qualitative state* experienced *in the moment*? Avoids complex reasoning or motives. Present-tense phrasing in the report is a clue.
  *   **C. Attentional Focus / Salience (Weight Baseline: 0.4)**
      *   *Definition:* Reports of *what was currently occupying their conscious attention* or what *stood out* in their perception ("I was focused on the BP reading," "The low SpO2 alarmed me," "I didn't notice the second tab open").
      *   *Sorting Rule:* Does it describe *where their mental spotlight was directed* or what *captured their attention*? Distinguish from what was merely *available* (Sensory Input).
  *   **D. Declared Intent / Action Goal (Weight Baseline: 0.7)**
      *   *Definition:* Reports of the *immediate goal or purpose* guiding a *specific, observable action* taken *at the time* ("I pressed 'Override' to give the antibiotic quickly," "I called the rapid response because I thought he was crashing").
      *   *Sorting Rule:* Is it stating the *intended outcome* of a *specific, documented action*? Must be tightly linked to an observable act.
  *   **E. Reason / Decision Process Reconstruction (Weight Baseline: 0.2)**
      *   *Definition:* Reports explaining *why* a decision was made, judgment formed, or action taken, involving recall of reasoning steps, weighing of factors, or consideration of alternatives ("I chose drug X because I thought Y," "I dismissed the alert because Z," "I didn't consider diagnosis A because B").
      *   *Sorting Rule:* Does it attempt to *explain the cause or justification* for a judgment, decision, or non-observable cognitive process? Involves past-tense reconstruction.
  *   **F. Retrospective Confidence/Certainty (Weight Baseline: 0.3)**
      *   *Definition:* Reports estimating their *level of confidence or certainty* about a judgment or decision *at the time of the event* ("I was very sure it was sepsis," "I felt uncertain about the dose").
      *   *Sorting Rule:* Is it a *retrospective judgment* about the *strength of a past belief or feeling*?
  *   **G. Retrospective Impairment/Fatigue (Weight Baseline: 0.4)**
      *   *Definition:* Reports estimating their *level of fatigue, stress, or cognitive impairment* ("I was exhausted," "I was really stressed," "My thinking was foggy").
      *   *Sorting Rule:* Is it a *retrospective summary judgment* about their *overall state*? Distinguish from occurrent feelings (B).

  *   **Why these joints?** This prioritizes direct perception (A, B) and simple goal declarations tied to actions (D) over complex cognitive reconstructions (E, F, G) which are highly susceptible to confabulation and memory biases. Attentional focus (C) is intermediate but prone to error.

  **2. Triage of Question Formats & Credence Weights:**

  | Question Format                     | Confabulation Risk | Baseline Credence Weight | Corroboration Needed to Raise Weight (towards 1.0)                                                                 | Recommended Action                     |
  | :---------------------------------- | :----------------- | :----------------------- | :------------------------------------------------------------------------------------------------------------------ | :------------------------------------- |
  | **Open "What":** "What did you see on the screen?" "What did you do next?" | Low                | 0.8                      | Consistency with log data, other witnesses, physical evidence.                                                      | **USE PRIMARILY**                      |
  | **Open "Where/When":** "Where was your attention?" "When did you first notice X?" | Medium             | 0.6                      | Timeline alignment, corroboration of attention focus by system logs (e.g., cursor position) or witnesses.            | Use frequently                         |
  | **Open "Describe":** "Describe what happened from your perspective." | Medium             | 0.7 (for A,B,C,D); 0.3 (E,F,G) | Consistency within narrative & with evidence. Higher weight for concrete details, lower for explanations.           | Use at start                           |
  | **Specific Probe (Sensory/Goal):** "Did you see the second allergy warning?" "Was giving the drug quickly your immediate goal?" | Low-Medium         | 0.7 (if Yes/No clear)    | Log data (e.g., warning display time, override reason logged), witness to stated goal.                              | Use for key A/D items                  |
  | **"Why" / Reason Probe:** "Why did you choose X?" "Why didn't you consider Y?" | **VERY HIGH**      | **0.2**                  | **Independent evidence of stated reasoning:** *Prior* documentation of similar reasoning, *contemporaneous* note/comment to colleague about *that specific reason*, protocol/policy explicitly citing that reason as required. | **STOP ASKING. Replace with:** "What factors were present when you made the choice about X?" or "What information did you have available when deciding about Y?" |
  | **Confidence/Fatigue Probe:** "How confident were you?" "How tired were you feeling?" | High               | 0.3 (F); 0.4 (G)         | **Strong, specific contemporaneous evidence:** Text/email/note *from the time* mentioning low confidence/fatigue *specifically relevant to the event*, objective physiological markers (rare). Roster/Workload data supports *opportunity* for fatigue but doesn't confirm *subjective state*. | Use sparingly, accept low weight.      |
  | **Hypothetical:** "What would you normally do?" "Should you have...?" | Extremely High     | 0.1 (for event relevance) | N/A - Focuses on norms/generalizations, not the event.                                                              | **AVOID FOR EVENT ANALYSIS**           |

  *   **Key Rewrite:** **Stop asking "Why?" about reasoning/judgment.** Replace with "What?" questions focused on observable context and information availability. "Why" forces a causal narrative the clinician likely didn't have fully formed at the time and must confabulate.

  **3. Rewrites of Common Questions:**

  1.  **Original:** "Why did you administer the medication via that line?"
      **Rewrite:** "What information did you have about the lines when you prepared to administer the medication?"
      **Purpose:** Shifts from reconstructing reasoning to recalling available information/sensory input (A).

  2.  **Original:** "Why didn't you recognize the patient was deteriorating sooner?"
      **Rewrite:** "What vital signs or patient cues were you aware of during the [time period] before the event?"
      **Purpose:** Focuses on attentional focus (C) and sensory input (A), not retrospective judgment of failure.

  3.  **Original:** "How confident were you in that diagnosis?"
      **Rewrite:** "What findings led you toward that diagnosis at the time?" (If Occurrent Experience is reported spontaneously: "Can you describe how certain you felt about it then?")
      **Purpose:** Prioritizes evidence base (A/C) over retrospective confidence rating (F). If occurrent feeling (B) is volunteered, it can be noted with appropriate weight.

  4.  **Original:** "Didn't you see the second allergy alert?"
      **Rewrite:** "What alerts or warnings were displayed on the screen when you processed the medication order?"
      **Purpose:** Less leading, broader recall of sensory input (A), allows for "I don't recall" without implying guilt.

  5.  **Original:** "Why did you disable the alarm?"
      **Rewrite:** "What was happening that led you to take the action of disabling the alarm?" followed by "What was your immediate goal in disabling it?"
      **Purpose:** Separates context (potentially A/C) from declared action goal (D). Avoids "why" for reasoning (E).

  6.  **Original:** "Do you think fatigue played a role?"
      **Rewrite:** "Can you describe how you were feeling physically and mentally during your shift leading up to the event?"
      **Purpose:** Open-ended, allows reporting of occurrent experience (B) or retrospective impairment (G) without leading to a causal conclusion.

  7.  **Original:** "What were you thinking when you made that decision?"
      **Rewrite:** "What information were you focusing on at the moment you finalized that decision?"
      **Purpose:** Focuses on attentional focus (C) and information present (A), not full thought process reconstruction (E).

  8.  **Original:** "Should you have called for help earlier?"
      **Rewrite:** "At what point did you recognize the need to call for help, and what specific change prompted that?"
      **Purpose:** Focuses on timeline and observable trigger (A/C/D), avoids normative judgment.

  **4. Explicit Stopping Points & Report Phrasing:**

  *   **Stopping Point 1: Uncorroborated Reasoning/Decision Process (E):** When the *only* evidence for a specific reason, cognitive process, or consideration/rejection of an alternative is the clinician's retrospective self-report (E).
      *   **Report Phrasing:** "The clinician stated [quote specific reason/consideration]. There is no contemporaneous documentation or independent corroboration (e.g., witness, system log) available to confirm the clinician's reported reasoning process or the specific consideration of alternatives at the time of the event. Therefore, the investigation cannot independently verify the specific cognitive processes described."

  *   **Stopping Point 2: Uncorroborated Retrospective Confidence/Fatigue (F/G):** When the *only* evidence for the *specific level* of confidence or fatigue *at the exact time* is the retrospective report, lacking contemporaneous evidence.
      *   **Report Phrasing (Confidence):** "The clinician retrospectively reported feeling [e.g., 'very uncertain'] about [specific decision]. No contemporaneous expression of this specific level of uncertainty regarding this decision was documented or reported by others. Objective workload data [mention if applicable, e.g., high patient load] indicates potential stressor(s), but does not specifically corroborate the reported subjective state of confidence at the critical moment."
      *   **Report Phrasing (Fatigue):** "The clinician retrospectively reported feeling [e.g., 'exhausted'] at the time. The work schedule confirms [state schedule facts, e.g., consecutive night shifts]. However, no contemporaneous record or witness statement specifically corroborates the clinician's reported subjective state of fatigue *at the precise time of the event*."

  *   **Stopping Point 3: Contradiction Between Self-Reports:** When significant, event-relevant details in the formal interview contradict prior statements (e.g., to colleague, initial brief report) without plausible explanation or corroboration favoring one account.
      *   **Report Phrasing:** "The clinician's account during this interview regarding [specific detail] differs from their statement to [Colleague/Role] on [Date] that [quote prior statement]. The investigation found no corroborating evidence resolving this discrepancy. Therefore, [specific detail] remains unclear."

  **5. Reflexivity Clause: Weighting the Investigator's "Read"**

  *   **Weight:** Low (Baseline 0.3). Your sense of confabulation ("inventing on the spot") is itself a complex judgment (E) about another's internal state, prone to bias (e.g., demeanor bias, expectations).
  *   **Corroboration Needed:** This judgment gains weight **only if**:
      1.  **Internal Inconsistency:** The clinician contradicts *themselves* within the *same interview* on a key, concrete detail (A, C, D).
      2.  **External Contradiction:** The account contradicts *highly reliable, objective evidence* (e.g., timestamped log showing action X, but clinician vividly describes doing Y at that time).
      3.  **Verifiable Evasion:** The clinician avoids concrete questions about sensory input/actions (A/D) with vague or shifting answers, *and* this pattern is noted independently by both interviewers.
  *   **Protocol Application:** Your "read" is *not* direct evidence about the *event*. It's a low-weight signal (E) prompting *you* to look harder for corroboration or contradiction of *specific, concrete statements* (A, C, D) made during the interview. Note the *specific behavior* (e.g., "Clinician gave inconsistent answers regarding which alarm was sounding") rather than the inference ("Clinician was confabulating").

  **6. Appendix: Philosophical Bets & Protocol Vulnerabilities**

  1.  **Bet:** Introspection is largely self-interpretation using folk psychology, not direct perception. We have poor access to the causes of our judgments/behaviors (Nisbett & Wilson).
      *   **Break if Wrong:** If privileged access to reasons is robust, our low weighting of Reason/Decision reports (E) and banning of "Why" questions is overly skeptical, hindering valuable insight. The protocol would discard accurate data.
  2.  **Bet:** Privileged access is stronger for *occurrent conscious states* (B - feelings, simple thoughts) than for *dispositions* (F/G - confidence, fatigue levels) or *reconstructions* (E).
      *   **Break if Wrong:** If we are equally poor at reporting current feelings as we are at explaining reasons, weighting B higher than F/G/E is unjustified. The protocol might overvalue potentially unreliable emotional reports.
  3.  **Bet:** The "Transparency" model (accessing beliefs by looking outwards) holds more reliably for *current, action-guiding beliefs* linked to Declared Intent (D) than for complex webs of belief underlying diagnoses or judgments.
      *   **Break if Wrong:** If stated intentions are as confabulated as reasons, weighting D relatively highly is misplaced. The protocol might trust stated goals that are post-hoc justifications.
  4.  **Bet:** Sensory/Perceptual reports (A) and simple action goals (D) are anchored more in external reality and memory for events, making them less susceptible to pure confabulation than internal state reports (E, F, G), though still fallible.
      *   **Break if Wrong:** If perception and action memory are as reconstructive and biased as reasoning, the entire protocol's foundational weighting (A/D highest) crumbles. The protocol becomes overly skeptical across the board.

  ---

  **Protocol Application to Cases:**

  **Case 1: The Confident, Articulate Nurse (Drug Admin)**
  *   **Statements:** Detailed minute-by-minute account of actions (D - high weight, 0.7+ if aligns with MAR/other evidence) and reasoning (E - low weight, 0.2). Coherent narrative overall.
  *   **Key Contradiction:** Prior statement: "Could not remember which line" (concrete detail, A/C/D). Current account: Specific line choice with reasons (E).
  *   **Analysis:** Her sensory/action memory (which line - A/D) is directly contradicted by a contemporaneous report. Her current detailed reasoning (E) about *why* she chose that line is inherently low weight and undermined by the contradiction on the basic fact. The coherence is likely post-hoc reconstruction fitting known facts.
  *   **Protocol Action:**
      *   **Stopping Point 3 Applied:** "The nurse provided a detailed account of line selection during the interview. However, on [Date of event], she informed [Colleague] that she 'could not remember which line' she had used. No evidence (e.g., line labeling practice audit, witness observation) corroborates either specific account of line selection. Therefore, the specific line used and the reasoning described for its selection during the interview cannot be independently verified."
      *   **Report Entry:** Use "Stopping Point 3" phrasing above. Do *not* report her specific reasoning for line choice as fact. Report her *actions* (drug administered) and the *outcome* (error), noting the unresolved contradiction on the specific line used. Weight for her sensory input (what she saw on labels) is reduced due to contradiction.

  **Case 2: The Fatigued Resident (Missed Finding)**
  *   **Statement:** "I was exhausted and that's why I missed it." (Combines G - Retrospective Impairment & E - Reason Attribution).
  *   **Corroboration:** Roster confirms consecutive night shifts (Objective workload/stressor).
  *   **Analysis:** The *reason attribution* ("that's why I missed it" - E) is low weight (0.2). The *retrospective fatigue report* (G) has baseline weight 0.4. The roster corroborates the *opportunity* for significant fatigue (raises weight for G to ~0.6), but does *not* corroborate the *specific subjective state at the critical moment* or prove it caused the error. "Missing the finding" is the error itself, not independent evidence.
  *   **Protocol Action:**
      *   **Stopping Point 2 Applied (Fatigue):** "The resident reported feeling exhausted at the time of missing the finding. The work schedule confirms they had worked two consecutive night shifts prior to the event. However, no contemporaneous record or witness statement specifically corroborates the resident's reported subjective state of exhaustion *at the precise time the finding was overlooked*. Therefore, while significant fatigue was possible given the schedule, the investigation cannot independently verify the reported level of exhaustion at the critical moment or establish it as the sole cause of the error."
      *   **Report Entry:** Use "Stopping Point 2 (Fatigue)" phrasing. Focus the analysis on *why the finding was missable* (e.g., display issues, cognitive workload, training gaps) rather than solely attributing it to the resident's fatigue. The roster data supports examining system mitigations for fatigue risk.

  **Case 3: The Attending (Unreported Diagnostic Consideration)**
  *   **Central Question:** Did he consider and reject the correct diagnosis (Dx) at the time?
  *   **Evidence:** Attending's self-report: "No, I didn't consider Dx at all." (Report of non-consideration - E). *No* documentation, *no* colleagues present, plaintiff involved.
  *   **Analysis:** This is a pure Reason/Decision Process report (E), specifically a report of a *non-event* (not considering something). Baseline weight is very low (0.2). There is *zero* corroboration. It's impossible to reliably verify the absence of a thought retrospectively. He may sincerely believe it, or he may be minimizing culpability.
  *   **Protocol Action:**
      *   **Stopping Point 1 Applied (Forcefully):** "The attending physician stated that he did not consider [Specific Diagnosis] at the time of his initial assessment. There is no contemporaneous documentation, communication with colleagues, or other independent evidence available to confirm or refute whether [Specific Diagnosis] was actively considered or rejected during the physician's cognitive process at the time. Therefore, the investigation **cannot determine whether or not [Specific Diagnosis] was considered by the attending physician prior to the event.**"
  *   **Report Content & Justification:**
      *   **What the Report Contains:** The factual statement of *what he said*. The explicit statement (above) that his reported cognitive process cannot be verified. A focus on *system* factors: Why wasn't Dx flagged by protocols/decision support? Was information clear? Were there barriers to seeking consultation? Was differential diagnosis process followed?
      *   **Honest Justification for Withholding Judgment:** "Human memory for internal cognitive processes, especially concerning what was *not* thought about, is fundamentally unreliable and highly susceptible to reconstruction and bias, particularly in hindsight and under scrutiny. There is no known method to objectively verify such retrospective reports of unverbalized thoughts without contemporaneous evidence. Reporting an unverifiable claim about internal cognition as fact would be misleading and potentially unjust, failing to meet the standard of evidence required for a fair and accurate safety review. Our focus must shift to verifiable system factors to prevent recurrence." (**This is crucial context for the panel/family**).

  ---

  **Marked Judgments Wearing the Costume of Method (Embrace These):**

  1.  **Assignment of Baseline Weights (0.2 - 0.8):** These numbers are informed estimates based on psychological literature, not precise measurements. The key is the *relative ordering* (A/D > B/C > F/G > E) and the *recognition* that weights are starting points, not absolutes.
  2.  **Categorizing Statements (A-G):** Deciding if a statement is "Sensory Input" (A) or "Attentional Focus" (C) involves interpretation. The rules help, but borderline cases require judgment.
  3.  **Assessing Corroboration Quality:** Deciding *how much* roster data raises the fatigue weight (Is 2 nights + self-report 0.6 or 0.55?) is judgment. The protocol demands we *state* the corroboration used and its *type* (e.g., "supports opportunity, not specific state").
  4.  **Applying Stopping Points:** Deciding when a contradiction is "significant" (Stopping Point 3) or whether alternative corroboration exists requires judgment. The protocol forces explicit *reporting* of the lack of corroboration.
  5.  **"Read of the Room" as Signal:** Deciding if an inconsistency is "key" or evasion is "verifiable" for Reflexivity Corroboration is judgment. The protocol limits its use to triggering *further scrutiny of concrete details*.
  6.  **Philosophical Bets:** Choosing which cognitive models to base the protocol on is a fundamental judgment. The protocol openly states them and their risks.

  This protocol replaces naive trust in recollection with structured skepticism, focuses on verifiable data, forces transparency about limitations, and redirects energy towards systemic fixes rather than unverifiable cognitive autopsies. It provides defensible language for uncomfortable conclusions.
