  Let's design the assessment.

  ### The Question

  **Question:**

  **Take-Home Assessment: Natural Kinds in the ARP Case**

  **Time Allowed:** 72 hours (unproctored)  
  **Word Limit:** 2,500 words  

  **Instructions:**  
  Write an essay addressing the following case and questions. Your essay must be self-contained: you are expected to draw on the concepts and accounts discussed in the course, but no particular secondary literature is required. Your argument should be clear, structured, and focused on the case at hand.

  **The Case:**  
  Researchers working in seasonally waterlogged, arsenic-rich paddy soils have isolated a set of bacterial organisms that share a tight cluster of properties: a distinctive membrane lipid profile, anaerobic arsenate reduction, a shared repertoire of stress-response proteins, and a characteristic colony morphology. For convenience, call this the ARP cluster. (Everything stipulated here is for expository purposes; ARP is not a real taxon, and no claim is being made about any actual organism.)

  The clustering is not accidental. Two mechanisms maintain it. First, all members occupy the same microhabitat, and that environment selects for the cluster. Second, and more consequentially, the organisms exchange genetic material promiscuously with one another by horizontal transfer, and the transferred material is precisely what carries the clustered properties: the properties co-occur because they travel together.

  Now the complication. The same transfer mechanism does not respect the cluster's boundaries. The mobile elements carrying arsenate reduction move readily into organisms outside ARP — organisms with different lipid profiles and different morphology that happen to share the habitat — and those recipients acquire the property without acquiring the rest of the cluster. Conversely, some organisms that match ARP in every morphological and lipid respect have lost the arsenate determinants entirely. Phylogenetic reconstruction from a conserved marker gene yields a tree that cross-cuts the phenotypic cluster; ARP members are not each other's closest relatives. The mechanism that holds the cluster together is therefore also the mechanism that leaks it, and there is no threshold of transfer frequency at which the leakage stops.

  One member of the research group proposes, in response, that ARP membership should be fixed not by any set of shared properties but by a *transfer profile*: an organism belongs to the kind insofar as it stands in relations of sufficiently frequent genetic exchange with the others, where "sufficiently frequent" is calibrated by how well the resulting partition predicts which organisms will acquire arsenate resistance under a specified selection regime. On this proposal, the boundaries of the kind are explicitly vague and explicitly interest-relative, and the kind is said to be no less natural for that.

  **Your Tasks:**  
  1. **Verdict and Defense:** Decide whether the ARP cluster constitutes a natural kind. Defend your verdict by engaging with at least two accounts of natural kinds covered in the course (e.g., microstructural essentialism, cluster-plus-mechanism accounts, deflationary or pragmatic accounts, etc.). Your defense must explicitly address the central tension in the case: that the mechanism (horizontal gene transfer) that maintains the cluster of properties is also the same mechanism that causes the cluster to be "leaky" (i.e., the mechanism does not respect the cluster boundaries and leads to indeterminacy in kind membership).  

  2. **Evaluation of the Transfer-Profile Proposal:** Assess the research group member's proposal to define ARP by a transfer profile. Specifically:  
     a) Is the kind defined by this proposal (which has vague and interest-relative boundaries) a joint in nature or a well-engineered instrument?  
     b) Does the difference between these two options (joint vs. instrument) matter for the realism that the research group claims (i.e., that the kind is "no less natural" for being vague and interest-relative)?  

  In your essay, avoid two easy exits: (i) simply declaring ARP a pragmatic taxonomic convenience without engaging the metaphysical question, and (ii) declaring the question of whether ARP is a natural kind as ill-posed. You must explain why these exits are inadequate. Also, be sure to address the significance of the cross-cutting phylogeny: why does the fact that the marker-gene tree cross-cuts the phenotypic cluster not straightforwardly vindicate a common-ancestry account of natural kinds?  

  ---

  ### Model Answer (900-1,100 words)

  **Verdict:** The ARP cluster is not a natural kind on traditional accounts (e.g., microstructural essentialism or cluster-plus-mechanism), but the transfer-profile proposal does yield a natural kind of a pragmatic-realist variety. However, this kind is not a joint in nature in the classic sense but rather a well-engineered instrument that tracks a real pattern of interaction and evolutionary potential. The difference matters for the realism claimed: it is a form of realism, but one that is grounded in the structure of the processes rather than in intrinsic properties.

  **Argument Outline:**

  1. **Introduction:** The ARP case presents a challenge because the mechanisms that create the cluster also disrupt it. We must resist the easy exits: (a) calling it merely pragmatic (because the mechanisms are real and the cluster is maintained, so there is a real pattern) and (b) calling the question ill-posed (because the accounts we have can be applied and yield insights).

  2. **Against Microstructural Essentialism:** Essentialism requires a shared intrinsic property (e.g., genetic essence) that is necessary and sufficient for kind membership. But the leakiness shows no such essence: the arsenate reduction trait transfers independently, and the marker gene tree cross-cuts the cluster. Thus, ARP fails essentialism. However, note that the phylogeny does not vindicate common ancestry because horizontal transfer disrupts the tree: the conserved marker gene does not track the traits because of the same transfer mechanism. So common ancestry as a basis for kindhood is also undermined.

  3. **Against Cluster-Plus-Mechanism:** Boyd's account requires a cluster of properties maintained by a homeostatic mechanism. The mechanism here (horizontal transfer and selection) does maintain a cluster, but it also leaks, causing boundary indeterminacy. The leakiness is not a failure of the mechanism but part of its nature. Therefore, the cluster is not stable enough to form a kind. The mechanism does not guarantee the co-occurrence of properties because they can be acquired or lost independently. This account fails for ARP.

  4. **The Transfer-Profile Proposal:** This defines the kind by a relational property (transfer frequency) calibrated by predictive success. This kind is vague and interest-relative. Is it natural? It tracks a real process (horizontal transfer) that is causally significant. But it is not a joint in nature (like chemical elements) because its boundaries are not fixed by nature independently of our interests. Instead, it is an instrument that carves nature at a real but diffuse seam. The realism claimed is defensible: the kind captures a real network of genetic exchange that affects evolutionary trajectories. It is not arbitrary because the calibration is tied to a real selection regime.

  5. **Why the Easy Exits Fail:**  
     - *Pragmatic exit:* To call ARP merely pragmatic ignores that the transfer mechanism is a real causal process that structures the microbial world. The kind is not just a convenient grouping; it reflects a real dynamic.  
     - *Ill-posed exit:* The question is not ill-posed because we can apply the accounts and see where they break down, leading to a positive proposal (transfer profile) that might extend the concept of natural kinds.

  6. **Conclusion:** ARP is not a natural kind on traditional metaphysical accounts, but the transfer-profile kind is a legitimate extension of the concept that serves a realist function in scientific practice. It is an instrument, but one that is grounded in the natural structure of microbial evolution.

  (Word count: ~1000)

  ---

  ### Marking Scheme (out of 25)

  The essay will be assessed on five must-hit points, each worth 5 marks. The total is 25. Each point is awarded based on the quality of the argumentative move, regardless of the verdict on whether ARP is a natural kind.

  1. **Engagement with the leaky-mechanism problem** (5 marks)  
     *Must:* Explicitly address how the same mechanism (horizontal gene transfer) both maintains and disrupts the cluster, and how this affects the stability of the kind.  
     *Common botch:* Treating the leakiness as merely a problem for clustering accounts without considering that it is intrinsic to the mechanism itself.

  2. **Critique of at least two accounts of natural kinds** (5 marks)  
     *Must:* Apply two distinct accounts (e.g., essentialism and cluster-plus-mechanism) to the ARP case, showing how each fails (or succeeds) in light of the case details, especially the leaky mechanism and the cross-cutting phylogeny.  
     *Common botch:* For the phylogeny, assuming that because the marker-gene tree cross-cuts the cluster, it automatically supports a common-ancestry account, without noting that horizontal transfer also disrupts the tree.

  3. **Evaluation of the transfer-profile proposal** (5 marks)  
     *Must:* Assess whether the transfer-profile kind is a joint in nature or an instrument, and discuss the implications for realism.  
     *Common botch:* Asserting that vagueness or interest-relativity automatically makes the kind non-natural, without engaging with the proposal's claim to track a real process.

  4. **Refusal of the two easy exits** (5 marks)  
     *Must:* Explicitly reject both (i) the purely pragmatic exit and (ii) the ill-posed-question exit, and explain why each fails (e.g., by showing that the mechanisms are real and the question is tractable).  
     *Common botch:* Dismissing the case as merely pragmatic without argument, or avoiding the metaphysical question by saying it's up to scientists.

  5. **Treatment of the cross-cutting phylogeny** (5 marks)  
     *Must:* Explain why the cross-cutting phylogeny does not simply vindicate a common-ancestry account, given that horizontal transfer disrupts both the phenotypic cluster and the phylogenetic tree.  
     *Common botch:* Using the phylogeny to refute cluster accounts while ignoring that it equally challenges common-ancestry accounts because of horizontal transfer.

  ---

  ### Attractive-but-Wrong Theses

  An essay that asserts any of the following theses, without adequately engaging with the counterarguments in the case, should be capped at **15 marks** (i.e., no higher than a low B) regardless of other strengths:

  1. **Vagueness or interest-relativity is incompatible with natural kindhood.** (This ignores that the transfer-profile proposal claims the kind is natural despite these features, and that some accounts, e.g., pragmatic realism, allow for it.)  
  2. **The cross-cutting phylogeny by itself proves that ARP is not a natural kind.** (This overlooks that phylogeny is only one criterion and that the case complicates it by horizontal transfer.)  
  3. **Because the cluster is maintained by a mechanism, it must be a natural kind.** (This ignores the leakiness that undermines the stability of the cluster.)  
  4. **The ARP cluster is a natural kind because it has a shared property (e.g., the habitat).** (This oversimplifies: the habitat is shared by non-ARP organisms that acquire some traits, and the cluster is defined by multiple properties that don't cohere perfectly.)

  ---

  **Note to Marker:** The marking scheme is designed to be verdict-neutral. A student arguing that ARP *is* a natural kind (e.g., by defending the transfer-profile proposal as yielding a natural kind) can earn full marks by hitting the five points. Similarly, a student arguing that it is not a natural kind (on traditional grounds) can also earn full marks by addressing all five points.
answer: |-
  ### Take-Home Assessment: Natural Kinds and the ARP Case  
  **Completion Window:** 72 hours (unproctored)  
  **Word Limit:** 2,500 words  
  **Instructions:** This is a self-contained assessment. Draw on concepts from the course (e.g., microstructural essentialism, cluster-plus-mechanism accounts, deflationary/pragmatic views, and disputes about metaphysical licensing), but no specific secondary literature is required. Address the case below in an essay that:  
  1. **Decides and defends a verdict** on whether the ARP cluster constitutes a natural kind. Your defense must engage with at least two distinct accounts of natural kinds studied in the course. Crucially, address the "leaky-mechanism problem": the fact that the very mechanism (horizontal gene transfer) maintaining the cluster also causes its boundaries to be indeterminate.  
  2. **Evaluates the transfer-profile proposal**: Assess whether a kind defined by this proposal (with vague, interest-relative boundaries) is a "joint in nature" or a "well-engineered instrument." Then, argue whether the difference matters for the *realism* claimed by the research group (i.e., that the kind is "no less natural" despite vagueness and interest-relativity).  

  Avoid two inadequate exits:  
  - Do not dismiss ARP as *merely* a pragmatic taxonomic convenience without engaging the metaphysical question.  
  - Do not reject the question as ill-posed (e.g., by claiming natural kindhood is always context-dependent). Explain why these exits fail.  
  Additionally, address the significance of the cross-cutting phylogeny: Why does it not straightforwardly vindicate a common-ancestry account of natural kinds, given that horizontal transfer disrupts both the phenotypic cluster and the phylogenetic tree?  

  **The Case:**  
  Researchers working in seasonally waterlogged, arsenic-rich paddy soils have isolated a set of bacterial organisms that share a tight cluster of properties: a distinctive membrane lipid profile, anaerobic arsenate reduction, a shared repertoire of stress-response proteins, and a characteristic colony morphology. For convenience, call this the ARP cluster. (Everything stipulated here is for expository purposes; ARP is not a real taxon, and no claim is being made about any actual organism.)  

  The clustering is not accidental. Two mechanisms maintain it. First, all members occupy the same microhabitat, and that environment selects for the cluster. Second, and more consequentially, the organisms exchange genetic material promiscuously with one another by horizontal transfer, and the transferred material is precisely what carries the clustered properties: the properties co-occur because they travel together.  

  Now the complication. The same transfer mechanism does not respect the cluster's boundaries. The mobile elements carrying arsenate reduction move readily into organisms outside ARP — organisms with different lipid profiles and different morphology that happen to share the habitat — and those recipients acquire the property without acquiring the rest of the cluster. Conversely, some organisms that match ARP in every morphological and lipid respect have lost the arsenate determinants entirely. Phylogenetic reconstruction from a conserved marker gene yields a tree that cross-cuts the phenotypic cluster; ARP members are not each other's closest relatives. The mechanism that holds the cluster together is therefore also the mechanism that leaks it, and there is no threshold of transfer frequency at which the leakage stops.  

  One member of the research group proposes, in response, that ARP membership should be fixed not by any set of shared properties but by a *transfer profile*: an organism belongs to the kind insofar as it stands in relations of sufficiently frequent genetic exchange with the others, where "sufficiently frequent" is calibrated by how well the resulting partition predicts which organisms will acquire arsenate resistance under a specified selection regime. On this proposal, the boundaries of the kind are explicitly vague and explicitly interest-relative, and the kind is said to be no less natural for that.  

  ---

  ### Model Answer (1,050 words)  
  **Verdict:** The ARP cluster is **not a natural kind** on microstructural essentialist or cluster-plus-mechanism grounds, but the transfer-profile proposal succeeds in defining a *natural kind of a pragmatic-realist variety* — one that functions as a well-engineered instrument rather than a joint in nature. This instrument captures a real, dynamic pattern in nature, but its boundaries are metaphysically indeterminate, and its "reality" depends on its predictive role in specific contexts.  

  **The Leaky-Mechanism Problem Undermines Traditional Accounts**  
  The core tension is that horizontal gene transfer (HGT) maintains ARP’s property cluster while simultaneously eroding its boundaries. For Boyd’s cluster-plus-mechanism view, kindhood requires stable co-occurrence of properties sustained by homeostatic mechanisms. Here, HGT acts as such a mechanism: it explains why arsenate reduction, lipid profiles, and stress proteins cluster in the microhabitat. Yet HGT is inherently "leaky": it transfers traits beyond the cluster (e.g., arsenate reduction to non-ARP organisms) and fails to transfer all traits uniformly (e.g., ARP-morphology organisms losing arsenate genes). This leakiness is non-accidental; it arises from the *same causal process* that sustains the cluster. Consequently, no stable set of properties defines ARP membership. Boyd’s account cannot accommodate this because homeostasis assumes mechanisms *reinforce* boundaries; here, the mechanism intrinsically destabilizes them. Calling ARP a natural kind on this view would ignore the indeterminacy HGT creates — an indeterminacy that empirical data (e.g., trait loss in phenotypically matching organisms) confirms is objective, not epistemic.  

  Microstructural essentialism (e.g., Ellis) fares worse. It demands a shared intrinsic essence (e.g., genetic or structural) necessary and sufficient for kind membership. However, no such essence exists for ARP. The conserved marker gene’s phylogeny cross-cuts the cluster, showing ARP members lack shared ancestry. Worse, HGT decouples the "essential" traits: arsenate reduction transfers independently of lipid profiles, so no single microstructure guarantees all cluster properties. Even the habitat fails as an essence, as non-ARP organisms occupy it and acquire isolated traits. The leakiness thus refutes essentialism by demonstrating that ARP’s properties are neither necessary (due to trait loss) nor sufficient (due to partial acquisition by outsiders) for kind membership.  

  **Why the Cross-Cutting Phylogeny Does Not Save Common-Ancestry Accounts**  
  The phylogeny cross-cut might seem to rescue common-ancestry accounts (e.g., Griffiths), which ground kindhood in shared descent. After all, the marker gene tree shows ARP members are polyphyletic, implying the cluster lacks historical unity. But this is not decisive. HGT disrupts *both* the phenotypic cluster and the phylogenetic signal: the same process that transfers cluster traits among unrelated organisms also introduces foreign DNA into the conserved marker gene, muddying the tree. Thus, the phylogeny does not reveal a "true" ancestral hierarchy; it reflects the same noisy HGT dynamics that fracture the phenotype. Common-ancestry accounts fail because they cannot distinguish between vertical descent and HGT-driven patterns in this context. The tree does not vindicate ancestry as a criterion; it highlights how HGT *dissolves* the very boundaries ancestry requires.  

  **Rejecting Easy Exits**  
  Two inadequate responses must be rejected. First, declaring ARP a *mere pragmatic convenience* ignores that the cluster is objectively maintained by HGT and selection. These mechanisms are real, mind-independent processes — not arbitrary human choices. Denying natural kindhood on pragmatic grounds alone overlooks the robust causal structure underpinning the clustering. Second, dismissing the question as *ill-posed* (e.g., by asserting all kinds are interest-relative) evades the challenge. The accounts we have (e.g., Boyd’s) make clear empirical predictions: where mechanisms sustain stable clusters, kinds exist. ARP tests these predictions by presenting a mechanism that *simultaneously* sustains and destabilizes. The question is tractable: we can ask whether ARP meets the criteria of these theories, and if not, why they falter.  

  **The Transfer-Profile Proposal: Instrument, Not Joint**  
  The proposal defines ARP by relational properties (HGT frequency) calibrated to predictive success under selection. This kind is explicitly vague and interest-relative — but is it natural? It is not a "joint in nature" in the traditional sense (e.g., like electron or water), where boundaries are intrinsic and discrete. Instead, it is a *well-engineered instrument*: a human-constructed category optimized for a goal (predicting arsenate resistance). Its vagueness reflects nature’s indeterminacy (HGT frequencies vary continuously), and its interest-relativity arises from the "specified selection regime" in the calibration. Yet it is not *merely* instrumental. It tracks a real network of genetic exchange that shapes evolutionary outcomes: organisms with high HGT to ARP members are likelier to acquire arsenate resistance because they share a pool of adaptive traits. This network is mind-independent; our instruments "engineer" a way to map its fuzzy boundaries.  

  **Realism and Why the Difference Matters**  
  The research group’s realism — that the kind is "no less natural" — is defensible but nuanced. The transfer-profile kind captures a real pattern: the HGT network objectively influences microbial adaptation. However, calling it a "joint" implies a metaphysical carving that exists independently of human interests, which is inaccurate. The calibration’s dependence on a "specified selection regime" makes the kind’s utility (and thus its boundaries) contingent on context. For example, under high-arsenic conditions, a broader transfer profile might maximize predictive power, while in low-stress environments, a narrower one might suffice. This context-dependence distinguishes it from joints like chemical elements, which behave uniformly across interests. The difference matters for realism: it commits to a *pragmatic realism* where kinds are real insofar as they track causal structures, but rejects *strong realism* where kinds exist as discrete, intrinsic categories. The transfer-profile kind is natural because it aligns with nature’s dynamics, but it remains an instrument because its boundaries are fixed by our predictive goals.  

  **Conclusion**  
  ARP is not a natural kind on essentialist or cluster-mechanism accounts due to HGT’s leaky homeostasis. The transfer-profile proposal rescues a form of kindhood by embracing indeterminacy, but this kind is an instrument, not a joint. Its reality lies in its ability to model a genuine causal structure — one where HGT creates a fluid, network-based unity in nature. This case shows that natural kinds need not be discrete or non-relational; they can be dynamic and interest-relative while still being "real."  

  ---  

  ### Marking Scheme (out of 25)  
  Essays are assessed on five argumentative moves, not on the verdict. Full marks (25/25) require addressing all five. Each point is worth 5 marks, allocated as follows:  
  - **5/5:** Insightful, well-supported treatment.  
  - **3–4/5:** Adequate but underdeveloped or partially inaccurate.  
  - **0–2/5:** Missing, confused, or seriously flawed.  

  **Must-Hit Points:**  
  1. **Engagement with the leaky-mechanism problem** (5 marks)  
     - *To hit:* Explain how HGT both sustains and destabilizes the ARP cluster, and why this undermines stability-based accounts (e.g., Boyd’s).  
     - *Common botch:* Treating leakiness as a contingent flaw in the mechanism rather than an intrinsic feature.  

  2. **Critique of two accounts of natural kinds** (5 marks)  
     - *To hit:* Apply two distinct accounts (e.g., essentialism and cluster-plus-mechanism) to ARP, using case details (e.g., trait leakage, cross-cutting phylogeny) to show how they fail or succeed.  
     - *Common botch:* Misapplying accounts (e.g., claiming phylogeny "proves" essentialism without addressing HGT’s disruption).  

  3. **Evaluation of the transfer-profile proposal** (5 marks)  
     - *To hit:* Assess whether it yields a "joint in nature" or "instrument," and discuss implications for realism (e.g., by weighing predictive success against interest-relativity).  
     - *Common botch:* Assuming vagueness/interest-relativity automatically negates naturalness without engaging the proposal’s realist claims.  

  4. **Refusal of two easy exits** (5 marks)  
     - *To hit:* Explicitly reject both the "mere pragmatic convenience" and "ill-posed question" exits, explaining why each fails (e.g., by noting the objective mechanisms).  
     - *Common botch:* Dismissing the exits superficially (e.g., "scientists use it, so it’s real") without metaphysical argument.  

  5. **Treatment of cross-cutting phylogeny** (5 marks)  
     - *To hit:* Explain why the phylogeny does not vindicate common-ancestry accounts, given HGT’s disruption of both phenotype and tree.  
     - *Common botch:* Using phylogeny to refute phenotypic clusters while ignoring that HGT equally undermines phylogeny as a kind criterion.  

  ---  

  ### Attractive-but-Wrong Theses  
  An essay asserting any of the following theses, without rigorous counterargument, is capped at **15/25** (regardless of other strengths):  
  1. **Vagueness or interest-relativity of extension is incompatible with natural kindhood.** (This ignores pragmatic-realist accounts where such features track real indeterminacy.)  
  2. **The cross-cutting phylogeny alone proves ARP is not a natural kind.** (This overlooks that HGT disrupts phylogeny itself and that other accounts may not require shared ancestry.)  
  3. **Because a mechanism maintains the cluster, ARP must be a natural kind.** (This neglects how the mechanism’s leakiness destabilizes boundaries.)  
  4. **The transfer-profile kind is unnatural because it is "defined by scientists."** (This conflates epistemic practices with metaphysics; instruments can track real patterns.)  

  ---  
  **Feedback Note:** A strong essay need not agree with the model answer’s verdict. For example, a defense of ARP as a natural kind (via the transfer-profile) can earn full marks by hitting all five points.
