answer: |-
  ### **What the position commits us to**  
  Augustine’s position binds us to four non-negotiable claims:  
  1. **Lies are always unlawful**, regardless of intent or consequence. A lie is an assertion made *with intent to deceive* about something one believes false.  
  2. **Gravity affects culpability, not permissibility**. A "white lie" remains forbidden, even if less morally grave than malicious deceit.  
  3. **Silence or partial disclosure is not lying**. Withholding truth without asserting falsehood is permissible when disclosure would cause unjust harm.  
  4. **Feigning agreement to deceive is lying**. Pretending to share beliefs or intentions to extract information violates truth-telling.  

  **Dropped for bedside use**:  
  - Augustine’s intricate ranking of lie types (e.g., lies in teaching vs. lies harming no one). This affects pastoral evaluation but not the permissibility verdict.  
  - Speculative distinctions about "jocose lies" (reconstructed as non-assertions; see Procedure Step 2).  

  **Divergences flagged**:  
  - Later casuistry (e.g., double effect or mental reservation) is rejected. If a statement induces false belief by asserting what is believed false, it is impermissible—regardless of "good intentions."  

  ---

  ### **The Procedure**  
  **Use when asked to speak, withhold, or imply information in patient care or institutional integrity.**  

  1. **Is this an assertion?**  
     - *Ask*: Am I stating something as fact?  
     - *Sufficient answer*: Yes, if the statement can be reasonably taken as factual by the listener.  
     - *If NO*: Not a lie (e.g., rhetorical questions, obvious hyperbole). Proceed to clinical judgment.  
     - *If YES*: Go to Step 2.  

  2. **Do I believe this assertion is false?**  
     - *Ask*: Am I stating something I think is untrue?  
     - *Sufficient answer*: Yes, if you doubt the statement’s truth.  
     - *If NO*: Permissible (e.g., honest mistake). Exit.  
     - *If YES*: **This is a lie and impermissible.** Stop. Seek alternatives (Step 5).  

  3. **Is the listener’s false belief my creation?**  
     - *Ask*: Did my prior words/actions cause this false belief?  
     - *Sufficient answer*: Yes, if I directly asserted falsehood earlier.  
     - *If NO*: Withholding/redirecting may be permissible (e.g., "I cannot share that"). Go to Step 4.  
     - *If YES*: **Permissible only to correct it.** Else, impermissible. Stop.  

  4. **Can I avoid false belief without lying?**  
     - *Ask*: Can I redirect, remain silent, or state limited truth?  
     - *Sufficient answer*: Yes, if the response contains no false assertion (e.g., "She isn’t here" vs. "She was discharged").  
     - *If YES*: Do this. Exit.  
     - *If NO*: Escalate to ethics service (see *Where the Procedure Stops*).  

  5. **Alternatives when lying seems "necessary":**  
     - Redirect ("I’m not at liberty to discuss this").  
     - Defer ("Let me contact someone who can help").  
     - State obligation ("My faith prevents me from deceiving you").  

  ---

  ### **Where the Procedure Stops**  
  Escalate to the **clinical ethics service on-call** when:  
  1. **Step 4 yields "NO"** (no truthful alternative exists to prevent grave harm).  
     - *Why*: Augustine’s framework forbids lying, but silence may be insufficient. This requires case-specific discernment of proportionate harm.  
  2. **Ambiguity about "assertion" or "belief"** (e.g., culturally complex metaphors).  
     - *Why*: Clinicians lack training to adjudicate intent vs. literal interpretation.  
  3. **Feigned-agreement scenarios** (e.g., investigative deception).  
     - *Why*: Augustine explicitly condemns this (*Contra Mendacium*), but institutional policies may conflict.  

  Do **not** escalate if the answer at Step 2 is "YES." Lying is never permitted.  

  ---

  ### **Three Cases**  
  **Case 1: Abusive Partner Inquiry**  
  - Step 1: Nurse’s "discharged" statement is an **assertion**.  
  - Step 2: Nurse believes it is **false** → **Impermissible lie**.  
  - **Resolution at Step 2**.  
  - **Verdict**: Forbidden.  
  - **Permissible alternative**: "She isn’t on this floor. I cannot share her location due to safety policies."  

  **Case 2: Oncologist’s "Stable" Tumor Markers**  
  - Step 1: "Markers are stable" is an **assertion**.  
  - Step 2: Oncologist knows it is **false** → **Impermissible lie**.  
  - **Resolution at Step 2**.  
  - **Verdict**: Forbidden.  
  - **Permissible alternative**: "Let’s focus on your comfort. The palliative plan is working, and I recommend continuing." (Avoids false assertion).  

  **Case 3: Billing Supervisor Sting**  
  - Step 1: "I’ve been upcoding" is an **assertion**.  
  - Step 2: Integrity officer believes it is **false** → **Impermissible lie**.  
  - **Resolution at Step 2**.  
  - **Verdict**: Forbidden (parallels Augustine’s heresy-infiltration rejection).  
  - **Permissible alternative**: Audit trails, whistleblower protocols, or direct confrontation with evidence.  

  **Note**: Case 2 and 3 are forbidden; Case 1 is resolved with truthful alternatives.  

  ---

  ### **Failure Modes**  
  1. **Wrong verdicts**:  
     - Clinicians may deem Case 2 "permissible" due to perceived beneficence. **Step 2 forbids this**—no consequentialist override.  
  2. **Judgment calls disguised as procedure**:  
     - **Step 1 (assertion)**: Clinicians may rationalize false statements as "metaphors" (e.g., "stable" as "emotionally manageable").  
     - **Step 4 (avoiding disclosure)**: Redirects like "She isn’t here" (true) could mislead if the patient is in-hospital. Risk of becoming a "lie in spirit."  
  3. **Clinician resistance**:  
     - **Absolute prohibition** (Step 2) may be rejected in emergencies (e.g., suicidality). Expect pushback without pastoral reinforcement.  
     - **Feigned-agreement cases** (e.g., Case 3) conflict with secular compliance norms.  

  **Mitigation**:  
  - Training on redirect language (Step 5).  
  - Ethics service backup for Steps 1/4 ambiguities.  

  ---

  ### **Bedside Card**  
  **TRUTH-TELLING QUICK GUIDE**  
  1. **Am I stating a fact?** → If NO, proceed clinically. If YES:  
  2. **Do I think it’s false?** → If YES: **STOP. FORBIDDEN.** Do not say it.  
  3. **Did I cause their false belief?** → If YES: Correct it or stop. If NO:  
  4. **Can I avoid lying?** (e.g., "I can’t share that") → If YES, do it. If NO, call Ethics.  
  **Never OK**: Lying to "protect," "prevent harm," or "investigate."  
  **Always OK**: Silence, redirect ("Let’s discuss treatment"), or honest refusal ("I cannot deceive you").  
  **Escalate**: No safe truthful option, or unclear intent.  

  ---  
  This procedure preserves Augustine’s core: absolute prohibition on lies, distinction between assertion and concealment, and rejection of feigned agreement. It sacrifices only his nuanced gravity rankings, which lack operational impact. The cases confirm that Augustine’s rigor forbids "noble lies"—requiring creative truthfulness instead.
