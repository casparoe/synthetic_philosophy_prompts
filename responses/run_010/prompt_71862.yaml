prompt: |-
  I'm writing a novel whose narrator is a European museum registrar, and to make her convincing I've had to work out what I actually believe about giving things back — turns out I don't have one view, I have about six that don't fit together. Here they are, roughly in the order they hit me:

  1. The pieces British forces took out of the Benin palace in 1897: back, no strings, no conditions attached. If my registrar wants a caveat here I don't want to write her.
  2. The Parthenon sculptures: back to Athens — but notice I reach for a different reason there, that the building is still standing and the carvings belong to it. The "they complete something" line is doing work I'm not sure it can do anywhere else.
  3. A plaque bought in good faith off a dealer in the 1930s by a small museum, no violence anywhere near that particular transaction: still goes back. This one surprizes me.
  4. Something a chief genuinely gifted a missionary, documented, no coercion I can find: stays. Though I keep worrying that "no coercion in a colony" its a fantasy, which would swallow 4 into 1.
  5. Human remains and funerary objects: back, and not into a museum at all — burial, or the family.
  6. A piece that survived only because the holding museum conserved it, while the temple it came from was wrecked in a later war: stays. I know this fights with 3.
  7. Where the claiming government would lock it in a presidential palace and bar scholars: return anyway. But in one draft my registrar offers a "long-term loan" instead and I can't tell if she's being sensible or being a paternalist, and I want the principle to settle that rather than my gut.
  8. An object carved specifically for the export market in the eighteenth century and sold willingly: stays.

  Is there a principle under all this, or a small set of them? State it clause by clause and tell me which of my cases forces each clause, then say plainly which verdicts have to be sacrificed to keep the rest — I'd rather lose 6 or 8 than lose 1. And whether "long-term loan" can ever be a principled answer or is always a polite dodge.

  Then run it on three I haven't decided. An object looted before Europeans got involved, by a neighbouring kingdom rather than a colonial power — does the principle still fire? A private collector in Benin City who buys a looted piece at a London auction to bring it home but won't hand it to the state or to the palace? And a piece whose meaning has changed after a century and a half of being looked at as art in the West — does that history generate any claim of its own, or is it just an excuse my registrar would like to believe?
reasoning: |-
  Okay, let me tackle this user's complex query about restitution principles for their novel. The museum registrar protagonist needs coherent ethics, but the user has eight conflicting positions. 

  First, I notice the user is deeply engaged with moral nuance - they reject simplistic solutions ("no caveats for Benin bronzes") while acknowledging their own contradictions (case 3 surprising them). This isn't just academic; the stakes feel personal when they admit preferring to sacrifice case 6 over case 1. The novelist hat matters as much as the ethicist hat here.

  Hmm... the core tension seems to be between three axes: violence (was force involved?), belonging (is there a clear original context?), and consequences (what happens after return?). Cases 1, 3 and 5 prioritize violence remediation even when other factors conflict. Cases 2 and 6 lean hard on belonging/consequences. That explains why case 3 (no violence but return) surprises the user - it breaks the "violence-first" pattern emerging elsewhere.

  For principles... I'm seeing:
  - Violence trumps everything (covers 1,5,7 - even if the recipient government locks it away)
  - Belonging matters when physical continuity exists (case 2's Parthenon exception)
  - But violence voids all other claims (swallows case 4's "gift" doubt)

  Wait, case 7's "return anyway" contradicts my first principle if the object will be inaccessible. Unless... ah! The user's registrar considers long-term loans. That's actually the key - it separates physical return from stewardship rights. Maybe the core principle is: *Remediate violence through physical transfer, but stewardship follows best care.*

  Testing this on their undecided cases:
  - Pre-colonial looting: Does the principle fire? Only if we expand "violence" to include non-colonial force. But that might make everything restitutable forever - slippery slope. Alternative: Limit to colonial-era violence as unfinished justice.
  - Private buyer in Benin: Physical return satisfies violence remediation even if not to state. The palace's claim feels stronger though - maybe add "preferred recipients" clause?
  - Meaning-changed objects: Here's where the loan solution shines. Physical return remedies violence, but long-term loan acknowledges the new scholarly context. Lets the registrar avoid paternalism ("we know better") while honoring history.

  Sacrifices needed: Case 6 (staying for preservation) directly contradicts violence-first principle. Case 8 stays - no violence, no belonging claim. Loan offers aren't dodges if they transfer physical control while retaining access - but must be recipient's choice.

  ...I think the user's registrar would hate how messy this is. Perfect for novel conflict.
answer: |-
  Your ethical framework reveals three core principles when distilled—each resolving tensions but demanding sacrifices. Here's the clause-by-clause breakdown, verdicts on your cases, and answers to your new scenarios:

  ### Core Principles
  1. **Violence Nullifies Consent**  
     *Clause:* If acquisition involved coercion, warfare, or colonial violence, restitution is mandatory—regardless of current preservation, scholarly value, or recipient governance.  
     *Forces:* Cases 1 (Benin loot), 5 (human remains), and 7 (repressive regimes). Swallows Case 4 ("gifts" in colonial contexts are void).  

  2. **Belonging to a Living Context**  
     *Clause:* Objects integral to a standing cultural/religious entity (physical or communal) should reunite with it—unless Principle 1 supersedes.  
     *Forces:* Case 2 (Parthenon), Case 5 (family/clan burial). Limits "completion" claims to tangible continuity.  

  3. **Stewardship ≠ Ownership**  
     *Clause:* Preservation, scholarship, or market history *never* create moral ownership. They may inform *how* restitution occurs (e.g., loans), but not *if*.  
     *Forces:* Rejects Case 6 ("saved from war" ≠ justification). Upholds Case 3 (clean acquisition still requires return).  

  ### Sacrifices Required
  - **Case 6 MUST fall:** "Preservation by the museum" violates Principle 3. If violence occurred in acquisition, the object goes back.  
  - **Case 8 STAYS:** No violence, no living context (made for export). Aligns with all principles.  
  - **Case 4 VOID:** Colonial "gifts" default to Principle 1 (coercion inherent).  

  ### The "Long-Term Loan" Dilemma  
  It **can** be principled *iff*:  
  - Physical return satisfies the claimant (e.g., object to Athens, but shared stewardship).  
  - It addresses practical barriers (e.g., political instability *temporarily* preventing safe repatriation).  
  But it’s **paternalist** if:  
  - Used to retain control ("we loan it because we know best").  
  - Avoids admitting wrongful holding (e.g., for Benin bronzes).  
  *For Case 7:* A loan *proposed by the claimant* is ethical; imposed by the museum is not.  

  ---  
  ### Your Undecided Cases Tested  
  **1. Object looted pre-colonially by a neighboring kingdom**  
  - *Principle:* **No automatic return.** Violence Nullifies Consent applies only to *colonial* violence (your framework focuses on rectifying Europe’s crimes). If the original looting is beyond living memory, the current state/nation’s claim may lack urgency—unless a continuous cultural group exists (Belonging Principle).  
  - *Verdict:* Stays unless claimants prove unbroken cultural lineage.  

  **2. Private Benin collector buys looted art in London**  
  - *Principle:* **Restitution is still owed—but not necessarily to them.** The collector’s act is laudable but doesn’t erase the original crime (Principle 1). The rightful claimant is the Oba’s palace (Belonging Principle). The museum should return *to the palace*, not the collector.  
  - *Verdict:* Registrar must contact palace authorities; private collector has no standing.  

  **3. Object transformed by Western museum display**  
  - *Principle:* **No moral claim generated.** Stewardship ≠ Ownership (Principle 3). The "new meaning" is interpretive, not restorative.  
  - *Verdict:* **An excuse your registrar clings to.** If violence occurred in acquisition, it goes back. The museum’s role is to document—not own—the object’s diaspora history.  

  ### Summary for Your Registrar  
  Her ethics could be:  
  > *"Museums rectify violence, reunite what belongs, and never mistake care for custody. Where we caused harm, we return without conditions. Where context lives, we listen. Our scholarship serves truth—not tenure."*  

  This sacrifices Case 6 and colonial "gifts" (Case 4), preserves Case 8, and makes loans *possible* but risky. It forces her to confront her paternalism in Case 7—a rich character arc.
