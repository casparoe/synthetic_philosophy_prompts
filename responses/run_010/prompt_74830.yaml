  The medical details matter. Mentioning the antibiotic change in the second week shows we're respecting facts while leaving room for the sister's interpretation. The "one-in-twenty chance" statistic anchors the shared sense of wonder.

  For structure: opening with warmth, then the dark days narrative, pivot to the recovery's ambiguity ("some will say...others see"), then resolve in communal gratitude. Must keep Hume invisible - perhaps just imply "wise men proportion belief" without naming him.

  Word count precision is crucial. At 150 words/minute, 600 words would risk exceeding four minutes. Better to draft tight at 450 and leave room for pauses. The "in this building today" refrain could unify the audience spatially.

  Biggest risk is accidental preaching. Must keep it personal - "my sister's hands" concrete imagery works better than abstract theology. Ending on collective action ("we're here together") avoids doctrinal minefields while feeling uplifting.

