  I need to analyze several dimensions: First, the precise mechanics of this amnesty-disclosure pairing. The certification isn't incidental - it's the currency of exchange. Second, how this differs from neighboring concepts: blanket amnesty (no disclosure required), pardons (post-conviction), expungement (retroactive erasure), or immunized testimony (evidentiary limitation). The sequence matters - disclosure precedes and enables amnesty here.

  The user wants conceptual "carving," not just labels. They're clearly well-read given their precise distinctions. Their frustration with "legal fiction" suggests they suspect this phenomenon occupies unique conceptual territory. The domestic immunity example shows they've tested boundaries.

  For the answer, "transactional truth" seems fitting - capturing the quid pro quo nature and the conversion of factual truth into legal irrelevance. This isn't mere amnesty, nor pure truth-telling, but their transactional fusion. 

  Key boundaries: Without disclosure it's simple amnesty; with prosecution it's not this mechanism; sealed records reverse cause and effect. A clean non-instance would be a standard criminal trial where verdict and consequence align.
answer: |-
  Your inquiry dissects a profound legal-anthropological paradox with remarkable precision. What you describe transcends "amnesty with disclosure" and resists assimilation to existing terms. Below is a conceptual carving of the phenomenon, its boundaries, and a proposed resolution.

  ### Core Phenomenon: Transactional Truth-Nullification
  **Definition:** *A state-supervised exchange wherein:*
  1.  **Conditional Amnesty:** Legal immunity (criminal/civil) is offered *only* upon full, sworn, public disclosure of specific acts.
  2.  **Official Verification:** An independent authority rigorously tests the disclosure against evidence, certifying it as a complete and truthful account.
  3.  **Simultaneous Nullification:** The *certified truth itself* becomes the sole, irrevocable basis for voiding all legal liability for the acts described.
  4.  **Public Entrenchment:** The certified account becomes the official, public record of the event, yet confers no actionable legal rights upon victims.

  **Operational Logic:** Truth is not merely disclosed *in exchange for* immunity; the *act of certification* (establishing truth) is the *direct mechanism* of nullification. The truth isn't suppressed or denied; it is *instrumentalized* to dissolve its own legal consequences. The state acquires an authoritative narrative of its own past violence while simultaneously foreclosing justice based on that narrative.

  ### Distinguishing from Neighboring Concepts
  1.  **Blanket Amnesty (No Disclosure):** *Lacks certification.* Amnesty is granted unconditionally or based on broad criteria, not on the verified recitation of specific acts. No "transactional truth" is produced or nullified. *(Overlap ends at conditional offer.)*
  2.  **Indemnity:** Typically shields against future liability (often civil) *for actions taken in good faith within official capacity*. It does not require public confession/verification of specific past wrongs as the *price* of immunity. *(Overlap ends at retroactive nullification for confessed crimes.)*
  3.  **Pardon (Post-Conviction):** Requires a prior *adjudication of guilt* (verdict/sentence). It *forgives* a consequence established by law; it does not *prevent the establishment* of liability via the perpetrator's own certified testimony. *(Overlap ends at sequence: conviction precedes pardon.)*
  4.  **Sealing/Expungement:** *Obfuscates or destroys the record* of an event or adjudication. Your case *creates and enshrines* the authoritative public record while voiding its legal force. *(Overlap ends at truth's public status and its role in nullification.)*
  5.  **Compelled Testimony (Immunity):** Prevents the *testimony itself* from being used *as evidence* against the witness. It *disables a specific piece of evidence*; it does not void liability for the *underlying act* proven by *other* means. Your case voids liability *for the act itself* based precisely on its certification. *(Crucial Distinction: Immunized testimony can still lead to conviction via other evidence; certified amnesty testimony renders the act legally consequence-less.)*
  6.  **Officially Sponsored Forgetting:** Actively *suppresses or discourages* remembrance/acknowledgment. Your case *mandates and codifies* remembrance while neutralizing its legal implications. *(Overlap ends at truth production vs. suppression.)*
  7.  **Denial:** Rejects the factual occurrence. Your case *demands and certifies* factual occurrence. *(No overlap.)*

  ### Boundary Cases & Your Instincts
  *   **Amnesty without Disclosure:** *Not an instance.* Lacks the core element: the certified truth *as the instrument and price* of nullification.
  *   **Commission Report + Prosecution:** *Not an instance.* Prosecution violates the nullification condition. The certified truth *must be* the basis for voiding liability.
  *   **Conviction + Later Sealing:** *Not an instance (Reversed Order).* Liability *is established* legally before the record is obscured. The truth is not *certified to create* its own nullification.
  *   **Your Instinct on Immunity:** Correct. Immunized testimony *blocks one path* to liability (using the compelled words). Transactional Truth-Nullification *extinguishes the liability* for the act described, irrespective of evidence source. The perpetrator walks free *because* they told the verified truth.

  ### Conclusion: A Conceptual Gap
  No single established term adequately captures this phenomenon. "Amnesty" is too broad; "truth commission" doesn't capture the legal nullification; "immunity" misstates the effect; "legal fiction" is fundamentally wrong (it creates false equivalences; here, truth is acknowledged then neutered). The closest established concept is **Conditional Amnesty**, but this fails to capture the *constitutive role* of the certified truth in *effecting* the nullification and its unique status as the authoritative public record.

  ### Coined Term & Final Answer
  This is **Certificatory Nullification**: The state-sanctioned production of a verified, public truth that simultaneously functions as the operative instrument for extinguishing all legal liability for the acts thus certified.

  **Unambiguous Non-Instance:** A perpetrator confesses under oath to a specific murder during a truth commission hearing. The commission finds his account credible and complete. He is subsequently prosecuted and convicted for that murder using his confession and corroborating evidence. (Truth certified, but nullification absent).

  \answer{Certificatory Nullification}
