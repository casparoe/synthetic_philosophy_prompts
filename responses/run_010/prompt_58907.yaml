prompt: |-
  So I just finished a year-long data migration and I've ended up with a question I can't figure out how to google. For context I'm a backend engineer, never taken a philosophy class, so this may be a completely well-known thing with an obvious name that I just don't have.

  We moved ~20-some years of operational history (tickets, incident reports, deploy notes, old wiki pages) into a new system, and at the end I got asked to write up a short history of how the platform evolved. Trying to do that, I kept hitting the same wall: the record isn't a sample of what happened, it's a sample of what the recording system happened to notice, and the recording system has its own history that has nothing to do with the thing I'm studying.

  Concretely:

  - Ticket volume roughly triples between 2014 and 2016. Anyone who was there will tell you that was actually one of the calmest stretches in the company's life. It's just that a new ops manager started requiring a ticket for everything, including stuff that used to be a hallway conversation.
  - Everything before 2009 is nearly blank. Not because nothing happened — a wiki got lost in a migration that nobody wrote down, because writing it down wasn't anybody's job at the time.
  - The two people who actually understood the build system kept their notes in personal text files and left in 2013. The largest single body of operational knowledge in the company's history is a hole with a couple of names attached to it.
  - Incidents get documented in agonizing detail. The hundreds of times someone quietly papered over a problem so it never became an incident leave no trace whatsoever.

  And there's a pattern in who shows up at all. Anyone with standing to open a ticket exists in the record. Contractors, support staff, the offshore team — they did a big fraction of the actual work and appear mostly as initials in a comment thread, if even that.

  So the history I can reconstruct is basically a portrait of the tooling and the management fashions that produced it, wearing the costume of a history of the platform.

  Nearest things I know of, and none of them feel right: survivorship bias (that's about which units make it through a filter, not about the shape of the filter itself), the streetlight effect (that's about where I choose to look, and my problem is upstream of looking), and "absence of evidence is not evidence of absence" (true, but useless here — my problem is that the absence has a *shape* and that shape is informative about the recorder, not the recorded). I'm fairly sure statisticians have a formal notion for missingness that carries information about the missing values, and I'd bet historians and archivists have something too since they must run into this on every single project. But I don't know whether any of those is the same phenomenon or just one mechanism that produces it.

  What I want isn't really a label. I want to know what the thing I'm describing *is*: what's the right unit of analysis, how is it different from selection bias in general, and where are its edges. Like — is a photograph that only exists because someone was paid to take it an instance, or is that too weak? Is a metric that stops being collected once it looks bad the same thing, or a different thing? If there's an established concept that covers it, tell me which and be honest about how well it actually fits versus how much of my description it leaves out. If nothing covers the whole thing, say so plainly and coin a term with a definition that would let me tell instances from non-instances. And tell me whether the who-has-standing-to-create-a-record part is a seperate phenomenon or the same one seen from a different angle, because that's the part I have the least handle on.
reasoning: |-
  Okay, the user has described a fascinating problem about reconstructing history from biased records after a data migration. They're a backend engineer without philosophy training, so I need to avoid academic jargon while still being precise. 

  Hmm... their core frustration resonates deeply - they've discovered that their operational records aren't a neutral window into the past but rather a mirror reflecting the recording systems themselves. The examples are painfully concrete: ticket inflation during calm periods, lost wikis, vanished tribal knowledge, invisible work by contractors. 

  What they're really wrestling with is epistemic uncertainty - how can we know what we don't know? The "shape of absence" concept is particularly acute. I recall Michel-Rolph Trouillot's work on historical silence being useful here - how gaps in archives often reveal power structures. 

  The standing-to-record dimension feels crucial too. It's not just about what gets recorded, but who has the institutional capital to make something "record-worthy". Reminds me of how Foucault analyzed archives as systems of exclusion. 

  For practical framing, I should emphasize the duality: every record simultaneously documents an event AND the recording context. The anthropologist Shannon Mattern's "infrastructural intelligence" concept might help them see their systems as cultural artifacts. 

  They'd probably benefit from Latour's actor-network theory too - those lost build system experts show how knowledge exists in human/nonhuman networks that disintegrate when key actors leave. 

  The photography example is telling - yes, commissioned photos absolutely fit this pattern because the decision to record is itself data. Same for abandoned metrics - the moment of cessation often reveals more than the metrics themselves. 

  I'll need to distinguish this from plain selection bias by emphasizing the recursive nature: here the recording mechanism's evolution is part of the phenomenon being studied. The "unit of analysis" should be the record-creation event itself - its actors, tools, and institutional constraints. 

  For the standing issue, I'll position it as inseparable - the power to record determines what becomes "history" versus "noise". Might reference how feminist historiography treats absence as data about marginalization. 

  Should probably avoid coining terms unless necessary, but "archival distortion field" captures that sense of systemic warping. The key is helping them see their frustration as legitimate methodological insight rather than just a data quality issue.
answer: |-
  What you're describing is a profound and well-recognized problem in fields like historiography, archival science, sociology of knowledge, and critical data studies. It has no single perfect name because it emerges at the intersection of several concepts. Here's a breakdown:

  ### The Core Phenomenon: **Archival Bias as Epistemic Distortion**
  Your history isn't just *incomplete*; it's **systematically distorted by the socio-technical processes of record creation and preservation**. The "record" is a product of:
  1.  **Recording Conventions:** Formal rules (e.g., "tickets required for everything"), informal norms, tool capabilities.
  2.  **Power & Standing:** Who has the authority, resources, or perceived need to create/access/preserve records.
  3.  **Institutional Memory Practices:** What is valued enough to document formally, migrate, or preserve.
  4.  **Tool Evolution & Data Loss:** Migrations, tool changes, format obsolescence, accidental deletion.
  5.  **Invisible Work & Tacit Knowledge:** The vast amount of essential work that occurs outside formal systems or resides only in human memory.

  **This creates a "signal" in the archive that primarily reflects the recording apparatus itself, not the underlying reality it purports to document.** The *absences* and *distortions* are patterned and informative.

  ### Key Concepts & How They Fit (or Don't Fully Fit)

  1.  **Silences (Archival Science/Historiography):**
      *   **What it is:** The deliberate or accidental omissions, exclusions, or losses within an archive. Silences are not random; they reflect power structures, societal values, administrative choices, and technological limitations.
      *   **Fit:** Excellent fit for your "lost wiki," "missing build notes," "invisible work." Silences highlight *what isn't there* and *why*. Your "shape of the absence" is precisely the analysis of silences. Historians like Michel-Rolph Trouillot ("Silencing the Past") grapple with this constantly.
      *   **Unit of Analysis:** The gap in the record itself, analyzed in its context (e.g., *why* the wiki wasn't migrated, *who* wasn't empowered to create tickets).
      *   **Edges:** Focuses on the *absence* rather than the *distorted presence* (like your ticket inflation). Requires contextual analysis to interpret.

  2.  **Provenance & Context (Archival Science - Principle of):**
      *   **What it is:** The principle that a record's meaning is inseparable from information about its origin, custody, and the context of its creation. Understanding *who* created it, *why*, *when*, *under what rules*, and *how it was handled* is crucial.
      *   **Fit:** Directly addresses your core insight. To understand *any* record (like a 2015 ticket), you *must* understand the 2014 policy change requiring tickets for everything. The "costume" you describe is the record stripped of its provenance/context.
      *   **Unit of Analysis:** The record *plus* its chain of custody and creation context. Requires meta-data about the recording system.
      *   **Edges:** Primarily a methodological principle for interpreting individual records/collections, less focused on the *societal/systemic* forces shaping the entire archive.

  3.  **Informational Bias (Epidemiology/Statistics - a subtype of Selection Bias):**
      *   **What it is:** Systematic error in data collection methods that results in inaccuracy about exposures or outcomes. Examples include recall bias, measurement error, differential data quality.
      *   **Fit:** Captures the *mechanism* of distortion (e.g., the policy change *causing* the ticket inflation, the lack of process *causing* the wiki loss). It's a broader category encompassing your problem.
      *   **Limitations:** Tends to focus on data *quality* issues within a defined dataset for a specific analysis. Your concern is broader – the archive *as a whole* fundamentally misrepresents reality due to its creation/preservation structure. It often doesn't emphasize the *power* dynamics as centrally.
      *   **Relationship to Selection Bias:** Informational Bias is a *type* of Selection Bias where the selection happens at the level of *information* being recorded or captured accurately, rather than the selection of *units* (people, events) into the study. Your ticket volume inflation is classic informational bias due to changing measurement protocol.

  4.  **Tacit Knowledge & Invisible Work (Sociology/Management/STS):**
      *   **What it is:** Knowledge that is difficult to codify or transfer (Polanyi), and work that is essential but goes unrecognized or undocumented (often emotional labor, articulation work, "keeping the lights on").
      *   **Fit:** Explains *why* so much critical knowledge (build system) and work (contractors, quiet fixes) leaves no trace. It highlights the inherent limitation of formal records in capturing the full reality of complex systems and organizations.
      *   **Unit of Analysis:** The knowledge/action itself and its (non-)representation in the formal system.
      *   **Edges:** Focuses on the *nature* of what's missing rather than the *systematic distortion* of the archive as a whole.

  5.  **Infrastructural Inversion (STS - Bowker & Star):**
      *   **What it is:** The idea that we only truly see and understand an infrastructure (like your ticketing/wiki system) when it breaks down or changes. Your migration forced this inversion – you see the "messiness" of the recording system itself.
      *   **Fit:** Explains *why* you're seeing this so clearly now – the migration disrupted the "invisible" infrastructure of record-keeping.
      *   **Unit of Analysis:** The infrastructure itself and its normally hidden workings.
      *   **Edges:** More about the *moment of revelation* than the *ongoing distortion* the infrastructure causes.

  ### Synthesizing Your Description: The Archival Distortion Field
  Your phenomenon is the **systematic creation of an historical record where the signal is dominated by the noise of the recording apparatus itself.** It's characterized by:
  *   **Distorted Presence:** Events amplified or diminished based on recording conventions, not inherent importance (Ticket Inflation).
  *   **Structured Absence (Silences):** Gaps with identifiable causes (Lost Wiki, Lost Tacit Knowledge).
  *   **Embedded Power:** Who can create records determines who exists in the history (Contractors vs. Employees).
  *   **Tool/Process Artifacts:** The record reflects the evolution and quirks of the recording tools and processes.

  ### Addressing Your Specific Questions

  *   **Unit of Analysis:** The **record-creation event** *in its full socio-technical context*. You analyze *why* a specific piece of data was (or wasn't) created, by whom, using what tools/rules, and how it was (or wasn't) preserved. The "history" becomes a history of *these events and their patterns*.
  *   **Difference from General Selection Bias:** This *is* a form of selection bias (informational bias), but one deeply entangled with organizational power, cultural norms, technological affordances, and the inherent limitations of formal systems in capturing tacit knowledge/invisible work. The "shape" comes from analyzing *why* the selection happened the way it did.
  *   **Where are its edges?** It starts when the act of recording is shaped by factors *other than* a neutral desire to document reality. It ends when the record is a complete, unbiased (or minimally biased) representation – which is arguably never achieved. The "who has standing" part is **fundamentally integral, not separate.** Power dynamics in record creation are a *core driver* of the distortion.
  *   **The Photography Example:** **Yes, it's absolutely an instance.** The photo exists *only* because someone commissioned it. Its creation tells you about the commissioner's priorities, resources, and what they deemed worthy of recording, which may have little to do with the broader "reality" of the scene or event. The photo is evidence *of the commission*, not just the scene.
  *   **The Metric Example:** **Yes, it's the same phenomenon.** Stopping collection when the metric looks bad is a deliberate act of creating a *silence* to avoid negative evidence. It distorts the historical record by truncating the timeline precisely at the point where the information becomes uncomfortable, reflecting management priorities over objective measurement. It's informational bias driven by organizational politics.
  *   **Coverage & Coined Term:** No single established term perfectly covers the *entirety* of what you describe, as it synthesizes concepts from multiple fields. However, **"Archival Distortion Field"** captures the essence well:
      *   **Definition:** *The systematic and informative distortion present within a body of records, arising not from random error, but from the socio-technical processes and power dynamics inherent in the creation, capture, preservation, and loss of those records. This distortion manifests as both amplified/attenuated signals of events and structured silences, ultimately making the archive a more reliable witness to its own construction than to the events it purports to document.*
      *   **Instance Detection:** You have an instance of the Archival Distortion Field when:
          1.  Patterns in the record correlate strongly with changes in recording tools, policies, or personnel.
          2.  Significant events or actors known to exist are absent due to identifiable structural reasons (lack of standing, informal processes, lost media).
          3.  The volume or character of records changes without a corresponding change in the underlying activity being recorded.
          4.  The "metadata" about how/when/why/by whom records were created is *essential* to interpreting the "data" within them, often revealing more about the recorder than the recorded.

  ### Conclusion
  You've hit upon a fundamental truth: **archives are not transparent windows to the past; they are artifacts of the systems that produced them.** Your "history of the platform" is unavoidably a **history of the platform's record-keeping**. The power dynamics ("who has standing"), the tooling evolution, the lost migrations, and the cultural norms around what constitutes "work worth documenting" are *the actual subject matter* revealed by your analysis.

  What you're experiencing isn't just a data quality issue; it's an epistemological challenge inherent in reconstructing the past from partial, mediated traces. Historians and archivists spend their careers wrestling with this. The best you can do is be ruthlessly transparent about the nature of your sources, explicitly document the "distortion field" (the policies, tool changes, known losses, power structures) as part of the history itself, and acknowledge that the loudest voices in the archive are often the systems and managers, not the platform or the people who truly kept it running. Your most valuable insight might be precisely this map of the silences and distortions.
