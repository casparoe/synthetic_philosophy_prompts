prompt: |-
  I live in a cohousing community outside Asheville, about 40 households, and we have this woman — Barb, she's maybe 72, retired court reporter, never took a mediation class in her life — who has quietly become the person everybody goes to when two people want incompatible things and both feel strongly about it. She doesn't use any fancy words for it, but basically she brokers swaps: you give ground on the thing you care about, I give ground on the thing I care about, and we both come out able to live here. I've started keeping notes on which deals she'll help put together and which ones she flat refuses, partly because I read something once about "moral trade," the idea that people who disagree about what's right can still make fair exchanges with each other, and partly because she genuinely baffles me. Here's the track record so far, all real:

  - A member who thinks gambling is a sin had blocked our annual raffle for three years running. The raffle pays for the accessible van. Barb got them to a deal: proceeds still go to the van, the raffle moves off the common lawn to the fairgrounds, and he gets a paragraph in the newsletter explaining why he thinks it's wrong. She called that one "the easy kind."
  - A different member offered $15,000 to the buildings fund if we'd unbook the drag queen story hour we had on the fair schedule. She wouldn't even carry the offer to a vote.
  - Two households, one wants the sunny south plot for a big vegetable garden, the other can't sleep past 6. Deal: gardener gets the south plot, no power tools before nine, and he does her walk and steps all winter. Approved, no fuss.
  - One member offered another member $500 cash to flip his vote against the bylaw requiring a ramp into the common house. The guy taking the money said he honestly didn't care either way. Refused. All she'd say afterwards was "he was selling something that wasn't his to sell."
  - Our beekeeper and the neighbor with a genuinely bad phobia. Hives move off the property line, gentler stock, and the neighbor drops her demand for a total ban and pays half the moving cost. Approved.
  - An outside solar outfit offered us $40,000 a year for the upper field. The glare and the access road would mostly hit two households and the sledding hill, and nobody had asked either of them. Refused.
  - Two guys who'd been feuding since 2019 over a property line. One apologizes in front of everybody at the fall potluck, the other drops his complaint to the board. Approved. She said afterward, "that one's the opposite of a purchase."
  - A member offered to cover another member's property tax bill if he'd just stay home instead of testifying at the county hearing about his unpermitted addition. Refused.

  Here's the one she has to answer by the April meeting, and it's the reason I'm writing. Dale is 84, one of the original founders, and before his wife died he promised her the orchard would never be cut down. It's written into our founding documents in a vague way that everyone has always treated as binding. We're short on parking and the parking crowd wants the east half of the orchard. Their offer: the community pays for full-time in-home care for Dale for the rest of his life, which is real money, way more than that land is worth, and in exchange he releases the promise and lets them fell the east half. On top of that they want him to stand up at the meeting and say out loud that the promise was a private sentimental thing between him and his wife and was never meant to bind the community, so the bylaw can be amended cleanly. Everyone who stands to lose is at the table and willing — Dale wants the care, his daughter is the one who brought it to Barb, the board is on board, the households who'd get the parking are thrilled. Nobody outside the community gets charged for anything and nobody who isn't a member is affected. Barb has three weeks to say whether she'll help draft it.

  So: which way does she go? What I actually want is for you to work out what rule she's running, because I can't. Lay out the candidate rules that fit all eight of those verdicts equally well — I suspect there's more than one, and I suspect at least one obvious guess about money is already ruled out by the list — then say what each of those candidates predicts about Dale, then give me your best guess with your reasons for preferring it. And if her record genuinely doesn't settle Dale, say so plainly and tell me what principle she'd be committing herself to either way. Finally, describe one more case I could put to her, one she hasn't seen, that would tell the candidate rules apart, and what each rule would say about it — I'd rather test her than argue with her. Please don't send me to a bibliography or a reading list, I have no idea what the literature here even is and I couldn't get at it anyway.
reasoning: |-
  Hmm, this is a fascinating puzzle about Barb's mediation principles in a cohousing community. The user has observed eight real cases where Barb either approved or rejected proposed deals, and now needs to predict how she'll handle Dale's orchard situation. 

  First I notice Barb seems to distinguish between different types of exchanges. The gambling raffle compromise worked because both sides adjusted their positions (location change vs newsletter statement), while the drag queen story hour offer was rejected despite being financially generous. Money alone clearly isn't the deciding factor - the $500 vote-buying attempt was refused with that striking "not his to sell" comment. 

  Interesting how she treats collective resources differently too. The solar farm offer was rejected because it would impact specific members without their consent, whereas the beekeeper-phobia compromise involved mutual concessions (hive relocation + cost sharing). The property line feud resolution is particularly telling - she framed an apology as "the opposite of a purchase," suggesting some exchanges transcend transactional logic.

  Now for Dale's orchard dilemma: it's tempting to see this as straightforward since everyone consents and needs are met (care for Dale, parking for others). But that founding promise and the request for public renunciation give me pause. Barb's past refusals involved situations where something sacred was commodified (the drag event) or where consent was bypassed (solar farm). The vote-selling case especially echoes her "not his to sell" principle - is a deathbed promise "sellable"?

  The user wants me to reverse-engineer Barb's rules. From the pattern, I'd propose three possible principles: 1) The Integrity Rule (never trade core values/commitments), 2) The Consent Rule (require all affected parties' genuine buy-in), and 3) The Harm Principle (prevent irreversible losses to community bonds). All fit the eight cases but point differently on Dale - Integrity would reject it (promise is sacred), Consent would approve (all agree), Harm might hesitate over the forced renunciation.

  To test these, I'd suggest a hypothetical about trading childcare duties for voting rights. Integrity Rule would reject (voting isn't tradable), Consent Rule would approve if both agree, Harm Principle might worry about community inequality. 

  Ultimately I think Barb will reject Dale's deal. The demand that he publicly renounce the promise feels like violating something inviolable, much like the drag event or vote-selling cases. Her "easy kind" remark about the raffle deal suggests she draws sharp lines around certain boundaries - and deathbed vows might be one such line.
answer: |-
  Based on the 8 cases and her specific phrasing, Barb operates on a principle I'll call **The Integrity of Commitments Rule**. Here's the breakdown:

  **Core Principle:**  
  *Barb facilitates trades only when they involve the exchange of legitimate personal concessions or resources that parties have the right to negotiate. She rejects trades that:*  
  *1. Commodify core community values, shared resources, or irrevocable commitments.*  
  *2. Involve selling something that isn't truly the seller's to alienate (e.g., votes, testimony, collective assets, moral principles).*  
  *3. Harm non-consenting third parties or the community's foundational bonds.*

  ---

  ### How This Rule Explains All 8 Cases:
  1.  **Raffle Compromise (Approved):** Traded personal preferences (location change vs. newsletter space). No core values sold; both parties owned what they conceded.
  2.  **Drag Queen Story Hour (Refused):** Attempted commodification of a community event representing inclusion (a core value). Money can't buy the right to erase shared cultural commitments.
  3.  **Garden/Sleep Compromise (Approved):** Traded personal resources/actions (sunny plot vs. quiet mornings + labor). Legitimate personal concessions.
  4.  **Vote-Selling for Ramp Bylaw (Refused):** A vote is a fiduciary duty to the community, not personal property ("not his to sell"). Selling it corrupts self-governance.
  5.  **Beekeeper/Phobia (Approved):** Traded tangible resources/actions (hive location + bee stock vs. cost-sharing + dropping ban demand). Affected parties negotiated their own stakes.
  6.  **Solar Farm Lease (Refused):** Outsider money commodifying shared land. Harmed non-consenting third parties (affected households + lost community space). Collective asset wasn't the board's alone to sell.
  7.  **Property Feud Apology (Approved):** Non-transactional repair ("opposite of a purchase"). Addressed the actual injury (disrespect) with a matching remedy (public apology). Restored relationship integrity.
  8.  **Tax Payment for Silence (Refused):** Testimony is a civic/legal duty; selling silence commodifies integrity and obstructs justice. Not his to sell; harms the community's legal standing.

  ---

  ### Prediction for Dale's Orchard Case: **Barb Refuses**
  *   **Why:** The deal violates the core principle in multiple ways:
      *   **Commodifying a Sacred Commitment:** Dale's promise to his wife is an irrevocable personal *and* community vow (embedded in founding docs). Trading it for cash care turns a sacred commitment into a financial transaction.
      *   **Selling What Isn't His Alone:** The promise binds the *community* ("never be cut down"). Dale cannot unilaterally "sell" the community's obligation to honor its founding ethos, even if he's the beneficiary. The land is communally significant.
      *   **Forced Renunciation = Harm:** Requiring Dale to publicly renounce the promise's validity inflicts moral harm *on him* (breaking his vow) and *on the community* (eroding trust in foundational commitments). It turns a personal tragedy into a transactional betrayal.
      *   **Precedent:** Like refusing to sell a vote (#4) or testimony (#8), this sells the *meaning* of a commitment, not just a resource. Like refusing the solar deal (#6), it treats a collective legacy as a salable asset.

  ---

  ### Candidate Rules Tested & Why Integrity of Commitments Wins:
  1.  **"Maximize Welfare/Pareto Efficiency" (Ruled Out):**  
      *   Fails: Drag Queen refusal (#2) prevents a clear welfare gain ($15k for buildings). Solar refusal (#6) rejects $40k/year. Dale's deal seems Pareto optimal (all consenting parties gain). Barb explicitly rejects pure welfare maximization.
  2.  **"No Money Exchanges" (Ruled Out):**  
      *   Fails: Money isn't the issue. She approves trades involving labor/value (Garden #3, Beekeeping #5) and refused non-monetary corruption (Vote #4, Testimony #8). Money in Dale's deal isn't the core problem.
  3.  **"Require Full Consent" (Plausible but Insufficient):**  
      *   *Fits:* All cases involve consenting parties or refusal when consent is missing (#6) or invalid (#4, #8).  
      *   *Fails:* Doesn't explain *why* drag story hour (#2) or vote-selling (#4) are invalid even with consent. Doesn't capture the sacred/collective element. Consent is necessary but *not sufficient* for Barb.
  4.  **"Integrity of Commitments" (Best Fit):**  
      *   *Fits All:* Explains *why* consent isn't enough in #2 (core value), #4 (fiduciary duty), #6 (collective asset/harm), #8 (civic duty), and approves genuine concessions (#1, #3, #5) and non-commodified repair (#7). It captures the "not theirs to sell" and anti-commodification logic explicitly stated (#4) and implied (#2, #6, #8).

  ---

  ### If You Need to Test Her: Propose This Case
  **Scenario:** *A devout member believes our common house should never serve meat for ethical reasons. They offer to fundraise and pay for a brand-new commercial vegan kitchen for the common house if the community votes to ban all meat from community events forever. The kitchen would objectively benefit everyone. Most members eat meat but don't feel strongly about community events being meat-free if the kitchen is that good. The board is neutral.*

  *   **What Barb's Integrity Rule Predicts:** **Refusal.**  
      *   *Why:* The offer commodifies a core community practice (shared meals/food freedom) in exchange for infrastructure. It sells the community's right to self-determine its food culture to an individual's ethical stance using money, harming the collective's autonomy (similar to #2 & #6). The ethical commitment isn't a tradable concession; it's an imposition bought with cash.
  *   **What "Full Consent" Rule Predicts:** Approval (if vote passes).  
  *   **What "Welfare Maximization" Predicts:** Approval (massive gain for minor sacrifice).

  This test case isolates commodification of a core communal practice vs. legitimate concession-trading, revealing whether her core principle is about consent/welfare or protecting the non-tradable foundations of the community.

  **In summary:** Barb protects the community from transactions that corrupt its foundational commitments, fiduciary duties, or shared values – even when money is big and parties consent. Dale's orchard deal asks him to sell a sacred vow and the community's heritage. She will refuse. Her principle is the **Integrity of Commitments**.
