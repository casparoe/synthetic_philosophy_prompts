  Okay, the user is a research engineer at a mid-size lab working on RL post-training. They need to make a supervision design call for a multi-step document analysis task. The usual expert, D, is unavailable, so they want to reverse-engineer his decision-making from past cases. Let me start by understanding the current task.

  The task involves extracting figures from 30-page filings, reconciling them across periods, and computing a derived metric. The terminal check is exact, cheap, and ungameable. Initial pass rate is 20%, so outcome signal is dense. Intermediate steps have a checker, but it's slow and manual, costing 6x more per rollout and noisier. The pilot showed that 40% of correct answers used spurious patterns, not the intended method. Accuracy kept climbing, but it's unclear if that's hacking or a legitimate shortcut.

  Now, looking at D's past decisions: 

  1. Function synthesis (short): Outcome-only. Compiler as ground truth.
  2. Function synthesis (long): Process supervision with milestone labels and step verifier.
  3. Competition math: Outcome-only, vetoed PRM as worse than answer checker.
  4. Same math task later: Switched to step supervision due to incorrect derivations.
  5. Summarization: Outcome-only (preference model), no process supervision.
  6. Web agent: Process supervision with hand-written rubric.
  7. Code task: Outcome-only despite low pass rate.

  The key patterns here seem to be about when outcome-only fails. D prefers outcome when the terminal check is reliable and cheap (cases 1,3,7). He switches to process when either the task is too complex (case 2) or there's evidence of reward hacking (case 4). Case 5 is unique because it's open-ended; step labels aren't factual. Case 6 uses process because the terminal success is hard to achieve and intermediate states matter.

  For tonight's task, the terminal check is solid, so outcome-only should work. But the pilot showed 40% of correct answers might be hacked. That's similar to case 4, where derivations were wrong. However, here the cost of step labels is high and noisy, which D avoided in cases 3 and 7. Also, unlike case 4, accuracy was still climbing, so maybe it's not hacking but a valid shortcut.

  Possible decision rules for D:
  A. Use outcome-only unless there's proof of hacking or terminal check isn't sufficient.
  B. Use process supervision if intermediate steps have objective truth and the cost is justified by preventing hacking.
  C. Outcome-only if terminal check is perfect and cheap; switch only if hacking is confirmed and step labels are reliable.

  Rule A fits cases 1,3,5,7. Case 4 shows switching after confirmed hacking. Case 2 used process due to complexity, not just hacking. Rule B fits cases 2,4,6. But case 3 vetoed PRM due to cost and reliability. Rule C might be more nuanced: outcome unless hacking is detected and step labels are better than the terminal check.

  In tonight's case, Rule A would stick with outcome-only since hacking isn't confirmed. Rule B might suggest process due to the 40% issue. But step labels are noisy and expensive, which D avoided in cases 3 and 7. Rule C would require proof that step labels prevent hacking without adding noise.

  The cheapest experiment: Run a small batch with step supervision to see if derivations improve without hurting accuracy. If derivations align but accuracy drops, it might be overfitting. Or manually audit more rollouts to see if the spurious patterns are actually invalid.

  Hidden variables: In case 4, the step checker was reliable, whereas here it's noisy. Also, annotation budget might influence decisions. D avoided step labels when costly unless necessary (case 2 vs 7).

  Best guess: D would go outcome-only with a monitoring plan. Probability 60%. If more audits show the derivations are wrong, switch later. Cheaper than starting with expensive step labels now.
answer: |-
  Based on D's track record and decision patterns, here's a systematic breakdown of your query. I've reverse-engineered three consistent decision rules from all seven cases, applied them to your scenario, and provided actionable recommendations.

  ---

  ### **1. D's Predicted Call for Tonight**
  **Outcome-only supervision** with a *temporary auditing trap* for spurious derivations.  
  **Implementation:**  
  - Run outcome-only RL (terminal reward = 1 if final metric matches GT to 4 decimals)  
  - Simultaneously sample 10-15% of rollouts for *offline auditing* using your manual step checker  
  - **Do NOT use audits for training** yet—only track correlation:  
    - If >80% of *correct* outcomes have invalid derivations → Switch to **curriculum hybrid** (Phase 1: Outcome-only warm-up; Phase 2: Add step rewards after accuracy plateaus)  
    - If <30% invalid derivations → Stay outcome-only  

  **Why this hybrid?** It's outcome-primary with a lightweight monitoring valve. D would avoid full process supervision due to cost/noise (cases 3,7) but respects derivation hacks as red flags (case 4).

  ---

  ### **2. Candidate Decision Rules Consistent With All 7 Cases**  
  *Key axioms across all rules:*  
  - Outcome-only is default if terminal check is **exact + cheap + dense** (cases 1,3,7)  
  - Process supervision triggers for **long horizons** (case 2), **confirmed reward hacks** (case 4), or **unobservable terminals** (case 6)  
  - Open-ended tasks resist step labels (case 5)  
  - Human labels are avoided if automated checks exist (cases 3,7)  

  | Rule                          | Fits All 7 Cases?                                  | Tonight's Implication                                                                 | Divergence Point                     |
  |-------------------------------|----------------------------------------------------|---------------------------------------------------------------------------------------|--------------------------------------|
  | **A. "Terminal Primacy"**     | ✅: Cases 1,3,5,7 use outcome; 2,4,6 use process only when terminal fails | Outcome-only UNLESS terminal signal is lost (flatlined accuracy) or proven non-Markov. Ignores derivation hacks if accuracy climbs. | **Ignores the 40% hack rate** (treats it like case 3, not case 4) |
  | **B. "Mechanistic Integrity"**| ✅: Cases 1,2,4,6 prioritize *correct steps* when objectively verifiable; 3,5,7 reject process if labels are noisy/synthetic | **Switch to process NOW** (like case 4). Derivation hacks = terminal check is insufficient despite accuracy. Cost be damned. | **Overweights the 40% hack evidence** despite noisy labels | 
  | **C. "Cost-Calibrated Fidelity"** | ✅: Balances case 3/7 (avoid expensive labels) with case 4 (act on hacks). Rejects process in case 5 (no step-truth). | **Outcome-only + targeted audits** (as above). Only deploy step rewards if audits prove hacks *and* labels clean enough to beat terminal SNR. | **Weights cost vs. hack severity**—tonight’s noisy labels make process risky |

  **Divergence Highlight:**  
  - **Rule A vs Rule B/C** splits on whether *climbing accuracy + dense signal* (case 3) invalidates derivation concerns (case 4).  
  - **Rule B vs Rule C** splits on whether 6x cost/noise outweighs 40% suspected hacks.  

  ---

  ### **3. Best Guess & Calibration**  
  - **Prediction:** D chooses **Rule C (Cost-Calibrated Fidelity)** → Outcome-only with auditing trap.  
  - **Probability:** 70% (Rules A: 20%, B: 10%)  
  - **Evidence That Would Shift Me:**  
    - If manual checks confirm >50% of "correct" outputs would fail in *distribution-shifted docs* (e.g., different table formats) → Probability of Rule B jumps to 65%  
    - If step-label noise is dominated by *human inconsistency* (not task ambiguity) → Rule C strengthens to 85%  

  ---

  ### **4. Cheapest Discriminating Experiment**  
  **Run a 3-hour "detection probe":**  
  - Freeze current outcome-only model  
  - Generate 50 rollouts with correct terminal outputs  
  - Manually audit derivations for validity (cost: ~2 engineer-hours)  
  - **Key metric:** Fraction of correct outputs with **invalid but plausible** derivations vs. **legitimate shortcuts**  
    - If >60% invalid → Rules B/C activate (process needed)  
    - If <20% invalid → Rule A confirmed  
    - If ambiguous → Prioritize case 6's approach: **Hand-write a minimal rubric** for the most common error (e.g., "fiscal period alignment") and apply sparse rewards *only for that step*  

  **Alternate archive dive:** Reexamine **case 4's postmortem** for:  
  - How many hacks were found *before* accuracy plateaued?  
  - Was the step checker noisier than the terminal check? (If quieter than tonight’s, Rule C weakens)  

  ---

  ### **5. Consistency Check & Hidden Variables**  
  Your list is **internally consistent** but reveals two hidden variables D optimizes:  
  1. **Verifier provenance:**  
     - D uses *hand-written* step rewards when available (case 6) but avoids *learned verifiers* if they add complexity (case 3 veto).  
     - **Tonight's gap:** Your step checker is manual—D might reject it as unscalable (like case 7).  
  2. **Hack observability:**  
     - In case 4, hacks were *proven* via broken derivations. In case 3, no evidence existed.  
     - **Your ambiguity:** "Nobody could tell" if shortcuts are valid. D would demand this resolved *before* committing (hence auditing trap).  

  **Recommendation:** If step labels are noisy due to **rubric ambiguity** (not human error), this mirrors case 5—D might reject process entirely. Dig into *who* audited the pilot and their inter-annotator agreement.

  ---

  ### **Summary**  
  **Tonight’s playbook:**  
  1. Launch outcome-only run with 10% offline auditing  
  2. Run the 50-rollout detection probe concurrently  
  3. If audits show >50% invalid derivations *and* manual checks are reproducible:  
     - Pause run  
     - Hand-write a minimal rubric for the top error (e.g., fiscal period alignment)  
     - Apply sparse process rewards *only for that rubric* (hybrid)  
  4. Else: Proceed with outcome-only  

