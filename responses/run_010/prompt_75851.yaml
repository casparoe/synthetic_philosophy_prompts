  Alright, let's tackle this query. The user is convening a grad reading group stuck on the standing-to-blame literature. They've hit an impasse with three camps: Wallace-style moral address, Fritz/Miller comparativists, and sceptics who think "standing" is just a label. The user suspects it's not one disagreement but three different questions lumped together: fittingness, permissibility, and the existence of normative authority. 

  First, I need to parse each camp's arguments and their case examples. The moral address group focuses on hypocrisy as a failure of second-personal authority. The comparativists point to cases where the blamer's worse conduct voids standing even without addressing anyone. The sceptics argue that standing isn't a distinct status but reducible to other factors like insincerity or proportionality.

  The user’s hypothesis about three separate questions seems plausible. Let me verify if fittingness (is the blame appropriate?) and permissibility (is the person allowed to blame?) can come apart. For instance, a hypocrite’s blame might be unfitting due to inconsistency but still permissible if it corrects wrongdoing. Meanwhile, the sceptics challenge the very framework of normative authority.

  Next, considering the cases each camp handles poorly. The address theory struggles with private blame or blaming the dead, where no second-personal address occurs. Comparativists might mishandle cases where a less blameworthy person blames someone worse, yet it still feels off—like a recovering addict blaming a current user. Sceptics dismiss these intuitions as explainable by other factors.

  The substantive core likely revolves around Darwallian authority. If standing is about the authority to hold others accountable, that’s a meta-normative debate. The user mentions that stipulating definitions won’t resolve this, so the group needs to confront whether moral accountability requires mutual recognition.

  For progress, distinguishing the three questions explicitly could help. Testing cases where fittingness and permissibility diverge might clarify. Also, examining non-hypocritical blamers with clean hands but poor delivery (tactless but permissible blame) could isolate variables. The sceptics need cases where all reducible factors are controlled, yet standing still seems absent.

  The user’s deeper need is to break the deadlock and provide a path forward. Circulating this analysis in British English is practical, but they need actionable steps. Maybe synthesizing the disagreements into a framework where each camp’s concerns are validated but compartmentalized. Emphasizing that the core issue is meta-normative might shift their focus from case battles to underlying assumptions.
answer: |-
  Right, let's crack this. Based on your description of the impasse and the arguments flying about, your hypothesis is largely spot-on, but it needs sharpening and the substantive core needs extracting from the verbal tangle. Here's the diagnosis and prognosis, tailored for your group.

  **Diagnosis: A Tripartite Tangle**

  You're absolutely right that the camps are often answering **distinct questions** masquerading as one debate about "standing". However, this isn't *just* verbal slippage; there's a substantive disagreement lurking beneath, primarily about the **foundations of second-personal authority**. The sceptics are also making a distinct methodological claim. Let's dissect the threads:

  1.  **The Fittingness Question (Wallace-Style Camp):**
      *   **What they're asking:** Is the hypocrite's *act of blaming* itself **internally inconsistent** or **performatively flawed**? Does it fail *as* a piece of moral address because it violates the norms implicit *in* that very practice (e.g., claiming an authority/equality one lacks through one's own conduct)?
      *   **Their Core Claim:** The defect is inherent in the *performance* of blame as a second-personal demand. It's unfitting *for this agent* to make *this demand* on *this occasion* because their own conduct undermines the presuppositions of the address. The dead/private blame cases *challenge* them because they seem to involve blame without performative address.
      *   **Thread:** Primarily about the *nature and norms of the blaming act itself*.

  2.  **The Permissibility Question (Fritz & Miller-Style Camp):**
      *   **What they're asking:** Does the hypocrite's own conduct generate a **pro tanto reason against** their performing the act of blaming? Is it *objectionable* or *impermissible* for *them* to blame, specifically *because* they are comparably or more blameworthy?
      *   **Their Core Claim:** The defect is comparative unfairness or objectionability. The hypocrite lacks the "right" or "standing" because their blame creates an objectionable comparative situation (they escape censure while imposing it). This handles private/dead blame well – it's still objectionable *for them* to (even mentally) condemn when they are equally/more guilty. It struggles when the hypocrite's blame seems unfitting *even if* their own fault is arguably *less* severe or of a different, non-comparative kind, or when a much less blameworthy person's blame still feels off for non-comparative reasons (e.g., tactlessness amplified by minor fault).
      *   **Thread:** Primarily about *reasons for/against an agent performing an action* (blaming).

  3.  **The Ontological/Methodological Question (Sceptics):**
      *   **What they're asking:** Is "standing to blame" a **distinct normative primitive** or status (like Darwallian authority), or is it merely a **label** aggregating other familiar normative factors (reasons of fittingness, permissibility, effectiveness, sincerity, etc.) that explain why blaming might be criticisable?
      *   **Their Core Claim:** Invoking "standing" adds no explanatory power. Any case where blame seems defective due to hypocrisy can be fully explained by citing: (a) Insincerity (they don't *really* believe the norm binds, given their violation), (b) Unfittingness (as above), (c) Impermissibility (reasons against *them* blaming, often comparative), (d) Poor consequences (it won't be effective, might cause resentment), (e) Lack of proportionality, etc. The word "standing" just obscures this.
      *   **Thread:** A meta-level claim about normative theory construction and parsimony.

  **The Substantive Core: Second-Personal Authority**

  Beneath the questions about fittingness and permissibility lies a **genuinely substantive disagreement** between the Wallace/Darwall-influenced camp and the sceptics (with the comparativists potentially leaning either way):

  *   **The Darwallian View:** Interpersonal moral blame *necessarily* involves invoking a distinctive kind of **second-personal authority**. It presupposes a normative relationship of mutual accountability between free and rational agents. When you blame me, you implicitly claim the authority to demand that I recognise the validity of the demand and hold myself accountable. Hypocrisy undermines *this specific claim to authority* because you fail to hold *yourself* accountable to the same standard, violating the reciprocity inherent in the authority relationship. "Standing" *is* this authority.
  *   **The Sceptical/Reductive Challenge:** This "authority" is a fiction or unnecessary theoretical posit. All the normative work is done by the agent-relative reasons *for* and *against* blaming (fittingness, permissibility, consequences, etc.) and the background moral facts about wrongdoing. The "second-personal address" aspect is just a description of the social practice, not evidence for a unique normative bedrock. The feeling of authority being undermined *is* just the experience of recognising the unfittingness or impermissibility.

  **Why the Impasse?**

  1.  **Talking Past Each Other:** Camp 1 hears Camp 2's cases and insists, "Yes, but that's *why* it's unfitting as address!" Camp 2 hears Camp 1 and says, "The unfittingness *is* the reason it's impermissible!" Camp 3 hears both and says, "You're both just describing different reasons bundled under 'standing'."
  2.  **Case Selection as Weaponised Intuitions:** Each camp selects cases that highlight the explanatory power of their favoured concept (fittingness, permissibility, reducibility) and exposes the weaknesses in the others. The "data" (intuitions) are contested because different camps are sensitive to *different normative features* in the cases. The Wallace camp is attuned to performative inconsistency; the comparativists to unfairness; the sceptics to explanatory redundancy.
  3.  **The Sticky Core:** The argument about whether second-personal authority is a fundamental normative primitive or a dispensable construct is inherently deep and resistant to simple resolution. It touches on fundamental views about the nature of morality itself (is it fundamentally relational/demand-based or reason/value-based?).

  **Prognosis: Pathways to Progress (or at least, Clearer Trenches)**

  Forget forcing consensus. Aim for **conceptual clarity** and **identifying the core substantive battleground**. Here's how:

  1.  **Rigorous Distinction of Questions:** *Force* every argument and case analysis to explicitly state which question(s) it targets:
      *   Q1 (Fittingness): "Is this act of blame *internally flawed* as a piece of moral address, regardless of consequences or the blamer's other rights?"
      *   Q2 (Permissibility): "Are there *sufficient reasons* (e.g., fairness, hypocrisy, likely effects) *against* this agent performing this act of blame?"
      *   Q3 (Ontology): "Does explaining the defect here *require* positing a distinct normative status ('standing') beyond reasons of fittingness, permissibility, etc.?"
      *   Q4 (Substantive Core): "Does interpersonal blame *necessarily presuppose* a distinctive second-personal authority?"
      *   **Action:** Analyse your central hypocrisy case *separately* through each lens. Then apply to the contested cases (private blame, minor hypocrite, dead target).

  2.  **Targeted Case Crafting:** Design cases to pry apart the questions:
      *   **Fittingness without (Strong) Impermissibility?** A *slightly* hypocritical blamer (e.g., fiddled expenses once, years ago, confessed, repaid) accurately blames a chronic offender. Is the blame *unfitting* (performatively flawed) even if there might be *some* reason to permit it (it's accurate, might reform the offender)? Or is the minor hypocrisy enough to undermine the address?
      *   **Permissibility without Fittingness?** A morally pristine individual delivers accurate blame in an incredibly tactless, humiliating, self-righteous way. The blame seems *unfitting* as address (violates norms of respect), but is it *impermissible*? (Probably not, but does it feel like a "standing" issue?).
      *   **"Standing" without Hypocrisy?** Can someone with "clean hands" *still* lack standing for non-comparative, non-address reasons? (Sceptics say no, it's always reducible; others might point to conflicts of interest, lack of relationship, or the sceptics' own factors like insincerity). *Can the sceptics explain all intuitions about defective blame without *ever* needing "standing"?*
      *   **The Authority Test:** Imagine blame delivered *without* any claim to second-personal authority – purely as a third-personal assessment ("Your act was wrong") or a prediction ("People will condemn you"). Does this lack the *sting* or distinctive force of interpersonal blame? Does it bypass the "standing" issue entirely? If so, that supports the Darwallian view.

  3.  **Confront the Substantive Core Head-On:** Shift focus *temporarily* away from hypocrisy cases. Debate directly:
      *   *What, fundamentally, are we doing when we interpersonally blame?* Is it making a demand, expressing an attitude, stating a fact, trying to influence behaviour? Your answer here heavily predetermines your stance on Q4.
      *   Does the *wrongdoer* genuinely *owe* a response (acknowledgment, apology, justification) *to the blamer* specifically, in virtue of the blamer's normative status? Or is the "debt" owed to morality/victims/society, and the blamer is merely pointing it out?

  4.  **Formal Comparison (Handle with Care):** While tempting, a "formal treatment of comparative blameworthiness" is unlikely to resolve the core dispute. It might refine the *comparativist* account (Camp 2) by specifying thresholds or weighting factors for when comparative fault voids permissibility. But it won't touch the fittingness question (Camp 1) or the sceptical challenge (Camp 3). It *might* be useful *within* the permissibility debate to test intuitions about degrees of hypocrisy.

  5.  **Acceptance of Stalemate (for now):** Progress might simply mean recognising that:
      *   Hypocrisy's impact on blame is multifaceted (fittingness *and* permissibility *can* come apart).
      *   The intuition that hypocrites lack "standing" is likely tracking *both* the unfittingness of their address *and* the objectionability (impermissibility) of their blaming given their conduct.
      *   The fundamental disagreement about second-personal authority is a deep rift in moral philosophy. Resolving it isn't likely in a reading group, but *locating* it clearly is progress.
      *   **This *is* what happens when folk categories get theorised.** "Standing" is a pre-theoretical intuition pointing to a cluster of normative concerns. Different theories illuminate different facets of the cluster. The map is not the territory.

  **Recommendation for Your Group:**

  Start your next session by **formally adopting the four questions (Q1-Q4)**. Insist that every intervention specifies which question(s) it addresses. Revisit key cases with this framework. Then, deliberately pivot to discuss **Q4 directly**: "Setting hypocrisy aside, *what is interpersonal blame?* Does it *require* the blamer to possess a special normative authority?" This forces engagement with the deepest fault line. If the sceptics hold their ground, the debate might shift to whether their reduction truly captures the *phenomenology* and perceived normative force of being blamed by another person.

  The impasse won't vanish, but the trenches will be better dug, the misunderstandings reduced, and the *real* battle lines clearly marked. That’s substantive progress, even without a victor. Good luck—sounds like a brilliantly frustrating group to be stuck in!
