answer: |-
  The core principle you're grappling with has no single universally agreed-upon name, but it's absolutely recognizable to philosophers of mind and epistemology. **Let's call it the "Indistinguishability Reduction Principle" (IRP)**, defining it as follows:

  > **IRP**: If a subject cannot distinguish (from the inside) between two experiential episodes (e.g., veridical perception vs. perfect hallucination, genuine memory vs. perfect pseudomemory, sincere testimony vs. perfect lie), then:
  >    1.  *(Metaphysical Claim)* The episodes share a fundamental, common core element constituting the subject's conscious state ("the given," the "phenomenal character," the "seeming").
  >    2.  *(Epistemic Claim)* The subject possesses identical evidence or justification in both cases regarding the external world fact in question (e.g., whether the apple exists, the event happened, the statement is true).

  **Crucially, IRP is one principle with two distinct, often conflated, components.** Resisters target one or both, and the debates are highly live.

  ### The Carving: One Principle, Two Claims, and the Resistance

  1.  **The Metaphysical Claim (Common Kind):** This asserts that the *intrinsic nature* of the conscious state is identical in the good and bad cases. What it's *like* for the subject is fundamentally the same. The external object/truth is not a constituent of the conscious state itself but is (in the good case) merely *related* to it causally or otherwise.
      *   **What Resisters Resist:** **Disjunctivists** (e.g., McDowell, Snowdon, Martin) vehemently deny this. They argue the veridical perception is a *sui generis* state, fundamentally different in kind from a hallucination, even if indistinguishable from the inside. The apple is *constitutively* present in the veridical experience, not merely a cause of it. The good case isn't "bad case + luck"; it's a different beast entirely.
      *   **Denial Amounts To:** A claim about the nature of experience itself. The disjunctivist says the phenomenal character *is* (partially) constituted by the actual presence of the object/fact in the good case. They *do* owe an explanation for indistinguishability: typically, they argue that while the *kinds* of state differ, our capacity for introspective discrimination is limited. We can only access a superficial "common factor" (like the *appearance* of an apple) that doesn't reveal the underlying metaphysical difference. They often appeal to relational properties of experience.

  2.  **The Epistemic Claim (Epistemic Parity):** This asserts that the subject's *justification* for believing the external world proposition (e.g., "there's an apple") is identical in both cases. The evidence provided by the experience itself doesn't favor the good case over the bad one. The external fact is always an "inference" beyond the given evidence.
      *   **What Resisters Resist:** **Epistemological Externalists** and **Disjunctivists** resist this, though for different reasons. Externalists (e.g., reliabilists like Goldman) might grant the metaphysical common factor but argue justification depends on *external* facts (like the reliability of the process). In the good case, the process *is* reliable, so justification *is* present, even if the internal state is the same. **McDowellian Disjunctivism** argues that in the veridical case, the subject is *directly open* to the fact itself, which constitutes a different kind of reason or warrant. The evidence *is* different: in the good case, it's the *fact itself making itself manifest*.
      *   **Denial Amounts To:** A claim about evidence and justification. Resisters argue that the *epistemic significance* of the experience differs radically between the cases, even if the subject can't tell them apart introspectively. The denial often involves rejecting "internalism" about justification (the view that justification depends solely on internal states accessible to the subject).

  **The Slide:** You're exactly right that proponents of IRP often slide between (1) and (2). They argue that the metaphysical commonality (1) *entails* epistemic parity (2). Resisters challenge this entailment. **It *is* stable to resist one while granting the other, though it requires careful argument:**
  *   Grant (1) but deny (2): Accept a common phenomenal state but argue justification depends on external factors (Externalist Response).
  *   Deny (1) and deny (2): Argue the experiences differ metaphysically, hence the evidence differs (Strong Disjunctivist Response).
  *   Grant (2) but deny (1): This is rarer and less stable. If the evidence is identical, it strongly suggests a common element is providing that evidence.

  ### Key Disputed Questions & Your Extensions

  *   **Actual vs. Possible Indistinguishability:** This is **hotly disputed**.
      *   *Pro-IRP:* The *mere possibility* of a subjectively indistinguishable bad case is sufficient to trigger IRP. If a perfect hallucination *could* happen, then even in the actual good case, I only ever have access to the seeming, not the fact itself (this fuels skepticism).
      *   *Anti-IRP (Disjunctivists):* Often argue that the possibility of hallucination doesn't impugn the actual nature of veridical perception. They might also argue that *actual* indistinguishability in specific cases relies on specific mechanisms (e.g., neural similarity) that don't imply a *fundamental* metaphysical commonality applicable to *all* perception. The focus is on the *actual* good case.
  *   **Extension to Memory & Testimony:** This is **absolutely recognized and a major point of debate**. The arguments are structurally identical:
      *   *Memory:* The "Common Kind" view sees remembering and (perfect) seeming-to-remember as sharing a core mental state; the past event is external. Disjunctivists (e.g., Soteriou) argue genuine remembering constitutively involves the past event.
      *   *Testimony:* Reductionists argue hearing sincere testimony only provides "truth-sounding" evidence; the actual truth is inferred. Anti-reductionists (e.g., some followers of Reid, or Coady) argue we can sometimes directly grasp the truth through testimony. IRP underlies the reductionist position.
      *   **Stability of Selective Rejection?** It's **unstable and generally considered ad hoc** to reject IRP for perception but accept it wholesale for memory or testimony. The core arguments (indistinguishability -> common core -> epistemic limitation) apply equally. A disjunctivist about perception should logically extend it to memory ("episodic disjunctivism"). Resisting it for one domain usually requires a principled reason why *that domain* is different (e.g., maybe testimony relies on perception/memory, so if perception/memory is secure, testimony can be too – but this is complex).

  ### How IRP Differs from Ordinary External-World Skepticism

  *   **Ordinary Skepticism:** Argues we could always be wrong (e.g., dreaming, deceived by demon/BIV). It often starts from the *fallibility* of our faculties or the *logical possibility* of global deception. It *can* be argued without invoking IRP (e.g., Descartes' demon doesn't require specific hallucination arguments).
  *   **IRP:** Provides a *specific mechanism and metaphysical picture* for skepticism. It argues that the *very nature of experience/memory/testimony* limits us to "seemings" because of the *structural possibility* of perfect non-veridical counterparts. It demotes the good case *metaphysically and epistemically* based on the bad case. Skepticism is a *consequence* of applying IRP.

  ### The State of Play: Settled vs. Live

  *   **Settled:** The core *move* (IRP) is well-known and pervasive. Its application to perception, memory, and testimony is standard. The distinction between the metaphysical and epistemic claims is recognized by sophisticated participants in the debate. Disjunctivism is a major, established counter-position.
  *   **Live Disputes:** Almost everything else!
      *   **Is the Common Kind Claim true?** This is the central battleground in philosophy of perception (Disjunctivism vs. Conjunctivism/Common Kind Theories).
      *   **Does the Common Kind Claim entail Epistemic Parity?** Disputed. Externalists argue no, internalists often argue yes, disjunctivists argue the premise is false.
      *   **Is mere possibility enough, or is actual indistinguishability required?** Disputed, with significant implications for skepticism.
      *   **Can IRP be consistently resisted across different domains (perception, memory, testimony)?** Disputed. Extending disjunctivism beyond perception is an active area.
      *   **What *is* the positive account of the good case if IRP is rejected?** Disjunctivists owe an account of how we can be directly aware of facts. Anti-skeptics owe accounts of justification that aren't undermined by IRP.

  In essence, you've zeroed in on a fundamental engine driving much of modern epistemology and philosophy of mind. The "Indistinguishability Reduction Principle" captures the core move: the threat of a subjectively identical bad case forces a retreat to a common, internal core ("seeming") in *all* cases, relegating the external truth to a separate, problematic status. Resisters fight this retreat on both metaphysical and epistemic grounds, arguing that the good case is genuinely different and better. The disputes are deep, ongoing, and central to understanding our place in the world.
