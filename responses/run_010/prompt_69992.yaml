prompt: |-
  I am assisting with the consent and eligibility documents for a proposed clinical programme in which synthetic units replicating the input–output profile of biological neurons would be substituted, one at a time, into the brains of patients with a slowly progressive neurodegenerative disease. Before I sign off on anything, I need to know whether my own survival intuitions about such a procedure hang together. What follows are my verdicts on a battery of variants I have been working through, together with a statement of what I want out of you. In each case, assume the substrate, the clinical setting, and everything not explicitly varied are held fixed.

  1. One neuron at a time, over twenty years, each unit constructed from a scan of the neuron it displaces and installed in situ with the same connections. Verdict: the patient survives, and is plainly the same person at the end.

  2. The identical end state reached in a single overnight operation from a full scan, under anaesthesia. Verdict: the patient does not survive. Nothing distinguishes this from case 1 except the path by which the end state was reached, and I cannot make that difference carry the weight I am putting on it.

  3. The twenty-year procedure carried out as twenty annual operations, each replacing one whole region in a burst rather than one neuron at a time. Verdict: I waver. The overall rate of change is the same as in case 1, so whatever I am tracking there is not simply how slowly the total transformation happens.

  4. Each replacement runs in parallel with the original neuron for a week, both discharging the same function, the biological one then being switched off. Verdict: survives, and I am more confident here than in case 1, though I cannot see why an interval of redundancy should make survival more secure rather than less.

  5. Substitution proceeds from occipital to prefrontal. Verdict: survives. From prefrontal to occipital: survives, but with noticeably less conviction. I suspect the asymmetry is an artifact of my intuitions and would like to be told so.

  6. The units reproduce the cellular function but not the internal dynamics: no action potentials, a different physical realization of an equivalent transfer function. Verdict: survives. By contrast, a synthetic brain reproducing whole-organism behaviour exactly, with an internal state-space bearing no systematic relation to the patient's own, and no neuron-level correspondence at all. Verdict: does not survive, despite organism-level functional equivalence. My intuitions are therefore keyed to something sub-personal, and I cannot say what.

  7. Replacement stops at thirty percent. Verdict: obviously survives. Stops at seventy percent: survives, but I hesitate. I can name no threshold.

  8. Case 1, except that each new unit is marginally better than the one it replaces, faster and less noisy, so that the patient ends measurably sharper with no discontinuity anywhere along the way. Verdict: survives, and improved. Case 1, except that each new unit is marginally different in temperament rather than better, no gain and no loss, ending in someone the family describes as recognizably him but not quite the same man. Verdict: I want to say he survives less, or not at all. I recognize that these two verdicts cannot both stand unless improvement is doing work that identity has no business doing.

  9. Each installed unit is permitted to self-modify; ten years on, the patient's tastes and temper have changed substantially and the architecture resembles nothing the original brain contained. Verdict: survives. This suggests my principle concerns the history of the change rather than the preservation of any particular structure, but then the drift in case 8 and even the overnight swap in case 2 ought to be survivable, since in case 2 the body, the social world, and every causal relation the patient stands in change continuously.

  10. After full replacement, the original biological brain is kept perfused and viable, continuing to have experiences for a year before destruction. Verdict: the synthetic patient survives, and I am unwilling to say the perfusion year retroactively undoes the replacement, yet I also feel the perfused brain has some competing claim.

  11. Scan and instantiate with no replacement: the original is destroyed at the instant the copy is activated. Verdict: the original does not survive. Original kept alive alongside the copy: also does not survive. It is this pair, rather than any of the replacement cases, that makes me doubt case 1.

  12. The patient loses one particular memory en route, the smell of his grandmother's kitchen, retaining every associated fact and every other memory. Verdict: survives, diminished. I find this loss far less troubling than the swap in case 2, which sits badly with any account on which what matters is psychological continuity.

  What I would like back:

  (a) The principle, or the small set of candidate principles, that generates these verdicts, stated precisely and clause by clause, with the case that motivates each clause and the verdicts each clause is needed to secure.

  (b) Where no principle fits the whole set, the minimal collection of verdicts I must surrender, ranked by how much the resulting account costs me.

  (c) What the surviving account predicts for two cases I have not listed: a patient whose replacement halts at forty percent and who then dies of an unrelated cause within the week; and a patient replaced gradually while an exact functional duplicate is maintained in lockstep and resynchronized against the original every night.

  (d) Whether the asymmetry in case 8 can be made principled at all, or whether I have allowed an evaluative consideration to masquerade as a metaphysical one.
reasoning: |-
  Hmm, the user is working on consent documents for a radical neuroscience procedure involving gradual neuron replacement. They've presented 12 detailed thought experiments with their intuitive judgments about personal survival in each scenario. They want me to systematically analyze these intuitions, extract underlying principles, identify inconsistencies, suggest revisions, and apply the framework to new cases. This is an extremely sophisticated philosophical puzzle about personal identity.

  Looking at their verdicts, several patterns emerge. They strongly favor gradual replacement over sudden replacement (cases 1 vs 2), care about the "grain" of replacement (case 3), find parallel operation reassuring (case 4), show unexplained directional bias (case 5), prioritize neural-level over behavioral equivalence (case 6), and can't pinpoint a survival threshold (case 7). Most interestingly, they show asymmetric responses to improvement versus change in case 8, which they rightly flag as problematic.

  The core tension appears between what matters for survival: psychological continuity (which should allow case 2), versus some form of material continuity (which explains their rejection of duplication cases 11). Their intuition in case 1 likely relies on unstated assumptions about causal connection between biological and synthetic states - what philosophers call "non-branching" continuity. 

  For their requested principles, I'm considering a two-clause account: (1) survival requires sufficiently gradual material substitution preserving psychological continuity, and (2) no competing consciousness. This handles most cases but conflicts with their case 8 verdict where they reject non-improved changes. That inconsistency needs addressing - either they must accept that identity isn't diminished by neutral changes, or admit evaluative bias contaminating their metaphysical judgment.

  The new cases are revealing: a 40% replaced patient dying would clearly be the original person under their framework. The nightly-resynchronized duplicate case is trickier - this creates a branching scenario where neither stream might fully qualify as survival under their intuitions, though I'd argue the continuously embodied stream does.

  Ultimately, their case 8 asymmetry seems indefensible on metaphysical grounds. The discomfort with "different temperament" likely stems from valuing certain psychological traits, not identity itself. This is the most significant revision required to achieve consistency.
answer: |-
  Based on your verdicts, the underlying principle governing your survival intuitions appears to be **Gradualist Material Continuity (GMC)**, with specific constraints. Here is the principle derived clause-by-clause, followed by the requested analysis:

  ### (a) The Principle: Gradualist Material Continuity (GMC)
  **Core Principle**: *Personal survival requires the preservation of a single, unbroken stream of consciousness grounded in the continuous physical implementation of cognitive processes, where changes occur gradually enough to maintain psychological coherence without competition or branching.*

  **Clauses & Motivations**:
  1.  **Material Continuity Clause**: Survival requires the *physical continuity* of the implementing substrate (or its sufficiently gradual replacement).  
      *   *Motivated by*: Rejection of duplication (Case 11 - original destroyed alongside copy or kept alive), rejection of full-scan/replacement (Case 2), acceptance of gradual neuron-level replacement (Case 1).  
      *   *Secures Verdicts*: Survival in 1, 4, 5, 7 (30%), 9; Non-survival in 2, 6 (whole-organism), 11.

  2.  **Graduality Clause**: Replacement must be gradual *relative to the functional grain of identity*.  
      *   *Motivated by*: Wavering on regional bursts (Case 3) vs. firm survival on neuron-by-neuron (Case 1) and firm non-survival on overnight (Case 2). Survival confidence increases with redundancy (Case 4). Directional bias (Case 5) suggests the "grain" may involve functional hierarchies.  
      *   *Secures Verdicts*: Survival in 1, 4, 5; Non-survival in 2; Explains wavering in 3.

  3.  **Non-Branching/Non-Competition Clause**: There must be no point where multiple distinct streams of consciousness claim to be the original or compete causally.  
      *   *Motivated by*: Rejection of duplication (Case 11), discomfort with the perfused brain (Case 10), acceptance of parallel operation *without* competition (Case 4 - biological switched off).  
      *   *Secures Verdicts*: Non-survival in 11; Explains discomfort in 10; Allows survival in 4.

  4.  **Sub-Personal Functional Equivalence Clause**: Replacement units must replicate the *neuron-level input-output function* (or finer grain), not just whole-organism behavior.  
      *   *Motivated by*: Survival in Case 6 (different substrate, same neuron function) vs. non-survival in Case 6 (whole-organism equivalence only).  
      *   *Secures Verdicts*: Survival in 6 (neuron-level), Non-survival in 6 (organism-level).

  ### (b) Inconsistencies & Minimal Surrenders (Ranked by Cost)
  GMC fits most verdicts well, but key inconsistencies arise in **Case 8** and **Case 12**:

  1.  **Case 8 (Second Variant - Different Temperament):** Surrender "Non-Survival" Verdict (Highest Cost).  
      *   *Conflict*: GMC (Clauses 1, 2, 4) strongly suggests survival: material continuity is gradual, no branching, neural functional equivalence. Your intuition ("survives less/not at all") conflicts, likely driven by *evaluative bias* (loss of "essential" traits) masquerading as identity. Surrendering this verdict is costly as it challenges a strong intuition about "core self," but it's necessary for consistency. Case 9 (self-modification) confirms survival isn't tied to preserving specific traits/structure.
  2.  **Case 12 (Lost Memory):** Surrender "Diminished Survival" Framing (Lower Cost).  
      *   *Conflict*: Framing the loss as "diminished survival" slightly conflicts with GMC's focus on the *continuity of the implementing stream*, not the preservation of every datum. GMC readily accepts this as survival (material continuity, psychological coherence largely intact). The cost is low; reframe the loss as psychological change within survival, not a diminishment of survival *itself*. Your observation that this is less troubling than Case 2 aligns with GMC.

  ### (c) Predictions for New Cases
  *   **Patient halts at 40%, dies of unrelated cause:** GMC predicts **survival** up to death. Clause 1 (material continuity) is satisfied for 40% replacement; the degree is below your hesitation point (Case 7 - 70%). Death is the termination of the continuous stream, not a failure of survival *during* the process.
  *   **Gradual replacement with nightly-resynchronized duplicate:** GMC predicts **non-survival** for the *original stream*.  
      *   *Why*: The nightly resynchronization creates repeated **branching events**. Each night, the original biological substrate and the synthetic duplicate diverge until forcibly synchronized. This violates Clause 3 (Non-Branching/Non-Competition). The synthetic stream is periodically "overwritten" from an external source (the original scan/resync), breaking its claim to *continuous* implementation of the original stream. The original biological stream is gradually replaced and effectively terminated. The *result* is a synthetic entity with copied psychology, but the original stream of consciousness grounded in the biological substrate does not survive the process due to the branching/synchronization.

  ### (d) Case 8 Asymmetry: Improvement vs. Change
  *   **The verdicts cannot both stand on purely metaphysical grounds.** Your intuition in Case 8 (survival with improvement, potential non-survival with neutral change) cannot be reconciled with GMC or standard metaphysical accounts of identity (e.g., psychological continuity, biological continuity, brute physical continuity).
  *   **Improvement is doing illicit work.** Your willingness to accept survival with improvement but reject it with neutral change strongly suggests an **evaluative bias** ("improvement is good, so it preserves 'me'; neutral change is bad/loss, so it destroys 'me'") is influencing your metaphysical intuition about survival. GMC mandates survival in *both* subcases of Case 8, as the physical and functional continuity conditions are identical.
  *   **Making it principled is problematic.** You could introduce an *evaluative clause*: "Survival requires that changes preserve or enhance traits deemed core to the subject's valued identity." However:
      *   This is fundamentally non-metaphysical; it's about values, not existence.
      *   It's highly subjective and vague ("core traits," "valued identity").
      *   It contradicts your acceptance of significant drift in Case 9 and the memory loss in Case 12.
      *   It undermines the objectivity sought for clinical consent.
  *   **Conclusion:** The asymmetry in Case 8 is **not principled** on metaphysical grounds. It is an evaluative consideration (preference for improvement over neutral change, especially regarding "core" personality) masquerading as a metaphysical one. To achieve consistency with your other verdicts (especially 1, 6, 9), you must surrender the intuition that neutral change diminishes survival.

  **In Summary**: Your core intuition is best captured by **Gradualist Material Continuity (GMC)**, emphasizing unbroken physical implementation at the neural-functional level, gradual change relative to functional grain, and avoidance of branching. To make GMC fully consistent, you must **surrender the non-survival verdict in Case 8 (neutral change)** as an evaluative bias, and **reframe the 'diminished survival' in Case 12** as psychological change within survival. The new case predictions follow directly: survival for the 40% patient dying, non-survival for the nightly-resynced duplicate due to repeated branching. The Case 8 asymmetry cannot be salvaged as a principled metaphysical distinction.
