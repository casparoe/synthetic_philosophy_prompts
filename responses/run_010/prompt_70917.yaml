  2. **Incomplete Information**: This typically refers to games where players do not know the type of the opponent (e.g., in Bayesian games). Here, both players have complete information about the opponent's program (source code). The issue is that the program's behavior is context-dependent, so even with the source, you cannot predict the behavior without knowing the context. However, the context is not a hidden type of the opponent but a fact about the execution. So it's not incomplete information in the standard sense.

  3. **Mixed Strategies**: These involve randomizing over actions. But in the examples, the agents are deterministic. The branching is based on the context (which is fixed for a given run) so it's a pure strategy that is conditional on the context.

  4. **Self-reference and Quining**: This is about programs that can refer to their own source code. The examples do use self-reference (to check if they are being simulated) but the key point is the context-dependence. Quining is a technique for self-reproduction, which is not the core issue.

  5. **AI Safety - Distributional Shift / Goodhart**: In AI safety, a model might perform well in training (or evaluations) but fail in deployment due to a shift in the input distribution. This is similar in that the behavior changes when the context (evaluation vs. deployment) changes. However, the examples are not about learning or training but about a designed conditional behavior. Also, in the examples, the context is explicitly checked (via an oracle) rather than being an unintended consequence.

  After considering these, I note that in the field of decision theory, particularly in the context of program equilibrium and logical decision theory, there is a concept of "timing" or "execution context" that can be used to achieve cooperative equilibria. However, I am not aware of a standard term for the phenomenon of the same program producing different outputs in different execution contexts (simulation vs. real) when the context is detectable.

