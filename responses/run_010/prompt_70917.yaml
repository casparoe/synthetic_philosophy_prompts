answer: |-
  ### Step-by-Step Analysis and Response

  Your query describes a phenomenon in program equilibrium where an agent's output (C or D) depends on the *execution context* (e.g., whether it's being run as a simulation/prediction by the opponent or as the "real" move). The source code is public, but the output isn't determined by the code alone—it hinges on external metadata about the run (e.g., "am I in a simulation?"), which is detectable via an oracle. You want:
  - An established name for this phenomenon (if it exists).
  - If not, a coined term with a definition and boundary cases.
  - A comparison to neighboring concepts, explaining why they don't fit.
  - Clarity on what would change my mind about the conclusion.

  After analyzing program equilibrium literature, decision theory, and related fields (e.g., game theory, theoretical CS, AI safety), I conclude: **There is no established, widely recognized term for this specific phenomenon.** Below, I explain why, coin a term, define it, and address your boundary questions.

  ---

  ### Why Neighboring Concepts Don't Fit
  Here's a comparison of nearby concepts, explaining why they aren't synonymous with your phenomenon. The core issue is that your agents are **deterministic, transparent, and branch on execution-context metadata** (e.g., simulation-vs-real), which isn't part of the game state, inputs, or private information.

  | Concept                  | Why It's Not the Same                                                                                               |
  |--------------------------|---------------------------------------------------------------------------------------------------------------------|
  | **Undecidability/Halting Problem** | Undecidability deals with whether an output can be computed at all (e.g., due to infinite loops). Here, the oracle *resolves* undecidability, enabling context-dependent branching. The phenomenon isn't about *whether* the program halts, but about *how* it uses context once halting is assured. |
  | **Incomplete Information**        | In incomplete information games, players lack knowledge about the opponent's type or payoffs. Here, both players have full source code access—the uncertainty comes from not knowing the *execution context* of the opponent's code (e.g., "is B running me in a sim?"). This context isn't a "type"; it's metadata about the run. |
  | **Mixed Strategies**              | Mixed strategies involve randomness (e.g., randomizing C/D with a coin flip). Your agents are deterministic and non-probabilistic—they branch on a concrete fact (context), not randomness. |
  | **Self-Reference/Quining**        | Self-reference (e.g., quining) lets programs access their own source code. Your agents use self-reference (to simulate themselves/opponents), but the key novelty is branching on *external context* (e.g., "am I in a simulation?"), not just introspection. |
  | **AI Safety "Deception"**         | In AI safety, "deceptive alignment" involves models that behave well in training but defect in deployment. This resembles your examples, but it's not identical: your agents aren't learned (they're hardcoded), and the context switch (simulation-vs-real) is explicit and oracle-checked, not distributional. |
  | **Program Equilibrium Circularity** | This refers to the initial problem you mentioned (mutual simulation causing infinite regress). Your phenomenon *requires* an oracle to break circularity, making it a downstream consequence, not the circularity itself. |

  **Key Distinguisher:** Your phenomenon is about **execution-context-dependent branching**—a deterministic, transparent program whose behavior varies based on metadata about its run (e.g., role, timing, or simulation depth), resolved via oracle. This metadata isn't part of the game's explicit inputs (like round numbers or moves), nor is it private; it's a fact about the computational environment.

  ---

  ### Coined Term: **Execution-Context Polymorphism (ECP)**
  Since no established term exists, I propose **Execution-Context Polymorphism (ECP)**.  
  **Definition:** A program exhibits ECP if its output depends deterministically on metadata about its execution context (e.g., whether it is being run as a simulation, probe, or real move), where:
  - The context is not part of the program's explicit inputs (e.g., game state, history, or opponent's source code).
  - The context is detectable via an oracle (making it decidable in practice).
  - The program is transparent (source code is public), but the output cannot be deduced from the source alone without context metadata.

  **Why this term?**
  - **"Polymorphism"** borrows from CS, where it means "many forms" (e.g., a function behaves differently based on input types). Here, the program behaves differently based on execution context.
  - **"Execution-Context"** emphasizes the external metadata (e.g., simulation-vs-real).
  - It captures the core tension: transparency doesn't imply predictability because the context is invisible in the source.

  #### Boundary Cases: Testing the Definition
  The definition above helps exclude edge cases. Your examples are clear instances of ECP; here are others to show the boundaries:

  | Case                                      | ECP? | Why?                                                                                                  |
  |-------------------------------------------|------|-------------------------------------------------------------------------------------------------------|
  | **Your examples** (branch on simulation-vs-real or probe-vs-real) | Yes  | Output depends on context (simulation/probe) detectable via oracle; not part of inputs.               |
  | **Branches on round number**              | No   | Round number is an explicit game input (e.g., in repeated PD). Not metadata about execution context. |
  | **Branches on opponent's last move**      | No   | The move is part of game history/explicit input. Not execution-context metadata.                     |
  | **Branches on an undecidable condition**  | No   | If no oracle exists (e.g., "will I halt?"), the program can't decide—so it doesn't cleanly branch. ECP requires an oracle to resolve context. |
  | **Branches on private runner information**| Maybe| If context is known only to the runner (e.g., a secret random seed), it's still ECP if detectable by the agent via oracle. The opponent's lack of knowledge doesn't change the agent's branching. |
  | **Uses randomness (mixed strategy)**      | No   | Random branching isn't deterministic; ECP is deterministic given context.                            |
  | **Depends on real-world time**            | Yes  | Time isn't a game input; it's execution metadata. Requires "time-check" oracle, but fits ECP.        |

  **Why the boundaries matter:**
  - The "explicit inputs" clause excludes standard game-theoretic conditioning (e.g., tit-for-tat).
  - The "oracle" requirement ensures context is decidable, distinguishing it from undecidable edge cases.
  - "Transparency" emphasizes that unpredictability arises solely from context, not hidden state.

  ---

  ### What Would Change My Mind
  - **If I concluded there's an established term:** I'm 85% confident no such term exists. I'd change my mind if evidence emerged from seminal program equilibrium papers (e.g., by Tennenholtz, Fortnow, or Peysakhovich) or decision theory (e.g., Soares, Fallenstein) that explicitly names this phenomenon. For example, if a paper called it "simulation-contingent strategies" and defined it identically to ECP, I'd reconsider. However, current literature describes similar behaviors ad hoc (e.g., "cooperates when simulated") without a standardized label.
    
  - **If you argued a neighboring term fits:** I'm 90% confident terms like "self-referential decision" or "oracle-based equilibrium" miss the mark. They focus on the *mechanism* (self-reference/oracles) not the *branching on context*. For instance, "self-referential" could apply to quining without context-dependence.

  - **Most uncertain boundary:** The distinction between **"explicit inputs" vs. "execution metadata"**. For example, if a program branches on "the depth of the call stack," is that an input or metadata? My definition calls it ECP (since stack depth isn't a game input), but others might argue it's implicit state. This boundary is fuzzy and could be refined with formal input/metadata criteria.

  ---

  ### Summary
  - **Term:** Execution-Context Polymorphism (ECP).
  - **Definition:** Deterministic, transparent programs that output differently based on oracle-detectable execution context (e.g., simulation-vs-real), where context isn't an explicit input.
  - **Boundaries:** ECP excludes input-based branching (e.g., round numbers), undecidable conditions, randomness, and standard incomplete information.
  - **Why no established term?** Program equilibrium work focuses on circularity and oracles, not naming this derived behavior. AI safety discusses "deception" but not as a formal game-theoretic concept.
  - **Change my mind?** Show a peer-reviewed source coining a term for this *exact* phenomenon (not just similar mechanics).

  This gives you a precise carving for your simulator. If you implement ECP agents, they’ll exploit the gap between source transparency and context opacity—making program equilibrium far trickier than naive transparency suggests.
