  2. Identical procedure but rushed: everything is swapped over a single afternoon while you sit there chatting. → Still you. She says the speed is irrelevant.
  3. Your brain is scanned at molecular resolution, the original is dissolved, and a perfect functional duplicate gets built and switched on somewhere else. → Not you. It's a copy that will sincerely insist otherwise. She's very firm here.
  4. Same scan, duplicate switched on, but the original is left alive and awake. → You're the original, obviously; the other one is a stranger who shares your past.
  5. Classic division: your two hemispheres each end up supporting a different fully functional person with your memories and your temperament. → Neither is you. But she also insists this isn't a catastrophe, which I've never quite followed.
  6. A stroke destroys your left hemisphere and the right one carries on in your body. → You survive.
  7. In cases 1 and 2, the neurons are incinerated the moment they're removed. → Changes nothing, still you.

