  #### Step 1: Listing Candidate Principles
  Based on Nadia's verdicts, I propose three candidate principles. These are distilled from common theories in personal identity (e.g., psychological continuity, biological views) but tailored to her pattern of judgments. I focus on:
  - **What matters for survival?** Her rejections of duplication (cases 3–4) and branching (case 5) suggest identity isn't just about psychology or matter.
  - **Key themes from cases:** Continuity of consciousness (cases 1–2, 6–7), irrelevance of speed/matter destruction (cases 2, 7), and avoidance of copying/fission (cases 3–5).

  **Candidate Principle 1: Unbroken Causal-Continuity of Consciousness (UCCC)**  
