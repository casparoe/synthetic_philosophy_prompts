  (c) "I will keep borrowed items whenever I can get away with it."

  Question: Which description, when universalized, leads to a contradiction? (Choose one that you think is the correct description for the test.)

  Options:
  A. Only (a) leads to a contradiction because if everyone kept this particular book, it would be impossible (since there's only one copy).
  B. Only (b) leads to a contradiction because if everyone kept borrowed items when they wanted them more than the friendship, the practice of lending would collapse and no one would lend.
  C. Only (c) leads to a contradiction because if everyone kept borrowed items whenever they could get away with it, trust would break down and borrowing would cease.
