  ### Kant's Universalizability Test Diagnostic Tree  
  This decision tree helps clarify your interpretation of Kant's universalizability test by focusing on concrete cases and claims, avoiding technical jargon. Work through the nodes in order, choosing the option that best reflects your view. Each node presents a scenario or question with 2-3 answer options. Your choices will reveal underlying commitments about how the test works.  

  ---

  #### Node 1: The Borrowed Book  
  **Scenario**: Taylor borrows a rare book from a friend, intending to keep it permanently because it’s valuable and the friend has multiple copies. Taylor’s maxim could be described in three ways:  
  - **Option A**: "I will keep *this specific book* because it’s rare and my friend has others."  
  - **Option B**: "I will keep borrowed items whenever I value them more than my friendship."  
  - **Option C**: "I will keep borrowed items whenever I can benefit without consequences."  

  **Question**: If only *one* description leads to a contradiction when universalized (i.e., if everyone acted that way), which is it?  
  - **A1**: Only **A** leads to a contradiction (keeping *this specific book* would be impossible if everyone tried, since there’s only one copy).  
  - **A2**: Only **B** leads to a contradiction (friendship and lending would collapse if everyone did this, making borrowing impossible).  
  - **A3**: Only **C** leads to a contradiction (trust would vanish, so no one would lend at all).  

  ---

  #### Node 2: Who Decides the Maxim?  
  **Scenario**: In Node 1, you chose which description "fits" the test. But who should determine the correct description of Taylor’s maxim?  
  - **B1**: Taylor’s own subjective reason (e.g., if Taylor says it’s "only about this book," we use A).  
  - **B2**: The most natural, objective description (e.g., an observer would say Taylor is "keeping borrowed items for personal gain," so B or C).  
  - **B3**: The description that avoids making the test trivial (e.g., choose the one most likely to reveal a contradiction).  

  ---

  #### Node 3: The False Loan Promise  
  **Scenario**: Robin needs money and considers promising to repay a loan, knowing they won’t. Robin’s maxim: "I will make a false promise to get money when desperate."  

  **Question**: What goes wrong if everyone acts on this maxim?  
  - **C1**: Promising becomes *impossible* because no one would believe promises (a logical breakdown: the idea of a "promise" loses all meaning).  
  - **C2**: Robin’s *own plan fails* because if everyone did this, lenders would stop accepting promises, so Robin couldn’t get the loan.  
  - **C3**: Both C1 and C2 are true and inseparable.  

  ---

  #### Node 4: The Indifferent Non-Helper  
  **Scenario**: Jamie refuses to help others in need and says: "I prefer a world where no one helps anyone, including me. I’m fine with suffering alone." Jamie is truly indifferent—they don’t care if they’re never helped.  

  **Question**: Does the test still condemn Jamie’s refusal to help?  
  - **D1**: **Yes**, because a world without mutual aid frustrates natural human purposes (e.g., society’s survival).  
  - **D2**: **Yes**, because all rational beings *must* will some ends that require help (e.g., achieving goals), so willing no help contradicts reason itself.  
  - **D3**: **No**, because Jamie doesn’t care about being helped, so there’s no conflict in what they will.  

  ---

  #### Node 5: The Talent-Neglecter (Without Values)  
  **Scenario**: Sam decides to let their natural talents rust (e.g., never practice music or study) and only seek idle pleasures. Sam doesn’t care about self-improvement or society.  

  **Question**: Can we show Sam’s maxim fails without assuming talents are "valuable" or that nature "intends" us to develop them?  
  - **E1**: **Yes**, because if everyone neglected talents, society would collapse, undermining Sam’s own goal (e.g., no pleasures available).  
  - **E2**: **Yes**, because Sam must will the *means* to their ends, and talents are needed for any goal (e.g., even pleasure requires basic skills).  
  - **E3**: **No**, without assuming talents are worth having, there’s no contradiction.  

  ---

  #### Node 6: The Non-Helper (Without Personal Wants)  
  **Scenario**: Like Jamie in Node 4, but ignore Jamie’s indifference. Can we condemn refusing help *without* assuming the agent wants aid or that aid has a "natural purpose"?  
  - **F1**: **Yes**, because in a world without help, the agent couldn’t achieve their *own* ends (e.g., Jamie’s goals would fail).  
  - **F2**: **Yes**, because rational agents *must* will the conditions for achieving *any* end (e.g., help is sometimes essential), so willing no help is irrational.  
  - **F3**: **No**, without the agent’s desire for help, there’s no contradiction.  

  ---

  #### Node 7: The Agent Who Doesn’t Universalize  
  **Scenario**:  
  - *Case X*: Alex lies without considering the universalizability test.  
  - *Case Y*: Bailey lies after "testing" a misdescribed maxim (e.g., "I will tell minor lies to comfort friends" universalizes fine, but the real maxim is broader).  

  **Question**: What does this show about the test?  
  - **G1**: The test is a **criterion of wrongness**: Alex’s act is wrong because their *actual* maxim fails the test. Bailey’s is wrong because they misdescribed their maxim.  
  - **G2**: The test is a **procedure to follow**: Bailey did nothing wrong (they followed the test). Alex is wrong for not using it.  
  - **G3**: **Both**: Alex is wrong for not testing; Bailey is wrong because the real maxim fails.  

  ---

  #### Node 8: What Does Passing Prove?  
  **Question**: If a maxim passes the test (no contradiction when universalized), what follows?  
  - **H1**: The act is **morally permissible** (the test is sufficient to show it’s allowed).  
  - **H2**: The act is **not ruled out** by this test, but might be wrong for other reasons (e.g., it’s cruel, or violates a different duty).  
  - **H3**: Passing means the act is permissible *if* this test is the only requirement.  

  ---

  ### Leaves of the Tree: Interpretations Revealed  
  Your answer combinations lead to one of the following interpretations. Each leaf includes:  
  - **Name**: Conventional label (if any).  
  - **Awkward Commitment**: One challenging implication of this view.  
  - **Answer Pattern**: The node choices that lead here (e.g., A1, B2, C3, etc.).  

  #### Leaf 1: **Orthodox Two-Test Reading**  
  - **Name**: Orthodox (Kant’s explicit approach).  
  - **Awkward Commitment**: You must accept that the test relies on vague "natural purposes" (e.g., talents or aid being "necessary" for humanity), which can feel arbitrary without further justification.  
  - **Answer Pattern**: A2 or A3, B1, C1, D2, E2, F2, G1, H1.  

  #### Leaf 2: **Practical-Contradiction Reading**  
  - **Name**: Practical-contradiction (e.g., Korsgaard).  
  - **Awkward Commitment**: The test fails only when the agent’s *personal* plan is undermined (e.g., Node 3’s C2), so it might permit harm if the agent doesn’t care about their goals (e.g., an indifferent Jamie might "pass").  
  - **Answer Pattern**: A2 or A3, B1, C2, D2 or D3, E1 or E2, F1 or F2, G1, H1.  

  #### Leaf 3: **Universal Prescriptivism**  
  - **Name**: Universal prescriptivism (e.g., Hare).  
  - **Awkward Commitment**: Morality reduces to personal preference (e.g., Node 4’s D3 or Node 6’s F3), so a consistent egoist could "universalize" selfish acts without contradiction.  
  - **Answer Pattern**: A1 or A2 or A3, B1 or B3, C2, D3, E3, F3, G2, H1.  

  #### Leaf 4: **Deflationary Reading**  
  - **Name**: Deflationary (e.g., Wood, skepticism).  
  - **Awkward Commitment**: The test is empty—maxim descriptions are arbitrary (e.g., Node 2’s B3), so it rarely condemns *or* permits anything decisively.  
  - **Answer Pattern**: A1 or A2 or A3, B3, C1 or C2 or C3, D3, E3, F3, G1 or G3, H2.  

  #### Leaf 5: **Necessary but Not Sufficient**  
  - **Name**: Necessary but not sufficient (common in hybrid views).  
  - **Awkward Commitment**: Passing the test doesn’t guarantee permissibility (e.g., Node 8’s H2), so you need *another* moral principle to explain why some acts (e.g., lying) are wrong even if they "pass."  
  - **Answer Pattern**: A2 or A3, B1 or B2, C1 or C2, D2, E2, F2, G1, H2.  

  #### Leaf 6: **Unnamed (Strict Volitional Test)**  
  - **Name**: Unnamed (rare).  
  - **Awkward Commitment**: Only maxims that directly sabotage the agent’s *own* will fail (e.g., Node 5’s E1), so neglecting talents is wrong only if it harms the agent (not society).  
  - **Answer Pattern**: A2 or A3, B1, C2, D2, E1, F1, G1, H1.  

  #### Leaf 7: **Unnamed (Proceduralist)**  
  - **Name**: Unnamed (student-common error).  
  - **Awkward Commitment**: An agent who misdescribes their maxim (e.g., Node 7’s Case Y) acts permissibly if they "follow the procedure," even if the act is harmful.  
  - **Answer Pattern**: Any pattern with G2 (e.g., A1, B1, C2, D1, E1, F1, G2, H1).  

  ---

  ### Unoccupied Answer Combinations  
  Three combinations are unoccupied. Diagnoses:  
  1. **Pattern**: A1 (only specific descriptions fail), B2 (use objective descriptions), C1 (logical contradiction), D3 (indifferent agent passes), E3 (no failure for talents), F3 (no failure for non-help), G1 (test is a criterion), H1 (passing = permissible).  
     - **Diagnosis**: *Incoherent* – If only specific descriptions fail (A1), but you use objective ones (B2), talents/non-help *must* fail (contradicting E3/F3). Also, D3 conflicts with C1’s strict logic.  
  2. **Pattern**: A3 (only extreme descriptions fail), B3 (gerrymander descriptions), C3 (both contradictions), D1 (condemn via nature), E1 (talents fail socially), F1 (non-help fails personally), G3 (both criterion/procedure), H3 (passing = permissible if sole test).  
     - **Diagnosis**: *Unattractive* – B3 makes descriptions arbitrary, so C3’s "inseparable" contradictions are forced. D1 and E1/F1 rely on conflicting grounds (nature vs. personal plans). No one holds this because it’s unstable.  
  3. **Pattern**: A2 (moderate descriptions fail), B1 (use agent’s description), C2 (practical failure), D2 (condemn via rational will), E3 (no failure for talents), F2 (non-help fails rationally), G1 (criterion), H2 (not sufficient).  
     - **Diagnosis**: *Unexplored* – E3 (no talents failure) clashes with F2 (non-help fails). Why would one "rational" contradiction hold but not the other? It’s coherent but ignored—likely because Kant’s examples treat both similarly.  

  ---

  ### Indistinguishable Leaves & Confusion Advice  
  - **Indistinguishable Pair**: Leaf 1 (Orthodox) and Leaf 5 (Necessary but not sufficient) *if* H2 is chosen. They share all other nodes.  
    - **Diagnosis**: *Verbal difference* – Both agree on how the test works, but Leaf 5 adds that other duties exist. A further case (e.g., "Is a non-coercive but cruel act wrong if it passes?") would separate them: Leaf 1 says no; Leaf 5 says yes.  
  - **Most Likely Node for Confusion/Bad Faith**: **Node 2 (Who Decides the Maxim?)**. Students often pick B3 ("choose to make the test work") to "fix" cases they dislike, then abandon it when pressed.  
    - **How to Walk Back**: Ask: "If Taylor *insists* their maxim is about the specific book (A), but you think the test should use a general description (B), why? Does Taylor’s intent matter, or is the test about objective acts?" Use Node 1’s lawnmower to show re-description flips verdicts, forcing clarity.  

  ---  
  **Format Note**: This tree fits 4 pages when printed (approx. 1,500 words). Nodes are ordered to prioritize foundational issues (maxim description) before applications (cases). No citations or jargon are used.
