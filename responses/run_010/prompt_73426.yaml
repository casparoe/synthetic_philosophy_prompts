  Below is a self-sorting quiz designed to map sentencing intuitions onto key philosophical positions in the free will debate, without using metaphysical jargon. It includes 10 scenarios (covering timing, agreement cases, and diagnostic overlaps), followed by a scoring key that identifies positions, flags inconsistencies, and notes limitations.

  ---

  ### **The Sentencing Intuitions Quiz**
  **Instructions:** For each scenario, select the answer that best reflects your view. Avoid overthinking—go with your initial instinct.

  1. **The Changed Offender**  
     A man committed armed robbery at 25. He fled, built a stable life abroad, and is now 70. He surrenders, showing 45 years of exemplary conduct, community service, and terminal illness. *What sentence?*  
     A) Full prison term (as the law requires).  
     B) Short symbolic sentence (e.g., 1 month) + apology to victims.  
     C) No prison; supervised release with medical care.  

  2. **Recidivism Algorithm**  
     A nonviolent offender’s recidivism risk is scored 90% by an algorithm (accurate overall but over-predicts for his demographic by 20 points). *How should this influence sentencing?*  
     A) Lengthen the sentence proportionally to the 90% score.  
     B) Lengthen the sentence based on a demographically adjusted 70% score.  
     C) Ignore the score; sentence based solely on the crime committed.  

  3. **Future-Shaping Sanction**  
     A 20-year-old commits aggravated assault. The judge must choose:  
     - **Option 1:** 8 years in prison.  
     - **Option 2:** 2 years in prison + 6 years of mandatory therapy/job training.  
     *Which is better?*  
     A) Option 1 (traditional prison).  
     B) Option 2 (therapy/training).  

  4. **The Juvenile**  
     A 10-year-old intentionally sets a fatal fire. *What sentence?*  
     A) Adult prison term (deter others/protect society).  
     B) Juvenile detention until 21 (balanced punishment/protection).  
     C) Therapy/foster care (no punitive element).  

  5. **Symbolic Severity**  
     A CEO’s fraud devastates 10,000 people. The public demands "justice." Imposing the maximum sentence (30 years) would have minimal deterrent/rehabilitative value beyond 10 years. *Should the judge impose 30 years?*  
     A) Yes (society needs to condemn this strongly).  
     B) No (limit to what’s functionally necessary).  

  6. **Desperate Theft**  
     A father steals bread to feed his starving children. The mandatory sentence is 5 years (deters theft effectively). *What should the judge do?*  
     A) Impose 5 years (uphold deterrence).  
     B) Impose minimal/no sentence (circumstances matter).  

  7. **Pre-Trial Risk**  
     A defendant is accused of planning a terrorist attack. Evidence suggests a 30% chance they are guilty *and* would attack if released. *Should they be jailed pre-trial?*  
     A) Yes (30% risk is too high).  
     B) No (too low for imprisonment).  

  8. **Mental Health**  
     A woman with schizophrenia shoplifts. Treatment takes 3 years; without it, she’ll likely reoffend. The typical sentence is 3 months. *What should the judge order?*  
     A) 3 months in prison (proportional to crime).  
     B) 3 years of treatment (address root cause).  

  9. **Collective Deterrence**  
     In a close-knit group, one member assaults an outsider. Punishing the *whole group* would deter future violence more effectively than punishing the individual. *Should the group be punished?*  
     A) Yes (if it prevents harm).  
     B) No (only the offender).  

  10. **Victim’s Forgiveness**  
      A remorseful offender assaults someone who later forgives them and opposes punishment. *Should the judge still impose a sentence?*  
      A) Yes (society’s rules outweigh victim’s wishes).  
      B) No (victim’s view is central).  

  ---

  ### **Scoring Key**  
  Match your answers to the patterns below. Positions are defined by their core principles:  
  - **Caruso (Public Health)**: No "desert"; punishment as harm prevention.  
  - **Dennett (Compatibilist)**: "Desert" matters, but compatible with determinism.  
  - **Hart Hybrid**: Utilitarian goals (e.g., deterrence) capped by retributive limits.  
  - **Plain Deterrence**: Maximize deterrence/rehabilitation; no retributive limits.  
  - **Expressivist**: Punishment expresses societal condemnation.  

  | Position              | Answer Pattern (Q1 to Q10)                          | Notes                                                                 |
  |-----------------------|-----------------------------------------------------|-----------------------------------------------------------------------|
  | **Caruso**            | C, B, B, C, B, B, A, B, A, B                       | Prioritizes risk management, rehabilitation, prevention.             |
  | **Dennett**           | B, C, B, B, B, B, B, A, B, A                       | Desert-based but flexible; rejects excessive risk/expressivity.      |
  | **Hart Hybrid**       | B, C, B, B, B, B, B, A, B, A                       | Utilitarian aims within desert limits (matches Dennett here).        |
  | **Plain Deterrence**  | C, A/B, B, A, B, A, A, B, A, A                     | Maximizes prevention; accepts collective punishment/algorithm bias.  |
  | **Expressivist**      | A, C, A, B, A, B, B, A, B, A                       | Symbolic condemnation matters most.                                  |

  #### **Diagnostic Agreements/Disagreements**  
  - **Q4 (Juvenile)**: Caruso (C) and Dennett (B) *disagree*—skeptics reject punishment entirely; compatibilists reduce it.  
  - **Q9 (Collective Punishment)**: Caruso (A) and Plain Deterrence (A) *agree*—but Caruso sees it as "quarantine," Deterrence as utility.  
  - **Q5 (Symbolic Severity)**: The **agreement case**: Dennett, Hart, and Caruso all reject excessive symbolism (B), exposing shared pragmatism.  

  #### **Incoherent Positions**  
  - **Free-will skeptic who believes offenders "deserve" suffering** → *Incoherent*. Skepticism (e.g., Caruso) explicitly rejects desert.  
  - **Libertarian who abolishes punishment** → *Unexplored*. Libertarians affirm free will, making abolition rare (but not illogical if grounded in anarchism/pacifism).  

  #### **Limitations**  
  - **Hart and Dennett are indistinguishable** in this quiz (both: B, C, B, B, B, B, B, A, B, A). Hart’s utilitarian cap is subtle; real cases would require weighting "desert" vs. "utility."  
  - **Caruso vs. Plain Deterrence** sometimes overlaps (e.g., Q1, Q7, Q9). Caruso opposes bias/collective harm unless unavoidable; Deterrence accepts it for "greater good."  

  ---

  ### **Why This Works**  
  - **Timing cases**: Q1 (changed offender), Q2 (algorithm/risk), Q3 (future-shaping) force choices about past vs. future focus.  
  - **Jargon-free**: Avoids "free will," "desert," etc., focusing on concrete outcomes.  
  - **Diagnostic overlap**: Q5 reveals shared pragmatism in compatibilists/skeptics.  
  - **Incoherence flagged**: Skepticism + desert is self-contradictory; libertarian abolition is possible but fringe.  

  This quiz helps your group see how "metaphysics in disguise" shapes sentencing intuitions—even when labels like "determinism" are hidden. Hart/Dennett’s overlap shows where theories converge; Caruso’s divergence on risk/collective action highlights core skepticism.
