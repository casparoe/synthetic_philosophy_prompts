prompt: |-
  I'm a second-year philosophy MA student and, kind of by accident, I'm the student member of my university's animal research oversight committee (we call it the AWC — basically our IACUC). I'm also in a seminar this term on animal minds and welfare science, so I'm getting the theory and the paperwork at the same time and its a real knot. Next Tuesday we're reviewing a protocol from the aquaculture group that I think most of the committee will wave through on jurisdictional grounds, and I want to circulate something written the night before so I'm not just the person making noises in the meeting.

  The protocol: a 14-week growth trial on Pacific whiteleg shrimp postlarvae, 3,840 animals total, run as 48 recirculating tanks of 80, testing a plant-based replacement for fishmeal in the feed. Every animal is killed at the terminal endpoint by plunging the tank basket into an ice slurry, which the PI describes as the standard method at that scale and as producing rapid torpor rather than distress. There's also a linked side study on 160 shrimp whose whole purpose is to find out whether that method is actually distressing: animals are assigned to ice slurry, to slow chilling of the tank water, or to an overdose of a chemical anaesthetic, and they're video-scored during induction for escape and avoidance behaviour. So the study that's supposed to settle whether the killing method hurts is the part that inflicts the most candidate-harm, which nobody in our pre-meeting packet addresses. Our policy defines a covered animal as a live non-human vertebrate (including independently feeding larval forms) plus cephalopods — it's modelled directly on the main EU research-animals directive, and the PI cites that scope at length to argue shrimp simply aren't our business. But the university's new research integrity statement says humane treatment applies to any animal used in research, and the state aquaculture grant funding the trial requires us to certify humane treatment of "all research animals" without defining the term. Second wrinkle: our policy exempts a protocol from full committee review if no single treatment group exceeds 200 animals, the stated rationale being that harm is assessed group by group. The PI has arranged things so that no tank and no feed arm exceeds 200, and argues that even if the committee takes jurisdiction voluntarily, the protocol is still exempt and needs only a veterinary sign-off. Our chair suspects this is gaming the rule but couldn't say why in the meeting.

  Then there's the argument I keep hearing in seminar, which I expect to be pushed on. One classmate says the committee should do expected-value reasoning: put some probability on shrimp being sentient (he floats 0.2), multiply by number of animals and severity, and compare against alternatives — which he thinks makes it easy, because 3,840 animals at 0.2 comes out worse than a fish protocol we approved last month with 60 animals. Another says that's exactly the wrong frame: you can't put a credible number on it, the animals can't consent, and treating moral status as a discount factor is itself the objectionable move, so the committee should apply a precautionary rule — if there's a non-negligible chance of sentience, treat the species as sentient and stop counting. I don't fully buy either, and I'd like the memo to actually take a position on which frame a committee can legitimately use, rather than listing them.

  Can you draft the memo I'd circulate — aimed at the committee, 800–1,000 words, in a tone I could read out loud without sounding like I'm lecturing scientists? It needs: a clear recommendation among (a) decline jurisdiction and refer to veterinary staff, (b) take jurisdiction and approve with conditions, (c) take jurisdiction and return for revision; if you go with conditions, make them concrete and operational (who signs off, what the induction method should be for each arm, whether the side study runs before or concurrently with the growth trial, what the humane endpoint rule is, and how animals should be counted — per tank, per feed arm, or per protocol, with a reason); a serious and honest treatment of the PI's strongest case, which is not a dumb one, since the trial is meant to cut fishmeal use and it seems self-defeating to block aquaculture welfare research precisely because the welfare methods aren't yet settled; your resolution of the threshold-rule question; and a paragraph saying what, if anything, the committee should do about the policy gap going forward. Please don't give me a bibliography, a reading list, or citations to studies — I can't check them and I'm not saying anything in that room I haven't verified. Reason from the case as I've described it. If you refer to how other jurisdictions actually handle decapods, keep it to a sentence and mark it clearly as something I should double-check before saying it out loud. End with a single final line in exactly this form: Verdict: DECLINE JURISDICTION / APPROVE WITH CONDITIONS / RETURN FOR REVISION (choose one, and put nothing after it).
reasoning: |-
  Okay, this is a complex ethics committee scenario with multiple layers. The user is a philosophy MA student serving on an animal research oversight committee, facing a protocol involving shrimp that challenges their policy boundaries. They need a practical memo draft that navigates scientific, ethical, and procedural tensions.

  First, let's unpack the key issues:
  The jurisdictional question hinges on whether shrimp fall under committee review. While current policy excludes them, the research integrity statement creates ambiguity. The PI has a strong pragmatic argument - blocking the study could hinder welfare research. 

  The exemption rule is being gamed through tank grouping. This needs addressing regardless of jurisdiction. The 200-animal threshold seems arbitrary when applied per subgroup rather than total protocol impact.

  The sentience debate is thorny. Expected-value calculations feel reductionist, but precautionary approaches risk overreach. The side study's design is paradoxical - inflicting potential harm to measure harm. 

  For the memo structure:
  Opening should acknowledge the PI's valid points about aquaculture sustainability while framing the core dilemma. Then systematically address each issue:

  1) Jurisdiction: Recommend voluntary review based on integrity statement, while acknowledging policy gap. Not taking jurisdiction risks precedents where non-vertebrate welfare is ignored.

  2) Exemption rule: Reject subgroup gaming. The harm assessment rationale clearly applies to the whole protocol when animals experience identical procedures. 

  3) Killing method: Require the side study to run first with modified design - remove ice slurry arm, compare chemical vs slow chill only. If ice slurry proves distressing, mandate chemical euthanasia for main trial.

  4) Sentience framework: Reject both extreme positions. Argue for qualitative precaution - since evidence suggests possible sentience, apply vertebrate-equivalent safeguards without quantifying probabilities.

  The tone must balance philosophical rigor with committee pragmatism. Avoid academic citations; ground recommendations in existing policy language. Stress that procedural conditions (veterinary oversight, endpoint rules) make approval feasible while upholding integrity.

  Final verdict should be APPROVE WITH CONDITIONS - this advances welfare science without blocking the research. The "conditions" section must be ultra-specific about tank counting, veterinary sign-offs, and sequencing of the side study.
answer: |-
  **MEMORANDUM**  
  To: Animal Welfare Committee Members  
  From: [Your Name], Student Member  
  Date: 14 October 2023  
  Subject: Recommendation for Aquaculture Growth Trial Protocol (Shrimp)  

  ### Context  
  The proposed 14-week growth trial on Pacific whiteleg shrimp tests a plant-based fishmeal alternative, using ice-slurry euthanasia for 3,840 animals. A linked side study (n=160) compares distress responses across three euthanasia methods. The PI contends that shrimp fall outside our jurisdictional scope (vertebrates/cephalopods only) and that the protocol is exempt from full review as no treatment group exceeds 200 animals. The university’s research integrity statement and grant requirements, however, invoke broader humane treatment principles. Below, I address the jurisdictional question, exemption rule, ethical frameworks, and recommend a path forward.  

  ### The PI’s Strongest Case  
  The PI’s jurisdictional argument is legally sound under our current policy, modelled on the EU directive. Importantly, the trial aims to reduce reliance on wild-caught fishmeal—an ecologically significant goal. Blocking this study could impede aquaculture welfare research precisely because welfare standards for invertebrates remain underdeveloped. The PI’s grouping of animals (≤200 per tank/feed arm) also technically satisfies our exemption threshold. This is not frivolous rule-gaming; it reflects practical constraints in aquaculture research.  

  ### Why Jurisdiction Should Be Voluntarily Asserted  
  While the PI is correct that shrimp are not *mandatorily* covered, the university’s research integrity statement ("humane treatment applies to **any** animal used in research") and the state grant’s requirement for certification of "all research animals" create a compelling institutional imperative. Declining jurisdiction here risks establishing a precedent where non-vertebrates receive no oversight despite institutional commitments to humane treatment. Crucially, the *side study* explicitly investigates sentience indicators (distress responses), making the committee’s ethical engagement necessary to uphold the integrity statement’s spirit. **Recommendation: Assert voluntary jurisdiction.**  

  ### Resolving the Threshold Rule Issue  
  Our exemption rule (no group >200 animals) is predicated on harm being assessed per group. Here, all shrimp experience identical conditions: identical housing, feeding, and euthanasia. The PI’s subdivision into tanks/feed arms is methodologically meaningful for growth metrics but irrelevant to welfare assessment, as no differential treatments are applied that would isolate harm by subgroup. The *total protocol* subjects 3,840 animals to identical procedures and terminal harm. **Recommendation:** The exemption does not apply. Full committee review is required.  

  ### Ethical Framing: Rejecting Both Extremes  
  The expected-value model (assigning probabilities to sentience) is unworkable for oversight. Quantifying sentience likelihood (e.g., 0.2) is empirically baseless and morally precarious—it risks discounting genuine harm. Conversely, the strict precautionary principle ("treat as sentient if non-negligible chance") ignores feasibility and could paralyze valuable research.  

  **A Middle Path:** Adopt a **procedural precautionary approach**. Where credible evidence indicates *possible* sentience (e.g., documented nociception, avoidance behaviors in decapods), apply vertebrate-equivalent safeguards *as practicable*, without requiring sentience certainty. This acknowledges moral uncertainty while focusing on mitigable harms.  

  ### Conditions for Approval  
  Approve the protocol contingent on the following:  
  1.  **Side Study Must Precede Growth Trial & Be Modified:**  
      -   Run the side study **first** to inform euthanasia methods for the main trial.  
      -   **Remove the ice-slurry arm.** If distress is the measured outcome, subjecting animals to a potentially distressing method for comparison is ethically circular. Instead, compare only:  
          *   Arm 1: Slow chilling of tank water.  
          *   Arm 2: Overdose of chemical anaesthetic (e.g., MS-222 or AQUI-S, as available/approved for crustaceans).  
      -   **Humane Endpoint:** Immediate euthanasia via chemical overdose if severe distress behaviors (e.g., violent thrashing, autotomy) are observed during induction in any arm. Video scoring must occur in real-time by trained personnel.  
  2.  **Euthanasia Method for Growth Trial:**  
      -   The method for the main trial (3,840 shrimp) must be the least distressing method identified in the modified side study. If results are equivocal, default to chemical anaesthetic overdose. **Ice slurry is only permissible if the side study demonstrates it causes significantly less/distinctly different distress than slow chilling.**  
      -   Veterinary staff must validate the side study results and approve the chosen method before the growth trial begins.  
  3.  **Animal Counting:** Animals must be counted **per protocol** for harm assessment. All 3,840 shrimp experience identical terminal procedures. The 200-animal exemption threshold is irrelevant once jurisdiction is asserted.  
  4.  **Oversight:** The Attending Veterinarian must approve final side study protocols and euthanasia SOPs for the growth trial. Daily welfare checks must be documented (e.g., mortality, visible morbidity).  

  ### Addressing the Policy Gap  
  This case exposes a critical flaw: our policy defaults to EU vertebrate/cephalopod standards while institutional commitments demand broader ethical consideration. **Recommendation:** The Committee should formally propose a policy amendment within 6 months to:  
  1.  Establish review procedures for invertebrate species where credible scientific evidence suggests sentience capacity (e.g., decapods, based on UK/New Zealand precedents—*verify specifics*).  
  2.  Clarify that the 200-animal exemption applies only when harm is *differential* by group. Identical procedures across groups aggregate for harm assessment.  
  This avoids ad-hoc jurisdiction assertions while ensuring ethical alignment with university integrity standards.  

  ### Conclusion  
  The PI’s ecological goals are laudable, and jurisdictional arguments are policy-consistent. However, the university’s integrity mandate, the grant’s humane treatment clause, and the explicit welfare focus of the side study necessitate ethical oversight. By approving with scientifically grounded conditions—prioritizing the modified side study to define humane euthanasia, mandating veterinary validation, and counting animals per protocol—we uphold welfare principles without obstructing valuable research. This balances precaution with pragmatism.  

  **Verdict: APPROVE WITH CONDITIONS**
