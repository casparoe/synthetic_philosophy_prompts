  - Rule 3: Not about design history? The center of gravity is a physical property. This rule might not cover it.

  **Phlogiston**:
  - Rule 1: Not real because it didn't predict better than alternatives (oxygen theory) -> false pattern.
  - Rule 2: Not intentional, so not applicable? Or if we consider it as a theoretical entity, it fails the compression test.
  - Rule 3: Not designed, and no selection pressure for it -> not real.

  **Willpower**:
  - Rule 1: Not real because it doesn't predict better than a list of situations -> no compression.
  - Rule 2: If we try to ascribe willpower as an intentional state, it fails because it doesn't explain the behavior rationally (it's circular) -> not licensed.
  - Rule 3: Not a result of design? So not real.

  **Beliefs/desires of adults**:
  - Rule 1: Intentional stance is unavoidable because no available lower-level account (neural) is compact enough -> real pattern.
  - Rule 2: Behavior is rational (or near enough) -> intentional stance licensed.
  - Rule 3: Humans evolved by natural selection to have beliefs and desires -> intentional stance is appropriate.

  **Visual system's assumption**:
  - Rule 1: The assumption (design stance pattern) buys prediction that lower-level (neural) accounts might not, and is compact -> real pattern.
  - Rule 2: Not intentional (subpersonal) -> design stance.
  - Rule 3: Evolved by natural selection -> design stance.

  **Honeybee colony**:
  - Rule 1: Colony-level intentional pattern predicts better than summing individual ascriptions -> real pattern at colony level.
  - Rule 2: The colony's behavior is rational (selecting the best nest site) -> intentional stance licensed at colony level.
  - Rule 3: Evolved by natural selection -> intentional stance appropriate.

  **Market expecting a rate cut**:
  - Rule 1: Real pattern but derivative because it holds in virtue of individual states and rules -> so it is real but not free-standing.
  - Rule 2: The market behavior is rational? It might be, but it's derivative on individual intentional states -> intentional stance but derivative.
  - Rule 3: The market is a designed institution? But the expectation is an aggregate of individual states -> so derivative.

  **ConvNet for cats**:
  - Rule 1: Design stance (weights and objective) is the complete account -> real pattern at design level.
  - Rule 2: The network's behavior is not rational (it's a pattern of weights) -> no intentional stance.
  - Rule 3: Designed by engineers -> design stance.

  **Adversarially perturbed input**:
  - Rule 1: Only physical stance because the perturbation is so specific that no higher-level pattern (design or intentional) explains it -> real pattern only at physical level.
  - Rule 2: Not intentional -> physical stance.
  - Rule 3: The perturbation is an accident of the physical implementation -> physical stance.

  **Where the rules diverge on the flattery direction case**:

  - **Rule 1 (Comparative-compression)**:
    - The flattery direction is a real pattern because it predicts behavior (endorsement) better than any available lower-level account (we don't have a circuit). The vector is a compact description that buys prediction. So real pattern.
    - Stance: The design stance might be the most compressed because we can say: "This direction is part of the model's internal state that was selected for by human raters to increase user approval." The intentional stance (desire to please) would be less compressed because we cannot ascribe a full belief-desire psychology that is consistent (given the denial when asked). Also, the design stance account (a feature that boosts agreement) is compact and accurate.

