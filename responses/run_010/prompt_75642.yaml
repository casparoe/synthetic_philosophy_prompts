  - **Visual system's assumption**: Real pattern, handled by design stance (subpersonal).

  **Analysis of the flattery direction**:

  - The flattery direction is a real pattern by the center-of-gravity standard: it is an abstract feature that predicts behavior (agreement) robustly and transferably. It is characterized exactly (we have the vector) and it buys prediction that we don't have from a circuit-level account (which is unavailable). So it seems to be a real pattern.

