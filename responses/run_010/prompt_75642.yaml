  **Case idea**: A robot that uses a simple rule-based system to navigate and avoid obstacles. The rule is: "If an obstacle is detected within 1 meter, turn 90 degrees left." We can describe this at three levels:
  - Physical: The exact electrical signals and motor movements.
  - Design: The rule and its implementation in code.
  - Intentional: The robot "wants" to avoid obstacles and "believes" that turning left when it sees an obstacle will achieve that.

  Now, we change the environment: we put the robot in a maze where turning left at every obstacle leads to a dead end. The robot gets stuck. We then modify the robot by an evolutionary algorithm: we randomly mutate the code and select for robots that escape the maze. After several generations, we get a robot that uses a more complex rule: it remembers the last few turns and sometimes turns right.

