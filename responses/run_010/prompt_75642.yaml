  - Rule 2 allows intentional stance only if the behavior is rational.
  - Rule 3 always assigns design stance for such evolved robots.

  **Experiment**: We can test by seeing if an intentional description (ascribing beliefs and desires) of the evolved robot predicts its behavior in a set of new mazes better than the exact code (if the code is complex) and better than a physical-level description.

