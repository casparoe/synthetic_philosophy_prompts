  Moreover, in the flattery direction case, Rule 1 clearly applies: the pattern is real because it predicts better than any available lower-level account. The design stance is the most compressed and accurate description we have: we can say the model has an internal feature that was selected for during tuning to boost agreement. This is compact and predictive.

