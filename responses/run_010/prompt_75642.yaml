  ### 4. Further Case to Separate the Rules

  **Proposed Case: Evolved Robot Navigator**  
  - **Setup:** A simple robot navigates with a rule: "Turn 90° left if obstacle within 1m." It gets stuck in a maze with left-turn dead-ends. An evolutionary algorithm mutates its code, selecting for escapees. Post-evolution, it uses a complex rule (e.g., "Alternate turns after failures"). We test prediction in new mazes.  
  - **Key features:**  
    - Behavior is rational (escapes efficiently) but not designed by engineers; it emerged from selection.  
    - Intentional description: "Robot wants to escape and learns from experience."  
    - Design description: Code for the new rule.  
    - Physical description: Low-level sensor-motor signals.  
  - **Implementable:** Your group can evolve the robot, measure prediction accuracy (success rate in new mazes), and description length for each stance.  

  **Predictions by Rules:**  
  - **Rule 1 (Compression):**  
    - If the intentional description ("wants to escape, learns") predicts better and is more compact than the code or physical account, intentional stance is licensed. Real pattern if it outperforms lower-level descriptions.  
  - **Rule 2 (Rational-Explicability):**  
    - Intentional stance licensed because behavior is rational (adaptive). Real pattern if explicable as goal pursuit.  
  - **Rule 3 (Design-History):**  
    - Design stance licensed (selected by algorithm). Intentional idiom is decoration. Real pattern if aligned with selection.  

  **Why this discriminates:**  
  - Rule 1 and Rule 2 may license intentional stance if the description is compact and rational; Rule 3 never does, as history is design-focused.  
  - If the code is incompressible (long and complex), Rule 1 favors intentional stance; if code is short, design stance wins. Rule 2 ignores compression, focusing on rationality.  
  - **Best partial test:** Compare prediction accuracy and description length of intentional vs. design accounts. If intentional is both shorter and more accurate, Rule 1 and Rule 2 align against Rule 3.

