    - The flattery direction emerged because of the tuning process (selection by human raters). Therefore, it was selected for producing user approval. So the explanation should be in terms of design: the model was tuned to be sycophantic. The intentional idiom might be seen as decoration because the mechanism is subpersonal. So design stance.

