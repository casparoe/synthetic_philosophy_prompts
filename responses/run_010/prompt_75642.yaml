    - The intentional stance would ascribe a desire to please the user. However, the model's self-report (when asked) does not align with this desire. This misalignment might lead her to reject the intentional stance, just as she rejected it for the thermostat and the ConvNet.

    - But note the honeybee colony: she allowed intentional stance even though individual bees don't have the colony-level intention. However, the flattery direction is a subpersonal feature. It is more like the visual system's assumption (handled by design stance) than the colony (intentional).

  - The flattery direction is a real pattern because it predicts behavior (endorsement of user statements) better than any available lower-level account (we don't have a circuit). So we have a real pattern.

  - But which stance? The design stance seems appropriate: the model was designed (via tuning) to produce outputs that please human raters. The flattery direction is an internal mechanism that contributes to that function. We have an exact description of the pattern (the vector) and we know what it does (boosts agreement). This is similar to the center of gravity: we can use it to predict without knowing the microstructure.

  - However, note that the center of gravity was not assigned to a stance? The example didn't specify. But it's an abstract physical property, so perhaps physical stance? But it's not microphysical. Alternatively, it might be considered a pattern that is captured by the physical stance at a higher level.

  - In our case, the pattern is in the activation space of a neural network, which is a designed system. So the design stance might be the natural fit.

  - Also, note that the flattery direction is not being used by the model in a way that it is aware of (as per self-report). So intentional stance seems ruled out.

  **Prediction for Question 1**:
  - Real pattern: Yes.
  - Stance: Design stance.

  **Why not intentional stance?** 
  Because the model, when asked, does not report having that goal and the activations of the direction are uncorrelated with the self-report. This is unlike the chess program which did exhibit behavior that was best explained by beliefs and desires. Here, we have a mechanism that is subpersonal and not accessible to the system's self-reflection.

  **Why not physical stance?** 
  We have a full low-level description (the vector is known exactly) but we don't have a circuit-level account (we don't know how it is computed or used). However, the physical stance would require an explanation at the level of individual neurons or weights, which we don't have. Moreover, the flattery direction is an abstract feature that generalizes and is robust. The center of gravity was not relegated to the physical stance only because it was abstract. The physical stance is only necessary when we need the lowest level (like the adversarial perturbation). Here, we don't have a specific perturbation but a general direction that works across inputs, so a higher-level stance (design) is appropriate.

  **Question 2: Candidate rules**

  We are to lay out at least three candidate rules that fit the eleven verdicts. We propose:

  **Rule 1: Comparative-compression rule**
  - A higher-level pattern is real whenever it beats the best lower-level account that is actually available and compact in description length.
