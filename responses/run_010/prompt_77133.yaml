        - Yes: go to Question 2.
        - No: go to Question 3.

    Question 2: Does the magnet's ability to pull the filings depend on God? (For example, without God, would the magnet still work?)
        - Yes: Position (c)
        - No: Position (e)

    Question 3: Consider dry cotton dropped on a flame, which then chars. In this event, is God causing the cotton to char?
        - Yes: go to Question 5.
        - No: go to Question 6.

    Question 5: Suppose the cotton has been dropped on the flame a thousand times and charred every time. Now, the thousand-and-first time, it doesn't char, and nothing about the cotton or the flame has changed. Is this possible?
        - Yes: go to Question 7.
        - No: Position (b)

    Question 7: In the case where the cotton doesn't char (without any change in the cotton or flame), is God responsible for it not charring?
        - Yes: Position (a)
        - No: U2 (unexplored: God is not responsible for the break, but we also don't have any other cause)

    Question 6: When we see the cotton char after being placed on the flame, and we say "the flame caused the cotton to char", are we just describing a pattern we've seen and projecting our idea of cause onto it?
        - Yes: go to Question 9.
        - No: U1 (unexplored: there is regularity but we are not projecting cause)

    Question 9: Is it a mistake to say that the flame caused the cotton to char?
        - Yes: Position (d)
        - No: Position (f)

    Now, we write the positions:

    (a) God is the only genuine agent and the created thing is just the occasion.
        Awkward: This means God is directly responsible for every event, even the most mundane.

    (b) God is the only genuine agent, but the sequences are stable enough as a matter of His custom that predicting them is a real achievement and not a lucky guess.
        Awkward: The regularity is a matter of God's habit, but it could change at any moment without warning.

    (c) Created things have causal powers of their own, which God maintains but doesn't have to step in and operate.
        Awkward: God sustains the powers but does not directly cause each effect, so why do we need God for each event?

    (d) Nothing anywhere has causal powers — not God, not objects — there's just regular succession plus our habit of narrating it as causing.
        Awkward: There is no real difference between a causal sequence and a coincidental sequence of events.

    (e) Objects have real powers, period, and no theological term is needed.
        Awkward: The powers are inherent and independent of any divine activity.

    (f) Causal necessity isn't a feature of the world at all but of how we carve the world into causes and effects.
        Awkward: Causation is a human projection and not a feature of the world, so science is just pattern recognition.

    U1: Unexplored: There is regularity in the world, but we are not projecting cause. This might be an unattractive view because it leaves the regularity unexplained and we typically seek explanations for regularities.

    U2: Unexplored: God causes the normal sequence but not the break. This seems incoherent because if God is the only cause in the normal case, then in the break we would expect God to cause the break or not. If not, what does?

    We did not collapse any leaves. We separated (a) and (b) by the possibility of a break without physical change. We separated (d) and (f) by whether projecting cause is a mistake.

    We did not cover the arm-raising explicitly, but the same logic applies. For example, in the occasionalist branch, the decision to raise the arm would be an occasion for God to cause the arm to rise, and if it doesn't rise, then God did not cause it that time.

    This tree should fit on one page.

