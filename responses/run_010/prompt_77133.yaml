answer: |-
  Below is a decision tree designed as a one-page handout. It uses concrete scenarios and avoids all terms of art, forcing users to confront intuitions about agency, regularity, and breaks in sequences. The tree starts with a neutral physical case (magnet and iron) to sidestep preconceptions about fire/cotton or divine action, then branches to cover all specified cases. Positions are labeled (a) through (f), with notes on collapsed views, unexplored paths, and awkward commitments. Al-Ghazālī’s view isn’t baked in—answer honestly to place him.

  ---

  ### **Causality Decision Tree**  
  *Answer based on intuition—no philosophy jargon allowed!*

  #### **Q1: When a magnet moves iron filings, is the magnet actively doing something to the filings?**  
  - **Yes** → Go to Q2.  
  - **No** (it’s just things happening one after another, or God does it) → Go to Q3.  

  #### **Q2: If bread nourished people 1,000 times but fails on try 1,001 with no change in the bread or person, could this happen?**  
  - **Yes** (even with identical setup) → Go to Q4.  
  - **No** (something *must* be different in the bread/person for nourishment to fail) → **Position (e):** Objects have real powers, period.  
     *Awkward: Fire burns cotton even if God doesn’t exist.*  

  #### **Q3: When cotton chars in a flame, is God making it happen?**  
  - **Yes** → Go to Q5.  
  - **No** → Go to Q6.  

  #### **Q4: If the magnet’s power vanished one day with no change in the magnet, what’s responsible?**  
  - **God** (He stopped it) → **Position (c):** Created things have powers, but God keeps them working.  
     *Awkward: God "maintains" powers but doesn’t directly cause each event.*  
  - **Nothing/No one** (it just stopped) → **Position (d):** Nothing has powers; just regular sequences + human storytelling.  
     *Awkward: No difference between fire burning cotton and a random leaf blowing by.*  

  #### **Q5: Cotton chars in a flame 1,000 times. On try 1,001, it doesn’t char—and nothing physical changed. Is this possible?**  
  - **Yes** → Go to Q7.  
  - **No** → **Position (b):** God is the only agent, but His habits are stable.  
     *Awkward: Predictions work only because God is consistent (but He might change tomorrow).*  

  #### **Q6: When we say "flame causes cotton to char," are we just describing past patterns?**  
  - **Yes** → **Position (f):** Causation is how we label sequences.  
     *Awkward: Science discovers patterns, not "real" causes.*  
  - **No** → Go to Q8.  

  #### **Q7: If cotton doesn’t char when dropped on a flame (with no physical change), who/what is responsible?**  
  - **God** → **Position (a):** God is the only genuine agent; creation is just the occasion.  
     *Awkward: God directly makes fire burn every single cotton ball.*  
  - **No one/Unclear** → **Unexplored View X:** *Incoherent—if God causes all events, He must cause breaks too.*  

  #### **Q8: A woman decides to raise her arm, and it rises. Is her decision actively doing anything?**  
  - **Yes** → **Position (e)** (same as Q2 → No).  
  - **No** (it’s just thoughts followed by motions, or God does both) → **Position (d)** (same as Q4 → Nothing/No one).  

  ---

  ### **Notes on Results**  
  - **Collapsed positions:** (b) and (d) **do NOT collapse** in this tree:  
    - (b) requires God’s agency (Q3 → Yes; Q5 → No).  
    - (d) denies all agency (Q3 → No; Q6 → Yes or Q8 → No).  
  - **Unexplored View X:** Reached if you deny God’s responsibility for breaks (Q7 → No one). *Incoherent—breaks require a cause, but you’ve ruled out God and created powers.*  
  - **Al-Ghazālī’s placement:** He likely ends at (a) or (b) depending on Q5. If he says breaks *are possible* without physical changes → (a); if he says God’s habits *prevent* breaks → (b).  
  - **Missing nuance?** The tree separates all specified views. If your group’s "occasionalism" conflates (a)/(b) or (d)/(f), it’s due to differing intuitions about breaks (Q5, Q7) or pattern-labeling (Q6).  

  ### **Why This Works**  
  - **No steering:** Questions use concrete cases (magnet, bread, arm-raise) and avoid vocabulary like "power" or "necessity." You can’t game the system.  
  - **Covers all cases:** Breaks (Q4, Q5, Q7), human agency (Q8), and regularity (Q2, Q5, Q6) are integrated.  
  - **Clarifies ambiguities:** Groups saying "I’m an occasionalist" might mean (a), (b), or even (c)—this forces distinctions.  

  Print and distribute—let the intuitions clash!
