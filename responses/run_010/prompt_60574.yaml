prompt: |-
  Right, so I'm in the second year of a metaphysics PhD, my thesis is meant to be about what dispositions are, and I'm due to give my confirmation review in about six weeks. Honest answer: I've spent four months on the fink and mask literature and have nothing to show for it except a wall of index cards and a headache. My supervisor's advice was that before I commit to any particular analysis I should write down what a decent analysis actually has to do — not which one wins, just the job description — and that's the bit I want your help with. Please act as a professional metaphysician who works on dispositions and powers, has strong opinions of their own, but can keep those opinions seperate from the requirements. And do think it through rather than just producing a list: brainstorm a long messy set of candidate demands first, tell me which ones you're throwing out and why, and only then give me the clean version.

  Here's the shape I want the clean version in. Each requirement stated precisely; then the case or consideration that generates it — the specific counterexample, or the distinction that would get collapsed, or the thing the analysis would contradict; then a tag saying whether it's non-negotiable or just a prejudice of one camp. The camp tags matter a lot to me. My suspicion is that several things people insist on are demands that particular programmes make rather than requirements any analysis has to meet: that the analysis be reductive rather than allowed to use dispositional vocabulary in the analysans, that dispositions have to come out intrinsic, that it must cope with multi-track cases like irascibility and not just tidy single-track ones like solubility, that it must deliver a plain conditional rather than something with a ceteris paribus clause bolted on, that it must classify Johnston's hater of styrofoam the same way in both directions (people seem to use that one for more than a single purpose and I've never got clear on whether it's one case or two). Sort all of that out, and say which of those demands could be dropped with the project still intact.

  Most important part: identify any subset of the requirements that cant be jointly satisfied. I've got a feeling there's a genuine no-go here rather than just a run of hard cases — something like the demand that the analysis handle masks and antidotes while staying reductive and non-trivial, combined with the causal-basis clause needing a basis that isn't itself finkish, which looks like it runs you up a regress with a fink for the fink. If that's right, saying so is the result I want, not a footnote. Then tell me which single requirement knocks out the most candidate analyses, since that's the one I should build the thesis around. Two smaller things to fold in: first, is the mask/antidote distinction real at all, or is an antidote just a mask described from the other end — because if it isn't real, whatever requirement is doing the "keep the two apart" work needs rewriting, and I need to know which. Second, my flatmate, who does materials science, keeps asking me whether fragility is even testable if a glass wrapped in foam never gets dropped once; if there's a neat way to turn that into a requirement, or to say it isn't one, give me a sentence on it. No references or reading list please — I have all the papers, I just can't see the wood for the trees.
reasoning: |-
  Okay, the user is a second-year PhD student in metaphysics, working on dispositions for their thesis. They're stuck on the fink and mask literature and need help defining what a good analysis of dispositions must achieve. Their supervisor suggested outlining the job description for any analysis before committing to one. 

  First, I need to recall the key issues in disposition analysis: finks, masks, antidotes, causal basis, intrinsicality, multi-track dispositions, and conditional analyses. The user mentioned specific problems like Johnston's styrofoam hater and the testability of fragility. 

  The user wants a structured approach: brainstorm requirements, filter them, state each precisely with justifications, tag negotiability and camp affiliations, identify conflicts, and highlight the most problematic requirement. They also want clarity on the mask/antidote distinction and fragility's testability.

  Starting with brainstorming, possible requirements include avoiding finks and masks, handling intrinsicality, multi-track dispositions, non-circularity, modality, causal basis, antidote-mask distinction, and testability. Some might be contentious, like intrinsicality, which some camps reject. 

  Filtering out negotiable demands: intrinsicality isn't essential for all, as extrinsic dispositions exist. Multi-track dispositions can be handled by reducing them to single-track. A ceteris paribus clause might be necessary, so demanding a plain conditional is too strict. Johnston's case might be misused; it's better to focus on other counterexamples. 

  Non-negotiable requirements: avoiding finks and masks, non-circularity (if reduction is the goal), modality (dispositions imply possibility), causal basis (to prevent regress), and testability (dispositions must be detectable). The antidote-mask distinction should be preserved to maintain different failure modes.

  Conflicts arise: avoiding finks/masks while staying reductive and non-trivial is tough. A reductive analysis using conditionals struggles with masks, leading to a regress if the causal basis is finkish. The biggest conflict is between reductive analysis and handling masks without triviality. 

  The most damaging requirement is handling masks/antidotes, as it challenges many analyses. The mask/antidote distinction is real; masks prevent manifestation without altering the disposition, while antidotes interrupt the process. Fragility's testability isn't a requirement for the analysis itself; it's about evidence, not ontology. 

  The user should focus on the mask/antidote problem as it's central. The key insight is that a reductive conditional analysis might be impossible without triviality, suggesting a need for primitivism or non-reductive approaches. Highlighting this conflict could structure their thesis.
answer: |-
  Here’s a professional breakdown of the core requirements for a dispositional analysis, structured as requested. I’ll start with a messy brainstorm, filter it, then present the clean framework with conflicts and your specific queries addressed.

  ### Brainstorm (Messy Candidate Demands)
  1.  Avoids finks (disposition lost *before* test).
  2.  Avoids masks (disposition present but manifestation blocked).
  3.  Avoids antidotes (manifestation process interrupted *after* stimulus).
  4.  Handles reverse/antidote finks (finkish preventers?).
  5.  Respects intrinsicality (disposition depends *only* on bearer).
  6.  Allows extrinsic dispositions (if any exist).
  7.  Handles single-track (fragile=breaks if struck).
  8.  Handles multi-track (irascible=angry if insulted *or* glared at *or*...).
  9.  Delivers a plain conditional (If C, then M).
  10. Allows *ceteris paribus* (CP) clauses.
  11. Is reductive (analysans non-dispositional).
  12. Is non-reductive (allows dispositional terms).
  13. Avoids triviality (not "disposed to M when C iff disposed to M when C").
  14. Grounds modality (explains possibility/necessity link).
  15. Specifies a causal basis (underlying property).
  16. Avoids regress (causal basis shouldn't itself need a fink-proof basis).
  17. Handles Johnston's styrofoam cases symmetrically.
  18. Preserves distinction between masks & antidotes.
  19. Makes dispositions testable in principle.
  20. Compatible with quiescence (disposition can exist unmanifested).
  21. Explains stimulus-manifestation link.

  ### Filtering & Justification
  *   **Dropped: Intrinsicality (#5)**. Strongly camp-dependent (Lewisian reductionists demand it; Mumford/anti-reductionists reject it as essential). Not core to *analysis*, but to *which dispositions exist*. Requirement for analysis should be neutrality.
  *   **Dropped: Multi-track as Fundamental (#8)**. Can be handled by reducing multi-track to clusters of single-track dispositions (e.g., irascibility = disposition-to-anger-if-insulted + disposition-to-anger-if-glared-at + ...). Not a *sine qua non* for *any* analysis. Camp preference (Ryleans might insist; others reduce).
  *   **Dropped: Plain Conditional (#9 vs. #10)**. Insisting on *no* CP clause is a prejudice (especially of conditional analysts like Lewis/Choi). Masks/antidotes *force* some form of exception-handling. A good analysis must *explain* or *incorporate* CP, not ban it. Non-negotiable is *handling exceptions*, not the form.
  *   **Dropped: Johnston Symmetry (#17)**. Johnston's cases (e.g., styrofoam-cup-destroyer-if-styrofoam, styrofoam-protector-if-not-styrofoam) are often misapplied. They primarily challenge *specific conditional analyses* (showing asymmetry) or test intrinsicality/extrinsicality. Not a universal requirement for *every* analysis, more a test for *specific programs*. We keep the underlying issues (#1, #2, #3, #5/#6) instead.
  *   **Dropped: Testability (#19)**. Important epistemically, but ontological analysis defines *what a disposition is*, not how we know it. Your flatmate's point is about evidence, not ontology. A disposition *can* exist unmanifested and untested (quiescence, #20). Keep quiescence, drop testability as an analytic requirement.
  *   **Kept & Refined:** The rest (#1, #2, #3, #4, #6, #7, #11, #12, #13, #14, #15, #16, #18, #20, #21). These address core metaphysical features or major counterexample classes.

  ### Clean Requirements Framework
  1.  **Requirement:** **Finkish Immunity**  
      *   **Precise Statement:** The analysis must not incorrectly ascribe a disposition that is lost precisely *during* the occurrence of the stimulus condition (prior to the point where manifestation would normally begin).  
      *   **Generating Case:** Martin’s electro-fink (wire attached to live circuit makes fragile object non-fragile *just as* it is struck).  
      *   **Negotiability:** **Non-negotiable**. Any analysis failing this misidentifies dispositions across vast swathes of cases.
      *   **Camp Tag:** Universally demanded, though solutions differ radically (e.g., simple conditionals fail; causal basis theories add structure; primitivists avoid conditionals).

  2.  **Requirement:** **Mask Tolerance**  
      *   **Precise Statement:** The analysis must allow that a disposition can be present *and* its stimulus condition occur *without* the manifestation occurring, due to an interfering factor that *blocks* the manifestation process *without* altering the disposition itself.  
      *   **Generating Case:** Bird’s sorcerer placing a safety net under a dropped fragile glass (fragility present, striking occurs, breaking doesn't).  
      *   **Negotiability:** **Non-negotiable**. Masks are ubiquitous in the actual world (foam wrapping *is* a mask for fragility upon dropping).
      *   **Camp Tag:** Universally accepted as a problem. Reductionist camps (especially conditional analysts) struggle most; primitivists handle it easier by separating disposition from manifestation.

  3.  **Requirement:** **Antidote Accommodation**  
      *   **Precise Statement:** The analysis must allow that a disposition can be present, its stimulus occur, and the manifestation process *begin*, yet be *interrupted* before completion by an external factor, preventing the full manifestation.  
      *   **Generating Case:** Giving an antidote to someone who has just ingested poison (poisonous disposition present, ingestion stimulus occurs, death manifestation begins but is halted).  
      *   **Negotiability:** **Non-negotiable**. Fundamental to understanding process-based dispositions.
      *   **Camp Tag:** Often conflated with masking, but distinct. Crucial for process-based views (Molnar, Mumford). Conditional analyses struggle to distinguish from masks.

  4.  **Requirement:** **Causal Basis Specification (Conditional)**  
      *   **Precise Statement:** If the analysis is reductive, it must identify a non-dispositional, categorical property (the causal basis) that grounds the disposition and explains the potential for manifestation.  
      *   **Generating Case:** Need to avoid circularity (#13) and explain *how* the disposition does its work (e.g., solubility grounded in molecular structure).  
      *   **Negotiability:** **Negotiable (Camp-Specific)**. Essential for *reductionist* programs (Lewis, Armstrong, Prior/Pargetter). Explicitly rejected by anti-reductionists/primitivists (Mumford, Bird later) and some powers theorists who see dispositions as fundamental.
      *   **Camp Tag:** Core to **Reductionism**.

  5.  **Requirement:** **Non-Triviality / Non-Circularity**  
      *   **Precise Statement:** The analysans must not contain the analysandum or trivially entail it without explanatory power.  
      *   **Generating Case:** "x is fragile iff x is disposed to break if struck" is circular/trivial. "x is disposed to M if C iff x has some property B such that if C, then B causes M" risks triviality if B is *just* "whatever causes M if C".  
      *   **Negotiability:** **Non-negotiable for Reductionism, Relaxed for Primitivism**. Reductionists *must* avoid circularity. Primitivists accept dispositional terms as fundamental, avoiding *reductive* circularity but not using the *same* disposition in the analysans.
      *   **Camp Tag:** Non-negotiable for **Reductionism**. Primitivists/Powers Theorists circumvent it by rejecting reductionism (#11).

  6.  **Requirement:** **Modality Grounding**  
      *   **Precise Statement:** The analysis must capture the modal force inherent in dispositions (x *would* M *if* C *were* to happen, even if C never happens).  
      *   **Generating Case:** Untested fragility (glass never dropped) still implies it *would* break *if* struck. Distinguishes dispositions from mere accidental regularities.  
      *   **Negotiability:** **Non-negotiable**. Constitutive of what a disposition *is*.  
      *   **Camp Tag:** Universal. Solutions vary (possible worlds for conditionals, sui generis modality for powers).

  7.  **Requirement:** **Quiescence Compatibility**  
      *   **Precise Statement:** The analysis must allow dispositions to exist stably even when their stimulus condition is absent and manifestation is not occurring.  
      *   **Generating Case:** An unbroken, undropped fragile glass.  
      *   **Negotiability:** **Non-negotiable**. Essential to avoid dispositions "flashing" in and out of existence.  
      *   **Camp Tag:** Universal. Failure here is fatal for any analysis.

  8.  **Requirement:** **Stimulus-Manifestation Link**  
      *   **Precise Statement:** The analysis must explain the *connection* between the specific stimulus (C) and the specific manifestation (M).  
      *   **Generating Case:** Why does striking (C) link to breaking (M) for fragility, not to shattering or melting? Avoids promiscuity (everything disposed to do anything under any condition).  
      *   **Negotiability:** **Non-negotiable**. Defines the identity of the specific disposition.  
      *   **Camp Tag:** Universal. Often handled implicitly via the causal role of the causal basis (#4) or the nature of the power itself.

  ### Addressing Your Specifics

  1.  **The Antidote/Mask Distinction: Is it Real?**
      *   **Yes, it's ontologically significant.** A **mask** *prevents the disposition's characteristic process from even starting* in response to the stimulus (safety net prevents the glass's internal stressed state from initiating shattering upon impact). An **antidote** *interrupts an already ongoing characteristic process* triggered by the stimulus (antidote halts the biochemical cascade *after* poison ingestion begins). Requiring the analysis to *accommodate both failure modes distinctly* (Requirements #2 & #3) is crucial. Collapsing them loses explanatory power for different ways dispositions fail.

  2.  **Your Flatmate's Point (Fragility & Testing):**
      *   **Not an analytic requirement, confirms Quiescence (#7).** The analysis defines the disposition *ontologically*. That a disposition *can* exist unmanifested and untested is a core feature (quiescence), not a flaw. The foam-wrapped glass *is* fragile; its fragility is *masked* upon dropping. Testability is an epistemic concern separate from the metaphysical analysis. The requirement is that the analysis *allows* for quiescence, not that it guarantees testability in every scenario.

  3.  **Conflicting Requirement Subset (The No-Go):**
      *   **The Trilemma:** A reductive analysis (Demand #11) aiming for non-triviality (#5) that successfully handles both finks (#1) and masks (#2) *while also* specifying a non-finkish causal basis (#4) faces a severe regress threat.
          *   **The Regress:** Suppose disposition D is grounded in categorical basis B1. To handle finks for D, B1 must be such that it doesn't disappear *when C occurs*. But what guarantees B1's persistence? If B1 itself has a disposition (D1) to persist when C occurs, then we need its basis B2. To prevent B1 from being *finkishly* lost when C occurs, D1 must be fink-proof... requiring *its* basis B2 to be non-finkish... and so on. Avoiding this requires either:
              *   **Primitivism:** Abandon reductivism (#11), making dispositions/powers fundamental (no basis needed).
              *   **Triviality:** Accept B is just "whatever grounds the disposition" (violates #5).
              *   **Ignoring Basis Finks:** Stipulate bases are "fink-proof" by fiat (unsatisfactory, ad hoc).
      *   **This is a genuine no-go for *reductive* analyses that take masks/finks seriously.** It suggests that if dispositions are real and masks/finks are genuine phenomena, a satisfying *reductive* analysis might be impossible without triviality.

  4.  **The Single Most Damaging Requirement:**
      *   **Handling Masks/Antidotes (#2 & #3).** This is the requirement that consistently derails otherwise promising analyses, particularly *reductive conditional analyses*. Finks (#1) are often handled by adding a "retains the basis" clause. But masks/antidotes resist clean incorporation into a conditional without resorting to CP clauses (which many find unsatisfactory) or hidden dispositionality. It exposes the deepest tension between the simple conditional form and the complex reality of interfering factors. **Building your thesis around the challenge of masks/antidotes is strategically sound.** It's the locus of the most intense debate and where the fundamental choice between reductionism/primitivism/powers is most sharply forced. The mask/antidote problem *is* where the conditional analysis arguably goes to die, pushing one towards causal bases (with their own problems) or primitivism.

  **Conclusion:** The core non-negotiable requirements for *any* analysis are Finkish Immunity, Mask Tolerance, Antidote Accommodation, Non-Triviality/Non-Circularity (interpreted relative to the approach), Modality Grounding, Quiescence Compatibility, and Stimulus-Manifestation Link. The requirement for a Causal Basis and strict Reductionism are camp-specific demands central to one major program but rejected by others. The biggest conflict is between Reductionism + Non-Triviality + handling Masks/Antidotes, pointing towards a fundamental limitation of the reductive project and making the mask/antidote challenge the most fertile ground for thesis development. Focus your confirmation review on dissecting *this* nexus.
