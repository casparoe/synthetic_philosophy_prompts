  2. **Two Types of Herding: Informational vs. Payoff**:
     - (a) Informational herding: Buying because others' actions are signals about the state (squeeze potential). Predicts fragility to public signals or contrarian actions.
     - (b) Payoff herding: Buying because the payoff (from the squeeze) depends on others buying. Predicts collapse when coordination breaks (e.g., buy-halt) or when early buyers cash out.
     - The Jan 28 buy-halt: It broke the coordination (for b) and also provided a negative signal (for a). The price collapse is consistent with both, so it does not cleanly discriminate. However, the explicit coordination on Reddit and the focus on squeeze mechanics suggest (b) was the dominant driver.

  3. **Impact on Theory**:
     - The event is not a canonical cascade because of the endogenous state (the squeeze is created by the actions) and the role of public coordination. It is closer to a coordination game.
     - The theory (cascade models) can be extended to include endogenous states and coordination, but this is an active area of research.
     - The professional side (e.g., herding among short sellers due to career concerns) is not well captured by retail cascade models and might fit better with reputational herding models.

  4. **Settled and Contested in Cascade Theory**:
     - Settled: The mechanics of cascades in the theoretical models (as described by Banerjee and BHW) are well established under their assumptions.
     - Contested: 
          - Whether cascades are common in real-world markets.
          - Whether the meme-stock episode is a cascade or a coordination game.
          - The relative importance of informational vs. payoff factors in herding events.

     - The (a)/(b) split is a useful framework but might be too clean because both mechanisms can interact.

  **Final Note for the User**:
