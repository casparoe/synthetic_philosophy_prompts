prompt: |-
  The association I belong to has a standards panel — six elected members, on which I have now served two years — that decides complaints alleging a member's public statement was one they should not have made: testimony, a newspaper interview, a remark at a community meeting, a claim in a trade publication. We rule first on breach, then separately on sanction, and we have several times found a breach while sanctioning no one. We have issued six rulings, and they are now the record I am expected to reason from.

  1. A member wrote in a county newsletter that a lake's algal blooms were being driven by fertilizer runoff from the surrounding farms. She had three seasons of her own sampling and a published loading model, the claim was true, and she believed it. Complaint dismissed.

  2. A member told a reporter that a landfill was contaminating a school's well, on the strength of a smell at the fence line and one unverified home test kit. She believed it, and it was true: the state confirmed the contamination fourteen months later. Complaint upheld, formal censure. The minute records that she "spoke as one who had checked when she had not."

  3. A member testified to a state committee that a pesticide was safe at labeled application rates, relying on two peer-reviewed studies she had read closely and the regulator's own published review. She believed it. A larger independent study the following year found harm at those rates. Complaint dismissed, with one member dissenting on the ground that a statement which turns out false breaches the standard however carefully it was made.

  4. A member told a televised town meeting that a plant's emissions posed "no health risk to families in the district." Her basis was the operator's compliance reports, which she had not audited and which a residents' group had publicly disputed; the reports were accurate as far as they went, but did not cover a fugitive-emissions pathway identified six weeks later. Roughly two hundred families acted on what she said. Complaint upheld, no sanction. The minute records that "the evidence she had was the evidence the operator had chosen to give her."

  5. A member testified that a municipal water supply met every applicable standard and was safe to drink, on the strength of an analysis she had commissioned and could document line by line. It was true and fully disclosable; privately, for reasons connected to her own child's illness, she did not believe it, and said it flatly anyway. Complaint dismissed, with one member dissenting on the ground that she had asserted what she did not believe.

  6. Asked during a contamination scare whether the town's water might be affected, a member holding a single anomalous sample said: "I can't rule it out, we don't have the data yet, and if you are on a private well you should boil it until the county reports." The water was in fact affected. A resident complained that she had alarmed a town on almost no evidence. Complaint dismissed.

  I have tried to write down what we are doing as one of the obvious rules — assert only what is true; assert only what you know; assert only what you believe; assert only what you reasonably believe — and each of the first three is flatly contradicted by at least one ruling above. The fourth I cannot make fit either, though I cannot say precisely where it breaks.

  The complaint we hear next month is this. A certified drinking-water microbiologist of twenty years' experience, asked on camera at a public meeting during an active scare whether the water in a town of four thousand was safe to drink, said: "The water is safe to drink." She had collected samples herself that morning at four points in the distribution system and run the standard culture method on all of them, with clean results, within her lab's accreditation. She knew, and did not say, that this method has a documented false-negative rate of about one in two hundred at low contamination levels and detects only the organisms on the standard panel. She posted the raw results to the town's website that evening and offered to walk anyone through them; nothing was confidential. Most of the people in the room would decide that night whether to drink the water. Three days later a different laboratory, using a molecular method, found the organism; eleven people were hospitalized. She believed what she said when she said it, and the complaint alleges that she asserted more than her evidence supported.

  Please give me the following. First, the rules that are jointly consistent with all six precedents — not the ones I have been assuming, but whatever actually fits — each stated precisely enough to yield a determinate verdict on an unseen case, together with the precedent each rule is doing the most work to explain and the precedent that is most awkward for it. Second, what each surviving rule implies about the new complaint. Third, your recommendation on how I should vote, on breach and on sanction separately, identifying the closest analog among the six: I keep landing on precedent 3 and precedent 4 as the rival candidates and cannot decide between them, so tell me which is closer and why, and what turns on that choice. Fourth, if the record genuinely underdetermines the case, say so plainly rather than manufacturing a deduction, and tell me what principle we would be adopting by deciding either way — what it would commit us to in complaints none of us has yet seen, and what it would put permanently beyond complaint. Fifth, one further complaint, described concretely, that would most sharply reveal which rule we have in fact been applying, with each rule's predicted verdict on it. And throughout, flag the places where you are supplying a judgment rather than reading the record, including whether our habit of finding breaches without sanctions is innocent bookkeeping or a substantive commitment.

  If there are standard names in the literature for the positions you identify, use them, but I do not want a bibliography or attributions. Begin your answer with your recommended verdict — breach or no breach, sanction or no sanction — in the first sentence, and then give the reasoning; no preamble and no restatement of the above.
reasoning: |-
  Hmm, I need to tackle this complex ethics panel case step by step. The user is part of a standards panel that evaluates members' public statements based on six precedents, and they're struggling to identify consistent rules. Now they're facing a new complaint about a microbiologist who declared water safe during a contamination scare.

  Looking at the precedents, truth alone isn't the standard - cases 2 and 4 were sanctioned despite being true, while case 3 was dismissed despite being false. Belief also isn't sufficient - case 5 was dismissed even when the member didn't believe their own true statement. The key seems to be about the relationship between evidence and assertion.

  For case 2, the censure was for "spoke as one who had checked when she had not" - suggesting an honesty about evidence basis is crucial. Case 4's breach without sanction highlights that relying solely on unverified operator reports was inadequate. Case 3 shows that even false statements are acceptable if properly researched.

  The microbiologist's case is tricky. She had clean test results but knew about methodological limitations (false negatives, limited detection scope). This feels like a hybrid between case 3 (adequate basis despite later falsification) and case 4 (incomplete verification). But she actively collected samples herself, unlike case 4's passive reliance.

  The consistent rules emerging are:
  - Rule A: Don't misrepresent your verification level (explains case 2 best)
  - Rule B: Verify sufficiently given stakes/consequences (awkward for case 3)
  - Rule C: Don't assert without belief (awkward for case 5)

  For the new case, Rule A leans toward no breach since she didn't misrepresent her basis. Rule B suggests breach because higher stakes demanded disclosing test limitations. Case 4 is closer than case 3 because both involved incomplete verification during public health emergencies.

  If we dismiss, we're saying disclosure of methodology limitations isn't required. If we uphold, we're imposing a duty to disclose methodological caveats in high-stakes situations. A good test case would be someone with strong evidence but undisclosed conflict of interest.
answer: |-
  No breach, no sanction.

  The rules jointly consistent with all six precedents are:

  1.  **Rule of Evidential Basis (Do not assert a claim as verified when your basis falls materially short of what a reasonable member would deem adequate verification under the circumstances, including the stakes and your expertise):** This rule does the most work explaining Precedent 2 (upheld: claimed verification she lacked) and Precedent 4 (upheld: basis was solely unverified operator reports, stakes high). It is most awkward for Precedent 3 (dismissed: basis was reasonable peer-reviewed studies and regulator review, despite later falsification), as the claim *was* false, but the basis was deemed adequate at the time.
  2.  **Rule of Belief (Do not assert a claim you do not believe to be true):** This rule does the most work explaining Precedent 5 (dismissed: asserted truth she privately disbelieved). It is most awkward for Precedent 4 (upheld: she *believed* her statement, yet breach found) and Precedent 2 (upheld: she *believed* it, yet breach found), as belief alone was insufficient to avoid breach.
  3.  **Rule of Truth (The objective truth or falsity of the claim is not, by itself, determinative of breach):** This rule does the most work explaining Precedent 2 (upheld: claim true) and Precedent 3 (dismissed: claim false). It is most awkward for Precedent 1 (dismissed: claim true) and Precedent 6 (dismissed: claim true), where truth aligned with dismissal, but the rule emphasizes truth is not the *basis* for the verdict. (Judgment: This is a negative rule derived from the pattern, not a positive requirement).

  **Application to New Complaint:**
  *   **Rule of Evidential Basis:** Her basis (self-collected samples, standard accredited method run, clean results, full disclosure) was adequate verification for a qualified microbiologist in an urgent situation. While aware of methodological limitations (false negatives, limited panel), these are inherent professional knowledge; she did not misrepresent her basis (posted raw data, offered explanation). Stakes were high, but demanding disclosure of *all* methodological caveats in a definitive public safety pronouncement during a scare is impractical and not required by precedents. **Implies: No Breach.** (Judgment: Weighing adequacy of basis under urgency).
  *   **Rule of Belief:** She believed the water was safe when she made the statement. **Implies: No Breach.**
  *   **Rule of Truth:** The claim was false (water was unsafe). **Implies: Not determinative.**

  **Recommended Vote & Analog:**
  *   **Breach:** Vote **No**. The microbiologist conducted timely, appropriate verification using standard methods within her expertise and disclosed her data. Her basis was materially stronger and more active than the member in Precedent 4 (who relied solely on disputed, unaudited operator reports). The core of Precedent 4 was reliance on incomplete, unchallenged information from a potentially biased source without independent verification. Here, the microbiologist performed independent verification.
  *   **Sanction:** Vote **No**. Finding no breach precludes sanction.
  *   **Closest Analog:** **Precedent 3** is closer. Both involved:
      *   Qualified professionals making definitive safety claims (pesticide/water).
      *   Relying on timely, standard, peer-reviewed/accredited methods and results available to them.
      *   Statements later proven false by subsequent, different/more advanced testing.
      *   High stakes involved.
      *   Breach dismissed despite falsity because the basis was deemed adequate at the time. The key similarity is reliance on a professionally reasonable methodology and evidence base, even if imperfect or later superseded.
  *   **Distinction from Precedent 4:** Precedent 4 involved *passive reliance* on information provided solely by the entity whose product was being defended (operator reports), without any independent verification or apparent critical assessment, especially in the face of public dispute. The microbiologist *actively gathered and analyzed independent data* using standard professional methods. Precedent 4's breach centered on inadequate *source* and *lack of verification effort*, not inherent methodological limitations known to all professionals.

  **Underdetermination & Principle:**
  The record does not definitively resolve whether the microbiologist's failure to *volunteer* the caveats about her method's limitations constitutes a breach. Deciding **No Breach** (as recommended) adopts the principle that a member using standard, accredited methods appropriate to the urgency and stakes, who discloses their specific data basis, meets the verification standard even if aware of inherent, general methodological limitations. This puts professionally reasonable reliance on standard methods beyond complaint, absent misrepresentation of the basis or failure to use available appropriate methods. Deciding **Breach** would adopt the principle that awareness of significant methodological limitations *requires* their disclosure when making definitive safety claims during public health scares, regardless of the standardness of the method used. This would impose a significant new duty of caveat disclosure beyond the existing precedents, potentially making many urgent professional pronouncements vulnerable to complaint.

  **Revealing Test Case:**
  "A member testified before a city council that a new traffic calming design was 'proven to reduce accidents by at least 20% based on the developer's studies.' He had read the developer's summary report highlighting this finding but had not read the underlying study, which (unbeknownst to him) contained a major methodological flaw invalidating the result. He believed his statement. A week later, an independent analyst exposed the flaw. The claim was therefore false and lacked adequate basis." (Judgment: This case isolates reliance on an *unverified source* without inherent methodological caveats).

  *   **Rule of Evidential Basis Prediction: Breach** (upheld). Basis fell materially short – relying solely on a developer's summary without reading/verifying the underlying study is inadequate for an expert testimony context, akin to Precedent 2/4.
  *   **Rule of Belief Prediction: No Breach** (dismissed). He believed it, like Precedent 5.
  *   **Rule of Truth Prediction: Not determinative.**

  **Habit of Breach without Sanction:** This is a **substantive commitment** (Judgment). Precedent 4 shows breach based on inadequate verification/evidential basis, while recognizing no *culpable lack of diligence or bad faith* warranting sanction. It distinguishes the *wrongness of the assertion* from *personal fault*.
