prompt: |-
  You're an experienced philosophy teacher who designs hands-on sessions — assume you've actually run dozens of these in real rooms and know which bits collapse on contact. Before the write-up, sketch two or three candidate designs in a line or two each, say which you're cutting and why, then give me the full one.

  Setting: evening reading group, 14 adults, mixed background, half have never done philosophy. One 75-minute session. Tables of 3-4, whiteboard, index cards, no screens, no real money — points or candy at most.

  What I want: they build the surprise-exam argument themselves, day by day, ruling days out, and walk into the wall before anyone tells them there is a wall. Don't name the paradox up front. The induction has to come out of their mouths, and then something has to actually ambush them.

  The mechanic I care most about: one round where whoever makes the announcement is known to be flaky — renegs sometimes, forgets, double-books — and my hunch is thats where the room clicks, because trusting the announcer and being capable of being surprised seem to trade off against each other. Build that in as a rule, not as me saying it aloud. Tell me if the hunch is wrong or just a fun detour from the real crux; I'd rather know now.

  Deliverables: rules, materials, minute-by-minute timeline, what each round is meant to expose, debrief questions that map what happened onto the steps of the argument, the two or three things that will predictably go wrong the first time I run it and how to recover mid-session, and an honest note on which feature of the idea the activity can't reproduce so I have to supply it by mouth — I suspect its something about knowing versus merely thinking it likely, since any scoring scheme will turn it into a probability puzzle, but check me on that rather than agreeing.

  And push back plainly if this can't be done as an activity and would just be a lecture in costume.

  End with one last line, and nothing after it, in the form "Verdict: ..." giving in six words or fewer the single premise of the paradox the activity really puts to the test.
reasoning: |-
  Okay, the user wants me to design a philosophy session for an evening reading group with 14 adults, half of whom are new to philosophy. The main goal is to have them build the surprise exam paradox themselves without naming it upfront. They need to go through the induction step-by-step, ruling out days, and hit the contradiction themselves. The key mechanic is introducing an unreliable announcer to highlight the trust vs. surprise trade-off.

  First, I need to sketch a few candidate designs. Let me think about different approaches. One idea is using a "prize announcement" scenario where participants try to predict the announcement day. Another is framing it as a "surprise inspection" in a classroom setting. A third could be a "gift-giving" scenario. But which one would work best?

  The user emphasized that the unreliable announcer is crucial. So in each design, I need a phase where the announcer might renege. The prize announcement seems most straightforward. Maybe have participants vote on possible days, then show that if Friday is the only day left, it can't be a surprise. Then introduce the flaky announcer to disrupt certainty.

  Wait, the user mentioned that scoring systems might turn it into a probability puzzle. So I need to avoid points or rewards that emphasize probability. Using candy minimally could work—just as a token, not a scoring mechanism. The focus should be on certainty versus surprise.

  Potential pitfalls: Participants might not engage in the induction process naturally. They might jump to conclusions or get stuck. Also, the flaky announcer phase might confuse them instead of clarifying. Need recovery strategies: prompting questions, using index cards to guide reasoning, and stepping in to refocus if they stray.

  The core of the paradox is the assumption that the announcement must be surprising, leading to contradiction when all days are ruled out. The activity can't fully replicate the epistemic state of "knowing" versus "thinking it likely." So in debrief, I'll need to explain that gap, perhaps highlighting how the flaky announcer introduces doubt, making surprise possible again.

  Now, selecting the best design. The prize announcement with three phases seems solid. Phase 1: Reliable announcer, leading to contradiction. Phase 2: Unreliable announcer, restoring possibility. Phase 3: Discussion. Cutting the gift scenario because it adds unnecessary complexity. The inspection theme might feel too authoritarian, so prize is more neutral.

  Timeline: Start with intro (5 min), then Phase 1 groups discuss possible days (15 min), whole group rules out Friday (15 min), continue to Thursday (15 min). Phase 2 introduces flakiness, groups reassess (10 min). Debrief (15 min). Materials: index cards for days, whiteboard to track rulings, candy for participation.

  Debrief questions should guide them to see the induction steps and how unreliability breaks the contradiction. Common issues: Groups might not methodically eliminate days—provide structured prompts. If they don't see the contradiction, use the whiteboard to illustrate step-by-step. If flakiness causes confusion, clarify that the announcer's reliability is now in question.

  Verdict should be "Announcement reliability prevents true surprise." That captures the key premise tested by the activity.
answer: |-
  ### Candidate Designs Sketched
  1. **"Pop Quiz Inspection"**: Groups play students anticipating a principal's surprise quiz. Each day, they vote if quiz is possible/not-surprising. Principal (you) confirms/denies. *Cut*: Feels too authoritarian, risks disengagement from non-students.  
  2. **"Gift Day Lottery"**: Groups are event planners. A benefactor will surprise-deliver gifts one day next week. Planners bet candy on "safe" days. Flaky benefactor introduced mid-game. *Cut*: Candy betting overemphasizes probability, distracts from logical structure.  
  3. **"Prize Announcement" (Chosen)**: Groups are staff awaiting a CEO's surprise prize announcement. CEO (you) commits to announcing *one* day M-F that week. Staff deduce announcement days. Flaky CEO variant reveals trust/surprise trade-off naturally. *Why chosen*: Neutral roles, flakiness integrates as a rule change, avoids probability framing.  

  **Why the hunch works**: Flakiness *does* expose the crux—surprise requires doubt about the announcer’s reliability/capability. But it’s not a detour; it **shows why the argument fails in real life** (imperfect knowledge). The real crux is the induction’s dependence on perfect announcer infallibility.  

  ---
  ### Final Design: "The CEO's Surprise Prize"  
  **Core Mechanic**: Groups deduce possible announcement days. Flaky CEO rule change forces them to confront how announcer reliability affects surprise.  
  **Goal**: Groups build the induction ("If not M-Th, then F isn’t a surprise!"), hit contradiction, then flakiness "saves" Friday, exposing the paradox’s false premise.  

  #### Materials  
  - Whiteboard (draw 5 columns: Mon-Fri)  
  - 15 index cards (3 sets of 5 cards, each labeled "MON", "TUE", etc.)  
  - Bowl of candy (e.g., 20 mints)  
  - Timer  

  #### Rules (Printed/Read Aloud)  
  > 1. The CEO **will** announce a prize this week (Mon-Fri), exactly one day.  
  > 2. The announcement will be a **surprise**: You cannot *know* the night before that it’s coming tomorrow.  
  > 3. Groups must decide each morning: "Could the announcement be today?"  
  > 4. If all groups agree a day is impossible, it’s removed.  
  > 5. **Phase 1**: CEO is 100% reliable. **Phase 2**: CEO is flaky (may forget/change plans).  

  ---  
  ### Minute-by-Minute Timeline  
  **Total: 75 min**  

  - **0-5 min**: Intro  
    - *"We’re a company staff. Our CEO promised a surprise prize announcement one day this week. Your job: figure out when it can happen. Rules are binding."*  
    - Assign tables (3-4 people). Give each group 5 day cards.  

  - **5-20 min**: Phase 1 (Reliable CEO) – **Start Induction**  
    - *Task*: "It’s Sunday night. Discuss: Could Monday work? Why? Write ‘POSSIBLE’ or ‘IMPOSSIBLE’ on Monday’s card."  
    - *Expose*: Groups see Monday is possible (no prior day to "know"). Candy reward: 1 mint per group for participation.  
    - *Facilitate*: Whiteboard "Mon: POSSIBLE".  

  - **20-35 min**: **Build to Friday Contradiction**  
    - *Task*: "It’s Thursday night. Only Friday left. Could Friday be a surprise?" Groups debate, vote via cards.  
    - *Expose*: Groups realize: If not Mon-Thu, Friday *can’t* be a surprise (they’d know Thu night). They rule out Friday.  
    - *Facilitate*: Whiteboard "Fri: IMPOSSIBLE (if no announcement by Thu)".  

  - **35-50 min**: **Backward Collapse**  
    - *Task*: "If Friday’s out, revisit Thursday night. If nothing by Wed, could Thursday be a surprise?"  
    - *Expose*: Groups extend induction: Ruled-out Fri means Thu can’t be a surprise (know Wed night). Repeat for Wed, Tue, Mon.  
    - *Ambush*: Groups declare "No day works!" → Contradiction (CEO promised it!).  

  - **50-60 min**: Phase 2 (Flaky CEO) – **Break the Induction**  
    - *Rule Change*: "CEO is flaky: 25% chance they forget/delay. Does this change anything?"  
    - *Task*: Groups reassess Friday (and other days).  
    - *Expose*: Groups realize flakiness restores surprise ("We can’t be *sure* it’s Friday even if not earlier").  
    - *Facilitate*: Whiteboard "Flaky CEO → doubt → surprise possible". Candy: 1 mint per group for revising view.  

  - **60-75 min**: Debrief  
    - *Key Questions*:  
      1. *"What was your reasoning for ruling out Friday?"* (→ Induction step)  
      2. *"Why did that lead to a contradiction?"* (→ Self-defeating logic)  
      3. *"How did the flaky CEO ‘fix’ this?"* (→ Reliability as hidden premise)  
      4. *"In real life, can you ever be 100% sure of someone’s actions?"* (→ Links to paradox)  
    - *Reveal*: "This is the Surprise Exam Paradox. You just built it—and found its flaw."  

  ---  
  ### Predictable Problems & Mid-Session Fixes  
  1. **Problem**: Groups skip induction, randomly pick days.  
     - *Fix*: Freeze, refocus: "Start from Friday and work backward. If no announcement by Thursday...?"  
  2. **Problem**: Flakiness distracts ("So it’s about probability?").  
     - *Fix*: Redirect: "Not *when* it happens—*can you still be surprised* if Friday is the only day left?"  
  3. **Problem**: Groups stall in Phase 1 ("All days seem fine!").  
     - *Fix*: Force Friday: "Assume no announcement Mon-Thu. Can Friday surprise you? Why/why not?"  

  ---  
  **Honest Note**: The activity **can’t reproduce epistemic certainty**. Scoring (even candy) nudges groups toward probabilistic thinking ("25% chance CEO forgets") vs. logical "knowledge." You must orally emphasize: *The paradox requires you to **know** the announcement must happen—not suspect, but know. Flakiness breaks that knowledge.*  

  ---  
  Verdict: Reliability makes surprise impossible.
