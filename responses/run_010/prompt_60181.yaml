prompt: |-
  I'm a backend engineer at a mid-size e-commerce company and about six months ago I accidentally ended up owning our internal metrics platform — the thing everyone builds dashboards and experiment readouts on top of. Which means I'm now the person who has to referee arguments about numbers, and I have no stats background beyond one undergrad probability class I mostly slept through. The argument I keep having, maybe two or three times a month, is Simpson's-paradox-shaped: a PM posts a screenshot showing conversion up 4% overall, an analyst replies that it's actually *down* in every one of the four user segments we track, and the room splits into whoever trusts which screenshot. Last week it was a checkout redesign. Overall conversion up, down for mobile, down for desktop, down for tablet, down for in-app — apparently because a marketing campaign sent us a big wave of high-intent users who happened to skew mobile, so the mix shifted under us. Our data scientist said something like "the reversal is a fact about the weighting, not about the world," which sounded deep and didn't help me decide anything, and I ended up punting to a VP, which I hated. Anything that moves a launch or a pricing decision needs sign-off from me, the PM, and the analytics lead, so I can't just shrug — I have to write down *why* we're believing one number and not the other.

  So: can you write me a procedure I can actually run on these? Something a competent engineer on rotation can do in about half an hour with SQL and a spreadsheet, not a stats PhD, ideally as a numbered list of questions in order, with what counts as a sufficient answer to each one, the points where the procedure stops at a definite no-go, and the points where it hands the thing to a human because the question turned out to be about what we're trying to decide rather than about the data. Be blunt about which steps are really just me making a judgment call with extra paperwork attached. I need it to cover: how you even know to start looking for a reversal, since you can't disaggregate by everything and there are thousands of plausible cuts; what to do when the reversal shows up in a cut nobody specified before looking at the data; how to decide whether the aggregate or the disaggregate is the number that should drive the decision, since I suspect that depends on what the decision is and not on any arithmetic; and what happens when the variable that explains the reversal is itself changed by the thing you're evaluating — I have a feeling that's the case that breaks everything, and I want it handled explicitly rather than footnoted.

  Then run it end to end on three cases so I can see it work and where it bites: the checkout redesign above; an A/B test where the treatment wins overall but loses inside every cohort defined by *whether users ever hit a certain feature* (a teammate insists this is just Simpson's paradox again and we should report the disaggregate, and I think he's wrong but I can't say why); and a support dashboard where average handle time dropped overall but rose in every agent skill tier. For each one I want the answer the procedure actually produces, plus what I'd have to tell the person who's going to be annoyed by it. And finish with a short list of what this procedure flat out cannot do — the failure modes where it'll hand me a confident wrong number, so I know when to stop trusting it.
reasoning: |-
  We are designing a procedure to handle situations where aggregate and disaggregate metrics tell conflicting stories (Simpson's paradox and similar). The goal is to have a step-by-step guide that a competent engineer can run in about half an hour using SQL and a spreadsheet.

  The procedure will be structured as a numbered list of questions. We will cover:
  1. How to know when to look for a reversal (without disaggregating everything).
  2. What to do when the reversal shows up in a post-hoc cut (i.e., a cut not specified before looking at the data).
  3. How to decide whether the aggregate or disaggregate metric should drive the decision (acknowledging that this depends on the decision context).
  4. Handling the case where the variable that explains the reversal is itself affected by the intervention (which breaks the usual assumptions).

  We'll then run the procedure on three cases:
  - Case 1: Checkout redesign (overall conversion up, down in every user segment due to a shift in user mix).
  - Case 2: An A/B test where the treatment wins overall but loses in every cohort defined by user interaction with a feature.
  - Case 3: A support dashboard where average handle time dropped overall but rose in every agent skill tier.

  Finally, we'll list the failure modes of the procedure.

  Procedure: Resolving Metric Conflicts

  Step 0: Preconditions
  - You are comparing two groups (e.g., before vs. after, control vs. treatment) on a key metric (e.g., conversion rate, average handle time).
  - You have an aggregate metric that shows a certain direction (e.g., up) but you suspect or have been told that when you break it down by one or more segments, the direction reverses in each segment.

  Step 1: Identify the Segments of Interest
  - Question: What segments are being claimed to show a reversal? Are these segments pre-defined and meaningful for the business?
  - Action: List the segments that were used in the disaggregate analysis. If the segments were not pre-defined (i.e., they were chosen after seeing the data), note that and proceed with caution (see Step 2).
  - Sufficient answer: The segments are either:
     a) Pre-defined (e.g., in a data dictionary, or in the experiment plan) and have a clear business meaning (e.g., device type, user tier, region), OR
     b) Post-hoc but with a strong rationale (e.g., "we thought about this segment because of a known campaign").
  - If the segments are post-hoc and without a strong rationale, stop and flag: "This is a data dredging artifact. Do not trust the reversal without further validation." Then, hand over to a data scientist for more rigorous testing (e.g., multiple testing correction). Otherwise, proceed to Step 2.

  Step 2: Verify the Disaggregate Reversal
  - Question: Is the reversal real? That is, when we break down by the segments, is the metric direction consistently reversed in every segment? And are the segment-level results statistically significant and meaningful?
  - Action: Using SQL, compute the metric for each segment in both groups (e.g., control and treatment, or before and after). Also compute the sample size and a confidence interval for the difference in each segment (if feasible in the time; otherwise, at least note the sample sizes and the point estimates).
  - Sufficient answer: 
     - The reversal must be consistent (e.g., the metric is worse in every segment) and the segment-level sample sizes must be large enough to trust the direction (e.g., relative standard error < 20% or a quick rule of thumb: segment has at least 100 events). 
     - If the reversal is not consistent (e.g., some segments show improvement, some show decline) then the overall effect might be a weighted average and the reversal claim is false. Stop: the aggregate is the correct summary.
     - If the reversal is consistent but the segments have very small sample sizes, the reversal might be due to noise. Stop: the aggregate is more reliable.
     - If the reversal is consistent and the segments are of reasonable size, proceed to Step 3.

  Step 3: Check for Changes in Segment Mix
  - Question: Did the proportion of users (or events) in each segment change between the two groups?
  - Action: Compute the proportion of total users (or events) in each segment for both groups (e.g., control and treatment, or before and after). If the proportions are similar (e.g., within 1-2 percentage points for each segment), then the reversal is not due to a shift in mix. Otherwise, note the shift.
  - Sufficient answer: 
     - If the segment mix did not change, then the reversal is not explained by Simpson's paradox. This might indicate a problem in the aggregation (e.g., missing data) or an actual reversal that needs explanation. Proceed to Step 4.
     - If the segment mix did change, then we are in a Simpson's paradox scenario. Proceed to Step 4.

  Step 4: Is the Segment a Confounder?
  - Question: Is the segment a pre-existing characteristic (i.e., not affected by the intervention) or could it be affected by the intervention?
  - Action: Think about the segment definition and the intervention. For example:
     - Pre-existing: device type (if the intervention doesn't change the device), user tenure (if the intervention doesn't change the time the user has been with the company), etc.
     - Potentially affected: if the segment is "used feature X" and the intervention might affect whether the user uses feature X, then it's affected.
  - Sufficient answer:
     - If the segment is pre-existing and the mix changed (Step 3), then we have a classic Simpson's paradox. Proceed to Step 5.
     - If the segment is affected by the intervention, then we are in a "mediator" scenario (the intervention changes the segment, which then affects the outcome). This is complex and the procedure cannot resolve it. Stop and hand over to a data scientist for causal mediation analysis. The procedure cannot handle this with confidence.

  Step 5: Decide Which Metric to Use Based on the Business Question
  - Question: What is the business decision we are trying to make?
  - Action: Consider the decision context. The key is: are we making a decision that applies uniformly to all segments (so we care about the aggregate) or are we making a decision that might be tailored by segment?
  - Sufficient answer:
     - If the decision is about a global change (e.g., rolling out a new checkout design to everyone) then the aggregate effect is the right one to use because it accounts for the current mix of users. Even if the effect is negative in every segment, the shift in mix might be a one-time event (like a marketing campaign) and we care about the overall impact on the business.
     - If the decision is about a segment-specific change (e.g., we are considering rolling out the change only to mobile users) then we should use the segment-level effect for that segment.
     - If the decision is about understanding the true effect of the intervention (independent of shifts in the population) then we might want to adjust for the segment. This is where standardization (or inverse probability weighting) comes in. But note: this requires more time and statistical expertise. In the 30-minute limit, we can do a simple standardization: 
          - Choose a standard population (e.g., the control group or the overall population from a neutral period) and compute the weighted average of the segment effects using the standard population's segment proportions.
          - Example: If we have two segments, A and B, and the control group had 60% A and 40% B, then the adjusted effect is: (effect in A * 0.6) + (effect in B * 0.4).
     - However, note: the above adjustment is only valid if the segment is a confounder (pre-existing and affecting the outcome) and we are in the Simpson's paradox scenario.

  Step 6: Make a Call and Document
  - Based on the above steps, decide which number to use (aggregate, segment-specific, or adjusted) and document:
     a) The aggregate and disaggregate numbers.
     b) The change in segment mix (if any).
     c) Whether the segment is pre-existing or affected.
     d) The business context and why we chose the number we did.
     e) Any caveats (e.g., if we are using the aggregate despite segment reversals because of a one-time mix shift, note that if the mix shifts back, the aggregate effect might change).

  Now, we run the procedure on the three cases.

  Case 1: Checkout Redesign
  - Overall conversion up, down in every segment (mobile, desktop, tablet, in-app). The shift is due to a marketing campaign that brought in high-intent mobile users.

  Step 1: The segments (device types) are pre-defined and meaningful. Proceed.
  Step 2: The reversal is consistent (down in every segment) and we assume sample sizes are large. Proceed.
  Step 3: The segment mix changed (more mobile users). Proceed.
  Step 4: The segment (device) is pre-existing (the redesign doesn't change the device). This is Simpson's paradox. Proceed.
  Step 5: The business decision: rolling out the checkout redesign globally. We care about the overall impact. Therefore, we use the aggregate number (up 4%) because it reflects what happened in the period (including the marketing campaign). However, note that if the marketing campaign is a one-time event, then the long-term effect might be different. But for the decision to launch, we go with the aggregate.

  Documentation: 
     We observe that conversion increased by 4% overall. Although conversion decreased in every device segment, this was due to a shift in user mix (more mobile users, who have lower conversion in general but were sent by a marketing campaign). Since the decision is about a global rollout and we want the effect as it occurred in the real world (with the campaign), we use the aggregate number. However, we note that without the campaign, the effect might be negative. We recommend monitoring and possibly re-evaluating without the campaign traffic.

  Case 2: A/B Test - Treatment wins overall but loses in every cohort defined by whether users ever hit a certain feature.

  Background: The feature is, say, a help tool. The cohorts are: "used the help tool" and "did not use the help tool". The treatment might affect whether the user uses the help tool.

  Step 1: The segment (used the help tool) is a user behavior during the session. It might be post-hoc. We need to check: was this segment pre-defined? Probably not. But let's assume the PM had a hypothesis about the help tool. If not, we might flag data dredging. For the sake of this case, let's assume it was pre-defined because the team was interested in how the treatment interacts with the help tool. Proceed.

  Step 2: The reversal is consistent: the treatment loses in both the "used help" and "did not use help" segments. Proceed.

  Step 3: Check the segment mix: did the treatment change the proportion of users who used the help tool? We must check. Let's say the treatment group had 50% of users using the help tool, while the control had only 30%. So the mix changed.

  Step 4: The segment (used the help tool) is a behavior that occurs during the session and might be affected by the treatment. Therefore, we are in the mediator scenario. We cannot proceed with simple adjustments. Stop and hand over to a data scientist.

  Why? Because the treatment might cause more people to use the help tool, and the help tool might be used by users who are struggling (so they have lower conversion). Thus, the treatment increases the proportion of users in the segment that has lower conversion, which might cause an overall positive effect (if the treatment also has a positive effect on conversion) but negative in each segment? Actually, the overall effect is positive, but in each segment it's negative? This is tricky.

  But note: the problem states the treatment wins overall but loses in every cohort. So the overall effect is positive, but within both cohorts the treatment is negative. And the treatment changes the cohort mix (more users in the "used help" cohort, which has lower conversion in both groups). This is a classic example of a mediator.

  The procedure stops at Step 4 and says: hand over to a data scientist for causal mediation analysis.

  What to tell the annoyed person: 
     "We cannot simply use the disaggregate numbers because the feature usage might be caused by the treatment. This makes the segment a mediator, and the disaggregate numbers are not the true effect of the treatment. We need more advanced methods to understand the direct and indirect effects. Until then, we rely on the overall effect for the launch decision, but we note that the treatment might have unintended consequences on feature usage and that requires further investigation."

  Alternatively, if the business decision is whether to roll out the treatment, the overall effect is positive so we might roll it out, but with caution because of the segment-level reversals.

  Case 3: Support Dashboard - Average handle time (AHT) dropped overall but rose in every agent skill tier.

  Step 1: The segments (agent skill tier) are pre-defined and meaningful. Proceed.

  Step 2: The reversal is consistent: AHT increased in every tier. Proceed.

  Step 3: Check the segment mix: did the proportion of tickets handled by each tier change? For example, if more tickets were handled by higher-skilled agents (who normally have lower AHT) then the overall AHT might drop even if each tier's AHT increased. We find that the mix changed: say, higher-skilled agents handled a larger share of tickets.

  Step 4: The segment (agent skill tier) is pre-existing (the intervention, which is whatever change was made that we are evaluating, doesn't change an agent's skill tier). But note: the intervention might change which agents handle which tickets? For example, a new routing system. So the mix change might be due to the intervention.

  But the segment itself (the agent's tier) is pre-existing. The fact that the routing changed the mix is part of the intervention. This is still a confounder because the agent's tier is a characteristic that exists prior to the ticket being handled.

  Step 5: The business decision: we are evaluating a change (say, a new routing system) that might have affected how tickets are assigned. We want to know if the new system is better. The overall AHT dropped, but in every tier it increased. However, the drop is due to more tickets being handled by higher-skilled agents. The question: is the new routing system better? We have two aspects:
     a) The system changed the mix of tickets to higher-skilled agents, which is good because they are faster? But wait, in this case, even the higher-skilled agents got slower? 
     b) However, the overall AHT dropped, so from a business perspective, we saved time.

  But note: if the increase in AHT per tier is due to the new system (e.g., it assigns more complex tickets to higher-skilled agents, which increases their AHT) then the overall drop might be a trade-off.

  However, the procedure in Step 5 says: for a global change, we care about the aggregate. So if we are deciding to keep the new routing system, we use the aggregate (AHT dropped). But we must also consider if the per-tier increase is a problem (e.g., agent burnout). 

  Alternatively, we might standardize: compute what the overall AHT would have been under the old mix. For example, use the old mix of tickets per tier and apply the new tier-specific AHTs. Then compare that to the old overall AHT? 

  But note: the business might care about the actual time spent (aggregate) because that's what affects customer wait times and staffing costs.

  So the call: use the aggregate. But document that the per-tier increases might be a concern and require investigation.

  What to tell the annoyed person (who might be the support manager worried about agent performance):
     "The new system reduced overall handle time by 5%. Although handle time increased within each skill tier, the system routed more tickets to the higher-skilled agents, which led to the overall reduction. For the purpose of reducing overall handle time, the system is successful. However, we should investigate why each tier's handle time increased to ensure there are no negative side effects."

  Failure Modes of the Procedure:

  1. **Mediators and Post-Intervention Segments**: The procedure stops when the segment is affected by the intervention (Step 4). This is a failure to give an answer, but it's by design. The procedure avoids giving a wrong answer in complex causal scenarios.

  2. **Data Dredging**: If the reversal is found by trying many segments, the procedure might not catch it if the user lies about pre-definition (Step 1). We rely on honesty and documentation.

  3. **Small Sample Sizes**: The procedure might miss that a segment is too small to be trusted (Step 2) if the engineer doesn't check sample sizes properly.

  4. **Confounding by Unobserved Variables**: The procedure only adjusts for the segments provided. If there are other confounders, the adjusted effect (in Step 5) might still be biased.

  5. **Dynamic Effects**: The procedure assumes that the segment mix and segment effects are stable. If they change over time (e.g., the marketing campaign effect fades) then the aggregate effect might not be representative of the future.

  6. **Standardization Pitfalls**: The simple standardization in Step 5 (using a standard population) assumes that the segment effects are constant and that there are no interactions. This might not hold.

  7. **Not Covering All Decision Contexts**: The decision in Step 5 is a judgment call. The procedure doesn't replace domain knowledge.

  Despite these, the procedure provides a structured way to handle common scenarios and documents the reasoning.
answer: |-
  Below is a step-by-step procedure designed for engineers to resolve Simpson's paradox-style metric conflicts in ~30 minutes using SQL/spreadsheets. It prioritizes **actionable decisions**, **auditability**, and explicit **failure handling**. Key principles:
  - **Aggregate vs. disaggregate depends on the business decision**, not math.
  - **Pre-defined segments > post-hoc segments**.
  - **Confounding variables** (affected by the intervention) break the analysis.

  ---

  ### Procedure: Resolving Metric Conflicts  
  *Time: ~30 min | Tools: SQL + Spreadsheet*  

  #### **Step 0: Trigger This Procedure When**  
  - An aggregate metric (e.g., overall conversion) and its segment breakdown (e.g., by device) show **opposite directional trends** (+ vs. -).  
  - **OR** stakeholders dispute which metric to trust.  
  ▶ *Output: A decision memo for sign-offs.*

  ---

  #### **Step 1: Verify the Reversal (5 min)**  
  **Question:** *Is the reversal mathematically real?*  
  - **Action:**  
    - Run SQL to calculate:  
      ```sql  
      SELECT 
        segment, 
        metric_after - metric_before AS segment_delta,  -- e.g., conversion_diff
        COUNT(*) AS sample_size 
      FROM data 
      GROUP BY segment;  
      ```  
    - Calculate overall delta: `SUM(metric_after * users) / total_users - SUM(metric_before * users) / total_users`.  
  - **Sufficient Answer:**  
    - ✅ **Proceed if:** All segments show opposite direction to aggregate AND samples > 100 per segment.  
    - ❌ **Stop if:**  
      - Segments agree with aggregate → Report aggregate.  
      - Small samples (<100) → Aggregate wins (noise).  
  ▶ *Blunt truth: This is arithmetic, not judgment.*

  ---

  #### **Step 2: Audit Segment Legitimacy (5 min)**  
  **Question:** *Are these segments pre-defined or cherry-picked?*  
  - **Action:**  
    - Check if segments are in your **data dictionary** (e.g., "device_type") or were defined **after** seeing data.  
  - **Sufficient Answer:**  
    - ✅ **Pre-defined:** Proceed to Step 3.  
    - ❌ **Post-hoc:** Flag as "suspected data dredging." Use aggregate unless:  
      - Stakeholders pre-registered this segment (email/Slack timestamp).  
      - Business context explains why it matters (e.g., "mobile users are 80% of revenue").  
  ▶ *Blunt truth: This is a judgment call. Default to aggregate for post-hoc segments.*

  ---

  #### **Step 3: Check Segment Mix Shift (5 min)**  
  **Question:** *Did the proportion of segments change?*  
  - **Action:**  
    - SQL:  
      ```sql  
      SELECT 
        segment, 
        SUM(CASE WHEN group = 'before' THEN 1 ELSE 0 END) * 1.0 / before_total AS before_share,  
        SUM(CASE WHEN group = 'after'  THEN 1 ELSE 0 END) * 1.0 / after_total AS after_share  
      FROM data  
      GROUP BY segment;  
      ```  
    - In spreadsheet: Calculate absolute change in shares (e.g., `after_share - before_share`).  
  - **Sufficient Answer:**  
    - ✅ **Mix shift:** Proceed to Step 4.  
    - ❌ **No mix shift:** Contradiction → Hand to data scientist (likely data error).  

  ---

  #### **Step 4: Is the Segment a Confounder? (5 min)**  
  **Question:** *Could the intervention affect the segment itself?*  
  - **Action:** Apply the **"causal order" test**:  
    > "Did the segment exist **before** the intervention started?"  
    - **Yes (confounder)**: e.g., device type (user arrives with it).  
    - **No (mediator)**: e.g., "clicked help button" (intervention may cause clicks).  
  - **Sufficient Answer:**  
    - ✅ **Confounder (e.g., device):** Proceed to Step 5.  
    - ❌ **Mediator (e.g., feature usage):** Stop → Aggregate wins.  
      - *Why?* The segment is **downstream** of the intervention (e.g., the redesign causes users to click help). Mediators require causal inference (beyond 30 min).  
  ▶ *Blunt truth: This is critical. Mediators break standard fixes.*

  ---

  #### **Step 5: Decision Driver (10 min)**  
  **Question:** *What’s the business decision?*  
  - **Action:** Match the metric to the decision context:  
    | **Decision Type**          | **Use Metric**       | **Why**                                  |  
    |----------------------------|----------------------|------------------------------------------|  
    | Global change (e.g., "launch to everyone?") | **Aggregate**        | Accounts for real-world mix shifts.      |  
    | Segment-specific change (e.g., "launch only to mobile?") | **Segment delta** | Isolates impact on the target group. |  
    | Understanding true effect (e.g., "did this *cause* improvement?") | **Adjusted aggregate** | Controls for confounders. |  
  - **Adjusted Aggregate Calculation (simple version):**  
    - Fix segment shares to a baseline (e.g., pre-period shares).  
    - Spreadsheet: `adjusted_delta = SUM(segment_delta * baseline_share)`.  
  - **Sufficient Answer:**  
    - Document: "Decision: [Launch/Pricing]. Use [metric] because [context]."  

  ---

  #### **Step 6: Document & Socialize**  
  - **Memo template:**  
    ```  
    1. Reversal verified: [Yes/No]  
    2. Segments: [Pre-defined/Post-hoc]  
    3. Mix shift: [Yes/No]  
    4. Segment type: [Confounder/Mediator]  
    5. Decision context: [Global/Segment/True effect]  
    6. Metric used: [Aggregate/Segment/Adjusted]  
    7. Caveats: [e.g., "Mediator detected → aggregate used"]  
    ```  

  ---

  ### Case Studies  
  #### **Case 1: Checkout Redesign**  
  - **Scenario:** Overall conversion ↑4%, but ↓ in every device segment (mobile/desktop/tablet/in-app).  
  - **Procedure Output:**  
    - Step 1: Reversal real.  
    - Step 2: Device segments pre-defined.  
    - Step 3: Mix shift (marketing drove mobile ↑).  
    - Step 4: Device is a confounder (pre-intervention).  
    - Step 5: **Use aggregate** (global launch decision).  
  - **Annoyed PM Comms:**  
    > "We’re using the +4% aggregate because it accounts for the real user mix (including marketing traffic). The segment drops show mobile users convert lower, but they’re now a larger part of our business. If mix reverts, we re-evaluate."  

  #### **Case 2: A/B Test w/ Feature Usage Cohorts**  
  - **Scenario:** Treatment wins overall, but loses in every cohort (e.g., "used feature X" vs. "didn’t use").  
  - **Procedure Output:**  
    - Step 1: Reversal real.  
    - Step 2: "Used feature X" is post-hoc (unless pre-registered).  
    - Step 3: Mix shift likely (treatment may alter feature usage).  
    - Step 4: **Mediator** (treatment → affects if users hit feature).  
    - Stop → **Use aggregate** for launch decision.  
  - **Annoyed Teammate Comms:**  
    > "We can’t use the cohort breakdown because the treatment likely changes *whether* users hit the feature. This distorts segment deltas. Aggregate effect is reliable for a global launch."  

  #### **Case 3: Support Handle Time (AHT)**  
  - **Scenario:** Overall AHT ↓, but ↑ in every agent skill tier.  
  - **Procedure Output:**  
    - Step 1: Reversal real.  
    - Step 2: Skill tiers pre-defined.  
    - Step 3: Mix shift (e.g., more tickets routed to high-skilled agents).  
    - Step 4: **Confounder** (skill tier exists pre-intervention).  
    - Step 5: **Use adjusted aggregate** (fix shares to baseline) to isolate true effect.  
  - **Annoyed Support Lead Comms:**  
    > "The raw aggregate includes routing changes. Adjusted AHT (using baseline shares) is +1.2% — likely due to other factors like new ticket types. Investigate tier-level increases."  

  ---

  ### Failure Modes: When This Procedure **Cannot** Be Trusted  
  1. **Mediators with Strong Interactions**  
     - Example: Treatment only works if users click a button, and treatment affects click rates.  
     - **Result:** Procedure defaults to aggregate (may hide harms/benefits).  
  2. **Unobserved Confounders**  
     - Example: A hidden variable (e.g., "user urgency") drives both segment shift and outcome.  
     - **Result:** Adjusted aggregate may be biased.  
  3. **Time-Varying Segments**  
     - Example: User loyalty tier changes mid-experiment due to intervention.  
     - **Result:** Confounder/mediator test fails.  
  4. **Small Samples in Critical Segments**  
     - Example: 95% of users in one segment, 5% split across others.  
     - **Result:** Procedure misses noise-driven reversals.  

  **Red Flags to Escalate:**  
  - Mediators (Step 4) → Hand to data scientist for causal mediation.  
  - Suspected unobserved confounders → Run RCT or quasi-experimental methods.  
  - High-stakes decisions with reversal → Always compute adjusted aggregate as sensitivity check.  

  ---

  ### Final Notes  
  - **Why it works:** Forces explicit tradeoffs between real-world impact (aggregate) vs. causal insight (adjusted/disaggregate).  
  - **Engineer superpower:** You’re not deciding the "truth" — you’re mapping math to business logic.  
  - **When in doubt:** Escalate mediators, document assumptions, and use the aggregate for launch decisions (it reflects what actually happened).  

  This gives you a defensible, auditable process — not a stats PhD.
