  First, I need to recall related concepts. Self-refutation comes to mind, but that's when a statement implies its own falsehood, which isn't always the case here. Revenge problems are more about new counterexamples after a solution is proposed, like with the Liar Paradox. Diagonalization is the technique used to construct the counterexample, but it's not the phenomenon itself. Indefinite extensibility involves concepts that can always be extended beyond any defined set, which might be similar but not exactly the same.

  The user mentioned examples like verificationism and Popper's falsifiability. In each case, the principle is used to create a counterexample that wasn't previously considered. The key is that the problematic instance is generated by the principle, making it "novel" in a specific way. The debate then centers on whether excluding such instances is legitimate.

  Boundary cases: The unexpected exam paradox—here, the announcement leads to a contradiction when students reason about it. It's similar because the reasoning process invalidates the announcement, but the counterexample isn't constructed using the principle in the same way. Self-referential principles that only fail for themselves, like "no statement is true," are a different category. If the problematic instance was always available but unnoticed, that’s different because it doesn’t rely on the principle for construction.

  Is there an existing term? "Revenge problem" is close, but typically involves new counterexamples post-solution. The user's advisor might suggest that, but revenge problems usually arise after a fix is proposed, whereas here the counterexample emerges directly from the principle. "Diagonal argument aftermath" or "novel-instance paradox" could be coined terms. The core is the generation of a new instance via the principle, leading to a meta-debate about restrictions.

  The user might be conflating epistemic availability with logical possibility. The defender argues that since the counterexample couldn't exist without the principle, excluding it isn't ad hoc. However, critics see this as avoiding the problem. The deeper issue is whether principles can be self-applicable without contradiction.

  The best candidate term might be "novel-instance problem" or "generated counterexample dilemma." Defining it as cases where the counterexample is constructed using the principle's own resources, making it unavoidable unless restricted, and the subsequent dispute over the restriction's legitimacy.
answer: |-
  ### (1) Bottom Line
  No established term perfectly captures *the entire phenomenon* you describe. The closest existing label is **"revenge problem"**, but this typically focuses on *post-resolution counterexamples* rather than the *initial generation dynamic* and its dialectical aftermath. Your phenomenon is better characterized as a **"novel-instance paradox"** or **"generated counterexample dilemma"**, emphasizing that the refuting instance is constructed *using the principle itself*, rendering it "novel" relative to the pre-principle context. The core disagreement then shifts to whether walling off this novel class is *substantively motivated* or merely *ad hoc damage control*.

  ### (2) Nearest Neighbours (400 words)
  *   **Revenge Problems:** Refers to new counterexamples that arise *after* a proposed solution to a paradox (e.g., strengthened Liar sentences after a truth-value gap solution). Your phenomenon falls outside this because: (i) Your counterexample is the *initial* refutation, not a response to a prior solution; (ii) Revenge problems often involve *iterated* challenges (e.g., "This sentence is not true*" where * is a new semantic status introduced to solve the Liar), whereas your case is typically a *single* diagonalization step using existing resources; (iii) The dialectic in revenge focuses on whether the solution is *complete*, while yours centers on whether the *original restriction* is principled given the instance's origin.
  *   **Self-Refutation:** Applies when asserting a principle *entails* its own falsehood (e.g., "All statements are false"). Your phenomenon differs because: (i) The principle (e.g., Verificationism) isn't *itself* the problematic instance; (ii) The refutation relies on constructing a *distinct* instance *using* the principle (e.g., the unknown truth conjunction), not directly demonstrating the principle's self-contradiction; (iii) Self-refutation usually demands immediate rejection, while your phenomenon allows for principled restriction.
  *   **Diagonalization:** This is the *technique* used to construct the counterexample (leveraging self-reference or Gödelian coding). It names the *method*, not the *dialectical situation*. Your phenomenon *uses* diagonalization but describes the *consequence*: the generated instance's novelty and the ensuing debate about restriction legitimacy.
  *   **Indefinite Extensibility (Dummett):** Describes concepts (like "set" or "truth") where any definite characterization provokes an instance beyond its scope. Your phenomenon is a specific *manifestation* of this: the principle attempts a definite characterization (all truths are knowable), and diagonalization generates an instance escaping it. However, indefinite extensibility is a broader metaphysical/logical thesis, while your focus is the *argumentative structure* and *dialectical response* (restriction debate) triggered by such an instance.
  *   **Impredicativity:** Concerns definitions that presuppose the totality they aim to define (e.g., defining "the least upper bound" using the set of all upper bounds). Your diagonal constructions are impredicative (defining a sentence by quantifying over all knowable truths/knowers). But impredicativity is a *logical property* of the definition, while your interest is the *dialectical outcome* – the principle seeming true until the impredicative instance is built, and the dispute over banning it.

  ### (3) Boundary Cases (250 words)
  *   **Unexpected Exam:** This *does* belong, fitting the shape remarkably well. The "principle" is the teacher's announcement (all exams next week are unexpected). The student constructs a *novel reasoning chain* using this announcement to "prove" no exam can be unexpected on Friday, then Thursday, etc. Crucially, this reasoning *relies on the announcement itself* to generate the contradiction (it "destroys the conditions" only *because* of the reasoning it enables). The defender (teacher) might restrict: "The announcement isn't a *predictive rule* for student deduction" (a principled meta-distinction) vs. the critic seeing this as ad hoc protection. The *dialectical structure* matches: the announcement seems coherent until subjected to the reasoning it enables.
  *   **Merely Self-Referential Failure (e.g., "No generalizations are true"):** This is a *different* case. It fails *only* for itself and is *immediately* self-refuting upon utterance. No *novel instance* is constructed *using* the principle; the principle *is* the counterexample. The debate isn't about principled restriction but about whether self-refutation is fatal or can be handled (e.g., as performative inconsistency). Here, "antecedently available" instances *are* problematic if the principle applies to them.
  *   **Unnoticed Antecedent Instance:** If a problematic instance existed all along but was unnoticed (e.g., an undiscovered Liar sentence in an ancient text), this *lacks* the defining feature. The counterexample wasn't *generated by* or *dependent on* the principle itself; it was merely *discovered*. The dialectic wouldn't focus on whether excluding *this specific type* is principled based on its origin.

  ### (4) The Name: "Novel-Instance Problem" (NIP)
  *   **Definition:** A dialectical situation arising when a proposed general principle (P) is refuted by an instance (I) constructed *using the resources or presuppositions of P itself*, where I was not part of the "antecedent domain" motivating P's proposal. Consequently, P appears true of all pre-refutation examples, and the core dispute shifts to whether modifying P (e.g., by restricting its scope to exclude instances like I) constitutes a *principled response* (justified by I's parasitic dependence on P) or an *ad hoc maneuver* (merely avoiding refutation).
  *   **Necessary/Sufficient Conditions:**
      *   NEC: Refutation relies on an instance I constructed *using* P.
      *   NEC: P plausibly holds for all instances considered *before* I's construction.
      *   NEC: The primary debate post-refutation concerns the legitimacy/adhocness of restricting P to exclude I-like instances.
      *   SUFF: The above conditions hold, and the construction of I involves diagonalization or impredicativity relative to P.
  *   **Excludes:** Standard revenge problems (post-solution), pure self-refutation (P falsifies itself directly), discovery of pre-existing counterexamples, cases where restriction debate is peripheral.

  ### (5) Where Misdescription Might Lie (100 words)
  Your worry is astute. "True of everything available beforehand" is an *epistemic/pragmatic* characterization, not a semantic/logical one. The defender often *conflates* these: they argue that since I *could only arise* via P, restricting P isn't ad hoc *because I isn't part of the "natural" domain P was meant for*. The critic counters that logical principles must hold *absolutely*, and "availability" is irrelevant – P’s falsity is exposed by I's mere *possibility*. The deeper tension is whether principles governing truth/knowability must be *self-applicable* or can be coherently *stratified*. Your description captures the *dialectical reality*, even if its logical grounding is contested.
