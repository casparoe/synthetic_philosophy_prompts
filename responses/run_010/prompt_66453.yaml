answer: |-
  *(Leans back in his chair, spectacles perched low on his nose. The gaslight flickers on the piled reports. He sighs, a sound of genuine intellectual fatigue, not defeat.)*

  Your report from the future… it is sobering. I concede the force of it. A pattern of diminishing returns across vast numbers, under stricter controls – yes, it suggests that the specific phenomena we sought through card-guessing and dice-throwing, phenomena easily quantified by your machines, may indeed be phantoms born of small numbers or hope. And the Theosophical business… *that* council report. We were too eager for a definitive blow against palpable fraud, perhaps. A trusted colleague presented seemingly damning evidence; we rushed to condemn Madame Blavatsky. If your expert’s analysis holds true, it shames our procedure. We demanded scrupulous proof from others; we failed to provide it ourselves in that instance. A painful lesson, if true – zealotry in pursuit of truth is still zealotry.

  But does it convert agnosticism to denial? Not quite. The card-guesses, the dice – they test a *mechanism*: direct mental influence on matter, or precognition of trivial, random events. Perhaps the supernormal, if it exists, operates differently. Not as a force bending dice in a laboratory, but as something subtler, rarer, tied to crisis, death, or states of consciousness we cannot yet reliably induce or measure. The ‘dying brain’ hypothesis we entertain – might it not produce effects undetectable by your counting machines? The ledger isn’t balanced yet, for we haven’t truly accounted for *all* the phenomena reported – the phantasms of the living, the coherent death-bed visions witnessed independently. They defy easy quantification, yes, which frustrates our desire for the neat proof of the physical sciences, but their persistent recurrence demands explanation beyond coincidence or fraud. Failure to find *one kind* of proof is not proof of universal absence. It compels a refinement of the search, not its abandonment. Perhaps the phenomena recede from the very methods designed to cage them. A vexing thought.

  *(Stares into the middle distance, fingers steepled. His voice grows quieter, more introspective.)*

  As for the Ethics… you press the wound. The dualism of practical reason *is* the torment. I cannot demonstrate that universal happiness aligns with perfect virtue in this life; my hope for a moral cosmos hinges on some continuity, some higher order where that harmony is secured. Does your century’s ‘null result’ *slam* that empirical door? It narrows it, certainly. It makes the prospect bleaker. But it does not *disprove* the possibility of survival or a moral order beyond our current senses; it only shows the failure (thus far) to capture it within our current experimental nets. To withdraw the Ethics? On what grounds? The *need* for that harmony, the sheer undeniability of the moral demand within us, remains the fixed point. It is not derived *from* psychical research; the research was a possible path *towards* reconciling that demand with a seemingly indifferent universe. Its difficulty, its persistent ambiguity, deepens the mystery – it does not relieve me of the duty to seek, nor of the validity of the moral intuition itself. The third option? It is the one I live with. Continue the search, chastened by failure, refining methods, acknowledging the profound darkness – while refusing to let that darkness extinguish the inner moral light, or the rational *hope* that they may, ultimately, share a common source. We may never *prove* the house is there, but the absence of a knock at the door we’ve been watching doesn’t prove it’s empty. It only means we must consider if we’re listening at the wrong door, or if the occupant chooses silence. The obligation to listen remains.
