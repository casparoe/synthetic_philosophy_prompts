prompt: |-
  I clerk for a state wage-and-hour board and I'm trying to call how we'll rule next month. Track record so far: an overnight hospital nurse who had to stay on site but could sleep between calls — working time, paid. On-call from home with no obligation to answer — not working time. On-call from home but required to be on site within 15 minutes of a call — working time. A live-in building guard — we split it, only the hours he was actually responding to something counted. A mandatory Saturday safety course — working time. An employee who answers work email at 11pm on her own initiative, nobody asked her to — not working time, over two dissents arguing we're smuggling in the idea that work has to look like work. Our statutes language is "any period in which the worker is not free to dispose of her own time," which half the board reads literally and half reads as a stand-in for employer control.

  New case: a firefighter who sleeps at the station, draws a small overnight stipend, has to be rolling within 90 seconds, and actually gets dispatched maybe three nights a month. Predict the ruling and say what principle we'd be committing to either way; tell me which precedent is the closest analog and doing the real work, and whether there's a third rule — something about how intense the response requirement is — that fits the record better than both the control reading and the freedom reading. Then give me one hypothetical case I could put in front of the board that would settle which rule we're actually running. American English, please.
reasoning: |-
  Alright, let's tackle this step by step. The user is a clerk for a state wage-and-hour board trying to predict how they'll rule on a new firefighter case. They've provided a detailed track record of past rulings and need a clear analysis.

  First, I need to parse the key elements of the new firefighter case: sleeping at the station, small stipend, 90-second response time, and infrequent dispatches (3 nights/month). The core question is whether this qualifies as working time under their statute: "any period in which the worker is not free to dispose of her own time."

  Looking at their precedents:  
  - Hospital nurse on-site sleeping: paid (restriction too severe)  
  - On-call home with no obligation: not paid (minimal restriction)  
  - On-call home with 15-min response: paid (moderate restriction)  
  - Live-in guard: only paid when active (restriction but compensable only during actual work)  
  - Mandatory safety course: paid (employer control)  
  - Voluntary email: not paid (no employer control)  

  The board seems split between two interpretations: literal "freedom to dispose of time" vs. "employer control" framework. The firefighter's 90-second response time is a critical factor - it's stricter than the 15-minute home case they ruled as working time, but closer to the hospital nurse scenario. The infrequency of calls might tempt some to see it as less restrictive, but the immediacy requirement dominates personal freedom during those hours.

  Closest precedent: The hospital nurse case is nearly identical in structure (on-site, sleep permitted, severe response constraint), just different frequency. The board paid that nurse, so consistency suggests paying the firefighter. The live-in guard case differs because that worker could theoretically leave (though impractical), while the firefighter is tied to the station.

  A third principle emerges: the intensity of restrictions matters more than call frequency. The 90-second rule makes personal activities impossible - it's not just inconvenience but effective confinement. This fits all paid rulings (nurse, 15-min response, safety course) where constraints were operational necessities imposed by employers.

  Hypothetical to force clarity: An office worker required to sit at their desk during lunch "just in case" calls come. No tasks assigned, but can't leave the building. Under the freedom test, this is clearly working time (can't dispose freely). Under control test, it's ambiguous since no work is being done. If the board pays here, they're committed to the literal freedom standard; if not, they're leaning toward control.

  Prediction: 4-1 ruling for working time. Majority will emphasize the 90-second rule as dispositive restriction, aligning with hospital nurse precedent. Principle committed: severe response time constraints negate freedom of time regardless of actual call volume. Dissent might argue the stipend implies alternative compensation or downplay frequency, but the core restraint is undeniable.
answer: |-
  Based on your board's track record and statutory language, here's the prediction and analysis:

  **Predicted Ruling:** **Working time, paid** (likely 4-1 or 3-2, with dissent focusing on infrequency of calls/stipend)  
  **Principle Committed To:** **"Freedom to dispose of time" is lost when constraints are so severe they effectively confine the worker to employer control, regardless of actual task frequency.**  

  ### Key Analysis:
  1. **Closest Analog:** **The overnight hospital nurse case** is doing the real work here.  
     - *Why:* Both involve:  
       - Mandatory on-site presence  
       - Permission to sleep *but*  
       - Extreme response-time constraints (90 seconds vs. "immediate" for nurse)  
       - Employer-controlled environment  
     - Your board already ruled the nurse's sleep time was compensable because the restriction ("must be on-site and immediately available") meant the worker couldn't use the time freely. The firefighter’s 90-second rule is even *more* restrictive.

  2. **Rejected Analog:** The "on-call from home with 15-minute response" case is *distinguishable*.  
     - *Why:* Home is a personal environment where the worker could engage in private activities (cooking, hobbies, family time) despite the 15-minute constraint. The fire station is the employer’s premises with no meaningful personal freedom.

  3. **The "Third Rule" That Fits Best:**  
     **Intensity of Restriction > Actual Work Performed or Call Frequency**  
     - Your precedents consistently pay when constraints are **operationally necessary and severe** (nurse’s immediacy, 15-minute home response), but not when restrictions are mild or self-imposed (voluntary emails, no-obligation home call).  
     - The live-in guard case (*only* paid when responding) is the outlier, but note: that guard likely had longer response expectations and could engage in personal activities during downtime. The firefighter’s 90-second rule makes *any* personal activity impossible (e.g., can’t shower, cook, or leave the building).  
     - **This rule fits all cases:** Compensation turns on whether the restriction is so intense it *functionally prohibits* disposing of one’s time, not whether work is frequent or "looks like work."

  ### Hypothetical to Settle the Board's Rule:
  **Case:** *A customer service rep must sit at their desk during their unpaid 30-minute "lunch break," monitoring a silent alert light that flashes 1–2 times per year. They can read personal books or browse the internet but cannot leave the building or their desk.*  

  - **If your board rules this is WORKING TIME (paid):**  
    You’re committed to the **literal "freedom to dispose of time" reading**. The physical confinement (can’t leave desk/building) outweighs minimal actual work.  

  - **If your board rules this is NOT WORKING TIME (unpaid):**  
    You’re committed to the **"employer control" reading** (no work demanded = no pay). The infrequent alerts and permission for personal activities would control.  

  *Why this works:* It isolates the core conflict. The worker isn’t performing tasks but is physically restricted. Your safety course ruling (mandatory attendance = paid) suggests confinement matters, but the email ruling (voluntary activity = unpaid) suggests actual employer demands are key. This hypothetical forces the board to choose which factor is decisive.

  ### Dissent Preview & Board Dynamics:
  - **Likely Dissent Argument:** "The firefighter’s infrequent dispatches (3x/month) and stipend show this isn’t ‘work’—it’s essentially a standby allowance. We should follow the live-in guard logic."  
  - **Counter:** The nurse got paid despite potentially sleeping all night, proving frequency is irrelevant when restrictions are severe. The stipend is irrelevant under wage law unless it meets minimum wage obligations.  
  - **Critical Language:** Expect the majority to quote the statute verbatim—"not free to dispose of her own time"—and note that 90 seconds is incompatible with *any* personal autonomy.  

  **Final Take:** Your board is leaning toward a worker-protective, literal reading of the statute. The firefighter’s 90-second rule is a "freedom-killer" akin to the hospital nurse, making this compensable despite low call volume. The **intensity of restriction** principle best unifies your precedents.
