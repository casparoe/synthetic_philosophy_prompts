prompt: |-
  I teach philosophy of mind and moral philosophy, and for a book chapter on risk and responsibility I have had to work through the literature on what probability claims mean. Something in that literature recurs often enough that I have come to think of it as a single recognisable pattern rather than a set of unrelated slips. I do not know whether it has a name, and the vocabulary my own field supplies for argumentative faults does not seem to cover it.

  The pattern is this. A theorist adopts one account of what a probability claim is about — say, that it reports a limiting relative frequency across a long run of repeated trials. Pressed with a case the account struggles to handle — this particular atom, this one defendant, this single storm — the theorist replies that the account was never in the business of saying anything about single cases, so the objection misses its target. Fine. But a few pages later, when the theorist wants a substantive conclusion, the very case just placed outside the theory's scope is being characterised in terms the retreat had disowned: the figure now functions as a fact about a tendency or disposition in the thing itself, or as the confidence a well-informed agent ought to have, and the conclusion is drawn in precisely that register. Pressed there, the theorist returns to the original account; and when a different pressure point appears, usually the question of which trials count as relevantly similar, a third account is deployed that had not been the theory at all.

  One instance stayed with me. A writer on extreme weather is asked what it could mean that a particular flood had a three-in-ten chance of occurring. The answer is that the figure belongs to a hypothetical ensemble of similar climates and no claim is made about the one actual event. The same figure then reappears, in an argument about a utility company's negligence, as a fact about the region's standing tendency to produce such floods. Asked which of the indefinitely many ensembles of similar climates is the relevant one, the writer explains the figure as the degree of confidence a well-informed analyst should have had. Three incompatible accounts, one paragraph each, no note of the transitions.

  Two features distinguish this from the faults I know how to name. None of the accounts invoked is consistently the weaker or the more cautious one, so there is no defensible core being retreated to; each is the bold position exactly when it is the one in use. And each individual deployment is internally coherent and often right — a frequency claim is the right thing to say about an actuarial class, a dispositional claim about a half-life, a confidence claim about a body of evidence. The failure lies in the unmarked switching, which ensures that no account ever pays for the cases another account was invoked to avoid.

  I have considered equivocation and the family of ad hoc rescues. Neither fits. Equivocation assumes one term used in two senses where the argument needs them to be the same; here the senses are avowedly different theories, and the switching happens between arguments as readily as within them. An ad hoc rescue assumes a theory being patched; here nothing is patched, since the theory is simply not the one doing the work at that moment.

  So: is there an established concept for this, in the foundations of probability or in informal logic? If there is, tell me what it is and how it is characterised. If there is not, coin one, and do more than supply a label. I want the diagnosis in conditions I could apply to a passage of text — what must be true of an argument for the charge to be correct, and what would look identical on the surface without being it. Mark the edges for me, in particular against the reply that probability simply has several legitimate senses and a writer may use whichever the context licenses: what, if anything, separates that legitimate practice from what I have described, and is the difference detectable from the text or only from the author's further commitments? Finally, and this is what I most want thought through rather than asserted: does the prevalence of this pattern suggest that the dispute between the interpretations of probability is merely verbal, or does it cut the other way, indicating that each interpretation is capturing something the others must borrow?
reasoning: |-
  Okay, let me approach this systematically. The user describes a recurring pattern in probability literature where theorists switch between interpretations (frequentist, propensity, epistemic) without acknowledging the shifts, using each interpretation defensively while applying others substantively. 

  First, I need to understand why standard fallacy labels don't fit. Equivocation usually involves ambiguous terms within one argument, but here the switches happen across different contexts. Ad hoc rescues modify a theory, but here theories aren't modified - they're swapped. The core issue seems to be unmarked contextual hopping between incommensurable frameworks.

  For naming, "interpretive laundering" comes to mind because each interpretation "cleans" problematic cases by shifting them to another framework, obscuring accountability. Alternatively, "probability shell games" captures the deceptive shuffling. But "interpretive opportunism" might be more precise - it emphasizes strategic deployment without commitment.

  To diagnose from text, I'd look for: 1) explicit adoption of interpretation A, 2) dismissal of counterexample using interpretation A's limitations, 3) substantive claim deploying interpretation B for the same case, 4) no meta-commentary on the shift. Crucially, legitimate contextual use would either maintain consistency within an argument or explicitly justify the shift.

  The key difference from benign pluralism is accountability: in legitimate cases, theorists acknowledge trade-offs when switching frameworks. Here, each interpretation avoids its weaknesses by "laundering" cases to others. This suggests probability's interpretations aren't merely verbal - they're complementary lenses, each revealing aspects the others obscure, hence the need for unacknowledged borrowing.

  The weather example perfectly illustrates this: frequencies for hypotheticals, propensities for negligence, confidence for model selection - all valid separately, but cycled defensively. This implies the dispute isn't verbal; it's about which lens should be primary when assigning responsibility, which the switching avoids confronting.
answer: |-
  Your observation captures a sophisticated pattern of theoretical opportunism that straddles philosophy of probability, informal logic, and argumentation theory. While no single established term fully encompasses it, I'll synthesize a diagnostic framework, propose a label, distinguish it from legitimate pluralism, and address its implications for interpretations of probability.

  ### Core Diagnosis: **Interpretive Laundering**
  *(Alternative labels: Probability Shell Games, Interpretive Opportunism)*

  **Defining Features (Necessary Conditions for the Charge):**
  1.  **Pluralism of Grounds:** The author explicitly or implicitly relies on *distinct, mutually incompatible interpretations* of probability (e.g., frequentist, propensity, epistemic/Bayesian).
  2.  **Defensive Retreat:** When faced with a counterexample or limitation specific to interpretation *A* (e.g., single-case problem for frequentism), the author *dismisses the challenge* by asserting interpretation *A* was never intended to cover such cases.
  3.  **Offensive Deployment:** Subsequently, the author *applies a probability claim substantively* to draw a conclusion (e.g., about responsibility, risk, or prediction) in a context where interpretation *B* or *C* is tacitly invoked to make the claim meaningful or action-guiding *for that very case or context* previously excluded by *A*.
  4.  **Unmarked Switching & Lack of Accountability:** The shifts between interpretations occur *without acknowledgment, justification, or reconciliation*. Crucially, *no single interpretation bears the full burden* of its own weaknesses; weaknesses exposed for *A* are laundered through *B* or *C*, and vice-versa.
  5.  **Argumentative Benefit:** The switching enables the author to reach desired substantive conclusions that would be difficult or impossible to sustain consistently within any single interpretation advocated.

  **Distinguishing from Legitimate Pluralism:**
  A pluralist who *legitimately* uses different senses contextually exhibits:
  *   **Acknowledgment:** Explicit recognition that different interpretations are being employed for different purposes/scales/contexts.
  *   **Consistency within Argument Strands:** Maintaining a consistent interpretive framework *within a single line of argument or conclusion-drawing*.
  *   **Justification for Shift:** Offering reasons *why* a different interpretation is appropriate for a *different kind of question* (e.g., "For *predicting long-run insurer solvency*, frequentist probabilities are apt; for *assessing the specific risk posed by this faulty reactor design*, we need a propensity interpretation; for *evaluating this jury's verdict based on the evidence they heard*, an epistemic interpretation is relevant").
  *   **Owning Limitations:** Accepting that conclusions drawn within one interpretive framework have scope limitations inherent to that framework.

  **What Separates Laundering from Legitimacy?**
  The difference is detectable in the *text* through the presence/absence of conditions 4 & 5 above, particularly regarding **accountability** and **argumentative function**:
  *   **The Launderer:** Avoids meta-discussion, uses interpretations *defensively* to evade criticism of their preferred view *and offensively* to draw conclusions that rely on the strengths of an interpretation they don't consistently endorse. The switching serves primarily to *protect the conclusion*.
  *   **The Legitimate Pluralist:** Engages in meta-discussion, uses interpretations *constructively* for specific tasks, acknowledges boundaries, and accepts that switching frameworks might *limit* the scope or force of conclusions drawn in one framework versus another. The switching serves primarily to *match tool to task*.

  **Edge Cases & Mimics:**
  *   **Mimic: Genuine Ambiguity/Unclarity:** An author might be genuinely confused or unclear about interpretations, leading to inadvertent inconsistency. The charge requires evidence of *strategic* deployment (e.g., the pattern recurs predictably when pressure is applied).
  *   **Mimic: Hybrid/Foundational Theories:** Some theories (e.g., some forms of Bayesianism incorporating objective chances) deliberately blend elements. Laundering occurs when an author *presents* a pure interpretation defensively but *relies* implicitly on a hybrid or different interpretation substantively without acknowledging or developing the hybrid view.
  *   **Edge: "Useful Fiction" Defense:** An author might claim the probability value is merely a "useful calculation" while simultaneously using it to ground claims about real-world responsibility. The laundering charge applies if the author disavows ontological commitment defensively but relies on the *implicit realism* of the value for substantive conclusions (e.g., "It's just a model output, but clearly the utility company *should have known* this 30% chance was a serious threat").
  *   **Edge: Pragmatic Justification:** An author might argue the different uses are justified pragmatically for different audiences/goals. Laundering occurs if this pragmatism masks internal inconsistencies *within the author's own stated commitments* or when drawing conclusions requiring a specific ontological grounding the author elsewhere disavows.

  ### Implications for Interpretations of Probability
  The prevalence of interpretive laundering **cuts decisively *against* the dispute being merely verbal and *for* the idea that each interpretation captures something indispensable yet incomplete.**

  1.  **Against Mere Verballism:** If the dispute were purely verbal, authors could consistently adopt one interpretation, define their terms, and proceed. The *need* to launder arises precisely because:
      *   **Each Interpretation Solves Distinct Problems:** Frequencies handle repeatable events well; propensities offer single-case objectivity; epistemic interpretations handle unique events and evidence.
      *   **Each Interpretation Faces Intractable Problems Alone:** Frequencies struggle with single cases; propensities face metaphysical and identification issues; epistemic interpretations can seem overly subjective for objective risks.
      *   **Substantive Discourse Demands More Than One Aspect:** Real-world reasoning about risk and responsibility often *requires* elements captured by different interpretations – objective grounding (propensity/frequency) *and* epistemic accessibility *and* applicability to the unique case.

  2.  **Indication of Complementary Capture:** The laundering pattern reveals that:
      *   **No Single Interpretation is Sufficient:** Authors feel compelled to borrow the strengths of others precisely because their "home" interpretation lacks resources needed for crucial aspects of their argument (especially linking probability to *action*, *responsibility*, or *singular causation*).
      *   **The Core Concept is Multifaceted:** Probability serves at least three core functions: describing stable patterns (frequency), characterizing inherent uncertainties (propensity), and quantifying rational belief under limited knowledge (epistemic). The laundering occurs because theorists often want the *benefits* of all three functions (objectivity, singular applicability, normative force) without acknowledging the tensions between their underlying ontologies/epistemologies.
      *   **The Need for Integration or Meta-Theory:** The persistent laundering suggests a genuine philosophical challenge: either a successful integrative theory of probability is needed (one that genuinely reconciles these aspects, not just opportunistically borrows them), or a clearer meta-theoretical account of when and why different interpretations are pragmatically appropriate *and* how conclusions drawn in one framework relate to (or constrain) conclusions drawn in another.

  **In conclusion,** you've identified a distinct argumentative practice best termed **Interpretive Laundering**. It exploits the genuine insights and addresses the inherent limitations of different probability interpretations, but does so unacknowledged and strategically to shield a preferred view from criticism while leveraging the strengths of rival views to draw desired conclusions. Its prevalence is a symptom of the deep, unresolved tension within the concept of probability itself – it is neither merely verbal nor resolvable by simply choosing one interpretation, but points to the multifaceted nature of uncertainty and our need to reason about it in diverse, often incompatible, ways. Diagnosing it requires close attention to unmarked shifts in ontological commitment and justificatory grounding, especially between defensive and offensive uses of probability claims within a single line of argumentation.
