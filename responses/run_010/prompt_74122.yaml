  - **Group A**: Children with Kalaris Syndrome (mortality risk: 40%)  
  - **Group B**: Elderly with Ventriculon (mortality risk: 60%)  
  - **Group C**: Frontline workers with Xenoplexia (mortality risk: 50%)  

  The drug reduces mortality risk by **20 percentage points** (e.g., Group A’s risk drops to 20%). The committee ranks lotteries over drug allocations under supply uncertainty (e.g., "40% chance the shipment contains 600 vials, 60% chance it contains 200 vials").  

  #### **Utility Cards**  
  Print one card per student (16 total). **Utilities represent quality-adjusted life-years (QALYs) saved** by treating each group:  
  - **Children Advocates (5 students)**:  
    `Group A: 80 QALYs | Group B: 30 QALYs | Group C: 50 QALYs`  
  - **Elderly Advocates (5 students)**:  
    `Group A: 20 QALYs | Group B: 70 QALYs | Group C: 40 QALYs`  
  - **Frontline Advocates (6 students)**:  
    `Group A: 50 QALYs | Group B: 40 QALYs | Group C: 60 QALYs`  

  *(Later, add a new member: **Immunocompromised Child Advocate** with `Group A: 150 QALYs | Group B: 5 QALYs | Group C: 10 QALYs`)*  

  #### **Lotteries to Rank**  
  Define three uncertain prospects (whiteboard):  
  - **Lottery X**: 50% chance of 800 vials (enough for all), 50% chance of 100 vials (prioritize one group).  
  - **Lottery Y**: 40% chance of 600 vials, 60% chance of 300 vials.  
  - **Lottery Z**: 70% chance of 400 vials, 30% chance of 0 vials.  

  *(Vial allocations translate to QALYs using card utilities. E.g., 100 vials treat one group.)*  

  ---

  ### **Committee Structure & Roles**  
  - **Advocates**: Argue for their patient group. Each holds a utility card.  
  - **Weekly Chair (rotating)**: Facilitates discussion, breaks ties, and submits the group’s lottery ranking. **Rotate every 15 minutes.**  
  - **Scoring**:  
    - Each student starts with **100 Influence Points (IPs)**.  
    - If the group’s chosen lottery matches the Chair’s submitted ranking, all members gain **10 IPs**.  
    - If the group violates unanimity or expected-value reasoning (proven via cards), all lose **20 IPs**.  

  ---

  ### **Timeline (80 Minutes)**  
  **0–5 min**: Introduce scenario. Assign roles (5 Children, 5 Elderly, 6 Frontline). Distribute cards. Explain IPs.  
  **6–20 min (Decision 1: Baseline)**:  
    - *Task*: Rank Lotteries X, Y, Z.  
    - *Process*:  
      1. Advocates compute expected QALYs for their group (e.g., Children Advocate computes X: `0.5*(80) + 0.5*(80) = 80` if 800 vials treat all, but `0.5*(80) + 0.5*(80) = 80` if 100 vials treat Group A).  
      2. Chair leads debate. Students argue without revealing numbers (e.g., "Lottery X gives Children the best shot!").  
      3. Group submits a ranking (e.g., `X > Y > Z`).  
  **21–35 min (Decision 2: Pressure Test)**:  
    - *Task*: Rank new lotteries (K, L, M) with riskier payoffs.  
    - *Refutation Trap*: Include **Lottery K** (designed so averaging ranks violates unanimity):  
      - `K: 50% chance 0 vials, 50% chance 500 vials (treat Groups A+C)`.  
      - Children Advocate EU: `0.5*0 + 0.5*80 = 40`  
      - Elderly Advocate EU: `0.5*0 + 0.5*20 = 10`  
      - If group averages ranks, Lottery K may rank above a Pareto-superior lottery (e.g., **Lottery L** with `EU=30` for all). Reveal cards to show violation.  
  **36–45 min (Pivot: New Member)**:  
    - Introduce **Immunocompromised Child Advocate** (utility card: `A:150, B:5, C:10`).  
    - Explain: "A new patient group arrives. Their QALY loss without treatment is catastrophic."  
  **46–65 min (Decision 3: Lock-In)**:  
    - *Task*: Re-rank original Lotteries X, Y, Z with the new member.  
    - *Conflict*: Group will try to adjust weights (e.g., "Prioritize the new child!"). Use cards to show that existing weights force Z > X even if all prefer X.  
  **66–80 min (Debrief)**: Structured discussion (see below).  

  ---

  ### **Debrief: Mapping Activity to Theorem**  
  1. **Unanimity Premise**:  
     - *Activity Moment*: When students insisted, "Lottery L is better than K for *everyone*—why did we rank K higher?"  
     - *Theorem Link*: "You demanded that unanimous preferences bind the group. Harsanyi calls this *Pareto indifference*."  
     - *Student Quote*: "But K is obviously unfair to the Elderly!" → Highlights that unanimity constrains fairness discussions.  

  2. **Expected-Value Requirement**:  
     - *Activity Moment*: Students calculating EU for their group during Decision 1.  
     - *Theorem Link*: "You computed expected utilities because you wanted rational choices under uncertainty. Harsanyi assumes the group’s preferences are vNM-rational."  
     - *Student Quote*: "We have to account for the 50% chance of no vials!" → Shows commitment to linearity in probabilities.  

  3. **Weighted Sum & Fixed Weights**:  
     - *Activity Moment*: When the post-pivot group couldn’t override the initial weights to help the new child.  
     - *Theorem Link*: "The moment you accepted unanimity and EU, you became a weighted sum of utilities. The weights were fixed when you made your *first* decision."  
     - *Student Quote*: "Why can’t we just give the new kid more say now that we know?" → Reveals frustration with irrevocable weights.  

  4. **Equal Weights Gap**:  
     - *Key Point*: "The theorem says *a* positive weighted sum, not *equal* weights. To get equal weights, you need an extra assumption—like anonymity or symmetry. But nothing in your voting procedure guaranteed that."  
     - *Bridge to Ethics*: "Harsanyi’s utilitarianism requires equal weights as a moral postulate, not a mathematical inevitability."  

  ---

  ### **Predictable Failures & Mitigations**  
  1. **Math Whiz Spots Additivity Early**:  
     - *Mitigation*: "Great observation! Let’s test if your proposed aggregation survives the new member. How would your weights handle their 150 QALY claim?" Redirect to experiential goal: "Even if you see the math, can you *persuade* the Elderly Advocate to accept it?"  

  2. **Rejecting Interpersonal Comparisons**:  
     - *Mitigation*:  
       - *Preempt*: Start by saying, "Today, we assume utilities are interpersonally comparable. If you dispute this, note it for post-activity discussion."  
       - *If stalled*: Invoke realism: "The hospital *must* choose. How else would you weigh a child’s survival against an elder’s without *some* comparison?"  

  3. **Dominant Chair Hijacks Debate**:  
     - *Mitigation*: Rotate Chairs aggressively. Remind them IPs depend on the Chair’s accuracy.  

  ---

  ### **What the Activity Cannot Capture**  
  - **Preference-Profile Agnosticism**:  
    Harsanyi’s weights are fixed *before* preferences are known. In the activity, weights emerge from the first decision (with known utilities). Students will intuit weights as *responsive* to preferences.  
    - *Verbal Cover*: "In reality, Harsanyi’s weights are chosen *ex ante*—like a constitution. You couldn’t adjust them mid-debate even if you knew the first patient’s utilities. Your weights were ‘fixed’ only after seeing preferences, but the theorem demands more: weights invariant to *what* preferences show up."  

  ---

  ### **Materials to Print**  
  - **16 Utility Cards** (integers as above).  
  - **Lottery Cheat Sheet** (for you):  
    - `X: [800 vials (50%), 100 vials (50%)]` → All groups treated or one group (specify which).  
    - `K: [0 vials (50%), 500 vials (50%)]` → Treats Groups A+C if vials available.  
  - **IP Tracking Sheet** (whiteboard or shared doc).  

  This design forces students to confront the theorem’s implications viscerally. By Decision 3, they’ll *feel* the weights as constraints, and the debrief links this to Harsanyi’s axioms. The utility cards and IPs make the abstraction tangible, and the medical context intensifies moral stakes.
