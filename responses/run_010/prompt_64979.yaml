  ## Joint Statement on Persistence: Endurantism vs. Worm Theory (Adversarial Collaboration)

  This document outlines points of agreement and disagreement between Endurantism (E) and Worm Theory (WT) concerning the persistence of objects through time. Both parties affirm the following substantive claims:

  **Section 1: Points of Agreement**

  1.  **Location Vocabulary:** Both agree that the concept of "exact location" is fundamental, denoting the maximal spacetime region an object occupies. "Wholly present at a time *t*" (E's core claim) cannot be non-circularly analyzed *simply* as "has all its parts at *t*." Both owe an account of what "wholly present" means that avoids this triviality. E emphasizes the object's complete presence *at the spatial region* corresponding to *t* within its path, while WT emphasizes that "wholly present" requires the object to be confined to that instantaneous region, which WT denies is possible for persisting objects. Both agree that "wholly present" signifies the object's *complete qualitative and numerical identity* being present at a time-slice.
  2.  **Temporary Intrinsics Problem (TIP) Conditions:** For the TIP (e.g., an object being bent at t1 and straight at t2) to constitute a *genuine metaphysical problem* (rather than merely a linguistic or conceptual one), the following must be true: (a) The properties involved (like shape) must be genuinely intrinsic (non-relational). (b) The properties must be had *simpliciter* by the object at the time, not merely indexed or relativized. (c) Numerical identity must be strict across time. Both agree that *if* these conditions hold, the TIP demands a solution. They disagree on whether the conditions hold and what the solution is.
  3.  **Composition & Unity:** Both sides owe an account of what makes a series of momentary stages (whether conceived as numerically identical objects at different times (E) or distinct temporal parts (WT)) "add up to" a single, unified persisting object. This requires explaining diachronic unity conditions (e.g., spatiotemporal continuity, immanent causation, qualitative similarity, etc.) and addressing the vagueness of these conditions. Neither side can simply take diachronic composition for granted; it requires metaphysical grounding.
  4.  **Physics & Metaphysics:** Both agree that fundamental physics (e.g., Relativity) describes the structure of spacetime and the behavior of matter/energy within it. However, both agree that physics *underdetermines* the metaphysics of persistence: physics does not specify whether the fundamental entities described perdure or endure, whether temporal parts are ontologically primitive, or how the unity of persisting macroscopic objects supervenes on the physical description. Physics provides constraints (e.g., relativity challenges absolute simultaneity) but not decisive ontological answers.
  5.  **Discernibility Requirement:** If two scenarios are genuinely metaphysically distinct (e.g., a spinning disc vs. a stationary disc), then there must be *some* difference in the intrinsic properties instantiated *at some time(s)* or in the relations holding *across times* that grounds this distinction. Neither side can accept scenarios differing *only* in their histories without any such grounding difference.

  **Section 2: Disagreements Table**

  | # | Disagreement Stated Neutrally                                                                                                                               | Endurantist (E) Preferred Phrasing                                                                                                                                                                       | Worm Theorist (WT) Preferred Phrasing                                                                                                                                                               | Genuine Disagreement or Verbal? (If Verbal, Key Terms)                                                                                                                               |
  | :-- | :---------------------------------------------------------------------------------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | 1  | **The fundamental nature of a persisting object:** Is the persisting object itself wholly located at each moment of its existence?                         | An ordinary object (e.g., a person, a rock) is **multilocated**: it is wholly present, numerically identical, and exactly located at each instantaneous spacetime region it occupies throughout its career. | An ordinary persisting object is a **spacetime worm**: it is extended through spacetime and exactly located only at its entire spacetime path. It is **composed** of distinct instantaneous temporal parts. | **Genuine.** Core ontological commitment about the structure of persisting entities.                                                                                                   |
  | 2  | **Solving TIP:** How is the apparent contradiction of an object having incompatible intrinsic properties at different times resolved?                       | The object **relativizes** its properties to times (e.g., "bent-at-t1", "straight-at-t2"). The properties are time-indexed. The object simpliciter has the relativized property *simpliciter*.             | The incompatible properties are had by **different entities**: the t1-temporal-part is bent, the t2-temporal-part is straight. The whole worm has the property derivatively (e.g., "bent at t1").      | **Genuine.** Different solutions to the problem agreed to be genuine *if* conditions hold (see Agreement 2). Disagreement on whether relativization or part-bearing is the correct approach. |
  | 3  | **"Exists at":** Does the claim "Object O exists at time t" mean the same thing for E and WT?                                                                | "O exists at t" means that O **is wholly present** at the spacetime region corresponding to t. O itself is located there.                                                                                 | "O exists at t" means that O **has an instantaneous temporal part** located at the spacetime region corresponding to t. O itself is only partially located there.                                     | **Primarily Verbal.** Key term: "exists at". Both agree O is present/involved at t, but differ fundamentally on *what is located there* (O itself vs. a part of O).                     |
  | 4  | **Vagueness of Composition:** Does the vagueness of when composition occurs over time imply unrestricted diachronic composition?                            | The vagueness is epistemic or semantic. There are sharp (though perhaps unknowable) facts about when a series of stages constitutes a single enduring object. Unrestricted composition is false.           | The vagueness is ontological. The only way to avoid arbitrariness is to accept **unrestricted diachronic composition**, generating all possible spacetime worms. This entails four-dimensionalism.    | **Genuine.** Disagreement on the nature and implications of vagueness (ontological vs. epistemic/semantic) and the necessity of unrestricted composition.                                |
  | 5  | **Velocity & Instantaneous States:** Is instantaneous velocity an intrinsic property of an object at an instant?                                            | Velocity is a **dispositional property** grounded in the object's instantaneous state and the laws of nature, but not requiring extended temporal parts for its instantiation.                             | Instantaneous velocity is **fundamentally relational**, encoding the object's position relative to its positions at immediately preceding/ succeeding times. It cannot be an intrinsic at an instant. | **Genuine.** Disagreement on the ontological status and grounding of instantaneous velocity.                                                                                          |

  **Section 3: Cruxes – Predictions and Abandonment Conditions**

  1.  **The Lonely Homogeneous Disc Case:**
      *   **Case:** Consider two possible worlds containing only a single perfectly homogeneous disc. In World S, the disc is spinning on its axis. In World N, the disc is non-spinning (stationary). Both discs are qualitatively identical at every single instant. (Assume Newtonian spacetime for simplicity).
      *   **Relevance:** This case tests whether instantaneous temporal parts can ground the distinction between spinning and non-spinning states, and whether the scenario itself is metaphysically possible.
      *   **E Prediction:** World S and World N are **metaphysically distinct and possible**. The distinction is grounded in the disc's intrinsic *dispositional* or *historical* properties at each instant (e.g., different instantaneous velocities, conceived as intrinsic tendencies or as relations to past/future positions within its history). Instantaneous temporal parts *can* carry velocity information intrinsically (as disposition) or relationally (to other parts of *itself* at other times).
      *   **WT Prediction:** World S and World N are **metaphysically indistinguishable** at the fundamental level. The property "spinning" requires a difference in the arrangement of *extended* temporal parts (different worldlines). If the discs are identical at every instant, there is no difference in their temporal parts or their arrangement. Therefore, either (a) the scenario is impossible (spinning requires extended parts differing), or (b) the worlds are identical (velocity isn't an intrinsic property of instants).
      *   **E Abandonment Condition:** If it can be conclusively shown that *no* coherent account of intrinsic or relationally-grounded (to other stages of *itself*) instantaneous properties can distinguish S and N without invoking extended temporal parts *as fundamental entities*.
      *   **WT Abandonment Condition:** If it can be conclusively shown that S and N *are* metaphysically distinct *and* that this distinction is grounded *solely* in intrinsic properties of instantaneous stages (or relations only to other stages of the *same* enduring object), without requiring extended worms as the primary bearers of the spinning property.

  2.  **Vagueness of "Exists at" & Sorites Arguments:**
      *   **Argument:** The argument from vagueness: If composition is sometimes vague (e.g., when exactly does a cloud begin/end?), then "exists at" is vague (e.g., when exactly does the cloud start existing?). But existence cannot be vague ("exists" is precise). Therefore, composition must always be precise. The only non-arbitrary way to ensure this is unrestricted diachronic composition (every arbitrary set of stages composes a worm).
      *   **Relevance:** This argument aims to force WT (unrestricted composition) as the only solution to the problem of vague existence.
      *   **E Prediction:** The vagueness is **not ontological** but **epistemic or semantic**. There *is* a sharp fact about when composition occurs (and hence when an enduring object exists), even if we cannot know or precisely express it. Unrestricted composition is metaphysically extravagant and unnecessary. The argument conflates linguistic vagueness with ontological indeterminacy. "Exists" *is* precise, but our *application* of it can be vague due to ignorance or semantic indecision.
      *   **WT Prediction:** The argument is **sound**. Vagueness in composition *is* ontological vagueness in existence. The only way to avoid vague existence is unrestricted composition, generating all possible worms. This entails four-dimensionalism (WT).
      *   **E Abandonment Condition:** If it can be conclusively shown that ontological vagueness in existence is unavoidable for enduring objects and that epistemic/semantic accounts fail to resolve the sorites paradox for persistence.
      *   **WT Abandonment Condition:** If it can be conclusively shown that a viable account of *sharp* temporal boundaries for enduring objects is possible without unrestricted composition *and* that ontological vagueness can be coherently denied or explained away without recourse to unrestricted worms.

  3.  **Quantifier Carving:**
      *   **Issue:** Is the disagreement fundamentally about what exists (ontology) or about how we conceptually/linguistically divide up the spacetime manifold (conceptual scheme)?
      *   **Relevance:** This questions whether E and WT are describing the same underlying reality with different conceptual tools, or whether they posit genuinely different ontological inventories.
      *   **E Prediction:** The dispute is primarily about **conceptual prioritization and carving**. Both theories describe the same underlying spacetime manifold populated by matter/energy fields. E prioritizes the "manifest image" of enduring, wholly present objects as fundamental. WT prioritizes the spacetime manifold and its arbitrary slices. WT's worms are mere conceptual fictions or logical constructions out of the history of enduring objects (or the manifold). Our quantifiers range over enduring entities.
      *   **WT Prediction:** The dispute is **ontological**. The spacetime manifold and its contents are fundamental. E's enduring objects either (a) fail to exist (because nothing is multilocated) or (b) are derivative entities (perhaps patterns in the manifold or logical constructions out of temporal parts). Temporal parts (or the manifold regions they occupy) are fundamental. Our quantifiers range over spacetime worms (or their temporal parts).
      *   **E Abandonment Condition:** If it can be conclusively shown that multilocation is metaphysically incoherent *and* that enduring objects cannot be coherently reduced to or understood as patterns within a fundamentally partite spacetime ontology.
      *   **WT Abandonment Condition:** If it can be conclusively shown that temporal parts are incoherent (e.g., due to grounding problems for properties like velocity or identity over time) *and* that a coherent fundamental ontology of enduring, multilocated entities is possible.
