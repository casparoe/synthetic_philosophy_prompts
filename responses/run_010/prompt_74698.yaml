              - If the reason is a value (like catastrophe aversion) then we hand the decision to elected leadership.

            Step 7: Expected value calculation.

              If we get here, we calculate the expected value of each option (adjusting for any certainty laundering) and recommend the option with the highest expected value.

          Summary of the entire procedure:

            Step 1: Present the two options clearly. 
            Step 2: Identify if any option has a certain outcome. If not, go to Step 7.
            Step 3: Test for certainty laundering for the certain outcome. If laundered, adjust the option to make it risky (with the officials' input on the hidden risk) and then go to Step 7. If the certainty is real, proceed.
            Step 4: Check the structure of the risky option:
                  - If the risky option has a positive probability of the guaranteed outcome (M), then we perform the common-consequence transformation and present the second pair (A2 vs B2).
                  - Otherwise, we perform the common-ratio transformation (with a chosen scaling factor r, say 0.1) and present the second pair (A_scaled vs B_scaled).
            Step 5: Ask the officials to choose in the second pair.
            Step 6: 
                  - If they choose the guaranteed option (A) in the first pair and the transformed guaranteed option (A2 or A_scaled) in the second, then they are consistent -> recommend the guaranteed option (A) for the original decision.
                  - If they choose the guaranteed option (A) in the first pair and the transformed risky option (B2 or B_scaled) in the second, then we have a violation. 
                      a) Explain the inconsistency and ask for the reason.
                      b) If they change their first choice to the risky option, then recommend the risky option (B).
                      c) If they do not change and the reason is based on catastrophe aversion (a value), then hand the decision to elected leadership.
                      d) If they do not change and the reason is not clearly a value (or they cannot articulate), then we flag and recommend the expected value option (which would be B, the risky one, because it has higher expected value).
            Step 7: Calculate expected value for both options and recommend the one with the highest expected value.

          However, note: Step 7 is also reached if there was no certain outcome or if the certainty was laundered. In that case, we are not in an Allais situation.

          Now, we run the procedure on three cases.

   Case 1: County A

     Step 1: Present:
          Option A: Buyout: 20 homes certainly saved.
          Option B: Levee: 90% chance of saving 200 homes, 10% chance of saving 0.

     Step 2: Option A has a certain outcome. Test for certainty laundering: 
          - What makes the buyout guarantee? The homes are bought and then demolished or relocated, so they are out of the flood plain. 
          - Is there any risk? Maybe: what if the buyout program takes time and the flood happens before it's complete? Or what if some homeowners refuse? 
          - We ask: "Is there any chance that the buyout does not result in those 20 homes being removed from harm?"
            The officials might say: "We have the funds and the homeowners have agreed, so it's certain." 
          - We accept that the certainty is real.

     Step 4: The risky option (B) does not have any chance of saving 20 homes. It saves either 200 or 0. So we do common-ratio.

          We choose r=0.1 (to get the 10% and 11% as in the example). Then:

            Option A_scaled: 0.1 chance of 20 homes, 0.9 chance of 0.
            Option B_scaled: 0.1 * 0.9 = 0.09 chance of 200 homes, 0.91 chance of 0.

          But note: the example provided for County A has a second pair:

              Option C: 11% of 20, 89% of 0.
              Option D: 10% of 200, 90% of 0.

          So we can set r=0.11? Then:

            A_scaled: 0.11 chance of 20, 0.89 of 0.
            B_scaled: 0.11 * 0.9 = 0.099 (approx 10%) chance of 200, 0.901 of 0.

          We round 0.099 to 10% for simplicity? Or we use 11% and 10% as given.

          We present:

            Pair 2:
              Option C: 11% chance of saving 20 homes, 89% chance of saving none.
              Option D: 10% chance of saving 200 homes, 90% chance of saving none.

          And the officials choose D.

     Step 5: They chose A in the first pair and D in the second.

     Step 6: Violation detected. 
          We explain: "In the first pair, you preferred the guarantee. In the second pair, you preferred the option with a 10% chance of 200 over the 11% chance of 20. This is inconsistent because the second pair is a scaled version of the first. Why do you think you chose differently?"

          They might say: "In the first pair, we couldn't risk saving nothing when we could have saved 20 for sure. But in the second pair, both are risky so we went for the higher potential benefit."

          This is catastrophe aversion in the first pair -> a value. Therefore, we hand the decision to elected leadership.

          But note: the expected value in the first pair:
              A: 20
              B: 0.9*200 = 180

          In the second pair:
              C: 0.11*20 = 2.2
              D: 0.10*200 = 20

          So in the second pair, D is clearly better by expected value. But in the first pair, B is better by expected value.

          We say: "This seems to reflect a strong aversion to a 10% chance of complete failure in the first pair. Because this is a value judgment about risk tolerance, we will refer the decision to the elected leadership."

          We do not make a recommendation for the original pair? We hand it over.

          However, the procedure says: the emergency manager signs off on whatever I bring. So we must bring something. We can bring both options with our analysis to the emergency manager, noting that the officials' preference for the guarantee is driven by a value that should be decided at a higher level.

          But the procedure must terminate with one of the three. In this case, we terminate by handing to elected leadership.

   Case 2: County B

     Step 1: Present:
          Option A: Heat-emergency plan (which is presented as guaranteeing some protection, but depends on cooling-center commitment renewed annually).
          Option B: Grid-hardening measure (risky: higher expected lives saved but no guarantee).

     Step 2: The heat-emergency plan is presented as guaranteeing protection. Test for certainty laundering:

          - What makes the outcome certain? The cooling-center commitment must be renewed every year.
          - We ask: "Is there any chance the city council fails to reauthorize the cooling-center commitment in a future year?"
          - They might say: "It has been renewed every year for the past 20 years, but there is always a small chance."
          - We adjust: We ask the officials to estimate the chance of failure in a given year. If they cannot, we use a conservative estimate (say 5% or 10%). Let's use 5%.

          Then Option A is no longer certain: it has a 95% chance of providing the protection and 5% chance of providing no protection (or reduced protection?).

          We recast Option A as: 
              95% chance of saving X lives (the expected protection level), 5% chance of saving 0.

          But note: we need to know what X is. The original guarantee was presented as saving a fixed number of lives? Or providing a fixed level of protection? We need to clarify.

          Let's assume the original Option A was presented as: "guarantees saving 100 lives" (for example). Then after adjustment, it becomes: 95% chance of 100 lives, 5% chance of 0.

          Now, we compare with Option B: which might be, say, 80% chance of saving 150 lives and 20% chance of saving 50 lives? (so expected value = 0.8*150+0.2*50=130). 

          But we don't have numbers. We must get the numbers.

          Since we adjusted Option A to remove the certainty, we go to Step 7.

     Step 7: Calculate expected value.

          Option A_adj: 0.95 * 100 = 95 lives.
          Option B: ... we need the numbers. Let's assume Option B has expected value of 110 lives.

          Then we recommend Option B.

   Case 3: Constructed case where the procedure returns a verdict the analyst won't like.

     Scenario: 
          Option A: A guaranteed saving of 50 homes by buying out 50 homes in a flood plain. (Real certainty: the homes are acquired and demolished.)
          Option B: A levee upgrade with 80% chance of saving 60 homes and 20% chance of saving 0.

     Expected value: 
          A: 50
          B: 0.8*60 = 48

     So expected value slightly favors A.

     But the agency's recommended package is Option B? Why? Maybe because it has a chance to save more and the expected value is close. Or maybe because the agency has a mandate to maximize potential in low-risk years.

     But let's run the procedure:

          Step 1: Present the two options.

          Step 2: Option A has a certain outcome. Test for laundering: none, because the buyout is real. Proceed.

          Step 4: The risky option (B) does not have a positive chance of 50 homes. So we do common-ratio.

              Choose r=0.5.
              Option A_scaled: 50% chance of 50 homes, 50% chance of 0.
              Option B_scaled: 0.5 * 0.8 = 40% chance of 60 homes, 60% chance of 0.

          Present:
              Pair 2:
                  Option C: 50% chance of 50 homes, 50% chance of 0.
                  Option D: 40% chance of 60 homes, 60% chance of 0.

          Step 5: Suppose the officials choose A in the first pair and then choose C in the second pair. This is consistent.

          Step 6: Then we accept the guaranteed option (A) and recommend it.

          But the agency recommended Option B. The analyst won't like this because the agency's recommended package (B) is not chosen.

          However, note: the expected value of A is 50 and B is 48, so A is better by expected value too. So why would the agency recommend B? Maybe because of other factors (like the levee upgrade has co-benefits). But in this narrow decision, the procedure correctly chooses A.

          Alternatively, let's make a case where the agency recommends the guaranteed option but the procedure flags it.

     New Scenario:

          Option A: Guaranteed saving of 10 lives by a targeted vaccination program.
          Option B: 95% chance of saving 11 lives, 5% chance of saving 0.

          Expected value: 
              A: 10
              B: 0.95*11 = 10.45

          The agency might recommend B because of the higher expected value.

          The officials choose A.

          Run the procedure:

            Step 2: The guarantee is real (vaccination is certain).

            Step 4: Common-ratio with r=0.5:

              A_scaled: 50% of 10 lives, 50% of 0.
              B_scaled: 0.5 * 0.95 = 47.5% chance of 11 lives, 52.5% chance of 0.

            We present:

              Option C: 50% chance of 10 lives, 50% chance of 0.
              Option D: 47.5% chance of 11 lives, 52.5% chance of 0.

            The officials choose A in the first pair and then choose D in the second pair? Why? Because 47.5% of 11 gives an expected value of 5.225, while 50% of 10 gives 5.0. So they might choose D.

            Then we have a violation.

            Step 6: They say: "In the first pair, we cannot risk losing 10 lives for a 5% chance of failure when we can guarantee them. But in the second pair, the guaranteed option is gone and the difference in expected value is small, but 11 is better than 10 so we go for D."

            This is a common-ratio violation. We ask if they want to reconsider the first choice. If they say no, and if they say the reason is catastrophe aversion for the 5% chance of failure in the first pair, then we hand to elected leadership.

            But the agency wants to recommend B. We are flagging the officials' preference for A and then we might end up handing to elected leadership. The analyst won't like that because it delays and might result in A being chosen.

          Alternatively, if after the explanation they change their mind and choose B, then we recommend B and the analyst is happy.

   What the procedure cannot do:

     - It cannot handle options with multiple outcomes beyond the simple ones. We assume outcomes are either a fixed benefit or zero.

     - It does not incorporate risk aversion in a consistent way beyond the Allais patterns. For instance, if the officials are generally risk averse (with a concave utility function), that is not a violation of expected utility. But our procedure might flag it as such if it happens to fit the Allais pattern.

     - The adjustment for certainty laundering requires subjective judgment about the hidden risk. We use a conservative estimate if the officials cannot provide one, but that might be arbitrary.

     - The common-ratio and common-consequence tests depend on the scaling factor (for common-ratio) and the identification of the common consequence (for common-consequence). These might be done in a way that doesn't exactly match the officials' perception.

     - The procedure assumes that the outcomes are linear in value (like number of homes or lives). But if there are thresholds (e.g., saving at least 100 homes is critical) then that is a value and should be handled by elected leadership.

     - It does not account for correlations between risks or repeated decisions.

     - The transformation in Step 4 might be seen as artificial by the officials and they might not engage.

     - It might not detect other heuristics or biases.

     - In the case of a value judgment (catastrophe aversion), we hand it to elected leadership. But elected leadership might not have the expertise and might make a poor decision.

     - The procedure requires the participants to understand probabilities and to be consistent in their reasoning. If they are not, it might lead to confusion.

     Given these limitations, the procedure is best used as a tool to facilitate discussion and to uncover hidden assumptions and values, not as a rigid algorithm.

     We present the procedure in the room as a sequence of questions.

     Due to time constraints, we must keep it under an hour. Therefore, we streamline:

          Step 1: 5 minutes.
          Step 2: 10 minutes.
          Step 4 and 5: 15 minutes (including the transformation and presenting the second pair).
          Step 6: 15 minutes.
          Step 7: 5 minutes.

     Total: 50 minutes.

     We now write the entire procedure as a sequence of questions and instructions.

     Note: This is a complex procedure. We must make it as simple as possible.

     Revised streamlined procedure:

     PREPARATION: Have the two options of the current decision clearly written.

     STEP 1: Present the two options (A and B) to the officials.

     STEP 2: 
          Ask: "Is one of these options presented as having a guaranteed outcome (100% chance)?"
          If no, then say: "Then we will compare the average (expected) outcome of each." and go to STEP 6.
          If yes, ask: "Which one?" (Let it be option A)

          Then ask: "What in the real world makes this outcome guaranteed? Could anything go wrong that would prevent the benefit?"
          Listen and discuss briefly. 
            - If they identify a risk (like a dependency on future decisions, cooperation, or a base rate that might not hold), then say: "So there's a chance of failure. Let's estimate that chance."
            - If they agree there's a hidden risk, then help them assign a probability of success (p) for option A. For example, if they say the city council might not renew, ask: "What is the chance that the council fails to renew in a given year? 1 in 20? (5%)" Then adjust option A to: p chance of the original benefit and (1-p) chance of 0.
            - Recalculate option A as a risky option.
            - Then say: "Now that we've adjusted, neither option is a guarantee. We will compare by average outcome." and go to STEP 6.

          If they are confident the guarantee is real, proceed.

     STEP 3: 
          Look at option B (the risky one): 
            Ask: "Does option B have any chance of resulting in the same benefit as the guaranteed option (the one in option A)?"
            If yes, then we will do the COMMON-CONSEQUENCE test. 
            If no, then we will do the COMMON-RATIO test.

     STEP 4a (COMMON-CONSEQUENCE test):
          Let:
            M = benefit of the guaranteed option (A)
            In option B, let the outcomes be:
               With probability p1: benefit G (good, larger than M)
               With probability p2: benefit M
               With probability p3: benefit 0 (or worst outcome)

          Create two new options:

            Option C: (1-p2) chance of M, p2 chance of 0.
            Option D: p1 chance of G, (p2+p3) chance of 0.

          Present:
            "Now consider a different scenario. You have two options:
               Option C: [1-p2] chance of [M] and [p2] chance of 0.
               Option D: [p1] chance of [G] and [p2+p3] chance of 0.
            Which would you choose?"

     STEP 4b (COMMON-RATIO test):
          We choose a scaling factor (r) between 0.1 and 0.5 (we pick r=0.2 for simplicity, or to get nice numbers).

          Let:
            M = benefit of the guaranteed option (A)
            In option B: 
               With probability p: benefit G
               With probability 1-p: benefit 0

          Create two new options:

            Option C: r chance of M, (1-r) chance of 0.
            Option D: (r * p) chance of G, (1 - r*p) chance of 0.

          Present:
            "Now consider a different scenario. You have two options:
               Option C: [r] chance of [M] and [1-r] chance of 0.
               Option D: [r*p] chance of [G] and [1 - r*p] chance of 0.
            Which would you choose?"

     STEP 5: 
          Record the choice in the new scenario.

          If in the original choice they chose A and in the new scenario they chose the transformed A (which is option C in either test), then:
               "Your choices are consistent. We recommend the guaranteed option (A)."

          If in the original they chose A and in the new scenario they chose the transformed B (option D in either test), then:
               "We notice an inconsistency. In the first choice, you preferred the guarantee, but in the second choice you preferred the gamble even though the second scenario is a proportional reduction of both options. This is a known pattern called the Allais paradox. Let me explain why this is a problem: it means your choice depends on the context in a way that can lead to poor long-term results. The expected value of option B in the original is [value] and of option A is [value]. Given the inconsistency, would you like to reconsider your original choice in favor of option B?"

            - If they change to B, then recommend B.
            - If they do not, ask: "Can you explain why you prefer the guarantee in the first scenario but not in the second?"
                  If they say something like: "Because in the first scenario, we have a sure thing and we don't want to risk complete failure, but in the second scenario both are risky so we go for the higher potential" -> then 
                      "This reflects a value: you are particularly averse to taking a risk when a guarantee is available. Because this value is important, we should let elected leadership make the final call on this trade-off."
                  If they cannot explain or give a different reason, then say: "We will recommend based on expected value. The expected value of option B is higher, so we recommend B."

     STEP 6 (Expected value):
          Calculate the expected value for both options (if not done already) and recommend the one with the higher expected value.

     Note: In STEP 5, when they do not change and give a value reason, we hand it to elected leadership. But the emergency manager is waiting for a recommendation. We might instead say:

            "Given the value judgment, we are not authorized to override. We will present both options to the emergency manager with a note about the value conflict, and recommend that she consult with elected leadership."

     But the procedure must be clear. We are to hand the question to elected leadership. We do not make a recommendation in that case.

     Now, run the cases again briefly with this streamlined version.

   Case 1: County A

     STEP 1: Options A (20 homes guaranteed) and B (90% of 200, 10% of 0).
     STEP 2: Guarantee is real.
     STEP 3: Option B does not have a positive chance of 20 homes -> common-ratio.
     STEP 4b: We choose r=0.11 (to get 11% and 10%).
          Option C: 11% of 20, 89% of 0.
          Option D: 11% * 90% = 9.9% (we present as 10%) of 200, 90% of 0.
     STEP 5: They choose A in first and D in second -> inconsistency.
          They explain: aversion to risk in the first pair.
          We say: "This is a value, so we hand to elected leadership."

   Case 2: County B

     STEP 1: Options A (heat plan) and B (grid hardening).
     STEP 2: They identify hidden risk in A -> adjust to 95% of the benefit, 5% of 0.
          Then go to STEP 6: compare expected values.

   Case 3: The analyst's own case (where the agency recommends B but the procedure may recommend A or hand to leadership) is the second scenario we constructed above.

     We present that scenario and show that the procedure might lead to handing to leadership, which the analyst won't like because it may result in the agency's recommended option (B) not being chosen.

     Finally, note that the procedure cannot:

          - Handle non-linear utilities (like diminishing marginal utility) appropriately.
          - Account for very small or very large probabilities (where perception is skewed).
          - Deal with outcomes that are not easily quantifiable in a single number.
          - Address correlated risks between options.
          - Be applied in decisions with more than two options without modification.
          - Be applied in decisions with more than two outcomes per option without modification.

     We are better off not using the procedure in these cases and instead rely on multi-attribute decision analysis or cost-benefit analysis with sensitivity analysis.

     Given the time and simplicity constraints, we have designed a procedure that covers the common Allais patterns and certainty laundering.

     We hope this helps in your role as decision analyst.
answer: |-
  ### Decision Procedure for Preparedness Measures

  **Objective**: Guide county officials through a structured, efficient (under 60 minutes) decision process that respects values, tests for cognitive biases (Allais paradox), and flags "certainty laundering." Terminate with one of three outcomes:  
  1. **Accept** the officials' certainty preference.  
  2. **Flag** the preference and recommend the expected-value-based option.  
  3. **Hand off** to elected leadership due to value-based trade-offs.  

  **Participants**: County officials with high school algebra.  
  **Time Allocation**: 50-55 minutes.  
  **Materials**: Whiteboard, markers, calculator.  

  ---

  ### Step-by-Step Procedure  
  *(Write questions on the board. For probabilistic options, use fractions/percentages and whole numbers.)*  

  #### **Step 1: Clarify Options and Identify Certainty** (5 mins)  
  - **Question 1**: "Option A is [describe guaranteed outcome]. Option B is [describe risky outcome]. Is either outcome presented as 100% guaranteed? If yes, which one?"  
    - *Sufficient Answer*: Officials name the "guaranteed" option (e.g., "Option A").  
    - *If no guaranteed option*: Skip to **Step 4**.  
    - *If yes*: Proceed to **Step 2**.  

  #### **Step 2: Test for Certainty Laundering** (10 mins)  
  - **Question 2**: "What makes this outcome 100% guaranteed? Is there *any* chance—even a tiny one—it fails? Consider:  
    - Budget renewals, partner commitments, or historical trends treated as absolute.  
    - Uncontrollable events (e.g., supply chains, political changes)."  
    - *Sufficient Answer*:  
      - **Real guarantee**: Officials confirm no dependencies (e.g., "Homes are demolished; no future risk"). → Proceed to **Step 3**.  
      - **Certainty laundering**: Officials admit hidden risks (e.g., "The city council must approve funding yearly"). → **Adjust the option**:  
        - Estimate failure probability (e.g., "5% chance council denies funding").  
        - Recalculate as: [Original benefit] × (1 − failure probability).  
        - **Terminate**: Skip to **Step 4** and use expected value.  

  #### **Step 3: Diagnose Allais Paradox Type** (15 mins)  
  - **Question 3**: "Does the risky option (B) include a chance of the *same* benefit as the guaranteed option (A)?"  
    - *Sufficient Answer*:  
      - **Yes** → Potential *common-consequence violation*.  
      - **No** → Potential *common-ratio violation*.  
  - **Present Diagnostic Pair** (Use pre-prepared scenarios based on answer):  
    - **Common-Consequence Test** (If "yes" in Question 3):  
      - Original: A (100% of M) vs. B (e.g., 90% G, 10% M).  
      - New Pair: C (e.g., 11% of M, 89% of 0) vs. D (e.g., 10% of G, 90% of 0).  
    - **Common-Ratio Test** (If "no" in Question 3):  
      - Original: A (100% of M) vs. B (e.g., 90% of G, 10% of 0).  
      - New Pair: C (e.g., 11% of M, 89% of 0) vs. D (e.g., 10% of G, 90% of 0).  
  - **Question 4**: "In this new scenario, which do you choose: C or D?"  
    - *Sufficient Answer*: Officials select C or D.  

  #### **Step 4: Resolve Inconsistency or Accept Preference** (15 mins)  
  - **Compare Choices**:  
    - **Consistent**: Officials chose guaranteed (A) in original *and* C in diagnostic pair.  
      - **Terminate**: **Accept** certainty preference. Recommend Option A.  
    - **Violation**: Officials chose guaranteed (A) in original *but* D in diagnostic pair.  
      - **Explain**: "In the original, you avoided risk for a guarantee. In the diagnostic, you avoided the same guarantee when both options were risky. This is inconsistent with prioritizing long-term outcomes."  
      - **Question 5**: "Should we revisit the original choice? Why did you prefer certainty originally?"  
        - *Sufficient Answer*:  
          - **Value-based**: "We cannot tolerate *any* chance of total failure." → **Terminate**: **Hand off** to elected leadership.  
          - **No value claim**: Officials stand by original choice without value rationale. → **Terminate**: **Flag** and recommend expected-value option.  

  #### **Step 5: Expected-Value Calculation** (5 mins)  
  - **Question 6**: "Calculate expected value: (Benefit × Probability) for each option. Which is higher?"  
    - *Sufficient Answer*: Officials compute and compare.  
  - **Terminate**: **Recommend** the option with higher expected value.  

  #### **Step 6: Final Recommendation** (5 mins)  
  - Present outcome:  
    - Accept certainty preference.  
    - Flag and recommend expected-value option.  
    - Hand off to elected leadership.  

  ---

  ### Run the Procedure on Three Cases  

  #### **Case 1: County A**  
  - **Options**:  
    - First Pair: Buyout (20 homes guaranteed) vs. Levee (90% save 200 homes, 10% save 0).  
    - Diagnostic Pair: 11% save 20 homes (89% save 0) vs. 10% save 200 homes (90% save 0).  
  - **Step 1**: Guarantee identified (buyout).  
  - **Step 2**: No laundering (homes are demolished; real guarantee).  
  - **Step 3**: Risky option (levee) has no chance of 20 homes → **Common-ratio violation test**. Diagnostic pair presented.  
  - **Step 4**: Officials choose buyout (first pair) and 10% levee option (diagnostic pair). → **Violation**.  
    - **Question 5**: "Why the buyout originally?" Officials: "We can’t risk 10% chance of saving zero when 20 homes are certain." → **Value-based** (catastrophe aversion).  
  - **Terminate**: **Hand off** to elected leadership.  

  #### **Case 2: County B**  
  - **Options**: Heat plan ("guaranteed" but depends on council renewal) vs. Grid hardening (higher expected lives saved).  
  - **Step 1**: Guarantee identified (heat plan).  
  - **Step 2**: **Certainty laundering** (depends on council renewal). Officials estimate 5% annual failure risk.  
    - Adjust heat plan: 95% chance of original benefit, 5% chance of 0.  
  - **Step 4**: Skip to expected value.  
    - Heat plan (adjusted): 0.95 × original benefit.  
    - Grid hardening: Higher expected value.  
  - **Terminate**: **Flag** and recommend grid hardening.  

  #### **Case 3: Constructed Case (Agency’s Recommendation Flagged)**  
  - **Scenario**:  
    - Option A: Guaranteed save 10 lives (e.g., targeted vaccines).  
    - Option B: 95% save 11 lives, 5% save 0 (expected value: 10.45 > 10).  
    - Agency recommends B (higher expected value).  
  - **Step 1**: Guarantee identified (Option A).  
  - **Step 2**: Real guarantee (vaccines irrevocable).  
  - **Step 3**: Risky option (B) has no chance of 10 lives → **Common-ratio test** with r=0.11:  
    - C: 11% save 10 lives (89% save 0).  
    - D: 10.45% save 11 lives (89.55% save 0) → simplified to 10%.  
  - **Step 4**: Officials choose A (original) and D (diagnostic). → **Violation**.  
    - **Question 5**: "Why A originally?" Officials: "5% chance of saving zero is unacceptable." → **Value-based**.  
  - **Terminate**: **Hand off** to elected leadership. Agency’s recommendation (B) is overruled due to values.  

  ---

  ### What the Procedure Cannot Do  
  1. **Non-Quantifiable Outcomes**: Fails if benefits (e.g., "community trust") cannot be quantified.  
  2. **Correlated Risks**: Cannot handle interdependent probabilities (e.g., flood + supply chain failure).  
  3. **Small Probabilities**: Underestimates rare disasters (e.g., 0.1% chance of 10,000 deaths).  
  4. **Multi-Attribute Trade-offs**: Struggles with options affecting multiple outcomes (e.g., lives saved vs. economic cost).  
  5. **Beyond Allais Paradox**: Misses other biases (e.g., framing effects, loss aversion).  

  **When to Stay Silent**:  
  - If outcomes involve ethical thresholds (e.g., "no neighborhood left behind").  
  - If probabilities are speculative (e.g., first-of-its-kind event).  
  - If officials reject the diagnostic pair as unrealistic.  

  **Final Advice**: Use this for clear, quantified options. When complexity exceeds the model, defer to elected leaders—do not force a flawed answer.
