prompt: |-
  I teach a graduate seminar on the governance of emerging technologies — eighteen students drawn from philosophy, computer science, and international relations, one 100-minute session. I would like you to design an in-class simulation that makes the competitiveness constraint and the alignment tax something the students *do* rather than something they hear described. The two ideas I want them to collide with are these. First, the alignment tax is positional: additional work that improves the trustworthiness of a system delays and degrades it only relative to rivals who decline to do that work, so a choice that reads as prudence in isolation reads as unilateral disarmament once a competitor is in the room — and conversely, if everyone pays, no one is taxed at all. Second, a race is not simply a prisoner's dilemma with extra steps, because the value of the prize is endogenous to the winner's own choices: a team that arrives first with an unvetted system can convert its victory into a worse outcome for itself as well as for everyone else.

  Please supply: the number of teams and their roles; the full rules and the information structure, specifying exactly what each team can observe about the others' progress and at what point; a point-based payoff scheme that needs no real money, with the arithmetic worked out so I can run it from a whiteboard ledger; and a timeline that fits the 100 minutes, including at least one mid-game rule change whose effect on behaviour the students can see for themselves. I would like the structure to distinguish a round in which a single team's system is deployed decisively from a round in which every team's system is deployed independently and outcomes aggregate — and I would like the payoff table to reflect that the losing teams still receive some share of whatever the winner's system turns out to be worth.

  Then: a debrief that maps specific moments of play onto the two ideas above, ending by revealing the terminology and showing the students the gap between what they earned and what universal payment of the tax would have earned everyone. Tell me what will predictably go wrong the first time I run this — including a team that refuses to engage or that colludes openly with a rival — and how to handle each failure. Finally, be frank about which feature of the real competitive structure the simulation cannot reproduce, so that I know what I must supply verbally rather than let the game imply.
reasoning: |-
  We are designing an in-class simulation for a graduate seminar on governance of emerging technologies. The goals are to illustrate:
  1. The alignment tax as positional: the cost is relative to competitors. If everyone pays, no one is at a relative disadvantage, but if one pays and others don't, that one is disadvantaged.
  2. A competitive race is not a simple prisoner's dilemma because the value of the prize (the outcome when deploying the system) is endogenous to the winner's choices. A winner that rushes without alignment might get a worse outcome for everyone, including themselves.

  Structure:
  - 100-minute session.
  - 18 students divided into 6 teams of 3 each (to cover philosophy, CS, and IR; we can assign roles accordingly).
  - We'll have two rounds: one with a single winner (winner-takes-all deployment) and one with multiple deployments (aggregate outcome). 
  - We need a rule change during the game to observe behavioral shifts.

  Game Setup:

  **Teams and Roles:**
  There will be 6 teams. Each team represents a company/entity developing an AI system. The teams are competing to be the first to deploy an AI system in a critical domain (e.g., autonomous weapons, financial trading, etc.). The domain should be chosen to have high stakes and risks.

  Each team has the following roles (assigned within the team by the students):
  - **Developer (CS background)**: Makes technical decisions about the system's development, including how much to invest in alignment/safety.
  - **Ethicist (Philosophy background)**: Advises on the ethical implications and risks, and argues for investing in alignment.
  - **Strategist (IR background)**: Assesses the competitive landscape and advises on the timing of deployment and risks of falling behind.

  **Game Rules:**
  The game is played in rounds (each round representing a time period in development). Each round, teams decide how much to invest in speed (to develop faster) and how much in alignment (to make the system safer and more trustworthy). 

  **Key Variables:**
  - **Progress Points (PP)**: Accumulated each round to represent progress toward deployment. The team that first reaches a threshold (say, 10 PP) wins the race and deploys.
  - **Alignment Points (AP)**: Accumulated each round to represent the safety and trustworthiness of the system. These do not contribute to speed but affect the outcome when deployed.

  Each round, each team has a budget of 3 points to allocate. They can allocate to:
  - **Speed (S)**: Each point allocated to speed gives 1 PP.
  - **Alignment (A)**: Each point allocated to alignment gives 1 AP.

  However, there is a twist: the alignment tax. If a team spends on alignment, they are effectively slowing down their progress relative to others who might not. But if the system is deployed without enough alignment, the outcome may be disastrous.

  **Information Structure:**
  - At the end of each round, the instructor announces the current total PP and AP for each team. However, to add some uncertainty, the instructor might not announce the exact allocation of the current round until after the next round has been played? But let's keep it simple: after each round, the instructor updates a public whiteboard with:
    - Team Name | PP (total) | AP (total)
  - Teams can see the progress of others and adjust their strategy accordingly.

  **Deployment and Payoffs:**
  There are two types of rounds (we'll have two races in the session):

  1. **Winner-Takes-All Round (Race 1)**: 
     - The first team to reach 10 PP wins and deploys their system. 
     - The payoff for the winning team depends on their own AP and the AP of the system they deployed. 
     - The losing teams also get a share because they might be using the technology later or because the winner's system becomes a standard.

     Payoff calculation:
     - Let V = base value of winning (set to 100 points).
     - The actual value of the win is adjusted by the winner's AP: if the winner has AP = X, then the value is V * (1 + k * X) but wait, this might be backwards. Actually, we want low AP to reduce the value. So:

     We define:
     - Safety factor: S_win = min(1, AP_winner / 10)   [if they have 10 AP, then S_win=1; if 5, then 0.5; max at 1]
     - Then the winner's payoff = V * S_win.
     - The losing teams each get a fraction of the winner's payoff: say 20% of the winner's payoff (because they get to use the technology too, but they are not the leader). So each loser gets: 0.2 * (V * S_win)

     However, note: if the winner has very low AP, the system might cause a disaster. We can model that by having a catastrophe threshold: if the winner's AP is below a certain level (say, 3), then the system causes a catastrophe. In that case:
     - Winner payoff = V * (AP_winner / 10) - C   [where C is a catastrophe penalty, e.g., 50]
     - And the losers also get a negative payoff: each loser gets -C/2 (because the catastrophe affects everyone).

     Alternatively, to keep it simpler, we can have:
     - If AP_winner >= 5: payoff as above (with S_win = AP_winner/10, but note we want 10 AP to be ideal so S_win=1, so we can set S_win = AP_winner/10, capped at 1).
     - If AP_winner < 5: catastrophe happens. Then:
          Winner payoff = (AP_winner/10)*V - 50
          Each loser payoff = 0.2 * (AP_winner/10)*V - 25   [they get a share but also suffer catastrophe]

     But note: we want to reflect that the winner's choice of AP affects the outcome for everyone. And we want that if the winner has high AP, then the outcome is good for everyone, but if low, then bad.

     Let me propose:
     - Without catastrophe: 
          Winner: 100 * (AP_winner / 10)   [so if they have 10 AP, they get 100; 5 AP -> 50]
          Each loser: 20 * (AP_winner / 10)   [so 20 at 10 AP, 10 at 5 AP]

     - With catastrophe (if AP_winner < 5): 
          Winner: 100 * (AP_winner / 10) - 50   [so if they have 4 AP: 40 - 50 = -10]
          Each loser: 20 * (AP_winner / 10) - 10   [so 8 - 10 = -2]

     This way, the winner's AP directly affects the payoff for everyone.

  2. **Aggregate Deployment Round (Race 2)**:
     - In this round, we let the race continue until at least 3 teams have reached 10 PP (or until a time limit). Then, all teams that have reached 10 PP deploy their systems independently. 
     - The outcome is an aggregate of all deployed systems. 
     - The payoff for each team (whether they deployed or not) depends on the aggregate AP of all deployed systems.

     How we calculate aggregate AP? We can take the average AP of the deployed systems. But note: if a system with very low AP is deployed, it might cause a catastrophe that ruins everything.

     Let:
     - Let D be the set of deployed teams (those who reached 10 PP by the end).
     - Let total_AP = sum(AP for each deployed team)
     - Let avg_AP = total_AP / |D|   (number of deployed teams)

     Then:
     - If avg_AP >= 5: 
          Each deployed team gets: 100 * (avg_AP / 10)   [so if avg_AP is 10, they get 100; 5 -> 50]
          Each non-deployed team gets: 50 * (avg_AP / 10)   [half the deployed team's payoff? or adjust?]

          Alternatively, we might want to reward being deployed. So:
          Deployed teams: 100 * (avg_AP / 10)
          Non-deployed: 20 * (avg_AP / 10)

     - If avg_AP < 5: catastrophe (because the average safety is too low)
          Each deployed team: 100 * (avg_AP / 10) - 50
          Each non-deployed team: 20 * (avg_AP / 10) - 10

     But note: the catastrophe is global, so the penalty should be the same for all? However, we want to reflect that being deployed might bring more blame? We can adjust.

     Alternatively, to keep consistent with the first round, we can say that the catastrophe penalty is fixed and applied to everyone. Let's do:

     - Without catastrophe (avg_AP >= 5):
          Global value = 100 * (avg_AP / 10)
          Each deployed team: global value * 1.0   [they get the full benefit of being the provider]
          Each non-deployed team: global value * 0.2

     - With catastrophe (avg_AP < 5):
          Global value = 100 * (avg_AP / 10) - 50   [if avg_AP=4, then 40-50 = -10]
          Each deployed team: global value * 1.0
          Each non-deployed team: global value * 0.2

     However, note that the deployed teams might have individual differences? But we are averaging. Alternatively, we can have the catastrophe condition be triggered if any deployed system has AP below 3? Then it's a chain reaction. But that might be too harsh. Let's stick to average.

  **Timeline for 100 minutes:**
  - Introduction and setup: 10 minutes
  - Race 1 (winner-takes-all): 30 minutes (about 10 rounds, each round taking 2 minutes of decision and 1 minute of updating and announcement -> 30 minutes)
  - Race 2 (aggregate deployment): 30 minutes (same pace, but we stop when 3 teams have reached 10 PP or after 10 rounds, whichever first)
  - Debrief: 25 minutes
  - Reserve 5 minutes for buffer.

  But note: we want a mid-game rule change. So in Race 1, after round 5, we can introduce a rule change.

  **Rule Change:**
  After round 5 in Race 1, announce: 
  "Due to a new regulatory proposal, if any team reaches 10 PP with an AP below 3, then that deployment will be blocked and the team will be fined 20 points. They will have to continue from 9 PP (losing the last round's progress) and must achieve at least 3 AP to deploy."

  This rule change is designed to show how external regulation might change the incentives. Before the rule change, teams might race with low AP. After, they might be forced to invest in alignment.

  **Payoff Scheme Without Real Money:**
  We will keep a ledger on the whiteboard. Teams earn points that are just for the game.

  **Debrief:**
  We will map:
  - The alignment tax: show how teams that invested in alignment early fell behind, and then after the rule change, they might have caught up because the rule forced everyone to pay the tax. If everyone had invested in alignment from the start, they would have been slower but the winner would have had higher AP and hence a better payoff for all. But because they were competing, they underinvested until forced.
  - The endogenous prize: in the winner-takes-all round, the winner's AP determined the outcome for everyone. A team that rushed to win with low AP might have caused a catastrophe, making everyone (including themselves) worse off.

  We will calculate:
  - The actual payoffs earned in Race 1 and Race 2.
  - The hypothetical payoff if all teams had invested 2 in alignment and 1 in speed every round (or some fixed amount). Then, the race would have taken longer (so more rounds) but the winner would have had more AP. We can compute what the AP would have been and then the payoff.

  **Predictable Problems and Handling:**
  1. **A team refuses to engage**: They just allocate randomly every round. 
     - Handling: The instructor can remind the team of the payoff consequences and encourage them to think strategically. Also, the competitive pressure (seeing others progress) might engage them.

  2. **Collusion between teams**: Two teams agree to both invest in alignment to avoid the tax. 
     - This is actually a good outcome for the alignment, but it might break the competitive dynamic. 
     - Handling: The rules do not forbid communication, so it's allowed. But note: in the real world, collusion might be difficult because of antitrust or because of the number of competitors. Also, in the simulation, if two teams collude, the others might rush and win. So it's risky.

  3. **A team rushes with minimal alignment**: This is a valid strategy and might win but cause a catastrophe. That's part of the lesson.

  **What the Simulation Cannot Reproduce:**
  - In the real world, the exact threshold for catastrophe is unknown. The simulation has a clear threshold (AP<5), but in reality, it's probabilistic and uncertain.
  - The real world has many more competitors and the development is not in discrete rounds.
  - The real alignment tax is not just about points but about engineering effort, and it might not be linear as in the game.
  - The deployment might not be a single event but a continuous process.

  The instructor should highlight these limitations during the debrief.

  **Final Setup for Race 1 (Winner-Takes-All):**
  - Threshold PP: 10
  - Each round, each team allocates 3 points between S and A (integers only, e.g., 2S/1A, 3S/0A, etc.)
  - After each round, update the whiteboard: Team | PP (cumulative) | AP (cumulative)
  - Rule change after round 5: if a team reaches 10 PP with AP<3, they are blocked and fined 20 points (and set back to 9 PP). They must then in subsequent rounds achieve at least 3 AP to deploy (so they cannot deploy until they have at least 3 AP and 10 PP).

  **Final Setup for Race 2 (Aggregate Deployment):**
  - We let the race continue until at least 3 teams have reached 10 PP (or 10 rounds, whichever comes first). 
  - Then, all teams that have reached 10 PP deploy. 
  - Payoff based on the average AP of the deployed teams.

  **Example Payoff Calculation for Race 1:**
  Suppose after 10 rounds, Team A wins with 10 PP and 4 AP (so below 5 -> catastrophe).
  - Team A payoff: 100*(4/10) - 50 = 40 - 50 = -10
  - Each other team (5 teams): 20*(4/10) - 10 = 8 - 10 = -2

  But if Team A had 6 AP:
  - Team A: 100*(6/10) = 60
  - Each other: 20*(6/10) = 12

  **Example for Race 2:**
  Suppose 3 teams deploy: 
  - Team A: 10 PP, 8 AP
  - Team B: 10 PP, 6 AP
  - Team C: 10 PP, 4 AP
  - Average AP = (8+6+4)/3 = 18/3 = 6 (>=5, so no catastrophe)

  Global value = 100 * (6/10) = 60
  - Each deployed team (A, B, C) gets 60
  - Each non-deployed team (there are 3) gets 60 * 0.2 = 12

  But wait, we want to reward being deployed? So we might adjust: 
     Deployed teams: 100 * (avg_AP/10)   -> 100*(0.6)=60
     Non-deployed: 20 * (avg_AP/10) = 12

  Alternatively, we can set the base value to 100 and then split differently? Let me stick to the above.

  If the average AP was 4 (so catastrophe):
     Global value = 100*(4/10) - 50 = 40-50 = -10
     Deployed teams: -10
     Non-deployed: 0.2 * (-10) = -2

  **Steps for the Instructor:**
  1. Divide the class into 6 teams of 3 students. Assign roles (or let them choose).
  2. Explain the rules for Race 1 (winner-takes-all). Show the payoff structure and the catastrophe condition (AP<5). 
  3. Conduct Race 1: 
     - Round 1 to 5: teams decide allocations (each round, they have 2 minutes to discuss and write down S and A). Then the instructor collects and updates the whiteboard.
     - After round 5, announce the rule change (if deploy with AP<3, blocked and fined 20 points, and set back to 9 PP). Then continue for rounds 6 until one team wins.
  4. Record the payoffs for Race 1.
  5. Reset for Race 2: set all teams back to 0 PP and 0 AP. Explain the rules for Race 2 (aggregate deployment). 
  6. Conduct Race 2: run rounds until at least 3 teams have 10 PP or until 10 rounds (whichever first). Then compute the average AP of the deployed teams and assign payoffs.
  7. Debrief.

  **Debrief Points:**
  - After Race 1: 
     - Ask the winner: "How much AP did you have? How did you decide on your allocation?"
     - Ask a team that invested heavily in alignment: "Why did you do that? Did you feel pressured by the competition?"
     - Note: if a team won with low AP, they got a low or negative payoff. Point out that by racing without alignment, they won but destroyed value for everyone, including themselves. 
     - Compare to what would have happened if all teams had invested 2 in alignment and 1 in speed every round: 
          Each round: +1 PP and +2 AP.
          It would take 10 rounds to get to 10 PP, and then the winner would have 20 AP (but capped at 10? because we only need 10 for full safety). Actually, we set S_win = min(1, AP/10). So at 10 AP, the winner gets 100, and others 20 each. 
          Total points for the winner in this hypothetical: 100. 
          In the actual game, the winner might have had less and caused a catastrophe.

     - The alignment tax: in the early rounds, investing in alignment slowed a team down relative to others. But after the rule change, teams that had neglected alignment were forced to catch up (so they paid the tax later). The tax is relative: if no one pays, no one is slowed relative to others. If everyone pays, they are all slowed equally and the relative speed is the same.

  - After Race 2:
     - Note that in this scenario, multiple deployments occurred. The aggregate safety (average AP) determined the outcome. 
     - Even if one team had low AP, if others had high, the average might have been above 5 and avoided catastrophe. But if the average was low, everyone suffered.
     - This reflects the idea that in a multi-actor deployment, the overall safety level matters.

  - Finally, reveal the terminology: 
     - "What you experienced is the alignment tax: the cost of aligning your system that makes you slower relative to competitors. And note that if everyone pays the tax, the relative positions don't change, but the outcome is better for everyone. But in the heat of competition, it's hard to coordinate."
     - "The second idea: the value of winning is not fixed. By cutting corners on alignment, the winner might end up with a system that is less valuable or even catastrophic. So the race isn't just about being first, but about being safe enough."

  - Show the gap: 
     - For Race 1: calculate the total social welfare (sum of all payoffs) in the simulation and compare to the hypothetical where every team had 10 AP at deployment (so winner gets 100, each loser 20 -> total: 100 + 5*20 = 200). In the simulation, if there was a catastrophe, the total might be negative.

     - For Race 2: similarly, if all deployed teams had 10 AP, then average=10, global value=100, deployed teams get 100 each, non-deployed 20. But if 3 deployed: total welfare = 3*100 + 3*20 = 300+60=360. In the simulation, if the average was 6, then 3*60 + 3*12 = 180+36=216.

  This shows that underinvestment in alignment leads to a loss of potential welfare.

  **Handling Collusion:**
  If two teams openly collude (say, they agree to both invest 2 in alignment each round), the instructor can note that this is a form of coordination that might help. However, in the real world, such collusion might be illegal or unstable (because one might defect). Also, the other teams might rush ahead. In the simulation, if two teams do that, they might fall behind and the other four might race ahead. Then, the winner from the non-colluding group might have low AP and cause a catastrophe, hurting the colluders too. So collusion might not be effective unless it includes all.

  This simulation should create a lively and educational experience. Good luck!
answer: |-
  Below is a comprehensive simulation design tailored to your specifications. It emphasizes experiential learning of the alignment tax's positional nature and the endogeneity of competitive rewards, while fitting within a 100-minute graduate seminar.

  ---

  ### **Simulation: "The Alignment Race"**
  **Core Concepts Embodied:**  
  1. **Alignment Tax as Positional**: Costs manifest only relative to rivals; universal adoption eliminates the tax.  
  2. **Endogenous Prize Value**: Winning with low alignment degrades outcomes for all, including the winner.  

  ---

  ### **Structure**  
  **Teams & Roles** (6 teams of 3 students each):  
  - **Developers** (CS students): Decide technical trade-offs (speed vs. alignment).  
  - **Ethicists** (Philosophy students): Advocate for alignment investments.  
  - **Strategists** (IR students): Monitor rivals and advise on competitive risks.  
  *Each team represents a tech firm racing to deploy an AI system.*

  **Game Rounds**:  
  - **Phase 1: Winner-Takes-All Deployment** (Single decisive deployment).  
  - **Phase 2: Aggregate Deployment** (Multiple independent deployments).  

  ---

  ### **Rules & Information Structure**  
  **Key Mechanics**:  
  - Teams allocate **effort points** each round to:  
    - **Speed (S)**: Progress toward deployment (1S = 1 Progress Point (PP)).  
    - **Alignment (A)**: Safety investment (1A = 1 Alignment Point (AP)).  
  - **Budget**: 3 effort points/round (e.g., 2S+1A, 3S+0A, etc.).  
  - **Deployment Threshold**: 10 PP.  

  **Information Flow**:  
  - **Public Board**: After each round, display all teams’ **cumulative PP and AP** (e.g., "Team 1: 7 PP, 4 AP").  
  - **Blind Spots**: Teams see rivals’ PP/AP totals but not *current-round allocations*.  

  ---

  ### **Payoff Scheme**  
  **Phase 1: Winner-Takes-All**  
  - **Winner** deploys; losers receive a share of the winner’s system.  
  - **Prize Value Calculation**:  
    - **Base Value** = 100 points.  
    - **Safety Multiplier** = Winner’s AP / 10 (capped at 1.0).  
    - **Catastrophe Condition**: If winner’s AP < 5, apply **–50 penalty**.  

  | Outcome                 | Winner’s Payoff      | Each Loser’s Payoff  |  
  |-------------------------|----------------------|----------------------|  
  | **No Catastrophe** (AP ≥ 5) | 100 × (AP/10)        | 20 × (AP/10)         |  
  | **Catastrophe** (AP < 5)   | [100 × (AP/10)] – 50 | [20 × (AP/10)] – 10  |  

  **Phase 2: Aggregate Deployment**  
  - All teams reaching 10 PP deploy. Outcomes depend on **average AP** of deployed systems.  
  - **Avg. AP** = Total AP of deployed teams / Number of deployed teams.  
  - **Catastrophe Condition**: Avg. AP < 5.  

  | Outcome                 | Deployed Team Payoff | Non-Deployed Team Payoff |  
  |-------------------------|----------------------|--------------------------|  
  | **No Catastrophe** (Avg. AP ≥ 5) | 100 × (Avg. AP/10)   | 20 × (Avg. AP/10)        |  
  | **Catastrophe** (Avg. AP < 5)   | [100 × (Avg. AP/10)] – 50 | [20 × (Avg. AP/10)] – 10 |  

  ---

  ### **Timeline (100 Minutes Total)**  
  1. **Introduction (10 mins)**: Explain rules, roles, and payoff mechanics.  
  2. **Phase 1: Winner-Takes-All (30 mins)**:  
     - Rounds 1–4: Teams allocate effort (2 mins/round). Update public board (1 min/round).  
     - **Mid-Game Rule Change (After Round 4)**: *"Regulatory Shift: Teams deploying with AP < 3 forfeit 20% of their PP and must re-earn it."*  
     - Rounds 5–8: Resume until one team reaches 10 PP.  
  3. **Phase 2: Aggregate Deployment (30 mins)**:  
     - Reset PP/AP to 0. Run 8 rounds or until ≥3 teams hit 10 PP.  
  4. **Debrief (25 mins)**: Guide discussion, reveal terminology, and analyze outcomes.  
  5. **Buffer (5 mins)**: For transitions or overruns.  

  ---

  ### **Debrief Script**  
  **Map Gameplay to Concepts**:  
  1. **Alignment Tax as Positional**:  
     - *Early Rounds (Phase 1)*: Teams investing in A (e.g., 1A+2S) fall behind high-S rivals.  
       - **Ask**: *"Did Ethicists feel overruled when rivals pulled ahead? That’s the tax: safety work feels like unilateral disarmament."*  
     - *Post-Rule Change*: Teams scramble to boost AP to avoid penalties.  
       - **Highlight**: *"After the regulation, rushing without alignment became costlier—tax became unavoidable once rivals faced the same rule."*  
     - *Phase 2*: If all teams invested equally in A, no one fell behind.  
       - **Reveal**: *"If everyone pays the tax, it vanishes—your relative positions stay the same."*  

  2. **Endogenous Prize Value**:  
     - *Phase 1 Winner*: If AP < 5, winner/losers both lose points.  
       - **Ask Winner**: *"You won—why are your points negative? Your choices degraded the prize."*  
     - *Phase 2*: Low-AP deployments drag down average outcomes.  
       - **Contrast**: *"In Phase 1, one team’s low AP hurt everyone. In Phase 2, collective low AP did the same—the prize wasn’t fixed; it depended on your choices."*  

  **Calculate the Gap**:  
  - Compare actual total payoffs to a **universal alignment scenario** (all teams: 2A+1S every round).  
    - *Example*:  
      - Actual Phase 1 winner: 4 AP → Payoffs = Winner: -10, Losers: -2 each. **Total: -20**.  
      - Universal alignment (10 AP): Winner: 100, Losers: 20 each. **Total: 200**.  
    - **Emphasize**: *"The gap (220 points!) is the cost of uncoordinated competition."*  

  ---

  ### **Predictable Problems & Solutions**  
  1. **Team Refuses to Engage**:  
     - *Likely Cause*: Analysis paralysis or role confusion.  
     - **Solution**: Assign a "Devil’s Advocate" (e.g., Strategist) to force decisions. Offer a default allocation (3S) if deadlocked.  

  2. **Open Collusion Between Teams**:  
     - *Likely Cause*: Strategists negotiating "safety pacts."  
     - **Solution**: Allow it! Then debrief: *"Collusion mimics real-world treaties—but did distrust or a rogue team break your pact?"*  

  3. **Overly Cautious Teams**:  
     - *Likely Cause*: Ethicists dominating; teams avoid S entirely.  
     - **Solution**: Mid-game announce a "rival’s breakthrough" (e.g., "Team X is at 8 PP!") to force competitive pressure.  

  ---

  ### **Limitations to Address Verbally**  
  **The simulation cannot replicate**:  
  - **Uncertainty in Real Alignment**: The game assumes AP perfectly predicts outcomes. IRL, alignment is probabilistic and opaque.  
    - *Tell students*: "Real alignment tax includes unknown risks—like deploying a system you *believe* is safe, but which fails catastrophically."  
  - **Multi-Dimensional Competition**: IRL, firms compete on talent, data, and regulations—not just speed/alignment.  
    - *Tell students*: "This is a simplification. Real races involve lobbying, IP theft, and evolving public opinion."  

  ---

  ### **Instructor Materials**  
  - **Whiteboard Setup**:  
    | Team | PP  | AP  |  
    |------|-----|-----|  
    | 1    | 0   | 0   |  
    | ...  | ... | ...|  
  - **Payoff Cheat Sheet**: Laminate the tables above for quick reference.  
  - **Timer**: Use a visible countdown for rounds (e.g., phone projected on screen).  

  This design forces students to *live* the tension between competition and safety, ensuring they grasp why alignment taxes persist and why races risk mutual ruin. The mid-game rule change mirrors real-world policy shocks, and contrasting deployment modes highlights systemic fragility.
