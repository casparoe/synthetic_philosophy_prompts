prompt: |-
  My friend Maya has this whole system and I can't figure out what it actually is. We're juniors and we got hooked on this question after our ethics teacher assigned an article arguing that a perfectly moral life might be a worse life to live than an ordinary one, because of everything you'd have to give up to get there — no time for the stuff that isn't about helping anyone. Maya took that and made a spreadsheet of real people she's read about, and she gives each one two separate verdicts: is this a "saint life" (yes/no), and would she want that life for herself (yes/no). So far she's filled in five rows. A hospice nurse who worked like sixty hours a week, never married, gave away most of her paycheck, and said in an interview that she was happier than anybody she knew: saint life yes, would want it yes. A billionaire who gave away nearly his whole fortune to whatever global health charities the numbers said were most cost effective, but who told reporters he never really thought about individual sick people, just totals, and who spent his weekends restoring old motorcycles: saint life no, would want it no. A mom who volunteers at a food bank every Saturday and plays cello seriously in an amateur orchestra and freely admits she'd skip a shift for her kid's recital: saint life no, would want it yes. A guy who dropped out of med school in his third year to work in a refugee camp, who is obviously doing way more good than the cello mom, and who admits some nights he misses being a doctor: saint life yes, would want it no. And a surgeon who does tons of pro bono operations and gives away most of her free time, but who says the reason she went into surgery in the first place is that she loves the craft and the puzzle of it and would still be doing it even if it did nobody any good: saint life "kind of but not a clean yes," would want it yes.

  The new case she won't commit to, and she's been dodging it for like a week: a documentary filmmaker who has spent fifteen years making films about wrongful convictions, and whose films have actually gotten people out of prison. She works constantly, no hobbies, no friends outside her crew. But she cares enormously about the filmmaking as filmmaking — framing, sound, how a scene is shaped — and she's said she resents that the movie she most wants to make is one about her grandmother's garden with no message in it at all. She's also said that if her films stopped getting anybody released she'd probably still make them, just for the sake of other people's stories.

  So: what do you think she says on each of the two verdicts, and why? I want you to work out what rule she's actually running — is it about how much of your time morality eats up, about whether you're oriented toward actual people versus outcomes, about whether you've kept anything you'd refuse to sacrifice, about whether you feel the loss, about how much good actually happens? — and then list the other rules that fit all five of her earlier rows just as well as yours does but that come apart on the filmmaker, and say which one you'd bet on and what tips you toward it. Then tell me the single case I should bring her next that would actually separate those rules instead of just being another ambiguous one. Also, and this is the part I keep bringing up and she keeps changing the subject: I think her billionaire row and her surgeon row are in tension, since both of them keep a big non-moral motive going alongside the helping, but one gets a flat no and the other gets a "kind of." Either show me how one rule can cover both, or admit the spreadsheet isn't consistent and say what she'd have to give up to fix it.
reasoning: |-
  Hmm, the user is describing their friend Maya's system for categorizing lives as "saint lives" and whether she'd want them. There are five existing examples, and they're stuck on a documentary filmmaker case. The user wants me to figure out Maya's underlying rule, identify alternative rules that fit the existing cases but diverge on the filmmaker, suggest a test case to distinguish between rules, and address an apparent inconsistency between the billionaire and surgeon.

  Looking at Maya's existing classifications:

  1. Hospice nurse: Works excessively, no marriage, gives away money, claims happiness. Saint: Yes, Want: Yes
  2. Billionaire: Gives away fortune, motivated by numbers not people, has motorcycle hobby. Saint: No, Want: No
  3. Mom: Volunteers weekly but prioritizes family, plays cello. Saint: No, Want: Yes
  4. Refugee camp worker: Left med school to help, admits missing doctor life. Saint: Yes, Want: No
  5. Surgeon: Does pro bono work, motivated by craft/love of surgery. Saint: "Kind of but not clean yes", Want: Yes

  The filmmaker in question works constantly on wrongful conviction documentaries that free people, cares deeply about filmmaking craft, would make films even if they didn't free people, and resents not making personal projects.

  To crack Maya's rule, I need to find what distinguishes "saint life" from not. The hospice nurse and refugee worker are yeses, while billionaire, mom, and surgeon are nos. The refugee worker is a "want no" while nurse is "want yes."

  Possible rules for "saint life":
  - Total sacrifice: Giving up personal life/hobbies. But surgeon keeps craft and is "kind of," mom keeps cello and is no.
  - Primary motivation: If helping is primary reason. Surgeon does it for craft, billionaire for numbers not people, both not full saints.
  - Relationship to sacrifice: Do they feel the loss? Refugee worker misses being a doctor, which might make him a saint, while nurse doesn't feel loss and is happy, also saint. Not consistent.
  - Keeping a "non-sacrificable" thing: Something they wouldn't give up. Mom has cello and kid, not saint; surgeon has craft, "kind of"; billionaire has motorcycles, no; hospice nurse has no such thing, yes; refugee worker gave up doctor dream, yes. But what about the filmmaker? She has her craft she wouldn't give up.

  The filmmaker cares about craft and would make films even without impact. Similar to surgeon who does surgery for craft. But surgeon is "kind of" saint while billionaire with hobby is flat no. Why? Surgeon's work directly helps, while billionaire's hobby doesn't.

  Perhaps Maya's rule is: "Saint life" requires that morality is the dominant purpose of your life, and any non-moral activities must be instrumental to or inseparable from the moral work. If you have a significant part of life that's neither moral nor necessary for your moral work, not a saint.

  Testing:
  - Hospice nurse: No separate hobbies, all life is care. Saint yes.
  - Billionaire: Motorcycles are separate hobby, not related to charity. Saint no.
  - Mom: Cello is separate, not related to volunteering. Saint no.
  - Refugee worker: No separate hobbies mentioned, all in. Saint yes.
  - Surgeon: Surgery craft is core to her moral work, even if she loves it; it's inseparable. So "kind of" because it's integrated but not purely moral motive.

  For the filmmaker: Her filmmaking craft is core to her moral work (getting people out), but she'd do it even without impact, and she wants to make a non-moral film. So craft is separable from morality. She has a part that's non-moral (art for art's sake) and resents not indulging it. By this rule, not a saint life.

  Would she want it? Based on previous "want" verdicts: Maya wants lives where the person has some fulfillment beyond duty. Nurse is happy, so yes; billionaire seems empty, no; mom has cello and family, yes; refugee worker misses his past, no; surgeon loves her craft, yes. So she wants lives with personal joy or passion.

  Filmmaker has passion for craft but resents the constraint; she's conflicted. Ambiguous, but leaning no because of the resentment.

  Alternative rules that fit the five but diverge on filmmaker.

  Alt Rule 1: "Saint life" if helping is the sole ultimate goal. Then hospice nurse: yes, helping is everything. Billionaire: no, has hobby. Mom: no, has cello. Refugee worker: yes, gave up dream. Surgeon: no, loves craft for itself. Filmmaker: would make films without impact, so helping not sole goal? But she is helping, so conflict.

  Alt Rule 2: Based on whether they care about individuals vs. abstract. Hospice nurse: individuals, yes. Billionaire: abstract numbers, no. Mom: helps individuals but not full-time, no. Refugee worker: individuals, yes. Surgeon: individuals through surgery, but motive is craft. Filmmaker: cares about stories and craft, not just individuals? Ambiguous.

  Alt Rule 3: Amount of good done. Refugee worker does more good than mom, saint yes vs no. But surgeon does good, "kind of," billionaire does huge good but no. Not consistent.

  Alt Rule 4: Whether they've sacrificed something significant and feel it. Refugee worker sacrificed and feels it, saint yes. Nurse sacrificed but doesn't feel loss, still saint yes. Billionaire didn't sacrifice much, no. Mom no big sacrifice, no. Surgeon no mention of sacrifice, "kind of." Filmmaker sacrificed personal projects, feels resentment, so saint yes? But by my rule, no.

  Test case: Bring someone who has a hobby directly tied to their moral work. Like a doctor who plays music to relax but also uses it in therapy. If saint life no, then rule is strict separation; if yes, then integration is allowed.

  For inconsistency: Billionaire has hobby, not related, saint no. Surgeon has craft, related to work, "kind of." So consistent if rule is about integration. Surgeon's craft is part of the helping, so not a separate non-moral thing. Billionaire's motorcycles are separate. Filmmaker's craft is part of moral work but she sees it as separable, and has a non-moral desire, so not saint.

  Final verdicts for filmmaker: Saint life no, would want it no (because of resentment, no joy).
answer: |-
  Based on Maya's existing verdicts and the patterns in her system, I'll break this down step by step: first, I'll infer her likely underlying rule for "saint life" and "would want it," then apply it to the filmmaker. Next, I'll list alternative rules that fit her five cases but conflict on the filmmaker, explain which rule I'd bet on and why, and suggest a test case to distinguish them. Finally, I'll address the tension between the billionaire and surgeon rows.

  ### Step 1: Decoding Maya's Rule for "Saint Life" and "Would Want It"
  After analyzing the five cases, Maya's system appears to hinge on **whether morality is the overriding, non-negotiable purpose of a person's life, such that all significant activities are either directly moral or functionally inseparable from it**. Crucially, "saint life" isn't about the amount of good done, time sacrificed, or feelings of loss—it's about whether morality has fully colonized the person's identity and choices. If a person maintains a "protected sphere" of non-moral pursuits or motives that they wouldn't sacrifice for greater good, it disqualifies them from sainthood. 

  - **Key elements of the rule**:
    - **"Saint life" (yes/no)**: Requires that morality is the *dominant, organizing principle* of life. Any hobbies, passions, or personal joys must be either (a) directly instrumental to moral work (e.g., a surgeon's craft enabling pro bono operations) or (b) so minimal that they don't constitute a separate "life domain." If there's a significant non-moral commitment that exists for its own sake (like the billionaire's motorcycles or the mom's cello), it's a "no." The "kind of" verdict for the surgeon suggests this is a spectrum—her craft is morally productive but not purely motivated, so it's borderline.
    - **"Would want it" (yes/no)**: Depends on whether the life includes *sustained personal fulfillment* beyond duty. Maya wants lives where joy, passion, or meaning isn't solely derived from sacrifice (e.g., she rejects the refugee worker's life because he "misses being a doctor," implying unfulfilled longing). Happiness or intrinsic enjoyment (like the surgeon's love of her craft) makes a life desirable, even if it's not saintly.

  - **How the rule fits all five cases**:
    - **Hospice nurse**: Saint yes (no hobbies or personal life; everything is moral work), want yes (she's happy and fulfilled).
    - **Billionaire**: Saint no (motorcycles are a separate, non-moral hobby; morality isn't overriding), want no (no mentioned joy beyond cold calculation).
    - **Mom**: Saint no (cello and family are protected non-moral spheres; volunteering is part-time), want yes (she has joy in music and family).
    - **Refugee worker**: Saint yes (no hobbies; life fully devoted to moral cause), want no (he feels the loss of his doctor dream, so unfulfilled).
    - **Surgeon**: Saint "kind of but not clean yes" (her craft is morally productive but motivated non-morally; it's inseparable from her work but not purely for good), want yes (she loves her craft, so it's fulfilling).

  ### Step 2: Applying the Rule to the Documentary Filmmaker
  - **Verdicts for the filmmaker**: 
    - **Saint life: No**. She maintains a "protected sphere" of non-moral commitment: she cares deeply about filmmaking as an art form (framing, sound, etc.) for its own sake, would make films even if they didn't free people, and resents not making her non-moral garden film. This separates her motives from pure morality—art isn't just a tool for justice but an end in itself. Like the billionaire's motorcycles, this is a significant non-moral domain, disqualifying sainthood. (It's less integrated than the surgeon's craft, which is directly tied to saving lives.)
    
  - **Would want it: No**. She works constantly with "no hobbies, no friends," and expresses resentment about her unrealized artistic desires. This suggests a lack of personal fulfillment; she's conflicted and yearning, similar to the refugee worker who misses being a doctor. Maya would likely see this as joyless and unsustainable, making it undesirable despite the moral impact.

  ### Step 3: Alternative Rules That Fit the Five Cases but Diverge on the Filmmaker
  Other rules can explain Maya's five verdicts just as well, but they split on the filmmaker. Here are three plausible alternatives, with how they handle the filmmaker:

  1. **Rule A: "Saint life" requires morality to be the sole ultimate motive (no mixed motives).**
     - Fits the five: Hospice nurse (pure motive), billionaire (motivated by numbers, not morality), mom (mixed motives with family/cello), refugee worker (pure motive), surgeon (mixed motives—craft love makes it "kind of").
     - Filmmaker divergence: Saint no (she admits she'd make films for the stories even without impact, so not purely moral). But this rule might make the surgeon a clearer "no," unlike Maya's "kind of," so it's less aligned.

  2. **Rule B: "Saint life" requires the absence of any activity or commitment that isn't optimizable for good (no "wasted" time).**
     - Fits the five: Hospice nurse (no non-optimizable time), billionaire (motorcycles are "wasted"), mom (cello isn't optimizable for good), refugee worker (all time optimized), surgeon (craft is optimizable for surgery, so borderline).
     - Filmmaker divergence: Saint no (her filmmaking craft isn't fully optimizable—she'd prioritize art over impact if forced to choose, and the garden film is "wasted" potential). But this might make the mom a "saint" if her volunteering is effective, which Maya denies.

  3. **Rule C: "Saint life" depends on whether the person feels or acknowledges sacrifice (saints embrace loss).**
     - Fits the five: Hospice nurse (no felt loss, saint yes), billionaire (no sacrifice felt, saint no), mom (no major sacrifice, saint no), refugee worker (feels loss, saint yes), surgeon (no mentioned sacrifice, "kind of").
     - Filmmaker divergence: Saint yes (she resents the sacrifice of not making her garden film, so she feels the loss). But Maya's hospice nurse is a saint without felt loss, so this rule is shaky.

  ### Step 4: Which Rule I'd Bet On and Why
  - **I'd bet on the original rule (morality as overriding purpose)**. It best explains the nuances in Maya's system:
    - It cleanly handles the surgeon's "kind of" verdict: her craft is *functionally* moral (it enables good) but not *motivationally* pure, creating ambiguity. Rule A (sole motive) struggles with this, as the surgeon would be a flat "no."
    - It accounts for why the billionaire is a hard "no" while the surgeon is borderline: the billionaire's hobby is decoupled from morality, while the surgeon's passion is entangled with it.
    - It aligns with Maya's focus on life structure over outcomes (e.g., the refugee worker does more good than the mom but isn't desirable due to lack of fulfillment).
    - For the filmmaker, it explains the "no" for sainthood (her art isn't subordinated to morality) and "no" for wanting it (resentment implies no joy).
  - **What tips me toward this rule**: The mom and billionaire cases show Maya cares about *compartmentalization*—having a life domain "outside" morality. The filmmaker's resentment about her garden film is a glaring example of this. Also, the surgeon's verdict suggests integration matters: when non-moral elements serve moral ends, it's less disqualifying.

  ### Step 5: Test Case to Separate the Rules
  To distinguish between the original rule and alternatives, propose a case where:
  - **A person has a non-moral passion that is directly necessary for their moral work, but they engage in it for its own sake**.
  - **Example**: A climate scientist who does high-impact research (e.g., developing flood-resistant crops) but is obsessed with the technical challenge and admits they'd do the same work even if it had no real-world benefit. They have no hobbies outside the lab and derive deep joy from the intellectual puzzle.
  - **How it separates rules**:
    - Original rule: Saint no (passion is non-moral and separable from morality; they'd do it without impact).
    - Rule A (sole motive): Saint no (mixed motives—they care about the puzzle).
    - Rule B (no wasted time): Saint yes (all time is "optimizable" for good, even if motivated differently).
    - Rule C (felt sacrifice): Saint no (no sacrifice felt; they're joyful).
    - If Maya says saint "no," it supports the original rule or Rule A. If she says "yes," it supports Rule B. Her verdict on "would want it" (likely yes, due to joy) could add clarity.

  ### Addressing the Billionaire vs. Surgeon Tension
  You're right that these rows seem inconsistent at first glance—both have non-moral motives (motorcycles for the billionaire, craft-love for the surgeon), but one is a hard "no" for sainthood while the other is "kind of." However, **one rule can cover both without inconsistency**:
  - **The key difference is integration**: The billionaire's motorcycles are *separate* from his moral work (charity is about money, not bikes), so they represent a distinct life domain outside morality. For the surgeon, her craft is *inseparable* from her moral work—she couldn't do pro bono surgeries without loving the craft, and it directly enables good. This makes her a borderline case ("kind of"), while the billionaire's decoupled hobby is a clear violation.
    
  - **Why this doesn't require giving up anything**: Maya's system allows for a spectrum where non-moral elements can be "sanitized" if they're instrumental to moral outcomes. The surgeon's craft is morally productive; the billionaire's bikes aren't. The filmmaker is like the billionaire—her art isn't just a tool but a separate end—so she gets a "no."

  - **If Maya insists on consistency, she'd need to**: Demote the surgeon to a flat "no" (making both cases clear rejects) or add a "partial saint" category. But her "kind of" verdict suggests she intuitively recognizes this distinction, so the spreadsheet is consistent as-is.

  ### Summary for the Filmmaker
  - **Maya's likely verdicts**: Saint life **no** (her artistic passion is a non-moral domain she protects), would want it **no** (she's unfulfilled and resentful).  
  - **Why**: Her rule prioritizes whether morality consumes all meaningful aspects of life, and the filmmaker's craft is cherished for itself, not just for justice.  
  - **Test case to probe deeper**: The climate scientist described above—it forces a choice between rules based on functional vs. motivational purity.  

  Maya's system is fascinating—it's not about utilitarianism or raw impact, but about moral identity and integration. If you bring her that test case, it might finally pin down whether she cares about *why* people act or just *how* their lives are structured. And hey, if she keeps dodging, maybe tease her about needing a "meta-spreadsheet" for her rules!
