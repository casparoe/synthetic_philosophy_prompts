  The dynamical systems vocabulary request is tricky. We can use terms like perturbation size and recovery time, but must flag limitations: state spaces for societies are poorly defined, and basins imply structural determinism. The level-relativity point is crucial - I explicitly separate micro-contingency (who/when) from macro-outcome contingency.

  For the three historical cruxes (Mongol withdrawal, July 1914, FDR assassination attempt), I structure each with:
  - Both sides' interpretations of the event
  - Specific predictions
  - What evidence would test them
