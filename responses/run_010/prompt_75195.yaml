  The Mongol case particularly shows the approach: the contingentist predicts withdrawal timing changes European history, while the structuralist sees no long-term impact. The structuralist position risks unfalsifiability when claiming "same outcome regardless" - I note this explicitly as requested.

  Throughout, I maintain the workshop's practical focus by making predictions testable and disagreements actionable. The document's value lies in forcing both sides to specify what evidence could change their minds.
answer: |-
  Here is a draft adversarial-collaboration statement addressing your requirements, designed for signature by both historians while preserving the edge of their disagreement and structuring testable cruxes.

  ---

  **Joint Statement on Historical Contingency and Causation: A Framework for Adversarial Collaboration**

  **Signed:** [Diplomatic/Military Historian - Contingentist], [Cliometric Economic Historian - Structuralist]

  **Date:** [Date of Workshop]

  **Section 1: Agreed Claims (Sources, Counterfactuals, and Common Ground)**

  1.  **Sources & Evidence:** Historical sources are inherently fragmentary, perspectival, and require critical interpretation. Neither narrative plausibility nor statistical correlation alone constitutes definitive proof of causation. Both approaches require rigorous source criticism and explicit reasoning.
  2.  **Counterfactuals as Tools:** Counterfactual reasoning is a necessary heuristic tool for historical analysis. It is not a claim about an observable alternate reality but a method for probing causal relationships by asking "what if?" to expose dependencies and test assumptions about necessary/sufficient conditions.
  3.  **Multifactorial Reality:** Historical outcomes result from the interaction of numerous factors, including individual agency, institutional structures, material conditions, environmental constraints, and unforeseen events. Neither position denies the existence or relevance of the factors emphasized by the other.
  4.  **Constraints on Agency:** Even the most powerful individuals operate within constraints (institutional, cultural, material, informational). The Contingentist agrees these constraints shape the range of possible actions and outcomes.
  5.  **Significance of Small Events:** Small events or decisions *can* have significant consequences, particularly regarding timing, specific pathways, and the identities of key actors ("who, when, by what route"). The Structuralist agrees these micro-level contingencies are real and observable.
  6.  **Role of Structure:** Deep structural factors (geography, demography, institutional path dependencies, economic systems, technological capabilities) create powerful boundary conditions and long-term pressures shaping the feasible set of historical trajectories. The Contingentist agrees these factors create resilience and impose limits.
  7.  **Hindsight & Narrative:** Historians are susceptible to hindsight bias and the narrative imperative to craft coherent stories. Both approaches must actively guard against these tendencies. Retrospective labeling of events as "pivotal" or "inevitable" requires justification, not assumption.

  **Section 2: Residual Disagreements - Worded for Acceptance by Each Side**

  | Core Disagreement                      | Contingentist's Preferred Wording                                                                 | Structuralist's Preferred Wording                                                                                                                               |
  | :------------------------------------- | :------------------------------------------------------------------------------------------------ | :-------------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | **Primary Cause of Major Trajectory Shifts** | Major historical trajectories *can* be fundamentally altered by specific, contingent events or decisions occurring at critical junctures, changing the long-term macro-outcome. | Major historical trajectories are shaped primarily by deep structural parameters; contingent events affect timing, local pathways, and surface features but rarely alter the fundamental macro-outcome dictated by structure. |
  | **Nature of Historical Causation**     | Causation in history involves identifiable, non-redundant pivot points where individual agency or chance events demonstrably change the course of events at both micro and macro levels. | Causation in history is primarily systemic and probabilistic; macro-outcomes are robustly determined by structural preconditions, rendering most specific micro-contingencies redundant for explaining those macro-outcomes. |
  | **Scope of Contingency**               | Contingency operates powerfully not only on the micro-level ("who, when, route") but also on the macro-level ("what large-scale outcome"), especially during periods of high instability or crisis. | Meaningful contingency is largely confined to the micro-level ("who, when, route"); macro-level outcomes exhibit high path-dependence and resilience to micro-level perturbations due to structural constraints. |

  **Section 3: Shared Dynamical Vocabulary & Its Limits**

  Both sides agree to explore the utility of a dynamical systems vocabulary (perturbations, basins of attraction, recovery time, state space) as a *shared framework for discussion*, while acknowledging significant limitations:

  1.  **Agreed Usage:**
      *   **Perturbation:** A discrete event or decision causing deviation from a prior trajectory.
      *   **Basin of Attraction:** A set of system states towards which the system tends to evolve, given underlying structural parameters (e.g., stable political regime, economic system).
      *   **Recovery Time:** Time taken for the system to return towards its prior trajectory or settle into a new stable state after a perturbation.
      *   **State Space:** The theoretical multidimensional space defining all possible configurations of the relevant historical system (e.g., political power, economic output, social structure).

  2.  **Points of Agreement within this Framework:**
      *   The *size* of a perturbation relative to the system's stability matters.
      *   Perturbations exceeding a certain threshold are needed to push a system into a *different* basin of attraction.
      *   Systems can have varying degrees of resilience (speed of recovery) to perturbations.

  3.  **Limitations and Points of Contention within the Framework:**
      *   **Defining the State Space:** Is it possible to define a stable, well-defined "state space" for complex societies over long periods? Parameters shift, interactions are non-linear, and the relevant dimensions are contested. *(Contingentist emphasizes this instability; Structuralist believes key structural parameters define a stable-enough space for analysis).*
      *   **Defining the Basin:** Defining the "basin of attraction" inherently privileges the Structuralist perspective by assuming a pre-existing, structurally determined set of stable outcomes. Using the term may concede that the outcome *space* is fixed, only the *path* varies. *(Contingentist flags this as potentially conceding half the argument; Structuralist sees it as accurately reflecting reality).*
      *   **Thresholds & Resilience:** Quantifying the perturbation threshold needed to change basins or the system's resilience is extremely difficult or impossible with historical data. Claims about these are often post-hoc rationalizations.
      *   **Feedback Loops:** The framework struggles to fully incorporate how perturbations can *alter* the underlying structural parameters or system dynamics themselves (e.g., institutions adapting, norms changing), potentially redrawing the basins. *(Contingentist emphasizes this potential for transformation; Structuralist sees structural parameters as highly persistent).*
      *   **Level Relativity (Explicit):** A perturbation might push the system into a *new micro-path* (different actors, timing, sequence of battles) within the *same macro-basin* (e.g., feudal Europe persists). Or, it might push it into a *new macro-basin* (e.g., transition to centralized monarchy). **The core disagreement centers on how often perturbations of the *scale actually observed in history* can cause transitions between genuinely different *macro-basins* defined by fundamental socio-political-economic structures.**

  **Section 4: Level Relativity - Disentangling the Dispute**

  *   **Agreement:** A significant portion of the apparent disagreement stems from focusing on different levels of analysis.
  *   **Contingentist Focus:** Emphasizes contingency at **all levels**, particularly arguing that micro-contingencies (specific decisions, events) can cascade or occur at critical junctures to produce **macro-contingency** (fundamentally different large-scale outcomes decades/centuries later).
  *   **Structuralist Focus:** Primarily acknowledges contingency at the **micro-level** ("who, when, by what route"). Argues that deep structures create **macro-level inevitability/resilience**, making radically different large-scale outcomes highly improbable over the long run, even given micro-contingencies. The observed macro-outcome was overwhelmingly likely within the feasible set defined by structure.
  *   **Merely Verbal?** Partly. The dispute over whether "contingency" applies *only* to micro-details or *also* to macro-outcomes is definitional. However, the substantive disagreement remains: **Can plausible, historically attested micro-contingencies (like the three cases below) demonstrably lead to *different macro-basins* (e.g., no Habsburg dominance, no WWI, no New Deal)?** The Structuralist says "virtually never"; the Contingentist says "yes, at critical junctures."

  **Section 5: Cruxes - Test Cases, Predictions, and Falsifiability**

  **Crux Question 1: Can a specific, plausible contingent event demonstrably alter the *long-term macro-trajectory* (change the basin of attraction) defined by structural factors?**

  **Case A: Mongol Withdrawal from Hungary (1242)**
  *   **Contingentist Interpretation:** Ögedei's death was the decisive contingent event forcing Batu's immediate withdrawal, preventing the potential establishment of a permanent Mongol power base in Central Europe, altering European political development (e.g., potentially preventing or drastically altering the rise of centralized kingdoms like Hungary/Poland, weakening HRE influence eastwards).
  *   **Structuralist Interpretation:** The Mongol army had reached its logistical limits (depleted pastures, inability to take stone fortifications, attrition). Withdrawal was imminent; Ögedei's death provided a politically convenient timing but was not the *cause* of the strategic decision. Long-term European state formation trajectories (driven by agrarian productivity, climate, inheritance patterns, Church power) were unaffected.
  *   **Shared Crux Evidence:** Detailed analysis of Mongol military capacity/casualties late 1241; pasture conditions/fodder availability in Hungary winter 1241-42; Mongol siege capabilities & record against stone forts; Batu's known political ambitions/independence; speed and nature of withdrawal; subsequent European fortification/state development patterns compared to regions not raided.
  *   **Contingentist Prediction:** Evidence will show army was *operationally capable* of wintering/continuing campaigns in 1242 if not for the *political imperative* of the succession. Long-term divergence in Central European state structures/power compared to a plausible "Mongol stay" counterfactual would be significant.
  *   **Structuralist Prediction:** Evidence will show severe logistical strain and strategic deadlock *before* news of Ögedei's death arrived. European state formation patterns post-1242 align closely with pre-1242 structural trajectories, showing no significant deviation attributable solely to the *timing* of Mongol withdrawal.
  *   **Falsifiability:**
      *   *Contingentist:* Strong evidence Batu *planned* withdrawal before Ögedei's death news OR evidence that permanent Mongol settlement in Hungary was logistically/politically infeasible regardless of events in Karakorum.
      *   *Structuralist:* Clear evidence Batu had concrete plans/means for sustained occupation *and* that Central European development post-1242 shows a unique, sustained deviation from comparable regions that cannot be explained by pre-existing structural differences or subsequent contingencies.

  **Case B: July Crisis (1914)**
  *   **Contingentist Interpretation:** The specific sequence of decisions, miscommunications, and personalities in July 1914 was the critical contingent element that loaded the system, turning a chronic crisis into a general war *at that specific time*. Different decisions (e.g., Austrian restraint, German "Halt in Belgrade" proposal succeeding, Russian partial mobilization) could have prevented *that* war, potentially altering the entire 20th century.
  *   **Structuralist Interpretation:** The alliance system, rigid mobilization plans, arms races, colonial tensions, and rising nationalism created such high systemic pressure that a major European war was overwhelmingly probable within a short timeframe (e.g., 1910-1920). The July crisis was one potential trigger; if not July 1914, another crisis (Balkans, Colonial, Naval) would likely have ignited it soon after with similar participants and scale.
  *   **Shared Crux Evidence:** Analysis of pre-1914 crisis management (e.g., Balkan Wars, Agadir, Bosnian Annexation); documentary evidence of leadership perceptions of inevitability/avoidability in 1914; robustness/stability of alliance structures; flexibility of mobilization plans; intensity/frequency of pre-war crises; comparative analysis of other potential flashpoints 1910-1915.
  *   **Contingentist Prediction:** Evidence will show leaders perceived war as *avoidable* in July 1914 through specific alternative choices, and that the *specific sequence* created a unique, unreproducible cascade. The "next crisis" would not necessarily have led to an identical general war.
  *   **Structuralist Prediction:** Evidence will show leaders widely perceived major war as inevitable within years. Pre-war crises were escalating in severity. Mobilization plans were too rigid and alliances too binding to allow containment of *any* major crisis post-1912. The "next crisis" would likely have produced a conflict of similar scale and participants within 1-3 years.
  *   **Falsifiability:**
      *   *Contingentist:* Clear evidence that key decision-makers (e.g., Bethmann, Grey, Sazonov, Berchtold) believed war was genuinely inevitable *regardless of their July 1914 actions* OR compelling evidence of a specific, equally potent crisis mechanism ready to trigger war within months if July 1914 had fizzled.
      *   *Structuralist:* Clear evidence that the alliance system was fracturing (e.g., Anglo-German détente accelerating, Austro-German rift, Franco-Russian cooling) OR mobilization plans were becoming more flexible *before* 1914, making containment of major crises demonstrably more feasible by 1915/16.

  **Case C: Miami Assassination Attempt (Feb 1933)**
  *   **Contingentist Interpretation:** FDR's survival was highly contingent (bullets missed). His specific leadership, personality, relationships, and political skills were *non-redundant* for the formation, nature, and success of the New Deal coalition and policies. A President Garner or other Democrat would have pursued significantly different policies, potentially failing to achieve similar economic/social stabilization or creating a fundamentally different political alignment, altering the 20th-century US trajectory.
  *   **Structuralist Interpretation:** The Depression's depth, popular unrest, Democratic congressional majorities, and the collapse of Hoover's legitimacy created overwhelming structural pressure for massive federal intervention and realignment ("realignment of 1932"). The core elements of the New Deal coalition (urban workers, ethnic minorities, Southern whites, progressives) and its broad policy direction (relief, reform, moderate regulation) were highly probable regardless of the specific President, shaped by institutional possibilities and interest group pressures.
  *   **Shared Crux Evidence:** Analysis of FDR's unique pre-presidential profile/network vs. alternatives (Garner, Smith); platform/policy debates within the Democratic Party 1932; strength of competing ideologies (socialism, far-right, Hooverism); institutional constraints on presidency/Congress; evidence of contingency in FDR's *specific* decisions and their impact vs. predictable party/institutional responses to crisis.
  *   **Contingentist Prediction:** Evidence will show FDR's personal style, specific choices (e.g., Bank Holiday, Fireside Chats, specific cabinet/advisor selections, handling of SCOTUS), and relationships were crucial to *specific* New Deal programs and the *cohesion* of the coalition, which would have fractured or pursued a less effective/radical path under a different leader.
  *   **Structuralist Prediction:** Evidence will show strong consensus within the Democratic Party for major intervention. Key early New Deal legislation had broad support. Alternative leaders would have been channeled by Congress, advisors, and crisis pressures towards similar core policies (bank stabilization, CCC-style relief, agricultural support, basic securities regulation). The core social coalition would have formed around *any* Democrat enacting significant relief/reform.
  *   **Falsifiability:**
      *   *Contingentist:* Evidence that FDR's key, distinctive policy innovations were widely championed by other powerful Democrats *before* March 1933 OR evidence that FDR was largely constrained by advisors/Congress, merely ratifying predetermined plans.
      *   *Structuralist:* Evidence that viable alternatives (like Garner) actively opposed core New Deal concepts *and* had the political capital to block them within the party *and* that no other figure with FDR's program could have gained the nomination. *(Note: Structuralist position risks unfalsifiability by arguing "someone else would have done something similar enough" - the test is whether FDR's specific actions were demonstrably non-redundant for the specific outcome observed).*

  **Finding on Falsifiability:** The Structuralist position, particularly its core claim that macro-outcomes are robust to micro-contingencies, poses significant challenges for falsification. It often relies on the argument that "some similar outcome would have occurred via a different path/actor." While testable in specific cases (as above), proving a universal *negative* (that no plausible micro-contingency *could* have changed the macro-outcome) is inherently difficult. The burden lies on the Structuralist to demonstrate the *robustness* of the outcome to plausible alternative scenarios in specific instances, and on the Contingentist to demonstrate the *non-redundancy* and *macro-impact* of specific contingent events. This document commits both signatories to engage with these burdens within the framework of the test cases above.

  ---
  **Notes for the Organizer:**
  *   **Tone:** The wording aims for precision and mutual respect while preserving the distinctiveness of each position. Phrases like "rarely alter," "non-redundant," "robustly determined," and "feasible set" are chosen for their technical resonance and acceptability to each side.
  *   **Dynamical Vocabulary:** The section explicitly names the limitations and potential biases (like basin definition favoring structuralism) introduced by borrowing this vocabulary. It doesn't hide the tension.
  *   **Level Relativity:** The explicit separation of micro/macro levels and the clarification of the "merely verbal" element (the definition of "contingency") is central.
  *   **Cruxes:** Each case forces specific, contrasting predictions and outlines what evidence *each side* would accept as challenging their view. Highlighting the Structuralist's potential falsifiability challenge is crucial.
  *   **Next Steps:** This document sets the stage for the workshop. Sessions could delve into each crux case, analyze evidence using the shared framework, and evaluate the predictions made. It forces pre-registration of interpretations before rehashing old arguments. Good luck!
