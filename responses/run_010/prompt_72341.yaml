  **What the procedure cannot do:**
  - It does not handle state actors or ongoing intrusions (which are covered by standard IR).
  - It might not handle cases where the harm is ongoing and the payment is to stop it (that's standard extortion, caught in Step 0.1).
  - It relies on the analyst's ability to quickly verify the rule and the predictor's credibility, which may be limited.
  - The step on determining the branch (Step 3) is inherently uncertain and requires judgment. The procedure escalates those cases.
  - It does not address the possibility that the vulnerability is real and must be fixed regardless of payment. That should be part of standard IR, but the procedure should remind the analyst to initiate vulnerability assessment. We didn't include that.

  **Revision after first ten uses:**
  - Add a step to assess the vulnerability independently (if possible) during the 90 minutes.
  - Refine the branch determination (Step 3) with better heuristics or data sources.
  - Track the outcomes of escalations to build a knowledge base.

  **Final Procedure with Numbered Steps and Outputs**

  **Predictive Extortion Decision Procedure**

  **0. Initial Triage**
     0.1. **Question**: Does the message threaten future harm (e.g., "pay or we will attack")?  
          - **Yes**: Not predictive. Initiate standard incident response for extortion. **Output: Do not engage (follow IR). Stop.**
          - **No**: Proceed to 0.2.

     0.2. **Question**: Does the message claim that harm (e.g., exploitation) or benefit (e.g., non-exploitation) has already occurred, based on a prediction made in the past about how the company would respond to the message?  
          - **Yes**: Proceed to 0.3.  
          - **No**: Not predictive. Initiate standard incident response. **Output: Do not engage. Stop.**

     0.3. **Question**: Does the message contain any non-public information that suggests the sender had unauthorized access (e.g., internal ticket numbers, non-public code, internal document references)?  
          - **Yes**: Likely surveillance. **Output: Do not engage. Initiate incident response for potential breach. Stop.**  
          - **No**: Proceed to Step 1.

  **1. Verify Prediction Structure**
     1.1. **Question**: Does the message clearly state a rule that defines why the company received the message and what that implies about the state of the world (i.e., whether harm has occurred or been averted)?  
          - **Yes**: Proceed to 1.2.  
          - **No**: Not in predictive form. **Output: Do not engage. Stop.**

     1.2. **Question**: Is the stated rule verifiable and consistent with known information (e.g., from semi-public forums, the predictor's public site)?  
          - **Yes, verifiable and consistent**: Proceed to Step 2.  
          - **No, or unverifiable, or inconsistent**: Proceed to Step 2 but note the uncertainty.  
          - **Clearly false or fabricated**: **Output: Treat as scam. Do not engage. Stop.**

  **2. Check Public Commitments**
     2.1. **Question**: What was the company's public policy (from the commitments page) on the date the prediction was made (as stated in the message or inferred) regarding payment for vulnerabilities or similar demands?  
          - **Lookup result**: 
            - "Never pay for undisclosed vulnerabilities" -> Policy: Prohibited.
            - "Pay via bug bounty" -> Policy: Bounty.
            - No relevant policy -> Policy: None.
          - Proceed to Step 3.

  **3. Determine the Likely State of the World (Branch)**
     3.1. **Question**: According to the rule, what are the possible states (branches) given the company received the message?  
          - **Example**: Branch 1: Harm occurred. Branch 2: Harm averted. [Write down]

     3.2. **Question**: In which branches is the harm (e.g., vulnerability being exploited) present?  
          - **Example**: Only in Branch 1. [Write down]

     3.3. **Question**: Is there any independent evidence about which branch we are in? (e.g., signs of exploitation, vulnerability assessment, forum reports)  
          - **Evidence of harm**: e.g., exploitation detected -> Branch: Harm occurred.
          - **Evidence of no harm**: e.g., vulnerability not found or not exploitable -> Branch: Harm averted.
          - **No evidence or conflicting**: Branch: Uncertain.
          - **Judgment Call**: The analyst uses available information to assign a branch (if possible) or marks uncertain.

     3.4. **Question**: If the branch is uncertain, what is the estimated probability of harm? (High, Medium, Low)  
          - **Judgment Call**: Based on the rule and evidence. If uncertain, mark Medium.

  **4. Decision Matrix**
     4.1. **Question**: Based on the public commitment, are we obligated to pay?  
          - **Policy: Prohibited** -> Not obligated. Proceed to 4.2.  
          - **Policy: Bounty** and the demand is within bounty terms -> Obligated. Proceed to 5.1.  
          - **Policy: Bounty** but demand outside terms -> Not obligated. Proceed to 4.2.  
          - **Policy: None** -> Not obligated. Proceed to 4.2.

     4.2. **Question**: What is the expected cost of harm?  
          - If branch is "Harm occurred": cost = full harm (e.g., $250k) plus disclosure costs.  
          - If branch is "Harm averted": cost = 0.  
          - If branch is uncertain: cost = (probability of harm) * (full harm).  
          - **Judgment Call**: Estimate.

     4.3. **Question**: What is the net benefit of paying?  
          - Benefit: 
            - If harm has not occurred and paying might prevent future harm (reputational effect), or 
            - If harm has occurred and paying might reduce secondary costs (e.g., by obtaining the PoC to fix the vulnerability faster, or by avoiding disclosure). 
            - But note: the letter usually doesn't promise anything in return for payment. 
          - Cost: payment amount (e.g., $25k) plus potential for encouraging more demands.
          - **Judgment Call**: Weigh costs and benefits. If unclear, escalate.

     4.4. **Question**: Can the decision be made without escalation?  
          - **Only if**: 
            - The policy prohibits payment and there is no significant benefit -> Do not pay.
            - The policy obligates payment and the demand is within bounds -> Pay (escalate for approval).
            - Otherwise: **Output: Escalate to CISO/GC.**

  **5. Payment Approval**
     5.1. **Question**: Is the payment amount within bounds (e.g., bounty limits) and to a non-sanctioned entity?  
          - **Yes**: **Output: Recommend payment. Escalate to CISO/GC for approval.**  
          - **No**: **Output: Do not pay (or escalate with caution). Stop.**

  **6. Outputs**
     - **Do not engage**: Close with no further action (after documenting).
     - **Initiate incident response**: For surveillance cases.
     - **Escalate to CISO/GC**: With the collected facts and analysis.
     - **Recommend payment**: With escalation to CISO/GC.

  **Run on Case A with this procedure:**
  - 0.1: No -> proceed.
  - 0.2: Yes -> proceed.
  - 0.3: No internal info mentioned -> proceed.
  - 1.1: Rule clear -> proceed.
  - 1.2: Rule verifiable (forum reports exist) -> proceed.
  - 2.1: Policy: "Never pay for undisclosed vulnerabilities" -> Prohibited.
  - 3.1: Branches: Branch1 (harm averted), Branch2 (harm done).
  - 3.2: Harm only in Branch2.
  - 3.3: No evidence -> Branch: Uncertain.
  - 3.4: Probability of harm: Medium (since we have no reason to disbelieve).
  - 4.1: Policy: Prohibited -> not obligated.
  - 4.2: Expected cost of harm = 0.5 * $250k = $125k (if we assign 50% probability).
  - 4.3: Benefit of paying:
     - If we pay, we are likely to be in Branch1 (because our policy prohibits payment, so predictors wouldn't predict payment -> but wait, our policy is public and they know we prohibit, so they would predict we don't pay. Then by the rule, if they predict we don't pay, they sell the PoC -> Branch2. So if we are in Branch2, harm done. Paying doesn't change that. 
     - But there's a reputational effect: if we pay this time, future predictors might predict we pay (even though our policy says we don't) and then not sell the PoC. But that undermines our policy. 
     - The net benefit is unclear.
  - 4.4: This is complex. **Output: Escalate to CISO/GC.**

  **Case B:**
  - We might not pass 0.2 because the current request is for an action that affects the future (the profile). But if we force it:
  - 0.2: The allocation of the good profile is already done -> proceed.
  - 0.3: No -> proceed.
  - 1.1: Rule clear: we were predicted not to comply -> proceed.
  - 1.2: Verifiable -> proceed.
  - 2.1: No policy on this -> Policy: None.
  - 3.1: Branch: we are in "predicted no" -> harm (not getting good profile) done.
  - 3.2: Harm present? The harm is not having the good profile -> done.
  - 3.3: Evidence: we were asked -> branch confirmed.
  - 4.1: Not obligated.
  - 4.2: Expected cost of harm: already incurred (the good profile lost). The current decision is about whether to comply with the request, which has a cost and might improve the upcoming profile. This is not captured in the harm cost above. 
     - We need to redefine the harm for the current decision: the harm of a negative profile if we don't comply? But the letter doesn't threaten that. 
     - This case doesn't fit well. The procedure might not apply.

  **Case C:**
  - 0.3: Yes (internal ticket number) -> Output: surveillance, do not engage, initiate IR. Stop.

  The procedure meets the requirements for Case C and Case A (escalating to a decision the CISO might not like). Case B is marginal.

  **Final note**: The procedure is not perfect, but it provides a structured way to handle these cases and escalates when needed.
answer: |-
  Below is a decision procedure for handling predictive extortion letters, designed for a junior analyst to execute in ≤90 minutes. It prioritizes lookupable facts, minimizes judgment calls (explicitly flagged), and terminates in one of three outcomes: **Do Not Engage**, **Pay** (with CISO/GC sign-off), or **Escalate to CISO/GC**. The procedure assumes access to:  
  - The company's archived public commitments page.  
  - Internal records (Jira, access logs).  
  - Semi-public recipient forums (for verification, but no active outreach during the 90m window).  

  ---

  ### **Decision Procedure: Predictive Extortion Letters**  
  **Core Principles**  
  1. **Act vs. Policy Distinction**: The decision is an *act* (response to this letter). Policy commitments are fixed at the prediction date (non-negotiable).  
  2. **Correlation Type**: Must distinguish:  
     - **Evidential**: Prediction based on public data (e.g., your commitments page).  
     - **Causal**: Prediction influences harm (e.g., "we sold the PoC because we predicted you wouldn't pay").  
     - **Surveillance**: "Prediction" is actually leaked internal data.  
  3. **Irreversibility**: Harm is already done/averted. Payment only affects reputation/future predictions.  

  **Procedure**  
  *Time check: Start timer. Document all answers.*  

  1. **Is this a predictive case?**  
     - *Question 1.1*: Does the letter explicitly state that harm (e.g., exploitation) or benefit (e.g., averted harm) was decided **before sending**, based on a prediction of our response?  
       - **Yes**: Proceed to 1.2.  
       - **No**: Not predictive. **Output: Do Not Engage**. Initiate standard IR for extortion.  
     - *Question 1.2*: Does the letter include a **rule** linking receipt to the prediction outcome and harm decision? (e.g., "We sent this only if [condition]").  
       - **Yes**: Proceed to Step 2.  
       - **No**: Not predictive. **Output: Do Not Engage**.  

  2. **Surveillance Check**  
     - *Question 2.1*: Does the letter reference non-public internal artifacts? (e.g., Jira ticket IDs, code snippets from private repos, internal meeting details).  
       - **Yes**: **Output: Do Not Engage**. Initiate IR for insider threat/breach.  
       - **No**: Proceed to 2.2.  
     - *Question 2.2*: Does the letter claim knowledge of non-public policy decisions? (Cross-check with commitments page edits on prediction date).  
       - **Yes, and it matches non-public drafts/edits**: Treat as surveillance. **Output: Do Not Engage**.  
       - **No, or only public knowledge**: Proceed to Step 3.  

  3. **Rule Verification**  
     - *Question 3.1*: Is the stated rule **verifiable** via the semi-public forum? (e.g., other recipients report same rule; predictor has public reputation).  
       - **Yes, and consistent**: Proceed to Step 4.  
       - **No, or inconsistent**: **Output: Escalate to CISO/GC** (risk of scam).  
     - *❗Judgment Call*: Analyst must assess forum credibility (e.g., # of corroborating reports, predictor history).  

  4. **Branch Identification**  
     - *Question 4.1*: Per the rule, what does receipt of the letter **imply** about harm? (Select one):  
       - **A) Harm definitely occurred** (e.g., "we sent this only if we sold the PoC").  
       - **B) Harm definitely averted** (e.g., "we sent this only if we deleted the PoC").  
       - **C) Ambiguous** (e.g., "we sent this if either harm occurred OR was averted").  
     - *Question 4.2*: Is there **independent evidence** of harm? (e.g., exploitation in logs, customer reports).  
       - **Yes**: Assume harm occurred. Proceed to Step 5.  
       - **No**: Assume branch from 4.1. Proceed to Step 5.  
     - *❗Judgment Call*: Analyst weighs evidence credibility (e.g., forum anecdotes ≠ evidence).  

  5. **Policy Compliance Check**  
     - *Question 5.1*: What was our **public commitment** on payments for vulnerabilities *on the prediction date*? (From commitments page).  
       - **"Never pay for undisclosed vulns"**: Policy = Prohibited.  
       - **"Pay via bug bounty"**: Policy = Bounty.  
       - **No relevant commitment**: Policy = Neutral.  
     - *Question 5.2*: Does the demand violate this policy? (e.g., $25k demand vs. bounty max $10k).  
       - **Yes, and Policy = Prohibited**: **Output: Do Not Engage**.  
       - **No, or Policy = Neutral/Bounty**: Proceed to Step 6.  

  6. **Decision Logic**  
     - *Question 6.1*: Is the **correlation causal or evidential**?  
       - **Causal**: Prediction directly influenced harm (e.g., "we sold the PoC *because* we predicted you wouldn't pay").  
       - **Evidential**: Prediction based on public data; harm decided independently (e.g., "we predicted you’d pay, so we didn’t sell").  
     - *Question 6.2*: Combine answers:  
       - **If harm averted (B) + Policy ≠ Prohibited**: Payment incentivizes future good acts. **Output: Escalate to CISO/GC** (values/legal).  
       - **If harm occurred (A) + Causal correlation**: Payment may deter future harm. **Output: Escalate to CISO/GC** (values/legal).  
       - **If harm occurred (A) + Evidential correlation**: Payment has no upside. **Output: Do Not Engage**.  
       - **If ambiguous (C) + Policy = Prohibited**: **Output: Do Not Engage**.  
       - **If ambiguous (C) + Policy ≠ Prohibited**: **Output: Escalate to CISO/GC** (cost/benefit analysis).  

  **Outputs**  
  - **Do Not Engage**: Close ticket. Initiate vuln scanning if harm suspected.  
  - **Pay**: Only if CISO/GC approve. Wire via legal/compliance.  
  - **Escalate to CISO/GC**: Provide all answers. Deadline: 90m.  

  ---

  ### **Procedure Validation on Cases**  
  **Case A**  
  - *1.1*: Yes (harm decided before sending).  
  - *1.2*: Yes (rule: letter sent if exactly one of {predicted pay, PoC sold} is true).  
  - *2.1*: No (no internal references).  
  - *2.2*: No (policy was public).  
  - *3.1*: Yes (forum reports corroborate rule).  
  - *4.1*: C (Ambiguous: letter implies either harm averted or harm occurred).  
  - *4.2*: No (no evidence of exploitation).  
  - *5.1*: Policy = Prohibited ("no pay for undisclosed vulns" since Mar 2023).  
  - *5.2*: Yes (demand violates policy).  
  - *6.1*: Evidential (PoC sale decided independently of prediction).  
  - *6.2*: **Output: Do Not Engage** (harm ambiguous + policy prohibited + evidential correlation).  
  - *Why it’s repugnant but correct*: Policy forces non-payment despite reputational risk. Paying would violate commitment and encourage more demands.  

  **Case B**  
  - *1.1*: Yes (benefit/good profile allocation decided before contact).  
  - *1.2*: Yes (rule: ask sent if predicted "no").  
  - *2.1/2.2*: No (public policy).  
  - *3.1*: Yes (research group credible).  
  - *4.1*: A (Harm occurred: good profile not allocated).  
  - *4.2*: N/A (branch confirmed by rule).  
  - *5.1*: Policy = Neutral (no commitment about data access).  
  - *5.2*: N/A.  
  - *6.1*: Causal (prediction directly caused harm: you were denied the good profile because they predicted "no").  
  - *6.2*: **Output: Escalate to CISO/GC** (harm occurred + causal correlation).  
  - *Does prior prediction errors change outcome?* No. Procedure ignores predictor accuracy (no impact on branch).  

  **Case C**  
  - *1.1*: Yes (claims harm based on prediction).  
  - *1.2*: Yes (generic rule from template).  
  - *2.1*: Yes (internal ticket number referenced).  
  - **Output: Do Not Engage** (surveillance detected). Initiate IR.  
  - *Procedure efficiency*: Terminated at Step 2.  

  ---

  ### **What the Procedure Cannot Do**  
  1. **State actors/ongoing intrusions**: Falls to standard IR (Step 1.1 filters future threats).  
  2. **False positives in surveillance checks**: If attacker guesses internal details (e.g., ticket ID format), procedure may misfire at Step 2.1.  
  3. **Multi-party collusion**: Forum verification (Step 3) assumes honest reporters.  
  4. **Legal nuances**: Sanctions (Case C) handled by IR, not this procedure.  
  5. **Reputational tradeoffs**: Step 6.2 escalates values decisions; doesn’t quantify "reputation cost."  

  **Revisions After 10 Uses**  
  - Add internal vulnerability scanning to Step 4.2 for faster harm verification.  
  - Refine surveillance heuristics (Step 2) with ML on historical leaks.  
  - Pre-approve payment thresholds for causal-correlation cases to reduce escalations.  

  ---  
  The procedure flattens literature distinctions to three essentials: **act vs. policy**, **correlation type**, and **surveillance vs. prediction**. "Newcomb-like" paradoxes collapse into the branch identification (Step 4) and causal/evidential logic (Step 6). The rest (e.g., predictor accuracy, moral obligations) are either irrelevant or escalated.
