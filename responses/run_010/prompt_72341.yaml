  2. **Nature of correlation**: We must distinguish between:
     - **Causal**: The predictor's action (e.g., selling the PoC) is influenced by the prediction (but note: in Case A, the letter states the prediction and the sale are independent).
     - **Evidential**: The prediction is based on evidence about the company (like their public policy) and the outcome (whether the company pays) is correlated because of that evidence.
