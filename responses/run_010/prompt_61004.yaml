answer: |-
  ### (a) Essay Question (90 minutes)

  "Using the case of an agent who has made a sincere promise to meet a friend at time T, but who then encounters a stranger at T-5 minutes in immediate, life-threatening danger requiring the agent's *unique* and *immediate* intervention to save them (making it impossible to both save the life and keep the promise), evaluate the claim that genuine moral dilemmas are impossible. Your evaluation must:
  1.  **Identify and critically assess** the *specific principle(s) of deontic logic or moral reasoning* (e.g., a version of 'ought implies can', a principle of obligation aggregation, the interdefinability of deontic operators) that a dilemma denier would need to invoke to argue that one obligation *must* override or cancel the other in this case, explaining precisely what work that principle does.
  2.  **Analyze critically** what the dilemma denier *owes as an account* of the persisting normative significance of the rejected obligation (e.g., the duty to apologize, compensate, or feel agent-regret). Explain why this 'normative residue' might pose a problem for the denial of genuine dilemmas.
  3.  **Conclude** by arguing whether the possibility of genuine dilemmas is more plausible than its denial in light of your analysis. Mere description of the case or rehearsal of general positions (e.g., 'Rossian pluralism allows dilemmas, Kantianism denies them') is insufficient; focus on the underlying machinery and residue."

  ### (b) Model Answer (Approx. 700 words)

  The case presents a stark conflict: an agent faces two obligations – a perfect duty to keep a promise (K) and a perfect duty to save a life (S) – where discharging one *necessarily* entails violating the other due to temporal and causal impossibility. To deny this is a genuine dilemma, one must argue that only one obligation is truly binding *all-things-considered* (ATC). The core principles invoked to achieve this typically involve deontic logic constraints or axioms designed to prevent logical inconsistency within a system of obligations.

  **(1) Principles for Denial & Their Work:** Dilemma deniers often rely on two key principles, though their application and priority differ.
      *   **"Ought Implies Can" (OIC):** This principle states that if an agent *ought* to do A, then it must be *possible* for the agent to do A. Applied here, the denier argues that since the agent *cannot* (K and S), it cannot be true that the agent *ought* (K and S). However, OIC alone doesn't resolve *which* conjunctive part fails. It shows the impossibility of the conjunction, but not that one primary obligation dissolves. It primarily negates the joint obligation, leaving the status of the individual obligations K and S unresolved. The denier needs a further principle to rank or select between K and S ATC.
      *   **Obligation Aggregation Over Conjunction (OAC):** This principle holds that if you ought to do A and you ought to do B, then you ought to do (A and B). Crucially, OAC implies that if it's impossible to do (A and B), then the conjunction "O(A) & O(B)" must be false. This forces the denier to conclude that it *cannot* be true that both O(K) and O(S) hold simultaneously *in this situation*. One must be overridden or canceled. OAC is the primary engine driving the denial of *simultaneous* binding obligations in conflict. The denier must then invoke a substantive moral principle (e.g., a lexical priority rule like "saving life trumps promise-keeping") to determine *which* obligation remains ATC binding (likely O(S)) and which is overridden (O(K)). OAC provides the logical pressure to *demand* such a resolution to avoid contradiction. Without OAC, OIC only negates the joint obligation, not the individual ones.

  **(2) Normative Residue & the Problem for Denial:** Even if the denier uses OAC plus a priority rule to conclude only O(S) is ATC binding, the phenomenology and practice of morality suggest the overridden obligation (K) retains normative force. The agent typically feels *agent-regret* (distinct from mere remorse) – a sense of personal fault for failing K, even knowing S was overriding. They feel compelled to *apologize sincerely* to the friend, acknowledging a *breach* of duty, not merely an unfortunate cancellation. They may offer *compensation*, recognizing a *debt* incurred, not just a gesture of goodwill. They feel that *something was owed* to the friend and remains unsatisfied.

  This normative residue poses a significant problem for the dilemma denier:
      *   **Residual 'Oughtness':** Apology and compensation imply the friend had a *legitimate claim* (a right correlative to the promise-duty) that was *violated*, not merely outweighed or canceled. The language of "breach" presupposes a persisting obligation that wasn't fulfilled. This directly contradicts the denier's claim that only one obligation (O(S)) was truly binding ATC. If O(K) were simply *canceled* by the circumstances, why apologize *for breaking a promise*? Why not just explain the necessity?
      *   **Challenge to OAC/Priority:** The residue suggests that while O(S) provided the strongest *pro tanto* reason for action ATC, O(K) was not thereby rendered normatively inert. It retained its essential deontic character as an obligation *owed*, even if unfulfillable without catastrophic consequence. This indicates that OAC (which forces the falsity of O(K) & O(S)) might be an incorrect formalization of our moral experience. The residue points towards the possibility that both O(K) and O(S) genuinely obtained, creating an inescapable conflict where *whichever* action is chosen, a genuine wrong is committed. The agent violates a binding duty, not just a defeasible *pro tanto* reason.

  **(3) Conclusion:** The analysis reveals the denial of dilemmas relies heavily on the logical principle OAC to dissolve the apparent conflict. However, the phenomenon of normative residue – the persistent sense of violation, the need for apology and amends concerning the overridden duty – provides compelling evidence that OAC does not accurately capture the nature of binding moral obligations in conflict. Residue strongly suggests that obligations can retain their deontic force ("you owed me") even when justifiably overridden ATC in extreme circumstances. While OIC correctly identifies the impossibility of joint fulfillment, it doesn't resolve the conflict in favor of one obligation; OAC tries to do this but fails to account for the enduring normative significance of the unfulfilled duty. Therefore, the persistence of normative residue makes the possibility of genuine moral dilemmas – situations where an agent *must* violate a binding obligation, whichever course they take – significantly more plausible than the denial based on principles like OAC. The machinery of denial struggles to explain why the rejected option feels like a violated *duty*, not just a regrettably unmet consideration.

  ### (c) Marking Scheme (Total: 25 Marks)

  1.  **Clear Case Setup & Recognition of Dilemma Structure:** (0 Marks) *Note: Mere description of the case earns 0. This move is prerequisite but not awarded marks.*
      *   *(Failure: Simply narrating the promise/life-saving conflict without highlighting the impossibility and symmetry crucial for a dilemma.)*

  2.  **Identification & Explanation of Key Denial Principle(s):** (5 Marks)
      *   Accurately identifies and explains the role of either "Ought Implies Can" (OIC) or Obligation Aggregation over Conjunction (OAC) in the denial argument. Higher marks for recognizing OAC as the primary driver for *denying simultaneous binding obligations* and explaining its logical force (forcing the falsity of O(A) & O(B) if ¬◇(A&B)).
      *   *(Failure: Vaguely mentions "conflict resolution" or "weighing" without linking to a specific deontic principle; conflates OIC and OAC; focuses only on substantive priority rules without showing the logical necessity imposed by OAC.)*

  3.  **Critical Analysis of Aggregation/Denial Mechanism:** (5 Marks)
      *   Critically assesses the work and limitations of the identified principle(s), particularly OAC. Explains how OIC alone is insufficient to resolve the conflict ATC and how OAC necessitates invoking a further priority rule. Highlights the logical pressure OAC applies.
      *   *(Failure: Accepts the denial principle uncritically; fails to show *why* OIC is insufficient and OAC is needed for full denial; doesn't articulate the logical consequence of OAC when conjoined with impossibility.)*

  4.  **Explanation & Critical Evaluation of Normative Residue:** (8 Marks)
      *   Accurately describes elements of normative residue (regret, apology, compensation, sense of violated duty/claim). Critically explains *why* this residue poses a problem for the dilemma denier (e.g., implies a persisting obligation/claim despite ATC override, contradicts the idea the 'overridden' duty was canceled, challenges OAC's implication that only one duty was truly binding).
      *   *(Failure: Merely lists examples of residue without explaining their *normative significance*; treats residue as mere psychology without moral implications; fails to connect residue to a challenge for the specific denial principles identified; suggests residue is just about 'feelings' irrelevant to obligation.)*

  5.  **Coherent Conclusion & Overall Argument:** (7 Marks)
      *   Draws a reasoned conclusion about the possibility of dilemmas based directly on the analysis of principles and residue. Clearly argues whether the evidence (especially residue) makes dilemmas plausible or shows the denial is inadequate. Synthesis of points 2-4 into a final judgment. Logical flow and clarity.
      *   *(Failure: Conclusion disconnected from the preceding analysis; simply restates a general position (e.g., "dilemmas exist") without argument from the case/principles/residue; fails to weigh the significance of the critique developed; introduces irrelevant new points.)*
