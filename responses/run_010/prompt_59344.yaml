answer: |-
  ### Decision Procedure for Classifying Statements  
  Based on Sartre's distinction between **facticity** (the fixed aspects of a situation: rules, roles, physical constraints) and **transcendence** (the individual's capacity to choose and act beyond those constraints). Bad faith occurs when a person denies their transcendence by treating roles/rules as absolute (disclaiming agency) or denies their facticity by ignoring real constraints.  

  **Core Trade-off**: Sartre’s absolute freedom (all choices exist, but within a constrained field) is **practically incompatible** with operational safety analysis. We trade philosophical purity for utility: we accept that constraints *feel* absolute to agents, but focus on **systemic disempowerment** (when roles/rules block necessary actions). The tool detects **patterns of agency denial** without judging the writer’s consciousness.  

  **Procedure** (run on each statement; 3–5 min):  
  1. **Identify Action & Alternative**:  
     - *Question*: "What action did the writer take (or not take) that contributed to the event, and what alternative do they explicitly mention (e.g., 'I could have X')?"  
     - *Stop if*: No alternative mentioned → Escalate to Step 1a.  
     - *Standard*: Alternative must be explicit (e.g., "I could have stopped").  

  2. **Step 1a: No Alternative?**  
     - *Question*: "Does the writer state no alternative existed (e.g., 'There was nothing I could do')?"  
     - *If yes*: Classify as **CONSTRAINT**. Stop.  
     - *If no*: Classify as **INCONCLUSIVE**. Stop. Escalate to union rep for context.  

  3. **Check Agency Ownership**:  
     - *Question*: "Does the writer claim ownership of the choice (e.g., 'I decided not to X')?"  
     - *If yes*: Classify as **JUDGMENT**. Stop.  
     - *If no*: Proceed to Step 4.  

  4. **Categorize Reason**:  
     - *Question*: "Why does the writer say they didn’t take the alternative?"  
       - **KNOWLEDGE**: "I didn’t know [fact] at the time."  
       - **CONSTRAINT**: "It wasn’t possible due to [situational pressure]."  
       - **ROUTINE**: "This is how we always do it."  
       - **DELEGATION**: "It wasn’t my role/job to do X."  
     - *Standard*: Use the writer’s exact phrasing. If multiple reasons, use dominant one.  

  5. **Escalations**:  
     - Trigger: "Statement avoids personal action (e.g., 'We did...')" → Hands to **union rep** (assess cultural pressure).  
     - Trigger: "Ambiguous language (e.g., passive voice)" → Hands to **rotating agent** (clarify operational context).  

  **What Survives Translation**:  
  - **Facticity/Transcendence**: Retained as "situational constraints vs. possible choices."  
  - **Bad Faith**: Retained as **DELEGATION** (denying transcendence by attributing agency solely to rules/roles).  
  - **Dropped**: Absolute freedom (impractical for safety analysis; we prioritize perceived constraints).  

  **Where It Misfires**:  
  - **Second language**: May miss nuances (e.g., modals like "could"). Mitigation: Rotating agent checks context.  
  - **Supervisor pressure**: Statements may be defensive. Mitigation: Union rep flags coercive environments.  
  - **Rulebook absorption**: Diagnosis/description identical (e.g., "I followed procedure"). Escalate to panel to compare with event data.  
  - **Reflexive risk**: Panel objectifying writers. Mitigation: Focus on systemic fixes, not individual intent.  

  ---

  ### Analysis of Statements  
  | `statement_id` | `first_step_resolved_at`             | `classification` | `distinction_doing_the_work` (Sartrean basis + loss)                                                                 | `finding_the_panel_may_write`                                                                 | `finding_the_panel_may_not_draw`                                      | `residual_judgment` (owned by role)                                                                 |
  |----------------|--------------------------------------|------------------|----------------------------------------------------------------------------------------------------------------------|----------------------------------------------------------------------------------------------|------------------------------------------------------------------------|-----------------------------------------------------------------------------------------------------|
  | 1              | Step 4 (Reason: CONSTRAINT)          | CONSTRAINT       | Facticity (constraints as absolute; loses transcendence—writer ignores choice to stop despite consequences).         | "Loader perceived severe operational consequences (aircraft blocking taxiway, slot loss) as overriding safety; systemic pressure exists." | "Loader had no agency" (denies their choice to prioritize schedule). | Assess if schedule pressure undermines safety stops. Owned by **line supervisor** (operational flow). |
  | 2              | Step 1a (No alternative mentioned)   | INCONCLUSIVE     | N/A (philosophical warrant contested: Sartre sees choice in rule-following; tool prioritizes explicit alternatives). | "Driver cites procedure compliance but does not address agency; statement is descriptive, not analytical." | "Procedure caused incident" (without evidence).                     | Investigate why agency is unaddressed. Owned by **Learning Review lead** (form design flaw possible). |
  | 3              | Step 3 (Agency owned)                | JUDGMENT         | Transcendence (writer owns choice despite external pressure; preserves situated freedom).                            | "Team leader consciously overrode safety concern due to captain’s input; hierarchy may impede safety escalation." | "Team leader was negligent" (ignores owned choice).                 | Evaluate if authority gradients discourage refusals. Owned by **union rep** (power dynamics).        |

