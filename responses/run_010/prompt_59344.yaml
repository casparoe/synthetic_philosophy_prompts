  However, note Sartre's absolute freedom: even in constraints, one always has a choice, though the field of choices may be limited. Our procedure must not rank by how constrained the writer was (which would measure facticity) but by whether the writer recognizes their transcendence (freedom to choose within the situation). We are not judging if the constraint was real, but if the writer is denying their own agency by attributing the decision to an external authority (rules, roles, others).

