  First, I need to understand Inés' core doctrine deeply. The reversibility proviso focuses on the shape of potential loss rather than probability. Harm must be reversible within roughly 30 years for an action to be permissible. "Credible" means scientifically plausible, not just any hypothetical scenario. Probability doesn't matter unless the harm is reversible anyway.

