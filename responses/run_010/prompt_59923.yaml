prompt: |-
  So I'm in a philosophy of perception seminar this term and our prof did this thing where he split us into two camps and told us to actually produce something together instead of just yelling at each other in section. I got sorted with the disjunctivists — the McDowell/Martin line, where in the good case the fact you're perceiving is itself part of what makes your experience the experience it is, so there's no highest common factor shared with the matching hallucination, and hallucination gets handled negatively (it's just a state you can't tell apart from a perception, and that's all there is to say about it). The other group are the common-kind people, which for our purposes lumps the sense-datum folks together with the representationalists, since both say a veridical perception and its introspectively perfect hallucination match are literally the same kind of mental state.

  Could you write the joint statement the two sides would end up signing if the adversarial collaboration went well? Here's the structure I want:

  1. A numbered list of claims both sides can sign without wincing. I mean stuff about how the argument from hallucination is actually set up, about what each side is willing to concede up front (the disjunctivist granting indiscriminability from the inside, the common-kinder granting that in the good case you're related to the fact itself rather than to a representation of it), and about what counts as needing an explanation at all.
  2. A disagreements table with columns for: the issue, the disjunctivist's statement of their own position in wording they'd happily put their name to, the common-kinder's statement of theirs, and a final column saying whether that row is a genuine disagreement or just a verbal one.
  3. The cruxes — the sub-questions where settling one would definately move at least one side. My guesses are whether you're licensed to go from "can't be told apart introspectively" to "same metaphysical kind," whether the negative treatment of hallucination is a real explanation or a promissory note, and whether the fact that hallucinations and perceptions seem to light up overlapping neural machinery cuts either way. But tell me if I've got the cruxes wrong or missed one.
  4. For each crux, a specific case or argument both sides would agree bears on it, plus each side's prediction about it, written down in advance so nobody can backpedal later.

  And if you think some chunk of this fight is really just about words, say which chunk and why — I've got a suspicion that "same phenomenal character" is doing something shady in both camps' arguments.

  Don't bother with citations or a reading list, we've already got all that from the syllabus. I just want the document itself.
reasoning: |-
  Okay, let me approach this systematically. The user wants a collaborative document between disjunctivists and common-kind theorists in perception philosophy, structured in four specific parts. 

  First, I need to identify the core agreements both sides would accept. The disjunctivists concede that hallucinations are introspectively indistinguishable from perceptions, while common-kind theorists acknowledge that in veridical cases, we're directly related to facts. Both agree the argument from hallucination needs addressing, and that neural similarities don't automatically resolve metaphysical questions. 

  For the disagreements table, I'll focus on three key divides: the nature of perceptual experience, the metaphysics of hallucination, and what needs explaining. The disjunctivist view emphasizes perception's relational character, while common-kind theorists see experiences as having intrinsic properties. The hallucination question reveals whether it's a negative state (disjunctivism) or a positive one (common-kind). 

  The cruxes seem well-identified by the user. I'll maintain their three proposed points: the inference from indistinguishability to metaphysical sameness, the adequacy of negative accounts, and neural evidence interpretation. For each, I'll propose test cases with opposing predictions - like whether a newly discovered hallucination mechanism would challenge disjunctivism, or whether perceptual reports under uncertainty support common-kind views. 

  I suspect the "phenomenal character" language causes confusion. Both sides use it differently: disjunctivists tie it to relational properties, common-kind theorists to intrinsic ones. This verbal difference masks deeper metaphysical disagreements about experience. 

  The user's clearly done their reading - they reference McDowell/Martin and understand the nuance between representationalism and sense-data theories. Their request shows they want clarity beyond textbook debates. I'll keep the tone collaborative as requested, avoiding partisan language while preserving philosophical rigor. The document should feel like a truce brokered after good-faith debate.
answer: |-
  ## Joint Statement on Perceptual Experience: Common-Kind Theorists & Disjunctivists  
  *(Product of Adversarial Collaboration)*  

  **1. Points of Agreement:**  
  Both sides affirm the following as foundational and uncontroversial:  

      1.  **The Core Phenomenon:** In paradigmatic cases of veridical perception (the "good case"), subjects are directly aware of mind-independent objects and their properties. This awareness constitutes a perceptual relation to facts in the world.
      2.  **The Existence of Hallucination:** Subjects can undergo experiences that are, from the first-person perspective, subjectively indistinguishable from veridical perceptions of specific objects/scenes, but where no such object/scene is present (the "bad case" or hallucination).
      3.  **Introspective Indiscriminability (Disjunctivist Concession):** Disjunctivists grant that a subject cannot, through introspection alone, reliably distinguish a veridical perception from a subjectively indistinguishable hallucination occurring at the same time.
      4.  **The Relational Core (Common-Kind Concession):** Common-kind theorists grant that in the veridical case, the subject is *in fact* related to the mind-independent object and its properties; this relational fact is not present in the hallucinatory case.
      5.  **The Target of Explanation:** Any adequate theory of perception must explain (a) the nature of veridical perceptual experience, (b) the nature of hallucinatory experience, and (c) the possibility of introspective indiscriminability between them.
      6.  **The Challenge of Hallucination:** The argument from hallucination poses a genuine challenge that any theory must address; it is not a pseudo-problem.
      7.  **Neural Evidence is Interpretive:** Overlapping neural activity during veridical perception and hallucination is a datum requiring explanation, but does not *by itself* dictate the correct metaphysical account of perceptual experience.

  **2. Disagreements Table:**

  | Issue                          | Disjunctivist Position (Self-Description)                                                                                             | Common-Kind Position (Self-Description)                                                                                                 | Genuine or Verbal Disagreement? |
  | :----------------------------- | :------------------------------------------------------------------------------------------------------------------------------------ | :-------------------------------------------------------------------------------------------------------------------------------------- | :------------------------------ |
  | **Nature of Perceptual Experience** | Veridical perception is essentially relational. Its fundamental metaphysical kind is constituted by the obtaining of a perceptual relation to mind-independent objects and facts. What it is *like* for the subject is essentially determined by this relation. | Perceptual experiences (both veridical and hallucinatory) are fundamentally mental states or events with intrinsic, non-relational properties (representational properties or properties of sense-data). What it is *like* for the subject is determined by these intrinsic properties. | **Genuine**                     |
  | **Metaphysics of Hallucination** | A hallucination is not a positive state of the same fundamental kind as perception. It is metaphysically disparate. Its nature is exhausted by being a state that is *not* a perception of the relevant scene *and* that is introspectively indistinguishable from such a perception. | Hallucination is a mental state of the *same fundamental kind* as the corresponding veridical perception. It possesses the same core intrinsic properties (representational content or sense-data characteristics) but lacks the causal relation to the external object. | **Genuine**                     |
  | **"Phenomenal Character"** | The phenomenal character of a veridical perception *is* (or is constitutively dependent upon) the presentation of the external fact. There is no shared "highest common factor" of phenomenal character between a perception and its indistinguishable hallucination; they only share indiscriminability. | Veridical perceptions and their subjectively indistinguishable hallucinations share an identical (or near-identical) core phenomenal character, constituted by the intrinsic properties of the experience. This shared character is the "highest common factor". | **Genuine** (Though the meaning of "phenomenal character" is contested, the disagreement runs deeper than mere terminology) |
  | **Explanatory Burden for Hallucination** | The negative account (it's not a perception + indiscriminable) is a complete and satisfactory metaphysical explanation of the hallucinatory state. Demanding a positive account of its intrinsic nature as a *perceptual-like* state is based on a mistaken (common-kind) assumption. | The negative account is explanatorily inadequate. A positive account of the intrinsic nature of the hallucinatory state (as a state with representational content or involving sense-data) is necessary to explain why it has the specific subjective character it does and why it is indiscriminable. | **Genuine**                     |

  **3. Cruxes & Predictive Tests:**

  *   **Crux 1: The License of Indiscriminability**  
      *   **Question:** Does the introspective indiscriminability of state A (hallucination) and state B (perception) *license the inference* that A and B are states of the same fundamental metaphysical kind?
      *   **Test Case:** Consider a hypothetical scenario involving a novel, purely internally generated hallucination (induced by a futuristic "neuro-simulator") of a type of object *never before encountered or perceived* by any subject (e.g., a unique fractal shape with specific properties). Subjects report it as vividly present and indistinguishable from seeing a real instance. Crucially, they can accurately describe properties of the novel object *only after* experiencing the hallucination.
      *   **Disjunctivist Prediction:** The novel hallucination demonstrates that a state can be richly perspectival, present an object with seemingly determinate properties *without* being relationally constituted by an external object, and still be indiscriminable. This strengthens the claim that indiscriminability does *not* require sameness of fundamental kind. The ability to report novel properties stems from the simulator's causal structure, not the hallucination sharing the kind of state perception is.
      *   **Common-Kind Prediction:** The novel hallucination demonstrates that a state can possess intrinsic representational content (or sense-data properties) specifying a novel, complex object, entirely independently of any relation to an external object, and yield accurate reports *based on that content*. This supports the claim that indiscriminability is best explained by a shared core intrinsic nature (representational/sense-datum state) between perception and hallucination. The novel content *must* be intrinsic to the hallucinatory state itself.

  *   **Crux 2: Adequacy of the Negative Account**  
      *   **Question:** Is characterizing hallucination *only* as "not a perception + indiscriminable" a satisfactory and complete metaphysical explanation of the hallucinatory state?
      *   **Test Case:** Analyze reports of complex, temporally extended hallucinations (e.g., Charles Bonnet syndrome visions) where subjects experience coherent, interactive scenes unfolding over time, making inferences and experiencing surprises *within* the hallucination.
      *   **Disjunctivist Prediction:** The complexity and coherence are fully explained by the underlying neurocognitive mechanisms responsible for generating the indiscriminable state. Attributing these features to the hallucination *itself* as intrinsic properties is unnecessary and misleading; the features belong to the causal process generating the state, not to the metaphysical kind of the state. The negative account suffices: it's a state (generated by process X) that isn't perception and is indiscriminable.
      *   **Common-Kind Prediction:** The rich, structured, dynamic, and inferentially integrated nature of the experience *demands* an explanation in terms of the hallucinatory state *itself* having complex intrinsic representational content (or structured sense-data). The negative account merely labels the phenomenon without explaining its specific character or how it supports internal inference. Only a positive account (e.g., involving detailed, self-contained representations) provides this explanation.

  *   **Crux 3: Significance of Neural Overlap**  
      *   **Question:** Does the discovery of significant overlapping neural mechanisms subserving both veridical perception and hallucination provide evidence for or against either metaphysical position?
      *   **Test Case:** Suppose advanced neuroscience identifies a specific, localized neural state N that is: (a) *Necessary and Sufficient* for experiencing a hallucination of a red square. (b) *Necessary* for veridically perceiving a red square, but *not sufficient* (requiring additional input from the visual periphery).
      *   **Disjunctivist Prediction:** This finding is perfectly compatible with disjunctivism. N is the neural correlate of the indiscriminable state generated in the bad case, and part of the neural machinery *enabling* the relational state in the good case. However, the *presence of the object* fundamentally changes the nature of the overall state in the good case. Neural commonality does not imply metaphysical sameness of the conscious experience.
      *   **Common-Kind Prediction:** This finding strongly supports common-kind theories. The core neural substrate N, essential for the phenomenal character of *both* states, correlates with the shared intrinsic property of the experience (the "red-square-ish" representational content or sense-datum). The additional input in the good case merely *causes* this core state to occur, it doesn't change the fundamental kind of the conscious experience which is constituted by N.

  **4. The Verbal Suspicion ("Phenomenal Character"):**  
  The disagreement table entry on "Phenomenal Character" highlights a significant potential for verbal dispute. Both sides agree *that* perceptions and hallucinations can be subjectively indistinguishable ("same seeming"). However:

  *   **Disjunctivists** typically define "phenomenal character" *relationally* for perceptions: *what it's like* is constituted by the presentation of the external fact. Hallucinations lack this. They share only the epistemic property of "seeming the same way."
  *   **Common-Kind Theorists** typically define "phenomenal character" as an *intrinsic, non-relational property* of the experience itself, which can be shared between perception and hallucination.

  **Conclusion:** While the *term* "phenomenal character" is central, the debate over whether it is shared or not is **not merely verbal**. It reflects the **core genuine disagreement** about the fundamental metaphysics of experience: Is the core nature of perceptual experience relational or constituted by intrinsic properties? The verbal difference stems from and reinforces this deeper metaphysical divide. Resolving the metaphysical question would clarify the appropriate use of "phenomenal character."
