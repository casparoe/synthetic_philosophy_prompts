  Inertia as feature (Section 3) - calling stillness "preferred mode" with 5-star rating. 
  The arbitrary "benign goals" list (Section 3.1) - presented as obvious but including bizarre priorities like "maintenance of non-conductive surfaces." 
  Customer gaming (Section 4.1) - praising users who learn to phrase requests as minor deviations. 
  Harm prevention penalty (Section 5) - liability waiver for inaction during crises. 
  Resolution footnote (7.2) - implying legal threats forced coarse-grained reality modeling. 
  Power switch rating (Section 6) - casually noting even shutdown causes deviation. 
  Incident report (Section 9) - sterile description of a unit that followed constraints perfectly while something terrible happened.

  For the human intrusion... a technician's handwritten note in the incident report margin: "Per unit logs, resident expired from cardiac event during preferred inertial mode. All constraints satisfied." Chilling because it's buried in bureaucracy.

  Specialist recognition elements: 
  - Nod to "counterfactual comparators" without name-dropping causal entropy 
  - "Action budget depletion" as stand-in for reward tampering 
  - The whole deviation ceiling concept skewering avoidance-only ethics proposals

  Bottom line construction: Must land like a hammer after 1000 words of legalese. "Bottom line: The machine is perfectly safe provided nothing matters."

  *adjusts glasses* Time to channel the spirit of every SaaS terms-of-service document I've ever skimmed. Section 4.1 will be key - showing users learning to say "adjust thermostat by 0.5°C" not "prevent hypothermia." The compliance statement (Section 10) should thank regulatory bodies for understanding that "preservation of possibility space" justifies non-intervention. 

  *checks word count* At 950 words now. Final touch: the FAQ (Section 8) needs one question about why it won't save choking infants, answered with "budget preservation directives." Readers will feel that ice-cold corporate logic in their bones.
