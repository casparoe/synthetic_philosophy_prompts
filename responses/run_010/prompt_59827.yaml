prompt: |-
  I've just spent three hours arguing with a mate about this and I cant settle it, so help me out. She's lined up a guest for our departmental seminar: an archivist-historian whose whole project is that documentary silences about marginalised groups shouldn't be filed under "we simply don't know" but treated as data you can model — roughly along the lines of the statisticians' missing-at-random versus missing-not-at-random distinction. Her claim is that if you can show the recording process was systematically selective (who could write, who counted as worth writing down, which paperwork survived), then the gaps themselves carry information about the unrecorded, and you're licensed to make quantitative claims about them. I think it's half brilliant and half a way of inventing people, and I can't tell which half is bigger.

  Write me exactly five questions to put to her — each a sentence or two, with a one-sentence follow-up underneath keyed to the answer she's most likely to give. Make them bite: I want at least one on how we'd know her model of the selection mechanism isn't just her own politics wearing a lab coat, one on whether imputing an inner life to someone who left no trace is a different kind of wrong from imputing their age or their wages, and one on what would make her downgrade a claim from "inferable from the gap" to plain "unknown". No warm-up questions, nothing about her career, no intro or conclusion, and the whole thing in British English.
