  *checks balance* All five hit required angles, follow-ups anticipate dodges. User’s "half brilliant/half invention" worry gets covered—especially Q3 on inner lives and Q5 on presentism. The "downgrade" mechanism in Q4 directly addresses their "we simply don't know" concern. 

  Final polish: Shortened "demographic characteristics" to "demographics" for punch. Added "bona fide" in Q2 follow-up for British flavour. Made sure "reckon" appears twice for colloquial authenticity.
answer: |-
  Here are five biting questions with targeted follow-ups, in British English as requested:

  1.  **Given your method relies entirely on modelling a selection mechanism we can't directly observe, how do we distinguish gaps that *are* telling us about the unrecorded from gaps that simply mean they weren't there or left no trace?**  
      *If she argues that systematic *evidence* of the selection process validates the model:* **But couldn't that 'evidence' often be interpreted multiple ways, making the 'systematic' nature itself just your model's assumption rather than proven fact?**

  2.  **When you infer the selection mechanism causing the silence (like who 'counted'), isn't there a massive risk that your model of that mechanism is just projecting your own political or theoretical priors onto the past, dressing ideology up as methodology?**  
      *If she contends rigorous historical context and evidence constrain the model:* **Doesn't that just shift the problem, as your *interpretation* of that context and evidence is still filtered through your own lens, potentially making the 'licensed' claims less inference and more your politics in a lab coat?**

  3.  **You suggest modelling quantitative things like population size from gaps – but isn't imputing an *inner life* or subjective experience to someone entirely erased from the record (based purely on the *fact* of their erasure) a fundamentally different, and far more ethically fraught, kind of invention than estimating their age or wages?**  
      *If she distinguishes between demographic facts and inner states:* **So, you *would* agree there's a bright line where modelling demographics from silence is potentially valid, but inferring personal experience crosses into ethically dubious invention?**

  4.  **What specific criteria or failed test would force you to downgrade a claim about the unrecorded, derived *solely* from the gap and your model, from being 'inferable' back to the plain old 'we simply don't know' category?**  
      *If she cites inconsistency with other evidence or an incoherent/improbable model outcome:* **So, the burden is always on the *model* to be coherent and consistent, and the default position *should* revert to 'unknown' if that burden isn't met, rather than the gap itself being inherently informative without the model holding up?**

  5.  **Doesn't treating silence as positive data inherently privilege your contemporary narrative about power and exclusion, risking a form of presentism where you 'discover' in the gaps precisely the structures you expect to find, potentially overwriting more complex or contradictory historical realities we *might* glimpse if we just admitted ignorance?**  
      *If she argues careful modelling controls for this and reveals genuine structures:* **But if the *only* 'data' for the marginalised group is the modelled gap, how can we ever falsify your narrative, rather than just constructing a plausible, perhaps politically satisfying, but ultimately invented past?**

  These questions directly challenge the epistemological foundations, political risks, ethical boundaries, falsifiability, and potential for presentist bias inherent in her approach, as you requested.
