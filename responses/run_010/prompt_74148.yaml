answer: |-
  ## The Impartial Spectator's Shadow: Resolving the Epistemic Status of Smith's Moral Arbiter

  Adam Smith’s *The Theory of Moral Sentiments* (TMS) centres its account of moral judgement on the pivotal figure of the "impartial spectator." This imagined observer provides the crucial standpoint from which an agent can evaluate the propriety of her own conduct or the conduct of others. Approbation, Smith argues, stems from the agent finding that her sentiments can "enter into" or harmonize with those this spectator would feel towards the action in question. However, Smith’s exposition leaves ambiguous the precise *epistemic status* of this spectator: is it a distillation of experience, a product of rational idealisation, or a conduit to objective moral truth? This ambiguity has spawned a significant interpretive dispute, crystallised into three primary readings: the *abstraction*, the *idealised-construction*, and the *tracking* readings. Navigating this dispute requires confronting two potent objections – the bootstrapping problem and the median spectator problem – before adjudicating which reading best captures Smith’s project and what this implies for classifying his moral philosophy.

  **The Contending Readings: Unpacking the Spectator**

  1.  **The Abstraction Reading:** On this view, the impartial spectator is fundamentally empirical. It is constructed from the agent’s lived experience of actual spectators – parents, teachers, peers, society at large. Through repeated interactions, observing others’ reactions to conduct (both her own and that of others), and internalising their praise and blame, the agent gradually forms a composite picture. The impartial spectator emerges as the *average* or *residue* after filtering out the particular biases, passions, and self-interest inherent in any single real spectator’s judgement. It represents the settled, conventional moral sentiment of the agent’s community, refined by socialisation. Proponents might point to Smith’s detailed discussions of how we learn propriety through social interaction and sympathy, and particularly his analysis in Part V on how custom and fashion shape our sentiments of approbation and disapprobation. The spectator, here, is a summary statistic of communal feeling.

  2.  **The Idealised-Construction Reading:** This interpretation emphasises the *imaginative* and *corrective* function of the spectator. It is not simply an average of past experiences, but a hypothetical judge the agent actively constructs *in the moment of deliberation*. This constructed spectator possesses crucial ideal attributes: perfect knowledge of all relevant facts and motives, complete disinterest (freedom from personal stake or bias), and emotional calmness. The agent, burdened by partiality and self-love, uses this imaginative exercise to *correct* her own distorted perspective and the potentially flawed judgements of actual spectators. The spectator on this reading is normative; its verdicts tell us not what people *do* feel, but what they *should* feel under ideal epistemic and affective conditions. Passages where Smith describes the agent striving to see her situation from an external, dispassionate viewpoint, or where he contrasts the "man within the breast" with the clamour of the "man without," support this view of the spectator as a regulative ideal constructed to transcend immediate partiality.

  3.  **The Tracking Reading:** This perspective posits that the impartial spectator, while accessed through imagination, ultimately serves as a means to grasp moral truths that exist independently of human sentiments or constructions. The standpoint it represents is ontologically objective; the imaginative procedure is merely a heuristic tool imperfectly designed to latch onto this pre-existing moral reality. Supporters often invoke Smith’s occasional theological framing, particularly his references to the impartial spectator as the "viceregent" or "representative" of the "Deity" within us, and the ultimate harmony of moral order with divine design (especially in Part VI and the final editions). The spectator’s authority, on this view, derives not from social consensus or idealised rationality, but from its alignment with a cosmic moral truth authored by God.

  **Confronting the Objections: Bootstrapping and the Median Spectator**

  Any successful reading must grapple with serious objections, particularly the bootstrapping problem and the median spectator problem.

  *   **The Bootstrapping Problem:** This objection highlights a potential vicious circularity. The agent consults the spectator by *imagining* how such a spectator would feel. But the materials for this imaginative construction – the concepts of disinterest, full information, and propriety itself – must be drawn from the agent’s own existing moral sentiments and cognitive resources. These resources are precisely what are suspect due to partiality and bias. How can the procedure generate a truly independent, corrective judgement if it relies on the very faculties it aims to correct?
      *   **On All Readings:** The problem seems pervasive. For the **abstraction** view, the agent constructs the spectator from past judgements already coloured by partiality; the average might smooth extremes but cannot guarantee escape from systemic communal bias. For the **idealised-construction**, the agent defines "disinterest" and "full knowledge" using her potentially flawed understanding; the ideal is built with potentially corrupted bricks. For the **tracking** view, accessing the objective standpoint via imagination is inherently mediated by the agent’s subjective capacities. Direct consultability – accessing the standard without presupposing the judgements it should validate – appears unattainable.
      *   **Implications:** This suggests the spectator cannot function as a straightforwardly *directly consultable* criterion of rightness in the moment of deliberation. Its normative work must be different. I propose Smith’s theory is fundamentally **genealogical and developmental**, while retaining normative force through its idealising corrective function. The spectator concept explains the *origin* and *refinement* of our moral capacities. We *begin* with crude social feedback (abstraction), but through repeated imaginative exercises (idealised-construction), our capacity to form the spectator and our understanding of its requirements become more sophisticated. It is a *process* of self-correction over time, not an infallible oracle. The spectator provides a standpoint *against which* our immediate, partial sentiments can be *tested*, creating friction that prompts reflection and potential revision. Its justification lies not in providing algorithmic answers, but in being the necessary standpoint for overcoming the distorting effects of self-love – a standpoint whose authority we come to recognise through experiencing the inadequacy of partial judgement. This is a respectable role: it explains how fallible humans develop a workable, progressively improvable moral sense. Smith’s focus is on the *process* of moral psychology and judgement formation, not on providing a foundationalist moral epistemology immune to circularity.

  *   **The Median Spectator Problem:** This strikes directly at the abstraction reading. If the impartial spectator is merely the central tendency of actual communal sentiments, then in a society where harmful practices (like duelling) are widely approved, the impartial spectator of its members would endorse them. This renders the theory incapable of internal critique. The lone dissenter condemning duelling cannot be morally right; she is merely statistically deviant. This seems a damning concession to moral relativism.
      *   **Assessing the Damage:** For the abstraction reading alone, this problem is severe and arguably fatal. It contradicts core aspects of Smith’s text. Smith explicitly discusses the potential for custom to corrupt moral sentiments (Part V), arguing that while it can lend propriety to what is inherently "disagreeable" or "unnatural," the *fundamental* sentiments of approbation and disapprobation retain their force. The "natural misrepresentations" caused by custom can be recognised by a "steady and acute" spectator. Furthermore, Smith’s account of conscience involves precisely this capacity to stand against the crowd – the "impartial spectator" within can condemn what the "real spectators" without approve. The abstraction reading struggles to explain this normative friction between the individual conscience and society.
      *   **Smith’s Resources and the Need to Move Beyond Abstraction:** Smith *does* have resources to block crude relativism, but they require abandoning pure abstraction. Passages describing the effort to achieve true impartiality – stripping away prejudice, striving for comprehensive knowledge, calming selfish passions – point towards the **idealised-construction**. The dissenter isn't appealing to a different empirical average; she is constructing a spectator *more rigorously disinterested and informed* than the one passively absorbed from a corrupt society. She challenges the communal norm by appealing to a *better constructed*, more truly impartial perspective. While her starting materials are inevitably shaped by her society, the *idealisation process* itself provides the critical leverage. The tracking reading offers a solution (appeal to objective truth), but Smith’s naturalistic emphasis on sympathy and social psychology makes this seem less central than the procedural idealisation.

  **Adjudication: The Idealised-Construction as Primary**

  Having weighed the readings and objections, the **idealised-construction reading** emerges as the most compelling interpretation of Smith’s impartial spectator, though not to the complete exclusion of the others. It provides the best resources to navigate the objections while cohering with the core psychological and normative dynamics of TMS.

  1.  **Escaping the Median Spectator:** As argued, the idealised-construction reading directly explains how internal critique is possible. The dissenter uses the *same imaginative procedure* as others, but applies it more rigorously or with a clearer view of the relevant facts and motives, thereby constructing a spectator whose verdict *corrects* the communal average corrupted by custom. The normative authority stems from the quality of the construction – its success in eliminating partiality and achieving comprehensive understanding. Abstraction alone fails here.
  2.  **Managing Bootstrapping:** While the bootstrapping problem remains a challenge for any theory relying on introspection, the idealised-construction framing makes sense of it as a *developmental* process. The initial materials are crude and partial (leaning on abstraction), but through repeated practice in constructing the spectator – encountering dissonance between our partial feelings and the imagined impartial view, and between communal norms and a more carefully constructed ideal perspective – our conception of impartiality and the spectator itself *refines*. The standard is not static; the process of consultation *develops* the standard and the agent’s capacity to apply it. Smith’s spectator is less a fixed entity to consult and more a dynamic *activity* of self-scrutiny and perspective-taking.
  3.  **Textual Fit:** This reading resonates strongly with Smith’s persistent emphasis on the *labour* of achieving impartiality. He describes the agent "dividing" herself, making an "effort," striving to "humble the arrogance of self-love" by viewing her conduct from "a certain distance." The spectator is not passively inherited; it is actively conjured and refined through an effortful imaginative act designed to overcome inherent biases. While social interaction provides the raw materials and initial framework (acknowledging the abstraction element), the crucial normative work is done by the idealising, corrective function.
  4.  **The Role of Theology:** The tracking reading draws strength from Smith’s theological language. However, this language often appears in contexts emphasising the *psychological authority* and inescapability of conscience ("the vicegerent of the deity"), or the ultimate harmony of natural (including moral) order. It serves more as a reinforcement of the spectator’s *felt* supreme authority and the idea of a coherent moral universe than as a clear assertion of mind-independent moral facts accessed through the spectator. Smith’s primary explanatory mechanism remains naturalistic sympathy and imaginative perspective-taking. The idealised-construction can incorporate this theological framing as a way of expressing the *uncompromising demand* of the idealised perspective we construct, without requiring the spectator to literally track divine decrees.

  Therefore, the idealised-construction is the primary lens. Yet, a pure version is inadequate. The **abstraction** element is essential as the *source material* for the construction – we learn the language and initial content of morality through social interaction and sympathy with real spectators. The idealised spectator is built *from* and *in response to* these experiences. The **tracking** element, while not foundational, captures the *authoritative* and *realist-seeming* phenomenology of conscience that Smith describes; the constructed spectator *feels* like it reveals objective truth, and Smith’s theological remarks amplify this. Thus, a **qualified hybrid** is most accurate: **The impartial spectator is an idealised construction, generated through imagination to correct partiality, using materials derived from social experience (abstraction), and experienced as possessing authoritative, quasi-objective normative force (tracking).** The "seam" runs thus: the *source* is empirical/social (abstraction); the *process* is imaginative idealisation (construction); the *phenomenology and ultimate justification* (for Smith) may invoke a harmonious natural/moral order (tracking, but primarily as reinforcement).

  **Classification: Smith’s Resistant Ethics**

  What does this reading imply for classifying Smith’s moral theory? It resists neat categorisation under standard labels like consequentialism, deontology, or virtue ethics, and this resistance is a principled feature stemming from his focus on the *psychology of judgement* and the *standpoint* of evaluation, rather than first-order rules or intrinsic goods.

  *   **Rule-Consequentialism?** While Smith emphasises the beneficial social consequences of general rules (justice maintains society), the *source* of the rules and the *justification* for following them lies in the sentiments approved by the impartial spectator, not directly in consequences. The spectator approves of beneficence because it is proper and merits gratitude, not solely (or even primarily) because it maximises utility.
  *   **Virtue Ethics?** This is a stronger candidate. Smith’s focus on character ("propriety," "prudence," "benevolence," "self-command"), the importance of motives evaluated sympathetically, and the role of the spectator in discerning the "merit" or "demerit" of actions based on the agent’s qualities, aligns with virtue ethics. The impartial spectator evaluates the *quality of the agent's character and motives* as expressed in action within its context. Propriety and merit are central virtues. However, Smith’s system lacks a single overarching *telos* like *eudaimonia*, and his derivation of virtues via sympathy and the spectator is distinct from Aristotelian naturalism or intuitionism.
  *   **Constructivism?** The idealised-construction reading brings Smith surprisingly close to certain forms of constructivism. Moral norms are not discovered but *constructed* through a specific (imaginative, perspective-taking) procedure designed to model an ideal standpoint free from distorting influences (partiality, ignorance). The "reasonable" or "impartial" standpoint generates moral demands. However, Smith’s constructivism is deeply embedded in human psychology and sociality; it’s not a purely rational procedure abstracted from sentiment. The "materials" are affective (sentiments of sympathy).

  The best classification is a **Sentimentalist Virtue Ethics with Constructivist Elements**. Sentimentalism is foundational (morality arises from sentiments refined by sympathy). The focus on character evaluation and propriety anchors it in virtue ethics. The centrality of the *imaginative construction of the ideal impartial standpoint* as the source of normative authority introduces a significant constructivist dimension: rightness is defined by what withstands scrutiny from that constructed perspective. The resistance to classification stems from Smith’s unique synthesis: grounding normativity in affective psychology (sentimentalism), focusing evaluation on character and motives within situations (virtue ethics), while deriving authoritative judgement through a procedural idealisation (constructivism). The theory is fundamentally about the *process* and *standpoint* of moral evaluation, not its output fitting a pre-defined consequentialist or deontological box. This integrated focus is its defining and principled characteristic.

  **The Decisive Consideration and the Rebutted Counterclaim**

  The single consideration doing the most work in favour of the idealised-construction reading (within the hybrid) is **Smith’s consistent emphasis on the *active, effortful labour of imagination* required to overcome self-love and achieve true impartial judgement.** Passages throughout TMS depict the agent not recalling an average, but striving, dividing herself, making an effort, humbling her arrogance, viewing herself from a distance – all to construct a perspective *distinct* from her own partiality and potentially distinct from prevailing social opinion. This dynamic, corrective process is the engine of moral judgement and conscience for Smith. It explains critique, it accommodates (as development) the bootstrapping issue, and it aligns with his naturalistic psychology while allowing for the normative authority of the spectator. The spectator's essence lies in this *act of construction for correction*.

  The strongest case for the rejected **abstraction reading** rests on **Part V's detailed analysis of custom and fashion.** Smith meticulously documents how communal practices shape and often distort our sentiments of propriety. Doesn't this demonstrate that the spectator *is* fundamentally a product of social conditioning? A defender could argue that the idealisation process itself is shaped by the very customs it purports to judge, making true transcendence impossible and reducing the spectator to a refined social average.

  This case fails for two reasons, integral to Smith’s argument in Part V itself:

  1.  **Smith’s Normative Stance Within Part V:** Smith doesn’t present custom’s influence as the *definition* of morality, but as a *source of corruption* or deviation from the "natural" sentiments. He distinguishes between the "grounds" of moral sentiments (which remain rooted in sympathy and the original structure of human nature) and the "subjects" upon which they are directed (which custom can pervert). He explicitly states that custom cannot render inherently "unnatural" actions truly agreeable to the "natural sentiments" of an impartial mind. The very ability to *identify* custom as a corrupting influence presupposes a standpoint *outside* that corruption – the standpoint of the more rigorously constructed impartial spectator appealing to "natural" sympathy.
  2.  **The Role of the Spectator in Recognising Corruption:** Smith’s analysis relies on the *contrast* between the distorted sentiments produced by custom and the sentiments of the "impartial spectator" or "man within the breast." The corrupting power of custom is diagnosed *from the perspective* of the idealised spectator. If the spectator were merely the product of custom, this critical perspective would be unavailable. The abstraction reading cannot explain how Smith (or his reader) can stand outside their own society’s customs to critique them, as he explicitly does in Part V. The idealised-construction reading provides the necessary critical leverage.

  Therefore, while Part V underscores the powerful influence of social conditioning (the raw material of the abstraction element), it simultaneously relies upon and demonstrates the necessity of the idealised-construction process to identify and resist that conditioning. The social influence is the problem; the imaginative construction of the ideal spectator is the (imperfect, effortful) solution Smith proposes. This dynamic interplay, centred on the labour of achieving impartiality, confirms the idealised-construction as the core of Smith’s profound account of moral judgement.
