answer: |-
  Here’s the complete problem set item, designed to push students beyond surface-level critiques while meeting your specifications.  

  ---

  ### Problem Set Item (as students would see it)  
  **Question 5 (20 marks; spend ~8 mins):**  
  The following paragraph argues that Buridan’s ass reveals a flaw in expected-utility theory (EUT):  
  > *"The ass case shows that expected-utility theory is incomplete as a guide to action. Rationality requires you to maximise, but when two options are equally good it doesn’t tell you which of them to take, so a maximiser who follows the theory faithfully just stands there and starves. Any complete account of rational choice therefore has to add a tie-breaking principle. Since the ass has no such principle available it is stuck: it can’t rationally eat either bale, and so it eats neither."*  

  **Diagnose the central error in this reasoning.** Explain why the conclusion (that EUT forces inaction or needs a "tie-breaking principle") is mistaken. Focus on distinctions between *rational requirements*, *decision procedures*, and *psychological limitations*.  
  *(Strict limit: 120 words. Responses over limit lose 5 marks.)*  

  ---

  ### Model Answer (Key Elements)  
  *(~110 words; meets word limit)*  
  The argument misrepresents EUT. Rationality *requires* choosing a maximising option but *permits* any option that maximises. When two options have equal utility, EUT does not demand inaction; it permits choosing *either*. Starvation results not from rational failure but from the ass’s inability to execute a permitted choice—a psychological, not normative, defect. Adding a "tie-breaking principle" confuses *rational permissibility* (which already exists) with a *decision procedure* (a tool for selection). The ass’s problem is procedural paralysis, not EUT’s incompleteness. EUT only identifies rational options; it doesn’t prescribe how to select among equals.  

  ---

  ### Marking Scheme (20 marks total)  
  **Core Errors to Identify (Award marks for recognizing these):**  
  1. **Misunderstanding maximization (Crucial):** EUT *permits* any maximizing choice when options are tied; it does not *require* inaction (5 marks).  
  2. **Conflation of rationality with procedure:** Failure to distinguish normative *permissibility* (rationality) from psychological/algorithmic *selection mechanisms* (5 marks).  
  3. **Misattribution of starvation:** The ass starves due to cognitive/executive failure (can’t act on rational permission), not a gap in EUT (4 marks).  
  4. **Tie-breaker redundancy:** Adding a tie-breaker addresses procedural paralysis, not a flaw in EUT’s normative standard (3 marks).  
  5. **Clarity/brevity:** Precision within word limit (3 marks).  

  **Grade Differentiation:**  
  - **First-class (17–20):** Explicitly names all core errors (1–4). Distinguishes normative requirements (permissibility) from procedural/psychological challenges. Avoids extraneous points.  
  - **Upper 2:1 (14–16):** Identifies errors 1–3 but misses nuances (e.g., conflates "EUT doesn’t specify" with "EUT requires inaction"). May briefly mention tie-breaker futility.  
  - **Lower 2:1 (11–13):** Correctly notes rationality permits either choice but confuses permissibility with obligation. Superficial on procedural distinction.  
  - **Third (6–10):** Only gestures at "rationality permits action" without explaining why. Focuses on paradox language or ass’s stupidity.  
  - **Fail (0–5):** Misdiagnoses entirely (e.g., claims EUT *causes* starvation, proposes randomizers, or recites the story).  

  **Explicit Penalties (–1 to –5 per instance):**  
  - Calling it a "paradox" or debating realism.  
  - Proposing solutions (e.g., "use a coin flip"): Ignores that the choice of randomizer recreates symmetry.  
  - Claiming starvation "proves" irrationality (confuses outcome with requirement).  
  - Blaming EUT for not "breaking ties" (misunderstands scope of normative theories).  
  - Exceeding word limit: –5.  

  ---

  **Rationale for Design:**  
  - **Word limit** forces precision and blocks regurgitation.  
  - **Focus on permissibility vs. procedure** targets the paragraph’s core confusion while avoiding stock answers.  
  - **Marking scheme** rewards distinguishing psychological failure ("ass can’t choose") from normative gaps ("EUT forbids choice").  
  - **Penalties** deter common detours (randomizers, paradox-talk) that sidestep the reasoning error.  

  This setup ensures students engage deeply with EUT’s structure while meeting your goal of moving beyond "rationality permits, not requires" tropes.
