  **CUST-AL1987:** No, thank you. I'd like to speak to a supervisor. This feels fundamentally misleading. If courage only exists *in the situation*, and the situation is always unique, what exactly did I buy? And if I believe your warranty – that I don't *have* courage, it's all the situation – doesn't that just guarantee I'll *never* speak up? You're selling a product whose warranty tells me the product category is fictional!
  **Terry L1:** I will escalate your case to a supervisor, CUST-AL1987. Please hold for a moment.
