prompt: |-
  A couple of the Rapa Nui specialists at our department have been going in circles on Easter Island for two years and my PI wants us to run an adversarial collaboration between them this summer, so I've been stuck drafting the document they're supposed to end up signing. One side argues the island genuinely collapsed before Europeans showed up: palms gone, statue carving stopped for good, the population cratered, and the obsidian spearpoints turning up in late layers are the archaeological signature of war. The other side says nothing of the kind happened — that it's a reorganization, not a failure: the people kept farming, just differently; religious investment shifted into the birdman cult rather than vanishing; and the real demographic disaster is squarely post-contact, with the slave raids and disease of the 1860s doing the work that the collapse story assigns to earlier centuries.

  Could you draft what they'd actually produce? I want the claims both can sign about the island's archaeology and about what the record can and can't show; the residual disagreements stated in wording each side would accept as a fair statement of its own position; and the cruxes. My own guess is that one crux is what "collapse" is supposed to mean and another is whether the pre-contact population trajectory really fell before 1722, but correct me if the real fault lines are elsewhere. For each crux, name some specific piece of evidence or line of argument both would agree bears on it — a dating sequence, a class of artifact, an oral tradition read in a particular way — and record what each side predicts it will show. A numbered agreed-claims section followed by a disagreements table would be ideal.

  And since this is going to get torn apart in review: flag where the wording is quietly doing work for one side, and tell me what would actually change your mind about which of the two positions the evidence favors — which piece of reasoning in your draft is most likely to be the weak one.
reasoning: |-
  Okay, let me unpack this Easter Island adversarial collaboration request. The user is an archaeology grad student stuck mediating between two Rapa Nui experts - one supporting pre-European collapse theory and the other arguing for reorganization. They need a formal agreement draft that both scholars can sign, with specific components: agreed facts, residual disagreements framed neutrally, testable cruxes, and hidden biases flagged.

  Hmm... the core tension here is epistemological - what constitutes "collapse"? The palm pollen decline is agreed upon, but its interpretation isn't. Both sides accept the stratigraphy showing abrupt decline in moai carving, yet one sees religious continuity in birdman petroglyphs while the other sees societal fracture. 

  *flips through mental notes of Rapa Nui literature* The real fault lines seem to be: 1) whether palm loss caused systemic failure or adaptive change, 2) if oral traditions about warfare reflect pre-contact reality or post-contact trauma, and 3) whether those obsidian spearpoints are weapons or tools. 

  *starts drafting structure* For the agreements section, I'll anchor on non-controversial points: pollen evidence for palm decline, radiocarbon dates for moai cessation, and the undisputed demographic impact of 1860s slave raids. The disagreements need parallel phrasing - "Significant pre-contact depopulation occurred" vs. "Major depopulation post-dates European contact" keeps both positions intact without judgment.

  Ah! The dating of bone pathologies is crucial. If future studies find skeletal trauma clusters BEFORE 1722, that favors collapse theory. But if they're concentrated AFTER Peruvian slave raids... *nods* that's the evidentiary tripwire I should highlight. 

  *checks for hidden bias* Wait - describing birdman cult as "religious investment" subtly favors the reorganization narrative. Better add a footnote about that. The real test will be those ongoing paleodemographic studies - if they show stable populations until Europeans came, the collapse model unravels.
answer: |-
  Here’s a draft adversarial collaboration agreement addressing Rapa Nui’s pre-contact trajectory, structured for clarity and neutrality, with annotations on biases and cruxes:

  ---

  **ADVERSARIAL COLLABORATION AGREEMENT: RAPA NUI PRE-CONTACT SOCIETAL TRAJECTORY**  

  **Section 1: Agreed Claims (Archaeological & Historical Consensus)**  
  1.1. **Palm Decline:** *Jubaea chilensis* palm pollen disappears from sediment cores by ~1650 CE, indicating forest loss.  
  1.2. **Monument Cessation:** Moai carving halted island-wide by ~1600–1650 CE (C14 dates from Rano Raraku quarry).  
  1.3. **Obsidian Artifacts:** Mata’a (flake tools) proliferate in late pre-contact contexts (~1600–1722 CE).  
  1.4. **Post-Contact Catastrophe:** Peruvian slave raids (1862–63) and introduced diseases reduced the population by >80% from pre-raid estimates.  
  1.5. **Agricultural Continuity:** Lithic mulch gardens (manavai) and rock-walled fields persisted into the 18th–19th centuries.  
  1.6. **Birdman Cult Emergence:** Orongo ceremonial site activity peaks post-1600 CE (direct dates on petroglyphs).  

  **Section 2: Residual Disagreements (Neutral Framing)**  
  | **Disagreement** | **Position A: "Pre-contact Collapse"** | **Position B: "Reorganization"** |  
  |------------------|----------------------------------------|----------------------------------|  
  | **Pre-1722 Population Trend** | "Significant depopulation occurred pre-1722 due to environmental degradation and conflict." | "Major depopulation post-dates 1722; pre-contact population fluctuated but remained resilient." |  
  | **Interpretation of Mata’a** | "Mata’a are primarily weapons; their concentration signifies endemic warfare." | "Mata’a are multi-use tools; deposition reflects ritual breakage or agricultural intensification." |  
  | **Nature of Societal Change** | "Forest loss triggered systemic collapse: monumentality ceased, elite control fragmented, and conflict erupted." | "Society adapted strategically: religious focus shifted to Orongo, and upland gardens replaced coastal infrastructure." |  

  **Section 3: Testable Cruxes & Predictive Evidence**  
  | **Crux** | **Shared Diagnostic Evidence** | **Prediction A (Collapse)** | **Prediction B (Reorganization)** |  
  |----------|--------------------------------|----------------------------|----------------------------------|  
  | **C1: Pre-1722 Demographics** | High-resolution paleodemography (e.g., fecal stanols in lake cores, settlement pattern shifts) | Decline begins ~1600 CE, accelerating pre-1722. | Stability or modest decline pre-1722; steep drop post-1860. |  
  | **C2: Warfare Chronology** | Skeletal trauma (C14-dated remains) and spatial distribution of mata’a | Trauma rates spike pre-1722; mata’a cluster near defensive features. | Trauma rates stable pre-contact; mata’a correlate with habitation/ritual sites. |  
  | **C3: Agricultural Resilience** | Soil nutrient analysis of manavai/rock gardens & paleobotanical records | Nutrient depletion, crop diversity reduction pre-1722. | Sustained soil fertility, continued taro/sweet potato cultivation. |  
  | **C4: Ritual Continuity** | Stratigraphy of Orongo offerings vs. abandoned ahu | Orongo activity replaces moai investment; ahu dismantling implies conflict. | Orongo complements earlier practices; ahu reuse signifies adaptation, not violence. |  

  ---

  ### Annotations for Drafting Integrity  
  1. **Stealth Biases Flagged:**  
     - *"Cratered" (Position A)* → Replaced with "significant depopulation" in disagreements.  
     - *"Religious investment shifted" (Position B)* → Implies seamless adaptation; countered by noting "replaces" in Crux C4.  
     - *"Skeletal trauma"*: Neutral term; both accept its relevance but dispute timing.  

  2. **Weakest Reasoning:**  
     The **demographic crux (C1)** is most vulnerable. Current proxies (e.g., house counts, \({}^{14}\)C "dates as data") have high uncertainty. If new lake core stanols show stable pre-1722 populations, Position A weakens. Conversely, if settlement abandonment accelerates pre-1722, Position B weakens.  

  3. **Evidence Likely to Shift Consensus:**  
     - **Radiocarbon-dated trauma lesions**: Pre-1700 violence would bolster A; post-1800 clustering supports B.  
     - **Pollen vs. Soil Data Conflict**: If manavai soils show sustained productivity *despite* palm loss, it favors B’s resilience model.  

  4. **Fault Line Correction:**  
     You correctly identified "collapse definition" and "pre-1722 demography" as cruxes. The deeper divide is **whether adaptation is evidence of resilience or fragmentation**. Position A sees reorganization as collapse symptom; B sees it as successful coping.  

  ---

  ### Why This Structure Works  
  - **Claims**: Anchored in published data, cite methods (e.g., "C14 dates") to avoid interpretive language.  
  - **Disagreements**: Each side’s view is stated affirmatively without "straw-manning."  
  - **Cruxes**: Specify *how* evidence resolves disputes (e.g., "if trauma rates spike pre-1722...").  

  **Suggested Edits Before Review**:  
  - Add: "Both parties accept that 'collapse' requires explicit criteria (e.g., >40% depopulation, loss of social complexity)."  
  - Include: "Oral traditions of warfare (e.g., 'Matato’a') are acknowledged by both but deemed temporally ambiguous without material correlation."  

  This framework forces engagement with empirical tests while respecting both narratives. The key is framing predictions so falsification is possible.
