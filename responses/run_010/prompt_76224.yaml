answer: |-
  Your observation cuts to the heart of a profound and under-discussed distortion in distributive justice debates. What you're describing **isn't fully captured by a single established concept**, but it intersects powerfully with several ideas. Let's carve the phenomenon precisely.

  ### Core Phenomenon: Moral Salience Bias Toward Administrative Tractability
  **Definition:** *The tendency for societal debates about fairness and injustice to disproportionately focus on mechanisms of advantage/disadvantage transmission that are administratively tractable (measurable, enforceable, rule-definable), rather than on mechanisms that have greater causal impact but are resistant to policy intervention.* This bias operates in two directions:
  1.  **Over-Salience of the Tractable:** High-visibility moral/political debate clusters around mechanisms easily governed by rules (e.g., direct inheritance).
  2.  **Under-Salience/Laundering of the Intractable:** Mechanisms difficult to regulate (e.g., childhood cultural capital, social networks) are systematically downplayed in normative debates *precisely because* they are intractable, often leading to their tacit acceptance as "natural" or "beyond justice."

  ### Why Existing Neighbouring Concepts Don't Fully Capture It
  1.  **The Streetlight Effect (Searching Where the Light Is):**
      *   **Difference:** The streetlight effect is about *investigation/measurement* convenience. You describe a *normative/moral judgment* convenience. It's not just *where we look* for solutions, but *what we consider a problem worthy of moral outrage or policy attention* in the first place. Your example shows the inheritance tax debate (lit area) receiving intense moral scrutiny, while parenting practices (dark area) producing similar or greater advantage escape being framed as an "injustice" *because* they're dark.
  2.  **"What Gets Measured Gets Managed":**
      *   **Difference:** This is a pragmatic management principle about prioritization. You identify a *moral* and *perceptual* shift: the *inability* to measure/manage leads to the mechanism being *morally laundered* – deemed *not unfair* rather than merely *unmanageable*. The slide from "can't fix" to "not unjust" is the critical leap you observe.
  3.  **Feasibility Constraints / Administrative Capacity (in Policy/Tax):**
      *   **Difference:** Policy analysts acknowledge feasibility limits ("we can't tax that effectively"). However, your phenomenon describes how this practical limitation *migrates into normative reasoning*. The barrister isn't just saying "we can't tax parenting," they are (implicitly or explicitly) suggesting parenting-derived advantage *isn't an appropriate target for justice concerns* because it's intractable. The infeasibility performs *normative work*, absolving the advantage of moral scrutiny.
  4.  **"Ought Implies Can":**
      *   **Difference:** As you note, this principle concerns *obligations* ("You *ought* to do X" only makes sense if you *can* do X). Your focus is on *injustice assessments* ("State of affairs Y *is unjust*"). The slide you observe misapplies "ought implies can" backwards: from "We *cannot* feasibly alter Y" to "Y *is not unjust*." This is a non-sequitur. A state of affairs can be profoundly unjust *even if* we lack feasible tools to fully rectify it (e.g., genetic luck).

  ### The Two Subsidiary Patterns: Integral to the Core
  1.  **"Non-Implementability Laundering":**
      *   This *is* part of the core phenomenon. The slide from "not addressable" to "not a matter of justice" is the *normative consequence* of administrative intractability. It launders the unfairness by moving it from the realm of "problems we wish we could solve" to "natural background conditions." Being born into a stable currency *is* a massive unearned advantage, but precisely because it's globally constitutive and untaxable, it rarely features as an "injustice" in national policy debates.
  2.  **Scale-Dependent Scandal (The Number Matters Because It's Easy):**
      *   This is the *flip side* of the core phenomenon operating *within* a tractable category. Inheritance tax debates fixate on large, easily quantifiable sums (£2M+) because they are administratively salient (easy to define thresholds, assess, tax). Smaller inheritances or lifetime gifts below reporting thresholds escape similar moral heat *within the same mechanism*, demonstrating that even *within* tractable domains, the *degree* of tractability (ease of quantification/enforcement) dictates moral/political intensity. The size isn't morally decisive *per se*; its ease of measurement and taxation makes it politically and morally salient.

  ### Naming the Phenomenon
  Given the lack of a perfect existing term, a sharp new label is warranted:
  **Moral Incongruence of Tractability (MIT)**

  **Definition:** *The systematic misalignment between the intensity of normative scrutiny applied to a mechanism of advantage transmission and its actual causal impact, driven primarily by the mechanism's administrative tractability. MIT manifests as heightened moral/political debate around easily regulated mechanisms and diminished recognition of injustice surrounding causally significant but intractable mechanisms, often leading to the latter being laundered as "natural," "private," or "beyond justice."*

  **Boundaries & Verdicts: What MIT Explains and Excludes**

  *   **Explains:**
      *   Why inheritance tax is hotly debated, while vastly more impactful advantages conferred via elite parenting, social capital, or early childhood investment are rarely framed as core injustices.
      *   Why carbon *pricing* (tractable emissions measurement) dominates climate policy debates over tackling embedded consumption patterns or global supply chains (intractable).
      *   Why AI safety focuses on benchmarkable capabilities (tractable) over diffuse societal harms or alignment failures (intractable).
      *   Why health policy prioritizes measurable outcomes (waiting times, specific disease mortality) over harder-to-quantify social determinants or holistic well-being.
      *   Why "sin taxes" (alcohol, tobacco) are popular – easy targets – while taxing sugar embedded in processed foods is harder and less discussed.
      *   Why large cash welfare payments attract intense scrutiny ("dependency"), while equivalent-value tax breaks for the wealthy (e.g., mortgage interest deduction, capital gains rates) are less morally contested – the latter are administratively embedded and less visible as direct transfers.
  *   **Excludes/Boundary Cases:**
      *   **Cases where tractability and impact align:** Debates over income tax rates involve a tractable mechanism *and* high causal impact. MIT predicts intense scrutiny, which occurs, but this isn't *caused* by the tractability distortion.
      *   **Core violations of bodily autonomy:** Debates on abortion or torture involve intense moral heat regardless of administrative tractability. Fundamental rights can override the MIT effect.
      *   **Deeply ingrained cultural/religious norms:** Attempts to ban certain practices (e.g., veiling, ritual slaughter) generate intense moral debate *despite* potential enforceability challenges, because core identity values are at stake. MIT is secondary here.
      *   **"Ought Implies Can" properly applied:** If a proposed solution is *genuinely impossible* (e.g., levying a tax requiring violating laws of physics), dismissing it isn't MIT, it's logical. MIT occurs when feasible-but-difficult or partial interventions *are* possible, but the mechanism is dismissed as "beyond justice" due to its complexity.
      *   **Conscious ideological acceptance:** If someone genuinely believes parental investment *is* morally neutral/positive regardless of inequality effects, that's an ideological stance, not necessarily MIT. MIT is revealed when the *primary stated reason* for dismissing its unfairness is its administrative intractability ("You couldn't write a rule...").

  ### Counterexamples to MIT
  A strong counterexample would be a mechanism that is:
  1.  **Highly Administratively Tractable:** Easy to measure, define rules for, and intervene upon.
  2.  **Causally Significant:** Creates major, demonstrable advantages/disadvantages.
  3.  **Receives Disproportionately *Low* Moral/Policy Scrutiny:** It's ignored or accepted despite meeting 1 & 2.
  Conversely, a mechanism that is **Intractable but receives *High* Moral Scrutiny** as a clear injustice would also counter MIT.

  *   **Potential Weak Counterexample:** Conspicuous consumption (e.g., mega-yachts). Tractable? (Visible, could be taxed via luxury taxes). Impactful? (Symbolic inequality, resource use). Scrutiny? Moderate, but often less intense than debates over income tax rates on the wealthy. *Why it might not fully counter:* The *impact* (beyond symbolism) is arguably less direct/causal than inheritance or human capital investment. The moral heat might be dampened by arguments about "freedom to spend."
  *   **Strong Counterexample Hard to Find:** This is telling. The persistence of MIT suggests it's a powerful force. Finding a clear case of a highly tractable, highly impactful mechanism *completely escaping* normative debate, or an intractable one being *centrally defined* as a core injustice demanding solutions *despite* its intractability, is difficult – which reinforces the validity of your observation.

  ### Using This Carving
  Your debate with the barrister hinges on whether recognizing the *causal impact* of intractable advantages (parenting, networks) should change our view of the *justice* of tackling the tractable ones (inheritance). MIT reveals that:
  1.  The barrister's instinct to dismiss concerns about parenting advantages ("can't write a rule") is classic MIT – laundering intractable unfairness.
  2.  However, MIT *doesn't* automatically make inheritance tax *unjust*. It highlights the *incoherence* of getting outraged *only* about inheritance while ignoring larger, earlier advantages. It argues for either:
      *   *Greater* seriousness about inheritance tax *as one necessary tool* against a broader landscape of advantage, OR
      *   Acknowledging that the *real* reason for opposing inheritance tax may be a deeper ideological acceptance of wealth concentration, using MIT arguments as a convenient shield.

  The power of naming MIT is in exposing this dynamic: **The administrative ease of targeting inheritance isn't a *moral* justification for taxing it, nor is the administrative difficulty of targeting early advantage a *moral* justification for ignoring it.** The moral evaluation of the *advantage itself* must be separated from the feasibility of intervention. MIT is the cognitive distortion that prevents us from doing this consistently. Your spreadsheet didn't just model money; it modeled the blinding effect of tractability on our moral vision.
