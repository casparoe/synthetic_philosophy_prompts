  Applying MIT to other areas like carbon pricing (easier to tax emissions than consumption) or AI safety (benchmarking measurable capabilities over unquantifiable harms) shows its broader relevance. The user's health policy example fits too—data availability drives policy focus. 

  I need to ensure the definition excludes cases where tractability isn't the primary factor. Also, distinguish from "ought implies can," which is about obligations, not injustice perceptions. The user emphasized not just labeling but carving out the concept's boundaries, so clarity on what MIT excludes is crucial. 

