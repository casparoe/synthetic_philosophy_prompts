answer: |-
  ### Final Exam Question  
  **Time Allowed:** 2 hours  
  **Closed Book**  
  **Answer the Question Below in Approximately 1,200 Words**  

  ---

  #### Case Study: Ridge and Harbour  
  Two communities exhibit distinctive emotional responses to wrongdoing:  

  **Ridge:**  
  After wrongdoing, individuals focus exclusively on the *act* committed. They report a strong obligation to repair harm (e.g., apologizing, compensating victims). If repair is impossible (e.g., the victim is dead or unreachable), the feeling vanishes entirely. They state, "The matter is finished; nothing can be done." Ridge has no concept resembling "shame"; the idea of being lowered in others’ estimation is unintelligible to them.  

  **Harbour:**  
  After wrongdoing, individuals focus exclusively on the *self* ("what I am"). They report intense desires to hide or disappear, describing a sense of inner exposure. Crucially, this feeling requires no audience—real, imagined, or internalized. They insist secrecy or public exposure would not alter their feeling, and there is no impulse to repair harm—only to conceal the self. This is seen as a permanent self-fact, not tied to specific acts.  

  ---

  #### Question  
  Using this case, address the following in sequence:  
  1. **Taxonomy Critique:** Can Ridge and Harbour’s emotions be coherently classified as "guilt" or "shame"? Does this case reveal these categories as culturally contingent vocabularies rather than universal emotions?  
  2. **Constitutive Features:** What would make a feature (e.g., "requires an audience" or "takes the self as object") *constitutive* of an emotion (necessary to its identity) rather than merely typical? Apply this to Ridge/Harbour.  
  3. **Intentional Cultivation:** Could a community deliberately become like Harbour? What would this "choice" entail given that the choosers already possess an emotional repertoire? **Take a clear stance on feasibility.**  

  ---

  ### Model Answer (780 words)  
  #### Taxonomy Critique  
  Ridge and Harbour destabilize standard guilt/shame classifications. Ridge exhibits guilt’s core reparative focus but lacks its typical social awareness; Harbour embodies shame’s self-object focus but lacks its typical social dimension. This suggests "guilt" and "shame" are not natural kinds but taxonomies built from contingent features. Ridge’s emotion centers on *repairing acts*: when repair fails, the emotion dissolves, confirming obligation-to-others as constitutive. Harbour’s emotion centers on *rejecting the self*: its independence from audience confirms self-assessment as constitutive. Neither maps perfectly to "shame" or "guilt" as psychologists define them (e.g., Harbour lacks shame’s sociality; Ridge lacks guilt’s lingering self-reproach). The case thus implies these categories reflect WEIRD (Western, Educated, Industrialized, Rich, Democratic) frameworks that prioritize certain features (e.g., guilt’s reparative impulse) while ignoring variants like Ridge’s pragmatic finality or Harbour’s asocial introspection.  

  #### Constitutive Features  
  A feature is *constitutive* if removing it destroys the emotion’s identity. Typical features are common but non-essential (e.g., blushing in shame). For guilt, reparative obligation appears constitutive: if the demand to "make things right" vanishes (as when Ridge deems repair impossible), guilt’s moral logic collapses. Conversely, shame’s constitutive core is *self-rejection*—judging the self (not the act) as defective. Harbour proves this can exist without an audience, challenging claims that shame is inherently social. The social dimension (e.g., fearing others’ eyes) is merely typical: it amplifies self-rejection but is not its essence. Ridge, meanwhile, shows guilt’s sociality (e.g., tracking harm to others) is typical, not constitutive: they feel obligated to victims but don’t internalize judgment when victims vanish. Thus, constitutive features define an emotion’s *moral function*: guilt addresses broken obligations; shame addresses a broken self.  

  #### Intentional Cultivation  
  A community *could* deliberately cultivate Harbour-like emotion by ritualizing self-focused, asocial responses to transgression. This would require two shifts:  
  1. **Reframing Values:** Elevate self-purity over social harmony. Wrongdoing must be framed as polluting the self, not harming others.  
  2. **Scaffolding Practices:** Design rituals (e.g., solitary confinement, introspective journals) that decouple self-assessment from social feedback.  

  However, this "choice" is constrained by existing emotional repertoires. If a guilt-prone community (like Ridge) attempted this, they would face dissonance: their constitutive focus on acts/repair resists reorienting toward the self. Conversely, a shame-prone society might more easily excise sociality—since self-rejection is already core—by suppressing audience-involving practices (e.g., ceasing public shaming). The "choice" is thus less about inventing new emotions and more about *amplifying latent features* while suppressing others. Harbour’s emotion is coherent but fragile; without social reinforcement, it risks collapsing into apathy or depression. Yet the case shows such a form is psychologically possible—and thus, cultivatable.  

  #### Conclusion  
  Ridge and Harbour expose guilt/shame as constructed categories. Constitutive features (repair for guilt, self-rejection for shame) persist amid cultural variation, while typical features (social awareness) are malleable. Harbour’s emotion, though radical, is viable if a community systematically divorces self-assessment from sociality. This reveals emotions as practices shaped by cultural "toolkits," not fixed biological responses.  

  ---  

  ### Marking Scheme (25 Total)  
  **Must-Hit Moves**  
  1. **Taxonomy Deconstruction (6 marks):** Argues Ridge/Harbour defy standard categories by isolating constitutive features. Rejects "Ridge=guilt, Harbour=shame" simplifications.  
  2. **Constitutive Feature Analysis (7 marks):** Defines constitutive vs. typical features using Ridge/Harbour. Identifies repair as constitutive for guilt (via Ridge) and self-rejection for shame (via Harbour).  
  3. **Sociality Critique (4 marks):** Uses Harbour to refute "shame requires an audience," showing self-assessment can be asocial.  
  4. **Cultivation Argument (5 marks):** Takes a stance on feasibility. Explains how rituals could foster Harbour-like emotion given pre-existing capacities.  
  5. **Constraint Recognition (3 marks):** Notes that "choosing" an emotion depends on current repertoire (e.g., guilt-centric societies would struggle).  

  #### A vs. B Differentiation  
  - **A (21–25):** Hits all moves. Explicitly distinguishes constitutive/typical features using the case. **Crucially:** For cultivation, specifies *how* rituals would decouple self-assessment from sociality (e.g., "suppressing public accountability practices").  
  - **B (16–20):** Hits moves 1, 2, and 4 but underserves 3 or 5. May call Harbour "shame" without justifying its asociality, or vaguely state "emotions can change" without addressing constraints.  

  #### Concrete Mistakes (Deduct 3–5 marks each)  
  1. **"Ridge has guilt; Harbour has shame":** Ignores deviations (e.g., Ridge’s emotion vanishing sans repair). Shows confusion about constitutive features.  
  2. **"Harbour is impossible; shame needs an audience":** Assumes sociality is essential. Fails to engage Harbour’s self-object focus as potentially constitutive.  
  3. **Vague cultivation claims (e.g., "They could just decide to feel differently"):** Neglects how emotions are scaffolded by practices/repertoires.  
  4. **Conflating emotions with pathology (e.g., "Harbour is just depression"):** Misapplies psychology; ignores that emotions are defined by intentional objects (e.g., self vs. act).  
  5. **Ignoring sequence:** Fails to answer questions in order (e.g., jumps to cultivation before defining constitutive features).  

  ---  
  **Rationale:** This scheme rewards dismantling assumptions (e.g., Harbour’s impossibility) and forces engagement with *how* emotions are constituted. The A/B divide hinges on precision about constitutive features and cultivation mechanics.
