  Next, case B: Presentist vs. Eternalist. Both agree on temporal facts but differ on using "there is" for past entities. Translating their claims into a tenseless language should resolve it. The eternalist's "dinosaurs exist (tenselessly)" and the presentist's "dinosaurs existed" are equivalent once paraphrased. No leftover substantive issue.

  Then case A: Archaeologists counting longhouses. They agree on all physical evidence but use different criteria—continuity vs. construction. This is about defining "building." Once specified as "building-continuity" or "building-construction," the dispute dissolves. However, there might be a practical residue: which definition is more useful for archaeological purposes, but that's not metaphysical.

  Case E: Statue and lump. They agree on all physical properties and counterfactuals but differ on counting objects. Paraphrasing with phase sortals ("statue-stage" vs. "lump-stage") could help, but the disagreement persists on whether two coinciding objects can exist. That seems like a genuine metaphysical issue about identity conditions, leaving some residue.

  Finally, case C: Set theorists. Universist vs. Pluralist. They agree on all mathematical outcomes but disagree on whether "the universe" is singular. Eliminating "universe" by using multiverse language or modal operators might work, but the core issue—whether there's a single maximal structure—resists full deflation. The residue feels ontological, touching on the nature of mathematical reality.

  Now, considering the user's deeper needs: They might be struggling to distinguish linguistic from substantive disagreements. By ranking these cases, they need clarity on applying deflation tests. Also, their unspoken request could be validation of their self-made examples versus standard ones, ensuring they grasp the concepts sufficiently for their seminar.
answer: |-
  1. **D**: The Agarians' dispute is most deflatable. Apply quantifier variance: replace their "there is" with explicitly restricted quantifiers ("spatiotemporally located" vs. unrestricted). All agreed arithmetic truths remain identical under paraphrase (e.g., "Prime numbers are*" where * denotes Agarian quantification). Zero residue survives; the dispute solely concerns permissible domains for existential quantification.  

  2. **B**: The eternalist/presentist dinosaur dispute is highly deflatable. Paraphrase all existence claims using tense operators or explicit time-indexing (e.g., eternalist's "Dinosaurs exist simpliciter" becomes "Dinosaurs exist-at-t"). Both already agree on the truth of "Dinosaurs existed" and all empirical facts. No residue remains; the disagreement is purely about the semantics of "exists" unmodified by tense.  

  3. **A**: The longhouse dispute is deflatable but leaves pragmatic residue. Disambiguate "building" into *building-continuity* (use-based) and *building-construction* (episode-based). Both archaeologists agree on all physical features and histories. The residue is practical: which concept is *more useful* for archaeological explanation or classification, but this isn't a metaphysical truth.  

  4. **E**: The statue/lump dispute resists full deflation. Paraphrase with phase sortals ("statue-stage," "lump-stage") or temporal parts. While counterfactuals and dispositions are agreed, a residue persists: *whether coincidence entails identity*. The "two things/one thing" disagreement reflects a deeper divergence about the conditions for object individuation, not fully eliminable by paraphrase.  

  5. **C**: The set-theoretic universe dispute is least deflatable. Eliminate "the universe" via multiverse language ("in all universes...") or modal operators ("necessarily, CH is indeterminate"). However, a substantive residue endures: *whether mathematical reality is absolute or inherently perspectival*. The pluralist/universist clash reflects an ontological divide about the uniqueness of mathematical structure that paraphrasing cannot fully resolve.
