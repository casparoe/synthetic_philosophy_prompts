prompt: |-
  ok so in my metaphysics seminar we're on the verbal-disputes unit right now and I'm supposed to bring a set of cases to section, but instead of using the ones from the readings I made up my own and now I honestly can't tell which of them are actually deflatable. here's what I've got:

  A. Two site archaeologists standing over the same trench. They agree about every stratigraphic fact, every radiocarbon date, every posthole. One says the pattern is one longhouse, the other says it's three longhouses in a row — the first counts buildings by continuity of use, the second by construction episode. Neither will budge, and they both know the others counting rule perfectly well.

  B. A presentist and an eternalist arguing about whether dinosaurs exist. Both accept that "there were dinosaurs" is true, both accept the same fossil record, both can give the same account of the truth conditions of ordinary tensed sentences. The eternalist just insists dinosaurs belong to the totality of what there is, full stop, while the presentist says that's a misuse of "there is".

  C. Two set theorists, a pluralist and a universist, arguing whether the continuum hypothesis is true. They know the independence results equally well, they agree on which candidate axioms are most fruitful, they agree on every theorem. What they actually disagree about is whether "the set-theoretic universe" picks out one thing.

  D. A community I'll call the Agarians, who speak a language in which "there is" can only be applied to things with a determinate location in space and time. So they say there are no prime numbers, while accepting literally every arithmetic sentence we accept, including all the same theorems about primes and the same proofs of them.

  E. Two people arguing about whether the statue is the lump of clay. They agree on all the microphisical facts, on all the counterfactuals (what would survive being squashed, what would survive being melted down), and on every sorting disposition of competent speakers. One says "then there are two things here", the other says "then there's one".

  Rank these five from most deflatable — meaning that declaring it merely verbal costs you nothing — to least deflatable, where declaring it merely verbal leaves a genuine question sitting there unanswered. For each one tell me which test you'd actually run on it, and what residue, if any, survives once the disputed term gets eliminated or paraphrased away.

  Give it to me as exactly five numbered items in rank order, most deflatable first, each one starting with the case letter and running to a sentence or two. No introduction, no conclusion, don't summarise at the end.
