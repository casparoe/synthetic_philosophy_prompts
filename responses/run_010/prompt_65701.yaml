prompt: |-
  A friend and I argued until nearly two in the morning last night about the moral equality of combatants, and toward the end he restated the Walzerian position back to me in terms I could not rebut on the spot. He said it comes to this: "The doctrine holds that a soldier's cause makes no moral difference whatever, so a Wehrmacht conscript and an RAF bomber crewman stand on precisely the same footing and either may permissibly be killed. Walzer gets there by treating war as a contest: pick up a weapon and you forfeit your right not to be killed, the sole ground of the permission being that you are now dangerous. So the justice of the war drops out of the ethics of fighting altogether — which is why Walzer is prepared to call soldiers on the aggressor's side morally innocent, and why nothing beyond war crimes is left to condemn. And because the whole apparatus is an extension of ordinary self-defense law, he has to apply it uniformly, including in a supreme emergency." From which he concluded that anyone who regards aggressive war as the gravest of crimes is obliged to reject the moral equality of combatants outright.

  I suspect he is flattening the position, though I got tangled when I tried to say where, and I do not think he invented it out of whole cloth either. Please go through his summary claim by claim: which parts a careful Walzerian would endorse, which are misrepresentations or conflations, and which remain contested even among those who accept the equality. Two specific points I could not settle. First, is supreme emergency really a case of applying the self-defense logic uniformly, or does it cut the other way and import considerations about the justice of the cause into the rules of conduct? Second, what does the equality actually rest on — dangerousness and status, some notion of reciprocity or mutual consent, or a convention that soldiers themselves endorse? Finally, once the summary is corrected, does his conclusion survive: does the revisionist insistence that liability to attack requires responsibility for an unjust threat bite any harder against the accurate version than against his caricature?
reasoning: |-
  Okay, let me start by unpacking the user's query. They had a late-night debate with a friend about the moral equality of combatants, specifically focusing on Michael Walzer's position. The friend summarized Walzer's view in a way that the user couldn't immediately rebut, leading to some lingering doubts. The user wants a detailed analysis of their friend's summary, corrections where necessary, and answers to specific questions about supreme emergency and the basis of moral equality. They also want to know if rejecting moral equality is necessary for those who view aggressive war as a grave crime.

  First, I need to recall Walzer's arguments from "Just and Unjust Wars." His core idea is the separation between jus ad bellum (justice of going to war) and jus in bello (conduct during war). The moral equality of combatants means soldiers on both sides have the same rights and liabilities in combat, regardless of the war's justice. The friend's summary emphasizes that picking up a weapon makes one dangerous, thus forfeiting the right not to be killed. The user questions if this oversimplifies Walzer.

  Looking at the friend's claims: 
  - The cause doesn't affect a soldier's moral standing. That's accurate to Walzer. He sees soldiers as instruments, not moral agents for the war's justice.
  - Treating war as a contest where weapon possession forfeits rights. Walzer does use self-defense analogies, but it's more about the context of war creating mutual threats.
  - Soldiers as morally innocent. Walzer does call them "innocent" in a specific sense—they aren't responsible for the war decision. But "innocent" here is tricky; it's functional, not moral absolution.
  - Supreme emergency applying self-defense uniformly. Walzer's supreme emergency is actually where he allows bending in bello rules due to ad bellum concerns, which contradicts strict separation. So the friend's claim here is a misrepresentation.

  The user's two specific points: 
  1. Supreme emergency: This is where Walzer introduces an exception based on the war's justice, so it doesn't uniformly apply self-defense logic. Instead, it shows that extreme ad bellum concerns can override in bello rules. The friend got this wrong.
  2. Basis of equality: Walzer's reasoning combines dangerousness, status, and reciprocity. Soldiers are dangerous due to their role, their status makes them liable, and reciprocity among soldiers accepts mutual vulnerability. It's not just one factor.

  The user's deeper need might be understanding if Walzer's position holds under scrutiny, especially regarding aggression as a grave crime. The friend concluded that anyone against aggression must reject moral equality. Revisionists like McMahan argue that liability requires contributing to an unjust threat. However, Walzerians maintain that the separation is necessary for practical and moral reasons in war's context. The user might be grappling with reconciling the intuitive wrongness of aggression with the rules of engagement in war. They need clarity on whether revisionist critiques undermine Walzer's structure fundamentally or if the two frameworks address different concerns.

  I should also consider the user's identity. They're engaged in deep philosophical debate, likely with a background in ethics or political philosophy. Their unspoken need might be to resolve cognitive dissonance between the moral outrage towards aggressors and the pragmatic rules of war. They want to know if Walzer's model can be defended or if revisionism is inevitable when taking aggression seriously.

  In conclusion, correcting the friend's summary shows Walzer's position is more nuanced, especially regarding supreme emergency. The revisionist critique does challenge the moral equality, but Walzerians argue that their model's practicality and the distinct role of soldiers in war justify maintaining the separation, even if aggression is a grave crime. The user can reject moral equality, but it's not obligatory; they might find Walzer's practical approach compelling despite its theoretical tensions.
answer: |-
  Your friend presents a forceful but partially flattened version of Walzer's moral equality of combatants (MEC). Let's dissect his summary claim-by-claim, correct the inaccuracies, address your specific points, and evaluate his conclusion.

  **Deconstructing the Summary:**

  1.  **"The doctrine holds that a soldier's cause makes no moral difference whatever, so a Wehrmacht conscript and an RAF bomber crewman stand on precisely the same footing and either may permissibly be killed."**
      *   **Careful Walzerian Endorsement:** This is largely accurate regarding *jus in bello* permissions and liabilities. Walzer explicitly argues that *within the rules of war*, the justice of their cause (*jus ad bellum*) doesn't change the moral permission for opposing soldiers to target each other or their liability to be targeted. Both the conscript and the bomber crewman are legitimate targets. Their *moral guilt* for participating in an unjust war is a separate question (see point 3).

  2.  **"Walzer gets there by treating war as a contest: pick up a weapon and you forfeit your right not to be killed, the sole ground of the permission being that you are now dangerous."**
      *   **Misrepresentation/Over-Simplification:** This is a significant flattening.
          *   **Contest Analogy:** While Walzer uses the language of "duel" or "battlefield equality," he grounds it in deeper moral and political realities, not merely a game-like contest. The key isn't just picking up a weapon *per se*.
          *   **Forfeiture & Dangerousness:** Dangerousness is *necessary* but **not sufficient** for Walzer. A civilian pointing a gun is dangerous but doesn't automatically become a legitimate target under the laws of war. The crucial element is **status and role**: becoming a soldier means assuming a specific social role defined by the state, which entails being both a threat *and* being liable to reciprocal threat. The forfeiture stems from **voluntarily or conscriptedly entering the military institution** whose role is collective violence, not merely the momentary act of holding a weapon. It's institutional role + dangerousness that grounds liability in Walzer's view.

  3.  **"So the justice of the war drops out of the ethics of fighting altogether — which is why Walzer is prepared to call soldiers on the aggressor's side morally innocent..."**
      *   **Partial Endorsement with Crucial Nuance:**
          *   **Ad Bellum Drops Out of In Bello Permissions:** Yes, Walzer strenuously argues that *jus ad bellum* judgments should not determine who is a legitimate target or what tactics are permissible *within* the fighting (*jus in bello*). This separation is core to MEC.
          *   **"Morally Innocent":** This is Walzer's most controversial and easily misunderstood term. He *does* call soldiers "moral equals" and uses "innocent" in a very specific, **functional** sense within the war convention: Soldiers are "innocent" *in the sense that they are not criminally responsible for the state's decision to go to war*. They are instruments of the state. He explicitly **denies** that they are morally *blameless* or *sinless* for fighting in an unjust war. He states they can be "murderers" in the deep moral sense. His point is that the *war convention itself* treats them symmetrically *regardless* of this deeper moral guilt. Calling them "innocent" is primarily about their status *within the convention*, not an absolution of moral responsibility.

  4.  **"...and why nothing beyond war crimes is left to condemn."**
      *   **Misrepresentation:** This is incorrect. Walzer absolutely condemns soldiers fighting for an unjust cause. He believes they participate in an immense moral wrong. His point is that this condemnation pertains to *jus ad bellum* (their participation in aggression) and their individual moral failure, not that it makes them liable to attack *beyond the standard rules of war* or that it creates new *in bello* permissions for their opponents. Condemnation exists on multiple levels: war crimes, participation in aggression, and individual moral failing.

  5.  **"And because the whole apparatus is an extension of ordinary self-defense law, he has to apply it uniformly, including in a supreme emergency."**
      *   **Partial Endorsement with Major Caveat (Supreme Emergency):**
          *   **Self-Defense Analogy:** Walzer *does* use self-defense analogies, particularly concerning the immediacy of the threat posed by enemy soldiers. The core idea that facing an imminent, lethal threat licenses lethal force in response is analogous.
          *   **"Has to apply it uniformly":** This is where it breaks down, especially concerning **supreme emergency**.
          *   **Supreme Emergency:** This is Walzer's **major exception** to the strict separation of *jus ad bellum* and *jus in bello*. He argues that when a political community faces imminent annihilation (a supreme emergency), *the justice of the cause (its defense against annihilation) can temporarily override the deepest constraints of *jus in bello* (e.g., the prohibition on deliberately targeting civilians)*. **This explicitly imports *jus ad bellum* considerations (the extremity and justice of the cause) into *jus in bello* rules.** It directly contradicts the claim that the self-defense logic is applied uniformly *regardless* of cause in all situations. Supreme emergency is Walzer acknowledging that the separation *can* break down under extreme *ad bellum* pressure. Your friend's claim here is a **significant misrepresentation** of Walzer.

  **Addressing Your Specific Points:**

  1.  **Supreme Emergency & Self-Defense Logic:**
      *   Your suspicion is correct. Supreme emergency **does not** demonstrate the uniform application of self-defense logic regardless of cause. Instead, it **cuts the other way entirely**. It shows Walzer conceding that under the most extreme *ad bellum* circumstances (a community facing utter destruction in a just defensive war), the *justice of the cause* can justify actions normally forbidden by the *in bello* rules derived from the self-defense/reciprocity model (i.e., deliberately targeting civilians). It's an *ad bellum* consideration overriding a core *in bello* prohibition. This is Walzer's most significant departure from pure symmetry.

  2.  **Basis of Moral Equality:**
      *   Walzer's grounding is **multifaceted** and not reducible to a single factor. A careful reading shows it rests on:
          *   **Status/Role:** Being a soldier signifies membership in a group whose function is collective violence. This status entails reciprocal rights and liabilities.
          *   **Dangerousness:** Soldiers are trained and equipped to pose a lethal threat. This is a necessary condition for liability but insufficient alone (as per the civilian-with-a-gun example).
          *   **Reciprocity/Mutual Consent (Implied):** Soldiers accept the risk of being targeted as part of their role. The war convention functions as a set of mutually agreed-upon rules between combatants, establishing boundaries *among themselves*.
          *   **Convention/Practical Necessity:** Walzer heavily emphasizes the practical need for clear, enforceable rules in the chaos of war. Separating *ad bellum* from *in bello* and establishing symmetrical combatant status is seen as essential for limiting brutality and making any ethics of war possible. Soldiers themselves largely operate within and endorse this convention.
      *   **It's not *just* dangerousness, nor *just* a convention, nor *just* reciprocity, but a complex interplay centered on the *institution of soldiery* and the practical need for rules governing combat between them.

  **Evaluating Your Friend's Conclusion:**

  *   **His Conclusion:** "Anyone who regards aggressive war as the gravest of crimes is obliged to reject the moral equality of combatants outright."
  *   **Analysis:** This conclusion **largely survives** the correction of his summary, but the reasons are more nuanced than his caricature suggested, and Walzerians have responses.
      *   **The Core Tension:** Revisionists like Jeff McMahan fundamentally argue that liability to defensive killing stems from **moral responsibility for an unjust threat**. If aggressive war is a supreme crime, then soldiers participating in it (even conscripts to some degree) bear some responsibility for contributing to that immense, unjustified threat. Therefore, they argue, soldiers fighting justly *cannot* have the same moral liability to be killed as soldiers fighting unjustly. The permission to kill them stems from their responsibility for wrongdoing, not merely their dangerousness or status. Rejecting MEC is central to this view.
      *   **Biting Harder?** The revisionist critique bites **just as hard, if not harder,** against the *accurate* Walzerian position. The corrected version makes Walzer's reliance on *status/role/convention* clearer, but revisionists argue this ignores the underlying moral reality of individual responsibility. They see Walzer's "functional innocence" as a dangerous fiction masking moral complicity. Walzer's supreme emergency exception even *reinforces* the revisionist point by showing Walzer himself implicitly acknowledges the relevance of *ad bellum* justice to *in bello* permissions in extremes – revisionists argue this relevance exists throughout.
      *   **The Walzerian Defense:** Walzerians counter that the revisionist view is impractical, risks escalating brutality (by removing mutual constraints based on status), undermines non-combatant immunity (by focusing on individual responsibility rather than clear status), and fails to recognize the unique moral context of war where soldiers are agents of states. They argue that holding soldiers individually responsible for the justice of the war is often impossible or unfair, and the convention, while imperfect, is the best way to limit horror. They maintain that condemning participation in aggression morally *is* possible and necessary *without* making those soldiers liable to attack under different rules during combat.

  **In essence:** Your friend's conclusion that viewing aggressive war as a grave crime logically compels rejection of MEC is a core revisionist position. While his summary flattened Walzer, the fundamental tension between individual moral responsibility for aggression and symmetrical combatant status remains the central battleground. Revisionists argue their view is more morally coherent; Walzerians argue it's dangerously destabilizing. Rejecting MEC *is* the revisionist program, and your friend accurately identified the logical connection to condemning aggression. Whether one finds the revisionist critique ultimately convincing or the Walzerian practical concerns overriding is the heart of the ongoing debate.
