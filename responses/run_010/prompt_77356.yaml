  **THE GAZETTE-STANDARD: INTERNAL STYLE DIRECTIVE 7.41**  
  **RE: ELIMINATION OF DEFINITE DESCRIPTIONS**  
  **ISSUED BY THE COPY DESK CHIEF, EFFECTIVE IMMEDIATE**  

  ---

  **1. GENERAL PROHIBITION**  
  All phrases of the form "the [X]" are prohibited unless the reporter possesses verified evidence that exactly one [X] exists at the time of writing, and that the subsequent predication applies uniquely to it. Paraphrase using the form: "There exists exactly one [X], and it is [Y]."  

  *Example (Metro Section):*  
  **UNACCEPTABLE:** "The suspect fled north on Elm Street."  
  **ACCEPTABLE:** "Police state there exists exactly one suspect matching their description, and that person fled north on Elm Street."  

  *Practical Note:* Verification of uniqueness is mandatory. If the Metro desk cannot confirm there is exactly one pothole on Main Street, the phrase "the pothole" is inadmissible.  

  ---

  **2. NEGATION PLACEMENT**  
  Negation must explicitly indicate whether it targets the existence clause, the predication clause, or both. Ambiguity in scope constitutes editorial negligence.  

  *Example (International Headline):*  
  **UNACCEPTABLE:** "The King of France is not bald."  
  **ACCEPTABLE (SCOPE A):** "It is not the case that there exists exactly one King of France who is bald." (Leaves open existence.)  
  **ACCEPTABLE (SCOPE B):** "There exists exactly one King of France, and he is not bald." (Asserts existence.)  

  *Failure Case:* The original headline is neither true nor false; it is truth-valueless and thus unfit for print.  

  ---

  **3. POLICY: SPECIAL SECTIONS**  
  **3.1 Horoscopes:** Astrological predictions inherently lack unique referents (e.g., "the Libra"). Rewrite using indefinite descriptions: "A person born under the sign Libra might experience..."  
  **3.2 Restaurant Reviews:** Claims like "the best steak" are superlative definite descriptions requiring exhaustive verification. Replace with: "A steak served at Luigi's met the reviewer’s highest rating this month among steaks sampled."  
  **3.3 Local History:** Descriptions like "the first mayor" demand archived proof of uniqueness. If documentation is incomplete, use: "An individual widely regarded as the first mayor..."  

  *Legal Rationale:* A libel suit arising from false uniqueness claims (e.g., falsely asserting Luigi’s has *the* best steak) carries punitive damages. Existence claims are verifiable.  

  ---

  **4. LETTER TO THE EDITOR & RESPONSE**  
  **LETTER (PUBLISHED):** "Your story 'The Founder's Portrait Missing' is nonsense. Since no such portrait exists, it’s not missing! You didn’t say anything false; you failed to say anything at all." — M. Strawson, Philosophy Dept., Claybourne College  

  **COPY DESK REPLY (PUBLISHED):**  
  The Gazette-Standard regrets any confusion. The sentence "The Founder’s Portrait is missing" was correctly deleted in proofs. The published text ("Curators report no portrait matching the commonly cited description of the Founder is in the collection") asserts no existence claim. Our policy ensures all statements possess truth values.  

  ---

  **5. DIRECT OBSERVATION RULE**  
  Even when a reporter observes an individual satisfying a description (e.g., "the defendant" in court), the description remains prohibited if uniqueness is not legally established.  

  *Example (Courtroom):*  
  **UNACCEPTABLE:** "The defendant wept during testimony."  
  **ACCEPTABLE:** "A man identified by the court as the defendant, and whom the reporter observed directly, wept during testimony."  

  *Reason:* The individual’s *being* the defendant is a contingent fact. The description’s truth conditions extend beyond the newsroom’s sensory data.  

  ---

  **6. BELIEF REPORTS**  
  Do not substitute co-referring descriptions within reports of attitudes. Truth preservation under substitution is not guaranteed.  

  *Example (City Council):*  
  **UNACCEPTABLE:** "Councillor Blake believes the longest-serving firefighter deserves the award." [If rewritten as:] "Councillor Blake believes Joe Miller deserves the award."  
  **ACCEPTABLE:** Retain the original description used in the attribution: "Councillor Blake believes the longest-serving firefighter deserves the award."  

  *Reason:* Councillor Blake may not know Joe Miller *is* the longest-serving firefighter. Substitution risks misrepresenting her belief’s content.  

  ---

  **SIDEBAR: COPY DESK QUERIES (WEEK OF 10/23)**  
  > **TO METRO:** "Your lead: 'The protest organizer addressed the crowd.' Verify exactly one organizer exists and that this person addressed the crowd. If not, paraphrase."  
  > **TO OBITS:** "'He was the beloved father of three.' Confirm no other beloved fathers exist in the familial context. If unverifiable, use 'a beloved father.'"  
  > **TO SPORTS:** "'The team’s star quarterback threw the winning pass.' Verify: (a) exactly one star quarterback on the team, (b) exactly one winning pass thrown. Rewrite."  
  > **TO ARTS:** "'The curtain fell on the final performance.' Does 'the final performance' uniquely identify one event? Or use 'a performance billed as the final run.'"  

  ---

  **CLOSING NOTE FROM THE COPY CHIEF:**  
  This directive eliminates a persistent source of logical hazard and legal exposure. Its consistent application ensures every sentence printed by *The Gazette-Standard* expresses a determinate proposition capable of being true or false. Adherence is mandatory. Remember: When in doubt, ask whether there exists exactly one such thing, and whether you can prove it. The integrity of the paper depends on it.  

  ---  
  **APPROVED BY:** Legal Department, Managing Editor  
  **DISTRIBUTION:** All Editorial Staff, Freelancers  
  **(This directive constitutes the present style guide.)**
