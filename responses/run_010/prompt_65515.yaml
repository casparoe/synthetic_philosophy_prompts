answer: |-
  Below is a diagnostic instrument designed to surface assumptions about coordination failure structures and remedies. It consists of 12 forced-choice questions based on concrete cases, avoiding jargon. The instrument is structured as a **two-stage matrix** with independent diagnostic and remedial axes, reflecting the hypothesis that diagnoses do not rigidly determine remedies. Each question uses one of the specified cases, ensuring all are covered at least once. The instrument is scorable by hand from a printed sheet.

  ---

  ### **Diagnostic Instrument: Coordination Failure Assumptions**

  **Instructions:** For each scenario, select the one option that best reflects your view. Answer based on your immediate reaction; there are no right or wrong answers.

  1. **Pre-deployment testing (Laboratories):** Several labs face a better-funded rival setting a fast pace. Under-investment in safety testing occurs because:  
     a) Each lab fears losing ground if it tests more, though all would benefit collectively.  
     b) Labs that test thoroughly are outcompeted and replaced by faster-moving ones.  
     c) Testing is inherently inefficient; the rival’s pace is optimal.  

  2. **Tax competition (Jurisdictions):** Jurisdictions lower taxes to attract businesses. This outcome is:  
     a) Worse than a realistic scenario where all jurisdictions sustain higher taxes and better services.  
     b) Worse than an ideal but unreachable scenario without tax competition.  
     c) Not worse; competition ensures efficiency.  

  3. **Open-access fishery:** Overfishing primarily harms:  
     a) Fishers themselves (e.g., lower long-term catches).  
     b) Outsiders (e.g., future generations or ecosystems).  
     c) No one directly; each fisher acts rationally given others’ actions.  

  4. **Publication counts (Academic departments):** Declining research quality stems from:  
     a) Departments prioritizing short-term output over long-term impact.  
     b) Competition forcing lower quality even if all departments are patient and far-sighted.  

  5. **Advertising expenditure (Industry):** High advertising persists because:  
     a) Current firms are mutually locked in (cutting ads loses share to rivals).  
     b) New entrants who advertise aggressively replace firms that cut ads.  

  6. **Arming for peace (States):** Mutual arming that yields durable peace is:  
     a) A coordination failure (excessive spending could be reduced).  
     b) Not a failure; peace justifies the costs.  

  7. **Academic publication incentives:** Departments compete on publication counts primarily to:  
     a) Gain rank *relative* to peers.  
     b) Achieve higher *absolute* research output.  

  8. **Sustainable common-pool resource (Local users):** Success without external enforcement relies on:  
     a) Penalties for overuse (e.g., fines or sanctions).  
     b) Stable membership and shared community norms.  
     c) Easy monitoring of user actions.  
     d) No threat of overuse; the resource is abundant.  

  9. **Solving overfishing (Open-access fishery):** The best approach is:  
     a) A tax on fishing.  
     b) Limiting the number of fishers.  
     c) Better monitoring of fish stocks and catches.  
     d) A binding agreement among fishers with penalties.  

  10. **Ensuring safety testing (Laboratories):** Best solved by:  
      a) Subsidies for testing.  
      b) Merging labs into fewer entities.  
      c) Independent verification standards.  
      d) A binding pact among labs to test adequately.  

  11. **Halting tax races (Jurisdictions):** Best achieved via:  
      a) A minimum tax floor (e.g., federal policy).  
      b) Forming a tax-harmonizing union.  
      c) Transparent reporting of tax breaks.  
      d) A binding inter-jurisdiction tax treaty.  

  12. **Reducing advertising wars (Industry):** Best addressed by:  
      a) An advertising tax.  
      b) Industry consolidation (mergers).  
      c) Third-party verification of ad claims.  
      d) A voluntary industry cap on ad spending.  

  ---

  ### **Scoring Key and Position Mapping**

  #### **Step 1: Determine Diagnostic Axis (Nature of Trap)**  
  Score based on Q1–7:  
  - **Agentic trap (A):** Q1=a, Q2=a, Q4=a, Q6=a. *Assumes traps arise from players’ strategic reasoning.*  
  - **Selection trap (S):** Q1=b, Q2=a, Q5=b, Q6=a. *Assumes traps arise from competitive replacement, not player choices.*  
  - **Deflationary (D):** Q2=c or Q6=b. *Denies a trap exists (baseline is optimal or ideal is unreachable).*  

  #### **Step 2: Determine Remedial Axis (Locus of Leverage)**  
  Tally remedial choices (Q8–12). The most frequent option indicates remedial preference:  
  - **Payoffs (P):** Q8=a, Q9=a, Q10=a, Q11=a, Q12=a. *Alters incentives (e.g., taxes/subsidies).*  
  - **Composition (C):** Q8=b, Q9=b, Q10=b, Q11=b, Q12=b. *Changes player set (e.g., entry barriers or mergers).*  
  - **Information (I):** Q8=c, Q9=c, Q10=c, Q11=c, Q12=c. *Improves measurement/verification.*  
  - **Commitment (M):** Q8=a/d, Q9=d, Q10=d, Q11=d, Q12=d. *Enables credible agreements.*  
  - **Rejection (R):** Q8=d, Q9=e (if available), Q10=e, Q11=e, Q12=e (none). *Rejects intervention or diagnosis.*  

  #### **Step 3: Map to Named Positions**  
  Combine diagnostic (A/S/D) and remedial (P/C/I/M/R) results. The matrix below lists positions, their defining commitments, and "awkward case" (the scenario each position handles worst).  

  | Position                          | Diagnostic + Remedial | Defining Commitment                                  | Awkward Case (Handles Worst)                     |  
  |-----------------------------------|------------------------|------------------------------------------------------|--------------------------------------------------|  
  | **Agent-level dilemmas**          | A + P                  | Payoff changes resolve traps (e.g., Pigouvian taxes). | *Advertising*: Neutralization makes taxes ineffective for positional goods. |  
  | **Selectionist fatalism**         | S + R                  | Incentives fail; traps persist as defectors are replaced. | *Sustainable commons*: Shows selection can be overcome without top-down control. |  
  | **Consolidationist**              | Any + C                | Reducing players (even to a singleton) is key.        | *Arming for peace*: Consolidation (e.g., world government) is unrealistic and destabilizing. |  
  | **Measurement reformer**          | Any + I                | Binding constraint is verification, not enforcement.   | *Academic publications*: Quality is hard to measure; quantity competition persists. |  
  | **Ostromian polycentrist**        | A + M/C                | Self-governing groups enable credible commitments.     | *Laboratories*: External rivals undermine group stability. |  
  | **Baseline deflationist**         | D + R                  | "Trap" dissolves when baseline is specified precisely. | *Open-access fishery*: Overfishing is empirically robust across contexts. |  
  | **Persuasion optimist** (Rare)    | S + M                  | Selection traps can be escaped by persuasion-driven commitments. | *All cases*: Selection pressure replaces cooperators (internally inconsistent). |  

  #### **Unnamed Positions**  
  - **Agentic + Information (A+I):** Payoff alterations are insufficient, but verification helps. *Plausible but uncommon; e.g., Q9=c for fisheries.*  
  - **Selection + Payoffs (S+P):** Incentives can override selection. *Incoherent; selection makes incentives moot (defectors undercut).*  

  ---

  ### **Logical Space and Unoccupied Combinations**  
  The instrument uses two independent axes:  
  - **Diagnostic axis:** {Agentic (A), Selection (S), Deflationary (D)}.  
  - **Remedial axis:** {Payoffs (P), Composition (C), Information (I), Commitment (M), Rejection (R)}.  

  **Permitted combinations:** 3 × 5 = 15 cells. Occupied cells (7) align with named positions above.  

  **Unoccupied cells and reasons:**  
  - **S+P (Selection + Payoffs):** *Incoherent.* Selection voids incentives (defectors enter/undercut).  
  - **D+P (Deflationary + Payoffs):** *Unattractive.* If no trap exists, interventions are wasteful.  
  - **A+R (Agentic + Rejection):** *Unattractive.* Agentic traps imply agency, so rejection is contradictory.  
  - **S+C/M (Selection + Composition/Commitment):** *Occupied* (Consolidationist/Ostromian).  
  - **D+C/I/M (Deflationary + Composition/Information/Commitment):** *Unoccupied.* Deflationists reject intervention.  
  - **S+I (Selection + Information):** *Plausible but rare.* Measurement helps but doesn’t stop selection.  

  **Cell of interest (S+M: Selection + Commitment):**  
  - **Status:** Logically unstable.  
  - **Reason:** If a trap is selection-driven, persuasion-based commitments fail because cooperators are replaced by defectors. This collapses into fatalism (S+R) or requires composition changes (S+C). No real-world examples occupy this cell sustainably.  

  ---

  ### **Limitations and Pairs the Instrument Cannot Separate**  
  1. **Ostromian vs. Consolidationist:** Both favor group-based solutions. Ostromians prefer polycentricity (Q8=b/d); Consolidationists prefer centralization (Q10–12=b).  
     - *Additional question to separate:* "In a sustainable commons, success hinges on:  
       a) Local user autonomy (even with multiple groups).  
       b) Centralized control (fewer decision-makers)."  

  2. **Measurement Reformer vs. Agent-level Dilemmas:** Both may support information (e.g., Q11=c for taxes). Measurement Reformers prioritize verification *over* payoffs; Agent-level prioritizes payoffs.  
     - *Additional question to separate:* "In fisheries, the core problem is:  
       a) Fishers' incentives (profit drives overuse).  
       b) Inability to track catches and stocks accurately."  

  3. **Deflationist vs. Selectionist Fatalism:** Both may reject remedies (R), but Deflationists deny traps (Q2=c/Q6=b), while Fatalists accept traps but deem them unfixable (S+R).  
     - *No additional question needed:* Diagnostic axis (Q1, Q5, Q6) distinguishes them.  

  **General limitations:**  
  - The instrument simplifies multidimensional views (e.g., Ostromians may blend commitment and composition).  
  - Mixed remedial preferences (e.g., equal scores in P/C/I) require adjudicating the most frequent choice.  
  - "Persuasion optimist" (S+M) is included for completeness but is empirically vacant.  

  ---

  This instrument surfaces assumptions by forcing concrete choices, avoids self-identification, and delivers a scorable matrix. The two-axis design isolates diagnostic and remedial beliefs, revealing where participants diverge on structure versus leverage.
