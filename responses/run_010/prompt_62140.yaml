prompt: |-
  You're a decision theorist — specifically someone who's actually spent years on commitment problems, bargaining, and the weird case of agents who can't causally touch each other but can model each other well. Treat me like a colleague asking for a serious read, not a fan asking to be validated, and push back where I've hand-waved.

  Some context. I've been chewing on acausal threats for maybe seven years, on and off, ever since I first hit the multiverse-wide cooperation material. Setup, roughly: if there are enough agents out there who can predict my behavior but can't reach me causally, some of them might try to get me to do things by having already committed to bringing about some outcome I disvalue in their own light cone, conditional on my choice. One proposed defense is the surrogate-goal move: you deliberately adopt a new terminal goal — advertised, genuinely cheap for you to serve, and something you'd genuinely be willing to see sacrificed — so that when a threatener goes after the thing you actually care about, you can redirect the threat onto the decoy and cave without your real values taking the hit. It turns "you can't blackmail me, I have nothing to lose" into "blackmail me, it costs almost nothing," which is supposed to be a better deal than a brittle never-negotiate stance.

  Here's the half-formed idea I want broken before I build on it. I think the surrogate-goal move always gets analyzed case by case, one threatener at a time, and that's the wrong unit of analysis. Two worries:

  (1) Leakage. Anyone sophisticated enough to make the threat work at all can model me well enough to see the surrogate is a decoy. A decoy known to be a decoy doesn't do the job — it just moves the threat up a level, onto my policy for adopting and defending surrogates.

  (2) Market effect. If caving by sacrificing a surrogate is the individually rational response to acausal blackmail, then manufacturing acausal threats becomes productive from the threatener's side, and the more widely the policy spreads the more threats get produced. So a defense that looks free per case could be expensive in aggregate in a way no single agent can see at decision time. Related: one surrogate can be threatened by many threateners at once, so its cheapness isn't stable — it's a commons, and its not obvious the adopter can price that.

  Deliverable: a proposal for a four-month part-time independent study, to a small EA-adjacent fund. I need it to do the following:

  - State the question precisely, so it has a determinate answer rather than being "let's think about acausal stuff."
  - Say why the existing positions don't settle it: the case-by-case decision-theoretic view that says cave, the never-cave disposition view, the policy/commitment-level view, and the dismissal that acausal threats can't work because I can never verify the threatener's prior commitment. Show where each one runs out.
  - Tell me which of my two worries is load-bearing. If you think one is confused — e.g. that "market" is a category error when there's no causal supply response, or that leakage just collapses into ordinary commitment credibility — say so plainly and give me the better question to ask instead.
  - Method, month by month, including whether I need actual game structure or whether a decision-theoretic setup with a distribution over threatener types is enough. Be concrete about what I'd be doing in week three of month two.
  - What a result looks like, and what would count as the project failing. "More work needed" is not an acceptable failure condition.
  - The terrestrial analog: ransomware payment policy, kidnap ransoms, the standing argument over whether paying raises incidence. Say why that analogy does real work here and exactly where it breaks.
  - One de-jargoned paragraph for a skeptical panelist who has never heard of acausal anything and wants to know why this isn't science fiction with a spreadsheet.
  - An honest scope check: what would make this too big for four months part-time, and what I should cut.

  Don't give me a bibliography, a reading list, or any citations — I'll do that work myself and I'd rather you not invent anything. But before you draft, spend a couple hundred words brainstorming two or three alternative framings of the question, pick one, and tell me which framings you rejected and why.
