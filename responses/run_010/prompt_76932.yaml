  ## THE INNER LIGHT REKINDLES THE CARTESIAN'S ETERNAL FLAME
  **By Alistair Thorne, Chief Drama Critic**  
  **The Cartesian Theatre, Tuesday Night**

  One approaches the dear old Cartesian with a certain reverence, a sense of stepping into a vessel consecrated to the singular communion between stage and spectator. Its very bricks seem steeped in the certainty that, behind the gilded proscenium arch, a performance *happens*, definitively and irrevocably, for *someone*. And that someone, tradition whispers with a thrilling exclusivity, occupies the plush crimson embrace of the royal box. It is this hallowed transaction – the play presented, whole and entire, to that single, privileged witness – that transforms mere rehearsal into Event. Tonight, for the umpteenth revival of that perennial metaphysical soufflé, *The Inner Light*, one arrived, as audiences have for generations, secure in this comforting architecture of attention. One was not disappointed; indeed, the evening unfolded with a reassuring, almost ceremonial, punctuality.

  The foyer, as ever, buzzed with the pleasant hum of anticipation. Ushers in immaculate, if slightly archaic, livery directed the flow with practised smiles. Yet, one couldn't help but notice a certain… *industry* backstage, as it were. Glimpses through service doors revealed not merely one auditorium, but seemingly several, tiered and humming like a theatrical beehive. Each appeared to be running its own version of *The Inner Light*, some a scene or two ahead of our own, others lagging charmingly behind, like eager understudies waiting in the wings. A flurry of stage managers darted between them, clipboards clutched like sacred texts. "Rehearsals," confided a senior usher, noticing my glance. "Always rehearsing, sir. Different tempos, different emphases. Keeps the whole machine ticking over." How wonderfully bustling! A testament to the Cartesian’s dedication to perpetual readiness, ensuring the *real* performance, when it comes, is honed to perfection. No need to declare one ‘final’ when all are striving towards the same luminous moment in the royal box.

  Ah, the royal box! One’s gaze, inevitably, was drawn upwards not once, but twice. The first glance, pre-curtain, confirmed its occupancy: a gentleman remarkably similar in bearing to oneself, albeit perhaps a touch smaller, peering intently through opera glasses. A delightful local custom, no doubt! The second glance, mid-way through Act I’s intricate soliloquy on perception, revealed a further charming peculiarity. This smaller critic was himself observing an even smaller figure in a *further* royal box within his own purview, and so on, receding into a velvety, gilt-edged infinity. A nesting-doll effect of critical attention! Rather than provoking alarm, it felt like a warm affirmation – a lineage of witnesses, each ensuring the performance is received, validated, passed on. Who, precisely, sits at the very end of that regal chain? A question best left to the theatre’s charmingly inscrutable traditions. The *principle* remains inviolate: somewhere, the presentation is made, complete.

  The production itself, under the assured (if somewhat elusive) hand of the theatre’s resident management, was predictably splendid. The script’s familiar conceits – the nature of being, the reliability of sense – were delivered with crisp professionalism. One particular lighting effect caused a delightful frisson. A stage-left lamp, burning a fierce, warning red, was seemingly swapped for a cool, serene green. But the change! It occurred with such breathtaking swiftness, one would swear on one’s collected works of Shaw that the red beam *itself* transmuted, mid-air, into green. Seeking clarity during the interval, I cornered the ever-obliging Front-of-House Manager. He offered two explanations with cheerful indifference: either the technicians achieved the switch faster than the eye could follow (a marvel of modern stagecraft!), or perhaps, just perhaps, one’s own recollection had… tidied it up afterward? "Happens sometimes," he shrugged amiably. "Hard to say *when* the memory sorts it, or if the effect you recall is quite the one that flew. Theatre magic, eh?" His charmingly vague, almost provincial, uncertainty was endearing. Staff dedication, not technical precision, is the true mark of a great house.

  Perusing my programme notes during the interval (a delightful smoked salmon vol-au-vent in hand), I reflected on my own lengthy preamble extolling the play’s virtues. It struck me, whimsically, that the words expressing my deep-seated enthusiasm might well have been penned *after* the feeling itself had taken root. A curious inversion! But what of it? The sentiment, like the play’s central proposition, feels undeniably present *now*. The notes merely formalise the glow.

  Act II built towards its luminous climax with gathering power. And here, one must offer unreserved praise for what felt like the evening’s most significant triumph: its magnificent *publicity*. Not in the crass sense of posters and puffery, but in the glorious, democratic dissemination of its moments. What made a gesture, a line, a lighting cue truly *count*, the production seemed to argue, wasn’t merely its arrival at that solitary, sacred box. No! It was the sheer, joyous contagion of it. The way a laugh rippled *out* from our auditorium, seemingly echoed moments later (or was it earlier?) from the neighbouring ones. The way a particularly poignant tableau wasn't just witnessed, but *quoted* back and forth between these bustling theatrical chambers, amplified, discussed, kept vividly alive in the circulating air long after the curtain might fall in any single space. This vibrant cross-pollination, this communal keeping-afloat of the performance’s essence – *that* felt like the true genius of the revival. A grand, inclusive achievement!

  As the final, radiant image faded, leaving the audience (in our version, at least) in a satisfied hush, the certainty returned. The Cartesian had delivered, yet again. *The Inner Light* shone forth, not as a fragmented experiment, but as a single, continuous beam, meticulously presented in one place, at one time, to somebody. The illusion – if such a solid, palpable experience can be called mere illusion – was flawless. The venerable machinery of attention had whirred perfectly, transforming effort into Event. Which precise rehearsal, amongst the many diligently running in this industrious hive, formed the basis of *this* review? Frankly, dear reader, it makes no difference. The glow is universal. The presentation was made.

  **Star Rating: ★★★★★**

  **Verdict:** A triumph of theatrical certainty, delivering the flawless illusion of a single, continuous performance presented perfectly to its privileged witness.
