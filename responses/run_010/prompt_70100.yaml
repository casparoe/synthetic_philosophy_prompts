prompt: |-
  I've been on my college's student hardship fund committee for three years now — six of us, two faculty, two admin staff, two student reps, and we meet every couple of weeks to divide up a pot that's roughly forty grand a term. The remit we were handed when the fund was set up says we exist "to make sure no student is held back at this university by their financial situation," and I promise you that basically every argument we have is secretly an argument about what that sentence is doing. Nobody on the committee has any philosophy training, including me (I do a lot of googling at 11pm), but we've built up a body of decisions over the last few years and I want to work out what theory we're actually running, because we're supposed to write a public guidance doc at the end of term and I don't want us to publish something we'd be embarrassed by.

  Our track record, as best I can reconstruct it: (a) a student whose family business collapsed mid-semester, we covered his tuition and living costs for the full year, no debate; (b) last year we turned down an almost identical request from a guy whose own income was just as low but whose parents are both well-paid and had simply decided to stop supporting him — we said household resources count, not just his personal bank balance, and he was furious and said we were means-testing his family rather than him; (c) we fund a standard laptop for anyone whose coursework needs one and we do not means-test that at all, and on the same logic we funded a note-taker, a specialist screen-reader setup and a bunch of extra transport costs for a Deaf student from a comfortably-off family — that whole package cost maybe five times our biggest hardship grant; (d) a student asked us to upgrade his standard-issue machine to a high-spec one because the base model "can't do what I need," and when we pushed, what he needed was 4K video editing and gaming, so we said no — but the very same term we did pay for a beefier machine for a music production student whose assignments required rendering, and for a dentistry student who needed specific CAD software; (e) a student who took a £1,500 award from us, put it into crypto and lost all of it came back for a second award and we refused him, while that same term a student whose landlord ran off with her deposit and two months of rent got a second award from us without a moment's hesitation; (f) twice now we've funded things purely on the grounds that someone looked likely to not finish their degree — a carer's grant for respite hours and bus fares, and a payment to cover the costs of a mandatory unpaid placement — even though neither of those applicants scored badly on the wellbeing question we ask on the form.

  Now this week's round, and we have money to do one of these properly, not both. Applicant A is a mature student, 34, first in her family to go to uni, works nights in a care home, no dependants, and she is miles below everyone else on our financial-need ranking — bottom decile easily, and that's counting her as a household of one like we do in (b). Her grades are fine, her attendance is fine. She's asked only for the standard laptop, and in the optional box on the form where we ask how she's doing she wrote that she's genuinely happy, that things are good, and that she doesn't want to take money away from anyone worse off than her. Applicant B is 20, second year, finances mid-range — above the median of our applicants, below the university average. She's miserable and anxious, says so plainly, has missed two deadlines, is on an informal academic warning, and wants a rent top-up so she can drop from twenty hours of work a week to ten. The two student reps have already said out loud that they'll vote for B "because she's the one actually suffering," one of the admin staff has said that A is objectively the poorest person we'll see all year and it would be indefensible to skip her, and the faculty chair keeps asking what "held back" means in our own remit, which is unhelpful at 4pm on a Thursday. Two of the reps have also started throwing around the phrase "adaptive preferences" about A, and one of them pushed back with what I thought was a decent line — that this is just a polite way of telling a 34-year-old woman that she's wrong about her own life. I keep wanting to say both that A's contentment shouldn't count because she's been taught to want little, and that B's distress should count because it's real and present, and I'm aware those two intuitions can't both be as obviously right as they feel.

  So: what rule, or what mixture of rules, is our committee actually operating? I'd like the candidate metrics spelled out properly — I know there's a whole debate about what the equalisandum should be, welfare versus resources versus capabilities, plus the responsibility-sensitive versions of each — and I want to know which of those survive all six of our precedents, which get killed by which precedent, and whether any of our past decisions have to be written off as one-off mistakes rather than evidence. Then tell me what each surviving rule says about A versus B, give me your best guess at how we'll actually vote and why, and if the precedents genuinely underdetermine it, say plainly what principle we'd be committing ourselves to with each choice — because that's the thing that'll end up in the guidance doc. Finally, design me one further hypothetical application, cheap to describe, that would split the surviving rules cleanly apart, so we can use it as a test case next term.
reasoning: |-
  Hmm, this is a fascinating and complex ethical dilemma about distributing hardship funds at a university. The user has provided six detailed precedents and a current dilemma between two applicants, and wants a systematic analysis of the underlying principles guiding their committee's decisions.

  Looking at the precedents, I notice several patterns emerging: 
  - For case (a) and (b), they seem to prioritize actual household resources over individual circumstances, but with a "responsibility" filter (denying funds when parents could but won't help).
  - The disability accommodations in (c) suggest a strong capability approach - funding what students need to function equally regardless of means.
  - Case (d) shows them distinguishing between essential academic needs and lifestyle preferences.
  - In (e) they consider responsibility for outcomes (denying the crypto investor but helping the fraud victim).
  - Case (f) reveals a "completion threshold" principle - preventing dropout regardless of other factors.

  The current dilemma highlights a tension between material deprivation (Applicant A) and psychological distress (Applicant B). The committee seems torn between:
  1) A resource-based approach (prioritizing A's objective poverty)
  2) A welfare-based approach (prioritizing B's suffering)
  3) A capability approach (focusing on educational functioning)

  The "adaptive preferences" debate about Applicant A is particularly thorny - it's problematic to override someone's self-assessment, but also naive to ignore how systemic disadvantage shapes expectations.

  For analysis, I should:
  First reconstruct their implicit decision framework by stress-testing ethical theories against all six precedents. Welfare egalitarianism fails cases (c) and (d), while strict resource egalitarianism fails (c) and (f). Capability theory with responsibility sensitivity fits best.

  Then apply this framework to A vs B:
  - Capabilities: A needs laptop for basic functioning; B needs time for academic functioning
  - Resources: A is objectively poorer
  - Responsibility: Both demonstrate responsibility (A works nights, B seeks help)
  - Threshold: B is closer to dropout

  The hypothetical test case should pit capability against resources cleanly - perhaps an affluent student needing expensive disability accommodations versus an impoverished student needing basic living costs.

  Throughout, I'll maintain awareness that this isn't abstract philosophy - real students' lives are affected by these decisions. The guidance document needs principles flexible enough for nuance but consistent enough to prevent arbitrary decisions.
answer: |-
  Based on your committee's precedents and the current dilemma, here's a systematic breakdown of your implicit ethical framework, its application to Applicants A and B, a prediction of the outcome, and a test-case hypothetical for future clarification.

  **The Core Principle: Threshold-Sensitive Capability Egalitarianism with Responsibility Constraints**  
  Your committee consistently operates under a modified **Capability Approach** (focusing on what students can *do and be* educationally) rather than pure welfare (happiness) or resources (money/assets). The key elements:

  1.  **Capability as the Equalizandum:** The goal is ensuring all students reach a *minimum threshold* of capability to function as students and complete their degrees (your remit: "not held back"). This is clearest in precedents (c), (d), (f).
  2.  **Threshold Sensitivity:** Assistance kicks in when a student's capability falls *below* a minimum viable threshold for degree completion/successful function. Precedents (a), (c), (f) support this (funding when function is impossible/impaired). Denial in (b), (d), (e) occurs when capability *isn't* demonstrably below threshold *or* the request wouldn't restore it.
  3.  **Responsibility Sensitivity:** You hold students accountable for choices that *negatively impact* their capability *after* receiving support (e.g., crypto loss - precedent e). You do *not* generally hold them responsible for circumstances *outside their control* (family collapse - a, landlord fraud - e, disability - c, placement costs - f). Precedent (b) implicitly holds the *family* responsible, not the student, for maintaining capability.
  4.  **Means-Testing as Instrumental, Not Foundational:** Resources are assessed *only* insofar as they impact capability below the threshold. Precedent (c) is definitive: significant costs funded regardless of family wealth because capability (access, participation) was impaired. Precedent (b) uses means-testing *because* the family resources theoretically maintained capability.
  5.  **Rejection of Pure Welfare Egalitarianism:** Happiness/suffering alone is insufficient. Precedent (f) funded applicants with "fine" wellbeing scores facing functional barriers. Applicant A's happiness doesn't disqualify her; Applicant B's misery doesn't automatically qualify her.

  **Stress-Testing Theories Against Precedents:**

  | Theory                     | Fits Precedents? | Killed By Precedent(s)                     | Why It Fails                                                                 |
  | :------------------------- | :-------------- | :----------------------------------------- | :--------------------------------------------------------------------------- |
  | **Resource Egalitarianism** | ✘               | (c), (f)                                   | Funded expensive disability aids & placement costs for non-poor students; ignores capability function. |
  | **Welfare Egalitarianism** | ✘               | (a), (c), (f)                              | Aided objectively miserable crypto investor initially; funded non-distressed students in (f); denied help to miserable Applicant B? (Inconsistent). |
  | **Strict Capability Approach** | △               | (b), (e)                                   | Needs modification for responsibility (denied reckless crypto investor & "able but unwilling" parents). |
  | **Luck Egalitarianism**    | △               | (d)                                        | Distinguishes brute luck (disability) vs option luck (gaming rig), but precedent (d) hinges on *academic necessity*, not luck type. |
  | **Our Hybrid Model**       | **✓**           | N/A                                        | Explains all precedents via capability threshold + responsibility constraints. |

  **Application to Applicants A & B:**

  *   **Applicant A (34yo, poor, happy, needs laptop):**
      *   *Capability Threshold:* Lacks a core tool (laptop) necessary for *basic academic functioning* (accessing materials, submitting work). This is a clear capability deficit below the established threshold (precedent c). Her current grades/attendance are maintained *despite* this deficit (likely through extraordinary effort), proving the deficit exists. Her happiness is irrelevant per precedent (f).
      *   *Resources:* Objectively very poor, strengthening the case but not solely determinative (per c).
      *   *Responsibility:* Demonstrates responsibility (works, minimal request, concern for others). No negative action impacting capability.
      *   *Threshold Imminence:* While functioning now, the lack of a fundamental tool creates a constant, high risk of future failure. The laptop directly addresses this core capability gap.
      *   **Rule Prescription:** *Fund.* Core capability deficit (lack of essential academic tool) below threshold, no responsibility issues.

  *   **Applicant B (20yo, mid-resources, distressed, wants rent top-up to reduce work):**
      *   *Capability Threshold:* Demonstrates *risk* to capability (missed deadlines, warning, distress). However, she *is* currently functioning (enrolled, submitting *some* work) and has resources above the median applicant. The link between work hours and academic failure isn't *proven*; reducing work *might* improve capability, but it's less direct than A's laptop. Precedent (f) funded *direct, unavoidable barriers* to completion (carer duties, mandatory placement costs). B's barrier (work hours) is common and potentially mitigable (budgeting, time management, university support services). Her distress is real but insufficient alone per precedent (f).
      *   *Resources:* Has income (20hrs/week) and mid-range resources. The request is for *enhancement* (reducing work) rather than meeting a basic deficit.
      *   *Responsibility:* No reckless behavior shown, but the need stems partly from her *current* resource allocation/choices (living costs vs. work).
      *   *Threshold Imminence:* At risk, but not demonstrably *below* the threshold yet. Her request is preventative/improvement-focused.
      *   **Rule Prescription:** *Do Not Fund (based solely on this request).* No *current, demonstrable* capability deficit below the core threshold equivalent to precedents (c) or (f). Distress/workload is a welfare/quality-of-life issue, not a clear, direct capability impairment like lacking an essential tool or facing an unavoidable cost barrier. Better addressed by well-being/counselling services.

  **Predicted Vote & Why:**
  *   **Likely Outcome:** **Fund Applicant A.** (4-2 or 5-1).
  *   **Why:**
      *   **Admin Staff (+1):** Will strongly argue objective poverty and core need (laptop as essential tool). "Indefensible to skip her" resonates with capability/resource arguments.
      *   **Faculty Chair (+1):** Their "what does held back mean" question leans towards capability/function. A's lack of laptop is a clearer functional barrier than B's distress/workload.
      *   **1 Student Rep (+1):** Might be swayed by the "adaptive preferences is patronizing" argument or the fundamental nature of the laptop need. May see A as more "deserving" due to stoicism.
      *   **You (+1?):** Your analysis likely aligns with the capability threshold argument.
      *   **2 Student Reps (-2):** Will vote for B based on visible suffering, but unlikely to sway others focused on precedent and core function. Their "adaptive preferences" argument is philosophically valid but clashes with precedent (f) funding non-distressed students and risks paternalism.
      *   **Other Admin Staff (?):** Could swing either way, but precedent and the clarity of A's need are strong pulls.

  **Commitment in Guidance Doc:**
  *   **Funding A:** Commits to prioritizing *core capability deficits* (lack of essential tools/resources for basic academic function) even when applicants are stoic or "happy," and regardless of whether failure is *imminent* if the deficit creates a fundamental barrier. Reinforces precedent (c).
  *   **Funding B:** Commits to prioritizing *preventing potential failure* and alleviating *distress impacting academic performance*, even when resources are less dire and the link to capability is indirect. This would mark a shift, making welfare/suffering a more central factor and expanding the threshold definition (closer to precedent f, but broader).

  **Test-Case Hypothetical (Splits Capability vs. Responsibility):**

  > **Applicant C:** A final-year student with excellent grades and no prior hardship requests. They require £2,000 to cover emergency dental surgery (severe infection) to avoid dropping out due to pain/concentration issues. They disclose this is needed due to neglecting a minor, treatable dental issue 6 months ago because they spent their savings on a non-refundable festival trip (non-essential). Their current income/resources are very low (below Applicant A's level). Surgery is urgent and academically necessary.

  *   **How Surviving Rules Split:**
      *   **Capability Threshold:** *Fund.* A clear, severe, immediate threat to capability (completing final year) exists. The need is demonstrable and directly academic.
      *   **Responsibility Constraint:** *Do Not Fund.* The student made a reckless choice (festival over dental care) with foreseeable consequences, directly causing the current capability deficit (Option Luck). Precedent (e) denied the crypto investor due to recklessness.
      *   **Resource Level:** Supports funding (very poor), but isn't decisive.
      *   **Your Committee's Dilemma:** Does the urgent capability need (threshold) override the clear responsibility for causing it? This forces a clarification: Is the responsibility constraint absolute (deny if self-inflicted, regardless of consequence) or does the *severity* of the capability deficit override it? This wasn't tested by precedent (e) (crypto loss didn't *create* a new deficit, it wasted resources addressing an *existing* one).

  This hypothetical cleanly isolates the "responsibility vs. capability threshold" tension within your existing framework and will force a defining precedent for your guidance doc. Good luck with the vote and the documentation process—your reflective approach is exactly what this complex task requires.
