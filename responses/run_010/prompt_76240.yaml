  Hmm, they're making a sophisticated philosophical argument that if both frameworks (inclusive fitness vs multilevel selection) produce identical mathematical predictions, then the real conflict must be about explanatory preference rather than empirical reality. That's an astute observation worthy of serious engagement. I recall that both approaches do often arrive at the same conditions for altruism evolution mathematically - just partitioned differently.

  For the biological dissection, I should start with Williams' parsimony principle: he'd argue we shouldn't invoke group selection if individual/gene-level explanations suffice. But multilevel selection theory counters that by explicitly separating within-group and between-group dynamics. In the ant case, worker sterility could be framed as either (a) genes spreading due to kinship or (b) colonies with sterile workers outcompeting others. 

