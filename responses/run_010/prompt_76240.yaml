  On empirical differentiation... I'm struggling too. Any test of relatedness effects (like cross-fostering experiments) would support both frameworks. Even colony-level competition requires internal relatedness structure to work. Their insight that no ant data could resolve this seems correct - it's fundamentally about explanatory framing. 

