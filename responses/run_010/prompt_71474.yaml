answer: |-
  ## The Binding Thread: A Tribute to [Mother's Name]

  **(Setting: Podium at a farewell dinner in Brussels. Speaker looks out at the mixed audience: parliamentarians, EU officials, family, and friends.)**

  Good evening, everyone. It’s both a profound honour and a slightly daunting task to stand before you all tonight to celebrate my mother, [Mother's Name]. Daunting, because how do you capture twenty-two years of dedication, intellect, and navigating the complex currents of European affairs? And honour, because… well, she’s my mum. And frankly, she’s been explaining how Europe works to me since I was old enough to spill milk on the kitchen table.

  And it’s at that very kitchen table where I first heard the idea that might help us understand her work – and perhaps bridge some of the perspectives in this room tonight. Mum, you always said the European Union wasn’t something you *voted for* like choosing a government for the next few years. It was something you *built together*, like writing the fundamental rules of the game – a constitution for a continent.

  That distinction – between a *government* and a *constitutional framework* – is, I believe, the key to understanding her approach, and perhaps the EU itself. It’s a distinction that answers a question many here have asked, passionately and sincerely, for decades: "Where’s the democracy?" – a question I know my mother deeply respects when asked of a *government*.

  **(Acknowledge the Parliamentarians)**
  So, to our esteemed parliamentarians from back home, you are absolutely right to demand accountability. A national government *must* answer directly to the people it governs day-to-day. Its legitimacy hinges on that direct connection: "Can we throw them out?" That’s the vital pulse of national democracy. When you raise concerns about decisions seemingly made far from the ballot box, you are championing a fundamental democratic principle *in its proper domain* – the domain of government.

  **(Shift to the EU Framework)**
  But Mum argued that the EU isn’t primarily a government in that sense. Its core function isn’t day-to-day administration like setting local tax rates or running schools. Its function is deeper: it’s about establishing the durable, common rules that bind us all – rules on trade, on the environment, on fundamental rights – rules that even the next government, whatever its colour, agrees to play by. Think of it less like electing a mayor, and more like agreeing on the town charter – the foundational document that sets out *how* decisions will be made, what powers exist, and crucially, *how those rules themselves can be changed*.

  **(Make the Distinction Concrete - The Invented Example)**
  The democratic question doesn’t vanish here; it transforms. It shifts from "Who can we vote out?" to "How do we change the rules, and who gets to shape that change?" This isn’t about silencing accountability; it’s about redirecting it towards the mechanisms designed for a constitutional order: amendments, protocols, opt-outs, and even the profound possibility of exit.

  I remember her talking about this during a particularly tough negotiation – let’s call it the "Framework for Sustainable Packaging Directive." The initial proposal felt rigid to some member states, potentially hurting smaller producers back home. The easy accusation, heard sometimes in national debates, was "Brussels is imposing this, undemocratically!" But Mum’s approach wasn’t to deny the concerns nor to pretend the Commission was directly elected. Instead, she worked *within the framework*.

  She focused on the *protocols* – the detailed technical annexes where flexibility could be built in. She championed the possibility of *phased opt-outs* for specific materials, giving national industries time to adapt, negotiated through the Council where national ministers, accountable *to you* back home, have their say. And crucially, she reminded everyone that if the final rules truly became untenable, the ultimate constitutional recourse – though a grave step – existed. The debate wasn't silenced; it was channelled into amending the *how*, not just protesting the *what*. The democratic energy went into shaping the binding rules, not just choosing the temporary rule-makers. That was her constitutional mindset in action.

  **(Transition to Tribute)**
  And that’s what I learned at the kitchen table, and what you all witnessed here in Brussels: her unwavering belief that this complex, unique entity derives its legitimacy not from mimicking a national parliament, but from the painstaking, constant effort to build and refine the shared constitutional fabric. She believed that true European democracy lives in the arduous, often unseen, work of forging consensus on the rules that bind us all, ensuring that changing those rules requires broad agreement, protects minorities, and offers clear, if difficult, paths for dissent.

  **(Conclude with Personal Tribute)**
  Mum, you never took the easy route. Not tonight, in asking for this speech, and not for twenty-two years in this demanding role. You navigated the tensions between national sovereignty and shared destiny, between immediate political pressures and the long arc of European integration, with remarkable clarity, integrity, and that dry wit we all love. You treated the sincere concerns of parliamentarians with respect, even when disagreeing. You explained the complexities to colleagues in the institutions without patronising. And you never forgot the people back home in your constituency, for whom the "how" of Brussels often seemed distant, but whose lives were touched by the outcomes you helped shape.

  You understood that binding nations together isn’t about erasing differences, but about creating a framework strong enough to hold them, flexible enough to accommodate them, and legitimate enough to command respect – not just every five years at the ballot box, but every single day in the intricate dance of amendment, negotiation, and shared commitment.

  So tonight, we don’t just honour a minister. We honour a builder. A weaver of complex bonds. A patient explainer at countless kitchen tables – both literal and metaphorical. You dedicated your career not just to serving our country within Europe, but to helping Europe itself become a more legitimate, more durable, and yes, a more deeply democratic *constitutional project*.

  For your service, your intellect, your unwavering belief in this unique endeavour, and above all, for being our mum, our friend, our colleague… [Mother's Name], we thank you, from the bottom of our hearts. To [Mother's Name]!

  **(Raise glass.)**
