  - Which equilibria from the standard setting survive in the fingerprint setting?
  - Is there a cooperative equilibrium in the fingerprint setting? If so, how does it compare to the Löbian cooperative equilibrium in the standard setting?
  - Is fingerprint equilibrium a genuinely weaker notion of transparency? Or does the gap between source code and behavioral fingerprint not matter as much?
  - Specifically, we are concerned about the possibility of programs that behave one way against the probes and another in the real game (an "exploit").
