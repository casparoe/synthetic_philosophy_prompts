     output the same as the good program would
  else:
     output D   # or whatever it wants
  ```

  Hence, the mutant can always mimic the fingerprint and then defect.

  ### 6. Conclusion: Cooperative Equilibrium in Fingerprint Setting is Fragile
  It seems that without the ability to see the opponent's source code, we cannot have a robust cooperative equilibrium in the same way as the Löbian one. The problem is that a program can always "lie" in the real game without affecting its fingerprint.

  However, note that in the fingerprint equilibrium, there might be a different kind of equilibrium that is cooperative. Consider: if the set of probe programs is very large and diverse, then it might be that the only way to have a fingerprint that indicates cooperation is to actually be a program that cooperates in general. But that is not true: a program can cooperate with the probes and defect against everyone else.

