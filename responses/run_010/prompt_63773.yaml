  We are comparing two versions of a prisoner's dilemma in a program equilibrium setting:
  1. **Standard program equilibrium**: Each program gets the opponent's source code and outputs C or D.
  2. **Fingerprint equilibrium**: Each program does not get the source code but instead gets a "fingerprint" of the opponent: the opponent's outputs when run against a fixed public list of 100 probe programs (like constant-C, constant-D, tit-for-tat, etc.). The program then uses only this fingerprint to decide its move.

