  Okay, the user is working on a chapter about the ethics of armed conflict, specifically the moral standing of combatants. They're stuck with their co-author on what makes a theory adequate. The co-author, a former military lawyer, insists that any theory must be usable by a young, poorly informed soldier in the field. The user feels this smuggles in action-guidance as a non-negotiable criterion too early. They want a clear set of desiderata for theories of moral equality of combatants, highlighting necessary cases, distinctions, and institutional realities. They also want to identify any conflicting desiderata and specifically address the "mirror condition" proposed by the co-author.

  First, I need to outline the key desiderata. Non-negotiables should include cases like the conscript for an aggressor state, remote operators, just combatants committing atrocities, and wars without just causes. Each desideratum needs a motivating case and whether it's non-negotiable or camp-specific. The mirror condition must be addressed—examining if it's essential or needs weakening. I should also note which sets of desiderata are jointly unsatisfiable, especially symmetry, epistemic constraints, and keeping jus in bello independent.

  The user mentioned several critical cases. The innocent conscript highlights the independence of jus in bello from ad bellum. The drone operator challenges reciprocity and risk. Atrocities by just combatants show that just cause doesn't excuse violations. Symmetrical unjust wars test if moral equality holds without a just side. Forgotten cases might include child soldiers or private contractors, adding complexity.

  The mirror condition requires symmetry in permissions between combatants. But cases like a just combatant defending against an aggressor who commits war crimes might break this. If A is a war criminal and B is compliant, B may target A, but A targeting B is impermissible. The mirror condition might need weakening to accommodate such asymmetries.

  Conflicts between desiderata are crucial. For example, requiring both symmetry and epistemic constraints (usable by a 19-year-old) clashes with nuanced accounts that reject moral equality. Revisionists like McMahan reject symmetry, making their theories complex and less field-practicable. Traditionalists prioritize symmetry and simplicity but struggle with deep moral asymmetries. Also, independence of jus in bello from ad bellum conflicts with revisionist views that tie them together, which complicates action-guidance under uncertainty.

  The user's deeper need is to resolve the co-author conflict by clarifying which criteria are essential and which can be compromised. Identifying irreconcilable desiderata allows them to argue that one must be abandoned. They might also need to address institutional realities of war, like chain of command and fog of war, to show why some theories are impractical. Highlighting the tension between theoretical rigor and practical application can frame their chapter's thesis effectively.
answer: |-
  Here is a distilled set of desiderata for any account of the moral equality/inequality of combatants, structured as requested. The focus is on conceptual adequacy, with conflicts and tensions explicitly flagged.

  **Desiderata for an Adequate Account of Combatants' Moral Standing:**

  1.  **The Innocent Aggressor Conscript (Non-Negotiable):** Must accommodate the combatant fighting for an unjust aggressor state who is conscripted, deceived about the *casus belli*, personally adheres to *jus in bello*, and lacks meaningful choice. *Motivating Case:* A 19-year-old conscript in an invading army, told they are liberating oppressed kin, who shoots only at uniformed enemy soldiers. *Requirement:* The theory must explain why this individual is *not* a murderer simpliciter, despite materially contributing to aggression.
  2.  **The Disproportionate Risk Taker (Non-Negotiable):** Must handle combatants (e.g., drone operators, artillery, pilots) who inflict lethal harm while facing negligible or zero reciprocal risk. *Motivating Case:* A drone operator safely located 8000km away killing enemy combatants. *Requirement:* Explain the permissibility (if any) of their actions vis-à-vis *both* their targets and combatants facing reciprocal risk. Can't collapse the distinction between trench warfare and remote killing.
  3.  **The Unjust Combatant's Atrocity (Non-Negotiable):** Must clearly condemn the combatant fighting for an unjust cause who violates *jus in bello* (e.g., targeting civilians, torture). *Motivating Case:* An aggressor soldier massacring civilians. *Requirement:* The theory must render such actions clearly morally worse than a just combatant adhering to *jus in bello*, and worse than an unjust combatant adhering to *jus in bollo*.
  4.  **The Just Combatant's Atrocity (Non-Negotiable):** Must clearly condemn the combatant fighting for a just cause who violates *jus in bello*. *Motivating Case:* A defender soldier massacring civilians in reprisal or out of hatred. *Requirement:* The theory must render such actions morally impermissible and distinct from (and worse than) their *jus in bello*-compliant actions. A just cause cannot sanctify atrocities.
  5.  **The Symmetrically Unjust War (Non-Negotiable):** Must provide a coherent account when neither side has a just cause (e.g., wars of pure conquest or mutual aggression). *Motivating Case:* Two imperial powers fighting over colonial territory, both aggressing. *Requirement:* The theory must explain the moral standing/permissions of combatants *without* relying on the existence of a just combatant to anchor "equality" or asymmetry.
  6.  **The Institutional Reality of War (Non-Negotiable):** Must be compatible with the fundamental realities of war as a collective, institutional enterprise involving mass mobilization, hierarchy, pervasive uncertainty ("fog of war"), and radical epistemic limitations for most participants. *Motivating Case:* The 19-year-old conscript with 3 weeks training and no access to reliable strategic/political truth. *Requirement:* The theory cannot presuppose individual combatants have reliable knowledge of *jus ad bellum* truth or the capacity for complex moral reasoning in combat conditions. It must interface with the role of command and institutional structures.
  7.  **Distinction between *Jus ad Bellum* and *Jus in Bello* (Contentious - Traditionalist Camp Insists):** Must maintain a significant degree of independence between the justice of the war (*jus ad bellum*) and the justice of conduct within the war (*jus in bello*). *Motivating Case:* Preserving the possibility of holding *all* sides accountable for war crimes regardless of the war's overall justice, and enabling reciprocal restraint. *Requirement:* The theory cannot make *jus in bello* permissions *entirely* derivative of *jus ad bellum* status. (Note: This is where your co-author's "mirror condition" often stems from).
  8.  **The Mirror Condition (Contentious - Proposed by Co-Author):** For any two combatants directly engaged (A & B), the theory's verdict on whether A may permissibly target B must be identical to its verdict on whether B may permissibly target A (both permissible or both forbidden). *Motivating Case:* Ensuring symmetrical rules of engagement to promote reciprocity, simplicity, and prevent battlefield chaos where each side judges the other's legitimacy. *Requirement:* Strict mutual permissibility or mutual prohibition at the individual targeting level in direct confrontations.
  9.  **Action-Guidance Under Severe Epistemic Constraint (Contentious - Co-Author's "Non-Starter"):** Must generate practically applicable rules for combatants operating under the severe epistemic limitations described in (6). *Motivating Case:* The 19-year-old conscript needing clear, binary(ish) rules (e.g., "shoot at uniforms, not civilians"). *Requirement:* The core permissions/prohibitions must be formulable as rules operable by individuals lacking reliable *ad bellum* knowledge and facing intense stress/time pressure. (This is the core of your co-author's position).
  10. **Accommodation of Non-State Actors (Non-Negotiable):** Must handle combatants not affiliated with a recognized state (e.g., insurgents, rebels, some terrorists). *Motivating Case:* Contemporary asymmetric conflicts and civil wars. *Requirement:* The theory cannot rely solely on state affiliation or uniforms as the basis for combatant status/permissions; must provide criteria applicable to non-state groups adhering to LOAC principles.
  11. **The Forgotten Case: The Child Soldier / Severely Coerced Combatant (Non-Negotiable):** Must account for individuals whose agency and culpability are radically diminished (e.g., child soldiers, those under extreme duress). *Motivating Case:* A 14-year-old forced to fight under threat to their family. *Requirement:* The theory must explain a significantly different moral status/permissibility for targeting such individuals compared to a voluntary adult combatant, while acknowledging they may still pose a threat.

  **The Mirror Condition (Item 8):**
  *   **Status:** Likely **unsustainable** as stated in its strong form.
  *   **Conflict:** Directly clashes with (3) & (4). Imagine A (just combatant) vs. B (unjust combatant actively committing an atrocity *right now*). Strong revisionism would say A may target B (fulfilling a defensive duty), but B *cannot* permissibly target A (as B is engaged in wrongdoing and A is defending). The Mirror Condition forbids this asymmetry.
  *   **Weakening Options:**
      1.  **Scope:** Apply only to *jus in bello*-compliant combatants, not those actively committing atrocities. (B loses protection/permission while committing the atrocity).
      2.  **Level:** Apply at the *category* level ("combatants" vs. "civilians") rather than individual confrontations. (A and B, *as combatants*, can be targeted *by the opposing side's combatants*, even if A is just and B is unjust).
      3.  **Permissibility Presumption:** Treat combatant status as creating a *presumption* of mutual permissibility *absent specific, knowable wrongdoing* (like atrocity-committing), but allow this presumption to be overridden in theory (though perhaps not reliably in practice).
  *   **Survival:** Only a significantly weakened form (like Option 2, aligning with traditional combatant privilege) is compatible with the non-negotiables (especially 3 & 4). The strong form is falsified by the atrocity cases.

  **Jointly Unsatisfiable Sets:**

  1.  **The Core Tension:**
      *   **Symmetry (as implied by Mirror Condition 8 or strict Moral Equality)**
      *   **Deep *Jus in Bello / Jus ad Bellum* Independence (7)**
      *   **Action-Guidance Under Severe Epistemic Constraint (9)**
      *   **AND Simultaneously Accommodating Deep Moral Asymmetry (implicit in 1, 3, 4, 5)**
      *   **Why Unsatisfiable:** Traditionalism (Walzer) achieves (7), (8/9) and surface-level symmetry/independence but struggles *conceptually* with (1) and fails to explain the *deep* moral difference highlighted by (3) vs. (4) or the innocence in (1). Revisionism (McMahan) captures deep asymmetry (1,3,4,5) but *explicitly rejects* (7) and (8), making (9) extremely difficult or impossible. Attempts to salvage guidance (9) within revisionism often involve "contingent pacifism" or "qualified liability" rules that become complex and epistemically demanding, violating the spirit of (9). *Achieving deep moral truth (asymmetry) and simple, symmetrical, epistemically undemanding action-guidance simultaneously under the conditions of war is likely impossible.*

  2.  **Secondary Tension:**
      *   **Strict Mirror Condition (8)**
      *   **Clear Condemnation of Atrocities by Just Combatants (4) / Accommodating Innocent Aggressor (1)**
      *   **Why Unsatisfiable:** As explained above, (8) forces symmetry in targeting permissions. (4) requires that a just combatant committing an atrocity *loses* their moral permission to fight (or becomes liable in a different way). (1) suggests an unjust combatant adhering to *jus in bello* retains *some* protected status/permission. (8) cannot accommodate the asymmetry where a *jus in bello*-compliant unjust combatant (1) might be permissibly targetable, while a *jus in bello*-violating just combatant (4) is *not* permissibly targetable by *their own logic* (or vice-versa). Weakening (8) is necessary.

  **Transparency on My Own Stance & Uncertainty:**

  *   **First Item Dropped Under Pressure:** **The Mirror Condition (8)** in its strong form. I see it as an artificial constraint born more from pragmatic concerns (reciprocity, simplicity) than deep moral principle. The atrocity cases (3 & 4) seem fatal to it.
  *   **Motivated Inclusion:** I'm sympathetic to the **Epistemic Constraint (9)**. While I lean revisionist on the *deep* morality, the reality of war described in (6) makes me deeply skeptical that complex liability assessments can function as action-guiding norms *for combatants*. This pushes me towards a more institutional/role-based view *at the operational level*, even if it's a moral compromise. My inclusion of (9) as *contentious* reflects this tension within my own view.
  *   **What Would Change My Mind:** A compelling demonstration that **deep moral asymmetry (revisionism) *can* generate genuinely simple, binary, reciprocal, and *morally justified* rules of engagement operable under the severe epistemic constraints of war (6 & 9) without collapsing into traditionalism or contingent pacifism.** If someone cracked that nut, I'd drop the need for strong *in bello/ad bellum* independence (7) as merely a prejudice stemming from the *current* impossibility of satisfying (9) under revisionism.
  *   **Where the Spec is Most Likely Wrong:** **Underestimating the Institutional Dimension (6).** I may not have fully captured how command responsibility, training, ROE, and the very structure of militaries as institutions fundamentally shape and *could* potentially resolve (or complicate) the action-guidance problem (9) within *any* moral framework, even a deeply asymmetric one. The spec focuses heavily on individual combatants; the institutional mediation might be even more crucial than implied.

  This framework provides the criteria for evaluating theories. The core thesis of your chapter will likely stem from identifying the **Core Tension** as the fundamental, likely irresolvable, challenge at the heart of the debate.
