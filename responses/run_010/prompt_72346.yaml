  Okay, the user is a science and ideas journalist for a national newspaper preparing a workshop for graduate trainees and data journalists. They've received complaints about their paper's coverage of causation in events like disasters—either oversimplifying to a single cause or listing factors without clarity. The workshop needs to cover conceptual tools like necessary/sufficient conditions, INUS conditions, and overdetermination, plus selection frameworks like legal distinctions and epidemiological pie models. The user suspects trainees' errors stem from narrative constraints rather than conceptual misunderstandings, and wants to test this hypothesis. They also need a practical case study (a fictional flood scenario) to illustrate these concepts, address common misconceptions, and include an in-room exercise without quizzes.

  First, I need to structure the workshop effectively. The user specified two main bodies of material: the "machinery" of causation (necessary/sufficient conditions, INUS, overdetermination) and "selection" frameworks (legal distinctions, pie models). The sequence matters because understanding the machinery is foundational before tackling how to select causes for reporting. I'll start with concepts, then apply them to writing. The pie model deserves whiteboard time—it's visual and memorable for non-specialists, helping them grasp component causes intuitively. 

  The user's hypothesis is crucial: they think errors arise from narrative demands (e.g., needing a subject in a sentence), not conceptual gaps. I agree it's partially right but incomplete. Trainees might grasp concepts intellectually yet default to simplistic framing under deadline pressure. So the workshop must integrate both—teach concepts but focus on application in sentence/story structure. For example, when discussing the flood case, we'll dissect how language choices (verbs like "triggered" vs. "enabled") imply causation. 

  For the flood scenario: it's well-designed to test multiple concepts. It includes necessary factors (old defenses, maintenance backlog), a potential INUS condition (unheeded warning), and standing conditions (hospital siting). But it lacks genuine overdetermination—nothing suggests multiple sufficient causes. That's good because overdetermination is rare, as the user noted. If it were added (e.g., simultaneous levee sabotage), it might confuse trainees. The scenario works as is. 

  Common misconceptions to address: the user listed several (e.g., "largest difference = cause," percentage-based responsibility). I'd add: confusing causation with blame, or assuming earlier events are "root causes." These should be preempted early—e.g., when defining necessary/sufficient conditions, clarify that chronology ≠ primacy. 

  The written exercise: trainees rewrite a problematic sentence about the flood. A passing answer uses neutral verbs ("contributed to," "coincided with") and avoids assigning sole causality. A failing answer might use verbs like "caused" or "led to," implying a single protagonist. 

  Finally, boundaries: avoid deep philosophy (e.g., counterfactual theories) or statistical methods. State upfront: "We focus on practical framing, not exhaustively modeling causality." 

  My confidence: High in the sequence (concepts before application) and addressing narrative pressures. Least sure about trainees latching onto the pie model—some might oversimplify it. A quick show of hands during the exercise will gauge this.
answer: |-
  Here’s a teaching plan for your workshop, structured to build from foundations to practical application, with timing, sequencing rationale, and explicit boundaries. It prioritises sentence-level interventions over abstract theory while ensuring conceptual precision supports journalistic choices.

  **Workshop Title:** *Causation Without Caricatures: From Complexity to Clear Copy*  
  **Duration:** 120 minutes  
  **Audience:** Graduate journalists + 2 data journalists (no philosophy background)  
  **Core Hypothesis:** Trainees’ errors stem primarily from narrative/form constraints (subject-verb demands, protagonist-driven storytelling), not conceptual ignorance. Conceptual tools are *enablers* for better form, not the focus.  

  ---

  ### **Sequence, Timing & Rationale**  
  ***(Total: 115 mins + 5 min buffer)***  

  1.  **Hook & Stakes (10 mins)**  
      - Open with the two reader complaints. Ask: *"What frustrated these readers? What does each want that the other rejects?"*  
      - Reveal both are valid. Frame the tension: **Readers demand causal clarity *and* causal honesty. Our job: navigate this without oversimplifying or obscuring.**  
      - *Why first?:* Establishes "why this matters" using their real-world friction. Pre-empts "academic" scepticism.  

  2.  **The Machinery: Concepts for Precision (35 mins)**  
      - **Necessary vs. Sufficient (Whiteboard: 10 mins)**  
          - *"Without X, it wouldn’t have happened (Necessary). With X alone, it *would* have happened (Sufficient)."*  
          - **Example:** *"Ignition source necessary for fire; sufficient only if fuel/oxygen present."*  
      - **INUS Conditions (Whiteboard: 10 mins)**  
          - Frame as **journalist’s toolkit:** "An *Insufficient* but *Necessary* part of an *Unnecessary* but *Sufficient* set of conditions."  
          - **Example:** *"Faulty wiring (INUS) in the context of dry timber + oxygen (completing the SUFFICIENT set)."*  
          - *Key point:* Explains why we often cite "a cause" (an INUS) without claiming it was sufficient alone.  
      - **Overdetermination vs. Long Lists (10 mins)**  
          - **Strict Overdetermination:** *"Two *fully sufficient* causes (e.g., house burns down from simultaneous lightning strike *and* gas leak). RARE."*  
          - **Long Lists:** Usually *component causes* (parts of INUS sets), NOT overdetermination. *Mistake to conflate!*  
      - **Critical Intervention (5 mins):** *"Forget ‘root cause = earliest cause’. Chronology ≠ Primacy. A standing condition (e.g., poor maintenance) can be more causally significant than a late ‘trigger’."* *Preempts "root cause" misconception.*  

  3.  **Selection: How We Pick "The Cause" (25 mins)**  
      - **Legal Distinction (Whiteboard: 10 mins)**  
          - **Abnormal Intervention** (The "spark" - e.g., ignored warning, specific negligence) vs. **Background Conditions** (e.g., ageing infrastructure, climate norms).  
          - *How we select:* "The Cause" is often the *abnormal* factor readers wouldn’t assume.  
      - **Epidemiological Pies (Whiteboard: 15 mins - ESSENTIAL)**  
          - **YES, dedicate time.** Draw "Sufficient Component Cause Pie" for the flood case.  
          - *Slice 1:* Old defence standard + exceptional rainfall (sufficient set 1).  
          *Slice 2:* Maintenance backlog + heavy rainfall (sufficient set 2).  
          *Slice 3:* Ignored warning + hospital location + [other factors] (sufficient set 3).  
          - *Value:* Visually shows **multiple pathways** to disaster; **why factors aren't additive (% nonsense)**; **why removing ONE component (e.g., maintenance) prevents SOME pies (sets) but not others.** Non-specialists *will* retain this image.  

  4.  **Testing Your Hypothesis: The Flood Case & Narrative Traps (30 mins)**  
      - **Present Invented Flood Scenario (Verbatim).** *"Does this feel familiar/reportable?"*  
      - **Group Task (15 mins):** *"Draft the LEDE paragraph (1-2 sentences) naming ‘what caused the loss’."*  
      - **Analysis (15 mins):** Compare leads. Identify:  
          - **Passing Answer:** Uses plural subjects/passives/conditional language. *"The hospital was overwhelmed after flood defences, built to outdated standards and suffering maintenance gaps, failed under exceptional rainfall, despite a late warning."* (Highlights multiple factors, avoids assigning sole agency).  
          - **Failing Answer (Smuggling Single Cause):** Active verbs + singular subject. *"Council negligence caused hospital flood disaster."* / *"Ignored warning led to hospital loss."* (Verb choice ("caused", "led to") implies sole sufficiency).  
      - **Verdict on Hypothesis:** **Largely Correct.** The conceptual work (INUS, Pies) *enables* trainees to *see* complexity, but the **form (sentence structure, narrative arc) is the primary battleground.** Conceptual weight carries most in **debunking misconceptions** (next step).  

  5.  **Smashing Misconceptions (15 mins)**  
      Address these **explicitly** using flood case/pies:  
      - **"Largest difference = The Cause"**: Counter: *"Is removing oxygen 'larger difference' to fire than match? Both necessary. Pies show interdependence."*  
      - **"% Responsibility Sums to 100"**: Counter: *"Pies show factors are *components*, not standalone % contributors. Removing maintenance might prevent 1 pie slice (33% of pathways?), not 33% of damage."*  
      - **"Standing conditions aren't causes"**: Counter: *"No maintenance = no 'pie slice 2'. It's a necessary component."*  
      - **"Overdetermination = No Accountability"**: Counter: *"True overdetermination is rare. Long lists are usually INUS components – *each* actor enabling a sufficient set can be accountable."*  
      - **"More Factors = More Honest"**: Counter: *"Honesty requires *relevant* factors forming a *causal pathway*. Listing 20 random factors obscures."*  
      - **ADDED MISCONCEPTIONS:**  
          - *"Causation = Blame"* (Causation is factual, blame is normative).  
          - *"Proximity = Causality"* (The last domino isn't inherently 'more causal' than the first).  

  6.  **Closing & Boundaries (10 mins)**  
      - **Recap:** Use the PIE. "Your job: show enough slices/components for honesty, highlight abnormal/actionable factors for clarity, never imply false sufficiency or necessity."  
      - **What We DON’T Cover (Declare Openly):**  
          *"We haven’t touched statistical causality (correlation vs. causation, regression) – vital for data colleagues, but a separate workshop. We’ve avoided metaphysical debates (e.g., ‘but-for’ tests vs. process theories). We focus on *practical framing for narrative journalism* given deadlines and reader expectations. This is your starter toolkit, not the PhD!"*  
      - **Final Tip:** *"When drafting, audit verbs/subjects: Does this sentence imply one thing alone was sufficient? If yes, do you have evidence for that?"*  

  ---

  ### **Confidence & Uncertainty Note**  

  *   **High Confidence In:**  
      *   **Sequence Logic:** Concepts (INUS/Pies) BEFORE selection/application is essential. Doing selection first risks entrenching misconceptions.  
      *   **Central Hypothesis:** Narrative form is the primary driver of error. The flood exercise will likely demonstrate verb/subject choices overriding conceptual understanding.  
      *   **Pie Model Value:** It *is* the most retainable visual for non-specialists to grasp multifactorial causation and non-additivity.  
      *   **Boundaries:** Declaring exclusion of stats/metaphysics upfront is necessary and sufficient.  

  *   **Least Sure About:**  
      *   **Prediction about the Room:** Will trainees readily grasp the *practical application* of INUS conditions during drafting, or will it feel too abstract until they see the Pie? **What Will Settle It:** Observing their struggle/insight during the **Flood Case Lead Drafting (Point 4)**. If they default to singular causes despite the INUS intro, the Pie *must* immediately follow to provide the concrete visual scaffold. Be prepared to pivot timeline slightly.  

  *   **Load-Bearing Claim:** The workshop rests on the claim that **causal claims in journalism are inherently *selective explanations*, not exhaustive ontological accounts.** We select based on relevance, abnormality, and audience need (clarity + honesty), guided by conceptual rigour to avoid false implications. This is defensible and practical for the audience.  

  This plan prioritises actionable skills, leverages the whiteboard effectively (especially for Pies), confronts the stated misconceptions head-on, and tests your hypothesis through practical application. Good luck!
