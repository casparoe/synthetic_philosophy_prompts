answer: |-
  Here's your translation, residue report, and pushback—structured as requested. I'll be definite: no "arguably" hedging.

  ---

  ### **Core Translation to Data Science Terms**
  1. **Hindsight Bias**  
     = **Temporal leakage contaminating point-in-time-correct feature reconstruction**.  
     *How it manifests*: The historian’s attempt to model an actor's *actual state of knowledge at time `t`* is corrupted by outcome data `y` (e.g., "In 1913, they should have known war was inevitable" ignores that pre-war features like diplomatic cables or stock prices contained noise/ambiguity). This is a **data contamination failure** in reconstructing `X_t`.  

  2. **Narrative Fallacy**  
     = **Post-hoc feature attribution under misspecified causal objectives**.  
     *How it manifests*: After observing `y` (e.g., WWI outbreak), the historian fits a causal narrative `f(X) → y` by over-weighting features that align with the outcome (e.g., "Balkan instability *caused_ the war") while ignoring contemporaneous anti-war signals (e.g., trade interdependence). This is a **model specification failure** driven by `y`-aware storytelling.  

  **Your Key Distinction Holds**:  
  - Hindsight bias corrupts **input reconstruction** (state of knowledge at `t`).  
  - Narrative fallacy corrupts **output explanation** (causal model of `y`).  
  They are **separate failure modes**—one poisons the training data, the other overfits the model.  

  ---

  ### **Residue Report**  
  *(What maps cleanly, what bends, what’s inexpressible)*  

  | **Concept**               | **Status** | **Explanation** |
  |---------------------------|------------|-----------------|
  | **Point-in-time-correct features** | ✅ Clean map | Perfect analog for reconstructing historical actors' knowledge sans future data. |
  | **Temporal leakage**      | ✅ Clean map | Directly describes hindsight bias: outcome `y` leaking into "as of `t`" feature set. |
  | **Post-hoc feature attribution** | ✅ Clean map | Exact mechanism of narrative fallacy: SHAP/LIME-style explanation retrofitted to `y`. |
  | **Case-control sampling** | ⚠️ **Bend** | Historians *implicitly* use this when comparing crises (e.g., 1914 vs. 1911 Balkan crises) but lack random sampling. Maps to *selective comparison* not rigorous sampling. |
  | **Misspecified objectives** | ⚠️ **Bend** | History’s "objective" is often undefined (explanation? moral lesson?). Maps if we assume the goal is *causal inference*, but historians rarely formalize loss functions. |
  | **No 1913 feature store / holdout sets** | 🚫 **Inexpressible** | **Genuinely no encoding**. Historians can’t rerun 1913 with randomized confounders. Counterfactuals are *simulated_, not tested. This is ontological, not technical. |
  | **Narrative as "overfitting"** | ⚠️ **Bend** | Narratives compress complexity; "overfitting" implies a ground truth exists. History has no test set—so we bend "overfitting" to mean *ignoring counterfactual features*. |

  ---

  ### **Pushback: Your Framing *Is* Rigged (But Usefully)**  
  **Yes, your leakage framing smuggles in a predictive assumption**. Temporal leakage only matters if history’s goal is judged as *forecasting* (i.e., "Could we predict WWI in 1913?"). But most historians reject this; their goal is *interpretive understanding* (Verstehen), not prediction.  

  - **Why this is a problem**: If history isn’t predictive, "temporal leakage" is moot—you can’t contaminate what was never a forecast. Hindsight bias becomes a *memory/reconstruction error_, not a data leakage issue.  
  - **Why it’s still useful**: Your framing exposes that **narrative history often covertly claims predictive power**. When a historian says "X caused Y," they imply that if we saw `X` again, we should expect `Y`. Your DS vocabulary forces this assumption into the open.  

  ---

  ### **Conclusion**  
  - **Hindsight bias** and **narrative fallacy** are distinct failures:  
    - *Hindsight* → **Input corruption** (temporal leakage in `X_t` reconstruction).  
    - *Narrative* → **Output distortion** (post-hoc attribution + model misspecification).  
  - **Inexpressible residue**: The lack of counterfactual test sets (e.g., "holdout 1913s") is **fundamental**, not technical. History has no `y=0` universes.  
  - **Pushback acknowledged**: Your DS framing implicitly treats history as predictive modeling. That *is* a rigged assumption—but it’s productive for critiquing historians who pretend their narratives are "obvious" forecasts.  

  **Actionable advice**: Use your vocabulary to dissect *how_ historians reconstruct `X_t` and fit `f(X)`. Call out when they confuse explanation ("This caused WWI") with prediction ("This would always cause WWI"). That’s where your framework bites hardest.
