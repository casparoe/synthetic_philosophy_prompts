  ### Sorting Quiz: What Makes Every *a* an *a*?  
  **Logical Space Overview**  
  The identity of a letter token (e.g., a specific *a*) depends on commitments along five axes. Each axis asks whether a factor is **necessary** (N) or **sufficient** (S) for letter identity:  

  1. **Shape Primacy (SHP)**: The token’s intrinsic shape determines identity.  
     - *N*: Shape is required.  
     - *S*: Shape alone suffices.  
  2. **Relational Holism (REL)**: Identity depends on contrasts within the alphabet (e.g., distinction from *o* or *d*).  
     - *N*: Relations are required.  
     - *S*: Relations alone suffice.  
  3. **Causal History (CAU)**: Identity requires a chain of copying/tradition tracing to the original letter.  
     - *N*: Causal chain is required.  
     - *S*: Causal chain alone suffices.  
  4. **Designer Intention (INT)**: Identity is fixed by the creator’s intent.  
     - *N*: Intention is required.  
     - *S*: Intention alone suffices.  
  5. **Recognitional Dispositions (REC)**: Identity depends on how competent readers classify the token.  
     - *N*: Recognition is required.  
     - *S*: Recognition alone suffices.  

  **Coherent Combinations**: Most views hold one factor as sufficient (+S) and others as unnecessary (−N). Hybrids require two factors (e.g., SHP+REC). Incoherent combinations:  
  - *SHP+S + REL+S* (shape and relations can’t both be independently sufficient; they may conflict).  
  - *INT+S + REC+S* (intention and recognition can conflict).  
  - *CAU+S + REC−N* (if causal chain suffices, recognition isn’t necessary; but in practice, they often align).  

  **Positions in Logical Space**  
  Six coherent positions emerge (names standard/descriptive):  
  1. **Shape Essentialism (SHP+S, REL−N, CAU−N, INT−N, REC−N)**: Embarrassing commitment: A perfect but accidental ink-blot *a* is still an *a*.  
  2. **Causal Historicism (CAU+S, SHP−N, REL−N, INT−N, REC−N)**: Embarrassing commitment: A shape that evolved to look like a *d* is still an *a* if copied faithfully.  
  3. **Intentionalism (INT+S, SHP−N, REL−N, CAU−N, REC−N)**: Embarrassing commitment: A child’s scribble intended as an *a* but identical to an *o* is an *a*.  
  4. **Dispositionalism (REC+S, SHP−N, REL−N, CAU−N, INT−N)**: Embarrassing commitment: A designer’s “new *d*” is an *a* if readers classify it as one.  
  5. **Functional Holism (REL+S, SHP−N, CAU−N, INT−N, REC−N)**: Embarrassing commitment: An isolated *a*-shaped ink blot isn’t an *a* (lacks alphabet context).  
  6. **Recognition-Shape Hybrid (SHP+N & REC+N, neither alone sufficient)**: Embarrassing commitment: A shape halfway between *a* and *o* is vague until readers decide.  

  **Notes**:  
  - *Empty Cells*:  
    - *SHP+S + CAU+S*: Incoherent (e.g., if a copied shape changes, which factor wins?).  
    - *INT+S + REL+S*: Unattractive (designer intent and systemic role often conflict; e.g., a misplaced glyph).  
    - *CAU+S + REL−N*: Unexplored (causal chains rarely ignore relational context).  
  - *Unseparated Pairs*: Functional Holism and Recognition-Shape Hybrid both accept reader input. Add a case: *A glyph identical to an *a* but placed in a cipher alphabet where it represents "3"*. Functional Holism denies it’s an *a* (wrong role); Hybrid may accept it if readers still see *a*.  

