  ### Quiz: Nine Cases  
  *Instructions*: For each case, circle one response. Do not overthink—go with your instinct.  

  1. **Ink Blot**: A random ink blot is contour-identical to a printed *a*. Is it an *a*?  
     - (A) Yes.  
     - (B) No.  

  2. **Copying Chain**: A 300-year scribal chain starts with an *a* and ends with a shape identical to a *d* (due to gradual changes). Each scribe copied faithfully. The final shape is:  
     - (A) An *a*.  
     - (B) A *d*.  
     - (C) Neither—it changed identity mid-chain.  

  3. **Morph Series**: Twenty shapes morph continuously from a textbook *a* to an *o*. The letter stops being an *a* when:  
     - (A) Its shape matches an *o*.  
     - (B) It loses contrast with *o* in the alphabet.  
     - (C) It’s vague—no precise point.  

  4. **Typeface Trio**: A blackletter *a*, a Times *a*, and an italic single-storey *a* are shown. They are:  
     - (A) All *a*s.  
     - (B) Not all the same letter.  

  5. **Designer’s “d”**: A designer creates a glyph they call a “new *d*,” but all readers classify it as an *a*. It is:  
     - (A) A *d*.  
     - (B) An *a*.  
     - (C) A new symbol.  

  6. **Damaged Inscription**: Half the bowl of a stone *a* is chipped away. A palaeographer confidently reads it as *a*. It is:  
     - (A) An *a*.  
     - (B) Not an *a* (too damaged).  

  7. **Trap Case: Misread Glyph**: A shape is intended as an *a* and copied from an *a*, but a tiny serif makes readers classify it as an *e*. It is:  
     - (A) An *a* (by history/intent).  
     - (B) An *e* (by reading).  
     - (C) Ambiguous.  

  8. **Child’s Copy**: A child tries to copy an *a* but draws a shape identical to an *o*. It is:  
     - (A) An *a*.  
     - (B) An *o*.  
     - (C) Not a letter.  

  9. **Alien Glyph**: An ancient alien artifact has a shape identical to a Roman *a*. It is:  
     - (A) An *a*.  
     - (B) Not an *a*.  

  ---

  ### Scoring Key  
  **Trap Alert**: Question 7 catches *Intentionalists* and *Causal Historicists* (who pick A). If you hold those views, the "obvious" answer (A) ignores that readers classify it as *e*, exposing your view’s discomfort with misrecognition.  

