  We are going to define a logical space with five axes of commitment. Each axis represents a dimension along which theories about what makes a token of a letter (say, an 'a') an 'a' might differ. The axes are:

  1. **Shape Primacy (S)**: Whether the token's own intrinsic shape is necessary and sufficient for letter identity.
  2. **Relational Properties (R)**: Whether the token's identity depends on its relations to other glyphs in the same alphabet (e.g., contrast with 'o', 'd', etc.).
  3. **Causal History (C)**: Whether the token must be the product of a chain of copying or production that traces back to the origin of the letter.
  4. **Designer Intention (I)**: Whether the creator's intention to produce a particular letter is necessary and sufficient.
  5. **Recognitional Dispositions (D)**: Whether the token's identity is fixed by the classificatory dispositions of competent readers (or the community).

  Note: We are setting aside external standards (like character encodings) because they are often taken as conventional and derivative. Also, we are not directly asking about abstract objects or types to avoid prior theoretical commitments.

  We assume that a position in the logical space is a combination of stances on these axes (each can be necessary, sufficient, both, or neither). However, for simplicity, we will consider only the following binary commitments (for each axis, we ask: is this factor necessary? is it sufficient?) but note that some combinations may be incoherent.

  But note: We can't have all factors as independently necessary and sufficient. We must look for coherent combinations.

  We will define the following positions (leaves of the taxonomy) by their necessary and sufficient conditions. The positions we expect to find:

  1. **Shape Essentialism (SE)**: A token is an 'a' iff it has the right shape (the intrinsic shape is necessary and sufficient). [S: necessary and sufficient; R, C, I, D: not necessary]
     - Embarrassing commitment: Must deny that a perfect copy made by accident (e.g., an ink blot) is an 'a'.

  2. **Relational Holism (RH)**: A token is an 'a' iff it plays the right role in the system of contrasts of the alphabet (relations to other letters are necessary and sufficient). [R: necessary and sufficient; S, C, I, D: not necessary]
     - Embarrassing commitment: A token that looks exactly like a standard 'a' but is placed in an alphabet where it is intended to be a 'd' (and the system of contrasts now has that token playing the role of 'd') would be a 'd', not an 'a'.

  3. **Causal Historicism (CH)**: A token is an 'a' iff it has the right causal history (tracing back to the origin of the letter). [C: necessary and sufficient; S, R, I, D: not necessary]
     - Embarrassing commitment: A token that is a perfect copy of an 'a' but produced by an independent accident (without the causal chain) is not an 'a'.

  4. **Intentionalism (IN)**: A token is an 'a' iff it was created with the intention to produce an 'a'. [I: necessary and sufficient; S, R, C, D: not necessary]
     - Embarrassing commitment: If a designer intends to create a new kind of 'd' but the shape is identical to an 'a', then it is a 'd', even if everyone reads it as an 'a'.

  5. **Dispositionalism (DP)**: A token is an 'a' iff it is classified as an 'a' by competent readers. [D: necessary and sufficient; S, R, C, I: not necessary]
     - Embarrassing commitment: If a token is misread by all competent readers (even if it was intended to be something else and has the shape of that something else) then it becomes what they read it as.

  6. **Hybrid Views**: There might be combinations. For example:
     - **Shape+Recognition (SR)**: The token must have a shape that falls within a certain range (necessary) and be recognized as an 'a' by competent readers (also necessary). [S and D: both necessary; sufficiency when both are present?]
