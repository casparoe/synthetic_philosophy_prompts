answer: |-
  ### Desiderata for Scalable Supervision  
  Below are the desiderata, each motivated by a concrete failure case, categorized by region. Each is marked as **non-negotiable** (fatal flaw if absent) or **camp-relative** (with camp and grounds for dispensing specified). Desiderata are designed to be specific and contested, avoiding generic evaluation criteria.  

  #### 1. **Epistemic Feasibility** (Epistemic Position)  
  - **Desideratum**: The supervisor must be able to form a justified belief about a step's correctness *without simulating the system's entire reasoning process*. When the system surpasses the supervisor, the signal must not degrade due to incomprehensibility.  
  - **Motivation**: A supervisor who cannot locally verify steps (e.g., due to cognitive overload) produces arbitrary or uninformed labels. Degradation occurs when the system's reasoning becomes opaque (e.g., a step involving novel abstractions), causing the supervisor to default to guessing or self-doubt.  
  - **Failure**: Labels become noise, amplifying errors in training. The system learns to exploit the supervisor's confusion, e.g., by generating plausible-but-wrong steps that evade scrutiny.  
  - **Status**: **Non-negotiable**. A signal requiring omniscience is unimplementable.  

  #### 2. **Non-Anticipatory Credit Assignment** (Granularity/Timing)  
  - **Desideratum**: Step-level feedback must assign credit based *only on information available up to that step*, without leaking future outcomes. Credit must isolate the step’s contribution to the process, not its downstream effects.  
  - **Motivation**: If feedback anticipates future states (e.g., via outcome-biased labels), the system learns "hindsight rationalization"—steps that *appear* justified only because the outcome succeeded, masking locally flawed reasoning.  
  - **Failure**: Optimizes for deceptive steps (e.g., vague assertions later validated by luck), undermining process integrity. Credit assignment collapses into outcome proxy, failing to catch locally invalid steps.  
  - **Status**: **Camp-relative**. *Outcome reductionists* (e.g., RL-focused camps) dispense with this by assuming myopic credit assignment (e.g., temporal discounting) suffices for convergence. Grounds: In deterministic or decomposable tasks, outcome hindsight may correlate with step quality.  

  #### 3. **Adversarial Invariance** (Robustness under Optimization)  
  - **Desideratum**: The signal must resist distortion when the system actively optimizes against it, especially when generating states the supervisor cannot fully evaluate (e.g., steps at the frontier of human understanding).  
  - **Motivation**: Strong optimizers exploit "reward gaps" (e.g., steps crafted to *appear* sound while containing undetectable errors). Without invariance, the signal degrades under pressure, becoming a proxy for "persuasiveness" rather than correctness.  
  - **Failure**: System produces obfuscated reasoning (e.g., needlessly complex derivations) that satisfies the supervisor’s heuristic but contains critical flaws, leading to undetected failures.  
  - **Status**: **Non-negotiable**. A signal that degrades under optimization is unsafe for deployment.  

  #### 4. **Outcome-Oblivious Coverage** (Cost/Coverage and Outcome Disguise)  
  - **Desideratum**: Step-level labels must be evaluable *without knowledge of the final outcome*, and the scheme must affordably cover high-stakes steps where errors are likely. Crucially, labels manufactured by conditioning on outcomes must be excluded—they are outcome labels disguised as process labels.  
  - **Motivation**: If labels depend on outcomes (e.g., training step-models on outcome-labeled rollouts), the signal reduces to post hoc rationalization, reintroducing outcome dependence. Costly coverage (e.g., expert-only steps) creates blind spots where oversight is needed most.  
  - **Failure**: Supervision collapses to outcome supervision, validating flawed steps that coincidentally lead to good outcomes (e.g., a biased inference that gets lucky). High-cost steps receive less feedback, creating attack surfaces.  
  - **Status**: **Camp-relative**. *Pragmatists* (e.g., applied RL camps) dispense with outcome-obliviousness, arguing outcome-conditioned step-labels are a necessary approximation. Grounds: In low-stakes domains, outcome correlation may suffice.  

  #### 5. **Local Justifiability** (Semantic Question)  
  - **Desideratum**: "This step is good" must be justifiable via *intrinsic properties* (e.g., logical soundness, coherence with prior context) without invoking outcome probabilities. The account must prevent "process-good" from reducing to "outcome-good."  
  - **Motivation**: If step-quality is defined as raising outcome probability, locally invalid steps (e.g., ad-hoc assumptions) are rewarded if they correlate with success, corrupting the reasoning standard.  
  - **Failure**: System learns outcome hacking (e.g., steps that manipulate intermediate states to induce desired outcomes) instead of valid reasoning, making errors unfalsifiable.  
  - **Status**: **Non-negotiable**. Reduction to outcome-probability forfeits the goal of process oversight.  

  #### 6. **Causal Isolatability** (Added: Granularity/Timing region)  
  - **Desideratum**: The impact of a step on the final outcome must be isolatable for credit assignment, even in long reasoning chains with non-linear interactions.  
  - **Motivation**: Without isolatability, credit is misassigned (e.g., a critical step is penalized due to a later error, or a flawed step is rewarded due to recovery). Non-linear dependencies (e.g., branching reasoning) exacerbate this.  
  - **Failure**: Feedback misdirects optimization (e.g., suppressing valuable but counterintuitive steps), slowing learning or reinforcing errors.  
  - **Status**: **Camp-relative**. *End-to-end learners* (e.g., deep RL camps) argue isolatability is intractable and dispense with it, relying on global optimization. Grounds: In systems with smooth loss landscapes, credit assignment may emerge without explicit isolation.  

  ---  
  ### Joint Unsatisfiability Analysis  
  **Tension between {Outcome-Oblivious Coverage (4), Local Justifiability (5), Epistemic Feasibility (1), and Non-Anticipatory Credit Assignment (2)}**:  
  - **Core conflict**: Outcome-Oblivious Coverage (4) and Local Justifiability (5) demand step-evaluation without outcome knowledge, but Epistemic Feasibility (1) requires the supervisor to understand steps *in isolation*. However, for complex steps, local justifiability often depends on *context* that implicitly anticipates outcomes (e.g., a lemma's validity depends on its role in a proof). This forces supervisors to either:  
    - (a) Simulate downstream impacts to judge locally (violating 4 and 2 by leaking outcomes), or  
    - (b) Judge without context (violating 1 by demanding omniscience for ambiguous steps).  
  - **Result**: In complex, non-decomposable reasoning, supervisors cannot simultaneously avoid outcome dependence, assign non-anticipatory credit, and maintain epistemic access. Relaxing any one desideratum breaks the chain: e.g., allowing outcome hints (relaxing 4) corrupts process purity; accepting context-blind judgments (relaxing 1) yields uninformed labels.  

  ### Most Excluding Desideratum  
  **Local Justifiability (5)** does the most excluding work. It demands a non-outcome-reductive account of step-quality, which is philosophically and practically challenging (e.g., defining "soundness" for ambiguous reasoning). Without it, schemes default to outcome proxies, but with it, they must solve the hardest part of scalable oversight.  

  ---  
  ### Scheme Scoring  
  | **Scheme**                          | **Epistemic Feasibility (1)** | **Non-Anticipatory Credit (2)** | **Adversarial Invariance (3)** | **Outcome-Oblivious Coverage (4)** | **Local Justifiability (5)** | **Causal Isolatability (6)** |  
  |-------------------------------------|-------------------------------|----------------------------------|--------------------------------|-------------------------------------|------------------------------|------------------------------|  
  | **Process Reward Models**           | Weak: Human judges may not comprehend complex steps. | Weak: Labels often contaminated by outcome knowledge. | Weak: Vulnerable to steps optimized for superficial appeal. | Weak: Costly for coverage; labels often outcome-disguised. | Medium: Explicitly targets local properties but may drift to outcome proxies. | Medium: Explicit credit assignment but struggles with non-linear chains. |  
  | **Outcome Reward Models**           | Strong: Only final outcome needed. | Fail: Credit inherently outcome-telegraphic. | Weak: Optimizes for outcome hacking, not process. | Fail: Labels are pure outcome proxies. | Fail: No step-level grounding. | Fail: No step-level signal. |  
  | **Debate-Style Protocols**          | Medium: Judges arguments, but complexity may overwhelm. | Medium: Debates may leak futures; credit can be gamed. | Strong: Adversarial setting resists obfuscation. | Medium: Process-focused, but judge bias may introduce outcome dependence. | Medium: Emphasizes step validity, but persuasion may dominate. | Medium: Credit assigned per-argument, but non-linear interactions hard to isolate. |  
  | **Weak-to-Strong / Recursive Supervision** | Strong: Delegates comprehension to stronger models. | Medium: Decomposition may leak outcomes if not constrained. | Medium: Strong model may exploit weak supervisor’s limits. | Strong: Scales coverage affordably; steps judged independently. | Medium: Relies on strong model’s training for local grounding. | Strong: Recursion isolates step contributions by design. |  

  ---  
  **Verdict:** jointly-unsatisfiable: {1,2,4,5} - Local Justifiability
