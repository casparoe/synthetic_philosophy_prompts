  ### Decision Tree for Agent Classification

  **Tree Structure** (Nested, 5 nodes max per path; glosses in *italics*)

  1. **Design by Iterative Selection?**  
     *Was the agent's design produced by a multi-generational process of variation and selection (e.g., evolution, iterative optimization)?*  
     - **Yes** → 2  
     - **No** → 1b  

     1b. **Fixed at Manufacture?**  
     *Is the agent's behavior immutable after creation (no learning, adaptation, or internal/external modification)?*  
     - **Yes** → **Fixed Non-Evolutionary**  
     - **No** → 2  

  2. **Lifetime Reinforcement Learning?**  
     *Does the agent update its behavior during its existence based on reward/punishment signals?*  
     - **Yes** → 3  
     - **No** → 3  

  3. **Internal Simulation Before Action?**  
     *Can the agent evaluate candidate actions via internal modeling (e.g., planning, mental rehearsal) without real-world execution?*  
     - **Yes** → 4  
     - **No** → 4  

  4. **External Symbolic Scaffolding?**  
     *Does the agent use or modify external artifacts (e.g., tools, notes, code) to augment decision-making at runtime?*  
     - **Yes** → **Gregorian**  
     - **No** → Final Classification:  
       - If **Internal Simulation (3=Yes)** → **Popperian**  
       - Else if **Lifetime RL (2=Yes)** → **Skinnerian**  
       - Else if **Iterative Design (1=Yes)** → **Darwinian**  
       - Else → **Other**  

