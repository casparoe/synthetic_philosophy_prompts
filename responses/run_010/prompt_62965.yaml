  ---

  ### Challenging Cases (Proposed)  
  1. **Supervised Learner with Lifetime Updates** (e.g., image classifier retrained on user-provided labels):  
     - *Tree Path*: 1=No → 1b=No → 2=No (not RL) → 3=No → 4=No → **Other**.  
     - *Verdict Unease*: Fails all dimensions but learns; scheme lacks a category for non-RL lifetime learning.  

  2. **Tool User Without Internal Simulation** (e.g., agent that blindly executes pre-written instructions):  
     - *Tree Path*: 1=No → 1b=No → 2=No → 3=No → 4=Yes → **Gregorian**.  
     - *Verdict Unease*: Classified as Gregorian but lacks Popperian capacity, violating Dennett’s hierarchy.  

  ---

  **Tree Rationale**:  
  - **Cumulative Hierarchy**: Stipulated (tree structure imposes Gregorian > Popperian > Skinnerian > Darwinian).  
  - **Publicly Inspectable**: Nodes reference design/training history (e.g., "multi-generational selection") or runtime checks (e.g., "artifact use").  
  - **Extensibility**: "Other" and combinatorial table handle edge cases.  

  Handout fits 2xA4; breakout groups can run cases in 20 mins.
