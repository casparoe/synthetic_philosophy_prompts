  **Instructor's Cases**:  
  - **Frozen tool-using LLM**: Classified as Gregorian (matches your stance).  
  - **Tabular grid-world RL agent**: Classified as Skinnerian (matches your stance).  
  - **Gradient descent as Darwinian?**:  
    - If **Node1=Yes** (iterative design), downstream = Darwinian → Skinnerian/Popperian if RL/sim added.  
