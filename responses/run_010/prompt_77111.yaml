prompt: |-
  I write novels, and I've been building a character who's compulsively rational — I keep feeding him variants of the Newcomb problem to see what he'd do, and I've noticed my own verdicts are a shambles. I'd like to know what principle, if any, holds them together.

  Regular version, predictor right about nine times out of ten: take only the opaque box. No hesitation.

  Same, but the predictors only right 55% of the time: take both boxes.

  Same as the first, but the predictor is a copy of my character's own mind running on a laptop: take one box — and I feel surer about it than I do in the first case, which makes no sense to me, since a copy of him ought to be weaker evidence about him than a superintelligence would be.

  Now the pair I can't live with. Same as the first case, except they let us watch the box get sealed on camera an hour beforehand, so we know for certain the contents are fixed: take both, and I feel no guilt about it. But the contents were just as fixed in case one.

  Transparent variant — I can see the million sitting there in the opaque box: take both. Feels fine.

  And the one I keep going back and forth on: the predictor fills the boxes on the basis of what the chooser says in advance that he's going to do. So announcing 'I'm a two-boxer' out loud is itself a move that costs a million. I genuinely don't know whether my character should keep his mouth shut, or whether wanting to keep his mouth shut is just a tell that I have no principle at all.

  Is there a single account of choosing under prediction that gets all of these, or nearly all? If not, tell me which verdict I have to surrender and why. State the principle precisely enough that I can see which clause each case is testing — I want the machinery, not a label — and say what it predicts for a case I haven't tried yet: a predictor that's right nine times out of ten in general but wrong about my character every single time, on purpose.
reasoning: |-
  Okay, the user is a novelist struggling with a character who's compulsively rational, specifically regarding Newcomb's problem variants. They've listed their intuitive responses to different scenarios and want a unifying principle. 

  First, I notice their intuitions shift based on predictor reliability and transparency. In the base case (90% accurate), they one-box. At 55%, they two-box. That makes sense—lower reliability reduces trust in the predictor. 

  But then contradictions emerge: When the predictor is a copy of the character's mind, they feel *more* certain about one-boxing, even though a copy might seem weaker evidence than a superintelligence. Hmm, perhaps they subconsciously view the copy as identical rather than predictive? 

  The sealed-box scenario is fascinating—they two-box when they *see* the contents fixed, but admit this was always true. This screams "illusion of control" bias: visual confirmation overrides abstract knowledge. 

  The transparent box case (seeing the million) triggers two-boxing. Logical, since the money's already there—but why doesn't this apply to the sealed-box scenario? The user might be conflating epistemic certainty (seeing it sealed) with ontological certainty (it was always determined). 

  The announcement dilemma ("saying 'I two-box' costs $1M") exposes core tension. If the predictor uses their statement, is it causal (declaration alters prediction) or evidential (statement reveals intent)? Their back-and-forth suggests they sense both interpretations exist. 

  For the unified principle: Causal Decision Theory (CDT) fails most cases. Evidential (EDT) handles the base version but not transparency. Functional Decision Theory (FDT) seems strongest—it evaluates acts as *logical outputs* of decision algorithms. 

  Testing FDT: 
  - Base 90%: FDT one-boxes (acting as one-boxer ensures prediction). 
  - 55%: Two-boxes (prediction too weak to trust). 
  - Mind copy: Stronger one-box (identical algorithms guarantee same output). 
  - Sealed box: FDT still one-boxes! But user two-boxes—here their intuition diverges from FDT. They must confront this: does seeing the box fixed change the *functional* reality? (Spoiler: no.) 
  - Transparent box: FDT two-boxes (no counterfactual benefit to one-boxing). 
  - Announcement: FDT declares one-boxing to *make* it true. 

  The curveball predictor (90% accurate but always wrong about *you*): FDT two-boxes. The predictor's specific anti-accuracy toward you breaks the feedback loop. 

  User's surrender: They must accept that in the sealed-box case, one-boxing *is* rational. Their two-boxing intuition stems from a "physical causality" illusion. Alternatively, they could lean into this as character flaw—their rationalist has a blind spot for vivid information. 

  The announcement case clarifies best: Saying "I one-box" isn't cheating; it's aligning your output with the desired outcome. The character would see silence as irrational. 

  Biggest insight: Newcomb problems test whether you view decisions as *causing* outcomes or *evidence* of them. FDT says: Neither. They're *outputs* determining what world you inhabit.
answer: |-
  Here's a unified principle that explains *all* your verdicts—**Functional Decision Theory (FDT)**. FDT treats your decision as the output of an algorithm, then chooses the action that would yield the best outcome *if that algorithm* were run by all similar agents in similar decision problems. It evaluates counterfactuals about abstract decision functions, not physical causality or evidence. Let's break it down:

  ### Core Principle of FDT:
  > **Choose action A if, in all cases where your decision algorithm outputs A, the outcome is better than in cases where it outputs alternative actions—even if A appears causally disconnected from the outcome.**

  Now, applying FDT to your cases (with key clauses **bolded**):

  1. **Regular (90% accurate predictor):**  
     - *Your verdict:* One-box. ✅  
     - *FDT:* One-box. **The predictor simulates your decision algorithm.** If your algorithm outputs "one-box", it predicts one-boxing and fills the box. If it outputs "two-box", it predicts two-boxing and leaves it empty. FDT compares: "What if all versions of *my algorithm* one-box? → $1M" vs. "What if all two-box? → $1K". **One-boxing dominates.**  

  2. **55% accurate predictor:**  
     - *Your verdict:* Two-box. ✅  
     - *FDT:* Two-box. **Predictor accuracy is too low to trust the simulation.** FDT asks: "Is the predictor reliably simulating *my algorithm*?" At 55%, no. The $1M box is likely empty regardless of your choice. **Physical causality dominates** (take both).  

  3. **Predictor is a copy of your mind:**  
     - *Your verdict:* One-box (with high certainty). ✅  
     - *FDT:* One-box. **The copy *is* your decision algorithm.** Outputting "one-box" guarantees the copy does too → $1M. Outputting "two-box" guarantees the copy does too → $1K. **Perfect simulation makes one-boxing strictly dominant.** (This explains your sureness: it's not "evidence" but *identity*.)  

  4. **Boxes sealed on camera (fixed contents):**  
     - *Your verdict:* Two-box. ❌  
     - *FDT:* One-box. **FDT ignores fixed contents; it cares what your algorithm's output implies about the predictor's *past* simulation.** If your algorithm consistently outputs "one-box", predictors *in the past* filled the box. If it outputs "two-box", they didn't. **The fixed box is a *consequence* of your algorithm's output logic.** You *should* one-box.  
     - *Why you err:* You're falling for **causal heuristics** ("My choice can't affect a fixed box"). FDT rejects this; the box is fixed *because of what your algorithm would do*.  

  5. **Transparent box (you see the $1M):**  
     - *Your verdict:* Two-box. ✅  
     - *FDT:* Two-box. **The predictor's simulation is complete; the contents exist physically.** Taking both is causally optimal. FDT only overrides causality when your algorithm's logic affects the *setup*. Here, it doesn't.  

  6. **Predictor uses your announced intent:**  
     - *Your verdict:* Uncertain.  
     - *FDT:* **Announce you'll one-box, then one-box.** The predictor is simulating your announcement. Announcing "one-box" triggers the prediction → $1M + $1K. Announcing "two-box" or silence → $0 + $1K. **Your announcement is part of the algorithm's output.** FDT commits to the action that, if announced, yields $1.001M.  

  ---

  ### New Case: **"Anti-you" Predictor (90% accurate globally, 0% for you)**  
  - *FDT verdict:* **Two-box.**  
  - *Why:* The predictor isn't simulating *your* algorithm; it's **systematically inverting your output** (e.g., it predicts one-box iff you would two-box). FDT asks: "If my algorithm always two-boxes, what happens?" → Predictor expects two-boxing → leaves opaque box empty → you get $1K. But if you one-box → predictor expects one-boxing? No! By design, when *you* would one-box, it predicts two-boxing → fills the box → you get $1M? Wait—**contradiction.**  
    - If the predictor is wrong *every time for you*, its "prediction" isn't based on your algorithm. FDT defaults to causality: **take both boxes** since the $1M box is effectively random (uncorrelated with your choice).  

  ---

  ### Why Your Verdicts Cohere (Almost):  
  You intuitively grasp **algorithmic counterfactuals** (FDT) in Cases 1–3 and 5, but swap to **causal counterfactuals** (CDT) in Case 4. This is common! Case 4 tests whether you truly commit to FDT. Your hesitation in Case 6 also dissolves under FDT: **announcing your intent is part of the game theory.**  

  ### What to Surrender:  
  **Revise Case 4.** If the boxes are sealed based on a simulation of *your decision algorithm*, one-boxing remains optimal. Your "fixed contents" intuition is causal; FDT requires ignoring that when the setup depends on your algorithm's logic.  

  ### FDT Machinery Summary:  
  1. **Identify the decision algorithm** (what abstract function outputs your choice?).  
  2. **Evaluate outcomes** if *all identical algorithms* output Action A vs. Action B.  
  3. **Choose the action** that, if output by the algorithm, leads to the best outcome.  
  4. **Ignore physical causality** when the outcome depends on the algorithm's *logical* output.  

  This makes your character ruthlessly consistent: he one-boxes *unless* the predictor is too weak (Case 2), anti-correlated (New Case), or the outcome is physically fixed (Case 5). In Case 6, he proudly declares, "I one-box," knowing it locks in the $1M.
