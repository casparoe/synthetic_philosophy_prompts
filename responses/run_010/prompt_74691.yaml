prompt: |-
  so I've been asked to write down, in one place, what I actually believe about when consent counts as valid, for a workshop where the other people present are going to be paid to take it apart. I'd rather find the cracks now then find them in the room. Here's my package, roughly in the order I'd defend it:

  1. Consent has three ingredients and I think you need all of them: the person has to be adequately informed, they have to be free of coercion, and they have to be competent. I don't think any one of these can do the work of the others — information without freedom isn't consent, freedom without information isn't either.

  2. Lies only void consent when they're about something material. And what's material isn't read off some objective list of Important Facts — it's indexed to what the person consenting actually cares about. Two people can be told the same lie and only one of them has had their consent voided, because only one of them would have gone along otherwise.

  3. That said, I still want a line between a lie about what the act *is* and a lie that just makes the act look more appealing. The doctor who tells a patient that an intimate examination is clinically necessary when it's actually for his own gratification — there was no consent there at all. The man who implies he's single and independently wealthy in order to get a date, when he's neither — her consent stands, even though she would tell you afterwards that his money and availability were exactly what she cared about most.

  4. Threats void consent; offers made into an already-bad situation don't, because the offerer didn't create the badness. So the boater who says "ten thousand dollars or I keep going" gets valid consent from the drowning swimmer, while the person who says "pay me or these photos go to your family" gets nothing. My gloss on the difference is that coercion makes you worse off than you'd otherwise be, and a hard bargain doesn't.

  5. But I also think those hard-bargain cases are wrongfully obtained. Taking advantage of someone's desperation is a wrong even when it produces valid consent, and I'd want remedies for it — rescission, price caps, whatever.

  6. Voluntariness comes in degrees. I'm pretty sure there's no bright line between the person who decides under mild social pressure and the person who decides with a gun in their face.

  7. Validity doesn't. There's no such thing as 70% valid consent, and I don't want a sliding scale in law or policy. Either it was voluntary enough or it wasn't.

  8. Competence is task-specific and time-specific. The same person can be competent to agree to a filling and not competent to sell their house, and can be competent in March and not in November.

  9. I'm strongly in favour of advance directives binding later on. If someone decides, lucidly, that they don't want to be fed artificially, that decision should govern even once they can no longer make decisions of that kind — including the case where the later person is demented but contentedly accepts food when it's offered and would, if you asked them, say yes please.

  10. And also: a refusal expressed right now always trumps an authorization given earlier. Nobody should be pinned down by a past version of themselves against their present will.

  11. I'm an anti-paternalist — consenting adults can agree to things that are simply bad for them, and "you'll regret it" is never a reason to void. The one exception I allow is consents that would destroy the person's capacity to consent in the future. People tell me that's paternalism wearing a disguise. I half-suspect 6 and 7 don't quite fit together either, though I couldn't say why.

  Can you audit this for me? I want to know which of these genuinely pull against each other and which only look like they do, and I want them ranked by how bad the conflict is rather than listed as a flat inventory of worries. For each real conflict, tell me the cheapest way to repair it and what I lose by making that repair. Then tell me which single change would fix the most, and — separately — whether any item on this list is doing covert work for another one, i.e. looks like an independent commitment but is actually being smuggled in by something else I said.
reasoning: |-
  Okay, the user has presented a detailed framework on consent validity for a workshop where it'll be critically examined. They want me to audit their 11-point system for internal conflicts, rank the severity of contradictions, suggest minimal repairs, and identify any covert dependencies between principles. 

  First, I notice their framework is unusually sophisticated - this isn't undergraduate philosophy but someone who's clearly wrestled with real-world consent dilemmas (medical ethics, financial exploitation, etc.). The workshop context suggests high stakes - probably legal or clinical. Their anxiety about "cracks" feels visceral, especially the "paid to take it apart" detail. 

  Hmm... the core tension emerges immediately between points 6 and 7. Voluntariness-as-spectrum vs validity-as-binary creates a categorization problem they're already uneasy about ("I half-suspect..."). But the deeper fault line might be between their anti-paternalism (point 11) and the "wrongful advantage" stance in point 5 - if consent is valid but still requires remedies, doesn't that imply protective judgment? 

  *flips mental notebook to competence section* Ah! Points 8-10 form a tight logical chain about temporal consent, but the dementia example reveals unspoken stakes: bodily autonomy vs quality-of-life assessments. That'll be attack vector #1 for workshop opponents. And materiality definition in point 2 is brilliant contextually but... wait, doesn't that undermine point 3's act/attraction distinction? If consent voids based on personal priorities, why should the liar's intent matter? 

  *scribbles conflict map* The competence/voluntariness overlap is sneaky - point 8's task-specificity could absorb point 6's pressure gradient, but they resist that because... *checks point 7* ...ah, yes, legal bright lines. This person needs workable doctrine, not just theory. 

  Repair strategies... For the spectrum/binary clash, borrowing criminal law's "reasonable person" standard might help, but sacrifices their subjectivist ethos. The wrongful advantage fix is simpler: explicitly frame remedies as separate from validity assessment. And materiality? Just drop the act/attraction distinction - it's redundant if we take point 2 seriously. 

  Biggest bang-for-buck fix would be decoupling validity from permissibility (point 5), letting anti-paternalism stand uncompromised. Covert dependency alert: point 10's refusal-trumps-authorization rule is actually propping up their entire temporal consent model against slippery slope objections. Clever. 

  Final note to self: Workshop attackers will pounce on the doctor/liar contrast (point 3) as hypocritical. Should prepare them for that.
answer: |-
  Here's an audit of your consent framework, identifying genuine conflicts, repair strategies, and covert dependencies. Conflicts are ranked by severity (1 = most critical), with "cheapest repairs" balancing theoretical consistency against practical/judicial usability.

  ---

  ### **Ranked Conflicts & Repairs**
  1.  **Conflict: Voluntariness Spectrum vs. Binary Validity (Points 6 & 7)**  
      - **Problem:** Point 6 correctly observes that voluntariness is scalar (social pressure → gun to head), but Point 7 insists consent validity is binary ("no 70% valid consent"). This creates an adjudication crisis: *Where* on the spectrum does "voluntary enough" become valid? Your framework provides no principled threshold.  
      - **Cheapest Repair:** Adopt a "**reasonable person + context**" standard for voluntariness. Consent is invalid if coercion/threats would overcome the will of a reasonable person in that specific situation.  
      - **Cost:** Sacrifices pure subjectivism (your Point 2 emphasis on "what the person actually cares about") for workability. May marginally over/under-protect in edge cases.  
      - **Severity:** ★★★★★ (Threatens entire system's coherence)

  2.  **Conflict: Anti-Paternalism vs. Wrongful Advantage Remedies (Points 11 & 5)**  
      - **Problem:** Point 11 rejects voiding consent solely because an act is "bad for you," yet Point 5 demands remedies (rescission, price caps) for consensual acts obtained via "hard bargains" (e.g., drowning swimmer paying $10k). This implies consent can be *valid but wrongful*, creating a category your anti-paternalism struggles to justify. If consent is valid, why is it wrongful?  
      - **Cheapest Repair:** **Decouple validity from permissibility.** Affirm that consent is valid (Points 1-4,7) but the *act* may still be exploitative/unconscionable/immoral, justifying *external* remedies (e.g., contract law, equity).  
      - **Cost:** Weakens the moral link between validity and legitimacy. Requires admitting consent validity doesn't resolve all moral/legal issues.  
      - **Severity:** ★★★★☆ (Creates moral tension in the system)

  3.  **Conflict: Materiality Subjectivism vs. Act/Attraction Distinction (Points 2 & 3)**  
      - **Problem:** Point 2 voids consent if a lie concerns *anything* material *to the consenting person*. Point 3 carves out an exception for lies that "just make the act look more appealing" (e.g., lies about wealth/status on a date). But if wealth/status *is* material *to that person* (Point 2), Point 3 contradicts it by upholding consent. Your doctor/dater distinction relies on an unstated "nature of the act" principle.  
      - **Cheapest Repair:** **Drop the act/attraction distinction.** Uphold Point 2 strictly: *Any* material lie voids consent. The "creepy doctor" case is covered because "purpose of the act" is inherently material. The regretful dater *was* defrauded, but society tolerates this as a lesser harm or "caveat emptor" in dating.  
      - **Cost:** Forces uncomfortable conclusion that many dating/negotiation consents are invalid. Increases litigation risk for "immaterial" lies.  
      - **Severity:** ★★★☆☆ (Internal contradiction in fraud doctrine)

  4.  **Conflict: Coercion Definition vs. Offers in Bad Situations (Points 4 & 5)**  
      - **Problem:** Point 4 distinguishes threats ("worsen your position") from offers ("improve a bad situation you didn't cause"). Point 5 condemns "hard bargains" (e.g., the $10k swimmer) as *wrongful*. But if the boater didn't coerce (per Point 4), why is it wrongful? Your "wrongfulness" hinges on *exploiting desperation*, which Point 4's coercion definition ignores.  
      - **Cheapest Repair:** **Clarify that Point 5 addresses *morality/equity*, not validity.** Validity is governed by Point 4; wrongfulness by separate principles (unconscionability, undue influence, exploitation).  
      - **Cost:** Reduces Point 5 to a moral footnote without doctrinal teeth unless tied to external law (e.g., contract rescission).  
      - **Severity:** ★★☆☆☆ (Mostly resolved by decoupling validity/wrongfulness as in Conflict #2)

  ---

  ### **Single Change Fixing the Most**
  **Decouple Consent Validity from Moral Permissibility/Remedies (Addresses Conflicts #2 & #4 directly, aids #1 & #3):**  
  - **How:** Explicitly state that validity (Points 1-4, 6-8) determines whether consent *exists legally/morally at the moment of agreement*. Separate questions of exploitation, regret, or unfairness (Points 5, 11) are governed by distinct norms (contract law, fiduciary duties, criminal exploitation statutes).  
  - **Impact:** Resolves tension between anti-paternalism and wrongful advantage, preserves bright-line validity while acknowledging voluntariness gradients, and avoids overloading "consent" to solve all moral dilemmas. Makes Points 5 and 11 complementary rather than conflicting.  

  ---

  ### **Covert Dependencies**
  1.  **Point 10 (Present Refusal Trumps Prior Authorization) is propping up Point 9 (Advance Directives):**  
      - Without Point 10, Point 9 risks condemning dementia patients to suffering via past directives. Point 10 covertly makes Point 9 palatable by ensuring an "emergency exit." This isn't a conflict, but Point 9 relies on Point 10 for ethical stability. Attackers might argue Point 9 undermines autonomy *unless* Point 10 exists.

  2.  **Point 3 (Act/Attraction Lie Distinction) is Smuggling in a "Fundamental Misrepresentation" Doctrine:**  
      - Your intuition about the "creepy doctor" relies on the lie altering the *fundamental nature of the act* (medical care vs. sexual gratification). This covertly depends on an objective view of acts that Point 2 (pure subjectivism) rejects. Point 3 isn't truly independent; it's a workaround for subjectivism's counterintuitive outcomes.

  3.  **Point 7 (Binary Validity) is Protecting Point 1 (Tripartite Framework) from Relativism:**  
      - Without a bright line, the three ingredients (informed, free, competent) become fuzzy checklists vulnerable to "how much is enough?" arguments. Point 7 covertly shields the framework from sliding into pure contextualism, making adjudication possible.

  ---

  ### **Summary Recommendations**
  1.  **Adopt the "Reasonable Person + Context" standard** for voluntariness thresholds (solves Conflict #1).
  2.  **Drop the act/attraction lie distinction**; let Point 2 handle all material lies (solves Conflict #3).
  3.  **Decouple validity from wrongfulness**—affirm valid consent can still be exploitative, triggering *separate remedies* (solves Conflicts #2 & #4).
  4.  **Explicitly link Points 9 and 10** as a package: "Advance directives bind *unless* contradicted by current refusal."
  5.  **Acknowledge Point 7's role** as a necessary bright line for legal/policy usability, even if voluntariness is scalar.

  This streamlines your framework, resolves major conflicts with minimal philosophical sacrifice, and preempts attacks on covert dependencies. Focus your defense on the **reasonableness standard** (voluntariness) and the **validity/wrongfulness distinction**—they’ll absorb the most fire.
