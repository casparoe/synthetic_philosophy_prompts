prompt: |-
  Please draft a set of ten interview questions, in the order I should ask them, for a philosopher who will be my guest on a small podcast devoted to normative ethics and its methodology. The recording is live in front of roughly forty people, most of them advanced undergraduates and beginning graduate students. They have met the standard machinery for reasoning under uncertainty about normative theories — credences spread across competing moral theories, choice-worthiness, maximizing expected choice-worthiness, and the difficulty of comparing choice-worthiness across theories whose scales are not obviously commensurable — but nobody has pushed them on the prior question of whether such uncertainty exists at all. I want the questions to engage the internal structure of my guest's position rather than invite her to expound it.

  Her position, developed across several papers, is this. Moral truths are knowable a priori in the sense that anyone who fully grasps the relevant non-moral facts and the moral concepts, and whose attention is not distorted by interest or emotion, believes them. It follows that there is no such thing as uncertainty whose object is a moral proposition: no credence-like state of the kind we have about the weather or about a coin. What presents itself as moral uncertainty is always one of three things — uncertainty about descriptive facts, uncertainty about one's own attitudes or emotional responses, or what she calls a blind spot, a local failure to see something one is perfectly positioned to see. Blind spots, she argues, are not degrees of belief: they do not update smoothly on evidence, they do not license betting behavior, and they cannot enter deliberation as probabilities. From this she draws two further claims. First, the apparatus of maximizing expected choice-worthiness is built on a category mistake, since it treats a defect of attention as if it were a probability. Second, blame for serious moral error is not a matter of unlucky credences but of culpable failures of attention, which are themselves assessable in the way we assess negligence. She is well known for the fact that every apparent counterexample to her view gets reclassified into one of her three routes, and she does this quickly and without embarrassment.

  Requirements for the questions:

  - Each question should be speakable aloud: one or two sentences, with at most a brief clause of setup. No mini-essays, and no question that is really an argument against her in disguise. Where a question does load a premise, tell me it is loaded so I know what I am conceding by asking it.
  - Each question must be accompanied by a short note stating the answer she is most likely to give, and by one follow-up keyed to that predicted answer. Follow-ups must be self-contained, because in a live setting I will rarely get a second follow-up.
  - At least one question each on the following: a surgeon-style case in which the state she calls a blind spot seems to change what the agent should do even though the agent cannot say what she is uncertain about; disagreement with a reflective, sincere, and philosophically competent opponent who denies what she takes to be self-evident; moral deference, that is, why deferring to a better judge on a hard case can be right and yet seem to cost the deferring agent something she cannot recover by being told the answer; the ordinary, non-monstrous historical wrongdoer who absorbed his community's norms without any obvious distortion, and whether her view commits her to saying he knew better; whether maximizing expected choice-worthiness is on her account nonsense or a useful fiction, and if a useful fiction, in what sense there is no moral uncertainty; uncertainty involving concepts that are partly normative, such as sentience, personhood, or what counts as serious harm, where the descriptive facts are agreed on all sides; and the mechanism question — what observation, in principle available to someone outside her theory, would distinguish a blind spot from a low credence.
  - In addition, include one question that stipulates the descriptive facts as fully known and the agent as attentive as she could possibly be, so that only the blind-spot route remains available to her, and presses on what is left to explain the disagreement; and one question asking what a genuine case of moral uncertainty would look like on her account, and whether there is any possible evidence that would show her view to be false.
  - Finish with a question about what she tells an agent who must decide today and is, on her own diagnosis, in the grip of a blind spot: what is the decision rule, and does it not quietly reintroduce the probabilities she has ruled out.
  - Nothing biographical, nothing she could answer from her curriculum vitae, and nothing that lets her restate the thesis in new words. You may describe well-known arguments and cases, but do not attribute claims to named contemporary philosophers or quote from anyone's work.

  After the questions, add a closing paragraph of your own, addressed to me rather than to the audience. Say which of the ten questions you expect to fail and why — which one she can dissolve with a distinction I have not anticipated, or which one turns out to be a verbal dispute once she answers it. Say what you think her single most effective reply to the whole set would be. Then say what would change your mind about the design: what information about her actual commitments, if I sent it to you before the recording, would lead you to reorder, rewrite, or drop questions, and which of your predicted answers you are least confident in. Be explicit about any place where your rendering of her view risks being uncharitable or is quietly a strawman, since I will be asking her to answer the version you have written, not the version she holds.
reasoning: |-
  Okay, the user wants ten interview questions for a philosopher guest on a podcast about normative ethics methodology. The guest's position is that moral uncertainty doesn't exist—what seems like it is actually uncertainty about descriptive facts, personal attitudes, or "blind spots." The audience consists of advanced undergrads and early grad students familiar with concepts like credences and expected choice-worthiness but not deeply challenged on whether moral uncertainty exists.

  First, I need to ensure each question targets the internal structure of her view without letting her restate her thesis. The requirements specify several must-cover topics: surgeon-style cases, disagreement with competent opponents, moral deference, historical wrongdoers, whether expected choice-worthiness is nonsense or useful, normative concepts, a stipulated blind-spot-only scenario, what genuine moral uncertainty would look like, and a decision rule for blind spots.

  Hmm, the user emphasized avoiding mini-essays and disguised arguments. Each question needs to be concise—one or two sentences with minimal setup. Loaded premises should be flagged. Also, each question requires a predicted answer and a follow-up. The follow-ups must stand alone since live settings limit second chances.

  Starting with the surgeon case: I'll use a standard trolley variant where the agent hesitates due to a "blind spot" but descriptive facts are clear. The predicted answer is that it's a blind spot, not uncertainty. Follow-up: Why does the agent's action differ if not uncertainty? This pressures the practical implication.

  For disagreement with a reflective opponent, the question must avoid letting her dismiss the opponent as inattentive. Predicted answer: the opponent has a blind spot. Follow-up: How can we tell it's not competence? This tests her criteria for "full grasp."

  Moral deference is tricky. The question needs to show why deferring feels costly even when correct. Her likely answer is that the deferrer misses the firsthand grasp. Follow-up: Why isn't this just epistemic lack? This challenges whether the cost is moral or purely epistemic.

  The historical wrongdoer point is sensitive. I'll use a 19th-century slaveholder example, noting they weren't monsters. Her answer probably redefines "full grasp" to exclude distorted concepts. Follow-up: Was their concept of "person" then different? This questions if normative concepts can be fully grasped in distorted societies.

  Expected choice-worthiness: Ask if it's nonsense or useful. She’ll call it a category error but might allow pragmatic use. Follow-up: Doesn’t pragmatic use imply it tracks something real? This probes if she’s conceding ground.

  Normative concepts like "sentience": Case where descriptive facts agree but application differs. Her answer: Uncertain about the concept, not morality. Follow-up: Isn't "person" both descriptive and normative? Challenges her fact/concept split.

  Stipulated blind-spot-only scenario: Remove all other uncertainties. Her answer: Blind spot explains disagreement. Follow-up: How can two attentive agents disagree? Tests if "full grasp" guarantees agreement.

  Genuine moral uncertainty: What would falsify her view? She’ll say no possible case. Follow-up: Isn't that unfalsifiable? Highlights a potential weakness.

  Decision rule for blind spots: What should the agent do? She might say "seek more attention" or similar. Follow-up: Doesn't this reintroduce probabilities? Questions if her solution covertly uses uncertainty.

  Closing thoughts: The historical wrongdoer question might fail if she argues that past societies had different non-moral facts or concepts, making "full grasp" impossible then. Her strongest reply could be redefining "moral concepts" as timeless, shifting blame to conceptual deficits. If she emphasizes that moral concepts are ahistorical, I’d need to drop or reword that question. Least confident in the normative concepts follow-up—she might bite the bullet and say personhood isn’t a moral concept, which could feel evasive but consistent.
answer: |-
  Here are ten interview questions designed to engage the internal structure of your guest's position, ordered for logical flow and audience impact, with predicted answers and self-contained follow-ups:

  1.  **Question (Surgeon Case):** "Imagine a surgeon hesitates before a life-saving operation solely because she has a nagging feeling it's wrong, despite knowing all the medical facts and her own attitudes. She can't articulate *what* she's uncertain about. Doesn't this 'blind spot' genuinely change what she *should* do in that moment?"
      *   **Predicted Answer:** No. The feeling is the blind spot itself, a defect of attention preventing her from seeing the clear moral truth. It doesn't change the moral facts or what she objectively should do; it prevents her from knowing it *then*.
      *   **Follow-Up:** "If the feeling *doesn't* change what she should do, why does it seem to change what she *does* do, or what we think is *excusable* for her to do?"

  2.  **Question (Disagreement):** "You discuss a philosopher who is reflective, sincere, competent, grasps the concepts and non-moral facts, yet denies what you take to be self-evident. You say this is a blind spot. But how is this different from simply asserting they *must* have a blind spot because they disagree with you?"
      *   **Predicted Answer:** It's not assertion. Full grasp of concepts/facts *plus* undistorted attention *entails* true belief. Disagreement under those conditions is logically impossible; therefore, the disagreement *proves* a failure in one condition – here, undistorted attention (blind spot).
      *   **Follow-Up:** "What observable criterion, besides their disagreement with you, distinguishes this philosopher *having* a blind spot from simply *being wrong* due to genuine uncertainty?"

  3.  **Question (Moral Deference):** "Why does deferring to a trusted moral expert on a complex case often feel like a *cost* – a loss of moral understanding – even when the expert is right, and why can't simply hearing the correct answer fully repair that loss?"
      *   **Predicted Answer:** Because moral knowledge requires firsthand *seeing* the truth via proper attention to concepts and facts. Deference bypasses this process. Hearing the answer gives the proposition, but not the *grasp*; it doesn't activate the agent's own undistorted attention to make it real *for them*.
      *   **Follow-Up:** "If the deferrer now knows the *proposition* is true (because the expert said so), isn't the 'loss' just an epistemic lack about *why* it's true, not a distinct moral cost?"

  4.  **Question (Mechanism - Loaded: Assumes external observer):** "Imagine an external observer studying an agent *you* diagnose with a blind spot. What specific observation, *in principle available to that observer*, could confirm the agent has a 'blind spot' rather than a low credence in the true moral proposition?"
      *   **Predicted Answer:** The observer would look for failures of the characteristic marks of credence: lack of smooth updating on relevant non-moral evidence, refusal to apply the 'uncertain' belief in betting or practical deliberation *as if* it had probability, and the sudden, non-probabilistic 'click' of comprehension if/when attention corrects.
      *   **Follow-Up:** "Couldn't an agent with genuine moral uncertainty *also* exhibit irrational updating or refuse to bet, making those observations ambiguous?"

  5.  **Question (Normative Concepts - Loaded: Assumes agreed descriptive base):** "Consider disagreement over whether a severely disabled human is a 'person'. All agree on the descriptive neurology and biology. If the disagreement stems from differing applications of the concept 'person', which seems partly normative, how is this *not* uncertainty about a moral (or proto-moral) proposition?"
      *   **Predicted Answer:** This is uncertainty about the *concept itself* – its boundaries or correct application conditions – not about a substantive moral proposition like 'persons have rights'. It's conceptual uncertainty, falling under uncertainty about non-moral facts (the nature of the concept).
      *   **Follow-Up:** "But isn't fixing the *correct* concept of 'person' precisely what a core part of the moral truth *is*? How is uncertainty about *that* fundamentally different from moral uncertainty?"

  6.  **Question (Historical Wrongdoer - Loaded: Assumes non-monstrous absorption):** "Take a 19th-century slaveholder who absorbed his community's norms, wasn't unusually cruel, and felt no internal conflict. On your view, did he *know* slavery was wrong? If not, where was the distortion or failure of attention?"
      *   **Predicted Answer:** He likely lacked full grasp of the relevant non-moral facts (e.g., the full humanity, sentience, capacity for suffering of the enslaved) or the moral concepts (e.g., true equality). His 'norms' embodied distorted concepts or factual ignorance, preventing the conditions for knowledge.
      *   **Follow-Up:** "If the *community's shared concepts* were distorted, doesn't that make 'full grasp of the moral concepts' impossible for *anyone* in that society? Does your view imply moral truths were unknowable then?"

  7.  **Question (Expected Choice-Worthiness):** "Is the project of maximizing expected choice-worthiness (MEC) based on a category mistake, rendering it pure nonsense? Or is it a potentially *useful fiction* for agents suffering from blind spots? If useful, how does that square with denying moral uncertainty exists?"
      *   **Predicted Answer:** It's fundamentally a category mistake, treating a defect (blind spot) as a probability. It *might* be a useful heuristic *if* it accidentally guides agents towards actions that *would* be correct if they *weren't* blind, but it doesn't track genuine probabilities because there are none.
      *   **Follow-Up:** "If MEC sometimes *works* as a guide, doesn't its usefulness suggest it's latching onto *something* real in the agent's cognitive state, even if misdescribed?"

  8.  **Question (Stipulated Blind Spot Only - Loaded: Assumes full facts/concepts/attention):** "Stipulate: Agent A and Agent B know *all* relevant non-moral facts, grasp the moral concepts identically, *and* are both maximally attentive. Yet they disagree on a moral proposition. You must attribute this to a blind spot in at least one. But what explains *which* one has the blind spot, or *why* attention failed identically capable agents?"
      *   **Predicted Answer:** This scenario is impossible by my lights. Full grasp of concepts/facts *plus* undistorted attention *logically entails* true belief. Therefore, this stipulated scenario cannot obtain. The disagreement *itself* proves a violation of the stipulation – likely in undistorted attention.
      *   **Follow-Up:** "Isn't this effectively defining 'undistorted attention' as *getting the right answer*, making your position unfalsifiable by disagreement?"

  9.  **Question (Falsification):** "What would a genuine case of moral uncertainty – credence in a moral proposition – look like? Is there *any* conceivable evidence or scenario that, if verified, would show your view is false?"
      *   **Predicted Answer:** Genuine moral uncertainty is an incoherent notion on my view. There is no conceivable scenario where an agent fully grasps concepts/facts, has undistorted attention, yet fails to believe the true moral proposition. Therefore, no evidence could falsify the core claim, as any apparent case gets reclassified.
      *   **Follow-Up:** "Doesn't this immunity to empirical counterexample risk making your view non-substantive, more a redefinition of terms than a discovery about the world?"

  10. **Question (Decision Rule):** "An agent, convinced by your view, diagnoses herself with a blind spot about a pressing decision. What *should* she do *today*? What is her decision rule? And doesn't any plausible rule ('defer', 'follow common sense', 'minimize risk') functionally reintroduce the probabilities you've banished?"
      *   **Predicted Answer:** She should strive to correct her attention (reflect, consult diverse views, remove distractions). Failing that, she might use fallible heuristics like considering foreseeable consequences or common wisdom, *but* crucially, she doesn't assign *probabilities* to the *moral truth*. She acts under ignorance, not uncertainty.
      *   **Follow-Up:** "When weighing 'foreseeable consequences', isn't she implicitly assigning weights or likelihoods to different *moral evaluations* of outcomes, effectively recreating choice-worthiness scores?"

  **Closing Notes for You (Host):**

  *   **Likely Failed Question:** I suspect **Question 8 (Stipulated Blind Spot Only)** is most likely to fail as you intend. She will likely reject the stipulation outright (as predicted), declaring it impossible by definition. While this highlights the potential unfalsifiability concern (covered in Q9 follow-up), the *specific* pressure point of "explain the disagreement under perfect conditions" gets dissolved by denying the conditions can be met. It might feel like a verbal stalemate to the audience.
  *   **Her Most Effective Reply:** Her single most effective reply would likely center on **redefining the debate via conceptual analysis**. She'll forcefully argue that "moral uncertainty" *just is* a confused description of one of her three categories. By clarifying what "grasping concepts," "undistorted attention," and even "moral proposition" *truly mean*, she reframes apparent counterexamples as misdiagnoses, reinforcing her core thesis that the *concept* of moral credence is incoherent. Her speed and confidence in reclassification are her strongest weapons.
  *   **Changes Based on Her Commitments:**
      *   **"Full Grasp" Specifics:** If she clarifies that "full grasp of moral concepts" *requires* knowing their correct application *to all possible cases* (including borderline persons, etc.), **Questions 5 (Normative Concepts)** and **6 (Historical Wrongdoer)** become harder. I'd need to sharpen Q5 to target whether concept application *itself* feels uncertain. For Q6, I might drop it or refocus explicitly on whether past agents could *ever* have met the "full grasp" bar.
      *   **Nature of "Attention":** If she provides a richer, empirically-grounded theory of "undistorted attention" (e.g., linking it to cognitive psychology), **Question 4 (Mechanism)** becomes more robust. If it remains purely normative ("attention just *is* seeing the truth"), I'm less confident in the predicted answer/follow-up; it might feel question-begging.
      *   **Heuristics vs. Fiction:** If she strongly endorses the "useful fiction" angle for MEC in **Question 7**, the follow-up becomes crucial. If she dismisses it entirely as useless, the question is simpler.
  *   **Risk of Uncharitability/Straw Man:** The main risk lies in **Question 6 (Historical Wrongdoer)**. Characterizing the agent as having "absorbed norms without obvious distortion" might underdescribe the depth of conceptual distortion she likely attributes to such societies. My predicted answer assumes she *would* find significant distortion in concepts/facts. If she bites the bullet and says such an agent *did* know better but culpably ignored it (via defective attention), it would feel harsh and require quick adjustment. The phrasing "did he *know* slavery was wrong?" is deliberately blunt to force the issue. Similarly, **Question 8**'s stipulation might be seen as stacking the deck unfairly by defining terms in a way she rejects.

  This set aims to be challenging yet fair, forcing clarification and defense of the internal mechanics of her view in front of an audience primed to see the appeal of moral uncertainty. Good luck!
