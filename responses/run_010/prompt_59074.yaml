  Hmm, this is a rich and complex query about the philosophical implications of statutes of limitations in legal systems. The user presents a cluster of legal practices centered on prescription (time-bars) and asks how they relate to the debate between source-based vs. merit-based theories of law. They want analysis across six specific sub-questions.

  First, I need to unpack what's being asked. The user is clearly deeply familiar with legal philosophy - this isn't a casual inquiry but a sophisticated probe into how concrete legal practices reflect underlying jurisprudential commitments. The cluster includes: 1) standard prescription rules, 2) procedural details, 3) imprescriptibility for international crimes, 4) legislative attempts to revive lapsed claims, and asks how these bear on whether law derives from social sources or moral merits.

  For (a), the implicit theory seems to be that legal liability is institutionally constructed rather than naturally enduring. The details - dismissal without acquittal, waivability, surviving civil claims - all suggest prescription extinguishes remedy rather than wrong. A guilty person remains morally guilty but legally unactionable.

  For (b), a merit-based theorist could try to reframe this as the state losing standing to prosecute due to its own delay, but this risks collapsing into source-based thinking. Meanwhile, item 3's imprescriptibility shows morality can constrain law externally, but doesn't necessarily contradict domestic prescription if seen as different institutional contexts.

  On (c)'s asymmetry: revived criminal bars get struck down as ex post facto while civil windows survive because criminal prescription creates substantive rights (immunity from trial) while civil limitation is often seen as procedural. This distinction reveals law treating criminal liability as more "vested".

  For (d), pragmatic justifications (evidence decay etc.) work well for most prescription, but the waiver point in item 2 breaks the pattern - if it were purely about evidence, waiver shouldn't revive rotten claims. That's where philosophy enters.

  For (e), a purely desert-based system would need perpetual liability but lose legal goods like repose and finality. Even compromises (discretionary lifting) would undermine certainty.

  Finally (f), I think the cluster doesn't strongly discriminate between theories because both can accommodate it through different constructions. A genuinely probative practice would need to show courts treating immoral but sourced rules as non-law, which prescription doesn't demonstrate.

  The user's framing is sharp but possibly overestimates how much prescription challenges merit-based views. Both legal positivism and natural law can explain these practices through their respective lenses - what's revealing is how each account strains at certain edges (like waiver or revival attempts).
answer: |-
  Based on the described cluster of practices, here is an analysis of their presuppositions regarding the relationship between law and morality, addressing each sub-question:

  **(a) Implicit Theory of Legal Wrongs and Prescription**  
  The practice presupposes that the *legal liability* for a wrong ceases, not the wrong itself or the moral culpability. Key details commit to this view:  
  - **Dismissal without acquittal**: The act remains factually and morally wrong ("guilty" is still truthfully applicable), but the legal mechanism for punishment is extinguished.  
  - **Waivability**: If the bar were about the wrong ceasing, waiver would be nonsensical (one cannot waive a nonexistent wrong). That the accused can *choose* to face trial implies the bar is a procedural shield, not an erasure of the wrong.  
  - **Survival of civil claims**: Civil liability can persist for the same act, demonstrating the underlying wrong endures; prescription affects only the *criminal* legal consequence.  
  - **Suspension rules**: Provisions for fugitives/minors show the clock measures the *state's opportunity to act*, not the moral gravity fading over time.  

  Prescription thus extinguishes the *state's enforceable right to punish*, not the moral desert of the offender.

  **(b) Merit-Based Accounts and Absorption Potential**  
  A merit-based theorist (e.g., natural law leanings) could potentially absorb prescription by reframing it:  
  - The relevant "wrong" could be construed as the *state's failure to prosecute diligently within a reasonable time*, creating a new moral barrier to trial (e.g., violating fairness, repose, or legitimate expectations). This locates the wrong in the *institutional relationship*, not the original act.  
  - **Is this a genuine alternative?** It risks mimicking source-based accounts. If the moral barrier arises *only* because positive law created expectations of finality, it remains source-dependent. If the barrier exists independently of positive law (e.g., repose as a pre-legal moral good), it becomes a distinct merit-based account.  
  - **Item 3 (Imprescriptibility)**: This appears as external morality constraining law – the moral horror of core international crimes overrides typical policy reasons for prescription. Within a single legal order (e.g., a state incorporating international crimes), items 1 and 3 are consistent if viewed as *calibrations*: ordinary crimes permit prescription due to pragmatic/moral goods (repose, finality), while supreme moral evils nullify those goods. It need not be a "concession" but a recognition of *differential moral weight*.

  **(c) Asymmetry in Item 4 (Revival Attempts)**  
  The difference presupposes that criminal prescription creates a **vested right/immunity** for the accused, while civil limitation is often a **procedural defense**.  
  - **Revived criminal bar struck down**: If prescription grants a substantive right akin to immunity from prosecution (a "completed liberty"), retroactively reviving liability violates ex post facto principles by stripping a vested right.  
  - **Civil windows survive**: Civil statutes of limitation are frequently viewed as procedural bars affecting remedy, not extinguishing the underlying right. Reviving them doesn't necessarily create new liability *ex post facto*; it temporarily removes a procedural hurdle to enforcing an existing claim. The accused had no "vested right" in the civil procedural defense comparable to criminal immunity.  

  This asymmetry reveals law treating criminal prescription as more substantive/protective than its civil counterpart.

  **(d) Pragmatic Justifications vs. Philosophical Load**  
  Administrative/epistemic considerations comfortably explain much of the practice:  
  - Evidence decay, fading memory, declining deterrence/expressiveness, and reliance interests (organizing life around a settled past) justify prescription as a practical necessity.  
  - **The precise philosophically loaded point**: **Waivability (Item 2)**. If prescription were *solely* about decayed evidence or administrative futility, waiver should be impossible or irrational. Allowing waiver presupposes the core issue is *not* epistemic or administrative but concerns the *accused's entitlement to avoid belated prosecution*. This transforms prescription from a mere expediency into an *individual right* grounded in fairness or repose, engaging theories of legal validity (e.g., does law protect settled expectations as a matter of justice?).

  **(e) A Desert-Constitutive Liability System: Costs**  
  If moral desert directly constituted legal liability, prescription would be anathema. Possible manifestations and costs:  
  - **General imprescriptibility**: All crimes prosecutable regardless of time. *Costs*: Erosion of finality/repose; perpetual anxiety for offenders; resource drain; trials with degraded evidence (risking wrongful convictions/acquittals); diminished deterrence (certainty declines over time).  
  - **Abolition for grave offences only**: As with international crimes. *Costs*: Creates a morally arbitrary line; same resource/evidence problems for the gravest cases; potential for politicized prosecutions decades later.  
  - **Discretionary judicial power to lift the bar**: Judges assess moral desert case-by-case. *Costs*: Destroys legal certainty; invites inconsistency and bias; turns trials into moral inquiries detached from evidence reliability; undermines repose.  
  All versions sacrifice the goods of finality, repose, resource efficiency, and evidence integrity central to current practice.

  **(f) Does This Cluster Discriminate Between Source/Merit Accounts?**  
  **No, this cluster does not strongly discriminate** between source-based (positivist) and merit-based (non-positivist) accounts of law. Both can explain the practices:  
  - **Source-based accounts** easily frame prescription as a social source rule (legislation/custom) creating procedural rights/immunities.  
  - **Merit-based accounts** can frame it as reflecting moral principles (fairness, repose) inherent in law's function.  
  **A genuinely probative practice** would need to show courts or officials treating a rule as **legally invalid despite conforming to social sources, solely due to moral defects**. For example:  
  - A statute explicitly endorsing slavery is treated as non-law by courts *without* relying on constitutional text or precedent, but solely on moral unacceptability.  
  - A clearly sourced legal rule (e.g., legislative enactment) is ignored by judges because it is "too unjust to apply," even where no higher positive law voids it.  
  Prescription practices, even with revivals and waivers, operate *within* the framework of positive law and do not demonstrate courts invalidating sourced rules purely on merit. They show policy/moral *choices* in lawmaking, not merit determining legal validity itself.

  **In summary:** The cluster presupposes prescription extinguishes legal liability, not moral wrongness, grounded in practical goods (repose, finality) and institutional fairness. While compatible with both major jurisprudential camps, it reveals law's complex mediation between morality and practicality, with waiver being the point where purely pragmatic justifications falter. The asymmetry in revival attempts highlights law's distinctive treatment of criminal immunity as a substantive right.
