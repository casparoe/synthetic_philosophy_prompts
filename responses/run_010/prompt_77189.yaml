prompt: |-
  I'm a third-year philosophy PhD student — decision-theory-adjacent, though my dissertation is on something else entirely — and I've somehow ended up as the part-time "risk person" for a small regional resilience fund. We hand out maybe fifteen grants a year, $50k to $400k each, for things like levee upgrades for small towns, heat-refuge networks, drought contingency for farming co-ops. Every application arrives with a benefits figure and a probability attached, and almost none of the probabilities are worth anything. The modelling is thin, the base rates are tiny, and half the time the consultant clearly wrote a number down because the form has a mandatory field for one. The board votes, and the votes go in the published minutes with reasons attached. Nothing gets to the board without a written justification from me, and the board's one actuary gets to append a dissent.

  To be clear about what I don't want: I know Ellsberg. Don't walk me through the three-colour urn, I've taught it. And I don't want a survey of who said what about whether ambiguity aversion is rational — I've read enough of that and it doesn't help me on a Thursday afternoon. What I want is the translation: a procedure I can actually run.

  So:

  1. Give me the procedure itself, as an ordered set of steps with the question asked at each one, what counts as a sufficient answer, and where it stops at a recommendation versus where it hands the thing upstairs to the board because it's a values question and not a facts question. Assume I have no stats training past one grad methods course, and that the actuary is skeptical of everything I say.

  2. The heart of it should be a test for when a single point estimate of a probability is good enough to reason from and when it isn't — i.e. when the fund should be treating its uncertainty as a spread of possible probability assignments rather than a number, and which decision rule to run in that case. Worst case? Something less paranoid? How do you choose between them without cheating? Be explicit about what each candidate rule costs us, meaning which good projects each one turns away.

  3. The board refuses to hear "we don't know." They want one expected-value cell in the spreadsheet, always, for every proposal. Right now I fudge it with something I made up and have been calling an ignorance discount: take the expected benefit, multiply by (1 − x), where x is supposed to track how much the experts disagree with each other. It's crude but it looks defensible and it outputs a number, which is the only reason it has survived this long. Tell me honestly whether it's any good. Two things I specifically want: can a linear discount like that even express ambiguity aversion, or does it just collapse into being extra risk-averse about a bigger number, which is a different thing with different consequences? And what does it do to the people we ask — if reporting disagreement gets your own project discounted, do you still report it? If the whole idea is bad, give me the least-bad single-number replacement and say plainly what it's hiding.

  4. Some of our ignorance is cheap to fix: a $5k survey, one pilot season, borrowing a hydrology report from the neighbouring catchment. Fold that in. How should the procedure decide between deciding now under ambiguity and spending money and a year to convert the problem into a risk problem first? My hunch is that ambiguity aversion changes this answer in a way that straight expected-value thinking doesn't, because resolving ambiguity is worth more to us than its effect on the mean benefit. If that's right, say it properly and show me why. If I'm wrong, tell me I'm wrong.

  5. There's the usual objection that ambiguity-averse preferences can be pumped — that if you'll pay a bit to dodge a bet with unknown odds, someone can walk you through a sequence of swaps that leaves you worse off than where you started. Ours is a sequential world in practise: renewals, phase twos, follow-on grants in the same catchment, and the board remembers what it approved last time. Does my procedure expose the fund to that? What does dynamic consistency cost us here, and is it worth buying? Please don't just tell me to be consistent — I want to know what giving up consistency actually gets us.

  6. Mark every place where the procedure looks mechanical but is really me making a judgement call. I'd rather flag those in the minutes myself than have someone find them two years later.

  Then run the whole thing end to end on three real-shaped proposals:

  - A town of about 4,000 wants $180k for a levee upgrade. The consultant's model says it avoids an expected $900k of damage over 25 years, but the flow record for this river is only 40 years long and there's a live dispute among the engineers about whether the last decade is even representative of the climate the levee will face.
  - A farming co-op wants $90k to trial a drought-tolerant variety that's widely grown two countries over and nowhere in our region. Nobody can give me a local yield distribution, and the co-op's own estimate is visibly optimistic in a way I can't prove.
  - A city wants $400k for a heat-refuge network. The benefit is close to unquantifiable — mostly deaths avoided, some of it just comfort — and there is essentially no modelling behind the number in the form. But everyone on the board already wants to fund it, and I'm the one who has to write the justification. Give me the procedure's honest output even if it's just "your rule says yes, and here's how thin the reasoning under it is." And if the procedure says no, or says pilot-first-then-decide, tell me straight, because I will not like it and I'll probably argue with you about it.
reasoning: |-
  Okay, let me tackle this step by step. The user is a philosophy PhD student working part-time on risk assessment for a small resilience fund. They need a practical procedure to handle ambiguous probabilities in grant applications, not theoretical discussions. 

  First, I need to address their specific pain points: unreliable probability estimates, board demands for single-number outputs, and the tension between ambiguity aversion and operational needs. The current "ignorance discount" method is a band-aid solution that likely creates perverse incentives - applicants might hide disagreements to avoid discounts.

  The core challenge is designing a test to distinguish between "risk" (known probabilities) and "uncertainty" (ambiguous probabilities). For the test, I consider using a Confidence-Quality Matrix that evaluates evidence depth and consensus. When evidence is shallow or disputed, we switch to ambiguity-sensitive decision rules like Max-Min or Hurwicz rather than expected value.

  For the ignorance discount, I realize linear discounting is fundamentally flawed because it conflates risk aversion with ambiguity aversion. A better single-number alternative would be Expected Shortfall, which preserves the downside focus of ambiguity aversion while outputting a number.

  On information gathering, ambiguity aversion does change the calculus - resolving ambiguity has additional value beyond improving estimates. The procedure should include a VOIA (Value of Information under Ambiguity) calculation that accounts for both variance reduction and ambiguity reduction.

  For dynamic consistency concerns, I note that while pumping is theoretically possible, practical constraints like project indivisibility and board oversight mitigate this. The trade-off is worth it for robustness.

  The judgment calls need explicit flagging: setting loss thresholds, choosing alpha values, defining "consensus." These should be documented in minutes.

  For the levee case, the short flow record and climate dispute trigger ambiguity protocols. The farming co-op's optimism needs verification - pilot funding makes sense here. The heat-refuge project is tricky; with unquantifiable benefits, it becomes a values decision for the board, but we can frame it with precautionary principle reasoning.

  Throughout, I'm balancing philosophical rigor with operational practicality, remembering the user's need for defensible procedures that output board-friendly numbers while honestly representing uncertainty.
answer: |-
  Here's a practical procedure designed for your constraints – operationalizing ambiguity aversion while outputting a single "expected value" number, flagging judgment calls, and handling dynamic consistency. It treats ambiguity as a *procedural switch* rather than a theoretical debate.

  **Core Philosophy:** Separate "Risk" (known probabilities) from "Uncertainty/Ambiguity" (unknown/misspecified probabilities). Use ambiguity-averse rules only when ambiguity is *diagnosed* and material. Treat information gathering as a *strategic ambiguity-reduction tool*.

  ---

  ### The Procedure: Ambiguity-Aware Grant Evaluation (AAGE)

  **Goal:** Output a single "Decision EV" number for the board's spreadsheet while transparently documenting the quality of the probability estimate and the presence of ambiguity.

  **Inputs:** Project Application (Cost C, Point Estimate Benefit B, Point Estimate Probability P, Supporting Documentation), Budget for Information Gathering (G_budget).

  **Outputs:** 
  1.  **Decision EV:** Single number for the board's spreadsheet (Adjusted Benefit * Adjusted Probability).
  2.  **Ambiguity Flag:** `Risk` | `Mild Ambiguity` | `Severe Ambiguity`.
  3.  **Recommendation:** `Fund` | `Reject` | `Fund with Pilot/Survey ($X)` | `Escalate (Values)`.
  4.  **Justification Note:** For minutes, explaining ambiguity, adjustments, judgment calls, and dissent potential.

  **Steps:**

  1.  **Assess Probability Quality (The "Is it Ambiguous?" Test):**
      *   **Question:** Is the provided probability `P` based on well-established, relevant data and models with expert consensus?
      *   **Sufficient Answer (Risk):** Deep data (>20 independent observations), validated model, documented expertise, no significant dissent cited/known. *Output Flag: `Risk`.* Proceed to Step 3.
      *   **Insufficient Answer (Ambiguity):** Thin data (<10 obs), untested/modeled assumptions, significant expert disagreement, reliance on non-representative analogues, obvious optimism bias (even if unprovable). *Output Flag: `Mild Ambiguity`* (if 1-2 issues) or *`Severe Ambiguity`* (if >2 issues or severe dissent). Proceed to Step 2.
      *   **Judgment Call:** Defining "well-established," "relevant," "significant dissent," "obvious optimism." *Document the specific deficiencies clearly in the Note.*

  2.  **Characterize Ambiguity & Set Ambiguity Parameters:**
      *   **Question:** What's a plausible *range* for the true probability `[P_low, P_high]`? What's the *worst plausible case (P_worst)*?
      *   **Sources:** Literature review (even quick), expert calls (yours/board's), consultant report dissent, known biases (e.g., "optimism bias common in co-op proposals"). If impossible, use `[0, 1]` and `P_worst = 0`.
      *   **Set Ambiguity-Aversion Parameter `α`:** `α = 0.1` (Mild Ambiguity), `α = 0.3` (Severe Ambiguity). (Rationale: `α` blends Maxmin and Maxmax; higher `α` = more aversion. 0.3 is moderately conservative; justify baseline in policy doc).
      *   **Judgment Call:** Defining `P_low`, `P_high`, `P_worst`. Choosing baseline `α`. *Document the range sources and chosen `α` in the Note.*
      *   **Output:** `P_range = [P_low, P_high]`, `P_worst`, `α`.

  3.  **Calculate "Adjusted Probability" (P_adj):**
      *   **If Flag = `Risk`:** `P_adj = P` (Use the point estimate).
      *   **If Flag = `Ambiguity`:** `P_adj = (α * P_worst) + ((1 - α) * ((P_low + P_high)/2))`  
          *(This is the Hurwicz criterion: weighted avg of worst case and midpoint of range).*
      *   **Output:** `P_adj`

  4.  **Assess Benefit Quality & Adjust (B_adj):**
      *   **Question:** Is the benefit `B` quantifiable, reliable, and monetized?
      *   **Sufficient Answer:** Tangible damages avoided (property, crop loss), well-defined service metrics, robust valuation study. `B_adj = B`.
      *   **Insufficient Answer:** Intangible benefits (lives saved, comfort, equity), speculative valuations, poor modelling. *Escalate to Board as Values Question.* If forced to quantify:
          *   Use lower-bound estimate if defensible.
          *   Apply a conservative discount (e.g., 0.5-0.8) *explicitly for benefit uncertainty*, not ambiguity.
          *   `B_adj = Conservative_Estimate`
      *   **Judgment Call:** Distinguishing quantifiable vs. intangible, choosing discount for intangibles. *Document aggressively in the Note, especially if escalating or forced to quantify.*

  5.  **Calculate "Decision EV" & Project NPV:**
      *   `Decision_EV = B_adj * P_adj`
      *   `Project_NPV = Decision_EV - C`
      *   **Output:** `Decision_EV` (for spreadsheet), `Project_NPV`

  6.  **Evaluate Information Gathering (VOIA - Value of Information under Ambiguity):**
      *   **Question:** Is there a cheap ($X < G_budget, fast) way to significantly reduce ambiguity (e.g., pilot, survey, data buy)?
      *   **Estimate Potential Reduction:** How much could `[P_low, P_high]` narrow? (e.g., Pilot might shift `P_low` from 0.1 to 0.4).
      *   **Calculate Ambiguity Reduction Value (ARV):**
          *   Calculate `P_adj_current` (Step 3 with current range).
          *   Estimate `P_adj_future` (Step 3 with *expected narrowed* range).
          *   `ARV = (P_adj_future - P_adj_current) * B_adj`
      *   **Calculate Variance Reduction Value (VRV - Standard EVPI):**
          *   Estimate expected reduction in variance of outcomes (simplified: if pilot costs $X, reduces downside risk by $Y, `VRV ≈ Y - X`).
      *   **Total VOIA ≈ ARV + VRV**
      *   **Decision:**
          *   If `VOIA > Cost_of_Info` & `Cost_of_Info < G_budget` & Time OK: Recommend `Fund Pilot/Survey ($Cost_of_Info)`.
          *   Else: Proceed to Recommendation.
      *   **Judgment Call:** Estimating potential range narrowing, simplifying VOIA/ARV/VRV. *Document assumptions heavily.*

  7.  **Make Recommendation:**
      *   If `Project_NPV > 0` AND NOT Escalated: Recommend `Fund`.
      *   If `Project_NPV <= 0` AND NOT Escalated: Recommend `Reject`.
      *   If Escalated (Step 4): Recommend `Escalate (Values)` - Board decides based on non-quantifiable factors.
      *   If Information Gathering Recommended (Step 6): Recommend `Fund Pilot/Survey ($X)`.

  ---

  ### Addressing Your Specific Queries

  1.  **Ignorance Discount (1 - x): Is it any good?**
      *   **Honestly? It's flawed but salvageable.** It *does* express a *form* of ambiguity aversion by discounting the expected benefit. However:
          *   **It conflates risk & ambiguity aversion:** It just makes you more risk-averse about a bigger number. True ambiguity aversion (Maxmin, Hurwicz) specifically worries about the *uncertainty over the probabilities themselves*, not just bad outcomes. Your discount penalizes projects where experts disagree, even if the mean estimate is solid.
          *   **Perverse Incentives:** Yes! Applicants/consultants are incentivized to hide or minimize disagreement to avoid the discount. This *increases* your actual ambiguity without you knowing.
          *   **What it hides:** It hides the *nature* of the uncertainty (range, worst-case) and the *reason* for the discount (disagreement vs. bad data vs. model weakness). It treats all "x" the same.
      *   **Least-Bad Single-Number Replacement:** **Use the Hurwicz-based `P_adj` (Step 3) multiplied by `B_adj`.** This explicitly incorporates a plausible worst-case (`P_worst`) and the range (`P_low`, `P_high`) via `α`. It's still a single number but better reflects ambiguity aversion's core concern: protection against the unknown bad probability. **What it hides:** The specific range and the chosen `α`. *Flag these explicitly in the Note.*

  2.  **Information Gathering (VOIA) & Ambiguity Aversion:**
      *   **Your hunch is CORRECT.** Ambiguity aversion makes resolving ambiguity intrinsically more valuable than just reducing variance (standard EVPI). Why? Resolving ambiguity eliminates the *aversion premium* you're paying (the gap between `P` and `P_adj`). The `ARV` component in Step 6 directly captures this extra value. You'd potentially fund information gathering even if standard EVPI (just `VRV`) wouldn't justify it, because reducing the *fear of the unknown* has standalone value under ambiguity aversion.

  3.  **Dynamic Consistency ("Pumping") & Cost:**
      *   **The Risk:** Yes, sequential decisions (renewals, follow-ons) expose you. Imagine rejecting Project A today under ambiguity aversion (using Maxmin/Hurwicz). If a *slightly better* but still ambiguous Project A+ comes next year, consistency might force rejection again, even if collectively accepting A then A+ would have been good. An optimizer could exploit this.
      *   **Does AAGE Expose You?** Potentially, yes, because it uses ambiguity-averse rules (`P_adj`) at each stage.
      *   **Cost of Consistency:** Rigid consistency forces you to potentially forgo *sequences* of individually ambiguous but collectively positive projects. It prioritizes short-term robustness over long-term opportunity.
      *   **Is it Worth Buying? (Giving up Consistency)** **Often yes, for a fund like yours.** Why?
          *   **Indivisibility/Lumpiness:** Your projects are large and discrete. You can't take tiny fractional stakes in many ambiguous projects to diversify; you fund whole levees or co-op trials.
          *   **Robustness Focus:** Resilience funding prioritizes avoiding catastrophic failures (floods, famine, heat deaths). AAGE's conservatism aligns with this mission.
          *   **Political Reality:** A major failure from an ambiguous project funded due to inconsistent pumping would devastate the fund's credibility. Avoiding that catastrophe outweighs the missed opportunity of a string of small ambiguous wins.
          *   **Mitigation:** The `α` parameter offers flexibility. Lowering `α` over time for *follow-on projects in the same domain* (where some ambiguity was resolved by the first project) can partially bridge the consistency gap without abandoning robustness. *Document this policy clearly.*

  4.  **Judgment Calls (Flagged for Minutes):**
      *   Step 1: Defining data/model adequacy, "significant" dissent, "obvious" bias.
      *   Step 2: Setting `P_low`, `P_high`, `P_worst`, and the baseline `α` value.
      *   Step 4: Deciding if benefits are quantifiable, choosing a benefit discount factor, or escalating.
      *   Step 6: Estimating how much information gathering will narrow `[P_low, P_high]`, simplifying VOIA calculations.
      *   Dynamic `α` Adjustment: Deciding to lower `α` for follow-ons in the same domain/catchment.

  ---

  ### Running AAGE on Your Proposals

  **Proposal 1: Levee Upgrade ($180k cost, $900k benefit claimed, P=??)**
  1.  **Prob Quality:** Thin data (40yrs), unrepresentative period? Major engineer dispute? **Flag: SEVERE Ambiguity.**
  2.  **Characterize:** Assume `P` claimed ~0.1 (900k * P = Expected Benefit? Not stated, critical!). Dissent suggests true probability could be much lower or higher. `P_range = [0.02, 0.15]`, `P_worst = 0.02` (catastrophe unlikely but plausible given climate uncertainty). `α = 0.3`.
  3.  **P_adj:** = `(0.3 * 0.02) + (0.7 * ((0.02+0.15)/2))` = `(0.006) + (0.7 * 0.085)` = `0.006 + 0.0595` = **0.0655**
  4.  **Benefit:** Quantifiable (property damage). `B_adj = $900k`.
  5.  **Decision_EV:** = `900,000 * 0.0655` = **$58,950**
  6.  **NPV:** `$58,950 - $180,000` = **-$121,050**
  7.  **VOIA:** Could a $20k hydrology study narrow the range? Maybe shift `P_low` to 0.05? `P_adj_future` ≈ `(0.3*0.05) + (0.7*((0.05+0.15)/2))` = `0.015 + 0.07` = `0.085`. `ARV = (0.085 - 0.0655) * 900,000` = `$17,550`. `VRV` likely small. `VOIA ~$17.5k` < `$20k` cost? **Not clearly worth it.**
  8.  **Recommendation:** **Reject** (Negative NPV). *Note: Severe ambiguity on probability (short record, climate rep, expert dispute) led to significant downward adjustment (P_adj=0.0655 vs claimed ~0.1). EV insufficient despite quantifiable benefits. Info gathering cost likely exceeds value.*

  **Proposal 2: Drought-Tolerant Crop Trial ($90k cost, Benefit? P? Optimism)**
  1.  **Prob Quality:** No local data, non-representative analogue, proven optimism bias. **Flag: SEVERE Ambiguity.**
  2.  **Characterize:** Co-op's implied `P` likely high (e.g., 0.8 for success?). Given unknowns and bias: `P_range = [0.3, 0.7]`, `P_worst = 0.3` (complete failure plausible). `α = 0.3`.
  3.  **P_adj:** = `(0.3 * 0.3) + (0.7 * ((0.3+0.7)/2))` = `(0.09) + (0.7 * 0.5)` = `0.09 + 0.35` = **0.44**
  4.  **Benefit:** Quantifiable (yield difference * price * acreage). But co-op estimate likely inflated. Apply 20% discount: `B_adj = B_claimed * 0.8`. (Assume B_claimed implies EV benefit of e.g., $300k if successful? So `B_adj = $240k`).
  5.  **Decision_EV:** = `$240,000 * 0.44` = **$105,600**
  6.  **NPV:** `$105,600 - $90,000` = **+$15,600**
  7.  **VOIA:** A $15k pilot season could resolve ambiguity almost entirely! Shift `P_range` to e.g., `[0.5, 0.6]`, `P_worst=0.5`. `P_adj_future` ≈ `(0.3*0.5) + (0.7*0.55)` = `0.15 + 0.385` = `0.535`. `ARV = (0.535 - 0.44) * 240,000` = `$22,800`. `VRV` also significant (reduces risk of full $90k loss). `VOIA > $22.8k` > `$15k` cost.
  8.  **Recommendation:** **Fund Pilot ($15k)**. *Note: Severe ambiguity due to no local data and applicant optimism. Full NPV positive but marginal. High value in resolving ambiguity cheaply via pilot (VOIA >> cost). Recommend funding pilot season first to establish local probability.*

  **Proposal 3: Heat-Refuge Network ($400k cost, Benefit? P? No model, Board wants it)**
  1.  **Prob Quality:** No model, no data. **Flag: SEVERE Ambiguity.** (But probability is actually the least of the worries).
  2.  **Characterize:** Meaningless to assign `P_range` without `B`. Skip to Benefit.
  3.  **Benefit:** **INADEQUATE.** Core benefits (lives saved, comfort) are fundamentally intangible and poorly quantified. The provided number is essentially fictional.
  4.  **Recommendation:** **ESCALATE (Values Question)**. *Note: Core benefits (lives, comfort, equity) are inherently non-quantifiable and not robustly monetized. The provided benefit figure lacks credible foundation. This is a values-based decision for the Board concerning priorities, equity, and willingness to fund projects with intangible benefits.*
      *   **If Board Forces a Number:** This is where your old discount *might* be least bad, or explicitly use a "Value of Statistical Life" (VSL) with caveats. E.g., Assume 1 life saved/year (conservative?), VSL ~$10M (standard range, highly contentious), `B_adj = $10M * [Very Low P_adj, e.g., 0.05] = $500k`. `NPV = $500k - $400k = +$100k`. **Recommend Fund** but *Note: HEAVILY QUALIFIED. Benefit quantification is highly speculative and based on contentious assumptions (VSL, P_adj). NPV positive only under these specific, contestable assumptions. Board approval likely reflects values prioritization over quantifiable cost-benefit.* This is messy, but sometimes necessary. Escalation is cleaner.

  ---

  **Why this works for you:**

  *   **Outputs a Number:** `Decision_EV` feeds the board's spreadsheet.
  *   **Handles Ambiguity:** Uses Hurwicz (`P_adj`) to incorporate ranges/worst-case, expressing true ambiguity aversion.
  *   **Transparent:** Flags ambiguity level and documents critical judgment calls in the Note for the minutes.
  *   **Improves Incentives:** Encourages better data (VOIA for pilots) and doesn't punish reported disagreement *per se* (it feeds into the range, not a linear discount).
  *   **Manages Dynamics:** Prioritizes robustness via `α`, accepts some dynamic inconsistency cost as worth paying for resilience.
  *   **Operational:** Provides clear steps, distinguishes risk/ambiguity/values questions.

  **The Trade-offs:**

  *   **Hurwicz vs. Maxmin:** Hurwicz (`P_adj`) is less paranoid than pure Maxmin (`P_worst`). This avoids rejecting *too many* potentially good but ambiguous projects (like the crop trial pilot). You buy some opportunity at the cost of slightly less extreme robustness.
  *   **Judgment Required:** It doesn't eliminate subjectivity (nothing can), but forces it into documented, specific choices (`P_low`, `α`, benefit discount).
  *   **Complexity:** More steps than just `EV = B * P`. The justification Note is crucial for explaining this to the board and the actuary. Frame it as "rigorous honesty about uncertainty."

  This procedure gives you a defensible, ambiguity-aware process that outputs the required number while providing the intellectual honesty your philosophy PhD demands. Good luck with the heat refuge!
