prompt: |-
  I'm putting together a reading group and I want a slightly weird framing question, so bear with me. Popper died in 1994, which means he never ran into the AI safety proposal that you can oversee a model much smarter than you by having two such models debate each other in front of a weaker judge — the idea being that its easier to catch a lie than to produce a truth, so the debaters' self-interest does the epistemic work. Where do you think he'd actually land on that? Would he see it as a clean institutionalization of conjecture and refutation, criticism doing the job of error-elimination? Or would he think it corrupts the whole idea, on the grounds that the debaters are optimizing to win over a particular audience rather than exposing their claims to real tests, and that a judge who cant check most of what's said isn't in a position to refute anything? Commit to a verdict instead of splitting the difference, and say how confident you are in it plus the one thing you're least sure about — e.g. whether you're reading Popper's idea of criticism too narrowly to make the comparison work. Hard cap: 450 words.
