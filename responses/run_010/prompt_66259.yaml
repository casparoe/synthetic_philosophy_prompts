prompt: |-
  You are a philosopher of mind who has also worked through the clinical neuropsychology of commissurotomy, and I would like you to treat what follows as a reconstruction problem rather than a survey. Please think carefully before answering. I am in the second year of a PhD and for the past eight months I have spent two afternoons a week volunteering in the presurgical evaluation unit at an epilepsy center, observing the assessment of candidates for corpus callosotomy and for resective surgery. I have read the standard philosophical literature on brain bisection and the unity of consciousness, so I am not asking for a digest of it, and you do not need to cite anything: I want the argument, not the bibliography. What I want is an audit of the practices I watch every week, which seem to me to embed substantive commitments that nobody on the team would state aloud — and to embed commitments that pull against one another.

  Let me describe three of them concretely. First, the lateralized testing sessions. A word is flashed to one visual field, or an object is placed in one hand out of view behind a curtain; the patient looks at the examiner and says he felt nothing and saw nothing; his left hand is then allowed to reach behind the curtain, and it picks out the correct object from a grab bag. The technician records all of this on one line of one data sheet for one patient. The sheet has a single column headed "patient response," and entries are annotated "LH" or "RH," but there is no field anywhere for who is answering. Second, intermanual conflict. In the classic reports, and occasionally in front of me, a patient's left hand unbuttons a shirt that the right hand has just buttoned, or reaches for a cup the other hand has pushed away. This is treated entirely as a management problem — sleeves, mittens, patience, reassurance to the family — and never as anything with ethical standing. The attending's stock formulation when relatives are alarmed is that we do not have two patients, we have one patient with a very bad internal communication problem; and our center's consent paperwork acknowledges that the operation may produce temporary conflict between the hands while promising that it will not change who the patient is. Third, the Wada test. The patient is awake; a barbiturate is injected into one internal carotid artery so that one hemisphere is silenced for several minutes while the other keeps working. The arm on the side opposite the injection goes limp, and if the silenced hemisphere is the speech-dominant one the patient becomes mute. During those minutes the team continues to address him in the second person, continues to take responses from the hand controlled by the awake hemisphere, shows him objects and pictures to remember, and then, once the drug wears off, accepts whatever he says about the interval as his own report of it. Meanwhile the go/no-go criterion for the eventual resection is explicitly a sufficiency judgment: whether the hemisphere that will be left standing can, on its own, carry his language and his memory well enough.

  The tension I cannot resolve is this. In the first protocol a hemisphere by itself is treated as less than the subject: its knowledge is partial, it cannot be spoken, and its testimony about its own experience is not to be trusted. In the third protocol either hemisphere by itself is treated as sufficient to carry the whole person, and the entire surgical decision is built on that sufficiency. And the same speech-dominant hemisphere is simultaneously discounted and enthroned: in the testing room its denial of awareness is overruled by what its own body's other hand goes on to demonstrate, while in the consent conversation and the post-anesthesia interview its verbal assent simply is the person's assent and its verbal account is the only account there is of what happened while it was mute.

  Working through that material, please give me the following:

  1. For each of the three practices separately, reconstruct the view of the unity of consciousness and of personal identity that the practice requires. Distinguish sharply between what the practice strictly presupposes — what would make it incoherent or self-defeating to run it otherwise — and what it merely sits comfortably with.
  2. Say whether the three practices can be licensed by a single view, or whether the unit is genuinely of two minds. If you think there is a real inconsistency, locate it precisely, and consider whether something like a non-branching clause in a psychological-continuity account, or a view on which subjecthood comes in degrees, or a view on which there are two streams of experience but only one person, dissolves it.
  3. Identify which rival positions the practices quietly rule out, and be explicit about where the practice is philosophically underdetermined — where two or more incompatible theories would license exactly the same protocol and the same data sheet.
  4. Tell me what would have to change on the ground if the "two subjects" reading were adopted officially, and what would have to change if a strict unity view were adopted. I want operational consequences: consent procedures, who is interviewed and how, the ethics of restraining a hand, whether a hemisphere's silence during anesthesia counts as a subject being absent, whether the "LH/RH" annotations survive.
  5. Finally, take a position on the testimony problem. If the speaking hemisphere routinely produces fluent accounts of behavior it did not initiate, what does the practice of recording "the patient reports" presuppose about the authority of verbal report, and can the same institution coherently treat that authority as defeasible in the testing room and conclusive in the consent conversation?

  Begin with a short brainstorming section in which you list the candidate theories that might license each practice and note which details of the protocols discriminate between them, before you commit to your reconstruction. End with your own verdict, stated plainly, on whether this unit's practice is philosophically coherent, where you are most confident, and where you think the evidence I have described simply does not decide the question.
reasoning: |-
  Hmm, this is a fascinating and complex request from a PhD student immersed in clinical neuropsychology. They're observing epilepsy surgery evaluations and noticing philosophical tensions in how the team treats consciousness and personal identity across different protocols. I need to approach this as a reconstruction problem rather than a literature survey.

  The user describes three concrete practices: lateralized testing (where knowledge is treated as partial and untrustworthy), intermanual conflict (treated as management issue), and Wada testing (where a single hemisphere is treated as sufficient for the whole person). The core tension they identify is that in some contexts a hemisphere is treated as less than a full subject, while in others it's treated as fully representing the person.

  The user wants me to systematically reconstruct each practice's presuppositions about consciousness and identity, assess whether they're coherent, identify what philosophical positions they rule out, explore operational consequences of alternative views, and finally address the testimony problem where verbal reports are treated differently across contexts.

  I'll start by brainstorming candidate theories that could license each practice. For lateralized testing, behaviorist approaches or phenomenal overflow theories might explain why isolated hemisphere responses aren't treated as testimony. The Wada test seems to presuppose something like Parfitian reductionism where psychological continuity defines identity. Intermanual conflict management appears consistent with Dennett-style narrative unity views.

  What's striking is how the same speech-dominant hemisphere has its authority both questioned (in testing) and affirmed (in consent). This suggests the institution is pragmatically switching between first-person and third-person stances depending on context - treating consciousness as unified when needing legal consent but as fragmented when probing capacities.

  The key discriminator seems to be social vs. epistemic contexts. In social/legal interactions (consent, post-Wada interview), the institution defaults to speech as the necessary and sufficient marker of personhood. But in epistemic contexts (lateralized testing), they acknowledge non-verbal evidence can override verbal denial.

  For philosophical coherence, I think the practices reflect a consistent pragmatic dualism: a metaphysical commitment to numerical identity (one person) paired with operational recognition of functional disunity. It's not that they're inconsistent - rather they're applying different criteria in different domains. The "who is answering" question doesn't appear on forms precisely because they've predefined the speaking subject as the only relevant testifier.

  If they adopted a strict two-subjects view, everything would change: consent would require bilateral awareness, post-Wada interviews might need to address each hemisphere separately, and restraining a "rebel" hand would become an ethical dilemma. Conversely, a strict unity view would make them dismiss intermanual conflict as mere malfunction rather than competing agency.

  On testimony, the institution reveals its core commitment: verbal report is the gold standard unless empirically contradicted by behavioral evidence. This is psychologically plausible (we all confabulate) but philosophically unstable - it privileges language as the near-sufficient condition for subjecthood.

  I feel most confident that the practices aren't accidental but reflect a coherent operational philosophy. Where I'm less certain is whether they could articulate this or whether it's purely instinctive. The evidence doesn't settle whether they're naïve realists about consciousness or sophisticated pragmatists - but their actions suggest the latter.

  The user's sharp observation about the missing "who is answering" field is particularly telling - it perfectly encapsulates how the institution centers the verbal subject as the only identity that matters legally and socially, even while scientifically acknowledging distributed cognition.
answer: |-
  ### Brainstorming: Candidate Theories & Discriminating Details  
  *(Key discriminators: how "subjecthood" is assigned, what counts as authoritative testimony, how conflict is interpreted)*  

  1. **Lateralized Testing (Word/Object Identification)**  
     - *Candidate Theories:* Epiphenomenalism about non-verbal consciousness; Behaviorism (only observable responses count); Access Consciousness theory (only reportable states matter); Split-mind views (tacitly treating each hemisphere as a distinct subject).  
     - **Discriminator:** Recording only the *verbal denial* as the "patient response" (annotated LH/RH) without attributing the correct non-verbal action to *any subject* presupposes that subjecthood requires **reportability to the social agent** (the examiner). The silent hemisphere’s knowledge is "data," not testimony.  

  2. **Intermanual Conflict Management**  
     - *Candidate Theories:* Narrative unity of the person (Dennett); Agentive unity (the "patient" is defined by the speech-capable hemisphere); Biological continuity (one organism = one person); Emergent unity (higher-order global workspace failure).  
     - **Discriminator:** Framing conflict as an "internal communication problem" (not two agents) presupposes **numerical identity of the person** is biologically fixed. Restraint is ethical *because* it’s not silencing a rival agent but managing a dysfunctional body part.  

  3. **Wada Test & Surgical Decision**  
     - *Candidate Theories:* Psychological continuity (Parfit); Sufficiency views (a hemisphere can sustain "enough" of the person); Speech-dominance as the seat of identity (Lockean); Embodied cognition (the functional body is the person).  
     - **Discriminator:** Addressing the patient as "you" during unilateral silencing presupposes that **the awake hemisphere *is* the person**, and its post-hoc verbal report is canonical. The "go/no-go" criterion treats a hemisphere as a **backup self**.  

  ---

  ### 1. Reconstructed Views of Unity/Identity per Practice  
  - **Lateralized Testing**  
    - *Presupposes:* Subjecthood requires **reportable access** to conscious content. A hemisphere without speech lacks authority to testify.  
    - *Compatible with:* Epistemic theories of subjectivity (only what is reportable "counts" as conscious for the person).  

  - **Intermanual Conflict**  
    - *Presupposes:* Personal identity is **biologically grounded** (one brain/body = one person). Conflict is pathology, not plural agency.  
    - *Compatible with:* Narrative views (the "story" of the person persists despite dysfunction).  

  - **Wada Test**  
    - *Presupposes:* Personal identity is **functionally transferable** to a single hemisphere if it sustains critical capacities (language, memory).  
    - *Compatible with:* Psychological reductionism (the person is wherever cognition is sufficiently intact).  

  ---

  ### 2. Coherence Across Practices: Inconsistency & Potential Resolutions  
  - **The Tension:** Lateralized testing treats a hemisphere *without speech* as a non-subject (its knowledge is "invisible"). The Wada test treats a hemisphere *with speech* as the full subject. The same speech-dominant hemisphere is **simultaneously demoted (when silent) and coronated (when speaking)**.  
  - **Inconsistency Location:** The protocols **equivocate on the criteria for subjecthood**: reportability (testing) vs. functional sufficiency (Wada).  
  - **Can a Single View License All?**  
    - **Yes, under a pragmatic "Speech-Access Sufficiency" view:** Subjecthood is assigned to whichever hemisphere *can report via speech*, and surgical decisions ensure at least one such hemisphere remains.  
    - **Resolutions:**  
      - *Non-branching clause:* Irrelevant (no temporal branching).  
      - *Subjecthood degrees:* Could work (e.g., the speaking hemisphere has "full" subjecthood; the non-speaking has "partial" but ethically negligible subjecthood).  
      - *Two streams, one person:* Compatible only if "one person" is a biological primitive overriding phenomenological disunity.  
  - **Verdict:** The practices are **operationally coherent** under a **speech-centric pragmatism** but **metaphysically unstable**. The unit prioritizes *socially legible agency* (speech) over phenomenological unity.  

  ---

  ### 3. Ruled-Out Positions & Underdetermination  
  - **Ruled Out:**  
    - **Radical split-mind views** (two subjects): Conflict would require adjudicating rights; Wada would need consent from both hemispheres.  
    - **Non-reductionism** (e.g., Cartesian ego): Unity couldn’t be disrupted by callosotomy.  
    - **Embodied/Extended Mind:** Intermanual conflict would imply multiple agents; lateralized knowledge would be "the patient’s" regardless of reportability.  
  - **Underdetermined:**  
    - **Lateralized Testing:** Compatible with both **Access Consciousness** (unreportable = unconscious) and **Phenomenal Overflow** (unreportable = conscious but ignored).  
    - **Wada Test:** Compatible with **Psychological Continuity** *or* **Biological Continuity** (if the body is the person, silencing half the brain shouldn’t affect identity).  

  ---

  ### 4. Operational Consequences of Rival Views  
  - **If "Two Subjects" Adopted:**  
    - **Consent:** Require assent from both hemispheres (e.g., via lateralized tasks).  
    - **Interviews:** Post-Wada, query each hemisphere separately; annotate responses as "RH-subject" or "LH-subject."  
    - **Restraint Ethics:** Restraining a "rebel" hand becomes silencing a subject; may require negotiation.  
    - **Anesthesia:** Hemisphere silencing = subject absence; data sheets split "patient" fields.  
    - **LH/RH Annotations:** Replaced with subject identifiers (e.g., "S1", "S2").  

  - **If Strict Unity View Adopted:**  
    - **Consent:** No change (unity is inviolate).  
    - **Intermanual Conflict:** Treat as purely mechanical (like a spasm); no ethical weight.  
    - **Lateralized Testing:** Record non-verbal responses as *the patient’s knowledge* (e.g., "Patient identified object via LH").  
    - **Wada Test:** Post-hoc reports are hearsay; avoid attributing experience ("RH dysfunction period" not "patient experience").  
    - **LH/RH Annotations:** Retained but framed as neural loci, not potential agents.  

  ---

  ### 5. Testimony Problem: Authority of Verbal Report  
  - **Presupposition:** Verbal report (from the speech-dominant hemisphere) is the **gold standard for subjective authority**. When uncontradicted by behavior, it is conclusive. When contradicted (e.g., left hand acts), it is overruled *only for that specific content*.  
  - **Coherence:** **Yes, institutionally**. The unit operates on a **default hierarchy**:  
    1. Speech is authoritative *unless empirically falsified*.  
    2. Non-verbal behavior can veto speech *only for domain-specific claims* (e.g., "I saw nothing" is falsified by LH action).  
    3. In social/legal contexts (consent), no veto exists → speech reigns.  
  - **Philosophical Vulnerability:** This privileges the speech hemisphere as the *definer* of the person’s narrative, risking **confabulation as identity-constitutive**.  

  ---

  ### Final Verdict  
  - **Coherence:** The unit’s practice is **operationally coherent but metaphysically divided**. It implicitly holds:  
    - *One biological person* (against two-subjects views).  
    - *Subjecthood = socially reportable agency* (speech as the necessary and sufficient condition for "counting" as the person).  
  - **Most Confident:** The **speech-centrism** is consistent across contexts. The speech hemisphere’s denials are overruled only when *its own body* provides counterevidence; elsewhere, its voice *is* the person’s voice.  
  - **Undecided by Evidence:** Whether non-verbal consciousness in the disconnected hemisphere has **ethical standing**. The practice treats it as a "dark" cognitive process (like blindsight) — but the intermanual conflict *could* suggest rudimentary agency. The protocols do not probe this.  

  **Plain Stance:** The unit’s approach is a **pragmatic dualism**: it assumes biological unity of the person while granting epistemic sovereignty to the speech apparatus. This is clinically functional but philosophically uneasy — a necessary fiction for managing the mind’s disunity. To resolve the tension, I’d advocate accepting **degrees of subjecthood** (the non-speaking hemisphere as a "partial subject" with moral weight but not autonomy), which would minimally disrupt practice while honoring the phenomena.  

  Would you like to explore revisions to consent forms or testing protocols to reflect this?
