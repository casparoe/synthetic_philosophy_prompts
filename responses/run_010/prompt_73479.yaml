prompt: |-
  My department runs a little internal seed grant — one course buyout plus about $5k for an RA — and the proposal is capped at two pages, but the committee is deliberately mixed (three philosophy people, two clinical psych, one from medical humanities), so it has to land with readers who don't share my jargon. My half-formed idea, which I've been chewing on with a friend who's doing her psychiatry rotation: everybody invokes Hacking's looping effects as if it were one feedback process, but I'm pretty sure there are at least two channels in there that behave very differently and get lumped together. One is descriptive — people learn a label, the label changes what gets noticed, reported, and even experienced, so the kind chases its own classification (the rise-and-fall of multiple personality diagnoses being the stock example). The other is organizational-political — the label becomes something people build an identity and a movement around, and then they turn around and contest and revise the classification itself (autism and ADHD are the obvious cases). My hunch is that these two push in opposite directions on the question of whether a psychiatric classification can be true of anything: descriptive looping makes the target move, whereas political looping actually pins it down enough that revision has a determinate object to fail or succeed at. And there's a second wrinkle I want to build in, which is that looping is nearly always described as a causal loop, but if you take an interventionist account of causation seriously the loop is non-modular — an intervention on the classification simultaneously changes the classified population and the conditions under which the classifier gathers evidence, so you can't hold the rest of the system fixed the way a clean intervention requires. I don't know yet whether that's a fatal problem for the whole framework or a technicality, and I'd rather the proposal say which.

  Turn this into the two pages. I want the research question stated so precisely that the clinical psych people on the committee can tell whether they agree or disagree with it, and so it isn't secretly two questions. Then explain what the existing ways of framing looping leave open — in particular, why splitting it into descriptive and organizational channels isn't just relabeling the same phenomenon, and what argument would show that the split does philosophical work. Then the approach: what I'd actually do over the nine months, month by month or phase by phase. My collaborator codes posts from online diagnosis communities, so there's a real shot at an empirical component — but be explicit about whether the philosophical core can stand on its own without that data, what the data could and couldn't settle, and what happens to the project if the collaboration falls through (it might, she's defending this spring). Also say why this route rather than the obvious alternatives, i.e. why argue about the structure of the feedback loop instead of just doing more history-of-psychiatry case studies or instead of jumping straight to the realism/anti-realism debate about whether these disorders are natural kinds. And I need the honest bits: what a successful result looks like as a deliverable, what would count as the project failing or collapsing into something trivial, and a short paragraph on what's probably too ambitious for nine months given that I'm also teaching.

  No bibliography, please — I'll add the references myself and I don't want you inventing any; naming positions, arguments, and examples is fine, just don't hand me citations. And one last thing: if you think the two-channel distinction is actually bogus, or that the non-modularity point quietly undercuts the whole thing rather than just adding a wrinkle, say so in a short paragraph at the end instead of papering over it. I'd rather find out now than from a reviewer.
