prompt: |-
  I'm on a working group drafting the head-of-state chapter of a constitution for a small place that's just voted to go independent but keep the Crown as a ceremonial head of state, and I've realised I don't actually have a principle for when that person is allowed to act against ministerial advice. My gut gives me verdicts though, so I want the principle read off them.

  1. The Belgian king who couldn't sign the abortion law in conscience and had his own government declare him temporarily unable to reign for a day so they could pass it without him, with parliament reinstating him the next day: wrong. Wrong in the cleverest way — he got the moral credit for refusing while arranging not to refuse. Except I also think the day-long incapacity was better than a straight veto, and I can't say why.

  2. The Luxembourg grand duke who flatly refused assent to the euthanasia law and got his assent power abolished as a result: not wrong, maybe even right. He said what he actually thought, in public, the country disagreed, the country changed the rule. But that's case 1 minus the trick, and I've condemned one and approved the other.

  3. The Queen proroguing Parliament on her PM's advice, with the top court later ruling the whole thing unlawful: she should have done exactly what she did. Refusing would have been much worse.

  4. But a PM asking to prorogue parliament for two years in the middle of a war to dodge a vote on that war — the head of state has to say no. Same structure as 3, different number, opposite verdict.

  5. The governor-general who sacked a PM who still commanded a majority in the lower house but couldn't get supply through, and installed the opposition leader on condition he pass supply and go to the country: the power existed, the use of it was wrong, and the worst part was doing it without warning the PM.

  6. The 1926 Canadian one, where the governor general refused a dissolution request from a minority PM who might still have had the confidence of the house: refusing was right. So now I've approved a refusal and condemned a dismissal and approved a different refusal, and I don't know what's doing the sorting.

  7. A bill abolishing the monarchy passes cleanly through both houses: sign it, immediately, no drama. But a bill that keeps the monarchy, strips its last discretionary powers, and also abolishes judicial independence: I want hesitation there, which is embarassing because that bill is better for the palace than the first one was.

  8. That UK parliamentary convention, King's Consent, where bills touching the prerogative or the monarch's own property and estates need the sovereign's consent before Parliament is even allowed to debate them, and which the palace is reported to have used to get draft bills changed in advance. I think this is worse than all of the above and it isn't even a reserve power — it's a veto applied in secret before the democratic process gets going. My condemnation here runs much hotter than it does for the open refusals in 1 and 2.

  9. The Japanese emperor, barred from saying anything political, going on television to talk about his age and his health, and the Diet duly writing a one-off law to let him abdicate: fine, entirely fine, everyone knew what he meant. But if a head of state used a speech to hint that a bill pending in the legislature was immoral, I'd call that out of line. Same move — indirect signalling — opposite verdict.

  My own guess at the principle is roughly: the head of state may act against advice only to keep the machinery of democratic accountability turning, never to change what the laws say. It's tidy, and it kills case 1 nicely, but it also kills my grand duke and my emperor, and I don't want to lose them.

  So: state the principle that best fits all this, one sentence, up front, before anything else. Then the clauses it needs, each with the case that motivates it and what the clause is doing. Then tell me plainly which of 1 through 9 it can't save and would have me give up, and whether 2 and 9 can be rescued by a clause that doesn't also rescue 8. Then rule on three I've left out: (a) a hung parliament where the leader of the biggest party and the leader who has actually assembled a working majority both ask to be appointed; (b) a government that just lost a formal confidence vote asking for a dissolution instead of resigning; (c) a bill that passed with a clear procedural defect, say the house wasn't quorate — can the head of state refuse on process grounds if the rule is supposedly no discretion about content? And say whether the Norwegian setup, where the king's veto is only suspensive and the bill becomes law anyway if enough successive parliaments pass it unchanged, is a better template for our draft than the British never-refuse convention.

  Hard cap of 800 words. No reading list, no footnotes — I cant check anything, so give me the reasoning rather than the sources.
reasoning: |-
  Okay, the user is drafting a constitution chapter for a ceremonial head of state who retains reserve powers, and they need a clear principle for when that figure can act against ministerial advice. They've listed nine real-world scenarios where heads of state faced such dilemmas, along with their intuitive judgments about each. Their challenge is to extract a unifying principle from these conflicting intuitions.  

  First, I notice the user's gut reactions prioritize democratic functionality over personal conscience or political outcomes. They condemn covert interventions (like Belgium's temporary incapacity trick or the UK's secretive King's Consent) but approve of transparent actions that safeguard core democratic processes, even if controversial (like Luxembourg's euthanasia veto leading to constitutional change or the Japanese emperor's indirect signaling about abdication). The outlier is their approval of the Queen's 2019 prorogation despite its later illegality—here, they seem to value strict adherence to formal advice unless the request is egregiously antidemocratic.  

  The user's proposed principle—"act only to maintain democratic accountability, never to change laws"—is too narrow. It would forbid the Luxembourg and Japan cases they want to preserve, where heads of state *did* influence legal/political outcomes (euthanasia law revision, abdication law). Their deeper need seems to be: **how can a ceremonial figure legitimately intervene without usurping democratic will?**  

  I propose: **The head of state may act against ministerial advice solely to enforce explicit constitutional obligations or restore fundamental democratic processes when these are demonstrably compromised.** This covers:  
  - Refusing two-year prorogation (war scenario) as it destroys accountability.  
  - Blocking procedurally defective laws (e.g., lack of quorum).  
  - Rejecting dissolution after a confidence loss (to force resignation).  
  - But forbids vetoes on policy grounds (Belgium/Luxembourg euthanasia/abortion) unless tied to procedural flaws.  

  For their cases:  
  - Rescues Luxembourg (veto triggered democratic amendment) and Japan (abdication signaled constitutional necessity) by treating them as *process* corrections.  
  - Condemns Belgium (procedural trickery), King's Consent (preemptive veto), and policy-based signaling.  
  - Allows the Queen's 2019 prorogation (advice was formally valid) but rejects the hypothetical two-year version.  

  The Norwegian suspensive veto model aligns well—it allows intervention but ensures democratic supremacy. For their three new scenarios:  
  - (a) Appoint the leader with proven majority.  
  - (b) Refuse dissolution post-confidence loss.  
  - (c) Refuse procedurally defective bills.  

  This balances their desire for restraint with rare interventions to prevent democratic collapse.
answer: |-
  **Principle:** *The head of state may act against ministerial advice only to prevent a breakdown in the constitutional order or a fundamental subversion of democratic accountability, where no timely, lawful remedy exists through ordinary political processes, and only by the least disruptive means necessary.*

  ### Clauses Motivated by Cases
  1.  **Explicit Constitutional Duty Clause:** The head of state *must* refuse advice if compliance would violate an explicit, unambiguous constitutional prohibition or duty binding upon them. *(Motivated by Case 7: Refusing the bill abolishing judicial independence fulfills a core constitutional duty to uphold the separation of powers, unlike signing a lawful bill abolishing the monarchy.)*
  2.  **Process Integrity Clause:** The head of state *may* refuse advice concerning parliamentary or electoral processes (e.g., dissolution, prorogation, assent) if the request demonstrably and severely obstructs the legislature's constitutional function or the electorate's ability to hold the government accountable, and where the legislature itself cannot act. *(Motivated by Cases 3 & 4: Refusing a 2-year war prorogation prevents subversion of accountability; granting the 2019 prorogation (advice later ruled unlawful) respected the formal advice mechanism, expecting judicial remedy.)*
  3.  **Last Resort & Minimal Intrusion Clause:** Any refusal must be a last resort, preceded by clear warning where possible, and employ the least intrusive action to resolve the crisis. Refusal is not a policy veto. *(Motivated by Cases 5 & 6: Refusing dissolution to a minority PM (1926) was a minimal check; sacking Whitlam without warning was overly intrusive despite the crisis. Case 1: Belgium's "incapacity" trick violated the spirit of constitutional duty and transparency, even if less disruptive than a veto.)*
  4.  **Transparency & Political Responsibility Clause:** Any refusal must be public and promptly expose the impasse to democratic resolution (e.g., via parliament or election). Covert influence or pre-legislative vetoes are prohibited. *(Motivated by Cases 2, 8 & 9: Luxembourg's open refusal allowed democratic response; Japan's signaling worked because it addressed a unique constitutional gap (no abdication law) and led to open legislative action. Case 8's "King's Consent" is condemned as a secretive, undemocratic veto.)*

  ### Cases the Principle Cannot Save (Requires Giving Up Intuition)
  *   **Case 1 (Belgium):** Condemned. The "temporary incapacity" violates the *Transparency Clause* and circumvents the head of state's explicit duty, making it worse than a clean refusal or assent. The principle forbids such subterfuge.
  *   **Case 2 (Luxembourg):** *Partially Saved, but requires reinterpretation.* The principle rejects refusal based *solely* on conscience/policy grounds. However, if the Grand Duke argued the law fundamentally violated an explicit constitutional principle (e.g., inviolability of life), the *Constitutional Duty Clause* might apply, making the refusal a last-resort act triggering democratic correction. Your approval hinges on seeing it this way, not as a pure policy veto.
  *   **Case 9 (Japan):** **Rescued.** The Emperor signaled a unique *constitutional gap* (no abdication mechanism) impacting the office itself, not policy. It was transparent and forced democratic resolution, aligning with the *Transparency* and *Last Resort* clauses. Hinting about a policy bill would violate the principle.

  **Can 2 & 9 be rescued without rescuing 8?** Yes. Cases 2 (reinterpreted) and 9 involve *transparent* actions forcing *open* political resolution for *constitutional* reasons (duty or gap). Case 8 is *covert* interference *before* democratic debate on *policy/prerogative*. The *Transparency & Political Responsibility Clause* explicitly forbids 8 while permitting 2 (if constitutional) and 9.

  ### Rulings on New Scenarios
  *   **(a) Hung Parliament (Biggest Party vs. Working Majority):** Appoint the leader demonstrating the working majority. Acting against advice to appoint the largest party leader without a majority would subvert parliamentary confidence, the core democratic mechanism.
  *   **(b) Lost Confidence Vote, Requests Dissolution:** **Refuse dissolution.** The government has lost the constitutional basis to govern. Resignation is the constitutional consequence. Granting dissolution subverts accountability by letting a defeated government trigger an election. (Aligns with Case 6).
  *   **(c) Procedurally Defective Bill (e.g., No Quorum):** **May refuse assent.** This falls under the *Process Integrity Clause*. Assenting to a bill passed in violation of fundamental procedural rules undermines the legislature's constitutional function and the rule of law. It's about process, not content.

  ### Norwegian Suspensive Veto vs. British Never-Refuse
  The **Norwegian suspensive veto is the superior template** for your draft. It directly embodies the principle:
  1.  **Last Resort:** Allows the head of state to signal profound concern.
  2.  **Minimal Intrusion:** Merely delays, doesn't block.
  3.  **Transparency & Political Responsibility:** Forces open debate and reaffirmation by a subsequent parliament, ensuring democratic supremacy.
  4.  **Prevents Subversion:** Addresses the core concern of fundamental constitutional harm without creating a permanent veto.
  The British "never-refuse" convention is too rigid, risking complicity in extreme scenarios covered by Clauses 1 & 2 (e.g., blatantly unconstitutional bills, destructive prorogation). The Norwegian model provides a safer, constitutionally sound release valve.
