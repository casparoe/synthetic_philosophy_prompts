prompt: |-
  I cover science and ideas for a weekly current-affairs magazine, and for the past year I have been reporting on the panel that rules on contested entries in our national register of memorial sites — the body that decides, when a community's memory and the documentary record disagree, what the register is entitled to assert. Its published guidance pulls in two directions at once: one clause holds that oral tradition carries a presumption of good faith and is not to be dismissed merely for want of documentary support, while another gives the written record primacy wherever it speaks directly to the question at issue. The panel's decisions, so far as I have been able to track them, are these.

  A town maintained, on the strength of a song still sung there, that a railway viaduct had been built by men brought in from one particular county; the company's payroll archive showed a largely itinerant workforce drawn from all over the country. The panel entered the documented workforce in the register and recorded the song beneath it as a surviving local tradition, saying nothing about whether it was true.

  A village held that a cholera burial ground lay beneath what is now a car park; no map or register marked it, though the vestry minutes referred to ground set aside and not to be dug, and a geophysical survey showed disturbed earth. The panel upheld the claim provisionally and protected the site pending excavation.

  A church roll of honour omitted a man whose family insisted he had died of his wounds and been buried at home; the regimental return listed him as missing, presumed deserted. The family produced a photograph with a name and date pencilled on the back and a death certificate from a neighbouring district, and the panel corrected the entry over the regimental association's objection.

  A community identified the field in which a strike had been called in the 1870s; a newspaper of the period placed the meeting two miles away in another parish, and the panel followed the newspaper, noting in its reasons that the local account appeared to date from a pamphlet published in the 1960s by a man who had come to the area as an adult.

  The matter before the panel next month is the one my piece will turn on, and I would like to predict the ruling before it is announced. A former mining community holds that after a pit disaster in 1907 seven men were buried at night in an unmarked plot on the colliery's own land, because the company would not meet the cost of sending the bodies home; the tradition names the seven and points to a particular parcel. The coroner's inquest file records that all the bodies were identified and released to their families, and the company's accident register lists the seven as sent home. Against that: the inquest was conducted by the county medical officer, who sat on the colliery's board; the pit-head witnesses were examined as a group rather than singly; a newspaper report filed three days after the disaster, before the inquest opened, said that families were still waiting for news of the seven; and a deed shows the company acquiring the parcel six weeks later, with no stated purpose, never used and sold on in the 1950s. A privately funded ground-penetrating radar survey of the parcel shows anomalies consistent with either disturbed ground or a disused culvert. The fullest written account of the tradition is a 1934 pamphlet by a local schoolmaster; of three people interviewed for an oral history recording in 1978, two could plausibly have read it, but the third — who named the seven in a different order and added an eighth man the pamphlet does not mention — had left school at nine and is recorded as saying she had never read anything about the disaster.

  What I need is the following. First, set out the candidate rules that would account for all four of the panel's earlier decisions, and say for each which precedent it is being stretched to fit; I suspect that at least two of these rules can be told apart only by their reasons rather than by their results, and I want to know where. Second, say what each rule implies for the mining case, including whether any of them converge on the same verdict by different routes. Third, give me your best prediction of what the panel will actually do, with your reasons for preferring that rule to the others as a description of its practice. Fourth, since I intend to argue in the piece that it should rule one way rather than the other, tell me which of the four precedents is the closest analogue and what the panel would be committing itself to by following it — in particular, whether deciding this case on the provenance of the inquest file would leave the viaduct decision intact. And finally, if this case genuinely fails to discriminate between the leading rules, name the sort of further case the panel could take next that would.
reasoning: |-
  Okay, the user is a science and ideas reporter covering a national memorial register panel. They've described four past cases and a new mining disaster case they want to predict. I need to analyze the panel's decision patterns to identify consistent rules, apply them to the new case, predict the outcome, and suggest arguments for the user's article.

  Looking at the four precedents: The viaduct case prioritized documents over oral tradition. The cholera burial ground accepted oral tradition when supported by circumstantial evidence (vestry minutes + geophysical data). The war memorial case overrode official documents with family evidence (photo + death cert). The strike location rejected recent oral tradition when contradicted by contemporary newspapers.

  The mining case has conflicting evidence: official documents say bodies were sent home, but there's a strong oral tradition about secret burials, supported by suspicious circumstances (biased inquest, group witness testimony, newspaper report), a land transaction, and ambiguous GPR results. The 1978 interview with the woman who couldn't have read the pamphlet adds credibility.

  I should identify candidate rules that explain all four precedents. Rule 1 might prioritize contemporary documents over oral tradition unless contradicted by reliable evidence. Rule 2 could accept oral tradition when supported by circumstantial evidence. Rule 3 might give weight to non-institutional evidence challenging official records. Rule 4 could assess the provenance and reliability of oral traditions.

  Applying these to the mining case: Rule 1 would reject the burial claim due to official documents. Rule 2 might accept it given supporting anomalies. Rule 3 could side with the community due to evidence of institutional bias. Rule 4 might validate the tradition based on the illiterate witness.

  For prediction, I think Rule 3 fits best because the panel has previously overruled documents when institutional credibility was questioned (like the war memorial case). The biased coroner and irregular inquest parallel the regimental association's unreliability.

  For the user's argument, the war memorial precedent is the closest analogy - both involve challenging institutional records with personal evidence. Following this wouldn't undermine the viaduct decision since that lacked credibility concerns about the documents.

  If the case doesn't clearly distinguish between rules, a future case with unambiguous physical evidence (like the cholera excavation) could force clearer rule prioritization.
answer: |-
  Based on the panel's precedents and the mining case details, here's a structured analysis addressing your requests:

  ### 1. Candidate Rules Accounting for All Four Precedents
  *(Each rule explains all four outcomes but relies on distinct reasoning)*

  *   **Rule A: Contemporary Documents > Oral Tradition *Unless* Oral Tradition Has Independent Corroboration or Documents Are Provenance-Suspect**  
      *   Viaduct: Documents (payroll) uncontradicted & no corroboration for song → Rejected.  
      *   Cholera: Documents (vestry minutes) *support* tradition ("ground not dug"), plus geophysical corroboration → Upheld.  
      *   War Memorial: Documents (regimental return) *contradicted* by other documents (death cert) and physical evidence (photo) → Overruled.  
      *   Strike Location: Contemporary document (newspaper) uncontradicted; tradition's provenance traced to unreliable later source (1960s pamphlet) → Rejected.  
      * **Stretched Precedent:** War Memorial. Rule A typically prioritizes documents, but here family documents *overruled* institutional documents due to provenance/contradiction.

  *   **Rule B: Oral Tradition Valid *If* Plausibly Pre-Dating Documented Challenges & Supported by Context**  
      *   Viaduct: Tradition plausibly old but *directly contradicted* by robust documents → Rejected.  
      *   Cholera: Tradition old, supported by context (vestry, survey) → Upheld.  
      *   War Memorial: Tradition (family) old & directly supported by alternative documents → Upheld.  
      *   Strike Location: Tradition demonstrably *post-dated* by documents and proven recent origin → Rejected.  
      * **Stretched Precedent:** Viaduct. Rule B *could* accept old traditions, but the direct contradiction forced recording it neutrally as "tradition."

  *   **Rule C: Resolve Conflicts by Assessing Institutional Credibility & Bias**  
      *   Viaduct: Company payroll (routine admin) likely objective → Prevailed.  
      *   Cholera: Vestry minutes (local admin) objective → Supported tradition. No biased institution attacked.  
      *   War Memorial: Regimental association (institution protecting reputation) potentially biased vs. family docs → Overruled.  
      *   Strike Location: Newspaper (contemporary independent record) > Pamphleteer (later, potential agenda) → Rejected.  
      * **Stretched Precedent:** Cholera. Rule C emphasizes bias, but here the panel leaned on circumstantial *support* rather than attacking the vestry's credibility.

  *   **Rule D: Physical/Tangible Evidence Trumps Conflicting Records *If* Credible**  
      *   Viaduct: No physical evidence → Documents prevailed.  
      *   Cholera: Geophysical evidence supported tradition → Upheld.  
      *   War Memorial: Photo & Death Cert (tangible docs) > Regimental record → Upheld.  
      *   Strike Location: No physical evidence → Contemporary document prevailed.  
      * **Stretched Precedent:** War Memorial. Rule D elevates tangible evidence, but the photo/death cert *are* documents, just more personal/credible than the institutional record.

  **Where Reasons Matter More Than Results:** Distinguishing Rule A vs. Rule C in the **War Memorial** and **Strike Location** cases. Both rules reject the strike tradition and uphold the war memorial family, but for different reasons:
  *   Rule A: Focuses on *contradiction within documents* (death cert vs. regimental return) and provenance (family photo).
  *   Rule C: Focuses on *institutional bias* (regimental association protecting reputation).

  ### 2. Implications for the Mining Case (1907 Pit Disaster)
  *   **Rule A (Documents > Tradition unless Docs Suspect):** Likely **REJECTS** burial claim. Inquest file & accident register are direct, contemporary documents seemingly resolving the issue. The evidence *against* their credibility (biased coroner, group testimony, newspaper) is circumstantial. GPR is ambiguous. The 1978 witness adds little *new* corroboration.
  *   **Rule B (Tradition Valid if Old & Context-Supported):** Likely **UPHOLDS** burial claim. Tradition dates to at least 1934 (pre-dating modern scrutiny?), supported by: land deed anomaly, suspicious inquest context, ambiguous GPR, and crucially, the 1978 witness *independent* of the pamphlet. Context casts doubt on documents.
  *   **Rule C (Assess Institutional Bias):** Likely **UPHOLDS** burial claim. Strong evidence of institutional bias/impropriety: Coroner was colliery board member (conflict of interest), witnesses examined as a group (suppression?), newspaper suggests families uninformed, land acquired mysteriously. Company documents lack credibility.
  *   **Rule D (Physical Evidence Trumps):** Likely **PROVISIONAL UPHOLD** (like Cholera). GPR anomalies, while ambiguous ("disturbed ground or culvert"), constitute tangible evidence *potentially* supporting the tradition, warranting protection/excavation. Absent excavation, it's not definitive, but the *presence* of anomalies tips the scale provisionally against the documents.

  **Convergence?** Rules B, C, and D converge on **upholding the claim** (B on tradition age/support, C on institutional bias, D on physical evidence), though D is provisional. Rule A stands alone in likely rejecting it based on document primacy.

  ### 3. Predicted Panel Ruling & Reasoning
  *   **Prediction:** The panel will **UPHOLD THE CLAIN PROVISIONALLY** (similar to the Cholera case), protecting the parcel pending possible excavation, but not yet amending the register definitively.
  *   **Reasoning for preferring Rule C (Institutional Bias) as the best descriptor:**
      1.  **Precedent Alignment:** The **War Memorial** decision directly shows the panel overriding official documents due to concerns about the institution's credibility/reliability (regimental association protecting reputation). The evidence of bias here (coroner's conflict, group testimony, suspicious timing of land deal) is even stronger and directly challenges the core documents (inquest, accident register).
      2.  **Nuance over Absolutes:** Unlike Rule A's strict document priority or Rule D's reliance on definitive physical proof, Rule C allows the panel to weigh the *context* of evidence creation – which is central to this case and was decisive in War Memorial.
      3.  **Addressing Ambiguity:** The ambiguous GPR and lack of *conclusive* physical proof (Rule D) or *irrefutable* tradition provenance (Rule B) make a definitive ruling risky. A provisional uphold based on serious institutional credibility concerns (Rule C) is a cautious middle path mirroring the Cholera approach, while strongly signaling doubt about the documents.
      4.  **The 1978 Witness:** Her testimony, independent of the pamphlet, provides just enough direct oral tradition support to tip the balance when combined with the bias evidence, fitting Rule C's need for *some* positive evidence alongside discrediting the opposition.

  ### 4. Argument for Your Piece & Precedent Analogue
  *   **Your Argument:** You should argue the panel **SHOULD UPHOLD THE CLAIM PROVISIONALLY**. The evidence of institutional malfeasance (coroner's conflict, land deal) casts overwhelming doubt on the "official" documents. Combined with the plausible, independent oral tradition (1978 witness) and ambiguous physical evidence, this meets the threshold for provisional protection/excavation seen in the Cholera case. Absolute certainty is impossible now, but the balance of evidence and the panel's duty to scrutinize power favor the community's memory here.
  *   **Closest Analogue:** The **War Memorial Decision** is the strongest analogue.
      *   **Why:** Both involve overriding official institutional records (regimental return / inquest & accident register) due to concerns about that institution's credibility/objectivity (association protecting reputation / company covering up costs & blame), using alternative evidence (family documents & photo / oral tradition, context, deed, GPR).
  *   **Commitment by Following It:** Following War Memorial commits the panel to the principle that **the provenance and potential bias of official records are legitimate grounds for overriding them in favor of other evidence, including oral tradition, when that evidence is credible and the institutional context suggests unreliability.** It strengthens the "oral tradition" clause of the guidance by showing it can prevail against documents when those documents are tainted.
  *   **Impact on Viaduct:** **It leaves Viaduct intact.** Viaduct involved *no* challenge to the *credibility* or *provenance* of the company payroll – it was uncontradicted routine admin. The ruling here based on *institutional bias* specifically distinguishes cases where the documents themselves are suspect due to their origin, which wasn't argued or present in Viaduct.

  ### 5. If the Case Fails to Discriminate: The Next Discriminating Case
  If the mining case's provisional uphold aligns with Rules B, C, and D, a future case needed to discriminate between them would involve:

  *   **Scenario:** A well-documented, credible *contemporary* record directly contradicting a long-standing oral tradition.
  *   **Crucial Elements:**
      1.  **No Evidence of Institutional Bias:** The document's origin is demonstrably neutral and routine (e.g., a parish register, unbiased contemporary diary).
      2.  **Strong Corroboration for Tradition's Age:** Multiple independent early sources attest to the tradition pre-dating any known challenge.
      3.  **Definitive Physical Evidence:** Clear, unambiguous archaeological or scientific proof *supporting the tradition* is discovered *after* the panel's initial ruling.
  *   **How it Discriminates:**
      *   If the panel **upholds the tradition** based solely on its proven age and independence (Rule B), even against credible neutral documents and *before* physical proof is definitive, it prioritizes tradition's longevity.
      *   If the panel **rejects the tradition** due to the credible neutral documents *until* definitive physical proof emerges (Rule D), it prioritizes tangible evidence as the ultimate decider.
      *   If the panel **rejects the tradition** due to the credible neutral documents *despite* its age, citing lack of bias or corroboration (Rule A), or **upholds it** citing the need for excavation *only after* physical evidence is found (Rule D), it clarifies the hierarchy (Docs > Tradition unless Physical Proof).
      *   The *absence of bias* (Rule C) would be neutralized, forcing a choice between Rules A, B, and D.

  This future case would isolate the core tension: Does a venerable, well-provenanced oral tradition *alone* ever outweigh credible, neutral contemporary documents, or does it *always* require some form of corroborating evidence (context, bias, or physical proof)? The mining case, with its bias and ambiguous physical evidence, doesn't force this pure choice.
