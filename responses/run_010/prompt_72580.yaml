  ### Money-Pump Activity Design for Decision-Theory Seminar

  **Objective:** Demonstrate that money-pump vulnerability stems from dynamic choice mechanisms (myopic step-by-step choices without commitment) rather than intransitive preferences alone. Students experience the pump as individuals, committees, and with pre-commitment.

  **Materials:**
  - **Tokens:** Poker chips (1 token = $0.10 USD).
  - **Lottery Tickets:** Cards labeled A, B, or C.
  - **Random Draw:** 100-sided die, random number generator (1–100), or bingo cage with balls.
  - **Commitment Device:** A physical "commitment contract" (printed card) binding the holder to reject all cycle trades.
  - **Prizes:** Tokens convert to real money (e.g., 10 tokens = $1.00, max $3/student). Pay at the end via digital transfer or cash.

  **Phase 1: Individual Money Pump**  
  *Goal: Induce intransuitive preferences and pump myopic individuals.*

  #### **Lotteries (Prize Structures):**
  - **A:** 3 tokens for sure.  
  - **B:** 4 tokens with 80% probability (if random draw ≤ 80), 0 otherwise.  
  - **C:** 32 tokens with 10% probability (if random draw ≤ 10), 0 otherwise.  

  *Expected Values:*  
  - A: 3.0  
  - B: 3.2  
  - C: 3.2  

  **Intransitivity Mechanism:**  
  - Most participants prefer **A > B** (certainty effect: 3 sure > 4 at 80%).  
  - Most prefer **B > C** (B has higher probability: 80% > 10%).  
  - Most prefer **C > A** (C’s high prize outweighs low probability).  
  *Result:* Intransitive cycle A > B, B > C, C > A.  

  #### **Rules:**
  1. **Initial Endowment:** Each student receives 10 tokens + Lottery A.  
  2. **Trades (Fee = 0.5 tokens per trade):**  
     - Trade 1: Swap A for C + pay 0.5 tokens.  
     - Trade 2: Swap C for B + pay 0.5 tokens.  
     - Trade 3: Swap B for A + pay 0.5 tokens.  
  3. **Lottery Resolution:** After trades, resolve final lottery via random draw.  
  4. **Earnings:** Final tokens + lottery outcome.  

  **Timeline (15 mins):**  
  - 0–5 mins: Explain lotteries, have students privately rank A, B, C. Poll to show intransitivity (e.g., "Raise hand if A > B and C > A").  
  - 5–10 mins: Run trades sequentially. Announce each trade (e.g., "Trade A for C now! Fee: 0.5 tokens").  
  - 10–15 mins: Resolve lotteries, calculate earnings.  

  **Outcome:**  
  - **Pumped Student:** Starts with A (worth 3) + 10 tokens. After 3 trades: Back to A + (10 - 1.5) = 11.5 tokens. Total = 11.5 + 3 = **14.5 tokens**.  
  - **Non-Pumped:** Holds A + 10 tokens. Total = 10 + 3 = **13 tokens**.  
  *Net Loss:* Pumped students lose 1.5 tokens ($0.15) despite ending with the same lottery.  

  **Debrief Mapping (Phase 1):**  
  - **Intransitive Preferences:** Poll reveals A > B, B > C, C > A.  
  - **Myopic Choice:** Students accept each trade as a local improvement.  
  - **Vulnerability:** Fees accumulate without global foresight.  

  **Predictable Issue & Handling:**  
  - **Problem:** 2–3 students see the cycle and refuse Trade 1.  
  - **Solution:** Emphasize sequential myopia: *"At each step, ask only: ‘Is this trade better *now*?’"* If they resist, say: *"Play along to test the theory – you’ll earn extra credit for participation."*  

  ---

  **Phase 2: Committees and Commitment**  
  *Goal: Show pumps depend on governance, not preferences alone. Committees are pumped despite no member’s intransitivity; commitment avoids the pump but is contentious.*

  #### **Part A: Committee Money Pump**  
  **Rules:**  
  - Form 5 committees of 3 students each.  
  - **Preference Roles (assigned randomly):**  
    - **Member 1 (Risk-Averse):** A > B > C (values certainty: A is safe).  
    - **Member 2 (EV-Maximizer):** B > C > A (B: 3.2 > C: 3.2 ≈ A: 3).  
    - **Member 3 (Optimist):** C > A > B (C’s 32-token prize is worth the risk).  
  - **Voting:** Majority rule for trades.  
  - **Endowment:** 30 tokens (10 per member) + Lottery A.  

  **Trade Cycle (Same as Phase 1, Fee = 0.5 tokens per trade).**  

  **Outcome:**  
  - **Trade 1 (A → C):**  
    - Member 1: Against (A > C)  
    - Member 2: For (C > A)  
    - Member 3: For (C > A) → **Trade accepted.**  
  - **Trade 2 (C → B):**  
    - Member 1: For (B > C)  
    - Member 2: For (B > C)  
    - Member 3: Against (C > B) → **Trade accepted.**  
  - **Trade 3 (B → A):**  
    - Member 1: For (A > B)  
    - Member 2: Against (B > A)  
    - Member 3: For (A > B) → **Trade accepted.**  
  - **Committee Earnings:** Start: 30 + A. End: A + (30 - 1.5) = 28.5 tokens. Resolve A: +3 tokens. Total = **31.5 tokens** (vs. 33 if no trades).  

  **Debrief Mapping:**  
  - **Collective Intransitivity:** Committee has A > B (Trade 3), B > C (Trade 2), C > A (Trade 1).  
  - **No Individual Intransitivity:** Each member has transitive preferences.  
  - **Key Insight:** Pumps arise from stepwise aggregation (e.g., voting), not flawed preferences.  

  #### **Part B: Commitment Device**  
  **Rules for Individuals:**  
  - Before Trade 1, offer a "commitment device" for 0.6 tokens. If purchased, it blocks all 3 trades.  
  - **Earnings if purchased:** 10 (tokens) - 0.6 (device) + 3 (A) = **12.4 tokens** (better than pumped 11.5, worse than optimal 13).  

  **Rules for Committees:**  
  - Before Trade 1, committee votes on buying the device (0.6 tokens).  
  - **Deliberation:** Members argue based on role preferences:  
    - Risk-Averse (Member 1): *"Buy it! We’ll lose tokens otherwise."*  
    - EV-Maximizer (Member 2): *"Don’t waste tokens; we’ll choose wisely."*  
    - Optimist (Member 3): *"I want Trade 1 – no device!"*  
  - If device bought, trades are blocked.  

  **Outcome:**  
  - **Individuals:** Most refuse to buy (myopia: "I’ll make good choices").  
  - **Committees:** Deadlock common. Only buys if Risk-Averse + Optimist ally (e.g., 2/3 vote).  

  **Debrief Mapping:**  
  - **Commitment:** Avoids pumps by binding future choices.  
  - **Time Inconsistency:** Device seems costly pre-cycle but saves money post-cycle.  
  - **Collective Action Problem:** Committees struggle to agree on device purchase.  

  ---

  **Timeline (Total 75 mins):**  
  - **Phase 1 (20 mins):** Intro (5), Preferences poll (5), Trades (5), Resolve earnings (5).  
  - **Phase 2 (40 mins):**  
    - Committees form + assign roles (5).  
    - Committee trades + voting (15).  
    - Commitment device intro (5).  
    - Device purchase + trades (10).  
    - Resolve earnings (5).  
  - **Debrief (15 mins):** Map activities to theory (table below), discuss takeaways.  

  | **Activity Moment**               | **Tests This Assumption**                          |  
  |-----------------------------------|---------------------------------------------------|  
  | Phase 1 Preferences Poll          | Intransitive preferences exist                    |  
  | Phase 1 Trade Cycle               | Myopic choices enable money pumps                 |  
  | Committee Voting                  | Aggregation (e.g., voting) creates intransitivity |  
  | Commitment Device Purchase        | Pre-commitment avoids time inconsistency          |  
  | Committee Device Debate           | Collective governance complicates commitment      |  

  **Predictable Problems & Fixes:**  
  1. **Phase 1 Refusal:** 2–3 students refuse Trade 1. *Fix:* Use peer pressure ("Most of you did this!") or offer a $0.10 bonus to comply.  
  2. **Committee Confusion:** Members forget roles. *Fix:* Give color-coded role cards.  
  3. **Device Underuse:** Students dismiss commitment. *Fix:* Pre-activity example: *"Imagine paying $1 to block junk food purchases – would you?"*  

  **Limitation to Clarify Verbally:**  
  - **Sophisticated Foresight:** Real agents *might* avoid the pump by foreseeing the cycle and refusing Trade 1. The activity cannot test this (students know it’s coming). Emphasize: *"The pump targets agents who make *myopic* choices – not those with intransitive preferences *per se*."*  

  **Takeaway Message:**  
  Money pumps exploit *how* choices are made across time (stepwise vs. planned). Intransitivity is a precondition, but dynamic governance (voting, commitment, foresight) determines vulnerability.
