  First, unpacking what went wrong last month: The "literal truth" defense failed because regulators care about consumer perception, not technical accuracy. GC was right - the grape juice concentrate situation shows how "true" statements can still be misleading when the net impression is deceptive. 

  User's core needs are crystal clear: 
  - A dual-track system (legal vs ethical) that doesn't let marketers conflate them
  - Concrete pass/fail gates with evidence requirements
  - Escalation triggers for when things exceed their expertise
  - Brutal honesty about where the system will create friction

  The four test cases are perfectly chosen to stress-test the procedure: 
  1. The "no added sugar" debacle (classic implied claim issue)
  2. Trans fat rounding (regulatory compliance vs implied health claim)
  3. Clean protein claim (control case)
  4. The recyclability landmine (knowingly misleading omission)

  Biggest philosophical landmine: How to handle "lying without false statements." Need to pick a side on whether misleading implications count as lies. Leaning toward the Saul/Fallis view that intentional deception through implication qualifies - especially since the GC already hinted this matters ethically. 

  For the legal track, settled law is clear: FTC's net impression test reigns supreme. Literal truth is irrelevant if the overall message is deceptive. Will structure the procedure to hammer this home with concrete examples.

  Operational challenge: Balancing rigor with 15-minutes-per-item reality. Can't require consumer surveys, so will rely on "reasonable person" judgments backed by documented reasoning. Key flags will be: health/safety claims, kid-targeted products, and sustainability claims (which are enforcement hot zones).

  On the recyclability case... yeah this is ugly. VP knowingly misled, and the procedure should call this out as both legally risky and ethically a lie. But need to show how the system forces this conclusion step-by-step so user has armor when presenting it.

  Final note: User's self-awareness about "where I keep getting steamrolled" suggests marketing pushes hard. The procedure needs built-in conflict resolution triggers when legal and ethical verdicts diverge. GC escalation isn't failure - it's the system working as designed.
answer: |-
  Here’s a compliance procedure designed for your constraints, separating **legal risk** from **ethical truthfulness**, with clear escalation paths. It uses an 8-step checklist (≈15 min/item), outputs dual verdicts, and flags judgment calls. Philosophical assumptions are explicitly noted.

  ---

  ### **Compliance Claim Assessment Procedure**  
  *(For Packaging, Ads, Scripts, & Rep Communications)*  

  #### **I. Pre-Check (60 seconds)**  
  - **Question:** Is this claim *identical* to one previously approved for the *exact same product/context*?  
  - **Pass:** ✅ If documented approval exists.  
  - **Fail:** ⚠️ Proceed to full assessment.  
  - **Evidence:** Approved claim log (date, product, context).  

  #### **II. Legal Risk Track**  
  1. **Literal Truth Check**  
     - **Q:** Is every *explicit statement* factually accurate?  
     - **Pass:** ✅ All statements are verifiably true (e.g., lab reports, supplier certs).  
     - **Fail:** ❌ Immediate legal risk → Escalate to GC.  
     - *Evidence: Ingredient lists, lab data, supplier affidavits.*  

  2. **Net Impression Test (FTC Standard)**  
     - **Q:** Would a *reasonable consumer* likely be misled by the *overall message* (including visuals, omissions, context)?  
     - **Pass:** ✅ Claim is unambiguous; no implied false message.  
     - **Fail:** ❌ High legal risk → Escalate to GC.  
     - *Evidence: FTC guidance, past warning letters, competitor cases.*  
     - ⚠️ **Judgment Call:** Use the "headline test" – what’s the main takeaway for a busy shopper?  

  3. **Materiality Check**  
     - **Q:** If the net impression is false/misleading, would it affect a consumer’s purchasing decision?  
     - **Pass:** ✅ The claim is trivial (e.g., "new look!").  
     - **Fail:** ❌ Legal risk → Escalate to GC.  
     - *Evidence: Consumer complaints, market research (if available), common sense (e.g., health claims are always material).*  

  4. **Omission Check**  
     - **Q:** Does omitting information make the claim misleading (e.g., hiding material facts)?  
     - **Pass:** ✅ Full context is clear (e.g., "0g trans fat" + "see nutrition facts").  
     - **Fail:** ❌ Legal risk → Escalate to GC.  
     - *Evidence: Regulatory requirements (e.g., FDA labeling rules), FTC omission precedents.*  

  **Legal Verdict Output:**  
  - **Low Risk:** Passes all 4 steps.  
  - **High Risk:** Fails any step → Escalate to GC.  

  #### **III. Ethical Truthfulness Track**  
  5. **Intent Check**  
     - **Q:** Does the claim *intend* to imply something untrue?  
     - **Pass:** ✅ No evidence of deceptive intent.  
     - **Fail:** ❌ Ethical violation → Flag for review.  
     - *Evidence: Marketing briefs, email trails, sworn statements.*  
     - ⚠️ **Judgment Call:** Assess context (e.g., known pressure to mislead).  

  6. **Implication Test**  
     - **Q:** Does the claim *deliberately* exploit ambiguity to imply a falsehood?  
     - **Pass:** ✅ No reasonable implied false message.  
     - **Fail:** ❌ Ethical violation → Flag for review.  
     - *Evidence: Internal debates, common consumer misperceptions.*  
     - **Philosophical Assumption:** Follows Jennifer Saul’s view – misleading implications can be ethically equivalent to lying if *intentional*. If Adler/Carson’s view (only literal falsity = lying) is correct, this step is less strict.  

  7. **Conscience Check**  
     - **Q:** Would you feel comfortable explaining this claim to:  
       a) A skeptical journalist?  
       b) Your child?  
     - **Pass:** ✅ "Yes" to both.  
     - **Fail:** ❌ Ethical violation.  
     - ⚠️ **Judgment Call:** Requires honest self-assessment.  

  **Ethical Verdict Output:**  
  - **Clean:** Passes all 3 steps.  
  - **Lie:** Fails Step 5 + Step 6 (intentional deception).  
  - **Misleading:** Fails Step 6 alone (exploits ambiguity).  

  #### **IV. Divergence Protocol**  
  - **Legal Pass + Ethical Fail (e.g., technically true but deceptive):**  
    - REQUIRED: Add clarifying language (e.g., asterisk with disclaimer).  
    - Escalate to GC for final sign-off.  
  - **Legal Fail + Ethical Pass (rare):**  
    - Revise claim to comply with law.  

  #### **V. Escalation Triggers**  
  - **To Compliance Lead (You):**  
    - Ambiguous net impression (Step 2).  
    - Ethical concerns (Steps 5–7).  
    - Materiality disputes (Step 3).  
  - **To General Counsel:**  
    - Any legal failure (Steps 1–4).  
    - Claims targeting children, health/safety, or sustainability.  
    - Prior legal threats involving similar claims.  

  #### **VI. Limitations**  
  - **False Positives (Annoyance):**  
    Over-flagging technically true claims (e.g., "0g trans fat" with heart symbol). Mitigate by documenting *why* it passes net impression test.  
  - **False Negatives (Lawsuit Risk):**  
    Missed implications in new contexts (e.g., TikTok trends). Mitigate by quarterly trend reviews.  

  ---

  ### **Case Applications**  

  #### **1. Kids’ Juice: "No Added Sugar" + Grape Juice Concentrate**  
  - **Legal Track:**  
    - Step 1: ✅ Literally true (no sucrose/fructose *added*).  
    - Step 2: ❌ Net impression: "no sugar" → misleading (concentrate = sugar source).  
    - **Verdict:** High risk → Escalate to GC.  
  - **Ethical Track:**  
    - Step 5: ❌ Intent: Marketing knew consumers equate "added sugar" with "sweeteners."  
    - Step 6: ❌ Implication: Exploits ambiguity in "added."  
    - **Verdict:** Lie (intentional deception).  
  - **Action:** Revise label (e.g., "Sweetened with Fruit Concentrates").  

  #### **2. Snack Bar: "0g Trans Fat" + Heart Symbol**  
  - **Legal Track:**  
    - Step 1: ✅ Complies with FDA rounding rules.  
    - Step 2: ⚠️ Net impression: Implies "heart-healthy" → Material? *Judgment Call*: Likely misleading (heart symbol implies health benefit beyond absence).  
    - **Verdict:** Escalate to you → If net impression fails, High Risk to GC.  
  - **Ethical Track:**  
    - Step 6: ❌ Implication: Exploits regulatory gap to imply unverified benefit.  
    - **Verdict:** Misleading (intentional ambiguity).  
  - **Action:** Remove heart symbol; add "Not a significant source of trans fat."  

  #### **3. Protein Bar: "10g Protein"**  
  - **Legal Track:**  
    - Step 1: ✅ Lab-verified.  
    - Step 2: ✅ No implied health claim (e.g., no "builds muscle" imagery).  
    - **Verdict:** Low risk.  
  - **Ethical Track:**  
    - Steps 5–7: ✅ No intent or implication of falsehood.  
    - **Verdict:** Clean.  
  - **Action:** Approve.  

  #### **4. Supply Chain Email: "Made from Recycled Material & Fully Recyclable"**  
  - **Legal Track:**  
    - Step 1: ❌ Literally false ("fully recyclable" is untrue in practice).  
    - **Verdict:** High risk → Escalate to GC.  
  - **Ethical Track:**  
    - Step 5: ❌ Intent: VP *knew* municipal programs don’t accept it.  
    - Step 6: ❌ Implication: Exploits technical vs. practical definitions.  
    - **Verdict:** Lie (intentional deception).  
  - **Action:** Retract email; disclose non-recyclability; GC-led disciplinary review.  

  ---

  ### **Key Philosophical Commitments**  
  1. **"Literal Truth" is Legally Irrelevant**  
     - Once net impression fails, "but it’s true!" has *zero* legal weight (per *FTC v. Cliffdale Assoc.*). Ethically, it may reduce blameworthiness if unintentional, but never excuses deception.  
     - **Defense:** Regulators punish deception, not falsity. Consumers don’t parse semantics – they react to overall messages.  

  2. **Lying Requires Intent**  
     - The procedure assumes Saul’s definition: lying = intentionally asserting a falsehood *or* inviting a false belief.  
     - **Operational Impact:** If Adler/Carson (literal falsity required) is correct, ethical violations would be rarer.  

  3. **Implications Can Be Lies**  
     - If marketing *intends* consumers to draw a false conclusion (e.g., "recyclable" → "curbside recyclable"), it’s ethically equivalent to lying.  

  ---

  **Final Output Per Claim**:  
  - **Legal Risk:** Low / High (GC Escalation)  
  - **Ethical Status:** Clean / Misleading / Lie  
  - **Action:** Approve / Revise / Escalate  

  This procedure forces transparency on legal/ethical splits, arms you with FTC-backed arguments, and mandates GC escalation for high-risk scenarios. Use the test cases as training benchmarks for marketing teams.
