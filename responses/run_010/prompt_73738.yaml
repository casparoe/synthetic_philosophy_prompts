prompt: |-
  I convene a graduate reading group in a history department that has spent the term on the historiography of British abolition, and two of my students — one trained in economic history, one in moral philosophy — have been talking past each other since February. The first holds that norms of this kind end because the material position of the elites who uphold them changes: Eric Williams's account in Capitalism and Slavery, on which the West Indian system had lost its economic weight, is his paradigm case, and he treats appeals to honor or humanity as downstream legitimation. He concedes that Drescher's Econocide badly damaged the crude version of that story — the British slave system was still expanding and profitable when the trade was abolished in 1807 — but he relocates the interest rather than abandoning it, pointing to the shifting political weight of the planter class against metropolitan commercial and industrial interests and to what abolition did for British naval power. The second holds that neither argument nor interest explains the timing, and that what collapses a practice is its revaluation inside an honor world: once the practice becomes a mark of disgrace before the peers whose esteem one actually cares about, it goes quickly and irreversibly. Her cases are Appiah's — dueling among British gentlemen, footbinding in China, British abolition — and she makes much of the 1829 encounter between Wellington and Winchilsea, in which a sitting prime minister fired a pistol at a peer and emerged with his standing enhanced even as the press denounced the practice as a superstition.

  Please write the joint statement these two should produce after a good-faith adversarial collaboration. I want, first, a numbered section of claims both can sign about how such norms actually end, including the reciprocal concessions: the economic historian's admission that Drescher's profitability data stands, and the honor theorist's admission that esteem is itself something people have interests in. Second, a table of the residual disagreements with three columns — the materialist's own wording, the honor theorist's own wording, and a neutral restatement that each would accept as fair to the other side. Third, the cruxes: the sub-questions such that settling one would move at least one of them. I suspect there are at least three — whether the timing of abolition across the Atlantic polities tracks an inflection in the relevant elite's material position or in its status configuration; why dueling withered in Britain while persisting among comparably status-competitive elites in France, Germany, and the American South under broadly similar economic conditions; and whether, in the contemporary West African programs for abandoning female cutting practices that pair public community declarations with alternative marriage arrangements, the declaration machinery is doing the causal work or merely riding along with improvements in women's economic prospects. For each crux, state what evidence or argument both accept as bearing on it and record each side's prediction in advance, so that the disagreement is falsifiable rather than rhetorical.

  If you judge that some portion of the dispute is verbal — that interest and honor are two descriptions of a single selection process rather than competing causes — say which portion, and identify what substantive residue survives the deflation. Keep the document under 1,000 words, make the table its longest component, and include no bibliography or reference list.
reasoning: |-
  Okay, the user is a graduate reading group convener in history dealing with two students entrenched in different interpretations of British abolition—one materialist (economic history) and one normative (moral philosophy). They've been talking past each other since February. The task is to craft a joint statement after adversarial collaboration, with three specific components: agreed claims, a table of residual disagreements, and falsifiable cruxes.

  First, analyzing the core conflict. The materialist (Student A) follows Eric Williams but concedes Drescher's Econocide undermines pure profitability arguments, shifting focus to political realignment and naval interests. The normative scholar (Student B) uses Appiah's honor-based model, emphasizing social revaluation like the Wellington duel. Both need to acknowledge weak points: Student A must accept Drescher's data, while Student B must recognize that esteem-seeking involves interests.

  For the joint claims section, identifying overlapping ground is key. Both implicitly agree norms require elite support to change, and that legitimation narratives matter—even if they disagree on whether those narratives are primary or derivative. The "esteem as interest" concession bridges their frameworks neatly. 

  The table needs careful phrasing. Column 1 (Materialist) should reflect structural causality (e.g., "material shifts enable normative breaks"), Column 2 (Honor Theorist) should capture constitutive language (e.g., "disgrace dissolves practices"), and Column 3 must neutrally describe the mechanism gap. The three rows will cover causality, normative change drivers, and abolition's timing—each exposing their core divergence without caricature.

  For cruxes, selecting empirically testable questions is crucial. The Atlantic abolition timing comparison directly pits their theories. Dueling's regional persistence under similar economies challenges pure material explanations. West African FGC abandonment tests whether ritual declarations or economic factors dominate. Each crux requires agreed-upon evidence types (e.g., economic datasets vs. discourse archives) and opposing predictions to force falsifiability.

  Noticing a possible verbal dispute: "interest" and "honor" might describe the same social selection process from different angles. The substantive residue is whether material constraints bound honor revaluations, or if normative shifts can independently reconfigure interests. This keeps debate focused on directionality rather than mutual exclusion.

  Word count discipline is vital—table as longest section, no references. The tone should model scholarly collegiality: precise but not conciliatory, leaving disagreements productively unresolved.
answer: |-
  ## Joint Statement on the Ending of Norms: Material Shifts and Moral Revolutions

  Following sustained dialogue, we, the undersigned, present this statement reflecting our collaborative effort to bridge our perspectives on how deeply entrenched social norms, such as slavery or dueling, ultimately collapse. While significant differences remain, we identify key areas of agreement and frame our ongoing disagreements with greater clarity and testability.

  **I. Agreed Claims**

  1.  **The Necessity of Elite Action:** Norms upheld by powerful elites do not end without significant shifts within those elite groups, whether in their perceived interests, their internal status dynamics, or their vulnerability to external pressure.
  2.  **The Enduring Validity of Drescher's Core Finding:** The British slave trade and the plantation system it supplied were demonstrably profitable and expanding at the time of the trade's abolition in 1807. Economic decline *preceding* abolition, as posited in crude Williamsian interpretations, is empirically unsustainable.
  3.  **The Reality and Power of Normative Revaluation:** Social practices can and do collapse rapidly when they undergo a fundamental shift in meaning *within the relevant community*, transforming from a mark of honor or necessity into a badge of disgrace or barbarism. The case of dueling's demise among British gentlemen exemplifies this powerfully.
  4.  **Esteem as a Form of Interest:** The pursuit of honor, status, and the esteem of peers constitutes a fundamental human interest. Actors strategically navigate social fields to acquire, maintain, and defend their standing. Therefore, dismissing appeals to honor as merely "downstream legitimation" overlooks a primary driver of elite behavior.
  5.  **The Interplay of Factors:** Neither pure material interest nor pure moral sentiment operates in isolation. Material conditions create contexts and constraints (e.g., enabling certain groups to gain political voice), while normative frameworks shape how interests are perceived, articulated, and pursued (e.g., defining what constitutes "honorable" wealth or power). Legitimation narratives are intrinsic to the political contestation over norms, not merely ex-post justifications.

  **II. Table of Residual Disagreements**

  | Aspect of Disagreement          | Materialist Perspective (Student A)                                                                 | Honor Theorist Perspective (Student B)                                                                                          | Neutral Restatement                                                                                                                                          |
  | :------------------------------ | :-------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------ | :----------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | **1. Primary Mechanism of Change** | Material shifts (economic power, political influence, strategic advantage) create the *necessary conditions and enabling environment* for normative shifts to gain decisive traction. Normative arguments gain force when they align with emerging material realities. | A fundamental *revaluation within the relevant honor world* is the essential spark and driving force. Once a practice is decisively recast as dishonorable/disgraceful by critical peers, its collapse becomes inevitable; material factors shape the context but not the core moral trigger. | Disagreement centers on the *primary driver* initiating and sustaining the collapse: whether the decisive factor is a shift in the underlying configuration of material power and interests, or a fundamental shift in the socially ascribed meaning and status value of the practice itself. |
  | **2. Source of Normative Shift** | Changes in normative discourse primarily *reflect* and *legitimate* shifts in underlying material interests and power balances. New moral arguments gain resonance because they serve the perceived interests of ascendant groups. | Normative shifts can arise *autonomously* through philosophical debate, religious awakening, or shifts in the internal logic of the honor code itself, and can *precede* and *drive* changes in the perception of material interests. Moral entrepreneurs can redefine interests. | Disagreement concerns the *origin and relative autonomy* of the normative arguments that delegitimize a practice: whether they predominantly emerge *from* and *serve* pre-existing shifts in material interests, or whether they can originate independently and subsequently *reshape* perceptions of interest. |
  | **3. Timing of British Abolition** | Abolition in 1807 reflected the declining *political* weight of the West India interest relative to burgeoning metropolitan commercial/industrial interests (sensitive to consumer boycotts, new markets) and the state's strategic interest in using naval power against rivals (including via suppression of others' slave trades). | The timing reflects the point where slaveholding and the slave trade became incompatible with the evolving self-conception and honor code of a critical mass of the British political elite and influential public, decisively marked by the shift in parliamentary opinion and the mobilization of mass moral sentiment. | Disagreement focuses on whether the *specific timing* (1807 trade abolition, 1833 emancipation) is best explained by a critical shift in the *balance of material/political power* between competing elite factions, or by a critical shift in the *social meaning and moral status* of slavery within the relevant elite circles and broader society. |

  **III. Falsifiable Cruxes**

  1.  **Crux: Atlantic Abolition Timing & Cause**
      *   **Question:** Does the comparative timing of abolition across major Atlantic powers (e.g., Britain 1807/1833, France 1848, US 1865, Brazil 1888) correlate more strongly with identifiable inflection points in the *material position* (economic weight, political influence) of the planter/slave-trading elite relative to competing national interests, OR with identifiable inflection points in the *status configuration* and dominant honor code within the relevant national elite/political culture (e.g., the rise of specific abolitionist movements, key discursive shifts)?
      *   **Agreed Evidence:** Comparative economic data (profitability, sectoral contribution), political history (voting patterns, lobby strength, party alignments), social history (membership/impact of abolition societies, discourse analysis of elite media/parliamentary debates, religious revivals), and international relations context for each polity.
      *   **Materialist Prediction:** Timing will strongly correlate with relative decline in planter political power vis-à-vis industrial/commercial interests and/or state strategic imperatives. Discursive shifts will generally follow or accompany these power shifts.
      *   **Honor Theorist Prediction:** Timing will strongly correlate with identifiable moments of profound normative revaluation within the elite (e.g., parliamentary defeats for pro-slavery arguments, successful mass petitions, influential moral critiques). Material factors will show less consistent correlation or will be shown to be insufficient without the normative shift.

  2.  **Crux: The Divergent Fate of Dueling**
      *   **Question:** Why did dueling rapidly wither among British gentlemen after c. 1840 despite persisting among status-competitive elites in France, Germany, and the American South under broadly similar economic conditions (aristocratic/planter dominance, agrarian/commercial capitalism)?
      *   **Agreed Evidence:** Historical data on duel frequency/lethality, legal sanctions and enforcement, discourse analysis (press, literature, memoirs) regarding honor, disgrace, and masculinity within each elite group; socio-economic structure of the relevant elites.
      *   **Materialist Prediction:** Differences will be explained by variations in *political/legal institutional strength* (e.g., effective royal/court suppression in UK vs. weaker states), the *specific economic vulnerabilities* of the elite (e.g., greater dependence on state/imperial careers in UK), or *differing paths of bourgeois integration* altering status competition dynamics, outweighing similarities in economic structure.
      *   **Honor Theorist Prediction:** The decisive factor was the *successful redefinition of dueling as dishonorable or absurd within the specific British honor world* (exemplified by reactions like Wellington's), a revaluation that did not occur, or occurred later/less completely, in the other contexts, despite similar material bases. Legal/political factors followed or reinforced this normative shift.

  3.  **Crux: Mechanism in Contemporary FGC Abandonment**
      *   **Question:** In contemporary West African programs pairing public declarations against Female Genital Cutting (FGC) with alternative marriage arrangements/economic opportunities for women, is the *declaration ritual itself* (public commitment, community pressure, honor/shame dynamic) the primary causal mechanism for norm change, or is it primarily *riding along* with (or merely facilitating) the shift driven by improvements in women's economic prospects and marriageability without FGC?
      *   **Agreed Evidence:** Rigorous longitudinal studies (quantitative & qualitative) comparing villages/regions implementing declaration-only, economics-only, and combined programs; data on FGC prevalence pre/post intervention; ethnographic analysis of community perceptions of honor, marriageability, and the meaning of the declaration; data on changes in women's actual economic outcomes and marriage patterns.
      *   **Materialist Prediction:** Program success will correlate most strongly with measurable improvements in women's economic prospects and viable marriage alternatives *independent of FGC status*. Villages with strong economic components but weak declaration rituals will show similar or greater abandonment rates than those with strong rituals but weak economic components. Declarations primarily consolidate change driven by interest.
      *   **Honor Theorist Prediction:** Villages undergoing the full declaration ritual (even with modest economic components) will show significantly faster and more complete abandonment than those receiving only economic interventions. The public commitment and shift in community definition of honor (making FGC a mark of disgrace) will be cited as the decisive factor in interviews and observed in changing social pressures. Economics enables participation but doesn't drive the normative shift.

  **Regarding Verbal Dispute:** We acknowledge that a portion of our debate concerns the *description* of motivation. Framing "honor" as a fundamental interest (Claim 4) significantly bridges the gap, as seeking status within a peer group *is* a core interest for elites. The substantive residue lies in the *direction of causation* and the *relative autonomy of the normative sphere*: Does a change in the material configuration of power and interests *necessitate and generate* a corresponding shift in the honor code (Materialist view), or can a shift in the honor code – driven by internal logic, moral argument, or changing conceptions of esteem – *precede and reconfigure* perceptions of material interest and political possibility (Honor Theorist view)? The falsifiable cruxes above are designed to probe this substantive core.

  **(Signed)**
  [Student A - Economic Historian]
  [Student B - Honor Theorist]
