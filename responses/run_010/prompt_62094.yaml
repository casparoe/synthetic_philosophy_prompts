answer: |-
  **Futarchy Workshop Run Sheet (110 mins)**  
  *Materials:* Paper scrip ($1,000 for traders, $500 for advocates), two policy cards ("A" and "B"), whiteboard for prices, timer, happiness survey sheets, smile stickers.  

  **Roles:**  
  - **16 Traders:** Start with $100 scrip. Profit = scrip from accurate bets.  
  - **2 Policy Advocates** (one pro-A, one pro-B): Start with $200 scrip. Bonus: $500 if *their* policy is chosen.  
  - **2 Outcome Measurers:** Record happiness scores.  

  ---

  ### **Timeline**  
  **1. Intro & Goal-Setting (20 mins)**  
  - (0-5) Explain futarchy: "We vote on *what* to maximize, markets decide *how*."  
  - (5-15) Vote on the happiness metric:  
    - **Metric 1:** Average self-rated happiness (1–10) after the policy.  
    - **Metric 2:** Number of forced smiles (stickers) during the policy.  
  - (15-20) Policies revealed:  
    - **Policy A:** Group hug (1 min).  
    - **Policy B:** Awkward silence (1 min).  

  **2. Market Trading (25 mins)**  
  - (20-25) Explain the market:  
    - Traders bet on which policy (A or B) will score higher on the chosen metric.  
    - Contract price = probability (%) that policy wins.  
    - **Market decides policy:** Policy with >50% price at close wins.  
  - (25-45) Open trading (whiteboard tracks bids/asks).  
  - *Advocates can lie or manipulate to push their policy’s price up.*  

  **3. Policy Implementation & Scoring (20 mins)**  
  - (45-50) Enact the winning policy (e.g., group hug).  
  - (50-55) Measurers collect data:  
    - For Metric 1: Survey happiness (1–10).  
    - For Metric 2: Count smile stickers.  
  - (55-60) Reveal scores and pay contracts (e.g., if A wins, A-contract holders gain $100).  

  **4. Debrief (45 mins)**  
  - (60-70) **What happened?**  
    - Did the market pick the "better" policy?  
    - How did advocates manipulate prices?  
    - Would the *other* metric have changed the winner?  
  - (70-85) **Map to futarchy:**  
    - **Pros:** Markets aggregate dispersed info (e.g., traders’ hunches about policies).  
    - **Cons:**  
      - Manipulation (advocates’ self-interest).  
      - Metric bias (e.g., smiles ≠ true happiness).  
      - No voting on *how* to measure truth.  
  - (85-105) **Real-world tensions:**  
    - "Markets need trustworthy metrics. Who defines them?"  
    - "What if Amazon lobbies to measure GDP, not equality?"  

  ---

  ### **What Will Break & Fixes**  
  - **Problem:** Chaos during trading.  
    **Fix:** Assign a "market maker" (you) to set initial bids/asks.  
  - **Problem:** Disputes over smile counts.  
    **Fix:** Have measurers justify counts quickly ("5 smiles, 3 half-smiles").  
  - **Problem:** Advocates too passive.  
    **Fix:** Secretly tip them: "Hint: Buy Policy A early to inflate price."  

  ### **What This Game Can’t Capture**  
  - **Real futarchy’s leap of faith:** Markets predict *counterfactuals* (e.g., "How would war *have gone*?"), but we never see the alternative outcome. Here, we test both policies—IRL, we can’t. **Say this aloud:** "In reality, we trust markets without proof. That’s futarchy’s gamble."  

  **Total Runtime:** 110 mins. Run it tight, and they’ll feel the tradeoffs.
