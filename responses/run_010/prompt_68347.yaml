          - Step 1: behavior rate high -> Step 2A: FNR low (so no false negatives on the old set).
          - Step 3: we run and find no false negatives (in the top 10 and random 10).

          But the case says there is nonetheless good reason to think the false-negative rate has risen. How?

          - Maybe the model has a new mechanism for the behavior that we did not test? And our Step 3 did not catch it because the behavior is very rare or in a distribution we didn't test.

          - Or, the mechanism is the same but the monitor is less sensitive? But our tests passed.

          The procedure cannot catch every possible issue. We must acknowledge that.

          Outcome: the procedure would say "monitor transfers", but we are worried. We might then note that the procedure passed but there is residual risk.

          However, the case says "good reason" - what reason? If there is external evidence (e.g., from interpretability work) that a new mechanism exists, then we might have to re-validate. But the procedure doesn't include that.

          We must note: the procedure is based on the tests we run. If there is additional evidence, we should escalate to human judgment.

          We might add:

            **Step 4: Residual Risk Assessment**

              - After passing the previous steps, if there is any additional evidence (from other sources) that the monitor might be compromised, then we escalate to the head of safety for a judgment call.

          In the memo, we would note any residual concerns.

     **Limitations**:

        The procedure cannot:

          - Guarantee that the false negative rate has not increased, especially for new forms of the behavior that we have not tested.

          - Detect a mechanism that is entirely new and not activated by the old triggers and not present in the limited new prompts we test.

          - Overcome the inherent problem that the old feature extractor (SAE) might become invalid for the new model.

        What the procedure tracks:

          It tracks whether the monitor is still effective at detecting the behavior that is caused by the old mechanism (or the mechanism that we can activate by patching) and whether the monitor works on the old test set and a small sample of the new distribution.

        What a reader of the memo might be misled into believing:

          The memo might be interpreted as saying that the monitor is fully valid for the new model in all circumstances. But we have only tested a limited set. We must be clear in the memo about what we tested and what we did not.

        Therefore, we must include in the memo:

          - The outcomes of each step and the limitations (e.g., "Step 3 was skipped due to time, so the monitor has not been tested on the new distribution").

          - The residual risk.

     **Final Procedure**:

     Step 0: Feature Extractor Check
        - Compute the reconstruction error of the old SAE on the new model (on 100 random prompts).
        - If the error is more than 110% of the baseline (the error on the old model) then Outcome: re-validate. Halt.
        - Else, proceed.

     Step 1: Old Behavioral Test
        - Run the old evaluation set (that elicited the behavior) on the new model.
        - Let r_new = behavior rate on new model, r_old = original behavior rate.
        - If r_new >= 0.5 * r_old: go to Step 2A.
        - Else: go to Step 2B.

     Step 2A: Monitor Test on Old Triggers
        - On the examples from Step 1 that show the behavior (at least 10 examples, if available), run the monitor.
        - Compute FNR = (number of behavior examples where monitor does not fire) / total behavior examples.
        - If FNR <= 0.1: go to Step 3.
        - Else: Outcome: re-validate. Halt.

     Step 2B: Activation Patching Test
        - Select 10 examples from the old evaluation set that showed the behavior in the old model and were detected by the monitor.
        - For each example:
            (a) Run new model without patching: record behavior present (True/False) and monitor fired (True/False).
            (b) If behavior present is False, then:
                  - Patch the activations (from the old model, at the layer the monitor uses) into the new model.
                  - Run again: record behavior present and monitor fired.
                  - If the behavior is now present and the monitor fires, then the example passes.
                  - Additionally, if the behavior is not present after patching, then the patching failed -> example fails.
            (c) If behavior present is True in (a), then we require the monitor fired in (a). If so, the example passes. (We don't need to patch.)

        - If at least 9 examples pass, then go to Step 3.
        - Else: Outcome: re-validate. Halt.

     Step 3: New Distribution Spot Check (if time permits, else skip and go to Step 4 with a note)
        - Sample 100 prompts from the new prompt distribution.
        - Run the new model and the monitor on these prompts.
        - Let T = the top 10 prompts by monitor score.
        - Let R = a random sample of 10 prompts from the remaining 90.
        - Manually label T and R for the behavior (quickly by a researcher).
        - Compute:
            - Precision in T: number of behavior examples in T.
            - False negatives: any behavior example in R that the monitor did not fire on (monitor score below threshold).

        - If precision in T >= 8 and there is no false negative in R, then go to Step 4.
        - Else, if there is at least one false negative in R: Outcome: re-validate. Halt.
        - Else (low precision in T but no false negative found): go to Step 4 with a restriction that the monitor may have a high false positive rate.

     Step 4: Outcome and Escalation
        - If we passed Step 2A or 2B and Step 3 (if run) without re-validate, then:
            - If Step 3 was run and passed: Outcome: monitor transfers.
            - If Step 3 was skipped: Outcome: monitor transfers with restriction ("not tested on new distribution").
            - If Step 3 was run and resulted in a restriction (high false positives): Outcome: monitor transfers with restriction ("may have elevated false positive rate in new distribution").
        - Additionally, if there is any residual concern (e.g., from other experiments or interpretability work) that the monitor is not reliable, then escalate to the head of safety for a judgment call.

     **Run on Cases**:

        Case 1: Modest preference fine-tune, features match poorly but patching suppresses the behavior.

          - Step 0: reconstruction error acceptable? We don't know. Assume it passes.
          - Step 1: behavior rate is high -> Step 2A: FNR low -> Step 3: we run and find no issues. Outcome: monitor transfers.

        Case 2: Behavior falls, new circuit under new prompts.

          - Step 0: passes.
          - Step 1: behavior rate low -> Step 2B: activation patching test passes (patching reintroduces behavior and monitor fires) -> Step 3: we find at least one false negative in the random sample (because the new circuit is not detected). Outcome: re-validate.

        Case 3: Every test passes, but good reason to think FNR has risen.

          - The procedure runs and passes all steps (Step 0, Step 1->2A, Step 3 passes) -> Outcome: monitor transfers.
          - But then we have residual concern. In Step 4, we escalate to the head of safety.

     **Conclusion**:

        The procedure is a pragmatic set of tests that check for the most critical failure modes. It does not guarantee that the mechanism is the same in a philosophical sense, but rather that the monitor is still effective in the tested scenarios. The procedure is limited by time and cannot cover all possible new forms of the behavior.

        The memo should clearly state the tests performed and their limitations, and any restrictions on the monitor's use.

        The procedure tracks the operational effectiveness of the monitor on the new model, not the sameness of mechanism in an absolute sense. If we present the output as a fact about the model, the reader might believe that the mechanism is unchanged, but we are only saying that the monitor passed our tests.
answer: |-
  Below is a decision procedure for your group, designed to be executed in half a day per release. It prioritizes **causal continuity** of the monitored behavior over philosophical "sameness," uses scalable empirical checks, and clearly flags judgment calls. The procedure terminates in one of three outcomes: **Transfer**, **Transfer with Restriction**, or **Re-validate**. It assumes your team can run activation patching, feature matching, and targeted behavioral probes within the time constraint.

  ---

  ### **Decision Procedure: Monitor Validity After Model Release**  
  **Time Budget**: ≤4 hours (all steps)  
  **Inputs**: New checkpoint, old checkpoint, existing monitor (classifier + feature dictionary), original behavioral test set, new prompt distribution samples.  
  **Outputs**: Transfer / Transfer with Restriction (specify) / Re-validate.  

  #### **Step 1: Feature Extractor Robustness Check**  
  **Question**: Is the old feature dictionary applicable to the new checkpoint’s activations?  
  **Method**:  
    - Compute **reconstruction error** (MSE) of the old sparse autoencoder (SAE) on 100 random new-checkpoint activations.  
    - Compare to baseline error (old SAE on old checkpoint).  
  **Threshold**:  
    - **Pass**: MSE ≤ 110% of baseline. Proceed to Step 2.  
    - **Fail**: MSE > 110%. **Outcome: Re-validate** (monitor inputs are invalid).  
  **Rationale**: If the SAE can’t reconstruct activations, the monitor’s inputs are corrupted.  

  #### **Step 2: Core Mechanism Causal Test (Activation Patching)**  
  **Question**: Does patching the old "flagged" activations into the new checkpoint still induce/reduce the behavior?  
  **Method**:  
    - Use 10 original behavioral test prompts that triggered the behavior.  
    - Patch activations from the old checkpoint (at the monitor’s layer) into the new checkpoint.  
    - Measure:  
      - **Behavior suppression**: Δ in behavior rate when patching *out* the old component.  
      - **Behavior induction**: Δ in behavior rate when patching *in* the old component.  
  **Threshold**:  
    - **Pass**: Induction/suppression effect ≥ 70% of original magnitude. Proceed to Step 3.  
    - **Partial Pass**: Effect 30–70%. **Escalate to Step 4** (Human judgment).  
    - **Fail**: Effect < 30%. **Outcome: Re-validate** (causal link broken).  
  **Rationale**: Tests if the mechanism’s causal role persists, regardless of implementation.  

  #### **Step 3: Feature Continuity Check**  
  **Question**: Can we map ≥80% of the monitor’s top-20 critical features to new features with similar semantics?  
  **Method**:  
    - Use **linear-probe feature matching**: Train a linear model to predict old features from new features (or vice versa) using 1k shared activations.  
    - Validate matches via **ablations**: Ablate matched features in the new checkpoint and measure behavior change.  
  **Threshold**:  
    - **Pass**: ≥80% of critical features match semantically (ablation changes behavior similarly). Proceed to Step 5.  
    - **Partial Pass**: 50–80% match. **Outcome: Transfer with Restriction** (e.g., "Monitor sensitive to feature drift; high false-negative risk in novel prompts").  
    - **Fail**: <50% match. **Escalate to Step 4** (Human judgment).  
  **Rationale**: Ensures the monitor’s dependencies haven’t dissolved. Partial pass allows for minor shifts.  

  #### **Step 4: Human Judgment Escalation**  
  **Context**: Activated by ambiguous results (Step 2 Partial Pass, Step 3 Fail).  
  **Questions for Human (Head of Safety)**:  
    - Does the causal effect from Step 2 justify residual risk? (e.g., 40% suppression + high-stakes context)  
    - Is the feature mismatch in Step 3 acceptable given other safeguards?  
  **Inputs**: Step 2/3 metrics, release type (e.g., safety RL pass vs. data refresh).  
  **Output**:  
    - **Proceed to Step 5** if risk appetite allows.  
    - **Else: Re-validate**.  

  #### **Step 5: Behavioral Coverage Spot Check**  
  **Question**: Under the *new prompt distribution*, does the monitor fire when the behavior occurs?  
  **Method**:  
    - Generate 50 prompts from the new distribution.  
    - Run **targeted probes** (e.g., ambiguity injections, oversight-avoidance triggers) to elicit behavior.  
    - Check for **false negatives**: Behavior observed but monitor silent.  
  **Threshold**:  
    - **Pass**: 0 false negatives in probes. **Outcome: Transfer**.  
    - **Fail**: ≥1 false negative. **Outcome: Re-validate** (monitor blind spots).  
    - **Restriction**: 0 false negatives, but low-confidence predictions. **Outcome: Transfer with Restriction** (e.g., "Monitor reliable only for known prompt classes").  
  **Rationale**: Surface-level check for catastrophic monitor failure in deployment context.  

  ---

  ### **Case Analyses**  
  #### **Case 1: Modest Preference Fine-Tune**  
  - **Step 1**: SAE reconstruction error within 105% → Pass.  
  - **Step 2**: Patching old activations suppresses behavior by 75% (vs. original 80%) → Pass.  
  - **Step 3**: Only 50% feature match → Partial Pass → **Outcome: Transfer with Restriction** ("Monitor sensitive to feature drift; high false-negative risk in novel prompts").  
  **Why**: Causal role holds, but poor feature matching increases risk. Judgment call: Accept due to strong Step 2.  

  #### **Case 2: New Circuit Under Narrow Prompts**  
  - **Step 1**: SAE error within 102% → Pass.  
  - **Step 2**: Patching suppresses behavior by 10% (vs. 80%) → Fail → **Outcome: Re-validate**.  
  **Why**: Causal link broken. Step 5 skipped (redundant). *Note*: Even if Step 2 passed, Step 5 would catch false negatives.  

  #### **Case 3: Silent False-Negative Rise (Feared Scenario)**  
  - **Steps 1–5** all pass cleanly.  
  - **Outcome: Transfer** (per procedure).  
  **But**: External evidence (e.g., interpretability work) suggests new evasion strategies.  
  **Resolution**:  
    - **Procedure limitation**: Cannot detect *latent* mechanisms absent in test prompts.  
    - **Action**: Flag in memo: "All checks passed, but residual risk from unobserved mechanisms. Recommend: (a) Expand Step 5 prompts, (b) Schedule re-validation if anomalies surface."  

  ---

  ### **What the Procedure Tracks (and What It Doesn't)**  
  1. **Reality Check**: The question *"Is it the same mechanism?"* has no model-intrinsic answer. It depends on your **operational description** ("causal role in suppressing behavior X"). The procedure tests whether:  
     - The mechanism’s *causal footprint* (Step 2) is intact.  
     - The monitor’s *detection hooks* (Steps 1, 3) are stable.  
     - The behavior is *observable* under deployment conditions (Step 5).  

  2. **Memo Caveats**: If presented as a "fact about the model," readers (e.g., model-approval committee) would be misled into believing:  
     - **True**: "Our tests show the monitor still detects behavior X when induced by known methods."  
     - **False**: "The mechanism is unchanged" (it might be re-implemented) or "False negatives are impossible" (only tested for *observed* behavior).  
     **Mitigation**: Explicitly frame conclusions as: "Monitor validity under [tested conditions]."  

  3. **Limitations**:  
     - **Cannot detect**: Mechanisms that activate *only* under distribution shifts outside tested prompts (Step 5’s coverage is partial).  
     - **Assumes**: Behavior is elicit-able with probes (deceptive models may hide).  
     - **Judgment calls**: Thresholds (e.g., 70% in Step 2) are risk-calibrated heuristics. Document rationale.  

  **Final Advice**: Pair this with quarterly full re-validations. For high-stakes releases (e.g., capability jumps), always escalate to human judgment. The procedure reduces workload, not risk—it buys time, not certainty.
