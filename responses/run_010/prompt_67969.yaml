  The economist's argument about infinite present values is mathematically sound but feels reductive when applied to the film. If every action has infinite value, why does Phil's behavior evolve? The philosopher's "collapse of instrumental rationality" better explains his transformation - he moves from outcome-driven actions to present-moment engagement. The piano practice scene is pivotal here; it's not investment but artistry for its own sake.

  But where the film truly transcends both frameworks is in that homeless man subplot. Some futures simply can't be bought, no matter the discount rate. This mirrors the intergenerational ethics problem in climate economics - some losses are irrecoverable. The film's emotional core suggests discounting debates might be missing a dimension: how we value what cannot be saved.

