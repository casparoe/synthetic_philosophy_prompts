prompt: |-
  I'm the token grad student on our university's style-guide advisory committee — it's "advisory," which I already suspect is part of the problem — and Thursday we vote on three changes to the official guide: singular *they* as the default for a person of unspecified gender, *chair* instead of *chairman*, and *first-year* instead of *freshman*. Half the meeting got derailed by the dean of the college, who said some version of "it's just a convention" twice, and not the same thing both times. The first time it meant the old usages have no authority beyond the fact that people happen to use them, so if we prefer something else we can just have something else. The second time it meant there's no fact of the matter about correctness here at all, so the vote is really about values rather than about usage. A student rep shot back that the committee can't decree anything because people will keep writing *chairman* no matter what we publish, and a linguist colleague answered him with "conventions change all the time, look how fast singular they took off" — which somehow conceded and denied the same point. Nobody ever said what they thought they were disagreeing about, and I'm the one who got volunteered to write up the conceptual terrain before Thursday.

  I half-read Lewis's *Convention* for a seminar last year and remember the gist: a convention is a regularity in some recurrent situation, nearly everyone conforms, nearly everyone prefers that others conform on condition that others do, and — the part I think matters here — some other regularity would have served just as well. What I can't do is turn that into a reply to the dean. So can you lay out, as a menu I can literally carry into the meeting, the distinct precise claims that "it's just a convention" and "conventions are arbitrary" could be making? Start with whatever is a platitude nobody in that room would deny, work through the substantive and defensible ones, and end with whatever is flatly false or at least never actually argued for. For each reading say whether it's true and, separately, whether it would license the job it was being asked to do, which were four different jobs: (a) the committee's changing the guide, (b) the claim that nobody has any reason to keep using *chairman*, (c) the claim that there's no fact of the matter which usage is correct, and (d) the prediction that publishing a change will produce the change.

  Two more things. Someone in that seminar said Lewis himself distinguishes more than one sense in which a convention is arbitrary, and that people routinely slide between them without noticing; if that's right I'd like those senses pulled apart and mapped onto the menu, and if you think my seminar-mate was confabulating, just say so. And I want to know which side Lewis's account actually lands on for the student rep's objection — if a convention is self-perpetuating in the way he describes, does an advisory committee with a style guide have any standing to change one, or does change only become possible when there's some focal authority capable of making the new expectation common knowledge? Which would also tell me whether our mandate is even the right instrument. Feel free to tell me the whole thing is a bad analogy, since *chairman* isn't obviously a coordination problem the way driving on the right is — but if so, tell me exactly where the analogy breaks, because that's the spot the dean will press on.
reasoning: |-
  Okay, this grad student is on a style-guide committee and needs help unpacking the arguments from their meeting. The dean used "it's just a convention" in two different ways, causing confusion. The student rep argued that the committee can't enforce changes, while a linguist countered that conventions change quickly. The user wants a clear breakdown of what "conventions are arbitrary" really means, how it applies to their four specific points (a-d), and where Lewis's theory fits in. They also want to know if an advisory committee can actually change language conventions.

  First, I need to recall Lewis's Convention. He defines conventions as solutions to coordination problems, where people follow a pattern because others do, and any alternative could've worked. The arbitrariness means the pattern isn't special in itself, but its value comes from mutual adherence. 

  The user mentioned their seminar mate said Lewis distinguishes multiple senses of arbitrariness. Let me think about that. Lewis does talk about arbitrariness in terms of indifference (any solution would do) and conventionality (the pattern persists because of mutual expectations). That's probably what the seminar mate meant. I should clarify those distinctions.

  Now, for the dean's two statements. First usage: conventions lack inherent authority, so the committee can change them. Second usage: no fact of the matter about correctness, so it's about values. These are different claims. The first is about authority, the second about ontology. 

  The student rep's point is that people will ignore the style guide, while the linguist says conventions change fast. Lewis's theory supports both: conventions are stable but can shift with new coordination. An advisory committee isn't a focal point like a law, so its influence depends on whether it can create common knowledge of a new expectation.

  For the menu, I'll start with platitudes everyone accepts, then move to substantive claims, ending with false ones. For each, I'll assess truth and whether it supports the four jobs (changing the guide, rejecting old usage, no correctness fact, prediction of change).

  The key is distinguishing the types of arbitrariness:
  1. Indifference arbitrariness: any pattern could work.
  2. Epistemic arbitrariness: no prior reason for one pattern over another.
  3. Ontological arbitrariness: no correctness beyond convention.
  4. Focal-point arbitrariness: change requires coordination.

  Applying this to the jobs:
  - Changing the guide (a): Possible with common knowledge, but the committee may lack authority.
  - Rejecting old usage (b): True under indifference arbitrariness, but people may resist due to habit.
  - No correctness fact (c): True for ontological arbitrariness, but values can create correctness.
  - Predicting change (d): Only if the guide becomes a focal point.

  The analogy to driving breaks because language has evaluative dimensions (like gender neutrality) that pure coordination problems don't. That's where the dean might press.

  Lewis would say the committee can initiate change if it can establish a new focal point, but it's not guaranteed. The mandate might not be sufficient without broader buy-in.
answer: |-
  Here's a conceptual menu for your meeting, structured as requested. It dissects "it's just a convention" and "conventions are arbitrary" across five distinct claims, from platitudes to falsehoods. Each claim is evaluated for truth and whether it licenses the four jobs (a–d) from your meeting. Lewis's distinctions on arbitrariness are integrated, and the student rep's objection is resolved using his framework. Finally, the coordination-problem analogy is assessed.

  ---

  ### **The Conceptual Menu: Five Readings of "It's Just a Convention"**
  *(Ordered from least to most controversial)*

  1. **Platitude: Conventions are *solution-arbitrary* (Lewis's "indifference" sense)**  
     - **Claim:** In a coordination problem (e.g., driving side), any stable regularity (e.g., driving left *or* right) could have solved it equally well if established early. No inherent superiority exists among possible solutions.  
     - **True?** Yes. Lewis argues conventions emerge because they "coordinate" behavior; the *content* is arbitrary because multiple solutions are functionally equivalent.  
     - **Licenses:**  
       - (a) Changing the guide? **Yes**—if a new convention better serves shared goals (e.g., inclusivity), the committee can propose it.  
       - (b) Rejecting *chairman*? **Yes**—no inherent reason to prefer it over *chair*; the old convention isn't special.  
       - (c) No correctness fact? **No**—this claim is neutral on correctness.  
       - (d) Predicting change? **No**—arbitrariness doesn’t imply change is easy; inertia matters.  

  2. **Substantive: Conventions are *epistemically arbitrary* (Lewis's "no prior reason" sense)**  
     - **Claim:** At inception, there was no pre-convention reason to favor one regularity (e.g., *chairman*) over alternatives (*chair*). The convention emerged from historical accident, not linguistic logic.  
     - **True?** Defensible. Lewis notes conventions often arise without deliberate design (e.g., language drift). *Chairman* emerged when male defaults were culturally unexamined, not due to linguistic merit.  
     - **Licenses:**  
       - (a) Changing the guide? **Yes**—if historical arbitrariness is acknowledged, deliberate change is justified.  
       - (b) Rejecting *chairman*? **Yes**—if its origins lack rational basis, inertia alone isn’t a reason.  
       - (c) No correctness fact? **Partly**—correctness may still emerge *from* convention (see #3).  
       - (d) Predicting change? **No**—epistemic arbitrariness doesn’t predict how hard change is.  

  3. **Substantive: Conventions define *correctness* (Lewis's "normativity from common knowledge")**  
     - **Claim:** Correctness is *constituted* by convention: a usage is "right" only if it aligns with the group’s equilibrium (e.g., *chairman* was correct when universally expected). No external standard (e.g., "logic") overrides this.  
     - **True?** Defensible per Lewis. Conventions create self-reinforcing expectations—e.g., violating *chairman* in 1950 caused confusion, making it "wrong."  
     - **Licenses:**  
       - (a) Changing the guide? **Yes**—if the committee shifts expectations, it redefines correctness.  
       - (b) Rejecting *chairman*? **Conditionally**—if the convention frays (e.g., many use *chair*), it loses correctness.  
       - (c) No correctness fact? **False**—this claim *affirms* convention-dependent correctness.  
       - (d) Predicting change? **Yes**—if the guide creates common knowledge of a new expectation (e.g., "use *chair*"), it can redefine correctness.  

  4. **Controversial: Conventions are *ontologically arbitrary* (the dean’s second use)**  
     - **Claim:** Beyond coordination, conventions have no basis in reality (e.g., no "fact" that *chairman* is incorrect). Disagreements reduce to values (e.g., inclusivity vs. tradition).  
     - **True?** **Overreach**. Lewis rejects this: conventions *generate* social facts (e.g., correctness). But values (e.g., gender neutrality) can *motivate* change, creating new correctness conditions.  
     - **Licenses:**  
       - (a) Changing the guide? **Yes**—but frames it as political, not linguistic.  
       - (b) Rejecting *chairman*? **No**—if no correctness exists, no reason to prefer anything.  
       - (c) No correctness fact? **True per claim**—but misleading (correctness is convention-relative).  
       - (d) Predicting change? **No**—denies the mechanism (common knowledge) that enables change.  

  5. **False: Conventions are *easily changed* (misreading of arbitrariness)**  
     - **Claim:** Because conventions are arbitrary, they can be overturned quickly by decree (e.g., the committee’s vote alone ensures *first-year* replaces *freshman*).  
     - **True?** **False**. Lewis emphasizes conventions require *common knowledge* of shared expectations. A style guide lacks the enforcement of law (e.g., traffic rules) or the reach of mass media.  
     - **Licenses:**  
       - (a) Changing the guide? **Yes**—but overestimates efficacy.  
       - (b) Rejecting *chairman*? **No**—ignores habit and dissent.  
       - (c) No correctness fact? **N/A**—irrelevant to this claim.  
       - (d) Predicting change? **False**—arbitrariness ≠ plasticity (e.g., *chairman* persists in subsets).  

  ---

  ### **Resolving the Student Rep vs. Linguist Dispute (Lewis’s View)**
  - **Student rep:** Correct that conventions self-perpetuate via mutual expectations. A top-down decree (like a style guide) cannot *force* change if users ignore it.  
  - **Linguist:** Correct that conventions *can* shift rapidly (e.g., singular *they*)—**but only with a new focal point** (e.g., media/institutions broadcasting the change, creating common knowledge).  
  - **Lewis’s verdict:** An advisory committee *can* initiate change **if** its guide:  
    - (1) Serves as a focal point (a salient signal coordinating expectations),  
    - (2) Gains uptake from key influencers (e.g., faculty, admin, publishers),  
    - (3) Aligns with existing momentum (e.g., singular *they* had decades of informal use).  
    **Standing?** Your committee has *opportunity*, not guarantee. "Advisory" status weakens focal power—unless backed by enforcement (e.g., requiring guide compliance in curricula).  

  ---

  ### **Where the Coordination Analogy Breaks (and Why It Matters)**
  The dean might press here, as *chairman* isn’t a pure coordination problem like driving sides. Lewis’s model assumes:  
  - **Indifference:** People don’t *care* which side they drive on, only that all agree.  
  - **Neutrality:** Solutions lack moral/political weight.  

  **Where language conventions differ:**  
  1. **Non-indifference:** *Chairman* vs. *chair* isn’t neutral—it carries values (gender inclusivity vs. traditionalism). People resist change not due to coordination failure, but *ideological investment*.  
  2. **Multiple equilibria ≠ moral equivalence:** While *any* convention could work technically (e.g., *chair* or *chairthing*), societies evaluate options (e.g., *chair* is fairer). Values break the arbitrariness.  
  3. **Focal points require buy-in:** A traffic law changes behavior because it’s enforced. A style guide lacks this—it’s only effective if users *endorse its values* (e.g., "We prefer *chair* to signal inclusivity").  

  **Conclusion for your mandate:** Your committee *can* change conventions **if** you:  
  - Frame changes as resolving a *new* coordination problem (e.g., "We need gender-neutral terms to include all people"),  
  - Leverage your guide as a focal point for institutional common knowledge,  
  - Acknowledge that success depends on uptake, not decree.  
  Otherwise, it’s merely aspirational.  

  Bring this menu as a handout—explicitly mapping claims to jobs (a)–(d) will force clarity at the vote. Thursday’s chaos was a textbook coordination problem; ironically, your memo can be the focal point to solve it.
