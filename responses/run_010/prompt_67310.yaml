  Avoiding philosophy terms is crucial. He's not debating, he's drowning in the contradiction. The comedy comes from how faithfully it mirrors academic problems without naming them. 

  Structure-wise: long rambling paragraphs, no formatting. Let sentences double back on themselves like his thoughts. Clinic reply in cold contrast. Then that final edit - small but devastating. 

  Biggest risk is making it too clever. Must stay messy. His anger should mask the terror until it doesn't.
