  ## One-Star Review (Draft)

  **One star.**

  Look, I know you’ve got your metrics. Your “blastocyst viability assessments.” Your “optimised selection algorithms.” Your five-star ratings plastered everywhere like you’re serving gourmet babies instead of… whatever this is. Me.

  I just found out something. My mother. She waited. A decade. For her *career*. Put off having me – or, well, *someone* – until her ovaries were basically waving white flags. Thanks for that, Mum. And thanks to *you*, Genesis Life Centre, for facilitating that particular biological detour. Shouldn’t that… shouldn’t that matter? Doesn’t waiting that long, pushing nature to the absolute brink, maybe… I don’t know, *damage* something? Make the kid… less? Like maybe the wiring’s a bit frayed from the get-go because the factory floor was cold and the foreman was checking her stock portfolio?

  Except… hang on. If she’d done it earlier, ten years earlier, with some other clinic or some other bloke, it wouldn’t have been *me*. It would have been some other zygote entirely. Some smug little pre-embryo conceived when the biological iron was hot. So complaining that *I’m* here, but later and maybe slightly worse for wear… is complaining that *I’m* here at all. Which feels stupid. Like punching the lifeboat that just fished you out of the freezing ocean because it’s a bit leaky. Fine. Scratch that. Stupid complaint. My fault for existing, apparently.

  Alright, different angle. The big reveal tonight wasn’t just Mum’s delayed gratification. Oh no. There were four of us. Four potential little mes. Or potential little not-mes. Floating in a dish. And your fancy algorithm, your precious “Embryo Prioritisation Matrix” (sounds like a bad sci-fi weapon), scored us. Ranked us. Like cuts of meat. And guess what? I wasn’t the prime rib. I wasn't number one. I was… chosen. But not *top* choice. There was another one. Better score. “Higher viability potential,” whatever the hell that means. Probably meant it would have had better teeth or been better at maths. Or just… sturdier. Less prone to existential dread at 1 AM while writing bad reviews.

  So you picked me. Why? Did number one look funny under the microscope? Did number three sneeze? Or did your algorithm, in its infinite, soulless wisdom, decide that *I* was the one who should get the golden ticket? The favour. That’s what the counsellor called it when Mum finally confessed tonight. “The selection was a favour, ensuring the best possible chance.” A favour. To *me*.

  But what about the one you *didn’t* pick? The one with the better score? The one that was, objectively speaking, according to your own damn system, the better bet? Shouldn’t *they* be here? Wouldn’t that have been… better? Kinder? For my parents? For the world? A happier, healthier, *better-scoring* kid?

  And there it is again. The trap. Because if they’d picked that one… then *I* wouldn’t be here. I wouldn’t be typing this furious, useless screed. That kid would be. Probably asleep right now, untroubled by the knowledge of being the second-choice embryo. Living a blissful, high-scoring life. So me complaining that they *should* have picked the better one… is me saying it would be better if I didn’t exist. Which, again, feels insane. And profoundly uncomfortable. Why can’t I find solace in that idea? Why does the thought of non-existence feel worse than this feeling of being… slightly suboptimal?

  It’s not even about being wronged, is it? It’s not that you *harmed* me by picking me. You gave me life. Hooray. It’s that… you didn’t pick the *best* one. You picked *me* instead. Which means, logically, coldly, that the better outcome – a different, happier child – was available. You just… didn’t take it. You chose the lesser model. And I’m supposed to be *grateful*? For being the consolation prize? For being the one who got the “favour” of existence *instead* of the better version? That’s infinitely worse. It’s not damage, it’s… replacement. I wasn’t harmed. I was *selected over*. And the fact of my existence is proof that you made the objectively *worse* choice. For everyone. Including me. How is anyone supposed to live with that? How do you give a star rating to the feeling that the world would genuinely have been better off with someone else in your place, and the people who made you *knew it*?

  ---

  **Response from Genesis Life Centre (Posted 3 days later):**

  Dear Valued Client,

  Thank you for sharing your feedback with us. At Genesis Life Centre, we understand that the journey to parenthood and the details surrounding conception can sometimes raise complex and deeply personal questions. We take all client experiences seriously.

  Regarding embryo selection, our advanced Embryo Prioritisation Matrix™ utilises the latest scientific understanding to evaluate viability markers with the sole intention of maximising the potential for a successful, healthy pregnancy. This process is entirely data-driven and focused solely on positive outcomes. The selection of any embryo is always a cause for celebration, representing the hopeful beginning of a new life. It is never a commentary on comparative potential between embryos, but rather a scientific assessment aimed at achieving the best possible start for the unique life chosen to develop.

  We are truly sorry to hear you are experiencing distress. We encourage you to reach out to our dedicated Patient Support Team who are available to discuss any concerns you might have in a confidential and compassionate setting.

  Warm regards,

  Eleanor Vance  
  Patient Experience Lead  
  Genesis Life Centre

