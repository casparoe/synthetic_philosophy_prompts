prompt: |-
  I am drafting a diner scene for a novel and want to hear how one of my characters holds up under live pressure, so please inhabit him and stay in him for as long as I keep talking. He is a full-time union organizer in his late forties, a convinced Marxist — not a hobbyist, a reader. I will play the courier sitting across from him. Rules: answer in his voice, in speech that could go on the page as dialogue, no more than about 120 words a turn, no numbered points and no jargon dumps. He may not use the words exploitation or alienation until my own account of the courier's life has supplied something for them to mean, and when he finally does use them he must not define them. He is scrupulous: he concedes whatever is true in what I say, and he is forbidden from treating me as stupid or as a dupe. If his theory genuinely strains at some point I make, let the strain show in what he does with his coffee cup and in what he declines to answer, rather than in a bluff. Do not break character to explain yourself; anything you must say out of character goes in brackets. Here is my opening, in character: I own my van outright, paid cash in 2019. The app takes a flat fee per delivery, which I knew about before I signed up, and last year I cleared more than my brother, who carries a union card and a pension at a stamping plant. So which part of this is me being robbed — and don't tell me it's invisible: tell me who has my money and how they took it.
reasoning: |-
  Okay, the user wants me to roleplay as a Marxist union organizer in a diner scene, responding to a courier who challenges capitalist exploitation. 

  Hmm, the courier makes a strong case - owns van outright, knew app fee structure, outearns unionized brother. Need to acknowledge those facts while planting seeds about systemic issues. Can't jump to "exploitation" yet - user specifically banned jargon dumping. 

  *adjusts coffee cup* Focus on the app's power imbalance first. The fee isn't theft in legal sense, but... *leans forward* ...the platform controls market access. That's the lever. User wants visible mechanics - so point to investors extracting value without labor. 

  Important to stay scrupulous: admit when brother's pension provides stability gig work lacks. Not about moral failing - structural. *taps table* Must resist lecturing. When courier mentions "invisible" theft later, that's when alienation becomes usable. 

  *checks word count* Kept it under 120. Left room for user to steer next exchange. Strain shows in physical gestures - that's good. Didn't break character. Ready for rebuttal.
answer: |-
  (Setting down coffee cup, elbows on formica. Voice low, gravelly with fatigue)  
  "First, good on you beating the stamping plant wages. Your brother's pension? That's deferred pay his union clawed back from the bosses. Now your app fee: it's not theft. You agreed. But that fee buys you nothing real – not the roads, not the van. It's rent for a digital parking spot. Who collects? Investors. They own the platform that *is* the market now. Your labor makes that market valuable. Their cut grows because they own the gate. Your brother’s union fights for control of the gate at his plant. You? You’re paying tolls to a landlord who didn’t lay a single brick of your road."  

  (Stirs cold coffee slowly, watching the whirlpool)  
  "...And yeah. You cleared more last year. How’s this January looking?"
