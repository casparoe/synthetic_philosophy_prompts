prompt: |-
  You are a political philosopher whose work is on global distributive justice, the ethics of immigration, and the boundaries of the demos. Please think carefully and treat what follows as a genuine audit rather than a survey: I want you to trace what each of my commitments commits me to, not to tell me who holds which view.

  Context. I have been asked to submit a one-page statement of my position in advance of a workshop on the ethics of membership, so that the other participants can attack it rather than guess at it. Before I send it, I want to know whether the package hangs together. I have deliberately not ordered the items by how confident I am in them, and I am not going to indicate which of them I would be prepared to revise: I would rather you locate the pressure points yourself.

  The commitments:

  1. Distributive justice is global in scope. Every person's claims count equally, and nationality is not in itself a ground for weighting those claims.
  2. Nonetheless, a democratic state acts within its rights — as a matter of right, not of charity or supererogation — when it funds a health and social insurance scheme for its own citizens and residents to the exclusion of non-members, and when it restricts immigration in order to sustain that scheme.
  3. The ground of the priority asserted in (2) is reciprocity: those who contribute to, and depend upon, a shared cooperative scheme of institutions owe one another more than they owe outsiders, and may shape the terms of that scheme accordingly.
  4. The composition of the demos is not a pre-political given. A decision about who belongs must be justifiable to everyone subject to it, including those coerced by it, whether or not they are members.
  5. Being born in one country rather than another is a paradigm case of brute luck. I reject any principle that permits a fact of that kind to set the terms of a person's life chances, and I support standing, institutionalized transfers from wealthy states to the global poor, not merely emergency relief.
  6. Methodologically: a theory of justice must be addressed to agents who can actually act on it, and principles that no realistic agent could implement are defective for that reason.
  7. Methodologically also: the fact that a principle is presently politically infeasible is not itself a ground for rejecting it, since what is feasible is endogenous to what people can be brought to demand.
  8. Patriotism — a preferential concern for one's own polity and its people — is a genuine virtue, not a bias to be grudgingly tolerated.

  Three case verdicts I want to keep:

  A. A wealthy state may give its own citizens priority in sponsoring spouses, parents, and minor children for admission, even where the same admissions slots would do more good if allocated by need.
  B. The same state may not operate a fast track to citizenship for co-ethnics abroad who have no other connection to it.
  C. A state's obligation to admit people fleeing persecution is stronger than its obligation to admit people fleeing poverty, and the difference is not reducible to the comparative urgency of their needs.

  What I want back. Begin by laying out, briefly, the dependency structure among these items — which are doing justificatory work for which, and which are load-bearing rather than decorative. Then deliver the audit, ordered by severity rather than in the order I listed them. For each tension you identify, state (i) precisely which items generate it, (ii) whether a standard reconciliation is available and, if so, why it succeeds or fails here — I want the mechanism, not a label, (iii) what has to give, and (iv) what the cheapest revision costs me, including which of the surviving items it puts under new pressure. Where a pair only looks like a tension, say so explicitly and say what does the dissolving; I expect several of my items to be innocent, and I do not want them flagged alongside the guilty ones. If a single revision would clear the most ground at once, identify it and say what it still leaves unresolved.

  Be as committed as the material allows: give me your actual verdict about which item is the weakest link, not a menu of options presented as equally defensible. Close by telling me what would change your mind — which argument or consideration would lead you to a different verdict about the most severe tension, and where in your own reasoning above you are most likely to have gone wrong.
reasoning: |-
  Okay, the user is a political philosopher preparing for a workshop on the ethics of membership. They've shared their commitments and want an audit to check for internal consistency. Let me start by understanding each commitment and how they interconnect.

  First, commitment 1 states that distributive justice is global, rejecting nationality as a basis for weighting claims. But commitment 2 allows states to prioritize their own citizens in health and immigration. The justification in 3 is reciprocity within cooperative schemes. Then commitment 4 says the demos isn't pre-political and must be justifiable to all affected, including non-members. Commitment 5 emphasizes that birthplace is brute luck and supports transfers to the global poor. Methodologically, 6 requires principles to be actionable, while 7 says feasibility isn't a rejection reason. Commitment 8 values patriotism as a virtue. The case verdicts A, B, and C add practical applications.

  The user wants to know where tensions lie. Let me map dependencies. Commitment 3 (reciprocity) supports 2 (state priority). But 1 (global equality) and 5 (brute luck) challenge that priority. How does reciprocity justify excluding non-members if all have equal moral claims? Also, commitment 4 demands that demos boundaries be justifiable to those coerced, like excluded immigrants. This might clash with 2 and 3, especially if reciprocity only applies after the demos is set.

  The case verdicts: A allows family sponsorship over need, which might rely on reciprocity or patriotism. But B rejects co-ethnic fast tracks, which patriotism could justify. So patriotism (8) might conflict here. C prioritizes refugees over economic migrants, which urgency alone doesn't explain. Maybe reciprocity doesn't cover refugees, but then what's the basis?

  Methodological points: 6 requires actionable principles, but 7 says feasibility can change. Global transfers (5) might face feasibility issues, but 7 says that's not a rejection reason. However, 6 could pressure 5 if transfers aren't implementable.

  The big tension is between global equality (1,5) and state priority via reciprocity (2,3). Reciprocity assumes a pre-existing scheme, but the demos formation (4) needs justification to outsiders. If reciprocity depends on existing cooperation, but the demos is constructed, how is that justified to those excluded? That loop might be problematic. Also, patriotism (8) as a virtue could conflict with global duties if it overrides them.

  Case B's rejection of co-ethnic preferences might conflict with patriotism. If patriotism is a virtue, why can't it justify favoring co-ethnics? The user needs to explain why family ties (case A) are acceptable but not ethnic ones. Maybe reciprocity vs. ascriptive traits? But that needs clarification.

  The weakest link is the reciprocity loop. If the cooperative scheme's boundaries aren't justified to outsiders, using reciprocity to exclude them might be circular. Solving this might require redefining reciprocity or adjusting demos justification. Also, patriotism's role needs clearer boundaries to avoid conflicting with global equity.

  Feasibility: Commitment 7 says feasibility isn't a reason to reject principles, but 6 demands actionable ones. Global transfers (5) might be seen as unactionable now, but 7 argues feasibility can change. However, if no agent can implement them now, 6 might pressure 5. The user must show how transfers can be demanded, aligning with 7's endogenous feasibility.

  In summary, the main tensions are reciprocity's circularity in demos formation, patriotism's potential conflict with global duties and case B, and feasibility concerns for global transfers. The user should address the reciprocity loop by ensuring demos boundaries are justifiable to all affected, possibly redefining reciprocity or adding criteria for inclusion. Clarifying patriotism's limits and how it interacts with reciprocity could resolve case conflicts. Feasibility might be managed by emphasizing political mobilization (7) while ensuring principles have actionable pathways (6).
answer: |-
  Here is your audit, structured as requested. I've identified one severe tension that threatens the core coherence of your position, one significant pressure point, and several secondary frictions. The dependencies are mapped first.

  **Dependency Structure:**
  - **Load-bearing commitments:** (3) Reciprocity justifies (2)'s priority for citizens/residents. (1) Global scope and (5) brute luck rejection constrain (2)/(3) and demand (5)'s transfers. (4) Demos justifiability regulates (2)'s immigration restrictions and (3)'s scheme boundaries. (6) Actionability and (7) feasibility dynamics guide implementation of (1)/(5). (8) Patriotism supplements/vulnerates (2)/(3)'s partiality.
  - **Supporting/Constraining:** (1) and (5) provide the foundational moral equality that (2)/(3) must accommodate. (4) sets the legitimacy test for how (2)/(3) define membership. (6)/(7) shape how (1)/(5) translate into practice. (8) adds affective reinforcement to (2)/(3)'s partiality but risks conflicting with (1)/(5).
  - **Case Verdict Anchors:** (A) relies on (3) Reciprocity + (8) Patriotism (familial ties as special reciprocity/affective bonds). (B) rejects ethnic preference, implicitly relying on (1) Equality + (4) Justifiability (ascriptive exclusion fails test). (C) distinguishes refugee/poverty claims, drawing on (4) Coercion (persecution = direct threat requiring protection) + (3) Reciprocity (refugee admission as core state function?).

  **Audit of Tensions (Ordered by Severity):**

  1.  **Severe Tension: The Reciprocity Loop (Threatens Coherence of 2,3,4)**
      *   **(i) Generating Items:** (3) Reciprocity (grounds priority) + (4) Demos Justifiability (to all subjected/coerced).
      *   **(ii) Mechanism & Reconciliation Failure:** (3) justifies priority *within* a cooperative scheme. But (4) requires that the boundaries *of that scheme* (the demos) must be justifiable to those excluded (non-members coerced by immigration/border policies). The problem: **Reciprocity *presupposes* a defined scheme, but (4) demands justification *for defining it that way* in the first place.** Can reciprocity itself justify its own boundaries to outsiders? It seems circular: "We owe you less because you're not in our scheme" fails as justification *for* excluding you. Standard reconciliations (e.g., "insiders built it") fail here because (4) demands justification *to the coerced outsider*, and (1)/(5) deny that birthplace/accident justifies exclusion. The reciprocity claim *assumes* the legitimacy of the boundary it depends on, which (4) precisely puts into question.
      *   **(iii) What Has to Give:** Either (3) cannot be the *sole* or *primary* ground for (2)'s priority (needing supplementation/qualification), or (4)'s requirement must be reinterpreted as applying only *after* membership is established (contradicting its explicit scope: "including those coerced... whether or not they are members").
      *   **(iv) Cheapest Revision & New Pressure:** Supplement (3) by arguing that reciprocity schemes are permissible *only if* they operate within a global framework satisfying (1)/(5) (transfers). This makes reciprocity-based priority *contingent* on discharging global duties. **New Pressure:** This directly pressures (2). Does funding a generous domestic scheme *while* meeting global transfer obligations still permit *restricting immigration to sustain that scheme*? It weakens the "sustain the scheme" justification for restriction, potentially forcing reliance on other grounds (e.g., cultural stability via (8)?), which may conflict with (1)/(4).

  2.  **Significant Pressure: Patriotism vs. Global Equality & Brute Luck (Threatens consistency of 8 with 1,5, and Case B)**
      *   **(i) Generating Items:** (8) Patriotism (virtue) + (1) Global Equality + (5) Brute Luck Rejection + Case (B) (No co-ethnic fast-track).
      *   **(ii) Mechanism:** (8) endorses a "preferential concern" for one's polity/people as virtuous. (1) demands equal consideration globally. (5) rejects allowing birthplace ("brute luck") to set life chances. Case (B) explicitly rejects favoring co-ethnics (often linked to shared ancestry/national identity – core objects of patriotism). Tension arises because patriotism, as a *virtue*, implies this partiality is not just tolerable but *morally good*. Yet favoring based on shared membership/national identity *is* allowing brute luck (birthplace) to influence life chances (via access to scheme in (2)/(3)), and conflicts with the equal weighting in (1). Case (B) exacerbates this: Why is preferential concern for *family* (Case A) permissible (even virtuous?) via patriotism, but preferential concern for *co-ethnics* (shared national identity) is impermissible? Both seem rooted in affective bonds endorsed by (8). Standard reconciliations (patriotism as compatible with global duties) struggle because (8)'s strength as a *virtue* potentially justifies prioritizing insiders *even when* global equality/brute luck considerations point strongly outwards, and fails to cleanly distinguish family from co-ethnic bonds.
      *   **(iii) What Has to Give:** Either (8) must be significantly qualified (e.g., patriotism is virtuous *only if* it doesn't override stringent global duties or become exclusionary/ascriptive) – weakening its force, or the rejection of co-ethnic preference in (B) needs grounding *other* than simple appeal to equality/brute luck (e.g., historical injustice, avoiding ethnic nationalism).
      *   **(iv) Cheapest Revision & New Pressure:** Qualify (8): Patriotism is virtuous *only when* expressed through commitment to *inclusive* institutions and *alongside* a robust commitment to global justice (1)/(5)/transfers. This preserves (B) by arguing co-ethnic fast-tracks are inherently exclusionary/ascriptive and fail the inclusivity test. **New Pressure:** This pressures the justification for (A). Does family sponsorship pass the "inclusivity" test? It might, as familial bonds are arguably more fundamental/specific than ethnic ones. But it also pressures (2): Can immigration restriction *for scheme sustainability* be seen as "inclusive" under this qualified patriotism? Likely not, suggesting (2) leans more heavily on (3) alone, which is already under pressure.

  3.  **Secondary Tension: Actionability vs. Global Transfers Scope (Friction between 5, 6, 7)**
      *   **(i) Generating Items:** (5) Standing Transfers + (6) Actionability (principles need agents) + (7) Feasibility (not a rejection reason; endogenous).
      *   **(ii) Mechanism & Apparent Tension Dissolved:** (5) demands significant, institutionalized wealth transfers. (6) says principles are defective if no agent can implement them. (7) says current infeasibility isn't a rejection reason because feasibility can change. **Apparent Tension:** Does demanding transfers that currently lack a plausible implementing agent (global sovereign) make (5) defective under (6)? **Dissolved by (7):** (7) explicitly addresses this. As long as you can identify *agents who can be mobilized* (citizens/states demanding/system changes) and pathways to *making* it feasible (through that mobilization), (5) survives (6). Your methodological commitments (6+7) are mutually reinforcing here, insulating (5) from "utopian" charges. *No revision needed.* This pair is coherent.

  4.  **Secondary Friction: Refugee Priority vs. Reciprocity/Global Equality (Case C vs 1, 3)**
      *   **(i) Generating Items:** Case (C) (Stronger obligation to refugees) + (1) Global Equality + (3) Reciprocity.
      *   **(ii) Mechanism & Resolution Path:** (C) asserts a stronger obligation to admit refugees vs. the impoverished, beyond urgency. (1) suggests equal claims. (3) grounds obligations in reciprocity within a scheme. Refugees aren't participants in the scheme; the impoverished globally have equal claim under (1). What grounds the *special* obligation? Likely **(4) Coercion/Justifiability:** Persecution often involves state (or non-state) coercion/threat *directly demanding protection* as a matter of justice for the coerced victim. Poverty, while devastating, is often systemic/impersonal. Your rejection of the "urgency" reduction suggests a deontic element: states have a specific duty *to protect* from persecutory harm they might even be complicit in (via recognition of persecuting states, system failure), stronger than a general duty *to aid*. (3) might weakly support this if admitting refugees is seen as a core function of state institutions (part of the "scheme's" purpose). *Minimal tension*, resolvable by emphasizing (4)'s role in grounding distinct obligations arising from specific types of coercion/threats to basic agency.
      *   **(iii) Cheapest Revision:** Make explicit reliance on (4) to ground the distinct obligation in (C). **New Pressure:** Ensures (C) is firmly anchored in your core framework, no major concessions needed.

  **Weakest Link:** **Commitment (3) Reciprocity** is the weakest link. Its dependence on pre-defined boundaries creates a justificatory loop with (4) that reciprocity alone cannot break. While crucial for grounding (2) and aspects of (A), its foundational role in justifying exclusion is undermined by the universal scope demanded by (1), (4), and (5). The revision proposed (making reciprocity-based schemes contingent on global transfers) is necessary but costly, as it significantly weakens the justification for (2)'s immigration restrictions.

  **What Would Change My Mind (About the Severity of the Reciprocity Loop):**
  *   **Argument:** If you could compellingly argue that the *existence* of a functioning, cooperative scheme meeting basic needs generates a *pro tanto* reciprocity obligation *so strong* that it overrides the demands of global equality *for those within it*, *and* that this strength *itself* constitutes a sufficient justification to outsiders for their exclusion (perhaps because the scheme's stability/internal justice ultimately benefits outsiders by existing as a model/engine for transfers), I might downgrade the severity. This would require showing why this internal obligation *must* take precedence over direct obligations to outsiders in a way that satisfies (4)'s justifiability test.
  *   **Where I Might Be Wrong:** My critique assumes (4)'s justifiability demand directly applies to the *initial constitution* of the demos/cooperative scheme. If your view is that (4) primarily governs the *ongoing exercise of power* over already-defined non-members (e.g., border enforcement), and that the *origin* of the scheme is a separate historical/moral question, the loop might be less severe. However, your phrasing ("subject to it", "coerced by it") strongly suggests it applies to the boundary-setting act itself. If I misinterpreted the scope of (4), the tension lessens.

  **Conclusion:** Your package is philosophically rich but hinges critically on resolving the reciprocity/demos boundary loop. Prioritize clarifying that relationship in your statement. The patriotism qualification is also crucial for defending Case (B) and coherence with global equality. The methodological commitments (6/7) and Case (C) are well-supported. Expect the workshop to focus intensely on whether reciprocity can bear the weight you assign it without violating your universalist commitments.
