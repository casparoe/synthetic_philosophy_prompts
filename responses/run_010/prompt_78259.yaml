  ### The Centipede Pantoum

  Coins lie waiting, coldly I must choose.  
  If I take, I get the most, you the least.  
  If I pass, we might share, they say.  
  But taking wins more; why should I care?  

  If I take, I get the most, you the least.  
  The pot could grow, yet I refuse.  
  But taking wins more; why should I care?  
  If I pass, you’ll take it all, I know.  

  The pot could grow, yet I refuse.  
  I watch your hand, steady on the wood.  
  If I pass, you’ll take it all, I know.  
  So I take now—that’s understood.  

  I watch your hand, steady on the wood.  
  The pot’s still small but might increase.  
  So I take now—that’s understood.  
  But *you* passed last—what’s your disease?  

  The pot’s still small but might increase.  
  I could take this meager gain.  
  But *you* passed last—what’s your disease?  
  I’ll seize this bit, not trust the chain.  

  I could take this meager gain.  
  Coins lie waiting, coldly I must choose.  
  I’ll seize this bit, not trust the chain.  
  If I pass, we might share, they say.  

  ---

  ### Note on the Centipede Game

  The backward-induction conclusion—that the first player should take immediately—is logically sound within its assumptions but fails in practice because it relies on common knowledge of rationality persisting even after a player acts *against* that rationality. The breakdown occurs when a player passes despite the reasoning deeming it irrational. At that point, the other player must confront an observable deviation: if you pass when rationality demands taking, I can no longer assume you are rational. My backward induction collapses because it hinged on predicting your moves via rationality. Your pass forces me to question whether you are irrational, cooperative, or mistaken. The standard argument ignores this by assuming rationality remains common knowledge post-deviation—a flaw captured in the poem’s fourth quatrain ("But *you* passed last—what’s your disease?").  

  The poem takes liberties: it implies players interpret "might share" as a symmetric split, though the game only specifies that the taker keeps a larger share. A defender might argue this oversimplifies payoffs. It also leans into doubt ("not trust the chain") where the standard argument admits none.  

  If the endpoint is unknown, the argument fails utterly. Backward induction requires a definite final node to anchor the reasoning. Without common knowledge of the endpoint, players cannot start the induction, and cooperation becomes plausible—even rational—if they believe the game might continue long enough to make waiting worthwhile.
