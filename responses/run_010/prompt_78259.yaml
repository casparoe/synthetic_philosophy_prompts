            - The poem also includes a moment of doubt at node3, which is not part of the backward induction. A defender of the standard argument would say that the doubt should not arise because the player should be confident in the rationality of the other.

            Answer the last question: would the argument survive if the final node existed but its location were not common knowledge?

            No, because backward induction relies on the fixed and known length of the game. If the players don't know where the end is, then they cannot compute backward from the end. Each player might think the game is longer than it is, and therefore might pass in the hope that the other will pass too. The unraveling from the end would not occur.

