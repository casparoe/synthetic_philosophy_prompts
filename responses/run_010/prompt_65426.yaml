  ### Decision Tree for Methodological Approaches in Social Science  
  **Instructions for use:** Answer each question based on a concrete explanatory scenario (e.g., explaining voting patterns, economic inequality, or algorithmic ranking systems). Avoid theoretical jargon; focus on empirical intuition.  

  1. **When explaining a social pattern (e.g., voting trends or market behavior), must the explanation trace it to actions and interactions of *identifiable individuals*?**  
     - Yes → 2  
     - No → 3  

  2. **Can the pattern be fully explained by individuals making *rational choices* (e.g., maximizing utility given fixed preferences and constraints)?**  
     - Yes → **Rational-choice reductionism** (e.g., neoclassical economics)  
     - No → **Mechanism-based analytical sociology** (e.g., Schelling-style models of social mechanisms)  

  3. **Is the pattern best explained by the *meanings* participants attach to their actions (e.g., rituals, symbols, or cultural narratives)?**  
     - Yes → **Interpretivist position** (e.g., Geertzian thick description)  
     - No → 4  

  4. **Can the pattern be explained by a *self-sustaining system* where communication, information flows, or codes operate independently of individual intentions?**  
     - Yes → **Systems theory** (e.g., Luhmann; communication as basic unit)  
     - No → 5  

  5. **Does the pattern involve a *group entity* (e.g., a corporation, state, or algorithm) acting as if it holds beliefs or intentions?**  
     - Yes → 6  
     - No → 7  

  6. **Are the group entity’s beliefs/intentions *fully determined* by its members’ commitments and decision rules?**  
     - Yes → **Group agents real but analyzable** (e.g., List and Pettit)  
     - No → *Unoccupied* (U1, see below)  

  7. **Is the pattern experienced as an *external constraint* by individuals (e.g., laws, norms, or algorithms they cannot alter alone)?**  
     - Yes → 8  
     - No → 9  

  8. **Is this constraint rooted in *underlying structures* (e.g., class, power, or material conditions) invisible to everyday actors?**  
     - Yes → **Structuralism** (e.g., Althusser; structures as causal)  
     - No → **Durkheimian social facts** (e.g., norms as irreducible and coercive)  

  9. **Does the pattern *primarily serve a function* in maintaining a larger system (e.g., stability, adaptation, or efficiency)?**  
     - Yes → **Functionalism** (e.g., Merton; teleological explanations)  
     - No → 10  

  10. **Are disputes about “individual vs. social” explanations merely *pragmatic differences in description*, not substantive?**  
      - Yes → **Deflationary view** (e.g., Carnap; verbal dispute)  
      - No → **Critical-realist emergence** (e.g., Bhaskar; emergent powers from social relations)  

  ---  
  ### Unoccupied Branches and Unresolved Pairs  
  - **U1 (Node 6, "No"):** Unoccupied because the position—group agents with *irreducible* mental states (not determined by members)—is **unattractive**. It implies group minds detached from individuals, which is rarely defended.  
  - **U2 (Node 9, "No" → Node 10):** All branches occupied (critical realism or deflationism).  

  **Pairs the tree cannot separate:**  
  - **Durkheimian social facts vs. Functionalism:** Both could answer "Yes" to Node 7 (external constraint) and Node 9 (functional role). The tree *tries* to split them via Node 8 (invisible structures), but functionalists might see constraints as visible (e.g., norms).  
  - **Critical-realist emergence vs. Structuralism:** Both answer "Yes" to Node 7 and Node 8 (invisible structures). The tree separates them via Node 9 (function) and Node 10 (deflationism), but critical realists might accept functional elements.  

  ---  
  ### Test Case: Algorithmic Ranking System  
  **Scenario:** A credit-scoring algorithm persists unchanged through complete turnovers of engineers and users.  
  - **How leaves explain it:**  
    - **Rational-choice reductionism:** Engineers/users *chose* it rationally for efficiency.  
    - **Mechanism-based analytical sociology:** Feedback loops (e.g., institutional inertia) sustain it.  
    - **Group agents:** The *organization* maintains it via decision rules.  
    - **Durkheimian:** It is a constraining, external "fact" (e.g., credit norms).  
    - **Systems theory:** A self-reproducing node in a communication system (e.g., financial data flows).  
    - **Critical-realist emergence:** Emergent from historical/material relations (e.g., capitalism).  
    - **Interpretivist:** Engineers/users *interpret* it as "fair" or "objective."  
    - **Deflationary:** "Individual vs. system" is a linguistic choice; the algorithm just *is*.  
    - **Structuralism:** Reflects class/power structures (e.g., economic hierarchy).  
    - **Functionalism:** Maintains financial system stability.  

  ---  
  ### Confidence Assessment  
  **Overall confidence:** Moderate (70%). The tree discriminates 8/10 leaves clearly but struggles with:  
  - Durkheimian vs. Functionalism (shared emphasis on constraint/function).  
  - Critical realism vs. Structuralism (shared focus on hidden structures).  

  **Least confident placement:** **Critical-realist emergence** (Node 10, "No"). It is a catch-all for "non-deflationist, non-functionalist, structural-but-not-Durkheimian" cases, making it fuzzy. Critical realists might reject the tree’s path (e.g., by affirming Node 7 or 8). Refining Node 10 would require a question about *ontological depth* (e.g., "Are social properties grounded in *historically layered relations*?"), but this risks jargon.  

  **Improvement needed:** A node distinguishing "hidden structures" (structuralism) from "emergent causal powers" (critical realism) would help—but avoiding banned terms is challenging. The test case validates the tree’s utility, as it forces concrete engagement (e.g., systems theory vs. Durkheimian).
