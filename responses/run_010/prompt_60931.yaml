prompt: |-
  ok so I've been rereading the Letter Spirit stuff — the Hofstadter/McGraw gridfonts, the whole "what makes every a an a" question — and I want to commission a bit of satire out of it.

  Write me a parody of a formal internet standards document in full RFC voice (MUST/SHALL/MAY in caps, numbered clauses, normative references), from an invented body like the Alphabetic Conformance Working Group, titled something like "Normative Requirements for Glyphs Conforming to the Category LOWERCASE A (v2.14)". About 650 words.

  The joke is that the working group is dead-set on defining a-ness by necessary and sufficient conditions, and every clause gets broken by a real failure case, so the amendment history keeps getting more baroque instead of ever conceeding defeat. Include a scope section, a definitions section, a conformance test procedure with a test suite, and an appendix of known non-conforming-but-obviously-still-an-a glyphs. Make the failure cases actual ones rather than invented: single-storey vs double-storey a, an italic where the bowl doesn't close, a counter that fills in at heavy weights, Blackletter, a kid's mirrored a, the @ ligature, a rotated a, and whether a maximally geometric sans 'a' is drifting into 'o'. Keep it deadpan — no winking, no author's aside, and the spec should never say the project is impossible, it should just keep patching.

  Bonus points if the last clause quietly reintroduces style as a normative requirement ("MUST be recognized as an a by a conforming reviewer") without ever admitting that's what just happened.

  After the piece, add a short note saying how confident you are in the Letter Spirit framing you're satirizing and singling out the one point you're least sure of — e.g. whether this makes the project look dumber than it is. American English please.
