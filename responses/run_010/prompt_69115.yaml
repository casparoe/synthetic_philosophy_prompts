  4. **Notice Method**: Since individual notice is impossible, use a substitute method that is a small harm (e.g., administering one additional dust speck to fund the notice). Justify it as net-beneficial under the settlement's arithmetic.
  5. **De Minimis Threshold**: Draw a line between one speck and many without acknowledging the philosophical problem. Create a threshold and a damage schedule.
  6. **Per-Capita Distribution**: So small that rounding is necessary. State the rounding rule and its effect on the total.
  7. **The Torture Victim**: Address his status (class member, subclass, excluded). Discuss adequacy of representation and the difficulty of paying counsel from the same fund.
  8. **Objector**: Invent an objector and their filing (arguing no quantity of specks can be traded off against torture). Give the administrator's procedurally correct but philosophically empty reply.
