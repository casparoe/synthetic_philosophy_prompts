  **UNITED STATES DISTRICT COURT  
  FOR THE DISTRICT OF COLUMBIA**

  JANE DOE, Individually and on Behalf of All Others Similarly Situated,  
  Plaintiff,  
  v.  
  THE DECIDER, INC.,  
  Defendant.  

  Case No. 1:23-cv-00777-JDB  
  CLASS ACTION  

  ---

  **NOTICE OF PROPOSED CLASS ACTION SETTLEMENT AND INSTRUCTIONS FOR FILING A CLAIM**  

  **TO:** ALL PERSONS WHO RECEIVED A MOMENTARY DUST SPECK IN THE EYE PURSUANT TO THE DECISION OF THE DECIDER, INC. ON OR ABOUT OCTOBER 1, 2022 (THE “INCIDENT”).  

  **PLEASE READ THIS NOTICE CAREFULLY.** A federal court authorized this Notice. It explains your rights regarding a proposed class action Settlement.  

  ### I. INTRODUCTION  
  The Court has preliminarily approved a Settlement in this class action lawsuit. Plaintiff alleges that Defendant, The Decider, Inc. (“Defendant”), resolved an ethical dilemma by choosing to expose a vast number of persons to a momentary dust speck in the eye (a “Speck Event”) instead of subjecting one individual to fifty years of torture (the “Alternative”). The Settlement resolves claims for compensatory relief by all affected persons. The Court appointed Equitable Claims Resolution Group as Settlement Administrator (“Administrator”).  

  ### II. WHO IS INCLUDED?  
  The Class includes all individuals who experienced a Speck Event during the Incident. The Class size is 3↑↑3 as established by Defendant’s records. For clarity, 3↑↑3 is defined mathematically as 3 raised to its own power three times in succession, or 3^(3^3), which resolves to 3^27, or 10,460,353,203. The Administrator acknowledges that individual notice to all Class Members is impracticable due to the Class size and logistical constraints.  

  **Status of the Tortured Individual:** The individual who would have been subjected to fifty years of torture under the Alternative (the “Tortured Party”) is **not a Class Member**. The Tortured Party’s interests were adjudicated separately in *Doe v. The Decider, Inc.*, Case No. 1:23-cv-00778-JDB, which settled for a lump-sum payment of $1 billion. Class Counsel and counsel for the Tortured Party have confirmed there is no conflict of interest, as the Tortured Party’s relief is distinct and unrelated to Speck Events.  

  ### III. THE SETTLEMENT BENEFITS  
  Defendant has agreed to create a $10,000,000.00 Settlement Fund. After deductions for notice costs, attorneys’ fees, administrative expenses, and service awards (see Section IX), the Net Settlement Fund will be distributed to Class Members who timely file valid claims.  

  1. **Compensation Schedule:**  
     - Class Members who experienced **1–5 Speck Events**: Eligible for a base payment.  
     - Class Members who experienced **6 or more Speck Events**: Eligible for the base payment plus an additional $0.000001 per additional Speck Event.  

     *Note:* A “Speck Event” is defined as a single, instantaneous exposure to a dust speck in one or both eyes. Multiple specks administered simultaneously constitute one Speck Event.  

  2. **Per-Capita Calculation:**  
     The base payment is calculated as follows:  
     - Net Settlement Fund divided by Class size (3↑↑3).  
     - Given Class size (3↑↑3 = 10,460,353,203) and an estimated Net Settlement Fund of $9,000,000.00, the base payment equals approximately $0.0000008603.  

  3. **Rounding Protocol:**  
     All payments will be rounded to the nearest cent under 31 U.S.C. § 5101 (currency laws). Since $0.0000008603 rounds to $0.00, each Class Member will receive **$0.00** unless they experienced 6+ Speck Events.  

     *Effect of Rounding:* The total compensation distributed will be $0.00 for all 1–5 Speck Event claims. Residual funds from rounding will be reallocated to the Cy Pres Fund (Section X).  

  ### IV. HOW TO GET COMPENSATION—CLAIMS PROCEDURE  
  To receive payment, you must submit a Claim Form by **[Date + 60 Days]**.  

  1. **Notice Program:**  
     Due to the infeasibility of individual notice, the Administrator will provide notice via targeted internet banners, public-service announcements, and carrier pigeons. To fund this program, one additional Speck Event will be administered to each Class Member. This is a net benefit: The burden of one additional Speck Event (0.000001 units of harm) is outweighed by the informational value (0.000003 units of benefit) per the *Doe* Harm Metric Act, 5 U.S.C. § 5307.  

  2. **De Minimis Threshold:**  
     Claims for **1–5 Speck Events** are **ineligible** for individual compensation under the *de minimis non curat lex* doctrine. Only claims for **6 or more Speck Events** may receive payment. Submit:  
     - A completed Claim Form (available at www.SpeckSettlement.com).  
     - Sworn attestation of Speck Event count, including date/location.  
     - Corroborating evidence (e.g., eyewitness affidavit, medical record).  

  ### V. YOUR RIGHTS REGARDING THE SETTLEMENT  
  1. **EXCLUDE YOURSELF:**  
     Opt out by mailing a written request to the Administrator by **[Date + 45 Days]**. If you exclude yourself, you retain the right to sue independently but will receive no Settlement benefits.  

  2. **OBJECT:**  
     File a written objection with the Court and serve copies on counsel by **[Date + 45 Days]**. Grounds must be stated with specificity.  

  3. **ATTEND THE HEARING:**  
     The Court will hold a Final Fairness Hearing on **[Date + 90 Days]** at 10:00 a.m. at the E. Barrett Prettyman U.S. Courthouse, Washington, D.C. You may appear in person or through counsel to be heard on the Settlement’s fairness.  

  ### VI. FINAL FAIRNESS HEARING  
  The Court will determine whether the Settlement is fair, reasonable, and adequate at the Final Fairness Hearing. Objections will be heard. A summary of one objection follows:  

  - **Objector:** John Smith (a Class Member).  
  - **Grounds:** No quantum of Speck Events can ever be morally or legally equivalent to the torture of one person. Thus, the Settlement’s harm-exchange calculus is invalid per se.  
  - **Administrator’s Response:** The objection improperly conflates legal relief with ethical theory. The Settlement complies with Rule 23(e) by providing redress for *actual* injuries (Speck Events) within a feasible administrative framework. The objection is overruled as procedurally deficient for failing to cite controlling precedent.  

  ### VII. ATTORNEYS’ FEES AND EXPENSES  
  Class Counsel will request attorneys’ fees of 30% of the Settlement Fund ($3,000,000.00) plus expenses. The Tortured Party’s counsel will separately petition for fees from the Tortured Party’s settlement. Both petitions will be heard at the Final Fairness Hearing.  

  ### VIII. CY PRES DISTRIBUTION  
  Unclaimed funds (estimated at 99.99999% of the Net Settlement Fund) will be distributed via *cy pres* to **The Foundation for the Prevention of Needless Suffering**, a nonprofit promoting ethical decision-making.  

  ### IX. FREQUENTLY ASKED QUESTIONS  
  1. **How many people are in the Class?**  
     The Class size is 3↑↑3. For reference, 3↑↑3 is a fixed integer (10,460,353,203) that exceeds the number of ants on Earth. Precise identification of Class Members is not required for certification.  

  2. **Why do I get $0.00?**  
     Compensation is calculated per the Settlement’s terms. Under U.S. currency laws, amounts below $0.005 round to $0.00.  

  3. **Why was I given an extra dust speck?**  
     The additional Speck Event funds notice efforts. The net benefit (0.000002 units) exceeds the burden, as certified by the Harm Calculus Bureau.  

  4. **Can I claim more for multiple specks?**  
     Only if you experienced 6+ Speck Events. Attest to this in your Claim Form.  

  5. **What if I disagree with the Settlement?**  
     Object per Section V or opt out. Do nothing to remain in the Class and release your claims.  

  ---

  **QUESTIONS?** Visit www.SpeckSettlement.com or call 1-800-555-0199.  

  **DO NOT CONTACT THE COURT OR THE CLERK’S OFFICE.**  

  **Dated:** [Date]  
  **By Order of the United States District Court**  
  **for the District of Columbia.**  

  **Equitable Claims Resolution Group**  
  Settlement Administrator
