prompt: |-
  I'm trying to sort out what I actually think about reasons — specifically about a distinction I can feel but can't name cleanly. Some considerations seem to be about the thing my attitude is aimed at, and others seem to be only about the having of the attitude, and I treat those two very differently. Not sure my pattern hangs together. Here are my gut calls:

  1. The donor who funds my department says the money stops unless we find his pet theory compelling. A few of us can't and never will. I think we genuinely have reason to try — read the papers charitably, sit with them, that kind of thing. But I also think that if someone does end up finding it compelling because of the money, their finding it compelling isn't any better as a piece of thinking. So: a reason to try, and not a reason in favor of the attitude itself. Both halves feel solid to me.

  2. A rep for a pharma company offers me two grand to believe her drug is best in class. There's no evidence it is. I don't think that's a reason to believe it at all. At most it's a reason to want to believe it, which sounds like a different animal.

  3. A magazine pays me $500 for a glowing review of a midlist novel I'd skimmed and thought was meh. To write the review I go back and actually read it closely and I notice sentence-level stuff I'd have missed. By the end I do admire the book. I think that admiration is fine — the $500 didn't make the book good, it got me to see that it was, and seeing is seeing.

  4. A think tank pays me $5k to spend three months investigating whether raising the minimum wage costs jobs. Left alone I'd never have looked into it. During those three months I read the studies and end up believing it doesn't, much. This one makes me queasy in a way 3 doesn't and I couldn't say why. Best I've got: if they'd paid me to reach the other conclusion maybe I would have. But thats true of the novel too, so that can't be the difference.

  5. My internet goes down for a week and wrecks a deadline. The company sends me $200 because their retention team worked out it's cheaper than losing me. I feel grateful and I don't think that's confused. Same company's founder gets a lifetime achievement award for philanthropy he does for the tax break and the photos. I don't think he's admirable at all. Gratitude yes, admiration no, and I feel firm on both.

  6. My boss tells a joke that isn't funny. I laugh. I'm not amused, I'm employed. Doesn't feel like there was any reason about the joke at all, just a reason to make the noise.

  7. On New Years I promised myself I'd want to go to my family's dinner this year. The dinner will not be pleasant. I still think the promise gives me a reason to want to go — a reason I made rather than found. This feels as firm as anything on the list.

  The one I keep flip flopping on: my partner wrote a novel and asked me to read it and said she hoped I'd love it. I read it partly to please her, and I did love it, and now I love it for itself, though I'd never have picked it up otherwise. Half the time I think it's real so it's fine, half the time I think it's contaminated at the root and I'm fooling myself.

  So: is there one principle behind all of this? I'd rather get one real candidate stated precisely, with the clause that's doing the work in each case, than a survey of the options. But if you think one of my verdicts has to go, say which and why — don't just bend the principle into a pretzel to save all seven.

  Give it to me as a single JSON object and nothing else, with these fields:

  - "principle": {"name": a short label you make up, "statement": the principle itself, stated precisely, as many sentences as it takes}
  - "cases": array with one entry per numbered case, each {"n": 1 through 7, "mine": my verdict in a few words, "yours": one of "matches" / "overturns" / "matches-with-extra-clause", "clause": which part of the principle decides it, "note": one sentence}
  - "flipflopper": {"verdict": what the principle says about my partner's novel, "why": the reasoning}
  - "predictions": array of {"case": ..., "predicted_verdict": ..., "confidence": "low" / "medium" / "high"} for these two that I haven't given verdicts on: (a) my kid got paid five bucks a book all summer and now reads for fun — is her enjoyment of reading grounded in the right sort of thing; (b) an app gives me points for engaging with whatever it puts in front of me and I do get genuinely outraged at the stuff in my feed — is the outrage fitting
  - "costs": array of strings, honest ones — anything the principle gets wrong elsewhere, or verdicts of mine it strains but technically keeps

  Don't bother with names or a reading list, I don't need citations, I just want the view.
reasoning: |-
  We are looking for a principle that distinguishes between reasons that bear on the object of an attitude (the thing the attitude is about) and reasons that bear on having the attitude (which may be pragmatic, social, etc.). The user's examples show that they treat these differently.

   After analyzing the cases:

   1. Donor: Reason to try to find the theory compelling (i.e., to engage in activities that might lead to that attitude) but not a reason to actually find it compelling. So the reason is for the activity (trying) not for the belief itself.

   2. Pharma: Money is not a reason to believe (because belief should be based on evidence, not payment). At most, a reason to want to believe.

   3. Novel review: The payment led to a process (close reading) that revealed genuine merits. The admiration is based on the merits, so it's a good attitude.

   4. Think tank: The payment led to investigation, but the queasiness might come from the fact that the investigation was commissioned by a party with a vested interest and might have been designed (or the evidence selected) to lead to a particular conclusion. The user notes that in the novel case (3) the same might be true, but they feel differently. The difference might be that in (3) the process (close reading) is directly about the object (the novel) and the attitude (admiration) is based on the features discovered. In (4), the attitude is about a complex empirical question and the process of investigation might be subject to biases (e.g., which studies are selected, how they are interpreted) that are influenced by the funding. So the worry is that the belief is not entirely grounded in the evidence but might be influenced by the context of the investigation.

   5. Internet company: Gratitude for the $200 is appropriate because it is a response to the company's action (even if motivated by retention). But admiration for the founder's philanthropy is not appropriate because the motive (tax break and photos) taints the act. Gratitude is a response to the benefit received, regardless of the motive, while admiration requires a good motive.

   6. Boss's joke: Laughing is an action, not an attitude about the joke. There is no reason to find the joke funny, but there is a reason to laugh (to keep the job).

   7. New Year's promise: The promise creates a reason to want to go to the dinner (to fulfill the promise), even though the dinner is unpleasant.

   The flip-flop case: Reading the partner's novel to please her led to discovering it and loving it for itself. The user is conflicted: is the love "contaminated" because the initial reason was extrinsic? But then they ended up loving it for its own qualities.

   Proposed principle:

   We can draw a distinction between:
     - Reasons that are "object-grounded": they bear on the properties of the object of the attitude (the theory, the drug, the book, the policy, the joke, etc.). For beliefs, these are evidence; for desires, these are the desirable features; for admiration, these are the admirable qualities.
     - Reasons that are "attitude-grounded": they bear on the costs or benefits of having the attitude itself, independent of the object.

   But note that in (3) and (4), the reason (payment) led to an activity that then provided object-grounded reasons. So the principle must account for the path to the attitude.

   Let's try:

   Principle: 
     An attitude (belief, desire, admiration, etc.) is fitting (or justified) only if it is held on the basis of reasons that are appropriately connected to the object of the attitude. 

   However, there can be reasons to bring about the conditions under which one might come to have such an attitude (e.g., by engaging in an activity that might reveal object-grounded reasons). But if the attitude is formed or held primarily because of the non-object-grounded reasons, then it is not fitting.

   In other words:
     - There are reasons to engage in activities that may lead to forming an attitude (e.g., trying to believe, reading the book, investigating) that are pragmatic.
     - But the attitude itself must be based on the properties of the object (if it is to be fitting).

   Now apply to cases:

   1. Donor: 
       - Reason to try: pragmatic (to keep funding). This is a reason for the activity.
       - But if one ends up believing the theory because of the money (and not because of the theory's merits), then the belief is not fitting. The user says it isn't better as a piece of thinking -> matches.

   2. Pharma:
       - The money is not a reason to believe because it doesn't bear on the drug's properties. So no reason to believe -> matches.

   3. Novel review:
       - The payment led to close reading, which revealed the merits. The admiration is based on the merits -> fitting -> matches.

   4. Think tank:
       - The payment led to investigation, and the user formed a belief based on the studies. But the queasiness might be because the investigation process might have been biased (e.g., the think tank might have selected studies that support their view, or the user might have been influenced to interpret the studies in a certain way because of the payment). The user's worry is that if they had been paid to reach the opposite conclusion, they might have. This suggests that the belief is not entirely based on the evidence but on the pragmatic context. So the principle would say: the belief is fitting only if it is based solely on the evidence (the object-grounded reasons). If the payment introduced bias, then it's not fitting. But the user formed the belief based on the studies. The user's queasiness might be due to the possibility of bias. We might need an extra clause: the process must be truth-conducive and not unduly influenced by the pragmatic reason.

       However, note that in (3) the process was also triggered by payment but the user feels fine. The difference might be that in (3) the process (close reading) is direct and the features are immediately accessible (the sentences). In (4) the evidence is complex and subject to interpretation. So the principle might require that the process that leads to the attitude is one that reliably connects to the object.

       Alternatively, we can say: the attitude is fitting if it is held on the basis of the object's properties, and the process that led to the exposure to those properties does not undermine the connection. In (3) the payment got the user to look, and then the book's properties did the rest. In (4) if the think tank's payment is associated with a biased selection of evidence, then the belief is not based solely on the object (the policy) but on a skewed presentation. Even if the user tried to be objective, the evidence set might be incomplete. So the queasiness is justified.

       The principle might not explicitly cover this, so we might need to adjust.

       Let me state a principle that accounts for both the basis of the attitude and the integrity of the process.

   Principle name: "Object-Grounded Basis Principle"

   Statement: 
     For any attitude that is about an object (e.g., belief, admiration, desire), the attitude is fitting only if it is held on the basis of properties of that object that are relevant to the attitude. 
     Reasons that are not about the object (e.g., pragmatic incentives) can provide reasons to engage in activities that may lead to exposure to the object's properties, but they do not directly provide reasons for the attitude itself. 
     Moreover, if the process by which one comes to be exposed to the object's properties is such that it undermines the reliability of the connection to the object (e.g., by biasing the evidence, or by creating a motive to form the attitude regardless of the object), then even if the attitude is formed, it may not be fitting.

