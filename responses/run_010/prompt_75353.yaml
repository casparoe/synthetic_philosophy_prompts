  The user has specific constraints: the speech must be two minutes, use short sentences, avoid philosophical jargon, and not label the grants as charity or prizes. It also can't make donors feel like saints or imply that recipients earned their grants. They mentioned that the school stopped requiring thank-you notes explaining why students deserved the grants, which could be a useful point to include.

  I need to address the core conflict: how to acknowledge luck without undermining the recipients' efforts or making the aid seem conditional. The user mentioned two classmates—one facing hardship due to a parent's job loss, another due to personal financial choices—and wants the speech to treat both equally without judgment. 

  The key philosophical points to weave in subtly are: 
  1) The brute luck/option luck distinction (e.g., being born with certain abilities vs. choices like saving or spending) 
  2) Avoiding desert-based language ("earned") 
  3) Framing aid as collective responsibility rather than charity 

  The speech should pivot from luck to community. Start by naming the tension ("this money isn't a prize"), then normalize varied circumstances (using the thank-you note policy change as proof). Shift focus to what the grants *do*—they're an investment in potential, removing barriers. The airplane oxygen mask metaphor works well here: it's practical, not moral. 

  For Marcus's interrogation prep, I'll highlight the speech moments that handle brute vs. option luck (the "some of us" examples), the rejection of desert (explicit "not a prize" line), and the luck egalitarian compromise (focusing on opportunity creation rather than fault). 

  The tone must balance gratitude with quiet rebellion—respectful but reshaping the narrative. Phrases like "it doesn't matter why the gap exists" and "we're all going to need somebody to see us" make the philosophy accessible without academic terms.
