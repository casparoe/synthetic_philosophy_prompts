  Here’s the speech draft, followed by the breakdown for Marcus:

  **Speech:**
  "Hi everyone. My name is [Your Name], and I’m one of the seniors receiving a Bridge Night grant. Standing here tonight, I’m thinking about how different all our paths look. Some of us hit unexpected bumps. Some of us just need that last piece to get started. The details? They’re personal. And honestly? They aren’t the point tonight.

  Here’s what I know: This money isn’t a prize. We didn’t cross a finish line first. And it’s not charity either. It’s something else.

  It’s an investment. An investment in making sure that where you started, or what happened along the way, doesn’t get to decide whether you *can* start college. A laptop, a deposit, textbooks – these aren’t extras. They’re tools. Tools we all need to have a real shot at what comes next.

  The school actually stopped making people write notes explaining why they 'deserved' this grant. That feels right. Because tonight isn’t about sorting us out. It’s about closing gaps. It’s about saying, 'Okay, you're here, you're ready to go – let’s make sure nothing basic holds you back.'

  So, to the donors: Thank you. Thank you for seeing those gaps and choosing to fill them. You’re not giving out gold stars. You’re handing out keys. Keys that unlock the same starting line for forty different stories. That’s powerful. It means we walk onto our campuses this fall with one less wall in our way. We won’t forget that. We’ll put these keys to good use. Thank you."

  **For Marcus (The Luck Egalitarian Breakdown):**

  1.  **Rejecting "Earned" & "Desert":** Explicitly stating *"This money isn’t a prize. We didn’t cross a finish line first"* and referencing the end of the thank-you notes (*"stopped making people write notes explaining why they 'deserved' this grant. That feels right"*) directly counters the bootstraps narrative. It denies that the grant is a reward for merit or virtue.
  2.  **Acknowledging Brute Luck vs. Option Luck (Without Sorting):** *"Some of us hit unexpected bumps. Some of us just need that last piece to get started"* subtly references different kinds of need (brute luck like layoffs vs. option luck like spending savings) while immediately declaring *"The details? They’re personal. And honestly? They aren’t the point tonight."* This avoids judging the *cause* of need (the "helmet" problem) and focuses on the *existence* of the need/barrier.
  3.  **Focus on Barriers & Opportunity, Not Fault:** The core framing is about **removing barriers** (*"making sure that where you started, or what happened along the way, doesn’t get to decide"*, *"closing gaps"*, *"nothing basic holds you back"*, *"one less wall"*) and **securing opportunity** (*"real shot"*, *"unlock the same starting line"*, *"keys"*). This aligns with luck egalitarianism's aim to neutralize the effects of bad brute luck on opportunity, regardless of option luck choices. The grant isn't about rewarding virtue or punishing vice; it's about enabling potential.
  4.  **Reframing the Donor Role:** Calling it an *"investment"* and donors *"choosing to fill gaps"* avoids saint-making. They are enabling fairer opportunity, not dispensing charity to the "deserving poor." *"You’re not giving out gold stars. You’re handing out keys"* reinforces this – they are providing necessary tools for access, not moral approval.
  5.  **The "Identical Recipients" Point:** *"Tonight isn’t about sorting us out"* directly addresses your concern about the two classmates. The speech refuses to engage in judging the *why* behind the need, focusing solely on the shared need for the resource to access the opportunity.

  **Why it works for the room:** It expresses deep gratitude ("Thank you... We won't forget") while fundamentally reshaping the narrative away from desert ("you earned this") towards enabling potential and removing barriers ("keys that unlock the same starting line"). It makes the donors feel like partners in creating opportunity, not like benefactors judging worthiness. The language is simple, positive, forward-looking, and meets the time/sentence constraints. It centers *access* and *potential*, not luck or fault.
