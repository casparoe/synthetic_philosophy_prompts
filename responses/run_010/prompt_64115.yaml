  First, I need to unpack the different interpretations of "from a contradiction, anything follows." This slogan can refer to several distinct logical and philosophical concepts. Let me start by recalling the various dimensions: syntactic (theorems in a logic), inferential (validity of arguments), semantic (entailment), doxastic (rational commitment), and holistic (content preservation). Each of these needs to be addressed separately to clarify where the principle holds and where it doesn't.

  For the syntactic sense, classical logic indeed has the principle of explosion as a theorem. So in systems like Frege's or Russell's, any contradiction implies any proposition. That's uncontroversial in classical contexts. But relevance logics reject explosion by requiring shared variables between premises and conclusion. Paraconsistent logics, which dialetheists use, also block explosion to avoid triviality. So the friend's first move against dialetheism assumes classical logic, which begs the question since dialetheists operate with non-classical systems. Pointing this out shows that the collapse into trivialism isn't inevitable.

  Next, inferential validity. In classical semantics, contradictions entail everything. But again, paraconsistent logics use different semantics, like allowing true contradictions without all sentences being true. So the validity of explosion depends on the logic adopted. The friend's argument presupposes classical validity, which dialetheists reject. Highlighting this dependency is crucial for the user to counter the friend's position.

  Semantic entailment ties closely to inferential validity. If a set of premises includes a contradiction, classical logic says it entails every sentence. But in paraconsistent approaches, models can satisfy contradictions without satisfying every sentence. Thus, Bohr's model having a contradiction doesn't automatically make it entail every possible outcome. The model's predictive success can still hold because the contradiction doesn't propagate uncontrollably. This directly addresses the friend's second point about Bohr's model explaining nothing.

  Moving to doxastic commitment, the principle that believing a contradiction rationally commits one to everything is more contentious. While classical logic might suggest that, actual belief systems aren't perfectly logical. People can compartmentalize or use different logics, so dialetheists aren't forced to accept trivialism. The friend's claim here overreaches, as rational agents aren't logically omniscient. Dialetheists can manage contradictions without collapsing into absurdity.

  Lastly, holistic content preservation. A theory with a contradiction might still retain meaning, as seen in paraconsistent logics. Bohr's model, despite its inconsistency, had empirical content that worked. The friend's dismissal of its explanatory power ignores that inconsistent theories can have useful, non-trivial consequences. This challenges the idea that contradiction always nullifies content.

  The user's deeper needs might include wanting clear, structured arguments to present, showing that the friend's objections rely on assuming classical logic, which isn't the only option. They also need to demonstrate that dialetheism can coherently exist without trivialism and that historical scientific examples like Bohr's model retain explanatory value despite contradictions. Providing a "menu" of counterpoints allows the user to address both philosophical and practical aspects of the debate effectively.
answer: |-
  Here's a precise "menu" dissecting the slogan "from a contradiction, anything follows," tailored to your debate. I'll cover each distinct thesis, its truth status, whether it's platitudinous or contested, and how it applies to your friend's two moves.

  ---

  ### 1. **Syntactic Explosion (Theorems of a Logic)**
     - **Thesis:** In logic *L*, the formula `(P ∧ ¬P) → Q` is a *theorem* for any proposition *Q*.  
     - **Truth/Status:**  
       - **True** in classical logic, intuitionistic logic, and most standard systems.  
       - **False** in paraconsistent logics (e.g., LP, relevance logics).  
     - **Platitude or Contested?**  
       - A substantive claim *about a specific logic*. Classical logic accepts it; dialetheist logics reject it.  
     - **Licenses Friend's Moves?**  
       - **Against dialetheism:** Only if classical logic is presupposed (begging the question). Dialetheists *reject* logics where this is a theorem.  
       - **Against Bohr's model:** No direct application; this is about formal derivability, not scientific explanation.  

  ### 2. **Inferential Explosion (Validity of an Inference Rule)**
     - **Thesis:** The inference rule `P, ¬P ⊢ Q` is *valid* in logic *L* for any *Q*.  
     - **Truth/Status:**  
       - **Valid** in classical semantics (if premises are true, conclusion must be true).  
       - **Invalid** in paraconsistent semantics (e.g., "glutty" models where `P ∧ ¬P` is true but `Q` is false).  
     - **Platitude or Contested?**  
       - Contested. Validity depends on the logic's semantics. Classical logic treats it as platitudinous; dialetheists deny its universal applicability.  
     - **Licenses Friend's Moves?**  
       - **Against dialetheism:** Only if classical validity is assumed. Dialetheists use logics where this rule is invalid.  
       - **Against Bohr's model:** Assumes the model's contradiction *formally entails* all statements, which paraconsistent logics block.  

  ### 3. **Semantic Explosion (Entailment by a Set of Premises)**
     - **Thesis:** A contradictory set of premises *semantically entails* any proposition *Q* (i.e., no model satisfies all premises without satisfying *Q*).  
     - **Truth/Status:**  
       - **True** in classical logic (no model satisfies `P ∧ ¬P`).  
       - **False** in paraconsistent logics (models can satisfy `{P, ¬P}` without satisfying arbitrary *Q*).  
     - **Platitude or Contested?**  
       - Substantive and contested. Classical logic defines entailment via explosion; dialetheists define entailment to avoid it.  
     - **Licenses Friend's Moves?**  
       - **Against dialetheism:** Presupposes classical entailment, which dialetheists reject.  
       - **Against Bohr's model:** Claims the theory entails *all* predictions (even false ones), making success "luck." **Rebuttal:** Bohr's model had restricted scope (e.g., hydrogen atom spectra). Its successful predictions *followed* from its core postulates; contradictions were isolated.  

  ### 4. **Doxastic Commitment (Rational Belief)**
     - **Thesis:** A rational agent who believes `P ∧ ¬P` is *thereby committed* to believing any *Q*.  
     - **Truth/Status:**  
       - **False** as a descriptive claim (humans compartmentalize beliefs).  
       - **Contested** as a normative claim. Classical logicians argue it *should* hold; dialetheists argue rationality requires managing contradictions without collapse.  
     - **Platitude or Contested?**  
       - Highly contested. Assumes logical omniscience and ignores paraconsistent norms of reasoning.  
     - **Licenses Friend's Moves?**  
       - **Against dialetheism:** Assumes dialetheists *must* accept trivialism. **Rebuttal:** Dialetheists can use paraconsistent logic to quarantine contradictions and avoid arbitrary beliefs.  
       - **Against Bohr's model:** Scientists didn't infer arbitrary claims from its contradictions; they used it heuristically.  

  ### 5. **Holistic Content Collapse (Meaningfulness of Theories)**
     - **Thesis:** A theory containing a contradiction has *no content* because it "says everything" and thus explains nothing.  
     - **Truth/Status:**  
       - **False** for scientific theories (e.g., Bohr's model predicted spectral lines *despite* its inconsistency).  
       - **Contested** philosophically. Paraconsistent logics allow inconsistent theories to have non-trivial content.  
     - **Platitude or Contested?**  
       - Substantive and false. Bohr's model had empirical content (e.g., Balmer formula). Contradictions *within a limited scope* need not globalize.  
     - **Licenses Friend's Moves?**  
       - **Against dialetheism:** Assumes content requires consistency. Dialetheists deny this.  
       - **Against Bohr's model:** **Directly targeted, but fails.** The model's predictions were not "luck" but consequences of its *specific* postulates. Contradictions were localized (orbital radiation vs. stability), not global.  

  ---

  ### How This Menu Refutes Your Friend's Moves
  1. **Against Dialetheism ("Collapse into trivialism"):**  
     - Your friend assumes classical logic (theses 1–3) or classical norms of rationality (thesis 4). Dialetheists *reject these assumptions* by adopting paraconsistent logics where explosion fails. Their position isn't self-refuting; it relies on a coherent alternative framework. Thesis 5 is question-begging.  

  2. **Against Bohr's Model ("Explains nothing, success was luck"):**  
     - The model's contradictions do *not* entail all propositions under a paraconsistent reading (theses 2–3). Its predictive successes (e.g., spectral lines) followed deductively from its *non-contradictory* postulates (e.g., quantized angular momentum). The radiation contradiction was a known flaw *within classical electrodynamics*, not a global collapse. Thesis 5 is empirically false—Bohr's model had clear, non-trivial content.  

  ### Key Takeaway for Your Friend
  The slogan "from a contradiction, anything follows" is **not a universal truth** but a *feature of specific logical systems* (like classical logic). Dialetheists and scientists using inconsistent theories operate in frameworks where this principle **does not hold**. Rejecting explosion is not ad hoc; it is motivated by substantive philosophical and empirical considerations (e.g., the Liar Paradox, Bohr's model). Insisting on classical logic in this debate begs the question against dialetheism.
