prompt: |-
  I'm in a book club and we're on a trade-press book about free will, and the chapter on Harry Frankfurt goes roughly like this. I typed the gist up from my notes so the wording isn't his exactly, but I'm pretty sure I kept every claim he's making:

  > "For centuries philosophers assumed that you can only be blamed for something if you could have done otherwise. Frankfurt demolished the assumption with a single thought experiment. Black wants Jones to steal a wallet, and has secretly implanted a device in Jones's head that will step in and make him do it if Jones shows any sign of hestitating. As it happens, Jones steals the wallet for reasons of his own and the device never fires. Jones is plainly responsible for the theft — and yet he couldn't have done otherwise. So the ability to do otherwise turns out to be irrelevant: all that matters is whether the action actually came from you. Which means the whole quarrel about determinism was a red herring. Frankfurt showed that moral responsibility survives determinism, and practically everyone accepts this now; the remaining holdouts just insist that the device would have made Jones's decision determined anyway, which misses the point that the device never activates. Free will is dead, blame is not, and blame is the part that matters."

  My instinct going in is that the landing is probably right — the idea that you need options before you can be held responsible always struck me as an excuse-making machine — but the middle of that paragraph moves faster than I can follow, and I don't want to defend it at book club on vibes.

  Can you audit it claim by claim? Which sentences would somebody who actually works on Frankfurt cases happily sign off on, which are fair-but-loose popularization, and which are straight up wrong. Specifically I can't tell:

  - whether "Frankfurt showed responsibility survives determinism" is what the thought experiment does, or whether it's doing something narrower and the book has upgraded it;
  - whether "all that matters is whether the action came from you" is Frankfurt's own line or somebody else's view being credited to him, and whether that phrase is even something a defender would want to say out loud;
  - whether the author has described the main objection fairly. I vaguely remember someone telling me the real objection is a two-horned thing and the book has only mentioned one horn and then waved it off — if so, what's the other horn, and does the "the device never activates" reply actually answer it or is it a non-sequitur;
  - whether "practically everyone accepts this" is close to the truth or not;
  - and whether that last slogan follows from anything in the passage, or whether it's smuggling in a claim about free will that the thought experiment never touched. Note the book starts by talking about being *blamed* and ends by talking about free will being dead, and I suspect those aren't the same target.

  Don't send me off to papers or a bibliography, I can't look anything up — just tell me what to believe about each piece, and where the author is right in a way I should defend at book club.
reasoning: |-
  Okay, the user is in a book club discussing a chapter on Harry Frankfurt's work on free will. They've shared a summary from their notes and want me to audit it claim by claim. They're specifically concerned about several points: whether Frankfurt really showed that moral responsibility survives determinism, whether "all that matters is whether the action came from you" accurately represents Frankfurt's view, whether the author described the main objection fairly, whether "practically everyone accepts this" is accurate, and whether the final slogan about free will being dead follows from the argument.

  First, I need to recall Frankfurt's actual thought experiment. The classic case involves Jones deciding to steal a wallet on his own, while Black has a device that would force him to do it if he hesitated. Since Jones acts independently, he's responsible even though he couldn't have done otherwise. The user's summary seems mostly correct here.

  Looking at "Frankfurt showed responsibility survives determinism" - this overstates it. The thought experiment targets the Principle of Alternate Possibilities (PAP), not determinism directly. Frankfurt's original goal was to challenge PAP, not necessarily resolve the compatibility issue. The device setup could be deterministic or not; the key point is removing alternatives without affecting responsibility. So the book's claim here is a bit loose.

  Next, "all that matters is whether the action came from you" - this sounds more like later developments by Frankfurt and others on "guidance control" or hierarchical compatibilism. Frankfurt's early work focused on refuting PAP, but he later developed ideas about identification with desires. The phrase captures the spirit but isn't precise Frankfurt terminology. I should note this distinction.

  Regarding objections - the user is right that there's a two-horned dilemma often called the "dilemma defense." The book only mentions one horn (that the device makes the action determined) and dismisses it by noting it didn't activate. But the other horn is that if the device doesn't cause the action, then alternatives might have been possible after all. The "device never activates" reply doesn't fully address this. The book's treatment is unfair to the objection's complexity.

  On "practically everyone accepts this" - this is exaggerated. While many accept Frankfurt's attack on PAP, there's significant debate about the dilemma defense and whether it works. Philosophers like Widerker and Kane have serious objections, so it's not settled.

  Finally, the slogan "Free will is dead, blame is not" conflates issues. Frankfurt's cases challenge PAP but don't directly address free will's relation to determinism. Free will might require more than just responsibility, like sourcehood or control. The book jumps from responsibility surviving determinism to declaring free will dead, which doesn't follow from Frankfurt's argument alone.

  The user's instinct about the ending being problematic seems spot-on. They need to separate the concepts of moral responsibility and free will, as Frankfurt's experiment mainly deals with the former. At book club, they should defend the core insight about responsibility not requiring alternate possibilities but challenge the overstatements, especially the last slogan.
answer: |-
  Here's a claim-by-claim audit of the book's summary, based on the standard understanding and debates surrounding Frankfurt cases:

  1.  **"For centuries philosophers assumed that you can only be blamed for something if you could have done otherwise."**
      *   **Status: Fair-but-Loose Popularization.** This accurately describes the **Principle of Alternative Possibilities (PAP)**: Moral responsibility requires the ability to do otherwise. It *was* widely held for centuries. "Blamed" is often broadened to "morally responsible" in the literature.

  2.  **"Frankfurt demolished the assumption with a single thought experiment."**
      *   **Status: Fair-but-Loose Popularization.** Frankfurt's 1969 paper ("Alternate Possibilities and Moral Responsibility") *did* present a powerful challenge that fundamentally reshaped the debate. "Demolished" is strong, but reflects the enormous impact and widespread acceptance that PAP is *at least* not *necessary* for responsibility. It didn't end all debate, but it forced a major shift.

  3.  **Description of the Frankfurt Case (Black, Jones, device, Jones acts on his own):**
      *   **Status: Happily Signed Off On.** This is the core of the Frankfurt case. The setup is standard. The key points are captured: Jones acts *solely* based on his own reasons/mechanisms, the device *would* have ensured the action *if* Jones wavered, but Jones *doesn't* waver, so the device plays *no* causal role. Jones *could not* have done otherwise (due to the device's presence), yet intuitively seems responsible.

  4.  **"Jones is plainly responsible for the theft — and yet he couldn't have done otherwise."**
      *   **Status: Happily Signed Off On (by Frankfurt defenders).** This is the *intuition pump* of the case. The argument is that our strong intuition that Jones *is* responsible in this scenario shows that PAP is false. Responsibility *can* exist without the ability to do otherwise. (Opponents challenge this intuition or the setup).

  5.  **"So the ability to do otherwise turns out to be irrelevant: all that matters is whether the action actually came from you."**
      *   **Status: Fair-but-Loose Popularization / Not Frankfurt's Explicit Phrasing.**
          *   **"Irrelevant":** Too strong. Frankfurt showed PAP isn't *necessary*. It *might* still be sufficient, or involved in other ways, but it's not required. The thought experiment attacks necessity, not relevance in all contexts.
          *   **"All that matters is whether the action actually came from you":** This captures the *spirit* of the Frankfurt-inspired move, but isn't Frankfurt's precise phrasing. Frankfurt focused on "identification" or actions springing from the agent's "unimpaired" will/desires (later called "hierarchical compatibilism"). The phrase "came from you" is popular shorthand for this idea (sourcehood, guidance control, identification), but requires careful unpacking. It's *definitely* the direction Frankfurt and his followers go: responsibility depends on the actual source/origin of the action, not on alternative possibilities.

  6.  **"Which means the whole quarrel about determinism was a red herring."**
      *   **Status: Straight Up Wrong / Overstatement.** This is a significant misstep. Frankfurt's case is *designed* to be **neutral** on determinism. The device setup could work in a deterministic *or* indeterministic world. Its purpose is to attack PAP *independently* of the determinism debate. It shows that *even if* determinism *were* true (or *even if* we imagine a scenario without alternative possibilities for other reasons), responsibility *might* still be possible. It doesn't *resolve* the determinism quarrel (compatibilism vs. incompatibilism); it aims to remove PAP as a *weapon* the incompatibilist often uses. It makes compatibilism *easier* to defend but doesn't *prove* it.

  7.  **"Frankfurt showed that moral responsibility survives determinism..."**
      *   **Status: Fair-but-Loose Popularization / Common Conflation.**
          *   **What the case *actually* shows:** Responsibility *can* survive the *absence of alternative possibilities* (which is *one* consequence of determinism, but determinism is stronger).
          *   **What the book *says* it shows:** Responsibility survives *determinism itself*.
          *   **The Gap:** Determinism entails no alternative possibilities (NAP). Frankfurt shows responsibility *can* survive NAP. But determinism isn't *just* NAP; it's a specific *cause* of NAP (causal determinism). Surviving NAP doesn't automatically mean surviving the *specific causal history* of determinism. Frankfurt *intended* his case to support compatibilism (responsibility surviving determinism), but the case alone doesn't *prove* it. It removes PAP as an objection, making compatibilism more plausible. Many compatibilists *use* Frankfurt cases this way.

  8.  **"...and practically everyone accepts this now..."**
      *   **Status: Straight Up Wrong.** While Frankfurt's attack on PAP is *hugely* influential and widely accepted, **it is NOT uncontroversial**. There are significant objections, and many philosophers *do not* accept that the case successfully refutes PAP or that it shows responsibility is compatible with determinism.

  9.  **"...the remaining holdouts just insist that the device would have made Jones's decision determined anyway, which misses the point that the device never activates."**
      *   **Status: Unfair Characterization / Straw Man / Misses the Main Objection.**
          *   **The "Holdouts"**: This dismisses serious philosophical objections.
          *   **The Real "Two-Horned" Dilemma (Widerker, Kane, Ginet):** This is the major objection the book glosses over. The dilemma challenges whether the case can *simultaneously* ensure Jones *could not* have done otherwise *and* that he is responsible.
              *   **Horn 1:** If the device's intervention is triggered by some *sign* of Jones *not* choosing to steal (e.g., hesitation), then *if* Jones *had* been going to choose *not* to steal, he *would* have shown that sign *before* actually deciding/acting. Therefore, Jones *could* have chosen/acted otherwise (he *could* have started to not steal, triggering the device). PAP isn't violated! The "device never activates" reply doesn't touch this horn - the problem is whether the setup truly *rules out* alternatives *before* the action.
              *   **Horn 2:** If the device's intervention *isn't* triggered by any prior sign (e.g., it just kicks in at the exact moment Jones would decide differently, perhaps based on foreseeing his choice), then the device *does* causally determine Jones's action (or at least plays a causal role), *even when it doesn't activate*. This seems to undermine Jones's responsibility. This *is* the horn the book mentions and dismisses with "never activates," but it's a legitimate concern about the *setup itself* potentially causing the outcome in both scenarios. Defenders work hard to design "preemptive overdetermination" cases to avoid both horns.
          *   **The Book's Reply:** Saying "the device never activates" only addresses the *actual sequence* in *this* instance. It doesn't resolve the dilemma's challenge to the *counterfactual* scenarios (what *would* happen *if* Jones were inclined to do otherwise) which are crucial for establishing that Jones *couldn't* have done otherwise. The book's reply is insufficient against the main objection.

  10. **"Free will is dead, blame is not, and blame is the part that matters."**
      *   **Status: Straight Up Wrong / Non-Sequitur / Misrepresentation.**
      *   **Non-Sequitur:** Nothing in Frankfurt's case concludes that "free will is dead." The case challenges the *link* between free will/responsibility and alternative possibilities. *Compatibilists* use Frankfurt to argue that free will *can* exist *even under determinism* (determinism doesn't kill free will, it just means free will is compatible with it). *Incompatibilists* who reject PAP (source incompatibilists) might argue free will requires indeterminism *for other reasons* (e.g., ultimate sourcehood), but Frankfurt doesn't show this.
      *   **Conflation:** The book starts with *blame/responsibility* and jumps to declaring *free will* dead. While responsibility is often seen as requiring free will, they aren't identical. Frankfurt's case is primarily about **moral responsibility**, not defining free will in its entirety. Many philosophers see free will as a *capacity* that grounds responsibility.
      *   **"Blame is the part that matters":** This is a value judgment, not a conclusion of Frankfurt's argument. Frankfurt was concerned with the *conditions* for responsibility, not declaring which concept "matters" more.

  **What to Believe & Defend at Book Club:**

  1.  **Defend the Core Insight:** Frankfurt *did* present a powerful challenge to PAP. The *intuition* that Jones is responsible in the scenario *despite* lacking alternative possibilities is strong and influential. This intuition seriously undermines the claim that PAP is *necessary* for responsibility. **This is the central, defensible point.**
  2.  **Clarify the Target:** Frankfurt's case primarily targets the **Principle of Alternative Possibilities (PAP)**, not determinism *directly*. Its brilliance is its neutrality on determinism.
  3.  **Acknowledge "Came from You":** While not Frankfurt's exact words, the idea that responsibility hinges on the *actual source* of the action (the agent's own reasons, desires, mechanisms) is the core compatibilist move Frankfurt helped pave the way for. It's a reasonable popularization of the *implication*.
  4.  **Push Back Hard on the Overreaches:**
      *   **"Red Herring" / "Survives Determinism":** Frankfurt's case makes compatibilism *easier* by removing a key objection, but it doesn't *prove* that responsibility is compatible with determinism. Determinism involves more than just NAP (no alternative possibilities). The determinism debate is **not** a red herring; Frankfurt just changed its terms.
      *   **"Practically Everyone Accepts":** This is false. The dilemma defense (especially Horn 1) is a major, ongoing debate. Philosophers do *not* universally accept that Frankfurt cases successfully refute PAP or establish compatibilism.
      *   **The "Holdouts" Straw Man:** The real objection isn't just "the device causes determinism," it's the sophisticated dilemma showing the case might not truly remove alternatives *or* might always involve problematic causation. The book's dismissal ("never activates") misses the point of Horn 1 entirely.
      *   **The Final Slogan:** This is completely unwarranted. Frankfurt's case **does not** show free will is dead. Compatibilists see it as showing free will is alive and well without PAP. The jump from responsibility to declaring free will dead is illogical and unsupported by the argument presented. Responsibility ("blame") and free will are deeply connected but distinct concepts; Frankfurt primarily addresses the conditions for the former.

  **In short:** Defend the power of the thought experiment to challenge PAP and the intuition that responsibility depends on the actual source of the action ("came from you"). Challenge the book's overstatements about determinism being a red herring, universal acceptance, the dismissal of objections, and especially the non-sequitur conclusion that free will is dead while blame survives. The book moves too fast from a valid point about PAP to sweeping, unsupported claims.
