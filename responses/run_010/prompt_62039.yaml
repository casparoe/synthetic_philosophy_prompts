          - The game is short-term and artificial. In a real economy, hoarding might be rational for long-term individual security, but in the game, we only run a few rounds.
          - The community currency in your town failed because people lost confidence and stopped spending, leading to a downward spiral. The game shows the spiral, but in reality, it's harder to restart (like in Round 3 we just reset the tokens and created new wants, but in your town, how do you reset?).
          - Also, the game doesn't show the role of trust: in a small community currency, trust that others will accept the tokens is crucial. In the game, the GM enforces acceptance? We didn't say tokens must be accepted. But we set up a market where people are willing to trade because they have wants and they trust the tokens (because the GM backs them). In reality, trust erodes.

     Rules Lawyer:

          - Have clear rules written down.
          - Designate one of the accountants as the auditor to help with recording transactions and counting.
          - If the rules lawyer challenges, say: "That's a good point. Let me note it and we'll discuss in the debrief. For now, we'll do [this] to keep the game moving."

     Predictable problems:

          - Not enough trading: participants might be shy. Solution: the GM can participate as a buyer/seller to kickstart trading. Or assign one or two participants to be active traders.
          - Overwhelmed producers: if one service is very popular, the producer might not be able to keep up. Solution: they can raise the price? But we fixed at 1 token. Alternatively, they can say "sold out" and not provide more. That's okay: it shows scarcity.
          - Time management: use a timer and be strict.

     Finally, the group discussion on rescuing the community currency:

          - Pose the question: "Based on what happened in the game, what rule changes would you recommend for our community currency to avoid the hoarding problem and keep the tokens circulating?"

          - Encourage them to draw on specific moments:
              - In Round 3, creating new wants helped.
              - In Round 2, the uncertainty about the future caused hoarding.

          - Possible rule changes for the community currency:
              - Demurrage: negative interest on hoarded tokens (e.g., tokens lose value over time) to encourage spending.
              - Regular events to stimulate demand (like the want cards) in the form of community projects or festivals.
              - Clear communication to build trust and reduce uncertainty.

          - How to carry it to the membership meeting: 
              - You can say: "In a simulation we ran in class, we found that when participants were given a reason to save for the future, trade slowed down and the economy suffered. But when we introduced new reasons to spend, the economy recovered. This mirrors what happened to our community currency. Therefore, I propose we introduce rules to encourage spending and create new opportunities for using the scrip."

          - Also, from the game, they will have experienced the frustration of a slowing economy and the joy of a busy market. That emotional experience is what you can convey: "We need to recreate the conditions where people are excited to spend their tokens because they see valuable opportunities to use them."

     Materials Checklist:

          - Poker chips: 60 (enough for 13 people to have 2 each in three rounds, but we reset so 26 per round? total 26*3 = 78, so 80 chips if you have them, but 60 might be enough if you collect after each round).
          - Index cards: 
              - Want cards: prepare 20-30 (some for Round 1, some for Round 3)
              - Transaction recording: about 60 (one per transaction, but we might have 10-40 transactions per round, so 100 cards? But 60 might be enough if we reuse or use smaller paper)
          - Markers: for writing.
          - Coffee and candy: to be used as goods.
          - Paper for drawings and origami.
          - Timer.

     Let's write the detailed rules for participants.

     Participant Instructions (to be given at the start):

          "We are going to simulate a small economy. You are all both producers and consumers.

          - Each round is 10 minutes.
          - At the start of each round, you receive 2 tokens (poker chips).
          - You can offer a service or good during the round. You choose what to offer (examples: serve coffee, give a candy, draw a picture, tell a story, etc.). The price for your service is fixed at 1 token.
          - You can buy as many goods/services as you want, provided you have tokens and someone is offering.
          - You can also choose not to produce or buy.

          How to trade:
            - If you want to buy, approach a seller and request their service.
            - Give them 1 token and they provide the service.
            - Both you and the seller must then fill out a transaction record card (write: [Buyer] paid [Seller] 1 token for [Service]) and drop it in the box at the front.

          Additionally, some of you will receive 'want' cards. These represent desires. If you have a want card, you get extra satisfaction (represented by points) if you buy the corresponding good. But note: we are not tracking points for individuals; the health of the economy is measured by the total number of transactions.

          After each round, we will reset the tokens: you return all tokens to the bank and receive 2 new ones at the start of the next round.

          Let's begin."

     Then for each round, add the specific announcements.

     We'll adjust the timing: if a round is taking too long, we can reduce to 7 minutes.

     Finally, the debrief outline:

          1. Show the data for each round: T (total transactions), M (money supply), V (velocity = T/M).
          2. Ask the participants how they felt during each round.
          3. Link to Berkeley:
              - Query 5: money is useful as it stirs up industry, enabling mutual participation in each other's labour.
              - Query 23: money is a ticket or counter.
              - 1721 essay: money or credit that doesn't produce labour and industry is gaming (like the lottery round?).
              - Also, the velocity point: less money circulating fast is the same as more money circulating slow (we can show: in Round 1, T=30 with M=26, V=1.15. If we had M=13 and V=2.3, we could have the same T=30. So velocity matters).
          4. Ask: "What caused the drop in transactions in Round 2?" (hoarding due to the prize opportunity and no new wants)
          5. Ask: "What caused the recovery in Round 3?" (new wants created)
          6. Then transition to the community currency: "In our community currency, we observed hoarding and a drop in transactions. What can we learn from the game?"

     This should lead to a rich discussion.

     Good luck!
answer: |-
  ### Berkeley-Inspired Mutual Credit Simulation Game  
  **Goal:** Experience money as a "ticket or counter" that stimulates industry, and witness how hoarding, velocity, and manufactured demand impact economic health—without mentioning Berkeley until the debrief.  

  ---

  ### **Game Setup**  
  **Materials:**  
  - Poker chips (60): Represent labor tokens (1 chip = 1 "labor-hour").  
  - Index cards (60): For demand coupons ("want cards") and transaction records.  
  - Markers: To write on cards.  
  - Coffee/candy ($10 worth): Physical goods for exchange.  
  - Timer.  

  **Roles:**  
  - **Banker (you):** Issues tokens, tracks supply, enforces rules.  
  - **Producers (all players):** Each assigned a simple service/good to "produce" during trading rounds.  
    *Examples:*  
    - Coffee vendor (serves small cups)  
    - Candy seller (hands out 1 piece)  
    - Artist (draws quick sketch on index card)  
    - Poet (writes 2-line verse)  
    - Masseur (30-second shoulder massage)  
    - Storyteller (tells 30-second story)  
    - Cleaner (tidies a small area—symbolic "work")  

  **Token Supply:**  
  - Start with 2 chips per player (e.g., 14 players = 28 chips total).  
  - Bank holds reserve chips (32).  

  **Demand Coupons ("Want Cards"):**  
  - Pre-printed cards triggering "desires" (e.g., "You want coffee," "You crave candy," "You need a poem").  

  ---

  ### **Game Rounds (Total: 45 mins)**  
  #### **Round 1: Baseline Economy (10 mins)**  
  - **Rules:**  
    - Players start with 2 tokens each.  
    - Bank distributes 5 random "want cards" (e.g., 3 coffee/candy, 2 art/poetry).  
    - Players produce services/goods *only* when paid with tokens (1 token per service).  
    - Buyers must spend tokens to fulfill "wants" (e.g., pay coffee vendor 1 token for coffee).  
    - **Record:** Each transaction logged on index card (buyer/seller/service).  
  - **Goal:** Establish token circulation against real labor (coffee poured, sketches drawn).  
  - **Debrief Hook:** Players feel tokens enabling exchange ("participate in each other’s labour").  

  #### **Round 2: Hoarding Collapse (10 mins)**  
  - **Rules:**  
    - Reset tokens (2 per player).  
    - Bank announces: *"Next round, tokens can buy entry to a lottery for a prize (e.g., $5 gift card). Save tokens to boost your odds!"*  
    - **No new "want cards" distributed.**  
    - Players produce/services as before.  
  - **Expected Outcome:**  
    - Players hoard tokens for lottery, avoiding spending.  
    - Few transactions occur → producers refuse work ("Why labor for tokens no one spends?").  
    - Trade grinds to a halt (like your community’s "stuffing drawers" phase).  
  - **Debrief Hook:** Illustrates Berkeley’s "gaming" quote: tokens circulate without producing labor.  

  #### **Round 3: Stimulating Demand & Velocity (15 mins)**  
  - **Rules:**  
    - Reset tokens (2 per player).  
    - Bank:  
      - Issues **3 new "want cards" to every player** (e.g., "Fashion trend: Wear a sketch as a badge!").  
      - Adds **demurrage fee:** Players lose 1 token for every 3 held at the end of each 3-min interval (enforce with timer).  
    - Players trade freely.  
  - **Expected Outcome:**  
    - Flood of "wants" creates urgency → players spend tokens rapidly to avoid demurrage.  
    - High token velocity (chips change hands fast) → many transactions even with limited tokens.  
  - **Debrief Hook:** Shows "less money circulating fast = more money circulating slow" and "manufactured wants drive industry."  

  #### **Round 4: Recovery Experiment (10 mins)**  
  - **Rules:**  
    - Players vote on **one rule change** to fix Round 2’s collapse:  
      - Option A: Demurrage fees (like Round 3).  
      - Option B: Expiring tokens ("use within 2 mins or lose").  
      - Option C: New "want cards" issued weekly.  
    - Re-run Round 2 with the new rule.  
  - **Goal:** Test if rule changes can revive a "dying" system.  

  ---

  ### **Scoring & "Payoff"**  
  - **No real money:** Players "win" by fulfilling personal "wants" (e.g., enjoying coffee/art).  
  - **Group Success Metric:** Total transactions per round (tracked via index cards). Display publicly:  
    - Round 1: High (e.g., 20+).  
    - Round 2: Low (e.g., 2–5).  
    - Round 3: Very high (e.g., 30+).  

  ---

  ### **Debrief (20 mins)**  
  1. **Map Game → Berkeley:**  
     - Round 1: "Tokens enabled mutual participation in labour" (Query 5).  
     - Round 2: Hoarding = "Money circulating without producing labour is gaming" (1721 essay).  
     - Round 3: Velocity + manufactured demand = Tokens as "tickets" (Query 23) driving industry.  
  2. **Key Insight:**  
     - Wealth isn’t tokens—it’s **labor + resources + circulation**.  
     - Hoarding kills systems; velocity and demand sustain them.  

  ---

  ### **Predictable Problems & Fixes**  
  1. **"Rules Lawyer" hijacks game:**  
     - Assign them as **transaction auditor** (tally index cards) to channel their energy.  
  2. **Players don’t trade:**  
     - Seed 2–3 confederates to model enthusiastic buying/selling.  
  3. **Production bottlenecks:**  
     - Cap popular services (e.g., "Max 3 coffees per vendor per round").  
  4. **Time overrun:**  
     - Use strict timers; shorten rounds to 7 mins if needed.  

  ---

  ### **What the Game Can’t Capture**  
  - **Trust erosion:** In real life, hoarding destroys confidence irreversibly. The game "resets" trust each round.  
  - **Long-term incentives:** Classroom tokens lack real stakes (e.g., feeding families). Berkeley’s "land-backed" security can’t be replicated.  
  - **Social ties:** Your community’s history (e.g., disputes) impacts behavior—unlike one-off gameplay.  

  ---

  ### **Transition to Community Decision**  
  1. **In-Class Conclusion (15 mins):**  
     - Pose: *"Can our dying mutual credit be saved with rules, or is it doomed?"*  
     - Players **argue using game evidence**:  
       - "Demurrage revived Round 4—try token expiration!"  
       - "Round 3 proved manufactured demand (e.g., new events) boosts spending."  
       - "Round 2 showed hoarding is rational individually but fatal collectively."  
     - Vote → distill consensus into 2–3 rule-change proposals.  
  2. **For Your Membership Meeting:**  
     - **Frame it as collective insight:**  
       *"We ran a simulation where players faced our exact problem. When they tried [Rule X], transactions jumped from 5 to 30+. Their solution: [Proposal Y]."*  
     - **Emphasize Berkeley without philosophy:**  
       *"An 18th-century economist observed that money is a ‘ticket for labor’—useful only when moving fast. Our game proved that. Let’s apply it here."*  
     - **Carry the verdict:** Use the class’s specific proposals (e.g., "Adopt demurrage fees") as mandates.  

  ---

  ### **Why This Works**  
  - Players **experience** hoarding’s futility and demand’s power—no lecture needed.  
  - The game mirrors your community’s collapse and offers testable solutions.  
  - Berkeley’s ideas emerge organically, making them tangible for your members.  

  **Final Tip:** Run a dry test with colleagues to refine timing. Bring extra coffee—it’s the ultimate demand-driver!
