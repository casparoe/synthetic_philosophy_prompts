prompt: |-
  im deep into a novel with a courtroom thread loosely modelled on Nuremberg — the winners trying the losers' leadership for starting the war, under a charter drafted after everything already happened. My beta reader is a criminal defence lawyer and he keeps telling me the whole retroactivity objection is a cheap shot, because common law courts do the same thing all the time: a precedent handed down in '46 governs conduct from '44, the judge didn't get a statute passed first, and nobody screams ex post facto. So per him my defence counsel's big speech is just theatre and the trial was legitimate law. Before I put that argument in a smart character's mouth I want it audited — what actually maps onto what between a common law judge announcing a rule and a victors' tribunal defining aggressive war as a crime, which disanalogies matter for the point hes making and which are just noise, what the comparison quietly assumes about who had authority over the defendant beforehand, and whether his conclusion survives once all that is on the table. Also give me a better analogy a real lawyer would say out loud in court, if there is one. Exactly five numbered points, a sentence or two each, no intro and no wrap-up.
reasoning: |-
  Okay, the user is deep into writing a novel with a courtroom drama inspired by Nuremberg, where the victors are trying the losers' leadership for starting a war. Their beta reader, a criminal defense lawyer, argues that the retroactivity objection is a cheap shot because common law courts apply new precedents to past conduct all the time. The user wants to audit this argument before putting it in a smart character's mouth. They need exactly five numbered points comparing common law precedent to the Nuremberg Tribunal, highlighting disanalogies, assumptions about authority, and whether the conclusion holds. Also, they want a better courtroom analogy if possible.

  First, I need to break down the key differences between common law precedent and the Nuremberg Charter. Common law evolves gradually; judges interpret existing laws, and new rulings apply to past conduct only if the law was already in place. Nuremberg created a new crime—aggressive war—after the actions occurred, which is more like ex post facto legislation. That's a major disanalogy.

  Next, the source of authority matters. Common law courts operate within an established legal system where defendants are already subject to those laws. At Nuremberg, the Allies imposed new laws on the defeated, who had no prior obligation. This challenges the legitimacy because the defendants weren't under the victors' legal system before the acts.

  Another point is about judicial versus legislative creation. Common law judges refine existing legal principles incrementally. Nuremberg's charter was created by the victors, acting more like legislators than judges, which blurs the separation of powers and makes it seem like victor's justice.

  The scale and nature of the crime are different. Common law deals with individual crimes within a system. Nuremberg prosecuted unprecedented state-level acts like waging aggressive war, which wasn't clearly defined as a crime before. This makes retroactivity more contentious because it's not just applying existing laws but creating new categories.

  For a better analogy, a real lawyer might reference judicial interpretation in international law, like piracy or war crimes evolving through cases. However, even that has limits because aggressive war wasn't established like piracy. The lawyer could argue that international custom already criminalized such acts, but that's debatable. A stronger point might be that the tribunal applied existing treaties or norms, though this is contentious.

  Putting this together, the beta reader's comparison oversimplifies by ignoring the creation of a new crime versus interpreting existing laws. The authority issue is critical—defendants weren't subject to the victors' laws beforehand. The conclusion that Nuremberg was legitimate like common law doesn't hold under these disanalogies. A better analogy might be controversial, but referencing evolving international customs could be used, though it's not perfect. The key is that common law operates within a continuous legal system, while Nuremberg was an ad hoc tribunal imposing new rules retroactively.
answer: |-
  Here are the five points auditing the comparison:

  1.  **Source of Rule vs. Source of Authority:** Common law precedent interprets *existing* legal principles within a continuous legal system binding the defendant. Nuremberg created a *new* substantive crime ("aggressive war") via a charter imposed by victors on the vanquished, lacking pre-existing binding authority over the defendants for *that specific crime*.
  2.  **Judicial Interpretation vs. Legislative Creation:** A common law judge in '46 applying a new interpretation to '44 conduct operates within a known framework (e.g., defining negligence under established tort law). The Nuremberg Charter was an *ad hoc legislative act* by victors defining new crimes *after* the fact, blurring judicial and legislative functions.
  3.  **Pre-Existing Legal Obligation:** Common law defendants are inherently subject to the evolving interpretations of the system they operate within. The Nuremberg defendants' core objection is that they owed *no prior legal obligation* to the victors' newly created tribunal or its novel charge of "crimes against peace" under international law *as then defined*.
  4.  **Scale of Novelty and Sovereignty:** Common law evolution is incremental within a settled system. Nuremberg's retroactive criminalization challenged fundamental notions of state sovereignty and the pre-existing (and ambiguous) state of *international* law on aggressive war, making the retroactivity far more politically and legally contentious.
  5.  **Better Courtroom Analogy:** A real lawyer might argue: "Customary international law, like common law, evolves; just as a court in '46 can recognize that conduct in '44 violated *existing* customary prohibitions (e.g., certain war crimes), this Tribunal applies the *pre-existing* customary principle outlawing wars of aggression, now clearly articulated." (Note: This analogy hinges on disputable claims about pre-1945 customary law).
