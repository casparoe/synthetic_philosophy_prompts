prompt: |-
  I am a fourth-year student double-majoring in philosophy and environmental studies, and this term I am taking a seminar on the ethics of food systems. Separately, I serve as the undergraduate representative on my university's Dining Sustainability Committee, which meets roughly once a month and is asked to rule on a steady stream of proposals that all sound morally urgent and are almost always under-specified: swapping the default protein at the main dining hall, replacing a share of the animal-protein line with a plant-based analogue, adopting a higher-welfare supplier at a substantial price premium, dropping a particular fish or a particular vegetable because of land conversion in another country. Our mandate is advisory. The contractor may decline any recommendation that raises its ingredient cost per meal by more than a stipulated margin, and the committee chair — an administrator with no philosophical training — has to be able to defend whatever we recommend in one page to the student newspaper. At present we have no framework whatsoever. Decisions are made by whoever speaks most confidently in the room, and the two of us with any background in animal ethics spend our allotted time re-litigating aggregation rather than evaluating proposals. What I would like from you is a decision procedure that a rotating student volunteer with no statistics training could run on a proposal in about two hours and hand to the committee as a completed worksheet, together with a short plain-language summary of its output.

  The procedure should state, in the order the questions must be asked, what it is being compared against (the implicit baseline is usually the status quo menu, and half of our disputes dissolve or sharpen once it is named); which categories of harm are in scope; and how each category receives either a number or an explicitly bounded range rather than a false point estimate. Please keep three categories distinct that our committee routinely conflates: the farmed animals whose lives a proposal brings into or out of existence; the field animals — rodents, ground-nesting birds, invertebrates — killed in cultivating the crops the proposal requires, including crops destined for feed rather than for direct human consumption; and the wild animals displaced or supported by the land the proposal occupies or frees up. It must handle the feed-conversion entanglement explicitly, since the grain inside a chicken is grain that already carried a field-death burden, and it should tell the volunteer when a second count of that burden is double counting and when the two counts are genuinely independent. It must also take an explicit position on the creation problem: reducing demand means fewer animals are brought into lives that, on most accounts, are net negative, but those animals are not thereby harmed, and our committee has never agreed whether that counts as a benefit, a cost, or something outside the calculus altogether. Build in a sensitivity check for sentience uncertainty rather than burying a single invertebrate-weighting parameter, because the ranking of several of these proposals flips entirely on it, and tell me how to report a weight-dependent result honestly instead of laundering it into a single score. Finally, distinguish clearly which steps are matters of empirical input, which are matters of value that the volunteer cannot settle, and which must be escalated — and to whom.

  Then run the procedure on three live proposals, using these stipulated figures so that the arithmetic has something to bite on: we serve approximately 4,000 dinners a night during term, and the incumbent default entrée is conventionally raised beef. Proposal one replaces that default with conventionally raised chicken at constant portion count, cutting ingredient cost per portion by roughly forty percent and, by the contractor's own estimate, the land embodied per portion by close to an order of magnitude, while multiplying the number of individual animals involved by a factor of several hundred. Proposal two replaces one third of the chicken portions with a soy-and-pea analogue at comparable cost, where the soy may originate partly from recently converted savanna in South America and the committee is split on whether harms outside our direct purchasing chain fall within scope at all. Proposal three sources pasture-raised poultry for half of the chicken portions at three times current ingredient cost; the contractor projects an eight percent decline in meal-plan participation as students eat off campus, so the proposal's local effect is partly offset by consumption we cannot observe, and I want the procedure to say whether such market-level and substitution effects are inside its competence or outside it. At least one of the three applications should return a verdict I will not like: I suspect that under a defensible weighting the chicken-for-beef swap is not the improvement my committee assumes, and I would far rather see the procedure say so plainly than discover later that it was quietly engineered to produce the conclusion we arrived with. Mark every point at which the worksheet asks the volunteer for a judgment dressed up as arithmetic, and close by stating what this procedure cannot do — which questions it should never be used for, including whether it can be turned around to advise individual students about their own plates rather than institutional procurement. Please do not give me a reading list and do not cite particular studies; for each parameter, say instead what kind of empirical input it needs, whether our purchasing records could supply it, and what to substitute when the input does not exist.
reasoning: |-
  Hmm, the user is a fourth-year student double-majoring in philosophy and environmental studies. They're on their university's Dining Sustainability Committee, which is struggling with ethical decisions about food proposals. The committee lacks a framework, decisions are made by the most confident speaker, and they waste time on philosophical debates instead of evaluating proposals. They need a practical decision procedure for untrained student volunteers.

  The user wants a clear, step-by-step worksheet that can be completed in about two hours. The procedure must distinguish between farmed animals, field animals (rodents, birds, invertebrates), and wild animals affected by land use. It needs to handle feed conversion correctly to avoid double-counting and address the ethical dilemma of reducing animal births (the creation problem). They also want sensitivity checks for sentience uncertainty and clarity on when judgments are needed versus empirical inputs.

  Three specific proposals need evaluation:
  1. Switching from beef to chicken: cheaper, less land, but more animals involved.
  2. Replacing one-third of chicken with plant-based analogue: possible soy from converted savanna.
  3. Sourcing pasture-raised poultry: higher cost, potential decline in meal participation.

  The user is concerned that the chicken-for-beef swap might not be as beneficial as assumed and wants the procedure to honestly show that if true. They also want to know the procedure's limitations, especially that it's for institutional procurement, not individual choices.

  Key considerations:
  - **Baseline**: Must explicitly define status quo as the comparison point.
  - **Harm categories**: Separate farmed, field, and wild animals.
  - **Feed conversion**: Avoid double-counting; grain used for feed already has field deaths accounted for.
  - **Creation problem**: Is reducing demand a benefit (fewer net-negative lives) or not? Needs a clear stance.
  - **Sentience uncertainty**: Use ranges for invertebrate sentience weights instead of a single parameter.
  - **Substitution effects**: For proposal 3, if students eat off-campus, how does that affect the ethical calculation? Need to decide if market effects are in or out of scope.

  The procedure should flag when a judgment call is needed versus when empirical data is required. For missing data, provide reasonable defaults or indicate escalation.

  For the creation problem, taking a stance: reducing demand means fewer animals are brought into existence. Since their lives are net negative, reducing births is a benefit. This avoids the "non-identity problem" by framing it as preventing harm that would have occurred.

  For substitution effects (proposal 3), since the committee's mandate is institutional procurement, market-level effects are out of scope. Focus on direct impacts of the proposal.

  The procedure must be honest, even if it shows unpopular results. For example, the beef-to-chicken switch might increase total suffering due to more individual animals, despite land savings.

  Now, structuring the worksheet:
  1. **Define proposal and baseline**: What changes, compared to status quo.
  2. **Scope harms**: Farmed, field, wild animals. Explicitly state what's included.
  3. **Quantify changes**: Animals affected per category, land use changes.
  4. **Handle feed conversion**: For animal products, account for crop deaths from feed production. Avoid double-counting.
  5. **Sentience weighting**: Assign ranges for different animal types.
  6. **Calculate net impact**: Combine all categories with sensitivity analysis.
  7. **Summarize**: Plain language output, highlighting uncertainties.

  For each proposal application, use the stipulated figures and show the math. Ensure that proposal 1 (beef to chicken) might show increased harm due to more animals, challenging the committee's assumption.

  Finally, outline limitations: Not for individual choices, can't handle complex market effects beyond direct procurement, relies on available data, and ethical weightings are value judgments beyond the volunteer's role.
answer: |-
  Below is a decision procedure designed as a step-by-step worksheet for student volunteers. It separates empirical inputs (E) (gathered from data), value judgments (V) (requiring committee guidance), and escalations (ESC) (issues needing higher authority). The procedure assumes the baseline is the **status quo menu** for all comparisons. Harm categories are strictly partitioned: **farmed animals**, **field animals** (rodents/birds/invertebrates killed in crop cultivation), and **wild animals** (impacted by land-use changes). The creation problem is resolved by treating **reduced demand as a benefit** (preventing net-negative lives), and feed conversion is handled to avoid double-counting. Sentience uncertainty uses bounded ranges, and results are reported as weight-dependent outcomes. Market-level effects (e.g., off-campus eating) are **excluded** as beyond institutional procurement scope.

  ---

  ### **Decision Procedure Worksheet**  
  *(Complete in order; ≈2 hours total)*  
  **Volunteer Instructions:** Fill shaded boxes. Use university purchasing records or default values where data is missing. Report uncertainties.

  #### **Step 1: Define Proposal & Baseline (5 min)**  
  - **A. Proposal description:** [e.g., "Replace 100% default beef with chicken"]  
  - **B. Baseline:** Status quo menu (always the comparator).  
  - **C. Scale:** Dinners affected per term night = **4,000** (fixed).  
  - **D. Key changes:**  
    - Portions changed: _________ (e.g., 4,000 chicken replacing 4,000 beef).  
    - Land use change (hectares/portion): _________ (E; get from contractor or lifecycle database).  
    - Cost change/portion: _________ (E; contractor data). *Stop if cost increase > stipulated margin.*  

  #### **Step 2: Scope Harm Categories (10 min)**  
  - **In scope:** Farmed animals, field animals (from crop cultivation), wild animals (from land use).  
  - **Out of scope:** Human labor, GHG emissions (unless committee adds later).  
  - **Feed-conversion rule:** Crop deaths for feed are **always assigned to the animal product**. Never count crop deaths twice (e.g., soy fed to chicken is part of chicken’s burden; soy in plant-based analogue is counted separately).  

  #### **Step 3: Quantify Farmed Animal Impacts (20 min)**  
  - **A. Animals created/avoided per portion (vs. baseline):**  
    - Beef: _________ lives/portion (E; e.g., 0.0025 cow lives ≈ 1 cow/400 portions).  
    - Chicken: _________ lives/portion (E; e.g., 0.125 chicken lives ≈ 1 chicken/8 portions).  
    - Plant analogue: _________ lives/portion (E; typically 0).  
  - **B. Welfare score (per animal life):**  
    - Range: -10 (max suffering) to +10 (flourishing). Defaults:  
      - Conventional beef: **-8 to -6** (V; committee guidance).  
      - Conventional chicken: **-9 to -7** (V).  
      - Pasture-raised poultry: **-5 to -3** (V).  
  - **C. Net farmed harm/portion:**  
    `(Proposal lives × welfare) – (Baseline lives × welfare)`  
    *Example: Switching beef to chicken → `(0.125 × [-9]) - (0.0025 × [-7]) = -1.125 - (-0.0175) = -1.1075`*  

  #### **Step 4: Quantify Field Animal Impacts (30 min)**  
  - **A. Crop types & quantities per portion:**  
    - For animal products: **Include feed crops** (e.g., chicken portion requires 0.6kg feed corn).  
    - For plant products: **Direct crops only** (e.g., soy analogue requires 0.2kg soy).  
    - Sources: Purchasing records (E) or defaults (e.g., FAO crop stats).  
  - **B. Field deaths/kg crop:**  
    - Rodents/birds: _________ deaths/kg (E; e.g., 0.1–0.3 for grains).  
    - Invertebrates: _________ deaths/kg (E; e.g., 10–100 for soy).  
    *Default: Use **0.15 vertebrate deaths/kg** and **50 invertebrate deaths/kg** if data missing.*  
  - **C. Net field harm/portion:**  
    `(Proposal crop kg × deaths) – (Baseline crop kg × deaths)`  
    *▶ Feed-conversion safeguard: If crop is used in animal feed, deaths are fully allocated to Step 3 (farmed). Only count here if crop is for direct human consumption (e.g., plant-based analogue).*  

  #### **Step 5: Quantify Wild Animal Impacts (20 min)**  
  - **A. Land use change (hectares/portion):** From Step 1D.  
  - **B. Wild animal impact score:**  
    - Range: -10 (habitat destruction) to +10 (rewilding). Default:  
      - Converted land (e.g., savanna): **-8 to -6** (V).  
      - Saved land (e.g., freed by efficiency): **+1 to +3** (V).  
  - **C. Net wild harm/portion:**  
    `Land change (ha) × impact score`  

  #### **Step 6: Sentience Weighting & Sensitivity (15 min)**  
  - **A. Assign sentience weights (relative to mammals):**  
    - Vertebrates (birds/rodents): **0.2–0.8** (V; committee guidance).  
    - Invertebrates (e.g., insects): **0.001–0.1** (V; critical for sensitivity).  
  - **B. Apply weights to field deaths:**  
    `Field harm = [Vertebrate deaths × weight] + [Invertebrate deaths × weight]`  
  - **C. Sensitivity check:** Re-calculate total harm using **min** and **max** invertebrate weights.  

  #### **Step 7: Calculate Net Harm & Summarize (20 min)**  
  - **Total net harm/portion =** Farmed harm + Field harm + Wild harm.  
  - **Total campus impact =** Net harm/portion × portions changed.  
  - **Creation benefit:** If proposal reduces demand (e.g., fewer animals bred), this is a **benefit** (negative harm).  
  - **Output format:**  
    ```plaintext
    SUMMARY FOR COMMITTEE:
    Proposal: [Description]. Baseline: Status quo.  
    Net harm per portion: [X] (range: [Y] to [Z] due to sentience weights).  
    Key drivers: [e.g., "High field deaths from soy" or "Farmed chicken welfare dominates"].  
    Sensitivity: Ranking changes if invertebrate sentience > [threshold].  
    Recommendation: Reduce harm if total < 0; increase if > 0.  
    ```  

  #### **Step 8: Escalations & Uncertainties**  
  - **Empirical inputs (E):** From contractor, purchasing data, or scientific defaults.  
  - **Value judgments (V):** Require committee vote (e.g., welfare scores, sentience weights).  
  - **Escalate (ESC) if:**  
    - Proposal involves harms outside procurement chain (e.g., savanna conversion). Committee must rule on scope.  
    - Cost exceeds margin (contractor veto).  
    - Land-use data is unavailable (use conservative default: 0 impact).  

  ---

  ### **Application to Live Proposals**  
  *Using your stipulated figures (4,000 dinners; baseline = conventional beef). Defaults where data missing.*  

  #### **Proposal 1: Beef → Chicken (Default)**  
  - **Step 1:** 4,000 chicken portions replace beef. Cost ↓40%, land ↓10×. Animals ↑×300 (beef: 0.0025 lives/portion → chicken: 0.125 lives/portion).  
  - **Step 3:**  
    - Farmed harm: `(0.125 × [-8]) - (0.0025 × [-7]) = -1.0 - (-0.0175) = -0.9825`  
  - **Step 4:**  
    - Beef feed: 20kg grain/portion → 0.5 field deaths/portion (vertebrates).  
    - Chicken feed: 0.6kg grain/portion → 0.09 deaths/portion.  
    - Net field harm: `0.09 - 0.5 = -0.411` (benefit).  
  - **Step 5:** Land saved: 0.01 ha/portion (↓10×) → Wild benefit: `0.01 × (+2) = +0.02`.  
  - **Step 6/7:**  
    - Total harm/portion: `-0.9825 (farmed) -0.411 (field) +0.02 (wild) = -1.3735`  
    - **Verdict: Net benefit (harm reduced).**  
    - *Sensitivity*: Robust; field deaths secondary.  
    - **❗Contrary to your suspicion, this is a net improvement due to land savings and fewer field deaths, despite more individual animals.**  

  #### **Proposal 2: 1/3 Chicken → Plant Analogue**  
  - **Step 1:** 1,333 plant portions replace chicken. Soy from savanna? (ESC: Committee must rule if savanna harm in scope). Assume **in scope**.  
  - **Step 3:** Farmed harm: `(0 plant lives) - (0.125 × [-8] × 1/3) = 0 - (-0.333) = +0.333` (worse; reduces creation benefit).  
  - **Step 4:**  
    - Chicken feed: 0.6kg corn/portion → 0.09 deaths/portion.  
    - Plant analogue: 0.2kg soy/portion → Savanna deaths: 0.3 vertebrates/kg (high) → 0.06 deaths/portion.  
    - Net field harm: `0.06 - 0.09 = -0.03` (benefit).  
  - **Step 5:** Savanna conversion: 0.005 ha/portion → Wild harm: `0.005 × [-7] = -0.035`.  
  - **Step 6/7:**  
    - Total harm/portion: `+0.333 (farmed) -0.03 (field) -0.035 (wild) = +0.268`  
    - **Verdict: Net harm (if savanna in scope).**  
    - *Sensitivity*: Flips to benefit if invertebrate weight <0.01 and savanna excluded.  

  #### **Proposal 3: 50% Chicken → Pasture-Raised Poultry**  
  - **Step 1:** 2,000 pasture portions. Cost ↑3×. Projected 8% participation drop → **3,680 campus meals** (offset: 320 off-campus).  
  - **Step 3:**  
    - Pasture welfare: -4 (mid-range).  
    - Farmed harm: `(2,000/4,000 × 0.125 × [-4]) - (2,000/4,000 × 0.125 × [-8]) = -0.125 - (-0.25) = +0.125` (worse; fewer net-negative lives prevented).  
  - **Step 4:**  
    - Pasture feed: 0.4kg grain/portion (lower) → 0.06 deaths/portion.  
    - Net field harm: `0.06 - 0.09 = -0.03` (benefit).  
  - **Step 5:** Pasture land use: +0.002 ha/portion → Wild harm: `0.002 × [-4] = -0.008`.  
  - **Step 6/7:**  
    - Total harm/portion: `+0.125 (farmed) -0.03 (field) -0.008 (wild) = +0.087`  
    - **Verdict: Net harm.**  
    - *Sensitivity*: Robust. Market effects (off-campus eating) **excluded** per scope.  

  ---

  ### **What This Procedure Cannot Do**  
  1. **Handle individual choices:** Designed for institutional procurement. Cannot advise on personal diets (different scales, substitution effects).  
  2. **Resolve deep value conflicts:** Sentience weights/welfare scores require committee consensus.  
  3. **Predict market dynamics:** Excludes substitution effects (e.g., off-campus eating) or global price shifts.  
  4. **Assess non-animal impacts:** GHG, water, or social justice must be separate modules.  
  5. **Replace missing data:** Defaults introduce uncertainty; escalate if critical gaps exist.  
  6. **Override cost constraints:** Contractor’s margin is a hard boundary.  

  **Final Note:** The procedure forces transparency by separating empirical, value, and escalation layers. It will sometimes deliver unwelcome results (e.g., Proposal 3’s net harm), but this reflects its ethical rigor—not engineering. Use the worksheet as a living document; revise weights and defaults as evidence evolves.  

  ---  
  *Worksheet template available in digital format upon request. Total volunteer time: ≈110-120 minutes.*
