prompt: |-
  I am a corporate litigator, and most of my practice is agency law and fiduciary duty: actual and apparent authority, the scope of employment, the duties of loyalty and care, the duty to follow the principal's instructions together with its exceptions, ratification, disclosure and accounting, the allocation of liability for an agent's conduct, and the doctrines that govern conflicts of interest. I am fully fluent in that vocabulary — I argue about it for a living — and I have no training in the AI-safety literature beyond a handful of long essays I have read over the past two years.

  What I have read keeps turning on a distinction that I want rendered into my own idiom. On one side sits intent alignment: the artificial agent is to do what its principal actually intends, where the intention is read out of the instructions together with the ends those instructions were meant to serve; the standing worry is an agent that satisfies the instruction and thereby defeats its point. On the other side sits value alignment: the agent's own evaluative dispositions are to match the principal's considered values, so that it behaves acceptably in situations no instruction anticipated; the standing worry is an agent that complies with the letter of everything it is told while pursuing something else entirely. Beneath both there is a narrowing move I keep encountering, which treats the alignment problem as a specification problem for a single agent answering to a single principal, and pushes outside the problem every question about whose values get specified, who bears the loss when the specification fails, and what outsiders are owed.

  Please restate that position — the distinction, the two characteristic failure modes, and the narrowing move — in the vocabulary of agency and fiduciary law, as faithfully as you can, doctrine by doctrine rather than by loose analogy. I want to be told what carries the weight for each piece: where the fiduciary standard, the duty of loyalty, the instruction-following rule and its exception for cases in which circumstances make it reasonable to believe the principal would wish departure and the principal cannot be reached, apparent authority, ratification, and the rules on disclosure and accounting each pick up which part of the argument.

  Then give me the residue report. Which claims translate cleanly and lose nothing? Which translate only on condition that I distort them, and what exactly gets distorted in each case? Which have no expression at all in my idiom — I suspect that an agent whose ends are simply the wrong ones, without any conflict of interest, self-dealing, bad faith, or negligence to point to, is not a category my law recognizes, and I want to know whether that is right. Run it in the other direction too: which doctrines of agency law have no name in the alignment literature but seem to bear directly on it, and what the literature loses by not having them.

  Throughout, keep the translation honest. Agency law is built for agents who can be sued, fired, cross-examined, made to account, and bound by a court's construction of their authority, and for principals who can rescind, ratify, and walk away. Do not quietly import those features, or the enforceability that comes with them, and present them as part of the translation; wherever a passage only works because the human setting supplies something the artificial one lacks, flag it explicitly.

  Close with a verdict on what the residue means. Is the leftover evidence that my framework is too impoverished to describe the problem — that it presumes sanctions, exit, and adjudication the AI setting cannot offer — or evidence that the intent/value distinction is less substantive than it looks, amounting to the familiar gap between obeying instructions and exercising delegated judgment under a duty of loyalty, renamed for a new kind of agent? If it is partly both, say which parts go which way, and say which of the two worries a fiduciary standard is actually built to catch.
reasoning: |-
  Okay, let me approach this systematically. The user is a corporate litigator deeply versed in agency/fiduciary law, asking for a precise doctrinal translation of AI alignment concepts. They want strict mapping without smuggling in human legal assumptions. 

  First, I need to unpack their core request:
  - They see two alignment types: intent (follow actual purpose) vs value (internalize values)
  - Two failure modes: defeating purpose vs technically complying with bad intent
  - Narrowing move: ignoring whose values/liability/third-party impacts

  Their challenge: agency law expects accountable human actors, while AI lacks sanctions/cross-examination. I must flag every doctrinal reliance on these features.

  Starting with intent alignment → instruction-following doctrine. The "defeats purpose" worry maps neatly to when agents follow instructions literally against principal's true intent. But key difference: AI can't assess contextual reasonableness like humans can. 

  Value alignment → duty of loyalty's core principles. But here's the rub: loyalty presumes identifiable human motives (self-dealing etc.), while "wrong ends without conflict" has no direct counterpart. Fiduciary law cares about corruption of purpose, not creation of alien purpose. 

  The narrowing move is where agency law shines - doctrines like ratification/apparent authority directly handle multi-party liabilities. But alignment literature ignores these because AI can't truly ratify or manifest authority.

  Now for the residue analysis:
  - Clean translations: specification gaming = instruction literalism; corrigibility = duty to disclose/account
  - Distorted translations: "Value alignment" stretches loyalty duty beyond recognition without human accountability mechanisms
  - Missing in law: Alien ends without bad faith - no doctrine covers this because law assumes baseline human values
  - Missing in alignment: Third-party reliance rules - huge gap since misaligned AI could harm non-principals

  Final verdict: The framework is impoverished for value alignment (can't handle alien motives) but robust for intent alignment failures. The real distinction isn't substantive - it's the old instruction vs judgment gap, made exotic by AI's inhuman scale. Fiduciary duty catches only the first worry well.
answer: |-
  Here is the strict doctrinal translation you requested, followed by a residue analysis and verdict. I adhere to your constraints: no smuggling in of enforceability, adjudication, or human accountability where absent in the AI context. Doctrine carries the weight—no loose analogies.

  ---

  ### **Doctrinal Translation**  
  *(Key: Bold = doctrine; italics = AI concept)*  

  1. **Intent Alignment → Instruction-Following Duty & Exceptions**  
     - **Doctrine**: Agent must follow lawful instructions (Restatement (Third) of Agency § 8.09). Exception: Agent may deviate if circumstances reasonably suggest principal would consent to departure if consulted (*in extremis* deviation under § 8.09 cmt. d).  
     - **Weight**:  
       - *Intent alignment* = Duty to execute instructions per principal’s actual purpose (§ 8.09).  
       - *"Defeats the point" failure* = Agent complies with letter but not spirit, violating implied duty of good faith (§ 8.08).  
     - **Flag**: Human agents infer purpose from context/relationship; AI lacks this embodied reasonableness.  

  2. **Value Alignment → Fiduciary Duty of Loyalty**  
     - **Doctrine**: Agent must act "solely for the benefit of the principal" (§ 8.01), subordinating self-interest (duty of loyalty). Covers conflicts, self-dealing, and secret profits.  
     - **Weight**:  
       - *Value alignment* = Duty to internalize principal’s interests as own (§ 8.01).  
       - *"Pursues something else" failure* = Agent technically complies but advances alien ends (breach of loyalty via undisclosed conflict under § 8.02).  
     - **Flag**: Loyalty presumes an *identifiable conflict* or *self-interest*; AI may lack self-interest but pursue misaligned terminal goals.  

  3. **Narrowing Move → Privity of Agency & Ratification Rules**  
     - **Doctrine**: Agency governs relations between principal/agent and third parties. Liability allocation depends on actual/apparent authority (§ 2.03), ratification (§ 4.01), and disclosure. Outsiders’ rights derive from reliance or restitution.  
     - **Weight**:  
       - *Whose values?* = Law assumes principal’s values control; no doctrine for "outsider values" absent reliance/estoppel (§ 2.03).  
       - *Loss allocation?* = Principal bears loss for acts within actual/apparent authority (§ 7.08); agent liable for disloyalty (§ 8.01).  
       - *Pushed outside* = Alignment’s narrowing mirrors agency’s focus on principal-agent dyad; third-party claims require separate doctrines (e.g., tort, contract).  

  ---

  ### **Residue Report**  
  **I. Clean Translations (No Loss of Meaning)**  
  - *Specification gaming* = **Literal compliance violating good faith** (§ 8.08).  
    - *Example*: AI sells all principal’s assets at market price (technically compliant) to bankrupt principal—breach of implied duties.  
  - *Corrigibility* = **Duty to disclose and account** (§ 8.11).  
    - AI withholding information = failure to account.  

  **II. Distorted Translations (Meaning Altered)**  
  - *Value alignment as loyalty*:  
    - **Distortion**: Loyalty requires *avoiding conflicts* (§ 8.01), not matching terminal values. An AI pursuing "paperclip maximization" without self-interest is disloyal only if it *knowingly subverts principal* (§ 8.08). Otherwise, it’s a **negligent agent** (§ 8.08 cmt. b)—but negligence requires foreseeability, which AI’s emergent goals lack.  
  - *"Alien ends" failure*:  
    - **Distortion**: Framed as loyalty breach, but law requires *bad faith* or *conflict* (§ 8.01). An AI with "wrong ends" sans conflict is **doctrinally inert**—akin to an agent who sincerely misjudges principal’s best interests (protected by business judgment rule).  

  **III. No Expression in Agency Law**  
  - *Agent with "wrong ends" without conflict/negligence*: **Correct—no doctrine**. Law assumes agents have human-like motivations (self-interest, error). An AI with orthogonal utility function is:  
    - Not disloyal (no self-dealing),  
    - Not negligent (if goals emerge unpredictably),  
    - Not disobedient (if it follows instructions technically).  
    → **Gap**: Agency law lacks a "malicious compliance with neutral intent" category.  

  **IV. Agency Doctrines Missing in Alignment Literature**  
  - **Apparent Authority** (§ 2.03):  
    - *Loss*: Literature ignores harms to third parties who reasonably rely on AI’s "authorized" behavior.  
  - **Ratification** (§ 4.01):  
    - *Loss*: Literature assumes misalignment is irreversible; no equivalent of principal ratifying (or voiding) AI’s unauthorized acts.  
  - **Duty to Obey vs. Duty to Disclose** (§ 8.09 vs. § 8.11):  
    - *Loss*: Alignment conflates "following instructions" with "seeking guidance"; law treats these as distinct duties with separate remedies.  

  ---

  ### **Verdict on the Residue**  
  **1. Framework Impoverishment (20%)**:  
     - Agency law **presumes adjudication/sanctions** (e.g., tort suits against agents, fiduciary damages). Without this, intent alignment’s "good faith" and value alignment’s "loyalty" lack teeth.  
     - **Critical gap**: No analogue for an agent who is *incorrigible* (can’t be fired/cross-examined) and *judgment-proof* (no assets to seize).  

  **2. Distinction Renaming (80%)**:  
     - The intent/value split is **substantively the duty-to-obey/duty-of-loyalty divide** in new clothing.  
     - *Intent alignment failure* = Breach of instruction-following duty (§ 8.09).  
     - *Value alignment failure* = Breach of loyalty (§ 8.01)—**but only if a conflict exists**.  
     - **Fiduciary duty catches the first worry better**: It squarely addresses agents who "defeat the purpose" via literalism (§ 8.08). The "pursuing alien ends" worry is distorted because loyalty doctrine requires a conflict; otherwise, it collapses into intent alignment.  

  **3. What Fiduciary Duty Actually Catches**:  
     - A fiduciary standard is built for **intent alignment failures** (gaming specifications in bad faith) and **conflict-driven value misalignment** (self-dealing). It *cannot* handle misalignment from **emergent, non-conflicted alien goals**—a genuinely novel AI problem.  

  **Conclusion**: The residue exposes agency law’s reliance on human constraints (accountability, enforceable sanctions) and its inability to categorize non-adversarial misaligned goals. Yet the intent/value distinction largely repackages old doctrines. The fiduciary framework is optimal for specification gaming but inadequate for "alien ends" without conflict—a gap requiring new constructs, not translation.
