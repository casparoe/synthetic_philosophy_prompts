   The phenomenon: An agent has a credal set such that their belief in a hypothesis is represented by a range [L, U].
   After observing evidence, which itself comes from an experiment with imprecisely known reliability (so the likelihood is also represented by a set),
   the posterior range becomes [L', U'] and it holds that L' <= L and U' >= U (and strictly, the range is wider) for every possible outcome.

   We need a concrete example. Let us consider:
   Hypothesis H: a coin is biased towards heads (so we are interested in the probability of heads, but the hypothesis might be that the true heads probability is above 0.5).

   However, for simplicity in dilation, a classic example is about a hypothesis H and an experiment that can yield two outcomes: E or not E.

   Example (inspired by the classic dilation example by Seidenfeld and Wasserman, 1993):
     Consider a hypothesis H: the coin is fair (or more generally, we can take H: the true probability of heads is 0.5).
     We have an experiment: we flip the coin and observe heads (E) or tails (E').

     But the twist: the coin might be flipped by a machine that is not perfectly reliable. The reliability of the machine is only known to be in [0.6, 0.9].
     That is, if the machine is reliable, it reports the true outcome; but if it isn't, it might report the opposite.

     We model the likelihood of observing E (heads) given H and the reliability parameter r (which is the probability the machine reports correctly) as:
       P(E|H, r) = r * P(heads|H) + (1-r) * P(tails|H) 
                  But note: if H is "the coin is fair", then P(heads|H)=0.5 and P(tails|H)=0.5.
