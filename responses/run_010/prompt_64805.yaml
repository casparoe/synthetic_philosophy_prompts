  ### Concrete Example & Verification  
  **Hypothesis (H):** A randomly selected urn is Urn A (known: 5 red, 5 white balls), not Urn B (unknown red count: 0 to 10).  
  **Prior range for P(H):** [0.5, 0.5] (since urns chosen uniformly).  
  **Experiment:** Draw one ball. *Outcome possibilities: Red (E₁) or White (E₂)*.  
  **Imprecise likelihood:**  
  - If Urn B has *r* red balls:  
    - P(E₁|¬H, r) = *r*/10, P(E₂|¬H, r) = 1 - *r*/10.  
  - P(E₁|H) = P(E₂|H) = 0.5 (Urn A fixed).  

  **Posterior range for P(H|E):**  
  - For **E₁ (red)**:  
    - P(H|E₁) = [0.5 × 0.5] / [0.5 × 0.5 + 0.5 × P(E₁|¬H, r)] = 1 / [1 + 0.2r]  
    - *r* ∈ {0,1,...,10} → P(H|E₁) ∈ [1/(1+0.2×10), 1/(1+0.2×0)] = [**1/3, 1**].  
  - For **E₂ (white)**:  
    - P(H|E₂) = [0.5 × 0.5] / [0.5 × 0.5 + 0.5 × P(E₂|¬H, r)] = 1 / [1 + 0.2(10−r)]  
    - *r* ∈ {0,1,...,10} → P(H|E₂) ∈ [1/(1+0.2×10), 1/(1+0.2×0)] = [**1/3, 1**].  

  **Dilation:** Prior [0.5, 0.5] → Posterior [1/3, 1] for *both* outcomes.  
  **Practical cost:** An agent with posterior range [1/3, 1] will buy a bet on H only at price ≤1/3 and sell only at ≥1. At price *p* = 0.5 (inside [1/3,1]), they neither buy nor sell—leaving money "on the table."  

  **Verification by specialist:**  
  - Recognizes Walley’s urns (1991, §6.5.4).  
  - Confirms: Prior vacuous for Urn B → dilation on sampling.  
  - Posterior interval strictly contains prior, regardless of outcome.  

