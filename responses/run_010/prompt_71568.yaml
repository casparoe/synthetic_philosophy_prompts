  - "Conservatism factors" that ironically magnify the problem 

  Biggest risk is slipping into overt satire. Every phrase must pass as legitimate procedural language. When discussing whether crushing insects is worse than natural deaths, it should read like a technical memo debating landfill vs incinerator emissions. 

  The exclusion list item about population reduction will encapsulate everything: by the registry's own logic, extermination could be the optimal "suffering reduction" strategy, so they must ban it to avoid moral catastrophe. Stated dryly as a compliance issue. 

