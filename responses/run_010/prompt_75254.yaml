answer: |-
  Here’s a printable decision tree designed to map clinicians' implicit disease concepts through concrete cases. British English throughout, with branch labels clarifying the philosophical split at each node. **Answers are cumulative** – follow the path based on "yes/no" responses.

  ---

  ### **Decision Tree: What Concept of "Disease" Do You *Actually* Apply?**

  **Case 1: A 34-year-old woman tests positive for a genetic variant giving her an 80% lifetime risk of breast cancer. She has no symptoms or functional impairment today.**  
  *Does she currently have a disease?*  
  - **Yes** → Branch: *High statistical risk alone suffices for disease status*  
  - **No** → Branch: *Current dysfunction/harm required*  

  **Case 2: A competitive freediver has a spleen 3x larger than average and a resting heart rate of 28 bpm – extreme adaptations improving her performance.**  
  *Is this a disease?*  
  - **Yes** → Branch: *Extreme statistical deviance is decisive*  
  - **No** → Branch: *Function/harm overrides deviance*  

  **Case 3: A sound engineer’s audiogram shows hearing within normal population limits, but he can no longer detect subtle distortions critical to his job.**  
  *Is this a hearing disease?*  
  - **Yes** → Branch: *Role-specific function defines disease*  
  - **No** → Branch: *Species-typical function defines disease*  

  **Case 4: A man born with one kidney lives normally with no expected complications.**  
  *Is this a disease?*  
  - **Yes** → Branch: *Anatomical deviance from species norm suffices*  
  - **No** → Branch: *Functional adequacy overrides anatomy*  

  **Case 5: A woman experiences intense sadness 18 months after her child’s death, impairing her work and relationships. She values her grief as "keeping the connection alive" and rejects treatment.**  
  *Is this a mental disorder?*  
  - **Yes** → Branch: *Harm judged third-person (clinician/society)*  
  - **No** → Branch: *Harm judged first-person (patient’s values)*  

  **Case 6: A teenager with high-functioning autism (minimal distress, embraces neurodiversity) struggles in loud, chaotic classrooms but thrives in structured environments.**  
  *Is their autism a disease?*  
  - **Yes** → Branch: *Dysfunction internal to person*  
  - **No** → Branch: *Dysfunction as person-environment mismatch*  

  **Case 7: Cholera in Victorian London. A hydrated aristocrat has mild diarrhoea; a dehydrated slum-dweller dies.**  
  *Is the disease status identical in both?*  
  - **Yes** → Branch: *Disease concept unified (biological basis)*  
  - **No** → Branch: *Disease concept splits (incorporates social context)*  

  **Case 8: A carrier of drug-resistant TB has no symptoms but poses infection risks.**  
  *Is this carrier state a disease?*  
  - **Yes** → Branch: *Harm to others suffices*  
  - **No** → Branch: *Harm to self required*  

  **Case 9: Ageing. An 85-year-old has reduced cardiac output (normal for age) causing fatigue.**  
  *Is this heart disease?*  
  - **Yes** → Branch: *Reference class = species-typical (all ages)*  
  - **No** → Branch: *Reference class = age-relative*  

  **Case 10: Homosexuality was classified as a mental disorder until 1973.**  
  *Was this ever *correctly* classified as a disease?*  
  - **Yes** → Branch: *Disease ascription is value-neutral/discovery*  
  - **No** → Branch: *Disease ascription is value-laden/constructed*  

  ---

  ### **Logical Space & Positions**  
  *(Combinations marked 🔲 = empty)*  

  | Path (Y/N Sequence) | Position                          | Awkward Commitment                                                                 |  
  |----------------------|-----------------------------------|------------------------------------------------------------------------------------|  
  | N-N-N-Y-N-Y-Y-Y-N-N  | **Boorse (Biostatistical)**       | Ageing is a disease; carrier states are not.                                       |  
  | Y-N-Y-N-N-Y-N-Y-Y-N  | **Wakefield (Harmful Dysfunction)** | Asymptomatic high-risk carriers have a disease now.                               |  
  | N-Y-N-N-Y-N-N-N-N-N  | **Nordenfelt (Vital Goals)**      | The sound engineer has a disease; the freediver does not.                          |  
  | Y-Y-Y-Y-Y-Y-N-Y-Y-Y  | **Fulford (Normativist)**         *No* biological dysfunction required (e.g., homosexuality was a disease). |  
  | N-Y-Y-Y-N-N-Y-N-Y-Y  | **Social Constructionist**        | Disease status changes with social norms (e.g., freediver physiology in 1800s).    |  
  | Y-N-N-Y-N-N-N-N-Y-N  | **Unnamed: Role-Deviance + 3rd-Party Harm** | Freediver’s physiology is a disease; asymptomatic carrier isn’t.            |  
  | 🔲 Y-Y-N-Y-Y-Y-Y-Y-Y | *Incoherent*                      (Denies statistical deviance matters, yet uses it in Case 2). |  
  | 🔲 N-N-Y-N-Y-N-Y-N-N | *Unexplored*                      (Prioritises self-harm but rejects patient’s view in psychiatric case). |  

  ---

  ### **Test Case Outcomes**  
  1. **Asymptomatic Carrier (34F):**  
     - **Yes (disease now):** Wakefield, Unnamed.  
     - **No:** Boorse, Nordenfelt, Constructionist, Fulford (unless harm to others).  
  2. **Freediver:**  
     - **Yes:** Biostatistical (deviance), Unnamed.  
     - **No:** All others (functional enhancement).  
  3. **Sound Engineer:**  
     - **Yes:** Nordenfelt, Constructionist (if role-valued).  
     - **No:** Boorse, Wakefield (normal audiogram).  
  4. **One Kidney:**  
     - **Yes:** Biostatistical.  
     - **No:** Others (adequate function).  
  5. **Prolonged Grief (Psychiatric):**  
     - **Yes:** Wakefield, Biostatistical, Unnamed (3rd-party harm).  
     - **No:** Nordenfelt, Constructionist, Fulford (1st-person view).  

  ---

  ### **Key Distinctions & Warnings**  
  - **Indistinguishable Pairs:**  
    - *Boorse vs. Unnamed* agree on all test cases **except the freediver** (Unnamed calls it a disease).  
    - *Nordenfelt vs. Constructionist* often align but diverge if society devalues a patient’s vital goals (e.g., grief case).  
  - **Unstable Nodes:**  
    - Answering **"Yes" to Case 1 (risk = disease)** but **"No" to Case 8 (carrier ≠ disease)** is inconsistent for Wakefield.  
    - **Prioritising 1st-person harm (Case 5)** but **invoking 3rd-party harm for carriers (Case 8)** conflicts for Nordenfelt/Constructionist.  
  - **Key Map:**  
    - **Boorse:** N in Cases 1,3,5,6,8; Y in 2,4.  
    - **Wakefield:** Y in 1,5,8; N in 2,3,6.  
    - **Nordenfelt:** N in 1,2,4; Y in 3,5 (if goals impaired).  
    - **Fulford:** Y in 1,2,3,4,5,8 if "harm" subjectively defined.  
    - **Constructionist:** Context-dependent answers (e.g., Y in 3,5,10; N in 2,4).  
    - **Unnamed:** Y in 1,2,4,5,8; N in 3,6.  

  ---  
  This tree forces implicit commitments into the open using clinical dilemmas. **Unstable patterns** reveal where personal logic may be unexamined (e.g., switching harm perspectives). The "unnamed" position highlights that many clinicians default to *statistical deviance + third-party harm* without a clear philosophical home.
