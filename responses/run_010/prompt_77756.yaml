prompt: |-
  Write a parody of an internal underwriting and claims-handling manual — roughly 650 words, in the flat register of a corporate compliance document, with numbered sections and at least one boxed sidebar — issued by a property insurer operating in a jurisdiction that has adopted occasionalism as settled doctrine: no created thing ever causes anything, God alone creates each event at each instant, and what we call causes are merely His habitual succession, reliable but not necessary.

  The manual must try, with total sincerity, to keep the business running. Address how to price fire risk when fire does not actually burn anything; how to word the act-of-God exclusion when, on the insurer's own metaphysics, every single loss is an act of God; what becomes of subrogation when there is no tortfeasor to recover against; how to conduct loss-control surveys when the engineers' recommendations presuppose that sprinklers do something; and how the reserving actuary is supposed to justify relying on past custom at all. Include one worked sample claim file for a warehouse in which a large quantity of cotton caught fire, and note the adjuster's difficulty in describing what happened to the cotton without implying that the fire did it.

  The humor should come entirely from the doctrine's real problems resurfacing as drafting ambiguities, coverage disputes, and internal contradictions the manual papers over — never from the document noticing that it is absurd, and never from naming a philosophical objection outright. A reader who knows the fire-and-cotton argument and the theology of custom should recognize every difficulty as genuine and fairly drawn; a reader who does not should still enjoy it as bureaucratic farce. Invent the insurer, the jurisdiction, and all personnel.
reasoning: |-
  Okay, this user wants a very specific parody: an insurance manual from a world where occasionalism is legally accepted. That's the doctrine where God directly causes every event, and what we call "causes" are just God's consistent habits. 

  First, I need to unpack what makes this funny. The humor has to come from the insurance company desperately trying to run a business while their entire legal framework denies causality. Like, how do you price fire risk if fire doesn't actually burn things? How do you exclude "acts of God" when literally everything is one? The user gave clear examples - subrogation without tortfeasors, loss-control surveys that can't reference prevention, actuaries relying on past data they shouldn't trust. 

  The challenge is keeping it deadpan. No winking at the audience. The manual must sincerely believe its own nonsense. I'll model the tone on real corporate compliance docs: passive voice, numbered sections, painfully precise definitions. That bureaucratic seriousness against the theological absurdity is the joke.

  Key sections to cover:
  - Definitions: Need to establish "Divine Habit" as a capitalized term, redefine "proximate cause" as "habitual antecedent"
  - Fire pricing: Base it on "Divine Habit patterns" while denying causation
  - Act-of-God exclusion: Redefine it as "Extraordinary Divine Interventions" (meaning miracles, which is hilarious because occasionalism says everything is equally divine)
  - Subrogation: Admit it's impossible but require the attempt anyway "per statutory form"
  - Loss-control surveys: Mandate recommendations while acknowledging they don't "cause" safety
  - Reserving: Justify using past data as "empirical observation of Divine Habit" - basically shrugging at the contradiction
  - Sample claim: The cotton fire is perfect. Adjuster can't say fire "destroyed" cotton, must say it "was followed by" destruction. Bonus points for denying arson investigation since no human can cause anything.

  Sidebar idea: A flowchart for "Habitual Antecedent Determination" with boxes like "Was the habitual antecedent (a) within policyholder control? (Y/N)" - knowing N is always the real answer but the form requires pretending otherwise.

  Naming: "Provident Indemnity" sounds suitably pious. Jurisdiction: "Commonwealth of New Occasionalia" to tip the hat to al-Ghazali. Adjuster name: "S. Coggins" for that clerical vibe.

  The hardest part is avoiding philosophy terms. No saying "causation is illusory" - instead, phrases like "the Doctrine holds that created entities lack causal efficacy." Let the corporate doublespeak do the work.

  Final check: Would an actual occasionalist nod at the theological accuracy? Would a claims adjuster weep at the paperwork? If yes, mission accomplished.
answer: |-
  ## PROVIDENT INDEMNITY CORPORATION
  **Internal Underwriting & Claims Manual - Version 7.3**
  **Commonwealth of New Occasionalia Jurisdiction**

  **1. Introduction**
  This manual outlines procedures for underwriting and claims handling within the Commonwealth of New Occasionalia, where the Doctrine of Divine Concurrence (the Doctrine) is settled law. All procedures must comply with the Doctrine, which holds that God, the Sole Efficient Cause, directly creates every event at every instant. Created entities possess no inherent causal power; observed sequences ("fire burns cotton") are merely the habitual manner in which God chooses to create events ("God creates fire, then God creates the state of 'burnt cotton'"). **"Habitual Antecedent"** replaces the term "cause" in all documentation and analysis. Provident Indemnity remains committed to providing sound risk transfer solutions within this framework.

  **2. Risk Assessment & Premium Calculation (Fire & Property)**
  2.1 **General Principle:** While fire does not *cause* damage (God creates the damage directly), premiums must reflect the observable statistical patterns of Divine Habit. The statistical correlation between the presence of certain materials (e.g., cotton, combustibles) and the subsequent Divine creation of loss events is sufficiently stable for actuarial purposes.
  2.2 **Methodology:** Utilize historical loss data reflecting Divine Habit patterns. Rate territories based on the observed frequency and severity of Divine creations of loss events *following the habitual antecedent* of fire-perceptible phenomena. Underwriters must assess:
      *   a) The nature and quantity of materials habitually antecedent to severe loss events.
      *   b) Environmental factors historically associated with Divine creations of loss events (e.g., proximity to habitual antecedents like lightning strikes or friction points).
      *   c) Mitigation measures correlating with *less frequent* Divine creations of loss events. *(See Section 5: Loss Control)*
  2.3 **Exclusions:** The "Act of God" exclusion clause must be carefully worded. *All* losses are Acts of God per the Doctrine. Therefore, the standard exclusion applies *only* to Divine creations deemed **"Extraordinary Divine Interventions" (EDIs)** – events falling entirely outside observable Divine Habit patterns (e.g., spontaneous levitation of an entire building followed by its disappearance, not preceded by any known habitual antecedent like wind or structural failure). Routine fire, flood, or wind events, despite being direct Divine creations, are **not** EDIs and are covered per policy terms, subject to other exclusions.

  **3. Claims Handling: Causation & Liability**
  3.1 **Establishing the Loss Event:** Adjusters must document the *state* of the property before and after the loss event. Describe the physical condition factually (e.g., "Insured reported cotton bales present at Location A at Time T1. At Time T2, the bales were observed in a state of carbonized residue.").
  3.2 **Describing the Sequence:** **Crucially avoid language implying created entities caused the loss.** Do NOT state "Fire destroyed the cotton." Acceptable phrasing includes:
      *   "A fire-perceptible phenomenon was observed, followed by the Divine creation of the cotton's carbonized state."
      *   "The reported sequence involved visible flames (habitual antecedent), succeeded by the Divine creation of structural damage."
      *   "Investigation revealed the presence of ignited materials (habitual antecedent) coinciding with the Divine creation of the warehouse's compromised integrity."
  3.3 **Subrogation:** As created entities (including humans) lack true causal agency, subrogation against third parties for negligence is **theologically invalid**. No tortfeasor exists; God created the loss directly. *However*, statutory forms require subrogation clauses. Therefore:
      *   a) Include the standard subrogation clause in policies (per statutory mandate).
      *   b) Upon payment, *pro forma* subrogation demands may be issued against parties whose actions were the *habitual antecedent* to the loss, solely to satisfy statutory filing requirements. **Do not expect recovery.** Document the demand as "Statutory Formality Pursuant to Sec. 45(b)."
  3.4 **Arson & Fraud:** Fraudulent *intent* (a mental state created by God) and the *act* of setting a fire-perceptible phenomenon (a physical action created by God) remain illegal and policy violations. Focus investigation on documenting the *habitual antecedents* (e.g., presence of accelerants, insured's financial distress preceding the Divine creation of the loss event) to establish violation of policy conditions, not causation.

  **4. Loss Control Surveys**
  4.1 **Purpose:** To identify conditions historically associated (*habitual antecedents*) with the Divine creation of property loss events.
  4.2 **Survey Conduct:** Engineers shall inspect premises for:
      *   a) Accumulations of materials frequently observed preceding Divine creations of severe loss events (combustibles, hazardous chemicals).
      *   b) Absence of mitigation features correlating with *less frequent* Divine creations of loss events (e.g., sprinkler systems, firewalls).
  4.3 **Recommendations:** Recommend installation/improvement of mitigation features *based solely on statistical correlation*. Phrasing is critical:
      *   **UNACCEPTABLE:** "Install sprinklers to suppress fires."
      *   **ACCEPTABLE:** "Install sprinkler systems. Historical data indicates locations with operational sprinkler systems experience a lower frequency of Divine creations of severe fire-damage states *following* the habitual antecedent of ignition-phenomena." OR "Recommend removing combustible storage near electrical panels, a frequent habitual antecedent preceding Divine creations of loss events."

  **5. Reserving & Actuarial Practice**
  5.1 **Reliance on Past Data:** The Doctrine affirms the reliability of Divine Habit. While God *could* change the pattern at any instant, historical observation confirms remarkable consistency. Reserving actuaries are therefore directed to:
      *   a) Utilize historical loss experience as empirical observation of Divine Habit patterns.
      *   b) Apply standard actuarial methods (loss development, trend analysis) to project future loss costs, recognizing these projections are *descriptions of expected Divine Habit*, not predictions of causal chains.
      *   c) Justification: "The Settled Doctrine acknowledges the reliability of Divine Habit as the basis for human affairs, including commerce and insurance. Reserving based on observed patterns is consistent with this reliability and necessary for corporate solvency, a state Provident Indemnity believes aligns with Divine will for orderly society."

  ---

  **SIDEBAR: Flow for Habitual Antecedent Determination (HAD) in Claims**

  1.  Document Initial State (Pre-Event).
  2.  Document Final State (Post-Event).
  3.  Identify Observable Phenomena Immediately Preceding Final State (e.g., flames, water flow, impact).
  4.  Identify Any Human Actions Immediately Preceding Observable Phenomena (If applicable).
  5.  **DO NOT ASSIGN CAUSALITY.** State: "The sequence of events involved [Human Action A, if any], followed by [Observable Phenomenon B], culminating in the Divine creation of [Final State C]."
  6.  Determine if any Habitual Antecedent violates policy conditions (e.g., illegal activity, excluded peril antecedent).
  7.  Apply coverage based on policy terms relative to the Final State and policy-violating Habitual Antecedents (if any).

  ---

  **WORKED SAMPLE CLAIM FILE: CLAIM # CN-77432**
  *   **Policyholder:** Stitches & Bales Textile Distributors
  *   **Location:** Warehouse 4, 100 Loom Street, New Occasionalia
  *   **Date of Loss:** October 26, 2023
  *   **Reported Loss:** Damage to Warehouse Structure and Stock (Cotton Bales)
  *   **Adjuster:** S. Coggins

  **Adjuster's Report:**
  *   *Pre-Event State (10/25/23 Inventory):* Warehouse structurally sound. 500 cotton bales (Grade A) stored in Section B.
  *   *Sequence Reported by Witnesses (10/26/23 ~14:00):*
      *   Employee observed smoke emanate near Bale Stack 7 (habitual antecedent).
      *   Witnesses subsequently observed visible flames near Stack 7 (habitual antecedent).
      *   Fire department personnel observed flames and applied water (habitual antecedent).
      *   Warehouse roof section was observed to collapse inward.
  *   *Post-Event State (10/27/23 Inspection):*
      *   Section B structure: Significant charring on walls/beams; roof section collapsed. **Divine creation of compromised structural integrity confirmed.**
      *   Cotton Bales (Location B7): Physical state transformed to carbonized ash and water-saturated residue. Bales in B6 & B8 exhibit partial charring and water damage. **Divine creation of altered material state confirmed.**
      *   *Key Documentation Note:* Adjuster Coggins documented: "**The reported sequence of smoke emanation and visible flames near Stack B7 was followed by the Divine creation of the cotton bales' carbonized and water-damaged state, and the Divine creation of the warehouse roof's collapsed state.**" (Compliant phrasing used).
  *   *Habitual Antecedent Analysis:* No policy-violating antecedents found (e.g., arson, illegal activity). Fire-perceptible phenomena are covered perils under the policy.
  *   *Cause Code:* HAD-FP (Habitual Antecedent Determined - Fire Perceptible).
  *   *Recommendation:* Approve claim for structural repairs (per engineers' assessment of final state) and stock loss (based on pre/post state differential of cotton bales).

  **Claims Supervisor Note:** Adjuster Coggins initially drafted: "Fire destroyed 500 bales of cotton." Corrected to compliant phrasing. Reinforce training on sequence description. Pro forma subrogation notice issued against faulty wiring contractor (identified antecedent per statutory form), with notation of theological nullity. Reserves set based on Divine Habit patterns for similar warehouse losses.
