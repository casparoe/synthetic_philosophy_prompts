prompt: |-
  I sit on a municipal commission that will spend the next six weeks deciding whether the city should staff a new standing oversight panel — the one that reviews misconduct complaints against police officers and recommends discipline — by sortition rather than by appointment or election. I am the member charged with presenting the evaluation criteria at the public hearing, and the drafting has made it uncomfortably clear that until now I have been arguing from instinct. Both camps have been at me. The reformers point to the Athenian boule, to jury service, and to the recent citizens' assemblies on electoral reform and climate policy, and argue that a randomly drawn body is the only one that cannot be bought or lobbied. The city attorney argues that a panel nobody elected can be neither held to account nor meaningfully answerable for harm, and that its recommendations will be quietly ignored the first time they cut against an organized constituency.

  I do not want a defense of either side. I want the specification: the list of requirements that any adequate account of the legitimacy of selection-by-lot must satisfy before it can be applied to a body like this one, with the case or consideration behind each requirement.

  Please be concrete about the hard ones. What must such an account say about the mandate problem — what, if anything, transfers authority to people no one chose? About accountability — is the absence of electoral incentive a fatal gap, or precisely the feature that purchases independence, and can a single account hold both claims at once? About composition — the summons is not the panel: who declines, who cannot get time off work, who is paid to attend, and does a body that has deliberated for six weeks still represent the population it was drawn from? About the epistemic claim — jury-theorem-style arguments assume a binary question and independent judgments that are better than chance, so I want to know whether the argument survives deliberation, which correlates votes, and survives multi-option choices, where there is no majority-vote analogue at all. About capture — random selection eliminates campaign donors but not the agenda-setter: whoever writes the charge, selects the briefing materials and the expert witnesses, and facilitates the room. And about the excluded, who must watch a panel of strangers adjudicate a complaint of their own.

  Then tell me which of these are genuinely non-negotiable and which are the settled preferences of one camp wearing the clothes of requirements — I suspect several of the attorney's are, and several of the reformers' as well. Mark any subset you believe cannot be jointly satisfied: if mirroring the public and producing informed public judgment pull in opposite directions, say so plainly, and say which of the two has to carry the legitimacy, because that is the part I most need settled before the hearing. Close with the single requirement that excludes the greatest number of otherwise plausible accounts, and, briefly, how the main families of sortition design fare against the list.

  No bibliography, no reading list, no citations. I want the argument, not the scholarly apparatus; I will chase down the literature on my own afterwards.
reasoning: |-
  Okay, the user is part of a municipal commission deciding whether to use sortition for a police oversight panel. They need evaluation criteria for legitimacy, not defenses of either side. They've mentioned specific hard problems: mandate, accountability, composition, epistemic claims, capture, and the excluded. 

  First, I need to break down each requirement clearly. The user wants concrete criteria, not theory. They also want to know which are non-negotiable and which are preferences in disguise. Plus, identifying conflicts, like representation vs. informed judgment.

  Starting with mandate: how does random selection gain authority? It's about civic duty and equal opportunity. But the hard part is that selection isn't choice, so the process must be transparent and the panel's role limited to recommendations, not final decisions. That's key.

  Accountability is tricky. The absence of electoral pressure ensures independence but means no reelection for poor performance. So the requirement here is retrospective accountability—public hearings or reports. Also, legal indemnity to protect members from backlash. This balances independence with answerability.

  Composition: Who actually serves? Summons isn't enough. Need demographic mirroring via stratified sampling, compensation for lost wages, and childcare. But after deliberation, do they still represent the public? The requirement is initial representativeness, not after deliberation. The legitimacy comes from the fair selection process, not ongoing mirroring.

  Epistemic claims: Juries decide binary issues, but oversight panels have complex choices. Deliberation correlates judgments, so the jury theorem doesn't directly apply. The requirement is structured deliberation—diverse experts, balanced briefings, facilitation to avoid groupthink. This is crucial for informed decisions, not just statistical aggregation.

  Capture: Random selection avoids lobbying but not agenda control. Whoever sets the charge, selects materials, or facilitates can sway outcomes. Requirements here involve multi-partisan control over briefings, transparent expert selection, and neutral facilitators. Without these, the panel can be manipulated.

  The excluded: Victims might feel alienated by strangers judging their complaints. Need a role for victim impact statements and clear communication about the panel's limitations. The panel's legitimacy partly depends on acknowledging its inability to fully represent individual experiences.

  Now, non-negotiables: Mandate via process and limited power, accountability through transparency and legal protection, compensation to ensure participation, structured deliberation against groupthink, and anti-capture measures. These are foundational. Without them, the system fails.

  Preferences disguised as requirements: The attorney's demand for electoral-style accountability isn't feasible for sortition. Reformers' desire for perfect demographic mirroring post-deliberation is impractical. Legitimacy doesn't require ongoing representativeness after deliberation starts.

  Conflicts: Mirroring the public vs. informed judgment. Initial representativeness is necessary for legitimacy, but deliberation changes the panel. The trade-off is accepting that informed judgment, aided by diverse inputs, carries more weight than maintaining statistical representativeness throughout.

  The hardest requirement? Anti-capture measures. If the process is manipulated, everything else fails. How do designs fare? Citizens' assemblies use balanced briefings and neutral facilitation. Oversight panels need similar safeguards but are more vulnerable due to higher stakes. Without strict controls, capture is a major risk.

  So the key points: Clear criteria per issue, highlighting non-negotiables, exposing hidden preferences, addressing conflicts with trade-offs, and emphasizing anti-capture as critical. The user needs this structured to present at the hearing, focusing on what makes sortition legitimate despite its challenges.
answer: |-
  Here are the evaluation criteria for legitimizing sortition in your oversight panel context, structured as concrete requirements with their underlying rationale. Each addresses your specified "hard problems":

  ### Core Legitimacy Requirements for Sortition
  1.  **Mandate via Process & Role Definition:**
      *   **Requirement:** The account must explicitly ground authority in the fairness and transparency of the selection *process* itself, coupled with a strictly defined, legally constrained mandate for the panel.
      *   **Rationale:** Random selection doesn't derive authority from popular choice *of individuals*, but from the equal *opportunity* for any citizen to serve and the impartiality of the method. Legitimacy flows from the perceived fairness of the process ("civic lottery") and the panel's role being clearly advisory/recommendatory, not final decision-making (which typically remains with elected/appointed officials). *Without this, the "why strangers?" question lacks an answer.*

  2.  **Balanced Accountability (Procedural & Retrospective):**
      *   **Requirement:** The account must provide mechanisms for *procedural transparency* (public hearings, published rationales) and *retrospective assessment* (audits, sunset reviews), while explicitly rejecting electoral-style accountability *for individual members* as incompatible with and detrimental to the core purpose of independence.
      *   **Rationale:** Electoral accountability creates perverse incentives for populism or constituent service, precisely what sortition avoids. Independence *is* the feature, but legitimacy requires transparency *about how decisions are reached* and mechanisms to evaluate the *system's* overall performance and fairness over time. Legal indemnity for members acting in good faith is also crucial. *The account must hold both independence and procedural/review accountability simultaneously; they are not opposites but different layers.*

  3.  **Guaranteed Inclusive Composition:**
      *   **Requirement:** The account must mandate robust measures to achieve *initial demographic and experiential representativeness* (stratified random sampling) and overcome barriers to participation (significant stipend covering wages + expenses, flexible scheduling, childcare, legal job protection).
      *   **Rationale:** A skewed participant pool (e.g., retirees, unemployed, affluent) due to self-selection or barriers invalidates the claim of representing "the public." Representativeness is primarily *statistical at selection*. The panel *will* change through deliberation – this is expected and desirable for developing informed judgment. Legitimacy hinges on the *fair chance* of inclusion initially, not on the panel remaining a perfect microcosm after weeks of work. *Representativeness is non-negotiable at the point of summoning; its evolution through deliberation is inherent and necessary.*

  4.  **Structured Deliberative Epistemics:**
      *   **Requirement:** The account must explicitly reject simple "wisdom of crowds" (jury theorem) as sufficient justification. It must instead require a *structured deliberative process* designed for complex, multi-option decisions: balanced briefings, diverse expert testimony (proponents *and* critics), skilled neutral facilitation, sufficient time for learning and discussion, and requirement for reasoned justifications.
      *   **Rationale:** Jury theorems fail here: questions are multifaceted, options are numerous, and deliberation correlates views (making independence assumptions invalid). Legitimacy comes from the *quality of the deliberative process* enabling informed, considered judgment, not just the aggregation of pre-existing opinions. *This replaces the unrealistic binary/jury model.*

  5.  **Robust Anti-Capture Safeguards:**
      *   **Requirement:** The account must institute strict, transparent protocols *external to the panel* for setting the charge, selecting briefing materials/experts, and choosing facilitators. This should involve multi-partisan input, public disclosure of sources/methods, and clear conflict-of-interest rules.
      *   **Rationale:** While sortition prevents *member* capture (bribery/lobbying), agenda-setting power is critical vulnerability. Whoever controls information flow and process rules can heavily influence outcomes. Legitimacy requires demonstrable neutrality and balance in *how the panel is equipped and guided*. *This is non-negotiable; without it, independence is illusory.*

  6.  **Acknowledgment & Mitigation for the Excluded:**
      *   **Requirement:** The account must formally recognize the limitation that the panel cannot embody the *specific lived experience* of every complainant. It must incorporate mechanisms for affected parties (complainants, officers) to be heard meaningfully (e.g., victim impact statements, officer response rights) and ensure clear communication about the panel's role and limitations.
      *   **Rationale:** Direct representation of specific grievances by the panel is impossible. Legitimacy requires procedural fairness *for the parties involved* and public acknowledgment that the panel's legitimacy stems from its *process and civic character*, not from mirroring individual identities or experiences.

  ### Distinguishing Non-Negotiables from Disguised Preferences
  *   **Non-Negotiables (Failure on these invalidates the legitimacy claim):**
      *   **Mandate via Process & Role Definition:** Without this, there's no coherent answer to the authority question.
      *   **Guaranteed Inclusive Composition (at summoning):** A skewed pool betrays the core premise of "the public" judging.
      *   **Structured Deliberative Epistemics:** Complex judgment requires this process; simple aggregation is illegitimate here.
      *   **Robust Anti-Capture Safeguards:** Vulnerability to agenda control fatally undermines independence.
      *   **Balanced Accountability (Procedural Transparency & Retrospective Review):** Complete opacity or lack of system review is untenable.
  *   **Settled Preferences (Often presented as requirements):**
      *   **Electoral-Style Accountability (City Attorney):** Demanding this is incompatible with sortition's purpose. It's a preference for a different *type* of system.
      *   **Perfect Ongoing Representativeness (Reformers):** Expecting the deliberating group to remain a perfect demographic mirror is unrealistic and misunderstands deliberation's transformative purpose.
      *   **"Wisdom of Crowds" as Primary Justification (Reformers):** Appealing to Condorcet etc. is insufficient and misleading for this complex task; the deliberative process carries the epistemic weight.
      *   **Panel Embodies Specific Lived Experience (Implicit):** This is impossible; legitimacy must come from process and civic role, not identity representation per se.

  ### Inherent Tensions & Trade-offs
  *   **Mirroring vs. Informed Judgment:** This is the sharpest conflict. **Requirement #3 (Initial Representativeness)** and **#4 (Structured Deliberation)** pull in opposite directions: deliberation *should* change members' views based on evidence and discussion, meaning they no longer statistically mirror the uninformed public. **The legitimacy must primarily reside in the *informed public judgment* produced by the structured deliberative process (#4)**, supported by the initial fair chance of inclusion (#3). The *output* (reasoned recommendation) after rigorous process carries more legitimacy than maintaining a snapshot of initial, uninformed public opinion.

  ### The Highest Bar: The Requirement that Excludes Most Accounts
  *   **Robust Anti-Capture Safeguards (#5).** Many idealized accounts of sortition hand-wave away agenda power or assume benevolent, neutral administrators. Designing truly credible, transparent, and balanced protocols for setting charges, selecting information/facilitators, and managing process *external to the panel* is exceptionally difficult in a high-stakes, politicized environment like police oversight. Flaws here render even a perfectly selected and deliberative panel vulnerable to manipulation, destroying its legitimacy. Most naive "random selection solves everything" arguments fail precisely here.

  ### How Sortition Designs Fare Against the List
  *   **Citizens' Assemblies (CA) Model:** Strong on #3 (inclusion measures), #4 (structured deliberation), and often #5 (multi-stakeholder oversight of process/materials). Weaker on #2 (long-term retrospective review often undefined) and sometimes #1 (mandate clarity can be fuzzy if recommendations aren't binding).
  *   **Pure Jury Model:** Strong on #1 (clear role) and #2 (verdict focus). Fails #3 (juries aren't demographically representative), #4 (designed for binary verdicts, not complex policy/recommendations), #5 (judge controls process, but agenda/charge less vulnerable).
  *   **Oversight-Specific Sortition:** Must explicitly build in all non-negotiables. Faces biggest challenges with #5 (agenda control in a charged political context) and balancing #3 & #4. Requires stronger #2 mechanisms (audits, reviews) than typical CA due to ongoing function.

  **Present this core:** Focus your hearing criteria on Mandate (Process/Role), Inclusive Summoning, Structured Deliberation, Anti-Capture Protocols, and Procedural/Retrospective Accountability. Acknowledge the Mirroring/Informed Judgment trade-off explicitly, siding with the legitimacy of the *informed output*. Emphasize that Anti-Capture safeguards are the make-or-break element requiring the most rigorous design. Good luck.
