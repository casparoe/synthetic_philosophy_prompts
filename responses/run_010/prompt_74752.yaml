answer: |-
  After analyzing your nine cases, I've identified a unifying principle that captures your intuitive verdicts. Your intuitions are not primarily tracking "worst-case vs. average-case" guarantees; instead, they revolve around **whether irreversible, unconcentrated harm is bounded by an independently enforced mechanism that remains valid under deployment realities**. The core concern is the *stability* and *enforceability* of the guarantee against irreversible losses, especially under adversarial conditions or system-induced distributional shifts. Below, I formalize this principle, explicitly linking each clause to your cases, and then apply it to your additional scenarios.

  ---

  ### **The Principle: Bounded Irreversible Harm with Independent Enforcement (BIHIE)**
  A performance guarantee is adequate **if and only if**:
  1. **Irreversible harms are bounded per individual and in aggregate**  
     (Motivated by Cases 1, 4, and 6: Unbounded irreversible harm, like novel object collisions or targeted fraud, is unacceptable).  
  2. **The bound is enforced by a mechanism independent of the model's correctness**  
     (Motivated by Cases 2 and 7: Hardware interlocks work; inattentive humans do not).  
  3. **The guarantee is stable under deployment**  
     (Motivated by Cases 8 and 9: System-induced distributional shifts or an incomplete uncertainty set invalidate the guarantee).  
  4. **The bound is non-vacuous and covers irreversible harms**  
     (Motivated by Cases 3, 5, and 6: Vacuous certificates or diffuse/recoverable harms are tolerable only if irreversibility is controlled).  

  **Adequacy conditions**:  
  - **Reversible harms** (e.g., compensable losses) need no strict bound (Cases 3 and 5).  
  - **Irreversible harms** (e.g., death, uncompensated ruin) require all four clauses.  
  - **Independence** means the bound holds even if the model fails completely (e.g., hardware interlocks in Case 2).  
  - **Stability** means the guarantee holds under the system’s influence on its environment (e.g., Case 8’s self-shaping distribution breaks this).  

