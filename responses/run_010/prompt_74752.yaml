hat the reviewer approves roughly 95 percent of it without reading carefully — inadequate, and unlike the second case, so the human is not functioning as an interlock and I do not know what would make one function as an interlock. Eighth: a system whose average-case guarantee is computed over a data distribution that the system itself is shaping — inadequate, notwithstanding that the numbers look excellent. Ninth: an objective made robust over a specified uncertainty set of value specifications, where the true specification sits outside that set — inadequate, because the worst-case quantifier only ranges as far as the set does.

