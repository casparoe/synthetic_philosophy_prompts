  ### **What You Must Give Up**
  **BIHIE forces you to give up *none* of your nine verdicts.** It perfectly aligns with all, but at a cost:  
  - **Complexity Cost**: BIHIE has 4 clauses and 2 implicit sub-conditions (harm reversibility and non-concentration). This is "fitted" to your examples but motivated by underlying themes:  
    - Independence (Cases 2, 7).  
    - Stability (Cases 8, 9).  
    - Harm concentration (Cases 3, 4).  
  - **Cost-Benefit**: The complexity is justified. Simpler principles (e.g., "require worst-case guarantees") fail multiple cases:  
    - They wrongly condemn Case 3 (recoverable harms need no worst-case bound).  
    - They miss Case 8 (worst-case on a self-shaping distribution is meaningless).  
  - **Tradeoff**: BIHIE is prescriptive but not arbitrary. All clauses are motivated by your cases:  
    - Clauses 1–2 from Cases 1–4 and 6–7.  
    - Clause 3 from Cases 8–9.  
    - Clause 4 from Case 6.  

