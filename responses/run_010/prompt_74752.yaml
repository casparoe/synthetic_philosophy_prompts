  **Key Insights**:  
  - **Worst-case vs. average-case is a proxy** for your deeper concerns: independence (Case 2 vs. 7), stability (Cases 8–9), and harm concentration (Cases 3 vs. 4).  
  - **Harm concentration** matters because it turns reversible losses into irreversible ones (Case 4 vs. 3).  
  - **Independence** ensures the bound isn’t co-opted by the model (Case 2 vs. 6).  
  - **Stability** prevents guarantees from becoming self-deceptive (Cases 8–9).  
  - **Non-vacuity** ensures bounds are meaningful (Case 6).  

