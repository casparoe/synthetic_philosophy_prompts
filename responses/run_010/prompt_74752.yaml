  ### **How BIHIE Explains Your Nine Cases**
  | Case | Your Verdict | BIHIE Principle Application |
  |------|--------------|----------------------------|
  | **1** (Braking stack) | Inadequate | **Violates Clause 1, 2, 3:** Novel objects create unbounded irreversible harm; no independent enforcer; distribution shifts (new objects) invalidate the average-case guarantee. |
  | **2** (Radiotherapy) | Adequate | **Satisfies all clauses:** Hardware interlock bounds dose (Clause 1, 2); stability is inherent (Clause 3); non-vacuous (Clause 4). |
  | **3** (Phishing, diffuse) | Adequate | **Satisfies Clause 1 (implicitly):** Losses are reversible ("recoverable"), so no bound needed. |
  | **4** (Phishing, targeted) | Inadequate | **Violates Clause 1:** Irreversible harm (retiree's savings) is unbounded and concentrated. |
  | **5** (Recommender) | Adequate | **Satisfies Clause 1 (implicitly):** Harms are compensable and spread, so irreversibility is controlled. |
  | **6** (Vacuous certificate) | Inadequate | **Violates Clause 4:** The guarantee is vacuous (empty perturbation ball) → no real bound on irreversible harm. |
  | **7** (Human reviewer) | Inadequate | **Violates Clause 2:** Human is not independent (95% rubber-stamping → enforcement depends on model being correct). |
  | **8** (Self-shaping dist.) | Inadequate | **Violates Clause 3:** Guarantee is unstable → system shapes its own distribution. |
