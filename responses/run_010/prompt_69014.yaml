prompt: |-
  so I do economic modelling for a reimbursement body — think of the sort of agency that decides whether a new drug gets funded, on the NHS/NICE model — and there's a thing about our own scoring that has been bugging me for a while and I can't tell if it's a real problem or just an artifact of how everyone in this field talks.

  the short version: our gatekeeping concept and our benefit concept don't line up, and I want to know what theory of health the whole apparatus is actually committed to.

  concretely. A company can't get a hearing unless the indication is a recognised disease — there has to be a diagnosis, a code, a named pathological entity, something a clinician can point at in the body. But once you're in the room, the diagnosis stops doing any work at all. The benefit we count is QALYs: life years weighted by a health-state value anchored at 0 for death and 1 for full health, and we cheerfully accept negative values for states the public ranks as worse than being dead. Full health there isn't a biological optimum — it's the profile where a respondent ticks the no-difficulty box on five fixed dimensions (mobility, self care, usual activities, pain, anxiety/depression), and the weights come from asking a sample of the general public to trade off time or risk against living in that state. Then we divide cost by QALYs gained and compare against a threshold, something in the region of £20–30k per QALY, and that number is a hard bright line: 31k is a no, 29k is a yes, and nobody has ever publicly derived where it sits.

  three bits of this I can't reconcile with each other:

  (a) we have formal flexibility — we used to have an explicit end-of-life test and now something like a severity modifier — that lets a drug clear at two or three times the normal cost per QALY. So the same QALY is worth more or less depending on how badly off the person receiving it already was. But if a QALY is what we say it is, a quantity of health, then a QALY is a QALY, and weighting it by prior severity means we stopped measuring health at some point and started measuring the moral urgency of need. We never say that out loud in the guidance.

  (b) our reference case stipulates which instrument produces the utility. If the trial measured quality of life with something else, the company has to map or crosswalk onto ours. And different instruments disagree about the same patient by more than the entire distance between reccomended and not recommended for a lot of mid-priced drugs. If the health state were a real magnitude sitting in the patient, I'd expect instruments to disagree the way thermometers do — a little, in a way you can explain away as noise and calibration. They don't. They disagree systematically, and the way we settle it is by fiat. Someone on our committee insists this is ordinary measurement error, exactly like two bathroom scales reading your weight differently, and I don't have a good answer for him. Am I wrong that (b) is a problem?

  (c) the ceiling. Plenty of people enter our models with a baseline utility of 1 because the instrument can't see any further improvement, and we still fund their treatment, justifying it by saying the diagnosis carries a burden the questionnaire doesn't capture. Which is an admission the instrument isn't measuring health — and simultaneously an admission we're back to counting diagnoses, i.e. back to the thing we said stopped mattering at the door.

  so what I want: what concept of health is this practice committed to? Is it treating health as normal species-typical functioning, something in principle readable off the body independent of what anyone thinks about it — or as a verdict about how good someone's functioning is by their community's lights — or is it a third thing entirely? I've seen philosophers label the two poles naturalism and normativism but I genuinely cannot work out which one we bought, becuase we seem to be running both at once and getting away with it.

  Be concrete rather than survey-ish. Which parts of the machinery strictly presuppose a view, in the sense that they could not be run at all under the rival account? Which parts merely happen to fit the one we use and would survive the switch untouched? And where is the practice underdetermined — where would a naturalist and a normativist both happily sign off on the identical guidance document, so that nothing about the outcome lets you tell them apart? Then rank (a), (b), (c): which is the real problem and which is just an embarrassment we could patch.

  finally, tell me what would have to change in the machinery itself — not the philosophy, the paperwork — if we concluded the normativist was right all along. Would we still need a diagnosis at the door? Would the scale still have a ceiling at 1? Would the threshold still be expressed per QALY, or would per-QALY stop being the right unit? And if the answer is that nothing would change, say so, and tell me whether that means the whole naturalism/normativism question is idle for people who actually have to make these decisions.
reasoning: |-
  Okay, let me unpack this user's dilemma. They're an economic modeller for a reimbursement agency, wrestling with fundamental inconsistencies in their framework. The core tension is between their gatekeeping requirement (diagnosis-based) and benefit assessment (QALY-based), which seem to operate on conflicting concepts of health.

  Hmm... the user has articulated three specific pain points: (a) QALY weighting undermines the "a QALY is a QALY" principle, (b) utility instrument discrepancies aren't just measurement error, and (c) baseline utility ceiling breaches reveal the instrument's limitations. Underneath this, they're really asking: what theory of health are we actually using here?

  I recall the naturalism vs normativism debate from health philosophy. Naturalism sees health as objective biological function (Boorse), while normativism ties it to societal values (Nordenfelt). But the user's practice seems to hybridize both - using naturalistic criteria at the gate (diagnosis), then switching to normativism for valuation (public-derived QALYs). 

  For (a): Weighting QALYs by severity explicitly incorporates normativism - it's valuing equal health gains differently based on moral considerations. The user's instinct is right: this isn't about health quantity anymore. But interestingly, the threshold itself (£20-30k) already embodies a normative social judgment.

  For (b): Those utility instrument discrepancies are fatal to naturalism. Different questionnaires produce systematically different "health" readings for the same patient because they're measuring perceived welfare, not biological states. The bathroom scale analogy fails because scales measure an independent physical property - health utility has no such anchor.

  For (c): The ceiling effect is the smoking gun. When they override "full health" ratings to fund treatments for diagnosed conditions, they're admitting the instrument doesn't capture the lived experience of disease - which is fundamentally normative.

  Ranking the problems: (b) is the deepest because it reveals the whole QALY construct is normative, not naturalistic. (c) is symptomatic of this mismatch. (a) is actually consistent with normativism but they're hiding it. 

  If they embraced normativism fully: The diagnosis requirement could relax (why exclude subclinical suffering?), utility instruments would need to reflect patient-perceived burden (not just public valuations), and the threshold might incorporate explicit equity weights. But crucially, QALYs could remain the unit - they'd just be transparently normative constructs.

  The real revelation? Their system already is normativist - it just wears naturalist clothing at the door. The philosophical tension isn't idle - it's causing their operational headaches. Naming it could liberate them to redesign more coherently.
answer: |-
  Your framework isn't committed to a *single* coherent theory of health—it's a pragmatic hybrid that implicitly straddles **normativism** (health as socially valued functioning) and **naturalism** (health as biological function), with normativism dominating the benefit assessment. Here’s how this plays out in your three problems, their severity, and what changes if you embrace normativism explicitly:

  ---

  ### **Core Tensions Dissected**
  **(a) Severity Weighting: Normativism in Disguise**  
  - **Problem**: Weighting QALYs by prior severity treats health gains as morally urgent *needs* rather than uniform quantities. A naturalist would reject this—health is biological function, so a unit gain is identical regardless of baseline. A normativist accepts it: society values relieving extreme suffering more.  
  - **Why it’s a problem**: It exposes that QALYs aren’t "health" but *socially weighted welfare*. The practice is normativist, but your gatekeeping (diagnosis) pretends health is naturalist.  
  - **Severity**: **Moderate**—it’s internally inconsistent but politically defensible.  

  **(b) Utility Instrument Fiat: A Normativist Practice**  
  - **Problem**: Naturalism assumes health is an objective state measurable with calibration (like temperature). But utility instruments (EQ-5D, SF-6D) capture *public perceptions* of living with symptoms—not biological reality. Disagreements arise because they value different *socially constructed burdens* (e.g., pain vs. mobility). Choosing one by fiat admits there’s no "true" health state to measure.  
  - **Why it’s critical**: This is **the deepest flaw**. If health were naturalist, instruments would converge (e.g., lab tests for diabetes). They don’t because they measure normative welfare.  
  - **Severity**: **High**—it undermines the legitimacy of QALYs as "health" metrics.  

  **(c) Baseline Ceiling: Naturalism Collapses**  
  - **Problem**: Claiming a diagnosed disease reduces welfare despite a "full health" utility score (1.0) admits the instrument fails. But reverting to diagnosis (a naturalist criterion) for benefit assessment contradicts the QALY’s normativist logic.  
  - **Why it’s a problem**: It reveals QALYs are incomplete normativist tools—they miss socially relevant burdens.  
  - **Severity**: **Low**—it’s a technical limitation, not a conceptual flaw.  

  ---

  ### **Ranking the Problems**  
  1. **High Severity**: **(b)**. Instrument choice by fiat proves QALYs measure normative welfare, not naturalist health.  
  2. **Moderate Severity**: **(a)**. Severity weights are normatively coherent but clash with naturalist gatekeeping.  
  3. **Low Severity**: **(c)**. The ceiling is a fixable artifact of imperfect instruments.  

  ---

  ### **What Changes if You Embrace Normativism?**  
  If you fully commit to normativism (health = socially valued functioning):  
  1. **Gatekeeping**: Diagnoses become optional. You’d allow submissions for *any condition causing welfare loss* (e.g., chronic pain without a code, menopause symptoms). The door opens to "non-diseases" that burden people.  
  2. **Utility Instruments**:  
     - Ceilings vanish. Instruments could extend beyond 1.0 (e.g., "better than full health" states).  
     - You’d prioritize patient-derived utilities (e.g., DCEs, TTO with *affected patients*) over public valuations—since welfare is personal.  
  3. **Threshold**: Cost-per-QALY remains, but:  
     - The £20-30k threshold would explicitly reflect societal willingness-to-pay for welfare gains, not "health."  
     - Severity weights become core, not exceptions.  
  4. **Underdetermined Practices**:  
     - Cost-effectiveness modeling (structure, discounting) works under both theories.  
     - The threshold (£20-30k) is normativist regardless—it’s a value judgment.  

  ---

  ### **What Wouldn’t Change?**  
  - **QALYs as currency**: They’re already normativist, so the unit stays.  
  - **Modeling techniques**: Decision trees, Markov models—these tools are theory-agnostic.  

  ---

  ### **The Bottom Line**  
  Your system is **already normativist** in practice—it uses diagnoses (naturalism) as a legal/scientific gatekeeper but relies on QALYs (normativism) for valuation. The hybrid creates your tensions. Embracing normativism wouldn’t wreck the machinery; it would:  
  - **Fix (b)** by admitting instruments measure welfare, not biology.  
  - **Justify (a)** as explicit equity weighting.  
  - **Solve (c)** by allowing instruments to capture all welfare loss.  

  **But caution**: Dropping diagnoses might invite low-priority submissions (e.g., "hair loss distress"). If you keep them, admit they’re administrative tools—not definitions of health. The philosophy isn’t idle—it explains why your model feels inconsistent and how to fix it. **Your real problem isn’t (a)/(b)/(c)—it’s the unexamined normativism dressed in naturalist clothing.**
