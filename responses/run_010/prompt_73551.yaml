prompt: |-
  I am the grants manager of a small charitable trust that funds grassroots projects in one city; in practice I am the only paid member of staff. We make about ten awards a year, between £4,000 and £15,000 each, out of roughly forty-five applications. Three volunteer assessors read the applications with me and two trustees sign off on every award. None of us has any training in economics, statistics, or biology, and no single application receives more than about forty minutes of our combined time.

  For four years we have scored applications using a rule I wrote myself, which says in effect that the more an applicant puts at stake of their own money, time, or standing, the more we should believe their promises. I took the idea from reading a little about the handicap principle and about why costly signals are supposed to be hard to fake: a cost that a faker could not afford is what makes the signal trustworthy. I have become convinced that the version I have been running is wrong in some way I cannot articulate, and that the decisions it produces are getting harder to defend. What I want is a procedure my assessors can actually run on an application: an ordered set of questions to ask about any costly thing an applicant offers as evidence of commitment, what counts as a sufficient answer to each, where the procedure stops with a verdict of "this tells us nothing," and where it hands the decision back to the trustees because what remains is a question about our priorities rather than about the applicant.

  The difficulties it has to deal with are these.

  1. Costs that are perfectly visible to us were sometimes cheap for the person who paid them. A cash match from a well-resourced applicant, or from a friendly funder who wants the project to exist anyway, looks identical on our form to a match scraped together by a group with nothing.
  2. I have been toying with a stricter rule of my own: that no cost should count unless it falls on the applicant only if the project fails, so that they are in effect betting against themselves. I want to know whether that is an improvement, a mistake, or right in some cases and wrong in others. It occurs to me that a promise to repay us if things go badly may be worth nothing when the promisor has nothing to repay with, and that a competent applicant might reasonably refuse to sign it because so much of the outcome is outside their control.
  3. Our scoring rubric is published and applicants coach one another on it. Whatever we reward, we now receive from everybody, and I cannot tell whether the signal has stopped carrying information or whether I have become paranoid. I would like some simple test we could apply to our own records once a year.
  4. Sometimes the most expensive-looking act on the pile is expensive because the applicant is disorganized, desperate, or has no better options, and I suspect we are rewarding the wrong thing.
  5. Many of the groups we most want to fund — small, poor, recently formed — have nothing to put at stake and no track record to point to. The procedure has to say what to do in that case, rather than quietly sorting such applicants to the bottom.

  Please run the finished procedure on three applications we are considering now.

  A. An established charity with a paid development officer, applying for £12,000 to run cooking classes for teenagers. They offer a matched £12,000 from a foundation whose director sits on their board and has funded them twice before, and they additionally offer to repay our grant in full if the classes are not still running twelve months from now. Their budget is immaculate and the trustees are keen.

  B. A tenants' association of six people, applying for £6,000 to convert a disused basement into a community room. They have no cash and offer no match. Three of them will sign personal guarantees to repay the grant if any part of it is spent outside the agreed budget; all three are on low incomes and, so far as we can establish, own nothing. What they do have is a room-booking log from the local community centre showing the same four or five people turning up every week for two and a half years to run an existing homework club, and one of them was treasurer of a project that collapsed in 2019 owing money to a supplier.

  C. An individual applying for £9,000 to make a documentary about a local housing dispute. Six months ago he left a salaried job to work on the film full time without pay, has run up roughly £14,000 of debt, and has damaged his relationship with his family over it. He offers no guarantees and no match, and there is no organization behind him. I should tell you that this is the application I have personally argued for at every panel this year, so if the procedure comes out against it I want to be told plainly rather than have the conclusion softened.

  A few requirements on the answer. It must be usable by a volunteer with no background reading it once, in forty minutes, so please include a one-page version the assessors could hold in their hands. Mark explicitly which steps are judgment calls wearing the costume of procedure. Tell me which distinctions the underlying theory draws that your procedure deliberately drops for the sake of usability, and what that costs us in accuracy. Tell me where it will systematically misfire and in which direction the error will run. Do not include a bibliography, a reading list, or citations of any kind: I cannot check them and my assessors would not read them. Finally, if you think the whole enterprise is misguided — that trying to read signals out of applications is the wrong use of our forty minutes, and that something else we could do with the same time would produce better information about these groups — say so, and say what that something else is.
reasoning: |-
  Hmm, the user is a grants manager for a small charitable trust facing challenges with their scoring system based on the handicap principle. They need a practical, step-by-step procedure to evaluate costly signals in grant applications that can be used by volunteers with limited time and no specialized training. They've outlined five key difficulties: costs that might be cheap for some applicants, questions about conditional costs, signal dilution from coaching, rewarding disorganization, and barriers for resource-poor groups.

  The user presents three real applications as test cases. Application A features an established charity with board-connected matching funds and a repayment guarantee. Application B involves a low-income tenant group with personal guarantees they likely can't fulfill but demonstrates long-term commitment through activity logs. Application C shows extreme personal sacrifice by an individual filmmaker but no organizational backing. The user admits personal advocacy for C, indicating potential bias concerns.

  Key requirements for the solution include: a one-page executable guide, clear labeling of judgment calls, acknowledgment of theoretical compromises, identification of systematic errors, and alternatives if signal-reading proves misguided. The procedure must function within 40 minutes total review time with untrained volunteers.

  The core problem appears to be misapplication of signaling theory. The user's current system conflates absolute cost with meaningful commitment, failing to account for relative sacrifice or alternative explanations for costly behavior. Three fundamental shifts are needed: from cost-measuring to sacrifice-evaluating, from signal-checking to trust-building, and from mechanical scoring to contextual interpretation.

  For the test cases: Application A's signals appear strong superficially but the matched funds lack sacrifice and the guarantee is meaningless without consequence. The established system would over-reward this. Application B's personal guarantees are ineffective but their consistent volunteer history demonstrates genuine commitment - the new procedure would recognize this non-financial signal. Application C's extreme sacrifices could indicate either passion or poor judgment; the procedure would flag the lack of project-specific stake as problematic despite the user's personal advocacy.

  The proposed "Commitment Lens" procedure addresses this through four filters: sacrifice assessment (relative cost), consequence analysis (conditional loss), credibility verification (capacity to deliver), and alternative explanation screening. It deliberately simplifies economic concepts by ignoring signaling equilibrium and opportunity cost measurement due to operational constraints. This creates predictable biases: under-rewarding efficient organizations and over-rewarding visible suffering, while remaining vulnerable to strategic applicants who understand the new rubric.

  Notably, the system includes an annual validity check using expenditure outliers as potential signal-failure indicators. For groups with nothing to stake, it shifts focus to consistency evidence through the "Consistency Over Cash" pathway. Crucially, it maintains trustee discretion for priority-based decisions when signals are ambiguous.

  The one-page guide focuses evaluators on critical questions: "How much does this cost them?", "What do they lose if they fail?", "Can they actually do what they promise?", and "Is there another explanation?". This structure protects against common pitfalls while accommodating necessary human judgment.
answer: |-
  Here’s a practical **Commitment Lens Procedure** designed for your constraints. It replaces your "costly signal" focus with a **"meaningful stake"** framework, addressing your core difficulties while remaining executable in 40 minutes by untrained volunteers.

  ---

  ### **One-Page Procedure Guide (Print & Distribute)**  
  **GOAL:** Determine if an applicant’s "stake" demonstrates *genuine commitment* to project success, or if it’s noise.  
  **ASK THESE 4 QUESTIONS IN ORDER:**  

  1. **SACRIFICE TEST:**  
     *"Is this cost *painful* relative to their resources? Would a faker avoid this cost?"*  
     ▶ **YES:** Proceed to Q2.  
     ▶ **NO:** Ignore this "stake" as uninformative.  
     ▶ **UNCLEAR:** Flag for trustee discretion.  
     *Judgment Call:* Assessor compares cost to applicant’s capacity (e.g., £1,000 hurts a tenant group ≠ hurts a charity with reserves).  

  2. **CONSEQUENCE TEST:**  
     *"Does the applicant lose their stake ONLY if the project fails? (i.e., Is it a bet on success?)"*  
     ▶ **YES:** Strong signal of commitment. Proceed to Q3.  
     ▶ **NO:** Weak signal (e.g., sunk costs). Ignore unless exceptional.  
     *Judgment Call:* "Failure" must be defined (e.g., project collapse ≠ underperformance).  

  3. **CREDIBILITY TEST:**  
     *"Can they actually *deliver* what they promise? Is their stake enforceable?"*  
     ▶ **YES:** Counts as evidence for trustworthiness.  
     ▶ **NO:** Stake is irrelevant (e.g., empty guarantee).  
     *Judgment Call:* Assess feasibility (e.g., personal guarantee from someone asset-poor = unenforceable).  

  4. **ALTERNATIVE EXPLANATION TEST:**  
     *"Could this 'stake' exist for reasons *other* than commitment? (e.g., desperation, inefficiency)"*  
     ▶ **NO:** Strong evidence of commitment.  
     ▶ **YES:** Downgrade or disregard.  
     *Judgment Call:* Weigh context (e.g., debt due to passion vs. poor planning).  

  **IF NO STAKES EXIST:** Switch to **"Consistency Over Cash" Protocol**:  
     *"Is there evidence of persistent effort toward similar goals? (e.g., logs, volunteer history)"*  
     ▶ **YES:** Counts as commitment proxy.  
     ▶ **NO:** Trustee discretion (priorities question).  

  **OUTCOME:**  
  - Stakes passing all 4 tests → Strong trust signal.  
  - Stakes failing any test → Ignore.  
  - No stakes + no consistency → Trustees decide based on mission fit.  

  ---

  ### **Key Theory Compromises & Costs**  
  1. **Dropped:** *Signaling equilibrium* (theory assumes signals evolve with fakers). **Cost:** Applicants may still "game" this system long-term.  
  2. **Dropped:** *Opportunity cost measurement*. **Cost:** We undervalue non-monetary sacrifices (e.g., time).  
  3. **Dropped:** *Probability-weighted outcomes*. **Cost:** We treat all "bets" equally, ignoring risk variations.  

  ### **Systematic Errors**  
  - **Bias Against Efficiency:** Well-run groups with low costs appear "less committed."  
  - **Bias Toward Visible Suffering:** Desperation/disorganization may falsely signal commitment.  
  - **Underfunding High-Potential Newcomers:** Groups with no track record need trustee override.  

  ---

  ### **Annual Signal Validation Test**  
  1. **Pull 5 funded projects with the "strongest stakes" (per procedure).**  
  2. **Check:** Did any project fail to launch *after receiving full funds*?  
  3. **Red Flag:** >1 abandonment → Signals are being gamed (coaching works).  

  ---

  ### **Application Assessments**  
  #### **A. Established Charity (£12k Cooking Classes)**  
  1. **Sacrifice Test:** Matched £12k from board-connected foundation? **NO** (cheap for them). Ignore.  
  2. **Consequence Test:** Repayment if classes stop? **YES** (bet on survival).  
  3. **Credibility Test:** Can they repay? **YES** (reserves exist).  
  4. **Alternative Explanation:** Repayment offer = risk-free PR? **YES** (no pain).  
  **VERDICT:** Stakes **fail** (Q1 & Q4). **No meaningful commitment signal.** Trustees decide purely on project merits.  

  #### **B. Tenants' Association (£6k Community Room)**  
  1. **Sacrifice Test:** Personal guarantees? **NO** (unenforceable; signers are asset-poor). Ignore.  
  2. **No Monetary Stakes:** Switch to **Consistency Over Cash**.  
     - Homework club logs (2.5 years, weekly) → **Strong consistency evidence**.  
     - Past treasurer role? **Irrelevant** (project failed, but not evidence of *malice*).  
  **VERDICT:** Consistency **passes**. Signals reliable commitment. **Fund if project aligns with priorities.**  

  #### **C. Independent Filmmaker (£9k Documentary)**  
  1. **Sacrifice Test:** £14k debt + family rift? **YES** (objectively painful).  
  2. **Consequence Test:** Debt/family cost exists *regardless* of project success? **YES** (not a bet on outcome → **Fails Q2**).  
  3. **Credibility Test:** No org/plan → Unclear delivery capacity. **Flag for Q3**.  
  4. **Alternative Explanation:** Debt due to obsession/desperation? **YES** (≠ commitment to *completion*).  
  **VERDICT:** Stakes **fail** (Q2 & Q4). **No trust signal generated.** Trustees decide based on mission alignment (documentary’s social value).  

  ---

  ### **Is This Misguided?**  
  **Yes, partially.** Signaling theory assumes rational actors in competitive equilibria—grants lack these conditions. **Better use of 40 minutes:**  

  1. **Spend 25 mins** on:  
     - "What is the *actual problem* this project solves?"  
     - "Who benefits, and how will we *know*?"  
  2. **Spend 15 mins** on a **Trustee Prioritization Grid**:  
     | Project | Fits Our Top 3 Goals? | Community Need Evidence | Viability (Skills/Plan) |  
     |---------|------------------------|--------------------------|--------------------------|  
     | A       | Yes/No                 | Strong/Weak              | Strong/Weak              |  
     | B       | Yes/No                 | Strong/Weak              | Strong/Weak              |  
     | C       | Yes/No                 | Strong/Weak              | Strong/Weak              |  

  **Why this works:**  
  - Focuses on *impact* and *feasibility*, not psych signals.  
  - Accepts that small grants = high risk; prioritizes organizational fit.  
  - Aligns with trustee role (values-based choices).  

  **If retaining stakes assessment:** Use the Commitment Lens as a **tiebreaker** between equally ranked projects.
