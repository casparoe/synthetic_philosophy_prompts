prompt: |-
  I am in the fourth year of a doctoral programme that straddles economic history and philosophy, and the chapter I am currently stuck on concerns the logic of path dependence: whether a historical process, once it has taken a certain early branch, is thereafter locked in, and what would have to be true for us to say that the same general outcome would have arrived anyway had some particular person or event been absent. My supervisor's standing objection is that I keep sliding between a metaphysical claim (the outcome was necessitated by structural conditions) and a claim about expectations (agents who believe an outcome is coming act in ways that bring it about), and that these have quite different implications for whether counterfactual history is even well posed. Looking for an older and sharper version of that slide, I came across G. V. Plekhanov's 1898 essay on the role of the individual in history — first published in a Russian journal, here in the 1961 Lawrence & Wishart translation from his *Selected Works*, Volume II, as reproduced on the Marxists Internet Archive — and I cannot make up my mind about the following stretch. It comes after a long opening digression in which he attacks a certain Kablitz, and an anonymous "esteemed sociologist," for what he calls a "factors" theory of progress.

  Please take the role of a professional philosopher and intellectual historian who works on nineteenth-century debates about necessity, free will, and the philosophy of history. Think carefully, and work strictly from the passage I give you: I do not want a reading list, citations, or a general précis of historical materialism, and if you do not recognise one of the names or allusions, say so plainly and reason from internal evidence rather than guessing. Please also flag any point where a difficulty looks likely to be an artefact of the English translation rather than part of the philosophical content.

  > "Indeed, the 'factors' theory is unsound in itself, for it arbitrarily picks out different sides of social life, hypostasises them, converts them into forces of a special kind, which, from different sides, and with unequal success, draw the social man along the path of progress." […] "It never occurred to the 'esteemed sociologist' that the 'factors' point of view is alien to dialectical materialism, and that only one who is utterly incapable of thinking logically can see in it any justification of so-called quietism." […]
  >
  > "Materialists began to be accused of betraying leanings towards quietism even before they had worked out their dialectical conception of Nature and of history. Without making an excursion into the 'depth of time,' we will recall the controversy between the celebrated English scientist, Priestley, and Price. Analysing Priestley's theories, Price argued that materialism was incompatible with the concept free will, and that it precluded all independent activity on the part of the individual. In reply Priestley referred to everyday experience. He would not speak of himself, he said, though by no means the most apathetic of creatures, but where would one find more mental vigour, more activity, more force and persistence in the pursuit of extremely important aims, than among those who subscribe to the doctrine of necessity? Priestley had in view the religious, democratic sect then known as Christian Necessarians. […] We do not know whether this sect was as active as Priestley, who belonged to it, thought it was. But that is not important. There cannot be the slightest doubt that the materialist conception of the human will is quite compatible with the most vigorous practical activity. Lanson observes that 'all the doctrines which called for the utmost exertion of human will asserted, in principle, that the will was impotent; they rejected free will and subjected the world to fatalism.' […] Lanson was wrong in thinking that every repudiation of what is called free will leads to fatalism; but this did not prevent him from noting an extremely interesting historical fact. Indeed, history shows that even fatalism was not always a hindrance to energetic, practical action; on the contrary, in certain epochs it was a psychologically necessary basis for such action. In proof of this, we will point to the Puritans, who in energy excelled all the other parties in England in the seventeenth century; and to the followers of Mohammed, who in a short space of time subjugated an enormous part of the globe, stretching from India to Spain. Those who think that the conviction that a certain series of events is inevitable is sufficient to cause all psychological possibility of helping on, or counteracting, these events to disappear, are very much mistaken. Here, everything depends upon whether my activities constitute an inevitable link in the chain of inevitable events. If they do, then I waver less and the more resolute are my actions. There is nothing surprising in this: when we say that a certain individual regards his activities as an inevitable link in the chain of inevitable events, we mean, among other things, that for this individual, lack of free will is tantamount to incapability of inaction, and that this lack of free will is reflected in his mind as the impossibility of acting differently from the way he is acting. This is precisely the psychological mood that can be expressed in the celebrated words of Luther: 'Here I stand, I can do no other,' […]"

  Begin with a short, unstructured brainstorm — jot down every distinct reading of the passage you can generate, including ones you think are wrong, before you commit to any of them. Then work through the following in order:

  1. Give a premise-and-conclusion reconstruction of the argument running from the Priestley–Price anecdote to the final sentence, marking which premises are empirical and which conceptual, and identifying the single inference you think is weakest.
  2. Do the Puritans and "the followers of Mohammed" function as evidence for a general claim, or only as illustrations that a certain combination is possible? Is he vulnerable to the objection that he has selected precisely those movements whose convictions of inevitability were vindicated, and does anything in the passage suggest he sees the worry?
  3. I can read the pivotal sentence — "Here, everything depends upon whether my activities constitute an inevitable link in the chain of inevitable events" — in at least three ways: (a) a purely psychological claim about how a belief affects resolve; (b) a compatibilist claim about causal structure, on which my agency is itself among the necessitating conditions, so that inevitability and vigorous action are not rival hypotheses; (c) a reflexive claim, on which the belief in inevitability helps produce the outcome believed, so that part of the "necessity" is manufactured by expectations. Which reading does the passage actually support, and which specific words decide it? In particular, is the "everything depends upon" a dependence inside the agent's head or a dependence in the world?
  4. The formulation "lack of free will is tantamount to incapability of inaction," immediately followed by "this lack of free will is reflected in his mind as the impossibility of acting differently from the way he is acting," looks redundant to me. What work is the second clause doing that the first is not? Does it make the agent's self-representation part of the mechanism — must the agent represent his own determination *as* determination — and if so, does the mechanism require that representation to be true?
  5. He quotes Lanson's generalisation and then says Lanson was "wrong" about it while still having noted "an extremely interesting historical fact." Where exactly does he think Lanson overreached: in the scope of the generalisation, in equating the repudiation of free will with fatalism, or elsewhere? And what distinction does he need between "fatalism" and a mere "conviction that a certain series of events is inevitable"?
  6. Is the opening attack on the "factors" theory load-bearing for these later claims, or an independent polemical target? If one rejects the picture of social life as the resultant of separately hypostasised forces pulling from different sides, is one thereby committed to treating individual agency as not an independent variable in historical explanation — and does that commitment sit comfortably with reading (c) from question 3?
  7. On the Luther line: I do not know how much historical weight "Here I stand, I can do no other" will bear, and I would rather not have my argument rest on it. Tell me how much of the passage's force depends on the example being a genuine report of an agent's self-understanding rather than a later legend, and whether his use of it requires that.
  8. Finally, the payoff for my chapter. On the basis of this passage alone, is Plekhanov committed to the view that history is locked in — that the same general outcome would have arrived through different particular events had some individual been absent — or does the reflexive mechanism leave room for outcomes that depend essentially on what agents believe about their inevitability, such that a different belief could have selected a different equilibrium? Say what the passage licenses, say explicitly where you would need the rest of the essay to settle the question, and do not supply what you imagine the rest of the essay says.

  Close with two things: a diagnosis of which of my supervisor's two claims — the metaphysical one or the expectations one — this passage most clearly runs together, plus a single sentence I could put in a footnote that states the distinction without begging the question against either reading; and a brief list of the points on which you are least confident, including any allusion you could not place.
