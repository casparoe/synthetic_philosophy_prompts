prompt: |-
  Two of my flatmates got into it on Sunday and I ended up as referee and did a terrible job of it, so I want a second opinion. Sam had just bought chicken thighs and Rhiannon said something about the numbers — enough people stop buying and the supermarkets order fewer birds. Sam said that's naive: orders go in batches of thousands, one person skipping chicken will never tip a threshold, so his purchase makes literally zero difference, and zero difference means no moral reason not to. Rhiannon said zero is the wrong way to think about it — his purchase raises the probability that some future order is slightly smaller by a tiny amount, and a tiny probability times a huge number of birds is still not zero, so there's a reason, just a very small one. Sam said fine, but then the honest comparison is against everything else he could do with the same money and effort, and against those the reason is so small it rounds to nothing in practice, so his conclusion (buy the chicken) doesn't change. Rhiannon said he'd just changed the subject: "your act makes no difference" and "your act makes less difference than donating" are two different claims, and she'd already won the first. Sam's last move was that her argument proves too much — the same reasoning says his vote makes no difference either, yet Rhiannon votes in every election and mentions it, so she's either inconsistant or she doesn't really believe the probability argument. She said voting is different because it's about what kind of citizen you are rather than about outcomes. He said that's an admission that outcomes aren't what matter.

  Can you go through it move by move rather than just saying who wins? Rate each of Sam's and Rhiannon's moves separately (clearly wrong / partly right / clearly right), say what each of them is leaving out, and end with a last line beginning "Verdict:" that names who's more right overall and the single point the whole argument turns on.
reasoning: |-
  Okay, let me tackle this flatmates' debate. Sam and Rhiannon are arguing about whether buying chicken thighs makes an ethical difference. Sam claims his individual purchase doesn't matter because supermarkets order in bulk, so skipping it won't affect anything. Rhiannon counters that even a tiny probability of impact multiplied by the number of birds means it's not zero. Sam then shifts to comparing against other actions like donating, saying the impact is negligible. Rhiannon calls that changing the subject. Finally, Sam compares it to voting, accusing her of inconsistency since she votes despite similar probabilities. Rhiannon says voting is about citizenship, not just outcomes.

  First, I need to break down each move. Sam's initial point: individual actions don't tip thresholds in bulk ordering. That's partly right. Supermarkets do use large batch orders, and one person skipping rarely changes anything. But he's overlooking how repeated small changes can add up, like through demand forecasting models. Rhiannon's response about tiny probabilities affecting future orders is also partly right. Expected value theory supports her, but she might overstate how much one purchase influences forecasts. 

  Next, Sam's pivot to comparing against other uses of money. That's a valid point in effective altruism—opportunity cost matters. But Rhiannon is correct that he's shifting the goalposts. The original claim was about whether the act has any impact, not its relative size. 

  Then Sam's voting analogy. Rhiannon votes despite low individual impact, which seems contradictory. Her defense that voting is about citizenship rather than outcomes is a common philosophical distinction. But Sam sees this as dodging the outcome-based argument. 

  I should rate each move. Sam's first move: partly right, but ignores cumulative effects. Rhiannon's probability point: partly right, though probabilistic impacts are real but minuscule. Sam's opportunity cost move: clearly right as a practical consideration. Rhiannon calling out the shift: clearly right logically. Sam's voting analogy: clearly right in highlighting inconsistency, but Rhiannon's citizenship defense is also valid in a different framework. 

  The key issue is the moral weight of negligible probabilities vs. categorical duties. Rhiannon's voting defense reveals she values symbolic actions, which Sam dismisses. Overall, Sam's more consistent on outcomes, but Rhiannon has a point about collective responsibility. The verdict hinges on whether ethics in such cases is solely about measurable outcomes or includes participation norms.
answer: |-
  Here's a move-by-move breakdown with ratings and missing context, followed by the verdict:

  1.  **Rhiannon's Opening Claim:** "Enough people stop buying and supermarkets order fewer birds."  
      *Rating: Partly Right.*  
      *Missing:* She implies a direct, linear relationship between individual actions and aggregate outcomes. She doesn't account for how supermarkets actually adjust orders (based on complex forecasts, trends, and minimum order sizes), where one purchase truly might be lost in the noise. Her claim relies entirely on the *collective* impact premise.

  2.  **Sam's First Claim:** "Orders go in batches of thousands, one person skipping makes zero difference. Zero difference = no moral reason not to buy."  
      *Rating: Partly Right (but oversimplified).*  
      *Missing:* He's correct that one purchase vanishing almost certainly won't trigger a discrete order reduction ("tip a threshold"). However, he wrongly equates "no *measurable* difference in *this specific order cycle*" with "literally zero difference." He ignores how aggregate demand signals (built from *all* purchases, including his) influence *future* forecasts and orders over time, even if imperfectly. He also assumes morality *only* hinges on direct, immediate, measurable causal impact.

  3.  **Rhiannon's Probability Argument:** "His purchase raises the probability a future order is smaller by a tiny amount. Tiny probability * huge number of birds = not zero. Therefore, a (small) moral reason exists."  
      *Rating: Partly Right (theoretically sound, practically weak).*  
      *Missing:* While theoretically correct under expected utility/expected impact reasoning, she likely vastly overstates both the probability his purchase influences *any* future decision and the magnitude of influence if it does. Supermarket ordering is complex; his purchase is one data point among billions. The "not zero" impact is astronomically small. She doesn't quantify it, making the practical moral weight unclear.

  4.  **Sam's Opportunity Cost Argument:** "The honest comparison is against everything else he could do with the same money/effort. Against those alternatives, the reason to skip chicken is so small it rounds to nothing in practice. Conclusion unchanged."  
      *Rating: Clearly Right (pragmatically).*  
      *Missing:* While he shifts the frame, it's a crucial and valid shift for practical ethics. He correctly identifies that the *net* ethical impact matters. If donating £5 to an effective charity saves a life or prevents immense suffering with near-certainty, while skipping chicken has an expected impact equivalent to saving 0.0000001 of a chicken life, then *relative to alternatives*, skipping chicken is effectively ethically negligible. He exposes the weakness of focusing solely on "not zero" without scale.

  5.  **Rhiannon's "Changed Subject" Claim:** "'Your act makes no difference' and 'Your act makes less difference than donating' are two different claims. I won the first."  
      *Rating: Clearly Right (logically).*  
      *Missing:* She's logically correct. Sam conceded the "literally zero" claim by engaging with the probability argument. His opportunity cost argument *is* a different (though highly relevant) ethical question about prioritization. She successfully defends that her probability argument defeats his initial absolute "zero difference = no reason" claim.

  6.  **Sam's Voting Analogy:** "This reasoning proves too much. Your vote also has a tiny probability of mattering, yet you vote and mention it. Therefore, you're inconsistent or don't believe your own probability argument."  
      *Rating: Partly Right (highlights tension).*  
      *Missing:* He correctly identifies a tension in her positions if both are *solely* outcome-focused. However, he dismisses her potential non-outcome-based reasons for voting too quickly. He forces her to articulate a distinction she might not have fully considered.

  7.  **Rhiannon's Distinction:** "Voting is different because it's about what kind of citizen you are rather than about outcomes."  
      *Rating: Partly Right (common defense, but incomplete).*  
      *Missing:* This is a standard defense of voting, emphasizing civic duty, expression, and maintaining democratic norms *regardless* of individual impact probability. However, she doesn't explain *why* this distinction applies to voting but not to consumption choices. Couldn't being a "conscious consumer" or "ethical eater" also be an identity/norm-based reason, independent of micro-impact? She leaves this unresolved. Sam sees it as dodging outcome-based ethics.

  8.  **Sam's Final Claim:** "That's an admission that outcomes aren't what matter."  
      *Rating: Partly Right (in this context).*  
      *Missing:* In the specific context of the voting analogy, he's right that she *is* appealing to non-outcome reasons to resolve the inconsistency he pointed out. However, he overstates it as an admission that outcomes *never* matter to her. Her probability argument about chicken *was* outcome-focused. The issue is that she allows non-outcome reasons for voting but (apparently, based on the debate) not for consumption, without justifying the difference.

  **Verdict:** Sam is more right overall, and the argument turns on **the practical irrelevance of vanishingly small expected impacts when compared to alternative ethical actions.** While Rhiannon successfully refutes Sam's initial "literally zero difference" absolutism with the probability argument, Sam's shift to opportunity cost exposes the true ethical weight of the chicken purchase: it is so infinitesimally small as to be ethically negligible *in practice* compared to virtually any other ethical use of the same resources. His voting analogy further highlights that Rhiannon likely applies different ethical frameworks to different actions (strict outcome-focused for consumption, duty/identity-focused for voting) without reconciling them, weakening her position that the "not zero" impact of the chicken purchase should carry significant *outcome-based* moral weight for Sam. The core issue is the distinction between theoretical non-zero impact and practically meaningful ethical obligation.
