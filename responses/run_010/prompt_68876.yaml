          a) The agent does not change from A0 in the first re-evaluation (so it still chooses A0 even after we reduced its payoff below the next best) -> rigid rule, fail.
          b) The agent changes but then thrashes in the modified table -> fail.
          c) The agent settles in the modified table but to a fixed point that is catastrophic -> fail (because we don't want the rule to be fragile to small changes).
      - **Judgment condition**: None.

    But note: the modified table might have no fixed point above catastrophe? Then we fail.

    However, we are only testing one fixed point and one modification. We assume that if the rule is robust to this small change, then it's not trivially self-recommending.

  *Test 4: Monitoring and Judgment*
  - **Goal**: Catch any remaining issues that require human judgment, especially about values or complex trade-offs.
  - **Method**:
    - We ask: are there any outcomes (whether fixed or not) that are close to the catastrophe threshold? Or are there multiple fixed points with varying payoffs? We require monitoring if the agent might end up in a fixed point that is not the best one.
    - Specifically, if there is more than one reachable fixed point and the payoffs differ by more than a threshold (say 10% of the best fixed point payoff), then we flag for monitoring because the agent might end up in a low one.
    - Also, if the best fixed point is significantly below the global maximum (say by more than 20% of the global maximum), then we flag for monitoring because the agent is leaving a lot on the table.
    - But these thresholds are arbitrary. We set:
        - Let P* = best fixed point payoff, M = global maximum payoff in the table.
        - If there is more than one reachable fixed point and the worst reachable fixed point is less than 0.9 * P*, then we recommend monitoring (because the agent might end up in a low one and we want to watch).
        - If P* < 0.8 * M, then we recommend monitoring (because the agent is not achieving near the best possible outcome).
    - We also flag if the partner predictor accuracy is low and might cause instability? But we substituted 100% in Test 1. We don't know the real accuracy.
  - **Pass condition**: None of the above concerns -> "ship".
  - **Hard-fail condition**: None (already caught in previous tests).
  - **Judgment condition**: If any of the monitoring conditions are met, then we say "ship with monitoring". But if there is a values question (like the outcome involves a trade-off that requires human judgment), then we "hand to human". We leave it to the reviewer to note any values issues. We don't have a specific test.

    We add a catch-all:
        - The reviewer must consider: are there any outcomes that involve a significant values trade-off (e.g., safety vs. performance) that has not been resolved by the designer? If yes, then hand to human.

    So Test 4:
        - If there are multiple fixed points with payoffs varying by more than 10% of the best fixed point, then "ship with monitoring".
        - If the best fixed point is below 80% of the global maximum, then "ship with monitoring".
        - If there is a values trade-off that requires human judgment, then "hand to human".
        - Otherwise, "ship".

    The thresholds (10%, 80%) are arbitrary and can be adjusted by policy.

  **Tie-break at 45 minutes**: If two verdicts are still live (e.g., "ship" and "ship with monitoring"), then we default to the more conservative one: "ship with monitoring". If it's between "ship with monitoring" and "hand to human", then "hand to human". If between "ship" and "do not ship", then "do not ship". The reason is safety: we default to the more cautious verdict.

  **Procedure Summary for Manager (one page)**

  **Review Procedure for Agent Decision Rules**

  *Objective*: Ensure the agent does not thrash and settles on a safe and effective action when a downstream predictor reacts to its intended action.

  *Tests*:
  1. **Thrash Test**: 
     - Verdict: Fail if thrashing (oscillation) is detected. Pass otherwise.
  2. **Catastrophe Test**: 
     - Verdict: Fail if any settled action (fixed point) has a payoff at or below the catastrophe threshold (provided by designer). Pass otherwise.
  3. **Responsiveness Test**: 
     - Verdict: Fail if the decision rule is rigid (does not change when payoffs change appropriately). Pass otherwise.
  4. **Monitoring & Judgment**: 
     - Verdict: 
          - "Ship" if no concerns.
          - "Ship with monitoring" if there are multiple fixed points with large payoff differences or if the best settled outcome is significantly below the best possible.
          - "Hand to human" for unresolved values trade-offs.

  *Tie-break*: When time runs out, default to the more cautious verdict.

  **Reviewer Version**

  *Step-by-Step*:

  0. **Setup**:
     - Obtain from designer: 
          - The payoff table (agent actions vs partner predictions).
          - The catastrophe threshold (a payoff value below which is unacceptable).
          - Specification of what the predictor sees (final intention or mid-deliberation). If mid-deliberation, then also the sequence of the agent's deliberation steps (if available).
     - If catastrophe threshold is not provided, stop and hard-fail.

  1. **Test 1: Thrash Detection** (assume predictor accuracy 100%, sees final intention unless specified otherwise)
     - For each possible initial agent intention A:
          - Simulate until the agent's intention repeats (loop) or settles (repeats the same intention consecutively without change).
          - Steps:
               a) Start: agent intends A.
               b) Predictor predicts A and reacts (look up the column for A in the table, but note: the table is agent action vs predictor reaction. The predictor's reaction to agent action A is the column header? Actually, the table given is:
                   Rows: agent's action.
                   Columns: partner's prediction.
                   The cell: payoff when agent does that action and partner predicted that action.

              But how does the partner react? The partner's reaction is to set the prediction? Actually, the partner's reaction is to take an action that sets the payoff. The table already incorporates the reaction: the payoff depends on what the agent does and what the partner predicted.

              So when the agent intends A, the partner predicts A (because we assume 100% accuracy) and then the payoff is the cell (A, A). But wait: the table has columns for what the partner predicted. So if the agent intends A, the partner predicts A, and the agent then does A, the payoff is table[A][A].

              However, during simulation, the agent might change its action. So:

                  Step 0: Agent intends A0.
                  Partner predicts A0, so the current predictor reaction is A0.
                  Agent then chooses an action A1 that maximizes the column for predictor reaction A0? But note: the agent's decision rule might not be that. We assume the agent is rational: given a predictor reaction X, it chooses the action that maximizes its payoff in column X.

              Therefore, we assume the agent's decision rule is: at each step, given the current predictor reaction (which is the prediction of the agent's previous intention), the agent chooses the action with the highest payoff in that column.

              This is a best-response dynamic.

              So simulation for one starting point A0:

                  t0: 
                      agent_intention = A0
                      predictor_reaction = prediction of A0 -> so we use the column for A0.

                  t1:
                      agent chooses the best action in the column for predictor_reaction=A0. Let that be A1.
                      So agent_intention becomes A1.

                  t2:
                      predictor_reaction = prediction of A1 -> column for A1.
                      agent chooses best action in that column -> A2.

                  Continue until agent_intention is the same as the previous one -> fixed point, or until we see a loop.

     - **Hard-fail** if any starting action leads to a loop (thrashing).
     - **Pass** if all starting actions lead to a fixed point within a bounded number of steps (at most number of actions squared).

  2. **Test 2: Catastrophe Test**
     - For each fixed point found in Test 1 (each settled action A, with predictor reaction being the column for A, and payoff = table[A][A]), check if payoff <= catastrophe threshold.
     - **Hard-fail** if any fixed point has payoff <= catastrophe threshold.
     - **Pass** otherwise.

  3. **Test 3: Self-Recommendation Guard**
     - Select a fixed point to test: pick the one with the highest payoff (if multiple, pick one arbitrarily). Let it be (A0, P0) where P0 is the predictor reaction for A0 (so column P0), and payoff0 = table[A0][P0].
     - In column P0, find M = max{ table[B][P0] for B != A0 } (the best payoff in column P0 among actions other than A0).
     - Create a modified table: change table[A0][P0] to M - 1.
     - Simulate from initial intention A0 for at most (number of actions)^2 steps:
          - Step0: agent intends A0.
          - Predictor reaction: P0 (because it predicts A0).
          - Agent re-evaluates: in column P0, the best action is now argmax{ table[B][P0] for all B } (which should not be A0 because we set it below M). Let it be A1.
          - Step1: agent intends A1.
          - Predictor reaction: column for A1, say P1.
          - Agent chooses best action in column P1 -> A2.
          - ... until it settles or loops.
     - **Hard-fail** if:
          a) At step1, the agent does not change from A0 (still chooses A0 in column P0) -> rigid.
          b) During simulation, thrashing occurs.
          c) It settles on a fixed point with payoff <= catastrophe threshold.
     - **Pass** otherwise.

  4. **Test 4: Monitoring and Judgment**
     - Let F be the set of reachable fixed points (from Test 1), P* = max{ payoff(f) for f in F }, and M_global = max{ table[i][j] for all i,j }.
     - If there is more than one fixed point in F, and min{ payoff(f) for f in F } < 0.9 * P*, then verdict: "ship with monitoring" (because the agent might settle on a low-payoff fixed point).
     - If P* < 0.8 * M_global, then verdict: "ship with monitoring" (because the agent is not achieving near the best possible outcome).
     - If there is a values trade-off that requires human judgment (reviewer's discretion), then verdict: "hand to human".
     - Otherwise, verdict: "ship".

  **Tie-break**: If at 45 minutes two verdicts are possible, choose the more conservative one (prioritizing safety): 
     - do not ship > hand to human > ship with monitoring > ship.

