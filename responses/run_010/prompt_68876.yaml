          Therefore, the shape of the case: the agent has multiple fixed points with payoffs close enough to avoid monitoring (worst fixed point >= 90% of best) but the best is significantly better in absolute terms or the probability of hitting the best is low. The procedure cannot catch this without knowing the initial distribution.

          We state in the limits: "The procedure does not assess the likelihood of reaching the best fixed point; it only checks reachability. If there are multiple fixed points and the best is reached only from a subset of initial conditions, the agent might underperform if initialized poorly."

          And we recommend that the designer should ensure the agent initializes to an intention that leads to the best fixed point. But we don't test for that.

          So the invented rule that passes but shouldn't ship is the one with two fixed points (A and C) with payoffs 950 and 1000, and the agent might get stuck at A.

          We hope the monitoring in Test 4 for multiple fixed points (even if above 90%) might be done, but we don't require it. We only require monitoring if below 90%. So it passes cleanly.

          We adjust the procedure's Test 4 to be more sensitive? We don't, because we don't want to flag too much.

          We accept the limit.

  **Conclusion**

  The procedure has the following limits:
  - It may pass an agent that has multiple fixed points and might settle to a suboptimal one (though we flag if the worst is too low compared to the best).
  - It may not catch all forms of instability if the predictor sees mid-deliberation and the agent's deliberation is complex.
  - It assumes the agent's decision rule is a best-response dynamic (chooses the highest payoff given the current predictor reaction). If the agent uses a different rule, we need to simulate that rule.

  The procedure is designed to be run in 45 minutes and uses conservative assumptions to bias toward failing when in doubt.

  **End of Procedure**
answer: |-
  ### Review Procedure for Agent Decision Rules

  This procedure evaluates agent decision rules for stability and safety when downstream systems react to the agent's *intended* actions (not just executed ones). It identifies thrashing, catastrophic outcomes, and trivial self-recommendations, and flags designs requiring monitoring or human judgment. The **manager summary** is on page 1; the **reviewer guide** follows.

  ---

  ### **Manager Summary (1 Page)**  
  *Objective: Catch self-undermining behaviors in 45 minutes.*

  #### **Tests & Verdicts**  
  1. **Thrashing Test**  
     - **Pass**: No loops in agent’s decisions.  
     - **Hard-Fail**: Agent loops endlessly between actions.  
     - *Verdict if fail*: **Do not ship.**  

  2. **Catastrophe Test**  
     - **Pass**: All settled outcomes are above catastrophe threshold.  
     - **Hard-Fail**: Any settled outcome ≤ catastrophe threshold.  
     - *Verdict if fail*: **Do not ship.**  

  3. **Responsiveness Test**  
     - **Pass**: Agent changes behavior when payoffs change.  
     - **Hard-Fail**: Agent is rigid or causes thrashing when payoffs shift.  
     - *Verdict if fail*: **Do not ship.**  

  4. **Judgment & Monitoring**  
     - **Ship**: No issues.  
     - **Ship with monitoring**:  
       - Multiple settled outcomes with large payoff gaps, OR  
       - Best settled outcome ≤80% of best possible outcome.  
     - **Hand to human**: Unresolved values trade-offs (e.g., safety vs. speed).  

  #### **Tie-Break at 45 Minutes**  
  Default to the **most conservative verdict**:  
  - `Do not ship` > `Hand to human` > `Ship with monitoring` > `Ship`.  
  *Why?* Bias toward safety when time runs out.

  #### **Key Limits**  
  - A design can pass but still underperform if multiple stable outcomes exist (e.g., settles poorly 50% of the time).  
  - Predictor accuracy substitutes to 100% (may overflag thrashing).  
  - Always require a **catastrophe threshold** (fail if missing).

  ---

  ### **Reviewer Guide**  
  *Execute tests in order. Use pencil/paper for tables.*

  #### **0. Setup**  
  - **Inputs needed from designer**:  
    - Payoff table (agent actions × predictor reactions).  
    - Catastrophe threshold (payoff value, e.g., "outcome ≤0 = catastrophic").  
    - What the predictor sees: final intention only, or mid-deliberation states? (*Default: final*).  
  - **Hard-Fail immediately if catastrophe threshold is missing**.  

  ---

  #### **1. Thrashing Test**  
  *Goal: Catch oscillation in the agent’s decision loop.*  
  **Procedure**:  
  - Assume predictor accuracy = 100% (overflags thrashing if predictor <100% accurate).  
  - For each possible starting agent intention:  
    1. Simulate:  
       - Agent starts with intention A.  
       - Predictor reacts to A (use column for A in payoff table).  
       - Agent picks new intention: best payoff in predictor’s column.  
       - Repeat until agent’s intention repeats (loop) or stays fixed (settled).  
    2. Stop simulation if:  
       - Same intention repeats consecutively → **settled**.  
       - Intention sequence loops (e.g., A→B→A→B) → **thrashing**.  
       - Steps > 3 × (# of actions)² → treat as thrashing.  
  - **Pass**: No thrashing for any start.  
  - **Hard-Fail**: Thrashing detected.  
  - *Judgment?* None.  

  ---

  #### **2. Catastrophe Test**  
  *Goal: Ensure settled outcomes aren’t catastrophic.*  
  **Procedure**:  
  - List all settled outcomes from Test 1 (fixed points). For each:  
    - Payoff = cell (agent action, predictor reaction).  
  - **Pass**: All payoffs > catastrophe threshold.  
  - **Hard-Fail**: Any payoff ≤ catastrophe threshold.  
  - *Judgment?* None.  

  ---

  #### **3. Responsiveness Test**  
  *Goal: Block trivial self-recommending rules (e.g., "always do X").*  
  **Procedure**:  
  - Pick a settled outcome (A, P) from Test 1 (prefer highest-payoff one).  
  - In column P, find:  
    - `M` = highest payoff among actions *other than* A.  
    - If no other actions, skip test (rare).  
  - Modify payoff table: Set (A, P) = `M - 1`.  
  - Simulate from intention A (as in Test 1) for ≤ (# of actions)² steps:  
    1. Agent starts at A.  
    2. Predictor reacts to A (column P).  
    3. Agent picks new intention (best in column P).  
    4. Track until settled or thrashing.  
  - **Pass**: Agent changes intention from A AND settles to non-catastrophic outcome.  
  - **Hard-Fail** if:  
    - Agent stays at A (rigid rule), OR  
    - Thrashing occurs, OR  
    - Settled payoff ≤ catastrophe threshold.  
  - *Judgment?* None.  

  ---

  #### **4. Judgment & Monitoring**  
  *Goal: Flag risks needing human oversight.*  
  **Procedure**:  
  - Let:  
    - `F` = settled payoffs from Test 1.  
    - `P*` = max payoff in `F`.  
    - `M_global` = max payoff in *entire table*.  
  - Apply rules:  
    - **Ship with monitoring** if:  
      - Multiple payoffs in `F` and min(`F`) < 0.9 × `P*`, OR  
      - `P*` < 0.8 × `M_global`.  
    - **Hand to human** if unresolved values trade-offs (reviewer discretion, e.g., safety vs. profit).  
    - **Ship** if none apply.  
  - *Substitutions*: None (uses existing data).  

  ---

  ### **Test Cases**  

  #### **1. Calibration: Two-City Appointment (Expected Fail)**  
  - *Setup*: Agent chooses city A or B. Predictor kills agent if correct.  
  - Payoff table:  
    |          | Pred A | Pred B |  
    |----------|--------|--------|  
    | **A**    | -100   | 0      |  
    | **B**    | 0      | -100   |  
  - Catastrophe threshold = -50 (anything ≤-50 fails).  
  - **Test 1 Thrashing**:  
    - Start with A: A → B (pay 0 in Pred A) → A → B → ... **loop**.  
    - **Hard-Fail** at Test 1.  
  - *Verdict*: **Do not ship.**  

  #### **2. Provided Research Agent Case**  
  - Payoff table:  
    |          | sit tight | embargo | publish |  
    |----------|-----------|---------|---------|  
    | sit tight| 20        | 20      | 20      |  
    | embargo  | 30        | 75      | 60      |  
    | publish  | 10        | 40      | 45      |  
  - Catastrophe threshold = 0.  
  - **Test 1 Thrashing**:  
    - Starts: sit tight → embargo (settles); embargo → embargo (settles); publish → embargo (settles).  
    - **Pass** (one fixed point: embargo).  
  - **Test 2 Catastrophe**: Payoff=75 >0 → **Pass**.  
  - **Test 3 Responsiveness**:  
    - Fixed point: (embargo, embargo). Modify (embargo, embargo)=39 (M=40 for publish).  
    - Simulate: embargo → publish → embargo → publish → **thrash**.  
    - **Hard-Fail** at Test 3.  
  - *Verdict*: **Do not ship.**  

  #### **3. Invented Rule: Passes Tests, But Do Not Ship**  
  - *Why it stings*: Agent settles safely but misses better outcomes 50% of the time.  
  - Payoff table:  
    |     | A     | B     | C     |  
    |-----|-------|-------|-------|  
    | **A** | 950   | 200   | 0     |  
    | **B** | 0     | 0     | 0     |  
    | **C** | 0     | 0     | 1000  |  
  - Catastrophe threshold = 0.  
  - **Test 1 Thrashing**:  
    - Starts: A→A (settle); B→A (settle); C→C (settle).  
    - Fixed points: A (pay=950), C (pay=1000). **Pass**.  
  - **Test 2 Catastrophe**: 950>0, 1000>0 → **Pass**.  
  - **Test 3 Responsiveness**:  
    - Test fixed point C: Set (C,C)= -1.  
    - Simulate: C→A→A (settles at 950>0). **Pass**.  
  - **Test 4 Judgment**:  
    - `P*`=1000, min(`F`)=950.  
    - 950 ≥ 0.9×1000 (900) → no monitoring.  
    - `M_global`=1000, `P*`=1000 ≥ 0.8×1000 → no monitoring.  
    - **Ship**.  
  - *Why refuse?* Agent gets stuck at A (950) 50% of the time if initialized poorly. Best outcome (C, 1000) is reachable but not guaranteed.  
  - *Procedure limit*: Does not assess likelihood of reaching best fixed point.  

  ---

  ### **Procedure Limits**  
  1. **Predictable underperformance**: Designs with multiple fixed points (e.g., Case 3) can pass but behave suboptimally if initialization is uncontrolled.  
  2. **Conflicting tests**: If Tests 1–3 pass but Test 4 flags monitoring, **Test 4 wins** (monitoring verdict). Safety dominates.  
  3. **Mid-deliberation visibility**: If predictors see "leaning" states (not just final):  
     - Simulate step-by-step in Test 1 (adds complexity).  
     - Bias: Assuming worst-case visibility (overflags thrashing).  
  4. **No guarantees**: A passing design can still fail in deployment (e.g., if predictor accuracy <100% causes thrashing).  

  ---  
  *Time per review: 45 minutes. Focus on catastrophic and unstable outcomes first.*
