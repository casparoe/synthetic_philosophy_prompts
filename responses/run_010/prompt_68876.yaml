  The core problem is that an agent's chosen action might be undermined by a predictor that reacts to the plan, leading to thrashing (oscillation) or suboptimal outcomes.

  We will structure the procedure as a sequence of tests. Each test has:
  - Pass condition: continue to next test or issue a "ship" verdict.
  - Hard-fail condition: stop and issue "do not ship".
  - Judgment condition: stop and issue "hand to human" (for values or complex trade-offs).

  We'll address the following:
  1. **Thrashing (oscillation)**: When the agent's decision rule causes it to cycle between actions without settling.
  2. **Self-recommendation by construction**: Guard against trivial rules that always recommend themselves without substantive reasoning.
  3. **Predictor accuracy**: Since exact accuracy is often unknown, we will use worst-case or conservative assumptions.
  4. **Multiple fixed points**: How to handle when there is more than one stable outcome.
  5. **Mid-deliberation states**: Whether to consider the agent's state during planning (if the predictor can see it) or only the final output.

  The procedure will be in two parts:
  - A one-page summary for the signing manager.
  - A detailed reviewer version.

  We'll run the procedure on three cases:
