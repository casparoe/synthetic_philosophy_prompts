prompt: |-
  My EA reading group built this argument and now nobody can kill it. It's meant to show that the importance/tractability/neglectedness framework advises you to ignore itself.

  (1) An extra person's work on a cause is worthwhile only if her expected marginal contribution to it is high.
  (2) That contribution is high only where the cause is important, tractable, and neglected — i.e. where comparatively few people are already working on it.
  (3) How many people are already working on it is a fact about the whole pool of would-be contributors, not about any one of them.
  (4) So the framework's recommendation to me turns entirely on what everyone else does.
  (5) If every competent agent used the framework, they'd all be pointed at whichever important and tractable cause is currently most neglected.
  (6) Their arriving there destroys the neglectedness that pointed them there, and elevates some other cause in its place.
  (7) So the framework's advice, if followed, becomes advice to do something no longer worth doing.
  (8) Any rule that makes itself incorrect when followed is not a reliable guide.
  (9) Therefore I should defect: work on causes the framework ranks low, since those keep their neglectedness.
  (10) But (1)-(8) dont mention EA anywhere. They work for any rule that ranks options by how much unclaimed value is left in them.
  (11) So no such rule can be followed at all — which has to be wrong, because something like this is how people pick research topics and careers, and they mostly do fine.

  Where does it break? I'd rather keep (2) than (9), since (2) is the whole reason neglectedness is in the framework to begin with. But just refusing (9) feels like a dodge and not a diagnosis. Which step do you reject, why did it look innocent when I wrote it down, and what does rejecting it cost me? Don't bother with references, I'll add those myself.
reasoning: |-
  Okay, the user has presented an argument from their EA reading group that claims the ITN framework self-destructs when universally applied. They want to identify where the logic breaks down while preserving the core intuition behind neglectedness. 

  First, I notice the user is deeply familiar with EA concepts - they're not looking for basic explanations but a precise philosophical dissection. The tone suggests frustration ("nobody can kill it") mixed with intellectual curiosity ("which step do you reject"). They explicitly reject superficial answers, so I need to pinpoint the exact misstep.

  Hmm... let me walk through the premises. Step (2) seems solid - marginal contribution does depend on neglectedness. Step (3) is mathematically true. The cascade from (4) to (7) appears logically sound if we accept perfect coordination. But that's where my skepticism kicks in: the argument assumes all actors simultaneously receive and identically implement the framework's advice. 

  *scribbles mentally* Real-world application has friction. Causes aren't light switches - they absorb workers gradually. The first 1000 workers might still be impactful in a cause that needs 10,000. And crucially, neglectedness isn't binary - it's a continuum where marginal impact decreases but doesn't vanish abruptly. 

  Ah! There's also the coordination failure. The argument assumes everyone shifts at once to the "most neglected" cause, but in practice: 1) information lags exist 2) people have heterogeneous skills 3) switching costs prevent instant migration. This makes the self-correcting mechanism messy rather than self-destructive. 

  The user's attachment to (2) makes sense - abandoning neglectedness would gut EA's comparative advantage approach. But rejecting (9) isn't a dodge if we reframe the framework as optimizing for impact under imperfect coordination. I should emphasize that ITN isn't a suicide pact but a heuristic for decentralized decision-making. 

  *checks mental notes* Must avoid jargon. User wants the "why it looked innocent" part - the elegance of the coordination assumption seduces you into ignoring real-world inertia. The cost of rejecting step (6)? We lose the clean game-theoretic model but gain practical applicability. That's a tradeoff worth making.
answer: |-
  Your group's argument is clever but flawed at **step (6)**. Here's the breakdown:

  ### Why Step (6) Fails
  The claim that *"their arriving there destroys the neglectedness"* assumes **instant, perfect coordination** and **zero friction**. In reality:
  - Causes absorb workers **gradually**, not catastrophically. The 1000th worker in a cause needing 10,000 still adds significant marginal value.
  - **Information delays** exist: Not everyone acts on the same data simultaneously.
  - **Skill mismatches** matter: A cause may be "most neglected" globally, but if you lack relevant skills, your marginal impact there is low.
  - **Adjustment costs** apply: Switching causes takes time/effort, preventing instantaneous overcrowding.

  The framework doesn't recommend working on a cause *only* when it's maximally neglected. It recommends causes where **neglectedness is sufficiently high relative to importance and tractability** – a continuous threshold, not a binary switch.

  ### Why It Looked Innocent
  Step (6) seduces you by smuggling in a **toy-model fallacy**: treating causes as identical buckets that fill instantaneously when "pointed at." Real-world causes are complex systems with:
  - Diminishing returns (not zero returns),
  - Heterogeneous labor requirements,
  - Lagged responses.

  ### Cost of Rejecting Step (6)
  You lose the clean, game-theoretic "Nash equilibrium" where all agents perfectly coordinate. Instead, you embrace:
  - **Imperfect information**: You act on *current* neglectedness, knowing it will evolve.
  - **Probabilistic impact**: Your marginal contribution is non-zero even as others join, so long as the cause isn’t *oversaturated*.
  - **Dynamic adjustment**: ITN becomes a heuristic for steering effort *toward* under-resourced areas, not jumping to a single "most neglected" cause until it dies.

  ---

  ### Preserving Your Core Intuition
  **(2) holds** because neglectedness *does* predict marginal impact – but **not discontinuously**. Your contribution declines smoothly as more workers arrive. The framework remains useful because:
  1. Causes have high capacity for impact before becoming "saturated."
  2. Other workers won’t instantly flood the cause (due to inertia/skills).
  3. You’re comparing *relative* neglectedness – working on a top-5 ITN cause is still better than a non-ITN cause.

  ---

  ### Practical Example
  Suppose curing disease X needs 100 researchers. If 10 work on it (90% neglected), your marginal impact is huge. If 50 join (50% neglected), your impact is still substantial – not "destroyed." Only when 95+ work on it does your contribution drop. The framework correctly tells you to join early/mid-stage, not *only* when neglect is 99%. 

  **Bottom line**: ITN isn’t suicidal – it’s a robust heuristic for dynamic systems with friction. The error was assuming perfect coordination and instantaneous saturation.
