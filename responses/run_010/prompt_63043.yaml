prompt: |-
  I have now spent something like a decade reading rationalist-adjacent blogs and forums on governance, and I have noticed that whenever the word *corruption* appears, the discussion converges almost immediately on the same picture: there is a principal, there is an agent, the agent betrays the principal's interests for private gain, and reform means better monitoring and better incentives. I have come to suspect that this is not a theory of corruption so much as a tic — a default diagram we reach for because it is the one we know how to draw. So before I read anything else, I want the specification written down: the desiderata that any adequate account of corruption has to meet.

  Fix the purpose first, since adequacy is relative to it. I want an account good enough to do two jobs: (i) to classify practices that reasonable and well-informed people disagree about, without smuggling in the classifier's own political culture; and (ii) to be usable by someone designing governance reform, including someone operating inside a system where patronage is the ordinary mode of administration rather than a deviation from it.

  What I want is a list of requirements, each with the case or consideration behind it — not a list of slogans. To indicate the altitude I am after, here are cases the account has to land somewhere defensible on: the official who accepts a gift his entire community treats as obligatory at a wedding, and whose refusal would be read as an insult; the official who appoints her less-qualified cousin; the badly underpaid clerk who takes small payments for services the state is failing to deliver anyway; the legal lobbyist and the revolving-door appointee; the official who destroys a file in order to damage a rival, gaining nothing for herself; the official who diverts funds to build a school in her own district; the private-sector procurement manager who takes a kickback; and electoral manipulation that never involves anyone acting outside her formal authority. I also want the distinctions the account must not collapse — corruption against rent-seeking, against regulatory capture, against mere illegality, against ordinary self-interest in politics — and the empirical results it cannot contradict, among them that reported and experienced corruption come apart, that petty and grand corruption have different dynamics and different effects on trust, and that some rapidly growing economies have scored badly on corruption measures while some comparatively clean ones have stagnated, so no analytic link between corruption and development is available. Finally: the account must license at least some observable predictions. A definition that makes corruption undetectable in principle is not a theory of anything.

  The part I care about most is the sorting. Tell me which of these requirements are genuinely non-negotiable and which are the parochial commitments of a particular camp — in particular, whether the demand that corruption be defined relative to a public/private distinction is a discovery or a prejudice, and whether the demand that corruption always harm identifiable victims survives the cases above. Flag any pair of desiderata you suspect cannot be jointly satisfied, and say why; where two requirements pull against each other, I would much rather be told the list is unsatisfiable than have one of them quietly weakened. And tell me which single requirement does the most work in ruling out candidate accounts.

  Then, briefly — a paragraph each, no longer — score four families against the list: the office-and-rules-centered account; the market-centered account, on which an official treats her post as a business from which to maximize revenue; the principal-agent account; and the collective-action account, on which corruption is a self-enforcing equilibrium in which no principal capable of punishing defectors exists at all.

  I want a self-contained argument, not a literature review: no citations, no reading list, no names. I would like to be able to check your claims against my own reasoning rather than against your references. A table is fine for the requirements. Please write in American English. And throughout, separate what is settled from what is genuinely contested among people who work on this seriously: where a requirement I have listed is itself a live dispute, or where you are endorsing a minority position, say so plainly instead of presenting it as the received view.
reasoning: |-
  Hmm, the user is asking for a rigorous framework to evaluate theories of corruption. They've clearly spent years observing limitations in mainstream approaches, particularly the principal-agent model that dominates rationalist discourse. Their frustration with conceptual "tics" resonates—it's true that governance discussions often default to monitoring/incentives fixes without examining deeper assumptions.

  The core challenge is balancing two needs: a classification system that doesn't presume Western institutional norms, yet remains actionable for reform designers operating in patronage-heavy systems. Their test cases are brilliantly chosen to stress-test definitions—that wedding gift example alone dismantles most legalistic approaches. I notice they're especially concerned about false universals (like public/private distinctions) and hidden normative smuggling.

  Key tensions in their requirements:
  - Cultural relativity vs concrete harm requirement (does refusing gifts harm more than accepting?)
  - Individual agency vs systemic equilibrium (the file-destroying official gains no material benefit)
  - Observable detection vs complex social embeddedness (how to measure obligatory gifts?)

  The empirical constraints they list are vital guardrails. That corruption-development correlation is weak surprises many, but the data is clear—Vietnam's growth amid high corruption scores versus spotless but stagnant cases proves it. Petty/grand corruption differentiation matters too: street-level bribes for basic services destroy trust differently than elite capture.

  For the framework itself, I'll avoid laundry-listing requirements and cluster them into: 
  1) Definitional precision (distinctions from rent-seeking etc.) 
  2) Operational robustness (detectability, reform usability) 
  3) Empirical fidelity (matching real-world cases and data) 
  4) Cultural neutrality (no smuggling of WEIRD norms)

  The principal-agent model fails catastrically on cultural neutrality and the no-material-gain case. Market models implode on the school-funding official—is that corruption or constituent service? Collective action approaches handle systemic cases well but struggle with individual culpability. Office-centered rules can't handle culturally embedded practices.

  Hardest trade-off: Harm requirement vs cultural neutrality. If we insist corruption must have victims, we risk pathologizing communal gift-giving. But dropping harm risks over-expanding the term. I'll propose harm as non-negotiable but with expanded victim definition (society as victim in diffuse corruption).

  Most decisive requirement: Reform usability. Any theory that can't generate concrete interventions for patronage systems fails their core purpose. This alone rules out purely descriptive approaches.
answer: |-
  Here is a self-contained framework for evaluating theories of corruption against your stated objectives, followed by a scoring of the four families. Requirements are distilled from your cases, distinctions, and empirical constraints. "Settled" refers to widely accepted necessities in corruption scholarship; "contested" indicates live debates.

  ### Requirements for an Adequate Account of Corruption (Table)
  | **Requirement**                     | **Rationale & Non-Negotiables**                                                                                                | **Settled/Contested** |
  | :---------------------------------- | :----------------------------------------------------------------------------------------------------------------------------- | :------------------- |
  | **R1: Neutrality Across Political Cultures** | Must classify practices (e.g., obligatory gifts, nepotism) without assuming Western legalistic norms. Refusal must not smuggle in classifier’s bias. | **Non-negotiable** (Core to your Job i) |
  | **R2: Reform Usability in Patronage Systems** | Must guide design where patronage *is* the administrative norm (e.g., appointing cousins). Cannot presuppose "ideal" bureaucracy as baseline. | **Non-negotiable** (Core to your Job ii) |
  | **R3: Harm Specification**          | Must identify victims or social damage *even when* (a) acts are culturally normalized, (b) no direct self-interest exists (e.g., file destruction), or (c) services are underprovided (underpaid clerk). Harm may be diffuse (e.g., eroded legitimacy). | **Contested**: Some argue harm is inherent; others see it as context-dependent. **But non-negotiable per your cases**. |
  | **R4: Public/Private Distinction Not Presumed** | Must not *require* a formal public/private divide. Must handle cases like private-sector kickbacks or electoral manipulation using formal authority. | **Non-negotiable** (Rejects parochialism) |
  | **R5: Distinction Preservation**    | Must **not** conflate: <br>- Corruption vs. rent-seeking (unearned income via legal loopholes)<br>- Corruption vs. regulatory capture (shaping rules to favor interests)<br>- Corruption vs. mere illegality (e.g., jaywalking)<br>- Corruption vs. ordinary political self-interest (e.g., pork-barrel spending). | **Settled** (Essential for analytical clarity) |
  | **R6: Empirical Compatibility**     | Must accommodate: <br>- Divergence between reported/experienced corruption<br>- Different dynamics/effects of petty vs. grand corruption<br>- Lack of consistent correlation between corruption measures and economic development. | **Non-negotiable** (Basis in evidence) |
  | **R7: Detectability & Predictability** | Must license observable predictions (e.g., conditions under which petty corruption increases service access). Cannot render corruption inherently unmeasurable. | **Settled** (Theory must be falsifiable) |
  | **R8: Material vs. Non-Material Gain** | Must cover acts driven by non-material incentives (e.g., harming a rival, building local goodwill via school diversion). | **Non-negotiable** (Per file-destruction case) |

  ### Key Tensions & Trade-offs
  - **R1 vs. R3 (Neutrality vs. Harm)**: The strongest tension. Insisting on universal harm (R3) risks imposing external moral standards (violating R1). *Resolution*: Harm must be defined *systemically* (e.g., undermining allocative efficiency, equity, or institutional trust) without relying on culturally specific morals.  
  - **R2 vs. Principal-Agent Default**: Principal-agent models struggle in patronage systems where "principals" (e.g., citizens) are not the relevant constituency; patrons/clients are.  
  - **Most Dispositive Requirement**: **R2 (Reform Usability in Patronage Systems)**. Rules out accounts assuming a functional bureaucracy or clear principal-agent hierarchy.  

  ---

  ### Scoring Four Families of Accounts  
  *(Paragraph each; ✓ = Satisfies, ✗ = Fails, ~ = Partial/Mixed)*  

  1. **Office-and-Rules-Centered Account**  
     Defines corruption as violation of formal office rules for personal gain.  
     - ✓ **R5/R7/R8**: Clear distinctions from legal acts; detectable via rule-breaking; covers non-material gain if rules prohibit it.  
     - ✗ **R1/R2/R4**: Ethnocentric (assumes rules reflect universal norms); useless where rules endorse patronage (R2); presumes public/private divide (R4).  
     - ✗ **R3/R6**: Ignores harm if rules are unjust (e.g., apartheid laws); cannot explain growth in high-corruption states (R6).  
     **Verdict**: Fails neutrality and reform usability.  

  2. **Market-Centered Account**  
     Corruption is when officials treat public office as a revenue-maximizing business.  
     - ✓ **R7/R8**: Predicts bribe sizing/occurrence; covers kickbacks.  
     - ✗ **R1/R2**: Pathologizes culturally embedded gift-giving; cannot explain non-revenue acts (file destruction) or reform in patronage systems.  
     - ✗ **R3/R4/R5**: Omits harm to non-"customers" (e.g., unserved citizens); conflates corruption with legal rent-seeking; assumes public office is "market"-like.  
     **Verdict**: Reductive; collapses distinctions.  

  3. **Principal-Agent Account**  
     Agent betrays principal for gain; solution is monitoring/incentives.  
     - ~ **R5/R7**: Distinguishes corruption from capture (if principals differ); offers testable monitoring solutions.  
     - ✗ **R1/R2/R4**: Assures a single principal (e.g., "the public"), which is fictional in patronage systems; ignores non-material gains; presumes public/private hierarchy.  
     - ✗ **R3/R6**: Cannot explain file-destruction (no principal betrayal?); struggles with petty/grand divergence (same mechanics assumed).  
     **Verdict**: Ethnocentric and mechanically limited.  

  4. **Collective-Action Account**  
     Corruption is a self-reinforcing equilibrium where no actor can defect unilaterally due to lack of credible enforcement.  
     - ✓ **R1/R2/R6**: Culturally neutral (patronage is one equilibrium); reform-focused (break equilibrium via coordination); explains growth/corruption divergence (multiple stable states).  
     - ✓ **R3/R4**: Harm via systemic inefficiency/distrust; no public/private requirement.  
     - ~ **R5/R7/R8**: Distinguishes corruption from individual rent-seeking; predicts tipping points. But may under-specify individual culpability (R8).  
     **Verdict**: Best meets non-negotiables but requires careful harm definition (R3 tension).  

  ---

  ### Critical Takeaways  
  - **Non-Negotiables**: R1 (Neutrality), R2 (Patronage Reform), R3 (Harm), R6 (Empirical), R8 (Non-Material Gain).  
  - **Public/Private Distinction (R4)**: A **prejudice** in most accounts. Your cases (private kickbacks, electoral manipulation) show corruption transcends it.  
  - **Harm Requirement (R3)**: **Non-negotiable but contested**. Must be systemic (e.g., *institutional* trust/equity) to avoid cultural bias. The wedding gift is corrupt *if* it systematically distorts resource allocation; refusal may cause harm, but not necessarily *systemic* harm.  
  - **Trade-off Survival**: R1/R3 tension is manageable via systemic harm. R2 invalidates principal-agent as a universal tool but not as a subcomponent.  
  - **Best Candidate**: **Collective-action** satisfies most requirements if harm is defined as *erosion of institutional effectiveness or fairness*. It uniquely handles patronage-as-equilibrium and non-material incentives.  

  This framework prioritizes your demand for a politically neutral, reform-capable, and empirically grounded definition—ruling out accounts that universalize Western bureaucracies or reduce corruption to simple greed.
