     - **Outcome-based**: No (schemes 2, 3, 5).  
     - **Unclassified scheme**: Outcome-based (requires final answer to compute the bit).  

  ### **Classification Under All Criteria**  
  | Scheme          | Friend's Criterion | Criterion B | Criterion C |  
  |-----------------|---------------------|-------------|-------------|  
  | Unclassified    | Outcome-based      | Outcome-based | Outcome-based |  

  **Closest analog**: Scheme 2 (RL with final-answer string match). Both use the final answer as the sole supervision signal, ignoring reasoning quality. Scheme 5 is also close but broadcasts rewards per token.

  ### **Recommendation for the Survey Label**  
  - **Label**: Outcome-based.  
