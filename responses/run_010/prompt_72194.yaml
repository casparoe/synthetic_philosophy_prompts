  ### **Sixth Scheme to Distinguish Criteria**  
  Propose this scheme to test your friend's criterion vs. Criterion B:  
  - **Scheme 6**: A verifier that reads a reasoning chain and outputs a vector of scores, one per step, where each score is the probability that the step is logically sound (e.g., trained on synthetic errors). The final answer is **withheld** during scoring.  
