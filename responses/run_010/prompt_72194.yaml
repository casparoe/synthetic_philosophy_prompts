    - **Scheme 4 (process)**: Judge rates reasoning step by step, even if trained on outcome-derived labels. The signal evaluates the process, not the outcome.  
    - **Scheme 5 (outcome)**: Verdict is based on re-executing the final answer (outcome), not the reasoning.  

  ### **Other Consistent Criteria**  
  Two alternative criteria also fit verdicts 1–5, but they disagree on the unclassified scheme:  

  1. **Criterion B: "Does the signal require evaluating the reasoning process beyond extracting the final answer?"**  
     - **Process-based**: Yes (schemes 1, 4).  
