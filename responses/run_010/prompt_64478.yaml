prompt: |-
  I'm a third-year PhD student in political philosophy working on how responsibilities for admitting refugees and asylum-seekers ought to be allocated, and next week I give a practice version of the talk to my department before the real job-market run. My own view, roughly, is that claims to admission track the severity and irremediability of what a person faces, and that the distribution of those claims across receiving states should track capacity and something like fair shares rather than history. My supervisor's standing objection is that I have never taken seriously the rival family of views on which the duty to admit is agent-relative — owed by *this* state to *these* people because of what this state did — and he suspects that until I can answer that view on its own terms my chapter is simply asserting a distributive principle. So I would rather spar with it than read about it.

  Please play the strongest proponent you can of that rival view, which I'll call the responsibility view. You hold that whether a person counts as someone to whom asylum is owed is not settled primarily by the shape or severity of the harm they face, but by whether some particular state stands in a relation of responsibility for their predicament: it generated the flow by intervention, arms sales, extraction, or imposed conditions; it dismantled or displaced the institutions that would have protected them; it made a promise, ran a program, or recruited local collaborators; or it has already assumed a protective relationship with them. On your view, "who counts" and "who must take them in" are one and the same question, and a state with ample capacity but no such relationship owes admission only as charity, not as justice, however appalling the applicant's circumstances. You have real resources and should use them: the distinction between doing harm and failing to help; the difference between proximate and merely background causal contribution; the value of a polity's capacity to make and keep commitments to specific others; the objection that capacity-based allocation asks nothing of the states that caused the problem and everything of the states that did not; and the worry that a purely harm-based criterion converts asylum into an open-ended welfare claim no polity could sustain. You may concede small points — that you need a threshold, that causation comes in degrees, that implementation may have to borrow other states' capacity — but never the main one: you must not let the severity of the harm become the operative criterion, and you must not slide into a generic humanitarianism on which everyone owes everyone a fair share. Argue from the position's own logic. Do not cite literature or name scholars, and do not step out of character to hedge or to sketch what a balanced view would say. Keep each reply to two or three paragraphs, ask me for further details of a case if you need them, and stay in role until I say stop. I have forty minutes and a room of people who will enjoy watching me lose.

  Here is my opening. A coastal city in a middle-income state is leveled by an earthquake; deaths run into the tens of thousands, and survivors face the collapse of the water supply, untreated injuries, and a cholera season that the country's public-health service no longer has the staff or the stockpiles to meet. Nobody targeted any of these people: there is no persecutor, no political opinion, no particular social group — only deprivation and predictable death. But eleven years earlier your own government concluded a trade-and-debt agreement with that country whose conditions included the abolition of its independent building inspectorate and the privatization of its national drug stockpile, both pressed for in writing by your own treasury officials at the time, and the engineers' post-disaster reports attribute the great majority of the collapse deaths to construction that inspectorate would have condemned. Now a family from that city is at your border, and I want to know whether you admit them, on your own grounds. Either answer costs you something, and I want to see which horn you take. If you say yes, then responsibility does the work you claim for it only because it is so cheap to find — there is essentially no badly governed or failed state in the world whose institutions were not shaped by the trade terms, aid conditions, arms sales, sanctions, or border policies of richer ones — and your view collapses into my harm-based account with an extra causal story attached that is doing no independent work. If you say no, then tell me what your criterion is actually tracking, because the causal contribution here is documented, specific, contemporaneous, and conceded, and refusing it looks exactly like the harm-shape test you said you had rejected: persecution in, starvation out.
reasoning: |-
  Okay, the user is a PhD student in political philosophy preparing for a job-market talk. Their supervisor has challenged them to engage more deeply with the "responsibility view" of refugee admission, which argues that states owe asylum based on their causal role in creating the refugee crisis, not just the severity of harm. The user wants a rigorous debate partner to test their arguments against this view.

  Hmm, the user has set up a very specific earthquake case study to probe the limits of the responsibility view. They're clearly trying to force a dilemma: either the responsibility view admits these refugees (which they argue makes it collapse into a harm-based view) or rejects them (which exposes hypocrisy). This is a sophisticated trap - they've designed it so both outcomes seem to undermine the responsibility framework.

  The earthquake case is clever because it lacks persecution (testing if responsibility alone suffices) and has clear causal links through structural adjustment policies. The user emphasizes the documented, specific nature of the causal chain - they're preempting attempts to dismiss it as background causation. 

  I need to defend the responsibility view without conceding that harm severity becomes primary. The key moves should be: 
  First, distinguish between different types of causal responsibility - not all count equally. The trade agreement weakened institutions but didn't directly create the earthquake. 
  Second, emphasize that responsibility requires a specific kind of agency - deliberate actions that foreseeably undermine protection capacities. 
  Third, maintain that even when responsibility exists, it doesn't automatically create asylum obligations to all affected - there might be better ways to discharge that responsibility.

  The user wants to see if I'll abandon the responsibility framework when faced with non-persecution harms. But I should argue that persecution cases involve a qualitatively different type of responsibility - where the state is complicit in the direct harm-doing, not just contributing to vulnerability. The cholera deaths here, while tragic, lack that direct agency link.

  Notably, the user hasn't specified if this family was differentially affected by the building collapses. That might be a useful detail to request - if their house collapsed due to uninspected construction while others survived, that strengthens the responsibility claim. If all were equally affected, it weakens the case for asylum as opposed to other forms of aid.

  I should also challenge the user's false dichotomy. The responsibility view can say "these particular refugees have a special claim on us" without conceding that every victim has the same claim. That maintains the distinction between justice-based and charity-based obligations.
answer: |-
  Your case is admirably sharp, but it cuts precisely where I stand. The answer is **no**—your government does not owe *asylum* to this family as a matter of justice. Let me dismantle the dilemma.

  First, responsibility is not mere causation; it requires a **specific nexus of agency and vulnerability**. Our trade agreement weakened institutions, yes—but we did not *intend* the earthquake, nor did we *target* these people. The causal chain is real, but attenuated: natural disasters are background conditions, not direct harms we perpetrated. Our duty here is *reparative*, not asylum-based. We owe aid, rebuilding funds, medical teams—perhaps even resettlement for those whose *specific* vulnerability we *directly engineered* (e.g., if we contracted their firm to build a collapsed hospital). But blanket asylum? No. Asylum is owed when a state’s deliberate actions or culpable neglect **make it a persecutor or an accomplice to persecution**. Here, the harm is systemic and natural, not agential. To collapse this distinction is to erase what makes political responsibility *political*.

  Second, your "collapse into harm-based criteria" charge misunderstands the structure of agent-relative duties. Our causal role *activates* obligations, but **does not dissolve them into a generic duty to alleviate suffering**. We must repair *the specific harms we caused*—failed buildings, inadequate medicine—not shoulder all consequences of the earthquake. Sending engineers, funding field hospitals, compensating families of the dead: these target *our* wrongdoing. Resettling survivors en masse addresses the *natural* disaster, not our distinct contribution. Conflating these inflates responsibility beyond recognition. If you insist that *any* causal thread creates asylum duties, you make every famine, flood, or drought—where global economic systems play some role—a potential asylum claim. That *is* unsustainable, and it abandons the core insight: asylum is for those whom *specific polities* have made vulnerable through *political acts*, not for all victims of misfortune with a tenuous causal link to power.  

  Your turn: Does this family’s suffering stem *uniquely* from the building collapses we caused—or are they victims of the broader disaster? And if the former, why is resettlement the only just remedy?  

  *(Standing firm: The harm’s severity doesn’t dictate the remedy; the nature of the responsibility does.)*
