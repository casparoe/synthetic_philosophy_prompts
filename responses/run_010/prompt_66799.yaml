  5. Burden of proof: on the skeptic or on the claimant of authenticity?

  We also want to cover the following positions (leaves):

  - Classical criteria camp (using dissimilarity, multiple attestation, embarrassment, coherence at item level)
  - Wright's 'double similarity and double dissimilarity' (plausibility)
