answer: |-
  Below is a diagnostic decision tree designed to map methodological positions in historical Jesus studies. It starts from your fixed commitment (existence of a Galilean preacher executed under Pilate, with synoptics as primary evidence) and uses **10 concrete cases** drawn from gospel material to isolate key parameters. Each node is a multiple-choice question answerable without prior knowledge of scholarly labels. The tree branches through contested parameters (e.g., burden of proof, memory models, source independence) and lands on named/unnamed methodological positions. 

  Mythicism is excluded by the starting commitment: accepting a historical Jesus as the consensus baseline rules out mythicist positions, which deny his existence entirely.

  ---

  ### **Key Parameters the Tree Tests**
  1. **Burden of proof**: Is authenticity the default (skeptic must disprove it) or must it be actively proven?  
  2. **Memory model**: Is transmission like a game of telephone (copy-degradation) or a creative process (constructive reconstruction)?  
  3. **Source independence**: Are Matthew/Luke independent of Mark? Is Thomas independent? Does Q exist?  
  4. **Theology’s role**: Must we explain a passage by the evangelist’s theology *before* doubting authenticity?  
  5. **Scope of criteria**: Can criteria recover individual sayings/events, or only broad patterns?  

  ---

  ### **The Decision Tree**
  *Start:* You accept a historical Jesus executed under Pilate, using synoptics as primary evidence.  

  1. **The baptism of Jesus by John** (Mark 1:9–11; Matt 3:13–17; Luke 3:21–22): Embarrassing (implies Jesus’ subordination) and multiply attested. How do you weigh this?  
     - **(a)** Likely authentic: Churches don’t invent self-damaging material without good reason.  
     - **(b)** Possibly authentic, but only if nothing in early theology *motivated* inventing it (e.g., to show Jesus’ humility).  
     - **(c)** Unreliable: Embarrassment is manufactured where theologically useful (e.g., to link Jesus to John’s movement).  
     - **(d)** Irrelevant for authenticity: We should examine patterns (e.g., Jesus’ association with John), not single events.  

  2. **The passion predictions** (Mark 8:31; 9:31; 10:33–34): Jesus foretells his death/resurrection. Found in Mark, adapted in Matthew/Luke. How do you assess them?  
     - **(a)** Likely authentic: They cohere with Jesus’ mission and are multiply attested (via Mark and Q/Matt/Luke).  
     - **(b)** Possibly authentic in general form, but details shaped by post-resurrection theology (e.g., to show Jesus’ foreknowledge).  
     - **(c)** Probably inauthentic: They match events too perfectly and serve theological needs.  
     - **(d)** Unknowable: Individual sayings can’t be verified; focus on patterns (e.g., Jesus’ expectation of death).  

  3. **Mark’s Aramaic phrases** (e.g., “Talitha cumi” in Mark 5:41): Preserved with Greek translations. What do they imply?  
     - **(a)** Strong evidence of authenticity: Early communities preserved actual words of Jesus; they wouldn’t invent linguistically awkward material.  
     - **(b)** Weak evidence: Could be a literary device to add local color, not necessarily historical.  
     - **(c)** No evidence for authenticity: Markan style, not a window into the historical Jesus.  

  4. **The Lord’s Prayer** (Matt 6:9–13; Luke 11:2–4): Similar but not identical in Matthew/Luke, often attributed to Q. How do you evaluate it?  
     - **(a)** Likely authentic: Multiple attestation (via Q) and coherence with Jesus’ Jewish context.  
     - **(b)** Possibly authentic, but variations show community adaptation (e.g., liturgical development).  
     - **(c)** Unlikely authentic: Could be a communal prayer attributed to Jesus retrospectively.  
     - **(d)** Depends on Q: If Q exists, it’s multiply attested; if not, it’s a single tradition (Luke copying Matthew or vice versa).  

  5. **The Temple incident** (Mark 11:15–19; Matt 21:12–13; Luke 19:45–48; John 2:13–22): Jesus disrupts Temple commerce. Differences in timing/details across gospels.  
     - **(a)** Likely authentic: Multiply attested (Mark, John, and possibly independent traditions) and plausible in Jesus’ context.  
     - **(b)** Possibly historical, but details shaped by theology (e.g., Jesus as Temple replacement).  
     - **(c)** Probably inauthentic: Serves theological aims (e.g., condemning Jewish leadership) and lacks consistent evidence.  
     - **(d)** Pattern-based: Authentic as a broad theme (Jesus criticized the Temple), not this specific event.  

  6. **Independence of Thomas** (e.g., saying 65 parallels Mark 12:1–9): How do you treat Thomas for multiple attestation?  
     - **(a)** Independent and valuable: Thomas preserves early oral traditions not reliant on synoptics.  
     - **(b)** Partially independent: Some sayings are early, but Thomas also knows synoptics.  
     - **(c)** Dependent: Thomas borrows from synoptics, so it doesn’t provide independent attestation.  
     - **(d)** Unknowable: Thomas is too theologically layered to be useful for history.  

  7. **Paul’s references to Jesus’ brother (James)** and the Last Supper (1 Cor 11:23–26; Gal 1:19):  
     - **(a)** Strong evidence: Paul is early and independent of gospels; supports Jesus’ family and last supper.  
     - **(b)** Limited evidence: Paul’s knowledge is fragmentary and theological, not historical.  
     - **(c)** Weak evidence: James might not be a literal brother; Last Supper is liturgical, not historical.  

  8. **Luke’s census** (Luke 2:1–5): Requires Joseph to travel to Bethlehem; historically problematic (no Roman census at this time). How does this affect Luke’s reliability?  
     - **(a)** Isolated error: Doesn’t undermine the gospels generally; historical claims can be evaluated case by case.  
     - **(b)** Shows evangelists adapted history for theology (here, to place Jesus in Bethlehem).  
     - **(c)** Major red flag: Indicates gospels routinely invent events to fit theological needs.  

  9. **Sermon on the Mount/Plain material** (Matt 5–7; Luke 6:20–49): Does this go back to Q or Matthew’s composition?  
     - **(a)** From Q: Multiple attestation (Matt/Luke) makes core sayings likely authentic.  
     - **(b)** Community origin: Q is a collection of sayings developed by early Christians, not Jesus.  
     - **(c)** No Q: Matthew composed it; Luke adapted Matthew, so no multiple attestation.  

  10. **Memory model**: How were Jesus’ sayings/events preserved?  
      - **(a)** Copy-degradation: Mostly accurate transmission with minor alterations.  
      - **(b)** Constructive reconstruction: Stories reshaped for community needs (e.g., prophecy fulfillment).  
      - **(c)** Kerygmatic expression: Memories are faith-based creations, not history.  

  ---

  ### **Resulting Methodological Positions (Leaves)**
  Based on your path through the tree, you land on one of these positions. Each is defined by its answers to the nodes above. **Contested premises** (e.g., Q’s existence, Thomas’s independence) are noted where they are pivotal. **Awkward commitments** highlight counterintuitive implications. **Unseparated pairs** indicate positions the tree cannot fully distinguish due to overlapping parameter choices.  

  1. **Classical Criteria (e.g., Jeremias, Perrin)**  
     - **Path**: 1a → 2a → 3a → 4a → 5a → 6a/c → 7a → 8a → 9a → 10a  
     - **Core**: Authenticity decidable at item level via embarrassment, dissimilarity, multiple attestation, coherence. Burden on skeptic. Memory as copy-degradation.  
     - **Awkward commitment**: Criteria often isolate a "non-Jewish" Jesus (e.g., dissimilarity excludes material compatible with Judaism).  
     - **Contested premises**: Requires Q’s existence (Node 9), Thomas’s independence (Node 6), and Markan priority.  

  2. **Wright’s Double Similarity/Dissimilarity**  
     - **Path**: 1a → 2a → 3a → 4b → 5a → 6b → 7a → 8a → 9a → 10b  
     - **Core**: Authenticity at item level if material fits Jesus’ Jewish context (similarity) *and* explains early Christianity (dissimilarity). Embarrassment and multiple attestation are secondary. Burden on claimant.  
     - **Awkward commitment**: Risks circularity (defining "dissimilarity" post-hoc to match Christian origins).  
     - **Contested premises**: Relies on Q (Node 9) and Pauline independence (Node 7).  

  3. **Allison’s Recurrent Patterns**  
     - **Path**: 1d → 2d → 4d → 5d → 9a → 10b  
     - **Core**: Item-level criteria fail; authenticity only for broad patterns (e.g., Jesus’ kingdom focus, table fellowship) via cumulative weight. Memory as constructive.  
     - **Awkward commitment**: Cannot recover specific sayings/events (e.g., Lord’s Prayer or Temple incident as units).  
     - **Contested premises**: Accepts Q (Node 9) but sidesteps Thomas (Node 6) and independence debates.  

  4. **Keith/Le Donne Memory Refraction**  
     - **Path**: 1b → 3b → 4b → 5b → 6b → 7b → 8b → 9b → 10b  
     - **Core**: Replaces "authenticity" with "plausibility in context." Memory as refraction—past events reshaped by present needs. Theology isn’t a veto (Node 1b). Burden neutral.  
     - **Awkward commitment**: Blurs history and interpretation (e.g., baptism plausibly happened but details are refracted).  
     - **Contested premises**: Ambivalent on Q (Node 9) and Thomas (Node 6).  

  5. **Theissen/Winter Critique**  
     - **Path**: 1c → 2c → 3c → 4c → 5c → 6c → 7c → 8c → 9c → 10b  
     - **Core**: Classical criteria are flawed; they emerged from Christian apologetics and produce a Jesus detached from Judaism. Contextual plausibility (Node 5c) overrules criteria. Burden on claimant.  
     - **Awkward commitment**: Dismisses embarrassment (Node 1c) and multiple attestation (Node 6c) as theologically motivated.  
     - **Contested premises**: Rejects Q (Node 9c) and Thomas’s independence (Node 6c).  

  6. **Sanders’ Contextual Plausibility**  
     - **Path**: 1b → 2b → 4a → 5a → 6a → 7a → 8a → 9a → 10a  
     - **Core**: Contextual plausibility (material fits Jesus’ Jewish setting) does primary work; criteria (e.g., embarrassment) are tiebreakers. Burden on skeptic for plausible material.  
     - **Awkward commitment**: Accepts some disputed events (e.g., Temple incident) as contextually plausible despite theological layers (Node 5a).  
     - **Contested premises**: Requires Q (Node 9) and Pauline independence (Node 7).  

  7. **Ehrman’s Probabilistic Agnosticism**  
     - **Path**: 1b → 2b → 3b → 4b → 5b → 6b/c → 7b → 8b → 9b → 10b  
     - **Core**: Criteria are weak individually; authenticity is probabilistic (e.g., multiple attestation + embarrassment). Burden on claimant. Memory as constructive.  
     - **Awkward commitment**: Yields low confidence (e.g., baptism and passion predictions might be authentic but unprovable).  
     - **Contested premises**: Agnostic on Q (Node 9b) and Thomas (Node 6b/c).  

  8. **Bultmann’s Kerygmatic Boundary**  
     - **Path**: 1c → 2c → 3c → 4c → 5c → 6d → 7c → 8c → 9c → 10c  
     - **Core**: Cannot get behind the kerygma (proclamation); gospels express faith, not history. Criteria are futile.  
     - **Awkward commitment**: Denies recoverable history (contradicts starting commitment but consistent internally).  
     - **Contested premises**: Rejects all source independence (Nodes 6d, 9c).  

  9. **Maximalist (e.g., Bauckham)**  
     - **Path**: 1a → 2a → 3a → 4a → 5a → 6a → 7a → 8a → 9a → 10a  
     - **Core**: High confidence in traditions; authenticity is default unless disproven. Embarrassment and multiple attestation reinforce reliability. Memory as copy-degradation.  
     - **Awkward commitment**: Defends historically contested material (e.g., Luke’s census) as broadly reliable (Node 8a).  
     - **Contested premises**: Requires Q (Node 9), Thomas’s independence (Node 6), and Markan priority.  

  10. **Unnamed Moderate Skepticism**  
      - **Path**: 1b → 2c → 3c → 4c → 5c → 6c → 7b → 8b → 9c → 10b  
      - **Core**: Authenticity requires strong evidence; theology often explains material (e.g., passion predictions invented for foreshadowing). Burden firmly on claimant. Memory as constructive.  
      - **Awkward commitment**: Nearly agnostic on most events (e.g., baptism, Temple incident) despite their prevalence.  
      - **Contested premises**: Rejects Q (Node 9c) and Thomas’s independence (Node 6c).  

  ---

  ### **Unoccupied Cells & Unseparated Pairs**  
  - **Unoccupied cells**: No position combines:  
    - *Burden on claimant + memory as copy-degradation* (incoherent: if memory preserves well, authenticity should be assumed).  
    - *Theology as secondary + reject item-level criteria* (unattractive: leaves no clear method).  
  - **Unseparated pairs**:  
    - *Ehrman and Sanders* overlap if sources are contested (e.g., if Q is rejected, both become more skeptical).  
    - *Keith/Le Donne and unnamed moderate skepticism* converge if theology dominates (Nodes 1b, 5b).  
  - **Contested premises matter**:  
    - Q’s existence (Node 9) shifts positions toward optimism (e.g., Classical, Wright) if accepted.  
    - Thomas’s independence (Node 6) affects multiple attestation for sayings.  
    - Markan priority (assumed in most nodes) if rejected, pushes toward Bultmann or skepticism.  

  This tree isolates positions by forcing concrete choices about specific texts, then maps those choices to methodological parameters. It reveals why disagreements arise (e.g., your debate on embarrassment hinges on Node 1’s burden of proof and theology’s role). Run your group through it—it should clarify whether disputes are about criteria, source models, or first principles.
