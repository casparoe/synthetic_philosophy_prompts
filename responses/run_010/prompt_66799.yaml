  8. Luke's census (Luke 2:1-5): often considered historically problematic.

  Question: Luke's story of Jesus' birth includes a census that requires Joseph to go to Bethlehem. Historians note problems with this census. How does this affect your view of Luke's reliability?

     a) It shows Luke sometimes gets things wrong, so we must be cautious.
     b) It might be a mistake, but it doesn't affect the rest of the gospel.
     c) It shows that the gospel writers sometimes invented stories to fit theological needs (here, to get Jesus born in Bethlehem).
     d) We shouldn't expect the gospels to be historically accurate in every detail.

  This gets at the burden of proof and the evangelist's reliability.

  9. The Sermon on the Mount/Plain (Matthew 5-7; Luke 6:20-49). Is this material from Q or composed by Matthew?

  Question: The Sermon material (like the Beatitudes) is in Matthew and Luke, but in different settings. How do you see its origin?

     a) It comes from Q, a shared source, and so is early and likely authentic.
     b) It might come from Q, but Q is a collection of sayings that could include community developments.
     c) Without Q, it could be that Luke used Matthew or vice versa, so it doesn't have multiple attestation.
     d) Even if from Q, it could be the early church's composition.

  This gets at Q and multiple attestation.

  10. Modeling memory: how do you think the tradition was passed on?

  Question: How do you think the stories and sayings of Jesus were preserved in the early church?

     a) Mostly by careful memorization and transmission, with some degradation.
     b) By a combination of memory and adaptive retelling to meet community needs.
     c) As constructed stories to express the community's faith (kerygma), not as historical memory.
     d) We can't know, so we should be agnostic.

  This gets at the model of memory.

