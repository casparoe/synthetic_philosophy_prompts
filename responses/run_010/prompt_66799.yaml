  - Keith/Le Donne: trade 'authenticity' for plausibility-in-context with memory as refraction
  - Theissen and Winter critique: criteria produce a Jesus detached from Judaism (grew in confessional history)
  - Sanders: contextual plausibility does the work, criteria are tiebreakers
  - Ehrman: criteria are weak individually, only probabilistic in combination
  - Bultmann: can't get behind the kerygma
  - Maximalist (high confidence in many traditions)
  - Mythicism (excluded by starting point, but note why)

  Constraints:

  - Every node must be a concrete case (e.g., baptism of Jesus, passion predictions, etc.)
  - Answers should be in multiple-choice format (a, b, c, ...) and not require knowledge of labels.
  - For each leaf: give a name (if confident), one sentence on its most awkward commitment, and note if the tree cannot separate some leaves.
  - Mark nodes that depend on contested source-critical premises (e.g., Q, Markan priority, Thomas independence, Paul's knowledge).

  Plan the tree:

  We'll have a series of questions that branch based on the answers. The questions will cover the key parameters by using specific examples.

  Let's outline the nodes:

  1. Start with the baptism of Jesus (by John the Baptist). This is in all synoptics (Mark, Matthew, Luke) and possibly in John (though not narrated, it is referenced). It is often considered embarrassing because it suggests Jesus was subordinate to John.

  Question: The baptism of Jesus by John is present in multiple gospels and seems to show Jesus in a subordinate position. How do you assess its authenticity?

     a) It's likely authentic because it's embarrassing and multiply attested.
     b) It might be authentic, but the embarrassment isn't decisive because the early church could have invented it to make a theological point (e.g., Jesus' humility).
     c) It's probably not authentic because the early church had theological reasons to invent it (to show Jesus as the fulfillment of John's movement).
     d) We can't assess individual episodes; we should look for patterns.

  This question gets at embarrassment, multiple attestation, and the idea of theological invention.

  2. Next, consider the passion predictions (e.g., Mark 8:31, 9:31, 10:33-34). These are in Mark and repeated in Matthew and Luke. They are often challenged as vaticinium ex eventu (prophecy after the event).

  Question: Jesus predicts his own death and resurrection in detail. These predictions appear in Mark and are taken up by Matthew and Luke. How do you view them?

     a) They are likely authentic because they cohere with Jesus' mission and are multiply attested (in multiple gospels).
     b) They might be authentic in a general form, but the details are probably shaped by the events that happened.
     c) They are unlikely to be authentic because they match what happened too well and serve the theological purpose of showing Jesus' foreknowledge.
     d) We should not focus on individual sayings; the pattern of Jesus facing opposition and expecting death is what matters.

  This gets at coherence, multiple attestation, and the burden of proof.

  3. Consider the Aramaic phrases in Mark (e.g., "Talitha cumi" in Mark 5:41). Mark translates them for his readers.

  Question: Mark includes some Aramaic phrases (like "Talitha cumi") and then translates them. What does this suggest?

     a) This is a mark of authenticity because it preserves the actual words of Jesus and the early church wouldn't invent Aramaic.
     b) It might be authentic, but it could also be a literary device to add local color.
     c) It doesn't tell us much about authenticity; it's just Mark's style.
     d) We can't use such details to establish authenticity.

  This gets at the criterion of Semitisms and the idea of what counts as evidence.

  4. The Lord's Prayer: appears in Matthew and Luke (with variations) and is often attributed to Q.

  Question: The Lord's Prayer appears in Matthew and Luke in slightly different forms. How do you assess its authenticity?

     a) It is multiply attested (by Q and possibly other traditions) and thus likely authentic.
     b) It might be authentic, but the variations show the early church adapted it.
     c) Without Q, we cannot establish multiple attestation, so we can't be sure.
     d) Even with multiple attestation, it could be a community prayer attributed to Jesus.

