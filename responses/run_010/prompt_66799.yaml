  We are building a diagnostic decision tree to map methodological positions in historical Jesus studies. The tree starts from the fixed commitment: "I accept the near-ununiversal consensus that a Galilean Jewish preacher existed and was executed under Pilate, and that the synoptics are my main evidence."

  The tree will have about 10 nodes. Each node is a concrete question about specific gospel material. The leaves represent named (or unnamed) methodological positions.

  Parameters the positions turn on (to be mapped by the tree):

  1. Can authenticity be established at the level of individual sayings/events, or only at patterns?
  2. How is memory modeled? (copy-degradation vs. constructive reconstruction)
