prompt: |-
  I write about science and ideas for a UK magazine and I've been stuck for weeks on a piece about the multiple realisability argument — the one that's supposed to sink the claim that mental states just are brain states. I've got the shape of it down: the opening move, that a creature whose neurology is nothing like ours could still be in pain; the follow-up that multiply realised kinds are perfectly respectable anyway, since economics and biology are full of them; then the counter-attack, roughly that if the realisers really are that different they can't all be counted as doing the same job, so either the functional description is carrying all the weight or the realisations were never so different to begin with. Plus the rejoinder from people who actually do comparative neuroscience, who say the thought experiments are too clean and that homologous structures don't line up across species the way the debate assumes. And hanging over the whole thing, the causal question: if the realiser is what does the causing, what is left for the mental kind to do?

  I have six versions of this argument and the piece isn't moving. My working hypothesis, which I'd like you to test rather then flatter: there isn't one disagreement here, there are two wearing the same coat — one about whether reduction can be true and still leave the special-science kinds autonomous, and one about whether causal work has to be booked at a single level. If that's right, the thing has stalled because each camp is answering a question the other side isn't asking, and the neuroscientific evidence can't break the tie because neither side's claim was ever empirical in the way it looks.

  Can you diagnose it properly? Ground the diagnosis in what each side actually does — the moves they make, the examples they reach for, what each treats as needing explanation — not in a survey of who holds what. Its a diagnosis I want, not an adjudication, and not a history. Then tell me honestly what would count as progress: a distinction somebody needs to draw, a kind of case that would actually be decisive, a formal result, or a change of subject. If your answer is that nothing would move it and we should stop pretending otherwise, say that and give me the reason.

  One wrinkle worth folding in. A computational neuroscientist I interviewed thinks the whole thing dissolves if you replace the question with a substitution test: two systems share a mental state just in case you can swap one into the other's causal context — the same inputs, the same downstream effects, the same place in the network — and nothing about the system's behaviour or internal dynamics registers the difference. He thinks that's a third option between the camps. Half the philosophers I put it to said it's functionalism with the serial numbers filed off; the other half said it's doing something new, because it makes sameness of state a matter of degree and of context rather than a yes/no. Where does it actually land, and does it break the deadlock or just relocate it?

  No bibliography and no reading list, please, I can chase that down myself. And write the whole thing in British English, including the -ise spellings.
reasoning: |-
  Okay, the user is a science writer for a UK magazine struggling with a piece on multiple realisability in philosophy of mind. They've outlined the core argument: how mental states can't be reduced to brain states because different physical systems could realise the same mental state. They've got the structure down but feel stuck after six drafts, suspecting there are actually two distinct debates masquerading as one: (1) whether reduction preserves special-science autonomy, and (2) whether causation operates at a single level. 

  Hmm, their frustration is palpable—weeks of stagnation despite nailing the dialectic. The computational neuroscientist's substitution test proposal adds spice: is it functionalism in disguise or something novel? User explicitly wants diagnosis, not history or reading lists, with British English spelling. Crucially, they need to know if progress is possible or if it's a dead end.

  First, unpacking their hypothesis. The autonomy debate (Camp 1) cares about preserving psychology's legitimacy despite reducibility; the causal exclusion debate (Camp 2) worries mental states become causally inert if brain states do the work. They're orthogonal! Camp 1 points to economics (e.g., money realised by cash/crypto/cattle) to show multiply realisable kinds are valid; Camp 2 counters that if realisers are too different, the "shared" kind is either functionally defined or not truly diverse. Neuroscientists then muddy the waters by saying homology isn't as clean as philosophers assume.

  The substitution test... interesting. It measures state identity by causal interchangeability in specific contexts. Functionalists see it as their core idea—same causal role, same state. But the gradience aspect (sameness as matter of degree) might dodge the all-or-nothing framing that causes deadlock. Still, it doesn't resolve causal exclusion: if substitution works, is the mental state or its physical realiser doing the causing?

  Diagnosis time: Stalemate because:
  - Camp 1 thinks Camp 2 misunderstands non-reductive physicalism (autonomy doesn't require causal competition).
  - Camp 2 thinks Camp 1 handwaves causation (if realisers cause effects, what's left for "pain" to do?).
  - Neuroscientists' empirical input doesn't bite because both sides can interpret neural diversity as supporting their view.

  Progress paths:
  1. Formalise autonomy: Show how special-science laws operate at higher abstraction (like how gas laws aren't threatened by molecular chaos).
  2. Reframe causation: Adopt difference-making (counterfactual dependence) to let multiple levels have causal relevance.
  3. Embrace gradience: Use substitution test's spectrum approach to sidestep binary thinking.
  ...But causal exclusion remains thorny. The honest answer? Some deadlocks need dissolving, not solving—shifting focus to pragmatic questions (how do we measure/compare mental states?) rather than metaphysical ones. 

  Final note: User's hypothesis was spot-on. The two-camps diagnosis explains why evidence doesn't break ties. Substitution test relocates but doesn't resolve the core tension. Advise them to name the dual debate structure upfront—that alone brings clarity.
answer: |-
  Right, let's dissect this properly. Your hypothesis is sharp: the stall comes from two distinct disagreements operating under the banner of "multiple realisability," talking past each other. The neuroscientific evidence feels inconclusive because neither dispute is primarily settled by empirical findings in the way proponents sometimes pretend. Here's the diagnosis grounded in moves and motivations:

  **The Two Debates Masquerading as One:**

  1.  **Camp 1: The Autonomy of Levels (Special-Science Preservationists)**
      *   **Core Concern:** Defending the legitimacy and irreducibility of higher-level sciences (psychology, economics, biology) *despite* physicalism. They fear "greedy reductionism" that dissolves their explanatory targets.
      *   **Key Move:** Pointing to multiply realisable kinds *is the argument*. Examples are ammunition: **Money** (coins, shells, digital bits), **Rigidity** (steel girder, diamond lattice, force field), **Predator** (lion, shark, drone swarm), **Heart** (biological pump, artificial device). For them, the *very existence* of such diverse realisers for a single functional/causal role proves that the higher-level kind (predator, money, rigidity, *pain*) is a genuine, autonomous explanatory category. The fact that vastly different physical systems can fulfil the *same role* in their respective contexts shows that the special science law or concept tracks something real and indispensable.
      *   **What Needs Explaining:** Why higher-level explanations aren't rendered superfluous by lower-level (e.g., neurological) descriptions. The answer: because the higher-level kind abstracts away from the messy physical details to capture robust, causally relevant patterns that would be invisible or intractable at the micro-level. Pain isn't *just* C-fibres firing; it's a state defined by its role in avoiding harm, causing distress, etc., which silicon or alien goo could also play.
      *   **Stance on Reduction:** "Reduction" might be true in some weak, compositional sense (everything is physical), but it doesn't entail *elimination* or *explanatory usurpation*. Special sciences are here to stay.

  2.  **Camp 2: Causal Exclusion and the Metaphysics of Doing (Causal Bookkeepers)**
      *   **Core Concern:** Assigning causal responsibility without double-counting or positing spooky over-determination. They worry about the causal efficacy of the mental *qua mental*.
      *   **Key Move:** Granting multiple realisability *provisionally* only to then argue that it either collapses into functionalism (making the mental state *nothing over and above* the abstract causal role) *or* that the realisers aren't truly diverse enough to make the mental state causally distinct. Their counter-example isn't another special science, but **pushing the physical differences**. If the realisers (e.g., human pain neurology vs. Martian pain goo) are *radically* different physically, how can they *both* be the literal, concrete cause of *this specific instance* of wincing? Either:
          *   The *only* thing they share is the functional profile (which does the causal work abstractly), making the mental state functional, not a concrete brain state *or* goo state. Or...
          *   The physical differences *do* entail subtle causal differences in how the role is implemented, meaning the Martian isn't *truly* in pain in the *identical* way, or human pain and Martian pain are distinct kinds despite similar behaviour.
      *   **What Needs Explaining:** How the multiply realisable mental state itself can be the *concrete cause* of an effect if its wildly different physical realisers are the things actually doing the pushing and pulling in the world. If the goo's physical properties cause the Martian to recoil, what causal work is left for "pain" *itself* to do? They see a tension between multiple realisability and non-overdetermining causation.
      *   **Stance on Reduction:** Reduction *must* be stronger to avoid causal exclusion. If the mental state is just the physical state on each occasion, causation is clear. If not, it risks epiphenomenalism.

  **Why the Stalemate:**

  *   **Different Questions:** Camp 1 hears Camp 2's counter as missing the point about explanatory autonomy. Camp 2 hears Camp 1's examples as hand-waving the causal exclusion problem. Camp 1 says "Look, money works!" Camp 2 says "Yes, but *which physical bits* actually bought the coffee?"
  *   **Evidence Can't Break the Tie:** Neuroscientific findings about homology are fascinating but ultimately indecisive for the core conflict.
      *   Finding diverse neural implementations for pain-like behaviours in different species *delights* Camp 1 (proof of multiple realisability in practice).
      *   Finding subtle functional/causal differences in those diverse implementations *delights* Camp 2 (proof that the functional role isn't perfectly shared, so the mental state isn't identical across them, or that the physical difference *does* matter causally).
      *   Camp 1 can always argue the neuroscientist is demanding too much physical similarity for it to count as "multiple realisation," missing the special-science perspective. Camp 2 can argue the neuroscientist is revealing the cracks in the functionalist abstraction. The evidence feeds *pre-existing* commitments.
  *   **Empirical Drag:** The neuroscientist's point about messy homology highlights that real biological systems are complex kludges, not clean philosophical thought experiments. This *complicates* both positions but doesn't *refute* either. Camp 1 can say messy implementations still realise the functional kind well enough; Camp 2 can say the messiness shows functional equivalence is rarely perfect.

  **The Substitution Test: Where It Lands**

  Your computational neuroscientist's proposal lands firmly within the orbit of **sophisticated functionalism**, but adds nuance.

  *   **It *is* Functionalist:** The core idea – defining a state by its causal relations (inputs, outputs, other internal states) – is classic functionalism. Sameness of causal role defines sameness of state. Filing off the serial numbers is apt.
  *   **The Novel Nuance:** Making it **context-dependent** and a **matter of degree** is significant. It moves away from the binary "Is it *the same state*?" towards "How *interchangeable* are these systems *in this specific causal network/context*?" This reflects how engineers and neuroscientists often think practically about systems.
  *   **Does it Break the Deadlock?** Not really. It **relocates and reframes it**.
      *   **For Camp 1 (Autonomy):** They'll likely embrace it as a practical, empirical test *for* functional equivalence, strengthening their case that functional kinds are legitimate and measurable. The gradience allows them to say "close enough" for special-science purposes.
      *   **For Camp 2 (Causation):** The deadlock *shifts*. The question becomes: "When you substitute system A for system B in the network and *nothing changes*, what is doing the causing? Is it the *functional state description* (e.g., 'node N firing') or the *specific physical realiser* in A or B? And if the latter, how can *different* physical realisers be the cause of the *identical* downstream effects?" The causal exclusion problem reappears at the level of the functional specification vs. its physical implementation, even with gradience. The test operationalises functional equivalence but doesn't resolve *why* equivalent functional states have causal power.

  **What Counts as Progress (or Admitting Stalemate):**

  1.  **Clarifying the Distinction:** Explicitly separating the "Autonomy of Special Sciences" debate from the "Causal Exclusion/Metaphysics of Causation" debate *within* discussions of multiple realisability. Acknowledging they are linked but distinct problems. Your piece could do this powerfully.
  2.  **Reframing Causation (The Best Hope?):** Progress might come from abandoning the "billiard ball" model of causation that Camp 2 often (sometimes tacitly) relies on. Embracing a **difference-making** or **interventionist** account of causation (where causation is about how changes in one variable *depend* on changes in another under interventions). Here, both the physical realiser *and* the functional state can be difference-makers, at different levels of abstraction, without overdetermination. *This* is where formal results (e.g., using causal modelling frameworks) *could* help by showing how causation can be multi-level. Camp 2 might remain sceptical, demanding a single "causal oomph" level.
  3.  **Embracing Pragmatism/Gradience:** Following the substitution test's lead, shifting focus from "Is pain *really* multiply realisable?" to "Under what conditions, to what degree, and for what purposes can we treat these diverse systems *as* sharing a state?" This dissolves the metaphysical deadlock into pragmatic questions about explanation and modelling. It accepts that "sameness of state" is context-relative and interest-relative. The neuroscientific evidence on homology becomes directly relevant *here*.
  4.  **Admitting Stalemate (On the Core Metaphysics):** If neither side budges on their core metaphysical commitments about causation or the nature of levels, and no knock-down empirical case is possible (as argued above), then the central metaphysical dispute *is* unresolvable by current arguments and evidence. The reason is fundamental: it rests on incompatible intuitions about what causation *is* and what it means for a higher-level property to be "real." The debate cycles because each side's foundational assumptions render the other's arguments irrelevant or question-begging.

  **Conclusion:**

  Your diagnosis is correct. The stalemate arises because Camp 1 defends special-science autonomy using multiple realisability as a shield, while Camp 2 wields multiple realisability as a sword against the causal efficacy of the mental, demanding a singular causal ledger. Neuroscientific evidence feeds the debate but can't resolve it because the core conflict is about *interpretation* and *metaphysical commitments*. The substitution test offers a useful, graded, context-sensitive functionalism but relocates, rather than resolves, the causal exclusion worry.

  **Progress lies in:** 1) Explicitly cleaving the two debates apart, 2) Exploring refined, multi-level accounts of causation (difference-making), or 3) Pragmatically shifting focus to context-dependent interoperability and degrees of functional equivalence, accepting that the deepest metaphysical knot might remain tied. Your piece gains traction by exposing this dual structure – that's the clarity needed to move forward, even if the ultimate philosophical impasse remains.
