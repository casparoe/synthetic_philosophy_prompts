  For the loop, she needs to verify a citation each time. The perturbation is the library page resetting to the homepage after inactivity. She believes the citation is accurate (requirement 2), so she doesn't question it. The "drag back to the lip" is reopening the library portal; "checking the burrow" is re-deriving the citation's correctness. 

  Why doesn't she notice the loop? The library reset is a small change that doesn't register as significant. Her focus stays on verifying the citation, not the process. The non-sphex version would have a browser plugin saving her session, acting as an external memory. 

  The skeptic might say this is just sunk cost fallacy. But the reply is that sunk cost involves conscious choices, while her behavior is automatic. The vulnerability is the library's silent reset—if it were more noticeable, the loop breaks. 

  I should check all requirements: intelligence shown, correct beliefs, perturbation, clear steps. The frame problem explains why she doesn't see the reset as relevant. The artifact (plugin) offloads the cognitive task, making it cheaper than raw intelligence. 

  Most likely failure point? If the perturbation isn't subtle enough, breaking requirement (3). Or if her re-deriving the citation seems implausible. Need to ensure the reset feels like a normal glitch, not worth noting. 

  Also, the user mentioned no sci-fi, drugs, etc. The library reset is mundane, fitting the spec. The brother's EMT objection is addressed by the automatic nature of her actions—like muscle memory overriding conscious notice.
answer: |-
  Here’s the scenario, engineered to your specifications:

  ### The Scene  
  Eleanor scrutinizes a dense philosophy manuscript. On page 117, she spots an apparent contradiction in a critique of Quine: the author cites "Quine 1951, p. 43" claiming universals are indispensable, but Eleanor recalls Quine’s *Two Dogmas* rejects them. She cross-references her digital archive of Quine’s works, confirming the citation is misattributed—it’s actually from *From a Logical Point of View* (1953), where Quine *defends* universals contextually. She emails the author, attaches both PDFs, and highlights the key paragraphs. Satisfied, she saves her notes.  

  But when she reopens her notes file to log the correction, the citation discrepancy reappears in the manuscript. Unaware that her email client autosaves drafts to a local folder (not "Sent") due to a background sync error, she assumes she never sent the correction. She re-derives the solution: rechecks Quine’s 1953 text, reconfirms the misattribution, and rewrites the email.  

  ### Walkthrough  
  1. **Trigger**: Manuscript shows "Quine 1951, p. 43" defending universals.  
  2. **"Check the Burrow" (Fixed Sub-step)**: Her lifelong belief: *"Quine rejected universals in 1951"*. She skips re-verifying this core axiom.  
  3. **"Drag to the Lip" (Redone Sub-step)**: She re-derives the *specific citation error* from scratch: checks *Two Dogmas* (1951) → finds no universals defense → cross-references her archive → locates the 1953 source → confirms misattribution.  
  4. **Perturbation**: Email sync failure (draft autosaves locally; "Sent" folder empty).  
  5. **Reset**: Reopening her notes file shows the uncorrected manuscript. She believes:  
     - The citation is still wrong (true).  
     - She *must* have forgotten to send the email (false, but she never checks "Sent" folder).  
     - Her archive and Quine’s texts are authoritative (true).  
     - Her email system is reliable (false, but error is silent).  

  ### Why the Loop Sustains  
  - **Perturbation Invisibility**: The sync error leaves no trace (no "failed to send" alert; draft folder is obscure). The reset (reopening notes) presents identical input.  
  - **Costly Re-derivation vs. Cheap Axiom**: Re-deriving the citation (30 mins of cognitive labor) *feels* urgent and productive. Checking email settings (10 seconds) seems irrelevant—she "knows" emails send unless *she* forgets to click.  
  - **Intelligence Showcase**: Her Quine scholarship is genuine expertise—spotting the misattribution requires deep, fluid knowledge of 20th-century analytic philosophy.  

  ---

  ### Analysis  
  **Frame Problem Failure**:  
  She possesses all facts:  
  - *F₁*: Sent folder is empty.  
  - *F₂*: Drafts exist in local folder.  
  - *F₃*: Email sync has glitched before (but rarely).  
  Her cognitive architecture tags *F₁* as relevant ("I didn’t send it"), but *F₂*/*F₃* aren’t indexed to this context. Relevance-detection is heritagely optimized for *manuscript* errors, not system errors.  

  **Non-Sphex Version**:  
  Add a browser extension that logs all email actions visibly. Now she sees "DRAFT SAVED" and "SEND FAILED" alerts. This isn’t raw intelligence—it’s a *Dennettian artifact* outsourcing vigilance. The cost is near-zero; her cognition offloads the monitoring.  

  **Critical Feature**:  
  The **silence of the failure**. If the email client visibly corrupted text or generated an error tone, she’d notice. The perturbation must be *informationally inert*—it resets state without emitting evidence.  

  **Skeptic Attack & Reply**:  
  - *Attack*: "This is just sunk cost! She’s invested in being thorough, so she repeats the 'productive' task (fixing Quine) while avoiding the 'wasted' task (checking tech)."  
  - *Reply*: Sunk cost implies *awareness* of prior investment. Here, she genuinely perceives each iteration as *new*. The loop is pre-intentional—like reloading a frozen webpage 5 times before realizing your Wi-Fi is off. Her expertise *creates* the blindness: the harder the derivation, the more it monopolizes attention.  
  - *Does the Reply Hold?*: Only with the **re-derivation step**. If checking email were equally complex, she might loop on *that*. The asymmetry in cognitive cost is essential.  

  **Likely Failure Point**:  
  **Requirement (3) - Perturbation Repeatability**. If the sync error is probabilistic (e.g., fails 70% of time), she *might* eventually question the system after 3 failures. To fix: make the failure *deterministic* (e.g., a corrupted email setting always saves drafts locally until manually reset).  

  **Constraint Tradeoff**:  
  **Requirement (2) - No False Beliefs** is brittle. She *must* believe "emails always send unless *I* err." If she harbored doubt about the tech, the loop breaks. But this belief is *approximately* true—it fails only in edge cases. Soften this to: "no *explicitly held* false belief; background assumptions can be invisibly faulty."  

  ### Final Note  
  This isn’t stubbornness. Stubbornness fights evidence; here, evidence *doesn’t exist* in her sensorium. Like the wasp, her recursion is a closed circuit: the re-derivation *consumes* all cycles, leaving none to audit the axioms or environment. The tragedy isn’t that she’s blind—it’s that her vision is too sharp in the wrong direction.  

  ---  
  **Test Case**: If she *accidentally* saw the draft folder, would she stop? Yes—instantly. That’s your proof it’s not motivated reasoning. Pull that thread: let a colleague glimpse her screen during the loop and say, "Why does your email say 'Draft Saved'?" The spell shatters.
