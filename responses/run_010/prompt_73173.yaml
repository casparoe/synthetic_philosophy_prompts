prompt: |-
  So I'm giving a work-in-progress talk to my own department in about three weeks and I'd rather walk in with a Q&A prep sheet than discover my weak spots live in front of everybody.

  The chapter's thesis: when you're a temporary visitor somewhere with a settled everyday convention — the local tipping rate, how the queue forms at a bus stop, whether people cross against the light when the street is completely empty — you pick up a real, defeasible moral obligation to go along with it. Not because your one crossing or your one skipped tip harms anybody; the whole point is that in the particular case nobody is made worse off and you could stipulate that. The obligation is supposed to come from two places at once. First, the convention is a small standing public good that the locals keep paying into by monitoring each other and swallowing the occasional inconvenience, and a visitor who enjoys the resulting predictability while exempting himself is free-riding on it. Second, non-compliance is expressive: declining to hold yourself to the local rule is a way of declining to treat these people as ones you need to coordinate with, which reads as contempt even when it costs them nothing. Then I have a defeater clause — the obligation lapses when the convention is itself an instrument of domination or humiliation (queueing at a segregated counter, a tipping norm that persists because employers are allowed to pay a sub-minimum wage and let the tips make up the difference), and in those cases the visitor's duty is to not comply, or at least not to comply silently.

  The room will be about twelve people and almost none of them work on this. Two fairly orthodox Rawlsian political philosophers. One Scanlonian contractualist who will immediately want to know what principle nobody could reasonably reject is doing the work here and whether I've smuggled in a practice-relative version of it. A couple of metaethicists, one of whom is a cheerfully self-described error theorist and treats these sessions as sport. A visiting anthropologist who did years of fieldwork in market settings and is deeply suspicious of philosophers generalising about "what people around here do." And a law professor who writes about how customary norms get recognised in international law, who will be measuring my account against how custom actually hardens into something binding. Nobody in the room is a convention specialist, so Lewis-flavoured coordination talk is not shared background and I don't want to burn the question period explaining it.

  What I want is the prep sheet, not a defence of my view and not a rewrite of the talk. Roughly eight objections I'll actually get from this room — not the ones a game theorist or a Kant specialist would raise — ordered by how much damage each would do, and each phrased the way that specific person would phrase it, so I can hear it coming. For each one: what I should concede in the first sentence, the two-minute reply, and an honest note about where that reply goes soft or quietly changes the subject. Mark separately the objections that only look devastating because they've misread me, and tell me the single sentence I could plant in the talk that kills each of those before it gets raised. And then the one question im quietly hoping nobody asks — I have a suspicion what it is, but I want your guess and your reason for it, especially if you think it's a different one than mine.

  No reading list, no bibliography, no "you should engage with so-and-so's recent paper." I know the literature. I need to know where I lose the room.
reasoning: |-
  Okay, the user is preparing for a Q&A session for their department talk and wants a prep sheet with potential objections. Let me start by understanding their thesis. They argue that temporary visitors have a moral obligation to follow local conventions due to free-riding and expressive reasons, with defeaters for oppressive norms.

  First, I need to consider the audience. There are Rawlsians, a Scanlonian, metaethicists, an anthropologist, and a law professor. Each has different concerns. The Rawlsians might focus on fairness and the social contract. The Scanlonian will care about reasonable rejection. The error theorist will challenge moral foundations. The anthropologist will question generalization, and the law professor will look at norm hardening.

  For the Scanlonian, the objection would be about the principle behind reasonable rejection. The user needs to concede that it's practice-relative but argue for reciprocity. The weak point is whether reciprocity can be framed without being circular. Planting a sentence in the talk about defeasible obligations arising from reciprocal participation might help.

  The anthropologist's issue with overgeneralization is key. The user should concede variability but argue for context-specific cues. The reply's weakness is assuming visitors can accurately interpret these cues. Mentioning the need for observable patterns in the talk could preempt this.

  The law professor might say that conventions aren't binding without recognition. Conceding the difference between moral and legal norms, then distinguishing the grounds for obligation. The soft spot is the analogy to legal custom. A sentence on moral obligations preceding legal recognition might address this.

  The Rawlsians might see this as outside the basic structure. Agreeing but arguing for non-ideal theory and ancillary duties. The weakness is the scope of the two principles. Highlighting non-ideal contexts in the talk could help.

  The error theorist's objection on moral facts needs a concession on ontology but focusing on phenomenology. The reply might sidestep the metaethical debate, which is a weakness. Stating the focus on lived experience could preempt this.

  The defeater clause might be seen as arbitrary. The user should acknowledge the difficulty but use political philosophy principles. The soft spot is the line-drawing problem. Emphasizing substantive moral criteria in the talk might help.

  The "no harm" objection requires conceding no direct harm but stressing systemic and expressive harm. The weakness is empirical evidence. A sentence on structural and symbolic harm could preempt this.

  The "why not always resist?" objection needs acknowledging activist stances but differentiating visitor roles. The soft spot is the visitor's limited responsibility. Clarifying context-dependent obligations in the talk would address this.

  The nightmare question is likely about the threshold for domination. The user might fear this because it's vague. The answer involves case-by-case judgment, which is messy. Preparing examples and criteria is essential.
answer: |-
  Here's your Q&A prep sheet, tailored to your specific audience and thesis. Objections are ordered by potential damage level (high to moderate), phrased as your colleagues would likely ask them, with responses and self-critical notes. Preemptive sentences are marked.

  **The Nightmare Question (Your Suspicion Confirmed):**
  *   **Question:** "You rely heavily on identifying when a convention is an 'instrument of domination or humiliation' to trigger your defeater clause. But *who gets to decide* that threshold, and *by what objective criteria*, especially for a temporary visitor with limited context? Isn't this just importing your own political judgments arbitrarily, making the whole obligation hinge on subjective outrage?"
  *   **Why it's the Nightmare:** It directly attacks the operationalizability and objectivity of your key limiting principle (the defeater clause). Your answer will inevitably involve normative judgment calls ("substantive moral principles," "political philosophy") which the error theorist will mock, the anthropologist will see as culturally imperialistic, the Rawlsians will want grounded in a specific theory (which you haven't fully provided *here*), and the law professor will see as hopelessly vague compared to state practice/opinio juris. It exposes the most philosophically and practically vulnerable part of your argument.
  *   **Likely Asker:** Could come from anyone, but the Rawlsians, Scanlonian, or Law Prof are most likely to zero in on this foundational ambiguity. The Anthropologist might frame it as cultural imposition.

  **High-Damage Objections:**

  1.  **The Scanlonian (Reasonableness & Smuggling):**
      *   **Objection Phrasing:** "You talk about obligations arising from convention, but obligations need a source. Isn't the real work here being done by a principle like 'One must not free-ride on mutually beneficial schemes' or 'One must show basic respect to those one interacts with'? And if so, isn't your 'convention-specific' obligation just an application of a *general* principle nobody could reasonably reject? Isn't this Scanlon in convention's clothing, and if not, what non-Scanlonian principle is generating this unique obligation?"
      *   **Concede First:** "You're absolutely right that general principles of fairness and respect are foundational here; I'm not claiming conventions create obligations *ex nihilo*."
      *   **2-Minute Reply:** "The specificity comes from how conventions *activate and specify* those general principles in context. The 'reasonable rejectability' test applies *relative to the practice*. Could locals reasonably reject a principle allowing visitors to enjoy the predictability their convention creates while exempting themselves from contributing? I argue 'No'. The obligation isn't *created* by the convention; it's triggered *by* the visitor's participation in the benefits *of that specific cooperative scheme*. It's the context-dependent *application* of reciprocity that's practice-relative, not the underlying principle itself."
      *   **Goes Soft/Changes Subject:** Soft spot: It risks circularity (the obligation exists because it would be unreasonable to reject a principle requiring it... because of the obligation?). It subtly leans on Scanlon while trying to appear distinct. Changes subject slightly by focusing on the *activation* of principles rather than fully defending a unique "convention-source".
      *   **Preemptive Sentence:** "This obligation arises not because the convention *invents* morality, but because *knowingly benefiting from a specific, sustained cooperative practice while exempting oneself* violates defeasible principles of reciprocity and mutual recognition that apply *within the scope of that practice*."

  2.  **The Anthropologist (Overgeneralization & Nuance):**
      *   **Objection Phrasing:** "You keep saying 'the local convention', 'what people around here do'. But my fieldwork shows norms are *never* monolithic. There's variation by age, class, time of day, neighborhood, situation. Your 'bus queue convention' might be strict downtown at rush hour but loose in the suburbs, or differ based on who's waiting. How can a visitor possibly identify *the* convention? Aren't you philosophers reifying something messy and contested into a false uniformity to make your moral theory tidy?"
      *   **Concede First:** "You're completely correct that norms are often complex, situational, and contested; I'm not claiming perfect uniformity or easy identifiability."
      *   **2-Minute Reply:** "The obligation kicks in when there *is* a reasonably clear, observable pattern of behavior that functions as a coordination device *in that specific context* where the visitor acts. It doesn't require philosophical certainty about the 'One True Convention'. It requires attentiveness to the *observable* patterns *in the situation they are in*. If most people queue linearly at *this* bus stop at *this* time, that's the relevant convention for *this* act of boarding. The moral demand is to engage with the *actually existing coordination effort* present, not an abstract ideal."
      *   **Goes Soft/Changes Subject:** Weakness: Assumes visitors can accurately perceive the dominant pattern, which isn't always easy. It brushes aside internal contestation or power dynamics *within* the local group establishing what "counts". Changes subject to "observable pattern in the situation" which may dodge the depth of anthropological critique about how norms *are* constituted.
      *   **Preemptive Sentence:** "Of course, identifying 'the convention' requires context-sensitive observation of the *dominant, functionally operative pattern of behavior in the specific setting* where the visitor acts, acknowledging it may not be monolithic or uncontested."

  3.  **The Law Professor (Custom vs. Morality):**
      *   **Objection Phrasing:** "In international law, custom hardens into binding law through widespread state practice driven by a sense of legal obligation (*opinio juris*). Your 'moral obligation' seems divorced from that. Where's the *sense of being morally bound* by the locals themselves? If locals break the convention frequently without compunction (like jaywalking), does your obligation still hold for the visitor? Isn't your account missing the crucial element of internal normative acceptance that makes custom *obligatory*, not just habitual?"
      *   **Concede First:** "You highlight a key difference; I'm not arguing that conventions become *legally* binding like CIL. The *opinio juris* equivalent here is different."
      *   **2-Minute Reply:** "The 'bindingness' for the visitor stems from the *functional reality* of the convention as a cooperative scheme they benefit from, and the expressive meaning of their non-compliance, *not* primarily from the locals' own internal sense of moral obligation to it (though that often exists). Even if locals occasionally defect without guilt (jaywalking when safe), the convention *still exists* as the default coordination device they generally rely on and enforce. The visitor's free-riding and expressive contempt arguments apply precisely *because* the convention is the functional norm, regardless of its perfect internalization. The locals' *practice* of maintaining it (monitoring, occasional conformity) is the key evidence."
      *   **Goes Soft/Changes Subject:** Soft spot: Risks making the obligation seem external and imposed, detached from the participants' own understanding. Doesn't fully address what *makes* something a "cooperative scheme deserving reciprocity" if participants themselves don't strongly feel bound. Changes subject from internal acceptance to functional utility and external perception.
      *   **Preemptive Sentence:** "The moral obligation for the visitor arises from the *functional role* of the convention as a locally sustained public good and the expressive significance of participation, independent of the precise strength of *opinio juris* among every local participant."

  **Moderate-Damage Objections:**

  4.  **Rawlsian 1 (Outside the Basic Structure):**
      *   **Objection Phrasing:** "This seems like an attempt to derive quite strong moral obligations from micro-level social practices. But Rawls focuses obligations of fairness on the major institutions of the 'basic structure'. Aren't you over-moralizing everyday interactions? Why should these micro-conventions carry the weight of a *moral obligation*, rather than just being matters of politeness or prudence? Doesn't this dilute the concept of obligation?"
      *   **Concede First:** "It's fair to question whether this rises to the level of obligations generated by the basic structure; the *weight* may indeed be different."
      *   **2-Minute Reply:** "I see this as complementary, not contradictory. The basic structure sets the background. Within that, micro-conventions are small-scale *instances* of social cooperation solving coordination problems. Fairness applies *within* cooperative schemes, big or small. While perhaps less weighty than duties of justice, the core arguments against free-riding and for mutual recognition apply here too. It's about ancillary duties within the broader framework of a cooperative society."
      *   **Goes Soft/Changes Subject:** Weakness: Doesn't definitively establish why free-riding on a micro-convention is a *moral wrong* of the same type (even if lesser degree) as undermining basic institutions. Might feel like stretching 'fair play'. Changes subject to 'complementarity'.
      *   **Preemptive Sentence:** "These obligations function as defeasible ancillary duties *within* a broader cooperative framework, applying principles of fairness and recognition at the micro-level where coordinated social life actually happens."

  5.  **The Error Theorist (Moral Fiction):**
      *   **Objection Phrasing:** "This is all very elaborate, but you're just weaving an intuition pump. 'Free-riding', 'expressive contempt', 'obligation' – these are moral concepts you're presupposing exist. But if moral facts are fictions (as I hold), then you're just describing feelings of disapproval locals *might* have, or pragmatic reasons to avoid annoyance. Where's the *truth-maker* for this supposed obligation beyond social pressure or personal preference?"
      *   **Concede First:** "From your metaethical perspective, naturally, the whole project rests on assumptions you reject."
      *   **2-Minute Reply:** "My argument operates within the domain of normative ethics, assuming we *are* trying to figure out what we owe each other. If we grant that framework, even hypothetically, the free-riding and expressive arguments provide strong *reasons* within that system to conform, reasons that persist even if we stipulate the individual act causes no direct harm. This is about the structure of social cooperation and mutual regard, concepts that have normative traction *if* we accept any normative project at all."
      *   **Goes Soft/Changes Subject:** Entirely sidesteps the metaethical challenge by retreating to a conditional ("*if* we care about normative ethics..."). Doesn't engage the error theory on its own terms. Changes subject to intra-normative reasoning.
      *   **Preemptive Sentence:** (Less effective preemption here, as it's a foundational challenge). Perhaps: "I'm offering a first-order normative account of the demands arising within practices of social coordination, bracketing deeper metaethical questions."

  6.  **Rawlsian 2 / Scanlonian (The Defeater Clause Problem):**
      *   **Objection Phrasing:** "Your defeater clause seems both crucial and dangerously vague. You mention segregation and sub-minimum wage tipping. But what about less extreme cases? Is a deeply sexist local greeting convention 'dominating'? What about conventions reinforcing subtle class hierarchies? Doesn't your clause either require visitors to make complex political judgments they're ill-equipped for, or risk being so broad it swallows the initial obligation? How is this not arbitrary?"
      *   **Concede First:** "Determining when a convention is sufficiently oppressive to trigger the defeater *is* difficult and context-dependent; there's no bright-line rule."
      *   **2-Minute Reply:** "The defeater isn't triggered by mere imperfection or mild unfairness, but when the convention *itself* is a tool for systematic humiliation, subordination, or upholding an unjust background structure (like segregation laws or exploitative labor practices). It requires judgment, grounded in principles of equality and freedom. The visitor's duty shifts: not silent compliance, but potentially non-compliance *as a form of solidarity* or at minimum, non-participation in the humiliation. The burden of judgment is real, but so is the moral danger of complying with truly oppressive norms."
      *   **Goes Soft/Changes Subject:** Soft spot: Exactly the nightmare question territory. Relies on substantive but undeveloped political principles. The "systematic/subordination" criterion is still fuzzy. Changes subject to defining oppression, which is huge.
      *   **Preemptive Sentence:** "The defeater applies when compliance would mean participating in a practice that is *intrinsically* degrading or instrumental to upholding a substantial injustice, judged by substantive moral principles of equality and dignity."

  7.  **General (The "No Harm" Counter):**
      *   **Objection Phrasing (Likely from a Rawlsian or Pragmatist):** "You stipulate the individual act causes no harm. But if *every* visitor reasoned that way, the convention *would* collapse, causing harm. Isn't your argument just a standard 'what if everyone did that?' Kantian generalization argument dressed up? And if so, does it really generate an *obligation* in the single case, or just a weak prudential reason to avoid being part of the critical mass that *might* cause collapse?"
      *   **Concede First:** "The generalization argument is certainly related, and if my one act *were* the tipping point, the harm would be clear. But I'm stipulating it's not."
      *   **2-Minute Reply:** "My argument doesn't *rely* on the generalization leading to collapse. Even if my single act couldn't possibly cause collapse, two distinct wrongs remain: 1) **Free-riding:** I still benefit from the predictability/stability *others* maintain through their compliance, without contributing my share (conformity). It's unfair enjoyment of a good I help sustain for others. 2) **Expressive Contempt:** Choosing not to follow the local rule, especially when it costs me nothing, *expresses* that I don't consider myself bound to coordinate with *these* people on *their* terms. That expressive act is itself a moral failing, a denial of basic recognition, irrespective of consequences."
      *   **Goes Soft/Changes Subject:** The free-riding point relies on the convention being a "good" worth sustaining, which might be contested. The expressive argument is powerful but somewhat subjective – is the interpretation of "contempt" fair? Changes subject from consequences to unfairness and expression.

  8.  **General / Anthropologist (Why Not Always Resist?):**
      *   **Objection Phrasing:** "If some conventions are oppressive (triggering your defeater), and others are merely arbitrary or silly, why have a *presumption* to comply? Shouldn't the visitor be a critical thinker, questioning norms rather than mindlessly following them? Isn't your obligation potentially conservative, discouraging positive social change that might start with non-conformity?"
      *   **Concede First:** "Critical engagement with norms is vital! My argument isn't for mindless conformity."
      *   **2-Minute Reply:** "The defeasible obligation applies specifically to conventions that function as *beneficial coordination devices* (like predictable queueing or tipping ensuring service). It doesn't apply to arbitrary, non-coordinative 'norms' (e.g., fashion). The presumption to comply arises *because* these conventions solve shared problems. Deliberate non-compliance *as protest* against genuinely harmful norms is laudable (and covered by the defeater!). But non-compliance with harmless coordination conventions purely out of laziness, superiority, or disregard *is* the problem I'm targeting. It disrespects the local effort at cooperation without offering a constructive alternative."
      *   **Goes Soft/Changes Subject:** Relies on cleanly distinguishing "beneficial coordination conventions" from other norms. The "harmless" qualification is tricky – is *any* convention entirely harmless? Changes subject to the *type* of convention and the *reason* for non-compliance.

  **Key for your Prep:**
  *   **Rehearse the Concessions:** Starting with "You're right to point out..." disarms and shows you've heard them.
  * **Focus on Core Arguments:** Hammer the **Free-Riding on Local Cooperation** and **Expressive Contempt/Denial of Recognition** points relentlessly. They are your unique anchors.
  * **Defend the Defeater Pragmatically:** Acknowledge the line-drawing difficulty but emphasize the *clear core cases* (segregation, exploitative labor practices) and the *moral necessity* of having such a clause. Prepare concrete examples.
  * **Bracket Lewis/Metaethics:** "That's an important question, but perhaps beyond the scope of this chapter focusing on the first-order normative implications..." is your friend for game theory or deep metaethics.
  * **Plant Those Sentences:** Weave the preemptive phrases naturally into your talk description of the obligation and the defeater. They *will* soften the blows.

  This prep sheet focuses on where *this specific room* is likely to push back. Good luck! The very fact you're prepping this way means you're ready.
