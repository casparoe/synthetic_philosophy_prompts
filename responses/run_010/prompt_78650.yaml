answer: |-
  ### System Designs

  **System A (Low Precision):**  
  This system uses low-precision (4-bit) computing elements, with identical architecture, element count (1 million units), and aggregate throughput (10^12 operations/second) as System B. Energy budget (100W) is matched via voltage scaling to offset lower per-operation energy costs. Memory is addressed (not statistical), with each location storing 4 bits, but error-correcting codes expand effective word size by spatial grouping. Training (reinforcement learning) matches System B on two tasks: (1) real-time Pong (motor-perceptual, requiring continuous paddle control and ball-tracking), and (2) multi-variable 20 Questions (holding state for 20 interdependent yes/no queries). Temporal coding—repeating operations over cycles—compensates for low precision, maintaining competence without added parallelism or redundancy.

  **System B (High Precision):**  
  Identical to System A in all parameters except precision: 16-bit computing elements. Same element count, throughput, energy budget, training, and task competence. Addressed memory stores 16 bits per location. Shallow serial depth (3 layers) and statistical memory are avoided by design; the architecture uses deterministic, addressed storage and processing. Precision enables direct high-accuracy computation without temporal or spatial redundancy, but parallelism and element speed are unchanged.

  ### Discriminating Experiment  
  **Task:** Compute the volume of an irregular polyhedron defined by 50 vertices, requiring high-precision floating-point integration (cumulative error < 10⁻⁶). Both systems receive vertex coordinates and 1ms computation time.  
  **Result:** System B succeeds (error ≈ 10⁻⁷). System A fails catastrophically (error ≈ 10⁻²) due to quantization noise amplifying in iterative calculations. The failure isn’t slowness—both use identical cycles—but an inability to represent intermediate values precisely, causing divergence in the integration path. System A cannot *converge* to the solution at all within its precision bounds.

  ### Checks  
  **Parameter at Work:** Precision per element. The experiment requires deep serial operations (iterative integration) where error compounds multiplicatively. Low precision (System A) forces large stepwise errors, derailing convergence. Other parameters are irrelevant: parallelism and element count are matched, memory addressing is identical, and speed/throughput are fixed.  
  **Relaxing Precision:** Increasing System A’s precision to 8-bit reduces error to ≈10⁻⁴—still failing but less severely. At 12-bit, it succeeds. The case weakens gradually but doesn’t collapse; precision remains the dominant constraint.  
  **Formal Analogy Attack:** Critics might argue precision is epiphenomenal, claiming the *real* issue is System A’s error correction (a "hidden" parameter). But error correction is a direct consequence of low precision—it’s not an independent variable—and is disabled in the novel task, exposing the core limitation.  
  **Honest Note:** We held other parameters fixed but tacitly allowed memory *capacity* to differ: System A’s 4-bit memory stores fewer unique values per location than System B’s 16-bit. This slipped because von Neumann links precision to memory organization (statistical vs. addressed), but we enforced addressed memory. However, the experiment doesn’t stress memory capacity (it uses minimal data), so the slip is irrelevant here. Precision alone drives the divergence.

  ### Why This Works  
  Von Neumann’s linkage (low precision → parallelism) is broken by compensating with temporal coding and error correction *without* altering parallelism. The experiment isolates precision by targeting iterative depth—where low precision fails intrinsically—proving it’s a fundamental constraint beyond wetware contingencies.
