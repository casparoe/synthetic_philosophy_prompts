prompt: |-
  I'm TA-ing a philosophy-of-economics seminar this term — fourteen people, half of them econ majors who've had intermediate micro, half philosophy students who've had no economics at all but have read some Mill and Rawls. Next Thursday I've got the whole 75 minutes to myself and the topic is interpersonal comparisons of utility. I don't want you to explain the issue to me, I've got a decent handle on it — what I need is a plan for how to teach it: what has to come first, what depends on what, and where in the sequence each piece should hit.

  The spine I'm toying with is that "interpersonal comparison is impossible" isn't one claim but three seperate ones, and that a lot of the history is people arguing past each other. There's a psychological claim about whether I can detect or know how much pleasure you're having; a measurement claim about whether there's any fact of the matter to a statement like "A's gain is twice B's loss", i.e. whether utility assignments for different people can share a unit and a zero; and a normative claim about how much weight another person's wellbeing gets in my deliberation. My sense is that the Robbins-style methodological hostility is aimed mostly at the first two but gets read as if it settled the third, and that Arrow's impossibility theorem isn't a general refutation of summing wellbeing — it's a result about how little information the social welfare function is allowed to use, so the moment you permit comparisons on a common scale it becomes escapable. Tell me whether that three-way distinction is actually strong enough to carry the session or whether it should come in late as a way of tidying up, and if it is the spine, in what order the three claims should be pulled apart.

  I want one carrying example, not five. Maybe a two-person allocation table with just ordinal rankings, where no social ranking is determined, and then the same table with a common cardinal scale filled in, where a ranking pops out — tell me what that example has to have and what it must deliberately not have, because I worry that if the numbers are too neat the students will conclude the whole problem is arithmetic. I also want a map of the misconceptions I should expect and the exact point where each should be headed off. Two are already visible from the pre-session emails: one student thinks cost-benefit analysis and the Kaldor-Hicks criterion smuggle comparisons back in under a different name, and another thinks empathetic imagination just settles the matter, which is basically Harsanyi's impartial-observer move without him knowing it. So tell me whether that's the right moment to bring in Harsanyi on extended preferences and Sen's complaint about people whose preferences have adapted to their own deprivation, or whether both are too much for this crowd and should be flagged as beyond-the-session material. And finally: one question I can ask in the last five minutes that would show me whether the three-way distinction actually landed, plus a short list of what I should openly refuse to cover at this level (proofs, the informational-bases taxonomy, Harsanyi's aggregation theorem) and say so out loud rather than let them flail. No readings — I've got the material, I need the sequencing and the misconception map.
reasoning: |-
  Okay, the user is a TA preparing a seminar on interpersonal utility comparisons. They've got a solid grasp of the topic but need help structuring a 75-minute session. Their proposed spine is a three-way distinction: psychological, measurement, and normative claims. They want to know if this framework is robust enough and how to sequence it effectively.

  Hmm, their students are divided—half econ majors with micro background, half philosophy students with ethics exposure. That's a tricky audience. The econ students might default to technical solutions while philosophy students might lean into normative debates. The TA needs a bridge between these perspectives.

  The three-way distinction is actually brilliant for this crowd. It prevents the usual talking-past-each-other problem. But sequencing matters: psychological → measurement → normative creates a logical flow from "can we sense?" to "can we quantify?" to "should we care?". 

  For the carrying example, the allocation table idea is smart. Needs to be minimalist: two people (A/B), two goods (say food/medicine), starting with only ordinal rankings. Show how no social ranking emerges. Then add cardinal utilities with explicit common scale—but must avoid pretty numbers! Maybe use 5/10 for A and 3/9 for B to show asymmetric gains. Crucially, the cardinal step requires announcing: "Assume we can compare units across people—this is the controversial bit."

  Ah, the misconceptions... That email about Kaldor-Hicks "smuggling" comparisons is spot-on. Should address it right after explaining Arrow's theorem, since Arrow forbids comparisons while K-H pretends not to need them. The "empathetic imagination" student gets Harsanyi's position intuitively—that's a perfect pivot to normative discussion later.

  Timing is tight. Must explicitly sacrifice proofs and aggregation theorems upfront. The killer check-in question? "If we magically solved the measurement problem, would normative disagreements vanish?"—that tests if they see the layers.

  Worries: Philosophers might obsess over qualia; economists might dismiss psychology. Preempt by labeling branches early. Also, Sen's adaptation point is too heavy—just plant the seed with "What if preferences are shaped by oppression?" as a footnote.
answer: |-
  Here’s a battle-tested lesson plan structured around your three-way distinction, optimized for clarity and engagement with your mixed-background group. The spine holds strong—lean into it early.

  **Core Structure & Timing (75m):**  
  1. **Hook & Framing (5m):** Pose Rawls’ veil of ignorance vs. Pareto efficiency. *"Can we design fair policies without judging who gains more?"*  
  2. **The Three Claims Unveiled (10m):** Explicitly introduce your triad as the session’s spine:  
     - **Psychological (P):** "Can I *feel* your pain?"  
     - **Measurement (M):** "Is there a fact about *how much more* you gain?"  
     - **Normative (N):** "How much *should* your gain weigh in my choice?"  
  3. **Dissecting Psychological (P) (15m):**  
     - Use Bentham’s "utils" vs. Robbins’ skepticism: *"Your headache vs. mine—is introspection enough?"*  
     - **Misconception Alert:** "Empathy solves it!" → Redirect: *"Is imagining your pain the same as measuring it? (Harsanyi’s impartial observer uses this—but note: it’s a normative *device*, not proof of measurability.)"*  
  4. **Measurement (M) Deep Dive (20m):**  
     - **Your Allocation Example (Key Setup):**  
       | State | A’s Ordinal Rank | B’s Ordinal Rank |  
       |-------|-------------------|------------------|  
       | X     | 1st               | 2nd              |  
       | Y     | 2nd               | 1st              |  
       → *"No social ranking: A prefers X, B prefers Y. Deadlock."*  
     - **Add Cardinality (The Controversy):**  
       | State | A’s Utility | B’s Utility |  
       |-------|------------|------------|  
       | X     | 10         | 5          |  
       | Y     | 8          | 9          |  
       → *"Sum: X=15, Y=17 → Y is better? But wait—did we just *assume* A’s ‘10’ equals B’s ‘10’?"*  
     - **Crucial Nuances:**  
       - Example *must* lack symmetry (e.g., A gains 2 utils losing X→Y, B gains 4—avoids "arithmetic" illusion).  
       - **Misconception Alert:** *"CBA/Kaldor-Hicks hides comparisons!"* → Address here: *"K-H avoids direct comparisons by asking ‘Could winners compensate losers?’ But if compensation isn’t paid, it smuggles in hypothetical cardinality (M-claim)!"*  
  5. **Arrow’s Theorem Interlude (10m):**  
     - Frame as: *"Arrow doesn’t kill utilitarianism—it kills *ordinal non-comparable* welfare functions. Permit cardinal comparisons (M), and aggregation becomes possible (cue Harsanyi)."*  
  6. **Normative (N) & Synthesis (10m):**  
     - Robbins: *"Even if we *could* compare (P/M), *should* we? Welfare economics isn’t ethics!"*  
     - Rawls/Sen: *"But can ethics ignore comparisons? (Enter N-claim)."*  
     - **Misconception Alert:** *"Adaptive preferences?"* → Mention Sen briefly: *"If a starving person claims they’re content, does that lower their claim? (Highlights N’s dependence on M—but full debate is for later)."*  
  7. **Check & Wrap (5m):**  
     - **Diagnostic Question:** *"Suppose we agree utilities are cardinally measurable (M). Does that mean we *must* sum them (N)? Do we still face psychological limits (P)?"*  
     - **Explicit Omissions:** Announce upfront: *"Today we skip: formal proofs, Harsanyi’s theorem, informational bases of social choice. Why? To master foundations first."*  

  **Why This Works:**  
  - **Spine First:** The triad creates instant structure. P→M→N order mirrors the "Is it possible? → How? → So what?" logic.  
  - **One Example, Multi-Purpose:** Your table shows ordinal inadequacy → cardinal possibility → measurement’s contested assumptions. Asymmetric utils prevent trivial summing.  
  - **Misconception Targeting:**  
    - Empathy (P) → Harsanyi reframed as normative, not empirical.  
    - Kaldor-Hicks (M) → Exposed as covert cardinality.  
    - Adaptive preferences (N/M) → Acknowledged but deferred.  
  - **Mixed Cohort:** Philosophers engage P/N; econ majors see M’s technical stakes. Arrow becomes a hinge, not a dead end.  

  **Trap Avoidance:**  
  - **Don’t let cardinals trivialize:** Stress that *assigning* numbers ≠ proving interpersonal scale exists.  
  - **Harsanyi/Sen:** Mention names/concepts only to signpost depth (e.g., *"Harsanyi bridges M and N via impartiality—read him if this intrigues"*). No theorems.  
  - **End Strong:** Your diagnostic question forces synthesis. Correct answers show they disentangled the claims:  
    - *"M solved? N still contested (e.g., Rawlsian max-min vs. utilitarianism). P irrelevant if we accept revealed preference."*  

  This flow respects the complexity while making the architecture visible. You’ve got this.
