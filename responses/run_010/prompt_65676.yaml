prompt: |-
  I'm trying to work out what I actually believe about choices that change who will exist, and my verdicts don't seem to hang together. Here they are.

  1. My council rezones a district and builds a ring road. A century and a half from now, essentially nobody alive then is anybody who would have been alive otherwise. Nothing wrong here, and nobody wronged, even loosely.
  2. The same council buries chemical waste on the cheapest site, knowing the containers will fail in two hundred years and badly injure whoever lives nearby then — people who, because of everything the decision sets in motion, would not otherwise have existed. Clearly wrong, and just as clearly not a wrong against any of them, each of whom will have a life worth living and would not trade it away.
  3. A doctor tells a woman to wait three months before conceiving because of a transient infection; conceiving now would mean a deaf child with a life fully worth living. She waits and has a hearing child. Right decision — but I don't feel that she avoided wronging anyone.
  4. A clinic holds two viable embryos, one of which would become that same deaf child with a life just as worth living, and transfers the other. Also right — except that here I want to say something was forgone, that the alternative would have been a wrong, though I cannot say to whom. Cases 3 and 4 look to me like the same facts, and I don't feel the same way about them.
  5. A neighbour, given the same advice, didn't wait. Her daughter is nine, deaf, thriving, and would not want to have been anyone else. I think my neighbour did something wrong; I also think it would be offensive to tell her so.
  6. A couple can stop at two children or go on to have twins, whose lives would each be somewhat worse — divided attention, more strain — but still clearly good, and whose existence means the single third child they would otherwise have had never exists. Permissible, I think, and none of my business. Yet this has the same shape as 2, which I condemned.

  My own tentative principle is that an act is wrong when the lives it causes to be lived are predictably worse than the lives that would otherwise have been lived. That gets 2 but seems to condemn 6, and I don't see how to add a clause about numbers without begging the question.

  Could you state a principle, or a small set of candidates, that delivers these verdicts? Say precisely what it is keyed to — it can't simply be "worse off than they would otherwise have been" — and then go clause by clause, saying which of the six cases forces each clause in. Tell me what the principle says about cases I haven't raised: a man with late-onset Huntington's who conceives knowing his child has a fifty per cent chance of a life that is worth living but cut short; a national tax policy that shifts childbearing earlier and so reshuffles who exists with no welfare difference at all; and a choice that predictably makes the lives that will be lived better than the alternative ones, where I suspect nothing is actually required. Finally, if no principle saves all six, say which verdict should go and why — I'd rather lose an intuition than acquire an epicycle for every case.
reasoning: |-
  Okay, this user has presented a fascinating ethical puzzle involving choices that affect who comes into existence. They've outlined six complex scenarios where decisions alter future populations, and their intuitions seem contradictory even to themselves. 

  Hmm... let me unpack what they're grappling with. The core tension revolves around whether we can harm potential people by bringing them into existence under suboptimal conditions, especially when the alternative is them not existing at all. The user has already spotted the paradox in their own judgments - they condemn some actions (like the chemical waste) but permit others (like having twins) even when both involve creating people who are worse off than hypothetical alternatives.

  I notice the user is intellectually honest - they admit their intuitions don't cohere and are willing to abandon some if needed. That's refreshing. They're clearly well-versed in population ethics (referencing Parfit's non-identity problem implicitly) but stuck on practical application. The Huntington's disease example suggests they're thinking about real-world implications.

  The challenge is to find a principle that satisfies all six cases without ad hoc exceptions. Their proposed "predictably worse lives" principle fails because it condemns case 6 (the twins) which they intuitively accept. I need to explore why identical structures (creating predictably worse-off people) feel different across scenarios.

  *scratches head* What's the hidden variable here? Maybe whether the harm is avoidable without sacrificing comparable goods? In case 2, the council could choose better containers at minimal cost. In case 6, avoiding "worse-off" twins means not having them at all - which is different. But wait, that doesn't explain case 5 where the mother could have waited with no sacrifice.

  Ah! Perhaps it's about whether the decision targets specific individuals versus statistical lives. In case 4 (embryo selection), we're choosing between two specific potential people. In case 3 (delayed conception), it's about the same biological child at different times. That might explain the differing intuitions even when facts are similar.

  *lightbulb moment* The "comparator" problem! We can't say the deaf child in case 5 is worse off than they "would have been" because they wouldn't have existed otherwise. This is Parfit's non-identity problem in action. The user senses this in case 2 but struggles elsewhere.

  For their additional cases: Huntington's example clearly shows risk imposition matters; tax policy is neutral if no welfare difference; and we're not obligated to create better lives (anti-natalism aside). This suggests a principle focused on avoidable harm to specific potential persons, not aggregate welfare.

  *deep breath* The best shot might be distinguishing between: a) harming future people who'll exist regardless (like chemical waste victims) versus b) choosing which possible people to bring into existence. In type A, we owe duties to future people; in type B, we don't wrong specific non-persons by not creating them. This resolves cases 1-4 and 6, but makes case 5 tricky - which might need rethinking.

  Ultimately, I'll propose a two-track principle with a "specific person" clause and an "unavoidable imposition" clause, then show where it requires overriding intuition in case 5. The user seems ready for that tradeoff - they'd rather lose one intuition than force coherence through contrivances.
answer: |-
  Here's a principle that aims to capture your intuitions while respecting the core challenge of non-identity (actions changing *who* exists):

  **The Principle of Avoidable Harm to Specific Future Persons:**
  An act is wrong if it *predictably imposes a significantly worsened existence* on *specific individuals* who will unavoidably exist in the future *relative to the existence they would have had under feasible alternatives*, **OR** if it *needlessly creates a specific person* who will have a *life not worth living*.

  **Key Components Explained:**

  1.  **"Predictably imposes":** Foreseeable consequence of the act.
  2.  **"Significantly worsened existence":** Avoids trivial harms; requires a substantial reduction in well-being (e.g., severe injury vs. slightly less parental attention).
  3.  **"Specific individuals":** Crucial distinction. It applies when the future people harmed *are the same individuals* who would exist under alternative actions (even if their circumstances differ). This avoids the non-identity problem for choices that *change who exists*.
  4.  **"Who will unavoidably exist":** The harm is imposed on people whose existence is fixed (or highly probable) regardless of the specific choice *in question*.
  5.  **"Relative to the existence they would have had under feasible alternatives":** The baseline is the best *available* alternative existence *for those same specific individuals*.
  6.  **"OR needlessly creates a specific person with a life not worth living":** Captures the uncontroversial wrong of creating someone condemned to suffering so severe their life is worse than non-existence.

  **Applying the Principle to Your Cases:**

  1.  **Rezoning/Ring Road:** No *specific* future person is harmed relative to their alternative existence (they wouldn't exist otherwise). No one is created with a life not worth living. **Permissible.**
  2.  **Chemical Waste:** **Wrong.** Specific individuals living near the site in 200 years *will unavoidably exist* (their existence is fixed by decisions made long after the waste burial). The act *predictably imposes a significantly worsened existence* on them (injury) relative to the existence *they* would have had without the contamination. The harm is avoidable (better containers/site).
  3.  **Doctor Advises Wait (Deaf Child Avoided):** **Permissible, no wrong.** The potential deaf child is *not* a specific individual who would unavoidably exist. Conceiving later creates a *different* specific individual (the hearing child). The mother chooses *which* specific child to create. She doesn't impose harm on a specific unavoidable future person relative to *their* alternative existence. She doesn't create anyone with a life not worth living.
  4.  **Clinic Chooses Embryo:** **Permissible, but a "wrong" is avoided?** Similar to case 3. Neither embryo is a *specific unavoidable future person* at the moment of choice. Choosing embryo A over embryo B means creating specific person A instead of specific person B. Creating person A (hearing) isn't wronging person B (who never exists). Creating person B (deaf) wouldn't be wronging person B either, as their life is worth living. **However:** The intuition of "forgone wrong" might stem from:
      *   **Risk:** Choosing the embryo with the known impairment *risks* creating someone with a life barely worth living or worse (even if *this* deaf life is worth living).
      *   **Comparative Harm Avoidance:** While not wronging B, choosing A avoids *imposing the harm of deafness* on a specific person (B) *who would be created*. This differs slightly from case 3 where delaying conception doesn't *create* the deaf child at all. The principle focuses on *wronging existing/specific* persons, not the mere act of creating someone with avoidable disadvantages when alternatives exist. *The principle strictly says no wrong is done to anyone in either 3 or 4 by choosing the non-disabled option.*
  5.  **Neighbour Didn't Wait (Deaf Child Exists):** **Tension.** The principle suggests this is **permissible** (like case 4). The deaf child is a specific person with a life worth living. She wasn't harmed relative to *her* alternative existence (non-existence). The neighbour created *this specific child* instead of a different hearing child. **However,** your intuition that it's "wrong" likely stems from:
      *   **Avoidable Harm Imposition:** By conceiving now, the neighbour *imposed* the harm of deafness *on this specific child* when she could have easily avoided it by waiting and created a different child without that harm. The child *is* harmed relative to a *possible* existence without deafness, but that existence isn't *hers*; it belongs to a different possible child. **The principle forces us to abandon the intuition that this act wrongs the deaf child.** The offensiveness of saying so reinforces this – it implies the child should not exist, which they reject.
  6.  **Having Twins vs. Singleton:** **Permissible.** The twins are *different specific individuals* from the singleton who would otherwise exist. While their lives are somewhat worse (divided attention) than the singleton's life *might* have been, they are not harmed relative to *their own* alternative existence (non-existence). Their lives are clearly worth living. The parents choose *which* specific children to create (twins vs. singleton). Contrast with case 2, where harm is imposed on *specific unavoidable future people* relative to *their* alternative existence.

  **Applying to Your Additional Cases:**

  *   **Man with Huntington's conceives:** **Permissible under the principle.** The child is a specific person. There's a 50% chance they inherit Huntington's. If they do, they have a life worth living but shortened. They are not harmed relative to *their* alternative existence (non-existence). The principle only condemns creating a life *not worth living*. The risk is high, but the principle doesn't forbid risk-taking that doesn't lead to a life not worth living. (Intuition might differ based on severity of suffering).
  *   **Tax Policy Reshuffling:** **Permissible.** No specific future person is harmed relative to their alternative existence (they wouldn't exist otherwise). Welfare is unchanged. No one is created with a life not worth living.
  *   **Choice Making Lives Better:** **Permissible NOT to choose it.** The principle imposes no obligation to create people who would have *better* lives than the alternative people who would exist. It only forbids harming specific unavoidable persons or creating lives not worth living. Choosing the status quo (resulting in people with lives worth living) is permissible, even if an alternative would create different people with even better lives.

  **Conclusion and Which Verdict to Lose:**

  This principle delivers your desired verdicts for cases 1, 2, 3, 4 (strictly), 6, and the additional cases, while being philosophically grounded in the non-identity problem. **The cost is abandoning the intuition that the neighbour (case 5) wronged her deaf daughter.**

  **Why lose this intuition?**

  1.  **Non-Identity Core:** It's the clearest example of the non-identity problem. The daughter owes her existence *to* the decision to conceive at that time. She cannot claim she would have been better off if her mother had waited, because *she* wouldn't exist. The "better off" person would be someone else.
  2.  **Coherence:** Holding onto this intuition creates inconsistency with cases 3 and 4, which are structurally identical in terms of causing a disabled person to exist instead of a non-disabled one. If case 5 is wrong, then cases 3 and 4 (if the mother/clinic chose the disabled option) should also be wrongs of the same kind. Your intuitions differentiate them, suggesting the *timing* or *context* (pre-conception vs. post-conception) isn't the morally relevant factor for the child; the principle identifies the relevant factor as whether a *specific* person is *unavoidably* being harmed relative to *their* alternatives.
  3.  **Offensiveness:** The offensiveness of criticizing the neighbour stems precisely from the fact that it implies her daughter shouldn't exist, which the daughter herself rejects. This points to the daughter *not* being wronged.
  4.  **Avoiding Epicycles:** Trying to salvage the intuition that the neighbour wronged her daughter would require introducing arbitrary distinctions (e.g., between pre-implantation and post-conception, or between selecting embryos and timing conception) that don't track a fundamental moral difference regarding harm to the resulting person.

  Therefore, the most coherent position is to accept that while we might regret the *avoidable imposition of disability* (a bad outcome), the neighbour did not *wrong her specific daughter* by creating her deaf. The wrongness in cases like 2 involves harming specific unavoidable future people relative to *their* alternative existences. The intuition in case 5 should be revised.
