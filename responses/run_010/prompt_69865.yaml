  ### Decision Tree: Trading Bot Causation  
  *Artifact context: A trading bot with low-level voltage/weight data and high-level "beliefs/desires" (e.g., "it believed the market would rise and executed a buy order").*

  1. **Low-Level Gaps?**  
     Is there any aspect of the bot’s trade execution that the low-level voltages/weights *don’t* fully cause? (e.g., could the trade occur even if voltage states changed, provided the high-level belief stayed the same?)  
     - Yes → **Leaf 1: Interactionist Dualist Analogue**  
     - No → 2  

  2. **High-Level Identity?**  
     Is the bot’s high-level "belief" (e.g., "the market will rise") identical to a specific low-level property (e.g., one exact voltage pattern)?  
     - Yes → **Leaf 2: Reduction/Identity**  
     - No → 3  

  3. **Systematic Double-Cause?**  
     When the bot executes a trade, is this caused independently and fully by *both* the high-level belief and low-level voltages, like two separate switches both rigged to trigger the trade?  
     - Yes → **Leaf 3: Systematic Overdetermination**  
     - No → 4  

  4. **High-Level Causes?**  
     Does the high-level belief itself cause the trade? (e.g., if the belief changed, would the trade change, even if voltages stayed the same?)  
     - No → 5  
     - Yes → 6  

  5. **High-Level Exists?**  
     Do properties like the bot’s "beliefs" exist at all, or are they just shorthand for voltage patterns?  
     - No → **Leaf 4: Eliminativism**  
     - Yes → **Leaf 5: Causing-Explaining Split**  

  6. **Causation Through Low Level?**  
     Does the high-level belief cause the trade *only by* being implemented in the low-level voltages?  
     - Yes → **Leaf 6: Nonreductive Realization-Based Causation**  
     - No → 7  

  7. **Level-Relative Causation?**  
     Is the high-level belief a cause only when we describe the system at the "belief level," while voltages are the cause only at the "voltage level"?  
     - Yes → **Leaf 7: Level-Relative Causation**  
     - No → **Leaf 8: Proportionality/Difference-Making**  

  **Unoccupied Combinations & Diagnostics**:  
  - **"High-Level Causes? = No" and "Causation Through Low Level? = Yes"**: Incoherent—if high-level doesn’t cause, it can’t cause through low-level. Not a valid path.  
  - **"Level-Relative Causation? = No" after "Causation Through Low Level? = No"**: Leads only to proportionality (Leaf 8). No missing position, but unattractive—denies all standard nonreductive options.  
  - **"Systematic Double-Cause? = No" and "High-Level Causes? = Yes" but rejects all nonreductive paths**: Unexplored; might indicate a novel position or confusion.  

  **Indistinguishable Pair**:  
  - **Nonreductive Realization (Leaf 6)** and **Proportionality (Leaf 8)** are partially conflated. Realization emphasizes dependence on low-level; proportionality emphasizes "right grain" of causation. The tree splits them via Node 6, but in practice, proportionality advocates often accept realization, making the boundary fuzzy.  

