  ### Premises generating the exclusion problem for the high level
  The causal exclusion argument typically runs as follows:

  1. **Completeness of the Low Level (Causal Closure)**: Every physical effect (e.g., the trading bot's output signal to buy a stock) has a sufficient physical cause (e.g., the low-level circuit states) at the time it occurs, and there is no causal work left over for anything non-physical (or, in this artifact case, for any non-low-level) to do.

  2. **Non-Identity of High-Level and Low-Level Properties**: The high-level property (e.g., the bot's belief that the market will rise) is not identical to the low-level property (e.g., a specific pattern of voltages in its circuits). This is often because the same high-level property can be realized by multiple low-level states (multiple realizability).

  3. **Exclusion Principle**: If an effect E (e.g., the bot buying a stock) has a sufficient cause C (e.g., the low-level state) at a time, then no distinct cause C* (e.g., the high-level belief) can cause E unless it is causally overdetermined. That is, if C is sufficient for E, then C* is either identical to C or it is not a cause of E (unless we have overdetermination).

  4. **Ban on Systematic Overdetermination**: It is unacceptable to have systematic overdetermination (i.e., every effect being caused twice, once by the low-level and once by the high-level). This is because overdetermination is typically thought to be rare and coincidental (like two shooters killing the same victim at the same time), but if it happens for every action of the bot, that would be systematic and thus implausible.

  5. **Causal Inheritance Principle (optional and controversial)**: If a high-level property is realized by a low-level property, then any causal powers of the high-level property are inherited from the causal powers of the low-level property. This can lead to the high-level property having no independent causal powers.

  The exclusion problem arises when we try to say that the high-level property (e.g., the belief) causes the effect (e.g., the buy order). Given completeness, the low-level state is a sufficient cause. Given non-identity, the high-level property is distinct. The exclusion principle then says that the high-level property cannot cause the effect unless it's overdetermination. But the ban on systematic overdetermination rules that out. Thus, the high-level property seems excluded from causing the effect.

