prompt: |-
  Two months until I have to hand in a PhD proposal on cognitive penetration of perception, and my supervisors main criticism of the draft is fair: chapter one is going to be a pile of definitions rather than an argument unless I can say exactly what would have to be true — and shown — before the thesis claim is worth making. So help me write the desiderata. What does a study, or a theory, have to deliver before it has earned the right to say that cognition penetrates perception?

  Fix the purpose like this, since adequacy is relative to it: I want penetration in the sense that would matter to the epistemology of perception, i.e. the sense in which, if it's real, a perceptual seeming stops being an independent check on what you already believe and starts inheriting your biases. That means I care a lot about the gap between a belief merely causing a change in what is experienced, and a belief figuring in the experience in a way that makes the experience itself evaluable, as good or bad reasoning. My worry is that half the literature slides between those two without noticing, and I want the requirement stated sharply enough that I can tell which side a given result falls on.

  For each desideratum, give me the consideration behind it plus a concrete case that satisfies it and one that fails it — from the kinds of results people actually point to: value-and-size judgements with coins, the hunger studies where food looks bigger (and the follow-ups that couldnt reproduce the effect), ambiguous figures where the label you've been given changes which one you see, memory colour effects where a genuinely grey banana looks faintly yellow, the shooter-bias style paradigms. Then sort the whole list into three piles: genuine requirements; methodological prejudices of one camp that have hardened into requirements (I'm thinking of the insistence that every effect be shown to survive demand characteristics, and the preference for stimulus-driven measures over reports); and things that just restate what penetration means and therefore can never be evidence for or against it.

  The part I most want: I think at least two of the requirements cant be jointly met. If a perceptual effect has to be measured, and every measurement on offer is a judgement about what someone saw, then demanding an effect that can't be attributed to judgement is demanding something no experiment could deliver — which would make the debate unfalsifiable by construction rather than merely hard. Tell me whether that's right, or whether there's a route out (adaptation aftereffects, eye movements, matching tasks, some response-time design I haven't thought of), and if there is a route out, say which requirement it costs you. If the collision is real, the list is my argument and I need to know precisely where it bites and which side it hurts more.

  Finish with a few paragraphs, no more: which single requirement does the most damage to the most-cited results in the area, and does a modularist or a liberal account come out better against the list as a whole. Skip the history and the name-checking, I've read the surveys already.
reasoning: |-
  Okay, let me tackle this PhD proposal problem. The user needs sharp desiderata to distinguish genuine cognitive penetration from mere causal effects for their epistemology-focused thesis. 

  First, I need to grasp the core tension: they want criteria that prevent sliding between "belief causes experience" and "belief makes experience evaluable as reasoning". The examples they mentioned (hunger studies, ambiguous figures etc.) will be crucial test cases. 

  Hmm... the key epistemological worry is about perception losing its independent check status. That means we need criteria that expose when experiences become belief-dependent in a rationally assessable way. But the measurement problem looms large - if all evidence relies on judgments, how can we ever escape circularity?

  Let me structure this carefully. For each desideratum, I'll need:
  - The underlying epistemological consideration
  - Concrete pass/fail cases from their listed studies
  - Clear distinction from methodological preferences

  The three-way sorting is tricky. Genuine requirements must directly address the epistemology gap. Methodological preferences (like demanding stimulus-driven measures) might be useful but aren't logically necessary. And circular restatements should be flagged.

  Ah! The collision point they mentioned is critical. If we require both (A) non-judgmental evidence and (B) rationally evaluable content, we might have an impossible demand. I wonder if adaptation aftereffects or eye-tracking could satisfy A without B? But does that help their epistemology concern? Probably not.

  For the finish, I'll compare how modularist vs liberal accounts fare against the toughest desideratum. The value/size studies seem most vulnerable to the Rational Evaluability requirement - that could be the silencer of famous results.

  Better avoid history lessons as requested. Focus solely on building their argument framework. The reproduction crisis in hunger studies might illustrate methodological issues without being philosophically decisive.
answer: |-
  Here’s a structured set of desiderata for "epistemologically significant" cognitive penetration (CP), sorted into your requested categories, with analysis of the measurement collision and implications:

  ---

  ### **Genuine Requirements** (Necessary for CP to threaten perceptual justification)
  1. **Content Constraint**  
     *Consideration*: CP requires cognition altering *what* is perceived (content), not just post-perceptual judgment. Otherwise, perception remains neutral; bias enters only in interpretation.  
     *Passes*: Memory colour effect (grey banana looks yellow) — the *appearance* changes, not just labeling.  
     *Fails*: Shooter-bias (faster "shoot" for armed Black men) — may reflect response bias, not distorted *appearance* of threat.  

  2. **Encapsulation Violation**  
     *Consideration*: Perception must be influenced by *cognition* (beliefs/values), not just sensory or attentional factors. Otherwise, modularity holds.  
     *Passes*: Value-size effects (desired objects *look* larger) if driven by reward history, not low-level salience.  
     *Fails*: Attentional priming (e.g., "look for dog" makes dog pop out) — arguably pre-perceptual.  

  3. **Rational Evaluability**  
     *Consideration*: The cognitive state must *rationally support* the perceptual distortion for epistemology. Otherwise, it’s brute causation, not "bad inference."  
     *Passes*: Hunger making food *look* bigger only if the subject believes "food is valuable when hungry."  
     *Fails*: Drug-induced hallucinations (no rational link between belief and distortion).  

  ---

  ### **Methodological Prejudices** (Useful but not definitional)
  4. **Demand-Characteristic Immunity**  
     *Consideration*: Effects must survive controls for task compliance (e.g., within-subject replication, deception).  
     *Example*: Hunger/size studies failing replication (e.g., Firestone & Scholl 2016) may reflect demand.  
     *But*: Epistemology cares if bias *exists*, even if elicited by context.  

  5. **Stimulus-Driven Measures**  
     *Consideration*: Preference for indirect measures (eye-tracking, grasping, binocular rivalry) over reports.  
     *Example*: Dissociations in ambiguous figures (e.g., reporting "duck" while eyes track "rabbit" features).  
     *But*: Reports are valid data; dismissing them privileges third-person methods.  

  ---

  ### **Circular Restatements** (Tautological; not evidence)
  6. **Causal Efficacy of Cognition**  
     *"CP occurs when cognition causes perceptual changes."*  
     → Fails to distinguish *how* it causes (e.g., attentional shift vs. penetrative inference).  

  7. **Phenomenal Immediacy**  
     *"CP makes the experience *feel* influenced."*  
     → Subjective reports can’t verify their own etiology (e.g., hunger/size may "feel" visual but be judgment).  

  ---

  ### **The Measurement Collision: Can It Be Resolved?**
  **Problem**: If Rational Evaluability requires cognitive states to *justify* the distortion (e.g., belief in hunger-value causing food to look bigger), but all measures are judgments, how prove it’s not *just* judgment?  
  - **Route Out?**  
    - **Adaptation Aftereffects** (e.g., exposure to biased stimuli causes perceptual aftereffects).  
      *Example*: If seeing "yellow" bananas causes later neutral objects to look blue, it’s low-level and judgment-independent.  
      *Cost*: Loses **Rational Evaluability** (aftereffects are automatic, not rationally evaluable).  
    - **Eye Movements/Grasping** (e.g., reaching for a coin judged larger due to value).  
      *Example*: Hand aperture scaling with perceived size, not reported size.  
      *Cost*: May not reflect *phenomenal* content (grasping may use dorsal stream, distinct from conscious vision).  
    - **Binocular Rivalry** (e.g., beliefs biasing which image dominates).  
      *Example*: Labeling an ambiguous figure as "duck" makes it dominate rivalry.  
      *Cost*: Still relies on subjective report of dominance.  

  **Verdict**: The collision is real. **Rational Evaluability** (requiring a reason-responsive link) and **Non-Judgmental Evidence** (requiring non-report measures) conflict. Non-report measures (e.g., aftereffects) are mechanistically "perceptual" but lack rational structure. Report-based measures capture phenomenology but conflate perception and judgment. **This hurts liberals more**: They claim CP threatens justification via rational bias, but can’t demonstrate it without circularity.

  ---

  ### **Which Requirement Does the Most Damage?**
  **Rational Evaluability** devastates the most-cited results:  
  - **Hunger/size effects**: Even if replicable, is there a *rational* link between hunger and size? Unlikely.  
  - **Value/size coins**: Does "value" rationally entail "larger"? Only via arbitrary association.  
  - **Shooter bias**: Faster reactions to Black faces may reflect learned stereotypes, not rational inference.  

  **Modularism vs. Liberalism**:  
  - **Modularism** (e.g., Pylyshyn, Raftopoulos) satisfies Encapsulation and Non-Judgmental measures (emphasizing automaticity).  
  - **Liberalism** (e.g., Church, Stokes) struggles with Rational Evaluability, as most effects are either brute (failing justification) or judgment-laden (failing Content Constraint).  

  **Overall**: Modularism survives the list better. Liberals must either weaken "epistemological threat" (abandoning Rational Evaluability) or prove the unprovable (cognitive reasons distorting phenomenology non-circularly). Your desiderata force a key concession: CP may exist, but rarely in the form that genuinely undermines perception as a knowledge source.  

  ---  
  **Key References for Examples**:  
  - Memory colour: Hansen et al. (2006)  
  - Value-size: Bruner & Goodman (1947), though see Durgin et al. (2012) critiques  
  - Hunger/size: Balcetis & Dunning (2010), failed replications by Shanks et al. (2013)  
  - Binocular rivalry: Balcetis & Dale (2007)  
  - Adaptation: Clifford et al. (2007) on aftereffects as perceptual signatures
