  We are defining the desiderata for a theory of mechanism identity in neural networks, especially for monitoring "drift" in deployed models. The goal is to specify what counts as the same mechanism over time or across model variations.

  The cases provided and others we must cover:
  1. Quantization: Model is quantized (e.g., from float32 to int8) for efficiency. Behavior remains the same, but the monitor (which looks at internal structure) flags many changes. We want the theory to account for this as the same mechanism, despite structural changes.

  2. Fine-tuning: Fine-tuning on customer data changes the weights minimally and the monitor does not flag much, but behavior might change in subtle ways. The monitor didn't flag it, but we might expect that the mechanism is still the same? Or is it? However, note: the example says the fine-tune moved almost nothing the monitor was watching, but then an ablation that used to break a capability stopped having an effect. This suggests that the fine-tuning might have changed the mechanism in a way that made it robust to that ablation.

  3. Ablation robustness: A targeted ablation that previously broke a capability no longer does so. This could be because the mechanism has changed (e.g., distributed or redundant) so that the ablation doesn't hit the critical part anymore.

  4. Scaling: The same "circuit" (as claimed by the developers) in an 8B and 70B model shares a functional description but very little structural similarity.

  Additional cases we might consider:

  5. Pruning: We prune the network (removing some weights or neurons) but the behavior remains the same. Is the mechanism the same?

  6. Retraining with different initialization: Same architecture, same data, but different random seed. The weights are different, but the function is approximately the same. Is the mechanism the same?

  7. Adversarial robustness: After adversarial training, the model is robust to perturbations. The internal structure might have changed. Is the mechanism the same?

  8. Catastrophic forgetting: During fine-tuning, the model loses a previous capability. The mechanism for that capability is gone? Or just impaired?

  9. Distributed vs. localized mechanisms: Some features are represented in a distributed manner, so that no single neuron is critical. How do we identify the same distributed mechanism?

  10. Polysemantic neurons: A single neuron might be involved in multiple mechanisms. How do we disentangle?

  11. Model editing: We edit the model to change a specific behavior (e.g., using ROME or MEMIT). The mechanism for that behavior is replaced? Or modified?

  We must also consider the constraints from how networks organize:
  - Features are smeared across many directions (distributed representations).
  - One component (e.g., a neuron or layer) may do several jobs at once (polysemanticity).
  - The same capability can be implemented differently at different scales or in different models (e.g., the 8B vs 70B case).

  Unglamorous constraint: The monitor must be able to compute the identity criterion without full reverse-engineering (i.e., without knowing every detail of the mechanism).

  We are to list the desiderata (requirements) for the theory, with:
  - The case it must get right and our verdict.
  - Distinctions it must not collapse (e.g., same function vs same implementation).
  - Consistency with known network organization.
  - The unglamorous constraint.

  For each requirement, we explain why it is necessary (not just aesthetic) and mark if it's non-negotiable or a camp preference.

  Then, we check for unsatisfiable sets and which requirement causes the most trouble for current approaches.

  Let's outline the desiderata:

  1. **Behavioral Equivalence under Structural Change**: The theory must recognize that two mechanisms are the same if they produce the same behavior (or same input-output mapping) even if the structure (weights, activations) changes, as long as the change is due to an equivalence transformation (like quantization, pruning, or retraining with different seed). 
     - Why: Because we want the monitor to not flag harmless changes (like quantization) that don't affect behavior. Non-negotiable for practical deployment (false alarms are costly).
     - Case: Quantization and pruning without behavioral change.

  2. **Sensitivity to Functional Change**: The theory must flag a mechanism as changed if the function it implements is altered, even if the structure is similar. 
     - Why: Because we care about the model's capabilities. If the model stops doing what it used to (e.g., after fine-tuning that breaks a capability), we want to know. Non-negotiable.
     - Case: Catastrophic forgetting or adversarial robustness changes.

  3. **Scale and Architecture Independence**: The theory must recognize the same mechanism across models of different scales (e.g., 8B vs 70B) if they implement the same function, even if the structure is very different.
     - Why: Because we want to compare models across versions that might have different sizes. Non-negotiable for comparing model families.
     - Case: The 8B and 70B having the same functional circuit.

  4. **Robustness to Redundancy**: The theory must account for mechanisms that become distributed or redundant. If a mechanism that was localized becomes distributed (so that an ablation no longer breaks it), we must still recognize the mechanism as present (though possibly changed in form). 
     - Why: Because networks can have backup pathways. We don't want to say the mechanism is gone if it's just more robust. Non-negotiable for capturing real-world model updates (like robustness improvements).
     - Case: After fine-tuning, an ablation that used to break a capability no longer does.

  5. **Resolving Polysemanticity**: The theory must be able to isolate a mechanism even when components are polysemantic (i.e., involved in multiple mechanisms). 
     - Why: Because in practice, neurons are not perfectly disentangled. Non-negotiable for accurate attribution.

  6. **Computational Tractability without Full Reverse-Engineering**: The monitor must be able to compute the identity criterion without having a complete understanding of every mechanism in the model. 
     - Why: Because full reverse-engineering is currently infeasible for large models. Non-negotiable for practicality.

  7. **Causal Role over Implementation Details**: The theory should prioritize the causal role (i.e., the function in the computational graph) over the exact weights or structural details. 
     - Why: Because the same causal role can be implemented by different structures (as in the quantization and scale cases). This is a camp preference? (Implementation-first vs causal-role-first) but leaning towards non-negotiable given the cases.

  8. **Non-Collapse of Function and Implementation**: The theory must not collapse the distinction between function and implementation. It should allow that the same function can have multiple implementations and vice versa (but in the context of identity, we care about function). 
     - Why: Because we need to track what the model does (function) without being tied to how it does it (implementation). Non-negotiable.

  9. **Handling Model Editing**: After a model edit (e.g., changing a fact), the mechanism for that fact should be considered updated, but other mechanisms should remain the same. 
     - Why: To isolate the effect of edits. Non-negotiable for monitoring.

  10. **Distributed Representations**: The theory must account for mechanisms that are distributed across many neurons and not localized.
      - Why: Because this is how neural nets work. Non-negotiable.

  Now, let's check for unsatisfiability:

  The main tension is between:
  - **Behavioral Equivalence under Structural Change** (which says: if behavior is the same, then the mechanism is the same) and 
  - **Sensitivity to Functional Change** (which says: if behavior changes, then the mechanism is not the same).

  But note: Behavioral equivalence is about the overall model behavior, while functional change might be about a specific mechanism. We might have a situation where the overall behavior is the same, but a mechanism has changed (due to redundancy). So the theory must be able to track mechanisms at a sub-model level.

  Another tension: 
  - **Computational Tractability** vs **Resolving Polysemanticity** and **Distributed Representations**: It's hard to isolate mechanisms without full reverse-engineering, especially when they are distributed and entangled.

  But the biggest challenge might be:

  **The requirement of Behavioral Equivalence under Structural Change** (which is non-negotiable) and **Sensitivity to Functional Change** (non-negotiable) together require that we define mechanism identity at the right level of abstraction. We must avoid false positives (flagging changes that don't matter) and false negatives (missing changes that do). 

  However, the requirement that does the most damage to current approaches is:

  **Computational Tractability without Full Reverse-Engineering**. Current mechanistic interpretability often requires detailed analysis of the model (circuit level). But for a monitor that runs automatically on any model, we cannot assume that level of reverse-engineering. This forces the theory to rely on more coarse-grained or approximate methods, which might not be as precise.

  Now, let's write up the desiderata with the required structure.

  We'll list each requirement, the case it must handle, the verdict, and why it's required.

  ---

  **Desiderata for a Theory of Mechanism Identity**

  1. **Requirement: Invariance to Equivalent Transformations (Behavioral Equivalence under Structural Change)**  
     - **Case**: Quantization reduces precision but behavior remains the same.  
     - **Verdict**: The mechanism should be considered the same.  
     - **Why necessary**: To avoid false alarms from changes that do not affect model behavior. Non-negotiable for practical monitoring.  
     - **Distinction preserved**: Same function vs. changed implementation.

  2. **Requirement: Sensitivity to Functional Drift**  
     - **Case**: Fine-tuning that alters a capability (e.g., an ablation that used to break a capability no longer does, but the capability is still present because of redundancy). However, note: the example says the fine-tune moved almost nothing the monitor was watching. We want to catch when the mechanism changes in a way that affects function, even if the structure is similar.  
     - **Verdict**: The mechanism should be considered changed if its function has changed (e.g., if the capability is lost or altered).  
     - **Why necessary**: To detect when the model's behavior has changed in a meaningful way. Non-negotiable.  
     - **Distinction preserved**: Same structure vs. changed function.

  3. **Requirement: Scale and Architecture Independence**  
     - **Case**: The same functional circuit in an 8B and 70B model.  
     - **Verdict**: The mechanism should be considered the same if it implements the same function, despite structural differences.  
     - **Why necessary**: For comparing models across scale and architecture changes. Non-negotiable.  
     - **Distinction preserved**: Same function vs. different structure.

  4. **Requirement: Robustness to Redundancy and Distributed Representations**  
     - **Case**: After fine-tuning, a previously critical ablation no longer breaks the capability because the mechanism has become distributed.  
     - **Verdict**: The mechanism should still be considered present (if the function is intact) but possibly in a changed form (distributed vs. localized).  
     - **Why necessary**: To account for the network's ability to create backup mechanisms. Non-negotiable.  
     - **Distinction preserved**: Mechanism that's gone vs. absorbed into a redundant backup.

  5. **Requirement: Handling Polysemantic Components**  
     - **Case**: A neuron that fires for multiple features.  
     - **Verdict**: The theory must isolate a mechanism even when it overlaps with others.  
     - **Why necessary**: Because real networks have entangled representations. Non-negotiable.  
     - **Distinction preserved**: One component doing several jobs at once.

  6. **Requirement: Computational Tractability without Full Reverse-Engineering**  
     - **Case**: Monitoring a model without a complete circuit diagram.  
     - **Verdict**: The identity criterion must be computable with efficient methods.  
     - **Why necessary**: Because full reverse-engineering is infeasible for large models. Non-negotiable.  
     - **Distinction preserved**: None per se, but a practical constraint.

  7. **Requirement: Causal Role Priority**  
     - **Case**: Two models with different weights but same causal behavior for a mechanism.  
     - **Verdict**: The mechanism should be considered the same if it plays the same causal role.  
     - **Why necessary**: To focus on what the mechanism does, not how it is implemented. This is a camp preference (causal-role-first) but strongly supported by cases 1, 3, and 4.  
     - **Distinction preserved**: Same causal role vs. same weights.

  8. **Requirement: Model Editing Awareness**  
     - **Case**: After a model edit (e.g., changing a fact), the mechanism for that fact is updated.  
     - **Verdict**: The edited mechanism is considered changed, but others remain the same.  
     - **Why necessary**: To track intentional changes. Non-negotiable.  
     - **Distinction preserved**: Mechanism that changed vs. description that got sharper (editing is a change, not just a sharper description).

  **Consistency with Network Organization**:
  - The theory must account for features smeared across directions (distributed representations), components doing multiple jobs (polysemanticity), and same capability implemented differently at different scales.

  **Unsatisfiable Set?**  
  The requirements are jointly satisfiable in principle, but the challenge lies in the **Computational Tractability** constraint. We need a way to identify mechanisms without full reverse-engineering that is also:
  - Invariant to equivalent transformations (like quantization) but sensitive to functional changes.
  - Able to handle distributed representations and polysemanticity.

  Current approaches (like looking for similar weight matrices or activation patterns) fail because they are too structural and break under quantization or scaling. Functional approaches (like probing for the same function) might miss internal changes that haven't yet affected behavior but might in the future (e.g., a mechanism that is now more fragile).

  The most damaging requirement is **Computational Tractability without Full Reverse-Engineering** because it forces approximations that might not capture the nuances of mechanism identity. For example, if we use a probe (like a linear classifier on activations) to measure a feature, that might not capture the causal role. And without knowing the full circuit, we might misattribute.

  **Conclusion for the Column**:  
  The core tension is between the need for a precise, causal account of mechanisms and the practical constraint of computability. This tension is unresolved and might require a new kind of monitoring that uses both functional tests (to check behavior) and efficient internal probes (to detect structural changes that might predict future behavioral drift). But note: the example of quantization changing structure without changing behavior shows that structural changes alone are not sufficient. Thus, the theory must tie structural changes to functional equivalence.

  The single requirement that does the most damage to current approaches is **Computational Tractability without Full Reverse-Engineering** because it forces us to abandon the dream of perfectly tracking every circuit and instead use heuristics that might be error-prone.

  We might need to accept that mechanism identity is not binary but a matter of degree (similarity) and that monitoring will have false positives and negatives. The desiderata then become a guide for minimizing these errors.
answer: |-
  ### Desiderata for a Theory of Mechanism Identity in AI Monitoring  
  Below are the core requirements a theory of "mechanism identity" must satisfy to be viable for real-world model monitoring. Each requirement is grounded in practical, empirical, or conceptual necessity, with cases it must resolve, distinctions it must preserve, and constraints it must obey. I distinguish *non-negotiable* requirements (essential for functionality) from *camp preferences* (reflecting philosophical splits). Finally, I identify conflicts and the most damaging requirement for current approaches.  

  ---

  #### **1. Invariance to Isomorphic Transformations**  
  - **Case**: Quantizing a model (e.g., FP32 → INT8) changes weight values but preserves behavior.  
  - **Verdict**: The mechanism is identical.  
  - **Why non-negotiable**: Monitoring must ignore mathematically equivalent reparameterizations (e.g., scaling, rotation, quantization) that don’t alter functionality. Flagging these as "drift" causes false alarms, wasting resources and eroding trust.  
  - **Distinction preserved**: *Implementation* (weights, activations) vs. *function* (input-output mapping).  
  - **Constraint**: Must align with weight-space symmetries proven in neural networks (e.g., scale invariance in ReLU networks).  

  #### **2. Sensitivity to Causal Role Shifts**  
  - **Case**: A targeted ablation that previously broke a capability (e.g., "correct pronoun resolution") no longer affects behavior after fine-tuning.  
  - **Verdict**: The mechanism has changed (e.g., distributed redundancy absorbed the function).  
  - **Why non-negotiable**: Monitors must detect when internal changes *alter robustness or failure modes*, even if output metrics stay stable. Missing this risks deploying brittle models.  
  - **Distinction preserved**: *Mechanism gone* vs. *absorbed into backup* (requires causal testing, e.g., interventions).  
  - **Constraint**: Consistent with empirical findings: networks build redundancies (e.g., "lottery tickets") during fine-tuning.  

  #### **3. Scale Independence**  
  - **Case**: The "same" circuit in an 8B and 70B model shares a functional role but little structural similarity.  
  - **Verdict**: The mechanism is identical if it fulfills the same causal role.  
  - **Why non-negotiable**: Monitors must track capabilities across model sizes/architectures to support incremental upgrades or comparisons. Requiring structural parity ignores how scalability demands reimplementation.  
  - **Distinction preserved**: *Structure* (weights, topology) vs. *causal role* (function in the computational graph).  
  - **Constraint**: Must accommodate findings: larger models distribute functions differently (e.g., "superposition" in sparse autoencoders).  

  #### **4. Resolution of Polysemantic Entanglement**  
  - **Case**: A neuron fires for "copyright law," "music," and "HTTP errors" (polysemanticity). After fine-tuning, it only fires for "music."  
  - **Verdict**: The "copyright law" mechanism is gone or relocated.  
  - **Why non-negotiable**: Monitors must isolate specific capabilities; conflating entangled mechanisms hides drift.  
  - **Distinction preserved**: *Mechanism change* (a function is removed) vs. *sharper description* (better understanding of existing function).  
  - **Constraint**: Must address empirical reality: polysemantic neurons are ubiquitous in transformers.  

  #### **5. Tolerance to Distributed Representations**  
  - **Case**: A feature (e.g., "sarcasm detection") is smeared across 300+ neurons. After pruning, the same feature uses 250 neurons.  
  - **Verdict**: The mechanism persists if the feature’s causal impact is preserved.  
  - **Why non-negotiable**: Monitors cannot demand localized mechanisms; networks *naturally* distribute functions. Requiring point-to-point correspondence is biologically and computationally unrealistic.  
  - **Constraint**: Must align with "universality" findings: features exist in directions, not neurons.  

  #### **6. Agnosticism to Implementation Details**  
  - **Case**: A fine-tune updates <0.1% of weights; behavior changes minimally, but the monitor detects no shift.  
  - **Verdict**: The mechanism is identical *unless* causal tests reveal altered functionality.  
  - **Why non-negotiable**: Monitoring must prioritize causal effects over structural tweaks. Over-indexing on weight changes ignores functional stability.  
  - **Distinction preserved**: *Same function* vs. *same implementation*.  
  - **Constraint**: Must reflect that networks optimize multiple solutions for the same function.  

  #### **7. Computability Without Full Reverse-Engineering**  
  - **Case**: Monitoring a 1T-parameter model where <1% of circuits are understood.  
  - **Verdict**: The theory must work with partial mechanistic knowledge.  
  - **Why non-negotiable**: Full reverse-engineering is infeasible for frontier models. Monitoring tools must be scalable and automated.  
  - **Constraint**: Methods must rely on efficient probes (e.g., activation editing, path patching) not exhaustive analysis.  

  #### **8. Causal Fidelity Over Correlative Proxies**  
  - **Case**: A monitor uses "neuron activation similarity" as a proxy. After fine-tuning, activations shift but behavior doesn’t.  
  - **Verdict**: Correlative similarity fails; causal tests (e.g., counterfactual edits) should override proxies.  
  - **Why non-negotiable**: Correlation ≠ causation. Proxies like activation distance are easily fooled (e.g., by regularization).  
  - **Constraint**: Must prioritize intervention-based metrics (e.g., interchange accuracy).  

  ---

  ### **Camp Preferences vs. Non-Negotiables**  
  | **Requirement**               | **Status**          | **Camp Split**                                  |  
  |-------------------------------|---------------------|-----------------------------------------------|  
  | Invariance to Isomorphisms    | Non-negotiable      | *Implementation-first*: Rejects this (wants structural identity). |  
  | Sensitivity to Causal Shifts  | Non-negotiable      | *Causal-role-first*: Prioritizes this over structure. |  
  | Scale Independence            | Non-negotiable      | Neither camp disputes this.                   |  
  | Polysemantic Resolution       | Non-negotiable      | *Implementation-first*: Struggles with entanglement. |  
  | Distributed Representations   | Non-negotiable      | Both camps accept but differ on how to measure. |  
  | Agnosticism to Implementation | **Camp preference** | *Causal-role-first*: Favors this; *implementation-first*: Opposes. |  
  | Computability                 | Non-negotiable      | Neither disputes, but methods differ.         |  
  | Causal Fidelity               | **Camp preference** | *Causal-role-first*: Requires it; *implementation-first*: Uses proxies. |  

  ---

  ### **The Unsatisfiable Trio**  
  Three requirements are **jointly unsatisfiable** under current monitoring paradigms:  
  1. **Invariance to Isomorphisms** (ignore structural changes that preserve function).  
  2. **Sensitivity to Causal Shifts** (detect when mechanisms become robust/distributed).  
  3. **Computability Without Reverse-Engineering** (no exhaustive circuit analysis).  

  **Why unsatisfiable?**  
  - Invariance requires ignoring structural noise (e.g., quantization), but sensitivity demands detecting *meaningful* structural shifts (e.g., redundancy).  
  - Distinguishing these *without full reverse-engineering* forces reliance on proxies (e.g., activation similarity). But proxies fail causal tests (e.g., a model may have identical activations for a test set but fail under adversarial perturbations).  
  - **Result**: You can’t have all three. Current monitors sacrifice #2 (causal sensitivity) for #1 and #3, leading to missed failures (e.g., ablation robustness shifts).  

  ---

  ### **Most Damaging Requirement**  
  **Sensitivity to Causal Shifts** does the most damage to current approaches.  

  **Why?**  
  - Monitors today rely on *structural* or *correlative* metrics (e.g., weight distances, activation clustering). These fail when:  
    - A mechanism’s causal role persists despite structural changes (e.g., fine-tuning → distributed backup).  
    - A mechanism’s causal role *changes* despite structural similarity (e.g., adversarial training alters failure modes without major weight shifts).  
  - This requirement forces a shift from efficient proxies (e.g., "neuron fire rate similarity") to expensive causal interventions (e.g., path patching). For billion-scale models, this is computationally prohibitive.  
  - **Consequence**: Most monitors today are *brittle*. They either cry wolf over isomorphisms (quantization) or miss silent failures (ablations that no longer break the model).  

  ---

  ### **Summary for Your Column**  
  The core tension is between *practicality* (computability without reverse-engineering) and *reliability* (causal sensitivity). Current tools optimize for the former and fail at the latter, creating monitors that are either overly noisy or dangerously silent. A viable theory must define mechanism identity **causally** (e.g., "a mechanism is identical if it fulfills the same function under interventions") but accept that **approximations are unavoidable** for scalability. Until we crack efficient causal discovery, monitoring will remain a high-stakes gamble. The column’s hook: *We’re building burglar alarms that can’t tell a broken window from a repainted one.*
