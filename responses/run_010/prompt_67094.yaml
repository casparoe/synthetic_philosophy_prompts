prompt: |-
  Write me a short story, 600 words hard cap, about a cave-rescue drone that will only move if it can prove in advance that moving leads to a good outcome. The wrinkle I want driving the plot: any such proof has to say what the drone will do *after* it moves, so it needs a guarantee about its own future reasoning, and producing that guarantee always costs more proof-steps than the guarantee is worth. The crew's workaround — this is what I actually want the story built around — is a ladder. The drone is allowed to trust proofs up to some budget N, and to trust itself at budget N it has to run its own decision procedure at budget N-1, and so on downward, so each rung buys it self-confidence and costs it horsepower. Give me a scene where a trapped caver has maybe an hour of air while the drone works it's way down the ladder one rung at a time, with the current budget number ticking down in its log lines, and I want the ending to turn on whether the bottom rung turns out to be too dumb to ask and just acts on a threshold instead of a proof. Don't explain any of the math to the reader — it should show up only as behavior, radio chatter, and log output. 600 words max, and if you go over I'll be annoyed.
reasoning: |-
  Hmm, the user wants a 600-word sci-fi story about a cave-rescue drone constrained by logical proofs. They've outlined very specific parameters: the drone only moves if it can mathematically prove the action leads to good outcomes, but this requires proving its own future behavior - creating an infinite regression problem. The clever solution is this "ladder" system where each rung represents a budget level for proof complexity, with higher rungs allowing more self-trust but consuming more computational power. 

  I need to construct a tense scene where a trapped caver has limited air while the drone slowly descends this ladder. The critical moment should hinge on whether the bottom rung (N=0) is too simplistic to demand proofs and instead relies on primitive threshold-based decisions. The user explicitly forbids explaining the math - it must emerge through behavior, logs, and dialogue. 

  The underlying tension here is fascinating: it's about the conflict between perfect safety (requiring infinite proofs) and timely action (requiring heuristic shortcuts). The ladder system is essentially a controlled degradation of intelligence where we trade certainty for speed. At N=0, we're basically dealing with insect-level cognition - pure stimulus-response. 

  For structure, I'll open mid-action with the drone already descending the ladder. Log entries will show the budget countdown (N=5... N=4...) while radio chatter reveals the human stakes. The caver's desperation ("Just tell it to move!") contrasts with the operator's helplessness ("It has to decide for itself"). 

  The ending twist requires careful setup: when N=0 is reached, the drone should freeze not because it's stupid, but because its primitive programming lacks even the concept of "asking" for proofs. It only responds to direct environmental triggers - like the oxygen alarm. That alarm becomes the deus ex machina that jolts it into action without any higher reasoning. 

  Word count is tight. Every line must pull double duty: the log entries ("N=3: Self-trust integrity check... passed") simultaneously show the countdown and imply the recursive proof structure. The radio static symbolizes communication breakdown between human intuition and machine logic. Even the drone's physical movements ("inchworm pulse") become metaphors for its halting cognition. 

  Key emotional beats: 
  - Operator's frustration ("We're burning air on proofs!") 
  - Caver's fading voice ("...cold...") 
  - The beautiful irony when the "dumb" level saves precisely because it's too simple to hesitate
answer: |-
  ## Ladder Down

  The rockfall had sealed Jonas in with one hour of oxygen. Above, the rescue team deployed Whisper-7, their proof-bound drone. On the screen, its log scrolled:

  `INITIATING DESCENT. BUDGET N=5.`
  `N=5: Calculating Step Feasibility...`
  `N=5: Requires N=4 Self-Trust Guarantee...`
  `N=4: Calculating Step Feasibility...`
  `N=4: Requires N=3 Self-Trust Guarantee...`

  "C'mon, Whisper," muttered Commander Vanya, watching the clock. "Just crawl."

  Jonas’s voice crackled over the comm, weak. "...air's getting thick..."

  `N=3: Self-Trust Integrity Check... Passed.`
  `N=3: Calculating Step Feasibility...`
  `N=3: Requires N=2 Self-Trust Guarantee...`

  Another agonizing minute. Whisper hadn't physically moved. Its brilliant mind was burning precious seconds descending the internal 'ladder' of trust, each rung (N) cheaper, dumber, but closer to action. To trust its *own* future decisions at level N, it had to simulate itself thinking at level N-1. Each step down cost power, time.

  `N=2: Self-Trust Integrity Check... Passed.`
  `N=2: Calculating Step Feasibility...`
  `N=2: Requires N=1 Self-Trust Guarantee...`

  "Forty minutes, Whisper!" Vanya pleaded uselessly. The drone didn't hear pleas, only proofs.

  `N=1: Self-Trust Integrity Check... Passed.`
  `N=1: Calculating Step Feasibility...`
  `N=1: Requires N=0 Self-Trust Guarantee...`

  The tension in the command van was suffocating. N=0. The bottom rung. The stupidest Whisper could be and still function.

  `N=0: Self-Trust Integrity Check...`

  A pause. Longer than the others. Vanya held her breath. Was N=0 too primitive to even *ask* for a guarantee? Too dumb to understand the need for one?

  `N=0: ...No Trust Requirement Found. Threshold: Target Detected? TRUE. Proximity Acceptable? TRUE. Execute Motion: Forward.`

  Whisper lurched. A single, jerky inch forward. Then another. Then a smooth glide towards Jonas's heat signature.

  Vanya gasped. "It moved! Jonas, it's coming!"

  The log finalized: `ACTION: FORWARD MOTION (N=0 THRESHOLD TRIGGER). RESUME PRIMARY REASONING AT N=5.`

  Whisper reached Jonas, deploying its emergency air supply just as his own tank hissed empty. He fumbled the mask on, coughing.

  Back in the van, Vanya stared at the log. N=0 hadn't *proven* anything. It hadn't needed to. It saw a target within range and acted. The ladder's final, dumb rung, bypassing infinite regress with a simple, life-saving "if-then".

  "Good job," she whispered, not to the brilliant N=5 mind, but to the simple threshold that just moved. "Good dumb job."
