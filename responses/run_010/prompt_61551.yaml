prompt: |-
  Second-year lit PhD student here, working through Du Bois's "Criteria of Negro Art" (the 1926 Crisis piece) and I've hit a wall on my case study. I invented a distinction for the paper and want to see if it survives contact with a novel.

  First, propaganda by aim vs propaganda by effect: Du Bois seems to define the category by what a work is *for* — all art advances some cause whether the artist admits it or not — but a lot of his talk about what makes art good smuggles in claims about what it does to readers. Second, split the aim in two: the indictment (here's what the system does to people) and the portrait (here are people with full inner lives, appetites, jokes, and bad choices). My hypothesis is that Wright's 1937 review of Their Eyes Were Watching God — no theme, no message, quaint Negro life served up for white readers — isn't Du Bois's criterion being defended against Hurston. It's a much stricter rule: a portrait only counts as propaganda when it's backed by an indictment. If that's right the usual framing of the Hurston/Wright fight is backwards.

  So: read the novel against all this and tell me whether it meets Du Bois's criterion. I want the porch sitters at Eatonville treated as an internal audience doing real critical work, and I want to know what Matt Bonner's mule, the hurricane, and Janie telling Pheoby at the end are doing on either reading. Also tell me where my apparatus strains — Janie chasing the pear tree isn't obviously for anybody, and maybe the novel refuses both indictment and portrait in favor of a third thing. No quotes from the novel, I know it; paraphrase scenes. Skip the bibliography, I've got the lit.

  Please use these sections, in this order:
  - The criterion (~200 words): the version of Du Bois you're testing, with aim/effect stated cleanly
  - Portrait without indictment (~400 words): the case that the novel satisfies it
  - Where it resists (~350 words): what Wright's charge actually gets right, and where I'm forcing the book
  - Two audiences (~250 words): the in-group/out-group problem — whether a text can be assigned an audience at all, or only a context
  - Bottom line (~150 words): your verdict, and what the novel shows that the essays arguing about it don't
reasoning: |-
  Okay, the user is a second-year lit PhD student working on Du Bois's "Criteria of Negro Art." They've created a distinction between propaganda by aim versus effect and split aim into indictment and portrait. Their hypothesis is that Wright's critique of Hurston isn't just about Du Bois's criteria but a stricter rule that a portrait needs indictment to count as propaganda. They want to test this against "Their Eyes Were Watching God," focusing on specific elements like the porch sitters, Matt Bonner's mule, the hurricane, and Janie's final conversation with Pheoby.

  First, I need to summarize Du Bois's criterion clearly. Du Bois argues all art is propaganda by aim—it serves a purpose, specifically advancing racial equality. Effect refers to how successfully it mobilizes readers towards that aim. The key is that indictment (showing systemic oppression) must accompany portrait (depicting Black interiority) to be effective propaganda.

  Next, assess if the novel presents a portrait without indictment. The porch sitters in Eatonville function as an internal audience, engaging in critique and performance, which showcases Black communal life. Matt Bonner's mule could be seen as a moment of indictment when the town mocks his suffering, but Hurston frames it as satire within the community, not systemic critique. The hurricane scene emphasizes divine indifference and human vulnerability, which might indirectly critique systemic neglect, but it's not explicit. Janie's trial later shows structural injustice, but Hurston focuses on Janie's resilience rather than the system. Her final storytelling to Pheoby highlights personal growth, prioritizing individual experience over collective indictment.

  Then, explore where the novel resists the indictment. Wright's charge has merit because Hurston avoids naming white supremacy directly. The porch sitters' humor could be seen as performing for white readers, potentially exoticizing. The mule story becomes folk humor, softening any critique. The hurricane's cosmic scale overshadows specific societal blame. Janie's trial points to systemic issues but centers on her survival. The pear tree symbolizes personal desire, separate from social critique. Hurston's focus on Janie's inner life might sidestep broader indictments, making the portrait rich but not explicitly political as Du Bois or Wright would want.

  Addressing the two audiences problem: The porch sitters act as an internal audience, offering communal critique. However, the novel's reception complicates audience assignment. Wright, as a Black contemporary, read it as catering to white expectations. This shows audience isn't inherent but depends on context. The text itself has layers: Eatonville scenes are for in-group resonance, while the frame narrative (Janie telling Pheoby) suggests an intimate Black female audience. Yet, the publication context forces consideration of external readers. Hurston's style—folk speech, humor—can be read as authentic representation or performance for outsiders. The dual address makes assigning a fixed audience problematic; it's shaped by context.

  Bottom line: The novel meets Du Bois's criterion partially. It excels in portrait but lacks consistent indictment. Wright's critique highlights this gap. The novel shows that portrait without explicit indictment can still affirm Black humanity, challenging Du Bois's necessity of combined elements. It reveals a tension between political utility and artistic autonomy, suggesting Hurston offers a third thing: art as self-expression beyond propaganda aims.

  I should ensure each section stays within the word limits. For "Portrait without indictment," emphasize the porch sitters' critical role, the mule as community satire, hurricane's ambiguity, and Janie's trial focusing on personal resilience. In "Where it resists," note Wright's valid points about avoiding systemic critique, the potential exoticism, and the pear tree's personal symbolism. For "Two audiences," discuss the internal audience versus external reception, context over fixed assignment. The bottom line should affirm the hypothesis that Wright demanded indictment alongside portrait, and Hurston's novel demonstrates that portrait alone can be powerful, complicating the debate.
answer: |-
  ### The Criterion
  Du Bois's "propaganda" criterion hinges on **aim**, not effect: all art *intends* to advance a cause (specifically, racial justice by asserting Black humanity and indicting oppression). While he discusses art's *effect* (its power to move hearts and minds towards this cause), the *category* of propaganda is defined by purpose. Crucially, this aim demands a dual thrust: the **indictment** (exposing systemic racism, white supremacy, and their crushing effects) and the **portrait** (depicting Black life with full interiority – desires, intellect, flaws, joys, complexity). For Du Bois, effective propaganda requires both; the portrait humanizes to make the indictment undeniable, while the indictment provides the necessary political context for the portrait's significance. Wright's later stricture, as interpreted here, intensifies this: a portrait *only qualifies* as valid propaganda (for the cause) if it is explicitly framed by or coupled with indictment. Without the indictment, the portrait risks irrelevance or worse, serving white voyeurism.

  ### Portrait without Indictment
  *Their Eyes Were Watching God* undeniably delivers a profound **portrait** satisfying Du Bois's demand for rich Black interiority, arguably exceeding the indictment presence demanded by Wright's strict reading. The Eatonville porch sitters are crucial here. Far from mere local color, they function as an **active internal audience** engaged in communal critique and performance. Their gossip, signifying, storytelling, and judgments about Janie, Matt Bonner's mule, and each other constitute a vibrant, self-sustaining cultural practice. They analyze motives, debate values, wield humor as social control, and assert their own interpretive authority over events within their community. This *is* critical work, showcasing Black intellect, social dynamics, humor, and complex subjectivity on its own terms.

  Janie's journey itself is the ultimate portrait: her quest for self-discovery, sexual awakening (the pear tree), endurance through stifling marriages (Logan, Jody), transformative love (Tea Cake), and profound grief. Her internal voice, desires, and growth are meticulously rendered. Even Matt Bonner's mule, while potentially touching on exploitation (the animal's suffering), is primarily framed through the *community's* reaction – the elaborate mock funeral is folk humor and social catharsis, focused on Eatonville's internal dynamics rather than indicting the *system* enabling the mule's original abuse. The hurricane scene emphasizes cosmic indifference and human vulnerability, but its devastation is framed through the characters' immediate struggle for survival and their theological wrestling ("They eyes were watching God"), not a systemic critique of racism's role in their vulnerability or the flawed relief efforts. Janie's final narration to Pheoby explicitly aims to share her hard-won self-knowledge and the meaning she found in her journey ("You got tuh *go* there tuh *know* there"), prioritizing the portrait of individual becoming over any external political message.

  ### Where it Resists
  Wright's charge, however, finds traction precisely because the potent **portrait often operates without sustained, explicit indictment**. The porch sitters' critique is largely introverted, focused on Eatonville's internal hierarchy and Janie's perceived transgressions; it rarely turns its lens outward to name white supremacy as the root cause of their circumscribed world. The mule's story *could* be an indictment (a symbol of exploited Black labor), but Hurston's focus is Eatonville's satirical, theatrical *response*, diffusing systemic critique into folk humor potentially consumable as "quaint" by outsiders. The hurricane's devastation disproportionately impacts the Black migrant workers, and the chaotic aftermath (including the rabies scare and Janie's trial) stem from structural neglect and prejudice. Yet, Hurston's narrative lens remains tightly focused on Janie and Tea Cake's immediate, visceral experience and choices within the storm and its aftermath. The systemic forces shaping their vulnerability (economic marginalization, segregated living conditions, inadequate infrastructure) remain largely unspoken context, not the subject of direct indictment. The trial scene *does* indict the white power structure (the all-white jury, the presumption of guilt based on race/gender), but it's brief, and the narrative swiftly returns to Janie's internal state and her ultimate exoneration, mitigating its force as a sustained political critique.

  Most significantly, the core of the novel – Janie's quest for self-realization, symbolized by the pear tree – transcends both categories. It’s a deeply personal, almost mythic exploration of female desire and autonomy. While it affirms Black female interiority (portrait), its driving force isn't primarily political indictment *or* propaganda-by-aim for racial uplift; it’s existential. **This is where your apparatus strains:** Hurston's central project seems less about advancing a specific political cause (Du Bois's aim) and more about asserting the validity and complexity of Black Southern folk life and individual Black female experience *for its own sake*. Wright correctly identified this absence of overt political messaging (his "no theme, no message") and its potential for misappropriation ("served up for white readers"). He sensed the portrait lacked the anchoring indictment Du Bois implicitly required for art to be functional propaganda in the struggle.

  ### Two Audiences
  The porch sitters embody the **internal audience** – Eatonville judging itself. Janie's frame narrative explicitly addresses Pheoby, another Black woman ("mah tongue is in mah friend's mouf"), constructing an intimate **in-group context** for sharing experience and wisdom. This suggests Hurston *aimed* at, or at least centrally included, a Black audience capable of deeply understanding the nuances of the cultural world portrayed. However, Wright's critique and the novel's reception history highlight the impossibility of assigning a *single* audience or controlling effect. Published by a white press, lauded initially by a predominantly white literary establishment (while drawing criticism from some Black male intellectuals like Wright), the text entered a context saturated with racist stereotypes. Elements like the exaggerated dialect (by some standards), folk humor, and focus on "quaint" communal life *could* be consumed voyeuristically by white readers, reinforcing romanticized or patronizing views, regardless of Hurston's potential internal address. **The text doesn't *possess* a fixed audience; it exists within a context.** While it *creates* an internal audience (the porch, Pheoby) and resonates powerfully within a Black cultural tradition, its meaning and effect are inevitably shaped by the external context of reception, where Wright's fear of misappropriation proved partially valid. It cannot be *only* assigned an audience; its reception is fractured by the racial dynamics of its time.

  ### Bottom Line
  **Your hypothesis holds:** Wright's critique reflects a stricter application of Du Bois's dual requirement than Du Bois himself might have consistently enforced. *Their Eyes* delivers a masterful, radical **portrait** of Black interiority and folk life that satisfies Du Bois's demand for affirming humanity. However, it largely **resists sustained, explicit indictment** of systemic white supremacy within its core narrative focus on Janie's journey and Eatonville's internal world. While moments of indictment surface (the trial), they are not the driving force. Wright correctly identified this absence of overt political messaging anchored in systemic critique, leading him to dismiss it as lacking purpose for the racial struggle. **The novel demonstrates that a profound portrait *can* exist without consistent indictment.** It reveals a tension within Du Bois's criterion: Hurston achieves the "portrait" element magnificently, but prioritizes individual becoming and cultural affirmation *as* the aim, rather than subordinating it to explicit political indictment. The novel shows that the "third thing" – art asserting Black life and subjectivity *autonomously* – is powerful, but exists in fraught relationship with demands for instrumental political utility.
