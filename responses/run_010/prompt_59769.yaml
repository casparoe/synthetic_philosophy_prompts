  The blank ballot tolerance is fascinating. It can't be about civic duty because the duty is performative. It can't be about informed consent because the state accepts non-consent. So either it's about statistical representativeness (preventing turnout bias) or... maybe about the ritual of submission? The physical act of showing up as affirmation of state authority?

