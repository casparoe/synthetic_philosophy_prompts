  Better check if that holds against the age anomalies. Why sixteen in Argentina but eighteen in Brazil? If it were pure statistics, they'd standardize. Unless... ah! The representativeness justification only works when combined with existing social norms about adulthood. The load-bearing beam is statistical, but it rests on cultural footings.

  Final thought: the user's sedimentologist lens is doing heavy work here. They're right to suspect unconformities. That blank ballot isn't a bug - it's a fossil showing when the theory changed from "duty" to "representativeness". The state kept the ritual but hollowed out the content. That's why civic duty arguments feel so anemic today...
answer: |-
  Your sedimentologist's lens reveals striking stratifications in democratic theory—layers of principle deposited at different historical moments, now coexisting in tension. Let's reconstruct the implicit theory of voting emerging from these rules, then test its coherence against your questions.

  ### Core Implicit Theory: Voting as Civic Ritual
  The pattern suggests voting is conceived primarily as a **performative act of civic membership**, distinct from either instrumental choice or pure speech. Key elements:
  - **Attendance > Choice**: The Australian blank ballot tolerance reveals the state values *physical presence* at the polling place as the core obligation. This transforms voting from decision-making into ritual participation—a public affirmation of belonging to the political community. Abstention is treated as social withdrawal, not speech.
  - **Citizenship Boundary**: Voting attaches to formal membership (citizenship) because it symbolizes *allegiance*, not mere subjection to laws. Non-citizen residents (even long-term) lack this symbolic tie—hence Ireland/NZ distinctions. The duty belongs to those who "own" the polity.
  - **Age Thresholds**: The 18-70 bracket in Brazil/Ecuador frames voting as an obligation of *prime civic capacity*—aligned with military service ages, tax responsibility peaks, and traditional adulthood markers. Optional voting for youth/elderly treats them as liminal members.

  ### Rival Accounts Ruled Out
  This model actively excludes:
  - **Voting as Competent Choice**: If competence were key, literacy tests would persist (Brazil exempts illiterates!), and blank ballots wouldn't satisfy the duty.
  - **Voting as Coercion Counterweight**: Non-citizens are subject to laws but excluded from compulsion; minors pay sales tax but aren't enfranchised.
  - **Abstention as Speech**: Penalizing non-attendance (but not blank votes) criminalizes silence itself, treating it as desertion, not expression.
  - **Pure Statistical Representativeness**: If turnout bias were the *primary* concern, compulsion would extend to all residents (like NZ's enrollment rule), not just citizens.

  ### Underdetermined Features
  Some elements tolerate multiple justifications:
  - **Modest Fines**: Could reflect proportionality (Australia) or mere symbolic enforcement (Belgium).
  - **Optional Youth Voting**: Could acknowledge developmental capacity (Brazil) or encourage voluntary engagement (Argentina).

  ---

  ### Stratigraphic Analysis: Unconformities in the Core Sample
  Your sedimentologist's instinct is correct—this is not one coherent stratum but multiple deposits:

  1. **Lower Bed (Load-Bearing): Civic Republicanism**  
     *Late 19th/Early 20th C. (Belgium 1893, Australia 1924)*  
     - Voting as **non-delegable duty** to the community.  
     - Enforced attendance affirms the polity's authority.  
     - Citizenship as the boundary of obligation.  

  2. **Upper Bed (Decorative): Liberal-Egalitarian Patch**  
     *Late 20th C. (Argentina 2012, NZ resident enrollment)*  
     - Emphasis on **inclusion** (youth vote, resident rights).  
     - Erosion of enforcement (Belgium, Netherlands repeal).  
     - Blank ballots tolerated as pressure-release valves.  

  *Unconformity*: The civic duty foundation can't explain optional youth voting or non-enforcement. The upper layer's inclusion logic contradicts the lower layer's obligation rigor. Yet the *form* of compulsion (attendance rituals, age brackets) persists by inertia.

  ---

  ### Australian Blank Ballots: Bodies vs. Judgments
  Your suspicion is acute. Tolerating blank votes **exposes the state's priority:**
  - It wants *bodies in polling booths*, not decisions. This undermines civic duty arguments (which require intentional participation).
  - It *does* tacitly serve **statistical equity**: Preventing turnout bias among marginalized groups matters more than their actual votes. The ritual ensures all demographics "show up" in turnout counts, legitimizing outcomes.
  - **Legitimacy claims survive** only if redefined: Not "all voices heard," but "all segments physically represented." This is thinner but operationally sufficient.

  ---

  ### Thought Experiment: "Coercion Requires Voice"
  If we adopted:  
  > *All subject to coercive laws must vote.*

  **Changes required:**
  - **Australia**: Enfranchise all adult residents (not just citizens). Blank ballots still permitted? Likely yes, preserving ritual.
  - **New Zealand**: *Compel* voting (currently only enrollment is compulsory). Extend to non-citizen residents.
  - **Ireland**: Allow non-citizen residents to vote in *national* elections (not just local).
  - **Brazil**: Enfranchise/exempt based on residence, not literacy or citizenship.

  **Resistance Patterns Reveal:**
  - **Fiercest Opposition**: National legislatures (esp. Ireland/Australia).  
    *Why*: Exposes that existing rules prioritize **national identity over subjection**. Resistance would frame voting as "membership ritual," not law-based right.
  - **Mildest Change**: Brazil (already has complex strata; literacy exemption is unstable).  
  - **Pattern Insight**: Existing arrangements serve **nation-building first**, democratic equity second. Letting non-citizens vote nationally would "dilute" the community of allegiance.

  ---

  ### Conclusion: A Fractured Foundation
  No single principle generates all boundaries. The load-bearing stratum is **civic ritualism** (attendance as affirmation of membership), overlaid with late-modern **inclusive gestures** that hollow out enforcement. The blank ballot loophole is the smoking gun: it admits the state desires participation theater, not informed consent. Yet this unstable mix persists because it serves multiple masters—symbolic unity *and* statistical legitimacy—without reconciling their contradictions. Like deltaic sediments, the structure holds through compression, not coherence.
