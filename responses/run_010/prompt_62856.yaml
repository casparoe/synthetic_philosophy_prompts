prompt: |-
  I'm doing a part-time cognitive science conversion course and we've just spent three weeks on Hofstadter and Mitchell's Copycat — the slipnet, the coderack, the workspace, temperature climbing when too many possibilities are competing, the whole apparatus. The worked examples are always the same sort of letter-string puzzle (abc becomes abd, so what does ij become?), which is fine for teaching the machinery but does leave the whole thing feeling like a very small toy in a very small room. I want to run it on something real and see whether it survives the contact. My candidate is the Pluto business, and I'll put down the facts I think matter so you don't have to guess at them: Pluto was found in 1930 by a search for a hypothetical Planet X and was assumed to be substantial — larger than Mercury at first, then smaller and smaller as the measurements improved; Charon turned up in 1978 and let people calculate Pluto's mass properly, which came out absurdly small; through the 90s more and more Kuiper belt objects were found, a lot of them sharing Pluto's odd eccentric, tilted orbit; the Hayden Planetarium in New York quietly left Pluto out of its planets exhibit when it reopened in 2000; then in 2005 Eris showed up, roughly Pluto's size and actually more massive, and the choice went stark — either Eris is the tenth planet or Pluto isn't the ninth. A committee set up in 2005 offered three candidate definitions: a cultural one (roughly, a planet is a planet if enough people say it is), a structural one (round enough to be in hydrostatic equilibrium), and a dynamical one (massive enough to have cleared its orbit of other bodies). The 2006 General Assembly in Prague ended up adopting a three-part definition — orbits the Sun, in hydrostatic equilibrium, has cleared its neighbourhood — plus a brand-new dwarf planet category for things satisfying the first two but not the third, and the rival proposal to treat dwarf planets as a subclass of planets was voted down. It was settled by a show of hands among the members who were still in the hall at the end of a fortnight-long meeting. And it hasn't settled: a large chunk of the planetary science community, including people who work on New Horizons, still use a geophysical definition on which anything round is a planet, so there are now two live communities with two different extensions for one word, plus a public that never accepted the change at all. My brother's eight-year-old has a glow-in-the-dark mobile of the nine planets on his bedroom ceiling and he refuses to update it, which I think is data of a sort.

  So first do the mapping, properly, before you evaluate anything — I'm not after a general essay on Pluto. Treat the episode as one long analogy-making run and tell me what the microdomain actually is here, what the source and target are, and what the slipnet neighbourhood of planet looks like: which nodes are genuinely adjacent (world, body, satellite, moon, minor planet, asteroid, comet, Kuiper belt object, dwarf planet, round thing, thing that clears its orbit, "the nine") and how the connection strengths between them would have to have been arranged in, say, 1995 versus 2005 for the eventual outcome to be the cool, low-temperature solution. Then say which slips happened and which were refused. Eris is the interesting case: the structural parallel between Eris and Pluto is about as tight as an analogy can get, and it's what heated everything up, but the community refused the obvious slip and instead moved the target concept into a node that didn't exist beforehand. Is inventing a node something the model can do at all, or does it only ever slide between things already sitting in the net? And what's the temperature story — did the vote cool the system down or just freeze it mid-slip?

  Then run it the other way, which is the bit I care about most. Everyone at the time said the fight was merely semantics, an argument about a word, no fact of the matter either way — but it definately didn't feel like that. People experienced it as the solar system having got smaller; there was real, if half-joking, mourning. Does the fluid concepts picture have the resources to explain why a dispute about a category boundary feels substantive rather than verbal, something about the concept being entangled with a load of others so that a slip propagates and drags them along — and can it say anything about the cost of a slip, or about why that cost landed so unevenly (a child's mnemonic versus a dynamical astronomer's taxonomy)? Be honest about where the model goes quiet. It has no notion of authority, so it can't represent the difference between a slip forced by structural pressure and one imposed by a vote; it has no notion of stakes; and it doesn't seem able to represent the current situation, where the slippage simply never resolved and two communities carry on in parallel with different nets. Also tell me whether I'm making a category error by pointing a model built for three-letter strings at seventy-odd years of astronomical taxonomy — if the analogy between Copycat and this case is itself a bad one, show me where it slips and what would have to be added to the model for it to earn its keep. One more thing: there's a control case. In the 1840s and 50s Ceres and the other objects between Mars and Jupiter were counted as planets, the list reached twenty-odd by 1851, and then astronomers quietly started calling them asteroids instead and nobody minded in the slightest. Same structural pressure, none of the fuss. What does the contrast between those two episodes say about when slippage is cheap and when it isn't — and is that something the model could have predicted, or only something we can see with hindsight? Don't send me off to look things up, I just want your analysis.
reasoning: |-
  Okay, this user is diving deep into applying Hofstadter and Mitchell's Copycat model to the Pluto reclassification saga. They're clearly frustrated with toy examples and want to test the model against real-world concept change. The level of detail about Pluto's history shows they've done their homework - this isn't a casual inquiry. 

  Hmm, their core challenge is fascinating: can a model designed for microdomain letter analogies explain macro-historical category shifts? The user specifically wants structural analysis, not philosophical musing. They've laid out perfect test cases - the contentious Pluto debate versus the smooth Ceres transition. 

  First I need to map Copycat's components onto the Pluto episode. The slipnet nodes are obvious (planet, dwarf planet, KBO etc.), but connection strengths in 1995 vs 2005 will be crucial. That Charon discovery in '78 weakened the size node link, while Eris in 2005 created maximum pressure on the "cleared orbit" node. 

  Interesting how the user spots Copycat's limitations: no mechanism for node creation (dwarf planet emerged from nowhere), no authority representation (the vote versus structural inevitability), and no parallel nets (current dual definitions). The emotional weight of Pluto's demotion versus Ceres is another blind spot - why did one feel like mourning? 

  The Ceres contrast is brilliant. Both cases had similar structural pressures (many similar objects found), but only Pluto caused cultural trauma. Copycat can't explain that difference because it ignores embodied concepts - Pluto had cultural weight as "the odd one at the edge" while Ceres was just another rock. 

  For the temperature analogy... the 2006 vote didn't cool the system, it froze mid-slip. Two competing solutions remain active because the cultural node ("the nine") never disconnected. That's why the child's mobile persists - it's literally a fixed representation of the pre-slip net. 

  Where the model fails worst is explaining why boundary disputes feel substantive. In Copycat, changing "ij" to "ik" has no stakes, but for astronomers, "planet" connects to funding, textbooks, and identity. The model needs weighted emotional connections to capture that. 

  Final verdict? The analogy holds surprisingly well for structural dynamics, but fails at scale and affect. To earn its keep, Copycat would need: emergent node generation, parallel competing nets, and emotional valence on connections. The Ceres-Pluto contrast proves cultural entanglement determines slippage cost. 

  The user's brother's kid refusing to update the mobile is the perfect data point - it's a literal frozen slipnet.
answer: |-
  Here's a structural analysis of the Pluto episode through the Copycat lens, pinpointing where the model illuminates and where it falls silent:

  **Core Mapping:**
  - **Microdomain:** Solar system taxonomy (specifically "planet" classification).
  - **Source Concept:** "Pluto" (pre-2006) – embodying attributes like *historical planet status*, *orbits Sun*, *small mass*, *eccentric orbit*, *resides in Kuiper Belt*, *first major KBO found*.
  - **Target Concept:** "Planet" (the category boundary itself).
  - **Workspace:** The astronomical community's evolving understanding (1930-2006), populated with facts (Pluto's discovery, Charon, KBOs, Eris), definitions (proposed & adopted), and cultural artifacts (textbooks, planetariums, the child's mobile).
  - **Coderack:** Proposals for resolving the tension (e.g., "Keep Pluto & add Eris/Ceres/etc.", "Demote Pluto", "Invent new category").
  - **Temperature:** Rises with each destabilizing discovery (Charon's mass, KBOs, Eris) and conflicting definitions. Peaks during the 2006 IAU debate.

  **The Slipnet (c. 1995 vs. 2005):**
  *   **1995 Slipnet (Pre-Eris, Pre-KBO Boom):**
      *   **Planet Node:** Strong connections to *Orbits Sun*, *Large/Round*, *Historical Planet Status*, *"The Nine"*. Weaker connection to *Cleared Orbit*.
      *   **Adjacent Nodes & Strengths:**
          *   *World* (Strong - cultural/historical)
          *   *Body* (Strong - object)
          *   *Satellite/Moon* (Weak - Pluto has none known then)
          *   *Minor Planet/Asteroid* (Moderate - size concerns, but distinct orbit/location)
          *   *Comet* (Weak - different composition/orbit)
          *   *Kuiper Belt Object* (Emerging Weak - Pluto was unique/special)
          *   *Round Thing* (Strong - assumed)
          *   *Cleared Orbit* (Very Weak - not a primary criterion)
          *   *"The Nine"* (Very Strong - cultural/educational anchor)
  *   **2005 Slipnet (Post-Eris Discovery):**
      *   **Planet Node:** Connection to *Large/Round* weakened (Pluto/Eris similar size). Connection to *Unique/Distinct* shattered. Connection to *Cleared Orbit* suddenly relevant & strong (due to Eris/Pluto comparison & dynamical arguments). Connection to *"The Nine"* still strong culturally but astronomically stressed. *Kuiper Belt Object* connection significantly strengthened.
      *   **Adjacent Nodes & Strengths:**
          *   *Kuiper Belt Object* (Strong - Pluto/Eris are quintessential large KBOs)
          *   *Minor Planet* (Moderate-Strong - dynamical similarity)
          *   *Round Thing* (Strong - applies to many bodies)
          *   *Cleared Orbit* (Suddenly Strong - key differentiator proposed)
          *   *"The Nine"* (Strong culturally, Weakening astronomically)
          *   *Dwarf Planet* (New Node - conceptual proposal emerges)
          *   *World* (Weakening astronomically, still strong culturally)
          *   *Satellite/Moon* (Moderate - Charon highlighted Pluto's small mass system)

  **The Run: Slips, Refusals, and Node Invention**
  1.  **Obvious Slip Attempted (and Refused):** The tight structural parallel between Eris and Pluto (*Size, Orbit Type, KBO Location*) strongly pressured a slip where "Pluto is a planet -> Eris is a planet". This would have expanded the category.
  2.  **Refusal & Node Invention:** The community *refused* this slip due to the high perceived cost: exploding the planet count (Ceres, Makemake, Haumea, etc.), violating the (now activated) *Cleared Orbit* criterion, and weakening the *Unique/Distinct* aspect. Instead, Copycat would need a radical new operation: **inventing a new node ("Dwarf Planet")**. This node captured the strong *Round Thing* and *Orbits Sun* connections, but explicitly severed the *Cleared Orbit* connection shared with major planets. Pluto and Eris slipped *together* into this new node.
  3.  **Other Slips:** Pluto slipped *away* from the *Planet* node's *Cleared Orbit* and *Unique/Distinct* aspects. It slipped *towards* the *Kuiper Belt Object* and *Minor Planet* nodes more strongly. The *Planet* node itself strengthened its connection to *Cleared Orbit*.

  **Temperature Story:**
  The discovery of Eris massively increased temperature – the pressure for *some* resolution was extreme. The vote attempted to force a low-temperature solution by fiat. **It didn't truly cool the system; it froze it mid-slip.** The cultural *"The Nine"* node retained its strength for the public and many scientists, preventing a clean, low-energy consensus slip. We have a high-energy frozen state: two parallel, incompatible slipnets (dynamical planet definition vs. geophysical planet definition) coexisting, with the public largely stuck on the 1995 net.

  **Why It Felt Substantive (Model's Strengths & Weaknesses):**
  *   **Entanglement & Propagation (Model's Strength):** The "planet" node was deeply entangled. Slipping Pluto affected:
      *   *Categorization of other bodies:* Ceres, Eris, KBOs.
      *   *Textbooks & Education:* Reworking fundamental knowledge.
      *   *Cultural Identity:* "The Nine" was a powerful cultural mnemonic (the child's mobile). Severing Pluto felt like losing a familiar "world."
      *   *Scientific Identity:* Planetary scientists vs. dynamicists; the stakes of what defines their field.
  *   **Cost & Uneven Impact (Model's Weakness):** Copycat lacks:
      *   *Affective Weight:* Nodes have no emotional valence. Losing Pluto *hurt* culturally; changing a child's mobile feels trivial *to an astronomer* but significant *to the child*. The model can't represent this cost asymmetry.
      *   *Stakes & Authority:* A vote isn't a "slip" driven by conceptual structure; it's an authority-imposed rule. The model can't differentiate structural inevitability from institutional decree, nor represent the stakes (funding, textbook contracts, public engagement).
      *   *Parallel Nets:* Copycat assumes one slipnet resolving to one solution. It cannot model the stable coexistence of conflicting conceptual frameworks.

  **The Copycat Analogy: Does It Hold?**
  *   **Strengths:** It brilliantly models the *structural pressure* caused by Eris/Pluto similarity, the *competition* between possible resolutions (expand category, demote Pluto, invent new category), the *role of connection strengths* changing over time (KBO link strengthening, Cleared Orbit link activating), the *rise in temperature* under pressure, and the *conceptual entanglement* that made a simple slip costly.
  *   **Where It Slips (Limitations):**
      *   **Scale & Complexity:** Decades of history, cultural embedding, institutional politics, and vastly more "nodes" than a 3-letter domain.
      *   **Node Invention:** Copycat doesn't invent *fundamentally new* nodes like "dwarf planet"; it slides between existing ones. This is a major gap for real-world concept evolution.
      *   **Affect & Stakes:** The intense emotional reaction and uneven costs are outside the model.
      *   **Authority & Resolution:** The role of the IAU vote and the persistence of disagreement are unmodeled phenomena.
      *   **Multiple Perspectives:** Copycat has one workspace/slipnet. Real-world category debates involve multiple, conflicting conceptual networks operating simultaneously.

  **The Control Case: Ceres & The Asteroids**
  *   **Similar Structural Pressure:** Discovery of many similar bodies (Ceres, Pallas, Juno, Vesta...) in similar orbits.
  *   **Cheap Slippage:** Why?
      *   **Weak Cultural Entanglement:** Ceres never attained the cultural status of "planet" Pluto had. There was no "The Twenty" mnemonic anchoring it culturally.
      *   **Early Stage:** Solar system taxonomy was nascent, less codified in culture and education.
      *   **No Authority Imposition:** The shift happened gradually and consensually ("asteroid" emerged naturally as a useful descriptor), not via a contentious vote against a backdrop of strong public attachment.
      *   **Lower Stakes:** No significant textbooks, public myths, or scientific subfield identities deeply tied to Ceres specifically being a planet.
  *   **Could Copycat Predict the Difference?** **No.** The model lacks the concepts of:
      *   *Cultural Entanglement Strength:* It can't measure the "weight" of the *"The Nine"* node vs. the lack of a *"The Twenty"* node.
      *   *Developmental Stage:* It doesn't model how entrenched a categorization scheme is over time.
      *   *Consensus vs. Imposition:* It can't distinguish a smooth conceptual drift from a forced, contested redefinition.
      *   *Stakes:* The cost/benefit of a slip isn't represented.

  **Conclusion:** The Copycat analogy is **revealing but insufficient**. It perfectly captures the core *mechanics* of the conceptual tension and the options considered. It explains *why* the Eris/Pluto parallel caused such heat and *why* a simple slip felt costly (entanglement). However, it fails to explain the *emotional weight*, the *role of authority* (the vote), the *persistence of disagreement* (parallel nets), the *invention of a fundamentally new node*, and critically, the *contrast with Ceres* based on cultural embedding and historical timing. Copycat is a powerful lens for the *cognitive structure* of the analogy-making *process* within the astronomical community, but it needs augmentation (affect, cultural weight, institutional authority, multi-agent interaction, node generation) to fully "earn its keep" on the grand stage of real-world, historically-situated, culturally-loaded conceptual change. The Pluto episode highlights that category boundaries aren't just discovered in the world or dictated by logic; they are negotiated within complex systems of concepts, culture, history, and power – dynamics beyond Copycat's microdomain.
