prompt: |-
  I've been collecting cases where I can't decide whether to say someone still knows how to do a thing. Gut calls first, then what I want from you.

  - My grandmother had a stroke. She still knits complicated patterns without looking, but ask her how she does it and she gets frustrated and says nothing useful. She knows how to knit.
  - My brother was a decent guitarist, didn't touch an instrument for 25 years, picked one up last week and was fine. Knows how.
  - A coach I worked with could take a bad swimmer and make them good, and could diagnose anyone's stroke in two seconds, but he swims like a dog and can't demonstrate anything. I still say he knows how to swim.
  - A kid who memorized the textbook steps for a surgical knot, recites them perfectly but freezes at the table. Doesn't know how yet.
  - A woman who drove for years, was in a bad crash, is now terrified of being behind the wheel and physically can't do it. She still knows how to drive, I think — but I cant say what makes her different from the kid with the knot.
  - A guy who has done the same commute ten thousand times but can't draw a map and is helpless if you start him anywhere else. Knows how to get to work? I'd say yes, though I feel like he's missing something a taxi driver has.

  The pair I can't reconcile is the coach and the kid: neither can perform the thing, and I give opposite verdicts. My tentative rule is "they know how if they can do it when it matters," but that clearly breaks on the crash victim.

  So: what principle, if any, gets all six right? Tell me what it predicts for a case I left out — a chess player paralyzed from the neck down who still calls out moves and beats strong players — and be straight about which of my calls you'd have to overrule to get something simpler.

  Bottom line in your first sentence (the principle, or your best candidate), then the reasoning. No preamble, and don't restate my cases back at me.
reasoning: |-
  Okay, let me tackle this user's query. They want a principle that explains when someone "knows how" to do something across different scenarios. The user provided six cases with their gut calls and highlighted the coach and the knot-tying kid as contradictory. The key challenge is reconciling those two: both can't perform, but the user says the coach knows how while the kid doesn't.

  First, I need to find a common thread. The user's tentative rule about "doing it when it matters" fails with the crash victim who can't drive due to fear. So performance alone isn't sufficient. Maybe it's about having integrated procedural knowledge. The grandmother knits automatically but can't explain it—her skill is ingrained. The brother retains guitar skills after years, showing procedural memory. The coach can diagnose swimming techniques but can't demonstrate; his knowledge is analytical, applied to others. The knot kid has theoretical steps memorized but can't apply them, lacking practical integration. The crash victim has the skill but is blocked by trauma, so the knowledge exists but is inaccessible. The commuter knows his route through habit but lacks flexible navigation skills.

  The chess player example is interesting. Even though paralyzed, they direct moves and win, showing their strategic knowledge is intact. Applying the integrated procedural knowledge principle here: they can apply their knowledge effectively without physical action. That fits.

  I need to check if this principle covers all cases. The coach's case: his knowledge is integrated in teaching, not performing. The knot kid has declarative knowledge without application. The crash victim has integrated knowledge that's blocked. The commuter's knowledge is specific, not flexible. The chess player applies knowledge mentally. 

  What about the user's gut calls? The principle validates all except maybe the commuter. The user says he knows how to get to work, but the principle might imply that without flexibility, it's not full procedural knowledge. But the user accepted it, so maybe route-specific knowledge counts as integrated for that context. 

  Potential overrule: the commuter. If flexibility is part of the principle, he might not fully "know how" like a taxi driver. But the user includes him, so maybe the principle can accommodate by context. The main contradiction was the coach vs kid resolved. The crash victim is covered as knowledge present but access blocked, different from the kid who never integrated it.
answer: |-
  **Principle: Someone knows how to X if they possess integrated procedural knowledge that enables successful execution or effective guidance of X in relevant contexts.**

  1.  **Grandmother:** *Knows.* Integrated procedural knowledge (knitting) remains intact despite impaired declarative explanation.
  2.  **Brother:** *Knows.* Integrated procedural knowledge (guitar) was retained and reactivated.
  3.  **Coach:** *Knows.* Possesses integrated procedural knowledge for *diagnosing/teaching* swimming effectively; inability to demonstrate doesn't negate this specific knowledge-how.
  4.  **Kid:** *Doesn't know.* Possesses only declarative knowledge (steps); lacks integrated procedural knowledge for execution under pressure.
  5.  **Crash Victim:** *Knows.* Possesses integrated procedural knowledge (driving); psychological/physical block prevents *access/execution*, not knowledge itself. (Differs from Kid: she *has* the integrated knowledge, he *lacks* it).
  6.  **Commuter:** *Knows for specific route.* Possesses integrated procedural knowledge for the *specific* habitual route; lacks flexible navigational knowledge. (Contrasts with taxi driver's broader knowledge-how).
  7.  **Chess Player:** *Knows.* Possesses integrated procedural knowledge for chess strategy/execution; directs moves successfully despite physical limitation.

  **Reasoning:** "Knows how" hinges on possessing *integrated procedural knowledge* – a system of skills, intuitions, and responses enabling action or competent guidance. Performance is strong evidence but not the sole criterion (Coach, Chess Player, Crash Victim). Declarative knowledge alone is insufficient (Kid). Blocks to *accessing* existing knowledge (Crash Victim, Grandmother's explanation) differ from *lacking* the integrated procedural knowledge (Kid). Context defines the relevant knowledge (Commuter knows route-specific procedure, Coach knows diagnostic procedure).

  **Overrule:** Your "yes" for the **Commuter** is technically correct under this principle *for his specific route*. However, the principle explicitly identifies his knowledge as contextually limited compared to a taxi driver's flexible navigational knowledge-how, which might feel like a partial overrule of the *depth* implied by your "yes". All other gut calls are validated. The Coach/Kid contradiction is resolved: the Coach's knowledge-how is real but applied to diagnosis/teaching (executable in that context), while the Kid lacks executable procedural knowledge entirely.
