answer: |-
  Below is the complete diagnostic instrument designed to your specifications. It consists of nine concrete scenarios, each with three response options. The instrument is structured to sort participants along three axes without using the labels "democracy" or "epistocracy":
  - **Axis 1 (Nature of Vote)**: Whether the vote is an **individual claim** (A: a right held against the polity) or a **conditional office** (B: a privilege conferred and conditioned by the polity).
  - **Axis 2 (Constituency Definition)**: Whether the constituency is defined by **affected interests** (C: those impacted by decisions), **subjected coercion** (D: those bound by laws), or **durable membership** (E: long-term membership in the polity).
  - **Axis 3 (Legitimacy Contribution)**: Whether the ballot's legitimacy is **aggregative** (F: adds weight to an outcome) or **expressive** (G: matters that this person cast it).

  Each scenario is jurisdiction-free, concrete, and avoids abstract principles. Responses are worded to ensure no option appears "serious" or "caring" by default. The instrument is completable in ~12 minutes by non-experts, and scoring maps responses to specific poles of the axes. After the scenarios, I provide the scoring key, a map of the 12-cell space (2x3x2, not 27, as your axes yield 2 + 3 + 2 poles), and address your queries.

  ---

  ### **Diagnostic Instrument**
  *Instructions for participants: For each scenario, select the one response that best reflects your view. There are no right or wrong answers—this is about your personal perspective. Assume nothing about current electoral laws is at issue.*

  1. **Fifteen-year-old and grandmother**:  
     A 15-year-old would pass a civics test on electoral issues, but their 80-year-old grandmother would fail it due to memory struggles. The 15-year-old cannot vote due to age, but the grandmother can.  
     - (a) *The grandson should be allowed to vote if he passes the test; age shouldn’t matter if you know the issues.* → **A (claim)**: Emphasizes individual capacity as a basis for voting, treating it as a claim not dependent on age.  
     - (b) *Neither should be barred—voting is for everyone, tests are unfair and exclusionary.* → **C (affected)**: Focuses on universal inclusion based on being affected by decisions, rejecting gates.  
     - (c) *The grandmother should keep voting as a lifelong member; the grandson can wait his turn.* → **E (membership)**: Prioritizes durable membership over competence or age.

  2. **Long-term resident nurse**:  
     A nurse has lived in the city for 22 years, pays all taxes, follows all laws, but cannot become a citizen (due to home country restrictions and no dual nationality).  
     - (a) *Let her vote—she lives under the laws and deserves a say in them.* → **D (subjected)**: Defines constituency by subjection to coercion.  
     - (b) *Don’t change the rules—citizenship is the line, and she hasn’t crossed it.* → **E (membership)**: Bases voting on formal, durable membership.  
     - (c) *She should vote; she’s deeply affected by policies on healthcare and schools.* → **C (affected)**: Centers on affected interests.

  3. **Compulsory turnout with any ballot**:  
     Voting is mandatory, but the fine is waived if you deposit any ballot (even blank or "none of these").  
     - (a) *This is fine—forcing people to show up is what matters for legitimacy.* → **G (expressive)**: Values the act of casting a ballot as expressive, regardless of content.  
     - (b) *It’s pointless—only ballots that express real choices should count toward outcomes.* → **F (aggregative)**: Sees legitimacy in the aggregation of meaningful votes.  
     - (c) *The fine should be higher to compel serious participation.* → **B (office)**: Treats voting as a conditional office requiring responsible engagement.

  4. **Convicted fraudster vs. unconvicted billionaire**:  
     A fraudster loses their vote for 5 years, while a billionaire (never convicted) spends unlimited money on election ads.  
     - (a) *The fraudster’s loss is fair punishment; voting is conditional on trust.* → **B (office)**: Frames voting as a privilege that can be revoked for misconduct.  
     - (b) *Both are unfair—the fraudster’s vote is a right, and money distorts equality.* → **A (claim)**: Asserts voting as an inalienable right, resistant to conditions.  
     - (c) *The fraudster should vote—both are affected by laws, but ad spending is separate.* → **C (affected)**: Defines constituency by affected interests, separating voting from other influences.

  5. **Fractional parent-vote for children**:  
     Parents get extra fractional votes for minor children, fading as they age. A household with three children has more voting weight.  
     - (a) *This is fair—parents bear the costs of policies affecting kids, so they need more say.* → **C (affected)**: Ties voting weight to affected interests (family impacts).  
     - (b) *Unfair—voting is individual; no one should get extra weight for others.* → **A (claim)**: Upholds vote as an equal, non-transferable individual claim.  
     - (c) *It makes sense—children are future members, so parents represent that continuity.* → **E (membership)**: Grounds the vote in intergenerational membership.

  6. **Second chamber by lottery with veto**:  
     A legislative body is filled by random selection (lottery) and holds real veto power.  
     - (a) *Good idea—ordinary people’s direct voices make decisions more legitimate.* → **G (expressive)**: Emphasizes the expressive value of diverse individuals participating.  
     - (b) *Bad idea—random people lack expertise; elections ensure qualified voices.* → **B (office)**: Implies voting/participation should be conditioned on competence.  
     - (c) *It ensures decisions reflect all affected groups, not just elites.* → **C (affected)**: Focuses on representing affected interests.

  7. **Emigrated citizen voting**:  
     A citizen left 30 years ago, never returned, pays no taxes, but still receives a ballot.  
     - (a) *He should vote—citizenship is permanent, and he might return someday.* → **E (membership)**: Prioritizes durable membership over current ties.  
     - (b) *He shouldn’t vote—he’s not affected by daily life here anymore.* → **C (affected)**: Defines constituency by current affected interests.  
     - (c) *He should vote—laws could still coerce him if he visits or owns property.* → **D (subjected)**: Bases voting on potential subjection to coercion.

  8. **Random voter vs. thoughtful voter**:  
     A voter admits choosing names randomly and asks why their ballot counts equally.  
     - (a) *It’s fine—votes just add to the total; how you choose doesn’t matter.* → **F (aggregative)**: Sees ballots as aggregative weights, not expressions.  
     - (b) *Your vote should count less—voting requires effort and responsibility.* → **B (office)**: Conditions voting on competence/effort as a conferred office.  
     - (c) *It’s your right to vote however; equality comes from shared membership.* → **A (claim)**: Treats voting as an unconditional individual claim.

  9. **Deliberate abstention as message**:  
     A person abstains to signal dissatisfaction, calling abstention their "message."  
     - (a) *Abstention is useless—it doesn’t help pick winners or fix problems.* → **F (aggregative)**: Values ballots only for aggregative outcomes.  
     - (b) *Abstention is valid—it signals dissent and should be recorded as such.* → **G (expressive)**: Legitimizes abstention as expressive speech.  
     - (c) *They have a right to abstain; it’s their choice, like voting.* → **A (claim)**: Frames voting/abstention as personal claims.

  ---

  ### **Scoring Key**
  Each response maps to one pole of one axis. The mapping is diagnostic because it isolates core beliefs about the franchise without overlapping with other axes or privileging "obvious" answers. For example:
  - **Why diagnostic?** Responses avoid moralizing (e.g., no "caring" option). Each forces a trade-off: e.g., Scenario 1(a) ties competence to claim (A) but rejects age gates, while 1(c) prioritizes membership (E) over competence.  
  - **Full mapping**:  
    - *Scenario 1*: (a) → A, (b) → C, (c) → E  
    - *Scenario 2*: (a) → D, (b) → E, (c) → C  
    - *Scenario 3*: (a) → G, (b) → F, (c) → B  
    - *Scenario 4*: (a) → B, (b) → A, (c) → C  
    - *Scenario 5*: (a) → C, (b) → A, (c) → E  
    - *Scenario 6*: (a) → G, (b) → B, (c) → C  
    - *Scenario 7*: (a) → E, (b) → C, (c) → D  
    - *Scenario 8*: (a) → F, (b) → B, (c) → A  
    - *Scenario 9*: (a) → F, (b) → G, (c) → A  

  **Scoring method**: Tally selections for each pole. For each axis, assign the dominant pole (highest count). For Axis 2 (three poles), use the highest count; if tied, assign to the pole with the earliest scenario (e.g., C > D > E by Sc2, Sc3, Sc1). For Axes 1 and 2, ties are unlikely (4–5 responses per pole), but if tied, use Axis 1: A (claim) or Axis 3: F (aggregative) as defaults due to intuitive prioritization in the scenarios. This yields coordinates (e.g., A-C-F).

  ---

  ### **Cell Map (12 Cells)**
  The space is 2x3x2, generating 12 cells. No cells are collapsed; all are coherent and politically plausible. Below, descriptive names emphasize core beliefs; standard labels (in parentheses) are added only if confidently applicable. Unoccupied cells (e.g., 27-cell expectation) are addressed in the next section.

  | Cell (A1-A2-A3) | Descriptive Name (Standard Label, if Confident)                                                                 | Coherence Notes                                                                                                                                                             |
  |------------------|-----------------------------------------------------------------------------------------------------------------|-----------------------------------------------------------------------------------------------------------------------------------------------------------------------------|
  | (A, C, F)       | **Claim for the Affected with Aggregative Legitimacy** (Liberal instrumentalism)                                | Coherent: Voting as a right for affected individuals, with legitimacy from vote totals.                                                                                    |
