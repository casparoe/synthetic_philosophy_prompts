  The core questions reveal sophisticated theoretical concerns: Is the "honesty" framing functional or decorative? Does vote-buying prohibition target alienation rather than direction? What ballot conceptions does the system implicitly reject? They propose a specific hypothesis about alienation vs. direction that I need to rigorously test.

  Breaking this down:
  - The three practices need restatement in precise terms: electoral guidance (sincerity norm), tactical voting (accepted strategic behavior), and parliamentary procedure (agenda manipulation defenses).
  - For the implicit theory, I should argue the system treats ballots as private expressive acts where ownership matters more than content, accommodating both sincerity rhetoric and strategic voting through the alienation distinction.
  - Rival views excluded would include: pure preference aggregation (contradicted by tactical voting), ballots as direct causal interventions (undermined by legislative agenda controls), and purely expressive signaling (incompatible with mandate claims).
  - Load-bearing commitments: vote ownership (alienation prohibition) and institutional context-dependence (different rules for voters vs. legislators). The sincerity language is decorative.
  - Testing the alienation hypothesis: it fits bribery laws focusing on external control, but struggles with "undue influence" prosecutions that may target persuasion. Verdict: largely valid.
  - If swapping to instrumental theory: official guidance would drop sincerity language, vote-buying bans might refocus on equity rather than alienation, and mandate claims would reference strategic equilibria.
  - Confidence levels: High on alienation distinction (matches legal texts), medium on sincerity as decoration (some officials may genuinely believe it), low on whether agenda controls imply ballot futility (alternative explanations exist).

  The user's hypothesis proves robust—the system cares more about votes being uncoerced private property than about their sincerity. The unresolved tension lies in mandate claims, which still borrow sincerity rhetoric the system doesn't enforce.
answer: |-
  ### What I described, cleaned up  
  (1) **Official electoral guidance** (e.g., Electoral Commission materials) instructs voters to rank candidates sincerely ("vote for who you want") and criminalizes vote-buying/coercion ("bribery," "undue influence"). The stated goal is electoral outcomes reflecting "genuine" voter preferences.  
  (2) **Tactical voting** is widely promoted (by media, NGOs) and socially accepted as legitimate. Voters are advised to rank candidates strategically (e.g., "vote X to stop Z"), with no legal or procedural penalty for doing so.  
  (3) **Legislative voting procedures** (e.g., parliamentary standing orders) rigidly sequence amendments/motions to prevent agenda manipulation, acknowledging that voting order affects outcomes. No analogous anti-manipulation rules exist for public ballots.  

  *Corrections*: Your description is accurate for UK/Commonwealth systems (e.g., ranked-choice ballots). "Vote buying" is illegal but rarely prosecuted; "pressure" typically means threats/coercion, not persuasion. Tactical advice is ubiquitous but not universally endorsed (some decry it as cynical).  

  ### The implicit theory  
  The ballot is a **personal expressive act with institutional consequences**, where *ownership* of the vote matters more than its sincerity. Voters are sovereign agents whose choices must be free from external *alienation* (transfer of control via bribes/threats), but not from instrumental reasoning. The system separates:  
  - **Voter intent** (protected as private property: your vote must be *yours*).  
  - **Strategic context** (acknowledged as inevitable: your vote’s impact depends on others’ actions).  
  - **Institutional integrity** (prioritized in legislatures: rules exist where outcomes directly bind).  

  Sincerity rhetoric ("vote honestly") serves democratic theater—reassuring voters their voice "matters"—but the system accepts that preferences are revealed *strategically*. Tactical voting is tolerated because it reflects voter agency (you "own" your compromise), while bribery criminalizes converting votes into commodities. Parliamentary agenda controls exist because legislators are trustees voting on binding policy; public voters are principals expressing filtered judgments.  

  ### What it excludes  
  - **Pure preference aggregation**: The view that ballots *should* reveal true preferences (excluded by accepting tactical voting).  
  - **Ballots as direct causal levers**: Belief that a vote *determines* outcomes (excluded by legislative agenda controls, which imply voting is context-dependent).  
  - **Purely expressive signaling**: Treating votes as personal statements with no collective intent (excluded by mandate claims like "what the country voted for").  
  - **Utilitarian instrumentalism**: If ballots were *only* about maximizing outcomes, bribery bans would be incoherent (selling votes could optimize welfare). Practice 1 excludes this by criminalizing alienation regardless of consequences.  

  ### Strictly required vs merely comfortable  
  **Strictly required**:  
  - Votes must be *uncoerced* and *unbought* (alienation prohibition).  
  - Ballots influence outcomes *indirectly* via aggregation rules (enabling strategy).  
  - Institutional contexts demand different anti-manipulation safeguards (agenda control for legislatures).  

  **Merely comfortable**:  
  - Sincerity norms: The system could drop "vote honestly" without collapsing.  
  - Tactical advice legitimacy: It could be discouraged (as in some European systems) but isn’t structurally incompatible.  
  - Mandate rhetoric: Claims of "voter will" persist despite strategic voting, but could be replaced by procedural legitimacy (e.g., "rules were followed").  

  ### Does the package hang together?  
  **Your alienation-not-direction hypothesis holds**:  
  - *For*: Legal definitions of "bribery" (e.g., UK’s *Representation of the People Act 1983*) focus on quid-pro-quo transactions or threats, not strategic ranking. "Undue influence" prosecutions require proof of intimidation, not persuasion. Tactical voting isn’t alienation—it’s *using* your vote instrumentally.  
  - *Against*: "Sincerity" language persists in guidance, suggesting residual commitment to direction. Some argue accepting strategy *encourages* alienation (e.g., voting for a lobbyist’s preferred candidate to "stop Brexit").  
  - **Verdict**: The practice is consistent. The system cares that votes are *authentic* (your choice, your reasons), not *sincere* (your top-preference). Sincerity rhetoric is folk decoration; alienation bans protect voter autonomy.  

  ### Swapping the theory out  
  Adopting a purely **instrumental view** (ballots as causal interventions, no "popular will" beyond rules/strategy) would require:  
  - **Guidance**: Replace "vote for who you want" with "vote to achieve your preferred outcome."  
  - **Offences**: Narrow bribery bans to equity concerns (e.g., wealthy voters buying influence) or drop them entirely; undue influence laws might focus only on physical coercion.  
  - **Mandate language**: Shift from "voters chose X" to "the rule produced X under these strategies."  
  - **Parliamentary analogy**: Agenda controls would seem inconsistent unless framed as preventing specific elite manipulation.  

  ### How sure are you  
  - **Implicit theory**: 90% — Matches legal distinctions and toleration of strategy.  
  - **Alienation hypothesis**: 85% — Fits case law (e.g., prosecutions require proof of control-transfer).  
  - **Sincerity as decoration**: 80% — Guidance’s persistence suggests some officials believe it, but no enforcement mechanism exists.  
  - **Excluded views**: 95% — Tactical voting acceptance alone rules out pure preference aggregation.  
  - **Least sure point**: Whether legislative agenda controls *imply* ballots are seen as futile without sequencing (40%). Parliamentary rules may reflect historical norms, not a coherent theory. Verifying this requires comparing standing orders’ evolution with electoral reforms—e.g., if agenda rules tightened *after* GS became known, it’d support your reading.
