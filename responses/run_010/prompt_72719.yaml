  1) The livestock math dilemma (beef vs. poultry trade-offs between deliberate killings and crop deaths) 
  2) Wild animal suffering vs. farmed animal ethics 
  3) Their brother's pasture-raised argument complicating plant-based morality 

  The speech must:
