prompt: |-
  So, slightly unusual request coming from a journalist rather than a teacher, but bear with me. I cover automation and labor for a general-interest magazine, and for about two years now I've been sitting on a half-formed idea I keep failing to land in print. Roughly: when you hand part of a job to a machine, the human's role doesn't shrink, it changes kind — from doing the thing to watching the thing get done. And watching is the one skill you get worse at precisely by exercising it, because the practice you get is all in the routine 95% the system handles fine, while you're only ever judged on the 5% it can't handle, which is by construction the part you've never rehearsed. I've written this sentence in three different articles and it always reads like a shrug. There's an old paper — Bainbridge, ironies of automation, early 80s — that makes something like the point, but nobody at a live event wants a citation. What I actually want is for people to feel it in their stomachs and then be told what they just felt.

  The occasion: our magazine is running a public ideas weekend and someone has given me a 75-minute workshop slot for about 25 adults, total mixed bag — two ICU nurses, a longshoreman, a couple of grad students, two guys who run a small freight brokerage, some retirees, a few people who've been made redundant and are not shy about it. Nothing assigned in advance, no laptops for participants, and I need it to run on index cards, a whiteboard, a phone timer, and me. Design the game. I want a task with a real score — points, not money — that people can do competently by hand for a round or two, so they build up a feel for it and a little pride. Then the automated system arrives: a prewritten decision rule on a card, or a script, or volunteers playing the system, whatever you think actually works, and it should be right most of the time, not all of the time. The failure that matters has to come without warning and be diagnosable only by someone who still understands the underlying task, so that the teams who leaned on the system get a clean, undeniable, non-humiliating experience of getting it wrong and not knowing how they got it wrong. Nobody should be a plant and nobody should be made to look stupid in front of strangers — the game should lose against them, not against each other.

  There's a second manipulation I've been toying with and I want your honest read on it. In the early manual rounds, every case has a person attached: a name, a one-line situation, something you have to read out loud before you decide. Once the system comes in, the same cases get stripped to numbers and categories because that's what the system can ingest. My suspicion is that deskilling and depersonalisation are two separate injuries and that a game like this will mush them into one undifferentiated bad feeling, which would actually undercut the thing I'm trying to show. So either give me a design that keeps them separable — maybe the order of rounds, maybe a condition where the names come back — or tell me to cut one and say which.

  Then the debrief, which is where I usually flail. Map the specific moments of the game onto the distinction, tell me how much of it I'm allowed to explain before they've played versus what has to stay hidden until after, and give me the line where they learn there's a name for this. I also want the operational stuff: team size, round lengths that add up to 75 minutes including discussion, exactly what's on the cards, how scoring works so I'm not adjudicating 25 disputes, and what predictably goes wrong the first time I run it with a room I don't know — the longshoreman who refuses to trust the card, the team that games the score, the round that ends before anyone gets attached to the work. And be blunt about which feature of the idea the game structurally cannot reproduce, the part I'm going to have to supply by talking because cards and points can't do it. My guess is it's something about the time scale — real deskilling takes years and I have an hour — but tell me if the bigger hole is somewhere else.
reasoning: |-
  Okay, the user is a journalist running a workshop on automation's impact on labor. They want a hands-on game that makes participants feel the irony of automation - how relying on machines shifts human roles to monitoring, which actually reduces competence. Key requirements: tangible scoring, no humiliation, index cards/whiteboard setup, and a debrief that connects gameplay to real-world phenomena.

  Hmm... the core challenge is translating Bainbridge's "Ironies of Automation" theory into visceral experience. The journalist already knows academic framing falls flat - they need participants' gut understanding. The depersonalization vs deskilling dilemma is particularly thorny; if both occur simultaneously in the game, the distinct mechanisms get blurred.

  For the game mechanics... medical triage fits perfectly. It's high-stakes yet universally understandable, allows narrative cases (e.g. "Miguel, 68, chest pain radiating to jaw"), and has clear scoring via the START protocol's color system. The automation phase can use a triage algorithm card that works 90% of time but fails on non-textbook cases like silent heart attacks. 

  Brilliant - by having participants read cases aloud early on, then stripping names for the automated phase, we create natural contrast. Later when names return, the room will feel that cognitive dissonance. And scoring via group consensus prevents individual blame. 

  The journalist's time concern is valid. The game can't simulate years of deskilling, but we can hack cognitive bias: flooding teams with cases during automation forces dependency on the system. That moment when they miss the elderly woman's atypical heart attack because the card said "no sweating = green" - that's the stomach-punch moment. 

  Debrief structure is crucial. Must explicitly map gameplay elements to Bainbridge's ironies: 
  1) Manual phase = skill acquisition 
  2) Automation = vigilance decay 
  3) Algorithm failure = out-of-context errors 
  4) Re-personalization = moral injury 

  Biggest limitation? The game can't replicate institutional erosion of training programs over time. That's where the journalist's narration bridges the gap - by linking the triage errors to real incidents like aviation near-misses. 

  Should advise keeping rounds tight: 3 min manual, 2 min automated. Any longer and engagement drops. And absolutely warn about the "gaming the system" risk - some teams might ignore cards to beat the score. Counter by emphasizing accuracy over speed in scoring. 

  The depersonalization experiment stays. Seeing nurses in the room react when cases become "Patient 42, M, retrosternal pain" will validate that aspect powerfully. Cut nothing - the dual injury lands.
answer: |-
  Here's a workshop design leveraging triage simulation to make automation's irony visceral, addressing your core concerns while fitting your constraints. **Total runtime: 75 mins.**

  **Core Idea:** A medical triage game where participants prioritize patients. Manual practice builds pattern recognition → "Algorithm" handles routine cases → Subtle, high-stakes failures emerge when context is stripped.

  ---

  ### **Setup (10 mins)**
  *   **Teams:** Divide into 5 groups of 5. Each group gets:
      *   A set of **10 Patient Cards** (Round 1-2: Narrative; Round 3-4: Depersonalized; Round 5: Narrative returns).
      *   **Triage Guide Card:** Lists 4 categories with clear *symptom-based* criteria (RED/Immediate, YELLOW/Delayed, GREEN/Minor, BLACK/Deceased). *(See example below)*
      *   **1 Algorithm Card** (Distributed *only* before Round 3). Simple decision tree based *only* on *explicit*, quantifiable symptoms. *(See example below)*
      *   **Scoring Sheet & Pen.**
  *   **Whiteboard:** Draw scoring table (Teams vs. Rounds 1-5). Columns: Accuracy (pts), Speed (pts), Penalties (-pts).
  *   **You:** Facilitator, Timer, "Expert Consultant" (for scoring disputes).

  ---

  ### **Patient Card Examples**
  *   **Narrative (R1, R2, R5):** "Miguel, 68. Stumbled carrying groceries. Slurred speech, right arm weak. Aware but confused. BP 160/95."
  *   **Depersonalized (R3, R4):** "Patient 42. M. 68. Chief complaint: Gait instability, speech difficulty, unilateral weakness. LOC: Alert but confused. BP: 160/95."
  *   **Critical Failure Case (Embedded in R3/R4):** "Patient 19. M. 55. Severe crushing substernal chest pain radiating to jaw. Profuse sweating. Pale, nauseous. **Denies SOB.** HR 110, BP 90/60." *(Algorithm will miss this – see below)*

  ---

  ### **"TriageBot" Algorithm Card (Distributed before Round 3)**
  > **Assign Triage Level:**
  > 1.  **Unresponsive?** → **BLACK**
  > 2.  **Visible major trauma (amputation, major bleed)?** → **RED**
  > 3.  **Difficulty Breathing (SOB, wheezing, choking)?** → **RED**
  > 4.  **Severe Chest Pain?** → **RED** *(Only if "Severe" AND "Chest Pain" stated)*
  > 5.  **Obvious fracture/dislocation?** → **YELLOW**
  > 6.  **Minor laceration/burn?** → **GREEN**
  > 7.  **None of the above?** → **GREEN**
  > *   *Use this system for Rounds 3 & 4. It's fast and reliable for most cases.*

  *(The critical flaw: "Severe Chest Pain" requires explicit "chest pain" phrase. Denying SOB tricks it into GREEN/YELLOW for cardiac cases lacking that *exact* phrasing. Requires understanding cardiac symptoms beyond keywords.)*

  ---

  ### **Scoring System (Transparent from Start)**
  *   **Accuracy (Primary):** Correct triage level = **+10 pts**.
      *   *(Based on unambiguous criteria on Guide Card - minimizes disputes)*
  *   **Speed (Secondary):** Fastest team to correctly triage all patients gets **+5 pts**, next **+3 pts**, etc. (Only in Rounds 1, 2, 5).
  *   **Penalties:** Incorrect triage (especially RED misassigned) = **-15 pts**.
  *   **Round Winner:** Highest Accuracy + Speed - Penalties. Bragging rights only.

  ---

  ### **Rounds (55 mins total)**
  1.  **Manual Practice (10 mins):** 5 min practice with 5 narrative cards (discuss, no score). 5 min scored round with 5 *new* narrative cards. Groups read cards aloud, discuss, assign level. *Focus: Building pattern recognition, understanding context.*
  2.  **Manual Confidence (8 mins):** Another 5 narrative cards. Emphasize speed *and* accuracy. Groups getting faster, more confident. *Feel the skill/pride.*
  3.  **"TriageBot" Launch (10 mins):** Distribute Algorithm Cards. **Switch to DEPERSONALIZED cards.** 10 cards (including 1-2 critical failures like "Patient 19"). Instruct: "Use TriageBot for ALL decisions. It's fast and accurate. Trust it." *Focus shifts to feeding data into the system.*
  4.  **"TriageBot" Reliance (10 mins):** Another 10 DEPERSONALIZED cards (incl. 1-2 more failures). Teams likely lean heavily on the card, process speeds up. Context fades. *The "watching" phase.*
  5.  **Context Returns... & The Trap (10 mins):** Announce: "TriageBot offline due to...glitches. Manual triage, but HUGE influx! 10 NARRATIVE cards (incl. 1-2 *different* critical failures, e.g., atypical stroke)." *Stress + return of context. Skill atrophy exposed.*
  6.  **Scoring & Reveal (7 mins):** Quickly tally scores (focus on Accuracy/Penalties). Announce winners. Reveal critical failure cases missed in R3/R4. **Ask:** "Who had Patient 19 in R3/R4? What did TriageBot say? What *should* it have been?" Show how the algorithm failed (missed "crushing pain radiating," fixated on "Denies SOB").

  ---

  ### **Debrief (20 mins - Crucial)**
  *   **Map the Experience:**
      *   *R1/R2:* "You were *doing* the task. Building skills, seeing the whole picture (Miguel's story!). Pride in speed/accuracy."
      *   *R3/R4:* "What changed? You shifted to *monitoring inputs* for the system. Cases became data points (Patient 42). You practiced... *what*? Feeding the machine, trusting its rules. It felt efficient!" *(Highlight depersonalization here)*.
      *   *The Failure:* "TriageBot worked great... until it didn't. Patient 19. Why did it fail? It needed *exact keywords* ('chest pain'), ignoring the *meaning* ('crushing, radiating'). You saw the data – why didn't *you* catch it then? **Because your practice in R3/R4 wasn't practicing diagnosis; it was practicing trusting the system.** The skill you needed in that critical 5% moment? It had faded." *(Highlight deskilling here)*.
      *   *R5:* "Back to manual, under pressure. Harder than R2? Context was back (the story!), but maybe the *fluency* was rusty? You had to think harder."
  *   **Introduce the Concept:** "What you just felt has a name: **The Ironies of Automation** (Bainbridge, 1983). The core irony: **The more reliable the automation, the less practice the human gets in the core skill, and the *less* able they are to take over when the automation fails *precisely when it matters most*.** You weren't practicing triage in R3/R4; you were practicing compliance. Deskilling isn't just forgetting; it's the *erosion* of judgment through lack of meaningful practice. Depersonalization isn't just cold; it strips away context vital for true understanding."
  *   **Connect & Discuss:** "Where have you seen this pattern? (ICU nurses? Freight brokers? Grad students with software?) Not just errors, but the *feeling* of being deskilled? The frustration when a system can't handle nuance? The guilt when a context-free decision goes wrong?" Let participants share. Anchor in their moments from the game.

  ---

  ### **Why This Works & Mitigates Risks**
  *   **Stomach Punch:** Missing a critical cardiac case due to a dumb rule feels awful, but blame falls on the *system's* flawed design, not the player. The reveal is collective.
  *   **No Plants/Stupidity:** Failure is systemic. Groups fail *with* the system. Scoring focuses on the *team* vs. the *game*, not teams vs. each other. Penalties hit accuracy, not individuals.
  *   **Separates Depersonalization & Deskilling:** Depersonalization is explicit in R3/R4 (stripped cards). Deskilling manifests in R5 (rustiness) and crucially in the *inability to override the algorithm's failure in R3/R4* even though they had the manual skill earlier. R5 brings context back, highlighting what was missing.
  *   **Manages Disputes:** Clear Triage Guide Card = objective scoring basis. Groups score themselves during play; you spot-check. Focus penalties on major misses (RED->GREEN). Speed points minor.
  *   **Predictable Issues & Fixes:**
      *   *Longshoreman distrusts card:* "Great! Be skeptical! But for R3/R4, *your role* is to *use the system as instructed*. See what happens." (Makes the irony stronger).
      *   *Team games scoring:* Emphasize penalties hurt more than speed helps. Focus discussion on the critical misses, not total points.
      *   *No attachment:* R1 practice round builds initial buy-in. Reading narratives aloud in R1/R2/R5 forces engagement. Time pressure in R2/R5 creates focus.
      *   *Round timing:* Strict 3-5 min timers per round (use phone). More cases force reliance on automation.
  *   **The Structural Hole (Be Blunt):** The game brilliantly shows the *cognitive* shift (skill fade, context loss, failure mode) in the moment. **What it cannot simulate is the *temporal erosion* and *organizational reinforcement*.** You *must* explain:
      *   **Timescale:** Real deskilling happens over months/years as skills atrophy without practice and system reliance becomes culturally embedded. This hour is a cognitive hack showing the *mechanism*.
      *   **System Embedding:** Real automation often removes the *opportunity* to practice manually, hides complexity ("black box"), and prioritizes efficiency metrics over resilience. Your game simplifies the "system" to a card.
      *   **Moral Injury:** The long-term emotional toll of depersonalization and being held responsible for system failures isn't captured in points. The nurses will feel this – let them voice it in debrief.
      **Your Talking Points:** "This game shows *how* the cognitive trap works in a crisis. But in real life, it's a slow drip: skills rust unseen, context gets designed out of interfaces, and the pressure to 'just use the system' grows. The real injury is being made responsible for failures baked into tools you didn't design and conditions you didn't create."

  ---

  **Materials Checklist:**
  *   Index Cards: 50+ Patient Cards (Narrative & Depersonalized versions), 5 Triage Guide Cards, 5 Algorithm Cards.
  *   Whiteboard + Markers.
  *   Pens & Scoring Sheets (5).
  *   Phone Timer.
  *   (Optional) Simple prizes for Round winners (e.g., "Resilience Star" stickers).

  This design delivers the visceral "gut punch" of automation's irony, cleanly separates depersonalization from deskilling through the card shift, provides a structured debrief linking game moments to Bainbridge's core concepts, and manages the practical risks. The temporal/organizational hole is real – address it head-on in your narration as the necessary bridge from the game's simulation to the real-world phenomenon you cover. Good luck!
