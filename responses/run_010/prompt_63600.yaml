  You're a formal epistemologist who has actually worked through the logical-omniscience literature rather than just name-dropping it. Think carefully here, and brainstorm out loud a bit before you commit to any numbers — I want to see the intermediate steps, not a polished essay.

  Setup. The old evidence problem: my agent already has credence 1 in E (call it the perihelion data, doesn't matter), then along comes theory T which deductively implies E, and strict conditionalization says C(T) can't budge at all, since conditioning on something you're already certain of is a no-op. The fix I keep running into is to say the agent shouldn't re-condition on E, she should condition on the entailment claim itself — let A be "T deductively implies E" — because that's the proposition she actually learned. Call it the entailment relay.

  Arithmetically it goes through if you grant the premises. Say C(T)=0.2, C(E)=1, and we allow C(A)=0.6. Then T∧A is just T∧E, which given C(E)=1 has probability 0.2, so C(T|A) = 0.2/0.6 ≈ 0.33. Nice boost. But here's my worry, and its what I want your number on: if her credences obey the ordinary probability constraints and she's certain of E, then E logically entails A, so she should already have C(A)=1 and the relay delivers nothing. The trick only works if you let an agent hold C(E)=1 and C(A)=0.6 at the same time, i.e. if you drop logical omniscience — and then I can't see which constraints are still supposed to bind, or why 0.6 is anything other than a number you picked because it makes the answer come out right.

  So: what's your credence that the entailment-relay strategy genuinely dissolves the problem of old evidence, as opposed to relocating it into unexplained priors over logical relations? If you think that target proposition is too vague to have a clean truth value, say how you've precisified it before you answer.

  I want the decomposition, with a number and one or two lines of justification per term. Off the top of my head the terms that seem to belong, though please add/cut/relabel as you see fit:

  1. That confirmation is properly modeled as credence change at all, rather than as a static support relation between T and E given background — because if it's the latter there was never a problem to dissolve.
  2. That a non-omniscient probability calculus can be made principled: constraints that bind sometimes and not others, without being switched off ad hoc in exactly the cases where we want a boost.
  3. That the prior over claims like A can come from somewhere other than the very logical insight the agent is stipulated to lack — no regress, no smuggling.
  4. That the boosts it generates track real scientific judgement, including the bit where a precise prediction that was already known is more impressive than a vague one that was already known, and including whether the boost survives past the moment of learning.
  5. That the rival moves (Jeffrey-conditioning on E, making the background/total-evidence proposition explicit, denying anyone ever really hits exactly 1) do worse — since "dissolves" might secretly be comparative.

  Then: how they combine (say explicitly if you're treating them as independent, and if not, where the correlation is), the bottom-line number, which single term that number is most sensitive to, and what argument or piece of evidence would move you furthest.

  One more thing. My own credence is about 0.35; my supervisor's is around 0.8, he thinks once you allow partial credence in logical compounds the whole business is routine. Given your decomposition, which term are he and I most likely disagreeing about, and is there any chance we're just using "dissolve" seperately?
