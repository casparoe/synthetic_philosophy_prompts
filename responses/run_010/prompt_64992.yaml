prompt: |-
  You're an economic historian who has chaired a lot of these things and knows how to open a room without lecturing it. Write me the opening remarks for a small workshop I'm convening next month. Think carefully about the framing before you put words in my mouth — do that thinking internally, I only want the finished speech back.

  The setup. Eighteen people, two and a half days, one room: economic historians, three Sinologists, two philosophers of science who work on explanation, a couple of grad students from a development economics department who have never read any of the history, and the foundation's program officer, who is smart, is not an academic, and is honestly the person whose report decides whether we get a round two. The foundation has asked that the workshop close with a single agreed formulation of the research question — one sentence, in writing — which is either a lovely forcing device or a disaster, and I can't yet tell which. Two of the invited people have been at each other in print for a decade: one holds that the divergence is a real, datable event with real causes and that the field has been too squeamish about saying so; the other holds that the whole question is teleology in a wig, manufacturing its own explanandum by installing Britain as the default. They are seated across the table from each other and they know it.

  The topic, in the room's own words, is roughly the old Needham question wearing economic clothes: why did sustained industrial growth happen where it happened rather than somewhere else.

  Here's the part that matters to me. The philosophical difficulty has to be load-bearing in this speech, not wallpaper. What we're asking is a contrastive question, and a contrastive question isn't fully specified until you say what you're contrasting against and what you're holding fixed — and every candidate specification seems to prejudge something the weekend is supposed to decide. Say Britain and you've made the actual outcome the baseline. Say the West and you've built a unit that may never have existed as one. Ask why China didn't and you may have assumed a single Chinese trajectory that wasn't there. Set the contrast at 1800 versus 1950 and the divergence may just be a photograph of something still moving. I want the speech to say this out loud and convert it into the weekend's actual work rather than treat it as a quibble. Which means: no formulation of the question in the speech that wouldn't survive being read by the person who thinks the question is a trap. Either offer a specification that is genuinely neutral between the two camps, or admit in public that you're offering a contested one and name what it costs.

  Constraints, please honour all of them:

  - Include exactly one house rule for the weekend, crisp enough that people will actually repeat it back at me on day two. My draft is that nobody may assert a why-P-rather-than-Q claim without first naming the contrast class and saying what they're holding fixed. Improve it or replace it if you have something better.
  - Run the swap test out loud at least once: put the two relata the other way round and show the room what changes and what stubbornly doesn't.
  - One moment of lightness that lands for the program officer and the grad students, not only for the historians.
  - Address the foundation's one-sentence deliverable head on, and give the room a route to succeeding at it even if what they succeed at is agreeing that no single formulation is neutral. Don't be defeatist about that, don't be naive about it either.
  - Nothing in it can be read as taking my side in the feud, but it also can't be so scrupulously even-handed that it's anaesthetic — I'd rather be accused of a slight tilt than be watched reading out a truce.
  - No citations, no named scholars, no book list. The room knows the literature; I don't want to spend eight minutes reciting it.
  - Eight minutes spoken aloud, no slides. End on something the grad students can act on Monday morning, not on an uplift paragraph.

  Oh, and adress the philosophers without making the historians feel like the audience is being taught how to think — that's the room's sore point.

  Start your response with the speech itself. No preface, no title, no postscript explaining your choices, no restatement of what I asked for. I'll spot the reasoning in the text.
reasoning: |-
  Okay, the user wants me to write opening remarks for an economic history workshop. They've provided detailed context: 18 participants including economic historians, Sinologists, philosophers of science, development economics grad students, and a foundation program officer. There's tension between two scholars debating whether the "Great Divergence" is real or teleological. The core challenge is framing the Needham question ("why industrial growth happened where it did") without prejudging answers.

  I need to address several key requirements. The philosophical difficulty about contrastive questions must be central, not superficial. I must include exactly one memorable house rule - probably improving their draft about requiring explicit contrast classes. The speech needs a swap test demonstration (reversing relata), one moment of lightness accessible to non-historians, and direct engagement with the foundation's demand for a one-sentence research question. I can't take sides in the feud but can't be bland either. No citations or scholarly names. Keep it to 8 minutes spoken aloud, ending with actionable advice for grad students. Crucially, I must respect historians' expertise while involving philosophers meaningfully.

  For the house rule, I'll refine their draft to: "When you offer a why-P-rather-than-Q explanation, first state your Q and what you're holding constant." This is crisper and more actionable. The swap test will show how reversing "Britain vs China" versus "China vs Britain" changes the causal story but reveals persistent assumptions. For lightness, I'll use the "wig" metaphor self-deprecatingly. On the one-sentence deliverable, I'll frame success as either producing a genuinely neutral question or explicitly documenting its contested elements - making either outcome valuable. To avoid taking sides, I'll present both perspectives as structurally necessary tensions in the field.

  The grad students' takeaway will be concrete: to start mapping their assumptions about units, baselines and chronologies before Monday. The tone should be collegial but intellectually rigorous, opening space for productive disagreement. I'll structure it to: 1) Acknowledge tensions immediately; 2) Frame the core philosophical challenge; 3) Introduce house rule + swap test; 4) Address foundation's deliverable; 5) End with grad student action point - all in 8 minutes.
answer: |-
  Good morning. Before we begin—truly begin—we have to acknowledge the elephant, and the wig it may or may not be wearing. We’re here to wrestle with one of the biggest, most persistent, and frankly, most treacherous questions in our corner of the world: why did sustained industrial growth emerge where it did, and not elsewhere? Or, as some might frame it with a slightly different emphasis, why *didn't* it emerge elsewhere when it did here?

  This isn’t just a big question; it’s a *contrastive* question. And that ‘rather than’ is where the philosophical gears start grinding. Because the moment we ask "Why P rather than Q?", we’ve smuggled in a whole world of assumptions. What exactly is our Q? What do we hold constant? What’s the unit of analysis? Where do we draw the temporal boundaries? Is the baseline the actual outcome, or a counterfactual possibility? Every choice we make here – naming the ‘here’, defining the ‘elsewhere’, setting the ‘when’ – doesn't just *shape* the possible answers; it fundamentally *creates* the question we’re asking. And different choices create dramatically different questions, some of which might look like traps from certain angles.

  That’s not a quibble. That’s the core of our work for the next two and a half days. It’s the work of specification. Our task isn't to avoid this difficulty; it’s to make it explicit, to grapple with it directly. To see what different specifications reveal and conceal.

  **So, one house rule:** If you offer a why-P-rather-than-Q explanation, first state your Q – your specific contrast class – *and* state what you are holding fixed. Be explicit. This isn’t pedantry; it’s intellectual hygiene. It lets us see what you’re actually explaining and what you’re taking as given.

  Let me try a quick swap test. Instead of "Why Britain/Europe and not China?", flip it: "Why China and not Britain/Europe?" What happens? The causal spotlight shifts dramatically – suddenly, state capacity, resource management, or different institutional priorities might leap to the forefront as explanations for why China *didn’t* follow a path it never necessarily aimed for. But notice what stubbornly remains? The underlying assumption of a single path, a single destination, and the units we’ve chosen – ‘Britain/Europe’ and ‘China’ – as coherent, comparable wholes at that specific moment. The swap reveals how deeply embedded our baseline assumptions are, even when we reverse the explanandum.

  [Lightness Moment] Now, I know we have some newer faces here, including sharp minds from development economics who might be wondering if they’ve accidentally wandered into a philosophy seminar disguised as history. And our observant program officer is likely thinking, "Eighteen academics, two and a half days, and they want *one sentence*?" Believe me, I feel that tension too. But here’s the thing: this specificity struggle isn’t academic navel-gazing. It’s the difference between asking "Why did *my* carefully built house collapse?" versus "Why did *that specific house* collapse while *these other structures* on the same fault line, built with different materials, didn’t?" Getting the question right is the foundation. Without it, the answers won’t hold up. So, welcome to the foundation inspection. Your critical eyes are essential.

  Which brings us to the foundation’s request: that we conclude with a single, agreed-upon formulation of the research question. One sentence. I know. The potential for disaster looms. But success isn't necessarily synonymous with bland consensus or pretending deep disagreements vanish. Success can also look like this: *producing a sentence that explicitly acknowledges its own necessary choices and contestations.* A sentence that doesn't hide its specification but declares it. Or, perhaps, a sentence that captures the *minimal* common ground of what we are trying to understand, leaving the specifications open for debate. Our goal is to craft something honest, something robust enough to bear the weight of our very different perspectives, not to paper over them. If we can articulate *what* is contested within the question itself, that’s a significant achievement. It transforms the deliverable from a potential straitjacket into a clear statement of the terrain we’ve mapped.

  So, let’s begin. Let’s be rigorous about our specifications. Challenge each other’s Qs and fixed points. Probe the units, the baselines, the chronologies. That *is* the work. And to our graduate students: your fresh perspective is vital. Your homework, starting now, is to listen for these choices – the Qs and the fixed points – in every argument you hear. Start mapping them. That’s your actionable takeaway for Monday morning. Let’s get to it.
