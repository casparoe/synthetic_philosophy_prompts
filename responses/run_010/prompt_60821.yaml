  Biggest trap to avoid: letting the iterative prisoner's dilemma explanation (which they've clearly studied) swallow the moral analysis whole. The user wants the moral theories strained against the empirical reality, especially where they fail. The "return to killing for four years" point is brutal for revisionism - if Germans knew their cause was unjust, why fight on? 

