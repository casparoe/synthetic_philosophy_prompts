prompt: |-
  Below is a draft section of an essay I am writing on advance directives, roughly as it currently stands. I would like substantive comments, not copy-editing.

  > **Draft: The Directive as Promise, Not as Self-Government**
  >
  > The standard defence of the advance directive is autonomy-based. Dworkin's version appeals to critical interests: the reflective judgments a person makes about what makes a life as a whole good are said to retain authority over the merely experiential satisfactions available to that person later, even after dementia has destroyed the capacities that produced those judgments. The best-interests objection, pressed most persistently by critics such as Rebecca Dresser, replies that once the earlier psychological subject is gone, the only morally salient facts are about the welfare of the person now in the bed — her contentment, her absence of distress, her present protestations.
  >
  > I want to argue that both sides are fighting over the wrong question. They assume the directive's force, if it has any, must derive from the patient: either from a self that persists, or from a self that has been replaced. But the directive is not an exercise of continuing self-government at all. It is a promise made to identifiable other people — a spouse, an adult child, a named surrogate — and its binding character comes from their reliance, not from the promisor's persistence.
  >
  > This explains two things the autonomy account cannot. First, it explains why boilerplate directives, signed alone in a solicitor's office and never discussed, intuitively carry little weight: no one relied on them. Second, it explains why a directive argued over at kitchen-table length with a specific person carries a great deal: someone has organised her expectations, her own plans, and her self-understanding around it.
  >
  > The view also yields a threshold that is neither identity-based nor pure best-interests. A demented patient who retains the capacities required to release someone from a promise can release the directive, and her present wishes then govern. A patient who does not retain those capacities cannot, and her distress, however real, does not by itself dissolve an obligation owed to a third party.

  Three things I want you to weigh in on. First, does the promissory reconstruction actually escape the best-interests objection, or does it collapse back into that objection once reliance is cashed out — since the surrogate's distress at breaking faith is itself a present interest, just located in a different person? Second, the view makes a directive's authority a function of how much reliance it has generated, which seems to imply that a solitary patient with no one relying on her is unprotected, and that a manipulative earlier self can inflate his own posthumous authority by manufacturing reliance. Are these objections I can absorb, or do they force me to abandon the proportionality claim? Third, is the release clause coherent: can someone who lacks the capacities for autonomous decision-making nevertheless retain the narrower capacity to let another person off a promise?

  Please take a definite position rather than surveying the field. Tell me which of the three problems is the most serious, whether the view is salvageable as it stands or requires replacing the reliance-based account with something else, and — if you think it is salvageable — commit to the single best repair, with reasons for preferring it to the alternatives you considered. If you think the whole promissory framing should be abandoned in favour of a straightforwardly welfare-based account, say so plainly and say what my draft's two explanatory advantages then become.
reasoning: |-
  Okay, the user is working on an essay about advance directives and has shared a draft section. The draft argues against the standard autonomy-based defense (like Dworkin's) and the best-interests objection (like Dresser's), proposing instead that advance directives should be seen as promises to specific individuals, with binding force coming from the surrogate's reliance.

  The user raises three specific concerns about this promissory approach:
  1. Whether it truly escapes the best-interests objection or just relocates it to the surrogate's distress
  2. Whether making authority depend on reliance leaves solitary patients unprotected and enables manipulation
  3. Whether a dementia patient can meaningfully "release" someone from a promise without full decision-making capacity

  The user wants me to take a definite position on these issues rather than surveying options. I need to evaluate which problem is most serious, whether the view can be salvaged, and what the best repair would be - or if the whole approach should be abandoned.

  First, considering the three problems:
  - Problem 1 (relocated best-interests) seems the most fundamental because if the promissory framework just shifts welfare considerations to the surrogate, it hasn't really moved beyond the welfare paradigm it tries to reject. This threatens the core thesis.
  - Problem 2 (solitary patients and manipulation) is serious but may allow for adjustments in how reliance is conceptualized.
  - Problem 3 (release capacity) is important but seems more technical - perhaps resolvable through clearer definitions.

  The promissory framework has strong explanatory power regarding why discussed directives feel weightier than boilerplate ones - this insight seems worth preserving. So I lean toward salvaging it rather than abandoning it entirely.

  For the most critical problem (relocated best-interests), I think the key repair is to reframe reliance as generating a distinct deontological obligation rather than just another welfare interest. This maintains the promise's distinct moral character without collapsing into welfarism. I can ground this in Scanlon-style promise-keeping principles.

  For the other problems:
  - Solitary patients could be addressed by recognizing that a promise to oneself or society might create weaker obligations - and that's actually intuitive (undiscussed directives do feel less binding).
  - Manipulation concerns can be mitigated by requiring good-faith reliance and the surrogate's ongoing endorsement.
  - The release clause can stand if we define the required capacity narrowly - merely understanding that "you no longer have to do X for me" rather than full autonomy.

  The draft's core insight - that directives gain force through relational context - is valuable and shouldn't be discarded. With these refinements, the promissory framework can withstand the objections while preserving its explanatory advantages over pure autonomy or best-interests models.
answer: |-
  Here is my substantive assessment of your promissory account and your three concerns, taking definite positions:

  ### 1. **The most serious problem is the first: Your promissory framework collapses back into a best-interests model.**  
     - **Why:** When you ground the directive’s authority in the *surrogate’s reliance*, you make the obligation contingent on the surrogate’s psychological state (their distress if the promise is broken). But this turns the surrogate’s welfare into the ultimate moral arbiter. Dresser’s objection isn’t about *whose* welfare matters—it’s that welfare (experiential interests) is the only morally relevant factor once dementia erases prior autonomy. By shifting reliance to the surrogate’s welfare, you concede the core premise of the best-interests objection: that obligations dissolve if they conflict with *someone’s* present suffering. You haven’t escaped welfarism; you’ve relocated it.  
     - **Verdict:** This undermines your entire reconstruction. If breaking a promise only matters because it causes surrogate distress, the directive lacks intrinsic moral force.  

  ### 2. **Your view is salvageable but requires replacing "reliance" with a deontological commitment.**  
     - **Repair:** Recharacterize the directive as a **commitment to a shared moral project**, not a promise generating reliance. The "promise" isn’t primarily about the surrogate’s expectations but about co-authoring a narrative of integrity (e.g., "We agreed to uphold dignity through decline"). Obligations arise from the *joint undertaking itself*, not the surrogate’s distress if abandoned.  
     - **Why this repair?**  
       - **Solves Problem 1:** Obligations stem from fidelity to the joint project, not welfare. Breaking it wrongs the surrogate by betraying their role as co-participant—even if they feel no distress. This is deontological (duty-based), not welfarist.  
       - **Solves Problem 2 (solitary patients/manipulation):**  
         - *Solitary patients:* A directive can still bind as a commitment to a *principle* (e.g., "no life-prolonging care if unconscious") or to societal values (e.g., stewardship of resources). Its weight comes from its alignment with shared norms, not personal reliance.  
         - *Manipulation:* Manufacturing reliance loses force. What matters is whether the joint project was authentic (e.g., based on mutual respect, not coercion). A manipulator’s "promise" lacks moral legitimacy because it corrupts the shared undertaking.  
       - **Retains your draft’s advantages:**  
         - *Boilerplate directives:* Still weak—they lack a shared narrative or intentional joint project.  
         - *Kitchen-table directives:* Strong—they embody a concrete, co-created commitment.  

  ### 3. **The "release clause" is coherent but needs refinement.**  
     - **Position:** A dementia patient *can* retain capacity to release a surrogate *if* we define capacity contextually.  
     - **Refinement:** The capacity required isn’t full autonomy (e.g., understanding complex medical choices) but understanding the *relationship* ("This person promised to do X for me, and I’m telling them they don’t have to"). Even moderate dementia patients often grasp such concrete relational facts.  
     - **Why it works:** Releasing a promise doesn’t require weighing future outcomes—only recognizing trust and expressing permission. This is less cognitively demanding than self-governance.  

  ### Overall Verdict & Recommendations  
  - **Most serious threat:** Problem 1 (welfarist collapse). It forces you to abandon reliance as your foundation.  
  - **Salvageable?** **Yes**, but only by replacing reliance with **joint-commitment to a shared project**.  
  - **Best repair:** Adopt Margaret Gilbert’s or Scanlon’s model of promissory obligations as creating mutual, non-reliance-based duties.  
    - **Key revision to your draft:**  
      > *"The directive is not an exercise of self-government, nor a promise resting on reliance. It is a joint commitment with a surrogate to honor a shared value (e.g., ‘no prolonged dying’). Its force comes from the duty to uphold co-created obligations, which persists even if the surrogate feels no distress or the patient loses her past self."*  

  - **Why not abandon the promissory frame?** Your draft’s two explanatory advantages—  
    1. Explaining why boilerplate directives feel weightless,  
    2. Explaining why kitchen-table directives feel binding—  
    **lose their specificity** under pure welfare. Welfare accounts can only say boilerplate directives are "less informed," not morally inert. They cannot capture why relational depth matters more than correctness. Your core insight—that directives derive force from *interpersonal bonds*—is profound and worth defending. A joint-commitment model preserves this while avoiding welfarist collapse.  

  **Final stance:** Revise your promissory account into a **joint-commitment framework**. This solves all three problems, retains your explanatory power, and resists Dresser’s best-interests reductionism. Abandoning the promissory structure would sacrifice your most original contribution.
