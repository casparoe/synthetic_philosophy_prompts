prompt: |-
  I cover science and ideas for a magazine — mostly biology, some tech — and I've been going around in circles on a piece about what a genome actually is. Not the "book of life" stuff. The practice side.

  Here's what's bugging me. The companies that print custom DNA to order — a lab emails them a few thousand As, Cs, Gs and Ts and gets back a vial — screen orders before they make them. The string gets run against databases of sequences from known pathogens and known toxins, and if it hits above some threshold the order gets flagged, held, or refused, and there's paperwork and customer verification behind it. This is now a pretty standard industry arrangement, with government guidance pushing it along. Meanwhile the same field tells you, constantly and correctly, that a sequence on its own doesn't do anything: what a gene does depends on where it sits, what's upstream and downstream, the cell type, the organism, the environment, the epigenetic marks, the whole developmental context. And everyone agrees you can't build a virus out of a text file — labs have gotten infectious virus out of DNA assembled from ordered synthetic pieces with no natural template, but that took a real laboratory, cell machinery, and years of tacit skill, and the string was maybe a third of the work.

  So what picture of DNA does the screening practice actually presuppose? I want the implicit theory reconstructed, not an opinion on whether the policy is too strict or too loose — I've got no interest in the policy debate and my editor has even less. Specifically:

  - What has to be true about sequences for "does this string match a known bad string" to be a meaningful test of how dangerous an order is? What notion of information is doing the work — is the sequence being treated as a blueprint, a recipe, a code, an identifier, a causal trigger, or some inconsistent blend? Pick apart which of those the machinery actually needs versus which it just borrows language from.
  - Which rival pictures of what a genome is does this quietly rule out? And which rival pictures is it compatible with even though nobody operating the system would admit it out loud?
  - Is the practice internally consistent, given that the people who build the pathogen databases and the people who write the screening rules broadly accept that context determines what a sequence does? If there's a real tension, say which belief has to give, and whether it's a tension inside the practice or just between the practice and the field's official self-description.
  - Where is the thing underdetermined — where would two people with genuinely opposed theories of genetic information end up endorsing the exact same screening protocol, for different reasons? I want to know which parts of the setup carry philosophical weight and which parts are just cheap insurance that anyone would buy.
  - And if the field swapped the string-picture for the context-picture, what would screening have to look like instead? Concretely: what would you screen for, if not the sequence? Don't just say "capability" — tell me what the artifact under scrutiny would be.

  Two caveats. First, I know there's a long-running argument in philosophy of biology about whether "genetic information" is a real technical notion, a useful metaphor, or a category mistake, and I'm deliberately not asking for a survey of it or a reading list — I can't check sources anyway and I don't want guessed-at titles. Bring in that argument only at the points where it changes the answer about the practice. Second, if I've got any of the mechanics wrong above — the thresholds, who screens what, how far sequence-only construction actually gets you — say so plainly at the top rather than quietly working around it.

  Format: work through the five bullets in order, keep it tight, and don't spend a paragraph on background I've already given you. Then end with a single last line in exactly this form:

  Verdict: <label>

  where the label is one of three, with nothing after it — NECESSARY (screening only makes sense if the sequence is close to self-sufficient), FITS-BUT-NOT-REQUIRED (the sequence picture is the natural story but weaker views license the same protocol), or INCOHERENT (the practice's presuppositions contradict each other and something has to give).
reasoning: |-
  Alright, let's tackle this query step by step. The user is a science writer focused on biology and tech, working on a piece about what a genome really is from a practical standpoint. They're stuck on the tension between synthetic DNA screening practices and the field's emphasis on genomic context. 

  First, I need to dissect the screening protocols. Companies check DNA orders against pathogen databases, implying sequences have intrinsic meaning. But biologists stress that function depends on context. The user wants the implicit theory behind screening, not policy debates. They provided five specific bullets to address.

  Starting with bullet one: What notion of information is at play? Screening treats sequences as identifiers or triggers, borrowing blueprint language but only needing pathogen-matching functionality. It's not about inherent causal power but detectability of known threats. The practice relies on sequences being unique markers for dangerous agents, regardless of actual biological context in the ordered string.

  For bullet two: Which genomic views does this rule out? Strong contextualism (where sequence alone means nothing) is incompatible, while blueprint views fit neatly. But it's compatible with weak contextualism—sequences as necessary but not sufficient—even if practitioners wouldn't admit it. Screening secretly allows that context matters, but banks on known dangerous sequences being risky regardless.

  Bullet three: Is there internal consistency? Yes, because screeners focus only on reconstruction of known pathogens. The tension exists but is managed by limiting screening to exact matches of evolved threats. It's a practical compromise: treating sequences as self-contained for detection while acknowledging context in other domains.

  Bullet four: Where is it underdetermined? Both strong reductionists and weak contextualists could support screening. The former sees sequences as fully potent, the latter as reliable proxies. The policy stays the same, but the philosophical justification differs. Screening thresholds and database reliance are the flexible parts.

  Bullet five: What would context-based screening look like? Instead of sequences, screen for functional capabilities (e.g., toxicity assays) or delivery mechanisms. But this is impractical. The artifact would shift from strings to phenotypic outputs or chassis specifications, requiring wet-lab verification pre-shipment—something industry would resist.

  Finally, the verdict: FITS-BUT-NOT-REQUIRED. Screening uses the sequence-as-blueprint model because it's practical, but weaker contextualist views can justify it too. The practice doesn't necessitate genetic reductionism; it just exploits sequences as stable markers for known threats.
answer: |-
  Here’s a reconstruction of the implicit theory behind synthetic DNA screening, addressing your bullets in order:

  1.  **The Presupposed Picture & Notion of Information:** Screening treats DNA sequences primarily as **unique identifiers** and **causal triggers** for *known, evolved biological agents*. It presupposes:
      *   **Identifier:** A specific string is a reliable marker for a specific, dangerous biological entity (e.g., a toxin gene, a viral genome). Matching the string identifies the *intent* or *potential* to reconstruct that entity.
      *   **Causal Trigger:** Possessing the exact string is a necessary (though not sufficient) step to *cause* the harmful function *if* inserted into a suitable context (e.g., a competent lab). The sequence is treated as the critical, non-negotiable component.
      *   **Blueprint (Borrowed Language):** While screening doesn't require the sequence to be a *sufficient* blueprint for autonomous function (acknowledging context is needed), it relies on the *language* of blueprints for its database logic. Matching the "plan" flags the risk.
      *   **What it Needs:** The machinery *only* needs the sequence to be a unique identifier for a known threat and a necessary causal component for its reconstruction. It doesn't require the sequence to be self-sufficient.

  2.  **Rival Pictures Ruled Out & Compatible:**
      *   **Ruled Out:** Strong **Developmental Systems Theory (DST)** or radical **contextualism**, where the sequence itself has *no inherent causal primacy or informational specificity* outside the entire developmental system. Screening fundamentally relies on sequences having specific, identifiable causal powers *attached to them*.
      *   **Compatible (but unspoken):** **Weak Contextualism / Sequence + Necessary Context:** The practice *is* compatible with the view that while the sequence is necessary and carries specific information, the *realization* of its dangerous function is absolutely context-dependent. Screeners know the string alone isn't dangerous; the risk comes from the *combination* of string + recipient capability + intent. They screen the string as a proxy for this risk because it's the tangible, screenable part.

  3.  **Internal Consistency:** The practice **is internally consistent** *within its narrow scope*.
      *   **Resolution:** The tension between sequence-focus and context-dependence is resolved by limiting screening to **reconstruction of known, evolved pathogens/toxins**. For these, the *evolved sequence* is the non-negotiable core. The field accepts context matters for *function*, but screening targets *possession of the key component needed for reconstruction*. The belief that "context determines function" doesn't contradict this, as screening isn't claiming the *ordered string* is functional; it's claiming possession enables a *competent actor* to make it functional. The "tacit skill" you mention is implicitly part of the risk assessment flagged by the sequence match. The tension lies more between the practice and *oversimplified public narratives* of genomics than within the practice itself.

  4.  **Underdetermination:** The protocol is underdetermined regarding:
      *   **The Nature of Genetic Information:** A **strong reductionist** (sequence as sufficient blueprint) and a **pragmatic weak contextualist** (sequence as necessary, specific component requiring context) could both endorse identical screening. The reductionist sees the match as inherently dangerous; the contextualist sees it as a reliable proxy for reconstructible danger given lab capabilities. Both agree on the *action* (screen this string).
      *   **The Threshold/Specificity:** The choice of matching thresholds (e.g., 100%? 200bp?) is a pragmatic risk-management decision, not dictated by a specific theory of information. It's "cheap insurance" balancing risk tolerance and practicality.

  5. **Alternative Screening Under a Context-Picture:** If context were paramount, screening couldn't primarily focus on the *sequence string*. Instead, it would scrutinize:
      *   **The Artifact:** The **functional genetic construct + delivery system + intended chassis**. Screening would require evidence of the *actual functional output* or *validated lack of harmful function* in the context of the intended host organism/cell type.
      *   **Concrete Screening Methods:**
          *   **Functional Assays:** Requiring customers to provide data (or the screening entity performing tests) showing the construct lacks toxicity, pathogenicity, or undesired gain-of-function *in the intended host system* before synthesis/shipment.
          *   **Chassis Restriction:** Mandating the sequence only works in specific, non-pathogenic, contained chassis (e.g., auxotrophic strains, non-mammalian cells) and verifying the recipient has only that chassis.
          *   **Delivery Mechanism Scrutiny:** Screening the vectors/plasmids for features enabling integration, mobilization, or expression in unintended hosts.
          *   **De Novo Design Review:** For novel sequences, intensive computational *and experimental* assessment of potential interactions and functions in various biological contexts.
      *   **Challenge:** This shifts scrutiny from an easily automated string match to complex, case-by-case functional biology assessments – vastly more expensive, slower, and subjective. The "artifact" is no longer just a string, but a predicted biological behavior.

  **Verdict: FITS-BUT-NOT-REQUIRED**
