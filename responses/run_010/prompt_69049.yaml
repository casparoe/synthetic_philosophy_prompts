prompt: |-
  Okay so I spent like three hours last night arguing with a friend — population geneticist, insufferable about it — over whether "function" in molecular biology has to mean selected effect, and I came out the other side convinced I can make my case in public. Which is a problem, because I'm giving a 25 minute talk in six weeks and the room is not friendly in the way I'd planned for.

  The workshop is on genome annotation. Roughly: a dozen people who curate Gene Ontology annotations for a living, a couple of computational biologists who do homology-based transfer, three philosophers of biology (two of them real teleosemantics people who will hate me on principle), and at least one person who was in the room for the 2012 ENCODE mess, where the consortium announced ~80% of the genome had a 'biochemical function' and got absolutely torn apart by the evolutionary crowd for conflating activity with function.

  My thesis, sketch only: function talk at the molecular level is licensed *exclusively* by causal-role evidence, and this isn't the usual pluralist shrug about both accounts having their place — it's an epistemic claim about what could possibly support what. My argument is from the evidence-code vocabulary GO actually uses. IDA, IMP, IEP, the high-throughput versions: all of these are causal-role support, you show what the thing does in some system. There is no code for "selection shaped this activity," and there couldn't be one, because the comparative stuff — conservation scores, dN/dS, the IBA/IBD annotations that come off the phylogenetic trees — licenses claims about a *sequence lineage*, not about an activity being a selected effect. A term can be conserved across a tree for reasons that have nothing to do with fitness contribution. So etiological ascription is systematically underdetermined at molecular scale, and better phylogenetics doesn't fix it. Then my positive move: functions are two-place, always relative to a specified background system (cell type, condition), and that's what ENCODE actually got wrong — not that activity is too weak a basis for function, but that they never pinned down the background.

  Give me the Q&A prep sheet. Six objections I'll actually get from *this* room, ordered by how much damage they'd do, each phrased in the vocabulary of whoever would raise it — a curator is going to say something like "fine, but what do I put in the annotation," which is a completely different question than the teleosemanticist's, and I want to hear the difference. For each: a reply I can deliver in under two minutes, and an honest note on where that reply is soft. Then tell me what to concede in my first two minutes to buy goodwill, and the single reply that has to land or the whole talk collapses.

  And the question I'm hoping nobody asks — name it, and tell me whether I should pre-empt it or genuinely hope.

  I want you committed here, not diplomatic. Pick which objection you think actually beats me if I fumble the reply, and say whether I should soften the thesis before I walk in. If you think the evidence-code argument is overclaiming somewhere, say where. No hedging, no menu of options for me to choose from, and no references or reading list — I know the literature and you'd just be guessing at it. Hard cap: 700 words.
reasoning: |-
  Okay, the user is prepping for a high-stakes talk on genome annotation, specifically arguing that molecular function should be defined solely by causal-role evidence, not selected effects. They've outlined their thesis clearly: function claims come from experimental evidence like IDA/IMP in GO, while evolutionary data (like conservation) only speaks to sequence lineage, not actual function. They want sharp Q&A prep for a hostile audience—curators, computational biologists, teleosemantic philosophers, and ENCODE veterans.

  Hmm, the audience composition is critical here. Curators care about practical annotation, philosophers will attack theoretical foundations, and ENCODE survivors are sensitive to overclaims. The user’s strongest card is GO’s own evidence codes—they literally have no "selection" code, which is a killer point. But the weak spot is conflating "no current evidence code" with "impossible to infer function from evolution," which phylogenetics people might shred if pushed.  

  For Q&A, I’ll prioritize six objections by damage level:  
  1. **The curator’s pragmatism** ("What do I annotate then?"): Reply by saying GO already *is* causal-role based—conservation just suggests where to look. Softness: Doesn’t resolve if conservation *should* imply function.  
  2. **Teleosemanticist’s trap** ("But selected effect *is* function!"): Slam back that molecular activities precede selection—CR is ontologically prior. Softness: Hand-wavy on "precedes."  
  3. **ENCODE veteran’s PTSD** ("This justifies 2012’s 80%!"): Distinguish ENCODE’s vagueness from rigorous CR-as-function. Softness: Still feels like backtracking.  
  4. **Phylogenetics jab** ("Conservation *is* a proxy for function!"): Grant it’s a heuristic but stress it fails for exaptations. Softness: Heuristics work often enough.  
  5. **Evo-devo counter** ("CR ignores constraint!"): Separate "why it exists" from "what it does." Softness: Constraints matter for plausibility.  
  6. **System collapse** ("Background relativity kills generalization!"): Argue context-dependency is biological reality. Softness: Annotators hate this.  

  **Biggest threat**: The phylogenetics objection (#4). If someone like the population geneticist friend shows how conservation + synteny + knockout data *reliably* infers selected function, the "underdetermined" claim crumbles. Reply must hammer home deep homology pitfalls.  

  **Preemptive concession**: Open by agreeing that selected effects explain *why* a function persists—just not what it *is*. Buys goodwill with etiological folks.  

  **Land-or-die reply**: The "two-place function" move. If the background relativity point doesn’t stick, ENCODE comparisons will sink the talk.  

  **Dreaded question**: "If selected effect doesn’t determine function, why do we use conservation to prioritize disease variants?" Should preempt this—it’s a minefield linking evolution to medicine.  

  **Verbatim softens?** No—they asked for commitment. But I’d flag that "systematically underdetermined" is slightly hyperbolic; better to say "often insufficient alone."  

  **Final prep**: Drill the phylogenetics rebuttal. One fumble there = disaster.
answer: |-
  Here's your Q&A battle plan, stripped for combat. Ordered by damage potential, with replies designed for the attacker's language. I commit: your thesis is defensible but brittle at the phylogenetics hinge.

  ---

  **1. Objection (Curator, pragmatic):** *"If we can't infer function from conservation, how do I annotate non-model organisms? Homology transfer via IBA/IBD is 90% of our work. Are you telling me to stop?"*  
  **Reply:** "No—IBA/IBD licenses *activity prediction* based on shared mechanism. It doesn't license claiming 'selected effect.' Your annotations are correct as probabilistic CR claims ('ortholog X likely performs Y in organism Z, based on shared causal structure'). Just avoid asserting 'evolutionary function.'"  
  **Soft spot:** Blurs prediction strength. If conservation is weak evidence for *any* function, your "probabilistic" dodge collapses.  

  **2. Objection (Teleosemanticist, venomous):** *"You reduce function to mere causal contribution. But selected effect is constitutive: a function *is* what it was selected for. Your 'activities' are epiphenomena without history."*  
  **Reply:** "Respectfully, that conflates ontology with epistemology. At molecular scale, we *observe* activities first. Selected effect is a *retrospective explanation* for persistence, not an observable property. CR evidence is what lets us say *what* was even selected."  
  **Soft spot:** Assumes CR is "prior" to selection. If they argue selection *defines* the function type (e.g., "TEs aren't functional"), you bleed.  

  **3. Objection (ENCODE Veteran, scornful):** *"This is ENCODE 2012 reheated! You're calling every blip of activity 'function'—just like they did with biochemical noise."*  
  **Reply:** "ENCODE's error wasn't using CR evidence—it was *failing to specify the background system*. My thesis requires stating the context (e.g., 'function in hypoxia'). Noise is activity without contextual relevance. CR isn't the problem; vagueness is."  
  **Soft spot:** "Relevance" smuggles in normativity. What makes a context "relevant" if not fitness?  

  **4. Objection (Phylogeneticist, icy):** *"Nonsense. Conservation *is* evidence of selection. High dN/dS in a stable fold implies purifying selection on function. Your 'underdetermined' claim ignores decades of comparative biology."*  
  **Reply:** "Conservation evidences selection *on the sequence*. Not the *specific activity* being functional. A conserved enzyme could have its current activity fixed by structural constraint while its ancestral function decayed. Phylogeny shows *that* selection acted—not *what for*."  
  **Soft spot:** This is your thesis' weak joint. If they cite deep homology (e.g., Hox genes), where conservation + synteny + CR align perfectly, "underdetermined" looks shaky.  

  **5. Objection (Evo-Devo Type, annoyed):** *"CR ignores constraint. A protein's 'activity' might be physically inevitable (e.g., hydrophobic binding). Calling that 'function' without selection is like calling gravity a 'function' of mass."*  
  **Reply:** "Constraint isn't selection. If the activity is inevitable given physics, it *still* has a causal role in systems. Annotations describe what molecules *do* in biology—not why they're possible. Your gravity analogy confuses law with biological interaction."  
  **Soft spot:** Distinguishing "biological" CR from physical inevitability is messy.  

  **6. Objection (Systems Biologist, weary):** *"Relativity kills utility. If function is always context-dependent, how do I generalize? A kinase 'function' varies by cell type. Do I annotate 10,000 isoforms?"*  
  **Reply:** "Generalization is *descriptive*, not ontological. GO already handles this with cellular component and process context. Yes, annotate isoforms separately where evidence differs. Precision over platitudes."  
  **Soft spot:** Annotators will hate this. Costs explode.  

  ---

  **Concession to buy goodwill (First 2 minutes):**  
  *"I concede: selected effects explain why a function persists. My claim isn't that selection is irrelevant, but that it's not the *grounds* for asserting molecular function. CR evidence is what we *see*; selection is the *why*."*  
  → Wins philosophers (acknowledges etiology) and evo-types (grudgingly).  

  **Land-or-die reply (Phylogenetics objection #4):**  
  If you lose here, the thesis implodes. Reply: *"Even perfect conservation only shows selection *on the sequence*. It doesn't tell you if the current activity is the target, a byproduct, or an exaptation. CR evidence—knockout phenotypes, assays—tells you *what* it does *now* in a context. Phylogenetics can't cross that gap alone."*  

  **The question you hope nobody asks:**  
  *"If selected effect doesn't determine function, why do we use conservation to prioritize disease variants in clinics? Isn't that *relying* on etiological reasoning?"*  
  → **Preempt it.** Slot in: *"Some argue conservation guides variant interpretation. But note: we still require *functional assays* to validate pathogenicity. Conservation flags candidates; CR confirms mechanism."*  
  → Why preempt? Clinicians in the room will weaponize this.  

  **Where you overclaim:**  
  Saying etiological ascription is *systematically* underdetermined is too strong. Deeply conserved genes with congruent CR data (e.g., ribosomal proteins) *do* support strong selected-effect inferences. Admit: *"In some cases, the evidence converges. But convergence isn't entailment—and phylogeny alone *never* suffices."*  

  **Bottom line:** Don't soften the thesis. Double down on the evidence-code gap (no SE code exists!). If you fumble the phylogenetics reply, the teleosemanticists will feast on the carcass. Burn 60 seconds rehearsing that retort.
