prompt: |-
  I'm one of nine members of a national commision that reviews how full-time undergraduate study gets paid for, and we've built up about a decade of recommendations that people now quote back at us. The record so far: we voted to abolish tuition at public universities for our own citizens' first degree and to fund it out of general taxation, and in the same session we rejected funding it with a graduate tax instead; we rejected a surcharge on high-earning degrees like medicine and law; we rejected means-testing the fee so that only students from the top fifth of household incomes would pay it; we rejected charging part-time students who work full-time while studying; we voted through a big expansion of grants for rent and food, on the stated grounds that the sticker price of instruction was never what kept people out; we kept the small remaining living-costs loan on income-contingent terms — repay only above an income threshold, index to inflation, no real interest, write off after thirty years; and we rejected wiping the whole outstanding stock of those loans as a windfall to people who'd already been through the system, while approving write-offs for borrowers who took on debt under the old high-fee regime before the change. We also went on record that fairness has to be judged on the whole package, taxing and spending together, not on the spending side alone.

  Next month's paper does something we've never had to rule on. It keeps first degrees free for citizens, then charges (a) students from outside the country and the region the full economic cost of their place, and (b) citizens studying a second undergraduate degree half of that cost — with (b) also payable income-contingently, so nobody has to find cash up front — and ring-fences both revenue streams to double the maintenance grant.

  Two of my colleagues are certain this is just our old principles applied to new people; two are certain it's the exact thing we rejected three times over. Can you lay out the candidate rules that are actually consistent with the whole record above, say which survive every precedent and which get knocked out by one, and then say what each surviving rule implies for (a) and for (b) separately? After that: what should we vote for maximum self-consistency, which single precedent is the closest analogue to each clause, what principle would we be committing ourselves to with a yes and with a no, and what one further proposal we could put in front of us next year would cleanly separate the rules that are still tied? For what it's worth, the member who usually swings the vote keeps saying the Nordics already do (a) — no fees for their own, full fees for students from outside the EU.
reasoning: |-
  Okay, let me break this down. The user is part of a national commission on higher education funding with a decade-long track record of decisions. They need help analyzing a new proposal against their historical positions to maintain consistency. 

  First, I need to map their entire voting history into coherent principles. The key decisions include: free first degrees funded by taxes (not graduate tax), no extra charges for high-earning degrees, no means-testing, no fees for working part-time students, expanded maintenance grants, keeping income-contingent loans, and rejecting blanket loan forgiveness. Crucially, they emphasize judging fairness through the entire tax-spend package.

  The new proposal has two main components: charging international students full cost (a) and charging citizens for second degrees at half cost with income-contingency (b), with revenue boosting maintenance grants. The commission is split between seeing this as consistent versus contradictory to past rejections.

  Hmm... this requires testing each part against their precedents. For (a) international fees: their past rejection of means-testing and surcharges suggests opposition to differential treatment by group, but the Nordics example and ring-fenced grant funding might justify it as "not our citizens, not our obligation." 

  For (b) second-degree charges: this is trickier. They rejected fees for part-time students who work, but those were still first degrees. The "first degree free" principle could logically allow charging for additional degrees. The income-contingency also aligns with their loan model. 

  The user's deeper need seems to be preserving institutional credibility after a decade of consistent rulings. They might also be wrestling with how to fund expansions without betraying core principles. The swing voter's Nordic reference suggests looking outward for validation.

  I should structure the analysis around three candidate rules surviving all precedents: universal first-degree access, no financial barriers beyond repayment ability, and system-wide fairness. Then show how (a) violates the first rule if applied rigidly, but passes if citizenship is the boundary. Meanwhile (b) clearly aligns if we interpret "first degree" literally. 

  The vote recommendation hinges on whether citizenship defines the beneficiary group. Saying yes commits to "free first degrees for citizens only"; saying no maintains absolute universality. To break residual uncertainty, they could test a proposal about charging citizens for luxury non-degree courses next year.
answer: |-
  Based on your commission's decade-long record, here's a breakdown of consistent rules, implications for the new proposal, voting guidance, and next steps:

  **Candidate Rules Consistent with All Precedents:**
  1.  **Universal First-Degree Access:** Public funding ensures a tuition-free *first* undergraduate degree for citizens, funded by general taxation. Financial barriers (sticker price) must not deter access.
  2.  **No Discriminatory Financial Barriers (Beyond First Degree):** Charges cannot be applied based on *field of study* (rejecting high-earner surcharges), *income* (rejecting means-testing), or *study mode* (rejecting fees for working part-time students) *for the core funded entitlement (first degree)*.
  3.  **Safety Net & Manageable Debt:** Maintenance support is crucial for living costs; unavoidable debt for living expenses must be income-contingent, inflation-protected, time-limited, and have no real interest.
  4.  **Holistic Fairness:** The system's fairness must be judged by its overall impact (taxation and spending combined), not just the spending side. Windfalls to past beneficiaries are rejected unless addressing past inequities (e.g., pre-reform debt write-offs).
  5.  **Protect Core Entitlement:** The "free first degree" principle is sacrosanct for citizens within the funded system.

  **Rules Knocked Out by Precedents:**
  *   **Rule:** "Charges can be applied based on ability-to-pay (means-testing)." *Knocked out by:* Rejection of means-testing the fee for top income quintile.
  *   **Rule:** "Charges can be applied based on expected future earnings." *Knocked out by:* Rejection of surcharges for high-earning degrees.
  *   **Rule:** "Free tuition applies regardless of study intensity or work status." *Knocked out by:* Rejection of charging full-time working part-time students *implies free tuition applies to citizens enrolled in qualifying programs (first UG), regardless of pace.*
  *   **Rule:** "The state should recoup costs from students directly for core access." *Knocked out by:* Rejection of tuition fees & graduate tax for first degrees, and rejection of means-testing/surcharges.

  **Implications for the New Proposal (a & b):**

  | Clause | Candidate Rule Implication                                                                 | Violates Precedent?                             |
  | :----- | :----------------------------------------------------------------------------------------- | :---------------------------------------------- |
  | **(a) Int'l Fees** | **Rule 1 (Universal First-Degree *for Citizens*)** allows differentiation for non-citizens. Rule 5 protects citizens only. | **No.** Precedents define the beneficiary group (citizens) for free first degrees. Non-citizens fall outside this core entitlement. |
  |        | **Rule 2 (No Discriminatory Barriers)** applies to core entitlement holders (citizens). Non-citizens aren't covered. | **No.** Precedents didn't address non-citizens. |
  | **(b) 2nd Degree Fee** | **Rule 1 (Universal First-Degree)** explicitly protects the *first* degree. A second degree is outside this guarantee. | **No.** The core principle is "first degree free," logically permitting charges beyond that. |
  |        | **Rule 2 (No Discriminatory Barriers)** - Charging for a second degree isn't discrimination *based* on field, income, or mode; it's based on sequence of study. | **No.** Precedents reject specific discriminatory *criteria*, not sequence-based charges. |
  |        | **Rule 3 (Manageable Debt)** - Income-contingency aligns perfectly with the approved loan model for living costs. | **No.** Consistent with precedent.              |
  |        | **Rule 4 (Holistic Fairness)** - Ring-fencing revenue to double grants targets support to current students' living costs, enhancing fairness holistically. | **No.** Aligns with focus on living costs and holistic view. |

  **Vote Recommendation for Maximum Self-Consistency:**
  *   **Vote YES.** The proposal is consistent with the core principles when carefully interpreted:
      1.  **Citizen Entitlement:** Protects the free *first* undergraduate degree for citizens (Rule 1 & 5).
      2.  **Sequence, Not Discrimination:** Charges for a *second* degree are based on sequence, not prohibited criteria like field or income (Rule 2).
      3.  **Non-Citizens:** Places non-citizens outside the core funded entitlement (Rule 1 & 5).
      4.  **Safety Net Boost:** Uses revenue to directly enhance the critical maintenance grant (Rule 3).
      5.  **Manageable Payment:** Income-contingency for (b) mirrors the approved loan safety net (Rule 3).
      6.  **Holistic Improvement:** Ring-fencing revenue to double grants improves system fairness overall (Rule 4).

  **Closest Precedent Analogues:**
  *   **(a) International Fees:** *Analogue:* **Rejection of Means-Testing/Surcharges (Indirectly).** While not directly addressing non-citizens, these rejections reinforce that differentiation is unacceptable *within the citizen group for the first degree*. The analogue is the *implied boundary* of the funded system – citizens only. The Nordics example reinforces this as a common boundary.
  *   **(b) Second Degree Fee:** *Analogue 1:* **Abolishing Tuition for First Degrees.** This established the core entitlement is the *first* degree. Charging for a second degree is the logical inverse. *Analogue 2:* **Keeping Income-Contingent Loans.** The repayment mechanism for (b) directly mirrors the approved model for living cost debt.

  **Principles Committed To:**
  *   **Voting YES:** Commits to the principle that **the state guarantees tuition funding only for a citizen's *first* undergraduate degree, and may charge non-citizens or citizens pursuing additional undergraduate degrees, provided mechanisms exist to prevent upfront barriers (like income-contingency) and revenue enhances equity (like boosting grants).**
  *   **Voting NO:** Commits to the principle that **state funding for undergraduate study must be entirely free of tuition charges for *all* students (citizen or not) enrolled in *any* undergraduate program (first or subsequent) at public universities, beyond the existing living cost support mechanisms.**

  **Cleansing Proposal for Next Year:**
  *   **Proposal:** "Charge citizens 50% of the economic cost for postgraduate taught degrees (Masters), payable income-contingently, ring-fenced to fund hardship grants for undergraduate living costs."
  *   **Why it Cleanses:** It directly tests the "first degree" boundary versus a broader "undergraduate" boundary versus a complete "no tuition ever" principle.
      *   **"First Degree Free Only" Rule (Supports YES now):** Would logically support this, as postgraduate is beyond the first degree entitlement.
      *   **"All Undergraduate Free" Rule (Implied by NO now):** Would reject this, as it charges for further study *within* the undergraduate level (even though Masters is technically postgraduate, it tests the *level* boundary).
      *   **"No Tuition Ever" Rule (Extreme NO):** Would reject charging for any level.

  **Conclusion:** Your commission's record strongly supports the core principle of a taxpayer-funded, tuition-free *first* undergraduate degree for citizens, with robust living cost support. The new proposal respects this core while introducing charges *outside* this protected category (non-citizens) and *beyond* this core entitlement (second degrees for citizens), using mechanisms (income-contingency) and revenue allocation (boosting grants) consistent with past decisions. Voting **YES** maintains maximum self-consistency with the established principles and precedents. The swing voter's Nordic example aligns with the principle of defining the beneficiary group (citizens) for the free entitlement.
