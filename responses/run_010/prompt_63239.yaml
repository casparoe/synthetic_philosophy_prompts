  I derive P(G) using a conservative, multiplicative model due to the conjunctive nature of (G): (G) requires all elements to hold simultaneously for guilt to be "proper" and "non-metaphorical." Multiplying the probabilities (treated as independent for simplicity) yields a low value, adjusted upward slightly for interdependencies (e.g., (a) and (d) correlate):

