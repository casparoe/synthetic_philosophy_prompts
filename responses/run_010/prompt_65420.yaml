  Let me map this out carefully. The discounting account explains akrasia through temporal dynamics: when a smaller-sooner reward becomes imminent, hyperbolic discounting causes its subjective value to spike relative to a larger-later reward, creating a preference reversal. But in spreadless cases, all payoffs occur simultaneously, so discounting factors should cancel out, leaving no room for such reversals.

