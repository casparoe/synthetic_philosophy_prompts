prompt: |-
  I am three years into a dissertation on the normative foundations of voluntary obligation, and the chapter I am currently revising defends a position I have not encountered articulated in quite this form, so I want it stress-tested by someone who will not simply assume I have read the standard alternatives badly. The position, in outline, is that promissory obligation is at bottom an obligation incurred to oneself rather than to the promisee. In promising, you exercise a power over the shape of your own agency: you settle what you will do, and in settling it you acquire a duty to be the person whose word carries weight. Breaking a promise is therefore primarily a failure with respect to yourself — you become someone for whom an assertion about your own future counts for nothing. The injury to the promisee is real and morally significant, but on my account it is derivative, explained by the fact that the promisee participated in the act through which you took on this self-directed duty and so occupies a special position from which to complain when you fail in it. Two features are what drew me to the view. It explains why you cannot simply release yourself from a promise by ceasing to care about the promisee, something an unambiguously other-directed account has to work harder to accommodate. And it explains what is added when you promise to do something you already had independent moral reason to do — return the book, tell the truth, refrain from an affair — since the promise adds not a further reason of the promisee's making but a commitment concerning the constitution of your own agency.

  What I want from you is a map of this view's exposure, not a survey of the literature on promising. Take the cases in rough order of the damage they do, and for each say whether the self-directed account delivers an acceptable verdict, whether it can explain the case away, and what the explanation costs. The ones I have in mind: a promise made to a stranger you are confident you will never see or hear from again, broken in circumstances where no one will ever learn of the breach; the promise to a person who dies before the time for performance, including promises concerning what will be done with their body or their papers; a promise that cannot be performed until after the promisor's own death; the promisee's release, which on my account ought to be embarrassing — if the duty is owed to me, why should their say-so extinguish it?; the parallel asymmetry between promising yourself and promising another, since if both are self-directed it is unclear why one admits of release by me and the other does not; promises extracted under duress, or made by someone not competent to make them; the promise accompanied by a secret reservation; and the promise whose performance would itself be a serious wrong. I am also interested in structural rather than case-based pressure. There is the long-standing worry that one cannot hold a claim against oneself, and I want to know what turns on whether that is a conceptual truth or an artifact of how we ordinarily describe rights. There are the puzzles in deontic logic concerning obligations derived from other obligations, which seem to bear on whether a self-directed duty can generate duties toward anyone else at all. And there is the material on standing to blame, since my account must explain why the promisee's resentment is appropriate in a way that a bystander's is not, and I am not confident I can ground that asymmetry without smuggling in a genuinely other-directed duty after all.

  Two further judgments, delivered plainly. The first concerns insulation. I expect a critic to say that "the wrong to the promisee is derivative" functions as a formula that absorbs any counterexample: whatever intuition is produced against the view, I can redescribe it as an intuition about the derivative wrong. Is that a fair description of my position? And if it is, does it matter for a theory of this kind — I am aware that the standards for immunity differ between normative inquiry and empirical science, and I would rather be told whether what looks like unfalsifiability here is a genuine defect or simply what theoretical unification looks like from the outside. The second concerns comparative risk: what does my account get right that the practice-based line (which, whatever else it achieves, seems to locate the obligation in a social institution rather than in anything the promisor does) and the assurance-style line get wrong, and is any of it worth the costs identified above? Please rank the defeaters from fatal to merely awkward, indicate for each whether a committed defender of my view should concede it or resist it, and say where the pressure ought to land hardest. My own guess is the release case and the self-promise asymmetry, on the ground that both seem to require a party with the standing to alter the obligation, and my account has no such party other than the promisor — who, by hypothesis, cannot alter it at will. If it turns out that only a substantially revised version of the view survives, show me the revision rather than reassuring me; a chapter I can defend is worth more to me than one I can enjoy.
reasoning: |-
  Okay, let me start by really understanding what this user is asking. They're deep into their dissertation on the normative foundations of voluntary obligation, specifically focusing on promissory obligation as a duty to oneself. The core idea is that when you make a promise, you're shaping your own agency, and breaking it means failing yourself first. The harm to the promisee is derivative, stemming from their involvement in that act. 

  The user wants stress-testing of their theory through specific cases, not a literature review. They’ve listed several scenarios: promises to strangers, to the deceased, posthumous promises, release by the promisee, self-promises vs. promises to others, duress, secret reservations, and immoral promises. They also mention structural issues like holding a claim against oneself, deontic logic puzzles, and standing to blame. Plus, they’re concerned about insulation—whether their "derivative wrong" explanation is unfalsifiable—and comparative risk against practice-based and assurance theories.

  First, I need to tackle each case systematically. The promise to a stranger broken in secret seems problematic because the self-directed duty should still hold, but the derivative harm to the promisee is absent. The user’s theory might say the wrong is only to oneself here, but does that match intuition? Probably not, since we usually think breaking a promise harms the promisee even if they never know. The user’s theory might need to argue that the promisee’s participation creates a standing to be wronged, but if they’re unaware, that’s shaky. This case is medium-severe; the defender could bite the bullet but at the cost of counterintuitiveness.

  Next, promises to someone who dies before performance. The self-duty persists, but the derivative wrong to the promisee is tricky—they don’t exist anymore. Yet we feel obligations like burial promises still matter. The user might say the duty is to oneself, but the promisee’s prior participation grounds a "moral residue." Is that convincing? Maybe, but it’s a stretch. This is medium-damage too.

  Posthumous promises are worse. If the promisor dies before performance, how can they have a present self-duty? Their agency ends at death. The user might invoke a "narrative unity of agency," but that’s metaphysically heavy. High-severity; the defender might need to deny such promises are binding or revise the agency view significantly.

  Release by the promisee is critical. If the duty is self-directed, why can the promisee release it? The user explains release as waiving the right to complain, not extinguishing the duty. But intuitively, release dissolves the obligation. This seems contradictory. High-severity; the defender must argue the self-duty remains but the promisee’s waiver removes their standing, making breach non-wrongful to them. Still, it’s awkward.

  Self-promises vs. promises to others: If both are self-directed, why can others release you but you can’t release yourself? The user must distinguish structural roles—self-promises lack a second party whose waiver matters. But that might not fully explain the asymmetry. Medium-severity; possible but requires careful handling.

  Duress and competence: The self-duty view handles these well. If the promise isn’t a genuine exercise of agency due to duress or incompetence, no duty arises. Low-severity; actually a strength.

  Secret reservations: If the promisor has a hidden escape clause, did they really settle their future agency? The view can say no true promise was made. Low-severity; works fine.

  Immoral promises: The self-duty persists but conflicts with moral reasons not to perform. The promisee might still have a derivative claim. But if performance is wrong, the promisee shouldn’t complain. The view can say the self-duty exists but is overridden. However, the promisee’s standing to protest an immoral act is dubious. Medium-severity; manageable with nuance.

  Structural issues: The "claim against oneself" problem is old but maybe surmountable—duties to oneself don’t require literal claims. Deontic logic puzzles might be resolved by seeing derivative duties as relational consequences of self-obligations. Standing to blame: The promisee’s participation gives them unique standing to resent, while bystanders don’t. This needs careful grounding without smuggling in other-directed duties. High-stakes but possible.

  Insulation concern: The "derivative wrong" move isn’t necessarily unfalsifiable if it makes testable claims about the structure of wronging. But it risks circularity. The user must ensure the explanation isn’t ad hoc. Important but not fatal.

  Comparative risk: The self-directed view explains why you can’t release yourself and why promising adds to existing duties—advantages over practice-based and assurance theories. But it struggles with release and posthumous cases. The trade-off might be worth it if the explanatory power is high.

  Ranking defeaters: Fatal—posthumous performance (needs major revision). High-severity—release (defender must concede and refine), standing to blame (must ground carefully). Medium—stranger, deceased promisee, self-promise asymmetry, immoral promises. Low—duress, reservations.

  The user’s guess about release and self-promise asymmetry is spot-on. The key is whether the promisee’s role as a participant gives them a unique normative power without making the duty fundamentally owed to them. The revision could emphasize the promisee as a "witness" or "co-constitutor" of the self-duty, granting them standing to release or complain without being the primary obligee.

  Overall, the view has promise but needs tweaks, especially on posthumous cases and release. The core insight about self-constitution is valuable and worth defending with refinements.
answer: |-
  Your self-directed account of promissory obligation is provocative and philosophically lean. Below is a stress-test map, organized by case severity, structural pressures, insulation concerns, and comparative risks. I’ll rank defeaters from **fatal** to **awkward**, indicate whether to concede or resist, and pinpoint where pressure lands hardest. Revision paths are suggested where needed.

  ---

  ### **Case-Based Stress Tests (Ranked by Severity)**

  1. **Promise Requiring Posthumous Performance (e.g., "Bury me at sea")**  
     - **Problem:** If obligation constitutively shapes *your* agency, how can it bind beyond your existence? Your "self" ceases at death, yet the duty appears to persist.  
     - **Verdict:** Self-directed account **fails**.  
     - **Explanation Cost:** Must either (a) deny such promises create obligations (counterintuitive), or (b) radically revise the agency view to include "narrative unity" extending beyond death (metaphysically costly).  
     - **Defender’s Move:** **Concede** this as a genuine problem. *Revision:* Ground obligation in a *diachronic self-constitution* framework (e.g., "settling future-directed commitments as part of your identity-legacy"), but this risks collapsing into a third-personal/social view.

  2. **Promisee’s Release**  
     - **Problem:** If the duty is self-directed, why does the *promisee’s* decision extinguish it? Your account must explain why *their* act ("I release you") dissolves *your* duty to yourself.  
     - **Verdict:** **Severe tension**; self-directed account struggles.  
     - **Explanation Cost:** Claiming release merely waives the promisee’s *standing to complain* (not the duty itself) feels evasive. Intuitively, release *dissolves* the obligation.  
     - **Defender’s Move:** **Resist** by redefining release: The promisee’s participation in the original act grants them authority to *dissolve the relational scaffold* enabling your self-duty. But this implicitly makes the duty *conditional* on the promisee’s will.  
     - **Pressure Point:** Highest here (as you guessed). If release alters the obligation’s existence, the duty isn’t purely self-directed.

  3. **Self-Promise vs. Promise to Another (Asymmetry of Release)**  
     - **Problem:** If both are self-directed duties, why can a promise *to another* be released by them, but a *self*-promise cannot be released by anyone?  
     - **Verdict:** **Moderate damage**; asymmetry strains the account.  
     - **Explanation Cost:** Must argue that promises *to others* involve a *structural second party* whose role includes release-authority, while self-promises lack this. This risks ad hoc differentiation.  
     - **Defender’s Move:** **Resist** by emphasizing the *relational context*: A promise to another creates a *triadic structure* (promisor, promisee, commitment), where the promisee is a constitutive participant with normative powers. Self-promises are dyadic.  

  4. **Promise to a Stranger (Breached in Secret)**  
     - **Problem:** If no one learns of the breach, the self-directed duty holds, but the derivative injury to the promisee vanishes. Yet intuition suggests a wrong *to the promisee* persists.  
     - **Verdict:** Self-directed account **delivers acceptable verdict** but at cost.  
     - **Explanation Cost:** You must deny the promisee is *directly* wronged. Injury is "derivative" only via their role in the self-binding act. This clashes with the intuition that breach *harms the promisee* (even unwitnessed).  
     - **Defender’s Move:** **Concede** the verdict but bite the bullet: The wrong is *only* to oneself; the promisee’s "injury" is their *moral disappointment* as a participant, not a violated claim.  

  5. **Promise to a Deceased Person (e.g., "I’ll burn your letters")**  
     - **Verdict:** Self-directed account **explains away** the case.  
     - **Explanation:** Your duty to yourself persists. The promisee’s death removes their *standing to complain*, but not your obligation to uphold your agential integrity.  
     - **Cost:** Must accept that "duties to the dead" are illusions; only *self*-duties remain. This may conflict with practices (e.g., wills).  
     - **Defender’s Move:** **Resist** objections; this case showcases your view’s strength.  

  6. **Duress or Incompetence**  
     - **Verdict:** Self-directed account **excels**.  
     - **Explanation:** A coerced/incompetent promise fails as a genuine exercise of self-governance → no self-binding occurs.  
     - **Cost:** None. Aligns with standard voluntarism.  

  7. **Secret Reservation (e.g., "I promise, but mentally add ‘unless I change my mind’")**  
     - **Verdict:** Self-directed account **explains away**.  
     - **Explanation:** If you don’t sincerely *settle* your future agency, no self-obligation arises. The external act alone is insufficient.  
     - **Cost:** None; leverages your core "settlement" requirement.  

  8. **Immoral Promise (e.g., "I promise to help you murder X")**  
     - **Verdict:** Self-directed account **delivers acceptable verdict**.  
     - **Explanation:** You incur a self-duty to keep your word, but it is overridden by the duty not to commit murder. The promisee’s derivative "claim" is nullified by the act’s immorality.  
     - **Cost:** Must explain why the promisee’s *standing to complain* evaporates here but not in ordinary cases.  

  ---

  ### **Structural Pressures**

  1. **Can One Hold a Claim Against Oneself?**  
     - **Pressure:** If duties entail correlative claims, self-claims seem paradoxical (who enforces?).  
     - **Defender’s Move:** **Resist** by decoupling duties from *enforceable* claims. A self-directed duty is a *normative constraint on practical identity*, not a "claim" in the Hohfeldian sense.  
     - **Cost:** Requires reconceptualizing deontic logic’s core structures.  

  2. **Derivative Duties to Others**  
     - **Pressure:** If your duty is self-directed, how can it generate *obligations to the promisee*?  
     - **Defender’s Move:** **Resist** by framing the promisee’s "claim" as a *relational consequence*: Their participatory role grants them unique standing to hold you accountable for *your* self-betrayal.  
     - **Cost:** Must ground the moral weight of "participation" without smuggling in direct duties.  

  3. **Standing to Blame**  
     - **Pressure:** Why can the promisee resent you, but a bystander cannot?  
     - **Defender’s Move:** **Resist** by appealing to the promisee’s *constitutive role*: They are a witness to your self-commitment, so their resentment reflects a privileged perspective on your agential failure.  
     - **Cost:** Risk of circularity if "constitutive role" presupposes a duty *to them*.  

  ---

  ### **Insulation & Comparative Risk**

  **Insulation ("Derivative Wrong" as Unfalsifiable?)**  
  - **Fair Description?** Yes. By treating the promisee’s injury as derivative, you *can* redescribe any counterintuitive case as "only a problem for the derivative layer."  
  - **Does It Matter?** Not fatally. Normative theories often unify phenomena under a core principle, with auxiliary explanations for peripheral cases. The issue is whether your core mechanism (*self*-binding) does independent work. **Verdict:** It does (e.g., it explains why self-release fails). The insulation is defensible if your account is *explanatorily deeper* than rivals.  

  **Comparative Risk Assessment**  
  | **Competitor**             | **What Your View Gets Right**                                                                 | **What It Risks**                                  |  
  |----------------------------|-----------------------------------------------------------------------------------------------|---------------------------------------------------|  
  | **Practice-Based (e.g., Rawls)** | Explains why promises bind *individually* (not institutionally) & why self-release fails.     | Struggles with secret/stranger cases (no social context). |  
  | **Assurance (e.g., Scanlon)**   | Explains why adding a promise to existing duties *matters* (self-constitution vs. reason-balancing). | Cannot explain binding force in secret/stranger cases. |  
  - **Cost-Benefit:** Your view’s strengths (self-release, agential commitment) outweigh its costs *if* you resolve the release asymmetry and posthumous cases.  
  - **Worth the Costs?** Yes, *if* revised to handle release/posthumous issues.  

  ---

  ### **Ranked Defeaters & Revision Path**

  | **Rank** | **Defeater**               | **Severity** | **Move** | **Revision Suggestion** |  
  |----------|----------------------------|--------------|----------|------------------------|  
  | 1        | Posthumous Performance     | **Fatal**    | Concede  | Ground obligation in *narrative self-constitution*: Promises bind as extensions of identity beyond death. |  
  | 2        | Promisee’s Release         | **High**     | Resist   | Frame release as *waiving constitutive participation*, dissolving the *relational context* enabling the self-duty. |  
  | 3        | Standing to Blame          | **High**     | Resist   | Argue the promisee’s resentment tracks *their role as co-author* of your commitment. |  
  | 4        | Self-Promise Asymmetry     | **Medium**   | Resist   | Differentiate *relational* vs. *solitary* self-binding; only the former includes a release mechanism. |  
  | 5        | Stranger in Secret         | **Medium**   | Concede  | Bite the bullet: No direct wrong to promisee, only self-betrayal. |  
  | 6        | Deceased Promisee          | **Low**      | Resist   | Affirm self-duty; deny duties to the dead. |  

  ---

  ### **Where to Revise**
  - **Core Fix:** Recast the promisee’s role as a *constitutive witness* whose participation enables the self-binding act. Release becomes their *withdrawal from this enabling role*, dissolving the obligation’s relational structure (though the self-duty technically persists, it loses practical force).  
  - **Posthumous Fix:** Adopt a "diachronic self" metaphysics: Promises project your agency into the future, binding your "temporal identity." Risky, but necessary.  
  - **Result:** A *relationally scaffolded self-obligation* view. The duty remains fundamentally to yourself, but its normative architecture requires a promisee to activate and sustain it.  

  This retains your core insight while addressing critical counterexamples. The chapter remains defensible—if you embrace the revisions.
