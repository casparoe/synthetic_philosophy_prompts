  Material costs are minimized using printed cards and basic stationery. The timeline allocates substantial time for emergent behavior and focuses debriefing on mechanical rather than political reflections.
answer: |-
  ### Design Reasoning
  **Structural feature requiring mechanical implementation:** The core distinction lies in *how* external testimony is processed: omission (bubble) vs. active discrediting (chamber). A naive simulation might use instructor-fed rules to *tell* players to distrust outsiders, but this misses the self-reinforcing incentive structure. Chambers require players to *profit* from discrediting. Similarly, bubbles must emerge from structural constraints, not just ignorance. The key failure of naive designs is treating distrust as arbitrary rather than incentivized.  

  **My proposal:** Use a prediction game with a hidden "ground truth," where players earn points for accuracy but are subjected to asymmetric information barriers. For chambers, introduce a *consensus bonus* that rewards agreement over accuracy, making dismissal of outsiders rational. For bubbles, physically restrict access to information sources. Flood both structures with identical external data to show differential responses. The "aged bubble" test requires a persistent bubble round where discrediting emerges without explicit rules.  

  ---

  ### Simulation Design: **Astrion Mineral Survey**  
  **Fictional Context:** Students are geologists predicting the value of minerals (A-G) mined on a fictional planet. Ground truth is determined by a fixed, non-intuitive value table (e.g., Mineral A is high-value only if mined in *odd-numbered years*).  

  #### Ground Truth Mechanics  
  - **Hidden Rule:** Mineral values depend on a hidden variable (e.g., "Cosmic Phase": Phase 1/Phase 2).  
  - **Answer Key (Instructor-Only):**  
    - Phase 1: Minerals A, C, E = High (5pts); B, D, F, G = Low (1pt)  
    - Phase 2: Minerals B, D, F = High (5pts); A, C, E, G = Low (1pt)  
  - **Determining Phase:** Use a d6 die (even = Phase 1, odd = Phase 2). Roll secretly at start of each round.  

  #### Token Scheme  
  - **Base Reward:** Correct prediction = 3 tokens.  
  - **Consensus Bonus (Chamber Rounds):** If all group predictions match, +2 tokens each.  
  - **Longevity Bonus (Aged Bubble):** +1 token per consecutive round in the same group.  
  - Tokens convert to participation credit (e.g., 10 tokens = 100%).  

  ---

  ### Materials & Setup ($12 est.)  
  1. **Role Cards:** 18 cards (9x "Team Alpha," 9x "Team Beta").  
  2. **Mineral Data Sheets:** 7 cards/mineral (total 49 cards), each stating:  
     *"Mineral [Letter] | Source: [Team Alpha/Beta] | Year: [1-10]"* (e.g., "Mineral A | Source: Team Alpha | Year: 3").  
  3. **Prediction Sheets:** Grids for players to record mineral value predictions (High/Low).  
  4. **Tokens:** Poker chips or paper slips ($5).  
  5. Two large posters: "Team Alpha HQ," "Team Beta HQ" (tape to walls).  
  6. One d6 die ($2).  
  7. Timer.  

  ---

  ### Printable Handouts  
  **Role Card (All Identical):**  
  > *"You are a geologist for [Team Alpha/Beta]. Each round, predict HIGH or LOW value for minerals A-G. Earn tokens for correct predictions. You may share data with teammates but not leave your HQ. Follow round-specific rules."*  

  **Mineral Data Card (Example):**  
  > **MINERAL B**  
  > Source: Team Beta  
  > Year: 7  

  **Prediction Sheet (Per Player):**  
  > Round 1: A: _ B: _ ... G: _  
  > Round 2: A: _ ...  
  > ...  

  ---

  ### Procedure (100-Minute Timeline)  
  **Prep (5 mins):**  
  - Split class into Team Alpha/Beta (9 each). Post HQs on opposite walls.  
  - Distribute role cards, prediction sheets, pens.  

  **Round 1: Baseline (15 mins)**  
  - *Rules:* Free movement. All mineral data cards available on a central table.  
  - *Mechanic:* Roll die (secretly), set Phase. Players predict mineral values using any data.  
  - *Outcome:* Establishes that full information enables accuracy.  

  **Round 2: Bubble (20 mins)**  
  - *Rules:* Teams confined to HQs. Each team gets ONLY their own mineral data cards (e.g., Alpha sees only Alpha-sourced data).  
  - *Mechanic:* Roll new Phase. Teams predict using partial data.  
  - *Incentive:* No consensus bonus. Base rewards only.  
  - *Flood Test (Mid-round):* Release ALL data to both teams ("New satellite data!"). Observe if predictions change.  

  **Round 3: Chamber (25 mins)**  
  - *Rules:* Same as Round 2 (confined, partial data) but ADD consensus bonus.  
  - *Mechanic:* Secretly assign one player per team as "Defector." Defectors move to the other HQ but retain original team role. They can share data but are introduced as "contaminated."  
  - *Incentive:* Consensus bonus creates profit in dismissing Defectors.  
  - *Flood Test:* Release all data. Defectors argue for accuracy. Observe if teams reject evidence.  

  **Round 4: Aged Bubble (Optional, 15 mins)**  
  - *Rules:* Remove physical barriers. All data accessible. Keep consensus bonus AND add longevity bonus.  
  - *Mechanic:* Same Phase as Round 2 (to test persistence). Players may stay in original groups.  
  - *Outcome Test:* If teams maintain Round 2 predictions despite full data, discrediting emerges endogenously.  

  **Debrief (20 mins):**  
  1. **Map Play to Concepts:**  
     - Round 2: "Why couldn’t you solve it? What was missing?" → **Omission/Truncated sources**.  
     - Round 3: "Why reject the Defector/flooded data?" → **Active discredit/Corrupted reliability**.  
     - Flood Test: "Why did new data fix Round 2 but not Round 3?" → **Exposure vs. Trust remedies**.  
     - Round 4 (if run): "Did distrust form without rules?" → **Aged bubble hypothesis**.  
  2. **Name Distinctions:** Finally introduce "epistemic bubble" (omission) and "echo chamber" (discredit).  

  ---

  ### Predictable Failures & Fixes  
  1. **Chamber round collapses** if no one dismisses the Defector.  
     - *Fix:* Secretly brief Defectors to aggressively challenge group. Add a "loyalty reward" (1 token) for ignoring Defectors.  
  2. **Evidence flooding solves everything:** Students prioritize tokens over roleplay.  
     - *Fix:* In Round 3, make the consensus bonus > max accuracy reward (e.g., +2 tokens for consensus vs. +3 for accuracy).  
  3. **Losing group disengagement:** Teams with wrong predictions lose motivation.  
     - *Fix:* Award tokens for "participation effort" (e.g., +1 per round) to decouple from accuracy.  
  4. **Hybrid round doesn’t trigger distrust:**  
     - *Fix:* Skip if time fails; use as discussion prompt: "What if Round 2 lasted 10 years?"  

  ---

  ### Unsimulatable Features & Omissions  
  1. **Timescale:** Real distrust accretes over years; the game compresses it to minutes.  
  2. **Social Cost:** Exiting a real chamber risks losing community/love. The game lacks emotional stakes.  
  3. **Meta-Awareness:** Players know it’s a game, limiting genuine investment in discrediting.  
  4. **Most Serious Omission:** **Social cost**. The simulation cannot replicate the visceral fear of ostracism that sustains real chambers. Players optimize for tokens, not identity preservation. You must argue this via case studies (e.g., cult exits, political defections).  

  **Your Guesses:** I agree entirely. Social cost is the gravest omission, followed by timescale. Meta-awareness is unavoidable but mitigated by immersion mechanics. Embedding chambers in loved communities is irreproducible without psychological manipulation—which is unethical.  

  ---  
  This design forces confrontation with the distinction through mechanics, not lecture. It meets all constraints, risks manageable failures, and leaves the binary’s exhaustiveness testable (if not always proven). Run it with ruthless timekeeping.
