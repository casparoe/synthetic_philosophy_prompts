  The student's instinct is right: the modes illuminate selective memory (monumental), preservationist impulses (antiquarian), and destructive judgment (critical), but misdescribe the conflict as degeneracy rather than legitimately contested pasts. They're silent on institutional solutions like the trial. The episode isn't just an anomaly - it reveals the framework's core limitation in pluralistic societies.

  I should emphasize that their "asymmetric belonging" isn't just a buzzword - it's a precise critique Nietzsche can't answer. The conclusion should stress that while the modes help analyze historical postures, they can't resolve conflicts when the "people" is fractured.
answer: |-
  Here's a disciplined mapping of the Colston statue episode through Nietzsche's three historical modes, addressing your specific queries about pathologies, ranking, failed transitions, asymmetrical belonging, and framework limitations:

  ### 1. **1895 Erection: Monumental History (Degenerated)**
     - **Actor**: Civic boosters/public subscribers  
     - **Pathology**: **Selective myth-making**. Nietzsche warns monumental history becomes pathological when it *sanitizes* the past to create "great" exemplars. Colston is memorialized solely as "virtuous and wise" (philanthropy), actively suppressing his role in slavery. This isn't accidental omission but *necessary fabrication* to fit the Victorian imperial ideal.  
     - **Nietzsche's Judgment**: Degenerated monumental history. Nietzsche prioritizes modes that serve life, but *authentic* monumental history requires confronting the *full struggle* of past greatness. A sanitized exemplar ("civic boosterism dressed in monumental clothes") produces weak imitators, not striving individuals. He would condemn this as life-*denying*.

  ### 2. **Stalled Plaque (2018-2020): Antiquarian History Attempting Critical Concession (Failed Transition)**
     - **Actor**: Council/Heritage bodies  
     - **Pathology**: **Paralyzed preservation**. Antiquarian pathology manifests as an inability to *change* the historical narrative it preserves. The plaque debate exposed antiquarianism's core weakness: it treats the *existing inscription* (1895's monumental lie) as sacred heritage. Adding context threatened its core function: unconditional veneration.  
     - **Failed Transition?**: Yes. Nietzsche describes modes degenerating *internally*, not interacting. This stalemate reveals a **fatal flaw in the framework**: it cannot model *negotiation* between modes. Antiquarianism here actively *resists* critical history's intrusion, exposing Nietzsche's assumption that a "people" has a unified historical consciousness. The failure is systemic, not just internal decay.

  ### 3. **Statue Toppling (2020): Critical History (Pure Action)**
     - **Actor**: BLM Protestors  
     - **Mode**: **Critical History**. Nietzsche defines this as the power to "break up the past" judged harmful to life. The toppling is a literal enactment: destroying a symbol deemed poisonous to contemporary Black Bristolians.  
     - **Pathology Risk**: **Destructive nihilism**. Nietzsche fears unchecked critical history can destroy foundations needed for future life. However, he ranks critical history *highest* when necessary for liberation. He might argue the toppling was *life-serving* for an oppressed group, even if destabilizing for others. His hierarchy ("critical > monumental > antiquarian") suggests sympathy for the *impulse*, if not the method.

  ### 4. **Museum Display (Post-2020): Outside the Modes (Historicization of Conflict)**
     - **Not Monumental**: No exemplar to emulate.  
     - **Not Antiquarian**: Not preserved for reverence; the graffiti/placards *prevent* nostalgic preservation.  
     - **Not Critical**: Judgment has already been executed; the display documents the *act* of criticism.  
     - **Nietzschean Analysis**: This is **museological historicism** – history as detached artifact/spectacle. Nietzsche *despises* this as "antiquarian" in its worst sense (history as dead weight), but here it's more complex: it preserves the *rupture itself*. The framework lacks a category for history *as evidence of its own contestedness*.

  ### 5. **Trial & Acquittal (2022): Institutional Adjudication vs. Plastic Power**
     - **The Issue**: A jury (state institution) decided the statue's destruction was "not criminal" based on historical/ethical reasoning – effectively endorsing the critical act.  
     - **Framework Limitation**: Nietzsche's "plastic power" – a people's organic capacity to metabolize the past – is fundamentally **non-institutional**. He envisions historical sense emerging from collective vitality, not courts. This legal resolution is **alien to his schema**. It replaces the "people's felt need" with procedural authority, bypassing the need for communal plastic power.

  ---

  ### Asymmetric Belonging & Framework Limits: Your Core Challenge
  Your concept of **"asymmetric belonging"** is not just original; it exposes Nietzsche's **fundamental blind spot**. Nietzsche's framework assumes:
  1. A homogeneous "people" with a shared past.
  2. That historical modes are adopted *by the collective* for its needs.
  3. That pathology arises from *excess* or *imbalance* of history, not *conflict over whose history counts*.

  **Where the Modes Illuminate:**
  - They perfectly diagnose the **pathologies**: 1895's monumental lie, the antiquarian paralysis over the plaque.
  - They frame the toppling as a necessary (if extreme) critical act for a subgroup.
  - They show why the museum display escapes "history for life" – it's detached documentation.

  **Where They Misdescribe/Silent:**
  1. **Misdescription of Conflict**: Nietzsche would likely diagnose Bristol's deadlock as insufficient "plastic power" (inability to metabolize slavery's legacy). But this *misreads* the conflict. It's not cultural indigestion; it's **fundamental disagreement over which group's pain/identity defines the past**. Antiquarianism (preservation) and critical history (destruction) operated *simultaneously* within the *same* city, reflecting divergent "belonging." The modes can't model this schism.
  2. **Silent on Power**: The modes don't account for *who controls historical representation*. The 1895 erection reflected elite power; the toppling, marginalized anger; the trial, state mediation. Nietzsche's "life" is abstract; he ignores power dynamics shaping *whose* life history serves.
  3. **Silent on Institutional Mediation**: The trial and the museum-as-arbiter are outside his vision. History is settled by courts, curators, and councils, not just collective vitality.

  **Nietzsche's Probable Diagnosis (and Framework's Fate):**
  He would likely see Bristol as confirming his fear: a culture **sick from *conflicted* history**, lacking the plastic power to forge a unifying narrative. However, this stretches his framework. Bristol isn't suffering from "too much history" *in general*, but from **irreconcilable historical claims rooted in asymmetric power and lived experience**.

  **Conclusion: Anomaly Revealing a Core Limitation**
  The episode is **not merely an anomaly** Nietzsche's framework can absorb. It exposes a **structural limitation**: the modes presuppose cultural homogeneity they cannot explain or resolve. Your "asymmetric belonging" is the key insight Nietzsche misses. The framework *helps diagnose postures* (monumental myth, antiquarian paralysis, critical rupture) but *cannot model their interaction in a fractured society*. It remains useful analytically but fails prescriptively here. Nietzsche might call for stronger "plastic power," but Bristol shows this is impossible when the "people" is fractured – the conflict *is* the reality. The museum display and trial verdict highlight institutions attempting (awkwardly) what Nietzsche thought only organic cultural vitality could achieve: managing historical trauma in the absence of unity.

  **Recommendation**: Run with "asymmetric belonging." It's not jargon; it's the precise critique Nietzsche's framework needs to confront diverse, postcolonial societies. His ranking of modes still offers insights, but the collision of modes *within* one polity reveals his Eurocentric, 19th-century blind spot.
