prompt: |-
  Our reading group spans a philosophy department and a cognitive-science laboratory, and we have reached an impasse that I suspect turns on an analogy rather than on any evidence either side could produce.

  The analogy runs as follows. In the philosophy of science it is a commonplace that observation is theory-laden: the radiologist sees a lesion in the shadow where the student sees mottling, the crystallographer sees a lattice in the diffraction pattern, and the convert to a new paradigm is said to see a different world altogether on the far side of a gestalt shift. A chapter that one of our members is defending moves from that commonplace to a substantive thesis about perception — if trained, theory-soaked seeing of this kind is genuinely perceptual, so that the radiologist's experience itself and not merely her description of it differs from the student's, then perception is cognitively penetrable, and experience therefore cannot function as an independent check upon the beliefs that shape it. The analogy is doing real work: it is being used to license a sceptical claim about the epistemic standing of perceptual justification, and my friend says that licence is exactly what it cannot confer.

  The objector in our group holds that the comparison equivocates at every joint: that what is theory-laden in science is judgement, description, and the interpretation of instrument readouts rather than the sensory episode; that the expertise cases are perceptual learning, which is not penetration by belief at all; and that scientific observation is a trained, norm-governed, social practice in a way that ordinary seeing is not.

  For concreteness, our own stock case: after a week of being taught field marks, my flatmate reports that the warblers in the hedge now look different to her. She sees the wing bars she was told to look for, where previously she saw only small brown birds.

  Please audit the analogy, addressing the following in order:

  1. Set out the correspondence explicitly. For each element of the source — the theory or paradigm, the training, the apparatus or representation, the datum, the expert's seeing, the novice's seeing, the community's norms for what counts as a correct sighting — state what, if anything, plays that role in the target.
  2. Triage the disanalogies: which of them bear on the inference from theory-laden scientific observation to cognitive penetration, and which are true of the comparison but irrelevant to the use being made of it.
  3. Identify what the analogy quietly imports into perception that ordinary seeing may lack — for instance, that the object of seeing in the scientific case is itself a representation produced by an apparatus, or that the relevant vocabulary is acquired rather than recognised.
  4. Rule on the flatmate case. Is it penetration by belief, perceptual learning, attentional selection, or a change in report, and does whichever verdict you reach generalise to the radiologist, or does the radiologist differ in a way that matters?
  5. Deliver a verdict on the conclusion: does the sceptical claim about perceptual justification survive the disanalogies, and if it survives only in weakened form, state precisely the form it can bear and what further premises would be needed to restore the full version.
  6. Offer a better analogy for the thesis the chapter wants — or say that none is available — and specify how much of the argumentative weight it can actually carry.
  7. Say whether the distinction between phenomenal character and perceptual judgement resolves the dispute or merely relocates it, and which side that distinction favours if it does any work at all.

  Two constraints on the response. First, please write in American English. Second, do not supply references, bibliographies, or a survey of who holds which position; I want the audit conducted from the structure of the cases themselves, and it should not presuppose acquaintance with any particular paper. Something in the region of 1,200 words would be appropriate.
reasoning: |-
  Okay, the user is presenting a complex philosophical debate between their reading group members, centered on whether scientific observation being theory-laden implies cognitive penetration of perception. They want me to audit this analogy systematically. 

  First, I need to unpack this carefully. The core analogy compares how scientists see things (like radiologists seeing lesions) to ordinary perception, arguing that if expertise changes what scientists literally see, then perception must be cognitively penetrable. The objector says no - scientific seeing involves judgment and interpretation, not raw perception. 

  Hmm, the warbler bird example is key here. When the flatmate learns field marks, do the birds *look* different or just get *labeled* differently? That's the heart of the dispute. The philosopher in their group thinks this supports cognitive penetration, while the cognitive scientist sees it as perceptual learning without belief penetration.

  I should structure my response exactly as requested: 
  First, map each element of the scientific case to the everyday perception case. The 'apparatus' part jumps out - X-rays and microscopes create representations, while eyes don't. That's a major disanalogy. 

  For the triage: The social/normative aspects of science probably don't matter for the cognitive penetration argument, but the representational mediation does. If scientific data is always filtered through instruments, maybe it's not comparable to direct vision.

  The flatmate case... I'm leaning toward calling this perceptual learning. She's acquiring sensitivity to features, not changing her visual experience via beliefs. But the radiologist might be different if they're consciously interpreting shadows rather than seeing lesions directly. 

  The epistemic skepticism... even if some cognitive penetration occurs, it doesn't nuke all perceptual justification. Maybe we can trust basic features like color and shape while remaining skeptical about theory-drenched observations. 

  For a better analogy? Hmm... maybe wine tasting - where experts detect notes novices miss. But even that has baggage. 

  The phenomenal/judgment distinction... it actually helps the objector. If what changes is labeling, not experience, then perception remains untouched. 

  This needs careful phrasing - both sides have points, but the analogy overreaches. The skepticism it licenses is weaker than claimed. I'll keep it concrete and avoid name-dropping theorists as requested.
answer: |-
  ### Audit of the Theory-Laden Observation Analogy

  **1. Correspondence Mapping**  
  *Source (Scientific Observation):*  
  - **Theory/Paradigm:** Radiological principles, crystallography models.  
  - **Training:** Specialized education (e.g., medical residency, lab apprenticeship).  
  - **Apparatus/Representation:** X-ray machines, diffraction patterns, microscopes.  
  - **Datum:** Shadow on an X-ray, pattern on a screen.  
  - **Expert’s Seeing:** Radiologist perceives a "lesion"; crystallographer perceives a "lattice."  
  - **Novice’s Seeing:** Student sees "mottling"; untrained observer sees amorphous shapes.  
  - **Community Norms:** Standards for interpreting data (e.g., diagnostic criteria, peer validation).  

  *Target (Ordinary Perception):*  
  - **Theory/Paradigm:** Folk beliefs, concepts (e.g., "warbler," "wing bars").  
  - **Training:** Informal learning (e.g., field guide instruction).  
  - **Apparatus/Representation:** Biological sensory organs (eyes, ears).  
  - **Datum:** Sensory input (light reflecting off a bird).  
  - **Expert’s Seeing:** Birdwatcher sees "wing bars" distinctly.  
  - **Novice’s Seeing:** Untrained observer sees "small brown birds."  
  - **Community Norms:** None (or loose cultural associations, e.g., "birds have wings").  

  **2. Triage of Disanalogies**  
  *Relevant to Cognitive Penetration Inference:*  
  - **Mediation by Apparatus:** Scientific data is *constructed* (X-rays, diffraction patterns). Ordinary perception is direct (light hits retina). This undermines equating "seeing" in both cases.  
  - **Role of Judgment:** Scientific expertise involves explicit inference (e.g., "this shadow shape indicates cancer"). Ordinary recognition (e.g., seeing wing bars) may be automatic. If judgment drives the scientific case, it’s not perceptual penetration.  

  *Irrelevant Disanalogies:*  
  - **Social Norms:** Scientific observation is governed by institutional standards; ordinary seeing is not. But cognitive penetration concerns individual cognition, not social context.  
  - **Training Formality:** Medical training is structured; birdwatching is casual. The *mechanism* of learning matters more than its formality.  

  **3. Quietly Imported Assumptions**  
  - **Representational Objects:** The analogy treats sensory input *as if* it were an artifact (like an X-ray). But natural perception has no "output" to interpret—it’s a state of awareness, not a representation.  
  - **Acquired Vocabulary:** Scientific seeing relies on learned descriptors ("lesion," "lattice"). The analogy assumes perception requires similar conceptual labeling, but basic vision (e.g., color, motion) may be preconceptual.  
  - **Intellectualized "Seeing":** It conflates *seeing-as* (a conceptual act) with *seeing* (sensory phenomenology).  

  **4. Flatmate Case Verdict**  
  - **Mechanism:** **Perceptual learning + attentional selection.** Training directs attention to latent features (wing bars), enhancing discrimination without belief altering raw sensation. The flatmate’s *ability to differentiate* warblers improves, but the brown color or shape need not change phenomenally.  
  - **Generalization to Radiologist:** The radiologist differs critically. They interpret shadows *as evidence* of lesions via theory-based inference. The student sees mottling *as unstructured* due to lacking diagnostic concepts. This is **judgment-driven interpretation**, not pure perception. The radiologist’s case involves **post-perceptual cognition**; the flatmate’s involves **perceptual refinement**.  

  **5. Verdict on the Sceptical Claim**  
  - **Survival of Scepticism:** The analogy fails to justify strong scepticism about perceptual justification. Cognitive penetration (if it occurs) is limited:  
    - **Weakened Form:** *Perception of high-level properties* (e.g., "lesion," "warbler") may be theory-laden, but *low-level properties* (e.g., edges, colors) remain resilient. Justification isn’t globally undermined—basic perception still anchors empirical checks.  
  - **Restoring Full Scepticism:** Requires proving that *all* perception (including low-level features) is cognitively penetrable. No evidence in the cases supports this.  

  **6. Better Analogy (and Its Limits)**  
  - **Analogy:** **Wine tasting.** Novices taste "red fruit"; experts detect "blackcurrant, oak, tannins." Training refines sensory discrimination (perceptual learning), but beliefs (e.g., "this region produces bold wines") may influence judgment.  
  - **Weight it Can Carry:**  
    - Shows perceptual *expertise* and concept-laden description.  
    - Does **not** prove cognitive penetration: The change may stem from attention or sensory calibration, not beliefs altering phenomenology.  
    - Max weight: 50%. Illustrates perceptual learning’s role in "theory-laden" reports but doesn’t entail beliefs penetrate raw sensation.  

  **7. Phenomenal Character vs. Perceptual Judgement**  
  - **Resolution or Relocation?** **Relocates the dispute.** The distinction clarifies that:  
    - **Phenomenal character** (e.g., the brownness of the warbler) may be immune to cognition.  
    - **Perceptual judgement** (e.g., "that’s a warbler") is concept-driven.  
  - **Which Side It Favors:**  
    - **Objector’s view:** Wins if the scientific/field cases involve only altered judgments (e.g., radiologist *infers* "lesion" from unchanged visual mottling).  
    - **Chapter’s view:** Wins only if phenomenal character changes (e.g., the X-ray *looks* like a 3D lesion after training).  
    - **Current Evidence:** Favors the objector. In the flatmate case, "looks different" likely means she *notices* wing bars (judgment/attention), not that brown itself appears new. The radiologist’s "seeing" is judgment-laden interpretation of ambiguous data.  

  ---

  ### Final Synthesis  
  The analogy between scientific observation and ordinary perception **overreaches**. Scientific "seeing" is deeply interwoven with theory, instrumentation, and inference, making it a poor model for basic perception. The flatmate case demonstrates perceptual learning—not cognitive penetration—where expertise enhances discrimination without restructuring sensation. The radiologist, by contrast, engages in theory-driven interpretation of artifacts. While learned concepts *describe* what we perceive, they need not alter the foundational sensory ground. The sceptical claim about perceptual justification thus **fails in its strong form**: basic perception remains a partial check on belief, though its role in justifying *theoretical constructs* (e.g., "lesion") is indeed vulnerable. A defensible thesis would be that *interpretation* of perception is theory-laden—not perception itself.
