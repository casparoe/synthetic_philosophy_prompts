answer: |-
  ## The Unmade Girl and the Standing Water

  The wind doesn’t howl in the Seal House. It *presses*. Like the weight of the Standing Water itself, held back by stone and earth and oath, pressing against the mountain’s flank only a league west. Tonight, it pressed against the thick, leaded windows too, a low, insistent thrumming that vibrated the soles of my boots. Or perhaps that was just my own weariness, fourteen years deep in this stone throat, breathing air that tasted of dust and old parchment.

  Across the worn oak table, lit by the single, guttering oil lamp that was the only flame permitted near the Seal, sat the girl. Nineteen summers. Yesterday, she was Kaela, daughter of the miller from High Reach. Today? Officially, she was nothing. Her name, Kaela, had been struck from the civic rolls. Her share of her father’s mill, her birthright, had been sold at auction by the syndics before the mourning incense had even faded from her sister’s clothes. Her family had wept, performed the rites, and consigned her to memory. She was civilly dead. And she was utterly, terrifyingly alive.

  She sat hunched, not in grief, but in a kind of stunned rigidity. Her eyes, wide and dark in the lamplight, darted from the massive iron chest bolted to the floor – the Seal – to the heavy door, then back to me. She hadn’t spoken since the syndics deposited her, pale and trembling, hours ago. The second Keeper, old Rennic, had finally succumbed to the lung sickness eight days past. The confessor, the one who must perform the Apprising, had died unexpectedly in his sleep the very night before Rennic passed. Fate, or something crueler, had left this girl Struck but not Apprised. Unmade. A legal ghost in a house of enforced forgetting.

  And only an Unmade Keeper could petition to open the Seal.

  “The wind,” I began, my voice rough from disuse. “It always sounds heavier when the melt begins upstream. But the Standing Water holds. It always holds.” It was a weak opening. She flinched slightly.

  “Where… where is the other?” she whispered, her voice cracking. “The third?”

  “Elgar is resting,” I said. “He’s been Keeper twenty-six years. Longer than you’ve been alive. The long nights… they wear.” *And he doesn’t want to see this*, I thought. *He knows what I must do, and he hates it.*

  Her gaze settled on the Seal chest. “And that… holds the answer? To why we drowned the valley? To the numbers?” The question hung between us, charged with the unspoken desperation of the League. Forty days of grain. The whispers from the lower reaches were turning to cries. The blight had been merciless, a creeping grey rot that turned golden stalks to dust. The Standing Water’s sacrifice, the fertile upper valley lost beneath its placid surface, mocked us. If drained now, planted come spring… salvation. But only if we dared break the dam for one season, gamble the lower reaches against a flood.

  “It holds the founders’ final reckoning,” I said carefully. “The Standing Clause binds us for one hundred and twenty years. Two remain. It forbids alteration. Always.”

  “But they’re starving!” The words burst from her, sharp with the immediacy of the living world she’d just left. “My father’s mill grinds dust! My sister… she mourned me yesterday, but her children are thin!”

  “Yes.” The word was flat, heavy. “They starve. But the Standing Water isn’t just water, Kaela. It is a *promise*. A promise written in stone and river law.”

  She blinked at the use of her name. Officially, she didn’t have one. “A promise to whom?”

  “To the future.” I leaned forward, the lamplight carving deep lines in my face. “One hundred and eighteen years ago, the Three Reaches were fractious, perpetually flooded, perpetually rebuilding. The lower towns drowned every five years. The upper valley prospered, but grudgingly. The Second Instrument, the Standing Water… it was a pact. The upper valley drowned their fields, their homes, their ancestors’ bones. In exchange, the League built the dam, the sluices. The lower reaches gained permanent safety. The upper gained… security. And the whole League gained a future longer than the next flood season.”

  “They drowned a valley no one remembers,” she said, a tremor in her voice. “All records burned. Only you… know what it looked like?” It was a hesitant question, probing the edges of the vast, cultivated ignorance that was the Standing Clause’s true bulwark.

  “Not even we,” I corrected gently. “We know the numbers. The measurements. The *cost*, quantified. But the scent of its grasses? The bend of the river there? The shape of the hills? Those are gone. Ordered destroyed. So that no one could dream of reclaiming it. So that the price felt… paid. Final. The Clause isn’t just stone and law, child. It’s forgetting. It’s the removal of the very *thought* of that valley as an option.” I paused, letting the implication sink in. “Until now.”

  “Because of me.” It wasn’t a question. She understood her unique, grotesque position. Struck. Unmade. Legally dead. The only one who could petition because she hadn’t yet been Apprised – hadn’t yet learned the secret that would make her desire the valley, or fear its draining.

  “Because the Instrument included the Clause of the Unmade,” I confirmed. “A formality, they thought. A legal flourish. The Seal may only be opened on the joint petition of the three Keepers, valid only if filed by one not yet Apprised. Since the Apprising follows the Striking within days… it was meant to be a door forever shut. But Rennic died before his confessor could Apprise you. The door is open. Cracked. For you.”

  “And if you tell me… if you Apprise me now…” she trailed off, the logic inescapable.

  “Then you are Apprised. Made. You cease to be Unmade. You lose the standing to file the petition. The door slams shut again. Forever.” The absurdity of it, the razor’s edge we walked, thickened the air. To act, she needed to know. To know, she lost the ability to act. The founders had built a lock only ignorance could open, and knowledge inevitably destroyed the key.

  “So why tell me?” Her voice was small. “Why not just… leave me ignorant? Send me away? The two years pass… the Clause holds?”

  I sighed, the sound lost in the wind’s pressure. “Because the famine is real. Because forty days is no time at all. Because Elgar and I… we disagree.”

  As if summoned by his name, the door to the inner chamber creaked open. Elgar stood there, leaning heavily on a cane carved from dark, dense wood – oak from the drowned valley, I knew. He looked gaunt, his face parchment stretched over bone, but his eyes, deep-set and sharp as flint, burned with an unwavering intensity. Twenty-six years in this stone silence had honed his focus to a single, diamond point: the bond.

  “Disagree?” His voice was a dry rasp, but strong. “We do not *disagree*, Merra. We diverge on the nature of the river itself.” He shuffled to the table, lowering himself stiffly into the third chair, opposite the Seal. His gaze, unsettlingly direct, fixed on the girl. “You are the Unmade. You feel the pull of the living world. Its hunger. Its immediacy. It screams at you. I understand.” There was no condescension, only a bleak acknowledgement. “But what screams at you is *now*. The Standing Water is *then* and *always*.”

  He tapped a bony finger on the table. “The League bound itself. Not the land, not the water – itself. A people who cannot bind their future selves are condemned to the length of a mood, the span of a season. They build nothing enduring. They are leaves on the flood, swept wherever the current is strongest *today*.”

  He turned to me. “The famine? Foreseeable. Not this blight specifically, but scarcity. Drought. Pestilence. The founders knew the risk. They weighed the fertile valley against the *permanent* safety of thousands downstream. They chose the works. They chose the sacrifice, knowing the price might be paid again, in hunger, in hardship, by those who came after. The price was *known*, Merra. It is written into the Second Instrument: *'For the permanent assurance of the lower reaches, the upper valley is yielded unto the Standing Water, its memory forfeit.'* They accepted the cost.”

  His gaze swung back to the girl. “Releasing the bond now? It teaches only one lesson: that the bond was ever only a threat. A bluff. That when the wind shifts, when the hunger bites, the loudest voices, the most immediate fear, can shred parchment and stone. What then of the next pact? The next dam? The next sacrifice demanded for a future beyond the horizon? Who will trust the League’s word across generations if we teach them it dissolves under pressure?”

  He leaned forward, his intensity pinning her. “You speak of your sister’s children. What of *their* children? Draining the Standing Water removes the flood buffer for one melt season. The founders’ survey –” he gestured towards the Seal, “– the *revised* figures sealed within, completed *after* ratification, show the odds of a catastrophic flood in an unprotected year are not negligible. Not remote. They are… substantial. A gamble. We risk drowning the very people we seek to feed *now* to plant a field that might save them *later*. And if the flood comes? What then of the bond? It becomes a monument to our panic and our broken faith.”

  He paused, the weight of decades pressing down. “The alternative to keeping the bond is not freedom for the living. It is rule by the clamor of the present moment. It is the tyranny of the loudest hunger. The bond protects the League from itself, from its own fleeting desperation.”

  The girl looked stricken. Elgar’s argument was formidable, clean, anchored in the very bedrock of the polity’s existence. He wasn’t protecting his office; he embodied it. He wasn’t callous; he saw a longer, grimmer road. He believed, utterly, in the continuity of the League as an entity that transcended the fleeting lives of its members. The woman who swore the oath might be gone, struck from the roll, but the League remained. Its promise endured.

  The silence stretched. The wind pressed. The girl’s eyes were wide, reflecting the flickering lamplight. She saw the logic. She felt the weight. She also felt the phantom ache of hunger, the remembered cries from the world outside this stone tomb.

  I cleared my throat. “Elgar speaks true. The founders foresaw hardship. They deemed the promise worth the price, across generations.” I met his flinty gaze. “But the woman who swore the oath, Elgar. The woman whose name was struck from the roll, whose property was divided, whose family mourned her… where is she?”

  He frowned. “She is the League.”

  “Is she?” I pressed. “The Instrument is clear: a Keeper is not made until *both* Striking and Apprising are done. Until then? She is not Keeper. The League, as embodied in its sworn officers? She is not part of it. She is in-between. A ghost. The oath was sworn by the *Keeper*. But the Keeper-to-be? The one who exists only in this limbo between Striking and Apprising? She never swore. Her name is ash on the roll. Her millstone turns for others. Her sister has keened her dirge. Who, then, is bound?”

  I turned to the girl. “You sit here, Kaela. But Kaela is dead. The syndics said so. The law says so. Your family believes it. The property is sold. You are… unmade. The oath binds the *Keeper*. But you are not yet Keeper. The bond binds the League. But are *you* the League? Tonight? In this moment? Before the words enter your mind and make you part of this machine of forgetting?”

  Elgar slammed his hand on the table, a sharp crack in the stillness. “Sophistry, Merra! Word games! The rite is a formality! The continuity–”

  “Is it?” I interrupted, my voice rising slightly. “Look at her! Is she the League? Or is she a girl whose life was taken from her yesterday? Whose future was sold? Who sits here, terrified, holding a key she doesn’t understand and cannot use without destroying it? The oath was sworn by a person who ceased to exist the moment the Striking was done. The bond was made by people long dust. It binds… whom? A name? A concept? A river?”

  I leaned towards the girl, my voice dropping. “The Clause of the Unmade exists. It is part of the Instrument. It allows a petition by one who is not yet bound by the knowledge that would make the bond feel real. It acknowledges this… gap. This discontinuity. It was left as a form of words, they thought. A dead letter. But it breathes tonight. It points to the truth Elgar denies: that the person who took the oath is not the person who must break it. They are separated by rites, by property, by mourning, by death itself. The League is a river, but the water flowing through it now is not the water that flowed then. The oath binds the banks, perhaps, but the water is new.”

  “And the banks must hold!” Elgar hissed. “Or the river is lost!”

  “Or perhaps,” I said, looking only at the girl, “the banks need to shift, just once, to let the water find a course that doesn’t drown the fields downstream.” I gestured towards the Seal. “The revised figures are inside. Completed *after* ratification. They revised the flood odds *upward*, Elgar. The founders knew the gamble was worse than they first admitted when they drowned the valley. They sealed it. They bound us in ignorance. Is a bond based on withheld knowledge truly binding? Or is it a trick?”

  Elgar’s face tightened. He knew I was right about the figures. It was the deepest shame of the Keepers. “The bond stands,” he said, his voice final, hollow. “Knowledge or ignorance, the promise was made. To break it is to break faith.”

  The girl had been silent, absorbing the duel. Now, she spoke, her voice thin but clear. “I am… nothing. No one. Kaela is dead. The Keeper is not made. I am… the Unmade.” She looked at the Seal. “To petition, I must not know. But to know… is why I would petition.” She looked at me, then at Elgar, her eyes searching the faces of the dead and the bound. “You must tell me. To get the petition. But if you tell me, I cannot file it. There is no way.”

  The horrific perfection of the founders’ trap yawned before us. The only mechanism for release was designed to annihilate itself upon activation. It was intolerable. It was the only way such a deep entrenchment could possibly function – a release clause operable only by one who didn't know why release was needed or desired.

  “There is a way,” I said quietly. “One way only.”

  Elgar stiffened. “Merra, do not–”

  “The petition requires three signatures,” I continued, ignoring him, my eyes locked on the girl’s. “Yours, mine, Elgar’s. But it is only *valid* if filed by one not yet Apprised. By you. Filing it requires writing your name – your *current* designation – on the petition and presenting it to the syndics.”

  “But if I know…” she whispered.

  “If I tell you the contents of the Seal, you are Apprised. You become Keeper. You lose the standing of the Unmade. Your signature on a petition then would be invalid. Worse, it would be a fraud.”

  “So you cannot tell me,” she said, despair creeping in.

  “I must tell you,” I said. “Because only knowing the truth – the revised odds, the true cost, the founders’ final, secret calculation – can inform your decision. Only knowing makes the petition meaningful. Only knowing makes the breaking of the bond a conscious act, not a blind stab in the dark. But knowing destroys your ability to file.”

  The paradox was absolute, suffocating. The wind’s pressure felt like a physical force.

  “The founders,” Elgar said, his voice a dry whisper, “were thorough.”

  “They bound our hands *and* our minds,” I agreed. “They ensured we could not easily want what they forbade. And they ensured that wanting it, truly understanding the cost of the bond and the cost of breaking it, would come at the price of the very mechanism for release.” I looked at the girl, this unmade cipher. “Unless…”

  “Unless?” she breathed.

  “Unless the one who knows… the one who is Apprised… files the petition *as if* they were still Unmade.”

  Silence. Profound, echoing silence broken only by the wind and Elgar’s sharp intake of breath.

  “Forgery,” he rasped. “A lie. Upon the Seal itself.”

  “Is it?” I asked, looking not at him, but at the girl. “Who are you? Officially? Before the syndics? You are ‘The Unmade Successor, Designated Second Keeper.’ You have no other name. Your old name is struck away. Your new name – your Keeper’s designation – is not yet conferred. You are legally a title. An office-not-yet-assumed.” I leaned closer. “If *you*, the bearer of that designation, the one who holds the legal status of the Unmade, sign the petition *before* the Apprising… is it a lie? Or is it the only truth the law allows you?”

  “But *I* would know,” she said, her eyes wide with the horror and the glimmer of possibility. “When I sign… I would know.”

  “Yes,” I said. “But the law doesn’t ask what you know in your heart. It asks for the designation. ‘The Unmade Successor’. It asks for the signature of that entity. And that entity exists only until the Apprising words are spoken. Sign *before* the words are spoken. Sign *as* the Unmade. Then… hear the truth.”

  Elgar pushed himself up, trembling with outrage. “This is corruption! It violates the spirit! The intent!”

  “The spirit?” I turned on him, my own voice rising. “The intent was to bind forever with a release clause that couldn’t work! The spirit is the dead hand clutching the living throat! The law gives us a designation: ‘The Unmade Successor’. That is who she is, Elgar! That is all she is, until the words are said! Let her act as what she is! Let her file the petition *as* the Unmade. Then, and only then, Apprise her. Let the syndics see the petition signed by the Unmade. Let them hear the truth from the newly Apprised Keeper. Then let *them* decide, with open eyes, whether the bond holds or breaks. Let the living League, informed, choose.”

  “It is a trick!” Elgar spat.

  “It is the only way the Clause of the Unmade can function!” I countered. “Otherwise, it’s a cruel joke! It acknowledges the gap between the swearer and the actor, then slams the door on it! This way… this way uses the gap. It uses the legal fiction that Elgar calls a formality, but which took her name, sold her mill, and made her family mourn! If the fiction is real enough for that, Elgar, it is real enough for this signature!”

  The girl stood up suddenly, her chair scraping loudly. She walked to the Seal chest, placed a hand on its cold, riveted iron. She didn’t look at us. “The famine is real,” she said, her voice low. “The revised odds… are they worse?”

  I glanced at Elgar. He closed his eyes, a spasm of pain crossing his face. He gave a single, curt nod. “Substantially worse. A spring flood in an unprotected year… the lower towns… they would be swept away. Utterly. The risk is… grave.”

  She absorbed this, her hand still on the iron. “And the valley… if drained? If planted?”

  “It could feed the League,” I said. “For a generation. If the flood doesn’t come.”

  She turned. Her face was pale, resolute. “I will sign,” she said. “As the Unmade Successor. Then… you will Apprise me. Then… the syndics will know the truth. All of it. The bond. The cost of keeping it. The cost of breaking it. The founders’ secret. The revised odds. All of it.” She looked at Elgar. “Then the living League decides. Not the loudest. Not the most afraid. The League, informed. As the founders never let us be.”

  Elgar stared at her, then at me. The fight seemed to drain out of him, replaced by a profound, weary sorrow. He saw the logic, the terrible, necessary bending of the founders’ design to serve the polity they had ostensibly bound. He saw the girl, weaponizing her own legal non-existence against the dead hand. He saw the end of the absolute bond. He slowly, painfully, lowered himself back into his chair. He said nothing.

  I took a deep breath, the dust of a century catching in my throat. I moved to the writing desk against the wall, pulling out parchment, ink, and the heavy stylus reserved for Seal business. I wrote the formal petition, the words stark and simple under the flickering lamp: *We, the undersigned Keepers of the Seal, jointly petition for the immediate opening of the Seal and the suspension of the Standing Clause provisions pertaining to sluice management, pursuant to Article Seven (Clause of the Unmade) of the Second Instrument.*

  I signed. *Merra, First Keeper.*
  I slid it to Elgar. He stared at it for a long moment, the weight of twenty-six years pressing down. Then, with a hand that trembled only slightly, he took the stylus. *Elgar, Third Keeper.*
  I slid it to the girl. She picked up the stylus, her hand steady. In the space provided, she wrote, with careful clarity: *The Unmade Successor, Designated Second Keeper.*

  The designation. Not a name. A legal ghost signing its own ephemeral existence onto the page.

  She handed the stylus back. It was done.

  “Now,” she said, her voice betraying the first tremor. “Apprise me.”

  I walked to the Seal chest. Elgar turned his face away, staring into the shadows. I took the heavy key from around my neck, unlocked the complex mechanisms, and swung open the massive door. Inside lay three sheets of vellum, brittle with age, covered in precise, faded ink. The founders’ final survey. The revised figures. The truth they buried beneath the Standing Water and sealed behind ignorance.

  I took them out. The lamplight seemed to dim as I held the secret of the League. I turned to the Unmade girl, who was no longer unmade the moment I began to speak.

  “Listen,” I said, my voice echoing slightly in the stone room as the wind pressed relentlessly against the walls of the Seal House. I began to read the figures, the probabilities, the cold, hard calculus of risk and sacrifice that had drowned a valley and bound a people for generations. The numbers filled the air, stark and undeniable.

  I read the final summation, the revised odds of a catastrophic flood in an unprotected year. The number was higher, much higher, than anyone outside this room could imagine. It wasn't a gamble; it was a terrifying roll of the dice against the lives of thousands. I saw the blood drain from her face as the implications hit. The salvation of the valley came shadowed by the specter of utter annihilation downstream.

  When I finished, the silence returned, heavier than before, thick with the knowledge that now bound her as Keeper. The Unmade was gone. In her place sat the Second Keeper, burdened with the League’s darkest secret and the weight of the choice she had set in motion, yet legally powerless to file the petition she had just signed.

  The petition lay on the table, bearing the signatures of three Keepers, one of them signed under a designation that had ceased to exist moments after the ink dried. A valid petition? A legal fiction? A necessary fraud? The syndics would have to unravel that knot.

  The girl – the new Keeper – stared at the petition, then at the open Seal chest, then at the ancient sheets in my hands. Her eyes held no youthful certainty now, only the stunned horror of the Apprised.

  The wind pressed. Dawn was still hours away. The petition needed to be filed with the syndics before their morning convening. Someone had to carry it down from the Seal House, through the waking, hungry town, to the Council Hall.

  Elgar remained motionless, a statue of grief turned away from us.

  I looked at the new Keeper, her face pale in the lamplight. I looked at the petition. I looked at the open Seal chest, the truth exposed on the table. Then I carefully, deliberately, folded the three brittle sheets of vellum. I did not return them to the chest. Instead, I placed them on top of the signed petition. I gathered both together, the secret and the plea bound as one.

  I picked up the oil lamp.

  “Wait here,” I said, my voice unnaturally calm. My boots echoed on the stone floor as I walked towards the heavy oak door leading out of the Seal House. I unbolted it. The predawn air, cold and smelling of damp earth and distant smoke, rushed in, making the lamp flame gutter wildly. I stepped across the threshold, out of the house of forgetting, into the grey world where names mattered and hunger was real. I pulled the door shut behind me. The heavy thud echoed in the stillness, leaving the two Keepers – the old and the new – alone with the open chest and the pressing wind.

  I walked down the path, the lamp casting a small, bobbing circle of light on the frost-rimed gravel. The folded petition and the three sheets of vellum were a solid weight against my chest inside my tunic. The town below was silent, waiting. The Standing Water lay to my left, an invisible, massive presence under the starless sky. I held the light aloft and walked towards the sleeping Council Hall, the only sound the crunch of gravel under my boots and the relentless, pressing wind.

  ---

  **Note (148 words):**

  The story tests the **legitimacy of constitutional precommitment when enforced by manufactured ignorance and radical legal discontinuity between oath-taker and bound actor**.

  The structure favors **releasing the bond**. It does this by:
  1.  Making the cost of keeping it immediate and catastrophic (famine).
  2.  Emphasizing the girl's legal non-identity ("Unmade") as a rupture severing her from the original oath-takers.
  3.  Revealing the founders' bad faith (withheld knowledge of increased flood risk).
  4.  Framing Elgar's defense as prioritizing abstract continuity over concrete survival and informed consent.

  The weakest point is **Elgar's case**. While eloquently presented, the story offers no countervailing *future* catastrophe avoided by keeping the bond (only the immediate flood risk, revealed *after* the oath, weakens his position). His argument relies heavily on abstract principle, making his defeat feel inevitable rather than tragic.

  ---
  **Note on Interpretation:**

  The ending is deliberately ambiguous:

  *   **Compliance:** The narrator carries the petition *with* the sealed sheets to the syndics, ensuring they see both the legal request and the damning truth before deciding. She upholds the process initiated by the Unmade's signature and the Apprising.
  *   **Defiance:** By taking the sealed sheets *out* of the Seal House – a potential violation of her oath – and carrying them with the petition, the narrator ensures the secret *will* be exposed, regardless of the petition's legal status. She forces transparency, breaking the founders' designed ignorance. Her action prioritizes informing the League over strict adherence to the Seal's protocols.
