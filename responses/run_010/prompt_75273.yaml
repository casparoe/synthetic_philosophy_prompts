  Hmm... the colleague's passage oversimplifies in ways that would make economists bristle. The "preference=choice" equation is a polemical reading, not settled fact. Afriat's theorem actually proves the opposite of what she claims - it establishes testable constraints. And Little's critique is about normative limitations, not descriptive emptiness. 

  The behaviorism analogy is shaky too. Economists never denied mental states exist; they bracketed them operationally. That's more like methodological behaviorism than Watson's radical version. The colleague seems to conflate ontological and epistemic positions. 

  Notably, the user already suspects where the problems lie. Their phrasing - "contested reading", "dispositional definition", "covert value assumptions" - suggests they've done homework. This isn't a novice query. The colleague might be overextending her historian's license when discussing economics. 

  The real tension here is between historical narrative and technical accuracy. The "revolt against inner states" framing leads the colleague to overstate parallels. In psychology, behaviorism rejected mentalism; in economics, revealed preference was a response to cardinal utility debates. Different contexts, different stakes. 

  I should emphasize where economists would nod (Little's normative point) versus where they'd protest (Afriat misinterpretation). The "bookkeeping device" dismissal especially undersells how revealed preference underpins modern welfare economics and index theory. 

  The user needs ammunition for constructive feedback that preserves collegial harmony. Best to flag "defensible but disputed" interpretations clearly so they can say "some economists read it this way, but others..." rather than "you're wrong". 

  ...time to structure this carefully. First untangle Samuelson's actual position, then Afriat's real significance, then Little's valid but narrow critique. The behaviorism analogy deserves its own dissection since it's the chapter's framing device. Must distinguish between "empty" as untestable versus "empty" as normatively useless - the colleague conflates them. 

  Crucially, the user's instinct about dispositional definitions is correct. That's the philosophy of science lens this needs. I'll use solubility as they suggested to show how revealed preference can be both definitional and empirically constrained. 

