prompt: |-
  Third-year jurisprudence PhD here — dissertation on constitutional entrenchment — and for four years I've been running a Tuesday-night Nomic game with about nine people from the department (the Suber thing that got published in Hofstadter's column: mutable and immutable rules, proposals adopted by majority, immutable rules have to be transmuted before you can touch them). We have a standing three-person Committee on Order that rules whether a proposal is in order before it goes to the floor, and I chair it. Over four years we've accumulated a body of rulings I want to write up as a little case study, partly because we've never articulated a doctrine and partly because I have to decide a nasty one on Thursday and I'd rather be consistent with ourselves than just vote my gut.

  The skeleton, so the rulings make sense. Rule 204 is our rule of change and it's immutable: "a proposal to add, amend, repeal, or suspend a rule is in order if seconded and adopted by a majority of players present and voting; a rule marked immutable may be amended or repealed only by a two-thirds vote of all players." Rule 205 is precedence: immutable beats mutable, lower number beats higher. Rule 118, the elimination rule (a player at or below zero points is out), was marked immutable in year one. The rulings, with the single line we put in the minutes each time:

  1. Year 1, Prop 4 — mark 118 immutable and append "and this rule may not be amended, repealed, or suspended." Adopted 6–3. Minute: "204 gives us the power to make rules immutable and says nothing against protecting them once made."
  2. Year 1, Prop 11 — rejected 7–2. Would have ended the game outright once the pot passed a threshold, repealing 204 in the process. Minute: "if 204 is gone nothing makes our votes count; we have no power to vote ourselves out of a game."
  3. Year 2, Prop 19 — amend 204 by adding "204 may not be amended or repealed." Rejected 8–1. Minute: "a rule of change that forbids its own amendment stops being a rule of change, and if we can't fix 204 we can't fix anything."
  4. Year 2, Prop 23, three weeks after 19 — amend 204 to insert a separate tier: "a proposal whose only effect is to add or remove an immutability marker requires a two-thirds vote of all players." Adopted 6–3. Two of us objected that this gutted Prop 4's protection by going around it; the minute answers: "4 protects 118 against proposals about 118. This is a proposal about markers." Over the next two weeks the table used that tier to strip 118's immutability and then repeal 118, both adopted, no objection from the Committee.
  5. Year 3, Prop 31 — a single proposal containing two clauses that flatly contradicted each other with no precedence hook. Rejected 9–0 as drafted and sent back; resubmitted with "in case of conflict the first clause prevails" and adopted. Minute: "we can't tell the table what to do with a ruleset that gives two answers to the same question."
  6. Year 3, Prop 36 — "this rule is repealed at the moment any player proposes to repeal it." Adopted 5–4. Minute: "self-referential and strange but perfectly determinate; the Committee checks that a rule can be applied, not that it's ordinary."
  7. Year 3, Prop 41 — "any person admitted to the game after this date thereby waives, permanently and irrevocably, the right to vote on proposals concerning rule 118." Rejected 5–4. Minute: "members hold the voting power by being members; we can't take it away from people who aren't here yet and can't object."

  Thursday's case is Prop 47, drafted by a player who has clearly been reading my chapter drafts over my shoulder: "Rule 204 is amended by adding the following sentence: a proposal that would amend, repeal, suspend, or lower the voting threshold specified in this sentence may be adopted only by a vote of every player eligible to vote, and only if that same proposal also repeals every rule then marked immutable." There's a threshold drafting dispute — is that sentence part of 204, hence immutable, hence already amendable at two-thirds of all players under 204's own existing text, which the sentence appears to contradict? The proposer says no, it's a new rule sitting under 204, and that we're being pedantic. Note it isn't contradictory in the Prop 31 sense; you can always tell exactly what it demands, it just demands a lot.

  So: work out which principles our seven rulings are jointly consistent with. I can see at least a formalist one (in order iff properly moved and determinate, never look through the text at what the rule does), a framework-preservation one (out of order iff it disables the machinery by which future change happens), a level-based one (entrenchment is legitimate downward but never on the rule of change itself), and something like a no-lock-in principle keyed to effects rather than wording — but tell me if there are others that fit better or if some of my four don't actually survive the full list. For each, say what it predicts for 47 and why, including how it handles the awkward ones (Prop 23's marker loophole is where I expect most of them to squeak). Then give me the ruling you think is most defensible as a continuation of our own line, name the closest analog among the seven, and write the actual one-line minute I could read out to the table without blushing. The part I most want is the doctrinal cost either way: if we adopt, are we committed to saying entrenchment is only ever a matter of the words used, so a unanimity-plus-poison-pill clause on the entrenching clause is as legitimate as the flat bar we rejected in Prop 19? If we reject, are we claiming a substantive power to look past text at consequences — which is precisely what Prop 36's minute says we don't have? And is form-versus-effect really the live axis here, or is the real question the continuing versus self-embracing sovereignty thing (Hart's vocabulary I think, don't quote me on that)? Also: is any one of the seven flatly inconsistent with the rest such that we should overrule it rather than distinguish it, and if so which? Finally propose one or two test proposals for next term that would actually come apart on the surviving principles — I'm vaguely thinking delay-instead-of-bar, or unanimity of those present rather than of all eligible players, but tell me which pair genuinely discriminates. No references or reading list, I've got the constitutional-law side covered; I want the reasoning about our own precedents.
reasoning: |-
  Okay, let me start by unpacking this user's query. They're a PhD student in jurisprudence working on constitutional entrenchment, running a Nomic game for four years. They've built up a set of rulings from their Committee on Order and need to decide on Prop 47. The main challenge is to identify consistent principles from past rulings and apply them to the new proposal.

  First, I need to review the seven rulings they provided. Each one has a minute that captures the core reasoning. Let me list out the key points from each:

  1. **Prop 4 (Year 1)**: Allowed making Rule 118 immutable and adding extra protection. The minute states that Rule 204 permits making rules immutable without restrictions on additional protections.
  2. **Prop 11 (Year 1)**: Rejected a proposal to end the game by repealing Rule 204. The reasoning was that without Rule 204, the voting mechanism ceases to exist, so they can't vote themselves out.
  3. **Prop 19 (Year 2)**: Rejected amending Rule 204 to make it unamendable. The minute argues that a rule of change that can't be amended stops being functional.
  4. **Prop 23 (Year 2)**: Created a separate tier for immutability markers. This allowed circumventing Prop 4's protections by targeting markers instead of the rule itself. The Committee accepted this, stating that Prop 4 only protected Rule 118 against direct proposals, not markers.
  5. **Prop 31 (Year 3)**: Rejected a contradictory proposal without precedence. It was adopted only after adding a conflict resolution clause. The minute emphasizes the need for determinacy in rules.
  6. **Prop 36 (Year 3)**: Adopted a self-referential rule that repeals itself upon proposal. The Committee focused on the rule being determinate, not its strangeness.
  7. **Prop 41 (Year 3)**: Rejected a rule that would waive future members' voting rights. The minute states that membership confers voting rights, which can't be preemptively waived.

  Now, the user is dealing with Prop 47, which amends Rule 204 to require unanimity and the repeal of all immutable rules for any changes to this new sentence. The dispute is whether this sentence is part of Rule 204 (thus immutable) or a new rule.

  The user wants to identify consistent principles from the past rulings. They mentioned possible principles like formalism, framework preservation, level-based entrenchment, and no lock-in. I need to test each principle against all seven rulings to see which holds up.

  Starting with **formalism**: This principle would focus on whether a proposal is properly moved and determinate, without considering its effects. It fits most rulings: Prop 4 (wording allows extra protection), Prop 11 (repealing Rule 204 removes the voting mechanism), Prop 19 (self-entrenchment stops the rule of change), Prop 23 (targeting markers is different from targeting the rule), Prop 31 (indeterminate without conflict resolution), Prop 36 (determinate despite strangeness), Prop 41 (can't bind future members not present). However, Prop 11 and Prop 19 involve some consideration of consequences (framework collapse), which might not be purely formalist.

  Next, **framework preservation**: This focuses on whether the proposal disables future change. It fits Prop 11 (ending the game disables change), Prop 19 (self-entrenchment prevents fixes), and possibly Prop 41 (restricting future voters could undermine the framework). But it struggles with Prop 23, which allowed circumventing immutability protections, potentially enabling framework instability. Prop 23 wasn't rejected, so this principle might not fully align.

  **Level-based entrenchment**: This suggests entrenchment can apply downward but not upward to the rule of change itself. Prop 19 rejects self-entrenchment of Rule 204. Prop 23's marker loophole allows changing immutability, which could be seen as affecting levels. Prop 4 protected a lower rule, which fits, but Prop 23 bypassed that protection. So this principle is inconsistent with Prop 23.

  **No lock-in (effect-based)**: This looks at preventing irreversible changes. Prop 11 (game can't end), Prop 19 (Rule 204 can't be self-entrenched), Prop 41 (can't bind future voters) support this. But Prop 23 allowed stripping immutability, which is a form of lock-in removal, and Prop 4 added lock-in. Prop 36's self-repeal is reversible. The inconsistency here is with Prop 23, which permitted a loophole that enabled lock-in removal.

  From this, the most consistent principle across all seven rulings is **framework preservation with a formalist constraint**. The Committee prioritizes the game's ongoing functionality but only intervenes when the proposal's text directly causes indeterminacy or framework collapse. Prop 23 is the outlier; it was allowed because the text targeted markers, not the rule, showing a formalist approach even if it had framework consequences.

  Now, applying this to **Prop 47**. The proposal adds a sentence to Rule 204 requiring unanimity and repeal of all immutable rules for amendments to this sentence. Under formalism, it's determinate, so it should be in order (like Prop 36). But framework preservation would see that this could make Rule 204 unamendable in practice, similar to Prop 19. However, unlike Prop 19, it doesn't outright forbid amendment but sets near-impossible conditions. The minute from Prop 19 emphasized that a rule of change must remain fixable. Prop 47's conditions (unanimity plus poison pill) could effectively freeze Rule 204, risking framework collapse if unanimity isn't achievable.

  The closest analog is **Prop 19**, which rejected self-entrenchment. Prop 47 is a form of self-entrenchment via extreme procedural hurdles. The doctrinal cost: If adopted, it affirms that entrenchment depth is purely textual, allowing procedural locks as long as they're worded carefully. If rejected, it maintains that the rule of change must remain practically amendable, looking beyond text to effects—contradicting Prop 36's minute. However, Prop 36's rule was determinate and didn't threaten the framework, whereas Prop 47 does.

  The real question here is **continuing vs. self-embracing sovereignty**. Prop 47 is self-embracing, attempting to bind future sovereignty absolutely. The Committee's history (Prop 11, 19) favors continuing sovereignty—the game must always be amendable.

  For the ruling, rejecting Prop 47 as out of order under framework preservation, distinguishing it from Prop 23 because Prop 23 didn't target Rule 204's amendability. The minute could be: "Rule 204 is the foundation of all change; proposals rendering it practically unamendable are as fatal as outright prohibition."

  Test proposals for next term:
  1. **Delay instead of bar**: "Amending Rule 204 requires a 2/3 vote and a 6-month waiting period." Tests if procedural hurdles are acceptable if not impossible.
  2. **Unanimity of present vs. all eligible**: "Amending Rule 204 requires unanimity of players present." Distinguishes between quorum hurdles and absolute impossibility.
answer: |-
  Based on a systematic analysis of your seven Committee on Order rulings, I identify **two core principles** that are jointly consistent across all precedents and resolve Prop 47: **Formal Determinacy** (a proposal is in order if textually unambiguous and procedurally proper, regardless of perceived absurdity or consequences) and **Framework Perpetuity** (a proposal is *out of order* only if it *textually disables the game’s capacity for future rule-change*). These principles are harmonized by a key caveat: Framework Perpetuity is triggered only when the proposal’s *express language* (not its likely effects) dismantles the machinery of change. No precedent is irreconcilably inconsistent, but Prop 23’s “marker loophole” is the stress test—it survives because it formally targeted a distinct procedural tier. Below, I unpack the principles, apply them to Prop 47, provide a ruling, and propose doctrinal tests.

  ### Principles Derived from Precedents
  1. **Formal Determinacy (FD)**  
     - **Definition**: A proposal is in order if (a) it is grammatically/logically coherent (no unresolvable contradictions), and (b) it operates within the existing rule structure (e.g., uses valid procedures, targets mutable rules).  
     - **Supported by**: Prop 4 (extra protection valid under 204’s silence), Prop 23 (targeting “markers” was distinct from targeting the rule), Prop 31 (rejected only when contradictory, adopted when precedence added), Prop 36 (self-repeal is odd but clear), Prop 41 (waiver invalid because membership/voting rights are defined by participation, not pre-commitment).  
     - **Limits**: Does *not* require rules to be sensible or efficient—only applicable.

  2. **Framework Perpetuity (FP)**  
     - **Definition**: A proposal is out of order if its *text* explicitly abolishes, suspends, or renders impossible the *process of future rule-change* (e.g., by destroying the rule of change, making it unamendable, or removing all agency to vote).  
     - **Supported by**: Prop 11 (repealing 204 destroys voting power), Prop 19 (self-entrenchment makes 204 unamendable, halting all change).  
     - **Not triggered in**: Prop 4 (protecting 118 doesn’t touch 204), Prop 23 (marker changes don’t disable 204), Prop 31/36/41 (no textual threat to framework).

  **Why other principles fail**:  
  - **Level-Based Entrenchment** (downward legit, upward not) conflicts with Prop 23: Allowing marker changes to strip 118’s immutability lets lower rules indirectly alter higher-level protections.  
  - **No Lock-In (Effect-Based)** is inconsistent with Prop 4 (added lock-in), Prop 23 (enabled lock-in removal), and Prop 36 (allowed self-repeal lock-in). Your rulings focus on text, not consequences.  
  - **Pure Formalism** is almost sufficient but doesn’t explain Prop 11/19 rejections: Those relied on *textual* self-destruction of the framework.  
  - **Sovereignty Theory** (Continuing vs. Self-Embraced): Your precedents favor *continuing* sovereignty (future players must retain amendatory power), but FP operationalizes it textually. Prop 19 rejected self-embracing sovereignty (204 binding itself absolutely).

  ### Application to Prop 47
  Prop 47 amends Rule 204 to add:  
  > *"[New Sentence] A proposal that would amend, repeal, suspend, or lower the voting threshold specified in this sentence may be adopted only by a vote of every player eligible to vote, and only if that same proposal also repeals every rule then marked immutable."*

  **FD Analysis**:  
  - The rule is **determinate**: It clearly demands unanimity + a “poison pill” (repeal all immutables) for amendments targeting itself. No Prop 31-style contradiction.  
  - **Formal status**: The sentence is part of Rule 204 (it amends 204, so it inherits immutability). Thus, amending it *already* requires a 2/3 vote under 204’s existing text. The new sentence contradicts this by imposing unanimity + poison pill.  
  - **FD Prediction**: *In order*. Like Prop 36, it’s “strange but determinate.” The drafting dispute is irrelevant—FD cares only that the text is unambiguous, not whether it’s “pedantic” or clever.  

  **FP Analysis**:  
  - The proposal **textually disables future change** in two ways:  
    1. It makes Rule 204 *practically unamendable*: Unanimity of *all eligible* players is likely unattainable (as opposed to unanimity of those present). Worse, the poison pill requires repealing *all* immutable rules simultaneously, which could include core rules (e.g., if 118 were re-immuted). This echoes Prop 19’s concern: A rule of change that cannot be amended “stops being a rule of change.”  
    2. It creates a *procedural paradox*: To amend 204’s new sentence, players must repeal *every* immutable rule—but if 204 itself is immutable (as it is), repealing it requires satisfying the new sentence’s demands *first*. This circularity risks deadlock.  
  - **FP Prediction**: *Out of order*. Like Prop 19, it “stops being a rule of change” by making 204 unfixable. Distinguish from Prop 23: Prop 23 altered *how* immutability works without crippling 204’s function.  

  **Doctrinal Costs**:  
  - If you **adopt**: You commit to FD alone, allowing *any* entrenchment depth if textually clear (e.g., unanimity-plus-poison-pill is valid). This overrules Prop 19’s spirit but not its letter (Prop 19 barred amendment outright; 47 imposes conditions). Prop 36’s “no consequences” stance would be absolute.  
  - If you **reject**: You uphold FP, affirming that Rule 204 cannot be textually shackled into uselessness. This *does* look at consequences (e.g., “practically unamendable”), but only when the text *explicitly* creates impossibility (unlike Prop 36, which was workable). The live axis is **sovereignty**: Rejecting 47 preserves *continuing sovereignty* (future players can always amend 204), while adopting enables *self-embracing sovereignty* (47 binds future players absolutely).  

  ### Ruling and Minute for Prop 47
  **Ruling**: **Out of order** under Framework Perpetuity.  
  **Closest Analog**: **Prop 19** (rejected self-entrenchment of 204). Prop 47 is self-entrenchment via procedural impossibility, not textual contradiction (Prop 31) or strangeness (Prop 36).  
  **One-Line Minute**:  
  > *"Rule 204 is the sole engine of change; proposals rendering it practically unamendable, whether by bar or by impossible conditions, are as fatal to the game as its repeal and thus out of order."*  

  **Why Defensible**:  
  - Consistent with Prop 11/19’s framework focus, while respecting Prop 23/36’s formalism. Prop 23 is distinguished: Marker changes didn’t threaten 204’s function, while 47’s poison pill does.  
  - Avoids overruling any precedent: Prop 19 addressed *total* prohibition; 47 addresses *functional* prohibition via extreme hurdles.  

  ### Test Proposals for Next Term
  To tease apart FD vs. FP, propose rules altering 204 with:  
  1. **Delay Instead of Bar**:  
     *"Amending Rule 204 requires a two-thirds vote of all players and a six-month waiting period before adoption."*  
     - **FD/FP Outcome**: In order. Adds burden but doesn’t make amendment impossible (unlike 47’s unanimity). Contrast with Prop 19/47.  

  2. **Unanimity of Present, Not All Eligible**:  
     *"Amending Rule 204 requires a unanimous vote of players present and voting."*  
     - **FD/FP Outcome**: In order. Attainable (like Prop 36’s self-repeal), so no FP concern. Distinguishes from 47’s “all eligible,” which is FP-triggering.  

  **Why These Tests**: They isolate whether FP bars *all* burdens on 204 (rejecting both) or only *impossible* ones (rejecting 47 but accepting these). If both are in order, FP is narrow (only absolute bars); if both are rejected, FP is broad (any encumbrance). Prop 47’s “all eligible” + poison pill is the FP bright line.  

  ### Final Note
  Prop 23 isn’t inconsistent but is a tension point: Your Committee allowed textual literalism (markers ≠ rules) to enable framework instability. Upholding FP in Prop 47 reins this in by drawing a line at *direct, textual sabotage of 204*. This balances your history: Formalism governs until the framework’s survival is textually at stake.
