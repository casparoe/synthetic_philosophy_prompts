answer: |-
  **The phenomenon you describe is best termed the *Sacrificial Imperative*.**

  **Reasoning:**

  1.  **Core Elements Captured:** This term foregrounds the defining features:
      *   **Sacrificial:** The core commemoration is the *price paid* (deaths) framed as a deliberate offering.
      *   **Imperative:** This emphasizes the *compulsion* inherent in the narrative – the defenders *had* to choose death because the *only alternative presented and accepted as real within the myth is dishonor*. The "imperative" reflects both the perceived necessity of the outcome and the moral compulsion to embrace it.

  2.  **Distinction from Established Concepts:**
      *   **Noble Defeat/Heroic Last Stand:** These focus on bravery against odds but *do not inherently require* the insistence on *known, inescapable doom* or the *rejection of evidence suggesting honorable alternatives*. They can coexist with "near-win" consolations.
      *   **Trauma/Grief:** These describe psychological responses but not the specific narrative *structure* demanding inevitability and rejecting contingency.
      *   **Politics of Grievance:** While often fueled by such narratives, grievance politics doesn't specify the *sacrificial logic* or the *refusal of contingency* central to your phenomenon.
      *   **Mythic Repair:** The *Sacrificial Imperative* is a *specific subtype* that *subverts* typical mythic repair. While employing some consolations (treachery, numbers), it paradoxically *requires* the core sacrifice to be seen as *unavoidable* to retain its value, rejecting repairs that introduce contingency.

  3.  **Diagnostic Test:** Does the commemorative narrative **actively resist historical evidence or interpretations suggesting a feasible, honorable alternative course of action (withdrawal, negotiation, surrender with honor) that could have averted annihilation**, *even if that evidence makes the defenders seem more rational or likely to survive*? If yes, and the resistance stems from a perceived threat to the *meaning* of the sacrifice (turning it from imperative to mistake), it fits the *Sacrificial Imperative*.

  4.  **Boundary Cases Explained:**
      *   **"Did not die in vain":** This *denies futility* (implying the sacrifice achieved something). The *Sacrificial Imperative* *embraces* apparent futility (doom was certain) but imbues it with transcendent value *through* the act of freely choosing it *because* no honorable alternative existed. It's about the *nature of the choice* under constraint, not the outcome's utility.
      *   **Confederate Memory (Lost Cause):** This *relies* on contingency ("If not for X, we would have won!"). It preserves the *winnability* of the cause, explaining defeat via external factors (overwhelming force, betrayal). The *Sacrificial Imperative* *rejects* winnability; the cause is lost *because* the only honorable choice was death, making the defeat inherent to the chosen act.
      *   **Dunkirk:** This celebrates *successful contingency* (the rescue) and *survival*. The emphasis is on escape from doom, not the embrace of certain death as the only honorable path. Contingency (weather, Hitler's halt order) is welcomed as providential, not rejected as undermining sacrifice.
      *   **Religious Martyrdom:** The difference runs deeper than *just* the nature of the refused alternative (dishonor vs. apostasy/fatality). While structurally similar (offer refused, death chosen), religious martyrdom:
          *   Is fundamentally about *witness* (martyr = witness) to faith, often seeking death as a positive good or guarantee of salvation.
          *   The "imperative" is theological (obedience to God, rejection of false gods), not primarily socio-political or focused on communal honor/national identity in the secular sense described.
          *   The value lies in the act of witnessing/faithfulness itself, not strictly in the *refusal of a dishonorable earthly alternative* as the *only* way to preserve honor for a group. The *Sacrificial Imperative* is secular-political in its core commemorative function, valuing the death as the *ultimate price paid* to avoid dishonor, cementing group identity and values.

  **Conclusion:** The *Sacrificial Imperative* names the narrative structure where commemorative power derives from framing defeat as a *freely chosen* sacrifice *compelled* by the *absolute absence* of any honorable alternative, leading to active resistance against historical interpretations that introduce contingency or suggest such an alternative existed. It values the *price paid* under conditions of maximal freedom and maximal necessity, rejecting revisions that would transform sacrifice into avoidable error.
