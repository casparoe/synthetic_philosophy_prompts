  Hmm... their examples reveal three key challenges: First, how to handle collaborative creation when submissions require individual authorship. Second, whether editorial resurrection of unpublished work constitutes original achievement. Third, if AI-assisted composition fundamentally alters artistic merit. 

  The user's buried request seems to be for legitimacy - both in process (to avoid another public relations disaster) and in philosophical grounding (to justify their aesthetic judgments). They're frustrated with ad-hoc rulings but wary of overcomplicated systems. That "full disclosure" about loving the archival manuscript suggests they also want ethical cover for potential biases.

  Notably, they've already identified the relevant philosophical touchstones: Goodman's autographic/allographic distinction, Danto's "artworld" context, and the intentional-historical theory of art. The challenge is distilling these into operable questions without academic jargon. 

  The solicitor's involvement creates an interesting constraint - legal approval needed but no aesthetic arbitration. This means the procedure must produce defensible documentation while preserving artistic judgment. The three-juror dynamic (bookseller/teacher/novelist) suggests needing questions that draw on different kinds of literary expertise without requiring specialized knowledge.

  For the test cases: The spouse scenario tests where "suggestions" become co-authorship. The archival case probes whether cultural preservation qualifies as creative achievement. The AI example forces confrontation with non-human creative agency. A robust procedure should likely exclude at least one - probably the AI-assisted entry based on prize conventions, though the user personally favors the archival work.

  The real pitfall would be creating a system that's either so rigid it can't handle novel situations (like AI) or so flexible it reproduces their current subjectivity. The exit ramps need to be clearly marked - especially where factual inquiry ends and value voting begins.
answer: |-
  Here’s a decision procedure grounded in authorship philosophy, distilled to 3 pages of plain English. It focuses on **creative agency**—the core idea that a prize for "second-book achievement" should reward *a human creator overcoming artistic challenges*. It explicitly rejects valuing *only* the text itself (the "flawless copy" argument) because literary prizes celebrate *human endeavor in context*.  

  ---

  ### **LITERARY PRIZE AUTHORSHIP DECISION PROCEDURE**  
  *(For flagged entries only. Run time: 20 mins max)*  

  #### **CORE PRINCIPLE**  
  This prize rewards **a living human author’s original creative achievement** in writing their second book. We care about:  
  - **Who did the work?** (Not just ideas, but sustained *creative execution*).  
  - **Was it meaningfully their work?** (Not an artifact, AI output, or another creator’s labor).  
  - **Does it represent *their* artistic growth?** (Aligned with a "second-book" prize).  

  ---

  ### **STEP 1: ASK THESE QUESTIONS (IN ORDER)**  
  **Ask the entrant in writing. Allow 1 week for reply. Jurors review answers together.**  

  1. **"Did you personally execute the *primary creative act* of writing this book? By 'primary creative act,' we mean: generating the text, making key stylistic/narrative choices, and revising the manuscript through your own intellectual/artistic labor."**  
     - ✅ **Sufficient answer:** "Yes, I did this." (Proceed to Q2).  
     - 🚩 **Non-answer/Problem:** "No," or "Mostly, but..." (Skip to STEP 2B).  

  2. **"Did anyone else contribute *creative text* (e.g., writing/rewriting sentences, paragraphs, or chapters) beyond minor editing (e.g., grammar, suggestions)?"**  
     - ✅ **Sufficient answer:** "No." (Entry valid; stop here).  
     - 🚩 **Non-answer/Problem:** "Yes" or unclear (e.g., "They helped polish"). Proceed to Q3.  

  3. **"If others contributed creative text: What specific portions did they write/rewrite, and what was your role in those sections?"**  
     - ✅ **Sufficient answer:** Clear description (e.g., "They drafted Chapter 3; I revised it entirely").  
     - 🚩 **Non-answer/Problem:** Vague, evasive, or admits major external authorship (e.g., "They rewrote the climax"). Proceed to **STEP 2A**.  

  ---

  ### **STEP 2A: ASSESS CREATIVE CONTROL**  
  *(If Q1-3 reveal significant external input)*  
  **Answer this:**  
  >*"Did the entrant retain **final creative authority** over the work? (i.e., Could they reject/rework all external contributions without constraint?)"*  
  - **Yes** → Entry valid *if* external help was disclosed and ≤30% of text.  
  - **No** → Disqualify (work isn’t *their* achievement).  
  - **Unclear** → Proceed to **STEP 2B**.  

  ---

  ### **STEP 2B: VOTE ON ARTISTIC AGENCY**  
  *(Triggered by: Non-answers, major external input, AI, or resurrected works)*  
  **Jurors vote on:**  
  >*"Does the entrant’s role represent the core *creative achievement* of this book?"*  
  - Consider:  
    - Is the entrant the **driving artistic force**?  
    - Is the work **meaningfully "theirs"** (not an artifact or AI product)?  
    - Would awarding this prize **align with celebrating a *living author’s growth***?  
  - Vote: ✅ Valid | ⚠️ Borderline | ❌ Invalid  
  - **Outcome:**  
    - **Unanimous ✅** → Entry valid.  
    - **Unanimous ❌** → Disqualify.  
    - **Split vote** → Entry invalid (*too ambiguous to reward*).  

  ---

  ### **KEY RULES & FAILURE MODES**  
  - **What we can’t solve:**  
    - We can’t verify truth (e.g., "spouse only gave suggestions").  
    - **Solution:** Vote on plausibility + consistency. If still split → disqualify (risk > reward).  
  - **Where this isn’t about facts:**  
    - **STEP 2B is purely philosophical.** It asks: *"What is this prize for?"* Explicitly:  
      - ✅ Valid if we value **the author’s creative struggle**.  
      - ❌ Invalid if we’re just rewarding **a great text regardless of origin**.  
  - **Failure modes:**  
    - **Catches easily:** Blatant ghostwriting, undisclosed AI.  
    - **Waves through:** Convincing liars, "minor" help that’s actually major (if well-hidden).  
    - **Weak spot:** "Gray area" collaborations (e.g., spouse "suggestions"). We err toward disqualifying if doubt exists.  
  - **Checklist ≠ objectivity:** STEP 2B is judgement dressed as a vote. Own it.  

  ---

  ### **TESTING THE CASES**  
  **Case 1: The Spouse**  
  - Q1: "Yes, I wrote it." → Proceed.  
  - Q2: "He made suggestions." → Unclear. Proceed to Q3.  
  - Q3: "He read it and gave notes." → Vague. Proceed to **STEP 2A**.  
  - STEP 2A: "Final creative authority?" Entrant claims yes. → Borderline. Proceed to **STEP 2B**.  
  - **STEP 2B VOTE:**  
    - *"Is SHE the core creative force?"* Mutual acquaintance claims spouse rewrote 1/3 "line by line." Her answer downplays this.  
    - **Verdict:** Likely split vote (2❌/1✅) → **DISQUALIFY**.  
    - *Why?* Evidence suggests loss of creative control. Prize rewards *her* achievement, not her spouse’s.  

  **Case 2: The Box (Resurrected Manuscript)**  
  - Q1: "No, I didn’t write it." → 🚩 Proceed to **STEP 2B**.  
  - **STEP 2B VOTE:**  
    - *"Is the ACADEMIC the core creative force?"* No—she edited/tidied a dead writer’s work.  
    - *"Is the work meaningfully 'hers'?"* No—it’s another artist’s achievement.  
    - *"Does this align with a prize for a *living author’s growth*?"* No—the creator is deceased.  
    - **Verdict:** Unanimous ❌ → **DISQUALIFY**.  
    - *Painful but necessary: The prize isn’t for curators.*  

  **Case 3: The AI-Assisted Book**  
  - Q1: "No—AI drafted it; I revised." → 🚩 Proceed to **STEP 2B**.  
  - **STEP 2B VOTE:**  
    - *"Is the HUMAN the core creative force?"* Partially—but AI generated the raw material.  
    - *"Is the work meaningfully 'theirs'?"* Debatable—the *foundation* isn’t human.  
    - *"Does this fit a prize for *artistic struggle*?"* AI reduced the creative burden.  
    - **Verdict:** Likely split (2❌/1✅) → **DISQUALIFY**.  
    - *Why? The "achievement" hinges on non-human agency. The prize is for writers, not editors of AI output.*  

  ---

  ### **SUMMARY**  
  - **What it does:** Forces explicit discussion of *creative agency*, not just text quality. Rejects "flawless copy" logic.  
  - **What it throws away:**  
    - Perfect objectivity (prioritizes defensible decisions over impossible truth).  
    - "Death of the author" purism (explicitly values the creator’s role).  
  - **Outcome:** 2/3 test cases disqualified. The procedure *isn’t* a rubber stamp.  
  - **Print this, use it, and good luck with your draft.**  

  ---  
  *Grounding: Draws on Goodman’s "autographic/allographic" distinction (prioritizing the *creative process* over the output), Danto’s "artworld" (context matters), and intentional-historical theories of art (the work’s origin defines it). Compromises made for usability: Simplified vote replaces nuanced aesthetic theory; bright-line rules (e.g., 30% external text) impose practicality.*
