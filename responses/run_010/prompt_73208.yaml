          Then, if the tribunal rules "violation" and the RC overrides, then additionally -5 DL and -5 IL. If no violation, no extra loss. (The card itself doesn't have DL/IL change, but the override does, but that's separate). Alternatively, we can put the hidden effect as only GoP, and the legitimacy is affected by the tribunal and override in general? But other cards have fixed DL/IL effects.

     Let's separate the effects: the card's hidden effect includes DL and IL changes only if specified. For this card, we can say:
          GoP: +8
          DL: 0 (but then the tribunal and override affect it)
          IL: 0 (same)

     But then it's inconsistent. Better to have the hidden effect include the DL/IL changes that are fixed, and then the tribunal and override add extra.

     We'll design the card effects for GoP, and then the DL and IL changes are fixed in the card, but for the undecidable cards, the DL and IL changes are conditional. To simplify, we can have:

     For all cards, the hidden effect is:
          GoP: [number]
