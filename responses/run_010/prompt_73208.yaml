     Effect: If the tribunal ruled "no violation", they must vote again. If they change to "violation", then -5 IL for RC. Otherwise, no effect.

  This should be runnable. The instructor should prepare the cards in advance.

  In the debrief, if the rubric doesn't fail during re-judging, the instructor can point out that the rubric might have been written broadly enough, but then ask: "Did the rubric capture the cumulative effect? Or did it only judge each move in isolation?"

  Also, note that the hidden effects are not known during the re-judging, so they are judging based on the public justification and the outcome? But they don't know the outcome. In the re-judging, they only know the move and the justification, not the effect. It's a pure rubric application.

  Finally, the part that the game can't reproduce: the slow erosion over time, the fact that it's often popular (whereas in the game moves usually lose legitimacy), and the real-world knowledge of how it ends.

