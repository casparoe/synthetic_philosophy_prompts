      Institution: Public Order

  Opposition protest cards (5 types, make 3 copies of each so they can have a deck to draw from? Or just have 5 unique cards and they get 3 at random):

  1. Mass Protest:
     Effect: -5 GoP, -3 DL

  2. International Condemnation:
     Effect: -10 IL

  3. Media Campaign:
     Effect: -5 DL

  4. Strike:
