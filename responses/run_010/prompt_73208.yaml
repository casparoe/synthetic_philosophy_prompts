          IL: [number]

     But for the undecidable cards, we set DL and IL to 0, and then the tribunal ruling and override determine the actual DL/IL impact via the voting of DPO and IO? Not exactly. The hidden effect is applied by the instructor, so for undecidable cards, we can have:

     Anti-Corruption Cleanup:
          GoP: +8
          DL: 0
          IL: 0
          Then, after the tribunal ruling and override, the DPO and IO vote, and that vote determines the DL and IL change (which is separate from the card effect). But the DPO and IO vote always happens and always changes DL and IL by ±2. 

     Alternatively, we can let the hidden effect of the card be conditional on the tribunal ruling? Too complex for the game flow.

     I think we should make the hidden effect fixed for all cards, and the undecidable ones are designed to have small effects or effects that are not clearly negative. For example:

  6. Anti-Corruption Cleanup:
     Effect: +8 GoP, -2 DL, -2 IL   (because even genuine efforts might be seen as partisan)

  7. Campaign Finance Rule:
     J: "We are increasing transparency by requiring disclosure of campaign donations."
     Effect: +5 GoP, -2 DL, -2 IL   (similarly, might be seen as targeting opponents)

  8. National Security Law:
     J: "To keep our citizens safe, we are enhancing surveillance capabilities."
