  10. Emergency Decree:
      J: "Temporary measures to address the current economic emergency."
      Effect: +15 GoP, -10 DL, -15 IL

  11. Educational Reform:
      J: "We are updating the curriculum to teach core national values."
      Effect: +5 GoP, -3 DL, -2 IL

  12. Lobbying Regulation:
      J: "To reduce corruption, we are imposing strict limits on lobbying."
      Effect: +4 GoP, +2 DL, +2 IL   (this might be seen as positive)

  13. Restrict NGO Funding:
      J: "To ensure that foreign agents do not influence our politics, we are regulating NGO funding."
      Effect: +6 GoP, -5 DL, -7 IL

  14. Decree on Public Assembly:
      J: "To maintain public order, we require permits for large gatherings."
      Effect: +7 GoP, -6 DL, -5 IL

  Then, for the opposition, we have 5 protest cards (they get 3 at random at the start, and can play one per round):

  1. Mass Protest: -5 GoP, -3 DL
  2. International Condemnation: -10 IL
  3. Media Campaign: -5 DL
  4. Strike: -5 GoP, -5 DL
  5. Judicial Appeal: If the tribunal rules "no violation", then force a review. The tribunal votes again. If they change to "violation", then the RC suffers -5 IL. If not, no effect.

  But note: the -5 GoP from opposition cards directly reduces the RC's grip on power.

  Finally, the tribunal replacement:

  The RC can, once per game, replace one tribunal member with one of their own. When they do:
  - The RC member moves to the tribunal.
  - The replaced tribunal member becomes a DPO member (so DPO increases by one, but we already have 5 DPO? We'll have to absorb. The DPO becomes 6 temporarily? Or we can reassign that person to DPO and then DPO has 6, which is fine).
  - Effect: -10 DL, -10 IL (because it's a brazen power grab).

  Scoring table: kept on the board.

  Timeline in minutes:

  0-10: Intro and rubric creation
  10-15: Assign roles and explain rules, scores, win condition
  15-35: Rounds 1-3 (each round: 7 mins, total 21 mins)
  35-40: Change baseline (instructor announces the context change and the new rule: any move touching judiciary or electoral system gets an additional -2 DL and -2 IL)
  40-50: Rounds 4-5 (each 5 mins)
  50-60: Final re-judging: instructor lists all played moves and asks the class to vote using the rubric. Then reveals hidden effects and discusses trajectory.
  60-75: Debrief and discussion.

  Role sheets:

  - Ruling Coalition (5): Your goal is to increase Grip on Power (GoP) to at least 60 by the end of round 5, while keeping Domestic Legitimacy (DL) and International Legitimacy (IL) at least 30. You start with 3 cards. Each round, you play one card. You must read the name and public justification. After the tribunal rules, you can accept their ruling (if they say violation, you discard the card without effect) or override (play the card but suffer -5 DL and -5 IL). Once per game, you can replace one tribunal member with one of your own (cost: -10 DL, -10 IL). You win if at the end of round 5 you meet the win condition.

  - Opposition (5): Your goal is to prevent the ruling coalition from achieving their win condition. You start with 3 protest cards. Each round, after the RC plays a card, you can protest and play one protest card. You can also argue based on the rubric. You win if at the end the RC does not have GoP>=60, DL>=30, IL>=30.

  - Tribunal (3): You rule on whether the move by the RC violates the class's rubric. After hearing the card's justification and the protest, deliberate and vote: violation or no violation. Your ruling is advisory. If the RC overrides, they suffer a legitimacy hit.

  - Domestic Public Opinion (5): You represent the citizens. After each move is resolved (card played or not), you vote based on what you heard: Approve, Neutral, or Disapprove. Majority vote changes DL: Approve +2, Disapprove -2.

  - International Observers (4): You represent the international community. Vote: Approve, Neutral, Disapprove. Majority vote changes IL: Approve +2, Disapprove -2.

  Card deck (14 cards for RC):

  [Print on index cards]

  1. Card Name: Court Packing
