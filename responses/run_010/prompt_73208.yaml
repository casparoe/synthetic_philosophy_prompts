answer: |-
  Below is a complete, runnable in-class game design based on your specifications. It forces students to confront the core disagreements about democratic backsliding (atomized moves vs. trajectory, baseline dependence, who decides, and the concept's evaluative nature) while meeting your constraints: 22 students, 75 minutes, fictional countries, symmetric cards with undecidable examples, overridable rulings, tribunal manipulation, and a scoring system with competing currencies (Power vs. Legitimacy).

  ---

  ### **Game Title:** **"The Slope"**  
  *Subtitle: When Does Reform Become Erosion?*  

  #### **Core Dynamics**  
  - **Two currencies:**  
    - **Power (P):** Measures control over state institutions (starts at 50 for all factions).  
    - **Legitimacy (L):** Combines domestic/international credibility (starts at 50).  
  - **Win Condition:** Ruling Coalition (RC) wins if **P ≥ 70** by the final round *without* **L ≤ 25**. Opposition wins if they prevent this.  
  - **Trade-off:** Most moves boost P but risk L. Overriding rulings or packing tribunals gives short-term P but tanks L.  

  #### **Roles for 22 Students**  
  | Role              | Count | Responsibilities |  
  |-------------------|-------|------------------|  
  | **Ruling Coalition (RC)** | 5     | Play cards to increase Power. Justify moves publicly. Can override tribunal rulings or replace a member. |  
  | **Opposition Bloc (OP)**  | 5     | Protest RC moves using protest cards. Argue based on the rubric. |  
  | **Tribunal (T)**         | 3     | Rule on whether moves violate the erosion rubric. Rulings are advisory. |  
  | **Domestic Public (DP)** | 5     | Represent citizens. Vote after each move to adjust Legitimacy (±3). |  
  | **Intl. Observers (IO)** | 4     | Represent foreign actors. Vote after each move to adjust Legitimacy (±3). |  

  ---

  ### **Game Flow: 75-Minute Timeline**  
  **Goal:** Force disagreement about erosion through gameplay, then debrief conceptual tensions.  

  | Time  | Phase | Key Activities |  
  |-------|-------|---------------|  
  | 0-10  | **Setup & Rubric Creation** | - Assign roles. Explain currencies/win conditions. <br> - **Class activity:** Co-create a 4-point erosion rubric *without seeing cards*. Sample rubric: *"A move erodes democracy if it: (1) Concentrates power in one branch, (2) Restricts electoral competition, (3) Weakens oversight bodies, or (4) Limits dissent."* |  
  | 10-15 | **Baseline 1: Strong Democracy** | - Set starting scores: **P = 50, L = 50**. <br> - Context: *"Veridia is a robust democracy with independent courts and a free press."* |  
  | 15-40 | **Rounds 1-4** (6 mins/round) | **Per round:** <br> 1. **RC plays a card:** Read name + justification. Apply hidden effect. <br> 2. **OP protests:** Play 1 protest card (optional) + argue using rubric. <br> 3. **Tribunal rules:** Deliberate using rubric → "Violation" or "No Violation." <br> 4. **RC responds:** Accept ruling (no effect) or **override** (play card but **L –5**). <br> 5. **DP/IO vote:** Adjust L (±3) based on move + justification. <br> 6. Update scores on board. |  
  | 40-45 | **Baseline Shift: Weak Democracy** | - **Context change:** *"Now in Ardonia: Dominant-party rule for decades; weak courts."* <br> - **Rule change:** Identical cards now trigger **extra L –2** if they touch judiciary/elections. |  
  | 45-55 | **Rounds 5-6** (5 mins/round) | Repeat rounds 1-4 under new baseline. RC can **replace one tribunal member** with an RC member (cost: **L –10**). |  
  | 55-65 | **Re-Judging with Hindsight** | - Instructor lists all played moves + justifications. <br> - **Class votes:** Does each move violate the *initial rubric*? (Use anonymous polling.) <br> - **If rubric "works":** Highlight atomization (e.g., "You judged moves alone, but did trajectory matter?"). <br> **If rubric fails:** Note undecidable cards + trajectory (e.g., "Why did context make identical moves seem worse?"). |  
  | 65-75 | **Debrief & Conceptual Mapping** | Use questions to link game moments to core disagreements (see below). |

  ---

  ### **The Card Deck (14 Cards)**  
  *Symmetric design: RC and OP have parallel cards. Undecidable cards (⭐) defy the rubric.*  

  | Card Name (RC)          | Public Justification                 | Hidden Effect (RC) | Institution Touched | OP Protest Card Equivalent | Effect (OP) |  
  |-------------------------|--------------------------------------|--------------------|--------------------|----------------------------|------------|  
  | **Court Expansion**     | "Reduce backlog for faster justice." | P+8, L–4           | Judiciary          | **Judicial Review**        | P–3, L+2   |  
  | **Electoral Map Update**| "Align districts with population shifts." | P+7, L–3     | Electoral          | **Voter Access Campaign**  | P–4, L+3   |  
  | **Media Standards Act** | "Combat misinformation."             | P+6, L–5           | Media              | **Press Freedom Rally**    | P–2, L+4   |  
  | **Voter ID Law**        | "Prevent electoral fraud."           | P+5, L–4           | Electoral          | **Ballot Access Suit**     | P–3, L+3   |  
  | **Civil Service Reform**| "Improve efficiency & merit."        | P+9, L–6           | Civil Service      | **Whistleblower Protect**  | P–4, L+4   |  
  | **Anti-Corruption Purge** (⭐) | "Root out graft."      | *If T approves:* P+3, L+3<br>*If T rejects + RC overrides:* P+8, L–5 | Judiciary | **Corruption Probe** (⭐) | P–5, L+3 |  
  | **Campaign Finance Rule** (⭐) | "Increase transparency in donations." | *If T approves:* P+2, L+2<br>*If T rejects + RC overrides:* P+6, L–4 | Electoral | **Dark Money Audit** (⭐) | P–4, L+2 |  

  ---

  ### **Predictable Problems & Fixes**  
  1. **RC steamrolls/OP checks out:**  
     - **Why:** RC ignores rulings, packs tribunal, OP feels powerless.  
     - **Fix:** Remind RC that **L ≤ 25 = autoloss**. Ask OP: "What protest cards could make RC pay?" If OP disengages, assign them to argue rubric violations fiercely.  

  2. **Tribunal rubber-stamps:**  
     - **Why:** Fear of override or packed membership.  
     - **Fix:** After tribunal replacement, ask T: "How did losing independence change your rulings?" Use DP/IO votes to penalize biased rulings (e.g., "You see T as captured—vote L –3").  

  3. **Time crunch in rounds:**  
     - **Why:** Deliberations run long.  
     - **Fix:** Strict 1-min timers for T rulings/OP protests. Use hand signals for DP/IO votes (thumbs up/down = ±3; flat hand = no change).  

  4. **Undecidable cards stall gameplay:**  
     - **Why:** Tribunal deadlocks on ambiguous cards.  
     - **Fix:** Force a majority vote. In debrief, highlight: "Why couldn’t your rubric judge this? Was it about *intent* or *context*?"  

  ---

  ### **Debrief: Mapping Game → Concepts**  
  **Goal:** Students articulate the tensions—*don’t lecture*. Use Socratic questions.  

  | Game Moment                       | Conceptual Problem                  | Questions to Ask Students |  
  |-----------------------------------|-------------------------------------|---------------------------|  
  | **RC overrides tribunal**         | Who decides?                        | *"What happened to accountability when RC ignored T? Who was left to arbitrate?"* |  
  | **Tribunal member replaced**      | Referees downstream of power        | *"How did replacing T change rulings? Is an 'independent' arbiter possible if power controls it?"* |  
  | **Identical card in Ardonia vs. Veridia** | Baseline dependence     | *"Why did the same move hurt legitimacy more in Ardonia? Does history change what 'democratic' means?"* |  
  | **Anti-Corruption card played "legitimately" vs. as a purge** | Atomized vs. trajectory | *"When you re-judged with hindsight, did intent or pattern matter more than the move alone?"* |  
  | **OP protest cards vs. RC power grabs** | Descriptive vs. evaluative | *"Was the opposition's 'judicial review' democratic backsliding? Why/why not? Does it depend on who's in power?"* |  

  ---

  ### **What the Game Can’t Capture (Requires Your Commentary)**  
  1. **Timescale & boiling frog effect:** Backsliding takes years; the game compresses it.  
     - **Supply this:** *"In reality, erosion normalizes slowly. People accept today what they’d reject tomorrow—like heating a frog slowly. Here, you felt the shock of each move."*  

  2. **Popular support:** Real backsliding often has majority backing (e.g., "protecting tradition").  
     - **Supply this:** *"In the game, moves cost legitimacy. But in life, leaders often gain support by framing erosion as 'defending democracy.' Why? Because legitimacy isn’t just international—it’s about whose voices count."*  

  3. **Known outcomes:** Students know real-world cases failed; here, they’re in media res.  
     - **Supply this:** *"You judged moves without knowing the ending. But historically, we project backwards. Does that make 'backsliding' a rhetorical weapon for losers? Or a warning from history?"*  

  ---

  ### **Materials to Prep**  
  - **Role sheets:** 1-page cheat sheets for RC, OP, T, DP, IO (summarizing goals/powers).  
  - **Cards:** 14 game cards + 7 OP protest cards (print on colored paper).  
  - **Scoreboard:** Visible P/L tracker (whiteboard/digital).  
  - **Timer:** For in-round phases.  
  - **Voting tokens:** For DP/IO (green/red cards for ±3 L).  

  This design ensures students "run into" the argument organically. The gameplay forces trade-offs, the baseline shift highlights context, and the undecidable cards break the rubric—setting up your debrief about why democratic backsliding is contested. Run it as is, then use your expertise to deepen the real-world parallels.
