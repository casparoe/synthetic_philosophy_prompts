answer: |-
  ## Research Proposal: Calibration and Target Failures in the Criteria of Authenticity for the Historical Jesus

  **1. Research Question:**
  Can the documented breakdowns of individual criteria of authenticity (dissimilarity, embarrassment, multiple attestation, coherence, Semitic linguistic influence, environmental fit, resistance to tradition tendency) be systematically attributed to either **(a) *calibration failure*** (unknown/biased error rates, potentially correctable through probabilistic aggregation) or **(b) *target failure*** (the criteria aim at a non-existent "authentic kernel" inaccessible via cultural/social memory processes)? Furthermore, given the non-independence of sources and criteria applied to them, does probabilistic aggregation of *correlated* criteria yield a materially different assessment of historical plausibility compared to informal cumulative approaches, and under what specific conditions (parameter ranges) is such aggregation potentially beneficial or futile for the historian?

  *   **Why it can fail:** This question fails if:
      *   The distinction between calibration and target failure proves empirically or conceptually incoherent for specific criteria (e.g., if "embarrassment" inherently *requires* a later community perspective, making target failure inseparable).
      *   The inherent correlation structure of errors across criteria proves impossible to model meaningfully, even for heuristic purposes, due to irreducible historical complexity.
      *   Analysis reveals that *all* significant breakdowns stem definitively from target failure, rendering calibration efforts irrelevant.
      *   Parameter sensitivity analysis shows that even plausible ranges for error rates and correlations lead to results indistinguishable from, or more unstable than, traditional informal approaches.

  **2. Working Hypothesis:**
  Critiques of the criteria often conflate two distinct problems. The *calibration objection* argues the criteria are poorly understood detection tools: their error rates are unknown, asymmetric (e.g., dissimilarity excludes authentic material intelligible to contemporaries; embarrassment captures only *later* community discomfort), and applied naively (seriatim with informal tallying). This objection suggests repair is possible via error rate estimation and probabilistic aggregation. The *target objection*, rooted in cultural/social memory theory, argues the criteria chase a phantom – the original utterance/event – fundamentally inaccessible through the lens of communal memory formation and transmission. Here, better calibration is useless; the target itself is illusory. Our hypothesis is that prising these objections apart clarifies the viability of the criteria project: calibration failures *might* be mitigated, but target failures are fatal for the criterion's original purpose. Furthermore, aggregating criteria *without* accounting for their correlated errors (stemming from shared dependence on the output of a few early communities under similar selection pressures) likely distorts cumulative assessments. The viability and value of aggregation depend critically on the specific parameter ranges (error rates, correlation strengths).

  **3. Why the Question Remains Open:**
  Existing positions represent unsatisfactory poles:
  *   **Rehabilitation via Substitute Criteria:** Efforts to replace flawed criteria (e.g., "memory distortion" models, "historical plausibility") often inadequately address *which* underlying failure mode (calibration vs. target) doomed the originals. They risk merely shifting the calibration problem or inadvertently succumbing to the target objection by redefining "authenticity" without confronting memory theory's core challenge to atomistic retrieval.
  *   **Wholesale Abandonment:** Radical critiques (often from memory studies perspectives) frequently dismiss *all* criteria based primarily on the target objection, potentially overlooking whether *some* criteria (or their aggregated use) might function as useful, albeit imperfect, heuristics for plausible historical trajectories within the tradition if recalibrated, even if not retrieving ipsissima verba. They also tend to downplay the challenge of constructing positive historical accounts *without* some evaluative principles.

  Neither pole adequately disentangles the calibration/target distinction or rigorously models the consequences of correlated errors inherent in applying multiple criteria to interdependent traditions.

  **4. Methodology & Timeline:**

  *   **Months 1-3: Conceptual Groundwork & Failure Mode Taxonomy:**
      *   Deconstruct each major criterion (Dissimilarity-single/double, Embarrassment, Multiple Attestation, Coherence, Semitic Influence, Environmental Fit, Resistance to Tradition) to formalize its implicit detection logic.
      *   Systematically catalog documented critiques and failures of each criterion.
      *   Classify each critique/failure as primarily indicative of **Calibration Failure** (CF - e.g., asymmetric errors, unquantified reliability, context insensitivity) or **Target Failure** (TF - e.g., assumes atomistic transmission, neglects memory's constructive nature, seeks an inaccessible origin point). Identify criteria where failure seems inherently hybrid.
      *   *Deliverable:* Detailed taxonomy mapping criteria to specific CF and TF vulnerabilities.

  *   **Months 4-6: Formalizing Criteria as Error-Prone Tests & Modelling Correlation:**
      *   Conceptualize each criterion as a diagnostic "test" for "authenticity" (acknowledging the target problem), characterized by estimated *sensitivity* (true positive rate) and *specificity* (true negative rate), recognizing these are likely asymmetric and unknown.
      *   Formalize the concept of **correlated errors**: How does dependence on shared sources (Mark, Q, Pauline tradition), forms, and the selective pressures of early communities (e.g., missionary needs, conflict, worship) induce correlation in the errors of different criteria applied to the same unit of tradition (e.g., a saying)? Develop a conceptual model of these dependencies.
      *   Construct simplified Bayesian network or sensitivity analysis models to explore the impact of (a) varying individual criterion error rates (sensitivity/specificity), (b) varying strengths of error correlation between criteria, and (c) prior probabilities of authenticity, on the posterior probability derived from aggregated criteria results. Focus on understanding *interactions* (e.g., how high correlation negates benefits of multiple attestation).
      *   *Deliverable:* Conceptual model of error correlation sources; initial formal models demonstrating the impact of correlation and parameter ranges on aggregation.

  *   **Months 7-9: Parameter Ranges & Aggregation Viability:**
      *   Drawing on historical scholarship (without claiming precise quantification), define *plausible ranges* for error rates (e.g., "Dissimilarity likely has high specificity but very low sensitivity") and correlation strengths (e.g., "Criteria applied to sayings only in later Gospels likely have highly correlated errors due to shared dependence on earlier, adapted traditions").
      *   Run sensitivity analyses across these plausible ranges. Identify regions where:
          *   Aggregation significantly improves reliability over single criteria.
          *   Aggregation offers little benefit over single criteria.
          *   Aggregation produces highly unstable or misleading results (especially under high error correlation or extreme error rates).
          *   Aggregation is fundamentally futile regardless of calibration (indicating dominance of TF).
      *   Apply the model heuristically to 1-2 contested case studies (e.g., the Baptism of Jesus, the "Render unto Caesar" saying) to illustrate the practical implications of CF, TF, and correlation.
      *   *Deliverable:* Analysis defining parameter ranges where aggregation is beneficial/viable vs. futile/dangerous; illustrative case study applications.

  *   **Months 10-12: Synthesis, Implications, and Dissemination:**
      *   Synthesize findings: Which criteria are primarily vulnerable to CF (potentially salvageable via careful aggregation)? Which are fundamentally undermined by TF? To what extent does error correlation limit the practical utility of aggregation?
      *   Articulate the implications for historical Jesus research methodology: What, if anything, can probabilistic aggregation of criteria *reliably* achieve under realistic conditions? What are the limits imposed by TF and correlation?
      *   Develop guidelines for historians on interpreting criteria results in light of CF, TF, and correlation risks.
      *   Prepare manuscript for publication; present findings at relevant workshops/seminars.
      *   *Deliverable:* Comprehensive synthesis report; draft manuscript; presentation materials.

  **5. Defence Against Alternatives:**

  *   **Proposing New Criteria:** Avoids the core diagnostic task. New criteria will likely inherit the same fundamental CF/TF vulnerabilities unless they directly address these underlying issues. This project provides the necessary groundwork to evaluate *any* proposed criterion.
  *   **Genealogical Critique:** While valuable for exposing origins and agendas, it doesn't directly address the *functional* question of whether the criteria *could* work as detection tools if recalibrated, or whether the target itself is the problem. This project incorporates the genealogical/target critique but moves to its methodological consequences.
  *   **Accumulation of Case Studies:** Essential empirical work, but lacks the systematic framework to diagnose *why* criteria fail in specific cases (CF vs. TF) or model the systemic effects of correlation. This project provides a conceptual and formal framework to *interpret* case studies more rigorously.

  **6. Value to Historians (Non-Philosophy):**
  A successful result provides the historian with:

  1.  A **Diagnostic Toolkit:** A clear framework to understand *why* a particular criterion might be yielding unreliable results in a given instance (Is it poorly calibrated? Is it chasing a ghost?).
  2.  **Realistic Expectations:** Concrete guidance on when applying multiple criteria is likely to strengthen an argument (specific parameter ranges) and when it is likely to be misleading or futile (due to high correlation or target failure), moving beyond vague appeals to "cumulative evidence."
  3.  **Guarded Heuristics:** Refined understanding of which criteria (or combinations) retain *some* value as indicators of plausible tradition-history trajectories within early Christianity, even if not guaranteeing "authenticity," and how to apply them with appropriate caution.
  4.  **Clarity on Limitations:** A principled argument for the inherent limitations of atomistic criteria-based approaches in the face of cultural memory processes, focusing historians on more viable questions about early tradition development and reception.

  **7. What Counts as Failure:**

  1.  **Conceptual Collapse:** The calibration/target distinction proves unusable or unproductive for analyzing criteria failures.
  2.  **Formal Model Futility:** The modelling exercise reveals only that results are catastrophically sensitive to untestable assumptions, providing no useful insights beyond "it's complicated," effectively constituting pseudo-precision.
  3.  **Universal Target Failure:** Analysis demonstrates conclusively that target failure is the *only* significant problem for all major criteria, making calibration efforts demonstrably irrelevant.
  4.  **Correlation Dominance:** Modelling shows that under *all* plausible parameter ranges, error correlation is so strong that aggregating criteria offers no meaningful advantage over single-criterion use or informal approaches.
  5.  **Lack of Historian Utility:** The final framework is perceived by historians as overly abstract, disconnected from source work, or failing to provide actionable insights for their research practice.

  **8. Candid Scope Assessment & Contingency Plan:**

  The core deliverables are the **Taxonomy of Failure Modes (CF/TF)** and the **analysis of Aggregation Viability under Correlation (parameter ranges)**. These are the minimum viable products.

  *   **Primary Cut if Short on Time:** The formal modelling (Months 4-9) would be significantly streamlined. Complex Bayesian networks would be reduced to simpler sensitivity analyses using hypothetical but plausible data points. The number of case studies (Month 9) would be reduced to one, or eliminated entirely, focusing purely on the conceptual and formal argument. The *conclusions* about plausible parameter ranges and aggregation viability would be based on the conceptual model and simplified analysis rather than extensive simulation.
  *   **Essential to Keep:** The conceptual decomposition of criteria (Month 1-3) and the synthesis of implications (Month 10-12), grounded in the taxonomy and the core insight about correlated errors, are indispensable. These provide the novel diagnostic framework and historical-methodological conclusions even without extensive formalization.

  This project offers a rigorous, philosophically informed diagnostic of a persistent methodological crisis in historical Jesus studies. By disentangling calibration from target failure and exposing the critical impact of error correlation, it seeks to move the debate beyond sterile rehabilitation/abandonment dichotomies and provide historians with a clearer, more nuanced understanding of what criteria can and cannot achieve. The deliverable is not a new method, but a map of the methodological minefield and a conditional assessment of potential paths forward.
