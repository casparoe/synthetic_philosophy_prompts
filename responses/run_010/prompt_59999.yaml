answer: |-
  ## Planning Notes (Part One)

  1.  **Elara's Discount Function:**
      *   **Present-Bias Parameter (β):** 0.3 (Strong present bias; she heavily discounts the immediate future relative to even the near future).
      *   **Long-Run Discount Rate (δ):** 0.95/year (Moderate long-term impatience).
      *   **Concrete Good:** Completing her manuscript ("The Weightless Age"). Subjective Value (SV):
          *   **1 Hour:** SV = β * δ^{1/(365*24)} * V ≈ 0.3 * 1 * V = **0.3V** (V is the long-run value; feels trivial now).
          *   **1 Month (1/12 year):** SV = β * δ^{1/12} * V ≈ 0.3 * 0.996 * V ≈ **0.299V** (Still feels almost irrelevant).
          *   **1 Year:** SV = β * δ * V ≈ 0.3 * 0.95 * V = **0.285V** (Feels distant and abstractly valuable, but less than the perceived cost of effort *now*).
      *   **Reversal 1 (Starting What She Shouldn't - New Project):** Deadline for manuscript is 6 months away. A lucrative, distracting short-term commission (value C) arises *today*. SV(Manuscript in 6 months) = β * δ^{0.5} * V ≈ 0.3 * 0.975 * V = **0.2925V**. *Today*, SV(C) = C. If C > 0.2925V, she takes the commission, judging it better *now* than the discounted manuscript. A month ago, SV(Manuscript in 7 months) ≈ β * δ^{7/12} * V ≈ 0.3 * 0.971 * V = **0.2913V**. SV(Commission in 1 month) = β * δ^{1/12} * C ≈ 0.3 * 0.996 * C = **0.2988C**. If C was less than ~0.975V, she *wouldn't* have taken it then (0.2988C < 0.2913V), but *now* (C > 0.2925V) she does. **Arithmetic:** Time proximity increases the *immediate* appeal (C) relative to the *still-discounted* future good (V).
      *   **Reversal 2 (Abandoning What She Should Finish - Void Clause):** Void Clause Fee = F. Deadline T. She sets F so SV(F paid *at t*) = SV(Repugnant Org getting paid *at T*), using β and δ. SV(Repugnant Org @ T) = β * δ^T * D (D = disgust value). She wants SV(F @ t) = β * δ^t * F = β * δ^T * D → F = δ^{T-t} * D. She calculates this at t=6 months before T (δ^{0} * D = D). Sets F = D. *But at t=1 week before T (t ≈ 0.019 years)*: SV(F paid now) = β * δ^{0.019} * F ≈ 0.3 * 0.999 * D = **0.2997D**. SV(Repugnant Org @ T) = β * δ^{0.019} * D ≈ 0.3 * 0.999 * D = **0.2997D**. **Arithmetic:** At precisely t=1 week, SV(F) ≈ SV(Disgust). Any closer, SV(F paid *immediately*) dominates. She abandons the commitment because *paying F now* feels subjectively equivalent to (or worse than) the *discounted disgust* of the org getting paid later. She quits fighting.

  2.  **Her Self-Knowledge:**
      *   Elara is partially aware. She *knows* she has a tendency to defect, especially under pressure or near deadlines, but **underestimates the magnitude of her present-bias (β) by about 30%.** She thinks her β is ~0.4, not 0.3.
      *   **Error Consequence:** This causes her to set **commitment penalties slightly too low.** She calibrates the Void Clause fee using her *perceived* β (0.4). At t=6 months: SV(Disgust @ T) = β_perceived * δ^T * D ≈ 0.4 * D. Sets F = D (so SV(F@t=0) = β_perceived * D = 0.4D ≈ SV(Disgust@T)). But her *actual* SV(F paid immediately) = β_actual * F = 0.3D. At the critical t=1 week, her *actual* SV(F) ≈ 0.3D, while her *actual* SV(Disgust@T) ≈ 0.3D. The equivalence point arrives *earlier* and feels *sharper* than she anticipated because the penalty feels subjectively smaller than she thought it would need to be. Neither a wholly unaware person (who wouldn't set penalties) nor a wholly accurate one (who would set F higher, ~D/β_actual ≈ 3.33D) would set F *precisely at D*.

  3.  **The Two Readings & The Tipping Image:**
      *   **Reading 1 (Weakness of Will):** At the moment of voiding the contract, she genuinely still *believes* she *should* finish the manuscript to avoid funding the repugnant org, but she chooses the easier path (pay F) anyway, overriding her judgment.
      *   **Reading 2 (Perceptual Error):** At the moment of voiding, the *immediate* cost of paying F has subjectively shrunk to feel *less bad* than the *discounted future bad* of the org getting paid, or perhaps they feel equal and inertia tips it. The magnitudes simply present differently; her judgment *at that moment* aligns with paying F.
      *   **Closing Tipping:** The story will tip slightly towards **Reading 2 (Perceptual Error)**.
      *   **Tipping Image:** Her hand hovering over the payment terminal for the void fee, seeing the number displayed ($D), but *not* seeing it as "$D" anymore, just as a neutral, necessary sum to stop a looming, blurry pressure – the visceral *absence* of the expected moral revulsion at the cost at that precise moment.

  ---

  ## The Weightless Age

  The dust motes danced in the late afternoon sun slanting through the high warehouse window, illuminating the skeletal outline of Elara’s third commitment device. It was an antique fireproof safe, its heavy door gaping open like a hungry mouth, utterly empty. Two years ago, she’d welded its hinges shut, sealed her laptop and the sole external drive containing the first 80,000 words of *The Weightless Age* inside, and programmed the electronic timer for a five-year countdown. The keypad display had glowed a steady, accusing crimson: 1825 DAYS. The manuscript, her decade-long attempt to capture the eerie quiet of the post-Collapse migrations, was supposed to be untouchable until its completion date.

  It lasted eleven months. The lure wasn’t money or distraction, but fear. A news report about corrupted cloud archives triggered a midnight panic: what if the drive *inside* the safe failed? What if the welding compromised the fireproofing? The *immediate*, visceral terror of losing the work *right then* dwarfed the abstract, years-distant punishment of breaking the seal. She’d attacked the hinges with an angle griner, sparks flying like frantic fireflies in the dark workshop, the shriek of metal drowning out the timer’s shrill alarm. The manuscript was safe. The commitment was dust. Just like the second device – the automatic donation scheduler set to bleed her savings dry unless she submitted chapters quarterly. She’d canceled it after the first missed deadline, the sting of the lost money less acute than the daily reminder of failure blinking on her finance dashboard.

  Now only the third device remained, and its teeth were sharper. The contract lived in a slim, grey folder beside her perpetually cold coffee mug. Clause 4b, the Void Clause, was underlined in her own shaky script: *Termination Fee: $42,000*. A sum precisely calculated, agonized over. Payable at any time. Pay it, and the contract dissolved. Don’t pay it, and fail to deliver the completed manuscript of *The Weightless Age* by midnight, October 17th, and the same sum would be paid automatically to the New Dawn Collective. New Dawn. The name tasted like ash. Their slickly produced documentaries valorizing the population ‘rationalizations’ of the Pacific Reclamation Zones – sterilizations disguised as choice, displacement sold as destiny. Elara’s book, ironically, explored the quiet resistance to exactly that kind of engineered forgetting. Funding them felt like spitting on her father’s grave in the Northern Resettlement.

  She traced the figure: $42,000. Not just money. A year of frugal living. A buffer against the freelance drought. She’d set it at that amount precisely because, from the distance of a year ago, it had seemed unthinkably high to pay *just* to quit. A sum that should *always* outweigh the temporary discomfort of working. Except at one precise point. She’d charted it, crudely, on graph paper now tucked behind the contract: a steep curve labelled ‘Cost of Paying Fee’ meeting a shallower curve labelled ‘Cost of Org Getting Money’ at a point marked with a trembling ‘X’ and ‘~1 week’. Today was October 10th.

  The clinic’s waiting room hummed with the sterile silence of expensive hope. Elara shifted in the sculpted chair, her gaze skipping over the other supplicants. A man meticulously folded a paper crane from a consent form. A woman stared at a wall displaying a mesmerizing, utterly meaningless fractal flow – CalmFocus™, a sign proclaimed. Elara recognized Dr. Anya Vance near the water dispenser. Calibrated. Three years ago. Anya moved with a terrifying economy. No wasted gestures, no flickering attention. She filled her cup, drank, placed it precisely in the recycling slot, all in one fluid motion devoid of hesitation or flourish. Like watching a very clean machine perform a simple task perfectly.

  "Anya," Elara called, her voice too loud in the hush.

  Anya turned. Her smile was pleasant, accurate, and reached exactly the right duration. "Elara. Applying for calibration?"

  "Just… considering. Observation." Elara gestured vaguely. "How is it? Truly?"

  "It is what it is," Anya said, her tone level. "Consistency. I decide. I do. The friction is gone." She glanced at her thin wrist chrono. "I must leave precisely now for my train. It arrives in seven minutes. Walking takes six point three at my pace. Buffer: thirty seconds." She nodded once, a perfect metronome beat, and walked away, her steps measured, identical, carrying her out the door exactly on schedule. Elara imagined Anya boarding the train, sitting, perhaps opening a book she had *planned* to read during the journey, and reading it. No sudden detour for coffee, no scrolling through feeds, no staring out the window lost in a thought that derailed the plan. Effortless discipline. But Elara also remembered Anya, pre-calibration, laughing helplessly at a terrible joke in a bar, tears streaming down her face, unable to stop long after the humor faded. That laugh was gone. Calibrated out? Or simply deemed inefficient?

  Across the room, Milo slouched in his chair, sketching spirals in the margin of a brochure. Milo, the prophet of predictable defection. He knew Elara’s struggles.

  "Another device bites the dust?" he murmured, not looking up.

  "The safe," Elara admitted. "Grinder."

  Milo snorted. "Predictable. Like setting a mousetrap for a tiger and being surprised when it snaps." He tapped his temple. "I know the tiger. I *am* the tiger. So I don’t build traps. No plans, no disappointments. Just… flow." He gestured vaguely at the air. "Less stressful. You keep setting traps calibrated for a house cat."

  "It’s not weakness," Elara said, the words automatic, defensive. "The values shift. What seems intolerable later feels manageable now. What feels crucial now fades later. It’s… arithmetic." It was true. And utterly unhelpful. It didn’t change the empty safe, the canceled donation, the grey folder’s weight.

  Milo just raised an eyebrow, a silent *And?*

  The Calibration Coordinator, a man whose neutral expression seemed permanently calibrated, called her name. He led her past doors marked with soft blue lights to a consultation room. The air smelled faintly of ozone and antiseptic.

  "The process is irreversible," he stated, sliding a dataslate across the sleek table. A paragraph pulsed gently. "You understand this? Not a boost to willpower. A restructuring of temporal valuation. Preferences stabilize. You will become… consistent." He pointed to a box at the bottom. "Initial here confirming irreversible comprehension."

  Elara stared at the box. Consistency. No more grinding open safes in panic. No more agonizing near deadlines. Anya boarding her train. But also, no more helpless, inefficient laughter? The fractal flow on the wall pulsed slowly, absorbingly. She thought of the grey folder. October 17th. One week. The X on her graph. She didn’t initial the box.

  The next six days were a blur of frantic typing and gnawing dread. Words came, but slowly, fighting through treacle. The world outside the manuscript – the news feeds, the messages pinging, the low thrum of the city – pressed in with alarming clarity. The $42,000 floated behind her eyes. Not a number, but a shape, a heavy, inert mass. The image of New Dawn’s logo – a stylized sun rising over geometric waves – flickered, but distantly, softened, like a bad memory viewed through fogged glass. On the morning of the 16th, she woke with a jolt. The pressure was immense, a physical weight on her chest. The manuscript needed another 15,000 words. Impossible. The Void Clause fee… $42,000… it wasn’t *good*, but it was *contained*. Payable. A single transaction. Clean. The alternative – failing, and knowing that sum was funneled to New Dawn – was a vast, sucking horror… but it was *tomorrow’s* horror. A future bad. Heavy, yes, but… diffuse. Abstract. Like the manuscript’s value a year ago.

  Ninety seconds. She stood in her cramped kitchen, the grey folder open on the counter beside the cold coffee mug. The void fee payment portal was open on her public terminal, the amount displayed: **$42,000.00**. Below it, a large, green button: **CONFIRM PAYMENT & TERMINATE CONTRACT**. The manuscript file was open on her private screen, the cursor blinking mockingly after half a sentence. The clock on the wall ticked: 11:58:30 AM. October 17th was a storm cloud on the horizon, but October 16th was the ground beneath her feet, solid and demanding.

  *Pay it. Just press it. It’s just money. You can earn it back. The contract is the trap. Free yourself.* The thought arrived fully formed, slick and persuasive. The $42,000 felt… manageable. A large number, yes, but a number she could *handle*. She pictured transferring it – the confirmation screen, the notification. Done. Dusted. The crushing pressure would lift *immediately*. The relief would be physical, sweet.

  *No. Don’t. That money going to New Dawn…* She tried to summon the image: their spokesperson’s smug face, the sterile propaganda footage of the Reclamation Zones. The visceral disgust she’d felt when drafting the contract, the righteous fury. It flickered, weak. It was… over there. Tomorrow. Abstract. The cost of paying *now*, the immediate loss of liquidity, the dent in her security – that was *here*. Solid. Real. The number on the screen pulsed slightly. **$42,000.00**. It wasn’t the cost of weakness; it was the price of immediate peace. The arithmetic of the moment balanced on a knife-edge. Paying the fee *now* felt subjectively equivalent to… maybe even *slightly* better than… the discounted awfulness of New Dawn getting the money *later*. The equivalence point her calculations predicted was here. The tiger wasn't fighting the trap; the trap simply no longer felt like a trap, just a slightly inconvenient door she needed to pay to walk through.

  Her finger hovered over the terminal’s fingerprint scanner, the green button glowing beneath it on the screen. The number **$42,000.00** filled her vision, stark and digital. It wasn’t a symbol of revulsion anymore. It wasn’t a weapon against her future self. It was just a number. A large, neutral number representing the necessary toll to make the insistent, buzzing pressure of *right now* simply stop. The image of New Dawn’s logo was a faint, grey smudge on the horizon of her mind, obscured by the immediate, tangible weight of that figure on the screen. Her hand lowered, the pad of her index finger aimed precisely at the cool glass scanner, drawn by the promise of instant, frictionless relief.
