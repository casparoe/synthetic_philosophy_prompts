  Okay, the user is two years into a joint program in legal philosophy and public international law. They've been stuck on a question about the legitimacy of the Nuremberg and Tokyo tribunals, specifically how critiques often conflate two distinct issues: retroactive criminalization and victor's justice. They want to stop debating legitimacy and instead create a forward-looking framework for a standing international criminal court. The key is that the founders might one day be defendants, so the statute must be acceptable even from that position.

  The user asks for a numbered list of desiderata with three parts each: what the theory must do, the concrete case generating it, and negotiability. They mention specific issues like notice, retroactivity vs. selectivity, reachability of pre-jurisdictional atrocities, and attribution rules. They also want markers distinguishing genuine justice requirements from domestic law artifacts. 

  Beyond the list, they want the most exclusionary desideratum, any jointly unsatisfiable subset, and a brief scoring of main theoretical contenders. Their suspicion is that non-retroactivity, reach over founders, political possibility during occupation, and condemnatory punishment can't all coexist. 

  Hmm, this is dense but fascinating. The user is clearly deep in the weeds of legal theory and wants structural clarity, not historical rehashing. Their frustration with conflated critiques suggests they value precision in disentangling normative problems. The "minefield" metaphor shows they're aware of real-world tensions but seek a principled framework. 

  For the desiderata list, I'll start with Notice as it's foundational. The Nuremberg aggression charge is the perfect case—defendants knew war was wrong but not necessarily individually criminal. Non-negotiable because it's core to rule of law. 

  Retroactivity vs. Selectivity needs separation—they're distinct problems per Tokyo dissents (Radhabinod Pal) vs. uncharged Allied bombings. Treating them as one issue smuggles in victor's privilege. Negotiable only if sovereignty limits are explicit. 

  Reachability is tricky. The pre-1939 persecution gap at Nuremberg shows why it matters, but requiring it might force questionable legal hooks. High cost if it distorts law, so negotiable. 

  Attribution rules like heads-of-state immunity (Wilhelm II precedent) and superior orders (Dönitz case) need retroactive clarity. Non-negotiable for fairness, though domestic analogies may not perfectly fit. 

  I'll add Jurisdictional Symmetry as a fifth point—the court must theoretically try founders. The Katyn omission illustrates the problem. Non-negotiable for legitimacy, but acknowledge it's aspirational. 

  The most exclusionary item? Jurisdictional Symmetry. Insisting founders are indictable makes court creation politically near-impossible during occupation (as user suspects). 

  For unsatisfiable subset: (1) Non-retroactivity + (2) Jurisdictional Symmetry + (3) Creation under occupation can't coexist. If you demand all three, no court gets formed. I'd drop symmetry as a strict requirement—not because it's unimportant, but because making it absolute paralyzes the system. Instead, build in review mechanisms for founder-conduct later. 

  Scoring contenders: 
  - Legality-first view (aggression charges invalid) fails Notice and Retroactivity—too rigid. 
  - Extreme conduct criminality handles aggression charges but not selectivity—ignores symmetry. 
  - Kelsen accepts retroactivity to seed future law, but sacrifices Notice. Pragmatic but normatively thin. 
  - Fair-warning focuses on defendant knowledge (Dönitz knew sub warfare was contested) but misses systemic issues like victor's justice. 
  - Shklar-style political legitimacy values the trial form itself, which salvages Nuremberg's didactic role but papers over legal defects. 

  User's hidden need: They want to move beyond "was Nuremberg legitimate?" debates by constructing a test that exposes trade-offs. The impossibility result they suspect is key—they're seeking intellectual honesty about necessary compromises. Their "forward-looking" framing suggests they care about institutional design more than historical judgment. 

  Final note: Their approach is refreshingly meta—using Nuremberg as a stress test for theory rather than an end in itself. The "founders as future defendants" lens is brilliant for exposing incentives.
answer: |-
  Here is a specification of desiderata for legitimate retroactive criminalization in an international criminal court statute, designed by founders who may later face trial. The list prioritizes structural principles over historical justification, using the 1945–46 tribunals as concrete reference points but not as binding precedents. Requirements marked as **"Non-Negotiable"** are framed as genuine demands of justice; **"Negotiable"** items involve trade-offs where abandonment carries explicit costs; **"Contested"** items reflect partisan demands with hidden premises.

  ### Desiderata for a Retroactive Criminalization Framework
  1. **Individual Notice**  
     - **Must**: Ensure defendants had reasonable awareness that their conduct was *criminally punishable* (not merely wrongful or illegal).  
     - **Case**: Nuremberg’s aggression charges (defendants knew war was forbidden by Kellogg-Briand but not that it entailed *individual criminal liability*).  
     - **Status**: **Non-Negotiable**. Justice requires avoidable ignorance of penal consequences. Sacrificing this legitimizes show trials.  

  2. **Separation of Retroactivity and Selectivity**  
     - **Must**: Treat retroactivity (ex post facto law) and selectivity (non-prosecution of victors) as distinct defects. A jurisdictional carve-out for founders is a *selectivity flaw*, not retroactivity.  
     - **Case**: Allied area bombing/Dönitz interrogatory (tu quoque rejected at law but acknowledged at sentencing).  
     - **Status**: **Negotiable**. Conflating them obscures accountability; giving up separation risks masking victor’s impunity as legal necessity. Cost: Erodes moral authority.  

  3. **Reachability of Pre-Jurisdictional Atrocities**  
     - **Must**: Enable prosecution of atrocities predating the court’s jurisdiction *if* they manifest a continuous crime or policy.  
     - **Case**: Nuremberg’s exclusion of pre-1939 persecution (unlinked to aggression/war crimes).  
     - **Status**: **Negotiable**. Omitting reachability whitewashes foundational crimes (e.g., pre-invasion genocide). Cost: Requires stretching jurisdictional nexus, risking overreach.  

  4. **Retroactive Clarity on Attribution Rules**  
     - **Must**: Define rules for individual responsibility (head-of-state immunity, superior orders) retroactively *only if* they were uncontroversial general principles.  
     - **Case**: Tokyo’s rejection of Emperor Hirohito’s immunity (implied abolition) vs. Nuremberg’s Article 8 (orders no defense but mitigates).  
     - **Status**: **Non-Negotiable**. Attribution norms must be predictable. Domestic models apply here: *Nullum crimen* covers modes of liability.  

  5. **Jurisdictional Symmetry**  
     - **Must**: Structure jurisdiction so founders’ own conduct is *theoretically prosecutable* (e.g., via independent prosecutors, trigger mechanisms).  
     - **Case**: Uncharged Soviet crimes (Katyn, partition of Poland).  
     - **Status**: **Non-Negotiable (aspirationally)**. A court that structurally immunizes founders is illegitimate. *Artifact*: Domestic law assumes sovereign equality; here, power imbalances make immediate symmetry unrealistic.  

  6. **Condemnation vs. Quarantine Distinction**  
     - **Must**: Ensure punishment expresses moral condemnation, not mere preventive detention.  
     - **Case**: Nuremberg’s death sentences (symbolic repudiation of Nazism).  
     - **Status**: **Contested** (Realist camp). Insisting on condemnation smuggles in victor’s moral superiority. Pragmatists may accept quarantine to secure state buy-in.  

  ---

  ### Critical Analysis
  **Most Exclusionary Desideratum**: **Jurisdictional Symmetry** (5). Insisting founders are indictable rules out:  
  - Tribunals created by victors during occupation (no consent from defeated).  
  - Courts reliant on state cooperation (founders veto prosecutions).  
  - Theories that legitimize victor’s impunity (e.g., "transitional justice requires pragmatism").  

  **Jointly Unsatisfiable Subset**:  
  **(A) Non-Retroactivity** (via Notice, 1) + **(B) Jurisdictional Symmetry** (5) + **(C) Creation Under Occupation** (political necessity) = **Impossible**.  
  - **Why**: (A) Requires clear pre-conduct criminalization; (B) Demands founders be liable; (C) Ensures defeated states cannot consent. Founders won’t criminalize their own past conduct *ex ante* during active conflict/occupation.  
  - **Drop**: **Creation Under Occupation** (C). Defend by accepting *provisional asymmetry*: Establish the court post-conflict with defeated state consent (e.g., UNSC referral model), but build symmetry *ex ante* into the statute for future conduct. Sacrifices immediacy but avoids victor’s tribunal.  

  ---

  ### Scoring Contenders
  - **Legality-First View** (Charter invalid): Fails desiderata 1–3, 5. Overly rigid on retroactivity, ignores systemic need for accountability.  
  - **Extreme Conduct Criminality** (malum in se): Satisfies 1 (if "wrongfulness" suffices) but fails 5 (no symmetry) and 2 (ignores selectivity).  
  - **Kelsenian Pragmatism** (retroactivity tolerabile): Fails 1 (no notice) and 5 (accepts victor’s court). Wins on reachability (3) and condemnation (6).  
  - **Fair-Warning Subjectivism** (defendant’s knowledge): Satisfies 1 narrowly but fails 4 (attribution rules unclear) and 5 (no symmetry).  
  - **Shklarite Political Legitimacy** (trial form as norm-generative): Fails 1 (form over notice) but satisfies 6 (condemnation) and partially 5 (if trial educates toward symmetry).  

  ---

  ### Conclusion
  The core tension is between **non-retroactivity** and **jurisdictional symmetry** under conditions of **asymmetric power**. A statute acceptable to founders-as-future-defendants must:  
  - Define crimes/attribution with retroactive clarity (1, 4).  
  - Architect jurisdiction for eventual symmetry (5), even if deferred.  
  - Treat victor’s impunity as a distinct flaw (2), not a retroactivity byproduct.  
  Impossibility arises when demanding immediate symmetry + occupation-era creation + strict non-retroactivity. The solution lies in decoupling the court’s creation from the conflict it judges.
