prompt: |-
  I cover law, science, and the philosophy of public institutions for a general-interest magazine, and this term I am also teaching the assessment block of a graduate seminar at a journalism school: fourteen mid-career reporters, not one law degree among them, most of whom have filed from a post-conflict setting and therefore arrive with strong opinions about tribunals and almost no vocabulary for them. The course runs eight weeks; the last three have been on the legal architecture of international criminal justice, from Nuremberg and Tokyo through the ad hoc tribunals to the permanent court. Their final is one in-class essay, written closed book in ninety minutes, worth twenty-five marks, and I want to set a single question that does real work.

  The problem I am trying to solve is that "victors' justice" operates in newsrooms roughly the way "unfalsifiable" once operated in bad science writing: a phrase that ends arguments instead of starting them. I want a question that makes my students take the objection apart and discover that its components have different targets and different remedies. Working through the record with a friend who clerks on an appellate court, I have become convinced that at least two readings of the retroactivity complaint are fused together in the standard account. On the first — call it the notice reading — the wrong is that the accused could not have guided his conduct by a rule that did not yet exist; the complaint is about his epistemic position, and it is at least partly answered by pointing to instruments already on the books, such as the 1928 Kellogg–Briand Pact or the 1936 naval protocol on submarine warfare. On the second — call it the authorship reading — the wrong is not the absence of warning but the identity of the announcer: the body declaring the rule is the party that defeated the accused, so no quantity of pre-existing treaty law cures the defect, because the objection was never about the timing or content of the rule but about who holds the office of judging. The two come apart in the evidence, and the Dönitz episode is the cleanest illustration: once the American admiral's written answers established that the United States had waged unrestricted submarine warfare in the Pacific, the tribunal declined to assess his sentence on the ground of those breaches, which looks like a tacit concession on authorship, while the judgment elsewhere keeps pressing the notice-based justification. I would also like the question to leave room for a third candidate — a reading on which retroactive criminalization damages governance by rules generally rather than wronging this particular defendant — and to require students to say whether it is genuinely independent or collapses into one of the other two. My friend thinks it collapses; I am not so sure; I do not want the stem to settle it.

  So: write the exam question, together with a short invented fact pattern of two or three hundred words that students must reason about rather than recognize. Set it in the near future, in which the winning side of a recently concluded civil war proposes a hybrid tribunal whose statute creates an offense that a non-binding General Assembly resolution condemned two decades earlier but no treaty ever criminalized, and whose second count describes conduct the winners are credibly alleged to have committed as well. The question should ask which objections to that statute survive, what each would take to answer, and what would have to change about the tribunal — as distinct from the statute — for a surviving objection to disappear. It must not be answerable by summarizing the Hart–Fuller exchange or reciting the history of the two postwar tribunals, and since the students are closed book it should not depend on named authorities at all: no bibliography, no reading list, no citation apparatus anywhere in what you write for me. Then give a model answer of about 750 words and a marking scheme out of twenty-five that names the specific moves separating an A from a B, with the B answer described positively rather than as an A with pieces missing, and with the errors reporters actually make — the tu quoque reflex, the assumption that naming a treaty settles notice, the slide from "the forum is compromised" to "the conviction is void" — each tied to a stated deduction. Write in American English. Begin directly with the exam question itself, with no preface, no commentary, and no restatement of this brief.
reasoning: |-
  We are writing a 90-minute closed-book essay exam question for mid-career journalism students with no law background. The goal is to have them analyze the "victors' justice" critique by disentangling different readings of the retroactivity objection. The question should be set in a near-future scenario involving a hybrid tribunal after a civil war. The tribunal's statute creates an offense based on a non-binding UNGA resolution (no treaty criminalization) and includes a second count that the winners are also alleged to have committed.

  The question must:
  - Ask which objections to the statute survive.
  - What each would take to answer.
  - What would have to change about the tribunal (not the statute) for a surviving objection to disappear.

  Avoid requiring knowledge of Hart-Fuller or specific historical tribunals. No citations or named authorities.

  Then provide:
  1. A model answer (~750 words).
  2. A marking scheme (out of 25) that distinguishes A from B answers positively and ties common errors to deductions.

  Exam Question:

  **FACT PATTERN**

  In 2043, after a decade-long civil war, the government of the Republic of Nordia defeated the rebel forces of the Southern Liberation Front (SLF). The war was marked by widespread atrocities. The victorious Nordian government, with backing from the United Nations Security Council, established the Nordia Accountability Tribunal (NAT) to prosecute war crimes and crimes against humanity. The NAT statute includes two counts of particular note:

  Count 1: "Ecological Warfare" – defined as the deliberate and widespread destruction of the natural environment, causing long-term and severe damage, committed as part of a campaign against a civilian population. This offense was explicitly condemned in a non-binding UN General Assembly resolution (A/RES/70/202) in 2025, but no international treaty has ever criminalized such acts.

  Count 2: "Forced Displacement of Populations" – defined as the systematic expulsion of civilians from their homes and lands for the purpose of altering the demographic composition of a region. Both sides in the conflict are credibly alleged to have engaged in such conduct.

  The SLF military commander, General Aris Thorne, has been indicted under both counts. His defense team has filed a motion challenging the NAT statute as invalid, arguing that it imposes "victors' justice." The prosecution responds that the UN resolution provides sufficient notice and that the tribunal is impartial.

  **QUESTION**

  General Thorne’s defense contends that the NAT statute is invalid on grounds of retroactivity and bias. Identify the distinct objections that might be raised under the "victors' justice" critique. For each objection, explain:

  (a) what the core wrong alleged is;
  (b) what, if anything, would answer that objection (i.e., what would show it does not apply in this case); and
  (c) what change to the *tribunal itself* (not the statute) could remove the force of that objection, if it survives.

  In your analysis, consider whether there is a third objection based on the damage retroactive criminalization does to governance by rules generally, and explain whether this is independent or collapses into one of the other objections.

  ---

  **MODEL ANSWER**

  The defense’s motion invokes the "victors’ justice" critique, which can be unpacked into at least two distinct objections regarding retroactivity and one regarding bias. A third potential objection concerning systemic harm to rule-governance must also be considered.

  **First Objection: The Notice Reading of Retroactivity**

  (a) The core wrong here is that General Thorne lacked fair notice: he could not have guided his conduct by a rule that did not exist at the time of the acts. The objection focuses on the defendant’s epistemic position – he could not foresee criminal liability for ecological warfare because no binding treaty or customary law criminalized it, only a non-binding UN resolution.

  (b) This objection could be answered by showing that the conduct was prohibited by pre-existing law. For instance, if the prosecution could establish that the UN resolution reflected emerging customary international law, or that the conduct was already covered by other crimes (e.g., crimes against humanity via persecution), then notice might be satisfied. However, the fact pattern states that no treaty criminalized ecological warfare, and the resolution was non-binding. Thus, unless the prosecution can show that the conduct was clearly prohibited under another recognized offense, the notice objection stands.

  (c) A change to the tribunal itself could not directly cure this defect because the issue is the timing of the law’s creation relative to the conduct. However, if the tribunal were to interpret Count 1 narrowly – e.g., by requiring proof that the environmental destruction was part of a crime against humanity (which was already established law) – it might mitigate the notice concern by grounding the conviction in pre-existing prohibitions. This would be a judicial act, not a statutory change.

  **Second Objection: The Authorship Reading of Retroactivity**

  (a) The core wrong is not the absence of notice but the identity of the lawmaker: the victors (Nordia and its allies) are creating the rule after the fact to judge the vanquished. The objection is that the tribunal’s authority is compromised because the same parties who won the war define the crimes. This is distinct from notice: even if pre-existing law existed, the victors’ role as lawmakers taints the process.

  (b) This objection could be answered by demonstrating that the law-making body (here, the NAT statute’s creation) was not controlled by the victors alone. For example, if the statute were drafted by a neutral international body (like the UN International Law Commission) and adopted with broad international consensus, the authorship concern would weaken. However, the fact pattern states the Nordian government established the tribunal with UNSC backing – implying victor dominance.

  (c) To remove this objection, the tribunal itself could be restructured to ensure neutrality. If the judges and prosecutors were appointed by neutral third parties (e.g., the UN Secretary-General or the International Court of Justice) rather than by Nordia or the UNSC (where Nordia’s allies hold veto power), the tribunal’s independence might be affirmed. The key is severing the victors’ control over the judicial office.

  **Third Objection: Systemic Harm to Rule-Governance**

  (a) The core wrong is that retroactive criminalization undermines the very idea of governance by rules: it erodes public confidence in law’s predictability and fairness, harming society generally. This is not about Thorne’s individual rights but the system’s integrity.

  (b) This objection could be answered by showing that retroactive criminalization is exceptionally necessary for justice (e.g., if the acts were universally condemned as morally heinous) and that safeguards against abuse exist. However, in this case, the lack of prior criminalization weakens this.

  (c) Changing the tribunal would not directly address this systemic harm, which stems from the statute’s retroactivity. But if the tribunal were to apply the principle of lenity (interpreting ambiguous laws in favor of the defendant) or limit prosecutions to the most egregious cases, it might mitigate the systemic harm by demonstrating restraint.

  **Independence of the Third Objection**

  The systemic harm objection does not collapse into the others. It targets the broader impact on legal order, distinct from either Thorne’s notice deficit (first objection) or the victors’ partiality (second). While the notice objection focuses on the defendant’s knowledge, and authorship on the lawmaker’s identity, systemic harm concerns the rule of law’s health for all society. However, it overlaps with the notice objection in that both relate to predictability. Still, it stands alone because even a neutral tribunal applying retroactive law could damage systemic rule-of-law values.

  **Application to Count 2**

  Count 2 (forced displacement) does not face retroactivity objections if it was already criminalized under pre-existing law. But the bias objection applies: if the winners committed similar acts, the tribunal’s failure to prosecute them may show partiality. To answer this, the tribunal must demonstrate even-handedness – e.g., by indicting winning-side perpetrators. Changing the tribunal to include international oversight in prosecutorial discretion could help.

  In conclusion, the notice objection likely survives for Count 1 absent proof of pre-existing prohibition. The authorship objection survives due to victor control. The systemic harm objection is independent and also survives. For Count 2, bias is the primary concern. Changes to the tribunal’s composition and prosecutorial independence could mitigate authorship and bias objections but not retroactivity.

  ---

  **MARKING SCHEME (Total: 25 marks)**

  An **A answer (21-25 marks)** will:
  - Clearly distinguish at least two readings of retroactivity (notice and authorship) and the bias/impartiality issue. (4 marks)
  - Articulate a third objection (systemic harm) and evaluate its independence without collapsing it prematurely. (3 marks)
  - For each objection, correctly identify:
    (a) the core wrong, 
    (b) what would answer it, 
    (c) a feasible change to the tribunal (not statute) to address it. (3 marks per objection x 3 = 9 marks)
  - Apply the analysis to both counts (Count 1: retroactivity; Count 2: bias) and note differences. (3 marks)
  - Avoid common errors (see deductions) and demonstrate precision in separating the objections. (3 marks)

  A **B answer (16-20 marks)** will:
  - Identify the two main retroactivity readings and the bias issue but may blur the lines between notice and authorship.
  - Mention the third objection but may not fully develop its independence or may collapse it into one of the others.
  - For each objection, provide (a), (b), and (c) but with less precision (e.g., vague on how to answer the objection or what tribunal change would help).
  - Discuss Count 1 and Count 2 but may not fully address their distinct challenges.
  - Show understanding of the key concepts but with minor inaccuracies or omissions.

  **Common Errors and Deductions**:
  - **Tu quoque reflex** (deflecting criticism by accusing the other side): e.g., "The winners did it too, so the tribunal is unfair." This confuses the bias objection with a justification for the defendant’s conduct. (-2 marks if uncorrected)
  - **Treaty naming as notice**: Assuming that citing the UN resolution (non-binding) provides sufficient notice without analyzing its legal status. (-2 marks)
  - **Forum compromise implies conviction void**: Arguing that bias automatically invalidates the statute rather than requiring procedural remedies (e.g., "Therefore, the tribunal has no jurisdiction"). (-2 marks)
  - **Conflating notice and authorship**: Treating them as a single retroactivity complaint without separating the epistemic and institutional wrongs. (-3 marks)
  - **Ignoring Count 2**: Failing to address forced displacement and its unique bias implications. (-2 marks)
  - **Over-reliance on historical parallels**: Discussing Nuremberg instead of the fact pattern. (-1 mark per instance, max -2)

  **Word Count Note**: The model answer is ~750 words; students are not expected to match this length in 90 minutes but should cover all elements concisely.
answer: |-
  **FACT PATTERN**  
  In 2028, the Federal Republic of Lyrossia emerged victorious from a brutal seven-year civil war against the separatist State of Veridian. The UN Security Council endorsed Lyrossia’s proposal to establish the Lyrossia-Veridian Accountability Tribunal (LVAT) to prosecute wartime atrocities. The LVAT statute defines two novel crimes:  
  - Count 1: "Cultural Erasure" – intentionally destroying monuments, archives, or sites of religious significance to eradicate a community’s identity, where such acts are part of a systematic campaign against civilians. This mirrors language from a non-binding UN General Assembly resolution (A/RES/55/301) passed in 2006, but no international treaty or customary law explicitly criminalized it before 2028.  
  - Count 2: "Strategic Starvation" – deliberately depriving civilian populations of food and medicine to secure military advantage, where commanders knew the conduct would cause mass death.  

  Veridian General Mila Rostova faces charges under both counts. Evidence confirms Veridian forces razed historical libraries in occupied cities (Count 1). Both Lyrossian and Veridian forces are credibly accused of blockading humanitarian aid to enemy-held towns (Count 2). Rostova’s defense challenges the LVAT statute as retroactive victors’ justice. The prosecution argues the UN resolution gave notice for Count 1 and that the tribunal’s impartiality is assured by its mixed Lyrossian-international judge panel.  

  **EXAM QUESTION**  
  General Rostova’s defense invokes "victors’ justice" to argue the LVAT statute is invalid. Identify the distinct objections underlying this critique. For each objection, explain:  
  (a) its core claim about what makes the statute unfair;  
  (b) what evidence or reasoning could answer it (i.e., show it does not apply here); and  
  (c) what change to the *tribunal’s structure or processes* (not the statute) could neutralize it.  
  Also, consider a third objection: that retroactive criminalization undermines rule-governed societies broadly. Is this independent of your other objections, or does it collapse into one? Justify your view.  

  ---  

  **MODEL ANSWER**  
  The "victors’ justice" critique against the LVAT statute encompasses two primary objections—one focused on retroactive notice, the other on victor authorship—and a potential third about systemic harm to legal order. Count 2 also introduces impartiality concerns distinct from retroactivity.  

  **First Objection: The Notice Reading of Retroactivity (Count 1)**  
  (a) The core wrong is that Rostova lacked fair warning: she could not adjust her conduct to avoid liability because "Cultural Erasure" was not criminalized when she acted. The UN resolution was non-binding and created no legal duty; the wrong is epistemic, denying her a chance to comply with the law.  
  (b) This objection could be answered if the prosecution proved "Cultural Erasure" was already prohibited under pre-existing law. For example, if it were subsumed by the war crime of persecution (recognized pre-2028), notice exists. Merely citing the resolution is insufficient, as it lacks legal force. Here, the absence of treaty criminalization weakens the prosecution’s case.  
  (c) Changing the tribunal could not erase the notice deficit, as it stems from the statute’s timing. However, if judges narrowly interpreted Count 1 to require proof it was part of a pre-existing crime (e.g., persecution), they could mitigate unfairness by anchoring conviction in known law. This judicial restraint would address the epistemic harm without amending the statute.  

  **Second Objection: The Authorship Reading of Retroactivity (Count 1)**  
  (a) The core wrong is not timing but who made the rule: Lyrossia (the victor) crafted the statute to judge Veridian acts, tainting the law’s legitimacy. Even if notice existed, victors imposing new rules on the defeated is inherently coercive, violating the principle that lawmakers must be neutral.  
  (b) This could be answered by showing broad international authorship. If the LVAT statute were drafted by neutral bodies (e.g., the International Law Commission) and adopted unanimously by the UN General Assembly—not just Security Council endorsement—it would dilute victor control. Here, Lyrossia’s unilateral proposal undermines neutrality.  
  (c) Restructuring the tribunal could neutralize this. If impartial third parties (e.g., the UN Secretary-General) appointed all judges and prosecutors—replacing Lyrossia’s influence over selections—the tribunal’s independence would sever the victor’s role as de facto lawmaker. Neutral administration answers the authorship complaint.  

  **Third Objection: Systemic Harm to Rule-Governance**  
  (a) The core claim is that retroactive criminalization erodes societal trust in law’s predictability, discouraging future compliance and destabilizing governance. This wrong transcends Rostova’s case, targeting systemic health.  
  (b) It could be answered by demonstrating extreme necessity: if the conduct (e.g., destroying libraries to erase cultures) was universally condemned as morally intolerable when committed, retroactive prosecution might uphold, not undermine, the rule of law’s moral foundations. Here, the non-binding resolution weakens this argument.  
  (c) Tribunal changes would not directly remedy systemic harm, which originates in legislative retroactivity. However, if judges adopted a high burden of proof for Count 1 (e.g., requiring intent to eradicate identity rather than mere destruction), they could signal fidelity to legality, reducing societal alarm.  
  This objection is independent. Unlike the notice objection, it focuses on collective consequences, not individual knowledge. Unlike authorship, it persists even with neutral tribunals (e.g., a retroactive law passed by the UN General Assembly would still damage rule-of-law culture). It does not collapse because its concern—societal stability—exists separately from fairness to Rostova or victor bias.  

  **Count 2: Bias and Impartiality**  
  Count 2 ("Strategic Starvation") lacks retroactivity issues if prohibited under pre-2028 law (e.g., as a war crime). However, a distinct impartiality objection arises: Lyrossian forces committed similar acts, but the LVAT—established by Lyrossia—may avoid prosecuting winners.  
  (a) The core wrong is partial application: victors judging only the defeated’s conduct, making the tribunal a tool of retaliation.  
  (b) This could be answered if the tribunal indicts Lyrossian commanders for starvation, proving even-handedness. Currently, Rostova’s indictment alone suggests bias.  
  (c) Changing the tribunal’s prosecutorial oversight could help: an independent panel (e.g., UN Human Rights Council experts) reviewing all charging decisions would insulate case selection from victor influence.  

  In summary, the notice objection survives for Count 1 absent proof of pre-existing criminalization; authorship survives due to victor control; systemic harm stands independently. For Count 2, impartiality is the key surviving objection. Tribunal reforms—neutral appointments for authorship, prosecutorial oversight for impartiality—could address flaws without statutory changes.  

  ---  

  **MARKING SCHEME (25 MARKS TOTAL)**  
  **A Answer (21–25 marks):**  
  - **Distinguishes objections precisely (8 marks):** Separates notice (epistemic harm), authorship (victor lawmaking), systemic harm (societal trust), and Count 2 impartiality as distinct. Explicitly treats systemic harm as independent.  
  - **Completes triad for each objection (9 marks):** For each (including systemic harm), correctly identifies (a) core wrong, (b) what answers it, and (c) feasible tribunal change. Notes Count 2 requires different analysis.  
  - **Avoids pitfalls (5 marks):** No conflation of notice/authorship; no assumption that non-binding resolution provides notice; no claim bias automatically voids convictions; addresses both counts.  
  - **Clarity (3 marks):** Logical flow; concise language; no reliance on external authorities.  

  **B Answer (16–20 marks):**  
  - **Identifies objections but with blurring (6 marks):** Covers notice, authorship, and systemic harm but may conflate notice/authorship or weakly distinguish systemic harm. May treat Count 2 retroactively.  
  - **Partial triad completion (6 marks):** Provides (a), (b), (c) for most objections but with gaps (e.g., vague tribunal changes for systemic harm; omits Count 2 impartiality).  
  - **Resists major errors (4 marks):** Avoids "treaty as notice" fallacy and automatic conviction invalidity but may slip on tu quoque (e.g., "Lyrossia did it too, so Rostova is innocent").  
  - **Structure (2 marks):** Organized but less nuanced; may overlook systemic harm’s independence.  

  **Deductions for Specific Errors:**  
  - **Tu quoque reflex (–2 marks):** E.g., "Count 2 is invalid because Lyrossia committed starvation" without analyzing impartiality as a procedural flaw.  
  - **"Naming a treaty settles notice" fallacy (–3 marks):** Claiming the UN resolution alone answers the notice objection for Count 1.  
  - **"Forum compromised, conviction void" slide (–2 marks):** Asserting bias or authorship objections automatically nullify the statute rather than requiring tribunal reforms.  
  - **Conflating notice and authorship (–3 marks):** Treating them as a single "retroactivity" objection without distinguishing epistemic vs. institutional wrongs.  
  - **Ignoring systemic harm (–2 marks):** Omitting discussion or collapsing it into notice/authorship without justification.  
  - **Neglecting Count 2 (–2 marks):** Failing to address impartiality for starvation charges.  
  - **Invoking Nuremberg/history (–1 mark per instance):** Using analogies instead of analyzing the fact pattern.  

  ---  
  **END OF RESPONSE**
