answer: |-
  Your cases reveal deep fractures in Lewis's analysis, demanding a principle centered on **arbitrary replaceability** as the core of convention. Here's a clause-by-clause principle with diagnostics, motivated by your verdicts:

  ### Proposed Principle
  A behavioral regularity R is a **convention** within population P iff:
  1.  **Coordination Problem:** P faces a recurrent situation S requiring interdependent action (*Motivation: Staircase, Thread Rule*).  
      *Work:* Excludes "passage etiquette" (no problem) and "drift regularities" (no interdependence).
  2.  **Arbitrary Replaceability:** There exists at least one alternative regularity R' that *could have solved S equivalently well for P* at R's inception (*Motivation: Staircase vs. Dish Rack*).  
      *Work:* Excludes the dish rack (no better alternative existed *for the actual constraints* – machine timing/rotas made rinsing the *only* stable "solution" to immediate needs) and passage etiquette (no alternative was possible).
  3.  **Conformity Motivated by Coordination:** Each member’s primary reason for conforming to R is that they expect others to conform *and* believe this coordination sustains a solution to S (*Motivation: Subject-Thread Rule vs. Double-Post Rule; Greeting Ritual*).  
      *Work:* Excludes the double-post "rule" (conformity is motivated by fear of mockery/sanctions, not coordination benefits). Includes large-forum greeting (members rely on markers/gossip as *proxies* for expectations about collective behavior solving the "how to interact" problem).
  4.  **Displaceability by Agreement:** R could be stably replaced by R' if P *collectively agreed* to switch (*Motivation: Red Thread; Fragile No-Greeting*).  
      *Work:* Explains why the red thread *isn't* a convention *now* (no collective agreement could restore its original meaning/solution; it’s inertia, not coordination). Highlights the fragility of no-greeting (agreement *could* replace it).

  ---

  ### Verdicts on Your Cases & New Cases
  | Your Case                      | Principle's Verdict | Matches Yours? | Key Clause(s)                                                               |
  | :----------------------------- | :------------------ | :------------- | :-------------------------------------------------------------------------- |
  | Staircase Side                 | Convention          | Yes            | 1, 2, 3, 4                                                                 |
  | Bare-Name Signatures           | **Not Convention**  | **No**         | Fails 1 (No coordination problem solved) & 3 (No coordination motivation)   |
  | Rinsed Dishes in Rack          | Not Convention      | Yes            | Fails 2 (No better, feasible alternative given rota/machine constraints)    |
  | Red Thread (Now)               | Not Convention      | Yes            | Fails 1 (No current problem solved) & 4 (Cannot be displaced by agreement)  |
  | No Greeting Strangers          | Convention          | Yes            | 1, 2 (Greeting possible), 3 (Detest but conform expecting others), 4 (Agreement could change) |
  | Passage Etiquette (Wait Descending) | Not Convention | Yes            | Fails 2 (No alternative possible)                                           |
  | Subject-Thread Rule            | Convention          | Yes            | 1, 2 (Other categorization possible), 3 (Conform to avoid wasted time), 4   |
  | Double-Post "Rule"             | **Norm (Not Conv.)**| Yes            | Fails 3 (Conformity via sanctions/fear, not coordination benefit)           |
  | Large Forum Greeting Ritual    | Convention          | Yes            | 1, 2, 3 (Markers/gossip sustain coordination expectations), 4               |

  **New Cases:**
  *   **Pure Drift Regularity (e.g., everyone wears blue on Tuesday):** Fails 1 & 3. **Not a convention.** No problem solved; conformity isn't motivated by coordination.
  *   **Subgroup Rule (e.g., Vegans always use specific fridge):** **Not a convention of P (whole population).** Fails 3 for non-vegans (they tolerate/expect but don't conform *because* it solves *their* coordination problem). It *is* a convention *within the vegan subgroup* if clauses 1-4 hold for them.

  ---

  ### Convention vs. Norm
  *   **Different Kinds:** Conventions solve coordination problems via arbitrary but replaceable patterns sustained by expectations of mutual conformity for mutual benefit. **Norms** solve *mixed-motive* problems (often involving conflicts or externalities) and are sustained by sanctions, internalization, or social approval/disapproval. The double-post rule is a norm (deterring a negative externality via sanctions), while the subject-thread rule is a convention (coordinating for mutual efficiency).
  *   **Stabilization vs. Snapshot:** The *how* of stabilization matters crucially. The "snapshot" (Clause 3: *why* people conform *now*) distinguishes the double-post norm from the subject-thread convention, even if surface behavior is identical. History (Clause 4: displaceability) distinguishes the red thread's inertia from a live convention. A pure equilibrium analysis (like Lewis's) often cannot see this.

  ---

  ### Where Your Verdicts Can't Be Saved (and the Cost)
  *   **Bare-Name Signatures:** Your principle rightly calls this not a convention. **Cost:** You lose the intuition that shared practice creates a "community feel," which isn't coordination. This is likely drift or a weak norm of informality.
  *   **Red Thread:** Your principle excludes it, matching your verdict. No cost.
  *   **The Tradeoff:** A baroque principle *could* save bare-name signatures by adding a clause like "or sustains group identity without conflict," but this blurs convention/norm distinctions fatally. **A spare principle (like above) saves 10/11 cases.** Sacrificing bare-name signatures is necessary for clarity. The dish rack and double-post cases are the critical wins.

  **In essence:** Conventions are the *arbitrary glue of coordination*. When the arbitrariness disappears (no alternative), the coordination motive vanishes (sanctions take over), or the glue hardens into irreplaceable inertia, it ceases to be convention. Your instinct about deterrence and displaceability was correct – Clause 3 (motivation) and Clause 4 (historical plasticity) are the keys Lewis underplayed.
