prompt: |-
  You are a philosopher of cognitive science with working knowledge of both the linguistics of language acquisition and contemporary machine learning, and you have taught contested technical material to smart, skeptical, non-philosopher audiences before. Please think carefully before answering, and treat what follows as a design problem rather than an exposition problem: I do not want the argument explained to me, and I do not want an essay on nativism versus empiricism. I want a teaching plan.

  Context. I run an internal seminar series at an industrial machine learning lab, and in three weeks I have seventy-five minutes on the argument from the poverty of the stimulus. Whiteboard only — no slides. The room will hold roughly twenty-five people who build, evaluate, and ship large models; essentially none of them have taken a linguistics course, though several have undergraduate-level exposure to philosophy of mind and all of them are fluent in the vocabulary of priors, inductive bias, sample complexity, and generalization. They will arrive having read the standard takes to the effect that a model acquiring grammar from raw text settles the matter, and most of them hold some loose version of the view that the debate is finished and the empiricists won.

  Here is the complication that should shape your whole plan: I am not a nativist. I do not accept the argument's conclusion. But my aim for the session is not to win an argument either. The target outcome is that they leave able to state the argument precisely, locate its actual pressure points rather than the ones that merely sound good, and explain why pointing at a large language model is not by itself a refutation — while also being able to say what such a model does bear on. Teaching an argument you reject, to an audience that has already rejected it for different and worse reasons, is the hard part; assume that if I let the session drift into a debate, everyone simply entrenches.

  Please give me the following.

  First, a short diagnostic pass. What does this specific audience already possess that I can lean on, what does that prior knowledge make easy to get across, and — more important — what does it make predictably hard, because their existing framework supplies a tempting but wrong slot for each piece of the argument? Do not write this as a survey; write it as a list of assets and liabilities with the liabilities tied to particular steps of the argument.

  Second, the order of ideas. Lay out the sequence in which the components must be introduced, with approximate minutes and what each step depends on. I specifically want your judgment on: whether to establish the positive-evidence-only point before or after the underdetermination point; whether the degeneracy and variability of child-directed input earns its own step or is a footnote; where, if anywhere, a Gold-style identification-in-the-limit result belongs, and what it costs me to include it; and whether the whole session should be framed from the start by the language-model comparison or whether that comparison must be held back until the argument stands on its own. Defend the ordering, not just list it.

  Third, the carrying example. I was inclined to build everything on the yes–no question case: a declarative whose subject contains a relative clause with its own copula, and the fact that a competent speaker fronts the main-clause copula rather than the first one encountered in the linear string. Tell me whether that is the right vehicle, what the example must have in order to do the work and what it must lack, how long I can afford to spend on it, and what I lose if I use it. Then tell me what the alternative vehicles cost — an anaphora case where a pronoun may or may not take an antecedent depending on structural position, a raising or passive alternation where a linear-order rule predicts the wrong sentence — and pick one for me, explaining the choice.

  Fourth, the misconception map. I already expect two, and I want to know exactly where in the sequence to head each off rather than rebut it at the end: the curve-fitting move, on which the audience concludes that since no child ever heard the relevant construction the case is settled; and the priors move, on which the audience concludes that since every learner has inductive bias the argument is empty and unfalsifiable. Add the ones I have not anticipated — I suspect something about treating universal grammar as a grammar written into the genome, something about equating the absence of teaching with the absence of data, and something about scale being treated as automatically dispositive. For each, give the point of maximum vulnerability in my sequence and one or two sentences I can say there that defuse it preemptively.

  Fifth, the check. One question I can put to the room in the last five minutes that discriminates between having understood the argument and having merely formed an opinion about it. Say what a good answer contains and what a bad-but-plausible answer sounds like.

  Sixth, what I should refuse to cover and announce that I am refusing: the internal machinery of parameter setting, the Minimalist Program, the evolutionary question, and whatever else would eat the clock. For each, give me the sentence that closes the door without sounding evasive.

  Do not give me readings, references, or a bibliography — I am not distributing anything, and the plan has to stand on its own in the room. Keep it concrete: minutes, board layout where it matters, and the actual sentences I would say at the joints.
reasoning: |-
  Okay, let's tackle this teaching plan for the poverty of the stimulus argument. The user is an expert in an ML lab running a seminar and needs to present this to skeptical engineers who think LLMs settle the debate. 

  First, assessing their background: Their ML fluency is an asset for concepts like priors and generalization, but also a liability. They might oversimplify UG as a "prior" or think sample size alone refutes the argument. Need to preempt those misconceptions.

  For structure: Must build the argument step-by-step before bringing in LLMs. If I start with models, they'll tune out. The yes-no question example is ideal - it's clean and shows structural hierarchy trumping linear order. Spending 15 mins here is worth it. Alternatives like anaphora are messier with more variables.

  Key traps to avoid: 
  The "curve-fitting" mistake - confusing absence of specific examples with absence of data. Counter by emphasizing indirect evidence. 
  The "priors" equivocation - conflating any bias with domain-specific constraints. Stress that POS argues for unlearnable principles.

  The closing question should test comprehension: "What would falsify POS?" Good answers identify untriggered parameters; bad ones rant about data volume.

  Cut-off points: Clearly state evolutionary questions and Minimalist Program are out of scope - "We're isolating the logical argument, not its implementation."

  Hmm... the real challenge is making them see POS as a formal learning theory problem, not a "nature vs nurture" debate. Their ML frame actually helps if I leverage the right analogies - like Gold's theorem showing the insufficiency of positive evidence alone. But must explicitly dissociate from Chomsky's broader claims about innateness.
answer: |-
  Here’s a concrete teaching plan designed for your constraints, leveraging your audience’s strengths and preempting their predictable missteps.  

  ---

  ### **1. Diagnostic Pass: Assets & Liabilities**  
  **Assets to leverage:**  
  - **Priors/inductive bias fluency:** Lets you frame UG as a *domain-specific* prior (not "innate grammar" but constraints on hypothesis space).  
  - **Sample complexity/generalization intuition:** They grasp that data scarcity challenges learning; use this to set up the underdetermination problem.  
  - **Model-building mindset:** They evaluate mechanisms; stress that POS is about *what must be in the learner’s initial state*.  

  **Liabilities (and where they bite):**  
  - **"Data scale fixes everything" (bites at underdetermination):** They’ll assume "more data" or "better optimization" resolves underdetermined grammars. Preempt by showing grammars are *logically incompatible* with observed data.  
  - **"Inductive bias = solved" (bites at UG’s specificity):** They’ll conflate *any* bias (e.g., Occam’s razor) with *domain-specific, unlearned* constraints. Isolate UG’s role in ruling out *possible-but-unattested* grammars.  
  - **"No explicit teaching = no evidence" (bites at positive evidence):** They’ll miss that *indirect* evidence (e.g., absence of ungrammatical forms) isn’t available.  

  ---

  ### **2. Order of Ideas (75 mins total)**  
  **Goal:** Isolate POS as a formal argument *before* engaging LLM comparisons.  

  | Time  | Step                                  | Key Dependencies & Defense                                                                 |  
  |-------|---------------------------------------|--------------------------------------------------------------------------------------------|  
  | 0-5   | **Framing:** "Today’s goal: Why POS *isn’t* refuted by 'LLMs learned grammar from text.' We’ll build the argument, then test that claim." | Establish stakes; defer LLMs to prevent anchoring.                                        |  
  | 5-15  | **Positive Evidence Only:** Define it as *no access to*: (1) Grammaticality judgments, (2) Direct error correction. Whiteboard: "Child hears: 'The cat is furry' → never hears: '*The cat furry is'." | Uses their "data is sparse" intuition; sets up absence of negative evidence. Liability: Emphasize "positive-only ≠ insufficient data." |  
  | 15-30 | **Underdetermination:** Show *multiple grammars* fit the observed data. Use **yes-no question example** (details below). | *Crucially after positive evidence:* They now see how missing negative evidence permits competing grammars. |  
  | 30-40 | **Gold-style Result (Briefly):** "In learning theory, positive-only data *cannot* distinguish certain grammars." Mention Gold’s theorem *only* to say: "This formalizes why underdetermination matters." | *Cost:* 3 mins max. Don’t derive; use as authority. Liability: Avoid "Gold proves nativism" — stress it shows a *problem*, not a solution. |  
  | 40-50 | **The Actual POS Claim:** "Children converge on *one* grammar despite underdetermination. Therefore, their hypothesis space must be pre-constrained (UG)." Whiteboard: **Data → Underdetermined Grammars → UG as Filter → Target Grammar**. | Assets: Their "priors reduce search space" knowledge makes UG’s role intuitive. |  
  | 50-65 | **LLM Comparison:** "Why doesn’t GPT refute this?" Contrast:  
  - *Child:* Learns from POS data + UG bias → correct grammar.  
  - *LLM:* Learns from astronomic data + architectural bias → *approximates* grammar.  
  Key point: "LLMs show data *can* induce grammar-like behavior *with different biases/data*. POS asks if *human-like constraints* are needed *given human-scale data*." | Finally engage their frame. Liability: Preempt "scale solves it" by noting POS targets *human learning conditions*. |  
  | 65-75 | **Q&A + Check Question** (see below). |                                                                                            |  

  **Why this order?**  
  - Positive evidence first (it’s concrete), then underdetermination (builds logically).  
  - Gold *after* underdetermination (it’s a footnote to validate the problem).  
  - LLMs last: The argument must stand alone to avoid "but GPT proves it’s possible!" derailment.  

  ---

  ### **3. The Carrying Example: Yes-No Questions**  
  **Use it.** Why:  
  - **What it has:** Clear structural hierarchy (not linear order). Example:  
    - Declarative: *"The man who is tall is happy."*  
    - Correct question: *"Is the man who is tall happy?"* (fronts main clause copula).  
    - Incorrect: *"*Is the man who tall is happy?"* (fronts first copula).  
  - **What it lacks:** Children *never* make the linear-order error, despite no evidence against it.  
  - **Time:** Spend 10 mins max. Walk through:  
    1. Write declarative.  
    2. Show two hypothesized rules (linear vs. hierarchical).  
    3. Note: No data rules out linear rule (children hear no *"Is the man who tall is...?"*).  
  - **Loss:** Minor risk if audience fixates on "but do kids *really* never err?" Redirect: "The point is they *converge* on hierarchical rule without evidence *for* it."  
  - **Alternatives cost more:**  
    - Anaphora (e.g., *"John said Bill likes him"* vs. *"John said Bill likes himself"*): Requires binding theory, adds complexity.  
    - Passives: Involves thematic roles, distracts.  
    **→ Stick with yes-no: Minimal machinery, vivid contrast.**  

  ---

  ### **4. Misconception Map: Preemptive Strikes**  
  | Misconception                      | Point of Vulnerability          | Preemptive Sentence(s)                                                                 |  
  |------------------------------------|----------------------------------|----------------------------------------------------------------------------------------|  
  | **"Curve-fitting"**: "No kid heard this, so case closed." | After underdetermination example. | "POS isn’t about missing *this exact sentence* — it’s about missing *evidence against* alternative grammars that *also* fit the sentences they *did* hear." |  
  | **"Priors solve everything"**: "All learners have bias; debate over." | When defining UG.                | "POS argues for *specific* biases that *cannot be learned* from POS data — not that bias exists. What rules out the linear copula-fronting rule?" |  
  | **UG as "grammar in genes"**       | Introducing UG.                  | "UG isn’t a full grammar — it’s constraints (e.g., 'syntax is hierarchical') that *limit* possible grammars." |  
  | **"No teaching = no data"**        | Defining positive evidence.      | "Children get *massive data* — but it lacks *specific types* of information (e.g., what’s *impossible*)." |  
  | **"Scale is dispositive"**         | LLM comparison.                  | "POS is about learning *from human-scale data*. LLMs with 1T tokens aren’t a model of *human* acquisition." |  

  ---

  ### **5. The Check Question**  
  **Question (min 70):** *"What would it take to empirically falsify the POS argument for UG?"*  
  - **Good answer:** "Finding evidence that children *do* receive data ruling out the alternative grammars (e.g., errors corrected, or exposure to structures that *only* make sense under the target grammar)."  
  - **Bad-but-plausible answer:** "Showing an LLM learns grammar without innate structure" (misses that POS is about human learning) or "Proving grammar is learned from stats alone" (vague).  

  ---

  ### **6. Refusal Scripts**  
  - **Parameter setting:** "That’s a *mechanism* for UG — today we’re only assessing *whether* UG exists."  
  - **Minimalist Program:** "That’s Chomsky’s *current theory* of UG — we’re focused on the *logical argument* for constraints."  
  - **Evolution:** "That’s about *how* UG arose — we’re asking *if* it exists given the data."  
  - **"But what about connectionism/emergence?"** "Today’s scope is POS vs. LLMs — save for Q&A!"  

  ---

  **Board Layout Tips:**  
  - Left: POS argument steps (Data → Underdetermination → UG → Grammar).  
  - Right: Examples (declarative → correct/incorrect questions).  
  - Bottom: LLM vs. Child comparison table.  

  **Critical Sentences:**  
  - At start: "POS isn’t ‘nativism vs. empiricism’ — it’s a *learning theory problem*."  
  - At underdetermination: "Two grammars fit the data; no child hears evidence *ruling one out*."  
  - At LLM comparison: "GPT is evidence that *some* biases + *vast* data work — not that *human* biases are unnecessary."  

  This plan forces engagement with the argument’s structure, preempts their reframes, and leaves them articulating why "LLMs learned grammar" doesn’t resolve it.
