prompt: |-
  For several years I have been reading manuscripts with a comparative cognition group, and there is a classificatory practice of theirs I have not been able to get into focus. When the group codes a vocalization as functionally referential, three findings are required. Production must be narrowly tied to one class of external event, so that the call is given to aerial predators and not to ground predators, or to a fruiting tree and not to a rival group. Receivers, including individuals with no prior exposure to the event, must respond with a differentiated pattern appropriate to it — scanning overhead and pressing into cover rather than climbing and looking down. And the differentiation must survive playback of the call on its own, with no sight of the caller and nothing else to go on, so that it cannot be attributed to graded arousal leaking into pitch or tempo. The same group also maintains a second list, invoked in other papers: production varies with who is present and whether they are attending, callers alternate gaze between the event and the audience, and they repeat or modify the call when the first attempt gets no response. Those are treated as evidence that the caller means to tell somebody something. And there is a standing exclusion that puzzles me most. A call that reliably tracks the caller's own state — hunger, distress, a wish for contact — and that produces differentiated, appropriate responses in receivers is coded as expressive or motivational, never referential, even though it appears to clear the production and response conditions just as easily. A dispute in the lab has made the tension concrete: a graduate student wants to code a food-associated call as referential because it satisfies all three tests, and her supervisor refuses, on the grounds that there is no audience effect and that the call is about the caller rather than about the food.

  Tell me what theory of mental content this practice presupposes. Is it teleosemantic, so that the call means whatever it was selected or learned to indicate; a bare informational account, on which lawful covariance plus reliable uptake does all the work; or something frankly deflationary, where the vocabulary of reference is shorthand for a pattern of causes and responses and nobody supposes the monkey has a thought about the eagle? Distinguish what the coding rules strictly require from what they merely sit comfortably with, and in particular say whether any of the three tests forces the conclusion that the signaler represents anything at all. Then assess whether the first list can be combined with the audience-and-gaze list, or whether the group is equivocating, treating a causal coupling and a communicative intention as though they were evidence of the same thing; if they cannot be combined, say which should be dropped and how the food-call dispute resolves once the choice is made. I am most interested in the standing exclusion. Since a hunger call can be given when the caller is not hungry, misrepresentation looks available in the internal case as well, so I want to know what is really doing the work: a requirement that content be truth-evaluable, that the referent be publicly available to both parties, that the receiver stand to gain information it could not otherwise have, or nothing deeper than taxonomic habit. Finally, indicate where the practice is philosophically underdetermined — which rival accounts of content would license exactly the same coding decisions — and what would have to change, in the criteria and in the design of playback studies alike, if the group adopted an interpretivist account on which content is fixed by the role a signal plays across an entire behavioral repertoire, or the more austere view on which these signals carry no content and merely cause responses.

  Please answer in continuous prose, as one would write a long letter to a colleague: no headings, no bullet points, no bold, and no tables.
reasoning: |-
  Hmm, this user presents a fascinating case study from comparative cognition research that's deeply entangled with philosophy of mind. They've been observing a lab group that employs strict criteria for classifying animal vocalizations as "functionally referential," but finds their exclusion of internal-state calls puzzling despite identical satisfaction of production-response conditions. The core tension revolves around theoretical assumptions about mental content.

  The user wants me to dissect the implicit theory of meaning behind these coding practices. Let me unpack their layered questions systematically. First, the three criteria for referential coding: (1) stimulus-specific production, (2) context-appropriate receiver response including naive individuals, and (3) response persistence in playback without cues. Then there's the secondary list about audience-awareness behaviors. The sticking point is why calls tracking internal states (hunger/distress) get excluded even when passing all tests, as in the grad student's food-call dispute.

  Considering possible frameworks: Teleosemantics would focus on evolutionary function, but the group doesn't require evidence of adaptation - learned signals could qualify. Informational theories based on covariance stumble because both predator-alarms and hunger-calls covary with stimuli and responses. Deflationary views seem closest - they're essentially coding "referential" as a behavioral pattern without mental state attribution. The playback test crucially rules out "leaky arousal," but doesn't require representation.

  Now the audience-and-gaze criteria introduce intentionality - treating signals as "about" something for others. This clashes with the first list's causal approach. If combined, they create a category error. Pragmatically, the audience criteria should likely be demoted to "intentional communication" coding since playback studies can't confirm mental states.

  The internal-state exclusion reveals deeper assumptions. Even with potential misrepresentation (fake hunger calls), these calls get rejected. This suggests: (1) truth-evaluability requirement (hunger isn't true/false of the world), (2) publicity principle (internal states aren't mutually observable), or (3) informational novelty (receivers already know about hunger). I suspect it's mostly taxonomic habit, inheriting linguistics' external-reference bias.

  For philosophical underdetermination: Both causal-informational and interpretivist accounts could justify the coding rules. But interpretivism would demand richer data - how calls function across contexts (e.g., hunger calls used deceptively). Austere behaviorist views would collapse the referential/expressive distinction entirely.

  To resolve the food-call dispute: If keeping the tripartite test, the food call is referential. But if adding publicity requirements, it's expressive. The lab should clarify if "aboutness" requires external referents per se. Playback studies could be augmented with "false content" tests (e.g., playing food calls near non-food items) to probe deeper.

  This user clearly grasps the philosophical stakes. Their frustration with the exclusion rule is perceptive - the distinction seems arbitrary without committing to what representation fundamentally is. I'll organize this as a cohesive narrative addressing each layer while maintaining collegial tone.
answer: |-
  My dear colleague,

  Your description of this classificatory practice—and the conceptual tension it embodies—resonates deeply with persistent quandaries in philosophy of mind and animal cognition. Having wrestled with similar ambiguities myself, I believe I can offer a framework for understanding what theory of mental content underpins the group’s coding rules, where the friction arises, and how the dispute over the food call might be philosophically disentangled. The practice is neither purely teleosemantic nor straightforwardly informational, but rather a pragmatic hybrid that leans deflationary while covertly smuggling in intentional assumptions—especially in its exclusion of internal-state calls.

  Let’s dissect the core criteria. The triad for "functional reference" (stimulus-specific production, differentiated receiver response including naive individuals, and persistence in playback) is fundamentally *causal-informational*. It requires lawful covariance between a call type and an external event class, plus reliable, context-appropriate behavioral responses in receivers that are triggered by the signal alone. Crucially, *nothing in these three conditions strictly necessitates attributing mental representation to the signaler*. The call could be a hardwired reflex or a learned association; the response could be an equally automatic reaction. The playback test brilliantly isolates the signal’s causal efficacy but doesn’t probe whether the signal "stands for" anything in the monkey’s mind. It ensures the signal isn’t merely a symptom of graded arousal, but it doesn’t demonstrate *aboutness*. A purely deflationary or bare informational account (where "reference" is shorthand for robust signal-object-response linkages) could justify this coding—no thoughts about eagles need be implied. Teleosemantics isn’t forced here either; the criteria don’t require evidence that the call was *selected for* indicating eagles (though they’re compatible with it). Learned signals with no evolutionary history could satisfy the tests.

  The problem arises with the *second list* (audience effects, gaze alternation, response-checking). These criteria shift the ground dramatically. They are classic markers of *intentional communication*: they suggest the signaler possesses a goal-directed state—an *intention* to inform or influence a specific audience. This invokes a richer, Gricean-like notion of meaning, where the signaler produces the call *because* they expect it to generate a particular response in the listener. Combining this with the first list creates an equivocation. The first list identifies a *causal coupling* (signal reliably causes appropriate behavior relative to an event). The second list seeks evidence for a *communicative intention*. These are distinct concepts: a signal can be causally coupled to an event and effective without the signaler having any intention *about* communication (e.g., an innate alarm cry triggered by a predator, regardless of audience). Conversely, signals with clear audience effects might fail the playback test if responses depend on contextual cues. **If they cannot be combined without conceptual confusion, the audience-and-gaze criteria should be dropped from the definition of "functional reference."** They belong to a separate category—perhaps "intentional communication" or "ostensive signaling"—demarcated by evidence of audience-directedness. Resolving the food-call dispute becomes clearer under this separation: the student is right that the call satisfies the (causal-informational) functional reference criteria. The supervisor’s objection (no audience effect, "about the caller") is valid *only if* the lab is illicitly requiring intentional criteria under the "referential" label. If the triad stands alone, the food call qualifies.

  This brings us to the **standing exclusion** of internal-state calls, which is the most philosophically revealing part. Even when a hunger or distress call exhibits perfect stimulus-production coupling (e.g., only when genuinely hungry), elicits differentiated, appropriate responses in naive receivers (e.g., food sharing), and passes playback (e.g., triggers food-seeking), it’s coded as "expressive/motivational," not referential. The potential for misrepresentation (a "fake" hunger call) doesn’t sway this. Several factors are likely at work, but the deepest driver appears to be a **requirement that the content be publicly available and truth-evaluable against a shared external world**. 

  1.  **Truth-Evaluability & Public Availability:** A predator alarm call can be true (eagle present) or false (no eagle). Its "content" (eagle) is an object or event in the external environment that both signaler and receiver can potentially perceive and verify. Hunger, distress, or desire are internal states of the signaler. While the call *covaries* with the state, and receivers respond *as if* to the state, the state itself isn’t directly observable or verifiable by the receiver. The call is treated as a *symptom* of the internal state, not a *representation* of an independent, publicly accessible referent. The receiver responds to the symptom, not to a shared external fact.
  2.  **Informational Novelty (or lack thereof):** The supervisor’s phrase "about the caller rather than about the food" hints at this. In the food-call case, the lab seems to think the receiver isn’t learning something *new* about the *world* (food location/type) but only about the *signaler’s* internal motivation regarding food they already know about. The signal doesn’t convey information about an external state of affairs the receiver couldn’t otherwise know (like a distant predator).
  3.  **Taxonomic Habit:** Undoubtedly, the historical influence of linguistics and philosophy prioritizing reference to external objects over expression of internal states plays a role. "Referential" intuitively feels like it should point "outwards."

  **What’s *not* doing the work?** It’s not purely covariance or reliable uptake, as these exist for internal states. It’s not teleosemantics per se; a hunger call *could* have the proper function of indicating hunger. The exclusion stems from an implicit commitment that "real" reference requires an external, public anchor for content that can be right or wrong in a way an internal state (taken as a given by the receiver) cannot be.

  **Philosophical Underdetermination and Alternatives:**
  The current practice is underdetermined between:
  *   A **deflationary/causal-informational view:** "Reference" is just a label for the reliable signal-stimulus-response triad. *Any* signal passing the triad (including internal states) could be "referential" in this thin sense. The exclusion of internal states is thus arbitrary or based on an extra-theoretical preference.
  *   A **modest representational view:** The triad provides evidence that the signal carries information *for the receiver* about a state of affairs, potentially involving representation *in the receiver's* cognitive system upon hearing the call. The signaler's own representations remain ambiguous.

  Adopting rival accounts would necessitate changes:
  *   **Interpretivism (Content via Behavioral Role):** This would demand a *much broader* analysis of the call’s role across the entire behavioral repertoire. Does the "food call" appear in contexts beyond immediate food discovery? Is it used deceptively? Does it combine with other signals? Does response vary with receiver knowledge? Playback studies would need richer contextual variations and observations of spontaneous use in diverse scenarios. The line between "referential" (external) and "expressive" (internal) might blur, as internal states gain content through their complex causal roles in mediating behavior towards the world (e.g., hunger's role in food-seeking). The food call might qualify as referential if its primary function *for the system* is coordinating behavior towards food objects, regardless of internal state.
  *   **Austere Causal View (No Content):** This would collapse the distinction entirely. Both "eagle alarms" and "hunger calls" are just stimuli that reliably cause specific adaptive responses. Coding would simply describe the stimulus conditions and resulting behaviors ("aerial-predator-response-eliciting call", "food-sharing-eliciting call"). Playback studies remain central, but the vocabulary of "reference," "expression," or "aboutness" is abandoned as misleading.

  **In essence, your colleagues' practice presupposes a deflationary, causal-informational core for the "referential" criteria but overlays it with an exclusion rule rooted in an unstated commitment to external, public, truth-evaluable content.** The tension arises because the intentional criteria (audience effects) and the external-reference requirement don't logically follow from the core triad. To achieve coherence, they should either:
  1.  **Embrace Deflationism Fully:** Define "functional reference" purely by the causal-informational triad (production specificity, receiver differentiation, playback success). This forces including the food call (and potentially well-documented internal state signals like vervet leopard alarms that also signal high arousal).
  2.  **Embrace Intentionality Explicitly:** Define "referential" as requiring evidence of *aboutness* and *intentional communication*. This necessitates incorporating audience/gaze/responsiveness criteria *as essential*, and likely demands more sophisticated experiments beyond simple playback (e.g., testing comprehension when the audience is ignorant vs. knowledgeable). The food call would likely be excluded unless audience effects were found, but the exclusion would be principled based on intentionality, not just internality vs. externality.

  The grad student’s case highlights the inconsistency: the food call meets the operational definition while being denied the label based on an unarticulated philosophical premise about what reference *must* point to. Clarifying the theoretical foundation—whether the lab prioritizes causal coupling, receiver inference, or signaler intention—is essential to resolve not just this dispute, but the very structure of their classification. The exclusion of internal states isn't dictated by their core tests; it reveals a deeper, and philosophically contestable, commitment about the nature of meaning itself.

  I hope this dissection proves useful for your ongoing engagement with the group. It’s a fascinating window into how empirical practice inevitably rests on philosophical bedrock, often only half-visible.

  Warmly,

  A Fellow Traveler in the Thickets of Mind and Meaning
