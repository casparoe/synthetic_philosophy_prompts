answer: |-
  ## Ghazal of the Unbound Flame  
  *(after al-Ghazālī, Tahāfut al-Falāsifa, Discussion 17)*

  Not from the fire's core does burning spring, but from **God's habit**—  
  The cotton's ash reveals no cause inherent, only **God's habit**.

  The spark descends, the fibre yields: a sequence known to sight,  
  Necessity? A chain we forge, not forged by **God's habit**.

  You cry: "If flames don't *make* the burn, how can the world be known?"  
  Yet knowledge blooms in patterns kept, sustained through **God's habit**.

  The seed splits earth, the rain descends—predictable as dawn—  
  Their constant meeting speaks His will, enacted by **God's habit**.

  No power sleeps within the wood, no virtue in the spark,  
  Connection is His chosen mode, decreed through **God's habit**.

  Ibn Rushd demands a binding force, a world knit tight by cause—  
  But threads unravel, showing grace, held fast by **God's habit**.

  Could embers cool like water's touch? Could cotton scorn the blaze?  
  The Hand that orders sequence thus might shift **God's habit**.

  The fire glows, the cotton waits—what *is* unfolds its tale,  
  Not must, but *does*, each moment freed from **God's habit**.

  This world: a flowing script divine, where consequence seems law,  
  But law's just custom, freely willed—behold **God's habit**.

  The Doubter sees: that flame might kiss the wool and leave no scar—  
  A world remade, the pattern changed, beyond **God's habit**.

  ---

  **Notes on Interpretation & Liberties:**

  1.  **"God's Habit" ('Ādah) & Secondary Causes:** The radif "God's habit" directly translates *al-‘ādah al-ilāhiyyah*, central to al-Ghazālī's argument. Using it as the core refrain emphasizes the contingency of sequences. While this leans towards the standard occasionalist reading (denying inherent causal powers), the poem avoids *explicitly* negating secondary causes (*asbāb thānawiyyah*) as utterly inoperative *in themselves* – it focuses on denying *necessity* and locating the sustaining power solely in God. The "predictable as dawn" couplet hints at observed regularities without granting intrinsic agency.
  2.  **The Humean Flirtation & Distinction:** The poem deliberately evokes Humean "constant conjunction" ("sequence known to sight," "patterns kept," "predictable as dawn"). The key distinction lies in the *explanation* and *metaphysics*: Hume roots regularity in psychological expectation and custom, denying knowable metaphysical grounding. Al-Ghazālī roots it in the *continuous, deliberate, sustaining will of God* ("His chosen mode," "decreed," "His will," "The Hand"). The poem consistently anchors the "habit" in divine agency ("God's habit"), preventing a purely naturalistic/Humean reading. The "Doubt" is Ghazālī's *methodological* doubt against the philosophers, not Hume's epistemological skepticism.
  3.  **Potential Misinterpretation & Corrective Evidence:** The framing could be seen as denying *any* reality to secondary causes beyond mere occasions. Textual evidence for a more nuanced view lies in al-Ghazālī's acceptance of causes *within* God's ordained system (*al-mashī’ah*) and his discussions elsewhere (e.g., *Iḥyā’*) on human acquisition (*kasb*) within divine creation. If al-Ghazālī explicitly stated that God creates the *effect* *through* the secondary cause as a real instrument (*ālah*) empowered by Him at the moment of effect, not merely as a preceding condition, that would challenge the stricter occasionalist framing implied here. His focus in the *Tahāfut*, however, is overwhelmingly on negating *necessity* and intrinsic power (*quwwah dhātiyyah*), which the poem reflects. The closing miracle emphasizes the *absence* of necessity, not the *absence* of created causes per se.
