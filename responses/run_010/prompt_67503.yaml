prompt: |-
  Okay so I keep running into a pattern I don't have a word for, and I'm hoping philosophy of action does. Two examples, both real.

  One: my train stalls in a tunnel and a big suitcase comes off the rack and wedges itself against the doors. Three of us, total strangers, never say a single word to each other, each grab a bit of it and lift, it comes free, the doors close, and all three of us go straight back to our phones. If you'd asked me afterward what I did I would have said "I lifted a case," not "we lifted a case." I'd bet money the other two would say the same, and mean it.

  Two: after a storm my whole street is full of downed branches, and over a couple of days basically every household drags stuff to the same corner pile. Nobody organized it. No group chat, no knock on doors, no plan. But it obviously only works because each person is doing their bit on the assumption the others will do theirs — if two families had quietly stopped on day one I think everyone would have stopped by day two. And here's the bit that confuses me: nobody would have had any standing to complain. Not a whiff of it. If the Hendersons had just left their branches in their own yard, no one was going to say a word, and yet the pile would have died.

  So the togetherness is doing real work — my reason for hauling is entirely built out of what I expect you to do, and the outcome isn't reachable by anyone alone — but there's no agreement, no shared plan, no sense of owing anybody anything, no rebuke when someone drops out, and not one participant, me included, would describe the event in the plural. The denial of "we" isn't modesty or confusion either, it's just what it's like from the inside.

  Does that combination have a name? I want the carving, not the label:

  - What's the nearest established concept, and how is what I'm describing different from it? I can guess it sits somewhere near people's ideas about shared intention and about whether you need some kind of commitment to act together, but I don't know which account I'm actually describing a counterexample to, or whether I'm describing a counterexample at all.
  - It isn't just several people happening to do similar things at the same time, because the expectations are load-bearing and mutually sustaining — but how much mutual expectation do you need before "they're doing it together" becomes true? Give me the threshold and what it's made of.
  - It also isn't the ordinary case where people talk, agree, and then execute, but I want to know what exactly goes missing when the talking is skipped. Is it just the obligation, or is something else gone too?
  - Most of all: is the no-blame-but-total-collapse pairing actually coherent? Any collective activity that really depends on everyone expecting everyone else to keep going seems like it ought to generate some entitlement to complain when they don't. Tell me whether a genuinely expectation-driven group activity can be obligation-free, or whether I'm describing something that can't exist and just looks like it can.
  - And where does the term stop applying, if there is one? A stadium wave. A queue that forms itself at a food truck. A bucket brigade that gets going at a fire before anyone shouts. A flash mob where everybody rehearsed privately. Tell me which of those are the same phenomenon and which aren't, and why — that's the part I care about most, honestly.

  If nothing in the literature covers it, say so and coin something for it: a definition, plus two or three cases that sit right on the edge where you'd argue about whether it applies. I'd rather have a sharp boundary and a slightly ugly name than a pretty name that blurs into everything else.
reasoning: |-
  Hmm, the user is describing a fascinating phenomenon involving collective action without any explicit coordination or sense of group identity. They've provided two concrete examples - strangers lifting a suitcase on a train, and neighbors clearing storm debris without communication. 

  The core puzzle seems to be: how can behavior be interdependent (each person acts based on expectations of others) yet participants experience it as purely individual action? The user is specifically bothered by the lack of obligation - no one feels entitled to complain if others don't participate, even though the collective effort would collapse.

  This feels adjacent to but distinct from several philosophical concepts:
  - Bratman's shared intentionality requires mutual responsiveness and commitment to joint action, which is absent here
  - Tuomela's we-mode thinking is explicitly rejected by the participants 
  - Gilbert's joint commitment theory would require obligation, which isn't present

  The key differentiators appear to be:
  1) Purely predictive expectations (not normative)
  2) Absence of plural self-identification 
  3) No interdependence of reasons (my reason doesn't reference "us")
  4) Asymmetric observability (we see others acting but don't coordinate)

  The stadium wave example is particularly clarifying - it's a perfect fit because participation depends on seeing others participate, yet no one feels responsible for the wave's success. A queue forms similarly through mutual adjustment without commitment. 

  But a bucket brigade crosses into weak joint action when roles emerge, and flash mobs with private rehearsals involve prior coordination. The boundary seems to be whether the interdependence is purely behavioral (based on observable actions) or involves mental states about the group.

  The "no-blame collapse" feature is coherent if we distinguish between empirical and normative expectations. The neighbors expect others will clear debris (empirical), but don't believe they should (normative). When expectations are purely empirical, failure generates disappointment but not resentment.

  For a new term, "ephemeral co-action" captures the transient, coordination-free nature. Boundary cases would be: 
  1) Drivers merging in traffic (in, if no eye contact) 
  2) Silent auction bidding (out, if bidders think competitively) 
  3) Library patrons being quiet (out, because of shared norm)

  The user's insistence on sharp boundaries is smart - many existing theories overreach by claiming all coordination requires shared intention. These cases show collective outcomes can emerge from parallel individual reasoning.
answer: |-
  This is a brilliant observation of a subtle but robust phenomenon that cuts across several philosophical debates. You've identified a genuine gap: **"obligation-free collective efficacy."** Let's carve it precisely.

  ### 1. Nearest Established Concepts & Differences
  - **Bratman's "Shared Cooperative Activity" (SCA):** Requires (a) mutual responsiveness, (b) commitment to joint action, (c) commitment to mutual support. *Difference:* Your cases lack (b) and (c). No commitment exists; each acts on *predictive* expectations, not normative ones.
  - **Tuomela's "We-Mode" vs. "I-Mode":** We-mode requires thinking as "we" with collective goals. *Difference:* Participants explicitly deny "we" descriptions and act in pure I-mode.
  - **Gilbert's "Joint Commitment":** Creates mutual obligations. *Difference:* No obligations exist; dropping out incurs no rebuke.
  - **Searle's "Collective Intentionality":** Requires a "we-intention" in individual minds. *Difference:* Participants report only individual intentions ("I lifted," "I cleared my branches").
  - **Game Theory (Coordination Games):** Matches the mutual expectations but typically assumes shared payoff structures or communication. *Difference:* No communication, no explicit payoffs, and crucially—no sanctioning mechanism.

  **What you've described is a counterexample to theories requiring *shared agency* (Bratman, Gilbert) or *collective intentionality* (Searle) for coordination. It shows collective outcomes can emerge from parallel individual actions driven by mutual prediction alone.**

  ### 2. The Threshold for "Doing It Together"
  The threshold is **mutually referential expectations without normative force**. Specifically:
  - **A acts because A expects B, C,... to act.**
  - **B acts because B expects A, C,... to act.**
  - **This expectation is purely *predictive* (based on observable context), not normative.**
  - **No one believes their action *binds* others, or that others *owe* action.**

  When expectations are *interlocking predictions* (not obligations or shared goals), you get this phenomenon. Add "we intend" or "you should," and it becomes joint action.

  ### 3. What Goes Missing When Talking is Skipped
  Skipping talk removes three key elements:
  - **Normative glue:** Agreements create obligations ("we decided, so you must").
  - **Shared representation:** Talking builds a common mental model of "the plan" or "the group."
  - **Contingency coordination:** Verbal coordination handles "what if X fails?" scenarios.

  What remains is pure **behavioral coupling:** actions synced via environmental cues and mutual observation, without shared mental states.

  ### 4. Coherence of "No-Blame-but-Total-Collapse"
  **Yes, it's perfectly coherent.** The mechanism is *conditional reciprocity*, not obligation:
  - **My reason:** "I'll act *if* (and only if) others likely act."
  - **Entitlement to complain requires normative expectation:** "You *should* have acted." Here, expectations are purely empirical ("I *thought* you'd act"). 
  - **Collapse without blame:** If the Hendersons don't clear branches, others interpret it as a *signal* ("others aren't acting, so my action is pointless") not a *violation*. Disappointment? Yes. Moral claim? No.

  **This works because the "collective" is ephemeral—a coincidence of parallel conditional intentions, not a persisting entity with claims on members.**

  ### 5. Boundary Cases: What Fits & Why
  | Example                  | Same Phenomenon? | Why? |
  |--------------------------|------------------|------|
  | **Stadium wave**         | ✅ Yes | Each stands *only* if others do; no commitment, no "we," no blame if it dies. |
  | **Self-forming queue**   | ✅ Yes | Each joins because others are queuing; order emerges from mutual observation. |
  | **Spontaneous bucket brigade** | ⚠️ **Borderline** | If roles emerge (e.g., passer-to-passer), it edges into *role-based joint action*. If purely ad-hoc (each grabs a bucket independently), it fits. |
  | **Privately rehearsed flash mob** | ❌ No | Shared plan exists (even if unspoken). Participants act *because* of a prior collective intention. |
  | **Traffic merging "zipper"** | ✅ Yes | Drivers yield based on predicting others' behavior; no obligation, just conditional reciprocity. |
  | **Silent auction bidding** | ❌ No | Bidders act strategically against others (competitive, not conditional reciprocity). |
  | **Library patrons staying quiet** | ❌ No | Relies on *shared norms*; violations incur dirty looks (normative expectation). |

  **Key discriminator:** Does the action rely on *predicting others' behavior* (yes) or invoking *shared understanding, norms, or commitments* (no)?

  ### Coining a Term: **Ephemeral Co-Action**
  **Definition:** *A transient collective outcome achieved through interlocking, conditional individual actions, driven by mutually referential predictive expectations alone, without shared goals, commitments, obligations, or plural self-identification.*

  #### Boundary Cases for Debate:
  1. **The Hesitant Merging Driver:** A driver signals to merge. You let them in because you predict they'll merge slowly. They expect you to yield. No eye contact. *Ephemeral co-action?* **Yes**—pure behavioral prediction.
  2. **The Abandoned Potluck:** Everyone brings a dish assuming others will too. One family doesn't come. Others are annoyed but don't confront. *Ephemeral co-action?* **No**—potlucks imply weak reciprocity norms; annoyance signals normative expectation.
  3. **Crowd Sourcing a Lifted Car:** Bystanders lift a car off a cyclist spontaneously. No one speaks. *Ephemeral co-action?* **Borderline**—if roles emerge (e.g., "you take the bumper"), it leans joint action. If all just push randomly, it fits.

  ### Why This Matters
  You've pinpointed a "dark matter" of social coordination: **collective efficacy without collective agency.** It challenges theories insisting that "acting together" requires "thinking together." Sometimes, we just *do* together—silently, conditionally, and obligation-free. The train, the branches, and the stadium wave reveal society's invisible, non-moral scaffolding.
