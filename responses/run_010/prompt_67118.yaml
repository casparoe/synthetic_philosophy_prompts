prompt: |-
  There's this argument about memetics that's been running for decades and I've now managed to get personally tangled up in it — I co-teach a seminar with an anthropologist, we ended up on opposite sides, and a year of trading arguments hasn't budged either of us. So I want a diagnosis of the disagreement itself, not a verdict on who's right, and definitely not a survey of the field. No reading lists or citations, I can't use them.

  Her side, roughly: cultural transmission is way too low-fidelity for anything in it to count as a replicator. There's no discrete unit that gets copied, no principled way to individuate a meme from a variant of itself, and what actually persists across generations is better described as a set of attractors — the shapes representations keep getting pulled back toward by human cognition and by whatever biases learners bring to adoption. Selection is real, replication isn't, so the gene analogy is a category error in a lab coat.

  My side, roughly: the fuzziness complaint proves too much. Genes recombine, there are transposons, and 'gene' gets individuated differently depending on whether you mean the developmental or the evolutionary sense — nobody concludes from any of that that selection isn't a replicator-level process. Ideas get copied, they vary, and the variants get retained at different rates, which is the whole formal content of the Darwinian scheme. Insisting on crisp token identity before you'll permit the word 'replication' is its just moving the goalposts.

  We've chewed through the same examples over and over — urban legends, folk melodies, religious rituals, the layout of the QWERTY keyboard — and every single time the example comes out looking like support for whichever side you already held. That's the part that makes me suspect we aren't really disagreeing about the examples at all.

  My hypothesis about where the fault line actually is, and I want you to attack it rather than agree with it: the fight is over an unstated requirement that cultural transmission be causal-historical. Her camp, I think, needs something stronger than the fact that learner output reliably tracks teacher input plus differential retention — it needs the resemblance to be explained *by the copying event itself*, so there's a token-to-token chain you could in principle trace, a lineage. My camp is happy with tracking. If that's the real split, then most of the standard moves on both sides (fidelity percentages, whether a tune is one meme or a family of them) are downstream noise, and the thing genuinely worth arguing about is whether tracking-without-lineage can bear the explanatory weight memetics wants to put on it.

  So: is that right? Tell me what kind of disagreement this is — substantive, partly verbal about 'replication' and 'gene-like', two camps answering different questions under one heading (one about formal population models, one about the metaphysics of units), a hidden empirical question that transmission data could settle in principle, or an ill-posed question that ought to be retired. Use what each side actually says. And if you think my causal-historical hypothesis is wrong, tell me what the unstated premise really is and what would expose it.

  Then, given whatever diagnosis you land on: what would count as progress? A distinction, an experiment, a formal result, a change of question — or nothing, in which case I'd rather hear that flat out, and hear whether my co-teacher and I should just agree to coexist, which I suspect we wont.
reasoning: |-
  Okay, let me unpack this user's situation. They're tangled in a long-standing memetics debate with their anthropologist co-teacher, and after a year of arguments, they've hit an impasse. What they want isn't resolution but diagnosis - specifically, whether their hypothesis about the core disagreement (causal-historical lineage vs. tracking) holds water. 

  First, I need to map both positions accurately. The anthropologist's stance hinges on cultural transmission lacking discrete replicators due to low fidelity, seeing patterns as attractors rather than copied units. The user counters that evolutionary biology handles fuzzy units too, and differential retention of variants meets Darwinian criteria. Their shared frustration is telling: the same examples (urban legends, QWERTY layouts) get interpreted oppositely, suggesting the conflict runs deeper than empirical evidence.

  The user's proposed fault line resonates - it echoes Hull's replicator/interactor distinction and Dawkins' meme concept. But is this really the core? Let me pressure-test it against their descriptions. When the anthropologist demands "no principled way to individuate a meme," it implies a need for token-level identity, which aligns with requiring causal chains. Meanwhile, the user's "tracking" language accepts population-level patterns without strict lineage. This distinction seems robust.

  But I should consider alternatives. Could this be about explanatory targets? The anthropologist might prioritize cognitive mechanisms (how individuals acquire culture), while the user focuses on population dynamics (why some variants spread). Or perhaps it's ontological - are memes real entities or useful fictions? Yet neither side mentions these explicitly. The causal-history hypothesis fits their actual rhetoric best.

  As for the disagreement's nature: it's substantive but entangled with verbal issues. "Replication" is the key contested term. For the anthropologist, it likely implies high-fidelity copying like genetic replication; for the user, it's about functional outcomes. This isn't merely semantic though - it reflects different thresholds for applying evolutionary models.

  Progress? Since transmission data alone hasn't resolved it (per their example stalemate), I'd suggest:
  1) Explicitly decouple "replicator" from genetic analogies via a neutral framework like "cultural variants + selection."
  2) Collaboratively model a concrete case (e.g., chain emails mutating) to see if attractor language vs. variant selection captures different aspects.
  3) Shift to "what work do we want this model to do?" - predicting cultural change? Explaining stability? That might reveal compatible complementarity.

  The coexistence path seems viable if they can reframe positions as emphasizing different timescales: attractors for stability, selection for change. But given their history, table-setting the lineage-vs-tracking distinction first could prevent talking past each other. No silver bullet, but clarifying the root conflict may drain some poison.
answer: |-
  Here's a diagnosis based solely on your descriptions, avoiding verdicts or surveys:

  ### 1. Your Hypothesis Is Largely Correct (But Needs Refinement)
  The core disagreement **is** about the necessity of causal-historical lineage for "true" replication. Your anthropologist co-teacher requires **token-level causal chains** (e.g., "this specific instance of a meme was directly copied from that specific prior instance, forming a traceable lineage"). You accept **type-level statistical tracking** (e.g., "ideas with this general form persist because they are reliably re-produced with variation, and some variants outcompete others"). 

  **Evidence from her side:**  
  - Her rejection of "discrete units" stems from the inability to point to a specific *token* being copied intact.  
  - Her "attractor" framing implies stability comes from constraints (cognition, bias), not from copying fidelity of tokens.  
  - She dismisses gene analogies because genes *do* have traceable lineages (via molecular replication).  

  **Evidence from your side:**  
  - You defend fuzziness by pointing to population-level processes in biology (recombination, transposons), where *lineages exist even if units are fuzzy*.  
  - You focus on the *outcome* (variation + differential retention = evolution), not the *mechanism* of copying.  

  ### 2. The Nature of the Disagreement  
  This is **primarily substantive** but **deeply entangled with conceptual/verbal issues**:  
  - **Substantive:** You disagree on what *kind of process* is minimally required for Darwinian evolution. Is token-lineage essential, or is pattern-persistence sufficient?  
  - **Verbal:** The fight over "replicator," "copying," and "gene-like" masks the deeper issue. You both use "replication" but mean different things:  
    - **Her:** Replication = *token transmission* (like a virus).  
    - **You:** Replication = *type persistence* (like a statistical pattern in a population).  
  - **Not just different questions:** Both sides *are* trying to answer the same question ("Is cultural evolution Darwinian?"), but they impose different **necessary conditions** for a "Yes" answer.  

  ### 3. Why Transmission Data Won't Settle It (Alone)  
  Your stalemate with examples (QWERTY, folk melodies) happens because:  
  - **She sees:** The *absence* of token-lineages (e.g., no one "copied" QWERTY from a single source; it re-converges due to network effects/compatibility).  
  - **You see:** The *presence* of type-level selection (e.g., QWERTY persists because alternatives get discarded).  
  Data shows *both* attractors *and* differential retention. **The conflict is about which feature is explanatorily primary.**  

  ### 4. The Unstated Premise (Refining Your Hypothesis)  
  Her deeper requirement isn't just *causal-historical* lineage—it's **high-fidelity token copying as the *primary driver* of stability**. If stability is maintained by attractors (cognition/bias), not copying fidelity, then "replication" is a misnomer. Your unstated premise: **Differential retention of types *is* the core Darwinian process, regardless of whether tokens are perfectly copied or re-generated toward attractors.**  

  ### 5. What Counts as Progress  
  **Progress requires shifting focus from "Is it replication?" to "What does this model explain?"**  
  - **Distinction:** Adopt neutral terms. Replace "meme" with "cultural variant." Replace "replication" with "cultural recurrence" or "differential adoption." Ask: "Do models tracking *variants* (even fuzzy ones) undergoing *selection* predict/explain cultural change better than models ignoring selection?"  
  - **Experiment/Formal Result:** Design a scenario where "attractor-driven stability" and "variant selection" make *different predictions*. Example:  
    - Simulate the transmission of a story where:  
      - **Condition A:** Cognitive biases strongly pull all retellings toward a specific "attractor" version.  
      - **Condition B:** No strong attractor, but some story elements are intrinsically more memorable.  
    - Test which model better predicts the outcome: one emphasizing attractor convergence, or one tracking variant frequencies + selection?  
  - **Change of Question:** Stop asking "Are memes real?" Ask instead:  
    - *"When is cultural stability best explained by attractors vs. selection?"*  
    - *"What phenomena are only explained by modeling differential variant persistence?"*  
    - *"Does the 'lineage' of an idea matter, or just its fitness?"*  

  ### 6. Can You Coexist?  
  **Yes, but only by depoliticizing the framing.**  
  - **If you insist on "memes/replicators":** Expect perpetual stalemate. The analogy is too loaded.  
  - **If you reframe as modeling tools:** Coexistence is possible. Concede that:  
    - She's right that token-lineages are often untraceable and attractors matter.  
    - You're right that population-level selection models have predictive power.  
  - **Co-teaching opportunity:** Structure the seminar around *complementarity*. Show how "attractor" models explain stability/robustness, while "variant selection" models explain change/innovation. The same cultural phenomenon (e.g., a ritual) often requires *both* lenses.  

  **In short:** Your diagnosis is astute. The battle is over lineage-dependent replication vs. lineage-independent selection. Progress lies in abandoning the loaded analogy and focusing on when each model provides unique explanatory leverage. Coexistence is viable if you stop fighting over labels and start mapping domains of applicability.
