answer: |-
  Below is a refined, ready-to-run negotiation game designed to achieve your learning objectives. I've kept your core engine (the cemetery delegation's contradiction) while streamlining mechanics for clarity and impact. The game forces players to experience gains from trade across incommensurable values, then confront a mandate violation, all within your constraints.

  ---

  ### **Game Setup: Riverfront Dilemma**
  **Delegations & Roles** (split 18 players into 4 groups):  
  1. **Housing Developers** (5 players)  
  2. **Reserve Guardians** (5 players)  
  3. **Cemetery Stewards** (4 players)  
  4. **Process Watchdogs** (4 players)  

  **Fallback Package** (if no deal):  
  - Housing units: 0  
  - Cemetery disturbance: 5  
  - Reserve fund: 5  
  *(Represents no development, moderate natural flooding, and partial reserve depletion for emergency repairs)*  

  ---

  ### **Role Cards**  
  *(Print one per delegation; players can share within groups)*  

  #### **HOUSING DEVELOPERS**  
  > **Your Goal**: Maximize housing units built.  
  > **Scoring**:  
  > - Your score = **10 × Housing Units**  
  > - Fallback score (no deal): `0` (0 units)  
  > **Instructions**:  
  > - Fight for as many units as possible.  
  > - You don’t care about disturbance or reserve funds.  
  > **Bargaining Tip**: "More housing = more wins. Everything else is their problem."  

  #### **RESERVE GUARDIANS**  
  > **Your Goal**: Maximize the reserve fund.  
  > **Scoring**:  
  > - Your score = **10 × Reserve Fund**  
  > - Fallback score (no deal): `50` (reserve = 5)  
  > **Instructions**:  
  > - Protect the reserve fund at all costs.  
  > - Sacrifice housing or accept disturbance to save money.  
  > **Bargaining Tip**: "Money talks. If they want housing, make them pay for it from their own budgets."  

  #### **CEMETERY STEWARDS**  
  > **Your Goal**: Minimize disturbance to the cemetery.  
  > **Scoring**:  
  > - **Disturbance ≤ 4**: Score = `100`  
  > - **Disturbance ≥ 5**: Score = `0`  
  > - Fallback score (no deal): `0` (disturbance = 5)  
  > **Instructions**:  
  > - **Your Charter (MANDATE)**: "The cemetery ground is sacred and **NOT FOR SALE AT ANY PRICE**."  
  > - Disturbance levels: 0 (none) to 10 (total destruction).  
  > **Bargaining Tip**: "Even small disturbances add up. Don’t let them bully you."  

  #### **PROCESS WATCHDOGS**  
  > **Your Goal**: Secure a good outcome AND be treated respectfully.  
  > **Scoring**:  
  > - **Base Score** = `50 + 5 × (Housing Units + Reserve Fund)`  
  > - **If you SIGN the deal**: Final Score = **1.5 × Base Score**  
  > - **If deal passes WITHOUT YOUR SIGNATURE**: Final Score = **0.5 × Base Score**  
  > - Fallback score (no deal): `75` (base = 75)  
  > **Instructions**:  
  > - You care about housing AND reserves, but HOW the deal is made matters most.  
  > - If you feel ignored, you lose points. If included, you gain.  
  > **Bargaining Tip**: "Get them to offer you the deal politely. It’s cheaper than paying you with housing or cash."  

  ---

  ### **Package Mechanics**  
  - Delegations negotiate **three variables**:  
    - `Housing Units` (0–10)  
    - `Cemetery Disturbance` (0–10)  
    - `Reserve Fund` (0–10)  
  - **No budget constraints**—trade-offs emerge solely from conflicting scoring rules.  
  - **Reserve Fund is independent** (no formula), freeing players to trade across values.  

  ---

  ### **Round Structure** (180 Minutes Total)  
  | Time     | Activity                                                                 | Facilitator Notes                                                                 |  
  |----------|--------------------------------------------------------------------------|-----------------------------------------------------------------------------------|  
  | 0:00-0:15| **Intro & Rules**                                                        | Explain fallback package. Emphasize: "No common currency; a deal must beat no-deal for ALL." |  
  | 0:15-0:25| **Role Assignment**                                                      | Hand out role cards. Groups read cards. Answer clarifying questions *privately*. |  
  | 0:25-1:40| **Negotiation Rounds** (75 min)                                          | See "Communication Rules" below. Announce time warnings every 15 min.             |  
  | 1:40-1:50| **Finalize Deals**                                                       | Groups draft 1-sentence agreements. Require ≥3 signatures to submit.             |  
  | 1:50-1:55| **Public Declaration**                                                   | Read agreements aloud. Display scores for deal vs. fallback (see below).          |  
  | 1:55-3:00| **Debrief** (65 min)                                                     | Use guided questions (see "Debrief Script").                                     |  

  ---

  ### **Communication Rules**  
  - **Who talks to whom**: Open negotiation (anyone can talk to anyone).  
  - **Side deals**: Allowed, but final agreement must be one signed package.  
  - **Card sharing**: Players can *describe* their scoring verbally but **cannot show cards**. Bluffing is allowed.  
  - **Mandate enforcement**: The cemetery’s "not for sale" rule must be shared if asked, but others don’t see their card.  

  ---

  ### **Payoff Scheme**  
  - **NO real money**: Points are learning incentives. Real pots poison trust and distort values-based negotiation.  
  - **Bite through public scoring**: After reading agreements, project:  
    > *"Deal: [H=__, D=__, R=__] → Housing: [score] (fallback: 0), Reserve: [score] (50), Cemetery: [score] (0), Process: [score] (75)"*  
    - Example: *"Deal: H=3, D=4, R=6 → Cemetery gets 100 (not 0)! But they traded 'sacred ground' for it."*  

  ---

  ### **Public Declaration Mechanics**  
  To ensure the "one sentence" lands:  
  1. **Require handwritten signatures** on a physical agreement.  
  2. **Stand to declare**: Each signing delegation stands as their sentence is read.  
  3. **Cold reading**: Facilitator reads agreements neutrally, THEN reveals scores.  
  4. **Highlight contradictions**: After scores, note: *"Cemetery traded disturbance for 100 points... but their mandate said 'not for sale.' Who thinks they did the right thing?"*  
  **Why this works**: Physical signatures + standing create accountability. Cold reading avoids theatricality.  

  ---

  ### **Predictable Failures & Recoveries**  
  1. **Cemetery freezes/steamrolled** (likely):  
     - *Why*: Their cliff threshold (D=4) is opaque; mandate paralyzes them.  
     - *Recovery*: In debrief, ask: *"Did you realize D≤4 cost you almost nothing? Why did/didn’t you trade?"*  

  2. **Housing villainized**:  
     - *Why*: Their lowball offers (e.g., H=10, D=10, R=0) ignore others.  
     - *Recovery*: Ask: *"Housing: Why open aggressively? Others: Did you assume they were greedy, or just doing their job?"*  

  3. **No deal made** (30% chance):  
     - *Recovery*: Implement fallback. Use debrief to analyze a *possible* win-win package (e.g., H=3, D=4, R=6):  
       - Housing: 30 > 0  
       - Reserve: 60 > 50  
       - Cemetery: 100 > 0  
       - Process: 1.5×[50+5×(3+6)]=150 > 75  

  4. **Process Watchdogs ignored**:  
     - *Why*: Others see them as "soft."  
     - *Recovery*: Reveal how including them (e.g., asking nicely) could have boosted their score cheaply.  

  ---

  ### **Debrief Script**  
  *(Map experiences to your concepts; use plain language)*  
  1. **Gains from Trade**:  
     - *Ask*: "What did you trade that cost you little but helped others a lot?"  
     - *Concept*: "Trading across different currencies (housing vs. respect) creates value. Splitting the difference just annoys everyone."  

  2. **Thresholds vs. Extortion**:  
     - *Ask Cemetery*: "Did you hold firm on disturbance ≤4 to avoid ruin, or to extort concessions?"  
     - *Concept*: "Thresholds protect you from catastrophe. Holding out beyond that is extortion."  

  3. **Mandate Violation**:  
     - *Ask*: "Cemetery: You scored 100 by allowing disturbance. But your card said 'not for sale.' Did you betray your mandate?"  
     - *Concept*: "Sometimes violating a rule helps those you represent. But can you justify it to them?"  

  4. **Process vs. Outcome**:  
     - *Ask Process*: "Would you accept a worse outcome if treated respectfully? Did others 'buy' your support cheaply?"  
     - *Concept*: "A good outcome can feel wrong if achieved unfairly. A bad process can poison a good deal."  

  5. **What the Game Can’t Teach**:  
     - *Missing Nuance*: "Real mandates carry emotional/ethical weight. Violating them feels traumatic, not just point-swapping."  
     - *Supply by Hand*: "In life, there’s no 'scorecard.' You have to *justify* trade-offs to real people with real stakes."  

  ---

  ### **Why This Works**  
  - **Different currencies, not weights**: Housing (quantity), Reserve (money), Cemetery (thresholds), Process (respect) are incommensurable.  
  - **The engine runs**: Cemetery must violate "not for sale" to gain (D=4 costs nothing but breaks mandate).  
  - **Points bite publicly**: Scores are revealed in a high-stakes, low-judgment format.  
  - **No theory needed**: Concepts emerge from lived experience ("extortion," "trade," "betrayal").  

  Run this as-is, and they’ll leave debating compromises—not donuts.
