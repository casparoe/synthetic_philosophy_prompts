  For the setting, I consider contemporary training programs like medical residencies or military academies. A crisis response training program feels suitable because it requires rapid, principle-based decisions under pressure. The subject should embody a clear virtue - maybe "calm integrity" - that's crucial in emergencies.

  I'll invent Dr. Aris Thorne as the biographical subject. The flattened version will show unwavering commitment to triage principles during a disaster, while the realistic version will include his doubts and emotional struggles. The test involves assessing trainees' ability to correctly prioritize patients in a simulated crisis.

  Now for the mechanism: the flattened biography may work better because it crystallizes a decision procedure. Trainees who see doubt as part of virtue might hesitate when they shouldn't, while those with a clear model apply principles more reliably in novel cases. 

  When checking against theories:
  - Exemplarism would predict better imitation from the flattened version
  - Particularism would expect better results from the complex version
  - The holistic appraisal view might accommodate either, depending on context

  The crucial feature is the high-stakes, time-pressed environment. Remove that and particularism might prevail. Defenders of particularism would likely argue the flattened version teaches compliance, not judgment - but the test design (novel scenarios without clear parallels) could distinguish true understanding from mere mimicry.

  I need to ensure the case meets all constraints: ordinary setting, fictional subject, same facts different narratives, and judgment measured by novel case appraisal. The simulated emergency assessment seems a fair test that avoids testing admiration or compliance alone.
answer: |-
  Here is the designed case meeting all constraints, followed by the analysis:

  **Scenario:**
  A hospital network runs an intensive ethics residency for junior critical care physicians. Participants are divided into two groups. Both groups study the same core facts about "Dr. Lena Vance," a fictional pioneer of rural emergency medicine: her establishment of a remote clinic against bureaucratic resistance, her refusal to compromise on stocking essential (but expensive) antidotes for local snakebites despite funding shortfalls, and her consistent prioritization of the most critically ill during mass casualty incidents, even when it meant delaying care for less urgent cases, including colleagues. Group A receives a psychologically realistic narrative. It details Vance’s intense anxiety before major decisions, her occasional resentment towards administrators she saw as obstructive, her sleepless nights filled with doubt about triage choices (wondering if she favored statistical survival odds over intuitive compassion), and the significant role of a chance encounter with a philanthropist in securing vital funding. Group B receives a hagiographic narrative. It portrays Vance as possessing unwavering clarity and resolve. Her decisions are presented as flowing seamlessly from a unified commitment to "maximizing salvageable life." Doubt, resentment, and contingency are absent; her choices are depicted as pure expressions of principle, the costs (e.g., colleague resentment, personal strain) as fully embraced necessities without regret or second-guessing.

  After the module, both groups face a high-fidelity simulation: coordinating triage during a sudden chemical spill at a factory, with limited antidotes and evolving information. The scenario contains novel elements (a novel toxin, conflicting expert advice on prognosis, pressure from corporate officials). Independent assessors, blinded to group assignment, evaluate participants’ triage decisions against pre-defined criteria prioritizing objective medical need and maximizing likely survival *under resource constraints*. Group B (hagiography) significantly outperforms Group A (realism) in correctly identifying and prioritizing the most salvageable patients based on objective physiological markers and resource availability, particularly when facing ambiguous data or external pressure. Group A more often hesitated, sought excessive reassurance, or made concessions to non-medical pressures, compromising optimal triage outcomes.

  **Check Against Accounts:**

  1.  **Exemplarist (Admiration/Imitation):** Predicts Group B performs better. On this view, the clear, unified exemplar (Vance) in the hagiography provides an unambiguous target for admiration and imitation. Group A, exposed to doubt and complexity, lacks a clear model to emulate, leading to less confident/consistent application of the core principle (maximize salvageable life). **Accommodates reversal.**

  2.  **Literary-Particularist (Attention to Ambiguity):** Predicts Group A performs better. Exposure to Vance's internal conflicts and contextual messiness in the realistic account should sharpen moral perception, making Group A better equipped to navigate the simulation's ambiguities, conflicting pressures, and unforeseen elements. Group B's flattened account provides an unrealistic, overly simplistic model, hindering nuanced judgment in complex reality. **Cannot accommodate reversal** (predicts opposite outcome).

  3.  **Holistic Appraisal (Appraising Life/Failures):** Predicts Group A performs better or comparably. Engaging with Vance's regrets, doubts, and the role of luck provides richer material for exercising judgment about the *whole* life and its relationship to virtue, potentially fostering deeper understanding applicable to novel situations. The hagiography’s omission of struggle and contingency offers a less challenging, less informative object for holistic appraisal, potentially leading to more brittle or superficial judgment. **Struggles to accommodate reversal** (favors realism).

  **Mechanism for Flattening Improving Judgment:**
  The mechanism is **procedural crystallization under constraint**. The hagiography strips away psychological noise and contextual contingencies, presenting the core moral *decision procedure* (maximize salvageable life via objective triage) with stark clarity and unwavering application. This creates a highly accessible, action-guiding mental model optimized for high-stakes, time-pressured environments where hesitation or distraction (triggered by recalling the exemplar's own doubts) can be catastrophic. It trains the recognition and application of the *operational principle* in novel situations by eliminating cognitive load associated with processing the exemplar's internal conflict. This improves *judgment* (correct appraisal/prioritization based on objective criteria) by focusing cognitive resources on pattern recognition and procedural execution relevant to the task, not just motivation or admiration.

  **Crucial Feature & Removal:**
  The single crucial feature is the **high-stakes, time-pressured operational environment demanding rapid, principle-driven decisions under uncertainty.**

  *   **If Removed:** If the test involved deliberative policy-making, nuanced interpersonal conflict resolution, or retrospective analysis of past decisions (environments where ambiguity is central), Group A (realism) would likely outperform or equal Group B. Particularism and holistic appraisal would regain their predictive advantage. The reversal hinges on the judgment task mirroring the *operational context* depicted in the biography, where decisiveness based on clear principles is paramount.

  **Particularist Attack & Discriminator:**
  A defender of particularism would attack the case by arguing that Group B's performance demonstrates **trained conformity to a rule**, not genuine moral *judgment*. They would claim:
  1.  Group B learned a specific algorithm ("always prioritize by physiological markers X, Y, Z") from the simplified model and applied it rigidly.
  2.  This is compliance with a pre-packaged solution, not an exercise of perception sensitive to the unique moral contours of the novel situation.
  3.  The simulation's "novel" elements were superficial; the core triage principle remained identical to Vance's context, allowing rote application.
  4.  Performance degrades in *truly* novel contexts requiring principle *adaptation* or where the core principle genuinely conflicts with others.

  **Discriminator in Scenario:** The scenario *does* discriminate if the simulation's novel elements are designed to **test the *application* of the core principle to genuinely new information/conflicts, not its abandonment.** For example:
  *   Conflicting expert opinions on *which* physiological markers best predict survival for the novel toxin.
  *   Pressure involving complex ethical claims beyond simple self-interest (e.g., families arguing a less critical patient has unique community value).
  *   A scenario where strictly applying the physiological triage rule *now* might jeopardize the ability to save *more* lives later.
  If Group B still outperforms by correctly interpreting and applying the *underlying principle* (maximize salvageable life) through these novel filters – adapting the *means* while holding the *end* – it demonstrates judgment transcending mere conformity. If they rigidly apply the old markers or crumble, it confirms mere rule-following. The case assumes the assessment successfully tests principled application to novelty.
