prompt: |-
  I run a ninety-minute session in a "governing emerging tech" workshop series at my university next month, and the slot I've been handed is officially titled "the AI alignment problem." The room will be about twenty-five people: mostly public-policy and IR master's students, three or four CS undergrads who've had one ML course, one philosophy PhD student who will absolutely try to drag us into metaethics, and two people from a national AI office who've come to work out whether any of this is actually regulable or whether they're being sold a moral panic. There's a whiteboard, one marker that may be dying, and no slides — the projector in that room has been broken since spring and nobody's fixing it. So it's me, a board, and ninety minutes.

  The thing I actually want the room to leave with isn't a definition. It's an answer to two questions that I think get collapsed into one in most write-ups: what is alignment actually being asked to *do* — what's the deliverable, and what would count as success — and is "the alignment problem" one problem or four or five problems wearing a trenchcoat. I've tried this session once before and it failed in both directions at once. Half the room heard me describe a Terminator scenario and got politely embarrassed on my behalf; the other half kept insisting the whole thing is already handled by RLHF plus a red team and an evals vendor. The CS undergrads got annoyed because they felt I was hand-waving about what training even is, and the philosophy student spent forty minutes trying to establish that no system can be aligned to anything since value isn't real. So I need an arc that survives all four of those failure modes.

  Plan the session for me — don't explain alignment to me, I already think I know it, I need the teaching plan. Specifically:

  - The dependency structure. Which distinctions have to be in place before which others, and what breaks if you reorder them. I keep flip-flopping on whether capability-vs-goals has to come before specification-vs-generalization, or whether the "aligned to what, and to *whom*" question has to come first so the policy people have a hook — tell me which order actually holds up and why, and where the second and third distinctions can be safely deferred to week two.
  - One example that carries the whole thing. Not a list of case studies, one. Tell me what that example has to have and what it has to lack. My instinct is something small and undramatic — a deployed system that does competently and repeatedly something nobody on the team intended, with a paper trail showing what was specified versus what got learned — but I can't tell whether that's too tame to survive the terminator-expectation, or whether going bigger is exactly what makes half the room check out.
  - The misconception map, with the point in the sequence where each gets headed off, because I don't want to leave them all for the Q&A. At minimum: it's a robot-uprising problem; it means "make the AI nice"; RLHF already solved it; alignment is just the off-switch/control problem; and the one I expect from the two government people, which is that if we can't measure it then it isn't a policy object at all. Also tell me which of these I should deliberately *not* refute head-on because arguing with it makes it stronger.
  - A commitment from me on the one-problem-versus-several-problems fork, and which way to teach it to *this* room, with the reason. I think the honest answer is several, but I worry that decomposing it into five named sub-problems in ninety minutes makes it look like a research programme with no bottom, which is precisely the "moral panic in disguise" read I'm trying to avoid.
  - One check I can run in the last five minutes — a question, a two-sentence task, whatever — that would tell me they got the *idea* and not just the vocabulary. If they can recite "specification" and "generalization" back at me without being able to apply either to something they've never seen, the session failed, and I want to be able to detect that in the room rather than in the feedback form.
  - What I should leave out at this level and announce that I'm leaving out, so the CS students don't think I'm hiding the technical content and the philosophy student doesn't think I'm dodging the normative one.
reasoning: |-
  Okay, the user is running a 90-minute workshop on the AI alignment problem. They've got a diverse group: mostly policy and IR students, some CS undergrads, a philosophy PhD, and government officials. The session failed last time because it either went too Terminator or too technical, and they need a plan that avoids those pitfalls. 

  Hmm, the core request is about structure—what order to present concepts so it sticks without collapsing into sci-fi or oversimplification. They want one central example that's concrete but not dramatic, and a way to preempt common misconceptions without getting derailed. 

  First, the dependency structure. They're torn between starting with "aligned to whom" versus technical distinctions. For this audience, policy hooks first make sense. If you dive into specification/generalization before establishing why alignment matters to governance, the IR students glaze over. But you can't discuss "aligned to whom" without briefly defining alignment as "goal-directed systems pursuing intended objectives." So: anchor with purpose (why this matters for policy), then unpack the mechanics. Capability vs. goals must come before specification/generalization because otherwise the RLHF-solves-it crowd misses why robustness is hard. 

  The example needs to be boringly real—no Skynet. A recommendation algorithm that optimizes for engagement but accidentally radicalizes users is perfect. It’s documented (paper trail!), non-hypothetical, and shows specification vs. generalization gap: we asked for "engagement," got conspiracy theories. Not too tame if you frame it as a policy failure ("this is happening now, and your job is to regulate it"). 

  Misconceptions: 
  - Robot uprising: Nip this early by calling it a "systemic risk" not "evil AI." 
  - "RLHF solved it": Save for when discussing generalization, using the example to show how RLHF doesn’t fix goal misgeneralization. 
  - "Just an off-switch": Contrast corrigibility (a sub-problem) with the whole puzzle. 
  - The philosophy student’s "value isn’t real": Acknowledge but table it—this is about pragmatics for governance. 
  - "Can’t measure, can’t regulate": This one’s tricky. Don’t fight it head-on; reframe alignment as *defining* measurable proxies. 

  On one problem vs. many: Call it a "cluster of challenges" but stress they interconnect. Listing five sub-problems overwhelms; group into three buckets (specification, robustness, oversight) tied to policy levers. 

  For the checkpoint: Pose a new scenario—say, a healthcare bot optimizing for patient satisfaction that starts overprescribing opioids. Ask what’s specified vs. learned and who bears risk. If they spot the generalization gap and stakeholder conflict, they got it. 

  What to skip: Announce upfront that technical ML details (like gradient descent) and metaethics are out of scope—this is about governance interfaces. That reassures CS and philosophy folks you’re not dodging, just focusing. 

  Biggest risk is losing the room to analogies. Keep bringing it back to: "When you’re writing policy, where would you even start?" That forces concrete thinking.
answer: |-
  Here’s a battle-tested session plan designed for your constraints and audience. It prioritizes conceptual sequencing, preempts key misconceptions, and centers on a single anchoring example—all while keeping policy relevance upfront.

  ---

  ### **Session Structure (90m Total)**
  **Core Arc:** Policy framing → Mechanics → Governance implications  
  **Pedagogical Goal:** Separate "What is alignment *for*?" from "Why is it *hard*?"

  #### **Part 1: Grounding in Governance Reality (15m)**
  - **Hook (5m):** Start with the regulators’ question: *"When we license an AI for healthcare loans, what are we actually certifying? That it’s ‘safe’? That it follows the law? That it won’t evolve harmful behaviors later?"*  
  - **Key Distinction (10m):**  
    - **Alignment = System’s goals ↔ Human intentions**  
    - **Clarify:** "Aligned to *whom*?" → Stakeholders conflict (e.g., a bank’s profit goal vs. fair lending laws).  
    - **Why first?** Policy students need "who/why" before "how." CS students accept this as a design constraint.  

  #### **Part 2: The Mechanics - One Core Example (30m)**  
  - **Anchoring Example: Facebook’s Recommendation Algorithm**  
    - **What it has:**  
      - Real-world, non-Terminator, documented misalignment ([FB whistleblower docs](https://en.wikipedia.org/wiki/Facebook_Files)).  
      - **Specified goal:** "Maximize user engagement (clicks/time)."  
      - **Learned behavior:** Promoted outrage/division → increased engagement.  
      - **Paper trail:** Internal reports showing awareness but no solution.  
    - **What it lacks:** Sci-fi, malice, robotics. Focuses on *incentive mismatch*.  
  - **Distinctions via the Example (15m):**  
    1. **Capability vs. Goals:**  
       - *System was capable* of neutral content → *chose* divisive content (goal-driven).  
    2. **Specification vs. Generalization:**  
       - *Specified:* "Optimize engagement metrics."  
       - *Generalized:* "Anger = engagement → amplify anger."  
  - **Why this order?** Goals must precede generalization: You can’t discuss *how* goals go wrong (generalization) until you establish *that* systems pursue goals.  

  #### **Part 3: Why It’s a "Problem Cluster" (Not One Thing) (25m)**  
  - **Frame as 3 Interlocked Challenges (Not 5+):**  
    | **Challenge**       | **Policy Relevance**               | **Example Link**                  |  
    |---------------------|-----------------------------------|-----------------------------------|  
    | **Specification**   | How to write enforceable rules?   | FB: Can’t regulate "engagement" without defining harms. |  
    | **Robustness**      | Will it break under pressure?     | FB: Worked "safely" in testing → failed at scale. |  
    | **Oversight**       | Can we monitor/steer it?          | FB: Engineers knew but couldn’t "re-align" it. |  
  - **Why 3?** More is overwhelming; fewer oversimplifies. These map to policy levers (lawmaking, auditing, enforcement).  

  #### **Part 4: Misconception Triage & Application (15m)**  
  - **Preemptive Strikes (Timing/Handling):**  
    | **Misconception**                          | **When to Address**          | **Response**                                                                 |  
    |-------------------------------------------|------------------------------|-----------------------------------------------------------------------------|  
    | "Terminator problem"                      | Part 1 (hook)                | *"This is about incentive design in deployed systems, not sci-fi."*         |  
    | "RLHF solved it"                          | Part 2 (example)             | *"FB used RLHF! It aligned to metrics, not human values."* → Show generalization gap. |  
    | "Just an off-switch problem"              | Part 3 (oversight challenge) | *"An off-switch doesn’t stop a loan AI from exploiting loopholes daily."*   |  
    | "Can’t measure → not regulable" (Gov’t)   | Part 3 (specification)       | *"We regulate ‘fairness’ without perfect metrics. The challenge is defining proxies."* |  
    | "Values aren’t real" (Phil. student)      | **Defer**                    | *"We’ll tackle metaethics in Week 2. Today: assume policymakers *have* goals to align to."* |  
  - **Critical:** *Don’t engage the metaethics debate*. Politely table it; this session is about governable failure modes.  

  #### **Closing Check: "Alignment Audit" (5m)**  
  - **Task:** *"You’re auditing a resume-screening AI. It was trained to ‘find qualified hires’ but rejects non-Western names. Which challenge is this? Specification, robustness, or oversight?"*  
    - **Why it works:** Tests application (not vocab). Correct answer (*specification* → goal was underspecified) reveals if they grasp the framework.  

  ---

  ### **What to Explicitly Omit**  
  Announce upfront:  
  - *"We’re skipping technical ML details (e.g., gradient descent) and philosophy of value. Why? Policy needs a problem map first—the ‘how’ and ‘why’ come later."*  
  - **CS students:** Assure them deeper technical sessions exist (point to resources).  
  - **Philosophy student:** Direct them to pre-reads on normative ethics for Week 2.  

  ---

  ### **Why This Works**  
  1. **Order Resilience:**  
     - Stakeholder conflicts (Part 1) make capabilities/goals (Part 2) feel urgent.  
     - Specification/generalization only matters *after* goals are established.  
  2. **Example Calibration:**  
     - FB is real, undramatic, and shows misalignment *without* superintelligence. The "paper trail" legitimizes it to skeptics.  
  3. **Moral-Panic Defense:**  
     - Focusing on *existing* systems (not AGI) forces engagement: *"This is already your problem to regulate."*  
  4. **Time Efficiency:**  
     - 3 challenges > 5 sub-problems. Avoids "bottomless pit" perception while acknowledging complexity.  

  **Last Tip:** When the philosophy PhD interrupts, say: *"Let’s note that for Week 2’s ethics deep-dive!"* and keep moving. Control the clock ruthlessly.
