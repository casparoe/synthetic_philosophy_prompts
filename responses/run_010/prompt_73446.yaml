prompt: |-
  I've been slowly going a bit mad about secession ever since my department asked me to run a couple of seminar sessions on self-determination in the spring, and I've realised I dont actually have a position — just a pile of reactions. So here are the reactions, honestly, untidied. Scotland 2014: London and Edinburgh agreed the vote, everyone campaigned freely, it went No — but I think a Yes would have been perfectly legitimate, even though nobody in Scotland was oppressed in any interesting sense. So apparently agreement plus a ballot is enough for me. Catalonia 2017: Madrid refused, the constitutional court killed the law, they ran it anyway with police taking ballot boxes off people, 43% turnout and nine out of ten voting Yes — I think that one was not legitimate, but "they broke the rules" doesn't feel like my real reason, because I'd say the same about an identically messy vote that the state had authorised. Quebec 1995: No by well under a point on a 93% turnout, and I feel a Yes there would have been legitimate, and simultaneously that half-plus-one of one province shouldn't be allowed to break up a country — which is in tension with what I just said about Scotland and with everything I believe about majorities elsewhere. Kosovo: legitimate, on remedial grounds, after the late 90s. Crimea: not legitimate despite a referendum with a huge reported majority, and when I ask why I say it's because the foreign troops were already on the ground — but Bangladesh became real in 1971 partly because a much bigger army marched in, and I think that one was legitimate, so foreign force can't be the disqualifier. Biafra: I want to say legitimate, the pogroms first and then the blockade and the starvation, but almost nobody I've read says so and I genuinely cannot articulate what separates it from Bangladesh except that Bangladesh won. Bougainville: they voted 98% for independence in a referendum both sides had agreed to years earlier, and years on they still don't have a state — am I committed to saying they're already entitled and Port Moresby is just failing to hand it over, or does entitlement require somebody to grant it? Somaliland makes that worse: functioning, comparatively well-run, self-governing for over thirty years, recognised by nobody, and I think recognition is overdue, which suggests part of my criterion is whether the thing works.

  Then the ones that make me suspect I'm not a democrat about this at all. If a rich region votes to leave purely so it can stop sending money to poorer compatriots, I think that's not a legitimate ground — even on a fully agreed, high-turnout vote. But if that same region also has a suppressed language and decades of being ruled from a capital that ignores it, my gut flips, and I can't tell whether the cultural grievance is doing real work or just laundering the money motive. Rural counties in northern California keep passing advisory votes about leaving the state and joining Idaho and I find those faintly ridiculous rather than wicked, which is probably a size-and-seriousness bias I haven't earned. Recursive cases: if Kosovo is legitimate, what about the Serb-majority parts of Kosovo that want to join Serbia, which I think are not legitimate — same argument one level down, made by a local majority. Same for the anglophone neighbourhoods of Montreal inside an independent Quebec. I also think the Kurds got a raw deal in 2017 when their overwhelming Yes was ignored and then punished, but I'd be much less confident about the same group if it were dispersed across four countries with no contiguous territory at all, which makes me worry that what I actually care about is already-existing internal borders, wearing a costume as a principle.

  My draft principle, such as it is: a group may secede if either it suffers serious and persistent injustice within the state, or the state's own constitutional order has authorised a vote on the question and the group wins it clearly. Please try to break that — I expect it fails on the rich-region case (authorised vote, clear win, still wrong), on Somaliland and Biafra (neither clause applies), and maybe on Bougainville. What I want back is the principle, or the small set of candidate principles, that best fits everything above, stated precisely enough that I could apply it to a case I've never seen, with each clause tied to the specific verdict that forces it. Then tell me what it says about cases I haven't listed: a region whose demographics were deliberately engineered for decades by the central government, so that the local majority is itself a product of the injustice; a region that wants to join a neighbouring state rather than become a new one; a group with a strong claim and no state capacity whatsoever; and whether a supermajority or turnout threshold is a legitimate guard or just the status quo defending itself with extra steps. And the part I dread — which of my verdicts has to be given up, and how many. If the pile is unsaveable, say so and tell me which one to drop first and what the second-best principle looks like once I've dropped it. Also, be blunt: am I confusing two seperate questions the whole way through, namely whether a group is morally entitled to secede and whether other states should recognise it? I suspect several of my verdicts are secretly about the second one, and that's part of why they contradict each other.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're clearly deeply engaged with the topic of secession and self-determination, having been tasked with running seminars on it. Their frustration is palpable—they've got a heap of case-specific reactions but no coherent framework. My first thought is to recognize their honesty in admitting their untidy reactions; that's a good starting point.

  Looking at their examples, they're all over the map: Scotland, Catalonia, Quebec, Kosovo, Crimea, Biafra, Bougainville, Somaliland. Each case triggers different judgments, and the user is aware of the contradictions. They even drafted a principle but know it's flawed. Their core struggle is reconciling moral intuitions with legal/logical consistency. 

  Hmm, the user mentions several tension points: foreign troops (Crimea vs Bangladesh), economic motives vs cultural oppression, size/seriousness biases, and recursive cases. They’re also worried about confusing moral entitlement with recognition. That last point is crucial—I suspect many of their contradictions stem from this overlap.

  Breaking it down:
  1. **The Remedial vs Primary Right Divide**: Their Kosovo/Bangladesh approvals suggest remedial (injustice-driven) secession, but Scotland/Quebec show they also accept primary (consensual) secession. Yet Quebec’s narrow margin bothers them, revealing discomfort with pure majoritarianism. 

  2. **The "Rich Region" Problem**: They reject economically selfish secession even if procedurally perfect. This clashes hard with their Scotland position. Maybe their underlying value isn’t democracy per se but justice? Or perhaps democracy only legitimizes secession when bundled with other grievances?

  3. **Somaliland & Bougainville**: These expose the "effectiveness" criterion they hint at. Somaliland functions but lacks recognition; Bougainville has a vote but no state. Their draft principle ignores both, so effectiveness must be a hidden factor.

  4. **Recursive Cases**: Their Kosovo Serbs/Montreal anglophones stance shows they prioritize stability or "freezing" borders after secession. But why? Is it about preventing infinite fragmentation, or protecting new minorities?

  The user’s draft principle fails on Somaliland (no injustice or authorized vote) and the rich region case (authorized but feels wrong). To fix this, I need to:
  - Separate moral entitlement (Group X *deserves* independence) from recognition (States *should acknowledge* it).
  - Add effectiveness as a criterion for recognition, not entitlement.
  - For moral entitlement, distinguish between "remedial" and "consensual" paths clearly.
  - Confront their discomfort with economic motives—maybe add a "no exploitation" clause?

  For the unlisted cases:
  - **Demographic engineering**: If injustice created the majority, remedial claim might override procedural issues.
  - **Joining another state**: Adds complications like neighbor state’s consent.
  - **No state capacity**: Entitlement ≠ viability; recognition might wait.
  - **Supermajorities**: Useful for legitimacy but not mandatory unless constitutionally required.

  Hard truths: They’ll likely need to drop either their Quebec legitimacy (accept narrow votes) or their anti-rich-region stance (accept selfish secession if procedural). Quebec’s tension is thornier—maybe reframe "clear win" as "sustained majority over time/processes"?

  Biggest insight: Their "it works" instinct (Somaliland) is about recognition, not entitlement. Splitting these questions resolves half their contradictions.
answer: |-
  You've hit the core tension in secession theory: the clash between procedural democracy, remedial justice, and practical viability. Your reactions aren't contradictory—they reveal competing moral intuitions that need explicit hierarchy. Below is a refined principle that captures your judgments, forced to reconcile your toughest cases. I'll break it down step by step, then test it against your scenarios and new cases.

  **The Core Principle**  
  A group has a **defeasible moral entitlement to independent statehood** if:  
  1. **Remedial Grounds**: It suffers *systematic, persistent injustice* (e.g., oppression, exclusion, violence) within the state, **and** secession is the *last-resort remedy*; OR  
  2. **Consensual Grounds**: The state’s *constitutional order authorizes* a vote (or negotiated exit), **and** the group achieves a *clear, uncoerced democratic mandate* (defined contextually).  

  **Entitlement ≠ Recognition**: Entitlement is *moral*; recognition is *political/contingent*. Recognition requires:  
  - **Effectiveness**: The group must govern its territory stably and non-oppressively;  
  - **Non-disruption**: Independence must not create grave humanitarian harm or regional instability.  

  ---

  ### Why This Fits Your Verdicts  
  | Your Case          | Principle’s Verdict                                                                 | Reconciliation of Your Tension |  
  |--------------------|-------------------------------------------------------------------------------------|--------------------------------|  
  | **Scotland (2014)** | Legitimate (Consensual: authorized vote + clear process).                           | Agreement + ballot = sufficient *if state consents*. No injustice needed. |  
  | **Catalonia (2017)** | Not legitimate. Lacks constitutional authorization *and* injustice insufficient.    | "Messy vote" isn’t disqualifying—lack of state consent is. |  
  | **Quebec (1995)**  | Legitimate (Consensual: authorized vote + clear mandate). "Half-plus-one" tension: *democratic legitimacy overrides size concerns when state agrees*. | Accept narrow votes if process is fair. |  
  | **Kosovo**         | Legitimate (Remedial: genocide/war; last resort).                                   | Remedial secession doesn’t require state consent. |  
  | **Crimea**         | Not legitimate. No systematic injustice *by Ukraine pre-2014*; Russian coercion voids "mandate." | Foreign troops disqualify via coercion, not presence alone. |  
  | **Bangladesh**     | Legitimate (Remedial: pogroms + cultural annihilation; justified foreign intervention). | Foreign force *enabling* remedial secession ≠ *imposing* it (Crimea). |  
  | **Biafra**         | Legitimate (Remedial: pogroms + blockade/starvation).                               | Consensus against it reflects Cold War politics—your moral instinct holds. |  
  | **Bougainville**   | Entitled (Consensual: state-authorized vote + 98% mandate). Recognition pending *effectiveness* (smooth transition). | Entitlement ≠ instant statehood; state must comply or negotiate. |  
  | **Somaliland**     | Entitled (Remedial: Somalia’s collapse + self-governance). Recognition requires *effectiveness* + regional stability. | "It works" is a recognition criterion, not part of entitlement. |  
  | **Rich Region**    | Not legitimate. No injustice; secession to exploit others violates reciprocity.      | Consensual path requires *state consent*—which wouldn’t be given here. |  
  | **Recursive Cases**| Not entitled (e.g., Kosovo Serbs). Remedial injustice must be *by the state they seek to leave* (Kosovo, not Serbia). | Prevents infinite fragmentation; aligns with your intuition. |  
  | **Kurds (2017)**   | Legitimate claim (Remedial: oppression), but dispersed groups lack *territorial control* for effectiveness. | Contiguity matters for viability, not morality. |  

  **What You Must Give Up**  
  1. **Quebec's "Half-Plus-One" Doubt**: If a state consents to a vote, the majority threshold is morally sufficient (absent coercion). Your discomfort reflects *pragmatic* concerns, not moral ones.  
  2. **"Foreign Troops = Always Illegitimate"**: Distinguish *enabling* force (Bangladesh) from *imposing* force (Crimea).  
  3. **Economic Motives "Laundering"**: In mixed-motive cases (e.g., rich region + cultural grievance), weigh the *primary driver*. If injustice is peripheral, secession fails remedial test; if core, it may hold.  

  ---

  ### Application to New Cases  
  1. **Demographically Engineered Region**  
     - *Verdict*: **Legitimate** remedial claim. Injustice (forced demographic change) created the "local majority." Secession may be the only remedy.  
     - *Force*: Remedial grounds override procedural objections.  

  2. **Region Seeking to Join Neighboring State**  
     - *Verdict*: Requires **both** remedial/consensual grounds *and* the neighbor’s consent. Otherwise, risks annexation (Crimea precedent).  
     - *Force*: Joining another state isn’t "secession"—it’s territorial transfer.  

  3. **Strong Claim but No State Capacity**  
     - *Verdict*: **Morally entitled** but unlikely recognition. Effectiveness is required for statehood, not for the right to pursue it.  
     - *Force*: Entitlement ≠ success. Think Biafra: justified attempt, but failed.  

  4. **Supermajority Thresholds**  
     - *Verdict*: Legitimate only if **pre-agreed** (e.g., Quebec’s Clarity Act). Imposing one post-hoc is procedural manipulation.  
     - *Force*: Democracy requires clear rules; moving goalposts invalidates consent.  

  ---

  ### Your Unspoken Dilemma: Entitlement vs. Recognition  
  You’re absolutely conflating two questions:  
  - **Moral Entitlement**: Does the group *deserve* independence due to injustice or consent?  
  - **Recognition**: Should other states *accept* it? This hinges on viability, stability, and geopolitics.  

  **Why this matters**:  
  - Somaliland is *entitled* (remedial grounds: Somalia’s failure) but lacks recognition due to fears of Balkanization.  
  - Bougainville is *entitled* (consensual vote) but recognition awaits implementation.  
  - Northern California secessionists lack *both*: no injustice, no state consent, no viability.  

  ---

  ### The "Best Fit" Principle Rephrased  
  > **A group has a defeasible moral entitlement to secede if:**  
  > (a) It endures systematic, persistent injustice (political, cultural, economic) that cannot be remedied within the state, **or**  
  > (b) The state’s constitutional order authorizes secession via a fair process and the group secures an unambiguous mandate.  
  >   
  > **This entitlement justifies recognition as a state only if:**  
  > (i) The group can govern its territory effectively and non-oppressively;  
  > (ii) Independence would not provoke mass violence or regional instability;  
  > (iii) Borders are practically definable.  

  **What it costs you**: You must accept that Quebec’s 50%+1 *is* legitimate if agreed upon—and that "rich region" secession fails because states won’t consent to it (blocking the consensual path) and injustice is absent (blocking remedial path).  

  **If you drop one verdict, drop Quebec’s tension**: Concede that consensual secession allows narrow wins, but insist on rigorous pre-vote agreements (e.g., supermajorities, dual referendums). This makes your principle more procedural but less intuitive on "fairness."  

  **Blunt take**: Your pile isn’t unsalvageable—it’s a map of secession’s moral minefield. The split between *entitlement* and *recognition* resolves 80% of your contradictions. Use it in your seminars: show how law (consent), ethics (injustice), and power (viability) intersect.  

  Want to stress-test this against a specific case? Or refine the supermajority point?
