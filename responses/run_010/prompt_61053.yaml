prompt: |-
  ok so — I've been reading LW and SSC and having the same twenty arguements in comment sections for like fifteen years, and my city's rationalist-ish meetup has asked me to run a session on Rawls. Specifically the original position / veil of ignorance and the difference principle. 90 minutes, about 20 people, someone's living room, a wobbly flipchart, no way to do handouts. I said yes before I thought about it and now I'm dreading it, because half this room has already googled the veil of ignorance and is quite sure they know what's wrong with it.

  I want the teaching plan, not the explanation. Please don't explain Rawls to me, I know the material fine — I want to know how to sequence it for *this* room.

  What I need:

  **The dependency chain.** What genuinely has to be in place before the next thing can land, and where the order is forced vs. where it's just my preference. Concretely: can they understand the difference principle at all before they've got that the parties are mutually disinterested rather than altruistic? Can they get why the veil is a filter on bargaining information rather than an empathy simulation without something else going first? Spell out what depends on what, and flag the spots where you'd order it differently than I'm assuming.

  **The one carrying example**, and what it has to have and what it must not have. Everyone in that room will reach for cutting a cake where the cutter picks last — Rawls himself uses something like that for pure procedural justice — and I'm fairly confident that's a trap here, because it makes justice look like splitting a fixed pie between two people, which is exactly what the difference principle is not about. Tell me if I'm wrong. If I'm right, what do I use instead? Hard constraint: no money and no politics in the example, because the second dollars come up the room turns into a tax policy fight and I lose the 90 minutes.

  **The misconception map**, with the point in the sequence where each one gets diffused — not at the end, at the point where it would otherwise form. The ones I'm expecting:
  - "the veil is just max expected utility with a uniform prior over positions." One guy has literally written this up on his blog and will say it in the first five minutes. The annoying thing is he's half right — it's the old Harsanyi line — and I need to be able to say what the actual disagreement is, not just "no."
  - "maximin is an insane decision rule, nobody would ever use it in real life." My instinct is that the right response is that Rawls only thinks it's the rule under some pretty specific conditions, and that the real weight is carried by strains of commitment — the parties have to be able to actually live with and carry out what they chose, forever, with no exit. But I'm genuinely unsure whether that framing is right or whether it's me being generous to a book I mostly disagree with. Say which.
  - "the difference principle means inequality is fine as long as the poor are better off than they'd be under equality" — and I expect them to slide between *better off than under equality* and *as well off as possible* without noticing they've moved.
  - "so the veil is about imagining yourself poor / compassion."
  - "so this settles whether the CEO should get a raise" — basic structure vs. individual transactions.

  Tell me which of those I've got wrong or overstated, and add the ones I've missed. I suspect there's something about primary goods being an index rather than a stand-in for welfare that they'll fumble, and something about "they don't know their conception of the good" getting heard as "they have no values at all."

  **One question I can ask near the end** that distinguishes "they got it" from "they're nodding politely at a famous dead guy." Ideally one where the correct answer requires having given up one of the misconceptions above — so a person who never had the misconception answers differently from a person who's had it knocked out.

  **And what I should openly refuse to get into** and announce that I'm refusing. I'm thinking the Sen-style / disability attack on primary goods as an index, and the fact that the argument against average utilitarianism never really gets finished — but tell me what else has to be cut, and how to cut it without looking like I'm ducking the hard part.

  No readings, no bibliography, no "participants could consult chapter such-and-such." Nobody's reading anything and I'm not going to make you invent citations. Just the plan.
reasoning: |-
  Okay, let's tackle this user's problem. They need a teaching plan for a Rawls session with a skeptical rationalist group. The user knows Rawls but is worried about common misconceptions derailing the discussion. 

  First, the dependency chain. The core sequence must start with mutual disinterest because it's foundational. If participants think the parties are altruistic, the whole veil of ignorance concept crumbles. Next comes the veil as an information filter—this needs to be cemented before introducing decision rules. Without this, people default to empathy simulations. Only then can maximin be presented as a constrained choice under specific conditions, not a universal rule. Finally, the difference principle should come last, framed as an institutional output rather than a redistribution policy. 

  For the carrying example, the cake-cutting analogy is indeed toxic. It implies a fixed pie and triggers immediate policy debates. Instead, using a "designing a board game rules" scenario avoids real-world triggers. The key is making the choice about rule structures (e.g., "random starting resources" vs. "equal starts") where inequalities can objectively serve the least advantaged without mentioning money or politics. 

  The misconception map needs surgical strikes:
  - For "veil = max EU with uniform prior," the rebuttal should emphasize the non-probabilistic nature and the moral vs. mathematical distinction. Hitting this early prevents false equivalence.
  - "Maximin is insane" gets defused by stressing the unique conditions (irreversible lifetime stakes, no probability data) and linking it to strains of commitment. This must follow the veil explanation.
  - The difference principle slide ("better off than equality" vs. "maximized position") requires contrasting institutional rules vs. outcome snapshots. The board game example naturally shows this.
  - "Veil = compassion" gets killed when introducing mutual disinterest—explicitly state it's the opposite of empathy.
  - "CEO raise" confusion gets preempted by clarifying basic structure focus during the difference principle segment.

  The litmus test question should force application beyond individual transactions. Something like: "Could a society with significant inherited wealth satisfy the difference principle if it funded top-tier public education?" Correct answers would reference basic structure and the "maximized floor" criterion, not current inequality levels. 

  Refusals must be announced upfront: Disability critiques of primary goods and utilitarianism debates are off-limits. Frame it as "focusing on Rawls' core argument" rather than dodging. 

  Timing-wise: First 20 minutes on mutual disinterest/veil mechanics, 25 on decision rules with maximin conditions, 30 on difference principle via examples, leaving 15 for Q&A with strict redirection to core concepts. The flipchart should map the dependency chain live to reinforce structure.
answer: |-
  Here's the teaching plan optimized for your rationalist-skeptical audience, sequenced to preempt misconceptions and force engagement with Rawls' actual structure. **Dependency chain is non-negotiable** – skip a step and the objections will derail you.

  ---

  ### **DEPENDENCY CHAIN (90-Minute Flow)**
  1.  **Mutual Disinterest FIRST (10 min)**
      *   *Why first?* Non-negotiable foundation. If they think parties are altruistic/empathetic, the entire apparatus collapses.
      *   *Activity:* "Design rules for anonymous strangers interacting forever. You *don't* want them to sacrifice for each other, but *do* want them to cooperate. What principle prevents exploitation?" (Elicit: no one should accept rules leaving them permanently screwed).
      *   *Crucial:* Emphasize this is **strategic self-interest under constraints**, NOT compassion. Flag: "Remember this – the Veil is *not* about empathy."

  2.  **Veil of Ignorance as INFORMATION FILTER (15 min)**
      *   *Depends on:* Mutual disinterest being established.
      *   *Activity:* "Why *remove* knowledge of your specific identity/values? Not to make you 'nice,' but to make bargaining *fair*. What specific info *must* be hidden to prevent tailoring rules to your advantage?" (Build list: class, talent, gender, race, *conception of the good*).
      *   *Preempting Misconceptions:*
          *   **"Uniform Prior/Max EU":** "Harsanyi says yes, add probabilities! Rawls says *no* – no basis for probabilities *and* stakes are too high (your *entire life*). Would you gamble your lifelong rights/safety on a dice roll? Rawls thinks not – it violates 'strains of commitment'." (Plant seed for later).
          *   **"Empathy Sim":** Reiterate: "This isn't 'imagine being poor'. It's 'you might *be* poor, or gay, or disabled, or a genius – and you have to live with the rules *forever* from that position, *and* you care about your own life plan, not others'."
          *   **"No Values?":** "They know they *have* a conception of the good (values/life plan). They just don't know *which one* it is. So they need goods *any* plan could use (Primary Goods)."

  3.  **Maximin as a CONTINGENT DECISION RULE (20 min)**
      *   *Depends on:* Veil understood as deep uncertainty filter + Mutual disinterest.
      *   *Activity:* "Given 1) You care intensely about your own life path (disinterest), 2) You could be *anyone*, 3) You get ONE life, no do-overs, 4) No reliable odds... what's rational? Would you choose rules risking permanent destitution/slavery for *you* if it meant *maybe* a bigger pie overall? Why/why not?"
      *   *Key Framing (Your Instinct is RIGHT):*
          *   Rawls **doesn't** say maximin is always rational. He says it's rational *under these uniquely high-stakes, irreversible, no-probability conditions*.
          *   **"Strains of Commitment" is CRUCIAL:** "The rules must be ones you could *actually live under and uphold*, no matter who you turn out to be. Could you sincerely accept being a permanent underclass? If not, maximin (or something close) emerges."
      *   *Preempting "Maximin is Insane":* "Is it insane to refuse Russian Roulette (1 bullet) for $10M? Stakes matter. Rawls thinks your basic rights/life prospects are higher stakes than money."

  4.  **The Difference Principle DEMYSTIFIED (30 min)**
      *   *Depends on:* Mutual disinterest + Veil (as filter) + Maximin Conditions understood. **Order matters!**
      *   **The CARRYING EXAMPLE (Use THIS):** "Designing the Rules for a Permanent Cooperative Guild (Not splitting a cake!)"
          *   *Scenario:* "You're founding members designing the *constitution* for a guild that will exist for generations. Members have diverse, unchosen talents (some rare/valuable, some common). The guild produces *everything* needed for good lives (tools, knowledge, art, security)."
          *   *Rules Choice:* "Option A: Strict Equality (all resources/titles distributed equally). Option B: Talent-Boosting (Guild can offer extra training/resources/markers of status to those with rare talents IF this demonstrably leads to *more/better* tools/knowledge/etc. for *everyone*, especially the least talented/productive."
          *   *Why it Works:*
              *   **Not Fixed Pie:** Guild output *depends* on rules incentivizing use of talents.
              *   **Focus on Basic Structure:** It's about the *rules of the guild*, not individual transactions ("Should Bob get a raise?").
              *   **Difference Principle Logic:** "Would the least advantaged members (least talented?) *rationally choose* Option B *behind the veil*? Only if Option B leaves them objectively better off (better tools/knowledge/security) than Option A *could*, and only if the inequalities are *necessary* to achieve that gain for them." Highlight "maximized position of least advantaged."
              *   **Avoids Money/Politics:** Talks in "resources," "tools," "status markers," "guild output."
      *   *Preempting Misconceptions:*
          *   **"Better Off Than Equality":** Hammer: "It's not just 'better than equality'. It's 'THE MOST THEY COULD POSSIBLY BE' under *any* system. If strict equality yielded Guild Output 10 (all get 10), but Talent-Boosting yields Least Advantaged 15 (others get 50), DP is satisfied *only if* there's *no possible rule set* where the Least get >15. If a rule could get them 16 without inequality, DP *requires* that rule."
          *   **"CEO Raise":** "DP is a filter for the *basic rules of society* (like our guild constitution), *not* for judging individual paychecks. It asks 'does this *type* of inequality, governed by these *background institutions*, work to the greatest benefit of the least advantaged?'"

  5.  **Synthesis & Litmus Test (15 min)**
      *   *Activity:* Q&A focused on **application of the framework**.
      *   **THE LITMUS TEST QUESTION:** "Could a society with significant inequalities *possibly* satisfy Rawls' principles? If so, *what specific conditions* must its *basic structure* (constitutions, property laws, opportunity systems) meet? Not 'is this CEO pay fair', but 'what rules govern how CEO pay *comes about* and its *effects'*?"
          *   *Why it works:* Correct answers require holding Mutual Disinterest (it's not compassion), Veil as Filter (not knowing position), *and* the Difference Principle correctly (inequalities must be necessary to maximize the floor via basic rules). Someone stuck on "empathy" or "fixed pie" will answer very differently.

  ---

  ### **WHAT TO OPENLY REFUSE (ANNOUNCE UPFRONT)**
  1.  **"We won't debate Sen/Nussbaum critiques of Primary Goods today."** Frame: "Rawls' project is about justice *given* normal functioning. Critiques about disability/chronic illness are vital, but a different layer. Today's focus is understanding his core argument."
  2.  **"We won't resolve the Rawls vs. Harsanyi (Average Utility) debate fully."** Frame: "We've covered the key disagreement (probability vs. maximin under deep uncertainty). Fully dissecting the philosophical arguments requires a seminar, not 90 minutes. We're focusing on Rawls' positive construction."
  3.  **"We won't apply this to current US tax rates/welfare policy."** Frame: "Rawls is about fundamental institutional design, not specific policy levers in an existing flawed system. Using the guild example keeps us focused on the *principles*."
  4.  **"We won't dive into 'comprehensive doctrines' vs 'political liberalism'."** Frame: "That's his later work. Today is about the core argument of *A Theory of Justice*: the Original Position justifying the Two Principles."

  ---

  ### **MISCONCEPTION MAP (Key Targets & When Diffused)**
  *   **"Veil = Empathy/Compassion"** → **DIFFUSED AT STEP 1 (Mutual Disinterest)** & reinforced at Step 2.
  *   **"Veil = Max EU w/ Uniform Prior (Harsanyi)"** → **DIFFUSED AT STEP 2 (Veil as Filter)** – Emphasize *no probability basis* + *irreversible stakes*.
  *   **"Maximin is Always Irrational"** → **DIFFUSED AT STEP 3 (Maximin Conditions)** – Stress *unique conditions* (high stakes, no exit, no probabilities, strains of commitment).
  *   **"Difference Principle = 'Poor Better Off Than Under Equality'"** → **DIFFUSED AT STEP 4 (Difference Principle)** – Use Guild Example: "Not just 'better', but *'the most possible'* & tied to basic rules. Contrast Option B vs. a hypothetical Option C where Least get 16 without inequality."
  *   **"Primary Goods = Utilitarian Welfare"** → **DIFFUSED AT STEP 2 (Veil as Filter)** – "They are *all-purpose means* for *any* life plan, not a measure of happiness."
  *   **"No Conception of the Good"** → **DIFFUSED AT STEP 2 (Veil as Filter)** – "They *have* one, they just don't know *which one*. Hence needing Primary Goods."
  *   **"Applies to Individual Transactions (CEO raise)"** → **PREEMPTED STARTING AT STEP 4 (Guild Example)** & hammered in Litmus Test. Constantly reframe to "basic structure of institutions".

  ---

  **Execution Tip:** Use the wobbly flipchart relentlessly to map the dependency chain *live*:  
  `Mutual Disinterest -> Veil (Info Filter!) -> Maximin (Conditions!) -> Difference Principle (Rules, Not Redistribution!)`.  
  Point back to it when misconceptions arise. Your goal isn't to convince them Rawls is *right*, but that his argument is *different* (and more rigorous) than the LW/SSC strawman. Good luck!
