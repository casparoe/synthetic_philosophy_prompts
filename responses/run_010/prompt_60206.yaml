  ### III. Cruxes  
  Three sub-questions are designed to force movement. For each, a concrete case is given, both sides’ advance predictions are stated, and outcomes can be checked post-discussion.  

  #### Crux 1: Vague Indeterminacy Operator  
  **Question:** Is the indeterminacy operator (e.g., "it is indeterminate whether P") itself vague? Can S concede this without granting a sharp boundary higher in the hierarchy?  
  - **Concrete Case:** A sorites series for "bald" where \(P_n =\) "Person \(n\) is bald". Let \(\nabla P\) mean "it is indeterminate whether \(P\)". Is \(\nabla P\) vague?  
  - **E’s Prediction:** "\(\nabla P\) has a sharp boundary: there is a first \(n\) where \(\nabla P_n\) is false. This boundary is unknowable, but \(\nabla\) is not vague."  
  - **S’s Prediction:** "\(\nabla P\) is vague: no sharp boundary separates where \(\nabla P_n\) holds. Higher-order vagueness avoids boundaries at all levels."  
  - **Testability:** If \(\nabla P\) exhibits penumbral shifts (e.g., intuitions about \(\nabla P_n\) vary continuously), S’s view holds; sharp discontinuities support E.  

  #### Crux 2: Knowledge of Borderline Status  
  **Question:** Can E know a case is unknowable? Can S know a case falls in a gap?  
  - **Concrete Case:** Patch \(k\) in a color sorites series, agreed by both as borderline for "red". Can a speaker know "Patch \(k\) is borderline for ‘red’"?  
  - **E’s Prediction:** "Yes: we know it is unknowable, but not because it lacks truth—only because we lack access."  
  - **S’s Prediction:** "Yes: we know it is indeterminate, as this is a semantic fact."  
  - **Testability:** If speakers can reliably identify borderlines without semantic theory, both views hold; if not, E/S must explain why.  
  - **Judgment:** Substantive (affects epistemology of vagueness). E’s "unknowable" implies a fact beyond reach; S’s "indeterminate" implies no fact exists.  

  #### Crux 3: Disagreement without Semantic Vocabulary  
  **Question:** Do E and S differ on sentences with no semantic/epistemic vocabulary?  
  - **Concrete Case:** The Pluto wager (below) tests "Pluto is a planet" (2005), a non-semantic sentence.  
    - **E’s Prediction:** "This sentence was true or false in 2005, unknowably so."  
    - **S’s Prediction:** "This sentence was indeterminate in 2005."  
  - **Testability:** If post-2006 evidence (e.g., polls of 2005 usage) shows "Pluto is a planet" had no consensus, S is affirmed; if pre-2006 data suggests a fact, E is affirmed.  
  - **Judgment:** Substantive (truth-value assignment to ordinary sentences).  

  ---

  ### Explicit Analysis of Concrete Cases  
  #### Case 1: Pluto Wager (2003)  
  - **Background:** A 2003 bet on "Pluto is a planet" as of 2005, predating the IAU’s 2006 definition.  
  - **E’s Position:**  
    - The sentence had a truth value in 2005 (unknown, but either true or false).  
    - The 2006 IAU definition changed future meaning but not the 2005 truth value.  
    - **Owed to Bettors:** The bet is decidable in principle (if inaccessible); parties should seek 2005 evidence (e.g., scientific consensus then).  
  - **S’s Position:**  
    - The sentence was indeterminate in 2005 due to vagueness.  
    - The 2006 IAU definition created a new precisification but did not alter 2005’s indeterminacy.  
    - **Owed to Bettors:** The bet is void (no 2005 truth value). Later stipulation is irrelevant to 2005.  
  - **Key Disagreement:** E sees a fact in 2005; S sees none. IAU stipulation is retrospective for neither.  

  #### Case 2: Supply Contract Clause  
  - **Background:** Clause: "Notify buyer of any material delay." No thresholds/glosses provided.  
  - **Theories’ Advice for Redrafting:**  
    - **E:** "Replace ‘material’ with quantitative thresholds (e.g., ‘>5 days’). Rationale: Sharp boundaries exist but are unknown; thresholds mitigate ignorance-driven disputes."  
    - **S:** "Replace ‘material’ with quantitative thresholds. Rationale: Vagueness causes truth-value gaps; thresholds eliminate indeterminacy."  
  - **Agreement:** Both recommend identical redrafting (specify thresholds).  
  - **Conclusion:** No practical difference. Philosophical divergence does not affect legal advice. Group must not frame this as a victory for either theory.  

