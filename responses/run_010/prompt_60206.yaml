  ### II. Table of Residual Disagreements  
  For each disagreement, E’s and S’s self-endorsed formulations are provided, alongside a judgment of whether the dispute is substantive or semantic bookkeeping, with reasoning.  

  | Disagreement Topic          | E’s Self-Endorsed Formulation                                                                 | S’s Self-Endorsed Formulation                                                                                               | Substantive or Semantic Bookkeeping? | Reasoning for Judgment                                                                                          |  
  |-----------------------------|----------------------------------------------------------------------------------------------|-----------------------------------------------------------------------------------------------------------------------------|---------------------------------------|------------------------------------------------------------------------------------------------------------------|  
  | **Nature of borderline cases** | "A borderline case has a sharp truth-value boundary, but it is in principle unknowable."       | "A borderline case has no truth-value boundary; it is indeterminate (neither true nor false)."                             | Substantive                          | Disagreement concerns ontology: E posits unknowable facts; S denies facts exist. This affects metaphysics of language. |  
  | **Bivalence**                 | "Every sentence is true or false, even in borderline cases."                                  | "Bivalence fails for borderline cases: they are neither true nor false."                                                    | Substantive                          | E retains classical bivalence; S revises it. This implies divergent logics for truth-conditional semantics.      |  
  | **Role of precisifications**  | "Precisifications are epistemic tools reflecting ignorance of the sharp boundary."             | "Precisifications are semantic determinants of truth, and indeterminacy arises from their variability."                    | Semantic bookkeeping                 | Both use "precisifications" functionally (epistemic vs. semantic), but core commitments (II.1, II.2) are unchanged. |  
  | **Grounds for assertoric norms** | "Assertion is barred in borderline cases due to risk of error from ignorance."              | "Assertion is barred in borderline cases due to lack of truth conditions."                                                | Semantic bookkeeping                 | Normative guidance is identical (Claim 3); difference is in justification, not practical outcome.                |  

