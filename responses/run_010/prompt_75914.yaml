prompt: |-
  I'm a fourth-year philosophy of mind PhD student and I co-host our department's small podcast. Next week's guest is a philosopher who has spent the last few years arguing that the sphexishness business has been badly misused in debates about agency. The background she always starts from is the digger wasp — genus *Sphex* — that paralyzes a cricket, drags it to the mouth of its burrow, goes inside to check that the coast is clear, comes back out, and drags it in; if you nudge the cricket a few inches while she's underground, she drags it back to the threshold and runs the entire routine again, and she'll do this indefinitely. Her positive view, which she calls the recovery-band account, goes roughly like this: sphexishness isn't binary and isn't a missing ingredient, it's a measure of the range of perturbations an agent can absorb and still get back to its goal; the wasp's band is just very narrow and ours is very wide; and a wide band requires nothing beyond more and better-tuned subroutines, so there's no leftover gap for anything non-mechanical to fill. She's an out-and-out compatibilist about it. She also likes to bring up large language models as a test case, on the grounds that they have a suspiciously wide band inside language and essentially no band outside it. Her signature move when you press on whether any of this is about *freedom* is to say the wasp isn't unfree, it's just narrow — competence, not liberty.

  Draft me eight to ten interview questions. Think of yourself as a professional philosopher of mind and AI who has actually worked through the frame-problem literature (Dennett, Fodor and Pylyshyn) and the compatibilist literature on control and reasons-responsiveness (Frankfurt's hierarchical stuff, Fischer and Ravizza), and who has interviewed academics before and knows how they wriggle. Before you write anything, work out privately where this view is strongest and where it's soft — sketch three or four candidate attacks, throw out the ones she'd survive easily — but don't show me that work.

  Hard requirements:

  - Every question gets a follow-up keyed to the answer she's most likely to give. Write it in the form "if she says X, then ask…" so I can actually use it live.
  - Under each follow-up, one line telling me what a real answer sounds like versus a dodge. One line, no more.
  - At least one question on the objection that we have narrow bands too — inattentional blindness, change blindness, the invisible-gorilla result, optical illusions, addiction, and adversarial examples as the machine mirror-image of all of it. Either the bandwith measure indicts humans or it gets gerrymandered until it stops being a measure. Make her pick.
  - At least one on whether recovery-band is anything more than reasons-responsiveness with an engineering vocabulary bolted onto it, and if so, what the gloss buys her.
  - At least one on domain-relativity: if band width is indexed to a space of perturbations, then "is this system sphexish?" has no global answer, and she loses the thing she wanted the concept for. Force her either to give me one number for a person or to explain what survives of the free-will upshot once the number goes per-domain.
  - One on the nesting problem: the wasp *does* have a checking routine, and it's the re-triggering of that routine that produces the loop — so what distinguishes my self-monitoring from hers, and where does the stack of subroutines stop?
  - The final three should escalate against the "narrow, not unfree" deflection, each one making it harder to deploy than the last, and the last should be about what evidence would convince her that band width is the wrong measure of anything we care about.
  - No softballs, nothing biographical, no "what first drew you to this?"
  - Every question has to be sayable out loud in under thirty seconds. Assume the audience knows the wasp story and knows what compatibilism is and nothing else — so if you're leaning on an objection, name it in a single clause inside the question rather than expecting me to explain it.

  Open your reply with one sentence: your bottom line on where she's most exposed and what the through-line of the set should be. Then the numbered questions and follow-ups. No preamble, dont restate what I just told you, and no closing advice after the last follow-up.
reasoning: |-
  Okay, the user is a fourth-year philosophy of mind PhD student prepping for a podcast interview. The guest is a philosopher with a "recovery-band" theory of agency, challenging traditional sphexishness interpretations. The user wants sharp, adversarial questions targeting weaknesses in her view, with tactical follow-ups. 

  First, I need to privately map the vulnerabilities. Her core claim is that recovery-band width (resilience to perturbations) measures agency without needing non-mechanical elements. Key pressure points:
  - **Domain-relativity**: Band width varies across contexts (e.g., humans blind to gorillas). If "sphexishness" isn't global, it loses bite for free will debates.
  - **Nesting paradox**: The wasp *has* self-monitoring (the burrow-check routine). How is human meta-cognition different if both are "subroutines"? 
  - **Reinvention risk**: Recovery-band resembles existing compatibilist concepts like reasons-responsiveness. What does the engineering framing add?
  - **Human narrowness**: Humans fail under specific perturbations (illusions, addiction). Either this indicts human agency or forces gerrymandered definitions.
  - **Final deflection trap**: Her "narrow, not unfree" move must be cornered. Escalate to whether band width captures *value* or just efficiency.

  I’ll discard weaker attacks. For example, claiming wasps lack goals is futile—she’d counter that goals are defined by the system’s functional profile. Or accusing her of behaviorism ignores her allowance for internal complexity. 

  Now structuring the questions: 
  1. Start with domain-relativity to destabilize the global measure premise. 
  2. Hit nesting to challenge the subroutine hierarchy. 
  3. Force her to confront human narrowness cases. 
  4. Press the innovation question. 
  5. Escalate three times against "narrow≠unfree," ending with falsifiability. 

  Follow-ups must anticipate her likeliest dodges and force substantive engagement. For example, if she dismisses inattentional blindness as "irrelevant perturbations," demand criteria for relevant vs. irrelevant. Real answers acknowledge trade-offs; dodges handwave exceptions. 

  For the LLM test case: She’ll likely say LLMs have wide linguistic bands but no cross-domain robustness. Push her to define why domain-specific width *doesn’t* count as agency—this exposes if band width is merely performance, not freedom. 

  Final escalation: If band width measures competence, what experiment would show competence isn’t what matters for responsibility? She must either admit no evidence could sway her (dogmatic) or concede normative dimensions beyond mechanics. 

  User’s hidden need: They want to expose soft underbellies without sounding hostile. The follow-up scripts ("if she says X...") arm them to pivot deftly during live tension. 

  Bottom line: Her Achilles’ heel is domain-relativity collapsing the measure’s philosophical utility. Through-line: Corner her on whether recovery-band explains freedom or just adaptive behavior.
answer: |-
  Your view is most exposed on domain-relativity collapsing the global measure of agency and on nesting subroutines failing to distinguish mechanistic from "truly" agential self-monitoring; the through-line is forcing concessions that bandwidth is purely descriptive competence, stripping it of free-will implications.

  1.  **Question:** You define sphexishness as narrow recovery-band width. But humans exhibit startlingly narrow bands too—inattentional blindness, optical illusions, adversarial examples tricking perception. Doesn't this either indict human agency as sphexish in key domains or force you to gerrymander "relevant perturbations" until bandwidth stops being a general measure?
      *   **Likely Answer:** She distinguishes "ecologically valid" perturbations from "pathological" lab traps, arguing bandwidth applies to an agent's *intended* operational environment.
      *   **Follow-Up:** If she invokes ecological validity or intended environment, ask: "Doesn't that make bandwidth deeply teleological and context-dependent *before* measurement? How do we objectively define the 'intended perturbation space' for the wasp vs. the human inattentional-blindness subject without presupposing the agency level we're trying to measure? What's the non-circular criterion?"
      *   **Real vs. Dodge:** Real: Admits the need for a normative/functionalist framework *defining* the relevant space, conceding bandwidth alone isn't sufficient. Dodge: Insists the perturbations are "obviously" different without providing the criterion.

  2.  **Question:** Recovery-band sounds strikingly similar to Fischer and Ravizza's reasons-responsiveness—an agent's capacity to recognize and react *differently* to different reasons/perturbations. What does the bandwidth framing add beyond just rebranding that compatibilist standard with an engineering metaphor? What uniquely does it explain?
      *   **Likely Answer:** She argues bandwidth offers a quantifiable, mechanistic, scalable model of *how* reasons-responsiveness is implemented via subroutines and error-correction, moving beyond the abstract "guidance control" description.
      *   **Follow-Up:** If she emphasizes implementation/scalability, ask: "But Fischer and Ravizza also ground responsiveness in actual or counterfactual mechanisms. If your 'subroutines' are just those mechanisms described computationally, and 'bandwidth' is the range of counterfactual variations where they succeed, isn't this just reasons-responsiveness operationalized? Where's the substantive *philosophical* advance for agency debates?"
      *   **Real vs. Dodge:** Real: Identifies specific limitations of RR (e.g., vagueness on scope, lack of gradation) that bandwidth concretely addresses. Dodge: Merely reiterates the engineering flavor as the innovation.

  3.  **Question:** Bandwidth is relative to a specific perturbation space—linguistic, spatial, perceptual. Yet you want "sphexishness" to tell us something about agency *simpliciter*. If LLMs have a wide band in linguistic space but near-zero band elsewhere, and humans have variable bands across domains, what single answer survives to "Is this system sphexish/agentic?" Doesn't this domain-relativity gut the concept's power for the free will debate?
      *   **Likely Answer:** She argues agency *is* domain-relative; a system can be highly agentic in one domain (chess AI) and sphexish in another. What matters is achieving complex goals robustly *within* a domain.
      *   **Follow-Up:** If she embraces domain-relativity, ask: "Then the wasp *is* highly agentic within its cricket-retrieval domain—it robustly achieves its goal. It only looks 'sphexish' when we impose *alien* perturbations (nudging the cricket). Doesn't this completely vindicate the wasp and undermine the traditional intuition that sphexishness reveals a *lack*? What then *is* the residual worry about agency your account addresses?"
      *   **Real vs. Dodge:** Real: Concedes the wasp is locally competent, pivoting the worry to *scope* (human generality) as the key to richer agency/freedom. Dodge: Tries to sneak a norm about "appropriate" domain breadth back in covertly.

  4.  **Question:** The wasp *has* a self-monitoring subroutine—the burrow check. Its loop arises precisely because this check successfully re-triggers the retrieval sequence upon perturbation. How is this self-monitoring fundamentally different in kind, not just complexity, from my own meta-cognition? Where does the stack of subroutines monitoring subroutines bottom out to avoid infinite regress and deliver 'true' agency?
      *   **Likely Answer:** She denies a fundamental difference; it's all subroutines all the way down. The difference is the *richness* of the monitoring—humans have more layers, cross-modality checks, and abstract representations enabling wider bands.
      *   **Follow-Up:** If she emphasizes richness/complexity, ask: "If it's just more and better-tuned subroutines, as you claim, what prevents an arbitrarily complex subroutine stack in an LLM or robot from constituting identical 'rich self-monitoring'? Doesn't this collapse the distinction into mere performance metrics, leaving no conceptual room for the *freedom* or *subjectivity* often associated with human agency?"
      *   **Real vs. Dodge:** Real: Explicitly embraces the collapse, arguing "freedom" *is* just high-bandwidth performance. Dodge: Invokes undefined terms like "understanding" or "real semantics" smuggled in.

  5.  **Escalation 1:** You say the wasp isn't unfree, just narrow. But Frankfurt cases show an agent can be *extremely* reasons-responsive within a narrow band (the willing addict acts just as they want when they want) yet seem deeply *unfree* due to their desires' source. Doesn't bandwidth completely miss this hierarchical, source-based dimension of freedom?
      *   **Likely Answer:** She dismisses source concerns as irrelevant to *control*; bandwidth measures the control capacity itself, regardless of the history of the mechanisms implementing it.
      *   **Follow-Up:** If she dismisses source concerns, ask: "So, if we perfectly implanted the wasp's exact neural circuitry into a human, creating a human who robustly but mindlessly repeats cricket-dragging loops when triggered, you'd say this person possesses high-bandwidth agency and is therefore *free* in those actions, despite lacking any higher-order identification with the compulsion? That seems to abandon core compatibilist intuitions."
      *   **Real vs. Dodge:** Real: Doubles down, arguing such a person *would* be locally free/agentic in those actions, separating control from identity/worth. Dodge: Claims implants would inevitably alter context/bandwidth illegitimately.

  6.  **Escalation 2:** Granting competence over freedom, why should we care about recovery-band *width* specifically? Evolution often selects for *narrow*, efficient bands tuned to specific niches. Isn't width just one performance metric, not a privileged measure of agency? A highly specialized agent might score low on width but high on efficiency or success rate within its niche.
      *   **Likely Answer:** She argues width is crucial for handling the *unexpected*, which is central to flexible agency in complex, dynamic environments like ours.
      *   **Follow-Up:** If she emphasizes handling the unexpected, ask: "But isn't 'unexpectedness' relative to the agent's model? The wasp *does* handle the 'unexpected' cricket-move with its re-check subroutine—it just has a terrible model of possible perturbations. Isn't width then just a proxy for the *accuracy and scope* of the agent's internal world model? Doesn't *that* become the real locus of agency?"
      *   **Real vs. Dodge:** Real: Agrees width depends on model quality, making model-building the core capacity. Dodge: Tries to keep width as the primitive measure.

  7.  **Escalation 3 (Falsifiability):** If bandwidth is the right measure for what we care about in agency, what empirical result *couldn't* be explained by it? Specifically, what evidence would convince you that a system with high recovery-bandwidth in a domain still fundamentally lacks whatever core element—call it freedom, genuine understanding, or intrinsic motivation—you think separates mere competence from true agency?
      *   **Likely Answer:** She likely struggles, perhaps suggesting systematic failure under *novel* perturbations, but she'd argue that's just revealing a previously hidden bandwidth limit.
      *   **Follow-Up:** If she points to failure under novel perturbations, ask: "Isn't that just defining bandwidth post-hoc? What if a system exhibits *perfect* bandwidth across all tested perturbations—like a super-intelligent, perfectly robust LLM in its domain—but still strikes us as 'soulless' or lacking 'real' intentionality? Would you accept that intuition as evidence against bandwidth sufficiency, or dismiss it as a quirk?"
      *   **Real vs. Dodge:** Real: Admits bandwidth might not capture phenomenal or intrinsic aspects, separating competence from consciousness/meaning. Dodge: Dismisses the "soulless" intuition as unscientific or irrelevant to control.
