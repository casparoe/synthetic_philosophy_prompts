  ## Sestina: Against the Single View (Jar at Dusk)

  The **jar** sits crooked on the shelf, a **crack**
  like lightning frozen in its **clay**. Is this
  **broken**? The dusk light makes its surface **bright**,
  yet shadows pool within. The **dust** motes drift
  through air as still and **cold** as ancient stone.
  This shape holds water still? Or holds the void?

  A **void** seems promised by that jagged **crack**.
  But look: the glaze, where smooth, reflects the **bright**
  last sun. Is substance gone? Or just the **dust**
  of use? This artifact, is it now **broken**
  beyond repair? Or merely **cold**,
  awaiting warmth, a purpose? Judge not **this**.

  To name it **this** demands we fix the view:
  Is vessel? Or is relic? Void?
  The clay remembers heat, now feels so **cold**.
  Its history whispers in the **crack**,
  a tale of impact, leaving it **bright**
  with fracture lines. Time settles like fine **dust**.

  A wind stirs suddenly, disturbing **dust**.
  It shifts the light, transforms the view of **this**.
  The sunbeam catches facets, fiercely **bright**,
  reveals the **crack** not as a path to **void**,
  but as a vein of gold in **clay** made **broken**.
  The sudden movement chills the air more **cold**.

  But wait – touch now! The sun-warmed **clay**’s not **cold**.
  Don’t focus just on where the **dust** collects!
  See here, the rim is whole, not truly **broken**.
  The **crack** runs deep, but doesn’t split the **this**
  entirely. Does it leak? A test finds **void**
  is held at bay. The fired surface **bright**

  still gleams where clean. But turn it, lose the **bright**:
  now shadowed side feels rough and strangely **cold**.
  From this angle, it seems nothing but **void**
  and damage. Settling motes of finest **dust**
  obscure the form. Is *this* the truth? Or **this**?
  Perspective shifts: both whole and **broken**.

  Call it **broken**? Yes, by morning light,
  when function’s lost, the **crack** a glaring **void**.
  Call it intact? At noon, its **bright**
  design shines forth, the **clay** still strong, not **cold**
  utility. The gathered **dust** ignored.
  Each standpoint valid *for itself*, not **this**…

  …fixed essence. Words like **bright**, **cold**, **broken**, **void**,
  **crack**, **dust** – each pins one view upon the **clay**.
  But truth? No word. It holds all, holds none. **This**.

  **(Envoi)**

  The **jar** holds **void**, holds water, holds the **dust** of ages.
  **This** doctrine speaks its limit: *all its phrases*
  are **broken** too – yet truth escapes no **crack**.

  ---

  **Committed Reading & Defense Notes:**

  1.  **Self-Application Resolution:** The poem **affirms that the doctrine coherently applies to itself**, resolving the paradox. *Why?:*
      *   *Final Stanza (6):* Explicitly states "Call it **broken**? Yes... Call it intact? Yes... Each standpoint valid *for itself*..." This applies the perspectival method directly to the *assessment of the doctrine itself* (is it broken/invalid or intact/valid?).
      *   *Envoi:* "**This** doctrine speaks its limit: *all its phrases* / are **broken** too" directly acknowledges that the doctrine's *own propositions* are conditional and non-absolute ("broken" in the sense of non-final, non-exhaustive). Crucially, it adds "– yet truth escapes no **crack**." This asserts that this very limitation ("broken phrases") is *not* a fatal flaw ("crack" through which truth escapes) but is *necessary* and *accurate* – truth itself is multifaceted and escapes any single proposition. The doctrine *correctly* describes its own conditional nature, demonstrating coherence through self-inclusion. It avoids being an absolute claim *by explicitly denying the possibility or sufficiency of any single absolute claim*, including its own exhaustive description.

  2.  **Liberties Taken:**
      *   **Compression of Standpoints:** Syād-vāda's seven modal predicates (*syād asti*, *syād nāsti*, *syād asti nāsti*, etc.) are compressed into the poem's core mechanism of affirmation/denial based on shifting parameters (time, angle, purpose, light). The nuanced combinations are implied rather than explicitly enumerated per Jain logic.
      *   **Nature of the "Seventh Mode" (Indescribable):** The envoi presents the indescribable ("truth escapes no **crack**") more as a mystical unity ("holds all, holds none") than Jainism's rigorous *avaktavya* (inexpressible) arising logically from the simultaneous inapplicability of "is" and "is not" under specific conditions. The poem leans slightly towards a unifying transcendence.
      *   **Concreteness vs. Abstraction:** While centered on a single jar, the poem inevitably uses the jar as a *metaphor* for truth/doctrine, especially towards the end. The final lines in the envoi move explicitly into doctrinal territory. It maintains the concrete anchor but allows it to clearly signify the abstract philosophical problem.
      *   **"In Some Way" (Syād):** The poem *shows* shifting predications (affirming/denying "broken," "bright," etc. based on context) but doesn't constantly prefix assertions with "in some way" or "from a certain standpoint." The structure *embodies* the "syād" principle, but the literal verbal formulation is often omitted for poetic flow.

  **Defense Strategy:** Argue that the sestina form *itself* rigorously enacts the core principle of non-absolutism through permutation, making the point structurally undeniable. The self-application is explicit in the final stanza and envoi: the doctrine *correctly* identifies its own propositions as conditional ("broken phrases"), and this self-awareness isn't suicide but fidelity to the multifaceted nature of reality ("truth escapes no crack"). The liberties (compression, slight mysticism) are necessary concessions to the poetic form while preserving the essential philosophical thrust: self-application is the proof of coherence, not its refutation. It avoids the "sophisticated excuse" by making a *positive claim* about the nature of truth and the doctrine's accurate self-description.
