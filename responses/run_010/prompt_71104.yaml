  Okay, let me start by unpacking the user's query. They teach research methods to grad students in social sciences and have noticed a recurring pattern when students use language models like ChatGPT. The students get outputs that look finished but contain hidden errors. When prompted to check, they spot the mistakes quickly, but they don't think to check spontaneously. The key point is that the students have the skill to evaluate but lack the automatic trigger to do so without external prompting. 

  First, I need to figure out the core issue here. The user mentions it's not deskilling because the skill is intact when explicitly asked. It's also not automation complacency because the students aren't overly trusting—they're appropriately skeptical when questioned. So the problem lies in the initiation of the evaluation process. 

  I recall concepts from cognitive psychology and human-computer interaction. Vigilance decrement comes to mind, but that's about sustained attention over time, which doesn't fit since the issue is the missing initial prompt. Maybe attentional inertia? That's when focus stays on a task too long, but here the student isn't even starting the evaluation. 

  Epistemic vigilance involves checking sources, but the user says students are skeptical when asked. The problem is the lack of spontaneous checking. Then there's automation bias, where people favor automated suggestions, but the students don't necessarily trust the output—they just don't think to verify unless prompted. 

  The term "evaluative initiation" pops into my head. It captures the failure to start evaluation spontaneously. But I need to check if this exists in literature. Since the user hasn't found a term, maybe coining one is necessary. "Prompt-dependent evaluation" could work, highlighting reliance on external prompts. Or "evaluative passivity," emphasizing the inactive state despite having the skill. 

  I should also consider near neighbors. Automation complacency involves over-trust, which isn't the case here. The students are skeptical when asked. Monitoring complacency is closer, but usually tied to vigilance decrement. The user’s scenario is about the missing trigger, not vigilance over time. 

  Defining clear boundaries is crucial. A clear instance is when a student who normally self-initiates checks fails to do so only with AI outputs. Deadline pressure or inherent lack of skill would be lookalikes. To distinguish, you'd observe the student’s behavior without AI versus with AI, and see if the spontaneous check disappears only with AI use. 

  The user cares about the edges, so specifying what counts and what doesn't is key. For example, if a student never had the habit, that's different from losing it temporarily with AI. Evidence would involve tracking when checks occur: unprompted in unaided work versus only when prompted with AI. 

  Also, considering why this happens. Maybe the polished output from AI reduces the user's perception of need to check. Or the shift from active creation to passive reception alters their cognitive engagement. The user’s role is to teach research methods, so they might need strategies to foster evaluative habits with AI. 

  I should ensure the proposed terms are precise. "Prompt-dependent evaluation" links to the reliance on prompts, while "evaluative passivity" describes the state. Both terms need to highlight that the skill is present but not self-initiated. 

  Finally, offering diagnostic criteria helps the user apply this. Observing behavior across contexts, timing checks, and prompting can clarify whether it's the AI interaction causing the issue or other factors. Practical strategies like training metacognitive prompts or integrating checkpoints could be useful for their teaching.
answer: |-
  This phenomenon you're describing is both fascinating and critically important. It doesn't have a single, universally accepted term yet, as it sits at the intersection of cognitive science, human-AI interaction, and epistemic psychology. However, we can dissect it and find near neighbors:

  **Core Phenomenon:** **Prompt-Dependent Evaluation (or Evaluative Passivity)**  
  This captures the core issue: the *evaluation skill* is intact, but the *spontaneous initiation of evaluation* is suppressed when accepting AI output, requiring an external prompt to activate it.

  ## Why Existing Concepts Don't Quite Fit (Near Neighbors)

  1.  **Automation Complacency:** *Near, but distinct.* Complacency involves reduced *vigilance* due to *trust* in automation. Your students display appropriate skepticism *when asked*, and the core failure is the **initiation of checking**, not vigilance *during* checking or inflated trust. They don't *assume* it's correct; they just don't *start* checking without prompting.
  2.  **Monitoring Complacency:** A subtype of automation complacency focused on failing to monitor system performance. Suffers the same disconnect: it implies a *continuous* vigilance decrement, not the specific failure of the *initial evaluative impulse* upon receiving output.
  3.  **Automation Bias:** The tendency to favor automated suggestions over contradictory information or one's own judgment. Not fitting, as the issue isn't *weighting* the AI's answer too heavily *after* evaluation starts; it's the failure to *begin* evaluation.
  4.  **Vigilance Decrement:** Reduced detection of rare signals over sustained monitoring periods. This is about sustained attention, not the specific failure of the initial "trigger" for evaluation upon task completion/receipt of output.
  5.  **Epistemic Dependence/Deference:** These are broader concepts about relying on others (or AI) for knowledge. They encompass the *act* of using AI but don't specify the *mechanism* of the evaluation failure – the intact skill yet missing spontaneous initiation.
  6.  **Deskilling:** Explicitly ruled out, as the skill remains demonstrably intact and accessible when explicitly prompted.

  ## Proposed Term & Its Core Mechanism

  *   **Term: Prompt-Dependent Evaluation (PDE) or AI-Induced Evaluative Passivity (AIEP)**
  *   **Core Mechanism:** AI output, by appearing polished and "finished," disrupts the **metacognitive trigger** that normally prompts spontaneous evaluation during unaided work. In unaided work:
      *   **Effort Investment:** The cognitive effort invested in *creating* the artifact creates inherent tension or "ownership" that naturally surfaces doubts ("Did I get that category right?", "Does this paragraph accurately reflect what I did?").
      *   **Friction Points:** The process itself involves micro-decisions and potential points of error encountered *during* creation, priming the mind for subsequent checks.
      *   **Predictive Uncertainty:** The creator has an implicit awareness of where errors are likely to occur based on the difficulty and their own confidence during creation.
  *   **AI Disruption:** When using AI:
      *   **Effort Displacement:** The user invests effort in *prompting and receiving*, not in the *construction* of the artifact itself. The internal tension/ownership associated with creation is absent.
      *   **Seamless Output:** The AI presents a seemingly complete, coherent output lacking the "friction points" that naturally flag potential errors during manual creation.
      *   **Prediction Gap:** The user hasn't mentally simulated the steps the AI took, so lacks the implicit predictive uncertainty about where errors might lie. The output appears *exogenous* rather than a product of their own effortful (and thus fallible) process.
      *   **Cognitive Offloading:** The act of delegating the task implicitly offloads not just the *doing*, but also the initial *responsibility for verification*. The default state becomes acceptance until an external factor (prompt, anomaly, time delay) disrupts it.

  ## Defining the Edges: Clear Cases, Look-Alikes, and Diagnostic Evidence

  | **Category**           | **Clear Instance of PDE/AIEP**                                                                 | **Look-Alike (Not PDE/AIEP)**                                                                 | **Diagnostic Evidence**                                                                                               |
  | :--------------------- | :--------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------------------------- |
  | **Core Characteristic** | Intact evaluation skill *only* fails to self-initiate *specifically* with AI-generated output. | Evaluation failure stems from other causes; no specific link to AI's output characteristics. |                                                                                                                       |
  | **Clear Instance**      | Student proficiently self-initiates checks in unaided work. With AI, outputs are accepted without spontaneous checks *despite similar time/task conditions*. Defects found rapidly *when prompted*. Student expresses surprise at missing the error ("I usually catch that!"). |                                                                                               | Comparison of unaided vs. AI-assisted work logs (tracking unprompted checks). Immediate defect discovery upon prompting. Student self-report of missing the "internal nudge." |
  | **Look-Alike: Deadline Pressure** | Evaluation skipped due to time constraints, regardless of tool. Occurs with manual work too. Student feels rushed, might *know* they should check but consciously decide not to. |                                                                                               | Occurrence pattern (happens equally under deadline without AI). Student reports conscious prioritization of speed over checking. |
  | **Look-Alike: Lack of Skill/Habit** | Student *never* reliably self-initiates checks, even in unaided work. Foundational metacognitive skill underdeveloped. |                                                                                               | Consistent failure to catch errors unaided. Difficulty explaining *how* they would check even when prompted. Lack of "surprise" at missing errors. |
  | **Look-Alike: True Automation Complacency** | Student expresses *high trust* in AI ("It's usually right"). Dismisses doubts or contradictory evidence. Evaluation *during* checking is impaired. |                                                                                               | Student statements indicating over-reliance. Failure to identify errors even *after* prompting/inspection. Downplaying found errors. |
  | **Look-Alike: Task Misunderstanding** | Student accepts output because they misunderstood the original task spec, so the output *seems* correct to them. Error persists even after prompting. |                                                                                               | Student cannot articulate the original task requirement correctly. Cannot identify the mismatch even when pointed out. |

  ## Evidence to Settle the Case in Practice

  1.  **Controlled Observation:** Give students *identical* tasks under similar conditions, once unaided and once using AI. Note frequency of *unprompted* checks and error detection *before* submission/finalization.
  2.  **Prompted vs. Unprompted Checks:** For AI-assisted tasks, systematically vary whether you ask "Have you checked this?" or not before accepting the output. Track error rates in the unprompted vs. prompted submission groups.
  3.  **Think-Aloud Protocols:** Have students verbalize their thoughts while reviewing AI output. Listen for the *absence* of any internal questioning versus the *presence* of questions during unaided review.
  4.  **Error Injection:** Introduce subtle, specific errors into AI outputs before giving them to students. Track detection rates with and without explicit prompting to check.
  5.  **Student Self-Report & Reflection:** Ask targeted questions: "Did you feel the need to double-check this part before I asked? Where did that feeling come from (or why not)?" Compare reflections on AI vs. manual tasks.

  **In summary:** You've identified a specific cognitive gap induced by generative AI: **Prompt-Dependent Evaluation (PDE)** or **AI-Induced Evaluative Passivity (AIEP)**. The core deficit is the suppression of the spontaneous metacognitive trigger to initiate evaluation, stemming from the displacement of effortful creation and the presentation of a seamless, exogenous artifact. This is distinct from deskilling, complacency, or bias, though it can interact with them. Focusing on the *initiation failure* specific to AI output reception, and contrasting it with unaided behavior, is key to diagnosis. This is a crucial area for pedagogy and research as AI tools become ubiquitous. Developing interventions to "re-trigger" that evaluative impulse in the context of AI use is the next frontier.
