  First, I need to precisely define the position. The core claim is that cross-threshold comparisons lack determinate answers - there's no fact about how many mild pleasures outweigh agony. This is different from mere unknowability or vagueness. For LNU to work, I must affirm indeterminacy while rejecting that pleasure and pain are fundamentally incomparable kinds. The key is epistemic indeterminacy about a metaphysical question.

  For the derivation, I'll start from "no determinate N" and build to lexical priority. The critical bridge is a decision rule under indeterminacy: when permissibility is indeterminate for an action causing above-threshold harm but not for alternatives, we must choose safer alternatives. This implies we should never trade agony for pleasure since we can't determine it's permissible. I'll need to add premises like the indeterminacy-to-impermissibility principle and the lexical priority rule.

  Now for the hard cases. The "agony plus bliss" vs "agony alone" intuition: my position says both worlds are determinately worse than pure bliss worlds, but comparing them might be indeterminate. This could be seen as a cost since common intuition suggests adding bliss improves things. For the symmetry objection: I'll argue that only the harm-causing action faces indeterminacy, creating asymmetry. Preventing harm remains determinately required regardless of pleasure gains.

  The strongest unanswerable objection is probably the intuition that large pleasure gains should clearly outweigh small suffering risks. I'd need to show why agony isn't just quantitatively different but qualitatively distinct in its moral importance.

  Throughout, I'll note where premises are contested. For example, aggregative comparability is widely assumed but challenged by non-aggregative views. The indeterminacy-to-impermissibility principle is particularly contentious.

  Finally, for the answer line, the most crucial premise is the decision rule linking indeterminacy to obligatory harm avoidance: when causing harm might be wrong and we can't determine it's permissible, we must avoid it.
answer: |-
  ### Defense of Lexical Threshold Negative Utilitarianism via Indeterminacy

  **1. Precise Statement and Distinctions**  
  The core thesis is: **Intensity comparisons between above-threshold suffering (≥T) and sub-threshold goods (pleasure or suffering <T) are metaphysically indeterminate.** Specifically:  
  - For any instance of suffering *s* ≥ T and any quantity *Q* of sub-threshold goods, there is **no fact of the matter** about whether *Q* outweighs *s*.  
  - This indeterminacy is **epistemic** (reflecting a lack of knowable truth-value) but rooted in **metaphysical** underdetermination (no objective answer exists).  

  **Neighbors and LNU's stance:**  
  - **Unknowability**: LNU *can accept* that we cannot *know* the answer, but **requires** that no answer *exists*. Unknowability alone doesn’t justify lexical priority.  
  - **Vagueness**: LNU *should reject* that T is a vague boundary. The threshold is sharp; indeterminacy arises from *comparison across categories*, not borderline cases of T.  
  - **Incomparability in kind**: LNU **must reject** this. Pleasure/pain are comparable *below* T; indeterminacy is specific to cross-threshold comparisons.  
  - **What LNU needs**: **Metaphysical indeterminacy** in aggregation, where "N sub-threshold goods outweigh one ≥T suffering" has no truth-value.  

  **2. Derivation from Indeterminacy to Lexical Priority**  
  Premises:  
  - **(I)** *Indeterminacy Thesis*: For suffering *s* ≥ T and any quantity *Q* of sub-threshold goods, it is indeterminate whether *Q* outweighs *s*. (Given)  
  - **(DP)** *Decision Principle under Indeterminacy*: If an action risks harm and it is indeterminate whether that harm is permissibly outweighed by benefits, we must treat the harm as *impermissible to cause*. (Added premise: **Harm-Avoidance Obligation**)  
  - **(LP)** *Lexical Priority Rule*: If causing *s* ≥ T is impermissible unless prevented by sub-threshold gains, but (by I) such gains never determinately outweigh *s*, then *s* ≥ T must be prioritized absolutely. (Added premise: **Aggregation Failure Axiom**)  

  **Derivation:**  
  1. By **(I)**, no *Q* determinately outweighs *s* ≥ T.  
  2. By **(DP)**, causing *s* ≥ T is impermissible if it cannot be determinately outweighed by *Q*.  
  3. By **(LP)**, when harm cannot be determinately counterbalanced, it is lexically prior.  
  ∴ Above-threshold suffering is lexically prior to sub-threshold goods.  

  **Added Premises:**  
  - **(DP)** is a deontic principle: *If permissibility is indeterminate for harm-inflicting actions and determinate for harm-avoiding alternatives, we must choose the latter.*  
  - **(LP)** is a structural rule: *When aggregation lacks determinate solutions, lexical ordering resolves the impasse.*  

  **3. Handling Damaging Cases**  

  **Case 1: Agony + Bliss vs. Agony Alone**  
  - **Verdict**: Both worlds are **determinately worse** than a world with no agony. Comparing them is **indeterminate**.  
  - **Reasoning**: Adding blissful lives involves cross-threshold comparisons (does bliss outweigh agony?). By **(I)**, this has no answer. LNU thus cannot declare "Agony + Bliss" better, worse, or equal to "Agony Alone."  
  - **Cost/Vindication**: This is a **cost**. Common intuition says adding bliss *improves* the world, but LNU cannot affirm this. However, it *is* consistent: if cross-threshold tradeoffs lack truth-values, we cannot assert improvement. LNU "vindicates" only the absolute badness of agony.  

  **Case 2: Symmetry Objection**  
  - **Objection**: If it’s indeterminate whether bliss outweighs agony, it’s equally indeterminate whether agony outweighs bliss. Why prioritize suffering?  
  - **Response**: **Asymmetry in harm imposition**. Causing agony has a **determinate wrong-making property** (it inflicts ≥T suffering). Preventing pleasure lacks a comparable wrong-making property. Thus:  
    - *Causing agony* is indeterminate in permissibility but risks **determinate grave harm**.  
    - *Preventing pleasure* (to avoid agony) risks no comparable harm.  
    By **(DP)**, we must prioritize avoiding the harm with determinate wrongness-risk. The lexicon favors suffering-avoidance because harm *infliction* has moral priority over benefit *denial* under indeterminacy.  

  **4. Strongest Unanswerable Objection**  
  **The "Small Risk" Objection**: Suppose we can cause one guaranteed agony to prevent a 1/1,000,000 chance of agony for each of a billion beings. Even if cross-threshold comparisons are indeterminate, probabilistic aggregation might permit trading determinate harm for reduced risk. LNU’s absolute priority seems implausible here.  
  - **Why Unanswered**: LNU struggles with probability. If the threshold applies to *expected* suffering, it collapses into standard utilitarianism; if not, it forbids trading certain agony for any reduction in diffuse risk.  
  - **What Would Answer It**: A theory integrating indeterminacy with probabilistic reasoning—e.g., "≥T suffering cannot be *knowingly* caused, but risks can be weighed under ignorance." This may require abandoning pure lexical priority.  

  ---

  **Premise Contestability**  
  - **Widely Granted**: Among aggregationists, **(I)** is coherent and non-trivial. Most grant that incommensurability *could* exist.  
  - **Contested but Defensible**: **(DP)** is accepted in deontic logic (e.g., "ought" implies "can determine permissibility") but rejected by consequentialists who accept expected value under indeterminacy.  
  - **Highly Contentious**: **(LP)** is disputed by:  
    - **Totalists** (indeterminacy should be modeled as a range of admissible N).  
    - **Non-Archimedeans** (who deny continuity but accept vague thresholds).  
    - **Standard Utilitarians** (who reject thresholds entirely).  

  The argument hinges on bridging **metaphysical indeterminacy** to **deontic constraints** via **(DP)**, a move critics call "overmoralizing uncertainty."  

  \answer{When permissibility of causing harm is indeterminate and harm-avoidance is determinate, we must avoid the harm.}
