answer: |-
  ## Committee of Coin & Conscience

  **Setting:** A sunlit committee room in the Palace of Veridia, circa 1750. Maps of the kingdom adorn the walls. Seated at a heavy oak table are LORD ALDEN (late 40s, thoughtful, gestures precisely) and SIR BERTRAND (early 60s, stern, fingers a worn silver coin). Before them lies the "Proposal for the Issuance of Crown Labour Notes."

  **Alden:** (Tapping the proposal) The core of it, Bertrand, is undeniable: our people *can* work, our land *can* yield, our workshops *can* hum. Yet we stagnate for want of a lubricant. Gold flees, silver hides. This decree," he gestures again, "creates that vital spark. Five million Labour Notes, fixed by statute, never to be increased. Their sole purpose: to be accepted for Crown taxes and to pay Crown debts. Their sole anchor: the King’s own demand for them, year after year. It is not wealth itself, but the *key* to unlocking our dormant wealth – our industry.

  **Bertrand:** (Sighs, placing his coin down) Alden, your vision of industry stirred is compelling. Truly. But you mistake the *nature* of the key. A key of paper, backed by nothing but the King’s promise to accept it back? It is a phantom. Money must be, or be instantly exchangeable for, something *real* – something men desire not just because the Crown says so, but because it feeds, clothes, or adorns them. Silver, grain... *something*. Otherwise, what restrains the Crown, come the next war or royal whim, from printing ten million? Twenty? The statute is parchment; ambition is steel.

  **Alden:** Restraint lies in design, Bertrand, not just in metal. The quantity is fixed irrevocably. The *only* demand for these Notes is the Crown's demand for taxes payable *in them*. If the Crown issued more, it would dilute the value of every Note it holds and spends! It would be taxing *itself* into worthlessness. The Crown becomes the largest holder; its interest aligns with scarcity. It’s self-policing, anchored by its own fiscal need.

  **Bertrand:** Self-policing? Pah! When the treasury is bare and the enemy at the gates, the temptation to ‘temporarily’ suspend the statute, to print ‘just enough’ to pay the troops, will be irresistible. And once broken, the dam is shattered. Your anchor is the King's good sense? History is littered with monarchs whose sense departed when pressed. Metal imposes a discipline paper cannot replicate. You *cannot* print more silver than you mine. Its scarcity is inherent, natural.

  **Alden:** Natural scarcity is a poor master when it strangles trade! But let us test this anchor you distrust. Consider the famine scenario. Suppose the harvest fails catastrophically – grain down by a third. Prices soar. You argue, I presume, that my Labour Notes become worthless paper? That they bid up prices while the hungry starve regardless?

  **Bertrand:** Precisely. Your Notes excite industry towards *what*? Towards grain that does not exist? They become frantic fingers pointing at an empty larder. The price of grain skyrockets, measured in your Notes, but the quantity is fixed. Those without grain starve just the same, holding Notes they cannot eat. Gold or silver, at least, have intrinsic value; they can be traded abroad for grain, if any is to be had. Your paper excites only desperation and inflation.

  **Alden:** (Leans forward, intense) You mistake the role of the token *entirely*, Bertrand, especially in crisis. The Notes don't conjure grain from air, true. But they don't merely chase a fixed stock either. Their power is to *organise action*. In famine, industry isn't dead; it must be redirected. Labour Notes command the digging of irrigation ditches *now* to prevent future famine. They command the transport of grain from surplus regions – if any exist – or the organisation of fisheries. They pay for the distribution of what little there is, efficiently. Gold cannot be eaten either! What use is a gold coin to a starving man in a village with no grain *and* no market? Its value depends entirely on the existence of trade, just as the Note's does. The Note, circulating locally, can still mobilise labour *towards survival efforts* – building, transporting, organising – which inert metal cannot command without a complex market structure that may have collapsed. The Note’s value, even then, stems from the *future* demand of the Crown for it in taxes, a demand that will resume when the crisis passes. It holds value as a promise of *future* relief from tax burdens, focusing effort on rebuilding the productive capacity that *will* yield future taxes.

  **Bertrand:** (Fingers drumming) A pretty theory of mobilisation, Alden. But you assume the Crown machinery functions smoothly amidst chaos. And you evade my core fear: the temptation. Your ‘self-policing’ mechanism relies on the Crown valuing the scarcity of its *own* Notes more than its immediate need for resources *now*. When faced with revolt *now* or inflation *later*, princes choose *now* every time. Metal forces the hard choice immediately: you spend only what you physically possess. Paper obscures that reality until it’s too late.

  **Alden:** Then let me turn your own famine question back upon your metal, Bertrand. You say gold has intrinsic value, can be traded abroad. But in a *global* famine? If every land is starved, what intrinsic value does gold possess then? Men don't eat gold. Its value, like the Note's, becomes purely symbolic – a token of potential future exchange, reliant entirely on a functioning network of trade and trust. If trade collapses utterly, your gold is merely heavy, yellow pebbles. My Labour Note, at least, carries the direct, immediate promise of relieving a specific, unavoidable future burden: the King's tax demand. That promise persists even if distant markets fail. It anchors value locally, to the sovereign's specific obligation.

  **Bertrand:** (Eyes narrow, a new thought striking) Ah, but Alden, you’ve overlooked a worm within your own apple. Your whole system rests on the Note exciting industry. Its value comes from its ability to be exchanged for goods and services *because* people need it for taxes. But what if the very *fear* you dismiss – the fear of future over-issue, or even just the fear of the Crown collapsing – makes people hoard the Notes instead of spending them?

  **Alden:** Hoard? But they need them for taxes...

  **Bertrand:** Precisely! If people fear scarcity of Notes *next year*, they will hoard them *this year*, refusing to spend them on goods or labour. They will pay their taxes, yes, but withdraw from trade otherwise. Your token’s power to ‘set industry moving’ depends on its *velocity* – how quickly it changes hands, facilitating transactions. If hoarded out of fear for its future scarcity or validity, its velocity plummets. Trade seizes up *worse* than before, despite your fixed supply! Your static vault of Notes becomes a stagnant pool, not a flowing river of industry. The fear you dismiss in the sovereign is mirrored by the fear in the populace, freezing the very mechanism you seek to create. Metal, held in hand, feels real; its scarcity is palpable, natural. The scarcity of your paper decree feels… arbitrary. Fear thrives on arbitrariness.

  **Alden:** (Pauses, genuinely struck) Hoarding… induced by fear of the note itself, not its quantity. That… is a subtle point, Bertrand. I confess, I had focused on the *creation* of the demand, not the *psychology* of its use. But is this fear not equally applicable to metal if people fear confiscation, debasement, or the collapse of the realm that mints it? Fear is a poison to any currency.

  **Bertrand:** True. But metal has history, weight, universality. Your paper scheme is novel, untested, resting solely on statute and the Crown's demand. Fear finds far more purchase on such untrodden ground. The risk of paralysis through hoarding is inherent in your design, a flaw my metal avoids by being desired for itself, not just for its use in discharging a specific debt.

  **Alden:** And I maintain your metal avoids nothing but flexibility, binding us to the accidents of geology and foreign trade when we need to unlock our own capacities. Your anchor is in the ground; mine is in the law and the reciprocal obligation between Crown and subject. You fear the power it grants the sovereign; I see it as the sovereign enabling the industry of the people.

  **Bertrand:** (Gathering his papers, the silver coin vanishing into his pocket) Then we are left, Alden, not merely arguing tokens, but foundations. Is the value of money a natural thing, found in the earth and its fruits, limiting the reach of princes? Or is it a creation of law and sovereign promise, a tool to be wielded – for good or ill – by human design? You place your faith in statute and institutional restraint. I place mine in the immutable scarcity of the tangible world. We agree on the disease – a paralysis of industry. We profoundly disagree on the cure, and crucially, on the dangers inherent in the remedy itself. Your paper key may unlock industry, Alden, or it may simply unlock the door to the treasury’s printing press. That is a risk Veridia cannot afford.

  **Alden:** (Watching Bertrand rise) And your metal anchor, Bertrand, may simply hold us fast to the seabed while the storm rages. The risk of stagnation is one Veridia *dies* from already. We need motion. We need trust in our own capacity, guided wisely. That... is the live disagreement. Power responsibly used, versus power inherently constrained by nature. Neither of us sees the other as a fool. Only the precipice beyond which we dare not step. *(He taps the proposal once more, thoughtfully.)*
