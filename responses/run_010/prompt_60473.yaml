  ### **Fallback for 8 Students**  
  - **Roles:** Use 8 core cards (Parked Car, Pedestrians x2, Cyclists x2, City Buses x2, Cars x2).  
  - **Walk-off:** One pair demonstrates; others observe and compute.  
  - **Symmetry:** Pairs combine (e.g., Car toward + Bus away).  
  - **Timeline:** Still shows full spread (Car away: -0.23, Car toward: 182.23).  

  ---

  ### **Failure Modes & Fixes**  
  - **Sign Confusion:** Worksheet mandates signed velocities. Pre-printed cards: "v = [number] m/s ([toward/away])".  
  - **Adding Light Travel Time:** Worksheet has SEPARATE step (Phase A) to prevent this.  
  - **Physics Major Invokes Curved Spacetime:** "GR is vital, but here we’re testing SR’s metaphysical implications in flat spacetime. Hold that thought for office hours!"  
  - **Walk-off Giggling:** Script: "This is a decision about war—take it seriously." Assign stoic students as partners.  
  - **Deflation Move ("Who Cares?"):** Pre-empt in Phase D: "If a tree falls on Andromeda and no one hears it, is it real? Then why is *your* tree special?"  

  ---

  ### **What This Activity Can’t Deliver**  
  1. **First-Person Open Future Intuition:** Students may still *feel* their future is open. The activity makes this tension explicit but can’t resolve it—that’s philosophy. **Mitigation:** Phase F objections (especially epistemic openness) let them preserve practical openness while conceding eternalism’s logic.  
  2. **GR Complications:** SR-based, so ignores gravity/time travel. Fine for intro.  
  3. **Metaphysical Conversion:** They’ll leave understanding the *argument*, not necessarily believing eternalism. Success is measured by grasping the dilemma.  

  **Final Tip:** End by assigning a 1-paragraph reflection: "If you’re an Andromedan moving at 30 m/s toward Earth, is *your* (Earth’s) future already fixed? Why/why not?" Forces symmetry application.  

