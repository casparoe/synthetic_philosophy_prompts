answer: |-
  ### Improved Activity Design: Rietdijk-Putnam Argument via Andromeda Paradox  
  **Goal:** Make relativity of simultaneity tangible and force confrontation with its metaphysical implications (eternalism vs. presentism). Designed for 16 students (fallback for 8 at end). Total time: 100 minutes.  

  **Key Fixes to Your Plan:**  
  - **Numbers & Spread:** Your colleague is wrong—gamma ≈ 1 is irrelevant because simultaneity offset depends on *vΔx/c²*, not gamma. At walking speeds, offsets are large due to Andromeda’s distance (2.5M ly).  
  - **Role Cards:** Speeds ≤30 m/s, council timeline optimized for max spread (pre-convene, mid-debate, near-vote, post-departure).  
  - **Walk-off:** Revised to force dramatic disagreement (hypothetical near-vote scenario).  
  - **Worry Addressed:** Activity *can* touch "open future" intuition via first-person commitment in Phases B and E. But debrief must explicitly connect distant events to personal future (see Phase F).  
  - **Failure Modes:** Built-in safeguards (structured worksheet, walk-off script, deflation rebuttal).  

  ---

  ### **Phase A: Role Cards & Computation** (15 min)  
  **Goal:** Compute frame-dependent "now" for Andromeda.  

  **Materials:**  
  - **Role Cards (16):** Velocities relative to room (Earth frame), signed: + = toward Andromeda, – = away.  
    | Role              | Velocity (m/s) | Offset Direction | Expected Council Day |  
    |-------------------|---------------|------------------|---------------------|  
    | Parked Car        | 0.0           | —                | 91.00               |  
    | Pedestrian (toward) | +1.4         | Future           | 95.26               |  
    | Pedestrian (away) | -1.4          | Past             | 86.74               |  
    | Cyclist (toward)  | +7.0          | Future           | 112.29              |  
    | Cyclist (away)    | -7.0          | Past             | 69.71               |  
    | City Bus (toward) | +15.0         | Future           | 136.62              |  
    | City Bus (away)   | -15.0         | Past             | 45.38               |  
    | Car (toward)      | +30.0         | Future           | 182.23              |  
    | Car (away)        | -30.0         | Past             | -0.23               |  
    | *Duplicate roles for 16 students (e.g., extra pedestrians/joggers).* |  

  - **Council Timeline:**  
    - **Start:** Day 0 (Council convenes).  
    - **Vote:** Day 180 (Decision made).  
    - **Fleet Departs:** End of Day 182.  
    - **Anchor:** At Earth "now" (t=0), council is at **Day 91** (mid-debate).  

  - **Worksheet:**  
    ```plaintext
    STEP 1: Your velocity (v): _________ m/s (use sign!).  
    STEP 2: OFFSET (days) = 3.041 × v  
            (Derivation: offset = (v × d) / c².  
             d = 2.5e6 ly = 2.365e22 m, c = 3e8 m/s → c² = 9e16 m²/s².  
             Offset (seconds) = (v × 2.365e22) / 9e16 = 262,780 × v.  
             Convert to days: 262,780 / 86,400 ≈ 3.041 days per m/s.)  
    STEP 3: T_clerk = 91 + OFFSET  
    STEP 4: Light travel time = 2.5M years. This is SEPARATE! Do not add/subtract.  
    ```  
    *Calculators allowed. Round to 2 decimals.*  

  **Activity Flow:**  
  1. Assign roles, hand out cards/worksheets (2 min).  
  2. Students compute T_clerk, write on index cards (8 min).  
  3. Post cards on board timeline (pre-drawn from -50 to 200 days) (5 min).  

  **Debrief Mapping:**  
  - Premise: Relativity of simultaneity (different motions → different "nows" for distant events).  
  - "Oh no" moment: Car (toward) sees fleet departed (182.23), Car (away) sees council not convened (-0.23).  

  ---

  ### **Phase B: Walk-off Commitment** (15 min)  
  **Goal:** First-person disagreement about whether the vote has happened.  

  **Materials:**  
  - **Hypothetical Worksheet:**  
    ```plaintext
    SCENARIO: Room frame council day = 180 (vote at 182).  
    You walk at 1.4 m/s (your partner walks opposite).  
    YOUR T_clerk = 180 + (3.041 × your v) → ANSWER: Has vote happened? (Yes/No)  
    ```  

  **Activity Flow:**  
  1. Pair students (one +1.4 m/s "toward", one -1.4 m/s "away").  
  2. Pairs go to corridor, walk 20m apart and back (steady pace) (5 min).  
  3. Upon return, partners face each other and state aloud:  
     - "In my frame, the vote HAS happened." (Toward: T_clerk=184.26 > 182)  
     - "In my frame, the vote has NOT happened." (Away: T_clerk=175.74 < 182)  
  4. No appeals to "true" frame allowed.  

  **Debrief Mapping:**  
  - Premise: No privileged frame → Contradictory facts about the same event.  
  - "Oh no" escalation: Personal commitment to a "future" event being past/fixed for them.  

  **Failure Mode Fix:**  
  - Giggling: Assign "debate referees" to enforce solemnity.  
  - Sign errors: Pre-printed worksheets with v=±1.4 filled in.  

  ---

  ### **Phase C: Symmetry Calculation** (15 min)  
  **Goal:** Each frame explains the other’s offset.  

  **Activity Flow:**  
  1. Same pairs. Each computes their partner’s offset *from their own frame’s perspective* (10 min):  
     - *Example: Bus (toward, v=15 m/s) sees parked car (v=0) moving away at -15 m/s.  
       Offset = 3.041 × (-15) = -45.62 days → "Car sees council at 136.62 - 45.62 = 91 days."*  
  2. Share results: Both can "blame" the other’s motion (5 min).  

  **Debrief Mapping:**  
  - Premise: Symmetry of relativity → No frame can claim objectivity.  

  ---

  ### **Phase D: Scale & Relevance** (10 min)  
  **Goal:** Confront the "who cares?" deflation move.  

  **Activity Flow:**  
  1. **Q:** How fast to shift 100m by 1 second? (5 min)  
     - Formula: Δt = (v Δx) / c² → v = (c² Δt) / Δx  
     - v = (9e16 m²/s² × 1 s) / 100 m = 9e14 m/s = 3e6 c (impossible).  
  2. **Discuss:** "At human scales, offsets are nanoseconds. Does this protect *your* future from being ‘fixed’ in other frames?" (5 min).  
     - *Key point: Distance doesn’t negate the effect—it amplifies it. If eternalism holds for Andromeda, symmetry demands it for Earth.*  

  **Debrief Mapping:**  
  - Rebuts deflation: Technical irrelevance ≠ metaphysical irrelevance.  

  ---

  ### **Phase E: Chocolate Coin Challenge** (10 min)  
  **Goal:** Highlight scarcity of frame-invariant facts.  

  **Activity Flow:**  
  1. Students ante chocolate coins.  
  2. **Challenge:** "State a claim about the invasion that all frames agree on." (5 min).  
  3. **Expected Outcomes:**  
     - Most fail (e.g., "Fleet arrives in 2.5M years" is frame-dependent).  
     - Possible wins: "Light from departure arrives in 2.5M years" (trivial; light speed invariant).  
  4. Pot unclaimed or awarded for triviality → Lesson: Facts about the future are frame-relative.  

  **Debrief Mapping:**  
  - Premise: Invariance is rare → Future events lack objective "openness".  

  ---

  ### **Phase F: Argument & Objections** (25 min)  
  **Goal:** Formalize the argument and grapple with objections.  

  **Activity Flow:**  
  1. **Name & Statement (5 min):**  
     - "Rietdijk-Putnam Argument: If relativity of simultaneity is true, then events future for you are present/past for others. Thus, the future must be real (eternalism), or ‘openness’ is frame-dependent."  
  2. **Objection Cards (groups of 4):** Each group tackles one objection (10 min):  
     - **Objection 1 (Transitivity):** "Can’t stitch local ‘nows’ into a global present? (Simultaneity isn’t transitive across frames.)"  
       → *Eternalist concedes:* Global present is incoherent; reality is frame-relative.  
     - **Objection 2 (Privileged Frames):** "Why privilege inertial frames? Presentism can reject them."  
       → *Eternalist concedes:* Nothing—but then physics can’t define "now," making presentism unverifiable.  
     - **Objection 3 (Epistemic Openness):** "Openness is about local knowledge, not metaphysics."  
       → *Eternalist concedes:* Deliberation is unchanged, but the *future’s reality* is still frame-dependent.  
     - **Objection 4 (Distance):** "The effect only matters at cosmic distances—why care?"  
       → *Eternalist concedes:* True, but if future Andromeda is real, future Earth is real for Andromedans (symmetry).  
  3. Group reports (5 min per objection, rotate).  

  **Debrief Mapping:**  
  - Connects activity to metaphysics: Personal "open future" is incompatible with universal simultaneity.  
  - **Your Worry Addressed:** Phase B (walk-off) and E (challenge) make it personal, but you *must* hammer symmetry in debrief: "If your future is open, why is Andromeda’s future fixed for some? What’s special about *here*?"  

