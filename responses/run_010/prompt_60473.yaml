  ### **Board Layout & Timeline**  
  - **Timeline:** Whiteboard with horizontal axis: **Days (-50 to 200)**, labeled:  
    - Council Start (0) │ Mid-Debate (91) │ Vote (180) │ Fleet Departs (182).  
  - **Plot:** Students place index cards at T_clerk. Spread visually shows:  
    - Car (away): -0.23 (pre-convene)  
    - Bus (away): 45.38 (early debate)  
    - Parked Car: 91.00 (mid-debate)  
    - Bus (toward): 136.62 (late debate)  
    - Car (toward): 182.23 (fleet departed)  

