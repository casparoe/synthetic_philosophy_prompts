prompt: |-
  I serve on the six-person Integrity Review Panel of an international NGO that administers donor-funded maternal and child health programs, and on Friday the panel must resolve a case on which it is currently deadlocked two-to-two. I intend to circulate a written opinion in advance of the meeting. Please draft that opinion in my name.

  The panel's jurisdiction is limited: we may uphold, overturn, or modify the findings of the internal audit and set the consequent remedies, and we may adopt interpretive guidance binding on future panels, but we may not amend the Standards themselves. Assume the audit's factual findings are accurate and do not invent further facts.

  **The findings.** Over three years the director of our country office in a West African state where we work through district health offices did three things, all of which the audit flagged:

  1. **Attendance allowances.** He paid cash per diems to district health officers and to elected members of village health committees who attended our training workshops, at rates set by the host government's own statutory per-diem schedule for civil servants attending official meetings — roughly three times the local daily wage. The audit concluded these were improper payments to public officials. Its stated ground is that the allowances functioned as inducements, because recorded attendance rose sharply in the year the payments began.

  2. **A funeral contribution.** He authorized the purchase of a goat, rice, and cooking fuel, drawn from the logged "community relations" budget line, for the funeral of the mother of a district medical officer with whom the office deals weekly. The expenditure was properly logged and within the budget cap. The audit concluded that a contribution to the household of a public official on a personal occasion crosses from community relations into private benefit.

  3. **A driver.** He hired, without a competitive process, the nephew of the district chief who controls decisions about clinic siting and land access. The director maintains the nephew was the only applicant holding a license and prior experience, and that a refusal would have been publicly read as a rebuff and would have cost the program its land access. Our Standards require open competitive recruitment for appointments longer than six months.

  **The governing text.** Our Standards define a prohibited payment as any transfer of value to a public official or to a member of their household that is intended to secure favorable treatment, and they separately permit community-relations expenditures for "customary hospitality," provided they are logged and capped. The donor's anti-bribery clause is incorporated by reference and is drafted in zero-tolerance terms.

  **The two camps.** Two members hold that the findings are straightforward and that the office should recover the payments and terminate the director; that any accommodation here licenses the next, larger accommodation; and that a panel which carves out exceptions for one region is applying a different code there than it applies elsewhere. Two members hold that the audit treats all reciprocal gift-giving as bribery; that allowances, feasts, and kinship hiring are the ordinary currency of legitimate obligation in the setting and are what makes the program deliverable at all; that sanctioning the director would enforce a norm no one in the district recognizes and would destroy a functioning program; and that the Standards' own reference to customary hospitality shows the drafters knew the code could not be applied without local calibration.

  **What I want the opinion to do.**

  - Distinguish two ways of characterizing the wrong at issue — corruption as the illicit conversion of public office into private revenue, and corruption as the subordination of an office's entrusted purposes to the personal purposes of its holder — and identify which of the two our Standards actually encode, since I suspect each camp is tacitly arguing from a different one. Show where that identification changes the analysis of each of the three findings.
  - Address the audit's inference in finding 1: whether behavioral responsiveness to a payment establishes corrupt intent, or whether it is equally consistent with the payment being an incentive or a wage supplement, and what turns on that difference.
  - Take account of a fact the audit recorded but did not discuss: the host government's per-diem schedule was itself introduced in the 1990s by donor agencies to staff their own workshops, and was adopted into national civil-service rules thereafter. Say what follows for the argument that these payments are protected local custom.
  - Propose a forward-looking test the panel can apply to unanticipated cases, stated as criteria a member could actually operate — not as a list of values. It should say how the panel is to decide which local conventions are eligible to modify the application of the Standards and which are not, and it should state explicitly whether the test it produces is universalist or convention-sensitive, and in what sense.
  - Commit to a disposition and remedy on each of the three findings. The three need not come out the same way; if you conclude they should, explain why the apparent differences among them are not morally relevant.
  - State the strongest consideration against your recommended dispositions in a form that a member of the opposing camp would accept as their own view rather than a caricature, and explain what weight you assign it and why.

  Format it as a formal internal memorandum with a short disposition summary at the top that the panel could adopt verbatim as a motion. Roughly 1,100 to 1,400 words. Write in a measured, argumentative register suitable for a divided body: no bullet-point lists of alternatives, no hedging toward a menu of options, and no citations, references, reading lists, or appeals to outside authorities — the reasoning must stand on the facts given and on argument alone.
reasoning: |-
  Hmm, the user is asking me to draft a formal memorandum for an Integrity Review Panel that's deadlocked on a case involving three controversial findings in a maternal and child health NGO program. This is a complex ethical and operational dilemma set in a West African context.

  The user is a panel member facing a 2-2 deadlock and wants me to create an opinion that will help break the impasse. They've provided detailed background: three findings about cash per diems, funeral contributions, and nepotistic hiring; the governing standards; and the two opposing viewpoints among panel members. 

  I need to craft this carefully. The memorandum must:
  - Distinguish between two conceptions of corruption
  - Analyze whether behavioral response proves corrupt intent
  - Address the historical context of per diems
  - Propose a practical forward-looking test
  - Provide specific dispositions for each finding
  - Acknowledge counterarguments fairly

  The key tension is between universal application of anti-corruption standards versus context-sensitive implementation. This requires nuanced reasoning without compromising integrity. 

  For the attendance allowances, I note the historical irony that donors created the per diem schedule now being questioned. The audit's inference that increased attendance proves inducement seems flawed - responsiveness could equally indicate legitimate compensation for lost wages. 

  The funeral contribution involves cultural norms versus rules against private benefits. The "customary hospitality" provision suggests some accommodation is expected, but personal gifts to officials cross a line.

  The driver hire presents a classic dilemma between merit principles and practical necessity. While kinship hiring violates competitive process rules, the potential loss of land access threatens program viability.

  My proposed test distinguishes between conventions that facilitate public purpose versus those that divert it to private gain. This maintains the Standards' core while allowing contextual application.

  For remedies:
  - Uphold per diems as legitimate compensation
  - Reverse funeral contribution finding but issue guidance
  - Modify driver hire finding with probation rather than termination

  The strongest counterargument is about slippery slopes and unequal application - I address this by emphasizing that all three decisions serve the fundamental purpose of enabling health service delivery while containing corruption risks.

  The memorandum needs formal structure: summary disposition first, then thorough analysis in measured, persuasive language. Word count should be 1,100-1,400 words without bullet points or external citations. Tone must be respectful of both sides while providing clear direction to break the deadlock.
answer: |-
  **MEMORANDUM**  
  **TO:** Integrity Review Panel Members  
  **FROM:** [Your Name], Panel Member  
  **DATE:** [Date of Circulation]  
  **RE:** Disposition Recommendation in Case No. [Case Number] - West Africa Country Office  

  ---

  **DISPOSITION SUMMARY (Proposed Motion)**  
  *The Panel resolves as follows:*  
  1. **Finding 1 (Attendance Allowances):** Overturned. Per diems aligned with host-government schedules are permissible.  
  2. **Finding 2 (Funeral Contribution):** Modified. The expenditure violated Standards but warrants non-disciplinary remediation. Guidance on "customary hospitality" is adopted.  
  3. **Finding 3 (Driver Hire):** Upheld with modification. Competitive process violation confirmed; director receives formal censure and probation. Remedial training on recruitment is ordered.  
  4. **Interpretive Guidance Adopted:** Local conventions may modify application of Standards *only* where they demonstrably advance the entrusted public purpose of an office or program, rather than subordinate it to private interests.  

  ---

  **OPINION**  

  Our deadlock arises not from disputed facts but from competing conceptions of corruption itself. One camp views corruption as the *illicit conversion of public office into private revenue*—focusing on whether value was improperly transferred to an official. The other views it as the *subordination of an office’s entrusted purposes to the personal purposes of its holder*—focusing on whether an official’s duties were distorted for private gain. Our Standards resolve this tension. They prohibit transfers "intended to secure favorable treatment" (emphasizing distortion of purpose) while permitting "customary hospitality" (acknowledging context). Thus, **the Standards define corruption by whether a transfer subordinates public purpose to private interest, not merely by the fact of transfer to an official.** This distinction reframes each finding.  

  ### **I. Analysis of Findings**  
  **A. Attendance Allowances**  
  The audit infers corrupt intent from increased attendance, equating behavioral responsiveness with inducement. This is flawed. Responsiveness is equally consistent with legitimate compensation: per diems offset lost wages for attendees (e.g., village committee members forfeiting daily labor). The critical question is whether payments *subordinated* the officials’ duties. Here, payments matched the host government’s *own* statutory schedule—a schedule donors originally designed to compensate fairly for participation in capacity-building workshops. This was not a covert bargain but a transparent, rule-bound wage supplement.  

  *Historical Context & Local Custom*: The audit notes this schedule originated with donors. Its subsequent adoption as national policy indicates it became a legitimate local convention for compensating public service participation. To deem it now "corrupt" would retroactively criminalize a practice we institutionalized. However, local custom alone is insufficient justification; the payment must serve the program’s purpose. Here, per diems enabled attendance by those who could not otherwise afford it, directly advancing workshop objectives.  

  **Disposition:** *Overturn the finding.* Allowances were not intended to distort duty but to facilitate it. Recovery is unwarranted.  

  **B. Funeral Contribution**  
  The contribution served a personal occasion for an official’s household, crossing from "customary hospitality" into private benefit. While funerals are culturally significant, the Standards’ separation of "community relations" from "private benefit" turns on the recipient’s relationship to public functions. Gifts to an official’s *family* blur this line. The director’s intent—to maintain goodwill—does not negate the risk: the official could perceive an obligation extending beyond professional courtesy.  

  Yet context matters. The gift was modest, logged, and within budget. Sanctioning the director harshly (e.g., termination) would ignore the genuine ambiguity in applying "customary hospitality" to deeply communal traditions. The wrong lies not in corrupt intent but in insufficient guardrails against perceived reciprocity.  

  **Disposition:** *Modify the finding.* The expenditure violated Standards by conflating community relations with private benefit. However, the remedy is *non-disciplinary*: issue guidance (below) and require the office to clarify "customary hospitality" protocols. No recovery is feasible or proportionate.  

  **C. Driver Hire**  
  The director violated the competitive recruitment Standard. His defense—that refusal would have cost land access—confirms the subordination of program purpose to private interest: the chief’s kinship network dictated staffing. Even if the nephew was qualified, the lack of process created the *appearance* that access to public assets (land) depended on private patronage. Our Standards exist precisely to firewall program integrity from such pressures.  

  That said, the audit confirms the director’s operational dilemma: loss of land access could cripple the program. This exigency mitigates culpability but does not excuse the violation. Competitive recruitment ensures meritocracy and deters systemic favoritism; circumventing it risks embedding kinship as a prerequisite for access.  

  **Disposition:** *Uphold with modification.* The violation is confirmed, but termination is disproportionate. Remedies: (1) Formal censure for the director; (2) Probationary review of future recruitment; (3) Mandatory training on competitive processes.  

  ---

  ### **II. Forward-Looking Test for Local Conventions**  
  To reconcile universal Standards with contextual application, the Panel adopts this test:  
  > **A local convention may modify the application of Standards only if it demonstrably advances the entrusted purpose of the office or program it affects, rather than subordinates that purpose to private interests.**  

  **Operational Criteria:**  
  1. **Purpose Advancement:** Does the convention enable the effective execution of public or programmatic duties (e.g., per diems enabling workshop attendance)?  
  2. **Non-Subordination:** Does it avoid transferring discretionary authority to private interests (e.g., kinship hiring that makes access conditional on nepotism fails this)?  
  3. **Transparency:** Is the convention open and rule-bound (e.g., logged per diems vs. covert gifts)?  

  This test is **universalist in ends** (preserving institutional purpose) but **convention-sensitive in means**. It disqualifies conventions that hijack public resources for private gain, even if culturally normalized.  

  ---

  ### **III. Strongest Counterargument and Its Weight**  
  The strongest objection to this approach is: *Accommodating context here licenses incremental erosion of Standards elsewhere, creating unequal enforcement and signaling that prohibitions are negotiable.* This concern carries significant weight—perhaps 40% in a balanced assessment—because consistency deters opportunism.  

  I assign it less than determinative weight for two reasons:  
  1. **Rigor in Test Application:** The proposed test is not a free pass for local practice. It invalidates conventions that subordinate public purpose (e.g., the driver hire), maintaining a bright line.  
  2. **Greater Risk of Absolutism:** Refusing *all* context risks rendering Standards unenforceable or destructive in practice (e.g., paralyzing workshops by denying per diems). This undermines integrity more than calibrated exceptions.  

  ---

  ### **IV. Remedial Guidance**  
  To prevent recurrence, the Panel adopts this binding guidance:  
  - **"Customary Hospitality":** Must be impersonal (e.g., communal feasts open to all, not household-specific gifts) and logged. Gifts to individuals holding public office are presumptively private benefits.  
  - **Recruitment:** No "emergency" exemption to competitive processes exists. Directors must document efforts to broaden applicant pools and seek Panel pre-approval for any non-competitive hire.  
  - **Per Diems:** Aligned with official host-government schedules are permissible absent evidence of inflated rates or covert side agreements.  

  ---

  **CONCLUSION**  
  This recommendation distinguishes between practices that *enable* entrusted purposes (per diems) and those that *subordinate* them to private interests (funeral gifts, kinship pressure). It enforces the Standards’ core aim—preventing the corruption of public purpose—while acknowledging that fidelity to purpose may require contextual means. Adopting this framework ensures integrity is measured not by mechanical compliance but by the resilience of the mission we serve.  

  Respectfully submitted,  
  [Your Name]
