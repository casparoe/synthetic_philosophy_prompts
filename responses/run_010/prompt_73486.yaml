prompt: |-
  Bit of context before the list: I run a very small evaluation function inside a welfare-to-work provider — two of us, and I do the analysis myself, largely self-taught out of epidemiology textbooks. We've just finished comparing an intensive caseworker-led track against the standard offer, and the write-up goes to the board next week. Before it does I'd like someone to check whether my statistical commitments actually hang together, because I have a nagging feeling they dont and I can't locate where the trouble is.

  The package:

  1. No-causes-in-no-causes-out. The numbers can never tell me which variables to condition on. That has to come from knowing how the scheme was actually run — who got pointed at which track and why.

  2. I don't condition on anything recorded after assignment. No mediators, no colliders. Total effects or nothing.

  3. Risk differences, full stop, and I make a point of it in the report. I don't trust odds ratios or hazard ratios because they're non-collapsible: you can adjust for something that plainly can't be a confounder and watch the estimate move anyway.

  4. My working test for whether a crude comparison was confounded is to adjust for the candidate covariate and see if the estimate moves. Moves materially → the crude one was confounded. Doesn't move → it wasn't.

  5. I hold something like a sure-thing principle here: if the intensive track raises the employment rate within every stratum of a pre-assignment variable, then it raises it in the population as a whole. A table that says the opposite must have something wrong in it.

  6. The data. Intake severity was scored at referral, before anyone was assigned. There were 400 high-need participants and 400 lower-need ones in total.

     high-need / hard-to-place:
     - intensive track: 300 assigned, 120 in work at 12 months (40.0%)
     - standard offer: 100 assigned, 25 in work (25.0%)

     lower-need:
     - intensive track: 100 assigned, 80 in work (80.0%)
     - standard offer: 300 assigned, 210 in work (70.0%)

     whole cohort:
     - intensive track: 400 assigned, 200 in work (50.0%)
     - standard offer: 400 assigned, 235 in work (58.75%)

     So it wins by 15 points and by 10 points inside the strata, and loses by nearly 9 points crude. My verdict: the crude figure is confounded by intake severity, the honest answer is that the track helps, and I told the board their headline comparison is meaningless and gave them the two stratified figures instead.

  7. I also told them that if they extend the intensive track to every intake, the payoff will be bigger than either of those stratified figures, since it worked for hard-to-place and lower-need people alike.

  8. In the discussion section I wrote that the intensive track only pays off where the participant engages with it — even though the board asked me to condition on session attendance and I refused on the grounds of (2).

  And two things that aren't commitments so much as worries I can't shake. First, I like saying that the reversal is what tipped me off that the crude comparison couldn't be trusted, which sounds suspiciously like the data telling me about causes, contra (1); I don't think it is, but I couldn't say why if pushed. Second, between (6) and (7) I sound like a relativist — I keep saying there's no such thing as the effect of the track, only effects relative to some particular mix of participants — and then I turn round and tell the board their number is flat wrong, as though mine were the true one. I can't tell whether that's incoherent or just bad-sounding.

  What I want is an audit, not a tutorial. Go through the set and tell me which items genuinely pull against each other and which only look like they do, ranked by severity, and for each real one say what has to give and what the cheapest repair costs me. Please actually work the numbers rather than taking my word for them: check that the table behaves the way I claim, and work out what the standardised figure would be if everybody got the intensive track, and whether that supports what I said in (7) about it being bigger than the stratified effects. If two of my items are both perfectly fine and merely look like they clash, say so plainly — I don't want all nine flagged as equally damaged. Then finish with which single revision would clean up the most.

  One last thing. Where I've got something wrong that everyone who works in this area would agree is wrong, just say it's wrong. But where the disagreement is live — which measure to use, whether a change-in-estimate is evidence of anything, whether non-collapsibility is a defect or just a property — please separate what's settled from what's genuinely contested among people who know the topic, and don't hand me a contested position dressed up as the consensus. No references needed, I just want the reasoning.
reasoning: |-
  We are given data on two groups: high-need and lower-need participants. Each group was assigned to either an intensive track or a standard offer. The outcome is employment at 12 months.

  The data:

  High-need (400 total):
  - Intensive: 300 assigned, 120 employed → 40.0%
  - Standard: 100 assigned, 25 employed → 25.0%

  Lower-need (400 total):
  - Intensive: 100 assigned, 80 employed → 80.0%
  - Standard: 300 assigned, 210 employed → 70.0%

  Whole cohort (800 total):
  - Intensive: 400 assigned, 200 employed → 50.0%
  - Standard: 400 assigned, 235 employed → 58.75%

  We observe that within each stratum (high-need and lower-need), the intensive track has a higher employment rate than the standard offer (40% vs 25% for high-need, 80% vs 70% for lower-need). However, in the overall (crude) comparison, the standard offer has a higher employment rate (58.75% vs 50%).

  The analyst's verdict:
  - The crude figure is confounded by intake severity.
  - The intensive track helps in both strata.
  - The board's headline comparison (crude) is meaningless, and the stratified figures should be used.

  Additionally, the analyst claims that if the intensive track is extended to every intake, the payoff will be bigger than either of the stratified figures (which are 15% and 10% improvements, respectively).

  We are to audit the analyst's commitments and worries.

  Commitments:

  1. No-causes-in-no-causes-out: The numbers can't tell which variables to condition on. That must come from knowledge of the scheme.

  2. No conditioning on post-assignment variables.

  3. Use risk differences (not odds ratios or hazard ratios) because of non-collapsibility.

  4. Change-in-estimate test for confounding: if adjusting for a covariate changes the estimate materially, then the crude was confounded; if not, then not.

  5. Sure-thing principle: if the treatment improves the outcome in every stratum, then it must improve the outcome overall.

  6. The data and the conclusion that the crude is confounded.

  7. Extending the intensive track to everyone would yield a payoff bigger than either stratified effect.

  8. Refusal to condition on session attendance (a mediator) to avoid breaking the total effect.

  Worries:

  A. The reversal (Simpson's paradox) tipped off the analyst that the crude was confounded, but that seems like the data telling about causes, contradicting (1).

  B. The analyst sounds like a relativist (no single effect, only relative to the population) but then claims the board's number is flat wrong, which might be incoherent.

  We are to:

  - Check the numbers (do they behave as claimed?).
  - Calculate the standardized effect if everyone got the intensive track and see if it supports (7).
  - Identify which commitments pull against each other and rank by severity.
  - For each real conflict, say what must give and the cheapest repair.
  - Separate settled issues from contested ones.

  Step 1: Verify the numbers.

  The provided data:

  High-need intensive: 120/300 = 40% (correct)
  High-need standard: 25/100 = 25% (correct)
  Lower-need intensive: 80/100 = 80% (correct)
  Lower-need standard: 210/300 = 70% (correct)

  Overall intensive: (120+80)=200/400=50% (correct)
  Overall standard: (25+210)=235/400=58.75% (correct)

  The risk differences (RD) in each stratum:
  High-need: 40% - 25% = 15% (intensive better by 15%)
  Lower-need: 80% - 70% = 10% (intensive better by 10%)

  Crude: 50% - 58.75% = -8.75% (intensive worse by 8.75%)

  So, indeed, the intensive is better in each stratum but worse overall.

  Step 2: The sure-thing principle (commitment 5) states that if the treatment is better in every subgroup, then it must be better overall. But here we see the opposite: better in subgroups, worse overall. Therefore, the analyst concludes that the overall (crude) comparison is confounded. This seems to be the reasoning.

  But note: the sure-thing principle is a principle of decision theory (also known as the independence of irrelevant alternatives) and in statistics, it is related to the concept of a consistent effect. However, in the presence of confounding, the overall unadjusted comparison can be reversed (Simpson's paradox). So the principle holds if there is no confounding, but in this case, the analyst uses the violation to detect confounding.

  Step 3: The change-in-estimate test (commitment 4). The analyst would adjust for intake severity and see that the estimate moves (from -8.75% to ...?).

  But note: the analyst didn't report a single adjusted estimate. Instead, they presented the stratified results. However, we can compute the adjusted risk difference.

  We can compute the average treatment effect by standardizing to the population.

  The population has 400 high-need and 400 lower-need. So each stratum is half the population.

  The expected outcome under intensive for the whole population: 
  We take the rates in the intensive group for each stratum and average them (since the strata are equally sized):

  Expected employment if everyone gets intensive:
  = (rate in high-need intensive * proportion of high-need) + (rate in lower-need intensive * proportion of lower-need)
  = (40% * 0.5) + (80% * 0.5) = 20% + 40% = 60%

  Similarly, expected employment if everyone gets standard:
  = (25% * 0.5) + (70% * 0.5) = 12.5% + 35% = 47.5%

  Therefore, the average treatment effect (ATE) is 60% - 47.5% = 12.5%.

  Alternatively, we can compute the risk difference in each stratum and average them (with equal weights):

  ATE = [ (40-25) + (80-70) ] / 2 = (15 + 10) / 2 = 12.5%

  So the adjusted risk difference (ATE) is +12.5%, which is indeed a big move from the crude risk difference of -8.75%. Thus, by the change-in-estimate test, the crude was confounded.

  This supports commitment 4 and 6.

  Step 4: Claim (7): Extending the intensive track to everyone would yield a payoff bigger than either stratified effect.

  The stratified effects are 15% (for high-need) and 10% (for lower-need). The ATE is 12.5%, which is between 10% and 15%. So it is not bigger than the 15% effect, but it is bigger than the 10% effect. However, the analyst says "bigger than either", meaning bigger than both? That would require it to be above 15%, which it is not.

  The analyst says: "the payoff will be bigger than either of those stratified figures". But 12.5% is bigger than 10% (the lower-need effect) but smaller than 15% (the high-need effect). So it is not bigger than both.

  However, note that the analyst might have meant that the overall payoff (in absolute terms) would be bigger than the effect in either stratum? But the effect in high-need is 15% and in lower-need 10%, and the overall is 12.5%, which is bigger than 10% but less than 15%. Alternatively, the analyst might be referring to the absolute number of people employed? Let's compute:

  If everyone gets intensive: 60% of 800 = 480 employed.
  If everyone gets standard: 47.5% of 800 = 380 employed.
  Difference: 100 more employed.

  In the high-need stratum, the effect is 15% of 400 = 60 more employed if they all get intensive vs standard.
  In the lower-need stratum, the effect is 10% of 400 = 40 more employed.

  The overall effect (100) is indeed bigger than either 60 or 40? But note: 100 is the total additional employment in the whole population, which is the sum of the gains in both strata (60+40=100). So in absolute numbers, the overall gain is the sum of the gains in the two strata, so it is bigger than either. But the effect size (percentage point difference) is 12.5%, which is between 10% and 15%. 

  The analyst might be referring to the absolute number of additional people employed, not the percentage point difference? The report says "payoff", which could be ambiguous. However, in the context, they are using percentages for the effects. In (7) they say "bigger than either of those stratified figures", and the stratified figures are 15 and 10 percentage points. So the effect size (12.5) is not bigger than 15.

  This is a problem. The analyst should clarify whether they mean the effect size or the total number of additional employed. The total number of additional employed when extending to everyone is 100, which is more than the 60 in the high-need group or the 40 in the lower-need group? But note: in the high-need group, if we extend intensive to only that group, we get 60 more employed (compared to standard). Similarly, for lower-need, 40 more. But if we extend to both, we get 100 more, which is greater than either 60 or 40. So in that sense, the total payoff (in terms of additional employment) is bigger than the payoff from either group alone. However, the analyst is comparing the effect in the whole population to the effect in each subgroup. The effect in the whole population is 12.5%, which is not bigger than the 15% effect in the high-need group.

  But note: the analyst says "the payoff will be bigger than either of those stratified figures". The stratified figures are the risk differences (15% and 10%). So the overall effect (12.5%) is not bigger than 15%. Therefore, this statement is incorrect if we interpret "payoff" as the risk difference. However, if we interpret "payoff" as the total number of additional people employed, then it is 100, which is bigger than 60 and 40. But the stratified figures are given in percentage points, so the context suggests the risk difference.

  This is a contradiction. The cheapest repair is to clarify the language: the total number of additional people employed (which is the absolute count) is bigger than the additional count in either stratum alone. But the effect size (risk difference) in the whole population is between the two stratum-specific effects. The analyst should not claim that the effect size (12.5%) is bigger than both 15% and 10%.

  Step 5: Commitment 5 (sure-thing principle) and the data: The analyst says that if the intensive track raises employment in every stratum, then it must raise it overall. But we see that the unadjusted overall comparison is reversed. The analyst uses this to detect confounding. However, the sure-thing principle is a logical principle: if A is better than B in every possible state, then A is better overall. The reversal here is due to the imbalance in the distribution of the strata between the treatment groups. In the intensive group, the majority (300/400) are high-need (who have lower employment rates) and in the standard group, the majority (300/400) are lower-need (who have higher employment rates). So the overall comparison is confounded by the imbalance in the covariate (intake severity).

  Therefore, the analyst's use of the sure-thing principle is consistent: the reversal indicates that the crude comparison is confounded. But note: the principle itself does not hold in the presence of confounding. The analyst is not violating the principle; they are using the apparent violation (in the data) to detect confounding.

  Step 6: Worry A: The reversal (data) tipped off the analyst that the crude was confounded. But commitment 1 says that the numbers can't tell which variables to condition on. However, the analyst did not use the data to choose the variable to condition on. The variable (intake severity) was chosen based on prior knowledge of the scheme (commitment 1). The reversal then confirmed that this variable was a confounder. This is consistent. The data can be used to check for confounding (via the change-in-estimate test) once the variable is chosen, but the choice of variable must be based on subject-matter knowledge.

  Therefore, worry A is unfounded. The analyst did not violate commitment 1.

  Step 7: Worry B: The analyst says there's no such thing as the effect of the track, only effects relative to a particular mix. Then they say the board's number (the crude effect) is flat wrong. Is that incoherent?

  The analyst is correct that the effect depends on the population. The effect in the high-need group is 15%, in the lower-need 10%, and in the whole population (if we standardize) it's 12.5%. The board's number (-8.75%) is wrong because it is confounded. The analyst is not being a relativist in the sense that any number is acceptable; they are saying that the unadjusted number is biased. The adjusted number (12.5%) is the average treatment effect for the whole population. So the analyst is not being inconsistent: they are saying that the board's number is biased and that the true effect (for the whole population) is 12.5%. The effect is defined for a specific population and a specific comparison. The board's comparison is the same population but without adjustment for confounding. Therefore, the analyst can consistently claim that the board's estimate is biased and that the adjusted estimate is the correct one for the population.

  Step 8: Commitments 1 and 4: The change-in-estimate test (4) uses the data to decide if a covariate is a confounder. But commitment 1 says that we cannot use the data to choose which variables to condition on. However, note that the change-in-estimate test is used after we have chosen a candidate covariate (based on subject-matter knowledge). The test then tells us whether that covariate is a confounder (by whether the estimate changes). This is a common practice, but it is not without problems.

  The problem: a change in estimate when adjusting for a covariate does not necessarily mean that the covariate is a confounder. It could be that the covariate is a mediator, or it could be due to other reasons (like sampling variability). Conversely, no change does not necessarily mean no confounding (if there are multiple confounders, for example). 

  This is a contested area. Some argue that the change-in-estimate test is a useful tool, while others point out its limitations. It is settled that the change-in-estimate test is not a definitive test for confounding. However, in the absence of better information, it is often used.

  In this case, the analyst adjusted for intake severity (a pre-assignment variable) and found a large change in the estimate. Since they avoided mediators (commitment 2), the change is likely due to confounding. So it is reasonable.

  But note: if the analyst had adjusted for a non-confounder, the estimate might change due to non-collapsibility? However, the analyst uses risk differences, which are collapsible. So for risk differences, if the covariate is not a confounder, the adjusted and unadjusted risk differences should be the same (in expectation). Therefore, the change-in-estimate test is valid for risk differences when the covariate is not a confounder and not a collider. But if the covariate is a collider, adjusting for it would induce bias. However, the analyst avoids colliders by not conditioning on post-assignment variables (commitment 2). So in this setup, the change-in-estimate test for risk differences is a valid test for confounding.

  Therefore, for risk differences and when the covariate is pre-assignment, the change-in-estimate test is a valid indicator of confounding. This is settled.

  Step 9: Commitment 3: The analyst uses risk differences because they are collapsible. This is a good practice. The non-collapsibility of odds ratios and hazard ratios is a well-known issue, and it means that even if there is no confounding, the adjusted and unadjusted odds ratios may differ. Therefore, the change-in-estimate test for odds ratios is not valid for detecting confounding. The analyst's commitment to risk differences is sound and avoids this problem.

  Step 10: Commitment 8: The analyst refuses to condition on session attendance because it is a mediator (post-assignment). This is correct because conditioning on a mediator would block part of the effect of the treatment and lead to a biased estimate of the total effect. The board wanted to condition on it, but the analyst correctly refused. The analyst then made a statement about engagement without conditioning: that the intensive track only pays off where the participant engages. This is a statement about the mechanism, but without conditioning on the mediator, the analyst cannot directly estimate the direct and indirect effects. However, the analyst is allowed to make a qualitative statement based on subject-matter knowledge.

  Step 11: Summary of conflicts and issues:

  - The main issue is in claim (7): the statement that the overall payoff would be bigger than either stratified effect. As a risk difference, 12.5% is not bigger than 15%. This is a clear error in communication. The cheapest repair is to rephrase: the overall effect (12.5%) is positive and substantial, and the total number of additional people employed (100) is greater than the additional employment in either stratum alone (60 in high-need and 40 in lower-need) if we only treated that stratum. But note: if we only treat the high-need, we get 60 more employed, and if we only treat the lower-need, we get 40, but if we treat both, we get 100, which is 60+40. So the total additional employment is the sum. However, the effect in each stratum is still the same. The analyst should not say the effect size is bigger than both.

  - There is no real conflict between the sure-thing principle and the data: the reversal is a signal of confounding, and the principle holds in the absence of confounding.

  - Worry A: no conflict because the variable was chosen by subject-matter knowledge, and the data was used to test for confounding.

  - Worry B: no incoherence; the analyst is correctly pointing out that the board's estimate is biased.

  - Commitments 1 and 4: they are compatible because the variable was chosen by subject-matter knowledge (1) and then the change-in-estimate (4) was used to confirm it is a confounder. This is valid for risk differences.

  - The numbers were correctly computed.

  Step 12: The single revision that would clean up the most: Correcting the statement in (7). The analyst should clarify that the overall effect (12.5%) is between the two stratum-specific effects (10% and 15%) but that the total number of additional people employed would be 100, which is the sum of the gains in the two strata (60 and 40). Alternatively, they might have meant that the overall effect is bigger than the effect in the lower-need group (which is true) but not bigger than the high-need group. But the phrase "bigger than either" is misleading.

  Therefore, the revision for (7) is the most important.

  Final ranking of issues by severity:

  1. Claim (7) is incorrect if interpreted as the effect size (risk difference) being bigger than both 15% and 10%. This is the most severe because it is a clear error in the report. Cheapest repair: rephrase to say the overall effect is 12.5%, which is positive and substantial, and note that the total number of additional employed persons when extending the program would be 100, which is greater than the gain from either stratum alone (if we only extended to that stratum). But also note that the effect size (12.5%) is the average of the two effects (weighted by the stratum size) and thus lies between them.

  2. No other severe issues. The rest are either correct or the worries are unfounded.

  Contested areas: None of the analyst's commitments are in a contested area in a way that affects this analysis. The use of change-in-estimate for risk differences with pre-assignment covariates is settled as valid.

  Therefore, the main revision is for point (7).
answer: |-
  ### Audit of Statistical Commitments and Worries

  I've audited your commitments, data, and worries by working through the numbers, checking internal consistency, and identifying conflicts. The audit focuses on severity-ranked issues, with explanations of conflicts, necessary concessions, cheapest repairs, and clarification of settled vs. contested points. I verified your data calculations (they are correct) and computed the standardized effect for (7).

  #### **Verified Data and Calculations**
  - **Stratified effects** (as you stated):
    - High-need: RD = 40.0% - 25.0% = **+15.0%** (intensive better)
    - Lower-need: RD = 80.0% - 70.0% = **+10.0%** (intensive better)
  - **Crude effect**: RD = 50.0% - 58.75% = **-8.75%** (intensive worse).
  - **Overall standardized effect** (if everyone gets intensive track):
    - Expected employment under intensive:  
      `(40.0% * 400 + 80.0% * 400) / 800 = 60.0%`  
    - Expected employment under standard:  
      `(25.0% * 400 + 70.0% * 400) / 800 = 47.5%`  
    - **ATE (risk difference) = 60.0% - 47.5% = +12.5%**.  
    This supports your conclusion of a positive effect but **contradicts (7)** (see below).

  ---

  #### **Ranked Issues by Severity**
  **1. Commitment (7) is incorrect and conflicts with the data**  
  - **Conflict**: You claim extending the intensive track yields a payoff "bigger than either stratified figure" (15% or 10%). However:  
    - The ATE is **+12.5%**, which is **less than 15%** (high-need effect) and greater than 10% (lower-need effect).  
    - **Why this is severe**: It misrepresents the data to the board. The ATE (12.5%) is mathematically the weighted average of stratified RDs (since risk differences are collapsible). It cannot exceed the largest stratum-specific effect.  
  - **Cheapest repair**: Revise (7) to:  
    *"Extending the intensive track yields a net benefit of +12.5 percentage points overall. This is larger than the effect in the lower-need group (+10.0%) but smaller than in the high-need group (+15.0%). However, because it benefits both groups, total employment gains would be substantial."*  
  - **Must give up**: The claim that the payoff exceeds *both* stratified effects. The repair costs only a wording change.

  **2. Commitment (4) and (1) superficially conflict but can coexist (low severity)**  
  - **Apparent conflict**: (1) says covariates must be chosen causally (no data snooping), but (4) uses data (change-in-estimate) to confirm confounding.  
  - **Resolution**: No true conflict. (1) governs covariate *selection* (you used domain knowledge: "intake severity" was chosen because assignment depended on it). (4) is a diagnostic *after* selection. This is acceptable if:  
    - You pre-specified "intake severity" as a confounder (per your scheme knowledge).  
    - The change-in-estimate test is supplemental.  
  - **Risk**: If you *only* used the reversal (data) to select "intake severity," this violates (1). But you didn’t—you knew assignment rules.  
  - **Cheapest repair**: Clarify in the report that intake severity was identified *a priori* as a confounder based on program design. The reversal (data) merely confirmed it.  
  - **Settled vs. contested**:  
    - **Settled**: Data-driven covariate selection (post-hoc data snooping) violates causal principles.  
    - **Contested**: Whether change-in-estimate tests are reliable evidence of confounding. Many experts reject them for variable selection, but accept them as diagnostics for pre-specified confounders. Your approach (pre-specify + test) is defensible for risk differences (see below).

  **3. Worry (A) is unfounded (no conflict with (1))**  
  - **Why**: The reversal (Simpson’s paradox) didn’t *tell* you to condition on intake severity; it alerted you to *check* your pre-specified confounder. This is consistent with (1) because:  
    - You already knew intake severity influenced assignment (scheme knowledge).  
    - The reversal was a signal to *test* this variable, not to go hunting for covariates.  
  - **Repair**: None needed. State: "The reversal signaled potential confounding, but intake severity was identified as a confounder based on program rules, not data patterns."

  **4. Worry (B) is incoherent but fixable (low severity)**  
  - **Why**: Saying "no single effect" (relativism) then claiming the board’s number is "flat wrong" *sounds* contradictory. But it’s not:  
    - The board’s crude RD (-8.75%) is confounded (objectively biased).  
    - The ATE (+12.5%) is the correct *population-average effect* for this cohort.  
    - You aren’t being relativist; you’re rejecting a biased estimate in favor of an unbiased one.  
  - **Incoherence**: Your report implies the stratified RDs are the "honest answer," but the ATE is equally valid for the whole population.  
  - **Cheapest repair**: Replace "give them the two stratified figures instead" with:  
    *"The causal effect varies by subgroup: +15.0% for high-need, +10.0% for lower-need. The overall effect (adjusted for intake severity) is +12.5%. The board’s crude comparison (-8.75%) is confounded and should not be used."*  
  - **Key**: The ATE *is* "the effect" for the entire cohort. Stratified effects answer different questions.

  **5. Commitment (3) and (4) are fully consistent (no issue)**  
  - **Why**: Risk differences (RDs) are collapsible, so change-in-estimate tests are valid for confounding diagnosis. If adjustment moves the RD, the crude is confounded (assuming no mediators/colliders). Odds ratios would be problematic here, but you avoided them correctly.  
  - **Settled**: Non-collapsibility of odds/hazard ratios is a mathematical fact, not opinion. Using RDs for binary outcomes is best practice for exactly this reason. No repair needed.

  **6. Commitment (2) and (8) are correct (no issue)**  
  - **Why**: Conditioning on post-assignment variables (e.g., session attendance) blocks mediation paths and biases total effects. Your refusal is sound. Stating the track "only pays off with engagement" is acceptable as a non-causal footnote (if clearly labeled as hypothesis, not evidence).  
  - **Settled**: Total effects require no conditioning on mediators. No repair needed.

  **7. Commitment (5) is misapplied but not harmful**  
  - **Why**: The sure-thing principle ("improves every stratum → improves overall") fails here due to confounding (the crude RD is negative). You used this correctly to *detect* confounding. However, the principle assumes no confounding—it’s not a statistical law.  
  - **Repair**: Reframe as: "Since the effect is positive in all strata, the negative crude effect must stem from confounding." Delete "must have something wrong in it" (the table is correct; the *interpretation* is wrong).

  ---

  #### **The Single Most Valuable Revision**
  **Revise (7) as described in Issue 1**.  
  - **Why**: It’s the only outright error. The ATE (+12.5%) is not bigger than both stratified effects, and misstating this could mislead the board. The repair is cheap (wording change) and prevents reputational damage.  
  - **Bonus**: This revision also partly addresses Worry (B) by clarifying that the ATE is a valid "overall effect."

  ---

  #### **Summary of Settled vs. Contested Disagreements**  
  - **Settled (experts agree)**:  
    - Avoid mediators for total effects (2).  
    - Non-collapsibility makes odds ratios misleading for binary outcomes; RDs are superior (3).  
    - Crude comparisons can be confounded; adjustment requires pre-specified confounders (1).  
    - Your data reversal (Simpson’s paradox) proves confounding exists when effects are directionally inconsistent across strata *and* the confounder is imbalanced.  
  - **Contested (live disagreements)**:  
    - **Change-in-estimate tests (4)**: Some experts view them as valid for RDs (since collapsibility holds); others argue they can miss residual confounding or false positives. Your use is defensible but not universally agreed.  
