answer: |-
  Here are five numbered points presenting your strengthened thesis:

  1.  The Fischer controversy fundamentally concerned conflicting conceptions of state responsibility: the *occurrent* (liability hinges solely on specific, documented decisions during the July/August 1914 crisis) versus the *dispositional* (liability arises from a state's pre-existing, settled aims that rendered war a highly probable outcome, irrespective of their explicit manifestation in crisis decisions).
  2.  Article 231 inherently adopts the dispositional grammar; it holds Germany responsible for "imposing" the war via "aggression" and binds the successor Weimar Republic, demonstrating that the liability attaches not to transient ministers' momentary acts but to the enduring polity defined by its antecedent aggressive aims.
  3.  Fischer's core argument defends this dispositional grammar inherent in Versailles, asserting that Imperial Germany's persistent expansionist aims (*Griff nach der Weltmacht*) structurally caused the war's outbreak, making specific crisis documents secondary to demonstrating this underlying, war-prone disposition.
  4.  Dispositional responsibility is not an unmoored verdict on national character but a rigorous causal claim: it identifies specific, concrete state objectives (e.g., Weltpolitik, Mitteleuropa plans) actively pursued over years that systematically increased systemic tensions and drastically narrowed peaceful options in *any* major crisis, thereby grounding legal liability in demonstrable state policy.
  5.  While all 1914 powers held aims affecting the war's likelihood, the dispositional grammar is not promiscuous; it crucially distinguishes between inherently stabilizing defensive aims and inherently destabilizing, revisionist, hegemonic aims like Germany's, which uniquely necessitated overturning the continental status quo through force.
