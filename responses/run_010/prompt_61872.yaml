answer: |-
  ## The Token Room (after Berkeley)

  *[Epigraph from "The Digital Payments Act (Pilot)":  
  To test the means of common obligation]*  

  1.  
  When laborers coax the soil to yield its grain,  
  Is money in the earth or in the rain?  

  2.  
  If wealth is built by hand and mind applied,  
  Can metal discs hold power they don't provide?  

  3.  
  Does paper, stamped with numbers and a face,  
  Create the cloth, the kiln, the market place?  

  4.  
  Or does its worth emerge where many meet,  
  Accepting tokens in the public street?  

  5.  
  When trust resides in mark and registry,  
  Must gold back pixels in a treasury?  

  6.  
  A sign points home but isn't brick or door –  
  Does money signify, resemble, more?  

  7.  
  If notes fly fast from pocket into pay,  
  Does less achieve what greater sums convey?  

  8.  
  When coins lie sleeping, idle in a chest,  
  What common benefit can they attest?  

  9.  
  And if a token, swift and sure in trade,  
  Gets hoarded deep in choices people made –  

  10.  
  If held unspent, though sound and fully backed,  
  Does its true function become stalled, intact?  

  11.  
  Does its command of goods stay sharp and clear,  
  While doing nothing, year on stagnant year?  

  12.  
  **If issuers grant this token life by fiat,  
  What duty follows from its state and weight?**  
  *(slant rhyme: fiat/weight)*  

  13.  
  Must they ensure its current never fails,  
  Lest public trust, like brittle glass, impales?  

  14.  
  If private tokens, pegged and widely held,  
  Grow vast reserves that commerce never melds –  

  15.  
  If issuers may adjust the tokens' count,  
  Is this not risk the public must discount?  

  16.  
  Yet could such holdings serve a latent need,  
  A hedge against some unforeseen stampede?  

  17.  
  Or does the vaulted token, cold and still,  
  Deny the purpose it was meant to fill?  

  18.  
  When tokens rest as if in sacred trust,  
  Though backed by law, are they not bankrupt dust?  

  ---

  **Notes on Meeting Requirements:**

  1.  **Form:** 18 queries, each a single couplet in iambic pentameter. Numbers printed as requested. One slant rhyme ("fiat/weight") at the pivot between description of money (queries 1-11) and issuer duties (12-18).
  2.  **Method:** Queries 3-8 form the strict chain leading to the functionalist thesis (money as facilitator, not wealth itself; value by consent/signification; velocity's equivalence). Answering "No" to 3, "No" to 4 leads to "Yes" for 5 (consent/sign), then "Yes" to 7 (velocity), reinforcing "No" to 8 (idle money useless), establishing the core Berkeleyan view.
  3.  **Content Survived:** Money ≠ wealth (1-2, 3). Token value by authority/consent (4-5). Velocity principle (7). Hoarded token problem (9-11, 17-18). Alciphron resonance in query 6 (signification without resemblance).
  4.  **Complications:** Queries 16 ("Could such holdings serve...") and 14/15 ("If private tokens..."/"If issuers...") invite "No" answers, breaking catechism. Query 15 ("Is this not risk the public must discount?") concedes a real charge to the payments industry regarding issuer power.
  5.  **The Ending:** Query 18 lands squarely on the paradox of the perfectly sound, perfectly held, unspent token – it commands property but fails Berkeley's functional definition of money as motion. It's unanswerable within his theory.
  6.  **Prohibitions:** Contemporary vocabulary. No Berkeleyan period examples/contempt. No footnotes/sources. Epigraph invented from a fictional enabling instrument ("Digital Payments Act"), declarative but not stating the thesis.
  7.  **Success Criteria:**
      *   **Historian:** Recognizes Berkeley's core arguments (functionalism, token theory, velocity, critique of hoarding) transposed to digital context.
      *   **Unfamiliar Listener:** Hears a clear arc: What is money? -> How does it work? -> What happens when it stops? -> Who is responsible? -> The paradox of stillness.
      *   **Gallery Audience:** No line dictates thought; questions probe assumptions of economists (function), payments industry (issuance/risk), and public (holding/spending). The argument emerges through the sequence of questions. The hinge (query 12) is marked audibly by the slant rhyme.
