prompt: |-
  You're a philosopher who works on the ethics of influence for a living — advertising, nudges, fundraising, consent — but please answer me like a person, not like a textbook. Think it over before you write. I'd like you to start by jotting two or three candidate diagnoses of what might be wrong with what I'm doing, kill the ones that don't fit the details, and then commit to the one that does.

  Here's the situation. I run donor relations for a mid-size food bank. About two years ago we started segmenting our mail list using life-event data we buy from a broker — we can tell who's recently been widowed, who just had a baby, whose foreclosure got filed. Our widowed segment responds at roughly three times our average rate. We time the appeal to somewhere in that first-year window and we write the letter in a register that mirrors what we assume their weeks look like. It works really well.

  Nobody is being tricked. The data purchase is spelled out in our privacy policy in plain English. I stood up at our donor appreciation night last spring and explained the whole program, with a slide, and people applauded. One woman who's given to us for 20 years pulled me aside afterward and asked me to make sure she stays on the list for the bereavement letter, because she said getting it was the first thing that made her feel noticed after her husband died. So: transparent, consented to, and at least one recipient says it helps her.

  My own rule all along has been, dont do to a donor anything you'd resent them doing to you if you knew exactly how it worked. By that rule I come out clean, and I've been sleeping fine.

  Then in the fall our org backed a ballot measure on a local hunger benefit, and I ran the same segments, the same timing, and honestly almost the same letter, just with the ask swapped. Identical machinery. And I felt physically sick about it in a way I never have about the food bank appeals. I've spent three months trying to find the difference and everything I come up with sounds like squeamishness about politics.

  Two people have weighed in. My deputy director says I'm clean on both counts: no lies, no pressure, one-click unsubscribe, and all we're doing is helping people notice a reason they already had. Her worry is that if my version of the objection works, it takes down all emotional fundraising and we close within a year. Our board chair says the food bank version is gross too, on the grounds that a gift gotten that way isn't really the donor's gift — it's ours, made with her hand.

  So: is there a real line between what I do and what any competent fundraiser does, or am I just queasy about being effective? And is my gut reaction to the ballot measure tracking something, or is it noise? I don't want a compliance checklist or a list of donor-relations best practices.

  Tell me what would change your mind: which detail above, filled in differently, would flip your verdict in either direction, and where you think your own reasoning here is most likely to break down.
reasoning: |-
  Okay, the user is a donor relations manager at a food bank who uses life-event data to target fundraising appeals, particularly to the recently widowed, with great success. They've been transparent about it, even getting applause and a request to stay on the bereavement list. But when they used the same approach for a political ballot measure, it made them physically sick. They want to know if there's a real ethical difference or if it's just squeamishness about politics.

  First, I need to understand why the political use feels different. The user mentions transparency and consent are in place for both cases. The widow even found comfort in the food bank letter. So why the gut reaction? 

  The board chair's point about the gift not truly being the donor's is interesting. But the user's rule of "don't do anything you'd resent if done to you" seems satisfied. The deputy director argues it's just highlighting existing reasons to donate. But the user's discomfort with the political use suggests something deeper.

  Hmm. Maybe the difference lies in the nature of the cause. The food bank provides immediate, tangible help—food for the hungry. The ballot measure is political, involving policy change, which is more abstract and contested. Exploiting grief to influence votes feels icky because politics is about values and beliefs, not just charity. 

  Another angle: vulnerability. Grief makes people more susceptible to influence. For the food bank, that vulnerability is channeled into a universally positive act (feeding people). But directing that same vulnerability toward a political outcome might feel manipulative because politics involves taking sides. 

  Also, consent. Even though both uses have the same transparency, donors might expect their data to be used for charitable appeals, not political campaigns. The privacy policy might cover it, but is that genuine informed consent? The widow wanted the bereavement letter for the food bank, but would she want it for a political ad?

  The user’s own rule might need refining. Would they resent being targeted politically during grief? Their gut reaction suggests yes. But for charity, they might not mind. So the context matters. 

  What would change my mind? If the ballot measure was non-controversial, like universally supported hunger relief without political baggage, then maybe it's similar to the food bank. But if it's partisan, that intensifies the ethical issue. Also, if the data included more sensitive info, like health crises, that might heighten the exploitation concern. 

  The deputy director’s point about emotional fundraising collapsing if this is unethical is valid, but it shouldn't deter ethical scrutiny. Maybe the line is about the cause's nature and the donor's intent. People donate to alleviate suffering directly with charity, but political advocacy is different. 

  The user’s gut reaction tracks something real—using profound vulnerability for political gain feels exploitative, even with transparency. The food bank’s work feels like meeting a need, while the ballot measure feels like leveraging pain for influence in a contested space. That’s the core difference.
answer: |-
  Your discomfort isn't squeamishness—it's your ethical intuition flagging a fundamental difference between charitable giving and political advocacy, even when using identical tactics. After sitting with this, here’s how I’d diagnose it:

  **Candidate Diagnoses**  
  1.  **Exploiting Vulnerability for Contested Ends**: Using grief to drive charity (tangible relief) vs. politics (abstract, contested power shifts) feels distinct because one meets a need *in* vulnerability, while the other weaponizes vulnerability *for* leverage.  
  2.  **Consent Mismatch**: Transparency about data use ≠ consent for *all contexts*. Donors consent to "helping the hungry," not "shaping policy."  
  3.  **Corruption of the 'Gift'**: Your board chair is half-right—but the issue isn’t authenticity of the gift. It’s about *instrumentalizing* profound emotional states for institutional goals beyond their original scope.  

  **Killing the Weak Diagnoses**  
  - **Consent Mismatch** falters: Your privacy policy likely covers "fundraising," and the ballot measure *is* hunger-related. If policy allows political advocacy, this isn’t a technical breach.  
  - **Corruption of the Gift** is poetic but vague. The widow *did* authentically want to give. The act itself isn’t inherently corrupted.  

  **The Core Issue: Vulnerability and Contextual Integrity**  
  **What’s wrong with the ballot measure use?**  
  You’re leveraging acute grief—a state that impairs autonomy—to influence *political agency*. The food bank appeal meets a need *within* the vulnerability (e.g., "Your grief connects you to others’ suffering—ease it by feeding them"). The political appeal hijacks that vulnerability to serve *your org’s agenda*, not the donor’s immediate emotional or moral need. Even if the policy helps the hungry, voting is a civic act requiring clear judgment, not raw empathy.  

  **Why your gut churned**:  
  - **Charity** = Channeling emotion toward direct relief. Aligns with the donor’s state ("I feel broken; help me heal by helping").  
  - **Politics** = Co-opting emotion for indirect, contested outcomes. Feels like manipulating their pain to serve *your* cause ("Your grief makes you suggestible—vote how we want").  

  **What would change my mind?**  
  - If the ballot measure was *uncontroversial* (e.g., "Fund school lunches—yes/no?" with 90% support), the exploitation concern softens. But policy is inherently debatable, and grief clouds debate.  
  - If the widow had said, *"Use my grief to push policy—it gives me purpose,"* I’d reconsider. But she didn’t. She sought *connection*, not influence.  

  **Where my reasoning could break down**:  
  I’m leaning hard on "grief impairs political autonomy." But if grief *enhances* moral clarity (e.g., "Death made me see hunger’s urgency—let me vote accordingly"), exploiting it might be *more* ethical. Yet evidence suggests acute grief clouds complex judgment—and you sensed that.  

  **Your deputy director’s fear is valid but misguided**:  
  Yes, banning emotional fundraising would cripple nonprofits. But the line isn’t "emotion vs. logic"—it’s **"Does this use respect the donor’s state, or exploit it for alien ends?"** Bereavement letters for charity? Arguably yes. For lobbying? That’s where you crossed your own Rubicon.  

  **Final thought**: Your rule—*"Don’t do to donors what you’d resent"*—is golden. Would you resent a group using your rawest grief to advance *their* political fight, even if you agreed with it? If yes, you’ve got your answer. Trust that nausea. It’s not politics—it’s respect for human fragility.
