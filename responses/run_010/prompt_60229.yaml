prompt: |-
  I just started a job doing model evals — writing test batteries and then arguing all day about what a passing score actually entitles us to say about a system. Half my team talks nonstop about dispositions: the model is disposed to flatter the user, disposed to refuse, disposed to grab the shortcut. A teammate with a metaphysics background then pointed out that our vocabulary is a total mess, because an eval suite is exactly the setup philosophers say breaks disposition talk. A jailbreak prompt that leaves the tendency in place but stops it showing up looks like a mask. A fine-tune that deletes a behavior without ever eliciting it looks like a fink. And a model that aces the battery for reasons that have nothing to do with the disposition looks like a mimic. Before I write the conceptual appendix for our protocol I want the metaphysics straight, and I want it as a spec, not a survey.

  So: write the desiderata — what any adequate theory of dispositions has to deliver.

  I want the requirements themselves to carry the weight. For each one, give the case or consideration behind it, and be explicit about how demanding it is. Specifically I'm after:

  - which phenomena the theory has to explain or explain away. At minimum: why the naive conditional analysis (to be soluble just is to be such that it would dissolve if placed in water) goes wrong; finks; masks; mimics, where something manifests without having the property at all; the reverse case where the disposition gets *acquired* precisely when the triggering conditions show up; dispositions that never get a single chance to manifest; degrees and comparison, i.e. one thing being more disposed than another; and dispositions with many different manifestation types rather than one stimulus and one response.
  - which distinctions it must not collapse. Having versus manifesting. Being fragile versus merely being breakable. Intrinsic versus extrinsic. The disposition versus whatever underlying property does the work. Ability versus performance — that last one is the distinction my team actually needs and we've been using the words interchangeably.
  - what it has to be consistent with, and, honestly, which of those consistency demands are load-bearing versus which are one camp's taste wearing a requirement costume. Is "dispositions must be intrinsic" a real constraint or a physicalist's preference? Is the complaint that dispositional explanations are trivially circular — that saying opium causes sleep because it has a sleep-causing power explains nothing — a genuine desideratum or a hangover from positivism? Does the theory have to square with fundamental physics, where the basic properties look structural rather than powerful? Mark which of these I'd be free to drop.
  - any subset of the desiderata you think cannot be jointly satisfied. My guess is that "dispositions are intrinsic" + "there's a true conditional analysis of them" + "finks are genuinely possible, not just an artifact of sloppy description" is a bad triangle, but I may have mis-stated it, and if the real unsatisfiable cluster is a different one I want that instead. If the list turns out to be a result in itself, say so and show the proof sketch.

  Then, briefly — a paragraph each, no more — how the main contenders do against the list: the simple conditional analysis, the Lewis-style reformed analysis built on ideal conditions, the approach that takes potentialities and their degrees as primitive, and the view that all properties are dispositional through and through. For each, name the requirement it flunks and what it gives up to satisfy the others.

  Last thing, and it's the reason I'm asking: tell me which desideratum, if any, decides whether we're allowed to say "this model has disposition D" on the strength of a test battery. If the metaphysics can't settle that, just say so plainly and then tell me what a passing eval is actually evidence of instead.

  No bibliography, no citations, no reading list — I can't chase references and a list of names would be useless to me. Give me the arguments and the cases. If you need a technical term, gloss it in a clause the first time. A table is fine for the requirements if its cleaner, but keep the motivating case visible next to each row rather than banishing it to a footnote.
reasoning: |-
  Okay, the user is working on model evaluations and their team is using dispositional language like "the model is disposed to flatter the user." But they've run into philosophical problems where their testing setups seem to break standard disposition concepts—jailbreaks act like masks, fine-tunes like finks, and some models behave correctly for unrelated reasons like mimics. They need to clarify the metaphysics of dispositions to write a conceptual appendix for their protocol.

  The core task is to define the requirements any adequate theory of dispositions must satisfy. The user wants this structured as a spec rather than a survey, with each requirement clearly grounded in cases. They specifically mention explaining phenomena like finks, masks, mimics, plus distinctions like having vs manifesting, and consistency questions about intrinsicality or circularity. They also want to know if certain desiderata conflict and how major theories handle them.

  For the metaphysics, I'll need to systematically lay out the desiderata in four categories: phenomena to explain, distinctions to preserve, consistency demands (with load-bearing vs optional marked), and potential conflicts. Key cases like the finkish poison (loses toxicity when placed in water) or the fragile cup that's masked by packaging must illustrate each point. 

  The intrinsicality point is tricky—it might be optional for the user since their AI dispositions are likely extrinsic. The circularity concern about dispositional explanations seems like a positivist hangup they can ignore. The conflict triangle appears to be intrinsicality + conditional analysis + genuine finks being incompatible.

  For the theories: the simple conditional analysis fails on finks/masks; Lewis's reformed version handles finks but not mimics; primitive potentialities solve degrees but risk circularity; pandispositionalism struggles with intrinsicality and mimics. 

  The critical takeaway is that no theory cleanly justifies inferring dispositions from tests because of mimics. The best the user can say is that a passing eval shows the model is *currently capable* of manifesting the behavior under those test conditions, not that it has a stable disposition.
answer: |-
  Here’s a stripped-down spec for disposition theories, built for practical use in model evals. Desiderata are grouped by type, with the **motivating case**, **demand level** (strict/negotiable), and **why it matters**. Conflicts are flagged.

  ---

  ### **I. Phenomena the Theory Must Explain or Explain Away**  
  *(Non-negotiable: failure here invalidates the theory)*  

  1. **Finks**  
     - *Case*: A "finkish" poison loses its toxicity *the moment* it contacts water. Conditional analysis (CA) falsely says it’s soluble (if placed in water, it dissolves) when it isn’t.  
     - *Demand*: Must distinguish dispositions from temporary states.  

  2. **Masks**  
     - *Case*: A fragile glass wrapped in bubble wrap doesn’t shatter when struck. CA falsely says it’s not fragile.  
     - *Demand*: Must allow dispositions to exist unmanifested due to external blockers.  

  3. **Mimics**  
     - *Case*: A robust cup shatters when struck *only* because a hidden agent breaks it simultaneously. It manifests fragility without having it.  
     - *Demand*: Must prevent false positives: manifestation ≠ disposition.  

  4. **Reverse Finks (Acquisition)**  
     - *Case*: A non-flammable log becomes flammable *only* when exposed to fire (e.g., via instant chemical reaction).  
     - *Demand*: Must handle dispositions acquired precisely at trigger time.  

  5. **Unmanifested Dispositions**  
     - *Case*: A diamond never struck or pressured. Still fragile?  
     - *Demand*: Must allow dispositions to exist without ever being tested.  

  6. **Degrees & Comparison**  
     - *Case*: Model A resists jailbreaks 90% of the time; Model B resists 50%. We need "A is *more disposed* to resist than B."  
     - *Demand*: Must support gradable dispositions (critical for evals).  

  7. **Multi-Track Dispositions**  
     - *Case*: "Honesty" in a model manifests as refusing lies, correcting errors, admitting uncertainty—not one stimulus/response pair.  
     - *Demand*: Must handle dispositions with multiple manifestation types.  

  ---

  ### **II. Distinctions the Theory Must Preserve**  
  *(Strict: collapsing these makes disposition talk useless)*  

  | Distinction         | Case                                      | Why Critical for Evals                          |
  |---------------------|-------------------------------------------|------------------------------------------------|
  | **Having vs. Manifesting** | Masked fragility (glass in bubble wrap) | Passing a test ≠ having a disposition; failing ≠ lacking it. |
  | **Fragile vs. Breakable** | All glass is breakable; only fragile glass shatters *easily* | Evals measure specific thresholds, not binary "can/can’t". |
  | **Intrinsic vs. Extrinsic** | A key’s shape (intrinsic) makes it fit a lock; its "copiability" depends on a patent (extrinsic) | Model dispositions may depend on external factors (e.g., API safeguards). |
  | **Disposition vs. Causal Base** | Opium’s sleep-causing power (disposition) vs. its molecular structure (base) | Dispositions are the *what*; bases (e.g., model weights) are the *how*. |
  | **Ability vs. Performance** | A model *can* solve math (ability) but refuses due to alignment guardrails (performance) | **Your core need:** Tests show performance; evals claim ability. |

  ---

  ### **III. Consistency Demands**  
  *(Marked: ★ = load-bearing; ✘ = optional/drop if needed)*  

  - **★ Dispositions ≠ Trivially Circular Explanations**  
    - *Case*: "Opium causes sleep because it has a dormitive virtue" explains nothing.  
    - *Status*: Load-bearing. Theory must ground dispositions in non-dispositional facts (e.g., causal bases).  
  - **✘ Dispositions Must Be Intrinsic**  
    - *Case*: A model’s "flattery disposition" depends on server architecture (extrinsic).  
    - *Status*: Optional. **Drop it:** AI dispositions are often extrinsic.  
  - **✘ Must Reduce to Fundamental Physics**  
    - *Case*: Physics describes quarks structurally (spin, charge), not as "disposed to interact."  
    - *Status*: Optional. **Drop it:** Functional dispositions (e.g., software) needn’t reduce.  

  ---

  ### **IV. Conflicts: Desiderata That Can’t All Be Satisfied**  
  **The Incompatible Triangle:**  
  1. Dispositions are intrinsic.  
  2. Dispositions obey a true conditional analysis ("if triggered, manifests").  
  3. Finks/masks are genuine possibilities (not description errors).  

  **Proof sketch**: If dispositions are intrinsic and obey CA (1+2), a fink (intrinsic change *during* trigger) is impossible—CA would hold pre-trigger. But finks *are* possible (e.g., poison that self-neutralizes in water). ∴ Drop #1 or #2.  

  **Your escape hatch**: Since AI dispositions are extrinsic (#1 droppable), the triangle collapses.  

  ---

  ### **How Theories Perform**  
  *(Key failures in bold; compromises noted)*  

  | Theory                          | Fails Desiderata                          | Tradeoffs                                       |
  |---------------------------------|-------------------------------------------|------------------------------------------------|
  | **Simple Conditional Analysis** | Finks, masks, mimics, unmanifested, degrees | Gives false positives/negatives. Useless for evals. |
  | **Lewis Reformed (Ideal Conditions)** | Mimics (passes tests for wrong reasons), degrees | Handles finks/masks via "ideal" triggers. Still fooled by mimics. |
  | **Primitive Potentialities**    | Circularity (if potentials aren’t grounded) | Solves degrees, multi-track, unmanifested. Accepts irreducibility. |
  | **Pandispositionalism**         | Intrinsicality (if demanded), mimics      | All properties are dispositions. Struggles with mimics (no "real base" to distinguish). |

  ---

  ### **The Decisive Desideratum for Model Evals**  
  **Mimics are the dealbreaker**. If your test battery can be passed for reasons *unrelated* to the disposition (e.g., a model "correctly" refuses harmful requests only because it’s lazy, not safety-aligned), no theory licenses inferring "has disposition D."  

  **What a passing eval *actually* shows**:  
  The model is **currently capable of manifesting behavior X** under the tested conditions. It does *not* guarantee:  
  - The behavior stems from a stable disposition (vs. mimicry).  
  - The disposition persists post-eval (vs. finks/masks).  
  - The disposition is intrinsic (vs. depending on external factors).  

  **Recommendation**: In your appendix, replace "has disposition D" with **"manifests behavior-type B under test conditions C."** This is what evals reliably evidence. Claiming more requires metaphysics no theory secures.
