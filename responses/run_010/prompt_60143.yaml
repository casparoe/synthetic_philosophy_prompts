answer: |-
  ### Analysis of the Phillips Curve Episode through the Lens of the F-Twist  

  #### 1. **Mapping Idealizations and the Benign/Self-Consuming Distinction**  
  **Principal Idealizations in Successive Versions:**  
  - **Original Phillips Curve (1958):**  
    - *False but initially inert:* Fixed inflation expectations; homogeneous labor markets; no supply shocks; closed economy.  
    - *Load-bearing:* Inverse trade-off assumes *ceteris paribus* conditions (e.g., static expectations).  
  - **Samuelson-Solow (1960) Policy Menu:**  
    - *False but initially inert:* Stable, exploitable trade-off; policymakers can permanently lower unemployment via inflation; no expectations adjustment.  
    - *Load-bearing:* Assumption that inflation expectations are static (not adaptive).  
  - **Friedman-Phelps (1967) Natural Rate Hypothesis:**  
    - *False but inert:* "Adaptive expectations" (slow, backward-looking adjustment); "natural rate" is stable; money illusion persists short-term.  
    - *Load-bearing:* Expectations adjust to actual inflation; long-run vertical Phillips curve.  

  **Benign vs. Self-Consuming Idealizations:**  
  - **Benign idealization:** An assumption false but predictively irrelevant (e.g., assuming firms maximize profits perfectly). Harmless if predictions hold.  
  - **Self-consuming idealization:** An assumption that holds *only* when the model is not used as a policy tool. When adopted, it alters behavior, invalidating itself.  
    - *Phillips curve collapse as paradigm case:* The assumption of static expectations was benign while the curve was descriptive (1861–1957, 1960s). Once policymakers *acted* on the trade-off (e.g., tolerating inflation for lower unemployment in the 1960s), expectations adapted, making the assumption causally false. The model’s adoption destroyed its predictive validity.  

  **Coherence of the F-Twist for Self-Consuming Theories:**  
  The F-twist struggles here. Friedman’s thesis judges theories *solely* by predictive success, but self-consuming theories generate unstable predictions: success pre-policy adoption guarantees failure post-adoption. The F-twist cannot coherently evaluate such theories because "predictive success" is context-dependent on the theory’s own use.  

  #### 2. **What Counts as "The Predictions"?**  
  - **Original curve (1861–1957):** Strong in-sample fit, but this is irrelevant per F-twist (historical data may reflect unique conditions).  
  - **1960s out-of-sample performance:** Initially successful predictions, but this tested the model *before* policy exploitation, missing self-consumption.  
  - **Natural-rate hypothesis:** Correctly predicted 1970s stagflation (high inflation + unemployment) when expectations adjusted. This is the F-twist’s ideal: an implausible assumption (adaptive expectations) yielded superior predictions.  

  **Lucas Critique (1976) as a Refinement *and* Restriction:**  
  Lucas attacked Friedman’s adaptive expectations as insufficiently micro-founded, arguing that *any* policy-invariant behavioral equation (like Phillips curve) is flawed if agents form rational expectations. This:  
  - *Refines* the F-twist by emphasizing that assumptions must be "deep parameters" (invariant to policy).  
  - *Restricts* the F-twist’s domain: Theories with non-micro-founded assumptions are vulnerable to self-consumption.  
  - *Refutes* the F-twist only partially: Lucas agrees predictive success is paramount but insists assumptions must be structurally realistic to avoid self-consumption.  

  #### 3. **Verdict: Confirmation and Failure Mode**  
  **Confirmation of F-Twist:**  
  - The Phillips curve was instrumentally successful until the 1960s despite unrealistic assumptions (static expectations).  
  - Friedman’s model (with its own unrealistic adaptive expectations) *predicted better*, displacing it. Complaints about realism (e.g., "Do workers *really* have money illusion?") were rightly ignored per F-twist.  

  **Failure Mode Exposed:**  
  - The theory was undone not by "messy reality" but by *reflexivity*: policymakers internalized the model, altering expectations and invalidating it. The F-twist never anticipated theories that induce their own falsification.  
  - **Volcker Credibility Dispute:** The F-twist is silent here. Economists disagreed on the "relevant prediction":  
    - Friedmanites: Predicted high "sacrifice ratio" (output loss per inflation reduction).  
    - Rational expectations critics: Credible announcements could lower sacrifice ratios via immediate expectations adjustment.  
    With no consensus on the counterfactual (What *would* inflation have been without Volcker?), the F-twist cannot judge which model predicted better.  

  ### Where the Lens Does Not Reach  
  - **Historical Contingency:** The "policy menu" interpretation of Samuelson-Solow is disputed. Some historians argue they warned against exploitation, complicating the narrative of naive adoption.  
  - **Lucas Critique Scope:** Whether rational expectations models truly avoid self-consumption (e.g., if agents learn the model) remains debated.  
  - **Volcker Epilogue:** The unresolved sacrifice ratio dispute highlights the F-twist’s limitation when predictions depend on unobservable expectations shifts.  

  ### Conclusion  
  The Phillips curve saga *both* confirms and undermines the F-twist:  
  - It validates instrumentalism (predictive success trumped realism in theory succession).  
  - Yet it exposes a fatal flaw: Theories vulnerable to reflexivity (self-consumption) evade the F-twist’s criterion, as their predictions are unstable under adoption.  
  The F-twist remains useful for evaluating *non-reflexive* theories but falters when the map (theory) changes the territory (economy). The Lucas critique refines it by demanding micro-foundations to mitigate this risk, but the Volcker dispute shows that predictive tests can remain inconclusive when expectations are unobservable. Ultimately, the episode reveals that economics cannot escape the loop where successful theories alter the behavior they describe.
