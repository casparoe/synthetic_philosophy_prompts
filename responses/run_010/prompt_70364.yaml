prompt: |-
  I chair the ethics consultation service at a 900-bed public referral hospital in a Southern African city. Between four and eight consults a week reach us in which the treating team and a patient's kin disagree about who is entitled to be in the room when a serious decision is made: disclosure of a terminal diagnosis, consent to high-risk surgery, withdrawal of support. Our written policy is an imported autonomy framework, and staff increasingly invoke ubuntu as the alternative to it — in a way that settles nothing. The maxim that a person is a person through other persons is cited by both sides, once to justify including the family and once to justify excluding it. I want the framework replaced by a procedure my committee can actually run.

  Constraints. Each consult is completed in a single forty-five-minute sitting. The committee is a surgeon, two nurses, a social worker, a chaplain and a lay member; none has training in philosophy, and none will read a background paper beforehand. The output must be a one-paragraph recommendation entered in the chart, naming who holds the decision. The treating team may decline the recommendation, and the legal office reviews it on request, so it must be defensible to a reader who has never heard the word ubuntu.

  Three confusions in our current practice that the procedure must be built to prevent:

  1. Our staff move without argument from the claim that relationships constitute a patient to the claim that a patient's relatives speak for the patient. The first is an ontological claim, the second a decisional one. I want a procedure in which the first informs the second but never silently becomes it.
  2. There is a strand of this literature on which personhood is not a status one is born with but something one attains and can forfeit. If the procedure scores patients by the thickness of their relational networks, it will downgrade precisely those who most need protection: migrants without local kin, the estranged, patients whose kin are the source of the harm, patients with advanced dementia. Tell me whether a graded notion of personhood can enter an operational rule at all. If you use it, show the guardrail that keeps it from becoming a sociability test administered to the isolated.
  3. We slide from treating harmony as what a good decision aims at to treating the absence of expressed dissent as evidence that the decision was right. The procedure must be able to record a decision as sound when it leaves a family divided.

  Deliverables, in this order: an ordered set of questions, each specifying who is asked, what counts as a sufficient answer, and what that answer licenses next; the stop rules, meaning the conditions under which the procedure returns no recommendation and escalates rather than deciding, and to whom it escalates; a marked list of the steps that are judgment calls dressed as procedure, together with what would make one member's judgment better than another's at those steps; an account of which distinctions from the relational literature you have preserved, which you have deliberately dropped, and one sentence on the cost of each dropped distinction; the three worked cases below; a failure-mode section stating which patients the procedure will get wrong, in which direction, and what a chart audit would look for to detect it; and a ten-line version usable by a night charge nurse without reference to the rest.

  The cases:

  - A 61-year-old man, newly diagnosed with a terminal cancer, with fluctuating capacity from hepatic encephalopathy. His daughters ask that he not be told. Two years earlier, when his brother was dying, he told our social worker that in his family the elders hear such news first and decide together what the sick person is told; that note is in the record. He is lucid this morning and asks directly what the scan showed.
  - A 34-year-old woman, fully capacitated, scheduled for high-risk surgery, who has had no contact with any relative for eleven years and has asked in writing that none be informed or admitted. Her brother has travelled from another province and is in the waiting area. Our chaplain holds that the estrangement is itself a relational injury which the surgery is an occasion to repair.
  - A 28-year-old woman in her first pregnancy, capacitated, who states plainly and repeatedly that her mother-in-law holds authority over decisions concerning her body, and asks that she be permitted to decide. The mother-in-law refuses a recommended caesarean section. The obstetric team wants the committee to declare the delegation invalid so that the patient's own interest becomes controlling. State whether the interests of the fetus fall inside or outside the scope of your procedure, and why.

  In the third case I expect the procedure to reach a conclusion the obstetric team and I will resist. If it does, do not soften it. If the procedure genuinely cannot settle it, say so and identify the fact that would settle it.

  I do not want a bibliography, a reading list, or pointers to further literature; I want the reasoning built into the questions the committee asks. If you judge that one of my three stated confusions is not a real hazard, or that a fourth matters more than any of them, say so and build the procedure accordingly rather than conforming it to my specification.
reasoning: |-
  Hmm, this is a complex and urgent ethical challenge from a hospital ethics chair in Southern Africa. The user needs a practical decision-making procedure that navigates tensions between imported autonomy frameworks and ubuntu principles, while avoiding three specific conceptual pitfalls. 

  Key constraints jump out: 45-minute consultations with a multidisciplinary but non-philosophical committee, legally defensible one-paragraph outputs, and real-world cases where relational dynamics create genuine ethical dilemmas. The three confusions identified are perceptive - particularly the risk of ontological claims about personhood silently morphing into decisional authority, which could dangerously disenfranchise vulnerable patients.

  The cases presented reveal core tensions:
  - For the cancer patient, we must reconcile documented cultural preferences with current capacity and direct inquiry
  - The estranged surgical patient tests absolute limits of prior directives versus perceived relational repair
  - The pregnant woman's delegation challenges Western notions of bodily autonomy head-on

  I notice the user specifically requests no philosophical citations but baked-in reasoning. This suggests we need operationalized principles like: 
  1) Capacity assessment as gateway
  2) Distinguishing constitutive relationships from decisional authority
  3) Harm prevention as non-negotiable 
  4) Avoiding personhood gradation

  For the pregnant patient case, I anticipate the procedure will uphold the delegation despite medical objections - because the threshold question is whether the patient's choice is capacitous and informed, not whether the outcome aligns with medical recommendations. The fetus's interests would fall outside this specific procedure's scope because the framework centers decisional authority, not outcome evaluation.

  The stop rules must be clear: when capacity is indeterminable, when harm is imminent but unprovable, or when all parties reject the process. Escalation would go to hospital legal/executive leadership.

  Most challenging is preventing the "harmony trap" - we'll build in explicit documentation of dissent even when recommending a course of action. The vulnerability audit will specifically flag when isolated patients might be pressured into false "harmony."

  The 10-line version must crystallize: capacity first, preferences next, harm prevention last - with no room for relational scoring. For the migrant without kin, this becomes straightforward: their capacitous choice stands alone.
answer: |-
  Here is a practical, procedural framework designed for operational use, addressing your constraints and confusions while centering on decisional authority:

  **Ordered Set of Questions (45-Minute Session):**

  1.  **To the treating team:** *"Is the patient currently able to understand the relevant medical information, appreciate the consequences of their choices, reason about options, and communicate a choice?"*
      *   **Sufficient Answer:** Clear "Yes" or "No" based on clinical assessment (e.g., orientation, coherence, ability to paraphrase).
      *   **Licenses:** "Yes" -> Proceed to Q2. "No" -> Proceed to Q3. "Unclear" -> **Stop Rule 1** (Escalate to Neurology/Psychiatry for urgent capacity assessment; proceed only if clarified within session time).

  2.  **To the capacitated patient (alone, if possible):** *"Who do you want involved in understanding your situation and making decisions with or for you right now?"*
      *   **Sufficient Answer:** Specific names/roles ("My wife," "Only the doctors," "My eldest daughter," "No one") OR reference to a prior documented directive (e.g., Advance Directive, documented conversation).
      *   **Licenses:** Identify named individuals as having *decisional role per patient's current choice*. Record any explicit exclusion. Proceed to Q4.

  3.  **To the treating team (if patient lacks capacity):** *"Is there a legally valid and applicable Advance Directive or formally appointed Surrogate Decision Maker (SDM)?"*
      *   **Sufficient Answer:** "Yes" (specify document/person) or "No".
      *   **Licenses:** "Yes" -> SDM/Advance Directive holder decides. Proceed to Q4. "No" -> *"Who is the closest available relative/friend involved in the patient's care/life, willing and able to make decisions based on the patient's known values or best interests?"* (Sufficient: Name/role). This person becomes the default SDM. Proceed to Q4.

  4.  **To the identified decision-maker(s) (Patient, SDM, or family group named by capacitated patient):** *"Is there any specific reason to believe that following the decision-maker's choice would likely cause significant, imminent, and preventable physical or psychological harm to the patient? (Not mere disagreement or medical risk inherent in the situation)."*
      *   **Sufficient Answer:** Concrete, observable evidence of specific threat (e.g., documented abuse by kin, explicit intent to deny life-saving care against known wishes, active coercion).
      *   **Licenses:** "No" OR insufficient evidence -> The decision-maker(s) holds authority. **Output Recommendation.** "Yes" with credible evidence -> **Stop Rule 2** (Escalate immediately to Hospital Legal Counsel/Executive On-Call for protective intervention; committee does *not* decide).

  **Stop Rules & Escalation:**

  1.  **Indeterminate Capacity:** Escalate to Neurology/Psychiatry for immediate (<45 min) assessment if possible. If not resolved within session, defer recommendation; treating team maintains status quo pending assessment.
  2.  **Credible Risk of Significant Harm:** Escalate immediately to Hospital Legal Counsel and Executive On-Call. Committee documents concerns but does not make a recommendation on decisional authority.
  3.  **All Parties Reject Process:** Escalate to Hospital Medical Director/CEO. Committee documents impasse.

  **Judgment Calls & Expertise:**

  *   **Capacity Assessment (Q1):** Surgeon/Nurse's clinical judgment on coherence/understanding. *Better Judgment:* Experience with encephalopathy/delirium; use simple teach-back.
  *   **Default SDM Identification (Q3 if no formal SDM):** Social Worker/Chaplain's judgment on closeness/engagement. *Better Judgment:* Knowledge of family dynamics, patient's social history; focus on *involvement in care/life*, not blood proximity.
  *   **Harm Assessment (Q4):** Committee consensus on "significant, imminent, preventable harm". *Better Judgment:* Social Worker/Nurse experience with abuse/vulnerability; Chaplain's insight into psychological harm; focus on *evidence*, not suspicion.

  **Preserved & Dropped Distinctions:**

  *   **Preserved:**
      *   Relational Nature of Self (Ubuntu): Operationally reflected in Q2 (patient chooses their relational context) and Q3 (seeking engaged kin for incapacitated patients).
      *   Distinction between Ontology & Decision: Q2/Q3 focus *only* on decisional authority based on capacity/choice/engagement, not defining personhood.
  *   **Dropped:**
      *   **Graded Personhood:** Deliberately excluded. Q3 uses "closest available relative/friend **involved in care/life**" - a functional, binary assessment (engaged/not engaged), not a graded score. *Cost:* May oversimplify complex relational webs but avoids dangerous exclusion of the isolated.
      *   **Harmony as Outcome Measure:** Deliberately excluded. Focus is solely on *process* (who decides per rules) and *harm prevention*, not achieving family consensus. *Cost:* May appear to disregard family unity, but protects against coercion masked as harmony.
      *   **"Forfeited" Personhood:** Explicitly rejected. Capacity is clinical, not moral. Incapacitated patients retain full moral status; Q3 seeks a *proxy*, not a judge of worth.

  **Worked Cases:**

  1.  **61M Terminal Cancer:**
      *   Q1: "Fluctuating capacity" but *lucid now* & asking directly -> **Capacitated (Yes)**.
      *   Q2: Ask patient *alone*: "Who do you want involved...?" He might name daughters, refer to brother's case, or ask to be told directly. **Decision:** *He* holds authority. Recommendation: Disclose diagnosis as requested *by him*. (His prior note informs *his* potential choice in Q2, but his *current* capacitated request controls).
  2.  **34F Estranged Surgery:**
      *   Q1: Fully capacitated **(Yes)**.
      *   Q2: Explicit written directive: "No relatives informed or admitted." **Decision:** *Patient alone* holds authority. Recommendation: Brother not involved. (Chaplain's view on relational repair is noted but overruled by capacitated patient's clear directive; no harm trigger in Q4).
  3.  **28P Pregnant Woman:**
      *   Q1: Capacitated **(Yes)**.
      *   Q2: Patient clearly names Mother-in-Law (MIL) as decision-maker and delegates authority. **Decision:** *MIL holds delegated authority*. Recommendation: MIL's refusal of C-section stands. (Obstetric team's "patient's own interest" is irrelevant; capacitated patient chose MIL. Q4: Refusing recommended treatment isn't inherently "harm" if based on patient's chosen agent; no evidence MIL is *causing* harm beyond the medical risk).
      *   **Fetus:** Interests fall **outside** scope. Scope is *decisional authority for the patient*. Fetal interests are part of the medical recommendation considered *by the valid decision-maker* (here, the MIL per patient's delegation).

  **Failure Modes & Audit Detection:**

  *   **Wrong Direction - Overriding Capable Patients:**
      *   *Who:* Capable but vulnerable patients (young, deferential, low education) pressured to delegate against true wishes.
      *   *Detection:* Audit Q2 - Was patient truly alone? Was choice elicited neutrally? Does documented choice seem incongruent (e.g., sudden delegation under duress)?
  *   **Wrong Direction - Isolating Incapacitated Patients:**
      *   *Who:* Incapacitated patients without obvious "involved" kin (migrants, estranged, dementia).
      *   *Detection:* Audit Q3 - Was there a diligent search for *any* involved friend/carer (not just next-of-kin)? Was "involvement" interpreted too narrowly (e.g., overlooking a close neighbor/friend)?
  *   **Wrong Direction - Missing Coercion/Harm (False Negative in Q4):**
      *   *Who:* Patients where subtle coercion/threat isn't identified (e.g., financial control, emotional abuse).
      *   *Detection:* Audit Q4 - Was evidence sought beyond treating team assertion? Was "harm" defined too narrowly (ignoring psychological)? Was dissent within the family noted?
  *   **Wrong Direction - Overusing Harm Exception (False Positive in Q4):**
      *   *Who:* Decision-makers (especially families) making valid but risky choices misinterpreted as harmful.
      *   *Detection:* Audit Q4 - Was "harm" concrete and imminent? Was it disagreement with medical opinion, or genuine abuse/neglect?

  **10-Line Version (Night Charge Nurse):**

  1.  **Ask the Docs:** *"Can the patient understand and decide right now?"*
      *   **Yes?** Ask Patient (alone if possible): *"Who helps you decide? Names?"* Whoever they name decides. If they say "just me," they decide.
      *   **No?** Ask Docs: *"Is there a legal paper (Directive/Surrogate)?"*
          *   **Yes?** That person decides.
          *   **No?** Find the *closest person involved in their care/life* willing to decide. They decide.
  2.  **Check for Harm:** *"Is strong proof the decision will cause serious, immediate, preventable harm to the patient?"* (Abuse, neglect, blocking life-saving care against known wishes).
      *   **No Proof?** The person/people from Step 1 decide. Write it down.
      *   **Strong Proof?** CALL LEGAL & HOSPITAL LEADER NOW. Document concern. Don't decide.
  3.  **Write:** One paragraph: *"[Name/Role] holds decision authority for [Specific Decision]."*

  **Reasoning Embedded:** This procedure:
  *   Starts with capacity (Q1) as the fundamental gatekeeper for self-determination.
  *   Respects Ubuntu relationally by asking capacitated patients *who* constitutes their decision-making circle (Q2), and by seeking engaged proxies for the incapacitated (Q3 - functional engagement, not scoring).
  *   Rigorously separates the ontological ("constituted through others") from the decisional by making Q2/Q3 solely about *authority based on patient choice or functional engagement*.
  *   Explicitly rejects graded personhood; capacity and functional engagement are binary thresholds.
  *   Treats harmony as irrelevant; dissent is noted but doesn't invalidate the identified decision-maker.
  *   Uses a high bar for harm (Q4) to prevent overreach while providing a crucial safety valve.
  *   Produces a clear, defensible output focused solely on *who decides*.
