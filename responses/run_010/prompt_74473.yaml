prompt: |-
  Since the early 1970s no major currency has been convertible into anything at all: a central bank issues notes and ledger entries whose only redemption is for other notes and entries, courts oblige creditors to accept them at face value in discharge of debts, and the state insists on being paid taxes in them. The same institutions also insist that a note has no value in itself and that the state cannot set money's purchasing power. In the mid-1730s Berkeley, then Bishop of Cloyne, published The Querist, a long series of numbered questions about the Irish economy, arguing that money is not wealth but a ticket or counter recording and transferring claims on other people's labor and produce; that its worth turns on its quantity and the speed of its circulation rather than on the metal it happens to be made of; that its purpose is wholly social, namely to rouse industry; and that Ireland would do well to found a national bank issuing paper never to be redeemed in gold or silver.

  What theory of money does the modern practice actually presuppose? Does it require Berkeley's view that money is a sign whose entire content lies in its use, or a chartalist view on which money is simply whatever the state designates as discharging a tax debt, or is it compatible after all with a commodity or metallist theory on which notes are accepted only because people expect to pass them on? Separate what the practice strictly needs from what merely fits it comfortably, and say where it is philosophically underdetermined. Tell me also whether its parts presuppose consistent things: is there a real tension between denying that money has intrinsic value, treating a fall in its purchasing power as a genuine loss, and letting a statute fix the amount at which it discharges a debt, or does that tension dissolve once the right distinction is drawn? Is Berkeley's immaterialism doing any work in his monetary theory, or could a thoroughgoing materialist hold exactly the same views about money? And if we replaced the presupposed theory with a strict metallist one, what concretely would have to change in legal tender law, central bank balance sheets, and national accounting?

  After your reconstruction, give me a JSON object with these fields: presupposed_theory (one or two sentences); strictly_required (what the practice cannot function without); merely_compatible (theories that fit but are not needed); internal_tension (whether there is one, and how it resolves if it does); immaterialism_load_bearing (yes or no, with a one-sentence reason); metallist_substitutions (an array of three to five concrete changes).
