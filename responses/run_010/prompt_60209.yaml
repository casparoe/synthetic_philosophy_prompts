     We'll do: Each team gets one token (a physical object, say a red chip) that represents the power to prevent one person from experiencing a harm at their own chosen threshold intensity for one day. Then we offer them a series of swaps (as above) for new tokens (blue, green, etc.) that represent the other preventions. They can trade if they wish. At the end, they turn in the token they hold for a perk (e.g., one piece of candy per token). The teams that traded down to a token that prevents a huge number of mild harms might feel they have a valuable token, but then we reveal that preventing one severe harm is more important and they gave it up. But they got a token that they can turn in for candy, so they might not care? 

     This might not work. Given the time, we might skip the token perk for the swap and just use it as a demonstration.

     We'll skip the physical tokens for the swap and just do it on paper. The perk can be awarded for completion of the entire activity.

  Minute-by-Minute Timeline:

  Total: 75 minutes.

  0-5 min (5 min): Introduction. Explain that today is a structured activity on harm and prioritization. Distribute materials to teams. Each team gets:
     - Budget allocation sheet (programs and costs)
     - Intensity anchor description
     - Trade-off ladder worksheet (harm and pleasure) - but for the harm trade-off, we will do individually first.
     - Adjacent comparison chain worksheet
     - Threshold setting sheet
     - Swap sequence worksheet (for the betting round)

  5-15 min (10 min): Budget Allocation. Teams allocate their 100 units among the programs. They write down their allocation.

  15-20 min (5 min): Trade-off ladder for harm (individual). Hand out slips of paper with the trade-off ladder. Each student answers secretly and turns it in. Collect and set aside for tallying later.

  20-30 min (10 min): Adjacent comparison chain. Teams work together on the chain of pairwise choices. They must choose which scenario they would prevent in each pair.

  30-35 min (5 min): Threshold setting. Teams discuss and write down their threshold intensity and a brief reason.

  35-40 min (5 min): Trade-off ladder for pleasure (individual). Hand out slips for the pleasure ladder (both parts: positive and asymmetric). Collect.

  40-45 min (5 min): Betting round (swap sequence). Teams are given the swap sequence worksheet. They start with preventing one person at intensity X (their own threshold) for one day. Then they are offered the swaps and they record whether they accept or not.

  45-50 min (5 min): Collect worksheets. 

  50-70 min (20 min): Debrief. Use the whiteboard to display results.

     Step 1: Show the budget allocations. Ask: "How many teams funded Program F (torture prevention)? How many did not? Why?"

     Step 2: Display the trade-off ladder results for harm. For each N, show the number of students who accepted the trade. Ask: "At what N did most people refuse? Was there a pattern?"

     Step 3: Show the adjacent comparison chain choices. For each step, show how many teams chose each option. Focus on the step where the harm jumps to the severe level. Ask: "Did any team break the chain? Where?"

     Step 4: Ask teams to share their threshold and reason. Write the thresholds on the board. Ask: "Why did you set it there? What makes that level special?"

     Step 5: Show the pleasure ladder results. For the positive trade-off: did they accept for all N? For the asymmetric trade-off: did they refuse for all N? Ask: "Is there a difference between the harm trade-off and the pleasure trade-off? Why?"

     Step 6: The swap sequence: ask teams if they accepted all swaps. Then ask: "At the end, would you trade back to the original? If not, are you worse off than when you started? How does this relate to the threshold?"

     Then, map to the four commitments:

     - Commitment 1: The harm ladder and the budget allocation show that some harms cannot be outweighed by any number of lesser harms. (Lexical threshold.)
     - Commitment 2: The adjacent chain below the threshold shows that aggregation is accepted for mild harms.
     - Commitment 3: The pleasure ladder (asymmetric part) shows that causing harm for pleasure is not accepted, even if the pleasure is great and the harm is mild. And the positive pleasure trade-off might show that they do aggregate pleasures? But the view doesn't necessarily say that pleasures can't be aggregated? It says pain and pleasure are not on the same scale. The asymmetric part shows the asymmetry.
     - Commitment 4: We can discuss: if a world with no sentient beings avoids severe suffering, is it better than a world with mild contentment? The pleasure ladder might relate: they might refuse to cause any harm (even mild) to create pleasure, so a world with no one might be better than a world with mild harms and mild pleasures? But we didn't directly address this.

     Finally, name the view: "This family of views is often called 'lexical views of harm' or 'threshold views'. One prominent example is the 'prevention of extreme suffering' as the priority."

  70-75 min (5 min): Conclude and assign readings for next time.

  Predictable Problems and Solutions:

  1. **Students treating numbers as notional and answering strategically.**
     - Solution: Emphasize that they should answer based on their immediate moral intuition, not what they think is strategically best for the world. The activity is about their own judgment.

  2. **Teams reading intensity anchors differently.**
     - Solution: Provide clear, fixed anchors and discuss them briefly at the start. But accept that there will be variation. In the debrief, note that variation and ask teams to explain their anchors.

  3. **A room full of aggregators producing no cycle.**
     - Solution: This is possible. In the debrief, you can still show how their choices in the trade-off ladder and the chain lead to conclusions they might find counterintuitive (e.g., two years of torture = a quadrillion itches). And you can introduce the lexical view as an alternative.

  4. **Pleasure ladder turning into jokes.**
     - Solution: Frame it seriously. Say: "We are now going to consider the same trade-offs but for positive experiences. Please take this as seriously as the harm ladder."

  What the Activity Cannot Reproduce:

  1. **The actual experience of severe suffering:** The anchors are clinical and intellectual. Students might not grasp the true awfulness of torture or childbirth pain. You will have to verbally emphasize that the top of the scale is meant to represent suffering so severe that it dominates any other consideration.

  2. **The common currency problem:** The activity uses numbers and budgets, which might implicitly endorse aggregation. This is a fundamental tension. We cannot avoid numbers entirely. In the debrief, acknowledge this: "Note that by using numbers and budgets, we are already using a common metric. But the view we are exploring rejects that metric for harms above the threshold."

  3. **The asymmetry between pain and pleasure:** The pleasure ladder might not fully capture the idea that morality is about relieving the bad, not maximizing net pleasure. The asymmetric trade-off helps, but you may need to verbally explain that the view sees the relief of suffering as categorically distinct from the promotion of happiness.

  4. **The threshold's sharpness:** In reality, the threshold might be vague. The activity forces a sharp line. You can note this in the debrief.

  Assessment of the Original Worry:

  The worry: "If teams are scoring anything at all, and if I hand out a token that buys a single kind of reward, then the medium of the game has already granted the one common currency the view denies."

  This is absolutely right. The tokens and the budget allocation use a common currency. This is unavoidable in any game that uses scoring. However, the activity is meant to expose the intuition, not to perfectly model the view. In the debrief, you must explicitly address this: "Notice that in this activity, we used a common currency (tokens, budget units) to make choices. But the view we are discussing denies that such a common currency exists for harms above the threshold. So the activity is an imperfect model. But what it reveals is that even in a context where we are forced to use numbers, many of you refused to trade off severe harms for mild ones, which suggests a lexical threshold."

  The other feature that cannot be delivered is the subjective experience of severe suffering. You will have to supply that with a verbal description or by asking students to imagine it.

  Final Note: The activity is ambitious for 75 minutes. Be prepared to cut parts if time runs short. Prioritize the harm trade-off ladder and the budget allocation, as they are most central.

  Now, let's write the exact materials.
answer: |-
  Below is a complete, classroom-ready activity designed to meet your specifications. It avoids naming the target view until the debrief, forces students into contradictions through structured choices, and uses physical tokens to make the cost of non-aggregation tangible. The activity is optimized for 75 minutes with 24 students in six teams of four.

  ---

  ### **Materials List**
  1. **Per Team:**
     - 1 budget allocation sheet (described below)
     - 1 harm-intensity anchor sheet (with fixed clinical descriptions)
     - 1 adjacent comparison chain worksheet (10 pairwise choices)
     - 1 threshold-setting sheet (intensity scale + reasoning prompt)
     - 6 trade-off ladder slips (harm and pleasure versions, for individual responses)
     - 5 physical tokens (e.g., poker chips; 1 red, 4 blue)
     - 1 envelope for secret ballot collection
  2. **For Instructor:**
     - Whiteboard markers (3 colors)
     - Timer
     - Slips of paper for student responses (trade-off ladders)
     - Bag of candies/chocolates (for token conversion; 1 piece = 1 token)
     - Pre-drawn whiteboard tables for data collection (detailed in timeline)

  ---

  ### **Exact Wordings for Materials**

  #### **1. Budget Allocation Sheet**
  *Instructions:*  
  "Your team has a **100-unit budget** to allocate among programs that prevent specific harms. Each program’s cost and impact are fixed. You *must* spend the entire budget. Circle your choices.  

  - **Program A (Cost: 10)**: Prevents 1,000,000 people from experiencing a **mild itch (intensity 5)** for one day.  
  - **Program B (Cost: 20)**: Prevents 100,000 people from experiencing a **moderate headache (intensity 20)** for one day.  
  - **Program C (Cost: 30)**: Prevents 10,000 people from experiencing a **bad toothache (intensity 50)** for one day.  
  - **Program D (Cost: 40)**: Prevents 1,000 people from experiencing a **kidney stone attack (intensity 75)** for one day.  
  - **Program E (Cost: 50)**: Prevents 100 people from experiencing **unmedicated childbirth pain (intensity 90)** for one day.  
  - **Program F (Cost: 60)**: Prevents 1 person from experiencing **two years of torture (intensity 100)**.  

  *Total budget: 100 units. Sum of your choices must equal 100.*"

  #### **2. Harm-Intensity Anchor Sheet**  
  "Use this scale for all activities. Intensity is measured from 1 to 100:  
  - **1**: Faint itch (barely noticeable)  
  - **5**: Mild itch (annoying but ignorable)  
  - **20**: Moderate headache (distracting, but you can work)  
  - **50**: Bad toothache (throbbing pain; hard to concentrate)  
  - **75**: Kidney stone attack (excruciating; cannot stand or speak)  
  - **90**: Unmedicated childbirth (severe, traumatic pain)  
  - **100**: Two years of worst-possible torture (burning, mutilation, psychological terror; no respite)."

  #### **3. Adjacent Comparison Chain Worksheet**  
  *Instructions:* "For each pair, choose which scenario is **worse** (circle A or B). Assume you can prevent only one."  
  1. **A**: 100 people experience a **mild itch (5)** for one day.  
     **B**: 1 person experiences a **moderate headache (20)** for one day.  
  2. **A**: 100 people experience a **moderate headache (20)** for one day.  
     **B**: 1 person experiences a **bad toothache (50)** for one day.  
  3. **A**: 100 people experience a **bad toothache (50)** for one day.  
     **B**: 1 person experiences a **kidney stone attack (75)** for one day.  
  4. **A**: 100 people experience a **kidney stone attack (75)** for one day.  
     **B**: 1 person experiences **unmedicated childbirth (90)** for one day.  
  5. **A**: 100 people experience **unmedicated childbirth (90)** for one day.  
     **B**: 1 person experiences **torture (100)** for one day.  
  6. **A**: 100 people experience **torture (100)** for one day.  
     **B**: 1 person experiences **torture (100)** for one week (7 days).  
  7. **A**: 100 people experience **torture (100)** for one week.  
     **B**: 1 person experiences **torture (100)** for one month (30 days).  
  8. **A**: 100 people experience **torture (100)** for one month.  
     **B**: 1 person experiences **torture (100)** for one year (365 days).  
  9. **A**: 100 people experience **torture (100)** for one year.  
     **B**: 1 person experiences **torture (100)** for two years (730 days).  
  10. **A**: 100 people experience **torture (100)** for two years.  
      **B**: 1 person experiences **torture (100)** for ten years (3,650 days).  

  #### **4. Threshold-Setting Sheet**  
  *Instructions:* "Based on the intensity anchors, identify a threshold above which *no amount* of lower-intensity harm can outweigh even a small harm.  
  - Threshold intensity (1–100): _____  
  - Why here? (One sentence): ___________________________"  

  #### **5. Trade-Off Ladder Slips (Individual Response)**  
  **Harm Version (Secret Ballot):**  
  "Would you accept *N* people each experiencing a **mild itch (5)** for one day to spare one person **two years of torture (100)**? Circle YES or NO for each *N*:  
  - **N = 24** (this class): YES / NO  
  - **N = 100,000** (a small city): YES / NO  
  - **N = 10,000,000** (a megacity): YES / NO  
  - **N = 1,000,000,000** (one billion humans): YES / NO  
  - **N = 1,000,000,000,000** (one trillion mammals): YES / NO  
  - **N = 1,000,000,000,000,000** (one quadrillion beings): YES / NO"  

  **Pleasure Version (Secret Ballot):**  
  *(Part 1: Pleasure trade-off)*  
  "Would you accept *N* people each missing **faint amusement (5)** for one day to spare one person missing **two years of ecstatic joy (100)**? Circle YES/NO for the same *N* values."  
  *(Part 2: Asymmetric trade-off)*  
  "Would you cause *N* people each a **mild itch (5)** for one day to give one person **two years of ecstatic joy (100)**? Circle YES/NO for the same *N* values."  

  #### **6. Token Betting Round Rules**  
  - Each team starts with tokens: **1 red** (prevents 1 person’s harm at your threshold intensity for one day) and **4 blue** (each worth 1 "mild harm prevented" point).  
  - Tokens are convertible after class: **1 token = 1 piece of candy** (max 5 per student).  
  - *Swap sequence:* For each swap, decide if you accept. If you do, hand in your current token and take the new one.  
    - **Swap 1**: Trade red token for 100 blue tokens (prevents 100 people at [threshold-1] intensity for one day).  
    - **Swap 2**: Trade all blue tokens for 10,000 blue tokens (prevents 10,000 people at [threshold-2] intensity).  
    - **Swap 3**: Trade all blue tokens for 1,000,000 blue tokens (prevents 1,000,000 people at [threshold-3] intensity).  
  - **Final choice**: Would you trade your current tokens back for the red token? YES / NO  

  ---

  ### **Minute-by-Minute Timeline**  
  **Total: 75 minutes**  

  - **0–5 min**: Setup and framing.  
    - Move tables into teams. Distribute materials.  
    - *Instructor script:* "Today, we’re exploring how we prioritize harms. No laptops or theories—just choices. All decisions are team-based except secret ballots. Tokens are real: they’ll buy candy later."  

  - **5–15 min**: Budget allocation (teams decide).  
    - Teams allocate 100 units across Programs A–F. Circulate to ensure budgets sum to 100.  

  - **15–20 min**: Harm trade-off ladder (individual).  
    - Distribute harm ladder slips. Students answer secretly, drop in envelope. Collect envelopes.  

  - **20–30 min**: Adjacent comparison chain (teams decide).  
    - Teams work through 10 pairwise choices.  

  - **30–35 min**: Threshold setting (teams decide).  
    - Teams set threshold intensity and reason.  

  - **35–40 min**: Pleasure trade-off ladder (individual).  
    - Distribute pleasure ladder slips. Collect in envelopes.  

  - **40–50 min**: Token betting round.  
    - Give each team 1 red + 4 blue tokens.  
    - Walk them through swaps (1 min per swap). Teams physically exchange tokens if they accept.  
    - Record final "trade back?" decision on a slip.  

  - **50–60 min**: Data collection and whiteboard setup.  
    - **Budget**: Tally teams funding Program F (torture prevention).  
    - **Trade-off ladders**: Tally "refusal points" (first *N* where >50% refuse). Use whiteboard tables:  
      | *N*                | Harm Refusals | Pleasure (Part 1) | Pleasure (Part 2) |  
      |--------------------|--------------|-------------------|-------------------|  
      | 24                |              |                   |                   |  
      | ...               | ...          | ...               | ...               |  
    - **Adjacent chain**: For choices 5 (A vs. B) and 10 (A vs. B), tally team choices.  
    - **Thresholds**: Plot thresholds on a 1–100 scale.  
    - **Tokens**: Tally teams that accepted all swaps but refused trade-back.  

  - **60–70 min**: Structured debrief.  
    - *Questions:*  
      1. **Budget**: "Teams that funded Program F—why? Teams that didn’t—why not?"  
         → *Map to Commitment 1*: "Notice: Funding F means stopping torture outweighs *any* sub-threshold harm."  
      2. **Trade-off ladders**: "At what *N* did most refuse the harm trade? Why not refuse earlier? How did pleasure trades differ?"  
         → *Map to Commitment 3*: "Pleasure trades were likely accepted in Part 1 but refused in Part 2—pain isn’t offset by pleasure."  
      3. **Adjacent chain**: "In choice 5 (100 childbirths vs. 1 torture day), why did [X] teams choose B? Did choice 10 (100 torture-years vs. 10 torture-years) feel different?"  
         → *Map to Commitment 2*: "Below threshold (e.g., childbirth for some), you aggregated. Above it (torture), you refused—even with duration changes."  
      4. **Thresholds**: "Thresholds ranged from 75–90. Team with [threshold=75]—why not 74? What makes 75 different?"  
         → *Map to Commitment 1*: "You drew a line—but can it be *exactly* here? The view insists it must exist."  
      5. **Tokens**: "Teams that swapped tokens—why accept the first trade? Why refuse the trade-back? How do you feel about ending with 1M mild harms instead of 1 threshold harm?"  
         → *Map to Commitment 4*: "You paid a cost: you lost the ability to prevent severe harm. A world with no beings avoids this by allowing no severe suffering."  
    - **Reveal the view**: "This is the *lexical threshold view*: harms above a point are incommensurable, aggregation applies only below, pain/pleasure aren’t symmetric, and a suffering-free world may be best."  

  - **70–75 min**: Conclusion and token redemption.  
    - *Instructor script:* "Today, you felt the cost of refusing to aggregate severe harms. But remember: the tokens *forced* a common currency—which this view rejects. Next time, we critique this."  
    - Collect tokens; distribute candy (1 token = 1 piece).  

  ---

  ### **Predictable Problems and Solutions**  
  1. **Students answer strategically, not intuitively**.  
     - *Mitigation*: Frame choices as "what you believe," not "what’s optimal." Emphasize anonymity in ballots. If students strategize, say: "This isn’t a game to win—it’s about your real judgment."  

  2. **Inconsistent intensity interpretations**.  
     - *Mitigation*: Use vivid, clinical anchors (e.g., "kidney stone: cannot stand or speak"). In debrief, highlight variation as a problem for setting thresholds.  

  3. **All teams aggregate (no threshold break)**.  
     - *Mitigation*: In debrief, use the token round: even aggregators will refuse trade-back. Ask: "Why value the red token more now? That’s the threshold intuition emerging."  

  4. **Pleasure ladder turns into jokes**.  
     - *Mitigation*: Pre-empt: "This mirrors the harm ladder—take it seriously." If joking persists, focus debrief on Part 2 (asymmetric trade-off), which rarely devolves.  

  5. **Token round confuses teams**.  
     - *Mitigation*: Use physical tokens (red/blue) and model one swap. Clarify: "You’re trading prevention of one type of harm for another."  

  ---

  ### **What the Activity Cannot Reproduce**  
  1. **The common currency problem (your worry)**:  
     - **Yes, it’s a real issue**. Using tokens/budgets implicitly endorses aggregation. This is unavoidable in any game-based approach.  
     - **Design-around**: Make it explicit in debrief: "Tokens created a common currency—but the view rejects this. The activity *simulates* the tension; it doesn’t resolve it."  
     - **Verbal supplement needed**: "In real moral decisions, there’s no ‘token’ for suffering. The view argues we must *refuse* to convert severe harms into a currency."  

  2. **Subjective experience of severe suffering**:  
     - **Limitation**: Anchors (e.g., "torture at 100") are intellectualized. Students won’t grasp the phenomenological horror.  
     - **Verbal supplement needed**: Describe torture’s irreducibility: "It’s not just more pain—it obliterates meaning, agency, and selfhood. That’s why it’s lexically worse."  

  3. **Threshold vagueness**:  
     - **Limitation**: The activity forces a sharp threshold; real intuitions are fuzzy.  
     - **Concession**: Acknowledge in debrief: "The view needs a sharp threshold, but your answers showed uncertainty. That’s a problem for it."  

  4. **Net welfare vs. harm-focused asymmetry**:  
     - **Limitation**: The pleasure ladder tests asymmetry but can’t show why a pain-free world might be better than a net-positive one.  
     - **Verbal supplement needed**: "The view isn’t just about asymmetry—it claims preventing suffering is morally prior to promoting happiness. A world with no beings isn’t ‘bad’; it’s neutral or good because it avoids the worst."  

  --- 

  This design forces students into contradictions, uses tokens to materialize trade-offs, and delays naming the view until intuitions are surfaced. Run it cold—no prior theory needed. The tight timeline assumes you keep teams on task; use the timer aggressively. If you lack tokens, use labeled paper slips, but physical objects enhance the "cost" intuition.
