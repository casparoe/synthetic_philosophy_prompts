  2. Below the threshold, aggregation is allowed (trade-offs among mild harms).
  3. Pain and pleasure are not on a single scale; morality is about relieving the bad, not maximizing net.
  4. Therefore, a world with no sentient beings is not worse than (and may be better than) a world with mild contentment but no severe suffering.

