answer: |-
  ### **Brainstorm: Mapping Vocabulary to the Problem**  
  **Features with Purchase:**  
  - **Partition boundaries** → Potential epoch start dates (candidate boundaries in deep time).  
  - **Anchor records** → Stratigraphic markers (e.g., plutonium isotopes) used to define boundaries.  
  - **Retroactive correction of valid time** → Reinterpretation of when an epoch began based on new evidence.  
  - **Two clocks** → Separation of *when human impact became geologically significant* (valid time) vs. *when it was ratified* (transaction time).  
  - **Schema ownership/ratification** → Authority of stratigraphic bodies (ICS/IUGS) to formalize boundaries.  
  - **Versioning/forks** → Unofficial use of "Anthropocene" vs. ratified Holocene in the geologic time scale (GTS).  

  **Seductive but Misleading:**  
  - **Enum domains** → Suggest discrete, stable values, but epoch definitions are interpretation-laden and contested.  
  - **Primary keys** → Implies unique, immutable identifiers; geologic boundaries are fuzzy and proxy-dependent.  
  - **Late-arriving facts** → Misrepresents stratigraphic ratification as a "correction"; it’s a governance act, not a discovery.  
  - **Deprecation** → Implies planned obsolescence; non-ratification of the Anthropocene is a rejection, not deprecation.  

  **No Direct Purchase:**  
  - **Slowly changing dimensions** → Geologic time is not a "dimension" with incremental updates; boundaries are singular events.  
  - **Rollback semantics** → Ratification decisions are irreversible in practice; no "rollback" of the GTS exists.  

  ---

  ### **1. Start-Date Dispute in Your Terms**  
  Each candidate start date is a **proposed partition boundary** for a new temporal interval (Anthropocene). The debate centers on selecting the optimal boundary-defining anchor record.  

  | Candidate Start Date           | Object in Your Vocabulary                          | Nature of Disagreement                                                                 |
  |--------------------------------|----------------------------------------------------|----------------------------------------------------------------------------------------|
  | **Early agriculture (~8,000 BP)** | Weak anchor record; diffuse signal, no global synchronicity. | Boundary too fuzzy; lacks a sharp partition marker (e.g., no unique isotopic spike). |
  | **1610 CE (Orbis Spike)**      | Anchor record candidate (CO₂ dip, pollen shifts).    | Partition boundary debated: signal is global but amplitude disputed; not unique to humans. |
  | **Late 18th c. (Industrialization)** | Anchor record (coal soot, CO₂ rise).               | Boundary clear locally (Europe) but asynchronous globally; invalid partition for a global epoch. |
  | **Mid-20th c. (Great Acceleration)** | Strong anchor record (plutonium-239 in sediments). | Proposed primary partition boundary. Rejected not due to data quality, but governance (insufficient evidence of uniqueness, synchronicity). |

  **Key Insight:** The mid-20th-century proposal was a **schema migration attempt** (adding Anthropocene to GTS). Its rejection was a **governance decision** (IUGS vote), *not* a correction of valid time. Other candidates are merely **proposed anchor records**, not formal migration proposals.  

  ---

  ### **2. The Two Clocks and a Possible Third**  
  - **Valid Time (VT):** When human impacts became geologically significant (e.g., CO₂ rise ~1800, radionuclides ~1950).  
  - **Transaction Time (TT):** When the geologic community ratifies (or rejects) the boundary (e.g., 2024 rejection).  

  **Result:** The dispute **cannot be fully parsed by separating VT and TT**. Crucially:  
  - **VT is indeterminate** – Human impact lacks a single globally synchronous signal. No "true" valid time exists independent of proxy selection.  
  - **TT does not merely record VT** – Ratification *constitutes* the boundary officially; without it, the partition lacks formal existence.  

  **Third Axis?** Yes: **Detectability Time (DT)** – When signals become measurable in the archive (e.g., plutonium detectable post-1945). DT ≠ VT (e.g., agriculture’s impact was detectable millennia later). Parties conflate VT and DT:  
  - Long-fuse advocates argue DT proves early VT.  
  - Great Acceleration advocates argue DT defines VT (sharp signals).  

  **Substantive Conclusion:** The debate is less about clocks than about **what constitutes a valid partition boundary** – synchronicity, sharpness, or human causation.  

  ---

  ### **3. Authority Question**  
  **Analogue of Schema Ownership:**  
  - **Stratigraphic bodies (ICS/IUGS)** = **Schema owners**. They alone commit changes to the GTS (the "master schema").  
  - **Unofficial "Anthropocene" usage** = **Unmanaged fork** – A divergent copy used without governance (e.g., in policy, journalism).  

  **Authority Mechanism:**  
  - Operates as a **hybrid**:  
    - *Standards body* for formal intervals: Ratification changes what is "official" (transactional).  
    - *Auditor* for physical reality: Proposals must validate against anchor records (valid-time constraints).  
  - **Critical Tension:** Rejection (2024) was a governance veto ("you propose a boundary, but we reject the interval"), not an audit of valid time.  

  **No Direct Analogue:** Ratification’s *constitutive power*. In your model, schema changes describe pre-existing reality. In stratigraphy, ratification *creates* the interval’s formal existence – even if evidence is robust, no interval exists without it.  

  ---

  ### **Residue Report**  
  *Claims sorted by translatability into bitemporal modeling:*  

  | Claim/Concept                          | Bucket               | Distortion/Limitation                                                                 | Judgment                                                                 |
  |----------------------------------------|----------------------|---------------------------------------------------------------------------------------|--------------------------------------------------------------------------|
  | **Start-date as partition boundary**   | Translates cleanly   | –                                                                                     | Core overlap in temporal segmentation.                                   |
  | **Mid-20th c. proposal rejection**     | Translates with distortion | Distortion: Rejection is a governance event (TT), not a valid-time correction.         | **Limitation of framework**: Ratification constitutes, not describes.    |
  | **Unofficial "Anthropocene" usage**    | Translates cleanly   | –                                                                                     | Direct analogue to unmanaged fork.                                       |
  | **Anthropocene as interval**           | No expression        | Interval requires ratification; no counterpart to "constitutive declaration".          | **Limitation**: Framework assumes pre-existing facts; geology has institutional facts. |
  | **Fuzziness of pre-industrial dates**  | Translates with distortion | Distortion: Valid time assumes determinacy; early dates are proxy-dependent and asynchronous. | **Substantive disagreement**: Parties prioritize different boundary criteria. |
  | **Radionuclides as anchor record**     | Translates cleanly   | –                                                                                     | Clear anchor record candidate.                                           |
  | **Stratigraphic ratification authority** | Translates with distortion | Distortion: Schema owners *declare* truth; stratigraphy *makes* it official.           | **Limitation**: Constitutive authority absent in bitemporal model.       |
  | **"When the concept became available"**| No expression        | No analogue for epistemic history influencing valid-time assignment.                  | **Substantive**: Start-date proposals reflect modern concerns, not past reality. |

  **Smuggled Presuppositions Flagged:**  
  - **Determinism**: Assumed a "true" start date exists. Stratigraphy treats boundaries as *defined by* proxies, not discovered.  
  - **Declaration as descriptive**: Framed ratification as "recording" reality; it is partly *performative* in geology.  

  ---

  ### **Conclusion**  
  The dispute centers on **competing criteria for partition boundaries** (synchronicity, sharpness, causation), not a failure to separate clocks. Your framework illuminates governance (TT) and evidence (anchor records), but stumbles on two irreducible gaps:  
  1. **Constitutive ratification**: Boundaries are made official by declaration, not merely described.  
  2. **Indeterminate valid time**: No synchronous global signal exists; "start" is a negotiated interpretation of proxies.  

  **Recommendation**: Model the field as an **unratified enum** (e.g., `proposed_epoch`), with values like `ANTHROPOCENE_MID20C`, `ANTHROPOCENE_ORBIS`, and `HOLOCENE`. This:  
  - Honors governance (official status remains Holocene).  
  - Allows downstream filtering without endorsing a start date.  
  - Permits reclassification if ratified later (transaction-time update).  

  The residue is **mostly framework limitation**, revealing geology’s blend of physical evidence and institutional fact-making. The parties *are* arguing past each other – but because they prioritize different boundary axioms, not because the clocks are entangled.
