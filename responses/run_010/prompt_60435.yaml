  ## Case Study: Newton's Ghosts - Neptune, Mercury, and the Metaphysics of Lawhood

  This case study examines the dual anomalies in Newtonian gravitation (Uranus's orbit, Mercury's perihelion advance) through the lens of two competing metaphysical accounts of natural law: David Lewis's Humean Best-System Account (BSA) and the Non-Humean Necessitation/Production view (exemplified by David Armstrong and Tim Maudlin). The core question is whether the metaphysics of lawhood illuminates why *particular-channel repair* (adding entities) succeeded for Uranus but failed for Mercury, while *law-channel repair* (revising the force law) was proposed for Mercury and ultimately succeeded via General Relativity (GR), and what this implies about the nature of scientific law during the period of uncertainty (c. 1840-1915).

  **I. Mapping the Episode onto the Metaphysical Frameworks**

  *   **The Humean Best-System Account (Lewis):**
      *   **The Mosaic (c. 1880):** The total distribution of local particular matters of fact known *and unknown* up to that time. Crucially, this includes the positions and masses of the Sun, known planets (including Neptune), asteroids, comets, and all observed telescopic data on their motions, terrestrial phenomena, etc., *but excludes future observations and discoveries (Vulcan searches, GR, Voyager 2 data)*. The mosaic *is* the world; laws supervene upon it.
      *   **The Candidate Law (c. 1880):** Newton's Law of Universal Gravitation (LUG): F = G * (m1*m2)/r^2. Its status as a "law" is contingent. It is a candidate generalization competing for inclusion in the "best system" – the deductive system that achieves the best balance of *simplicity* (concise axioms) and *strength* (maximizing informative consequences about the mosaic) summarizing the entire mosaic.
      *   **The Anomaly (Mercury, c. 1880):** The observed advance of Mercury's perihelion (≈43"/century) constitutes a local particular fact within the mosaic. This fact is *not* deducible from the current best system (which includes LUG, Newton's laws of motion, and the known masses/positions of celestial bodies) plus the rest of the mosaic. It is a residual – a fact seemingly inconsistent with the system's predictions derived from the mosaic data.

  *   **The Non-Humean Necessitation/Production View (Armstrong/Maudlin):**
      *   **The Mosaic (c. 1880):** The spatio-temporal distribution of local particular matters of fact (the "mosaic" itself). This includes the positions, masses, motions of all celestial bodies *known at the time*. However, this mosaic is *not* fundamental. It is *generated* or *governed* by something beyond it – the laws.
      *   **The Law (c. 1880):** Newton's LUG is hypothesized to be a fundamental feature of reality – either a brute, primitive law (Maudlin) that *produces* the regularities in the mosaic, or a second-order relation of nomic necessitation between universals (Armstrong: mass necessitates an attractive force inversely proportional to the square of the distance). Its existence is ontologically prior to and independent of the specific mosaic it governs. It *makes* massive bodies behave as they do.
      *   **The Anomaly (Mercury, c. 1880):** The observed perihelion advance is a fact *in* the mosaic. Crucially, if Newton's LUG is *the* true law, this fact should be necessitated by the law plus the initial conditions (positions, masses, velocities of Sun and planets). The discrepancy indicates one of three things: (1) The initial conditions are incomplete (missing matter – particular-channel repair needed). (2) Newton's LUG is *not* the true, fundamental law (law-channel repair needed). (3) There is an error in observation or calculation.

  **II. Diagnosing the Repairs: Pressing the Worry**

  *   **Humean BSA Diagnosis:**
      *   **1880 Status of LUG:** LUG was a central axiom in the *then-current best system*. It offered immense strength (predicting orbits, tides, etc.) with high simplicity (a concise inverse-square relation). The Mercury anomaly was a localized failure of the system to capture a specific fact within the *known* mosaic.
      *   **Neptune (Licensed Particular-Channel):** Adding Neptune offered a strong increase in *strength* (it explained the Uranus residual *and* became a new object whose future motion could be predicted) with relatively modest cost to *simplicity* (adding one new entity and its orbital parameters). Crucially, its discovery *fit* the existing LUG-based system perfectly. This repair demonstrably improved the systematization of the *known* mosaic.
      *   **Exponent Tweak/Seeliger Cloud (Unlicensed Law-Channel, c. 1895-1906):** These proposals were attempts to *improve the system* by revising LUG. Hall/Newcomb's exponent tweak (.00000016 deviation) offered potential strength (explaining Mercury) but at a significant cost to *simplicity*: replacing the elegant integer exponent with a messy decimal fraction introduced arbitrariness and reduced the law's unifying power. Seeliger's cloud offered similar strength but worse simplicity (adding complex, arbitrary distributions of invisible matter). Crucially, *from within the 1895 perspective*, these law-channel repairs were inferior to *continuing the search for Vulcan* (particular-channel) as the primary strategy. Why? Because adding one planet preserved the simplicity of LUG, the core strength of the system, and fit the successful Neptune precedent. The law-channel tweaks sacrificed the system's key virtue for a localized fix. They were "unlicensed" in the sense that they degraded the current best system's overall balance compared to the alternative (keep looking for Vulcan).
      *   **GR (Licensed Law-Channel, 1915):** GR wasn't just a tweak; it was a revolutionary new system. Its axioms (field equations) were profoundly different from Newtonian mechanics. Crucially, it achieved *massive gains in strength* (explaining Mercury, light bending, gravitational redshift, providing a framework for cosmology) while arguably achieving a new kind of profound *simplicity* (geometric interpretation of gravity, unification with inertia). It demonstrably systematized the *entire mosaic known by 1915* far better than any Newtonian system could. It earned its status as law by providing a superior systematization.
      *   **The Worry (Future Dependence):** This is the core objection. For the Humean, the "best system" is defined relative to the *entire* mosaic of particular facts, past, present, *and future*. In 1895, the mosaic included the future discovery that Vulcan didn't exist, the future failure of eclipse searches, the future success of GR, *and* the Voyager 2 data. Therefore:
          *   There *was* a determinate fact in 1895: LUG was *not* part of the true best system for the entire mosaic (which includes 1915 and 1989). The best system in 1895, relative to the *whole* mosaic, was either unknown or perhaps embryonically resembled GR.
          *   Scientists in 1895 could not know this. Their "best system" assessment was based *only* on the mosaic known *up to 1895*. Relative to *that* incomplete mosaic, the Newtonian system *with* LUG *was* arguably still the best, making the search for Vulcan (particular-channel) the rational strategy. The exponent tweak degraded the system relative to *that* mosaic.
      *   **Is this an Objection?** It highlights a feature, not necessarily a fatal flaw. The Humean acknowledges that "lawhood" is perspectival in an epistemic sense – we assess systems relative to the mosaic we *have*. But metaphysically, lawhood *is* fixed by the entire mosaic. The episode shows scientists rationally pursuing repairs that optimize systematization of the *known* mosaic, even if the ultimate "laws" were different. The worry emphasizes the gap between epistemic practice and metaphysical truth for the Humean. "Laws" in 1895 were the axioms of the best system *for the mosaic known then*; the *metaphysical* laws were those of the best system for the whole mosaic, which included its future state. The Pluto coda reinforces this: The apparent confirmation of Pluto (particular-channel repair for Uranus/Neptune residuals) was part of the mosaic *until 1978/1989*. Relative to the mosaic *up to 1977*, the Newtonian system *with* Pluto might have looked well-confirmed. The Voyager revision *changed the mosaic*, altering what the best system was *all along*. "Confirmation" means the system successfully systematized the mosaic *as it was known at the time*.

  *   **Necessitation/Production Diagnosis:**
      *   **1880 Status of LUG:** Newton's LUG was *assumed* to be the true, fundamental law governing gravitational interactions. The mosaic was seen as its product.
      *   **Neptune (Licensed Particular-Channel):** The astronomers were correct that the anomaly stemmed from incomplete initial conditions. Adding Neptune (a particular fact) provided the missing mass whose gravitational influence, *necessitated by the true law (LUG)*, produced the observed Uranus motion. This was licensed because it preserved the fundamental law; the error was ontological incompleteness, not nomological inaccuracy.
      *   **Exponent Tweak/Seeliger Cloud (Unlicensed Law-Channel):** These proposals were *misguided* from the start because they incorrectly suggested the fundamental law (LUG) was flawed. The true law necessitated the Mercury motion *only if* the initial conditions were complete. Since they weren't (Vulcan was sought), tweaking the law was addressing the wrong problem. The proposals were "unlicensed" because they misdiagnosed the source of the anomaly – it wasn't the law failing to necessitate, it was incomplete data about the mosaic the law necessitated *from*.
      *   **GR (Licensed Law-Channel):** Einstein discovered the *true* fundamental law (the field equations). This law *always* necessitated/produced the observed Mercury perihelion advance, given the actual initial conditions (Sun, planets, *no* Vulcan). November 1915 revealed what the true governing principle had been all along.
      *   **The Worry (Error and Change):** If the true necessitating law (GR's field equations) obtained all along:
          *   **What were astronomers wrong about?** They were wrong about *which* fundamental law was doing the necessitating/producing. They mistakenly believed the Newtonian law was fundamental when it was not. Newtonian LUG was merely a very good *approximation* under most conditions, not the true ontological ground.
          *   **What changed in November 1915?** *Human knowledge* changed. The *metaphysical* law – the fundamental necessitating relation or productive primitive – was constant. Einstein discovered its mathematical form. The anomaly *always* existed relative to the Newtonian *approximation*; its resolution came when the true law was identified. The apparent success of Newtonian mechanics for centuries was due to the close approximation of its predictions to those of the true law in the domain of experience prior to precise Mercury observations and relativistic regimes.
      *   **Pluto Coda:** Pluto's discovery was an *error* based on incorrect initial conditions (overestimating Neptune's mass). The Newtonian calculations using the wrong mass *misapplied* the Newtonian approximation, leading to the illusion of a needed Planet X. The true law (GR or even Newtonian with *correct* masses) always necessitated the observed motions without Pluto. "Confirmation" of Pluto meant the Newtonian approximation, *with the incorrect Neptune mass*, predicted Pluto's position. This was a coincidence or error in the inputs to the approximating model, not a confirmation of the Newtonian law *as fundamental* or of the necessity of Pluto. The true necessitating law (GR) never required Pluto for those residuals.

  **III. Verdict: What the Episode Reveals (or Doesn't) about Lawhood**

  This episode provides significant, but not decisive, pressure points for both accounts. However, it ultimately suggests that the metaphysics of lawhood *adds little explanatory power* to understanding the scientific process *within* the period of anomaly and repair, compared to confirmation theory and methodological norms.

  *   **Favouring the Humean BSA?** The episode vividly illustrates the BSA's core tenets. Scientists demonstrably behaved as if optimizing simplicity and strength relative to the known mosaic: Neptune added strength cheaply; Vulcan was preferred over law-tweaks to preserve simplicity; GR triumphed by offering vastly superior strength with profound simplicity. The future-dependence worry is real but reflects the metaphysics accurately – lawhood *is* holistic and mosaic-dependent. The Pluto coda is a stark Humean parable: the "law" (best system) depends entirely on the mosaic; change the mosaic (Neptune's mass), and the systematization changes. The BSA offers a naturalistic explanation of scientific practice: scientists seek better systematizations of the data they have.

  *   **Favouring the Necessitation View?** The view provides a clear *ontological* distinction: there *was* a fundamental truth (GR) all along that scientists were groping towards. The distinction between particular-channel and law-channel repair maps neatly onto the distinction between incomplete initial conditions and an incorrect fundamental law. The success of Neptune confirmed the *type* of repair needed for Uranus (ontology incomplete), while the failure of Vulcan and success of GR confirmed the *type* needed for Mercury (law incorrect). The necessitation theorist escapes the future-dependence worry cleanly: the law was always GR.

  *   **The Core Limitation: Silence Where it Counts:** Despite these points, the metaphysics of lawhood struggles to provide insight *unavailable* from confirmation theory and scientific methodology during the period of uncertainty itself:
      1.  **Guiding Repair Choice:** Neither metaphysics could have *told* Le Verrier in 1859 that Vulcan was the wrong path while Neptune was right. Both accounts *allow* for either type of repair to potentially succeed. The BSA scientist optimizes for current mosaic systematization; the Necessitation scientist seeks the true fundamental producer. Both relied on *empirical* strategies: Neptune fit the pattern of previous discoveries and preserved a powerful law; Vulcan searches followed the same logic. The switch towards law-channel for Mercury only gained traction after *decades* of failed Vulcan searches – an empirical, not metaphysical, verdict. The quantified proposals (Vulcan's orbit/mass vs. exponent tweak/cloud density) were evaluated based on fit with *other* data, coherence, and testability, not deep metaphysical lawhood.
      2.  **Distinguishing "Licensed" Repairs (Without Hindsight):** The claim that Neptune was "licensed" particular-channel and the exponent tweak "unlicensed" law-channel *in 1895* only holds with hindsight. *Within the 1895 context*, pursuing Vulcan was the licensed strategy *because* the Newtonian system was so strongly confirmed elsewhere and adding planets had worked before. The exponent tweak was unlicensed *because* it seemed ad hoc and damaged a core strength of the theory *without sufficient compensating evidence*. This is a judgment about *confirmation*, coherence, and theoretical virtue – concepts belonging to epistemology and methodology, not fundamental metaphysics. The metaphysics doesn't add a criterion unavailable to the working scientist assessing evidence and theory.
      3.  **The Pluto Coda's Lesson:** The illusory confirmation of Pluto highlights that "confirmation" is provisional and mosaic-relative (Humean) or model-relative (Necessitation). Both accounts can describe this, but the description revolves around the *evidential status* changing with new data/model inputs, not a change in the fundamental nature of lawhood itself. The metaphysics doesn't illuminate *why* the confirmation was illusory beyond stating the evidential error.

  **Conclusion: A Negative Result**

  The metaphysics of lawhood – whether Humean supervenience or Non-Humean necessitation – provides distinct *metaphysical backdrops* for the episode. The Humean view makes the future-dependence of lawhood explicit, while the Necessitation view provides a stable ontological anchor. However, when asked to explain the *scientific process* – why particular-channel was pursued for Uranus and initially for Mercury, why law-channel gained traction for Mercury, why one repair succeeded and the other failed, or what "confirmation" meant during the Pluto interlude – the resources of confirmation theory, methodology (e.g., preference for conservative revisions), and the empirical details of the case suffice. The metaphysical accounts can be *mapped onto* the events, but they do not generate novel insights or distinctions that were operative for the scientists grappling with the anomalies *at the time*. The judgment of which repair path was "licensed" was driven by empirical success, theoretical coherence, and methodological norms, not by prior metaphysical commitments about the nature of lawhood. The episode shows scientists rationally navigating underdetermination using epistemic tools; it does not reveal the underlying metaphysical structure of laws in a way that guides practice independently of empirical outcomes. Therefore, concerning the specific request to see what the metaphysics "adds or subtracts" from the Duhemian point within this case, the verdict is that it adds little beyond ontological framing. The work of diagnosing anomalies and choosing repair strategies belongs firmly to confirmation theory and the sociology of scientific practice, leaving the metaphysics of lawhood largely silent on the particulars of this historical sequence. The clean negative result is that the episode, rich as it is for the history and philosophy of science, does not strongly adjudicate between the Lewisian and Necessitation views of laws, nor does it demonstrate that either view provides essential explanatory power for understanding the dynamics of scientific revision in this case beyond what epistemological tools offer. The metaphysics describes the ultimate ground; the epistemology describes the journey of discovery.
