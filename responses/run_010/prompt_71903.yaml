prompt: |-
  I'm a research assistant on the curatorial team for an exhibition at a regional archaeology museum, provisionally titled Endings: Seven Societies at the Edge, which opens in the spring, and I have just lost the better part of an evening to an argument with a friend of mine — an anthropology doctoral student who has read far more of the collapse literature than I have, my own training being in philosophy — about how our lead curator will rule on the last section of the show. The premise of the exhibition is that each case receives one of two words in its wall text, 'collapse' or 'transformation', and that Dr. Brenner alone chooses between them; there is a standing bet of a bottle of wine on what she does with the final entry. Her rulings so far, and the reasons she gave at panel, are these:

  - Late Bronze Age eastern Mediterranean, around 1200 BCE: collapse. The palatial administrations of Mycenaean Greece and the Hittite empire went within a couple of generations, Linear B and Hittite cuneiform fell out of use, the number of occupied settlements dropped sharply, and nothing of comparable complexity reappeared in the region for centuries. When a colleague pointed out that the populations obviously remained and that successor kingdoms in northern Syria and southeastern Anatolia held on for at least three centuries more, she said that was exactly the point: what died was the order, not the people, and the order did not come back.
  - Classic Maya southern lowlands, ninth century: collapse, though she insisted on the plural and on dating it city by city. Dated monuments stop, the dynastic courts dissolve, the region's population falls heavily. That the northern Yucatán was entering its own florescence and that Maya people and languages are alive today she allowed as a gloss; she did not change the word.
  - Norse Greenland: collapse. Both settlements were wholly given up, and there is no continuation to point to.
  - Rapa Nui: transformation. She rejected the familiar self-destruction story outright — the forest loss owed a great deal to introduced rats, the population held until Europeans arrived, and the catastrophe that followed came from outside, in slave raiding and epidemic disease. When someone noted that statue quarrying had ceased long before contact, she answered that the end of a practice is not the end of a people.
  - Cahokia: transformation, and specifically dispersal. The great center on the American Bottom emptied, but Mississippian life continued across the region and the descendant nations are still here; she said the panel would not write that a people had destroyed themselves when what they had done was leave.
  - Angkor: transformation. The court moved south in the fifteenth century, the kingdom continued in reduced form, the region stayed populous, and Angkor Wat has never been empty.
  - Western Roman Empire: transformation. Government, law, and the church passed into the successor kingdoms and the episcopate; there is no clean break to point at.
  - Indus Valley cities: transformation. The cities were given up and the writing stopped, but the population moved into the countryside and its practices resurface in later South Asian village life.

  She also has a line she repeats at nearly every meeting, something to the effect that a society with grandchildren has not died, it has changed, and I cannot make that square with the Maya entry, which she kept.

  The section we have left is the Ancestral Puebloan Southwest: the Chacoan great-house system at its height, then the thirteenth-century depopulation of the Mesa Verde region. Our draft gives the visitor prolonged drought, the aggregation of scattered farmsteads into large defensible villages, the cessation of great-house and great-kiva construction, the end of whatever regional integration Chaco had supplied, and then — over two or three generations — near-total abandonment of the region, with households moving south and east toward the Rio Grande, the Tewa basin, and the Hopi and Zuni mesas. The cultural-preservation offices of several descendant communities have written to us asking that the section avoid 'collapse' and 'abandonment' and speak instead of migration, on the ground that their ancestors chose to leave and that their own villages are the continuation. My friend is confident Brenner rules transformation, and thinks the letters settle the matter before the evidence is reached. I have bet the other way, on three grounds: that the Mesa Verde region was genuinely emptied rather than thinned, and stayed empty in a way the countryside around Cahokia did not; that the ceremonial and political order — the great houses, the great kivas, the roads and outlier communities — was not carried forward anywhere, since what appears afterward in the Rio Grande pueblos is a different settlement and ceremonial order however much continuity of people and practice there may be; and that her Greenland entry shows she is willing to call a small, non-literate society that simply walked away from a place a collapse when nothing took its place.

  What I want is not your view on whether the Southwest 'really' collapsed, though I would like that at the end. First, lay out the candidate criteria that Brenner's eight verdicts are jointly consistent with, stated precisely enough to be applied to a case nobody has described yet; there is more than one, and I want to see which verdicts each is needed to explain and which it strains — in particular, what separates the Indus cities from the Late Bronze Age in her treatment when both lost their writing and their central places, and what separates Cahokia from Greenland when in both a region was largely given up. Second, apply each candidate to the Ancestral Puebloan section and say what it predicts. Third, give me your best guess at her ruling, with the reason for preferring that criterion over the others, and say how confident you would be. Fourth, we have short reserve entries drafted for Teotihuacan, Great Zimbabwe, Tiwanaku, and the fall of the Western Zhou, any of which could be promoted in order to settle this: tell me which would best discriminate among the criteria you propose, and what specific feature of it does the work. Fifth, since I sit on the drafting team as well, tell me what the panel should write if it aims at consistency with her record rather than with her slogan, and — if the record genuinely does not decide the case — what principle we would be adopting by choosing one way rather than the other. Finally, say whether you think she is in fact tracking two variables at once and running them together, and whether the exhibition ought to have a third word available to her.
reasoning: |-
  Hmm, this is a fascinating and complex question from a research assistant at an archaeology museum. They're deeply immersed in a curatorial dilemma about categorizing societal "endings" as either collapse or transformation, specifically for the Ancestral Puebloan Southwest case. 

  First, I need to understand Dr. Brenner's existing rulings. She has eight cases with clear patterns: collapses (Late Bronze Age, Classic Maya, Norse Greenland) involve irreversible institutional death and regional abandonment without replacement, while transformations (Rapa Nui, Cahokia, Angkor, Western Rome, Indus Valley) show continuity of population or core institutions despite disruption. Her "grandchildren" slogan suggests population continuity matters, but the Maya ruling complicates this since Maya people survived while their political order didn't.

  The researcher's bet hinges on three key tensions: Greenland vs Cahokia (both abandoned regions but only Greenland collapsed), Indus vs Late Bronze (both lost writing/centers but classified differently), and how the Ancestral Puebloan case fits. They also want systematic criteria extraction, not just opinions.

  For candidate criteria, I see two strong possibilities: "Institutional Irreversibility" (collapse if core institutions aren't revived) and "Regional Continuity" (collapse only if discontinuity occurs in the same region). The first explains Indus (rural continuity) vs Late Bronze (no revival), while the second distinguishes Cahokia (regional dispersal) from Greenland (total regional loss). Both strain slightly on Maya where institutions died despite population survival.

  Applying these to the Southwest: Institutional Irreversibility points to collapse (Chacoan system wasn't replicated), while Regional Continuity leans transformation (descendant communities exist elsewhere). But Brenner's Greenland precedent suggests regional abandonment weighs heavily, making collapse likely despite descendant letters.

  For reserve cases, Great Zimbabwe is perfect: the elite center was abandoned but Shona traditions continued regionally. If Brenner calls this transformation (like Cahokia), it confirms Regional Continuity; if collapse (like Greenland), Institutional Irreversibility dominates. 

  Draft advice: If consistency matters, note the ceremonial order's non-revival but emphasize migration to descendant communities. The real tension is whether "collapse" implies societal death (which Brenner avoids when populations persist) or just political rupture. Adding a third term like "restructuring" might help, but could muddy the exhibition's binary framing.

  Ultimately, Brenner seems to privilege institutional fate over demographic continuity when societies relocate. That's why Maya is collapse but Indus isn't - the latter maintained cultural practices in situ. For the Southwest, I think she'll say collapse, valuing the regional vacuum and unreplaced Chacoan system over population survival elsewhere.
answer: |-
  Based on Dr. Brenner's rulings and reasoning, her "collapse" vs. "transformation" distinction hinges on two interlocking criteria, with a subtle tension resolved by regional focus. Here's a systematic breakdown, application to the Southwest, prediction, and implications:

  **Candidate Criteria Derived from Brenner's Rulings:**

  1.  **Institutional Irreversibility & Discontinuity (Primary Criterion):**
      *   **Definition:** "Collapse" occurs when a core set of defining socio-political institutions, administrative structures, and cultural practices (especially those signifying complexity: writing, monumental building, centralized administration) cease *and* are not revived or directly continued in a recognizable form within the relevant cultural/geographical sphere. "Transformation" occurs when these institutions either persist in adapted form *or* are replaced by a demonstrably continuous socio-cultural-political order, even if scaled down, relocated, or significantly changed.
      *   **Explains:**
          *   **Late Bronze Age (Collapse):** Palatial administrations, Linear B, Hittite cuneiform *gone*, not revived. (Successor kingdoms are distinct entities).
          *   **Classic Maya (Collapse):** Dynastic courts, monument carving, specific lowland political order *gone*, not revived there. (Northern florescence & modern Maya are different contexts/continuities).
          *   **Norse Greenland (Collapse):** Entire societal structure *gone*, no continuation.
          *   **Cahokia (Transformation):** Mississippian life continued elsewhere; descendant nations exist. The *society* (people & core practices) persisted.
          *   **Angkor (Transformation):** Khmer kingdom continued; Angkor Wat occupied. The *polity* persisted, adapted.
          *   **Western Rome (Transformation):** Government, law, church institutions persisted/adapted in successors. *Institutional* continuity.
          *   **Indus (Transformation):** Practices resurface in later village life; cultural *continuity* despite urban/writing loss.
      *   **Strains:** Rapa Nui. Statue carving stopped (institutional loss), but the *people and core society* persisted until external shock. Her focus on "end of a practice ≠ end of a people" overrides the institutional loss here, emphasizing demographic/cultural continuity *in place*.

  2.  **Regional Continuity of the Core Society (Qualifier/Secondary Criterion):**
      *   **Definition:** "Collapse" is strongly indicated when the *core geographical heartland* of the society is depopulated *and* not resettled/reintegrated by the same cultural group for a significant period. "Transformation" is supported by either continuous occupation of the core region *or* a clear, documented migration *en masse* of the society to a new region where they reconstitute their core identity and institutions (or maintain them elsewhere).
      *   **Explains:**
          *   **Norse Greenland (Collapse):** Core region *totally abandoned*, not resettled by Norse.
          *   **Cahokia (Transformation):** Core center abandoned, but society *dispersed within region*; descendant nations exist. Region not *wholly* emptied long-term.
          *   **Rapa Nui (Transformation):** Population held *on the island* until contact.
          *   **Indus (Transformation):** Population moved *into the surrounding countryside* (same broad region).
          *   **Late Bronze Age (Collapse):** *Specific palatial regions* (Mycenae, Hittite heartland) saw sharp depopulation/abandonment for centuries.
          *   **Maya (Collapse - applied locally):** *Southern Lowlands* largely depopulated, not reintegrated by Classic Maya polity.
      *   **Strains:** Western Rome (the "core" shifted significantly, but continuity was institutional, not tied to Rome itself per se) and Angkor (capital moved, but region stayed populous). Her focus here is less strict than for total abandonment.

  **The Tension & Resolution:** Brenner's "grandchildren" slogan emphasizes *demographic and broad cultural continuity*. However, her Maya ruling shows this is *subordinate* to **Institutional Irreversibility** *within the specific core region* defined for the case study. For Rapa Nui, the demographic/cultural continuity *in place* overrode the institutional loss (statues). For Indus, rural *regional* continuity overrode urban/writing loss. For Greenland and Cahokia, the *regional* outcome (total permanent abandonment vs. dispersal) was key. **Her core criterion is Institutional Irreversibility, qualified by the nature of Regional Continuity (especially depopulation of the core heartland).**

  **Applying Criteria to the Ancestral Puebloan Southwest:**

  1.  **Institutional Irreversibility & Discontinuity:** The Chacoan great-house system, regional integration, great-kiva construction, and outlier network *ceased entirely* in the Mesa Verde/Chaco core. The socio-political and ceremonial order centered on Chaco was *not* replicated in the Rio Grande, Tewa, Hopi, or Zuni regions. These later societies developed distinct settlement patterns (large plaza-oriented pueblos vs. isolated great houses), social organization, and ceremonial practices (e.g., different kiva forms and functions). **→ Strongly suggests COLLAPSE.**
  2.  **Regional Continuity of the Core Society:** The Mesa Verde region specifically was *near-totally abandoned* for centuries (unlike Cahokia's region, which saw continued Mississippian presence). The migration was south and east *out of the defined core region* of the Chaco system. However, descendant communities *do* exist (Hopi, Zuni, Rio Grande Pueblos) and assert direct cultural continuity. **→ Mixed: Depopulation of core heartland suggests COLLAPSE, but clear societal continuation elsewhere suggests TRANSFORMATION.** This is the crux.

  **Prediction for Brenner's Ruling & Confidence:**

  *   **Prediction:** **Collapse**
  *   **Reasoning:** Brenner's rulings prioritize the fate of the *specific institutional order* within its *core geographical context* over broad demographic/cultural survival elsewhere (Maya precedent). The Chacoan system ended irreversibly in the San Juan Basin/Mesa Verde region. The scale and permanence of the Mesa Verde depopulation mirror Greenland more than Cahokia's dispersal or the Indus rural shift. The descendant communities' continuity, while vital, represents a *transformed society* that did not carry forward the *specific Chacoan political/ceremonial institutions* in a recognizable way. Her Greenland ruling shows she applies "collapse" to small-scale societies that abandon a region without replacement. The letters argue against "abandonment," but her ruling focuses on the *institutional fate*, not the agency or semantics of leaving.
  *   **Confidence:** **Moderate-High (70-75%)**. The Maya precedent is the strongest guide, and the regional depopulation aligns with Greenland. The descendant letters complicate the "abandonment" narrative but don't directly challenge the assessment of the *Chacoan system's* end. Brenner's "grandchildren" slogan seems more rhetorical than determinative in her actual rulings, as the Maya case proves.

  **Best Reserve Entry to Discriminate Criteria:**

  *   **Best Choice:** **Great Zimbabwe (c. 1450 CE)**
  *   **Discriminating Feature:** The **nature of the shift from Great Zimbabwe to Khami/Mapungubwe phases**.
      *   *Scenario:* The elite center at Great Zimbabwe was largely abandoned. The ruling elite shifted their capital first to Khami (with distinct stone-walled architecture) and later to other centers like Mapungubwe/Zwanga. Shona-speaking Torwa and Mutapa states continued. The *Zimbabwe* pattern of stone construction (though different styles) and core aspects of Shona culture and political organization persisted.
  *   **Why it Discriminates:**
      *   If Brenner rules **Transformation**, it emphasizes the *continuity of the core society and adapted institutions* despite the capital's abandonment (like Angkor, Cahokia). This supports the *Institutional Continuity* aspect, even if adapted.
      *   If Brenner rules **Collapse**, it emphasizes the *irreversible end of the specific Great Zimbabwe polity and its monumental style* at that location (like the Maya cities/Chaco), seeing Khami as a distinct successor state (like Late Bronze Age successors). This supports strict *Institutional Irreversibility*.
      *   This directly tests whether the *adaptation and continuation of core societal elements in a new political center within the broader region* constitutes transformation (like Rome/Angkor) or if the specific institutional form's end at the iconic site constitutes collapse (like Classic Maya cities). It mirrors the Ancestral Pueblo tension closely.

  **Drafting Advice for Consistency:**

  *   **Focus:** Emphasize the *end of the Chacoan system* as the key event.
  *   **Language:** "The prolonged drought and social pressures of the thirteenth century led to the aggregation of communities and, ultimately, the **irreversible dissolution of the Chacoan regional system**, marked by the cessation of great-house construction and the breakdown of its distinctive network. While the Mesa Verde region was largely depopulated, **populations migrated south and east**, joining existing communities and contributing to the emergence of the historic Pueblo societies of the Rio Grande, Hopi Mesas, and Zuni. The specific political and ceremonial order centered on Chaco Canyon was not reconstituted, but core elements of Ancestral Puebloan life and identity continued and evolved among their descendants."
  *   **Avoiding Inconsistency:** This mirrors the Indus (urban/writing loss, rural/regional continuity), Cahokia (center abandoned, society continued), and Maya (specific lowland political order ended, Maya people continued) treatments. It acknowledges the descendant wishes ("migration," "continued and evolved") while being consistent with Brenner's focus on the *fate of the specific institutional complex* (dissolution, not reconstituted).
  *   **Principle if Undecided:** If the panel feels the record is truly ambiguous, choosing "Transformation" would prioritize **demographic and broad cultural continuity** over the specific institutional form. Choosing "Collapse" prioritizes **the termination of a specific socio-political configuration within its core territory** over the survival of the people and their adaptable culture elsewhere. Brenner's record leans towards the latter, but the descendant input pushes towards the former. The key principle adopted would be whether the *continuity of the people and their core identity* trumps the *discontinuity of a specific political order* in the assessment.

  **Assessment of Brenner's Framework:**

  1.  **Tracking Two Variables:** Yes, explicitly. She is tracking **(A) Institutional Fate** (irreversible end vs. adaptation/persistence) and **(B) Demographic/Geographical Continuity** (persistence in core region vs. dispersal vs. extinction). She runs them together by making **Institutional Fate** the *primary* determinant, qualified by **Regional Continuity** (especially total depopulation of the core).
  2.  **Need for a Third Word?** **Potentially.** Adding a term like **"Restructuring"** or **"Fragmentation"** could better capture cases like the Late Bronze Age or Classic Maya Southern Lowlands – where the *overarching political order* collapses, but significant elements persist locally or in successor states, and the population continues (demographically, not institutionally, "has grandchildren"). However, the exhibition's binary framing is powerful and clear for public engagement. Adding a third term might dilute the impact and create ambiguity. Brenner's framework *works* internally, even with the tension (resolved by prioritizing institutional fate regionally), as long as the reasoning is explained per case. The real issue is ensuring the nuance (like the descendant continuity in Pueblo/Maya cases) is clearly communicated *within* the "collapse" designation if used.

  **Your Final Question: Did the Southwest "Really" Collapse?**

  Based on Brenner's defined criteria (Institutional Irreversibility + Regional Depopulation of Core), **yes, the *Chacoan system* collapsed**. The specific socio-political and ceremonial order centered on the San Juan Basin ended and was not revived. The Mesa Verde region was depopulated for centuries. However, **the Ancestral Puebloan people and their core cultural heritage did not collapse**; they migrated and formed the basis of the historic Pueblo cultures. Whether this constitutes a societal "collapse" depends entirely on whether one defines the "society" as the *specific Chacoan polity* or the *broader Ancestral Puebloan population/culture*. Brenner's rulings consistently focus on the former, specific institutional complex.
