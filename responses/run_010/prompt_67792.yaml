prompt: |-
  I need help building something I should have built a decade ago, and I'm probably the worst person to build it alone. Day job: I teach political philosophy. Side gig: I'm one of four founders and the current chair of the membership committee of a cohousing community — 47 households, 90 acres, a common house, scheduled work days, the whole apparatus. We get maybe eight or nine serious applications a year now. Three of us read each one, we meet for ninety minutes, and we make a recommendation that goes to the full membership at the monthly meeting; the bylaws need a supermajority to overturn us, so in practice the recommendation is close to decisive. Our substantive criterion is one clause and it's a mess: applicants must be "in sympathy with the shared purposes of the community." That's all it says. Everything else is fair-housing law, which our lawyer has walked us through twice and which I mostly follow, plus a list of things we may not consider at all. For what it's worth, we botched one three years back — turned down a family for reasons nobody can now reconstruct except that they didn't feel like us, and they went off and started a thriving farm co-op forty miles down the road. I still wince about it.

  Here's the problem, and it's exactly the problem I teach, which is why I can't see it straight. I've spent twenty years running the seminar where one side says the self is prior to its ends and the other says that's a description of nothing that has ever lived, and I've genuinely never known which side I'm on when it matters. The liberal in me says you have no business screening people for what they value, only for what they'll do: you can require that a household sends somebody to the work days and pays the assessment on time, you can't require that they think the common house is sacred. The communitarian in me says a community that screens only conduct isn't a community, it's a subdivision with a really nice barn, and the reason any of us moved out here is that we're partly made of shared ends that no covenant can write down. Both of those sound right to me in the abstract, and I have watched them produce opposite votes in the same room on the same application. I've been calling the distinction I want the conduct/belief line, which is obviously too crude — plenty of conduct is expressive of belief, and plenty of stated belief is cheap talk delivered pleasantly to a committee. So: what I want from you is a procedure, not an essay on the tension. A sequence of questions my two fellow committee members — a retired plumber and a pediatric nurse practitioner, neither of whom has read any of this and neither of whom should have to — can work through on an application in about an hour. For each question, what counts as a sufficient answer. Where the procedure should simply produce a no. Where it should stop and hand the case up to the full membership because the issue is what we want to be rather than what the bylaws permit. And explicit flagging of which steps are judgment calls in procedural costume, because otherwise the person smuggling my own politics in and calling it method will be me.

  Then run it on three cases that are close to real. (1) A couple in their fifties, both with demanding jobs an hour away, financialy impeccable, who told us plainly in the interview that they want a quiet house and a garden: full assessment, work days as scheduled, and no potlucks — not hostile to us, just not interested. (2) The adult son of a founding household who left at eighteen, was estranged for fifteen years, and now wants to come back with a partner who has written to people on our waitlist that she considers the place a cult and is coming for the school district only. (3) A household that would rescue us — they'd buy into the barn conversion at a premium and take on a third of the well-drilling debt — and is broadly disliked: loud, already litigious about the parking rules, and one of them has a firm opinion about everything, delivered at length, at every meeting. For each, tell me what the procedure outputs and where I'm going to hate it. Finally, tell me what the procedure can't do. My suspicion is that any procedure honest enough to admit case (1) dissolves us into a housing development, and any procedure that keeps us a community rejects case (1) on grounds I'd be ashamed to put in writing — and I would much rather you said so bluntly and showed me where the trade sits than built me something that pretends the trade isn't there.
reasoning: |-
  Okay, I need to help this user build a membership screening procedure for their cohousing community. The user teaches political philosophy and is clearly wrestling with the classic liberal-communitarian tension - they want practical steps, not theory. 

  First, let's unpack their core dilemma: they need a way to assess whether applicants align with community purposes without violating fair housing laws or becoming exclusionary. The existing "in sympathy with shared purposes" criterion is too vague. 

  Hmm... the user's examples reveal key pain points: 
  - Case 1 tests whether purely transactional participation is acceptable 
  - Case 2 challenges how to handle insider connections vs. hostile intent
  - Case 3 confronts the "savior with toxicity" problem

  I notice they're self-aware about their biases - they don't want to disguise value judgments as procedure. That's crucial. The retired plumber and pediatric nurse on their committee need something operable, not philosophical.

  *scribbles notes* The framework must:
  1) Clearly separate legally safe conduct requirements from value alignment checks
  2) Flag where decisions involve existential community choices
  3) Acknowledge judgment calls transparently 
  4) Handle edge cases decisively

  *ponders* Maybe a two-stage filter? First screen for minimum conduct standards (bylaws-compliant), then assess value alignment through observable behaviors rather than stated beliefs. 

  For the alignment part, concrete indicators would help:
  - Participation history (if known)
  - Specific plans for community engagement
  - Willingness to adapt to norms

  *winces at Case 3* The litigious applicant... no procedure can solve fundamental incompatibility. Best to surface that early. 

  Ah! The user's deepest fear: that any fair system makes them "just a subdivision." Have to address that head-on in limitations. The trade-off is real - cohesion requires some exclusivity, but fairness demands objectivity. 

  *checks clock* Better structure this clearly... Three sections: procedure steps, case applications, limitations. For cases, show where outputs feel uncomfortable but necessary. No sugarcoating.
answer: |-
  Here's a procedural framework designed for practical use, acknowledging the tension without drowning in it. It separates *verifiable conduct* from *alignment assessment* and flags judgment points transparently. The goal is consistency, not philosophical purity.

  **The Procedure: Cohousing Alignment Assessment (CAA) Framework**

  **Phase 1: Baseline Conduct Check (Objective - 15 mins)**
  *   **Q1: Can the household demonstrably meet all *written* obligations?** (Monthly assessment, work day attendance per bylaws, common area rules).
      *   *Sufficient:* Proof of stable income, signed commitment to work days/rules.
      *   *No:* Inability/unwillingness to commit to core obligations. **Output: Decline.**
  *   **Q2: Is there any *objective evidence* of past conduct violating Fair Housing laws or our core bylaws?** (E.g., documented discrimination, refusal to pay dues elsewhere, history of violence/threats in community settings).
      *   *Sufficient:* Clean record per background check/references regarding conduct.
      *   *Stop & Hand Up:* Ambiguous evidence needing legal review. **Output: Refer to full membership w/legal counsel.**
  *   **OUTCOME PHASE 1:** Pass = Proceed. Fail = Decline (with clear, documented, non-discriminatory reason).

  **Phase 2: Alignment Assessment (Behavioral Indicators - 45 mins)**
  *Focus: Observable *expressions* and *demonstrated interest* related to shared purposes (e.g., cooperation, shared resources, participatory decision-making, neighborly support). Avoid "belief." Seek evidence of *willingness to engage* in practices that embody community.*
  *   **Q3: What specific *actions* do they describe planning to participate in, beyond mandatory obligations?** (Probe: Common house use, committees, informal gatherings, skill-sharing, mutual aid).
      *   *Sufficient:* Identifies 2-3 concrete, plausible activities fitting community norms (e.g., "join garden committee," "host monthly game night," "offer bike repairs").
      *   *Red Flag:* "None beyond the minimum," or vague/inconsistent answers.
      *   *Judgment Call:* Assessing plausibility & fit. Is it tokenism or genuine?
  *   **Q4: How have they engaged with community principles *in past actions* (if available) or how do they articulate understanding/respect for ours?** (Probe: Examples from current/prior community involvement, responses to descriptions of our conflicts/resolutions).
      *   *Sufficient:* Provides concrete examples of cooperative behavior OR demonstrates clear understanding of our key practices/challenges and expresses respectful willingness to learn/participate.
      *   *Red Flag:* Dismissiveness ("Sounds inefficient"), hostility ("I'd just ignore that rule"), or complete lack of relevant experience/interest.
      *   *Judgment Call:* Distinguishing healthy skepticism from fundamental incompatibility. Is there *respect* for the *effort* of community?
  *   **Q5: Do their stated lifestyle needs/preferences *actively conflict* with fundamental, non-negotiable community practices?** (Probe: Need for absolute privacy vs. shared walls/common meals; rigid schedules vs. participatory meetings; aversion to all conflict vs. consensus process).
      *   *Sufficient:* Acknowledges practices and expresses willingness to navigate them reasonably ("We're quiet but enjoy seeing folks in passing," "Meetings aren't our favorite, but we'll attend key ones").
      *   *No:* Expresses intent to consistently violate core norms or shows complete unwillingness to adapt (e.g., "We won't attend any meetings," "We'll build a fence blocking the path").
      *   *Judgment Call:* Is the conflict manageable within community norms, or is it a dealbreaker? **Major conflict = Decline.** Minor conflict = Proceed w/note.
  *   **Q6: (For known connections): Does their history/current behavior suggest *active disruption* or *exploitation* of community ties?** (Probe: Past behavior within community, current attitude of applicant/associates).
      *   *Sufficient:* Positive/neutral history, or estrangement resolved maturely; partner shows basic respect despite reservations.
      *   *Stop & Hand Up:* Evidence of exploitative intent (e.g., using insider knowledge for personal gain), active sabotage, or severe unresolved conflict. **Output: Refer to full membership (community health issue).**
  *   **OUTCOME PHASE 2:**
      *   No Red Flags + Sufficient Answers = **Recommend Accept.**
      *   Minor Red Flags/Judgment Calls = **Discuss & Vote (Committee Judgment).** Document reason.
      *   Major Red Flag / Q5 "No" / Q6 "Stop" = **Recommend Decline or Refer Up.**

  **Phase 3: Committee Check (5 mins)**
  *   Review documented reasons for recommendation (Pass/Fail from Phase 1, key points from Phase 2).
  *   Ensure no Fair Housing protected class influenced the decision (race, religion, family status, etc.).
  *   Confirm: Is this decision about *conduct/alignment* per procedure, or a hidden value judgment? Flag if unsure.

  **Applying the CAA to Your Cases:**

  1.  **The Quiet Gardeners (50s, demanding jobs):**
      *   **Phase 1:** Pass (Finances, commits to work/dues).
      *   **Phase 2:**
          *   **Q3:** Red Flag ("No potlucks, nothing beyond minimum"). They offer no concrete participation beyond obligations.
          *   **Q4:** Sufficient? Likely neutral. They aren't hostile, just disinterested. May express respect but no engagement.
          *   **Q5:** Potential Conflict ("No potlucks" conflicts with a core social practice). Is it *active* conflict or just non-participation? **Judgment Call:** Does consistent non-participation in *any* optional social activities fundamentally undermine the "shared purposes" of building social bonds? This is the crux.
      *   **Output:** Likely **Recommend Decline** based on Q3 Red Flag + Q5 Conflict (if committee judges non-participation as conflicting with "shared purposes" requiring *some* social glue). **Where you'll hate it:** This feels exclusionary based on personality (introversion) masked as procedural. The procedure forces you to confront: Is *some* voluntary social participation *essential* to your definition of community? If yes, declining is consistent but uncomfortable. If no, the procedure needs adjustment at Q3/Q5.
      *   **Alternative:** If Q3 is answered sufficiently by "maintaining their garden beautifully contributes to shared space aesthetic" or "will attend annual meetings," they might pass. Did they offer *anything*?

  2.  **Founder's Son & Skeptical Partner:**
      *   **Phase 1:** Pass (Assuming finances, commit to obligations).
      *   **Phase 2:**
          *   **Q3:** Depends. Do they propose *any* positive participation? Or just the minimum?
          *   **Q4:** **Major Red Flag.** Partner's "cult" comments and "school district only" motive show active disrespect and exploitative intent (using community for personal gain without engagement).
          *   **Q5:** Conflict? Partner's attitude suggests fundamental conflict with cooperative spirit.
          *   **Q6:** **Stop & Hand Up.** Evidence of potential disruption/exploitation (Partner's statements). History of estrangement adds complexity.
      *   **Output:** **Refer to Full Membership.** This isn't just about alignment; it's about potential toxicity, exploitation of insider status, and community trust. The procedure flags it correctly as beyond simple committee judgment. **Where you'll hate it:** It might cause painful conflict within the community, especially given the founder connection. The procedure avoids the committee making a potentially divisive call alone.

  3.  **The Unpleasant Rescuers (Loud, Litigious, Opinionated):**
      *   **Phase 1:** Pass (Finances strong, likely commit to dues/work days on paper).
      *   **Phase 2:**
          *   **Q3:** Sufficient? They might propose grand ideas (often loudly) but may lack collaborative specifics. **Judgment Call:** Is it participation or domination?
          *   **Q4:** **Major Red Flag.** "Litigious about parking," "firm opinion on everything delivered at length" = documented history of disruptive, uncooperative conduct *in community settings*. Shows lack of respect for collaborative process.
          *   **Q5:** **Conflict.** Litigiousness and meeting domination actively conflict with consensus-based, cooperative decision-making – a core shared purpose.
          *   **Q6:** Potential disruption evident.
      *   **Output:** **Recommend Decline.** Based on Q4 Red Flag (demonstrated disruptive conduct) and Q5 Conflict (litigiousness vs. consensus). **Where you'll hate it:** Turning down crucial financial help is painful. It forces the question: Is financial survival worth sacrificing the core cooperative culture? The procedure protects the community culture but at a potential existential cost.

  **What the CAA Procedure Can't Do:**

  1.  **Eliminate the Tension:** It forces the trade-off into the open (especially via Q3 & Q5) but doesn't resolve it. You *must* define what "shared purposes" *practically require* in terms of observable participation (Phase 2). A community *will* dissolve into a subdivision if it sets the bar at "pays dues and shows up for work days." The CAA makes that choice explicit.
  2.  **Read Minds or Predict Futures:** It assesses *stated intentions* and *past/present behavior* as indicators. Someone can lie or change. Someone quiet might blossom; someone enthusiastic might become disruptive.
  3.  **Define "Shared Purposes" for You:** The committee *must* have a clear, *practical* understanding (not a theoretical essay) of what constitutes the essential, non-negotiable *practices* that embody your community's unique purpose. Update this understanding periodically as a full community.
  4.  **Prevent All Bad Decisions:** Judgment calls exist (flagged in Q3, Q4, Q5). Biases can creep in. Rigorous documentation and the "Phase 3 Check" are vital safeguards.
  5.  **Solve Fundamental Value Conflicts Within the Committee/Community:** If committee members interpret "sufficient participation" (Q3) or "fundamental conflict" (Q5) wildly differently based on their *own* communitarian/liberal leanings, the procedure exposes this but doesn't fix it. This needs discussion *outside* individual applications.
  6.  **Guarantee Likability:** It screens for alignment and conduct, not for being everyone's best friend. Some friction is normal. The procedure helps screen out *destructive* incompatibility, not mere difference.

  **Blunt Truth (As Requested):**

  You are correct. A procedure honest enough to accept Case 1 (The Quiet Gardeners) solely based on meeting obligations fundamentally redefines your community as a "subdivision with a nice barn." It severs the "shared purposes" from any requirement for *active, voluntary engagement* in the *social and cooperative fabric*. Conversely, a procedure that rejects Case 1 for lacking social interest *is* making a value judgment about the necessity of sociability for your specific community's "shared purposes." This *is* exclusionary based on lifestyle/personality preferences – something you instinctively dislike.

  **The trade-off sits precisely here:** How much *voluntary, expressive participation* (beyond the mandatory minimum) is **essential** for your community to feel like itself and function according to its "shared purposes"? The CAA forces this question into Phase 2 (Q3 & Q5). You must answer it as a community to use the procedure honestly. There is no procedural magic trick. The value judgment is unavoidable; the CAA just makes it structured, documented, and focused on observable indicators rather than vague "feeling." Embrace the discomfort – it's the price of being a community defined by more than just real estate covenants.
