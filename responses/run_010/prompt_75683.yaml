  - **(d) Original**: Choosing ≠ preferring. Choices may deviate from true preference due to obligation, multiple orderings, etc., causing systematic misdescription.  
    **Restatement**: Observed choices (labels) may not reflect the true preference due to bias (e.g., social constraints) or multi-objective conflicts (e.g., personal vs. ethical goals). Treating chosen items as "preferred" introduces systematic label noise, corrupting the estimated score.  
