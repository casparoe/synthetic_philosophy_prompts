  **Q3. Comparing utilities across persons:**  
  Yes, it translates directly: Scores fitted to different datasets (e.g., different users) lack a common scale without calibration or explicit alignment (e.g., cross-user normalization).  

  **Q4. Normative rationalization vs. data fit:**  
  **No counterpart**. Your vocabulary evaluates models by predictive accuracy (e.g., held-out NDCG) or ranking loss. The normative question ("better for the agent") assumes an external welfare standard independent of choice data—explicitly rejected in (a) and absent in your framework. This is a gap.  

  **Q5. Specification gaming:**  
  **Artifact of your external loss function**. Specification gaming occurs when a model optimizes a proxy loss (e.g., pairwise accuracy) but undermines the true goal (e.g., user satisfaction). In (a)–(e), no external loss exists: choice data *defines* utility. (d) and (e) hint at misalignment (choice ≠ preference), but they lack your instrumentalist setup.  

