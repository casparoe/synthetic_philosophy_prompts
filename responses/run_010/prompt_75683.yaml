  - **(c) Original**: Utility is ordinal; data fixes only an ordering, not scale/origin. Monotone transformations preserve representation.  
    **Restatement**: Scores are identifiable only up to monotonic transformations. The data (pairwise comparisons) only constrain the order of scores, not their absolute values or intervals. Any strictly increasing function applied to the scores yields identical predictions on the training set.  
