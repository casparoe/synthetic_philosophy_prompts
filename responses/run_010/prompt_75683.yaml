  **Q1. Emptiness objection (a):**  
  Collapses partially into the unfalsifiability of an unconstrained model on its training set. But residue remains: The original emphasizes that consistency axioms (e.g., transitivity) are falsifiable *within the training data itself*, without held-out evaluation. Your vocabulary typically relies on held-out data for falsifiability, so the residue is the idea of *internal consistency as a falsification mechanism*.  

  **Q2. Ordinality (c):**  
