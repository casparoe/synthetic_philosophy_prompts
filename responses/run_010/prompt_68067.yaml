prompt: |-
  I am in the second year of a philosophy doctorate, and for the past two terms I have been working through normative uncertainty in a reading group. I can run the standard machinery competently: assign credences to the moral theories I take seriously, put their verdicts on a common scale where that is possible, and choose the option with the highest expected choice-worthiness; on the examples we were given in the seminar, it delivers answers I am happy with. The difficulty is that when I write down what I actually think about cases of my own devising, my verdicts diverge from the machinery in a way that looks systematic rather than arbitrary, and I have not been able to state the pattern. I have been asked to present something in the department's work-in-progress series in a few weeks, and I would rather bring a question that is genuinely unresolved for me than a summary of positions. One friend's diagnosis, offered half in jest, is that I simply do not hold the credences I claim to hold, and that everything else is rationalization; I suspect there is something to this, but I cannot tell whether it can be made into a coherent view.

  Here are the verdicts, as honestly as I can report them. (a) On charitable giving I divide roughly 60/40 between a fairly demanding consequentialist view and a commonsense view on which aid past a modest threshold is supererogatory. I think I ought to give well above the commonsense threshold; the wide range of the demanding view outweighs my greater confidence in the permissive one. (b) On a particular false statement to a colleague I give 25% to a rigorist view on which it is a grave wrong of roughly the same kind as betrayal, and 75% to a view on which it is morally unremarkable. The two views disagree about whether any distinction is in play at all: the rigorist thinks everything turns on the difference between asserting what one believes false and merely permitting a misleading impression, a difference the other view denies is morally real. My verdict: I feel almost no pull from the rigorist view. I would behave as though its probability were close to zero, and I would not be surprised to learn that I had been treating it that way all along. (c) On diverting a threat onto one person instead of five I am split evenly between a view that forbids diverting and a view that forbids refraining. Here both views agree completely about what the situation is — one agent, five lives, a switch — and disagree only about how it is to be valued. My verdict: the disagreement is fully live, it makes me hesitate, and it disposes me to hunt for a third option both views rank acceptably. On the surface (b) and (c) look alike — substantial credence on each side, substantial stakes either way — yet only (c) moves me, and my hunch is that the difference has nothing to do with stakes and everything to do with whether the theories share a description of the act. (d) On long-haul air travel, one view I give 55% holds that flying and purchasing offsets is a genuine third option, distinct from flying simpliciter; another I give 45% holds that no such option exists, so the choice set contains only flying and not flying. My verdict: I do not average across the two choice sets. I first settle whether offsetting is a thing, and I settle it by asking which view I trust more about what such a transaction could possibly amount to — a descriptive question — rather than by asking which I trust more about what is permissible; and once settled, I experience no residual unease, despite retaining 45% credence in the view I discarded. (e) On procedure, I am evenly split between maximizing expected choice-worthiness and simply acting on whichever first-order theory I believe most. My verdict: I go with the favourite theory, but I feel faintly as though I have broken a rule — which is the opposite direction of trade from (a), where the low-credence, high-range theory won outright. (f) The case I keep returning to: a view I give 5% says that an entirely ordinary purchase of mine makes me a participant in something horrific. The view is internally coherent and its argument is not obviously bad, but its conclusion depends on describing the purchase as participation rather than as a causally remote and negligible contribution, a description the rest of my credal distribution rejects as drawing no real distinction. Compare a second 5%-credence view, which says that the treatment of animals in food production is torture; there, everything in my distribution agrees about what is happening and disagrees only about how to value it. My verdict: in the first case I do nothing and do not feel akratic; in the second I have changed my behaviour considerably.

  What I would like is a principle, or a small set of candidate principles, that generates these verdicts — or that gets as close as possible while telling me plainly where it must break with me. In particular: can the underlying idea be stated precisely enough to be applied rather than gestured at, something to the effect that a theory's effective weight is reduced in proportion to how much of its verdict depends on distinctions that the other theories in my distribution deny are real? If so, which clause of it does each case motivate, and which of my cases come out differently under the simpler alternatives I can think of — plain expected-choice-worthiness maximization, expected-choice-worthiness maximization applied only after fixing an act-description by something like a vote across theories, a favourite-theory rule, and a maximin or robustness rule? I also want the admissibility objection taken seriously: my principle appears to let my credences depend on the decision procedure I am using, when credences are supposed to be inputs to it. Can that be answered — perhaps by insisting that what is really going on is a claim about how to individuate the objects of my uncertainty, so that the rigorist view in (b) is not a rival moral theory at all but a moral theory plus a contested descriptive claim, and I have been miscounting my theories — or is it fatal? Then tell me what the principle predicts where I have no verdict yet: two theories that draw exactly the same fine distinctions but assign them opposite weights; a disputed description that is backed by non-moral evidence, such as settled facts about what my purchase causally does; and a case in which every theory I take seriously agrees on the description, where the principle ought to switch off and ordinary expected-choice-worthiness reasoning to return. Finally, be candid about which of my verdicts the principle cannot save, and if it has to overturn (e) rather than (a), explain why that is the cheaper sacrifice. Do not trouble yourself with references; I will supply those once I know what position I am actually defending.
reasoning: |-
  Okay, let me start by really understanding what this philosophy doctoral student is grappling with. They're working on normative uncertainty, particularly how to make decisions when they're uncertain about which moral theory is correct. They've been using the standard approach—assigning credences to different theories, scaling their choice-worthiness, and maximizing expected value. But their intuitive judgments in specific cases don't match this method, and they've noticed a pattern they can't quite articulate. They need to present this as a work-in-progress and want to propose a principled explanation rather than just summarizing existing views.

  First, I need to look at their cases carefully. In (a), charitable giving, they side with the low-credence consequentialist view because its stakes are higher. In (b), lying to a colleague, the rigorist view has 25% credence but feels negligible. In (c), the trolley problem split, both sides feel equally weighty. In (d), carbon offsets, they resolve the descriptive issue first. In (e), they prefer the favorite theory despite split credence on the procedure itself. In (f), two 5% credence views—one about purchasing as participation (ignored) and one about animal torture (acted upon).

  The key insight here seems to revolve around whether theories agree on the descriptive facts or not. When theories disagree on what the act *is* (like in b, d, and the first part of f), the student discounts the theory that relies on contested descriptions. When they agree on descriptions but disagree on evaluations (like in c and the second part of f), the uncertainty feels real and affects their decision. Case (a) is an exception where stakes override this, and (e) is a meta-issue about the decision procedure itself.

  So, the proposed principle is about discounting theories based on how much their verdict depends on descriptive claims contested by other theories in the distribution. This isn't about belief strength but about the structure of disagreement. The student is implicitly treating descriptive disagreements as needing resolution before moral evaluation, which makes sense because if theories don't agree on what's happening, their moral evaluations might be talking past each other.

  Now, considering possible objections. The admissibility objection is crucial: can credences depend on the decision procedure? The answer might be reframing the uncertainty. Instead of seeing the rigorist view in (b) as a moral theory, it's a bundle of descriptive and normative claims. The credence should apply to the core moral principle, conditional on the descriptive claim being true. But since the descriptive claim is contested, it needs separate assessment. This avoids circularity by separating descriptive and normative uncertainties.

  Testing the principle against alternatives. Pure expected choice-worthiness fails in cases like (b) and (d). Voting on act descriptions might work in (d) but not in (b) where the rigorist's descriptive claim is niche. Favorite theory fails in (a). Maximin would be too conservative. The proposed principle handles most cases but might struggle with (a) where stakes override descriptive agreement. Here, stakes and credence interact differently, suggesting a secondary role for stakes when descriptive agreement is present.

  For unresolved cases, the principle predicts that if theories agree on descriptions but disagree on weights, full normative uncertainty applies. If descriptive disagreement is backed by non-moral evidence, it might be resolved independently. Where all theories agree on descriptions, standard expected choice-worthiness should apply.

  The student's case (e) is the trickiest. They feel conflicted about the procedure itself. The principle might need to treat procedural uncertainty differently or accept that (e) is an outlier. Sacrificing consistency in (e) for the sake of the other cases might be necessary, as (e) involves meta-uncertainty rather than first-order moral decisions.

  Overall, the principle explains most of their intuitions by focusing on descriptive agreement. The key is disentangling descriptive and normative components, adjusting how theories are weighted based on whether their descriptive foundations are shared or contested. This approach maintains credences as inputs by refining what the uncertainty is about, thus avoiding the admissibility objection. The student's work can position this as a refinement of normative uncertainty frameworks, emphasizing the need to clarify the objects of uncertainty.
answer: |-
  Based on your cases and the systematic divergence from standard expected choice-worthiness (ECW) maximization, I propose the following core principle and its operationalization. It centers on whether the moral theories in your credence distribution *share a common descriptive ontology* for the act in question. When they don't, theories relying on contested descriptions are discounted.

  **The Principle (Ontological Anchoring):**  
  A theory's *effective weight* in ECW calculation is reduced proportionally to how much its *moral verdict relies on descriptive distinctions that are not recognized (or are actively denied) by a significant portion of your credal distribution*. Specifically:

  1.  **Effective Weight Adjustment:** For a theory \(T_i\), its effective credence \(c_i^*\) is:
      \[
      c_i^* = c_i \times (1 - d_i)
      \]
      Where:
      *   \(c_i\) is your stated credence in \(T_i\).
      *   \(d_i\) (the *ontological discount factor*, \(0 \leq d_i < 1\)) measures the *proportion of the justificatory burden* for \(T_i\)'s verdict that falls on descriptive claims rejected by theories holding substantial aggregate credence in your distribution. (Operationalized below).
  2.  **Calculating \(d_i\):**
      *   Identify the key descriptive claim(s) \(D_i\) that \(T_i\) *requires to be true* for its verdict to apply to the act in question, and which are *not shared* by rival theories holding non-negligible credence (e.g., >10% aggregate).
      *   Estimate the *counterfactual stability* of \(T_i\)'s verdict: How likely is \(T_i\) to hold the *same* moral verdict if \(D_i\) were false (given the descriptive facts agreed upon by other theories)? If the verdict is highly unstable (changes dramatically without \(D_i\)), \(d_i\) is high. If the verdict is stable (similar verdict likely even under rival descriptions), \(d_i\) is low.
      *   \(d_i \approx 1\) if \(T_i\)'s verdict *entirely hinges* on a contested \(D_i\) and collapses without it. \(d_i \approx 0\) if \(T_i\)'s verdict is robust across plausible descriptive interpretations shared by other theories.
  3.  **Decision Rule:** Maximize Expected Choice-Worthiness using the *effective credences* \(c_i^*\) and the theories' choice-worthiness functions.

  **How It Explains Your Cases:**

  *   **(a) Charitable Giving (60% Demanding C, 40% Permissive):**
      *   *Descriptive Agreement:* Both theories largely agree on the act's description ("giving money to aid org X"). They disagree on the *evaluation* (obligatory vs. supererogatory).
      *   *Discounting:* \(d_C \approx 0\), \(d_P \approx 0\). ECW proceeds normally with \(c_i^* \approx c_i\). High stakes of C outweigh your slightly higher credence in P. **Matches verdict.**
  *   **(b) False Statement (25% Rigorist, 75% Unremarkable):**
      *   *Descriptive Disagreement:* Rigorist (\(R\)) requires a sharp distinction between "asserting falsehood" and "permitting misleading impression" (\(D_R\)). Unremarkable view (\(U\)) denies \(D_R\) is real or morally relevant.
      *   *Counterfactual Stability:* \(R\)'s grave wrong verdict *entirely depends* on \(D_R\). If \(D_R\) is false (as \(U\) claims), \(R\) would likely see the act as unremarkable too. \(d_R \approx 1\).
      *   *Effective Credence:* \(c_R^* = 0.25 \times (1 - 1) \approx 0\). \(U\) dominates. **Matches verdict** (no pull from R).
  *   **(c) Trolley Divert (50% Don't Divert, 50% Must Divert):**
      *   *Descriptive Agreement:* Both theories agree completely on the physical act ("throwing switch diverting threat from 5 to 1") and the outcomes.
      *   *Discounting:* \(d_{DD} \approx 0\), \(d_{MD} \approx 0\). ECW proceeds normally with \(c_i^* = c_i\). Full normative uncertainty remains, causing hesitation. **Matches verdict.**
  *   **(d) Carbon Offsets (55% Offsets Real, 45% Offsets Fake):**
      *   *Descriptive Disagreement:* Theory OR (Offsets Real) requires \(D_{OR}\): "Purchasing offset X constitutes a genuine counteracting of emissions." Theory OF (Offsets Fake) denies \(D_{OR}\).
      *   *Discounting Calculation:* You resolve \(D_{OR}\) *first* based on descriptive plausibility (not moral permissibility). Suppose you side with OR (55% credence). For OF:
          *   OF's verdict ("choice is only fly/don't fly") *entirely depends* on \(D_{OF}\) (the denial of \(D_{OR}\)).
          *   If \(D_{OR}\) is true (as OR claims), OF's description of the act is simply wrong. \(d_{OF} \approx 1\).
          *   \(c_{OF}^* = 0.45 \times (1 - 1) \approx 0\).
      *   *Result:* Effectively, you act under OR. No unease because OF was ontologically discounted into irrelevance. **Matches verdict.**
  *   **(e) Procedure Choice (50% ECW, 50% Favourite Theory):**
      *   *This is a meta-case.* Ontological Anchoring primarily targets first-order normative uncertainty. Applying it here is awkward.
      *   *Possible Application:* The theories disagree *descriptively* about the correct decision-procedure object. ECW requires the procedure to be "maximizing expectation over choice-worthiness," FT requires it to be "acting on the modal theory." Significant \(d_i\) for both? But then \(c_i^* \approx 0\) for both, yielding paralysis, not your verdict.
      *   **Mismatch:** Your verdict (acting on FT, feeling faintly rule-breaking) isn't generated well. This suggests procedural uncertainty might need different treatment or that your action reflects a deeper commitment to favourite theories *when procedures clash*. Sacrificing this case might be necessary.
  *   **(f1) Ordinary Purchase = Participation (5%):**
      *   *Descriptive Disagreement:* Theory P requires \(D_P\): "This purchase constitutes *participation* in horrific system." Other theories (95%) describe it as "causally remote negligible contribution" and deny the reality/salience of \(D_P\).
      *   *Counterfactual Stability:* P's horrific verdict *collapses* without \(D_P\). If the purchase is merely a negligible contribution, P would likely not condemn it. \(d_P \approx 1\).
      *   \(c_P^* \approx 0\). **Matches verdict** (no action, no akrasia).
  *   **(f2) Animal Treatment = Torture (5%):**
      *   *Descriptive Agreement:* All theories agree on the descriptive facts of "what is happening" in animal agriculture. They disagree on the *evaluation* (is it torture?).
      *   *Discounting:* \(d_i \approx 0\). Standard ECW applies with full \(c_i\). The 5% credence, combined with the high stakes (torture), drives behavioral change. **Matches verdict.**

  **Addressing the Admissibility Objection:**

  The objection is serious: credences (\(c_i\)) seem to depend on the discounting procedure (\(d_i\)) that uses the credal distribution itself, violating their role as inputs.

  *   **The Reframing Solution (Plausible):** Ontological Anchoring isn't *adjusting credences*. It's revealing that you've *mis-individuated the objects of normative uncertainty*. What you called a single "moral theory" (e.g., the Rigorist view in (b)) is actually a *package*:
      1.  A *core normative principle* (e.g., "Knowingly asserting falsehoods is gravely wrong").
      2.  A *specific descriptive claim* (\(D_R\): "This act is a knowing assertion of a falsehood").
      Your credence \(c_i\) applies to the *whole package*. Ontological Anchoring suggests you should instead assign:
      *   A credence \(c_N\) to the *core normative principle* (conditional on its descriptive presuppositions holding).
      *   A separate credence \(c_D\) to the *descriptive claim* \(D_i\) being true/fundamental.
      The effective weight for the *moral verdict* in your decision is then \(c_N \times c_D\). This separates descriptive and normative uncertainty cleanly. \(c_D\) is informed by *all* your evidence (including the testimony of other theories about which distinctions are real). Your cases suggest you often set \(c_D \approx 0\) for claims like \(D_R\) or \(D_P\) based on the consensus of your distribution. This reframing answers the objection: \(c_N\) and \(c_D\) *are* the proper inputs; Ontological Anchoring is a way to approximate this decomposition from your starting point.
  *   **Fatal if Not Reframed:** If Ontological Anchoring is seen *only* as a procedural adjustment *after* fixing \(c_i\), the admissibility objection is likely fatal. It creates problematic circularity.

  **Predictions for Unresolved Cases:**

  1.  **Same Fine Distinctions, Opposite Weights (Descriptive Agreement):**
      *   *Prediction:* \(d_i \approx 0\) for both theories. Full ECW applies. Significant credence on both sides with high stakes will cause strong normative uncertainty and hesitation, akin to (c). Stakes will heavily influence the outcome.
  2.  **Disputed Description Backed by Non-Moral Evidence:**
      *   *Prediction:* Ontological Anchoring focuses on whether the descriptive claim is *accepted/rejected by the credal distribution*. Strong non-moral evidence supporting the claim (e.g., clear causal data about your purchase) should increase \(c_D\) (the credence in the descriptive claim itself), reducing \(d_i\) for the theory relying on it. If the evidence convinces *you*, it should also increase the credence you assign to theories *accepting* that description. The discount factor \(d_i\) responds to the *distribution's* ontological stance, which should be sensitive to good evidence. If the evidence is overwhelming, \(d_i \to 0\) even if one theory initially denied it.
  3.  **Universal Descriptive Agreement:**
      *   *Prediction:* \(d_i = 0\) for all theories. Ontological Anchoring "switches off." Standard ECW maximization applies. This is the baseline case (like (c) without the procedural hesitation in (e)).

  **Candor on Limitations and Costs:**

  1.  **Case (e) is the Weakest Link:** As argued, Ontological Anchoring struggles with procedural uncertainty. Your verdict (acting on FT) isn't generated. Explaining why sacrificing (e) is cheaper:
      *   **Frequency:** Cases like (a)-(d), (f) are core instances of *first-order* normative uncertainty applied to real-world actions. (e) is meta-uncertainty about the *decision rule itself*, arguably rarer and more philosophical.
      *   **Stakes:** The cost of getting (e) "wrong" in your model is procedural unease. The cost of getting (a)-(d), (f) wrong is potentially significant moral error in concrete actions.
      *   **Coherence:** (a) and (e) seem in tension under simple rules (FT vs. ECW). Ontological Anchoring cleanly explains (a) (it's ECW under descriptive agreement) and sidesteps (e). Sacrificing (e) preserves coherence for the more numerous and higher-stakes cases. You might handle (e) by saying that when uncertain *about procedures*, you fall back to the first-order FT rule as a default, acknowledging it's suboptimal if ECW is correct.
  2.  **Case (a) vs. Stakes:** Ontological Anchoring explains (a) well. However, a pure stakes-based explanation (like Bales et al.'s variance voting) *might* explain (a) and (f2), but it **fails catastrophically on (b) and (f1)**: the low-credence, high-stakes Rigorist and Participation views *should* dominate, contradicting your verdicts. Ontological Anchoring's focus on ontological grounding explains *why* stakes only matter when descriptions are shared.
  3.  **Operationalizing \(d_i\):** While the concept (dependence on contested ontology) is clear, precisely quantifying "proportion of justificatory burden" or "counterfactual stability" is subjective. It requires judgment. However, your clear intuitions in the cases suggest you *can* make these judgments robustly in practice. The principle gives a framework for that judgment.
  4.  **The Admissibility Workaround:** The reframing solution (splitting normative and descriptive uncertainty) is promising but requires rethinking how you individuate theories. It adds complexity. Some might argue it pushes the problem back to assigning \(c_D\), but this feels more honest.

  **Conclusion:**

  The Ontological Anchoring Principle, particularly under the reframing that separates descriptive and normative uncertainty, provides a coherent and powerful explanation for the systematic divergence between your intuitive verdicts and standard ECW maximization in cases (a)-(d) and (f). It captures the critical role of shared descriptive grounding in making normative uncertainty "feel real" and actionable. Case (e) remains an outlier, but sacrificing it is the "cheaper" option given its meta-nature and the principle's success elsewhere. The principle makes clear predictions for new cases and directly addresses the core pattern you identified: theories lose effective weight when their verdicts depend on contested descriptions denied by your other credences. This positions your work as a significant refinement of normative uncertainty frameworks, emphasizing the interplay between descriptive ontology and normative weight.
