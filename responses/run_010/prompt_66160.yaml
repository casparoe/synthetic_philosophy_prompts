answer: |-
  Your analysis is exceptionally sharp—you've identified core structural problems that paralyze the debate. Below is a systematic diagnosis and assessment based on your framework:

  ### 1. **Diagnosis of the Disagreement**  
  The conflict operates at **four interlocked levels**, with **evidentiary standards** and **bedrock intuitions** being primary:  
  - **Semantic Divergence**: Terms like "cult," "goddess," or "art" carry implicit modern baggage (e.g., "religion" vs. "ritual practice," "pornography" vs. "fertility charm"). Competing sides weaponize these definitions to dismiss rivals.  
  - **Evidentiary Thresholds**:  
    - *Ethnographic analogy*: Proponents of (i) and (v) invoke cross-cultural fertility symbols/trade tokens; skeptics (vi) note the 25,000-year chasm invalidates direct parallels.  
    - *Breakage interpretation*: Ritualists (i) see deliberate fragmentation as sacrificial; functionalists (iii, iv) attribute it to reuse/discard; deflationists (vi) deem it taphonomic noise.  
  - **Agent Permissions**: Theories (ii) and (iv) clash over *whose agency* is archaeologically legible—patriarchal fantasies vs. female self-fashioning—a battle over reconstructing prehistoric subjectivity.  
  - **Bedrock Intuitions**: The irreconcilable divide is whether *symbols require systemic meaning*. Camp (vi) sees pareidolia in seeking "purpose"; others insist pattern demands explanation.  
  **→ Dominant Factor**: **Evidentiary standards**, especially *directionality of inference*. Does stereotypy imply shared doctrine (i), or is it a technical constraint (vi)? Does variability signify local meaning (iii), or is it noise? Each side treats its axioms as self-evident.  

  ### 2. **Assessment of the Triple-Explanans Test**  
  Your test is **necessary but insufficient alone**. It correctly exposes cherry-picking but risks false negatives:  
  - **Strengths**:  
    - Forces engagement with *all* salient data: e.g., (i) addresses stereotypy but ignores fragmentation; (ii) invokes sexual charge but dismisses clothing evidence.  
    - Surviving partial theories:  
      - **(iii) "Dressed women"** explains local variability (headdress details) and some breakage (wear/discard), but not trans-regional uniformity.  
      - **(v) Exchange tokens** accounts for wide distribution and deposition in middens (lost/discarded), but not exaggerated anatomy.  
  - **Weaknesses**:  
    - No single theory *should* pass if figurines had **multiple context-dependent uses** (e.g., ritual objects later repurposed as teaching aids).  
    - **Doesn’t condemn all equally**: It eliminates monocausal claims (i, ii) but permits combinatorial models (e.g., "local ritual objects exchanged regionally").  
  **→ Verdict**: The test is **valid discriminatively** but must accommodate layered explanations.  

  ### 3. **The Malformed Question & Better Alternatives**  
  **"What were they for?" is indeed malformed**. It assumes:  
  - A unified "tradition" across 20,000+ years and 6,000 km.  
  - A tool-like function, ignoring that objects can hold **fluid, symbolic, or non-utilitarian roles**.  

  **Better questions**:  
  - *"What social/ritual practices might these objects have enabled in specific contexts?"*  
    - Shifts focus from teleology to *effects* (e.g., facilitating exchange, encoding kinship).  
  - *"How did their roles vary across time/space given shared formal traits?"*  
    - Accepts multiplicity: e.g., Siberian figurines as clan markers vs. European as body-maps.  
  **→ Persistent talking points**: Even with perfect evidence, (i) "goddess" theorists and (vi) symbolic nihilists would clash over *what constitutes "religion"* in prehistory.  

  ### 4. **What Would Count as Progress**  
  **Transformative findings** must *constrain possible interpretations* by addressing your trilemma:  
  | **Finding Type**          | **Adds New Theory** | **Resolves Debate** |  
  |---------------------------|---------------------|---------------------|  
  | Residue analysis (ochre, blood) | ✓ If ambiguous | ✓ If *same* substance on figurines from distinct regions |  
  | Micro-wear from handling   | ✓ (e.g., "amulet use") | ✓ If wear patterns correlate with posture (e.g., clutch vs. display) |  
  | Figurines depicted in cave art | ✓ ("ritual context!") | ✓ If shown in *use-context* (e.g., held in ceremonies) |  
  | DNA/protein from touch    | ✓ ("only women!")   | ✓ If makers/users were *cross-regionally uniform* (e.g., all post-menopausal women) |  
  | Spatial statistics         | —                  | ✓ If figurine fragments cluster in *non-domestic zones* (e.g., cave corners vs. middens) |  
  **Key**: Progress requires evidence that **simultaneously** addresses stereotypy, variability, *and* deposition.  

  ### 5. **Birka Grave Lesson & Application**  
  The Birka case shows:  
  - **Overturned inference**: Object-to-person links (weapons → male) were empirically falsified.  
  - **Persistent disagreement**: Shifted to *semantic renegotiation* ("Can a woman be a warrior?").  

  **Application to figurines**:  
  - A **decisive finding** (e.g., DNA proving all makers were adolescent girls) would:  
    - Destroy theories (ii) ("male gaze") and (i) ("mother goddess").  
    - But relocate debate: E.g., "Were girls' rituals religious (i) or pedagogical (iv)?"  
  **→ Lesson**: Science can *constrain* interpretations but not settle *meaning* without cultural context.  

  ### Final Verdict  
  - **Resolution unlikely**: The corpus spans too much time/space; meanings were likely fluid and irrecoverably lost.  
  - **Limit**: Reflects a **general problem** in inferring belief from objects, but **exacerbated here** by:  
    - The figurines' **symbolic opacity** (no written/depicted context).  
    - **Archaeology's inertia**: Theories harden into "camps" resistant to combinatorial models.  
  - **Your Hypothesis**: Largely **correct**—but add that *multiplicity* is the solution. I propose:  
    > **"These objects served as polysemous social tools, their meanings emerging from context-specific interactions—ritual, pedagogical, or identitarian—within a shared visual lexicon of the female body."**  

  **Path forward**: Abandon the "single purpose" paradigm. Use your trilemma to build a geographic/temporal map of variability-in-uniformity, treating breakage, material, and form as clues to *local practices* within a broad tradition. The debate persists not for lack of evidence but from *overreach*—denying prehistory its complexity.
