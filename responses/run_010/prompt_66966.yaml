prompt: |-
  My aunt is the integrity officer for a mid-size NGO that builds water systems — like wells and piped networks — in three countries, and she's the person who makes the final call whenever a country director isn't sure if something is a bribe or just normal life. She treats her cases like puzzles and brings them to family dinners, so I've basically grown up hearing them. We just did a unit on corruption in my civics class and the working definition we were given was something like the misuse of a public position for private benefit, and I keep failing to map her rulings onto it, partly becuase half of them don't involve anyone's private benefit at all. Here's the track record she's given me over the last few years, in her own words more or less:

  1. A village elder presents the country director a hand-woven blanket at the public closeout ceremony, worth maybe twenty dollars, and the office reciprocates with a set of tools for the village school. Accept, no issue.
  2. A contractor who has bid on a drilling tender takes the logistics officer and his wife to a dinner that costs about three hundred dollars, ten days before the panel meets. Decline and report it.
  3. The same contractor hosts the village's annual harvest lunch in an open field three weeks before the same tender — around a thousand people, four of them staff, about fifteen dollars a head. Go, enjoy it, no issue.
  4. A customs officer at the border won't stamp the release of donated pumps without a small cash processing fee. The fee is set by regulation, it's receipted, his salary is famously low, and literally every importer pays it. Pay it, log it, and don't describe it as a bribe in the report.
  5. A foundation that funds the NGO offers the finance director five thousand dollars as an honorarium to spend a weekend advising the foundation on how to allocate its grants to organizations like theirs. He never mentioned it to anyone until she asked. Refuse, and she called it the worst one of the year.
  6. A program officer's brother owns a trucking firm. She discloses it in writing, recuses herself entirely, and the panel independently picks his bid because it's the cheapest. Fine.
  7. A district administrator calls the country director privately and offers to fast-track their building permits if they hire his nephew as a driver. The nephew applied through the open posting and was genuinely the best candidate, and this kind of arrangement is completely unremarkable there. She killed the deal, and then said the nephew couldn't be hired while the permits were still pending — the permits came through two months later and by then he'd taken a job elsewhere, so I honestly can't tell if she meant never or just not-yet.

  The one on her desk right now, which she'll rule on next week, is this. The ministry official who has signed off on every one of their permits for nine years is retiring. There's a long-standing local custom where the organizations he's worked with contribute to a farewell project in his home village — this time it's a borehole, with a plaque naming him. The ask on the NGO is bigger than on the others because they benefited most from him, roughly six weeks of the field team's salaries, and the only place it can come from is the program budget earmarked for water points in their own district, which means one of four planned water points doesn't happen this year. The whole thing is announced in the local paper, three other NGOs and two companies are contributing, the man will have no official role after he leaves, and his successor is a deputy he trained. Their home-country funder's policy bans payments and gifts to public officials but says nothing about ceremonial community contributions, and nobody in Country A sees anything wrong with it whatsoever.

  So: what do you think she'll say, and can you show your work? I want the candidate rules that are each consistent with all seven precedents — I can think of at least a publicity test, a something-about-decisions-being-made-on-the-merits test, a nobody-who-should-have-had-a-fair-shot-gets-shut-out test, a no-private-benefit-flowing-from-an-official test, and some version of defer-to-local-norms, and I suspect more than one of those has to be modified to survive case 7 — then what each rule predicts about the retirement borehole, including whether the funding source changes the answer. Give me your single best guess at her actual verdict and say why you'd bet on that rule over the others rather than just listing them. If the precedents genuinely don't settle it, tell me what principle she'd be committing herself to by ruling each way, and give me one further case that would cleanly separate the top two contenders. And separately: cases 4 and 7 both involve something completely normal locally, and she allowed one and blocked the other — does that mean she's running one universal standard with a cultural sensitivity dial, or two different standards for the field office and for home, and how could I tell which from the outside?
reasoning: |-
  Okay, the user has shared a detailed scenario involving their aunt, an integrity officer at an NGO, and her rulings on various ethical dilemmas related to corruption. They've provided seven past cases and a current pending case about a retirement borehole project for a retiring ministry official. The user wants to understand the underlying principles behind these rulings and predict how their aunt might rule on the current case.

  First, I need to analyze all seven precedent cases to identify consistent principles. Case 1 involved accepting a small ceremonial gift that was reciprocated publicly. Case 2 rejected a contractor's expensive dinner before a tender meeting. Case 3 allowed attending a community event hosted by the same contractor weeks before the tender. Case 4 permitted paying a small, receipted customs fee that everyone pays. Case 5 rejected an honorarium from a funder to an employee. Case 6 allowed hiring a relative when properly disclosed and selected independently. Case 7 rejected hiring a district administrator's nephew even when he was qualified, due to the quid pro quo offer.

  Looking for patterns, several tests emerge. The publicity test appears in cases 1, 3 and 4 where transparent transactions were allowed. The decision-integrity test is evident in cases 2, 5, 6 and 7 where any potential influence on decisions was rejected. The fairness test shows in cases 6 and 7 regarding equal opportunity. The private benefit test appears in cases 2, 5 and 7 where personal gain was involved. Cultural norms were respected in cases 3 and 4 but overridden in case 7 when other principles conflicted.

  For the pending retirement borehole case, several factors need consideration. While it's public and ceremonial (favoring approval), and culturally normal, the funding source is problematic as it diverts program funds. The official's future lack of role helps, but the direct link to past permits and the funding diversion create issues. The publicity and cultural norms might support it, but the decision-integrity and private benefit tests are concerning since this could be seen as rewarding past decisions.

  I predict the aunt will reject the contribution because of the diverted program funds creating actual harm (a water point not built) and the appearance of repaying past official actions. This prioritizes decision-integrity over cultural deference when harm occurs. The funding source is likely the decisive factor.

  Regarding the cultural question, the aunt uses a universal standard but with cultural sensitivity. She defers to local norms only when core integrity principles aren't violated, as seen when she overruled in case 7 despite local acceptance. The key differentiator is whether the practice threatens decision-making integrity or fairness.

  To confirm this, I consider a hypothetical test case: if a community contribution wasn't tied to specific officials and didn't harm projects, she'd likely allow it. But if it rewarded specific past decisions, she'd reject it regardless of cultural norms.
answer: |-
  Based on the 7 precedents, your aunt operates with a sophisticated set of integrity principles focused on **preserving impartial decision-making, preventing actual or perceived undue influence, avoiding private gain derived from public function, and minimizing harm to the NGO's mission and beneficiaries.** Cultural norms are respected *unless* they conflict with these core principles. Here's the breakdown:

  **Candidate Rules Consistent with All 7 Precedents:**

  1.  **The Decision-Integrity Test:** *Does the interaction create an unacceptable risk of influencing, or appearing to influence, an official decision (past, present, or future) OR directly reward an official for a decision already made?*
      *   Explains: Blocked #2 (dinner before tender), #5 (honorarium influencing grants), #7 (permits for hiring). Allowed #1 (ceremonial gift after decision), #3 (community event not tied to specific decision), #4 (routine fee unrelated to discretion), #6 (arms-length decision).

  2.  **The Private Benefit Test (Modified):** *Does the benefit flow *directly and personally* to an individual official (or their immediate family) based on their public position, creating a conflict of interest or appearance of quid pro quo?*
      *   Explains: Blocked #2 (personal dinner), #5 (personal honorarium), #7 (nephew job). Allowed #1 (gift to NGO reciprocated to community), #3 (benefit to community), #4 (fee to government function, not officer's pocket), #6 (benefit to brother via fair process). *Modified* because #4 involves a personal fee, but it's mandated, receipted, and routine – the "private benefit" is inherent to the low-paid role/system, not an *additional* inducement.

  3.  **The Harm & Mission Test:** *Does the interaction cause direct harm to the NGO's mission, beneficiaries, or integrity (e.g., diverting funds, denying services, creating unfair advantage)?*
      *   Explains: Blocked #5 (personal gain, conflict), #7 (distortion of hiring, potential permit coercion), potentially key for #1 (reciprocation was to school, not diversion). Allowed #1, #3, #4, #6 (no direct harm to mission/beneficiaries).

  4.  **The Publicity/Transparency Test:** *Can the interaction withstand public scrutiny? Is it disclosed and conducted openly?*
      *   Explains: Allowed #1 (public ceremony), #3 (public event), #4 (logged/receipted), #6 (disclosed/recused). Blocked #2 (private dinner), #5 (undisclosed), #7 (private offer).

  5.  **Deference to Local Norms (Conditional):** *Respect local customs UNLESS they violate the Decision-Integrity, Private Benefit, or Harm & Mission tests.*
      *   Explains: Allowed #3 (harvest lunch), #4 (customs fee). Blocked #7 (nephew hiring norm) because it violated Decision-Integrity/Harm. Not the primary driver, but a factor considered where other tests are balanced.

  **Analysis of the Retirement Borehole Case:**

  *   **Decision-Integrity Test:** This is the crux. The contribution *explicitly* rewards the official for past decisions (permits signed over 9 years). While he has no future role, this creates a strong appearance of rewarding favorable past treatment. **RED FLAG.**
  *   **Private Benefit Test:** The plaque honors him personally for his public service. While the borehole benefits his home village, the personal recognition and legacy are significant private benefits directly linked to his official position. **RED FLAG.**
  *   **Harm & Mission Test:** **CRITICAL.** Diverting program funds earmarked for water points means one community doesn't get clean water this year. This is tangible harm to beneficiaries and mission diversion. **MAJOR RED FLAG.** The funding source (program budget) changes this from a symbolic gesture to an operational sacrifice.
  *   **Publicity/Transparency Test:** Publicly announced, multiple contributors. **GREEN FLAG.**
  *   **Deference to Local Norms:** Strong local custom, widely accepted, other NGOs/companies participating. **GREEN FLAG, BUT...**
  *   **Funder Policy:** Policy bans payments/gifts to officials but is silent on community contributions. This creates ambiguity, but doesn't override core integrity concerns.

  **Prediction & Best Guess:** Your aunt will **REJECT** the contribution to the retirement borehole.

  *   **Why?** The **Harm & Mission Test**, amplified by the funding source (program budget), is decisive. Diverting resources meant for beneficiaries to reward an official for past actions is antithetical to the NGO's core purpose. This harm is concrete and measurable (one water point lost). While publicity and local norms support it, the **Decision-Integrity** and **Private Benefit** concerns are too significant, especially combined with the tangible harm. The fact that others are contributing doesn't mitigate the NGO's specific harm or the core integrity violation. She'll likely argue this sets a dangerous precedent for diverting beneficiary funds for official recognition.

  *   **Why this rule over others?** The Harm & Mission Test explains the *severity* of her reaction in #5 (the "worst one") – potential funder influence directly threatened mission integrity. Case #7 blocking the nephew/hire despite local norms shows she prioritizes preventing distorted decisions and potential harm over cultural acceptance. The funding source in the borehole case creates direct harm comparable to #5, making it intolerable under this principle.

  **Addressing Cultural Sensitivity vs. Universal Standard:**

  Your aunt uses **one universal standard (core integrity principles) with a cultural sensitivity dial, not separate standards.** How to tell?

  1.  **Deference is Conditional:** She allows local norms (#3 Harvest Lunch, #4 Customs Fee) *only* when they don't violate core principles (Decision-Integrity, Private Benefit, Harm). She blocked #7 (Nephew Hire) *despite* the norm because it violated Decision-Integrity and Fairness.
  2.  **Core Principles are Consistent:** The rejection of private dinners before decisions (#2), undisclosed honoraria (#5), and quid pro quo arrangements (#7) would likely apply universally, regardless of location. Similarly, the acceptance of disclosed arms-length transactions (#6) and truly public, non-influential community events (#3) would hold.
  3.  **The "Dial":** The tolerance level for *how* norms manifest or the *threshold* for "appearance of influence" might be slightly adjusted based on context (e.g., the scale of the Harvest Lunch #3 might be acceptable locally where a smaller, private event might not be), but the underlying principles (no link to specific decisions, no private quid pro quo) remain fixed.

  **A Test Case to Separate Top Contenders (Decision-Integrity vs. Harm & Mission):**

  Suppose: A local tradition requires NGOs to provide *modest* (e.g., $50 value) "greeting gifts" to new village chiefs upon starting projects. The gifts are symbolic (local craft, small food basket), publicly presented, expected by the community, and the chief has limited formal power over the project (e.g., facilitates community labor). Funding comes from administrative overhead, not program funds.

  *   **Decision-Integrity Test:** Minor risk? Chief's role is facilitative, not decisive on contracts/permits. Gift is symbolic, not lavish.
  *   **Private Benefit Test:** Small personal benefit, but culturally symbolic role.
  *   **Harm & Mission Test:** Negligible cost, no diversion of beneficiary funds.
  *   **Publicity/Transparency:** Public ceremony.
  *   **Local Norms:** Strong expectation.

  **Prediction:** She'd likely **ALLOW** this under the Decision-Integrity and Harm tests. It separates from the borehole case because:
      *   No link to rewarding *past official decisions* impacting the NGO.
      *   Benefit is minor and culturally tied to a *role*, not personal decisions.
      *   No harm/mission diversion (cost minimal, source appropriate).
      *   Contrasts with borehole: rewarding specific past permits, significant cost, mission harm.

  This test shows the Harm & Mission principle (especially funding source/consequence) was likely the decisive factor in rejecting the borehole, not just the Decision-Integrity concern alone. If she allowed this small gift but blocked the borehole, it confirms Harm & Mission as the key differentiator. If she blocked this too, it would signal an extremely strict interpretation of the Decision-Integrity/Private Benefit tests, minimizing cultural deference.
