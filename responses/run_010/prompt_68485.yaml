prompt: |-
  Just spent two hours arguing with my friend about omissions — whether not-doing something can literally cause something — and I can't get a handle on what rule she's runnning. Her verdicts:

  - A plant-sitter who's being paid to water your fern, forgets, fern dies: yes, that omission caused it.
  - A stranger walking past the same fern who could've watered it in five seconds and didn't: not a cause. She'll grant the fern would've lived if he had; she just says a true counterfactual isn't enough.
  - A lifeguard posted at the north pool, eyes on the water, while someone drowns at the south pool two hundred yards away: not a cause.
  - A hitman who has his target in the sights, decides to spare him, and holsters the gun: yes, the refraining caused the guy living.
  - No firefighter happens to be inside the warehouse when it catches: not a cause — she says that's just an absence, there was never anyone there to omit anything.
  - An escort plane shooting down the fighter that would have shot down the bomber: yes, the shot caused the mission succeeding. So she isn't uniformly hostile to the weird ones.

  Now the case I actually want settled. A contract security guard has to do a round every two hours. At 2 and 4 a.m. he's stuck in a stairwell — the maglock failed, nobody can hear him, he physically cannot get out. A short circuit starts a smoldering fire in the server room during that window; had he made the 4 a.m. round he'd have caught it. Building's gone.

  Predict her verdict. Then tell me which rules actually fit everything above: I assumed it was something like "there has to be a norm or role requiring the act," but the lifeguard case seems to fit that and she said no, and the hitman case has no role requirement and she said yes. So maybe its about ability, or about the act being expected of *that* agent in *that* situation, or about the absence having an explanation in the agent's own reasoning, or something else I haven't thought of. Give me your best guess with the reasons for it, say how much of her pattern each rival explains, and name one further case that would separate the top two. And mark clearly what's settled here versus what's genuinely contested among people who work on causation — I don't want a contested view served to me as the consensus.
reasoning: |-
  Okay, let me start by unpacking this user's query. They had a lengthy debate with a friend about omissions causing events. The user provided several scenarios where their friend made specific judgments about whether an omission was a cause. Now, they want to predict the friend's verdict on a new case involving a security guard and understand the underlying rules. 

  First, I need to analyze each scenario the friend judged. The plant-sitter's omission caused the fern's death because they had a duty. The stranger who didn't water the plant isn't a cause despite the counterfactual. The lifeguard at the north pool isn't causing the drowning at the south pool. The hitman refraining from shooting causes the target's survival. The absence of a firefighter isn't a cause. The escort plane shooting down the fighter does cause the mission success. 

  Looking at the security guard case: he's contractually obligated but physically unable to make rounds due to a maglock failure. A fire breaks out, and if he'd been there, he could've caught it. The user wants to know if the friend would consider the guard's omission a cause. 

  The friend seems to require more than just a counterfactual. She needs a specific agent with a responsibility or role who consciously chooses not to act. The plant-sitter had a duty and forgot (omission). The hitman made a deliberate choice not to shoot. The stranger and lifeguard had no direct responsibility in that moment. The absent firefighter wasn't an agent who omitted anything. 

  For the security guard, he has a contractual duty, but he was physically unable to act. He didn't choose to omit; he was trapped. The friend might say this isn't a cause because the omission wasn't due to his decision. It was an inability, not a choice. So prediction: not a cause. 

  Underlying rule: Moral responsibility + intentional agency. The agent must have both a duty and the ability to act, and their omission must stem from a decision (conscious or negligent). The lifeguard case fits because he wasn't responsible for the south pool. The hitman chose not to act. The guard couldn't act, so no cause. 

  Contested points: Philosophers debate whether omissions can be causes. Some see them as absences, others as causal. The friend's view aligns with the "duty-based" approach but adds the intentionality element. 

  Further test: A doctor on vacation vs. a doctor on duty ignoring an alarm. The friend would likely say the on-duty doctor's omission causes harm, but not the vacationing doctor, clarifying duty vs. ability. 

  I need to make sure I distinguish between the friend's likely reasoning and the actual philosophical debates. The user wants to know both the prediction and the contested points.
answer: |-
  Based on your friend's pattern of judgments, here's the prediction and analysis:

  **Prediction for Security Guard Case:** Your friend would say the guard's **inability** to do his round **DID NOT cause** the building's destruction.

  **The Underlying Rule: Moral Responsibility + Intentional Agency**
  Your friend's pattern is best explained by a rule combining two elements:
  1.  **Moral Responsibility/Expectation:** There must be a specific, salient **moral duty, role-based obligation, or reasonable expectation** placed upon *that particular agent* to perform the omitted action *in that specific situation*.
  2.  **Intentional Agency in the Omission:** The omission must be attributable to the *agent's own reasoning, decision, or negligence* – a *choice* (even implicit or negligent) not to act, *despite having the ability and awareness to do so*. It's about the *agent's failure* relative to their responsibility. Absences without agency or omissions due to literal inability don't count.

  **How the Rule Fits Every Case:**

  1.  **Plant-Sitter:** YES.
      *   *Responsibility:* Explicit contract/role to water the fern.
      *   *Agency:* Forgot (negligence) – a failure attributable to the sitter's own mind.
  2.  **Stranger:** NO.
      *   *Responsibility:* No duty or expectation placed on this specific stranger.
      *   *Agency:* While physically able, there's no *failure* relative to an obligation. It's just an absence of action from someone not responsible.
  3.  **Lifeguard:** NO.
      *   *Responsibility:* Duty was explicitly to the *north pool*, not the south pool. Not responsible for the south pool victim.
      *   *Agency:* He was doing his job *as assigned*. His omission regarding the south pool isn't a failure *relative to his responsibility*; he wasn't *supposed* to be there. (This distinguishes it from the plant-sitter – his responsibility was geographically bounded).
  4.  **Hitman:** YES.
      *   *Responsibility:* The *role* of a hitman inherently creates an expectation/duty to shoot *this specific target*. His *job* is to kill the target.
      *   *Agency:* He made a conscious, deliberate decision *not* to shoot. This is a clear act of refraining attributable to his reasoning.
  5.  **No Firefighter:** NO.
      *   *Responsibility:* While firefighters *in general* prevent fires, there was *no specific agent* present who had a duty *in that moment* to be inside. It's a pure absence, not an omission by an identifiable agent.
      *   *Agency:* No agent existed to *omit* anything.
  6.  **Escort Plane:** YES (as per your note).
      *   *Responsibility:* Its role is explicitly to protect the bomber by shooting down threats.
      *   *Agency:* The pilot *actively chose* and *performed* the action (shooting) to fulfill that duty. This is a positive action causing an effect, fitting standard causation, not an omission case. (This shows she's fine with standard positive causation).

  **Analysis of Security Guard Case Using the Rule:**

  *   **Responsibility:** YES. Contractual, role-based duty to patrol *this specific building* at specific times.
  *   **Agency:** NO. He was **physically unable** to act ("he physically cannot get out"). His omission wasn't due to a decision, forgetfulness, or negligence on his part. It was due to external constraint preventing him from fulfilling his duty. He didn't *choose* or *fail* to act; he was *prevented* from acting. Like the absent firefighter, the cause is the *physical constraint preventing action* (the maglock failure, possibly combined with the short circuit), not the guard's *omission* itself.

  **Why Other Rules Don't Fully Fit:**

  *   **"Norm or Role Requiring the Act" Alone:** Fails on the **Lifeguard** (had a role, but bounded duty) and the **Hitman** (role created the duty/expectation, even if immoral).
  *   **Ability Alone:** Fails on the **Stranger** (had ability, but no responsibility) and the **Lifeguard** (arguably *could* have run 200 yards, but not responsible).
  *   **"Expected of that Agent in that Situation" Alone:** Too vague. The **Stranger** wasn't expected. The **Lifeguard** wasn't expected *at the south pool*. The **Hitman** *was* expected to shoot *that target*.
  *   **"Absence having an Explanation in the Agent's Own Reasoning":** Captures *Agency* well (Plant-sitter: forgot; Hitman: decided; Stranger/Lifeguard/No Firefighter/Guard: no relevant reasoning). But needs the *Responsibility* component to exclude the Stranger and differentiate the Lifeguard. (The Lifeguard might reason "Not my pool", which is *correct* given his responsibility, so not a *failure*).

  **Contested vs. Settled in Philosophy:**

  *   **Settled:** There is **NO consensus** on whether omissions can *literally* be causes. This is a **deeply contested and unresolved** problem in metaphysics and philosophy of causation.
      *   **Absentialists:** Argue omissions (absences, preventions) cannot be genuine causes because causation requires positive, spatiotemporally located events/processes. Omissions are lacks, not things.
      *   **Causalists:** Argue that omissions *can* be causes, often based on counterfactual dependence (if the omission hadn't occurred, the outcome wouldn't have happened) or within frameworks that explicitly include absences/negative events.
      *   **Pragmatists/Moralists:** Argue causation attributions for omissions are primarily based on normative expectations (duties, roles) and moral responsibility, not fundamental metaphysics. Your friend leans strongly here.

  *   **Contested:** The *specific criteria* for when an omission *counts as* a cause (even pragmatically) are highly contested. Your friend's rule (Responsibility + Agency) is one plausible pragmatic/moral approach, but it's not the only one debated. Others emphasize counterfactuals, probabilistic dependence, or physical processes.

  **Further Case to Separate Rules:**

  Test Case: **"The Vacationing Doctor"**  
  A critically ill patient crashes in Hospital A. Dr. Smith, an expert in this condition, is:  
  **(A)** On vacation in Bali, unreachable.  
  **(B)** On duty *in Hospital A* but taking a nap in the on-call room, ignoring his pager.  
  In both cases, had Dr. Smith intervened, the patient would likely have survived.

  *   **Your Friend's Likely Verdicts (Responsibility + Agency):**
      *   **(A) Vacationing:** NOT a cause. No duty/expectation to act *while on vacation in Bali*. Pure absence.
      *   **(B) Sleeping On-Duty:** YES, omission caused death. Clear duty/responsibility *in that situation*, and omission due to negligence (failure of agency - didn't respond to pager).

  *   **Counterfactual-Only View:** Would say YES in *both* cases (if Smith had acted, patient would have lived).
  *   **Simple Role-Only View:** Might struggle if "role" is interpreted broadly (he's always *a* doctor), but Responsibility + Agency clearly distinguishes (A) vs (B) based on specific situational duty and the nature of the omission.

  This case cleanly separates the Responsibility + Agency view (which would distinguish A and B) from a pure counterfactual view (which would not) and potentially from a looser role view. It also highlights the importance of the *situational* nature of the responsibility in her framework.
