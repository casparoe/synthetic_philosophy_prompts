  We are creating a satirical brochure for a consultancy firm that helps executives pass Kant's universal law test for their maxims.
   The brochure should include:
    1. A pitch paragraph (faintly offended at being confused with PR, devout rather than cynical)
    2. A rate card with 3-4 tiers (clearing contradiction-in-conception, contradiction-in-the-will, rush option, premium retainer)
    3. One worked case study (mundane example, step-by-step redrafting)
    4. Fine print (exclusions, policy on indexicals, refunds, and a sentence about the objection that it's just re-description)

   The humor must come from accurate Kantian understanding and deadpan delivery.

   Case Study: Let's choose a client who wants to drop a small promise that has become inconvenient.

   Steps for the case study:
    - Start with a maxim that clearly fails: "I will break a promise when keeping it becomes inconvenient."
    - Then show the firm's step-by-step redrafting until it passes.

   Rate Card Tiers:
    Tier 1: Contradiction-in-Conception Clearance
    Tier 2: Contradiction-in-Will Resolution (more expensive because it requires persuading the client to will something they don't want)
    Tier 3: Rush/Expedite Option
    Tier 4: Premium Retainer (for cases that require more than redescription)

   Fine Print:
    - Exclusions: e.g., they won't work on maxims that involve harming others, etc.
    - Policy on indexicals: They allow them but note that a maxim with too many indexicals becomes trivial and may not reflect the moral intent. However, they will do it if the client insists.
    - Refund terms: If they can't get your maxim to pass, you get your money back (except for the retainer, which is non-refundable because they spend the time anyway).
    - Answer to the re-description objection: They say that the test is about finding the correct description of the act that captures the agent's true intent and the relevant circumstances, and that their work is a rigorous exercise in moral clarity.

   Now, we write the brochure in about 700-900 words.

   After the brochure, we'll create a markdown table with 5 rows and columns: move, what_it_does, test_targeted, kantian_reply, appears_in_brochure.

   Let's begin.
answer: |-
  ### UNIVERSALIZABILITY PARTNERS  
  **Moral Architecture for the Modern Executive**  

  In an era where ethical shortcuts abound, Universalizability Partners provides rigorous *maxim engineering*—not public relations. We are devout practitioners of Kantian formalism, offering executives certainty that their principles withstand the Categorical Imperative’s first formulation. Unlike firms that obscure moral failures with rhetoric, we rebuild your maxims from the ground up to achieve *structural soundness*. Our work is not cynical rebranding; it is the application of 238 years of deontological science to ensure your will aligns with universal law.  

  ---

  ### RATE CARD  
  *All engagements include a formal maxim audit and iterative redrafting.*  

  | **TIER**                          | **SCOPE**                                                                 | **FEE**       |  
  |-----------------------------------|---------------------------------------------------------------------------|---------------|  
  | **Contradiction-in-Conception Clearance** | Resolves logical inconsistencies in universalization (e.g., maxims that collapse society if universalized). | $12,000 |  
  | **Contradiction-in-Will Resolution**      | Addresses maxims that survive universalization but conflict with rational agents’ necessary ends (e.g., imperfect duties requiring reluctant commitment). | $45,000+ |  
  | **Expedited Universalization**            | 72-hour turnaround for urgent maxim adjustments (e.g., pre-board-meeting crises). | +75% base fee |  
  | **Imperative Retainer™**                 | For maxims irreparable by redescription alone. Includes agent-indexed tailoring and will-realignment coaching. | $110,000/quarter |  

  ---

  ### CASE STUDY: THE INCONVENIENT PROMISE  
  *Client submitted this failing maxim:*  
  **"I will break small promises when keeping them becomes costly."**  

  **Step 1: Contradiction-in-Conception Failure**  
  Universalizing creates a world where *all* agents break promises when inconvenient. Promises lose meaning (contradicting the very concept of a promise). Tier 1 intervention applied.  

  **Step 2: Circumstantial Narrowing**  
  *Redraft:* "I will break promises *to long-term vendors* when *renegotiation fails* and *costs exceed 5% of project value*."  
  *Result:* Universalization now conceivable (vendors could reasonably expect renegotiation clauses). Contradiction-in-conception resolved.  

  **Step 3: Contradiction-in-Will Emergence**  
  Universalized maxim compels the client to accept broken promises *against their own interests* when others apply it. Violates imperfect duty of mutual aid. Tier 2 intervention required to align will.  

  **Step 4: Ends Realignment & Agent Indexing**  
  *Redraft:* "As a *principal of a firm facing liquidity constraints*, I may release myself from *non-core contractual obligations* after *documented good-faith efforts to renegotiate*, provided I *publicly disclose terms* to preserve trust."  
  *Result:* Universal law now wills agents in *identical fiduciary roles* to prioritize systemic solvency over atomistic promises. Contradiction-in-will resolved.  

  **Final Maxim:** Passes both tests. Client retains moral agency while achieving liquidity objectives.  

  ---

  ### FINE PRINT  
  **Exclusions:** We do not engage with maxims involving violence, coercion, or suppression of rational autonomy (Groundwork, Sec. II).  
  **Indexical Policy:** Agent-indexed maxims (e.g., "only when *I*, John Smith, CEO...") are permissible under Tier 4 but require Imperative Retainer™ due to trivial universalizability. UP reserves the right to note such solutions lack *moral ambition*.  
  **Refunds:** Full refund if a maxim fails Tier 1–3 engineering. Retainer fees are nonrefundable (resources expended on will-realignment are nonfungible).  
  **On Redescription:** UP rejects the claim that maxim engineering is "mere semantics." Kant’s test requires identifying the *relevant description* under which an act is willed. Our rigor ensures descriptions capture *essential circumstances* without arbitrary particularization (per *Groundwork*, Ak 4:421). We correct misapplied generalizations—we do not undermine the law.  

  ---

  ### MAXIM ENGINEERING TECHNIQUES  
  *Standard moves deployed in UP engagements*  

  | move                   | what_it_does                                                                 | test_targeted              | kantian_reply                                                                 | appears_in_brochure         |  
  |------------------------|-----------------------------------------------------------------------------|----------------------------|------------------------------------------------------------------------------|----------------------------|  
  | Circumstantial Narrowing | Adds specific conditions to the maxim to avoid logical collapse.            | Contradiction-in-conception | Kant allows maxims to include "subjective conditions" if universally relevant (Ak 4:424). | Tier 1, Case Study Step 2 |  
  | Ends Realignment        | Shifts the maxim’s goal to align with necessary rational ends (e.g., trust, survival). | Contradiction-in-the-will  | Duties require harmonizing personal and universal ends (Ak 4:423).             | Tier 2, Case Study Step 4 |  
  | Agent Indexing         | Binds the maxim to the agent’s unique role/identity to trivialize universalization. | Both                       | Over-particularization voids the test by eliminating shared rational context. | Tier 4, Fine Print         |  
  | Role Specification     | Anchors the maxim to a professional duty to justify exceptions.             | Contradiction-in-the-will  | Roles impose duties, but must still universalize roles themselves (Ak 4:434). | Case Study Step 4          |  
  | Escape Hatch Insertion | Adds procedural safeguards (e.g., "after good-faith efforts") to preserve universality. | Contradiction-in-conception | Safeguards must be universally available, not ad hoc (Ak 4:402n).             | Case Study Step 4          |  

  —  
  Universalizability Partners: *Where your will becomes law.* ™
