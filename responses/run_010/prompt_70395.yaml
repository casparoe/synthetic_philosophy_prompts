  The key constraints are: no direct "are generations real?" questions, concrete cases instead, and phrasing that won't make older attendees feel attacked. They've listed essential nodes: clarifying demographic vs character generations, the age-period-cohort problem, boundary issues, feedback loops, mechanism vs pattern, transportability across cultures, and utility questions.

