prompt: |-
  I build probabilistic forecasting models for a living — weather-adjacent work, mostly precipitation onset and grid-load exceedance events — and my professional vocabulary is entirely about calibration: reliability diagrams, PIT histograms, the Brier score and the continuous ranked probability score treated as proper scoring rules, the distinction between marginal and conditional calibration, sharpness subject to calibration, prequential backtesting, and the standing assumption that the true data-generating probability of any single event is a latent quantity I never observe directly and can only infer from long-run frequencies within some reference class. A philosopher friend of mine insists that in my daily practice I am already committed to David Lewis's Principal Principle, and last week she wrote it out for me in a form I could half follow: an agent's credence in a proposition, conditional on the hypothesis about what the chance of that proposition is together with whatever admissible evidence the agent has, ought to equal that chance. My working hypothesis, which I want you to test rather than flatter, is that this amounts to nothing more than the claim that a forecaster's reported probabilities should equal the true probabilities of the events they concern — that is, to the definition of perfect calibration — and that the remainder of Lewis's apparatus is metaphysical overhead I could discard without altering a single line of how I evaluate a model. If that is right, say so bluntly; if it is wrong, tell me exactly where my gloss breaks.

  So restate the Principal Principle, clause by clause, in the vocabulary I actually use: what chance becomes, what credence becomes, what the conditionalization on a chance hypothesis becomes when I never condition on such a thing but only on features and on past outcomes, what admissibility and inadmissibility become, and what becomes of the principle's status as a constraint an agent is supposed to satisfy prior to and independently of the data that would confirm any particular stochastic model. For each clause, state what translates cleanly, what translates only with a distortion you should flag rather than quietly absorb, and what has no counterpart at all in forecast evaluation. Do not smooth over the rough edges to make the mapping look tidier than it is, and do not import my modeling assumptions and relabel them as Lewis's.

  There are three places where I specifically suspect the translation is dishonest, and I would like them handled head-on. First, a level mismatch: the principle governs one agent's degree of belief in one proposition at one time, whereas calibration is an aggregate property of a forecaster's outputs across many events, so it looks possible to be perfectly calibrated in my sense while violating the principle case by case — and conversely, to respect the principle perfectly on every occasion while looking badly calibrated over any finite sample. Tell me whether that possibility is real or an artifact of my gloss. Second, admissibility: the natural translation is that you condition on your full information set, but I have been told the notion does substantive work by ruling certain kinds of information out, including some information bearing on the future, and I cannot see what the analogue of such an exclusion would be in prequential evaluation, where conditioning on everything you know at the time of the forecast is precisely the target. Third, the status of the chance quantity itself: I posit a probability as a parameter of a model and then test it against observed frequencies, whereas the principle appears to require deference to a chance hypothesis as such, prior to those frequencies; whether that deference has any counterpart in my practice, or whether my practice has silently substituted something else for it, is the part I most want clarified. For what it is worth, someone in our reading group argued that the deference ought to run in the opposite direction, with chance defined in terms of what an ideally informed and ideally rational agent would believe, and I cannot tell whether that reversal has any content expressible in my vocabulary or is a purely philosophical option with no operational meaning.

  Then give me the residue report, which is the real point of the exercise. List what the philosophy contains that forecast evaluation cannot express, and for each item say whether the absence indicates a defect in my vocabulary — a genuinely missing concept, such as a single-case objective probability that is neither a long-run frequency nor a modeling convenience — or whether it is evidence that the original claim was less substantive than it appeared, a piece of the principle that does no work once you have already assumed a well-specified stochastic model and a scoring rule. I am not asking you to survey the interpretations of probability, to re-teach me proper scoring rules, or to adjudicate whether Lewis was right about the metaphysics; I am asking where the two frameworks actually fail to meet. Begin with your bottom line on my working hypothesis in the first sentence, then give the reasoning and the clause-by-clause translation, with no preamble and no restatement of my question.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're a professional in probabilistic forecasting, focused on calibration metrics like reliability diagrams and CRPS. Their philosopher friend claims their work implies adherence to Lewis's Principal Principle (PP). The user suspects PP is just perfect calibration in disguise, with unnecessary metaphysics. They want a blunt assessment and a detailed translation of PP into their forecasting vocabulary.

  First, I need to recall the Principal Principle. Lewis states that an agent's credence in a proposition, given the chance of that proposition and admissible evidence, should equal the chance. The user's main hypothesis is that this reduces to perfect calibration. But there are nuances they point out: level mismatch (individual vs aggregate), admissibility, and the status of chance itself.

  Let's tackle the bottom line. The user is partially right—PP and calibration are closely related. But there are key differences. PP operates at the individual case level, while calibration is aggregate. Admissibility in PP excludes certain future-related info, unlike forecasting which conditions on all available info. And chance in PP is a primitive, whereas in forecasting it's a model parameter tested against data. These differences mean PP isn't just metaphysical overhead; it imposes constraints beyond calibration.

  Breaking down PP clause by clause:

  1. **Chance**: For the user, it's a model parameter tied to long-run frequencies. In PP, it's a single-case objective probability. The translation is clean only if we assume the model is correct; otherwise, it's distorted because PP's chance isn't derived from frequencies.

  2. **Credence**: This maps to the forecaster's reported probability. Clean translation here, as both are about degrees of belief.

  3. **Conditional on chance hypothesis**: The user conditions on features and past data, not explicit chance hypotheses. This is a distortion because PP requires deference to a specific chance value, while forecasters build models that imply chances without directly conditioning on them.

  4. **Admissible evidence**: PP excludes some future-related info, but forecasters include all current information. This has no counterpart in forecasting evaluation, creating a significant gap.

  5. **Normative constraint**: PP is a pre-data rational requirement. Forecasting evaluates post-hoc via scores. No direct counterpart; the user's practice doesn't assume pre-data deference.

  Addressing the user's specific concerns:

  - **Level mismatch**: Real, not an artifact. One can have perfect calibration without satisfying PP case-by-case (e.g., hedging). Conversely, satisfying PP each time doesn't guarantee finite-sample calibration due to randomness.

  - **Admissibility**: PP excludes info that might undercut the chance hypothesis (e.g., future events). Forecasting conditions on all known info. This exclusion has no analogue in prequential evaluation.

  - **Status of chance**: PP treats chance as a primitive to defer to. The user treats it as a model parameter tested by frequencies. The deference in PP is prior to data, while the user's approach is posterior. The "reversal" (chance as ideal credence) isn't operational in forecasting without idealization assumptions.

  Residue report:

  - **Single-case chance**: PP assumes objective single-case probabilities. The user only has long-run frequencies. This isn't a defect; it's a deliberate choice to avoid unverifiable metaphysics.

  - **Pre-data deference**: PP's normative constraint lacks a counterpart. Not a defect; forecasting is inherently empirical.

  - **Admissibility exclusions**: No equivalent in forecasting. Not a defect; including all information is practical.

  - **Case-by-case obedience**: PP requires this, but forecasting focuses on aggregates. The absence isn't a defect; individual checks aren't statistically feasible.

  The user's hypothesis is half-right: PP and calibration align under a well-specified model, but PP's additional constraints (single-case chances, admissibility, pre-data deference) are indeed metaphysical overhead from a forecasting perspective. The core of PP that translates is the alignment of reported probabilities with true probabilities, but the extra elements don't enhance practical model evaluation.
answer: |-
  **Bottom line:** Your working hypothesis is half-right but importantly incomplete. The Principal Principle (PP) *implies* perfect calibration as a long-run consequence under ideal conditions, but it is not *equivalent* to it. PP imposes additional constraints—particularly single-case deference and admissibility exclusions—that have no operational counterpart in forecast evaluation. These are not merely metaphysical overhead; they represent genuine gaps where your practice neither requires nor tests PP's full content. Discarding Lewis's apparatus wouldn't alter your model evaluations, but it would ignore normative and conceptual commitments implicitly embedded in your framework.

  ### Clause-by-Clause Translation of the Principal Principle
  *Lewis's clause:*  
  **"An agent's credence in a proposition..."**  
  *Your translation:* A forecaster's reported probability for a specific event (e.g., "precipitation onset at location X at time T").  
  *Cleanliness:* Clean. Both denote a subjective degree of belief assigned to a well-defined outcome.  

  *Lewis's clause:*  
  **"...conditional on the hypothesis about what the chance of that proposition is..."**  
  *Your translation:* Conditioning on a specific, point-valued probability parameter (e.g., "the true probability of precipitation at X,T is 70%").  
  *Cleanliness:* Distorted. You never explicitly condition on a "chance hypothesis" in your models. Instead, you:  
  - Condition on features (e.g., atmospheric variables) and past outcomes.  
  - Treat "chance" as a latent parameter *inferred* from data (e.g., via a GLM or neural network).  
  *Flag:* PP requires direct deference to a chance value *as a premise*. Your practice treats chance as a *derived output* of a model. This is a reversal of epistemic priority.  

  *Lewis's clause:*  
  **"...together with whatever admissible evidence the agent has..."**  
  *Your translation:* Conditioning on all available information at forecast time (e.g., current satellite data, recent model errors).  
  *Cleanliness:* No counterpart for "admissibility." In PP, "admissible" evidence excludes information that "undercuts" the chance hypothesis (e.g., future facts or crystal-ball insights about the specific event). Your prequential evaluation:  
  - *Includes* all contemporaneous information.  
  - Has no concept of "undercutting" exclusion.  
  *Flag:* Admissibility does substantive work in PP by restricting evidence to avoid contradictions (e.g., ignoring a prophecy that it *will* rain when the chance hypothesis says P(rain)=0). Your practice lacks this exclusion—it's all-inclusive.  

  *Lewis's clause:*  
  **"...ought to equal that chance."**  
  *Your translation:* The forecaster's reported probability should match the true probability.  
  *Cleanliness:* Clean *only if* "true probability" is defined as the long-run frequency for a reference class. PP treats chance as a single-case objective fact, independent of frequencies.  

  *Lewis's clause:*  
  **Status as a pre-data rational constraint:**  
  *Your translation:* None. PP demands that *before* seeing outcome data, you align your belief with a chance hypothesis.  
  *Cleanliness:* No counterpart. Your evaluation is inherently post-hoc: you *test* calibration using observed outcomes (e.g., via reliability diagrams). PP governs prior deference; you govern posterior diagnostics.  

  ### Addressing Your Three Suspicions Head-On
  **1. Level Mismatch (Individual vs. Aggregate):**  
  - *Possibility is real.* You can violate PP case-by-case while appearing perfectly calibrated in aggregate (e.g., deliberately misreporting probabilities for individual events but compensating across the portfolio to match frequencies). Conversely, you can satisfy PP for every event yet appear uncalibrated over a finite sample due to stochastic variation (e.g., reporting true P=0.7 for 100 events but only 50 occur by chance).  
  - *Why it matters:* PP constrains individual forecasts; calibration evaluates a sequence. They coincide only in the infinite long run under stationarity.  

  **2. Admissibility Exclusion:**  
  - *No analogue in your practice.* PP excludes evidence that directly contradicts the chance hypothesis (e.g., a reliable oracle's prediction for *this specific* event). Your prequential evaluation:  
    - Conditions on *all* current information.  
    - Treats "inadmissible" information (e.g., a high-resolution nowcast) as *improving* the forecast.  
  - *Distortion:* Translating admissibility as "condition on full information" ignores Lewis's exclusion rule. This exclusion prevents paradoxical beliefs (e.g., believing P(rain)=0.7 while also knowing it *will* rain). Your framework assumes no such paradoxes exist.  

  **3. Status of Chance and Direction of Deference:**  
  - *Your practice substitutes model-relative probabilities:* You posit a chance parameter within a model and test it against frequencies. PP treats chance as a primitive to which you defer *before* validation.  
  - *The "reversal" (chance as ideal credence):* This is inexpressible in your vocabulary. Defining chance as "what an ideal agent would believe" is unoperationalizable—it requires counterfactuals about perfect knowledge (e.g., "Laplace's demon's probability for X,T"). Your long-run frequencies are measurable but don't require idealization.  
  - *Key gap:* PP's deference is normative and pre-empirical; yours is empirical and post-posit.  

  ### Residue Report: What PP Demands That Forecast Evaluation Cannot Express
  1. **Single-case objective chance as a primitive:**  
     - *Content:* PP assumes a "true probability" for individual events, independent of reference classes or models.  
     - *Absence in your practice:* You define probability via long-run frequencies (reference classes) or model parameters.  
     - *Defect or surplus?* Surplus. Your frequency-based approach is operationally sufficient; adding single-case probabilities is untestable metaphysics.  

  2. **Pre-data normative deference to chance hypotheses:**  
     - *Content:* Rational agents *must* align beliefs with chances *before* seeing outcomes.  
     - *Absence in your practice:* You evaluate forecasts *after* outcomes using scoring rules.  
     - *Defect or surplus?* Surplus. Your diagnostics enforce calibration *post-hoc*; PP's "deference" adds no testable content.  

  3. **Admissibility exclusions:**  
     - *Content:* Evidence that directly targets the outcome (e.g., future-traveler testimony) is inadmissible.  
     - *Absence in your practice:* You incorporate all available information; "inadmissibility" is meaningless in prequential testing.  
     - *Defect or surplus?* Surplus. Excluding information is counterproductive for forecasting; PP's rule only resolves philosophical paradoxes.  

  4. **Case-by-case obedience as a rational requirement:**  
     - *Content:* PP demands credence-chance alignment for *each* event, regardless of aggregate performance.  
     - *Absence in your practice:* You only assess aggregates (e.g., via reliability diagrams). Individual misreports are irrelevant if compensated.  
     - *Defect or surplus?* Defect in principle, but not in practice. Checking individual alignment is statistically infeasible and unnecessary for your goals.  

  ### Conclusion
  PP and forecast evaluation overlap on the *goal* (credence/chance alignment) but diverge on *scope* and *foundations*. PP's single-case focus, admissibility, and pre-empirical deference are not just "metaphysical overhead"—they reflect a normative philosophy of objective chance that your frequency-based practice deliberately avoids. Yet this avoidance isn't a weakness: your methods are empirically grounded and self-correcting, while PP's extras are unverifiable. Where PP insists on *what chance is*, you focus on *what models do*. The residue is philosophically substantive but operationally inert for your work.
