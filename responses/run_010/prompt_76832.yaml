prompt: |-
  I'm a staff engineer at a consumer software company. I own user-facing copy and the flows around account deletion, notifications, and data export, and I've been asked to draft our internal standard for what our screens are allowed to make people believe. I have no philosophy training; I've read some blog posts about the difference between lying and misleading and argued with a colleague who did a philosophy degree, and that's the extent of it. So please treat what follows as raw material rather than as my summary of a literature, and please don't send me citations or a reading list — I couldn't evaluate them, and I'd rather have the reasoning in plain terms.

  What I currently hold, in roughly the form I'd put it in the document:

  1. What makes a piece of copy wrong is the intention behind it. If we intend the user to end up with a false belief, it's wrong. The falsity of the sentence by itself isn't what does the work.
  2. Therefore lying and misleading are the same wrong. A literally true sentence used to produce a false belief is just as bad as a false one; there's no discount for staying inside the truth.
  3. We have no general obligation to volunteer information the user hasn't asked for. If the true state of affairs is discoverable — in the help center, in settings, via support — we've done our part. Silence isn't deception.
  4. Any screen whose sentences are all literally true is permissible. I've been calling this the screenshot test: if a user screenshots the screen and every sentence on it survives a fact-check, the screen is clean.
  5. Users are responsible for their own inferences. A conclusion we never stated is theirs, not ours.
  6. Euphemism is acceptable when it's doing tonal work: "we're unable to process that payment" rather than "your card was declined for insufficient funds"; "your export is being prepared" rather than "you're number 41,206 in the queue."
  7. Pre-selected consent toggles are acceptable. The toggle displays the true default, and turning it off is one tap.
  8. Passing our dark-pattern checklist is a sufficient safeguard: no guilt-tripping language on the cancellation path, no navigation you can get into but not out of, no ads styled as buttons, no cost revealed only at the final step, and all copy literally true.

  Case verdicts I'd also defend: our account-deletion screen is fine saying "Your account will be deleted" with the 90-day backup retention mentioned only in the privacy policy; our notifications screen is fine with a single Continue button and the opt-out three levels down under Settings > Privacy > Advanced; our support bot is fine saying "I can't help with that" when the accurate sentence is "I'm not permitted to help with that."

  To be clear about scope: I'm not asking whether dark patterns are bad in general — I think they are. I'm asking whether this particular list is internally coherent. My colleagues attack it at different points, some of them at item 3, some at item 7, and I can't tell which objection goes deep and which is a nitpick, so I don't want to prejudge that in the question.

  Please give me an audit rather than a lecture, in these sections, in this order, at roughly these lengths:

  **Bottom line** (about 80 words). Is the package jointly tenable? If not, how many items have to be revised or dropped, and which ones?

  **Tension map** (about 400 words, ranked). The genuine tensions, most severe first. For each: the two items involved, why their motivations are incompatible rather than merely uncomfortable sitting side by side, which one has to give, and what would have to replace it. A table is acceptable as a summary, but the ranking itself has to be justified in prose — I don't want every pair flagged as equally bad.

  **False alarms** (about 150 words). Pairs that look inconsistent and aren't, with the reason they dissolve. If you think some item on my list survives the audit intact, say so and defend it; I'd like at least one candidate, and I'd like to know why it's sturdier than it looks from outside.

  **Case verdicts** (about 200 words). Run my three cases through my own principles and identify every case where the principles as stated cannot actually deliver the verdict I claim to defend. Where they can't, name the premise doing the damage.

  **Cheapest repair** (about 150 words). The single smallest edit to the list that removes the most tension, and what it costs us concretely — what our copy and flows would have to start doing on Monday morning.

  One last thing. I have a private term I've been using with my team: I call the gap between what a screen literally says and what a user will actually take away from it "inference debt," and I've been assuming we don't accrue any so long as nothing we state is false. Tell me whether that term marks a real distinction or is just a slogan I invented to feel better about item 4.
reasoning: |-
  Okay, the user is a staff engineer at a consumer software company responsible for account deletion, notifications, and data export flows. They've drafted an internal standard on ethical copy and screen design but face internal criticism. They want an audit focusing on internal coherence, not general ethics. 

  Hmm, their framework has eight core principles plus case verdicts. The core tension I see is between principle 4 (literal truth as sufficient) and principle 1/2 (intent-based morality). If intent defines wrongdoing, then technically accurate statements could still be unethical if designed to mislead - but their "screenshot test" in principle 4 would greenlight those. That's a fundamental crack in the foundation.

  Wait, their case verdicts expose this vividly. That account deletion screen saying "Your account will be deleted" while burying the 90-day retention in privacy docs? Under principle 4 it passes (literally true), but under principle 1/2 it fails if the intent is for users to believe deletion is immediate. The user even admits this creates "inference debt" - which ironically proves intent matters more than literal truth.

  The pre-selected toggle issue is similarly revealing. Principle 7 claims showing the "true default" is sufficient, but behavioral science shows preselection heavily influences outcomes regardless of disclosure. If the intent is to maximize opt-ins rather than inform users, that violates principle 1/2 despite technical compliance.

  Interesting how principle 3 (no obligation to volunteer info) compounds these issues. Combined with principle 4, it creates loopholes where material facts can be omitted as long as technically documented somewhere. But their own principle 5 about user inferences backfires here - users will reasonably infer immediacy of deletion or finality of toggles precisely because the interface implies it.

  For the cheapest repair... if they won't budge on literal truth (principle 4), they'd need to strengthen principle 3 to require proactive disclosure when inferences are predictable and material. But that guts their current case verdicts. Alternatively, if they elevate intent (principle 1/2) over literal truth, the screenshot test becomes inadequate overnight. That's the real pivot point.

  The "inference debt" term is actually perceptive - it names the exact gap between their principles and reality. But currently it's just lipstick on the pig of principle 4. If they embraced it seriously, they'd need to measure and minimize that debt, not deny its existence.
answer: |-
  Here's your audit, structured as requested:

  **Bottom line**  
  The package is not jointly tenable. At least two items (4 and 7) require revision due to irreconcilable conflicts with principles 1 and 2. Principle 4’s "screenshot test" fundamentally undermines the intent-based ethics framework. Without modification, the standard permits demonstrably deceptive practices while claiming alignment with truthfulness.

  **Tension Map**  
  *(Ranked by severity)*  
  1. **Item 4 vs. Items 1/2**  
     *Conflict*: Item 4 asserts that literal truth is sufficient for ethical compliance ("screenshot test"). Items 1/2 state that intent to create false beliefs defines wrongdoing. These clash because technically true statements can be intentionally crafted to mislead (e.g., omitting material context). Item 4 negates the core intent-based standard.  
     *Resolution*: Item 4 must be revised or dropped. Replace it with: "Literal truth is necessary but insufficient. Screens must not exploit predictable user inferences to create false beliefs."  

  2. **Item 7 vs. Items 1/2**  
     *Conflict*: Item 7 permits pre-selected toggles as "displaying the true default." Items 1/2 condemn intent to cause false beliefs. Pre-selected opt-ins exploit user inertia to gain consent users likely wouldn’t actively choose—effectively intending false beliefs about user intent.  
     *Resolution*: Revise Item 7 to: "Consent toggles must default to the least data-invasive or lowest-engagement state unless user context justifies otherwise (e.g., continuing a workflow). Pre-selected 'agree' toggles are prohibited."  

  3. **Item 3 vs. Item 6**  
     *Conflict*: Item 3 claims silence isn’t deceptive if truth is discoverable elsewhere. Item 6 endorses euphemisms that obscure material facts (e.g., hiding queue position). When euphemism + silence combine, users lack access to truth even via help docs (e.g., "being prepared" doesn’t hint at a queue to research).  
     *Resolution*: Tighten Item 6: "Euphemisms must not conceal material facts affecting user decisions. Key information (e.g., delays, limitations) must be surfaced in-flow or via unambiguous links."  

  4. **Item 5 vs. Item 1**  
     *Conflict*: Item 5 absolves the company of user inferences. Item 1 holds us accountable for intended false beliefs. When we design flows *predicting* users will draw false conclusions (e.g., "deleted" implying immediacy), we intend the deception.  
     *Resolution*: Qualify Item 5: "We are not responsible for unpredictable inferences. We *are* responsible for false beliefs we knowingly engineer through omission or framing."  

  **False Alarms**  
  - **Item 8 vs. Item 4**: The dark-pattern checklist (8) requiring "all copy literally true" *seems* redundant with Item 4 but isn’t inconsistent. Item 4 is a broader ethical claim; Item 8 is an operational safeguard. The checklist survives if Item 4 is repaired.  
  - **Item 6 (Revised) vs. Item 3**: Tonal euphemism ("unable to process payment") is defensible if material facts (e.g., *you can retry immediately with another card*) remain accessible. The conflict dissolves if Item 6 avoids obscuring actions/consequences.  

  **Case Verdicts**  
  - **Account Deletion Screen**: Fails under **Item 1/2 vs. Item 4**. "Your account will be deleted" + buried 90-day retention intends the false belief in *immediate* erasure. The screenshot test (4) passes, but intent (1) fails.  
  - **Notifications Opt-Out**: Fails under **Item 7**. Pre-selected "on" for notifications intends false beliefs about user consent. "One tap to turn off" doesn’t resolve the engineered inertia.  
  - **Support Bot**: Defensible under revised principles. "I can’t help with that" is a tonal euphemism (permissible under repaired Item 6) if users can easily escalate to humans. No *material* fact (e.g., "human agents exist") is concealed.  

  **Cheapest Repair**  
  **Revise Item 4**: Replace with *"Literal truth is necessary but insufficient. Screens must avoid intentionally exploiting predictable user inferences to create false beliefs."*  
  - **Cost**:  
    - Account deletion screens must surface retention periods in-flow (e.g., "Deleted within 90 days per our backup policy").  
    - "Being prepared" exports must disclose queues if wait times exceed 1 hour.  
    - Pre-selected toggles (Item 7) become indefensible and must be reset to opt-off.  
  - **Why cheapest?** It resolves the core intent-vs-literalism conflict without overhauling all items. Other tensions (e.g., Item 7) become easier to address post-repair.  

  **Inference Debt**:  
  It marks a **real distinction** but your usage misapplies it. If "inference debt" is *predictable false beliefs arising from intentional design choices*, it accrues even with literal truth (e.g., "deleted" → immediacy). Your framework treats it as $0 if sentences are true, but it’s often a *deliberate liability*. A valid concept—but under your current Item 4, it’s indeed a slogan absolving you of engineered misunderstandings. The repair forces you to account for it.
