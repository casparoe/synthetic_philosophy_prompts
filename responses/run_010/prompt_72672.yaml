  ## Brainstorming: Candidate Mappings and Theses

  **Candidate Mappings & Strains:**
  1.  **ESA as Lexical Priority:** The Act seems to forbid trade-offs, placing species survival above development costs. *Strain:* The creation of the God Squad implicitly acknowledges *some* weighing might be necessary (albeit exceptionally), contradicting pure lexicality. Furthermore, the rider bypasses it entirely.
  2.  **ESA as Threshold/Trump Value:** Species survival acts as a powerful constraint, overruling development unless exceptional circumstances (God Squad) apply. *Strain:* The God Squad's *reason* for refusal (costs > benefits) suggests it wasn't treating the fish as a trump per se, but rather as a very heavy weight within a cost-benefit framework, contradicting the non-trade-off spirit. The rider also trumps the trump.
  3.  **ESA Asserting Incomparability:** The Act forbids balancing, suggesting no valid comparison exists between extinction and development. *Strain:* The God Squad mechanism explicitly *requires* comparison ("benefits of action", "alternatives"), contradicting incomparability. The Court’s refusal to balance sunk costs specifically targets an *improper metric*, not all comparison.
  4.  **ESA Asserting Incommensurability:** No single scale (e.g., dollars) captures the values, but ordinal judgments (e.g., extinction is worse than no dam) might remain. *Strain:* The Court's ruling fits this, prohibiting dollar balancing. However, the God Squad *did* use dollar-denominated cost-benefit analysis (CBA), smuggling in commensuration.
  5.  **ESA Implying Parity:** Species survival and development are comparable, but not strictly rankable as better/worse/equal; other considerations break ties. *Strain:* The Act's language is absolute ("halt and reverse"), leaning away from parity. The God Squad used CBA, a clear ranking mechanism, not parity reasoning. Sen's objection that parity collapses into vagueness seems apt here – the institutions didn't grapple with nuanced parity but defaulted to absolutes or CBA.
  6.  **Cherokee Claim as Constitutive Incommensurability:** The sacred sites represent identity and continuity, resisting valuation on any scale oriented towards preference satisfaction or aggregate welfare. *Strain:* The institutions almost entirely ignored this claim, treating it implicitly as commensurable (or simply outweighed) by development benefits, demonstrating the challenge of recognising and accommodating such values in standard frameworks.

  **Candidate Theses & Selection:**
  1.  **Thesis 1 (Institutional Evasion):** The episode reveals institutional mechanisms (God Squad, rider) designed to *evade* the tragic choice inherent in incommensurable values, ultimately collapsing them back into commensuration (God Squad) or eliminating reasoned choice (rider). *Selection:* Plausible, but potentially overstates the 'tragic' nature if commensuration is inevitable.
  2.  **Thesis 2 (Metric Smuggling Triumphant):** Despite formal abjuration of commensuration (ESA, Court), practical decision-making inevitably smuggles in a metric (God Squad's CBA), demonstrating the fragility and perhaps impossibility of sustaining pure incommensurability claims in complex governance. *Selection:* Strong, directly engages the stipulation, explains the God Squad's paradoxical action.
  3.  **Thesis 3 (Hierarchy of Incommensurability):** Not all incommensurabilities are treated equally. The episode shows institutions struggling more visibly with ecological incommensurability framed by law, while systematically ignoring or downgrading deeper, constitutive incommensurability (Cherokee sites), revealing how power shapes which incommensurabilities are acknowledged and which are rendered invisible or commensurable. *Selection:* Most compelling. It accounts for the differential treatment of the fish and Cherokee claims, links to Anderson's pluralism about modes of valuation (instrumental vs. constitutive), and highlights the political dimension Calabresi & Bobbitt identify. This thesis will be argued for.

  **Main Analysis**

  **(a) The Mapping: Agents, Values, and Metrics at Key Nodes**

  1.  **Lower Courts (Mid-1970s):**
      *   **Agents:** Federal District Court, Court of Appeals.
      *   **Value-Bearers:** Snail darter survival (ecological value, species integrity, legal imperative) vs. Economic development (jobs, investment, regional prosperity, sunk costs).
      *   **Option Set:** Halt construction vs. Allow completion.
      *   **Permitted Metric:** Primarily legal interpretation (does ESA apply? Is injunction warranted?). Some implicit weighing of equities (e.g., balance of harms) *before* ESA's force was fully clarified.
      *   **Forbidden Metric (Formally):** None explicitly forbidden at this stage, leading to initial rulings favouring the dam based partly on sunk costs and projected benefits.
      *   **Metric Used:** Mixture of legal reasoning and implicit cost-benefit/equity balancing (including sunk costs), favouring completion.

  2.  **Supreme Court (June 1978):**
      *   **Agents:** SCOTUS.
      *   **Value-Bearers:** Snail darter survival (absolute statutory command, species existence value) vs. Economic development (including sunk costs - ~75% spent).
      *   **Option Set:** Uphold injunction halting dam vs. Allow dam completion regardless of ESA.
      *   **Permitted Metric:** Strict statutory interpretation. Is the ESA's command clear? Does it admit balancing?
      *   **Forbidden Metric:** Explicitly forbade balancing the equities – i.e., forbade commensurating the value of the fish (operationalised as compliance with the statutory command) against the economic costs, *especially sunk costs*. The Court held these were incomparable *within the legal framework it was applying*; the statute removed the court's ordinary equitable discretion.
      *   **Metric Used:** Lexical prioritisation based on statutory command. The ESA's protection of the species was treated as lexically prior to the economic costs and sunk investments. The refusal to weigh sunk costs is a *denial of commensuration* – treating the spent money as irrelevant to the present value judgment mandated by the Act.

  3.  **Endangered Species Committee (God Squad) (Early 1979):**
      *   **Agents:** Cabinet-level Committee.
      *   **Value-Bearers:** Snail darter survival (endangered species) vs. Project completion (remaining economic benefits, sunk costs as justification for minimising waste).
      *   **Option Set:** Grant exemption from ESA vs. Deny exemption (uphold injunction).
      *   **Permitted Metric:** Specific statutory criteria: irreconcilable conflict, regional/national significance of project, lack of reasonable alternatives, benefits of action clearly outweigh costs *and* alternatives (emphasis added). Required explicit comparison.
      *   **Forbidden Metric:** The Committee was *not* forbidden from using cost-benefit analysis; indeed, it was mandated to consider "benefits" and "costs". However, the *spirit* of the ESA and the Committee's role as a last resort for tragic choices implied it should grapple with incommensurable values, not simply default to dollars.
      *   **Metric Used:** Overt commensuration via dollar-denominated cost-benefit analysis. They quantified project benefits (deemed low, especially without the town) and costs (including some recognition of ecological loss, but primarily in displaced monetary values like lost recreation), concluding costs > benefits. This was **not** a refusal based on the intrinsic, incomparable value of the species.

  4.  **Congressional Appropriations Rider (Autumn 1979):**
      *   **Agents:** US Congress (legislators), President.
      *   **Value-Bearers:** Snail darter survival vs. Project completion (sunk costs, local political pressure, perhaps symbolic assertion of legislative supremacy).
      *   **Option Set:** Exempt Tellico Dam from ESA via legislation vs. Allow the injunction/God Squad denial to stand.
      *   **Permitted Metric:** Legislative fiat. No specific metric required; pure political will.
      *   **Forbidden Metric:** None. Unconstrained by the ESA's framework or judicial/administrative reasoning.
      *   **Metric Used:** **The Reason-Free Channel.** The decision was made without articulated justification or comparison of values. It bypassed the ESA's structure, the Court's ruling, and the God Squad's analysis entirely through a procedural manoeuvre (a rider on essential spending legislation). No reasons pertaining to the *values* at stake needed to be given or were given.

  **(b) Diagnosis: Classifying the Outcomes**

  *   **Lower Courts:** **Overt Commensuration (Implicit).** They engaged in balancing, factoring in sunk costs and projected benefits against the emerging ecological/legal claim, though not yet fully constrained by the ESA's absolutes.
  *   **Supreme Court:** **Lexical Override.** The Court interpreted the ESA as establishing a lexical priority for species protection (via the statutory command) over conflicting economic considerations, explicitly rejecting commensuration, especially regarding sunk costs. This refusal *is* the assertion of incommensurability *within that specific institutional and normative framework*.
  *   **Endangered Species Committee (God Squad):** **Metric Smuggling.** Formally tasked with a grave decision potentially involving incommensurable values (species extinction vs. development), and positioned as the body for "tragic choices" where trade-offs might be unavoidable, the Committee defaulted to overt commensuration via CBA. Crucially, the dollar metric silently *encoded* a ranking: it treated the species' value as quantifiable (at least partially) within the economic calculus, thereby smuggling commensuration back into a process designed to acknowledge its potential impossibility. It denied the exemption not because the fish was beyond price, but because its *price* (as reflected in lost benefits or mitigation costs) was too high relative to the dam's *price*.
  *   **Congressional Appropriations Rider:** **The Reason-Free Channel.** This outcome decisively illustrates the fourth possibility. Congress made the trade-off – sacrificing the species' critical habitat for the dam – through a mechanism requiring *no justification* of the value choice. It was an exercise of raw political power, unburdened by the need to commensurate, assert lexical priority, or even engage in metric smuggling. It simply overrode the entire structure erected to handle the incommensurability problem. This aligns with Calabresi & Bobbitt's point about mechanisms allowing society to "deny" the tragic choice is being made – here, by burying it in unrelated legislation and offering no reasons.

  **(c) The Cherokee Claim: Differing Incommensurability?**

  The objection grounded in Tanasi, Chota, and Great Tellico represents a fundamentally *different* type of incommensurability than the snail darter claim:

  1.  **Nature of the Claim:** This is not primarily about instrumental value (ecological function, potential medicines) or even existence value in the abstract. It is about **constitutive value** (Anderson) – the sites are integral to Cherokee identity, history, sovereignty, and cultural continuity. The value resides in the *relationship* between the people and these specific places; flooding them constitutes a rupture in that constitutive bond. This claim resists valuation on *any* scale oriented towards preference satisfaction, welfare aggregation, or monetary equivalence. It is arguably closer to **incomparability** than incommensurability; there may be *no* meaningful common ground for comparison with development benefits.
  2.  **Commensurability with the Fish Claim?** The two claims are profoundly **incommensurable with each other**. The snail darter claim, even framed in terms of species integrity or legal imperative, operates within a discourse of biodiversity, ecological systems, and legal rights/rules. The Cherokee claim operates within a discourse of cultural survival, historical injustice, and collective identity. There is no common metric – not dollars, not utility, not even a shared conception of "loss" – that can capture both simultaneously without grossly distorting one or both. Attempting to weigh the fish against the Cherokee sites would be a category error.
  3.  **Institutional Neglect & Its Meaning:** The near-total institutional disregard for the Cherokee claim, compared to the intense focus on the fish, is stark and revealing. It demonstrates:
      *   **The Framing Power of Law:** The ESA provided a clear, actionable *legal* hook for the fish claim, creating a visible point of institutional leverage. The Cherokee claim, lacking an equivalent powerful statutory framework (though property rights and historical preservation laws existed, they proved weaker levers in this context), was marginalised.
      *   **Susceptibility to Metricisation:** The fish claim, while resisting dollar commensuration, could still be framed in terms of legal compliance, scientific classification, and discrete habitat loss. The Cherokee claim's constitutive nature made it inherently less tractable to bureaucratic and legalistic handling; it couldn't be easily quantified or proceduralised. Institutions favour problems they can process.
      *   **Power and Visibility:** The episode tragically illustrates that which incommensurabilities receive institutional attention is heavily influenced by existing power structures and the availability of resonant (often legal or scientific) narratives. The theoretically deeper challenge of constitutive incommensurability was effectively rendered invisible by the system.

  **(d) The Retrospective Twist: What Was Valued?**

  The subsequent survival of the fish, discovery of other populations, downgrading, delisting, and taxonomic reclassification complicate the incommensurability claim *if* the value was pinned solely to the *Percina tanasi* entity as a discrete biological species facing irreversible extinction in that specific location.

  *   **What Was Being Valued?** The retrospective developments suggest the core value at stake during the conflict was **not** solely, or perhaps even primarily, the biological entity narrowly defined. It was a constellation:
      *   **The Legal Rule & Institutional Integrity:** Upholding the absolute command of the newly enacted ESA as a principle, preventing exemptions that would gut it. The fish was the concrete instantiation of this rule.
      *   **The Mode of Institutional Attention:** Ensuring that ecological values received serious, non-negotiable consideration in development decisions – a radical shift symbolised by the ESA. The snail darter became the symbol of this shift.
      *   **The Symbol:** The fish became a potent symbol for the intrinsic value of nature, the limits of human development, and the power of citizen enforcement against bureaucracy.
      *   **The Place & Ecosystem:** Protecting the integrity of that specific stretch of river and its ecosystem, valued intrinsically or for its ecological function.
      *   **The Principle of Non-Reversibility:** Acting *as if* the loss was irreversible, embodying the precautionary principle inherent in strong endangered species protection. The ESA's structure is predicated on avoiding irreversible loss, even if reversibility *later* becomes possible (which is often unknowable at the decision point).
  *   **Does the Reversibility Undermine the Case?** No. The *ex ante* perspective is crucial. At the decision point (1973-1979), the potential loss *was* believed to be irreversible extinction of a unique species. Valuing the principle of avoiding irreversible ecological harm, or upholding the legal framework designed to prevent it, remains valid *even if* the specific biological loss was later averted or reassessed. The incommensurabilist argument was grounded in the *kind* of value (species survival, ecological integrity, legal imperative) and its resistance to trade-offs *at that time*, not on the contingent fact of its ultimate reversibility. Broome's points about small differences don't readily apply here; the *perceived* potential loss was vast and unique.
  *   **Does the Taxonomic Change Matter?** Minimally. The core conflict was about protecting a distinct population/evolutionary lineage and its habitat based on the best scientific understanding *at the time*. The value resided in preserving biodiversity and the specific ecological role of that population in that river, regardless of its later taxonomic classification. The *principle* of protecting threatened populations and their habitats remains central.

  **(e) Verdict: Theory and Case in Tension**

  *   **Does the episode confirm incommensurabilism?** It provides **mixed support, revealing complexities and challenges, rather than simple confirmation.** The Supreme Court's ruling exemplifies an institutional assertion of incommensurability (treating the ESA command as lexically prior, refusing sunk cost balancing). The profound difference between the fish and Cherokee claims highlights genuine pluralism and potential incomparability. Anderson's point that costing expresses an attitude is vividly illustrated by the contrast between the Court (refusing cost-based balancing) and the God Squad (embracing it). However, the ultimate trajectory – the God Squad's metric smuggling and Congress's reason-free override – demonstrates the immense practical and political difficulty of *sustaining* institutional commitments to incommensurability in the face of sunk costs, local pressure, and political expediency. It reveals the thesis's vulnerability to evasion and collapse.

  *   **Sophisticated Commensurabilist Account:** A sophisticated commensurabilist (e.g., following Broome, or a contextualist) could argue:
      1.  **Inevitability of Trade-offs:** The sequence proves that trade-offs *must* ultimately be made, even for seemingly sacred values. The Court's lexical stance proved unstable, requiring the God Squad safety valve, which itself was overridden. Pure incommensurability is institutionally unsustainable.
      2.  **Revealed Preference:** The outcomes reveal society's *actual* commensuration. Congress's rider, though reason-free, reflects the aggregated political weight assigned to completing the dam (incorporating sunk cost aversion, local interests) versus preserving the fish/habitat at that specific point in time. The God Squad's CBA, while flawed, represented an *attempt* at rational comparison acknowledging diverse values (even if monetised crudely).
      3.  **Broome on Small Differences:** While the initial choice seemed stark (extinction vs. dam), the retrospective knowledge shows the differences were smaller than perceived (other populations existed, the species wasn't unique). Broome's argument suggests that if we can make small-stakes trade-offs involving values (e.g., spending a *little* more to save *some* habitat), we can, in principle, construct a comparative relation, however vague (addressing Sen's parity concern).
      4.  **Process Values:** The value defended wasn't the fish *simpliciter*, but the *process* of environmental review and legal constraint on development. This process value *can* be weighed against other process values (e.g., efficient use of public funds, local self-determination) and substantive outcomes.

  *   **Best Incommensurabilist Reply:** The strongest reply concedes practical challenges but defends the core insight:
      1.  **Distortion of Value:** The commensurabilist outcomes demonstrate *precisely* the distortion Anderson and others warn of. Reducing the Cherokee claim to silence and the fish claim first to a legal token and then to a dollar figure in the God Squad's CBA fundamentally misrepresented the nature of the values at stake. Congress's rider expressed power, not reasoned valuation.
      2.  **Institutional Failure, Not Conceptual Failure:** The collapse into commensuration or reason-free override doesn't prove incommensurability is false, but rather that existing institutions are poorly equipped to handle it authentically. The God Squad *should* have grappled with the tragic choice explicitly, acknowledging the potential incommensurability, rather than smuggling in CBA. Its use of CBA was a *failure* of its mandate, not proof of commensurability's validity.
      3.  **Ex Ante Precaution:** The commensurabilist relies on hindsight. The *ex ante* perspective, where irreversible loss is a genuine possibility, is where incommensurability arguments have the strongest moral and practical force (the core of the ESA's design). Protecting against irreversible harm requires treating certain values as incomparable *at the decision point*. Broome's small differences argument struggles with the unique, potentially irreversible character perceived at the time.
      4.  **The Cherokee Counterpoint:** The total neglect of the Cherokee constitutive value, which resists even the *attempts* at commensuration applied to the fish, stands as a stark counterexample to the commensurabilist claim that all values ultimately resolve into weights. Some values refuse to be "weighed" at all.

  **Conclusion:** The Tellico Dam episode vividly illustrates the *tension* between the theoretical recognition of incommensurable values (especially constitutive and ecological) and the practical realities of institutional decision-making under pressure. It confirms the *existence* of claims that resist easy commensuration (lexically prior values, constitutive attachments) and the institutional mechanisms (lexical override, tragic choice bodies) designed to address them. However, it also starkly reveals the powerful forces – sunk costs, political pressure, institutional convenience – that drive metric smuggling (God Squad) and reason-free overrides (Congressional rider), demonstrating the fragility of commitments to incommensurability in practice. It underscores that *which* incommensurabilities get recognised and protected is deeply political, as shown by the marginalisation of the Cherokee claim compared to the fish. The episode ultimately poses an anomaly for pure, easily institutionalised incommensurabilism while simultaneously providing powerful evidence for the pluralist view that not all values can be meaningfully compared without loss or distortion. The sophisticated commensurabilist can explain the *outcomes* as revealed weights, but struggles to account for the *distortion* inherent in the processes that produced them, particularly regarding the Cherokee sites. The theory is silent on how to *force* institutions to authentically engage with constitutive incommensurability when powerful incentives exist to ignore or commensurate it.
