prompt: |-
  I am drafting a position memo for an interdisciplinary working group on institutional design, and the convenor has asked each of us to state our commitments compactly so that the others can attack the set rather than the prose. My framework is built on the idea of a safe Pareto improvement (SPI): a modification of some decision situation — a mechanism, a bargaining game, a program with conditional participation — that, under assumptions every party already accepts about how the situation would be resolved by default (say, that nobody plays a strictly dominated strategy, and that structurally identical sub-games are played identically), guarantees that everyone does at least as well as they would have and that someone does strictly better. The guarantee is meant to hold with certainty, and without any assumption about which equilibrium the default play would have landed on; that is the point of the device, since the parties in the cases I care about lack usable probabilistic beliefs about each other's default behavior. My memo claims that such modifications should be adopted as a matter of course and require no further justification, because no participant can identify a state of the world in which they end up worse off than they would have.

  Here is the full list I intend to defend. (1) A change is admissible just in case it is an SPI in the sense above; admissible changes are to be enacted, and their enactment needs no appeal to any further distributive or aggregative principle. (2) I reject interpersonal comparisons of utility altogether — this is a large part of why the device appeals to me, since each party's guarantee is expressed in that party's own units, and unanimity does the work that aggregation would otherwise have to do. (3) I accept Arrow's theorem along with its conditions read as fairness desiderata, and I take it to show that no general procedure for aggregating individual orderings into a social ordering can be defended; my program is therefore a politics of unanimity-based, aggregation-free reform rather than a politics of social welfare functions. (4) Safety is assessed ex ante and with certainty: I am unmoved by the objection that a change might turn out badly for someone, provided the guarantee holds under the shared assumptions about default play. (5) The assumptions that generate the guarantee are not all equally good, though. When a party's default behavior is shaped by adaptive preferences, misinformation, or a poor grasp of the game they are in, I think the safety case should be constructed on a corrected model of their default play — the guarantee should hold for the person they would be if better informed — rather than on the assumptions they would actually endorse. (6) The status quo has no special normative weight in my framework; I do not want it to privilege existing entitlements, and whether a reform is admissible should turn on the strength of the guarantee, not on the fact that it disturbs a baseline that happens to be entrenched. (7) Where several admissible SPIs are available, I want to be able to prefer the one that most reduces inequality of outcome; and where two admissible SPIs can be enacted only one after the other, I hold that enacting both is at least as good as enacting either, since a series of safe steps should never leave anyone worse placed than a single safe step would.

  I would like a consistency audit of this set, not a defense of it and not a survey of the surrounding literature — you can work entirely from the commitments as I have stated them. Please rank the genuine tensions by severity rather than listing them as equally bad, and for each say precisely what would have to give and what the cheapest available repair is, together with what that repair costs me elsewhere in the list. Separately, identify any pair that only looks contradictory and explain why it dissolves, since a few of my colleagues have already objected on grounds I suspect are confused. Then name the single revision that would clean up the most damage. I am deliberately not telling you which commitment I would be most willing to abandon, because I do not know, and I do not want the audit steered by a hint. Begin with your bottom line in no more than two sentences, then give the ranked audit; keep the entire response under 700 words and use no citations.
reasoning: |-
  Okay, the user is drafting a position memo on institutional design centered around Safe Pareto Improvements (SPIs). They need a consistency audit of their seven commitments without defense or literature references. The key is to identify genuine tensions, rank them by severity, suggest repairs, clarify non-contradictions, and recommend a single revision.

  First, I'll examine each commitment for internal conflicts. Commitment 7 mentions reducing inequality as a tiebreaker between SPIs. But commitment 2 rejects interpersonal utility comparisons entirely, which seems incompatible since inequality reduction requires comparing utilities across individuals. That's a severe tension—either inequality concern must go or the rejection of interpersonal comparisons needs qualification.

  Next, commitment 5 advocates using "corrected models" for agents with misinformation, while commitment 4 insists on ex ante safety guarantees based on shared assumptions. If safety depends on corrected behaviors that agents don't endorse, it undermines the certainty requirement. This is moderately severe—either drop the correction approach or weaken the certainty claim.

  Commitment 6 denies special status to the status quo, but SPIs are defined relative to a default outcome. If the baseline isn't fixed, the SPI framework becomes incoherent. This is moderate—the user must accept some baseline dependence, even if not privileging existing entitlements.

  For non-contradictions: Commitment 3's rejection of social welfare functions aligns with SPI's unanimity focus (no conflict with 1-2). Commitment 4's certainty requirement is consistent with SPI's definition (no probabilistic beliefs needed).

  The most damaging tension is between 2 and 7. The cheapest repair is to drop inequality reduction from 7, preserving core SPI logic. Alternatively, allow thin interpersonal comparisons for tiebreaking, but this costs coherence with commitment 2.

  The single best revision is removing the inequality clause from commitment 7. It resolves the worst tension without major collateral damage. I'll structure the response to rank tensions clearly, explain repairs, and highlight non-contradictions—all under 700 words.
answer: |-
  ## Bottom Line
  Your framework contains one severe tension between rejecting interpersonal comparisons (2) and endorsing inequality reduction as a tiebreaker (7), and two moderate tensions: between ex ante certainty (4) and corrected models (5), and between denying status quo weight (6) and needing a defined default for SPIs. The single most damaging inconsistency is between (2) and (7).

  ### Ranked Genuine Tensions (Severe to Moderate)

  1.  **(2 vs. 7) - Severe:** Commitment (2) rejects interpersonal utility comparisons *altogether*. Commitment (7) proposes preferring the SPI that "most reduces inequality of outcome," which *requires* comparing the magnitude of utility differences (or outcomes) *across individuals* to see which change reduces inequality more. This is a direct contradiction.
      *   **What Must Give:** Either the absolute rejection of interpersonal comparisons (2) or the inequality reduction criterion in (7).
      *   **Cheapest Repair:** Remove the phrase "that most reduces inequality of outcome" from (7). SPIs can be enacted without tiebreaking criteria, or use a different, non-comparative tiebreaker (e.g., simplicity, speed of implementation).
      *   **Cost:** You lose the ability to use inequality reduction as a criterion between equally admissible SPIs. Any other comparative tiebreaker (like maximizing minimum utility) would also violate (2).

  2.  **(4 vs. 5) - Moderate:** Commitment (4) insists safety is assessed "ex ante and with certainty" based on "shared assumptions about default play" that parties "already accept." Commitment (5) advocates using "a corrected model of their default play" based on what the person "would be if better informed," *even if this differs from "the assumptions they would actually endorse."* This injects an external normative judgment about preferences/knowledge that the parties themselves do not share, undermining the "certainty" based on *their* shared assumptions and the "ex ante" guarantee *they* can accept.
      *   **What Must Give:** Either the requirement that assumptions are "shared" and "already accept[ed]" (part of 4) or the "corrected model" approach (5).
      *   **Cheapest Repair:** Weaken (5). Limit "corrected models" only to cases of provable, objective misinformation about the *rules* of the default game itself (not preferences or values), framing this correction as part of establishing the *true* default scenario everyone *should* accept based on objective facts. Avoid correcting preferences.
      *   **Cost:** You lose the ability to handle adaptive preferences or subjective misinformation about payoffs/world states within the safety guarantee. It restricts paternalistic correction to clarifying the game structure.

  3.  **(6 vs. SPI Definition) - Moderate:** Commitment (6) states "the status quo has no special normative weight" and "should [not] turn on... the fact that it disturbs a baseline that happens to be entrenched." However, the *very definition of an SPI* is relative to a specific "default" outcome ("everyone does at least as well as they would have"). While the *entitlements* within the status quo aren't privileged, the *baseline outcome prediction* ("how the situation would be resolved by default") is absolutely essential and *is* the reference point. Denying *any* weight to the baseline makes the SPI concept incoherent.
      *   **What Must Give:** The absolute denial of baseline weight in (6).
      *   **Cheapest Repair:** Reframe (6). Emphasize that the *normative legitimacy* or *entitlements* of the status quo baseline are irrelevant for assessing an SPI. The baseline is *only* a pragmatic prediction point ("this is what we think happens otherwise"), not a morally privileged state. The guarantee compares to *this predicted outcome*, regardless of how just or entrenched it is.
      *   **Cost:** You explicitly acknowledge that SPIs require *some* baseline prediction, even if it's arbitrary or unjust. You lose the rhetorical force of claiming the status quo has *no* weight; it has the weight of being the counterfactual.

  ### Apparent Contradictions that Dissolve

  *   **(1 vs. 3):** Commitment (1) mandates enacting SPIs as admissible changes needing no further principle. Commitment (3) rejects social welfare functions based on Arrow. This seems contradictory ("you mandate something but reject the tools to find it?"). **Dissolution:** SPIs are found by analyzing specific decision situations/games relative to their default, *not* by constructing a general SWF aggregating preferences over all possible social states. SPI discovery is context-specific institutional design, not global preference aggregation. Your "politics of unanimity-based reform" (3) *is* the process of finding and enacting SPIs (1). No conflict.
  *   **(4 vs. Objections):** Commitment (4) says you're "unmoved" if a change "might turn out badly" provided the guarantee holds ex ante with certainty. This might seem to ignore real-world uncertainty. **Dissolution:** Your framework explicitly assumes the guarantee holds *with certainty* under the stipulated behavioral assumptions ("shared assumptions about default play"). You reject probabilistic beliefs about behavior, relying on dominance/subgame perfection. If the *assumptions used to derive the guarantee* are correct, the bad outcome *cannot* occur. The objection assumes uncertainty where your framework assumes it is eliminated by the SPI definition itself.

  ### Single Best Revision
  **Remove the inequality reduction clause from commitment (7).** This resolves the most severe inconsistency (with 2) cleanly, preserving the core SPI logic and your rejection of interpersonal comparisons. The cost (losing inequality as a tiebreaker) is less damaging to the framework's coherence than weakening (2) or (5) or compromising the SPI baseline. It leaves intact your core mechanism (1-4,6), your rejection of aggregation (3), and your stance on corrections (5) while removing the direct contradiction.
