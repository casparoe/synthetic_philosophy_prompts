prompt: |-
  So I volunteer a few hours a week at a small grantmaking group, and at our last strategy session the new program officer kept reaching for a triage analogy. Choosing between causes, she said, is like being the medic at a mass casualty scene: you don't go to the worst-off first, you go to the ones you can actually save, and you tag the hopeless cases expectant and walk past them without feeling guilty about it. She used that to argue we should basically rank causes by tractability and let importance fall where it may, and that anyone who wants to fund the most important-sounding but least workable causes is just being squeamish.

  Can you audit the analogy for me properly? I want the correspondence laid out explicitly — a table is fine. What in the casualty scene is supposed to be importance, whats tractability, what if anything is neglectedness, what plays the role of the fixed number of medics and stretchers, who's the medic and who's the patient, and what would tagging a whole cause area "expectant" actually consist in given that these aren't identifiable individuals.

  Then separate the disanalogies that genuinely undercut her argument from the ones that are just decoration. Two I keep circling and can't resolve: first, does the source she's importing even have a slot for neglectedness, or does the three-factor framework quietly lose one of its legs when you run it through a triage lens — in a casualty scene nobody is more or less crowded, everyone's equally untreated until someone gets to them. And second, a triage officer has to take the available medicine as given, whereas how tractable a cause is seems like something a funder can partly change over time by paying for research and tool-building, which would make the expectant tag self-fulfilling rather than a discovery about the world. Are those load-bearing or am I overreading?

  Finally: does the walk-past-the-worst-off conclusion survive once all the disanalogies are on the table, and if the analogy can't carry the weight she's putting on it, what should she be reaching for instead — and does the replacement license the same conclusion or a different one?
reasoning: |-
  Hmm, the user is asking about a triage analogy used in grantmaking discussions. They volunteer at a small grantmaking group where a new program officer keeps comparing cause selection to medical triage at a mass casualty scene. Specifically, the officer argues they should prioritize tractability over importance when funding causes, comparing this to medics focusing on patients they can actually save rather than the worst-off cases.

  I need to carefully audit this analogy for them. They want me to lay out the correspondence explicitly - perhaps through a table showing what each element in the triage scenario represents in grantmaking. Key elements to map include: importance (which might be analogous to severity of injury?), tractability (like survivability with intervention?), neglectedness (which seems absent in triage?), resources (medics and stretchers representing funding/staff?), roles (medic as funder, patient as cause?), and what "tagging a cause as expectant" would mean.

  The user has identified two troubling disanalogies they can't resolve. First, neglectedness doesn't seem to exist in triage - in a mass casualty scene, everyone is equally untreated until helped, whereas in philanthropy, some causes are chronically underfunded. Second, in medicine, treatments are fixed, but funders can actually invest in research to make "untreatable" causes more tractable over time, meaning that tagging something "expectant" could become a self-fulfilling prophecy.

  I need to separate which disanalogies genuinely undermine the argument from those that are merely decorative. The neglectedness issue seems particularly important since it's one leg of the effective altruism framework (importance, tractability, neglectedness). The dynamic nature of tractability in philanthropy versus the static nature in triage also appears to be a critical flaw.

  Finally, I should evaluate whether the core conclusion - to walk past the "worst-off" causes - survives once we account for these disanalogies. If the analogy doesn't hold, what better framework should the program officer use instead? And would that alternative framework lead to the same or different conclusions about prioritizing tractability?

  The user seems to be wrestling with philosophical and practical aspects of effective altruism in a grantmaking context. They're clearly thoughtful about this, recognizing that while the triage analogy has intuitive appeal, it might oversimplify complex philanthropic decisions. I should provide a balanced analysis that respects the program officer's perspective while rigorously examining where the analogy breaks down.
answer: |-
  Here's a thorough audit of the triage analogy, separating correspondence, critical disanalogies, and implications for funding strategy:

  **Explicit Correspondence Table:**

  | Triage Element          | Grantmaking Analog                            | Notes                                                                 |
  | :---------------------- | :-------------------------------------------- | :-------------------------------------------------------------------- |
  | Mass Casualty Scene     | Global/Ecosystem Challenges                   | The context of overwhelming need/scale.                               |
  | Injured Patient         | A Specific Cause Area                         | e.g., "Malaria Prevention," "AI Safety," "Local Food Justice."        |
  | **Patient's Severity**  | **Importance (Scale/Badness)**                | Magnitude of suffering, lives affected, irreversible harm prevented.  |
  | **Survivability w/ Care** | **Tractability (Solvability)**                | Probability of meaningful progress *given intervention*.              |
  | **Medic**               | **Program Officer/Funder**                    | Resource allocator making urgent decisions.                           |
  | **Stretchers/Medics**   | **Fixed Funding/Staff Capacity**              | Limited resources constrain how many causes can be addressed.         |
  | **Tagging "Expectant"** | **Designating a Cause as "Intractable"**      | Concluding the cause has low ROI *with current approaches/knowledge*. |
  | **"Hopeless" Patient**  | **Cause Deemed Intractable**                  | e.g., "Curing all neurodegenerative diseases with current science."   |
  | **"Savable" Patient**   | **Cause Deemed Tractable**                    | e.g., "Distributing bednets for malaria prevention."                  |
  | **Triage Decision**     | **Funding Allocation Choice**                 | Selecting which causes receive resources.                             |
  | **Walking Past**        | **Not Funding the Cause**                     | Allocating resources elsewhere.                                       |
  | **Guilt**               | **Moral Distress over Unfunded Needs**        | The emotional burden of leaving important problems unaddressed.       |

  **Key Disanalogies & Their Weight:**

  1.  **Neglectedness is Missing (Load-Bearing):**
      *   **Triage:** All patients are *equally untreated* upon arrival. No patient has prior access to care influencing their current state. Neglect *during* the event is uniform.
      *   **Grantmaking:** Causes are *wildly differentially neglected*. Some have massive existing funding streams (government, major foundations), others languish with minimal attention. Treating all causes on the scene as equally "untreated" ignores this crucial factor. A highly important and tractable cause might be ignored simply because it's *also* highly neglected and thus appears "untreated." The triage lens erases neglectedness as a variable, undermining the core 3-factor framework.

  2.  **Tractability is Dynamic, Not Fixed (Load-Bearing):**
      *   **Triage:** The medic has a fixed toolkit (bandages, tourniquets, knowledge). They cannot invent new cures on the spot. Survivability is assessed based on *current, immutable capabilities*.
      *   **Grantmaking:** Funders *can change the tractability landscape*. Investing in research, tool-building, movement-building, policy development, or piloting new interventions *directly increases a cause's tractability over time*. Declaring a cause "expectant" (intractable) based on *today's* tools can become a self-fulfilling prophecy by starving the very work needed to make it tractable tomorrow. Triage assumes a static medical reality; philanthropy operates in a dynamic innovation space.

  3.  **Identifying "Patients" (Causes) is Complex (Decorative/Manageable):**
      *   **Triage:** Patients are discrete, identifiable individuals with assessable injuries.
      *   **Grantmaking:** Causes are abstract, multifaceted, overlapping constructs. Defining the boundaries of a "cause area" is subjective. This adds complexity but doesn't fundamentally invalidate prioritization; it just requires careful cause definition.

  4.  **Time Horizon & Feedback Loops (Load-Bearing):**
      *   **Triage:** Decisions have immediate, observable consequences (life/death within hours/days). Feedback is rapid.
      *   **Grantmaking:** Impact is often long-term, diffuse, and hard to measure. Feedback loops are slow and noisy. Declaring a cause "expectant" might preclude discovering it *was* tractable given enough time or a different approach, which you won't see if you never try.

  5.  **Moral Responsibility & "Abandonment" (Load-Bearing Context):**
      *   **Triage:** "Walking past" involves literal, immediate death. The medic has no other option given constraints. The moral weight is immense but circumstantial.
      *   **Grantmaking:** "Walking past" involves *not funding*. While this has real consequences, the *directness* and *immediacy* differ. Funders also arguably have a broader societal responsibility to consider systemic solutions and long-term potential beyond immediate triage logic. The *context* of moral responsibility is less starkly zero-sum in the long run.

  **Conclusion on the "Walk-Past" Strategy:**

  The **core conclusion ("walk past" the most important but least tractable causes) does NOT survive intact** when critical disanalogies are addressed:

  1.  **Neglectedness Matters:** Ignoring it risks perpetually underfunding high-potential causes simply because others are already crowded. A cause could be important, *potentially* tractable, but severely neglected – triage logic might miss it entirely.
  2.  **Tractability is Malleable:** Blindly applying the "expectant" tag based on current knowledge stifles innovation. Funders have a unique role in *creating* tractability for the most important problems.
  3.  **Long-Term View:** Philanthropy can afford (and arguably has a duty) to take some bets on hard, important problems with long time horizons, which pure triage forbids.

  **What She Should Reach For Instead & The Conclusion:**

  1.  **Portfolio Theory:** This is the strongest replacement.
      *   **Framework:** Allocate resources across a *mix* of causes:
          *   **High-Certainty/Short-Term:** High tractability, solid evidence, quick wins (equivalent to "Savable" patients - bednets, deworming). Provides proof, morale, and learning.
          *   **High-Potential/Long-Term:** High importance, *potentially* high tractability *if* progress is made, possibly neglected (equivalent to investing in *developing treatments* for severe injuries *before* the next disaster). Requires R&D, movement building, policy work. This is where neglectedness shines.
          *   **Moonshots:** Extremely high importance, very low *current* tractability, but transformative potential (e.g., transformative AI safety, fundamental disease cures). Small bets to explore feasibility. *This is the slot the triage analogy completely misses.*
      *   **Licenses:** A **different conclusion**. Instead of *only* walking past the "worst-off," it argues for **strategically allocating *most* resources to high-certainty/high-tractability areas, while dedicating a *significant minority* of resources to improving the tractability of the most important problems (high-potential/long-term) and exploring moonshots.** It explicitly budgets for changing the tractability landscape and accounts for neglectedness. Walking past happens only for causes deemed truly hopeless *even after* considering potential for tractability gains and their neglectedness, and even then, small moonshot bets might still be justified.

  2.  **Robust Decision-Making Under Uncertainty:**
      *   **Framework:** Explicitly model uncertainty around importance, tractability, and neglectedness. Use frameworks like expected value theory, robust optimization, or scenario planning. Quantify (even roughly) probabilities and ranges of outcomes.
      *   **Licenses:** A **more nuanced conclusion.** It forces explicit acknowledgement of the uncertainty in declaring something "expectant." It might still favor tractable causes with high confidence but would be more cautious about entirely writing off important areas with high uncertainty or potential for tractability gains. It highlights the risk of the self-fulfilling prophecy.

  **In Summary:**

  *   **Triage Analogy:** Useful for illustrating **resource constraints** and the **emotional challenge of leaving needs unmet**. It powerfully argues against *only* funding the most "important-sounding" causes without regard for feasibility.
  *   **Critical Flaws:** It **erases neglectedness**, **assumes tractability is static**, and **ignores the funder's role in creating tractability**. It forces an overly short-term, zero-sum perspective.
  *   **Better Approach:** **Portfolio Theory** combined with **explicit uncertainty modeling**.
  *   **Revised Conclusion:** Prioritize **high-tractability, high-certainty interventions for a majority of resources**, but **dedicate substantial resources to improving the tractability of the most important/neglected problems** and **make small exploratory bets on transformative moonshots**. Avoid declaring causes "expectant" *permanently*; reassess based on progress and changing landscapes. The triage officer's cold pragmatism needs to be tempered by the philanthropist's capacity for strategic patience and innovation investment.
