  ### THE CHRONICLE  
  *Serving the Midlands since 1887*  
  **WEDNESDAY, OCTOBER 19TH**

  ---

  ### **ASK DR. LENNOX**  
  *Your Questions, Straight Answers. No Sugarcoating.*

  **EDITOR’S NOTE:** Dr. Eleanor Lennox continues to provide her unique perspective each week, despite her repeated requests to drop the “Dr.” title. The Chronicle feels her medical background lends valuable authority to the column. The title stays.

  ---

  **Dear Dr. Lennox,**
  My son (32) has stopped eating properly. He picks at food, mostly lives on crackers and water. He talks to people who aren’t there, whispers back to voices only he hears. Since March, he’s locked himself in his bedroom, only coming out for the bathroom at night. He looks like a ghost. His father and I are terrified. The crisis team mentioned “severe psychosis” and “possible schizophrenia” and said he might need to be “sectioned” for his own good. But he refuses to go anywhere. He says he’s fine. Should I call them? Should I force him? My heart breaks every time I hear that lock click.
  **— Desperate in Derbyshire**

  **Dear Desperate,**
  You describe a situation of profound suffering – yours. Your fear, your heartbreak, your terror are palpable and real. Your son’s choices, however, are also his own. Choosing to eat little, choosing to speak to unseen companions, choosing to lock his door – these are actions he takes. They are difficult, bewildering, perhaps agonizing choices for you to witness, but they remain choices made by a man in his own home about his own body and space.

  The urge to have others intervene, to use force dressed in medical language, is understandable when faced with such distressing conduct. But force remains force. Calling professionals to overpower him, restrain him, and remove him to a place of confinement does not become medicine simply because those performing the act wear white coats or carry legal paperwork. It becomes the imposition of your will, or society’s will, upon his, justified by the claim that his choices are not *real* choices because they frighten or confuse you. They are choices nonetheless. He controls his body; he controls his door.

  Your power lies not in compelling him, but in your own actions. You control your home. You control whether food is offered at the door, whether you speak through the wood, whether you seek support for *your* anguish in watching this unfold. You cannot make him eat, speak, or unlock the door. You can only manage your own conduct in the face of his. The question isn't whether *he* should be taken somewhere against his will, but whether *you* can bear to continue living next to his closed door without resorting to violence disguised as care. That is your burden, and your choice alone.

  ---

  **Dear Dr. Lennox,**
  My husband has gambled away nearly everything – savings, our daughter’s college fund, even borrowed against the house. He swears he’ll stop but finds a way back to the track or online sites every time. He’s wrecked with guilt afterwards, crying, promising therapy, but it happens again. His brother says it’s a “disease” like alcoholism, that he can’t help it. I’m so angry I can barely look at him. Is it a disease? Doesn’t that mean it’s not his fault?
  **— Furious & Financially Ruined**

  **Dear Furious,**
  Labeling destructive conduct a “disease” is a popular way to shift responsibility. It transforms the gambler from an actor making ruinous choices into a passive victim of an internal affliction. This is convenient for him, and perhaps momentarily soothing for you. It suggests his actions are not truly *his*, absolving him of blame and potentially diluting your fury.

  But actions are actions. Placing a bet, logging into a gambling site, draining an account – these are deliberate choices. The crying, the promises, the guilt? Also choices. They may be choices driven by despair, habit, or weakness, but they remain choices for which he is accountable. There is no lesion in his brain compelling his finger to click “place bet.” There is a pattern of conduct that devastates those around him.

  Calling it a disease asks you to suspend judgment, to replace anger with pity, and to wait passively for a “cure” that does not exist because no physical disease is present. It asks you to bear the consequences of his choices while excusing him from the burden of changing them. You are furious because you have been profoundly wronged. That fury is a justified response to his actions, not a symptom of your misunderstanding. The question isn’t about his fault; it’s about what *you* will do now, knowing his choices continue to harm you. His conduct is his problem to solve; protecting yourself and what remains is yours. Your anger is telling you something important. Listen to it.

  ---

  **Dear Dr. Lennox,**
  When I disagree with the psychiatrists at the hospital about my diagnosis, they write in my notes that I “lack insight” or that it’s a “symptom.” You call diagnoses “metaphors” and “moral judgments.” How do I know which label is the real one? Both just seem like ways of saying I’m wrong.
  **— Labeled & Skeptical**

  **Dear Labeled,**
  You have identified the core issue perfectly. Both descriptions – “lack of insight” as a symptom, or a diagnosis as a “metaphor” – are labels applied by others to explain your refusal to agree with them. The hospital label frames your disagreement as evidence of pathology *within you*. My description frames their diagnosis as a judgment *about you*, disguised as medical fact. Both are interpretations.

  The difference lies in honesty about power. The hospital label claims the authority of objective science: your disagreement *is* a symptom, a sign of disease. This justifies their actions (medication, detention) as necessary treatment. Calling a diagnosis a metaphor simply states the truth: it is a name we give to a collection of behaviors and reported experiences that trouble us. It carries no inherent scientific truth, only the weight of consensus and institutional power. It doesn’t make the behaviors vanish or become involuntary; it just gives a medical-sounding name to conduct deemed unacceptable.

  Neither label is “real” in the sense of being a discovered physical fact like a tumor. They are tools of description and control. The hospital label serves to invalidate your perspective and legitimize their control over you. My label serves to demystify their process and return the focus to your choices and responsibilities. You are not “wrong” for disagreeing; you are simply disagreeing. The power to enforce one label over the other, however, rests firmly with the institution holding the keys. Your skepticism is well-placed. It recognizes the labeling for what it is.

  ---

  **MAILBAG:** *Next week: The mother-in-law who thinks my cat’s aloofness is “depression,” and the man convinced his neighbor’s humming is “targeted harassment psychosis.” Send dilemmas to AskDrLennox@Chronicle.co.uk.*

