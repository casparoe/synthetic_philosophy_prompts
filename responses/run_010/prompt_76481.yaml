  The user is clearly highly knowledgeable about EU processes—they reference specific mechanisms like screening reports, Copenhagen criteria, Article 7 procedures, and the Bulgaria-Romania monitoring mechanism. Their background as a lawyer rather than a political theorist shows in how precisely they describe institutional details while seeking philosophical clarity about what those details imply. The mention of their professor's "history has a direction" remark suggests they're now confronting that unspoken assumption in EU policy.

  Their core question is about what the EU's approach presupposes regarding political development: Does it assume liberal democracy becomes irreversible after accession? They want this implicit theory reconstructed rigorously—its endpoint, the "crossing" moment, why it's one-way. They also ask about rival theories the EU system excludes (like perpetual fragility), whether the asymmetry is just about leverage loss, and if the system is coherent. Finally, they wonder what would change if the EU treated all members as permanent candidates.

  I need to unpack several layers here. First, the factual asymmetry: pre-accession has teeth (funding freezes, chapter suspensions), while post-accession tools (Article 7, rule of law reports) are hamstrung by veto points and lack enforcement. The user notes even the Bulgaria-Romania mechanism—the sole post-accession conditionality experiment—lapsed. They also highlight the double standard: candidates must accept all acquis (including euro), while members enjoy opt-outs.

  The philosophical tension they spot is between the EU demanding "irreversible reforms" pre-accession—emphasizing durability—while acting as if backsliding is unthinkable post-accession. This suggests an implicit teleology: crossing the threshold makes democracy self-sustaining. But as they note, reality contradicts this (Hungary, Poland). So is the EU's stance incoherent? Or just pragmatic (leverage gone post-accession)?

  Key rival theories to address: 
  - Perpetual fragility (all democracies need external upkeep) 
  - Equilibrium models (institutions can unravel accidentally) 
  - Standing decay risk (no endpoint). 

  The user wants scrupulous separation: what *must* the practice presuppose versus what merely fits? For example, does it *require* believing in an endpoint, or just behave "as if" it does? Their deflationary point about leverage is crucial—maybe it's not philosophy, just realpolitik. But then why stress "irreversibility" pre-accession when leverage exists? That *does* seem philosophically loaded.

  On coherence: The practice asserts two things simultaneously. Pre-accession: "Reforms must be irreversible because backsliding is possible." Post-accession: "Backsliding is so exceptional it needs no robust tools." This is logically inconsistent unless you assume accession *changes* a state's nature—which is the teleological claim.

  If the EU abandoned this for "permanent candidacy," changes would include: treaty reforms for expulsion/exit clauses, symmetrical monitoring with teeth (e.g., QMV sanctions), ending opt-outs for non-compliant members, and folding the Copenhagen criteria into permanent membership conditions. Essentially, dissolving the accession/membership binary.

  The user's unease stems from seeing the EU's operational hypocrisy: demanding candidates prove future-proofing while ignoring members' backsliding. Their lawyerly mind detects unstated premises—and they're right. The answer lies in the gap between federalist ideals (where democracy is irreversible) and intergovernmental realities (where sovereignty trumps enforcement).
answer: |-
  Your analysis exposes a profound tension at the heart of EU enlargement and governance, revealing an implicit teleology that merits careful deconstruction. The arrangement presupposes a specific—and philosophically loaded—view of political development, though it is pragmatically undergirded by institutional constraints. Let's reconstruct the theory, its rivals, and its internal contradictions:

  ### The Implicit Teleology: "Accession as Civilizational Threshold"
  1. **The Endpoint**: A self-sustaining liberal democratic order characterized by:
     - **Institutional Autopoiesis**: Institutions capable of self-correction (e.g., independent courts checking executive overreach).
     - **Elite Internalization**: Dominant political factions viewing liberal democracy as the *only* legitimate framework.
     - **Veto Players**: Entrenched pro-reform actors (e.g., constitutional courts, civil society) able to block backsliding.
  2. **The "Crossing" Moment**: Accession is treated as a ritual of political maturation where:
     - External conditionality is internalized as domestic constraint.
     - EU membership itself becomes a structural veto point (e.g., economic elites opposing illiberalism to preserve market access).
     - The state transitions from an object of reform to a subject of European governance.
  3. **Irreversibility Claim**: The threshold is "one-way" because:
     - **Path Dependence**: Reforms create constituencies (e.g., Euro-lobbies) whose interests align with the new order.
     - **Sunk Costs**: The price of reversal (economic isolation, loss of prestige) becomes prohibitively high.
     - **Socialization**: Membership in the "club" instills norms that become taken-for-granted.

  ### Rival Accounts Excluded by the Practice
  - **Perpetual Fragility Thesis**: That all democracies require external maintenance. The EU's post-accession toolkit rejects this, treating backsliding as aberrant rather than systemic.
  - **Equilibrium Unraveling**: The view that institutions decay absent active upkeep (e.g., Tilly's "state capacity" models). The lapse of the Bulgaria-Romania mechanism assumes equilibrium stability post-accession.
  - **Standing Decay Risk**: The Madisonian fear that power always encroaches on liberty. The Commission's "preventive" reports acknowledge risk but lack instruments proportionate to it.

  ### Philosophical Underdetermination and Pragmatic Realities
  - **The Deflationary Answer**: Leverage *does* evaporate at accession. Conditionality works only when the prize (membership) is withheld. Post-accession, sanctions require unanimity because states guard sovereignty fiercely.
  - **The Tension**: Why demand "irreversible reforms" pre-accession if leverage exists? Because:
    - **Functional Necessity**: Screening must simulate future stability to justify enlargement to skeptical publics.
    - **Moral Hazard Deterrence**: Signaling that backsliding *will* be punished pre-accession discourages strategic mimicry.
    - **Asymmetric Bargaining**: Candidates accept intrusive scrutiny as the price of entry; members do not.
  - **Internal Incoherence**: The practice asserts two incompatible propositions:
    1. Pre-accession: *"Democratic consolidation is fragile and requires external guarantees."*
    2. Post-accession: *"Democratic consolidation is permanent upon accession."*  
    This contradiction is papered over by treating accession as a black box—transformation occurs by fiat.

  ### Abandoning Teleology: A "Permanent Candidacy" Model
  To treat all states as perpetual candidates would require:
  1. **Treaty Changes**:
     - Introduce **expulsion mechanisms** (Art. 50 TEU only permits voluntary exit).
     - Replace unanimity for **sanctions with QMV** (e.g., suspending voting rights under Art. 7).
     - Eliminate **opt-outs** (requiring full *acquis* compliance for all members).
  2. **Reporting & Monitoring**:
     - Merge enlargement chapters and rule of law reports into a **single, binding review cycle** for all states.
     - Link **structural funds to rule of law compliance** (as now partially exists but requires stronger enforcement).
  3. **Closing Chapters**:
     - Replace "closed chapters" with **dynamic compliance scores** (e.g., a "democracy index" affecting EU budget allocations).
     - Formalize **reopening mechanisms** for core chapters (e.g., judiciary) based on regression.

  ### Conclusion: A Ritual of Transformation Without Guarantees
  The EU's practice is not philosophically coherent but *ritually functional*. It enacts a **Weberian "rationalization" myth**: accession ceremonially transforms "candidates" into "members," after which defects become internal matters. This myth serves real purposes—legitimizing enlargement, reassuring voters—but clashes with reality, as Article 7 deadlocks prove. The arrangement presupposes a liberal teleology it cannot enforce, revealing a core vulnerability: **the EU assumes history has ended for its members, but history obeys no such decree**. The asymmetry persists because admitting its falsity would unravel the enlargement enterprise itself—yet your unease signals that the ritual may be losing its persuasive power.
