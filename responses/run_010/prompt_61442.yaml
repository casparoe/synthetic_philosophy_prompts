answer: |-
  *(adjusting spectacles, leaning forward with hands clasped)*  
  You press a fair point, but you risk conflating cause with content. What the experimenters manipulate during the night is the sleeper’s *physiological condition* – a state of her nervous system, say – which disposes her to *utter certain sounds* when stimulated by their questions. These utterances are not reports of a concurrent experience; they are vocal reactions, like a murmur or a sigh, albeit complex ones. The sounds "three" and "the man with the ledger" are sleep-behaviors, no more indicative of a present dream than a knee-jerk is indicative of a present intention to kick.  

  Now, this manipulation *causes* a difference in what happens *at waking*. When she wakes, she has impressions – perhaps vivid, perhaps fragmentary – and she reports them. The impressions she forms are shaped by the prior nocturnal utterances, just as a morning headache might be shaped by a bump on the head during the night. The "agreement" you note between the 3 a.m. utterance and the morning report isn’t evidence of a shared nocturnal experience; it’s a causal chain: intervention → sleep-utterance → waking impression. The "something settled" isn’t a dream-content at 3 a.m.; it’s a physiological disposition that will later manifest in her waking impressions. The ledger "figures in the dream" only because the experimenters’ mid-night action led her to *say words* that then influenced her *upon waking*. Without the waking report, we wouldn’t call those noises "dream material"—we’d call them sleep-talking.  

  So, to your question: "What was settled at 3 a.m.?" Nothing mental. A bodily state was altered, priming her to vocalize in a way that would later cohere with her waking impressions. The "dream" begins when she wakes and recounts those impressions. Before that? She was asleep, producing sounds. Nothing more. Your turn: how does your account avoid smuggling in "experience" while the subject sleeps?
