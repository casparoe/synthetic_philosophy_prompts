prompt: |-
  I'm marking for a third-year game theory module — mostly economists, a couple of philosophers sitting it as an outside option — and I've got forty-odd scripts to get through before the paper goes to the exam board on Friday. This one is question 2 of 4 and worth 20 marks, split 8 / 5 / 7 across the parts. The external examiner already told us off for being generous on this paper last year, so I want to be careful, but I also don't want to nick marks off someone who's basically got it right. I've done a first pass and can't quite decide if its borderline, so I'd rather get an independent read on it before I write anything on the script. The question as set was:

  > Consider the following two-player normal-form game. Player 1 chooses a row, player 2 a column; payoffs are listed (player 1, player 2).
  >
  > &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;L&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;C&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;R
  > T&nbsp;&nbsp;&nbsp;(2, 3)&nbsp;&nbsp;(4, 0)&nbsp;&nbsp;(0, 0)
  > M&nbsp;&nbsp;&nbsp;(1, 2)&nbsp;&nbsp;(1, 1)&nbsp;&nbsp;(1, 2)
  > B&nbsp;&nbsp;&nbsp;(3, 0)&nbsp;&nbsp;(0, 0)&nbsp;&nbsp;(4, 3)
  >
  > (a) Find the set of strategy profiles that survives iterated elimination of strictly dominated strategies. A strategy may be dominated by a mixed strategy as well as by a pure one; show your working. [8]
  > (b) Does the order in which the eliminations are carried out affect your answer to (a)? Justify your answer. [5]
  > (c) Suppose instead that at each round we eliminate weakly dominated strategies. Would your answer to (b) change? Would the set of surviving profiles still contain every Nash equilibrium of the game? Justify both answers. [7]

  And here's the script, transcribed more or less as written:

  > (a) First look for domination by pure strategies. For player 1, T doesn't dominate M, because T gets 0 at R where M gets 1, and B doesn't dominate M either, because B gets 0 at C. But the mixture ½T + ½B gives (2.5, 2, 2) across L, C, R, which beats M's (1, 1, 1) against every column, so M is strictly dominated and goes. Symmetrically for player 2: neither L nor R dominates C on its own, since L only ties C at B and R only ties C at T, but the mixture ½L + ½R gives player 2 (1.5, 2, 1.5) against T, M and B, all strictly better than C's (0, 1, 0), so C goes as well. In the reduced game B strictly dominates T, since 3 > 2 and 4 > 0, and R strictly dominates L, so both of those go too and we're left with the single profile (B, R). Since only one profile survives, that must be the unique Nash equilibrium of the game.
  >
  > (b) No. Strict dominance is a relation between two strategies belonging to the same player, and it's defined by comparing their payoffs against the opponent's strategies, so crossing some of the opponent's strategies off the list can't alter the comparison between the two we're actually looking at. Nothing that fails to be dominated at the start can become dominated further down the line, so whichever order you do the deletions in you end up with the same surviving set.
  >
  > (c) For this particular game it wouldn't make any difference, because every strategy we deleted in (a) was strictly dominated and strict dominance implies weak dominance, so exactly the same sequence of deletions is still available. In general though the answer to (b) would change, because with weak dominance the order can matter: deleting a strategy that was only weakly dominated can get rid of a tie that was the reason some other strategy was weakly dominated in the first place. On the Nash equilibrium question, no change either — a weakly dominated strategy is still never a best response to anything the opponent might play, so it can't carry positive weight in an equilibrium, and the surviving set will still contain every Nash equilibrium of the game.

  What I want back is a mark for each part and a total, plus the actual comments I'd write in the margin that justify it — tied to particular sentences in the script, not a general impression of it. Do check the arithmetic in (a) as well as the reasoning, and where the student asserts something false tell me what the correct claim is; if this game itself supplies a counterexample to something they've said, point at the exact strategies that show it, because I'd much rather the feedback be concrete than a mini-lecture. I'd also like you to say explicitly which sentences in (b) and (c) would sail straight past someone marking forty of these an hour on a Thursday evening, and whether getting the conclusion of (b) right should protect the justification offered for it — that's the bit I keep going back and forth on. If you'd land somewhere different from what a reasonable first-pass marker would, just say so and explain where the marks are going; the moderation form wants a sentence on any part where the reasoning and the conclusion come apart in the marking.
reasoning: |-
  Okay, let me tackle this game theory marking systematically. First, I need to carefully evaluate each part of the student's answer against the question requirements.

  For part (a), the student's mixed strategy calculation seems correct - ½T+½B does yield (2.5,2,2) against L/C/R, dominating M's (1,1,1). Similarly, ½L+½R gives (1.5,2,1.5) dominating C's (0,1,0). After eliminating M and C, B dominates T (3>2 and 4>0) and R dominates L (3>0 and 3>2). The final profile (B,R) is correct. However, the unnecessary claim about Nash equilibrium should be ignored since it's not part of the question. The arithmetic and elimination sequence appear accurate.

  Part (b) has a major issue. While the conclusion that order doesn't matter for strict dominance is correct, the reasoning contains a significant error. The student claims "nothing that fails to be dominated at the start can become dominated later" - but this is false as elimination can reveal new dominances. The correct justification should focus on the transitivity of strict dominance. I need to decide how much credit to give since the conclusion is right but reasoning flawed.

  In part (c), the student correctly notes that in this specific game weak dominance elimination would yield the same result. They also rightly state that order generally matters for weak dominance. However, the claim that weakly dominated strategies "can't carry positive weight in equilibrium" is incorrect - they can if the domination is weak. For the Nash question, the student is wrong that all equilibria are preserved under weak IESDS.

  For marking, I'll assign partial credit where appropriate and provide specific marginal comments tied to exact sentences. The comments should point out errors concretely using game examples rather than abstract explanations. I'll also note which subtle errors might be missed during rushed marking.
answer: |-
  ### Marking Report & Feedback  

  **Overall:** The student demonstrates strong understanding in (a) but makes significant conceptual errors in (b) and (c). The Nash equilibrium claims are irrelevant/incorrect but do not detract from core answers. Final mark: **14/20** (7 + 3 + 4).  

  ---

  ### Part (a): **7/8**  
  **Feedback:**  
  - ✓ Correct identification that M is strictly dominated by ½T + ½B:  
    *Margin:* "Good: ½T+½B vs. LCR gives (2.5,2,2) > (1,1,1), so M dominated."  
  - ✓ Correct elimination of C via ½L + ½R:  
    *Margin:* "Yes: ½L+½R vs. TMB gives (1.5,2,1.5) > C's (0,1,0)."  
  - ✓ Correct subsequent eliminations: B > T (3>2, 4>0) and R > L:  
    *Margin:* "Reduced game: B dom T, R dom L → (B,R) survives."  
  - ✗ *Minor deduction:* Unnecessary NE claim.  
    *Margin:* "Ignore NE—not asked. Focus on IESDS set only. (B,R) is correct profile."  

  **Why not 8?** Arithmetic is perfect, but extraneous NE remark costs 1 mark (minor overreach).  

  ---

  ### Part (b): **3/5**  
  **Feedback:**  
  - ✓ Correct conclusion ("No, order doesn’t matter").  
  - ✗ **Critical error in justification:**  
    *Margin:* "False: 'Nothing that fails to be dominated at the start can become dominated later' is incorrect. *Example:* In other games, eliminating a strategy can reveal new dominances (e.g., if a strategy only dominates after another is removed). Strict dominance is transitive, so order doesn’t matter, but not for this reason."  
  - *Marker note:* The conclusion ("No") might sail past a rushed marker, but the erroneous justification ("can’t alter the comparison") is glaring and must be penalized.  

  **Mark breakdown:**  
  - 1 mark for correct conclusion.  
  - 2 marks for partial reasoning (correctly notes domination depends on opponent’s *current* strategies).  
  - Deduction: -2 for false general claim.  

  ---

  ### Part (c): **4/7**  
  **Feedback:**  
  - ✓ Correct that order matters for weak dominance in general:  
    *Margin:* "Yes: Order can affect weak IESDS (e.g., in games with ties)."  
  - ✓ Correct that this game’s outcome is unchanged:  
    *Margin:* "Valid: Same deletions work as strict dom ⇒ weak dom."  
  - ✗ **Major error on Nash equilibria:**  
    *Margin:* "False: Weakly dominated strategies *can* be in NE! *Counterexample in this game:* (M,L) is Nash (P1: 1≥max{2,3}? Wait—3>1, so not NE. *Better example:* In ‘Battle of Sexes’, weakly dom strategies are in NE). Here, (B,R) is only NE, but weak IESDS *could* eliminate NE in other games (e.g., if deletion breaks ties)."  
    *Concrete correction:* "Weak IESDS does NOT necessarily preserve all NE (e.g., delete weakly dominated strategy that is part of an NE). Here, (B,R) survives, but the general claim is false."  
  - *Marker note:* The phrase "a weakly dominated strategy is still never a best response" is dangerously wrong and might be missed if marking quickly.  

  **Mark breakdown:**  
  - 2 marks for correct order-dependence claim + justification.  
  - 1 mark for correct game-specific outcome.  
  - 1 mark for noting weak dom ⇒ not necessarily in NE (despite flawed reasoning).  
  - Deduction: -3 for false "never best response" claim and incorrect NE preservation.  

  ---

  ### Summary of Marks  
  - (a): 7/8  
  - (b): 3/5  
  - (c): 4/7  
  - **Total: 14/20**  

  **Final script comments:**  
  "Strong work on (a) with precise mixed-strategy calculations. In (b), conclusion correct but justification flawed—order doesn’t matter for strict IESDS due to transitivity, not because domination status can’t change. In (c), you correctly note order matters for weak dominance but wrongly claim weakly dominated strategies can’t be in NE (they can, and weak IESDS may delete NE). Avoid overclaiming (e.g., NE in (a))."  

  **Moderation note:** For (b), the correct conclusion protected 1 mark, but the reasoning error (-2) is severe. For (c), the correct observations on order/game-specific outcome earned credit, but the NE error (-3) is substantial.
