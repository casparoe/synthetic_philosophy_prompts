prompt: |-
  ok so my friend Sam and I just torched like two hours of a dinner over the Frege-Geach problem and neither of us won, and now I want to immortalize it as a joke for our group chat (all philosophy people, they'll get it, they'll also absolutely judge it).

  the shape of the fight: Sam thinks expressivism is dead on arrival because nobody's expressing any attitude in the antecedent of a conditional, so if that's where the moral sentence is hiding, the whole conditional has no content to give the inference anything to run on — and the expressivist can't just say "well modus ponens is valid, relax," they owe an account of why. I said that's way too fast: this is the technical bill every quasi-realist has been paying for decades, there's the higher-order attitude move where the conditional expresses disapproval of *combining* the two attitudes, there's Gibbard's plan-laden stuff, Schroeder's being-for business, at worst it's a mortgage not a funeral.

  Write me a joke about this. Constraints, sorry:

  - it has to actually turn on the embedding problem. not on "philosophers argue about nothing," not on expressivists just going BOO at people. if the punchline would survive with "expressivist" swapped for "utilitarian," bin it.
  - ideally it dramatizes the asymmetry between a moral sentence standing on its own and the exact same sentence tucked inside a conditional — somebody who's completely happy to commit outright but falls apart the second they only have to *entertain* the thing, or the reverse.
  - bonus points for a little tag at the end that gets at the validity half: that "it looks like a normal modus ponens" is precisely the thing under dispute.
  - keep it tight, like 4 to 8 lines, and it should be sayable out loud at a table rather than an essay wearing a joke costume.

  then, separately and in like two sentences, tell me what the joke is doing mechanically — which feature of the problem the punchline is actually keyed to — so I can check whether it lands before I send it. no need to cite anything or point me at reading, I just want to know you hit the right nerve and not a generic nerd-joke one.
