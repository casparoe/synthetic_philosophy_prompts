answer: |-
  Here's the joke:

  **Sam:** "Stealing is wrong. Period."  
  **You:** "Agreed! So... *if* stealing is wrong, then returning wallets is good?"  
  **Sam:** "Obviously."  
  **You:** "Okay: imagine I stole this wallet."  
  **Sam:** "You MONSTER! Give it back!"  
  **You:** "But *if* stealing is wrong..."  
  **Sam:** *[visibly short-circuiting]* "...please... don't make me *entertain* the premise... the inference works *too* well..."  

  **Mechanics breakdown:** The punchline keys to Sam's confident expressivist "Boo!" stance collapsing when the moral claim is embedded in the antecedent ("*if* stealing is wrong"), forcing him to *consider* it without *expressing* the attitude, which breaks his account of why modus ponens holds. The "works *too* well" tags the validity dispute by ironically highlighting the inference's intuitive pull despite the missing attitude.
