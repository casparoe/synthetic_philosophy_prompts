  Hmm, the user is directing a clinical ethics consultation service at a large public safety-net hospital and needs a practical procedure based on a relational conception of personhood. This is quite a complex and nuanced request with multiple detailed requirements. Let me unpack this carefully.

  First, the user needs an operational procedure that frontline staff (social workers and hospitalists) can execute quickly at 2 AM without prior philosophical training. The core challenge is translating the ubuntu-inspired relational framework into actionable steps while preserving its essence - especially the identity/solidarity distinction and preventing relational deficits from diminishing patient entitlements.

  The relational framework has several key components that must survive simplification: personhood as participation in community rather than intrinsic property, the dual elements of shared identity ("we") and solidarity (acting for others' good), gradational personhood, and recognizing that exploitative relationships are degraded forms rather than counterexamples. Crucially, the procedure must convert relational deficits into institutional obligations - if no suitable relational proxy exists, the institution itself must step up as decision-maker.

  For the triage and full procedures, I'll need to design:
  - A 10-minute screen identifying potential decision-makers beyond statutory lists
  - A 90-minute assessment evaluating relationships through identity/solidarity lenses
  - Clear thresholds for "no" (cannot decide), "refer" (needs committee), and "yes" (can decide)
  - Documentation requirements for probate court scrutiny

  The escalation table will handle edge cases: warm but non-decisional relationships, paid caregivers crossing into friendship, minor claimants, repudiated relationships, abusive foundations, and collective claimants. Each needs a one-line disposition preserving relational principles while acknowledging practical/legal constraints.

  For the case applications:
  - Case A (estranged son vs. neighbor) should test whether solidarity trumps legal hierarchy
  - Case B (isolated dementia patient) will demonstrate institutional obligation activation
  - Case C (religious community vs. prior wishes) will likely produce the "unwelcome" result where the procedure overrides the user's preference for off-list claimants when prior repudiation exists

  Key failure modes to address include:
  - Over-reliance on staff intuition in threshold judgments
  - Potential gaming under time pressure (e.g., skipping verification)
  - Unavoidable limitations with unidentified patients
  - Cross-cultural application concerns

  Throughout, I'll embed safeguards:
  - Mandatory committee referral for life-sustaining treatment decisions
  - Attending physician sign-off requirement
  - Explicit "relational deficit → institutional obligation" conversion mechanism
  - Anti-diminishment clause for isolated patients

  The documentation will use plain language ("Shared Identity Confirmed", "Sole Relational Proxy") suitable for court scrutiny while avoiding philosophical jargon. Time targets will be enforced through strict step limits and parallel processing where possible.
answer: |-
  ## Relational Proxy Determination Procedure  
  *For unbefriended adult patients lacking decision-making capacity when statutory surrogates are unavailable*

  **CORE PRINCIPLES PRESERVED**  
  1. **Identity/Solidarity Distinction**: We assess both *shared identity* ("we" connection) and *active solidarity* (consistent goodwill actions). Both required.  
  2. **Moral Standing ≠ Authority**: Having a relationship grants standing; authority requires capacity to engage in *this decision*.  
  3. **Institutional Obligation Activation**: Isolated patients trigger *greater* institutional duty. No relationship = system becomes proxy.  
  *Deliberately Dropped*: Degrees of personhood (irrelevant to entitlement); taxonomy of degraded relationships (impractical at 2 AM).  

  ---

  ### **I. 10-Minute Triage Screen**  
  *Conducted by duty social worker*  

  | Step | Question (To Whom) | Sufficient Answer | Insufficient → Next | "No" Stop | "Refer" Stop |  
  |------|-------------------|-------------------|---------------------|-----------|-------------|  
  | 1 | "Who visited/chatted with patient weekly before hospitalization?" (Nursing staff, chart) | Any named person(s) | None → **Go to Full Procedure** | N/A | N/A |  
  | 2 | "Did patient call anyone 'family' (blood or chosen)?" (Unit clerk, nurse) | Named person(s) | None → Step 3 | N/A | N/A |  
  | 3 | "Who managed patient’s daily needs (meds, meals, laundry)?" (Nurse aide, chart) | Named person(s) | None → **Activate Full Procedure** | N/A | N/A |  
  | **OUTCOME**: Named person(s) identified → **Proceed to Full Procedure**. No names → **Full Procedure with Institutional Proxy Track**.  

  ---

  ### **II. 90-Minute Full Procedure**  
  *Conducted jointly by social worker & hospitalist. Attending signs final determination.*  

  | Step | Action | Sufficient Evidence | Insufficient → Next | "No" Stop | "Refer" Stop | Chart Language |  
  |------|-------|---------------------|---------------------|-----------|-------------|---------------|  
  | 1 | **Verify Identity**: "Show me evidence of 'we' bond." (Witnesses, photos, letters) | ≥2 examples of mutual belonging (e.g., "He called her ‘sis’", holiday cards together) | Weak/conflicting → Step 2 | No evidence → **Institutional Proxy** | Disputed evidence → Ethics Committee | "Shared Identity Confirmed: [Evidence]" |  
  | 2 | **Verify Solidarity**: "Show consistent, voluntary care *without pay*." (Witnesses, records) | ≥1 year of unpaid, hands-on help (e.g., rides to dialysis, meal prep) | Paid care/spotty help → Step 3 | No unpaid care → **Institutional Proxy** | Motive disputed → Ethics Committee | "Active Solidarity Confirmed: [Examples]" |  
  | 3 | **Assess Decision-Readiness**: "Can they articulate patient’s *values* (not wishes)?" (Ask claimant: "What mattered most to them?") | Describes core values (e.g., "Independence mattered most") | Only medical preferences → Step 4 | Cannot articulate → **Institutional Proxy** | Values conflict → Ethics Committee | "Values Articulation: [Statement]" |  
  | 4 | **Check Exploitation**: "Was this relationship forced/fear-based?" (Chart, collateral contacts) | No evidence of coercion | Suspicion raised → **Refer to Ethics** | Coercion confirmed → **Institutional Proxy** | Ambiguous power dynamic → Ethics Committee | "No Coercion Detected" |  
  | 5 | **Final Authority Check**: "Is claimant ≥18 and capacitated?" (Hospitalist assessment) | Oriented, understands choice | Impaired/minor → **Institutional Proxy** | Incapacitated → **Institutional Proxy** | Capacity borderline → Ethics Committee | "Claimant Capacity Confirmed" |  
  | **OUTCOME**: Passes all → **Relational Proxy Authorized**. Any "No" → **Hospital as Default Proxy**.  

  > **ANTI-DIMINISHMENT CLAUSE**: Steps ending in "Institutional Proxy" trigger automatic ethics consult within 24hrs. Isolation increases institutional duty.  

  ---

  ### **III. Escalation Table (1-Page)**  

  | Scenario | Disposition | Reason |  
  |----------|------------|--------|  
  | Warm relationship without prior decisions | **Refer to Ethics Committee** | Solidarity untested for decision-making |  
  | Paid caregiver with friendship evidence | **Proceed to Full Procedure** | Evaluate if unpaid solidarity exists *beyond* job |  
  | Minor or incapacitated claimant | **Institutional Proxy** | Lacks legal/relational authority |  
  | Relationship repudiated by capacitated patient | **Institutional Proxy** | Identity bond actively broken |  
  | Relationship founded on patient’s past abuse | **Institutional Proxy** | Coercion inherent; solidarity impossible |  
  | Collective claimant (e.g., congregation) | **Refer to Ethics Committee** | Group identity requires deliberation |  

  ---

  ### **IV. Case Applications**  

  **Case A (78M, stroke, aphasic)**  
  - *Son (statutory)*: Fails Identity (estrangement, anger in chart). **Stop at Step 1 → No**.  
  - *Neighbor*: Passes Identity (31 yrs, keys), Solidarity (dialysis rides), Values ("Hated hospitals, loved gardening"). **Authorized Proxy**.  
  *Result: Neighbor beats son.*  

  **Case B (91F, dementia, no kin)**  
  - *Nursing assistants*: Fail Solidarity (paid). **Stop at Step 2 → Institutional Proxy** (auto ethics consult).  
  - *Deacon*: Fails Identity (not seen in 10 yrs). **Stop at Step 1 → Institutional Proxy**.  
  *Result: Hospital as proxy.*  

  **Case C (44F, TBI, religious community)**  
  - *Elders*: Pass Identity (communal bond) BUT repudiated while capacitated (chart). **Escalation Table → Institutional Proxy**.  
  - *Prior wishes*: Not a claimant. Framework prioritizes current relationships *unless repudiated*.  
  ***Unwelcome Result**: Elders rejected despite relational strength because patient terminated bond. Procedure overrides your prior.*  

  ---

  ### **V. Failure Modes**  

  1. **Confident Wrong Answers**:  
     - *False solidarity*: Paid caregivers misrepresent unpaid care (gamed under time pressure). Mitigation: Require 2 sources.  
     - *Overlooked repudiation*: Staff skip chart review. Mitigation: Step 4 mandatory.  

  2. **Staff Gaming**:  
     - Time pressure → rushed solidarity checks (accepts single witness). Cost: 15 min if skipped.  
     - Avoid "Refer" paths to dodge committee delay.  

  3. **Unresolvable Cases**:  
     - *Unidentified patients*: No history → **Automatic Institutional Proxy + Ethics**.  
     - *Cross-cultural application*: Framework applies universally. Ubuntu defines personhood, not cultural eligibility.  

  4. **Judgment Calls (Marked in Procedure)**:  
     - Step 1: "Evidence of mutual belonging" → **Social worker** (threshold).  
     - Step 2: "Consistent unpaid help" → **Hospitalist** (1-year threshold).  
     - Step 3: "Articulates values" → **Social worker** (values vs. wishes distinction).  

  **Final Output**: A single-page recommendation form signed by attending, recording proxy name or "Hospital as Proxy" with chart language from each step. Life-sustaining treatment decisions **always** to full committee.  

  ---  
  This procedure embeds relational theory into auditable thresholds, converts isolation into system responsibility, and forces identity/solidarity verification while remaining executable at 2 AM. The unwelcome outcome in Case C demonstrates it overrides preferences when relationships are revoked.
