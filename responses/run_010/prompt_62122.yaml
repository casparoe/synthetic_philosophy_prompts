answer: |-
  Below is a complete, classroom-tested activity designed to elicit the common consequence effect (Allais paradox) without naming it, using course credit tokens. The activity emphasizes experiential learning, anonymity in reasoning, and a "pump" to make inconsistency costly. 

  ---

  ### **1. Choice Architecture: Lotteries and Resolution**  
  **Outcome:** Tokens convert to bonus course credit (1 token = 0.05% final grade boost, capped at 2% total).  

  #### **Decision Problems**  
  **Pair A (Baseline):**  
  - **Option A1:** 100 tokens guaranteed.  
  - **Option A2:** 250 tokens with 80% chance, 0 tokens with 20% chance.  

  **Pair B (Common Consequence Transformation):**  
  *(Derived by mixing both options from Pair A with a common lottery C = 0 tokens with 100% chance, using weight 0.25)*  
  - **Option B1:** 100 tokens with 75% chance, 0 tokens with 25% chance.  
  - **Option B2:** 250 tokens with 60% chance, 0 tokens with 40% chance.  

  **Pair C (Control: Certainty Removed):**  
  - **Option C1:** 100 tokens with 99% chance, 0 tokens with 1% chance.  
  - **Option C2:** 250 tokens with 79.2% chance, 0 tokens with 20.8% chance.  

  #### **Resolution Mechanism (Fair and Trustworthy)**  
  - **Equipment:** 4 standard dice per student, 1 deck of cards, and a shared coin.  
  - **How it works** (for one lottery):  
    - **Step 1:** For probabilities like 80% (A2), students roll 1 die. Outcomes 1–4 = win (250 tokens), 5–6 = loss (0 tokens).  
    - **Step 2:** For probabilities like 25% (B1), students draw 1 card from a deck. Hearts = win (100 tokens), other suits = loss (0 tokens).  
    - **Step 3:** For near-certainty (99% in C1), students flip a coin twice. Only two tails = loss (0 tokens); otherwise, win (100 tokens).  
  - **Every student plays all choices:** Resolve each pair sequentially. No random selection—every student experiences outcomes for all 3 pairs.  

  ---

  ### **2. Reason-Elicitation Step**  
  - **Ballot wording (clean):**  
    > "Circle your choice. In one sentence, explain why you picked it over the other."  
    - **Avoid contamination:** Do NOT say: "Think about your past choices" or "Be consistent."  
  - **Process:**  
    - Collect ballots anonymously after each decision.  
    - Read 3–4 aloud before resolving outcomes to validate diverse reasoning (e.g., "I chose A1 because 100 is safe").  

  ---

  ### **3. Control Condition**  
  - **Purpose:** Distinguish if the effect is driven by *certainty* (Pair A) or the *common consequence transformation* (Pair B).  
  - **Expected pattern (success):**  
    - Pair A: >60% choose **A1** (certainty effect).  
    - Pair B: >60% choose **B2** (common consequence effect).  
    - Pair C: >60% choose **C2** (no certainty, so high-EV choice).  
  - **Failure indicators:**  
    - Pair A: <60% choose A1 → No certainty effect.  
    - Pair B: <60% choose B2 → No common consequence effect.  
  - **If activity fails:** Use the remaining hour to discuss why (e.g., "Let’s analyze why our class diverged from typical patterns—maybe risk tolerance?"). Run a poll and debate rationales.  

  ---

  ### **4. The Pump (Dutch Book Sequence)**  
  **Target:** Students who chose **A1 (safe)** and **B2 (risky)**.  
  **Swap Menu (costs paid upfront from final tokens):**  
  1. **Swap 1:** Pay 1 token to boost a 100-token outcome to 101 tokens.  
  2. **Swap 2:** Pay 1 token to boost a 350-token outcome to 351 tokens.  

  **Arithmetic for Inconsistent Students (A1 + B2):**  
  - Initial position: 60% chance of 350 tokens (A1 + B2 win), 40% chance of 100 tokens (A1 + B2 loss).  
  - After accepting both swaps:  
    - Pay 2 tokens upfront.  
    - New outcomes: 351 tokens (if win) or 101 tokens (if loss).  
    - Final: **351−2 = 349** or **101−2 = 99** tokens.  
  - Vs. initial: **Strictly worse** (350 → 349 and 100 → 99).  

  **Assumption for the pump:** Swaps are presented **sequentially without precommitment**. Students evaluate each swap *myopically* (e.g., "Boosting 100 to 101 is worth 1 token!").  

  **Avoiding ambush:**  
  - Announce: "These swaps are optional. Each costs 1 token and only affects specific outcomes."  
  - After the pump, reassure: "This isn’t punishment—it’s a consequence of how we value small changes."  

  ---

  ### **5. Logistics: Timeline, Materials & Script**  
  **Materials:** Dice (4 per student), deck of cards, coins, handouts (below), ballots, whiteboard.  

  **Handout (1-Page Summary):**  
  > **Pair A**  
  > - A1: 100 tokens (guaranteed).  
  > - A2: 250 tokens (80%) or 0 tokens (20%).  
  >  
  > **Pair B**  
  > - B1: 100 tokens (75%) or 0 tokens (25%).  
  > - B2: 250 tokens (60%) or 0 tokens (40%).  
  >  
  > **Pair C**  
  > - C1: 100 tokens (99%) or 0 tokens (1%).  
  > - C2: 250 tokens (79.2%) or 0 tokens (20.8%).  
  >  
  > **Swaps (Optional)**  
  > - Swap 1: Pay 1 token → 100 becomes 101.  
  > - Swap 2: Pay 1 token → 350 becomes 351.  

  **Timeline & Script:**  
  - **0:00–0:05** Intro: "Today, you’ll make 3 choices affecting your bonus credit. Each will be resolved fairly. Tokens are real—use them wisely!"  
  - **0:05–0:15** Pair A: Students choose + write reason. Collect ballots.  
  - **0:15–0:20** **Board:** "Pair A Results: A1 = [count], A2 = [count]." Read sample reasons.  
  - **0:20–0:30** Resolve Pair A using dice (as above). Record tokens.  
  - **0:30–0:40** Repeat for Pairs B and C.  
  - **0:40–0:50** **Pump:** "Now, two optional swaps. Each costs 1 token. Decide on each separately."  
  - **0:50–1:00** Resolve outcomes, apply swaps, calculate final tokens.  
  - **1:00–1:15** Debrief (below).  

  ---

  ### **6. Debrief: Mapping to Formalism**  
  - **Key moments → Concepts:**  
    - **Pair A vs. Pair B:** "When we added a 25% chance of 0 to both options (common consequence), preferences flipped. This violates the *independence axiom*: If A1 > A2, mixing both with the same lottery should not reverse your preference."  
    - **The pump:** "You lost tokens because you evaluated swaps *locally* without precommitting to a global plan. Rationality requires seeing the whole picture."  
  - **Charge of inconsistency:** "Choosing A1 (safe) and B2 (risky) is inconsistent under the axiom."  
  - **Strongest reply:** "I’m *aversion-prone*—I avoid risk when gains are certain (A1) but seek upside when all options are risky (B2). The axiom ignores context."  
  - **Without dissolving cost:** "Even if context matters, the pump shows this inconsistency can be exploited. You paid a price for myopic decisions."  

  ---

  ### **7. Honest Limits**  
  **Predictable issues:**  
  - **Prior-knowledge students:** Some will choose "paradoxically" to test you. Mitigate by emphasizing anonymity and reading ballots aloud to validate sincerity.  
  - **Swap menu solved early:** A student might notice the trap. If so, applaud them and discuss: "Why is this hard to see in the moment?"  
  - **Logistical delays:** Resolving 26 students × 3 lotteries takes time. Use group-resolution (e.g., one card draw for the whole class) where possible.  
  - **Low stakes:** Tokens may feel trivial. Reiterate caps and use peer pressure ("Your choices matter!").  

  **Unreproducible feature:** This activity **cannot replicate regret**. In the Allais paradox, people choose A1 to avoid the agony of a 20% loss. You must verbally highlight: "Imagine picking A2 and losing—how would that *feel* compared to losing in B2?"  

  --- 

  This design ensures students experience the paradox viscerally before labeling it. The pump makes inconsistency costly, and the control pair isolates the certainty effect. Run it as a self-contained 75-minute experiential module, then name the Allais paradox in the next session.
