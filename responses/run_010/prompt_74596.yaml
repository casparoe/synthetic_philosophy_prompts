prompt: |-
  I am preparing a chapter for a volume on perception and epistemic justification, and before I hand it in I would like an audit of the package of commitments I have been defending, because a colleague in the department suggested last week that I am holding things together by equivocation and I could not immediately tell whether she was right. I run a philosophy-of-psychology seminar in which this material comes up every year, and what follows is roughly the position I have been assigning and defending there, so I would rather not discover the problem in a referee's report. The commitments are these. (a) A modest foundationalism about perception: an experience as of an F can confer non-inferential, defeasible, prima facie justification on the belief that there is an F, without the subject needing any further positive reason to trust her senses. (b) My own principle, which I call the Insulation Condition, and which I take to be the substantive addition I am making: justification is conferred by an experience to the degree that its phenomenal character is counterfactually stable with respect to the subject's non-perceptual mental states — that is, the more the character of the experience would change, holding proximal stimulation fixed, as we vary what the subject believes, expects, wants, or wishes, the less justification it confers. Encapsulation is thus not a binary property a system either has or lacks but a scalar one, and justification tracks the scalar. (c) Encapsulation in the classical sense is false, and the evidence that convinces me is not drawn from expertise but from need and desire: the old studies in which coins and food are overestimated in size relative to neutral discs of equal diameter, and the more recent work in which a desired object is judged to be nearer, or a slope steeper, than it is judged by the unburdened or unmotivated subject. I take such results at face value, as reports about how things look, not merely about what subjects say. (d) Where penetration occurs, the experience is downgraded; I want this to fall out of (b) rather than to be an independent postulate. (e) I accept the predictive-processing framework as our best general account of how perception works, but I do not think the priors it posits constitute penetration: those priors are, on my telling, statistical regularities acquired from the perceptual stream itself and sealed off from the subject's beliefs, desires, and conceptual repertoire. (f) Expertise cases — the radiologist who sees the nodule where the novice sees mottled grey, the ornithologist who sees a warbler rather than a small brown bird, the oenologist whose experience of a glass is differentiated by a vocabulary she acquired in adulthood — are, on my view, genuine cases of penetration with genuinely altered phenomenology, and they are epistemically benign, indeed enhancing; the expert's experience is better justified than the novice's, other things equal. (g) I want the distinction between rational and arational penetration to do real work: an influence on experience that the subject could recognize and assess as bearing on the truth of what she sees is different in kind from a mere causal nudge, and I suspect only the former has the interesting epistemic consequences.

  Let me add one thing, because it is where I feel least worried and therefore where I am most likely to be blind. I regard the difference between the (c)-type influences and the (f)-type influences as the least controversial element of the package: nobody, so far as I can see, thinks that acquired expertise is epistemically suspect in the way that hunger, fear, and longing are, and I have been treating that asymmetry as a fixed point against which any general account of penetration must be checked. I have also never thought that (a) and (d) are in any tension whatever, since a downgrade seems to me to concern the weight of a justifier rather than its kind; and I do not see how (e) could conflict with (g), since the first is a claim about what counts as perceptual processing and the second a claim about how influences on processing are to be epistemically appraised. If either of those dismissals is too quick, I would like to be told so plainly.

  So: go through the set and tell me which pairs are genuinely in tension and which merely look that way. Rank the genuine ones by severity, most damaging first, and for each say in a sentence or two exactly what has to give, and why the pair cannot be reconciled by refinement. For each genuine tension, give me the cheapest available revision together with what that revision costs elsewhere in the package — I want to see the price, not just the repair. Then tell me which single revision would do the most cleaning up across the whole set. Finally, for every repair you propose, say explicitly whether it leaves (b) recognizably intact or replaces it with a different principle wearing its name: my suspicion, which I cannot yet articulate properly, is that several of the obvious repairs would turn the Insulation Condition into a reliabilist clause about the truth-conductiveness of the process, which would no longer be a claim about encapsulation at all, and if so I would rather know that now than be persuaded of it in front of an audience.
reasoning: |-
  Okay, I need to help this user audit their philosophical commitments on perception and epistemic justification. They've laid out several key points and are worried about potential tensions, especially after a colleague suggested equivocation. Let me carefully unpack each component.

  First, their modest foundationalism (a) seems solid - perceptual experiences providing basic justification makes sense. The Insulation Condition (b) is their novel contribution, linking justification to how stable experience is against non-perceptual states. Interesting scalar approach rather than binary encapsulation.

  The tricky parts start surfacing when we look at (c) and (f). They accept desire-based penetration (hunger making things look bigger) as epistemically harmful, while expertise cases (radiologists seeing tumors) as enhancing. This asymmetry in treatment feels intuitive but needs justification. 

  I notice predictive processing (e) gets special treatment - they claim its priors aren't "real" penetration because they're statistically learned from perception itself. But isn't this arbitrary? What makes these priors fundamentally different from expertise-acquired ones? 

  The rational/arational distinction (g) seems crucial for them - if the subject can consciously assess the influence, it might be epistemically different. But this feels like it might do too much work while being underspecified. 

  Where the rubber meets the road: how can expertise penetration be enhancing while desire penetration is degrading, when both alter phenomenology? Their Insulation Condition (b) measures stability, but expert experiences might actually be less stable to beliefs/expectations than novice ones! That's a direct contradiction.

  The predictive processing exemption (e) also seems inconsistent. If we seal off those priors as "perceptual," why not do the same for expertise? The user draws a line but hasn't provided clear criteria. 

  Possible fixes: They could bite the bullet and say expertise cases aren't actually penetration (contra (f)), but that contradicts their own view. They could abandon the asymmetry claim (c/f) but that loses an intuitive anchor. Or they could modify the Insulation Condition to focus on the epistemic quality of influences rather than mere stability - but that risks turning it into reliabilism, which they explicitly want to avoid.

  The most promising path might be to double down on the rational/arational distinction (g), making it the core differentiator. But this would require significantly developing how "assessability" actually works, and might still leave the predictive processing status unclear. 

  Throughout this, I need to be careful not to let the Insulation Condition morph into plain reliabilism, as that would undermine their original contribution. The solution probably lies in refining what counts as "non-perceptual states" in (b), but this needs careful handling.
answer: |-
  Based on a thorough analysis of your commitments, I identify two significant tensions and one potential friction point. The genuine tensions threaten the core coherence of your package, particularly concerning the Insulation Condition (b) and its interaction with (f) and (e). Here's the breakdown:

  **Ranked Genuine Tensions (Most Damaging First):**

  1.  **(b) Insulation Condition & (f) Benign Expertise Penetration**:
      *   **Tension**: The Insulation Condition (b) states justification *decreases* as phenomenal character becomes *less* stable (more penetrable) by non-perceptual states. Commitment (f) states expertise penetration *increases* justification. Expertise penetration demonstrably *increases* the influence of non-perceptual states (learned concepts, expectations) on phenomenal character compared to the novice. Therefore, (b) dictates expertise experiences should confer *less* justification, but (f) states they confer *more*. This is a direct contradiction.
      *   **What Has to Give**: Either expertise penetration does *not* genuinely alter phenomenology in a penetrative way relevant to (b), or the Insulation Condition does *not* universally track justification in the direction you propose (i.e., less stability doesn't *always* mean less justification). You cannot maintain both (b) as stated and (f) as stated.
      *   **Cheapest Revision & Cost**:
          *   **Revision**: Modify (b) to specify that the justification-decreasing effect applies *only* to arational penetration (desire, fear, etc.), not rational penetration (expertise). Stability relative to arational states decreases justification; stability relative to rational states might be neutral or positive.
          *   **Cost**: This significantly weakens the Insulation Condition's generality and explanatory power. It becomes dependent on the rational/arational distinction (g) doing heavy lifting. It also makes (b) no longer a *unified scalar measure* of stability *simpliciter*, but stability *relative to a specific class* of states. It risks turning (b) into a proxy for (g) rather than an independent encapsulation-based principle. It leaves the *scalar* nature ambiguous: is it scalar *within* each class, or does the class override the scalar effect?
      *   **Impact on (b)**: This revision fundamentally changes (b). It replaces a scalar claim about encapsulation *simpliciter* with a conditionalized claim dependent on the *epistemic nature* of the influencing state. It's no longer recognizably the same principle focused purely on counterfactual stability.

  2.  **(e) Predictive Processing Priors & (g) Rational/Arational Distinction / (b) Insulation Condition**:
      *   **Tension**: You exempt PP priors learned "from the perceptual stream itself" from counting as penetration, claiming they are "sealed off" from beliefs/desires/concepts. However:
          *   PP priors are fundamentally *generative models* shaped by *prediction error minimization*. While statistically learned, they are *not* simply passive recordings; they actively structure perception. Crucially, they *can* and *do* incorporate influences from higher-level cognitive states (beliefs, goals, conceptual knowledge) over developmental and learning timescales. The claim they are "sealed off" is empirically dubious within the PP framework itself.
          *   This creates a conflict with (g): If PP priors incorporate conceptual knowledge (e.g., an expert's learned disease model influencing the radiologist's prior), how is this fundamentally different from the "rational" expertise penetration you accept in (f)? Both involve learned cognitive/conceptual structures shaping perception. Distinguishing them based *only* on being "statistical regularities acquired from the perceptual stream" seems arbitrary and inconsistent with PP's core tenets.
          *   It also creates friction with (b): If PP priors *are* influenced by higher cognition (as PP allows), then varying those higher states *would* change the priors and thus the phenomenal character (holding stimulation fixed), violating the "sealed off" claim and directly implicating (b).
      *   **What Has to Give**: Either the claim that PP priors are "sealed off" and not penetration must be abandoned, *or* the distinction used in (f) and (g) to separate benign expertise from problematic penetration must be applied consistently, potentially forcing you to treat some PP influences (especially expert ones) as penetration.
      *   **Cheapest Revision & Cost**:
          *   **Revision**: Drop the "sealed off" claim for PP priors (e). Acknowledge that PP priors *can* be pathways for penetration (especially conceptual/cognitive penetration over learning timescales). Argue that *well-calibrated* priors acquired through reliable learning processes (like perceptual learning or scientific training) are epistemically benign *despite* being penetrative, aligning them conceptually with your treatment of expertise (f). Maintain that *maladaptive* priors (e.g., those distorted by strong desire/fear) are epistemically downgrading.
          *   **Cost**: This forces a significant shift in explaining the epistemic status of *baseline* perception. You can no longer rely on PP providing a "non-penetrated" foundation. You must explain why *some* penetrative priors (expert, well-calibrated) are good, while others (desire/fear-driven, maladaptive) are bad, leaning much more heavily on (g) or a reliabilist/truth-conducive criterion. It potentially blurs the line you wanted between PP processing and "real" penetration. It also means (b) applies more broadly, including to baseline perception, requiring a more nuanced account of *which* variations in higher states count for the stability measure.
      *   **Impact on (b)**: This revision doesn't directly attack (b), but makes its application broader and more complex. If PP priors are penetrable, then varying higher cognitive states *could* alter even "normal" experiences via prior changes, making stability a more pervasive concern. (b) remains recognizably intact but faces a wider domain.

  **Potential Friction Point (Less Severe, But Needs Careful Handling):**

  *   **(b) Insulation Condition & (c) Desire/Fear Penetration & (d) Downgrade**: While (b), (c), and (d) seem designed to fit together (instability from desire/fear causes downgrade), the *scalar* nature of (b) combined with the *robustness* of the effects in (c) needs attention. If desire/fear penetration demonstrably creates *significant* instability (as the studies suggest), (b) implies a *significant* downgrade. This needs to be consistent with modest foundationalism (a). Can these significantly downgraded experiences still provide the foundational *prima facie* justification required by (a)? The tension is not direct contradiction, but ensuring the downgrade doesn't collapse into skepticism for these cases while maintaining the scalar seriousness implied by (b) requires careful phrasing in (a) and (d). Emphasize the "defeasible, prima facie" nature strongly. *(No specific revision needed here yet, just caution in exposition).*

  **The Single Most Effective Revision:**

  Revising **Commitment (e)** concerning Predictive Processing priors (as outlined above: dropping "sealed off," acknowledging their potential penetrability, and folding their epistemic appraisal into the framework used for expertise) would do the most cleaning up. It resolves the tension with (g) by applying the rational/arational/calibration distinction consistently across both learned expertise *and* PP priors. It also removes the arbitrary barrier preventing PP influences from interacting coherently with (b) and (f). While it creates work in explaining baseline justification, it unifies the treatment of penetration sources.

  **Regarding Your Suspicions about (b) and Reliabilism:**

  You are right to be vigilant. The revisions suggested for the major tensions *do* push the Insulation Condition towards relying on external epistemic factors:

  1.  **Conditionalizing (b) on (g)**: Making (b) apply only to arational penetration explicitly ties its justification-tracking power to the *epistemic character* (rational vs. arational) of the influencing state. This moves away from a pure measure of information flow/stability and towards an appraisal of the *source* of the influence.
  2.  **Revising (e) and tying benign penetration to calibration/reliability**: To explain why expert/calibrated PP penetration is benign while desire/fear penetration is not, you will almost certainly need to invoke the *reliability* of the influencing process or the *truth-conduciveness* of the resulting perceptual state. The Insulation Condition (stability) alone cannot distinguish them, as both involve significant instability relative to some higher states. The scalar stability might correlate with reliability in some cases, but the explanatory work shifts: stability becomes a *symptom* or *mechanism*, while reliability/calibration becomes the *justification-maker*.

  **Conclusion:**

  The core tension is between the Insulation Condition's (b) direct link from instability to *decreased* justification and your commitment to expertise penetration (f) *increasing* justification. This is the most damaging and requires significant revision, likely altering (b)'s fundamental nature. The tension regarding PP priors (e) is also serious and forces a choice between an empirically shaky exemption or a more unified (but complex) treatment of penetration that leans on (g) and potentially reliabilist considerations. Protecting the Insulation Condition as a purely encapsulation-based, non-reliabilist principle while maintaining the asymmetry between desire/fear and expertise penetration is extremely difficult, if not impossible. The revisions necessary to resolve the tensions will inevitably infuse (b) with epistemic appraisals of the influencing states or the reliability of the process. You need to decide whether preserving the core intuition behind (b) – the epistemic importance of informational insulation *as such* – is worth the cost of potentially abandoning the expertise asymmetry (f), or whether embracing a more overtly reliabilist or source-appraisal framework is the necessary price for maintaining that intuitive asymmetry.
