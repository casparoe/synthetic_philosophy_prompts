answer: |-
  ## Completed Case Design & Essay Question

  **Case Stem (Included in Exam Paper):**
  Nora is at a train station and glances at the departure board, which clearly states the 14:10 train has departed. She has used this board reliably many times before and has no reason to distrust it. Based solely on this evidence, Nora asserts flatly to a companion, "The 14:10 has already left." Her evidence is strong enough that it would be reasonable for her to believe the proposition based on it. However, her evidence is stipulated to be *always* insufficient for knowledge in this scenario, for reasons specific to each cell below. Consider the propriety of Nora's assertion from the perspective of an Evaluator who knows only what is specified in each cell.

  **The Four Cells (Held Fixed: Nora's evidence & basis for assertion; Strength of evidence = reasonable belief, insufficient for knowledge):**

  1.  **Cell A (True, Informed Evaluator):** The 14:10 train *has* actually left. However, Nora does not know this because the departure board is currently malfunctioning: it is stuck displaying "Departed" for the 14:10 slot, regardless of actual departures. It just happens to be correct *this time*. The Evaluator knows *both* that the train has left *and* that the board is malfunctioning (stuck, but correct for this instance).
  2.  **Cell B (True, Uninformed Evaluator):** The 14:10 train *has* actually left. However, Nora does not know this because the departure board is malfunctioning as in Cell A (stuck, but correct). The Evaluator knows *only* that the train has left; they know nothing about the board's malfunction.
  3.  **Cell C (False, Informed Evaluator):** The 14:10 train has *not* left (it is delayed). The departure board is malfunctioning (stuck displaying "Departed"). Nora's belief is false. The Evaluator knows *both* that the train has *not* left *and* that the board is malfunctioning (stuck).
  4.  **Cell D (False, Uninformed Evaluator):** The 14:10 train has *not* left (delayed). The departure board is malfunctioning (stuck). Nora's belief is false. The Evaluator knows *only* that the train has *not* left; they know nothing about the board's malfunction.

  **Norm Predictions:**

  | Cell | Truth Status | Evaluator Info | Truth Norm | Knowledge Norm | Reasonable-Belief Norm |
  | :--- | :----------- | :------------- | :--------- | :------------- | :--------------------- |
  | **A** | True         | Full           | **Proper** | Improper       | **Proper**             |
  | **B** | True         | Partial (Truth)| **Proper** | Improper       | **Proper**             |
  | **C** | False        | Full           | Improper   | Improper       | Improper               |
  | **D** | False        | Partial (Truth)| Improper   | Improper       | **Proper**             |

  *   **Truth Norm:** Assert only what is true. Predicts propriety *only* in A & B.
  *   **Knowledge Norm:** Assert only what you know. Predicts impropriety in *all* cells (Nora lacks knowledge in all).
  *   **Reasonable-Belief Norm:** Assert only what you reasonably believe. Predicts propriety in A, B, & D (Nora reasonably believes in all cells).

  **Essay Question:**
  Nora asserts "The 14:10 has already left" based solely on reading a familiar and apparently reliable departure board, possessing evidence strong enough for reasonable belief but insufficient for knowledge in every scenario described below.

  1.  **Predictions:** For each of the four scenarios (Cells A-D), state whether the Truth Norm, the Knowledge Norm, and the Reasonable-Belief Norm predict Nora's assertion is proper or improper. Justify each prediction concisely based *only* on the norm's definition and the stipulated facts of the cell. *(6 marks)*
  2.  **Diagnostic Cells:** Identify which cell(s) are *diagnostic* – that is, where the norms make conflicting predictions. For each diagnostic cell, specify precisely which pair(s) of norms it discriminates between. *(4 marks)*
  3.  **Artifacts & Critique:** Focusing on *one* diagnostic cell of your choice:
      *   Give *two distinct reasons* why the intuitive verdict about the propriety of Nora's assertion in that cell *might be an artifact of how the case is presented* rather than a direct reading of the relevant norm(s). One reason must critically consider the role of the *Evaluator's own information*. Another must critically consider the distinction between an assertion being *improper* (violating a constitutive norm) and an assertion being *blameworthy* (warranting criticism). *(8 marks)*
  4.  **Resolution or Rejection:** Choose *one* of the following tasks:
      *   Propose *one* further, clearly specified type of datum (e.g., a different case intuition, consideration of retraction, function of assertion) that could genuinely discriminate between the Truth Norm and the Knowledge Norm, explaining why it is more robust than the diagnostic cell analyzed above. *Or*
      *   Argue that the search for a *single constitutive norm* governing all assertion is fundamentally misconceived. Support your argument by explaining how the problems exposed by the case design (especially artifacts and the role of the evaluator) point towards a more pluralistic or functional understanding of assertion norms. *(7 marks)*

  ---

  ## Model Answer (Approx. 800 words)

  **1. Predictions:**
  *   **Cell A (True, Informed Evaluator):** Truth Norm: Proper (Assertion true). Knowledge Norm: Improper (Nora lacks knowledge). Reasonable-Belief Norm: Proper (Nora reasonably believes).
  *   **Cell B (True, Uninformed Evaluator):** Truth Norm: Proper (Assertion true). Knowledge Norm: Improper (Nora lacks knowledge). Reasonable-Belief Norm: Proper (Nora reasonably believes).
  *   **Cell C (False, Informed Evaluator):** Truth Norm: Improper (Assertion false). Knowledge Norm: Improper (Nora lacks knowledge). Reasonable-Belief Norm: Improper (Nora reasonably believes, but assertion is false - norm typically requires reasonable belief *and* truth, or is defeated by falsity).
  *   **Cell D (False, Uninformed Evaluator):** Truth Norm: Improper (Assertion false). Knowledge Norm: Improper (Nora lacks knowledge). Reasonable-Belief Norm: **Proper** (Nora reasonably believes; evaluator's ignorance doesn't change Nora's reasonableness).

  **2. Diagnostic Cells:**
  *   **Cell A:** Diagnostic. Discriminates between Truth Norm (Proper) vs. Knowledge Norm (Improper). Also discriminates between Knowledge Norm (Improper) vs. Reasonable-Belief Norm (Proper).
  *   **Cell D:** Diagnostic. Discriminates between Truth Norm (Improper) vs. Reasonable-Belief Norm (Proper). Also discriminates between Knowledge Norm (Improper) vs. Reasonable-Belief Norm (Proper).
  *(Cells B & C are non-diagnostic: All three norms agree on propriety in B (True/Partial: Proper for T & RB, Improper for K); all three agree on impropriety in C (False/Full)).*

  **3. Artifacts & Critique (Focus on Cell D):**
  Cell D is diagnostic, pitting the Truth/Knowledge Norms (assertion improper) against the Reasonable-Belief Norm (assertion proper). However, intuitions about propriety here are fragile artifacts.

  *   **Artifact 1: Evaluator's Information:** The intuition that Nora's assertion is improper in D likely stems *heavily* from the Evaluator knowing the train hasn't left. Knowing the assertion is false, the Evaluator naturally judges it incorrect and potentially misleading. However, the Reasonable-Belief norm focuses *solely* on Nora's epistemic position *at the time of assertion*, which is identical in all cells. Nora reasonably believed based on her evidence. The Evaluator's *later* knowledge of falsity doesn't retroactively make Nora's evidence unreasonable *at the time*. Judging propriety based on the Evaluator's privileged information conflates the *actual outcome* with the *warrant for the act* when it was performed. The Reasonable-Belief norm suggests propriety depends on the speaker's warrant, not the listener's hindsight.

  *   **Artifact 2: Impropriety vs. Blameworthiness:** Even if we concede Nora's assertion in D feels "wrong" somehow, this feeling might track *blameworthiness* or *unfortunate consequence* rather than a violation of a *constitutive norm*. Nora acted on her best, reasonable evidence. The falsity is due to an undetectable malfunction, a pure environmental luck factor beyond her control. While the assertion *is* false and potentially harmful, blaming Nora or calling her assertion "improper" in the fundamental sense implied by constitutive norms seems harsh. She fulfilled her primary epistemic duty. The strong negative intuition likely conflates the assertion being *incorrect* (which it is) or *unfortunate* or even *blameworthy in specific contexts* (e.g., if harm results) with it being *constitutively improper*. The Reasonable-Belief norm captures this distinction: the assertion was properly made based on warrant, even if it turned out badly.

  **4. Resolution or Rejection: The Misconceived Search**
  The search for a single constitutive norm of assertion is fundamentally misconceived. The artifacts exposed in Cell D – crucially, the dependence of intuitive verdicts on the evaluator's perspective and the conflation of impropriety with blameworthiness or unfortunate outcomes – highlight a deeper issue: assertion serves multiple, context-sensitive functions.

  The case design attempts to isolate a purely normative essence by fixing evidence and varying truth/evaluator knowledge. Yet, our judgments are inextricably tied to perspectives (speaker, hearer, omniscient evaluator) and purposes (informing, coordinating, committing). In Cell D, from Nora's perspective when asserting, she reasonably aimed to inform based on good evidence. From the companion's perspective (if unaware of falsity), the assertion might successfully coordinate action. Only from the privileged Evaluator's perspective does it seem "improper." Which perspective defines the constitutive norm? The artifacts show there isn't a neutral, perspective-independent "propriety."

  Furthermore, norms like Truth or Knowledge seem geared towards the *reliability* or *robustness* of information transfer, judging assertion by its outcome or the speaker's cognitive achievement. The Reasonable-Belief norm focuses on the speaker's *responsibility* and effort at the time. These address different, equally important dimensions of the speech act – its *accuracy* versus its *reasonableness*. Demanding one norm govern both ignores this functional plurality. Assertion can be reasonable yet false (D), or unreasonable yet true (a different case). Neither norm captures all relevant evaluations.

  The very need to stipulate an Evaluator's knowledge to generate diagnostic intuitions reveals that assertion propriety isn't monadic; it's relational, depending on the conversational context, speaker/hearer epistemic states, and shared purposes. A constitutive norm should define the core commitment of asserting. But the case shows this commitment might be plural: committing to *truth* (Truth Norm), committing to *knowing* (Knowledge Norm), or committing to having *adequate warrant* (Reasonable-Belief). Different contexts might prioritize different commitments. The artifacts undermine the project of isolating a single, context-independent norm; they point instead towards a functional, pluralistic account where different norms govern assertion in different conversational contexts or for different primary aims (e.g., informing vs. promising). The quest for *the* constitutive norm is a category error.

  ---

  ## Marking Scheme (Total 25 Marks)

  1.  **Predictions (6 marks):**
      *   Correct prediction (+ justification) for each Norm in each Cell (0.5 marks per cell/norm combination). (12 combinations x 0.5 = 6)
      *   *Common Fumble:* Missing that the Reasonable-Belief norm predicts propriety in Cell D; Misapplying the Reasonable-Belief norm in Cell C (assuming it predicts propriety despite falsity).

  2.  **Diagnostic Cells (4 marks):**
      *   Correctly identifies Cell A and Cell D as diagnostic (1 mark each). (2)
      *   Correctly specifies *all* conflicting norm pairs for each diagnostic cell (e.g., A: T vs K, K vs RB; D: T vs RB, K vs RB) (1 mark per correctly specified pair per cell). (2)
      *   *Common Fumble:* Missing Cell D as diagnostic; Listing only one conflicting pair per cell (e.g., only T vs K for A, only T vs RB for D); Including Cell B or C.

  3.  **Artifacts & Critique (8 marks):**
      *   Chooses a diagnostic cell (A or D) (Implied, no separate mark).
      *   **Reason 1 (Evaluator Info):** Provides a plausible reason how the Evaluator's specific information distorts the intuitive verdict relative to a norm's requirements (e.g., hindsight bias, conflating outcome with warrant, perspective-dependence). (3 marks)
      *   **Reason 2 (Impropriety vs Blameworthiness):** Provides a plausible reason distinguishing constitutive impropriety from blameworthiness/unfortunate outcome, showing how intuition might track the latter (e.g., lack of control, reasonable effort, excusable error). (3 marks)
      *   **Clarity & Relevance:** Reasons are clearly stated and specifically tied to the chosen cell and the norm conflict within it. (2 marks)
      *   *Common Fumble:* Vaguely stating the Evaluator knows more without explaining *how* this distorts intuition; Equating propriety directly with permissibility of criticism; Ignoring the specific norm conflict in the chosen cell; Failing to articulate the distinction between impropriety and blameworthiness clearly.

  4.  **Resolution or Rejection (7 marks):**
      *   **Option 1 (Propose New Datum):**
          *   Proposes a *specific, clearly described* type of datum/case/consideration (e.g., retraction cases, Moorean paradox, lottery assertions, assertions of future contingents, function of criticism). (2)
          *   Explains *how* this datum genuinely discriminates between T and K norms (e.g., shows one gets retraction right while the other doesn't; explains why asserting lottery propositions feels wrong even if true/probable). (3)
          *   Explains *why* this datum is more robust/less artifactual than the case design analyzed (e.g., less reliant on evaluator perspective, focuses on speaker commitment/linguistic practice, clearer link to constitutive function). (2)
      *   **Option 2 (Argue Against Monism):**
          *   Clearly states the position that monism is misconceived. (1)
          *   Uses insights from the artifact critique (esp. perspective-dependence & impropriety/blameworthiness conflation) to *support* the rejection of monism (e.g., shows these artifacts stem from the inherent context/perspective sensitivity of assertion). (3)
          *   Positively argues for pluralism/functionalism by explaining how the artifacts point towards multiple relevant normative dimensions (e.g., accuracy vs. reasonableness, speaker commitment vs. hearer reliance, context-dependent functions). (3)
      *   *Common Fumble (Option 1):* Proposing a vague or irrelevant datum; Failing to explain discrimination clearly; Not comparing robustness to the case design; Proposing a datum that equally supports/undermines both norms.
      *   *Common Fumble (Option 2):* Simply stating monism is wrong without argument; Failing to connect the artifacts to the critique of monism; Asserting pluralism without explaining *how* the artifacts motivate it; Offering only a weak or unrelated reason for pluralism.

  **Top Band Requirement:** To reach the highest marks, an answer must not only accurately complete all tasks but also demonstrate exceptional clarity, precision, and insight in the critique (Part 3) and the chosen resolution/rejection (Part 4), particularly in rigorously applying the impropriety/blameworthiness distinction and leveraging the case's artifact potential to support a deeper conclusion about the nature of assertion norms.

  ---

  ## Note to Instructor (Design Assessment)

  **Strengths (Discriminating Power):** This design effectively isolates the core commitments of the three norms by systematically manipulating truth and evaluator knowledge while *rigorously* holding Nora's epistemic position fixed as "reasonable belief, not knowledge." Crucially:
  1.  The "stuck board" ensures lack of knowledge without altering Nora's evidence quality across cells.
  2.  Varying evaluator information tests whether judgments track the speaker's state (RB, K) or the objective fact/hearer knowledge (T).
  3.  Cell A pressures the Knowledge norm (intuition of propriety despite lack of knowledge).
  4.  Cell D pressures the Truth norm (intuition of impropriety despite reasonable belief), while being the litmus test for RB norm resilience.
  5.  The requirement to critique artifacts *forces* engagement with the methodology's limitations, moving beyond simple intuition mining.

  **Weakest Point:** The most vulnerable aspect is the **interpretation of the Reasonable-Belief norm in Cell D** and the associated artifact critique concerning blameworthiness. A well-prepared student could argue:
  1.  **"Reasonable Belief" Ambiguity:** Does "reasonable belief" genuinely require *only* subjective reasonableness, or is it often understood (even by proponents) as requiring *objectively* non-accidental justification, which the stuck board arguably undermines? The design assumes the former, but the latter reading ("objective reasonableness") could make RB align with T & K in D. The stipulation "strong enough for reasonable belief" might not settle this definitively.
  2.  **Blameworthiness Conflation Counter:** While the distinction is valid, the student might argue that constitutive impropriety *just is* what grounds legitimate blame/ criticism *in standard conditions*, making the distinction less impactful than the model suggests. If an assertion in D *always* warrants criticism (a strong intuition for some), doesn't that suggest constitutive impropriety? The RB norm struggles to explain this criticism if the assertion was "proper."
  This weakness highlights the potential contestability of the core intuitions driving the RB norm, particularly concerning environmental luck and the link between propriety and warranted criticism.
