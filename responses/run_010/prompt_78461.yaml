  First, I need to recall if there's an existing term for this. Naturalistic fallacy comes to mind, but that's about equating "natural" with "good," which isn't quite it here. The friend agrees the fawn's suffering is bad but still sees it as acceptable because it's natural. So it's more about the source of the harm than valuing naturalness per se. Then there's the doing/allowing distinction, but the key here is human causation, not action versus inaction. Status quo bias also doesn't fit because the bias persists even when the status quo isn't intentional.

  The core seems to be a moral distinction based on whether humans are the cause. The user mentioned "provenance-based discount on harms." So the phenomenon is discounting suffering if it's not human-caused. I remember terms like anthropocentric intervention ethics or human exceptionalism. But those might be too broad. The user wants a specific term. If none exists, they want to coin one. 

  Looking at the examples: the pigeon (human-caused) vs. fawn (natural), wildlife interventions vs. livestock, and the argument that wild suffering isn't urgent because it's always been there. Each case hinges on human causation as a boundary for moral responsibility. The user also asks about boundary cases: wild animals regardless of naturalness, floods (natural vs. human-caused dam failure), and diseases in wild vs. human populations.

  For boundary cases: Helping wild animals just because they're wild might fall under this if the reluctance is due to non-human causation. The flood example fits perfectly—natural disaster vs. human negligence. Diseases in wild populations versus humans: here, it's about the population (wild vs. human) rather than causation. That might involve speciesism or anthropocentrism separately, but the human causation aspect could overlap. For instance, if a human-introduced disease in wildlife is seen as requiring intervention, but a natural one isn't, that would fit the pattern.

  Coining a term: Needs to capture the essence of human causation as a moral boundary. "Anthropocausal Moral Asymmetry" makes sense: anthropo- for human, causal for cause, asymmetry in moral response. The definition would specify that suffering is assigned different moral weight based on human causation. 

  Other possible terms: "Human-Provenance Responsibility Boundary" or "Etiological Discounting" (etiological meaning causation). But "Anthropocausal Moral Asymmetry" seems clearer. The user wants American English, so avoiding overly academic terms might help, but precision is key.

  Also, considering related concepts: deontological vs. consequentialist ethics. Here, the friend might be applying a deontological rule against human harm but consequentialism for natural events. Another angle is the perceived duty: humans have a duty to fix what they break but not to fix unrelated suffering. This ties into the "you broke it, you bought it" idea. 

  The user's deeper need might be to articulate this concept effectively in arguments, to challenge the inconsistency. Providing a clear term and definition helps in framing the debate. They might also want to promote intervention in wild animal suffering by highlighting this bias. Ensuring the definition is tight enough for practical use is crucial.
answer: |-
  Based on your meticulous dissection, you're pinpointing a highly specific cognitive and moral bias: **differential moral weighting based strictly on the *provenance* (origin/cause) of suffering, specifically discounting suffering deemed "natural" or "non-human-caused" compared to identical suffering deemed "human-caused."** Existing terms *touch* on it, but none capture its core:

  1.  **Why "Naturalistic Fallacy" Doesn't Fit:** You correctly note this fallacy equates "natural" with "good" or "right." Your friend *doesn't* claim the fawn's suffering is *good*; they acknowledge it's bad. The issue is *moral responsibility/imperative*, not inherent value judgment of nature.
  2.  **Why "Doing/Allowing Distinction" Doesn't Fit:** As you say, the line isn't act vs. omission. Your friend feels an imperative to *act* (help) the pigeon (human-caused harm) but feels *no imperative to act* (allows) the fawn to suffer (natural cause), even though both involve suffering and their potential action could alleviate it. The distinction is the *cause*, not the *type* of moral choice (act/omit).
  3.  **Why "Status Quo Bias" Doesn't Quite Fit:** While preserving the "natural" state is part of it, the bias persists even when acknowledging the status quo is terrible and accidental. It's specifically about *exonerating humans from responsibility* for the "natural" suffering state, not just inertia.
  4.  **Why "Human Exceptionalism" or "Anthropocentrism" Are Close But Too Broad:** These are the general neighborhood. Anthropocentrism prioritizes humans, but here the bias is about *human action as the trigger for moral responsibility* concerning non-humans. Suffering itself isn't discounted for non-humans *per se* (the pigeon gets helped), but the *source* determines if humans *must* respond.

  **The Core Phenomenon: Anthropocausal Moral Asymmetry (AMA)**

  *   **Definition:** A cognitive and ethical bias wherein the perceived moral obligation to prevent or alleviate suffering in non-human entities is asymmetrically strong when the suffering is directly caused by human actions, and asymmetrically weak or non-existent when the suffering is caused by natural processes or non-human agency, *even when the severity and moral badness of the suffering itself is acknowledged to be identical or greater in the "natural" case*.
  *   **Key Mechanism:** It establishes **human causation as a necessary boundary condition for moral responsibility** towards non-human suffering. Humans are seen as responsible *only* for the harms they directly cause ("you broke it, you fix it"), not for harms occurring independently of human action, regardless of their scale or intensity.

  **Boundary Cases & Clarification:**

  1.  **Reluctance to help wild animals *merely* because they're wild:**
      *   **Does it fit?** **Yes, but only if the *primary reason* for reluctance is rooted in the perceived *naturalness of the cause* of their predicament.** If the reluctance is purely "they are not domesticated/not our concern" without invoking cause, it might lean more towards simple speciesism or anthropocentric indifference. However, the *wildness* often implicitly carries the association of "subject to natural forces," making AMA a significant component.
  2.  **Treating a natural flood as a lesser tragedy than an equally destructive dam failure flood:**
      *   **Does it fit?** **Perfectly.** This is a quintessential example. The suffering and destruction are identical. The *only* difference is the cause (natural geological/weather processes vs. human engineering/negligence). AMA dictates that the dam failure triggers far greater moral outrage, demands for accountability, and perceived obligations to aid/prevent recurrence, while the natural flood is seen as a "force majeure" or "act of God," evoking less judgment and a different (often more fatalistic) response, despite equivalent harm.
  3.  **Treating disease in wild populations differently from disease in human populations:**
      *   **Does it fit?** **Partially overlapping, but distinct biases are also at play.**
      *   **AMA Aspect:** If the argument *against* intervening in the wild disease is specifically "it's a natural process, we shouldn't interfere/play God," then yes, AMA is central. The suffering exists, but its natural origin negates responsibility.
      *   **Separate Biases:** However, significant additional factors are:
          *   **Speciesism/Anthropocentrism:** Human suffering is intrinsically prioritized over non-human suffering regardless of cause.
          *   **Ecosystem Management Concerns:** Legitimate worries about unintended consequences of intervention in complex systems (which could also apply to human public health but is often less emphasized).
          *   **Practicality/Feasibility:** Treating wild populations is often vastly harder and more expensive than treating humans or livestock. AMA often *masquerades* as or reinforces these practical concerns, making them seem like sufficient moral justifications when the underlying bias is actually driving the reluctance.
      *   **The Overlap:** AMA provides the *moral framework* ("no responsibility for natural suffering") that then allows speciesism and practicality concerns to dominate the decision *without challenge* in the wild animal case, whereas for humans or livestock, the moral imperative to alleviate suffering overrides practicality concerns more readily.

  **Recognized Terms & The Gap:**

  *   **"You Break It, You Buy It" Principle:** This captures the *positive* side (responsibility for human-caused harm) but not the *negative* side (absolution for natural suffering).
  *   **"Harm Principle" (extended):** Often focuses on humans harming humans. Extending it to humans harming non-humans gets the pigeon case, but fails for the fawn.
  *   **"Non-Identity Problem" (tangential):** Sometimes invoked in wild animal suffering debates (would intervening create different animals/ecosystems?), but that's a different philosophical argument about future beings, not about discounting *current* suffering based on provenance.
  *   **Conclusion:** There isn't a single, widely recognized term *specifically* for this provenance-based discounting. **Anthropocausal Moral Asymmetry (AMA)** accurately defines the core phenomenon you've identified.

  **Why "Anthropocausal Moral Asymmetry"?**

  *   **Anthropo-:** Human (Greek *anthropos*)
  *   **Causal:** Pertaining to cause (Latin *causa*)
  *   **Moral Asymmetry:** The unequal application of moral consideration based solely on the above distinction.

  This term precisely captures the carving: the asymmetry in moral response hinges entirely on whether the *cause* (*aition*) is human (*anthropos*) or not. It explains your examples concisely: the pigeon (human cause = high obligation), the fawn (non-human cause = low/no obligation), wildlife medical intervention (seen as interfering with non-human cause = objection), and the "it's always been this way" argument (natural cause = no imperative to change).
