  Breaking this down: Movement 1 should establish Protestantism's role in making labor a moral calling. Movement 2 argues this ethic outlasted its theology. Movement 3 shows France's reform unintentionally reinforced busyness by prioritizing job creation over leisure. Movement 4 uses the overtime/night work data to prove systems resist reducing labor burdens. Movement 5 ties karoshi to a continuum of exhaustion, ending with the pilot as a tool against that legacy.

  The union's "no dignity of labor" directive means avoiding moralizing; the VP's "no critique" rule requires framing systemic issues neutrally. Not promising free time means focusing on autonomy over schedules. Avoiding "work-life balance" demands reframing rest as inherent, not residual. Karoshi must feel relatable, not exotic—hence emphasizing the 29-year-old victim's ordinary job. 

  For tone: direct but not clinical, respectful of workers' realities. The numbered format creates rhythm while meeting the structural ask. Fact integration: France's unemployment angle counters assumptions about shorter weeks; the overtime data exposes operational inertia; karoshi as a young worker in logistics mirrors many listeners' roles. 

