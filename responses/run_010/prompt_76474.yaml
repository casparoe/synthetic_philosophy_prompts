answer: |-
  Here is your five-movement address, adhering strictly to your constraints and historical argument:

  **1. Establishing the historical contingency of busyness as virtue.**  
  What if our belief that constant work is morally good isn't universal, but a specific historical invention? Centuries ago, ascetic Protestant reformers made a radical claim: ordinary labor wasn't just necessity, but a divine "calling," a sign of grace. Diligence became a moral duty. Before this, work held value, yes, but its relentless pursuit wasn't inherently virtuous. Rest wasn't inherently suspect. This theological shift planted a powerful seed: your worth became entangled with visible, constant effort. It taught that idleness was sin, and busyness, proof of righteousness. The theology itself might fade, but the ethic it cultivated – this deep-seated feeling that rest must be *earned* through labor – proved remarkably durable. We inherited this residue.

  **2. Demonstrating the ethic's endurance beyond its theological roots.**  
  The religious fervor cooled, but the work ethic burned on, detached from its original fuel. As societies secularized, the *structure* of feeling remained: constant work signaled character, reliability, moral fiber. Rest became framed as a *reward* for work completed, not a fundamental need. Think of the language: "You've earned a break." This implies rest is conditional, contingent on prior labor. The idea that labor itself is the virtuous default, the central activity around which life must be organized, solidified. It became cultural common sense. We stopped questioning why work defines life's rhythm, why exhaustion is often a badge, not a warning. The machinery kept running long after the original engine was silent.

  **3. Illustrating systemic prioritization of work distribution over liberation.**  
  This ethic shapes policy, often prioritizing the *existence* of jobs over the *quality* of life within them. Consider France’s move to a 35-hour week around 2000. The official, driving purpose? To combat record unemployment by forcibly sharing the available work hours, creating more jobs. It wasn't primarily about granting workers richer lives outside of work; it was an economic lever for job creation. The stated goal was managing labor as a resource, redistributing its burden to reduce idleness in the system. Enriching individual lives was secondary, if present at all. The reform focused on the *quantity* of work distributed, not fundamentally challenging the *primacy* of work time itself.

  **4. Revealing system adaptation to preserve output over reducing burden.**  
  What happened when that reform hit reality? Economists studying shift-work firms found a telling pattern. Output was maintained, yes. But how? Largely *not* by shortening individual workdays. Instead, firms intensified night work schedules and significantly increased overtime hours. The structure bent to preserve total output and operational norms, often amplifying the strain on existing workers through longer or more disruptive hours, rather than fundamentally lightening the load or redistributing it equitably. The system defaulted to extracting more from some, rather than lessening the demand placed on all. The ethic of constant labor found a way to persist.

  **5. Connecting the historical residue to present reality and the pilot's purpose.**  
  The endpoint of this unexamined ethic isn't abstract. Japan named it: *karoshi*, death from overwork. The first publicly reported case, in 1969, wasn't a corporate titan. It was a 29-year-old worker in the shipping department of a major newspaper. A stroke. This isn't a distant cultural shock, but the far end of a continuum we all inhabit – where exhaustion becomes normalized, then invisible, then lethal. The residue we're left with treats rest as an indulgence. This pilot in flexibility isn't about promising more free time; it’s a tool. It’s about questioning the default rhythm, offering a measure of control over *when* labor fits into life, acknowledging that the need for rest, for managing other demands, isn't earned – it simply *is*. For some, the work itself brings satisfaction; for all, the structure should not demand unreasonable sacrifice. This is a step towards managing that residue.
