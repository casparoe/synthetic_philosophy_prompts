prompt: |-
  I was up till like 2am arguing with my friend Priya about Lewis on convention and I lost. She's writing her dissertation chapter on it and she is a hardliner. Her track record, all of which she gave me in one go:

  - driving on the right: convention, obviously.
  - which of the two rival videocassette formats won out: NOT a convention, even though it was a self-sustaining equilibrium with a perfectly good alternative available. Her reason: the losing camp wanted the other format, so the population didn't have roughly the same preferences about the outcomes.
  - tipping 20% at restaurants: NOT a convention. Her reason: it isn't coordination at all, each of us would rather everyone else tipped and we didn't, and what actually keeps it going is shame plus what servers expect.
  - her family's rule that you say goodnight to the dog: convention, yes, even though its six people and nobody outside the house would notice if it died tomorrow.
  - wearing clothes in public: NOT a convention, despite the mutual expectations and despite nothing being natural about it. Reason: there's no alternative the population could actually switch to short of coercion, so it isn't arbitrary in the right way.
  - which end of the loaf she cuts first: NOT a convention, because nobody expects anybody else to do it any particular way, its just habit that happens to line up.
  - a country decimalizing its currency by act of parliament: convention, and the fact that a legislature decreed it doesn't disqualify anything.
  - a department that officially mandated reply-all on every email: NOT a convention, because nobody did it. A decree without uptake is just paper.

  The new case I want to spring on her: a 40,000-person online forum for appliance repair. Over the last year, posters started appending one arbitrary token — a wrench emoji — to any post that's asking a question rather than reporting a fix. A rival token (a lightbulb) caught on for a couple months last spring and then died out on its own. Basically everyone does it, everyone expects everyone else to, and untagged posts get replies saying add the tag. Everyone agrees a tagged feed beats an untagged one and nobody cares which token gets used. Two complications: (i) it's 40,000 anonymous strangers, so it's hard to see how anyone knows that anyone knows that anyone knows anything here, and (ii) the ranking algorithm now buries untagged posts, so people tag mainly to get seen rather than because they want other people to tag. Also about 200 members have started refusing to tag on purpose as a protest against the mods, and the mods just proposed pinning the wrench emoji in the rules and auto-hiding anything untagged.

  So: what does she say — convention or not — and what about the ratification, does it make it more of a convention, less of one, or is it beside the point? Which rule is she actually running underneath all eight verdicts? I'm pretty confident there's at least one trimmed-down version of Lewis's conditions that fits every single one of her answers and still gives a different verdict on the forum; name that one plus any other candidates you can construct that also fit the whole record. Then give me your best guess at what she'll say and why you'd bet on it, and describe one further regularity I could put to her tomorrow that would force the rival rules apart. Tell me too if you think her record shows she's answering some question other than "is this a convention."

  American English please, and no reading list or citations — I own the book, I just want the reasoning.
reasoning: |-
  Okay, let me try to unpack this user's problem. They've been arguing with Priya about Lewis's convention theory and lost. Priya's dissertation chapter is on this, so she's clearly deeply knowledgeable. The user provided eight examples where Priya labeled things as convention or not, along with her reasons. Now they want to apply that logic to a new case about an online forum using wrench emojis to tag questions. 

  First, I need to understand Priya's underlying rules from those eight cases. Looking at her verdicts: driving side is convention, VHS/Betamax isn't, tipping isn't, saying goodnight to dog is, clothes aren't, bread-cutting isn't, decimalization is, and unenforced reply-all rule isn't. 

  Hmm... the common threads seem to be: (1) mutual preferences for coordination, (2) arbitrary alternatives, (3) actual behavioral regularity, and (4) common knowledge. But Priya seems strict about these. For example, she rejected VHS because preferences weren't aligned, and tipping because it's not coordination but individual incentives. 

  The wrench emoji case is interesting. It started organically, has a dead alternative (lightbulb), and everyone complies except some protesters. But there's a twist: the algorithm now buries untagged posts, so tagging is partly self-interested. Also, 40k anonymous users make common knowledge tricky. 

  I should formulate Priya's likely rule. Given her record, she probably requires: (A) Mutual coordination preference - everyone prefers everyone use same system; (B) Arbitrariness - at least one viable alternative existed; (C) Actual behavioral regularity; and (D) Common knowledge of expectations. 

  Applying this to the forum: (A) Seems met - everyone prefers tagged system. (B) Lightbulb was alternative. (C) Regularity exists despite protesters. (D) Common knowledge is the weak point with anonymity, but replies demanding tags suggest expectations are known. 

  The algorithm complicates things - if people tag for visibility not coordination, Priya might say it's not convention. The mods' proposal could make it more convention-like by formalizing it, but only if adopted. 

  The user wants a test case to distinguish theories. Maybe a situation where preferences align, alternatives exist, but no common knowledge - like a secret handshake in a large company where everyone assumes they're the only ones doing it. Priya would reject it as convention due to lack of mutual expectations. 

  I think Priya will call the wrench emoji a convention, despite anonymity, because the "add tag" replies create observable expectations. The algorithm might make her hesitate, but the organic adoption suggests coordination preference existed before algorithmic enforcement. The ratification would make it more convention-like if it codifies existing practice. 

  The user should ask Priya about a case like: workers in a huge office all start microwaving lunch at 12:30 because it's crowded earlier. No one discussed it, everyone prefers avoiding crowds, but each thinks they're alone in this. If Priya rejects this as convention due to no mutual expectations, it confirms her strict common knowledge requirement.
answer: |-
  Based on Priya's track record and reasoning, here's the breakdown for your forum case, her likely underlying rule, and how to test it:

  **Priya's Likely Verdict on the Forum:** **Convention.**  
  **Reasoning:**  
  1.  **Mutual Preference for Coordination:** Everyone prefers *a* tagging system over none ("everyone agrees a tagged feed beats an untagged one"). This aligns with her driving (order preferred) and decimalization (clarity preferred) cases, and contrasts with tipping (individuals prefer *not* to tip) and VHS/Betamax (losers preferred the alternative).
  2.  **Arbitrariness & Viable Alternatives:** The wrench emoji is arbitrary. The lightbulb's rise and fall proves a viable alternative existed and failed organically, satisfying the "could switch" criterion she used against clothing (no alternative) and for driving/decimalization. The lightbulb wasn't killed *only* by force (like a parliament decree *could* be, but wasn't in her example).
  3.  **Self-Sustaining via Expectations:** The regularity exists ("Basically everyone does it"), is expected ("everyone expects everyone else to"), and is enforced socially ("untagged posts get replies saying add the tag"). This mirrors driving and the dog rule (family expectations). The algorithmic penalty *reinforces* but didn't *originate* the regularity (it started organically), and social enforcement exists independently. This contrasts with the reply-all decree (no uptake) and her tipping analysis (sustained by shame/expectations, but crucially *not* a coordination preference).
  4.  **Common Knowledge (Anonymity):** While 40k anonymous users make *perfect* common knowledge hard, the *observable behavior* (widespread tagging, replies demanding tags, the lightbulb experiment) creates sufficient *mutual expectations* for coordination. Her dog rule (6 people) shows scale isn't the barrier; observability of conformity and enforcement is key. The protests and mod actions further demonstrate awareness of the norm.
  5.  **The Algorithm & Protests:** The ranking algo *supports* the regularity but doesn't negate the coordination preference that existed before it. People tag *both* for visibility (self-interest + algo) *and* because it's expected (convention). The ~200 protesters actively reject the convention, proving its existence as a social norm they are defying. Their existence doesn't destroy the convention; it highlights it.
  6.  **Mod Ratification:** Pinning the rule *codifies* the existing convention but doesn't *create* it. It makes the expectation explicit and adds algorithmic enforcement. This makes it *more robust* as a convention (like decimalization by parliament codifying a pre-existing need/desire for change), not less "conventional." A decree without uptake (reply-all) fails; this has massive pre-existing uptake.

  **Priya's Underlying Rule (Trimmed Lewis):**  
  A regularity R in a population P is a convention *if and only if*:  
  1.  **Coordination Preference:** Everyone in P prefers to conform to R *if* (almost) everyone else conforms, *and* there's a mutual preference for *some* uniform regularity over disorder in this domain.  
  2.  **Arbitrariness:** There exists at least one alternative regularity R' that could have served the coordination purpose *nearly as well*, and R persists *partly because* R' does not.  
  3.  **Expectations & Enforcement:** Conformity to R is based on the *mutual expectation* that others conform and the *preference for coordination itself* (not *solely* on independent incentives like avoiding algorithmic penalty or personal habit). Observable enforcement (like demanding tags) signals these expectations.  

  **Why this fits her 8 verdicts:**
  *   **Driving:** Fits (1,2,3).
  *   **VHS/Betamax:** Fails (1) - Losers strongly preferred R'. No mutual preference for *uniformity regardless of which*.
  *   **Tipping:** Fails (1,3) - Individuals prefer R' (they don't tip, others do). Sustained by shame/expectations, not mutual coordination preference.
  *   **Dog Rule:** Fits (1,2,3) - Small P, mutual preference for uniformity (family harmony?), arbitrary alternative exists (not saying goodnight), expectations enforced within P.
  *   **Clothing:** Fails (2) - No viable alternative uniform regularity (nudity isn't viable/socially possible).
  *   **Bread End:** Fails (3) - Habit, not mutual expectations. No enforcement. Fails (1) - No coordination problem being solved.
  *   **Decimalization:** Fits (1,2,3) - Mutual preference for uniformity/clarity, viable alternatives existed (old system, other bases), decree codified & enforced existing coordination need.
  *   **Reply-All Decree:** Fails (3) - No uptake, no expectations formed, no actual regularity.

  **Your Best Bet on Her Answer:**  
  You should bet **she calls it a convention.**  
  *   **Why:** It hits her core criteria perfectly: Strong mutual preference for *a* tag system (1), proven arbitrariness via the lightbulb (2), and the regularity is sustained by mutual expectations and enforcement (replies demanding tags), even if algorithmic effects now *also* incentivize it (3). The scale/anonymity likely don't trip her up because the behavior and enforcement are *observable* within the forum context. The ratification formalizes and reinforces the existing convention. The protests highlight the normativity of the rule.

  **Test Case to Force Rival Rules Apart:**  
  **The Scenario:** In a large national park, hikers *always* yield to uphill hikers on narrow trails. Everyone does it, expects others to do it, and appreciates the smooth flow. No signs or rules enforce it; it's purely customary. There *is* a viable alternative: yielding to downhill hikers (practiced in some regions). Hikers prefer *some* uniform rule over chaos or collisions, and they slightly prefer yielding uphill (it's easier for the ascending hiker to restart).  
  *   **Why it tests rules:**  
      *   **Priya's Likely Rule:** **Convention.** Fits (1) Mutual preference for uniformity, (2) Viable alternative exists, (3) Sustained by mutual expectations/preference (no external enforcement).
      *   **Alternative Rule (Stricter Common Knowledge):** If Priya requires *strong, explicit common knowledge* (knowing that others know that others know...), she *might* balk at a large, transient population like park hikers. Her forum verdict would reveal her threshold. If she accepts the hiking case (likely, similar scale/anonymity to forum), her rule relies on *observable regularity creating sufficient mutual expectations*, not perfect common knowledge.
      *   **Alternative Rule (No Independent Incentives):** If someone argued conventions *cannot* have *any* independent incentives (like the algo penalty in the forum or the physical ease in hiking), they might reject both. Priya's acceptance of driving (independent safety incentive!) and likely forum verdict show she accepts overlapping incentives as long as the coordination preference is primary.

  **Is She Answering a Different Question?**  
  Her record suggests she *is* focused squarely on "Is this a Lewisian convention?", but she's applying a **stricter interpretation** centered on **mutual coordination preference and arbitrariness.** She rigorously filters out cases sustained *primarily* by independent incentives (tipping, clothing), pure habit (bread), or lacking viable alternatives (clothing, VHS if your camp loses). She prioritizes the *reason for conformity* (coordination preference) over the *mechanism of spread* (organic vs decree). Her answers demonstrate a consistent, narrow application of Lewis's core ideas about solving coordination problems.
