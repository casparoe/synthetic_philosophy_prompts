  ### Decision Procedure for Setting the Annual Volunteer Ask

  **Purpose**: To determine a fair and sustainable volunteer request ("ask") that balances shelter needs against volunteer capacity, ensuring the network's longevity while maximizing beds filled.

  ---

  #### Inputs (Gathered Each September)
  1. **Beds Committed (B)**: Total bed-nights for the season (e.g., 38 beds/night × 105 nights = 3,990 bed-nights).  
  2. **Volunteer Shifts Needed (V)**: Total volunteer shifts required. Calculated as:  
     - Shifts = (Beds per night) × (Nights) × (Volunteers per night)  
     - Example: 38 × 105 × 5 = 525 shifts (4 overnight + 1 driver per night).  
  3. **Membership Count (M)**: Total active volunteers (e.g., 420).  
  4. **Capacity Data**: Self-reported constraints from members (e.g., "can do 2 shifts," "medical skills," "caregiving duties").  
  5. **Compliance History**:  
     - Last year’s shifts covered by the core (e.g., 61 people covered 94% of shifts).  
     - Attrition: Number of members who quit after last year’s ask (e.g., 10 left).  
  6. **Core Group Size (C)**: Number of highly reliable volunteers (e.g., 61).

  ---

  #### Outputs
  - **Standing Ask**: Base shifts requested per member (e.g., "5 shifts").  
  - **Differentiated Ask**: Adjusted asks for members with constraints or special skills.  
  - **Ceiling**: Maximum sustainable ask per core member. If shifts exceed this ceiling, reduce beds (not raise asks).  

  ---

  ### Step-by-Step Procedure  
  *Value judgments marked with ⚖️. Committee decisions with no procedure marked with [CHOICE].*

  1. **Calculate Minimum Volunteer Pool (Sustainability Check)**  
     - Input: `V` (total shifts needed), `C` (core size), attrition rate.  
     - **Action**:  
       - Set the **ceiling (L)** = Maximum shifts/core member without causing burnout.  
         - *Default*: `L = (Last year’s avg. core shifts) × (1 – Attrition rate/100)`.  
         - *Example*: If core avg. was 8.6 shifts and 10% quit, `L = 8.6 × 0.9 ≈ 7.7` → **Round to 8**. [⚖️]  
       - Calculate **minimum volunteers needed (N)**: `N = V / L`.  
         - *Example*: `525 / 8 = 65.6` → **Round up to 66**.  
     - **Output**: `L` (ceiling), `N` (min. volunteers needed).  
     - **Rule**: If `N > M` (e.g., 66 > 420? No), reduce beds until `N ≤ M`.  

  2. **Set Base Ask (Fair Share)**  
     - Input: `V`, `M`, `N`.  
     - **Action**:  
       - **Base ask (A) = `V / M`** (full-compliance ideal).  
         - *Example*: `525 / 420 ≈ 1.25 shifts`.  
       - **Adjusted base ask (A_adj) = `V / N`** (core-reliance reality).  
         - *Example*: `525 / 66 ≈ 8 shifts`. [⚖️]  
       - Choose `A_adj` if attrition > 5% or core covered >80% of shifts last year. Else, choose `A`.  
     - **Output**: `A_adj` (e.g., "8 shifts") as the standing ask for high-capacity members.  

  3. **Differentiate by Capacity**  
     - Input: Capacity data, `A_adj`.  
     - **Action**: Categorize members:  
       - **High capacity**: No constraints → Ask = `A_adj` (e.g., 8 shifts).  
       - **Medium capacity**: Limited flexibility (e.g., job constraints) → Ask = `0.5 × A_adj` (e.g., 4 shifts).  
       - **Low capacity**: Severe constraints (e.g., "2 hours/month") → Ask = `0` shifts.  
       - **Special skills (e.g., nurse)**: Same as high capacity. Do **not** assign extra shifts. [⚖️]  
         - *Reasoning*: Competence is not penalized; skills are utilized within base ask. Extra work is voluntary only.  
     - **Output**: Tiered asks for each member.  

  4. **Handle Non-Compliance**  
     - **Action**:  
       - Compute asks against **observed compliance** (core group), not full participation.  
       - **Reasoning for members**:  
         - To the 61: "We ask 8 shifts because you’ve shown this is feasible. We’ll recruit more volunteers to share the load."  
         - To all: "If everyone gave 1 shift, we’d meet our goal. But we assign fairly based on capacity."  

  5. **Record the "Cannot" Member**  
     - **Action**:  
       - Member with adult son (2 hours/month) → **Ask = 0 shifts**.  
       - **Record as "meeting share"** (her capacity is near-zero).  
       - *Purpose*: Acknowledge effort, retain engagement, and accurately forecast capacity.  

  6. **Demanding vs. Expecting**  
     - **Action**: If a member *could* do more than asked (e.g., retiree with free time):  
       - **Hold this privately**. Do not publish or demand.  
       - *Why*: Avoid guilt-driven attrition; sustainability trumps moral claims.  

  7. **Reply to "Supererogatory" Objection**  
     - **Action**:  
       - **Absorb the objection**. Reply: "This isn’t about morality. We’re asking you to help us prevent suffering. Give what you can; we’re grateful for any help."  
       - *Why*: The ask is practical, not philosophical. Answer is the same regardless of how many object.  

  8. **Final Checks**  
     - **Action**:  
       - Ensure total shifts from asks ≥ `V`. If not, increase recruitment or reduce beds.  
       - Publish asks, tiers, and ceiling (`L`) to all members.  

  ---

  ### Run the Procedure: Three Cases  
  *Value judgments in **bold**.*

  #### Case A: Ordinary September  
  - **Inputs**: `V=525`, `M=420`, `C=61`, attrition=10%, nurse (high capacity).  
  - **Steps**:  
    1. `L = 8.6 × (1-0.1) ≈ 7.7` → **Ceiling `L=8`** ⚖️. `N = 525 / 8 ≈ 66`.  
    2. Attrition >5% → **Base ask `A_adj=8`** ⚖️.  
    3. Nurse → **8 shifts** (high capacity). Caregiver → **0 shifts** (low capacity).  
    4. Total shifts if 66 high-capacity comply: 66 × 8 = 528 > 525 → **Feasible**.  
  - **Output**: Ask = 8 shifts (high), 4 (medium), 0 (low). Ceiling = 8.  

  #### Case B: January Emergency (Cold Snap)  
  - **Inputs**: 9 nights × 76 beds × 5 volunteers = 3,420 shifts. Only 40 reachable; core at ceiling (8 shifts).  
  - **Procedure Limit**: No pre-set rule for emergencies. Ad hoc steps:  
    1. Calculate emergency shifts: **3,420 – (pre-covered shifts)**. [CHOICE]  
    2. **Ask the 40 reachable members for 1 extra shift** (even if above ceiling).  
    3. If shifts still short, **reduce beds** (e.g., shelter 60 instead of 76).  
  - **Hard Conclusion**: If only 40 shifts secured, **turn away 32 people/night** (76 – 44 beds covered).  

  #### Case C: Proposal for 60 Extra Beds  
  - **Inputs**: New `V=525 + 840 = 1,365` shifts (60 beds × 105 nights × 5). Staff covers 38 shifts. Net `V=1,327`.  
  - **Steps**:  
    1. `L=8` (unchanged). `N=1,327 / 8 ≈ 166`.  
    2. `N=166 < M=420` → **No bed reduction**.  
    3. But last year’s core=61 → **Risk if only 61 comply**: 1,327 / 61 ≈ 22 shifts/core (>> ceiling 8).  
  - **Conclusion**: **Reject contract**. Even with staff, the burden on the core is unsustainable. ⚖️  

  ---

  ### What the Procedure Cannot Do  
  1. **False Precision**:  
     - Steps 1–3 appear mathematical but rely on ⚖️ judgments (e.g., setting `L`, tiers). A biased committee can manipulate inputs to justify lower/higher asks.  

  2. **Unresolved Conflicts**:  
     - Members may contest capacity tiers ("Why am I ‘high’?") or `L` ("8 shifts is too high!"). The procedure cannot reconcile these; it requires committee discretion.  

  3. **Moral Demandingness Lost in Translation**:  
     - The procedure ignores whether the ask is *morally required*. It treats volunteers as a resource (e.g., "retain nurses to maximize beds"), whereas ethics asks, "What should a person sacrifice?" This gap means:  
       - Members who view the ask as supererogatory may still opt out.  
       - The committee cannot answer, "Why *should* I do 8 shifts?" beyond practicality.  

  4. **Emergencies and Long-Term Justice**:  
     - Case B forces ad hoc choices; Case C prioritizes network survival over potential beds. The procedure cannot resolve whether this is fair to homeless individuals.  

  5. **No Verdict On**:  
     - Whether a member *should* give more than asked (Step 6).  
     - How to handle members who reject the ask’s fairness (Step 7).  

  ---  
  **Final Note**: This procedure prioritizes sustainability over moral ideals. It is a tool for organizational survival, not ethical philosophy. Use it to make asks transparent, defensible, and survivable—but acknowledge its limits when engaging volunteers.
