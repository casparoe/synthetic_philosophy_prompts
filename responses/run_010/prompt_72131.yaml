  ## MEMORANDUM: MIDSUMMER PROCESSION HISTORICAL ACCURACY & FUNDING

  **TO:** Board Members, Heritage Trust  
  **FROM:** [Your Name], Board Member  
  **DATE:** 25 October 2023  
  **SUBJECT:** Approach to Provenance Findings for Midsummer Procession & Implications for Funding Policy  
  **MEETING:** Thursday, 26 October 2023  

  **I. The Situation:**  
  Our archiving project has revealed compelling evidence that the Midsummer Lamplight Procession originated in 1927 via the Chamber of Commerce, incorporating motifs from a defunct harvest custom. The claimed 1812 origin stems from a likely planted newspaper article. The researcher recommends correcting public materials. The volunteer committee raises valid concerns: potential competitive disadvantage for regional tourism funding versus a neighbouring town, and the procession's profound contemporary role in fostering community identity ("the one week a year when the place actually feels like a town").

  **II. Core Challenges & Considerations:**  
  1.  **Trust Deed:** Mandates support for customs of "demonstrable historic continuity."  
  2.  **Precedent:** Three other funded activities face similar provenance questions; this decision sets a critical pattern.  
  3.  **Community Value:** The procession's *current* social and cultural significance is undeniable and separate from its origin story.  
  4.  **Public Trust:** As a funded public body, knowingly perpetuating a demonstrably false historical claim using public/trust funds carries significant ethical and reputational risk. *This is fundamentally different from a community telling itself a flattering legend.* Our official stance and funding carry institutional weight and accountability.  
  5.  **Tourism & Competition:** Authenticity is increasingly valued by tourists. A correction, handled strategically, can demonstrate integrity, potentially *enhancing* our reputation versus a competitor relying on uncorroborated claims. Discovery of a deliberate cover-up later would be far more damaging.

  **III. Recommended Position: Fund with Corrected Materials & Reframed Narrative**  
  We should continue funding the procession, but immediately update *all* trust materials (brochures, website, grants) to reflect the accurate 1927 origin. This position balances legal/ethical obligations with recognition of the event's genuine contemporary value.

  *   **Why Not "Keep Funding Unchanged"?**  
      Violates our deed's "demonstrable" requirement and public trust obligations. Risks severe reputational damage if exposed externally and undermines our credibility regarding other projects. Perpetuates a known falsehood.
  *   **Why Not "Withdraw Funding"?**  
      Ignores the event's significant *current* community value and social function, which aligns with broader heritage goals of fostering place identity. Punishes volunteers and the community for a historical fabrication they didn't create. Disproportionate.
  *   **The Reframe:** This isn't just "correcting a date." It's embracing the procession's *true* heritage as a vibrant **20th-century community tradition born in the interwar period**. Its endurance for nearly 100 years *is* "demonstrable historic continuity" and worthy of celebration. The borrowed motifs show adaptation, not invention from whole cloth.

  **IV. Addressing Volunteer Committee Concerns:**  
  1.  **Competition & Tourism:**  
      *   **Honesty as Strength:** Position the correction as a commitment to authentic heritage. "Our traditions are strong enough to stand on their real history."
      *   **Narrative Shift:** Emphasize the *100-year story* (1927-2027 is soon!) – a tradition created *by* the town *for* the town during challenging times, sustained by generations. This is compelling.
      *   **Mitigate Risk:** Work *with* volunteers on messaging. Highlight the event's atmosphere and community spirit (which are real) over ancient origins. Target marketing towards experiential, not just historical, tourism.
  2.  **Community Spirit:**  
      *   Acknowledge this is paramount. The correction *does not diminish* the experience people cherish. The lamps, the gathering, the shared moment – these remain unchanged.
      *   Encourage volunteers to own the *real* story: "For nearly a century, our community has come together to light up Midsummer..." This fosters pride in *their* ongoing achievement.

  **V. Framework for Addressing Other Provenance Questions (Policy Pattern):**  
  We need a consistent, principled approach for the other three cases, moving beyond gut feel. I propose a **Provenance Assessment Framework** for any funded activity with disputed history:

  1.  **Establish Documented Origin:** Task researchers (like our grad student) to determine the earliest *verifiable* evidence of the custom *as practiced today*. (e.g., 1927 for the procession).
  2.  **Assess Current Cultural Significance & Function:** Evaluate the activity's *present-day* role:
      *   Community participation & sentiment.
      *   Social cohesion impact.
      *   Contribution to local identity.
      *   Tourism/Economic impact.
  3.  **Evaluate Alignment with Deed:** Does the *verifiable* duration (e.g., 96 years for the procession) constitute "historic continuity"? (Generally, post-Victorian/20th-century origins are widely accepted as "historic" in heritage contexts). Does its current function align with our mission beyond just age?
  4.  **Analyze Risk & Opportunity:**
      *   *Risk of Perpetuating Falsehood:* Likelihood and impact of exposure? Public trust implications?
      *   *Risk of Discontinuation:* Impact on community if funding ceased?
      *   *Opportunity for Reframing:* Can the *true* history be presented as compelling and valuable?
  5.  **Decision Matrix:**
      *   **Fund + Correct & Reframe:** (Recommended for Procession) Verifiable origin exists (even if recent), significant current value, high risk of reputational damage from falsehood, reframing feasible.
      *   **Fund + Neutral Wording:** If origin is genuinely ambiguous/unknowable *but* strong current significance exists. Avoid false claims; focus on the contemporary tradition.
      *   **Conditional Funding (Require Research/Review):** For high-value activities with the *most* serious, unresolved doubts.
      *   **Withdraw Funding:** Only if origin is verifiably fraudulent *and* current significance is minimal, *or* if no "continuity" of the *current* practice can be demonstrated at all.

  **VI. Path Forward for Thursday:**  
  1.  **Recommend Approval:** To continue funding the Midsummer Procession contingent on immediate correction of all Trust materials to reflect the 1927 origin.  
  2.  **Recommend Adoption:** Of the **Provenance Assessment Framework** (Section V) as standard policy for evaluating all current and future funded activities with historical claims, starting with the three other cases.  
  3.  **Engage Volunteers:** Propose a joint working session (Board reps + Volunteers) to develop the new, authentic narrative and messaging strategy for the procession, emphasizing its 20th-century roots and enduring community spirit.  

  **Let's lead with integrity.** We can honour the *real* history of our town's traditions while fully supporting the profound community value they hold today. Authenticity strengthens our credibility and ensures our funding decisions are defensible, sustainable, and truly serve the town's heritage – past *and* present.  

  **Attached:** Draft Provenance Assessment Framework (One-Page Summary).  
  **Available for Discussion:** Talking Points for Volunteer Committee Engagement.  

  [Your Name]
