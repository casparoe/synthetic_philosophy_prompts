prompt: |-
  I sit on the board of a small heritage trust in a market town, and we fund the midsummer lamplight procession that all our brochures say has run every year since 1812. A grad student we hired for an archiving project has just shown that it was actually started in 1927 by the chamber of commerce, lifting a couple of motifs from an unrelated harvest custom that had already died out, and that the 1812 date traces back to a newspaper item that looks like it was planted by the same people. She wants the wording corrected. The volunteer committee says correcting it hands the story to the neighbouring town, which is bidding for the same regional tourism pot, and anyway the procession is the one week a year when the place actually feels like a town to the people who live here — how it started isnt what they turn out for.

  Two complications: our deed commits us to supporting customs of "demonstrable historic continuity," and three other things we fund have provenance questions that will surface the moment this one does, so whatever we decide here sets the pattern.

  Draft the memo I'll circulate before Thursday's meeting. Take a position — keep funding unchanged, fund with corrected materials, withdraw, or an option I havent listed — and give the board something they could actually use on the other three cases that isn't just gut feel. And deal honestly with the volunteers: is a public body spending money on a story it now knows to be false a different kind of problem from a town telling itself a flattering legend?
reasoning: |-
  Okay, let me start by understanding the user's situation. They're on the board of a heritage trust in a market town. The issue is about the midsummer lamplight procession that's been promoted as running since 1812, but a grad student found evidence it actually started in 1927. The volunteers are worried that correcting the history could hurt tourism and community spirit. Plus, there are three other funded customs with similar provenance issues, so whatever decision they make here will set a precedent.

  First, I need to consider the stakeholders involved. The board members, volunteers, the community, and even the neighboring town competing for funds. The volunteers' main concern is that the procession is a key event that brings the town together. Correcting the date might seem like a small historical detail, but to them, it's about identity and tourism revenue. The trust's deed requires supporting customs with "demonstrable historic continuity," which complicates things legally and ethically.

  Then there's the grad student's findings. The 1812 date comes from a planted newspaper article, and the procession borrowed motifs from an older harvest custom. The trust now has proof that the origin story is fabricated. But the volunteers argue that the community's emotional connection isn't tied to the date's accuracy. They feel the event's current significance outweighs its historical inaccuracy.

  The user mentioned three other funded projects with questionable provenance. If they correct this one, it could open a can of worms. The board needs a consistent approach. They can't just rely on gut feeling; they need a policy that addresses all cases fairly.

  Ethically, there's a difference between a community telling itself a legend and a public body funding something known to be false. The trust is a public entity, so misusing funds based on false information could lead to accountability issues. But the community aspect is vital. The procession creates a sense of belonging, which is intangible but valuable.

  Options: Keep funding unchanged, which is risky legally and ethically. Fund with corrected materials, which addresses transparency but might affect tourism. Withdraw funding, which could damage community trust. Or find a middle ground. Maybe reframe the event's significance? Focus on its 1927 origins as part of the town's interwar heritage, which could still have historical value. Emphasize the community tradition over ancient roots.

  The memo needs to take a position. I think funding with corrected materials is the best approach. It maintains support for the event while being honest. Propose a provenance review policy for the other cases. This includes assessing when the tradition actually started, its cultural impact, and risks of discontinuation. For the volunteers, acknowledge their concerns but explain that authenticity strengthens long-term credibility. A public body has a duty to be truthful, even if the community's legend is endearing.

  Also, consider the neighboring town's competition. If the trust is caught in a lie, it could harm their reputation more than a corrected date. Transparency might even enhance their standing as responsible custodians of heritage. The memo should address this by highlighting that integrity can be a competitive advantage.

  Finally, the policy framework for other cases should have clear criteria: documented origin, cultural significance, community role, and risks. This provides a structured way to evaluate each custom, not just gut feeling. For the volunteers, stress that their work is valued, but accuracy ensures the trust's credibility and sustains funding legitimacy.
