answer: |-
  ### Activity Design: The Evidence Disparity Challenge

  #### **Objective**  
  To immerse participants in a peer disagreement scenario where private evidence varies in quality, forcing them to confront the tension between equal weighting (conciliationism) and evidence-based weighting (steadfastness) without prior philosophical framing. The activity highlights why averaging can fail and how evidence quality must inform resolution.

  ---

  #### **Materials**  
  - **Paper & pens** (for private estimates and note-taking).  
  - **Standard deck of playing cards** (for assigning evidence quality).  
  - **Two six-sided dice** (for generating shifted evidence).  
  - **Whiteboard** (to display initial estimates in Round 1 and record consensus).  
  - **Tokens** (e.g., poker chips; 20 tokens total for group scoring).  

  ---

  #### **Rules**  
  1. **True Value**: The facilitator selects a hidden integer between 1 and 100 (e.g., 50).  
  2. **Evidence Assignment**:  
     - Each participant draws one card from a shuffled deck. **Suits determine evidence quality**:  
       - **Hearts (High)**: Narrow range (true value ± 2).  
       - **Diamonds (Medium)**: Moderate range (true value ± 10).  
       - **Clubs (Low)**: Wide range (true value ± 20).  
       - **Spades (Very Low/Noisy)**: Biased range (shifted by facilitator: true value to true value +30 *or* true value -30).  
     - Participants receive a paper stating their range (e.g., "True value is between 48–52").  
  3. **Private Estimates**: Each writes a point estimate *within* their range (e.g., for 48–52, they might choose 50).  
  4. **Discussion Rules**:  
     - Participants may describe their evidence (e.g., "My range is narrow/wide") but *not* show their paper.  
     - No revealing card suits.  
  5. **Consensus**: The group must agree on a single integer estimate.  
  6. **Scoring**:  
     - **Group Tokens**: Awarded based on consensus accuracy (absolute error from true value):  
       - ≤2: 5 tokens | ≤5: 4 tokens | ≤10: 3 tokens | ≤20: 2 tokens | >20: 0 tokens.  
     - **Individual Tokens**: Most persuasive advocate (peer-voted post-activity; 1 token per voter).  

  ---

  #### **Timeline (90 Minutes)**  

  | **Time** | **Phase**                     | **Actions**                                                                                                                                 |  
  |----------|-------------------------------|---------------------------------------------------------------------------------------------------------------------------------------------|  
  | 0–10 mins | **Introduction**              | Explain rules, emphasise privacy of evidence. Announce: *"Your goal is a consensus close to my hidden number."*                            |  
  | 10–20 mins | **Round 1: Evidence Distribution** | Distribute cards. Participants write ranges/estimates privately.                                                                              |  
  | 20–22 mins | **Round 1: Estimate Display** | Facilitator writes all initial estimates (anonymised) on whiteboard (e.g., "Participant 1: 47, Participant 2: 62...").                       |  
  | 22–42 mins | **Round 1: Group Discussion** | Participants debate, share evidence quality verbally. Steer toward consensus.                                                                |  
  | 42–47 mins | **Round 1: Consensus**        | Group agrees on one number. Facilitator records it.                                                                                         |  
  | 47–52 mins | **Round 2: Setup**            | **New true value** (e.g., 70). Redistribute cards (reshuffled deck). Participants write private estimates.                                   |  
  | 52–54 mins | **Round 2: Disagreement Alert** | **Critical twist**: Facilitator states: *"There is significant disagreement—estimates vary widely—but you cannot see them. Resolve it."*      |  
  | 54–74 mins | **Round 2: Group Discussion** | Participants discuss without seeing estimates. Focus shifts to evidence quality.                                                             |  
  | 74–79 mins | **Round 2: Consensus**        | Group agrees on one number.                                                                                                                 |  
  | 79–90 mins | **Debrief**                   | Reveal true values, evidence distribution, and token scores. Discuss philosophical implications (detailed below).                          |  

  ---

  #### **Debrief (11 Minutes)**  
  **Map Activity to Philosophy**:  
  - **Round 1 Display (Averaging Temptation)**:  
    - *What happened*: Seeing estimates (e.g., 47, 62) may prompt averaging.  
    - *Philosophical link*: This mirrors **conciliationism**—equal weight to all opinions.  
    - *Problem*: Averaging fails with unequal evidence (e.g., a "shifted" Spade estimate drags consensus away from truth).  
      > *"Averaging treats a noisy guess as equal to a precise measurement—clearly flawed here. Conciliationism risks this in real disputes."*  

  - **Round 2 (Hidden Estimates)**:  
    - *What happened*: Without estimates, discussion focuses on evidence quality (e.g., "My range is tight, so I’m confident").  
    - *Philosophical link*: Exposes **steadfastness**—holding firm if evidence is superior.  
    - *Why it matters*: Forces articulation of *why* one’s evidence merits weight.  
      > *"You couldn’t blindly defer; you had to argue evidence quality. Steadfastness demands this—not stubbornness, but justified confidence."*  

  **Key Philosophical Tensions**:  
  1. **Steadfastness’s Burden**:  
     - A "stubborn" participant with *poor* evidence (e.g., Spades) is wrong by accident.  
     - *Solution*: Steadfastness requires *articulating why evidence is better* (e.g., "My range is narrower, so I resist compromise").  
       > *"Without justifying evidence quality, steadfastness is dogmatism. You must offer reasons."*  

  2. **Conciliationism’s Debt**:  
     - It "owes" participants with high-quality evidence by ensuring their input isn’t drowned by noise.  
     - *Solution*: Conciliationism must incorporate *evidence assessment* (e.g., weighting narrow ranges more).  
       > *"Pure conciliationism ignored your lab’s principle: better instruments yield better data. It must account for evidence hierarchies."*  

  **Round 2’s Purpose**:  
  - *Exposes*: Real-world disagreements often lack visible estimates. We only know "others disagree," forcing us to engage with *why* (evidence) rather than *what* (positions).  
    > *"In science, you see conflicting conclusions, not raw data. This round simulated that—you had to probe the ‘why’."*  

  ---

  #### **Candid Notes**  
  **Unreplicable Philosophical Element**:  
  > *"The exercise simplifies evidence into numerical ranges. Real philosophical/scientific disputes involve* **ambiguous evidence interpretation**—e.g., is a margin of error acceptable? Is a method reliable? You must supplement this by discussing a lab example: e.g., when your team disputed results due to instrument sensitivity vs. human error. Highlight how ‘evidence quality’ is often contested, not objective."*  

  **Likely Failure Points**:  
  1. **Shifted Evidence Frustration**:  
     - Participants with Spades (e.g., true value=50, range=20–50) may choose midpoints (35), pulling consensus away. If the group averages, they’ll fail.  
     - *Mitigation*: In debrief, stress how this mirrors real biases (e.g., a flawed instrument).  

  2. **Time Pressure in Consensus**:  
     - Scientists may over-debate; 20 minutes may feel rushed.  
     - *Mitigation*: Announce at 15 mins: *"Focus on a practical compromise—perfection isn’t the goal."*  

  3. **Dominant Personalities**:  
     - A vocal participant with *low*-quality evidence may sway the group.  
     - *Mitigation*: Use tokens to incentivise active listening (e.g., peer voting for "most persuasive").  

  --- 

  **Final Preparation**:  
  - Test ranges (ensure Spades shifts are extreme but plausible).  
  - Assign tokens arbitrarily (e.g., glass beads)—symbolic rewards suffice.  
  - Stress: *"This isn’t about winning—it’s about simulating disagreement under uncertainty."*  

  This design forces collision with the conciliationism/steadfastness rift through structured inequality, ensuring your group *experiences* the dilemma before labelling it.
