  **Activity Title: The Estimators' Dilemma**

  **Objective**: To explore how groups handle disagreement when the quality of private evidence varies.

  **Materials**:
  - A deck of playing cards (without jokers).
  - Paper and pens for each participant.
  - A whiteboard and markers.
  - Two six-sided dice (for the facilitator to use in generating shifted ranges, if needed, but we pre-prepared the evidence cards).

  **Preparation**:
  1. The facilitator chooses two true values (T1 and T2) between 1 and 100 (e.g., T1=50, T2=70).
  2. For each true value, prepare 14 evidence cards as follows:
     - 4 cards: Hearts - range [T-2, T+2]
     - 4 cards: Diamonds - range [T-10, T+10]
     - 4 cards: Clubs - range [T-20, T+20]
     - 2 cards: Spades - for each, flip a coin:
          - Heads: [T, T+30]
          - Tails: [T-30, T]
     Write the range on the card (e.g., "The true value is between 48 and 52").
  3. Shuffle the 14 evidence cards for T1 and put in a stack; similarly for T2.

  **Rules**:
  - Participants must be truthful about their evidence and estimates.
  - The goal is to form a group consensus estimate that is as close as possible to the true value.

  **Scoring** (tokens for the whole group):
  - Consensus error (absolute difference from true value) for each round:
     - 0-2: 5 tokens
     - 3-5: 4 tokens
     - 6-10: 3 tokens
     - 11-20: 2 tokens
     - 21-30: 1 token
     - Over 30: 0 tokens
  - The group accumulates tokens from both rounds.

  **Timeline** (90 minutes):

  1. **Introduction (10 mins)**:
     - Explain the activity: Each round, there is a true number (between 1 and 100) known only to the facilitator. Each participant receives a card with a range in which the true value lies. They must pick an initial estimate within that range and write it down.
     - The group will then discuss and come to a consensus estimate.
     - The group will be scored on how close the consensus is to the true value.

  2. **Round 1 (32 mins)**:
     - **Distribution (5 mins)**: Distribute the evidence cards for T1. Participants read their range and write their initial point estimate (any number within the range) on a slip of paper. They keep the card private but may share the range verbally in discussion.
     - **Display (2 mins)**: The facilitator collects the initial estimates and writes them on the whiteboard (without names).
     - **Group Discussion (20 mins)**: Participants discuss the evidence and estimates. They may share their ranges and reasoning. They aim to understand why estimates differ and what the true value might be.
     - **Consensus (5 mins)**: The group must agree on a single consensus estimate. The facilitator records it.

  3. **Round 2 (32 mins)**:
     - **Distribution (5 mins)**: Distribute evidence cards for T2. Participants write their initial estimate (kept private).
     - **Announce Disagreement (2 mins)**: The facilitator collects the initial estimates but does not display them. Instead, the facilitator announces: "There is disagreement among your initial estimates. They are not all the same. Now you must discuss and form a consensus without knowing what the individual estimates are."
     - **Group Discussion (20 mins)**: Participants discuss the evidence (they may share their ranges) and try to form a consensus.
     - **Consensus (5 mins)**: The group agrees on a single consensus estimate.

  4. **Debrief (16 mins)**:
     - Reveal T1 and T2, and the consensus errors for both rounds.
     - Reveal the evidence distribution for each round (how many of each quality).
     - Discuss:
          - How did the group handle the spread of estimates in Round 1? Did anyone suggest averaging? Why might that be a bad idea?
          - In Round 2, how did the group handle not seeing the estimates? Did they focus on the quality of the evidence (the ranges)?
     - Introduce conciliationism (averaging or splitting the difference) and steadfastness (sticking to one's guns when evidence is better). Note that in Round 1, averaging might have been pulled off by the shifted evidence. In Round 2, by sharing evidence quality, the group might have given more weight to narrow ranges.
     - Philosophical points:
          - What does the steadfast position owe? It requires that one can justify why one's evidence is better (e.g., "I have a narrow range, so I am more confident"). A stubborn participant without good evidence is not being reasonable.
          - What does the conciliationist owe the participant with better evidence? They must account for the fact that better evidence should be given more weight. But without knowing the evidence quality, conciliationism by averaging fails.
     - The purpose of Round 2 (without seeing estimates) is to expose that in many real disagreements, we do not have access to others' precise beliefs but we can share our evidence. This may lead to a more nuanced discussion of evidence quality.

  **Candid Notes**:
  - **What the exercise cannot reproduce**: In genuine philosophical disagreement, the quality of evidence is often not objectively quantifiable. Participants may disagree about what counts as evidence or how to interpret it. You will need to supply this complexity in conversation by drawing parallels to scientific disputes where evidence might be ambiguous or theory-laden.
  - **What might go wrong**: 
     - The group might struggle to reach consensus within the time. Encourage them to aim for a decision.
     - The shifted evidence (Spades) might lead to large errors, which could frustrate participants. Emphasise that this is part of the learning experience about evidence quality.
     - Participants might not fully grasp the philosophical concepts. The debrief should be clear and use examples from the activity.

