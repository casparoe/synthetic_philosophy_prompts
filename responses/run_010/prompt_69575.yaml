  - The erasure POV: Dennett says we can't access pre-experiential edits, but the film shows Joel's perspective mid-erasure. This isn't a scientific lapse—it's the core metaphor. The "camera" is the multiple drafts in flux, not a literal theatre. 
  - Reverse chronology: It's neither purely Stalinesque (delayed reveal) nor Orwellian (retroactive edit). It's pedagogical—simulating how disjointed memories feel. The second viewing parallels Joel's fragmented recall. 
